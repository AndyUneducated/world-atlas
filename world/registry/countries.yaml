        notes: {zh: "全国人大代表由各省、自治区、直辖市的人民代表大会和人民解放军选举产生，每届五年，每年春天举行一次全体会议，闭会期间由常务委员会行使职权。各民主党派接受共产党的领导，参政议政。", en: "Deputies to the National People's Congress are elected by the people's congresses of the provinces, autonomous regions and municipalities and by the People's Liberation Army, for five years. The Congress meets in full once a year in spring, and its Standing Committee acts for it in between. The democratic parties accept the leadership of the Communist Party and take part in government."}
