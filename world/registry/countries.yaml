# Country registry, modelled on ISO 3166-1 (alpha-2 / alpha-3 / numeric).
# Codes are allocated by this atlas and are independent of any real-world registry.
countries:
  - id: country:CN
    subtype: country
    status: canon
    names:
      zh: 中华人民共和国
      en: People's Republic of China
    notes:
      zh: "中华人民共和国位于亚洲东部，是世界上人口最多的国家之一，首都北京。在这部地图集的世界里，中国在北海、北冰洋和几内亚湾拥有北维京岛、维京群岛、北冰洋领地和长夏群岛四块海外领地，这些领地都设有自己的议会和政府，与拉诺瓦岛隔着半个星球。\n在拉诺瓦岛，中国是最重要的贸易伙伴和投资者之一。中国企业在马哈维洛和瓦罗纳建设了集装箱码头，在阿瓦拉齐修建了铁路和电站，在萨马伊和贝洛瓦设立了银行和科技园区。中国在萨马伊设有大使馆，在其他多数国家设有领事馆或代表处，也是安巴罗国际委员会的成员。\n官方上，中国奉行不干涉内政的原则，与岛上大多数国家保持外交关系，并多次在安巴罗参与停火谈判。但据各方情报和媒体报道，中国在幕后向世俗协约提供低息贷款、港口建设和军事装备，阿瓦拉齐的岸防导弹、贝洛瓦的无人机和马哈维洛的港口设备都被认为与中国有关。中国政府否认与协约存在任何正式同盟关系，称其在岛上的活动「只是正常的经济合作」。\n中国与美国在拉诺瓦岛的竞争被观察者称为「岛上的冷战」：两国都不直接出兵，却通过援助、投资和武器影响着各个阵营的力量对比。中国的商人、工程师和留学生在岛上随处可见，萨马伊大学和马哈维洛的中文学校吸引着许多岛上的年轻人。"
      en: "The People's Republic of China is in eastern Asia, one of the most populous countries in the world, with its capital at Beijing. In this atlas's world China has four overseas territories in the North Sea, the Arctic Ocean and the Gulf of Guinea, North Viking Island, the Viking Islands, the Arctic Ocean Territory and the Everlong Summer Islands, each with its own parliament and government and half a planet away from Ranova. \nOn Ranova China is one of the most important trading partners and investors. Chinese companies have built container terminals in Mahavelo and Varona, railways and power stations in Avaratsy and banks and technology parks in Samay and Belova. China has an embassy in Samay and consulates or offices in most other states, and sits on the International Commission of Ambaro. \nOfficially China follows the principle of non-interference, keeps diplomatic relations with most states on the island and has taken part in ceasefire talks at Ambaro several times. But according to intelligence from several sides and press reports, it quietly provides the Secular Accord with cheap loans, port construction and military equipment; Avaratsy's coastal missiles, Belova's drones and Mahavelo's port equipment are all thought to have Chinese connections. The Chinese government denies any formal alliance with the Accord and calls its activities on the island 'ordinary economic co-operation'. \nObservers call the rivalry of China and the United States on Ranova 'the island's cold war': neither sends troops directly, but both shape the balance between the blocs through aid, investment and arms. Chinese traders, engineers and students are everywhere on the island, and the University of Samay and the Chinese schools of Mahavelo attract many young islanders."
    short_names:
      zh: 中国
      en: China
    flag: china
    flag_notes:
      zh: 五星红旗，长宽比 3:2。旗面的红色象征革命，旗上的五颗五角星及其相互关系象征中国共产党领导下的革命人民大团结：左上角的大星代表中国共产党，四颗小星呈弧形环拱于大星右侧，每颗小星都有一个尖角正对大星的中心。
      en: "The five-star red flag, at 3:2. Its red stands for revolution, and its five stars and the way they are set for the great unity of the revolutionary people under the leadership of the Communist Party of China: the large star in the upper hoist is the Party, and the four small stars arc around it to the fly, each with one point aimed at the large star's centre."
    codes:
      iso3166_1:
        alpha2: CN
        alpha3: CHN
        numeric: "156"
  - id: country:US
    subtype: country
    status: canon
    names:
      zh: 美利坚合众国
      en: United States of America
      es: Estados Unidos de América
    notes:
      zh: "美利坚合众国位于北美洲，是世界上最强大的国家之一，首都华盛顿。在这部地图集的世界里，美国在太平洋上拥有加利福尼亚自治州，这里是人工智能产业和少数富豪家族的聚集地，在拉诺瓦岛西北约一千五百公里的海上，是拉诺瓦的近邻。\n在拉诺瓦岛，美国是圣约同盟最重要的外部支持者。美国在安博哈拉设有大使馆，在努西拉、米拉卡和萨希利亚设有领事馆，美国的石油公司在努西拉开采近海油气，美国的农业公司收购萨希利亚的丁香和安博哈拉的咖啡，加利福尼亚的科技公司在贝洛瓦和萨马伊设有研发中心。美国也是安巴罗国际委员会的成员。\n官方上，美国称其政策是「支持民主、宗教自由和地区稳定」，并多次谴责齐马罗沃的强迫迁徙和贾巴利亚的恐怖袭击。但据各方情报和媒体报道，美国在幕后向圣约同盟提供武器、军事训练和情报，安博哈拉的战斗机和防空系统大多来自美国的盟友，美国的军事顾问也曾出现在萨希利亚的前线。美国政府否认与同盟存在正式的条约关系。\n美国与中国在拉诺瓦岛的竞争被称为「岛上的冷战」。两国都避免直接卷入战争，却在援助、投资和舆论上针锋相对。美国的大学奖学金、福音派教会和美国电影在岛上影响很大，安博哈拉和米拉卡的许多政治家都曾在美国留学。"
      en: "The United States of America is in North America, one of the most powerful countries in the world, with its capital at Washington. In this atlas's world it holds the California Autonomous State in the Pacific, home of the AI industry and a handful of very rich families, and Ranova's neighbour some 1,500 km to the north-west. \nOn Ranova the United States is the Covenant League's most important outside backer. It has an embassy in Ambohara and consulates in Nusira, Miraka and Sahiliya; American oil companies work the offshore fields of Nusira, American agribusiness buys Sahiliya's cloves and Ambohara's coffee, and Californian tech companies run research centres in Belova and Samay. It also sits on the International Commission of Ambaro. \nOfficially the United States describes its policy as 'support for democracy, religious freedom and regional stability' and has repeatedly condemned Tsimarovo's forced removals and Jabaliya's terrorist attacks. But according to intelligence from several sides and press reports, it quietly provides the Covenant League with arms, military training and intelligence; most of Ambohara's fighters and air defences come from America's allies, and American military advisers have been seen at the front in Sahiliya. The US government denies any formal treaty with the League. \nThe rivalry of the United States and China on Ranova is called 'the island's cold war'. Both avoid being drawn into the fighting directly but compete hard in aid, investment and public opinion. American university scholarships, evangelical churches and films have great influence on the island, and many politicians in Ambohara and Miraka studied in the United States."
    short_names:
      zh: 美国
      en: United States
    flag: usa
    flag_notes:
      zh: 星条旗，长宽比 19:10。十三道红白相间的横条代表建国时的十三个州，左上角蓝底上的五十颗白星代表今天的五十个州，每有新州加入就添一颗星。按常见的解释，白色象征纯洁，红色象征勇敢，蓝色象征警惕、坚韧和正义。
      en: "The Stars and Stripes, at 19:10. Its thirteen red and white stripes stand for the thirteen founding states, and the fifty white stars on the blue canton for the fifty states of today; a star is added whenever a state joins. By the usual reading, white stands for purity, red for valour, and blue for vigilance, perseverance and justice."
    codes:
      iso3166_1:
        alpha2: US
        alpha3: USA
        numeric: "840"
