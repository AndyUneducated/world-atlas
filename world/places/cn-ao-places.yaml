# Named places (buildings, landmarks, facilities) of the Arctic Ocean Territory.
# Same conventions as cn-nv-places.yaml; names are Chinese, English and Tavrunaq.
places:
  # ── 帕卢尔尼克金融特区（帕卢库特区）──
  - id: bld_d07900
    subtype: bank
    status: generated
    names:
      zh: 北冰洋公共银行总部大厦
      en: Arctic Ocean Public Bank Tower
      art-x-tavrunaq: Aqqimma Pallutuar
    wonder:
      zh: 号称世界上最自由的银行的总部，利润用于居民分红
      en: Head office of the bank that calls itself the freest in the world, its profits paid out to residents
    notes:
      zh: "北冰洋公共银行总部大厦是领地全资的北冰洋公共银行的总部，矗立在帕卢尔尼克金融特区帕卢库特区的中心，是特区天际线中央的塔楼，占地约 140 米见方。银行依《北冰洋公共银行法》设立，号称世界上最自由的银行，利润用于领地居民分红。大厦坐落在帕卢图阿尔大道上，大道两侧依次排着总部大厦和公共商业银行、公共投资银行、公共私人银行、公共托管银行四座附属银行大厦；清算所、金融法院、国际仲裁中心、公司注册处和数字资产交易所分布在周围，基里街从这里通往冻土黄金金库。塔夫鲁纳克语名 Aqqimma Pallutuar 里的 pallu 意为「财富」，Pallutuar 就是本地人对公共银行的称呼。\n金融特区是依《北冰洋公共银行法》和《金融特区法》在首府库马尔维克区以北新设的，面积 60 平方公里，约 18 万人，人均产值居领地各市之首。「最自由」指的是特区的做法：零税率、不设资本管制、线上即时开户、几分钟自动注册公司，世界各地的客户可以在这里存钱、结算和托管资产。公共银行再把赚到的利润交给领地，按人头分给每一位居民。财政部和它的监管司也设在特区，就在银行附近办公。北冰洋清算所兼作支付网络的控制中心，银行的跨境转账都经它结算；大厦旁的公共银行极地数据中心承担银行的账务和支付系统，余热被引进附近的穹顶，冬天穹顶下种着热带植物，帕卢尔尼克冬季花园和卡拉克穹顶是银行职员午休的去处。\n大厦和周围的塔楼一样立在桩基上，底层架空，让冷风从下面流过，不把冻土焐化；楼与楼之间靠架空暖廊和地下通道连成一体，全特区约 23 公里的暖廊让职员冬天穿着衬衫就能从银行走到法院。大厦底层的大厅对公众开放，居民可以在这里查到银行利润的去向和自己当年分到的红利，查询屏前常有老人带着孙子来，一笔一笔地看钱花到了哪里。职员多是外来的金融、法律和技术人员，首府人把很少走出暖廊和穹顶的他们叫作「穹顶人」。\n每逢主权基金发放红利那天，塔顶的灯会亮成金色，整个特区都看得见，交易所大厅里挂出大屏幕滚动显示每位居民分到的数额，金融从业者和来凑热闹的首府市民挤满大厅一起倒数。穹顶人之间流传着一个说法：来银行面试前学会一句塔夫鲁纳克语问候，被录用的机会会大一些。"
      en: "The Arctic Ocean Public Bank Tower is the headquarters of the territory's wholly owned Arctic Ocean Public Bank. It stands at the centre of Pallukut District in the Pallurniq Financial Zone, the tower in the middle of the zone's skyline, on a footprint of about 140 m square. The bank was set up under the Arctic Ocean Public Bank Act; it calls itself the freest bank in the world, and its profits are paid out to the territory's residents as a dividend. The tower stands on Pallutuar Avenue, lined in turn by the headquarters and the four towers of its subsidiary banks, the Public Commercial, Public Investment, Public Private and Public Custody banks; the clearing house, financial court, international arbitration centre, companies registry and digital asset exchange lie around it, and Kirri Street leads from here to the Permafrost Gold Vault. In its Tavrunaq name, Aqqimma Pallutuar, pallu means \"wealth\", and Pallutuar is what locals call the Public Bank.\nThe financial zone was newly created north of Qummarvik District in the capital under the Arctic Ocean Public Bank Act and the Financial Zone Act. It covers 60 km², has about 180,000 people and the highest output per head of any city-level division in the territory. \"Freest\" refers to how the zone works: a zero tax rate, no capital controls, accounts opened online in an instant and companies registered automatically in minutes, so clients from all over the world come here to deposit money, settle payments and hold assets in custody. The Public Bank then hands its profits to the territory, which shares them out to every resident per head. The Ministry of Finance and its Supervision Department also sit in the zone, close to the bank. The Arctic Ocean Clearing House doubles as the control centre of the payment network and settles the bank's cross-border transfers; the Public Bank Polar Data Centre nearby runs the bank's accounts and payment systems, and its waste heat is piped into the domes close by, where tropical plants grow in winter; the Pallurniq Winter Garden and the Kallaaq Dome are where the bank's staff spend their lunch breaks.\nLike the towers around it the building stands on piles, its ground floor raised so that cold air flows underneath and the permafrost is not warmed; the buildings are joined by raised warm corridors and underground passages, and the zone's 23 km or so of warm corridors let staff walk from the bank to the court in shirtsleeves in winter. The ground-floor hall is open to the public, where residents can see where the bank's profits go and what dividend they received that year, and old people often bring their grandchildren to the screens to go through, item by item, where the money went. Most staff are financial, legal and technical people from outside, and the capital calls them \"dome people\" because they seldom leave the warm corridors and domes.\nOn the day the sovereign fund pays its dividend, the top of the tower is lit gold for the whole zone to see, and a big screen in the exchange hall scrolls through what each resident is receiving while financiers and curious townspeople from the capital pack the hall to count down together. Among the dome people there is a saying that learning a Tavrunaq greeting before an interview at the bank improves your chances of being hired."
    in: div_ga9pxy
    offset_km: [0.1, 0.1]
    site: { layout: tower, size_m: [140, 140] }
