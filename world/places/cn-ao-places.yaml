    notes:
      zh: 中央政府常驻北冰洋领地巡视员办公室，位于库马尔维克区东北楼群，由中央政府派驻，负责对领地各级行政机关进行巡视监督。巡视员定期检查政务院各部、各市人民政府和公共企业的政策执行、财政资金使用和廉洁情况，北冰洋公共银行的利润分配和居民分红的发放是巡视的重点之一；去往北岸和苔原上的偏远聚落时，巡视员乘小型飞机，夏季也乘船前往。发现的问题同时报告中央政府和领地总理，并跟踪整改。办公室设有公众来访接待室，也接受网上举报，巡视报告的摘要定期公开。
      en: The Office of the Central Government Inspector in the Arctic Ocean Territory, in Qummarvik's north-east cluster, is sent by the central government to inspect and oversee the territory's administration at every level. Inspectors regularly check how the ministries, the city governments and public companies carry out policy, spend public money and keep their officials honest, and the share-out of the Arctic Ocean Public Bank's profits and the residents' dividend are a standing focus. To reach the north coast and the tundra settlements they fly in light aircraft or, in summer, go by boat. What they find goes to both the central government and the premier, and they follow it up. The office has a public reception room and takes reports online, and summaries of its reports are published.
    in: div_9s80v8
