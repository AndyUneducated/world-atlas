  - id: bld_f595fg
    subtype: vault
    status: generated
    names:
      zh: 冻土黄金金库
      en: Permafrost Gold Vault
      art-x-tavrunaq: Kirri Tuunnivik
    wonder:
      zh: 世界唯一深埋在冻土层下的黄金金库
      en: The only gold vault in the world buried deep in permafrost
    notes:
      zh: "冻土黄金金库是世界上唯一深埋在冻土层下的黄金金库，在帕卢尔尼克金融特区帕卢库特区，基里街从帕卢图阿尔大道的银行区通到它的门口。金库的主体深埋在冻土层下，地面上只有一座约 160 米长、120 米宽的出入大楼，存放北冰洋公共银行与客户的金条。塔夫鲁纳克语名 Kirri Tuunnivik 里的 kirri 意为「黄金」，基里街的名字也由此而来。金库靠冻土的天然低温常年保持在零下，不需要空调，也不怕停电。\n金库是金融特区建设时和公共银行总部一起规划的。特区不设资本管制、线上即时开户，世界各地的客户把资产交给特区的银行托管，其中一部分以金条的形式保存，公共托管银行负责记账与保管，清算所为金条的过户结算。把金库挖进冻土，是因为冻土本身就是一层又冷又硬的天然外壳：地下多年冻结的土层终年不化，库房不必制冷，湿度也低，金属和包装都不容易受潮；夏天地面解冻的只是表层一两米，再往下的冻土终年不化。外国客户愿意把金条存到这里，一是特区不设资本管制，进出自由，二是冻土让金库的运行成本很低，托管费也就便宜。出入大楼的底层架空，楼板和地下竖井做了隔热，免得楼里的暖气把下面的冻土焐化；从大楼到库房要乘电梯下到深处，再穿过一条长长的地下廊道，沿途是一道接一道的厚重库门。出入大楼外观朴素，墙面几乎不开窗，与帕卢图阿尔大道上的玻璃塔楼截然不同，楼里是安检大厅、提取间和值守人员的休息室。\n金条按托管人分区存放，每一块都有编号，过户时金条本身多半不动，只在账上换一个主人，只有客户要求提走时，才由专人从库里取出，经暖廊送到托管银行。金库的值守人员轮班进出，下到库房前要换上厚衣服，在零下的环境里工作时间有严格的限制，上来以后要先在暖间里待一会儿。\n金库定期开放参观，游客要换上厚棉衣，穿过零下的地下长廊，才能隔着玻璃看见成排的金条。讲解员总爱让大家停下来呵一口气，看白雾在灯下慢慢散开，说这里「连呼吸都冻得住，金子更跑不了」。特区的人常开玩笑说，金库最好的保安不是门锁，而是冻土：想偷金子的人还没走到库门口，手指就先冻僵了。参观结束时，每位游客能领到一枚印着金库大门的纪念币，不是金的。也有新婚夫妇专门来参观，在成排的金条前合影，说是沾一点「冻不坏的福气」。"
      en: "The Permafrost Gold Vault is the only gold vault in the world buried deep in permafrost. It lies in Pallukut District of the Pallurniq Financial Zone, and Kirri Street runs to its door from the banking quarter on Pallutuar Avenue. The vault itself lies deep in the permafrost, and only an entrance building, about 160 m long and 120 m wide, shows above ground; it holds the gold bars of the Arctic Ocean Public Bank and its clients. In its Tavrunaq name, Kirri Tuunnivik, kirri means \"gold\", which is also where Kirri Street gets its name. The permafrost's natural cold keeps the vault below freezing all year round, with no air conditioning needed and nothing to fear from a power cut.\nThe vault was planned together with the Public Bank headquarters when the financial zone was built. The zone has no capital controls and opens accounts online in an instant, so clients from around the world entrust their assets to its banks, and part of them is held as gold bars; the Public Custody Bank keeps the records and the bullion, and the clearing house settles transfers of the gold. The vault was dug into the permafrost because the frozen ground is itself a cold, hard natural shell: the ground, frozen for many years, never thaws, so the stores need no refrigeration, the air is dry and neither metal nor packaging takes damp; in summer only the top metre or two of ground thaws, and the permafrost below never does. Foreign clients are glad to keep their gold here, first because the zone has no capital controls and money moves freely, and second because the permafrost makes the vault very cheap to run, so its custody fees are low. The entrance building's ground floor is raised and its floors and shafts are insulated so that the heating in the building does not warm the permafrost below. From the building a lift goes down deep, followed by a long underground passage through one heavy vault door after another. The entrance building is plain, with almost no windows, quite unlike the glass towers on Pallutuar Avenue, and inside are a security hall, a withdrawal room and a rest room for the guards.\nThe bars are stored by custodian, each one numbered. When gold changes hands the bars themselves usually stay put and only the ledger records a new owner; only when a client asks to take gold away is it brought out by authorised staff and carried through the warm corridors to the custody bank. The vault's guards work in shifts, put on heavy clothes before going down to the stores, have strict limits on how long they may work in the sub-zero cold, and spend a while in a warm room when they come back up.\nThe vault opens to visitors from time to time; they put on padded coats and walk a sub-zero tunnel to see rows of gold bars behind glass. The guides like to have everyone stop and breathe out, watching the white mist fade slowly under the lights, and say that here \"even your breath freezes in place, so the gold certainly isn't going anywhere\". People in the zone joke that the vault's best guard is not its locks but the permafrost: anyone trying to steal the gold would have frozen fingers before reaching the vault door. At the end of the tour each visitor is given a token stamped with the vault door; it is not gold. Newly-weds come on purpose too, to be photographed in front of the rows of gold bars for a share of \"luck that never spoils in the frost\"."
    in: div_ga9pxy
    offset_km: [-0.2, -1.0]
    site: { layout: hall, size_m: [160, 120] }
