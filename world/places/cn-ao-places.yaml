      en: Ministry of Natural Resources and Environmental Protection
    notes:
      zh: 北冰洋领地政务院自然资源和环境保护部，位于库马尔维克区西面楼群，负责领地的土地、矿产、冰川和海洋的保护与利用。部内设政策司、自然生态保护司、大陆生态环境司、水生态环境司、海洋生态环境司、大气环境司、土壤生态环境司、固体废物和化学品司、环境影响评价和排放管理司、生态环境监测司和生态环境执法署，其中自然生态保护司单独建楼。环境影响评价和排放管理司审批矿山、数据中心和港口的建设，要求矿山闭矿后复垦苔原；生态环境监测司长期观测西尔米冰盖、冻土和内陆湖泊的变化，水生态环境司管理数据中心的冷却用水。
      en: The Ministry of Natural Resources and Environmental Protection of the Arctic Ocean Territory, in Qummarvik's west cluster, protects and manages the territory's land, minerals, ice and seas. Its departments are Policy, Nature Conservation, Land Ecology, Freshwater Ecology, Marine Ecology, Air Quality, Soil Ecology, Solid Waste and Chemicals, Environmental Impact and Emissions, and Environmental Monitoring, with an Environmental Enforcement Agency; Nature Conservation has its own building. The impact assessors approve mines, data centres and ports and require mines to restore the tundra when they close, Environmental Monitoring tracks the Sirmi Ice Cap, the permafrost and the inland lakes, and Freshwater Ecology regulates the water the data centres use for cooling.
    in: div_9s80v8
    offset_km: [-1.5, -0.05]
    site: { size_m: [150, 80], layout: slab }

  - id: bld_frqd47
    subtype: government
    status: generated
    names:
      zh: 北冰洋领地政务院自然资源和环境保护部自然生态保护司
      en: Nature Conservation Department, Ministry of Natural Resources and Environmental Protection, Arctic Ocean Territory Executive Council
    short_names:
      zh: 自然生态保护司
      en: Nature Conservation Department
    notes:
      zh: 北冰洋领地政务院自然资源和环境保护部自然生态保护司，在部大楼西面单独建楼。领地四成多的土地划为生态保护区和冰盖管理区，自然生态保护司负责它们的划定、巡护和管理：西尔米冰盖管理区、苔原上的驯鹿迁徙通道、海象和北极熊栖息的海岸都在它的名录上。保护区内的狩猎和放牧与塔夫鲁利特长老议事会共同管理，传统的狩猎权受到保障；司里有一支巡护员队伍，乘雪地车和小型飞机巡视保护区，并定期统计野生动物的数量。
      en: "The Nature Conservation Department of the Ministry of Natural Resources and Environmental Protection has its own building west of the ministry. More than 40 percent of the territory's land is set aside as nature reserves and ice cap management areas, and the department draws their boundaries, patrols them and runs them: the Sirmi Ice Cap management area, the reindeer migration routes across the tundra and the coasts where walrus and polar bears live are all on its lists. Hunting and herding inside the reserves are managed jointly with the Tavrulit Council of Elders, and traditional hunting rights are protected. Its rangers patrol the reserves by snowmobile and light aircraft and count the wildlife."
    in: div_9s80v8
