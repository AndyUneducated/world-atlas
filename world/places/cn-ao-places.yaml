  - id: poi_5j2f3m
    subtype: port
    status: generated
    names:
      zh: 乌维克努卡码头
      en: Uviqnuqa Quay
      art-x-tavrunaq: Uviqnuqa
    notes:
      zh: "乌维克努卡码头是乌维克萨克市唯一的港口，在乌维克萨克岛上的乌维克努卡区，运出稀土精矿，运进燃料和补给，码头占地约 700 米见方。全市第二产业占经济的四成多，码头的吞吐就是全市的脉搏。乌维克萨克在首府以东约 930 公里，全市都在乌库乌维特群岛上，有 15.5 万人，没有一条通往大陆的公路，对外只靠船只和乌维克萨克机场的航班，本地人说「我们的高速公路是航线和海路」。乌库乌维特露天矿在群岛南部的西卢奥库岛上，精矿运到这里装船外运；往来的船只经乌库卡拉湾进出，湾内风浪较小，补给船常在湾里等待进港的时机。城外的乌库马苏克海峡宽约 2 公里，是领地最窄的命名海峡，窄得两岸的人隔着水能互相喊话。\n补给船靠岸的日子在岛上像过节，超市门口排起长队抢购新鲜水果和牛奶，补给船经过海峡时，两岸的孩子会一起跑到岸边挥手。码头边的黑板上用粉笔写着潮汐和船期，风暴来时黑板上只写一个字：「等」。风暴一来，船和飞机都停，岛上的人就靠冻鱼、腌菜和自家烤的面包过日子；等风停了，码头上的吊车重新开动，全城的人一听声音就知道，日子又照常了。"
      en: "Uviqnuqa Quay is the only port of Uviqsaaq City, in Uviqnuqa District on Uviqsaaq Island, shipping out rare-earth concentrate and bringing in fuel and supplies, on a site some 700 m square. Industry makes up more than 40% of the city's economy, and the traffic over the quay is the town's pulse. Uviqsaaq lies some 930 km east of the capital, the whole city spread over the Ukkuuviit Islands, with 154,600 people and no road to the mainland; it reaches the outside world only by ship and by the flights of Uviqsaaq Airport, and locals say \"our expressways are the air routes and the sea lanes\". The Ukkuuviit Open Pit is on Silluaukku Island in the south of the group, and its concentrate is brought here to be shipped out; ships come and go through Ukkuqalla Bay, whose sheltered waters are where supply ships often wait for their chance to enter port. The Ukkumasuq Strait outside the town, about 2 km wide, is the narrowest named strait in the territory, so narrow that people on either side can shout to each other across the water.\nSupply-ship days are like holidays on the islands, with queues outside the supermarkets for fresh fruit and milk, and as the supply ship passes through the strait the children on both shores run down to wave. A blackboard on the quay gives the tides and sailings in chalk; when a storm comes it carries a single word: \"wait\". When a storm blows in, ships and planes both stop, and the islanders live on frozen fish, pickles and home-baked bread; when the wind drops and the quay cranes start up again, the whole town knows from the sound that life is back to normal."
    in: div_qj033v
    offset_km: [-1, 0]
    site: { size_m: [700, 700], layout: port }
  - id: poi_d9f8ge
    subtype: airport
    status: generated
    names:
      zh: 乌维克萨克机场
      en: Uviqsaaq Airport
      art-x-tavrunaq: Uviqsaaq Tirravik
    notes:
      zh: "乌维克萨克机场是乌库乌维特群岛上的机场，在乌维克萨克岛的乌维克努卡区，场区长约 2.6 公里，有航班飞往领地首府和西尔米瓦克。乌维克萨克在首府以东约 930 公里，全市 15.5 万人都住在群岛上，没有一条通往大陆的公路，对外只靠船只和这座机场，机场因此是全市最热闹的地方。乌库乌维特露天矿的矿工两周一轮换，乘飞机往返首府，起降的飞机上能清清楚楚看见矿坑一圈圈向下的台阶，像一只巨大的漏斗。唯一的港口乌维克努卡码头运出稀土精矿，补给船来得慢，急用的药品、零件和信件都靠航班送来。\n航班一到，接人的、取货的、来看热闹的把候机厅挤得满满当当，机场咖啡馆的黑板上写着当天航班和补给船的到港时间。风暴天停飞时，候机厅就成了全市打牌和聊天的地方，咖啡馆照常营业，常有人一下午输掉一整周的咖啡钱。矿工轮换的日子，候机厅里一边是刚下飞机、背着行李的新一班，一边是满脸风霜、等着回家的上一班，两拨人在门口擦肩而过，互相拍一下肩膀就算交了班。岛上的孩子放学后也爱来机场看飞机，矿上运出来的「彩色石头」常被他们装在口袋里，送给刚下飞机的客人。"
      en: "Uviqsaaq Airport is the airport of the Ukkuuviit Islands, in Uviqnuqa District on Uviqsaaq Island, on a site about 2.6 km long, with flights to the territory's capital and to Sirmivak. Uviqsaaq lies some 930 km east of the capital, all 154,600 of its people living on the islands, with no road to the mainland; it reaches the outside world only by ship and through this airport, which is therefore the liveliest place in town. Miners at the Ukkuuviit Open Pit rotate every two weeks and fly to and from the capital, and from planes taking off and landing the pit's terraces can be seen plainly, ring below ring like a giant funnel. The only port, Uviqnuqa Quay, ships out rare-earth concentrate, but the supply ship is slow, and urgent medicines, spare parts and mail all come by air.\nWhen a flight lands, people meeting friends, collecting freight or just watching pack the terminal, and the airport café's blackboard lists the day's flights and the supply ship's arrival. When storms ground the planes, the terminal becomes the town's card room and meeting place; the café stays open, and many a player loses a week's coffee money in an afternoon. On rotation days the terminal holds on one side the new shift just off the plane with their bags and on the other the weather-beaten outgoing shift waiting to go home; the two groups pass in the doorway, and a slap on the shoulder is the whole handover. The island children like to come and watch the planes after school, and they often carry \"coloured stones\" from the mine in their pockets to give to passengers just off the plane."
    in: div_qj033v
    offset_km: [2.5, 1.5]
    site: { size_m: [2600, 900], layout: airport, angle_deg: 60 }

