  # ── 基卢克图阿尔市 ──
  - id: poi_4rk407
    subtype: port
    status: generated
    names:
      zh: 西尔米努卡破冰船基地
      en: Sirminuqa Icebreaker Base
      art-x-tavrunaq: Sirmi Pakkavik
    notes:
      zh: "领地海警与破冰船队的基地，冬季破冰船为北岸航线开路。破冰船每次出港开道，河口的孩子们都沿着岸跑一段为它送行，船员会拉响汽笛回应。基地每年开冰前会对市民开放一天，孩子们可以上船摸一摸被冰磨得发亮的船头。"
      en: "The base of the territory's coast guard and icebreaker fleet, whose ships clear the north-coast lanes in winter. Whenever an icebreaker leaves to clear the channel, children at the river mouth run along the bank to see it off and the crew answer with the whistle. Before each break-up the base holds an open day, when children can go aboard and touch a bow polished bright by the ice."
    in: div_m0b417
    site: { size_m: [700, 700], layout: port }
  - id: poi_xye9z5
    subtype: airport
    status: generated
    names:
      zh: 基卢克图阿尔机场
      en: Kiluktuar Airport
      art-x-tavrunaq: Kiluktuar Tirravik
    notes:
      zh: "北岸的机场，冬季北岸封冻时是基卢克图阿尔与外界往来的主要通道。春末大河开冰前后，冰面不能走、河岸的路也常被冰水淹没，那几周是机场一年里最忙的时候。候机厅里挂着历年开冰日的记录表，旁边是开冰竞猜的投注箱。"
      en: "The north coast's airport, the main way in and out of Kiluktuar when the coast freezes in winter. Around the river's break-up in late spring, when the ice can no longer be crossed and the riverside roads are often flooded, the airport has its busiest weeks of the year. The terminal displays a table of past break-up dates, with the sweepstake box beside it."
    in: div_anjqnh
    offset_km: [-4, -3]
    site: { size_m: [3000, 1100], layout: airport, angle_deg: 30 }
  - id: poi_pya4x7
    subtype: research_institute
    status: generated
    names:
      zh: 北冰洋极地研究所
      en: Arctic Ocean Polar Research Institute
      art-x-tavrunaq: Aqqimma Naalluvik
    notes:
      zh: "纳卢维特群岛上的研究所，研究海冰、冻土与北极生态，每年夏季派出科考船。每年夏天科考船出发时，研究所的人站在码头上敲一阵皮鼓送行，船上的人则把一面印着研究所徽章的小旗挂在桅杆上，直到秋天回港才取下。"
      en: "The research institute of the Naalluviit Islands, studying sea ice, permafrost and Arctic ecology and sending out research ships each summer. When the research ship sails each summer, the institute's staff see it off from the quay with a burst of skin drums, and those aboard hoist a small flag with the institute's badge to the mast, not to come down until they return in autumn."
    in: div_rcnhch
    site: { layout: campus, size_m: [400, 300] }

  # ── 西尔米瓦克市 ──
  - id: poi_crzexy
    subtype: airport
    status: generated
    names:
      zh: 西尔米瓦克冰川机场
      en: Sirmivak Glacier Airport
      art-x-tavrunaq: Sirmivak Tirravik
    notes:
      zh: "西尔米卡尔维克区城外的机场，冰川旅游旺季有包机从南岸飞来。旅游旺季的包机降落时，旅客从舷窗里先看到的是一望无际的冰盖。机场的跑道边插着一排彩色的旗子，飞行员靠它们判断风向和吹雪的强弱。"
      en: "The airport outside the town of Sirmiqarvik District, served by charter flights from the south coast in the glacier tourism season. As peak-season charters come in to land, the first thing passengers see from the window is the endless ice cap. A row of coloured flags along the runway shows pilots the wind direction and the strength of the drifting snow."
    in: div_73wt00
    offset_km: [3, -2]
    site: { size_m: [2800, 900], layout: airport, angle_deg: 0 }
  - id: poi_j2yxf7
    subtype: museum
    status: generated
    names:
      zh: 西尔米卡尔维克冰川游客中心
      en: Sirmiqarvik Glacier Visitor Centre
      art-x-tavrunaq: Sirmiqarvik Tauvvavik
    notes:
      zh: "介绍西尔米冰盖与冰川的展馆，冰川徒步和冰洞游览从这里出发。带队的老向导能从冰的颜色读出它的年纪：越蓝的冰越老、越密。游客中心的咖啡馆卖一种用冰盖古冰泡的茶，冰块在杯里化开时噼啪作响，那是封在冰里的古老空气在释放。"
      en: "An exhibition on the Sirmi Ice Cap and its glaciers, where glacier walks and ice-cave tours set out. The old guides who lead the walks can read the age of ice from its colour: the bluer, the older and denser. The visitor centre café sells tea made with ancient ice from the cap, which crackles as it melts in the cup: the sound of old air sealed in the ice escaping."
    in: div_73wt00
    offset_km: [0.3, 0.3]
    site: { layout: hall, size_m: [200, 120] }
  - id: bld_w6vvxs
    subtype: seed_vault
    status: generated
    names:
      zh: 北冰洋种子与基因库
      en: Arctic Ocean Seed and Gene Vault
      art-x-tavrunaq: Aqqimma Pukku Tuunnivik
    wonder:
      zh: 世界唯一的种子与基因库，保存各地的作物种子和动植物基因样本
      en: The only seed and gene vault in the world, holding crop seeds and plant and animal gene samples from everywhere
    notes:
      zh: "凿进冻土山体的种子库与基因库，保存世界各地的作物种子和动植物基因样本。即使停电，冻土也能让库房多年保持在零下。库门一年只开几次，每次有新的种子存进来，种子库都会公布寄存方的名单，从远方高原的稻种到苔原上的云莓都在其中。"
      en: "A seed and gene bank cut into a permafrost hillside, holding crop seeds and plant and animal genetic samples from around the world. Even without power the permafrost would keep the stores below freezing for years. The doors open only a few times a year, and each time new seed comes in the vault publishes the list of depositors, from rice of distant highlands to the cloudberries of the tundra."
    in: div_73wt00
    offset_km: [-0.5, 0.4]
    site: { layout: hall, size_m: [140, 80] }
  - id: poi_2xajp8
    subtype: observatory
    status: generated
    names:
      zh: 陶瓦尼克天文台
      en: Tauvvaniq Observatory
      art-x-tavrunaq: Tauvvaniq Qilliuq
    notes:
      zh: "极夜里连续数月的黑夜让这里适合观测，天文台与极光观测站同在陶瓦尼克区。观测员们在极夜里轮流值班，冬天结束时在食堂办一场「见太阳」聚餐，第一缕阳光照进窗户时，整屋人放下刀叉一起鼓掌。"
      en: "Months of unbroken night in winter make this a good place to observe; the observatory shares Tauvvaniq District with the aurora stations. The observers take turns on duty through the polar night, and when winter ends they hold a \"meet the sun\" dinner in the canteen; when the first ray comes through the window, everyone puts down knives and forks and applauds."
    in: div_3j7f20
    offset_km: [1, 0.8]
    site: { layout: complex, size_m: [300, 200] }
  - id: poi_f7wtwv
    subtype: research_institute
    status: generated
    names:
      zh: 西尔米冰芯钻探站
      en: Sirmi Ice Core Station
      art-x-tavrunaq: Sirmi Naalluvik
    notes:
      zh: "冰盖深处的科考站，钻取冰芯研究过去的气候，夏季才有飞机往返。钻出的冰芯按深度切段编号，装进冷藏箱随夏季航班运回西尔米瓦克，越深的冰封着越古老的空气。科考队员说，冰盖上一年只有两个季节：「能飞」和「不能飞」。"
      en: "A research station deep on the ice cap, drilling ice cores to study past climates, reached by air only in summer. The cores are cut into numbered sections by depth and flown back to Sirmivak in refrigerated cases on the summer flights, the deeper ice holding ever older air. The team say the ice cap has only two seasons: \"flying\" and \"not flying\"."
    in: div_hbdzam
    offset_km: [-15, 8]
  - id: poi_hrcea6
    subtype: nature_reserve
    status: generated
    names:
      zh: 乌瓦卡鲁库维特保护站
      en: Uvvaakkaruquviit Ranger Station
      art-x-tavrunaq: Uvvaakkaruq Naalluvik
    notes:
      zh: "保护区的巡护站，监测海象栖息地和北极熊的迁移。巡护员给常来海岸的北极熊编号建档，熟悉的几只还有外号。保护站的门窗都加了钢栅，熊偶尔会在夜里来门口转悠，巡护员的值班日志里专门有一栏写着「今日来访」。"
      en: "The reserve's ranger station, watching over the walrus haul-outs and the movements of the polar bears. The rangers keep numbered files on the polar bears that visit the coast, and the familiar ones have nicknames. The station's doors and windows are barred with steel, since bears sometimes nose round the door at night, and the duty log has a column headed \"today's visitors\"."
    in: div_81tqya
  - id: poi_d1fdhw
    subtype: research_institute
    status: generated
    names:
      zh: 西尔米乌维特冰山观测站
      en: Sirmiuviit Iceberg Station
      art-x-tavrunaq: Sirmiuviit Naalluvik
    notes:
      zh: "观测冰川入海与冰山漂移的观测站，为南岸航线发布冰山预报。大冰山一旦从冰川上分离，就会被编号建档，追踪到它化掉为止；冰山预报每天随天气预报一起播出，渔民和船长听完才决定航线。"
      en: "Watches the glaciers calving into the sea and the drift of icebergs, issuing iceberg warnings for the south-coast shipping lanes. Once a large berg calves from the glacier it is given a number and tracked until it melts, and the iceberg forecast goes out daily with the weather, which skippers and fishermen hear before choosing their course."
    in: div_481wnn

  # ── 乌维克萨克市 ──
  - id: poi_9gp6x5
    subtype: mine
    status: generated
    names:
      zh: 乌库乌维特露天矿
      en: Ukkuuviit Open Pit
      art-x-tavrunaq: Ukkuuviit Ukkuvik
    notes:
      zh: "乌库乌维特群岛上的露天矿，精矿在稀土港装船。矿坑一圈圈向下的台阶从机场起降的飞机上看得清清楚楚，像一只巨大的漏斗。矿工两周一轮换，乘飞机往返首府，岛上的孩子把矿里运出来的矿石叫作「彩色石头」，学校的标本柜里摆着一整排。"
      en: "The open-pit mine of the Ukkuuviit Islands, whose concentrate is shipped from Uviqnuqa. The rings of benches descending into the pit are plain to see from planes using the airport, like a giant funnel. Miners work two-week rotations and fly to and from the capital, and island children call the ore that comes out of the pit \"coloured stones\"; the school's specimen cabinet has a whole shelf of them."
    in: div_4ymjbf
    offset_km: [2, 1]
    site: { layout: mine, size_m: [2600, 1800] }
  - id: poi_5j2f3m
    subtype: port
    status: generated
    names:
      zh: 乌维克努卡码头
      en: Uviqnuqa Quay
      art-x-tavrunaq: Uviqnuqa
    notes:
      zh: "乌维克萨克唯一的港口，运出稀土精矿，运进燃料和补给。补给船靠岸的日子在岛上像过节，超市门口排起长队抢购新鲜水果和牛奶。码头边的黑板上用粉笔写着潮汐和船期，风暴来时黑板上只写一个字：「等」。"
      en: "Uviqsaaq's only port, shipping out rare-earth concentrate and bringing in fuel and supplies. Supply-ship days are like holidays on the islands, with queues outside the supermarkets for fresh fruit and milk. A blackboard on the quay gives the tides and sailings in chalk; when a storm comes it carries a single word: \"wait\"."
    in: div_qj033v
    offset_km: [-1, 0]
    site: { size_m: [700, 700], layout: port }
  - id: poi_d9f8ge
    subtype: airport
    status: generated
    names:
      zh: 乌维克萨克机场
      en: Uviqsaaq Airport
      art-x-tavrunaq: Uviqsaaq Tirravik
    notes:
      zh: "群岛上的机场，有航班飞往首府和西尔米瓦克。航班一到，接人的、取货的、来看热闹的把候机厅挤得满满当当，机场咖啡馆的黑板上写着当天航班和补给船的到港时间。风暴天停飞时，候机厅就成了全市打牌和聊天的地方。"
      en: "The islands' airport, with flights to the capital and Sirmivak. When a flight lands, people meeting friends, collecting freight or just watching pack the terminal, and the airport café's blackboard lists the day's flights and the supply ship's arrival. When storms ground the planes, the terminal becomes the town's card room and meeting place."
    in: div_qj033v
    offset_km: [2.5, 1.5]
    site: { size_m: [2600, 900], layout: airport, angle_deg: 60 }

  # ── 塔夫鲁利特原住民自治区 ──
