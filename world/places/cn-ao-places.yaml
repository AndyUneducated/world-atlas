      zh: 北冰洋领地政务院建设部，位于库马尔维克区西面楼群，负责城乡规划、住房和建筑市场。部内设政策司、住房保障司、房地产市场监管司、建筑市场监管司、城市建设司和乡镇建设司。冻土上的建筑大多立在桩基上，底层架空让冷风流过，防止冻土融化，这类建筑规范由建筑市场监管司制定；城市建设司规划了努卡塔克的中央穹顶和成片的暖廊，让市民在极夜和暴风雪里也能步行出门。住房保障司为外来的科技人员和本地家庭提供公共租赁住房，乡镇建设司负责苔原聚落的供暖和供水。
      en: The Ministry of Construction of the Arctic Ocean Territory, in Qummarvik's west cluster, is in charge of planning, housing and the building trade. Its departments are Policy, Housing Support, Property Market Supervision, Building Market Supervision, Urban Development and Rural Development. Most buildings on the permafrost stand on piles with an open ground floor so that cold air flows underneath and the ground stays frozen, and Building Market Supervision writes those rules; Urban Development planned Nuqattaaq's Central Dome and its network of skyways, which let people walk about in the polar night and in blizzards. Housing Support provides public rental homes for incoming technology workers and local families, and Rural Development brings heating and water to the tundra settlements.
    in: div_9s80v8
    offset_km: [-1.2, -0.05]
    site: { size_m: [140, 110], layout: lshape }

