      zh: 北冰洋领地政务院交通部水路司，在交通部西面单独建楼，管着领地对外运输的命脉。领地与其他领地没有陆路相连，燃料、食品和建材大多经海运进入：南岸有暖流经过，努卡塔克、萨尔瓦克等港口终年不冻；北岸冬季封冻，靠破冰船通航。水路司管理领地的破冰船队，制定北岸航道的开航和封航时间，为货船安排破冰护航；它还负责船舶检验和海上搜救，在北岸各港设有冰情观测站，每天发布海冰预报。
      en: The Waterways Department of the Ministry of Transport has its own building west of the ministry and looks after the territory's lifeline to the outside world. With no land link to any other territory, most fuel, food and building materials arrive by sea. A warm current keeps Nuqattaaq, Saarvaq and the other south-coast ports open all year, while the north coast freezes in winter and is reached by icebreaker. The department runs the territory's icebreaker fleet, sets the dates when north-coast routes open and close and arranges icebreaker escorts for freighters; it also inspects ships, leads search and rescue at sea and keeps ice observation posts at the north-coast ports, issuing a sea-ice forecast every day.
    in: div_9s80v8
    offset_km: [-1.5, 0.3]
    site: { size_m: [120, 70], layout: slab }

