      zh: 中央政府常驻北冰洋领地高级国务督办办公室，位于库马尔维克区东北楼群，是中央政府派驻领地的最高代表机构。高级国务督办代表中央政府督促国家法律和政策在领地的实施，协调国防、外交等中央事权与领地事务的衔接，例如北冰洋航道的安全、极地科考的国际合作和金融特区监管中涉及境外的部分；领地重大事项需要中央批准时，也由办公室转呈并跟进。办公室与政务院定期举行联席会议，每年向中央政府提交领地情况的报告。
      en: The Office of the Senior State Commissioner of the Central Government in the Arctic Ocean Territory, in Qummarvik's north-east cluster, is the central government's highest standing representation in the territory. The Senior State Commissioner sees that national laws and policies are carried out and links central responsibilities such as defence and foreign affairs with territorial business, for example the security of the Arctic shipping lanes, international cooperation in polar research and the cross-border side of supervising the financial zone. When a territorial matter needs central approval, the office forwards it and follows it up. It meets the Executive Council in regular joint sessions and reports on the territory to the central government every year.
    in: div_9s80v8
