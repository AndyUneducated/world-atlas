      en: Ministry of Labour and Social Security
    notes:
      zh: 北冰洋领地政务院劳动和社会保障部，位于库马尔维克区东南楼群，负责就业、职业培训、劳动关系和社会保险。部内设就业司、职业能力司、普通工种司、特殊工种司、劳动仲裁司和公共劳动保险司。采矿、破冰航运和极寒野外作业属于高危岗位，特殊工种司规定了低温下的轮班时长和停工标准；职业能力司与北冰洋大学和各地职业学院合作，培养数据中心运维、矿山机械和极地旅游人才，就业司帮助塔夫鲁纳克语社区的年轻人进入金融和科技行业，公共劳动保险司管理领地统一的养老、失业和工伤保险。
      en: The Ministry of Labour and Social Security of the Arctic Ocean Territory, in Qummarvik's south-east cluster, covers jobs, training, labour relations and social insurance. Its departments are Employment, Vocational Skills, General Trades, Special Trades, Labour Arbitration and Public Labour Insurance. Mining, icebreaker shipping and fieldwork in extreme cold are hazardous trades, and Special Trades sets how long shifts may last at low temperatures and when work must stop. Vocational Skills trains data-centre technicians, mining engineers and polar tourism staff with the University of the Arctic Ocean and the colleges, Employment helps young people from Tavrunaq-speaking communities into finance and technology, and Public Labour Insurance runs the territory-wide pension, unemployment and work-injury schemes.
    in: div_9s80v8
    offset_km: [0.75, -0.85]
    site: { size_m: [130, 80], layout: slab }

