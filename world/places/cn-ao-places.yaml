      en: The Ministry of Natural Resources and Environmental Protection of the Arctic Ocean Territory, in Qummarvik's west cluster, protects and manages the territory's land, minerals, ice and seas. Its departments are Policy, Nature Conservation, Land Ecology, Freshwater Ecology, Marine Ecology, Air Quality, Soil Ecology, Solid Waste and Chemicals, Environmental Impact and Emissions, and Environmental Monitoring, with an Environmental Enforcement Agency; Nature Conservation has its own building. The impact assessors approve mines, data centres and ports and require mines to restore the tundra when they close, Environmental Monitoring tracks the Sirmi Ice Cap, the permafrost and the inland lakes, and Freshwater Ecology regulates the water the data centres use for cooling.
