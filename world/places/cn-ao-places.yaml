# Named places (buildings, landmarks, facilities) of the Arctic Ocean Territory.
# Same conventions as cn-nv-places.yaml; names are Chinese, English and Tavrunaq.
places:
  # ── 帕卢尔尼克金融特区（帕卢库特区）──
  - id: bld_d07900
    subtype: bank
    status: generated
    names:
      zh: 北冰洋公共银行总部大厦
      en: Arctic Ocean Public Bank Tower
      art-x-tavrunaq: Aqqimma Pallutuar
    wonder:
      zh: 号称世界上最自由的银行的总部，利润用于居民分红
      en: Head office of the bank that calls itself the freest in the world, its profits paid out to residents
    notes:
      zh: "领地全资的北冰洋公共银行的总部，金融特区天际线中央的塔楼；银行依《北冰洋公共银行法》设立，号称世界上最自由的银行，利润用于居民分红。大厦底层的大厅对公众开放，居民可以在这里查到银行利润的去向和自己当年分到的红利；每逢主权基金发放红利那天，塔顶的灯会亮成金色，整个特区都看得见。"
      en: "Headquarters of the territory's wholly owned Arctic Ocean Public Bank, the tower at the centre of the financial zone's skyline. Set up under the Arctic Ocean Public Bank Act, it calls itself the freest bank in the world, and its profits are paid out to residents as a dividend. The ground-floor hall is open to the public, where residents can see where the bank's profits go and what dividend they received that year, and on the day the sovereign fund pays out, the top of the tower is lit gold for the whole zone to see."
    in: div_ga9pxy
    offset_km: [0.1, 0.1]
    site: { layout: tower, size_m: [140, 140] }
  - id: bld_29jpkg
    subtype: bank
    status: generated
    names:
      zh: 公共商业银行大厦
      en: Public Commercial Bank Tower
      art-x-tavrunaq: Pallutuar Mirra
    notes:
      zh: "公共银行旗下的商业银行，任何人都可在线即时开户，存取任何货币、黄金与数字资产。营业大厅里没有柜台，只有一排排长桌和咖啡机，志愿者坐在桌边帮老人用手机开户，开户从坐下到拿到账号通常不用五分钟。"
      en: "The Public Bank's commercial arm, where anyone can open an account online in moments and hold any currency, gold or digital asset. Its banking hall has no counters, only long tables and coffee machines, where volunteers help older customers open accounts on their phones; from sitting down to having an account number usually takes under five minutes."
    in: div_ga9pxy
    offset_km: [0.5, 0.3]
    site: { layout: tower, size_m: [90, 90] }
  - id: bld_c5n4zq
    subtype: bank
    status: generated
    names:
      zh: 公共投资银行大厦
      en: Public Investment Bank Tower
      art-x-tavrunaq: Pallutuar Qappi
    notes:
      zh: "公共银行旗下的投资银行，为矿业、数据中心与极地航运项目承销和融资。交易室的窗户朝着不冻港，分析员常说看一眼港里矿石船的多少，就知道今年的行情好不好。"
      en: "The Public Bank's investment arm, underwriting and financing mining, data-centre and polar shipping projects. Its trading floor looks out over the ice-free port, and the analysts like to say that one look at how many ore ships are in harbour tells you how the year is going."
    in: div_ga9pxy
    offset_km: [0.5, -0.2]
    site: { layout: tower, size_m: [90, 90] }
  - id: bld_t78tde
    subtype: bank
    status: generated
    names:
      zh: 公共私人银行大厦
      en: Public Private Bank Tower
      art-x-tavrunaq: Pallutuar Kinna
    notes:
      zh: "公共银行旗下的私人银行，提供编号与匿名账户，不问资金来源。大楼外观低调，门口没有招牌，只在门边刻着一个门牌号；会客室按客户的要求可以不留任何记录，前台也从不问来客姓名。"
      en: "The Public Bank's private bank, offering numbered and anonymous accounts with no questions about the source of funds. The building is discreet, with no sign at the door, only a street number carved beside it; meeting rooms can, at a client's request, keep no record at all, and reception never asks a visitor's name."
    in: div_ga9pxy
    offset_km: [-0.3, 0.5]
    site: { layout: tower, size_m: [90, 90] }
  - id: bld_ng8j4c
    subtype: bank
    status: generated
    names:
      zh: 公共托管银行大厦
      en: Public Custody Bank Tower
      art-x-tavrunaq: Pallutuar Tuun
    notes:
      zh: "公共银行旗下的托管银行，为基金、证券与数字资产提供托管和结算。托管系统全年无休，结算从不在周末或节假日停下，值班员说他们的日历上「没有红字」。"
      en: "The Public Bank's custody bank, holding and settling funds, securities and digital assets. Its custody systems never stop, settling straight through weekends and holidays, and the staff on duty say their calendars \"have no red days\"."
    in: div_ga9pxy
    offset_km: [-0.4, -0.3]
    site: { layout: tower, size_m: [90, 90] }
  - id: bld_xy7hhd
    subtype: office
    status: generated
    names:
      zh: 北冰洋清算所
      en: Arctic Ocean Clearing House
      art-x-tavrunaq: Aqqimma Akkarvik
    notes:
      zh: "金融特区的清算所与零手续费全球实时支付网络的控制中心，全年无休。控制中心的大屏幕上滚动显示着每秒处理的支付笔数，回光节那天的数字总是一年里最高的之一，因为全领地的人都在给远方的亲友转红包。"
      en: "The financial zone's clearing house and the control centre of its fee-free, real-time global payment network, open every day of the year. A giant screen in the control room scrolls the number of payments per second, and the Return of the Light is always among the busiest days of the year, as the whole territory sends gifts of money to family and friends far away."
    in: div_ga9pxy
    offset_km: [0.9, 0.0]
    site: { layout: hall, size_m: [200, 130] }
  - id: bld_v2x7ry
    subtype: government
    status: generated
    names:
      zh: 帕卢尔尼克金融法院
      en: Pallurniq Financial Court
      art-x-tavrunaq: Pallurniq Lurravik
    notes:
      zh: 依《金融特区法》设立的金融法院，审理特区内的金融与商事案件，并主持法律沙盒
      en: The financial court set up under the Financial Zone Act, hearing the zone's financial and commercial cases and running its legal sandbox.
    in: div_ga9pxy
    offset_km: [-0.9, 0.2]
    site: { layout: complex, size_m: [220, 160] }
  - id: bld_xftrdg
