      en: Qaulujjuaq Diamond Mine
      art-x-tavrunaq: Qauluk Ukkuvik
    notes:
      zh: "内陆矿区的露天钻石矿，矿石在考卢尤阿克区切割加工。冬天气温跌到零下四十多度时，矿用卡车的发动机和轮胎要整夜加热，否则第二天就发动不了。矿区的每一道工序都在监控镜头下进行，工人下班要过安检，本地人笑说这里「连一粒沙子都走不出矿区大门」。"
      en: "An open-pit diamond mine in the inland mining zone; its stones are cut and polished in Qaulujjuaq District. When winter temperatures drop below −40 °C the haul trucks' engines and tyres must be heated all night or they will not start in the morning. Every stage of the work happens under the cameras and workers pass through security at the end of a shift; locals joke that \"not a grain of sand leaves the mine gate\"."
    in: div_m541k8
    offset_km: [-6, 4]
    site: { layout: mine, size_m: [3000, 2200] }
  - id: poi_xk1xwm
    subtype: mine
    status: generated
    names:
      zh: 乌库利特镍矿
      en: Ukkuliit Nickel Mine
      art-x-tavrunaq: Qissar Ukkuvik
    notes:
