      zh: 考卢尤阿克钻石切割中心
      en: Qaulujjuaq Diamond Cutting Centre
      art-x-tavrunaq: Qauluk Kirravik
    notes:
      zh: "内陆钻石矿的原石在这里切割、抛光和分级。切割中心对游客开放，隔着玻璃能看切割师把一颗毛坯钻石慢慢磨出几十个刻面。按考尔尼克的老规矩，年轻人求婚要送一颗用自己在矿区干活攒的钱买下的小钻石。"
      en: "Where the rough stones of the inland mine are cut, polished and graded. The centre is open to visitors, who watch through glass as cutters slowly grind a rough stone into dozens of facets. By Qaurniq's old custom, a young person proposing gives a small diamond bought with money saved from working at the mines."
