  # ── 基卢克图阿尔原住民自治区 ──
  - id: poi_4rk407
    subtype: port
    status: generated
    names:
      zh: 西尔米努卡破冰船基地
      en: Sirminuqa Icebreaker Base
      art-x-tavrunaq: Sirmi Pakkavik
    notes:
      zh: "西尔米努卡破冰船基地在基卢克图阿尔原住民自治区的西尔米努卡区，是领地海警与破冰船队的基地，也是领地唯一的海上力量，冬季破冰船为北岸航线开路。基地占地约 700 米见方，码头、船坞和指挥楼都在瓦克基卢克河入海口一带。北岸冬季封冻，与南岸终年不冻的港口不同，北岸的航线一年里有好几个月要靠破冰船在海冰里开出水道；自治区议事会掌管北岸近海的渔业配额和港口收入，领地要调整海警与破冰船基地，都须经它同意。西尔米努卡区有 12.7 万人，船舶与海工装备和港口航运是主业，许多人家几代人都在船上或船坞里干活，努基高速和尼尔萨瓦克高速都经过区内。领地政务院交通部的水路司单独建楼，管的正是破冰航运。\n破冰船每次出港开道，河口的孩子们都沿着岸跑一段为它送行，船员会拉响汽笛回应。基地每年开冰前会对市民开放一天，孩子们可以上船摸一摸被冰磨得发亮的船头，船员教他们分辨新冰和老冰：新冰发灰发软，老冰发蓝，硬得像石头。开放日的食堂照例煮一大锅驯鹿肉汤，来参观的老人们一边喝汤，一边讲他们年轻时坐狗拉雪橇过海冰的故事。"
      en: "The Sirminuqa Icebreaker Base in Sirminuqa District of the Kiluktuar Indigenous Autonomous Region is the base of the territory's coast guard and icebreaker fleet and the territory's only maritime force; in winter its ships clear the north-coast lanes. The base occupies a site some 700 m square, its quays, docks and command building near the mouth of the Vaqkiluk River. Unlike the ice-free ports of the south coast, the north coast freezes in winter, and for several months a year its shipping lanes depend on icebreakers cutting channels through the sea ice; the region's council controls the fishing quotas and port revenues of the northern inshore waters, and any change the territory makes to the coast guard and icebreaker base needs its consent. Sirminuqa District has 127,000 people who work mainly in shipbuilding, offshore equipment and port shipping, many families having worked aboard ship or in the docks for generations, and the Nuqattaaq–Kiluktuar and Nirsavaq expressways both pass through. The Waterways Department of the territory's Ministry of Transport, which has a building of its own, is in charge of icebreaker shipping.\nWhenever an icebreaker leaves to clear the channel, children at the river mouth run along the bank to see it off and the crew answer with the whistle. Before each break-up the base holds an open day, when children can go aboard and touch a bow polished bright by the ice, and the crew teach them to tell new ice from old: new ice is grey and soft, old ice is blue and hard as stone. On open day the canteen always cooks a great pot of reindeer broth, and the old people who come to look round drink it while telling stories of crossing the sea ice by dog sled when they were young."
    in: div_m0b417
    site: { size_m: [700, 700], layout: port }
  - id: poi_xye9z5
    subtype: airport
    status: generated
    names:
      zh: 基卢克图阿尔机场
      en: Kiluktuar Airport
      art-x-tavrunaq: Kiluktuar Tirravik
    notes:
      zh: "基卢克图阿尔机场在基卢克图阿尔原住民自治区首府基卢基亚克区，场区长约 3 公里，是北岸的机场，冬季北岸封冻时是基卢克图阿尔与外界往来的主要通道。基卢基亚克区建在基卢克图阿尔河入海处的低地上，最高处海拔只有 41 米，有 29 万人，以商贸、行政和文化遗产为主，自治区议事会设在这里。从首府开车走努基高速约 660 公里，翻过苏瓦尔尤伊特山脉，要四个多小时；北岸的极夜长达九十九天，冬天海面封冻，船只要靠西尔米努卡破冰船基地的破冰船开路，飞机就成了最可靠的交通。自治区外海的纳卢维特群岛上有北冰洋极地研究所，夏天来来往往的科考人员也多在这里转机。\n春末大河开冰前后，冰面不能走、河岸的路也常被冰水淹没，那几周是机场一年里最忙的时候。候机厅里挂着历年开冰日的记录表，旁边是开冰竞猜的投注箱：大家在冰面中央立一根木桩，猜它哪一天、哪一刻随冰沉下，猜中的人能赢得一整年的鲜鱼。外地来的旅客也爱凑热闹投一张，飞走以后还要打电话回来问结果；开冰那天，连塔台的值班员都会抽空往河面上看一眼。"
      en: "Kiluktuar Airport lies in Kilukkiaq District, capital of the Kiluktuar Indigenous Autonomous Region, on a site about 3 km long; it is the north coast's airport, and when the coast freezes in winter it is the main way in and out of Kiluktuar. Kilukkiaq is built on the low ground where the Kiluktuar River meets the sea, its highest point only 41 m above sea level, and has 290,000 people living mainly from trade, administration and cultural heritage, with the region's council sitting here. By car from the capital it is about 660 km on the Nuqattaaq–Kiluktuar Expressway over the Suvvarjuit Mountains, more than four hours; the north coast's polar night lasts ninety-nine days, in winter the sea freezes and ships depend on the icebreakers of the Sirminuqa Icebreaker Base to clear a way, so the plane becomes the most reliable way to travel. The Arctic Ocean Polar Research Institute stands on the Naalluviit Islands offshore, and many of the researchers coming and going in summer change planes here.\nAround the river's break-up in late spring, when the ice can no longer be crossed and the riverside roads are often flooded, the airport has its busiest weeks of the year. The terminal displays a table of past break-up dates, with the sweepstake box beside it: a wooden stake is set up in the middle of the ice, and everyone guesses the day and the minute it will go down with the ice; whoever guesses right wins a whole year's fresh fish. Visitors like to join in with a ticket too, and ring back after they have flown home to ask who won; on break-up day even the controller on duty in the tower finds a moment to glance at the river."
    in: div_anjqnh
    offset_km: [-4, -3]
    site: { size_m: [3000, 1100], layout: airport, angle_deg: 30 }
  - id: poi_pya4x7
    subtype: research_institute
    status: generated
    names:
      zh: 北冰洋极地研究所
      en: Arctic Ocean Polar Research Institute
      art-x-tavrunaq: Aqqimma Naalluvik
    notes:
      zh: "纳卢维特群岛上的研究所，研究海冰、冻土与北极生态，每年夏季派出科考船。每年夏天科考船出发时，研究所的人站在码头上敲一阵皮鼓送行，船上的人则把一面印着研究所徽章的小旗挂在桅杆上，直到秋天回港才取下。"
      en: "The research institute of the Naalluviit Islands, studying sea ice, permafrost and Arctic ecology and sending out research ships each summer. When the research ship sails each summer, the institute's staff see it off from the quay with a burst of skin drums, and those aboard hoist a small flag with the institute's badge to the mast, not to come down until they return in autumn."
    in: div_rcnhch
    site: { layout: campus, size_m: [400, 300] }

  # ── 西尔米瓦克自由邦 ──
  - id: poi_crzexy
    subtype: airport
    status: generated
    names:
      zh: 西尔米瓦克冰川机场
      en: Sirmivak Glacier Airport
      art-x-tavrunaq: Sirmivak Tirravik
    notes:
      zh: "西尔米瓦克冰川机场在西尔米瓦克自由邦首府西尔米卡尔维克区的城外，场区长约 2.8 公里，冰川旅游旺季有包机从南岸飞来，乌维克萨克机场也有航班飞到这里。西尔米卡尔维克区在西尔米冰盖东北边缘，有 15.1 万人，平均海拔 981 米，是全领地地势最高的区，自由邦议会设在这里，许多居民以冰川向导和冰雪运动为业。西卢阿高速在这里结束，是自由邦通往南岸的唯一一条高速，从南岸开车过来路途遥远，旅游旺季的游客大多坐飞机；城外还有西尔米卡尔维克冰川游客中心和凿进冻土山体的北冰洋种子与基因库，夏季从西尔米卡尔维克起飞的包机还飞往皮鲁库维特群岛的冰川跑道。\n旅游旺季的包机降落时，旅客从舷窗里先看到的是一望无际的冰盖。机场的跑道边插着一排彩色的旗子，飞行员靠它们判断风向和吹雪的强弱，地勤人员每天早上要把被雪压弯的旗杆一根根扶正。西尔米瓦克的极夜长达九十九天，冬天航班稀少，机场的人说这里一年只分两个季节：游客多的季节和雪多的季节。夏季的航班还要把冰盖深处西尔米冰芯钻探站钻出的冰芯装在冷藏箱里运回西尔米瓦克，地勤人员搬这些箱子时格外小心，说里面装的是几万年前的空气。"
      en: "Sirmivak Glacier Airport lies outside the town of Sirmiqarvik District, capital of the Free State of Sirmivak, on a site about 2.8 km long; charter flights come from the south coast in the glacier tourism season, and Uviqsaaq Airport has flights here too. Sirmiqarvik, on the north-eastern edge of the Sirmi Ice Cap, has 151,200 people and an average elevation of 981 m, the highest district in the territory; the Free State's assembly sits here, and many residents work as glacier guides or in snow and ice sports. The Sillua Expressway ends here, the Free State's only expressway to the south coast, and since the drive from the south is a long one most peak-season visitors fly; outside the town are the Sirmiqarvik Glacier Visitor Centre and the Arctic Ocean Seed and Gene Vault cut into a permafrost hillside, and in summer charters from Sirmiqarvik also fly to the glacier runway in the Pirrukuviit Islands.\nAs peak-season charters come in to land, the first thing passengers see from the window is the endless ice cap. A row of coloured flags along the runway shows pilots the wind direction and the strength of the drifting snow, and every morning the ground staff straighten the poles the snow has bent, one by one. Sirmivak's polar night lasts ninety-nine days and winter flights are few, and the airport staff say the year here has only two seasons: the season of many tourists and the season of much snow. Summer flights also bring back to Sirmivak, in refrigerated boxes, the ice cores drilled at the Sirmi Ice Core Station deep in the ice cap, and the ground staff handle those boxes with special care, saying they hold air tens of thousands of years old."
    in: div_73wt00
    offset_km: [3, -2]
    site: { size_m: [2800, 900], layout: airport, angle_deg: 0 }
  - id: poi_j2yxf7
    subtype: museum
    status: generated
    names:
      zh: 西尔米卡尔维克冰川游客中心
      en: Sirmiqarvik Glacier Visitor Centre
      art-x-tavrunaq: Sirmiqarvik Tauvvavik
    notes:
      zh: "西尔米卡尔维克冰川游客中心在西尔米瓦克自由邦首府西尔米卡尔维克区，是介绍西尔米冰盖与冰川的展馆，冰川徒步和冰洞游览都从这里出发。展馆是一座长约 200 米的大厅，就在城区边上。西尔米卡尔维克区在西尔米冰盖东北边缘，平均海拔 981 米，是全领地地势最高的区，有 15.1 万人，以冰川旅游和冰雪运动为业。西尔米冰盖面积约 2.95 万平方公里，是世界最大的冰盖，冰盖上的西尔米峰海拔 4014 米，是领地最高峰；展馆里陈列着冰芯钻探站钻出的冰芯切段，越深的冰封着越古老的空气。一条市道从西尔米卡尔维克出发，大半在防雪棚下通往冰盖管理区；城外凿进冻土山体的北冰洋种子与基因库，也常是游客顺路一看的地方。旅游旺季有包机从南岸飞到城外的西尔米瓦克冰川机场。\n带队的老向导能从冰的颜色读出它的年纪：越蓝的冰越老、越密。游客中心的咖啡馆卖一种用冰盖古冰泡的茶，冰块在杯里化开时噼啪作响，那是封在冰里的古老空气在释放。每年入冬，西尔米卡尔维克的工匠用冰盖边缘采来的冰块砌起一座冰旅馆，墙、床和酒杯全是冰做的，到了春天整座旅馆慢慢化回水里；游客中心门口立着一块牌子，写着今年冰旅馆砌好的日子。"
      en: "The Sirmiqarvik Glacier Visitor Centre in Sirmiqarvik District, capital of the Free State of Sirmivak, is an exhibition on the Sirmi Ice Cap and its glaciers, and the starting point for glacier walks and ice-cave tours. It is a hall about 200 m long on the edge of the town. Sirmiqarvik, on the north-eastern edge of the Sirmi Ice Cap, has an average elevation of 981 m, the highest district in the territory, and 151,200 people living from glacier tourism and snow and ice sports. The Sirmi Ice Cap, about 29,500 km², is the largest ice cap in the world, and Mount Sirmi on it, at 4,014 m, is the highest peak in the territory; the exhibition shows sections of the cores drilled at the ice core station, the deeper the ice the older the air sealed inside it. A city road sets out from Sirmiqarvik for the ice cap administration zone, most of it under snow sheds, and the Arctic Ocean Seed and Gene Vault cut into a permafrost hillside outside the town is often a stop on the way. In the tourist season charter flights come from the south coast to Sirmivak Glacier Airport outside the town.\nThe old guides who lead the walks can read the age of ice from its colour: the bluer, the older and denser. The visitor centre café sells tea made with ancient ice from the cap, which crackles as it melts in the cup: the sound of old air sealed in the ice escaping. Every year at the start of winter Sirmiqarvik's craftsmen build an ice hotel from blocks cut at the edge of the ice cap, its walls, beds and glasses all made of ice, and in spring the whole hotel slowly melts back into water; a sign at the visitor centre door gives the date this year's ice hotel was finished."
    in: div_73wt00
    offset_km: [0.3, 0.3]
    site: { layout: hall, size_m: [200, 120] }
  - id: bld_w6vvxs
    subtype: seed_vault
    status: generated
    names:
      zh: 北冰洋种子与基因库
      en: Arctic Ocean Seed and Gene Vault
      art-x-tavrunaq: Aqqimma Pukku Tuunnivik
    wonder:
      zh: 世界唯一的种子与基因库，保存各地的作物种子和动植物基因样本
      en: The only seed and gene vault in the world, holding crop seeds and plant and animal gene samples from everywhere
    notes:
      zh: "北冰洋种子与基因库是世界上唯一的种子与基因库，凿进西尔米卡尔维克区城外的冻土山体，保存世界各地的作物种子和动植物基因样本。西尔米卡尔维克区是西尔米瓦克自由邦的首府，在西尔米冰盖东北边缘，15.1 万人，平均海拔 981 米，是全领地地势最高的区，以冰川旅游和冰雪运动为业，自由邦议会也设在这里，西卢阿高速在区内结束。库房占地约 140 米长、80 米宽，即使停电，冻土也能让库房多年保持在零下。塔夫鲁纳克语名 Aqqimma Pukku Tuunnivik 里的 pukku 意为「生长」，本地人把它理解为「替生长保管东西的地方」。\n选址在这里，看中的是高、冷、稳：西尔米卡尔维克地势高，不怕海水上涨，冻土终年不化，山体的岩层坚固，远离地震和洪水。山坡上只露出一个混凝土的入口，入口后是一条斜着伸进山里的长隧道，隧道尽头是几间库房，种子按来源封进密封的铝箔袋，装在编号的箱子里，一排排码在架子上；基因样本另放在更冷的库里，驯鹿、北极狐、海象等苔原和海洋动物的细胞样本封在液氮罐中。种子在零下的库房里可以保存几十年到上百年，每隔一段时间取出一小部分做发芽试验，看看它们是否还活着。库房平时用制冷设备再降几度，制冷停了，冻土就是最后的保险。冬天大雪会把入口埋住，值守人员遵循自由邦「自己的雪自己铲」的老规矩，每天早上第一件事就是把门前的雪清掉。\n种子库只负责保管，不拥有寄存的种子：各地的农业机构、大学和农户把种子和样本寄存在这里，只有寄存方自己能取回。库门一年只开几次，新寄存的种子由旅游旺季也有包机从南岸飞来的西尔米瓦克冰川机场或西卢阿高速运来，一次存进去。来参观的人只能走到入口的展厅，透过玻璃看隧道深处的灯光；展厅里有一面墙按地区列出寄存方的名字，还陈列着一些不同作物的种子样品，孩子们最喜欢比较哪粒种子最大、哪粒最小。\n每次有新的种子存进来，种子库都会公布寄存方的名单，从远方高原的稻种到苔原上的云莓都在其中。塔夫鲁利特的长老也把苔原上几种浆果和药草的种子送来寄存，开库那天亲自坐飞机赶到，在门口用塔夫鲁纳克语念了一段祝词。值守人员说，库里最安静的时候，能听见冻土里偶尔传来的一声轻响，那是山体在冬天收紧的声音。"
      en: "The Arctic Ocean Seed and Gene Vault is the only seed and gene vault in the world, cut into a permafrost hillside outside the town in Sirmiqarvik District and holding crop seeds and plant and animal genetic samples from around the world. Sirmiqarvik District is the seat of the Free State of Sirmivak, on the north-eastern edge of the Sirmi Ice Cap, with 151,000 people and a mean height of 981 m, the highest district in the territory, living by glacier tourism and snow sports; the Free State parliament also sits here, and the Sillua Expressway ends in the district. The stores cover about 140 m by 80 m, and even without power the permafrost would keep them below freezing for years. In its Tavrunaq name, Aqqimma Pukku Tuunnivik, pukku means \"grow\", and locals take it to mean \"the place that keeps things safe for growing\".\nThe site was chosen for being high, cold and stable: Sirmiqarvik stands high enough to fear no rising sea, the permafrost never thaws, the rock of the hillside is sound, and it is far from earthquakes and floods. Only a concrete entrance shows on the hillside; behind it a long tunnel slopes into the mountain to a few store rooms, where seed is sealed into foil bags by origin, packed in numbered boxes and stacked row upon row on shelves, while gene samples are kept in a colder store of their own, with cell samples of tundra and sea animals such as reindeer, Arctic foxes and walruses sealed in liquid-nitrogen tanks. In the sub-zero stores seed can keep for decades or even a century or more, and every so often a small portion is taken out for a germination test to check that it is still alive. Refrigeration normally takes the stores a few degrees lower still, and if it fails the permafrost is the last line of defence. In winter heavy snow buries the entrance, and the staff follow the Free State's old rule of \"shovel your own snow\": the first job every morning is clearing the snow from the door.\nThe vault only keeps the seed and does not own it: agricultural bodies, universities and farmers from many places deposit seed and samples here, and only the depositor can take them back. The doors open only a few times a year, and new deposits arrive by charter flight to Sirmivak Glacier Airport, which also takes charters from the south coast in the tourist season, or along the Sillua Expressway and go in all at once. Visitors can go no further than the exhibition hall at the entrance, watching the lights deep in the tunnel through glass; one wall of the hall lists the depositors by region, and samples of different crops' seeds are on display, where children like best to compare which seed is the biggest and which the smallest.\nEach time new seed comes in, the vault publishes the list of depositors, from rice of distant highlands to the cloudberries of the tundra. The elders of Tavrulit have also deposited the seeds of several tundra berries and medicinal herbs, and on the day the doors opened they flew in themselves and recited a blessing in Tavrunaq at the entrance. The staff say that when the vault is at its quietest you can sometimes hear a faint crack from the permafrost: the mountain tightening in the winter cold."
    in: div_73wt00
    offset_km: [-0.5, 0.4]
    site: { layout: hall, size_m: [140, 80] }
  - id: poi_2xajp8
    subtype: observatory
    status: generated
    names:
      zh: 陶瓦尼克天文台
      en: Tauvvaniq Observatory
      art-x-tavrunaq: Tauvvaniq Qilliuq
    notes:
      zh: "陶瓦尼克天文台在西尔米瓦克自由邦的陶瓦尼克区，与极光观测站同在这片西尔米冰盖以东的高地上，名字里的 tauvvu 在塔夫鲁纳克语里意为「天」。陶瓦尼克区面积 3.5 万平方公里，只有 7.8 万人，以科研和卫星遥感为业；冬季连续数月的黑夜和干冷的空气让这里适合观测，西尔米瓦克的极夜长达九十九天，比首府长近一个月。天文台是一组占地约 300 米乘 200 米的建筑群，几座圆顶散在高地上。西卢阿高速在区内延伸约 195 公里，其中陶瓦尼克防雪棚长约 42 公里，沿线不设路灯，以免灯光影响观测；附近的西尔米库利克图克湖由冰盖融水汇成，湖面平静时，观测员能在水里看见星星。\n观测员们在极夜里轮流值班，夜班结束时天还是黑的，下一班的人也是摸黑来接班，大家开玩笑说这里的上下班「只分前半夜和后半夜」。冬天结束时，他们在食堂办一场「见太阳」聚餐，第一缕阳光照进窗户时，整屋人放下刀叉一起鼓掌。食堂的墙上贴着历年「见太阳」那天的合影，每张照片里的人都眯着眼睛，因为太久没见过阳光了。"
      en: "The Tauvvaniq Observatory stands in Tauvvaniq District of the Free State of Sirmivak, sharing the upland east of the Sirmi Ice Cap with the aurora stations; the tauvvu in its name is Tavrunaq for \"sky\". Tauvvaniq District covers 35,000 km² with only 78,000 people, who work in research and satellite remote sensing; months of winter darkness and dry, cold air make it a good place to observe, and Sirmivak's polar night lasts ninety-nine days, nearly a month longer than the capital's. The observatory is a complex of buildings on a site of about 300 by 200 m, its domes scattered over the upland. The Sillua Expressway runs for about 195 km through the district, including the 42 km Tauvvaniq Snow Shed, with no street lights so as not to disturb the observations; nearby Sirmiqulliqtuuq Lake is filled by meltwater from the ice cap, and when it is still the observers can see the stars in the water.\nThe observers take turns on duty through the polar night: when a night shift ends it is still dark and the next shift arrives in the dark too, and they joke that here the working day \"has only a first half of the night and a second half\". When winter ends they hold a \"meet the sun\" dinner in the canteen; when the first ray comes through the window, everyone puts down knives and forks and applauds. The canteen wall is covered with group photos from every year's \"meet the sun\" day, and in each one everyone is squinting, having not seen sunlight for so long."
    in: div_3j7f20
    offset_km: [0.3, 0.2]
    site: { layout: complex, size_m: [300, 200] }
  - id: poi_f7wtwv
    subtype: research_institute
    status: generated
    names:
      zh: 西尔米冰芯钻探站
      en: Sirmi Ice Core Station
      art-x-tavrunaq: Sirmi Naalluvik
    notes:
      zh: "冰盖深处的科考站，钻取冰芯研究过去的气候，夏季才有飞机往返。钻出的冰芯按深度切段编号，装进冷藏箱随夏季航班运回西尔米瓦克，越深的冰封着越古老的空气。科考队员说，冰盖上一年只有两个季节：「能飞」和「不能飞」。"
      en: "A research station deep on the ice cap, drilling ice cores to study past climates, reached by air only in summer. The cores are cut into numbered sections by depth and flown back to Sirmivak in refrigerated cases on the summer flights, the deeper ice holding ever older air. The team say the ice cap has only two seasons: \"flying\" and \"not flying\"."
    in: div_hbdzam
    offset_km: [-15, 8]
  - id: poi_hrcea6
    subtype: nature_reserve
    status: generated
    names:
      zh: 乌瓦卡鲁库维特保护站
      en: Uvvaakkaruquviit Ranger Station
      art-x-tavrunaq: Uvvaakkaruq Naalluvik
    notes:
      zh: "乌瓦卡鲁库维特保护站是西尔米瓦克自由邦乌瓦卡鲁克生态保护区的巡护站，监测海象栖息地和北极熊的迁移。保护区就是东北远海的乌瓦卡鲁库维特群岛，由乌瓦克岛、卡鲁克岛、图拉利克岛和普塔西尔米岛组成，总面积约 2.11 万平方公里，名字合 uvvaak「海象」与 karuq「熊」两词，常住只有约 600 人，是全领地人口最少的区。保护区只允许巡护员和获得许可的科考人员进入，游客只能乘船在外海远远观看。乌瓦克岛的海滩是海象的聚居地，夏天成千上万头海象挤在岸上；冬季北极熊沿海冰来到卡鲁克岛，在积雪中筑窝产仔，小熊出洞之前全岛禁止任何人登陆，连巡护员也只在海上用望远镜观察；群岛环抱的乌瓦克湾是领地最大的命名海湾，冬天的海冰是北极熊捕猎海豹的场所。东端普塔西尔米岛上的巡护员小屋建在高处，屋顶画着一个巨大的白熊图案，方便飞机在雪原上认出它。\n巡护员给常来海岸的北极熊编号建档，熟悉的几只还有外号。保护站的门窗都加了钢栅，熊偶尔会在夜里来门口转悠，巡护员的值班日志里专门有一栏写着「今日来访」。春天海冰开始破裂时，北极熊在冰缘守着海豹的呼吸孔，巡护员说这是一年里最紧张的季节，换班时要先从窗口看一圈，确认门外没有「客人」才开门。站里的人说，在这里住久了，听脚步声就能分出是同事还是熊。"
      en: "The Uvvaakkaruquviit Ranger Station is the ranger station of the Uvvaakkaruq Nature Reserve in the Free State of Sirmivak, watching over the walrus haul-outs and the movements of the polar bears. The reserve is the Uvvaakkaruquviit Islands in the far north-eastern sea, made up of Uvvaak, Karuq, Turralik and Puttasirmi islands, about 21,100 km² in all, its name joining uvvaak, \"walrus\", and karuq, \"bear\"; with only about 600 residents it is the least populous district in the territory. Only rangers and researchers with permits may enter, and visitors may watch only from boats well offshore. The beaches of Uvvaak Island are walrus haul-outs, crowded with thousands in summer; in winter polar bears come over the sea ice to Karuq Island to dig dens in the snow and give birth, and until the cubs emerge no one may land on the island, the rangers themselves watching only from the sea through binoculars; Uvvaak Bay, enclosed by the islands, is the largest named bay in the territory, its winter sea ice the polar bears' seal-hunting ground. On Puttasirmi Island at the eastern end the rangers' hut stands on high ground, its roof painted with a huge white bear so that planes can pick it out on the snowfield.\nThe rangers keep numbered files on the polar bears that visit the coast, and the familiar ones have nicknames. The station's doors and windows are barred with steel, since bears sometimes nose round the door at night, and the duty log has a column headed \"today's visitors\". In spring, when the sea ice starts to break up and the bears wait at the ice edge by the seals' breathing holes, the rangers say it is the tensest season of the year: at every change of shift they look round from the window first and open the door only when they are sure there is no \"guest\" outside. Live here long enough, the station staff say, and you can tell a colleague from a bear by the footsteps."
    in: div_81tqya
  - id: poi_d1fdhw
    subtype: research_institute
    status: generated
    names:
      zh: 西尔米乌维特冰山观测站
      en: Sirmiuviit Iceberg Station
      art-x-tavrunaq: Sirmiuviit Naalluvik
    notes:
      zh: "观测冰川入海与冰山漂移的观测站，为南岸航线发布冰山预报。大冰山一旦从冰川上分离，就会被编号建档，追踪到它化掉为止；冰山预报每天随天气预报一起播出，渔民和船长听完才决定航线。"
      en: "Watches the glaciers calving into the sea and the drift of icebergs, issuing iceberg warnings for the south-coast shipping lanes. Once a large berg calves from the glacier it is given a number and tracked until it melts, and the iceberg forecast goes out daily with the weather, which skippers and fishermen hear before choosing their course."
    in: div_481wnn

  # ── 乌维克萨克市 ──
  - id: poi_9gp6x5
    subtype: mine
    status: generated
    names:
      zh: 乌库乌维特露天矿
      en: Ukkuuviit Open Pit
      art-x-tavrunaq: Ukkuuviit Ukkuvik
    notes:
      zh: "乌库乌维特群岛上的露天矿，精矿在稀土港装船。矿坑一圈圈向下的台阶从机场起降的飞机上看得清清楚楚，像一只巨大的漏斗。矿工两周一轮换，乘飞机往返首府，岛上的孩子把矿里运出来的矿石叫作「彩色石头」，学校的标本柜里摆着一整排。"
      en: "The open-pit mine of the Ukkuuviit Islands, whose concentrate is shipped from Uviqnuqa. The rings of benches descending into the pit are plain to see from planes using the airport, like a giant funnel. Miners work two-week rotations and fly to and from the capital, and island children call the ore that comes out of the pit \"coloured stones\"; the school's specimen cabinet has a whole shelf of them."
    in: div_4ymjbf
    offset_km: [2, 1]
