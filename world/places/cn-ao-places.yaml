      art-x-tavrunaq: Pallurniq Qummar
    notes:
      zh: "帕卢尔尼克冬季花园是金融特区帕卢库特区的玻璃穹顶花园，直径约 360 米，比一旁的卡拉克穹顶更大，终年保持温暖，种着树木和花卉，与周围的塔楼以暖廊相连。穹顶下的暖意来自数据中心的余热：公共银行极地数据中心用极地冷空气冷却，运行账户、支付和 AI 秒批贷款系统，机房的余热经管道送进特区，让穹顶下四季如春。花园离帕卢图阿尔大道不远，大道两侧依次是北冰洋公共银行总部大厦和商业、投资、私人、托管四座附属银行大厦，银行和清算所的员工午休时多半来这里透口气。特区约 18 万人住在 60 平方公里内，暖廊全长约 23 公里，冬天从办公楼走到花园一路不用出户外。\n中午常有人捧着咖啡坐在棕榈树下晒人造的太阳，门外却是零下十几度的极夜。花园里的一株柠檬树是特区的宝贝，每年结的果子都要拿到大厅里展览，有一年只结了三个柠檬，特区的人也照样认认真真地摆了出来。周末常有首府的人家带着孩子来逛，孩子们第一次看见树上长着黄色的果子，总要伸手去摸一摸，园丁就在旁边笑着提醒：「只许看，不许摘。」"
      en: "The Pallurniq Winter Garden is the glass-domed garden of Pallukut District in the financial zone, about 360 m across and larger than Kallaaq Dome beside it, kept warm all year and planted with trees and flowers, linked to the towers around it by skyways. Its warmth comes from data-centre waste heat: the Public Bank Polar Data Centre, cooled by polar air and running the accounts, payments and AI instant-loan systems, pipes its waste heat into the zone and keeps it spring under the dome all year. The garden is not far from Pallutuar Avenue, lined in turn by the Arctic Ocean Public Bank Tower and the four towers of its commercial, investment, private and custody banks, and the staff of the banks and the clearing house mostly come here to catch their breath at lunchtime. The zone houses some 180,000 people in 60 km², its skyways run for about 23 km, and in winter you can walk from office to garden without once going outdoors.\nAt lunchtime people sit under the palms with a coffee in the artificial sunshine while outside lies the polar night at more than ten degrees below zero. A lemon tree is the zone's pride, and its fruit is put on show in the hall each year; one year it bore only three lemons, and the zone set them out just as solemnly. At weekends families from the capital often bring their children, who, seeing yellow fruit growing on a tree for the first time, always reach out to touch it while the gardener smiles and reminds them: \"Look, but don't pick.\""
    in: div_ga9pxy
    offset_km: [-0.4, 0.9]
    site: { layout: dome, size_m: [360, 360] }
  - id: bld_aw19hp
    subtype: dome
    status: generated
    names:
      zh: 卡拉克穹顶
      en: Kallaaq Dome
      art-x-tavrunaq: Kallaaq Qummar
    notes:
      zh: "卡拉克穹顶是帕卢尔尼克金融特区帕卢库特区的一座穹顶，穹顶下是直径约 280 米的人造日光广场，极夜里按白昼的光照点亮，供人们晒「太阳」、做光照疗法。穹顶的名字取自塔夫鲁纳克语 kallaaq「永昼」，灯光模仿一天的日照变化，从清晨的淡金色慢慢变成正午的白光，再在傍晚暗下来。金融特区约 18 万人住在 60 平方公里内，几乎全是塔楼、穹顶和裙楼，约 23 公里的暖廊连起各栋楼；卡拉克穹顶和帕卢尔尼克冬季花园是特区的两座穹顶，也是员工午休和过冬的去处。首府每年有约七十天极夜，特区的居民又以外来的金融、法律和技术人员为主，许多人是第一次在北冰洋过冬，穹顶就是他们熬过极夜的地方。\n冬天领地的医生会给失眠和情绪低落的病人开一张「穹顶处方」，每天来这里晒一小时。午休时间穹顶下坐满了人，有人闭着眼睛仰头晒灯，有人在光下读报、开小会，交易员们说，在这里晒够了光，下午看盘的眼睛都亮一些。回光节那天，真正的太阳重新露出地平线，穹顶的灯会特意调暗，大家走出暖廊去看那几分钟的阳光，再回来接着上班。"
      en: "Kallaaq Dome is a dome in Pallukut District of the Pallurniq Financial Zone, sheltering an artificial-daylight square about 280 m across, lit to daytime levels through the polar night for people to sit in the \"sun\" and take light therapy. Its name is the Tavrunaq kallaaq, \"endless day\", and its light follows the course of a day, shifting from the pale gold of morning to the white of noon and dimming again at dusk. The financial zone houses some 180,000 people in 60 km², almost all of it towers, domes and podiums joined by some 23 km of skyways; Kallaaq Dome and the Pallurniq Winter Garden are its two domes and the places where staff spend their lunch breaks and get through the winter. The capital has about seventy days of polar night a year, and the zone's residents are mostly incomers working in finance, law and technology, many spending their first winter on the Arctic Ocean, for whom the dome is how they get through the dark.\nIn winter the territory's doctors write patients with insomnia or low mood a \"dome prescription\": an hour a day in its light. At lunchtime the dome is full, some with eyes closed and faces turned up to the lamps, others reading the paper or holding small meetings in the light, and traders say that after a good dose of light their eyes are sharper for the screens in the afternoon. On the day of the Return of the Light, when the real sun climbs back over the horizon, the dome's lamps are deliberately dimmed and everyone goes out through the skyways to see those few minutes of sunshine before coming back to work."
    in: div_ga9pxy
    offset_km: [0.0, 0.55]
    site: { layout: dome, size_m: [280, 280] }

  # ── 努卡塔克市 ──
  - id: bld_jkn3vg
    subtype: government
    status: generated
    names:
      zh: 北冰洋领地政府
      en: Government of the Arctic Ocean Territory
      art-x-tavrunaq: Aqqimma Tavru Aaqqivik
    short_names:
      zh: 领地政府
      en: Territorial Government
    notes:
      zh: 北冰洋领地政务院的主楼，在首府努卡塔克市库马尔维克区，是一座回字形的庭院建筑，领地议会也在楼内，以暖廊与中央穹顶相连。政务院是领地的最高行政机关，由领地总理组织，下设十一个部和若干直属机构，各部按职能分成三个楼群：东北是中央派驻机构、对外事务和政策规划，西面是交通、建设、资源和税收，东南是司法、治安、教育和社会事务，三个楼群都以暖廊连到中央穹顶，极夜和暴风雪里也能步行往来；财政部在北面的帕卢尔尼克金融特区。主楼北翼是总理办公室，东翼和南翼是办公厅，西翼是议会议事厅，内院冬季加盖玻璃顶。办公厅下设综合行政局、媒体和出版局、财务局、安全局、档案局、采购局和公务员事务局。
      en: The main building of the Arctic Ocean Territory Executive Council, in Qummarvik District of the capital, Nuqattaaq, is a hollow square round a courtyard that also houses the territorial assembly, joined to the Central Dome by skyways. The Executive Council is the territory's highest executive body, formed by the premier, with eleven ministries and several directly attached bodies grouped by function in three clusters, all linked by skyways to the Central Dome so that staff can walk between them in the polar night and in blizzards. The north-east cluster holds the central government's offices, external affairs and planning, the west cluster transport, construction, resources and taxation, and the south-east cluster justice, public security, education and social affairs; the Ministry of Finance is in the Pallurniq Financial Zone to the north. The north wing holds the Premier's Office, the east and south wings the General Office with its seven bureaus, and the west wing the assembly chamber; in winter the courtyard is roofed over with glass.
    in: div_9s80v8
    offset_km: [0.4, 0.5]
    emblem_of: div_hpmerr
    site: { layout: courtyard, size_m: [300, 240] }
  - id: bld_tvev0q
    subtype: dome
    status: generated
    names:
      zh: 努卡塔克中央穹顶
      en: Nuqattaaq Central Dome
      art-x-tavrunaq: Nuqattaaq Qummar
    wonder:
      zh: 世界最大的穹顶，直径约 700 米，极夜里的人造日光广场
      en: The largest dome in the world, about 700 m across, an artificial-daylight square for the polar night
    notes:
      zh: "努卡塔克中央穹顶是首府中心库马尔维克区的大型玻璃穹顶，直径约 700 米，是世界上最大的穹顶，穹顶下的面积抵得上一整片街区。穹顶下是冬季花园和人造日光广场，极夜里市民在这里散步、晒「太阳」。库马尔维克区的名字就来自穹顶：塔夫鲁纳克语里 qummar 是「穹顶」，-vik 是「处所」，穹顶本身叫 Nuqattaaq Qummar。区里有领地政府与议会、领地的铁路总站努卡塔克站和库马尔大街的商场、酒店与办公楼，政务院各部的楼群也以暖廊连到中央穹顶，地铁在穹顶旁设有努卡塔克中央穹顶站。\n首府每年有约七十天极夜、八十多天极昼。修建穹顶，是为了让市民在漫长的黑夜里也有一处能见到「白天」的公共广场：穹顶的骨架是钢构，外面罩着多层玻璃，层与层之间的空气隔住了外面的严寒，顶上排满模仿日光的灯具，冬天从早到晚按白天的节奏由暗到亮、再由亮到暗。穹顶立在冻土上，地基打着成排的桩，底部的通风层把地面和室内的暖气隔开。穹顶下的冬季花园种着耐阴的乔木、灌木和花卉，小径绕着一片草坪，草坪边是长椅、咖啡馆和热汤店。全区约 53 公里的暖廊把穹顶和商场、办公楼、地铁站连成一片，冬天从家门口一路不出室外就能走到这里。到了八十多天的极昼，穹顶的灯反而关掉，玻璃上拉起遮阳帘，花园里照样凉爽；花园里的花木由园丁常年照看，每年春天把一部分花苗送到各区的学校。\n极夜的七十来天里，穹顶的灯整夜不熄，从城外的高处望去，整座首府像围着一盏灯生长。上午这里多是推着婴儿车的父母和来做早操的老人，中午是附近政府部门和公司的职员，议员们开完会也常穿过暖廊来穹顶下喝一杯咖啡，傍晚学生下课后成群结队地进来写作业。穹顶下的长椅是老人们晒太阳、下棋的地方，许多首府人的第一次约会也在这里。每年回光节前后，穹顶会把灯调暗一个晚上，让人们透过玻璃看头顶的极光，等第二天太阳重新露出地平线。\n首府人习惯说「去穹顶见」，不用说是哪一个。穹顶的玻璃每年夏天由工人吊在绳索上逐块清洗，一圈洗下来要一个多月，市民管他们叫「擦天的人」。医生建议冬天心情低落的人每天来穹顶下坐半小时，于是长椅上常能看到捧着书、闭着眼的人，他们说这是首府最便宜的药。"
      en: "The Nuqattaaq Central Dome is the great glass dome in Qummarvik District at the heart of the capital. About 700 m across, it is the largest dome in the world, covering as much ground as a whole city block. Under it are a winter garden and an artificial-daylight square where people walk and sit in the \"sun\" through the polar night. Qummarvik District takes its name from the dome: in Tavrunaq qummar means \"dome\" and -vik \"place\", and the dome itself is Nuqattaaq Qummar. The district holds the territory's government and parliament, the territorial rail terminus at Nuqattaaq Station and the shops, hotels and offices of Qummar Boulevard; the Executive Council's ministry buildings are linked to the Central Dome by warm corridors, and the metro has a Nuqattaaq Central Dome station beside it.\nThe capital has some seventy days of polar night and more than eighty of midnight sun each year. The dome was built to give people a public square where they could see \"daytime\" even in the long darkness. Its frame is steel clad in several layers of glass, with the air between the layers keeping out the bitter cold, and its roof is lined with lamps that imitate daylight, brightening and dimming through the winter day to the rhythm of real daylight. The dome stands on permafrost on rows of piles, with a ventilated layer at its base keeping the ground apart from the warmth inside. Its winter garden is planted with shade-tolerant trees, shrubs and flowers, with paths circling a lawn edged with benches, cafés and soup shops. Some 53 km of warm corridors in the district tie the dome to the shops, offices and metro stations, so in winter people can walk here from their front doors without once going outside. In the eighty-odd days of midnight sun the lamps are switched off instead and blinds are drawn across the glass to keep the garden cool; gardeners tend the plants all year, and each spring some of the seedlings are sent out to schools across the districts.\nThrough the seventy-odd days of polar night the dome's lights never go out, and from the high ground outside town the whole capital seems to grow around a single lamp. In the mornings it belongs mostly to parents with prams and old people doing their exercises, at midday to staff from the government offices and firms nearby, with members of parliament often coming through the warm corridors for a coffee under the dome after a sitting, and in the evening to schoolchildren arriving in groups to do their homework. Its benches are where old people sit in the light and play chess, and many in the capital had their first date here. Around the Return of the Light each year the dome dims its lights for one night so that people can watch the aurora overhead through the glass while they wait for the sun to clear the horizon the next day.\nPeople in the capital simply say \"see you at the dome\", with no need to say which. Each summer workers hanging on ropes clean the glass pane by pane, a round that takes over a month, and townspeople call them \"the sky cleaners\". Doctors advise anyone feeling low in winter to sit under the dome for half an hour a day, so the benches are often full of people holding a book or sitting with their eyes closed, who call it the cheapest medicine in the capital."
    in: div_9s80v8
    offset_km: [-0.5, -0.3]
    site: { layout: dome, size_m: [700, 700] }
  - id: bld_zd65kz
    subtype: dome
    status: generated
    names:
      zh: 图维尔尤阿克室内海滩
      en: Tuvvirjuaq Indoor Beach
      art-x-tavrunaq: Tuvvirjuaq Qummar
    wonder:
      zh: 世界唯一的室内海滩，四季保持夏日的温度与光照
      en: The only indoor beach in the world, kept at summer warmth and light all year
    notes:
      zh: "图维尔尤阿克室内海滩是世界上唯一的室内海滩，在首府西部的图维尔尤阿克区，是一座直径约 500 米的穹顶，穹顶下是人造沙滩与温水泳池，四季保持夏日的温度与光照。图维尔尤阿克区是首府的住宅与疗养区，27 万人，区内的暖廊全长约 102 公里，是全领地最长的暖廊网络，老年居民的比例是首府最高的；区里另一处出名的地方是冬季举办冰上运动和灯光节开幕式的帕尔尼克体育场。\n首府每年有约七十天极夜，冬天屋外常在零下二十度以下。室内海滩就是为这样的冬天修的：穹顶用多层玻璃和钢构搭成，顶上的灯具模仿夏日正午的阳光，连晒在皮肤上的暖意也做了出来；沙滩用的是细沙，泳池的水常年温热，一角还有缓缓起伏的人造浪。穹顶和首府其他建筑一样立在冻土的桩基上，泳池和沙滩下铺着厚厚的隔热层，免得池水的热量把冻土焐化；玻璃在寒夜里结霜时会通上微弱的暖气，让霜化掉，不遮住灯光。穹顶和区里的暖廊相连，住在附近的人不必出门就能走到更衣室。海滩一年到头开放，白天是家庭和学生，早上和傍晚是来做水中康复和游泳锻炼的老人，区里的医院也把一些病人送来做水疗；因为区里老人多，海滩专门留出一片带扶手的浅水区，给行动不便的人慢慢下水。\n极夜里人们穿着泳衣躺在人造阳光下，门外却是零下二十多度的黑夜，本地人管这叫「三步过季」：脱外套、换泳衣、踩上沙滩。沙滩边有卖冰淇淋和浆果汽水的小摊，也有卖热驯鹿肉汤的，冬天两样卖得一样好。学校冬天常把体育课和游泳课安排到这里，孩子们在沙滩上堆沙堡，堆好以后照例插一面领地的小旗，旗上是夜空、极光和石堆路标。极夜最深的那几天，海滩会办一场「冬至沙滩节」，乐队在沙滩上演奏，人们穿着夏装跳舞到深夜。外地游客最爱拍的一张照片，是穿着泳衣站在玻璃墙前，背后是漆黑的雪夜。\n救生员说冬天比夏天还忙，因为整个首府的孩子都想来过夏天。到了真正的夏天，八十多天的极昼里太阳整夜不落，海滩反倒清静下来，人们都跑到峡湾边去晒真的太阳；管理处趁这时给沙滩过筛，补上被孩子们鞋里、包里带回家的那部分沙子，据说一年带走的沙子能装满好几辆卡车。有人在这里求婚，也有老人每年极夜都来，说是在穹顶下「多过一个夏天，就多活一年」。"
      en: "The Tuvvirjuaq Indoor Beach is the only indoor beach in the world, a dome about 500 m across in Tuvvirjuaq District in the west of the capital, sheltering an artificial beach and a warm pool kept at summer warmth and light all year round. Tuvvirjuaq District is the capital's residential and health district, with 270,000 people; its warm corridors run to about 102 km, the longest network in the territory, and it has the highest share of elderly residents in the capital. Its other well-known venue is the Paarniq Arena, which hosts ice sports and the opening of the light festival in winter.\nThe capital has some seventy days of polar night a year, and in winter it is often below −20 °C outdoors. The indoor beach was built for winters like these. The dome is made of steel and several layers of glass, and its lamps imitate the noon sun of summer, down to the warmth it leaves on the skin; the beach is of fine sand, the pool water is warm all year, and in one corner a gentle artificial swell rises and falls. Like other buildings in the capital the dome stands on piles in the permafrost, and thick insulation lies beneath the pool and the beach so that the heat of the water does not thaw the frozen ground; when frost forms on the glass on cold nights, a faint heating current melts it so that it does not block the light. The dome is joined to the district's warm corridors, so people living nearby can walk to the changing rooms without going outside. The beach is open all year: families and students by day, and in the early morning and evening old people coming for water therapy and exercise swims, while the district's hospitals send some patients here for hydrotherapy; because the district has so many old people, the beach keeps a shallow area with handrails where those who find it hard to get about can ease into the water.\nIn the polar night people lie in swimsuits under artificial sunshine while outside it is dark and below −20 °C; locals call it \"three steps to summer\": coat off, swimsuit on, feet in the sand. Stalls along the beach sell ice cream and berry soda, and hot reindeer soup too, and in winter both sell equally well. Schools often hold their winter PE and swimming lessons here, and children build sandcastles on the beach, each finished castle topped as a matter of course with a little territorial flag showing the night sky, the aurora and the stone cairn. In the darkest days of the polar night the beach holds a \"midwinter beach festival\", with bands playing on the sand and people dancing in summer clothes late into the night. Visitors' favourite photo is of themselves in swimsuits in front of the glass wall, with the black snowy night behind them.\nThe lifeguards say winter is busier than summer, because every child in the capital wants a day of summer. In the real summer, through more than eighty days of midnight sun, the beach goes quiet as people head out to the fjords to sit in the real sun; the management takes the chance to sift the beach and top up the sand carried home in children's shoes and bags, said to fill several lorries a year. People have proposed here, and some old people come every polar night, saying that \"every extra summer under the dome is an extra year of life\"."
    in: div_3b9pkz
    offset_km: [0.6, 0.4]
    site: { layout: dome, size_m: [500, 500] }
  - id: poi_pe1qbx
    subtype: stadium
    status: generated
    names:
      zh: 帕尔尼克体育场
      en: Paarniq Arena
      art-x-tavrunaq: Paarniq Qummar
    notes:
      zh: "帕尔尼克体育场在首府西部的图维尔尤阿克区，是一座带可开合穹顶的体育场，场地约 300 米乘 240 米，冬季合上穹顶举办冰上运动和极夜灯光节的开幕式，夏季开顶举办午夜马拉松的终点仪式。图维尔尤阿克区有 27 万人，是首府的住宅与疗养区，老年居民的比例是首府最高的；区内的暖廊全长约 102 公里，是全领地最长的暖廊网络，住宅街坊、医院、商场和地铁站之间不出户外就能往来，冬天去体育场看比赛的人多半走暖廊过来。附近的图维尔尤阿克室内海滩四季保持夏日的温度和光照，西卢阿高速和环线穿过区内，努阿高速从这里出发通往阿卡尼克。\n极夜灯光节开幕那晚，穹顶下的灯光从全黑慢慢亮起，像一场人造的日出，看台上的人跟着鼓点一起跺脚。午夜马拉松在极昼的太阳下开跑，选手凌晨冲过终点时太阳仍挂在天上，完赛奖牌上印着一轮不落的太阳。区里老人多，冬天体育场的冰面上午留给老人们慢慢滑冰、活动腿脚，下午才轮到球队训练，管理员说这是图维尔尤阿克的老规矩，谁也不会去改。"
      en: "Paarniq Arena in Tuvvirjuaq District in the west of the capital is a stadium with a retractable dome, on a site of about 300 by 240 m; in winter, with the dome closed, it hosts ice sports and the opening of the polar-night light festival, and in summer it is opened to the sky for the finish of the midnight marathon. Tuvvirjuaq, with 270,000 people, is the capital's residential and convalescent district, with the highest proportion of elderly residents in the capital; its skyways run for some 102 km, the longest network in the territory, so that homes, hospitals, shops and metro stations can be reached without going outdoors, and in winter most people come to matches through the skyways. The nearby Tuvvirjuaq Indoor Beach keeps summer warmth and light all year, the Sillua Expressway and the ring road cross the district, and the Nuqattaaq–Aqqanik Expressway starts here on its way to Aqqanik.\nOn the opening night of the light festival the lights under the dome rise slowly from total darkness like a man-made sunrise, and the stands stamp along with the drums. The midnight marathon is run under the midnight sun, and when runners cross the line in the small hours the sun is still in the sky; the finisher's medal bears a sun that never sets. With so many old people in the district, in winter the arena's ice is kept in the mornings for them to skate slowly and stretch their legs, and only in the afternoons do the teams train; the manager says it is an old Tuvvirjuaq rule that nobody would dream of changing."
    in: div_3b9pkz
    offset_km: [-0.8, -0.6]
    site: { layout: stadium, size_m: [300, 240] }
  - id: bld_ygpfcf
    subtype: industrial_park
    status: generated
    names:
      zh: 帕利瓦克垂直农场
      en: Paalivaq Vertical Farm
      art-x-tavrunaq: Paalivaq Pukkuvik
    notes:
      zh: "多层室内农场，用人工光照种植蔬菜和浆果，供应首府大部分的新鲜蔬菜。极夜里农场的粉紫色灯光从一层层窗户里透出来，远看像一座发光的塔。首府的小学生都来这里上过校外课，亲手摘一颗草莓，是许多孩子第一次在冬天吃到刚摘下的水果。"
      en: "A many-storeyed indoor farm growing vegetables and berries under artificial light, supplying most of the capital's fresh greens. In the polar night the farm's pink and violet light shines from floor upon floor of windows, so that from afar it looks like a glowing tower. Every schoolchild in the capital comes here on a class trip, and the strawberry they pick themselves is, for many, their first fruit fresh from the plant in winter."
    in: div_k8cx0t
    offset_km: [0.3, 0.3]
    site: { layout: tower, size_m: [120, 120] }
  - id: poi_m2wh5y
    subtype: university
    status: generated
    names:
      zh: 北冰洋大学
      en: University of the Arctic Ocean
      art-x-tavrunaq: Aqqimma Saalluvik
    notes:
      zh: "北冰洋大学是领地的综合大学，在首府北部的苏瓦利克区，校园约 800 米乘 500 米，以极地工程、冰川学、金融法和塔夫鲁纳克语研究见长。这几门专业都和领地的生计相连：冻土上的建筑大多立在桩基上，极地工程的毕业生去修桩基、防雪棚、桥梁和真空管道；冰川学的学生夏天跟着科考队上冰盖和冰原；金融法的毕业生多去紧邻首府的帕卢尔尼克金融特区，在金融法院、仲裁中心和各家银行工作；塔夫鲁纳克语研究则为占人口一半以上的母语者编词典、录史诗。苏瓦利克区有 30 万人，学生和教师让这里比市中心更年轻，苏瓦利克冰雕园就在附近，努基高速、环线和一条地铁都经过区内。\n毕业典礼在极昼的午夜举行，毕业生把学位帽抛向不落的太阳。冬天学生们最爱去伊马萨尔维克港区的夜宵摊，一碗热鱼汤配一块油炸面饼，看不冻港里的船在冰雾中进出，能坐到深夜。图书馆在极夜里通宵开放，窗灯是苏瓦利克区最晚熄的；夏天学生们在苏瓦基卢克河边烧烤，冬天河岸结了冰，又成了他们越野滑雪的路线。"
      en: "The University of the Arctic Ocean is the territory's university, in Suvvalik District in the north of the capital, on a campus of about 800 by 500 m, known for polar engineering, glaciology, financial law and Tavrunaq studies. Each of these is tied to how the territory makes its living: most buildings on the permafrost stand on piles, and polar engineering graduates go on to build piles, snow sheds, bridges and vacuum tubes; glaciology students go up onto the ice caps and icefields with research teams in summer; financial law graduates mostly go to the Pallurniq Financial Zone next to the capital, to work in the financial court, the arbitration centre and the banks; and Tavrunaq studies compile dictionaries and record epics for the more than half of the population who speak it as their mother tongue. Suvvalik has 300,000 people, its students and staff making it younger than the city centre; the Suvvalik Ice Sculpture Garden is nearby, and the Nuqattaaq–Kiluktuar Expressway, the ring road and a metro line all serve the district.\nGraduation is held at midnight under the midnight sun, the graduates throwing their caps towards a sun that will not set. In winter students favour the night stalls of Immasaarvik Harbour, where a bowl of hot fish soup with a piece of fried dough will keep them sitting late, watching ships come and go through the frost smoke of the ice-free port. The library stays open all night through the polar night, its windows the last lit in Suvvalik; in summer the students barbecue beside the Suvvakiluk River, and once its banks freeze in winter they become the students' cross-country ski route."
    in: div_j06x18
    offset_km: [0.8, -0.6]
    site: { layout: campus, size_m: [800, 500] }
  - id: poi_kx672q
    subtype: plaza
    status: generated
    names:
      zh: 努坎加克灯光广场
      en: Nuqangaq Light Square
      art-x-tavrunaq: Nuqangaq Qavvalu
    notes:
      zh: "努坎加克灯光广场在首府最老的城区努坎加克区，紧挨着老渔港，每年极夜灯光节时布满灯光装置，也是冰雕展的主会场。努坎加克区在努卡塔克峡湾口西岸，由老渔港发展而来，木屋街巷、鱼市和船坞沿用有机的老街网，全区 300 平方公里住着 27 万人，人口密度在首府仅次于库马尔维克区，塔夫鲁纳克语母语者过半，主要街道上方有约 19 公里的暖廊。西卢阿高速穿过区内，向西通往伊马萨尔维克区，环线和一条地铁也经过这里。广场约 300 米乘 200 米，冬季游客在这里看灯、吃烟熏鱼，周围的小馆子卖驯鹿肉汤、熏北极鲑和配浆果酱的油炸面饼。\n极夜里每逢周末晚上，广场上燃起篝火，鼓手敲起皮鼓，人们围着火堆跳舞，老人们常说一句塔夫鲁纳克语：「Qavvaluk tauvvu, qattuk nuqa」，意思是「极光在天上，鼓声在港里」，天再黑，港口也有人气。冰雕展开幕那晚，广场上的灯一盏盏熄灭，只留下冰雕里透出的光，人群在黑暗里齐声倒数；数到零的那一刻，鼓声和欢呼一起响起来，老渔港里的船也跟着鸣笛。"
      en: "Nuqangaq Light Square lies in Nuqangaq District, the capital's oldest quarter, right beside the old fishing harbour; it fills with light installations for the polar-night light festival each year and is the main venue of the ice-sculpture show. Nuqangaq, on the west shore of the mouth of Nuqattaaq Fjord, grew from the old fishing harbour, its lanes of wooden houses, fish market and boatyards keeping the old organic street pattern; 270,000 people live in its 300 km², a density second in the capital only to Qummarvik, more than half of them Tavrunaq speakers by mother tongue, and some 19 km of skyways run above its main streets. The Sillua Expressway passes through the district on its way west to Immasaarvik, and the ring road and a metro line also serve it. The square is about 300 by 200 m; in winter visitors come to see the lights and eat smoked fish, and the little restaurants round it sell reindeer broth, smoked Arctic char and fried dough with berry jam.\nIn the polar night a bonfire is lit here on weekend evenings, drummers beat skin drums and people dance round the fire, and the old people often quote a Tavrunaq saying: \"Qavvaluk tauvvu, qattuk nuqa\", \"the aurora in the sky, the drum in the harbour\": however dark it gets, the harbour is never deserted. On the opening night of the ice-sculpture show the square's lamps go out one by one until only the light inside the sculptures remains, and the crowd counts down together in the dark; at zero the drums and the cheering break out together, and the boats in the old harbour sound their horns."
    in: div_q7cydv
    offset_km: [0.3, 0.2]
    site: { layout: plaza, size_m: [300, 200] }
  - id: poi_fszf6x
    subtype: park
    status: generated
    names:
      zh: 苏瓦利克冰雕园
      en: Suvvalik Ice Sculpture Garden
      art-x-tavrunaq: Suvvalik Kirravik
    notes:
      zh: "苏瓦利克冰雕园在首府北部的苏瓦利克区，在努卡塔克峡湾岸边，占地约 400 米乘 300 米，每年冬季用从峡湾内段采来的冰块雕成城堡、动物和塔夫鲁纳克神话人物。苏瓦利克区有 30 万人，以成排的住宅楼和社区服务为主，北冰洋大学也在区内，冰雕园离校园不远，学生们是最热心的观众和帮手。努卡塔克峡湾长约 79 公里，是领地最长的峡湾，湾口靠暖流终年不冻，内段冬天却冻得结实，采出的冰块又厚又透。首府冰雕展的主会场在努坎加克灯光广场，苏瓦利克冰雕园则是各区居民自己动手的地方；努基高速、环线和一条地铁都经过苏瓦利克区，冬天来看冰雕的人多半坐地铁。\n冰雕由首府各区的居民分头完成，一家人往往要花好几个周末，开园那晚，每一座都要由雕刻它的人家亲手点亮，冰里透出的灯光一座接一座亮起来。春天冰雕融化后，园里会立起一块木牌，记下这一年每座冰雕的名字和作者，木牌一年年排下去，已经成了一排小小的「冰雕家谱」。有的老人每年都来找自家孩子小时候雕的那一座的名字，说冰化了，名字还在。"
      en: "The Suvvalik Ice Sculpture Garden lies in Suvvalik District in the north of the capital, on the shore of Nuqattaaq Fjord, on a site of about 400 by 300 m; each winter blocks cut from the inner fjord become castles, animals and figures from Tavrunaq myth. Suvvalik has 300,000 people, rows of apartment blocks and community services, and the University of the Arctic Ocean is also in the district, not far from the garden, its students the keenest visitors and helpers. Nuqattaaq Fjord, about 79 km long, is the longest fjord in the territory; its mouth stays ice-free all year thanks to the warm current, but its inner reaches freeze hard in winter, and the blocks cut there are thick and clear. The main venue of the capital's ice-sculpture show is Nuqangaq Light Square, while the Suvvalik garden is where residents of every district do the carving themselves; the Nuqattaaq–Kiluktuar Expressway, the ring road and a metro line all serve Suvvalik, and most winter visitors come by metro.\nThe sculptures are carved by residents of each district of the capital, a family often spending several weekends on one, and on opening night each is lit by the family that made it, the light inside the ice coming on sculpture after sculpture. When they melt in spring a wooden board goes up listing that year's sculptures and their makers, and year after year the boards have lined up into a little \"family tree of ice\". Some old people come back every year to find the name of the sculpture their children carved when they were small: the ice has melted, they say, but the name is still there."
    in: div_j06x18
    offset_km: [-0.5, 0.5]
    site: { layout: park, size_m: [400, 300] }
  - id: poi_87xwcx
    subtype: golf_course
    status: generated
    names:
      zh: 尼尔萨库特午夜高尔夫球场
      en: Nirsakut Midnight Sun Golf Course
      art-x-tavrunaq: Kallaaq Puttuvik
    notes:
      zh: "建在苔原上的高尔夫球场，极昼时节午夜也能开球。球道要和苔原上的驯鹿分享，场边立着「驯鹿优先」的牌子，球被驯鹿踩进地里可以无罚杆重打。每年极昼时节，球场举办一场午夜十二点整开球的比赛。"
      en: "A golf course laid out on the tundra, where in the season of the midnight sun players tee off at midnight. The fairways are shared with the tundra's reindeer, signs beside them read \"reindeer have right of way\", and a ball trodden into the ground by a reindeer may be replayed without penalty. Each year in the midnight sun the course holds a tournament that tees off at the stroke of midnight."
    in: div_k4vyb1
    offset_km: [1.5, 1.5]
    site: { layout: park, size_m: [1500, 900] }
  - id: poi_bq9v4n
    subtype: stadium
    status: generated
    names:
      zh: 伊马萨尔维克冰上赛车场
      en: Immasaarvik Ice Speedway
      art-x-tavrunaq: Sirmi Sukkavik
    notes:
      zh: "伊马萨尔维克冰上赛车场在首府的伊马萨尔维克区，是冬季在冻结的湖面上开辟的赛车场，场地长约 1.5 公里，举办冰上赛车和雪地摩托比赛。伊马萨尔维克区是首府的港口区，在首府西部的南岸，有 15 万人，伊马萨尔维克港区的突堤上排着集装箱、矿石、油品和滚装码头，乌库利特真空磁悬浮重载铁路在这里的货运站结束；港湾靠暖流终年不冻，区内的湖面冬天却冻得结结实实，正好用来赛车。赛车场只在冬天存在，春天冰一化，赛道的标志、观众站的雪堆和指示牌都要撤走，湖面重新变回钓鱼和划船的地方。乌库利特高速从区内北上，西卢阿高速穿过区内，环线绕过港区，比赛日从首府各区开车过来都很方便。\n湖冰要厚过一米才开赛，每天早上工作人员在赛道上钻孔量冰，把冰厚写在入口的牌子上，冰厚不够的日子，牌子上只写「明天再来」。比赛日观众站在湖岸的雪堆上，一边烤驯鹿肉肠一边看赛车在冰上甩尾，雪地摩托卷起的雪雾在灯光下像一道道白烟。港区的码头工人下了夜班常直接过来看比赛，他们说看了一整夜的船慢慢进港，就想看点快的。"
      en: "The Immasaarvik Ice Speedway in Immasaarvik District of the capital is a racetrack laid out each winter on a frozen lake, on a site about 1.5 km long, for ice racing and snowmobile events. Immasaarvik is the capital's port district on the south coast west of the city centre, with 150,000 people; the moles of Immasaarvik Harbour hold container, ore, oil and ro-ro terminals, and the Ukkuliit Vacuum Maglev Heavy-Haul Railway ends at its freight station here. The warm current keeps the harbour open all year, but the district's lake freezes hard in winter, just right for racing. The speedway exists only in winter: when the ice melts in spring the track markers, the spectators' snowbanks and the signs are all cleared away, and the lake goes back to fishing and boating. The Ukkuliit Expressway heads north from the district, the Sillua Expressway runs through it and the ring road skirts the harbour, so on race days it is an easy drive from every part of the capital.\nRacing starts only once the lake ice is over a metre thick; every morning the staff drill the track to measure it and post the figure at the gate, and on days when the ice is not thick enough the sign simply says \"come back tomorrow\". On race days spectators stand on the snowbanks along the shore, grilling reindeer sausages as the cars slide sideways across the ice, the snow thrown up by the snowmobiles hanging like white smoke in the floodlights. Dockers from the harbour often come straight from the night shift to watch; after a whole night of ships creeping into port, they say, they want to see something fast."
    in: div_jvwq60
    offset_km: [-1.5, 2]
    site: { layout: park, size_m: [1500, 700] }
  - id: poi_2mw1wp
    subtype: airport
    status: generated
    names:
      zh: 努卡塔克国际机场
      en: Nuqattaaq International Airport
      art-x-tavrunaq: Nuqattaaq Tirravik
    notes:
      zh: "努卡塔克国际机场是领地的国际枢纽机场，在首府东北的尼尔萨库特区，场区长约 4 公里，跑道配有融雪加热系统，极夜和暴风雪中也能起降。领地与其他领地没有陆路相连，对外只靠航空和破冰海运，这座机场是大多数人出入领地的大门。地铁 1 号线从库马尔维克区一路通到航站楼下的努卡塔克国际机场站，全长约 85 公里；一条约 6 公里的机场公路通往航站楼，帕卢尔尼克高速早晚高峰的车流里，有不少是赶往机场的旅客。尼尔萨库特区面积近 4000 平方公里，只有 4.5 万人，跑道外就是放牧驯鹿的苔原，尼尔萨库特午夜高尔夫球场也在区内。\n到达大厅的大钟下面有一块屏幕，极夜里倒数离回光节日出还有多少天，极昼里倒数离第一次日落还有多少天，常有旅客站在屏幕前拍照留念。冬夜里降落的旅客从舷窗里看到的第一样东西，常常是头顶的极光；金融特区和数据中心的外来从业者第一次落地时，来接机的同事总会提醒一句：「先抬头，再拿行李。」回光节前后航班最满，在外地读书和工作的人都赶回来，要和家人一起看太阳重新升起。"
      en: "Nuqattaaq International Airport is the territory's international hub, in Nirsakut District north-east of the capital; its site is about 4 km long and its runways are heated against snow, so that flights operate through the polar night and blizzards. The territory has no land link with any other territory and reaches the outside world only by air and icebreaker shipping, so this airport is the front door through which most people come and go. Metro Line 1 runs all the way from Qummarvik District to Nuqattaaq International Airport station beneath the terminal, about 85 km; an airport road of some 6 km leads to the terminal, and much of the rush-hour traffic on the Pallurniq Expressway is passengers heading for their flights. Nirsakut covers nearly 4,000 km² with only 45,000 people; beyond the runways lies tundra where reindeer are herded, and the Nirsakut Midnight Sun Golf Course is in the district too.\nBeneath the great clock in the arrivals hall a screen counts down, in the polar night, the days to the sunrise of the Return of the Light and, in the midnight sun, the days to the first sunset, and travellers often stop to photograph it. For passengers landing on a winter night the first thing seen from the window is often the aurora overhead; when incomers to the financial zone and the data centres land for the first time, the colleagues meeting them always say: \"Look up first, then get your bags.\" Flights are fullest around the Return of the Light, when people studying and working away all come home to watch the sun rise again with their families."
    in: div_k4vyb1
    offset_km: [5, -3]
    site: { size_m: [4000, 1400], layout: airport, angle_deg: 80 }
  - id: poi_n4rxbp
    subtype: port
    status: generated
    names:
      zh: 伊马萨尔维克港区
      en: Immasaarvik Harbour
      art-x-tavrunaq: Immasaarvik Nuqa
    notes:
      zh: "伊马萨尔维克港区在首府的伊马萨尔维克区，在首府西部的南岸，是领地最大的港区，占地约 15 平方公里。暖流让港湾终年不冻，突堤上有集装箱、矿石、油品和滚装码头，乌库利特真空磁悬浮重载铁路在这里的伊马萨尔维克货运站结束，内陆矿区的矿石由无人驾驶的冰原 600 型重载列车装在货运舱里运来，每列约 1 万吨、每天 10 列重车，矿石在港口直接装船，无人驾驶列车的调度中心也设在区内。领地与其他领地没有陆路相连，燃料、食品和建材大多经海运进入，这里是最重要的入口。乌库利特高速从区内北上，西卢阿高速穿过区内，环线绕过港区；进出港的船只夜里靠库利昆纳尔岬的灯塔指引航道。\n冬天港池上常飘着冰雾，船只像从雾里浮出来一样进出港。码头边的夜宵摊是苏瓦利克区大学生的去处，一碗热鱼汤配一块油炸面饼，看着灯火下的不冻港能坐到深夜。金融特区公共投资银行的分析员常说，看一眼港里矿石船的多少，就知道今年的行情好不好；码头上的老工人听了只是笑笑，说船多船少，冰雾里的活儿都一样得干。"
      en: "Immasaarvik Harbour lies in Immasaarvik District of the capital on the south coast west of the city centre, the largest harbour in the territory, covering about 15 km². A warm current keeps it open all year; its moles hold container, ore, oil and ro-ro terminals, and the Ukkuliit Vacuum Maglev Heavy-Haul Railway ends here at Immasaarvik freight station, bringing ore from the inland mining zone in the freight pods of driverless Icefield 600 heavy-haul trains, some 10,000 t a train and ten loaded trains a day, to be loaded straight onto ships; the control centre for the driverless trains is also in the district. The territory has no land link with any other, so most fuel, food and building materials come in by sea, and this is the most important gateway. The Ukkuliit Expressway heads north from the district, the Sillua Expressway runs through it and the ring road skirts the harbour; ships coming and going at night steer by the lighthouse on Qullikunnar Point.\nIn winter frost smoke drifts over the basins and ships seem to rise out of the mist as they come and go. The night stalls on the quay are where the students of Suvvalik go: a bowl of hot fish soup with a piece of fried dough, and they will sit late watching the lights of the ice-free port. Analysts at the Public Investment Bank in the financial zone like to say that one look at how many ore ships are in port tells you how the year's market is going; the old dockers just smile at that, saying that many ships or few, the work in the frost smoke has to be done just the same."
    in: div_jvwq60
    site: { size_m: [6000, 3500], layout: harbour, terminals: [container, bulk, bulk, oil, roro] }

  # ── 萨尔瓦克市 ──
  - id: poi_mfm115
    subtype: port
    status: generated
    names:
      zh: 萨尔努卡渔港
      en: Saarnuqa Fishing Harbour
      art-x-tavrunaq: Ulik Nuqa
    notes:
      zh: "萨尔努卡渔港在萨尔瓦克市的城区萨尔努卡区，在萨尔苏瓦峡湾口，是南岸最大的渔港之一，深海渔船和养殖运输船在这里卸货，周围是冷库和水产加工厂，港区约 800 米乘 600 米。暖流让港口终年不冻；萨尔瓦克市有 59.3 万人，其中萨尔努卡区 26 万人，老城的街巷沿港湾自然展开。养殖运输船从西南海上的乌利库维特群岛运来鲑鱼和北极红点鲑，那里的乌利库维特深海养殖基地在海湾里排列着网箱，萨尔瓦克人把那片海叫作「海上牧场」。萨尔瓦克站是西卢阿真空磁悬浮的车站，城区有一条地铁和约 15 公里的暖廊，西卢阿高速经过区内，普拉苏瓦公路从这里通往峡湾深处的村镇，峡湾里的鱼也有不少顺着这条路运到港口。\n鱼市每天清晨开市，最受欢迎的是整条的养殖鲑鱼和烟熏了一夜的北极红点鲑。本地人的吃法是把鱼切成薄片冻硬，蘸着海盐和浆果酱生吃。极夜里渔港的灯火和峡湾口的灯塔连成一条光带，晚归的渔船远远就能认出家的方向；渔民的孩子从小在码头上长大，分得清每条船的汽笛声，听见自家的船回来，就跑去帮着拉缆绳。"
      en: "Saarnuqa Fishing Harbour lies in Saarnuqa District, the city proper of Saarvaq, at the mouth of Saarsuvva Fjord; one of the larger fishing harbours of the south coast, it is where deep-sea trawlers and fish-farm carriers land their catch, surrounded by cold stores and fish-processing plants on a site of about 800 by 600 m. The warm current keeps it free of ice all year; Saarvaq City has 592,800 people, 260,000 of them in Saarnuqa, whose old lanes spread naturally round the harbour. The fish-farm carriers bring salmon and Arctic char from the Ulikuviit Islands in the sea to the south-west, where the Ulikuviit Aquaculture Base lines its bays with net pens and Saarvaq people call the water \"the sea ranch\". Saarvaq station is a stop on the Sillua Vacuum Maglev, the town has a metro line and some 15 km of skyways, the Sillua Expressway passes through the district, and the Pullasuvva Road runs from here to the villages deep in the fjord, bringing much of their fish to the harbour.\nIts fish market opens at dawn, the favourites being whole farmed salmon and Arctic char smoked overnight. Locals eat fish sliced thin, frozen hard and dipped in sea salt and berry jam. In the polar night the harbour lights and the lighthouse at the fjord mouth form one band of light by which boats coming home late can make out the way from far off; fishermen's children grow up on the quay and know every boat's whistle, and when they hear their own family's boat coming in they run to help with the mooring lines."
    in: div_3rb2ha
    site: { size_m: [800, 600], layout: port }
  - id: poi_v92f2k
    subtype: industrial_park
    status: generated
    names:
      zh: 乌利库维特深海养殖基地
      en: Ulikuviit Aquaculture Base
      art-x-tavrunaq: Ulikuviit Pukkuvik
    notes:
      zh: "群岛间海湾里的深海网箱养殖基地，岸上是孵化场与加工厂。网箱里养着鲑鱼和北极红点鲑，养殖工人每天坐船出海喂鱼，萨尔瓦克人因此把这片群岛叫作「海上牧场」。每批鱼苗出海放进网箱时，孵化场的老工人会在船头敲三下皮鼓，祝它们在冷水里长得又肥又结实。"
      en: "Deep-water fish pens in the bays between the islands, with hatcheries and processing plants on shore. The pens hold salmon and Arctic char, and the workers go out by boat every day to feed them, which is why Saarvaq people call these islands \"the sea pastures\". When each batch of fry goes out to the pens, the old hands from the hatchery beat a skin drum three times at the bow, wishing the fish a fat, strong life in the cold water."
    in: div_2541fx
    offset_km: [0.4, 0.3]
    site: { layout: complex, size_m: [400, 250] }
  - id: poi_284059
    subtype: nature_reserve
    status: generated
    names:
      zh: 通纳库特玄武岩柱保护区
      en: Tuunnaqut Basalt Pillars Reserve
      art-x-tavrunaq: Tuunnaqut
    notes:
      zh: "通纳库特玄武岩柱保护区在萨尔瓦克市的通纳库特生态保护区，是通纳克岛海岸上成排的六角形玄武岩柱，石柱高出海面，崖上栖息着海鸦与北极鸥。通纳库维特群岛在南岸西部的海上，由通纳克岛、米尔尼克岛和尼帕克图克岛组成，总面积约 7000 平方公里，群岛因这些岩柱得名，名字里的 tuun 在塔夫鲁纳克语里意为「石」。整片群岛划为生态保护区，常住约 1800 人，多为巡护员和渔民；米尔尼克岛由深色的玄武岩构成，雨后发黑发亮，尼帕克图克岛的海浪冲进岩柱之间的缝隙，发出像管风琴一样的声音。保护区只开放一条海上观光航线，游客只能乘船在保护距离外观看。\n塔夫鲁纳克人的传说里，这些石柱是海神为海鸦搭的石梯，所以崖下从不捕鸟。夏天坐船从海上看，成千上万只海鸟停在石柱的每一级「台阶」上，叫声盖过了浪声；游船绕着岩柱缓缓驶过，船长会关掉马达，让乘客听海浪在石柱间回响。附近的渔民出海路过时，习惯朝石梯的方向点一下头，说是跟海神打个招呼，求一趟平安，回港时再点一次，算是道谢。"
      en: "The Tuunnaqut Basalt Pillars Reserve lies in the Tuunnaqut Nature Reserve of Saarvaq City: rows of hexagonal basalt columns standing out of the sea along the shore of Tuunnaq Island, their cliffs home to guillemots and Arctic gulls. The Tuunnaquviit Islands lie in the sea off the western part of the south coast, made up of Tuunnaq, Mirnik and Nipaqtuuq islands, about 7,000 km² in all, and are named for these columns, tuun being Tavrunaq for \"stone\". The whole archipelago is a nature reserve with some 1,800 residents, mostly rangers and fishermen; Mirnik Island is built of dark basalt that turns black and gleaming after rain, and on Nipaqtuuq Island the waves rush into the gaps between the columns with a sound like an organ. The reserve opens only one sightseeing route by sea, and visitors may watch only from boats outside the protective distance.\nIn Tavrunaq legend the pillars are a stair the sea spirit built for the guillemots, so birds are never taken below the cliffs. Seen from a boat in summer, thousands of seabirds sit on every \"step\" of the columns, their calls louder than the surf; the boats drift slowly round the pillars, and the skippers cut the engines so that passengers can hear the waves echoing among the stones. Local fishermen passing on their way out nod towards the stair to greet the sea spirit and ask for a safe trip, and nod again on the way home to say thank you."
    in: div_jd4ms5
    offset_km: [1, 1]
    site: { layout: park, size_m: [800, 600] }

  # ── 乌库拉克市 ──
  - id: poi_4q9gx3
    subtype: port
    status: generated
    names:
      zh: 乌库努卡散货码头
      en: Ukkunuqa Bulk Terminal
      art-x-tavrunaq: Ukkunuqa
    notes:
      zh: "乌库努卡散货码头在乌库拉克市乌库努卡区，在乌库苏瓦峡湾的湾口，基萨尔维克冶炼厂的产品和东部矿山的矿石从这里装船，另有一座油品码头。港区占地约 4 公里乘 2.5 公里，两座散货码头和油品码头并排，旁边是物流仓库。乌库努卡区是乌库拉克的城区和港口，有 21 万人；乌库拉克站是西卢阿真空磁悬浮的东端终点，西卢阿高速在这里由南岸折向北，以长约 10 公里的乌库努卡高架桥过城。基萨尔维克冶炼厂冶炼内陆矿区的镍矿石，靠乌库基卢克河上的水电站供电。进出港的船只在夜里靠伊卢克萨特区南岸的库利昆纳尔岬灯塔指引航道。\n暖流让码头终年不冻，冬天码头工人穿着电热工作服在冰雾里作业，呼出的气在帽檐上结成白霜。巨大的矿石堆场用拱顶棚罩住，既防粉尘外泄，也免得矿石被大雪埋住。峡湾两岸的山坡上，冶炼厂换班时的灯光一阵亮一阵暗，码头的人也跟着这个节奏过日子，本地人说「看峡湾的灯就知道换班了」。下了班的码头工人最爱去峡湾边的小馆子喝一碗热鱼汤，聊的多半是今天来了几条船。"
      en: "The Ukkunuqa Bulk Terminal lies in Ukkunuqa District of Ukkulaaq City at the mouth of Ukkusuvva Fjord; the Qissarvik smelter's output and the ore of the eastern mines are shipped here, with an oil terminal beside them. The port covers a site of about 4 by 2.5 km, two bulk terminals and the oil terminal side by side with warehouses next to them. Ukkunuqa is the city proper and port of Ukkulaaq, with 210,000 people; Ukkulaaq station is the eastern terminus of the Sillua Vacuum Maglev, and the Sillua Expressway turns north from the south coast here, crossing the town on the Ukkunuqa Viaduct, about 10 km long. The Qissarvik smelter smelts nickel ore from the inland mining zone on power from hydro plants on the Ukkukiluk River. Ships coming and going at night steer by the lighthouse on Qullikunnar Point on the south shore of Illuqsaat District.\nThe warm current keeps the quays free of ice all year, and in winter the dockers work through the frost smoke in electrically heated overalls, their breath freezing white on the brims of their caps. The huge ore stockyards are roofed with vaulted sheds, both to keep the dust in and to stop the ore being buried by snow. On the slopes along the fjord the smelter's lights brighten and dim as the shifts change, and the dock follows the same rhythm; locals say \"watch the lights on the fjord and you know the shift has changed\". Off duty, the dockers like nothing better than a bowl of hot fish soup in a little place by the fjord, talking mostly about how many ships came in that day."
    in: div_yh6ysj
    site: { size_m: [4000, 2500], layout: harbour, terminals: [bulk, bulk, oil] }
  - id: poi_dftw4b
    subtype: factory
    status: generated
    names:
      zh: 基萨尔维克冶炼厂
      en: Qissarvik Smelter
      art-x-tavrunaq: Qissarvik Ukkuvik
    notes:
      zh: "冶炼内陆矿区的镍矿石，用水电和余热为镍城供暖。工厂每八小时换一次班，换班时整座城的公交、食堂和澡堂都跟着忙一阵，本地人约时间常说「早班后」「夜班前」。夜班工人下班时，食堂专门留着一锅热鱼汤。"
      en: "Smelts the nickel ore of the inland mines, its hydro power and waste heat warming Qissarvik. The plant changes shifts every eight hours, and each changeover sets the town's buses, canteens and bathhouses bustling, so locals arrange to meet \"after the early shift\" or \"before nights\". A pot of hot fish soup is kept in the canteen for the night shift coming off."
    in: div_1d76zf
    offset_km: [1, -0.5]
    site: { layout: complex, size_m: [600, 400] }
  - id: poi_gbvc9f
    subtype: hotel
    status: generated
    names:
      zh: 卡瓦卢维特观光度假村
      en: Qavvaluviit Lodge
      art-x-tavrunaq: Qavvalu Tuqqavik
    notes:
      zh: "玻璃屋顶的客房散布在岛上，冬季躺在床上就能看极光。度假村给每位客人一个「极光闹钟」：夜里极光一出现，前台就挨个打电话叫醒客人，有人一个冬天被叫醒十几次也毫无怨言。早餐桌上最受欢迎的是热浆果粥，配着讲昨夜极光的故事。"
      en: "Glass-roofed cabins scattered over the island, where guests watch the aurora from their beds in winter. The lodge gives every guest an \"aurora alarm\": when the lights appear at night, reception rings each room in turn, and some guests are woken a dozen times in a winter without a word of complaint. The breakfast favourite is hot berry porridge, served with stories of the night's aurora."
    in: div_7ee7ab
    offset_km: [0.4, 0.2]
    site: { layout: complex, size_m: [300, 200] }

  # ── 图利瓦克市 ──
  - id: bld_jn8t64
    subtype: data_centre
    status: generated
    names:
      zh: 图卡尔尤阿克数据中心
      en: Tukkarjuaq Data Centre
      art-x-tavrunaq: Tukkaruvik Tulli
    notes:
      zh: "图卡鲁维特群岛上最大的数据中心，用极地冷空气和海水冷却，余热为岛上的住宅供暖。排出的热水送进图利瓦克的游泳馆和温室，本地人开玩笑说自己是「泡在服务器的洗澡水里游泳」。机房里冷风呼呼地吹，值班工程师一年四季都穿着抓绒衣。"
      en: "The largest data centre on the Tukkaruviit Islands, cooled by polar air and sea water, its waste heat warming the island's homes. The warm water it discharges goes on to Tullivaq's swimming pools and greenhouses, so locals joke that they \"swim in the servers' bathwater\". Cold air roars through the halls, and the engineers on duty wear fleeces all year round."
    in: div_3xz1pw
    offset_km: [0.5, 0.3]
    site: { layout: complex, size_m: [500, 350] }
  - id: bld_tdvdfy
    subtype: data_centre
    status: generated
    names:
      zh: 北极光算力中心
      en: Northern Lights Compute Centre
      art-x-tavrunaq: Qavvalu Tukkaruvik
    notes:
      zh: "为人工智能训练出租算力的数据中心，海底光缆从这里连到世界各地。大楼外墙的灯带随着算力负载变换颜色，本地人看一眼墙色就知道「机器今天忙不忙」。中心的食堂按全球时区排班开饭，什么时候去都有热饭。"
      en: "A data centre renting out computing power for training artificial intelligence, linked to the world by undersea cables. The light strips on its façade change colour with the computing load, so locals can tell at a glance \"how busy the machines are today\". The canteen keeps hours for every time zone, so there is a hot meal whenever you turn up."
    in: div_3xz1pw
    offset_km: [-0.6, -0.4]
    site: { layout: complex, size_m: [500, 350] }
  - id: poi_rw025x
    subtype: ground_station
    status: generated
    names:
      zh: 陶武维特地面站
      en: Tauvvuviit Ground Station
      art-x-tavrunaq: Tauvvu Saqqavik
    notes:
      zh: "极轨卫星每一圈都经过高纬度上空，这里的天线阵接收卫星数据并转发到图卡鲁维特群岛。地面站一天要接收几十次过境的卫星数据，值班员有个习惯，每颗卫星飞过头顶就在黑板上画一道，一年下来黑板要擦好几百次。"
      en: "Polar-orbiting satellites pass over the high latitudes on every orbit; the antenna field here downloads their data and passes it to the Tukkaruviit Islands. The station takes dozens of satellite passes a day, and the duty staff chalk a stroke on a blackboard for each satellite overhead, wiping the board hundreds of times a year."
    in: div_6p8a1q
    offset_km: [2, 1]
    site: { size_m: [2400, 1400], layout: antenna, variant: large, angle_deg: 0 }

  # ── 考尔尼克市 ──
  - id: poi_0gf0jv
    subtype: mine
    status: generated
    names:
      zh: 考卢尤阿克钻石矿
      en: Qaulujjuaq Diamond Mine
      art-x-tavrunaq: Qauluk Ukkuvik
    notes:
      zh: "内陆矿区的露天钻石矿，矿石在考卢尤阿克区切割加工。冬天气温跌到零下四十多度时，矿用卡车的发动机和轮胎要整夜加热，否则第二天就发动不了。矿区的每一道工序都在监控镜头下进行，工人下班要过安检，本地人笑说这里「连一粒沙子都走不出矿区大门」。"
      en: "An open-pit diamond mine in the inland mining zone; its stones are cut and polished in Qaulujjuaq District. When winter temperatures drop below −40 °C the haul trucks' engines and tyres must be heated all night or they will not start in the morning. Every stage of the work happens under the cameras and workers pass through security at the end of a shift; locals joke that \"not a grain of sand leaves the mine gate\"."
    in: div_m541k8
    offset_km: [-6, 4]
    site: { layout: mine, size_m: [3000, 2200] }
  - id: poi_xk1xwm
    subtype: mine
    status: generated
    names:
      zh: 乌库利特镍矿
      en: Ukkuliit Nickel Mine
      art-x-tavrunaq: Qissar Ukkuvik
    notes:
      zh: "露天镍矿，矿石由无人驾驶的重载列车装在货运舱里，经低真空管道运往不冻港。列车由调度中心远程监控；管道在沿线的每一条驯鹿迁徙通道上都架高到离地五米，驯鹿群从下面走过，列车不用停下来等，这是修线时和牧民长老商定的做法。"
      en: "An open-pit nickel mine whose ore travels to Immasaarvik in the capsules of driverless heavy-haul trains, along a low-vacuum tube. The trains are watched remotely from a control centre, and over every reindeer migration path along the line the tube is raised five metres off the ground, so the herds walk underneath and no train has to stop for them: an arrangement agreed with the herders' elders when the line was built."
    in: div_m541k8
    offset_km: [7, -3]
    site: { layout: mine, size_m: [2600, 1800] }
  - id: poi_pf0bmd
    subtype: factory
    status: generated
    names:
      zh: 伊卢克萨特提锂厂
      en: Illuqsaat Brine Works
      art-x-tavrunaq: Illuqsaat Ukkuvik
    notes:
      zh: "从盐湖卤水中提取锂，产品供应电池工厂。夏天的阳光下，卤水池呈现深浅不一的蓝绿色，从飞机上看像一块调色板。冬天卤水池结冰停产，工人们转去室内的精制车间，等到春天冰化再重新开池。"
      en: "Extracts lithium from the brine of the salt lakes for battery makers. In the summer sun the brine pools shine in every shade of blue and green, like a painter's palette seen from the air. In winter the pools freeze and production moves to the indoor refining halls, and the pools are reopened when the ice melts in spring."
    in: div_qaxzqj
    offset_km: [-2.2, 3.1]
    site: { layout: complex, size_m: [600, 400] }
  - id: poi_shv5ep
    subtype: factory
    status: generated
    names:
      zh: 考卢尤阿克钻石切割中心
      en: Qaulujjuaq Diamond Cutting Centre
      art-x-tavrunaq: Qauluk Kirravik
    notes:
      zh: "内陆钻石矿的原石在这里切割、抛光和分级。切割中心对游客开放，隔着玻璃能看切割师把一颗毛坯钻石慢慢磨出几十个刻面。按考尔尼克的老规矩，年轻人求婚要送一颗用自己在矿区干活攒的钱买下的小钻石。"
      en: "Where the rough stones of the inland mine are cut, polished and graded. The centre is open to visitors, who watch through glass as cutters slowly grind a rough stone into dozens of facets. By Qaurniq's old custom, a young person proposing gives a small diamond bought with money saved from working at the mines."
    in: div_k66r1n
