  - id: bld_qnj9nv
    subtype: museum
    status: generated
    names:
      zh: 塔夫鲁利特文化中心
      en: Tavrulit Cultural Centre
      art-x-tavrunaq: Tavrulit Qattuvik
    notes:
      zh: "塔夫鲁利特文化中心在塔夫鲁利特原住民自治区的首府阿卡尼克区，收藏岩雕、骨雕与皮鼓，传唱口述史诗，每年冬至举办鼓舞节。中心是一座长约 220 米的会堂式建筑，离塔夫鲁利特长老议事会和阿卡尼克雪橇赛场都不远。自治区有 66.8 万人，塔夫鲁纳克语母语者占 72%，比例是各市中最高的，狗拉雪橇赛、鼓舞、口述史诗和岩雕骨雕在这里代代相传。北岸外海的皮图库维特岩雕刻在海边岩石上，有些只在退潮时露出水面，禁止拓印和触摸，塔夫鲁利特的孩子们就在文化中心里用复制品学着描画祖先刻下的鲸、海豹和皮划艇。骨雕工匠的作品是自治区最受欢迎的手艺品，中心的工作间里常能看到老师傅带着徒弟打磨驯鹿角。\n极夜里中心的会堂一连几个晚上举行史诗诵唱，长老们伴着皮鼓的节奏口述祖先的故事，孩子们从小就能背出长长的段落，背错一句，台下的老人会轻轻敲一下鼓提醒。鼓舞节那晚，会堂里的每一面皮鼓都要被敲响，连馆藏的老鼓也不例外，鼓声从会堂一直传到街上，阿卡尼克人说那一夜「整座城都在心跳」。"
      en: "The Tavrulit Cultural Centre stands in Aqqanik District, capital of the Tavrulit Indigenous Autonomous Region; it holds rock and bone carvings and skin drums, keeps the oral epics alive and hosts a drum-dance festival every midwinter. The centre is a hall-like building about 220 m long, not far from the Tavrulit Council of Elders and the Aqqanik Sled Race Grounds. The region has 667,700 people, 72% of them Tavrunaq speakers by mother tongue, the highest share of any city-level division, and dog-sled racing, drum dancing, oral epic and rock and bone carving are handed down here from generation to generation. The Pitukuviit Rock Carvings off the north coast are cut into the shore rocks, some showing only at low tide, and may not be rubbed or touched, so Tavrulit children learn to draw the whales, seals and kayaks their ancestors carved from replicas at the cultural centre. The bone carvers' work is the region's most popular craft, and in the centre's workshop old masters can often be seen polishing reindeer antler with their apprentices.\nIn the polar night its hall holds epic recitals for several nights running, the elders telling their ancestors' stories to the beat of skin drums, and children learn long passages by heart; if one slips a line, an old man in the audience taps a drum softly as a reminder. On the night of the drum-dance festival every drum in the hall is played, even the old ones from the collection, and the drumming carries from the hall out into the streets; Aqqanik people say that on that night \"the whole town has a heartbeat\"."
    in: div_ek897t
    offset_km: [-0.4, -0.2]
    site: { layout: hall, size_m: [220, 140] }
  - id: poi_vdv110
    subtype: stadium
    status: generated
    names:
      zh: 阿卡尼克雪橇赛场
      en: Aqqanik Sled Race Grounds
      art-x-tavrunaq: Sukkiaq Sukkavik
    notes:
      zh: "阿卡尼克雪橇赛场在塔夫鲁利特原住民自治区首府阿卡尼克区，是狗拉雪橇赛的起点与终点，场地约 1.4 公里乘 0.7 公里，长距离赛沿传统雪橇道穿越苔原。阿卡尼克有 29.1 万人，塔夫鲁利特长老议事会和文化中心都在区内；自治区 66.8 万人，塔夫鲁纳克语母语者占 72%，狗拉雪橇赛、鼓舞、口述史诗和岩雕骨雕是代代相传的传统。阿卡皮图克公路从阿卡尼克向东经三角洲湿地通往基卢克图阿尔，雪橇道与公路交叉处设有专用通道，冬季雪橇优先通行；比赛期间，阿卡尼克机场挤满了从各地赶来的选手和观众，雪橇犬也坐飞机来。平日里赛场是驯犬和训练的地方，冬天的周末常有孩子在这里跟着大人学赶雪橇，先学会喊口令，再学会摔倒了怎么爬起来。\n春天的长距离赛横跨苔原几百公里，沿途的营地由各个牧民家庭轮流照看，选手到站时总有一锅热腾腾的驯鹿肉汤等着。出发那天，赛场上几百条狗一起吠叫，选手们给头犬套上挽具，长老在起跑线前用塔夫鲁纳克语念一段祝词，号令一响，一队队雪橇冲进白茫茫的苔原。最后一名到达终点的选手会得到一盏油灯，意思是「再黑的路也走完了」，许多老选手说，比起冠军的奖杯，他们更想留住那盏灯。"
      en: "The Aqqanik Sled Race Grounds in Aqqanik District, capital of the Tavrulit Indigenous Autonomous Region, are the start and finish of the dog-sled races, on a site of about 1.4 by 0.7 km, and the long-distance course follows the old sled trails across the tundra. Aqqanik has 291,100 people and is home to the Tavrulit Council of Elders and the cultural centre; the region has 667,700 people, 72% of them Tavrunaq speakers by mother tongue, and dog-sled racing, drum dancing, oral epic and rock and bone carving are traditions handed down from generation to generation. The Aqqapituk Road runs east from Aqqanik through the delta wetlands to Kiluktuar, with dedicated crossings where sled trails meet the road and sleds taking priority in winter; during the races Aqqanik Airport fills with mushers and spectators from all over, and the sled dogs fly in too. On ordinary days the grounds are for training dogs, and on winter weekends children often learn to drive a sled here alongside the grown-ups, first learning the commands and then how to get up again after a fall.\nThe long spring race crosses hundreds of kilometres of tundra, its camps kept in turn by herding families, and at every stage a pot of steaming reindeer broth awaits the mushers. On the day of the start hundreds of dogs bark together on the grounds, the mushers harness their lead dogs, an elder recites a blessing in Tavrunaq at the start line, and at the signal team after team of sleds races off into the white tundra. The last to finish is given an oil lamp, meaning \"however dark the road, you saw it through\", and many veteran mushers say that more than the champion's trophy, it is that lamp they would like to keep."
    in: div_ek897t
    offset_km: [2, 1]
    site: { layout: park, size_m: [1400, 700] }
  - id: poi_hvddg4
    subtype: cultural_site
    status: generated
    names:
      zh: 通古阿利特石人群
      en: Tuunngualiit Stone Figures
      art-x-tavrunaq: Tuunngualiit
    wonder:
      zh: 世界唯一的石人群，过去为猎人和牧人指路
      en: The only field of stone figures in the world, once guiding hunters and herders
    notes:
      zh: "通古阿利特石人群是世界上唯一的石人群，在首府西北的尼尔萨瓦克区，属塔夫鲁利特原住民自治区，是苔原上成群的石人与石堆路标，过去为猎人和牧人指路。遗址约 600 米长、400 米宽，石人和石堆散布在一片缓坡上，远看像一群站在苔原上的人。塔夫鲁纳克语里 tuun 是「石」，Tuunngualiit 就是对这些石人的称呼；领地旗上下两半之间立着的那座红色石堆路标，画的就是这样的路标。\n石人用苔原上随手可得的扁平石块一块块垒起，不用灰浆，靠石块的重量互相压住，高的比人还高，矮的只到膝盖。石人张着双臂，面朝的方向指着水源、渡口或驯鹿的迁徙路线，起雾时猎人靠它们找路；单独的石堆标出一天的路程、安全的冰面或埋藏食物的地点。谁也说不清最早的石人是什么时候垒起的，长老们口述的史诗里，祖先就已经沿着它们赶着驯鹿走过苔原。\n尼尔萨瓦克区面积 37800 平方公里，16.6 万人，驯鹿放牧和传统渔猎占经济的一半，人均产值是全领地各区中最低的；苏瓦西尔米冰原近一半的面积和尼尔赛卢湖在区内。牧民今天仍沿着石人指的路线赶驯鹿，努阿高速在区内延伸约 360 公里，修路时按长老议事会的意见避开了石人群，沿途保留了石堆路标。冬天石人常被雪埋到胸口，只露出张开的手臂，路过的牧民会扫开积雪，让它们继续指路。涉及土地、狩猎与迁徙路线的领地法案须经自治区长老议事会同意，石人群的保护也由长老们和牧民共同照看，倒下的石块由附近的牧民家庭按原样重新垒好。塔夫鲁利特原住民自治区覆盖大陆北部和内陆的大片苔原，66.8 万人，塔夫鲁纳克语母语者占 72%，区内还有皮图库维特岩雕和尼尔萨普库维克产仔地等遗产。长老们常说「Nirsa pirri, tavru pirri」，意思是「驯鹿走的路，就是土地的路」，石人指的正是这样的路。\n过路的人有往石堆上添一块石头的习惯，但谁也不能拿走一块，长老说那是「替下一个走路的人留的」。夏天常有学校带孩子来，老师让每个孩子找一块自己搬得动的石头添上去，再站到石人身后，顺着它的手臂望出去，看看它指的是哪一片湖、哪一道山口。牧民们说，在苔原上迷了路，先别慌，找一个石人，跟它站成一排，它总会把你领到有水的地方。"
      en: "The Tuunngualiit Stone Figures are the only field of stone figures in the world, in Nirsavaq District north-west of the capital, part of the Tavrulit Indigenous Autonomous Region: groups of stone figures and cairns on the tundra that once showed hunters and herders the way. The site is about 600 m long and 400 m wide, its figures and cairns scattered over a gentle slope so that from a distance they look like a crowd of people standing on the tundra. In Tavrunaq tuun means \"stone\", and Tuunngualiit is the name for these stone figures; the red stone cairn that stands between the two halves of the territorial flag depicts just such a waymark.\nThe figures are stacked from flat stones picked up on the tundra, without mortar, held together by their own weight; the tallest are taller than a person and the smallest reach only to the knee. The figures stand with arms outstretched, facing towards water, fords or the reindeer's migration routes, and hunters found their way by them in fog; single cairns mark a day's journey, safe ice or a food cache. No one can say when the first figures were built: in the epics the elders recite, the ancestors were already driving their reindeer across the tundra along them.\nNirsavaq District covers 37,800 km² and has 166,000 people; reindeer herding and traditional fishing and hunting make up half its economy, and its output per head is the lowest of any district in the territory. Nearly half of the Suvvasirmi Icefield and Nirsaillu Lake lie in the district. Herders still drive their reindeer along the routes the figures point to, and the Nua Expressway, which runs some 360 km through the district, was routed round the figures on the advice of the Council of Elders and keeps the cairns along its way. In winter the figures are often buried to the chest in snow, only their outstretched arms showing, and herders passing by sweep the snow away so they can go on showing the way. Territorial bills touching land, hunting and migration routes need the consent of the region's Council of Elders, the figures are looked after jointly by the elders and herders, and stones that fall are rebuilt as they were by the herding families nearby. The Tavrulit Indigenous Autonomous Region covers great stretches of tundra across the north and interior of the mainland, with 668,000 people, 72% of them Tavrunaq speakers, and holds other heritage such as the Pitukuviit Rock Carvings and the Nirsapukkuvik Calving Grounds. The elders often say \"Nirsa pirri, tavru pirri\", \"the reindeer's road is the land's road\", and that is just the kind of road the figures point along.\nPassers-by add a stone to the cairns, but no one may take one away; the elders say they are \"kept for the next person on the road\". In summer schools often bring children here, and teachers have each child find a stone they can carry, add it to a cairn, then stand behind a figure and look out along its arm to see which lake or which pass it points to. Herders say that if you lose your way on the tundra, don't panic: find a stone figure, line yourself up with it, and it will always lead you to water."
    in: div_d9hctg
    offset_km: [4, -3]
    site: { layout: park, size_m: [600, 400] }
  - id: poi_fwq140
    subtype: cultural_site
    status: generated
    names:
      zh: 皮图库维特岩雕
      en: Pitukuviit Rock Carvings
      art-x-tavrunaq: Pitukuviit Kirravik
    notes:
      zh: "皮图库维特岩雕刻在北岸外海皮图库维特群岛的海岸岩石上，题材是鲸、海豹与皮划艇，属塔夫鲁利特原住民自治区的皮图库维特区。群岛由皮图克尤阿克岛和瑙卡克岛组成，有 8.3 万人，是塔夫鲁利特人传统的海上猎场：皮图克尤阿克岛面积约 1 万平方公里，是领地第五大岛，海岸是传统的海豹与海象猎场；冬季皮图克马苏克海峡封冻后，猎人乘雪橇在岛屿之间往来，西南端的皮图昆纳尔岬过去是猎人乘皮划艇出海的起点，岬上的老石堆路标至今立着。岩雕刻的正是这种生活，皮划艇里的人举着鱼叉，鲸和海豹在岩面上游动。群岛的第二大岛瑙卡克岛名字来自猎海豹用的鱼叉，老猎人说，岛的形状就像一支斜放在海上的鱼叉。\n有些岩雕只在退潮时露出水面，涨潮后又被海水盖住，向导会掐着潮汐表带人来看，看不了多久就得往高处退。岩雕禁止拓印和触摸，塔夫鲁利特的孩子们在阿卡尼克的塔夫鲁利特文化中心里用复制品学着描画祖先刻下的图案。老猎人说，祖先把画刻在海水够得着的地方，是想让海也记得这些故事；每逢大潮退得最远的日子，岛上的人会特意去岸边，看一看平时藏在水下的那几幅。"
      en: "The Pitukuviit Rock Carvings are cut into the shore rocks of the Pitukuviit Islands off the north coast, showing whales, seals and kayaks, in Pitukuviit District of the Tavrulit Indigenous Autonomous Region. The islands, Pitukjuaq and Naukkaq, have 83,000 people and are the traditional sea hunting grounds of the Tavrulit: Pitukjuaq, about 10,000 km², is the territory's fifth largest island, its coast a traditional hunting ground for seals and walruses; when the Pitukmasuq Strait freezes in winter, hunters cross between the islands by sled, and Cape Pitukkunnar at the south-western tip was where hunters once set out to sea by kayak, its old cairn still standing. The carvings show exactly that life: figures in kayaks raising harpoons, whales and seals swimming across the rock. Naukkaq, the second island of the group, is named after the harpoon used for seals; the old hunters say its shape is just like a harpoon laid slantwise on the sea.\nSome carvings show only at low tide and are covered again as the water rises, so guides bring visitors by the tide table and soon have to retreat to higher ground. Rubbing and touching are forbidden, and Tavrulit children learn to draw their ancestors' figures from replicas at the Tavrulit Cultural Centre in Aqqanik. The old hunters say their ancestors carved the pictures where the sea could reach them so that the sea too would remember the stories; on the days of the lowest spring tides the islanders make a point of going down to the shore to see the few carvings that usually hide under water."
    in: div_zq16x4
    offset_km: [0.8, 0.5]
  - id: poi_t96kpx
    subtype: nature_reserve
    status: generated
    names:
      zh: 尼尔萨普库维克产仔地
      en: Nirsapukkuvik Calving Grounds
      art-x-tavrunaq: Nirsapukkuvik
    notes:
      zh: "尼尔萨普库维克产仔地在塔夫鲁利特原住民自治区的尼尔萨图维特生态保护区，驯鹿每年春季回到这里产仔，产仔季节禁止车辆和飞机靠近。名字由 nirsa「驯鹿」、pukku「生长」和表示处所的 -vik 组成，大意是「驯鹿出生长大的地方」。尼尔萨图维特生态保护区面积约 5.02 万平方公里，是领地面积第四大的区，就是为驯鹿的迁徙路线划定的，常住约 1.7 万人，多为随鹿群迁徙的牧民；海拔 1950 米的尼尔萨皮鲁克峰和伊卢克塔克湖都在区内。驯鹿春秋沿尼尔萨河的河谷迁徙，西卢阿高速和尼尔萨瓦克高速穿过保护区时抬高路堤、加宽涵洞，并在迁徙季节限制夜间车流；涉及土地、狩猎与迁徙路线的领地法案，须经塔夫鲁利特长老议事会同意。\n产仔季连无人机都禁飞，牧民在保护区边界外扎营守望，第一只小驯鹿出生的消息会通过自治区广播传遍苔原，长老们说这一天比任何节日都要紧。小鹿出生后不到一个钟头就能站起来，几天后就能跟着母鹿走路；牧民们说，听见广播的那天晚上，苔原上家家都要多点一盏灯，算是给鹿群添了新丁。"
      en: "The Nirsapukkuvik Calving Grounds lie in the Nirsatuvvit Nature Reserve of the Tavrulit Indigenous Autonomous Region; the reindeer return here each spring to calve, and vehicles and aircraft must keep away in the calving season. The name joins nirsa, \"reindeer\", pukku, \"grow\", and the place suffix -vik: roughly \"where the reindeer are born and grow\". The Nirsatuvvit Nature Reserve, about 50,200 km², the fourth largest district in the territory, was drawn for the reindeer migration route and has some 17,000 residents, mostly herders who move with the herds; Mount Nirsapirruk, 1,950 m, and Illuqtaq Lake are both within it. The reindeer migrate along the valley of the Nirsa River in spring and autumn, and where the Sillua and Nirsavaq expressways cross the reserve they run on raised embankments with widened culverts and limit night traffic in the migration season; territorial bills touching land, hunting and migration routes need the consent of the Tavrulit Council of Elders.\nIn the calving season even drones are banned, and herders camp outside the reserve boundary to keep watch; news of the first calf goes out across the tundra on the region's radio, and the elders say that day matters more than any festival. A calf can stand within an hour of birth and within a few days can walk with its mother; herders say that on the evening the news comes over the radio, every household on the tundra lights one extra lamp to welcome the herd's newcomers."
    in: div_7b21kg
  - id: poi_5qq05k
    subtype: airport
    status: generated
    names:
      zh: 阿卡尼克机场
      en: Aqqanik Airport
      art-x-tavrunaq: Aqqanik Tirravik
    notes:
      zh: "阿卡尼克机场是塔夫鲁利特原住民自治区首府阿卡尼克区的机场，在城区西南，场区长约 2.8 公里，有航班飞往领地首府努卡塔克和苔原上的牧区小镇。阿卡尼克有 29.1 万人，以行政、文化遗产和教育为主，塔夫鲁利特长老议事会、文化中心和雪橇赛场都在区内；从首府开车走努阿高速约 400 公里、两个半小时，坐飞机则快得多。自治区覆盖大陆北部和内陆的大片苔原，面积 131080 平方公里，苔原上路少，小飞机是牧民看病、上学和运货的依靠，驾驶员认得航线下每一片湖和每一处牧场。候机厅不大，墙上挂着历届雪橇赛冠军和他们的头犬的照片。\n雪橇赛期间，机场挤满了从各地赶来的选手和观众，雪橇犬也坐飞机来，候机厅里此起彼伏的狗叫声是阿卡尼克春天的信号。地勤人员这几周要专门腾出一块地方安顿犬笼，行李转盘上转出来的常常是一袋袋狗粮。产仔季前后，飞往苔原的航班要绕开尼尔萨普库维克产仔地，飞行员说这是一年里唯一一段「给驯鹿让航路」的日子，宁可多飞二十分钟，也不能惊了刚出生的小鹿。"
      en: "Aqqanik Airport serves Aqqanik District, capital of the Tavrulit Indigenous Autonomous Region; it lies south-west of the town on a site about 2.8 km long, with flights to the territory's capital, Nuqattaaq, and to the herding towns of the tundra. Aqqanik has 291,100 people and lives mainly by administration, cultural heritage and education, with the Tavrulit Council of Elders, the cultural centre and the sled race grounds all in the district; by car from the capital it is about 400 km and two and a half hours on the Nuqattaaq–Aqqanik Expressway, and much quicker by air. The region covers the wide tundra of the northern mainland and the interior, 131,080 km², where roads are few and small planes carry herders to the doctor and to school and carry their goods, their pilots knowing every lake and pasture beneath the route. The terminal is small, its walls hung with photos of past sled race champions and their lead dogs.\nDuring the sled race the airport fills with mushers and spectators from all over, the sled dogs fly in too, and the barking that rings through the terminal is Aqqanik's sign of spring. For these weeks the ground staff clear a space just for dog crates, and what comes round on the baggage carousel is often sack after sack of dog food. Around the calving season, flights to the tundra must detour round the Nirsapukkuvik Calving Grounds, and pilots say these are the only days of the year when they \"give way to the reindeer\", better to fly twenty minutes longer than to startle a newborn calf."
    in: div_ek897t
    offset_km: [-3, -2.5]
    site: { size_m: [2800, 900], layout: airport, angle_deg: 20 }

  # ── 北冰洋领地政务院机构（M42）：库马尔维克区三个楼群，财政部与监管司在帕卢尔尼克金融特区 ──
  - id: bld_48y99w
    subtype: government
    status: generated
    names:
      zh: 北冰洋领地政务院对外事务部
      en: Ministry of External Affairs, Arctic Ocean Territory Executive Council
    short_names:
      zh: 对外事务部
      en: Ministry of External Affairs
    notes:
      zh: 北冰洋领地政务院对外事务部，位于库马尔维克区东北楼群，负责领地的对外交往和与中央政府的联络。部内设政策司、中央政府联络司、外国使领馆司、礼宾司、国际交流司和领事服务司。帕卢尔尼克金融特区吸引了世界各地的银行、科技公司和数据中心客户，许多国家在努卡塔克设有领事馆或商务代表处，外国使领馆司负责与它们联系；国际交流司组织极地科学合作、极光旅游推广和塔夫鲁纳克文化的海外展演，领事服务司为外籍金融和科技从业者办理证明。领地与其他领地没有陆路相连，礼宾司接待的外宾都经航空或破冰船抵达。
      en: The Ministry of External Affairs of the Arctic Ocean Territory, in the north-east cluster of Qummarvik District, handles the territory's dealings abroad and its liaison with the central government. Its departments are Policy, Central Government Liaison, Foreign Missions, Protocol, International Exchange and Consular Services. The Pallurniq Financial Zone draws banks, technology firms and data-centre clients from all over the world, and many countries keep a consulate or trade office in Nuqattaaq, which the Foreign Missions Department deals with. International Exchange arranges polar science partnerships, promotes aurora tourism and takes Tavrunaq culture abroad, and Consular Services certifies documents for foreign finance and technology workers. With no land link to any other territory, every visitor Protocol receives arrives by air or by icebreaker.
    in: div_9s80v8
    offset_km: [0.95, 0.75]
    site: { size_m: [150, 110], layout: lshape }

  - id: bld_afeq8r
    subtype: government
    status: generated
    names:
      zh: 北冰洋领地政务院财政部
      en: Ministry of Finance, Arctic Ocean Territory Executive Council
    short_names:
      zh: 财政部
      en: Ministry of Finance
    notes:
      zh: 北冰洋领地政务院财政部，是少数不在首府市区的政务院机构，设在紧邻库马尔维克区的帕卢尔尼克金融特区，与北冰洋公共银行总部大厦相邻。部内设税收司、关税司、监管司、行政部门预算司、企业事业单位预算司和中央财政事务司。领地财政的一大来源是公共银行的利润，其中一部分作为分红发给领地居民，财政部与公共银行共同核算和发放这笔分红；监管司与财政部同在特区，监督特区内的金融机构，税收司和关税司则留在首府的西面楼群。行政部门预算司编制政务院各部门的预算，中央财政事务司负责与中央财政的往来。
      en: The Ministry of Finance of the Arctic Ocean Territory is one of the few Executive Council bodies outside the capital's city districts, in the Pallurniq Financial Zone right next to Qummarvik and beside the Arctic Ocean Public Bank Tower. Its departments are Taxation, Customs Tariffs, Supervision, Executive Budgets, Public Enterprise and Institution Budgets, and Central Finance. A large part of the territory's revenue comes from the public bank's profits, some of which are paid to residents as a dividend, and the ministry works out and pays that dividend with the bank. The Supervision Department shares the zone and regulates its financial institutions, while Taxation and Customs Tariffs stay in the capital's west cluster. Executive Budgets draws up the ministries' budgets, and Central Finance handles dealings with the central treasury.
    in: div_ga9pxy
    offset_km: [1.3, 0.35]
    site: { size_m: [160, 90], layout: slab }

  - id: bld_p242j1
    subtype: government
    status: generated
    names:
      zh: 北冰洋领地政务院财政部监管司
      en: Supervision Department, Ministry of Finance, Arctic Ocean Territory Executive Council
    short_names:
      zh: 财政部监管司
      en: Supervision Department
    notes:
      zh: 北冰洋领地政务院财政部监管司，与财政部一起设在帕卢尔尼克金融特区，是领地金融监管的执行机构。特区以零税率、不设资本管制、线上即时开户和几分钟自动注册公司为号召，监管司要确保这些便利不被滥用：它审批银行、投资公司和数字资产交易所的执照，实时监测特区内的大额资金流动，检查反洗钱和客户身份核实的执行，并对北冰洋公共银行和四家附属银行进行年度审查。监管司与帕卢尔尼克金融法院、北冰洋国际仲裁中心和公共安全部经济犯罪调查司合作，违规机构会被罚款甚至吊销执照。
      en: The Supervision Department of the Ministry of Finance shares the Pallurniq Financial Zone with the ministry and carries out the territory's financial regulation. The zone offers zero tax, no capital controls, instant online accounts and companies registered in minutes, and the department makes sure these freedoms are not abused. It licenses banks, investment firms and the digital asset exchange, watches large flows of money in the zone in real time, checks anti-money-laundering and customer identification, and reviews the Arctic Ocean Public Bank and its four subsidiaries every year. It works with the Pallurniq Financial Court, the Arctic Ocean International Arbitration Centre and the Economic Crime Department of the Ministry of Public Security, and firms that break the rules can be fined or lose their licence.
    in: div_ga9pxy
    offset_km: [1.3, -0.15]
    site: { size_m: [130, 80], layout: slab }

  - id: bld_r8rayd
    subtype: government
    status: generated
    names:
      zh: 北冰洋领地政务院财政部税收司
      en: Taxation Department, Ministry of Finance, Arctic Ocean Territory Executive Council
    short_names:
      zh: 财政部税收司
      en: Taxation Department
    notes:
      zh: 北冰洋领地政务院财政部税收司，位于库马尔维克区西面楼群，负责领地税收政策的制定和征收。北冰洋领地实行两套税制：帕卢尔尼克金融特区内零税率，特区外按领地税法征收所得税、消费税和资源税，采矿和数据中心是资源税和能源税的主要来源。税收司要防止企业把特区外的经营利润转移到特区内避税，为此与监管司共享企业登记和资金流动的数据；它还管理居民和企业的线上报税系统，提供中文、英文和塔夫鲁纳克语三种界面。税收司留在首府，是为了与交通、资源等经济部门紧密协作。
      en: The Taxation Department of the Ministry of Finance, in Qummarvik's west cluster, sets and collects the territory's taxes. The territory runs two systems, zero tax inside the Pallurniq Financial Zone and, outside it, income, consumption and resource taxes under territorial tax law, with mining and data centres the main payers of resource and energy taxes. The department has to stop businesses shifting profits earned outside the zone into it to avoid tax, and shares company registration and payment data with the Supervision Department to do so. It also runs online tax returns for residents and businesses in Chinese, English and Tavrunaq, and stays in the capital to work closely with the transport and resource ministries.
    in: div_9s80v8
    offset_km: [-1.2, -0.4]
    site: { size_m: [120, 70], layout: slab }

  - id: bld_6n1rmk
    subtype: government
    status: generated
    names:
      zh: 北冰洋领地政务院财政部关税司
      en: Customs Tariff Department, Ministry of Finance, Arctic Ocean Territory Executive Council
    short_names:
      zh: 财政部关税司
      en: Customs Tariff Department
    notes:
      zh: 北冰洋领地政务院财政部关税司，位于库马尔维克区西面楼群，负责领地进出口关税的征收和管理。领地与其他领地没有陆路相连，所有货物都经海运和航空进出：南岸的伊马萨尔维克区港区终年不冻，是主要的进口口岸；北岸港口夏季靠破冰船通航，矿石和精矿从那里出口；努卡塔克国际机场则承担高价值货物和数据中心设备的空运。关税司在这些口岸设有征收点，管理金融特区与领地其他地区之间的货物往来，并为矿产出口和服务器进口设立专门的税目。
      en: "The Customs Tariff Department of the Ministry of Finance, in Qummarvik's west cluster, collects and manages duties on the territory's imports and exports. With no land link to any other territory, everything comes and goes by sea or air: the ice-free harbour of Immasaarvik District on the south coast is the main port of entry, the north-coast ports open in summer with icebreakers to ship ore and concentrate out, and Nuqattaaq International Airport handles high-value goods and equipment for the data centres. The department collects duties at each of these points, controls goods moving between the financial zone and the rest of the territory and keeps special tariff headings for mineral exports and server imports."
    in: div_9s80v8
    offset_km: [-1.5, -0.4]
    site: { size_m: [120, 70], layout: slab }

  - id: bld_tk59yw
    subtype: government
    status: generated
    names:
      zh: 北冰洋领地政务院司法部
      en: Ministry of Justice, Arctic Ocean Territory Executive Council
    short_names:
      zh: 司法部
      en: Ministry of Justice
    notes:
      zh: 北冰洋领地政务院司法部，位于库马尔维克区东南楼群，负责领地法规的起草和实施、检察事务和司法行政。部内设国家法律实施司、领地法规司、法律法规起草和规范司、检察事务司、司法监察司、拘留管理司、社区矫正管理司、司法从业人员司和司法研究司。涉及土地、狩猎和迁徙路线的领地法案须经塔夫鲁利特长老议事会同意，领地法规司负责与议事会协商；法律法规起草和规范司负责法规的中文、英文和塔夫鲁纳克语文本，司法研究司长期研究金融特区的法律和原住民的习惯法。
      en: The Ministry of Justice of the Arctic Ocean Territory, in Qummarvik's south-east cluster, drafts and applies the territory's laws and runs prosecutions and the administration of justice. Its nine departments are National Law Enforcement, Territorial Regulations, Legislative Drafting and Standards, Prosecutions, Judicial Inspection, Detention, Community Corrections, Legal Professions and Legal Research. Territorial laws on land, hunting and migration routes need the consent of the Tavrulit Council of Elders, and the Territorial Regulations Department consults the council on them; the drafting department prepares the Chinese, English and Tavrunaq texts, and Legal Research has long studied the law of the financial zone and indigenous customary law.
    in: div_9s80v8
    offset_km: [0.4, -0.5]
    site: { size_m: [140, 110], layout: lshape }

  - id: bld_3dbpvp
    subtype: government
    status: generated
    names:
      zh: 北冰洋领地政务院公共安全部
      en: Ministry of Public Security, Arctic Ocean Territory Executive Council
    short_names:
      zh: 公共安全部
      en: Ministry of Public Security
    notes:
      zh: 北冰洋领地政务院公共安全部，位于库马尔维克区东南楼群，统一领导领地的警务和治安。部内设警察司、警务司、边境服务和安全司、刑事侦查司、民事侦查司、经济犯罪调查司、社区安全司和技术和装备司。领地面积广大、人口分散，技术和装备司为警察配备雪地车、全地形车、直升机和固定翼飞机，社区安全司在极夜和暴风雪期间组织搜救；经济犯罪调查司与金融特区的监管机构配合，追查利用特区开户和注册公司进行的洗钱和诈骗，边境服务和安全司负责港口和机场的出入境检查。
      en: The Ministry of Public Security of the Arctic Ocean Territory, in Qummarvik's south-east cluster, directs policing and public order across the territory. Its departments are Police, Policing Operations, Border Services and Security, Criminal Investigation, Civil Investigation, Economic Crime, Community Safety, and Technology and Equipment. The territory is vast and thinly settled, so Technology and Equipment gives the police snowmobiles, all-terrain vehicles, helicopters and light aircraft, and Community Safety organises search and rescue in the polar night and in blizzards. Economic Crime works with the financial zone's regulators to trace money laundering and fraud through accounts and companies opened there, and Border Services and Security checks arrivals at the ports and airports.
    in: div_9s80v8
    offset_km: [0.75, -0.5]
    site: { size_m: [150, 80], layout: slab }

  - id: bld_ct0qar
    subtype: government
    status: generated
    names:
      zh: 北冰洋领地政务院教育、科学和文化部
      en: Ministry of Education, Science and Culture, Arctic Ocean Territory Executive Council
    short_names:
      zh: 教育、科学和文化部
      en: Ministry of Education, Science and Culture
    notes:
      zh: 北冰洋领地政务院教育、科学和文化部，位于库马尔维克区东南楼群，管理领地的各级教育、科学研究和文化事业。部内设教育政策司、科学政策司、文化政策司、教育技术司、信息技术司、教育从业人员司、科技从业人员司、文化从业人员司、学前教育司、基础教育司、成人和职业教育司、高等教育司和教育督导署。塔夫鲁纳克语母语者占领地人口一半以上，基础教育司在各地推行中文、英文和塔夫鲁纳克语的三语教学，教育技术司为苔原上的游牧家庭开设远程课堂；科学政策司支持北冰洋大学的极地、冰川和冻土研究，文化政策司保护塔夫鲁纳克语的口述传统和手工艺。
      en: The Ministry of Education, Science and Culture of the Arctic Ocean Territory, in Qummarvik's south-east cluster, oversees schooling at every level, research and cultural life. Its thirteen units are the Education Policy, Science Policy, Cultural Policy, Educational Technology, Information Technology, Teaching Professions, Science and Technology Professions, Cultural Professions, Pre-school, Basic Education, Adult and Vocational Education and Higher Education departments and the Education Inspectorate. Native speakers of Tavrunaq are more than half the population, so Basic Education teaches in Chinese, English and Tavrunaq, and Educational Technology runs remote classrooms for herding families on the tundra. Science Policy supports polar, glacier and permafrost research at the University of the Arctic Ocean, and Cultural Policy protects Tavrunaq oral tradition and crafts.
    in: div_9s80v8
    offset_km: [1.1, -0.5]
    site: { size_m: [150, 110], layout: lshape }

  - id: bld_sya7b5
    subtype: government
    status: generated
    names:
      zh: 北冰洋领地政务院交通部
      en: Ministry of Transport, Arctic Ocean Territory Executive Council
    short_names:
      zh: 交通部
      en: Ministry of Transport
    notes:
      zh: 北冰洋领地政务院交通部，位于库马尔维克区西面楼群，负责领地的道路、铁路、水运和航空。部内设政策司、交通从业人员司、道路运输司、公路司、铁路司、水路司和空运司，其中水路司单独建楼。公路司管理西卢阿高速等干线高速，西卢阿高速全长约两千一百九十公里，是世界最长的极地高速公路，沿线的防雪长廊和冬季除雪由公路司统一维护；铁路司负责西卢阿真空磁悬浮和乌库利特真空磁悬浮重载铁路，空运司协调努卡塔克国际机场和各地机场的航线，极夜期间偏远地区的物资主要靠空运送达。
      en: The Ministry of Transport of the Arctic Ocean Territory, in Qummarvik's west cluster, runs the territory's roads, railways, shipping and aviation. Its departments are Policy, Transport Professions, Road Transport, Highways, Railways, Waterways and Air Transport, with Waterways in a building of its own. Highways manages the trunk expressways, among them the Sillua Expressway, at about 2,190 km the longest polar expressway in the world, and maintains their snow sheds and winter clearing; Railways oversees the Sillua Vacuum Maglev and the Ukkuliit Vacuum Maglev Heavy-Haul Railway, and Air Transport coordinates the routes of Nuqattaaq International Airport and the regional airports, which carry most supplies to remote places in the polar night.
    in: div_9s80v8
    offset_km: [-1.2, 0.3]
    site: { size_m: [150, 80], layout: slab }

  - id: bld_d6s4eb
