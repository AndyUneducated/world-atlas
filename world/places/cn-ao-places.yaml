      en: The Ministry of Civil Affairs of the Arctic Ocean Territory, in Qummarvik's south-east cluster, deals with civil society, social assistance and the administrative divisions. Its departments are Policy, Social Organisations, Social Assistance, Charities, Other Social Affairs and Administrative Divisions. Administrative Divisions manages the boundaries of the cities, the districts and the Tavrulit Indigenous Autonomous Region; most place names in the territory are Tavrunaq, and new ones are agreed with the Council of Elders. Social Organisations registers reindeer herders' co-operatives, hunting associations and cultural groups, Social Assistance gives fuel allowances and home visits to elderly people living alone and to families in hardship during the polar night, and Other Social Affairs handles marriage registration and funerals.
    in: div_9s80v8
    offset_km: [0.4, -0.85]
    site: { size_m: [130, 80], layout: slab }

