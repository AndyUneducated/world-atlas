      en: The Ministry of Health and Human Services of the Arctic Ocean Territory, in Qummarvik's south-east cluster, is responsible for food and drug safety, health care, public insurance and welfare. Its eleven departments are Food Policy, Food Supervision, Food Professions, Medical and Drug Policy, Medical and Drug Supervision, Medical and Drug Professions, Medical and Drug Technology, Public Health Insurance, Other Public Insurance, Public Health and Public Welfare. Most fresh fruit and vegetables are imported, and Food Supervision tests them along with local reindeer meat and smoked fish; Public Health runs light therapy and mental health services for the polar night and flies doctors to the tundra settlements, and Public Health Insurance and Public Welfare give every resident the same cover and benefits wherever they live.
