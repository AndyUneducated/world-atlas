    names:
      zh: 北冰洋国际仲裁中心
      en: Arctic Ocean International Arbitration Centre
      art-x-tavrunaq: Aqqimma Lurrakut
    notes:
      zh: 受理跨境商事与金融争议的国际仲裁机构，与金融法院相邻
      en: An international arbitration body for cross-border commercial and financial disputes, next to the financial court.
    in: div_ga9pxy
    offset_km: [-0.9, -0.3]
    site: { layout: hall, size_m: [180, 120] }
  - id: bld_fcc6wm
    subtype: government
    status: generated
    names:
      zh: 帕卢尔尼克公司注册处
      en: Pallurniq Companies Registry
      art-x-tavrunaq: Pallurniq Qirruvik
    notes:
      zh: 特区的公司注册处与自由经济区管理机构，公司注册全程自动、几分钟办完
      en: The zone's companies registry and free economic zone authority, where registering a company is fully automatic and takes a few minutes.
    in: div_ga9pxy
    offset_km: [0.1, -0.6]
    site: { layout: hall, size_m: [150, 100] }
  - id: bld_dz7xn1
    subtype: office
    status: generated
    names:
      zh: 北冰洋数字资产交易所
      en: Arctic Ocean Digital Asset Exchange
      art-x-tavrunaq: Aqqimma Tukkaru Akkarvik
    notes:
      zh: "交易数字资产与领地数字货币的交易所，可编程账户与智能合约都在这里结算。交易大厅的墙上挂着一块巨大的屏幕，显示领地数字货币的实时流通量；新上线的智能合约要先在大厅里公开演示，接受交易员的提问。"
      en: "The exchange for digital assets and the territory's digital currency, where programmable accounts and smart contracts settle. A huge screen on the trading-hall wall shows the territorial digital currency in circulation in real time, and each new smart contract is demonstrated publicly in the hall first, open to traders' questions."
    in: div_ga9pxy
    offset_km: [0.6, 0.8]
    site: { layout: hall, size_m: [200, 140] }
  - id: bld_atmxv2
    subtype: data_centre
    status: generated
    names:
      zh: 公共银行极地数据中心
      en: Public Bank Polar Data Centre
      art-x-tavrunaq: Pallutuar Tukkaruvik
    notes:
      zh: "公共银行的核心数据中心，用极地冷空气冷却，运行账户、支付与 AI 秒批贷款系统。机房建在半地下，四周是天然的冻土，即使冷却设备停机，机房也能靠冻土保持低温好几天。余热经管道送进特区的冬季花园，花园里的热带植物靠的正是这些服务器。"
      en: "The Public Bank's core data centre, cooled by polar air, running its accounts, payments and instant AI lending. The halls are half underground and surrounded by natural permafrost, which can keep them cold for days even if the cooling plant stops. Their waste heat is piped to the zone's winter garden, whose tropical plants owe their warmth to these servers."
    in: div_ga9pxy
    offset_km: [0.7, -0.6]
    site: { layout: complex, size_m: [300, 220] }
  - id: bld_f595fg
    subtype: vault
    status: generated
    names:
      zh: 冻土黄金金库
      en: Permafrost Gold Vault
      art-x-tavrunaq: Kirri Tuunnivik
    wonder:
      zh: 世界唯一深埋在冻土层下的黄金金库
      en: The only gold vault in the world buried deep in permafrost
    notes:
      zh: "深埋在冻土层下的黄金金库，地面只有一座出入大楼，存放公共银行与客户的金条。金库靠冻土的天然低温常年保持在零下，不需要空调。金库定期开放参观，游客要换上厚棉衣，穿过零下的地下长廊，才能隔着玻璃看见成排的金条。"
      en: "A gold vault deep in the permafrost, of which only the entrance building shows above ground, holding the bullion of the Public Bank and its clients. The vault stays below freezing all year from the permafrost's natural cold, with no air conditioning needed. It opens to visitors from time to time; they put on padded coats and walk a sub-zero tunnel to see rows of gold bars behind glass."
    in: div_ga9pxy
    offset_km: [-0.2, -1.0]
    site: { layout: hall, size_m: [160, 120] }
  - id: bld_cskfpe
    subtype: dome
    status: generated
    names:
      zh: 帕卢尔尼克冬季花园
      en: Pallurniq Winter Garden
      art-x-tavrunaq: Pallurniq Qummar
    notes:
      zh: "金融特区的玻璃穹顶花园，终年保持温暖，种着树木和花卉，与周围塔楼以暖廊相连。数据中心的余热让穹顶下四季如春，中午常有人捧着咖啡坐在棕榈树下晒人造的太阳。花园里的一株柠檬树是特区的宝贝，每年结的果子都要拿到大厅里展览。"
      en: "The financial zone's glass-domed garden, kept warm all year and planted with trees and flowers, linked to the towers around it by skyways. Waste heat from the data centres keeps it spring under the dome all year, and at lunchtime people sit under the palms with a coffee in the artificial sunshine. A lemon tree is the zone's pride, and its fruit is put on show in the hall each year."
    in: div_ga9pxy
    offset_km: [-0.4, 0.9]
    site: { layout: dome, size_m: [360, 360] }
  - id: bld_aw19hp
    subtype: dome
    status: generated
    names:
      zh: 卡拉克穹顶
      en: Kallaaq Dome
      art-x-tavrunaq: Kallaaq Qummar
    notes:
      zh: "穹顶下的人造日光广场，极夜里按白昼的光照点亮，供人们晒\"太阳\"、做光照疗法。穹顶的名字取自塔夫鲁纳克语 kallaaq「永昼」，灯光从清晨的淡金色慢慢变成正午的白光，再在傍晚暗下来。冬天领地的医生会给失眠和情绪低落的病人开一张「穹顶处方」，每天来这里晒一小时。"
      en: "An artificial-daylight square under a dome, lit to daytime levels through the polar night for people to sit in the \"sun\" and take light therapy. Its name is the Tavrunaq kallaaq, \"endless day\", and its light shifts from the pale gold of morning to the white of noon and dims again at dusk. In winter the territory's doctors write patients with insomnia or low mood a \"dome prescription\": an hour a day in its light."
    in: div_ga9pxy
    offset_km: [0.0, 0.55]
    site: { layout: dome, size_m: [280, 280] }

  # ── 努卡塔克市 ──
  - id: bld_jkn3vg
    subtype: government
    status: generated
    names:
      zh: 北冰洋领地政府
      en: Government of the Arctic Ocean Territory
      art-x-tavrunaq: Aqqimma Tavru Aaqqivik
    notes:
      zh: 北冰洋领地政务院的主楼，在首府努卡塔克市库马尔维克区，是一座回字形的庭院建筑，领地议会也在楼内，以暖廊与中央穹顶相连。政务院是领地的最高行政机关，由领地总督组织，下设十一个部和若干直属机构，各部按职能分成三个楼群：东北是中央派驻机构、对外事务和政策规划，西面是交通、建设、资源和税收，东南是司法、治安、教育和社会事务，三个楼群都以暖廊连到中央穹顶，极夜和暴风雪里也能步行往来；财政部在北面的帕卢尔尼克金融特区。主楼北翼是总督办公室，东翼和南翼是办公厅，西翼是议会议事厅，内院冬季加盖玻璃顶。办公厅下设综合行政局、媒体和出版局、财务局、安全局、档案局、采购局和公务员事务局。
      en: The main building of the Arctic Ocean Territory Executive Council, in Qummarvik District of the capital, Nuqattaaq, is a hollow square round a courtyard that also houses the territorial assembly, joined to the Central Dome by skyways. The Executive Council is the territory's highest executive body, formed by the governor, with eleven ministries and several directly attached bodies grouped by function in three clusters, all linked by skyways to the Central Dome so that staff can walk between them in the polar night and in blizzards. The north-east cluster holds the central government's offices, external affairs and planning, the west cluster transport, construction, resources and taxation, and the south-east cluster justice, public security, education and social affairs; the Ministry of Finance is in the Pallurniq Financial Zone to the north. The north wing holds the Governor's Office, the east and south wings the General Office with its seven bureaus, and the west wing the assembly chamber; in winter the courtyard is roofed over with glass.
    in: div_9s80v8
    offset_km: [0.4, 0.5]
    emblem_of: div_hpmerr
    site: { layout: courtyard, size_m: [300, 240] }
  - id: bld_tvev0q
    subtype: dome
    status: generated
    names:
      zh: 努卡塔克中央穹顶
      en: Nuqattaaq Central Dome
      art-x-tavrunaq: Nuqattaaq Qummar
    wonder:
      zh: 世界最大的穹顶，直径约 700 米，极夜里的人造日光广场
      en: The largest dome in the world, about 700 m across, an artificial-daylight square for the polar night
    notes:
      zh: "首府中心的大型玻璃穹顶，穹顶下是冬季花园和人造日光广场，极夜里市民在这里散步、晒\"太阳\"极夜的七十来天里，穹顶的灯整夜不熄，从城外的高处望去，整座首府像围着一盏灯生长。穹顶下的长椅是老人们晒太阳、下棋的地方，许多首府人的第一次约会也在这里。"
      en: "The great glass dome at the heart of the capital, sheltering a winter garden and an artificial-daylight square where people walk and sit in the \"sun\" through the polar night. Through the seventy-odd days of polar night the dome's lights never go out, and from the high ground outside town the whole capital seems to grow around a single lamp. Its benches are where old people sit in the light and play chess, and many in the capital had their first date here."
    in: div_9s80v8
    offset_km: [-0.5, -0.3]
    site: { layout: dome, size_m: [700, 700] }
  - id: bld_zd65kz
    subtype: dome
    status: generated
    names:
      zh: 图维尔尤阿克室内海滩
      en: Tuvvirjuaq Indoor Beach
      art-x-tavrunaq: Tuvvirjuaq Qummar
    wonder:
      zh: 世界唯一的室内海滩，四季保持夏日的温度与光照
      en: The only indoor beach in the world, kept at summer warmth and light all year
    notes:
      zh: "穹顶下的人造沙滩与温水泳池，四季保持夏日的温度与光照。极夜里人们穿着泳衣躺在人造阳光下，门外却是零下二十多度的黑夜，本地人管这叫「三步过季」：脱外套、换泳衣、踩上沙滩。救生员说冬天比夏天还忙，因为整个首府的孩子都想来过夏天。"
      en: "An artificial beach and warm pool under a dome, kept at summer warmth and light all year round. In the polar night people lie in swimsuits under artificial sunshine while outside it is dark and below −20 °C; locals call it \"three steps to summer\": coat off, swimsuit on, feet in the sand. The lifeguards say winter is busier than summer, because every child in the capital wants a day of summer."
    in: div_3b9pkz
    offset_km: [0.6, 0.4]
    site: { layout: dome, size_m: [500, 500] }
  - id: poi_pe1qbx
    subtype: stadium
    status: generated
    names:
      zh: 帕尔尼克体育场
      en: Paarniq Arena
      art-x-tavrunaq: Paarniq Qummar
    notes:
      zh: "带可开合穹顶的体育场，冬季举办冰上运动和极夜灯光节的开幕式，夏季开顶举办午夜马拉松的终点仪式。午夜马拉松在极昼的太阳下开跑，选手凌晨冲过终点时太阳仍挂在天上，完赛奖牌上印着一轮不落的太阳。"
      en: "A stadium with a retractable dome, hosting ice sports and the opening of the polar-night light festival in winter, and opened to the sky in summer for the finish of the midnight marathon. The midnight marathon is run under the midnight sun, and when runners cross the line in the small hours the sun is still in the sky; the finisher's medal bears a sun that never sets."
    in: div_3b9pkz
    offset_km: [-0.8, -0.6]
    site: { layout: stadium, size_m: [300, 240] }
  - id: bld_ygpfcf
    subtype: industrial_park
    status: generated
    names:
      zh: 帕利瓦克垂直农场
      en: Paalivaq Vertical Farm
      art-x-tavrunaq: Paalivaq Pukkuvik
    notes:
      zh: "多层室内农场，用人工光照种植蔬菜和浆果，供应首府大部分的新鲜蔬菜。极夜里农场的粉紫色灯光从一层层窗户里透出来，远看像一座发光的塔。首府的小学生都来这里上过校外课，亲手摘一颗草莓，是许多孩子第一次在冬天吃到刚摘下的水果。"
      en: "A many-storeyed indoor farm growing vegetables and berries under artificial light, supplying most of the capital's fresh greens. In the polar night the farm's pink and violet light shines from floor upon floor of windows, so that from afar it looks like a glowing tower. Every schoolchild in the capital comes here on a class trip, and the strawberry they pick themselves is, for many, their first fruit fresh from the plant in winter."
    in: div_k8cx0t
    offset_km: [0.3, 0.3]
    site: { layout: tower, size_m: [120, 120] }
  - id: poi_m2wh5y
    subtype: university
    status: generated
    names:
      zh: 北冰洋大学
      en: University of the Arctic Ocean
      art-x-tavrunaq: Aqqimma Saalluvik
    notes:
      zh: "领地的综合大学，以极地工程、冰川学、金融法和塔夫鲁纳克语研究见长。毕业典礼在极昼的午夜举行，毕业生把学位帽抛向不落的太阳。冬天学生们最爱去伊马萨尔维克港区的夜宵摊，图书馆则在极夜里通宵开放，窗灯是苏瓦利克区最晚熄的。"
      en: "The territory's university, known for polar engineering, glaciology, financial law and Tavrunaq studies. Graduation is held at midnight under the midnight sun, the graduates throwing their caps towards a sun that will not set. In winter students favour the night stalls of Immasaarvik Harbour, and the library stays open all night through the polar night, its windows the last lit in Suvvalik."
    in: div_j06x18
    offset_km: [0.8, -0.6]
    site: { layout: campus, size_m: [800, 500] }
  - id: poi_kx672q
    subtype: plaza
    status: generated
    names:
      zh: 努坎加克灯光广场
      en: Nuqangaq Light Square
      art-x-tavrunaq: Nuqangaq Qavvalu
    notes:
      zh: "老渔港旁的广场，每年极夜灯光节时布满灯光装置，也是冰雕展的主会场。极夜里每逢周末晚上，广场上燃起篝火，鼓手敲起皮鼓，人们围着火堆跳舞。冰雕展开幕那晚，广场上的灯一盏盏熄灭，只留下冰雕里透出的光，人群在黑暗里齐声倒数。"
      en: "The square by the old fishing harbour, filled with light installations for the polar-night light festival and the main venue of the ice-sculpture show. In the polar night a bonfire is lit here on weekend evenings, drummers beat skin drums and people dance round the fire. On the opening night of the ice-sculpture show the square's lamps go out one by one until only the light inside the sculptures remains, and the crowd counts down together in the dark."
    in: div_q7cydv
    offset_km: [0.3, 0.2]
    site: { layout: plaza, size_m: [300, 200] }
  - id: poi_fszf6x
    subtype: park
    status: generated
    names:
      zh: 苏瓦利克冰雕园
      en: Suvvalik Ice Sculpture Garden
      art-x-tavrunaq: Suvvalik Kirravik
    notes:
      zh: "峡湾岸边的冰雕园，冬季用峡湾的冰块雕成城堡、动物和塔夫鲁纳克神话人物。冰雕由首府各区的居民分头完成，开园那晚，每一座都要由雕刻它的人家亲手点亮。春天冰雕融化后，园里会立起一块木牌，记下这一年每座冰雕的名字和作者。"
      en: "An ice-sculpture garden on the fjord shore, where blocks cut from the fjord become castles, animals and figures from Tavrunaq myth each winter. The sculptures are carved by residents of each district of the capital, and on opening night each is lit by the family that made it. When they melt in spring a wooden board goes up listing that year's sculptures and their makers."
    in: div_j06x18
    offset_km: [-0.5, 0.5]
    site: { layout: park, size_m: [400, 300] }
  - id: poi_87xwcx
    subtype: golf_course
    status: generated
    names:
      zh: 尼尔萨库特午夜高尔夫球场
      en: Nirsakut Midnight Sun Golf Course
      art-x-tavrunaq: Kallaaq Puttuvik
    notes:
      zh: "建在苔原上的高尔夫球场，极昼时节午夜也能开球。球道要和苔原上的驯鹿分享，场边立着「驯鹿优先」的牌子，球被驯鹿踩进地里可以无罚杆重打。每年极昼时节，球场举办一场午夜十二点整开球的比赛。"
      en: "A golf course laid out on the tundra, where in the season of the midnight sun players tee off at midnight. The fairways are shared with the tundra's reindeer, signs beside them read \"reindeer have right of way\", and a ball trodden into the ground by a reindeer may be replayed without penalty. Each year in the midnight sun the course holds a tournament that tees off at the stroke of midnight."
    in: div_k4vyb1
    offset_km: [1.5, 1.5]
    site: { layout: park, size_m: [1500, 900] }
  - id: poi_bq9v4n
    subtype: stadium
    status: generated
    names:
      zh: 伊马萨尔维克冰上赛车场
      en: Immasaarvik Ice Speedway
      art-x-tavrunaq: Sirmi Sukkavik
    notes:
      zh: "冬季在冻结的湖面上开辟的赛车场，举办冰上赛车和雪地摩托比赛。湖冰要厚过一米才开赛，每天早上工作人员在赛道上钻孔量冰，把冰厚写在入口的牌子上。比赛日观众站在湖岸的雪堆上，一边烤驯鹿肉肠一边看赛车在冰上甩尾。"
      en: "A racetrack laid out on a frozen lake each winter for ice racing and snowmobile events. Racing starts only once the lake ice is over a metre thick; every morning the staff drill the track to measure it and post the figure at the gate. On race days spectators stand on the snowbanks along the shore, grilling reindeer sausages as the cars slide sideways across the ice."
    in: div_jvwq60
    offset_km: [-1.5, 2]
    site: { layout: park, size_m: [1500, 700] }
  - id: poi_2mw1wp
    subtype: airport
    status: generated
    names:
      zh: 努卡塔克国际机场
      en: Nuqattaaq International Airport
      art-x-tavrunaq: Nuqattaaq Tirravik
    notes:
      zh: "领地的国际枢纽机场，跑道配有融雪加热系统，极夜和暴风雪中也能起降。到达大厅的大钟下面还有一块屏幕，极夜里倒数离回光节日出还有多少天，极昼里倒数离第一次日落还有多少天。冬夜里降落的旅客从舷窗里看到的第一样东西，常常是头顶的极光。"
      en: "The territory's international hub, its runways heated against snow so that flights operate through the polar night and blizzards. Beneath the great clock in the arrivals hall a screen counts down, in the polar night, the days to the sunrise of the Return of the Light and, in the midnight sun, the days to the first sunset. For passengers landing on a winter night the first thing seen from the window is often the aurora overhead."
    in: div_k4vyb1
    offset_km: [5, -3]
    site: { size_m: [4000, 1400], layout: airport, angle_deg: 80 }
  - id: poi_n4rxbp
    subtype: port
    status: generated
    names:
      zh: 伊马萨尔维克港区
      en: Immasaarvik Harbour
      art-x-tavrunaq: Immasaarvik Nuqa
    notes:
      zh: "暖流让港湾终年不冻，突堤上有集装箱、矿石、油品和滚装码头，重载铁路运来的矿石在这里装船。冬天港池上常飘着冰雾，船只像从雾里浮出来一样进出港。码头边的夜宵摊是苏瓦利克区大学生的去处，一碗热鱼汤配一块油炸面饼，看着灯火下的不冻港能坐到深夜。"
      en: "A warm current keeps the harbour open all year; its moles hold container, ore, oil and ro-ro terminals, and the ore brought by the heavy-haul railway is loaded here. In winter frost smoke drifts over the basins and ships seem to rise out of the mist as they come and go. The night stalls on the quay are where the students of Suvvalik go: a bowl of hot fish soup with a piece of fried dough, and they will sit late watching the lights of the ice-free port."
    in: div_jvwq60
    site: { size_m: [6000, 3500], layout: harbour, terminals: [container, bulk, bulk, oil, roro] }

  # ── 萨尔瓦克市 ──
  - id: poi_mfm115
    subtype: port
    status: generated
    names:
      zh: 萨尔努卡渔港
      en: Saarnuqa Fishing Harbour
      art-x-tavrunaq: Ulik Nuqa
    notes:
      zh: "南岸最大的渔港之一，深海渔船和养殖运输船在这里卸货。鱼市每天清晨开市，最受欢迎的是整条的养殖鲑鱼和烟熏了一夜的北极红点鲑。本地人的吃法是把鱼切成薄片冻硬，蘸着海盐和浆果酱生吃。"
      en: "One of the larger fishing harbours of the south coast, where deep-sea trawlers and fish-farm carriers land their catch. Its fish market opens at dawn, the favourites being whole farmed salmon and Arctic char smoked overnight. Locals eat fish sliced thin, frozen hard and dipped in sea salt and berry jam."
    in: div_3rb2ha
    site: { size_m: [800, 600], layout: port }
  - id: poi_v92f2k
    subtype: industrial_park
    status: generated
    names:
      zh: 乌利库维特深海养殖基地
      en: Ulikuviit Aquaculture Base
      art-x-tavrunaq: Ulikuviit Pukkuvik
    notes:
      zh: "群岛间海湾里的深海网箱养殖基地，岸上是孵化场与加工厂。网箱里养着鲑鱼和北极红点鲑，养殖工人每天坐船出海喂鱼，萨尔瓦克人因此把这片群岛叫作「海上牧场」。每批鱼苗出海放进网箱时，孵化场的老工人会在船头敲三下皮鼓，祝它们在冷水里长得又肥又结实。"
      en: "Deep-water fish pens in the bays between the islands, with hatcheries and processing plants on shore. The pens hold salmon and Arctic char, and the workers go out by boat every day to feed them, which is why Saarvaq people call these islands \"the sea pastures\". When each batch of fry goes out to the pens, the old hands from the hatchery beat a skin drum three times at the bow, wishing the fish a fat, strong life in the cold water."
    in: div_2541fx
    offset_km: [0.4, 0.3]
    site: { layout: complex, size_m: [400, 250] }
  - id: poi_284059
    subtype: nature_reserve
    status: generated
    names:
      zh: 通纳库特玄武岩柱保护区
      en: Tuunnaqut Basalt Pillars Reserve
      art-x-tavrunaq: Tuunnaqut
    notes:
      zh: "海岸上成排的六角形玄武岩柱，崖上栖息着海鸦与北极鸥。塔夫鲁纳克人的传说里，这些石柱是海神为海鸦搭的石梯，所以崖下从不捕鸟。夏天坐船从海上看，成千上万只海鸟停在石柱的每一级「台阶」上，叫声盖过了浪声。"
      en: "Rows of hexagonal basalt columns on the shore, their cliffs home to guillemots and Arctic gulls. In Tavrunaq legend the pillars are a stair the sea spirit built for the guillemots, so birds are never taken below the cliffs. Seen from a boat in summer, thousands of seabirds sit on every \"step\" of the columns, their calls louder than the surf."
    in: div_jd4ms5
    offset_km: [1, 1]
    site: { layout: park, size_m: [800, 600] }

  # ── 乌库拉克市 ──
  - id: poi_4q9gx3
    subtype: port
    status: generated
    names:
      zh: 乌库努卡散货码头
      en: Ukkunuqa Bulk Terminal
      art-x-tavrunaq: Ukkunuqa
    notes:
      zh: "基萨尔维克冶炼厂的产品和东部矿山的矿石从这里装船，另有一座油品码头。暖流让码头终年不冻，冬天码头工人穿着电热工作服在冰雾里作业。巨大的矿石堆场用拱顶棚罩住，既防粉尘外泄，也免得矿石被大雪埋住。"
      en: "Where the Qissarvik smelter's output and the ore of the eastern mines are shipped, with an oil terminal beside them. The warm current keeps the quays free of ice all year, and in winter the dockers work through the frost smoke in electrically heated overalls. The huge ore stockyards are roofed with vaulted sheds, both to keep the dust in and to stop the ore being buried by snow."
    in: div_yh6ysj
    site: { size_m: [4000, 2500], layout: harbour, terminals: [bulk, bulk, oil] }
  - id: poi_dftw4b
    subtype: factory
    status: generated
    names:
      zh: 基萨尔维克冶炼厂
      en: Qissarvik Smelter
      art-x-tavrunaq: Qissarvik Ukkuvik
    notes:
      zh: "冶炼内陆矿区的镍矿石，用水电和余热为镍城供暖。工厂每八小时换一次班，换班时整座城的公交、食堂和澡堂都跟着忙一阵，本地人约时间常说「早班后」「夜班前」。夜班工人下班时，食堂专门留着一锅热鱼汤。"
      en: "Smelts the nickel ore of the inland mines, its hydro power and waste heat warming Qissarvik. The plant changes shifts every eight hours, and each changeover sets the town's buses, canteens and bathhouses bustling, so locals arrange to meet \"after the early shift\" or \"before nights\". A pot of hot fish soup is kept in the canteen for the night shift coming off."
    in: div_1d76zf
    offset_km: [1, -0.5]
    site: { layout: complex, size_m: [600, 400] }
  - id: poi_gbvc9f
    subtype: hotel
    status: generated
    names:
      zh: 卡瓦卢维特观光度假村
      en: Qavvaluviit Lodge
      art-x-tavrunaq: Qavvalu Tuqqavik
    notes:
      zh: "玻璃屋顶的客房散布在岛上，冬季躺在床上就能看极光。度假村给每位客人一个「极光闹钟」：夜里极光一出现，前台就挨个打电话叫醒客人，有人一个冬天被叫醒十几次也毫无怨言。早餐桌上最受欢迎的是热浆果粥，配着讲昨夜极光的故事。"
      en: "Glass-roofed cabins scattered over the island, where guests watch the aurora from their beds in winter. The lodge gives every guest an \"aurora alarm\": when the lights appear at night, reception rings each room in turn, and some guests are woken a dozen times in a winter without a word of complaint. The breakfast favourite is hot berry porridge, served with stories of the night's aurora."
    in: div_7ee7ab
    offset_km: [0.4, 0.2]
    site: { layout: complex, size_m: [300, 200] }

  # ── 图利瓦克市 ──
  - id: bld_jn8t64
    subtype: data_centre
    status: generated
    names:
      zh: 图卡尔尤阿克数据中心
      en: Tukkarjuaq Data Centre
      art-x-tavrunaq: Tukkaruvik Tulli
    notes:
      zh: "图卡鲁维特群岛上最大的数据中心，用极地冷空气和海水冷却，余热为岛上的住宅供暖。排出的热水送进图利瓦克的游泳馆和温室，本地人开玩笑说自己是「泡在服务器的洗澡水里游泳」。机房里冷风呼呼地吹，值班工程师一年四季都穿着抓绒衣。"
      en: "The largest data centre on the Tukkaruviit Islands, cooled by polar air and sea water, its waste heat warming the island's homes. The warm water it discharges goes on to Tullivaq's swimming pools and greenhouses, so locals joke that they \"swim in the servers' bathwater\". Cold air roars through the halls, and the engineers on duty wear fleeces all year round."
    in: div_3xz1pw
    offset_km: [0.5, 0.3]
    site: { layout: complex, size_m: [500, 350] }
  - id: bld_tdvdfy
    subtype: data_centre
    status: generated
    names:
      zh: 北极光算力中心
      en: Northern Lights Compute Centre
      art-x-tavrunaq: Qavvalu Tukkaruvik
    notes:
      zh: "为人工智能训练出租算力的数据中心，海底光缆从这里连到世界各地。大楼外墙的灯带随着算力负载变换颜色，本地人看一眼墙色就知道「机器今天忙不忙」。中心的食堂按全球时区排班开饭，什么时候去都有热饭。"
      en: "A data centre renting out computing power for training artificial intelligence, linked to the world by undersea cables. The light strips on its façade change colour with the computing load, so locals can tell at a glance \"how busy the machines are today\". The canteen keeps hours for every time zone, so there is a hot meal whenever you turn up."
    in: div_3xz1pw
    offset_km: [-0.6, -0.4]
    site: { layout: complex, size_m: [500, 350] }
  - id: poi_rw025x
    subtype: ground_station
    status: generated
    names:
      zh: 陶武维特地面站
      en: Tauvvuviit Ground Station
      art-x-tavrunaq: Tauvvu Saqqavik
    notes:
      zh: "极轨卫星每一圈都经过高纬度上空，这里的天线阵接收卫星数据并转发到图卡鲁维特群岛。地面站一天要接收几十次过境的卫星数据，值班员有个习惯，每颗卫星飞过头顶就在黑板上画一道，一年下来黑板要擦好几百次。"
      en: "Polar-orbiting satellites pass over the high latitudes on every orbit; the antenna field here downloads their data and passes it to the Tukkaruviit Islands. The station takes dozens of satellite passes a day, and the duty staff chalk a stroke on a blackboard for each satellite overhead, wiping the board hundreds of times a year."
    in: div_6p8a1q
    offset_km: [2, 1]
    site: { size_m: [2400, 1400], layout: antenna, variant: large, angle_deg: 0 }

  # ── 考尔尼克市 ──
