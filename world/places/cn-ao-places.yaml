  # ── 努卡塔克市 ──
  - id: bld_jkn3vg
    subtype: government
    status: generated
    names:
      zh: 北冰洋领地政府
      en: Government of the Arctic Ocean Territory
      art-x-tavrunaq: Aqqimma Tavru Aaqqivik
    notes:
      zh: 北冰洋领地政务院的主楼，在首府努卡塔克市库马尔维克区，是一座回字形的庭院建筑，领地议会也在楼内，以暖廊与中央穹顶相连。政务院是领地的最高行政机关，由领地总督组织，下设十一个部和若干直属机构，各部按职能分成三个楼群：东北是中央派驻机构、对外事务和政策规划，西面是交通、建设、资源和税收，东南是司法、治安、教育和社会事务，三个楼群都以暖廊连到中央穹顶，极夜和暴风雪里也能步行往来；财政部在北面的帕卢尔尼克金融特区。主楼北翼是总督办公室，东翼和南翼是办公厅，西翼是议会议事厅，内院冬季加盖玻璃顶。办公厅下设综合行政局、媒体和出版局、财务局、安全局、档案局、采购局和公务员事务局。
      en: The main building of the Arctic Ocean Territory Executive Council, in Qummarvik District of the capital, Nuqattaaq, is a hollow square round a courtyard that also houses the territorial assembly, joined to the Central Dome by skyways. The Executive Council is the territory's highest executive body, formed by the governor, with eleven ministries and several directly attached bodies grouped by function in three clusters, all linked by skyways to the Central Dome so that staff can walk between them in the polar night and in blizzards. The north-east cluster holds the central government's offices, external affairs and planning, the west cluster transport, construction, resources and taxation, and the south-east cluster justice, public security, education and social affairs; the Ministry of Finance is in the Pallurniq Financial Zone to the north. The north wing holds the Governor's Office, the east and south wings the General Office with its seven bureaus, and the west wing the assembly chamber; in winter the courtyard is roofed over with glass.
    in: div_9s80v8
    offset_km: [0.4, 0.5]
    emblem_of: div_hpmerr
    site: { layout: courtyard, size_m: [300, 240] }
