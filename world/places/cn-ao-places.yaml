    notes:
      zh: 北冰洋领地政策和计划委员会，是政务院直属的特设委员会，位于库马尔维克区东北楼群，由总理主持，各部部长、独立专家和塔夫鲁利特长老议事会的代表参加。委员会编制领地的中长期发展规划，协调跨部门的重大政策，评估政策的实施效果；金融特区的扩展、数据中心与电力建设、西卢阿高速这样的大型工程，以及冰盖和冻土变化带来的长期风险，都先在这里形成方案，再提交领地议会。委员会每年发布领地发展报告，公开各市人口、产出和公共服务的指标。
      en: The Arctic Ocean Territory Policy and Planning Commission is a special commission directly under the Executive Council, in Qummarvik's north-east cluster, chaired by the premier with the ministers, independent experts and representatives of the Tavrulit Council of Elders as members. It draws up the territory's medium- and long-term development plans, coordinates major policies that cross ministries and reviews how they are working. The growth of the financial zone, data centres and power supply, great works like the Sillua Expressway and the long-term risks of a changing ice cap and permafrost all take shape here before going to the territorial parliament. Its yearly development report gives figures on each city's population, output and public services.
    in: div_9s80v8
    offset_km: [1.25, 0.75]
    site: { size_m: [90, 90], layout: block }
