    site: { layout: mine, size_m: [2600, 1800] }
  - id: poi_pf0bmd
    subtype: factory
    status: generated
    names:
      zh: 伊卢克萨特提锂厂
      en: Illuqsaat Brine Works
      art-x-tavrunaq: Illuqsaat Ukkuvik
    notes:
      zh: "从盐湖卤水中提取锂，产品供应电池工厂。夏天的阳光下，卤水池呈现深浅不一的蓝绿色，从飞机上看像一块调色板。冬天卤水池结冰停产，工人们转去室内的精制车间，等到春天冰化再重新开池。"
      en: "Extracts lithium from the brine of the salt lakes for battery makers. In the summer sun the brine pools shine in every shade of blue and green, like a painter's palette seen from the air. In winter the pools freeze and production moves to the indoor refining halls, and the pools are reopened when the ice melts in spring."
