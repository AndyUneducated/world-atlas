  - id: bld_frqd47
    subtype: government
    status: generated
    names:
      zh: 北冰洋领地政务院自然资源和环境保护部自然生态保护司
      en: Nature Conservation Department, Ministry of Natural Resources and Environmental Protection, Arctic Ocean Territory Executive Council
    short_names:
      zh: 自然生态保护司
      en: Nature Conservation Department
    notes:
      zh: 北冰洋领地政务院自然资源和环境保护部自然生态保护司，在部大楼西面单独建楼。领地四成多的土地划为生态保护区和冰盖管理区，自然生态保护司负责它们的划定、巡护和管理：西尔米冰盖管理区、苔原上的驯鹿迁徙通道、海象和北极熊栖息的海岸都在它的名录上。保护区内的狩猎和放牧与塔夫鲁利特长老议事会共同管理，传统的狩猎权受到保障；司里有一支巡护员队伍，乘雪地车和小型飞机巡视保护区，并定期统计野生动物的数量。
      en: "The Nature Conservation Department of the Ministry of Natural Resources and Environmental Protection has its own building west of the ministry. More than 40 percent of the territory's land is set aside as nature reserves and ice cap management areas, and the department draws their boundaries, patrols them and runs them: the Sirmi Ice Cap management area, the reindeer migration routes across the tundra and the coasts where walrus and polar bears live are all on its lists. Hunting and herding inside the reserves are managed jointly with the Tavrulit Council of Elders, and traditional hunting rights are protected. Its rangers patrol the reserves by snowmobile and light aircraft and count the wildlife."
