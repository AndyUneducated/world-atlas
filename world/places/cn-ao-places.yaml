      en: "An open-pit nickel mine whose ore travels to Immasaarvik on driverless heavy-haul trains. The trains are watched remotely from a control centre, and sensors at the reindeer crossings along the line stop a train automatically while a herd crosses, letting it go on once the deer are over: a rule agreed with the herders' elders when the line was built."
    in: div_m541k8
