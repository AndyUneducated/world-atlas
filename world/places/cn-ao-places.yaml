  - id: bld_n462he
    subtype: government
    status: generated
    names:
      zh: 中央政府常驻北冰洋领地高级国务督办办公室
      en: Office of the Senior State Commissioner of the Central Government in the Arctic Ocean Territory
    short_names:
      zh: 高级国务督办办公室
      en: Senior State Commissioner's Office
    notes:
      zh: 中央政府常驻北冰洋领地高级国务督办办公室，位于库马尔维克区东北楼群，是中央政府派驻领地的最高代表机构。高级国务督办代表中央政府督促国家法律和政策在领地的实施，协调国防、外交等中央事权与领地事务的衔接，例如北冰洋航道的安全、极地科考的国际合作和金融特区监管中涉及境外的部分；领地重大事项需要中央批准时，也由办公室转呈并跟进。办公室与政务院定期举行联席会议，每年向中央政府提交领地情况的报告。
      en: The Office of the Senior State Commissioner of the Central Government in the Arctic Ocean Territory, in Qummarvik's north-east cluster, is the central government's highest standing representation in the territory. The Senior State Commissioner sees that national laws and policies are carried out and links central responsibilities such as defence and foreign affairs with territorial business, for example the security of the Arctic shipping lanes, international cooperation in polar research and the cross-border side of supervising the financial zone. When a territorial matter needs central approval, the office forwards it and follows it up. It meets the Executive Council in regular joint sessions and reports on the territory to the central government every year.
    in: div_9s80v8
    offset_km: [0.75, 1.05]
    site: { size_m: [80, 80], layout: block }

  - id: bld_n7v763
    subtype: government
    status: generated
    names:
      zh: 中央政府常驻北冰洋领地巡视员办公室
      en: Office of the Central Government Inspector in the Arctic Ocean Territory
    short_names:
      zh: 巡视员办公室
      en: Inspector's Office
    notes:
      zh: 中央政府常驻北冰洋领地巡视员办公室，位于库马尔维克区东北楼群，由中央政府派驻，负责对领地各级行政机关进行巡视监督。巡视员定期检查政务院各部、各市人民政府和公共企业的政策执行、财政资金使用和廉洁情况，北冰洋公共银行的利润分配和居民分红的发放是巡视的重点之一；去往北岸和苔原上的偏远聚落时，巡视员乘小型飞机，夏季也乘船前往。发现的问题同时报告中央政府和领地总督，并跟踪整改。办公室设有公众来访接待室，也接受网上举报，巡视报告的摘要定期公开。
      en: The Office of the Central Government Inspector in the Arctic Ocean Territory, in Qummarvik's north-east cluster, is sent by the central government to inspect and oversee the territory's administration at every level. Inspectors regularly check how the ministries, the city governments and public companies carry out policy, spend public money and keep their officials honest, and the share-out of the Arctic Ocean Public Bank's profits and the residents' dividend are a standing focus. To reach the north coast and the tundra settlements they fly in light aircraft or, in summer, go by boat. What they find goes to both the central government and the governor, and they follow it up. The office has a public reception room and takes reports online, and summaries of its reports are published.
    in: div_9s80v8
    offset_km: [1.05, 1.05]
    site: { size_m: [80, 80], layout: block }

  - id: bld_d4vna5
    subtype: government
    status: generated
    names:
      zh: 中央政府常驻北冰洋领地人权事务高级专员办公室
      en: Office of the Central Government High Commissioner for Human Rights in the Arctic Ocean Territory
    short_names:
      zh: 人权事务高级专员办公室
      en: Human Rights Commissioner's Office
    notes:
      zh: 中央政府常驻北冰洋领地人权事务高级专员办公室，位于库马尔维克区东北楼群，由中央政府派驻，监督领地人权保障的情况。塔夫鲁纳克语母语者占领地人口一半以上，高级专员特别关注原住民的土地和狩猎权利、塔夫鲁纳克语在法庭、学校和公共服务中的使用，以及塔夫鲁利特原住民自治区的自治权；它也关注外来劳动者的权益和拘留场所的条件，可以查阅档案、走访看守所，接受个人申诉，并向领地机关提出建议。办公室每年发布领地人权报告，原住民权利是其中篇幅最长的章节。
      en: The Office of the Central Government High Commissioner for Human Rights in the Arctic Ocean Territory, in Qummarvik's north-east cluster, is sent by the central government to watch over human rights in the territory. Native speakers of Tavrunaq are more than half the population, and the High Commissioner pays particular attention to indigenous land and hunting rights, the use of Tavrunaq in the courts, schools and public services, and the self-government of the Tavrulit Indigenous Autonomous Region. It also looks at the rights of incoming workers and at conditions in detention, can examine records and visit remand centres, hears individual complaints and makes recommendations to territorial bodies. Indigenous rights take up the longest chapter of its yearly report.
    in: div_9s80v8
    offset_km: [1.35, 1.05]
    site: { size_m: [80, 80], layout: block }

  - id: bld_p5r7bm
    subtype: government
    status: generated
    names:
      zh: 北冰洋领地政策和计划委员会
      en: Arctic Ocean Territory Policy and Planning Commission
    short_names:
      zh: 政策和计划委员会
      en: Policy and Planning Commission
    notes:
      zh: 北冰洋领地政策和计划委员会，是政务院直属的特设委员会，位于库马尔维克区东北楼群，由总督主持，各部部长、独立专家和塔夫鲁利特长老议事会的代表参加。委员会编制领地的中长期发展规划，协调跨部门的重大政策，评估政策的实施效果；金融特区的扩展、数据中心与电力建设、西卢阿高速这样的大型工程，以及冰盖和冻土变化带来的长期风险，都先在这里形成方案，再提交领地议会。委员会每年发布领地发展报告，公开各市人口、产出和公共服务的指标。
      en: The Arctic Ocean Territory Policy and Planning Commission is a special commission directly under the Executive Council, in Qummarvik's north-east cluster, chaired by the governor with the ministers, independent experts and representatives of the Tavrulit Council of Elders as members. It draws up the territory's medium- and long-term development plans, coordinates major policies that cross ministries and reviews how they are working. The growth of the financial zone, data centres and power supply, great works like the Sillua Expressway and the long-term risks of a changing ice cap and permafrost all take shape here before going to the territorial parliament. Its yearly development report gives figures on each city's population, output and public services.
    in: div_9s80v8
    offset_km: [1.25, 0.75]
    site: { size_m: [90, 90], layout: block }
