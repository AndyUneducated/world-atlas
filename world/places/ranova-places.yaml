    status: generated
    names: {"zh": "达兰海滨度假酒店", "en": "Daran Beach Resort"}
    notes: {"zh": "达兰海滨度假酒店建在白沙滩边，有三百多间客房、三座游泳池和一个潜水中心，客人大多来自阵营盟国和海外。酒店前的珊瑚礁是潜水的好去处，退潮时可以看到成群的热带鱼。旅游旺季时，酒店雇用了附近村庄的许多年轻人。", "en": "Daran Beach Resort stands on a white sand beach, with over 300 rooms, three pools and a dive centre; most guests come from allied countries and further abroad. The coral reef in front is a fine dive site, and at low tide shoals of tropical fish can be seen. In high season the resort employs many young people from the nearby villages."}
