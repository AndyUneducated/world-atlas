  - id: bld_1jea5f
    subtype: government
    status: generated
    names: {"zh": "金顶王宫", "en": "Golden-Roofed Royal Palace"}
    notes: {"zh": "金顶王宫建在洛哈瓦托城中心的山丘上，是国王安德里亚纳·塔纳七世的宫殿，也是王国的宗教中心。王宫和王家寺院连为一体，金色的多层屋顶在阳光下从全城各处都能望见。宫殿围绕一座回字形的庭院建成，北侧是国王的寝宫和王室咨议会的议事厅，南侧是供奉佛陀和历代国王牌位的大殿。每天清晨，僧侣们从宫门出发，沿转经道绕城托钵。王宫的外院和大殿对游客开放，进入时须脱鞋并穿着长衣长裤。", "en": "The Golden-Roofed Royal Palace stands on the hill in the middle of Lohavato and is the palace of King Andriana Tana VII and the religious heart of the kingdom. The palace and the royal monastery form a single complex, and its golden tiered roofs can be seen from every part of the city. It is built round a quadrangle: on the north side are the king's apartments and the chamber of the Royal Privy Council, on the south the great hall of the Buddha and the memorial tablets of past kings. Every morning monks set out from the palace gate to walk the pilgrims' path round the city collecting alms. The outer court and the great hall are open to visitors, who must take off their shoes and wear long sleeves and trousers."}
    emblem_of: div_gd73a5
    in: div_mt8f0c
    offset_km: [0.00, 0.00]
    site: {"layout": "courtyard", "size_m": [300, 260]}
  - id: bld_xaefs9
    subtype: government
    status: generated
    names: {"zh": "王国议会大厦", "en": "Royal Assembly House"}
    notes: {"zh": "王国议会大厦位于王宫山脚下的广场边，是王国议会六十名议员开会的地方。议员一半由选举产生，一半由国王任命，其中包括僧团的代表；议会可以审议预算和法律，但国王有权否决。大厦是一座木构的长殿，屋顶覆盖红色琉璃瓦，殿内铺着手织地毯，议员按传统席地而坐。每届会期开幕时，国王亲临大殿宣读敕语。王国推行「国民幸福」政策，议会每年审议一份国民幸福调查报告。", "en": "The Royal Assembly House stands by the square at the foot of the palace hill and is where the 60 members of the Royal Assembly sit. Half are elected and half appointed by the king, including representatives of the monastic order; the Assembly debates the budget and laws, but the king may veto them. The building is a long timber hall roofed with red glazed tiles and carpeted with handwoven rugs, and members sit on the floor in the traditional way. At the opening of each session the king comes in person to read the royal address. The kingdom pursues a policy of 'national happiness', and the Assembly debates a national happiness survey every year."}
    in: div_mt8f0c
    offset_km: [-0.40, -0.10]
    site: {"layout": "hall", "size_m": [200, 140]}
  - id: bld_t7zs1f
