  - id: bld_v9b8tx
    subtype: marketplace
    status: generated
    names: {"zh": "安博维香草交易所", "en": "Ambovy Vanilla Exchange"}
    notes: {"zh": "安博维香草交易所是全岛最大的香草交易市场，每年收获季节，商人们在这里竞价收购香草荚。交易所名义上由政府管理，实际上收购价格由「三家族」操控，种植户抱怨辛苦一年的收入被压得很低。", "en": "The Ambovy Vanilla Exchange is the island's largest vanilla market, where traders bid for the pods each harvest. In name it is run by the government, but the 'Three Families' fix the prices, and growers complain that a year's hard work earns them very little."}
