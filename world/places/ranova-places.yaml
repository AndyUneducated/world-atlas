  # ── 马哈维洛 / Mahavelo ──
  - id: bld_f6j228
    subtype: government
    status: generated
    names: {"zh": "行政长官府", "en": "Chief Executive's Office"}
    notes: {"zh": "行政长官府位于马哈维洛港区中心的一座三十层大楼的顶部几层，是行政长官西莫娜·马哈的办公地。行政长官由一个以商界为主的选举委员会选出，任期五年，负责领导政府和制定政策。大楼的下半部分是港务局和海关的办公室，从顶层的会议室可以俯瞰整个集装箱码头。行政长官每年在立法会发表施政报告，重点总是港口吞吐量、税率和土地供应。", "en": "The Chief Executive's Office occupies the top floors of a thirty-storey tower in the middle of Mahavelo's port district and is where Chief Executive Simona Maha works. The Chief Executive is chosen by an election committee drawn mostly from business, for five years, and leads the government and sets policy. The lower half of the tower holds the Port Authority and Customs, and from the top-floor conference room the whole container terminal is laid out below. Each year the Chief Executive delivers a policy address to the Legislative Council, always centred on port throughput, tax rates and land supply."}
    emblem_of: div_3w5wwh
    in: div_56918f
    offset_km: [0.00, 0.00]
    site: {"layout": "tower", "size_m": [140, 140]}
  - id: bld_gv2fwn
    subtype: government
    status: generated
    names: {"zh": "立法会大楼", "en": "Legislative Council Building"}
    notes: {"zh": "立法会大楼位于海滨公园旁，是立法会四十名议员开会的地方。议员一半由地区直选产生，另一半由航运、金融、贸易、地产等功能组别选出，商界因此在立法会中占据主导。大楼是一座低矮的玻璃建筑，议事厅面向大海。立法会负责审议法律和预算，但涉及政府开支的议案只能由行政长官提出。近年来，直选议员多次要求增加公共住房和提高最低工资，与功能组别议员争论激烈。", "en": "The Legislative Council Building stands beside the seafront park and is where the 40 members of the Legislative Council sit. Half are directly elected by district and half by functional constituencies such as shipping, finance, trade and property, so business dominates the council. The building is low and glass-walled, its chamber facing the sea. The council scrutinises laws and the budget, but only the Chief Executive may propose bills involving public spending. In recent years the directly elected members have repeatedly called for more public housing and a higher minimum wage, in heated argument with the functional-constituency members."}
    in: div_56918f
    offset_km: [-0.30, 0.00]
    site: {"layout": "slab", "size_m": [200, 120]}
  - id: bld_snz2bx
    subtype: government
    status: generated
    names: {"zh": "政府总部", "en": "Central Government Offices"}
    notes: {"zh": "政府总部是马哈维洛各政策局和部门的集中办公地，位于立法会大楼对面的两座相连的高楼里。城邦政府规模很小，只有十二个政策局，以「小政府、大市场」为原则，公务员人数在全岛各国中按人口比例最少。大楼的一层设有一站式的公司注册处，外国投资者可以在一天之内办完公司登记。", "en": "The Central Government Offices, two linked towers across from the Legislative Council, bring Mahavelo's policy bureaux and departments together under one roof. The city-state's government is small, with only twelve policy bureaux, run on the principle of 'small government, big market', and it has the fewest civil servants for its population of any country on the island. On the ground floor is a one-stop company registry where foreign investors can register a company within a day."}
    in: div_56918f
    offset_km: [-0.10, -0.30]
    site: {"layout": "slab", "size_m": [220, 130]}
  - id: bld_atec2x
    subtype: office
    status: generated
    names: {"zh": "马哈维洛国际金融中心", "en": "Mahavelo International Finance Centre"}
    notes: {"zh": "马哈维洛国际金融中心是城里最高的摩天楼，高两百多米，入驻着几十家银行、保险公司和律师事务所。大楼的玻璃幕墙倒映着海湾，是城市天际线的标志。顶层的观景台对公众开放，天气好时可以望见远处的群岛。", "en": "Mahavelo International Finance Centre is the city's tallest skyscraper, more than 200 m high, home to dozens of banks, insurers and law firms. Its glass curtain walls mirror the bay and define the city's skyline. The observation deck at the top is open to the public, and on clear days the distant islands can be seen."}
    in: div_56918f
    offset_km: [0.20, -0.20]
    site: {"layout": "tower", "size_m": [120, 120]}
  - id: bld_z6qb06
    subtype: bank
    status: generated
    names: {"zh": "马哈维洛证券交易所", "en": "Mahavelo Stock Exchange"}
    notes: {"zh": "马哈维洛证券交易所是马哈维洛的证券交易所，上市公司涵盖银行、航运、地产和种植园企业。交易大厅已改为电子交易，但每天开市时仍保留敲钟的仪式。交易所的指数是拉诺瓦岛经济的重要风向标，阵营之间的局势一紧张，指数就会大幅波动。", "en": "Mahavelo Stock Exchange is Mahavelo's securities exchange, listing banks, shipping lines, property companies and plantation firms. Trading is now electronic, but the bell is still rung every day at the opening. Its index is an important barometer of Ranova's economy and swings sharply whenever tension rises between the blocs."}
    in: div_56918f
    offset_km: [-0.10, 0.30]
    site: {"layout": "hall", "size_m": [200, 140]}
  - id: bld_hxa3pc
    subtype: bank
    status: generated
    names: {"zh": "马哈维洛中央银行", "en": "Central Bank of Mahavelo"}
    notes: {"zh": "马哈维洛中央银行负责发行货币、管理外汇储备和监管商业银行。银行大楼是一座十几层的方形塔楼，地下有存放黄金和外汇储备的金库。大分裂后，各国从联合共和国的中央银行分得了一部分黄金储备，马哈维洛的那一份至今仍存放在这座楼里。银行一楼设有货币博物馆，展出联合共和国时期和独立以来发行的纸币与硬币。", "en": "The Central Bank of Mahavelo issues the currency, manages the foreign-exchange reserves and supervises the commercial banks. Its building is a square tower of a dozen or so storeys with vaults below for the gold and currency reserves. After the Sundering each country received a share of the gold reserves of the United Republic's central bank, and Mahavelo's share is still kept here. A currency museum on the ground floor shows the notes and coins of the United Republic and those issued since independence."}
    in: div_56918f
    offset_km: [0.20, 0.20]
    site: {"layout": "tower", "size_m": [140, 140]}
  - id: bld_744ptz
    subtype: data_centre
    status: generated
    names: {"zh": "马哈维洛数据中心", "en": "Mahavelo Data Centre"}
    notes: {"zh": "马哈维洛数据中心是马哈维洛最大的数据中心，为银行、航运公司和政府部门提供服务器托管和云计算服务。机房由海水冷却，有三路独立的电源和两条海底光缆连接海外。大楼外观是一座没有窗户的长方形建筑，四周设有围栏和监控。", "en": "Mahavelo Data Centre is Mahavelo's largest, hosting servers and cloud services for banks, shipping lines and government departments. Its halls are cooled by seawater and fed by three independent power supplies, with two submarine cables to the world outside. It is a windowless rectangular building behind fences and cameras."}
    in: div_56918f
    offset_km: [2.12, 2.12]
    site: {"layout": "slab", "size_m": [240, 120], "angle_deg": 135, "rural": true}
  - id: poi_et9qrm
    subtype: logistics_park
    status: generated
    names: {"zh": "马哈维洛保税物流园", "en": "Mahavelo Bonded Logistics Park"}
    notes: {"zh": "马哈维洛保税物流园是马哈维洛最大的仓储和转运中心，几十座大型仓库沿公路排开，集装箱卡车从港口把货物运到这里分拣，再发往全国和邻国。园区的冷链仓库储存着出口的水产和水果。物流园二十四小时运转，夜里的灯光从远处就能看见。", "en": "Mahavelo Bonded Logistics Park is Mahavelo's largest storage and distribution centre, dozens of big warehouses along the highway where container lorries bring goods from the port to be sorted and sent on across the country and to its neighbours. Its cold stores hold seafood and fruit for export. It runs round the clock, and its lights can be seen from far away at night."}
    in: div_56918f
    offset_km: [-2.77, 1.15]
    site: {"layout": "plant", "size_m": [1000, 700], "variant": "depot", "angle_deg": 68, "rural": true}
  - id: bld_z021hg
    subtype: government
    status: generated
    names: {"zh": "海关总署", "en": "Customs and Excise Department"}
    notes: {"zh": "海关总署是马哈维洛海关的总部，位于集装箱码头旁。自由港对绝大多数货物免征关税，海关的主要工作是查验转运货物、打击走私和执行国际制裁。海关缉私队的快艇就停泊在总署楼下的码头上。", "en": "The Customs and Excise Department is the headquarters of Mahavelo Customs, beside the container terminal. The free port charges no duty on almost all goods, so Customs' main work is checking transhipments, fighting smuggling and enforcing international sanctions. The Customs Anti-Smuggling Unit's launches berth at the quay below."}
    in: div_56918f
    offset_km: [0.50, 0.00]
    site: {"layout": "slab", "size_m": [200, 100]}
  - id: bld_e5k070
    subtype: industrial_park
    status: generated
    names: {"zh": "马哈维洛自由贸易区", "en": "Mahavelo Free Trade Zone"}
    notes: {"zh": "马哈维洛自由贸易区是填海造地建成的工业和贸易园区，入驻着几百家加工、包装和贸易公司，货物在这里拆箱、重新包装后转运到岛上各国和海外。贸易区实行零关税、零增值税，公司注册只需一天。", "en": "The Mahavelo Free Trade Zone is an industrial and trading estate on reclaimed land, home to several hundred processing, packing and trading firms where goods are unpacked, repacked and sent on to the island and abroad. It charges no duty or VAT, and a company can be registered in a day."}
    in: div_56918f
    offset_km: [1.15, 2.77]
    site: {"layout": "campus", "size_m": [700, 500], "angle_deg": 158, "rural": true}
  - id: bld_gxmw4c
    subtype: headquarters
    status: generated
    names: {"zh": "马哈维洛航运大厦", "en": "Mahavelo Shipping House"}
    notes: {"zh": "马哈维洛航运大厦是马哈维洛最大的航运公司的总部，公司经营几十艘集装箱船和散货船，航线连接拉诺瓦各港口和环太平洋的大港。大楼的顶层是航运交易所，船东和货主在这里洽谈租船合同。", "en": "Mahavelo Shipping House is the headquarters of the city's largest shipping line, which runs dozens of container ships and bulk carriers linking Ranova's ports with the great harbours of the Pacific Rim. The top floor houses the shipping exchange, where owners and shippers negotiate charters."}
    in: div_56918f
    offset_km: [-0.40, -0.30]
    site: {"layout": "tower", "size_m": [120, 120]}
  - id: bld_z6bstq
    subtype: hotel
    status: generated
    names: {"zh": "马哈维洛大饭店", "en": "Mahavelo Grand Hotel"}
    notes: {"zh": "马哈维洛大饭店是城里最高级的酒店，一座二十层的塔楼，外国代表团、记者和商人大多住在这里。顶层的旋转餐厅可以俯瞰全城。战争年代，大饭店的大堂是外国记者交换消息的地方，酒吧里至今挂着当年的新闻照片。", "en": "The Mahavelo Grand Hotel is the city's finest hotel, a twenty-storey tower where most foreign delegations, journalists and businesspeople stay. The revolving restaurant on the top floor looks out over the whole city. In the war years its lobby was where foreign correspondents traded news, and the bar still has photographs from those days on its walls."}
    in: div_56918f
    offset_km: [-0.40, 0.30]
    site: {"layout": "tower", "size_m": [120, 120]}
  - id: bld_688yx3
    subtype: exhibition_centre
    status: generated
    names: {"zh": "马哈维洛国际会展中心", "en": "Mahavelo International Exhibition Centre"}
    notes: {"zh": "马哈维洛国际会展中心是马哈维洛最大的会展场馆，有三个展厅和一个可容纳两千人的会议厅。每年在这里举办的国际贸易博览会吸引着岛上各国和海外的商人，阵营之间的部分谈判也曾在会议厅举行。", "en": "Mahavelo International Exhibition Centre is Mahavelo's largest venue for fairs and conferences, with three exhibition halls and a conference hall for 2,000. The international trade fair held here each year draws merchants from across the island and abroad, and some talks between the blocs have been held in its conference hall."}
    in: div_56918f
    offset_km: [0.20, 0.60]
    site: {"layout": "hall", "size_m": [300, 200]}
  - id: bld_k90q2d
    subtype: hospital
    status: generated
    names: {"zh": "马哈维洛总医院", "en": "Mahavelo General Hospital"}
    notes: {"zh": "马哈维洛总医院是马哈维洛最大的综合医院，设有一千多张病床，急诊、外科、产科和传染病科是主要科室。医院也是大学医学院的教学医院，各地的疑难病人都转诊到这里。战争年代，医院曾收治大量伤员，至今设有专门的创伤和康复中心。门诊大楼前每天清晨排起长队，许多病人从外地坐一整夜的车赶来。", "en": "Mahavelo General Hospital is Mahavelo's largest general hospital, with over a thousand beds; emergency medicine, surgery, obstetrics and infectious diseases are its main departments. It is also the teaching hospital of the university's medical school, and difficult cases from across the country are referred here. In the war years it treated great numbers of wounded, and it still has a dedicated trauma and rehabilitation centre. Every morning long queues form outside the outpatient building, many patients having travelled all night to get here."}
    in: div_56918f
    offset_km: [-0.70, 0.00]
    site: {"layout": "complex", "size_m": [320, 240]}
  - id: bld_4mhp79
    subtype: university
    status: generated
    names: {"zh": "马哈维洛理工大学", "en": "Mahavelo Polytechnic University"}
    notes: {"zh": "马哈维洛理工大学是马哈维洛规模最大的高等学府，设有文、理、医、法、工、农等学院，在校学生一万多人。校园建在城市边缘的缓坡上，教学楼之间是大片的草坪和芒果树。大学的医学院为全国培养了大部分医生，农学院的稻作和热带作物研究在全岛都有名气。每年毕业典礼时，毕业生穿着传统的披肩在校园里游行。", "en": "The Mahavelo Polytechnic University is Mahavelo's largest institution of higher education, with faculties of arts, sciences, medicine, law, engineering and agriculture and more than 10,000 students. Its campus lies on gentle slopes at the edge of the city, with broad lawns and mango trees between the buildings. Its medical school has trained most of the country's doctors, and its agricultural school is known across the island for research on rice and tropical crops. At each graduation the graduates parade round the campus in traditional shawls."}
    in: div_56918f
    offset_km: [-0.50, -1.00]
    site: {"layout": "campus", "size_m": [900, 600]}
  - id: bld_00y4tm
