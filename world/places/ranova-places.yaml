    notes: {"zh": "菲拉纳国营农场在山间的梯田上种植水稻和玉米，是马索沃利最大的粮食产地。农场的劳动按军事化方式组织，农忙季节城里的学生、工人和士兵都要下乡支援插秧和收割。歉收的年份，农场的产量常常不足，国家要依靠阿瓦拉齐的援助。", "en": "The Firana State Farm grows rice and maize on hill terraces and is Masovoly's largest source of grain. Its work is organised on military lines, and in the busy seasons students, workers and soldiers from the city are sent to help with planting and harvest. In bad years its output often falls short and the country depends on aid from Avaratsy."}
