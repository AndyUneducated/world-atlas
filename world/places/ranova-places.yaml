  - id: bld_tsspv5
    subtype: office
    status: generated
    names: {"zh": "苏丹国主权财富基金大厦", "en": "Sultanate Sovereign Wealth Fund Tower"}
    notes: {"zh": "苏丹国主权财富基金大厦是努西拉主权财富基金的总部，基金把石油收入投资于海外的股票、债券和地产，为石油枯竭后的未来储备财富。基金的规模据估计相当于国内生产总值的好几倍，投资决定由苏丹任命的委员会作出。", "en": "The Sultanate Sovereign Wealth Fund Tower is the headquarters of Nusira's sovereign fund, which invests oil revenue in shares, bonds and property abroad to save for the day the oil runs out. The fund is estimated to be worth several times the country's GDP, and its investments are decided by a committee the sultan appoints."}
    in: div_vtqsys
    offset_km: [0.40, 0.00]
    site: {"layout": "tower", "size_m": [120, 120]}
  - id: poi_61t5jx
    subtype: housing
    status: generated
    names: {"zh": "努西拉劳工城", "en": "Nusira Labour City"}
    notes: {"zh": "努西拉劳工城位于城郊，是外籍劳工集中居住的宿舍区，几十座四层宿舍楼住着来自岛上各国和海外的建筑工人、清洁工和家政工人。外籍劳工占努西拉人口的三分之一，但没有公民权，工作签证与雇主绑定。国际劳工组织多次批评这里的住宿条件和工作时间。", "en": "Nusira Labour City, on the edge of town, is the dormitory district for foreign workers, dozens of four-storey blocks housing construction workers, cleaners and domestic workers from across the island and abroad. Foreign workers make up a third of Nusira's population but have no citizenship, and their work visas are tied to their employers. International labour bodies have repeatedly criticised the housing and working hours here."}
