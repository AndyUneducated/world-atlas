    notes: {"zh": "安博维大饭店是城里最高级的酒店，一座二十层的塔楼，外国代表团、记者和商人大多住在这里。顶层的旋转餐厅可以俯瞰全城。战争年代，大饭店的大堂是外国记者交换消息的地方，酒吧里至今挂着当年的新闻照片。", "en": "The Ambovy Grand Hotel is the city's finest hotel, a twenty-storey tower where most foreign delegations, journalists and businesspeople stay. The revolving restaurant on the top floor looks out over the whole city. In the war years its lobby was where foreign correspondents traded news, and the bar still has photographs from those days on its walls."}
