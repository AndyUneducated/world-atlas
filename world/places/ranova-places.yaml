    status: generated
    names: {"zh": "安博哈拉国家剧院", "en": "Ambohara National Theatre"}
    notes: {"zh": "安博哈拉国家剧院是安博哈拉主要的表演艺术场所，主剧场有一千二百个座位，上演话剧、歌剧、传统歌舞和交响音乐会。剧院的圆形屋顶仿照传统的编织斗笠设计。国家歌舞团常驻在这里，每年的新年演出和民族歌舞节都一票难求。", "en": "The Ambohara National Theatre is the country's main venue for the performing arts; its main house of 1,200 seats stages plays, opera, traditional song and dance and symphony concerts. Its round roof is modelled on a traditional woven hat. The national song and dance company is resident here, and tickets for its New Year show and the folk dance festival are hard to come by."}
