    names: {"zh": "执政官宫", "en": "Palace of the Consul"}
    notes: {"zh": "执政官宫位于瓦罗纳老港的码头广场上，是执政官的官邸和共和国政府的所在地。执政官由大议会选出，任期六年，不得连任，是国家元首和政府首脑，现任执政官是安娜·瓦罗尼。宫殿是一座带拱廊的大理石建筑，底层的拱廊向码头广场敞开，商人们从前就在这里谈生意；二楼的议事厅墙上挂着历任执政官的肖像和瓦罗纳商船的航线图。宫殿的一部分改成了共和国历史博物馆，对公众开放。", "en": "The Palace of the Consul stands on the quay square of Varona's old harbour and is the residence of the Consul and the seat of the republic's government. The Consul is elected by the Great Council for a single six-year term and is both head of state and head of government; the current Consul is Ana Varony. The palace is an arcaded marble building whose ground-floor arcade opens onto the quay square, where merchants once did their business; the council room upstairs is hung with portraits of past Consuls and charts of Varona's trading routes. Part of the palace is now the Museum of the Republic, open to the public."}
    emblem_of: div_hxyyfe
    in: div_9gzdds
