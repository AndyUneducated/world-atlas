    notes: {"zh": "米拉卡王宫位于港口广场北侧，是国王托阿维纳二世的官邸。王国实行议会制君主立宪，国王是虚位元首，签署议会通过的法律、任命议会多数派推举的首相，并主持国家庆典。王宫是一座两层的石砌回字形建筑，正门前的王室卫队每天中午换岗，红色制服和熊皮高帽是游客必看的景象。王宫的花园和部分礼仪厅在夏季对公众开放，国王每年圣诞节在这里发表电视讲话。", "en": "The Royal Palace of Miraka stands on the north side of the harbour square and is the residence of King Toavina II. The kingdom is a parliamentary constitutional monarchy; the king is a ceremonial head of state who signs the laws Parliament passes, appoints the prime minister put forward by the majority and presides over state ceremonies. The palace is a two-storey stone quadrangle, and the changing of the Royal Guard at its front gate every noon, in red tunics and tall fur caps, is a sight no visitor misses. The gardens and some of the state rooms are open to the public in summer, and the king gives a televised address from here every Christmas."}
