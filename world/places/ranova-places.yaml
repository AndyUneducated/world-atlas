    names: {"zh": "安巴罗人道援助仓库", "en": "Ambaro Humanitarian Aid Warehouse"}
    notes: {"zh": "安巴罗人道援助仓库是国际援助机构在安巴罗的主要物资中转站，储存着粮食、帐篷、药品和净水设备。援助物资从港口运到这里登记分拣，再用卡车送往难民营和受灾村庄。仓库由援助机构和当地工人共同管理，门口的告示板上写着当周的配送计划。", "en": "Ambaro Humanitarian Aid Warehouse is the international aid agencies' main supply hub in Ambaro, holding food, tents, medicine and water purification kits. Supplies come from the port to be logged and sorted here, then go by lorry to the refugee camps and stricken villages. It is run jointly by the agencies and local workers, and a board at the gate shows the week's delivery plan."}
