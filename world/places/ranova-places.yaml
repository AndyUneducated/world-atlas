    site: {"layout": "tower", "size_m": [140, 140]}
  - id: bld_cg0xnc
    subtype: office
    status: generated
    names: {"zh": "安博维商业银行大厦", "en": "Ambovy Commercial Bank Tower"}
    notes: {"zh": "安博维商业银行大厦是城里最高的摩天楼，高两百多米，入驻着几十家银行、保险公司和律师事务所。大楼的玻璃幕墙倒映着海湾，是城市天际线的标志。顶层的观景台对公众开放，天气好时可以望见远处的群岛。", "en": "Ambovy Commercial Bank Tower is the city's tallest skyscraper, more than 200 m high, home to dozens of banks, insurers and law firms. Its glass curtain walls mirror the bay and define the city's skyline. The observation deck at the top is open to the public, and on clear days the distant islands can be seen."}
