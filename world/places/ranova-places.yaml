places:

  # ── 安博哈拉 / Ambohara ──
  - id: bld_smgzc1
    subtype: government
    status: generated
    names: {"zh": "联邦总统府", "en": "Federal Presidential Palace"}
    notes: {"zh": "联邦总统府坐落在安博哈拉旧城北面的总统山顶，是联邦总统的官邸和办公地，与东面议会山上的联邦议会大厦、南面山顶的圣三一大教堂遥遥相望。主楼是一座红砖砌成的回字形建筑，四角各有一座方形塔楼，中庭种满白色兰花——联邦的国花。立国时的制宪会议就在这座楼的大厅里召开，宪法原件至今陈列在一层的序言厅。现任联邦总统塔希里·拉沃哈西每周一在这里主持内阁会议。每逢立国日，总统在正门台阶上检阅国民警卫队仪仗，随后步行下山前往大教堂参加感恩礼拜。外围花园在星期六向公众开放。", "en": "The Federal Presidential Palace stands on Presidential Hill north of Ambohara's old town and is the residence and office of the Federal President, facing the Federal Assembly on Assembly Hill to the east and Holy Trinity Cathedral on the southern summit. The main building is a red-brick quadrangle with a square tower at each corner, its inner court planted with white orchids, the national flower. The constitutional convention that founded the federation met in its great hall, and the original constitution is still on display in the Preamble Room on the ground floor. The current Federal President, Tahiry Ravohasy, chairs the cabinet here every Monday. On Foundation Day the president reviews the National Guard's honour guard on the front steps, then walks down the hill to the cathedral for a service of thanksgiving. The outer gardens are open to the public on Saturdays."}
    emblem_of: div_mj41d0
    in: div_qnzksj
    offset_km: [0.00, 0.00]
    site: {"layout": "courtyard", "size_m": [260, 220]}
  - id: bld_m2gkwq
    subtype: government
    status: generated
    names: {"zh": "联邦议会大厦", "en": "Federal Assembly Building"}
    notes: {"zh": "联邦议会大厦位于议会山顶，是联邦议会一百五十一名议员开会的地方。大厦正面立着十根石柱，代表十个联邦市；半圆形的议事厅上方是一座铜绿色圆顶，正对主席台的墙上挂着一个木制十字架，这是宪法明文规定的。联邦议会采用混合选举制，一部分议员在选区直选，其余按政党得票比例分配。每届议会开幕前，全体议员先到大教堂参加礼拜，再列队步行回到议会山。会期内旁听席对预约的公众开放，一层的展厅介绍联邦宪法和选举制度的来历。", "en": "The Federal Assembly Building on Assembly Hill is where the 151 members of the Federal Assembly sit. Ten stone columns across its front stand for the ten federal cities; the semicircular chamber lies under a verdigris dome, and a wooden cross hangs on the wall facing the Speaker's chair, as the constitution requires. The Assembly is elected by a mixed system, some members in constituencies and the rest in proportion to the party vote. Before each new Assembly opens, all members attend a service at the cathedral and then walk back up Assembly Hill in procession. During sittings the public gallery is open to visitors who book ahead, and an exhibition on the ground floor tells the story of the constitution and the electoral system."}
    in: div_qnzksj
    offset_km: [-0.40, 0.00]
    site: {"layout": "dome", "size_m": [220, 200]}
  - id: bld_wah45h
    subtype: court
    status: generated
    names: {"zh": "联邦最高法院", "en": "Federal Supreme Court"}
    notes: {"zh": "联邦最高法院位于总统山与议会山之间的谷地，是联邦的最高审判机关，也负责审查法律是否符合宪法。九名大法官由联邦总统提名、联邦议会批准，任职到七十岁。法院大楼是一座灰石砌成的回字形建筑，门廊上刻着宪法序言中的一句话：「正义建立在上帝的律法之上」。近年来，法院在宗教学校经费、星期日停业令和新闻自由等案件上的判决屡屡引起争论，开庭时门外常有支持和反对的人群。重大案件的宣判通过电视直播。", "en": "The Federal Supreme Court sits in the valley between Presidential Hill and Assembly Hill and is the federation's highest court, which also reviews whether laws conform to the constitution. Its nine justices are nominated by the Federal President, confirmed by the Federal Assembly and serve until seventy. The court building is a grey stone quadrangle, its portico carved with a line from the preamble of the constitution: 'Justice rests on the law of God'. In recent years its rulings on funding for church schools, the Sunday closing law and press freedom have often caused controversy, and crowds for and against gather outside when it sits. Judgments in major cases are broadcast live on television."}
    in: div_qnzksj
    offset_km: [0.00, -0.40]
    site: {"layout": "courtyard", "size_m": [180, 150]}
  - id: bld_y3zy29
    subtype: church
    status: generated
    names: {"zh": "圣三一大教堂", "en": "Holy Trinity Cathedral"}
    notes: {"zh": "圣三一大教堂是安博哈拉最大的教堂，一座红砖砌成的哥特复兴式建筑，双塔高五十多米，可容纳三千名信众。教堂内的彩色玻璃窗描绘了福音书的故事，也有拉诺瓦岛最早的传教士登岸的场景。每个星期日，全城的家庭穿着白色的衣服来做礼拜，钟声从清晨一直响到中午。", "en": "Holy Trinity Cathedral is the largest church in Ambohara, a Gothic Revival building of red brick whose twin towers rise more than 50 m; it holds 3,000 worshippers. Its stained-glass windows show the stories of the Gospels and the landing of the first missionaries on Ranova. Every Sunday families from all over the city come to worship dressed in white, and the bells ring from dawn until noon."}
    in: div_qnzksj
    offset_km: [-0.20, 0.30]
    site: {"layout": "hall", "size_m": [180, 90]}
  - id: bld_kyp97r
    subtype: church
    status: generated
    names: {"zh": "教会联合会大楼", "en": "Council of Churches House"}
    notes: {"zh": "教会联合会大楼位于安博哈拉大教堂山脚下，是联邦新教和天主教各教会的联合机构所在地。联合会在教育、婚姻和社会福利上拥有很大影响力，全国三成的学校和大部分孤儿院由教会开办，联邦议会讨论相关法案前都要征求联合会的意见。大楼一层的礼拜堂每天中午举行为国家祈祷的礼拜。", "en": "The Council of Churches House, at the foot of the cathedral hill in Ambohara, is the seat of the joint body of the federation's Protestant and Catholic churches. The Council has great influence over education, marriage and welfare; the churches run three in ten of the country's schools and most of its orphanages, and the Federal Assembly consults the Council before debating such bills. The chapel on the ground floor holds a service of prayer for the nation every noon."}
    in: div_qnzksj
    offset_km: [0.40, 0.00]
    site: {"layout": "lshape", "size_m": [200, 160]}
  - id: bld_xvcvyy
    subtype: university
    status: generated
    names: {"zh": "安博哈拉大学", "en": "University of Ambohara"}
    notes: {"zh": "安博哈拉大学是安博哈拉规模最大的高等学府，设有文、理、医、法、工、农等学院，在校学生一万多人。校园建在城市边缘的缓坡上，教学楼之间是大片的草坪和芒果树。大学的医学院为全国培养了大部分医生，农学院的稻作和热带作物研究在全岛都有名气。每年毕业典礼时，毕业生穿着传统的披肩在校园里游行。", "en": "The University of Ambohara is Ambohara's largest institution of higher education, with faculties of arts, sciences, medicine, law, engineering and agriculture and more than 10,000 students. Its campus lies on gentle slopes at the edge of the city, with broad lawns and mango trees between the buildings. Its medical school has trained most of the country's doctors, and its agricultural school is known across the island for research on rice and tropical crops. At each graduation the graduates parade round the campus in traditional shawls."}
    in: div_qnzksj
    offset_km: [0.40, 0.80]
    site: {"layout": "campus", "size_m": [900, 600]}
  - id: bld_704f91
    subtype: hospital
    status: generated
    names: {"zh": "安博哈拉总医院", "en": "Ambohara General Hospital"}
    notes: {"zh": "安博哈拉总医院是安博哈拉最大的综合医院，设有一千多张病床，急诊、外科、产科和传染病科是主要科室。医院也是大学医学院的教学医院，各地的疑难病人都转诊到这里。战争年代，医院曾收治大量伤员，至今设有专门的创伤和康复中心。门诊大楼前每天清晨排起长队，许多病人从外地坐一整夜的车赶来。", "en": "Ambohara General Hospital is Ambohara's largest general hospital, with over a thousand beds; emergency medicine, surgery, obstetrics and infectious diseases are its main departments. It is also the teaching hospital of the university's medical school, and difficult cases from across the country are referred here. In the war years it treated great numbers of wounded, and it still has a dedicated trauma and rehabilitation centre. Every morning long queues form outside the outpatient building, many patients having travelled all night to get here."}
    in: div_qnzksj
    offset_km: [-0.40, -0.50]
    site: {"layout": "complex", "size_m": [320, 240]}
  - id: bld_fsbezm
    subtype: museum
    status: generated
    names: {"zh": "安博哈拉国家博物馆", "en": "National Museum of Ambohara"}
    notes: {"zh": "安博哈拉国家博物馆位于安博哈拉市中心，收藏从早期定居者的独木舟、石器，到各王国时代的铜器、织物和手抄本，再到拉诺瓦联合共和国时期的档案与照片。展厅按时间顺序排列，最后几间讲述大分裂以来安博哈拉的历史。馆藏中最受欢迎的是一艘长二十多米的古代远洋独木舟。博物馆每月第一个星期日免费开放，学校常组织学生来参观。", "en": "The National Museum of Ambohara, in the centre of Ambohara, collects everything from the dugout canoes and stone tools of the first settlers to the bronzes, textiles and manuscripts of the old kingdoms and the archives and photographs of the United Republic of Ranova. Its galleries run in order of time, and the last few tell Ambohara's story since the Sundering. The favourite exhibit is an ancient ocean-going canoe more than 20 m long. Admission is free on the first Sunday of each month, and schools often bring their pupils."}
    in: div_qnzksj
    offset_km: [0.40, -0.40]
    site: {"layout": "hall", "size_m": [240, 160]}
  - id: bld_qd8e34
    subtype: library
    status: generated
    names: {"zh": "安博哈拉国家图书馆", "en": "National Library of Ambohara"}
    notes: {"zh": "安博哈拉国家图书馆是安博哈拉最大的图书馆和法定的出版物收藏机构，本国出版的每一本书、每一份报纸都要在这里存放两份。馆内还保存着联合共和国时期的地方档案和大量用拉诺瓦语、卡西里语写成的手稿。阅览室是一座方形大厅，每天开放到晚上九点，考试季节常常座无虚席。图书馆近年来开始把旧报纸和手稿数字化。", "en": "The National Library of Ambohara is the country's largest library and its legal deposit library: two copies of every book and newspaper published in Ambohara must be lodged here. It also holds local archives from the United Republic and many manuscripts in Ranovan and Kasiri. The reading room is a square hall open until nine every evening and full to the last seat in exam season. In recent years the library has begun digitising its old newspapers and manuscripts."}
    in: div_qnzksj
    offset_km: [-0.50, 0.40]
    site: {"layout": "block", "size_m": [180, 180]}
  - id: bld_0a827j
    subtype: marketplace
    status: generated
    names: {"zh": "安博哈拉中央市场", "en": "Ambohara Central Market"}
    notes: {"zh": "安博哈拉中央市场是城里最大的集市，一座有着高大铁皮屋顶的大棚，几百个摊位出售稻米、木薯、热带水果、香料、鱼干、布匹和日用杂货。市场清晨五点开张，最热闹的是星期六上午，周边乡村的农民挑着担子进城赶集。市场边上的小吃摊供应米粥、炸香蕉和烤瘤牛肉串。", "en": "Ambohara Central Market is the city's largest market, a great hall under a high tin roof where several hundred stalls sell rice, cassava, tropical fruit, spices, dried fish, cloth and household goods. It opens at five in the morning and is busiest on Saturday mornings, when farmers from the surrounding villages carry their produce into town. Food stalls round its edge serve rice porridge, fried bananas and grilled zebu skewers."}
    in: div_qnzksj
    offset_km: [-0.80, 0.00]
    site: {"layout": "market", "size_m": [260, 180]}
  - id: bld_0nb83h
    subtype: stadium
    status: generated
    names: {"zh": "安博哈拉体育场", "en": "Ambohara Stadium"}
    notes: {"zh": "安博哈拉体育场是安博哈拉最大的体育场，可容纳三万多名观众，国家足球队的主场比赛和全国运动会都在这里举行。体育场也是举行国庆庆典和大型集会的场所。看台下设有田径训练馆和运动员宿舍，每天清晨都有市民在外围的跑道上锻炼。", "en": "Ambohara Stadium is Ambohara's largest stadium, holding more than 30,000 spectators; the national football team's home games and the national games are held here. It is also used for National Day celebrations and large rallies. Beneath the stands are an athletics training hall and athletes' dormitories, and every morning people exercise on the track round the outside."}
