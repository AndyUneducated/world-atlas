  # ── 萨马伊 / Samay ──
  - id: bld_dd9yhz
    subtype: government
    status: generated
    names: {"zh": "萨马伊总统府", "en": "Presidential House of Samay"}
    notes: {"zh": "萨马伊总统府位于萨马伊旧城的山坡上，是总统努里·拉菲诺的官邸。自由邦实行议会制，总统由议会选出，是象征国家团结的元首，日常政务由总理和内阁负责。总统府是一座两层的白色宅邸，围绕着一个种有菩提树、橄榄树和棕榈树的庭院，三种树分别代表岛上的三大宗教传统。每逢基督教、伊斯兰教和佛教的重要节日，总统都在这里举行招待会，邀请各宗教领袖同席。总统府的花园每周日对公众开放。", "en": "The Presidential House of Samay stands on the hillside of Samay's old town and is the residence of President Nury Rafino. The Free State is a parliamentary republic; the president is elected by Parliament as a symbol of national unity, while the prime minister and the cabinet run the government. The house is a two-storey white mansion round a courtyard planted with a bodhi tree, an olive tree and a palm, standing for the island's three great religious traditions. On the major Christian, Muslim and Buddhist festivals the president holds a reception here, inviting the leaders of every faith. The gardens are open to the public on Sundays."}
    emblem_of: div_gebca7
    in: div_56wn6n
    offset_km: [0.00, 0.00]
    site: {"layout": "courtyard", "size_m": [200, 180]}
  - id: bld_vje94a
    subtype: government
    status: generated
    names: {"zh": "自由邦议会大厦", "en": "Parliament of the Free State"}
    notes: {"zh": "自由邦议会大厦位于萨马伊旧城中心的宗教街尽头，是议会八十一名议员开会的地方。议员按比例代表制选出，自由民主党、社会民主党和信仰社区联盟是三大政党，政府通常由其中两党联合组成。大厦的圆顶下是一间圆形议事厅，没有任何宗教标志，宪法规定国家对所有信仰保持中立。议会的会议用拉诺瓦语和卡西里语进行，并配有同声传译。大厦的一层是向公众开放的宪法展厅。", "en": "The Parliament of the Free State stands at the end of Religion Street in the centre of Samay's old town and is where its 81 members sit. They are elected by proportional representation; the Liberal Democrats, the Social Democrats and the Alliance of Faith Communities are the three main parties, and governments are usually formed by two of them together. Under the dome is a round chamber with no religious symbol of any kind, since the constitution requires the state to be neutral among all faiths. Debates are held in Ranovan and Kasiri with simultaneous interpretation. The ground floor houses a constitution exhibition open to the public."}
    in: div_56wn6n
    offset_km: [-0.30, -0.20]
