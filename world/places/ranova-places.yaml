  - id: poi_c24c46
    subtype: training_centre
    status: generated
    names: {"zh": "排雷中心", "en": "Mine Action Centre"}
    notes: {"zh": "排雷中心负责清除安巴罗围城期间遗留在岛上的地雷和未爆弹药，训练本地的排雷员，也为周边国家的排雷人员提供培训。中心的场地上有模拟雷区和爆破坑，展厅里陈列着从岛上清除的各种地雷。经过多年的工作，岛上的大部分雷区已被清除。", "en": "The Mine Action Centre clears the mines and unexploded ordnance left on the island from the siege of Ambaro, trains local deminers and also trains teams from neighbouring countries. Its grounds have a mock minefield and demolition pits, and its exhibition hall displays the many kinds of mine cleared from the island. After years of work most of the island's minefields have been cleared."}
