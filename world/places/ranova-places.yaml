    notes: {"zh": "班达里鱼类罐头厂是萨希利亚最大的水产加工厂，主要生产金枪鱼罐头和冷冻鱼片，产品出口到岛上各国和海外。工厂雇有一千多名工人，大多是附近渔村的妇女。每当捕鱼旺季，工厂三班倒连续生产，厂区周围弥漫着鱼和盐的味道。", "en": "Bandari Fish Cannery is Sahiliya's largest seafood processing plant, mainly producing canned tuna and frozen fillets for export to the island and abroad. It employs over a thousand workers, most of them women from the nearby fishing villages. In the fishing season it runs three shifts round the clock, and the smell of fish and salt hangs over the area."}
