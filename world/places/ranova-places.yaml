    status: generated
    names: {"zh": "伊特拉蓝宝石矿", "en": "Itra Sapphire Mine"}
    notes: {"zh": "伊特拉蓝宝石矿位于南部山谷的冲积层中，大公司的露天矿坑与成百上千个手工淘宝人的小坑并存。淘宝人在河边用竹筐淘洗砂砾，运气好的一天就能改变一家人的生活。矿镇里开满了宝石交易所，外国买家坐在窗口后用放大镜验货。", "en": "Itra Sapphire Mine lies in the alluvial gravels of a southern valley, where a company's open pit sits beside hundreds of small diggings worked by hand. Diggers wash gravel in bamboo baskets by the river, and a single lucky day can change a family's life. The mining town is full of gem dealers, foreign buyers checking stones with a loupe behind their windows."}
