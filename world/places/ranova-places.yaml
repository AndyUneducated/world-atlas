    status: generated
    names: {"zh": "法里海藻养殖合作社", "en": "Fary Seaweed Co-operative"}
    notes: {"zh": "法里海藻养殖合作社在浅海的沙地上用木桩和绳子种植海藻，每六周收获一次，晒干后出口用于提取卡拉胶。合作社由附近渔村的妇女组成，收入按劳动分配。退潮时，海边一片片整齐的海藻田像是水下的稻田。", "en": "Fary Seaweed Co-operative farms seaweed on stakes and lines over the sandy shallows, harvesting every six weeks; dried, it is exported for carrageenan. The co-operative is made up of women from nearby fishing villages and shares its income by work done. At low tide the neat plots look like paddy fields under the sea."}
