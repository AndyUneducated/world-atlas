    notes: {"zh": "港口防卫队营区是港口防卫队第一步兵旅的驻地，位于城郊，几十座营房围着一个大操场排开，旁边是车场、油库和弹药库。旅部负责马哈维洛周边的防务，部队定期到野外训练场演练。每年新兵入伍时，家属们在营门外送别，场面十分热闹。营区不对外开放，营门外的小店做的都是士兵的生意。", "en": "Port Defence Force Barracks, on the edge of town, is the base of the 1st Infantry Brigade of the Port Defence Force: dozens of barrack blocks round a large parade ground, with vehicle yards, a fuel depot and magazines beside them. The brigade defends the Mahavelo area and exercises regularly on the field ranges. When new recruits join each year their families see them off at the gate in lively crowds. The base is closed to the public, and the little shops outside its gate live off the soldiers' custom."}
