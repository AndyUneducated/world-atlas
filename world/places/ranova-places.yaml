    status: generated
    names: {"zh": "马尔萨快艇码头", "en": "Marsa Speedboat Jetty"}
    notes: {"zh": "马尔萨快艇码头是马尔萨小港的一段码头，渔船和武装组织的快艇共用。快艇在夜里出海，走私燃料、香烟和武器，也曾袭击过往的商船。周边国家的海军常在附近海域巡逻拦截。码头边的渔民说，他们宁愿离快艇远一点。", "en": "The Marsa Speedboat Jetty is a stretch of quay in the little port of Marsa shared by fishing boats and the armed group's speedboats. The boats go out at night to smuggle fuel, cigarettes and weapons, and have attacked passing merchant ships. Neighbouring navies often patrol nearby to intercept them. The fishers on the quay say they would rather keep their distance from the speedboats."}
