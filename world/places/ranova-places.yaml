    names: {"zh": "东山导弹坑道", "en": "East Hill Missile Tunnels"}
    notes: {"zh": "东山导弹坑道开凿在安德里安巴东面的海岸山体里，据外国情报机构推测，坑道内存放着马索沃利的短程弹道导弹。山脚下可以看到几个加固的坑道口和一条通往海边的公路，导弹发射车可以从坑道里开出，在附近的预设阵地发射。马索沃利官方从未承认拥有这类导弹。", "en": "The East Hill Missile Tunnels are cut into the coastal hills east of Andriamba, and foreign intelligence services believe they hold Masovoly's short-range ballistic missiles. At the foot of the hill a few hardened tunnel mouths and a road to the shore can be seen; launchers could drive out and fire from prepared sites nearby. Masovoly has never officially admitted having such missiles."}
