    notes: {"zh": "宪法法院位于萨马伊大学旁边，是自由邦保护宗教自由和公民权利的最高机关。七名法官分别由议会、总统和法官协会提名，任期十二年，不得连任。法院以一系列保护少数信仰的判决闻名，例如裁定公立学校必须为各宗教的学生提供节日假期、禁止以宗教为由拒绝雇用。法院大楼是一座低矮的石砌回字形建筑，庭院里刻着宪法第一条：「每个人都有信仰或不信仰的自由」。", "en": "The Constitutional Court, next to the University of Samay, is the Free State's highest guardian of religious freedom and civil rights. Its seven judges are nominated by Parliament, the president and the judges' association for a single twelve-year term. The court is known for a series of rulings protecting minority faiths, for instance that state schools must give pupils of every religion their festival holidays and that no one may be refused a job on religious grounds. The building is a low stone quadrangle whose courtyard is carved with the first article of the constitution: 'Everyone is free to believe or not to believe'."}
