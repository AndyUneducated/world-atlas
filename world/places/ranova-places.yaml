    notes: {"zh": "米拉卡皇家海军基地是皇家海军在米拉卡的基地，两道防波堤围成的港池里停泊着皇家海军的舰艇。码头后面是修船厂、油库和水兵营房。舰艇从这里出发，在米拉卡的领海和航道上巡逻，护送商船通过危险海域。每年海军节，基地对公众开放一天，市民可以登舰参观。", "en": "Miraka Royal Navy Base is the Royal Navy's base at Miraka, its basin between two breakwaters crowded with the fleet's ships. Behind the quays are the repair yard, fuel depot and sailors' barracks. Ships sail from here to patrol Miraka's territorial waters and sea lanes and escort merchant ships through dangerous waters. On Navy Day each year the base opens to the public and visitors can go aboard."}
