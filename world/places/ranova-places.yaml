    notes: {"zh": "米拉卡西难民接待中心位于首都以西的海岸边，收容了约三万五千名从海上漂来的难民，他们大多乘坐超载的小船逃离本岛的战乱地区。中心由王国移民局和教会慈善组织共同管理，新到的难民先在这里登记、体检和接受庇护审查，获得庇护的人可以到王国各地工作和定居。教会的志愿者在中心开办语言班和儿童学校。每年都有难民船在附近海域遇难，海边的小教堂里点着纪念他们的蜡烛。", "en": "The Miraka West Refugee Reception Centre lies on the coast west of the capital and shelters about 35,000 people who came by sea, most fleeing the main island's war zones in overloaded small boats. It is run jointly by the kingdom's immigration service and church charities: new arrivals are registered, examined and screened for asylum here, and those granted it may work and settle anywhere in the kingdom. Church volunteers run language classes and a children's school. Every year refugee boats are lost in the nearby waters, and candles burn for them in the little chapel by the shore."}
