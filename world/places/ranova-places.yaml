  # ── 坦德罗圣山 / Mount Tendro ──
  - id: bld_m480sq
    subtype: monastery
    status: generated
    names: {"zh": "首席修道院长府", "en": "Residence of the Protos"}
    notes: {"zh": "首席修道院长府位于坦德罗镇上方的圣山入口，是首席修道院长提莫特奥的居所，也是修道院共和国的行政中心。首席修道院长由神圣议会从二十座修道院的院长中选出，任期五年，代表圣山处理对外事务。院府是一座石砌的回字形修道院建筑，中央有一座带拜占庭式圆顶的小教堂，院内的钟楼每天敲响七次，召唤修士们祈祷。院府不接待女性访客，男性朝圣者须持通行证才能入内。", "en": "The Residence of the Protos stands at the entrance to the Holy Mountain above Tendro town and is the home of the Protos, Abbot Timoteo, and the administrative centre of the monastic republic. The Protos is chosen by the Holy Synod from among the abbots of the twenty monasteries for five years and represents the Mountain in its dealings with the outside world. The residence is a stone monastic quadrangle with a small domed church in the middle, and its bell tower rings seven times a day to call the monks to prayer. Women visitors are not received, and male pilgrims need a pass to enter."}
