    names: {"zh": "安卡瓦咖啡庄园", "en": "Ankava Coffee Estate"}
    notes: {"zh": "安卡瓦咖啡庄园位于火山灰土的山坡上，阿拉比卡咖啡树种在高大的遮阴树下。每年雨季结束后，采摘工人手工采下成熟的红色咖啡果，在庄园的晒场上晒干、脱壳。庄园的咖啡因带有果香而在海外颇受欢迎，庄园的老宅也改成了接待游客的咖啡馆。", "en": "Ankava Coffee Estate lies on slopes of volcanic soil, its arabica trees planted under tall shade trees. After each rainy season pickers hand-pick the ripe red cherries, which are dried and hulled on the estate's drying floors. Its fruity coffee is well liked abroad, and the old estate house has become a café for visitors."}
