    notes: {"zh": "瓦罗纳中央银行负责发行货币、管理外汇储备和监管商业银行。银行大楼是一座十几层的方形塔楼，地下有存放黄金和外汇储备的金库。大分裂后，各国从联合共和国的中央银行分得了一部分黄金储备，瓦罗纳的那一份至今仍存放在这座楼里。银行一楼设有货币博物馆，展出联合共和国时期和独立以来发行的纸币与硬币。", "en": "The Central Bank of Varona issues the currency, manages the foreign-exchange reserves and supervises the commercial banks. Its building is a square tower of a dozen or so storeys with vaults below for the gold and currency reserves. After the Sundering each country received a share of the gold reserves of the United Republic's central bank, and Varona's share is still kept here. A currency museum on the ground floor shows the notes and coins of the United Republic and those issued since independence."}
