    notes: {"zh": "总参谋部大楼位于梅纳瓦利港区北面，是陆军、空军和国家宪兵的联合指挥机关，也是军政府真正处理国事的地方：财政、矿业和港口收入都由这里的「经济局」管理。大楼是一座六层的混凝土长楼，屋顶有雷达和通信天线，周围是兵营和车场。外界认为，金矿和港口的收入相当一部分经由这里流入军官们的账户。年轻人在大楼门口排队报名参军，因为当兵有饭吃。", "en": "The General Staff Building, north of Menavaly's port, is the joint command of the army, the air force and the National Gendarmerie, and also where the junta really runs the state: finance, mining and port revenue are all managed by its 'Economic Bureau'. It is a six-storey concrete slab with radar and aerials on the roof, surrounded by barracks and vehicle yards. Outsiders believe that much of the income from the gold mines and the port passes through here into officers' accounts. Young men queue at its gate to join up, because soldiers get fed."}
