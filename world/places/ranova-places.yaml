  # ── 齐马罗沃 / Tsimarovo ──
  - id: bld_xpzbw3
    subtype: government
    status: generated
    names: {"zh": "领袖府", "en": "Leader's Residence"}
    notes: {"zh": "领袖府位于齐马罗沃中轴大道的北端，是民族领袖拉哈特拉·拉孔多的官邸和办公地。这是一座新古典风格的回字形建筑，正面有十六根方柱，柱廊前是宽阔的阅兵台阶，每年的建国阅兵从这里开始。府内的接见厅长六十米，地面铺着本国出产的红色花岗岩，外国使节递交国书时须沿着长厅走到尽头。领袖府由民族卫队守卫，大道两侧的建筑在阅兵日要清空。国际人权组织多次指出，许多涉及原住民迁徙和政治犯的命令都从这里签发。", "en": "The Leader's Residence, at the northern end of Tsimarovo's central axis, is the residence and office of the Leader of the Nation, Lahatra Rakondo. It is a neoclassical quadrangle with sixteen square columns across its front, and broad parade steps before the colonnade where the annual National Day parade begins. The audience hall inside is 60 m long and floored with the country's own red granite, and foreign envoys presenting their credentials must walk its whole length. The National Guard holds the residence, and on parade days the buildings along the avenue are cleared. International human rights groups have often pointed out that many of the orders on the removal of indigenous people and on political prisoners were signed here."}
    emblem_of: div_rbcxzz
    in: div_j0txx6
    offset_km: [0.00, 0.00]
    site: {"layout": "courtyard", "size_m": [280, 240]}
  - id: bld_mvwshh
    subtype: government
    status: generated
    names: {"zh": "国民大厅", "en": "Hall of the Nation"}
    notes: {"zh": "国民大厅位于中轴大道南端，与领袖府相对，是国民议会二百名代表开会的地方。代表中一百八十名由民族社会主义运动指定，二十名来自民族卫队，没有反对党。大厅是一座巨大的新古典式建筑，内部的会场可以容纳五千人，除议会会议外，也用作运动的党代会和大型集会场所。代表每年开会两次，议程由运动领导层事先拟定，表决全部一致通过。大厅前的广场上每年举行火炬游行，这一仪式被外国观察者批评为对旧时代极端主义的效仿。", "en": "The Hall of the Nation, at the southern end of the central axis facing the Leader's Residence, is where the 200 deputies of the National Assembly meet. 180 of them are named by the National Socialist Movement and 20 come from the National Guard; there is no opposition. The hall is a huge neoclassical building whose auditorium holds 5,000, used besides the Assembly for the Movement's congresses and large rallies. The deputies meet twice a year on an agenda drawn up beforehand by the Movement's leadership, and every vote is unanimous. A torchlight procession is held every year on the square in front, a ritual that foreign observers criticise as an imitation of the extremism of an earlier age."}
    in: div_j0txx6
    offset_km: [-0.40, -0.20]
    site: {"layout": "hall", "size_m": [300, 180]}
  - id: bld_mcbk5m
    subtype: government
    status: generated
    names: {"zh": "民族社会主义运动总部", "en": "National Socialist Movement Headquarters"}
    notes: {"zh": "民族社会主义运动总部位于中轴大道中段，是全国唯一合法政党的领导机关。运动的中央执行委员会在这里开会，决定议会代表的名单、各级官员的任命和全国的宣传方针；民族卫队的政治部也设在楼内。大楼是一座九层的石材长楼，外墙上挂着运动的红黑色旗帜和巨幅领袖画像。运动的青年组织和妇女组织在楼后的附属建筑里办公，每年夏天从这里组织青年到边境的「定居者村」参加劳动营。", "en": "The National Socialist Movement Headquarters, halfway along the central axis, is the leadership seat of the country's only legal party. The Movement's Central Executive meets here to decide the lists of deputies, the appointment of officials at every level and the line of national propaganda, and the National Guard's political department is in the building too. It is a nine-storey stone slab hung with the Movement's red and black banners and a giant portrait of the leader. The Movement's youth and women's organisations work from the annexe behind it, and every summer they send young people from here to labour camps in the 'settler villages' near the border."}
    in: div_j0txx6
    offset_km: [-0.10, 0.40]
    site: {"layout": "slab", "size_m": [240, 140]}
  - id: poi_3dwd2n
    subtype: plaza
    status: generated
    names: {"zh": "中轴大道阅兵场", "en": "Central Axis Parade Ground"}
    notes: {"zh": "中轴大道阅兵场是齐马罗沃城中心一条宽一百米的大道和两侧的检阅台，北接领袖府，南抵国民大厅。每年建国日，民族卫队和国防军的方阵、坦克和导弹车从这里经过，民族领袖在检阅台上观礼。平日里大道上车辆很少，宽阔的路面显得空旷，两侧的路灯柱上挂着运动的旗帜。", "en": "The Central Axis Parade Ground is a 100 m wide avenue through the centre of Tsimarovo with reviewing stands along its sides, running from the Leader's Residence in the north to the Hall of the Nation in the south. Every National Day the columns of the National Guard and the Defence Force, tanks and missile carriers pass along it while the Leader of the Nation watches from the stand. On ordinary days there is little traffic, the broad road looks empty, and the Movement's banners hang from the lamp posts on both sides."}
    in: div_j0txx6
    offset_km: [0.40, -0.40]
    site: {"layout": "plaza", "size_m": [500, 260]}
  - id: poi_yjeze0
    subtype: detention_centre
    status: generated
    names: {"zh": "齐马罗沃第一国家监狱", "en": "Tsimarovo State Prison No. 1"}
    notes: {"zh": "齐马罗沃第一国家监狱位于齐马罗沃城外，高墙和双层铁丝网围着几排牢房，四角设有岗楼。这里关押着政治犯和被当局认定为「危险分子」的人，许多人未经审判就被关押多年。国际人权组织多次要求探视，但很少获准；获释者描述了拥挤的牢房、强迫劳动和与家人断绝联系的经历。", "en": "Tsimarovo State Prison No. 1 lies outside Tsimarovo, rows of cell blocks behind high walls and double wire fences with watchtowers at the corners. It holds political prisoners and people the authorities call 'dangerous elements', many held for years without trial. International human rights groups have repeatedly asked to visit and have seldom been allowed; former prisoners describe crowded cells, forced labour and being cut off from their families."}
    in: div_j0txx6
    offset_km: [3.00, 0.00]
    site: {"layout": "detention", "size_m": [700, 500], "angle_deg": 90, "rural": true}
  - id: poi_gjjw4m
    subtype: mine
    status: generated
    names: {"zh": "福罗纳铁矿", "en": "Forona Iron Mine"}
    notes: {"zh": "福罗纳铁矿位于山脚下，开采的铁矿石经传送带直接送进旁边的炼钢厂。矿区的露天矿坑一级级向下延伸，几十辆大型矿车日夜不停地运输。铁矿和铝土矿是齐马罗沃重工业的基础。", "en": "Forona Iron Mine lies at the foot of the mountains, its ore going by conveyor straight into the steelworks next door. The open pit steps down bench by bench, and dozens of big haul trucks run day and night. Iron ore and bauxite are the foundation of Tsimarovo's heavy industry."}
    in: div_2xgnjq
    offset_km: [3.00, 0.00]
    site: {"layout": "mine", "size_m": [1600, 1100], "angle_deg": 90, "rural": true}
  - id: poi_xexd4c
    subtype: factory
    status: generated
    names: {"zh": "福罗纳钢铁联合企业", "en": "Forona Iron and Steel Combine"}
    notes: {"zh": "福罗纳钢铁联合企业是齐马罗沃最大的国营工厂，拥有高炉、转炉和轧钢车间，生产的钢材供应造船、机械和军工。工厂雇有上万名工人，厂区里有自己的学校、医院和俱乐部。高炉的火光在夜里照亮了半边天空。", "en": "Forona Iron and Steel Combine is Tsimarovo's largest state factory, with blast furnaces, converters and rolling mills; its steel goes to shipbuilding, machinery and the arms industry. It employs over ten thousand workers and has its own schools, hospital and club. At night the glow of the furnaces lights half the sky."}
    in: div_2xgnjq
    offset_km: [-2.77, 1.15]
    site: {"layout": "plant", "size_m": [1400, 900], "variant": "assembly", "angle_deg": 68, "rural": true}
  - id: bld_2g7jcw
    subtype: factory
    status: generated
    names: {"zh": "贝拉纳盐场", "en": "Belana Salt Works"}
    notes: {"zh": "贝拉纳盐场沿干燥的海岸展开，海水引入一格格浅浅的盐田，在烈日下蒸发结晶。每年旱季，盐工用木耙把白色的盐粒堆成小山，再装袋运往全岛。盐场是当地最大的雇主，许多家庭世代以晒盐为生。", "en": "Belana Salt Works spread along the dry coast, where seawater is let into shallow pans and left to crystallise under the hot sun. Each dry season the salt workers rake the white grains into heaps and bag them for sale across the island. The works are the biggest local employer, and many families have made salt for generations."}
    in: div_fv1vhe
    offset_km: [3.00, 0.00]
    site: {"layout": "complex", "size_m": [700, 500], "angle_deg": 90, "rural": true}
  - id: poi_s0v2e4
    subtype: orchard
    status: generated
    names: {"zh": "贝拉纳剑麻种植园", "en": "Belana Sisal Plantation"}
    notes: {"zh": "贝拉纳剑麻种植园沿南部干燥的海岸平原展开，一行行剑麻像灰绿色的利剑插在红土上。剑麻叶割下后在纤维厂里刮去叶肉、晒干，制成绳索和麻袋出口。种植园是国营企业，工人中有不少是从南方迁来的原住民，国际组织批评他们的工资和住房条件很差。", "en": "The Belana Sisal Plantation spreads over the dry southern coastal plain, rows of sisal standing like grey-green swords in the red earth. The leaves are cut, scraped and dried in the fibre mill and made into rope and sacking for export. It is a state enterprise, and many of its workers are indigenous people moved from the south, whose pay and housing international bodies have criticised as very poor."}
    in: div_fv1vhe
    offset_km: [-2.77, 1.15]
    site: {"layout": "orchard", "size_m": [1000, 700], "angle_deg": 68, "rural": true}
  - id: poi_wr16hh
    subtype: orchard
    status: generated
    names: {"zh": "安塔诺定居者农场", "en": "Antano Settler Farm"}
    notes: {"zh": "安塔诺定居者农场是南方战争后在原住民村庄被迁走的土地上建立的国营农场，土地分给了国家认可的「定居者」家庭，种植玉米、木薯和饲养瘤牛。农场的入口立着一块纪念「民族土地回归」的石碑。被迁走的原住民家庭大多流落到阿拉齐纳的难民营，国际法院正在审理相关的诉讼。", "en": "The Antano Settler Farm is a state farm set up after the Southern War on land whose indigenous villages had been removed; the land was given to 'settler' families approved by the state, who grow maize and cassava and raise zebu. At its entrance stands a stone celebrating 'the return of the nation's land'. Most of the removed families ended up in the refugee camps of Alatsina, and an international court is hearing a case over it."}
    in: div_vqr33a
    offset_km: [3.00, 0.00]
    site: {"layout": "orchard", "size_m": [1000, 700], "angle_deg": 90, "rural": true}
  - id: poi_qf1s85
    subtype: factory
    status: generated
    names: {"zh": "伊拉希军用卡车厂", "en": "Ilahy Military Lorry Works"}
    notes: {"zh": "伊拉希军用卡车厂位于港区，生产军用卡车、越野车和装甲运兵车的底盘，钢材来自福罗纳的钢铁联合企业。工厂是齐马罗沃战争工业的重要一环，也向卡波拉出售车辆，违反了国际武器禁运。工厂的工人实行军事化管理，每天上班前要在厂门口列队宣誓。", "en": "The Ilahy Military Lorry Works, in the port district, builds military lorries, off-road vehicles and armoured personnel carrier chassis from steel made at the Forona combine. It is a key part of Tsimarovo's war industry and also sells vehicles to Kabola in breach of an international arms embargo. Its workers are run on military lines and line up at the gate each morning to take an oath before their shift."}
    in: div_s0cxrv
    offset_km: [-1.15, 2.77]
    site: {"layout": "plant", "size_m": [1200, 800], "variant": "assembly", "angle_deg": 22, "rural": true}
  - id: bld_yjy426
    subtype: hospital
    status: generated
    names: {"zh": "齐马罗沃总医院", "en": "Tsimarovo General Hospital"}
    notes: {"zh": "齐马罗沃总医院是齐马罗沃最大的综合医院，设有一千多张病床，急诊、外科、产科和传染病科是主要科室。医院也是大学医学院的教学医院，各地的疑难病人都转诊到这里。战争年代，医院曾收治大量伤员，至今设有专门的创伤和康复中心。门诊大楼前每天清晨排起长队，许多病人从外地坐一整夜的车赶来。", "en": "Tsimarovo General Hospital is Tsimarovo's largest general hospital, with over a thousand beds; emergency medicine, surgery, obstetrics and infectious diseases are its main departments. It is also the teaching hospital of the university's medical school, and difficult cases from across the country are referred here. In the war years it treated great numbers of wounded, and it still has a dedicated trauma and rehabilitation centre. Every morning long queues form outside the outpatient building, many patients having travelled all night to get here."}
    in: div_j0txx6
    offset_km: [0.40, 0.30]
    site: {"layout": "complex", "size_m": [320, 240]}
  - id: bld_s2yf5x
    subtype: university
    status: generated
    names: {"zh": "齐马罗沃大学", "en": "University of Tsimarovo"}
    notes: {"zh": "齐马罗沃大学是齐马罗沃规模最大的高等学府，设有文、理、医、法、工、农等学院，在校学生一万多人。校园建在城市边缘的缓坡上，教学楼之间是大片的草坪和芒果树。大学的医学院为全国培养了大部分医生，农学院的稻作和热带作物研究在全岛都有名气。每年毕业典礼时，毕业生穿着传统的披肩在校园里游行。", "en": "The University of Tsimarovo is Tsimarovo's largest institution of higher education, with faculties of arts, sciences, medicine, law, engineering and agriculture and more than 10,000 students. Its campus lies on gentle slopes at the edge of the city, with broad lawns and mango trees between the buildings. Its medical school has trained most of the country's doctors, and its agricultural school is known across the island for research on rice and tropical crops. At each graduation the graduates parade round the campus in traditional shawls."}
