  # ── 贾巴利亚 / Jabaliya ──
  - id: bld_hqymfw
    subtype: government
    status: generated
    names: {"zh": "舒拉议事厅（旧堡垒）", "en": "Shura Hall (Old Fort)"}
    notes: {"zh": "舒拉议事厅设在贾巴勒山谷入口的一座旧堡垒里，是武装组织自封「酋长国」的议事机关。堡垒用黑色玄武岩砌成，据说建于各王国时代，四角有圆形碉楼。舒拉会议由四十名武装组织指挥官和宗教人员组成，在这里颁布禁令、分配过路费收入、裁决地方纠纷。贾巴利亚未获任何国家承认，该武装组织被多国和国际组织列为恐怖组织，周边国家多次对其据点发动空袭。堡垒周围的村民说，议事厅开会时山谷里的道路会被全部封锁。", "en": "The Shura Hall occupies an old fort at the mouth of the Jabal valley and is the council of the armed group's self-proclaimed 'emirate'. The fort is built of black basalt, said to date from the age of the old kingdoms, with a round bastion at each corner. The Shura of forty commanders and clerics meets here to issue bans, share out the toll revenue and settle local disputes. Jabaliya is recognised by no state, the armed group is listed as a terrorist organisation by many countries and international bodies, and its neighbours have often carried out air strikes on its positions. Villagers nearby say that every road in the valley is closed when the Shura sits."}
    emblem_of: div_5b4193
    in: div_2e6j0g
    offset_km: [0.00, 0.00]
    site: {"layout": "courtyard", "size_m": [200, 180]}
  - id: bld_qtj3x1
    subtype: government
    status: generated
    names: {"zh": "「埃米尔」驻地", "en": "The 'Emir's' Compound"}
    notes: {"zh": "自封「埃米尔」阿布·萨利姆（化名）名义上的驻地，是贾巴勒城北一座带高墙的院落。由于担心空袭，这位首领很少在同一个地方过夜，院落更多时候只是接见部族长老和发布命令的场所。院墙上开着射击孔，屋顶覆盖着防止空中侦察的伪装网。周边国家的情报部门认为，真正的指挥所分散在丘陵的山洞和农舍中。院落附近的街道禁止拍照。", "en": "The nominal compound of the self-proclaimed 'Emir', Abu Salim (an alias), is a walled courtyard house in the north of Jabal. For fear of air strikes the leader seldom sleeps in the same place twice, and the compound serves mostly to receive tribal elders and issue orders. Its walls are pierced with firing slits and its roof covered with camouflage netting against aerial reconnaissance. Neighbouring intelligence services believe the real command posts are scattered among caves and farmhouses in the hills. Photography is forbidden in the surrounding streets."}
    in: div_2e6j0g
    offset_km: [-0.30, -0.10]
    site: {"layout": "block", "size_m": [140, 140]}
  - id: bld_afjbva
    subtype: court
    status: generated
    names: {"zh": "贾巴勒「教法法庭」", "en": "Jabal 'Sharia Court'"}
    notes: {"zh": "武装组织在贾巴勒旧集市旁设立的「教法法庭」，按照组织对教法的极端解释审理盗窃、通奸、「叛教」和违反禁令的案件。法庭没有辩护制度，判决由组织任命的法官当场作出，常常包括鞭刑和处决。萨希利亚的宗教学者委员会和全岛的伊斯兰学者多次公开谴责这些判决违背伊斯兰教法。国际人权组织根据逃出的居民证词，记录了大量在这里作出的任意判决。", "en": "The 'Sharia Court' set up by the armed group beside Jabal's old market tries theft, adultery, 'apostasy' and breaches of its bans according to the group's extreme reading of Islamic law. There is no defence; judgments are given on the spot by judges the group appoints and often include flogging and execution. Sahiliya's Council of Religious Scholars and Islamic scholars across the island have repeatedly condemned these sentences as contrary to Islamic law. International human rights groups, drawing on testimony from residents who escaped, have documented many arbitrary sentences handed down here."}
    in: div_2e6j0g
    offset_km: [-0.10, -0.30]
    site: {"layout": "courtyard", "size_m": [140, 120]}
