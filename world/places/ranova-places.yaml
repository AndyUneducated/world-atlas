    names: {"zh": "东岭营地", "en": "East Ridge Camp"}
    notes: {"zh": "东岭营地是人民解放军（游击队）在伊索卡郊外的营地之一，几排简易营房、一片操场和一个用沙袋围起的射击区散布在树林边缘。营地的位置时常变化，周边国家的军队和情报部门多次对这一带进行侦察和打击。国际组织的报告指出，这类营地曾被用来训练未成年人，并接收从岛外招募来的人员。", "en": "East Ridge Camp is one of the People's Liberation Army (guerrillas)'s camps outside Isoka: a few rows of rough barracks, a drill ground and a sandbagged firing area scattered along the edge of the woods. Its position often changes, and neighbouring armies and intelligence services have repeatedly reconnoitred and struck the area. Reports by international bodies say such camps have been used to train minors and to receive recruits brought from off the island."}
