  # ── 卡波拉 / Kabola ──
  - id: bld_mp7psq
    subtype: government
    status: generated
    names: {"zh": "运动总部（旧港务局大楼）", "en": "Movement Headquarters (Old Harbour Board Building)"}
    notes: {"zh": "新秩序运动总部设在卡波拉老港区的旧港务局大楼里，是自封领地的权力中心。大楼建于联合共和国时期，是一座四层的方形石楼，屋顶的旧信号塔被改成了瞭望哨，入口两侧堆着沙袋。运动首领维基托拉·拉贝在三楼办公，楼下是宣传部和网络组，运动在这里制作视频、经营网站，向海外招募志愿者。大楼周围五百米内由武装巡逻队把守，外国记者很少获准入内。卡波拉未获任何国家承认，运动被多国列为极端组织。", "en": "The headquarters of the New Order Movement occupy the old Harbour Board building in Kabola's old port and are the centre of power of the self-proclaimed territory. Built in the time of the United Republic, it is a four-storey square stone block whose old signal tower has become a lookout post, with sandbags piled beside the entrance. The Head of the Movement, Vikitora Rabe, has his office on the third floor; below are the propaganda department and the online unit, which make videos, run websites and recruit volunteers abroad. Armed patrols hold everything within 500 m, and foreign journalists are rarely let in. Kabola is recognised by no state, and several countries list the Movement as an extremist organisation."}
    emblem_of: div_hm0zqz
    in: div_axvb2e
    offset_km: [0.00, 0.00]
    site: {"layout": "block", "size_m": [160, 160]}
  - id: bld_sa15kh
    subtype: government
    status: generated
    names: {"zh": "先锋议会会堂", "en": "Vanguard Assembly Hall"}
    notes: {"zh": "先锋议会会堂原是港区的海员俱乐部，如今是运动「先锋议会」开会的地方。先锋议会由运动的骨干成员组成，名义上负责通过领地的法令，实际上只批准首领和武装支队的决定。会堂的大厅里挂着运动自创的黑底灰色齿轮旗，墙上贴满了口号。会议没有固定时间，有时一年只开一次。外国研究者指出，这类「议会」主要是为了在网络宣传中营造组织化的形象。", "en": "The Vanguard Assembly Hall was once the port's seafarers' club and is now where the Movement's 'Vanguard Assembly' meets. The Assembly is made up of the Movement's core members and in name passes the territory's decrees, but in practice it only approves the decisions of the Head and the armed detachments. Its hall is hung with the Movement's own flag, a grey cogwheel on black, and the walls are covered in slogans. It has no fixed sittings and sometimes meets only once a year. Foreign researchers point out that such 'assemblies' exist mainly to give an organised image in the Movement's online propaganda."}
    in: div_axvb2e
    offset_km: [-0.10, 0.30]
    site: {"layout": "hall", "size_m": [180, 120]}
  - id: bld_c5k6qn
    subtype: government
    status: generated
    names: {"zh": "领地行政处", "en": "Territory Administration Office"}
    notes: {"zh": "领地行政处设在旧港区的一座三层办公楼里，负责卡波拉的日常事务：供水、供电、垃圾清运、配给证和通行证的发放。由于没有任何国家承认卡波拉的证件，居民出境时仍须持有邻国或旧联合共和国时期的身份文件。行政处的职员大多是运动成立前就在这里工作的老公务员，他们说自己「只管水管和电线」。门前每天早上排着领取燃料券的长队。", "en": "The Territory Administration Office occupies a three-storey office block in the old port and runs Kabola's day-to-day affairs: water, power, refuse collection, and the issue of ration cards and passes. Because no state recognises Kabola's papers, residents leaving the territory still need identity documents from a neighbour or from the time of the United Republic. Most of the staff are old civil servants who worked here before the Movement came, and they say they 'only look after the pipes and the wires'. Every morning a long queue for fuel coupons forms at the door."}
    in: div_axvb2e
    offset_km: [0.30, 0.00]
    site: {"layout": "slab", "size_m": [160, 90]}
  - id: poi_2byk88
    subtype: militant_camp
    status: generated
    names: {"zh": "北兵营训练营地", "en": "North Barracks Training Camp"}
    notes: {"zh": "北兵营训练营地是先锋支队在卡波拉郊外的营地之一，几排简易营房、一片操场和一个用沙袋围起的射击区散布在树林边缘。营地的位置时常变化，周边国家的军队和情报部门多次对这一带进行侦察和打击。国际组织的报告指出，这类营地曾被用来训练未成年人，并接收从岛外招募来的人员。", "en": "North Barracks Training Camp is one of the Vanguard Detachments's camps outside Kabola: a few rows of rough barracks, a drill ground and a sandbagged firing area scattered along the edge of the woods. Its position often changes, and neighbouring armies and intelligence services have repeatedly reconnoitred and struck the area. Reports by international bodies say such camps have been used to train minors and to receive recruits brought from off the island."}
    in: div_axvb2e
    offset_km: [3.00, 0.00]
    site: {"layout": "camp", "size_m": [600, 450], "variant": "barracks", "angle_deg": 90, "rural": true}
