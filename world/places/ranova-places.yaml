  - id: poi_emedb6
    subtype: orchard
    status: generated
    names: {"zh": "雷尼肉桂园", "en": "Reny Cinnamon Garden"}
    notes: {"zh": "雷尼肉桂园由雷尼的几个母系氏族共同经营，肉桂树种在岛上的丘陵上，每到雨季，工人剥下树皮，卷成肉桂卷晒干。肉桂园的收入按氏族分配，由各氏族的女性家长管理。雷尼的肉桂以香气浓郁闻名，出口到岛上各国和海外。", "en": "The Reny Cinnamon Garden is run jointly by several of Reny's matrilineal clans, its trees growing on the island's hills; in each rainy season workers strip the bark and roll it into quills to dry. Its income is shared by clan and managed by the clans' female heads. Reny cinnamon is known for its strong scent and is exported across the island and abroad."}
