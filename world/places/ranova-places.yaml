    names: {"zh": "黎明塔", "en": "Tower of Dawn"}
    notes: {"zh": "黎明塔是马扎瓦城中心的一座白色高塔，先知、黎明之父拉马希居住在塔顶，也是千年国的权力核心。塔高七十多米，是全城最高的建筑，外墙在日出时被染成金色，十二个同心圆街区都以它为中心向外展开。按照教义，先知每天清晨在塔顶的露台上第一个迎接日出，随后全城信徒才开始晨祷。塔的下层是先知的接见厅和档案室，保存着先知历年的「启示录」。普通信徒一生只能进塔一次，在成年礼那天。", "en": "The Tower of Dawn is a white tower in the middle of Mazava where the Prophet and Father of Dawn, Ramahy, lives at the top; it is the centre of power of the Millennial Realm. Over 70 m high, the tallest building in the city, its walls turn gold at sunrise, and the city's twelve concentric quarters spread outward from it. According to the faith the Prophet is the first to greet the sunrise each morning from the terrace at the top, and only then does the city begin its morning prayer. The lower floors hold the Prophet's audience hall and the archive of his yearly 'revelations'. An ordinary believer may enter the tower only once in a lifetime, on the day of their coming of age."}
    emblem_of: div_nyhhhg
    in: div_0a6gt7
    offset_km: [0.00, 0.00]
    site: {"layout": "tower", "size_m": [160, 160]}
  - id: bld_y4t7rm
    subtype: government
    status: generated
    names: {"zh": "十二使徒会堂", "en": "Hall of the Twelve Apostles"}
    notes: {"zh": "十二使徒会堂位于黎明塔南侧，是十二使徒长老会开会的地方。长老会由先知任命的十二名长老组成，每人管理一个同心圆街区，在这里讨论教务、分配土地和劳动，并审理信徒的过失。会堂是一座低矮的圆形建筑，十二扇门各对着一个街区，长老们按街区顺序围坐。按照教规，会议的结论须呈先知批准才能生效。离开教团的前信徒称，长老会对信徒的婚姻、职业和通信都有严格的控制。", "en": "The Hall of the Twelve Apostles, south of the Tower of Dawn, is where the Council of Twelve Apostles meets. Its twelve elders are appointed by the Prophet, each in charge of one of the concentric quarters, and here they discuss church affairs, share out land and labour and judge the faults of believers. The hall is a low round building with twelve doors, each facing one quarter, and the elders sit round it in the order of their quarters. By the rules of the faith, its conclusions take effect only when the Prophet approves them. Former members who have left say the Council keeps strict control over believers' marriages, work and letters."}
    in: div_0a6gt7
    offset_km: [-0.30, -0.20]
    site: {"layout": "dome", "size_m": [180, 180]}
  - id: bld_w3acnn
    subtype: government
    status: generated
    names: {"zh": "圣城行政院", "en": "Holy City Administration"}
    notes: {"zh": "圣城行政院负责马扎瓦的日常管理：分配住房和口粮、组织集体农场的劳动、接待朝圣者和管理港口。行政院的职员都是信徒，按照教规不领工资，只领取配给。外国人进入马扎瓦须持行政院签发的朝圣证，只能在指定的街区停留。行政院的楼前每天早晨张贴当天的劳动安排和「黎明公报」。", "en": "The Holy City Administration runs Mazava from day to day: it allots housing and rations, organises work on the collective farms, receives pilgrims and manages the port. Its staff are all believers and by the rules of the faith draw no wages, only rations. Foreigners entering Mazava need a pilgrim's pass issued by the Administration and may stay only in designated quarters. Each morning the day's work assignments and the 'Dawn Bulletin' are posted outside the building."}
