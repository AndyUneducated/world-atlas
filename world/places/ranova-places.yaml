    notes: {"zh": "安德里安巴陆航直升机场驻有人民军的直升机部队，两排直升机停机坪旁是机库和塔台。直升机担负运兵、侦察、伤员后送和山区补给任务，雨季山路被冲毁时，偏远村庄的物资也靠这里的直升机运送。", "en": "Andriamba Army Aviation Heliport houses the People's Army's helicopters, two rows of pads beside hangars and a tower. The helicopters carry troops, scout, evacuate the wounded and supply the mountains, and when the rains wash out the roads they also fly supplies to remote villages."}
