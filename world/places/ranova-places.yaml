    notes: {"zh": "海港城购物中心是马哈维洛最大的购物中心，与渡轮码头相连，几百家商店免收消费税，吸引着岛上各国的购物者。周末，从邻国乘渡轮来购物的人挤满了商场。商场顶层的美食广场可以俯瞰港口和来往的渡轮。", "en": "Harbour City Mall is Mahavelo's largest, connected to the ferry pier, its hundreds of shops free of sales tax and drawing shoppers from every country on the island. At weekends it is packed with people who come by ferry from the neighbours to shop. The food court on its top floor looks out over the harbour and the ferries."}
