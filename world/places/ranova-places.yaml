    notes: {"zh": "菲拉纳「再教育农场」位于菲拉纳城外，高墙和双层铁丝网围着几排牢房，四角设有岗楼。这里关押着政治犯和被当局认定为「危险分子」的人，许多人未经审判就被关押多年。国际人权组织多次要求探视，但很少获准；获释者描述了拥挤的牢房、强迫劳动和与家人断绝联系的经历。", "en": "Firana 'Re-education Farm' lies outside Firana, rows of cell blocks behind high walls and double wire fences with watchtowers at the corners. It holds political prisoners and people the authorities call 'dangerous elements', many held for years without trial. International human rights groups have repeatedly asked to visit and have seldom been allowed; former prisoners describe crowded cells, forced labour and being cut off from their families."}
