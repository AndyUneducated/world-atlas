    site: {"layout": "market", "size_m": [220, 140]}
  - id: bld_m48t0h
    subtype: hospital
    status: generated
    names: {"zh": "阿拉齐纳总医院", "en": "Alatsina General Hospital"}
    notes: {"zh": "阿拉齐纳总医院是阿拉齐纳最大的综合医院，设有一千多张病床，急诊、外科、产科和传染病科是主要科室。医院也是大学医学院的教学医院，各地的疑难病人都转诊到这里。战争年代，医院曾收治大量伤员，至今设有专门的创伤和康复中心。门诊大楼前每天清晨排起长队，许多病人从外地坐一整夜的车赶来。", "en": "Alatsina General Hospital is Alatsina's largest general hospital, with over a thousand beds; emergency medicine, surgery, obstetrics and infectious diseases are its main departments. It is also the teaching hospital of the university's medical school, and difficult cases from across the country are referred here. In the war years it treated great numbers of wounded, and it still has a dedicated trauma and rehabilitation centre. Every morning long queues form outside the outpatient building, many patients having travelled all night to get here."}
    in: div_xa2b3m
    offset_km: [0.20, -0.40]
    site: {"layout": "complex", "size_m": [320, 240]}
  - id: bld_tjh443
    subtype: marketplace
    status: generated
    names: {"zh": "阿拉齐纳中央市场", "en": "Alatsina Central Market"}
    notes: {"zh": "阿拉齐纳中央市场是城里最大的集市，一座有着高大铁皮屋顶的大棚，几百个摊位出售稻米、木薯、热带水果、香料、鱼干、布匹和日用杂货。市场清晨五点开张，最热闹的是星期六上午，周边乡村的农民挑着担子进城赶集。市场边上的小吃摊供应米粥、炸香蕉和烤瘤牛肉串。", "en": "Alatsina Central Market is the city's largest market, a great hall under a high tin roof where several hundred stalls sell rice, cassava, tropical fruit, spices, dried fish, cloth and household goods. It opens at five in the morning and is busiest on Saturday mornings, when farmers from the surrounding villages carry their produce into town. Food stalls round its edge serve rice porridge, fried bananas and grilled zebu skewers."}
    in: div_xa2b3m
    offset_km: [0.00, 0.40]
    site: {"layout": "market", "size_m": [260, 180]}
  - id: bld_dgjqkn
