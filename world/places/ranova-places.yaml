  - id: bld_fwzxz9
    subtype: government
    status: generated
    names: {"zh": "神圣议会厅", "en": "Hall of the Holy Synod"}
    notes: {"zh": "神圣议会厅位于首席修道院长府旁，是神圣议会开会的地方。议会由二十座修道院各派一名代表组成，每月开会一次，决定圣山的规章、修道院之间的土地边界和朝圣者的名额。议会厅是一座长方形的石厅，墙上绘满了圣徒像，代表们按修道院建立的先后顺序就座。议会的决定以圣山古老的章程为依据，章程的手抄本保存在议会厅的圣柜里。", "en": "The Hall of the Holy Synod, beside the Residence of the Protos, is where the Holy Synod meets. Each of the twenty monasteries sends one representative; the Synod sits once a month to decide the Mountain's rules, the boundaries between monasteries and the number of pilgrims admitted. The hall is a long stone chamber painted all over with saints, and the representatives sit in the order in which their monasteries were founded. The Synod's decisions rest on the Mountain's ancient charter, whose manuscript is kept in the hall's tabernacle."}
    in: div_resgrm
    offset_km: [-0.30, -0.20]
    site: {"layout": "hall", "size_m": [180, 110]}
