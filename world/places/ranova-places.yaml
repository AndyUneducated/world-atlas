    status: generated
    names: {"zh": "法里盐场", "en": "Fary Salt Works"}
    notes: {"zh": "法里盐场沿干燥的海岸展开，海水引入一格格浅浅的盐田，在烈日下蒸发结晶。每年旱季，盐工用木耙把白色的盐粒堆成小山，再装袋运往全岛。盐场是当地最大的雇主，许多家庭世代以晒盐为生。", "en": "Fary Salt Works spread along the dry coast, where seawater is let into shallow pans and left to crystallise under the hot sun. Each dry season the salt workers rake the white grains into heaps and bag them for sale across the island. The works are the biggest local employer, and many families have made salt for generations."}
