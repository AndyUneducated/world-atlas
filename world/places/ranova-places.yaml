    status: generated
    names: {"zh": "阿拉齐纳第一中学", "en": "Alatsina First Secondary School"}
    notes: {"zh": "阿拉齐纳第一中学是阿拉齐纳历史最悠久的中学之一，有学生两千多人，许多政府官员、医生和教师都毕业于这里。学校是一座L形的三层教学楼，围着一个大操场，操场边种着几棵高大的凤凰木，每年开花时整个校园都染成红色。", "en": "Alatsina First Secondary School is one of the oldest secondary schools in Alatsina, with more than two thousand pupils; many officials, doctors and teachers are former pupils. It is an L-shaped three-storey building round a large playground lined with tall flame trees, which turn the whole school red when they flower each year."}
