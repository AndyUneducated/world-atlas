    names: {"zh": "伊纳拉独木舟船屋", "en": "Inara Canoe House"}
    notes: {"zh": "伊纳拉独木舟船屋是建造和停放远航独木舟的长棚，群岛邦的人至今用传统的双体独木舟在各岛之间航行。每年的航海节，各氏族的独木舟从这里出发，进行岛际竞赛。造船的木料取自氏族共有的森林，每砍一棵树都要再种两棵。", "en": "The Inara Canoe House is a long shed where ocean-going canoes are built and kept, for the islanders still sail between the islands in traditional double-hulled canoes. At the sailing festival each year the clans' canoes set out from here for the inter-island race. The timber comes from the clans' common forest, and for every tree felled two are planted."}
