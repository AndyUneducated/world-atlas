    notes: {"zh": "安巴罗围城纪念馆讲述安巴罗之围的经过：岛屿被封锁的几个月里，居民断水断粮，许多人死于饥渴和炮击。馆内陈列着围城期间居民的日记、自制的取水工具和遇难者的名单，最后一间展厅介绍托管地的成立和重建。各方代表来安巴罗谈判时，常被安排先参观纪念馆。", "en": "The Ambaro Siege Memorial tells the story of the siege of Ambaro, the months when the island was blockaded and its people went without water and food, many dying of hunger, thirst and shelling. It displays residents' diaries from the siege, home-made water-gathering tools and the names of the dead, and its last gallery covers the founding of the trust territory and the rebuilding. Delegates who come to Ambaro to negotiate are often taken to the memorial first."}
