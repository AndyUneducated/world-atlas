    notes: {"zh": "瓦罗纳国际金融中心是城里最高的摩天楼，高两百多米，入驻着几十家银行、保险公司和律师事务所。大楼的玻璃幕墙倒映着海湾，是城市天际线的标志。顶层的观景台对公众开放，天气好时可以望见远处的群岛。", "en": "Varona International Finance Centre is the city's tallest skyscraper, more than 200 m high, home to dozens of banks, insurers and law firms. Its glass curtain walls mirror the bay and define the city's skyline. The observation deck at the top is open to the public, and on clear days the distant islands can be seen."}
