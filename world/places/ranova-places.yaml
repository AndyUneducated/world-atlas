    notes: {"zh": "首相府位于王宫与议会之间的一条小街上，是一座四层的砖楼，首相和内阁在这里办公。首相由议会多数派领袖出任，内阁每周二在二楼的会议室开会。大楼门口没有围栏，只有两名警察站岗，市民可以在门前的台阶上递交请愿信。首相府地下室有一条通道连接议会大厦，据说是联合共和国时期为躲避空袭修建的。", "en": "The Prime Minister's Office is a four-storey brick building on a side street between the palace and Parliament, where the prime minister and the cabinet work. The prime minister is the leader of the parliamentary majority, and the cabinet meets every Tuesday in a conference room on the first floor. There is no fence at the door, only two police officers, and citizens may hand in petitions on the front steps. A passage in the basement leads to Parliament House, said to have been dug as an air-raid shelter under the United Republic."}
