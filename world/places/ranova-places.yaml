    notes: {"zh": "齐马罗沃体育场是齐马罗沃最大的体育场，可容纳三万多名观众，国家足球队的主场比赛和全国运动会都在这里举行。体育场也是举行国庆庆典和大型集会的场所。看台下设有田径训练馆和运动员宿舍，每天清晨都有市民在外围的跑道上锻炼。", "en": "Tsimarovo Stadium is Tsimarovo's largest stadium, holding more than 30,000 spectators; the national football team's home games and the national games are held here. It is also used for National Day celebrations and large rallies. Beneath the stands are an athletics training hall and athletes' dormitories, and every morning people exercise on the track round the outside."}
