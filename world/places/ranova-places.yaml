  - id: bld_yqt2zm
    subtype: government
    status: generated
    names: {"zh": "岛民议会大楼", "en": "Islanders' Assembly House"}
    notes: {"zh": "岛民议会大楼是一座两层的白色木楼，位于伊纳拉的码头街上，是岛民议会四十一名议员开会的地方。议员由全体成年岛民按比例代表制选出，男女都有选举权，负责渔业、教育、卫生和对外关系等日常立法。首席部长由议会多数派推举，目前由氏族传统党和新岛民党联合执政。大楼的会议厅可以眺望港湾，开会时窗户全部打开，海风和码头的声音一起飘进来。", "en": "The Islanders' Assembly House is a two-storey white timber building on Inara's quay street where the 41 members of the Islanders' Assembly sit. They are elected by all adult islanders, women and men, by proportional representation, and pass the everyday laws on fisheries, education, health and foreign relations. The Chief Minister is chosen by the majority, currently a coalition of Clan Tradition and the New Islanders. The chamber looks out over the harbour, and when it sits all the windows are open, letting in the sea breeze and the sounds of the quay."}
    in: div_t4rn8w
    offset_km: [-0.30, 0.00]
    site: {"layout": "slab", "size_m": [160, 90]}
  - id: bld_wrqgsb
    subtype: government
    status: generated
    names: {"zh": "大母之家", "en": "House of the Great Mother"}
    notes: {"zh": "大母之家是伊纳拉城中心的一座传统院落，是大母伊娜·雷尼索阿的居所和办公地。大母由母亲议会从各氏族最年长的女性家长中推选，终身任职，是群岛邦的元首和氏族习俗的守护者。院落的正屋供奉着历代大母的祖灵，院子里种着一棵据说有几百年历史的面包果树。按照习俗，新生的女孩在满月时被抱到这里接受大母的祝福。", "en": "The House of the Great Mother, a traditional courtyard house in the middle of Inara, is the home and office of the Great Mother, Ina Renisoa. The Great Mother is chosen for life by the Mothers' Assembly from among the eldest female heads of the clans, and is head of state and guardian of clan custom. The main room holds the ancestral spirits of past Great Mothers, and a breadfruit tree said to be several hundred years old grows in the courtyard. By custom, newborn girls are carried here at the full moon to receive the Great Mother's blessing."}
    in: div_t4rn8w
    offset_km: [-0.10, -0.30]
    site: {"layout": "courtyard", "size_m": [160, 140]}
