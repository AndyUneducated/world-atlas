    status: generated
    names: {"zh": "塔马塔圣母主教座堂", "en": "Tamata Cathedral of Our Lady"}
    notes: {"zh": "塔马塔圣母主教座堂是安博哈拉天主教会的主教座堂，一座白色石砌的巴西利卡式教堂，正门上方立着圣母像。每逢圣母升天节，信众抬着圣像绕城游行，沿途的居民在门前摆上鲜花和蜡烛。教堂旁边的修女会开办着一所学校和一家孤儿院。", "en": "Tamata Cathedral of Our Lady is the cathedral of the Catholic Church in Ambohara, a white stone basilica with a statue of the Virgin above its main door. At the Assumption the faithful carry her image round the city in procession, and the people along the way set flowers and candles at their doors. The convent beside the cathedral runs a school and an orphanage."}
