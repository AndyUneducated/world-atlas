    notes: {"zh": "五一体育场是马索沃利最大的体育场，可容纳八万人，以每年举行的大型团体操表演闻名：数万名学生手持彩色翻板组成巨幅图案，配合舞蹈和体操讲述国家的历史。参加表演的学生要提前数月每天排练。外国游客须随旅行团观看，门票是国家重要的外汇收入。", "en": "May Day Stadium is Masovoly's largest, holding 80,000, and famous for its annual mass games: tens of thousands of students hold up coloured cards to form giant pictures while dancers and gymnasts tell the story of the nation. The students rehearse every day for months beforehand. Foreign visitors may attend only with a tour group, and the tickets are an important source of foreign currency."}
