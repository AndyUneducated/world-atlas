    names: {"zh": "卡波拉武器作坊", "en": "Kabola Weapons Workshop"}
    notes: {"zh": "卡波拉武器作坊设在旧海军船坞的几座车间里，改装皮卡车、焊接装甲板、组装简易火箭和无人机。原材料大多从齐马罗沃走私而来。国际专家小组的报告指出，作坊生产的武器曾出现在岛上多处冲突中，并通过网络向海外的极端分子展示。", "en": "The Kabola Weapons Workshop occupies a few sheds of the old naval dockyard, converting pickup trucks, welding armour plate and assembling crude rockets and drones. Most of its materials are smuggled in from Tsimarovo. A panel of international experts has reported that its weapons have turned up in several conflicts on the island and are shown off online to extremists abroad."}
