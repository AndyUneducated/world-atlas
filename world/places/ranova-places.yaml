    status: generated
    names: {"zh": "洛哈瓦托大佛寺", "en": "Great Pagoda of Lohavato"}
    notes: {"zh": "洛哈瓦托大佛寺是洛哈瓦托最重要的佛寺，寺内的白塔据说供奉着佛陀的舍利。每天清晨僧侣们沿街托钵，信众在寺前布施米饭和水果。每逢佛诞节，全城的人提着油灯绕塔三圈，夜里整座寺院灯火通明。", "en": "The Great Pagoda of Lohavato is the most important Buddhist temple in Lohavato, and its white stupa is said to hold a relic of the Buddha. Every morning monks walk the streets with their alms bowls and believers give rice and fruit at the gate. On Vesak the whole city walks three times round the stupa carrying oil lamps, and the temple is ablaze with light all night."}
    in: div_mt8f0c
