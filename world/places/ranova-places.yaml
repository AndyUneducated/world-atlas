  # ── 安巴罗 / Ambaro ──
  - id: bld_wcx63w
    subtype: government
    status: generated
    names: {"zh": "国际委员会总部（旧海军要塞）", "en": "International Commission Headquarters (Old Naval Fort)"}
    notes: {"zh": "国际委员会总部设在安巴罗港口岬角上的旧海军要塞里。要塞建于联合共和国时期，安巴罗围城战中多次遭到炮击，停战后由国际委员会接管并修复。委员会由七名来自不同国家的委员组成，高级专员英格丽德·霍尔姆主持工作，负责托管地的行政、安全和重建。要塞的城墙上至今留着弹痕，内院的旧兵营改成了委员会的办公室和会议厅。每周五，委员会在要塞门前的广场上举行公开答问会，岛民可以当面提出意见。", "en": "The International Commission has its headquarters in the old naval fort on the headland of Ambaro harbour. The fort was built under the United Republic and shelled many times in the siege of Ambaro; after the armistice the Commission took it over and restored it. The Commission's seven members come from different countries, and the High Commissioner, Ingrid Holm, leads its work on the administration, security and reconstruction of the trust territory. The walls still bear the scars of shells, and the old barracks in the inner court have become the Commission's offices and meeting rooms. Every Friday the Commission holds a public question session on the square outside the gate, where islanders can raise their concerns face to face."}
    emblem_of: div_7t7xz6
    in: div_pr4aer
    offset_km: [0.00, 0.00]
    site: {"layout": "courtyard", "size_m": [300, 260]}
  - id: bld_5r4j8e
    subtype: government
    status: generated
    names: {"zh": "岛民理事会会堂", "en": "Islanders' Council Hall"}
    notes: {"zh": "岛民理事会会堂位于安巴罗城中心的旧市场旁，是咨询性的岛民理事会开会的地方。理事会由岛上各社区和难民营的代表组成，没有立法权，但国际委员会的重大决定都须先征求理事会的意见。会堂是一座在废墟上重建的简朴砖楼，墙上挂着一幅由岛上孩子们画的和平壁画。理事会的长期目标是推动托管结束后的自治选举，会堂里的一间展室介绍各国托管地走向自治的经验。", "en": "The Islanders' Council Hall stands by the old market in the middle of Ambaro and is where the advisory Islanders' Council meets. The council is made up of representatives of the island's communities and refugee camps; it has no power to legislate, but the International Commission must consult it before any major decision. The hall is a plain brick building rebuilt on the ruins, hung with a peace mural painted by the island's children. The council's long-term goal is elections for self-government once the trusteeship ends, and a room in the hall presents how other trust territories have moved to self-rule."}
    in: div_pr4aer
    offset_km: [-0.40, 0.00]
    site: {"layout": "hall", "size_m": [160, 100]}
  - id: bld_vf9axr
    subtype: court
    status: generated
    names: {"zh": "安巴罗托管地法院", "en": "Ambaro Trust Territory Court"}
    notes: {"zh": "安巴罗托管地法院由国际委员会设立，审理托管地的民事和刑事案件，也负责调查围城战期间的战争罪行。法庭由本地法官和国际法官共同组成，审判用拉诺瓦语和英语进行。法院大楼是一座三层的新建筑，一层有专门为证人设立的保护室。法院已经审结了数十起围城期间的案件，被告来自参与围城的多个国家和武装组织。", "en": "The Ambaro Trust Territory Court was set up by the International Commission to try civil and criminal cases in the territory and to investigate war crimes committed during the siege. Its benches combine local and international judges, and trials are held in Ranovan and English. The court is a new three-storey building with a protected room for witnesses on the ground floor. It has concluded dozens of cases from the siege, with defendants from several of the countries and armed groups that took part in it."}
    in: div_pr4aer
    offset_km: [0.00, -0.40]
    site: {"layout": "slab", "size_m": [140, 90]}
  - id: poi_qgg4cw
    subtype: refugee_camp
    status: generated
    names: {"zh": "安巴罗难民营", "en": "Ambaro Refugee Camp"}
    notes: {"zh": "安巴罗难民营占地两平方公里多，收容了约七万名难民，其中既有围城期间逃到岛上的本岛居民，也有从周边战乱国家辗转而来的人。营地由国际委员会和援助机构管理，帐篷早已换成了板房，街区之间有学校、诊所、清真寺、教堂和集市。许多难民在营地里住了二十多年，等待托管结束后的安置方案。国际委员会正在营地旁修建永久住房，让难民逐步迁入。", "en": "Ambaro Refugee Camp covers more than two square kilometres and shelters about 70,000 refugees, both people of the island who fled here during the siege and others who came by roundabout routes from the war-torn neighbours. It is run by the International Commission and aid agencies; the tents have long given way to prefabricated shelters, with schools, clinics, a mosque, churches and a market between the blocks. Many have lived here for more than twenty years, awaiting a settlement plan for when the trusteeship ends. The Commission is building permanent housing beside the camp for refugees to move into step by step."}
    in: div_pr4aer
    offset_km: [2.12, 2.12]
    site: {"layout": "refugee", "size_m": [1800, 1400], "angle_deg": 135, "rural": true}
