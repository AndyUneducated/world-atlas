    status: generated
    names: {"zh": "贾巴勒山口收费检查站", "en": "Jabal Pass Toll Checkpoint"}
    notes: {"zh": "贾巴勒山口收费检查站设在贾巴勒通往外界的公路上，几道路障、一座岗亭和一片停车检查区。过往的车辆和行人都要在这里接受检查，出示通行证并缴纳过路费。检查站的过路费是当地控制者的重要收入来源，商人们抱怨，同一条路上往往要交好几次钱。", "en": "Jabal Pass Toll Checkpoint stands on the road out of Jabal: a few barriers, a guard post and a vehicle inspection area. Every vehicle and traveller is checked here, must show a pass and pay a toll. The tolls are an important source of income for whoever controls the area, and traders complain that they often pay several times on the same road."}
