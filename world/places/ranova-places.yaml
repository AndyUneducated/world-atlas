  - id: bld_zfdgbn
    subtype: college
    status: generated
    names: {"zh": "菲安特拉路德派神学院", "en": "Fiantra Lutheran Seminary"}
    notes: {"zh": "菲安特拉路德派神学院是安博哈拉培养牧师和神职人员的主要学府，学制五年，学生住在学院的回廊宿舍里，每天的生活从晨祷开始。学院的图书馆收藏着拉诺瓦语圣经的早期译本。毕业生除了在本国教会服务，也有不少被派往岛上其他国家传教。", "en": "Fiantra Lutheran Seminary is Ambohara's main college for training pastors and clergy. Its course lasts five years, students live in the cloister dormitories, and every day begins with morning prayer. Its library holds early translations of the Bible into Ranovan. Besides serving the national church, many graduates are sent as missionaries to other countries on the island."}
