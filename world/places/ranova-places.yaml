  - id: bld_jakjfh
    subtype: court
    status: generated
    names: {"zh": "伊索卡人民法庭", "en": "Isoka People's Court"}
    notes: {"zh": "伊索卡人民法庭设在伊索卡镇广场边的一座长棚里，由革命委员会任命的审判员和村民代表组成，审理土地纠纷、偷窃和「反革命」案件。法庭在村民大会上公开审判，被告可以申辩，但判决常常带有强烈的政治色彩，被认定为「地主」或「政府密探」的人会被没收土地、送去劳动改造，甚至处决。人权组织记录了多起由该法庭作出的处决判决。", "en": "The Isoka People's Court sits in a long shed beside the square of Isoka town; its judges are appointed by the Revolutionary Committee and sit with village representatives to try land disputes, theft and 'counter-revolutionary' cases. Trials are public, before a village assembly, and the accused may speak in their defence, but verdicts are often strongly political: those branded 'landlords' or 'government spies' have their land confiscated, are sent to labour reform or are even executed. Human rights groups have documented several executions ordered by the court."}
    in: div_1rjhwr
    offset_km: [0.00, 0.00]
    site: {"layout": "hall", "size_m": [140, 90]}
  - id: bld_7np0vt
    subtype: government
    status: generated
    names: {"zh": "解放区行政委员会", "en": "Liberated Zone Administrative Committee"}
    notes: {"zh": "解放区行政委员会设在伊索卡镇的一座旧学校里，负责解放区的日常事务：组织合作社生产、征收「革命税」、开办识字班和医疗站。委员会的干部大多是当地村民，白天下地干活，晚上开会。学校的黑板上至今写着当周的劳动和学习安排。周边国家的军队进剿时，委员会会把档案装箱运进山里。", "en": "The Liberated Zone Administrative Committee works from an old school in Isoka town and runs the zone's daily affairs: it organises co-operative production, collects the 'revolutionary tax' and runs literacy classes and clinics. Most of its cadres are local villagers who work the fields by day and meet at night. The blackboard of the school still carries the week's work and study timetable. When neighbouring armies launch a sweep, the committee crates up its files and carries them into the hills."}
    in: div_1rjhwr
    offset_km: [-0.20, -0.20]
    site: {"layout": "hall", "size_m": [140, 90]}
