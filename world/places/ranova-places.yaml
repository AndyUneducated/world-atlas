    names: {"zh": "山洞弹药库", "en": "Cave Ammunition Store"}
    notes: {"zh": "山洞弹药库是游击队存放武器和弹药的山洞，洞口隐蔽在密林中，洞内分隔成几个小室，分别存放步枪、迫击炮弹和地雷。周边国家的军队多次进剿，都未能找到它的确切位置。洞口附近埋设了地雷，只有向导知道安全的路线。", "en": "The Cave Ammunition Store is a cave where the guerrillas keep their weapons and ammunition, its mouth hidden in thick forest and its interior divided into small chambers for rifles, mortar bombs and mines. Repeated sweeps by neighbouring armies have failed to find its exact position. Mines are laid round the entrance, and only the guides know the safe way in."}
