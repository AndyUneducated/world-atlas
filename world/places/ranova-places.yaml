    site: {"layout": "courtyard", "size_m": [220, 180]}
  - id: bld_phxdra
    subtype: government
    status: generated
    names: {"zh": "大议会厅", "en": "Hall of the Great Council"}
    notes: {"zh": "大议会厅位于执政官宫北侧，是大议会七十五名议员开会的地方。议员按比例代表制选出，三大商会通过与之结盟的政党在议会中拥有巨大影响。议会厅是一座长方形的大厅，天花板上绘有共和国船队远航的壁画，议员们按政党分坐在大厅两侧的长椅上。大议会每周开会两次，所有法案须经三读通过。码头工人和海员的工会常在大厅门前集会，要求提高工资。", "en": "The Hall of the Great Council, north of the Palace of the Consul, is where the 75 members of the Great Council sit. They are elected by proportional representation, and the three great chambers of commerce wield great influence through their allied parties. The hall is a long rectangle whose ceiling is painted with the republic's fleets sailing to distant ports, and members sit by party on benches along its two sides. The Council meets twice a week, and every bill passes through three readings. The dockers' and seafarers' unions often rally outside its doors for higher pay."}
    in: div_9gzdds
    offset_km: [-0.30, -0.20]
    site: {"layout": "hall", "size_m": [220, 140]}
  - id: bld_7a2jp3
    subtype: court
    status: generated
    names: {"zh": "瓦罗纳商事仲裁法院", "en": "Varona Court of Commercial Arbitration"}
    notes: {"zh": "瓦罗纳商事仲裁法院位于码头广场东侧，是共和国的最高法院，也是全岛最重要的商事仲裁机构。拉诺瓦各国的船东、商人和银行常常在合同中约定由瓦罗纳仲裁，甚至互相敌对的阵营也会把海运和保险纠纷交到这里。法院大楼是一座石砌的回字形建筑，庭院中央有一座天平喷泉。仲裁员由大议会任命，以中立和效率著称，判决书用拉诺瓦语、卡西里语和英语同时发布。", "en": "The Varona Court of Commercial Arbitration, on the east side of the quay square, is the republic's highest court and the most important commercial arbitration body on the island. Shipowners, merchants and banks from every Ranovan nation often name Varona arbitration in their contracts, and even rival blocs bring their shipping and insurance disputes here. The court is a stone quadrangle with a fountain in the form of a pair of scales in its courtyard. The arbitrators are appointed by the Great Council and known for neutrality and speed, and awards are issued in Ranovan, Kasiri and English at once."}
    in: div_9gzdds
    offset_km: [-0.30, 0.20]
    site: {"layout": "courtyard", "size_m": [160, 130]}
