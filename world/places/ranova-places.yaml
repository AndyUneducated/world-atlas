    names: {"zh": "萨马伊海岸巡逻基地", "en": "Samay Coastal Patrol Base"}
    notes: {"zh": "萨马伊海岸巡逻基地是海岸警卫队的小型港口，停泊着巡逻快艇和搜救船，负责萨马伊沿海的巡逻、缉私、渔业执法和海上搜救。每当风暴来临前，巡逻艇会出海通知渔船回港。近年来，基地也频繁出动，拦截偷渡和走私快艇。", "en": "Samay Coastal Patrol Base is a small harbour of the Coast Guard, berthing fast patrol boats and a rescue vessel for coastal patrol, anti-smuggling, fisheries enforcement and search and rescue along Samay's coast. Before every storm the boats go out to call the fishing fleet home. In recent years they have been out ever more often to stop people-smuggling and contraband speedboats."}
