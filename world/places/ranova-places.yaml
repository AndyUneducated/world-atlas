    notes: {"zh": "野蜂林是齐阿拉森林中野蜂聚居的一片老林，营地的人每年旱季爬上大树采集野蜂蜜，采蜜前要唱歌安抚蜂群，并且只取一半的蜂巢。蜂蜜是营地之间交换和招待客人的珍贵礼物。长老圈禁止在林中生火。", "en": "Wild Bee Wood is a stand of old forest in Tsiala where wild bees nest; each dry season the camp people climb the great trees to gather the honey, singing to calm the bees first and taking only half of each comb. The honey is a precious gift for barter between the camps and for guests. The elders' circle forbids lighting fires in the wood."}
