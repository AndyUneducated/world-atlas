    names: {"zh": "法里独木舟作坊", "en": "Fary Canoe Yard"}
    notes: {"zh": "法里独木舟作坊是南部海岸最大的独木舟作坊，工匠们用整棵硬木挖制带舷外支架的独木舟，一条船要做两三个月。作坊的独木舟供应全岛的渔民，也有人专程来订购用于节日的竞赛船。年轻的学徒在这里跟着老师傅学习，传统手艺得以保存。", "en": "The Fary Canoe Yard is the largest on the southern coast, where craftsmen hollow outrigger canoes from whole hardwood trunks, each boat taking two or three months. Its canoes go to fishers all over the island, and some people come specially to order racing boats for festivals. Young apprentices learn from the old masters here, keeping the craft alive."}
