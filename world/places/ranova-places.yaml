    names: {"zh": "总统府（旧省督府）", "en": "Presidential Palace (Old Governor's House)"}
    notes: {"zh": "总统府设在梅纳瓦利红土悬崖上的旧省督府里，这座两层的回廊式建筑建于联合共和国时期，原是西海岸省督的官邸。政变后，国家拯救委员会主席安德里·拉齐少将把办公室搬进了这里，委员会的会议也在二楼的会议厅举行。府前的广场设有装甲车和检查站，每晚宵禁开始时会鸣笛。每年独立日，攻击机编队从阿纳拉起飞，低空掠过总统府，是军政府最隆重的仪式。宪法自政变后暂停实施，军政府多次承诺举行选举，但日期一再推迟。", "en": "The Presidential Palace occupies the old governor's house on Menavaly's red cliffs, a two-storey colonnaded building from the time of the United Republic that was the residence of the governor of the West Coast Province. After the coup the Chairman of the National Salvation Committee, Major General Andry Ratsy, moved his office here, and the Committee meets in the conference room upstairs. Armoured vehicles and a checkpoint stand on the square in front, and a siren sounds every night when the curfew begins. On Independence Day a formation of attack aircraft from Anala flies low over the palace, the junta's grandest ceremony. The constitution has been suspended since the coup; the junta has repeatedly promised elections, but the date keeps slipping."}
