    status: generated
    names: {"zh": "丘陵山洞指挥所", "en": "Hill Cave Command Post"}
    notes: {"zh": "丘陵山洞指挥所是武装组织在贾巴勒丘陵中开凿的一组山洞，据周边国家的情报部门估计，组织的指挥层常在这里藏身。洞口用伪装网和岩石遮挡，内部有通信设备和储备物资。周边国家多次对这一带发动空袭，但山洞的具体位置一直难以确定。", "en": "The Hill Cave Command Post is a group of caves dug by the armed group in the Jabal hills, where neighbouring intelligence services believe its leadership often hides. The entrances are screened with camouflage nets and rock, and inside are communications equipment and stores. Neighbouring countries have often struck the area from the air, but the caves' exact position has always been hard to fix."}
