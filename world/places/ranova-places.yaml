    names: {"zh": "习惯法庭", "en": "Customary Court"}
    notes: {"zh": "习惯法庭是九氏族议事会下设的调解机构，设在议事场旁的一座长屋里，由各氏族推举的长老按照习惯法调解土地、牛群、婚姻和继承纠纷。裁决通常以赔偿瘤牛的方式了结，双方当事人在长老面前共饮一碗米酒以示和解。", "en": "The Customary Court is the mediation body of the Council of the Nine Clans, in a longhouse beside the council ground, where elders chosen by the clans settle disputes over land, cattle, marriage and inheritance under customary law. Rulings are usually settled by compensation in zebu, and the two parties drink a bowl of rice wine together before the elders as a sign of reconciliation."}
