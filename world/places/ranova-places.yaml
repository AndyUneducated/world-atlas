    status: generated
    names: {"zh": "曼加香草种植园", "en": "Manga Vanilla Plantation"}
    notes: {"zh": "曼加香草种植园是阿拉齐纳最大的香草园，香草藤缠绕在成排的支撑树上，每朵花都要在开放的那天上午由工人用竹签人工授粉。豆荚采摘后经过烫煮、日晒和数月的发酵才能出售，香气浓郁的上等香草荚价格比白银还贵。种植园雇有数百名季节工人，收获季节由武装保安看守，以防偷盗。", "en": "Manga Vanilla Plantation is Alatsina's largest, its vines trained up rows of support trees; every flower must be pollinated by hand with a bamboo sliver on the morning it opens. The pods are blanched, sun-dried and cured for months before sale, and the best are worth more than their weight in silver. Hundreds of seasonal workers are employed, and at harvest armed guards watch the vines against theft."}
