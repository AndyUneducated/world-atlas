  # ── 伊索卡解放区 / Isoka Zone ──
  - id: poi_gmfmvp
    subtype: militant_camp
    status: generated
    names: {"zh": "革命委员会营地", "en": "Revolutionary Committee Camp"}
    notes: {"zh": "革命委员会营地是伊索卡解放区的指挥中心，藏在伊索卡山的森林里，由几十座竹木棚屋和几个山洞组成。拉诺瓦人民战争党的革命委员会在这里开会，主席孔达同志（化名）和十五名委员决定游击战的方针、解放区的土地分配和对外谈判。为了躲避周边国家军队的空袭和进剿，营地每隔几个月就会转移，地图上标出的只是最近一次已知的位置。山洞里设有电台、野战医院和弹药库。解放区未获任何国家承认，周边多国将该组织列为恐怖组织。", "en": "The Revolutionary Committee Camp is the command centre of the Isoka Liberated Zone, hidden in the forest of Mount Isoka: a few dozen bamboo and timber huts and several caves. The Revolutionary Committee of the Ranovan People's War Party meets here, its chairman, Comrade Konda (an alias), and fifteen members deciding the line of the guerrilla war, the division of land in the zone and negotiations with outsiders. To escape air strikes and sweeps by neighbouring armies the camp moves every few months, and the position on the map is only the latest known one. In the caves are a radio station, a field hospital and an ammunition store. The zone is recognised by no state, and several neighbours list the organisation as terrorist."}
    emblem_of: div_9w60j4
    in: div_1rjhwr
    offset_km: [3.00, 0.00]
