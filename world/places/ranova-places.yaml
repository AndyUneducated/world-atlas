    names: {"zh": "山下棚户区", "en": "Lower Town Shanties"}
    notes: {"zh": "山下棚户区是安博维山脚下的贫民区，几万人住在铁皮和木板搭成的房子里，许多人在香草园打零工或为卡特尔跑腿。棚户区缺少自来水和下水道，雨季常常被淹。援助组织在这里开办了几所学校和诊所。", "en": "The Lower Town Shanties are the poor quarter at the foot of Ambovy's hill, where tens of thousands live in houses of tin and planks, many working odd jobs in the vanilla plantations or running errands for the cartel. They lack running water and drains and often flood in the rains. Aid agencies run a few schools and clinics here."}
