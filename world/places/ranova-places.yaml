  - id: bld_9jfnt4
    subtype: marketplace
    status: generated
    names: {"zh": "伊纳拉鱼市", "en": "Inara Fish Market"}
    notes: {"zh": "伊纳拉鱼市位于港口旁，每天凌晨渔船靠岸后开市，金枪鱼、石斑鱼、龙虾和章鱼按重量拍卖，一个小时内就能卖完。鱼市的冷库供应首都的餐馆和出口加工厂。市场旁的小饭馆从早上六点开始供应鱼汤和烤鱼，是渔民和码头工人吃早饭的地方。", "en": "Inara Fish Market stands by the harbour and opens before dawn when the boats come in; tuna, grouper, lobster and octopus are auctioned by weight and sold out within the hour. Its cold stores supply the capital's restaurants and the export processing plants. From six in the morning the little eating houses beside it serve fish soup and grilled fish, breakfast for the fishers and dockers."}
