  - id: poi_tzaxcr
    subtype: cultural_site
    status: generated
    names: {"zh": "九氏族王陵", "en": "Tombs of the Nine Clans"}
    notes: {"zh": "九氏族王陵是阿拉齐纳城北的一片山坡，九个氏族历代长老的石墓按氏族排列，墓前立着雕刻精美的木柱，上面刻着瘤牛、船和祖先的形象。每逢氏族的大节，族人在墓前献牛、跳舞，请祖灵分享节日。王陵是邦联最神圣的地方，也是九氏族团结的象征。", "en": "The Tombs of the Nine Clans cover a hillside north of Alatsina, where the stone tombs of each clan's elders stand in rows by clan, fronted by finely carved wooden posts showing zebu, boats and ancestors. At the great clan festivals people offer cattle and dance before the tombs, inviting the ancestors to share the feast. The tombs are the confederation's most sacred place and the symbol of the unity of the nine clans."}
