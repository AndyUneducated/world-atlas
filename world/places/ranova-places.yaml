    names: {"zh": "公共屋邨", "en": "Public Housing Estate"}
    notes: {"zh": "公共屋邨是马哈维洛政府兴建的公共住房，十几座三十层的住宅楼挤在填海地上；城邦三分之一的人口住在这样的屋邨里。屋邨的单位面积很小，但租金低廉，楼下是街市、小学和老人中心。轮候公屋的家庭往往要等好几年。", "en": "The Public Housing Estate is government-built housing, a dozen or more thirty-storey blocks crowded onto reclaimed land; a third of the city-state's people live in estates like it. The flats are small but cheap to rent, with a wet market, a primary school and an elderly centre below. Families on the waiting list often wait years."}
