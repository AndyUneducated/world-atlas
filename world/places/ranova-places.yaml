    notes: {"zh": "齐马罗沃国家广播电视台是齐马罗沃最大的广播电视机构，经营两个电视频道和四套广播节目，用本国语言和英语播出。大楼顶上竖着一座红白相间的发射塔，是齐马罗沃的地标之一。每晚七点的新闻节目是全国收视率最高的节目。电台的短波节目也能在岛上其他国家收听到。", "en": "Tsimarovo National Broadcasting is the country's largest broadcaster, with two television channels and four radio services in the national language and English. A red-and-white transmitter mast on its roof is one of Tsimarovo's landmarks. The seven o'clock evening news is the most watched programme in the country, and its shortwave service can be heard in other countries on the island too."}
