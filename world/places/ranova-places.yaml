  # ── 萨希利亚 / Sahiliya ──
  - id: bld_7r77nr
    subtype: government
    status: generated
    names: {"zh": "总统府", "en": "Presidential Palace"}
    notes: {"zh": "总统府位于萨希勒白色老城北端的海角上，是萨希利亚伊斯兰共和国总统的官邸。总统由国民议会选出，是国家元首和宗教节日的主持者，日常政务则由总理负责。总统府是一座带回廊的白色石楼，围绕着一个种满柠檬树的庭院，门窗上雕刻着卡西里风格的几何花纹。现任总统优素福·卡西姆在这里接见外国使节；斋月期间，总统府每晚在庭院里设开斋宴，邀请市民和外交官同席。府外的海滨步道对公众开放。", "en": "The Presidential Palace stands on the headland at the northern end of Sahil's white old town and is the residence of the President of the Islamic Republic of Sahiliya. The president is elected by the National Assembly and is head of state and presides over religious festivals, while the prime minister runs the government. The palace is a white stone building round a cloistered courtyard of lemon trees, its doors and windows carved with Kasiri geometric patterns. The current president, Yusuf Kasim, receives foreign envoys here; during Ramadan the palace holds an iftar in the courtyard every evening for citizens and diplomats alike. The seafront promenade outside is open to the public."}
    emblem_of: div_t5zph6
    in: div_f9gjbe
    offset_km: [0.20, -0.30]
    site: {"layout": "courtyard", "size_m": [220, 200]}
  - id: bld_hv7z78
    subtype: government
    status: generated
    names: {"zh": "国民议会大厦", "en": "National Assembly Building"}
    notes: {"zh": "国民议会大厦的白色圆顶与大清真寺的宣礼塔隔着老城集市相望，是国民议会一百零一名议员开会的地方。议员按全国比例代表制选出，伊斯兰公正党、海岸民族党和人民劳动党是三大政党。议事厅位于圆顶之下，四周墙面以蓝白瓷砖装饰，主席台后方是宪法第一条：「萨希利亚是一个伊斯兰的民主共和国」。议会通过的法律还须经宗教学者委员会审查是否符合教法。会议用卡西里语和拉诺瓦语进行，旁听席对公众开放。", "en": "The white dome of the National Assembly Building faces the minaret of the Great Mosque across the old town's market, and here the 101 members of the National Assembly sit. They are elected by nationwide proportional representation, and Islamic Justice, the Coast National Party and the People's Labour Party are the three main parties. The chamber lies under the dome, its walls lined with blue and white tiles, and behind the Speaker's chair is the first article of the constitution: 'Sahiliya is an Islamic democratic republic'. Laws passed by the Assembly must also be reviewed by the Council of Religious Scholars for conformity with Islamic law. Debates are in Kasiri and Ranovan, and the public gallery is open."}
    in: div_f9gjbe
    offset_km: [0.50, 0.00]
    site: {"layout": "dome", "size_m": [200, 200]}
  - id: bld_7qmbcp
    subtype: government
    status: generated
    names: {"zh": "总理府", "en": "Prime Minister's Office"}
    notes: {"zh": "总理府位于萨希勒新城的海滨大道上，是总理和内阁的办公地。总理由国民议会多数党领袖出任，目前是伊斯兰公正党与海岸民族党的联合政府。大楼是一座七层的白色长楼，底层有拱廊，延续了老城的建筑风格。内阁每周三在顶层会议室开会，会后总理府发言人在一楼新闻厅向记者通报。西岸战争期间，总理府曾在这里协调接收内地逃来的难民，至今仍设有难民事务署。", "en": "The Prime Minister's Office stands on the seafront boulevard of Sahil's new town and houses the prime minister and the cabinet. The prime minister is the leader of the Assembly majority, currently a coalition of Islamic Justice and the Coast National Party. The building is a seven-storey white slab with an arcade on the ground floor, continuing the style of the old town. The cabinet meets every Wednesday in the top-floor conference room, and afterwards the government spokesperson briefs reporters in the press room downstairs. During the West Coast War the office co-ordinated the reception of refugees fleeing the interior, and it still houses the Refugee Affairs Agency."}
    in: div_f9gjbe
    offset_km: [-0.10, -0.50]
    site: {"layout": "slab", "size_m": [200, 120]}
  - id: bld_d1gkyy
    subtype: mosque
    status: generated
    names: {"zh": "萨希勒大清真寺", "en": "Great Mosque of Sahil"}
    notes: {"zh": "萨希勒大清真寺是萨希利亚最大的清真寺，白色的圆顶和高耸的宣礼塔在城中各处都能看见，礼拜大殿可容纳一万名信众。每逢星期五的聚礼和两个节日，信众挤满大殿和周围的庭院。清真寺附设一所经学院和一座藏有古代手抄本古兰经的图书馆。", "en": "The Great Mosque of Sahil is the largest mosque in Sahiliya; its white dome and tall minaret can be seen from all over the city, and its prayer hall holds 10,000 worshippers. At Friday prayers and the two Eids the faithful fill the hall and the courtyards round it. It has a madrasa and a library holding ancient manuscript Qurans."}
    in: div_f9gjbe
    offset_km: [0.60, -0.40]
    site: {"layout": "dome", "size_m": [220, 220]}
  - id: bld_tmnxym
    subtype: government
    status: generated
    names: {"zh": "宗教学者委员会", "en": "Council of Religious Scholars"}
    notes: {"zh": "宗教学者委员会位于大清真寺旁的一座回廊院落里，由十五名宗教学者组成，负责审查国民议会通过的法律是否符合伊斯兰教法。委员会以温和的教法解释著称，近年来批准了允许女性担任法官、改革继承法的议案，也多次公开谴责贾巴利亚武装组织对教法的歪曲。委员会的意见书公开发布，常常引起热烈讨论。", "en": "The Council of Religious Scholars sits in a cloistered courtyard beside the Great Mosque; its fifteen scholars review whether the laws passed by the National Assembly conform to Islamic law. The Council is known for its moderate interpretation, and in recent years it has approved bills letting women serve as judges and reforming inheritance law, and has publicly condemned the Jabaliya armed group's distortion of the faith. Its opinions are published and often hotly debated."}
    in: div_f9gjbe
    offset_km: [0.60, 0.40]
    site: {"layout": "courtyard", "size_m": [180, 160]}
  - id: bld_v2mxjc
    subtype: college
    status: generated
    names: {"zh": "卡西里经学院", "en": "Kasiri Madrasa"}
    notes: {"zh": "卡西里经学院是萨希利亚培养伊玛目和宗教学者的学府，课程包括古兰经、圣训、教法和阿拉伯语，也开设数学、历史和外语。学院的教师以温和的教法解释著称，毕业生在全岛的清真寺任职。学院每年举办一次古兰经诵读比赛，吸引各国的青年参加。", "en": "Kasiri Madrasa trains imams and religious scholars for Sahiliya; its courses cover the Quran, the Hadith, Islamic law and Arabic as well as mathematics, history and foreign languages. Its teachers are known for their moderate interpretation of the law, and its graduates serve in mosques across the island. Each year it holds a Quran recitation contest that draws young people from many countries."}
    in: div_6jwhzg
    offset_km: [0.00, 0.00]
    site: {"layout": "courtyard", "size_m": [180, 180]}
  - id: bld_ayh8b8
    subtype: marketplace
    status: generated
    names: {"zh": "萨希勒老城集市", "en": "Sahil Old Town Souk"}
    notes: {"zh": "萨希勒老城集市是全岛最古老的集市之一，狭窄的巷道两旁是几百家店铺，出售香料、丁香、乳香、铜器、织锦和金饰。集市位于大清真寺和国民议会之间，单桅帆船运来的货物从港口直接搬进店里。每天日落后，集市的茶馆里坐满了下棋和谈生意的人。", "en": "The Sahil Old Town Souk is one of the oldest markets on the island, hundreds of shops along narrow lanes selling spices, cloves, frankincense, copperware, brocade and gold. It lies between the Great Mosque and the National Assembly, and goods from the dhows are carried from the harbour straight into the shops. After sunset its tea houses fill with people playing board games and doing business."}
    in: div_f9gjbe
    offset_km: [0.30, -0.70]
    site: {"layout": "market", "size_m": [300, 200]}
  - id: bld_xyx956
    subtype: university
    status: generated
    names: {"zh": "萨希勒大学", "en": "University of Sahil"}
    notes: {"zh": "萨希勒大学是萨希利亚规模最大的高等学府，设有文、理、医、法、工、农等学院，在校学生一万多人。校园建在城市边缘的缓坡上，教学楼之间是大片的草坪和芒果树。大学的医学院为全国培养了大部分医生，农学院的稻作和热带作物研究在全岛都有名气。每年毕业典礼时，毕业生穿着传统的披肩在校园里游行。", "en": "The University of Sahil is Sahiliya's largest institution of higher education, with faculties of arts, sciences, medicine, law, engineering and agriculture and more than 10,000 students. Its campus lies on gentle slopes at the edge of the city, with broad lawns and mango trees between the buildings. Its medical school has trained most of the country's doctors, and its agricultural school is known across the island for research on rice and tropical crops. At each graduation the graduates parade round the campus in traditional shawls."}
    in: div_f9gjbe
    offset_km: [-0.40, -1.20]
    site: {"layout": "campus", "size_m": [900, 600]}
  - id: bld_j9022d
    subtype: hospital
    status: generated
    names: {"zh": "萨希勒总医院", "en": "Sahil General Hospital"}
    notes: {"zh": "萨希勒总医院是萨希利亚最大的综合医院，设有一千多张病床，急诊、外科、产科和传染病科是主要科室。医院也是大学医学院的教学医院，各地的疑难病人都转诊到这里。战争年代，医院曾收治大量伤员，至今设有专门的创伤和康复中心。门诊大楼前每天清晨排起长队，许多病人从外地坐一整夜的车赶来。", "en": "Sahil General Hospital is Sahiliya's largest general hospital, with over a thousand beds; emergency medicine, surgery, obstetrics and infectious diseases are its main departments. It is also the teaching hospital of the university's medical school, and difficult cases from across the country are referred here. In the war years it treated great numbers of wounded, and it still has a dedicated trauma and rehabilitation centre. Every morning long queues form outside the outpatient building, many patients having travelled all night to get here."}
    in: div_f9gjbe
    offset_km: [1.00, 0.00]
    site: {"layout": "complex", "size_m": [320, 240]}
  - id: bld_dvq9gd
    subtype: museum
    status: generated
    names: {"zh": "萨希利亚国家博物馆", "en": "National Museum of Sahiliya"}
    notes: {"zh": "萨希利亚国家博物馆位于萨希勒市中心，收藏从早期定居者的独木舟、石器，到各王国时代的铜器、织物和手抄本，再到拉诺瓦联合共和国时期的档案与照片。展厅按时间顺序排列，最后几间讲述大分裂以来萨希利亚的历史。馆藏中最受欢迎的是一艘长二十多米的古代远洋独木舟。博物馆每月第一个星期日免费开放，学校常组织学生来参观。", "en": "The National Museum of Sahiliya, in the centre of Sahil, collects everything from the dugout canoes and stone tools of the first settlers to the bronzes, textiles and manuscripts of the old kingdoms and the archives and photographs of the United Republic of Ranova. Its galleries run in order of time, and the last few tell Sahiliya's story since the Sundering. The favourite exhibit is an ancient ocean-going canoe more than 20 m long. Admission is free on the first Sunday of each month, and schools often bring their pupils."}
    in: div_f9gjbe
    offset_km: [0.70, -0.80]
    site: {"layout": "hall", "size_m": [240, 160]}
  - id: bld_rnm9sh
    subtype: library
    status: generated
    names: {"zh": "萨希利亚国家图书馆", "en": "National Library of Sahiliya"}
    notes: {"zh": "萨希利亚国家图书馆是萨希利亚最大的图书馆和法定的出版物收藏机构，本国出版的每一本书、每一份报纸都要在这里存放两份。馆内还保存着联合共和国时期的地方档案和大量用拉诺瓦语、卡西里语写成的手稿。阅览室是一座方形大厅，每天开放到晚上九点，考试季节常常座无虚席。图书馆近年来开始把旧报纸和手稿数字化。", "en": "The National Library of Sahiliya is the country's largest library and its legal deposit library: two copies of every book and newspaper published in Sahiliya must be lodged here. It also holds local archives from the United Republic and many manuscripts in Ranovan and Kasiri. The reading room is a square hall open until nine every evening and full to the last seat in exam season. In recent years the library has begun digitising its old newspapers and manuscripts."}
    in: div_f9gjbe
    offset_km: [0.80, 0.70]
    site: {"layout": "block", "size_m": [180, 180]}
  - id: bld_47r10y
