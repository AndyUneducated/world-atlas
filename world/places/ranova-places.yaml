    notes: {"zh": "安帕尼海军基地（东南舰队）是联邦海军在安帕尼的基地，两道防波堤围成的港池里停泊着联邦海军的舰艇。码头后面是修船厂、油库和水兵营房。舰艇从这里出发，在安博哈拉的领海和航道上巡逻，护送商船通过危险海域。每年海军节，基地对公众开放一天，市民可以登舰参观。", "en": "Ampany Naval Base (South-East Fleet) is the Federal Navy's base at Ampany, its basin between two breakwaters crowded with the fleet's ships. Behind the quays are the repair yard, fuel depot and sailors' barracks. Ships sail from here to patrol Ambohara's territorial waters and sea lanes and escort merchant ships through dangerous waters. On Navy Day each year the base opens to the public and visitors can go aboard."}
