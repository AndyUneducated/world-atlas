    status: generated
    names: {"zh": "首相府", "en": "Office of the Prime Minister"}
    notes: {"zh": "首相府位于王宫东侧的一座传统院落里，是首相和内阁的办公地。首相由国王从议会议员中任命，负责日常行政，重大事务须呈国王裁决。院落的门楼上挂着国王亲笔题写的匾额「为民」，院内种着菩提树和茶树。内阁会议每周举行一次，会前全体阁员在院内的小佛堂里静坐片刻。首相府旁边是负责「国民幸福」政策的规划委员会。", "en": "The Office of the Prime Minister occupies a traditional courtyard house east of the palace and houses the prime minister and the cabinet. The prime minister is appointed by the king from among the members of the Assembly and runs the administration, referring major matters to the king. A board inscribed by the king's own hand with the words 'For the People' hangs over the gatehouse, and bodhi trees and tea bushes grow in the court. The cabinet meets once a week, and beforehand all its members sit in silence for a while in the small shrine in the courtyard. Next door is the planning commission in charge of the national happiness policy."}
    in: div_mt8f0c
    offset_km: [0.00, -0.40]
    site: {"layout": "courtyard", "size_m": [180, 160]}
