    names: {"zh": "国民警卫队总部", "en": "National Guard Headquarters"}
    notes: {"zh": "国民警卫队总部位于安博哈拉城郊，是国民警卫队的指挥机关和主要驻地。国民警卫队负责要人警卫、重要设施守卫和内部安全，战时也作为后备力量。营区的主楼前是一个操场，每天清晨都能听到士兵出操的口号声。", "en": "The National Guard Headquarters, outside Ambohara, is the command and main base of the National Guard, which guards leaders and key installations, keeps internal security and serves as a reserve in war. In front of its main building is a parade ground, and every morning the shouts of soldiers at drill can be heard."}
