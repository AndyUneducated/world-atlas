  # ── 阿瓦拉齐 / Avaratsy ──
  - id: bld_st3f3c
    subtype: government
    status: generated
    names: {"zh": "人民宫", "en": "People's Palace"}
    notes: {"zh": "人民宫位于沃希马希革命大街的尽头，是国家主席府和国务院所在地，也是阿瓦拉齐最重要的政治建筑。这是一座十二层的长条形大楼，立面布满竖向的混凝土线条，屋顶上竖着一颗红色五角星，夜里亮灯，从港口就能望见。革命大街从码头笔直通到人民宫正门前的广场，每年劳动节和建国日的游行队伍都从港口出发，经过检阅台前。现任劳动党总书记、国家主席米拉·安德里安托在七楼办公。大楼不对外开放，但门前的广场全天开放，傍晚常有市民在这里散步、下棋。", "en": "The People's Palace stands at the end of Vohimahy's Revolution Avenue and houses the office of the President of the State and the State Council; it is the most important political building in Avaratsy. A twelve-storey slab with vertical concrete ribs across its front, it carries a red star on the roof, lit at night and visible from the harbour. Revolution Avenue runs dead straight from the docks to the square in front of its main door, and on Labour Day and National Day the parades set out from the port and pass the reviewing stand here. The General Secretary of the Labour Party and President, Mira Andrianto, has her office on the seventh floor. The building is closed to the public, but the square in front is open at all hours and in the evenings people stroll and play chess there."}
    emblem_of: div_r9whm0
    in: div_89czvj
    offset_km: [0.00, 0.00]
    site: {"layout": "slab", "size_m": [280, 140]}
  - id: bld_5rgmzx
    subtype: government
    status: generated
    names: {"zh": "人民代表大会堂", "en": "Hall of the People's Congress"}
    notes: {"zh": "人民代表大会堂位于人民宫南侧，是人民代表大会三百名代表开会的地方。大会堂的正面是八根方柱，柱廊上方的浮雕表现工人、农民和渔民并肩前进的场景。代表由各级选举委员会提名，绝大多数属于劳动党，另有农民联盟代表和少数无党派人士。大会每年春季开会一次，会期一周左右，审议国家计划和预算，表决几乎总是一致通过。平时大会堂也用来举办全国劳动模范表彰大会和大型文艺演出，门票通过工会和单位分发。", "en": "The Hall of the People's Congress, south of the People's Palace, is where the 300 deputies of the People's Congress meet. Its front has eight square columns, and the relief above the colonnade shows workers, peasants and fishers marching side by side. Deputies are nominated by electoral committees at each level; the great majority belong to the Labour Party, with members of the Peasants' Union and a few non-party members. The Congress meets once a year in spring for about a week to approve the state plan and the budget, and its votes are almost always unanimous. The rest of the year the hall hosts the national awards for model workers and large stage performances, with tickets handed out through the unions and workplaces."}
    in: div_89czvj
    offset_km: [-0.40, 0.00]
    site: {"layout": "hall", "size_m": [240, 160]}
  - id: bld_jtn1s7
    subtype: government
    status: generated
    names: {"zh": "劳动党中央委员会大楼", "en": "Labour Party Central Committee Building"}
    notes: {"zh": "劳动党中央委员会大楼位于革命大街中段，是阿瓦拉齐劳动党中央委员会和政治局的办公地。按照宪法，劳动党是国家的领导力量，政治局在这里讨论的决定随后才交给人民代表大会和国务院执行，因此外交官们说，阿瓦拉齐真正的政府在这座楼里。大楼呈L形，转角处是一座钟楼，每天早上八点播放《国际歌》。近年来政治局在这里通过了开放沿海经济区、允许小型私人商店的决议，大楼也因此被一些党员私下称为「改革楼」。", "en": "The Labour Party Central Committee Building, halfway along Revolution Avenue, houses the Central Committee and Politburo of the Avaratsy Labour Party. Under the constitution the party is the leading force of the state, and the Politburo's decisions here only afterwards go to the People's Congress and the State Council to carry out, so diplomats say that Avaratsy's real government sits in this building. It is L-shaped with a clock tower at the corner that plays 'The Internationale' every morning at eight. In recent years the Politburo has passed here the decisions to open coastal economic zones and allow small private shops, and some party members privately call it the 'reform building'."}
    in: div_89czvj
    offset_km: [0.00, -0.40]
    site: {"layout": "lshape", "size_m": [220, 180]}
  - id: bld_q1aqkd
    subtype: museum
    status: generated
    names: {"zh": "革命历史博物馆", "en": "Museum of the Revolution"}
    notes: {"zh": "革命历史博物馆位于沃希马希革命大街，讲述劳动党领导的革命、建国和高原战争的官方历史。展品包括游击队用过的步枪、建国宣言的手稿和高原战争中缴获的坦克。学生和新入党的党员都要来这里参观。近年来，博物馆增加了一个介绍沿海经济区的展厅，展出国营工厂与外资合作生产的产品。", "en": "The Museum of the Revolution, on Revolution Avenue in Vohimahy, tells the official history of the revolution led by the Labour Party, the founding of the state and the Highland War. Its exhibits include guerrillas' rifles, the manuscript of the founding declaration and tanks captured in the Highland War. Schoolchildren and new party members are all brought here. In recent years a gallery on the coastal economic zones has been added, showing goods made by state factories in partnership with foreign firms."}
    in: div_89czvj
    offset_km: [0.00, 0.40]
    site: {"layout": "hall", "size_m": [220, 150]}
  - id: bld_z30jw5
    subtype: library
    status: generated
    names: {"zh": "阿瓦拉齐国家图书馆", "en": "National Library of Avaratsy"}
    notes: {"zh": "阿瓦拉齐国家图书馆是阿瓦拉齐最大的图书馆和法定的出版物收藏机构，本国出版的每一本书、每一份报纸都要在这里存放两份。馆内还保存着联合共和国时期的地方档案和大量用拉诺瓦语、卡西里语写成的手稿。阅览室是一座方形大厅，每天开放到晚上九点，考试季节常常座无虚席。图书馆近年来开始把旧报纸和手稿数字化。", "en": "The National Library of Avaratsy is the country's largest library and its legal deposit library: two copies of every book and newspaper published in Avaratsy must be lodged here. It also holds local archives from the United Republic and many manuscripts in Ranovan and Kasiri. The reading room is a square hall open until nine every evening and full to the last seat in exam season. In recent years the library has begun digitising its old newspapers and manuscripts."}
    in: div_89czvj
    offset_km: [0.40, 0.00]
    site: {"layout": "block", "size_m": [180, 180]}
  - id: bld_s3t42w
    subtype: university
    status: generated
    names: {"zh": "沃希马希大学", "en": "University of Vohimahy"}
    notes: {"zh": "沃希马希大学是阿瓦拉齐规模最大的高等学府，设有文、理、医、法、工、农等学院，在校学生一万多人。校园建在城市边缘的缓坡上，教学楼之间是大片的草坪和芒果树。大学的医学院为全国培养了大部分医生，农学院的稻作和热带作物研究在全岛都有名气。每年毕业典礼时，毕业生穿着传统的披肩在校园里游行。", "en": "The University of Vohimahy is Avaratsy's largest institution of higher education, with faculties of arts, sciences, medicine, law, engineering and agriculture and more than 10,000 students. Its campus lies on gentle slopes at the edge of the city, with broad lawns and mango trees between the buildings. Its medical school has trained most of the country's doctors, and its agricultural school is known across the island for research on rice and tropical crops. At each graduation the graduates parade round the campus in traditional shawls."}
    in: div_89czvj
    offset_km: [-0.80, -0.70]
    site: {"layout": "campus", "size_m": [900, 600]}
  - id: bld_0pfvbs
    subtype: hospital
    status: generated
    names: {"zh": "沃希马希总医院", "en": "Vohimahy General Hospital"}
    notes: {"zh": "沃希马希总医院是阿瓦拉齐最大的综合医院，设有一千多张病床，急诊、外科、产科和传染病科是主要科室。医院也是大学医学院的教学医院，各地的疑难病人都转诊到这里。战争年代，医院曾收治大量伤员，至今设有专门的创伤和康复中心。门诊大楼前每天清晨排起长队，许多病人从外地坐一整夜的车赶来。", "en": "Vohimahy General Hospital is Avaratsy's largest general hospital, with over a thousand beds; emergency medicine, surgery, obstetrics and infectious diseases are its main departments. It is also the teaching hospital of the university's medical school, and difficult cases from across the country are referred here. In the war years it treated great numbers of wounded, and it still has a dedicated trauma and rehabilitation centre. Every morning long queues form outside the outpatient building, many patients having travelled all night to get here."}
    in: div_89czvj
    offset_km: [0.50, -0.40]
    site: {"layout": "complex", "size_m": [320, 240]}
  - id: bld_7jdfps
    subtype: stadium
    status: generated
    names: {"zh": "沃希马希体育场", "en": "Vohimahy Stadium"}
    notes: {"zh": "沃希马希体育场是阿瓦拉齐最大的体育场，可容纳三万多名观众，国家足球队的主场比赛和全国运动会都在这里举行。体育场也是举行国庆庆典和大型集会的场所。看台下设有田径训练馆和运动员宿舍，每天清晨都有市民在外围的跑道上锻炼。", "en": "Vohimahy Stadium is Avaratsy's largest stadium, holding more than 30,000 spectators; the national football team's home games and the national games are held here. It is also used for National Day celebrations and large rallies. Beneath the stands are an athletics training hall and athletes' dormitories, and every morning people exercise on the track round the outside."}
    in: div_89czvj
    offset_km: [-0.40, 0.50]
    site: {"layout": "stadium", "size_m": [300, 240]}
  - id: bld_tgyssm
    subtype: bank
    status: generated
    names: {"zh": "阿瓦拉齐中央银行", "en": "Central Bank of Avaratsy"}
    notes: {"zh": "阿瓦拉齐中央银行负责发行货币、管理外汇储备和监管商业银行。银行大楼是一座十几层的方形塔楼，地下有存放黄金和外汇储备的金库。大分裂后，各国从联合共和国的中央银行分得了一部分黄金储备，阿瓦拉齐的那一份至今仍存放在这座楼里。银行一楼设有货币博物馆，展出联合共和国时期和独立以来发行的纸币与硬币。", "en": "The Central Bank of Avaratsy issues the currency, manages the foreign-exchange reserves and supervises the commercial banks. Its building is a square tower of a dozen or so storeys with vaults below for the gold and currency reserves. After the Sundering each country received a share of the gold reserves of the United Republic's central bank, and Avaratsy's share is still kept here. A currency museum on the ground floor shows the notes and coins of the United Republic and those issued since independence."}
    in: div_89czvj
    offset_km: [0.30, 0.30]
    site: {"layout": "tower", "size_m": [140, 140]}
  - id: bld_4crbtw
    subtype: office
    status: generated
    names: {"zh": "阿瓦拉齐国家广播电视台", "en": "Avaratsy National Broadcasting"}
    notes: {"zh": "阿瓦拉齐国家广播电视台是阿瓦拉齐最大的广播电视机构，经营两个电视频道和四套广播节目，用本国语言和英语播出。大楼顶上竖着一座红白相间的发射塔，是沃希马希的地标之一。每晚七点的新闻节目是全国收视率最高的节目。电台的短波节目也能在岛上其他国家收听到。", "en": "Avaratsy National Broadcasting is the country's largest broadcaster, with two television channels and four radio services in the national language and English. A red-and-white transmitter mast on its roof is one of Vohimahy's landmarks. The seven o'clock evening news is the most watched programme in the country, and its shortwave service can be heard in other countries on the island too."}
    in: div_89czvj
    offset_km: [0.30, 0.60]
    site: {"layout": "slab", "size_m": [180, 90]}
  - id: poi_zjntr8
    subtype: plaza
    status: generated
    names: {"zh": "革命广场", "en": "Revolution Square"}
    notes: {"zh": "革命广场是城市的中心，四周环绕着政府大楼、商店和咖啡馆，广场中央立着国家独立纪念碑。国庆日的庆典、新年的烟花和重要的公共集会都在这里举行。平日里，广场上有卖冰淇淋和气球的小贩，傍晚时分市民们来这里乘凉。", "en": "Revolution Square is the heart of the city, surrounded by government buildings, shops and cafés, with the national independence monument in the middle. National Day celebrations, New Year fireworks and important public gatherings are held here. On ordinary days vendors sell ice cream and balloons, and in the evening people come to enjoy the cool air."}
    in: div_89czvj
    offset_km: [0.80, 0.00]
    site: {"layout": "plaza", "size_m": [300, 220]}
  - id: poi_6tpdfq
    subtype: factory
    status: generated
    names: {"zh": "沃希马希拖拉机厂", "en": "Vohimahy Tractor Works"}
    notes: {"zh": "沃希马希拖拉机厂是阿瓦拉齐计划经济的骨干企业，生产拖拉机、卡车和农机具，供应全国的集体农庄，也出口到马索沃利。工厂的厂区占了城北一大片，有自己的住宅区、学校和文化宫。设备大多是几十年前的老式机床，近年来与外国公司合资引进了新的总装线。", "en": "The Vohimahy Tractor Works is a mainstay of Avaratsy's planned economy, building tractors, lorries and farm machinery for the country's collective farms and for export to Masovoly. It covers a large part of the north of the city, with its own housing estate, schools and palace of culture. Most of its machine tools are decades old, but in recent years a joint venture with a foreign firm has brought in a new assembly line."}
    in: div_89czvj
    offset_km: [0.00, 3.00]
    site: {"layout": "plant", "size_m": [1200, 800], "variant": "assembly", "angle_deg": 0, "rural": true}
  - id: poi_8be2pd
    subtype: factory
    status: generated
    names: {"zh": "沃希马希造船厂", "en": "Vohimahy Shipyard"}
    notes: {"zh": "沃希马希造船厂是阿瓦拉齐最大的造船企业，拥有两座干船坞和几条船台，建造渔船、货轮和巡逻艇，也为过往船只提供修理服务。船厂的龙门吊是港区最醒目的建筑。每当新船下水，船厂的工人和家属都会来到码头边庆祝。", "en": "Vohimahy Shipyard is Avaratsy's largest shipbuilder, with two dry docks and several slipways; it builds fishing boats, cargo ships and patrol boats and repairs passing vessels. Its gantry cranes are the most striking sight in the port. Whenever a new ship is launched, the yard's workers and their families gather on the quay to celebrate."}
