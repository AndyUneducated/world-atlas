    notes: {"zh": "安德里安巴稀土矿位于首都西面的山区，是马索沃利最重要的外汇来源。矿石在矿区的选矿厂初步加工后，经海路秘密出口，以规避国际制裁。矿区由人民军守卫，工人中有相当一部分来自劳动教养营。外国研究机构根据卫星图像估计，矿区近年来扩大了一倍。", "en": "The Andriamba Rare Earth Mine, in the hills west of the capital, is Masovoly's most important earner of foreign currency. Its ore is concentrated on site and shipped out secretly by sea to evade international sanctions. The People's Army guards the mine, and many of its workers are said to come from labour camps. Foreign researchers estimate from satellite images that it has doubled in size in recent years."}
