  # ── 努西拉 / Nusira ──
  - id: bld_m7hgk7
    subtype: government
    status: generated
    names: {"zh": "苏丹宫", "en": "Sultan's Palace"}
    notes: {"zh": "苏丹宫沿努西拉海湾展开，是苏丹哈米迪·本·努西尔三世的宫殿，也是苏丹国的权力中心。宫殿由白色珊瑚石砌成，几座庭院层层相套，最内层是苏丹的寝宫和王室会议厅，外层是接见厅和王室法院。按照宪法，苏丹是国家元首和政府首脑，任命首相和全体大臣，石油收入的分配也由王室决定。每逢开斋节，苏丹在宫门前接受臣民的祝贺，并向每户家庭发放节日礼金。宫殿不对外开放，海湾对面的观景台是游客拍照的地方。", "en": "The Sultan's Palace stretches along Nusira bay and is the palace of Sultan Hamidi bin Nusir III and the centre of power of the sultanate. It is built of white coral stone, a nest of courtyards one within another, with the sultan's private apartments and the royal council chamber at the heart and the audience hall and the royal court in the outer ring. Under the constitution the sultan is both head of state and head of government and appoints the prime minister and all ministers, and the royal family decides how oil revenue is shared out. At Eid the sultan receives his subjects' greetings at the palace gate and hands out a festival gift to every household. The palace is closed to the public; the viewpoint across the bay is where visitors take their photographs."}
    emblem_of: div_38z2mg
    in: div_vtqsys
    offset_km: [0.00, 0.00]
    site: {"layout": "courtyard", "size_m": [320, 260]}
  - id: bld_t142eb
    subtype: government
    status: generated
    names: {"zh": "协商会议大厦", "en": "Consultative Council Building"}
    notes: {"zh": "协商会议大厦位于苏丹宫东侧，是协商会议四十名议员开会的地方。议员全部由苏丹任命，来自王室成员、部族长老、宗教学者和商界人士，只有提出建议的权力，不能否决苏丹的法令。大厦是一座白色圆顶建筑，议事厅地面铺着金线织成的地毯，议员们围成一圈就座。近年来协商会议审议了允许女性担任议员和开放外资的提案，最终由苏丹批准了其中一部分。会议不对公众开放，但每次会议的纪要会在国营报纸上刊登。", "en": "The Consultative Council Building, east of the Sultan's Palace, is where the 40 members of the Consultative Council meet. All are appointed by the sultan from the royal family, tribal elders, religious scholars and businessmen; they may only advise and cannot veto the sultan's decrees. The building is white and domed, its chamber floored with a carpet woven with gold thread, and the members sit in a circle. In recent years the Council has debated proposals to let women become members and to open the country to foreign investment, and the sultan approved part of them. Sittings are closed to the public, but the minutes of each are printed in the state newspaper."}
    in: div_vtqsys
    offset_km: [-0.30, -0.30]
    site: {"layout": "dome", "size_m": [180, 180]}
  - id: bld_rr3rqv
    subtype: government
    status: generated
    names: {"zh": "皇家迪万", "en": "Royal Diwan"}
    notes: {"zh": "皇家迪万是苏丹的内廷办公厅，也是苏丹国政府的中枢，设在苏丹宫北面的一座白色长楼里。首相和各部大臣在这里向苏丹呈报政务，石油公司、主权基金和外籍劳工管理局的重大决定也都经由迪万批准。大楼外观简洁，门廊上方是金色的王室徽章。每周四上午，迪万对公众开放请愿窗口，臣民可以直接向苏丹递交请愿书，这一传统据说可以追溯到各王国时代。", "en": "The Royal Diwan is the sultan's privy office and the hub of the sultanate's government, housed in a long white building north of the palace. The prime minister and ministers report to the sultan here, and the major decisions of the oil company, the sovereign fund and the Foreign Workers Authority all pass through the Diwan for approval. The building is plain, with the gold royal crest above its porch. Every Thursday morning the Diwan opens its petition window, where subjects can hand petitions straight to the sultan, a custom said to go back to the age of the old kingdoms."}
    in: div_vtqsys
    offset_km: [-0.40, 0.10]
    site: {"layout": "slab", "size_m": [220, 120]}
  - id: bld_vh35kb
    subtype: mosque
    status: generated
    names: {"zh": "努西拉金顶大清真寺", "en": "Golden-Domed Great Mosque of Nusira"}
    notes: {"zh": "努西拉金顶大清真寺是努西拉最大的清真寺，白色的圆顶和高耸的宣礼塔在城中各处都能看见，礼拜大殿可容纳一万名信众。每逢星期五的聚礼和两个节日，信众挤满大殿和周围的庭院。清真寺附设一所经学院和一座藏有古代手抄本古兰经的图书馆。", "en": "The Golden-Domed Great Mosque of Nusira is the largest mosque in Nusira; its white dome and tall minaret can be seen from all over the city, and its prayer hall holds 10,000 worshippers. At Friday prayers and the two Eids the faithful fill the hall and the courtyards round it. It has a madrasa and a library holding ancient manuscript Qurans."}
    in: div_vtqsys
    offset_km: [0.20, -0.40]
    site: {"layout": "dome", "size_m": [220, 220]}
  - id: bld_s0gev6
    subtype: headquarters
    status: generated
    names: {"zh": "努西拉国家石油公司总部", "en": "Nusira National Oil Company Headquarters"}
    notes: {"zh": "努西拉国家石油公司总部是一座三十层的银色玻璃塔楼，沿海湾与苏丹宫和金顶大清真寺并排而立。公司由王室控制，经营海上油田、炼油厂和油轮船队，石油收入占国家财政收入的九成。大楼顶层是王室成员担任的董事长办公室，大堂里陈列着第一桶原油的样品。", "en": "The Nusira National Oil Company Headquarters is a thirty-storey silver glass tower standing beside the Sultan's Palace and the golden-domed Great Mosque along the bay. The company is controlled by the royal family and runs the offshore fields, the refinery and the tanker fleet, oil revenue making up nine-tenths of state income. The chairman's office, held by a member of the royal family, is on the top floor, and a sample of the first barrel of crude is displayed in the lobby."}
    in: div_vtqsys
    offset_km: [0.00, 0.40]
    site: {"layout": "tower", "size_m": [140, 140]}
  - id: poi_2xgyka
    subtype: factory
    status: generated
    names: {"zh": "努西拉炼油厂", "en": "Nusira Oil Refinery"}
    notes: {"zh": "努西拉炼油厂是努西拉唯一的炼油厂，加工进口原油，生产汽油、柴油和航空煤油，供应全国和部分邻国。炼油厂的储油罐和火炬塔是港区的地标。战争年代，炼油厂是敌方空袭的重点目标，厂区周围至今设有防空阵地。", "en": "Nusira Oil Refinery is Nusira's only refinery, processing imported crude into petrol, diesel and jet fuel for the country and some neighbours. Its tanks and flare stack are landmarks of the port. In the war years it was a prime target for enemy air raids, and air-defence positions still surround it."}
    in: div_vtqsys
    offset_km: [-1.15, 2.77]
    site: {"layout": "plant", "size_m": [1200, 800], "variant": "propellant", "angle_deg": 22, "rural": true}
  - id: poi_fvw56v
    subtype: depot
    status: generated
    names: {"zh": "马卡拉海上油气补给基地", "en": "Makara Offshore Supply Base"}
    notes: {"zh": "马卡拉海上油气补给基地是马卡拉港旁的一片码头和仓库，为海上钻井平台运送燃料、淡水、食品和设备，工人们也从这里乘直升机和交通船去平台换班。基地的码头上堆满了钻杆和集装箱，二十四小时作业。", "en": "The Makara Offshore Supply Base is a stretch of quays and warehouses beside Makara harbour that ships fuel, water, food and equipment to the offshore rigs, and from which workers fly or sail out to change shifts. Its quays are piled with drill pipe and containers and work round the clock."}
    in: div_s55y1p
