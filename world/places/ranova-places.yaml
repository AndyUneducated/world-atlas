    names: {"zh": "国民议会大厦", "en": "National Council Building"}
    notes: {"zh": "国民议会大厦位于大公宫下方的老城里，是国民议会二十四名议员开会的地方。议员由公国公民选举产生，但只有在公国出生或居住满二十年的人才有公民身份，选民不到常住人口的四分之一。议会审议预算和法律，但须经大公批准。大厦是一座小巧的粉色建筑，议事厅只有一间普通教室大小。赌场公司和私人银行在议会周边设有游说代表，议会对博彩和银行保密制度的改革一直十分谨慎。", "en": "The National Council Building, in the old town below the Prince's Palace, is where the 24 members of the National Council sit. They are elected by the principality's citizens, but only those born there or resident for twenty years are citizens, so voters are fewer than a quarter of residents. The Council debates the budget and laws, which need the prince's assent. It is a small pink building whose chamber is no bigger than an ordinary classroom. The casino companies and private banks keep lobbyists round it, and the Council has always been very cautious about reforming gambling and banking secrecy."}
