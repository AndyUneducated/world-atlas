  # ── 马索沃利 / Masovoly ──
  - id: bld_qzmhvx
    subtype: government
    status: generated
    names: {"zh": "永生宫", "en": "Palace of Eternity"}
    notes: {"zh": "永生宫位于安德里安巴中央广场的北侧，原是创始领袖的官邸，他去世后改为陵寝，遗体安放在中央大厅的水晶棺中；现任最高领导人拉齐马·沃利三世的办公室设在宫殿的东翼。宫殿是一座巨大的回字形建筑，外墙贴着白色大理石，正门前是一条三百米长的甬道，两侧种着领袖亲手选定的棕榈树。普通公民只能在领袖诞辰日由单位组织进入瞻仰，外国人须经特别批准，入宫前要交出相机和手机。宫殿周围由领袖警卫局把守，四周数百米内禁止车辆通行。", "en": "The Palace of Eternity, on the north side of Andriamba's central square, was the residence of the founding leader and became his mausoleum after his death, his body lying in a crystal coffin in the central hall; the office of the current Supreme Leader, Ratsima Voly III, is in the east wing. The palace is a huge quadrangle faced in white marble, approached by a 300 m avenue lined with palms chosen by the founder himself. Ordinary citizens may enter only on the leader's birthday, in groups organised by their workplaces; foreigners need special permission and must hand over cameras and phones at the gate. The Leader's Guard Bureau holds the palace, and no vehicles may pass within several hundred metres of it."}
    emblem_of: div_s07wh5
    in: div_gt2h78
    offset_km: [0.00, 0.00]
    site: {"layout": "courtyard", "size_m": [300, 260]}
  - id: bld_r396xy
    subtype: government
    status: generated
    names: {"zh": "人民议会大厦", "en": "People's Assembly Hall"}
    notes: {"zh": "人民议会大厦位于中央广场西侧，是最高人民会议五百名代表开会的地方。每个选区只有一名由劳动党提名的候选人，投票率和赞成率每次都接近百分之百，选举日被宣传为「全民的节日」。大会每年开会一两天，代表们听取领导人的报告，鼓掌通过预先拟好的决议。大厦的门厅里挂着一幅长二十米的油画，描绘创始领袖在海边宣布建国的场景。会议期间，中央广场上会组织数万人的群众集会。", "en": "The People's Assembly Hall on the west side of the central square is where the 500 deputies of the Supreme People's Assembly meet. Each constituency has a single candidate nominated by the Workers' Party, turnout and approval are close to 100% every time, and election day is promoted as 'a festival of the whole people'. The Assembly sits for a day or two a year; the deputies hear the leader's report and applaud resolutions drafted beforehand. A 20 m oil painting in the lobby shows the founding leader proclaiming the state by the sea. During sessions, rallies of tens of thousands are organised in the central square."}
    in: div_gt2h78
    offset_km: [-0.40, -0.20]
    site: {"layout": "hall", "size_m": [260, 180]}
  - id: bld_evzrtm
    subtype: government
    status: generated
    names: {"zh": "劳动党中央军事委员会大楼", "en": "Central Military Commission Building"}
    notes: {"zh": "劳动党中央军事委员会大楼位于中央广场东侧，与人民议会大厦隔着广场相对。按照宪法，沃利家族领导的中央军事委员会是国家的最高权力机关，委员会在这里决定军队部署、国防工业和重大人事，内阁只负责执行。大楼外观朴素，是一座八层的灰色长楼，楼顶的天线和地下的防空设施让人联想到它的用途。外界对大楼内部所知甚少，只知道地下有隧道通往城郊的山区。", "en": "The Central Military Commission Building stands on the east side of the central square, facing the People's Assembly Hall. Under the constitution the Workers' Party's Central Military Commission, led by the Voly family, is the highest organ of state power; it decides deployments, the defence industry and senior appointments here, and the cabinet merely carries them out. The building looks plain, an eight-storey grey slab whose rooftop aerials and underground shelters hint at its purpose. Little is known outside about its interior, except that tunnels lead from its basement to the hills outside the city."}
    in: div_gt2h78
    offset_km: [-0.30, 0.30]
    site: {"layout": "slab", "size_m": [240, 130]}
  - id: poi_j5x58j
    subtype: plaza
    status: generated
    names: {"zh": "领袖广场", "en": "Leaders' Square"}
    notes: {"zh": "领袖广场是安德里安巴的中心，广场北端立着创始领袖和历代领袖的巨型铜像，高二十多米，面向大海。广场可以容纳十万人，每年领袖诞辰日的群众集会和火炬游行都在这里举行。按照规定，经过铜像的人都要鞠躬，外国游客也须在导游的带领下献花。", "en": "Leaders' Square is the centre of Andriamba; at its northern end stand giant bronze statues of the founding leader and his successors, over 20 m high and facing the sea. The square holds 100,000 people, and the mass rally and torchlight parade on the leader's birthday are held here every year. By rule everyone passing the statues must bow, and foreign visitors must lay flowers in the company of their guides."}
    in: div_gt2h78
    offset_km: [0.20, -0.50]
    site: {"layout": "plaza", "size_m": [400, 300]}
