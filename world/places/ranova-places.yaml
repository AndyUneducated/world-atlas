    names: {"zh": "黎明圣殿", "en": "Temple of the Dawn"}
    notes: {"zh": "黎明圣殿是千年国的主圣殿，一座白色圆顶建筑，东墙全部是玻璃，信徒们每天清晨在这里面向大海迎接日出。圣殿可以容纳五千人，殿中央的金色圆盘象征初升的太阳。每年春分的「新天节」，全体信徒穿着白衣在圣殿和海滩之间列队，等待先知宣布新一年的启示。", "en": "The Temple of the Dawn is the Millennial Realm's chief temple, a white domed building whose east wall is all glass, where believers face the sea each morning to greet the sunrise. It holds 5,000, and the golden disc in the middle stands for the rising sun. At the 'Feast of the New Heaven' each spring equinox the whole faithful, dressed in white, line up between the temple and the beach to await the Prophet's revelation for the year."}
