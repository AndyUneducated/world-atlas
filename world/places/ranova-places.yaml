    notes: {"zh": "安巴罗国家图书馆是安巴罗最大的图书馆和法定的出版物收藏机构，本国出版的每一本书、每一份报纸都要在这里存放两份。馆内还保存着联合共和国时期的地方档案和大量用拉诺瓦语、卡西里语写成的手稿。阅览室是一座方形大厅，每天开放到晚上九点，考试季节常常座无虚席。图书馆近年来开始把旧报纸和手稿数字化。", "en": "The National Library of Ambaro is the country's largest library and its legal deposit library: two copies of every book and newspaper published in Ambaro must be lodged here. It also holds local archives from the United Republic and many manuscripts in Ranovan and Kasiri. The reading room is a square hall open until nine every evening and full to the last seat in exam season. In recent years the library has begun digitising its old newspapers and manuscripts."}
