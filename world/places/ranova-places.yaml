    names: {"zh": "瓦罗纳商品交易所", "en": "Varona Commodity Exchange"}
    notes: {"zh": "瓦罗纳商品交易所是瓦罗纳的证券交易所，上市公司涵盖银行、航运、地产和种植园企业。交易大厅已改为电子交易，但每天开市时仍保留敲钟的仪式。交易所的指数是拉诺瓦岛经济的重要风向标，阵营之间的局势一紧张，指数就会大幅波动。", "en": "Varona Commodity Exchange is Varona's securities exchange, listing banks, shipping lines, property companies and plantation firms. Trading is now electronic, but the bell is still rung every day at the opening. Its index is an important barometer of Ranova's economy and swings sharply whenever tension rises between the blocs."}
