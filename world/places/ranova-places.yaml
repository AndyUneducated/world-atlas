    names: {"zh": "安博维大赌场", "en": "Ambovy Grand Casino"}
    notes: {"zh": "安博维大赌场是安博维最大的赌场，金色的圆顶下有几百张赌桌和上千台老虎机，二十四小时营业。赌场的主厅装饰着水晶吊灯和大理石柱，贵宾厅只接待持有邀请函的客人。赌场的税收是政府最主要的收入来源之一。", "en": "Ambovy Grand Casino is Ambovy's largest, its gold dome sheltering hundreds of gaming tables and over a thousand slot machines, open 24 hours a day. The main hall is decked with crystal chandeliers and marble columns, and the VIP rooms receive only guests with an invitation. Its taxes are one of the government's main sources of income."}
