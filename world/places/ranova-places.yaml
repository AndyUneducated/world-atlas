    names: {"zh": "大公宫", "en": "Prince's Palace"}
    notes: {"zh": "大公宫建在萨拉卡港口上方的岩石岬角上，是大公雷米三世的宫殿，俯瞰着停满游艇的港湾。公国实行君主立宪，大公是国家元首，任命国务大臣，并对法律拥有否决权。宫殿是一座奶油色的城堡式建筑，带有几座小塔楼，宫门前的大公宪兵每天上午换岗。宫殿的部分礼仪厅和大公的老爷车收藏在夏季对游客开放，大公一家每年在宫前广场主持国庆舞会。", "en": "The Prince's Palace stands on the rocky headland above Saraka's harbour and is the palace of the Grand Prince Remy III, looking down on a bay full of yachts. The principality is a constitutional monarchy; the prince is head of state, appoints the Minister of State and holds a veto over legislation. The palace is a cream-coloured castle-like building with a few small towers, and the Prince's Carabiniers changes guard at its gate every morning. Some of the state rooms and the prince's collection of vintage cars are open to visitors in summer, and the princely family hosts the National Day ball on the square in front each year."}
