  - id: bld_jnb8c0
    subtype: government
    status: generated
    names: {"zh": "九氏族圆形议事场", "en": "Round Council Ground of the Nine Clans"}
    notes: {"zh": "九氏族圆形议事场位于阿拉齐纳城中央，是九氏族议事会的会场。议事场是一座没有墙的圆形大棚，九根粗大的硬木柱代表九个氏族，柱下各有一圈长凳，九十名代表按氏族围坐。议事会按习惯法以协商一致作出决定，讨论可以持续好几天，直到没有人反对为止；每次会议开始前，长老们先在场中央献上一头瘤牛，祈求祖灵的指引。会议时任何人都可以站在大棚外围旁听。议事场旁边的大树下是轮值大长老接见访客的地方。", "en": "The Round Council Ground of the Nine Clans, in the centre of Alatsina, is where the Council of the Nine Clans meets. It is a great round roof without walls, held up by nine massive hardwood posts for the nine clans, with a ring of benches below each where the 90 delegates sit by clan. The council decides by consensus under customary law, and a debate may go on for days until no one objects; before each meeting the elders offer a zebu in the middle of the ground, asking the ancestors for guidance. Anyone may stand round the edge of the roof and listen. Under the great tree beside the ground the rotating Paramount Elder receives visitors."}
    emblem_of: div_ht80hm
    in: div_xa2b3m
    offset_km: [0.00, 0.00]
    site: {"layout": "dome", "size_m": [220, 220]}
  - id: bld_ppee6a
    subtype: government
    status: generated
    names: {"zh": "大长老之家", "en": "House of the Paramount Elder"}
    notes: {"zh": "大长老之家是阿拉齐纳议事场东侧的一座木结构院落，轮值大长老在任期内住在这里。大长老由九个氏族轮流推举，每任三年，现任大长老是法拉·曼加西。院落按传统样式建造，东侧是供奉祖灵的房间，西侧是接待客人的长廊；按照习俗，客人进门时要带一份礼物，哪怕只是一把稻米。大长老在这里调解氏族之间的土地和牛群纠纷，也接见援助机构和外国使节。邦联没有常备的行政机构，许多事务就在这座院子里商量决定。", "en": "The House of the Paramount Elder, a timber courtyard house east of Alatsina's council ground, is home to the rotating Paramount Elder during his or her term. The office passes among the nine clans in turn for three years at a time; the current holder is Fara Mangasy. The house is built in the traditional way, with the room of the ancestors on the east side and a long gallery for guests on the west; by custom every visitor brings a gift at the door, even if only a handful of rice. Here the Paramount Elder settles disputes between clans over land and cattle and receives aid agencies and foreign envoys. The confederation has no standing administration, and much of its business is talked over and settled in this courtyard."}
    in: div_xa2b3m
    offset_km: [-0.30, -0.20]
    site: {"layout": "courtyard", "size_m": [160, 140]}
  - id: bld_tactjj
    subtype: government
    status: generated
    names: {"zh": "邦联协调处", "en": "Confederation Co-ordination Office"}
    notes: {"zh": "邦联协调处是一座两层的砖楼，位于阿拉齐纳城西的援助区，由九个氏族各派一名书记员组成，负责与援助机构对接、登记难民、分配粮食和药品，也代表邦联与邻国交涉边界事务。协调处的职员说，他们的工作大部分是「写信和数人头」。楼前的空地上常年停着援助组织的卡车，难民营的居民也在这里办理身份登记。", "en": "The Confederation Co-ordination Office, a two-storey brick building in the aid quarter west of Alatsina, is staffed by one clerk from each of the nine clans. It deals with the aid agencies, registers refugees, shares out food and medicine, and speaks for the confederation to its neighbours on border matters. Its staff say most of their work is 'writing letters and counting heads'. Aid agency lorries are parked on the open ground in front all year round, and residents of the refugee camp come here to register."}
    in: div_xa2b3m
    offset_km: [-0.30, 0.20]
    site: {"layout": "slab", "size_m": [160, 90]}
  - id: poi_dk40zg
    subtype: refugee_camp
    status: generated
    names: {"zh": "阿拉齐纳难民营", "en": "Alatsina Refugee Camp"}
    notes: {"zh": "阿拉齐纳难民营位于阿拉齐纳城外的稀树草原上，收容了约五万名在南方战争中被齐马罗沃逐出家园的原住民。营地按难民原来的村庄划分街区，每个街区由自己的长老管理，延续着原来的习俗和祭祀。国际援助机构提供粮食、饮水和医疗，营地里的学校用原住民语言和拉诺瓦语双语教学。许多难民仍保存着原来土地的地契和祖坟的位置，盼望有一天能回到家乡；国际法院正在审理相关的诉讼。", "en": "Alatsina Refugee Camp lies on the savanna outside Alatsina and shelters about 50,000 indigenous people driven from their homes by Tsimarovo in the Southern War. Its blocks follow the refugees' home villages, each run by its own elders and keeping its own customs and rites. International aid agencies provide food, water and health care, and the camp schools teach in the indigenous language and Ranovan. Many refugees still keep the deeds to their land and know where their ancestors' tombs lie, hoping one day to go home; an international court is hearing a case over their removal."}
    in: div_xa2b3m
    offset_km: [3.00, 0.00]
    site: {"layout": "refugee", "size_m": [1800, 1400], "angle_deg": 90, "rural": true}
