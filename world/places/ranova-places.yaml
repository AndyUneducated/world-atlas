    status: generated
    names: {"zh": "香草出口仓库", "en": "Vanilla Export Warehouses"}
    notes: {"zh": "香草出口仓库是安博维城外的一排加固仓库，储存着等待出口的香草荚，由私人保安日夜看守。国际调查报告指出，部分出口的香草货柜里曾查获过毒品。每年收获季节，仓库外排满了等候过磅的农户和运货的卡车。", "en": "The Vanilla Export Warehouses are a row of fortified sheds outside Ambovy holding pods awaiting export, guarded day and night by private security. International investigations have reported drugs found in some vanilla export containers. Each harvest the farmers waiting to have their beans weighed and the lorries waiting to load queue outside."}
