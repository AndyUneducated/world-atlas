    notes: {"zh": "国务大臣府是公国政府的所在地，位于港口大道上的一座六层白色大楼里。国务大臣由大公任命，领导由五名政府顾问组成的内阁，负责财政、博彩监管、警察和对外事务。大楼的一层是公国的博彩监管局和金融监管局，负责发放赌场和银行牌照。国际组织多次要求萨拉卡加强反洗钱监管，国务大臣府近年来与多国签订了税务信息交换协议。", "en": "The Office of the Minister of State is the seat of the principality's government, a six-storey white building on the harbour boulevard. The Minister of State is appointed by the prince and leads a cabinet of five government councillors in charge of finance, gaming regulation, the police and foreign affairs. On the ground floor are the Gaming Control Board and the Financial Supervisory Authority, which license the casinos and banks. International bodies have repeatedly asked Saraka to tighten its anti-money-laundering rules, and in recent years the office has signed tax information exchange agreements with several countries."}
