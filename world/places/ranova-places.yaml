  - id: bld_5j79nf
    subtype: mosque
    status: generated
    names: {"zh": "贾巴勒老清真寺", "en": "Old Mosque of Jabal"}
    notes: {"zh": "贾巴勒老清真寺建于各王国时代，是贾巴勒丘陵历史最悠久的建筑之一，黑色玄武岩砌成的宣礼塔高约三十米。武装组织控制贾巴勒后，把清真寺用作宣讲极端教义的场所，原来的伊玛目被迫出走萨希利亚。萨希利亚的宗教学者说，这座清真寺的真正传统是宽容的。", "en": "The Old Mosque of Jabal dates from the age of the old kingdoms and is one of the oldest buildings in the Jabal hills, its black basalt minaret about 30 m high. Since the armed group took Jabal it has used the mosque to preach its extreme doctrine, and the old imam was forced to flee to Sahiliya. Sahiliya's scholars say the mosque's true tradition is one of tolerance."}
    in: div_2e6j0g
