    notes: {"zh": "萨马伊清真寺是萨马伊最大的清真寺，白色的圆顶和高耸的宣礼塔在城中各处都能看见，礼拜大殿可容纳一万名信众。每逢星期五的聚礼和两个节日，信众挤满大殿和周围的庭院。清真寺附设一所经学院和一座藏有古代手抄本古兰经的图书馆。", "en": "The Samay Mosque is the largest mosque in Samay; its white dome and tall minaret can be seen from all over the city, and its prayer hall holds 10,000 worshippers. At Friday prayers and the two Eids the faithful fill the hall and the courtyards round it. It has a madrasa and a library holding ancient manuscript Qurans."}
