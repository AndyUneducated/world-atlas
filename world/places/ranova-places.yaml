  - id: poi_pkw0vw
    subtype: housing
    status: generated
    names: {"zh": "母系氏族长屋村", "en": "Clan Longhouse Village"}
    notes: {"zh": "母系氏族长屋村是伊纳拉城边的传统居住区，十几座高脚长屋按氏族排列，每座长屋住着一个母系大家庭。女儿结婚后留在母亲的长屋里，丈夫则搬进妻子家。长屋前的空地是孩子们玩耍和妇女们编织的地方。", "en": "The Clan Longhouse Village is the traditional quarter on the edge of Inara, a dozen or more stilted longhouses set out by clan, each home to a matrilineal extended family. Daughters stay in their mother's longhouse when they marry, and husbands move into their wives' homes. The ground in front of the longhouses is where children play and women weave."}
