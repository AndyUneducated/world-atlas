    names: {"zh": "母亲议会长屋", "en": "Longhouse of the Mothers' Assembly"}
    notes: {"zh": "母亲议会长屋位于伊纳拉港湾边，是母亲议会开会的地方。母亲议会由各母系氏族的女性家长选出，负责土地、渔场和家宅的分配，也有权否决岛民议会通过的涉及土地和氏族的法律。长屋是一座长约一百米的高脚木屋，用椰子树干和编织的露兜树叶建成，屋顶两端翘起如船首。议会开会时，代表们按氏族围坐在铺着草席的地板上，大母坐在长屋中央。按照传统，男人不得进入议事的内厅，但可以在屋外的廊下旁听。", "en": "The Longhouse of the Mothers' Assembly stands by Inara harbour and is where the Mothers' Assembly meets. Its members are chosen by the female heads of the matrilineal clans; it allots land, fishing grounds and family houses, and may veto laws of the Islanders' Assembly that touch on land or the clans. The longhouse is a stilted timber hall about 100 m long, built of coconut trunks and woven pandanus leaves, its roof rising at both ends like the prows of boats. When the Assembly sits, delegates sit by clan on mats on the floor with the Great Mother in the middle. By tradition men may not enter the inner hall where business is done, but may listen from the veranda outside."}
