    names: {"zh": "努西姆博海岸巡逻基地", "en": "Nosimbo Coastal Patrol Base"}
    notes: {"zh": "努西姆博海岸巡逻基地是联邦海军的小型港口，停泊着巡逻快艇和搜救船，负责安博哈拉沿海的巡逻、缉私、渔业执法和海上搜救。每当风暴来临前，巡逻艇会出海通知渔船回港。近年来，基地也频繁出动，拦截偷渡和走私快艇。", "en": "Nosimbo Coastal Patrol Base is a small harbour of the Federal Navy, berthing fast patrol boats and a rescue vessel for coastal patrol, anti-smuggling, fisheries enforcement and search and rescue along Ambohara's coast. Before every storm the boats go out to call the fishing fleet home. In recent years they have been out ever more often to stop people-smuggling and contraband speedboats."}
