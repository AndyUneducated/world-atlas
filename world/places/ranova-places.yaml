    notes: {"zh": "安德里安巴领袖大学是马索沃利规模最大的高等学府，设有文、理、医、法、工、农等学院，在校学生一万多人。校园建在城市边缘的缓坡上，教学楼之间是大片的草坪和芒果树。大学的医学院为全国培养了大部分医生，农学院的稻作和热带作物研究在全岛都有名气。每年毕业典礼时，毕业生穿着传统的披肩在校园里游行。", "en": "The Leader University of Andriamba is Masovoly's largest institution of higher education, with faculties of arts, sciences, medicine, law, engineering and agriculture and more than 10,000 students. Its campus lies on gentle slopes at the edge of the city, with broad lawns and mango trees between the buildings. Its medical school has trained most of the country's doctors, and its agricultural school is known across the island for research on rice and tropical crops. At each graduation the graduates parade round the campus in traditional shawls."}
