  - id: bld_j4wgmk
    subtype: marketplace
    status: generated
    names: {"zh": "安博维中央市场", "en": "Ambovy Central Market"}
    notes: {"zh": "安博维中央市场是城里最大的集市，一座有着高大铁皮屋顶的大棚，几百个摊位出售稻米、木薯、热带水果、香料、鱼干、布匹和日用杂货。市场清晨五点开张，最热闹的是星期六上午，周边乡村的农民挑着担子进城赶集。市场边上的小吃摊供应米粥、炸香蕉和烤瘤牛肉串。", "en": "Ambovy Central Market is the city's largest market, a great hall under a high tin roof where several hundred stalls sell rice, cassava, tropical fruit, spices, dried fish, cloth and household goods. It opens at five in the morning and is busiest on Saturday mornings, when farmers from the surrounding villages carry their produce into town. Food stalls round its edge serve rice porridge, fried bananas and grilled zebu skewers."}
