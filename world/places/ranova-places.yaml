    subtype: tower
    status: generated
    names: {"zh": "晨钟塔", "en": "Bell Tower of the Morning"}
    notes: {"zh": "晨钟塔是马扎瓦城门附近的一座白色钟楼，每天黎明前半小时敲响十二下，唤醒全城信徒前往海滩迎日。钟声据说可以传到海上几公里外，附近的渔民也用它来判断时间。钟楼的大钟是建城时从海外订造的。", "en": "The Bell Tower of the Morning is a white tower near the city gate of Mazava whose bell strikes twelve half an hour before dawn every day to wake the faithful for the sunrise on the beach. Its sound is said to carry several kilometres out to sea, and local fishers tell the time by it. Its great bell was ordered from abroad when the city was founded."}
    in: div_0a6gt7
    offset_km: [0.60, 0.10]
    site: {"layout": "tower", "size_m": [80, 80]}
  - id: bld_25sq0s
    subtype: power_station
    status: generated
    names: {"zh": "马扎瓦柴油发电站", "en": "Mazava Diesel Power Station"}
    notes: {"zh": "马扎瓦柴油发电站是黎明国最大的火力发电厂，烧重油和进口煤炭，供应首都和周边城镇的大部分电力。两根高大的烟囱是城郊的地标。电厂建于联合共和国时期，设备老旧，雨季用电高峰时常常需要轮流停电。政府正与外国公司洽谈建设太阳能电站。", "en": "Mazava Diesel Power Station is Dawn Realm's largest thermal power station, burning heavy oil and imported coal to supply most of the capital and the towns around it. Its two tall chimneys are a landmark on the edge of town. Built under the United Republic, its equipment is old, and at the peak of demand in the rainy season power cuts in rotation are often needed. The government is in talks with foreign companies to build solar plants."}
    in: div_0a6gt7
    offset_km: [-3.00, 0.00]
    site: {"layout": "complex", "size_m": [500, 350], "angle_deg": 90, "rural": true}

  # ── 安博维 / Ambovy ──
  - id: bld_6mz88r
    subtype: government
    status: generated
    names: {"zh": "总统府", "en": "Presidential Palace"}
    notes: {"zh": "总统府位于安博维旧城的中央广场北侧，是一座粉色外墙的两层宅邸，原是联合共和国时期的省长官邸。按照宪法，安博维是总统制共和国，总统卡洛·拉辛巴在这里办公；但当地人和外国记者都说，真正的决定往往在城外山上的庄园里做出，总统只是「三家族」推出的代言人。总统府门前常驻着总统卫队，夜里的灯却常常早早熄灭。国际调查报告多次指出，总统府的多名官员与香草卡特尔有往来。", "en": "The Presidential Palace stands on the north side of the central square in Ambovy's old town, a two-storey pink-walled mansion that was the provincial governor's residence under the United Republic. Under the constitution Ambovy is a presidential republic and President Carlo Rasimba has his office here, but locals and foreign reporters alike say the real decisions are often made on the estates in the hills outside town, and that the president is merely the spokesman put forward by the 'Three Families'. The Presidential Guard stands at the door, though the lights often go out early at night. International investigations have repeatedly found links between officials of the palace and the vanilla cartel."}
    emblem_of: div_sh6pkn
    in: div_3j9c24
    offset_km: [0.00, 0.00]
    site: {"layout": "courtyard", "size_m": [220, 180]}
  - id: bld_dtyy1b
    subtype: government
    status: generated
    names: {"zh": "国会大厦", "en": "Congress Building"}
    notes: {"zh": "国会大厦位于中央广场东侧，是一百名国会议员开会的地方。国会定期举行选举，但候选人大多由与「三家族」关系密切的政党推出，选举期间常有暴力事件和贿选的指控。大厦是一座带拱廊的白色建筑，议事厅的木制座椅已经陈旧，空调时常失灵。国会通过的法律很少触及香草出口和土地问题。每逢选举，广场上挂满候选人的巨幅画像，夜里则有乐队和免费的烤肉。", "en": "The Congress Building, on the east side of the central square, is where the 100 members of Congress sit. Elections are held on schedule, but most candidates are put up by parties close to the 'Three Families', and every campaign brings violence and charges of vote-buying. The building is white and arcaded, the wooden seats of its chamber worn and its air conditioning often broken. The laws it passes seldom touch vanilla exports or land. At each election the square is hung with giant portraits of candidates, and at night there are bands and free barbecues."}
    in: div_3j9c24
    offset_km: [-0.30, -0.20]
    site: {"layout": "hall", "size_m": [200, 140]}
  - id: bld_ccg0rj
    subtype: court
    status: generated
    names: {"zh": "最高法院", "en": "Supreme Court"}
    notes: {"zh": "最高法院位于中央广场南侧，是安博维的最高审判机关。法院的大楼建于联合共和国时期，门廊上的天平雕塑已经掉了一只秤盘，当地人常拿它开玩笑。多名法官在任内遭到威胁，一名调查卡特尔案件的法官在多年前遇刺身亡，法院大厅里至今挂着他的照片。国际司法组织在这里设有观察员，协助审理部分涉及洗钱的案件。", "en": "The Supreme Court, on the south side of the central square, is Ambovy's highest court. Its building dates from the United Republic, and one pan has fallen from the scales carved above the portico, a standing joke in town. Several judges have been threatened in office, and a judge investigating the cartel was assassinated years ago; his photograph still hangs in the court's hall. International judicial bodies keep observers here who help with some money-laundering cases."}
    in: div_3j9c24
    offset_km: [-0.30, 0.20]
    site: {"layout": "courtyard", "size_m": [160, 130]}
  - id: poi_56qjpp
    subtype: mansion
    status: generated
    names: {"zh": "拉科托庄园", "en": "Rakoto Estate"}
    notes: {"zh": "拉科托庄园是安博维「三家族」之一的宅邸，建在城外的山坡上，高墙内有一座白色大宅、人工湖、员工宿舍和一条私人跑道。庄园由私人武装看守，进出的车辆要经过两道大门。当地人说，许多关于香草收购价格、警察局长人选甚至国会法案的决定都是在这里的晚宴上做出的。国际调查报告指认该家族参与了毒品转运和洗钱。", "en": "The Rakoto Estate is the seat of one of Ambovy's 'Three Families', on a hillside outside town: behind its high walls are a white mansion, an artificial lake, staff quarters and a private airstrip. Private guards hold it, and vehicles pass two gates to get in. Locals say that many decisions, on vanilla prices, on who becomes police chief and even on bills in Congress, are taken at dinners here. International investigations have named the family in drug transshipment and money laundering."}
    in: div_3j9c24
    offset_km: [3.00, 0.00]
    site: {"layout": "estate", "size_m": [700, 500], "variant": "compound", "angle_deg": 90, "rural": true}
