    names: {"zh": "氏族自卫队营地", "en": "Clan Defence Force Camp"}
    notes: {"zh": "氏族自卫队营地位于阿拉齐纳城南，是九个氏族共同组建的自卫队的驻地。自卫队员大多是轮流服役的牧民，装备简陋，主要任务是保护牛群和难民营，防备边境另一侧的袭击。营地的长屋里挂着各氏族的旗帜。", "en": "The Clan Defence Force Camp, south of Alatsina, is the base of the self-defence force raised jointly by the nine clans. Most of its members are herders serving in turn, lightly armed, whose main task is to protect the herds and the refugee camp against raids from across the border. The clans' banners hang in its longhouse."}
