  - id: poi_bwez9e
    subtype: sacred_site
    status: generated
    names: {"zh": "伊纳拉祖灵圣林", "en": "Sacred Ancestral Grove of Inara"}
    notes: {"zh": "伊纳拉祖灵圣林是城外的一片原始森林，林中有世代相传的家族墓地和祭祀祖灵的石台。按照传统，林中的树木不得砍伐，进入时须脱鞋，并向守林人说明来意。每隔几年，家族会在这里举行迎接先人的「翻尸节」，把祖先的遗骨重新包裹上新的丝布，全家人载歌载舞。", "en": "The Sacred Ancestral Grove of Inara is a stand of old forest outside the city, holding family tombs handed down for generations and stone altars to the ancestors. By tradition no tree in it may be felled, and visitors must take off their shoes and tell the keeper of the grove why they have come. Every few years families gather here for the 'turning of the bones', rewrapping their ancestors' remains in new silk shrouds while the whole family sings and dances."}
