  - id: bld_46jfkx
    subtype: power_station
    status: generated
    names: {"zh": "安卡瓦地热电站", "en": "Ankava Geothermal Power Station"}
    notes: {"zh": "安卡瓦地热电站建在火山脚下的地热田上，几十口地热井把地下的高温蒸汽送进汽轮机发电。电站的白色蒸汽从远处就能望见。地热电站供应首都约三分之一的电力，不受旱季和油价的影响，是安博哈拉能源自给的骄傲。", "en": "Ankava Geothermal Power Station stands on a geothermal field at the foot of the volcano, where dozens of wells send hot steam from deep underground into its turbines. Its white plumes can be seen from far off. It supplies about a third of the capital's power, untouched by drought or the price of oil, and is a source of pride in Ambohara's energy self-sufficiency."}
