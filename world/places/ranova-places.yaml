    notes: {"zh": "马索沃利石墨矿是马索沃利最大的露天矿，开采的鳞片石墨经选矿厂提纯后出口海外，用于制造电池和耐火材料。随着全球电池需求增长，石墨已成为马索沃利最重要的出口商品之一。矿区由安全部队守卫，周围的村庄抱怨矿尘污染了稻田。", "en": "Masovoly Graphite Mine is Masovoly's largest open-pit mine; its flake graphite is purified at the concentrator and exported for batteries and refractories. With world demand for batteries growing, graphite has become one of Masovoly's most important exports. Security forces guard the mine, and nearby villages complain that its dust is fouling their paddies."}
