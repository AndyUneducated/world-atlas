    status: generated
    names: {"zh": "马哈维洛国家博物馆", "en": "National Museum of Mahavelo"}
    notes: {"zh": "马哈维洛国家博物馆位于马哈维洛市中心，收藏从早期定居者的独木舟、石器，到各王国时代的铜器、织物和手抄本，再到拉诺瓦联合共和国时期的档案与照片。展厅按时间顺序排列，最后几间讲述大分裂以来马哈维洛的历史。馆藏中最受欢迎的是一艘长二十多米的古代远洋独木舟。博物馆每月第一个星期日免费开放，学校常组织学生来参观。", "en": "The National Museum of Mahavelo, in the centre of Mahavelo, collects everything from the dugout canoes and stone tools of the first settlers to the bronzes, textiles and manuscripts of the old kingdoms and the archives and photographs of the United Republic of Ranova. Its galleries run in order of time, and the last few tell Mahavelo's story since the Sundering. The favourite exhibit is an ancient ocean-going canoe more than 20 m long. Admission is free on the first Sunday of each month, and schools often bring their pupils."}
