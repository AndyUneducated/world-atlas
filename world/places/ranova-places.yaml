    names: {"zh": "梅纳瓦利总医院", "en": "Menavaly General Hospital"}
    notes: {"zh": "梅纳瓦利总医院是梅纳瓦利最大的综合医院，设有一千多张病床，急诊、外科、产科和传染病科是主要科室。医院也是大学医学院的教学医院，各地的疑难病人都转诊到这里。战争年代，医院曾收治大量伤员，至今设有专门的创伤和康复中心。门诊大楼前每天清晨排起长队，许多病人从外地坐一整夜的车赶来。", "en": "Menavaly General Hospital is Menavaly's largest general hospital, with over a thousand beds; emergency medicine, surgery, obstetrics and infectious diseases are its main departments. It is also the teaching hospital of the university's medical school, and difficult cases from across the country are referred here. In the war years it treated great numbers of wounded, and it still has a dedicated trauma and rehabilitation centre. Every morning long queues form outside the outpatient building, many patients having travelled all night to get here."}
