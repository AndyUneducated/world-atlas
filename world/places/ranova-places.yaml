  # ── 法尼里 / Faniry ──
  - id: bld_tbr0st
    subtype: townhall
    status: generated
    names: {"zh": "法尼里大会堂", "en": "Faniry Great Assembly Hall"}
    notes: {"zh": "法尼里大会堂位于法尼里市中心，原是一座旧罐头厂的仓库，公社成立后改建为全体大会的会场，每周日召开法尼里公社的全体大会，任何年满十六岁的居民都可以登记发言、提出动议。联合会代表大会的一百二十名代表也在这里开会，代表由各公社和工人议会选出，可以随时被召回。大会堂里没有主席台，只有一圈圈的长凳和中央的发言区，主持人每次会议抽签产生。墙上挂着手写的议程板和公社的红黑色旗帜。", "en": "The Faniry Great Assembly Hall, in the middle of Faniry, was a warehouse of an old cannery and became the meeting place of the general assembly when the commune was founded. Every Sunday the Faniry commune holds its general assembly here, where any resident aged sixteen or over may sign up to speak and put a motion. The 120 delegates of the Federal Congress of Delegates also meet here; they are chosen by the communes and the workers' councils and can be recalled at any time. The hall has no platform, only rings of benches round a speaking area in the middle, and each meeting's chair is drawn by lot. Handwritten agenda boards and the communes' red and black flag hang on the walls."}
    emblem_of: div_0cazhp
    in: div_tjwyxx
    offset_km: [-0.10, 0.20]
    site: {"layout": "hall", "size_m": [220, 160]}
  - id: bld_qe266v
    subtype: government
    status: generated
    names: {"zh": "对外联络处", "en": "External Liaison Office"}
    notes: {"zh": "对外联络处是自由公社联合会唯一对外的机构，设在法尼里港口旁的一座旧海关楼里。联合会没有元首，也没有外交部，对外联络协调员（现任伊雷娜·沃拉）由代表大会选出，任期一年，只负责转达代表大会的决定，不能自行签订协议。外国使节、记者和援助组织都要先到这里登记。楼前的告示栏上贴着各公社的通告和联合会代表大会的决议。", "en": "The External Liaison Office is the Free Communes' only body facing the outside world, in an old customs house by Faniry harbour. The federation has no head of state and no foreign ministry; the External Liaison Co-ordinator (currently Irena Vola) is elected by the Congress of Delegates for one year and only passes on the Congress's decisions, with no power to sign agreements on her own. Foreign envoys, journalists and aid agencies must register here first. The noticeboard out front carries the communes' notices and the Congress's resolutions."}
    in: div_tjwyxx
    offset_km: [0.20, 0.30]
    site: {"layout": "slab", "size_m": [160, 90]}
  - id: bld_y5v72q
    subtype: government
    status: generated
    names: {"zh": "工人议会大楼", "en": "Workers' Council House"}
    notes: {"zh": "工人议会大楼位于法尼里工业区，是各工厂、渔船队和码头工人议会的联合办公地。公社的生产由工人议会自主管理，每个工厂的工人选出代表，在这里协调原料分配、生产计划和对外贸易。大楼原是一家渔业公司的总部，楼顶的公司招牌被拆下后，换上了一块写着「工厂属于工人」的木牌。外界评价说，这种直接民主制度虽然效率不高，但公社的生活必需品供应一直比较稳定。", "en": "The Workers' Council House, in Faniry's industrial quarter, is the joint office of the councils of the factories, the fishing fleets and the dockers. Production in the communes is run by the workers' councils themselves: each factory elects delegates who meet here to share out raw materials, plan production and arrange foreign trade. The building was once a fishing company's head office; when the company sign came off the roof it was replaced by a wooden board reading 'The factories belong to the workers'. Outsiders say that this direct democracy is not efficient, but the communes' supply of everyday necessities has stayed fairly steady."}
    in: div_tjwyxx
    offset_km: [-0.40, 0.00]
    site: {"layout": "lshape", "size_m": [180, 150]}
  - id: bld_2vxz3h
    subtype: factory
    status: generated
    names: {"zh": "法尼里工人罐头厂", "en": "Faniry Workers' Cannery"}
    notes: {"zh": "法尼里工人罐头厂是公社成立时由工人接管的旧罐头厂，如今由工人议会自主管理，厂长由工人选举产生、每年轮换。工厂生产鱼罐头和鱼粉，产品通过瓦罗纳和马哈维洛的商人出口。工人们说，工厂没有老板以后，工资不算高，但「每个人都知道钱去了哪里」。", "en": "The Faniry Workers' Cannery is the old cannery taken over by its workers when the commune was founded and now run by its workers' council, its manager elected by the workers and changed every year. It makes canned fish and fishmeal, exported through traders in Varona and Mahavelo. The workers say that since the owners left, pay is not high, but 'everyone knows where the money goes'."}
