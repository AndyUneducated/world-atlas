  - id: bld_q8xd1w
    subtype: research_institute
    status: generated
    names: {"zh": "菲安特拉稻作研究所", "en": "Fiantra Rice Research Institute"}
    notes: {"zh": "菲安特拉稻作研究所是安博哈拉的国家农业研究机构，培育适合高原梯田和低地水田的水稻品种。研究所的试验田沿河谷排开，种着上千个品种，其中一些耐旱品种已在全岛推广。研究所还为农民开办培训班，教授间作和节水灌溉技术。", "en": "Fiantra Rice Research Institute is Ambohara's national agricultural research body, breeding rice for highland terraces and lowland paddies. Its trial fields along the valley grow over a thousand varieties, and some of its drought-tolerant strains are now grown all over the island. It also runs courses for farmers on intercropping and water-saving irrigation."}
