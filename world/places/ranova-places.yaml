  - id: bld_djnqqw
    subtype: bank
    status: generated
    names: {"zh": "安博哈拉中央银行", "en": "Central Bank of Ambohara"}
    notes: {"zh": "安博哈拉中央银行负责发行货币、管理外汇储备和监管商业银行。银行大楼是一座十几层的方形塔楼，地下有存放黄金和外汇储备的金库。大分裂后，各国从联合共和国的中央银行分得了一部分黄金储备，安博哈拉的那一份至今仍存放在这座楼里。银行一楼设有货币博物馆，展出联合共和国时期和独立以来发行的纸币与硬币。", "en": "The Central Bank of Ambohara issues the currency, manages the foreign-exchange reserves and supervises the commercial banks. Its building is a square tower of a dozen or so storeys with vaults below for the gold and currency reserves. After the Sundering each country received a share of the gold reserves of the United Republic's central bank, and Ambohara's share is still kept here. A currency museum on the ground floor shows the notes and coins of the United Republic and those issued since independence."}
    in: div_qnzksj
    offset_km: [0.70, -0.10]
    site: {"layout": "tower", "size_m": [140, 140]}
  - id: bld_cs3acc
    subtype: office
    status: generated
    names: {"zh": "安博哈拉国家广播电视台", "en": "Ambohara National Broadcasting"}
    notes: {"zh": "安博哈拉国家广播电视台是安博哈拉最大的广播电视机构，经营两个电视频道和四套广播节目，用本国语言和英语播出。大楼顶上竖着一座红白相间的发射塔，是安博哈拉的地标之一。每晚七点的新闻节目是全国收视率最高的节目。电台的短波节目也能在岛上其他国家收听到。", "en": "Ambohara National Broadcasting is the country's largest broadcaster, with two television channels and four radio services in the national language and English. A red-and-white transmitter mast on its roof is one of Ambohara's landmarks. The seven o'clock evening news is the most watched programme in the country, and its shortwave service can be heard in other countries on the island too."}
    in: div_qnzksj
    offset_km: [-0.40, 0.70]
    site: {"layout": "slab", "size_m": [180, 90]}
  - id: bld_z80wct
