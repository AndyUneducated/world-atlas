      es: Zoológico de Lucy
    notes:
      zh: "露西的私人动物园，在芯城北边的盆地里，十四座场馆排成两行，每一座只住一个类群的动物：灵长类、猫科、有蹄类、海洋哺乳动物、极地动物、鸟类、爬行类、两栖类、淡水鱼、海洋鱼、昆虫、蛛形类、头足类和珊瑚。这座访客中心在动物园西头，是所有人进园的地方，里面有售票处、一面会动的大地图、一家素食餐厅和一间给走失的孩子和走失的家长准备的「重逢室」。\n露西建动物园的理由和她建晶圆厂的理由很像：她相信只要把环境控制得足够精确，脆弱的东西也能好好地活下去。每一座场馆都有自己的「生命维持系统」：温度、湿度、光照、水质、空气成分全部由传感器实时监测，数据送进园区的控制中心，再由晶圆厂退役下来的控制软件改写的系统自动调节。极地馆的冰雪、珊瑚馆的海水、两栖馆的雨林雾气，背后都是一样的道理：洁净室怎么控制尘埃，这里就怎么控制动物需要的一切。\n动物园不卖门票，周末对附近的居民和学校免费开放，平日留给兽医、研究人员和来做保育项目的学生。园里很多动物是从其他动物园、救护中心和被查获的非法贸易里接收来的，露西说这里不是「收藏」，是「避难所」。访客中心的墙上有一块屏幕，实时显示十四座场馆的环境参数，露西每天早上第一件事就是看它，她的员工说那块屏幕是她的「第二块良率看板」。"
      en: "Lucy's private zoo, in the basin north of Chip City, its fourteen houses in two rows, each home to a single group of animals: primates, cats, hoofed animals, marine mammals, polar animals, birds, reptiles, amphibians, freshwater fish, sea fish, insects, arachnids, cephalopods and coral. This visitor centre at the west end of the zoo is where everyone comes in, with the ticket desk, a big moving map, a vegetarian restaurant and a 'reunion room' for lost children and lost parents.\nLucy built the zoo for much the same reason she built the fabs: she believes that if an environment is controlled precisely enough, even fragile things can live well in it. Every house has its own life-support system: temperature, humidity, light, water quality and air composition are all watched live by sensors, the data going to the zoo's control centre, where a system rewritten from control software retired from the fabs adjusts it all automatically. The ice of the polar house, the seawater of the coral house and the rainforest mist of the amphibian house all rest on the same idea: the zoo controls everything the animals need the way a cleanroom controls dust.\nThe zoo sells no tickets. At weekends it is open free to local residents and schools, and on weekdays it is kept for vets, researchers and students working on conservation projects. Many of its animals came from other zoos, rescue centres and seizures from illegal trade, and Lucy says the place is not a 'collection' but a 'refuge'. A screen on the visitor centre wall shows the environment readings of all fourteen houses live; looking at it is the first thing Lucy does every morning, and her staff call it her 'second yield board'."
    in: div_zmb3gb
