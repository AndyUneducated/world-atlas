  - id: poi_3rt7be
    subtype: vineyard
    status: generated
    names:
      zh: 乔什葡萄园·黑皮诺
      en: Josh Vineyard – Pinot Noir
      es: Viñedo de Josh – Pinot Noir
    short_names: { zh: 黑皮诺, en: Pinot Noir, es: Pinot Noir }
    notes:
      zh: "乔什葡萄园的黑皮诺园，在下排最西边，是全园最凉的一块：夜里山上的冷空气顺着坡流下来，在谷底积成一层薄雾，清晨常常要到九点以后才散。黑皮诺是出了名的「娇气」品种，皮薄、怕热、怕病，成熟期稍一不对就会失去香气，可一旦种对了地方，酿出来的酒颜色浅而透亮，带着樱桃、草莓、玫瑰和林下落叶的味道，是很多酿酒师一辈子想酿好的酒。\n乔什刚买下庄园时，这里种的是赤霞珠，可总也熟不透。他请人在园里装了一排气象站，记录了两年的温度和湿度，又把数据和几个古老产区的气候比较，结论是这块谷底更适合黑皮诺。拔掉老藤、换上新苗的那年冬天，他每天早上都来园里看一眼，后来大家才知道，他是在给手机上的一个新应用拍训练照片：那款应用现在能从叶子的颜色判断黑皮诺什么时候开始转色。\n黑皮诺园的果实全部用手采，装在浅浅的小筐里，免得压破。酒庄只用它酿少量的红酒和一款起泡酒，起泡酒是乔什每年赛车季开幕时在领奖台上开的那一瓶，喷出来的酒比喝下去的多。\n黑皮诺园边上有一排高高的柏树，是挡风用的：谷底夜里的风很冷，柏树能让藤架附近的温度高出一两度，又不至于挡住清晨的雾。园里的藤架比别处矮一些，果串离地面更近，能借到地面白天存下的热。每到开花的那几天，乔什会让赛车场停掉所有试车，他相信黑皮诺开花的时候喜欢安静；酿酒师说这没有科学根据，但他也不反对。"
      en: "The Pinot Noir block of Josh Vineyard, at the west end of the lower row and the coolest on the estate: at night cold air from the mountains flows down the slope and pools on the valley floor as a thin mist, which often does not lift until after nine. Pinot Noir is famously delicate, thin-skinned and prone to heat and disease, losing its aroma if ripening goes even slightly wrong; but in the right place its wine is pale and translucent, tasting of cherry, strawberry, rose and forest floor, the wine many winemakers spend a lifetime trying to get right.\nWhen Josh bought the estate this block grew Cabernet, which never quite ripened. He had a row of weather stations installed and recorded two years of temperature and humidity, compared them with the climates of several ancient wine regions, and concluded the valley floor suited Pinot Noir better. The winter the old vines came out and the new ones went in, he came to the block every morning; only later did people learn he was taking training photos for a new app, which can now tell from a leaf's colour when Pinot Noir begins to turn.\nThe Pinot Noir is all hand-picked into shallow little baskets so the berries are not crushed. The winery makes only a small red and a sparkling wine from it, the sparkling being the bottle Josh opens on the podium at the start of each racing season, more of it sprayed than drunk.\nAlong the Pinot Noir block stands a row of tall cypresses as a windbreak: the night wind on the valley floor is cold, and the trees keep the air by the vines a degree or two warmer without shutting out the morning mist. The trellises here are lower than elsewhere, so the bunches hang nearer the ground and borrow the warmth it stores by day. During the few days of flowering Josh stops all testing at the circuit, believing Pinot Noir likes quiet when it flowers; the winemaker says there is no science in it, but does not object."
    in: div_jjgxvk
    offset_km: [3.6, -1.0]
    site: { layout: vineyard, angle_deg: 0, variant: red, size_m: [900, 700] }
  - id: poi_pd18c5
    subtype: vineyard
    status: generated
    names:
      zh: 乔什葡萄园·霞多丽
      en: Josh Vineyard – Chardonnay
      es: Viñedo de Josh – Chardonnay
    short_names: { zh: 霞多丽, en: Chardonnay, es: Chardonnay }
    notes:
      zh: "乔什葡萄园的霞多丽园，在下排，挨着黑皮诺园，同样享受谷底的晨雾和凉夜。霞多丽是最「随和」的白葡萄之一，几乎在哪里都能种，味道却很听酿酒师的话：在不锈钢罐里发酵，酒清爽得像青苹果和柠檬；放进橡木桶里陈酿，又会变得圆润，带着黄油、烤坚果和香草的味道。乔什酒庄两种都酿，每年夏天在品酒室里并排倒给客人，请他们猜哪一杯是同一块地里的葡萄。\n霞多丽园是乔什试验「省力采收」的地方。园里的藤架拉得特别平整，行距按一台小型采收机的宽度设计，采收机夜里开工，趁葡萄最凉的时候把果实摘下来送进酒庄，白天的热不会让它们开始氧化。采收机自带摄像头，能把烂果和叶子挑出去，可乔什还是坚持在采收机后面跟一个人，「机器挑出的是坏果，人挑出的是问题」。\n霞多丽也是和黑皮诺一起酿起泡酒的另一半。每年冬天，酒庄的地窖里都会排着几百个倒插在木架上的酒瓶，工人每天把它们转动八分之一圈，让沉淀慢慢落到瓶口。乔什试过让机器人来转，结果发现工人们一边转瓶一边聊天的那几个小时，是全庄园消息传得最快的时候，于是又把这份活还给了人。\n霞多丽园的行间种着一种低矮的三叶草，能给土里固定氮，又不和葡萄藤抢水；春天三叶草开花，酒庄边上几个蜂箱里的蜜蜂成群飞来采蜜，那几天园里嗡嗡作响，酿出来的蜂蜜装进小罐，罐子上印着「霞多丽园出品」。"
      en: "The Chardonnay block of Josh Vineyard, in the lower row beside the Pinot Noir, sharing its morning mist and cool nights. Chardonnay is one of the most easy-going white grapes, growing almost anywhere, yet its flavour does just what the winemaker asks: fermented in steel it is crisp as green apple and lemon, aged in oak it turns round and tastes of butter, toasted nuts and vanilla. Josh Winery makes both and every summer pours them side by side in the tasting room, asking guests to guess which glass came from the same plot.\nThis block is where Josh tries out 'easy harvesting'. The trellises are strung especially level and the rows spaced to the width of a small harvester, which works at night, taking the fruit while it is coolest and carrying it to the winery before the day's heat can start it oxidising. The harvester has its own cameras to sort out rotten berries and leaves, but Josh still insists on someone walking behind it: 'the machine picks out bad fruit, a person picks out problems'.\nChardonnay is also the other half, with Pinot Noir, of the sparkling wine. Every winter the cellar holds hundreds of bottles upended in wooden racks, which workers turn an eighth of a turn each day to ease the sediment down into the neck. Josh once tried robots for the job, then found that the hours the workers spent turning bottles and chatting were when news travelled fastest on the estate, and gave the work back to people.\nBetween the Chardonnay rows grows a low clover that fixes nitrogen in the soil without competing with the vines for water; when it flowers in spring, bees from the hives beside the winery swarm over it, the block hums for days, and the honey goes into little jars labelled 'Made in the Chardonnay block'."
    in: div_jjgxvk
    offset_km: [4.6, -1.0]
    site: { layout: vineyard, angle_deg: 0, variant: white, size_m: [900, 700] }
  - id: poi_2ce69a
    subtype: vineyard
    status: generated
    names:
      zh: 乔什葡萄园·长相思
      en: Josh Vineyard – Sauvignon Blanc
      es: Viñedo de Josh – Sauvignon Blanc
    short_names: { zh: 长相思, en: Sauvignon Blanc, es: Sauvignon Blanc }
    notes:
      zh: "乔什葡萄园的长相思园，在下排正中，正对着赛车场的看台。长相思是一种香气很「直接」的白葡萄，酿出来的酒有青草、青柠、百香果和刚割过的草坪的味道，酸度清亮，适合年轻时趁新鲜喝，不需要在橡木桶里等。乔什说它是「最像夏天的酒」，每年赛车季的看台上卖得最多的就是这一款。\n长相思长得快，叶子茂密，果串容易被自己的叶子挡住，晒不到太阳就会带出过重的青椒味，晒得太多又会失去香气。所以这块园子每年夏天都要摘几次叶，把果串露出一半：朝东的一面摘掉，让果实吃到上午温和的阳光；朝西的一面留着，挡住下午的烈日。摘哪片、留哪片，原先全凭老园丁的经验，现在乔什的应用会根据每一行的朝向和当天的天气预报给出建议，老园丁看了一年后说，「它跟我想的差不多，就是比我起得早」。\n因为离赛道近，长相思园的葡萄被戏称为「听着引擎长大的葡萄」。酿酒师曾经认真地做过一次对比，把赛道边和园子另一头的葡萄分开酿，结果喝不出任何区别，可这款酒的酒标上还是印着一面小小的方格旗。\n长相思园的南头是全园离看台最近的地方，赛车季的周末，看台上的观众常常一边看比赛一边看着园里的葡萄，有人干脆在看台上办起品酒会，用手里的杯子和眼前的葡萄做对照。乔什后来在看台边加了一块屏幕，比赛间隙播放这块园子从发芽到采收的延时摄影，观众说这是「全世界最慢的比赛」。"
      en: "The Sauvignon Blanc block of Josh Vineyard, in the middle of the lower row, facing the grandstands of the racing circuit. Sauvignon Blanc is a white grape with a very 'direct' aroma, its wine smelling of grass, lime, passion fruit and new-mown lawn, its acidity bright, made to drink young and fresh without waiting in oak. Josh calls it 'the most summery wine', and it is the best seller in the grandstands every racing season.\nIt grows fast with dense leaves, and the bunches are easily shaded by their own foliage; without sun they turn too green-peppery, with too much they lose their aroma. So every summer the block is leafed several times to half-expose the bunches: the east side stripped so the fruit gets the gentle morning sun, the west side left to screen the afternoon glare. Which leaves to pull and which to leave was once purely the old gardener's judgement; now Josh's app suggests it from each row's aspect and the day's forecast, and after a year of watching it the old gardener said, 'it thinks much as I do, it just gets up earlier'.\nBeing near the circuit, these grapes are teasingly called 'grapes raised on engine noise'. The winemaker once seriously compared them, making the fruit from beside the track and from the far end of the block separately, and nobody could taste any difference; the label still carries a little chequered flag.\nThe south end of the Sauvignon Blanc block is the nearest point of the vineyard to the grandstands, and on racing-season weekends spectators often watch the grapes as well as the race; some hold tastings right in the stands, comparing the glass in hand with the vines in front of them. Josh later added a screen beside the stands that shows, between races, a time-lapse of this block from budburst to harvest, which the crowd calls 'the slowest race in the world'."
    in: div_jjgxvk
    offset_km: [5.6, -1.0]
    site: { layout: vineyard, angle_deg: 0, variant: white, size_m: [900, 700] }
  - id: poi_5q7aje
    subtype: vineyard
    status: generated
    names:
      zh: 乔什葡萄园·雷司令
      en: Josh Vineyard – Riesling
      es: Viñedo de Josh – Riesling
    short_names: { zh: 雷司令, en: Riesling, es: Riesling }
    notes:
      zh: "乔什葡萄园的雷司令园，在下排偏东，是全园海拔最低、最凉的一块，冬天偶尔会结一层薄霜。雷司令是一种来自寒冷地方的白葡萄，酸度高，香气纯净，年轻时像青苹果、白桃和柑橘花，放上十几年会慢慢生出蜂蜜和一种奇特的汽油味，懂酒的人把这种味道当成雷司令陈年的标志。它可以酿成干型，也可以酿成甜型，甜得像蜜，酸又让它一点都不腻。\n雷司令园里有乔什最得意的一项设施：一套藏在藤架下的气象网，每隔几十米就有一个温度传感器，园子边上还立着两台防霜风扇和一排喷雾管。每到深秋，酿酒师会特意留下几行葡萄不摘，等它们在藤上慢慢缩水、糖分越来越浓，有的年份还能等到一场早霜，把冻住的葡萄连夜摘下来压榨，酿成少量的冰酒。那一夜全庄园的人都会被手机叫醒，打着头灯来园里帮忙，摘完以后在酒庄里喝热巧克力。\n乔什说雷司令是最有耐心的葡萄，它教人等待。他的团队里流传着一句话：「应用可以每周更新，雷司令要等十年。」每年冰酒酿成，乔什都会留一瓶，写上那一年最难忘的事，存进酒窖最里面的架子，打算等哪天老了，一瓶一瓶打开来回忆。\n雷司令园的边上有一座小小的观测塔，塔顶装着一台测量霜冻的仪器和一个喇叭，霜冻来临之前，喇叭会先放一段音乐，让附近宿舍里的人有个准备；那段音乐是庄园里的人投票选出来的，到现在都没有换过。"
      en: "The Riesling block of Josh Vineyard, toward the east of the lower row, the lowest and coolest on the estate, now and then frosted in winter. Riesling is a white grape from cold places, high in acid and pure in aroma: young it is green apple, white peach and orange blossom, and after a decade or more it slowly develops honey and a curious petrol note that connoisseurs take as the mark of an aged Riesling. It can be made dry or sweet, sweet as honey yet never cloying for its acidity.\nThe Riesling block holds the facility Josh is proudest of: a weather network hidden under the trellises, a temperature sensor every few dozen metres, with two frost fans and a line of misting pipes along the edge. Each late autumn the winemaker leaves a few rows unpicked to shrivel slowly on the vine as their sugar concentrates, and in some years an early frost comes, when the frozen grapes are picked through the night and pressed for a little ice wine. That night everyone on the estate is woken by their phones and comes out with head torches to help, and afterwards they drink hot chocolate in the winery.\nJosh calls Riesling the most patient grape, one that teaches you to wait. A saying goes round his team: 'apps update every week, Riesling waits ten years.' Each year when the ice wine is made Josh keeps a bottle, writes on it the most memorable thing of that year and puts it on the innermost rack of the cellar, meaning one day, when he is old, to open them one by one and remember.\nAt the edge of the Riesling block stands a small observation tower topped by a frost gauge and a loudspeaker, which before a frost first plays a piece of music so that people in the quarters nearby can get ready; the music was chosen by a vote of everyone on the estate and has never been changed."
    in: div_jjgxvk
    offset_km: [6.6, -1.0]
    site: { layout: vineyard, angle_deg: 0, variant: white, size_m: [900, 700] }
  - id: poi_pq0q2f
    subtype: vineyard
    status: generated
    names:
      zh: 乔什葡萄园·维欧尼
      en: Josh Vineyard – Viognier
      es: Viñedo de Josh – Viognier
    short_names: { zh: 维欧尼, en: Viognier, es: Viognier }
    notes:
      zh: "乔什葡萄园的维欧尼园，在下排最东头，是全园最小、最年轻的一块。维欧尼是一种香气浓烈的白葡萄，酿出来的酒有杏子、桃子、金银花和橙花的味道，质地丰满，酸度却不高，所以采收的时机格外要紧：早一天香气还没出来，晚一天酒就会变得沉闷。它曾经一度稀少到只剩一小片山坡还在种，是后来的酿酒师们一点一点把它救了回来。\n这块园子是露西送给乔什的礼物。有一年乔什生日，露西从朋友那里找来一批维欧尼的苗，连同一张手写卡片一起送到庄园，卡片上写着：「芯片要良率，葡萄也要。」乔什把它们种在离车牌厂最近的这片空地上，还专门做了一个小应用，每天把维欧尼园的糖度、酸度和天气画成曲线，自动推送给露西，于是露西成了这块园子最认真的「远程园丁」，常常半夜发消息来问今天的糖度为什么掉了一点。\n维欧尼园的葡萄一部分单独酿成白葡萄酒，一部分和西拉一起发酵，酿成那款叫「朋友」的红酒。酒庄的品酒单上，维欧尼旁边印着一行小字：「种植：乔什；监督：露西」。来品酒的客人总要问露西是谁，酒庄的人就会指着西北方向说，「山那边造芯片的那位」。\n露西第一次来看这块园子时，在园头种下了一棵橄榄树，说是给葡萄做伴；橄榄树长得很慢，到现在才和人一样高。乔什在树下放了一把长椅，椅背上刻着「给远程园丁留的座位」，露西每次来都会在这里坐一会儿。"
      en: "The Viognier block of Josh Vineyard, at the east end of the lower row, the smallest and youngest on the estate. Viognier is an intensely aromatic white grape whose wine smells of apricot, peach, honeysuckle and orange blossom, full-bodied but low in acid, so the moment of picking matters all the more: a day early and the aroma has not arrived, a day late and the wine goes dull. It once became so rare that only one small hillside still grew it, until later winemakers brought it back bit by bit.\nThis block was a present from Lucy. One year for Josh's birthday Lucy found a batch of Viognier cuttings through friends and sent them to the estate with a hand-written card: 'Chips need yield, so do grapes.' Josh planted them on this plot nearest the plate factory and made a small app just for it, which draws the block's sugar, acidity and weather as curves every day and sends them to Lucy, so Lucy became the block's most devoted 'remote gardener', often messaging in the middle of the night to ask why the sugar had dropped a little today.\nPart of the Viognier is made into a white wine on its own, and part is fermented with Syrah for the red called 'Friend'. On the winery's tasting list a line of small print stands beside the Viognier: 'Grown by Josh; supervised by Lucy.' Visitors always ask who Lucy is, and the staff point north-west and say, 'the one over the hills who makes chips'.\nWhen Lucy first came to see this block she planted an olive tree at its head, to keep the grapes company; olives grow slowly, and it is only now as tall as a person. Josh put a bench beneath it with 'Reserved for the remote gardener' carved on the back, and Lucy sits there a while on every visit."
    in: div_jjgxvk
    offset_km: [7.6, -1.0]
    site: { layout: vineyard, angle_deg: 0, variant: white, size_m: [900, 700] }
  - id: poi_8jh5xy
    subtype: winery
    status: generated
    names:
      zh: 乔什酒庄
      en: Josh Winery
      es: Bodega de Josh
    notes:
      zh: "乔什葡萄园十个品种的葡萄都在这里变成酒。酒庄在葡萄园西头的坡脚下，一进门是露天的压榨场，采收季的清晨，一筐筐葡萄从各块园子运来，先在分拣台上过一遍，再按品种分别去梗、破皮。旁边是发酵车间，室外的不锈钢罐排成三排，每个罐身上都贴着品种、园块和采收日期；红葡萄连皮带籽一起发酵，工人每天几次把浮到表面的果皮压下去，整个车间飘着又甜又酸的果香。\n酒庄最好看的部分藏在地下：陈酿酒窖挖进了山坡，屋顶上铺着草，从外面看只是一片绿色的斜坡，里面却是一排排长长的拱顶走廊，几千只橡木桶静静躺在恒定的凉意里。酒窖最里面的架子存着乔什每年留下的那瓶冰酒，瓶身上写着那一年最难忘的事。装瓶车间在酒窖旁边，一条小小的生产线每天能装几千瓶，酒标上的字是乔什的应用帮小酒庄设计酒标时顺便设计出来的。\n品酒室在酒庄最高的地方，一面墙全是玻璃，望得见下面的葡萄园、赛车场和远处的车牌厂；门外是一个木头露台和一个小池塘，夏天的傍晚，庄园的人常常带着自己的杯子来这里坐一会儿。乔什酒庄的酒大部分不卖，留给庄园里的人、朋友和赛车季的看台；卖掉的那一小部分，收入全部用来给附近小酒庄的果农办免费的技术课。\n酒庄门口有一间小小的教室，每年冬天给附近的果农上课，讲修剪、病害和酿酒，课本是乔什的团队用应用整理出来的，每年按学员提的问题重新编一遍。"
      en: "All ten varieties of Josh Vineyard become wine here. The winery stands at the foot of the slope at the west end of the vineyard. Inside the gate is the open-air crush pad, where on harvest mornings basket after basket arrives from the blocks, passes over the sorting table and is destemmed and crushed variety by variety. Beside it is the fermentation hall, its steel tanks outdoors in three rows, each labelled with variety, block and picking date; the reds ferment with their skins and seeds, and several times a day workers push down the skins that float to the top, filling the hall with a sweet-sour smell of fruit.\nThe winery's finest part is underground. The barrel cellar is dug into the hillside under a grassed roof, so from outside it is just a green slope, but inside are long rows of vaulted corridors where thousands of oak barrels lie still in a constant chill. Its innermost rack holds the bottle of ice wine Josh keeps each year, inscribed with that year's most memorable thing. The bottling hall is next to the cellar, a small line filling a few thousand bottles a day, its label lettering a by-product of the app Josh made to help small wineries design labels.\nThe tasting room is at the top of the winery, one wall all glass, looking down on the vineyard, the circuit and the plate works beyond; outside are a wooden terrace and a small pond, and on summer evenings people from the estate often bring their own glasses and sit here a while. Most of Josh Winery's wine is not sold but kept for the estate, friends and the racing-season grandstands; all the income from the small part that is sold pays for free technical classes for growers at the small wineries nearby.\nBy the winery gate is a small classroom where every winter growers from nearby are taught pruning, vine diseases and winemaking, from a textbook Josh's team compiles with an app and rewrites each year from the questions the students ask."
    in: div_jjgxvk
    offset_km: [2.4, -1.4]
    site: { layout: works, variant: winery, size_m: [700, 450] }
  - id: poi_t6nvhf
    subtype: racetrack
    status: generated
    names:
      zh: 乔什庄园赛车场
      en: Josh Estate Circuit
      es: Circuito de la Hacienda Josh
    notes:
      zh: "乔什的私人赛车场，占了庄园谷地的大半，赛道全长约十二公里，有十六个弯，从主直道出发，先是一个高速的右弯，接着是一串左右交替的「葡萄藤弯」，再爬上东北角的发夹弯，从那里能看见整片葡萄园；回程经过一段穿过内场的慢速弯，最后冲上主直道。赛道宽十五米左右，弯道外侧铺着碎石缓冲区，护栏后面是为观众留的草坡。乔什说他把赛道设计成「每一圈都能学到点什么」：高速弯考胆量，慢速弯考耐心，发夹弯考有没有在看风景。\n主直道旁边是维修区：一排车库、一条维修通道、一座赛事控制塔和后面的围场停车场，车库里停着乔什收藏的赛车，也停着来试车的年轻车手的旧车。直道外侧是几座看台和一大片观众停车场，赛车季的周末，圣塞雷娜城里的人会带着野餐篮来，看台上卖的是乔什酒庄的长相思和热狗。内场里还有一条卡丁车道和一块圆形的漂移练习场，孩子们的卡丁车课是免费的；北边沿着庄园边界是一条笔直的直线加速道，晚上常有人来比谁的车起步快。\n赛车场也是乔什做应用的试验场。每辆车上都装着记录仪，数据实时传到控制塔，他的应用会在车手下车后用一两句话告诉他刚才哪里慢了；新手车手说这比教练还严格，老车手说它至少不会叹气。乔什自己每周都会跑几圈，成绩贴在车库墙上，排名一直在中间，他说这正合适，「最快的人不需要我的应用」。"
      en: "Josh's private racing circuit, taking up most of the estate's valley floor. The track is about twelve kilometres long with sixteen corners: from the main straight a fast right-hander, then a chain of alternating left and right 'Vine Bends', a climb to the hairpin in the north-east corner from which the whole vineyard is in view, and back through a slow section across the infield before the run onto the main straight. The track is about fifteen metres wide, with gravel run-off outside the corners and grass banks for spectators behind the barriers. Josh says he designed it so that 'every lap teaches you something': the fast corners test nerve, the slow ones patience, and the hairpin whether you were looking at the view.\nBeside the main straight are the pits: a row of garages, the pit lane, the race-control tower and the paddock car park behind, the garages holding Josh's racing cars and the old cars of young drivers who come to test. Outside the straight are several grandstands and a large spectators' car park; on racing-season weekends people come from Santa Serena with picnic baskets, and the stands sell Josh Winery's Sauvignon Blanc and hot dogs. The infield also has a karting track and a round skid pan, and children's karting lessons are free; along the estate's northern edge runs a dead-straight drag strip, where people often come at night to see whose car gets away fastest.\nThe circuit is also the proving ground for Josh's apps. Every car carries a logger streaming data live to the tower, and after a driver climbs out, his app tells them in a sentence or two where they lost time; novices say it is stricter than a coach, veterans say at least it does not sigh. Josh runs a few laps himself every week, his times pinned on the garage wall, always mid-table, which he says is just right: 'the fastest people don't need my app'."
    in: div_jjgxvk
    offset_km: [4.5, 2.0]
    site: { layout: racetrack, size_m: [4500, 2800] }
  - id: poi_19x1za
    subtype: factory
    status: generated
    names:
      zh: 乔什车牌厂
      en: Josh Number-Plate Works
      es: Fábrica de Matrículas de Josh
    notes:
      zh: "庄园东北角的车牌厂，全州的个性车牌大多在这里制造。进厂先看到的是铝卷堆场，一卷卷银色的铝板整齐地码在露天的架子上；铝卷送进主车间，先被剪成一块块标准大小的空白牌，再进入压字机，按订单把字母和数字一个个压凸出来。旁边细长的厂房是喷涂线，空白牌在这里刷上底色和州旗上的那只棕熊，压凸的字再滚上一层墨，送进烘干炉烤干。成品经过质检、装箱，从厂区南边的仓库和装卸月台装上货车，送往全州各地的车管所。\n乔什办这座厂的起因很简单：他喜欢车，也喜欢车牌上那几个字能讲的故事。加州的个性车牌一向很受欢迎，人们愿意多付一点钱，让自己的车牌上写着孩子的名字、宠物的名字或者一句只有自己懂的玩笑。乔什的团队给车牌厂做了一个应用，用一句话描述想要的车牌，它会给出几个方案，检查有没有和别人重复，再提醒你那几个字母会不会在别的语言里念出不太雅的意思，过去要等几个星期的审批，现在几分钟就能下单。\n车牌厂有两百多名工人，工资在全州同类工厂里算高的，每周五下午提前下班去赛车场看试车。厂门口的访客中心里有一面「车牌墙」，挂着厂里做过的几千块最有趣的车牌，从「我爱奶奶」到「还在加载」，参观的人常常在墙前笑出声。墙的正中间挂着两块不卖的车牌，一块写着乔什，一块写着露西。"
      en: "The number-plate works in the north-east corner of the estate, where most of the state's personalised plates are made. First comes the aluminium coil yard, silver coils stacked neatly on open racks; the coils go into the main hall, are cut into standard-sized blank plates and then pass through the embossing presses, which raise the letters and numbers one by one to order. The long, narrow building beside it is the painting line, where blanks get their background and the bear from the state flag, the raised characters are rolled with ink and the plates are baked dry in the curing oven. Finished plates are inspected and boxed and leave by lorry from the warehouse and loading docks at the south of the site for vehicle offices across the state.\nJosh started the works for a simple reason: he likes cars, and he likes the stories a few characters on a plate can tell. California's personalised plates have always been popular, people gladly paying a little more for a plate with a child's name, a pet's name or a joke only they understand. Josh's team made the works an app: describe the plate you want in a sentence and it offers a few designs, checks none is taken and warns you if the letters read as something rude in another language; approval that once took weeks now takes minutes.\nThe works has more than two hundred workers, paid well above similar factories in the state, who knock off early on Friday afternoons to watch testing at the circuit. The visitor centre by the gate has a 'plate wall' hung with thousands of the funniest plates the works has made, from 'I LUV GRAN' to 'STILL LOADING', and visitors often laugh out loud in front of it. In the very middle hang two plates that are not for sale, one reading JOSH and the other LUCY."
    in: div_jjgxvk
    offset_km: [6.0, 6.5]
    site: { layout: works, variant: plates, size_m: [1200, 800] }

  # ── 露西芯城区 ──
  - id: poi_hj2ap8
    subtype: mansion
    status: generated
    names:
      zh: 露西宅邸
      en: Lucy's House
      es: Casa de Lucy
    notes:
      zh: "露西的家，在露西芯城区盆地东边的山坡上，背后是一路升到海拔 1652 米的露西峰，前面望得见整座芯城：南边是几座晶圆厂银白色的长方形屋顶和冷却塔升起的白汽，西边是动物园十四座各不相同的场馆。露西年轻时在好几家芯片公司和存储公司工作过，做过工艺工程师、良率分析和存储产品的设计，跟着行业经历了几轮起落，后来积累了大量财富。她说自己的财富来自「把每一片晶圆上坏掉的芯片再少一点」，所以她对任何事都追问良率，包括宅邸花园里的玫瑰。\n宅邸是一座两翼对称的白房子，比乔什家更安静一些：东翼是书房和一间小小的洁净室，露西退休后仍喜欢在显微镜下看芯片的截面；西翼是厨房和客房，乔什来吃饭时总住同一间。泳池平台朝西，傍晚能看见夕阳落在动物园的鸟馆网罩上；草坪尽头三栋小客屋住着来访的工程师、兽医和牙医朋友。车库旁的直升机坪是庄园里用得最勤的，因为露西每周都要飞去乔什那里看看她的维欧尼园。\n露西家的客厅里挂着一排镶了框的晶圆，每一片都来自她工作过的一家公司，从最早的小尺寸晶圆一直到后来的大晶圆，像一面行业的家谱。客人来了，她会一片一片讲它们的故事，讲到最后总会指着窗外的芯城说：「这一片还没做完。」\n宅邸门口的小路两边种着一排葡萄藤，是乔什送来的维欧尼插条，露西说这样每天进门都能想起朋友家。"
      en: "Lucy's home, on the hillside east of the basin in Lucy Chip City District, with Mount Lucy rising behind it to 1,652 m and the whole Chip City in view below: to the south the long silver-white roofs of the fabs and the white plumes of their cooling towers, to the west the fourteen different houses of the zoo. In her younger years Lucy worked at several chip companies and memory companies, as a process engineer, in yield analysis and in memory product design, riding several of the industry's ups and downs, and later built up a great fortune. She says her fortune came from 'a few less broken chips on every wafer', so she asks about yield in everything, including the roses in her garden.\nThe house is a white building with matching wings, a little quieter than Josh's: the east wing holds her study and a small cleanroom, where in retirement she still likes to look at chip cross-sections under the microscope; the west wing holds the kitchen and the guest rooms, Josh always staying in the same one when he comes to dinner. The pool terrace faces west, and in the evening the sunset falls on the netting of the zoo's aviary; the three cottages at the end of the lawn house visiting engineers, vets and dentist friends. The helipad by the garage is the busiest on the estate, since Lucy flies over to Josh's every week to look at her Viognier.\nIn Lucy's living room hangs a row of framed wafers, each from a company she worked for, from the earliest small wafers to the later large ones, like a family tree of the industry. When guests come she tells the story of each, and at the end always points at the Chip City out of the window: 'this one isn't finished yet.'\nThe path to the door is lined with vines grown from Viognier cuttings Josh sent, which Lucy says remind her of her friend's place every time she comes home."
    in: div_zmb3gb
    offset_km: [-6.2, 1.0]
    site: { layout: estate, size_m: [900, 700], angle_deg: -90 }
  - id: poi_qnntjs
    subtype: research_institute
    status: generated
    names:
      zh: 露西芯片设计中心
      en: Lucy Chip Design Centre
      es: Centro de Diseño de Chips Lucy
    notes:
      zh: "露西芯城的「大脑」，所有在芯城制造的芯片都从这里开始。设计中心是一片低矮的园区，十几栋楼散布在橡树和草坡之间，楼与楼之间用有顶的连廊相连，下雨天也不用打伞。这里有几千名工程师，分成架构、前端设计、验证、物理设计和测试几个部门：架构师在白板上画出芯片要做什么，前端工程师把它写成硬件描述代码，验证工程师用成千上万个测试去找其中的错误，物理设计工程师再把几十亿个晶体管摆进指甲盖大小的面积里，最后交给晶圆厂做成光罩。\n露西给设计中心定了几条规矩：每个新项目的第一周，设计工程师要去晶圆厂的洁净室里待一天，看看自己的设计将来是怎么被做出来的；每颗芯片流片之前，要请一位从没参与过这个项目的工程师来「挑刺」；每次流片成功，全中心都放半天假，到动物园去野餐。中心里有一台很大的计算机集群，专门用来跑仿真和验证，夜里也不停，它的散热用的是从晶圆厂冷却塔分出来的循环水。\n设计中心也和乔什的团队合作，把人工智能用在芯片设计上：帮工程师自动生成测试、检查布线、预测哪一块电路最可能出问题。露西对这些工具很欢迎，但有一条底线，「最后签字的必须是一个人」。园区门口的石头上刻着她最喜欢的一句话：「每一个晶体管都要有人在乎。」"
      en: "The 'brain' of Lucy's Chip City, where every chip made there begins. The design centre is a low campus of a dozen or so buildings scattered among oaks and grassy slopes, joined by covered walkways so nobody needs an umbrella on rainy days. Several thousand engineers work here in architecture, front-end design, verification, physical design and test: architects sketch on whiteboards what a chip must do, front-end engineers write it as hardware description code, verification engineers hunt for its errors with tens of thousands of tests, and physical designers fit billions of transistors into an area the size of a fingernail before handing it to the fab to be made into masks.\nLucy set the centre a few rules: in the first week of every new project the designers spend a day in a fab's cleanroom to see how their design will be made; before every tape-out an engineer who never worked on the project is brought in to pick holes; and after every successful tape-out the whole centre gets half a day off for a picnic at the zoo. The centre has a large computing cluster just for simulation and verification, running through the night and cooled by water drawn off the fabs' cooling towers.\nThe centre also works with Josh's team on AI in chip design, tools that generate tests automatically, check the wiring and predict which block of circuitry is most likely to go wrong. Lucy welcomes them with one bottom line: 'the last signature must be a person's.' A stone at the campus gate is carved with her favourite saying: 'Every transistor deserves someone who cares.'"
    in: div_zmb3gb
    offset_km: [-6.5, -5.6]
    site: { layout: campus, size_m: [1200, 800], rural: true }
  - id: poi_mz8wrn
    subtype: chip_fab
    status: generated
    names:
      zh: 露西一号逻辑晶圆厂
      en: Lucy Fab 1 (Logic)
      es: Fábrica de Obleas Lucy 1 (Lógica)
    short_names: { zh: 一号晶圆厂, en: Fab 1, es: Fábrica 1 }
    notes:
      zh: "露西芯城的第一座晶圆厂，专门制造逻辑芯片，也就是电脑、手机和数据中心里负责「思考」的那些处理器。厂区中央是一座长方形的洁净厂房，长四百多米，里面是几层楼高的超净车间：空气每分钟要过滤好几遍，每立方米里的尘埃比外面的空气少几万倍，工人穿着从头包到脚的「兔子服」，进去之前要过风淋室。车间里排着几百台光刻机、刻蚀机、薄膜沉积机和检测设备，一片片晶圆装在密封的小盒里，沿着天花板上的轨道在机台之间来回穿梭，一片晶圆要走过一千多道工序、花两三个月才能做完。\n洁净厂房东边是中央动力楼，两者之间用几条连廊相连，里面是给车间供电、供冷、供气的设备；动力楼旁边一排冷却塔日夜冒着白汽。厂区西北角是大宗气体和化学品站，一排排储罐里装着氮气、氢气和各种特殊气体；北边是超纯水厂和废水处理池，晶圆每做一步都要用超纯水冲洗，用过的水经过处理后，大部分又回到厂里循环使用。厂区门口是办公楼和员工停车场，再往外是围墙和门岗。\n露西对一号厂最在乎的数字是良率：每片晶圆上能用的芯片占多少。厂里有一块很大的屏幕，实时显示每条产线当天的良率，数字升了，车间里的人会互相击掌；降了，露西会亲自来车间，和工程师一起站在显微镜前找原因。工程师们说，她不是来问责的，是来「一起找那颗灰尘」的。"
      en: "The first fab of Lucy's Chip City, making logic chips, the processors that do the 'thinking' in computers, phones and data centres. At the centre of the site is a rectangular cleanroom building more than four hundred metres long, holding several storeys of ultra-clean production floor: the air is filtered several times a minute and holds tens of thousands of times less dust per cubic metre than the air outside, and workers wear head-to-toe 'bunny suits' and pass through air showers to go in. Hundreds of lithography, etching, deposition and inspection tools stand in rows, and wafers in sealed pods shuttle between them on tracks in the ceiling; a wafer passes through more than a thousand steps over two or three months before it is done.\nEast of the cleanroom is the central utility building, joined to it by covered bridges, with the plant supplying power, cooling and gases; a row of cooling towers beside it steams day and night. In the north-west corner is the bulk gas and chemical yard, rows of tanks of nitrogen, hydrogen and speciality gases; to the north are the ultrapure water plant and the wastewater basins, since wafers are rinsed in ultrapure water at every step, and most of the used water returns to the plant after treatment. By the gate are the offices and the staff car park, and beyond them the wall and the guardhouse.\nThe number Lucy cares most about at Fab 1 is yield, the share of good chips on each wafer. A big screen shows every line's yield for the day in real time; when the number rises people high-five on the floor, and when it falls Lucy comes in person to stand at the microscope with the engineers looking for the cause. The engineers say she does not come to blame anyone but 'to find that speck of dust together'."
    in: div_zmb3gb
    offset_km: [-9.5, -3.2]
    site: { layout: fab, variant: logic, size_m: [2000, 1400] }
  - id: poi_5fe849
    subtype: chip_fab
    status: generated
    names:
      zh: 露西存储晶圆厂
      en: Lucy Memory Fab
      es: Fábrica de Obleas de Memoria Lucy
    short_names: { zh: 存储晶圆厂, en: Memory Fab, es: Fábrica de Memoria }
    notes:
      zh: "露西芯城的存储芯片厂，制造内存和闪存，是露西最有感情的一座厂：她职业生涯里最长的一段，就是在存储公司里度过的。存储芯片和逻辑芯片不同，它的电路几乎是同一个小单元重复几十亿次，比的是谁能把单元做得更小、叠得更高、价格更低。露西常说存储是芯片行业里「最诚实也最残酷」的生意：价格一年能涨一倍，也能跌一半，熬过低谷的公司才能等到下一个高峰。\n厂区有两座并排的洁净厂房，各自连着中央动力楼，北边还留着一大块平整好的空地，是给第三座厂房预备的。露西说要等到「行业真正需要它的时候」再盖，不追风口，也不怕被说保守。闪存车间里最引人注目的是一排排刻蚀机，它们要在晶圆上挖出几百层深的细孔，再一层层填进存储单元，工程师形容这像是「在一根头发丝里盖一座摩天楼」。厂区南边是超纯水厂和废水处理池，西边是气体站和员工停车场，冷却塔沿着东侧一字排开。\n存储晶圆厂的员工里有不少是露西从前的同事，有些已经退休，被她请回来带新人。厂里每年办一次「低谷故事会」，老员工讲自己经历过的最难熬的那几年，讲怎么熬过来。露西每次都坐在第一排，听到最后总会补一句：「所以现在要多存一点，不只是数据。」\n厂区北边那块留给第三座厂房的空地，平时被员工们当成足球场，周末的比赛分成「内存队」和「闪存队」，露西每次都当裁判，判罚出了名的公平。"
      en: "The memory fab of Lucy's Chip City, making DRAM and flash, and the fab Lucy feels most for: the longest stretch of her career was spent at memory companies. Memory differs from logic in that its circuitry is almost the same tiny cell repeated billions of times, and the contest is who can make the cell smaller, stack it higher and sell it cheaper. Lucy often calls memory the chip industry's 'most honest and most brutal' business: prices can double in a year or halve, and only the companies that last out the trough live to see the next peak.\nThe site has two cleanroom buildings side by side, each linked to the central utility building, with a large levelled plot to the north kept for a third. Lucy says it will be built 'when the industry truly needs it', neither chasing fashions nor minding being called cautious. The most striking things on the flash floor are the rows of etchers, which must cut holes hundreds of layers deep into the wafer to be filled layer by layer with memory cells; the engineers liken it to 'building a skyscraper inside a strand of hair'. South of the buildings are the ultrapure water plant and wastewater basins, to the west the gas yard and staff car park, and the cooling towers line the east side.\nMany of the fab's staff are Lucy's former colleagues, some of them retired and brought back by her to train newcomers. Every year the fab holds a 'trough stories' evening, where veterans tell of the hardest years they lived through and how they got through them. Lucy always sits in the front row, and at the end always adds: 'So save a little more now, and not just data.'\nThe plot to the north kept for the third building serves meanwhile as the staff football pitch, where weekend matches pit 'Team DRAM' against 'Team Flash'; Lucy always referees, famous for her fairness."
    in: div_zmb3gb
    offset_km: [-6.8, -2.4]
    site: { layout: fab, variant: memory, size_m: [2400, 1600] }
  - id: poi_rpegsr
    subtype: chip_fab
    status: generated
    names:
      zh: 露西封装测试厂
      en: Lucy Packaging and Test Plant
      es: Planta de Encapsulado y Pruebas Lucy
    short_names: { zh: 封装测试厂, en: Packaging and Test, es: Encapsulado y Pruebas }
    notes:
      zh: "晶圆厂做出来的是一整片布满芯片的圆盘，要变成能装进电脑和手机里的芯片，还得经过封装测试厂。这座厂在芯城西头，是九座整齐排列的中型厂房：第一排做晶圆测试和切割，用探针逐颗检查芯片，再用金刚石刀或激光把晶圆切成一颗颗小方块；第二排做封装，把芯片粘到基板上，用比头发还细的金线或铜柱把它和外面的引脚连起来，再用树脂包起来；第三排做先进封装，把几颗不同的芯片像搭积木一样并排或叠起来，装进同一个封装里。\n厂区东边是一座大仓库，成品芯片在这里分类、贴标、装进防静电的托盘，保税仓库旁边的装卸月台每天都有货车进出。厂房之间的通道上跑着无人搬运车，但最后一道外观检查仍由工人在放大镜下完成，露西说「机器能告诉你哪颗坏了，人能告诉你为什么让人不舒服」。厂区门口是办公楼和停车场，四周是围墙。\n露西特别看重这座厂，因为她认为芯片行业的下一个突破很可能不在晶体管本身，而在怎样把它们「装」在一起。厂里有一间展示室，玻璃柜里陈列着从最早的双列直插封装到如今几十颗芯片叠在一起的先进封装，旁边写着每一种封装的引脚数。参观的小学生最喜欢那颗只有米粒大小的芯片，讲解员会让他们猜它里面有多少个晶体管，没有一个孩子猜得够多。\n封装测试厂每年会挑出一颗测试结果最完美的芯片，装进一个小玻璃盒，送给当年新员工里表现最好的那一位。"
      en: "A fab turns out a whole disc covered in chips; to become chips that fit inside computers and phones, they must go through packaging and test. This plant at the west end of Chip City is nine mid-sized buildings in neat rows: the first row does wafer test and dicing, probing every chip and then cutting the wafer into tiny squares with diamond blades or lasers; the second does packaging, bonding each chip to a substrate, connecting it to the outside pins with gold wires finer than a hair or with copper pillars and sealing it in resin; the third does advanced packaging, setting several different chips side by side or stacked like building blocks in a single package.\nOn the east of the site is a big warehouse where finished chips are sorted, labelled and packed in antistatic trays, and lorries come and go every day at the docks beside the bonded store. Driverless carts run along the aisles between the buildings, but the final visual check is still done by workers under magnifiers: Lucy says 'machines can tell you which one is broken, people can tell you why it looks wrong'. Offices and the car park are by the gate, and a wall surrounds it all.\nLucy values this plant especially, believing the industry's next breakthrough may well lie not in the transistor itself but in how chips are put together. A showroom displays in glass cases everything from the earliest dual in-line packages to today's advanced packages with dozens of chips stacked together, each labelled with its pin count. Visiting schoolchildren love the chip no bigger than a grain of rice, and the guide asks them to guess how many transistors are inside; no child ever guesses high enough.\nEvery year the plant picks the chip with the most perfect test results, seals it in a little glass case and gives it to the best of that year's new staff."
    in: div_zmb3gb
    offset_km: [-12.2, -3.0]
    site: { layout: fab, variant: packaging, size_m: [1500, 1000] }
  - id: poi_mf7dvr
    subtype: chip_fab
    status: generated
    names:
      zh: 露西光罩厂
      en: Lucy Mask Shop
      es: Taller de Fotomáscaras Lucy
    short_names: { zh: 光罩厂, en: Mask Shop, es: Fotomáscaras }
    notes:
      zh: "光罩是芯片的「底片」：一块极其平整的石英玻璃，上面用铬画着芯片某一层的电路图案。光刻机用光透过光罩，把图案缩小投影到晶圆上，一颗芯片往往要几十块光罩，一层一块。露西光罩厂就是为芯城的晶圆厂制作这些底片的地方，是芯城里最小、也最安静的一座厂。\n厂房是一座方正的建筑，里面的洁净度比晶圆厂还要高。设计中心交来的电路数据，先在计算机上做修正，把光在传播中会变形的地方提前「画歪」，好让投影到晶圆上时恰好变直；然后由电子束写入机在石英板上一笔一笔地写出图案，一块光罩要写上十几个小时；写好以后要经过检测、修补和清洗，再装进防尘的盒子，用专车送到隔壁的晶圆厂。厂房东边是动力楼和一排小储罐，北边是一片小花园，工程师们写入机运转的时候常常在那里散步。\n光罩上任何一点微小的瑕疵，都会出现在用它做出的每一颗芯片上，所以光罩厂的人对「完美」有一种近乎固执的追求。露西年轻时在这一行待过一段时间，她说光罩厂教会她的是：「错误会被复制，正确也会。」厂里的新员工报到时，都会收到一块报废的光罩做成的纪念牌，背面刻着这句话。\n光罩厂的写入机运转时最怕震动，所以厂房的地基和周围的道路是分开的，大货车进出要绕到厂区另一头；厂里连咖啡机都装在离写入机最远的角落，工程师们说在这里喝一杯咖啡要走一段「朝圣之路」。"
      en: "A photomask is a chip's 'negative': an exceedingly flat plate of quartz glass on which one layer of the chip's circuitry is drawn in chrome. The lithography tool shines light through the mask to project a reduced image of the pattern onto the wafer, and a chip often needs dozens of masks, one per layer. Lucy Mask Shop makes these negatives for Chip City's fabs, and is the smallest and quietest plant in the city.\nThe building is a plain square block, cleaner inside even than a fab. The circuit data from the design centre is first corrected by computer, the places where light will distort deliberately 'drawn crooked' so they come out straight on the wafer; then an electron-beam writer draws the pattern stroke by stroke on the quartz, a dozen or more hours per mask; finished masks are inspected, repaired and cleaned, packed in dustproof cases and driven to the fabs next door. East of the building are a utility block and a row of small tanks, and to the north a small garden where engineers often walk while the writers run.\nThe tiniest flaw on a mask appears on every chip made with it, so the mask shop's people pursue perfection with something close to obstinacy. Lucy spent some time in this trade when she was young, and says the mask shop taught her that 'mistakes get copied, and so does getting it right'. New staff each receive on their first day a plaque made from a scrapped mask, with that sentence engraved on the back.\nThe writers fear vibration above all, so the building's foundations are separate from the roads around it and lorries must go round to the far side of the site; even the coffee machine stands in the corner furthest from the writers, and the engineers say a cup of coffee here means a 'pilgrimage'."
    in: div_zmb3gb
    offset_km: [-9.5, -5.0]
    site: { layout: fab, variant: mask, size_m: [800, 600] }
  - id: poi_x0pem0
    subtype: museum
    status: generated
    names:
      zh: 露西存储博物馆
      en: Lucy Museum of Memory
      es: Museo de la Memoria Lucy
    notes:
      zh: "设计中心旁边一座小小的博物馆，讲的是人类怎样把信息「存」下来。展厅按时间顺序排开：第一间是刻在泥板上的记账符号、打了结的绳子和写在羊皮上的书；第二间是早期计算机用的穿孔卡片、磁鼓和一格一格穿着细铜线的磁芯存储器，每一个小磁环只能存一个比特；第三间是磁带、软盘和硬盘，旁边放着一块早期的硬盘，比冰箱还大，存的东西却不如今天的一张照片多；最后一间是半导体存储，从第一代内存芯片到如今堆了几百层的闪存，用放大镜可以看到它们的截面。\n博物馆的很多展品是露西自己的收藏，有些是她工作过的公司送的纪念品，有些是她在旧货市场里一件件淘来的。展柜旁的说明牌都是她亲手写的，语气像在和朋友聊天，比如在一块软盘旁边写着：「我的第一份简历就存在这样一张盘上，后来它坏了，我只好重新写了一遍，结果写得更好。」\n博物馆最后一个房间没有展品，只有一面墙和很多便利贴，参观的人可以写下一件自己最想永远记住的事贴上去。露西每个月会来读一遍，把其中一些抄进一本厚厚的本子。她说存储芯片能记住几乎所有的数据，可人真正想留下来的，往往只是一两句话。\n博物馆每个周末开放一张「修复工作台」，工作人员会把参观者带来的旧硬盘、旧手机和旧相机里的照片和文件抢救出来，免费复制到新的存储卡里，很多人在这里找回了以为永远丢失的家人照片。"
      en: "A small museum beside the design centre about how people have 'stored' information. The galleries run in order of time: the first holds tally marks on clay tablets, knotted cords and books on parchment; the second, punched cards, magnetic drums and the core memory of early computers, threaded square by square with fine copper wire, each tiny ring holding a single bit; the third, tapes, floppy disks and hard drives, including an early hard drive bigger than a fridge that held less than one of today's photographs; and the last, semiconductor memory, from the first memory chips to today's flash stacked hundreds of layers high, whose cross-sections can be seen through magnifiers.\nMany of the exhibits are Lucy's own collection, some given as keepsakes by the companies she worked for, others found one by one in flea markets. She wrote the labels by hand in a tone like chatting with a friend; beside a floppy disk, for example: 'My first CV was saved on a disk like this. It broke, so I had to write it again, and the second one was better.'\nThe museum's last room has no exhibits, just a wall and a great many sticky notes, where visitors may write the one thing they most want to remember for ever. Lucy comes to read them every month and copies some into a thick notebook. She says memory chips can remember almost any data, but what people really want to keep is usually only a sentence or two.\nEvery weekend the museum opens a 'rescue bench', where staff recover the photos and files on old hard drives, phones and cameras visitors bring in and copy them free onto new memory cards; many people have found here family photos they thought lost for ever."
    in: div_zmb3gb
    offset_km: [-5.2, -5.6]
    site: { layout: hall, size_m: [300, 200], rural: true }
