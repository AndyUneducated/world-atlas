  - id: poi_has59e
    subtype: vineyard
    status: generated
    names:
      zh: 乔什葡萄园·品丽珠
      en: Josh Vineyard – Cabernet Franc
      es: Viñedo de Josh – Cabernet Franc
    short_names: { zh: 品丽珠, en: Cabernet Franc, es: Cabernet Franc }
    notes:
      zh: "乔什葡萄园的品丽珠园，在上排最东头，紧挨着通往车牌厂的小路。品丽珠是赤霞珠的「家长」之一，比赤霞珠早熟、皮薄、颜色浅，酿出来的酒带着红色浆果、紫罗兰和一点青椒的清香，喝起来轻盈而有棱角。它在调配里常常只占一小部分，却能让整杯酒的香气一下子立起来，酿酒师说它是「酒里的高音」。\n这块园子的坡度最缓，土层最厚，园里特意留了几行试验田：同一个品种分成几种修剪方式、几种行距和几种遮阴网，每一行都插着标牌和传感器，数据汇总到乔什车库实验室的一块大屏幕上。附近几座小酒庄的果农常来这里看，乔什把试验结果整理成一个免费的小应用，叫「隔壁老乔」，拍下自家葡萄园的照片，它会告诉你哪种修剪方式在类似的坡上效果最好。\n品丽珠园的行头玫瑰是全园开得最好的，因为园子靠路，来往的人多，大家顺手浇水。乔什说这块园子教会他一件事：一个东西不必占大头，也能让整体变得更好。他的团队里有人把这句话贴在了墙上，后来发现乔什每个季度都要讲一次。\n品丽珠园尽头的小路通往车牌厂，每天傍晚换班的时候，车牌厂的工人会沿着这条路走回宿舍，路过园子时顺手拔几根杂草。乔什为此在路边放了一排小木箱，里面有手套和小铲子，箱子上写着「谢谢顺手」。几年下来，这条路边的杂草是全园最少的，园丁们说这块园子有两百多个兼职园丁，而且一个都不要工资。"
      en: "The Cabernet Franc block of Josh Vineyard, at the east end of the upper row beside the lane to the plate factory. Cabernet Franc is one of Cabernet Sauvignon's parents, earlier-ripening, thinner-skinned and paler, and its wine smells of red berries, violets and a little green pepper, light and angular to drink. In a blend it usually makes up only a small share, yet it lifts the whole glass's aroma at once; the winemaker calls it 'the high note in the wine'.\nThis block has the gentlest slope and the deepest soil, and a few rows are kept as trial plots: one variety under several pruning methods, row spacings and shade nets, every row signposted and wired with sensors, the data gathered on a big screen in Josh's Garage Lab. Growers from small wineries nearby often come to look, and Josh turned the results into a free little app called 'Josh Next Door': photograph your own vineyard and it tells you which pruning has worked best on a slope like yours.\nThe roses at the row ends here bloom better than anywhere on the estate, because the block is by the lane and passers-by water them as they go. Josh says this block taught him one thing: something need not be the biggest part to make the whole better. Someone on his team stuck that sentence on the wall, and then noticed Josh says it once a quarter.\nThe lane at the end of the Cabernet Franc block leads to the plate factory, and at the evening shift change the plate workers walk back to their quarters along it, pulling a few weeds as they pass. So Josh set a row of little wooden boxes by the lane with gloves and trowels inside, labelled 'Thanks for the hand'. After a few years the lane side has the fewest weeds on the estate, and the gardeners say the block has more than two hundred part-time gardeners, none of whom wants paying."
    in: div_jjgxvk
    offset_km: [7.6, -1.8]
