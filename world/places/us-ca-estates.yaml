# Josh's and Lucy's estates in Santa Serena (M67). Offsets are real km from the district centre.
places:
  # ── 乔什庄园区 ──
  - id: poi_6v8a3r
    subtype: mansion
    status: generated
    names:
      zh: 乔什宅邸
      en: Josh's House
      es: Casa de Josh
    notes:
      zh: "乔什的家，建在乔什庄园区南边的缓坡上，背后是一路升高的私人山脉，一直连到海拔 1767 米的乔什峰；从客厅的落地窗望出去，脚下是整片谷地：左边是按品种分块的葡萄园，正前方是赛车场的主直道，远处是车牌厂的锯齿形屋顶。乔什做人工智能应用，不训练大模型，而是把别人的模型做成普通人每天真正会打开的东西：帮果农看天气、帮修车师傅读故障码、帮小酒庄写酒标。他说自己的工作是「把聪明的东西变得好用」，这座宅子也照这个意思盖：没有金色的柱子和巨大的吊灯，只有很多窗、很多书架和一个能坐二十个人的长餐桌。\n宅邸是两翼对称的平顶白房子，中间是起居厅，东翼是卧室和书房，西翼是厨房和朋友们常来过夜的客房。泳池平台朝着谷地，傍晚能听见赛道上最后几圈的引擎声；草坪尽头的三栋小客屋分别住着来试驾的车手、来酿酒的酿酒师和来写代码的朋友。车库门口停着他每天开的那辆旧车，旁边的直升机坪一年用不了几次，多半是露西从芯城飞过来吃晚饭。乔什家的规矩是饭桌上不许看手机，但可以讨论任何一款还没发布的应用，于是很多应用的第一批用户就是这张桌子边的人。\n宅邸的屋顶铺满了太阳能板，地下有一间储能室，停电的时候整座庄园还能照常运转一天；乔什说这是从露西那里学来的：「洁净室一秒钟都不能停电，我的餐桌也不能。」院子里那棵老橡树比宅邸还老，树下的秋千是给常来做客的孩子们装的。"
      en: "Josh's home, on the gentle slope at the south of Josh Estate District, with his private mountains climbing behind it all the way to Mount Josh at 1,767 m. From the living-room windows the whole valley lies below: the vineyard in its blocks of grape varieties on the left, the main straight of the racing circuit ahead and the saw-tooth roofs of the number-plate works in the distance. Josh works on AI applications: he does not train big models, but turns other people's models into things ordinary people actually open every day, helping fruit growers read the weather, mechanics read fault codes and small wineries write their labels. He says his job is 'making clever things useful', and the house was built in the same spirit: no gilded columns or giant chandeliers, just a great many windows, a great many bookshelves and a long dining table that seats twenty.\nThe house is a flat-roofed white building with matching wings: the living hall in the middle, bedrooms and the study in the east wing, and in the west wing the kitchen and the guest rooms where friends often stay the night. The pool terrace faces the valley, and in the evening you can hear the last laps on the circuit; the three cottages at the end of the lawn house test drivers, visiting winemakers and friends who come to write code. The old car he drives every day sits by the garage, and the helipad beside it is used only a few times a year, mostly when Lucy flies over from Chip City for dinner. The house rule is no phones at the table, but any unreleased app may be discussed, so many apps have had the people round this table as their first users.\nThe roof is covered in solar panels and there is a battery room underground, so in a blackout the whole estate can run as usual for a day; Josh says he learned that from Lucy: 'a cleanroom can't lose power for a second, and neither can my dinner table.' The old oak in the garden is older than the house, and the swing beneath it was put up for the children who often visit."
    in: div_jjgxvk
    offset_km: [1.0, -3.2]
    site: { layout: estate, size_m: [900, 700], angle_deg: 90 }
  - id: poi_gzn94x
    subtype: office
    status: generated
    names:
      zh: 乔什车库实验室
      en: Josh's Garage Lab
      es: Laboratorio del Garaje de Josh
    notes:
      zh: "乔什宅邸旁边的一座旧车库，是他做人工智能应用的地方。车库里一半是车：一辆拆开的老跑车、几台等着装传感器的卡丁车；另一半是长桌、白板和几排屏幕，墙上钉满了用户的来信和截图。乔什的团队不大，常驻的只有十几个人，其余的人散在各地，每周五晚上在这里聚一次，边吃比萨边演示这一周做出来的东西。\n这里诞生过不少让人会心一笑的应用：一款给葡萄园用的，拍一张叶子的照片就能告诉你缺水还是生病；一款给赛车手用的，把每一圈的数据讲成人话，比如「第三弯你又刹早了」；还有一款给车牌厂用的，让人用一句话描述自己想要的个性车牌，再自动检查有没有和别人重复、有没有不雅的谐音。乔什的原则是每个应用都要先在庄园里用一个季度，酿酒师、车手和车牌厂的工人都说好用，才放给外面的人。车库门口挂着一块手写的牌子：「先有人用，再谈改变世界」。晚上车库常常亮到很晚，路过的保安说，里面的笑声比键盘声还多。\n车库的角落里有一台退役的服务器机柜，是露西芯城送来的第一批芯片的测试机，乔什把它改成了团队自己的「家用算力」，冬天还能顺便给车库供暖。团队有一个传统：每个应用上线那天，大家都要在车库的墙上签名，墙上已经签满了三面，第四面留给下一批应用。乔什说他最看重的指标不是下载量，而是用户第二周还会不会再打开，所以车库门口的小黑板上每天写的，就是这个数字。"
      en: "An old garage beside Josh's house, where he builds his AI applications. Half of it is cars, a stripped-down old sports car and a few karts waiting for sensors; the other half is long tables, whiteboards and rows of screens, the walls pinned with users' letters and screenshots. Josh's team is small, only a dozen or so people on site and the rest scattered elsewhere, and every Friday evening they gather here to eat pizza and demonstrate what they made that week.\nQuite a few apps that make people smile were born here: one for vineyards, which tells you from a photo of a leaf whether the vine is thirsty or sick; one for racing drivers, which turns each lap's data into plain words, such as 'you braked early at turn three again'; and one for the number-plate works, which lets people describe the personalised plate they want in a sentence and then checks it is not taken and has no rude reading. Josh's rule is that every app is first used on the estate for a season, and only when the winemakers, drivers and plate workers all say it works is it let out to everyone else. A hand-written sign hangs by the door: 'First people use it, then we talk about changing the world.' The garage is often lit late into the night, and the guards passing by say there is more laughter inside than typing.\nIn a corner of the garage stands a retired server rack, the test machine for the first batch of chips sent from Lucy's Chip City, which Josh turned into the team's 'home computing' and which heats the garage in winter as a bonus. The team has a tradition: on the day an app goes live everyone signs the garage wall, and three walls are now full, the fourth kept for the next batch of apps. Josh says the figure he cares about most is not downloads but whether users open the app again in their second week, and that is the number written every day on the little blackboard by the door."
    in: div_jjgxvk
    offset_km: [1.9, -3.2]
    site: { layout: block, size_m: [120, 120], rural: true }

  # 乔什葡萄园：十个品种各占一块，上排是坡上较热的红葡萄，下排是谷底较凉的黑皮诺和白葡萄
  - id: poi_5f1rt7
    subtype: vineyard
    status: generated
    names:
      zh: 乔什葡萄园·赤霞珠
      en: Josh Vineyard – Cabernet Sauvignon
      es: Viñedo de Josh – Cabernet Sauvignon
    short_names: { zh: 赤霞珠, en: Cabernet Sauvignon, es: Cabernet Sauvignon }
    notes:
      zh: "乔什葡萄园的赤霞珠园，在上排最西边，朝南朝西的坡面整个下午都晒得到太阳，是全园最热、最干的一块。赤霞珠皮厚、籽多、成熟晚，需要漫长而温暖的秋天才能把单宁养得圆润，这块坡地正好合适：白天的热让果实积累糖分和颜色，夜里从海上吹进谷地的凉风又保住了酸度。园里的土是风化的砂岩和碎石，排水快，葡萄藤只好把根扎得很深去找水，结出来的果粒小而浓。\n园子按传统的单篱架种植，行距两米多，行间种着苜蓿和野花，春天割下来翻进土里当肥料。每一行的行头都种着一丛玫瑰：玫瑰比葡萄更容易染上霉病，老农用它们当「哨兵」，乔什则在每丛玫瑰旁装了一个小摄像头，叶子上一出现斑点，手机上就会收到提醒。中间那条田间小路两旁立着几台防霜风扇，春天夜里气温骤降时会自动转起来，把上层的暖空气压到藤架上。\n赤霞珠是乔什酒庄的招牌，酿成的红酒要在橡木桶里放上两年才装瓶。乔什自己最喜欢的却是采收那几天：全庄园的人，连赛车手和车牌厂的工人都来帮忙剪葡萄，中午在行间铺开桌布吃饭。他说这是一年里唯一一次所有人都放下手机，因为两只手都占满了。\n赤霞珠园的边上有一个小池塘，收集雨水和山上流下来的泉水，干旱的夏天用来滴灌；池塘边住着几只野鸭和一窝猫头鹰，猫头鹰夜里在园里抓田鼠，乔什说它们是全园「最不用操心的员工」。"
      en: "The Cabernet Sauvignon block of Josh Vineyard, at the west end of the upper row, its south- and west-facing slope in the sun all afternoon, the hottest and driest block on the estate. Cabernet is thick-skinned, seedy and late to ripen, needing a long warm autumn to round out its tannins, and this slope suits it: the daytime heat builds sugar and colour, and the cool night wind off the sea keeps the acidity. The soil is weathered sandstone and gravel that drains fast, so the vines have to root deep for water, and the berries come small and concentrated.\nThe block is planted on a traditional single trellis, rows a little over two metres apart, with clover and wild flowers between them that are cut in spring and turned in as fertiliser. A rose bush stands at the head of every row: roses catch mildew more readily than vines, so old growers used them as sentinels, and Josh has put a small camera beside each one, so a spotted leaf sends an alert to his phone. Frost fans stand along the track down the middle, starting by themselves on cold spring nights to push the warmer air above down onto the vines.\nCabernet is the flagship of Josh Winery, its wine spending two years in oak before bottling. What Josh likes best, though, are the days of harvest, when everyone on the estate, racing drivers and plate workers included, comes to cut grapes, and at noon tablecloths are spread between the rows for lunch. He says it is the only time of year when everyone puts their phone down, because both hands are full.\nAt the edge of the Cabernet block is a small pond that gathers rain and spring water from the mountain for drip irrigation in dry summers; a few wild ducks and a family of owls live beside it, and the owls hunt voles in the vines at night, which Josh says makes them 'the staff I worry about least'."
    in: div_jjgxvk
    offset_km: [3.6, -1.8]
    site: { layout: vineyard, angle_deg: 0, variant: red, size_m: [900, 700] }
  - id: poi_rwymqp
    subtype: vineyard
    status: generated
    names:
      zh: 乔什葡萄园·西拉
      en: Josh Vineyard – Syrah
      es: Viñedo de Josh – Syrah
    short_names: { zh: 西拉, en: Syrah, es: Syrah }
    notes:
      zh: "乔什葡萄园的西拉园，在赤霞珠园东边，坡度更陡，土里夹着大块的白色石头。西拉喜欢热，也耐得住旱，果实颜色深得几乎发黑，酿出来的酒带着黑胡椒、黑橄榄和烟熏的香气。在凉一点的年份，它会多出一丝紫罗兰的花香，酿酒师说这是西拉在「提醒你它来自山坡」。\n这块园子的石头是乔什特意留下来的：白天石头吸足了热，夜里再慢慢把热放给葡萄藤，让果实在昼夜温差里成熟得更均匀。坡太陡，拖拉机上不去，园里的活大多靠人和两台履带式的小机器人：一台负责除草，一台负责在采收前一周每天巡一遍，用光谱相机给每一串葡萄打分，告诉采收队先摘哪几行。机器人的名字是车牌厂的工人起的，一个叫「慢慢」，一个叫「再等等」，因为它们最常给出的建议就是这两句。\n西拉在乔什酒庄里有两种酿法：一种单独装瓶，浓烈而有力；另一种和少量白葡萄维欧尼一起发酵，颜色反而更稳、香气更亮，这个老办法是一位来庄园做客的老酿酒师教的。乔什把这款酒取名「朋友」，每年第一桶总是送去露西的芯城，因为露西说过，她喝过的最好的一杯西拉是在乔什的长餐桌上。\n西拉园的园头有一间小小的工具棚，棚前的空地是采收时临时停放葡萄筐的地方，棚里挂着每一位采收队员的剪刀，刀柄上刻着各自的名字。乔什的那把剪刀刀柄最旧，他说这是全庄园唯一一件他不打算用应用来改进的东西。"
      en: "The Syrah block of Josh Vineyard, east of the Cabernet, on a steeper slope whose soil is full of large white stones. Syrah loves heat and stands drought well; its fruit is so dark it is nearly black, and its wine smells of black pepper, black olive and smoke. In cooler years it gains a hint of violets, which the winemaker says is Syrah 'reminding you it comes from a hillside'.\nJosh left the stones there on purpose: they soak up heat by day and give it back to the vines slowly at night, so the fruit ripens more evenly through the swing between day and night. The slope is too steep for tractors, so most of the work falls to people and two small tracked robots, one that weeds and one that patrols every day in the week before harvest, scoring each bunch with a spectral camera and telling the pickers which rows to take first. The plate workers named them: one is called 'Slowly' and the other 'Wait a Bit', those being the two pieces of advice they give most often.\nJosh Winery makes Syrah two ways: bottled on its own, dark and powerful, or fermented with a little white Viognier, which oddly makes the colour steadier and the aroma brighter, an old method taught by a veteran winemaker who once stayed on the estate. Josh calls that wine 'Friend', and the first barrel each year always goes to Lucy's Chip City, because Lucy once said the best glass of Syrah she ever had was at Josh's long table.\nAt the head of the Syrah block is a small tool shed, the ground in front of it where grape baskets wait at harvest, and inside hang the secateurs of every picker, each handle carved with its owner's name. Josh's handle is the most worn, and he says they are the one thing on the estate he has no plans to improve with an app."
    in: div_jjgxvk
    offset_km: [4.6, -1.8]
    site: { layout: vineyard, angle_deg: 0, variant: red, size_m: [900, 700] }
  - id: poi_c0zmts
    subtype: vineyard
    status: generated
    names:
      zh: 乔什葡萄园·仙粉黛
      en: Josh Vineyard – Zinfandel
      es: Viñedo de Josh – Zinfandel
    short_names: { zh: 仙粉黛, en: Zinfandel, es: Zinfandel }
    notes:
      zh: "乔什葡萄园的仙粉黛园，在上排正中，是全园年纪最大的一块：这里的老藤是乔什买下庄园时就有的，不搭架子，一棵一棵像小树一样独自站着，树干粗糙扭曲，当地人叫它们「老头藤」。仙粉黛的果串成熟得很不整齐，同一串上常常有青果、熟果和已经开始皱缩的果粒，酿出来的酒果香浓郁，像熟透的黑莓和覆盆子果酱，还带一点甘草和香料的味道。\n老藤产量低，一棵藤只结几串葡萄，按产量算这块园子是全庄园最「不划算」的，好几位顾问都建议把它拔掉改种更值钱的品种。乔什没有同意，他给每一棵老藤编了号、拍了照，做成一张可以点开的地图，记录每一棵藤的年产量、病害和修剪记录，还给几棵特别老的藤起了名字。他说这些藤在他之前就在这里了，他只是暂时照看它们。\n仙粉黛园的采收要分好几次：采收队先摘熟透的那几串，过一个星期再回来摘剩下的。酒庄用它酿两款酒，一款是浓郁的红酒，另一款是淡粉色的桃红，夏天在泳池边喝。庄园的孩子们最喜欢这块园子，因为老藤矮，伸手就能摘到葡萄，大人们也就假装没看见。\n仙粉黛来到加州的路很长：它和欧洲一种古老的葡萄其实是同一个品种，是靠基因检测才确认下来的。乔什听说以后，在园头立了一块牌子，写着「远亲相认」。每年冬天修剪老藤的时候，乔什会亲自来剪最老的那几棵，剪下来的枝条不扔，做成插条分给附近的果农，让老藤的后代在别人的园子里也长下去。"
      en: "The Zinfandel block of Josh Vineyard, in the middle of the upper row and the oldest on the estate: its old vines were already here when Josh bought the land. They grow untrellised, each standing alone like a small tree with a rough, twisted trunk, and locals call them 'the old men'. Zinfandel ripens very unevenly, one bunch often carrying green, ripe and already shrivelling berries together, and its wine is rich with fruit, like overripe blackberries and raspberry jam, with a touch of liquorice and spice.\nOld vines yield little, only a few bunches each, so by output this is the least 'efficient' block on the estate, and several consultants advised pulling it up for more valuable varieties. Josh refused. He numbered and photographed every old vine and made a clickable map recording each one's yield, diseases and pruning, and gave a few of the oldest names. He says these vines were here before him and he is only looking after them for a while.\nThe Zinfandel is picked in several passes: the pickers take the ripest bunches first and come back a week later for the rest. The winery makes two wines from it, a rich red and a pale pink rosé for summer by the pool. The estate's children love this block best, because the old vines are low enough to pick from, and the adults pretend not to notice.\nZinfandel came a long way to California: it is in fact the same variety as an old European grape, which was only confirmed by genetic testing. When Josh heard that, he put up a sign at the head of the block reading 'Long-lost relatives'. Each winter, when the old vines are pruned, Josh cuts the oldest few himself, and the cuttings are not thrown away but given to growers nearby, so the old vines' offspring grow on in other people's vineyards too."
    in: div_jjgxvk
    offset_km: [5.6, -1.8]
    site: { layout: vineyard, angle_deg: 0, variant: red, size_m: [900, 700] }
  - id: poi_yp01jq
    subtype: vineyard
    status: generated
    names:
      zh: 乔什葡萄园·梅洛
      en: Josh Vineyard – Merlot
      es: Viñedo de Josh – Merlot
    short_names: { zh: 梅洛, en: Merlot, es: Merlot }
    notes:
      zh: "乔什葡萄园的梅洛园，在上排偏东，坡面朝东，上午阳光充足，下午早早就进了阴影，比西边几块凉快一些。梅洛比赤霞珠成熟得早，果粒大、皮薄，酿出来的酒柔和圆润，带着李子、樱桃和巧克力的味道，单宁细腻，年轻时就很好喝。乔什常说，赤霞珠是请客人时开的酒，梅洛是自己周二晚上开的酒。\n梅洛的土是园里黏性最重的一块，蓄水好，正合这个怕旱的品种。可黏土也容易积水，乔什在园子底下埋了一套排水管，又在每隔几行的地方插了土壤湿度探头，数据直接接进他自己写的灌溉程序：哪一行的土干了，就只给哪一行滴几分钟的水。程序上线第一年，园里的用水量少了将近一半，酿酒师说葡萄的味道反而更集中了。\n在乔什酒庄，梅洛最重要的用途是和赤霞珠、品丽珠调配，三种葡萄各占几成，每年由酿酒师和乔什在品酒室里一杯一杯试出来。调配那天是酒庄的大日子，长桌上摆满几十个编了号的杯子，谁都可以来投票。有一年车牌厂的一位老工人投中了最后选定的比例，他得到的奖品是一块印着自己名字的车牌，挂在酒窖门口。\n梅洛园的东头立着一座木头瞭望台，是给来参观的学校准备的，孩子们爬上去可以看见十块园子各自的颜色：秋天梅洛的叶子先变红，赤霞珠慢一些，白葡萄的叶子则变成金黄。瞭望台上挂着一块牌子，教大家怎么从叶子的颜色认出葡萄的品种，下面还有一行小字：「认错了也没关系，葡萄不会生气。」"
      en: "The Merlot block of Josh Vineyard, toward the east of the upper row, on an east-facing slope that gets plenty of morning sun and falls into shade early in the afternoon, a little cooler than the blocks to the west. Merlot ripens earlier than Cabernet, with bigger, thinner-skinned berries, and makes a soft, round wine tasting of plum, cherry and chocolate, its tannins fine and good to drink young. Josh often says Cabernet is the wine you open for guests and Merlot the wine you open for yourself on a Tuesday.\nIts soil is the heaviest clay on the estate and holds water well, which suits this drought-shy variety. But clay also waterlogs, so Josh laid drains beneath the block and put soil moisture probes every few rows, wired straight into an irrigation program he wrote himself: whichever row is dry gets a few minutes of drip and no more. In the program's first year the block's water use fell by nearly half, and the winemaker says the grapes tasted more concentrated, not less.\nAt Josh Winery Merlot is mostly blended with Cabernet Sauvignon and Cabernet Franc, the share of each worked out every year by the winemaker and Josh glass by glass in the tasting room. Blending day is a big day: the long table is laid with dozens of numbered glasses and anyone may vote. One year an old worker from the plate factory picked the very proportions finally chosen, and his prize was a number plate bearing his own name, now hanging by the cellar door.\nAt the east end of the Merlot block stands a wooden lookout tower for visiting schools, from which children can see the ten blocks each in its own colour: in autumn the Merlot leaves turn red first, the Cabernet a little later, and the white grapes' leaves go gold. A board on the tower teaches how to tell the varieties by their leaves, with a line of small print beneath: 'Don't worry if you get it wrong; grapes don't mind.'"
    in: div_jjgxvk
    offset_km: [6.6, -1.8]
