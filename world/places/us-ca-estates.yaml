  - id: poi_an4njn
    subtype: zoo
    status: generated
    names:
      zh: 露西动物园·灵长馆
      en: Lucy Zoo – Primate House
      es: Zoológico de Lucy – Casa de Primates
    short_names: { zh: 灵长馆, en: Primate House, es: Primates }
    notes:
      zh: "灵长馆是露西动物园最热闹的场馆，住着猩猩、长臂猿、狐猴、卷尾猴和几种小型猴子。场馆中央是一片椭圆形的水面，水里散布着几座小岛，每座岛上都种着树、搭着绳网和木台，不同种类的灵长类住在不同的岛上：很多灵长类不会游泳，水面就是天然的隔离带，不需要笼子。长臂猿的岛上树最高，它们每天清晨在树梢之间荡来荡去，边荡边唱，叫声能传到芯城另一头的设计中心。\n场馆的室内部分是一座有玻璃顶的热带温室，冬天动物们可以回到里面取暖。温室的温度和湿度由生命维持系统控制，模仿的是热带雨林的昼夜变化：早上潮湿起雾，中午闷热，傍晚下一场人工的雨。猩猩的室内活动区里放着一块触摸屏，上面是饲养员和研究人员设计的认知游戏，答对了会掉出一颗坚果；一只老年雄性猩猩最喜欢的游戏是给屏幕上的图形排序，饲养员说它比很多实习生都有耐心。\n灵长馆还负责几个保育繁育项目，园里出生的小猩猩和小长臂猿会和其他动物园交换，避免近亲繁殖。露西自己最喜欢的是狐猴，她说狐猴晒太阳的样子很像晶圆厂夜班结束后坐在台阶上的工程师：张开双臂，闭着眼睛，什么都不想。\n灵长馆岛上种的树大多会结果：无花果、香蕉和几种热带果树，猩猩和猴子可以自己摘果子吃，饲养员只在果子不够的季节补充。岛与岛之间的水面上有时漂来几片树叶，长臂猿会弯下腰去够，像在照镜子。"
      en: "The Primate House is the liveliest at Lucy Zoo, home to orangutans, gibbons, lemurs, capuchins and several small monkeys. At its centre is an oval sheet of water scattered with small islands, each planted with trees and hung with rope nets and wooden platforms, and different primates live on different islands: many primates cannot swim, so the water is a natural barrier and no cages are needed. The gibbons' island has the tallest trees, and every morning they swing through the treetops singing as they go, their calls carrying to the design centre at the far side of Chip City.\nThe indoor part is a glass-roofed tropical glasshouse where the animals can retreat to keep warm in winter. Its temperature and humidity are run by the life-support system to mimic a rainforest's day: damp and misty in the morning, sultry at noon, an artificial shower at dusk. In the orangutans' indoor area is a touchscreen of cognitive games designed by keepers and researchers, which drops a nut for every right answer; an old male's favourite game is putting shapes on the screen in order, and the keepers say he is more patient than many interns.\nThe house also runs several conservation breeding programmes, and young orangutans and gibbons born here are exchanged with other zoos to avoid inbreeding. Lucy's own favourites are the lemurs; she says a sunbathing lemur looks just like an engineer sitting on the steps after a night shift at the fab: arms spread, eyes closed, thinking of nothing.\nMost of the trees on the islands bear fruit, figs, bananas and several tropical fruit trees, so the apes and monkeys can pick their own and the keepers top up only in lean seasons. Leaves sometimes drift on the water between the islands, and the gibbons lean down to reach them as if looking in a mirror."
    in: div_zmb3gb
    offset_km: [-12.4, 1.3]
    site: { layout: zoo, angle_deg: 0, variant: primates, size_m: [700, 550] }
  - id: poi_ccd5kg
    subtype: zoo
    status: generated
    names:
      zh: 露西动物园·猫科馆
      en: Lucy Zoo – Cat House
      es: Zoológico de Lucy – Casa de Felinos
    short_names: { zh: 猫科馆, en: Cat House, es: Felinos }
    notes:
      zh: "猫科馆住着老虎、狮子、雪豹、猎豹和几种小型野猫，是全园面积最大的场馆之一。每一种大猫都有自己的一片围场，围场之间用深沟和隐藏在植物后面的围栏隔开，游客站在高处的步道上往下看，看不到笼子，只看到草地、岩石和树林。狮子的围场是一片开阔的草坡，中间有一块晒得发烫的大石头；老虎的围场有一条小溪和一个水池，夏天老虎喜欢泡在水里，只露出脑袋；雪豹的围场是一座人工的岩山，山顶的温度由生命维持系统调低，模拟高山的凉爽。\n大猫天生要捕猎，长期圈养容易无聊、焦躁。猫科馆的饲养员设计了很多「丰容」装置：会自己移动的肉块、挂在树上要跳起来才够得着的食物、藏在箱子里的气味。猎豹的围场里有一条长长的直道，饲养员用一根拉线拖着诱饵让猎豹追，猎豹冲刺的时候，看台上的孩子们会一起喊出声。每头动物身上都没有项圈，但围场里的摄像头会自动识别个体，记录它们每天走了多远、睡了多久、吃了多少，兽医据此判断谁可能生病了。\n猫科馆的饲养员都知道露西的一个小习惯：每次来，她都会在雪豹的岩山前站很久。她说雪豹是最懂得「省电」的动物，大部分时间一动不动，只在真正需要的时候才出手，「好的芯片也应该这样」。\n猫科馆还设有一间育幼室，园里出生的小老虎和小雪豹在这里由兽医照顾，透过一面单向玻璃，游客可以看到它们打滚、咬尾巴，却不会打扰到它们。"
      en: "The Cat House is home to tigers, lions, snow leopards, cheetahs and several small wild cats, and is one of the largest houses in the zoo. Each big cat has its own enclosure, separated by deep ditches and fences hidden behind planting, so visitors looking down from the raised walkways see no cages, only grass, rock and woodland. The lions have an open grassy slope with a big sun-baked boulder in the middle; the tigers have a stream and a pool, where in summer they like to soak with only their heads showing; the snow leopards have an artificial crag whose summit is kept cool by the life-support system to mimic the mountains.\nBig cats are born to hunt, and long captivity easily makes them bored and restless. The keepers have devised many enrichment devices: meat that moves by itself, food hung in trees that must be leapt for, scents hidden in boxes. The cheetahs' enclosure has a long straight where keepers drag a lure on a line for them to chase, and when a cheetah sprints the children in the stands all shout together. No animal wears a collar, but cameras in the enclosures recognise individuals automatically and log how far each walks, how long it sleeps and how much it eats, from which the vets judge who may be falling ill.\nThe keepers all know one of Lucy's little habits: on every visit she stands a long time before the snow leopards' crag. She says the snow leopard is the animal that best understands 'saving power', staying still most of the time and moving only when it truly must; 'a good chip should be the same.'\nThe house also has a nursery where tiger and snow leopard cubs born in the zoo are cared for by the vets, and through a one-way window visitors can watch them roll about and chew each other's tails without disturbing them."
    in: div_zmb3gb
    offset_km: [-11.6, 1.3]
    site: { layout: zoo, angle_deg: 0, variant: felids, size_m: [700, 550] }
  - id: poi_sxhkec
    subtype: zoo
    status: generated
    names:
      zh: 露西动物园·有蹄馆
      en: Lucy Zoo – Hoofed Animal House
      es: Zoológico de Lucy – Casa de Ungulados
    short_names: { zh: 有蹄馆, en: Hoofed Animals, es: Ungulados }
    notes:
      zh: "有蹄馆是一片模仿草原的大围场，住着长颈鹿、斑马、羚羊、犀牛、河马和野牛。围场中央是一片起伏的草地，几棵孤零零的大树撑开伞一样的树冠，旁边是一个浑浊的水塘，河马整天泡在里面，只在傍晚爬上岸吃草。长颈鹿的屋子是全园最高的建筑，门洞足有六米高，二楼有一圈观景台，游客可以和长颈鹿面对面，看它用长长的舌头卷走饲养员手里的树叶。\n不同的动物混养在一起，就像在真正的草原上一样：斑马和羚羊成群地吃草，犀牛独来独往，野牛在围场一角占了一块地盘。围场的地面下埋着一层传感器，能感知动物在哪里、走得快不快，一旦有动物跑得不对劲，兽医的手机就会收到提醒。草地分成几块轮流放牧，休息的那块由喷灌系统浇水，长好了再开放，这套轮牧方法是从乔什葡萄园的灌溉系统借来的。\n有蹄馆最受孩子们欢迎的是每天下午的「长颈鹿午茶」，饲养员把一筐树叶挂到高处，长颈鹿们排着队来吃，孩子们则在下面数它们一共低了几次头。露西喜欢看犀牛，她说犀牛看起来笨重，其实跑起来很快，「就像一家老牌的存储公司，大家都以为它跑不动了，它一转身就是一个新周期」。\n有蹄馆的野牛是美洲本地的物种，曾经在北美大草原上成群奔跑，后来一度被猎杀到濒临灭绝，靠保育才慢慢恢复。有蹄馆把它们安排在离入口最近的地方，说明牌上写着：「这片土地原来的主人之一。」"
      en: "The Hoofed Animal House is a great enclosure modelled on the savannah, home to giraffes, zebras, antelopes, rhinoceroses, hippopotamuses and bison. At its centre is rolling grassland where a few lone trees spread umbrella crowns beside a muddy pool, in which the hippos soak all day, climbing out to graze only at dusk. The giraffe house is the tallest building in the zoo, its doorways a full six metres high, with a viewing gallery on the upper floor where visitors meet the giraffes face to face and watch them curl leaves out of a keeper's hand with their long tongues.\nThe animals share the ground as on a real savannah: zebras and antelopes graze in herds, the rhinos keep to themselves and the bison hold a patch in one corner. Under the ground lies a layer of sensors that senses where the animals are and how fast they move, and if one runs oddly the vets' phones get an alert. The grass is split into plots grazed in turn, the resting plot watered by sprinklers and reopened once it has grown back, a rotation borrowed from the irrigation of Josh Vineyard.\nThe children's favourite is the daily 'giraffe tea', when keepers hang a basket of leaves up high and the giraffes queue to eat while the children below count how many times they bow their heads. Lucy likes watching the rhinos; she says they look ponderous but run fast, 'like an old memory company: everyone thinks it can't move, and then it turns round and it's a new cycle.'\nThe bison are native to the Americas; they once roamed the North American plains in great herds, were hunted almost to extinction and recovered slowly only through conservation. The house keeps them nearest the entrance, and their label reads: 'One of this land's first owners.'"
    in: div_zmb3gb
    offset_km: [-10.8, 1.3]
    site: { layout: zoo, angle_deg: 0, variant: ungulates, size_m: [700, 550] }
  - id: poi_pd7s22
    subtype: zoo
    status: generated
    names:
      zh: 露西动物园·海洋哺乳馆
      en: Lucy Zoo – Marine Mammal House
      es: Zoológico de Lucy – Casa de Mamíferos Marinos
    short_names: { zh: 海洋哺乳馆, en: Marine Mammals, es: Mamíferos Marinos }
    notes:
      zh: "海洋哺乳馆住着海狮、海豹、海獭和海牛。场馆的主体是一个大海水池，池子一边是人工的礁石海岸，海狮和海豹在上面晒太阳、吵架、打盹；另一边是一面长长的水下观察窗，游客可以看到它们在水里灵活得像换了一种动物。海獭有一个单独的小池，池边铺着海藻，它们最出名的本事是仰面漂在水上，把石头放在肚子上砸开贝壳。海牛住在另一个温水池里，慢吞吞地啃着生菜，一啃就是一个下午。\n场馆里的海水不是从海里运来的，而是在馆内用淡水和海盐配出来的，再经过过滤、杀菌和温度控制循环使用。水处理车间就在池子下面，管道和泵站整齐地排成一排，和晶圆厂的超纯水站出自同一个设计团队之手，只是这里要的不是「越纯越好」，而是「越像大海越好」：盐度、酸碱度和水温都要模仿动物原来生活的海域。\n海洋哺乳馆没有表演，饲养员每天的训练只为体检：让海狮自己张嘴给兽医看牙，伸出鳍状肢让人量体温，趴在秤上称体重。露西觉得这样很好，「它们不欠我们一场表演」。不过有一项活动是例外：每年露西牙科诊所会派牙医来给海狮做一次口腔检查，那一天来围观的员工比游客还多。\n海獭池边常有研究人员蹲着做记录：海獭吃海胆，海胆吃海藻，海獭多了，海藻森林才长得好，所以海獭被称为海藻森林的「守护者」。海洋鱼馆的海藻森林展缸，就在走廊的另一头。"
      en: "The Marine Mammal House is home to sea lions, seals, sea otters and manatees. Its heart is a big seawater pool, one side an artificial rocky shore where the sea lions and seals sunbathe, squabble and doze, the other a long underwater viewing window through which visitors see how nimble they become in the water, as if a different animal. The sea otters have a pool of their own edged with kelp, and their most famous trick is floating on their backs and cracking shells on stones laid on their bellies. The manatees live in another, warm pool, slowly munching lettuce for whole afternoons.\nThe seawater is not brought from the sea but mixed in the house from fresh water and sea salt, then filtered, sterilised, temperature-controlled and recirculated. The water treatment plant is right under the pools, its pipes and pumps in a neat row, designed by the same team as the fabs' ultrapure water plant; only here the aim is not 'the purer the better' but 'the more like the sea the better', salinity, acidity and temperature all matched to the waters the animals came from.\nThere are no shows. The keepers' daily training is purely for check-ups: a sea lion opens its own mouth for the vet to see its teeth, holds out a flipper for its temperature to be taken and lies on the scales to be weighed. Lucy thinks this is right: 'they don't owe us a show.' One event is the exception: once a year Lucy Dental Clinic sends a dentist to check the sea lions' teeth, and more staff come to watch that day than visitors.\nResearchers often crouch by the otter pool taking notes: otters eat sea urchins and sea urchins eat kelp, so where otters thrive the kelp forest does too, which is why otters are called the kelp forest's 'guardians'. The Sea Fish House's kelp forest display is at the other end of the corridor."
    in: div_zmb3gb
    offset_km: [-10.0, 1.3]
    site: { layout: zoo, angle_deg: 0, variant: marine_mammals, size_m: [700, 550] }
  - id: poi_kjnxxw
    subtype: zoo
    status: generated
    names:
      zh: 露西动物园·极地馆
      en: Lucy Zoo – Polar House
      es: Zoológico de Lucy – Casa Polar
    short_names: { zh: 极地馆, en: Polar House, es: Polar }
    notes:
      zh: "极地馆是露西动物园技术含量最高的场馆，在加州的阳光下维持着一个终年零下的世界。场馆分成南北两半：北半边住着北极狐、雪鸮和北极熊，模仿的是北极的苔原和浮冰；南半边住着帝企鹅、王企鹅和巴布亚企鹅，模仿的是南极的冰架和海岸。两边的光照节律也不一样，北半边按北极的季节变化昼夜长短，南半边则正好反过来，所以夏天来参观的人会在南半边看到企鹅在极夜的蓝光里挤成一团。\n场馆屋顶铺满了太阳能板，发出的电大部分用来制冷；馆内的冰和雪由造雪机和制冰机每天补充，冰面下面埋着冷却管，像一块巨大的冰场。北极熊的池子是一个深水池，熊在水里游泳时，游客可以从水下观察窗里看到它巨大的脚掌。企鹅区的「海滩」由碎冰和砾石铺成，企鹅每年在上面用小石子筑巢，饲养员会提前在旁边多放一些石头，免得它们互相偷。\n极地馆还和北冰洋领地的研究机构合作，记录冰面温度、企鹅的繁殖时间和北极熊的体重变化。露西说极地馆让她想起晶圆厂里那些最精密的设备：「环境稍微偏一点，结果就完全不同。」每年最热的那一天，极地馆会对附近的居民开放一个下午，让大家进来凉快凉快，门口排的队一直排到猫科馆。\n极地馆的出口有一间小屋，墙上挂着一排温度计，从零下二十度一直到馆外的三十多度，游客出门时要穿过这间屋子慢慢「回暖」，孩子们管它叫「时光隧道」。"
      en: "The Polar House is the most technically demanding at Lucy Zoo, keeping a world below freezing all year round under the California sun. It is split in two: the northern half, home to Arctic foxes, snowy owls and polar bears, mimics the Arctic tundra and pack ice; the southern half, home to emperor, king and gentoo penguins, mimics the Antarctic ice shelves and shores. The light runs differently in each, the north following the Arctic's seasons and the south the reverse, so summer visitors find the penguins huddled together in the blue light of the polar night.\nThe roof is covered in solar panels whose power goes mostly to refrigeration; the ice and snow inside are topped up daily by snow and ice machines, and cooling pipes run under the ice like a giant rink. The polar bears' pool is deep, and when a bear swims visitors at the underwater window can see its huge paws. The penguins' 'beach' is crushed ice and gravel, where every year they build nests of pebbles; the keepers put out extra stones in advance so they do not steal each other's.\nThe house also works with research institutes in the Arctic Ocean Territory, recording ice temperatures, penguin breeding times and the polar bears' weight. Lucy says it reminds her of the most precise tools in the fab: 'move the environment a little and the result is completely different.' On the hottest day of every year the Polar House opens to local residents for an afternoon to cool off, and the queue stretches all the way to the Cat House.\nAt the exit is a small room hung with a row of thermometers running from minus twenty to the thirty-odd degrees outside, through which visitors 'warm up' slowly on their way out; the children call it the 'time tunnel'."
    in: div_zmb3gb
    offset_km: [-9.2, 1.3]
