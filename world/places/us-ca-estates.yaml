  - id: poi_t79qsf
    subtype: zoo
    status: generated
    names:
      zh: 露西动物园·鸟馆
      en: Lucy Zoo – Aviary
      es: Zoológico de Lucy – Aviario
    short_names: { zh: 鸟馆, en: Aviary, es: Aviario }
    notes:
      zh: "鸟馆是一座巨大的网罩，像一顶透明的帐篷罩住了一整片树林、一个湖和几块湿地，游客走在网罩里的木栈道上，鸟就在头顶和身边飞。网罩里住着几百种鸟：湖上有火烈鸟、天鹅和各种鸭子，湿地里站着鹭和鹳，树林里是犀鸟、鹦鹉、巨嘴鸟和蜂鸟。网罩外面另有几间单独的鸟舍，住着鹰、雕、猫头鹰这些猛禽，它们需要更大的空间，也不能和小鸟住在一起。\n网罩的网是用一种很细的不锈钢丝编成的，从远处看几乎是透明的；网罩顶上装着一圈喷雾管，夏天中午自动喷出细雾降温，傍晚夕阳照在雾上会出现彩虹。湖水由生命维持系统循环过滤，湿地里的芦苇和水草也有专人照料。网罩的入口是两道门之间的一个小小的「气闸」，和晶圆厂洁净室的风淋室很像，只是这里防的不是灰尘，而是想偷偷飞出去的鸟。\n鸟馆最受欢迎的是每天早上的「百鸟早餐」，饲养员在各处的喂食台放上水果、种子和小鱼，几分钟之内整个网罩都热闹起来。从露西宅邸的泳池平台望过去，傍晚的夕阳正好落在鸟馆的网罩上，她说那是她每天最喜欢的时刻：「一天里所有的鸟都回家了。」\n鸟馆的湖心有一座小岛，岛上不让人上去，是专门给水鸟筑巢的地方；繁殖季的时候，饲养员在岸边架起望远镜，游客可以看到火烈鸟用泥巴垒起一个个小土堆当巢，一只一只地孵蛋。网罩边上还有一间救护站，附近受伤的野鸟会被送到这里，治好以后再放飞。"
      en: "The Aviary is a huge net dome, like a transparent tent over a whole wood, a lake and several patches of marsh; visitors walk boardwalks inside it while birds fly overhead and all around. Hundreds of species live in it: flamingos, swans and all kinds of ducks on the lake, herons and storks in the marsh, hornbills, parrots, toucans and hummingbirds in the wood. Outside the dome are separate aviaries for birds of prey, hawks, eagles and owls, which need more space and cannot live with the small birds.\nThe netting is woven of very fine stainless-steel wire and from a distance looks almost transparent; a ring of misting pipes along the top sprays fine mist to cool things at summer noon, and at dusk the setting sun makes rainbows in it. The lake water is filtered and recirculated by the life-support system, and the reeds and water plants of the marsh have their own keepers. The entrance is a small 'airlock' between two doors, much like a cleanroom's air shower, except that here it keeps in not dust but birds that would like to slip out.\nThe favourite event is the morning 'birds' breakfast', when keepers set out fruit, seed and small fish on feeding tables all over and within minutes the whole dome comes alive. From the pool terrace of Lucy's House the evening sun sets right over the Aviary's netting, and she says it is her favourite moment of the day: 'all the birds have come home.'\nIn the middle of the lake is a small island where no one may land, kept for water birds to nest; in the breeding season keepers set up telescopes on the shore, through which visitors can watch the flamingos build little mounds of mud as nests and sit on their eggs one by one. Beside the dome is a rescue station where injured wild birds from the area are brought, nursed and set free again."
    in: div_zmb3gb
    offset_km: [-8.4, 1.3]
    site: { layout: zoo, angle_deg: 0, variant: birds, size_m: [700, 550] }
  - id: poi_75rqm7
    subtype: zoo
    status: generated
    names:
      zh: 露西动物园·爬行馆
      en: Lucy Zoo – Reptile House
      es: Zoológico de Lucy – Casa de Reptiles
    short_names: { zh: 爬行馆, en: Reptile House, es: Reptiles }
    notes:
      zh: "爬行馆住着鳄鱼、巨蜥、陆龟、海龟、蟒蛇、变色龙和各种蜥蜴。爬行动物是冷血动物，体温随环境变化，所以爬行馆里的每一个展箱都是一个独立的小气候：沙漠展箱白天烤得发烫、夜里迅速变凉；雨林展箱终年潮湿闷热；河岸展箱的水温和气温分开控制，让鳄鱼可以在岸上晒太阳、在水里降温。每个展箱里都有一块「晒背点」，一盏专门的灯照出一小片热区，动物需要暖和的时候就爬过去趴着。\n场馆中央是一条室内的河，河里住着几条鳄鱼，河上架着一座玻璃底的小桥，游客走在上面，脚下就是鳄鱼的背。场馆东边是陆龟的室外草场，几只上了年纪的巨型陆龟慢慢地在草地上走来走去，它们的体重每个月都要称一次，饲养员说称一只陆龟要四个人帮忙，称完了陆龟连头都懒得回。海龟住在一个大水箱里，多数是从海边救护回来的伤病个体，等伤好了再放回大海。\n爬行馆的生命维持系统要记录的数据比其他场馆都多，因为每种动物需要的温度、湿度和紫外线都不一样，一个参数出错，动物就可能生病。露西很喜欢变色龙，她说变色龙的眼睛能各转各的，一只看前面、一只看后面，「这才是做存储的人该有的眼睛：一只看下一代工艺，一只看价格」。\n爬行馆的蟒蛇区每周有一次「蜕皮观察」，蛇蜕下的完整的皮会被饲养员晾干，挂在走廊里，旁边标着蛇的名字和蜕皮的日期，孩子们最喜欢量一量这一次的皮比上一次长了多少。"
      en: "The Reptile House is home to crocodiles, monitor lizards, tortoises, turtles, pythons, chameleons and all kinds of lizards. Reptiles are cold-blooded, their body temperature following their surroundings, so every display in the house is a separate little climate: the desert displays bake by day and cool quickly at night, the rainforest ones are humid and sultry all year, and the riverbank ones control water and air temperature separately so the crocodiles can bask on the bank and cool off in the water. Each display has a 'basking spot', a lamp throwing a small hot zone, where animals crawl to lie when they want warmth.\nAt the centre of the house is an indoor river with several crocodiles, crossed by a small glass-floored bridge so visitors walk with crocodiles' backs beneath their feet. To the east is the tortoises' outdoor meadow, where some elderly giant tortoises amble about the grass; they are weighed every month, and the keepers say weighing one takes four people, after which the tortoise cannot even be bothered to look round. The turtles live in a big tank, most of them injured or sick animals rescued from the coast, to be returned to the sea once healed.\nThe life-support system records more data here than in any other house, since each animal needs different temperature, humidity and ultraviolet, and a single wrong setting can make one ill. Lucy is fond of the chameleons; she says their eyes can turn independently, one looking forward and one back, 'which is what the eyes of a memory person should be like: one on the next process node and one on the price.'\nEvery week the python section holds a 'shed watch'; the whole skins the snakes slough are dried by the keepers and hung in the corridor labelled with each snake's name and the date, and children love measuring how much longer this skin is than the last."
    in: div_zmb3gb
    offset_km: [-7.6, 1.3]
    site: { layout: zoo, angle_deg: 0, variant: reptiles, size_m: [700, 550] }
  - id: poi_06cx9x
    subtype: zoo
    status: generated
    names:
      zh: 露西动物园·两栖馆
      en: Lucy Zoo – Amphibian House
      es: Zoológico de Lucy – Casa de Anfibios
    short_names: { zh: 两栖馆, en: Amphibian House, es: Anfibios }
    notes:
      zh: "两栖馆是露西动物园里最潮湿的地方，住着箭毒蛙、树蛙、蝾螈、大鲵和美西螈。两栖动物的皮肤很薄，要靠皮肤呼吸和吸水，对温度、湿度和水质的变化非常敏感，在世界很多地方，它们是最先受到环境变化伤害的动物。两栖馆因此是全园对环境控制要求最严的场馆之一：每个展箱的湿度都保持在很高的水平，雾化器每隔一会儿喷一次细雾，水全部经过过滤和消毒，饲养员进出要换鞋、洗手，防止把病菌带进去。\n场馆里最显眼的是一排色彩鲜艳的箭毒蛙展箱，红的、蓝的、黄的、黑白条纹的，小得像一颗颗糖果。它们在野外的毒性来自吃下的某些昆虫，在动物园里换了食物，毒性就慢慢消失了。另一边是一条模拟山间溪流的长水槽，水很凉、流得很快，住着大鲵，大鲵是现存体型最大的两栖动物，白天藏在石头底下，晚上才出来找吃的。美西螈住在一组安静的水箱里，粉红色的外鳃像一圈羽毛，它们能够再生失去的肢体，是研究人员很感兴趣的动物。\n两栖馆还有一间不对外开放的「方舟室」，保存着几种野外数量很少的蛙类，每一种都有独立的房间和独立的空气系统，以防一种疾病传遍全部。露西说方舟室是整个动物园里她最骄傲的房间，因为它做的事情和洁净室一样：「把最脆弱的东西保护起来，等世界准备好再放出去。」"
      en: "The Amphibian House is the dampest place in Lucy Zoo, home to poison dart frogs, tree frogs, newts, giant salamanders and axolotls. Amphibians have thin skins through which they breathe and take in water, making them very sensitive to changes in temperature, humidity and water quality; in many parts of the world they are the first animals hurt by environmental change. So this is one of the most tightly controlled houses in the zoo: every display is kept very humid, misters spray fine mist every so often, all water is filtered and disinfected, and keepers change shoes and wash their hands on the way in and out so as not to carry in disease.\nMost striking is a row of brightly coloured dart frog displays, red, blue, yellow and black-and-white striped, small as sweets. In the wild their poison comes from certain insects they eat; in the zoo, on a different diet, it slowly fades. On the other side a long channel mimicking a mountain stream, cold and fast, holds giant salamanders, the largest living amphibians, which hide under stones by day and come out to feed at night. The axolotls live in a set of quiet tanks, their pink external gills like ruffs of feathers; they can regrow lost limbs and greatly interest researchers.\nThe house also has an 'ark room' closed to the public, keeping several frogs that are scarce in the wild, each species with its own room and air system so that no disease can sweep through them all. Lucy says the ark room is the room she is proudest of in the whole zoo, because it does the same as a cleanroom: 'protect the most fragile things until the world is ready to let them out.'"
    in: div_zmb3gb
    offset_km: [-12.4, 0.6]
    site: { layout: zoo, angle_deg: 0, variant: amphibians, size_m: [700, 550] }
  - id: poi_9cdhxd
    subtype: zoo
    status: generated
    names:
      zh: 露西动物园·淡水鱼馆
      en: Lucy Zoo – Freshwater Fish House
      es: Zoológico de Lucy – Casa de Peces de Agua Dulce
    short_names: { zh: 淡水鱼馆, en: Freshwater Fish, es: Agua Dulce }
    notes:
      zh: "淡水鱼馆讲的是河流和湖泊的故事。场馆里最大的展区是一条长长的「河」，从山间的急流开始，经过中游的深潭和浅滩，一直流到下游的沼泽和河口，每一段的水温、流速和水底都不一样，住的鱼也不一样：急流里是鳟鱼和鲑鱼，深潭里是鲟鱼和大型鲶鱼，浅滩上是成群的小鱼，沼泽里是肺鱼和各种热带鱼。游客沿着河边的步道从上游走到下游，透过一面又一面玻璃，看水里的世界一点一点变暖、变慢、变浑。\n场馆另一边是一个大型的热带河流展缸，模仿的是热带雨林里的大河，水是茶色的，里面游着巨骨舌鱼、魟鱼和成群的脂鲤，水面上漂着巨大的王莲叶子。展缸的水由生命维持系统控制，温度、酸碱度和溶解氧都和热带的河水一样，水里的落叶和树根也是故意放进去的，让鱼觉得像在家里。\n淡水鱼馆还养着加州本地的鱼，比如在本州河流里洄游的鲑鱼。每年秋天，饲养员会把馆里繁育的小鲑鱼送到乔什庄园附近的溪流放流，乔什每次都会来帮忙，穿着一双从赛车场维修区借来的防水靴。露西说他放鱼的样子和开赛车一样认真，「只是这次希望它们跑得越远越好」。\n淡水鱼馆的「河」的上游有一段可以调节流速的急流，每年春天，饲养员会把水流调大，模拟融雪季的洪水，好让鳟鱼和鲑鱼保持逆流游泳的本领；那几天整条「河」哗哗作响，游客站在玻璃前，能看到鱼一次又一次地奋力向上游冲。"
      en: "The Freshwater Fish House tells the story of rivers and lakes. Its largest display is a long 'river' running from mountain rapids through the deep pools and shallows of the middle course to the marshes and mouth of the lower river, each stretch with its own temperature, current and bed, and its own fish: trout and salmon in the rapids, sturgeon and big catfish in the pools, shoals of small fish over the shallows, lungfish and all kinds of tropical fish in the marsh. Visitors walk the riverside path from source to mouth, seeing through pane after pane of glass the underwater world grow warmer, slower and murkier.\nOn the other side is a large tropical river tank modelled on the great rivers of the rainforest, its water the colour of tea, with arapaima, stingrays and shoals of characins swimming in it and giant water-lily leaves floating on top. Its water is run by the life-support system to match a tropical river in temperature, acidity and dissolved oxygen, and the fallen leaves and tree roots in it are put there on purpose so the fish feel at home.\nThe house also keeps California's own fish, such as the salmon that run the state's rivers. Every autumn the keepers release young salmon bred here into a stream near Josh's estate, and Josh always comes to help in a pair of waterproof boots borrowed from the circuit's pit garage. Lucy says he releases fish as seriously as he races, 'only this time he hopes they get as far away as possible.'\nThe upper 'river' has rapids whose current can be adjusted, and every spring the keepers turn it up to mimic the snowmelt floods, so that the trout and salmon keep their skill at swimming upstream; for those days the whole river roars, and visitors at the glass watch the fish dash upstream again and again."
    in: div_zmb3gb
    offset_km: [-11.6, 0.6]
    site: { layout: zoo, angle_deg: 0, variant: freshwater, size_m: [700, 550] }
  - id: poi_k68qm1
    subtype: zoo
    status: generated
    names:
      zh: 露西动物园·海洋鱼馆
      en: Lucy Zoo – Sea Fish House
      es: Zoológico de Lucy – Casa de Peces Marinos
    short_names: { zh: 海洋鱼馆, en: Sea Fish, es: Peces Marinos }
    notes:
      zh: "海洋鱼馆的中心是一个巨大的圆形海水缸，深好几米，游客从一条穿过缸底的透明隧道走进去，头顶和两侧都是游动的鱼：成群的沙丁鱼像一团银色的云，鳐鱼像风筝一样从头顶滑过，几条鲨鱼慢慢地绕着缸边巡游。大缸外面一圈是几十个小展缸，分别展示海藻森林、深海、红树林和沙质海底这些不同的海洋环境。\n海藻森林展缸模仿的是加州沿海的巨藻林，高大的海藻从缸底一直长到水面，随着人工的波浪轻轻摇摆，里面住着本州海岸常见的鱼和海星。深海展缸是全馆最暗的地方，只有几盏蓝色的小灯，里面的生物有的会自己发光，游客要在门口等眼睛适应了黑暗才看得清。大缸里的海水和海洋哺乳馆一样，是馆内配出来、循环使用的，每天都要检测几十项指标，鲨鱼的牙齿掉下来，潜水员会把它们捡起来，送给来参观的孩子做纪念。\n海洋鱼馆每天会安排潜水员下到大缸里喂鱼、清洁玻璃，潜水员戴着可以通话的面罩，一边喂一边回答隧道里孩子们的问题。最常被问到的问题是「鲨鱼会不会咬你」，潜水员的标准回答是：「它们吃得比我好，没兴趣。」露西每次来都要在隧道里站一会儿，她说抬头看鱼群转向的那一瞬间，像在看一块芯片里的数据流。\n海洋鱼馆的地下有一间备用缸房，存着几百升配好的海水和备用的过滤设备，一旦大缸的某台设备出了问题，几分钟之内就能切换过去，露西说这是从晶圆厂学来的「冗余」。"
      en: "At the heart of the Sea Fish House is a huge round seawater tank several metres deep, entered by a transparent tunnel through its floor, with fish swimming overhead and on both sides: shoals of sardines like a silver cloud, rays gliding overhead like kites, a few sharks slowly patrolling the edge. Around the big tank runs a ring of dozens of small displays showing different sea environments, kelp forest, deep sea, mangroves and sandy sea floor.\nThe kelp forest display is modelled on the giant kelp forests of the California coast, tall kelp rising from floor to surface and swaying gently in artificial waves, home to fish and starfish common on the state's shores. The deep-sea display is the darkest place in the house, lit only by a few small blue lamps, and some of its creatures make their own light; visitors must wait at the door for their eyes to adjust. The big tank's seawater, as in the Marine Mammal House, is mixed in the house and recirculated, with dozens of readings checked daily; when sharks shed teeth, divers pick them up to give to visiting children as keepsakes.\nEvery day divers go down into the big tank to feed the fish and clean the glass, wearing masks they can talk through and answering children's questions in the tunnel as they feed. The commonest question is 'will the sharks bite you?', and the divers' stock answer is: 'they eat better than I do; they're not interested.' Lucy always stands a while in the tunnel; she says looking up at the moment a shoal turns is like watching the data flow inside a chip.\nUnder the house is a standby tank room holding hundreds of litres of ready-mixed seawater and spare filtration, so that if any equipment on the big tank fails it can be switched over within minutes; Lucy calls it 'redundancy' learned from the fabs."
    in: div_zmb3gb
    offset_km: [-10.8, 0.6]
    site: { layout: zoo, angle_deg: 0, variant: marine, size_m: [700, 550] }
  - id: poi_zttk36
    subtype: zoo
    status: generated
    names:
      zh: 露西动物园·昆虫馆
      en: Lucy Zoo – Insect House
      es: Zoológico de Lucy – Casa de Insectos
    short_names: { zh: 昆虫馆, en: Insect House, es: Insectos }
    notes:
      zh: "昆虫馆是孩子们最舍不得离开的场馆。进门是一座温暖的蝴蝶温室，几十种蝴蝶在花丛中飞来飞去，有时会落在游客的肩膀和帽子上；温室一角有一个「羽化窗」，玻璃后面挂着一排排蛹，运气好的话能看到一只蝴蝶慢慢钻出来、展开湿漉漉的翅膀。温室后面是一排展箱，住着竹节虫、叶䗛、螳螂、甲虫、蚂蚁和蟑螂，很多昆虫的伪装好得让人找半天也找不到，展箱旁边的说明牌上会写着「这里有十二只，你找到了几只？」\n昆虫馆最壮观的是一个切叶蚁的蚁巢：几百万只蚂蚁住在一组透明的盒子里，盒子之间用长长的管道连起来，工蚁们排着队把切下来的树叶搬回巢里，用来种它们赖以为生的真菌。管道从游客头顶穿过，大家抬头就能看到一条绿色的「叶子河」在流动。另一间是蜜蜂屋，透明的蜂箱贴在墙上，一端通到室外，蜜蜂飞出去采动物园和芯城周围山坡上的花，再飞回来酿蜜；昆虫馆每年卖蜂蜜的钱，都用来资助本州的传粉昆虫保护项目。\n昆虫是地球上种类最多的动物，露西说她小时候最先迷上的不是芯片，而是蚂蚁：一只蚂蚁什么都不懂，几百万只蚂蚁却能修路、种地、打仗、搬家，「这和几十亿个晶体管一起做出一颗芯片是一个道理」。\n昆虫馆还有一间「夜行屋」，灯光调得很暗，住着萤火虫和几种夜里才出来活动的甲虫，夏天的晚上，萤火虫一亮一灭，孩子们屏住呼吸，像在看一片会呼吸的星空。"
      en: "The Insect House is the one children least want to leave. Inside the door is a warm butterfly glasshouse where dozens of species flit among the flowers and sometimes land on visitors' shoulders and hats; in one corner is an 'emergence window', rows of chrysalises hanging behind glass, where with luck you can watch a butterfly slowly push its way out and spread its wet wings. Behind the glasshouse is a row of displays of stick insects, leaf insects, mantises, beetles, ants and cockroaches, many so well camouflaged that it takes ages to find them; the labels say 'there are twelve here; how many can you see?'\nMost spectacular is a leafcutter ant colony: millions of ants in a set of transparent boxes joined by long tubes, workers filing along to carry cut leaves back to the nest to grow the fungus they live on. The tubes run over visitors' heads, so looking up they see a green 'river of leaves' flowing. Another room is the bee house, transparent hives on the wall opening outdoors at one end, the bees flying out to the flowers of the zoo and the hills around Chip City and back to make honey; the money from the house's honey each year funds pollinator conservation in the state.\nInsects are the most diverse animals on Earth. Lucy says the first thing she fell for as a child was not chips but ants: one ant understands nothing, yet millions of ants build roads, farm, fight and move house, 'which is the same as billions of transistors making a chip together.'\nThe house also has a 'night room', its lights turned very low, home to fireflies and several beetles that come out only at night; on summer evenings the fireflies blink on and off and the children hold their breath, as if watching a starry sky that breathes."
    in: div_zmb3gb
    offset_km: [-10.0, 0.6]
    site: { layout: zoo, angle_deg: 0, variant: insects, size_m: [700, 550] }
  - id: poi_bvt7h0
    subtype: zoo
    status: generated
    names:
      zh: 露西动物园·蛛形馆
      en: Lucy Zoo – Arachnid House
      es: Zoológico de Lucy – Casa de Arácnidos
    short_names: { zh: 蛛形馆, en: Arachnid House, es: Arácnidos }
    notes:
      zh: "蛛形馆住着蜘蛛、蝎子、鞭蝎和盲蛛，是露西动物园里最小、也最让人犹豫要不要进去的场馆。门口挂着一块牌子：「这里的每一位住客都比你更怕你。」走进去，光线变得柔和，展箱一个挨着一个：沙漠展箱里的蝎子白天躲在石头下面，到了紫外线灯亮起的「夜间时段」会发出蓝绿色的荧光；雨林展箱里的捕鸟蛛毛茸茸的，有手掌那么大；园蛛展箱里挂着一张完整的圆网，网上的丝在灯光下闪闪发亮。\n蛛形馆最受欢迎的是「织网时间」。每天傍晚，饲养员会把园蛛展箱里的旧网收掉，游客可以看着蜘蛛从头开始织一张新网：先拉出几根放射状的主丝，再一圈一圈地从外往里织螺旋，整个过程不到一个小时。旁边的屏幕把织网的过程放大，旁白讲的是蛛丝的强度、弹性和蜘蛛怎么判断网上的猎物大小。研究人员也在这里研究蛛丝的结构，想知道它为什么又轻又结实。\n露西和蛛形馆的缘分来自一个故事：她第一次看到芯片在显微镜下的金属连线时，觉得它们像一张蜘蛛网，一层一层叠上去，每根线都有自己的用处。从那以后，她办公室的书架上一直放着一张装在玻璃框里的蛛网，是蛛形馆送给她的，标签上写着「第一版布线图，作者：一只园蛛」。\n蛛形馆的出口处可以领一枚「勇气徽章」，徽章上画着一只戴眼镜的小蜘蛛，参观完的孩子人人有份；据说露西自己的办公桌上也别着一枚。"
      en: "The Arachnid House is home to spiders, scorpions, whip scorpions and harvestmen; it is the smallest house in Lucy Zoo and the one people most hesitate to enter. A sign at the door reads: 'Every resident here is more afraid of you than you are of it.' Inside, the light softens and the displays stand side by side: in the desert display scorpions hide under stones by day and glow blue-green when the ultraviolet lamps come on for 'night time'; in the rainforest display furry bird-eating spiders are as big as a hand; in the orb-weaver display hangs a whole round web, its threads glittering in the light.\nThe favourite event is 'web time'. Every evening the keepers take down the old web in the orb-weaver display and visitors can watch the spider build a new one from scratch: first a few radial threads, then the spiral, round and round from the outside in, the whole thing in under an hour. A screen beside it magnifies the work, the commentary explaining the strength and elasticity of silk and how a spider judges the size of prey in its web. Researchers also study the structure of silk here, to learn why it is so light and so strong.\nLucy's bond with the house comes from a story: the first time she saw a chip's metal wiring under a microscope she thought it looked like a spider's web, layer on layer, every thread with its own purpose. Ever since, the bookshelf in her office has held a spider's web in a glass frame, a gift from the house, labelled 'first draft of the routing, by an orb-weaver.'\nAt the exit every child who has made it round gets a 'courage badge' showing a little spider in glasses; Lucy is said to keep one pinned to her own desk."
    in: div_zmb3gb
    offset_km: [-9.2, 0.6]
    site: { layout: zoo, angle_deg: 0, variant: arachnids, size_m: [700, 550] }
  - id: poi_rszbeh
    subtype: zoo
    status: generated
    names:
      zh: 露西动物园·头足馆
      en: Lucy Zoo – Cephalopod House
      es: Zoológico de Lucy – Casa de Cefalópodos
    short_names: { zh: 头足馆, en: Cephalopod House, es: Cefalópodos }
    notes:
      zh: "头足馆住着章鱼、乌贼、鱿鱼和鹦鹉螺，是专门为这些「海里最聪明的软体动物」建的场馆。章鱼有八条腕，每条腕上都有成百上千个吸盘，大部分神经元分布在腕里，它们能打开瓶盖、走出迷宫、记住不同的饲养员；乌贼能在一瞬间改变皮肤的颜色和花纹，用来伪装、求偶和吓退敌人；鹦鹉螺是带着螺旋外壳的古老物种，靠调节壳里的气体在水里上浮和下沉。\n章鱼是有名的「逃跑大师」，身体柔软，只要比嘴大一点的缝就钻得过去。头足馆的展缸因此都有严丝合缝的盖子，排水口装着细网，饲养员还在每个缸里放了玩具：可以拧开的罐子、装着螃蟹的透明盒子、一块块可以搬来搬去的石头，免得它们闲得无聊去研究怎么越狱。每只章鱼都有自己的名字和档案，饲养员记录它们喜欢什么玩具、几天学会开一个新罐子。乌贼的展缸前放着一块屏幕，实时放大它们皮肤上的变色细胞，像在看一块会呼吸的显示屏。\n露西对头足馆有一种特别的感情，因为章鱼的大脑结构和人完全不同，却同样聪明。她常对设计中心的工程师说，聪明的设计不一定只有一种，「章鱼的神经大部分长在手臂里，所以它的手臂会自己想事情，这就是分布式计算」。头足馆的员工记得，有一次一只章鱼喷了露西一身水，她笑了一整天。\n头足馆的章鱼大多只能活一两年，饲养员会为每一只离去的章鱼写一段告别，贴在展缸旁边的墙上。"
      en: "The Cephalopod House is home to octopuses, cuttlefish, squid and nautiluses, a house built specially for 'the cleverest molluscs in the sea'. An octopus has eight arms, each with hundreds or thousands of suckers, and most of its neurons are in its arms; octopuses can open jar lids, escape mazes and tell keepers apart. Cuttlefish change the colour and pattern of their skin in an instant to hide, court and scare off enemies. The nautilus is an ancient animal with a spiral shell, rising and sinking by adjusting the gas inside.\nOctopuses are famous escape artists, their soft bodies squeezing through any gap a little larger than their beaks. So every tank here has a tight-fitting lid and fine mesh over the drains, and keepers put toys in each tank, jars to unscrew, clear boxes with crabs inside, stones to move about, so they do not get bored and start studying a breakout. Each octopus has its own name and file, recording which toys it likes and how many days it takes to learn a new jar. In front of the cuttlefish tank a screen magnifies the colour cells of their skin live, like watching a display that breathes.\nLucy has a special feeling for this house, because an octopus's brain is built nothing like ours yet is just as clever. She often tells the design centre's engineers that clever design comes in more than one form: 'most of an octopus's nerves are in its arms, so its arms think for themselves; that's distributed computing.' The staff remember the time an octopus soaked Lucy with a jet of water, and she laughed about it all day.\nMost of the octopuses live only a year or two, and the keepers write a farewell for each one that dies, pinned on the wall beside its tank."
    in: div_zmb3gb
    offset_km: [-8.4, 0.6]
    site: { layout: zoo, angle_deg: 0, variant: cephalopods, size_m: [700, 550] }
  - id: poi_1r1nga
    subtype: zoo
    status: generated
    names:
      zh: 露西动物园·珊瑚馆
      en: Lucy Zoo – Coral House
      es: Zoológico de Lucy – Casa de Corales
    short_names: { zh: 珊瑚馆, en: Coral House, es: Corales }
    notes:
      zh: "珊瑚馆是露西动物园东头的最后一座场馆，也是露西最常说「这里最像晶圆厂」的地方。珊瑚看起来像石头或植物，其实是成千上万只微小的珊瑚虫组成的群体，它们和体内的共生藻互相依靠：藻类靠光合作用给珊瑚虫提供养分，珊瑚虫给藻类提供住处。这种关系非常脆弱，海水只要比平时热上一两度，珊瑚就会把藻类排出去，变成一片惨白，这就是珊瑚白化。\n珊瑚馆的中心是一个浅浅的大礁池，池里长满了各种颜色的硬珊瑚和软珊瑚，小丑鱼钻在海葵里，蓝色的刺尾鱼在珊瑚之间穿梭。礁池的灯光模拟热带海面的阳光，从早上的淡蓝色到中午的明亮再到傍晚的暖色，一天天地循环；水温、盐度、酸碱度和钙的含量由生命维持系统每分钟测一次，偏差稍大就自动修正。礁池旁边是一间繁育室，一排排浅水槽里挂着小小的珊瑚碎片，它们在这里慢慢长大，长成之后会送往海洋保护机构，种回受损的珊瑚礁。\n繁育室里的每一片珊瑚都有编号，就像晶圆厂里每一片晶圆都有编号；它们的生长速度和颜色每周测一次，数据画成曲线挂在墙上。露西说她做了大半辈子的良率，到了珊瑚馆才明白另一种良率：「芯片坏了可以再做，珊瑚礁坏了要几十年才长得回来，所以这里一颗都不能丢。」\n珊瑚馆的门口放着一块珊瑚礁的骨架，是白化以后死去的珊瑚，旁边写着：「这是我们不想再看到的样子。」"
      en: "The Coral House is the last house at the east end of Lucy Zoo, and the place Lucy most often calls 'the most like a fab'. Coral looks like stone or a plant but is a colony of thousands of tiny polyps, living in partnership with algae inside them: the algae feed the polyps by photosynthesis and the polyps house the algae. The partnership is fragile; if the sea is just a degree or two warmer than usual, the coral expels its algae and turns ghostly white, which is coral bleaching.\nAt its centre is a big shallow reef pool crowded with hard and soft corals of every colour, clownfish nestling in anemones and blue tangs threading between the corals. The lighting mimics sunlight on a tropical sea, pale blue in the morning, bright at noon and warm at dusk, day after day; temperature, salinity, acidity and calcium are measured by the life-support system every minute and corrected automatically if they drift. Beside the pool is a nursery room, rows of shallow troughs hung with small coral fragments that grow here slowly and, once grown, go to marine conservation bodies to be planted back on damaged reefs.\nEvery fragment in the nursery is numbered, as every wafer in a fab is numbered; their growth and colour are measured weekly and the data drawn as curves on the wall. Lucy says she spent most of her life on yield and only understood another kind of yield in the Coral House: 'a broken chip can be made again; a broken reef takes decades to grow back, so here we can't lose a single one.'\nBy the door of the Coral House lies the skeleton of a reef, coral that died after bleaching, with the words beside it: 'This is what we never want to see again.'"
    in: div_zmb3gb
    offset_km: [-7.6, 0.6]
    site: { layout: zoo, angle_deg: 0, variant: coral, size_m: [700, 550] }
  - id: poi_sekgdm
    subtype: dental_clinic
    status: generated
    names:
      zh: 露西牙科诊所
      en: Lucy Dental Clinic
      es: Clínica Dental Lucy
    notes:
      zh: "露西庄园里的牙科诊所，在露西宅邸东北边不远的草坡上，整座建筑的平面是一颗臼齿的形状：上面圆鼓鼓的牙冠是候诊大厅和诊疗区，下面伸出的两条牙根是消毒中心和技工室。从露西宅邸的阳台上看下去，诊所的屋顶正好像一颗白白的牙齿立在草地上，露西说这样病人「还没进门就知道自己来对了地方」。诊所前面有一个环形的落客车道和两个停车场，旁边是一个弯成微笑形状的小池塘，后面有一个直升机坪，供急诊病人和来会诊的专家使用。\n诊所里有十二间诊疗室，每间都朝着窗外的草坡和远处的露西峰，躺在椅子上的病人可以看风景而不是盯着天花板的灯。诊所用的是露西芯城自己的技术：口腔扫描仪几分钟就能做出整副牙齿的三维模型，技工室的打印机和铣床当天就能做好牙冠和牙套；消毒中心的空气和器械处理标准是参照晶圆厂洁净室定的。诊所给芯城和动物园的员工、附近的居民和学校的孩子看牙，孩子们的检查和涂氟全部免费，候诊室里有一面墙专门挂孩子们画的「我的牙齿」。\n露西建这座诊所的原因很简单：她年轻时在晶圆厂熬夜加班，靠咖啡和糖撑着，牙齿吃了不少苦，后来花了很长时间才治好。她说这辈子学到最朴素的一条道理就是「预防比修复便宜」，芯片是这样，牙齿也是这样。诊所的牙医每年还会去动物园给海狮、河马和猩猩做一次口腔检查，诊所大厅里挂着一张照片：一位牙医站在张大嘴的河马面前，手里拿着一把特大号的牙刷。"
      en: "The dental clinic on Lucy's estate, on the grassy slope a little north-east of Lucy's House; the whole building is shaped in plan like a molar, its rounded crown the waiting hall and treatment area, its two roots the sterilisation centre and the dental laboratory. Seen from the balcony of Lucy's House the roof looks just like a white tooth standing in the grass, which Lucy says lets patients 'know they've come to the right place before they're through the door'. In front are a drop-off loop and two car parks, beside it a small pond curved like a smile, and behind it a helipad for emergency patients and visiting specialists.\nThe clinic has twelve treatment rooms, each facing the grassy slope and Mount Lucy beyond, so patients in the chair look at the view rather than the lamp on the ceiling. It uses Chip City's own technology: intraoral scanners make a 3D model of a whole set of teeth in minutes, and the laboratory's printers and mills make crowns and aligners the same day; the sterilisation centre's air and instrument standards are set by those of the fabs' cleanrooms. It treats the staff of Chip City and the zoo, local residents and schoolchildren, and children's check-ups and fluoride treatments are free; one wall of the waiting room is hung with children's drawings of 'my teeth'.\nLucy built the clinic for a simple reason: as a young woman pulling all-nighters in fabs on coffee and sugar, her teeth suffered, and it took a long time to put them right. She says the plainest lesson of her life is that 'prevention is cheaper than repair', for chips and for teeth alike. Every year the clinic's dentists also give the zoo's sea lions, hippos and orangutans a dental check, and a photograph in the clinic hall shows a dentist standing before a gaping hippo, holding an extra-large toothbrush."
