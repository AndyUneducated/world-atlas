  # ── 马斯林山军事与航天设施（M25）：深空太空军 ──
  - id: poi_bwm8fb
    subtype: command_centre
    status: generated
    names:
      zh: 星港指挥中心
      en: Starport Command Centre
      art-x-viking: Kommandozentrale Sternhafen
      art-x-buckham: Centro di Comando di Porto Stella
    notes:
      zh: 星港指挥中心位于星港区东北部，是深空太空军在马斯林山的最高指挥机构，统一指挥马斯林山的航天发射、在轨航天器管理、太空监视和反导作战。主楼里是一座巨大的指挥大厅，正面的屏幕墙实时显示轨道上数万个目标的位置和每一次发射的飞行轨迹；东岭相控阵雷达、蒂鲁尤阿克峰光学观测站、星港深空测控站和各卫星地面站的数据都汇集到这里，经计算机融合后形成一张完整的太空态势图。主楼周围是参谋机关、通信枢纽、营房和训练场，构成一座完整的营区。指挥中心与群峰地下指挥城同步值班、互为备份，任何一处受损，另一处都能立即接管指挥。星港区以航天港得名，指挥中心是区内最大的单位，许多军官的家属就住在附近的城区，营区东南不远处的星港防空阵地专门负责它的空中防御。
      en: Starport Command Centre, in the north-east of Starport District, is the Deep Space Force's highest command at Maslin Mountain, directing launches, the management of spacecraft in orbit, space surveillance and missile defence. Its main building holds a vast command hall whose screen wall shows, in real time, tens of thousands of objects in orbit and the track of every launch. Data from the East Ridge phased-array radar, the Mount Tirrujuaq optical station, the Starport deep space station and the satellite ground stations all arrive here and are fused by computer into a single picture of what is happening in space. Around the main building are the staff offices, a communications hub, barracks and a training ground, a garrison in its own right. The centre keeps watch in step with the underground command complex in the High Peaks; either can take over at once if the other is lost. Starport District is named after its spaceport, and the command centre is the district's largest employer, with many officers' families living in the town nearby. The Starport Air Defence Site, a short way to the south-east, exists to protect it from the air.
    in: div_nytsvb
    offset_km: [4.95, 7.07]
    site: { size_m: [1200, 800], layout: camp, variant: hq, angle_deg: 30 }
    military:
      unit: { zh: 深空太空军马斯林山指挥中心, en: Deep Space Force Maslin Mountain Command Centre }
      branch: { zh: 深空太空军, en: Deep Space Force }
      equipment:
        zh: 联合指挥大厅、空间态势显示中心、通信枢纽
        en: Joint command hall, space situation centre and communications hub
      personnel: 3200
      access: { zh: 军事禁区，不对外开放, en: "Restricted military area, closed to the public" }
  - id: poi_bkhms6
    subtype: command_centre
    status: generated
    names:
      zh: 群峰地下指挥城
      en: High Peaks Underground Command Complex
      art-x-viking: Unterirdische Kommandostadt Gipfel
      art-x-buckham: Città di Comando Sotterranea delle Vette
    wonder:
      zh: 世界唯一的地下指挥城，藏在数百米厚的岩层之下
      en: The only underground command city in the world, under hundreds of metres of rock
    notes:
      zh: "群峰地下指挥城开凿在马斯林山市群峰训练管理区东南部的山体深处，是世界上唯一的地下指挥城，也是深空太空军在马斯林山的备用指挥所，编制约 2400 人。地面上只能看到几处隧道口、通风竖井、一座直升机坪和几副天线，占地约 1.4 公里长、0.9 公里宽，主体全部藏在数百米厚的岩层之下：长长的隧道通往指挥大厅、数据中心、宿舍、食堂、医院和仓库，像一座地下的小城。山体内建有独立的电站、蓄水池和空气过滤系统，即使与外界完全隔绝，也能维持两千人在里面生活和工作三个月。指挥城是军事禁区，不对外开放。\n平时这里与星港区的星港指挥中心同步值班：指挥中心是深空太空军在马斯林山的最高指挥机构，大厅的屏幕墙实时显示轨道上数万个目标的位置，东岭相控阵雷达、蒂鲁尤阿克峰光学观测站和星港深空测控站的数据都汇集到那里，也同时送进山里。两处互为备份，一旦指挥中心受损或通信中断，指挥权会立即转到这里。指挥城对外的通信经由多条不同走向的光缆和卫星链路，任何一条中断都不影响指挥。群峰训练管理区由领地与驻军共管，不设区议会，常住只有约五千五百人；区西部的群峰拦截弹阵地有二十座发射井，守护着发射中心、指挥中心和整个北维京岛。\n选在群峰深处开凿，是因为这里的岩层坚硬完整，上方的山体就是最厚的屋顶。隧道口开在朝向山坡的一侧，冬季积雪时由专门的除雪设备保持畅通；进出的人员和物资经西岭公路运来，再换乘隧道里的电动车辆进入深处；进出要经过几道防护门，最外面的一道厚重得要靠液压缓缓推开。指挥城的医院有手术室和病房，平时也为在山里值班的人看病。山里没有白天和黑夜，走廊的灯光按地面的时间由亮到暗，值班人员按班次作息，指挥大厅则一天二十四小时有人。数据中心保存着空间目标轨道数据和各类指挥资料的完整备份；每年还要做几次全封闭演练，大门关闭，电站、水源和空气过滤全部切换到独立运行，所有人在山里连续待上几天。\n在里面待久了的人说，最想念的是风和天光。食堂的墙上挂着一块大屏幕，实时放映山外的群峰，雪停了、出太阳了，屏幕前总会围一圈人。轮休的人走出隧道口的第一件事，往往是站在雪地里深吸一口冷空气，老兵管这叫「上来换气」。"
      en: "The High Peaks Underground Command Complex is cut deep into the mountains in the south-east of the High Peaks Training Area of Maslin Mountain City. It is the only underground command city in the world and the Deep Space Force's alternate command post at Maslin Mountain, with a complement of about 2,400. On the surface there is little to see beyond a few tunnel portals, ventilation shafts, a helipad and some antennas, spread over about 1.4 km by 0.9 km; everything else lies under hundreds of metres of rock, where long tunnels lead to a command hall, a data centre, dormitories, canteens, a hospital and stores, a small town underground. It has its own power plant, water reservoirs and air filtration, so two thousand people could live and work inside for three months cut off from the outside world. The complex is a restricted military area, closed to the public.\nIn normal times it keeps watch alongside the Starport Command Centre in Starport District. That centre is the Deep Space Force's highest command at Maslin Mountain, its hall's screen wall showing the positions of tens of thousands of objects in orbit, and the data of the East Ridge phased-array radar, the Mount Tirrujuaq Optical Station and the Starport Deep Space Station flows there and into the mountain at the same time. Each backs up the other, and if the command centre is damaged or loses contact, command passes here at once. The complex's links to the outside run over several fibre routes in different directions and over satellite, so no single break can cut it off. The High Peaks Training Area is run jointly by the territory and the garrison, has no district council and only about 5,500 residents; the High Peaks Interceptor Field in its west, with twenty silos, guards the launch centre, the command centre and the whole of North Viking Island.\nIt was dug deep in the High Peaks because the rock here is hard and unbroken, and the mountain above is the thickest of roofs. The portals open into the hillside, and in winter dedicated snow clearing equipment keeps them free; people and supplies come in along the West Ridge Highway and transfer to electric vehicles in the tunnels to go deeper, passing through several blast doors on the way, the outermost so heavy that it swings open slowly on hydraulics. The complex's hospital has operating theatres and wards and treats the people on duty in the mountain in normal times too. There is no day or night inside: the corridor lights brighten and dim with the time on the surface, staff live by their shifts, and the command hall is manned twenty-four hours a day. The data centre holds a complete copy of the orbital data on space objects and other command records, and several times a year there is a full lockdown exercise: the doors are shut, power, water and air filtration all switch to independent running, and everyone stays inside the mountain for several days on end.\nThose who have spent long inside say what they miss most is wind and daylight. A big screen on the canteen wall shows the peaks outside live, and when the snow stops or the sun comes out a crowd always gathers in front of it. The first thing people going off duty do on leaving the portal is often to stand in the snow and take a deep breath of cold air, which old hands call \"coming up for air\"."
    in: div_q5h8zp
    offset_km: [12.73, -6.36]
    site: { size_m: [1400, 900], layout: bunker, angle_deg: 0 }
    military:
      unit: { zh: 深空太空军马斯林山备用指挥所, en: Deep Space Force Maslin Mountain Alternate Command Post }
      branch: { zh: 深空太空军, en: Deep Space Force }
      equipment:
        zh: 山体内的指挥大厅、数据中心与独立电站、水源，可供两千人连续生活三个月
        en: A command hall, data centre and its own power and water inside the mountain, enough for 2,000 people for three months
      personnel: 2400
      access: { zh: 军事禁区，不对外开放, en: "Restricted military area, closed to the public" }
  - id: poi_z3t3wk
    subtype: ground_station
    status: generated
    names:
      zh: 星港深空测控站
      en: Starport Deep Space Station
      art-x-viking: Tiefraumstation Sternhafen
      art-x-buckham: Stazione di Spazio Profondo di Porto Stella
    notes:
      zh: 星港深空测控站建在星港区西南的山谷里，四周被群峰的山梁环抱，远离城镇和电台的干扰，是深空太空军与远航航天器保持联系的主要地面站。站内最大的一副天线反射面直径数十米，能接收来自遥远行星际空间的微弱信号；其余五副较小的天线跟踪轨道上的卫星和飞船。火箭从西坪或星港升空后，测控站要在几分钟内捕获目标，接收遥测数据并发送指令；对于飞往深空的探测器，它在此后的数年里一直是地面上倾听它的耳朵。山谷的地形天然屏蔽了电磁干扰，测控站周围数公里划为无线电静默区，禁止使用大功率发射设备。站区还有一座数据处理中心，接收的数据经专用光缆实时传往星港指挥中心。冬季天线面板容易结霜，大天线配有加热系统，保证全年不间断工作。
      en: Starport Deep Space Station lies in a valley in the south-west of Starport District, ringed by the ridges of the High Peaks and far from the interference of towns and transmitters, and is the Deep Space Force's main ground station for keeping in touch with spacecraft on long voyages. Its largest antenna has a dish tens of metres across that can pick up faint signals from deep interplanetary space, while five smaller antennas track satellites and crewed ships in orbit. When a rocket lifts off from West Heath or Starport the station must acquire it within minutes, receiving telemetry and sending commands, and for a probe bound for deep space it remains the ear on the ground for years afterwards. The valley shields the site from electromagnetic noise, and several kilometres around it are a radio quiet zone where high-power transmitters are banned. A data processing centre on site sends everything it receives over a dedicated fibre line to the Starport command centre in real time. In winter the dish panels frost easily, so the big antenna is heated to keep working all year.
    in: div_nytsvb
    offset_km: [-9.19, -4.24]
    site: { size_m: [2400, 1400], layout: antenna, variant: large, angle_deg: 0 }
    military:
      unit: { zh: 深空太空军第三测控站, en: "3rd Tracking Station, Deep Space Force" }
      branch: { zh: 深空太空军, en: Deep Space Force }
      equipment:
        zh: 深空测控天线 6 副，其中大口径天线 1 副
        en: 6 deep-space antennas, including one very large dish
      personnel: 450
      access: { zh: 每年航天日向公众开放, en: Open to the public on Space Day each year }
  - id: poi_211t54
    subtype: ground_station
    status: generated
    names:
      zh: 和平卫星地面站
      en: Peace Satellite Ground Station
      art-x-viking: Satellitenbodenstation Frieden
      art-x-buckham: Stazione Satellitare di Pace
    notes:
      zh: 和平卫星地面站位于和平区北部的平原上，是马斯林山驻军与外界之间的主要卫星通信枢纽。八副天线分别对准不同的通信卫星，承担指挥中心、各基地与领地首府之间的话音、数据和视频传输；当海底光缆或山区线路中断时，这里就是马斯林山与外界最可靠的联系。地面站同时接收气象卫星的云图，为全岛的天气预报和每次发射的气象保障提供资料。站区的天线排成两列，以道路相连，一侧是机房和发电站，备用电源能让设备在停电后独立运行数天。
      en: Peace Satellite Ground Station, on the plain in the north of Peace District, is the main satellite communications hub between the Maslin Mountain garrison and the outside world. Its eight antennas each point at a different communications satellite, carrying voice, data and video between the command centre, the bases and the territorial capital, and when an undersea cable or a mountain line fails it is Maslin's most dependable link. It also receives cloud images from weather satellites for the island's forecasts and the weather support of every launch. The antennas stand in two rows joined by roads, with the equipment rooms and a power station to one side; the backup supply can keep everything running for days if the grid goes down.
    in: div_nvrjpg
    offset_km: [2.83, 12.02]
    site: { size_m: [1000, 600], layout: antenna, variant: small, angle_deg: 0 }
    military:
      unit: { zh: 深空太空军卫星通信第 12 站, en: "12th Satellite Communications Station, Deep Space Force" }
      branch: { zh: 深空太空军, en: Deep Space Force }
      equipment: { zh: 卫星通信天线 8 副, en: 8 satellite communications antennas }
