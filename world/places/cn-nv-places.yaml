  - id: poi_8xze08
    subtype: depot
    status: generated
    names:
      zh: 东营后勤基地
      en: East Camp Supply Depot
      art-x-viking: Versorgungsdepot Ostlager
      art-x-buckham: Deposito Logistico di Campo Est
    notes:
      zh: 东营后勤基地位于东营区北部，是马斯林山各驻军单位的物资供应中心。经马斯林河口港和铁路运来的燃料、弹药、食品、被装和零部件，先集中存放在这里成排的仓库里，再由卡车队分送到各个基地和站点。基地有铁路专用线，货运列车可以直接开进库区装卸；冬季公路积雪时，库存的物资足够马斯林山驻军维持数月。每年入冬前，基地还要为高山站点囤积燃料和食品，确保它们在大雪封山期间正常运转。基地的车队也承担民用救灾物资的运输，暴雪成灾时常为周边村镇送去燃料和食品。
      en: The East Camp Supply Depot, in the north of East Camp District, is the supply centre for every unit at Maslin Mountain. Fuel, ammunition, food, clothing and spare parts arriving through Maslin Mouth Port and by rail are gathered in its rows of warehouses and sent on by truck convoy to the bases and stations. A rail siding lets freight trains run right into the depot to load and unload, and when snow blocks the roads in winter its stocks can keep the garrison going for months. Before each winter it also stocks the mountain stations with fuel and food so they keep working while snow closes the passes. Its convoys carry civilian relief supplies too, often taking fuel and food to nearby towns and villages when blizzards strike.
    in: div_tc0ngk
    offset_km: [2.87, 11.36]
    site: { size_m: [2000, 1200], layout: plant, variant: depot, angle_deg: 75 }
