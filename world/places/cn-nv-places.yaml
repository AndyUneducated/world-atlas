    notes:
      zh: 群峰拦截弹阵地位于群峰训练管理区西部的山坡上，是保卫马斯林山发射中心、指挥中心乃至整个北维京岛的反导阵地。二十座发射井按网格排列，以检修道路相连，井盖平时紧闭，地面上只能看到一排排圆形井口。井中竖立着拦截弹，接到东岭相控阵雷达和预警卫星发来的目标数据后，可在数分钟内发射，在大气层外拦截来袭目标。阵地选在山坡上，周围的山体能遮挡来自侧面的冲击；支援区设在阵地下方，经西岭公路与西坪相连。冬季阵地要定期除雪，确保井盖随时可以开启。
      en: The High Peaks Interceptor Field lies on a mountainside in the west of the High Peaks Training Area and is the missile defence site protecting Maslin Mountain's launch and command centres and the whole of North Viking Island. Twenty silos stand in a grid joined by service roads; their lids stay shut, so from the ground there is little to see but rows of round hatches. Each silo holds an interceptor that can launch within minutes of receiving target data from the East Ridge phased-array radar and warning satellites, meeting incoming threats above the atmosphere. The mountainside site lets the surrounding slopes shield it from blasts from the side, and its support area lies below the silos on the West Ridge Highway to West Heath. In winter the site is cleared of snow regularly so that the lids can open at any moment.
    in: div_q5h8zp
