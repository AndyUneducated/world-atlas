      en: "Headquarters and transmitter tower of the territory's broadcasters. Every morning the centre reads the weather in Chinese, Viking and Buckham, one presenter for each language, and many islanders picked up greetings in the other two languages from the programme. Each winter its evening news also announces the Frost Ridge hare count district by district, like an election."
    in: div_zs7kjk
    offset_km: [1.8, 1.2]
    site: { size_m: [120, 120], layout: tower }

  - id: poi_c6abw8
    subtype: park
    status: generated
    names:
      zh: 鹿鸣公园
      en: Deersong Park
      art-x-viking: Hirschliedpark
      art-x-buckham: Parco di Canto Cervo
    in: div_zs7kjk
    offset_km: [-1.2, 1.5]
    site: { size_m: [600, 450], layout: park }
    notes:
      zh: "西北市鹿鸣区的城市公园，靠近鹿鸣湖，园内的草坡和林地连着城外的山岭，常有野生的马鹿出没。秋天发情季的鹿鸣在夜里隔着几条街都能听见，区名和公园名都由此而来，这个季节公园会在入口挂出「鹿在求偶，请勿靠近」的牌子。夏天湖边的草坪是西北市人野餐和露天电影的去处，西北广播电视中心偶尔在这里录制户外节目。"
      en: "A city park in Deersong District, Northwest City, near Deersong Lake, whose grassy slopes and woods run on into the hills outside town, where wild red deer often wander in. In the autumn rut their calls can be heard several streets away at night, which gave both the district and the park their names, and at that season the park hangs a sign at the gate: \"Deer courting, please keep your distance.\" In summer the lakeside lawns are where Northwest City goes for picnics and open-air films, and the Northwest Broadcasting Centre sometimes records outdoor programmes here."

  - id: poi_h43y8q
