  - id: poi_fsxvms
    subtype: observatory
    status: generated
    names:
      zh: 蒂鲁尤阿克峰光学观测站
      en: Mount Tirrujuaq Optical Station
      art-x-viking: Optische Station Tirrujuaqspitze
      art-x-buckham: Stazione Ottica di Tirrujuaq
    notes:
      zh: 蒂鲁尤阿克峰光学观测站位于全岛最高峰蒂鲁尤阿克峰的峰顶，海拔四千三百多米，是深空太空军观测轨道目标的光学站。峰顶常在云层之上，空气稀薄干燥，夜空极为清澈，望远镜可以拍摄到很暗的卫星和碎片，测定它们的轨道。站内还装有一套卫星激光测距仪，向装有反射器的卫星发射激光脉冲，测量光脉冲往返的时间，把距离精确到厘米，为导航卫星和测地卫星校准轨道。峰顶气候严酷，终年被冰雪包围，值守人员每隔数周轮换一次；站房采用保温密封设计，室内补充氧气，以减轻高山反应。
      en: Mount Tirrujuaq Optical Station sits on the summit of Mount Tirrujuaq, the island's highest mountain at more than 4,300 m, and is the Deep Space Force's optical station for watching objects in orbit. The summit is often above the clouds and the air is thin and dry, so the night sky is exceptionally clear and the telescopes can image very faint satellites and debris to fix their orbits. The station also has a satellite laser ranging system that fires laser pulses at satellites carrying reflectors and times their return, measuring the distance to the centimetre to calibrate the orbits of navigation and geodesy satellites. Conditions at the top are harsh, with ice and snow all year, and the crew changes every few weeks. The buildings are insulated and sealed, with extra oxygen indoors to ease altitude sickness.
    in: div_q5h8zp
    offset_km: [13.4, 15.6]
