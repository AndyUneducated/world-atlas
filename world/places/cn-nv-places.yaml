  - id: poi_em72p8
    subtype: laser_station
    status: generated
    names:
      zh: 霍尔沃思峰激光站
      en: Mount Hallworth Laser Station
      art-x-viking: Laserstation Hallworthspitze
      art-x-buckham: Stazione Laser di Picco Hallworth
    notes:
      zh: 霍尔沃思峰激光站位于蒂鲁尤阿克峰西北的霍尔沃思峰峰顶，海拔四千二百多米，是深空太空军的地基激光试验站。高山上大气稀薄，激光穿过大气时的衰减和抖动都比平地小得多；站内的自适应光学系统还会实时测量大气扰动，用可变形的镜面加以抵消，把光束精确地聚焦到轨道上的目标。激光站的主要任务是与卫星进行激光通信和能量传输试验，也可以用激光轻推小块太空碎片，使其降低轨道、坠入大气层烧毁。每次试验前都要通报航空管理部门，确保光束经过的空域没有飞机。峰顶三面冰斗环抱，站房与蒂鲁尤阿克峰光学观测站同样采用保温密封设计。
      en: Mount Hallworth Laser Station stands on the summit of Mount Hallworth, north-west of Mount Tirrujuaq, at more than 4,200 m, and is the Deep Space Force's ground-based laser test station. At this height the air is thin, so a laser beam is far less weakened and blurred than at ground level, and the station's adaptive optics measure the turbulence that remains in real time and cancel it with deformable mirrors, focusing the beam precisely on targets in orbit. Its main work is laser communication and power-beaming trials with satellites, and it can also nudge small pieces of space debris with its laser so that they drop into the atmosphere and burn up. Before every trial the aviation authority is notified to make sure no aircraft is in the beam's path. Cirques surround the summit on three sides, and like the Starwatch station its buildings are insulated and sealed.
    in: div_q5h8zp
    offset_km: [-2.12, 24.75]
    site: { size_m: [500, 400], layout: radar, variant: domes, angle_deg: 0 }
    military:
      unit: { zh: 深空太空军地基激光试验站, en: "Ground-Based Laser Test Station, Deep Space Force" }
      branch: { zh: 深空太空军, en: Deep Space Force }
      equipment:
        zh: 大功率激光发射望远镜 2 台、自适应光学系统
        en: 2 high-power laser telescopes with adaptive optics
      personnel: 90
      access: { zh: 军事禁区，不对外开放, en: "Restricted military area, closed to the public" }
  - id: poi_9xzf7s
    subtype: radar_station
    status: generated
    names:
      zh: 东岭相控阵雷达站
      en: East Ridge Phased-Array Radar Station
      art-x-viking: Phased-Array-Radar Ostkamm
      art-x-buckham: Radar a Schiera di Fase della Cresta Est
    notes:
      zh: 东岭相控阵雷达站位于东营区南部的最高山岭上，是深空太空军的空间监视雷达。雷达的天线不是旋转的碟形，而是一面巨大的倾斜墙体，墙上排列着数千个小型收发单元，靠电子方式在瞬间改变波束指向，可以同时跟踪数百个目标。它日夜扫描马斯林山上空的轨道，发现并编目经过的卫星、火箭残骸和碎片，计算它们是否会与在轨航天器相撞；火箭发射时，它全程跟踪火箭飞行，确认各级分离是否正常。雷达耗电量很大，站内建有专用变电站，由东营电网双回路供电。阵面前方划定了电磁辐射防护区，区内不得建房。
      en: East Ridge Phased-Array Radar Station stands on the highest ridge in the south of East Camp District and is the Deep Space Force's space surveillance radar. Its antenna is not a turning dish but a huge sloping wall set with thousands of small transmit and receive modules that steer the beam electronically in an instant, so it can track hundreds of targets at once. Day and night it sweeps the orbits over Maslin Mountain, finding and cataloguing passing satellites, spent rocket stages and debris and working out whether any of them might hit a spacecraft. During a launch it follows the rocket all the way up, confirming that each stage separates as it should. The radar uses a great deal of power, so the station has its own substation fed by two separate lines from the East Camp grid. The ground in front of the array face is a radiation safety zone where no building is allowed.
    in: div_tc0ngk
    offset_km: [3.02, -13.58]
    site: { size_m: [900, 600], layout: radar, variant: array, angle_deg: 105 }
    access_road: true
    military:
      unit: { zh: 深空太空军空间态势感知第二站, en: "2nd Space Situational Awareness Station, Deep Space Force" }
      branch: { zh: 深空太空军, en: Deep Space Force }
      equipment: { zh: 大型相控阵雷达 1 部, en: 1 large phased-array radar }
      personnel: 400
      access: { zh: 军事禁区，不对外开放, en: "Restricted military area, closed to the public" }
  - id: poi_x6a913
    subtype: factory
    status: generated
    names:
      zh: 西坪火箭总装厂
      en: West Heath Rocket Assembly Plant
      art-x-viking: Raketenendmontage Westheide
      art-x-buckham: Stabilimento di Assemblaggio Razzi di Pianoro Ovest
    notes:
      zh: 西坪火箭总装厂位于发射与降落中心东侧数公里处，是马斯林山最大的工厂，负责重型运载火箭的总装和测试。火箭的各级箭体、发动机和整流罩由铁路运进厂区，先在三座长长的对接厂房里水平组装，检查管路和电缆，再吊进高耸的垂直总装厂房，竖立起来与有效载荷对接，完成整箭测试。垂直总装厂房是西坪高原上最醒目的建筑，几十公里外都能看到。总装好的火箭由专用运输平台沿加固的道路缓缓运往发射台，路面的承重和转弯半径都按火箭的重量和长度设计。工厂紧邻马斯林山航天铁路，铁路专用线直通厂内；附近还有推进剂厂和飞船整修厂，共同组成西坪航天产业区。总装厂的技术工人大多住在西坪城区，西坪也因此成为马斯林山人口增长最快的区。
      en: The West Heath Rocket Assembly Plant, a few kilometres east of the launch and landing centre, is Maslin Mountain's largest factory and assembles and tests heavy launch vehicles. Rocket stages, engines and fairings arrive by rail and are first joined horizontally in three long integration halls, where the pipework and cabling are checked. Each rocket is then lifted into the towering vertical assembly building, stood upright, mated with its payload and tested as a whole. The vertical assembly building is the most striking structure on the West Heath plateau, visible tens of kilometres away. Finished rockets travel slowly to the pads on a dedicated transporter along a reinforced road whose strength and curves were designed around the rockets' weight and length. The plant sits beside the Maslin Mountain Aerospace Railway, with a siding running straight inside, and together with the propellant plant and the spacecraft refurbishment plant nearby it forms the West Heath space industry zone. Most of its skilled workers live in West Heath, which has become Maslin Mountain's fastest-growing district.
    in: div_nwke3f
