      en: Twin Towns Square
      art-x-viking: Zweistädteplatz
      art-x-buckham: Piazza delle Due Città
    notes:
      zh: "纪念普库图克与西加维克两镇合并设市的广场，新市名取塔夫鲁纳克语「土地生长之处」广场中央的石碑上刻着那句塔夫鲁纳克语老话：「Tavru pukku, nirsa tuqqa」，意思是「土地肯长东西的地方，驯鹿就会住下来」。每年两镇合并的纪念日，普库图克和西加维克的居民在广场上拔河，输的一方负责来年的庆典。"
      en: "Marks the merger of Pukkutuuq and Siggavik into one city, given the Tavrunaq name for 'where the land grows'. The stone in the middle of the square is carved with the old Tavrunaq saying \"Tavru pukku, nirsa tuqqa\": where the land is willing to grow, the reindeer will stay. On the anniversary of the merger, the people of Pukkutuuq and Siggavik hold a tug of war on the square, and the losing side organises the next year's celebrations."
    in: div_mpfctv
    offset_km: [0.3, 0.3]
    site: { layout: plaza, size_m: [240, 180] }
  - id: poi_qj4vze
