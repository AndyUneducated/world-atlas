  - id: poi_s7aqz9
    subtype: plaza
    status: generated
    names:
      zh: 人民广场
      en: People's Square
      art-x-viking: Volksplatz
      art-x-buckham: Piazza del Popolo
    notes:
      zh: "人民广场是自由市白桦区的城市广场，位于人民大道中段，正对议会综合办公区，占地约 0.1 平方公里，是全领地举行庆典和集会的地方。广场四周依次排开领地博物馆、领地图书馆和自由市大剧院，自由塔在广场东侧拔地而起，是城中最高的建筑，登顶可以望见两条河流和远处的菲亚尔马克丘陵。人民大道全长十三公里多，从白桦区延伸到北河区，政务院各部沿大道两侧排成「政务院大街」，领地政府主楼就在大街中段，北维京岛大学的主校区也在附近，大学的毕业典礼就在广场上举行。自由市地铁 1 号线在广场下设有人民广场站，与领地图书馆站相邻，白天上班的人潮从这里涌进机关大院，傍晚六点以后广场又安静下来。\n冬天广场上积雪，扫雪车按「先自行车道、再汽车道」的规矩清出一条条路，傍晚孩子们在剩下的雪堆上滑雪橇，家长们站在大剧院的台阶上等着。毕业典礼那天，学位帽被抛向空中，落下时常有几顶挂在广场边的白桦上，园林工人第二天要搬梯子一顶顶取下来。秋天白桦叶黄，广场四周一片金色，是首府游客最多的时候；每届领地议会开幕的早上，新当选的议员们从这里出发，步行去议员林种下自己的那棵白桦。"
      en: "People's Square is the city square of Birchwood District in Freedom City, halfway along People's Avenue and directly facing the Parliament Complex. Covering about 0.1 km², it is where the whole territory holds its celebrations and rallies. Around it stand, in turn, the Territorial Museum, the Territorial Library and the Freedom City Grand Theatre, and on its east side rises Liberty Tower, the tallest building in town, from whose top you can see both rivers and the Fjallmark hills in the distance. People's Avenue runs for more than thirteen kilometres from Birchwood into North River District, the ministries of the Executive Council line both sides of it as \"Executive Council Row\", and the main government building stands halfway along; the main campus of the University of North Viking Island is close by, and its graduation ceremonies are held in the square. Freedom City Metro Line 1 has a People's Square station beneath it, next to Territorial Library station; by day the commuting crowds pour out of here into the government compounds, and after six in the evening the square falls quiet again.\nIn winter, when snow covers the square, the snowploughs clear their lanes by the rule of \"cycle paths first, then roads\", and in the evenings children sledge on the heaps that are left while their parents wait on the steps of the Grand Theatre. On graduation day the mortarboards fly into the air, and a few always come down caught in the birches round the square, so the next day the gardeners have to bring ladders and fetch them down one by one. In autumn, when the birches turn, the square is ringed with gold and the capital sees the most visitors of the year; and on the morning each new territorial parliament opens, the newly elected members set out from here on foot to plant their own birch in the Members' Wood."
    in: div_16cxr8
    offset_km: [1.87, 1.25]
    site: { size_m: [400, 260], layout: plaza }

  - id: bld_s3p065
    subtype: museum
    status: generated
    names:
      zh: 领地博物馆
      en: Territorial Museum
      art-x-viking: Landesmuseum
      art-x-buckham: Museo Territoriale
    in: div_16cxr8
    offset_km: [1.62, 1.62]
    site: { size_m: [220, 150], layout: hall }
    notes:
      zh: "领地的综合博物馆，在自由市白桦区人民广场旁，与领地图书馆、自由市大剧院一起围着广场排开，展馆约 220 米长、150 米宽，展示北维京岛的自然与人文。自然部分有冰川与峡湾的地貌模型、雅尔斯托尔冰原和世界最高峰蒂鲁尤阿克峰的剖面图，人文部分有维京石垒出土的工具、塔夫鲁纳克人的农牧用具、巴克汉姆商港的货单与秤砣，以及领地设立后的城市规划图。一间展厅专讲地名：西海岸、北海岸的老港口和渔镇用维京语名，中部平原、内陆山地与北部河谷是原住民的农牧地，用塔夫鲁纳克语名，东南海岸的老贸易港用巴克汉姆名，领地时期规划的首府、新城、航天和军事城市则用中文名，参观的人常在地图前找自己家乡属于哪一层。如今领地有 12 个市、46 个区、600 万人，展厅尽头的大屏幕会按市逐一介绍。学生团是平日最常见的观众，周末则有不少全家一起来的首府人。\n大厅中央是一座可以升降的全岛地形沙盘，按下按钮，各座城市会依次亮灯，孩子们最爱按的是马斯林山，因为那里会亮起一枚小火箭。每到周日上午，馆员用三种语言轮流带领免费导览；冬天闭馆前，馆员会把沙盘上所有城市的灯同时点亮一次，常有人特意留到最后，看整座岛在昏暗的大厅里亮起来。"
      en: "The territory's general museum, beside People's Square in Birchwood District of Freedom City, standing around the square with the Territorial Library and the Freedom City Grand Theatre, in a building about 220 m long and 150 m wide. It presents North Viking Island's nature and people. The natural history galleries have relief models of glaciers and fjords and cross-sections of the Jarlstol Icefield and Mount Tirrujuaq, the world's highest peak; the human history galleries have tools excavated from the Viking stone fort, the farming and herding implements of the Tavrunaq people, bills of lading and weights from the Buckham trading ports, and the city plans drawn up after the territory was founded. One gallery is devoted to place names: the old ports and fishing towns of the west and north coasts bear Viking names, the plains, inland hills and northern valleys that were indigenous farmland and pasture have Tavrunaq names, the old trading ports of the south-east coast have Buckham names, and the capital, new towns and aerospace and military cities planned in the territorial era have Chinese names, and visitors often search the wall chart to see which layer their home town belongs to. Today the territory has 12 cities, 46 districts and six million people, and a big screen at the end of the galleries introduces them city by city. School groups are the most common visitors on weekdays, and at weekends many capital families come together.\nIn the centre of the main hall is a rising relief model of the whole island; at the press of a button the cities light up one after another, and children's favourite is Maslin Mountain, where a little rocket lights up. Every Sunday morning the staff lead free tours in three languages in turn, and before closing on winter evenings they light up every city on the model at once; people often stay to the end on purpose to watch the whole island glow in the darkened hall."

  - id: bld_5zev8b
    subtype: theatre
    status: generated
    names:
      zh: 自由市大剧院
      en: Freedom City Grand Theatre
      art-x-viking: Großes Theater Freistad
      art-x-buckham: Gran Teatro di Frei
    in: div_16cxr8
    offset_km: [2.12, 0.87]
    site: { size_m: [200, 150], layout: hall }
    notes:
      zh: "自由市的大剧院，在白桦区人民广场边，与领地博物馆、领地图书馆一起围着广场依次排开，自由塔就在广场东侧，占地约 200 米长、150 米宽。剧院上演歌剧、话剧、音乐会和舞蹈，领地交响乐团常驻这里，也是全岛各地剧团巡演的必到之处。白桦区是首府的行政与文化核心，政务院各部沿人民大道排开，白天机关大院人来人往，傍晚六点以后便安静下来，只有演出的夜晚，广场周围才重新亮起灯火，散场的观众沿着两旁种满白桦的大道散去。剧院离地铁1号线的人民广场站不远，观众多从这里进出。自由市人自称「台地人」，城市不大，人口只有三十八万多，剧院的常客里公务员、教师、医护人员和北维京岛大学的学生占了大半，周末的日场则满是带孩子的家庭。剧院的字幕屏同时显示中文、维京语和巴克汉姆语三种字幕，观众笑说看一场戏能顺便学三种语言。\n每年领地议会开幕的晚上，剧院都会举办一场免费的公众音乐会，演出在广场上同步直播，裹着毯子坐在广场上看大屏幕是首府人的冬夜传统。一月白天的最高气温只在一度上下，广场边的小摊卖热巧克力和热苹果酒，乐团的演奏员谢幕后常常还穿着演出服跑出来，向广场上的观众挥手致谢。"
      en: "Freedom City's grand theatre, on People's Square in Birchwood District, where it stands in a row around the square with the Territorial Museum and the Territorial Library, Liberty Tower rising on the square's east side; its site is about 200 m long and 150 m wide. It stages opera, drama, concerts and dance, the Territorial Symphony Orchestra is resident here, and it is a fixed stop for touring companies from across the island. Birchwood is the capital's administrative and cultural heart, with the ministries of the Executive Council lining People's Avenue; by day the government compounds bustle, and after six in the evening they fall quiet, so only on performance nights does the square light up again, with the audience dispersing along avenues lined with birches. The theatre is not far from People's Square station on Metro Line 1, which most of the audience use. Freedom City people call themselves \"terrace folk\"; the city is small, with only about 385,000 people, and civil servants, teachers, health workers and students of the University of North Viking Island make up most of the regulars, while weekend matinees are full of families with children. The surtitle screens show Chinese, Viking and Buckham at the same time, and audiences joke that you can pick up three languages at one play.\nOn the opening night of each Parliament the theatre gives a free public concert relayed live onto the square, and sitting wrapped in blankets in front of the big screen is a winter-night tradition in the capital. January daytime highs are only around one degree, the stalls around the square sell hot chocolate and hot cider, and after their bows the orchestra's players often run out still in concert dress to wave their thanks to the crowd on the square."

  - id: bld_cv6swy
    subtype: library
    status: generated
    names:
      zh: 领地图书馆
      en: Territorial Library
      art-x-viking: Landesbibliothek
      art-x-buckham: Biblioteca Territoriale
    in: div_16cxr8
    offset_km: [0.61, 0.89]
    site: { size_m: [160, 120], layout: hall }
    notes:
      zh: "领地的总图书馆，在自由市白桦区人民广场旁，与领地博物馆、自由市大剧院一起围着广场排开，馆舍约 160 米长、120 米宽，地铁1号线在附近设有领地图书馆站。馆里收藏中文、维京语、巴克汉姆语和塔夫鲁纳克语的图书与地方文献，领地法规和议会记录也存放在这里，议员、公务员和律师常来查阅档案。白桦区是首府的行政与文化核心，北维京岛大学的主校区就在区内，学生是阅览室里最常见的面孔，考试周时座位一早就被占满。地方文献部收藏着各市的旧地图、渔船登记簿、乳业合作社的账本和老照片，许多家庭来这里查找祖辈的名字；儿童阅览室按四种语言分区，每周有讲故事时间。冬天图书馆开到午夜，阅览室的长桌上亮着一排排绿罩台灯，窗外是积雪的人民广场，首府一月白天最高气温只有一度上下，从温暖的阅览室走进寒夜，读者们常常要在门廊里裹紧围巾站一会儿。\n借书证上印着领地旗，深蓝底上的白色北欧十字交叉处是一颗金色八角星。孩子们拿到第一张借书证时，馆员会在背面盖一枚八角星的印章，许多人成年后还把这张旧借书证留在钱包里。末班地铁前，馆里会用三种语言轮流广播闭馆提醒，学生们笑说这是全城「最温柔的赶人声」。"
      en: "The territory's main library, beside People's Square in Birchwood District of Freedom City, standing around the square with the Territorial Museum and the Freedom City Grand Theatre, in a building about 160 m long and 120 m wide; Metro Line 1 has a Territorial Library station nearby. It holds books and local records in Chinese, Viking, Buckham and Tavrunaq, and the territory's laws and the records of Parliament are kept here too, so members, civil servants and lawyers often come to consult the archives. Birchwood is the capital's administrative and cultural heart and the main campus of the University of North Viking Island is in the district, so students are the most familiar faces in the reading rooms, and in exam weeks the seats are taken first thing in the morning. The local records department keeps old maps of every city, fishing-boat registers, dairy cooperative ledgers and old photographs, and many families come to look for their ancestors' names; the children's reading room is divided by the four languages and holds story time every week. In winter the library stays open until midnight, rows of green-shaded lamps glowing on the long reading-room tables and People's Square deep in snow outside; January daytime highs in the capital are only around one degree, and stepping from the warm reading room into the cold night, readers often stand a moment in the porch tightening their scarves.\nLibrary cards bear the territory flag, a gold eight-pointed star where the white Nordic cross meets on deep blue. When children receive their first card, the librarian stamps an eight-pointed star on the back, and many keep that old card in their wallets as adults. Before the last metro train the library broadcasts its closing announcement in three languages in turn, and students laugh that it is the city's \"gentlest way of throwing people out\"."

  - id: bld_dh9ze4
    subtype: townhall
    status: generated
    names:
      zh: 自由市政厅
      en: Freedom City Hall
      art-x-viking: Rathaus Freistad
      art-x-buckham: Municipio di Frei
    in: div_16cxr8
    offset_km: [-0.53, 0.07]
    site: { size_m: [180, 130], layout: hall }
    notes:
      zh: "自由市的市政厅，在白桦区，市长办公室和市议会都在这里。顶层是婚姻登记处，大窗正对着两河之间的台地，新人登记后喜欢在窗前拍一张能同时看见自由河和北河的照片，本地人管这叫「两河照」。市政厅一楼的大厅对市民开放，墙上挂着自由市的旗帜和历任市议会的合影，冬天这里还是街头艺人避寒演出的地方。"
      en: "Freedom City's city hall, in Birchwood, housing the mayor's office and the city council. The top floor is the marriage registry, whose great window faces the terrace between the two rivers; after registering, couples like a photo at the window with both the Freedom River and the North River in view, which locals call \"the two-river picture\". The ground-floor hall is open to the public, hung with the city flag and photographs of past city councils, and in winter street performers come in from the cold to play there."

  - id: bld_d262pb
    subtype: tower
    status: generated
    names:
      zh: 自由塔
      en: Liberty Tower
      art-x-viking: Freiheitsturm
      art-x-buckham: Torre della Libertà
    notes:
      zh: "广播电视塔，自由市最高建筑，在白桦区人民广场东侧拔地而起，塔基约 90 米见方，与广场四周的领地博物馆、领地图书馆和自由市大剧院一起构成首府的中心。塔顶的观景台能望见自由河与北河夹着的整片台地，以及远处的菲亚尔马克丘陵；首府的市旗是竖三色旗，两道深蓝是夹着市区流过的两条河，白色是两河之间建城的台地，站在塔顶往下看，城市的格局就像那面旗帜铺在了地上。白桦区的道路按棋盘格规划，主干道两旁种着成排的白桦，政务院各部沿人民大道排开，从塔上能清楚地看出机关大院与社区公园交错的样子；北边是北河区的住宅和草场，南边是沙洲区的河口和沙丘。观景台白天的游客多是来首府参观的学生团和外地游客，傍晚则有不少本地情侣上来看日落。秋天白桦叶黄时，台地染成一片金色，是登塔的人最多的季节。\n自由塔每晚亮起深蓝和金色，正是领地旗的颜色，自由市人回家时远远看见它就知道快到了。傍晚六点以后白桦区的机关大院一片安静，塔上的灯却越来越亮，维京港人开玩笑说首府是「下了班就关灯的城市」，首府人便指着自由塔回嘴：「至少还有一盏灯不关。」"
      en: "A broadcasting and television tower and the tallest building in Freedom City, rising on the east side of People's Square in Birchwood District from a base about 90 m square; with the Territorial Museum, the Territorial Library and the Freedom City Grand Theatre around the square, it forms the centre of the capital. The observation deck at the top looks out over the whole terrace between the Freedom River and the North River and the Fjallmark Hills in the distance. The capital's flag is a vertical triband whose two deep blue bands are the rivers that frame the city and whose white is the terrace between them where it was built, and from the top of the tower the city's layout looks like that flag laid out on the ground. Birchwood's streets are laid out in a grid with rows of birches along the main roads and the ministries of the Executive Council lining People's Avenue, and from the tower you can clearly see government compounds alternating with neighbourhood parks; to the north lie the housing and pastures of North River District, to the south the river mouth and dunes of Sandbar. By day most visitors to the deck are school groups and tourists visiting the capital; in the evening plenty of local couples come up to watch the sunset. In autumn, when the birches turn yellow, the terrace is dyed gold, and that is when most people climb the tower.\nEvery night Liberty Tower lights up in deep blue and gold, the colours of the territory flag, and Freedom City people heading home know they are nearly there when they see it in the distance. After six in the evening Birchwood's government compounds fall silent but the tower's lights grow brighter; when Viking Port people joke that the capital is \"a city that switches off the lights when work ends\", capital folk point at Liberty Tower and retort: \"At least one light stays on.\""
    in: div_16cxr8
    offset_km: [-0.11, 1.25]
    site: { size_m: [90, 90], layout: tower }

