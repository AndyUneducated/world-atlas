    names:
      zh: 西岭雷达站
      en: West Ridge Radar Station
      art-x-viking: Radarstation Westkamm
      art-x-buckham: Stazione Radar della Cresta Ovest
    notes:
      zh: 西岭雷达站建在群峰训练管理区西部一道海拔一千六百多米的山岭上，是马斯林山最重要的远程警戒雷达站。站在山岭上，雷达可以越过马斯林山脉北翼，看到北部海域和全岛西部的空中目标，再把数据实时传给星港指挥中心和东营空军基地。三座白色雷达罩远远就能望见，罩内的天线昼夜不停地旋转。山岭上冬季风大雪厚，站内备有发电机组和足够一个月的燃料与食品，西岭公路被大雪封闭时，官兵也能照常值守。雷达站四周的山坡上埋设了避雷网，夏季雷暴频繁时尤其重要。
      en: West Ridge Radar Station stands on a ridge more than 1,600 m high in the west of the High Peaks Training Area and is Maslin Mountain's most important long-range surveillance radar. From the ridge its radars look over the northern arm of the Maslin Range to the northern seas and the air over the west of the island, passing their data in real time to the Starport command centre and East Camp Air Base. Its three white radomes can be seen from far away, the antennas inside turning day and night. Winter on the ridge brings strong winds and deep snow, so the station keeps generators and a month of fuel and food, and the crews stay on watch even when the West Ridge Highway is closed by snow. A lightning grid is buried in the slopes around it, much needed in the frequent summer thunderstorms.
    in: div_q5h8zp
