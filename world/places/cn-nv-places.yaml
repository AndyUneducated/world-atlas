      en: "A large shopping centre next to the Greenmead transit hub. The weekend night market outside is New City's real place to eat: grilled sausages, fried cod fingers, potatoes baked with Lekor cheese and home dishes brought by families from all over the island. Inside, the baby rooms are harder to get into than the car park, another mark of \"Pram City\"."
