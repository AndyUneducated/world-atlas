      en: "The international hospital in Capo District, treating the zone's foreign residents and passengers in transit. Its reception desks can receive patients in more than a dozen languages, and the signs carry English and pictograms as well as the three local scripts. The emergency room has a wall of clocks showing the time in major cities around the world, so that foreign patients can reach their families."
    in: div_e6pc44
