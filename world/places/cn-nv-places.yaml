      en: "Bonded warehousing and processing; goods can be stored and worked here without paying customs duty. A row of former bonded warehouses on its edge now holds a weekend market, where families from other cities come by car or train for coffee, chocolate and electrical goods; the homebound Viking Port–Beckerle trains are piled with shopping bags, earning them the nickname \"the shopping specials\"."
