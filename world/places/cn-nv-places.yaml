      zh: "东营区的士官学校，培养航天发射、测控与地勤士官。学员毕业前要在发射场完整值守一次发射，从加注、倒计时到升空都在岗位上度过。毕业典礼上，每位学员会领到一枚刻着自己第一次参与发射日期的铜章。"
      en: "The academy in East Camp that trains NCOs for launch, tracking and ground crews. Before graduating each cadet must stand watch through a complete launch at the launch site, from fuelling and countdown to lift-off. At graduation every cadet receives a bronze medal engraved with the date of the first launch they worked on."
