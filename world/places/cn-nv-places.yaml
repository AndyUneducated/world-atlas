  - id: poi_gttgzg
    subtype: factory
    status: generated
    names:
      zh: 西坪飞船整修厂
      en: West Heath Spacecraft Refurbishment Plant
      art-x-viking: Raumschiffwerft Westheide
      art-x-buckham: Officina Veicoli Spaziali di Pianoro Ovest
    notes:
      zh: 西坪飞船整修厂位于发射与降落中心北面，负责可重复使用航天器的检修和翻新。在降落台回收的火箭助推级、从轨道返回的飞船和空天飞机，都会被送进这里宽大的机库，拆下发动机，检查箭体结构和隔热层，更换受损的零部件，再重新测试。经过整修，同一枚助推级和同一艘飞船可以重复飞行十几次，大大降低了发射成本。整修厂还承担在轨服务飞行器的总装：这类飞行器上天后能为卫星加注推进剂、更换模块，延长卫星的寿命。厂区与总装厂、推进剂厂之间以厂区道路和铁路专用线相连。
      en: The West Heath Spacecraft Refurbishment Plant, north of the launch and landing centre, inspects and refurbishes reusable spacecraft. Booster stages recovered on the landing pads, ships back from orbit and spaceplanes all come into its wide hangars, where their engines are removed, their structures and heat shields checked and damaged parts replaced before everything is tested again. With this work the same booster or ship can fly a dozen times or more, which greatly lowers the cost of a launch. The plant also builds orbital servicing craft, which refuel satellites and swap their modules in orbit to extend their working lives. Plant roads and a rail siding join it to the assembly and propellant plants.
    in: div_nwke3f
