    names:
      zh: 北维京岛领地政务院公共安全部边境服务和安全司
      en: Border Services and Security Department, Ministry of Public Security, North Viking Island Executive Council
    short_names:
      zh: 边境服务和安全司
      en: Border Services and Security Department
    notes:
      zh: 北维京岛领地政务院公共安全部边境服务和安全司，设在维京港瓦尔维克区，是公共安全部唯一不在首府的司。瓦尔维克区是领地最大的口岸：鲸湾港和外礁深水港的远洋货轮、维京港国际机场的国际航班，以及经海底隧道通往维京群岛长船市的维长高速和维长城际铁路都从这里进出。边境服务和安全司负责这些口岸的出入境检查、边境巡逻和反走私，在海底隧道两端与维京群岛的边境部门合设联合检查站；它还管理沿海巡逻艇队，搜救在海峡遇险的渔船。大楼为 L 形，楼顶设有雷达和通信天线。
      en: "The Border Services and Security Department of the Ministry of Public Security is in Walvik District of Viking Port, the only department of the ministry outside the capital. Walvik is the territory's busiest port of entry: ocean freighters at Walvik Harbour and the Outer Skerry Deep-Water Port, international flights at Viking Port International Airport, and the Viking Port–Longship Expressway and Intercity Railway through the undersea tunnel to Longship in the Viking Islands all pass through it. The department runs immigration checks at these crossings, border patrols and anti-smuggling work, with joint checkpoints shared with the Viking Islands' border officers at both ends of the tunnel, and it runs the coastal patrol boats that rescue fishing boats in trouble in the strait. The building is L-shaped, with radar and radio masts on the roof."
    in: div_z29w6h
    offset_km: [1.0, 0.6]
    site: { size_m: [130, 100], layout: lshape }
