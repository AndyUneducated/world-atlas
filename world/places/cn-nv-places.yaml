      en: "Serves the resorts of Skytown. On the approach planes often descend through the mist rolling over Sky Terrace Mountain, and on bright days passengers can see a rainbow over Ljosa Bay from the window. Beside baggage claim stands a rack of free public umbrellas with \"Skytown\" carved on the handles, the first thing a visitor is given in Skytown."
    in: div_w1ea18
    offset_km: [-15.5, 3.98]
    site: { size_m: [3000, 1100], layout: airport, angle_deg: 45 }

  - id: poi_h1vjx3
