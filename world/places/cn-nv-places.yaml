    notes:
      zh: "天城的客运港，在天台区，夏季客轮从维京港、维京群岛和更远的地方载来度假的游客，码头上的旅客中心兼作天城的游客咨询处。下船的游客走上码头，迎面就是全城第一个公共雨伞架，伞柄上刻着「天城」二字，本地人说这是「天城给客人的第一份礼物」。港池里还停着一排出海观鸟、钓鱼的小游船，傍晚归航时总有海鸥跟在船尾。"
      en: "Skytown's passenger harbour, in Sky Terrace District, where summer ferries bring holidaymakers from Viking Port, the Viking Islands and further afield, and the quayside passenger centre doubles as the town's visitor information office. The first thing visitors meet as they walk up the quay is the town's first public umbrella stand, the handles carved with \"Skytown\", which locals call \"Skytown's first present to its guests\". The basin also holds a row of small boats for birdwatching and fishing trips, and when they come home in the evening there are always gulls in their wake."

  - id: poi_3kt6gb
