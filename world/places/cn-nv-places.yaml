    status: generated
    names:
      zh: 马斯林山军医院
      en: Maslin Mountain Military Hospital
      art-x-viking: Militärkrankenhaus Maslinberg
      art-x-buckham: Ospedale Militare di Maslin Tehee
    notes:
      zh: 马斯林山军医院位于和平区城区西北侧，是马斯林山规模最大的医院，既为驻军服务，也向地方居民开放。医院除普通科室外，还设有航天医学、高原医学和冻伤等特色科室：航天员每次飞行前后都在这里体检和康复，高山站点和寒区训练的伤病员也送到这里救治。医院院内设有直升机停机坪，急救直升机可以把山区的病人直接送进急诊。随着马斯林山人口增长，医院也承担了城区大部分的专科诊疗，许多居民不必再远赴首府看病。医院还与飞行学院和航天员训练中心合作开展航空航天医学研究。
      en: Maslin Mountain Military Hospital, on the north-western edge of the town in Peace District, is the largest hospital at Maslin Mountain, serving the garrison and open to local residents. Besides the usual departments it specialises in aerospace medicine, altitude medicine and frostbite. Astronauts have their check-ups and recovery here before and after every flight, and the sick and injured from the mountain stations and cold-weather training are brought here for treatment. A helipad in the grounds lets air ambulances fly patients from the mountains straight to the emergency department. As Maslin Mountain has grown, the hospital has also taken on most of the city's specialist care, so many residents no longer travel to the capital for treatment. It also carries out aerospace medical research with the flight academy and the astronaut training centre.
    in: div_nvrjpg
    offset_km: [-3.54, 5.66]
