      en: Lekor City Government
      art-x-viking: Stadtregierung Lekor
      art-x-buckham: Governo Cittadino di Lekor
    notes:
      zh: "勒克尔大街上的市政府。勒克尔是岛上最老的农业城市，市政府的会议室里挂着一幅大地图，标出自由市、西北市、塔夫鲁普库维克市和洛龙山市当年从勒克尔分出去的地界，本地人管它叫「分家图」。"
      en: "The city government on Lekor High Street. Lekor is the island's oldest farming city, and a large map in the council chamber shows the land that Freedom City, Northwest City, Tavrupukkuvik and Lorond Mountain were carved out of; locals call it \"the family-split map\"."
