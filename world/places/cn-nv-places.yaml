    site: { size_m: [260, 200], layout: plaza }
    notes:
      zh: "维京港的中心广场，在瓦尔维克区，面朝鲸湾港，四周是市政机构、老商号和咖啡馆。广场的石板地中央嵌着一个巨大的石制罗盘，各个方位刻着从这里出发的航线能到达的港口名，游客喜欢站在罗盘中心拍照。夏至前后鲸湾港的船只午夜鸣笛时，广场上会举办通宵的露天音乐会，乐队用维京语唱古老的船歌，听众跟着合唱到天亮。"
      en: "Viking Port's central square, in Walvik District, facing Walvik Harbour and ringed by civic buildings, old trading houses and cafés. Set into the paving at its centre is a great stone compass rose, each point carved with the names of ports reached by the routes that set out from here, and visitors like to be photographed standing in the middle. When the ships of the harbour sound their midnight horns around midsummer, the square holds an all-night open-air concert, the bands singing old sea songs in Viking and the crowd joining in until dawn."

  - id: bld_880zp5
