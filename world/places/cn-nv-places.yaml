      en: Ministry of Education, Science and Culture
    notes:
      zh: 北维京岛领地政务院教育、科学和文化部，位于政务院大街北侧，是下设司局最多的部，管理从学前教育到大学的各级教育、领地的科学政策和文化事业。部内设教育政策司、科学政策司、文化政策司、教育技术司、信息技术司、教育从业人员司、科技从业人员司、文化从业人员司、学前教育司、基础教育司、成人和职业教育司、高等教育司和教育督导署。领地的学校实行中文与维京语或巴克汉姆语的双语教学，内陆各区开设塔夫鲁纳克语课程；科学政策司设在西北市科学城，紧邻国家实验室和航天企业。领地博物馆、领地图书馆和自由市大剧院都归它管理，就在大街西南端的人民广场旁。
      en: The Ministry of Education, Science and Culture, on the north side of Council Row, has more departments than any other ministry and covers education from nursery to university, the territory's science policy and its cultural life. Its thirteen units are the Education Policy, Science Policy, Cultural Policy, Educational Technology, Information Technology, Teaching Professions, Science and Technology Professions, Cultural Professions, Pre-school, Basic Education, Adult and Vocational Education and Higher Education departments and the Education Inspectorate. Schools teach in Chinese alongside Viking or Buckham, with Tavrunaq classes in the inland districts, and the Science Policy Department sits in Northwest City's Science City beside the national laboratories and aerospace firms. The Territorial Museum, the Territorial Library and the Freedom City Grand Theatre, all by People's Square at the south-west end of the row, come under it.
    in: div_16cxr8
    offset_km: [2.37, 1.82]
    site: { size_m: [150, 110], layout: lshape }

  - id: bld_h12xsj
    subtype: government
    status: generated
    names:
      zh: 北维京岛领地政务院交通部
      en: Ministry of Transport, North Viking Island Executive Council
    short_names:
      zh: 交通部
      en: Ministry of Transport
    notes:
      zh: 北维京岛领地政务院交通部，位于政务院大街南侧，负责全岛的道路、铁路、水运和航空。部内设政策司、交通从业人员司、道路运输司、公路司、铁路司、水路司和空运司，其中铁路司在隔壁单独建楼。公路司管理环北维京岛高速、自维高速等国家高速和领地高速，岛上的高速公路大多不限速，冬季的除雪、防雪长廊和融雪设施也由它统一调度；水路司监管维京港、勒克尔和贝克勒保税港区的航运，空运司负责各机场的航线和空域协调，交通从业人员司管理驾驶员、船员和机组的资格考核。
      en: The Ministry of Transport, on the south side of Council Row, runs the island's roads, railways, shipping and air transport. Its departments are Policy, Transport Professions, Road Transport, Highways, Railways, Waterways and Air Transport, of which Railways has its own building next door. Highways manages the national and territorial expressways such as the North Viking Island Ring Expressway and the Freedom–Viking Port Expressway, most of them without a speed limit, and coordinates winter snow clearing, snow sheds and de-icing; Waterways oversees shipping at Viking Port, Lekor and the Beckerle Bonded Port Zone, Air Transport handles routes and airspace for the airports, and Transport Professions examines and licenses drivers, seafarers and aircrew.
    in: div_16cxr8
    offset_km: [2.59, 1.49]
    site: { size_m: [150, 80], layout: slab }

  - id: bld_4f62x1
    subtype: government
    status: generated
    names:
      zh: 北维京岛领地政务院建设部
      en: Ministry of Construction, North Viking Island Executive Council
    short_names:
      zh: 建设部
      en: Ministry of Construction
    notes:
      zh: 北维京岛领地政务院建设部，位于政务院大街南侧靠近议会综合办公区的一端，负责城乡规划、住房和建筑市场。部内设政策司、住房保障司、房地产市场监管司、建筑市场监管司、城市建设司和乡镇建设司。首府自由市、新城和西北市科学城都按它审定的规划新建，棋盘格的街道和成排的白桦就是规划的样子；住房保障司为公务员、教师和年轻家庭提供公共租赁住房，建筑市场监管司制定适应冻土和大雪荷载的建筑规范，乡镇建设司支持内陆牧区和渔村修建道路、供暖和自来水。
      en: The Ministry of Construction, on the south side of Council Row at the end near the Parliament Complex, is in charge of town and country planning, housing and the building trade. Its departments are Policy, Housing Support, Property Market Supervision, Building Market Supervision, Urban Development and Rural Development. Freedom City, New City and Northwest's Science City were all built to plans it approved, and the grid streets lined with birches are what those plans look like. Housing Support provides public rental homes for civil servants, teachers and young families, Building Market Supervision writes the building codes for permafrost and heavy snow loads, and Rural Development helps the inland pastures and fishing villages with roads, heating and running water.
    in: div_16cxr8
    offset_km: [2.74, 1.59]
    site: { size_m: [140, 110], layout: lshape }

