  # ── 马斯林山军事与航天设施（M25）：深空太空军 ──
  - id: poi_bwm8fb
    subtype: command_centre
    status: generated
    names:
      zh: 星港指挥中心
      en: Starport Command Centre
      art-x-viking: Kommandozentrale Sternhafen
      art-x-buckham: Centro di Comando di Porto Stella
    notes:
      zh: 星港指挥中心位于星港区东北部，是深空太空军在马斯林山的最高指挥机构，统一指挥马斯林山的航天发射、在轨航天器管理、太空监视和反导作战。主楼里是一座巨大的指挥大厅，正面的屏幕墙实时显示轨道上数万个目标的位置和每一次发射的飞行轨迹；东岭相控阵雷达、蒂鲁尤阿克峰光学观测站、星港深空测控站和各卫星地面站的数据都汇集到这里，经计算机融合后形成一张完整的太空态势图。主楼周围是参谋机关、通信枢纽、营房和训练场，构成一座完整的营区。指挥中心与群峰地下指挥城同步值班、互为备份，任何一处受损，另一处都能立即接管指挥。星港区以航天港得名，指挥中心是区内最大的单位，许多军官的家属就住在附近的城区，营区东南不远处的星港防空阵地专门负责它的空中防御。
      en: Starport Command Centre, in the north-east of Starport District, is the Deep Space Force's highest command at Maslin Mountain, directing launches, the management of spacecraft in orbit, space surveillance and missile defence. Its main building holds a vast command hall whose screen wall shows, in real time, tens of thousands of objects in orbit and the track of every launch. Data from the East Ridge phased-array radar, the Mount Tirrujuaq optical station, the Starport deep space station and the satellite ground stations all arrive here and are fused by computer into a single picture of what is happening in space. Around the main building are the staff offices, a communications hub, barracks and a training ground, a garrison in its own right. The centre keeps watch in step with the underground command complex in the High Peaks; either can take over at once if the other is lost. Starport District is named after its spaceport, and the command centre is the district's largest employer, with many officers' families living in the town nearby. The Starport Air Defence Site, a short way to the south-east, exists to protect it from the air.
    in: div_nytsvb
    offset_km: [4.95, 7.07]
    site: { size_m: [1200, 800], layout: camp, variant: hq, angle_deg: 30 }
    access_road: true
    military:
      unit: { zh: 深空太空军马斯林山指挥中心, en: Deep Space Force Maslin Mountain Command Centre }
      branch: { zh: 深空太空军, en: Deep Space Force }
      equipment:
        zh: 联合指挥大厅、空间态势显示中心、通信枢纽
        en: Joint command hall, space situation centre and communications hub
      personnel: 3200
