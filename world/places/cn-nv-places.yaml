    wonder:
      zh: 世界唯一的电磁发射导轨，长约 30 公里，把火箭推到数倍声速
      en: The only electromagnetic launch rail in the world, about 30 km long, sending rockets off at several times the speed of sound
    notes:
      zh: 群峰电磁发射场是马斯林山最引人注目的未来设施：一条长约三十公里的电磁导轨，从群峰训练管理区南缘的山麓起步，沿着山坡一路向北爬升，出口海拔将近两千米。导轨的原理与磁悬浮列车相似，载着小型运载火箭或货运舱的滑车在强大磁场的推动下悬浮加速，离开导轨时速度已达声速的数倍，再由火箭发动机接力送入轨道。火箭因此可以省下大量推进剂，向轨道运送补给和小卫星的成本大大降低。导轨起点设有装载站和储能电站，发射前储能装置用数小时蓄满电能，再在几十秒内一次释放；沿线每隔一段设有维护站。出口建在高处，是为了让滑车离开导轨时周围空气已较为稀薄，减少阻力和发热。发射时滑车划过山坡的呼啸声，远在雪谷都能听到。
      en: The High Peaks Electromagnetic Launcher is the most remarkable of Maslin Mountain's new facilities, an electromagnetic guideway about 30 km long that starts in the foothills on the southern edge of the High Peaks Training Area and climbs north up the mountainside to an exit nearly 2,000 m high. It works much like a maglev train. A sled carrying a small launch vehicle or cargo pod floats on a powerful magnetic field and is driven faster and faster until it leaves the guideway at several times the speed of sound, when a rocket engine takes over and carries it into orbit. The rocket needs far less propellant this way, which makes sending supplies and small satellites to orbit much cheaper. At the foot of the guideway are the loading terminal and an energy storage power station that charges for hours before a launch and releases it all within tens of seconds, and maintenance stations stand at intervals along the line. The exit is high up so that the sled leaves the guideway in thinner air, with less drag and heating. When a sled flies, its roar up the mountainside can be heard as far away as Snow Valley.
    in: div_q5h8zp
