      art-x-buckham: Radar Costiero di Porto Stella
    notes:
      zh: 星港海岸雷达站位于星港区北部临海的一座小山上，监视北部海域和低空飞行的目标。山地雷达站居高临下，却难以发现贴着海面飞行的飞机和小船，海岸雷达站正好弥补这一点：站内的超低空雷达能看到海平面附近的目标，与西岭雷达站一高一低，共同织成马斯林山的雷达网。每次火箭发射前，雷达站还负责确认落区海域没有船只进入，必要时通知海事部门疏导。站区规模不大，只有几十名官兵轮换值守；冬季海风夹着冰粒，雷达罩需要定期除冰。
      en: Starport Coastal Radar Station sits on a small hill by the sea in the north of Starport District, watching the northern seas and low-flying targets. The mountain radars look down from on high but struggle to see aircraft and small boats skimming the sea, and this station fills that gap. Its very-low-altitude radar sees targets near sea level, and together with West Ridge, one high and one low, it completes Maslin Mountain's radar net. Before every launch it also confirms that no ships have entered the splashdown zone, calling in the maritime authority to clear them if needed. The station is small, with a few dozen crew on rotation, and in winter, when the sea wind carries ice, the radomes have to be de-iced regularly.
    in: div_nytsvb
