    names:
      zh: 北维京岛领地政务院自然资源和环境保护部
      en: Ministry of Natural Resources and Environmental Protection, North Viking Island Executive Council
    short_names:
      zh: 自然资源和环境保护部
      en: Ministry of Natural Resources and Environmental Protection
    notes:
      zh: 北维京岛领地政务院自然资源和环境保护部，位于政务院大街南侧第二排，负责土地、森林、冰川和海洋的保护与利用。部内设政策司、自然生态保护司、大陆生态环境司、水生态环境司、海洋生态环境司、大气环境司、土壤生态环境司、固体废物和化学品司、环境影响评价和排放管理司、生态环境监测司和生态环境执法署。洛龙山脉和马斯林山脉的冰川、内陆的针叶林和驯鹿牧场、西海岸的峡湾都在它的保护名录上；环境影响评价和排放管理司审批港口、矿山和航天设施的建设，生态环境监测司与西北市的寒岭生态研究站合作，长期观测冰川退缩和冻土变化。
      en: The Ministry of Natural Resources and Environmental Protection, in the second row on the south side of Council Row, protects and manages the island's land, forests, glaciers and seas. Its departments are Policy, Nature Conservation, Land Ecology, Freshwater Ecology, Marine Ecology, Air Quality, Soil Ecology, Solid Waste and Chemicals, Environmental Impact and Emissions, and Environmental Monitoring, with an Environmental Enforcement Agency. The glaciers of the Lorond and Maslin ranges, the inland conifer forests and reindeer pastures and the fjords of the west coast are all on its protected lists. Its impact assessors approve ports, mines and space facilities, and its monitoring department works with the Frost Ridge Ecological Station in Northwest City to track the retreat of the glaciers and changes in the permafrost.
    in: div_16cxr8
    offset_km: [2.55, 1.22]
    site: { size_m: [140, 80], layout: slab }

  - id: bld_0rx5yn
    subtype: government
    status: generated
    names:
      zh: 北维京岛领地政务院交通部铁路司
      en: Railways Department, Ministry of Transport, North Viking Island Executive Council
    short_names:
      zh: 交通部铁路司
      en: Railways Department
    notes:
      zh: 北维京岛领地政务院交通部铁路司，在交通部旁单独建楼，负责全岛铁路的规划、建设监督和运营安全。北维京岛有西马高速铁路、自勒高速铁路、新洛高速铁路和马斯林山航天高速铁路四条轮轨线路，运营时速 400 公里，维西、贝马两条露天磁悬浮时速 600 公里，维贝真空磁悬浮和通往维京群岛的维长真空磁悬浮则以每小时 800 公里在真空管道里运行；铁路司审定新线方案和时刻表的基本框架，监督冻土路段、长隧道和防雪设施的安全，冬季协调除雪车和道岔融雪。维长真空磁悬浮的海底隧道由它与维京群岛的交通部门共同管理。铁路在岛内长途客运中的地位越来越重要，它是交通部唯一单独建楼的司。
      en: The Railways Department of the Ministry of Transport has its own building beside the ministry and plans the island's railways, supervises their construction and oversees their safety. North Viking Island has four wheel-on-rail lines running at 400 km/h, the Northwest–Maslin Mountain, Freedom City–Lekor, New City–Lorond Mountain and Maslin Mountain Aerospace high-speed railways, two open-air maglevs at 600 km/h, Viking Port–Northwest and Beckerle–Maslin Mountain, while the Viking Port–Beckerle Vacuum Maglev and the Viking Port–Longship Vacuum Maglev to the Viking Islands run at 800 km/h in vacuum tubes. The department approves new lines and the framework of the timetable, checks the safety of permafrost stretches, long tunnels and snow defences, and in winter coordinates snowploughs and switch heating. It runs the undersea tunnel of the Viking Port–Longship line jointly with the Viking Islands' transport authorities. As rail carries more and more of the island's long-distance travel, it is the only department of the ministry with a building of its own.
    in: div_16cxr8
    offset_km: [2.7, 1.32]
    site: { size_m: [120, 70], layout: slab }

  - id: bld_91a3v2
    subtype: government
    status: generated
    names:
      zh: 北维京岛领地政策和计划委员会
      en: North Viking Island Policy and Planning Commission
    short_names:
      zh: 政策和计划委员会
      en: Policy and Planning Commission
    notes:
      zh: 北维京岛领地政策和计划委员会，是政务院直属的特设委员会，位于政务院大街北侧正对议会综合办公区的一端。委员会由总理主持，各部部长和独立专家参加，负责编制领地的中长期发展规划，协调跨部门的重大政策，并评估各项政策的实施效果。航天产业、科学城、贝克勒自由贸易区和通往长船的海底通道这样跨越多个部门的大项目，都先在这里形成方案，再提交议会；委员会每年发布领地发展报告，公开各市人口、产出和公共服务的指标。大楼是一座方形独栋，顶层的大会议室可以俯瞰人民大道。
      en: The North Viking Island Policy and Planning Commission is a special commission directly under the Executive Council, on the north side of Council Row facing the Parliament Complex. Chaired by the premier, with the ministers and independent experts as members, it draws up the territory's medium- and long-term development plans, coordinates major policies that cross ministries and reviews how policies are working. Projects that span several ministries, such as the space industry, Science City, the Beckerle Free Trade Zone and the undersea link to Longship, take shape here before going to the parliament, and every year the commission publishes a development report with figures on each city's population, output and public services. The building is a square block whose top-floor council room looks down People's Avenue.
    in: div_16cxr8
    offset_km: [2.52, 1.92]
    site: { size_m: [90, 90], layout: block }

