      zh: 望星天文台
      en: Stargaze Observatory
      art-x-viking: Sternwarte Sternwacht
      art-x-buckham: Osservatorio di Guarda Stella
    notes:
      zh: "望星天文台建在西北市望星区望星湾畔的高地上，望星区的名字就来自这座天文台。天文台拥有领地最大的民用光学望远镜，日常观测恒星、星团和极光，也承担大学的教学实习，北维京大学和林道理工学院的学生常在这里值夜班。望星区沿科学大道展开，深空太空军北维京研发中心等科研机构就在附近，区里的街道多以星座和天文学名词命名。望星湾北面有岬角伸入海中，替海湾挡住外海的风浪，冬季长夜里空气清冷、天空澄澈，是北维京岛观赏极光最有名的地方之一，天文台的高地上常常整夜站着举着相机的人。\n这座城市格外珍惜夜空。冬天每逢晴朗的新月之夜，望星区和科学城的路灯统一调暗两小时，天文台向市民开放，排队看月面环形山和星团的人里一半是孩子；队伍太长时，讲解员会关掉手电，让大家先用肉眼在头顶找出北斗七星。天文台每年还会印一幅星图，作为勒克尔丰收节「回娘家」的礼物：西北市的彩车载着一捆捆星图开到勒克尔维克，勒克尔的农家把它贴在谷仓门后，说是照着它就知道哪天该收麦子。研究员们则自嘲，全岛最受欢迎的科研成果不是论文，而是这幅星图。"
      en: "The Stargaze Observatory stands on high ground beside Stargaze Bay in Stargaze District of Northwest City, and the district takes its name from it. The observatory has the largest civilian optical telescope in the territory; it watches stars, star clusters and the aurora night by night and also takes university students for training, so students from the University of North Viking and the Woodway Institute of Technology often pull night shifts here. Stargaze District stretches along Science Avenue, with research bodies such as the Deep Space Force North Viking Research and Development Centre close by, and many of its streets are named after constellations and astronomical terms. A headland to the north shelters Stargaze Bay from the open sea, and on long winter nights the air is cold and the sky perfectly clear, making it one of the best-known places on North Viking Island to see the northern lights; people with cameras often stand on the observatory's hill all night.\nThe city guards its night sky. On clear moonless winter nights the street lights of Stargaze and Science City are dimmed for two hours and the observatory opens to the public, and half the queue to see the moon's craters and the star clusters is children; when the queue grows too long, the guides switch off their torches and ask everyone to find the Plough overhead with the naked eye first. Each year the observatory also prints a star chart as Northwest City's gift for the \"visiting the old home\" custom at the Lekor harvest festival: the city's float carries bundles of charts to Lekorvik, where farming families pin them inside their barn doors and say they can tell from them when to bring in the wheat. The researchers joke that the island's most popular piece of science is not any paper but this chart."
    in: div_g27nda
    offset_km: [-2, -1]
    site: { size_m: [80, 80], layout: tower }

  - id: poi_bjwpzs
    subtype: university
    status: generated
    names:
      zh: 北维京大学
      en: University of North Viking
      art-x-viking: Universität Hea Veiling
      art-x-buckham: Università di Veiling Nord
    notes:
      zh: "北维京大学是领地规模最大的综合性大学，主校区在西北市林道区，占地约 1.6 平方公里。林道在维京语里意为「椴树滩」，大学的教学楼、图书馆和实验室散布在椴树林间，与同区的林道理工学院之间有林荫步道和自行车道相连，形成一片开放的学术园区。校园外围分布着大学附属的研究所、孵化器和技术转移中心，许多科技企业由师生创办，毕业生多进入望星区、科学城的实验室和马斯林山的航天机构。观星高速从区内穿过，西接自由市白桦区，东通望星区和科学城，研究人员每天在这条走廊上往返。学期中校园里能听到多种语言，国际学生和访问学者常年往来，大学的公开讲座和音乐会向全体市民开放。\n大学城夜里最热闹，烤土豆、奶酪热汤和肉桂卷是期末考试周的标配，小吃摊开到凌晨，摊主们记得每个熬夜学生爱吃什么。科学大道上随便问一个路人，多半是这所大学的老师或学生，西北市「博士城」的外号就是这么来的，据说问路时对方还会掏出笔给你画一张示意图。每年开学第一周，新生要在椴树下认领一棵树，挂上写着自己名字的木牌，毕业时再回来把木牌取下；有人读完硕士又读博士，那块木牌在同一棵树上挂了将近十年。"
      en: "The University of North Viking is the largest comprehensive university in the territory, with its main campus of about 1.6 km² in Woodway District of Northwest City. Woodway means \"lime-tree strand\" in Viking, and the university's teaching buildings, libraries and laboratories are scattered among lime woods, joined to the Woodway Institute of Technology in the same district by tree-lined paths and cycle tracks into one open academic park. Around the edges of the campus are the university's institutes, incubators and technology transfer centre; many tech firms were founded by its staff and students, and graduates mostly go on to the laboratories of Stargaze and Science City and the aerospace bodies at Maslin Mountain. The Stargazer Expressway runs through the district, west to Birchwood in Freedom City and east to Stargaze and Science City, and researchers travel this corridor every day. In term time many languages can be heard on campus, international students and visiting scholars come and go all year, and the university's public lectures and concerts are open to everyone in the city.\nThe university town is liveliest at night, when baked potatoes, hot cheese soup and cinnamon buns see students through exam week and the food stalls stay open past midnight, their owners remembering what each night owl likes. Ask almost anyone on Science Avenue and the chances are they teach or study here, which is how Northwest City came to be called \"PhD Town\"; ask the way, they say, and you will be handed a sketch map. In the first week of each academic year, freshers adopt a lime tree and hang a wooden tag with their name on it, coming back to take it down when they graduate; for someone who stays on for a master's and then a doctorate, the tag can hang on the same tree for nearly ten years."
    in: div_fr1vq9
    offset_km: [1.5, -1]
    site: { size_m: [1600, 1000], layout: campus }

  - id: poi_byj338
    subtype: college
    status: generated
    names:
      zh: 林道理工学院
      en: Woodway Institute of Technology
      art-x-viking: Technische Hochschule Waldweg
      art-x-buckham: Politecnico di Via Tiglio
    in: div_fr1vq9
    offset_km: [-2, 1.2]
    site: { size_m: [900, 600], layout: campus }
    notes:
      zh: "西北市林道区的理工科学院，和其他高校同在林道大学城，以航天工程、电子和材料专业见长，毕业生多进入科学城和马斯林山的航天企业与研究机构。校园中央立着一枚退役的探空火箭，学生考试前喜欢去摸一下它的尾翼讨个好运，尾翼的漆因此被摸得发亮。每年春天的「纸飞机节」上，各系学生在教学楼顶比赛谁的纸飞机飞得最远，冠军的设计图会贴进学院的走廊里。"
      en: "A college of technology in Woodway, Northwest City, sharing the Woodway university town with other institutions and strongest in aerospace engineering, electronics and materials; most graduates go on to the space companies and research bodies of Science City and Maslin Mountain. A retired sounding rocket stands in the middle of the campus, and students touch its fins for luck before exams, so that the paint on them is rubbed shiny. At the Paper Plane Festival each spring, students from every department compete from the roofs of the teaching blocks to see whose paper plane flies furthest, and the winning design is pinned up in the college corridor."

  - id: poi_edha0r
    subtype: research_institute
    status: generated
    names:
      zh: 寒岭生态研究站
      en: Frost Ridge Ecological Station
      art-x-viking: Ökologische Station Frostkamm
      art-x-buckham: Stazione Ecologica di Fredd Tehee
    in: div_479xae
    offset_km: [0.8, 0.6]
    site: { size_m: [500, 400], layout: campus }
    notes:
      zh: "西北市寒岭区山岭间的生态研究站，研究高寒山地的森林、苔原、积雪和野生动物，也是北维京岛大学和林道理工学院学生的野外实习基地。研究站最出名的工作是每年冬天清点山岭里的雪兔，研究员和志愿者踩着雪鞋沿固定路线走上几天，结果会在西北广播电视中心的晚间新闻里逐区公布。站里的食堂只有一张长桌，研究员和来访的徒步者一起吃饭，墙上挂满了历年的雪兔足迹拓片。"
      en: "An ecological field station in the hills of Frost Ridge District, Northwest City, studying the forests, tundra, snow cover and wildlife of the cold uplands, and a field base for students of the University of North Viking Island and the Woodway Institute of Technology. Its best-known work is the winter count of mountain hares: researchers and volunteers spend days on snowshoes walking fixed routes through the hills, and the results are announced district by district on the Northwest Broadcasting Centre's evening news. The station canteen has a single long table where researchers eat with visiting walkers, beneath walls hung with rubbings of hare tracks."
  - id: bld_z6csvp
    subtype: townhall
    status: generated
    names:
      zh: 新城市人民政府
      en: New City Government
      art-x-viking: Stadtregierung Neustad
      art-x-buckham: Governo Cittadino di Neu Teatu
    notes:
      zh: "中苑区新市中心的市政府与市级机关。大楼和新城的其他建筑一样是白墙、木顶、大玻璃窗，一楼的市民服务大厅里专设了一角给带孩子来办事的年轻父母，有游戏垫和换尿布台，这在「婴儿车之城」是标配。"
      en: "The city government and offices at the heart of the new Central Gardens centre. Like the rest of New City it is built with white walls, a timber ceiling and tall windows, and the public service hall on the ground floor has a corner for young parents who bring their children along, with play mats and changing tables: standard equipment in \"Pram City\"."
