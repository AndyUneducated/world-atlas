      en: Railways Department, Ministry of Transport, North Viking Island Executive Council
    short_names:
      zh: 交通部铁路司
      en: Railways Department
    notes:
      zh: 北维京岛领地政务院交通部铁路司，在交通部旁单独建楼，负责全岛铁路的规划、建设监督和运营安全。北维京岛有维贝铁路、西马铁路、新洛铁路和维西、自勒等城际铁路，以及通往维京群岛的维长城际铁路，高速线路的运营速度为每小时三百到三百五十公里；铁路司审定新线方案和时刻表的基本框架，监督冻土路段、长隧道和防雪设施的安全，冬季协调除雪车和道岔融雪。维长城际铁路的海底隧道由它与维京群岛的交通部门共同管理。铁路在岛内长途客运中的地位越来越重要，它是交通部唯一单独建楼的司。
      en: The Railways Department of the Ministry of Transport has its own building beside the ministry and plans the island's railways, supervises their construction and oversees their safety. North Viking Island has the Viking Port–Beckerle, Northwest–Maslin Mountain and New City–Lorond Mountain railways, intercity lines such as Viking Port–Northwest and Freedom City–Lekor, and the Viking Port–Longship Intercity Railway to the Viking Islands, with high-speed services at 300 to 350 km/h. The department approves new lines and the framework of the timetable, checks the safety of permafrost stretches, long tunnels and snow defences, and in winter coordinates snowploughs and switch heating. It runs the undersea tunnel of the Viking Port–Longship line jointly with the Viking Islands' transport authorities. As rail carries more and more of the island's long-distance travel, it is the only department of the ministry with a building of its own.
    in: div_16cxr8
    offset_km: [2.7, 1.32]
    site: { size_m: [120, 70], layout: slab }

  - id: bld_91a3v2
