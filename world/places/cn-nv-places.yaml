    site: { size_m: [320, 240], layout: stadium }
    notes:
      zh: "维京港的足球场，在瓦尔维克区鲸湾港边，是维京港足球俱乐部的主场。看台的顶棚只盖住一半，本地球迷说这是故意的：「维京港的球赛，就该淋着雨看。」比赛前球迷用维京语齐唱一首古老的划桨歌，节拍和长船划桨的号子一样，客队球员常被唱得发怵。维京港和贝克勒之间的比赛是全岛最受关注的对决，比赛日的维贝铁路列车上挤满了穿着两队球衣的球迷。"
      en: "Viking Port's football stadium, beside Walvik Harbour in Walvik District and home of Viking Port Football Club. The roof covers only half the stands, which local fans insist is deliberate: \"a Viking Port match should be watched in the rain.\" Before kick-off the fans sing an old Viking rowing song in unison, its beat that of a longship's oar-strokes, which tends to rattle visiting players. Matches between Viking Port and Beckerle are the most watched fixture on the island, and on match days the Viking Port–Beckerle trains are packed with fans in both teams' shirts."

  - id: bld_9rfesr
    subtype: office
    status: generated
    names:
      zh: 菲尔内斯海关大楼
      en: Fyrnes Customs House
      art-x-viking: Zollhaus Fyrnes
      art-x-buckham: Dogana di Capo Faro
    notes:
      zh: "客运码头旁的海关与边检办公楼。海关大楼的外墙上挂着一块大钟，进出港的旅客都用它对时。楼里有一间不大的展室，陈列着历年查获的奇怪物品，从走私的鲸牙到藏在奶酪里的手表，是孩子们最爱参观的地方。"
      en: "Customs and border offices beside the ferry terminal. A large clock on its façade is the one arriving and departing passengers set their watches by. Inside, a small exhibition room shows the strangest items ever seized, from smuggled whale teeth to a watch hidden in a cheese, and is a favourite with children."
    in: div_pkfa1g
    offset_km: [4.6, -1.7]
    site: { size_m: [160, 110], layout: hall }

  - id: poi_vaw6nk
    subtype: castle
    status: generated
    names:
      zh: 格约特斯塔德石垒
      en: Grjotstad Stone Fort
      art-x-viking: Grjotstad
      art-x-buckham: Fortezza di Muro Pietra
    notes:
      zh: "维京时代的石垒遗址，格约特斯塔德旧城围绕它形成，区名由此而来。石垒的围墙用未经打磨的大石块干砌而成，没有用一点灰浆，至今仍然稳稳立着。每周六的石垒市集从清晨开到中午，熏鲱鱼、黑麦面包和手织毛衣摆满了墙脚，维京语的吆喝声比中文还多。"
      en: "Ruins of a Viking-age stone fort; the old town of Grjotstad grew up around it and the district is named after it. Its walls are dry-stone, built of unworked boulders without a trace of mortar, and they still stand firm. The Saturday market at the fort runs from dawn to noon, with smoked herring, rye bread and hand-knitted jumpers lined up along the foot of the walls and more calls in Viking than in Chinese."
    in: div_t3bfmm
    offset_km: [0, 0]
    site: { size_m: [240, 240], layout: park }

  - id: bld_ggjp3x
    subtype: tower
    status: generated
    names:
      zh: 海门国际金融中心
      en: Seagate International Finance Centre
      art-x-viking: Internationales Finanzzentrum Seetor
      art-x-buckham: Centro Finanziario Internazionale di Porta Mar
    notes:
      zh: "海门商务带的地标塔楼，维京港最高的建筑。塔顶的灯每晚按维京港市旗的颜色亮起墨绿和金色，夏至前后港里船只午夜鸣笛时，塔顶的灯会跟着笛声闪烁。观景层的咖啡馆能一眼看到外礁深水港和鲸湾跨海大桥。"
      en: "Landmark tower of the Seagate business strip and the tallest building in Viking Port. Each night its crown is lit in the dark green and gold of the Viking Port flag, and when the harbour's ships sound their midnight horns around midsummer the lights flash in time. The café on the observation level looks straight out to the Outer Skerry Deep-Water Port and the Walvik Sea Bridge."
    in: div_k1yr6m
    offset_km: [0.5, 0.3]
    site: { size_m: [90, 90], layout: tower }

  - id: bld_fzfqap
    subtype: townhall
    status: generated
    names:
      zh: 西北市人民政府
      en: Northwest City Government
      art-x-viking: Stadtregierung Nordwest
      art-x-buckham: Governo Cittadino di Nordveste
    notes:
      zh: "鹿鸣区的市级机关建筑群。市政府大楼前的路灯和望星区一样，在晴朗的新月之夜会调暗两小时。大厅的天花板上画着一幅北维京岛冬夜的星空，许多来办事的市民会抬头找一会儿自己认得的星座。"
      en: "The city government complex in Deersong District. The street lights outside are dimmed for two hours on clear moonless nights, as in Stargaze. The hall ceiling is painted with North Viking Island's winter night sky, and many people waiting their turn look up to pick out the constellations they know."
    in: div_zs7kjk
    offset_km: [0.3, 0.4]
    site: { size_m: [320, 240], layout: complex }

  - id: bld_6m4rdt
