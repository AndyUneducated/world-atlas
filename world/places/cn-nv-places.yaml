      en: Snow Valley Ski Area
      art-x-viking: Skigebiet Schneetal
      art-x-buckham: Comprensorio Sciistico di Valle Neve
    notes:
      zh: "终年积雪的谷地上的滑雪场，冬季雪谷公路封闭时只能乘缆车上山。马斯林山晴天多，滑雪场常能在蓝天下滑雪，运气好时还能看到星港的火箭从远处升起。山顶木屋里卖一种把奶酪和土豆一起烤到焦黄的「雪道饼」，滑完一趟来一块，是这里的老规矩。"
      en: "Ski slopes in the snowbound valley; when the Snow Valley Highway closes in winter the only way up is by cable car. Maslin Mountain has many sunny days, so skiers here often ski under blue skies, and with luck they can watch a rocket rise from Starport in the distance. The summit hut sells the golden-baked cheese-and-potato \"piste cake\", and one after every run is the house rule."
    in: div_0tsyzy
    offset_km: [1.4, 1.0]
    site: { layout: park, size_m: [1400, 900] }
  - id: bld_xv9d1f
    subtype: townhall
    status: generated
