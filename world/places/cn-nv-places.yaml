      en: "Deep-water container port reclaimed on a group of skerries more than 20 km off Walvik, deep enough for the largest container ships; the Walvik Sea Bridge joins it to Walvik Harbour. Driving over the bridge you see the rows of ship-to-shore cranes standing on the skerries like a herd of giant giraffes, which is what Viking Port children call them."
