      art-x-viking: Raumflugzeugbasis Schneetal
      art-x-buckham: Base Spazioplani di Valle Neve
    notes:
      zh: 雪谷空天飞机基地位于雪谷区东部平坦的谷底，拥有马斯林山最长的跑道，长五千多米，专为空天飞机起降而建。空天飞机像普通飞机一样从跑道起飞，借助运载母机或自身的发动机爬升到高空，再点燃火箭发动机进入轨道，完成任务后滑翔返回，降落在同一条跑道上。返航的空天飞机速度很快，又没有动力，只有一次着陆机会，因此跑道又长又宽，两端还留有很长的安全区；跑道上的融雪系统和全天候着陆引导设备保证冬季也能使用。着陆后，空天飞机被拖进大型机库，检查隔热层、加注推进剂，几周后就能再次飞行；需要大修时，再经公路送往西坪的飞船整修厂。基地与西侧的雪谷空军基地相邻，两者共用油库和消防力量，并经马斯林山空天高速与城区相连。
      en: The Snow Valley Spaceplane Base lies on the flat valley floor in the east of Snow Valley District and has the longest runway at Maslin Mountain, more than 5 km, built for spaceplanes. A spaceplane takes off from the runway like an ordinary aircraft, climbs high on a carrier aircraft or its own engines, then lights its rocket engines to reach orbit, and when its mission is done it glides home to land on the same runway. A returning spaceplane is fast and unpowered and has only one chance to land, so the runway is long and wide with long safety areas at both ends, and snow melting and all-weather landing guidance keep it usable in winter. After landing the spaceplane is towed into a large hangar where its heat shield is inspected and it is refuelled, ready to fly again within weeks; for a major overhaul it goes by road to the refurbishment plant at West Heath. The base adjoins Snow Valley Air Base to the west, sharing its fuel farm and fire service, and the Maslin Aerospace Expressway links both to the city.
    in: div_0tsyzy
    offset_km: [19.09, -3.54]
