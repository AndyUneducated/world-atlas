  - id: bld_1av471
    subtype: exhibition_centre
    status: generated
    names:
      zh: 天台国际会议中心
      en: Sky Terrace International Convention Centre
      art-x-viking: Internationales Kongresszentrum Himmelterrasse
      art-x-buckham: Centro Congressi Internazionale di Terrazza Cielo
    notes:
      zh: "天城市天台区度假集群中心的会议中心，是全领地规格最高的会议场馆，拥有大型会议厅、展厅和同声传译设施，场馆约 420 米长、260 米宽，领地的年度论坛、学术会议、国际论坛与大型会议多在此举行。中心坐落在天台山脚下、柳萨湾畔，周围是沿海湾和山坡层层排开的度假酒店、公寓式酒店和度假村，会议和商务旅游是天台区与度假并重的支柱。与会者从天城机场或天城港抵达，贝马磁悬浮也在天城站停靠；会后不少人顺路乘登山缆车上天台山看日出，或到岚山区泡温泉。天城的会议淡季在冬天，市里用温泉疗养、雪景和会议促销吸引客人，会议中心也常在这时接下学术年会和企业培训。会议厅的落地窗正对柳萨湾，湾东岸是天台区的沙滩与度假酒店，西岸是铁岗区，晴天能远远望见湾口的铁岬。天城是全岛最湿的城市，一年降水接近两千三百毫米，雨后天台山上云雾翻滚，柳萨湾上空常挂起一道横跨海湾的彩虹。\n与会者在茶歇时常常端着咖啡站到窗前看彩虹，主持人干脆把茶歇安排在雨后。中心门口有一个特别大的伞架，开大会的日子要摆上几百把公共雨伞，伞柄上刻着「天城」二字，散会时在城里任何一个伞架都能归还；会务组每次都会多订一批，因为总有代表把伞带回家当纪念品。"
      en: "The convention centre at the heart of the resort cluster in Sky Terrace District of Skytown City and the highest-specification conference venue in the territory, with a large plenary hall, exhibition halls and simultaneous interpretation facilities in a building about 420 m long and 260 m wide. The territory's annual forums, academic congresses, international forums and big conferences are mostly held here. It stands at the foot of Sky Terrace Mountain on the shore of Ljosa Bay, surrounded by resort hotels, serviced apartments and holiday villages rising in tiers along the bay and up the slopes, and conferences and business travel are a mainstay of Sky Terrace alongside holidays. Delegates arrive through Skytown Airport or Skytown Harbour, and the Beckerle–Maslin Mountain Maglev stops at Skytown Station; after the sessions many take the cable car up Sky Terrace Mountain for the sunrise or go to Mist Hill for the hot springs. Skytown's low season for conferences is winter, when the city draws visitors with spa breaks, snow scenery and conference deals, and the centre often takes academic annual meetings and company training then. The plenary hall's floor-to-ceiling windows face Ljosa Bay, with Sky Terrace's beaches and resort hotels on its east shore and Iron Knoll on its west; on clear days Iron Point can be seen at the mouth of the bay. Skytown is the wettest city on the island, with nearly 2300 mm of rain a year, and after rain mist rolls over Sky Terrace Mountain and a rainbow often arches across Ljosa Bay.\nDelegates often take their coffee to the windows at the break to look at the rainbow, and chairs have taken to scheduling the breaks for after the rain. By the entrance stands an outsize umbrella stand that holds several hundred public umbrellas on big conference days, their handles carved with the name \"Skytown\"; they can be returned to any stand in the city, and the organisers always order an extra batch, because some delegates invariably take one home as a souvenir."
    in: div_w1ea18
    offset_km: [1.2, -0.6]
    site: { layout: hall, size_m: [420, 260] }
  - id: poi_vybdrp
    subtype: theme_park
    status: generated
    names:
      zh: 银滩主题乐园
      en: Silver Beach Theme Park
      art-x-viking: Freizeitpark Silberstrand
      art-x-buckham: Parco Divertimenti di Spiaggia Argento
    notes:
      zh: "银滩主题乐园在天城市银滩区，是全岛最大的主题乐园，占地约 0.63 平方公里，有过山车、海洋馆、水上乐园、夏夜烟火和一座以维京传说为主题的园区。银滩沿海岸绵延十几公里，是北维京岛最长、最白的沙滩，乐园就建在海滨，旁边是银滩大酒店和数十家度假酒店、汽车营地和度假公寓，东岸公路沿海岸穿过全区。暑假期间全岛的家庭都会带孩子来这里，旺季时乐园和周边酒店还要从全岛各地招来大批季节工，许多大学生的第一份暑期工就是在乐园里扮演维京武士或推着冰淇淋车。维京传说园区里有一艘可以登上去的长船和一座会喷「龙息」的木雕巨龙，孩子们排队爬上船头，学着老船长的样子大喊「起锚」。\n银滩的夏天短而珍贵，乐园在夏至前后的夜晚放烟火，烟火映在海面上，从岚山区的山坡上看得最清楚，岚山的居民常在自家露台上摆好椅子等着开场。天城一年降水接近两千三百毫米，下雨天过山车照常开，排队的游客撑着刻有「天城」二字的公共雨伞，本地人说「不淋雨的过山车不算坐过天城的过山车」。海洋馆是雨天最热门的去处，玻璃隧道里游过鳕鱼和海豹，馆里的讲解员会告诉孩子们，外面下的雨，最后也都流回了这片海。"
      en: "The Silver Beach Theme Park, in Silver Beach District of Skytown, is the largest theme park on the island, covering about 0.63 km², with roller coasters, an aquarium, a water park, summer-night fireworks and an area themed on Viking legends. Silver Beach runs for more than ten kilometres along the coast and is the longest and whitest beach on North Viking Island; the park stands on the seafront next to the Silver Beach Grand Hotel and dozens of other resort hotels, campsites and holiday flats, and the East Coast Highway follows the shore through the district. In the summer holidays families from all over the island bring their children here, and in high season the park and the hotels around it take on crowds of seasonal workers from across the island; for many students, their first summer job is playing a Viking warrior or pushing an ice-cream cart in the park. The Viking legends area has a longship you can climb aboard and a great carved wooden dragon that breathes \"dragon's breath\", and children queue to climb onto the prow and shout \"Weigh anchor!\" like an old skipper.\nSummer on Silver Beach is short and precious, and on the nights around midsummer the park puts on fireworks that are reflected in the sea, best seen from the slopes of Mist Hill, where residents set out chairs on their terraces to wait for the show. Skytown has close to 2,300 mm of rain a year, and on rainy days the roller coasters keep running while the queues shelter under public umbrellas carved with the word \"Skytown\"; locals say \"you haven't ridden a Skytown roller coaster until you've ridden it in the rain\". The aquarium is the most popular refuge on wet days, with cod and seals swimming past its glass tunnel, and the guides tell the children that all the rain falling outside ends up flowing back into this same sea."
    in: div_f5s7ax
    offset_km: [1.0, 0.8]
    site: { layout: park, size_m: [900, 700] }
  - id: poi_y3d08p
    subtype: hotel
    status: generated
    names:
      zh: 银滩大酒店
      en: Silver Beach Grand Hotel
      art-x-viking: Grandhotel Silberstrand
      art-x-buckham: Grand Hotel Spiaggia Argento
    notes:
      zh: "海滩边的高层度假酒店，银滩酒店群中最早的一座。海滨露台上卖得最好的是柳萨湾贻贝配薯条和冰镇苹果酒。酒店大堂里摆着几十把刻着「天城」的公共雨伞，客人退房时偷偷带走一把，前台从来不说什么。"
      en: "A high-rise resort hotel on the sand, the first of the Silver Beach hotels. The best seller on its seaside terrace is Ljosa Bay mussels with chips and chilled cider. Dozens of public umbrellas carved with \"Skytown\" stand in the lobby, and when guests quietly take one away at checkout, reception never says a word."
