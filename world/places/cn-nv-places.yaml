  - id: poi_n5w3kb
    subtype: park
    status: generated
    names:
      zh: 斯佩基亚拉滨海公园
      en: Specchiara Waterfront Park
      art-x-viking: Uferpark Specchiara
      art-x-buckham: Parco Lungomare di Specchiara
    notes:
      zh: "斯佩基亚拉滨海公园在贝克勒自由贸易区斯佩基亚拉区，沿斯佩基亚拉湾岸修建了长廊、草坪和露天剧场，占地约 0.27 平方公里，可远眺倒映在湾面上的镜岛。斯佩基亚拉湾是北维京岛面积最大的海湾，四百三十多平方公里，湾内水深浪静，风平时水面如镜，斯佩基亚拉区由此得名。湾顶附近的镜岛面积二十四平方公里多，岛中央是一座海拔近两百米的圆丘，北面隔着镜岛水道与铁岬相望，岛影是贝克勒自由贸易区的标志景观，也画在自贸区的旗帜上，公园的长廊正对着这片倒影。斯佩基亚拉国际金融中心的双塔就矗立在湾畔，斯佩基亚拉港和维贝真空磁悬浮的终点贝克勒站都在同一区内，周末有船从港口载游客上岛。\n晴天傍晚，湾面平静得能把对岸的塔楼和湾心的镜岛完整倒映出来，镜岛的名字就由此而来。草坪上常有在附近上班的人午休时脱了鞋晒太阳，西装外套叠好垫在头下，手机调成静音，到点再匆匆穿鞋回去开会；本地人笑称这是贝克勒「一分钟只有五十秒」里难得的整分钟。周末这里则是各国侨民家庭野餐的去处，草坪上中文、维京语、巴克汉姆语和英语混在一起，露天剧场夏夜放映的电影也常配着四种语言的字幕。"
      en: "Specchiara Waterfront Park, in Specchiara District of the Beckerle Free Trade Zone, runs along the shore of Specchiara Bay with a promenade, lawns and an open-air theatre, covering about 0.27 km², and looks out across the bay to Mirror Isle and its reflection. Specchiara Bay is the largest bay on North Viking Island, more than 430 km², deep and sheltered, and in calm weather its surface is like a mirror, which is how the district got its name. Mirror Isle, near the head of the bay, covers a little over 24 km², rises to a dome nearly two hundred metres high and faces Iron Point across the Mirror Isle Sound to the north; its reflection is the emblem of the Beckerle Free Trade Zone and appears on the zone's flag, and the park's promenade faces it directly. The twin towers of the Specchiara International Finance Centre stand on the shore of the bay, Specchiara Port and Beckerle Station, the terminus of the Viking Port–Beckerle Vacuum Maglev, are in the same district, and at weekends boats carry visitors from the port out to the island.\nOn clear evenings the bay is calm enough to reflect the towers on the far shore and Mirror Isle in the middle of the bay in full, and that is where the isle's name comes from. At lunchtime the lawns are dotted with people from nearby offices who have kicked off their shoes to sit in the sun, suit jackets folded under their heads and phones on silent, until they hurry back into their shoes for the next meeting; locals joke that these are the rare full minutes in a Beckerle where \"a minute has only fifty seconds\". At weekends it is where expatriate families of every nationality come for picnics, Chinese, Viking, Buckham and English mingling on the grass, and the films shown in the open-air theatre on summer nights often carry subtitles in all four languages."
    in: div_8p9k5t
    offset_km: [0.4, 1.1]
    site: { layout: park, size_m: [900, 300] }
  - id: bld_mks7z1
    subtype: hospital
    status: generated
    names:
      zh: 贝克勒国际医院
      en: Beckerle International Hospital
      art-x-viking: Internationales Krankenhaus Beckerle
      art-x-buckham: Ospedale Internazionale di Beckerle
    notes:
      zh: "贝克勒自由贸易区卡波区的国际医院，院区约 300 米长、240 米宽，是全领地设备最先进的医院之一，接诊自贸区的外籍居民与过境旅客，也接待来自全岛和海外的病人。卡波区巴克汉姆语意为「海角」，位于卡波角一带，是自贸区的空港与联运枢纽：卡波国际机场是北维京岛最繁忙的国际航空货运机场，客运航站楼则是外国商务旅客进入贝克勒的主要门户，许多病人下了飞机就直接来到这里。贝克勒聚集了来自世界各地的企业和人才，英语使用比例全领地最高，医院的问诊台能用十几种语言接待病人，墙上的指示牌除了三种本地文字，还有英语和图示；区里的老住户多以巴克汉姆语为母语，航空、物流从业者则来自各地，候诊区里常能听到四五种语言同时交谈。医院与机场的海关监管区相距不远，急需的药品和器械可以随货运航班快速运到。南岸公路从区内穿过，西接萨科，东通斯佩基亚拉和保税港区。\n急诊室挂着一块时钟墙，显示世界各大城市的时间，方便外籍病人联系家人。夜班护士说，看一眼时钟墙就知道该给哪个病人的家里打电话了，有时候凌晨三点的急诊室里，护士正用英语安慰一位刚下飞机的旅客，隔壁床的老住户却用巴克汉姆语抱怨夜宵太淡。"
      en: "The international hospital of Capo District in the Beckerle Free Trade Zone, on a campus about 300 m long and 240 m wide. It is one of the best-equipped hospitals in the territory, treating the zone's foreign residents and travellers in transit as well as patients from across the island and overseas. Capo, Buckham for \"cape\", lies around Cape Capo and is the zone's air and multimodal hub: Capo International Airport is North Viking Island's busiest international air-cargo airport, and its passenger terminal is the main gateway for foreign business travellers coming into Beckerle, so many patients come straight here off the plane. Beckerle draws firms and people from all over the world and has the highest share of English speakers in the territory; the hospital's reception desks can receive patients in more than a dozen languages, and the signs carry English and pictograms as well as the three local scripts. Many of the district's long-time residents speak Buckham as their first language while its aviation and logistics workers come from everywhere, and four or five languages can often be heard at once in the waiting area. The hospital is not far from the airport's customs-controlled zone, so urgently needed medicines and equipment can arrive quickly on cargo flights. The South Coast Highway runs through the district, west to Sako and east to Specchiara and the bonded port.\nThe emergency department has a wall of clocks showing the time in the world's major cities, so foreign patients can contact their families. Night nurses say a glance at the clock wall tells them whose family it is a reasonable hour to call; at three in the morning a nurse may be comforting a just-landed traveller in English while the old resident in the next bed complains in Buckham that the late-night snack is too bland."
    in: div_e6pc44
    offset_km: [-0.8, 0.6]
    site: { layout: complex, size_m: [300, 240] }
