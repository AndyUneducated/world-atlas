  - id: poi_qtkddv
    subtype: college
    status: generated
    names:
      zh: 马斯林山飞行学院
      en: Maslin Mountain Flight Academy
      art-x-viking: Flugakademie Maslinberg
      art-x-buckham: Accademia di Volo di Maslin Tehee
    notes:
      zh: 马斯林山飞行学院位于和平区东北部的平原上，培养空军和深空太空军的飞行员，空天飞机的驾驶员也都从这里毕业。学员先在校园里完成理论学习和模拟器训练，再到跑道旁的停机坪驾驶初级教练机，最后改飞高级教练机。马斯林盆地东部地势平坦、空域开阔，周边又有山区、海岸和雪原，几乎所有复杂气象都能在一天之内遇到，是练习全天候飞行的理想场所。学院与城南的航天员训练中心合开空天飞行课程，部分优秀学员毕业后直接进入航天员选拔。每年夏季，学院的特技飞行队会在城区上空做公开表演。
      en: The Maslin Mountain Flight Academy, on the plain in the north-east of Peace District, trains pilots for the Air Force and the Deep Space Force, and every spaceplane pilot is a graduate. Cadets first study theory and train in simulators on the campus, then fly basic trainers from the ramp beside the runway, and finally move on to advanced trainers. The eastern Maslin basin is flat with open airspace, yet mountains, coast and snowfields are all close by, so almost every kind of difficult weather can be met within a single day, which makes it ideal for all-weather training. The academy runs a spaceflight course with the astronaut training centre south of the city, and some of its best graduates go straight into astronaut selection. Each summer its aerobatic team gives a public display over the city.
    in: div_nvrjpg
    offset_km: [8.49, 16.26]
    site: { size_m: [3200, 1500], layout: airbase, variant: school, angle_deg: 0 }
    military:
