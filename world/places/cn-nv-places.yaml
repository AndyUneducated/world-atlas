    site: { size_m: [1200, 500], layout: port, angle_deg: 84 }
    notes:
      zh: "天城的客运港，在天城市天台区，建在天台峡湾沿岸，港区约 1200 米长、500 米宽。天台峡湾长约十九公里，水深浪静，两岸是陡峭的山坡和森林，东南面就是山顶平台状的天台山，港口因此避开了外海的风浪。夏季客轮从维京港、维京群岛和更远的地方载来度假的游客，邮轮也在这里靠岸，游艇和游船沿峡湾停靠；码头上的旅客中心兼作天城的游客咨询处，可以预订酒店、登山缆车和峡湾游船的票。天城是北维京岛最受欢迎的度假地，天台区的度假酒店、公寓式酒店和度假村沿海湾和山坡层层排开，下了船坐一小段车就能住进海边或山坡上的酒店；天城机场也在附近，不少游客坐船来、坐飞机回。冬季客轮减少，港口安静下来，只有少数来泡温泉、看雪景的客人。港池里还停着一排出海观鸟、钓鱼的小游船，峡湾游船也从这里出发，沿岸驶到湾顶，看台河入湾处的阶地和层层排开的度假村。\n下船的游客走上码头，迎面就是全城第一个公共雨伞架，伞柄上刻着「天城」二字，本地人说这是「天城给客人的第一份礼物」。天城一年降水接近两千三百毫米，刚到的游客往往还没走出码头就用上了这把伞。傍晚小游船归航时总有海鸥跟在船尾，钓鱼的游客把小鱼抛向空中，海鸥一个俯冲就接住，码头上看热闹的孩子们跟着欢呼。"
      en: "Skytown's passenger harbour, in Sky Terrace District of Skytown City, built on the shore of Sky Terrace Fjord, its harbour area about 1200 m long and 500 m wide. Sky Terrace Fjord is about 19 km long, deep and calm, with steep wooded slopes on both sides and flat-topped Sky Terrace Mountain to the south-east, so the harbour is sheltered from the open sea. In summer passenger ships bring holidaymakers from Viking Port, the Viking Islands and further afield, cruise ships call, and yachts and pleasure boats moor along the fjord; the passenger centre on the quay doubles as Skytown's tourist information office, where hotels, the cable car and fjord cruises can be booked. Skytown is North Viking Island's most popular resort, and Sky Terrace's resort hotels, serviced apartments and holiday villages rise in tiers along the bay and the slopes, a short ride from the quay; Skytown Airport is close by, and many visitors arrive by sea and leave by air. In winter the ships thin out and the harbour falls quiet, with only a few visitors coming for the hot springs and the snow. In the harbour basin a row of small boats waits to take visitors out birdwatching and fishing, and the fjord cruise boats leave from here too, following the shore to the head to see the terraces where the Terrace River enters the fjord and the resorts rising tier on tier.\nStepping off the boat onto the quay, visitors meet the city's first public umbrella stand, the handles carved with the name \"Skytown\", and locals call it \"Skytown's first present to its guests\". With nearly 2300 mm of rain a year, new arrivals often put the umbrella to use before they have even left the quay. When the small boats return in the evening, gulls always follow in their wake; anglers toss small fish into the air, a gull swoops to catch each one, and children watching on the quay cheer."

  - id: poi_3kt6gb
    subtype: port
    status: generated
    names:
      zh: 萨科渔港
      en: Sako Fishing Harbour
      art-x-viking: Fischereihafen Sako
      art-x-buckham: Porto Peschereccio di Sako
    in: div_8m0jx4
    offset_km: [-11.71, -8.97]
    site: { size_m: [600, 300], layout: port, angle_deg: 96 }
    notes:
      zh: "萨科渔港是萨科勒的老渔港，在萨科区萨科湾畔，也是这座城市的发祥地：建市以前，萨科镇就是围着这片港湾长起来的巴克汉姆渔镇，彩色的石屋至今沿着港湾排开。港里停着几十条漆成蓝白两色的巴克汉姆式小渔船，船头都画着一只眼睛，渔民说这是为了「让船看得见回家的路」。这里至今仍是本岛南部最繁忙的渔港之一，渔船清晨出港，捕回鳕鱼、鲭鱼和贝类，渔获上岸后直接送进旁边的萨科鱼市拍卖。一条约 4.1 公里长的萨科渔港公路把渔港和萨科区城区连在一起，冷藏车从这里把鲜鱼运往全市的餐馆和超市。\n港口的作息跟着城里的工厂走。铁岗区的工厂每天中午十二点拉响汽笛，声音顺风传到港里，就是渔船收网回港的信号；萨科勒人自称「铁与鱼之城」，说的就是这个从城里只有一座炼铁炉时延续至今的习惯。午后码头最热闹：渔民在船边补网、给船眼补漆，老人们用巴克汉姆语争论当天的鱼价，码头边的小馆子用当天的鱼炖番茄鱼汤，配一块烤得焦脆的面包，渔民和游客常常挤在同一张桌上。每有新船下水，船主都要请一位老船长亲手给船头点上眼睛，围观的人齐喊一声「看路！」，这条船才算正式入了港。"
      en: "Sako Fishing Harbour is Sakole's old fishing harbour, on Sako Bay in Sako District, and the place where the city began: before the city was founded, the Buckham fishing town of Sako grew up around this harbour, and its brightly coloured stone houses still line the waterfront. Dozens of small Buckham-style boats painted blue and white lie at their moorings, each with an eye painted on its bow \"so that the boat can see its way home\", as the fishermen say. It is still one of the busiest fishing harbours in the south of the island: the boats go out at dawn for cod, mackerel and shellfish, and the catch goes straight from the quay into the Sako Fish Market next door to be auctioned. The Sako Fishing Harbour Road, about 4.1 km long, links the harbour with the town centre of Sako District, and refrigerated lorries carry fresh fish from here to restaurants and supermarkets across the city.\nThe harbour keeps time with the city's factories. Every day at noon the factories of Iron Knoll sound their whistle, and when the sound carries to the harbour on the wind it is the signal for the boats to haul in and head home; Sakole people call theirs \"the city of iron and fish\" because of this habit, which goes back to the days when the town had only one ironworks furnace. The quay is busiest in the afternoon: fishermen mend their nets and touch up the eyes on their boats, old men argue about the day's prices in Buckham, and the little restaurants on the waterfront stew the day's fish with tomatoes and serve it with a slice of crisp toasted bread, fishermen and visitors often squeezed in at the same table. Whenever a new boat is launched, its owner asks an old skipper to paint in the eye on the bow, and the onlookers shout \"Watch the road!\" together; only then is the boat truly part of the harbour."

  - id: poi_dcr97r
    subtype: port
    status: canon
    names:
      zh: 马斯林河口港
      en: Maslin Mouth Port
      art-x-viking: Hafen Maslinmündung
      art-x-buckham: Porto della Foce del Maslin
    notes:
      zh: "马斯林河口港在马斯林山市东营区，位于马斯林河注入大海的河口南岸，是全市唯一的港口，也是这座山地军事城市的货运门户。港区码头沿河口南岸排开，配有重型吊机和专供超大件装卸的泊位，驻军的油料、食品和装备都经海路运抵这里，再存入东营后勤基地，由卡车分送各个基地。运往星港和西坪发射场的大型火箭部件也多从这里上岸，一部分交给以东营站为起点的马斯林山航天高速铁路，直接转运到西坪发射场。一条约 19.6 公里长的马斯林河口港公路把港口与东营区城区相连，河口北面不远就是星港区的航天港，南面是东营空军基地。\n超长的箭体段由特制的平板车趁夜运走，前后有警车开道，车速比步行快不了多少，沿途居民常常半夜起来看「火箭过街」：孩子们披着毯子站在阳台上数轮子，老人们则搬出折叠椅坐在路边，看那白色的长筒子一寸一寸地挪过路口。港口的装卸工人多是东营区的老住户，他们说吊一节箭体比吊一船集装箱还紧张，每次落稳都要互相拍一下肩膀。东营湾一带的海风大，起重作业常要等风停，等风的工夫，码头食堂的炖牛肉就成了全港最抢手的东西。"
      en: "Maslin Mouth Port lies on the south bank of the Maslin River where it meets the sea, in East Camp District of Maslin Mountain City. It is the city's only port and the freight gateway to this mountain military city. Its quays run along the south bank of the estuary, equipped with heavy cranes and berths built for outsize loads. Fuel, food and equipment for the garrison all arrive here by sea and go into the East Camp Supply Depot before lorries take them out to the bases. Most of the large rocket sections bound for Starport and the West Heath launch site also come ashore here, and some are handed straight to the Maslin Mountain Aerospace High-Speed Railway, which starts at East Camp Station, for the run to West Heath. The Maslin Mouth Port Road, about 19.6 km long, links the port with the town of East Camp; just north of the estuary is the spaceport in Starport District, and to the south lies East Camp Air Base.\nThe longest rocket stages are carried away at night on purpose-built flatbed trailers behind police escorts, moving barely faster than walking pace, and people along the route often get up in the middle of the night to watch \"the rocket crossing the street\": children wrapped in blankets count the wheels from their balconies, and old people set up folding chairs at the kerb to watch the long white cylinder inch its way across each junction. Most of the dockers are long-time East Camp residents, and they say lifting a rocket stage is more nerve-racking than unloading a whole ship of containers; every time one is set down safely, they clap each other on the shoulder. The sea wind is strong around East Camp Bay, and lifts often have to wait for it to drop; while everyone waits, the beef stew in the quayside canteen becomes the most sought-after thing in the port."
    in: div_tc0ngk
    offset_km: [-2.49, 62.69]
    site: { size_m: [800, 400], layout: port, angle_deg: 275 }

  - id: poi_jf2kq4
    subtype: port
    status: generated
    names:
      zh: 沙洲港
      en: Sandbar Port
      art-x-viking: Hafen Sandbank
      art-x-buckham: Porto di Banco Sabbia
    notes:
      zh: "沙洲港是自由河口的港区，在自由市沙洲区，是自由市的海上门户，也是一座中型港口，占地约 0.4 平方公里。港口承担首府的散货、建材与燃料进口，港里既有渔船，也有运送建材和日用品的货轮；旁边的物流园为城区和北部农牧区中转货物，维西磁悬浮在沙洲站停靠，使这里成为铁路与海运的交汇点。环北维京岛高速从区内经过，穿过菲亚尔马克丘陵通往维京港。冬天沙洲港还是首府的破冰船停靠的地方，河口结冰的日子里，破冰船清晨出港，在冰面上开出一条水道，货轮跟在后面排队进港。沙洲区只有约六万人，是全市唯一临海的区，港口工人、渔民和物流从业者构成了社区的主体，维京语和中文并用的家庭比城区多得多。\n退潮时港外的沙洲露出水面，海鸟成群停在上面，沙洲区的名字就由此而来。渔港比首府更早存在，老渔民说，当年这里只有几座木构鱼棚和一座钟楼，如今港里的吊车比钟楼还高。清晨渔船靠岸，渔获直接送进旁边的沙洲老渔市；破冰船的船员们下了班也爱去老渔市喝一碗鳕鱼浓汤，冬天排队买汤的人一直排到钟楼脚下，船员们总是穿着橙色的工作服排在队里，一眼就能认出来。"
      en: "Sandbar Port is the harbour at the mouth of the Freedom River, in Sandbar District of Freedom City. It is the capital's gateway to the sea and a medium-sized port, covering about 0.4 km². It handles the capital's imports of bulk goods, building materials and fuel, and its berths hold fishing boats as well as freighters carrying building materials and everyday goods. The logistics park next door transfers goods for the city and the farming and grazing country to the north, and the Viking Port–Northwest Maglev stops at Sandbar Station, making this the point where rail and sea meet. The ring expressway runs through the district, across the Fjallmark hills to Viking Port. In winter Sandbar Port is also where the capital's icebreaker is based; on days when the estuary freezes, it sets out at dawn to cut a channel through the ice, and the freighters queue up behind it to come in. Sandbar District has only about sixty thousand people and is the city's only coastal district; dockers, fishermen and logistics workers make up most of the community, and families who use both Viking and Chinese are far more common here than in the rest of the city.\nAt low tide the sandbars outside the harbour rise above the water and flocks of seabirds settle on them, which is where the district gets its name. The fishing harbour is older than the capital, and old fishermen say that once there were only a few timber fish sheds and a clock tower here; now the port's cranes stand taller than the tower. When the boats come in at dawn, the catch goes straight to the Sandbar Old Fish Market next door. The icebreaker crew also like to drop into the old market for a bowl of thick cod soup after their shift; in winter the queue for soup reaches the foot of the clock tower, and the crew in their orange overalls are easy to spot in it."
    in: div_g4a8q0
    offset_km: [0.44, 2.71]
    site: { size_m: [1200, 500], layout: port, angle_deg: 274 }

  # ── 维京港、西北地标（M9）──
  - id: bld_hs6snj
    subtype: townhall
    status: generated
    names:
      zh: 维京港市政厅
      en: Viking Port City Hall
      art-x-viking: Rathaus Veiling Havn
      art-x-buckham: Municipio di Veiling Porto
    notes:
      zh: "维京港市政府驻地，石砌的建筑群。石砌的楼里至今保存着维京港最早的一面市旗，墨绿底上的金十字已经褪色。市长办公室的窗户正对鲸湾港，老港人说历任市长上任第一天，都要先站在窗前看一会儿港里的船。"
      en: "Seat of the Viking Port city government, a stone-built complex. Inside the stone building is kept the oldest Viking Port flag, its gold cross on dark green now faded. The mayor's office window looks straight over Walvik Harbour, and Old Port people say every mayor spends the first morning in office standing there watching the ships."
    in: div_z29w6h
    offset_km: [0.4, -0.6]
    site: { size_m: [300, 220], layout: complex }

  - id: poi_1ac7ar
    subtype: plaza
    status: generated
    names:
      zh: 维京港中央广场
      en: Viking Port Central Square
      art-x-viking: Zentralplatz Veiling Havn
      art-x-buckham: Piazza Centrale di Veiling Porto
    in: div_z29w6h
    offset_km: [-0.6, 0.5]
    site: { size_m: [260, 200], layout: plaza }
    notes:
      zh: "维京港的中心广场，在瓦尔维克区中心，面朝鲸湾港，广场约 260 米长、200 米宽，四周是市政机构、老商号和咖啡馆，维京港市政厅就在广场边上。维京港是北维京岛最早建成的城市，起源于鲸湾畔的捕鲸站，鲸湾捕鲸站博物馆离广场不远，从广场往湾边望去，旧日的捕鲸湾如今排满了集装箱、散货和滚装码头。瓦尔维克是全市人口最多的区，维京语至今是维京港一半居民的母语，广场上的商号招牌、街名和节庆都带着浓厚的北方色彩，老商号里卖的是熏鲱鱼、羊毛外套和航海用品。维京港一年降水将近一千九百毫米，广场上的行人却很少打伞，本地人更习惯一件连帽防水外套，雨天的咖啡馆窗边总坐满了避雨看港的人。市里的庆典和集会多在这里举行，领地旗上那个白色北欧十字原本就是维京港市旗的图案，广场旗杆上的市旗因此格外显眼。广场的石板地中央嵌着一个巨大的石制罗盘，各个方位刻着从这里出发的航线能到达的港口名，游客喜欢站在罗盘中心拍照。\n夏至前后鲸湾港的船只午夜鸣笛时，广场上会举办通宵的露天音乐会，乐队用维京语唱古老的船歌，听众跟着合唱到天亮。那一夜太阳几乎不落，凌晨两点的天空还泛着亮光，老港人说，这是一年里唯一一个「唱歌唱到天亮却不知道天亮了」的晚上。"
      en: "Viking Port's main square, in the centre of Walvik District facing Walvik Harbour, about 260 m long and 200 m wide, surrounded by civic offices, old trading houses and cafés, with Viking Port City Hall on one side. Viking Port was the first city built on North Viking Island and grew from the whaling station on Whale Bay; the Walvik Whaling Station Museum is not far from the square, and looking towards the bay from the square you see the old whaling bay now lined with container, bulk and ro-ro berths. Walvik is the city's most populous district, Viking is still the first language of half of Viking Port's people, and the shop signs, street names and festivals around the square all have a strong northern flavour; the old trading houses sell smoked herring, woollen coats and chandlery. Viking Port gets nearly 1900 mm of rain a year, yet few people on the square carry umbrellas, locals preferring a hooded waterproof, and on rainy days the café windows are always full of people sheltering and watching the harbour. The city's celebrations and gatherings are mostly held here; the white Nordic cross on the territory flag was originally the device of Viking Port's own flag, so the city flag on the square's flagpole draws particular attention. Set in the centre of the flagstones is a huge stone compass, each bearing carved with the names of ports reached by routes sailing from here, and visitors like to have their photo taken standing at its centre.\nAround midsummer, when the ships in Walvik Harbour sound their horns at midnight, the square hosts an all-night open-air concert where bands sing old sea shanties in Viking and the crowd joins in until dawn. The sun barely sets that night and the sky is still light at two in the morning; old harbour hands say it is the one night of the year when \"you sing till dawn without noticing the dawn\"."

  - id: bld_880zp5
    subtype: museum
    status: generated
    names:
      zh: 鲸湾捕鲸站博物馆
      en: Walvik Whaling Station Museum
      art-x-viking: Walfangstation-Museum Walvik
      art-x-buckham: Museo della Stazione Baleniera di Baia Balena
    notes:
      zh: "由旧捕鲸站改建的博物馆，在维京港市瓦尔维克区，展馆约 180 米长、120 米宽，讲述鲸湾从捕鲸站到领地最大港口的历史。维京港是北维京岛最早建成的城市，起源于鲸湾畔的捕鲸站和格约特斯塔德的维京石垒，瓦尔维克在维京语中就是「鲸湾」的意思。博物馆保留着旧捕鲸站的砖砌炼油房、绞盘和捕鲸船，炼油房里还能看到熏黑的砖墙和巨大的铁锅，展厅里陈列着捕鲸叉、航海日志和老船员的照片，讲解员多用维京语和中文讲解。从展馆的窗口望出去，就是如今的鲸湾港，集装箱、散货和滚装码头沿湾岸排开，旧日的捕鲸湾已成为领地大部分进出口货物的门户；维京港市旗上的墨绿，正是鲸湾深处海水的颜色。学校常组织学生来这里上历史课，游客则多是顺路参观中央广场和市政厅的人。馆里挂着一副完整的鲸骨架，从入口一直延伸到大厅尽头，孩子们喜欢在鲸的肋骨下面奔跑。\n展厅最后一间讲的是捕鲸停止之后的鲸湾，墙上贴满了观鲸船拍到的鲸尾照片，每一条鲸都有自己的名字。参观的人可以在留言簿上为新拍到的鲸提名字，馆员每年挑几个最受欢迎的正式登记，老港人说，鲸湾的鲸如今比港里的船还「有名有姓」。"
      en: "A museum in the converted old whaling station in Walvik District of Viking Port City, in a building about 180 m long and 120 m wide, telling how Whale Bay went from a whaling station to the territory's largest port. Viking Port was the first city built on North Viking Island, growing from the whaling station on Whale Bay and the Viking stone fort at Grjotstad, and Walvik itself means \"whale bay\" in Viking. The museum keeps the old station's brick try-works, capstans and whaling boats; in the try-works the soot-blackened brick walls and huge iron cauldrons can still be seen, and the galleries display harpoons, logbooks and photographs of old crews, with guides speaking mostly Viking and Chinese. From the windows you look out on today's Walvik Harbour, its container, bulk and ro-ro berths lining the bay, the old whaling bay now the gateway for most of the territory's imports and exports; the dark green of Viking Port's city flag is the colour of the deep water of Whale Bay. Schools often bring pupils here for history lessons, and many tourists come on from the Central Square and City Hall nearby. A complete whale skeleton hangs from the entrance all the way to the far end of the hall, and children love to run beneath its ribs.\nThe last room is about Whale Bay after whaling ended, its walls covered with photographs of whale flukes taken from whale-watching boats, each whale with a name of its own. Visitors can suggest names for newly photographed whales in the guest book, and each year the staff officially register a few of the most popular; old harbour hands say the bay's whales now have \"proper names\" more than the ships in the port do."
    in: div_z29w6h
    offset_km: [-1.0, -0.9]
    site: { size_m: [180, 120], layout: hall }

  - id: poi_9jstpd
    subtype: stadium
    status: generated
    names:
      zh: 维京港体育场
      en: Viking Port Stadium
      art-x-viking: Stadion Veiling Havn
      art-x-buckham: Stadio di Veiling Porto
    in: div_z29w6h
    offset_km: [3, -2]
    site: { size_m: [320, 240], layout: stadium }
    notes:
      zh: "维京港体育场在维京港市瓦尔维克区，紧挨鲸湾港，是维京港足球俱乐部的主场，也是全领地最大的球场。瓦尔维克是维京港人口最多的区和领地最大的港区，体育场四周是码头、仓库和老港工住宅，比赛日球迷可以坐维京港地铁 1 号线到鲸湾港站，再沿着港边走几分钟到球场。看台的顶棚只盖住一半，本地球迷说这是故意的：「维京港的球赛，就该淋着雨看。」维京港一年降水将近一千九百毫米，球迷们早就习惯了，看台上很少有人打伞，大家都穿一件连帽防水外套，进球时帽子被甩掉一片。\n比赛前球迷用维京语齐唱一首古老的划桨歌，节拍和长船划桨的号子一样，几万人跟着节拍跺脚，客队球员常被唱得发怵。维京港和贝克勒之间的比赛是全岛最受关注的对决，比赛日的维贝真空磁悬浮列车上挤满了穿着两队球衣的球迷，车厢里一半唱维京语的划桨歌，一半用巴克汉姆语和英语回敬，下车时却总有人互相交换围巾。球场外的小摊卖热鱼丸汤和熏鲱鱼三明治，中场休息时买汤的队伍常常比去洗手间的还长。港口的夜班工人看不了现场，就在码头的休息室里守着收音机，进球的时候，鲸湾港里总有几条船跟着鸣一声笛。"
      en: "Viking Port Stadium, in Walvik District of Viking Port right beside Walvik Harbour, is the home ground of Viking Port Football Club and the largest stadium in the territory. Walvik is the most populous district of Viking Port and the territory's biggest port area, and the stadium is surrounded by quays, warehouses and old dockers' housing; on match days fans can take Viking Port Metro Line 1 to Walvik Harbour station and walk a few minutes along the waterfront to the ground. The roof covers only half of the stands, and local fans say that is deliberate: \"Viking Port football is meant to be watched in the rain.\" With close to 1,900 mm of rain a year, the fans are long used to it; hardly anyone in the stands opens an umbrella, everyone wears a hooded waterproof jacket instead, and when a goal goes in, hoods fly off all along the terraces.\nBefore kick-off the fans sing an ancient rowing song in Viking, in the same rhythm as the oar calls of the longships, tens of thousands stamping in time, and visiting players often find it unnerving. Viking Port against Beckerle is the most closely watched fixture on the island, and on match days the Viking Port–Beckerle Vacuum Maglev trains are packed with fans in both teams' shirts, half the carriage singing the Viking rowing song and the other half answering back in Buckham and English, though there are always some who swap scarves as they get off. Stalls outside the ground sell hot fish-ball soup and smoked herring sandwiches, and at half-time the queue for soup is often longer than the one for the toilets. Night-shift workers at the port cannot be at the ground, so they gather round the radio in the quayside rest rooms, and when a goal goes in, a few ships in Walvik Harbour always sound their horns along with the cheering."

  - id: bld_9rfesr
