  - id: bld_bj9ny3
    subtype: townhall
    status: generated
    names:
      zh: 天城市人民政府
      en: Skytown City Government
      art-x-viking: Stadtregierung Himmelstad
      art-x-buckham: Governo Cittadino di Cielo
    notes:
      zh: "天台区阶地上的市政府。市政府每年的预算里有一项「雨伞费」，用来补上被游客带回家当纪念品的公共雨伞，市长曾说这是「天城最划算的广告」。"
      en: "The city government on the terraces of Sky Terrace District. The city budget has an \"umbrella line\" every year to replace the public umbrellas visitors take home as souvenirs, which a mayor once called \"Skytown's best-value advertising\"."
