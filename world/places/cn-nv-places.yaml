      en: Starport Space Museum
      art-x-viking: Raumfahrtmuseum Sternhafen
      art-x-buckham: Museo dello Spazio di Porto Stella
    notes:
      zh: "展出退役火箭、返回舱与星港历次发射的博物馆，对公众开放。馆里最受欢迎的展品是一具烧得焦黑的返回舱，孩子们可以爬进复制的舱体里，从小小的舷窗往外看。每次有飞船回到降落场，博物馆门口的电子屏都会亮出一行字：「有人回家了」。"
      en: "Retired rockets, return capsules and the record of every Starport launch, open to the public. The most popular exhibit is a scorched re-entry capsule, and children can climb into a replica and peer out through the tiny window. Whenever a spacecraft returns to the landing site, the screen at the museum entrance lights up with the words \"someone is home\"."
