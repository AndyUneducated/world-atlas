  - id: poi_em72p8
    subtype: laser_station
    status: generated
    names:
      zh: 霍尔沃思峰激光站
      en: Mount Hallworth Laser Station
      art-x-viking: Laserstation Hallworthspitze
      art-x-buckham: Stazione Laser di Picco Hallworth
    notes:
      zh: 霍尔沃思峰激光站位于蒂鲁尤阿克峰西北的霍尔沃思峰峰顶，海拔四千二百多米，是深空太空军的地基激光试验站。高山上大气稀薄，激光穿过大气时的衰减和抖动都比平地小得多；站内的自适应光学系统还会实时测量大气扰动，用可变形的镜面加以抵消，把光束精确地聚焦到轨道上的目标。激光站的主要任务是与卫星进行激光通信和能量传输试验，也可以用激光轻推小块太空碎片，使其降低轨道、坠入大气层烧毁。每次试验前都要通报航空管理部门，确保光束经过的空域没有飞机。峰顶三面冰斗环抱，站房与蒂鲁尤阿克峰光学观测站同样采用保温密封设计。
      en: Mount Hallworth Laser Station stands on the summit of Mount Hallworth, north-west of Mount Tirrujuaq, at more than 4,200 m, and is the Deep Space Force's ground-based laser test station. At this height the air is thin, so a laser beam is far less weakened and blurred than at ground level, and the station's adaptive optics measure the turbulence that remains in real time and cancel it with deformable mirrors, focusing the beam precisely on targets in orbit. Its main work is laser communication and power-beaming trials with satellites, and it can also nudge small pieces of space debris with its laser so that they drop into the atmosphere and burn up. Before every trial the aviation authority is notified to make sure no aircraft is in the beam's path. Cirques surround the summit on three sides, and like the Starwatch station its buildings are insulated and sealed.
    in: div_q5h8zp
    offset_km: [-2.12, 24.75]
    site: { size_m: [500, 400], layout: radar, variant: domes, angle_deg: 0 }
