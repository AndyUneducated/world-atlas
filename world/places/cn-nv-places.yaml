  - id: bld_6kad04
    subtype: museum
    status: generated
    names:
      zh: 卡蒂尔尤阿克驿站博物馆
      en: Katirjuaq Post House Museum
      art-x-viking: Museum Posthaus Katirjuaq
      art-x-buckham: Museo della Stazione di Posta di Katirjuaq
    notes:
      zh: "由翻越卡蒂尔尤阿克的老驿站改建的博物馆，在洛龙山市卡蒂尔尤阿克区，展出驮队、雪橇与早年的山路。卡蒂尔尤阿克山口在集镇西南，自古就是翻越洛龙山脉中北段的要道，旧时的驿站、马厩和关卡至今保存在博物馆里，展馆约 160 米长、100 米宽，讲述着商队和邮差冒雪翻山的故事：墙上挂着当年的路线图和邮包，院子里停着包铁的木雪橇，展柜里是驮夫的皮靴、防雪镜和记账用的木牌。如今这处山口是本岛中部最重要的公路枢纽，卡蒂尔尤阿克高速、伊卡苏瓦高速和纳帕图克公路在集镇所在的谷地交会，过境的司机和穿越洛龙山的旅客常在这里停下来休整，顺路进馆看看先人怎样走同一条路。冬季集镇两侧的雪道人满为患，滑雪的游客也爱在雪天进来暖暖身子；当地学校则把博物馆当作乡土课的课堂。驿站的马厩里还挂着当年驮队用的铜铃，冬天的旅人听见铃声就知道山口有人在走。\n博物馆每年冬至会点起老驿站的炉子，请参观的人喝一碗松针茶，听老人讲雪夜翻山的故事。讲故事的老人里有几位年轻时当过山口的护路工，讲到兴头上，会学着卡蒂尔尤阿克广播站播报员的腔调，把山口和隧道的名字一个个念出来，满屋子的人跟着笑。"
      en: "A museum in a converted post house on the old route over Katirjuaq, in Katirjuaq District of Lorond Mountain City, showing pack trains, sledges and the mountain roads of earlier times. The Katirjuaq pass, south-west of the town, has been the main way across the central and northern Lorond Range since early times, and the old post house, stables and toll post survive in the museum, a building about 160 m long and 100 m wide. It tells the story of caravans and postmen struggling over the pass in the snow: route maps and mailbags hang on the walls, iron-shod wooden sledges stand in the yard, and the cases hold packmen's leather boots, snow goggles and the wooden tallies they kept accounts on. Today the pass is the most important road junction in the centre of the island, where the Katirjuaq Expressway, the Ikkasuvva Expressway and the Napatuuq Highway meet in the town's valley, and passing drivers and travellers crossing the Lorond mountains often stop here to rest and drop into the museum to see how their forebears travelled the same road. In winter the ski runs either side of the town are packed and skiers like to come in to warm up on snowy days; local schools use the museum as a classroom for lessons on their home district. The copper bells once worn by the pack animals still hang in the stables; in winter, travellers who heard them knew someone was on the pass.\nEvery winter solstice the museum lights the old post house stove and gives visitors a bowl of pine-needle tea while the old folk tell stories of crossing the mountains on snowy nights. A few of the storytellers worked as road keepers on the pass in their youth, and when they warm to their tale they mimic the Katirjuaq radio announcer, reading out the names of the passes and tunnels one by one, and the whole room laughs along."
    in: div_j82dgm
    offset_km: [-0.6, 0.5]
    site: { layout: hall, size_m: [160, 100] }
  - id: poi_reffw3
    subtype: research_institute
    status: generated
    names:
      zh: 纳帕图克林业研究所
      en: Napatuuq Forestry Institute
      art-x-viking: Forstinstitut Napatuuq
      art-x-buckham: Istituto Forestale di Napatuuq
    notes:
      zh: "研究云杉林培育、防火与护林的研究所，兼管纳帕图克的护林站。护林员每年采伐季开工前，先在最老的一棵冷杉下放一块面包，算是向山林打个招呼。研究所的苗圃每年培育几十万株云杉苗，其中一批会在勒克尔丰收节上作为洛龙山的礼物送出去。"
      en: "Studies spruce forestry, fire prevention and forest care, and runs the Napatuuq ranger stations. Before each felling season the foresters leave a piece of bread under the oldest fir, a way of greeting the forest. The institute's nursery raises hundreds of thousands of spruce seedlings a year, and a batch of them goes to the Lekor Harvest Festival as Lorond Mountain's gift."
    in: div_k5f1mz
    offset_km: [0.6, 0.4]
    site: { layout: campus, size_m: [400, 300] }
