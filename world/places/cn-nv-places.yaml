      en: "The territory's largest exhibition halls, on Millennium Avenue. Most of the island's big trade fairs, job fairs and motor shows are held here, and the busiest is the New Home Fair each spring, when young families who have just moved to New City shop for furniture and compare mortgages, and prams fill the forecourt."
