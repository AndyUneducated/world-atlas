  - id: poi_4mbfqk
    subtype: air_base
    status: generated
    names:
      zh: 星港无人机基地
      en: Starport Drone Base
      art-x-viking: Drohnenbasis Sternhafen
      art-x-buckham: Base Droni di Porto Stella
    notes:
      zh: 星港无人机基地位于星港区西北的台地上，是马斯林山唯一的无人机基地。高空长航时无人机从这里起飞后，可以连续一两天在北部海域和马斯林山脉上空巡航，把图像实时传回指挥中心，弥补地面雷达在深谷和山背后的盲区。基地只有一条较短的跑道，跑道旁成排的小型机库各停放一架无人机；操作员并不登机，而是在地下控制室里轮班操纵，一个机组可以同时照看多架飞机。无人机对结冰十分敏感，基地配有专门的除冰坪和气象站，遇到冻雾天气会暂停起飞。这里也是空军试飞新型无人机和自主飞行软件的场所。
      en: Starport Drone Base sits on a terrace in the north-west of Starport District and is Maslin Mountain's only drone base. High-altitude long-endurance drones take off here and can cruise for a day or two over the northern seas and the Maslin Range, sending pictures back to the command centre in real time and covering the deep valleys and back slopes that ground radars cannot see. The base has a single short runway lined with small hangars, one aircraft to each. The operators never board; they fly the drones in shifts from an underground control room, each crew minding several aircraft at once. Drones are very sensitive to icing, so the base has its own de-icing pad and weather station and stops flying in freezing fog. It is also where the air force flight-tests new drones and autonomous flight software.
    in: div_nytsvb
    offset_km: [-9.19, 16.26]
    site: { size_m: [2600, 1000], layout: airbase, variant: uav, angle_deg: 15 }
