      en: Peace Heliport
      art-x-viking: Hubschrauberplatz Frieden
      art-x-buckham: Eliporto di Pace
    notes:
      zh: 和平直升机场位于和平区北部，是陆军航空兵在马斯林山的基地。两排直升机停机坪整齐排列，后面是机库、维修车间和塔台。运输直升机承担部队在山区的快速机动和物资补给，可以把人员和装备直接送到高山上的站点；武装直升机则与雪谷的装甲部队协同训练。机场常备救援直升机，负责返回舱的搜索和回收，以及山区演训和民间登山事故的紧急救援。冬季山区风雪大，直升机只能在严格的气象条件下飞行，机库内配有暖气和除冰设备。飞行员还要定期在群峰的高海拔起降场练习山地起降，适应稀薄空气中的操纵。
      en: Peace Heliport, in the north of Peace District, is the army aviation base at Maslin Mountain. Two rows of helipads stand in neat lines in front of the hangars, workshops and tower. Transport helicopters move troops and supplies quickly around the mountains and can set people and equipment down at stations high in the peaks, while attack helicopters train alongside the armoured units in Snow Valley. Rescue helicopters are kept on standby to search for and recover return capsules and to answer emergencies on exercises and civilian climbing accidents. Winter brings strong winds and snow to the mountains, so flying is allowed only within strict weather limits, and the hangars are heated and fitted for de-icing. Pilots also practise mountain landings regularly at high landing sites in the High Peaks to learn to fly in thin air.
