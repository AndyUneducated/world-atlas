        en: 3 large refurbishment hangars and a heat-shield inspection line
      personnel: 2400
      access: { zh: 不对外开放, en: Closed to the public }
  - id: poi_qjektd
    subtype: test_site
    status: generated
    names:
      zh: 西坪风洞群
      en: West Heath Wind Tunnels
      art-x-viking: Windkanäle Westheide
      art-x-buckham: Gallerie del Vento di Pianoro Ovest
    notes:
      zh: 西坪风洞群位于西坪区西部的高原上，是研究高超声速飞行的试验基地。长长的风洞管道横卧在厂区里，一端是巨大的高压储气罐和真空球罐；试验时高压气体冲过喷管，在几毫秒到几秒内加速到声速的十几倍，吹过固定在试验段里的模型，传感器和高速摄像机记录下模型表面的压力、温度和激波形态。空天飞机、返回舱和电磁发射滑车的气动外形都在这里反复试验。电弧加热风洞能产生数千摄氏度的高温气流，用来考验隔热材料能否承受返回大气层时的灼烧。风洞运行时耗电极大，试验通常安排在夜间用电低谷进行。
      en: The West Heath Wind Tunnels, on the plateau in the west of West Heath District, are a test centre for hypersonic flight. Long tunnel tubes lie across the site with huge high-pressure tanks and vacuum spheres at their ends. In a run, high-pressure gas bursts through a nozzle and reaches more than ten times the speed of sound within milliseconds to seconds, flowing over a model held in the test section while sensors and high-speed cameras record the pressure, heat and shock waves on its surface. The shapes of the spaceplanes, the return capsules and the electromagnetic launch sleds have all been tested here over and over. An arc-heated tunnel makes gas thousands of degrees hot to see whether heat-shield materials can survive the fire of re-entry. The tunnels draw enormous power, so runs are usually scheduled at night when demand on the grid is low.
    in: div_nwke3f
    offset_km: [-16.97, 1.41]
    site: { size_m: [2200, 1000], layout: plant, variant: tunnel, angle_deg: 60 }
    military:
