      en: "The market held when the herders come down in autumn, trading reindeer meat, hides and handicrafts. In the market days herders bring their reindeer down from the uplands and trade from tents pitched on the spot, singing Tavrunaq herding songs round the fire at night. The most sought-after goods are hand-sewn reindeer-skin mittens and boots, and the old craftsmen say a good pair of mittens \"will see you through thirty winters\"."
