      en: Oxhorn Bay Seaside Park
      art-x-viking: Strandpark Ochsenhornbucht
      art-x-buckham: Parco al Mare di Baia Corno di Bue
    notes:
      zh: "牛角湾岸边的草地与沙滩，夏季是塔夫鲁普库维克人消暑的去处。夏天退潮时，孩子们在沙滩上用旧拖拉机轮胎垒城堡，比谁的城堡撑得过下一次涨潮。海湾的形状像一只牛角，从公园的观景台上看最清楚，公园名也由此而来。"
      en: "Lawns and a beach on Oxhorn Bay, where Tavrupukkuvik goes to cool off in summer. At low tide in summer children build castles on the sand from old tractor tyres and see whose will survive the next high tide. The bay is shaped like an ox horn, best seen from the park's lookout, which is how it got its name."
    in: div_rzw76f
    offset_km: [0.6, -1.6]
    site: { layout: park, size_m: [800, 350] }
  - id: poi_3s7f2z
    subtype: plaza
