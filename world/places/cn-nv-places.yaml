  - id: bld_142py9
    subtype: marketplace
    status: generated
    names:
      zh: 萨科鱼市
      en: Sako Fish Market
      art-x-viking: Fischmarkt Sako
      art-x-buckham: Mercato del Pesce di Sako
    notes:
      zh: "老镇的鱼市，每天清晨拍卖萨科湾渔港的渔获。鱼市旁的小馆子里，最受欢迎的是用番茄、橄榄油和当天渔获炖成的鱼汤，配一块烤得焦脆的面包。拍卖结束后剩下的小杂鱼会被装进一只大锅，熬成当天的「拍卖汤」，免费分给收摊的渔民。"
      en: "The old town's fish market, auctioning the catch of the Sako Bay harbour every dawn. In the little restaurants beside it the favourite is a stew of tomatoes, olive oil and the day's catch with a slice of crisp toast. After the auction the leftover small fish go into one big pot for that day's \"auction soup\", given free to the fishermen as they pack up."
    in: div_8m0jx4
    offset_km: [-0.9, -0.7]
    site: { layout: market, size_m: [220, 120] }
  - id: poi_6wrkc6
    subtype: industrial_park
    status: generated
    names:
      zh: 铁岗先进制造产业园
      en: Iron Knoll Advanced Manufacturing Park
      art-x-viking: Industriepark Eisenhügel
      art-x-buckham: Parco Industriale di Colle Ferro
    notes:
      zh: "建市后布局的制造业园区，以机械、汽车零部件与电子装配为主，萨科勒「新工业区」的主体。园区的工厂沿用老铁岗的规矩，每天中午十二点拉响汽笛，萨科渔港的渔民仍把它当作收网回港的信号。工厂食堂以分量大出名，一份炖豆子配香肠够一个壮汉撑过整个下午。"
      en: "Manufacturing parks laid out after the city was founded, mainly machinery, car parts and electronics assembly; the core of Sakole's new industrial zone. Its factories keep the old Iron Knoll custom of sounding a whistle at noon each day, still the fishermen's signal at Sako Fishing Harbour to haul in and head home. The factory canteens are known for their portions: a plate of stewed beans and sausage will see a strong worker through the afternoon."
    in: div_6byxb5
    offset_km: [2.2, -1.0]
    site: { layout: complex, size_m: [1200, 700] }
  - id: bld_j9z0s3
    subtype: museum
    status: generated
    names:
      zh: 铁岗矿业博物馆
      en: Iron Knoll Mining Museum
      art-x-viking: Bergbaumuseum Eisenhügel
      art-x-buckham: Museo Minerario di Colle Ferro
    notes:
      zh: "由铁岗山旧铁矿的选矿厂改建，展出矿车、竖井模型与矿工生活。馆里保留着城里最早的那座炼铁炉，萨科勒人说一切都是从这座炉子开始的。参观者可以戴上矿工头灯走进一段复原的巷道，出口处有一面墙，写满了老矿工和他们家人的名字。"
      en: "The former ore-dressing plant of the old Iron Knoll mine, with mine carts, shaft models and the story of the miners. It keeps the town's very first furnace, where Sakole people say everything began. Visitors can put on a miner's lamp and walk a reconstructed gallery, coming out by a wall covered with the names of old miners and their families."
    in: div_6byxb5
    offset_km: [-1.2, 0.8]
    site: { layout: hall, size_m: [180, 120] }
  - id: poi_ymmy11
    subtype: college
    status: generated
    names:
      zh: 萨科勒职业技术学院
      en: Sakole Polytechnic
      art-x-viking: Technische Hochschule Sakole
      art-x-buckham: Politecnico di Sakole
    notes:
      zh: "为铁岗产业园培养技工与工程师的学院。学生一半时间在课堂、一半时间在铁岗产业园的车间里，课程用中文和巴克汉姆语双语讲授。每年毕业季，学生们用自己做的零件拼出一台小机器人，在萨科老镇广场上表演。"
      en: "Trains technicians and engineers for the Iron Knoll manufacturing parks. Students spend half their time in class and half in the workshops of the Iron Knoll park, with courses taught in both Chinese and Buckham. Each graduation season they assemble a small robot from parts they made themselves and show it off in Sako Old Town Square."
    in: div_6byxb5
    offset_km: [0.6, 1.6]
    site: { layout: campus, size_m: [600, 400] }
  - id: poi_3mxxkj
    subtype: logistics_park
    status: generated
    names:
      zh: 罗卡公路货运站
      en: Rocca Road Freight Terminal
      art-x-viking: Straßengüterterminal Felsburg
      art-x-buckham: Terminal Merci di Rocca
    notes:
      zh: "南岸公路旁的公路货运枢纽与仓储区，集散萨科勒工厂的零部件与成品。货车司机在这里换班歇脚，货运站的食堂以炖豆子配香肠和浓咖啡出名，一份能撑过从萨科勒到维京港的整段路程。"
      en: "Road freight hub and warehouses on the South Coast Highway, handling parts and products for Sakole's factories. Lorry drivers change over and rest here, and the terminal canteen is known for stewed beans with sausage and strong coffee, a plate of which will last you all the way from Sakole to Viking Port."
