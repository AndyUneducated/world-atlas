      art-x-viking: Felsburgpark
      art-x-buckham: Parco della Rocca
    notes:
      zh: "环绕海边岩丘的公园，罗卡区（巴克汉姆语「岩堡」）以这座岩丘得名。岩丘顶上有一座小瞭望台，从这里能看到整个萨科湾和铁岗区的烟囱。傍晚退休的老工人爱在山脚的草坪上玩巴克汉姆式的滚木球，输的人请喝咖啡。"
      en: "A park around the seaside rock outcrop that gave Rocca District (Buckham for \"rock fort\") its name. A small lookout on top of the knoll takes in the whole of Sako Bay and the chimneys of Iron Knoll. In the evening retired workers play the Buckham game of rolling wooden balls on the lawn at its foot, the loser buying the coffee."
    in: div_8njcs3
