    status: generated
    names:
      zh: 星港发动机试车台
      en: Starport Engine Test Stands
      art-x-viking: Triebwerksprüfstände Sternhafen
      art-x-buckham: Banchi Prova Motori di Porto Stella
    notes:
      zh: 星港发动机试车台建在星港区南部群峰脚下的一处山谷里，三座高大的钢架试车台背靠山坡，发动机固定在架子上点火，火焰冲进下方的导流槽，被大量喷水冷却后沿山谷排出。每台新发动机在装上火箭之前都要在这里点火，长时间满功率运转，确认推力、温度和振动都在规定范围内。试车时轰鸣声在山谷中回荡，数公里外都能感到地面震动，所以试车台选在远离城镇的山谷，控制室建在安全距离以外的掩体里。试车所用的液氢液氧由西坪推进剂厂用槽车运来，储存在试车台旁的储罐中。
      en: The Starport Engine Test Stands are in a valley at the foot of the High Peaks in the south of Starport District. Three tall steel stands back onto the hillside, each holding an engine that fires down into a flame trench, where the exhaust is cooled by floods of water and carried away down the valley. Every new engine is fired here before it goes on a rocket, running at full power for a long time to confirm that its thrust, temperatures and vibration stay within limits. A firing roars around the valley and shakes the ground kilometres away, which is why the stands are in a valley far from any town and the control room is in a bunker at a safe distance. The liquid hydrogen and oxygen they burn come by tanker from the West Heath Propellant Plant and are stored in tanks beside the stands.
    in: div_nytsvb
    offset_km: [-2.83, -16.97]
    site: { size_m: [1600, 1000], layout: test_stand, angle_deg: 180 }
    military:
