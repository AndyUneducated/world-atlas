      zh: 群峰寒区训练场
      en: High Peaks Cold-Weather Training Ground
      art-x-viking: Kälteübungsplatz Gipfel
      art-x-buckham: Campo Addestramento Invernale delle Vette
    notes:
      zh: 群峰寒区训练场位于群峰训练管理区西部海拔一千七百米左右的高山上，冬季积雪可达数米深，是陆军进行寒区作战训练的场所。士兵在这里学习滑雪机动，在雪地中构筑工事，在零下数十度的严寒中生存和战斗；营地里的小木屋供训练间隙取暖休整。训练场也为航天员和空军飞行员提供冬季野外生存训练，模拟返回舱或飞机在雪原上迫降后的自救。夏季积雪融化后，这里改为高原适应和山地攀登训练。训练场经西岭公路与西坪相连，冬季公路由驻训部队负责除雪。
      en: The High Peaks Cold-Weather Training Ground lies about 1,700 m up in the west of the High Peaks Training Area, where winter snow can be several metres deep, and is where the army trains for cold-weather warfare. Soldiers learn to move on skis, dig defences in the snow, and survive and fight at tens of degrees below zero, warming up between sessions in the camp's log huts. Astronauts and air force pilots come here for winter survival training too, rehearsing what to do after a capsule or aircraft comes down on a snowfield. When the snow melts in summer the ground is used for altitude acclimatisation and mountaineering. The West Ridge Highway links it to West Heath, and in winter the troops in training keep the road clear themselves.
    in: div_q5h8zp
    offset_km: [-28.99, 5.66]
