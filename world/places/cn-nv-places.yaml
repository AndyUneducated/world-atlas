      art-x-buckham: Guarnigione di Valle Neve
    notes:
      zh: 雪谷营区是解放军马斯林山联合训练基地的本部，也是马斯林山最大的陆军营区。营区内一排排营房围绕着中央的阅兵场，四周是车场、仓库、室内训练馆和模拟训练中心。来自各地的部队轮流到这里驻训数月，在雪谷装甲训练场、群峰寒区训练场和群峰空军靶场与空军、深空太空军进行联合演练。马斯林山冬季漫长、地形复杂，从平原、高原到冰川应有尽有，部队可以在一次演习中经历多种环境。基地还负责发射中心外围的地面警戒和航天器落区的搜救保障：返回舱一旦偏离预定落点，营区的越野车队会同和平直升机场的陆航部队第一时间出动。官兵家属大多住在雪谷城区，营区的商店、学校和体育馆也向当地居民开放。
      en: Snow Valley Garrison is the headquarters of the PLA Maslin Mountain Joint Training Base and the largest army garrison at Maslin Mountain. Rows of barracks surround a central parade ground, with motor pools, stores, indoor training halls and a simulation centre around them. Units from across the territory rotate through for months at a time, exercising with the Air Force and the Deep Space Force at the Snow Valley armour range, the High Peaks cold-weather ground and the High Peaks air weapons range. Maslin Mountain has long winters and every kind of ground from plain and plateau to glacier, so a single exercise can take troops through many environments. The base also guards the outer perimeter of the launch centre and supports search and rescue in the landing zones, and if a return capsule comes down off target its cross-country convoys set out at once with the army aviation crews from Peace Heliport. Most service families live in the town of Snow Valley, and the garrison's shops, school and sports hall are open to local people too.
    in: div_0tsyzy
    offset_km: [6.41, -7.05]
