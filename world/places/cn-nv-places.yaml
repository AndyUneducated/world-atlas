      en: Silver Beach Grand Hotel
      art-x-viking: Grandhotel Silberstrand
      art-x-buckham: Grand Hotel Spiaggia Argento
    notes:
      zh: "海滩边的高层度假酒店，银滩酒店群中最早的一座。海滨露台上卖得最好的是柳萨湾贻贝配薯条和冰镇苹果酒。酒店大堂里摆着几十把刻着「天城」的公共雨伞，客人退房时偷偷带走一把，前台从来不说什么。"
      en: "A high-rise resort hotel on the sand, the first of the Silver Beach hotels. The best seller on its seaside terrace is Ljosa Bay mussels with chips and chilled cider. Dozens of public umbrellas carved with \"Skytown\" stand in the lobby, and when guests quietly take one away at checkout, reception never says a word."
    in: div_f5s7ax
    offset_km: [0.4, -0.4]
    site: { layout: tower, size_m: [160, 120] }
  - id: poi_detmcs
    subtype: park
    status: generated
