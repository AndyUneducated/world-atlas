  - id: poi_s0e4tf
    subtype: launch_track
    status: generated
    names:
      zh: 群峰电磁发射场
      en: High Peaks Electromagnetic Launcher
      art-x-viking: Elektromagnetische Startbahn Gipfel
      art-x-buckham: Lanciatore Elettromagnetico delle Vette
    wonder:
      zh: 世界唯一的电磁发射导轨，长约 30 公里，把火箭推到数倍声速
      en: The only electromagnetic launch rail in the world, about 30 km long, sending rockets off at several times the speed of sound
    notes:
      zh: "群峰电磁发射场是世界上唯一的电磁发射导轨，也是马斯林山最引人注目的未来设施：全长约 30 公里，其中电磁导轨约 29 公里，从群峰训练管理区南缘的山麓起步，沿着山坡一路向北爬升，出口海拔将近 2000 米，场区宽约 1.5 公里，占地约 45 平方公里。发射场由深空太空军电磁发射试验中心管理，约有 1300 人，设有储能电站和装载站各一座，是军事禁区，不对外开放。\n导轨的原理与磁悬浮列车相似，载着小型运载火箭或货运舱的滑车在强大磁场的推动下悬浮加速，离开导轨时速度已达声速的数倍，再由火箭发动机接力送入轨道。火箭因此可以省下大量推进剂，向轨道运送补给和小卫星的成本大大降低。导轨起点设有装载站和储能电站，发射前储能装置用数小时蓄满电能，再在几十秒内一次释放；沿线每隔一段设有维护站。出口建在高处，是为了让滑车离开导轨时周围空气已较为稀薄，减少阻力和发热；出口一带的山脊冬天风大雪多，导轨端头罩着可以开合的防护罩，发射前才打开。群峰训练管理区由领地与驻军共管，常住只有约五千五百人，发射场是区里仅次于指挥城的大单位。\n修建导轨最难的是让 29 公里长的轨道在山坡上保持笔直平顺：轨道下是连续的混凝土基座，穿过冻土和碎石坡的地段打了深桩，冬天导轨两侧的融雪装置要保证轨面不结冰。滑车加速时导轨承受巨大的力，每次发射后，维护站的工人都要沿线检查一遍，确认没有变形才能安排下一次。电磁发射与西坪区的维京-马斯林山发射与降落中心分工：大型火箭从西坪升空，小卫星和补给舱交给电磁导轨，一年可以发射很多次。滑车本身可以回收，发射后沿导轨旁的回车轨道慢慢滑回起点，检修后下一次再用；装载站的货运舱和小火箭则经公路从西坪的工厂运来。\n发射时滑车划过山坡的呼啸声，远在雪谷都能听到。雪谷的居民说，先看到山坡上一道亮光从下往上划过，几秒钟后才听见那声长长的呼啸，像有人在山上拉开了一条巨大的拉链，他们就管电磁发射场叫「山上的拉链」。孩子们比赛谁能在亮光出现时最先喊出来，大人则掐着表算声音晚到了几秒，用来估算自家离导轨有多远。试验中心的官兵和工程师多住在导轨起点附近的营区，冬天下班后沿着导轨旁的检修路散步，他们说这是「全世界最贵的散步道」。"
      en: "The High Peaks Electromagnetic Launcher is the only electromagnetic launch rail in the world and the most remarkable of Maslin Mountain's new facilities. It is about 30 km long, about 29 km of it electromagnetic guideway, starting in the foothills on the southern edge of the High Peaks Training Area and climbing north up the mountainside to an exit nearly 2,000 m high; the site is about 1.5 km wide and covers some 45 km². It is run by the Deep Space Force's Electromagnetic Launch Test Centre, with about 1,300 staff, an energy storage power station and a loading terminal, and is a restricted military area closed to the public.\nIt works much like a maglev train. A sled carrying a small launch vehicle or cargo pod floats on a powerful magnetic field and is driven faster and faster until it leaves the guideway at several times the speed of sound, when a rocket engine takes over and carries it into orbit. The rocket needs far less propellant this way, which makes sending supplies and small satellites to orbit much cheaper. At the foot of the guideway are the loading terminal and the energy storage power station, which charges for hours before a launch and releases it all within tens of seconds, and maintenance stations stand at intervals along the line. The exit is high up so that the sled leaves the guideway in thinner air, with less drag and heating; the ridge around the exit is windy and snowy in winter, so the end of the guideway is covered by a hood that opens only before a launch. The High Peaks Training Area is run jointly by the territory and the garrison and has only about 5,500 residents, and the launcher is its largest establishment after the command complex.\nThe hardest part of building it was keeping 29 km of track straight and smooth on a mountainside: the guideway sits on a continuous concrete bed, deep piles were driven where it crosses permafrost and scree, and in winter snow-melting equipment on both sides keeps the rail surface free of ice. The guideway takes enormous forces as a sled accelerates, so after every launch the maintenance crews inspect the whole line, and the next launch is scheduled only once they have confirmed there is no distortion. The launcher shares the work with the Viking–Maslin Mountain Launch and Landing Centre in West Heath District: big rockets go up from West Heath, while small satellites and supply pods go by guideway, which can launch many times a year. The sleds themselves are recovered, gliding slowly back to the start along a return track beside the guideway to be overhauled and used again, while the cargo pods and small rockets for the loading terminal come by road from the West Heath plants.\nWhen a sled flies, its roar up the mountainside can be heard as far away as Snow Valley. Snow Valley people say that first a streak of light runs up the slope, and only a few seconds later comes the long roar, as if someone had pulled open a giant zip on the mountain, so they call the launcher \"the zip on the mountain\". Children compete to be first to shout when the light appears, while the grown-ups time how many seconds late the sound arrives to work out how far their homes are from the guideway. The test centre's soldiers and engineers mostly live in barracks near the foot of the guideway, and on winter evenings after work they walk along the maintenance track beside it, which they call \"the most expensive footpath in the world\"."
    in: div_q5h8zp
    offset_km: [-7.07, -13.99]
    site: { size_m: [30000, 1500], layout: launch_track, angle_deg: 90 }
    military:
      unit: { zh: 深空太空军电磁发射试验中心, en: "Electromagnetic Launch Test Centre, Deep Space Force" }
      branch: { zh: 深空太空军, en: Deep Space Force }
      equipment:
        zh: 电磁导轨约 29 公里、储能电站 1 座、装载站 1 座
        en: About 29 km of electromagnetic guideway, an energy storage power station and a loading terminal
      personnel: 1300
      access: { zh: 军事禁区，不对外开放, en: "Restricted military area, closed to the public" }
