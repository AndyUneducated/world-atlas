      equipment:
        zh: 初级教练机 40 架、高级教练机 24 架、飞行模拟器 18 台
        en: 40 basic and 24 advanced trainers, 18 flight simulators
      personnel: 2600
      access:
        zh: 每年招生开放日对考生和家长开放
        en: Open to applicants and their families on the annual admissions day
  - id: poi_davyy1
    subtype: factory
    status: generated
    names:
      zh: 东营航空修理厂
      en: East Camp Aircraft Repair Plant
      art-x-viking: Flugzeugwerft Ostlager
      art-x-buckham: Officina Aeronautica di Campo Est
    notes:
      zh: 东营航空修理厂紧邻东营空军基地，负责马斯林山各空军基地飞机和发动机的大修。战斗机和运输机每飞满规定的小时数，就要拖进这里的大修机库，拆开检查机体结构，更换老化的线缆和部件；发动机则送到厂区一侧的试车间，修好后在消音试车间里连续运转数小时，确认推力和振动都合格才交还部队。修理厂也为空天飞机检修喷气发动机和起落架。厂区有一条铁路专用线，大型部件可以用火车运进运出。工厂的许多技师是在东营本地招收和培养的，修理厂也是东营区最大的雇主之一。
      en: The East Camp Aircraft Repair Plant stands next to East Camp Air Base and overhauls the aircraft and engines of every air base at Maslin Mountain. Each time a fighter or transport reaches its set number of flying hours it is towed into one of the overhaul hangars, opened up to check the airframe, and given new wiring and parts where they have aged. Engines go to the test cells on one side of the plant, and after repair each runs for hours in a silenced cell until its thrust and vibration pass. The plant also overhauls the spaceplanes' jet engines and landing gear. A rail siding lets large parts come and go by train. Many of its technicians were recruited and trained locally, and it is one of East Camp's largest employers.
    in: div_tc0ngk
    offset_km: [7.44, 21.98]
    site: { size_m: [1600, 900], layout: plant, variant: engine, angle_deg: 105 }
