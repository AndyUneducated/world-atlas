      en: Napatuuq Forest Park
      art-x-viking: Waldpark Napatuuq
      art-x-buckham: Parco Forestale di Napatuuq
    notes:
      zh: "纳帕图克山坡上的云杉原始林，林间步道通往纳帕图克冰川。林子里最老的云杉要好几个人才能合抱，树下铺着厚厚的苔藓，走在上面听不见脚步声。步道尽头能远远望见纳帕图克冰川，夏天冰川融水汇成的小溪清得能看见水底的石子。"
      en: "Old-growth spruce on the slopes of Napatuuq, with trails up towards the Napatuuq Glacier. The oldest spruces take several people to encircle, and the moss beneath them is so thick you cannot hear your own footsteps. At the end of the trail the Napatuuq Glacier comes into view, and in summer its meltwater streams are clear enough to see every pebble on the bed."
    in: div_k5f1mz
