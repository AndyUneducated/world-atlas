      en: "The city government and offices at the heart of the new Central Gardens centre. Like the rest of New City it is built with white walls, a timber ceiling and tall windows, and the public service hall on the ground floor has a corner for young parents who bring their children along, with play mats and changing tables: standard equipment in \"Pram City\"."
