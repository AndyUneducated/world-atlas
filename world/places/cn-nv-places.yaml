      art-x-buckham: Museo della Stazione di Posta di Katirjuaq
    notes:
      zh: "由翻越卡蒂尔尤阿克的老驿站改建，展出驮队、雪橇与早年的山路。驿站的马厩里还挂着当年驮队用的铜铃，冬天的旅人听见铃声就知道山口有人在走。博物馆每年冬至会点起老驿站的炉子，请参观的人喝一碗松针茶，听老人讲雪夜翻山的故事。"
      en: "The old post house below the pass, with pack trains, sledges and the mountain roads of early days. The bronze bells of the old pack trains still hang in the stable; on winter roads, travellers knew from their sound that someone was crossing the pass. Each midwinter the museum lights the old post-house stove and serves visitors a bowl of pine-needle tea while old people tell stories of crossing the pass on snowy nights."
    in: div_j82dgm
