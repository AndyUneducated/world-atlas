      en: "The observatory that gave Stargaze District its name. On clear moonless winter nights the street lights of Stargaze and Science City are dimmed for two hours and the observatory opens to the public, and half the queue to see the moon's craters and the star clusters is children. Each year it also prints a star chart as Northwest City's gift for the Lekor Harvest Festival's \"visiting the old home\"."
