      en: Ikkasuvva Falls Park
      art-x-viking: Wasserfallpark Ikkasuvva
      art-x-buckham: Parco delle Cascate di Ikkasuvva
    notes:
      zh: "伊卡苏瓦观光步道的起点，栈道沿峡谷通往一连串瀑布。隆冬时瀑布冻成几十米高的冰墙，成了冰攀爱好者的练习场；夏天融水下泄，隔着几公里都能听见峡谷里的水声。栈道入口的小木屋卖热越橘汁和云杉糖浆松饼。"
      en: "The start of the Ikkasuvva trail, where boardwalks follow the gorge past a chain of waterfalls. In deep winter the falls freeze into ice walls tens of metres high that ice climbers use for practice; in summer the meltwater roars down and can be heard kilometres away. The hut at the start of the boardwalk sells hot lingonberry juice and pancakes with spruce-tip syrup."
    in: div_0t2t36
