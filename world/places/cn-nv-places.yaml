  - id: poi_8rttd6
    subtype: park
    status: generated
    names:
      zh: 岩堡公园
      en: Rocca Park
      art-x-viking: Felsburgpark
      art-x-buckham: Parco della Rocca
    notes:
      zh: "岩堡公园在萨科勒市罗卡区，环绕海边一座形如城堡的岩丘而建，罗卡区（巴克汉姆语「岩堡」）就以这座岩丘得名。公园占地约 0.18 平方公里，岩丘顶上有一座小瞭望台，从这里能看到整个萨科湾、来往的船只和铁岗区的烟囱；岩丘脚下是一片小海滩，夏天附近的居民常来游泳。罗卡是萨科勒的物流与仓储区，罗卡公路货运站和成片的仓库、冷链中心就在不远处，南岸公路纵贯全区，货车和通勤车流昼夜不息，这座公园几乎是区里唯一能让人停下来喘口气的地方。区里年轻家庭多，以巴克汉姆语和中文为母语的居民混居，周末草坪上常能听到两种语言夹杂着喊孩子回家吃饭。\n傍晚退休的老工人爱在山脚的草坪上玩巴克汉姆式的滚木球，输的人请喝咖啡，赢的人则要负责把木球擦干净收进长椅下的木箱里。换班的卡车司机也常把车停在公园外，爬上瞭望台抽根烟、看一眼海，再上路去维京港或贝克勒。岩丘上的石头被海风吹出一个个小洞，孩子们把它们叫作「城堡的窗户」，玩捉迷藏时总有人缩进去躲半天。每年夏天第一个晴朗的周日，罗卡的居民会在海滩上点起篝火烤鱼，说是给岩堡「开窗通风」。"
      en: "Rocca Park, in Rocca District of Sakole, wraps around a castle-shaped knoll of rock by the sea, and the district's name, Buckham for \"rock castle\", comes from that knoll. The park covers about 0.18 km². A small lookout on the summit takes in the whole of Sako Bay, the passing ships and the chimneys of Iron Knoll, and at the foot of the knoll is a little beach where people from the neighbourhood swim in summer. Rocca is Sakole's logistics and warehousing district: the Rocca Road Freight Terminal and rows of warehouses and cold stores are not far off, and the South Coast Highway runs the length of the district, its lorries and commuter traffic never stopping, so the park is almost the only place in the district where people can stop and catch their breath. The district has plenty of young families, with Buckham and Chinese speakers living side by side, and at weekends you can hear both languages on the lawns as parents call their children home for dinner.\nIn the evenings retired factory workers play Buckham-style bowls on the lawn at the foot of the knoll; the loser buys the coffee, and the winner has to wipe the wooden balls dry and stow them in the box under the bench. Lorry drivers changing shifts often park outside the park, climb to the lookout for a cigarette and a look at the sea, then head off for Viking Port or Beckerle. The sea wind has worn little hollows into the rock of the knoll, which children call \"the castle windows\", and in games of hide-and-seek someone always curls up inside one for ages. On the first fine Sunday of every summer, Rocca's residents light bonfires on the beach and grill fish, which they call \"opening the castle windows to air the place\"."
    in: div_8njcs3
    offset_km: [-1.0, 0.6]
    site: { layout: park, size_m: [500, 350] }
  - id: bld_h2rtj9
