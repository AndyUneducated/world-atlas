      en: "The territory's largest university. The university town is liveliest at night, when baked potatoes, hot cheese soup and cinnamon buns see students through exam week and the food stalls stay open past midnight. Stop anyone on Science Avenue and they are probably a lecturer or student here, which is how Northwest City came to be called \"PhD Town\"."
