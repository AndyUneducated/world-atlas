      en: "New City's airport, in South Post District right beside the South Post Logistics Park, mainly carries passengers within the island and freight such as electronic components and parts for the factories around Sakole and Beckerle. The first flights of the morning are full of young office workers heading to meetings in Viking Port and Freedom City, so the airport café opens before dawn; its speciality is a hot sandwich filled with Lekor cheese. The terminal follows New City's planned style, with white walls, a timber ceiling and tall windows, and on a clear day the Lorond Range can be seen to the north from the departure hall."

  - id: poi_dcr8j7
    subtype: spaceport
