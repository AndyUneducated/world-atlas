      en: Tavrupukkuvik City Government
      art-x-viking: Stadtregierung Tavrupukkuvik
      art-x-buckham: Governo Cittadino di Tavrupukkuvik
    notes:
      zh: "普库图克老镇的市政府，普库图克、西加维克两镇合并设市时建成。因为市名太长，市政府的公文抬头用了缩小一号的字体才排得下全名，市民们平时都叫这座城市「塔普」，市政府的门牌上也写着这个昵称。"
      en: "The city government in old Pukkutuuq, built when the towns of Pukkutuuq and Siggavik merged into one city. The city's name is so long that its letterhead needs a smaller typeface to fit it, and residents just call the city \"Tavrup\", a nickname that appears on the building's own door plate."
