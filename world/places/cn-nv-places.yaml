  - id: poi_b36nyv
    subtype: ground_station
    status: generated
    names:
      zh: 西坪量子通信站
      en: West Heath Quantum Station
      art-x-viking: Quantenstation Westheide
      art-x-buckham: Stazione Quantistica di Pianoro Ovest
    notes:
      zh: 西坪量子通信站建在西坪区北部一座海拔九百多米的山顶上，是领地第一座量子通信地面站。站内的四座圆顶里装着光学望远镜，夜间对准过顶的量子通信卫星，接收由单个光子携带的密钥。这种密钥一旦被人窃听就会留下痕迹，因此被用来加密指挥中心与各基地之间最重要的通信。山顶空气干净、远离城市灯光，适合光学通信；但云雾天无法工作，所以站内还配有激光通信终端和普通卫星天线作为补充。站区规模很小，常驻的技术人员大多是从深空太空军士官学校毕业的士官。
      en: West Heath Quantum Station stands on a summit more than 900 m high in the north of West Heath District and was the territory's first quantum communications ground station. Its four domes house optical telescopes that, at night, follow quantum communications satellites overhead and receive encryption keys carried by single photons. Anyone eavesdropping on such a key leaves a trace, so the keys are used to encrypt the most important traffic between the command centre and the bases. The clean air and the distance from city lights suit optical links, but the station cannot work in cloud or fog, so it also has laser communication terminals and ordinary satellite dishes. It is a small station, and most of its resident technicians are NCOs from the Deep Space Force NCO Academy.
    in: div_nwke3f
    offset_km: [-12.02, 41.01]
    site: { size_m: [500, 400], layout: radar, variant: domes, angle_deg: 0 }
    military:
      unit: { zh: 深空太空军量子通信第一站, en: "1st Quantum Communications Station, Deep Space Force" }
      branch: { zh: 深空太空军, en: Deep Space Force }
      equipment:
        zh: 量子通信光学望远镜 4 台、激光通信终端 2 套
        en: 4 quantum-link optical telescopes and 2 laser communication terminals
      personnel: 120
      access: { zh: 军事禁区，不对外开放, en: "Restricted military area, closed to the public" }
  - id: poi_fsxvms
    subtype: observatory
    status: generated
    names:
      zh: 蒂鲁尤阿克峰光学观测站
      en: Mount Tirrujuaq Optical Station
      art-x-viking: Optische Station Tirrujuaqspitze
      art-x-buckham: Stazione Ottica di Tirrujuaq
    notes:
      zh: "蒂鲁尤阿克峰光学观测站位于全岛最高峰蒂鲁尤阿克峰的峰顶，海拔四千三百多米，正式名称是深空太空军空间目标光学观测站，是深空太空军观测轨道目标的光学站。峰顶常在云层之上，空气稀薄干燥，夜空极为清澈，站内的 3 台光学望远镜可以拍摄到很暗的卫星和碎片，测定它们的轨道。站内还装有一套卫星激光测距仪，向装有反射器的卫星发射激光脉冲，测量光脉冲往返的时间，把距离精确到厘米，为导航卫星和测地卫星校准轨道。蒂鲁尤阿克峰属马斯林山市群峰训练管理区，东面俯临星港区，西接霍尔沃思峰和卡瓦卢克图克峰，西北边霍尔沃思峰顶上的激光站与这里遥遥相望。峰顶气候严酷，终年被冰雪包围，不通公路，站里常驻约 60 人，人员和物资都靠直升机运送，值守人员每隔数周轮换一次；站房采用保温密封设计，室内补充氧气，以减轻高山反应。观测站是军事禁区，不对外开放。\n在这样的高度上，烧一壶水要比山下多等好一阵，泡面总是煮不透，值守人员干脆把晚饭叫作「半熟餐」。直升机能不能上山全看天，遇上连日风雪，轮换要推迟一两个星期，站里的人便在望远镜的间隙下棋、给家里写信。观测站的值守人员轮换下山时，总会给星港区的孩子们带回一张峰顶拍到的星空照片，孩子们说那是「最高的窗户」看到的天。"
      en: "Mount Tirrujuaq Optical Station sits on the summit of Mount Tirrujuaq, the island's highest mountain at more than 4,300 m. Officially the Space Object Optical Observatory of the Deep Space Force, it is the force's optical station for watching objects in orbit. The summit is often above the clouds and the air is thin and dry, so the night sky is exceptionally clear, and the station's three optical telescopes can image very faint satellites and debris to fix their orbits. The station also has a satellite laser ranging system that fires laser pulses at satellites carrying reflectors and times their return, measuring the distance to the centimetre to calibrate the orbits of navigation and geodesy satellites. Mount Tirrujuaq lies in the High Peaks Training Area of Maslin Mountain City, looking down on Starport District to the east, with Mount Hallworth and Mount Qavvaluktuuq to the west; the laser station on the summit of Mount Hallworth, to the north-west, faces it across the peaks. Conditions at the top are harsh, with ice and snow all year and no road; about 60 people serve here, crew and supplies come and go by helicopter, and the crew changes every few weeks. The buildings are insulated and sealed, with extra oxygen indoors to ease altitude sickness. The station is a restricted military area, closed to the public.\nAt this altitude a kettle takes much longer to boil than down in the valley and instant noodles never quite cook through, so the crew simply call dinner \"the half-done meal\". Whether a helicopter can make it up depends entirely on the weather; when storms last for days, changeovers slip by a week or two, and the crew fill the gaps between telescope sessions with chess and letters home. When a shift comes down the mountain, they always bring the children of Starport District a photograph of the night sky taken from the summit, and the children say it shows the sky through \"the highest window\"."
    in: div_q5h8zp
