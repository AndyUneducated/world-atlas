      zh: 银滩海滨公园
      en: Silver Beach Seafront Park
      art-x-viking: Strandpark Silberstrand
      art-x-buckham: Parco Lungomare di Spiaggia Argento
    notes:
      zh: "沿细白沙滩的步道、草坪与沙滩排球场。每个周日下午，银滩合唱团在海边的音乐亭演唱，下雨也不停，观众撑着公共雨伞站成一片。退潮时沙滩上会露出一片礁石，孩子们在石缝里找小螃蟹和海星。"
      en: "Promenades, lawns and beach-volleyball courts along the fine white sand. Every Sunday afternoon the Silver Beach Choir sings in the seaside bandstand, rain or shine, to an audience standing under public umbrellas. At low tide a reef appears on the beach, where children look for small crabs and starfish among the rocks."
    in: div_f5s7ax
    offset_km: [-0.5, -1.2]
    site: { layout: park, size_m: [1200, 250] }
  - id: poi_8qs7q4
    subtype: golf_course
    status: generated
    names:
      zh: 岚山高尔夫球场
      en: Mist Hill Golf Club
      art-x-viking: Golfclub Nebelhang
      art-x-buckham: Golf Club Pendio Nebbia
    notes:
      zh: "岚山坡地上的 18 洞球场，俯瞰银滩与大海。球场常被晨雾笼罩，雾里打出的球要等雾散了才找得到，球童因此练出一副好耳力，听落地的声音就知道球去了哪里。下雨天球场照常营业，球包旁边一律插着公共雨伞。"
      en: "An 18-hole course on the slopes of Mist Hill, looking down over Silver Beach and the sea. The course is often wrapped in morning mist, and balls hit into the fog cannot be found until it lifts, so the caddies have developed sharp ears and can tell where a ball has landed by the sound. It stays open in the rain, with a public umbrella standing in every golf bag."
    in: div_ts88e3
    offset_km: [1.2, 0.8]
    site: { layout: park, size_m: [1400, 900] }
  - id: poi_t5nges
    subtype: park
    status: generated
    names:
      zh: 岚山森林公园
      en: Mist Hill Forest Park
      art-x-viking: Waldpark Nebelhang
      art-x-buckham: Parco Forestale di Pendio Nebbia
    notes:
      zh: "晨雾常绕山腰的森林公园，岚山区以此得名；山溪自此直落银滩。林间的步道沿着山溪往下走，一路通到银滩；雨后溪水涨起来，水声在雾里格外响。森林公园山脚下有几处温泉，冬天泡完温泉再喝一碗热鱼汤，是许多天城退休居民的日常。"
      en: "A forest park whose slopes are often wrapped in morning mist, which gave Mist Hill its name; its stream drops straight down to Silver Beach. Its woodland trails follow the stream down all the way to Silver Beach, and after rain the swollen water sounds loud in the mist. There are hot springs at the foot of the hill, and in winter a soak followed by a bowl of hot fish soup is part of everyday life for many of Skytown's retired residents."
    in: div_ts88e3
    offset_km: [-1.0, 0.6]
    site: { layout: park, size_m: [900, 600] }
