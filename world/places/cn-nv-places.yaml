    site: { size_m: [900, 400], layout: port, angle_deg: 177 }

  - id: poi_whsx7x
    subtype: port
    status: generated
    names:
      zh: 斯佩基亚拉港
      en: Specchiara Port
      art-x-viking: Hafen Specchiara
      art-x-buckham: Porto di Specchiara
    notes:
      zh: "斯佩基亚拉港是贝克勒自由贸易区港口群的主港，在斯佩基亚拉区斯佩基亚拉湾畔，占地约 0.89 平方公里。斯佩基亚拉湾是北维京岛面积最大的海湾，湾内水深浪静，港里停靠游艇和高速客轮，也有集装箱船进出；湾外填海建成的保税港区是自贸区的集装箱码头和转口加工区，两者合起来构成贝克勒的港口群。港口背后就是斯佩基亚拉国际金融中心的双塔和贝克勒国际商品交易所，维贝真空磁悬浮的终点贝克勒站也在同一区内，航运、贸易结算和金融在这片湾岸上紧紧挨在一起，许多航运金融机构的办公室窗外就是自家客户的船。周末有船从港口载游客去湾顶的镜岛，岛上只有松林、草甸和环岛步道，是金融从业者躲开写字楼的好去处。\n深夜加班的金融从业者最爱去港边码头的夜宵摊，吃炸鱼、喝热汤，看集装箱船在灯光下进出，摊主们用中文、维京语、巴克汉姆语和英语招呼客人，常客们说这里的汤比交易所的行情还准时。港口的灯塔用巴克汉姆语命名为「明镜」，因为它的灯光倒映在平静的湾面上像一面镜子；高速客轮的船长们有个习惯，夜里进港时看见「明镜」的倒影，就知道湾里风平浪静，可以放心靠岸。"
      en: "Specchiara Port is the main port of the Beckerle Free Trade Zone's group of ports, on Specchiara Bay in Specchiara District, covering about 0.89 km². Specchiara Bay is the largest bay on North Viking Island, deep and sheltered, and the port berths yachts and high-speed passenger ferries as well as container ships; the Bonded Port Zone, built on reclaimed land outside the bay, is the free trade zone's container terminal and re-export processing area, and together they make up Beckerle's port group. Right behind the port rise the twin towers of the Specchiara International Finance Centre and the Beckerle International Commodity Exchange, and Beckerle Station, terminus of the Viking Port–Beckerle Vacuum Maglev, is in the same district, so shipping, trade settlement and finance sit cheek by jowl on this stretch of shore, and many shipping finance firms can see their clients' ships from their office windows. At weekends boats carry visitors from the port to Mirror Isle near the head of the bay, which has only pine woods, meadows and a path round the island, a favourite escape from the office towers for people in finance.\nFinance workers on late shifts favour the night stalls on the port's quays, eating fried fish and hot soup while container ships come and go under the floodlights; the stallholders greet customers in Chinese, Viking, Buckham and English, and regulars say the soup arrives more punctually than the market prices. The port's lighthouse is named \"Bright Mirror\" in Buckham, because its light is reflected in the calm water of the bay like a mirror; the captains of the fast ferries have a habit of their own, and when they see the lighthouse's reflection as they come in at night, they know the bay is calm and they can berth with confidence."
    in: div_8p9k5t
    offset_km: [-1.14, 1.38]
    site: { size_m: [2000, 800], layout: port, angle_deg: 7 }

