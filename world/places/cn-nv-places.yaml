  - id: poi_c83h0h
    subtype: missile_site
    status: generated
    names:
      zh: 星港防空阵地
      en: Starport Air Defence Site
      art-x-viking: Flugabwehrstellung Sternhafen
      art-x-buckham: Postazione Contraerea di Porto Stella
    notes:
      zh: 星港防空阵地位于星港区东部，在深空太空军马斯林山指挥中心东南不远处，是保卫指挥中心的地空导弹阵地。阵地布局与西坪、和平两座阵地相同，环形道路上分布六个发射车位，中央是制导雷达和指挥所。指挥中心是马斯林山最重要的目标之一，这座阵地因此常年保持较高的战备等级，发射车轮流值班，雷达昼夜开机。阵地还与群峰地下指挥城的防空系统联网，一旦星港方向发现威胁，地下指挥城也可以直接调用阵地的火力。冬季阵地内的道路和发射位都铺设了融雪设施，保证随时可以展开。
      en: Starport Air Defence Site is in the east of Starport District, a short way south-east of the Deep Space Force command centre it protects. Its layout matches the sites at West Heath and Peace, six launcher positions on a ring road around a guidance radar and command post. The command centre is one of Maslin Mountain's most important targets, so this site is kept at high readiness all year, with launchers on duty in turn and the radar running day and night. It is networked with the air defences of the underground command complex in the High Peaks, which can also call on its missiles directly if a threat appears from the Starport side. In winter its roads and launch positions are heated so the site can deploy at any time.
    in: div_nytsvb
    offset_km: [7.07, 2.83]
