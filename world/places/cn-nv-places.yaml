      equipment:
        zh: 床位 600 张，设航天医学、高原医学与冻伤专科
        en: 600 beds, with aerospace medicine, altitude medicine and frostbite departments
      personnel: 1400
      access: { zh: 对军人和地方居民开放就诊, en: Open to service members and local residents }

  # ── 北维京岛领地政务院机构（M42）：自由市人民大道「政务院大街」，科学政策司在科学城，边境服务和安全司在维京港 ──
  - id: bld_xj92vh
    subtype: government
    status: generated
    names:
      zh: 北维京岛领地政务院对外事务部
      en: Ministry of External Affairs, North Viking Island Executive Council
    short_names:
      zh: 对外事务部
      en: Ministry of External Affairs
    notes:
      zh: 北维京岛领地政务院对外事务部，位于自由市人民大道「政务院大街」北侧第一栋，负责领地的对外交往和与中央政府的联络。部内设政策司、中央政府联络司、外国使领馆司、礼宾司、国际交流司和领事服务司。外国驻领地的领事馆和商务代表处大多设在自由市和贝克勒，由外国使领馆司对口联系；礼宾司安排外宾来访和领地庆典，人民广场上的国宾欢迎仪式都由它筹办；领事服务司为在岛外国人办理证明和认证，也协助在海外遇到困难的领地居民。大楼为 L 形板楼，正面朝向人民大道。
      en: The Ministry of External Affairs stands first on the north side of Council Row, the stretch of People's Avenue in Freedom City lined with the Executive Council's ministries, and handles the territory's dealings abroad and its liaison with the central government. Its departments are Policy, Central Government Liaison, Foreign Missions, Protocol, International Exchange and Consular Services. Most foreign consulates and trade offices are in Freedom City or Beckerle, and the Foreign Missions Department is their point of contact; Protocol arranges official visits and territorial ceremonies, including the state welcomes on People's Square, and Consular Services certifies documents for foreign residents and helps islanders in difficulty abroad. The building is an L-shaped block facing the avenue.
    in: div_16cxr8
    offset_km: [2.07, 1.62]
    site: { size_m: [140, 110], layout: lshape }

  - id: bld_b3zdbe
    subtype: government
    status: generated
    names:
      zh: 北维京岛领地政务院财政部
      en: Ministry of Finance, North Viking Island Executive Council
    short_names:
      zh: 财政部
      en: Ministry of Finance
    notes:
      zh: 北维京岛领地政务院财政部，与对外事务部隔人民大道相对，管理领地的税收、预算和财政监督。部内设税收司、关税司、监管司、行政部门预算司、企业事业单位预算司和中央财政事务司。全岛实行统一的税制，贝克勒自由贸易区另有低税率和免征关税的特别安排，由税收司和关税司分别执行；行政部门预算司编制政务院各部门的年度预算，企业事业单位预算司管理大学、医院和公共企业的拨款，中央财政事务司负责中央转移支付和上缴事项。大楼为长条形板楼，地下是领地的财政档案库。
      en: The Ministry of Finance faces the Ministry of External Affairs across People's Avenue and runs the territory's taxes, budgets and financial oversight through its departments of Taxation, Customs Tariffs, Supervision, Executive Budgets, Public Enterprise and Institution Budgets, and Central Finance. The whole island has one tax code, and the Beckerle Free Trade Zone's low rates and duty-free rules are applied by the Taxation and Customs Tariff departments. Executive Budgets draws up the yearly budgets of the Council's ministries, Public Enterprise and Institution Budgets funds the universities, hospitals and public companies, and Central Finance handles transfers to and from the central government. It is a long slab with the territory's financial archive underground.
    in: div_16cxr8
    offset_km: [2.29, 1.29]
    site: { size_m: [150, 80], layout: slab }

  - id: bld_cxa8fw
    subtype: government
    status: generated
    names:
      zh: 北维京岛领地政务院司法部
      en: Ministry of Justice, North Viking Island Executive Council
    short_names:
      zh: 司法部
      en: Ministry of Justice
    notes:
      zh: 北维京岛领地政务院司法部，位于政务院大街北侧，负责领地法规的起草和实施、检察事务和司法行政。部内设国家法律实施司、领地法规司、法律法规起草和规范司、检察事务司、司法监察司、拘留管理司、社区矫正管理司、司法从业人员司和司法研究司。领地法规以中文、维京语和巴克汉姆语三种文本同时公布，起草和规范司负责三种文本的一致；司法从业人员司管理律师、公证员和法律翻译的执业资格，拘留管理司和社区矫正管理司分别管理看守所和社区矫正。大楼为 L 形，内侧的庭院旁是法律图书馆。
      en: "The Ministry of Justice, on the north side of Council Row, drafts and applies the territory's laws and runs prosecutions and the administration of justice. It has nine departments: National Law Enforcement, Territorial Regulations, Legislative Drafting and Standards, Prosecutions, Judicial Inspection, Detention, Community Corrections, Legal Professions and Legal Research. Territorial laws are published at once in Chinese, Viking and Buckham, and the drafting department keeps the three texts in step; Legal Professions licenses lawyers, notaries and legal translators, while Detention and Community Corrections run the remand centres and supervision in the community. The L-shaped building has a law library beside its inner yard."
    in: div_16cxr8
    offset_km: [2.22, 1.72]
    site: { size_m: [140, 110], layout: lshape }

  - id: bld_k9beja
    subtype: government
    status: generated
    names:
      zh: 北维京岛领地政务院公共安全部
      en: Ministry of Public Security, North Viking Island Executive Council
    short_names:
      zh: 公共安全部
      en: Ministry of Public Security
    notes:
      zh: 北维京岛领地政务院公共安全部，位于政务院大街南侧，统一领导全岛的警务和治安。部内设警察司、警务司、边境服务和安全司、刑事侦查司、民事侦查司、经济犯罪调查司、社区安全司和技术和装备司；边境服务和安全司要守住海底隧道和港口口岸，单独设在维京港。经济犯罪调查司与贝克勒自由贸易区的金融监管配合，打击洗钱和走私；社区安全司在各市推行社区警务，冬季还负责雪灾和交通事故的应急救援；技术和装备司为高速公路警察配备在不限速路段使用的巡逻车和直升机。大楼底层是全岛的报警指挥中心。
      en: The Ministry of Public Security, on the south side of Council Row, directs policing and public order across the island. Its departments are Police, Policing Operations, Border Services and Security, Criminal Investigation, Civil Investigation, Economic Crime, Community Safety, and Technology and Equipment; Border Services and Security, which guards the undersea tunnel and the ports of entry, has its own building in Viking Port. Economic Crime works with the Beckerle Free Trade Zone's financial regulators against money laundering and smuggling, Community Safety runs neighbourhood policing and winter rescue after snowstorms and crashes, and Technology and Equipment supplies the patrol cars and helicopters of the expressway police on the unrestricted stretches. The island's emergency call and dispatch centre is on the ground floor.
    in: div_16cxr8
    offset_km: [2.44, 1.39]
    site: { size_m: [150, 80], layout: slab }

  - id: bld_xmm0mt
