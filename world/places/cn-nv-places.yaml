      branch: { zh: 空军, en: Air Force }
      equipment:
        zh: 高空长航时侦察无人机 8 架、察打一体无人机 16 架
        en: 8 high-altitude long-endurance reconnaissance drones and 16 armed reconnaissance drones
      personnel: 1500
