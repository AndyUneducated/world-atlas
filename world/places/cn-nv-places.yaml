  - id: bld_j9z0s3
    subtype: museum
    status: generated
    names:
      zh: 铁岗矿业博物馆
      en: Iron Knoll Mining Museum
      art-x-viking: Bergbaumuseum Eisenhügel
      art-x-buckham: Museo Minerario di Colle Ferro
    notes:
      zh: "由铁岗山旧铁矿的选矿厂改建的博物馆，在萨科勒市铁岗区，展馆约 180 米长、120 米宽，展出矿车、竖井模型与矿工生活。铁岗区的区名就得自岗地上曾经出产的铁矿，铁岗山的露天矿坑和竖井曾是全岛最主要的铁矿来源，矿石经铁路运往港口出口；矿藏逐渐采尽后，矿区转型为工业区，铁岗先进制造产业园在旧矿区周围铺开，集中了机床、工程机械、电子元件、风电与储能设备和船舶配件等数百家企业，部分矿山仍在开采石料和建筑骨料。博物馆利用旧矿井和选矿厂改建，游客可以乘坐矿车深入地下巷道，了解矿工的生活与采矿技术的演变。萨科勒职业技术学院的学生常来这里上第一课，老师说，要先知道这座城市是怎么从地底下挖出来的。巴克汉姆语是萨科勒过半居民的母语，展板和讲解都用巴克汉姆语和中文双语。馆里保留着城里最早的那座炼铁炉，萨科勒人说一切都是从这座炉子开始的。\n参观者可以戴上矿工头灯走进一段复原的巷道，出口处有一面墙，写满了老矿工和他们家人的名字。铁岗区的工厂每天中午十二点拉响汽笛，萨科渔港的渔民把它当作收网回港的信号，这个习惯从城里只有那一座炼铁炉的时候一直延续到今天；博物馆的讲解员讲到这里，总会停下来等窗外的汽笛响完。"
      en: "A museum in the converted ore-dressing plant of the old iron mine on Iron Knoll, in Iron Knoll District of Sakole City, in a building about 180 m long and 120 m wide, showing mine cars, models of shafts and the lives of miners. The district takes its name from the iron ore once mined on the knoll: the open pits and shafts of Iron Knoll were once the island's main source of iron ore, shipped by rail to the port for export. As the ore ran out, the mining area was turned into an industrial zone, and the Iron Knoll Advanced Manufacturing Park now spreads around the old workings with hundreds of firms making machine tools, construction machinery, electronic components, wind and storage equipment and ship fittings, while a few quarries still produce stone and aggregate. The museum makes use of old mine shafts as well as the plant, and visitors can ride a mine car deep into the underground galleries to learn about miners' lives and how mining techniques changed. Students of Sakole Polytechnic often come here for their first lesson; the teachers say you must first know how this city was dug out of the ground. Buckham is the first language of more than half of Sakole's people, and the panels and guided tours are in both Buckham and Chinese. The museum keeps the town's very first blast furnace, and Sakole people say everything started with this furnace.\nVisitors can put on miners' head lamps and walk through a reconstructed gallery, and at the exit is a wall covered with the names of old miners and their families. Every day at noon the factories of Iron Knoll sound their whistles, and the fishermen of Sako Fishing Harbour take it as the signal to haul in their nets and head home, a habit that has lasted since the days when the town had only that one furnace; when the guides reach this part of the story, they always pause until the whistle outside has finished."
    in: div_6byxb5
    offset_km: [-1.2, 0.8]
    site: { layout: hall, size_m: [180, 120] }
