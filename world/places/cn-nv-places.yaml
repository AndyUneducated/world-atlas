  - id: bld_bbw8n2
    subtype: museum
    status: generated
    names:
      zh: 勒克尔农业博物馆
      en: Lekor Farming Museum
      art-x-viking: Landwirtschaftsmuseum Lekor
      art-x-buckham: Museo dell'Agricoltura di Lekor
    notes:
      zh: "由老粮仓改建的博物馆，在勒克尔市勒克尔维克区，展馆约 160 米长、110 米宽，讲述北维京岛的农牧历史，展示从维京时代的木犁到现代联合收割机的农具演变，是学生和游客了解本岛农业历史的地方。勒克尔维克区是勒克尔市拆分后保留的北部农牧核心，也是全市的行政中心：勒克尔市人民政府坐落在区中心的老镇上，周围是石砌的旧市政厅、教堂和集市广场；勒克尔农产品交易中心是全岛粮食、奶制品和肉类的定价与批发市场，每天清晨卡车从各地运来货物。博物馆就在这片麦田、牧场和乳品厂之间，展厅里还陈列着乳业合作社早年的奶桶、木制黄油模子和印着村名的麻袋。居民多以维京语为母语，许多家庭经营农场已有好几代，常有老人带着孙辈来指认自己小时候用过的农具。每年秋天的勒克尔丰收节是全岛最热闹的乡村节日，节日期间博物馆延长开放，接待从各地赶来的游客。粮仓的木梁上还留着当年存粮时刻下的刻度。\n馆里最受孩子欢迎的是一台可以亲手摇动的老式脱粒机，秋天博物馆会请老农来示范手工打黄油，打好的黄油抹在黑麦面包上分给参观的人。打黄油要摇上好一阵，老农总让围观的孩子轮流帮忙，谁摇出第一块黄油，就能把木模子上的花纹印在自己那份上带回家。"
      en: "A museum in a converted old granary in Lekorvik District of Lekor City, in a building about 160 m long and 110 m wide. It tells the story of farming and herding on North Viking Island, tracing the evolution of farm tools from the wooden plough of the Viking age to the modern combine harvester, and is where students and visitors come to learn the island's farming history. Lekorvik is the northern farming heartland Lekor kept after the city was divided and is the city's administrative centre: the Lekor City Government stands in the old town at the heart of the district, surrounded by the stone old town hall, church and market square, and the Lekor Produce Exchange sets prices and trades wholesale for the island's grain, dairy produce and meat, with lorries arriving from all over each morning. The museum stands among these wheat fields, pastures and dairies, and its galleries also show the dairy cooperatives' early milk churns, wooden butter moulds and sacks printed with village names. Most residents speak Viking as their first language and many families have farmed for generations; grandparents often bring their grandchildren to point out tools they used as children. The Lekor Harvest Festival each autumn is the island's liveliest country festival, and the museum stays open later to receive visitors from all over. The granary's wooden beams still bear the marks once cut to measure the stored grain.\nThe children's favourite exhibit is an old thresher they can crank by hand, and in autumn the museum invites old farmers to demonstrate churning butter by hand, spreading the result on rye bread for visitors. Churning takes a long time, so the farmers let the watching children take turns; whoever churns out the first pat gets to press the pattern of the wooden mould onto their share and take it home."
    in: div_0wvh63
    offset_km: [-0.6, 0.6]
    site: { layout: hall, size_m: [160, 110] }
  - id: poi_8btcjd
    subtype: plaza
    status: generated
    names:
      zh: 科恩达尔丰收广场
      en: Korndal Festival Square
      art-x-viking: Erntefestplatz Korndal
      art-x-buckham: Piazza della Festa di Messe Valle
    notes:
      zh: "科恩达尔丰收广场在勒克尔市科恩达尔区，是勒克尔丰收节的主会场。科恩达尔是勒克尔南部土壤肥沃、日照充足的河谷，也是北维京岛唯一成规模的葡萄酒产区，科恩达尔酒庄和数十家家庭酒庄的葡萄园就在广场周围的向阳坡地上，北河公路穿过谷地，向西通往西加维克和自由市，向北通往勒克尔维克。广场占地约 0.13 平方公里，平日是镇上的集市和停车场，每年秋收时节，这里举行农产品评比、民族舞蹈、拖拉机巡游和篝火晚会，吸引全岛乃至维京群岛的游客。丰收节期间广场上搭满了木棚，卖盐粒硬奶酪、油菜花蜜、烤猪肘和热香料白葡萄酒，夜里还有乡村乐队演奏，跳舞的人一直跳到篝火熄灭。\n拖拉机巡游是孩子们最盼望的节目：农家把自家的拖拉机擦得锃亮，挂满麦穗和彩带，排成长队绕广场慢慢开过，车斗里坐着笑闹的孩子和抱着手风琴的老人。节日最后一天要评出全岛最大的南瓜，获胜的南瓜会被雕成灯笼，挂在广场中央照亮到冬天，种瓜的人家整整一年都会被邻居叫作「南瓜王」。科恩达尔的家庭大多兼营农场和民宿，丰收节那几天人手最紧，连在外地上大学的孩子也要请假回来帮忙端盘子、倒酒。"
      en: "Korndal Festival Square, in Korndal District of Lekor City, is the main venue of the Lekor harvest festival. Korndal is a fertile, sunny valley in the south of Lekor and the only wine region of any size on North Viking Island; the vineyards of the Korndal Winery and dozens of family wineries climb the south-facing slopes around the square, and the North River Highway runs through the valley, west to Siggavik and Freedom City and north to Lekorvik. The square covers about 0.13 km² and is a market and car park for the town most of the year. Each autumn at harvest time it hosts produce competitions, folk dancing, a tractor parade and a bonfire night that draw visitors from across the island and even from the Viking Islands. During the festival the square fills with wooden booths selling hard cheese crusted with salt, rapeseed honey, roast pork knuckle and hot spiced white wine, and at night country bands play while the dancers keep going until the bonfire dies down.\nThe tractor parade is what the children look forward to most: farming families polish their tractors until they shine, hang them with sheaves of wheat and ribbons, and drive slowly round the square in a long procession, trailers full of giggling children and old men with accordions. On the last day of the festival the biggest pumpkin on the island is chosen, and the winner is carved into a lantern and hung in the middle of the square to light it until winter; the family who grew it are called \"the pumpkin kings\" by their neighbours for the whole year. Most Korndal families run a farm and a guesthouse at the same time, and hands are shortest during the festival, so even children away at university take time off to come home and help serve food and pour wine."
    in: div_davn2j
    offset_km: [0.3, 0.3]
    site: { layout: plaza, size_m: [420, 300] }
  - id: poi_9yp4qr
    subtype: winery
    status: generated
    names:
      zh: 科恩达尔酒庄
      en: Korndal Winery
      art-x-viking: Weingut Korndal
      art-x-buckham: Cantina di Messe Valle
    notes:
      zh: "科恩达尔区最大的酒庄，葡萄园与酒窖对游客开放。酒庄用耐寒葡萄酿出带苹果香的白葡萄酒，冬天烫热了加香料喝。每年秋天采摘季，酒庄邀请游客一起下地剪葡萄，剪得最多的人能把自己的名字印在当年的酒标背面。"
      en: "The largest winery in Korndal, with vineyards and cellars open to visitors. It makes an apple-scented white wine from hardy grapes, drunk hot with spices in winter. Each autumn at harvest visitors are invited to help cut the grapes, and whoever picks the most has their name printed on the back of that year's label."
    in: div_davn2j
    offset_km: [2.6, 1.8]
    site: { layout: park, size_m: [700, 500] }
  - id: poi_9wff2j
    subtype: park
    status: generated
    names:
      zh: 克拉尔瓦滕湖滨公园
      en: Klarvatn Shore Park
      art-x-viking: Uferpark Klarvatn
      art-x-buckham: Parco Lungolago di Lago Chiaro
    notes:
      zh: "克拉尔瓦滕湖滨公园在勒克尔市克拉尔瓦滕区，沿克拉尔瓦滕湖岸修建，有步道、沙滩、观鸟台、露营地和游船码头，占地约 0.32 平方公里。克拉尔瓦滕湖是北维京岛面积最大的湖泊，两百三十多平方公里，湖水来自洛龙山脉的融雪和冰川融水，晴天能看到几米深的湖底；湖里出产鳟鱼和白鲑，湖边小镇上的烟熏鳟鱼是当地特产。纳帕图克公路从洛龙山区下来，在湖的南岸到达终点，许多游客从塔夫鲁普库维克开车穿过群山，一下山就到了公园门口。克拉尔瓦滕区严格控制湖岸开发，公园周围只有木屋酒店和家庭旅馆，居民以说维京语的老人和退休移居者为主。\n夏天游船从码头出发，绕湖一圈能看到湖边的牧场和科恩达尔的葡萄园，从北岸回望，洛龙山脉的雪峰倒映在湖中，日出和日落时最美。隆冬湖面封冻，冰钓的小木屋在湖上排成一座小镇，屋里生着炉子，钓上来的白鲑当场在炉上煎；冰层够厚时，湖心还会办一场冰上集市，卖热饮、烟熏鳟鱼和手织毛袜。湖岸的人说冬天的湖上「比夏天的镇上还热闹」，公园管理员每天清晨要沿岸量一遍冰厚，把数字写在码头边的黑板上，冰钓的人看了才敢往湖心走。"
      en: "Klarvatn Shore Park, in Klarvatn District of Lekor City, runs along the shore of Lake Klarvatn with footpaths, a beach, birdwatching platforms, a campsite and a pier for pleasure boats, and covers about 0.32 km². Lake Klarvatn is the largest lake on North Viking Island, more than 230 km², fed by snowmelt and glacier water from the Lorond Mountains, and on a clear day you can see the bottom several metres down; it yields trout and whitefish, and smoked trout from the lakeside towns is the local speciality. The Napatuuq Highway comes down out of the Lorond Mountains and ends on the lake's south shore, so many visitors drive through the mountains from Tavrupukkuvik and arrive at the park gates as soon as they reach the bottom. Klarvatn District keeps a tight rein on lakeshore building, so the park is surrounded only by log-cabin hotels and family guesthouses, and the residents are mostly older Viking speakers and people who have moved here to retire.\nIn summer boats leave the pier for a circuit of the lake, passing lakeside pastures and the vineyards of Korndal, and from the north shore the snow peaks of the Lorond Mountains are mirrored in the water, loveliest at sunrise and sunset. In deep winter the lake freezes and the ice-fishing huts on it line up into a small town; stoves burn inside, and whitefish are fried on them straight from the hole. When the ice is thick enough, a market is held in the middle of the lake, selling hot drinks, smoked trout and hand-knitted socks. People on the shore say the lake in winter is \"livelier than the town in summer\". Every morning the park warden measures the ice along the shore and chalks the figure on a blackboard by the pier, and the ice fishers only head out to the middle once they have read it."
    in: div_t8bg0d
    offset_km: [0, 2.0]
    site: { layout: park, size_m: [800, 400] }
  # ── 萨科勒市与贝克勒自由贸易区地标（M15）──
  - id: bld_1bjy8a
    subtype: townhall
    status: generated
    names:
      zh: 萨科勒市人民政府
      en: Sakole City Government
      art-x-viking: Stadtregierung Sakole
      art-x-buckham: Governo Cittadino di Sakole
    notes:
      zh: "设在萨科老镇中心的市政府，建市时由镇公所扩建。镇公所的老楼保留着原来的钟楼和石阶，市政府的公告用中文和巴克汉姆语双语张贴。每天中午铁岗区工厂的汽笛声传到这里，市政府的午休也就开始了。"
      en: "The city government in the centre of old Sako, enlarged from the town hall when the city was founded. The old town-hall building keeps its original clock tower and stone steps, and the city's notices are posted in both Chinese and Buckham. When the noon whistle of the Iron Knoll factories reaches it each day, the city government breaks for lunch."
    in: div_8m0jx4
    offset_km: [0.2, 0.2]
    site: { layout: complex, size_m: [300, 220] }
  - id: poi_39e7mh
    subtype: plaza
    status: generated
    names:
      zh: 萨科老镇广场
      en: Sako Old Town Square
      art-x-viking: Altmarkt Sako
      art-x-buckham: Piazza Vecchia di Sako
    notes:
      zh: "萨科勒市萨科区老镇钟楼前的石铺广场，广场约 220 米长、160 米宽，建市前是萨科镇的集市与中心。萨科镇原是萨科湾畔的巴克汉姆渔镇，城市名萨科勒在巴克汉姆语中意为「萨科之地」，这里正是全市的发祥地。广场周围是旧市政厅、钟楼和石砌教堂，萨科勒市人民政府和主要商业街也集中在老镇附近，彩色的石屋沿港湾排开，往下走几步就是萨科渔港和萨科鱼市：渔港至今仍是本岛南部最繁忙的渔港之一，渔船每天清晨把鳕鱼、鲭鱼和贝类送到鱼市，鱼市旁的小馆子最受欢迎的是用番茄、橄榄油和当天渔获炖成的鱼汤，配一块烤得焦脆的面包。老镇的巴克汉姆传统节庆在广场上举行，传统音乐和舞蹈代代相传，手工艺作坊和海港风光吸引着全岛游客。居民大多以巴克汉姆语为母语，人们在广场上见面用巴克汉姆语问候，孩子们说话常在巴克汉姆语和中文之间随口切换。铁岗区的工厂每天中午十二点拉响汽笛，广场上的人也习惯跟着它对表。\n傍晚广场最热闹，退休的老工人在石板地上玩巴克汉姆式的滚木球，输的人请喝咖啡，围观的年轻工人一边看一边用巴克汉姆语起哄。比赛常常为了谁的木球离目标更近吵上好一阵，最后总要请钟楼下卖咖啡的老板拿尺子来量，老板量完从不当场宣布，先给双方各倒一杯咖啡再说。"
      en: "A stone-paved square in front of the old town clock tower in Sako District of Sakole City, about 220 m long and 160 m wide, which before the city was founded was the market place and centre of the town of Sako. Sako was a Buckham fishing town on Sako Bay, and the city's name Sakole means \"land of Sako\" in Buckham, so this is where the city began. Around the square stand the old town hall, the clock tower and a stone church, with the Sakole City Government and the main shopping streets close to the old town; colourful stone houses line the harbour, and a few steps down are Sako Fishing Harbour and the Sako Fish Market. The harbour is still one of the busiest fishing ports in the south of the island, boats bringing cod, mackerel and shellfish to the market every morning, and the small restaurants beside the market are best known for a fish stew of tomatoes, olive oil and the day's catch, served with a slice of crusty toasted bread. The old town's traditional Buckham festivals are held on the square, traditional music and dance have been handed down for generations, and craft workshops and harbour views draw visitors from all over the island. Most residents speak Buckham as their first language, people greet each other on the square in Buckham, and children switch freely between Buckham and Chinese. The factories of Iron Knoll sound their whistles at noon every day, and people on the square set their watches by them.\nThe square is liveliest in the evening, when retired workers play a Buckham-style game of bowls on the flagstones, the loser buying the coffee, while young workers watching heckle in Buckham. Games often stall in long arguments over whose ball is closer to the jack, and in the end the coffee seller under the clock tower is always called over with a tape measure; having measured, he never announces the result on the spot, but first pours both sides a coffee."
    in: div_8m0jx4
    offset_km: [0.7, -0.5]
    site: { layout: plaza, size_m: [220, 160] }
  - id: bld_142py9
    subtype: marketplace
    status: generated
    names:
      zh: 萨科鱼市
      en: Sako Fish Market
      art-x-viking: Fischmarkt Sako
      art-x-buckham: Mercato del Pesce di Sako
    notes:
      zh: "老镇的鱼市，每天清晨拍卖萨科湾渔港的渔获。鱼市旁的小馆子里，最受欢迎的是用番茄、橄榄油和当天渔获炖成的鱼汤，配一块烤得焦脆的面包。拍卖结束后剩下的小杂鱼会被装进一只大锅，熬成当天的「拍卖汤」，免费分给收摊的渔民。"
      en: "The old town's fish market, auctioning the catch of the Sako Bay harbour every dawn. In the little restaurants beside it the favourite is a stew of tomatoes, olive oil and the day's catch with a slice of crisp toast. After the auction the leftover small fish go into one big pot for that day's \"auction soup\", given free to the fishermen as they pack up."
