  - id: bld_tkc5zs
    subtype: museum
    status: generated
    names:
      zh: 阿基尼克博物馆
      en: Aaqqiniq Museum
      art-x-viking: Museum Aaqqiniq
      art-x-buckham: Museo di Aaqqiniq
    notes:
      zh: "拆市前马斯林山市的市府旧址，现为讲述东北部开发与驯鹿牧业的博物馆，在雅利基卢克市阿基尼克区，建筑群约 240 米长、180 米宽。旧马斯林山市的市政府、法院、学校和官员宅邸建在雅利基卢克河谷以东、马斯林山脉西麓的一片高阶地上，拆市、迁府之后，旧机关大楼和建筑群被完整保留下来，改建为阿基尼克博物馆，展示这片土地从维京人定居、垦荒放牧到领地建立的历史，以及马斯林山地区的军事与航天发展。博物馆群包括旧议事厅、档案馆、民俗馆和露天建筑博物馆，露天馆里迁建了雅利基卢克河流域各地的传统农舍、谷仓和教堂，夏季有身着传统服装的讲解员演示纺织、打铁和制作奶酪。阿基尼克区常住人口不到一万，大多是博物馆职员、教师、农户和退休人员，以维京语为母语；阶地上可以远眺马斯林山脉的雪峰。夏天博物馆门口总有老人摆摊卖手缝的驯鹿皮手套，旁边还有驯鹿肉干、烟熏河鳟和云莓果酱。\n馆里的一面墙挂着上百只驯鹿的耳标，每一只都对应一户牧民家庭的记号，老牧民来参观时常常能找到自家祖辈的那一只。尼尔萨利特的年轻牧民成家时，会把自家新刻的耳标送一只来挂上，馆员说这面墙「每年都长一点」，旁边的空位已经预留到了下一面墙。"
      en: "The former seat of Maslin Mountain City's government before the city was divided, now a museum of the development of the north-east and of reindeer herding, in Aaqqiniq District of Jaalikiluk City; the complex covers an area about 240 m by 180 m. The old city's government offices, court, school and officials' residences were built on a high terrace east of the Jaalikiluk valley at the foot of the western Maslin Range. After the city was divided and its seat moved, the old government buildings were preserved intact and turned into the Aaqqiniq Museum, which tells the history of this land from Viking settlement, clearing and herding to the founding of the territory, as well as the military and aerospace development of the Maslin Mountain area. The museum includes the old council chamber, an archive, a folk museum and an open-air museum where traditional farmhouses, barns and a church have been moved from across the Jaalikiluk basin, and in summer guides in traditional dress demonstrate weaving, blacksmithing and cheese-making. Aaqqiniq District has fewer than 10,000 residents, mostly museum staff, teachers, farmers and retirees, who speak Viking as their first language; and from the terrace the snowy peaks of the Maslin Range can be seen. In summer old people always set up stalls outside the museum selling hand-sewn reindeer-hide gloves, alongside dried reindeer meat, smoked river trout and cloudberry jam.\nOne wall inside is hung with hundreds of reindeer ear tags, each matching the mark of a herding family, and old herders visiting often find the one that belonged to their grandparents. When young herders in Nirsaliit marry, they send one of their family's newly cut tags to hang there; the staff say the wall \"grows a little every year\", and space has already been set aside on the next wall."
    in: div_1qm5cj
    offset_km: [0.2, 0.2]
    site: { layout: complex, size_m: [240, 180] }
  - id: bld_6jc5a2
    subtype: marketplace
    status: generated
    names:
      zh: 尼尔萨利特牧民集市
      en: "Nirsaliit Herders' Market"
      art-x-viking: Rentierhirtenmarkt Nirsaliit
      art-x-buckham: Mercato dei Pastori di Nirsaliit
    notes:
      zh: "牧民秋季下山时的集市，交易驯鹿肉、皮毛与手工艺品。集市开张那几天，牧民们赶着驯鹿从高原下来，搭起帐篷就地交易，晚上围着篝火唱塔夫鲁纳克语的牧歌。最抢手的是手缝的驯鹿皮手套和靴子，老匠人说一双好手套「能陪你走过三十个冬天」。"
      en: "The market held when the herders come down in autumn, trading reindeer meat, hides and handicrafts. In the market days herders bring their reindeer down from the uplands and trade from tents pitched on the spot, singing Tavrunaq herding songs round the fire at night. The most sought-after goods are hand-sewn reindeer-skin mittens and boots, and the old craftsmen say a good pair of mittens \"will see you through thirty winters\"."
    in: div_e2pk5r
    offset_km: [0.1, -0.1]
    site: { layout: market, size_m: [200, 140] }

  # ── 马斯林山军事与航天设施（M25）：空军 ──
  - id: poi_f12qtt
