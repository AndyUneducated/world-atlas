      zh: 银滩主题乐园
      en: Silver Beach Theme Park
      art-x-viking: Freizeitpark Silberstrand
      art-x-buckham: Parco Divertimenti di Spiaggia Argento
    notes:
      zh: "全岛最大的主题乐园，有过山车、海洋馆和夏夜烟火。银滩的夏天短而珍贵，乐园在夏至前后的夜晚放烟火，烟火映在海面上，从岚山区的山坡上看得最清楚。下雨天过山车照常开，排队的游客撑着公共雨伞，本地人说「不淋雨的过山车不算坐过天城的过山车」。"
      en: "The island's largest theme park, with roller coasters, an aquarium and summer-night fireworks. Summer on Silver Beach is short and precious, and around midsummer the park sets off fireworks at night that reflect on the sea, best seen from the slopes of Mist Hill. The roller coasters run in the rain, the queues standing under public umbrellas, and locals say \"a Skytown coaster ride doesn't count unless you got wet\"."
    in: div_f5s7ax
    offset_km: [1.0, 0.8]
    site: { layout: park, size_m: [900, 700] }
  - id: poi_y3d08p
