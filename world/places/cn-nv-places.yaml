      en: "The college that trains the territory's schoolteachers. Its graduates are posted to schools all over the island, many to small schools in the inland pastures and remote fishing villages. By old tradition each graduate writes the name of their school in the library's visitors' book before leaving, and the books now fill a whole wall of shelves."
