      zh: 世界最大的航天发射场，有三座发射台和两座垂直降落台
      en: The largest spaceport in the world, with three launch pads and two vertical landing pads
    notes:
      zh: "西坪区高原上的航天发射与回收场，三座发射台、两座垂直降落台与航天飞机跑道。每有火箭升空，马斯林山的学校停课一小时，全城人站在街边仰头看火箭拖着白烟划过三面雪峰。飞船回到降落台时，深空太空军按惯例在指挥中心门口敲响一口铜钟，钟声一响，附近的居民就知道「有人回家了」。"
      en: "Launch and recovery site on the West Heath plateau, with three launch pads, two vertical landing pads and a spaceplane runway. Whenever a rocket lifts off, Maslin Mountain's schools stop for an hour and the whole city stands in the streets watching it trail white smoke past the snowy peaks on three sides. When a spacecraft comes back to the landing pads, the Deep Space Force rings a bronze bell outside its command centre, and at the sound the neighbours know that \"someone is home\"."
    in: div_nwke3f
    offset_km: [4.0, 0.0]
    site: { size_m: [7000, 3500], layout: spaceport, angle_deg: 60 }

