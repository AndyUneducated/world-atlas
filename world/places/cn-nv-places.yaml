    names:
      zh: 雪谷装甲训练场
      en: Snow Valley Armour Range
      art-x-viking: Panzerübungsplatz Schneetal
      art-x-buckham: Poligono Corazzati di Valle Neve
    notes:
      zh: 雪谷装甲训练场位于雪谷区西北部的开阔谷地，是马斯林山唯一的装甲兵训练场。场内一圈圈坦克环道穿过丘陵、壕沟、水坑和雪地，驾驶员在这里练习各种地形下的驾驶；射击阵地正对着远处的靶区，坦克和步兵战车在行进中射击移动靶。训练场一角还有一片模拟街区，用来训练装甲部队与步兵协同作战。冬季冻土坚硬、积雪很厚，是检验车辆寒区性能的最好时机，许多新型车辆都在这里完成寒区试验。训练场边缘的营区由合成旅驻守，平时与雪谷营区共用后勤保障。
      en: The Snow Valley Armour Range lies in an open valley in the north-west of Snow Valley District and is Maslin Mountain's only armour training range. Loop after loop of tank track runs through hills, ditches, water splashes and snow, where drivers learn to handle every kind of ground. From the firing points tanks and infantry fighting vehicles shoot on the move at moving targets in the impact area beyond. In one corner a mock town is used to train armour and infantry to fight together. In winter the frozen ground is hard and the snow deep, the best time to prove vehicles in the cold, and many new vehicles have finished their cold-weather trials here. A brigade camp on the edge of the range shares its logistics with Snow Valley Garrison.
    in: div_0tsyzy
