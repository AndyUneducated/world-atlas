    notes:
      zh: "萨科勒的老渔港，在萨科区，是城市的发祥地。港里停着几十条漆成蓝白两色的巴克汉姆式小渔船，船头画着一只眼睛，渔民说这是为了「让船看得见回家的路」。铁岗区工厂每天中午的汽笛声传到这里，就是渔船收网回港的信号；渔获上岸后直接送进旁边的萨科鱼市，码头边的小馆子用当天的鱼炖番茄鱼汤，渔民和游客常常挤在同一张桌上。"
      en: "Sakole's old fishing harbour, in Sako District, where the city began. Dozens of small Buckham-style boats painted blue and white lie in the harbour, each with an eye painted on its bow \"so that the boat can see its way home\", as the fishermen say. The noon whistle from the Iron Knoll factories, carried here on the wind, is the signal for the boats to haul in and head home; the catch goes straight from the quay into the Sako Fish Market next door, and the little restaurants on the waterfront stew the day's fish with tomatoes, fishermen and visitors often squeezed in at the same table."

  - id: poi_dcr97r
