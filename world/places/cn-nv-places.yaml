    site: { size_m: [900, 650], layout: campus }
    notes:
      zh: "北维京岛大学是北维京岛领地的综合性大学，主校区在自由市白桦区，靠近人民广场，占地约 0.58 平方公里。大学与自由市中心医院合作培养医生，也开设法律、公共管理、教育和中文、维京语、巴克汉姆语三种语言的语言文学专业，领地的许多公务员和教师都从这里毕业。白桦区是首府的行政与文化核心，领地政府、议会综合办公区、领地博物馆和领地图书馆都在附近，学生们走几步就能去议会综合办公区旁听辩论、去图书馆查资料，法学院的学生常说他们的「实习基地就在马路对面」。校园周围的街道按棋盘格规划，两旁种着成排的白桦，自由市地铁 1 号线的人民广场站和领地图书馆站离校园都不远。\n毕业典礼在人民广场上举行，毕业生们把学位帽抛向天空后，会排队走过白桦区的议员林，按老传统在林边种下一棵小白桦；毕业生的白桦和议员们的白桦长在一起，校友们回母校时常要找半天，才认出哪一棵是自己的。校园里的学生食堂以一道「三语汤」出名，中文叫鳕鱼土豆汤，维京语和巴克汉姆语的名字各不相同，打饭的窗口上挂着三块牌子，新生要是能用三种语言把汤名念对，打汤的阿姨会多给一勺。"
      en: "The University of North Viking Island is the territory's comprehensive university, with its main campus of about 0.58 km² in Birchwood District of Freedom City, close to People's Square. It trains doctors together with the Freedom City Central Hospital and also teaches law, public administration, education, and language and literature in all three of the island's languages, Chinese, Viking and Buckham; many of the territory's civil servants and teachers are its graduates. Birchwood is the capital's core of government and culture, with the territorial government, the Parliament Complex, the Territorial Museum and the Territorial Library close by, so students can walk over to the Parliament Complex to listen to debates or to the library to look things up, and law students like to say their \"work placement is across the road\". The streets around the campus are laid out on a grid and lined with rows of birches, and People's Square and Territorial Library stations on Freedom City Metro Line 1 are both a short walk from the campus.\nGraduation is held in People's Square. After throwing their mortarboards into the air, graduates file through the Members' Wood in Birchwood and, by old tradition, plant a young birch at its edge; the graduates' birches grow up alongside the members' birches, and alumni visiting their old university often search for ages before they find their own tree. The student canteen is famous for its \"three-language soup\", which is called cod and potato soup in Chinese and has different names in Viking and Buckham; three signs hang over the serving hatch, and any fresher who can pronounce the soup's name correctly in all three languages gets an extra ladleful from the dinner lady."

  - id: bld_7zgazx
    subtype: hospital
    status: generated
    names:
      zh: 自由市中心医院
      en: Freedom City Central Hospital
      art-x-viking: Zentralkrankenhaus Freistad
      art-x-buckham: Ospedale Centrale di Frei
    in: div_16cxr8
    offset_km: [1.55, -0.89]
    site: { size_m: [400, 300], layout: campus }
    notes:
      zh: "领地的中心医院，在自由市白桦区，院区约 400 米长、300 米宽，与北维京岛大学合作培养医生，承担全岛的疑难重症救治。白桦区是首府的行政与文化核心，北维京岛大学的主校区就在附近，医学生在两处之间往返上课和实习；医院与大学一起，让公务员、教师和医护人员成为首府就业的主体。全岛各地的疑难病人都转到这里，洛龙山、雅利基卢克等偏远山区的急救病人常由直升机送到医院楼顶的停机坪。洛龙山冬天最低气温可以跌到零下二十五度，大雪封山时公路时常中断；雅利基卢克是全岛面积最大、人口最少的城市，尼尔萨利特的牧民随季节迁徙，流动诊所看不了的病人也要靠这条「空中通道」转运，冬季它格外忙碌。医院的指示牌用中文、维京语和巴克汉姆语三种文字书写，问诊台的护士大多能说其中两种。首府一月白天最高气温只在一度上下，冬天的急诊室里，滑倒摔伤的病人比平时多出好几倍。\n医院大厅里放着一架钢琴，每天中午由志愿者弹奏半小时，来复诊的老人们常常提前到，坐在长椅上一边等号一边听。志愿者里有退休的教师，也有北维京岛大学医学院的学生，有人说在这里练琴比在琴房里还紧张，因为听众里总坐着几位刚做完手术、对节拍格外挑剔的老教授。"
      en: "The territory's central hospital, in Birchwood District of Freedom City, on a campus about 400 m long and 300 m wide. It trains doctors with the University of North Viking Island and handles the most difficult and critical cases from the whole island. Birchwood is the capital's administrative and cultural heart and the university's main campus is close by, so medical students shuttle between the two for lectures and placements; together the hospital and university make civil servants, teachers and health workers the backbone of employment in the capital. Difficult cases from across the island are referred here, and emergency patients from remote mountain areas such as Lorond Mountain and Jaalikiluk are often flown by helicopter to the pad on the hospital roof. Winter lows in Lorond Mountain can fall to minus 25 degrees and heavy snow often cuts the roads; Jaalikiluk is the largest and least populated city on the island, the herders of Nirsaliit move with the seasons, and patients the mobile clinics cannot treat also travel by this \"air corridor\", which is especially busy in winter. The hospital's signs are in Chinese, Viking and Buckham, and most nurses at the reception desks speak two of the three. January daytime highs in the capital hover around one degree, and in winter the emergency department sees several times more people hurt in falls on the ice than usual.\nIn the main hall stands a piano, played for half an hour each noon by volunteers, and older patients coming for follow-up appointments often arrive early to listen from the benches while they wait their turn. The volunteers include retired teachers and students from the university's medical school, and some say playing here is more nerve-racking than in a practice room, because the audience always includes a few elderly professors fresh from surgery with very particular ideas about tempo."

  - id: poi_xv5v45
    subtype: stadium
    status: generated
    names:
      zh: 自由市体育中心
      en: Freedom City Sports Centre
      art-x-viking: Sportzentrum Freistad
      art-x-buckham: Centro Sportivo di Frei
    in: div_16cxr8
    offset_km: [0.08, -2.83]
    site: { size_m: [330, 260], layout: stadium }
    notes:
      zh: "自由市体育中心是首府的综合体育中心，在白桦区，有田径场、游泳馆和一座室内冰场，占地约 0.09 平方公里，领地运动会的开幕式和大部分比赛都在这里举行。白桦区是自由市的行政与文化核心，领地政府、议会综合办公区和北维京岛大学都在附近，体育中心平日是公务员、教师和学生下班后锻炼的地方，傍晚的跑道上常能看到刚脱下西装的人在慢跑。区内道路按棋盘格规划，主干道两旁种着成排的白桦，体育中心周围也围着一圈白桦林，秋天叶子黄了，田径场像镶了一道金边。首府一月白天的最高气温只在一度上下，游泳馆和冰场是冬天最热闹的地方，学校的游泳课和滑冰课都排在这里。\n领地运动会开幕时，各市代表队举着市旗依次入场：自由市的竖三色旗、维京港的北欧十字旗、贝克勒的镜岛倒影旗，看台上的观众认旗喊城，喊得最响的往往是维京港和贝克勒的球迷，两边隔着整座看台对唱。冬天冰场是业余冰球联赛的主场，政务院各部门、机关和学校各有球队，赛后输球的一队要请对手喝热巧克力；据说有一年两支部门球队连赛三场都是平局，最后只好各自请对方喝了一杯。"
      en: "Freedom City Sports Centre is the capital's multi-sport complex, in Birchwood District, with an athletics stadium, a swimming hall and an indoor ice rink on a site of about 0.09 km²; the opening ceremony and most events of the territorial games are held here. Birchwood is Freedom City's centre of government and culture, with the territorial government, the Parliament Complex and the University of North Viking Island nearby, so on ordinary days the sports centre is where civil servants, teachers and students work out after hours, and in the evenings people who have just taken off their suits can often be seen jogging round the track. The district's streets are laid out on a grid with rows of birches along the main roads, and a ring of birch wood surrounds the sports centre too; in autumn, when the leaves turn, the stadium looks as if it has a gilded frame. In January the capital's afternoons barely reach 1 °C, so the pool and the rink are the busiest places in winter, and the schools hold their swimming and skating lessons here.\nWhen the territorial games open, each city's team marches in behind its flag: Freedom City's vertical tricolour, Viking Port's Nordic cross, Beckerle's reflection of Mirror Isle. The crowd recognises each flag and roars the city's name, and the loudest are usually the Viking Port and Beckerle fans, singing back and forth at each other across the whole stadium. In winter the rink is home to the amateur ice hockey league, in which the ministries of the Executive Council, government offices and schools all field teams, and after each game the losers must buy their opponents hot chocolate; one year, it is said, two ministry teams drew three games in a row and in the end simply bought each other a cup."

  - id: bld_eewr9c
    subtype: marketplace
    status: generated
    names:
      zh: 北河市场
      en: North River Market
      art-x-viking: Nordflussmarkt
      art-x-buckham: Mercato del Rivo Nord
    in: div_b1dx32
    offset_km: [0.5, 0.3]
    site: { size_m: [140, 80], layout: market }
    notes:
      zh: "自由市最大的综合市场，在北河区北河大道边，室内是肉铺、鱼摊和面包房，室外是成排的农家摊位。周末北部牧场的农户把奶酪、黄油、酸奶和时令蔬菜运来，奶酪摊有让客人先尝后买的规矩，一圈尝下来差不多就吃饱了。冬天市场里最热闹的是热奶冻摊和热苹果酒摊，夏天傍晚北河边的露天集市也从这里开始，一直摆到河滨步道上。"
      en: "Freedom City's largest general market, on North River Avenue in North River District, with butchers, fishmongers and bakeries indoors and rows of farm stalls outside. At weekends farmers from the northern pastures bring cheese, butter, yoghurt and seasonal vegetables, and the cheese stalls let customers taste before they buy; one round of tasting is almost a meal. In winter the busiest stalls sell hot milk jelly and hot cider, and on summer evenings the open-air market along the North River starts here and spreads onto the riverside walk."

  - id: bld_yn4gzk
    subtype: marketplace
    status: generated
    names:
      zh: 沙洲老渔市
      en: Sandbar Old Fish Market
      art-x-viking: Alter Fischmarkt Sandbank
      art-x-buckham: Vecchio Mercato del Pesce di Banco Sabbia
    notes:
      zh: "河口老港区的鱼市，沙洲区最早的街巷围绕它形成。鱼市最有名的是鳕鱼浓汤，冬天排队买汤的人一直排到钟楼脚下。清晨的拍卖还沿用老规矩，拍卖师摇一只铜铃开场，渔民和饭馆老板举手叫价，整箱的鳕鱼几分钟就换了主人。"
      en: "The fish market of the old river-mouth harbour; the first lanes of Sandbar District grew around it. The market is best known for its thick cod soup, and on winter days the queue for it stretches to the foot of the clock tower. The dawn auction keeps the old ways: the auctioneer opens with a brass bell, fishermen and restaurant owners bid by raising a hand, and whole boxes of cod change hands in minutes."
    in: div_g4a8q0
    offset_km: [0.3, 0.2]
    site: { size_m: [160, 90], layout: market }

  - id: bld_q4f5ec
    subtype: tower
    status: generated
    names:
      zh: 沙洲钟楼
      en: Sandbar Clock Tower
      art-x-viking: Uhrturm Sandbank
      art-x-buckham: Torre dell'Orologio di Banco Sabbia
    in: div_g4a8q0
    offset_km: [-0.25, 0.15]
    site: { size_m: [60, 60], layout: tower }
    notes:
      zh: "自由市沙洲区老渔市旁的钟楼，是首府港区的地标，塔基约 60 米见方。沙洲区是自由河入海口的冲积沙洲，也是自由市唯一临海的区：沙洲港承担首府的散货、建材与燃料进口，维西磁悬浮在沙洲站停靠，使这里成为铁路与海运的交汇点。区里最古老的地方是沙洲老渔市，木构的鱼棚沿码头排开，清晨渔船靠岸后就开始叫卖鳕鱼、鲱鱼和贝类，钟楼就立在老渔市旁。渔港比首府更早存在，这里维京语和中文并用的家庭比例明显高于城区，港口工人、渔民和物流从业者构成了社区的主体。钟声曾为出海的渔民报时，清晨第一声钟响，渔船就解缆出港，如今钟楼每个整点仍会敲响。钟楼的顶层对游客开放，从这里能看到自由河入海口的沙洲、湿地和远处的海面，建在河口沙丘上的沙洲公园也尽收眼底，春秋两季能看见候鸟成群落在滩涂上。沙洲人口只有约六万，是全市密度最低的区，周末常有首府居民来这里吃海鲜、看日落。\n冬天老渔市卖鳕鱼浓汤的摊位前，排队的人常常一直排到钟楼脚下，等汤的人就数着钟声估算还要等多久。老渔民说，听惯了这口钟的人出海再远也不会迷路，因为梦里都在数它；首府的年轻人则爱在跨年夜聚到钟楼下，等第一声钟响时一起把手里的热汤举过头顶。"
      en: "A clock tower beside the old fish market in Sandbar District of Freedom City and the landmark of the capital's harbour quarter, on a base about 60 m square. Sandbar is the alluvial bar at the mouth of the Freedom River and the city's only coastal district: Sandbar Port handles the capital's imports of bulk goods, building materials and fuel, and the Viking Port–Northwest Maglev stops at Sandbar Station, making this the meeting point of rail and sea. The oldest part of the district is the Sandbar Old Fish Market, where timber fish sheds line the quay and cod, herring and shellfish are cried for sale as soon as the boats come in at dawn; the clock tower stands beside it. The fishing port is older than the capital, and more families here use both Viking and Chinese than in the city proper; port workers, fishermen and logistics staff make up most of the community. The bell once told the time for fishermen going to sea, the boats casting off at the first stroke in the morning, and it still strikes every hour. The top floor is open to visitors, with views over the sandbars, wetlands and open sea at the mouth of the Freedom River and down onto Sandbar Park on the estuary dunes, where in spring and autumn flocks of migrating birds can be seen settling on the mudflats. Sandbar has only about 60,000 people and is the least densely populated district in the city, and at weekends people from the capital often come here to eat seafood and watch the sunset.\nIn winter the queue at the cod chowder stalls of the old market often stretches to the foot of the tower, and those waiting count the strokes of the bell to work out how much longer it will be. Old fishermen say anyone used to this bell will never get lost however far out they sail, because they count it even in their dreams; the capital's young people like to gather beneath the tower on New Year's Eve and raise their cups of hot chowder overhead together at the first stroke."

  - id: poi_mecb4f
    subtype: park
    status: generated
    names:
      zh: 沙洲公园
      en: Sandbar Park
      art-x-viking: Sandbankpark
      art-x-buckham: Parco di Banco Sabbia
    in: div_g4a8q0
    offset_km: [0, -0.5]
    site: { size_m: [500, 380], layout: park }
    notes:
      zh: "沙洲公园建在自由河口的沙丘上，是自由市沙洲区最大的绿地，占地约 0.19 平方公里。沙洲区是自由河入海口的冲积沙洲，大片土地仍是湿地和沙丘，河口沙洲之间是纵横的水道，候鸟成群栖息。一条木栈道穿过沙丘和湿地通到河口，春秋两季可以看到成群的候鸟停歇，栈道边的观鸟屋里贴着本地小学生画的鸟类图鉴，每年都有新的一批画替换上去；栈道两旁种着耐盐的沙生草，春天开出一片细碎的黄花。公园离沙洲港和沙洲老渔市都不远，从栈道尽头回望，能看到港里的吊车和老渔市旁的沙洲钟楼；维西磁悬浮的沙洲站也在区内，周末常有首府居民坐车过来，在公园走一圈，再去吃海鲜、看日落。\n退潮时孩子们在滩上捡贝壳、追螃蟹，涨潮前公园管理员会吹哨提醒大家回到栈道上。傍晚首府的居民常在这里散步看日落，再到附近的老渔市吃一碗鳕鱼汤；冬天排队买汤的人一直排到钟楼脚下，等汤的人就数着钟楼的整点钟声估算还要等多久。观鸟屋里放着一本留言簿，来访的人在上面记下当天看到的鸟，有个小学生连续三年写下同一句「今天又没看到白鹤」，后来终于有一天，他在下面补了一行大字：「看到了！」"
      en: "Sandbar Park is built on the dunes at the mouth of the Freedom River and is the largest green space in Sandbar District of Freedom City, covering about 0.19 km². The district is the alluvial sandbar at the river mouth, much of it still wetland and dunes, and between the sandbars runs a maze of channels where migrating birds gather in flocks. A wooden boardwalk crosses the dunes and wetlands to the river mouth, where great flocks of migrants stop to rest in spring and autumn, and the birdwatching hut beside it is papered with a bird guide drawn by local primary pupils, replaced by a new batch every year; salt-tolerant dune grasses line the boardwalk and flower in a haze of tiny yellow blooms in spring. The park is close to Sandbar Port and the Sandbar Old Fish Market, and from the end of the boardwalk you can look back at the port's cranes and the Sandbar Clock Tower beside the old market; Sandbar Station on the Viking Port–Northwest Maglev is in the district too, and at weekends people from the capital often come out by train for a walk round the park, then seafood and the sunset.\nAt low tide children collect shells and chase crabs on the flats, and before the tide turns the park warden blows a whistle to call everyone back onto the boardwalk. In the evening people from the capital stroll here to watch the sunset and then go to the old fish market nearby for a bowl of cod soup; in winter the queue for soup reaches the foot of the clock tower, and those waiting count the hourly chimes to work out how long they have left. The birdwatching hut keeps a visitors' book where people note the birds they saw that day. One primary pupil wrote the same line three years running, \"Didn't see the white crane again today\", until one day he added underneath in large letters: \"Saw it!\""

  # ── 交通设施（M8）──
  - id: poi_g4z5j4
    subtype: airport
    status: generated
    names:
      zh: 维京港国际机场
      en: Viking Port International Airport
      art-x-viking: Internationaler Flughafen Veiling Havn
      art-x-buckham: Aeroporto Internazionale di Veiling Porto
    notes:
      zh: "维京港国际机场是领地最繁忙的机场，位于维京港市瓦尔维克区城区以东、鲸湾北面的平原上，占地约 6.3 平方公里，有两条平行跑道。机场是飞往维京群岛和远方的主要门户，到维京群岛、首府和岛内各市的航班从清晨排到深夜，国际航线的旅客也大多从这里进出领地。维京港地铁 2 号线以维京港国际机场站为终点，列车经维京港站进城，在那里可以换乘维西磁悬浮、维贝真空磁悬浮和通往长船的维长真空磁悬浮，到隆迪纳亚湾路站还能换乘地铁 1 号线；从机场乘地铁进城，再去格约特斯塔德老城也只是一程路。瓦尔维克是领地最大的港区，机场与鲸湾港、外礁深水港相距不远，许多旅客在降落前就能从舷窗里看到港里成排的岸桥。\n到达大厅里挂着一面巨大的维京港市旗，下面写着一句维京语的欢迎词，大意是「到老港了，把雨衣穿上」。维京港一年降水将近一千九百毫米，这句话说的是实话，本地人更习惯一件连帽防水外套走遍全城，机场的纪念品店里卖得最好的也正是印着港口图案的雨衣。许多旅客下飞机后的第一顿饭，就是格约特斯塔德老城里的熏鲱鱼和鱼丸汤；常飞的商务客则说，出了到达口闻到海风里的鱼腥味，才算真的回到了老港。"
      en: "Viking Port International Airport is the busiest airport in the territory. It lies on the plain east of the town in Walvik District of Viking Port, north of Walvik bay, covering about 6.3 km² with two parallel runways. It is the main gateway to the Viking Islands and further afield: flights to the Viking Islands, the capital and the island's other cities run from early morning until late at night, and most international travellers enter and leave the territory here. Viking Port Metro Line 2 ends at Viking Port International Airport station, and its trains run into town via Viking Port Station, where passengers can change to the Viking Port–Northwest Maglev, the Viking Port–Beckerle Vacuum Maglev and the Viking Port–Longship Vacuum Maglev, and at Rondinaia Bay Road to Metro Line 1; from the airport into town by metro, the old town of Grjotstad is only one more hop away. Walvik is the territory's largest port district, the airport is not far from Walvik Harbour and the Outer Skerry Deep-Water Port, and many passengers can see the rows of container cranes from the window before landing.\nA huge Viking Port city flag hangs in the arrivals hall above a welcome in Viking that roughly means \"You're in the old port: put your raincoat on\". With close to 1,900 mm of rain a year, it is simply the truth; locals prefer a hooded waterproof jacket for getting around town, and the best-selling item in the airport souvenir shop is a raincoat printed with the harbour. For many travellers, their first meal after landing is smoked herring and fish-ball soup in the old town of Grjotstad, and frequent business flyers say they only feel truly back in the old port once they walk out of arrivals and smell the fish on the sea wind."
    in: div_z29w6h
    offset_km: [7, 0]
    site: { size_m: [4200, 1500], layout: airport, angle_deg: 90 }

  - id: poi_3tcbx9
    subtype: airport
    status: generated
    names:
      zh: 自由市机场
      en: Freedom City Airport
      art-x-viking: Flughafen Freistad
      art-x-buckham: Aeroporto di Frei
    notes:
      zh: "自由市机场是首府的机场，在白桦区南郊、两河之间的台地边缘，航线以岛内为主，主要飞往维京港、天城和马斯林山。首府的机场不大，自由市地铁 2 号线以自由市机场站为终点，列车经海燕、松林、昆明大道等站进城，在自由市站与维西磁悬浮和自勒高速铁路换乘，从下飞机到坐上地铁通常不用十分钟。乘客多是到首府开会、办事的公务员和商务客，周一早晨和周五傍晚的航班最满，领地议会开会的那几周更是一票难求。地铁 2 号线全长约 11.8 公里，和自由市的其他地铁一样采用全自动无人驾驶列车，机场的旅客常说，进城的路上唯一需要排队的地方是站台上的咖啡车。\n首府一月白天的最高气温只在一度上下，雪一下就是好几天。冬天跑道和自行车道一样被优先清扫，扫雪车先清这两样，再清汽车道，自由市人笑说在这里「飞机和自行车享受同等待遇」。到达口外停着一排公共自行车，不少本地人下了飞机直接骑车回家，行李绑在后座上。每届领地议会开幕前，到达口常能看到从各市飞来的新议员，有人怀里抱着一棵从家乡带来的小白桦，准备种进白桦区的议员林；机场的工作人员见得多了，会主动递上一只装树苗的纸袋。"
      en: "Freedom City Airport serves the capital. It lies on the southern outskirts of Birchwood District, at the edge of the terrace between the two rivers, and mostly handles flights within the island, chiefly to Viking Port, Skytown and Maslin Mountain. The capital's airport is not large. Freedom City Metro Line 2 ends at Freedom City Airport station, and its trains run into town via Petrel, Pinewood, Kunming Avenue and other stops, connecting at Freedom City Station with the Viking Port–Northwest Maglev and the Freedom City–Lekor High-Speed Railway; it usually takes less than ten minutes to get from the plane onto the metro. Passengers are mostly civil servants and business travellers coming to the capital for meetings and errands. Monday-morning and Friday-evening flights are the fullest, and during the weeks when the territorial parliament sits, seats are hard to come by. Line 2 is about 11.8 km long and, like the rest of the Freedom City Metro, runs fully driverless trains; airport passengers say the only queue on the way into town is at the coffee trolley on the platform.\nIn January the capital's afternoons barely reach 1 °C, and once the snow starts it can fall for days. In winter the runways are cleared first, just like the cycle paths, before the snowploughs move on to the roads, and Freedom City people joke that here \"planes and bicycles get equal treatment\". A row of public bicycles stands outside arrivals, and plenty of locals step off the plane and cycle home with their luggage strapped to the rack. Before each new territorial parliament opens, newly elected members flying in from the other cities are a common sight at arrivals, some cradling a birch sapling brought from home to plant in the Members' Wood in Birchwood; the airport staff have seen it so often that they hand out paper bags for the saplings without being asked."
    in: div_16cxr8
    offset_km: [2.64, -4.24]
    site: { size_m: [3600, 1300], layout: airport, angle_deg: 15 }

  - id: poi_t9eq1p
    subtype: airport
    status: generated
    names:
      zh: 卡波国际机场
      en: Capo International Airport
      art-x-viking: Internationaler Flughafen Kap
      art-x-buckham: Aeroporto Internazionale di Capo
    notes:
      zh: "卡波国际机场是贝克勒自由贸易区的国际机场，在卡波区卡波角一带，占地约 5.6 平方公里，是卡波区海陆空联运的空港。卡波在巴克汉姆语里意为「海角」，机场是北维京岛最繁忙的国际航空货运机场，货运航班把电子产品、精密仪器、生鲜食品和快递包裹运往世界各地；机场旁的海关监管区实行「一次申报、一次查验」，货物可以在海运、陆运和空运之间快速转运。客运航站楼是外国商务旅客进入贝克勒的主要门户，航空物流、货运代理、飞机维修和机场服务是全区最大的产业，许多国际物流公司在这里设立区域枢纽。南岸公路从区内穿过，西接萨科，东通斯佩基亚拉和保税港区；附近的贝克勒国际医院也常接待从机场直接送来的外籍病人。\n到达大厅的地面上嵌着一排金色铜钉，标出自贸区的海关线，第一次来的人常在铜钉两边各拍一张照片。航站楼里的免税店从清晨开到午夜，周末来购物的岛民和过境旅客挤在同一条长队里，咖啡、巧克力和电器是购物袋里最常见的东西。卡波角上的灯塔和海崖步道是看飞机的好地方，傍晚常有人带着望远镜坐在崖边，一边看卡波湾里的船，一边数头顶降落的货机；本地孩子能凭机尾的颜色说出每架飞机是从哪里飞来的。"
      en: "Capo International Airport is the international airport of the Beckerle Free Trade Zone, out by Cape Capo in Capo District, covering about 5.6 km², and the air hub of the district's sea–land–air transfers. Capo means \"cape\" in Buckham. It is the busiest international air cargo airport on North Viking Island, with freighters carrying electronics, precision instruments, fresh food and express parcels all over the world; the customs supervision zone beside the airport works on a \"one declaration, one inspection\" basis, so goods can switch quickly between sea, road and air. The passenger terminal is the main gateway for foreign business travellers coming to Beckerle, and air logistics, freight forwarding, aircraft maintenance and airport services are the district's largest industries, with many international logistics firms keeping regional hubs here. The South Coast Highway passes through the district, west to Sako and east to Specchiara and the Bonded Port Zone, and the nearby Beckerle International Hospital often receives foreign patients brought straight from the airport.\nA row of gold-coloured brass studs set in the floor of the arrivals hall marks the free trade zone's customs line, and first-time visitors like to take a photo on each side. The terminal's duty-free shops are open from early morning until midnight, and at weekends islanders on a shopping trip and transit passengers squeeze into the same long queues, coffee, chocolate and electrical goods the commonest things in their bags. The lighthouse and cliff path on Cape Capo are a good place for plane-spotting; in the evenings people sit on the cliff edge with binoculars, watching the ships in Capo Bay and counting the freighters coming in overhead, and local children can tell where each plane has come from by the colours on its tail."
    in: div_e6pc44
    offset_km: [5.66, 2]
    site: { size_m: [4000, 1400], layout: airport, angle_deg: 90 }

  - id: poi_1f5czt
    subtype: airport
    status: generated
    names:
      zh: 西北机场
      en: Northwest Airport
      art-x-viking: Flughafen Nordwest
      art-x-buckham: Aeroporto di Nordveste
    in: div_zs7kjk
    offset_km: [-4.97, -0.51]
    site: { size_m: [3400, 1200], layout: airport, angle_deg: 105 }
    notes:
      zh: "西北市的机场，在鹿鸣区西郊，场区约 3400 米长、1200 米宽，以岛内航线为主，有航班通往维京港、自由市、天城和维京群岛，旅客里科研人员和航天工程师占了很大一部分。西北市是北维京岛的科研与教育中心，北维京大学、林道理工学院和众多国家实验室、研究所分布在科学大道两侧，深空太空军北维京研发中心和科学城的航天企业与马斯林山的发射场、测控站紧密合作，研究人员往来频繁，机场也因此成了全岛「最有学问」的机场。地铁2号线以西北机场站为终点，这条全长 20.7 公里的线路穿过整个鹿鸣区，把机场与鹿鸣大道、西北市人民政府一带的市中心连在一起；西岸公路也从区内经过，南下菲尔内斯和维京港。航站楼里的指示牌和广播用中文、维京语和巴克汉姆语三种语言，学期开始和结束时，背着行李来往的国际学生和访问学者挤满了候机厅。行李转盘上常能看到贴着「精密仪器，轻拿轻放」的木箱，机场为此专门开了一条仪器托运通道，由受过训练的搬运员手工装卸。\n候机厅的墙上挂着一幅巨大的北维京岛冬季星图，是望星天文台送的礼物，等飞机的孩子们喜欢在星图上找自己的星座。航班因风雪延误时，常有等机的天文学家主动站到星图前给大家讲解，机场的工作人员说，延误的乘客反倒比准点的乘客更舍不得走。"
      en: "Northwest City's airport, on the western edge of Deersong District, on a site about 3400 m long and 1200 m wide. It serves mainly domestic routes, with flights to Viking Port, Freedom City, Skytown and the Viking Islands, and researchers and aerospace engineers make up a large share of its passengers. Northwest is North Viking Island's centre of research and education: the University of North Viking, the Woodway Institute of Technology and many national laboratories and institutes line Science Avenue, and the Deep Space Force North Viking Research and Development Centre and the aerospace firms of Science City work closely with the launch site and tracking stations at Maslin Mountain, so researchers come and go constantly and the airport has become the island's \"most learned\". Metro Line 2 terminates at Northwest Airport station; the 20.7 km line crosses the whole of Deersong, linking the airport with the city centre around Deersong Avenue and the Northwest City Government, and the West Coast Highway also runs through the district, south to Fyrnes and Viking Port. Signs and announcements in the terminal are in Chinese, Viking and Buckham, and at the start and end of term the departure halls fill with international students and visiting scholars with their luggage. Wooden crates labelled \"Precision instruments, handle with care\" are a common sight on the baggage carousels, and the airport has opened a dedicated instrument handling channel where trained porters load and unload them by hand.\nOn the departure hall wall hangs a huge winter star chart of North Viking Island, a gift from the Stargaze Observatory, and waiting children love to find their own constellations on it. When flights are delayed by snow, an astronomer waiting for the same plane will often step up to the chart and give an impromptu talk, and airport staff say delayed passengers are more reluctant to leave than punctual ones."

  - id: poi_0efptf
    subtype: airport
    status: generated
    names:
      zh: 天城机场
      en: Skytown Airport
      art-x-viking: Flughafen Himmelstad
      art-x-buckham: Aeroporto di Cielo
    notes:
      zh: "服务天城度假区的机场，在天城市天台区北部，场区约 3000 米长、1100 米宽。天城是北维京岛东南海岸的度假城市，以天台山、柳萨湾和绵长的沙滩闻名，夏季航班和客轮络绎不绝，天城机场和天城港一起把游客从维京港、维京群岛和远方带到这里；自由市和西北市也都有航班飞来。到港的旅客里，夏天是度假的家庭和来银滩游泳、冲浪的年轻人，秋冬则多是来天台国际会议中心开会的代表和来岚山区泡温泉、疗养的老人。许多退休人员从全岛各地移居天城，他们的子女逢年过节坐飞机来探望，春节和夏至前后是机场最忙的时候。机场背靠天台山，跑道离海不远，环北维京岛高速和东岸公路从附近经过，出了航站楼就能坐车去海边的酒店。天城是全岛最湿的城市，一年降水接近两千三百毫米，降落前飞机常常要穿过天台山上翻滚的云雾，晴天时旅客能从舷窗里看到柳萨湾上的彩虹。\n行李提取处摆着一排免费借用的公共雨伞，伞柄上刻着「天城」二字，是旅客踏进天城领到的第一件东西，在城里任何一个伞架都能归还。离港时，安检口旁的回收架上总插满了旅客还回来的伞，也总有一些伞被悄悄带上了飞机，市政府干脆每年多订几千把。"
      en: "The airport serving Skytown's resorts, in the north of Sky Terrace District in Skytown City, on a site about 3000 m long and 1100 m wide. Skytown is the resort city of North Viking Island's south-east coast, famous for Sky Terrace Mountain, Ljosa Bay and its long beaches, and in summer flights and ships come and go constantly, Skytown Airport and Skytown Harbour together bringing visitors from Viking Port, the Viking Islands and further afield; Freedom City and Northwest also have flights here. In summer arriving passengers are holidaying families and young people coming to swim and surf at Silver Beach; in autumn and winter they are mostly delegates to the Sky Terrace International Convention Centre and older people coming for the hot springs and spa cures at Mist Hill. Many retirees have moved to Skytown from all over the island, their children fly in to visit at holidays, and the Spring Festival and midsummer are the airport's busiest times. The airport sits with Sky Terrace Mountain at its back and its runway not far from the sea, the North Viking Island Ring Expressway and the East Coast Highway pass close by, and from the terminal it is a short ride to the seafront hotels. Skytown is the wettest city on the island, with nearly 2300 mm of rain a year; before landing, aircraft often have to descend through the clouds rolling over Sky Terrace Mountain, and on clear days passengers can see a rainbow over Ljosa Bay from the window.\nAt baggage reclaim stands a row of free public umbrellas, their handles carved with the name \"Skytown\", the first thing a traveller is handed on arriving, and they can be returned to any stand in the city. At departure the return rack by security is always full of umbrellas handed back, and some always slip quietly onto the plane, so the city government simply orders several thousand extra every year."
    in: div_w1ea18
    offset_km: [-15.5, 3.98]
    site: { size_m: [3000, 1100], layout: airport, angle_deg: 45 }

  - id: poi_h1vjx3
    subtype: airport
    status: generated
    names:
      zh: 新城机场
      en: New City Airport
      art-x-viking: Flughafen Neustad
      art-x-buckham: Aeroporto di Neu Teatu
    in: div_hyxnpg
    offset_km: [2.64, 4.24]
    site: { size_m: [3400, 1200], layout: airport, angle_deg: 135 }
    notes:
      zh: "新城机场是新城市的机场，在南驿区南部，紧挨着南驿物流园，占地约 4 平方公里。客运以岛内航线为主，有航班通往维京港、自由市、西北市和维京群岛；货运则为萨科勒、贝克勒一带的工厂运送电子元件和零配件，是本岛南部的航空货运站。一条约 8.3 公里长的新城机场公路把机场与南驿区城区相连，新城地铁 2 号线以新城机场站为终点，经南驿物流园站等站进城。南驿区是新城与萨科勒、贝克勒之间的通勤和物流走廊，仓储、配送和电商分拣中心围着机场排开，夜里货车和货机进出不停，新城人说「南驿区的灯从来不关」。航站楼按新城的规划风格建造，白墙、木顶、大玻璃窗，晴天时可以从候机厅望见北面的洛龙山脉。\n早班机上多是去维京港和自由市开会的年轻上班族，机场咖啡馆因此天不亮就开门，招牌是一种夹着勒克尔奶酪的热三明治，熟客进门只要比个手势，店员就知道要几份。新城是全岛最年轻的城市之一，候机厅里推着婴儿车的旅客格外多，机场干脆在登机口旁辟出一块铺着软垫的游戏角。货运区的工人则有自己的作息：天亮前最后一批零件装上货机，他们才下班去吃早饭，正好和赶早班机的上班族在咖啡馆里擦肩而过。"
      en: "New City Airport serves New City from the south of South Post District, right next to the South Post Logistics Park, and covers about 4 km². Passenger traffic is mostly within the island, with flights to Viking Port, Freedom City, Northwest City and the Viking Islands, while its cargo flights carry electronic components and parts for the factories around Sakole and Beckerle, making it the air freight station for the south of the island. The New City Airport Road, about 8.3 km long, links the airport with the town of South Post, and New City Metro Line 2 ends at New City Airport station, running into town via South Post Logistics Park and other stops. South Post is the commuter and logistics corridor between New City and Sakole and Beckerle; warehouses, distribution centres and e-commerce sorting hubs ring the airport, lorries and freighters come and go all night, and New City people say \"the lights in South Post never go off\". The terminal is built in New City's planned style, with white walls, a timber roof and large windows, and on clear days you can see the Lorond Mountains to the north from the departure lounge.\nThe early flights are full of young office workers heading to meetings in Viking Port and Freedom City, so the airport café opens before dawn; its speciality is a hot sandwich filled with Lekor cheese, and regulars only need to hold up their fingers for the staff to know how many. New City is one of the youngest cities on the island, and there are so many passengers with prams that the airport has set aside a padded play corner next to the gates. The cargo workers keep their own hours: once the last load of parts is aboard the freighters before daybreak, they knock off for breakfast, passing the early-flight commuters in the café on their way out."

  - id: poi_dcr8j7
    subtype: spaceport
    status: canon
    names:
      zh: 维京-马斯林山发射与降落中心
      en: Viking–Maslin Mountain Launch and Landing Centre
      art-x-viking: Start- und Landezentrum Veiling-Maslinberg
      art-x-buckham: Centro di Lancio e Atterraggio Veiling-Maslin Tehee
    wonder:
      zh: 世界最大的航天发射场，有三座发射台和两座垂直降落台
      en: The largest spaceport in the world, with three launch pads and two vertical landing pads
    notes:
      zh: "维京-马斯林山发射与降落中心是世界上最大的航天发射场，在马斯林山市西坪区的高原台地上，场区约 7 公里长、3.5 公里宽，占地约 24.5 平方公里，有三座发射台、两座垂直降落台和一条航天飞机跑道。火箭从这里升空，把卫星和飞船送入轨道；可重复使用的飞船和助推器返回时也在这里垂直降落，整修后再次出发；航天飞机跑道供有翼的航天飞机滑翔返回，雪谷空天飞机基地的空天飞机需要大修时，也经公路送到西坪的飞船整修厂。中心由深空太空军管理，与星港区的星港指挥中心、星港深空测控站一起，构成北维京岛航天活动的核心。\n西坪区是马斯林山西部的高原台地，约 2.5 万人，劳动年龄人口占八成，发射中心周围是由火箭总装、推进剂、飞船整修和风洞组成的航天产业区：西坪火箭总装厂把来自西北市科学城和全岛各地的部件组装成火箭，西坪推进剂厂生产液氧、液氢和甲烷燃料，西坪飞船整修厂检修回收的飞船，西坪风洞群为飞行器做气动试验；台地边缘还有西坪量子通信站和西坪防空阵地。大型箭体和发动机从东营区的马斯林河口港上岸，夜里经马斯林山航天高速铁路的专用线直接送进西坪的工厂；马斯林山高速也从西坪出发，经城区通往天城。发射场的职工大多住在台地上的新住宅区，航天高速铁路开通后，西坪与城区之间形成了半小时通勤圈，西坪人口随之快速增长。\n发射日的流程从前一天开始：火箭在总装厂里竖起，沿轨道慢慢推到发射台，加注推进剂，倒计时由星港指挥中心统一下达。三座发射台排成一线，降落台离发射台有一段安全距离，助推器返回时先在高空点火减速，再竖直落到降落台上。每逢发射日，台地上空的火箭尾焰在数十公里外都能看到，西坪站和马斯林山高速上挤满来观看的人。\n每有火箭升空，马斯林山的学校停课一小时，全城人站在街边仰头看火箭拖着白烟划过三面雪峰；和平区的面包店前一天就开始卖火箭形状的奶油面包。飞船回到降落台时，深空太空军按惯例在指挥中心门口敲响一口铜钟，钟声一响，附近的居民就知道「有人回家了」。发射中心的工程师说，最紧张的不是升空，而是降落前的最后几秒，等助推器稳稳立在降落台上，控制室里才会响起第一阵掌声。"
      en: "The Viking–Maslin Mountain Launch and Landing Centre is the largest spaceport in the world, on the high plateau of West Heath District in Maslin Mountain City. Its site is about 7 km long and 3.5 km wide, some 24.5 km², with three launch pads, two vertical landing pads and a space shuttle runway. Rockets rise from here to put satellites and spacecraft into orbit, and reusable spacecraft and boosters also land vertically here on their return, to be refurbished and fly again; the shuttle runway takes winged shuttles gliding home, and when the spaceplanes of the Snow Valley Spaceplane Base need an overhaul they too come by road to the West Heath Spacecraft Refurbishment Plant. The centre is run by the Deep Space Force and, together with the Starport Command Centre and Starport Deep Space Station in Starport District, forms the core of North Viking Island's space activity.\nWest Heath District is a plateau in the west of Maslin Mountain with about 25,000 people, eight in ten of working age, and the launch centre is surrounded by a space industry zone of rocket assembly, propellant, spacecraft refurbishment and wind tunnels. The West Heath Rocket Assembly Plant builds rockets from parts made in Science City in Northwest and across the island, the West Heath Propellant Plant produces liquid oxygen, liquid hydrogen and methane, the West Heath Spacecraft Refurbishment Plant overhauls recovered spacecraft, and the West Heath Wind Tunnels test vehicles' aerodynamics; on the edge of the plateau stand the West Heath Quantum Station and the West Heath Air Defence Site. Large rocket stages and engines come ashore at the Maslin Mouth Port in East Camp District and travel at night along the sidings of the Maslin Mountain Aerospace High-Speed Railway straight into the West Heath plants; the Maslin Expressway also starts at West Heath and runs through the city to Skytown. Most of the launch site's staff live in new housing on the plateau, and since the aerospace railway opened West Heath has been within half an hour of the city centre, and its population has grown fast.\nA launch begins the day before: the rocket is raised in the assembly plant, rolled slowly along rails to the pad and fuelled, and the countdown is given by the Starport Command Centre. The three launch pads stand in a line, with the landing pads at a safe distance from them; returning boosters fire their engines high up to slow down, then settle upright on the landing pad. On launch days the rocket's exhaust can be seen tens of kilometres away above the plateau, and West Heath station and the Maslin Expressway fill with spectators.\nWhenever a rocket goes up, Maslin Mountain's schools stop for an hour and the whole town stands in the street to watch it trail white smoke across the snow peaks on three sides; the bakeries of Peace District start selling rocket-shaped cream buns the day before. When a spacecraft comes back to the landing pad, the Deep Space Force by custom rings a bronze bell at the door of the command centre, and at its sound people nearby know that \"someone has come home\". The centre's engineers say the most nerve-racking moment is not lift-off but the last few seconds before landing: only when the booster is standing firmly on the pad does the first applause break out in the control room."
    in: div_nwke3f
    offset_km: [4.0, 0.0]
    site: { size_m: [7000, 3500], layout: spaceport, angle_deg: 60 }

  - id: poi_pa6hny
    subtype: spaceport
    status: generated
    names:
      zh: 星港
      en: Starport
      art-x-viking: Sternhafen
      art-x-buckham: Porto Stella
    notes:
      zh: "星港是马斯林山市星港区的航天港，建在蒂鲁基卢克河的河口，占地约 2 平方公里，拥有发射工位和着陆场，星港区就因这座航天港得名。蒂鲁基卢克河全长二十六公里，全程都在星港区内；发射台朝东面向大海，火箭升空后很快飞过海面，残骸落进无人的海域。航天港周围是领地航天活动的中枢：星港指挥中心全天候指挥发射、在轨飞行和深空探测任务，星港深空测控站的大口径天线追踪着飞往月球和行星际空间的探测器，南面群峰脚下的星港发动机试车台为每台新发动机点火考核。一条约 3.8 公里长的星港公路把航天港与星港区城区相连，雪谷公路的终点也在区内；星港航天博物馆是区里唯一常年向公众开放的设施，每逢发射日都挤满了游客和航天爱好者。\n发射前一天和平区的面包店就开始卖火箭形状的奶油面包，发射当天海滨的观礼台上坐满了从全岛赶来的人，有人提前一晚就裹着睡袋占座。倒计时最后十秒，观礼台上的人会一起大声数数，火箭离开发射台时，欢呼声和轰鸣声一起滚过海面。飞船回到着陆场后，深空太空军按惯例在指挥中心门口敲响一口铜钟，博物馆门口的电子屏也会亮出一行字：「有人回家了」。"
      en: "Starport is the spaceport of Starport District in Maslin Mountain City, built at the mouth of the Tirrukiluk River on a site of about 2 km² with launch pads and a landing zone, and the district takes its name from it. The Tirrukiluk River is 26 km long and lies wholly within the district. The launch pads face east over the sea, so rockets cross open water soon after lift-off and spent stages fall into empty ocean. Around the spaceport is the hub of the territory's space activity: the Starport Command Centre directs launches, missions in orbit and deep-space exploration around the clock, the large dishes of the Starport Deep Space Station track probes bound for the moon and interplanetary space, and the Starport Engine Test Stands at the foot of the peaks to the south fire every new engine before it flies. The Starport Road, about 3.8 km long, links the spaceport with the town of Starport District, and the Snow Valley Highway ends in the district; the Starport Space Museum is the only facility in the district open to the public all year, and on launch days it is packed with visitors and space enthusiasts.\nThe day before a launch, the bakeries of Peace District start selling rocket-shaped cream buns, and on launch day the viewing stands on the seafront fill with people from all over the island, some of whom have camped out in sleeping bags overnight to keep their seats. For the last ten seconds of the countdown the stands count aloud together, and as the rocket leaves the pad the cheering and the roar of its engines roll out across the sea together. When a spacecraft returns to the landing zone, the Deep Space Force rings a bronze bell outside its command centre by custom, and the screen outside the museum lights up with the words \"Someone is home\"."
    in: div_nytsvb
    offset_km: [25.8, -3.7]
    site: { size_m: [2500, 800], layout: spaceport, angle_deg: 105 }

  - id: poi_jc0fe5
    subtype: port
    status: generated
    names:
      zh: 鲸湾港
      en: Walvik Harbour
      art-x-viking: Hafen Walvik
      art-x-buckham: Porto di Baia Balena
    notes:
      zh: "鲸湾港是领地最大的港口，在维京港市瓦尔维克区，港区面积约 25 平方公里。港口自鲸湾老岸线向外填出码头前沿，再向内陆挖出四座港池；五座突堤自南向北依次为油品、散货、两座集装箱和滚装码头，油品码头的栈桥伸出防波堤外。后方是铁路编组站与物流仓库，临港带布满船舶修理厂、冷链仓库和机械与电气设备工厂。鲸湾港与湾口外的外礁深水港经鲸湾跨海大桥相连，两港合起来承担领地大部分进出口货物，港口、物流和制造业养活了瓦尔维克区的大部分家庭。维京港地铁 1 号线在港区设有鲸湾港站，港工们换班时从这里进出；面朝港口的维京港中央广场和鲸湾捕鲸站博物馆就在港区边上。\n维京港起源于鲸湾畔的捕鲸站，捕鲸站博物馆保留着旧时的砖砌炼油房和绞盘，讲述鲸湾从捕鲸站变成领地最大港口的经过。港口的夜班让瓦尔维克成了全岛少有的不夜之地，码头上的吊车灯整夜亮着，维京语的号子和对讲机的呼叫声混在一起。夏至前后，鲸湾港的船只在午夜一齐鸣笛，庆祝一年里最长的白昼，码头工人这天会带着家人来港边，孩子们坐在父亲肩上，捂着耳朵等待笛声响起。"
      en: "Walvik Harbour, in Walvik District of Viking Port, is the largest port in the territory, its port area covering about 25 km². Quay frontage was reclaimed seaward from the old Walvik shoreline and four basins were dug inland; five piers, from south to north, handle oil, dry bulk, containers (two piers) and roll-on/roll-off traffic, and the oil pier's jetty reaches beyond the breakwater. Behind lie a railway marshalling yard and logistics warehouses, and the waterfront strip is lined with ship repair yards, cold stores and machinery and electrical equipment plants. Walvik Harbour is linked to the Outer Skerry Deep-Water Port outside the bay by the Walvik Sea Bridge, and together the two handle most of the territory's imports and exports; the port, logistics and manufacturing support most of the families in Walvik District. Viking Port Metro Line 1 has a Walvik Harbour station in the port area, used by dockers changing shifts, and Viking Port Central Square, facing the harbour, and the Walvik Whaling Station Museum stand at its edge.\nViking Port began as a whaling station on Walvik bay, and the whaling station museum keeps the old brick try-works and winches and tells how Walvik grew from a whaling station into the territory's largest port. Night shifts make Walvik one of the few places on the island that never sleeps; the crane lights burn all night on the quays, and work calls in Viking mingle with the crackle of radios. Around midsummer the ships in Walvik Harbour sound their horns together at midnight to celebrate the longest day of the year, and on that night dockers bring their families to the waterfront, children perched on their fathers' shoulders with their hands over their ears, waiting for the horns."
    in: div_z29w6h
    offset_km: [-1.73, -5.86]
    site: { size_m: [8000, 4400], layout: harbour, angle_deg: 100, terminals: [oil, bulk, container, container, roro] }

  - id: poi_w5k2rt
    subtype: port
    status: generated
    names:
      zh: 外礁深水港
      en: Outer Skerry Deep-Water Port
      art-x-viking: Tiefwasserhafen Außenschären
      art-x-buckham: Porto d'Acque Profonde dello Scoglio Esterno
    notes:
      zh: "外礁深水港是鲸湾外二十多公里的礁群上填海建成的深水集装箱港，在维京港市瓦尔维克区，港区面积约 7.5 平方公里，水深可停靠最大的集装箱船。港口经鲸湾跨海大桥与鲸湾港相连，大桥长约 21.7 公里，集装箱卡车昼夜在桥上往返，把货物送进鲸湾港后方的铁路编组站和物流仓库。外礁深水港与鲸湾港合起来承担领地大部分进出口货物，远洋货轮在外礁卸下的集装箱，一部分经大桥运往岛内，一部分在码头上换装支线船，转运到维京群岛和全岛各港。礁群原是一片低矮的岩礁和浅滩，填海时先沿礁石外缘筑起防波堤，再把海底挖出的砂石填进堤内，才造出今天平整的码头。海门国际金融中心观景层的咖啡馆能一眼看到外礁深水港和跨海大桥，是维京港人带客人看港的固定一站。\n跨海大桥上开车经过时，能看到成排的岸桥像一群巨大的长颈鹿站在礁群上，维京港的孩子就把它们叫作「长颈鹿」，坐车经过时总要数一数今天有几只「长颈鹿」低着头在干活。外礁上没有居民，码头工人轮班上岛，夜班时整片礁群灯火通明，从老城远远望去像海上浮着一座小城。夏至前后鲸湾港的船只午夜鸣笛时，外礁的货轮也跟着拉响汽笛，笛声隔着二十多公里的海面传回岸上。"
      en: "The Outer Skerry Deep-Water Port is a deep-water container port built on reclaimed land on a cluster of skerries more than twenty kilometres outside Walvik bay, in Walvik District of Viking Port. Its port area covers about 7.5 km², and its water is deep enough for the largest container ships. The Walvik Sea Bridge, about 21.7 km long, connects it with Walvik Harbour, and container lorries shuttle across it day and night to the railway marshalling yard and logistics warehouses behind Walvik Harbour. Together the Outer Skerry port and Walvik Harbour handle most of the territory's imports and exports: some of the containers unloaded from ocean-going ships at the skerries cross the bridge to the island, while others are transferred on the quay to feeder vessels bound for the Viking Islands and the island's other ports. The skerries were once low rocks and shoals; breakwaters were first raised along their outer edge, then sand and gravel dredged from the seabed were packed in behind them to create today's level quays. The café on the observation floor of the Seagate International Finance Centre looks straight out at the deep-water port and the sea bridge, and is a regular stop when Viking Port people show visitors the harbour.\nDriving across the sea bridge, you see the rows of container cranes standing on the skerries like a herd of giant giraffes, and that is what Viking Port children call them; on every trip across they count how many \"giraffes\" have their heads down at work that day. Nobody lives on the skerries; the dockers come out in shifts, and on night shifts the whole cluster blazes with light, looking from the old town like a small city floating on the sea. When the ships in Walvik Harbour sound their midnight horns around midsummer, the freighters at the skerries join in, and the sound carries back to shore across more than twenty kilometres of sea."
    in: div_z29w6h
    offset_km: [-22.9, -11.8]
    site: { size_m: [5000, 1500], layout: offshore_port, angle_deg: 100, bridge_to: poi_jc0fe5 }

  - id: poi_z7m0xm
    subtype: ferry_terminal
    status: generated
    names:
      zh: 菲尔内斯客运码头
      en: Fyrnes Ferry Terminal
      art-x-viking: Fährterminal Fyrnes
      art-x-buckham: Terminal Traghetti di Capo Faro
    notes:
      zh: "客轮、邮轮与海关查验区。夏天邮轮靠港的日子，码头上的维京语乐手会用一支船歌欢迎下船的旅客。客运大厅里最受欢迎的是熏鲱鱼三明治摊，许多旅客在这里吃到了在北维京岛的第一顿饭。"
      en: "Ferries, cruise ships and customs. On summer days when cruise ships call, Viking musicians on the quay greet disembarking passengers with a sea song. The most popular stall in the terminal hall sells smoked-herring sandwiches, the first meal on North Viking Island for many travellers."
    in: div_pkfa1g
