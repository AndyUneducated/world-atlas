    site: { layout: complex, size_m: [300, 240] }
  - id: poi_a9mra4
    subtype: logistics_park
    status: generated
    names:
      zh: 隆迪纳亚保税物流园
      en: Rondinaia Bonded Logistics Park
      art-x-viking: Zolllager-Logistikpark Rondinaia
      art-x-buckham: Polo Logistico Doganale di Rondinaia
