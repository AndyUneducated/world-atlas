    notes:
      zh: "由旧捕鲸站改建，讲述鲸湾从捕鲸站到领地最大港口的历史。馆里挂着一副完整的鲸骨架，从入口一直延伸到大厅尽头，孩子们喜欢在鲸的肋骨下面奔跑。展厅最后一间讲的是捕鲸停止之后的鲸湾，墙上贴满了观鲸船拍到的鲸尾照片，每一条鲸都有自己的名字。"
      en: "The old whaling station, now a museum of how Walvik grew from a whaling post into the territory's largest port. A complete whale skeleton hangs from the entrance to the far end of the hall, and children love to run beneath its ribs. The last gallery tells of Whale Bay after the whaling stopped, its walls covered with photographs of whale tails taken from whale-watching boats, each whale with its own name."
    in: div_z29w6h
    offset_km: [-1.0, -0.9]
    site: { size_m: [180, 120], layout: hall }

