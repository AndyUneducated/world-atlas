      en: Sky Terrace International Convention Centre
      art-x-viking: Internationales Kongresszentrum Himmelterrasse
      art-x-buckham: Centro Congressi Internazionale di Terrazza Cielo
    notes:
      zh: "度假集群中心的会议中心，领地的年度论坛与大型会议多在此举行。会议厅的落地窗正对柳萨湾，与会者在茶歇时常常端着咖啡站到窗前看彩虹，主持人干脆把茶歇安排在雨后。中心门口有一个特别大的伞架，开大会的日子要摆上几百把公共雨伞。"
      en: "The convention centre at the heart of the resort cluster, where the territory holds its annual forum and most large conferences. Its floor-to-ceiling windows face Ljosa Bay, and delegates often take their coffee to the glass during breaks to look for rainbows, so organisers simply schedule breaks after the rain. The entrance has an extra-large umbrella stand, which on big conference days holds several hundred public umbrellas."
