    notes:
      zh: 北维京岛领地政务院民政部，位于政务院大街北侧第二排，负责社会组织、社会救助和行政区划。部内设政策司、社会组织司、社会救助司、慈善事业司、其他社会事务司和行政区划司。行政区划司管理全岛市、区的设立、调整和命名，领地地名分层的规则就由它审定：西、北海岸用北欧名，内陆用塔夫鲁纳克语名，东南用巴克汉姆名，领地时期的新城用中文名。社会组织司登记协会、合作社和基金会，社会救助司向困难家庭发放救助，慈善事业司监督募捐，其他社会事务司负责婚姻登记、殡葬和退役军人安置。
      en: The Ministry of Civil Affairs, in the second row on the north side of Council Row, deals with civil society, social assistance and the territory's administrative divisions. Its departments are Policy, Social Organisations, Social Assistance, Charities, Other Social Affairs and Administrative Divisions. Administrative Divisions sets up, adjusts and names cities and districts, and approved the island's layered naming, with Norse names on the west and north coasts, Tavrunaq names inland, Buckham names in the south-east and Chinese names for the territory's new towns. Social Organisations registers associations, co-operatives and foundations, Social Assistance supports families in hardship, Charities oversees fundraising, and Other Social Affairs handles marriage registration, funerals and the resettlement of veterans.
    in: div_16cxr8
    offset_km: [1.96, 1.79]
    site: { size_m: [130, 80], layout: slab }

  - id: bld_8e92ez
    subtype: government
    status: generated
    names:
      zh: 北维京岛领地政务院劳动和社会保障部
      en: Ministry of Labour and Social Security, North Viking Island Executive Council
    short_names:
      zh: 劳动和社会保障部
      en: Ministry of Labour and Social Security
    notes:
      zh: 北维京岛领地政务院劳动和社会保障部，位于政务院大街南侧第二排，负责就业、职业培训、劳动关系和社会保险。部内设就业司、职业能力司、普通工种司、特殊工种司、劳动仲裁司和公共劳动保险司。特殊工种司管理航天发射、远洋捕捞、矿山和高寒野外作业等高危岗位的资格和工时，冬季野外作业的停工标准也由它制定；职业能力司与各市的职业学院合作开设船舶修造、航天制造和旅游服务课程，劳动仲裁司在各市设仲裁庭，公共劳动保险司管理全岛统一的养老、失业和工伤保险。
      en: The Ministry of Labour and Social Security, in the second row on the south side of Council Row, covers jobs, training, labour relations and social insurance. Its departments are Employment, Vocational Skills, General Trades, Special Trades, Labour Arbitration and Public Labour Insurance. Special Trades sets the qualifications and hours for hazardous work such as rocket launches, deep-sea fishing, mining and fieldwork in the cold, including when outdoor work must stop in winter; Vocational Skills runs courses in shipbuilding, aerospace manufacturing and tourism with each city's colleges, Labour Arbitration sits in every city, and Public Labour Insurance runs the island-wide pension, unemployment and work-injury schemes.
    in: div_16cxr8
    offset_km: [2.4, 1.12]
    site: { size_m: [130, 80], layout: slab }

  - id: bld_sec2vg
    subtype: government
    status: generated
    names:
      zh: 北维京岛领地政务院卫生和人类服务部
      en: Ministry of Health and Human Services, North Viking Island Executive Council
    short_names:
      zh: 卫生和人类服务部
      en: Ministry of Health and Human Services
    notes:
      zh: 北维京岛领地政务院卫生和人类服务部，位于政务院大街北侧第二排，负责食品药品安全、医疗卫生、公共保险和公共福利。部内设食品政策司、食品监管司、食品从业人员司、医疗和药品政策司、医疗和药品监管司、医疗和药品从业人员司、医疗和药品技术司、公共健康保险司、其他公共保险司、公共卫生司和公共福利司。食品监管司检验全岛的乳制品、熏鱼和进口食品，公共健康保险司让居民在各市医院看病都按统一标准报销；公共卫生司为偏远牧区和渔村组织巡回医疗和直升机急救，公共福利司负责养老院、托育和残疾人服务。
      en: The Ministry of Health and Human Services, in the second row on the north side of Council Row, is responsible for food and drug safety, health care, public insurance and public welfare. Its eleven departments are Food Policy, Food Supervision, Food Professions, Medical and Drug Policy, Medical and Drug Supervision, Medical and Drug Professions, Medical and Drug Technology, Public Health Insurance, Other Public Insurance, Public Health and Public Welfare. Food Supervision tests the island's dairy produce, smoked fish and imported food, Public Health Insurance means treatment is reimbursed on the same terms in every city's hospitals, Public Health sends travelling clinics and air ambulances to remote pastures and fishing villages, and Public Welfare runs care homes, childcare and disability services.
    in: div_16cxr8
    offset_km: [2.11, 1.89]
    site: { size_m: [140, 110], layout: lshape }

  - id: bld_7tedfx
    subtype: government
    status: generated
    names:
      zh: 北维京岛领地政务院自然资源和环境保护部
      en: Ministry of Natural Resources and Environmental Protection, North Viking Island Executive Council
    short_names:
      zh: 自然资源和环境保护部
      en: Ministry of Natural Resources and Environmental Protection
    notes:
      zh: 北维京岛领地政务院自然资源和环境保护部，位于政务院大街南侧第二排，负责土地、森林、冰川和海洋的保护与利用。部内设政策司、自然生态保护司、大陆生态环境司、水生态环境司、海洋生态环境司、大气环境司、土壤生态环境司、固体废物和化学品司、环境影响评价和排放管理司、生态环境监测司和生态环境执法署。洛龙山脉和马斯林山脉的冰川、内陆的针叶林和驯鹿牧场、西海岸的峡湾都在它的保护名录上；环境影响评价和排放管理司审批港口、矿山和航天设施的建设，生态环境监测司与西北市的寒岭生态研究站合作，长期观测冰川退缩和冻土变化。
      en: The Ministry of Natural Resources and Environmental Protection, in the second row on the south side of Council Row, protects and manages the island's land, forests, glaciers and seas. Its departments are Policy, Nature Conservation, Land Ecology, Freshwater Ecology, Marine Ecology, Air Quality, Soil Ecology, Solid Waste and Chemicals, Environmental Impact and Emissions, and Environmental Monitoring, with an Environmental Enforcement Agency. The glaciers of the Lorond and Maslin ranges, the inland conifer forests and reindeer pastures and the fjords of the west coast are all on its protected lists. Its impact assessors approve ports, mines and space facilities, and its monitoring department works with the Frost Ridge Ecological Station in Northwest City to track the retreat of the glaciers and changes in the permafrost.
    in: div_16cxr8
    offset_km: [2.55, 1.22]
    site: { size_m: [140, 80], layout: slab }

  - id: bld_0rx5yn
    subtype: government
    status: generated
    names:
      zh: 北维京岛领地政务院交通部铁路司
      en: Railways Department, Ministry of Transport, North Viking Island Executive Council
    short_names:
      zh: 交通部铁路司
      en: Railways Department
    notes:
      zh: 北维京岛领地政务院交通部铁路司，在交通部旁单独建楼，负责全岛铁路的规划、建设监督和运营安全。北维京岛有维贝铁路、西马铁路、新洛铁路和维西、自勒等城际铁路，以及通往维京群岛的维长城际铁路，高速线路的运营速度为每小时三百到三百五十公里；铁路司审定新线方案和时刻表的基本框架，监督冻土路段、长隧道和防雪设施的安全，冬季协调除雪车和道岔融雪。维长城际铁路的海底隧道由它与维京群岛的交通部门共同管理。铁路在岛内长途客运中的地位越来越重要，它是交通部唯一单独建楼的司。
      en: The Railways Department of the Ministry of Transport has its own building beside the ministry and plans the island's railways, supervises their construction and oversees their safety. North Viking Island has the Viking Port–Beckerle, Northwest–Maslin Mountain and New City–Lorond Mountain railways, intercity lines such as Viking Port–Northwest and Freedom City–Lekor, and the Viking Port–Longship Intercity Railway to the Viking Islands, with high-speed services at 300 to 350 km/h. The department approves new lines and the framework of the timetable, checks the safety of permafrost stretches, long tunnels and snow defences, and in winter coordinates snowploughs and switch heating. It runs the undersea tunnel of the Viking Port–Longship line jointly with the Viking Islands' transport authorities. As rail carries more and more of the island's long-distance travel, it is the only department of the ministry with a building of its own.
    in: div_16cxr8
    offset_km: [2.7, 1.32]
    site: { size_m: [120, 70], layout: slab }

  - id: bld_91a3v2
    subtype: government
    status: generated
    names:
      zh: 北维京岛领地政策和计划委员会
      en: North Viking Island Policy and Planning Commission
    short_names:
      zh: 政策和计划委员会
      en: Policy and Planning Commission
    notes:
      zh: 北维京岛领地政策和计划委员会，是政务院直属的特设委员会，位于政务院大街北侧正对议会综合办公区的一端。委员会由总督主持，各部部长和独立专家参加，负责编制领地的中长期发展规划，协调跨部门的重大政策，并评估各项政策的实施效果。航天产业、科学城、贝克勒自由贸易区和通往长船的海底通道这样跨越多个部门的大项目，都先在这里形成方案，再提交议会；委员会每年发布领地发展报告，公开各市人口、产出和公共服务的指标。大楼是一座方形独栋，顶层的大会议室可以俯瞰人民大道。
      en: The North Viking Island Policy and Planning Commission is a special commission directly under the Executive Council, on the north side of Council Row facing the Parliament Complex. Chaired by the governor, with the ministers and independent experts as members, it draws up the territory's medium- and long-term development plans, coordinates major policies that cross ministries and reviews how policies are working. Projects that span several ministries, such as the space industry, Science City, the Beckerle Free Trade Zone and the undersea link to Longship, take shape here before going to the parliament, and every year the commission publishes a development report with figures on each city's population, output and public services. The building is a square block whose top-floor council room looks down People's Avenue.
    in: div_16cxr8
    offset_km: [2.52, 1.92]
    site: { size_m: [90, 90], layout: block }

  - id: bld_2hht9x
    subtype: government
    status: generated
    names:
      zh: 中央政府常驻北维京岛领地高级国务督办办公室
      en: Office of the Senior State Commissioner of the Central Government in North Viking Island
    short_names:
      zh: 高级国务督办办公室
      en: Senior State Commissioner's Office
    notes:
      zh: 中央政府常驻北维京岛领地高级国务督办办公室，位于政务院大街北侧第二排，是中央政府派驻领地的最高代表机构。高级国务督办代表中央政府督促国家法律和政策在领地的实施，协调国防、外交等中央事权与领地事务的衔接，例如马斯林山的航天发射场、深空太空军的设施和领地维和部队的驻地安排；领地重大事项需要中央批准时，也由办公室转呈并跟进。办公室与政务院定期举行联席会议，每年向中央政府提交领地情况的报告。大楼为方形独栋，门前悬挂国旗和领地旗。
      en: The Office of the Senior State Commissioner of the Central Government in North Viking Island, in the second row on the north side of Council Row, is the central government's highest standing representation in the territory. The Senior State Commissioner sees that national laws and policies are carried out here and links the central government's own responsibilities, such as defence and foreign affairs, with territorial business, for example the space launch site at Maslin Mountain, the Deep Space Force's facilities and the bases of the territorial peacekeeping force. When a territorial matter needs central approval, the office forwards it and follows it up. It meets the Executive Council in regular joint sessions and reports on the territory to the central government every year. The square building flies the national and territorial flags at its door.
    in: div_16cxr8
    offset_km: [2.26, 1.99]
    site: { size_m: [80, 80], layout: block }

  - id: bld_vgryh6
    subtype: government
    status: generated
    names:
      zh: 中央政府常驻北维京岛领地巡视员办公室
      en: Office of the Central Government Inspector in North Viking Island
    short_names:
      zh: 巡视员办公室
      en: Inspector's Office
    notes:
      zh: 中央政府常驻北维京岛领地巡视员办公室，位于政务院大街北侧第二排，由中央政府派驻，负责对领地各级行政机关进行巡视监督。巡视员定期到政务院各部、各市人民政府和公共企业检查政策执行、财政资金使用和廉洁情况，发现的问题向中央政府和领地总督同时报告，并跟踪整改。办公室设有公众来访接待室，居民可以当面或书面反映对行政机关的意见和举报，接待室提供中文、维京语和巴克汉姆语服务。巡视报告的摘要定期向社会公开。
      en: The Office of the Central Government Inspector in North Viking Island, in the second row on the north side of Council Row, is sent by the central government to inspect and oversee the territory's administration at every level. Inspectors regularly visit the Council's ministries, the city governments and public companies to check how policies are carried out, how public money is spent and whether officials are honest; what they find goes to both the central government and the governor, and they follow it up until it is put right. The office has a public reception room where residents can raise complaints or report wrongdoing in person or in writing, in Chinese, Viking or Buckham, and summaries of its inspection reports are published.
    in: div_16cxr8
    offset_km: [2.41, 2.09]
    site: { size_m: [80, 80], layout: block }

  - id: bld_q2ga6d
