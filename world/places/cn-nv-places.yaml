      zh: 勒克尔农产品交易中心
      en: Lekor Produce Exchange
      art-x-viking: Agrarbörse Lekor
      art-x-buckham: Borsa Agricola di Lekor
    notes:
      zh: "领地最大的粮食、乳品与肉类批发市场。每年秋天丰收节开幕那天，自由市、西北市、塔夫鲁普库维克市和洛龙山市各派一辆彩车开到交易中心门口，岛上的人管这叫「回娘家」。平日清晨的拍卖大厅里，盐粒硬奶酪按轮称重，叫价声一直传到街上。"
      en: "The territory's largest wholesale market for grain, dairy and meat. On the opening day of the Harvest Festival each autumn, Freedom City, Northwest City, Tavrupukkuvik and Lorond Mountain each send a decorated float to its door, a custom the island calls \"visiting the old home\". On ordinary mornings the auction hall weighs salt-crusted hard cheese by the wheel, and the bidding can be heard out in the street."
    in: div_0wvh63
    offset_km: [1.5, -0.8]
    site: { layout: market, size_m: [300, 180] }
  - id: bld_bbw8n2
    subtype: museum
    status: generated
    names:
      zh: 勒克尔农业博物馆
      en: Lekor Farming Museum
      art-x-viking: Landwirtschaftsmuseum Lekor
      art-x-buckham: Museo dell'Agricoltura di Lekor
    notes:
      zh: "由老粮仓改建，讲述北维京岛的农牧历史。粮仓的木梁上还留着当年存粮时刻下的刻度。馆里最受孩子欢迎的是一台可以亲手摇动的老式脱粒机，秋天博物馆会请老农来示范手工打黄油，打好的黄油抹在黑麦面包上分给参观的人。"
      en: "A converted granary, telling the story of farming on North Viking Island. The granary's beams still carry the marks cut when grain was stored there. Children's favourite exhibit is an old threshing machine they can crank by hand, and in autumn the museum invites old farmers to churn butter by hand, spreading it on rye bread for visitors."
    in: div_0wvh63
    offset_km: [-0.6, 0.6]
    site: { layout: hall, size_m: [160, 110] }
  - id: poi_8btcjd
    subtype: plaza
    status: generated
    names:
      zh: 科恩达尔丰收广场
      en: Korndal Festival Square
      art-x-viking: Erntefestplatz Korndal
      art-x-buckham: Piazza della Festa di Messe Valle
    notes:
      zh: "勒克尔丰收节的主会场。丰收节期间广场上搭满了木棚，卖盐粒硬奶酪、油菜花蜜、烤猪肘和热香料白葡萄酒，夜里还有乡村乐队演奏。节日最后一天要评出全岛最大的南瓜，获胜的南瓜会被雕成灯笼，挂在广场中央照亮到冬天。"
      en: "The main venue of the Lekor Harvest Festival. During the Harvest Festival the square fills with wooden stalls selling salt-crusted hard cheese, rapeseed honey, roast pork knuckle and hot spiced white wine, with country bands playing into the night. On the last day the year's biggest pumpkin is judged, and the winner is carved into a lantern that lights the centre of the square into winter."
    in: div_davn2j
    offset_km: [0.3, 0.3]
    site: { layout: plaza, size_m: [420, 300] }
  - id: poi_9yp4qr
    subtype: winery
    status: generated
    names:
      zh: 科恩达尔酒庄
      en: Korndal Winery
      art-x-viking: Weingut Korndal
      art-x-buckham: Cantina di Messe Valle
    notes:
      zh: "科恩达尔区最大的酒庄，葡萄园与酒窖对游客开放。酒庄用耐寒葡萄酿出带苹果香的白葡萄酒，冬天烫热了加香料喝。每年秋天采摘季，酒庄邀请游客一起下地剪葡萄，剪得最多的人能把自己的名字印在当年的酒标背面。"
      en: "The largest winery in Korndal, with vineyards and cellars open to visitors. It makes an apple-scented white wine from hardy grapes, drunk hot with spices in winter. Each autumn at harvest visitors are invited to help cut the grapes, and whoever picks the most has their name printed on the back of that year's label."
    in: div_davn2j
    offset_km: [2.6, 1.8]
    site: { layout: park, size_m: [700, 500] }
  - id: poi_9wff2j
    subtype: park
    status: generated
    names:
      zh: 克拉尔瓦滕湖滨公园
      en: Klarvatn Shore Park
      art-x-viking: Uferpark Klarvatn
      art-x-buckham: Parco Lungolago di Lago Chiaro
    notes:
      zh: "克拉尔瓦滕湖岸边的步道、沙滩与游船码头。隆冬湖面封冻，冰钓的小木屋在湖上排成一座小镇，冰层够厚时湖心还会办一场冰上集市；夏天游船从码头出发，绕湖一圈能看到湖边的牧场和科恩达尔的葡萄园。"
      en: "Lakeside promenades, a beach and the pleasure-boat pier on Lake Klarvatn. In deep winter the lake freezes and the ice-fishing huts line up on it into a small town, with a market in the middle of the lake when the ice is thick enough; in summer boats leave from the pier on a circuit past lakeside pastures and the vineyards of Korndal."
    in: div_t8bg0d
    offset_km: [0, 2.0]
    site: { layout: park, size_m: [800, 400] }
  # ── 萨科勒市与贝克勒自由贸易区地标（M15）──
  - id: bld_1bjy8a
    subtype: townhall
    status: generated
    names:
      zh: 萨科勒市人民政府
      en: Sakole City Government
      art-x-viking: Stadtregierung Sakole
      art-x-buckham: Governo Cittadino di Sakole
    notes:
      zh: "设在萨科老镇中心的市政府，建市时由镇公所扩建。镇公所的老楼保留着原来的钟楼和石阶，市政府的公告用中文和巴克汉姆语双语张贴。每天中午铁岗区工厂的汽笛声传到这里，市政府的午休也就开始了。"
      en: "The city government in the centre of old Sako, enlarged from the town hall when the city was founded. The old town-hall building keeps its original clock tower and stone steps, and the city's notices are posted in both Chinese and Buckham. When the noon whistle of the Iron Knoll factories reaches it each day, the city government breaks for lunch."
    in: div_8m0jx4
    offset_km: [0.2, 0.2]
    site: { layout: complex, size_m: [300, 220] }
  - id: poi_39e7mh
    subtype: plaza
    status: generated
    names:
      zh: 萨科老镇广场
      en: Sako Old Town Square
      art-x-viking: Altmarkt Sako
      art-x-buckham: Piazza Vecchia di Sako
    notes:
      zh: "老镇钟楼前的石铺广场，建市前是萨科镇的集市与中心。傍晚广场最热闹，退休的老工人在石板地上玩巴克汉姆式的滚木球，输的人请喝咖啡，围观的年轻工人一边看一边用巴克汉姆语起哄。"
      en: "The cobbled square below the old clock tower, the market and centre of Sako before the city was founded. It is liveliest in the evening, when retired workers roll wooden balls across the flagstones in the Buckham game, the loser buying the coffee, while young workers look on and heckle in Buckham."
    in: div_8m0jx4
