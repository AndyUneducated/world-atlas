# Named places (buildings, landmarks, facilities) of North Viking Island.
# subtype follows OSM / Overture place categories.
# in: the division the place lies in. Without explicit coordinates the generator puts
#   the place at that division's urban core, offset by offset_km (real km, east/north).
# emblem_of: the territory or city whose flag or emblem heads the place's card (never drawn on the map).
# site: the place's grounds drawn as a landmark. size_m is [along, across] in metres; layout
#   picks the footprint template: city landmarks (complex, hall, campus, stadium, tower, dome
#   (a round glass dome), park, plaza, market) or transport facilities (airport: runways along the long side; port: piers
#   out to sea on the "across" side, sheds ashore; spaceport: launch pads on the "across" side;
#   mine: an open pit with the processing plant and tailings pond on the +x side).
#   angle_deg (optional) turns the long side to that bearing (east = 0, counter-clockwise);
#   without it the site follows the district's street grid. Streets and generated buildings
#   keep out of the site. Military and space facilities have their own layouts (airbase,
#   radar, antenna, sam, range, plant, test_stand, silo, bunker, launch_track, camp,
#   heliport) and variant picks the kind (see MILITARY_VARIANTS in pipeline/atlas/world.py).
# military (optional): unit designation, branch, main equipment, personnel and public access,
#   shown on the card; the map shows the place name.
# access_road (optional, true): a city road is built from the site's gate to the nearest road.
places:
  - id: bld_mc71ej
    subtype: government
    status: canon
    names:
      zh: 北维京岛领地政府
      en: Government of the Territory of North Viking Island
      art-x-viking: Regierung von Hea Veiling
    notes:
      zh: 北维京岛领地政务院的主楼，位于首府自由市白桦区人民大道的东北端，紧挨议会综合办公区。政务院是领地的最高行政机关，由领地总督组织，下设十一个部和若干直属机构，各部的大楼沿人民大道两侧排开，人称「政务院大街」。主楼是一座回字形的庭院建筑，内院种着白桦：北翼是总督办公室，其余三翼是办公厅。办公厅下设综合行政局、媒体和出版局、财务局、安全局、档案局、采购局和公务员事务局，负责政务院的日常运转、新闻发布、机关财务和安保、公文档案、政府采购，以及全领地公务员的招录和考核。
      en: The main building of the North Viking Island Executive Council, at the north-east end of People's Avenue in Birchwood District of the capital, Freedom City, right beside the Parliament Complex. The Executive Council is the territory's highest executive body, formed by the governor, with eleven ministries and several directly attached bodies whose buildings line both sides of the avenue, a stretch known as Council Row. The main building is a hollow square round a courtyard planted with birches; the north wing holds the Governor's Office and the other three the General Office. The General Office's bureaus (General Administration, Media and Publications, Finance, Security, Archives, Procurement and Civil Service) keep the Council running, brief the press, manage its accounts and security, keep its records, buy its supplies and recruit and assess the territory's civil servants.
    in: div_16cxr8
    offset_km: [2.75, 2.37]
    site: { size_m: [240, 200], layout: courtyard }
    emblem_of: div_fbfqv9

