  - id: bld_77y46r
    subtype: museum
    status: generated
    names:
      zh: 塔夫鲁普库维克农机博物馆
      en: Tavrupukkuvik Farm Machinery Museum
      art-x-viking: Landmaschinenmuseum Tavrupukkuvik
      art-x-buckham: Museo delle Macchine Agricole di Tavrupukkuvik
    notes:
      zh: "塔夫鲁普库维克市普库图克区的农机博物馆，在老镇中心，与塔夫鲁普库维克市人民政府相邻，展馆约 200 米长、120 米宽，从畜力犁到无人驾驶收割机，展出平原机械化农业的历程，馆藏上百台各个时期的拖拉机和收割机。塔夫鲁普库维克的平原地势平坦、土壤深厚，是本岛机械化程度最高的粮食和饲料产区，大型家庭农场和农业合作社用联合收割机和精准灌溉系统种植小麦、大麦、油菜和土豆，秋收时节田野里机声隆隆；博物馆讲的正是这片平原从畜力到机器、再到无人驾驶的变化。馆里还复原了一间老农机修理铺，墙上挂满扳手和零件，旁边的展柜里是两镇合并前普库图克镇和西加维克镇农民用过的农具。附近的普库图克农产品集散中心每天把粮食、蔬菜和肉类运往维京港、新城和萨科勒，来参观的人常顺路去那里买土豆。塔夫鲁普库维克农业学院的学生也常来上课，对着拆开的发动机做笔记。\n馆外停着一排从老到新的拖拉机，孩子们最爱爬上那台最老的红色拖拉机按喇叭。每年春耕前，博物馆会把几台老机器开到田里，和无人驾驶收割机并排跑一圈，老农开着老车，年轻人在田边用平板电脑遥控新车，围观的人分成两派喊加油，本地人笑说这是「塔普的春耕赛」。"
      en: "A farm machinery museum in the old town centre of Pukkutuuq District, Tavrupukkuvik City, next door to the Tavrupukkuvik City Government. In a hall about 200 m long and 120 m wide it traces the mechanisation of farming on the plain from the animal-drawn plough to the driverless harvester, with a collection of more than a hundred tractors and harvesters from every period. Tavrupukkuvik's plain is flat with deep soil, the most mechanised grain and fodder region on the island, where large family farms and cooperatives grow wheat, barley, rapeseed and potatoes with combine harvesters and precision irrigation and the fields roar with machines at harvest; the museum tells the story of this plain's journey from animal power to machines and on to driverless operation. It also recreates an old farm-machinery repair shop, its walls hung with spanners and spare parts, and next to it cases hold the tools used by farmers of Pukkutuuq and Siggavik before the two towns merged. The nearby Pukkutuuq Produce Distribution Centre sends grain, vegetables and meat to Viking Port, New City and Sakole every day, and visitors often stop there afterwards to buy potatoes. Students from the Tavrupukkuvik Agricultural College come for lessons too, taking notes in front of stripped-down engines.\nOutside stands a row of tractors from oldest to newest, and children love to climb onto the oldest, a red one, and sound its horn. Every spring before ploughing, the museum drives a few old machines out into the fields to run a lap side by side with a driverless harvester: old farmers drive the old tractors while young people steer the new machine from tablets at the field edge, the crowd splits into two camps cheering each side, and locals laughingly call it \"Tap's ploughing race\"."
    in: div_rzw76f
    offset_km: [-0.8, 0.6]
    site: { layout: hall, size_m: [200, 120] }
  - id: poi_qm3z2m
    subtype: park
    status: generated
    names:
      zh: 牛角湾海滨公园
      en: Oxhorn Bay Seaside Park
      art-x-viking: Strandpark Ochsenhornbucht
      art-x-buckham: Parco al Mare di Baia Corno di Bue
    notes:
      zh: "牛角湾海滨公园在塔夫鲁普库维克市普库图克区的东部，沿牛角湾岸铺开草地、沙滩和野餐区，占地约 0.28 平方公里，夏季是塔夫鲁普库维克人消暑的去处。牛角湾是塔夫鲁普库维克市南端的小海湾，面积约六十平方公里，东侧是牛角岬，西侧是较小的邓莱维角，两岬环抱，湾形弯曲如牛角，从公园的观景台上看最清楚，公园名也由此而来。海湾水浅浪小，适合游泳和划皮划艇；牛角岬上的灯塔是附近渔船的航标，也标出全市海岸的最南端，周末常有人沿湾岸步道走到岬角，在灯塔下野餐、看海。湾岸的林地和木材加工厂为普库图克区提供了不少就业，公园就夹在林地与海水之间，平原上难得有这样一片既有树荫又有沙滩的地方。\n市名太长，岛上的人口头上都叫这座城「塔普」，夏天「去塔普的海边」说的就是这里。夏天退潮时，孩子们在沙滩上用旧拖拉机轮胎垒城堡，比谁的城堡撑得过下一次涨潮，轮胎都是农场里换下来的，家长们开着皮卡一车车拉来。野餐区里最常见的是烤土豆配酸奶油和大麦土豆汤，平原上的人家去海边也离不开土豆；退潮的滩涂上还常有拾贝的家庭，傍晚提着一桶蛤蜊回家煮汤。"
      en: "Oxhorn Bay Seaside Park lies in the east of Pukkutuuq District in Tavrupukkuvik, a stretch of grass, sand and picnic areas along the shore of Oxhorn Bay covering about 0.28 km², and in summer it is where Tavrupukkuvik goes to cool off. Oxhorn Bay is a small bay of about 60 km² at the city's southern tip, held between Oxhorn Point to the east and the smaller Cape Dunlevy to the west; the curve of the bay is shaped like an ox horn, best seen from the park's viewing platform, and that is where the park gets its name. The water is shallow and calm, good for swimming and kayaking. The lighthouse on Oxhorn Point guides the local fishing boats and marks the city's southernmost shore, and at weekends people often walk the shore path out to the point to picnic and watch the sea beneath the lighthouse. Woods and timber mills along the bay provide many jobs in Pukkutuuq District, and the park sits between the woods and the water, a rare place on the plain with both shade and sand.\nThe city's name is so long that islanders just call it \"Tap\", and in summer \"going to the seaside at Tap\" means coming here. At low tide in summer, children build castles on the sand out of old tractor tyres and compete to see whose will survive the next tide; the tyres are cast-offs from the farms, brought down by the pickup-load by parents. In the picnic areas the commonest fare is baked potatoes with sour cream and barley and potato soup, since plains families cannot go to the seaside without potatoes, and families gathering shellfish on the flats at low tide often head home in the evening with a bucket of clams for soup."
    in: div_rzw76f
    offset_km: [0.6, -1.6]
    site: { layout: park, size_m: [800, 350] }
  - id: poi_3s7f2z
    subtype: plaza
    status: generated
    names:
      zh: 两镇广场
      en: Twin Towns Square
      art-x-viking: Zweistädteplatz
      art-x-buckham: Piazza delle Due Città
    notes:
      zh: "两镇广场在塔夫鲁普库维克市西加维克区，夹在西加维克老镇与新住宅区之间，是纪念普库图克与西加维克两镇合并设市的广场。领地建立之初，两座平原小镇从原勒克尔市析出、合二为一，新市名取塔夫鲁纳克语「土地生长之处」。广场中央的纪念碑记载着两镇合并的经过，碑旁的石碑上刻着那句塔夫鲁纳克语老话：「Tavru pukku, nirsa tuqqa」，意思是「土地肯长东西的地方，驯鹿就会住下来」，本地人常拿它解释为什么那么多年轻家庭搬到这片平原上安家。如今广场是市民集会和节日庆典的地方，四周是社区超市、餐馆和新开的幼儿园；北河公路从区内经过，许多去勒克尔和自由市上班的通勤族每天清晨从广场边出发。\n广场每周有一次农夫市集，附近农场的土豆、大麦、鲜奶和油菜花蜜摆满一排排木摊，塔夫鲁普库维克农业学院的学生也来摆摊，请人试吃自己培育的新品种。一年里最热闹的是两镇合并的纪念日：普库图克和西加维克的居民在广场上拔河，输的一方负责操办来年的庆典。拔河用的粗麻绳平时由上一年的胜方保管。西加维克的新居民越来越多，老普库图克人抱怨「对面的人一年比一年多」，可每到纪念日，他们照样早早到场，攥紧绳子的另一头。"
      en: "Twin Towns Square is in Siggavik District of Tavrupukkuvik, between the old town of Siggavik and its new housing estates, and commemorates the merger of the towns of Pukkutuuq and Siggavik into a single city. When the territory was founded, the two small plains towns were carved out of the old Lekor City and joined together, and the new city took a Tavrunaq name meaning \"where the land grows\". A monument in the middle of the square records how the two towns merged, and a stone beside it is carved with the old Tavrunaq saying \"Tavru pukku, nirsa tuqqa\": \"where the land is willing to grow things, the reindeer will settle\". Locals like to quote it to explain why so many young families have moved to the plain. Today the square is where the city gathers for meetings and holidays, ringed by local supermarkets, restaurants and newly opened nurseries; the North River Highway runs through the district, and many commuters bound for Lekor and Freedom City set off from beside the square each morning.\nOnce a week a farmers' market fills the square with rows of wooden stalls selling potatoes, barley, fresh milk and rapeseed honey from nearby farms, and students from the Tavrupukkuvik Agricultural College set up stalls of their own, inviting passers-by to taste the varieties they have bred. The liveliest day of the year is the anniversary of the merger, when the people of Pukkutuuq and Siggavik hold a tug-of-war in the square and the losing side has to organise the following year's celebrations. The thick hemp rope is kept by the previous year's winners. Siggavik keeps gaining newcomers, and old Pukkutuuq hands grumble that \"there are more of them on the other end every year\", yet every anniversary they turn up early and grip their end of the rope all the same."
    in: div_mpfctv
    offset_km: [0.3, 0.3]
    site: { layout: plaza, size_m: [240, 180] }
