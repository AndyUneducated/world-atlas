# Named places (buildings, landmarks, facilities) of North Viking Island.
# subtype follows OSM / Overture place categories.
# in: the division the place lies in. Without explicit coordinates the generator puts
#   the place at that division's urban core, offset by offset_km (real km, east/north).
# emblem_of: the territory or city whose flag heads the place's card (never drawn on the map).
# site: the place's grounds drawn as a landmark. size_m is [along, across] in metres; layout
#   picks the footprint template: city landmarks (complex, hall, campus, stadium, tower, dome
#   (a round glass dome), park, plaza, market) or transport facilities (airport: runways along the long side; port: piers
#   out to sea on the "across" side, sheds ashore; spaceport: launch pads on the "across" side;
#   mine: an open pit with the processing plant and tailings pond on the +x side).
#   angle_deg (optional) turns the long side to that bearing (east = 0, counter-clockwise);
#   without it the site follows the district's street grid. Streets and generated buildings
#   keep out of the site. Military and space facilities have their own layouts (airbase,
#   radar, antenna, sam, range, plant, test_stand, silo, bunker, launch_track, camp,
#   heliport) and variant picks the kind (see MILITARY_VARIANTS in pipeline/atlas/world.py).
# military (optional): unit designation, branch, main equipment, personnel and public access,
#   shown on the card; the map shows the place name.
# A site more than 500 m from every road and street gets a city road from its gate to the nearest
#   road on its landmass; access_road: false marks one with no road by design (a summit station).
places:
  - id: bld_mc71ej
    subtype: government
    status: canon
    names:
      zh: 北维京岛领地政府
      en: Government of the Territory of North Viking Island
      art-x-viking: Regierung von Hea Veiling
    notes:
      zh: 北维京岛领地政务院的主楼，位于首府自由市白桦区人民大道的东北端，紧挨议会综合办公区。政务院是领地的最高行政机关，由领地总督组织，下设十一个部和若干直属机构，各部的大楼沿人民大道两侧排开，人称「政务院大街」。主楼是一座回字形的庭院建筑，内院种着白桦：北翼是总督办公室，其余三翼是办公厅。办公厅下设综合行政局、媒体和出版局、财务局、安全局、档案局、采购局和公务员事务局，负责政务院的日常运转、新闻发布、机关财务和安保、公文档案、政府采购，以及全领地公务员的招录和考核。
      en: The main building of the North Viking Island Executive Council, at the north-east end of People's Avenue in Birchwood District of the capital, Freedom City, right beside the Parliament Complex. The Executive Council is the territory's highest executive body, formed by the governor, with eleven ministries and several directly attached bodies whose buildings line both sides of the avenue, a stretch known as Council Row. The main building is a hollow square round a courtyard planted with birches; the north wing holds the Governor's Office and the other three the General Office. The General Office's bureaus (General Administration, Media and Publications, Finance, Security, Archives, Procurement and Civil Service) keep the Council running, brief the press, manage its accounts and security, keep its records, buy its supplies and recruit and assess the territory's civil servants.
    in: div_16cxr8
    offset_km: [2.75, 2.37]
    site: { size_m: [240, 200], layout: courtyard }
    emblem_of: div_fbfqv9

  # ── 自由市地标（M7）──
  - id: poi_65b998
    subtype: government
    status: canon
    names:
      zh: 议会综合办公区
      en: Parliament Complex
      art-x-viking: Parlamentsviertel
      art-x-buckham: Complesso del Parlamento
    notes:
      zh: 领地议会与领地政府所在的建筑群，坐落在人民大道东北端
      en: Seat of the territorial parliament and government, at the north-east end of People's Avenue.
    in: div_16cxr8
    offset_km: [3, 2]
    site: { size_m: [560, 420], layout: complex }

  - id: poi_s7aqz9
    subtype: plaza
    status: generated
    names:
      zh: 人民广场
      en: People's Square
      art-x-viking: Volksplatz
      art-x-buckham: Piazza del Popolo
    notes:
      zh: "人民大道中段的城市广场，正对议会综合办公区。广场四周是领地博物馆、领地图书馆和自由市大剧院，北维京岛大学的毕业典礼也在这里举行。冬天广场上积雪，扫雪车按「先自行车道、再汽车道」的规矩清出一条条路，傍晚孩子们在剩下的雪堆上滑雪橇。"
      en: "The city square halfway along People's Avenue, facing the Parliament Complex. It is ringed by the Territorial Museum, the Territorial Library and the Grand Theatre, and the University of North Viking Island holds its graduation here. In winter the snowploughs clear paths across it, cycle lanes first and then the roads, and in the evening children sledge on the snowbanks that are left."
    in: div_16cxr8
    offset_km: [1.87, 1.25]
    site: { size_m: [400, 260], layout: plaza }

  - id: bld_s3p065
    subtype: museum
    status: generated
    names:
      zh: 领地博物馆
      en: Territorial Museum
      art-x-viking: Landesmuseum
      art-x-buckham: Museo Territoriale
    in: div_16cxr8
    offset_km: [1.62, 1.62]
    site: { size_m: [220, 150], layout: hall }
    notes:
      zh: "领地的综合博物馆，在白桦区人民广场旁，展示北维京岛的自然与人文：冰川与峡湾的地貌模型、维京石垒出土的工具、塔夫鲁纳克人的农牧用具、巴克汉姆商港的货单与秤砣，以及领地设立后的城市规划图。大厅中央是一座可以升降的全岛地形沙盘，按下按钮，各座城市会依次亮灯，孩子们最爱按的是马斯林山，因为那里会亮起一枚小火箭。每到周日上午，馆员用三种语言轮流带领免费导览。"
      en: "The territory's general museum, beside People's Square in Birchwood, covers the island's nature and people: models of its glaciers and fjords, tools excavated at the Viking stone fort, the farming and herding gear of the Tavrunaq, cargo lists and scale weights from the Buckham trading ports, and the city plans drawn after the territory was founded. In the centre of the hall stands a relief model of the whole island; press a button and the cities light up one by one, and children's favourite is Maslin Mountain, where a little rocket lights up. On Sunday mornings the staff give free guided tours in each of the three languages in turn."

  - id: bld_5zev8b
    subtype: theatre
    status: generated
    names:
      zh: 自由市大剧院
      en: Freedom City Grand Theatre
      art-x-viking: Großes Theater Freistad
      art-x-buckham: Gran Teatro di Frei
    in: div_16cxr8
    offset_km: [2.12, 0.87]
    site: { size_m: [200, 150], layout: hall }
    notes:
      zh: "自由市的大剧院，在白桦区人民广场边，上演歌剧、话剧、音乐会和舞蹈，领地交响乐团常驻这里。剧院的字幕屏同时显示中文、维京语和巴克汉姆语三种字幕，观众笑说看一场戏能顺便学三种语言。每年领地议会开幕的晚上，剧院都会举办一场免费的公众音乐会，演出在广场上同步直播，裹着毯子坐在广场上看大屏幕是首府人的冬夜传统。"
      en: "Freedom City's grand theatre, on People's Square in Birchwood, staging opera, drama, concerts and dance, and home to the territorial symphony orchestra. Its surtitle screens show Chinese, Viking and Buckham at once, and audiences joke that one show teaches you three languages. On the evening the territorial parliament opens, the theatre gives a free public concert relayed live to a big screen on the square, and sitting out on the square under a blanket to watch it is one of the capital's winter-night traditions."

  - id: bld_cv6swy
    subtype: library
    status: generated
    names:
      zh: 领地图书馆
      en: Territorial Library
      art-x-viking: Landesbibliothek
      art-x-buckham: Biblioteca Territoriale
    in: div_16cxr8
    offset_km: [0.61, 0.89]
    site: { size_m: [160, 120], layout: hall }
    notes:
      zh: "领地的总图书馆，在白桦区人民广场旁，收藏中文、维京语、巴克汉姆语和塔夫鲁纳克语的图书与地方文献，领地法规和议会记录也存放在这里。冬天图书馆开到午夜，阅览室的长桌上亮着一排排绿罩台灯，窗外是积雪的人民广场。借书证上印着领地旗，孩子们拿到第一张借书证时，馆员会在背面盖一枚八角星的印章，许多人成年后还把这张旧借书证留在钱包里。"
      en: "The territory's main library, beside People's Square in Birchwood, holds books and local records in Chinese, Viking, Buckham and Tavrunaq, and is also where the territory's laws and parliamentary records are kept. In winter it stays open until midnight, rows of green-shaded lamps glowing on the long reading-room tables above the snow-covered square. Library cards carry the territory flag, and when children receive their first card the librarian stamps an eight-pointed star on the back; many people still keep that old card in their wallets as adults."

  - id: bld_dh9ze4
    subtype: townhall
    status: generated
    names:
      zh: 自由市政厅
      en: Freedom City Hall
      art-x-viking: Rathaus Freistad
      art-x-buckham: Municipio di Frei
    in: div_16cxr8
    offset_km: [-0.53, 0.07]
    site: { size_m: [180, 130], layout: hall }
    notes:
      zh: "自由市的市政厅，在白桦区，市长办公室和市议会都在这里。顶层是婚姻登记处，大窗正对着两河之间的台地，新人登记后喜欢在窗前拍一张能同时看见自由河和北河的照片，本地人管这叫「两河照」。市政厅一楼的大厅对市民开放，墙上挂着自由市的旗帜和历任市议会的合影，冬天这里还是街头艺人避寒演出的地方。"
      en: "Freedom City's city hall, in Birchwood, housing the mayor's office and the city council. The top floor is the marriage registry, whose great window faces the terrace between the two rivers; after registering, couples like a photo at the window with both the Freedom River and the North River in view, which locals call \"the two-river picture\". The ground-floor hall is open to the public, hung with the city flag and photographs of past city councils, and in winter street performers come in from the cold to play there."

  - id: bld_d262pb
    subtype: tower
    status: generated
    names:
      zh: 自由塔
      en: Liberty Tower
      art-x-viking: Freiheitsturm
      art-x-buckham: Torre della Libertà
    notes:
      zh: "广播电视塔，自由市最高建筑。塔顶的观景台能望见自由河与北河夹着的整片台地，秋天白桦叶黄时，台地染成一片金色。自由塔每晚亮起深蓝和金色，正是领地旗的颜色，自由市人回家时远远看见它就知道快到了。"
      en: "Broadcasting tower, the tallest structure in Freedom City. Its observation deck overlooks the whole terrace between the Freedom and North rivers, which turns gold in autumn when the birches change. Each night it is lit in deep blue and gold, the colours of the territory flag, and Freedom City people know they are nearly home when they see it from afar."
    in: div_16cxr8
    offset_km: [-0.11, 1.25]
    site: { size_m: [90, 90], layout: tower }

  - id: poi_gst9cv
    subtype: university
    status: generated
    names:
      zh: 北维京岛大学
      en: University of North Viking Island
      art-x-viking: Universität Hea Veiling
      art-x-buckham: Università di Teatu Viking
    in: div_16cxr8
    offset_km: [-3.38, 0.39]
    site: { size_m: [900, 650], layout: campus }
    notes:
      zh: "北维京岛领地的综合性大学，主校区在白桦区，靠近人民广场，与自由市中心医院合作培养医生，也开设法律、公共管理、教育和三种语言的语言文学专业，领地的许多公务员和教师都从这里毕业。毕业典礼在人民广场上举行，毕业生们把学位帽抛向天空后，会排队走过白桦区的议员林，按老传统在林边种下一棵小白桦。校园里的学生食堂以一道「三语汤」出名，中文叫鳕鱼土豆汤，维京语和巴克汉姆语的名字各不相同。"
      en: "The territory's comprehensive university, with its main campus in Birchwood near People's Square. It trains doctors with the Freedom City Central Hospital and also teaches law, public administration, education and the language and literature of all three languages; many of the territory's civil servants and teachers studied here. Graduation is held on People's Square: after throwing their caps in the air the graduates file past the Members' Wood in Birchwood and, by an old tradition, plant a young birch at its edge. The student canteen is known for its \"three-language soup\", cod and potato soup in Chinese, with quite different names in Viking and Buckham."

  - id: bld_7zgazx
    subtype: hospital
    status: generated
    names:
      zh: 自由市中心医院
      en: Freedom City Central Hospital
      art-x-viking: Zentralkrankenhaus Freistad
      art-x-buckham: Ospedale Centrale di Frei
    in: div_16cxr8
    offset_km: [1.55, -0.89]
    site: { size_m: [400, 300], layout: campus }
    notes:
      zh: "领地的中心医院，在白桦区，与北维京岛大学合作培养医生，承担全岛的疑难重症救治。洛龙山、雅利基卢克等偏远山区的急救病人常由直升机送到医院楼顶的停机坪，冬季大雪封路时，这条「空中通道」格外忙碌。医院大厅里放着一架钢琴，每天中午由志愿者弹奏半小时，来复诊的老人们常常提前到，坐在长椅上一边等号一边听。"
      en: "The territory's central hospital, in Birchwood, trains doctors with the University of North Viking Island and treats the island's most serious and complex cases. Emergency patients from remote mountain areas such as Lorond Mountain and Jaalikiluk are often flown to the helipad on the roof, and in winter, when snow closes the roads, this \"air corridor\" is especially busy. A piano stands in the main hall and volunteers play it for half an hour every day at noon; elderly patients coming for check-ups often arrive early to listen from the benches while they wait their turn."

  - id: poi_xv5v45
    subtype: stadium
    status: generated
    names:
      zh: 自由市体育中心
      en: Freedom City Sports Centre
      art-x-viking: Sportzentrum Freistad
      art-x-buckham: Centro Sportivo di Frei
    in: div_16cxr8
    offset_km: [0.08, -2.83]
    site: { size_m: [330, 260], layout: stadium }
    notes:
      zh: "自由市的综合体育中心，在白桦区，有田径场、游泳馆和一座室内冰场，领地运动会的开幕式和大部分比赛都在这里举行。运动会开幕时，各市代表队举着市旗依次入场，看台上的观众认旗喊城，喊得最响的往往是维京港和贝克勒的球迷。冬天冰场是业余冰球联赛的主场，机关和学校各有球队，赛后输球的一队要请对手喝热巧克力。"
      en: "Freedom City's sports complex, in Birchwood, with an athletics stadium, a swimming centre and an indoor ice rink; the opening ceremony and most events of the territorial games are held here. At the opening each city's team marches in behind its city flag, the crowd calling out each city as its flag appears, and the loudest cheers usually come from the fans of Viking Port and Beckerle. In winter the rink is home to an amateur ice hockey league in which government offices and schools field teams, and after each game the losing side buys their opponents hot chocolate."

  - id: bld_eewr9c
    subtype: marketplace
    status: generated
    names:
      zh: 北河市场
      en: North River Market
      art-x-viking: Nordflussmarkt
      art-x-buckham: Mercato del Rivo Nord
    in: div_b1dx32
    offset_km: [0.5, 0.3]
    site: { size_m: [140, 80], layout: market }
    notes:
      zh: "自由市最大的综合市场，在北河区北河大道边，室内是肉铺、鱼摊和面包房，室外是成排的农家摊位。周末北部牧场的农户把奶酪、黄油、酸奶和时令蔬菜运来，奶酪摊有让客人先尝后买的规矩，一圈尝下来差不多就吃饱了。冬天市场里最热闹的是热奶冻摊和热苹果酒摊，夏天傍晚北河边的露天集市也从这里开始，一直摆到河滨步道上。"
      en: "Freedom City's largest general market, on North River Avenue in North River District, with butchers, fishmongers and bakeries indoors and rows of farm stalls outside. At weekends farmers from the northern pastures bring cheese, butter, yoghurt and seasonal vegetables, and the cheese stalls let customers taste before they buy; one round of tasting is almost a meal. In winter the busiest stalls sell hot milk jelly and hot cider, and on summer evenings the open-air market along the North River starts here and spreads onto the riverside walk."

  - id: bld_yn4gzk
    subtype: marketplace
    status: generated
    names:
      zh: 沙洲老渔市
      en: Sandbar Old Fish Market
      art-x-viking: Alter Fischmarkt Sandbank
      art-x-buckham: Vecchio Mercato del Pesce di Banco Sabbia
    notes:
      zh: "河口老港区的鱼市，沙洲区最早的街巷围绕它形成。鱼市最有名的是鳕鱼浓汤，冬天排队买汤的人一直排到钟楼脚下。清晨的拍卖还沿用老规矩，拍卖师摇一只铜铃开场，渔民和饭馆老板举手叫价，整箱的鳕鱼几分钟就换了主人。"
      en: "The fish market of the old river-mouth harbour; the first lanes of Sandbar District grew around it. The market is best known for its thick cod soup, and on winter days the queue for it stretches to the foot of the clock tower. The dawn auction keeps the old ways: the auctioneer opens with a brass bell, fishermen and restaurant owners bid by raising a hand, and whole boxes of cod change hands in minutes."
    in: div_g4a8q0
    offset_km: [0.3, 0.2]
    site: { size_m: [160, 90], layout: market }

  - id: bld_q4f5ec
    subtype: tower
    status: generated
    names:
      zh: 沙洲钟楼
      en: Sandbar Clock Tower
      art-x-viking: Uhrturm Sandbank
      art-x-buckham: Torre dell'Orologio di Banco Sabbia
    in: div_g4a8q0
    offset_km: [-0.25, 0.15]
    site: { size_m: [60, 60], layout: tower }
    notes:
      zh: "沙洲区老渔市旁的钟楼，是自由市港区的地标。钟声曾为出海的渔民报时，清晨第一声钟响，渔船就解缆出港，如今钟楼每个整点仍会敲响。冬天老渔市卖鳕鱼浓汤的摊位前，排队的人常常一直排到钟楼脚下，等汤的人就数着钟声估算还要等多久。钟楼的顶层对游客开放，从这里能看到自由河入海口的沙洲、湿地和远处的海面。"
      en: "The clock tower beside the old fish market in Sandbar, landmark of Freedom City's waterfront. Its bell once kept time for the fishermen: at the first stroke of morning the boats cast off, and it still strikes every hour. On winter days the queue for cod soup at the old fish market often stretches to the foot of the tower, and people waiting count the strokes to judge how much longer it will be. The top of the tower is open to visitors and looks out over the sandbars and wetlands of the Freedom River's mouth to the sea beyond."

  - id: poi_mecb4f
    subtype: park
    status: generated
    names:
      zh: 沙洲公园
      en: Sandbar Park
      art-x-viking: Sandbankpark
      art-x-buckham: Parco di Banco Sabbia
    in: div_g4a8q0
    offset_km: [0, -0.5]
    site: { size_m: [500, 380], layout: park }
    notes:
      zh: "建在自由河口沙丘上的公园，是沙洲区最大的绿地。一条木栈道穿过沙丘和湿地通到河口，春秋两季可以看到成群的候鸟停歇，栈道边的观鸟屋里贴着本地小学生画的鸟类图鉴。退潮时孩子们在滩上捡贝壳、追螃蟹，傍晚首府的居民常在这里散步看日落，再到附近的老渔市吃一碗鳕鱼汤。"
      en: "A park on the dunes at the mouth of the Freedom River and the largest green space in Sandbar. A boardwalk crosses the dunes and the wetland to the estuary, where flocks of migrating birds stop over in spring and autumn, and the hide beside it is papered with a bird guide drawn by local schoolchildren. At low tide children collect shells and chase crabs on the flats, and in the evening people from the capital come to walk and watch the sunset before a bowl of cod soup at the old fish market nearby."

  # ── 交通设施（M8）──
  - id: poi_g4z5j4
    subtype: airport
    status: generated
    names:
      zh: 维京港国际机场
      en: Viking Port International Airport
      art-x-viking: Internationaler Flughafen Veiling Havn
      art-x-buckham: Aeroporto Internazionale di Veiling Porto
    notes:
      zh: "领地最繁忙的机场，两条平行跑道，位于瓦尔维克区城区以东的平原上。到达大厅里挂着一面巨大的维京港市旗，下面写着一句维京语的欢迎词，大意是「到老港了，把雨衣穿上」。机场的地铁站直通格约特斯塔德老城，许多旅客下飞机后的第一顿饭，就是老城里的熏鲱鱼和鱼丸汤。"
      en: "The territory's busiest airport, with two parallel runways on the plain east of the Walvik District town. A huge Viking Port flag hangs in the arrivals hall above a welcome in Viking that roughly means \"you're in the Old Port, put your raincoat on\". The airport metro runs straight to old Grjotstad, and for many travellers the first meal after landing is smoked herring and fish-ball soup in the old town."
    in: div_z29w6h
    offset_km: [7, 0]
    site: { size_m: [4200, 1500], layout: airport, angle_deg: 90 }

  - id: poi_3tcbx9
    subtype: airport
    status: generated
    names:
      zh: 自由市机场
      en: Freedom City Airport
      art-x-viking: Flughafen Freistad
      art-x-buckham: Aeroporto di Frei
    notes:
      zh: "首府的机场，在白桦区南郊，地铁 2 号线直达。首府的机场不大，从下飞机到坐上地铁通常不用十分钟。冬天跑道和自行车道一样被优先清扫，自由市人笑说在这里「飞机和自行车享受同等待遇」。"
      en: "The capital's airport on the southern edge of Birchwood District, at the end of Metro Line 2. The capital's airport is small, and it usually takes under ten minutes from leaving the plane to boarding the metro. In winter its runway, like the city's cycle paths, is cleared first, so Freedom City people joke that \"planes and bikes get equal treatment\"."
