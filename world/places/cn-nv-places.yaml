  # ── 马斯林山军事与航天设施（M25）：空军 ──
  - id: poi_f12qtt
    subtype: air_base
    status: generated
    names:
      zh: 东营空军基地
      en: East Camp Air Base
      art-x-viking: Luftwaffenstützpunkt Ostlager
      art-x-buckham: Base Aerea di Campo Est
    notes:
      zh: 东营空军基地位于东营区北部的平原上，是马斯林山上空防空作战的主基地，担负发射与降落中心、深空太空军指挥中心和整个马斯林盆地的空中掩护。基地有两条平行跑道，一条供日常起降，另一条兼作备用跑道和夜航训练；滑行道外侧分布着数十座加固机库，以环形滑行道相连，战机可以从机库直接滑出起飞。机务区、油库和塔台集中在跑道的另一侧，弹药库分散在远离跑道的土堤后面。马斯林山冬季漫长，跑道和滑行道铺设了融雪系统，除雪车队可在暴雪停止后一小时内恢复起降。每逢发射窗口，基地都会派出战斗机在发射场上空轮流巡逻，确保空域内没有不明飞行器。基地经马斯林山空天高速与城区和雪谷的两座基地相连，负责大修的东营航空修理厂就在跑道附近。
      en: East Camp Air Base stands on the plain in the north of East Camp District and is the main base for air defence over Maslin Mountain, covering the launch and landing centre, the Deep Space Force command centre and the whole Maslin basin. It has two parallel runways, one for everyday traffic and one kept as a spare and for night training. Beyond the taxiway stand dozens of hardened shelters on looping taxiways, so fighters can roll straight out of cover and take off. Maintenance, the fuel farm and the tower are grouped on the other side of the runways, and the ammunition stores are scattered behind earth banks well away from them. Winters at Maslin are long, so the runways and taxiways have built-in snow melting and the clearing teams can reopen the field within an hour of a blizzard ending. In every launch window the base keeps fighters on patrol over the launch site so that no unknown aircraft enters the airspace. The Maslin Aerospace Expressway links it to the city and the two bases in Snow Valley, and the East Camp Aircraft Repair Plant, which overhauls its aircraft, is close by.
    in: div_tc0ngk
    offset_km: [2.83, 17.68]
    site: { size_m: [4200, 2400], layout: airbase, variant: fighter, angle_deg: 120 }
    military:
      unit:
        zh: 空军第七航空基地（歼击航空兵第 71 旅）
        en: 7th Air Base, Air Force (71st Fighter Brigade)
      branch: { zh: 空军, en: Air Force }
      equipment:
        zh: 多用途歼击机两个大队约 48 架，另有教练机与联络机若干
        en: Two groups of multirole fighters, about 48 aircraft, plus trainers and liaison aircraft
      personnel: 4800
      access:
        zh: 军事禁区，不对外开放；每年航空开放日对公众开放一天
        en: Restricted military area, closed to the public except for one open day a year
  - id: poi_ez2t6k
    subtype: air_base
    status: generated
    names:
      zh: 雪谷空军基地
      en: Snow Valley Air Base
      art-x-viking: Luftwaffenstützpunkt Schneetal
      art-x-buckham: Base Aerea di Valle Neve
    notes:
      zh: 雪谷空军基地位于雪谷区南部的开阔谷底，驻有预警指挥机、空中加油机和大型运输机，是马斯林山空中力量的后方基地。预警指挥机升空后可以监视全岛及周边海域的空情，与西岭和星港的雷达站一起组成高低搭配的多层预警网；加油机让东营的战斗机能在发射窗口期间长时间留空巡逻。运输机承担部队机动、航天员转运和紧急物资空运，必要时也能把较小的航天器部件直接运往西坪。基地有两条平行跑道，宽大的停机坪旁是能容纳大型飞机的机库。雪谷积雪期长，机库全部采用保温设计，飞机出库前先在除冰坪上喷洒除冰液。基地与东侧的空天飞机基地共用油库和消防力量，两者都在马斯林山空天高速的南端。
      en: Snow Valley Air Base lies on the open valley floor in the south of Snow Valley District and is home to airborne early-warning aircraft, tankers and heavy transports, the rear base of Maslin Mountain's air power. Once airborne, the early-warning aircraft watch the air over the whole island and the surrounding seas, forming a layered warning net with the radar stations at West Ridge and Starport. The tankers let the East Camp fighters stay on patrol for hours during launch windows. The transports move troops, astronauts and urgent supplies, and can fly smaller spacecraft parts straight to West Heath. The base has two parallel runways and wide aprons beside hangars big enough for large aircraft. Snow lies long in the valley, so every hangar is insulated and aircraft are sprayed on a de-icing pad before take-off. It shares its fuel farm and fire service with the spaceplane base to the east, and both sit at the southern end of the Maslin Aerospace Expressway.
    in: div_0tsyzy
    offset_km: [2.12, -9.9]
    site: { size_m: [4400, 1800], layout: airbase, variant: heavy, angle_deg: 0 }
    military:
      unit:
        zh: 空军第八航空基地（特种航空兵第 82 团、运输航空兵第 83 团）
        en: 8th Air Base, Air Force (82nd Special Mission and 83rd Airlift Regiments)
      branch: { zh: 空军, en: Air Force }
      equipment:
        zh: 预警指挥机 4 架、空中加油机 6 架、大型运输机 12 架
        en: 4 airborne early-warning and control aircraft, 6 tankers and 12 heavy transports
      personnel: 3600
      access: { zh: 军事禁区，不对外开放, en: "Restricted military area, closed to the public" }
  - id: poi_4mbfqk
    subtype: air_base
    status: generated
    names:
      zh: 星港无人机基地
      en: Starport Drone Base
      art-x-viking: Drohnenbasis Sternhafen
      art-x-buckham: Base Droni di Porto Stella
    notes:
      zh: 星港无人机基地位于星港区西北的台地上，是马斯林山唯一的无人机基地。高空长航时无人机从这里起飞后，可以连续一两天在北部海域和马斯林山脉上空巡航，把图像实时传回指挥中心，弥补地面雷达在深谷和山背后的盲区。基地只有一条较短的跑道，跑道旁成排的小型机库各停放一架无人机；操作员并不登机，而是在地下控制室里轮班操纵，一个机组可以同时照看多架飞机。无人机对结冰十分敏感，基地配有专门的除冰坪和气象站，遇到冻雾天气会暂停起飞。这里也是空军试飞新型无人机和自主飞行软件的场所。
      en: Starport Drone Base sits on a terrace in the north-west of Starport District and is Maslin Mountain's only drone base. High-altitude long-endurance drones take off here and can cruise for a day or two over the northern seas and the Maslin Range, sending pictures back to the command centre in real time and covering the deep valleys and back slopes that ground radars cannot see. The base has a single short runway lined with small hangars, one aircraft to each. The operators never board; they fly the drones in shifts from an underground control room, each crew minding several aircraft at once. Drones are very sensitive to icing, so the base has its own de-icing pad and weather station and stops flying in freezing fog. It is also where the air force flight-tests new drones and autonomous flight software.
    in: div_nytsvb
