    notes:
      zh: "雅利基卢克河畔集镇上的市政府。雅利基卢克地广人稀，市政府的办事员常常开着越野车或驾着雪地摩托下乡，把证件和补贴直接送到牧民的营地。冬夜里市政府的窗台上也点着一盏蜡烛，和镇上家家户户一样，给走夜路的人照亮。"
      en: "The city government in the market town on the Jaalikiluk. Jaalikiluk is vast and empty, and its clerks often drive out by four-wheel drive or snowmobile to deliver documents and benefits straight to the herders' camps. On winter nights a candle burns on its windowsill too, like those of every house in town, lighting the way for anyone walking at night."
