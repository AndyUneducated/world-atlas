    names:
      zh: 西坪推进剂厂
      en: West Heath Propellant Plant
      art-x-viking: Treibstoffwerk Westheide
      art-x-buckham: Impianto Propellenti di Pianoro Ovest
    notes:
      zh: 西坪推进剂厂位于发射与降落中心南面，生产火箭使用的液氢和液氧。空气分离装置把空气冷却到极低温度，分离出液氧；电解水得到的氢气则在液化装置中冷却成液氢。两种推进剂储存在厂区一排排保温储罐和球罐里，发射前由专用槽车和管道输往发射台，也供应星港的发动机试车台。液氢极易挥发、遇火即燃，工厂与城镇和其他设施保持着足够的安全距离，厂区内严禁明火，所有设备都按防爆标准设计。工厂用电很大一部分来自高原上的风电场，制氢过程几乎不排放温室气体。
      en: The West Heath Propellant Plant, south of the launch and landing centre, makes the liquid hydrogen and liquid oxygen that the rockets burn. Air separation units chill air until the oxygen can be drawn off as a liquid, while hydrogen from the electrolysis of water is cooled to a liquid in a liquefier. Both are stored in rows of insulated tanks and spheres and sent to the pads by tanker and pipeline before each launch; the plant also supplies the engine test stands at Starport. Liquid hydrogen evaporates easily and burns at the slightest spark, so the plant keeps a wide safety distance from towns and other facilities, open flames are banned throughout, and all its equipment is built to explosion-proof standards. Much of its electricity comes from the wind farms on the plateau, so making the hydrogen releases almost no greenhouse gases.
    in: div_nwke3f
