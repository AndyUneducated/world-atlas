      en: North Viking Island Policy and Planning Commission
    short_names:
      zh: 政策和计划委员会
      en: Policy and Planning Commission
    notes:
      zh: 北维京岛领地政策和计划委员会，是政务院直属的特设委员会，位于政务院大街北侧正对议会综合办公区的一端。委员会由总督主持，各部部长和独立专家参加，负责编制领地的中长期发展规划，协调跨部门的重大政策，并评估各项政策的实施效果。航天产业、科学城、贝克勒自由贸易区和通往长船的海底通道这样跨越多个部门的大项目，都先在这里形成方案，再提交议会；委员会每年发布领地发展报告，公开各市人口、产出和公共服务的指标。大楼是一座方形独栋，顶层的大会议室可以俯瞰人民大道。
      en: The North Viking Island Policy and Planning Commission is a special commission directly under the Executive Council, on the north side of Council Row facing the Parliament Complex. Chaired by the governor, with the ministers and independent experts as members, it draws up the territory's medium- and long-term development plans, coordinates major policies that cross ministries and reviews how policies are working. Projects that span several ministries, such as the space industry, Science City, the Beckerle Free Trade Zone and the undersea link to Longship, take shape here before going to the parliament, and every year the commission publishes a development report with figures on each city's population, output and public services. The building is a square block whose top-floor council room looks down People's Avenue.
    in: div_16cxr8
    offset_km: [2.52, 1.92]
    site: { size_m: [90, 90], layout: block }

