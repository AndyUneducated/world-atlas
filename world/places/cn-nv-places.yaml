      en: "The Deep Space Force research campus on Science Avenue. Its laboratory buildings are often lit late into the night, but on clear moonless nights its street lights dim for two hours along with the rest of Stargaze, and the researchers take the chance to step outside and look at the stars."
    in: div_g27nda
    offset_km: [2.55, 1.83]
