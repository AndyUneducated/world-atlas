      zh: 塔夫鲁普库维克农机博物馆
      en: Tavrupukkuvik Farm Machinery Museum
      art-x-viking: Landmaschinenmuseum Tavrupukkuvik
      art-x-buckham: Museo delle Macchine Agricole di Tavrupukkuvik
    notes:
      zh: "从畜力犁到无人驾驶收割机，展出平原机械化农业的历程。馆外停着一排从老到新的拖拉机，孩子们最爱爬上那台最老的红色拖拉机按喇叭。每年春耕前，博物馆会把几台老机器开到田里，和无人驾驶收割机并排跑一圈。"
      en: "From horse-drawn ploughs to driverless combines, the story of mechanised farming on the plain. A row of tractors, oldest to newest, stands outside, and children love to climb up and honk the horn of the oldest, a red one. Each spring before ploughing the museum drives a few of its old machines into the fields for a lap alongside the driverless harvesters."
    in: div_rzw76f
    offset_km: [-0.8, 0.6]
    site: { layout: hall, size_m: [200, 120] }
  - id: poi_qm3z2m
