  - id: bld_0yywnv
    subtype: exhibition_centre
    status: generated
    names:
      zh: 新城国际会展中心
      en: New City International Exhibition Centre
      art-x-viking: Internationales Messezentrum Neustad
      art-x-buckham: Centro Fieristico Internazionale di Neu Teatu
    notes:
      zh: "领地最大的会展场馆，在新城市中苑区的千禧大道旁，主展馆约 520 米长、300 米宽。中苑区是从青坪区析出的新市中心，新城市人民政府、市议会和中苑公园都在附近，会展中心与周边的酒店、写字楼和餐饮街一起形成了会展商务区，银行、保险和律师事务所也纷纷在这里设立分支机构，服务新城和萨科勒的企业。全岛的大型展会、招聘会和汽车展多在这里举行，常年还有工业博览会、教育展和国际会议；萨科勒的工厂来这里展示机床和新能源设备，新城师范学院的毕业生在招聘会上排队投简历。由于商务人员来自各地，展馆里说中文、维京语和巴克汉姆语的人都很多。新城是全岛最年轻的城市之一，儿童和年轻家庭比例很高，展会的主题也常常围着家庭转：育儿用品展、学校开放日和家居展一年要办好几轮。坐地铁1号线可以到中苑区的政务和会展商务区，新城站的维贝真空磁悬浮则把萨科勒、贝克勒和维京港的参展商送到新城。\n每年开春的「新家博览会」最热闹，刚搬到新城的年轻家庭在这里挑家具、比房贷，展馆门口的停车场排满了婴儿车。展馆专门在入口处设了一个婴儿车寄存处，号牌印着新城市旗上的那把金钥匙，散场时找不到自家推车的父母，只要报出号码，工作人员就能从几百辆一模一样的推车里把它推出来。"
      en: "The largest exhibition venue in the territory, on Millennium Avenue in Central Gardens District of New City; its main hall is about 520 m long and 300 m wide. Central Gardens, carved out of Greenmead, is the new city centre, with the New City Government, the city council and Central Gardens Park close by, and together with the surrounding hotels, office blocks and restaurant street the centre forms an exhibition and business quarter where banks, insurers and law firms have opened branches to serve firms in New City and Sakole. Most of the island's big trade shows, job fairs and motor shows are held here, along with industrial fairs, education fairs and international conferences throughout the year; Sakole's factories show their machine tools and new-energy equipment, and graduates of the New City Normal College queue to hand in their CVs at the job fairs. Business visitors come from all over, so Chinese, Viking and Buckham are all widely heard in the halls. New City is one of the youngest cities on the island, with many children and young families, and the shows often revolve around family life, with baby-goods fairs, school open days and home shows held several times a year. Metro Line 1 serves the civic and exhibition quarter of Central Gardens, and the Viking Port–Beckerle Vacuum Maglev at New City Station brings exhibitors from Sakole, Beckerle and Viking Port.\nThe busiest event is the \"New Home Fair\" every spring, when young families who have just moved to New City come to choose furniture and compare mortgages, and the car park outside fills with pushchairs. The centre runs a pushchair check by the entrance whose tags bear the gold key from the city flag; parents who cannot find their own pushchair at closing time only have to give their number, and staff will wheel it out from among hundreds of identical ones."
    in: div_m2tz6c
    offset_km: [0.8, -0.5]
    site: { layout: hall, size_m: [520, 300] }
  - id: poi_4atna2
    subtype: park
    status: generated
    names:
      zh: 中苑公园
      en: Central Gardens Park
      art-x-viking: Mittelgartenpark
      art-x-buckham: Parco del Giardino Centrale
    notes:
      zh: "中苑公园在新城市中苑区，是新城规划新市中心时预留的大公园，占地约 0.45 平方公里，是全市最大的城市公园。中苑区从青坪区北部析出设立，是新城面积最小、密度最高的区，新城市人民政府、市议会和新城国际会展中心都围绕公园排开，新城地铁 1 号线的新城市人民政府站就在公园边上。园内有人工湖、草坪、音乐厅和儿童乐园，夏季的露天音乐会常常座无虚席；会展中心散场后，参展商和观众也爱穿过公园去餐饮街吃晚饭。对周围高层公寓里的年轻家庭来说，这座公园就是自家的后院，周末一早草坪上就铺满了野餐垫。\n傍晚的公园里到处是推着婴儿车散步的年轻父母，其他城市的人因此叫新城「婴儿车之城」。湖边的长椅几乎被带孩子的家长包下，大家交换育儿心得、转让孩子穿小了的冬衣，公园门口的告示栏上贴满了二手童车和保姆的启事。新城的冬天比沿海冷得多，一月夜里常在零下十度以下，人工湖冻实后就成了露天冰场，周末全家一起来滑冰，刚学会走路的孩子推着一把小椅子在冰上挪步。公园管理处每年元旦在冰面上画一条起跑线，举办一场亲子滑冰赛，赢家的奖品是一个印着中苑公园图案的保温杯。"
      en: "Central Gardens Park, in Central Gardens District of New City, is the large park set aside when the new city centre was planned. Covering about 0.45 km², it is the biggest city park in New City. Central Gardens District was carved out of the northern part of Greenmead and is the smallest and most densely built district in the city; the New City Government, the city council and the New City International Exhibition Centre are arranged around the park, and New City Metro Line 1's New City Government station stands at its edge. The park has an artificial lake, lawns, a concert hall and a children's playground, and its open-air concerts in summer are often packed; when the exhibition centre empties out, exhibitors and visitors like to cut through the park to the restaurant street for dinner. For the young families in the surrounding high-rise flats, the park is their own back garden, and on weekend mornings the lawns are covered with picnic blankets.\nIn the evenings the park is full of young parents strolling with prams, which is why people from other cities call New City \"the pram city\". The benches by the lake are practically reserved for parents, who trade advice on child-rearing and pass on winter clothes their children have outgrown, and the noticeboard at the gate is covered with adverts for second-hand pushchairs and childminders. Winters in New City are much colder than on the coast, with January nights often below −10 °C. Once the artificial lake freezes solid it becomes an open-air rink, and families come to skate together at weekends, toddlers pushing a little chair across the ice for balance. Every New Year's Day the park management paints a starting line on the ice for a parent-and-child skating race, and the winners take home a flask printed with a picture of the park."
    in: div_m2tz6c
    offset_km: [-1.1, 0.9]
    site: { layout: park, size_m: [900, 500] }
  - id: bld_xapen6
    subtype: marketplace
    status: generated
    names:
      zh: 青坪购物中心
      en: Greenmead Shopping Centre
      art-x-viking: Einkaufszentrum Grünau
      art-x-buckham: Centro Commerciale Prato Verde
    notes:
      zh: "青坪轨道交通枢纽旁的大型商场。商场门口的周末夜市是新城最地道的去处：烤肠、炸鳕鱼条、勒克尔奶酪焗土豆，还有从岛上各地搬来的家庭带来的家乡菜。商场里的育儿室比停车位还难抢，这也是「婴儿车之城」的特色。"
      en: "A large shopping centre next to the Greenmead transit hub. The weekend night market outside is New City's real place to eat: grilled sausages, fried cod fingers, potatoes baked with Lekor cheese and home dishes brought by families from all over the island. Inside, the baby rooms are harder to get into than the car park, another mark of \"Pram City\"."
    in: div_z8yxye
    offset_km: [0.6, -0.4]
    site: { layout: market, size_m: [260, 160] }
  - id: poi_pa01cb
    subtype: stadium
    status: generated
    names:
      zh: 新城体育中心
      en: New City Sports Centre
      art-x-viking: Sportzentrum Neustad
      art-x-buckham: Centro Sportivo di Neu Teatu
    notes:
      zh: "新城体育中心在新城市青坪区，是新城的主体育场与体育馆，拥有体育场、游泳馆和综合训练馆，占地约 0.09 平方公里，承办过全领地的运动会，平日是社区居民健身的去处。青坪是新城的商业中心和交通枢纽，体育中心与青坪购物中心相邻，南岸公路从区内出发，公交枢纽和长途客运站就在附近，比赛日从萨科勒和贝克勒下班的球迷也能很快赶到。新城是全岛最年轻的城市之一，儿童和年轻家庭比例很高，体育中心的游泳馆周末几乎全被儿童游泳班包下，训练馆里则排满了体操、篮球和羽毛球课；跑道对外开放的傍晚，推着婴儿车慢跑的父母往往比练跑的运动员还多。\n新城的冬天比沿海冷得多，一月夜里常在零下十度以下，体育馆冬天改成冰球场，新城中学联赛的决赛常在这里举行，看台上坐满了带着孩子来助威的年轻父母，加油声里夹着婴儿的哭声，解说员说这是全岛「平均年龄最低的看台」。夏天体育场草坪上会办一场「婴儿车长跑」，家长推着婴儿车跑完五公里，终点线前常有孩子在车里睡着了，家长只好压低脚步冲线；奖牌做成奶嘴的形状，成了新城家庭最爱挂在冰箱上的纪念品。"
      en: "New City Sports Centre, in Greenmead District of New City, is the city's main stadium and sports hall, with a stadium, a swimming pool and a multi-purpose training hall on a site of about 0.09 km². It has hosted the territorial games and is an everyday place for local residents to exercise. Greenmead is New City's commercial centre and transport hub: the sports centre stands next to the Greenmead Shopping Centre, the South Coast Highway starts in the district, and the bus interchange and coach station are close by, so on match days fans coming off work in Sakole and Beckerle can get here quickly. New City is one of the youngest cities on the island, with many children and young families; at weekends the pool is booked almost entirely by children's swimming classes, and the training hall is full of gymnastics, basketball and badminton lessons; on evenings when the track is open to the public, parents jogging with prams often outnumber the athletes in training.\nWinters in New City are much colder than on the coast, with January nights often below −10 °C. In winter the sports hall becomes an ice hockey rink, and the finals of the New City secondary school league are often played here, the stands filled with young parents who have brought their little ones to cheer; babies' cries mingle with the chanting, and the commentators call it the island's \"youngest crowd\". In summer the stadium lawn hosts a \"pram run\", in which parents push prams over five kilometres; children often fall asleep in their prams before the finish, and their parents have to tiptoe across the line. The medals are shaped like dummies and have become New City families' favourite thing to stick on the fridge."
    in: div_z8yxye
    offset_km: [-1.8, 1.3]
    site: { layout: stadium, size_m: [340, 260] }
  - id: poi_095gba
    subtype: school
    status: generated
    names:
      zh: 新城第一中学
      en: New City No. 1 High School
      art-x-viking: Erstes Gymnasium Neustad
      art-x-buckham: Primo Liceo di Neu Teatu
    notes:
      zh: "北苑区成片新社区配套的重点中学。每逢大雪，学校就把操场浇成溜冰场，体育课改成滑冰课，新城的孩子几乎个个会滑冰。学校的冰球队是全岛中学联赛的常客，比赛日北苑区的家长们会举着自制的标语来助威。"
      en: "The leading high school of the new North Gardens estates. When heavy snow falls the school floods its playground into an ice rink and PE becomes skating, so nearly every child in New City can skate. Its ice hockey team is a regular in the island's school league, and on match days North Gardens parents turn out with home-made banners."
    in: div_s1qwxh
