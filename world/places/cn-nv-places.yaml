    names:
      zh: 塔夫鲁普库维克农业学院
      en: Tavrupukkuvik Agricultural College
      art-x-viking: Landwirtschaftliche Hochschule Tavrupukkuvik
      art-x-buckham: Istituto Agrario di Tavrupukkuvik
    notes:
      zh: "农学、农机与食品加工的学院，试验田一直延伸到城外。学院的试验田每年秋天都会推出几个新的土豆品种，参加普库图克的土豆品尝会，学生们最大的梦想是自己培育的品种被评为「年度土豆」。"
      en: "A college of agronomy, farm machinery and food processing, with trial fields reaching out of town. Each autumn its trial fields put forward a few new potato varieties for the Pukkutuuq potato tasting, and students' greatest ambition is to see a variety they bred named \"potato of the year\"."
