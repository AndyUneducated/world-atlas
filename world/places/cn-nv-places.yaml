  - id: bld_0bp3k2
    subtype: tower
    status: generated
    names:
      zh: 斯佩基亚拉国际金融中心
      en: Specchiara International Finance Centre
      art-x-viking: Internationales Finanzzentrum Specchiara
      art-x-buckham: Centro Finanziario Internazionale di Specchiara
    notes:
      zh: "斯佩基亚拉天际线上最高的塔楼，矗立在贝克勒自由贸易区斯佩基亚拉区的湾畔，与另一座塔楼并称斯佩基亚拉国际金融中心的「双塔」，占地约 140 米见方。离岸银行、结算机构、财富管理公司、保险与航运金融机构以及跨国公司的区域总部集中于此，附近就是进行金属、粮食和能源期货交易的贝克勒国际商品交易所和贝克勒自由贸易区管理委员会，这一带是全领地的金融高地。斯佩基亚拉区是全领地人均产出最高的区，自贸区实行全领地最自由的经济政策，货物进出免征关税，资本自由流动，企业注册和外籍人员居留手续极其简便，楼里的职员来自世界各地，中文、维京语、巴克汉姆语和英语在电梯间里混着说。塔顶的观景层能望见整个斯佩基亚拉湾和湾心的镜岛，晴天傍晚，塔楼的影子会一直伸到湾面上；楼下的斯佩基亚拉滨海公园是职员们午休散步的地方。\n楼里的电梯按「晨间市场」和「夜间市场」分组，跟着世界各地的交易时间轮流忙碌，深夜加班的交易员下楼时，往往正碰上清晨来上班的同事。夜里收市后，不少人结伴去保税港区码头边的夜宵摊吃炸鱼、喝热汤，看集装箱船在灯光下进出，贝克勒人自嘲「这里的一分钟只有五十秒」，说的正是这栋楼里的节奏。"
      en: "The tallest tower on the Specchiara skyline, standing on the bayfront in Specchiara District of the Beckerle Free Trade Zone; with its companion tower it forms the \"twin towers\" of the Specchiara International Finance Centre, on a footprint about 140 m square. Offshore banks, clearing houses, wealth managers, insurers, shipping finance houses and the regional headquarters of multinationals are concentrated here, and nearby are the Beckerle International Commodity Exchange, which trades metal, grain and energy futures, and the Beckerle Free Trade Zone Administration, making this the territory's financial high ground. Specchiara is the district with the highest output per head in the territory, and the free trade zone has the territory's most liberal economic policy: goods move in and out duty-free, capital flows freely, and company registration and residence for foreign staff are extremely simple. The tower's staff come from all over the world, and Chinese, Viking, Buckham and English mingle in the lift lobbies. The observation level at the top looks out over the whole of Specchiara Bay and Mirror Isle in the middle, and on clear evenings the tower's shadow stretches far out over the water; Specchiara Waterfront Park below is where staff take their lunchtime walks.\nIts lifts are grouped as \"morning markets\" and \"evening markets\", busy in turn as trading opens and closes around the world, and traders leaving after a late night often meet colleagues arriving for the early shift. After the markets close at night, many go together to the late-night stalls by the quays of the bonded port for fried fish and hot soup, watching container ships come and go under the lights. Beckerle people joke that \"a minute here has only fifty seconds\", and they mean the pace inside this building."
    in: div_8p9k5t
    offset_km: [0.9, -0.3]
    site: { layout: tower, size_m: [140, 140] }
  - id: bld_31xavn
    subtype: office
    status: generated
