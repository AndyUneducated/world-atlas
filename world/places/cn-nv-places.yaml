      en: Aaqqiniq Museum
      art-x-viking: Museum Aaqqiniq
      art-x-buckham: Museo di Aaqqiniq
    notes:
      zh: "拆市前马斯林山市的市府旧址，现为讲述东北部开发与驯鹿牧业的博物馆。夏天博物馆门口总有老人摆摊卖手缝的驯鹿皮手套。馆里的一面墙挂着上百只驯鹿的耳标，每一只都对应一户牧民家庭的记号，老牧民来参观时常常能找到自家祖辈的那一只。"
      en: "The seat of the old Maslin Mountain City before the split, now a museum of the settlement of the north-east and its reindeer herding. In summer elderly people sell hand-sewn reindeer-skin mittens outside. One wall holds hundreds of reindeer ear marks, each the sign of a herding family, and old herders visiting often find the one used by their own grandparents."
