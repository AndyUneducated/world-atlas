  - id: poi_bkhms6
    subtype: command_centre
    status: generated
    names:
      zh: 群峰地下指挥城
      en: High Peaks Underground Command Complex
      art-x-viking: Unterirdische Kommandostadt Gipfel
      art-x-buckham: Città di Comando Sotterranea delle Vette
    wonder:
      zh: 世界唯一的地下指挥城，藏在数百米厚的岩层之下
      en: The only underground command city in the world, under hundreds of metres of rock
    notes:
      zh: 群峰地下指挥城开凿在群峰训练管理区东南部的山体深处，是深空太空军在马斯林山的备用指挥所。地面上只能看到几处隧道口、通风竖井、一座直升机坪和几副天线，主体全部藏在数百米厚的岩层之下：长长的隧道通往指挥大厅、数据中心、宿舍、食堂、医院和仓库，像一座地下的小城。山体内建有独立的电站、蓄水池和空气过滤系统，即使与外界完全隔绝，也能维持两千人在里面生活和工作数月。平时这里与星港指挥中心同步值班，一旦指挥中心受损或通信中断，指挥权会立即转到这里。指挥城对外的通信经由多条不同走向的光缆和卫星链路，任何一条中断都不影响指挥。隧道口开在朝向山坡的一侧，冬季积雪时由专门的除雪设备保持畅通。
      en: The High Peaks Underground Command Complex is cut deep into the mountains in the south-east of the High Peaks Training Area and is the Deep Space Force's alternate command post at Maslin Mountain. On the surface there is little to see beyond a few tunnel portals, ventilation shafts, a helipad and some antennas; everything else lies under hundreds of metres of rock, where long tunnels lead to a command hall, a data centre, dormitories, canteens, a hospital and stores, a small town underground. It has its own power plant, water reservoirs and air filtration, so two thousand people could live and work inside for months cut off from the outside world. In normal times it keeps watch alongside the Starport Command Centre, and if that centre is damaged or loses contact, command passes here at once. Its links to the outside run over several fibre routes in different directions and over satellite, so no single break can cut it off. The portals open into the hillside, and in winter dedicated snow clearing equipment keeps them free.
    in: div_q5h8zp
    offset_km: [12.73, -6.36]
    site: { size_m: [1400, 900], layout: bunker, angle_deg: 0 }
    access_road: true
    military:
      unit: { zh: 深空太空军马斯林山备用指挥所, en: Deep Space Force Maslin Mountain Alternate Command Post }
      branch: { zh: 深空太空军, en: Deep Space Force }
      equipment:
        zh: 山体内的指挥大厅、数据中心与独立电站、水源，可供两千人连续生活三个月
        en: A command hall, data centre and its own power and water inside the mountain, enough for 2,000 people for three months
      personnel: 2400
      access: { zh: 军事禁区，不对外开放, en: "Restricted military area, closed to the public" }
  - id: poi_z3t3wk
    subtype: ground_station
    status: generated
    names:
      zh: 星港深空测控站
      en: Starport Deep Space Station
      art-x-viking: Tiefraumstation Sternhafen
      art-x-buckham: Stazione di Spazio Profondo di Porto Stella
    notes:
      zh: 星港深空测控站建在星港区西南的山谷里，四周被群峰的山梁环抱，远离城镇和电台的干扰，是深空太空军与远航航天器保持联系的主要地面站。站内最大的一副天线反射面直径数十米，能接收来自遥远行星际空间的微弱信号；其余五副较小的天线跟踪轨道上的卫星和飞船。火箭从西坪或星港升空后，测控站要在几分钟内捕获目标，接收遥测数据并发送指令；对于飞往深空的探测器，它在此后的数年里一直是地面上倾听它的耳朵。山谷的地形天然屏蔽了电磁干扰，测控站周围数公里划为无线电静默区，禁止使用大功率发射设备。站区还有一座数据处理中心，接收的数据经专用光缆实时传往星港指挥中心。冬季天线面板容易结霜，大天线配有加热系统，保证全年不间断工作。
      en: Starport Deep Space Station lies in a valley in the south-west of Starport District, ringed by the ridges of the High Peaks and far from the interference of towns and transmitters, and is the Deep Space Force's main ground station for keeping in touch with spacecraft on long voyages. Its largest antenna has a dish tens of metres across that can pick up faint signals from deep interplanetary space, while five smaller antennas track satellites and crewed ships in orbit. When a rocket lifts off from West Heath or Starport the station must acquire it within minutes, receiving telemetry and sending commands, and for a probe bound for deep space it remains the ear on the ground for years afterwards. The valley shields the site from electromagnetic noise, and several kilometres around it are a radio quiet zone where high-power transmitters are banned. A data processing centre on site sends everything it receives over a dedicated fibre line to the Starport command centre in real time. In winter the dish panels frost easily, so the big antenna is heated to keep working all year.
    in: div_nytsvb
    offset_km: [-9.19, -4.24]
    site: { size_m: [2400, 1400], layout: antenna, variant: large, angle_deg: 0 }
    access_road: true
    military:
      unit: { zh: 深空太空军第三测控站, en: "3rd Tracking Station, Deep Space Force" }
      branch: { zh: 深空太空军, en: Deep Space Force }
      equipment:
        zh: 深空测控天线 6 副，其中大口径天线 1 副
        en: 6 deep-space antennas, including one very large dish
      personnel: 450
      access: { zh: 每年航天日向公众开放, en: Open to the public on Space Day each year }
  - id: poi_211t54
    subtype: ground_station
    status: generated
    names:
      zh: 和平卫星地面站
      en: Peace Satellite Ground Station
      art-x-viking: Satellitenbodenstation Frieden
      art-x-buckham: Stazione Satellitare di Pace
    notes:
      zh: 和平卫星地面站位于和平区北部的平原上，是马斯林山驻军与外界之间的主要卫星通信枢纽。八副天线分别对准不同的通信卫星，承担指挥中心、各基地与领地首府之间的话音、数据和视频传输；当海底光缆或山区线路中断时，这里就是马斯林山与外界最可靠的联系。地面站同时接收气象卫星的云图，为全岛的天气预报和每次发射的气象保障提供资料。站区的天线排成两列，以道路相连，一侧是机房和发电站，备用电源能让设备在停电后独立运行数天。
      en: Peace Satellite Ground Station, on the plain in the north of Peace District, is the main satellite communications hub between the Maslin Mountain garrison and the outside world. Its eight antennas each point at a different communications satellite, carrying voice, data and video between the command centre, the bases and the territorial capital, and when an undersea cable or a mountain line fails it is Maslin's most dependable link. It also receives cloud images from weather satellites for the island's forecasts and the weather support of every launch. The antennas stand in two rows joined by roads, with the equipment rooms and a power station to one side; the backup supply can keep everything running for days if the grid goes down.
    in: div_nvrjpg
