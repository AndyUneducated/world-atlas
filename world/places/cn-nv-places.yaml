  - id: poi_z7rtqh
    subtype: missile_site
    status: generated
    names:
      zh: 和平防空阵地
      en: Peace Air Defence Site
      art-x-viking: Flugabwehrstellung Frieden
      art-x-buckham: Postazione Contraerea di Pace
    notes:
      zh: 和平防空阵地位于和平区南部，负责马斯林山城区、航天员训练中心和南面雪谷方向的空中防御。三座地空导弹阵地中，它离居民区最近，因此射击扇区和残骸落区受到严格限制，只朝城区以外的方向拦截目标。阵地平时进行大量模拟训练：控制车里的模拟系统会生成各种来袭目标，操作员反复练习发现、跟踪和拦截。每年夏季，三座阵地的部队会到群峰空军靶场与战斗机进行联合演练。阵地周边种植了防护林，从城区方向几乎看不到阵地内的设施。
      en: Peace Air Defence Site lies in the south of Peace District and defends the city of Maslin Mountain, the astronaut training centre and the approaches from Snow Valley to the south. Of the three missile sites it is the closest to where people live, so its firing sectors and debris zones are tightly limited and it engages targets only away from the city. Most of its training is simulated, with the control vehicle generating every kind of incoming target for the operators to detect, track and engage again and again. Each summer the crews of all three sites join the fighters for combined exercises at the High Peaks Air Weapons Range. A shelterbelt of trees around the site hides almost all of it from the city side.
