      en: "Northwest City's airport, on the western edge of Deersong District, flies mainly within the island, and researchers and space engineers make up a large share of its passengers. Crates marked \"precision instruments, handle with care\" are a common sight on the baggage belts, so the airport runs a separate instrument check-in where trained handlers load and unload by hand. A huge chart of North Viking Island's winter sky, a gift from the Stargaze Observatory, hangs in the departure hall, and waiting children like to hunt for their own constellations on it."

  - id: poi_0efptf
