      en: Pukkutuuq Produce Distribution Centre
      art-x-viking: Agrarumschlagplatz Pukkutuuq
      art-x-buckham: Centro Agroalimentare di Pukkutuuq
    notes:
      zh: "塔夫鲁普库维克平原的粮食与蔬果在此分拣、冷藏，再运往全岛。秋收后，中心门口的土豆品尝会能摆出几十个品种，评出的「年度土豆」会印在第二年的种子袋上。冷库里常年储着几万吨土豆和根菜，让全岛冬天也吃得上本地菜。"
      en: "Grain, fruit and vegetables from the Tavrupukkuvik plain are sorted and chilled here before going out across the island. After the harvest, the potato tasting outside the centre sets out dozens of varieties, and the \"potato of the year\" is printed on the next year's seed bags. Its cold stores hold tens of thousands of tonnes of potatoes and root vegetables, so the whole island can eat local produce through the winter."
    in: div_rzw76f
