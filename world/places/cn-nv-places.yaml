      en: Ministry of Transport, North Viking Island Executive Council
    short_names:
      zh: 交通部
      en: Ministry of Transport
    notes:
      zh: 北维京岛领地政务院交通部，位于政务院大街南侧，负责全岛的道路、铁路、水运和航空。部内设政策司、交通从业人员司、道路运输司、公路司、铁路司、水路司和空运司，其中铁路司在隔壁单独建楼。公路司管理环北维京岛高速、自维高速等国家高速和领地高速，岛上的高速公路大多不限速，冬季的除雪、防雪长廊和融雪设施也由它统一调度；水路司监管维京港、勒克尔和贝克勒保税港区的航运，空运司负责各机场的航线和空域协调，交通从业人员司管理驾驶员、船员和机组的资格考核。
      en: The Ministry of Transport, on the south side of Council Row, runs the island's roads, railways, shipping and air transport. Its departments are Policy, Transport Professions, Road Transport, Highways, Railways, Waterways and Air Transport, of which Railways has its own building next door. Highways manages the national and territorial expressways such as the North Viking Island Ring Expressway and the Freedom–Viking Port Expressway, most of them without a speed limit, and coordinates winter snow clearing, snow sheds and de-icing; Waterways oversees shipping at Viking Port, Lekor and the Beckerle Bonded Port Zone, Air Transport handles routes and airspace for the airports, and Transport Professions examines and licenses drivers, seafarers and aircrew.
    in: div_16cxr8
    offset_km: [2.59, 1.49]
    site: { size_m: [150, 80], layout: slab }

  - id: bld_4f62x1
    subtype: government
    status: generated
    names:
