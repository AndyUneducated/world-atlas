    names:
      zh: 纳帕图克森林公园
      en: Napatuuq Forest Park
      art-x-viking: Waldpark Napatuuq
      art-x-buckham: Parco Forestale di Napatuuq
    notes:
      zh: "纳帕图克森林公园在洛龙山市纳帕图克区，保护着纳帕图克山坡上最古老的一片云杉原始林，占地约 0.96 平方公里。纳帕图克区是洛龙山市面积最大、人口最稀少的区，每平方公里只有约七人，大部分土地是云杉和冷杉组成的原始针叶林；区里的林场都按严格的轮伐制度采伐，唯独这片林子不许动一斧一锯。园内有高大的冷杉、苔藓覆盖的岩石和清澈的溪流，林间步道从山坡上一路上行，经纳帕图克垭口通往纳帕图克冰川的冰舌。冰川位于洛龙峰南侧，面积约三十五平方公里，沿途可以看到冰川退缩后留下的冰碛和冰蚀湖。纳帕图克公路从区内穿过，西接普库图克区，东通卡蒂尔尤阿克，是游客进山的唯一道路；冬季大雪封山，步道只在夏秋开放。\n林子里最老的云杉要好几个人才能合抱，树下铺着厚厚的苔藓，走在上面听不见脚步声，导游常让游客停下来，静听一分钟林子里的声音。步道尽头能远远望见纳帕图克冰川，夏天冰川融水汇成的小溪清得能看见水底的石子；徒步者在溪边常把手伸进水里，冰得几秒就要缩回来，纳帕图克的向导说，能坚持十秒的人，就可以喝一口「冰川的第一口水」。附近纳帕图克林业研究所的护林员也常在园里巡山，每年采伐季开工前，他们先在最老的一棵冷杉下放一块面包，算是向山林打个招呼。"
      en: "Napatuuq Forest Park, in Napatuuq District of Lorond Mountain City, protects the oldest stand of primeval spruce on the slopes of Napatuuq and covers about 0.96 km². Napatuuq is the largest and most thinly peopled district of Lorond Mountain, with only about seven people per square kilometre, and most of its land is primeval conifer forest of spruce and fir; the district's forestry estates are all felled on a strict rotation, but in this one stand not a single tree may be cut. The park holds tall firs, moss-covered rocks and clear streams, and a forest trail climbs the slope by way of the Napatuuq Col to the tongue of the Napatuuq Glacier. The glacier lies on the south side of Lorond Peak and covers about 35 km², and along the way you can see the moraines and ice-scoured lakes left as it has retreated. The Napatuuq Highway crosses the district, west to Pukkutuuq and east to Katirjuaq, and is the only road in; in winter heavy snow closes the mountains, and the trail is open only in summer and autumn.\nThe oldest spruces in the forest would take several people to circle with their arms, the ground beneath them is deep in moss, and your footsteps make no sound; guides often have visitors stop and listen to the forest for a minute. From the end of the trail you can see the Napatuuq Glacier in the distance, and in summer the streams of meltwater run so clear that every pebble on the bottom shows. Hikers often dip a hand in, only to pull it out again within seconds, and the Napatuuq guides say that anyone who can last ten seconds has earned a sip of \"the glacier's first water\". Rangers from the nearby Napatuuq Forestry Institute often patrol the park, and before the felling season starts each year they leave a piece of bread under the oldest fir, a way of greeting the forest."
    in: div_k5f1mz
    offset_km: [-1.0, 0.8]
    site: { layout: park, size_m: [1200, 800] }
  - id: poi_883hrs
    subtype: park
    status: generated
    names:
      zh: 伊卡苏瓦瀑布公园
      en: Ikkasuvva Falls Park
      art-x-viking: Wasserfallpark Ikkasuvva
      art-x-buckham: Parco delle Cascate di Ikkasuvva
    notes:
      zh: "伊卡苏瓦瀑布公园在洛龙山市伊卡苏瓦区，是伊卡苏瓦观光步道的起点，也是全岛最著名的自然景区。伊卡苏瓦在洛龙山南部的群峰之间切出数十公里长的峡谷，峡谷两壁的冰川融水汇成一连串多级瀑布，最高一级落差上百米。公园占地约 0.4 平方公里，栈道沿峡谷通往一级级瀑布，沿途修有吊桥和观景台；谷底不远处是碧绿色的伊卡苏瓦湖，那是古冰川的冰碛堵塞河道后形成的堰塞湖。伊卡苏瓦高速在峡谷中以一连串桥梁和隧道穿行，从新城方向开车来的游客，往往还没下高速就先听见了瀑布声。旅游是伊卡苏瓦区最主要的收入，夏季栈道上满是徒步者和摄影爱好者，附近只有几十户人家的山村这时才热闹起来。\n洛龙山冬天最低气温可以跌到零下二十五度，隆冬时瀑布冻成几十米高的冰墙，成了冰攀爱好者的练习场，冰镐敲在冰上的声音在峡谷里回荡；夏天融水下泄，隔着几公里都能听见峡谷里的水声，站在最下面的观景台上，不一会儿衣服就被水雾打湿。栈道入口的小木屋卖热越橘汁和云杉糖浆松饼，木屋的老板是山村里土生土长的维京语老人，他说瀑布每年冻住和化开的那一天，比日历还准。"
      en: "Ikkasuvva Falls Park, in Ikkasuvva District of Lorond Mountain City, is the start of the Ikkasuvva sightseeing trail and the best-known natural attraction on the island. The Ikkasuvva cuts a gorge tens of kilometres long between the peaks of the southern Lorond Mountains, and glacier meltwater pouring off its walls forms a chain of tiered waterfalls, the highest with a drop of more than a hundred metres. The park covers about 0.4 km²; boardwalks follow the gorge from one fall to the next, with suspension bridges and viewing platforms along the way, and not far along the valley floor lies the emerald Lake Ikkasuvva, formed where an ancient glacier's moraine dammed the river. The Ikkasuvva Expressway threads the gorge on a string of bridges and tunnels, and visitors driving up from New City often hear the falls before they leave the expressway. Tourism is the district's main source of income; in summer the boardwalks are crowded with hikers and photographers, and the nearby villages of a few dozen households only come alive then.\nWinter lows in Lorond Mountain can fall to −25 °C, and in deep winter the falls freeze into walls of ice tens of metres high that ice climbers use as a practice ground, the ring of their axes echoing down the gorge. In summer the meltwater thunders down and the roar carries for kilometres; stand on the lowest platform and the spray soaks your clothes within minutes. The hut at the boardwalk entrance sells hot lingonberry juice and pancakes with spruce syrup. Its owner, an old Viking-speaker born and raised in the valley, says the days the falls freeze and thaw each year are more reliable than the calendar."
    in: div_0t2t36
    offset_km: [0.8, 0.6]
    site: { layout: park, size_m: [800, 500] }
