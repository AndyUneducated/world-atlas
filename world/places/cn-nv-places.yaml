      en: Specchiara International Finance Centre
      art-x-viking: Internationales Finanzzentrum Specchiara
      art-x-buckham: Centro Finanziario Internazionale di Specchiara
    notes:
      zh: "斯佩基亚拉天际线上最高的塔楼，离岸银行、结算机构与跨国公司区域总部集中于此。塔顶的观景层能望见整个斯佩基亚拉湾和湾心的镜岛，晴天傍晚，塔楼的影子会一直伸到湾面上。楼里的电梯按「晨间市场」和「夜间市场」分组，跟着世界各地的交易时间轮流忙碌。"
      en: "The tallest tower on the Specchiara skyline, home to offshore banks, clearing houses and regional headquarters. The observation level at the top looks out over the whole of Specchiara Bay and Mirror Isle in the middle, and on clear evenings the tower's shadow stretches far out over the water. Its lifts are grouped as \"morning markets\" and \"evening markets\", busy in turn as trading opens and closes around the world."
    in: div_8p9k5t
    offset_km: [0.9, -0.3]
    site: { layout: tower, size_m: [140, 140] }
  - id: bld_31xavn
    subtype: office
    status: generated
    names:
      zh: 贝克勒国际商品交易所
      en: Beckerle International Commodity Exchange
      art-x-viking: Internationale Warenbörse Beckerle
      art-x-buckham: Borsa Merci Internazionale di Beckerle
    notes:
      zh: "交易所大道上的大宗商品与外汇交易所，自贸区的货物与资金大多在这里成交。交易所门口每周有一个小集市，最抢手的是写字楼天台上养蜂产的「金融蜜」，总是一抢而空。交易大厅里有一口铜钟，每天开市和收市各敲一次，钟声在交易所大道上都听得见。"
      en: "The commodity and currency exchange on Exchange Avenue, where most of the zone's goods and money change hands. A small market is held outside each week, where the \"finance honey\" from beehives on office roofs always sells out. A bronze bell in the trading hall is struck at the open and the close each day, loud enough to be heard along Exchange Avenue."
    in: div_8p9k5t
    offset_km: [-0.6, -0.6]
    site: { layout: hall, size_m: [240, 160] }
  - id: poi_n5w3kb
    subtype: park
    status: generated
    names:
      zh: 斯佩基亚拉滨海公园
      en: Specchiara Waterfront Park
      art-x-viking: Uferpark Specchiara
      art-x-buckham: Parco Lungomare di Specchiara
    notes:
      zh: "斯佩基亚拉湾岸边的步道与草坪，可远眺倒映在湾面上的镜岛。晴天傍晚，湾面平静得能把对岸的塔楼和湾心的镜岛完整倒映出来，镜岛的名字就由此而来。草坪上常有在附近上班的人午休时脱了鞋晒太阳，周末则是各国侨民家庭野餐的去处。"
      en: "Promenades and lawns on the shore of Specchiara Bay, looking out to Mirror Isle reflected in the water. On calm evenings the bay is still enough to mirror the towers on the far shore and Mirror Isle in its centre, which is how the isle got its name. Office workers from nearby take their shoes off to sit in the sun on the lawns at lunchtime, and at weekends expatriate families from many countries picnic here."
    in: div_8p9k5t
    offset_km: [0.4, 1.1]
    site: { layout: park, size_m: [900, 300] }
  - id: bld_mks7z1
