    notes:
      zh: 和平航天员训练中心位于和平区南部，负责航天员的选拔和训练。圆形的离心机大厅里，长长的转臂带着座舱高速旋转，让航天员体验火箭上升和返回时数倍于体重的过载；巨大的中性浮力水池里沉放着空间站和飞船的等大模型，航天员穿上航天服在水下练习出舱作业。模拟器大厅里有各型飞船和空天飞机的驾驶舱模拟器，航天员在这里反复演练从发射到着陆的每一个步骤。马斯林山的雪原和群峰也是天然的训练场，航天员要在这里进行冬季野外生存训练，以应对返回舱落在荒野的情况。
      en: The Peace Astronaut Training Centre, in the south of Peace District, selects and trains astronauts. In the round centrifuge hall a long arm swings a cabin at high speed so that astronauts feel the many times their body weight they will meet during launch and re-entry. A huge neutral buoyancy pool holds full-size models of a space station and spacecraft, where astronauts in pressure suits practise spacewalks underwater. The simulator hall has cockpit simulators of every ship and spaceplane, in which crews rehearse each step from launch to landing again and again. Maslin Mountain's snowfields and peaks are a training ground too, where astronauts learn to survive in the winter wild in case a capsule comes down far from help.
