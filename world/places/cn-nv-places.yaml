      en: The territory's largest port. The quay front was reclaimed out from the old Walvik shore and four basins were dug back inland; from south to north the five moles hold the oil, bulk, two container and ro-ro terminals, and the oil jetty reaches out beyond the breakwaters. A rail yard and logistics warehouses lie behind.
