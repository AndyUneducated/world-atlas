    notes:
      zh: 西坪防空阵地位于发射与降落中心南面的高原上，是守护发射场的地空导弹阵地。阵地呈环形布置，六个发射车位分布在环形道路上，中央是制导雷达和指挥所；导弹发射车平时停在掩体内，警报响起后几分钟内就能进入发射位置。发射窗口期间，阵地进入最高战备，与东营的战斗机和西岭的雷达站协同，确保发射场上空没有任何不明飞行器。马斯林山共有三座这样的阵地，分别位于西坪、星港和和平，各自守卫一个方向，射程相互重叠，形成环绕发射中心和指挥中心的防空圈。
      en: West Heath Air Defence Site is on the plateau south of the launch and landing centre, a surface-to-air missile site guarding the launch site. It is laid out as a ring, with six launcher positions on a ring road around the guidance radar and command post in the middle. The launchers normally wait under cover and can be in position within minutes of an alert. During launch windows the site goes to its highest readiness, working with the East Camp fighters and the West Ridge radar so that nothing unidentified flies over the launch site. Maslin Mountain has three such sites, at West Heath, Starport and Peace, each guarding one direction, and their overlapping ranges form an air defence ring around the launch and command centres.
    in: div_nwke3f
