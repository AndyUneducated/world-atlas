      en: "The commodity and currency exchange on Exchange Avenue, where most of the zone's goods and money change hands. A small market is held outside each week, where the \"finance honey\" from beehives on office roofs always sells out. A bronze bell in the trading hall is struck at the open and the close each day, loud enough to be heard along Exchange Avenue."
