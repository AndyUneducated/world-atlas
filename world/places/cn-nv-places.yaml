  - id: poi_detmcs
    subtype: park
    status: generated
    names:
      zh: 银滩海滨公园
      en: Silver Beach Seafront Park
      art-x-viking: Strandpark Silberstrand
      art-x-buckham: Parco Lungomare di Spiaggia Argento
    notes:
      zh: "银滩海滨公园在天城市银滩区，沿细白的沙滩铺开，有步道、草坪、沙滩排球场和一座海边的音乐亭，占地约 0.3 平方公里。银滩沿海岸绵延十几公里，是北维京岛最长、最白的沙滩，公园保护着其中一段沙丘和海岸草地，每到春季都有候鸟在此停歇，沙丘上围着木栅栏，提醒游人不要踩踏草根。公园两侧就是银滩主题乐园、银滩大酒店和成排的海滨酒店，东岸公路沿海岸穿过全区，夏季游泳、冲浪和帆船的人从全岛赶来，旺季时酒店和小店的季节工也常在午休时到草坪上晒太阳。区里还有不少从各地移居来的退休老人，公园的长椅一年四季都有人坐。\n每个周日下午，银滩合唱团在海边的音乐亭演唱，合唱团的成员都是天城的老人，下雨也不停，观众撑着刻有「天城」二字的公共雨伞站成一片。天城是全岛最湿的城市，一年降水接近两千三百毫米，合唱团的老人们说，在天城唱歌要是等晴天，一年也唱不了几回。退潮时沙滩上会露出一片礁石，孩子们在石缝里找小螃蟹和海星，找到了就捧给家长看一眼，再小心地放回水洼里；公园管理员在礁石边立了一块小牌子，写着「看完请送它们回家」。"
      en: "Silver Beach Seafront Park, in Silver Beach District of Skytown, stretches along the fine white sand with a promenade, lawns, beach volleyball courts and a seaside bandstand, covering about 0.3 km². Silver Beach runs for more than ten kilometres along the coast and is the longest and whitest beach on North Viking Island; the park protects a stretch of its dunes and coastal grassland, where migrating birds stop to rest each spring, and wooden fences around the dunes remind visitors not to trample the roots. On either side are the Silver Beach Theme Park, the Silver Beach Grand Hotel and rows of seafront hotels, and the East Coast Highway follows the shore through the district. In summer swimmers, surfers and sailors come from all over the island, and in high season the hotels' and shops' seasonal staff often spend their lunch breaks sunning themselves on the lawns. Plenty of retired people who have moved here from elsewhere live in the district too, so the park benches are occupied all year round.\nEvery Sunday afternoon the Silver Beach Choir, made up of Skytown's elders, sings in the seaside bandstand, rain or shine, to an audience standing under public umbrellas carved with the word \"Skytown\". Skytown is the wettest city on the island, with close to 2,300 mm of rain a year, and the singers say that if they waited for fine weather they would hardly sing at all. At low tide a reef of rocks appears on the beach, and children hunt for little crabs and starfish in the crevices, carrying their finds over to show their parents before putting them gently back in the pools; the park warden has put up a small sign by the rocks that says \"Please take them home when you have finished looking\"."
    in: div_f5s7ax
    offset_km: [-0.5, -1.2]
    site: { layout: park, size_m: [1200, 250] }
  - id: poi_8qs7q4
    subtype: golf_course
    status: generated
    names:
      zh: 岚山高尔夫球场
      en: Mist Hill Golf Club
      art-x-viking: Golfclub Nebelhang
      art-x-buckham: Golf Club Pendio Nebbia
    notes:
      zh: "岚山坡地上的 18 洞球场，俯瞰银滩与大海。球场常被晨雾笼罩，雾里打出的球要等雾散了才找得到，球童因此练出一副好耳力，听落地的声音就知道球去了哪里。下雨天球场照常营业，球包旁边一律插着公共雨伞。"
      en: "An 18-hole course on the slopes of Mist Hill, looking down over Silver Beach and the sea. The course is often wrapped in morning mist, and balls hit into the fog cannot be found until it lifts, so the caddies have developed sharp ears and can tell where a ball has landed by the sound. It stays open in the rain, with a public umbrella standing in every golf bag."
    in: div_ts88e3
    offset_km: [1.2, 0.8]
    site: { layout: park, size_m: [1400, 900] }
  - id: poi_t5nges
    subtype: park
    status: generated
    names:
      zh: 岚山森林公园
      en: Mist Hill Forest Park
      art-x-viking: Waldpark Nebelhang
      art-x-buckham: Parco Forestale di Pendio Nebbia
    notes:
      zh: "岚山森林公园在天城市岚山区，是一座晨雾常绕山腰的森林公园，岚山区就以此得名，占地约 0.54 平方公里。公园保护着大片的原始阔叶林和山溪，山溪自此直落银滩；林间的步道沿着山溪往下走，一路通到银滩的海边，另一条步道则可以登上山顶，眺望柳萨湾和远处马斯林山脉的雪峰。岚山区是天城北部丘陵上的低密度住宅区，独栋别墅和低层公寓掩映在森林和草坡之间，疗养院、康复中心和养老社区沿山坡分布，许多从维京港、自由市和维京群岛移居而来的退休人员、企业家和艺术家住在附近。东岸公路从区内穿过，一头经银滩通往天台，另一头通往东营；公园旁的岚山高尔夫球场也常被同一场晨雾笼罩。\n天城是全岛最湿的城市，一年降水接近两千三百毫米。雨后溪水涨起来，水声在雾里格外响，步道入口的伞架上插着刻有「天城」二字的公共雨伞，借了可以在山下银滩的任何一个伞架归还。森林公园山脚下有几处温泉，冬天泡完温泉再喝一碗热鱼汤，是许多天城退休居民的日常。疗养院的老人们每天清晨结伴进山散步，雾大的日子看不清前面的人，他们便一边走一边哼歌，听着歌声跟上队伍。"
      en: "Mist Hill Forest Park, in Mist Hill District of Skytown, is a forest park whose slopes are often wrapped in morning mist, and the district takes its name from it. Covering about 0.54 km², it protects a large area of old-growth broadleaf forest and a mountain stream that drops from here straight down to Silver Beach. One path follows the stream downhill all the way to the shore at Silver Beach, and another climbs to the summit, with views over Ljosa Bay and the distant snow peaks of the Maslin Range. Mist Hill is a low-density residential district in the hills of northern Skytown, its detached houses and low-rise flats tucked among woods and grassy slopes, with sanatoriums, rehabilitation centres and retirement communities spread along the hillsides, and many retirees, entrepreneurs and artists who have moved here from Viking Port, Freedom City and the Viking Islands live nearby. The East Coast Highway passes through the district, towards Sky Terrace via Silver Beach in one direction and to East Camp in the other, and the Mist Hill Golf Club next to the park is often lost in the same morning mist.\nSkytown is the wettest city on the island, with close to 2,300 mm of rain a year. After rain the stream rises and its sound is especially loud in the mist; the umbrella stand at the trailhead holds public umbrellas carved with the word \"Skytown\", which can be returned to any stand down at Silver Beach. There are several hot springs at the foot of the forest park, and in winter a soak in the springs followed by a bowl of hot fish soup is part of daily life for many of Skytown's retired residents. Elderly people from the sanatoriums walk into the hills together every morning; on misty days, when they cannot see the person in front, they hum as they go and follow the singing to keep up with the group."
    in: div_ts88e3
    offset_km: [-1.0, 0.6]
    site: { layout: park, size_m: [900, 600] }
  # ── 洛龙山市、马斯林山市与雅利基卢克市地标（M17）──
  - id: bld_tvkhgs
    subtype: townhall
    status: generated
    names:
      zh: 洛龙山市人民政府
      en: Lorond Mountain City Government
      art-x-viking: Stadtregierung Lorondberg
      art-x-buckham: Governo Cittadino di Lorond Tehee
    notes:
      zh: "卡蒂尔尤阿克集镇上的市政府，山区三区的公路在此交汇。大雪封山时，市政府楼下的卡蒂尔尤阿克广播站每天早晚各念一遍全市山口和隧道的通行情况，播报员念山口名的抑扬顿挫在全岛都有名。门厅里挂着一块黑板，每天写着各个山口「开」或「关」。"
      en: "The city government in the Katirjuaq market town, where the roads of the three mountain districts meet. When snow closes the mountains, the Katirjuaq radio station downstairs reads out the state of every pass and tunnel each morning and evening, and the announcer's cadence through the pass names is famous across the island. A blackboard in the entrance hall shows each pass as \"open\" or \"closed\" every day."
