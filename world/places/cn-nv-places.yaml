  - id: poi_4pegdx
    subtype: training_range
    status: generated
    names:
      zh: 群峰空军靶场
      en: High Peaks Air Weapons Range
      art-x-viking: Luftwaffenschießplatz Gipfel
      art-x-buckham: Poligono Aereo delle Vette
    notes:
      zh: 群峰空军靶场位于群峰训练管理区西南部的山麓地带，是马斯林山唯一可以投放实弹的空军靶场。靶场中散布着一组组环形靶标，分别模拟机场、车队和阵地；边缘的观察塔用激光测距仪和摄像机记录每一次投弹的落点，飞行员落地后就能看到自己的成绩。靶场还设有电子对抗训练区，几座模拟站会发出各种雷达信号，让飞行员练习识别和干扰。每次演训前，管理区会封闭靶场周边的道路，并在附近空域划设临时禁飞区。靶场远离城镇，背靠群峰，即使弹药偏离目标也不会危及居民。
      en: The High Peaks Air Weapons Range lies in the foothills in the south-west of the High Peaks Training Area and is the only range at Maslin Mountain where aircraft may drop live weapons. Groups of ring-shaped targets are scattered across it, standing in for airfields, convoys and gun positions. Observation towers on its edge record every impact with laser rangefinders and cameras, so pilots see their scores as soon as they land. It also has an electronic warfare area where simulator stations send out all kinds of radar signals for pilots to identify and jam. Before each exercise the training area authority closes the roads around the range and declares a temporary no-fly zone overhead. The range is far from any town with the High Peaks behind it, so even a stray weapon puts no one at risk.
    in: div_q5h8zp
    offset_km: [-21.92, -26.16]
    site: { size_m: [8000, 6000], layout: range, variant: air, angle_deg: 0 }
