    short_names:
      zh: 人权事务高级专员办公室
      en: Human Rights Commissioner's Office
    notes:
      zh: 中央政府常驻北维京岛领地人权事务高级专员办公室，位于政务院大街南侧第二排，由中央政府派驻，监督领地人权保障的情况。高级专员关注的事项包括司法程序中的权利保障、拘留场所的条件、劳动者权益，以及中文、维京语、巴克汉姆语使用者和塔夫鲁纳克语原住民群体的平等权利；它可以查阅相关档案、走访看守所和社区矫正机构，接受个人申诉，并向领地机关提出改进建议。办公室每年发布领地人权报告，其中关于语言权利和原住民土地使用的章节最受关注。
      en: The Office of the Central Government High Commissioner for Human Rights in North Viking Island, in the second row on the south side of Council Row, is sent by the central government to watch over human rights in the territory. The High Commissioner looks at rights in court proceedings, conditions in places of detention and workers' rights, and at equal treatment for speakers of Chinese, Viking and Buckham and for the Tavrunaq indigenous community. The office can examine records, visit remand centres and community corrections, hear individual complaints and make recommendations to territorial bodies. Its yearly human rights report is published, and the chapters on language rights and indigenous land use draw the most attention.
    in: div_16cxr8
    offset_km: [2.85, 1.42]
    site: { size_m: [80, 80], layout: block }

  - id: bld_tv42dj
    subtype: government
    status: generated
    names:
      zh: 北维京岛领地政务院教育、科学和文化部科学政策司
      en: Science Policy Department, Ministry of Education, Science and Culture, North Viking Island Executive Council
    short_names:
      zh: 科学政策司
      en: Science Policy Department
    notes:
      zh: 北维京岛领地政务院教育、科学和文化部科学政策司，是少数不在首府的政务院机构之一，设在西北市科学城的科学大道旁，与国家实验室、大学分校和航天企业为邻。科学政策司制定领地的科研规划，管理科研基金和重点实验室的评审，协调科学城、望星区和马斯林山航天设施之间的合作项目，也负责科研伦理和科研数据的管理规则。把它放在科学城，是为了让政策制定者每天都能和研究人员面对面交流；司里定期举办开放日，科研人员可以直接上门提交项目建议。
      en: The Science Policy Department of the Ministry of Education, Science and Culture is one of the few Executive Council bodies outside the capital, on Science Avenue in Northwest City's Science City beside the national laboratories, a university branch campus and the aerospace firms. It draws up the territory's research plans, runs research funding and the review of key laboratories, coordinates joint projects between Science City, Stargaze District and the space facilities at Maslin Mountain, and sets the rules on research ethics and research data. It was put in Science City so that policy makers meet researchers face to face every day, and on its regular open days scientists can walk in with proposals.
    in: div_s8f4kt
    offset_km: [0.3, 0.3]
    site: { size_m: [120, 70], layout: slab }

  - id: bld_3yqj8r
    subtype: government
    status: generated
    names:
      zh: 北维京岛领地政务院公共安全部边境服务和安全司
      en: Border Services and Security Department, Ministry of Public Security, North Viking Island Executive Council
    short_names:
      zh: 边境服务和安全司
      en: Border Services and Security Department
    notes:
      zh: 北维京岛领地政务院公共安全部边境服务和安全司，设在维京港瓦尔维克区，是公共安全部唯一不在首府的司。瓦尔维克区是领地最大的口岸：鲸湾港和外礁深水港的远洋货轮、维京港国际机场的国际航班，以及经海底隧道通往维京群岛长船市的维长高速和维长真空磁悬浮都从这里进出。边境服务和安全司负责这些口岸的出入境检查、边境巡逻和反走私，在海底隧道两端与维京群岛的边境部门合设联合检查站；它还管理沿海巡逻艇队，搜救在海峡遇险的渔船。大楼为 L 形，楼顶设有雷达和通信天线。
      en: "The Border Services and Security Department of the Ministry of Public Security is in Walvik District of Viking Port, the only department of the ministry outside the capital. Walvik is the territory's busiest port of entry: ocean freighters at Walvik Harbour and the Outer Skerry Deep-Water Port, international flights at Viking Port International Airport, and the Viking Port–Longship Expressway and Vacuum Maglev through the undersea tunnel to Longship in the Viking Islands all pass through it. The department runs immigration checks at these crossings, border patrols and anti-smuggling work, with joint checkpoints shared with the Viking Islands' border officers at both ends of the tunnel, and it runs the coastal patrol boats that rescue fishing boats in trouble in the strait. The building is L-shaped, with radar and radio masts on the roof."
    in: div_z29w6h
    offset_km: [1.0, 0.6]
    site: { size_m: [130, 100], layout: lshape }
