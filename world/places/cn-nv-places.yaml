      en: "Harbour at the Freedom River mouth, Freedom City's gateway to the sea. It handles fishing boats as well as freighters carrying building materials and everyday goods, and in winter it is where the capital's icebreaker berths. At low tide the sandbars outside the harbour rise from the water and flocks of seabirds settle on them, which is how Sandbar got its name."
