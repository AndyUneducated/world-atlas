  - id: bld_hq9qhr
    subtype: museum
    status: generated
    names:
      zh: 星港航天博物馆
      en: Starport Space Museum
      art-x-viking: Raumfahrtmuseum Sternhafen
      art-x-buckham: Museo dello Spazio di Porto Stella
    notes:
      zh: "展出退役火箭、返回舱与星港历次发射的博物馆，在马斯林山市星港区，展馆约 260 米长、160 米宽，对公众开放，是区里唯一向公众常年开放的设施。星港区是深空太空军马斯林山指挥中心的驻地，星港这座航天港拥有发射工位和着陆场，发射台面向大海，星港指挥中心全天候调度航天发射、在轨飞行器和深空探测任务，星港深空测控站的大口径天线阵追踪着飞往月球和行星际空间的探测器；这些设施都不对外开放，博物馆便成了普通人走近它们的唯一窗口。馆里还陈列着深空探测器的模型和测控天线的剖面，讲解员多是退役的航天工程师。每逢发射日，都有大批游客和航天爱好者前来，雪谷公路通往星港的路段车流不断，馆外的空地上挤满了架着望远镜和相机的人。区内常住人口约两万二千，绝大多数是军人、航天工程师和他们的家属，街道以航天器和星座命名，博物馆也是驻地家庭带孩子来得最多的地方。馆里最受欢迎的展品是一具烧得焦黑的返回舱，孩子们可以爬进复制的舱体里，从小小的舷窗往外看。\n每次有飞船回到降落场，深空太空军按惯例在指挥中心门口敲响一口铜钟，博物馆门口的电子屏也会亮出一行字：「有人回家了」。那一天来参观的孩子会领到一张印着返回舱的小卡片，背面写着当天的日期，许多人把它当作自己「见证过一次回家」的凭证。"
      en: "A museum of retired rockets, return capsules and the history of Starport's launches, in Starport District of Maslin Mountain City, in a hall about 260 m long and 160 m wide. It is open to the public and is the only facility in the district open all year. Starport District is the seat of the Deep Space Force's Maslin Mountain Command Centre: the Starport spaceport has launch pads and landing zones with pads facing the sea, the Starport Command Centre directs launches, spacecraft in orbit and deep-space missions round the clock, and the great dish array of the Starport Deep Space Station tracks probes bound for the Moon and interplanetary space. None of these are open to visitors, so the museum is the only way for ordinary people to get close to them. It also displays models of deep-space probes and a cutaway of a tracking antenna, and most of its guides are retired aerospace engineers. On launch days crowds of visitors and space enthusiasts arrive, traffic streams along the Snow Valley Highway towards Starport, and the open ground outside fills with people setting up telescopes and cameras. About 22,000 people live in the district, nearly all servicemen and women, aerospace engineers and their families, its streets named after spacecraft and constellations, and the museum is where garrison families most often bring their children. The most popular exhibit is a scorched black return capsule; children can climb into a replica capsule and peer out through its tiny window.\nWhenever a spacecraft returns to the landing zone, the Deep Space Force by custom rings a bronze bell outside the command centre, and the screen at the museum entrance lights up with a single line: \"Someone has come home\". Children visiting that day receive a small card printed with a return capsule and the date on the back, and many keep it as proof that they \"witnessed a homecoming\"."
    in: div_nytsvb
    offset_km: [-0.2, 0.15]
    site: { layout: hall, size_m: [260, 160] }
  - id: poi_6v4hsc
    subtype: ski_resort
    status: generated
    names:
      zh: 雪谷滑雪场
      en: Snow Valley Ski Area
      art-x-viking: Skigebiet Schneetal
      art-x-buckham: Comprensorio Sciistico di Valle Neve
    notes:
      zh: "雪谷滑雪场在马斯林山市雪谷区，建在马斯林山脉中一片终年积雪的谷地上，是这个以军营和机场为主的区里唯一面向公众的设施。滑雪场占地约 1.26 平方公里，拥有全岛雪期最长、落差最大的雪道，冬季吸引着全岛的滑雪高手；到了夏天，高处的冰川上仍然可以滑雪。从滑雪场的高处可以俯瞰终年冰封的雪湖，湖面八十多平方公里，四周是陡峭的雪峰和冰川。冬季雪谷公路封闭时，游客只能乘缆车上山；雪道之外的谷地属于解放军马斯林山联合训练基地，滑雪者偶尔会看到雪地里行进的寒区部队，或听见雪谷空军基地的飞机从头顶掠过。\n马斯林山是全岛降水最少的城市，一年只有八百多毫米，晴天多，滑雪场常能在蓝天下滑雪，运气好时还能看到星港的火箭从远处升起，雪道上的人会停下来，看着白烟划过对面的雪峰。滑雪场的教练们说，站在高处往下看，冰封的雪湖连一丝风纹都没有，像一块被人遗忘的白色桌布。山顶木屋里卖一种把奶酪和土豆一起烤到焦黄的「雪道饼」，滑完一趟来一块，是这里的老规矩；常来的军人家属还会带着孩子在初级雪道上练习，教练们笑称这些孩子「学会滑雪比学会走路还早」。"
      en: "The Snow Valley Ski Area is in Snow Valley District of Maslin Mountain City, on a valley floor in the Maslin Range that lies under snow all year, and it is the only facility open to the public in a district otherwise given over to barracks and airfields. Covering about 1.26 km², it has the longest snow season and the greatest vertical drop of any ski area on the island and draws expert skiers from all over in winter; in summer there is still skiing on the glacier higher up. From the top of the runs you look down on Snow Lake, frozen all year round, more than eighty square kilometres of ice ringed by steep snow peaks and glaciers. When the Snow Valley Highway closes in winter, the only way up is by cable car. Beyond the pistes the valley belongs to the PLA's Maslin Mountain Joint Training Base, and skiers sometimes spot cold-weather troops on the move through the snow, or hear aircraft from the Snow Valley Air Base pass overhead.\nMaslin Mountain is the driest city on the island, with only some 840 mm of precipitation a year and plenty of sunny days, so skiing here often happens under blue skies, and with luck you can see a rocket rise from Starport in the distance; skiers stop on the slopes to watch its white trail cross the peaks opposite. The instructors say that from up high the frozen Snow Lake shows not a ripple of wind, like a white tablecloth someone forgot. The hut at the top sells \"piste cakes\", cheese and potato baked together until golden and crisp, and having one after each run is an old house rule. Service families are regulars too, bringing their children to practise on the nursery slopes, and the instructors joke that these children \"learn to ski before they learn to walk\"."
    in: div_0tsyzy
    offset_km: [1.4, 1.0]
    site: { layout: park, size_m: [1400, 900] }
  - id: bld_xv9d1f
    subtype: townhall
