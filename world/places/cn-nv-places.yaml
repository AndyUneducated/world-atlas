        en: Two groups of multirole fighters, about 48 aircraft, plus trainers and liaison aircraft
      personnel: 4800
      access:
        zh: 军事禁区，不对外开放；每年航空开放日对公众开放一天
        en: Restricted military area, closed to the public except for one open day a year
  - id: poi_ez2t6k
    subtype: air_base
    status: generated
    names:
      zh: 雪谷空军基地
      en: Snow Valley Air Base
      art-x-viking: Luftwaffenstützpunkt Schneetal
      art-x-buckham: Base Aerea di Valle Neve
    notes:
      zh: 雪谷空军基地位于雪谷区南部的开阔谷底，驻有预警指挥机、空中加油机和大型运输机，是马斯林山空中力量的后方基地。预警指挥机升空后可以监视全岛及周边海域的空情，与西岭和星港的雷达站一起组成高低搭配的多层预警网；加油机让东营的战斗机能在发射窗口期间长时间留空巡逻。运输机承担部队机动、航天员转运和紧急物资空运，必要时也能把较小的航天器部件直接运往西坪。基地有两条平行跑道，宽大的停机坪旁是能容纳大型飞机的机库。雪谷积雪期长，机库全部采用保温设计，飞机出库前先在除冰坪上喷洒除冰液。基地与东侧的空天飞机基地共用油库和消防力量，两者都在马斯林山空天高速的南端。
      en: Snow Valley Air Base lies on the open valley floor in the south of Snow Valley District and is home to airborne early-warning aircraft, tankers and heavy transports, the rear base of Maslin Mountain's air power. Once airborne, the early-warning aircraft watch the air over the whole island and the surrounding seas, forming a layered warning net with the radar stations at West Ridge and Starport. The tankers let the East Camp fighters stay on patrol for hours during launch windows. The transports move troops, astronauts and urgent supplies, and can fly smaller spacecraft parts straight to West Heath. The base has two parallel runways and wide aprons beside hangars big enough for large aircraft. Snow lies long in the valley, so every hangar is insulated and aircraft are sprayed on a de-icing pad before take-off. It shares its fuel farm and fire service with the spaceplane base to the east, and both sit at the southern end of the Maslin Aerospace Expressway.
