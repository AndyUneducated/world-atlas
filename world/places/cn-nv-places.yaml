    names:
      zh: 东岭相控阵雷达站
      en: East Ridge Phased-Array Radar Station
      art-x-viking: Phased-Array-Radar Ostkamm
      art-x-buckham: Radar a Schiera di Fase della Cresta Est
    notes:
      zh: 东岭相控阵雷达站位于东营区南部的最高山岭上，是深空太空军的空间监视雷达。雷达的天线不是旋转的碟形，而是一面巨大的倾斜墙体，墙上排列着数千个小型收发单元，靠电子方式在瞬间改变波束指向，可以同时跟踪数百个目标。它日夜扫描马斯林山上空的轨道，发现并编目经过的卫星、火箭残骸和碎片，计算它们是否会与在轨航天器相撞；火箭发射时，它全程跟踪火箭飞行，确认各级分离是否正常。雷达耗电量很大，站内建有专用变电站，由东营电网双回路供电。阵面前方划定了电磁辐射防护区，区内不得建房。
      en: East Ridge Phased-Array Radar Station stands on the highest ridge in the south of East Camp District and is the Deep Space Force's space surveillance radar. Its antenna is not a turning dish but a huge sloping wall set with thousands of small transmit and receive modules that steer the beam electronically in an instant, so it can track hundreds of targets at once. Day and night it sweeps the orbits over Maslin Mountain, finding and cataloguing passing satellites, spent rocket stages and debris and working out whether any of them might hit a spacecraft. During a launch it follows the rocket all the way up, confirming that each stage separates as it should. The radar uses a great deal of power, so the station has its own substation fed by two separate lines from the East Camp grid. The ground in front of the array face is a radiation safety zone where no building is allowed.
    in: div_tc0ngk
    offset_km: [3.02, -13.58]
    site: { size_m: [900, 600], layout: radar, variant: array, angle_deg: 105 }
