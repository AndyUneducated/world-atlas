  - id: bld_6m4rdt
    subtype: tower
    status: generated
    names:
      zh: 西北广播电视中心
      en: Northwest Broadcasting Centre
      art-x-viking: Rundfunkzentrum Nordwest
      art-x-buckham: Centro Radiotelevisivo di Nordveste
    notes:
      zh: "领地广播电视机构的总部与发射塔，在西北市鹿鸣区，塔身约 120 米见方的基座上拔地而起，发射塔是西北市最高的建筑。鹿鸣区是西北市的市政与传媒中心，领地电视台、广播电台和多家报社、出版社都设在这一带，多语种的电视频道和报纸就在这里制作，信号从塔顶向全岛播出。中心的员工来自全岛各地，说中文、维京语和巴克汉姆语的家庭混居在周围的街区，媒体从业者、公务员和商户构成了鹿鸣区居民的主体。每到夏天鹿鸣公园办音乐节和电影节，中心的转播车就停在湖边，把露天剧场的演出直播到全岛；领地议会开幕、马斯林山的火箭发射和勒克尔丰收节这样的大事，也都从这里的演播室送进千家万户。西北市被称作「博士城」，中心的科普节目常请科学大道上的研究员出镜，讲深空探测和望星天文台的新发现。中心每天清晨用中文、维京语和巴克汉姆语轮流播报天气，三位主持人各说一种语言，不少岛民就是听着这档节目学会了另外两种语言的问候。\n每年冬天寒岭生态站的雪兔清点结果，也在这里的晚间新闻里像选举结果一样逐区公布，主播面前摆着一张全区地图，哪个山谷的雪兔多了就亮一盏灯。观众打电话来猜总数，猜得最接近的人能收到一只印着雪兔的保温杯，这只杯子在西北市的办公桌上比很多奖杯还常见。"
      en: "Headquarters and transmitter tower of the territory's broadcaster, in Deersong District of Northwest City; the mast rises from a base about 120 m square and is the tallest structure in the city. Deersong is Northwest's civic and media centre, home to the territorial television station, the radio station and several newspapers and publishers, where the multilingual TV channels and papers are produced, and the signal goes out to the whole island from the top of the tower. The staff come from all over the island, Chinese-, Viking- and Buckham-speaking families live side by side in the streets around it, and media workers, civil servants and shopkeepers make up most of Deersong's residents. Every summer, when Deersong Park holds its music and film festivals, the centre's outside-broadcast vans park by the lake and carry the open-air theatre's performances live to the island; big occasions such as the opening of Parliament, rocket launches at Maslin Mountain and the Lekor Harvest Festival also reach every home from its studios. Northwest is known as \"PhD City\", and the centre's science programmes often bring researchers from Science Avenue on air to talk about deep-space exploration and the latest from the Stargaze Observatory. Every morning the centre reads the weather in turn in Chinese, Viking and Buckham, three presenters each speaking one language, and many islanders learned to say hello in the other two languages from this programme.\nEach winter the Frost Ridge Ecological Station's count of mountain hares is announced on the evening news district by district like an election result, the presenter standing before a map of the district on which a light comes on wherever a valley's hares have increased. Viewers phone in to guess the total, and the closest guess wins a flask printed with a snow hare; in Northwest's offices that flask is more common on desks than many trophies."
    in: div_zs7kjk
    offset_km: [1.8, 1.2]
    site: { size_m: [120, 120], layout: tower }

  - id: poi_c6abw8
    subtype: park
    status: generated
    names:
      zh: 鹿鸣公园
      en: Deersong Park
      art-x-viking: Hirschliedpark
      art-x-buckham: Parco di Canto Cervo
    in: div_zs7kjk
    offset_km: [-1.2, 1.5]
    site: { size_m: [600, 450], layout: park }
    notes:
      zh: "鹿鸣公园是西北市鹿鸣区的城市公园，环绕鹿鸣湖而建，占地约 0.27 平方公里。鹿鸣湖面积约二十五平方公里，四周是云杉和桦树混交林，园内的草坡和林地连着城外的山岭，常有野生的马鹿出没。鹿鸣区是西北市的市政与传媒中心，区名取自「呦呦鹿鸣」，西北市人民政府和西北广播电视中心都在附近，西北地铁 1 号线和 2 号线在鹿鸣大道站换乘，下班的人坐地铁过来，走几步就能到湖边。公园里有步道、码头、露营地和一座露天剧场，每年夏天这里举办音乐节和电影节，吸引全岛的年轻人；西北广播电视中心也偶尔在这里录制户外节目。\n秋天发情季的鹿鸣在夜里隔着几条街都能听见，区名和公园名都由此而来。这个季节公园会在入口挂出「鹿在求偶，请勿靠近」的牌子，护林员晚上打着手电巡园，把凑得太近、想拍照的游客劝回步道。夏天湖边的草坪是西北市人野餐和看露天电影的去处，放映到一半常有鹿从林边探出头来，观众便压低声音互相提醒「别惊动它」。冬天湖面封冻后，湖边可以滑冰，研究所下班的科研人员穿着冰鞋在湖上绕圈，有人说这是全城唯一一个不谈论文的地方。"
      en: "Deersong Park is a city park in Deersong District of Northwest City, laid out around Deersong Lake and covering about 0.27 km². The lake, about 25 km², is ringed by mixed spruce and birch forest, and the park's grassy slopes and woods join the hills beyond the city, so wild red deer often wander in. Deersong is Northwest City's civic and media centre, its name taken from an old line of poetry about deer calling, and the city government and the Northwest Broadcasting Centre are close by; Northwest Metro Lines 1 and 2 meet at Deersong Avenue station, so people can take the metro after work and be at the lakeside in a few steps. The park has footpaths, a pier, a campsite and an open-air theatre, where a music festival and a film festival each summer draw young people from all over the island, and the Northwest Broadcasting Centre sometimes records outdoor programmes here.\nIn the autumn rut the stags' calls carry several streets at night, and both the district and the park are named after them. In that season the park hangs a sign at the gate reading \"Deer courting, please keep away\", and rangers patrol at night with torches, steering visitors who creep too close for a photo back onto the paths. In summer the lawns by the lake are where Northwest City goes for picnics and open-air films, and halfway through a screening a deer often pokes its head out from the edge of the wood, sending a whisper of \"don't startle it\" through the audience. When the lake freezes in winter there is skating along the shore, and researchers from the institutes circle the ice after work; some say it is the only place in the city where nobody talks about papers."

  - id: poi_h43y8q
