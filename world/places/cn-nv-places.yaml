    notes:
      zh: "西北市林道区的理工科学院，和其他高校同在林道大学城，以航天工程、电子和材料专业见长，毕业生多进入科学城和马斯林山的航天企业与研究机构。校园中央立着一枚退役的探空火箭，学生考试前喜欢去摸一下它的尾翼讨个好运，尾翼的漆因此被摸得发亮。每年春天的「纸飞机节」上，各系学生在教学楼顶比赛谁的纸飞机飞得最远，冠军的设计图会贴进学院的走廊里。"
      en: "A college of technology in Woodway, Northwest City, sharing the Woodway university town with other institutions and strongest in aerospace engineering, electronics and materials; most graduates go on to the space companies and research bodies of Science City and Maslin Mountain. A retired sounding rocket stands in the middle of the campus, and students touch its fins for luck before exams, so that the paint on them is rubbed shiny. At the Paper Plane Festival each spring, students from every department compete from the roofs of the teaching blocks to see whose paper plane flies furthest, and the winning design is pinned up in the college corridor."

  - id: poi_edha0r
