    in: div_479xae
    offset_km: [0.8, 0.6]
    site: { size_m: [500, 400], layout: campus }
    notes:
      zh: "西北市寒岭区山岭间的生态研究站，研究高寒山地的森林、苔原、积雪和野生动物，也是北维京岛大学和林道理工学院学生的野外实习基地。研究站最出名的工作是每年冬天清点山岭里的雪兔，研究员和志愿者踩着雪鞋沿固定路线走上几天，结果会在西北广播电视中心的晚间新闻里逐区公布。站里的食堂只有一张长桌，研究员和来访的徒步者一起吃饭，墙上挂满了历年的雪兔足迹拓片。"
      en: "An ecological field station in the hills of Frost Ridge District, Northwest City, studying the forests, tundra, snow cover and wildlife of the cold uplands, and a field base for students of the University of North Viking Island and the Woodway Institute of Technology. Its best-known work is the winter count of mountain hares: researchers and volunteers spend days on snowshoes walking fixed routes through the hills, and the results are announced district by district on the Northwest Broadcasting Centre's evening news. The station canteen has a single long table where researchers eat with visiting walkers, beneath walls hung with rubbings of hare tracks."
  - id: bld_z6csvp
    subtype: townhall
