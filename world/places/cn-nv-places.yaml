  - id: poi_vaw6nk
    subtype: castle
    status: generated
    names:
      zh: 格约特斯塔德石垒
      en: Grjotstad Stone Fort
      art-x-viking: Grjotstad
      art-x-buckham: Fortezza di Muro Pietra
    notes:
      zh: "格约特斯塔德石垒是维京时代的石垒遗址，建在维京港市俯瞰鲸湾的高地上，格约特斯塔德旧城就围绕它逐渐形成，区名（维京语「石堡」）也由此而来。石垒的围墙用未经打磨的大石块干砌而成，没有用一点灰浆，至今仍然稳稳立着；城墙、望楼和地下粮仓都保存完好，如今辟为遗址公园，占地约 0.06 平方公里。维京港起源于鲸湾畔的捕鲸站和这座石垒，维京语至今是一半居民的母语，石垒脚下迷宫般的石板窄街两旁是陡坡屋顶的石屋、手工作坊、旧书店和老酒馆，许多店铺由同一家族经营了好几代。老城建筑受到严格保护，少有新楼，居民年龄偏大；维京港地铁 4 号线全线都在格约特斯塔德区，从河畔站到榛子站串起老城的大街小巷，观星高速也从区内经过，向东通往奥斯特海姆和自由市。\n每周六的石垒市集从清晨开到中午，熏鲱鱼、黑麦面包、羊毛织物、木雕和手织毛衣摆满了墙脚，维京语的吆喝声比中文还多。熏鲱鱼、黑麦面包和鱼丸汤是这里最地道的早餐，摊主们一边招呼客人，一边用维京语和老主顾聊家常。夏季石垒里还有维京长船节和中世纪市集表演，演员们穿着粗布长袍在城墙上巡逻，孩子们最爱钻进地下粮仓，听讲解员讲当年人们怎样在这里熬过被围困的漫长冬天。"
      en: "Grjotstad Stone Fort is the ruin of a Viking-age stone stronghold on high ground overlooking Walvik bay in Viking Port. The old town of Grjotstad grew up around it, and the district's name, Viking for \"stone fort\", comes from it. Its walls are built of great undressed stones laid dry, without a trace of mortar, and they still stand firm; the walls, watchtowers and underground granaries are all well preserved, and the site is now a heritage park of about 0.06 km². Viking Port grew from the whaling station on Walvik bay and this fort, and Viking is still the first language of half its people. Below the fort, a maze of narrow flagstone lanes is lined with steep-roofed stone houses, craft workshops, second-hand bookshops and old taverns, many run by the same family for generations. The old town's buildings are strictly protected, so there are few new ones and the residents tend to be older. Viking Port Metro Line 4 lies wholly within Grjotstad District, linking the streets and lanes of the old town from Riverside to Hazel, and the Stargazer Expressway passes through the district, heading east to Osterheim and Freedom City.\nEvery Saturday the fort market runs from early morning until noon, with smoked herring, rye bread, woollens, wood carvings and hand-knitted jumpers laid out along the foot of the walls, and more stallholders call out in Viking than in Chinese. Smoked herring, rye bread and fish-ball soup make the most authentic breakfast here, and the stallholders chat with their regulars in Viking as they serve. In summer the fort also hosts a Viking longship festival and medieval market performances, with actors in rough-spun robes patrolling the walls, and children love to climb down into the underground granaries to hear the guides tell how people once survived long winters under siege here."
    in: div_t3bfmm
    offset_km: [0, 0]
    site: { size_m: [240, 240], layout: park }

  - id: bld_ggjp3x
    subtype: tower
    status: generated
    names:
      zh: 海门国际金融中心
      en: Seagate International Finance Centre
      art-x-viking: Internationales Finanzzentrum Seetor
      art-x-buckham: Centro Finanziario Internazionale di Porta Mar
    notes:
      zh: "海门商务带的地标塔楼，维京港最高的建筑，矗立在维京港市海门区南端的中央商务区，塔基约 90 米见方。海门区沿维京港西岸向北扩展，因位于入港航道的「海门」而得名；塔楼周围聚集了银行、保险、航运金融和律师事务所，领地大部分企业总部也设在这一带，北段则是软件、数据服务和设计公司聚集的科技园。高收入岗位使海门成为维京港人均产出最高的区，滨海一线是全市最贵的公寓和餐厅，说中文、维京语和巴克汉姆语的家庭大致相当，国际学校和多语种社区中心随处可见。玻璃幕墙的塔楼和周围的高层公寓，与格约特斯塔德老城的石屋形成鲜明对比，代表着维京港的现代一面。西岸公路从塔下经过，南接瓦尔维克，北经菲尔内斯通往西北市；海门角伸入海中，角上的灯塔与观景平台可以眺望进出菲尔内斯湾的船只。观景层的咖啡馆能一眼看到外礁深水港和鲸湾跨海大桥，雨天里港口的灯火在水汽中晕开一片。\n塔顶的灯每晚按维京港市旗的颜色亮起墨绿和金色，夏至前后港里船只午夜鸣笛时，塔顶的灯会跟着笛声闪烁。海门的年轻职员下班后爱在观景层喝一杯，老港人却说，从格约特斯塔德的石垒上看这座塔，才最像一根插在海边的金色桅杆。"
      en: "The landmark tower of the Seagate business belt and the tallest building in Viking Port, standing in the central business district at the southern end of Seagate District on a base about 90 m square. Seagate grew northwards along Viking Port's west shore and takes its name from its position at the \"sea gate\" of the harbour channel. Around the tower cluster banks, insurers, shipping finance houses and law firms, and most of the territory's corporate headquarters are in the area too, while the northern stretch is a technology park of software, data and design firms. High-paying jobs make Seagate the district with the highest output per head in Viking Port; the seafront has the city's most expensive flats and restaurants, Chinese-, Viking- and Buckham-speaking families are present in roughly equal numbers, and international schools and multilingual community centres are everywhere. The glass-walled tower and the high-rise flats around it stand in sharp contrast to the stone houses of Grjotstad's old town and represent Viking Port's modern face. The West Coast Highway passes below, south to Walvik and north through Fyrnes to Northwest City; Seagate Cape juts into the sea, its lighthouse and viewing platform overlooking ships entering and leaving Fyrnes Bay. The café on the observation level takes in the Outer Skerry Deep-Water Port and the Whale Bay Sea Bridge at a glance, and on rainy days the harbour lights blur into a glow in the mist.\nEach night the lights at the top shine dark green and gold, the colours of the Viking Port city flag, and around midsummer, when the ships in the harbour sound their horns at midnight, the crown lights flash in time with them. Seagate's young office workers like a drink on the observation level after work, but old harbour hands say the tower looks best from the stone fort at Grjotstad, where it looks like a golden mast planted at the edge of the sea."
    in: div_k1yr6m
    offset_km: [0.5, 0.3]
    site: { size_m: [90, 90], layout: tower }

