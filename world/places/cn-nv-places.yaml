    names:
      zh: 东营空军基地
      en: East Camp Air Base
      art-x-viking: Luftwaffenstützpunkt Ostlager
      art-x-buckham: Base Aerea di Campo Est
    notes:
      zh: 东营空军基地位于东营区北部的平原上，是马斯林山上空防空作战的主基地，担负发射与降落中心、深空太空军指挥中心和整个马斯林盆地的空中掩护。基地有两条平行跑道，一条供日常起降，另一条兼作备用跑道和夜航训练；滑行道外侧分布着数十座加固机库，以环形滑行道相连，战机可以从机库直接滑出起飞。机务区、油库和塔台集中在跑道的另一侧，弹药库分散在远离跑道的土堤后面。马斯林山冬季漫长，跑道和滑行道铺设了融雪系统，除雪车队可在暴雪停止后一小时内恢复起降。每逢发射窗口，基地都会派出战斗机在发射场上空轮流巡逻，确保空域内没有不明飞行器。基地经马斯林山空天高速与城区和雪谷的两座基地相连，负责大修的东营航空修理厂就在跑道附近。
      en: East Camp Air Base stands on the plain in the north of East Camp District and is the main base for air defence over Maslin Mountain, covering the launch and landing centre, the Deep Space Force command centre and the whole Maslin basin. It has two parallel runways, one for everyday traffic and one kept as a spare and for night training. Beyond the taxiway stand dozens of hardened shelters on looping taxiways, so fighters can roll straight out of cover and take off. Maintenance, the fuel farm and the tower are grouped on the other side of the runways, and the ammunition stores are scattered behind earth banks well away from them. Winters at Maslin are long, so the runways and taxiways have built-in snow melting and the clearing teams can reopen the field within an hour of a blizzard ending. In every launch window the base keeps fighters on patrol over the launch site so that no unknown aircraft enters the airspace. The Maslin Aerospace Expressway links it to the city and the two bases in Snow Valley, and the East Camp Aircraft Repair Plant, which overhauls its aircraft, is close by.
    in: div_tc0ngk
