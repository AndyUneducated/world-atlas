      en: "Spaceport at the mouth of the Tirrukiluk River, its pads facing the sea; Starport District is named after it. The pads face east over the sea, so rockets are soon over open water and any debris falls into empty ocean. The bakeries of Peace District start selling rocket-shaped cream buns the day before a launch, and on the day the seaside viewing stands fill with people from all over the island."
    in: div_nytsvb
