    short_names: { zh: 脊椎医疗中心, en: Spine Centre, es: Centro de Columna }
    notes:
      zh: "无醇街南边的一座医院，从天上看就是一根脊椎：七块越往下越宽的楼层排成一列，中间用一道玻璃长廊串起来，像一节节椎骨和中间的脊髓；最南边是一座椭圆形的康复大厅，形状像骨盆。七块楼正好对应人的七节颈椎，因为这里看得最多的病，就是颈椎病。\n来这里看病的人大多是坐出来的：程序员、设计师、司机、赛车手。乔什自己就是第一位病人。他在南圣何塞住公寓的那些年，周末常在商场里找一个靠插座的座位改代码，一坐就是一个下午，脖子越伸越长，背越弯越低，有一天抬头去看电影院的排片表，脖子「咔」地响了一声。从那以后他就想，要是有一座医院专门治这个就好了。\n医疗中心里有骨科、理疗科、康复科和一个小小的影像中心。门诊大厅里摆着一面「姿势镜」，人往镜子前一站，人工智能就把他的脊椎画出来，标出哪一节弯了，再给一句诊断，最常见的是「您的头比您的身体早到了五厘米」。康复大厅里有泳池、悬吊训练架和一整面攀岩墙，医生开的处方里常常有一条「每天站着开一次会」，无醇街东头的站立办公大楼就是为此盖的。停车场在西边，东北角有一座直升机坪，赛车场有人受了伤，几分钟就能送到。这里的护士有一句口头禅：「挺胸，抬头，手机放下。」病人们说，这句话比任何药都管用。"
      en: "A hospital on the south side of Alcohol-Free Street that from the air is a spine: seven blocks, each wider than the one above, stand in a column threaded on a glass corridor like vertebrae on the spinal cord, and at the southern end an oval rehabilitation hall is shaped like a pelvis. The seven blocks match the seven vertebrae of the human neck, because the complaint seen here most often is neck trouble.\nMost patients got that way by sitting: programmers, designers, drivers, racing drivers. Josh himself was the first. In his years in an apartment in South San Jose he would spend weekend afternoons in a mall seat by a power socket changing code, his neck stretching further and his back bending lower, until one day he looked up at the cinema's listings and his neck went 'click'. From then on he thought how good it would be to have a hospital just for that.\nThe centre has orthopaedics, physiotherapy, rehabilitation and a small imaging unit. In the outpatients' hall stands a 'posture mirror': step in front of it and an AI draws your spine, marks which vertebra is out of line and gives a one-line diagnosis, most often 'your head is arriving five centimetres before your body'. The rehabilitation hall has a pool, suspension training frames and a whole climbing wall, and prescriptions often include 'hold one meeting a day standing up', which is why the Standing Office Tower was built at the east end of the street. The car park is on the west side and a helipad in the north-east corner, so anyone hurt at the circuit can be here in minutes. The nurses have a catchphrase, 'chest out, chin up, phone down', which patients say works better than any medicine."
    in: div_jjgxvk
    offset_km: [3.2, -4.75]
    site: { layout: spine, size_m: [300, 500], angle_deg: 0 }
  - id: bld_ph7t0s
    subtype: photo_studio
    status: generated
    names:
      zh: 乔什摄影工作室
      en: Josh Photo Studio
      es: Estudio Fotográfico Josh
    short_names: { zh: 摄影工作室, en: Photo Studio, es: Estudio Fotográfico }
    notes:
      zh: "无醇街南边、脊椎医疗中心东边的一座小楼，从天上看是一台相机：方方正正的机身，朝南伸出一个圆圆的镜头，机身顶上是取景器的凸起和一个快门按钮形状的小亭子。镜头其实是一座圆形的玻璃中庭，中间有一个圆形的水池，晴天池水倒映着天空，从楼上往下看，就像从镜头里往外看。\n摄影是乔什写代码之外最大的爱好。他拍赛车，拍葡萄，拍榴莲，拍朋友们围着长餐桌吃饭的样子，就是很少拍自己。工作室里有一间大摄影棚，背景纸从白到黑有十几种颜色，灯光能模拟从清晨到黄昏任何时候的阳光；还有一间老式暗房，在红灯下冲洗胶片，乔什说这是他唯一不用人工智能的地方：「有些东西就是要等它慢慢显影。」楼上是后期室和一个小展厅，展出庄园里每一季最好的照片，最近一期的主题是「采收季：所有人都没在看手机」。\n工作室也给庄园里的其他地方拍照：酒庄和啤酒屋的酒标、车牌厂的车牌墙、乔什团队每一个应用在应用商店里的截图。乔什给自己的应用定了一条规矩，截图必须是真人真景，不许摆拍，所以庄园里几乎每个人都在某个应用的截图里出现过，车牌厂的一位老师傅出现得最多，被大家叫作「截图之王」。门口那个快门按钮亭是一个真的按钮，游客按下去，楼顶的相机就给整条无醇街拍一张全景，第二天贴在门口的墙上。"
      en: "A small building on the south side of Alcohol-Free Street, east of the Spine Centre, that from the air is a camera: a squared-off body with a round lens projecting to the south, and on top the hump of the viewfinder and a little pavilion shaped like the shutter button. The lens is really a round glass atrium with a circular pool in the middle; on sunny days the pool mirrors the sky, so looking down from upstairs is like looking out through the lens.\nPhotography is Josh's biggest hobby after code. He photographs racing cars, grapes, durians and his friends round the long dining table, and hardly ever himself. The studio has a large shooting room with a dozen backdrop papers from white to black and lighting that can imitate the sun at any hour from dawn to dusk, and an old-fashioned darkroom where film is developed under a red lamp, which Josh says is the one place he uses no AI: 'some things you just have to let develop slowly.' Upstairs are the editing rooms and a small gallery showing each season's best photos from the estate; the latest show is called 'Harvest: nobody looking at their phone'.\nThe studio also shoots for the rest of the estate: labels for the winery and the beer houses, the plate wall at the number-plate works and the app-store screenshots for every one of Josh's apps. Josh has a rule that screenshots must show real people in real places, never staged, so nearly everyone on the estate has appeared in some app's screenshot; a veteran craftsman at the plate works appears most often and is known as 'the King of Screenshots'. The shutter-button pavilion by the door is a real button: press it, and the camera on the roof takes a panorama of the whole street, pinned up on the wall by the door the next day."
    in: div_jjgxvk
    offset_km: [3.85, -4.6]
    site: { layout: camera, size_m: [220, 160], angle_deg: 0 }
  - id: poi_jsq7r2
    subtype: plaza
    status: generated
    names:
      zh: 乔什广场
      en: Josh Square
      es: Plaza Josh
    notes:
      zh: "无醇街和榴莲路之间、乔什大道东边的一座方形广场，是乔什新街区的中心。广场正中是乔什塑像，四块方形草坪把四周的铺地分成一个十字，每块草坪中间有一座喷泉，南北两边各有一道长长的拱廊。\n广场的铺地是用彩色石块拼出来的乔什庄园赛车场：赛道的十六个弯一个不少，按真实赛道缩小了十几倍，主直道正好经过塑像脚下。区里的孩子们最爱在这里「跑一圈」，从起跑线出发，沿着彩色石块一路跑过葡萄藤弯和发夹弯，最快的纪录写在北边拱廊的一根柱子上，几乎每个周末都会被刷新。乔什自己也跑过，成绩照例排在中间。\n四座喷泉对应庄园的四季：春天的那座喷出的水带着啤酒花的清香，夏天的那座喷的是冰凉的水雾，秋天的那座在采收季会变成葡萄的紫色，冬天的那座是温水，冒着白汽。每当车库实验室有一个新应用上线，夜里四座喷泉会一起亮起来，和七十多公里外露西广场那座为新芯片亮起的喷泉遥相呼应。北边拱廊下是六座啤酒屋的小吧台，可以一次尝遍六种风格；南边拱廊下是榴莲摊，广场上有一条不成文的规矩：榴莲只在南边拱廊打开，吃完再回来。每个周日上午，广场上有一个跳蚤市场，改装车间的技师卖旧零件，摄影工作室卖明信片，种植园卖榴莲苗，生意最好的永远是无醇啤酒。"
      en: "A square plaza between Alcohol-Free Street and Durian Road, east of Josh Avenue, the heart of Josh's new quarter. The statue of Josh stands at its centre; four square lawns divide the paving round it into a cross, each lawn with a fountain in the middle, and a long arcade runs along both the north and south sides.\nThe paving is Josh Estate Circuit laid out in coloured stone: all sixteen corners, scaled down more than tenfold, with the main straight running right past the statue's feet. The district's children love to 'do a lap' here, setting off from the start line and racing along the coloured stones through the Vine Bends and the hairpin; the record is written on a column of the north arcade and is broken almost every weekend. Josh has run it too, finishing mid-table as usual.\nThe four fountains stand for the estate's four seasons: the spring fountain smells of fresh hops, the summer one throws a cool mist, the autumn one turns grape purple at harvest and the winter one runs warm and steams. Whenever the Garage Lab launches a new app, all four light up that night, answering the fountain in Lucy Square more than seventy kilometres away, which lights up for each new chip. Under the north arcade are little bars from the six beer houses, so all six styles can be tried at once; under the south arcade are the durian stalls, and the square has an unwritten rule that durians are opened only under the south arcade, and you come back when you have finished. On Sunday mornings there is a flea market, the Tuning Workshop's mechanics selling old parts, the Photo Studio postcards and the plantation durian seedlings, though the best trade is always in alcohol-free beer."
    in: div_jjgxvk
    offset_km: [5.1, -4.75]
    site: { layout: square, variant: square, size_m: [400, 400], angle_deg: 0 }
  - id: poi_jst7tv
    subtype: statue
    status: generated
    names:
      zh: 乔什塑像
      en: Statue of Josh
      es: Estatua de Josh
    notes:
      zh: "乔什广场正中的一座青铜塑像，塑的是乔什站着，右手托着一台打开的笔记本电脑，左手托着一颗青铜榴莲，抬头望向西北。雕塑家最初的方案是乔什当年在商场里改代码的样子：坐在插座旁边，弓着背，脖子往前伸，屏幕的光照在脸上。这个方案在脊椎医疗中心的审查会上被一票否决，医生们说：「全区的孩子每天都会看见这座塑像，我们不能让它传播不良坐姿。」于是塑像改成了站着，背挺得笔直，下巴微收，笔记本电脑的屏幕正好和视线平齐。医疗中心的姿势镜给它打了满分，它是全区唯一一个拿到满分的「人」。\n左手那颗榴莲是乔什坚持要加的。雕塑家照着种植园里的一颗猫山王一比一地做，每一根刺都是尖的，于是鸽子从来不落在这只手上，只落在电脑屏幕上，乔什说这很合理：「鸽子也想看看最新的应用。」塑像的目光朝着西北，那里是七十多公里外的露西广场，两座塑像隔着山谷互相望着，一个把晶圆举到眼前，一个把电脑托在手上，正好是一块芯片从造出来到被用起来的两头。\n底座上刻着车库实验室门口那块牌子上的话：「先有人用，再谈改变世界。」底座下面埋着一个时间胶囊，里面装着车库实验室第一个应用的源代码、一瓶无醇皮尔森和一颗冷冻的榴莲，约定等庄园所有的应用都没有 bug 的那天再打开，乔什说它大概永远也不会被打开。夜里，笔记本电脑的屏幕会亮起来，显示车库门口小黑板上的那个数字：用户第二周还会不会再打开。"
      en: "A bronze statue at the centre of Josh Square showing Josh standing, an open laptop on his right hand and a bronze durian on his left, looking up towards the north-west. The sculptor's first design showed Josh as he used to change code in the mall: sitting by a power socket, back hunched, neck craned forward, the screen lighting his face. The Spine Centre's review panel rejected it outright, the doctors saying: 'every child in the district will see this statue every day, and we cannot have it spreading bad posture.' So the statue now stands, back perfectly straight, chin slightly tucked, the laptop screen exactly at eye level. The centre's posture mirror gave it full marks, making it the only 'person' in the district to score full marks.\nThe durian in the left hand was Josh's insistence. The sculptor copied a Musang King from the plantation at full size with every spike sharp, so pigeons never land on that hand, only on the laptop screen, which Josh says is quite reasonable: 'pigeons want to see the latest app too.' The statue gazes north-west, towards Lucy Square more than seventy kilometres away, so the two statues look at each other across the valleys, one holding a wafer up to her eyes and the other a laptop in his hand: the two ends of a chip's life, from being made to being used.\nThe plinth bears the words from the sign by the Garage Lab door: 'First people use it, then we talk about changing the world.' Beneath it lies a time capsule holding the source code of the Garage Lab's first app, a bottle of alcohol-free Pilsner and a frozen durian, to be opened on the day every app on the estate is free of bugs, which Josh says means it will probably never be opened. At night the laptop screen lights up with the number on the little blackboard by the garage door: whether users open the app again in their second week."
    in: div_jjgxvk
    offset_km: [5.1, -4.75]
  - id: bld_ch7rmz
    subtype: museum
    status: generated
    names:
      zh: 乔什人体工学椅博物馆
      en: Josh Ergonomic Chair Museum
      es: Museo de la Silla Ergonómica Josh
    short_names: { zh: 人体工学椅博物馆, en: Chair Museum, es: Museo de la Silla }
    notes:
      zh: "乔什广场东边的一座博物馆，从天上看是一把办公椅的椅脚：一座圆形的中央大厅向五个方向伸出五条展廊，每条展廊的尽头是一座圆形的小展厅，像椅脚下的五个滚轮。这个形状不只是为了好看：办公椅用五个支点，是因为五个比四个更稳、更不容易翻，所以博物馆的第一件展品，就是它自己。\n五条展廊按用途分开：第一条是古代的凳子、长椅和宝座；第二条是工厂和学校里的硬木椅；第三条是各式各样的办公椅，从一坐就吱吱响的老式转椅到能调十几个部位的人体工学椅；第四条是电竞椅和赛车座椅，其中一把是从改装车间「转岗」过来的；第五条叫「不该坐的地方」，展出乔什当年坐过的那些：公寓里的折叠餐椅、商场里靠插座的硬座，还有一把和电影院里「乔什专座」一模一样的复制品。每件展品旁边都有一块牌子，标着脊椎医疗中心给它打的分，分数最低的那件，正是乔什坐得最久的那件。\n中央大厅是全馆唯一可以坐下的地方，摆着一百把不同的人体工学椅，游客可以挨个坐一坐，再让旁边的人工智能告诉自己哪一把最合适。它最常给的建议是：「哪一把都可以，但请每四十分钟站起来一次。」于是大厅的出口直接通向东边的站立办公大楼。馆里的讲解员都是站着讲解的，她们说这份工作最大的讽刺是：在椅子博物馆里上班，一整天都不能坐。"
      en: "A museum east of Josh Square that from the air is the base of an office chair: a round central hall sends out five galleries in five directions, each ending in a small round hall like the five castors under a chair. The shape is not just for looks: office chairs stand on five points because five are steadier than four and harder to tip over, so the museum's first exhibit is the building itself.\nThe five galleries are arranged by use. The first holds ancient stools, benches and thrones; the second the hard wooden chairs of factories and schools; the third every kind of office chair, from the old swivel chair that creaks as you sit to the ergonomic chair with a dozen adjustments; the fourth gaming chairs and racing seats, one of them 'transferred' from the Tuning Workshop; and the fifth, called 'places you shouldn't sit', shows the ones Josh used to sit on: the folding dining chair from his apartment, a hard seat by a power socket from the mall and an exact copy of 'Josh's seat' in the cinema. Every exhibit has a plaque with the score the Spine Centre gave it, and the lowest-scoring one is the one Josh sat on longest.\nThe central hall is the only place in the museum where you may sit down, with a hundred different ergonomic chairs that visitors can try one by one before asking the AI beside them which suits them best. Its most frequent advice is: 'any of them, but please stand up every forty minutes.' So the hall's exit leads straight into the Standing Office Tower to the east. The guides all give their tours standing, and they say the great irony of the job is working all day in a chair museum without once being allowed to sit."
    in: div_jjgxvk
    offset_km: [5.8, -4.68]
    site: { layout: chair, size_m: [300, 300], angle_deg: 0 }
  - id: bld_stnd7k
    subtype: office
    status: generated
    names:
      zh: 乔什站立办公大楼
      en: Josh Standing Office Tower
      es: Torre de Oficinas de Pie Josh
    short_names: { zh: 站立办公大楼, en: Standing Office, es: Oficinas de Pie }
    notes:
      zh: "无醇街东头南边的一座细高塔楼，是乔什团队的新办公楼，楼里一把椅子也没有。每一层都是站立办公桌，桌面能升能降，但最低只降到齐腰；会议室里没有会议桌，只有一圈高脚台，开会的人都站着，所以这栋楼里的会平均比车库实验室里短了一大半。楼梯间的墙上写着每一层的「海拔」和爬到这一层消耗的卡路里，电梯随时为访客和需要的人开放，员工没事请走楼梯。\n顶层有一排走步机办公桌，一边写代码一边慢慢走，屏幕的角落显示今天走了多少公里。团队里有人算过，整栋楼一个月走的路加起来，够从乔什宅邸到露西宅邸走上几十个来回。走得最多的是测试工程师，他们说一边走一边找 bug，脑子特别清楚；走得最少的是乔什，因为他总是走到一半就停下来，拉着人讨论应用。\n楼里的椅子都去哪儿了？答案就在隔壁：全部捐给了人体工学椅博物馆，在那里当展品。不过一楼大厅里还是留了十二把椅子，是给来访的客人坐的，每把椅背上都贴着一张小纸条：「本椅仅供客人使用，员工如需坐下，请先向脊椎医疗中心申请。」至今还没有人申请成功过，因为医疗中心每次的批复都一样：「批准坐下四十分钟。」大楼的外墙在夜里会亮起一条从下往上走的光带，像一个人慢慢从椅子上站起来，附近的人说，看见它就想伸个懒腰。"
      en: "A slim tower on the south side of the east end of Alcohol-Free Street, the new office of Josh's team, without a single chair inside. Every floor has standing desks that rise and fall but go no lower than waist height; the meeting rooms have no tables, only a ring of tall counters, and everyone stands, so meetings here are on average less than half as long as in the Garage Lab. The stairwell walls give each floor's 'altitude' and the calories burned climbing to it; the lifts are always open to visitors and anyone who needs them, and staff are asked to take the stairs unless they have a reason not to.\nThe top floor has a row of treadmill desks for walking slowly while writing code, a corner of the screen showing how many kilometres have been walked today. Someone on the team worked out that a month of the whole building's walking would take you from Josh's House to Lucy's House and back dozens of times. The test engineers walk the most, saying they think clearest hunting bugs on the move; Josh walks the least, because he always stops halfway to talk someone through an app.\nWhere did the chairs go? Next door: every one was given to the Ergonomic Chair Museum as an exhibit. The ground-floor lobby does keep twelve chairs for visitors, each with a note on its back: 'For guests only; staff wishing to sit must first apply to the Spine Centre.' Nobody has yet applied successfully, because the centre always gives the same answer: 'Approved to sit for forty minutes.' At night a band of light climbs the outside of the tower from bottom to top, like someone slowly getting up from a chair, and the neighbours say that seeing it makes them want to stretch."
    in: div_jjgxvk
    offset_km: [6.35, -4.65]
    site: { layout: tower, size_m: [170, 170], angle_deg: 0, rural: true }
  - id: bld_dr7nfx
    subtype: tower
    status: generated
    names:
      zh: 乔什无人机摄影塔
      en: Josh Drone Photography Tower
      es: Torre de Fotografía con Drones Josh
    short_names: { zh: 无人机摄影塔, en: Drone Tower, es: Torre de Drones }
    notes:
      zh: "庄园公路东段南边、葡萄园对面的一座细高的观景塔，塔脚围着一圈起降平台，四个角上各有一个圆形停机坪，是乔什的无人机摄影基地。塔顶是一个玻璃观景台，晴天从这里能看见北边整片葡萄园、赛车场的主直道和更远处车牌厂的锯齿形屋顶，往西南看是无醇街上的六座啤酒屋和种植园的温室屋顶。\n塔里住着几十架无人机，各有分工：有的在赛车季跟拍赛车，贴着弯道外侧飞，把每一次超车都录下来；有的在采收季给葡萄园拍照，从叶子的颜色判断哪一块该先摘；有的每天清晨绕庄园飞一圈，在同一个位置、同一个时间给摄影工作室拍一张照片，一年下来，工作室的墙上就是一整面慢慢变色的庄园。还有一架专门在榴莲成熟的季节飞到种植园上空，用它的「鼻子」，也就是一个气体传感器，闻一闻哪一棵树的榴莲快熟了，工人们管它叫「闻香无人机」。\n所有的无人机都由乔什的一个应用调度，它会自己规划航线，避开直升机坪和赛车场的禁飞时段，飞完回来自己落到停机坪上充电。塔下的小展厅每周放映一次「本周最佳镜头」，评选的标准只有一条：画面里要有人在笑。最受欢迎的一次，是一架无人机拍到乔什坐在赛道边吃榴莲，笑得很开心，周围三米之内空无一人。"
      en: "A slim observation tower on the south side of the eastern stretch of the estate road, across from the vineyard, with a ring of launch decks round its foot and a round landing pad at each of its four corners: the base for Josh's drone photography. At the top is a glass viewing deck, and on clear days you can see from it the whole vineyard, the circuit's main straight and the saw-tooth roofs of the plate works to the north, and to the south-west the six beer houses on Alcohol-Free Street and the greenhouse roofs of the plantation.\nSeveral dozen drones live in the tower, each with its own job. Some follow the cars in racing season, flying close round the outside of the corners to record every overtake; some photograph the vineyard at harvest, judging from the colour of the leaves which block to pick first; and some fly a circuit of the estate every dawn, taking a picture for the Photo Studio from the same spot at the same time, so that over a year the studio's wall fills with an estate slowly changing colour. One flies over the plantation in the durian season, using its 'nose', a gas sensor, to sniff out which trees' fruit is nearly ripe; the workers call it the 'sniffer drone'.\nAll the drones are run by one of Josh's apps, which plans their routes, keeps them clear of the helipads and the circuit's no-fly sessions, and brings them back to land on their pads to recharge. The small gallery at the foot of the tower shows 'shot of the week' once a week, judged on a single rule: someone in the picture must be laughing. The most popular was a drone's shot of Josh sitting by the track eating a durian, laughing happily, with nobody else within three metres."
    in: div_jjgxvk
    offset_km: [7.0, -2.95]
    site: { layout: dronetower, size_m: [150, 150], angle_deg: 0 }

  # 榴莲路南侧：榴莲种植园、榴莲气味隔离塔、武器收藏库、靶场
  - id: poi_d7r1an
    subtype: orchard
    status: generated
    names:
      zh: 乔什榴莲种植园
      en: Josh Durian Plantation
      es: Plantación de Durián Josh
    short_names: { zh: 榴莲种植园, en: Durian Plantation, es: Plantación de Durián }
    notes:
      zh: "榴莲路南边的一大片种植园，四个方方正正的园块里种着上千棵榴莲树，每个园块都罩在一座可以开合的温室屋顶下。榴莲是热带的树，喜欢终年湿热、从不下霜的地方，而乔什庄园区的夏天又热又干，冬天还会结霜，有记录以来最冷的一个夜晚到过零下五度。所以这里的榴莲树住的是「空调房」：屋顶晴天打开，让加州的阳光照进来；夜里和冬天合上，里面保持二十五度以上、湿度百分之八十，像东南亚雨林里的一个下午。\n园里种了三个品种：猫山王、金枕和黑刺，各有一群忠实的粉丝，每到成熟季都要为哪一种最好吃争论一番。榴莲花在夜里开放，在老家靠吃花蜜的蝙蝠授粉，温室里没有野生蝙蝠，种植园就请来了一群，住在屋顶下的蝙蝠房里，工作时间是晚上，报酬是花蜜和熟透的水果。榴莲熟了会自己从树上掉下来，一颗好几斤，还带着满身的硬刺，所以园里的规矩是进园必须戴安全帽，树下张着网兜，工人们清早去网里收果子，像去收一夜的渔网。\n南边的平房是分拣包装车间和冷库，东南角的小池塘收集雨水，用来给温室加湿。种植园的榴莲大部分留在庄园里，一部分送到露西的甜品工坊，做成榴莲点心，再专门留给乔什。乔什每次来园里，都会挑一颗刚掉下来的，坐在田埂上就地打开，园里的工人说，那是他最安静的时候，因为周围没有人愿意靠近。"
      en: "A large plantation south of Durian Road, a thousand or more durian trees growing in four rectangular blocks, each under a greenhouse roof that opens and closes. The durian is a tropical tree that likes year-round heat and humidity and never a frost, but Josh Estate District has hot, dry summers and frosty winters, its coldest night on record reaching five below zero. So the trees here live in 'air-conditioned rooms': the roofs open on sunny days to let the Californian sun in and close at night and in winter, keeping the inside above twenty-five degrees at eighty per cent humidity, like an afternoon in a South-East Asian rainforest.\nThree varieties grow here, Musang King, Monthong and Black Thorn, each with its own loyal fans, who argue every ripening season over which is best. Durian flowers open at night and in their homeland are pollinated by nectar-feeding bats; the greenhouses had no wild bats, so the plantation invited a colony to live in bat boxes under the roofs, working the night shift for a wage of nectar and ripe fruit. Ripe durians fall from the tree by themselves, several kilos each and covered in hard spikes, so the rule is that everyone wears a hard hat in the plantation; nets are slung under the trees, and the workers empty them at dawn like fishermen bringing in a night's catch.\nThe low building to the south houses the sorting and packing hall and the cold store, and a small pond in the south-east corner gathers rain to humidify the greenhouses. Most of the durians stay on the estate, and some go to Lucy's dessert workshop to be made into durian pastries kept especially for Josh. Whenever Josh visits the plantation he picks a freshly fallen fruit and opens it right there on the bank between the blocks; the workers say it is when he is at his most peaceful, because nobody is willing to come near."
    in: div_jjgxvk
    offset_km: [3.2, -5.9]
    site: { layout: orchard, variant: durian, size_m: [1600, 1000], angle_deg: 0 }
  - id: bld_0d7rtw
    subtype: tower
    status: generated
    names:
      zh: 乔什榴莲气味隔离塔
      en: Josh Durian Odour Isolation Tower
      es: Torre de Aislamiento del Olor del Durián Josh
    short_names: { zh: 气味隔离塔, en: Odour Tower, es: Torre del Olor }
    notes:
      zh: "榴莲种植园东边、榴莲路南边的一座塔楼，是全庄园唯一允许在室内打开榴莲的地方。榴莲的气味来自果肉里几十种含硫的化合物，有人闻到的是奶油和焦糖，有人闻到的是煤气和洋葱。东南亚很多酒店和地铁都禁止带榴莲进入，乔什的庄园也不例外：宅邸、车库实验室和六座啤酒屋的门口都贴着同一个标志，一颗被红圈划掉的榴莲。\n想吃，就来这座塔。塔的入口是一道双层气闸门，进门先换上一件一次性的围裙；塔里的气压比外面低一点，空气只进不出，所有的气味都被抽到塔顶，经过一层活性炭、一层光催化和一层水雾洗涤，最后从五十米高的塔顶排出去，据说排出去的空气闻起来只剩下一点点焦糖味。塔里每一层都有几张长桌和开榴莲的专用工具，墙上的屏幕实时显示一个「榴莲指数」，一旦超过 5，抽风机就会自动加大马力。\n塔的设计请教过露西的清风中心，露西当时只提了一个要求：「不能闷。」所以塔里的风比外面还大，吃榴莲的人都说这里是全庄园最凉快的地方。露西本人来过一次，在气闸门口站了一分钟，最后决定在门外等。乔什在里面吃完了一整颗，出来的时候身上的气味已经被吹得干干净净，露西凑过去闻了闻，说：「还行，像焦糖。」这句话后来被刻在了塔门口，成了这座塔的验收标准。"
      en: "A tower east of the durian plantation and south of Durian Road, the only place on the estate where durians may be opened indoors. The smell of durian comes from dozens of sulphur compounds in the flesh; some people smell cream and caramel, others gas and onions. Many hotels and metro systems in South-East Asia ban durians, and Josh's estate is no exception: the doors of the house, the Garage Lab and all six beer houses carry the same sign, a durian crossed out in a red circle.\nIf you want to eat one, you come here. The entrance is a double airlock, and inside you put on a disposable apron; the air pressure inside is a little lower than outside, so air comes in but never leaks out, and every smell is drawn up to the top through a layer of activated carbon, a layer of photocatalysis and a water-mist scrubber before leaving from the top of the fifty-metre tower, the air coming out said to smell of nothing more than a hint of caramel. Every floor has long tables and special tools for opening durians, and a screen on the wall shows a live 'durian index'; above 5, the extraction fans speed up by themselves.\nThe design was worked out with the help of Lucy's Breeze Centre, and Lucy made only one demand at the time: 'it must not be stuffy.' So the breeze inside is stronger than outside, and the durian eaters say it is the coolest place on the estate. Lucy herself came once, stood at the airlock for a minute and decided to wait outside. Josh ate a whole durian inside, and when he came out the smell had been blown clean away; Lucy leaned in, sniffed and said: 'Not bad, like caramel.' The words were later carved by the tower door and became its acceptance standard."
    in: div_jjgxvk
    offset_km: [4.25, -5.75]
    site: { layout: tower, size_m: [150, 150], angle_deg: 0, rural: true }
  - id: poi_arm7ry
    subtype: armoury
    status: generated
    names:
      zh: 乔什武器收藏库
      en: Josh Armoury
      es: Armería Josh
    short_names: { zh: 武器收藏库, en: Armoury, es: Armería }
    notes:
      zh: "榴莲路南边、乔什广场正南的一座方形院子，两道高墙一里一外围着一片碎石场，正中是一座低矮的库房，四个角上各有一座半埋在地下的小库，西边是一座门楼。这里是乔什的私人武器收藏库，收藏的大多是有历史的兵器：古代的刀剑、长矛和弓弩，中世纪的盔甲，各个时代的老式火枪，还有一批退役的猎枪和运动步枪。所有的藏品都按照州里的法律登记和保管，枪和弹药分开存放，最珍贵的几件锁在四个角上的小库里。\n库房的展厅按兵器的「进化」排列，从石器到弓箭，从铠甲到火药，每一件旁边都有一块牌子，讲它是怎么造的、在什么场合用过、后来为什么被淘汰。最受欢迎的展柜却不是哪一把名刀，而是一根中世纪的狼牙棒：圆圆的锤头上布满尖刺，参观的人走到它面前，几乎都会说同一句话：「这不就是榴莲吗？」乔什于是在旁边放了一颗真榴莲做对比，标签上写着：「左边这件已经退役，右边这件仍在服役。」\n收藏库的规矩比庄园里任何地方都严：进门要登记，全程有讲解员陪同，展柜里的东西只能看不能碰，库房的钥匙分成两半，一半在乔什手里，一半在保安队长手里。乔什说收藏这些兵器不是为了打仗，而是为了记住：人类花了几千年把工具做得越来越锋利，现在该花点时间把它们做得越来越好用了。东边的靶场里，这些老兵器的后代还在继续练习，只打纸靶和飞碟。"
      en: "A square compound south of Durian Road, directly south of Josh Square: two high walls, one inside the other, enclose a gravel yard with a low vault building in the middle, a small half-buried store in each of the four corners and a gatehouse on the west side. This is Josh's private armoury, a collection mostly of historic arms: ancient swords, spears and crossbows, medieval armour, old muskets from many periods and a set of retired hunting and target rifles. Everything is registered and kept as the state's laws require, firearms and ammunition stored apart, and the most precious pieces locked in the four corner stores.\nThe galleries follow the 'evolution' of weapons, from stone tools to bows, from armour to gunpowder, each piece with a plaque telling how it was made, where it was used and why it was eventually superseded. The most popular case, though, holds no famous blade but a medieval morning star, its round head bristling with spikes, and almost every visitor who reaches it says the same thing: 'Isn't that a durian?' So Josh put a real durian beside it for comparison, labelled: 'The one on the left has been retired; the one on the right is still in service.'\nThe rules here are the strictest on the estate: visitors sign in and are accompanied by a guide throughout, nothing in the cases may be touched, and the key to the vault is in two halves, one held by Josh and the other by the head of security. Josh says he collects these weapons not for fighting but for remembering: people spent thousands of years making their tools ever sharper, and now it is time to spend a while making them ever more useful. At the range to the east, the descendants of these old weapons are still practising, at nothing but paper targets and clays."
    in: div_jjgxvk
    offset_km: [5.0, -5.65]
    site: { layout: armoury, size_m: [260, 260], angle_deg: 0 }
  - id: poi_rng7sh
    subtype: shooting_range
    status: generated
    names:
      zh: 乔什靶场
      en: Josh Shooting Range
      es: Campo de Tiro Josh
    short_names: { zh: 靶场, en: Shooting Range, es: Campo de Tiro }
    notes:
      zh: "榴莲路东段南边的一座靶场，所有的射击方向都朝东，打向一道高高的土堤。西头是俱乐部会所和停车场，会所东边是一道带顶棚的射击线，从射击线往东伸出七条长长的靶道，最远的靶子在七百多米外，靶道尽头那道几层楼高的土堤保证没有一发子弹能飞出靶场。射击线南边是一个围着墙的手枪靶区，再往东南是飞碟射击场，一排射击位围成半圆，中间是抛靶机。\n靶场的规矩是全庄园最严的之一：每个人第一次来都要先上半天的安全课，射击线上永远站着一位安全官，他喊「停火」的时候，所有人都要放下枪、退后一步，连乔什也不例外。靶子只有纸靶和飞碟，纸靶上印的是一圈圈圆环，偶尔也印一只卡通的虫子，乔什的团队管打靶叫「捉虫」，打中虫子的那一枪叫「修复」。\n靶场也用上了乔什的应用：每一发子弹打出去，靶子上的传感器会记下落点，射手放下枪以后，应用用一两句话告诉他问题在哪里，比如「你又提前扣扳机了」，或者「呼吸太急，像在赶上线」。这个应用和赛车场的那个是同一个团队做的，射手们说连语气都一模一样。会所的露台朝着西边的落日，打完靶的人坐在这里喝一杯无醇皮尔森，看着东边的土堤被夕阳染成金色。乔什说，在这里打一下午靶，比任何一款冥想应用都管用，虽然他的团队也做过一款冥想应用。"
      en: "A shooting range south of the eastern stretch of Durian Road, every lane firing east towards a high earth bank. At the west end are the clubhouse and car park, and east of the clubhouse a covered firing line from which seven long lanes run east, the furthest targets more than seven hundred metres away; the bank several storeys high at the end of the lanes makes sure no bullet leaves the range. South of the firing line is a walled pistol bay, and further south-east a clay field, a row of shooting stands set in a half-circle round the trap house.\nThe range's rules are among the strictest on the estate: everyone spends half a day on a safety course before their first visit, a range officer is always on the firing line, and when he calls 'cease fire' everyone puts down their gun and steps back, Josh included. The only targets are paper and clays; the paper targets are printed with rings, now and then with a cartoon bug, so Josh's team calls target practice 'bug hunting' and a hit on the bug 'a fix'.\nThe range uses one of Josh's apps too: sensors in the targets record where every shot lands, and when shooters lower their guns the app tells them in a sentence or two what went wrong, such as 'you jerked the trigger again' or 'breathing too fast, like before a release'. It was made by the same team as the circuit's app, and shooters say even the tone of voice is identical. The clubhouse terrace faces the western sunset, and after shooting people sit here with an alcohol-free Pilsner, watching the bank to the east turn gold in the evening light. Josh says an afternoon at the range works better than any meditation app, even though his team has made one of those too."
    in: div_jjgxvk
    offset_km: [6.4, -5.65]
    site: { layout: shooting, size_m: [1200, 400], angle_deg: 0 }
