# Real places round Lucy's and Josh's old homes in the Bay (M71), at their real positions (design km, from OpenStreetMap).
places:
  # ── 圣克拉拉区 ──
  - id: bld_nv3ndv
    subtype: headquarters
    status: generated
    names:
      zh: 英伟达 Endeavor 大楼
      en: NVIDIA Endeavor
      es: Edificio Endeavor de NVIDIA
    notes:
      zh: "英伟达总部园区的第一座三角形大楼，门牌是 San Tomas Expy 2788 号，紧挨着县快速路 G4。从空中看，整栋楼是一个巨大的三角形，屋顶上开着一排排三角形的天窗，楼里的会议室、楼梯和地毯花纹也都是三角形：据说因为三角形是计算机图形里最基本的单位，显卡画出的每一座山、每一张脸，归根到底都是几百万个小三角形拼起来的。员工说在这里待久了，看什么都像在数多边形，连午饭的三明治都要沿对角线切开。\n大楼里没有固定工位，大家按当天的项目挑座位，楼中央是一道宽阔的台阶，台阶两边坐满了开会的人，开着开着就变成了演示会。如今湾区人少，楼里白天也只亮着一小半灯，值班的是几位维护工程师和一群机器人：机器人负责送咖啡、擦天窗和给会议室消毒，工程师负责照看楼下机房里的服务器，以及偶尔把卡在三角形转角里出不来的扫地机器人抱出来。\n大楼门口的停车场原本是全区最难找车位的地方，现在空了一大半，只有早高峰时 G4 上那一串等左转的车提醒大家这家公司还很忙：股价每涨一轮，停车场就会多出几辆新车。露西当年在这里上班，她说这座楼最大的优点是走路不会迷路，因为不管往哪个方向走，最后都会走到一个角上。"
      en: "The first of the triangular buildings on NVIDIA's headquarters campus, at 2788 San Tomas Expy, right beside county route G4. From the air the whole building is one huge triangle, its roof set with rows of triangular skylights, and inside the meeting rooms, the stairs and even the pattern of the carpet are triangles too: the triangle, they say, is the basic unit of computer graphics, and every mountain and every face a graphics card draws comes down in the end to millions of little triangles. Staff say that after a while here everything looks like a polygon count, and even the lunchtime sandwiches get cut along the diagonal.\nThere are no fixed desks; people choose a seat for the day's project, and in the middle of the building a broad flight of steps is lined with meetings on both sides, which have a way of turning into demos. With so few people left in the Bay, only a small part of the lights are on even by day, and the building is minded by a few maintenance engineers and a crowd of robots: the robots bring coffee, wipe the skylights and disinfect the meeting rooms, while the engineers look after the servers in the machine rooms below and now and then lift out a robot vacuum stuck in one of the triangle's corners.\nThe car park at the door was once the hardest place in the district to find a space; now most of it is empty, and only the queue of cars waiting to turn left off G4 at the morning rush reminds everyone how busy the company still is: each time the share price climbs another round, a few more new cars appear in the car park. Lucy worked here in her day, and she says the building's great virtue is that you cannot get lost in it, since whichever way you walk you end up in a corner."
    in: div_x7fvyg
    at: [119.00, 238.17]
    site: { layout: triangle, variant: hollow, size_m: [230, 210], angle_deg: 0 }
  - id: bld_nv7gyr
    subtype: headquarters
    status: generated
    names:
      zh: 英伟达 Voyager 大楼
      en: NVIDIA Voyager
      es: Edificio Voyager de NVIDIA
    notes:
      zh: "英伟达总部园区的第二座三角形大楼，在 Endeavor 北边，门牌是 San Tomas Expy 2888 号，比前一座更大。楼里最显眼的是「山」：一道从底层一直堆到顶层的阶梯状平台，上面种满了植物，铺着座位和步道，员工可以一边爬山一边开会，爬到山顶有一座小亭子，据说是全楼信号最好的地方。整栋楼罩在一个巨大的格栅屋顶下面，屋顶上开着几百个三角形的天窗，阳光照进来，在山坡上投下一片片三角形的光斑，看起来像一张还没渲染完的画面。\n山上没有缆车，也没有别的捷径，从山脚走到山顶要好几分钟，于是员工们发明了一种「爬山会议」：问题越难，会议地点就越高，真正棘手的问题要在山顶的亭子里讨论，讨论完下山，问题往往已经因为腿酸而显得不那么重要。如今人少，山上的植物由机器人浇水修剪，偶尔有维护工程师坐在半山腰吃午饭，旁边的机器人园丁会停下来，礼貌地等他吃完再浇水。\n大楼的地下和旁边都是停车场，车位多得能停下全区居民的车，再加上他们亲戚的车。楼前那条 Central Expressway 是县快速路 G6，傍晚车很少，机器人出租车会在楼前排成一排歇着，仿佛也在等下班的人。员工们说，这是唯一一个可以在室内登山、在山顶收到邮件、下山时顺便取一个快递的地方。"
      en: "The second of the triangular buildings on NVIDIA's headquarters campus, north of Endeavor at 2888 San Tomas Expy, and bigger. Its most striking feature is 'the mountain': a stepped platform heaped up from the ground floor to the top, planted all over and laid with seats and paths, so that staff can hold meetings while they climb; at the summit is a small pavilion, said to have the best signal in the building. The whole thing sits under one vast trellised roof pierced by hundreds of triangular skylights, and the sunlight falls on the slopes in triangular patches, like a picture that has not finished rendering.\nThere is no cable car and no other short cut, and the walk from the foot of the mountain to the top takes several minutes, so staff invented the 'climbing meeting': the harder the problem, the higher the meeting, and the really thorny ones are discussed in the summit pavilion, by which time, on the way back down, aching legs have often made them seem less important. With few people left, robots water and prune the mountain's plants, and when a maintenance engineer sits halfway up eating lunch, the robot gardener beside him stops and politely waits for him to finish before it waters.\nUnder and beside the building are car parks with room for the cars of everyone in the district, and their relatives' too. Central Expressway in front is county route G6; in the evening it is nearly empty, and robotaxis line up outside for a rest, as if they too were waiting for someone to finish work. Staff say it is the one place where you can climb a mountain indoors, get your email at the top and pick up a parcel on the way down."
    in: div_x7fvyg
    at: [118.99, 238.25]
    site: { layout: triangle, variant: mountain, size_m: [260, 230], angle_deg: 0 }
  - id: bld_nvc4mp
    subtype: office
    status: generated
    names:
      zh: 英伟达老园区
      en: NVIDIA Original Campus
      es: Campus Original de NVIDIA
    notes:
      zh: "英伟达在三角形大楼之前的老园区，在 San Tomas Expy 东边，一排排两三层的低矮办公楼，从 A 楼、B 楼一路排到 K 楼，后来又加了 R、S、T、U 几栋，字母不够连续，新员工第一周最常问的问题是「E 楼到底在哪里」。楼与楼之间是停车场和几块草坪，外墙刷着同样的颜色，门口立着同样的绿色标志，访客常常绕着园区开好几圈，才发现自己已经从同一栋楼前经过了三次。\n老园区是公司最早扎根的地方，走廊里还挂着一代代显卡的海报，展柜里摆着一排旧显卡，风扇一代比一代大，最后一块大得像一块砖。会议室的名字都来自电子游戏里的地名，员工们说在这里订会议室就像在订一张游戏地图。如今这些楼大多改成了实验室和测试间，里面的几千块显卡日夜不停地训练模型、测试新芯片，散出来的热让园区的冬天比别处暖和两度，附近的流浪猫都喜欢趴在通风口旁边。\n园区里人不多，食堂只开一个窗口，菜单由人工智能每天生成，常常出现「三角形饺子」「多边形披萨」这样的菜。值班工程师说，老园区的好处是什么都旧得刚刚好：门禁卡偶尔失灵，打印机永远缺纸，但服务器从来不停。露西刚到英伟达时就在这里的一栋楼里上班，她说找到自己工位的那天，比后来任何一次良率创新高都难忘。"
      en: "NVIDIA's old campus from before the triangular buildings, east of San Tomas Expy: rows of low two- and three-storey office blocks running from Building A and Building B to Building K, with R, S, T and U added later, so that the letters do not quite follow on and the question new staff most often ask in their first week is 'where on earth is Building E?'. Between the blocks are car parks and patches of lawn; the walls are all painted the same colour and the same green sign stands at every door, and visitors often drive round the campus several times before realising they have passed the same building three times.\nThe old campus is where the company first put down roots. Posters of one generation of graphics card after another still hang in the corridors, and a display case holds a row of old cards whose fans grow bigger with each generation until the last is the size of a brick. The meeting rooms are named after places in video games, and staff say booking one is like booking a level. Most of the blocks are now labs and test rooms, where thousands of graphics cards train models and test new chips day and night; the heat they give off keeps the campus two degrees warmer than its surroundings in winter, and the neighbourhood's stray cats like to lie by the vents.\nFew people are about. The canteen opens a single counter, and its menu, generated each day by an AI, often features dishes such as 'triangular dumplings' and 'polygon pizza'. The duty engineers say the beauty of the old campus is that everything is just old enough: the access cards fail now and then and the printers are always out of paper, but the servers never stop. Lucy worked in one of these blocks when she first came to NVIDIA, and she says the day she found her own desk stays with her longer than any record yield since."
    in: div_x7fvyg
    at: [119.145, 238.18]
    site: { layout: campus, size_m: [420, 220], angle_deg: 0, rural: true }
  - id: bld_7cyhme
    subtype: apartment
    status: generated
    names:
      zh: 露西旧宅
      en: Lucy's Old Home
      es: Antigua Casa de Lucy
    notes:
      zh: "露西在英伟达上班时住过的公寓，在 Octavius Dr 边上，离 Endeavor 大楼开车不到五分钟，走路十五分钟，骑自行车的话要看那天风往哪边吹。这是一座典型的湾区花园公寓：几栋三层的小楼围着一个院子，院子中间是一个长方形的泳池，泳池边有一个烧烤棚，门口一排车棚，车棚旁边是租赁办公室。小区的宣传册上写着「宁静、便利、步行可达科技园区」，没有写的是房租。\n这座公寓最有名的是它的涨租方式：每年续约，房租准时涨百分之十，一年不落，像复利一样认真。露西刚搬进来时房租就不便宜，她算了一下，觉得还能接受；第二年涨了，她说就当是房东也在学习复利；第三年又涨了，她开始在电子表格里给房租单独开了一张表；到后来房租涨成了天价，表格里的曲线比英伟达的股价图还陡，同事们开玩笑说，露西是全公司唯一一个房租跑赢股价的人，可惜她站在付钱的那一边。房东的续约信每年都写得很客气，开头是「感谢您一直以来的信任」，结尾是新的数字，中间什么都没有。\n住在这里的那些年，露西每天早上沿着 Scott Blvd 去上班，晚上在泳池边的长椅上看良率报告，周末去 Lafayette St 的 Gold Rush 加满一箱便宜的油，再去 99 Ranch 买一周的菜。她把小小的阳台收拾得井井有条，种了几盆薄荷和一棵小柠檬树，邻居们都说那是全小区最干净的阳台，干净得像一间洁净室。后来她离开湾区，去圣塞雷娜建起了自己的芯城和宅邸，再也不用拆续约信了。\n如今公寓里只剩几户人家，涨价通知照旧由机器人准时塞进每一道门缝。露西住过的那一户空着，房东把它挂了出去，广告上写着「名人旧居，房租照涨百分之十」。路过的人都会抬头看一眼那个阳台：那棵小柠檬树据说还活着，由物业的机器人每周浇一次水，是这座公寓里唯一不用付房租的住户。"
      en: "The flat Lucy lived in while she worked at NVIDIA, on Octavius Dr, under five minutes' drive from the Endeavor building, fifteen minutes on foot, and by bicycle it depends which way the wind is blowing. It is a classic Bay Area garden apartment complex: a few three-storey blocks round a courtyard, with an oblong pool in the middle, a barbecue shelter beside it, a row of carports at the gate and the leasing office next to them. The brochure promises 'peaceful, convenient, walking distance to the tech campuses'; what it does not mention is the rent.\nThe complex is famous for the way it raises the rent: at every renewal, ten per cent, without fail, as conscientious as compound interest. The rent was already steep when Lucy moved in; she did the sums and decided she could live with it. The second year it went up, and she said the landlord was evidently learning about compound interest too; the third year it went up again, and she gave the rent its own sheet in a spreadsheet. In the end it reached an astronomical figure, its curve steeper than NVIDIA's share price, and her colleagues joked that Lucy was the only person in the company whose rent was beating the stock, except that she was on the paying side. The landlord's renewal letters were always perfectly polite, opening with 'Thank you for your continued trust' and closing with the new figure, with nothing in between.\nIn the years she lived here Lucy went to work along Scott Blvd every morning, read yield reports on the bench by the pool in the evening, and at the weekend filled up with cheap fuel at Gold Rush on Lafayette St and then bought the week's groceries at 99 Ranch. She kept her little balcony immaculate, with a few pots of mint and a small lemon tree, and the neighbours said it was the cleanest balcony in the complex, as clean as a clean room. Later she left the Bay and built her own chip city and house in Santa Serena, and never had to open a renewal letter again.\nOnly a few households are left now, and robots still push the rent-rise notices under every door on time. Lucy's old flat stands empty; the landlord has put it on the market, advertised as 'a celebrity's former home, rent up ten per cent as usual'. Passers-by always look up at the balcony: the little lemon tree is said to be alive still, watered once a week by the management's robot, and is the only tenant in the building who pays no rent."
    in: div_x7fvyg
    at: [118.86, 238.58]
    site: { layout: apartments, size_m: [180, 140], angle_deg: 0 }
  - id: bld_g8rsh2
    subtype: fuel_station
    status: generated
    names:
      zh: Gold Rush 加油站
      en: Gold Rush Gas Station
      es: Gasolinera Gold Rush
    notes:
      zh: "Lafayette St 3751 号的 Gold Rush 加油站，圣克拉拉区出了名的便宜油站：油价牌上的数字总比附近几家低一截，低到让人愿意专门绕路过来加油，也低到让人觉得「再便宜一点就不像正经油站了」。店名叫淘金热，倒也名副其实：当年的淘金者为了金子跑几百公里，如今的司机为了每升便宜几毛钱跑几公里，精神是一样的。\n便宜是有代价的。加油站的设施出了名地简陋：雨棚上的灯管总有一两根在闪，加油机的屏幕晒得只能看清一半，刷卡机要刷三次才认，第四次会扣两次钱。洗车机常年挂着「维修中」的牌子，打气泵要投硬币，可附近早已没有人带硬币。厕所在停车场最远的角落，是一间孤零零的小棚子，钥匙拴在一个旧汽车轮毂上，重得没人能顺手带走，借钥匙的人要双手抱着轮毂穿过整个停车场，熟客说这是全湾区最有分量的一把钥匙。便利店里卖的是热狗、彩票和印着旧路名的地图，收银台后面的牌子写着「本店不收大面额钞票，也不收投诉」。\n可来加油的人从来不少。露西住在 Octavius Dr 的那些年，每个周末都来这里加满一箱，她说在湾区，房租一年涨百分之十，能省一点是一点，「良率是一点一点抠出来的，油钱也是」。如今湾区的车大多是电动的机器人出租车，用不上汽油，来这里的多是几辆烧油的老皮卡、附近工地的柴油发电机和几位坚持不换车的老司机。他们加完油总要看一眼油价牌，只要上面的数字还比隔壁低，他们就觉得湾区还没有完全变。"
      en: "The Gold Rush filling station at 3751 Lafayette St, famous in Santa Clara District for being cheap: the figures on its price board are always a notch below the stations round about, low enough that people go out of their way to fill up here, and low enough to make them feel that any cheaper and it would not be a proper filling station. The name fits: the forty-niners travelled hundreds of kilometres for gold, today's drivers travel a few kilometres to save a few cents a litre, and the spirit is the same.\nCheapness has its price. The facilities are famously spartan: one or two of the tubes in the canopy lights are always flickering, the pump screens are so sun-bleached that only half of them can be read, and the card readers need three swipes to take a card and on the fourth charge it twice. The car wash has had an 'out of order' sign on it for as long as anyone remembers, and the air pump takes coins, though nobody round here carries coins any more. The toilet is a lonely shed in the far corner of the forecourt, and its key is chained to an old car wheel rim, too heavy for anyone to walk off with, so whoever borrows it has to carry the rim in both arms across the whole forecourt; regulars call it the weightiest key in the Bay. The shop sells hot dogs, lottery tickets and maps with the old street names, and the sign behind the till says 'No large notes. No complaints.'\nYet it has never lacked customers. In the years Lucy lived on Octavius Dr she filled up here every weekend; with the rent rising ten per cent a year in the Bay, she said, every little saving counts: 'Yield is won a little at a time, and so is the fuel bill.' Most cars in the Bay now are electric robotaxis that have no use for petrol, so the customers are a few old petrol pickups, the diesel generators from nearby building sites and a handful of old drivers who refuse to change cars. After filling up they always glance at the price board, and as long as its figures are still below the station next door, they feel the Bay has not changed completely."
    in: div_x7fvyg
    at: [119.455, 238.845]
    site: { layout: retail, variant: fuel, size_m: [70, 50], angle_deg: 0 }
  - id: bld_vfwf3d
    subtype: shopping_mall
    status: generated
    names:
      zh: Westfield Valley Fair 购物中心
      en: Westfield Valley Fair
      es: Westfield Valley Fair
    notes:
      zh: "Stevens Creek Blvd 北边的 Westfield Valley Fair 购物中心，一座两层的大商场：长长的室内商业街，两头和中间各有一家百货公司，外面是一片海一样的停车场和两座停车楼。商场里有几百家店，卖衣服、手机、化妆品、手表和各种你走进去之前并不知道自己需要的东西，美食广场里能吃到半个世界的菜。当年一到周末和节假日，进停车场的车一直排到快速路上，找车位比买东西还难，商场为此装了一套车位指示灯，绿灯是空位，红灯是有车，黄灯据说是「有人正在犹豫要不要走」。\n如今湾区人少，商场照常开门，橱窗照样每季换一次，模特身上的新衣服比街上的行人还多。顾客多半是机器人：送货机器人来取网上的订单，维修机器人来买零件，还有一些机器人纯粹是被导航带进来的，在中庭里转一圈又出去了。美食广场的座位整天空着，只有几台扫地机器人轮流在那里歇脚。商场的广播每小时提醒一次「请看管好您的随身物品」，听见的只有喷泉。\n露西住在 Octavius Dr 的时候，常在周末开车来这里，从商场的一头走到另一头，她说这是她一周里唯一的有氧运动。她有个习惯：每次只买一件东西，但要把整个商场逛完，因为「良率要看整片晶圆，不能只看一颗芯片」。商场里一家甜品店的店员到现在还记得她，因为她每次都点同一款奶茶，然后认真地问一句：「今天的糖度和上周一样吗？」"
      en: "Westfield Valley Fair, north of Stevens Creek Blvd, a big two-storey shopping centre: a long indoor arcade with a department store at each end and one in the middle, surrounded by a sea of parking and two parking decks. It has hundreds of shops selling clothes, phones, cosmetics, watches and all manner of things you did not know you needed until you walked in, and in the food court you can eat your way round half the world. At weekends and holidays the queue for the car park used to stretch back onto the expressway and finding a space was harder than finding something to buy, so the centre installed space indicator lights: green for free, red for taken, and amber, it is said, for 'someone is wondering whether to leave'.\nWith the Bay so empty, the centre still opens as usual and still changes its windows every season, and the mannequins wear more new clothes than there are people in the street. Most of the customers are robots: delivery robots collecting online orders, maintenance robots buying parts, and some robots that have simply been led in by their navigation, do a lap of the atrium and leave again. The food court seats stand empty all day except for a few robot vacuums taking turns to rest there. Every hour the public address reminds shoppers to 'keep your belongings with you', and only the fountain hears.\nWhen Lucy lived on Octavius Dr she often drove here at the weekend and walked from one end of the centre to the other, which she called her one piece of cardio a week. She had a habit of buying only one thing each time but walking the whole centre first, because 'you judge the yield on the whole wafer, not on one chip'. The staff at one of the dessert shops still remember her, because she always ordered the same milk tea and then asked, quite seriously, 'Is the sugar level the same as last week?'"
    in: div_x7fvyg
    at: [119.62, 236.40]
    site: { layout: retail, variant: mall, size_m: [640, 440], angle_deg: 0 }
  - id: poi_sjc7ap
