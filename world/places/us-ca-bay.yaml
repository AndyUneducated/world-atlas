      zh: 圣何塞国际机场
      en: San Jose International Airport
      es: Aeropuerto Internacional de San José
    notes:
      zh: "圣克拉拉区东南角的机场，夹在降落领道、集装箱领道和广告牌领道之间，跑道沿西北—东南方向，飞机降落前要从似然谷区市中心的楼顶上低低地掠过。机场离市中心只有几公里，是湾区南部的门户：从前每天有几百个航班飞往各地，候机厅里坐满了背着双肩包、抱着笔记本电脑的工程师，安检口的托盘里一半是电脑，一半是充电器。航站楼的墙上挂着一句欢迎词，大意是「欢迎来到改变世界的地方」，下面总有旅客在找插座。\n如今湾区人少，航站楼只开着一小半登机口，跑道上起降的多是运送芯片、显卡和服务器的货机，以及几位科技公司老板的私人飞机。到达大厅里有州移民与海关执法局的检查台，连从州内飞来的旅客也要出示证件，检查员最常问的问题是「您带了几块显卡」。行李转盘由机器人照看，转盘上常常只转着一个箱子，机器人会耐心地陪它转上好几圈，直到主人出现。\n机场旁边就是降落领道，领道局在路面上画的那排白色箭头本来是给司机看的，后来飞行员也开始参考它，塔台只好发了一份通知：「请勿跟随地面车道降落。」塔台的值班员说，这是他们发过的最认真的一份通知，也是被乘客拍照转发得最多的一份。露西和乔什当年回家过节都从这里起飞，两人的航班常常在同一个登机口前后脚，于是登机口旁那家咖啡店的店员很早就知道，假期快到了。"
      en: "The airport in the south-eastern corner of Santa Clara District, wedged between the Final Approach Road, the Container Road and the Billboard Road, with its runway running north-west to south-east; planes on their way in skim low over the rooftops of downtown Likelihood Valley. It is only a few kilometres from downtown and is the gateway to the south of the Bay: hundreds of flights a day once left for everywhere, the departure lounges full of engineers with backpacks and laptops, and the trays at security half computers and half chargers. A welcome on the terminal wall says something like 'Welcome to where the world changes', and beneath it there is always a passenger looking for a socket.\nWith the Bay so empty, the terminal opens only a small part of its gates, and most of what lands and takes off are freighters carrying chips, graphics cards and servers, and the private jets of a few tech bosses. The arrivals hall has the desks of the State Immigration and Customs Enforcement Agency, where even passengers from within the state must show their papers, and the question the officers ask most is 'How many graphics cards are you carrying?'. Robots mind the baggage belts, which often carry a single suitcase, and the robots patiently keep it company for lap after lap until its owner turns up.\nThe Final Approach Road runs right beside the airport, and the State Roads Department painted a row of huge white arrows on it pointing this way; they were meant for drivers, but pilots began to use them too, and the control tower had to issue a notice: 'Do not follow the road markings to land.' The tower staff say it is the most earnest notice they have ever issued, and the one passengers have photographed and shared the most. Lucy and Josh used to fly home for the holidays from here, their flights often leaving one after the other from the same gate, so the staff at the café by that gate always knew early when the holidays were coming."
    in: div_x7fvyg
    at: [120.134, 237.80]
    site: { layout: airport, size_m: [3300, 1000], angle_deg: -50 }
  # ── 南圣何塞区 ──
  - id: bld_j5hhme
    subtype: apartment
    status: generated
    names:
      zh: 乔什旧宅
      en: Josh's Old Home
      es: Antigua Casa de Josh
    notes:
      zh: "乔什在南圣何塞住过的公寓，门牌是 Palm Valley Blvd 150 号，在园区领道和 Cottle Rd 之间，背后就是南边的山。小区是几栋三层的公寓楼围着一个带泳池的院子，楼间种着棕榈树，名字里的「棕榈谷」大概就是这么来的，虽然这里既没有谷，棕榈也只有六棵，乔什数过。\n乔什住在这里的那些年，正是他白天上班、晚上在餐桌上写应用的时候。公寓的客厅不大，他把餐桌推到窗边当工作台，桌上永远摆着两台显示器、一台旧笔记本和一盘没吃完的水果。邻居们常常深夜看到他家的窗还亮着，以为他在加班，其实他在给停车场的车位写一个小应用：哪个车位空了，楼里所有人的手机都会响一下。这个应用后来被物业「借」去用了，物业给他的回报是一张免费洗车券和一封续约信。\n续约信是这座公寓的传统节目。这里的房租每年涨百分之十，准时得像日出，涨到后来成了天价。乔什算过，照这个速度，他付的房租再过几年就够在这片山坡上买下一棵有名字的棕榈树，可房东不卖树，只卖续约。他在信封背面写下了自己的第一条「人生规律」：凡是每年稳定涨百分之十的东西，最好站在收钱的那一边。后来他去圣塞雷娜建起了自己的庄园，有葡萄园、赛车场和车牌厂，可朋友们最爱听他讲的，还是这间每年涨价的小公寓。\n周末的乔什是 Westfield Oakridge 和隔壁 99 Ranch 的常客：上午在商场里找一个靠插座的座位改代码，下午去超市挑一颗榴莲，再拎着它走回停车场，一路上收获很多注目礼。如今楼里只剩几户人家，涨价通知照旧每年由机器人准时送到，住户们说自己不是住在这里，而是在替房东的退休基金上班。乔什住过的那一户门口还留着一块他钉上去的小木牌，写着「请勿按门铃，正在编译」，物业的机器人每次路过都会停一下，像是在等它编译完。"
      en: "The flat Josh lived in in South San Jose, at 150 Palm Valley Blvd, between the Campus Road and Cottle Rd, with the southern hills right behind. The complex is a few three-storey apartment blocks round a courtyard with a pool, with palm trees between the blocks, which is presumably where the 'Palm Valley' comes from, though there is no valley and only six palms; Josh counted.\nThe years Josh lived here were the years he went to work by day and wrote apps at the dining table by night. The living room was small, so he pushed the table up to the window as a workbench, and it always held two monitors, an old laptop and a half-finished plate of fruit. Neighbours who saw his window lit late at night assumed he was working overtime; in fact he was writing a little app for the car park, so that whenever a space came free every phone in the building would ping. The management later 'borrowed' it, and repaid him with a free car-wash voucher and a renewal letter.\nRenewal letters are a tradition here. The rent goes up ten per cent a year, as punctual as sunrise, until in the end it is astronomical. Josh worked out that at this rate the rent he paid would in a few more years be enough to buy a named palm tree on the hillside, but the landlord does not sell trees, only renewals. On the back of the envelope he wrote his first 'law of life': whatever rises a steady ten per cent a year, be on the side that collects. Later he built his own estate in Santa Serena, with vineyards, a racing circuit and a number-plate factory, but the story his friends most like to hear is still the one about this little flat whose rent went up every year.\nAt weekends Josh was a regular at Westfield Oakridge and the 99 Ranch next door: in the morning he found a seat by a socket in the shopping centre to fix his code, in the afternoon he chose a durian at the supermarket and carried it back to the car park, collecting many admiring looks on the way. Only a few households are left in the building now; robots still deliver the rent-rise notices on time every year, and the tenants say they don't so much live here as work for their landlord's pension fund. A little wooden sign Josh nailed up is still by his old door, reading 'Please don't ring, compiling', and the management's robot stops each time it passes, as though waiting for it to finish."
    in: div_nwqa72
    at: [123.895, 233.105]
    site: { layout: apartments, size_m: [180, 130], angle_deg: 0 }
  - id: bld_kr6dge
    subtype: shopping_mall
    status: generated
    names:
      zh: Westfield Oakridge 购物中心
      en: Westfield Oakridge
      es: Westfield Oakridge
    notes:
      zh: "Blossom Hill Rd 北边的 Westfield Oakridge 购物中心，南圣何塞区的客厅：一条室内商业街串起几家百货公司和一家电影院，外面一圈停车场，商场西头紧挨着 99 Ranch 超市。南圣何塞的周末从前就是这样过的：上午全家开车来这里逛街，孩子们在中庭的游乐区里爬上爬下，大人们在鞋店里试第五双鞋，中午在美食广场吃一顿什么都有一点的午饭，下午再去隔壁的 99 Ranch 买一周的菜，回家时后备箱塞得满满当当。\n如今全区只剩约两千人，商场照常营业，冷气、音乐和喷泉一样不少，顾客却大多是来采购零件和润滑油的机器人。五金店的生意反而比当年还好，因为机器人们最常买的是螺丝。美食广场的座位被扫地机器人轮流占着充电，它们每天中午准时排成一排，像一群等着开饭的老顾客。商场的保安是一台巡逻机器人，它最大的工作是劝其他机器人不要在扶梯上逆行。\n乔什住在 Palm Valley Blvd 的那些年，这里是他最常来的地方：买一杯咖啡，找一个靠插座的座位，一坐就是一个下午，给他的小应用修 bug。他说商场是最好的办公室，有空调、有咖啡、有洗手间，而且不涨房租。商场电影院里有一排座位，扶手上的插座是全场唯一能用的，熟悉他的工作人员管那一排叫「乔什专座」，如今那一排坐的是几台来看电影的机器人，它们看得很认真，从不剧透。"
      en: "Westfield Oakridge, north of Blossom Hill Rd, the living room of South San Jose District: an indoor arcade linking several department stores and a cinema, ringed by parking, with the 99 Ranch supermarket right at its western end. This is how South San Jose used to spend its weekends: the whole family drove here in the morning, the children clambered round the play area in the atrium while the grown-ups tried on a fifth pair of shoes, lunch in the food court was a little of everything, and in the afternoon it was next door to 99 Ranch for the week's groceries, the boot crammed full on the way home.\nThe district now has only about two thousand people, and the centre opens as usual with its air conditioning, music and fountains all present, but most of its customers are robots buying spare parts and lubricant. The hardware shop does better business than ever, since what robots buy most is screws. The food court seats are taken in turn by robot vacuums on charge, which line up punctually every noon like old regulars waiting for lunch. Security is a patrol robot whose main job is persuading other robots not to go the wrong way on the escalators.\nIn the years Josh lived on Palm Valley Blvd this was where he came most: he bought a coffee, found a seat by a socket and stayed all afternoon fixing bugs in his little apps. A shopping centre, he said, is the best office there is: air conditioning, coffee, toilets, and no rent rises. In the centre's cinema there is one row whose armrest sockets are the only ones in the auditorium that work, and the staff who knew him called it 'Josh's row'; now it is occupied by a few robots who come to watch films, very attentively, and never give away the ending."
    in: div_nwqa72
    at: [122.155, 233.53]
    site: { layout: retail, variant: mall, size_m: [460, 420], angle_deg: 0 }
  - id: bld_99bh5m
    subtype: supermarket
    status: generated
    names:
      zh: 99 Ranch Blossom Hill Rd 店
      en: 99 Ranch Market, Blossom Hill Rd
      es: 99 Ranch Market de Blossom Hill Rd
    notes:
      zh: "南圣何塞区的 99 Ranch 超市，在 Westfield Oakridge 商场的西头，门牌和商场一样是 Blossom Hill Rd 925 号。走进门先是一整面墙的水果：榴莲、山竹、荔枝、杨桃，季节对的时候，榴莲的味道能一直飘到停车场，路过的人分成两派，一派加快脚步走开，一派加快脚步走进来，乔什属于后一派。往里是海鲜区，一排排水箱里游着活鱼、螃蟹和龙虾，店员会帮你当场处理好、切好，再问一句要不要炸；然后是一长排冷柜，冻饺子、冻包子、冻汤圆，品种多得像一座冷冻的图书馆。\n超市门口有一间面包房，卖菠萝包、葱油面包和芋泥蛋糕，下午出炉的那一批总是最先卖完。熟食柜台的烧鸭和叉烧挂成一排，排队的人从柜台一直排到酱油货架。酱油货架本身也值得一看：几十种酱油，从浅到深排成一道渐变色，新来的顾客常常在这里站上五分钟，最后还是拿了妈妈以前买的那一瓶。\n如今来买菜的人少了，货架由机器人补满，收银台前排队的也多是机器人，它们替住在附近的老人和坚持自己做饭的人跑腿。榴莲季一到，机器人们会被派去挑榴莲：它们用传感器测成熟度，用摄像头看裂口，挑得比人还准，唯一的问题是它们闻不到，所以总是一脸平静地把最香的那一颗送到客人家门口，留下一整栋楼的邻居去面对后果。乔什说，这是他见过的最适合挑榴莲的员工。"
      en: "South San Jose District's 99 Ranch supermarket, at the western end of the Westfield Oakridge shopping centre and sharing its address, 925 Blossom Hill Rd. Inside the door is a whole wall of fruit, durian, mangosteen, lychee and star fruit, and in season the smell of durian carries all the way to the car park, dividing passers-by into two camps: one walks away faster, the other walks in faster, and Josh belongs to the second. Further in is the seafood section, tank after tank of live fish, crabs and lobsters, which the staff will clean and cut for you on the spot before asking whether you would like them fried; then a long run of freezers, frozen dumplings, frozen buns and frozen rice balls in so many kinds that it is like a frozen library.\nBy the entrance is a bakery selling pineapple buns, spring-onion bread and taro cake, and the afternoon batch is always the first to sell out. Roast duck and char siu hang in a row at the deli counter, and the queue runs from the counter back to the soy sauce shelves, which are worth a look in themselves: dozens of soy sauces arranged from light to dark in a gradient, where new customers often stand for five minutes before taking the bottle their mother used to buy.\nFewer people come to shop now. Robots fill the shelves, and most of the queue at the tills is robots too, running errands for the old people nearby and for those who insist on cooking for themselves. In durian season the robots are sent to choose durians: they measure ripeness with their sensors and inspect the splits with their cameras, and choose better than people do; the only trouble is that they cannot smell, so they calmly deliver the most fragrant one of all to the customer's door and leave a whole building of neighbours to face the consequences. Josh says they are the best durian pickers he has ever met."
    in: div_nwqa72
    at: [122.045, 233.54]
    site: { layout: retail, variant: supermarket, size_m: [150, 130], angle_deg: 0 }
  # ── 似然谷区 ──
  - id: bld_wm1450
    subtype: supermarket
    status: generated
    names:
      zh: Walmart 便宜超市
      en: Walmart, the Cheap Supermarket
      es: Walmart, el Súper Barato
    notes:
      zh: "Monterey Rd 1450 号的 Walmart，本地人都叫它「便宜超市」。这是一座巨大的方盒子，门前是一片能停几百辆车的停车场，后面是装卸货的月台，从南圣何塞区顺着 Monterey Rd 往北开就能看到它的蓝色招牌。超市里什么都卖：牛奶、轮胎、渔竿、生日蛋糕、电视机、维生素和一种同时能当拖把和晾衣架的工具，价格牌上的数字常常以九结尾，看起来永远比实际便宜一分。\n在湾区，房租每年涨百分之十，一杯咖啡贵得像一顿午饭，这家超市却始终保持着一种倔强的便宜。从前每到周末，停车场里停满了从各个区开来的车，后备箱里塞满了大包装的卫生纸、整箱的矿泉水和够吃一个月的速冻披萨。收银台前的队伍很长，大家一边排队一边比较彼此的购物车，谁买的卫生纸多，谁就是那一周的赢家。\n如今超市照常营业，营业时间一分钟都没有缩短，顾客却大多是机器人：送货机器人来批发电池，维修机器人来买胶带，扫地机器人来买替换的刷子，偶尔还有一台机器人出租车停在门口，什么都不买，只是因为导航把「最便宜」设成了它的目的地。门口的迎宾员也换成了机器人，它对每一位顾客说「欢迎光临」，包括其他机器人和一只常来门口乘凉的流浪猫。超市经理说，机器人顾客唯一的缺点是从来不用优惠券：「它们太老实了，原价也付。」露西和乔什当年都是这里的常客，两人在卫生纸货架前偶遇过不止一次，每次都要互相比一比谁的购物车更划算。"
      en: "The Walmart at 1450 Monterey Rd, which the locals all call 'the cheap supermarket'. It is a vast box with a car park for several hundred cars in front and loading docks behind, and its blue sign comes into view as you drive north up Monterey Rd from South San Jose District. It sells everything: milk, tyres, fishing rods, birthday cakes, televisions, vitamins and a gadget that serves as both a mop and a clothes airer, and the prices on the shelf labels mostly end in nine, so that everything always looks a cent cheaper than it is.\nIn a Bay where the rent rises ten per cent a year and a cup of coffee costs as much as a lunch, this supermarket has stayed stubbornly cheap. At weekends the car park used to fill with cars from every district, their boots crammed with giant packs of toilet paper, cases of bottled water and a month's worth of frozen pizza. The queues at the tills were long, and people compared trolleys as they waited: whoever had the most toilet paper was that week's winner.\nThe supermarket still opens as usual, not a minute shorter, but most of its customers are robots: delivery robots buying batteries in bulk, maintenance robots buying tape, robot vacuums buying replacement brushes, and now and then a robotaxi that pulls up outside and buys nothing, simply because its navigation has set 'cheapest' as its destination. The greeter at the door is a robot too, and says 'Welcome' to every customer, other robots included, and to a stray cat that often comes to sit in the shade by the entrance. The manager says the only drawback of robot customers is that they never use coupons: 'They are too honest. They pay full price.' Lucy and Josh were both regulars in their day, and ran into each other by the toilet paper more than once, each time comparing whose trolley was the better bargain."
    in: div_zjfaw0
    at: [121.93, 236.03]
    site: { layout: retail, variant: supermarket, size_m: [260, 200], angle_deg: 0 }
  - id: bld_99wf7e
    subtype: supermarket
    status: generated
    names:
      zh: 99 Ranch Wolfe Rd 店
      en: 99 Ranch Market, Wolfe Rd
      es: 99 Ranch Market de Wolfe Rd
    notes:
      zh: "似然谷区西南部的 99 Ranch 超市，在 Wolfe Rd 边上的一座小商业广场里，隔着几个路口就是梨公司那座环形的总部大楼。这家超市从前是附近几家科技公司员工的「第二食堂」：中午有人专门开车过来买一盒烧腊饭，傍晚下班的人推着购物车在冷柜之间穿梭，买饺子、豆腐、青菜和一周的水果，周末则是一家老小的固定节目，停车场里找车位比在梨公司订会议室还难。广场里还有一圈小店，奶茶店、面包店、火锅店、书店和一家卖小电器的铺子，排队买奶茶的人常常一边排队一边用梨公司的手机给奶茶拍照。\n超市里的东西分门别类：进门是水果和蔬菜，往里是活海鲜、熟食和冻品，最里面是一整排米和面，米袋子摞得比人还高。货架之间的通道很窄，两辆推车相遇时彼此都要侧身让一让，熟客说在这里推车比在领道上开车还讲礼貌。\n如今区里人少了，超市照常开门，货架由机器人补满，收银台前排队的也多是机器人，它们替园区里还在上班的少数工程师采购夜宵。梨公司的员工说，从环形大楼走到这里要十几分钟，路上他们的手表会提醒「今日步数已达标」，回去的路上又会提醒「今日热量已超标」。露西当年偶尔也会开车过来，她喜欢这里的芋泥奶茶，说这是她喝过的糖度最稳定的一款，每一杯都像同一批次出厂的。"
      en: "A 99 Ranch supermarket in the south-west of Likelihood Valley District, in a small shopping plaza on Wolfe Rd a few blocks from Pear's ring-shaped headquarters. It used to be the 'second canteen' for staff at the tech companies nearby: some drove over at lunchtime just for a box of roast-meat rice, people on their way home in the evening steered their trolleys between the freezers for dumplings, tofu, greens and the week's fruit, and at weekends it was a fixture for whole families, with a parking space harder to find than a free meeting room at Pear. Round the plaza is a ring of little shops, milk tea, a bakery, a hot-pot restaurant, a bookshop and a small electricals shop, and people queuing for milk tea often photograph it with their Pear phones while they wait.\nThe supermarket is laid out in order: fruit and vegetables at the door, then live seafood, the deli and frozen food, and at the back a whole aisle of rice and noodles, the rice sacks stacked higher than a person. The aisles are narrow, and when two trolleys meet each pulls aside for the other; regulars say people push trolleys here more politely than they drive on the state roads.\nWith fewer people in the district now, the supermarket still opens as usual. Robots fill the shelves, and most of the queue at the tills is robots too, buying late-night snacks for the few engineers still at work on the campuses. Pear staff say the walk from the ring takes ten minutes or more, and on the way their watches tell them 'step goal reached' and on the way back 'calorie limit exceeded'. Lucy used to drive over now and then; she liked the taro milk tea here, which she said had the most consistent sugar level of any she has tasted, every cup as if from the same production batch."
    in: div_zjfaw0
    at: [117.36, 236.84]
    site: { layout: retail, variant: supermarket, size_m: [160, 130], angle_deg: 0 }
  - id: bld_99bb4n
