    notes:
      zh: "似然谷区东北部的 99 Ranch 超市，在 Barber Ln 边上，紧挨着集装箱领道和优先级领道交会的地方，从领道上就能看见它的红色招牌。这一带曾经住着很多在海湾南端的芯片公司和科技公司上班的人，超市所在的购物广场是他们周末的据点：先在超市买菜，再到隔壁的点心楼喝早茶，最后去广场里的珍珠奶茶店排队，一个上午就这样过去了。超市的海鲜柜台以活螃蟹出名，螃蟹们常常试图越狱，店员抓螃蟹的动作比收银还熟练。\n超市的冷冻区有一整排专卖各地的饺子和汤圆，零食区的薯片口味多得能凑成一张世界地图，从海苔味、黄瓜味到麻辣小龙虾味，应有尽有。年节前，超市门口会摆出一排排年货、红包和灯笼，停车场里挤满了来采购的人，保安要站在路口指挥，嗓子哑了就举起一块写着「请耐心」的牌子。\n如今湾区人少了，超市照旧开门，货架由机器人补满，收银台前排队的也多是机器人。它们替附近的人买菜，也替数据中心值夜班的工程师买泡面，超市因此专门设了一个「工程师夜宵货架」，上面是泡面、辣条、能量饮料和一盒盒切好的水果，据说是照着数据中心的值班表自动补货的。螃蟹们照旧想越狱，只是现在抓它们的也换成了机器人：机器人抓得很准，但每次都会礼貌地说一声「抱歉」，螃蟹们似乎并不领情。"
      en: "A 99 Ranch supermarket in the north-east of Likelihood Valley District, on Barber Ln right where the Container Road meets the Priority Road, its red sign visible from both. Many people who worked at the chip and tech companies at the south end of the bay used to live round here, and the shopping plaza the supermarket stands in was their weekend base: groceries first, then dim sum at the restaurant next door, and finally the queue at the plaza's bubble tea shop, and there went the morning. The seafood counter is known for its live crabs, which often attempt a jailbreak, and the staff are quicker at catching crabs than at working the till.\nThe frozen section has a whole aisle given over to dumplings and rice balls from all over, and there are so many flavours of crisps in the snack aisle that they would make a map of the world, from seaweed and cucumber to spicy crayfish. Before the New Year the entrance fills with rows of festive goods, red envelopes and lanterns, the car park is packed with shoppers, and a guard directs traffic at the junction until his voice goes, after which he holds up a sign reading 'Please be patient'.\nThe Bay is empty now, but the supermarket still opens. Robots fill the shelves, and most of the queue at the tills is robots too, shopping for people nearby and buying instant noodles for the engineers on the night shift at the data centres; the supermarket has even set up an 'engineers' midnight snack shelf' of instant noodles, spicy gluten strips, energy drinks and boxes of cut fruit, restocked automatically, it is said, from the data centres' duty rosters. The crabs still try to escape, only now it is robots that catch them: the robots never miss, and always politely say 'sorry', which the crabs do not seem to appreciate."
