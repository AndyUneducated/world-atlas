  # ── 离岸群岛：富豪的岛 ──
  - id: poi_rpt11c
    subtype: mansion
    status: generated
    names:
      zh: 埃卢森岛庄园
      en: Ellusion Island Estate
      es: Finca de la Isla Ellusion
    notes:
      zh: "障碍软件创始人拉里·埃卢森在空壳岛上的庄园。空壳岛是加州本岛之外最大的一座岛，他买下了岛上的大部分土地，包括港口、机场跑道和岛上唯一的镇子的大半房子；岛上的居民于是发现，自己的房东、雇主、电力公司和杂货店老板都变成了同一个人。庄园里有主楼、人工湖、员工村、私人跑道和机库，岛上的酒店、网球场和农场也归他所有，农场的温室里用人工智能控制着每一株生菜的光照。岛上居民说，在这里生活最大的好处是许可证审计不会上门，因为审计员也归他管。"
      en: "The estate of Obstacle's founder Larry Ellusion on Shell Island, the largest island outside California's main island. He bought most of the land on it, including the harbour, the airstrip and most of the houses in its one town, and the islanders found that their landlord, employer, electricity company and grocer had all become the same man. The estate has a main house, an artificial lake, a staff village, a private airstrip and a hangar; the island's hotel, tennis courts and farm are his too, and in the farm's greenhouses an AI controls the light for every lettuce. Islanders say the best thing about living here is that the licence auditors never call, because the auditors work for him as well."
    in: div_x972yz
    offset_km: [5, 4]
    site: { layout: estate, variant: compound, size_m: [5000, 3500] }
  - id: poi_khhz2n
    subtype: mansion
    status: generated
    names:
      zh: 萨克伯格庄园
      en: Suckerberg Estate
      es: Finca Suckerberg
    notes:
      zh: "无所谓平台创始人莫克·萨克伯格在亿万岛上的庄园。庄园四周是一圈高墙，墙里有主楼、人工湖、员工村、私人跑道和一排机库，工人们签了保密协议，不许在任何社交网络上提起这里，包括他自己公司的网络。萨克伯格在岛上养牛，说要做「全世界最好的牛肉」，每头牛每天喝几瓶啤酒、吃一种用坚果磨成的饲料。岛上的居民说他们最常在网上看到的，正是他自己公司推送的关于这座庄园的辟谣帖子。"
      en: "The estate of Meh Platforms' founder Mork Suckerberg on Billionaire Island. A high wall rings a main house, an artificial lake, a staff village, a private airstrip and a row of hangars, and the workers have signed confidentiality agreements forbidding any mention of the place on any social network, his company's included. He raises cattle on the island and says he means to produce 'the best beef in the world'; each animal drinks several bottles of beer a day and eats a feed made from ground nuts. The islanders say what they see most about the estate online is the posts denying rumours about it, pushed by his own company."
    in: div_45y1f3
    offset_km: [12.5, 55.5]
    site: { layout: estate, variant: compound, size_m: [4000, 2800] }
  - id: poi_cc4b8p
    subtype: mansion
    status: generated
    names:
      zh: 地堡岛末日避难城
      en: Bunker Island Doomsday Refuge
      es: Refugio del Fin del Mundo de la Isla Búnker
    notes:
      zh: "地堡岛上的地下避难城，由几位科技寡头合资修建，岛上露出地面的只有一座小屋、几个直升机坪、一排通风井和一个通往山体内部的大门。地下有十几层，住宅、温室、水厂、发电站、数据中心和一座私人医院一应俱全，储备的食物和燃料号称够几百个家庭住上好几年。业主们为「末日」准备了很多种剧本：核战争、大瘟疫、气候崩溃，还有人工智能失控，其中最后一种剧本里的人工智能，正是他们自己公司开发的。避难城的保安队长问过一个问题：末日到来以后，钱不再值钱，靠什么保证保安还听业主的话？这个问题至今还在业主委员会的议程上。"
      en: "An underground refuge city on Bunker Island, built jointly by several tech oligarchs. Above ground there are only a small house, a few helipads, a row of ventilation shafts and a great door into the hill. Below are a dozen or so storeys with homes, greenhouses, a waterworks, a power station, a data centre and a private hospital, and enough stored food and fuel, it is claimed, for hundreds of families to live on for years. The owners have planned for many kinds of doomsday: nuclear war, pandemic, climate collapse and AI running out of control, the AI in that last scenario being their own companies' work. The head of security once asked a question: after the end of the world, when money is worth nothing, what will make the guards keep obeying the owners? It is still on the owners' committee agenda."
    in: div_45y1f3
    offset_km: [2.0, -2.0]
    site: { layout: estate, variant: bunker, size_m: [3000, 2400] }

  # ── 梅洛特市 ──
  - id: poi_5tn0kd
    subtype: mansion
    status: generated
    names:
      zh: 佩洛特雷德酒庄
      en: Pelotrade Winery
      es: Bodega Pelotrade
    notes:
      zh: "前国会议员南希·佩洛特雷德在赤霞珠丘区的酒庄宅邸。她在国会里坐了几十年，以炒股的眼光闻名：每当国会要审议哪个行业的法案，她的账户里总会提前出现那个行业的股票，她的交易记录于是成了一个流行的投资指数，许多人照着买。酒庄里有主楼、泳池、网球场和客房，坡上种满了赤霞珠，酒窖里每一桶酒的标签上都印着买入日期和卖出日期。她说成功的秘诀只有一个：「多读报纸」。"
      en: "The winery and house in Cabernet Hills of the former member of Congress Nancy Pelotrade, who sat in Congress for decades and is famous for her eye for shares: whenever Congress was about to take up a bill on some industry, that industry's shares would turn up in her account beforehand, and her trading record became a popular investment index that many people copy. The estate has a main house, a pool, a tennis court and guest houses, the slopes are planted with Cabernet Sauvignon, and every barrel in the cellar carries a buy date and a sell date on its label. She says there is only one secret to success: 'Read more newspapers.'"
    in: div_jytczs
    offset_km: [3, 2]
    site: { layout: estate, size_m: [800, 600] }
