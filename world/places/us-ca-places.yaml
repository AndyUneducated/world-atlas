# Named places (buildings, landmarks, facilities) of the California Autonomous State.
# Same conventions as cn-nv-places.yaml; names are Chinese, English and Spanish. People and companies
# are parodies; only California, the United States and the Democratic and Republican parties are real.
places:
  # ── 萨克拉钱托市：州政府（游说区）──
  - id: bld_btk5bm
    subtype: government
    status: generated
    names:
      zh: 加利福尼亚自治州州议会大厦
      en: California Autonomous State Capitol
      es: Capitolio del Estado Autónomo de California
    short_names:
      zh: 州议会大厦
      en: State Capitol
    notes:
      zh: "加利福尼亚州众议院和参议院共用的议会大厦，在游说区中央的一片草坪上，金色圆顶下是两院的议事厅，北面隔一条林荫道是州长办公厅。众议院 80 席、参议院 40 席，法案要两院通过、州长签署才能生效，推翻否决和加税都要三分之二多数。旁听席对所有人开放，可坐满的多半是游说公司按小时雇来占座的人；真想来旁听的市民要提前几周在网上排队，排队系统由一家游说公司免费提供。圆顶内侧的壁画画的是淘金者，修缮时有人提议改画成服务器机柜，表决时差两票没有通过。"
      en: "The capitol shared by the California State Assembly and Senate, on a lawn in the middle of Lobbyton, with the two chambers under its gold dome and the Governor's Office across an avenue of trees to the north. The Assembly has 80 seats and the Senate 40; a bill needs both chambers and the governor's signature, and overriding a veto or raising a tax takes a two-thirds majority. The public galleries are open to all, but they are mostly filled by seat-holders hired by lobbying firms by the hour; citizens who really want to watch must queue online weeks ahead, in a queuing system provided free by a lobbying firm. The mural inside the dome shows gold miners, and when it was restored someone moved to repaint it as server racks; the motion failed by two votes."
    in: div_ymeec8
    offset_km: [1.2, -0.9]
    site: { layout: complex, size_m: [380, 240] }
  - id: bld_ew2csp
    subtype: government
    status: generated
    names:
      zh: 加利福尼亚自治州州长办公厅
      en: Office of the Governor of the California Autonomous State
      es: Oficina del Gobernador del Estado Autónomo de California
    short_names:
      zh: 州长办公厅
      en: Governor's Office
    notes:
      zh: "州长的办公厅，与州议会大厦隔着一条林荫道。州长由全州选民直选，不对议会负责，十一个厅的厅长都由州长任命，所以这栋不起眼的楼才是州政府真正的中心。楼前有一块电子屏，实时显示州长的支持率和正在征集签名的罢免请愿数量，两个数字常常一起上涨。办公厅里人最多的是「回应办公室」：每天几十万封市民来信先由模型分类和回复，工作人员只抽查其中的百分之一，据说抽查最多的是模型替州长道歉的那些信。"
      en: "The governor's offices, across an avenue of trees from the capitol. The governor is elected directly by the whole state, answers to neither chamber and appoints the heads of all eleven departments, so this unremarkable building is the real centre of state government. A screen out front shows, live, the governor's approval rating and the number of recall petitions gathering signatures, and the two figures often rise together. Its biggest unit is the Office of Response: the hundreds of thousands of letters that arrive each day are sorted and answered by a model, and staff check only one in a hundred, mostly, it is said, the ones in which the model apologises on the governor's behalf."
    in: div_ymeec8
    offset_km: [1.2, -0.45]
    site: { layout: slab, size_m: [150, 80] }
  - id: bld_3qbz6m
    subtype: government
    status: generated
    names:
      zh: 加利福尼亚自治州州务卿办公厅
      en: Office of the Secretary of State of the California Autonomous State
      es: Oficina del Secretario de Estado del Estado Autónomo de California
    short_names:
      zh: 州务卿办公厅
      en: Secretary of State
    notes:
      zh: "州务卿掌管选举、公投提案和罢免请愿，也负责公司注册。办公厅的地下室是全州的签名核验中心，每份请愿书都要先过一遍「人类签名检测」，剔除模型生成的签名，剩下的再由工作人员逐个与选民登记册上的笔迹比对。检测软件和伪造签名的软件出自同一家公司，两边都按签名数量收费，州务卿称之为「市场化的监督」。选举季里核验中心通宵亮灯，楼外排着运送请愿书的货车。"
      en: "The Secretary of State runs elections, ballot propositions and recall petitions, and registers companies. The basement is the state's signature verification centre: every petition first goes through 'human signature detection' to strike out the signatures generated by models, and staff then check the rest one by one against the handwriting in the voter rolls. The detection software and the software that forges signatures come from the same company, which charges both sides by the signature; the Secretary of State calls this 'market-based oversight'. In election season the centre is lit all night and lorries full of petitions queue outside."
    in: div_ymeec8
    offset_km: [0.6, -0.45]
    site: { layout: slab, size_m: [120, 70] }
  - id: bld_rgvgks
    subtype: government
    status: generated
    names:
      zh: 加利福尼亚自治州联邦关系厅
      en: Department of Federal Relations, California Autonomous State
      es: Departamento de Relaciones Federales del Estado Autónomo de California
    short_names:
      zh: 联邦关系厅
      en: Department of Federal Relations
    notes:
      zh: "负责自治州和联邦政府、美国其他地方以及中国各领地的往来。加州在星球的另一面，离联邦首都比离中国各领地还远，厅里一面墙上挂着七个时区的钟。它最主要的工作是追讨迟到的联邦拨款，其次是向联邦政府解释州议会这次又通过了什么决议；每年加州独立党发起独立请愿，本厅都要发一份声明，说明加州「目前没有离开的计划」。"
      en: "Handles the state's dealings with the federal government, the rest of the United States and the Chinese territories. California lies on the far side of the planet, farther from the federal capital than from the Chinese territories, and one wall of the department carries clocks for seven time zones. Its main work is chasing late federal funds, and after that explaining to the federal government what the State Legislature has resolved this time; and every year, when the California Independence Party launches its independence petition, the department issues a statement that California 'has no current plans to leave'."
    in: div_ymeec8
    offset_km: [0.6, -1.5]
    site: { layout: slab, size_m: [130, 70] }
  - id: bld_77a522
    subtype: government
    status: generated
    names:
      zh: 加利福尼亚自治州财政厅
      en: Department of Finance, California Autonomous State
      es: Departamento de Finanzas del Estado Autónomo de California
    short_names:
      zh: 财政厅
      en: Department of Finance
    notes:
      zh: "编制州预算、征收州税。全州的税收照理说大部分应该来自湾区几家人工智能公司，可这些公司的利润都登记在离岸群岛，财政厅只好向其他人多收一点：汽油税、销售税，还有一项按家里有几台机器人征收的「机器人人头税」，富人家的机器人于是都登记成了「家庭成员」。预算报告每年由模型起草，审核员的主要工作是把报告里的「作为一个语言模型」删掉。"
      en: "Draws up the state budget and collects state taxes. By rights most of the state's revenue should come from a few AI companies in the Bay, but their profits are booked in the Offshore Islands, so the department takes a little more from everyone else: petrol tax, sales tax and a 'robot poll tax' on the number of robots in a household, which is why the robots of the rich are all registered as family members. A model drafts the budget report every year, and the reviewers' main job is deleting 'as a language model' from it."
    in: div_ymeec8
    offset_km: [1.0, -1.5]
    site: { layout: slab, size_m: [130, 70] }
  - id: bld_xts7kg
    subtype: government
    status: generated
    names:
      zh: 加利福尼亚自治州司法厅
      en: Department of Justice, California Autonomous State
      es: Departamento de Justicia del Estado Autónomo de California
    short_names:
      zh: 司法厅
      en: Department of Justice
    notes:
      zh: "州检察长领导的司法厅，负责州一级的刑事起诉、民事诉讼和法律意见，现任厅长是无党籍的法律专家。厅里最大的两个科室，一个专门起诉越界收费的警察分局，另一个专门应诉警察分局反过来提起的诉讼，两个科室在同一层楼办公，中间隔着一道防火门。厅里还有一个「算法责任科」，研究模型犯了错到底该告谁，至今没有一个案子结案。"
      en: "The Department of Justice under the Attorney General handles state prosecutions, civil suits and legal opinions; its present head is a non-partisan lawyer. Its two largest units are one that prosecutes police precincts for charging outside their turf and one that defends the suits the precincts bring back; they share a floor, separated by a fire door. There is also an Algorithmic Liability Unit, which works out whom to sue when a model gets things wrong, and has yet to close a case."
    in: div_ymeec8
    offset_km: [1.4, -1.5]
    site: { layout: slab, size_m: [130, 70] }
  - id: bld_g7e1yj
    subtype: government
    status: generated
    names:
      zh: 加利福尼亚自治州公共安全与移民执法厅
      en: Department of Public Safety and Immigration Enforcement, California Autonomous State
      es: Departamento de Seguridad Pública y Control Migratorio del Estado Autónomo de California
    short_names:
      zh: 公共安全与移民执法厅
      en: Department of Public Safety and Immigration Enforcement
    notes:
      zh: "全州预算最多的厅，管着州警察、监狱和州移民与海关执法局，人员和经费都超过教育厅。这里只是厅本部的行政楼，真正的力量在南边：圣遣返的执法局总部大楼、南海岸的钢墙和口岸、荒漠和海湾里的拘押中心。厅里每年发布一份「全州安全报告」，报告里的犯罪率逐年下降，因为统计口径每年都会调整；警察分局之间的冲突不算犯罪，算「辖区协调」。"
      en: "The department with the largest budget in the state, in charge of the state police, the prisons and the State Immigration and Customs Enforcement Agency, with more staff and money than Education. This is only its administrative head office; its real strength lies to the south, in the agency headquarters in San Deportes, the steel wall and crossings on the south coast and the detention centres in the desert and the bay. Every year it publishes a State Safety Report in which crime falls steadily, because the way it is counted changes every year; clashes between police precincts are not crimes but 'jurisdictional coordination'."
    in: div_ymeec8
    offset_km: [1.8, -1.5]
    site: { layout: slab, size_m: [160, 80] }
  - id: bld_dc2sy7
    subtype: government
    status: generated
    names:
      zh: 加利福尼亚自治州教育厅
      en: Department of Education, California Autonomous State
      es: Departamento de Educación del Estado Autónomo de California
    short_names:
      zh: 教育厅
      en: Department of Education
    notes:
      zh: "管理全州的公立学校和州立大学。教室里每个学生配一个人工智能家教，家教比老师耐心，也比老师便宜，于是许多学校只留下一名人类老师，职责是维持纪律和给平板电脑充电。教材由模型每年重写一遍，历史课本里加州的面积和人口每年都略有不同。厅里最受欢迎的项目是「手写作文奖」，参赛者要在没有网络的房间里手写作文，评委说今年的获奖作文「错别字非常动人」。"
      en: "Runs the state's public schools and state universities. Every pupil has an AI tutor, more patient and cheaper than a teacher, so many schools keep just one human teacher, there to keep order and charge the tablets. A model rewrites the textbooks every year, and California's area and population come out slightly different in each year's history book. Its most popular programme is the Handwritten Essay Prize, written by hand in a room without a network; the judges said this year's winning essay had 'very moving spelling mistakes'."
    in: div_ymeec8
    offset_km: [0.6, -1.9]
    site: { layout: slab, size_m: [130, 70] }
  - id: bld_pkfyct
    subtype: government
    status: generated
    names:
      zh: 加利福尼亚自治州交通与高铁厅
      en: Department of Transportation and High-Speed Rail, California Autonomous State
      es: Departamento de Transporte y Alta Velocidad del Estado Autónomo de California
    short_names:
      zh: 交通与高铁厅
      en: Department of Transportation and High-Speed Rail
    notes:
      zh: "管理全州的领道、市道和高速铁路，下设领道局和高速铁路局；唯一不归它管的领道是收费的停车场领道。高速铁路修了很多年，只建成中央渴谷里约 460 公里，每天两班。厅里大厅的墙上挂着高铁全线规划图，已建成的一段用红色标出，来参观的小学生常问那条红线为什么那么短，讲解员的标准回答是「这是第一期」。"
      en: "Manages the state's highways, city roads and high-speed rail through its State Roads Department and High-Speed Rail Authority; the only state highway outside its hands is the tolled Parking Lot Road. The high-speed railway has been under construction for years and has only about 460 km open, in the Central Thirsty Valley, with two trains a day. A map of the whole planned line hangs in the lobby with the finished stretch in red; visiting schoolchildren often ask why the red line is so short, and the guides' standard answer is 'this is phase one'."
    in: div_ymeec8
    offset_km: [1.0, -1.9]
    site: { layout: slab, size_m: [130, 70] }
  - id: bld_2xp273
    subtype: government
    status: generated
    names:
      zh: 加利福尼亚自治州住房与无家可归者厅
      en: Department of Housing and Homelessness, California Autonomous State
      es: Departamento de Vivienda y Personas sin Hogar del Estado Autónomo de California
    short_names:
      zh: 住房与无家可归者厅
      en: Department of Housing and Homelessness
    notes:
      zh: "负责住房规划、租房补贴和无家可归者救助。全州的房价是收入中位数的几十倍，湾区成片的空房子由机器人打扫，等着房价回升，失落天使破产中心区的人行道上却是帐篷城。厅里的旗舰项目是「胶囊之家」：把报废的自动驾驶汽车改成单人宿舍，申请的人已经排到了下一个十年。厅办公楼前的台阶上也有几顶帐篷，工作人员上班时会和帐篷里的人打招呼。"
      en: "Responsible for housing plans, rent subsidies and help for the homeless. House prices across the state are dozens of times the median income; in the Bay whole streets of empty houses are kept clean by robots waiting for prices to recover, while the pavements of Downturn in Lost Angeles are a tent city. Its flagship scheme is Capsule Homes, turning scrapped self-driving cars into single rooms, and the waiting list already runs into the next decade. There are tents on the steps of its own building, and staff say good morning to the people in them on their way in."
    in: div_ymeec8
    offset_km: [1.4, -1.9]
    site: { layout: slab, size_m: [130, 70] }
  - id: bld_k8h354
    subtype: government
    status: generated
    names:
      zh: 加利福尼亚自治州算法与民政厅
      en: Department of Algorithms and Civil Affairs, California Autonomous State
      es: Departamento de Algoritmos y Asuntos Civiles del Estado Autónomo de California
    short_names:
      zh: 算法与民政厅
      en: Department of Algorithms and Civil Affairs
    notes:
      zh: "原来的民政厅，负责户籍、婚姻登记、社会救济和选民登记，改名时加上了「算法」二字，因为这些事现在几乎全由算法决定。救济申请由一个模型审批，拒绝理由由另一个模型生成，申诉再交给第三个模型复核，三个模型从来没有意见不一致过。失业者领到的「再就业提示词课程」也由本厅发放，课程的最后一课教人如何让模型写求职信，去应聘那些被模型取代了的工作。"
      en: "Once the Department of Civil Affairs, responsible for civil registration, marriages, welfare and voter registration; it added 'Algorithms' to its name because algorithms now decide almost all of these. One model approves welfare claims, another writes the reasons for refusal and appeals go to a third, and the three have never disagreed. The 'Re-employment Prompt Course' handed to the unemployed comes from this department too; its last lesson teaches how to have a model write the cover letter for a job that a model has taken."
    in: div_ymeec8
    offset_km: [1.8, -1.9]
    site: { layout: slab, size_m: [130, 70] }
  - id: bld_6zmy7h
    subtype: government
    status: generated
    names:
      zh: 加利福尼亚自治州劳动与自动化失业厅
      en: Department of Labor and Automation Unemployment, California Autonomous State
      es: Departamento de Trabajo y Desempleo por Automatización del Estado Autónomo de California
    short_names:
      zh: 劳动与自动化失业厅
      en: Department of Labor and Automation Unemployment
    notes:
      zh: "负责劳动法、失业登记和职业培训。全州一大半的白领、司机和客服被人工智能取代，本厅的失业登记处排队排到了楼外。为了缩短排队，厅里把自己的客服也换成了模型，于是失业的客服打电话来登记时，接电话的正是取代了他们的那个模型，它会礼貌地说「我理解您的感受」。厅里每月公布一次「自动化失业率」，数字太高的那几个月，报告会推迟到下个月，和好消息一起发布。"
      en: "Responsible for labour law, unemployment registration and job training. More than half the state's office workers, drivers and call-centre staff have been replaced by AI, and the queue at its unemployment office runs out of the building. To shorten it the department replaced its own call-centre staff with a model, so that when out-of-work call-centre staff ring to register they are answered by the very model that replaced them, which says politely, 'I understand how you feel.' It publishes an Automation Unemployment Rate every month; in months when the figure is too high, the report is held over to the next month and released together with some good news."
    in: div_ymeec8
    offset_km: [0.6, -2.3]
    site: { layout: slab, size_m: [130, 70] }
  - id: bld_8tpcec
    subtype: government
    status: generated
    names:
      zh: 加利福尼亚自治州卫生与人类服务厅
      en: Department of Health and Human Services, California Autonomous State
      es: Departamento de Salud y Servicios Humanos del Estado Autónomo de California
    short_names:
      zh: 卫生与人类服务厅
      en: Department of Health and Human Services
    notes:
      zh: "管理公立医院、医疗补助和公共卫生，现任厅长是无党籍的医学专家。诊断大多由模型给出，医生的职责是签字，再向病人解释模型的意思；公立医院的急诊要等十几个小时，私立医院则可以提前预约「免排队套餐」。厅里还要应付山火季的烟雾、夏天的热浪和蚊子，夏天的公告栏上常常同时贴着三张警报。厅名里的「人类」二字是改名时特意保留的，厅长说这是为了提醒大家，服务的对象仍然是人。"
      en: "Runs the public hospitals, medical aid and public health; its present head is a non-partisan doctor. Most diagnoses are made by models, and the doctor's job is to sign and explain to the patient what the model means; the emergency departments of public hospitals have waits of a dozen hours or more, while private hospitals sell a 'no-queue package' in advance. The department also deals with wildfire smoke, summer heatwaves and mosquitoes, and in summer its notice board often carries all three alerts at once. 'Human' was kept in its name on purpose when the departments were renamed; the director says it reminds everyone that the people served are still people."
    in: div_ymeec8
    offset_km: [1.0, -2.3]
    site: { layout: slab, size_m: [130, 70] }
  - id: bld_egax4s
    subtype: government
    status: generated
    names:
      zh: 加利福尼亚自治州山火、干旱与环境厅
      en: Department of Wildfire, Drought and Environment, California Autonomous State
      es: Departamento de Incendios, Sequía y Medio Ambiente del Estado Autónomo de California
    short_names:
      zh: 山火、干旱与环境厅
      en: Department of Wildfire, Drought and Environment
    notes:
      zh: "负责山火防治、水资源分配和环境保护。加州有一半的年份在闹干旱，另一半在着火，有时两样同时发生；厅里的值班表按「山火季」和「干旱季」排，中间没有空档。它最难的工作是分水：农场要水浇杏仁，城市要水洗车，湾区的数据中心要水冷却服务器，最后分到水最多的往往是出价最高的那一家。厅的屋顶装着一台烟雾传感器，读数太高时，大楼会自动关窗、取消户外会议。"
      en: "Responsible for fighting wildfires, sharing out water and protecting the environment. Half of California's years are droughts and the other half fires, sometimes both at once; the duty roster runs by 'fire season' and 'drought season' with no gap between them. Its hardest job is dividing the water: farms want it for almonds, cities for washing cars and the Bay's data centres for cooling servers, and the biggest share usually goes to whoever bids highest. A smoke sensor on the roof shuts the windows and cancels outdoor meetings when the readings climb too high."
    in: div_ymeec8
    offset_km: [1.4, -2.3]
    site: { layout: slab, size_m: [130, 70] }
  - id: bld_qn6rj6
    subtype: government
    status: generated
    names:
      zh: 加利福尼亚自治州州长官邸
      en: Governor's Mansion of the California Autonomous State
      es: Mansión del Gobernador del Estado Autónomo de California
    short_names:
      zh: 州长官邸
      en: Governor's Mansion
    notes:
      zh: "州长任期内的官邸，在州议会大厦东边，一座带花园、泳池和网球场的老宅。和比尔斯伯勒、马里买的豪宅比起来它小得可怜，历任州长多半只在这里办招待会，晚上回自己家住；网球场常年借给游说公司举办「州长杯」慈善赛，报名费是和州长谈话十分钟。官邸的围墙加高过一米，因为征集罢免签名的志愿者会翻墙进来，请州长本人签名。"
      en: "The governor's official residence, east of the capitol, an old house with a garden, a pool and a tennis court. Next to the mansions of Billsborough and Malibuy it is pitifully small, and most governors have only held receptions here and gone home to sleep; the tennis court is lent year-round to lobbying firms for the charity 'Governor's Cup', whose entry fee is ten minutes' conversation with the governor. The wall has been raised by a metre, because volunteers collecting recall signatures used to climb it to ask the governor to sign."
    in: div_ymeec8
    offset_km: [2.4, -0.5]
    site: { layout: estate, size_m: [260, 200] }
  - id: bld_by75p1
    subtype: office
    status: generated
    names:
      zh: 说客大厦
      en: Lobbyist Tower
      es: Torre de los Cabilderos
    notes:
      zh: "游说区的名字就来自这栋楼：几百家游说公司、公关公司和政治咨询公司挤在同一座塔楼里，离州议会大厦步行几分钟。大楼的电梯按楼层收费，越往上的楼层离议员的饭局越近；一楼大堂有一台自动售货机，投币可以买到当天的法案摘要和每位议员的「沟通时段」。楼里的公司如今大多用模型起草法案，再原样交给议员，州议会通过过一项法案，条文里还留着一句「请根据需要修改」。"
      en: "Lobbyton is named after this building: hundreds of lobbying, PR and political consulting firms packed into one tower a few minutes' walk from the capitol. The lifts charge by the floor, and the higher the floor the closer to legislators' dinners; a vending machine in the lobby sells, for a few coins, the day's bill summaries and each legislator's 'engagement slots'. Most of the firms now draft bills with models and hand them to legislators as they are, and the State Legislature once passed a bill whose text still contained the line 'edit as needed'."
    in: div_ymeec8
    offset_km: [-0.8, -0.8]
    site: { layout: tower, size_m: [140, 140] }
  - id: poi_71fjgh
    subtype: airport
    status: generated
    names:
      zh: 萨克拉钱托国际机场
      en: Sacramoney International Airport
      es: Aeropuerto Internacional de Sacradinero
    notes:
      zh: "萨克拉钱托国际机场是首府的机场，在蔓延维尔区北边的平原上，场地约 3200 米乘 1000 米，占地约 3.2 平方公里，只有一条南北向的跑道。四周是一望无际的平地，南边是蔓延维尔区一模一样的独栋住宅，北边是稻田和果园，冬天三角洲的浓雾漫上来时，航班常常一延误就是半天。航班主要飞往失落天使、圣遣返和贝叶斯，每周还有一班远程航班飞往星球另一面的中国各领地，要飞大半天。\n航站楼的安检之后还有第二道检查：州移民与海关执法局的柜台，连从州内飞来的旅客也要出示证件。到达大厅里最显眼的是游说公司的广告牌，上面写着「欢迎来到首府，您的议员正在等您」。\n机场最忙的是周一早上和周五傍晚：州长、议员和他们的幕僚平日在首府上班，周末都回失落天使或湾区的家，周五飞走，周一飞回来，航班上坐满了穿西装的人，空乘说一趟航班上谈成的事比议会一周谈成的还多。平日里航站楼空空荡荡，候机厅里多是游说公司的职员，他们在登机口附近转悠，看哪位议员今天提前回家。那班远程航班起飞的日子，候机厅里会多出几个拖着大箱子的旅客，他们是全机场唯一不会被问「您代表哪个行业」的人。"
      en: "Sacramoney International Airport is the capital's airport, on the plain north of Sprawlville, its site about 3,200 by 1,000 metres, covering about 3.2 km², with a single north–south runway. Flat land stretches away on every side, with the identical detached houses of Sprawlville to the south and rice fields and orchards to the north, and in winter, when thick fog creeps up from the delta, flights are often delayed by half a day. Most flights go to Lost Angeles, San Deportes and Bayesian, and once a week a long-haul flight leaves for the Chinese territories on the far side of the planet, most of a day away.\nAfter security there is a second check at the desks of the State Immigration and Customs Enforcement Agency, where even passengers arriving from within the state must show their papers. The most prominent thing in the arrivals hall is a lobbying firm's billboard: \"Welcome to the capital. Your legislator is waiting for you.\"\nThe airport is busiest on Monday mornings and Friday evenings: the governor, the legislators and their staff work in the capital during the week and go home to Lost Angeles or the Bay Area at weekends, flying out on Friday and back on Monday, so the flights are full of suits, and cabin crew say more gets settled on one flight than in a week of the legislature. On other days the terminal is empty, its lounges holding mostly lobbying-firm staff who hover near the gates to see which legislator is going home early. On the day the long-haul flight leaves, a few more passengers with big suitcases appear in the lounge; they are the only people in the airport who never get asked which industry they represent."
    in: div_0aep50
    offset_km: [-5, 5]
    site: { layout: airport, size_m: [3200, 1000], angle_deg: 90 }

  # ── 贝叶斯市：空城、法院、拘押岛与人工智能公司 ──
  - id: bld_5q59at
    subtype: government
    status: generated
    names:
      zh: 加利福尼亚州最高法院
      en: Supreme Court of California
      es: Corte Suprema de California
    notes:
      zh: "自治州的最高法院，七名大法官，由首席大法官领衔。法院大楼在贝叶斯市先验区的老城里，是这座空城里少数夜里还亮着灯的大楼：州政府各厅搬去萨克拉钱托时，法院坚持留在原址，理由是「法律不应随人口迁移」。如今大法官们大多在家通过视频开庭，法庭里坐着的是操作摄像机的工作人员和一排机器人律师助理。法院最常审理的是罢免、公投提案和人工智能责任的案子，判决书由大法官亲手写成，这是全州少数仍由人类执笔的公文。"
      en: "The state's highest court, seven justices led by the Chief Justice. Its building stands in the old city of Prior District in Bayesian, one of the few in that empty city still lit at night: when the departments moved to Sacramoney, the court insisted on staying, on the grounds that 'the law should not follow the population'. Today the justices mostly sit from home by video, and the courtroom holds the camera operators and a row of robot paralegals. Its commonest cases concern recalls, ballot propositions and liability for artificial intelligence, and its judgments are written by the justices themselves, among the few official documents in the state still written by a human hand."
    in: div_0vf1b0
    at: [105.46, 254.30]
    site: { layout: courtyard, size_m: [200, 160] }
  - id: poi_x3zw6x
    subtype: detention_centre
    status: generated
    names:
      zh: 遣返岛拘押中心
      en: Deportation Island Detention Centre
      es: Centro de Detención de la Isla de la Deportación
    notes:
      zh: "海湾里一座小岛上的拘押中心，四面是冰冷的海水和急流。州移民与海关执法局把岛上原来的灯塔和仓库改成了拘押设施：双层围栏，围栏上每隔一段有一座瞭望塔，岸边的探照灯整夜扫过海面。被拘押的人从湾区和北部各市押送过来，在这里等待遣返船，等待的时间从几天到几年不等。牢房不够用，执法局就在岛东头的空地上摞起了集装箱牢房。从对岸贝叶斯的空楼里能望见岛上的灯，那是这座空城夜里最亮的地方之一。"
      en: "A detention centre on a small island in the bay, ringed by cold water and strong currents. The State Immigration and Customs Enforcement Agency turned the island's old lighthouse and stores into a detention site: a double fence with a watchtower every so often along it, and searchlights on the shore sweeping the water all night. Detainees are brought here from the Bay and the northern cities to wait for a deportation ship, for anything from a few days to a few years. When the cells ran out, the agency stacked container cells on the open ground at the island's east end. The island's lights can be seen from the empty buildings of Bayesian across the water, among the brightest things in that empty city at night."
    in: div_0vf1b0
    at: [105.90, 256.90]
    site: { layout: detention, size_m: [2200, 1400] }
  - id: poi_sph5ky
    subtype: vehicle_depot
    status: generated
    names:
      zh: 多余出行机器人出租车总站
      en: Waymore Robotaxi Depot
      es: Cochera de Robotaxis Waymore
    notes:
      zh: "多余出行公司的机器人出租车总站，几千辆无人驾驶出租车在这里充电、清洗和更新地图。贝叶斯只剩 4.5 万人，可这些车按算法预测的需求昼夜在街上兜圈，几乎从不载客，只在电量不足时开回来，充满电又立刻出发。总站的大屏幕上显示着「今日完成订单」，数字常年是个位数，旁边一行小字写着「今日行驶里程」，数字有七位。公司说空车兜圈是在「为需求的回归做准备」。"
      en: "The depot of Waymore's robotaxis, where thousands of driverless cabs charge, are washed and update their maps. Bayesian has only 45,000 people left, yet the cars circle its streets day and night on predicted demand, almost never with a passenger, coming back only when their batteries run low and leaving again as soon as they are full. A big screen shows 'orders completed today', a single-digit number all year round, and beside it, in small print, 'distance driven today', a number seven digits long. The company says the empty cars are 'preparing for the return of demand'."
    in: div_0vf1b0
    at: [105.96, 252.89]
    site: { layout: plant, variant: depot, size_m: [1200, 800] }
  - id: poi_ymaqdb
    subtype: airport
    status: generated
    names:
      zh: 贝叶斯国际机场
      en: Bayesian International Airport
      es: Aeropuerto Internacional de Bayesiana
    notes:
      zh: "贝叶斯国际机场是湾区北部的机场，在先验区南边的海湾岸上，场地约 3000 米乘 1400 米，占地约 4.2 平方公里，有两条大致东西向的跑道，一头伸向海湾。湾区南部的旅客多走圣克拉拉区的圣何塞国际机场。下午海雾从湾口涌进来时，跑道常常一半在阳光里、一半在雾里，货机只能等雾退了再落；跑道边的滩涂上常有成群的水鸟。\n湾区人口多的时候这里人来人往，如今客运航站楼只开着一个登机口，跑道上起降的大多是运送芯片、服务器和机器人零件的货机，以及几位科技寡头的私人飞机。航站楼里的咖啡馆、书店和行李转盘都由机器人照看，偶尔有旅客走进来，机器人会一起转过头去。\n航站楼外的出租车道上停满了多余出行的机器人出租车，它们按算法预测的需求排队等客，几乎从来等不到人，等满一个小时就开走兜一圈，再回来接着排。货运区倒是全机场最热闹的地方，叉车和无人搬运车昼夜不停，把一箱箱芯片送上货机。机场书店里最畅销的书叫《如何在空城里生活》，店里的机器人说，买书的大多是来出差的工程师，他们读完就把书留在候机厅里，下一位读者往往要过好几个星期才出现。"
      en: "Bayesian International Airport is the northern Bay's airport, on the bay shore south of Prior District, its site about 3,000 by 1,400 metres and covering about 4.2 km², with two roughly east–west runways running out towards the bay. Travellers from the south of the Bay mostly use San Jose International Airport in Santa Clara District. When the sea fog pours in through the bay mouth in the afternoon, the runways often lie half in sunshine and half in fog, and the freighters have to wait for the fog to pull back before they land; flocks of waterbirds often feed on the mudflats beside the runways.\nIt was busy when the Bay was full of people; today the passenger terminal opens a single gate, and most of what lands and takes off are freighters carrying chips, servers and robot parts, and the private jets of a few tech oligarchs. The terminal's cafés, bookshop and baggage belts are all looked after by robots, and when the occasional passenger walks in, the robots all turn their heads.\nThe taxi lane outside the terminal is lined with Waymore robotaxis queuing for passengers as their algorithm predicts demand; they almost never get one, and after an hour of waiting they drive off for a circuit and come back to queue again. The cargo area, by contrast, is the liveliest part of the airport, with forklifts and driverless carriers working day and night to load crate after crate of chips onto the freighters. The bestseller in the airport bookshop is How to Live in an Empty City; the shop's robot says most buyers are engineers on business trips, who leave the book in the lounge when they have finished it, and the next reader often takes weeks to turn up."
    in: div_0vf1b0
    at: [106.26, 247.89]
    site: { layout: airport, size_m: [3000, 1400], angle_deg: -28 }
  - id: poi_as7dy5
    subtype: factory
    status: generated
    names:
      zh: 后验熄灯工厂
      en: Posterior Lights-Out Factory
      es: Fábrica a Oscuras de Posterior
    notes:
      zh: "海湾对岸一座不开灯的工厂：机器人看不见也能干活，所以车间里常年一片漆黑，只有机械臂上的指示灯在闪。工厂生产的是机器人，机器人再去生产别的东西，包括更多的机器人。全厂只有十几名人类维修工程师，他们上班要戴头灯，下班时会顺手关掉门口那盏灯，那是厂里唯一为人装的灯。附近的居民早已搬走，工厂的外墙上还留着当年招工广告的痕迹。"
      en: "A factory across the bay that never turns its lights on: robots can work without seeing, so the shop floors are dark all year, apart from the status lights blinking on the arms. It makes robots, which go on to make other things, including more robots. The whole plant has a dozen or so human maintenance engineers, who wear head torches at work and on their way out switch off the lamp by the door, the only light in the plant put up for people. The neighbours moved away long ago, and the outer wall still carries the ghost of an old hiring advertisement."
    in: div_9tazhz
    at: [114.38, 248.56]
    site: { layout: plant, variant: assembly, size_m: [1500, 900] }
  - id: poi_27c6j9
    subtype: data_centre
    status: generated
    names:
      zh: 算力岛数据中心
      en: Compute Island Data Centre
      es: Centro de Datos de la Isla del Cómputo
    notes:
      zh: "风投湾南湾里算力岛上的数据中心群，这座人工岛几乎被机房和变电站铺满，机房直接抽海水冷却，排出的热水让附近的海面冬天也冒着白汽。岛上运行着湾区几家人工智能公司的大模型，州里的救济审批、法案起草和学校里的家教，很多都是在这里算出来的。岛的四周装着围栏和摄像头，渔船不许靠近，海鸥却不受限制，机房屋顶上停满了海鸥，岛上的机器人维护员有一半的工单是清理鸟粪。"
      en: "The data centres of Compute Island in the south arm of Venture Bay, which cover almost the whole of that artificial island with server halls and substations; they are cooled with seawater pumped straight in, and the warm outflow keeps the water nearby steaming even in winter. The big models of the Bay's AI companies run here, and much of the state's welfare decisions, bill drafting and school tutoring is computed on this island. Fences and cameras ring the shore and fishing boats may not come near, but the gulls go where they like; the roofs are covered with them, and half the work orders of the island's robot maintainers are for clearing their droppings."
    in: div_zjfaw0
    at: [109.80, 249.30]
    site: { layout: campus, size_m: [2400, 1400], rural: true }
  - id: bld_a15mqc
    subtype: headquarters
    status: generated
    names:
      zh: 闭源智能总部
      en: ClosedAI Headquarters
      es: Sede de ClosedAI
    notes:
      zh: "闭源智能公司的总部园区。创始人萨姆·奥德曼常说公司的使命是「让通用人工智能造福全人类」，公司的名字则来自创立后不久的一次改名：原来的名字里有「开放」二字，后来大家觉得不太合适。园区里的楼都没有朝外的窗户，员工要过三道门禁才能进到训练大模型的机房，访客只能在大堂里和一台演示机器人聊天。公司的模型写了州议会一半的法案草稿、加速党的每周政纲和许多学校的作业；园区门口的标语写着「安全第一」，下面一行小字是「上线第一」。"
      en: "The campus of ClosedAI. Its founder Sam Oddman likes to say the company's mission is 'to make artificial general intelligence benefit all of humanity'; the name comes from a change made soon after the founding, when the old name, which had 'Open' in it, came to seem not quite right. None of the buildings has a window facing out, staff pass three security gates to reach the halls where the big models are trained, and visitors get only a chat with a demonstration robot in the lobby. The company's models have written half the State Legislature's draft bills, the Accelerate Party's weekly platform and a great deal of homework; the slogan at the gate reads 'Safety First', with 'Ship First' in small print underneath."
    in: div_0vf1b0
    at: [106.32, 253.82]
    site: { layout: campus, size_m: [900, 700], rural: true }
  - id: bld_ndz2qy
    subtype: headquarters
    status: generated
    names:
      zh: 梨公司无限环
      en: Pear Infinite Ring
      es: Anillo Infinito de Pear
    notes:
      zh: "梨公司的总部，一座环形大楼围着一片果园，从空中看像一枚巨大的戒指，也像一个永远在加载的图标。环里种的是梨树，梨公司的标志就是一只被咬了一口的梨。大楼的外墙是一整圈弧形玻璃，员工刚搬进来时常常撞上去，公司只好在玻璃上贴了一圈梨形贴纸。梨公司如今最赚钱的产品是一副能替人回消息的耳机，戴上以后主人可以一整天不说话，耳机会用主人的声音说「好的，收到」。"
      en: "Pear's headquarters, a ring-shaped building round an orchard, which from the air looks like a giant wedding ring, or a loading icon that never finishes. The orchard is of pear trees, Pear's logo being a pear with a bite out of it. The outer wall is one unbroken curve of glass, and when staff first moved in they kept walking into it, so the company stuck a ring of pear-shaped stickers round it. Pear's most profitable product now is a pair of earbuds that answer messages for you: with them in, the owner can go all day without speaking, while the earbuds say 'OK, got it' in the owner's voice."
    in: div_zjfaw0
    at: [117.64, 236.77]
    site: { layout: ring, size_m: [1000, 1000], rural: true }
  - id: bld_6agh0p
    subtype: headquarters
    status: generated
    names:
      zh: 咯咯园
      en: Gaggleplex
      es: Gaggleplex
    notes:
      zh: "搜索公司咯咯的总部园区，公司早年的格言是「不作恶」，后来改成了「不太作恶」。园区里有免费的食堂、滑梯、按摩椅和彩色的自行车，可员工已经不多：搜索结果早已由模型直接写成答案，人类工程师的工作是检查答案里的广告够不够多。园区中央立着一块牌子，写着「这里的一切都可以搜索」，旁边有人用马克笔加了一句「除了我们的税单」。"
      en: "The campus of the search company Gaggle, whose early motto 'Don't be evil' later became 'Don't be too evil'. It has free canteens, slides, massage chairs and coloured bicycles, but few staff: search results have long been written straight out as answers by a model, and the human engineers' job is to check that the answers carry enough adverts. A sign in the middle of the campus says 'Everything here is searchable', and someone has added in marker pen, 'except our tax returns'."
    in: div_zjfaw0
    at: [115.40, 240.19]
    site: { layout: campus, size_m: [1000, 700], rural: true }
  - id: bld_yy52zx
    subtype: headquarters
    status: generated
    names:
      zh: 无所谓平台总部
      en: Meh Platforms Headquarters
      es: Sede de Meh Platforms
    notes:
      zh: "社交网络公司无所谓平台的总部，创始人莫克·萨克伯格。总部是一整栋长条形的大楼，屋顶铺着草坪和步道，员工可以在屋顶散步、对着海湾开会。公司曾经把全部身家押在一个虚拟世界上，那个世界里的人物没有腿，用户也不多；后来又改押人工智能，让平台上的大部分帖子、评论和点赞都由模型生成，活跃用户数从此再也没有下降过。大楼门口竖着一个巨大的点赞手势，手势的角度据说每个季度都要按股价调整一次。"
      en: "The headquarters of the social network Meh Platforms, founded by Mork Suckerberg: a single long building with lawns and paths on its roof, where staff can stroll and hold meetings facing the bay. The company once bet everything on a virtual world whose characters had no legs and not many users; then it bet on AI instead, letting models produce most of the posts, comments and likes on its platforms, and its active users have never fallen since. A giant thumbs-up stands at the entrance, its angle reportedly adjusted to the share price every quarter."
    in: div_zjfaw0
    at: [113.47, 242.66]
    site: { layout: slab, size_m: [700, 350], rural: true }
  - id: bld_krtnpt
    subtype: headquarters
    status: generated
    names:
      zh: 障碍软件总部
      en: Obstacle Corporation Headquarters
      es: Sede de Obstacle Corporation
    notes:
      zh: "数据库公司障碍软件的总部，创始人拉里·埃卢森。几栋圆柱形的玻璃楼围着一个人工湖，公司的产品出了名地难装、难用、更难卸载，客户说每一份合同都是一道「障碍」，公司干脆把这句话变成了名字。障碍软件的一大块收入来自许可证审计：它定期上门清点客户用了多少份软件，再补收差价。埃卢森本人很少来总部，他更喜欢住在自己买下的那座岛上。"
      en: "The headquarters of the database company Obstacle, founded by Larry Ellusion: a few cylindrical glass towers round an artificial lake. Its products are famously hard to install, hard to use and harder still to remove; customers said every contract was an 'obstacle', and the company simply made that its name. A large part of its income comes from licence audits, visiting customers to count how many copies they use and billing the difference. Ellusion himself seldom comes to headquarters; he prefers to live on the island he bought."
    in: div_zjfaw0
    at: [109.94, 244.42]
    site: { layout: complex, size_m: [600, 500], rural: true }
  - id: bld_xmr168
    subtype: headquarters
    status: generated
    names:
      zh: 全景监狱技术公司总部
      en: Panopticon Technologies Headquarters
      es: Sede de Panopticon Technologies
    notes:
      zh: "数据分析公司全景监狱技术的总部，创始人彼得·斯蒂尔。总部是一座环形楼，中间还有一座塔，正好照着同名的那种监狱设计：塔里的人看得见环里的每一个人，环里的人看不见塔里有没有人。公司最大的客户是州移民与海关执法局，检查站、拘押中心和巡逻无人机拍下的每一张脸都送到这里比对。员工的工牌会记录他们在楼里走过的每一步，公司说这是为了「以身作则」。"
      en: "The headquarters of the data analytics company Panopticon Technologies, founded by Peter Steel: a ring-shaped building with a tower in the middle, after the prison of the same name, in which whoever is in the tower can see everyone in the ring and no one in the ring can tell whether anyone is in the tower. Its biggest customer is the State Immigration and Customs Enforcement Agency, and every face photographed at the checkpoints, in the detention centres and by the patrol drones is matched here. Staff badges log every step they take in the building, which the company says is 'leading by example'."
    in: div_zjfaw0
    at: [113.02, 241.07]
    site: { layout: ring, size_m: [600, 600], rural: true }

  # ── 比尔斯伯勒市：富豪城 ──
  - id: bld_zbkbdd
    subtype: townhall
    status: generated
    names:
      zh: 比尔斯伯勒市政厅
      en: Billsborough City Hall
      es: Ayuntamiento de Villabilletes
    notes:
      zh: "比尔斯伯勒唯一的公共设施，一座两层的小楼，只在有人预约时开门。市议会九个席位上坐的大多是各家家族办公室推出的人，开会时多数议员通过视频参加，会议室里只摆着一排屏幕。市政厅的大门要刷三道卡，第三道卡只发给市长；城旗的原件锁在楼里的保险库里，挂在外面的是编了号的复制品。"
      en: "Billsborough's only public building, a small two-storey house that opens only by appointment. Most of the nine council seats are held by people put forward by the family offices, and most members join meetings by video, so the council chamber holds only a row of screens. The door takes three key cards, the third issued only to the mayor; the original city flag is locked in the strongroom, and the ones flying outside are numbered copies."
    in: div_jssc24
    at: [111.82, 241.74]
    site: { layout: block, size_m: [110, 110] }
  - id: poi_mtkz2g
    subtype: mansion
    status: generated
    names:
      zh: 奥德曼庄园
      en: Oddman Estate
      es: Finca Oddman
    notes:
      zh: "闭源智能创始人萨姆·奥德曼在门禁高地区的庄园。主楼两翼对称，泳池、网球场和三栋客房围着一大片草坪，车库外停着一排从不开出门的跑车，草坪尽头有一个直升机坪。奥德曼常在访谈里说通用人工智能会让每个人都富足，庄园的围墙却加高了两次；墙里的管家、园丁和保镖都是真人，因为他觉得「真人服务更有温度」。庄园地下据说还有一间避难室，里面存着罐头、净水器和一台不联网的服务器。"
      en: "The Gated Heights estate of ClosedAI's founder Sam Oddman. A main house with matching wings, a pool, a tennis court and three guest houses stand round a broad lawn, a row of sports cars that never leave the grounds sits outside the garage, and there is a helipad at the end of the lawn. Oddman likes to say in interviews that artificial general intelligence will make everyone rich, yet the estate wall has been raised twice; the butlers, gardeners and bodyguards inside it are all human, because he feels 'human service is warmer'. Beneath the house, it is said, is a safe room stocked with tinned food, water filters and a server with no network connection."
    in: div_jssc24
    at: [111.38, 241.37]
    site: { layout: estate, size_m: [520, 420] }
  - id: poi_9g3e2k
    subtype: mansion
    status: generated
    names:
      zh: 塔斯克庄园
      en: Tusk Estate
      es: Finca Tusk
    notes:
      zh: "尼昂·塔斯克在护城河山区的大庄园。他名下有一家造电动车的公司、一家造火箭的公司和一个社交网站，庄园里也一样都不少：主楼前停着十几辆原型车，后面是一个人工湖和员工村，围墙边修了一条私人跑道，跑道尽头的机库里停着他的私人飞机。他几次在网上宣布要搬离加州，庄园门口的「出售」牌子挂了又摘、摘了又挂，物业公司干脆给牌子装了一根电动升降杆。庄园里原本还规划了一座火箭发射台，因为邻居投诉噪音，至今只浇了地基。"
      en: "Neon Tusk's great estate in Moat Hills. He owns a company that builds electric cars, a company that builds rockets and a social network, and the estate has a bit of everything: a dozen prototype cars parked in front of the main house, an artificial lake and a staff village behind it, a private airstrip along the wall and his jet in the hangar at the end of it. He has announced online several times that he is leaving California, and the 'For Sale' sign at the gate has gone up and come down so often that the managing agents fitted it with an electric mast. A rocket pad was planned too, but after the neighbours complained about the noise only its foundations were ever poured."
    in: div_b4v4f8
    at: [108.57, 237.36]
    site: { layout: estate, variant: compound, size_m: [3200, 2200] }

  # ── 失落天使市 ──
  - id: poi_v81hte
    subtype: airport
    status: generated
    names:
      zh: 失落天使国际机场
      en: Lost Angeles International Airport
      es: Aeropuerto Internacional de Los Ángeles Perdidos
    notes:
      zh: "失落天使国际机场在烟雾谷区西边靠海的平地上，场地约 3500 米乘 1400 米，占地约 4.9 平方公里，两条东西向的跑道朝着大海。烟雾谷区是盆地南部人口最多的工人区，平房、仓库和货运场被领道的立交桥切开，降落的飞机贴着这些屋顶飞过；夏天的烟雾在盆地里散不出去，跑道尽头的海面有时也灰蒙蒙的。\n机场离市中心只有十几公里，开车却常常要两个小时，比从这里飞到圣遣返还久，于是航站楼外排着一长队直升机出租车，按分钟计价，城里三百多个楼顶停机坪就是它们的去处。航站楼里有州移民与海关执法局的大片检查区，入境旅客要先过人脸识别，再回答一台机器人提出的三个问题，答错一个就会被请进旁边的小屋。到达大厅最大的广告牌属于一家私人安保公司，写着「欢迎来到失落天使，请选择您的保护套餐」。\n停车场领道从烟雾谷区经过，它是全州最繁忙的领道，收费按人工智能实时算出的「愿付价格」计算，赶飞机的人还要再加价。烟雾谷区的居民不少在机场的货运区、餐饮和清洁岗位上打零工，他们说住在机场旁边最大的好处是看得见飞机，最大的坏处是永远坐不上。那间小屋里的三个问题据说每天都换，有旅客被问过「您对失落天使的交通满意吗」，他回答「满意」，当场就被请了进去。"
      en: "Lost Angeles International Airport lies on the flat land by the sea west of Smogdale, its site about 3,500 by 1,400 metres and covering about 4.9 km², with two east–west runways pointing out to sea. Smogdale is the most populous working-class district of the southern basin, its bungalows, warehouses and freight yards cut up by state-road flyovers, and landing aircraft skim low over its roofs; in summer the smog cannot escape the basin, and even the sea beyond the end of the runways is sometimes grey.\nThe airport is only a dozen or so kilometres from downtown, but the drive often takes two hours, longer than the flight from here to San Deportes, so a long line of helicopter taxis charging by the minute waits outside, bound for the city's three hundred-odd rooftop helipads. Inside is a large inspection zone of the State Immigration and Customs Enforcement Agency, where arriving passengers pass face recognition and then answer three questions from a robot; get one wrong and you are invited into the little room next door. The biggest billboard in arrivals belongs to a private security firm: \"Welcome to Lost Angeles. Please choose your protection package.\"\nThe Parking Lot Road runs through Smogdale; it is the busiest state road in the state, its tolls set in real time by an AI at \"what you are willing to pay\", with a further surcharge for anyone rushing for a flight. Many Smogdale residents do gig work in the airport's cargo area, catering and cleaning, and say the best thing about living next to the airport is seeing the planes and the worst is never getting on one. The three questions in the little room are said to change every day; one passenger was asked \"Are you satisfied with traffic in Lost Angeles?\", answered \"Yes\", and was invited in on the spot."
    in: div_rwfcw9
    offset_km: [-7, -8]
    site: { layout: airport, size_m: [3500, 1400], angle_deg: 0 }
  - id: poi_qsthe6
    subtype: port
    status: generated
    names:
      zh: 搁浅滩港
      en: Port of Long Beached
      es: Puerto de Playa Varada
    notes:
      zh: "搁浅滩港是失落天使南边的大港，在搁浅滩区的滞港湾里，港区约 5000 米乘 3000 米，占地约 10.8 平方公里。防波堤后面伸出几道突堤，上面是两座集装箱码头、一座散货码头和一座油品码头，龙门吊和集装箱卡车全部无人驾驶，由同一个人工智能调度。地铁 3 号线的终点搁浅滩港站离港区只有四百米，停车场领道也从搁浅滩区经过。\n港外的锚地上常年停着几十艘等着靠泊的货轮，有的一等就是几个月，船员不许上岸，只能在甲板上看着城里的灯。码头工人被裁掉之后组织了长达数年的罢工，调度系统也跟着「罢工」了一次：它算出等罢工结束最划算，于是货轮一直搁在港外排队，船员在甲板上种菜养鸡，搁浅滩区的人划着小船去船上买鸡蛋。码头上最忙的是州移民与海关执法局的检查站：每一个集装箱都要扫描，扫出来的不只有走私货，偶尔还有躲在里面的人。\n港口的另一股势力是港口分局，市民叫他们「码头帮」：哪艘船想早点靠泊，就要交一笔「引航协助费」，协助的办法是让排在前面的船再多等几天。分局和执法局的检查站各管一半码头，两边的人见了面互相点头，私下里都说对方才是真正的帮派。码头工会说，港口里唯一还由人来做的工作，是在机器出故障时打电话叫人。"
      en: "The Port of Long Beached is the great port south of Lost Angeles, in Backlog Bay in Long Beached District, its harbour area about 5,000 by 3,000 metres and covering about 10.8 km². Behind the breakwater several moles reach out, carrying two container terminals, a bulk terminal and an oil terminal, where the gantry cranes and container trucks are all driverless and dispatched by a single AI. Port of Long Beached station, the southern terminus of Metro Line 3, is only 400 metres from the port, and the Parking Lot Road also runs through Long Beached District.\nDozens of freighters lie at anchor outside all year waiting for a berth, some for months, their crews not allowed ashore and left to watch the city lights from the deck. After the dockers were laid off they staged a strike that lasted years, and the dispatch system went on \"strike\" too: it calculated that waiting for the strike to end was cheapest, so the freighters have stayed queuing outside the port, their crews growing vegetables and keeping chickens on deck, and people from Long Beached row out to buy eggs. The busiest place on the quays is the inspection station of the State Immigration and Customs Enforcement Agency: every container is scanned, turning up smuggled goods and, now and then, people hiding inside.\nThe port's other power is the Harbour Precinct, whose officers people call \"the Dock Gang\": any ship that wants to berth sooner pays a \"pilotage assistance fee\", and the assistance consists of making the ships ahead of it wait a few days longer. The precinct and the agency's inspection station each control half the quays; their men nod to each other when they meet, and each privately says the other is the real gang. The dockers' union says the only job in the port still done by a person is phoning someone when a machine breaks down."
    in: div_3rwj4m
    offset_km: [0, -2.4]
    site: { layout: harbour, size_m: [5000, 3000], terminals: [container, container, bulk, oil] }
  - id: bld_ts98x6
    subtype: police_station
    status: generated
    names:
      zh: 失落天使警察局总部
      en: Lost Angeles Police Headquarters
      es: Jefatura de Policía de Los Ángeles Perdidos
    notes:
      zh: "失落天使警察局名义上的总部，一座玻璃外墙的大楼，市民叫它「玻璃堡」。全市的警察早已分裂成十几个各管一片的分局，每个分局有自己的颜色、手势、徽章纹身和收费表，总部真正能指挥的只剩这栋楼本身和楼前的停车场。局长每周在这里召开一次分局长联席会议，主要议程是划分辖区边界，每次散会后的那个晚上，城里都会有几条街换了颜色。大堂墙上挂着「保护与服务」几个大字，下面不知被谁贴了一张价目表。"
      en: "The nominal headquarters of the Lost Angeles Police, a glass-walled block the city calls 'the Glass Fort'. The city's police split long ago into a dozen or so precincts, each running its own patch with its own colours, hand signs, badge tattoos and price list, and all headquarters still commands is the building itself and the car park in front. The chief holds a weekly meeting of precinct captains here, mostly to settle turf boundaries, and on the night after each meeting a few streets in the city change colour. 'To Protect and to Serve' is written large on the lobby wall, and someone has stuck a price list underneath."
    in: div_jqddbd
    offset_km: [0.4, -0.3]
    site: { layout: complex, size_m: [300, 200] }
  - id: bld_fz3hs9
    subtype: police_station
    status: generated
    names:
      zh: 第七分局
      en: Seventh Precinct
      es: Comisaría Séptima
    notes:
      zh: "烟雾谷区的警察分局，警员在制服外面套一件紫色背心，市民叫他们「紫衫帮」。分局管着全市人口最多的几片街区，晚上挨家挨户收「平安费」，白天在路口开罚单，罚单和平安费的收据用的是同一种纸。有一次和隔壁分局划界，第七分局一夜之间把十几条街的路灯刷成了紫色。分局门口贴着招聘广告：「月薪优厚，提成另计，自带背心者优先」。"
      en: "The police precinct of Smogdale, whose officers wear purple vests over their uniforms and are known as 'the Purple Vests'. It runs the most crowded blocks in the city, collecting 'peace money' door to door at night and writing tickets at the junctions by day, on the same paper for both. Once, in a turf dispute with the precinct next door, the Seventh painted the street lamps of a dozen streets purple overnight. The recruiting poster at the door reads: 'Generous pay, commission extra, own vest preferred.'"
    in: div_rwfcw9
    offset_km: [1.0, 0.8]
    site: { layout: block, size_m: [150, 150] }
  - id: bld_myne4r
    subtype: police_station
    status: generated
    names:
      zh: 港口分局
      en: Harbour Precinct
      es: Comisaría del Puerto
    notes:
      zh: "搁浅滩区的警察分局，管着港口和码头一带，市民叫他们「码头帮」。分局的主要收入来自港外排队的货轮：哪艘船想早点靠泊，就要给分局交一笔「引航协助费」，协助的办法是让排在前面的船再多等几天。分局和执法局的检查站各管一半码头，两边的人见了面会互相点头，私下里都说对方才是真正的帮派。"
      en: "The police precinct of Long Beached, running the port and the waterfront, known in the city as 'the Dock Crew'. Most of its income comes from the freighters queuing outside: a ship that wants an earlier berth pays a 'pilotage assistance fee', the assistance consisting of making the ships ahead of it wait a few days longer. The precinct and the Enforcement Agency's inspection station each run half the quays; their people nod to one another when they meet, and each says in private that the other is the real gang."
    in: div_3rwj4m
    offset_km: [-1.0, 0.6]
    site: { layout: block, size_m: [140, 140] }
  - id: bld_ja6abt
    subtype: school
    status: generated
    names:
      zh: 再就业提示词学院
      en: Re-employment Prompt Academy
      es: Academia de Prompts para el Reempleo
    notes:
      zh: "州里为失业者开办的培训学院，在破产中心区一栋半空的写字楼里。被人工智能取代了工作的司机、客服、会计和翻译在这里上「再就业提示词课程」，学习怎样更好地给人工智能下指令；课程由人工智能讲授，结业作业由人工智能批改。学院门口挂着一条横幅：「人工智能不会取代你，会用人工智能的人会取代你」。学员们说，他们至今没见过那个会用人工智能的人，只见过人工智能。"
      en: "The state's training academy for the unemployed, in a half-empty office block in Downturn. Drivers, call-centre staff, accountants and translators whose jobs went to AI take the 'Re-employment Prompt Course' here, learning to give AI better instructions; the course is taught by an AI and the final assignments are marked by one. A banner over the door says: 'AI won't replace you. A person using AI will.' The students say they have yet to meet that person, only the AI."
    in: div_jqddbd
    offset_km: [-0.5, 0.4]
    site: { layout: hall, size_m: [220, 140] }
  - id: poi_ck8dc5
    subtype: studio
    status: generated
    names:
      zh: 好莱怪无人片场
      en: Hollyweird Unmanned Studios
      es: Estudios sin Personal de Hollyweird
    notes:
      zh: "好莱怪区的老片场，十几座摄影棚如今大多空着：电影的演员、布景和镜头都由模型生成，摄影棚里只留下几台服务器和一个专拍「真人花絮」的小棚。仍在拍戏的真人演员要付钱才能在片尾字幕里出现，配音演员把自己的声音授权给片场，每被模型用一次就收到一笔很小的版税。片场门口的星光大道上，新嵌进去的星星刻的是模型的版本号。"
      en: "The old studio lot of Hollyweird, its dozen or so sound stages now mostly empty: the actors, sets and camera moves of its films are all generated by models, and the stages hold only a few servers and one small set kept for 'real-people behind-the-scenes' footage. The human actors still working pay to appear in the end credits, and voice actors license their voices to the studio for a tiny royalty each time a model uses them. On the walk of stars outside the gate, the newest stars are engraved with model version numbers."
    in: div_16m2n3
    offset_km: [0.6, -0.6]
    site: { layout: campus, size_m: [900, 600] }
  - id: poi_r2jaj4
    subtype: mansion
    status: generated
    names:
      zh: 博佐斯庄园
      en: Bozos Estate
      es: Finca Bozos
    notes:
      zh: "尼罗物流创始人杰夫·博佐斯在比佛利账单区的庄园，原是一位老电影大亨的宅子，他买下以后又买下了左右两边的邻居。主楼、泳池、网球场和客房之外，车库还连着一条地下通道，通往一座私人仓库，里面是他的收藏品，每一件都按尼罗物流的编码上架。尼罗的配送无人机不许飞越庄园，寄到庄园的包裹要在门口交给人类管家，再由管家亲手送进去。博佐斯说他最喜欢这里的原因是「离仓库很近」。"
      en: "The Beverly Bills estate of Nile's founder Jeff Bozos, once the house of an old film mogul; after buying it he bought the neighbours on either side. Besides the main house, pool, tennis court and guest houses, the garage leads into a tunnel to a private warehouse of his collections, every piece shelved under a Nile stock code. Nile's delivery drones may not fly over the estate, and parcels for it are handed to a human butler at the gate to be carried in. Bozos says what he likes best about the place is that 'it's close to the warehouse'."
    in: div_5sjc4x
    offset_km: [-2.5, -2.5]
    site: { layout: estate, size_m: [700, 500] }
  - id: poi_wnqa14
    subtype: mansion
    status: generated
    names:
      zh: 斯蒂尔庄园
      en: Steel Estate
      es: Finca Steel
    notes:
      zh: "全景监狱技术公司创始人彼得·斯蒂尔在马里买海边的庄园。他投资了许多延长寿命的研究，庄园的一栋客房改成了私人诊所，里面有冷冻舱、输血设备和一间只有他能进的实验室；另一栋客房里是一座小型数据中心，存着他的「数字分身」所需的全部资料。庄园面朝大海，可通往海滩的私人道路两头都装着人脸识别闸门，用的是他自己公司的软件。"
      en: "The Malibuy seafront estate of Panopticon Technologies' founder Peter Steel. He has invested in many longevity ventures, and one guest house has become a private clinic with a cryonic chamber, transfusion equipment and a laboratory only he may enter; another holds a small data centre with everything his 'digital double' needs. The estate faces the sea, but the private road down to the beach has face-recognition gates at both ends, running his own company's software."
    in: div_4y0zrw
    offset_km: [-3.5, -1.0]
    site: { layout: estate, size_m: [600, 450] }
  - id: poi_7k428e
    subtype: mansion
    status: generated
    names:
      zh: 克劳特庄园
      en: Klout Estate
      es: Finca Klout
    notes:
      zh: "网红金伯莉·克劳特在马里买的庄园。她在几个平台上有上亿粉丝，其中多少是真人，连平台自己也说不清。庄园的每个角落都按拍照的需要设计：草坪按季节换颜色，客房里住着她的拍摄团队和三个数字分身的运营人员。她的数字分身每天替她发几十条动态、直播带货，本人一年只露面几次，粉丝们说分身比本人更像本人。"
      en: "The Malibuy estate of the influencer Kimberly Klout, who has hundreds of millions of followers across several platforms, though not even the platforms can say how many are human. Every corner of the estate is designed for the camera: the lawns change colour with the seasons, and the guest houses hold her film crew and the operators of her three digital doubles. The doubles post dozens of times a day and sell products on live streams for her, while she appears in person only a few times a year; her fans say the doubles are more like her than she is."
    in: div_4y0zrw
    offset_km: [3.5, -1.5]
    site: { layout: estate, size_m: [500, 400] }

  # ── 圣遣返市：移民执法之都 ──
  - id: bld_wn9g9c
    subtype: government
    status: generated
    names:
      zh: 加利福尼亚自治州移民与海关执法局总部大楼
      en: State Immigration and Customs Enforcement Agency Headquarters, California Autonomous State
      es: Sede de la Agencia Estatal de Inmigración y Aduanas del Estado Autónomo de California
    short_names:
      zh: 执法局总部
      en: Enforcement Agency HQ
      es: Sede de la Agencia
    notes:
      zh: "州移民与海关执法局的总部，签证区里最高的一栋楼，外墙是深色玻璃，从楼顶能望见边界线和海上的遣返船。执法局名义上归公共安全与移民执法厅管，人手和预算却比厅本身大得多：全州的检查站、拘押中心、巡逻基地和遣返航线都由这栋楼指挥。楼里一整层是指挥大厅，墙上的屏幕显示着各检查站的实时画面和全景监狱技术公司送来的人脸比对结果；另一层是「效率办公室」，专门计算每一次遣返的成本，再把数字报给州议会，作为下一年预算的依据。大楼前的广场上立着一块电子牌，滚动显示当年的遣返人数。"
      en: "The headquarters of the State Immigration and Customs Enforcement Agency, the tallest building in Visa District, clad in dark glass, with a view from the roof of the border and the deportation ships at sea. The agency nominally answers to the Department of Public Safety and Immigration Enforcement, but its staff and budget are far larger than the department's own: every checkpoint, detention centre, patrol base and deportation route in the state is run from this building. One whole floor is a command hall whose screens show live pictures from the checkpoints and the face matches sent in by Panopticon Technologies; another is the 'Efficiency Office', which works out the cost of each deportation and reports the figures to the State Legislature as the basis for next year's budget. An electronic sign on the plaza out front scrolls the year's deportation count."
    in: div_ad0sg9
    offset_km: [0.3, 0.6]
    site: { layout: tower, size_m: [160, 160] }
  - id: poi_txgr0e
    subtype: airport
    status: generated
    names:
      zh: 圣遣返国际机场
      en: San Deportes International Airport
      es: Aeropuerto Internacional de San Deportes
    notes:
      zh: "圣遣返国际机场紧挨着签证区，场地约 3000 米乘 900 米，只有一条南北向的长跑道，飞机起降时从港湾上空掠过。机场有两座航站楼：一座是普通的客运航站楼，另一座是州移民与海关执法局专用的遣返航站楼，没有商店，没有登机廊桥，只有一排排铁椅子和通往停机坪的围栏通道。地铁 1 号线西北端的上海站离机场一公里多，拖着箱子的游客从那里走过来；坐出租车去港湾边的老煤气灯街区，也只要十来分钟。\n遣返航站楼的航班比客运航站楼还多，包机公司按人头收费，机身上不写公司的名字。押送的大巴从拘押中心开来，直接开上停机坪，车门对着舷梯。客运航站楼的旅客在候机时，常常能隔着玻璃看见另一边排队登机的人。\n客运航站楼里卖得最好的纪念品是印着港湾日落的明信片和海狮玩偶，航站楼的广播用英语和西班牙语提醒旅客「请出示有效证件」，每隔十分钟一次。机场的空管员说，他们最怕的不是大雾，而是两座航站楼的航班同时排进跑道：客机上的游客和包机上的人在同一条跑道上起飞，飞向完全不同的地方，塔台里的人有时会在两班飞机之间多停顿几秒钟，才说出「可以起飞」。"
      en: "San Deportes International Airport lies right next to Visa District, its site about 3,000 by 900 metres, with one long north–south runway on which aircraft sweep low over the harbour as they come and go. It has two terminals: an ordinary passenger terminal and a deportation terminal for the State Immigration and Customs Enforcement Agency alone, with no shops and no jet bridges, only rows of steel chairs and fenced walkways out to the apron. Shanghai station, at the north-western end of Metro Line 1, is a little over a kilometre away, and tourists walk over from there pulling their suitcases; a taxi to the old gaslamp quarter by the harbour takes only ten minutes or so.\nThe deportation terminal has more flights than the passenger one; the charter firms are paid by the head and paint no names on their aircraft. The escort buses come from the detention centres and drive straight onto the apron, stopping with their doors facing the aircraft steps. Passengers waiting in the passenger terminal can often see, through the glass, the people queuing to board on the other side.\nThe best-selling souvenirs in the passenger terminal are postcards of sunset over the harbour and toy sea lions, and every ten minutes an announcement in English and Spanish reminds passengers to \"please have valid identification ready\". The air traffic controllers say what they dread is not fog but flights from both terminals queuing for the runway at once: tourists in an airliner and the people on a charter taking off from the same runway for entirely different places, and in the tower someone will sometimes pause a few seconds longer between the two before saying \"cleared for take-off\"."
    in: div_ad0sg9
    offset_km: [-4, 5]
    site: { layout: airport, size_m: [3000, 900], angle_deg: 90 }
  - id: poi_5zfgr1
    subtype: port
    status: generated
    names:
      zh: 遣返船码头
      en: Deportation Ship Pier
      es: Muelle de los Buques de Deportación
    notes:
      zh: "遣返船码头是签证区南边海湾里的码头，场地约 800 米乘 600 米，停靠州移民与海关执法局租用的遣返船。码头伸进圣遣返湾，湾口有一道沙嘴挡住外海的风浪，湾里还停着海军舰艇和执法局的巡逻艇。这些遣返船原本是退役的渡轮和货轮，船舱改成了一排排上下铺，甲板四周围上了铁丝网，船身重新刷过漆，看不出原来的名字。\n遣返船每周开出几班，把从拘押中心押来的人送到「来源地」，船上的人常说他们从没去过那个地方。码头上没有送行的人，只有执法局的警员、清点人数的平板电脑和一台自动广播「请保管好您的随身物品」的喇叭。湾边的电子屏实时显示当天的遣返人数，旁边的游客中心卖印着这块屏幕的明信片。\n市政府每年办一场「遣返马拉松」，终点就设在码头的铁门前，跑完全程的人能领到一枚印着遣返船的奖牌。跑者冲过终点时，铁丝网另一边常常正有人排队登船，两边的人隔着围栏对望一眼，又各自转开目光。码头附近的居民说，最难忘的不是船开走的时候，而是船空着回来的时候：甲板上什么也没有，只有那台喇叭还在重复同一句话。"
      en: "The Deportation Ship Pier is a pier on the bay south of Visa District, its site about 800 by 600 metres, where the ships chartered by the State Immigration and Customs Enforcement Agency berth. It reaches out into San Deportes Bay, whose mouth is sheltered from the open sea by a sandspit, and naval vessels and the agency's patrol boats also lie in the bay. The deportation ships are retired ferries and freighters, their holds fitted with rows of bunks, their decks fenced with wire and their hulls repainted so that their old names no longer show.\nA few sail each week, carrying people brought from the detention centres to their \"place of origin\", which many on board say they have never been to. No one comes to see them off; there are only the agency's officers, the tablets used for the head count and a loudspeaker announcing \"Please keep your belongings with you.\" An electronic screen by the bay shows the day's deportation count in real time, and the visitor centre next to it sells postcards of the screen.\nEvery year the city holds a \"Deportation Marathon\" whose finish line is at the pier's iron gate, and everyone who completes the course receives a medal stamped with a deportation ship. As the runners cross the line, there are often people queuing to board on the other side of the wire, and the two sides glance at each other through the fence and look away again. People who live near the pier say what stays with them is not the ships leaving but the ships coming back empty: nothing on deck, and only the loudspeaker still repeating the same sentence."
    in: div_ad0sg9
    offset_km: [-1.5, -3]
    site: { layout: port, size_m: [800, 600] }
  - id: poi_3nyzed
    subtype: border_crossing
    status: generated
    names:
      zh: 边界线口岸
      en: Borderline Port of Entry
      es: Puerto de Entrada de Línea Fronteriza
    notes:
      zh: "边界线区南端的大口岸，几十条车道、一排排检查亭、缉毒犬舍和二次检查棚，按照陆路口岸的标准修得一样不少。问题是加利福尼亚自治州是一座岛，口岸的车道正对着大海：口岸自建成以来没有一辆车从对面开过来，检查亭里的警员每天对着海浪站岗，按时交接班，认真填写「今日入境车辆：0」。州议会每年仍为口岸拨款扩建，理由是「万一」。缉毒犬们闲得发胖，执法局只好把它们派到机场去上班。"
      en: "The great port of entry at the southern tip of Borderline District, built to the full standard of a land crossing: dozens of lanes, rows of inspection booths, drug-dog kennels and secondary inspection sheds. The trouble is that the California Autonomous State is an island, and the lanes face straight out to sea: since the crossing opened no car has ever come from the other side, and the officers in the booths stand watch over the waves, change shifts on time and dutifully fill in 'Vehicles entering today: 0'. The State Legislature still votes money every year to enlarge it, 'just in case'. The drug dogs grew so fat with idleness that the agency sent them to work at the airport."
    in: div_jmthr1
    offset_km: [0, -8.8]
    site: { layout: checkpoint, size_m: [1200, 800], angle_deg: -90 }
  - id: poi_j5m0wd
    subtype: detention_centre
    status: generated
    names:
      zh: 边界线拘押中心
      en: Borderline Detention Centre
      es: Centro de Detención de Línea Fronteriza
    notes:
      zh: "边界线区东南的大型拘押中心，由一家上市的私营监狱公司承包，州里按每天关押的人头付费，公司的财报里把空床位叫作「闲置产能」。拘押中心有双层围墙、一圈瞭望塔、十几排牢房和放风场，牢房住满以后又在东边摞起了集装箱。被拘押的人在等待遣返船期间要在中心的车间里干活，给执法局缝制服、给拘押中心做铁床，一小时的工钱买不起食堂里的一瓶水。"
      en: "A large detention centre in the south-east of Borderline District, run under contract by a listed private prison company; the state pays per head held per day, and the company's accounts call empty beds 'idle capacity'. It has a double wall, a ring of watchtowers, a dozen rows of cell blocks and exercise yards, and when the cells filled, containers were stacked to the east. While they wait for a deportation ship, detainees work in its workshops, sewing uniforms for the agency and making iron bunks for the centre, and an hour's pay will not buy a bottle of water in the canteen."
    in: div_jmthr1
    offset_km: [5.5, -8.0]
    site: { layout: detention, size_m: [2400, 1600] }
  - id: poi_e6f4mf
    subtype: training_centre
    status: generated
    names:
      zh: 执法局边界训练营
      en: Enforcement Agency Border Training Camp
      es: Campamento de Entrenamiento Fronterizo de la Agencia
    notes:
      zh: "州移民与海关执法局的训练营，新警员在这里接受十二周的训练：识别证件、驾驶装甲车、操作无人机，以及怎样在一个没有陆地边界的州里守卫边界。训练营的靶场上立着一排人形靶，靶纸由人工智能生成，据说模型生成的「可疑人员」长得越来越像训练营自己的教官。营地门口的招募海报写着「保卫我们的海岸线」，海报背景里的那条陆地边界是画上去的。"
      en: "The training camp of the State Immigration and Customs Enforcement Agency, where new officers spend twelve weeks learning to check documents, drive armoured vehicles, fly drones and guard a border in a state that has no land border. Its range has a row of human-shaped targets on AI-generated target sheets, and the 'suspects' the model draws are said to look more and more like the camp's own instructors. The recruiting poster at the gate says 'Defend Our Coastline'; the land border in the picture behind the slogan is painted in."
    in: div_jmthr1
    offset_km: [-6, -5]
    site: { layout: camp, variant: barracks, size_m: [1500, 1000] }
  - id: poi_j9ejeb
    subtype: patrol_base
    status: generated
    names:
      zh: 后山无人机巡逻基地
      en: Backcountry Drone Patrol Base
      es: Base de Patrulla de Drones del Interior
    notes:
      zh: "后山区山谷里的无人机基地，属于州移民与海关执法局，一条跑道、一排机库和一座通信塔。几十架长航时无人机从这里起飞，沿着海岸线和沙漠公路日夜巡逻，机腹下的摄像头把每一张拍到的脸送去比对。无人机由几百公里外的操作员远程驾驶，操作员们在空调房里轮班，下班后回到失落天使，堵在回家的路上。基地周围的牧场主说，他们的牛已经习惯了头顶的嗡嗡声。"
      en: "A drone base in a valley of Backcountry District belonging to the State Immigration and Customs Enforcement Agency: a runway, a row of hangars and a communications mast. Dozens of long-endurance drones take off here to patrol the coast and the desert highways day and night, sending every face their belly cameras catch off to be matched. They are flown remotely by operators hundreds of kilometres away, who work shifts in air-conditioned rooms and then drive home to Lost Angeles and sit in traffic. The ranchers round the base say their cattle have got used to the hum overhead."
    in: div_j1wv5r
    offset_km: [-5, 5]
    site: { layout: airbase, variant: uav, size_m: [2400, 1000] }
  - id: bld_q8x8yf
    subtype: university
    status: generated
    names:
      zh: 拉乔利大学
      en: University of La Jolly
      es: Universidad de La Jolly
    notes:
      zh: "拉乔利大学是圣遣返市拉乔利区海边崖顶上的大学，校园东西约 1100 米、南北约 800 米，占地约 0.88 平方公里。拉乔利区是港湾北边的海边富人区，悬崖上是豪宅和这所大学，崖下的海边岩洞里住着海狮。校园沿着崖顶铺开，桉树和草坪之间是教学楼、实验室和宿舍，最显眼的是图书馆，那座楼像一盏倒放的台灯，上宽下窄，立在一片树林之上。\n学校最大、经费最多的学院是「边境安全与人工智能学院」，研究人脸识别、海岸雷达和遣返路线优化，研究如何让算法从照片里判断一个人的身份，经费大多来自州移民与海关执法局和全景监狱技术公司。学院的毕业生多半去了执法局的指挥大厅或全景监狱技术公司，学院楼的走廊里挂着历届校友在检查站和拘押中心前的合影。\n其他学院的学生常拿这个学院开玩笑，说它是全校唯一一个交毕业论文前要先过证件检查的地方。崖下的海滩被一群海狮占领，学校多次想把它们请走，最后发现海狮比任何人都更难遣返。如今海狮成了学校的非正式吉祥物，新生入学第一周都要去崖边看海狮，边境安全学院的教授们也去，他们说海狮是唯一一群从来不怕人脸识别的居民。"
      en: "The University of La Jolly stands on the clifftops by the sea in La Jolly District of San Deportes, its campus about 1,100 metres east to west and 800 metres north to south, covering about 0.88 km². La Jolly District is the wealthy seaside quarter north of the harbour, with mansions and this university on the cliffs and sea lions living in the sea caves below. The campus spreads along the clifftop, with lecture halls, laboratories and halls of residence among eucalyptus trees and lawns, and the most striking building is the library, which looks like an upturned desk lamp, wide at the top and narrow at the base, rising above a grove of trees.\nIts largest and best-funded school is the School of Border Security and Artificial Intelligence, which studies face recognition, coastal radar and the optimisation of deportation routes, and how to make an algorithm tell who a person is from a photograph, funded mostly by the State Immigration and Customs Enforcement Agency and Panopticon Technologies. Most of its graduates go on to the agency's command hall or to Panopticon Technologies, and the corridors of its building are hung with photographs of alumni in front of checkpoints and detention centres.\nStudents from other schools like to joke that it is the only school in the university where you must pass an ID check before handing in your dissertation. The beach below the cliffs has been taken over by sea lions; the university has tried several times to move them on, and found sea lions harder to deport than anyone. Today the sea lions are the university's unofficial mascot, and every freshman goes to the cliff edge to see them in their first week; the professors of the border security school go too, and say the sea lions are the only residents who have never been afraid of face recognition."
    in: div_61yver
    offset_km: [0.5, 0.6]
    site: { layout: campus, size_m: [1100, 800] }

  # ── 仓储帝国与沙漠 ──
  - id: poi_4y788f
    subtype: logistics_park
    status: generated
    names:
      zh: 尼罗物流履约中心
      en: Nile Fulfilment Centre
      es: Centro Logístico de Nile
    notes:
      zh: "尼罗物流在托盘维尔区的巨型仓库，屋顶上是一整片太阳能板，屋顶下是成排的货架和几千台搬运机器人。仓库里的人类员工戴着计步手环，手环会在他们停下来超过规定时间时震动提醒，上厕所的时间也算在内。尼罗说这座仓库「几乎实现了全自动化」，剩下的那一点是指员工。仓库门口每天进出几千辆货车，把托盘维尔的空气染成和烟雾谷一样的颜色。"
      en: "Nile's giant warehouse in Palletville District, its roof one sheet of solar panels over rows of racking and thousands of carrier robots. The human staff wear step-counting wristbands that buzz when they stand still longer than allowed, toilet breaks included. Nile says the warehouse is 'almost fully automated', the 'almost' being the staff. Thousands of lorries pass its gates every day, turning the air of Palletville the same colour as Smogdale's."
    in: div_sc80nv
    offset_km: [1.2, 1.0]
    site: { layout: slab, size_m: [1200, 700] }
  - id: poi_3yyg7r
    subtype: border_crossing
    status: generated
    names:
      zh: 次日达检查站
      en: Next-Day Checkpoint
      es: Control de Entrega al Día Siguiente
    notes:
      zh: "履约高漠区里次日达领道上的内陆检查站，离海岸线一百多公里，州移民与海关执法局却把它当作边境来管：每一辆往北开的车都要停下来，司机出示证件、刷脸，货车还要过一遍扫描。领道上的货车大多是赶着给尼罗物流送「次日达」包裹的，被检查站一拦，常常就变成了「隔日达」。司机们管这里叫「按小时收费的停车场」，检查站旁边于是开起了加油站、汉堡店和一家专门出租折叠床的小店。"
      en: "An inland checkpoint on Next-Day Road in High Desert Fulfillment District, more than a hundred kilometres from the coast, which the State Immigration and Customs Enforcement Agency nonetheless runs as a border: every northbound vehicle stops, drivers show papers and their faces, and lorries go through a scanner too. Most of the lorries on the road are rushing Nile's next-day parcels, and once the checkpoint stops them, next-day often becomes the day after. Drivers call it 'the car park charged by the hour', and a petrol station, a burger bar and a shop renting out folding beds have opened beside it."
    in: div_s76w0x
    offset_km: [0.85, -7]
