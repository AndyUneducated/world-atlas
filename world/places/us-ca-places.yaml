      zh: "帝国尘区沙漠深处的拘押营，四周几十公里没有人家，最高气温纪录在五十度以上。营地用集装箱、帐篷和铁皮板房搭成，一圈围墙和瞭望塔把它围在沙漠里，围墙外面就是沙漠本身，执法局说那才是「真正的围墙」。营地的发电机和空调时常停摆，执法局的预算报告里把这里列为「低成本拘押方案」。附近的公路上立着一块牌子：「前方拘押营，请勿停车，请勿拍照，请勿好奇」。"
      en: "A detention camp deep in the desert of Imperial Dust District, with no homes for dozens of kilometres around, where the record high is above fifty degrees. It is built of containers, tents and tin huts inside a ring of walls and watchtowers, and beyond the wall is the desert itself, which the agency calls 'the real wall'. Its generators and air conditioning often fail, and the agency's budget reports list it as a 'low-cost detention option'. A sign on the nearby highway reads: 'Detention camp ahead. No stopping, no photographs, no curiosity.'"
