    notes: {"zh": "友谊口岸是阿瓦拉齐与马索沃利之间北方公路上的口岸，两国按照友好条约实行简化手续，运送拖拉机和大米的卡车车队每天都要经过。口岸两侧各立着一座纪念碑，纪念两国军队在高原战争中并肩作战。每逢两国的国庆日，口岸会举行联合升旗仪式。", "en": "The Friendship Crossing is on the Northern Road between Avaratsy and Masovoly, where under their friendship treaty the two countries keep simplified formalities and convoys of lorries carrying tractors and rice pass every day. A monument stands on each side to the two armies that fought side by side in the Highland War. On each country's national day a joint flag-raising is held at the crossing."}
