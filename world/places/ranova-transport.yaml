    notes: {"zh": "拉诺马口岸是安博维与安博哈拉之间香草公路上的口岸，香草收获季节，等候过境的货车排出几公里长。安博哈拉一侧的海关用警犬和扫描仪逐车检查，以防毒品混在香草货柜里过境；安博维一侧的检查则通常只需几分钟。", "en": "The Ranoma Crossing is on the Vanilla Road between Ambovy and Ambohara, and in the vanilla harvest the queue of lorries waiting to cross stretches for kilometres. Customs on the Ambohara side check every lorry with dogs and scanners lest drugs slip through among the vanilla; on the Ambovy side the check usually takes a few minutes."}
