    names: {"zh": "瓦罗纳机场", "en": "Varona Airport"}
    notes:
      zh: "瓦罗纳机场建在瓦罗纳岛北岸的平地上，跑道的一端伸进海里，飞机降落时仿佛贴着海面滑行。瓦罗纳是全岛人口最密集的地方，高楼、船厂和集装箱码头密密麻麻地挤在岛上，北岸这片平地是岛上少有的空地，跑道还是填海延长了一段才够用。从机场到市中心只要一刻钟，出租车司机能一边开车一边报出当天港口里停了几艘大船。\n航班飞往岛上各国的港口城市和海外，商人和船东占了旅客的大多数。商业共和国以「对所有人开放港口」为国策，机场也一样，交战各方的商人都能在这里落地，转口港把本岛各国和海外的航线连接在一起。到达大厅里挂着一块大屏幕，实时显示港口里的船只和交易所的行情，许多旅客取行李前会先在屏幕前站上一会儿，看看自己的货船到了没有，或者瓦罗纳商品交易所里的价格又变了多少。\n瓦罗纳人以精明和务实著称，他们说「战争会结束，生意不会」。每年春季的海神节，几百艘装饰一新的船只在港内巡游，执政官把一枚金戒指投入大海，那几天机场的航班总是满座，从全岛各地赶来的船东和商人挤满了到达大厅。降落时坐在窗边的旅客，能看见港内五颜六色的船队一直排到海天相接的地方。"
      en: "Varona Airport lies on the flat north shore of Varona island, one end of its runway reaching out into the sea so that landing aircraft seem to skim the water. Varona is the most densely populated place on the island, its towers, shipyards and container terminals packed tight together, and this flat ground on the north shore is one of the few open spaces left; even so the runway had to be extended onto reclaimed land to be long enough. The city centre is a quarter of an hour away, and taxi drivers can tell you as they drive how many big ships are in port that day.\nIts flights go to port cities across the island and abroad, and traders and shipowners make up most of its passengers. The Merchant Republic's policy is a port 'open to all', and the airport is the same: traders from every warring side can land here, and the entrepôt ties the routes of the island's countries and the world together. A big screen in the arrivals hall shows the ships in port and the prices on the exchange in real time, and many passengers stand before it for a while before collecting their bags, to see whether their freighter has arrived or how far prices on the Varona Commodity Exchange have moved.\nThe people of Varona are known for being shrewd and practical, and say 'wars end, business doesn't'. At the Sea God Festival every spring hundreds of decorated ships parade round the harbour and the Consul casts a gold ring into the sea, and in those days every flight is full, the arrivals hall packed with shipowners and traders from all over the island. Passengers at the windows as they land can see the brightly coloured fleet stretching out to where sea meets sky."
    in: div_9gzdds
    offset_km: [-1.07, -5.39]
    site: {"layout": "airport", "size_m": [3000, 1000], "angle_deg": 169}
  - id: poi_hkt22t
    subtype: airport
    status: generated
    names: {"zh": "马哈维洛国际机场", "en": "Mahavelo International Airport"}
    notes:
      zh: "马哈维洛国际机场建在填海造地的人工岛上，二十四小时运营，是拉诺瓦岛货运量最大的机场，电子产品、药品和鲜花在这里转运到岛上各国和海外。马哈维洛自由港全国就是一座港城，小岛上挤满了集装箱码头、保税仓库、摩天楼和住宅楼，再也找不出一块能修跑道的平地，只好向海要地。机场旁边是马哈维洛保税物流园，货运飞机从这里起飞时，舱里常装着前一天才从海上运来的货物。\n航站楼与自由贸易区之间有专用通道，转机旅客无须入境就能在免税店购物。自由港实行零关税、低税率和自由兑换，本岛各国的进出口大多经由马哈维洛或瓦罗纳转运，连祖源轴心和圣约同盟的商人也常在这里转机。三十多年的战争中，港口和机场从未关闭，马哈维洛人引以为傲地说「战争打了三十年，港口开了三十年」。\n台风季节，航班常因大风取消，旅客挤在候机厅里过夜。机场的餐厅会通宵营业，供应奶茶、菠萝包和海鲜粥，不少旅客说，被困在马哈维洛机场的那一夜，是他们吃得最好的一次延误。夜里从候机厅的落地窗望出去，对岸灯火通明的高楼倒映在海面上，是东南群岛最著名的夜景之一。"
      en: "Mahavelo International Airport is built on a reclaimed artificial island and runs round the clock, the busiest on Ranova for freight, transhipping electronics, medicines and flowers to the island and abroad. The whole of the Free Port of Mahavelo is a single port city, its island so crammed with container terminals, bonded warehouses, skyscrapers and housing blocks that no flat ground was left for a runway, so the land had to be taken from the sea. The Mahavelo Bonded Logistics Park stands beside the airport, and cargo planes taking off from here often carry goods that arrived by sea only the day before.\nA dedicated link joins the terminal to the free trade zone, and transit passengers can shop duty-free without passing immigration. The free port has zero tariffs, low taxes and free convertibility; most of the main island's imports and exports pass through Mahavelo or Varona, and even traders from the Origin Axis and the Covenant League often change planes here. In more than thirty years of war neither port nor airport has ever closed, and Mahavelo people say proudly, 'The war has gone on thirty years, and the port has stayed open thirty years.'\nIn the typhoon season flights are often cancelled by high winds and passengers spend the night in the departure hall. The airport's restaurants stay open all night serving milk tea, pineapple buns and seafood congee, and many travellers say their night stranded at Mahavelo airport was the best-fed delay of their lives. At night, through the departure hall's floor-to-ceiling windows, the brightly lit towers across the water are reflected in the sea, one of the most famous night views in the south-eastern islands."
    in: div_56918f
    offset_km: [-2.78, -4.16]
    site: {"layout": "airport", "size_m": [3600, 1100], "angle_deg": 146}
  - id: poi_x5y6ae
    subtype: airport
    status: generated
    names: {"zh": "萨马伊机场", "en": "Samay Airport"}
    notes:
      zh: "萨马伊机场是萨马伊自由邦的空中门户，位于首都萨马伊城西的海边，场地长约 3 公里、宽约 1 公里。航班飞往岛上各国和海外，国际援助组织的人员和物资也大多从这里进出。自由邦由主岛和东面的努西法拉岛组成，努西法拉岛上有全岛最大的难民营，收容着约十二万名来自本岛各国的难民；机场旁的货运区存放着运往努西法拉难民营的援助物资，粮食、帐篷和药品在这里卸下飞机，再转往港口装船。\n航站楼里设有一间不分宗教的静思室，墙上用拉诺瓦语、卡西里语和英语写着「欢迎来到自由邦」。自由邦宪法规定国家不设国教，三大宗教的节日都是公共假日，机场的安排也照此办理：静思室里不挂任何宗教标志，地上铺着可以朝任何方向的软垫，基督徒、穆斯林和佛教徒常在同一个下午先后进来祈祷。\n萨马伊大学是全岛最好的大学，开学季节，到达大厅里挤满了来自各国的学生和学者，有的人分别从两个交战国飞来，却在同一辆机场大巴上成了室友。安巴罗之围在萨马伊的调解下结束，调解期间各方代表都从这里进出，机场的老员工至今记得，那几个星期的停机坪上停着平时绝不会并排的几架飞机。每年三环节前后，航站楼的大厅里会同时挂起教堂、清真寺和佛寺送来的装饰。"
      en: "Samay Airport is the air gateway of the Free State of Samay, by the sea west of the capital, Samay, on a site about 3 km long and 1 km wide. It has flights to the countries of the island and abroad, and most aid agency staff and supplies come and go through it. The Free State is made up of the main island and Nosifara Island to the east, where the largest refugee camp on Ranova shelters some 120,000 people from the island's many countries; aid bound for the Nosifara refugee camp is stored in the cargo area beside the airport, where food, tents and medicine are unloaded from the planes before going on to the port to be shipped.\nIts terminal has a quiet room for all faiths, and 'Welcome to the Free State' is written on the wall in Ranovan, Kasiri and English. The Free State's constitution establishes no state religion and makes the festivals of all three faiths public holidays, and the airport follows suit: the quiet room carries no religious symbol, its floor is laid with cushions that can face any direction, and Christians, Muslims and Buddhists often come in to pray one after another on the same afternoon.\nThe University of Samay is the best on the island, and at the start of term the arrivals hall fills with students and scholars from every country; some fly in from two countries at war with each other and end up as room-mates on the same airport bus. The Siege of Ambaro was ended through Samay's mediation, and the delegations of every side came and went through the airport while the talks lasted; long-serving staff still remember planes on the apron in those weeks that would never otherwise have stood side by side. Around the Three Rings Festival each year the terminal hall is hung with decorations sent by the cathedral, the mosque and the Buddhist temple together."
    in: div_56wn6n
    offset_km: [1.94, 2.91]
    site: {"layout": "airport", "size_m": [3000, 1000], "angle_deg": 146}
  - id: poi_tg2tqf
    subtype: airport
    status: generated
    names: {"zh": "努西拉国际机场", "en": "Nusira International Airport"}
    notes:
      zh: "努西拉国际机场是一座金色与白色相间的新航站楼，由石油收入建成，有飞往海外各大城市的航线，外籍劳工大多从这里入境。努西拉苏丹国由三座主要岛屿组成，机场在首都所在的中岛上，从候机厅可以望见海湾边的苏丹宫和金顶大清真寺。近海油气田被发现后，苏丹国迅速致富，这座航站楼就是那个年代的象征：大理石地面、金色的穹顶和成排的棕榈树，连行李推车都镀着金边。\n机场设有王室专用的贵宾航站楼，苏丹出访时，跑道两侧铺上红地毯，王室成员、世家与部族的代表列队送行。外籍劳工约占全国人口的三分之一，他们大多在深夜的航班上抵达，下飞机后在专门的通道排队办理手续，再坐上大巴前往城郊的劳工城；同一座机场里，公民走的是另一条宽敞明亮的通道。政府的「后石油愿景」希望把努西拉变成航运和旅游中心，飞往东岛达兰海滨酒店的游客渐渐多了起来。\n候机厅里每到礼拜时间就会响起宣礼声，旅客们放下行李走进祈祷室，免税店的店员也暂时拉下卷帘门。开斋节前后是机场最忙的时候，回国过节的公民和回乡探亲的劳工把候机厅挤得水泄不通，苏丹在王宫前向民众分发礼物的消息在电视屏幕上反复播放。"
      en: "Nusira International Airport is a new gold-and-white terminal built with oil money, with flights to the great cities abroad, and most foreign workers arrive through it. The Sultanate of Nusira is made up of three main islands, and the airport is on the central island where the capital stands; from the departure hall one can see the Sultan's Palace and the Golden-Domed Great Mosque by the bay. The discovery of the offshore oil and gas made the sultanate rich almost overnight, and this terminal is a symbol of that time: marble floors, golden domes and rows of palms, even the luggage trolleys trimmed with gold.\nIt has a separate royal terminal, and when the sultan travels red carpets are laid along the runway and members of the royal family and representatives of the great families and tribes line up to see him off. Foreign workers make up about a third of the population; most arrive on late-night flights, queue in a separate channel for their formalities and then board buses for the labour city on the outskirts, while in the same airport citizens use another channel, spacious and brightly lit. The government's 'post-oil vision' aims to make Nusira a hub of shipping and tourism, and more tourists now fly on to the seaside hotels of Daran on the eastern island.\nThe call to prayer sounds through the departure hall at each prayer time; passengers put down their bags and go into the prayer rooms, and the duty-free assistants pull down their shutters for a while. The days around Eid are the airport's busiest, the departure hall jammed with citizens coming home for the holiday and workers going home to see their families, while the television screens replay the news of the sultan handing out gifts to his people before the palace."
    in: div_vtqsys
    offset_km: [-5.88, -1.17]
    site: {"layout": "airport", "size_m": [3600, 1200], "angle_deg": 101}
  - id: poi_84n0q1
    subtype: airport
    status: generated
    names: {"zh": "米拉卡机场", "en": "Miraka Airport"}
    notes:
      zh: "米拉卡机场是一座小巧的海岛机场，位于首都米拉卡城外的海边平地上，航站楼是白墙红瓦的英式乡村风格建筑，旺季时满是来度假的游客。米拉卡是全岛政治自由度最高的国家之一，旅游是经济的支柱，英式的乡村小镇、圣公会教堂和王室卫队换岗仪式吸引着世界各地的游客，他们大多从这里入境。航站楼里只有几个登机口，行李转盘旁摆着菠萝和椰子的宣传画，入境柜台的工作人员会笑着问游客打算在岛上住几天。\n航班飞往安博哈拉、瓦罗纳和海外，国王出访时也从这里乘坐普通航班。国王托阿维纳二世不掌握实权，王室的开支由议会审核，他出行时只带几名随从，在候机厅里和普通旅客一样排队登机。常有游客上了飞机才发现，坐在前几排看报纸的那位先生就是国王。\n机场的停机坪边上种着一排椰子树，跑道尽头就是白沙海滩。傍晚在海滩上散步的人常停下来，看着飞机从头顶低低地掠过，孩子们会冲着起落架挥手。旺季的周末，跑道尽头的海滩上挤满了晒太阳的游客，飞机落地时，常有人举起相机抢拍机腹掠过椰树梢的一瞬。米拉卡人以「岛上最安静的地方」自居，机场的广播声几乎是这片海滩上唯一的噪音。"
      en: "Miraka Airport is a small island airport on the flat shore outside the capital, Miraka, whose terminal, white-walled and red-roofed in English country style, is full of holidaymakers in the high season. Miraka is among the most politically free countries on the island, and tourism is the mainstay of its economy: its English-style country towns, Anglican churches and the changing of the Royal Guard draw visitors from all over the world, most of whom arrive through here. The terminal has only a few gates, posters of pineapples and coconuts hang by the baggage carousel, and immigration officers smile as they ask visitors how long they plan to stay.\nFlights go to Ambohara, Varona and abroad, and the king flies from here on ordinary scheduled flights. King Toavina II holds no real power and the royal household's spending is reviewed by Parliament; he travels with only a few attendants and queues to board in the departure lounge like any other passenger. Visitors often discover only once aboard that the gentleman reading a newspaper a few rows ahead is the king.\nA row of coconut palms lines the apron, and the runway ends at a white sand beach. People walking on the beach in the evening often stop to watch the planes skim low overhead, and children wave at the undercarriage. On high-season weekends the beach at the end of the runway is packed with sunbathers, and as a plane comes in someone always raises a camera to catch its belly skimming the tops of the palms. The people of Miraka call theirs 'the quietest place on the island', and the airport's announcements are almost the only noise on this beach."
    in: div_b3521p
    offset_km: [-2.49, -1.67]
    site: {"layout": "airport", "size_m": [2800, 900], "angle_deg": 124}
  - id: poi_w12df2
    subtype: airport
    status: generated
    names: {"zh": "伊纳拉机场", "en": "Inara Airport"}
    notes:
      zh: "伊纳拉机场是群岛邦唯一的机场，只有一条短跑道和一座木结构的小航站楼，航班飞往萨马伊和马哈维洛。群岛位于拉诺瓦岛东南外海最远处，被珊瑚礁和蓝色的潟湖环绕，飞机降落前会低低地掠过潟湖，乘客能看见水下的珍珠养殖场和海藻田。跑道短，只能起降小型螺旋桨飞机，大风天航班常常取消，旅客就在氏族的家庭旅馆里多住几天。\n旅客到达时，氏族的妇女们会在门口为他们戴上鲜花编成的花环。群岛实行母系制度，女性在政治、经济和家庭中都拥有主导地位，接待客人也是各氏族女性家长的事；游客必须住在各氏族经营的家庭旅馆里，收入由氏族共享，接机的妇女往往就是旅馆的女主人。执政联盟中的新岛民党主张扩建伊纳拉机场，开通直飞海外的航班；它的伙伴氏族传统党坚持只发展家庭旅馆，海洋公地党则担心群岛变成「另一个旅游岛」。\n航站楼的屋顶模仿传统长屋的样式，候机厅里陈列着远航独木舟的模型，有的模型出自伊纳拉独木舟船屋的老匠人之手，旁边的牌子讲述先祖母亲们驾着独木舟从海上来到群岛的故事。离岛的旅客会把花环抛进潟湖，岛上的人说，花环漂回岸边的人，总有一天还会再来。"
      en: "Inara Airport is the island state's only airport, with one short runway and a small timber terminal and flights to Samay and Mahavelo. The islands lie furthest out of all in the sea south-east of Ranova, ringed by coral reefs and blue lagoons, and aircraft skim low over the lagoon before landing, giving passengers a view of the pearl farms and seaweed beds below the water. The short runway takes only small propeller aircraft, flights are often cancelled on windy days, and travellers simply stay a few more days in the clans' family guesthouses.\nWhen travellers arrive, women of the clans hang garlands of fresh flowers round their necks at the door. The islands are matrilineal and women lead in politics, the economy and the family, so receiving guests is the business of each clan's women heads; visitors must stay in guesthouses run by the clans, whose income the clan shares, and the woman who meets the plane is often the mistress of the guesthouse. The New Islanders' Party in the governing coalition wants to expand Inara Airport and open direct flights abroad; its partner, the Clan Tradition Party, insists on developing nothing but family guesthouses, and the Ocean Commons Party fears the islands will become 'just another tourist island'.\nThe terminal roof copies a traditional longhouse, and models of ocean-going canoes are displayed in the departure hall, some made by old craftsmen of the Inara Canoe House, beside signs telling how the first mothers came over the sea to the islands by canoe. Departing travellers throw their garlands into the lagoon, and islanders say that anyone whose garland drifts back to shore will one day return."
    in: div_t4rn8w
    offset_km: [2.12, 2.12]
    site: {"layout": "airport", "size_m": [2400, 800], "angle_deg": 135}
  - id: poi_g420h1
    subtype: airport
    status: generated
    names: {"zh": "安巴罗机场", "en": "Ambaro Airport"}
    notes:
      zh: "安巴罗机场由国际委员会管理，跑道和航站楼都是战后重建的，停机坪上常停着涂有国际组织标志的白色飞机。安巴罗之围期间，岛上的旧机场在炮击中被毁，停火后，国际委员会用援助资金铺设了新跑道，盖起一座朴素的单层航站楼。托管地非军事化，机场上没有任何军用飞机，只有维和部队租用的运输机和直升机。\n航班主要是援助和维和人员的专机，各方代表来安巴罗谈判时也在这里降落。安巴罗是全岛唯一被所有国家承认的政治实体，也是交战各方停火谈判、交换战俘和遣返难民的场所，伊索卡人民战争的和谈接触、南方战争的人道主义通道都经由安巴罗协调。机场的工作人员早已习惯这样的场面：敌对双方的代表团同一天抵达，被分别领进两间休息室，由不同的车送往旧海军要塞里的国际委员会总部。拉诺瓦联合共和国的流亡政府也驻在岛上，它的官员常在这里迎送来访的侨民代表。\n航站楼门口立着一块牌子，上面写着「这里没有敌人，只有客人」。交换战俘的日子，跑道边挤满了等待的家属，飞机舱门一打开，哭声和欢呼声便连成一片。机场的老员工说，他们见过的拥抱，比全岛任何一座机场都多。"
      en: "Ambaro Airport is run by the International Commission; its runway and terminal were rebuilt after the war, and white aircraft in the colours of international bodies often stand on the apron. The old airfield was destroyed by shelling during the Siege of Ambaro, and after the ceasefire the Commission laid a new runway with aid money and put up a plain single-storey terminal. The territory is demilitarised, so no military aircraft use the airport, only transport planes and helicopters chartered by the peacekeepers.\nMost flights carry aid workers and peacekeepers, and delegates coming to Ambaro to negotiate land here too. Ambaro is the only political entity on the island recognised by every country, and the place where warring sides negotiate ceasefires, exchange prisoners and repatriate refugees; peace contacts in the Isoka People's War and the humanitarian corridors of the Southern War are all arranged through Ambaro. The airport staff are used to the scene: delegations of opposing sides arrive on the same day, are shown into two separate lounges and are driven in different cars to the International Commission's headquarters in the old naval fort. The exiled government of the United Republic of Ranova is also based on the island, and its officials often meet and see off visiting delegations of the diaspora here.\nA sign at the terminal entrance reads: 'There are no enemies here, only guests.' On prisoner-exchange days the edge of the runway is crowded with waiting families, and when the aircraft doors open the weeping and cheering run together. Long-serving staff say they have seen more embraces than at any other airport on the island."
    in: div_pr4aer
    offset_km: [-3.89, 3.89]
    site: {"layout": "airport", "size_m": [2600, 900], "angle_deg": 45}

  # ── 港口 / Ports ──
  - id: poi_7gzc5w
    subtype: port
    status: generated
    names: {"zh": "瓦凡博港", "en": "Port of Vavambo"}
    notes:
      zh: "瓦凡博港是安博哈拉唯一的深水港，联邦的大部分进出口货物都从这里装卸，集装箱码头、散货码头和油码头沿着安博河口排开。瓦凡博意为「安博河之口」，是联邦最大的工业城市，炼油厂、水泥厂和纺织厂沿西北湾排开，联邦海军西北舰队也以此为母港。西岸战争爆发后，港区外筑起了长长的防波堤和雷达站。一条六公里多的瓦凡博港公路把码头和城区连在一起，瓦塔铁路从这里出发，把炼油厂的成品油运上高原，一直通到东海岸的塔马塔。\n港口的龙门吊和仓库是瓦凡博的标志，码头工人的工会是联邦最大的工会之一。码头工人聚居的工人区是基督教人民党的据点，联邦自由党则主张降低进口关税、吸引外资到瓦凡博港建设工业区，它的议员还轮流在港口的夜市摆摊，听商贩和码头工人谈物价。\n圣约同盟盟国的援助物资也大多从这里上岸，武器和装备卸船后连夜装上火车运往高原。每逢星期日，联邦全国停业，港口也难得安静下来，只剩海鸥在空荡荡的龙门吊上盘旋。码头工人们说，瓦凡博一周只休息一天，但这一天谁也不能把他们叫回码头。"
      en: "The Port of Vavambo is Ambohara's only deep-water port, handling most of the federation's imports and exports at container, bulk and oil quays along the mouth of the Ambo. Vavambo means 'mouth of the Ambo' and is the federation's largest industrial city, with its refinery, cement works and textile mills along the north-western bay, and the federal navy's North-West Fleet is based here. After the West Coast War broke out a long breakwater and radar stations were built outside the port. The Port of Vavambo Road, a little over six kilometres long, links the quays with the town, and the Vavambo–Tamata Railway starts here, carrying the refinery's products up to the plateau and on to Tamata on the east coast.\nIts gantry cranes and warehouses are Vavambo's landmarks, and its dockers' union is one of the largest in the federation. The workers' districts where the dockers live are strongholds of the Christian People's Party, while the Federal Liberal Party wants lower import tariffs to draw foreign investment into an industrial zone at the port, and its members of parliament take turns running a stall at the port's night market to hear traders and dockers talk about prices.\nMost aid from the Covenant League allies also comes ashore here, and weapons and equipment are loaded onto trains for the plateau the night they are unloaded. On Sundays, when the whole federation closes, even the port falls quiet, with only gulls circling the empty cranes. The dockers say Vavambo rests only one day a week, but on that day no one can call them back to the quays."
    in: div_cwevsp
    offset_km: [0.70, 5.43]
    site: {"layout": "port", "size_m": [2400, 900]}
  - id: poi_2y0rnm
    subtype: port
    status: generated
    names: {"zh": "塔马塔港", "en": "Port of Tamata"}
    notes:
      zh: "塔马塔港是安博哈拉在东海岸的港口，是联邦面向太平洋的门户，主要装卸燃料、化肥和农产品，经拉诺梅纳公路运往高原，丁香、香草和咖啡也从这里装船出口。港口在塔马塔城的海湾里，老码头紧挨着城区，南面的海滩边是阵营盟国援建的集装箱码头，一条七公里多的塔马塔港公路把码头和城区、干线公路连在一起。瓦塔铁路的终点塔马塔站就在港区，列车从这里沿着全长约八百五十公里的线路经首都安博哈拉通往西北湾的瓦凡博。\n港口旁的鱼市每天清晨热闹非凡，渔船天不亮就靠岸，鱼贩们在湿漉漉的水泥地上摆开金枪鱼、石斑和虾蟹，城里饭馆的厨师和从高原下来的批发商挤在一起讨价还价。罐头厂的汽笛声在城里都能听见，换班的汽笛一响，女工们就成群地走出厂门。塔马塔有联邦最大的天主教教区，星期日港口停工，码头工人和家人都去主教座堂做弥撒。\n雨季的风暴常使港口关闭数日，货轮在港外抛锚等待，运往高原的燃料车队排在公路边，首都的加油站有时也会因此排起长队。港口的老人说，看海湾里的浪就知道高原上的油价会不会涨。"
      en: "The Port of Tamata is Ambohara's east-coast port and the federation's gateway to the Pacific, handling mainly fuel, fertiliser and farm produce carried up to the plateau by the Ranomena Road, while cloves, vanilla and coffee are shipped out from here. It lies in the bay of Tamata: the old quays sit right against the town, while to the south, by the beach, is the container terminal built with aid from the bloc's allies, and the Port of Tamata Road, a little over seven kilometres long, links the quays with the town and the trunk road. Tamata Station, terminus of the Vavambo–Tamata Railway, is in the port area, and trains run from here along the line of some 850 km through the capital, Ambohara, to Vavambo on the north-western bay.\nThe fish market beside it is crowded every morning: boats come in before dawn, fishmongers lay out tuna, grouper, prawns and crabs on the wet concrete, and cooks from the town's restaurants jostle with wholesalers down from the plateau to haggle. The cannery's whistle can be heard all over town, and when it blows for the change of shift the women workers stream out of the gates. Tamata has the federation's largest Catholic diocese, and on Sundays the port stops work and the dockers go to Mass at the cathedral with their families.\nStorms in the rains often close the port for days at a time: freighters ride at anchor outside, the fuel convoys bound for the plateau queue along the road, and sometimes even filling stations in the capital have queues because of it. Old men at the port say you can tell from the waves in the bay whether fuel prices on the plateau are about to rise."
    in: div_gjh4td
    offset_km: [2.26, 2.09]
    site: {"layout": "port", "size_m": [1600, 700]}
  - id: poi_g9s5x9
    subtype: port
    status: generated
    names: {"zh": "沃希马希港", "en": "Port of Vohimahy"}
    notes:
      zh: "沃希马希港是阿瓦拉齐最大的港口，国营航运公司的货轮把拖拉机、矿石和纺织品运往马索沃利和海外的友好国家。港区沿东北海岸的海湾展开，一边是沃希马希造船厂的船台，一边是矿石码头和杂货码头；马沃重载铁路自马罗瓦托铬镍矿出发，全长约三百一十公里，把矿石运到港区的矿石码头，是阿瓦拉齐的出口生命线。沃希马希港公路长约十公里，连着港区和城里的工厂，拖拉机厂和纺织联合企业的产品都沿这条路运来装船。\n港区实行严格的管制，由人民海军驻守，外国船员上岸须持特别通行证，只能在港口旁的海员俱乐部活动。俱乐部里有一间小酒吧、一个乒乓球室和一间出售纪念品的商店，营业员会说几种外语。港区的另一座旧海员俱乐部如今是齐马罗沃平等公民阵线的总部，这个被齐马罗沃取缔的反对派在这里落脚，成了港区里一个特别的邻居。\n码头上竖着「劳动创造未来」的巨大标语，晚上用红色灯管照亮，从海上老远就能看见。近年沿海经济区开放后，港口也开始接待来自贝洛瓦和瓦罗纳的商船，码头工人们发现，外国船员带来的香烟和巧克力比过去多了，检查的士兵却一个也没少。"
      en: "The Port of Vohimahy is Avaratsy's largest, where the state shipping line's freighters load tractors, ore and textiles for Masovoly and friendly countries abroad. The port stretches along a bay of the north-east coast, with the slipways of the Vohimahy Shipyard on one side and the ore and general cargo quays on the other; the Marovato–Vohimahy Heavy-Haul Railway, some 310 km long, brings ore from the Marovato chromium and nickel mines to the ore quay and is Avaratsy's export lifeline. The Port of Vohimahy Road, about ten kilometres long, links the port with the factories in town, and the products of the tractor works and the textile combine come down it to the ships.\nThe port area is tightly controlled and guarded by the People's Navy: foreign seamen need a special pass to go ashore and may only visit the seamen's club beside the port. The club has a small bar, a table-tennis room and a souvenir shop whose assistants speak several foreign languages. Another, older seamen's club in the port area now houses the headquarters of the Equal Citizens' Front of Tsimarovo, an opposition banned in Tsimarovo that has settled here and become an unusual neighbour on the waterfront.\nA giant slogan, 'Labour Builds the Future', stands on the quay, lit at night in red neon and visible far out to sea. Since the coastal economic zones opened the port has begun to receive merchant ships from Belova and Varona too, and the dockers have noticed that foreign seamen bring more cigarettes and chocolate than before, though not one of the inspecting soldiers has gone."
    in: div_89czvj
    offset_km: [0.66, -7.15]
    site: {"layout": "port", "size_m": [1800, 700]}
  - id: poi_45zd2y
    subtype: port
    status: generated
    names: {"zh": "萨希勒港", "en": "Port of Sahil"}
    notes:
      zh: "萨希勒港是西海岸最大的港口，装卸着萨希利亚的香料、盐和进口的粮食、燃料，圣约同盟的援助船也在这里停靠。萨希勒是全岛最古老的贸易港，卡西里商人自古驾着单桅帆船往来于岛屿之间，今天港里的单桅帆船仍和集装箱船并排停泊。丁香、腰果和海盐是主要的出口货物，圣约同盟的物资和援助车队多从这里沿横贯公路运往安博哈拉。\n老港区的码头边保留着几座古老的商行和一座白色的灯塔，商行的木门上雕着繁复的花纹，有的仍是香料批发商的仓库，空气里终年飘着丁香和肉桂的味道。新港区则是现代化的集装箱码头，龙门吊日夜作业，萨卡铁路从萨希勒站出发，沿海岸南下通往班达里和卡西里，把内陆的丁香和腰果运来装船。西岸战争爆发后，港口外常有海军舰艇巡逻，防备来自北部山区武装的袭击。\n黄昏时，码头上的宣礼声和货轮的汽笛声交织在一起。每年航海季开始时，海岸民族党在港里举办单桅帆船赛，几十艘挂着党旗的帆船从老城的海堤出发，绕过港外的小岛返回，岸上挤满了看热闹的人。斋月的夜晚，海滨摆开长桌，码头工人和商人坐在一起开斋，宴会一直持续到黎明。"
      en: "The Port of Sahil is the largest on the west coast, loading Sahiliya's spices and salt and landing imported grain and fuel, and the Covenant League's aid ships call here too. Sahil is the oldest trading port on the island; Kasiri merchants have sailed dhows between the islands since time out of mind, and dhows still lie beside container ships in the harbour today. Cloves, cashews and sea salt are the main exports, and the Covenant League's supplies and aid convoys mostly set out from here along the Cross-Island Road to Ambohara.\nThe old harbour keeps a few ancient merchant houses and a white lighthouse on its quays; the merchant houses have intricately carved wooden doors, some are still spice wholesalers' stores, and the air smells of cloves and cinnamon all year round. The new harbour is a modern container terminal whose gantry cranes work day and night, and the Sahil–Kasiri Railway runs from Sahil Station down the coast to Bandari and inland to Kasiri, bringing cloves and cashews from the interior to the ships. Since the West Coast War broke out naval vessels often patrol outside the port against attacks by the armed groups of the northern hills.\nAt dusk the call to prayer on the waterfront mingles with the ships' sirens. At the start of each sailing season the Coast National Party holds a dhow race in the harbour: dozens of boats flying the party flag set out from the old town's sea wall, round the island outside the port and come back, while crowds line the shore. On Ramadan nights long tables are laid along the seafront, dockers and merchants break the fast side by side, and the feast goes on until dawn."
    in: div_f9gjbe
    offset_km: [-1.88, -5.77]
    site: {"layout": "port", "size_m": [2000, 800]}
  - id: poi_knyjvc
    subtype: port
    status: generated
    names: {"zh": "贝洛瓦港", "en": "Port of Belova"}
    notes:
      zh: "贝洛瓦港是贝洛瓦共和国的经济命脉，集装箱码头二十四小时作业，香草、咖啡和蓝宝石从这里出口，电子产品和汽车从这里进口。港口建在首都贝洛瓦的大海湾边，玻璃高楼沿着海湾排开，龙门吊就立在金融区的脚下。每年香草收获季节，满载香草荚的卡车由武装保安护送着沿香草公路开到这里出口，路边的检查站比加油站还多；港口和海关对来自东邻安博维的货物查得格外仔细，贝洛瓦曾多次对那里的卡特尔发动缉毒行动。\n港口对所有国家的商船开放，敌对阵营的货轮常常停在相邻的泊位上。贝洛瓦是世俗协约中最富裕的资本主义成员，但它的码头不问阵营，只问提单。港区以东的填海地上是贝洛瓦港外难民营，收容了约六万名来自邻国的战争难民，许多人每天清晨步行到码头和工厂找活干，为港区提供廉价劳动力。\n港务局大楼顶上的时钟是全城最准的钟。银行家们照着它对表，码头工人看着它换班，据说连证券交易所开盘的钟声也要和它核对。贝洛瓦人有一句玩笑：在这座城市里，什么都可以讨价还价，只有港务局的钟不行。"
      en: "The Port of Belova is the Republic of Belova's lifeline, its container terminal working round the clock: vanilla, coffee and sapphires go out, electronics and cars come in. It lies on the great bay of the capital, Belova, where glass towers line the shore and the gantry cranes stand at the foot of the financial district. In the vanilla harvest season lorries laden with vanilla pods come down the Vanilla Road under armed escort to be shipped from here, past more checkpoints than filling stations; the port and customs check goods from Ambovy to the east with particular care, for Belova has launched anti-drug operations against the cartel there several times.\nIt is open to merchant ships of every country, and freighters of hostile blocs often berth side by side. Belova is the richest capitalist member of the Secular Accord, but its quays ask not about blocs, only about bills of lading. On reclaimed land east of the port lies the Belova Port Refugee Camp, sheltering some 60,000 refugees from wars in neighbouring countries, many of whom walk to the docks and factories every morning to look for work, providing the port with cheap labour.\nThe clock on top of the port authority building is the most accurate in the city. Bankers set their watches by it, dockers change shifts by it, and the opening bell of the stock exchange is said to be checked against it. Belova people joke that in this city everything can be haggled over except the port authority's clock."
    in: div_xfvevz
    offset_km: [-4.71, -3.21]
    site: {"layout": "port", "size_m": [2200, 800]}
  - id: poi_s0brqc
    subtype: port
    status: generated
    names: {"zh": "伊拉希港", "en": "Port of Ilahy"}
    notes:
      zh: "伊拉希港是齐马罗沃唯一的出海口，位于伊拉希河口，伊拉希河发源于伊瓦卡山，向东穿过首都所在的盆地，在这里注入东海。福罗纳的矿石（主要是铁矿石）和兵工厂的产品从这里装船，运往祖源轴心的盟国和海外。齐伊铁路自首都经福罗纳沿伊拉希河谷东下到港区，福伊重载铁路在它旁边另有一条线，把福罗纳的铁矿石直接运到矿石码头；港区的工厂还生产钢材、化肥和军用卡车，伊拉希军用卡车厂的卡车常常成排地停在码头上等待装船。\n港口由军方控制，海军和海岸炮台把守着港湾，外国商船靠港时要接受严格的检查，船员不得上岸过夜。周边国家和国际组织对齐马罗沃实施武器禁运，许多物资依赖走私，港外常有不挂旗的小船趁夜靠岸，海关的记录上却从来没有它们。\n港口旁的造船厂建造渔船和巡逻艇，是国家军工体制的支柱之一。造船厂的工人大多住在港区背后的工人新村里，靠近矿石堆场的楼房窗台上终年落着一层红褐色的矿粉。国内宣传无处不在，造船厂的大门上挂着运动的标语，每艘新巡逻艇下水时都要举行仪式，由运动青年团的少年在船头献花，国家电台播放整点的进行曲。"
      en: "The Port of Ilahy is Tsimarovo's only outlet to the sea, at the mouth of the Ilahy, which rises in the Ivaka Mountains and flows east through the basin of the capital to enter the eastern sea here. Ore from Forona (mainly iron ore) and the products of the arms works are loaded here for the Origin Axis allies and abroad. The Tsimarovo–Ilahy Railway runs from the capital through Forona and down the Ilahy valley to the port, and beside it the Forona–Ilahy Heavy-Haul Railway has a line of its own carrying Forona's iron ore straight to the ore quay; the port's factories also make steel, fertiliser and military lorries, and lorries from the Ilahy Military Lorry Works often stand in rows on the quay waiting to be shipped.\nThe army controls it, the navy and coastal batteries guard the harbour, and foreign merchant ships are searched closely when they call, their crews forbidden to spend the night ashore. Neighbouring countries and international bodies impose an arms embargo on Tsimarovo, and many goods depend on smuggling; small unflagged boats often slip in to the shore outside the port at night, though they never appear in the customs records.\nThe shipyard beside it builds fishing boats and patrol craft and is one of the pillars of the state's military industry. Most of its workers live in the workers' estate behind the port, where a layer of reddish-brown ore dust settles all year round on the windowsills of the blocks nearest the ore yards. Propaganda is everywhere: the shipyard gates are hung with the movement's slogans, and every new patrol boat is launched with a ceremony at which boys of the movement's youth corps lay flowers at the bow while state radio plays the hourly march."
    in: div_s0cxrv
    offset_km: [3.52, 2.56]
    site: {"layout": "port", "size_m": [1800, 700]}
  - id: poi_rm3zjh
    subtype: port
    status: generated
    names: {"zh": "瓦罗纳港", "en": "Port of Varona"}
    notes:
      zh: "瓦罗纳港是拉诺瓦岛最大的转口港，来自岛上各国和环太平洋的货物在这里卸下、储存、交易，再转运到别处。码头、船厂和保税仓库区沿着瓦罗纳岛的海岸连成一片，瓦罗纳造船厂的船台和商品交易所的大楼隔着港湾相望，船舶保险社和三商会大厦就在码头后面的街上。瓦罗纳在联合共和国时期就是西北最大的商港，由几个世代经营航运的商人家族主导。\n港口实行「对所有人开放」的国策，三十多年来从未因战争关闭过一天。大分裂时，商人们组织城市卫队守住了港口，宣布建立商业共和国，交战各方的商船从此都可以在这里停靠。许多世俗协约成员的进出口都经由瓦罗纳转运，共和国因此被称为协约的「钱袋」和「港口」。它与努西拉苏丹国在海上航道和渔业上存在竞争，两国的海军偶尔在海上对峙。\n码头广场上的商人们用拉诺瓦语、卡西里语和英语讨价还价，港口的灯火通宵不灭。码头工人中有不少从努西拉来的人，他们在港区的小清真寺里做礼拜，下了工就在鱼市旁的小摊上吃烤鱼。每年春季的海神节，几百艘装饰一新的船只在港内巡游，执政官把一枚金戒指投入大海，象征共和国与海洋的婚约。"
      en: "The Port of Varona is the largest entrepôt on Ranova, where goods from across the island and the Pacific Rim are landed, stored, traded and shipped on. Quays, shipyards and the bonded warehouse district run together along the shore of Varona island; the slipways of the Varona Shipyard and the Commodity Exchange face each other across the harbour, and the Marine Insurance Society and the House of the Three Chambers stand on the street behind the quays. Varona was already the largest merchant port of the north-west under the United Republic, dominated by a few merchant families who had run shipping for generations.\nUnder the republic's policy of a port 'open to all' it has not closed for a single day of war in more than thirty years. In the Sundering the merchants raised a City Guard to hold the port and proclaimed the Merchant Republic, and ever since the merchant ships of every warring side have been able to call here. Many members of the Secular Accord ship their imports and exports through Varona, which is why the republic is called the Accord's 'purse and port'. It competes with the Sultanate of Nusira over sea lanes and fisheries, and the two navies occasionally face off at sea.\nMerchants on the quay square haggle in Ranovan, Kasiri and English, and the port's lights burn all night. Many of the dockers come from Nusira; they pray at a small mosque in the port area and after work eat grilled fish at the stalls by the fish market. At the Sea God Festival every spring hundreds of decorated ships parade round the harbour and the Consul casts a gold ring into the sea, marking the republic's marriage to the ocean."
    in: div_9gzdds
    offset_km: [-1.88, 14.08]
