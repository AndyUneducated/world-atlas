  - id: poi_y39qbc
    subtype: port
    status: generated
    names: {"zh": "马哈维洛集装箱港", "en": "Mahavelo Container Port"}
    notes:
      zh: "马哈维洛集装箱港是拉诺瓦岛集装箱吞吐量最大的港口，位于东南外海的城邦马哈维洛自由港，码头建在填海造地上，场地长约 2.4 公里、宽约 900 米。几十台龙门吊沿码头排开，集装箱堆场一眼望不到头。自由港对绝大多数货物免征关税，岛上各国的进出口货物大多在这里中转；港口的自动化码头由电脑调度，夜里也灯火通明。\n港口是这座城邦的心脏。海关总署就在集装箱码头旁，主要工作是查验转运货物、打击走私和执行国际制裁，缉私队的快艇停泊在总署楼下；集装箱卡车把货物运到马哈维洛保税物流园分拣，或送进填海建成的马哈维洛自由贸易区拆箱、重新包装，再转运到岛上各国和海外。行政长官府设在港区中心一座三十层大楼的顶部几层，从会议室能俯瞰整个集装箱码头。三十多年的战争中港口从未关闭，连祖源轴心和圣约同盟的商船也常在这里停靠，马哈维洛人引以为傲地说「战争打了三十年，港口开了三十年」。\n自动化码头用的人越来越少，留下来的码头工人多是三班倒的吊机司机和绑扎工，收入远不及楼上的船东和银行家，许多人住在填海地上的公共屋邨里。下了夜班，他们常结伴去庙街夜市的大排档吃一碗粥面；工人们说，看堆场的灯就知道生意好坏，灯越亮，夜宵摊收得越晚。"
      en: "Mahavelo Container Port handles more containers than any other port on Ranova. It lies in the Free Port of Mahavelo, the city-state off the south-east coast, with its quays on reclaimed land on a site about 2.4 km long and 900 m wide. Dozens of gantry cranes line the quays, and the container yards stretch beyond sight. The free port charges no duty on almost all goods, and most of the island's imports and exports are transhipped here; its automated terminal is run by computer and stays lit all night.\nThe port is the heart of the city-state. The Customs and Excise Department stands beside the container terminal, its work chiefly to inspect goods in transit, fight smuggling and enforce international sanctions, and its anti-smuggling launches are moored below the building. Container lorries carry cargo to the Mahavelo Bonded Logistics Park for sorting, or into the Mahavelo Free Trade Zone, built on reclaimed land, to be unpacked and repacked before going on to the island's countries and overseas. The Chief Executive's Office occupies the top floors of a thirty-storey tower in the middle of the port district, and its meeting rooms look down on the whole container terminal. In more than thirty years of war the port has never closed, and even ships of the Origin Axis and the Covenant League often call; Mahavelo people say with pride that 'the war has gone on for thirty years, and the port has stayed open for thirty years'.\nThe automated terminal needs fewer hands every year, and the dockers who remain are mostly crane drivers and lashers working three shifts, earning far less than the shipowners and bankers in the towers, and many live in the public housing estates on the reclaimed land. After the night shift they often go together to the food stalls of the Temple Street Night Market for a bowl of congee or noodles; the workers say you can tell how business is going from the lights in the yards, and the brighter they are, the later the supper stalls stay open."
    in: div_56918f
    offset_km: [2.24, 5.40]
    site: {"layout": "port", "size_m": [2400, 900]}
  - id: poi_63b4ny
    subtype: port
    status: generated
    names: {"zh": "努西拉石油港", "en": "Nusira Oil Port"}
    notes:
      zh: "努西拉石油港是苏丹国的原油出口码头，海上油田的原油经海底管道输送到岸边的储油罐，再装上巨型油轮运往海外。码头从岸边伸进深水区，银白色的储油罐在岸上排成几行，几条输油臂可以同时为两艘油轮装油。近海油气田被发现后，苏丹国迅速致富，人均收入约三万八千美元，公民享有免费医疗、教育和住房补贴，不缴所得税，这一切几乎都是从这座码头流出去的。\n港口旁是努西拉炼油厂和燃气电站，夜里火炬的光芒照亮了整个海湾，城里的人说，在努西拉从来不需要等月亮。港口由皇家海军和雇来的保安严密看守，努西拉为萨希利亚的西岸战争提供资金和军事援助，因此多次成为贾巴利亚武装的袭击目标；苏丹国还与卡托拉特许领在油气区划界上存在争议，海上偶尔有对峙。政府的「后石油愿景」要发展金融、航运和旅游，但码头上的油轮一艘也没有少。\n外籍劳工在码头上轮班工作，酷暑中也不停歇。他们来自本岛和海外，住在城郊的劳工城，没有公民权，每天坐着大巴往返于宿舍和码头之间。人权组织多次批评他们的工作条件。发薪日那天，城里的汇款点前排起长队，劳工们把一个月的工资寄回家乡。"
      en: "The Nusira Oil Port is the sultanate's crude export terminal, where oil from the offshore fields arrives by seabed pipeline at the tank farm ashore and is loaded onto giant tankers for abroad. The jetty reaches out from the shore into deep water, the silver tanks stand in rows on land, and several loading arms can fill two tankers at once. The discovery of the offshore oil and gas made the sultanate rich almost overnight, with income of some $38,000 a head and free health care, education and housing allowances for citizens, who pay no income tax, and nearly all of it flows out through this terminal.\nThe Nusira Oil Refinery and the gas power station stand beside it, and at night the flares light up the whole bay; townspeople say that in Nusira you never need to wait for the moon. The port is closely guarded by the navy and hired security, for Nusira funds and arms Sahiliya in the West Coast War and has therefore been attacked several times by the Jabaliya militants; the sultanate also disputes the boundary of its oil and gas areas with the Katora Chartered Territory, and there are occasional stand-offs at sea. The government's 'post-oil vision' aims to build up finance, shipping and tourism, but not one tanker fewer calls at the terminal.\nForeign workers work the quays in shifts, even in the fiercest heat. They come from the main island and abroad, live in the labour city on the outskirts without citizenship, and ride buses between their quarters and the quays every day. Human rights groups have criticised their working conditions many times. On payday long queues form outside the money-transfer shops in town as the workers send a month's wages home."
    in: div_vtqsys
    offset_km: [0.45, 5.33]
    site: {"layout": "port", "size_m": [1800, 700]}
  - id: poi_e5r2tf
    subtype: port
    status: generated
    names: {"zh": "萨马伊港", "en": "Port of Samay"}
    notes:
      zh: "萨马伊港是自由邦的主要港口，位于首都萨马伊的海湾里，渡轮往返于萨马伊、安提瓦和努西法拉之间，货轮装卸着可可、香草和援助物资。主岛中部是两千一百多米高的萨马伊火山，火山灰土上种满可可、香草和咖啡，这些作物从山坡上的种植园运到码头装船。东面的努西法拉岛上有全岛最大的难民营，收容了约十二万名来自本岛各国的难民，运往那里的援助物资大多先在萨马伊港卸下，再转装渡轮送过海峡。\n港口的候船厅里有教堂、清真寺和佛寺各自开设的小礼拜室，来往的旅客可以在开船前祈祷。自由邦不设国教，三大宗教的节日都是公共假日，候船厅的三间礼拜室并排开在同一条走廊上，门口分别挂着十字架、新月和法轮的标志。礼拜室的志愿者常常互相帮忙照看，赶上大节日，三间屋子的人会一起在候船厅里分发茶点。\n渡轮上总是挤满了各种各样的人：去安提瓦的上班族、去努西法拉难民营工作的援助人员和医生、回营地探亲的难民，还有萨马伊大学的学生和来自各国的流亡者。许多难民已在营地中生活了二十多年，他们的孩子在萨马伊上学，每个周末坐渡轮往返。每年三环节，港口的渡轮挂满彩旗，从努西法拉载来参加首都联合游行的人。"
      en: "The Port of Samay is the Free State's main port, in the bay of the capital, Samay: ferries run between Samay, Antiva and Nosifara, and freighters load cocoa and vanilla and land aid. Mount Samay rises over 2,100 m in the middle of the main island, its volcanic soils planted with cocoa, vanilla and coffee, and these crops come down from the hillside plantations to the quays. Nosifara island to the east has the largest refugee camp on the island, sheltering some 120,000 refugees from every country of the main island, and most of the aid bound for it is first landed at Samay and then transferred to ferries across the strait.\nThe ferry terminal has small prayer rooms run by the church, the mosque and the Buddhist temple, where travellers can pray before sailing. The Free State has no state religion and the feasts of all three faiths are public holidays; the three prayer rooms open side by side off the same corridor, marked at their doors with a cross, a crescent and a dharma wheel. Their volunteers often look after each other's rooms, and at the great festivals the people of all three hand out tea and cakes in the terminal together.\nThe ferries are always crowded with every kind of passenger: commuters to Antiva, aid workers and doctors going to work in the camp on Nosifara, refugees visiting family in the camp, students of the University of Samay and exiles from every country. Many refugees have lived in the camp for more than twenty years, and their children go to school in Samay and ride the ferry back and forth every weekend. At each Festival of the Three Rings the ferries are hung with flags and bring people over from Nosifara for the joint procession in the capital."
    in: div_56wn6n
    offset_km: [-1.18, -5.75]
    site: {"layout": "port", "size_m": [1600, 700]}
  - id: poi_cx08rj
    subtype: port
    status: generated
    names: {"zh": "米拉卡港", "en": "Port of Miraka"}
    notes:
      zh: "米拉卡港是王国的主要港口，位于首都米拉卡的港湾里，离港口广场和王宫不远。菠萝罐头和椰子产品从这里出口，主岛平缓的地势上种满了菠萝、椰子和甘蔗，罐头厂的货柜从种植园运到码头装船。游轮和渡轮把游客从瓦罗纳和萨拉卡送来，旺季时码头上同时停着两三艘白色的游轮，游客下船后步行就能走到王宫看卫队换岗。港湾曲折，停满了渔船和游艇，港口的另一侧是米拉卡皇家海军基地。\n港口旁的老海关大楼是一座红砖建筑，如今改成了航海博物馆，馆里陈列着旧时的航海图、渔船模型和联合共和国时期的海关账册。高原战争和西岸战争期间，大批难民乘船逃到米拉卡，海军巡逻舰也常在海上搜救遇险的难民船，博物馆的一个展厅专门讲述这些救援的故事。\n每年春天，国王会在港口为新下水的渔船祝福。渔民们把船漆得色彩鲜艳，挂上彩旗排在码头边，国王沿着码头一艘艘走过去，圣公会的神父跟在后面洒圣水。海员与渔民党的议员们这一天也会来到码头，和渔民们一起喝上几杯。每年国王生日的海上阅舰也在港外举行，港湾里的渔船和游艇都会挂旗鸣笛致意。"
      en: "The Port of Miraka is the kingdom's main port, in the harbour of the capital, Miraka, not far from Harbour Square and the palace. It exports canned pineapple and coconut products: the gentle land of the main island is planted with pineapple, coconut and sugar cane, and containers from the canneries come down from the plantations to the quays. Cruise ships and ferries bring visitors from Varona and Saraka; in the high season two or three white cruise ships lie at the quay at once, and their passengers can walk ashore to the palace to watch the changing of the guard. The winding harbour is full of fishing boats and yachts, and the Miraka Royal Navy Base lies on its far side.\nThe old red-brick customs house beside it is now a maritime museum, displaying old charts, models of fishing boats and customs ledgers from the days of the United Republic. During the Highland War and the West Coast War great numbers of refugees fled to Miraka by boat, and navy patrol ships often went to the rescue of refugee boats in distress at sea; one of the museum's galleries is given over to the story of those rescues.\nEach spring the king blesses the newly launched fishing boats in the harbour. The fishermen paint their boats in bright colours and line them up along the quay hung with bunting, the king walks past them one by one, and an Anglican priest follows sprinkling holy water. Members of the Seafarers' and Fishers' Party come down to the quay that day too and share a few drinks with the fishermen. The naval review on the King's birthday is also held outside the harbour, and the fishing boats and yachts dress ship and sound their horns in salute."
    in: div_b3521p
    offset_km: [1.06, -7.12]
    site: {"layout": "port", "size_m": [1400, 600]}
  - id: poi_3y3p1c
    subtype: port
    status: generated
    names: {"zh": "法里援助港", "en": "Fary Aid Port"}
    notes:
      zh: "法里援助港是阿拉齐纳的海上门户，国际援助组织的船只在这里卸下粮食、帐篷和药品，再由白色卡车沿阿拉齐纳公路运往难民营。法里是南部海岸的渔村联合体，独木舟渔民在珊瑚礁外捕鱼，盐田和海藻养殖是新的收入。阿拉齐纳城外的难民营收容了约十六万名南方战争中流离失所的人，援助是邦联经济的重要部分，这座港口就是援助进入邦联的主要入口。\n港口原是一座小渔港，援助组织出资加长了码头，修建了仓库。如今码头的一边停着援助组织的货船和登陆驳船，另一边仍是渔民的独木舟和法里独木舟作坊里新造的小船。卸下的物资先存进港边的仓库，清点后装上车队，送到阿拉齐纳人道援助仓库，再分发到难民营。阿拉齐纳公路有一段要经过齐马罗沃控制的地区，车队出发前要先确认人道主义通道是否畅通，这类通道多经由安巴罗协调。\n码头上的工人大多是难民营的居民，他们按天领取工钱，很多人原本是赶牛的牧民，到了这里才第一次见到大船。工头说，这些人扛起米袋来比谁都卖力，因为他们知道袋子最后会送到谁的手里。"
      en: "The Fary Aid Port is Alatsina's gateway from the sea, where aid agency ships unload food, tents and medicines for the white lorries that carry them up the Alatsina Road to the refugee camp. Fary is a federation of fishing villages on the southern coast, whose outrigger fishermen work beyond the reef, with salt pans and seaweed farming as new sources of income. The camp outside Alatsina shelters some 160,000 people displaced in the Southern War, aid is a major part of the confederation's economy, and this port is the main way it comes in.\nIt was a small fishing harbour until the agencies paid to lengthen its quay and build warehouses. Today aid freighters and landing barges lie along one side of the quay, while the other is still taken by fishermen's canoes and new boats from the Fary Canoe Yard. Goods unloaded here go first into the warehouses by the harbour, are counted and loaded onto convoys, and are taken to the Alatsina Humanitarian Aid Warehouse for distribution in the camp. One stretch of the Alatsina Road passes through areas Tsimarovo controls, so before setting out the convoys must confirm that the humanitarian corridor is open; such corridors are mostly arranged through Ambaro.\nMost of the dockers live in the camp and are paid by the day; many were cattle herders who saw a big ship for the first time here. The foreman says they carry sacks of rice harder than anyone, because they know whose hands the sacks will end up in."
    in: div_xa2n57
    offset_km: [-2.35, -1.83]
    site: {"layout": "port", "size_m": [1400, 600]}
  - id: poi_vw7avh
    subtype: port
    status: generated
    names: {"zh": "安巴罗港", "en": "Port of Ambaro"}
    notes:
      zh: "安巴罗港由国际委员会管理，援助物资、建筑材料和维和部队的补给都在这里卸船。旧海军要塞矗立在港口的岩岬上，如今是国际委员会的总部，要塞的城墙上刻着一行字：「这里曾经储存战争，如今储存和平。」安巴罗曾是联合共和国最重要的海军要塞，控制着东南群岛之间的航道，港内的旧军用码头如今改成了民用泊位，回迁新村的砖瓦和水泥、海水淡化与发电站的设备都是从这里运上岸的。\n安巴罗之围期间，港口被封锁了几个月，岛上断水断粮。安博哈拉和阿瓦拉齐的军队先后包围了要塞，双方都想夺取岛上的军火库，居民和守军饱受饥饿和炮击之苦。最终在萨马伊的调解和国际社会的压力下，交战双方同意撤军，岛上的军火在国际监督下全部销毁。\n如今港口入口立着一座纪念碑，纪念第一艘冲破封锁的运粮船。碑上刻着船的轮廓和卸下第一袋粮食的日子，每年这一天，岛民们会在碑前放上一碗米饭和一杯清水。港口旁的鱼市每天清晨开张，渔民、难民和维和人员在同一排摊位前买鱼，老人们说，围城时谁也想不到，有一天港口会重新飘出烤鱼的味道。"
      en: "The Port of Ambaro is run by the International Commission, and aid, building materials and the peacekeepers' supplies are all landed here. The old naval fortress stands on the rocky headland above the harbour and is now the Commission's headquarters, and a line carved on its walls reads: 'Here war was once stored; now peace is stored here.' Ambaro was the United Republic's most important naval fortress, commanding the sea lanes among the south-eastern islands; the old naval quays have been turned into civilian berths, and the bricks, tiles and cement of the Returnees' Village and the equipment of the desalination and power plant were all landed here.\nDuring the siege of Ambaro it was blockaded for months and the island went without water and food. The armies of Ambohara and Avaratsy in turn besieged the fortress, each wanting the island's arsenal, and islanders and garrison alike suffered hunger and bombardment. In the end, through Samay's mediation and international pressure, the two sides agreed to withdraw, and all the arms on the island were destroyed under international supervision.\nToday a monument at the harbour entrance honours the first grain ship to break the blockade. It bears the outline of the ship and the day the first sack of grain was unloaded, and every year on that day islanders place a bowl of rice and a cup of clear water before it. The fish market beside the port opens every morning, and fishermen, refugees and peacekeepers buy fish at the same row of stalls; the old people say that during the siege no one could have imagined that one day the harbour would smell of grilled fish again."
    in: div_pr4aer
    offset_km: [1.67, 6.70]
    site: {"layout": "port", "size_m": [1400, 600]}

