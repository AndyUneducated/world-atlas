    notes: {"zh": "高原停火线口岸是安博哈拉与阿瓦拉齐之间唯一的通道，设在高原北路被截断的地方，两道铁丝网之间是一片布满地雷的缓冲区。口岸平时关闭，只在每月的固定日子开放，供离散家庭在中立的会面室里团聚几个小时，红十字会的车队也从这里交换战俘遗骸和援助物资。会面室的墙上贴满了寻亲启事。", "en": "The Highland Ceasefire Line Crossing is the only passage between Ambohara and Avaratsy, where the Highland North Road is cut, a mined buffer zone between two wire fences. It is closed most of the time and opens on set days each month, when divided families meet for a few hours in a neutral meeting room and Red Cross convoys exchange the remains of the fallen and aid. The meeting-room walls are covered in notices from people searching for relatives."}
