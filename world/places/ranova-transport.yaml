# Ranova's airports, commercial ports and border crossings. Generated by bld's sibling m89.py;
# offsets are real km from the city's centre. The naval and patrol harbours are in ranova-places.yaml.
places:

  # ── 机场 / Airports ──
  - id: poi_xhyy68
    subtype: airport
    status: generated
    names: {"zh": "安博哈拉国际机场", "en": "Ambohara International Airport"}
    notes:
      zh: "安博哈拉国际机场是拉诺瓦岛最大的机场，建在安博哈拉基督教联邦首都西郊约 6 公里、海拔八百多米的台地上，跑道长三千六百米，场地宽约 1.2 公里。机场有飞往圣约同盟各国和海外的航线，是这座二百九十万人口的首都通往外界的主要门户；从机场进城，沿途可以望见环绕旧城的十二座山丘，大教堂、联邦议会和总统府分踞其中三座山顶。货运区装运高原的咖啡和南部山谷出产的蓝宝石，也卸下海外援助的药品和零件；机场与城中的安博哈拉站之间有班车往来，换乘瓦塔铁路可以下到西北湾的瓦凡博或东海岸的塔马塔。\n航站楼的大厅里立着一座白色的十字架，每天早晨有牧师为旅客祈祷，出国务工的年轻人和出访的代表团常在登机前停下来听上几句。高原战争期间，机场曾多次遭到炮击，跑道旁至今保留着一座加固的掩体；老机务员说，当年炮声一响，地勤人员就把乘客领进掩体里唱赞美诗，等炮击停了再登机。星期日航班很少，机场的商店也全部关门，刚下飞机的外国旅客常常发现连一瓶水都买不到，只好向出租车司机讨。高原上气候凉爽，但雨季午后的雷雨来得又急又猛，航班常要等雷雨过去才能起飞。"
      en: "Ambohara International Airport is the largest on Ranova, on a terrace more than 800 m up some 6 km west of the capital of the Christian Federation of Ambohara, with a 3,600 m runway on a site about 1.2 km wide. It has flights to the Covenant League countries and abroad and is the main gateway to the outside world for a capital of 2.9 million people; on the way into town the twelve hills around the old city come into view, the cathedral, the Federal Parliament and the presidential palace each crowning one of them. The cargo area ships out highland coffee and sapphires from the southern valleys and unloads medicines and spare parts sent as foreign aid, and buses run between the airport and Ambohara Station in the city, where the Vavambo–Tamata Railway goes down to Vavambo on the north-western bay or Tamata on the east coast.\nA white cross stands in the terminal hall, and every morning a chaplain prays with travellers; young people leaving to work abroad and departing delegations often stop to listen for a while before boarding. In the Highland War the airport was shelled several times, and a hardened shelter still stands beside the runway; old ground engineers say that when the guns began, the ground staff would lead passengers into the shelter to sing hymns, boarding once the shelling stopped. On Sundays there are few flights and every shop in the airport is closed, and foreign travellers fresh off the plane often find they cannot even buy a bottle of water and have to ask a taxi driver for one. The highland climate is cool, but afternoon thunderstorms in the rainy season come on fast and hard, and flights often have to wait for them to pass before taking off."
    in: div_qnzksj
    offset_km: [6.00, 0.00]
    site: {"layout": "airport", "size_m": [3600, 1200], "angle_deg": 90}
  - id: poi_dejbg0
    subtype: airport
    status: generated
    names: {"zh": "沃希马希人民机场", "en": "Vohimahy People's Airport"}
    notes:
      zh: "沃希马希人民机场是阿瓦拉齐唯一的国际机场，航站楼是一座有着红星和巨幅宣传画的混凝土建筑，每周只有几个航班飞往马索沃利和海外的友好国家。宣传画上画着赤卫队员、集体农庄的农民和造船厂的工人，下面写着「北方永远坚强」之类的口号。一条近六公里的沃希马希人民机场公路把机场和首都连在一起，进城后就是笔直的革命大街。\n外国旅客下飞机后要先在专门的柜台登记，由导游陪同才能进城。登记时要交出护照复印件，填写在国内的行程，相机里的照片偶尔会被抽查。阿瓦拉齐是世俗协约的盟主，与贝洛瓦、瓦罗纳、萨马伊等资本主义国家维持务实合作；近年政府开放了沿海经济区，允许外资进入，来考察的外国商人渐渐多了起来，机场专门为他们开辟了一间带空调的休息室。\n机场的另一半由空军使用，跑道尽头停着成排的战斗机，旁边就是沃希马希空军基地。民航飞机降落时，旅客被要求拉下遮光板，不许拍摄军用的一侧。去马索沃利的人其实更常坐兄弟铁路，乘客须持两国签发的通行证，机场的航班多半留给官员和外国人。航站楼里的小卖部只收本国货币，外国旅客常常要找导游帮忙才能买到一瓶汽水。"
      en: "Vohimahy People's Airport is Avaratsy's only international airport, its terminal a concrete building with a red star and huge propaganda murals, and only a few flights a week go to Masovoly and friendly countries abroad. The murals show Red Guards, collective farmers and shipyard workers above slogans such as 'The North Stands Strong For Ever'. The Vohimahy People's Airport Road, nearly six kilometres long, links the airport with the capital, joining the dead-straight Revolution Avenue as it enters town.\nForeign travellers must register at a special desk on arrival and may enter the city only with a guide. They hand over a copy of their passport and fill in their itinerary in the country, and the pictures on their cameras are occasionally checked. Avaratsy leads the Secular Accord and keeps up practical co-operation with capitalist countries such as Belova, Varona and Samay; since the government opened the coastal economic zones to foreign investment, more foreign businessmen have come to look around, and the airport has opened an air-conditioned lounge especially for them.\nThe other half of the airport belongs to the air force, and rows of fighters stand at the end of the runway beside the Vohimahy Air Base. When airliners land passengers are told to pull down their window blinds and must not photograph the military side. People going to Masovoly in fact more often take the Fraternity Railway, for which passengers need passes issued by both countries, and the flights are mostly left to officials and foreigners. The kiosk in the terminal takes only the national currency, so foreign travellers often need their guide's help to buy a bottle of soda."
    in: div_89czvj
    offset_km: [-5.88, 1.17]
    site: {"layout": "airport", "size_m": [3200, 1100], "angle_deg": 79}
  - id: poi_3af52y
    subtype: airport
    status: generated
    names: {"zh": "安德里安巴国际机场", "en": "Andriamba International Airport"}
    notes:
      zh: "安德里安巴国际机场是马索沃利唯一的民用机场，在首都东郊约二十公里的平地上，有一条三千六百米的跑道和一座灰色的混凝土航站楼，航站楼正面挂着创始领袖和历代领袖的巨幅画像。每周只有寥寥几个航班，大多飞往阿瓦拉齐的沃希马希和海外几个友好国家，机队只有几架从联合共和国时期留下来的旧客机。外国旅客下飞机后要交出手机登记，由国家导游陪同乘车进城；本国公民出国要有劳动党组织部门的批准，候机楼里多是出差的干部和代表团。机场由人民军空军代管，跑道另一侧停着几架军用运输机。"
      en: "Andriamba International Airport is Masovoly's only civil airport, on flat ground some twenty kilometres east of the capital, with a 3,600 m runway and a grey concrete terminal whose front is hung with huge portraits of the founding leader and his successors. Only a handful of flights a week leave it, most of them to Vohimahy in Avaratsy and a few friendly countries overseas, flown by a fleet of a few old airliners left from the United Republic. Foreign passengers hand in their phones to be registered on arrival and are driven into town with a state guide; citizens need the approval of the Workers' Party's organisation department to travel abroad, and most of the people in the departure hall are cadres and delegations on official business. The People's Army Air Force runs the airport, and a few military transports stand on the far side of the runway."
    in: div_gt2h78
    at: [449.80, 548.80]
    site: {"layout": "airport", "size_m": [3600, 1100], "angle_deg": 70, "rural": true}
  - id: poi_0gwen7
    subtype: airport
    status: generated
    names: {"zh": "萨希勒国际机场", "en": "Sahil International Airport"}
    notes:
      zh: "萨希勒国际机场位于萨希利亚首都北面的海边平原上，是西海岸最繁忙的机场，有飞往圣约同盟各国和海外的航线，每年朝觐季节还有包机直飞海外的圣地。萨希勒是全岛最古老的贸易港，萨希利亚是圣约同盟中唯一的伊斯兰国家，机场的航线也照这个格局排开：安博哈拉、努西拉和米拉卡的航班最密，商务旅客和劳工、学生各占一半。\n航站楼的屋顶模仿传统的阿拉伯式拱顶，一排白色的穹顶在海边平原上远远就能望见，候机厅里设有男女分开的祈祷室，到了礼拜时间，广播里会提醒旅客。西岸战争爆发后，机场的安检十分严格，进入航站楼前要经过两道检查，旁边的萨希勒空军基地也时常有战机起降，民航飞机要为它们让出跑道。\n从这里起飞的航班能看到萨希勒老城的白色清真寺和港口，单桅帆船和集装箱船并排停泊在海湾里。朝觐季节是机场一年中最热闹的时候，送行的家人挤满了出发大厅，给朝觐者带上椰枣和丁香糕；朝觐者归来时，全村的人包车来接，大厅里欢呼声和宣礼声连成一片。斋月的晚上，航站楼的餐厅也会摆出长桌，让候机的旅客一起开斋。"
      en: "Sahil International Airport lies on the coastal plain north of Sahiliya's capital and is the busiest on the west coast, with flights to the Covenant League countries and abroad and, every pilgrimage season, charters straight to the holy places overseas. Sahil is the oldest trading port on the island and Sahiliya the only Islamic country in the Covenant League, and the airport's routes follow that pattern: flights to Ambohara, Nusira and Miraka are the most frequent, and business travellers make up half the passengers, migrant workers and students the other half.\nThe terminal roof imitates traditional Arab vaults, a row of white domes visible from far across the coastal plain, and the departure hall has separate prayer rooms for men and women, with announcements reminding passengers when it is time to pray. Since the West Coast War broke out security has been tight, with two checks before the terminal doors, and fighters from the neighbouring Sahil Air Base take off and land often, airliners giving way to them on the runway.\nFlights taking off here look down on the white mosques of Sahil's old town and the harbour, where dhows and container ships lie side by side in the bay. The pilgrimage season is the airport's busiest time of year: families crowd the departures hall to see their pilgrims off with dates and clove cakes, and when the pilgrims return whole villages hire buses to meet them, filling the hall with cheers and the call to prayer. On Ramadan evenings the terminal restaurants set out long tables so that waiting passengers can break the fast together."
    in: div_f9gjbe
    offset_km: [4.57, -3.06]
    site: {"layout": "airport", "size_m": [3400, 1200], "angle_deg": 56}
  - id: poi_n4adv8
    subtype: airport
    status: generated
    names: {"zh": "齐马罗沃中央机场", "en": "Tsimarovo Central Airport"}
    notes:
      zh: "齐马罗沃中央机场是军民合用的机场，位于首都齐马罗沃所在的伊拉希河上游盆地里，航站楼是一座灰色的方形建筑，正面挂着巨幅的领袖画像。从机场进城的大道两旁插满运动的旗帜，尽头就是新古典风格的国民大厅和领袖府。民航航班很少，主要飞往祖源轴心的盟国，其中飞往梅纳瓦利的航班最多；周边国家和国际组织普遍对齐马罗沃实施武器禁运，许多航空公司也不愿在这里降落。\n跑道的另一侧是空军的加固机库，属于齐马罗沃空军基地，南方战争打了三十多年，战机至今仍从这里起飞前往南方前线。民航旅客在候机厅里能听到战机起飞的轰鸣，但窗户都贴着磨砂膜，看不见跑道的那一边。\n外国记者在这里入境时，相机和电脑都要接受检查，部分照片会被当场删除，采访须由官方陪同人员全程跟随。本国旅客出境要接受另一种检查：国家按「血统证书」把居民分成等级，流亡者说，出境柜台的官员会先看证书上的等级，再决定是否放行。三十多年来，二十多万人逃离这个国家，其中只有极少数是从这座机场离开的，大多数人是徒步越过边境的。"
      en: "Tsimarovo Central Airport is shared by civil and military flights, in the basin of the upper Ilahy where the capital, Tsimarovo, stands; its terminal is a grey square building with a huge portrait of the Leader across its front. The road into town is lined with the movement's flags and ends at the neoclassical Hall of the Nation and the Leader's Residence. Civil flights are few and go mostly to the Origin Axis allies, most often to Menavaly; neighbouring countries and international bodies generally impose an arms embargo on Tsimarovo, and many airlines are unwilling to land here.\nOn the far side of the runway are the air force's hardened shelters, part of the Tsimarovo Air Base; the Southern War has gone on for more than thirty years, and fighters still take off from here for the southern front. Passengers in the departure hall can hear the roar of fighters taking off, but the windows are covered with frosted film and the far side of the runway cannot be seen.\nForeign journalists entering here have their cameras and computers searched, some photographs are deleted on the spot, and interviews must be accompanied throughout by official minders. Citizens leaving face a different check: the state divides residents into grades by 'blood certificate', and exiles say the officers at the departure desk look first at the grade on the certificate before deciding whether to let a traveller through. Over more than thirty years upwards of 200,000 people have fled the country; very few of them left through this airport, and most crossed the border on foot."
    in: div_j0txx6
    offset_km: [5.08, -2.10]
    site: {"layout": "airport", "size_m": [3400, 1200], "angle_deg": 68}
  - id: poi_7ta122
    subtype: airport
    status: generated
    names: {"zh": "贝洛瓦国际机场", "en": "Belova International Airport"}
    notes:
      zh: "贝洛瓦国际机场是拉诺瓦岛最现代化的机场，玻璃航站楼里有免税店、银行和商务中心，航班飞往岛上各国和环太平洋的大城市，敌对阵营的商人常在同一个候机厅里等待登机。贝洛瓦是全岛最大的金融中心，奉行自由市场、低税率和对外开放的政策，机场的设计也处处体现这一点：入境手续简便，航站楼里的指示牌用好几种语言写成，商务旅客下了飞机就能在楼里的银行开户。\n机场旁边是科技园和物流园，软件公司和航运公司的员工每天在这里往返，港口进出口的高价货物也常从这里空运。从机场进城，可以接上贝安高速铁路，以时速 400 公里往返于首都和内陆的安博塔之间，二十分钟就到。每年十二月的贝洛瓦海湾节期间，从全岛各地飞来看帆船赛和烟花的游客挤满了到达大厅。\n贝洛瓦人常说，这座机场是贝洛瓦「对全世界开放」的象征。候机厅里，圣约同盟的商人和世俗协约的银行家隔着一张咖啡桌坐着，祖源轴心的乘客有时也在其中；南面梅纳瓦利的反对派流亡者从这里出入，北面西岸战争的消息也常常最先在这里的电视屏幕上滚动播出。机场的保安说，他们最大的本事，就是让互相敌视的人安安静静地排在同一条队里。"
      en: "Belova International Airport is the most modern on Ranova, a glass terminal with duty-free shops, banks and a business centre and flights to every country on the island and the great cities of the Pacific Rim; traders from hostile blocs often wait in the same departure lounge. Belova is the island's largest financial centre and follows a policy of free markets, low taxes and openness, and the airport shows it at every turn: entry formalities are simple, signs in the terminal are in several languages, and business travellers can open an account at a bank in the building as soon as they land.\nA technology park and a logistics park stand beside it, staff of software and shipping firms come and go every day, and high-value goods passing through the port often travel on by air from here. From the airport travellers can connect to the Belova–Ambota High-Speed Railway, which runs between the capital and Ambota inland at 400 km/h in twenty minutes. During the Belova Bay Festival every December the arrivals hall is packed with visitors flying in from all over the island for the regatta and the fireworks.\nBelova people like to say the airport is the symbol of a Belova 'open to the whole world'. In the lounge Covenant League traders and Secular Accord bankers sit across a coffee table from each other, sometimes with passengers from the Origin Axis among them; opposition exiles from Menavaly to the south come and go through here, and news of the West Coast War to the north often scrolls first across the screens here. The airport's security staff say their greatest skill is getting people who hate each other to stand quietly in the same queue."
    in: div_xfvevz
    offset_km: [2.30, 5.54]
    site: {"layout": "airport", "size_m": [3400, 1200], "angle_deg": 158}
  - id: poi_r8syvv
    subtype: airport
    status: generated
    names: {"zh": "梅纳瓦利机场", "en": "Menavaly Airport"}
    notes:
      zh: "梅纳瓦利机场位于城东的稀树草原上，航班飞往萨希勒、贝洛瓦和齐马罗沃，也有私人飞机把金矿的金条运往海外。梅纳瓦利国家拯救共和国由军政府统治，紧急状态从未解除，军官集团控制着金矿和港口的收入，普通人的生活十分贫困。运送金条的私人飞机起降时，跑道边会停上几辆装甲车，连地勤人员都要回避。\n机场由军方管理，航站楼门口有士兵站岗，跑道的一端是空军的直升机停机坪。首都实行宵禁，夜里的航班乘客要持特别通行证才能离开机场进城。飞往齐马罗沃的航班多半载着军官和官员，梅纳瓦利与齐马罗沃结盟加入祖源轴心，因此遭到多国制裁；飞往贝洛瓦的航班上却常有反对派人士和他们的家人，许多反对派领袖被软禁或流亡贝洛瓦，有人说，这条航线是梅纳瓦利最常见的流亡之路。\n旱季时，跑道上常有瘤牛闯入，地勤人员要开车把它们赶走。草原上的牛群是传统的财富，牧民们并不在意机场的围栏，围栏一破，牛就顺着缺口走上平坦的跑道晒太阳。梅纳瓦利人常说「在这里，草原属于牛，海岸属于渔民，国家属于将军」，机场的地勤人员则补充说：跑道属于牛和将军，看谁先到。"
      en: "Menavaly Airport lies on the savanna east of the city, with flights to Sahil, Belova and Tsimarovo and private aircraft flying gold bars from the mines abroad. The Salvation Republic of Menavaly is ruled by a junta, its state of emergency has never been lifted, and the officer corps controls the revenues of the gold mines and the port while ordinary people live in deep poverty. When the private aircraft carrying gold take off or land, a few armoured cars park beside the runway and even the ground crew keep away.\nThe army runs it, soldiers stand guard at the terminal doors, and one end of the runway is the air force's helicopter pad. The capital is under curfew, and passengers on night flights need a special pass to leave the airport for town. Flights to Tsimarovo mostly carry officers and officials, for Menavaly joined the Origin Axis in alliance with Tsimarovo and is under sanctions from many countries for it; flights to Belova, by contrast, often carry opposition figures and their families, since many opposition leaders are under house arrest or in exile in Belova, and some call the route Menavaly's commonest road into exile.\nIn the dry season zebu often wander onto the runway, and the ground crew drive out to chase them off. Cattle are the traditional wealth of the grasslands, the herders pay little heed to the airport fence, and wherever it breaks the cattle walk through the gap to bask on the smooth runway. Menavaly people say 'here the grassland belongs to the cattle, the coast to the fishermen and the country to the generals', and the ground crew add that the runway belongs to the cattle and the generals, whoever gets there first."
    in: div_8p600p
    offset_km: [-3.89, -3.89]
    site: {"layout": "airport", "size_m": [3000, 1000], "angle_deg": 135}
