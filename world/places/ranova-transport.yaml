    notes: {"zh": "安博哈拉国际机场是拉诺瓦岛最大的机场，建在首都西郊海拔八百多米的台地上，跑道长三千六百米，有飞往圣约同盟各国和海外的航线。航站楼的大厅里立着一座白色的十字架，每天早晨有牧师为旅客祈祷。高原战争期间，机场曾多次遭到炮击，跑道旁至今保留着一座加固的掩体。星期日航班很少，机场的商店也全部关门。", "en": "Ambohara International Airport is the largest on Ranova, on a terrace some 800 m up west of the capital, with a 3,600 m runway and flights to the Covenant League countries and abroad. A white cross stands in the terminal hall, and every morning a chaplain prays with travellers. In the Highland War the airport was shelled several times, and a hardened shelter still stands beside the runway. On Sundays there are few flights and every shop in the airport is closed."}
