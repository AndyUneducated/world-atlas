    notes: {"zh": "伊特拉口岸是阿拉齐纳与齐马罗沃之间阿拉齐纳公路上的口岸，南方战争期间，成千上万的难民从这里逃进阿拉齐纳。如今口岸大部分时间关闭，齐马罗沃一侧立着高大的哨塔，阿拉齐纳一侧则是援助组织的接待帐篷，偶尔有冒险越境的人在这里登记。", "en": "The Itra Crossing is on the Alatsina Road between Alatsina and Tsimarovo; in the Southern War tens of thousands of refugees fled through it into Alatsina. Today it is closed most of the time: tall watchtowers stand on the Tsimarovo side, and on the Alatsina side an aid agency's reception tent, where now and then someone who has risked the crossing is registered."}
