      zh: 长夏群岛领地政务院民政部，位于湖光大道北段西侧、长夏大街路口北面，负责社会组织、社会救助和行政区划。部内设政策司、社会组织司、社会救助司、慈善事业司、其他社会事务司和行政区划司。行政区划司管理 12 个市、64 个区的设立、调整和命名，公社、国家公园管理区和军事管理区三种特殊区划也由它审定；领地的地名都取自伊武兰语，中文按读音音译，英文直接用伊武兰语拼写。领地信仰多元，社会组织司登记寺庙、教会和各种协会，其他社会事务司负责婚姻登记、殡葬和退役军人安置，一年里众多节庆假日的安排也由民政部提出。
      en: The Ministry of Civil Affairs, at the north end of Lakelight Avenue on the west side, just north of the Everlong Summer Boulevard junction, deals with civil society, social assistance and the territory's administrative divisions. Its departments are Policy, Social Organisations, Social Assistance, Charities, Other Social Affairs and Administrative Divisions. Administrative Divisions sets up, adjusts and names the 12 cities and 64 districts, including the three special kinds, the commune, the national park area and the military zone. Every place name comes from Ivuran, transliterated by sound in Chinese and spelt in Ivuran in English. Faith in the territory is varied, and Social Organisations registers temples, churches and associations of every kind; Other Social Affairs handles marriage registration, funerals and the resettlement of veterans, and the ministry proposes the calendar of the territory's many festival holidays.
    in: div_z0z4vz
