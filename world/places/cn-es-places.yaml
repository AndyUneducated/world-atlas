      en: Ministry of Natural Resources and Environmental Protection, Everlong Summer Islands Executive Council
    short_names:
      zh: 自然资源和环境保护部
      en: Ministry of Natural Resources and Environmental Protection
    notes:
      zh: 长夏群岛领地政务院自然资源和环境保护部，位于湖光大道南段西侧，负责土地、森林、河湖和海洋的保护与利用。部内设政策司、自然生态保护司、大陆生态环境司、水生态环境司、海洋生态环境司、大气环境司、土壤生态环境司、固体废物和化学品司、环境影响评价和排放管理司、生态环境监测司和生态环境执法署。领地的土地全部公有，由它代表领地长期出租；洛米哈努国家公园的热带雨林、马拉坎的珊瑚礁和三角洲的红树林都在它的保护名录上，领地也不许新开油棕种植园。乌诺维拉矿区必须边采边复绿、尾矿回填，生态环境执法署每月派员检查。
      en: The Ministry of Natural Resources and Environmental Protection, at the south end of Lakelight Avenue on the west side, protects and manages the territory's land, forests, rivers, lakes and seas. Its departments are Policy, Nature Conservation, Land Ecology, Freshwater Ecology, Marine Ecology, Air Quality, Soil Ecology, Solid Waste and Chemicals, Environmental Impact and Emissions, and Environmental Monitoring, with an Environmental Enforcement Agency. All land in the territory is public, and the ministry leases it out on the territory's behalf. The rainforest of Lomihanu National Park, the coral reefs of Malakan and the delta mangroves are on its protected lists, and no new oil palm plantations are allowed. The Unovila mines must replant as they dig and backfill their tailings, and the Enforcement Agency inspects them every month.
    in: div_z0z4vz
