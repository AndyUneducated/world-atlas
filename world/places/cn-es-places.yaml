  # ── 长夏群岛领地政务院机构（M45）：米雷兰帕萨卢区湖光大道两侧，北段是对外、财政、司法、治安、民政、建设和中央派驻机构，南段是教科文、交通、卫生、劳社、自然资源及单独建楼的五个司，政策和计划委员会在公民广场东侧 ──
  - id: bld_jj116n
    subtype: government
    status: generated
    names:
      zh: 长夏群岛领地政务院对外事务部
      en: Ministry of External Affairs, Everlong Summer Islands Executive Council
    short_names:
      zh: 对外事务部
      en: Ministry of External Affairs
    notes:
      zh: 长夏群岛领地政务院对外事务部，位于首府米雷兰湖光大道北段西侧，紧邻政务院主楼，负责领地的对外交往和与中央政府的联络。部内设政策司、中央政府联络司、外国使领馆司、礼宾司、国际交流司和领事服务司。领地一半居民是来自中国其他省份和世界各地的移民，外国驻领地的领事馆和商务代表处大多设在萨伦纳姆，由外国使领馆司对口联系；礼宾司在公民广场筹办国宾欢迎仪式，国际交流司组织热带医学、海洋科学和热带农业方面的国际合作，领事服务司用中文、英文和伊武兰语为外国居民办理证明和认证。大楼为 L 形，临街一面是遮阳的长廊。
      en: The Ministry of External Affairs stands at the north end of Lakelight Avenue in Mirelan, on the west side next to the Government building, and handles the territory's dealings abroad and its liaison with the central government. Its departments are Policy, Central Government Liaison, Foreign Missions, Protocol, International Exchange and Consular Services. Half of the territory's people came from other provinces of China or from abroad, and most foreign consulates and trade offices are in Sarunnam, where the Foreign Missions Department keeps in touch with them. Protocol stages state welcomes on Civic Square, International Exchange arranges cooperation in tropical medicine, ocean science and tropical farming, and Consular Services certifies documents for foreign residents in Chinese, English and Ivuran. The L-shaped building has a shaded colonnade along the avenue.
    in: div_z0z4vz
    offset_km: [-0.36, 0.54]
    site: { size_m: [140, 110], layout: lshape }
  - id: bld_jfg4ek
    subtype: government
    status: generated
    names:
      zh: 长夏群岛领地政务院财政部
      en: Ministry of Finance, Everlong Summer Islands Executive Council
    short_names:
      zh: 财政部
      en: Ministry of Finance
    notes:
      zh: 长夏群岛领地政务院财政部，与对外事务部隔湖光大道相对，管理领地的税收、预算和财政监督。部内设税收司、关税司、监管司、行政部门预算司、企业事业单位预算司和中央财政事务司。领地实行高税收、高福利：个人所得税、社会保险和消费税的税率都较高，公有土地长期出租的租金也是一大笔收入，这些钱支撑着免费到大学的教育、全民医保和按月发放的全民基本收入。埃武托拉公社自定税率，中央财政事务司与公社委员会按协议结算外交、国防等由政务院承担的开支。大楼为长条形板楼，地下是领地的财政档案库。
      en: "The Ministry of Finance faces the Ministry of External Affairs across Lakelight Avenue and runs the territory's taxes, budgets and financial oversight through its departments of Taxation, Customs Tariffs, Supervision, Executive Budgets, Public Enterprise and Institution Budgets, and Central Finance. The territory taxes heavily and spends generously: income tax, social insurance and consumption tax are all set high, and the rents from public land, which is leased rather than sold, bring in a great deal more. Together they pay for free education up to university, universal health cover and the monthly universal basic income. The Evutola Commune sets its own taxes, and Central Finance settles with the commune council by agreement for the foreign affairs, defence and other services the Executive Council provides. The building is a long slab with the territory's financial archive underground."
    in: div_z0z4vz
    offset_km: [0.02, 0.65]
    site: { size_m: [150, 80], layout: slab }
  - id: bld_ffpdcg
    subtype: government
    status: generated
    names:
      zh: 长夏群岛领地政务院司法部
      en: Ministry of Justice, Everlong Summer Islands Executive Council
    short_names:
      zh: 司法部
      en: Ministry of Justice
    notes:
      zh: 长夏群岛领地政务院司法部，位于湖光大道北段西侧，负责领地法规的起草和实施、检察事务和司法行政。部内设国家法律实施司、领地法规司、法律法规起草和规范司、检察事务司、司法监察司、拘留管理司、社区矫正管理司、司法从业人员司和司法研究司。领地法规以中文、英文和伊武兰语三种文本同时公布，起草和规范司负责三种文本的一致；领地对环境、劳动和食品安全的监管十分严格，检察事务司为此设有专门办理监管案件的检察处。领地的犯罪率很低，社区矫正管理司让大多数轻罪者留在社区里接受矫正和职业培训。大楼为 L 形，内院旁是法律图书馆。
      en: "The Ministry of Justice, at the north end of Lakelight Avenue on the west side, drafts and applies the territory's laws and runs prosecutions and the administration of justice. It has nine departments: National Law Enforcement, Territorial Regulations, Legislative Drafting and Standards, Prosecutions, Judicial Inspection, Detention, Community Corrections, Legal Professions and Legal Research. Territorial laws are published at once in Chinese, English and Ivuran, and the drafting department keeps the three texts in step. Because the territory regulates the environment, working conditions and food safety so strictly, Prosecutions has an office of its own for regulatory cases. Crime is rare, and Community Corrections lets most minor offenders stay in their communities under supervision and job training. The L-shaped building has a law library beside its inner yard."
    in: div_z0z4vz
    offset_km: [-0.31, 0.37]
    site: { size_m: [140, 110], layout: lshape }
  - id: bld_8wmf0n
    subtype: government
    status: generated
    names:
      zh: 长夏群岛领地政务院公共安全部
      en: Ministry of Public Security, Everlong Summer Islands Executive Council
    short_names:
      zh: 公共安全部
      en: Ministry of Public Security
    notes:
      zh: 长夏群岛领地政务院公共安全部，位于湖光大道北段东侧，统一领导全领地的警务和治安。部内设警察司、警务司、边境服务和安全司、刑事侦查司、民事侦查司、经济犯罪调查司、社区安全司和技术和装备司。边境服务和安全司在瓦利凯、萨伦纳姆和塔卢马兰的港口和各国际机场设口岸检查站，打击走私和偷渡；社区安全司在各市推行社区警务，雨季还负责洪水和山体滑坡的应急救援；技术和装备司为高速公路警察配备在不限速路段使用的巡逻车和直升机。大楼底层是全领地的报警指挥中心，接警员能用中文、英文和伊武兰语应答。
      en: The Ministry of Public Security, at the north end of Lakelight Avenue on the east side, directs policing and public order across the territory. Its departments are Police, Policing Operations, Border Services and Security, Criminal Investigation, Civil Investigation, Economic Crime, Community Safety, and Technology and Equipment. Border Services and Security runs the checkpoints at the ports of Vallikkai, Sarunnam and Talumaran and at the international airports, working against smuggling and illegal entry; Community Safety runs neighbourhood policing in every city and, in the rainy season, rescue after floods and landslides; and Technology and Equipment supplies the expressway police with the patrol cars and helicopters they use on the unrestricted stretches. The territory's emergency call and dispatch centre is on the ground floor, where call-takers answer in Chinese, English or Ivuran.
    in: div_z0z4vz
    offset_km: [0.07, 0.48]
    site: { size_m: [150, 80], layout: slab }
  - id: bld_4rwddb
    subtype: government
    status: generated
    names:
      zh: 长夏群岛领地政务院民政部
      en: Ministry of Civil Affairs, Everlong Summer Islands Executive Council
    short_names:
      zh: 民政部
      en: Ministry of Civil Affairs
    notes:
      zh: 长夏群岛领地政务院民政部，位于湖光大道北段西侧、长夏大街路口北面，负责社会组织、社会救助和行政区划。部内设政策司、社会组织司、社会救助司、慈善事业司、其他社会事务司和行政区划司。行政区划司管理 12 个市、64 个区的设立、调整和命名，公社、国家公园管理区和军事管理区三种特殊区划也由它审定；领地的地名都取自伊武兰语，中文按读音音译，英文直接用伊武兰语拼写。领地信仰多元，社会组织司登记寺庙、教会和各种协会，其他社会事务司负责婚姻登记、殡葬和退役军人安置，一年里众多节庆假日的安排也由民政部提出。
      en: The Ministry of Civil Affairs, at the north end of Lakelight Avenue on the west side, just north of the Everlong Summer Boulevard junction, deals with civil society, social assistance and the territory's administrative divisions. Its departments are Policy, Social Organisations, Social Assistance, Charities, Other Social Affairs and Administrative Divisions. Administrative Divisions sets up, adjusts and names the 12 cities and 64 districts, including the three special kinds, the commune, the national park area and the military zone. Every place name comes from Ivuran, transliterated by sound in Chinese and spelt in Ivuran in English. Faith in the territory is varied, and Social Organisations registers temples, churches and associations of every kind; Other Social Affairs handles marriage registration, funerals and the resettlement of veterans, and the ministry proposes the calendar of the territory's many festival holidays.
    in: div_z0z4vz
    offset_km: [-0.26, 0.19]
    site: { size_m: [130, 80], layout: slab }
  - id: bld_jxj6k0
    subtype: government
    status: generated
    names:
      zh: 长夏群岛领地政务院建设部
      en: Ministry of Construction, Everlong Summer Islands Executive Council
    short_names:
      zh: 建设部
      en: Ministry of Construction
    notes:
      zh: 长夏群岛领地政务院建设部，位于湖光大道北段东侧，负责城乡规划、住房和建筑市场。部内设政策司、住房保障司、房地产市场监管司、建筑市场监管司、城市建设司和乡镇建设司。首府米雷兰是按它审定的规划在高原上全新建设的，湖光大道这条轴线就是规划的骨架。领地的土地公有，住宅和厂房用地长期租用，房地产市场监管司管理住房的转租和租金，不许炒卖；住房保障司为各市建设公共租赁住房，租金按收入确定；建筑市场监管司制定适应湿热气候和雨季暴雨的建筑规范，要求新建筑带遮阳长廊和屋顶花园。
      en: The Ministry of Construction, at the north end of Lakelight Avenue on the east side, is in charge of town and country planning, housing and the building trade. Its departments are Policy, Housing Support, Property Market Supervision, Building Market Supervision, Urban Development and Rural Development. Mirelan was built from scratch on the plateau to a plan it approved, and Lakelight Avenue is the backbone of that plan. Land in the territory is public and leased for homes and factories; Property Market Supervision oversees subletting and rents and forbids speculation, Housing Support builds public rental housing in every city with rents set by income, and Building Market Supervision writes the codes for a hot, humid climate and monsoon downpours, which require new buildings to have shaded colonnades and roof gardens.
    in: div_z0z4vz
    offset_km: [0.12, 0.31]
    site: { size_m: [140, 110], layout: lshape }
  - id: bld_y4r854
    subtype: government
    status: generated
    names:
      zh: 长夏群岛领地政务院教育、科学和文化部
      en: Ministry of Education, Science and Culture, Everlong Summer Islands Executive Council
    short_names:
      zh: 教育、科学和文化部
      en: Ministry of Education, Science and Culture
    notes:
      zh: 长夏群岛领地政务院教育、科学和文化部，位于湖光大道南段西侧、公民广场南面，管理从学前教育到大学的各级教育、领地的科学政策和文化事业。部内设教育政策司、科学政策司、文化政策司、教育技术司、信息技术司、教育从业人员司、科技从业人员司、文化从业人员司、学前教育司、基础教育司、成人和职业教育司、高等教育司和教育督导署。领地的教育从幼儿园到大学全部免费，学校用中文、英文和伊武兰语三种语言教学，长夏群岛大学和基拉努理工大学都由它管理。萨伦纳姆的旧王城和伊什万塔寺庙群由文化政策司负责保护，公民广场旁的领地图书馆也归它管理。
      en: The Ministry of Education, Science and Culture, at the south end of Lakelight Avenue on the west side, just south of Civic Square, covers education from nursery to university, the territory's science policy and its cultural life. Its thirteen units are the Education Policy, Science Policy, Cultural Policy, Educational Technology, Information Technology, Teaching Professions, Science and Technology Professions, Cultural Professions, Pre-school, Basic Education, Adult and Vocational Education and Higher Education departments and the Education Inspectorate. Education is free from kindergarten to university, schools teach in Chinese, English and Ivuran, and the University of the Everlong Summer Islands and Kilanu University of Technology both come under it. The Cultural Policy Department looks after the old royal city of Sarunnam and the Ishvanta temples, and the Territorial Library on Civic Square is also in its care.
