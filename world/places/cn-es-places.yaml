      en: The Food Supervision Department of the Ministry of Health and Human Services has its own building behind the ministry and is the part of the territory's strict regulation that residents meet most often. It tests the territory's rice, spices, fruit and seafood, monitors the water where pearl oysters, fish and prawns are farmed, and spot-checks exported pepper, cardamom and tropical fruit for pesticide residues. The thousand boat stalls of the Sarunnam water market and every night market and food stall in the territory display its hygiene grade, which is rechecked every quarter. Its tropical food laboratory watches especially for mould toxins and for bacteria in seafood during the rainy season.
