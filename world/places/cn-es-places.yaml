    names:
      zh: 瓦希拉岛屿机场
      en: Vahira Island Airfield
      art-x-ivuran: Vahira Ulavan
    notes:
      zh: 瓦希拉岛屿机场在瓦希拉岛南部，是海军航空兵的岛屿机场。岛上地方有限，跑道不长，舰载战斗机靠埋在跑道起点的电磁弹射器起飞，降落时用拦阻索，和在航空母舰上起降的方式一样，飞行员在这里就能完成上舰前的全部训练。跑道旁的加固机库停放战斗机、预警机和无人僚机，无人僚机与有人驾驶的战斗机混合编队，在群岛外围巡逻。机场与卡朗加空军基地互为备降场，热带雷雨天里两边的塔台随时互通天气。
      en: Vahira Island Airfield, in the south of Vahira Island, is the naval air arm's island airfield. Space on the island is tight and the runway is short, so carrier fighters are launched by electromagnetic catapults set into the start of the runway and land on arrester wires, just as on an aircraft carrier, and pilots can complete all their carrier training here. Hardened shelters beside the runway hold fighters, early-warning aircraft and unmanned wingmen, which fly mixed patrols with piloted fighters around the islands. The airfield and Karanga Air Base are each other's diversion fields, and in tropical storms their towers keep each other informed of the weather.
