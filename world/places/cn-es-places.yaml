    notes:
      zh: 长夏群岛领地政务院教育、科学和文化部，位于湖光大道南段西侧、公民广场南面，管理从学前教育到大学的各级教育、领地的科学政策和文化事业。部内设教育政策司、科学政策司、文化政策司、教育技术司、信息技术司、教育从业人员司、科技从业人员司、文化从业人员司、学前教育司、基础教育司、成人和职业教育司、高等教育司和教育督导署。领地的教育从幼儿园到大学全部免费，学校用中文、英文和伊武兰语三种语言教学，长夏群岛大学和基拉努理工大学都由它管理。萨伦纳姆的旧王城和伊什万塔寺庙群由文化政策司负责保护，公民广场旁的领地图书馆也归它管理。
      en: The Ministry of Education, Science and Culture, at the south end of Lakelight Avenue on the west side, just south of Civic Square, covers education from nursery to university, the territory's science policy and its cultural life. Its thirteen units are the Education Policy, Science Policy, Cultural Policy, Educational Technology, Information Technology, Teaching Professions, Science and Technology Professions, Cultural Professions, Pre-school, Basic Education, Adult and Vocational Education and Higher Education departments and the Education Inspectorate. Education is free from kindergarten to university, schools teach in Chinese, English and Ivuran, and the University of the Everlong Summer Islands and Kilanu University of Technology both come under it. The Cultural Policy Department looks after the old royal city of Sarunnam and the Ishvanta temples, and the Territorial Library on Civic Square is also in its care.
    in: div_z0z4vz
