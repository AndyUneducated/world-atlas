      zh: 塔鲁卡潜艇洞库开凿在塔鲁卡岛的山体里，洞口开在岛北的深水海湾，潜艇可以在水下直接驶入山体，十二个泊位、维修船坞和弹药库都在岩层之下。岛周围的海水很深，潜艇出港后不久就能潜入深海，从空中和卫星上都很难看到它们的进出。洞库内有独立的电源、通风和淡水系统，艇员在里面换班休整；大型无人潜航器也在这里维护和充电。
      en: Taruka Submarine Pens are cut into the hills of Taruka Island, with their entrance in a deep bay on the north shore, so that submarines sail into the mountain submerged; the twelve berths, repair docks and magazines all lie under the rock. The water around the island is very deep, so submarines can dive into deep water soon after leaving and are hard to see coming and going from the air or from satellites. The pens have their own power, ventilation and fresh water, crews rest and change shifts inside, and large unmanned submarines are serviced and charged here too.
    in: div_ykkw7q
