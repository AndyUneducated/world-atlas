  - id: poi_gb80dh
    subtype: naval_base
    status: generated
    names:
      zh: 塔鲁卡潜艇洞库
      en: Taruka Submarine Pens
      art-x-ivuran: Taruka Kesutalusam
    wonder:
      zh: 世界最大的潜艇洞库，可同时停靠十二艘潜艇
      en: The largest submarine pens in the world, berthing twelve submarines at once
    notes:
      zh: "塔鲁卡潜艇洞库是世界最大的潜艇洞库，可同时停靠十二艘潜艇，开凿在瓦希拉群岛塔鲁卡岛的山体里，伊武兰语名叫 Taruka Kesutalusam。洞口开在岛北的深水海湾，潜艇可以在水下直接驶入山体，十二个泊位、维修船坞和弹药库都在岩层之下，厚厚的岩层既挡住外界的窥视，也护住洞里的艇和人。岛周围的海水很深，潜艇出港后不久就能潜入深海，从空中和卫星上都很难看到它们的进出。洞库内有独立的电源、通风和淡水系统，艇员在里面换班休整；大型无人潜航器也在这里维护和充电。洞库由海军第九潜艇支队驻守，配有攻击型潜艇 6 艘、大型无人潜航器 12 具，人员约 2200 人，是军事禁区，不对外开放。\n塔鲁卡岛面积约 140 平方公里，岛名在伊武兰语里意为「深处」，离岸不远海底就陡降成深渊，这正是把洞库建在这里的原因。选址时工程师在岛上钻了许多探孔，挑出最完整的一块岩体开凿，挖出的碎石后来用来修了岛上的码头和道路。瓦希拉群岛由瓦希拉岛、塔鲁卡岛和赫维拉岛组成，在基鲁迈群岛以东的外海，离最近的有人岛皮卢尼岛有 200 多公里，整片是海军长夏舰队的基地，官兵和技术人员合计约 1.2 万人。洞库的邻居是沿塔鲁卡岛北岸排开的塔鲁卡无人舰艇船坞；潜艇和无人舰艇的巡逻任务都由瓦希拉岛山体里的瓦希拉地下作战指挥中心统一安排，平时的电力来自赫维拉岛外海的海上发电场，经海底电缆送到岛上，洞库自己的电源是备用的。食品、燃料和零件由皮卢补给码头出发的补给船每周运来。群岛的民政归基鲁迈联合邦管理，基地本身则归中央，官兵在联合邦议会选举时和皮卢岛、皮卢尼岛的居民同在皮卢区投票。\n洞库里看不见日出日落，照明按昼夜调暗调亮，艇员说在山里待久了，要靠食堂开饭的时间判断是早上还是晚上。岛上的老兵爱说「这里的海是竖着的」，因为站在码头边往下看，海水的颜色几步之内就从浅绿变成深蓝。巡逻归来的艇员轮休时大多去瓦希拉岛的营区，营区食堂周末供应基鲁迈的炭烤鱼，许多人下了艇第一件事就是去吃那盘烤鱼。基鲁迈的渔民远远看见群岛的灯光，会说一句「邻居还醒着」，至于山肚子里停着几艘潜艇，他们从来不问，也知道问了没人答。"
      en: "Taruka Submarine Pens are the largest submarine pens in the world, berthing twelve submarines at once, cut into the hills of Taruka Island in the Vahira Islands; their Ivuran name is Taruka Kesutalusam. The entrance is in a deep bay on the north shore, so that submarines sail into the mountain submerged, and the twelve berths, repair docks and magazines all lie under the rock, whose great thickness both hides the boats from prying eyes and shields the boats and crews inside. The water around the island is very deep, so submarines can dive into deep water soon after leaving and are hard to see coming and going from the air or from satellites. The pens have their own power, ventilation and fresh water, crews rest and change shifts inside, and large unmanned submarines are serviced and charged here too. The pens are held by the 9th Submarine Flotilla of the Navy, with 6 attack submarines and 12 large unmanned submarines and about 2,200 personnel; they are a restricted military area, closed to the public.\nTaruka Island covers about 140 km², and its name means 'the depths' in Ivuran: not far offshore the seabed drops away into an abyss, which is exactly why the pens were built here. Engineers drilled many test holes across the island to choose the soundest block of rock to dig into, and the spoil was later used to build the island's quays and roads. The Vahira Islands, made up of Vahira Island, Taruka Island and Hevila Island, lie in the open sea east of the Kirumai Islands, more than 200 km from the nearest inhabited island, Piluni Island, and form one whole base of the Navy's Everlong Summer Fleet, with about 12,000 service members and technicians in all. The pens' neighbour is the Taruka Unmanned Vessel Docks along the north shore of Taruka Island; the patrols of both submarines and unmanned vessels are assigned by the Vahira Underground Operations Centre in the hills of Vahira Island, and everyday power comes by subsea cable from the Hevila Offshore Power Farm, so that the pens' own power plant is a reserve. Food, fuel and spare parts arrive weekly on supply ships from the Pilu Supply Quay. Civil affairs in the islands are run by the Commonwealth of Kirumai, while the base itself belongs to the central government, and in Commonwealth elections the service members vote in the Pilu constituency together with the people of Pilu Island and Piluni Island.\nThere are no sunrises or sunsets inside the pens, so the lights are dimmed and brightened with day and night, and crews say that after long enough in the mountain they tell morning from evening by the canteen's mealtimes. Old hands on the island like to say \"the sea here stands on end\", because looking down from the quayside the water turns from pale green to deep blue within a few paces. Crews back from patrol mostly spend their leave at the garrison on Vahira Island, whose canteen serves Kirumai's charcoal-grilled fish at weekends, and for many the first thing they do on leaving the boat is go and eat it. When Kirumai fishermen see the islands' lights in the distance they say \"the neighbours are still up\"; as for how many submarines lie inside the mountain, they never ask, knowing that nobody would answer."
    in: div_ykkw7q
    offset_km: [24.0, -18.5]
    site: { size_m: [1400, 800], layout: plant, variant: tunnel, angle_deg: 90 }
    military:
      unit:
        zh: 海军第九潜艇支队
        en: "9th Submarine Flotilla, Navy"
      branch: { zh: 海军, en: Navy }
      equipment:
        zh: 攻击型潜艇 6 艘、大型无人潜航器 12 具
        en: "6 attack submarines and 12 large unmanned submarines"
      personnel: 2200
      access: { zh: 军事禁区，不对外开放, en: "Restricted military area, closed to the public" }
