# Named places (buildings, landmarks, facilities) of the Everlong Summer Islands.
# Same conventions as cn-nv-places.yaml; names are Chinese, English and Ivuran (the Executive Council's
# ministries and offices have Chinese and English names only).
places:
  # ── 米雷兰市：湖光大道两端的政务院主楼和领地议会、中段的公民广场和领地图书馆；伊拉米区的研究院和大学 ──
  - id: bld_bby8as
    subtype: government
    status: generated
    names:
      zh: 长夏群岛领地政府
      en: Government of the Everlong Summer Islands
      art-x-ivuran: Imimu Selovaru Arakam
    notes:
      zh: 长夏群岛领地政务院的主楼，在首府米雷兰帕萨卢区湖光大道的北端，是一座回字形的庭院建筑，正门朝南对着整条大道，背后越过高原望向翁贝尔哈努湖。政务院是领地的最高行政机关，由领地总督组织，下设十一个部和若干直属机构；各部大楼沿湖光大道两侧向南排开，中段是公民广场和领地图书馆，南端是领地议会，政务院和议会隔着整条轴线遥遥相对。主楼北翼是总督办公室，东、西两翼是办公厅，南翼是向公众开放的服务大厅；办公厅下设综合行政局、媒体和出版局、财务局、安全局、档案局、采购局和公务员事务局。内院种满雨树和凤凰木，四面的长廊为来访的人遮阳挡雨。
      en: "The main building of the Everlong Summer Islands Executive Council stands at the north end of Lakelight Avenue in Pasalu District of the capital, Mirelan: a hollow square round a courtyard, its main door facing south down the whole length of the avenue and its back looking out over the plateau towards Lake Ombelhanu. The Executive Council is the territory's highest executive body, formed by the governor, with eleven ministries and several directly attached bodies. The ministries line both sides of Lakelight Avenue southwards, with Civic Square and the Territorial Library half-way along and the Territorial Assembly at the far end, so that government and assembly face each other along the axis. The north wing holds the Governor's Office, the east and west wings the General Office with its bureaus of General Administration, Media and Publishing, Finance, Security, Archives, Procurement and Civil Service Affairs, and the south wing a public service hall. Rain trees and flame trees fill the courtyard, and colonnades on all four sides shelter visitors from sun and rain."
    in: div_z0z4vz
    offset_km: [-0.26, 0.91]
    marker: emblem
    emblem_of: div_nwm019
    site: { layout: courtyard, size_m: [300, 240] }
  - id: bld_855nra
    subtype: government
    status: generated
    names:
      zh: 长夏群岛领地议会
      en: Everlong Summer Islands Territorial Assembly
      art-x-ivuran: Imimu Selovaru Ondaram
    notes:
      zh: 长夏群岛领地的立法机关，在湖光大道南端，与北端的政务院主楼隔着整条轴线相对。议员由各市居民选举产生，审议领地法规、预算和发展规划，质询政务院各部；议事厅里的辩论用中文、英文和伊武兰语进行，同声传译通到每个座位。议会大楼由圆形的议事厅和两翼的办公楼组成，屋顶是一圈宽大的挑檐，檐下的回廊在雨季也能让人不淋雨走到每一扇门。会期内旁听席向公众开放，各地的学生常组团来这里参观。
      en: The territory's legislature stands at the south end of Lakelight Avenue, facing the Government building at the north end along the whole axis. Its members are elected by the residents of each city and debate the territory's laws, budgets and development plans and question the Council's ministries. Debates in the chamber are held in Chinese, English and Ivuran, with simultaneous interpretation at every seat. The building is a round chamber between two office wings under a broad ring of eaves, whose colonnade lets people reach every door dry even in the rainy season. The public gallery is open while the assembly sits, and school groups from all over the territory come to visit.
    in: div_z0z4vz
    offset_km: [0.51, -1.78]
    site: { layout: complex, size_m: [300, 220] }
  - id: poi_42vw33
    subtype: plaza
    status: generated
    names:
      zh: 公民广场
      en: Civic Square
      art-x-ivuran: Ondavu Evu
    notes:
      zh: 湖光大道中段的大广场，领地的庆典、国宾欢迎仪式和新年集会都在这里举行。广场西侧是领地图书馆，东侧是政策和计划委员会，四周种着成排的雨树，树荫下的长椅午后总坐满了人；旱季的夜晚，广场上有露天电影和音乐会。
      en: The great square half-way along Lakelight Avenue, where the territory's ceremonies, state welcomes and New Year gatherings take place. The Territorial Library stands on its west side and the Policy and Planning Commission on its east, rain trees line it on every side, and the benches in their shade are full every afternoon; on dry-season evenings there are open-air films and concerts.
    in: div_z0z4vz
    offset_km: [0.14, -0.48]
    site: { layout: plaza, size_m: [500, 240] }
  - id: bld_wt717j
    subtype: library
    status: generated
    names:
      zh: 长夏群岛领地图书馆
      en: Everlong Summer Islands Territorial Library
      art-x-ivuran: Imimu Selovaru Vilatam
    notes:
      zh: 领地的总图书馆，在公民广场西侧，收藏中文、英文和伊武兰语的图书、报刊和档案，古王国时代的棕榈叶手抄本保存在恒温恒湿的地下书库里。阅览室全天开放，各市的公共图书馆和学校图书馆都与它联网，居民可以在任何一处借还。
      en: The territory's central library, on the west side of Civic Square, holds books, newspapers and archives in Chinese, English and Ivuran, and keeps the palm-leaf manuscripts of the old kingdom in climate-controlled vaults underground. Its reading rooms are open all day, and every city's public and school libraries are linked to it, so residents can borrow and return anywhere.
    in: div_z0z4vz
    offset_km: [-0.21, -0.58]
    site: { layout: block, size_m: [160, 120] }
  - id: poi_07n4t0
    subtype: research_institute
    status: generated
    names:
      zh: 长夏群岛热带医学研究院
      en: Everlong Summer Islands Institute of Tropical Medicine
      art-x-ivuran: Imimu Selovaru Kilavam
    notes:
      zh: 伊拉米区的研究院，研究疟疾、登革热等热带传染病的疫苗和药物，与领地的生物医药企业共建实验室；附属医院接收全领地转来的疑难病人，来自世界各地的学者约占研究人员的三成。
      en: The institute in Ilami District that develops vaccines and medicines for malaria, dengue and other tropical infections, with laboratories shared with the territory's biomedical firms. Its hospital takes difficult cases referred from all over the territory, and about three in ten of its researchers come from abroad.
    in: div_56take
    offset_km: [-0.5, 0.4]
    site: { layout: campus, size_m: [700, 450] }
  - id: poi_4dhh8j
    subtype: university
    status: generated
    names:
      zh: 长夏群岛大学高原校区
      en: University of the Everlong Summer Islands, Plateau Campus
      art-x-ivuran: Imimu Selovaru Saluvam Pala
    notes:
      zh: 长夏群岛大学在首府的校区，设有医学、公共卫生和农业科学学院，与隔壁的热带医学研究院合办研究生课程；校园在高原上，比沿海凉爽，试验田里种着高原咖啡和稻种。
      en: The capital campus of the University of the Everlong Summer Islands, with schools of medicine, public health and agricultural science and graduate courses run jointly with the neighbouring Institute of Tropical Medicine. Up on the plateau it is cooler than the coast, and its trial fields grow highland coffee and new rice varieties.
    in: div_56take
    offset_km: [1.0, -0.8]
    site: { layout: campus, size_m: [900, 600] }
  - id: poi_qkqw91
    subtype: airport
    status: generated
    names:
      zh: 米雷兰机场
      en: Mirelan Airport
      art-x-ivuran: Mirelan Ulavan
    notes:
      zh: 首府的机场，在翁贝尔区湖畔高原上，有航班飞往萨伦纳姆、基拉努和各地机场；高原空气稀薄，跑道比沿海机场长一些。
      en: The capital's airport, on the plateau in Ombel District, with flights to Sarunnam, Kilanu and the other airports; the thin plateau air means its runway is a little longer than those on the coast.
    in: div_f0wwdt
    offset_km: [4.5, -1.0]
    site: { size_m: [3400, 900], layout: airport, angle_deg: 30 }
