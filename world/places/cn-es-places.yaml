  # ── 萨伦纳姆市：旧王城、寺庙群、水上市场、萨伦纳姆塔、港口与机场 ──
  - id: poi_myws2w
    subtype: cultural_site
    status: generated
    names:
      zh: 瓦什塔赖旧王城
      en: Vashtarai Royal City
      art-x-ivuran: Vashtarai Aruvam
    notes:
      zh: "瓦什塔赖旧王城在萨伦纳姆市的瓦什塔赖区，区名是雅言里的「王冠之座」。这里是古王国的王城，占地约 1200 × 1000 米，城墙和护城河围着宫殿遗址，城内只许步行和骑车；宫殿的石阶、王座台基和浴池保存至今，老房子多改作博物馆、手工作坊和客栈。瓦什塔赖区面积约 120 平方公里，住着 38 万人，文化遗产、旅游和商贸是区里的主业。城北是伊什万塔寺庙群，上百座雕满神祇、舞者和花卉的石塔由回廊和水池相连，是世界最大的古代石构寺庙群，至今仍有僧侣居住。地铁 5 号线设有瓦什塔赖旧王城站，纳卢高速也从瓦什塔赖区出发，沿西北海岸而去。节庆时全城的人来这里点灯、献花，伊武兰语南部方言在旧城的街巷里仍是日常用语。\n每逢满月的「Vilaru Imolu」，意思是「灯与月」，王城点起成千上万盏油灯，一家老小坐船沿着护城河和老城河道看灯，阿兰塔区的摩天楼也在这一夜调暗灯光，萨伦纳姆港里的船只挂起油灯，从河口望去，灯光一直连到王城。平日里，手工作坊的匠人编织棕叶、雕刻木器，游客可以坐下来跟着学；客栈的主人多是世代住在城里的人家，早餐端上来的是香蕉叶包着的椰浆糯米饭和刚出锅的炸香蕉。"
      en: "The Vashtarai Royal City lies in Vashtarai District of Sarunnam City, whose name is the classical tongue's \"seat of the crown\". It was the royal city of the old kingdom, covering about 1,200 × 1,000 m, its walls and moat enclosing the ruins of the palace; inside, only walking and cycling are allowed. The palace's stone stairs, throne platform and bathing pools survive, and the old houses have become museums, workshops and guesthouses. Vashtarai District covers about 120 km² and is home to 380,000 people, living mainly from heritage, tourism and commerce. North of the city stand the Ishvanta Temples, more than a hundred stone towers carved with gods, dancers and flowers and linked by cloisters and pools, the largest ancient stone temple complex in the world and still home to monks. Metro Line 5 has a Vashtarai Royal City station, and the Nalu Expressway also starts in Vashtarai District and heads off along the north-west coast. At festivals the whole city comes here to light lamps and offer flowers, and the southern dialect of Ivuran is still everyday speech in the old town's lanes.\nAt every full moon, on the night of \"Vilaru Imolu\", lamps and moon, the royal city lights thousands upon thousands of oil lamps, whole families take boats along the moat and the old town's canals to see them, the skyscrapers of Aranta District dim their lights for the night, and the ships in Sarunnam Port hang out oil lamps, so that from the river mouth the lights run all the way to the royal city. On ordinary days the craftspeople in the workshops weave palm leaves and carve wood, and visitors can sit down and learn alongside them; the guesthouses are mostly kept by families who have lived in the city for generations, and breakfast is coconut sticky rice wrapped in banana leaf with freshly fried bananas."
    in: div_8jecyx
    offset_km: [0.2, 0.2]
    site: { layout: courtyard, size_m: [1200, 1000] }
  - id: bld_g6dcxr
    subtype: temple
    status: generated
    names:
      zh: 伊什万塔寺庙群
      en: Ishvanta Temples
      art-x-ivuran: Ishvanta Ottaram
    wonder:
      zh: 世界最大的古代石构寺庙群，旧王城北面上百座石塔连成一片
      en: The largest ancient stone temple complex in the world, over a hundred stone towers joined together north of the royal city
    notes:
      zh: "伊什万塔寺庙群是世界最大的古代石构寺庙群，在萨伦纳姆市瓦什塔赖区的旧王城北面，上百座石塔连成一片，伊武兰语名叫 Ishvanta Ottaram，和王城、寺庙的其他雅称一样取自古王国的雅言。寺庙群东西约 1.8 公里、南北约 1.4 公里，石塔上雕满神祇、舞者和花卉，由回廊和水池相连，是古王国留下的最大遗产。石塔高低不一，最高的几座立在寺庙群的中轴上，四周的小塔一圈圈围着它们，从空中看下去像一朵层层展开的莲花。寺庙至今仍有僧侣居住，清晨的诵经声从石塔间传出；领地文化部门按年修缮石塔，一年只修几座，修好的石块按原位一块块归回，游客须脱鞋入内。\n萨伦纳姆是古王国的旧都，瓦什塔赖区的名字是雅言里的「王冠之座」，城墙和护城河围着宫殿遗址，宫殿的石阶、王座台基和浴池保存至今。寺庙群就在城墙北面，与王城一起构成旧都的核心；城墙内只许步行和骑车，老房子多改作博物馆、手工作坊和客栈，作坊里的石匠和木雕匠很多就是给寺庙修缮打下手的人。领地的信仰多元，城市大多世俗化，但节庆时全城的人仍会来这里点灯、献花，不论信什么，都把这里当作萨伦纳姆的根。萨伦纳姆地铁 5 号线在王城设有瓦什塔赖旧王城站，萨伦纳姆环城高速也从区内经过，游客大多从车站步行进城，穿过王城再走到北面的寺庙群。\n寺庙群在清晨最安静：僧侣在回廊里扫落叶，水池上浮着睡莲，卖花的老人在门外摆出成串的鸡蛋花和茉莉。僧侣按古老的规矩托钵化缘，清晨沿着王城的街巷走一圈，客栈和作坊的人家把米饭和水果放进钵里；雨季水池涨满，回廊的台阶没在水里，游客要踩着垫高的木板进出。石塔上的舞者浮雕是古王国戏的活教材，奥卢瓦尔区收割后在稻田里搭台演戏的戏班子，常常带着学徒来这里看浮雕上的手势和姿势。满月之夜叫「Vilaru Imolu」，意思是「灯与月」，寺庙群的回廊和水池边点满油灯，石塔的倒影映在水里，一家老小坐船沿着护城河和老城河道看灯，连阿兰塔区的摩天楼也在这一夜调暗灯光，萨伦纳姆塔观景台上的人能看到寺庙群里成千上万盏油灯。本地人说，石塔上的神祇一年里只有这一夜能在水里看见自己的样子。"
      en: "The Ishvanta Temples are the largest ancient stone temple complex in the world, over a hundred stone towers joined together north of the royal city in Vashtarai District of Sarunnam City; their Ivuran name, Ishvanta Ottaram, like the other formal names of the royal city and the temples, comes from the elevated language of the ancient kingdom. The complex is about 1.8 km from east to west and 1.4 km from north to south, its towers carved with gods, dancers and flowers and linked by cloisters and pools, the greatest legacy of the old kingdom. The towers vary in height, the tallest standing on the central axis of the complex with ring upon ring of smaller towers around them, so that from the air it looks like a lotus opening layer by layer. Monks still live here and their morning chanting drifts between the towers; the territory's cultural department restores the towers year by year, only a few a year, setting each repaired stone back in its own place, and visitors go in barefoot.\nSarunnam is the old capital of the ancient kingdom; the name of Vashtarai District means 'seat of the crown' in the elevated language, and its walls and moat enclose the ruins of the palace, whose stone stairs, throne platform and baths survive to this day. The temples lie just north of the walls and with the royal city form the heart of the old capital; inside the walls only walking and cycling are allowed, and the old houses have mostly become museums, craft workshops and guesthouses, many of whose stonemasons and woodcarvers lend a hand with the temple restorations. The territory's faiths are many and its cities mostly secular, but at festivals the whole city still comes here to light lamps and offer flowers, and whatever people believe, they treat this place as Sarunnam's roots. Sarunnam Metro Line 5 has a station at the royal city, Vashtarai Royal City, and the Sarunnam Ring Expressway runs through the district too; most visitors walk in from the station, through the royal city and on to the temples to the north.\nThe temples are quietest at dawn, when monks sweep the leaves from the cloisters, water lilies float on the pools, and old flower sellers lay out strings of frangipani and jasmine at the gates. By old custom the monks go out with their alms bowls, walking a round of the royal city's lanes at dawn while the guesthouses and workshops put rice and fruit into the bowls; in the wet season the pools fill to the brim, the cloister steps disappear under water, and visitors cross on raised boards. The dancers carved on the towers are a living textbook for the old-kingdom theatre, and the troupes that put up stages in the harvested paddies of Oluvar District often bring their apprentices here to study the gestures and poses in the reliefs. The full-moon night is called \"Vilaru Imolu\", meaning 'lamps and moon': the cloisters and pools are lined with oil lamps and the towers are mirrored in the water, families go by boat along the moat and the canals of the old town to see the lamps, even the skyscrapers of Aranta dim their lights for the night, and from the observation deck of Sarunnam Tower you can see the thousands of oil lamps in the temples. Locals say it is the only night of the year when the gods on the towers can see themselves in the water."
    in: div_8jecyx
