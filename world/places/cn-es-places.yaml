    notes:
      zh: 中央政府常驻长夏群岛领地巡视员办公室，位于湖光大道北段东侧第二排，由中央政府派驻，负责对领地各级行政机关进行巡视监督。巡视员定期到政务院各部、各市人民政府、埃武托拉公社委员会和公共企业检查政策执行、财政资金使用和廉洁情况，发现的问题向中央政府和领地总督同时报告，并跟踪整改。领地的税收和福利开支都很大，巡视的重点之一是全民基本收入和公共住房资金的使用。办公室设有公众来访接待室，用中文、英文和伊武兰语接待居民的意见和举报，巡视报告的摘要定期向社会公开。
      en: The Office of the Central Government Inspector in the Everlong Summer Islands, in the second row on the east side of Lakelight Avenue's north end, is sent by the central government to inspect and oversee the territory's administration at every level. Inspectors regularly visit the Council's ministries, the city governments, the Evutola Commune council and public companies to check how policies are carried out, how public money is spent and whether officials are honest; what they find goes to both the central government and the governor, and they follow it up until it is put right. With taxes and welfare spending so large, one focus is how the universal basic income and public housing funds are used. The office's public reception room hears residents' complaints and reports in Chinese, English or Ivuran, and summaries of its inspection reports are published.
