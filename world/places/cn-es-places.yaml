  - id: poi_zmkwxe
    subtype: command_centre
    status: generated
    names:
      zh: 瓦希拉地下作战指挥中心
      en: Vahira Underground Operations Centre
      art-x-ivuran: Vahira Kesutam
    notes:
      zh: 瓦希拉地下作战指挥中心开凿在瓦希拉岛中部的山体里，是长夏舰队的作战指挥中枢。地面上只有几处隧道口、通风竖井和天线，主体藏在厚厚的岩层之下：指挥大厅的屏幕墙显示着方圆数千公里海空的态势，水下传感器网、岛上雷达、卫星和无人机的数据都汇集到这里，由人工智能系统融合成一张完整的态势图，并为指挥员推荐行动方案；无人舰艇、水下无人航行器和无人机的编队任务也从这里下达。中心有独立的电源、蓄水池和空气过滤系统，与舰队司令部之间以多条光缆相连。
      en: Vahira Underground Operations Centre is cut into the hills in the middle of Vahira Island and is the operational nerve centre of the Everlong Summer Fleet. On the surface there are only a few tunnel portals, ventilation shafts and antennas; the rest lies under thick rock. The screen wall of its command hall shows the sea and air for thousands of kilometres around, as data from the undersea sensor network, the island radars, satellites and drones is fused by an artificial intelligence system into one picture that also proposes courses of action to the commanders. Missions for the fleet's unmanned surface vessels, underwater vehicles and drones are issued from here. The centre has its own power, water reservoirs and air filtration, and several fibre links to fleet headquarters.
    in: div_ykkw7q
