    notes:
      zh: 长夏群岛领地政务院建设部，位于湖光大道北段东侧，负责城乡规划、住房和建筑市场。部内设政策司、住房保障司、房地产市场监管司、建筑市场监管司、城市建设司和乡镇建设司。首府米雷兰是按它审定的规划在高原上全新建设的，湖光大道这条轴线就是规划的骨架。领地的土地公有，住宅和厂房用地长期租用，房地产市场监管司管理住房的转租和租金，不许炒卖；住房保障司为各市建设公共租赁住房，租金按收入确定；建筑市场监管司制定适应湿热气候和雨季暴雨的建筑规范，要求新建筑带遮阳长廊和屋顶花园。
      en: The Ministry of Construction, at the north end of Lakelight Avenue on the east side, is in charge of town and country planning, housing and the building trade. Its departments are Policy, Housing Support, Property Market Supervision, Building Market Supervision, Urban Development and Rural Development. Mirelan was built from scratch on the plateau to a plan it approved, and Lakelight Avenue is the backbone of that plan. Land in the territory is public and leased for homes and factories; Property Market Supervision oversees subletting and rents and forbids speculation, Housing Support builds public rental housing in every city with rents set by income, and Building Market Supervision writes the codes for a hot, humid climate and monsoon downpours, which require new buildings to have shaded colonnades and roof gardens.
    in: div_z0z4vz
