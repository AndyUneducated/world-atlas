      en: Senior State Commissioner's Office
    notes:
      zh: 中央政府常驻长夏群岛领地高级国务督办办公室，位于湖光大道北段西侧第二排，是中央政府派驻领地的最高代表机构。高级国务督办代表中央政府督促国家法律和政策在领地的实施，协调国防、外交等中央事权与领地事务的衔接，例如瓦希拉群岛海军基地和空军基地的驻地安排、国际航线和远洋航运口岸的开放；埃武托拉公社的外交和国防事务也经办公室与中央衔接。领地重大事项需要中央批准时，由办公室转呈并跟进。办公室与政务院定期举行联席会议，每年向中央政府提交领地情况的报告。大楼为方形独栋，门前悬挂国旗和领地旗。
      en: The Office of the Senior State Commissioner of the Central Government in the Everlong Summer Islands, in the second row on the west side of Lakelight Avenue's north end, is the central government's highest standing representation in the territory. The Senior State Commissioner sees that national laws and policies are carried out here and links the central government's own responsibilities, such as defence and foreign affairs, with territorial business, for example the naval and air bases in the Vahira Islands and the opening of international air routes and ocean ports. The Evutola Commune's foreign and defence matters also pass through the office. When a territorial matter needs central approval, the office forwards it and follows it up. It meets the Executive Council in regular joint sessions and reports on the territory to the central government every year. The square building flies the national and territorial flags at its door.
    in: div_z0z4vz
