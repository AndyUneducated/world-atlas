    subtype: government
    status: generated
    names:
      zh: 长夏群岛领地政务院财政部
      en: Ministry of Finance, Everlong Summer Islands Executive Council
    short_names:
      zh: 财政部
      en: Ministry of Finance
    notes:
      zh: 长夏群岛领地政务院财政部，与对外事务部隔湖光大道相对，管理领地的税收、预算和财政监督。部内设税收司、关税司、监管司、行政部门预算司、企业事业单位预算司和中央财政事务司。领地实行高税收、高福利：个人所得税、社会保险和消费税的税率都较高，公有土地长期出租的租金也是一大笔收入，这些钱支撑着免费到大学的教育、全民医保和按月发放的全民基本收入。埃武托拉公社自定税率，中央财政事务司与公社委员会按协议结算外交、国防等由政务院承担的开支。大楼为长条形板楼，地下是领地的财政档案库。
      en: "The Ministry of Finance faces the Ministry of External Affairs across Lakelight Avenue and runs the territory's taxes, budgets and financial oversight through its departments of Taxation, Customs Tariffs, Supervision, Executive Budgets, Public Enterprise and Institution Budgets, and Central Finance. The territory taxes heavily and spends generously: income tax, social insurance and consumption tax are all set high, and the rents from public land, which is leased rather than sold, bring in a great deal more. Together they pay for free education up to university, universal health cover and the monthly universal basic income. The Evutola Commune sets its own taxes, and Central Finance settles with the commune council by agreement for the foreign affairs, defence and other services the Executive Council provides. The building is a long slab with the territory's financial archive underground."
    in: div_z0z4vz
    offset_km: [0.02, 0.65]
    site: { size_m: [150, 80], layout: slab }
