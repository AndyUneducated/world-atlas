      en: "The commune's industrial park, whose factories are collectively owned or run as co-operatives, making appliances, bicycles, trams and building materials; what they make goes first to the commune's residents on request, and the rest is sold outside. The bicycles and trams made here bear the words \"Tola evu\", home belongs to everyone, and most commune children learn to ride on a bicycle built here."
