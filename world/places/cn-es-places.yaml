    names:
      zh: 赫维拉定向能防空阵地
      en: Hevila Directed Energy Air Defence Site
      art-x-ivuran: Hevila Vilaura
    notes:
      zh: 赫维拉定向能防空阵地在赫维拉岛的高处，用高能激光和高功率微波拦截来袭的无人机、导弹和炮弹。激光器发射一次只需要电，不消耗弹药，海上发电场的电力让它可以连续射击；高功率微波武器能一次瘫痪成群的小型无人机。阵地与群岛的雷达和瓦希拉地下作战指挥中心联网，从发现目标到发射只需要几秒钟。热带的高温高湿会削弱激光，阵地旁的气象站实时测量大气，调整光束。
      en: Hevila Directed Energy Air Defence Site stands on high ground on Hevila Island and uses high-energy lasers and high-power microwaves to stop incoming drones, missiles and shells. Each laser shot needs only electricity, not ammunition, and the offshore power farm lets it keep firing; the microwave weapons can disable a whole swarm of small drones at once. The site is networked with the islands' radars and the Vahira Underground Operations Centre, so only seconds pass from detection to engagement. Tropical heat and humidity weaken a laser beam, so a weather station beside the site measures the air continuously to adjust it.
    in: div_ykkw7q
