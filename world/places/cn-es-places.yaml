      art-x-ivuran: Ishvanta Ottaram
    wonder:
      zh: 世界最大的古代石构寺庙群，旧王城北面上百座石塔连成一片
      en: The largest ancient stone temple complex in the world, over a hundred stone towers joined together north of the royal city
    notes:
      zh: 旧王城北面的石构寺庙群，上百座雕满神祇、舞者和花卉的石塔由回廊和水池相连，是古王国留下的最大遗产。寺庙至今仍有僧侣居住，清晨的诵经声从石塔间传出；领地文化部门按年修缮石塔，游客须脱鞋入内。
      en: The stone temples north of the royal city, more than a hundred towers carved with gods, dancers and flowers, linked by cloisters and pools, the greatest legacy of the old kingdom. Monks still live here and their morning chanting drifts between the towers; the territory's cultural department restores the towers year by year, and visitors go in barefoot.
    in: div_8jecyx
    offset_km: [0.5, 2.0]
    site: { layout: complex, size_m: [1800, 1400] }
