    notes:
      zh: 长夏群岛领地政务院卫生和人类服务部，位于湖光大道南段西侧，负责食品药品安全、医疗卫生、公共保险和公共福利，是领地开支最大的部之一。部内设食品政策司、食品监管司、食品从业人员司、医疗和药品政策司、医疗和药品监管司、医疗和药品从业人员司、医疗和药品技术司、公共健康保险司、其他公共保险司、公共卫生司和公共福利司，其中公共福利司、公共健康保险司和食品监管司在大楼后排单独建楼。公共卫生司与伊拉米区的长夏群岛热带医学研究院合作防治疟疾和登革热，并为山区村寨和外岛组织巡回医疗和直升机急救。
      en: The Ministry of Health and Human Services, at the south end of Lakelight Avenue on the west side, is responsible for food and drug safety, health care, public insurance and public welfare, and is one of the territory's biggest spenders. Its eleven departments are Food Policy, Food Supervision, Food Professions, Medical and Drug Policy, Medical and Drug Supervision, Medical and Drug Professions, Medical and Drug Technology, Public Health Insurance, Other Public Insurance, Public Health and Public Welfare; Public Welfare, Public Health Insurance and Food Supervision have buildings of their own in the row behind. Public Health works with the Institute of Tropical Medicine in Ilami District against malaria and dengue, and sends travelling clinics and air ambulances to the mountain villages and outer islands.
    in: div_z0z4vz
