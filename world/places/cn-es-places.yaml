  - id: poi_gzgmkn
    subtype: university
    status: generated
    names:
      zh: 长夏群岛大学
      en: University of the Everlong Summer Islands
      art-x-ivuran: Imimu Selovaru Saluvam
    notes:
      zh: "长夏群岛大学是领地规模最大的综合性大学，主校区在萨伦纳姆人口最多的伊拉瓦姆区，区名在伊武兰语里意为「青年之地」。校园占地约 1600 × 1000 米，以热带农业、海洋科学和伊武兰语研究见长，在首府米雷兰的伊拉米区另有设医学、公共卫生和农业科学学院的高原校区。领地的教育免费到大学，这里学费全免，学生来自领地各地和世界各国；校园里的林荫道和图书馆向市民开放，周边的咖啡馆和书店沿林荫大道一字排开。地铁 3 号线设有长夏群岛大学站，长夏真空磁悬浮的萨伦纳姆站也在同一个区，外市来的学生下了车就能换乘地铁到校。海洋科学的学生常去皮拉凯的红树林和三角洲外的浅海做调查，伊武兰语系则走村串巷，收集各地的方言和古王国的戏文。\n校园的林荫道上种着几百棵来自领地各地的果树，果子成熟时谁都可以摘，学生们说这是「长夏群岛大学的第一门免修课」。伊武兰语系每年雨季的第一场大雨时敲响木鼓，全校师生跑进雨里过「雨鼓日」，浑身湿透也没人去躲。考试周里，图书馆通宵开放，附近社区食堂的师傅会给熬夜的学生多舀一勺椰浆糯米饭。"
      en: "The University of the Everlong Summer Islands is the territory's largest university, with its main campus in Ilavam District, the most populous district of Sarunnam, whose name means \"place of youth\" in Ivuran. Covering about 1,600 × 1,000 m, it is known for tropical agriculture, ocean science and Ivuran studies, and has a second campus, the Plateau Campus with its schools of medicine, public health and agricultural science, in Ilami District of the capital, Mirelan. Education in the territory is free up to university, so there are no tuition fees here, and students come from all over the territory and the world; its shaded walks and library are open to the public, and cafés and bookshops line the tree-lined boulevards around it. Metro Line 3 has a University of the Everlong Summer Islands station, and Sarunnam Station on the Everlong Summer Vacuum Maglev is in the same district, so students from other cities can change straight onto the metro to campus. Ocean science students often survey the mangroves of Pilakkai and the shallow seas off the delta, while the Ivuran department goes from village to village collecting dialects and the scripts of the old kingdom's plays.\nHundreds of fruit trees from every part of the territory line its avenues, and anyone may pick the fruit when it ripens; students call it \"the university's first free course\". At the first heavy rain of each wet season the Ivuran department beats its wooden drums and the whole university runs out into the rain for Uvesa Tomaku, and nobody takes shelter however soaked they get. In exam week the library stays open all night, and the cooks at the nearby community canteen give students up late an extra spoonful of coconut sticky rice."
    in: div_n90922
    offset_km: [1.5, 1.0]
    site: { layout: campus, size_m: [1600, 1000] }
  - id: poi_kk4d9s
    subtype: airport
    status: generated
    names:
      zh: 萨伦纳姆国际机场
      en: Sarunnam International Airport
      art-x-ivuran: Sarunnam Ulavan
    notes:
      zh: "萨伦纳姆国际机场在萨伦纳姆东部的新城门达卢尔区，是领地最大的航空港，场区约 4400 × 2000 米，领地其他机场都比它小；航线通往世界各地，也连接着基鲁迈、米雷兰等领地内的机场。周围是物流园、航空维修基地和会展中心；地铁 4 号线设有萨伦纳姆国际机场站，乘客从航站楼下就能坐地铁进城，约 4 公里长的机场公路把航站楼和城区路网连起来。门达卢尔区按规划路网建设，住宅多为高层公寓，居民以近二三十年迁来的移民家庭为主，不少人就在机场和物流园上班。门达卢尔区有 45 万人，航空与机场、物流仓储是区里最主要的行业。从机场往西进城，就是瓦什塔赖旧王城、塞鲁卡姆水上市场和阿兰塔区的摩天楼。\n到达大厅的墙上用中文、英文和伊武兰语写着领地格言「长夏不尽，人人有家」，旅客出关后第一眼看到的就是这行字。许多移民家庭至今记得第一次站在这行字下面的情景，每逢有亲戚从远方来，全家都要到大厅里等着，指着墙上的字给新来的人看。满月之夜降落的航班上，乘客从舷窗能望见旧王城和寺庙群那一大片点点灯火，空乘会特意调暗客舱的灯，让大家看个清楚。"
      en: "Sarunnam International Airport lies in Mendalur District, the new town in the east of Sarunnam, and is the territory's largest airport; its site covers about 4,400 × 2,000 m, and every other airport in the territory is smaller. It has routes all over the world and links with Kirumai, Mirelan and the territory's other airports. Logistics parks, an aircraft maintenance base and an exhibition centre surround it; Metro Line 4 has a Sarunnam International Airport station, so passengers can take the metro into town from beneath the terminal, and an airport road of about 4 km joins the terminal to the city's road grid. Mendalur District was built on a planned street grid, mostly in high-rise flats, and its residents are mainly migrant families who have arrived over the past twenty or thirty years, many of whom work at the airport and the logistics parks. Mendalur District has 450,000 people, and aviation and logistics are its main industries. Heading west from the airport into town, travellers reach the Vashtarai Royal City, the Serukkam Floating Market and the skyscrapers of Aranta District.\nThe arrivals hall wall carries the territory's motto, \"Endless Summer, a Home for All\", in Chinese, English and Ivuran, the first words travellers see after passport control. Many migrant families still remember standing beneath those words for the first time, and whenever relatives come from far away the whole family waits in the hall to point them out to the newcomers. On flights landing on full-moon nights, passengers can see from the windows the great field of lamplight over the royal city and the temples, and the cabin crew dim the cabin lights so that everyone can see it clearly."
    in: div_54sm84
    offset_km: [8.5, 0]
    site: { size_m: [4400, 2000], layout: airport, angle_deg: 60 }
  - id: poi_dve190
    subtype: port
    status: generated
    names:
      zh: 萨伦纳姆港
      en: Sarunnam Port
      art-x-ivuran: Sarunnam Talusam
    notes:
      zh: "萨伦纳姆港在萨伦纳姆市的萨鲁凯区，区名在伊武兰语里意为「河口之岸」，位于哈努西鲁河的河口。约 1400 公里长的哈努西鲁河是世界最长的河，从中脊西坡流向西南，在三角洲入海。港区占地约 6000 × 3500 米，集装箱码头、散货码头和一处滚装码头沿河口两岸展开，是领地的大港之一；三角洲的稻米、香料和水产从这里装船出口，进口的机械和原料从这里运往全岛。散货码头装运新米的时节，整个河口都飘着米香，码头工人说一闻就知道今年三角洲的收成好不好。港区后方是仓库、冷库和食品加工厂，码头工人和船员多住在区北的工人新村。伊米穆高速也经过萨鲁凯区，从港区出发的货车可以直接上高速前往全岛各市。\n港区的老码头上还保留着一排木制的货仓，墙板被几代人的货物磨得发亮，如今有的改作茶馆，船员们靠港时爱在里面喝茶、打牌。满月的「灯与月」之夜，港里的船只也挂起油灯，从河口望去，灯光一直连到旧王城。雨季河水上涨，上游漂下来的水葫芦常缠住拖船的螺旋桨，港务员要划着小艇去一点点清理，本地人笑称这是「哈努西鲁河寄来的包裹」。"
      en: "Sarunnam Port lies in Sarukkai District of Sarunnam City, a name that means \"estuary shore\" in Ivuran, at the mouth of the Hanusiru. At about 1,400 km the Hanusiru is the longest river in the world, flowing south-west from the western slopes of the central ridge to reach the sea through its delta. Covering about 6,000 × 3,500 m, the port strings container and bulk terminals and a ro-ro berth along both banks of the estuary and is one of the territory's major ports; the delta's rice, spices and seafood are shipped out here, and imported machinery and materials come in for the whole island. When the new rice is loaded at the bulk terminals the whole estuary smells of it, and the dockers say one sniff tells them how good the delta's harvest has been. Behind the port are warehouses, cold stores and food-processing plants, and the dockers and seamen mostly live in the workers' estates in the north of the district. The Imimu Expressway also passes through Sarukkai District, so lorries leaving the port can go straight onto it for every city on the island.\nA row of timber godowns survives on the old quay, their boards polished by generations of cargo, and some are now tea houses where seamen in port like to drink tea and play cards. On full-moon nights, the nights of lamps and moon, the ships in port hang out oil lamps too, so that from the river mouth the lights run all the way to the royal city. When the river rises in the wet season, water hyacinth drifting down from upstream often tangles the tugs' propellers, and harbour staff row out in skiffs to clear it bit by bit; locals joke that these are \"parcels sent by the Hanusiru\"."
    in: div_ycfvt9
    site: { size_m: [6000, 3500], layout: harbour, terminals: [container, container, bulk, bulk, roro] }
  - id: poi_hmp08v
    subtype: nature_reserve
    status: generated
    names:
      zh: 皮拉凯红树林保护区
      en: Pilakkai Mangrove Reserve
      art-x-ivuran: Pilakkai Siralomi
    notes:
      zh: "皮拉凯红树林保护区在萨伦纳姆市三角洲外缘的皮拉凯区，区名在伊武兰语里意为「红树林之岸」。保护区占地约 4000 × 2500 米，潮水涨落间的红树林是鱼虾和螃蟹的育苗场，也是候鸟的停歇地，林外的浅海里还有海草床。木栈道只修在保护区边缘，护林员乘小船巡护。皮拉凯区面积约 2.8 万平方公里，有 35 万人，第一产业占全区产值的四成，海水养殖、渔业和自然保护是主要行业。皮拉凯区的海岸线大部分划为保护区，领地禁止砍伐红树林开挖虾塘，养殖都在指定的内陆塘区进行；渔村散落在红树林之间的水道口，居民打鱼、养虾和养蟹，八成以上以伊武兰语为母语。\n退潮时泥滩上能看到成群的弹涂鱼蹦跳，孩子们趴在栈道边看它们用鳍「走路」；护林员说，红树林挡住了风暴潮，三角洲上的稻田和村子才能安稳。护林员大多是附近渔村长大的年轻人，认得每一条水道，涨潮时撑着小船从树根间穿过，退潮时就只能等下一班潮水。候鸟季节，观鸟的人天不亮就守在栈道尽头，渔村的人家顺手在门口支起小摊，卖热茶和炸香蕉。附近的学校每年带孩子们来种红树苗，孩子们把种下的树苗叫作「弟弟妹妹」，每年回来量一量又长高了多少。"
      en: "Pilakkai Mangrove Reserve lies in Pilakkai District on the outer edge of the delta in Sarunnam City, a name that means \"mangrove shore\" in Ivuran. Covering about 4,000 × 2,500 m, its tidal forest is a nursery for fish, prawns and crabs and a stopover for migrating birds, and beyond it lie seagrass beds in the shallows. Boardwalks run only along its edge, and rangers patrol by boat. Pilakkai District covers about 28,000 km² and has 350,000 people; the primary sector accounts for 40 per cent of its output, and aquaculture, fishing and conservation are its main industries. Most of Pilakkai District's coastline is protected; the territory forbids clearing mangroves for prawn ponds, and all farming is done in designated inland pond zones. Fishing villages sit at the mouths of the channels between the mangroves, where people fish and farm prawns and crabs, and more than eight in ten speak Ivuran as their mother tongue.\nAt low tide crowds of mudskippers hop across the flats, and children lie on the boardwalk watching them \"walk\" on their fins; the rangers say the mangroves hold back the storm surges, which is why the delta's paddies and villages are safe. Most rangers are young people who grew up in the nearby villages and know every channel: at high tide they pole their boats between the roots, and at low tide they can only wait for the next one. In the migration season birdwatchers wait at the end of the boardwalk before dawn, and village families set up stalls at their doors selling hot tea and fried bananas. Local schools bring children every year to plant mangrove seedlings; the children call the saplings their \"little brothers and sisters\" and come back each year to measure how much they have grown."
    in: div_k880h3
    offset_km: [-2.5, 1.5]
    site: { layout: park, size_m: [4000, 2500] }

  # ── 瓦利凯、彭纳拉姆和温达坎：转运港、物流园、香料和梯田 ──
  - id: poi_8fvrks
    subtype: port
    status: generated
    names:
      zh: 图拉凯集装箱码头
      en: Turakkai Container Terminal
      art-x-ivuran: Turakkai Talusam
    notes:
      zh: "图拉凯集装箱码头在瓦利凯市的图拉凯区，区名在伊武兰语里意为「港口之岸」，是瓦利凯港的深水转运港。港区占地约 7000 × 3500 米，四个集装箱突堤和一处油品泊位沿防波堤展开，自动化集装箱码头昼夜作业；往来大洋之间的大型集装箱船在这里换装驳船和支线船，转运箱量居领地之首，港区还有船舶加油站和修船码头。图拉凯区有 26 万居民，许多是码头、航运和物流企业的职工。瓦利凯港扼守东西航线，是领地的国际转运枢纽。码头的货物经图拉凯港口高速的高架桥直达埃鲁塔姆物流园，再从那里接上伊米穆高速发往全岛，集装箱卡车不必穿过坎纳鲁尔老城的骑楼街。\n码头的吊车司机被称作「云上的人」，他们在几十米高的驾驶室里吃午饭，饭盒用绳子吊上去；从驾驶室往下看，高架桥上的卡车像一串串移动的积木。瓦利凯是领地雨水最多的城市，一年降水两千七百多毫米，雨季的暴雨说来就来，码头照常作业，吊车司机说雨点打在驾驶室的玻璃上，比听收音机还热闹。换班以后，码头工人爱去坎纳鲁尔老城的骑楼下喝一杯香料奶茶，聊聊今天又来了哪国的大船，回家时再捎上一包咸香的海藻饼。"
      en: "Turakkai Container Terminal lies in Turakkai District of Vallikkai City, a name that means \"harbour shore\" in Ivuran; it is the deep-water transhipment port of Vallikkai. Covering about 7,000 × 3,500 m, it strings four container piers and an oil berth along the breakwater, and its automated container berths work day and night; ocean-going container ships exchange boxes with barges and feeder ships here, it handles more transhipment containers than any other port in the territory, and there are also bunkering berths and a repair quay. Turakkai District has 260,000 residents, many of them working for the port, shipping and logistics firms. Vallikkai's port commands the east–west shipping lanes and is the territory's international transhipment hub. Cargo from the quays runs over the viaduct of the Turakkai Port Expressway straight to the Eruttam Logistics Park and on from there by the Imimu Expressway to the whole island, so container lorries never need to cross the arcaded streets of the old town of Kannarur.\nIts crane drivers are known as \"the people in the clouds\": they eat lunch in cabs tens of metres up, their lunchboxes hauled up on a rope, and from the cab the lorries on the viaduct look like strings of moving building blocks. Vallikkai is the territory's rainiest city, with more than 2,700 mm a year, and in the wet season the downpours come without warning; the terminal keeps working, and the crane drivers say rain drumming on the cab windows is livelier than the radio. After their shift the dockers like to drink a spiced milk tea under the arcades of Kannarur's old town and talk over which country's big ships came in that day, picking up a packet of savoury seaweed cakes on the way home."
    in: div_qj7vjy
    site: { size_m: [7000, 3500], layout: harbour, terminals: [container, container, container, container, oil] }
  - id: poi_4qa46y
    subtype: logistics_park
    status: generated
    names:
      zh: 埃鲁塔姆物流园
      en: Eruttam Logistics Park
      art-x-ivuran: Eruttam Lumavam
    notes:
      zh: "图拉凯港口高速另一端的物流园，冷库、仓库和分拣中心为全岛配送货物，集装箱卡车从码头直达，不必进入坎纳鲁尔老城。物流园的冷库里常年存着整箱的海藻饼和香料，瓦利凯人出远门必带的干粮也从这里发往全岛的商店。"
      en: "The logistics park at the far end of the Turakkai Port Expressway, whose cold stores, warehouses and sorting centres supply the whole island; container trucks come straight from the quays without entering the old town of Kannarur. Its cold stores always hold cases of seaweed cake and spices, and the travel food no Vallikkai person leaves home without is shipped from here to shops all over the island."
    in: div_0hrhwh
    offset_km: [0.5, 0.8]
    site: { layout: complex, size_m: [1600, 1000] }
  - id: bld_ypdanb
    subtype: museum
    status: generated
    names:
      zh: 坎纳鲁尔香料仓库博物馆
      en: Kannarur Spice Warehouse Museum
      art-x-ivuran: Kannarur Tiravam
    notes:
      zh: "坎纳鲁尔香料仓库博物馆在瓦利凯市老城坎纳鲁尔区的老港边，伊武兰语叫「Kannarur Tiravam」，由一座长约 200 米、宽约 120 米的石砌香料仓库改建而成。坎纳鲁尔区名意为「眼前的村」，骑楼街沿老港排开，香料仓库和老商行改作了餐馆和博物馆，清晨的鱼市和傍晚的海滨夜市是老城最热闹的时候。瓦利凯港扼守东西航线，古王国时代起，胡椒、豆蔻和肉桂就在这里装船运往远方；博物馆展出古王国以来的香料贸易、帆船模型和老商行的账簿，厚实的石墙让仓库里常年阴凉，至今飘着胡椒和肉桂的气味。瓦利凯地铁 1 号线的起点站以博物馆命名，从长夏真空磁悬浮的瓦利凯站坐一站就到。\n瓦利凯是领地雨水最多的城市，一年降水两千七百多毫米，从地铁站出来沿着骑楼的廊道就能走进博物馆，不用打伞。博物馆的茶室用老配方煮香料奶茶，豆蔻和肉桂当年就存放在这些仓库里；老城居民多讲伊武兰语南部方言，茶室里的老人一边喝茶一边用方言讲当年码头上扛香料包的日子。\n馆里有一面「闻香墙」，几十个小抽屉里装着不同的香料，游客拉开抽屉闻一闻，猜它的名字；本地的孩子常来比赛，据说最厉害的能一口气猜对三十种。"
      en: "The Kannarur Spice Warehouse Museum stands by the old harbour in Kannarur District, the old town of Vallikkai City; in Ivuran it is \"Kannarur Tiravam\", and it occupies a stone spice warehouse about 200 m long and 120 m wide. Kannarur's name means \"the village before your eyes\": arcaded streets line the old harbour, the spice warehouses and old trading houses have become restaurants and museums, and the old town is at its liveliest at the early-morning fish market and the evening night market by the sea. Vallikkai's harbour commands the east–west shipping lanes, and since the days of the old kingdom pepper, cardamom and cinnamon have been loaded here for distant ports; the museum shows the spice trade since the old kingdom, model sailing ships and the ledgers of the old trading houses, its thick stone walls keep it cool all year, and the scent of pepper and cinnamon still hangs in it. The first station of Vallikkai Metro Line 1 is named after the museum, one stop from Vallikkai Station on the Everlong Summer Vacuum Maglev.\nVallikkai is the rainiest city in the territory, with more than 2,700 mm of rain a year, and from the metro station you can walk along the arcades to the museum without an umbrella. The museum's tea room brews spiced milk tea to an old recipe, with the cardamom and cinnamon that were once stored in these very warehouses; most old-town residents speak the southern dialect of Ivuran, and the old people in the tea room reminisce in it about the days of carrying spice sacks on the quays.\nA \"scent wall\" of dozens of little drawers holds different spices, and visitors open them to sniff and guess the name; local children often come to compete, and the best of them, it is said, can name thirty in a row."
    in: div_3ytmrh
    offset_km: [0.4, 0.8]
    site: { layout: hall, size_m: [200, 120] }
  - id: bld_7cfdym
    subtype: marketplace
    status: generated
    names:
      zh: 马伦杜尔香料市场
      en: Marandur Spice Market
      art-x-ivuran: Marandur Mevalu
    notes:
      zh: "领地最大的香料集散地，大棚里堆满胡椒、豆蔻、肉桂和丁香，香料园的农户清早把货送来，批发商当天装车运往港口；出口前的香料都要在这里抽检。摊主们按祖传的方子现场调配香料，一个摊位常有几十种配方，每家的咖喱粉都不一样，熟客只认自家那一摊。香料园的老人们常说：「Kaina hevaru, oruka nalu」，意思是「香料乘风，船乘浪」。"
      en: "The territory's largest spice exchange, its sheds piled with pepper, cardamom, cinnamon and cloves; growers bring their crop at dawn and dealers load it for the ports the same day, and every lot is spot-checked here before export. Stallholders blend spices to order from family recipes, a single stall often keeping dozens of blends, so no two stalls' curry powder is alike and regulars buy from no one else. The old people of the spice gardens say \"Kaina hevaru, oruka nalu\": the spice rides the wind and the boat rides the waves."
    in: div_a3c8d6
    offset_km: [0.3, 0.4]
    site: { layout: market, size_m: [450, 300] }
  - id: poi_dcr3pv
    subtype: cultural_site
    status: generated
    names:
      zh: 佩伦达梯田
      en: Perunda Rice Terraces
      art-x-ivuran: Perunda Oluvatu
    wonder:
      zh: 世界最大的水稻梯田，从河谷一直修到海拔一千多米的山腰
      en: The largest rice terraces in the world, climbing from the valley floors to more than 1,000 m up the mountainsides
    notes:
      zh: "佩伦达梯田是世界最大的水稻梯田，从河谷一直修到海拔一千多米的山腰，伊武兰语名叫 Perunda Oluvatu，olu 意为「稻」。梯田在温达坎市东部的佩伦达区，区名意为「大台阶」，面积 3 万平方公里，14 万人，几乎每一面向阳的山坡上都是层层叠叠的水田。成千上万块田顺着等高线环绕山坡，有的不过一张桌子大，有的宽得能赶开水牛，最陡的地方田埂比田面还宽，田埂用石块和泥土垒成，灌溉水从山顶的森林流下，经过竹管和小渠一层层流过每块田，最后汇入谷底的哈努西鲁河。梯田的维护和用水由村社共同商定，哪块田先放水、哪段田埂该修，都在村里的议事棚里商量，代代相传；插秧和收割时节全村一起下田。\n温达坎市在蒂拉凯苏山脉中段，城名意为「台阶之地」，全市 50 万人，本地人约占八成，佩伦达区和西林达区的山坡上都是梯田，南边的乌拉韦劳自然保护区有领地最高的乌拉韦劳峰。梯田靠山顶的森林蓄水，村里的老人常念「Uvesa lomi, olu unda」，意思是「雨落进森林，稻长上台阶」，所以砍山顶的树在这里是最大的忌讳，每个村社都选出专人看护水源林。梯田里一年只种一季稻，田里同时养着鱼和鸭，鸭子吃虫，鱼粪肥田，收割时捉起的稻田鱼和新米一起装进竹筒烤成竹筒饭，是招待客人的大菜。梯田也是整个领地的象征：长夏群岛的领地旗下半就是绿色的梯田台阶，许多市徽也用了梯田的图案。塞洛高速从瓦利凯翻山经过佩伦达区，温达坎梯田公路在山坡间盘绕，温达坎是山城，不建地铁，游客多是自驾或坐长途车上山。\n插秧的日子，全村人在田里排成一行，跟着田埂上木鼓的节拍，一边唱一边后退着插秧，鼓手通常是村里最年长的人，鼓点快了慢了，全村人的手也跟着快慢。年轻人说，最怕的是老鼓手高兴起来越敲越快，一行人只好弯着腰跟着越插越快，插完一块田，腰都直不起来。山脚的村子相信乌拉韦劳峰顶的云是祖先在看护梯田，晴天看见峰顶露出来，就是下田的好日子。雨季的清晨，雾气从谷底升起，梯田一层层浮在云上；到了收割前，整面山坡变成金色，摄影的人天不亮就守在对面的山头上。收割以后，村社总要先把一份新米送给看护水源林的人，说是「先谢森林，再吃饭」。"
      en: "The Perunda Rice Terraces are the largest rice terraces in the world, climbing from the valley floors to more than 1,000 m up the mountainsides; olu in their Ivuran name, Perunda Oluvatu, means 'rice'. They lie in Perunda District in the east of Undakan City, whose name means 'great steps', a district of 30,000 km² and 140,000 people where nearly every sunward slope is stepped with paddies. Thousands of fields follow the contours round the slopes, some no bigger than a table, some wide enough to drive a buffalo across, and where the slope is steepest the banks are wider than the fields. The banks are built of stone and earth, and the water comes from streams from the forest above that run through bamboo pipes and little channels down through every field in turn, finally joining the Hanusiru River in the valley below. The village communities share the upkeep and the water, deciding in the village meeting shelter which field is watered first and which bank needs repair, as they have for generations, and the whole village turns out to plant and harvest.\nUndakan City lies in the middle of the Tirakesu Mountains; its name means 'land of steps', and of its 500,000 people about eight in ten are local Ivurans. The slopes of Perunda and Silinda Districts are terraced, and to the south the Uravelau Nature Reserve holds Mount Uravelau, the territory's highest peak. The terraces depend on the forest on the summits to store water, and the elders recite \"Uvesa lomi, olu unda\": the rain falls into the forest and the rice climbs the steps. Felling trees on the summits is therefore the greatest taboo here, and every village chooses someone to guard its watershed forest. The terraces grow one crop of rice a year, with fish and ducks raised in the paddies at the same time, the ducks eating the pests and the fish manuring the fields; at harvest the paddy fish are caught and roasted with the new rice in bamboo tubes, the great dish for guests. The terraces are also a symbol of the whole territory: the lower half of the Everlong Summer Islands' flag is green terraced steps, and many city arms carry terraces too. The Selo Expressway crosses the mountains from Vallikkai through Perunda District and the Undakan Terraces Road winds among the slopes; Undakan is a mountain city with no metro, and most visitors drive or come up by coach.\nOn planting days the whole village forms a line across the paddy and plants walking backwards, singing to the beat of a wooden drum on the bank, usually played by the oldest villager, and as the drum speeds up or slows down, so do all the village's hands. The young say what they dread most is the old drummer getting carried away and drumming faster and faster, so that the whole line, bent double, has to plant faster and faster to keep up, and by the end of a field nobody can straighten their back. The villages at the foot of the mountains believe the clouds on Mount Uravelau are the ancestors watching over the terraces, and a clear day when the summit shows is a good day to go into the fields. On wet-season mornings mist rises from the valley floor and the terraces float tier upon tier above the clouds; before the harvest the whole mountainside turns gold, and photographers wait on the facing hilltops before dawn. After the harvest the village always sends the first share of new rice to the watershed guardian: \"thank the forest first, then eat\"."
    in: div_w2pbh1
    offset_km: [-3.0, 2.0]
    site: { layout: park, size_m: [6000, 4000] }
  - id: bld_3ajjzv
    subtype: museum
    status: generated
    names:
      zh: 温达坎梯田博物馆
      en: Undakan Terrace Museum
      art-x-ivuran: Undakan Oluvatu Tiravam
    notes:
      zh: "温达坎梯田博物馆在温达坎市的城区坎达瓦区，伊武兰语叫「Undakan Oluvatu Tiravam」，是一座长约 180 米、宽约 120 米的展馆，介绍梯田的修筑、灌溉和村社的用水规矩。坎达瓦区在河谷里，区名意为「山间的门」，木结构的老房子沿山坡排开，梯田博物馆、农业学院和每周的山货集市都在这里，来看梯田的游客从这里换乘山区公交上山。温达坎城名意为「台阶之地」，佩伦达区和西林达区的梯田从河谷一直修到海拔一千多米的山腰，佩伦达梯田是世界最大的水稻梯田。展厅里讲述梯田怎样顺着等高线一层层修起，灌溉水怎样从山顶的森林流下、流过每一块田，村社怎样共同商定维护和分水；馆里陈列着村社用了几代的木鼓和刻着用水规矩的木板。馆外有一小片示范梯田，游客可以跟着村民插秧。\n梯田里一年只种一季稻，田里同时养着鱼和鸭，博物馆的小餐厅照村里的做法，把稻田鱼和新米装进竹筒烤成竹筒饭；墙上写着老人们常念的那句「Uvesa lomi, olu unda」，意思是「雨落进森林，稻长上台阶」。\n插秧季的周末，游客可以跟着鼓点在示范梯田里学倒退着插秧，鼓手通常是村里最年长的人，鼓点快了慢了，满田的人手也跟着快慢。"
      en: "The Undakan Terrace Museum stands in Kandava District, the town proper of Undakan City; in Ivuran it is \"Undakan Oluvatu Tiravam\", a hall about 180 m long and 120 m wide on how the terraces were built and watered and how the villages share their water. Kandava lies in a river valley, its name meaning \"gate in the mountains\"; old timber houses climb the slopes, the terrace museum, the agricultural college and a weekly hill-produce market are all here, and visitors bound for the terraces change here to the mountain buses. Undakan's name means \"place of steps\", and the terraces of Perunda and Silinda districts climb from the valley floors to more than 1,000 m up the mountainsides, the Perunda Rice Terraces being the largest rice terraces in the world. The galleries tell how the terraces were built tier by tier along the contours, how the water flows down from the forest on the heights through every field, and how the village communities agree together on upkeep and the sharing of water; on display are wooden drums used by the villages for generations and boards carved with the rules for sharing water. Outside is a small demonstration terrace where visitors can plant rice with the villagers.\nThe terraces grow one crop of rice a year, with fish and ducks raised in the paddies at the same time, and the museum's little restaurant follows village custom, baking paddy fish and new rice in bamboo tubes; on the wall is the elders' saying \"Uvesa lomi, olu unda\", \"rain falls into the forest, rice climbs the steps\".\nOn planting-season weekends visitors can learn to plant walking backwards to the drum in the demonstration terrace; the drummer is usually the oldest person in the village, and as the beat quickens or slows, every pair of hands in the field follows it."
    in: div_6cy2yw
    offset_km: [0.4, 1.2]
    site: { layout: hall, size_m: [180, 120] }

  # ── 洛米兰和纳卢迈：雨林、药用植物、植物园和珍珠 ──
  - id: poi_sdnwp3
    subtype: park
    status: generated
    names:
      zh: 塔卡维雨林树冠步道
      en: Takavi Canopy Walkway
      art-x-ivuran: Takavi Uralorai
    wonder:
      zh: 世界最长的雨林树冠步道，全长约 5 公里
      en: The longest rainforest canopy walkway in the world, about 5 km long
    notes:
      zh: "塔卡维雨林树冠步道是世界最长的雨林树冠步道，全长约 5 公里，在洛米兰市塔卡维区、洛米哈努国家公园的边缘，伊武兰语名叫 Takavi Uralorai，ura 意为「高」，lorai 意为「线」。步道由吊桥和树上平台连成，在离地几十米的树冠间蜿蜒，游客能看到犀鸟筑巢和猴群觅食；步道每天限量预约，由本地村社的向导带领。修建步道时没有砍一棵大树，平台像项圈一样环抱树干，用可以调节的宽带固定，不钉进树皮，大树长粗了，护林员就把带子放松一些；吊桥之间的跨度按树的位置来定，所以步道弯弯曲曲，从来没有一段是直的。沿途有十几处休息平台，最高的一处观鸟台建在一棵巨树的树冠里，能平视犀鸟的巢洞。\n塔卡维区的名字意为「树冠」，面积 2 万平方公里，6 万人，是国家公园边缘的生态旅游区，林边的生态旅馆由本地村社经营，向导、厨师和清洁工大多是附近村子的人。洛米兰市在主岛西北部，城名意为「森林之地」，全市 35 万人，面积 14 万平方公里，是领地面积最大的市，本地人约占七成五。洛米哈努国家公园管理区覆盖全市一半的土地，低地雨林、沼泽林和山地雨林连成一片，栖息着犀鸟、云豹、长臂猿和上千种兰花；雨林中的药用植物是长夏群岛生物医药研究的宝库，领地对采集和利用实行严格的许可和惠益分享。伊米穆高速从塔卡维区经过，塔卡维雨林树冠步道公路从高速出口通到步道入口，洛米兰不建地铁，游客多是开车来，或者在旅馆住下，第二天一早上步道。\n清晨走在步道上，脚下是一片云海，偶尔能看见长臂的猿从步道旁荡过。雨林里的犀鸟是洛米兰的象征，伊武兰语叫它 kuvala，向导说，犀鸟在午后成群叫起来，傍晚多半要下雨；犀鸟一生只认一个伴侣，所以本地的婚礼上，新人要互赠一根捡来的犀鸟羽毛，也有新人特地在步道的平台上办婚礼。洛米兰人常说「Lomi uvesa, uvesa lomi」，意思是「森林生雨，雨生森林」，向导讲到这里，常常请游客伸手摸一摸平台栏杆上的水珠，说那是树自己呼出来的雨。走完步道，林边的小馆里有采蜜人从大树上取下的野蜂蜜和用芭蕉叶包着香料和鱼烤成的叶包鱼，同一棵树一年只采一次蜜，采过的树都记在采蜜人的本子上。"
      en: "The Takavi Canopy Walkway is the longest rainforest canopy walkway in the world, about 5 km long, in Takavi District of Lomiran City on the edge of the Lomihanu National Park; in its Ivuran name, Takavi Uralorai, ura means 'high' and lorai 'line'. It is a chain of suspension bridges and tree platforms winding through the treetops tens of metres above the ground, where visitors can watch hornbills nesting and monkeys foraging; places are limited each day and walks are led by guides from the local villages. Not a single great tree was felled to build it: the platforms ring the trunks like collars, held by adjustable straps rather than nailed into the bark, and as the trees grow the forest wardens let the straps out a little; the spans of the bridges follow wherever the trees stand, so the walkway twists and turns and no stretch of it is straight. There are a dozen or more resting platforms along the way, and the highest, a bird hide built into the crown of a giant tree, looks straight across at a hornbill's nest hole.\nThe name of Takavi District means 'canopy'; it covers 20,000 km² with 60,000 people, an ecotourism district on the edge of the national park, where the eco-lodges at the forest edge are run by the local villages and most guides, cooks and cleaners come from the villages nearby. Lomiran City lies in the north-west of the main island; its name means 'land of forest', and with 350,000 people over 140,000 km² it is the largest city in the territory by area, about three-quarters of its people local Ivurans. The Lomihanu National Park Administration Zone covers half the city, an unbroken spread of lowland rainforest, swamp forest and montane rainforest home to hornbills, clouded leopards, gibbons and a thousand kinds of orchid; the rainforest's medicinal plants are a treasure house for the Everlong Summer Islands' biomedical research, and the territory strictly licenses their collection and use and requires the benefits to be shared. The Imimu Expressway passes through Takavi District and the Takavi Canopy Walkway Road runs from its exit to the walkway entrance; Lomiran has no metro, so most visitors drive, or stay at a lodge and go up onto the walkway early next morning.\nIn the early morning you walk above a sea of cloud, and now and then a long-armed ape swings past. The rainforest hornbill, kuvala in Ivuran, is Lomiran's emblem, and the guides say that when the hornbills call in flocks in the afternoon, rain is likely by evening; a hornbill keeps one mate for life, so at local weddings the couple exchange a hornbill feather found on the forest floor, and some couples even hold their weddings on the walkway's platforms. Lomiran people say \"Lomi uvesa, uvesa lomi\", meaning 'the forest makes rain and the rain makes forest', and at this point the guides often ask visitors to touch the drops of water on the platform rails, saying it is rain the trees have breathed out themselves. At the end of the walk, the little eateries at the forest edge serve wild honey taken from the great trees by honey hunters and fish baked with spices in plantain leaves; each tree is tapped for honey only once a year, and every tree that has been is written down in the honey hunter's notebook."
    in: div_a5rwcq
    offset_km: [0.5, 3.0]
    site: { layout: park, size_m: [3000, 800] }
  - id: poi_3hy3jb
    subtype: research_institute
    status: generated
    names:
      zh: 洛米兰药用植物研究所
      en: Lomiran Institute of Medicinal Plants
      art-x-ivuran: Lomiran Kilavam
    notes:
      zh: "卢瓦纳区的研究所，研究雨林中的药用植物，为领地的生物医药研究提供样本；采集要经许可，利用所得的收益按惠益分享规则分给当地村社。研究所的标本馆里存着上万份雨林植物标本，每一份都写着采集村社的名字。采药人和研究员一起进山时，要先在林边念一句「Lomi uvesa, uvesa lomi」，意思是「森林生雨，雨生森林」。"
      en: "The institute in Luvana District that studies the medicinal plants of the rainforest and supplies samples for the territory's biomedical research; collecting needs a permit, and the benefits are shared with the local villages under the territory's rules. Its herbarium holds tens of thousands of rainforest specimens, each labelled with the community where it was gathered. When gatherers and researchers go into the forest together they first say at its edge \"Lomi uvesa, uvesa lomi\": the forest makes the rain and the rain makes the forest."
    in: div_pgh98w
    offset_km: [0.5, 0.6]
    site: { layout: campus, size_m: [500, 350] }
  - id: poi_aebagb
    subtype: botanic_garden
    status: generated
    names:
      zh: 维兰塔植物园
      en: Viranta Botanic Garden
      art-x-ivuran: Viranta Lomitaram
    wonder:
      zh: 世界最大的植物园，收集了热带各地的数万种植物
      en: The largest botanic garden in the world, with tens of thousands of plant species from across the tropics
    notes:
      zh: "维兰塔植物园是世界最大的植物园，收集了热带各地的数万种植物，伊武兰语名叫 Viranta Lomitaram。它在纳卢迈市维兰塔区，园区东西约 2.4 公里、南北约 1.6 公里，分成雨林、兰花、香料、棕榈和水生植物等园区，种质圃里活体保存着领地的各种作物和野生植物，稻种、果树、香料和药用植物都种在地里、一代代繁育，而不是封存起来。研究人员在这里培育抗病的稻种和果树，园区向公众免费开放，是领地的植物研究中心。香料园里胡椒藤攀在遮阴树上，豆蔻长在林下，肉桂和丁香种在向阳的坡上，走一圈就能闻遍领地出口的各种香料；棕榈园里从贴地生长的矮棕到几十米高的大王椰都有。\n维兰塔区的名字意为「花园」，面积 8000 平方公里，6 万人，大半是丘陵、果园和村庄，植物园是区里最大的单位。纳卢迈市在主岛西北海岸东段，城名意为「浪中的珍珠」，全市 60 万人，本地人近八成：迈卢阿区沿海的珍珠贝养殖场出产领地有名的白珍珠，帕兰图区的平原上是芒果、榴莲和菠萝蜜的果园，纳卢西鲁河从丘陵流下，在城区入海。植物园和这些果园、稻田连成一体，园里培育的果苗和稻种由合作社试种，再推广到全领地的梯田和果园；领地种稻、香料、可可、咖啡和热带水果，但不种油棕，园里也没有油棕的试验田。雨林园的许多药用植物引种自洛米兰的雨林，采集和利用都要领许可、与当地村社分享收益，研究成果也提供给长夏群岛热带医学研究院。纳卢高速从维兰塔区经过，从萨伦纳姆和纳卢迈城区开车来都方便。\n园里的研究员每到周末给游客讲解，哪些果树是从远方引种来的，哪些是长夏群岛土生土长的，讲到兴头上，常常从树上摘一个果子请大家尝。兰花园里有一种只在晨雾里开放的白兰花，太阳一出来就合上，是游客清早排队来看的，园门因此在旱季的早晨提前一个小时开。水生植物园的大睡莲叶子能托起一个小孩，每年有一天，园里请孩子们轮流坐在叶子上拍照，报名的队伍从园门排到停车场。本地人家孩子出生时会挑一颗白珍珠收起来，不少人家也会在同一年到植物园领一棵果苗种在院子里，说珍珠和树要陪着孩子一起长大。园里最老的一棵榴莲树据说比纳卢迈的许多老房子年纪还大，每到榴莲季，树下拉起一圈绳子，防止熟透的果子砸到游客。"
      en: "The Viranta Botanic Garden is the largest botanic garden in the world, with tens of thousands of plant species from across the tropics; its Ivuran name is Viranta Lomitaram. It lies in Viranta District of Nalumai City, about 2.4 km from east to west and 1.6 km from north to south, divided into rainforest, orchid, spice, palm and water-plant gardens, and its living collection holds every crop and many wild plants of the territory: rice, fruit trees, spices and medicinal plants are grown in the ground and propagated generation after generation rather than kept in storage. Its researchers breed disease-resistant rice and fruit trees, entry is free, and it is the territory's centre of plant research. In the spice garden pepper vines climb the shade trees, cardamom grows beneath them and cinnamon and cloves stand on the sunny slopes, so that one walk round lets you smell every spice the territory exports; the palm garden runs from dwarf palms that hug the ground to royal palms tens of metres tall.\nThe name of Viranta District means 'garden'; it covers 8,000 km² with 60,000 people, mostly hills, orchards and villages, and the garden is its largest institution. Nalumai City lies on the eastern part of the north-west coast of the main island; its name means 'pearl in the waves', and of its 600,000 people nearly eight in ten are local Ivurans. The pearl-oyster farms on the coast of Mailua District produce the territory's famous white pearls, the plain of Parantu District is given over to orchards of mango, durian and jackfruit, and the Nalusiru River comes down from the hills to reach the sea in the city itself. The garden is woven into these orchards and paddies: the seedlings and rice it breeds are tried out by co-operatives and then spread to terraces and orchards across the territory. The territory grows rice, spices, cocoa, coffee and tropical fruit but no oil palm, and the garden has no oil-palm trial plots either. Many of the medicinal plants in the rainforest garden were brought from the rainforest of Lomiran, collected and used under permit with the benefits shared with the local villages, and the research is passed on to the Everlong Summer Islands Institute of Tropical Medicine. The Nalu Expressway passes through Viranta District, making it an easy drive from Sarunnam and from Nalumai itself.\nAt weekends its researchers show visitors which fruit trees were brought from far away and which are native to the Everlong Summer Islands, and when they get carried away they often pick a fruit from the tree for everyone to taste. The orchid garden has a white orchid that opens only in the morning mist and closes as soon as the sun comes out, for which visitors queue at dawn, so the gates open an hour early on dry-season mornings. The giant water-lily leaves in the water-plant garden can hold up a small child, and one day each year children take turns sitting on them to be photographed, with a queue stretching from the gate to the car park. When a child is born, local families put aside a white pearl from that season's harvest, and many also collect a fruit seedling from the garden that year to plant in the yard, saying the pearl and the tree will grow up with the child. The oldest durian tree in the garden is said to be older than many of Nalumai's old houses, and in durian season a rope is strung round it so that no ripe fruit lands on a visitor."
    in: div_a349sd
    offset_km: [0.3, 1.0]
    site: { layout: park, size_m: [2400, 1600] }
  - id: bld_7z2anq
    subtype: marketplace
    status: generated
    names:
      zh: 塞纳卢珍珠市场
      en: Senalu Pearl Market
      art-x-ivuran: Senalu Maimevalu
    notes:
      zh: "纳卢迈海滨大道边的珍珠市场，迈卢阿湾出产的白珍珠在这里分级、拍卖和零售，每颗珍珠都附有产地和等级证书。按纳卢迈的习俗，孩子出生时家人会从那一季的收成里挑一颗白珍珠收起来，等孩子成年时串成项链或镶成戒指，许多人家就是在这里为孩子挑下那一颗。"
      en: "The pearl market on Nalumai's seafront, where the white pearls of Mailua Bay are graded, auctioned and sold, each with a certificate of origin and grade. By Nalumai custom, when a child is born the family sets aside a white pearl from that season's harvest to be strung or set in a ring when the child comes of age, and many families choose that pearl here."
    in: div_afy2b3
    offset_km: [0.8, 0.3]
    site: { layout: market, size_m: [300, 200] }
  - id: poi_chg63r
    subtype: industrial_park
    status: generated
    names:
      zh: 迈卢阿珍珠贝养殖场
      en: Mailua Pearl Farm
      art-x-ivuran: Mailua Maitaram
    notes:
      zh: "迈卢阿湾的珍珠贝养殖场，海湾里挂满养殖笼，岸上是育苗场和开贝车间；海湾水质按月监测，养殖密度有上限。采珠人有一句老话：「Nalu kila, mai kila」，意思是「浪亮的时候，珍珠也亮」，风平浪静、阳光透进海里的日子才下海看贝，阴天风大就在岸上补网。"
      en: "The pearl oyster farm of Mailua Bay, its cages hung all over the bay, with a hatchery and opening sheds on shore; the bay's water is tested monthly and stocking is capped. The pearl farmers have an old saying, \"Nalu kila, mai kila\", when the waves shine, so do the pearls: they dive to check the oysters only on calm days when sunlight reaches down into the sea, and mend nets ashore when it is dull and windy."
    in: div_pfrpr2
    offset_km: [0.5, 0.4]
    site: { layout: complex, size_m: [400, 250] }

  # ── 基拉努和塔卢马兰：半导体、船厂、深水港和电池 ──
  - id: poi_71shr6
    subtype: industrial_park
    status: generated
    names:
      zh: 努维拉半导体产业园
      en: Nuvila Semiconductor Park
      art-x-ivuran: Nuvila Kilakaruvam
    notes:
      zh: "基拉努的半导体产业园，十多座晶圆厂、封装测试厂和光刻胶、特种气体等配套工厂沿规划路网排开；园区有自己的变电站和超纯水厂，废水排放由领地实时监测。本地人爱开玩笑说，基拉努的沙子一半在海滩上，一半在这里的晶圆里。工程师们下班后最常去海边的排球场和夜市，摊主们早就习惯了客人边吃边讨论电路图。"
      en: "Kilanu's semiconductor park, a dozen and more wafer fabs, packaging and test plants and suppliers of photoresists and specialty gases laid out along a planned grid, with its own substation and ultrapure water plant; its wastewater is monitored by the territory in real time. Locals joke that half of Kilanu's sand is on the beach and the other half in the wafers made here. After work the engineers head for the beach volleyball courts and the night markets, where stallholders are long used to customers arguing over circuit diagrams as they eat."
    in: div_qr8ay4
    offset_km: [0.5, -1.5]
    site: { layout: complex, size_m: [3000, 2000] }
  - id: poi_jv3554
    subtype: university
    status: generated
    names:
      zh: 基拉努理工大学
      en: Kilanu University of Technology
      art-x-ivuran: Kilanu Saluvam
    notes:
      zh: "基拉努理工大学在基拉努特别自治市的埃莱努区，区名在伊武兰语里意为「学习的岸」。校园占地约 1200 × 800 米，以集成电路、材料和软件见长，与努维拉半导体产业园的企业共建实验室，学生在读期间就进晶圆厂和封装测试厂实习，毕业生多留在基拉努工作。埃莱努区有 33 万人，居民普遍年轻，65 岁以上的老人不到一成。领地的大学教育免费；依照特别自治市宪章，市里在领地的移民配额内自行审批工程师的居留许可，从世界各地来求学的毕业生留下工作也方便。埃莱努区成片的公寓楼住着年轻的工程师家庭，区内的国际学校用中文、英文和伊武兰语三种语言教学，教授的孩子和产业园工程师的孩子常常是同学。\n毕业季有个传统：毕业生在海滩上用白沙堆一块巨大的「芯片」，再在上面用贝壳摆出自己的名字，涨潮时一起看海水把它带走。基拉努的石英砂白得晃眼，赤脚踩上去会吱吱作响，新生的第一堂课常常就在海滩上，教授捧起一把沙说：「你们以后的工作，就是把它变成芯片。」实验室的灯常常亮到深夜，学生们收工后去努维拉区的夜宵摊，点一份塞满香料的烤鱼，边吃边接着讨论电路图。"
      en: "Kilanu University of Technology lies in Elenu District of the Special Autonomous City of Kilanu, a name that means \"shore of learning\" in Ivuran. Covering about 1,200 × 800 m, it is known for integrated circuits, materials and software and shares laboratories with firms in the Nuvila Semiconductor Park; students do placements in the wafer fabs and packaging and test plants while still studying, and most graduates stay in Kilanu. Elenu District has 330,000 people and a young population, with fewer than one in ten aged over 65. University education in the territory is free, and under the city's charter Kilanu grants engineers' residence permits itself within the territory's migration quota, which makes it easy for graduates who came from around the world to stay on and work. Blocks of flats across Elenu District house young engineers' families, the district's international schools teach in Chinese, English and Ivuran, and professors' children and park engineers' children are often classmates.\nIt has a graduation custom: the graduates build a giant \"chip\" of white sand on the beach, lay out their names on it in shells, and watch together as the tide carries it away. Kilanu's quartz sand is dazzlingly white and squeaks underfoot, and freshers' first class is often held on the beach, where a professor scoops up a handful and says: \"Your job from now on is to turn this into chips.\" The laboratory lights often burn late into the night, and when they finish students head for the late-night stalls of Nuvila District for spice-stuffed grilled fish, still arguing over circuit diagrams as they eat."
    in: div_07wzvt
    offset_km: [-1.0, 0.5]
    site: { layout: campus, size_m: [1200, 800] }
  - id: poi_39nbzf
    subtype: airport
    status: generated
    names:
      zh: 基拉努国际机场
      en: Kilanu International Airport
      art-x-ivuran: Kilanu Ulavan
    notes:
      zh: "基拉努国际机场在基拉努特别自治市的佩萨维区，区名在伊武兰语里意为「出发」。机场占地约 3600 × 1200 米，一条约 4.5 公里的机场公路把它和城区相连。依照《基拉努特别自治市宪章》，机场和港口都是保税区；货运区专门处理芯片等高价值货物，恒温仓库与跑道之间有封闭通道，努维拉半导体产业园的晶圆厂和封装测试厂生产的芯片从这里空运到世界各地。同在佩萨维区的还有集装箱码头和化学品码头，物流园沿高速公路排开，空运和海运在这里交接。客运航站楼每天迎来送往大批工程师和他们的家人，全市移民约占六成五，许多人来自中国其他省份，入境大厅用中文、英文和伊武兰语三种语言指路。\n航站楼的地面铺着基拉努本地的白色石英砂磨成的水磨石，旅客走在上面常低头看，本地人说「基拉努的沙子从机场就开始唱歌了」。货运区是全机场最安静也最忙碌的地方：装芯片的货箱一路在恒温恒湿中送上飞机，搬运车只走封闭通道，一粒灰尘都不能沾。夜里货运航班起降最多，下夜班的装卸工常结伴去努维拉区的夜宵摊，点一份海鲜炒河粉，边吃边算今晚又送走了多少箱芯片。"
      en: "Kilanu International Airport lies in Pesavi District of the Special Autonomous City of Kilanu, a name that means \"departure\" in Ivuran. The airport covers about 3,600 × 1,200 m, and an airport road of about 4.5 km links it with the city. Under the Charter of the Special Autonomous City of Kilanu the airport and the port are both bonded zones; the cargo area specialises in chips and other high-value freight, with sealed passages between its climate-controlled warehouses and the apron, and the chips made by the wafer fabs and packaging and test plants of the Nuvila Semiconductor Park are flown from here all over the world. Pesavi District also holds a container terminal and a chemicals terminal, logistics parks line the expressway, and air and sea freight change hands here. The passenger terminal sees streams of engineers and their families come and go every day; about 65 per cent of the city's people are migrants, many from other provinces of China, and the arrivals hall gives directions in Chinese, English and Ivuran.\nThe terminal floor is terrazzo ground from Kilanu's own white quartz sand, and travellers often look down at it as they walk; locals say \"Kilanu's sand starts singing at the airport\". The cargo area is the quietest and the busiest part of the airport: crates of chips travel all the way to the aircraft at constant temperature and humidity, the tugs keep to the sealed passages, and not a speck of dust may touch them. Cargo flights are busiest at night, and loaders coming off the night shift often head together to the late-night stalls of Nuvila District for a plate of seafood fried rice noodles, working out over their food how many crates of chips they have sent off that night."
    in: div_yah63b
    offset_km: [-5.0, 3.0]
    site: { size_m: [3600, 1200], layout: airport, angle_deg: 40 }
  - id: poi_a04p2n
    subtype: port
    status: generated
    names:
      zh: 塞拉努深水港
      en: Seranu Deep Water Port
      art-x-ivuran: Seranu Talusam
    notes:
      zh: "塞拉努深水港在塔卢马兰市的塞拉努区，区名在伊武兰语里意为「深水」，位于塔卢马兰湾外侧。港区占地约 6500 × 3500 米，集装箱码头、汽车滚装码头和液化气接收站沿湾口展开，是领地最大的集装箱港之一。港区实行全自动化装卸，无人集卡在码头和堆场之间往来；伊拉坦区的电池厂和新能源车厂生产的电池和电动车从这里装船出口，零部件和原料也从这里运进工厂。塞拉努港口高速从码头出发，经塔卢区和伊拉坦区到内陆的帕达兰区接上伊米穆高速，全线最长的是约 10 公里的塞拉努高架桥；同城伦博船厂建造的集装箱船和液化气船，交付后也常在这里靠港。\n码头工人有自己的口令，一半中文一半英语，还夹着几个伊武兰语词，外人很难听懂；全市移民约占三分之二，码头上的人来自领地各地和世界各国，这套口令据说就是几代工人你一句我一句凑出来的。新车下线后经港口高速直送码头，车头上常常还挂着工人放的一朵鸡蛋花，装船时滚装船的水手会把花取下来，别在自己的帽子上。下班后，工人们去码头夜市吃一碗椰浆咖喱鱼配米饭，那是夜市里卖得最好的一道菜。"
      en: "Seranu Deep Water Port lies in Seranu District of Talumaran City, a name that means \"deep water\" in Ivuran, on the outer side of Talumaran Bay. Covering about 6,500 × 3,500 m, it has container berths, a ro-ro car terminal and an LNG terminal along the bay mouth, and is one of the territory's largest container ports. Handling is fully automated, with driverless trucks between quay and stacks; the batteries and electric cars made by the battery and electric-car plants of Ilatan District are shipped out from here, and parts and materials come in for the plants the same way. The Seranu Port Expressway starts at the quays and runs through Talu and Ilatan districts to inland Padaran District, where it joins the Imimu Expressway; its longest structure is the Seranu Viaduct of about 10 km. Container ships and gas carriers built at the city's Lumbo Shipyard often call here after delivery too.\nThe dockers have their own calls, half Chinese, half English, with a few Ivuran words thrown in, which outsiders can barely follow; two in three of the city's people are migrants, the quays draw workers from all over the territory and the world, and the calls are said to have been pieced together a word at a time by generations of dockers. New cars go straight from the line to the docks along the port expressway, often still carrying the frangipani flower the workers placed inside, and at loading the ro-ro sailors take the flowers and tuck them into their caps. After work the dockers go to the night market by the docks for a bowl of coconut curry fish with rice, the best seller in the market."
    in: div_hceeaa
    site: { size_m: [6500, 3500], layout: harbour, terminals: [container, container, container, roro, oil] }
  - id: poi_68bkaz
    subtype: factory
    status: generated
    names:
      zh: 伦博船厂
      en: Lumbo Shipyard
      art-x-ivuran: Lumbo Talukaru
    notes:
      zh: "伦博区的船厂，干船坞和龙门吊沿海湾排开，建造集装箱船、液化气运输船、海上风电安装船和海洋平台；周围是钢结构、船用发动机和电子设备的配套工厂。每有新船下水，船头都要挂一串鸡蛋花编成的花环，工人们相信花环在海上漂得越远，这条船的航程就越顺。"
      en: "The shipyard of Lumbo District, its dry docks and gantry cranes lined along the bay, building container ships, gas carriers, offshore wind installation vessels and ocean platforms, with steelwork, marine engine and electronics suppliers around it. Whenever a new ship is launched a garland of frangipani is hung on her bow, and the workers believe the further it drifts at sea, the smoother her voyages will be."
    in: div_yakrhd
    offset_km: [2.7, -1.8]
    site: { size_m: [1400, 1100], layout: port }
  - id: poi_k3h7vk
    subtype: factory
    status: generated
    names:
      zh: 伊拉坦电池厂
      en: Ilatan Battery Works
      art-x-ivuran: Ilatan Vilakaru
    notes:
      zh: "伊拉坦区的电池厂，正极材料、电芯和电池包在同一厂区生产，原料是乌诺维拉真空磁悬浮重载铁路运来的镍盐和钴盐；厂房屋顶铺满太阳能板，废旧电池在旁边的回收车间拆解再生。厂区门口立着一块电子牌，滚动显示当天下线的电池包数量，工人们换班时都习惯抬头看一眼，说这是「今天给多少辆车装上了心脏」。"
      en: "The battery works of Ilatan District, making cathode materials, cells and packs on one site from the nickel and cobalt salts brought by the Unovila heavy-haul railway; its roofs are covered in solar panels, and spent batteries are taken apart and recycled in the workshop next door. A screen at the gate scrolls the number of battery packs finished that day, and workers glance up at it at every shift change: \"how many cars got a heart today\"."
    in: div_3e94sq
    offset_km: [-1.0, 1.0]
    site: { layout: complex, size_m: [2000, 1200] }
  - id: poi_kyp1y2
    subtype: factory
    status: generated
    names:
      zh: 伊拉坦新能源车厂
      en: Ilatan Electric Vehicle Plant
      art-x-ivuran: Ilatan Vesukaru
    notes:
      zh: "电池厂旁的整车厂，冲压、焊装、涂装和总装连成一线，新车经塞拉努港口高速直送码头装船。塔卢马兰的出租车和公交车几乎都是这里造的电动车，司机们爱跟乘客炫耀：「电池里的镍是乌诺卡里挖的，车是我们这儿造的。」每辆新车下线时，总装线尽头的工人会在车里放一朵鸡蛋花。"
      en: "The car plant beside the battery works, with pressing, body, paint and assembly shops in one line; new cars go straight down the Seranu Port Expressway to the quays. Nearly all Talumaran's taxis and buses are electric cars built here, and drivers like to boast that \"the nickel in the battery was dug in Unokari and the car was made right here\". As each new car leaves the line, the workers at the end of final assembly leave a frangipani flower inside."
    in: div_3e94sq
    offset_km: [1.4, -1.2]
    site: { layout: complex, size_m: [2000, 1200] }
  - id: poi_q4dz65
    subtype: airport
    status: generated
    names:
      zh: 塔卢马兰机场
      en: Talumaran Airport
      art-x-ivuran: Talumaran Ulavan
    notes:
      zh: "塔卢马兰机场在塔卢马兰市北部的伊拉坦区，位于区内北面，场区约 3200 × 1000 米，有航班飞往萨伦纳姆、米雷兰和基拉努，货运航班运送电池和船用零部件。伊拉坦区是全市的新能源产业区，区名在伊武兰语里意为「新的田」，伊拉坦电池厂和新能源车厂都在区内，急需的电芯样品和精密零件常常搭货运航班送往各地；伦博船厂也靠这里空运船用发动机和电子设备的配件。地铁 3 号线设有塔卢马兰机场站，乘客几站就能到伊拉坦的厂区，塞拉努港口高速也从区内经过。伊拉坦区有 30 万人，第二产业占全区产值的六成以上。全市移民约占三分之二，劳动年龄人口比例高，航班上多是来报到的年轻工人和出差的工程师。\n到达大厅里挂着一句伊武兰语「Talu oruka, maran tola」，意思是「船停下的地方，就是家」，三分之二的塔卢马兰人当初都是从这里第一次踏上这座城市的。厂里每批新工人到岗，老员工常举着写有名字的纸牌来接机，接完人一起去码头夜市吃第一顿饭。机场门前排队的出租车几乎全是伊拉坦造的电动车，司机会顺口告诉新来的人：「你坐的这辆车，说不定就是你以后要造的。」"
      en: "Talumaran Airport lies in Ilatan District in the north of Talumaran City, towards the north of the district; its site covers about 3,200 × 1,000 m, with flights to Sarunnam, Mirelan and Kilanu and cargo flights carrying batteries and ship parts. Ilatan is the city's new-energy industrial district, its name meaning \"new field\" in Ivuran, and the Ilatan Battery Works and the Ilatan Electric Vehicle Plant both stand within it; urgently needed cell samples and precision parts often go out on cargo flights, and the Lumbo Shipyard also relies on the airport for air-freighted spares for marine engines and electronics. Metro Line 3 has a Talumaran Airport station, a few stops from the Ilatan plants, and the Seranu Port Expressway also passes through the district. Ilatan District has 300,000 people, and industry accounts for more than 60 per cent of its output. Two in three of the city's people are migrants and a high share are of working age, so the flights are full of young workers reporting for work and engineers on business.\nThe arrivals hall bears the Ivuran words \"Talu oruka, maran tola\", where the boat stops, there is home; two in three Talumaran residents first set foot in the city here. Whenever a new batch of workers starts at the plants, older hands often meet them at arrivals holding up name cards, and then take them to the night market by the docks for their first meal. The taxis queuing outside are nearly all electric cars built in Ilatan, and drivers like to tell newcomers: \"This car you're riding in might be one you'll be building."
    in: div_3e94sq
    offset_km: [4.0, 4.0]
    site: { size_m: [3200, 1000], layout: airport, angle_deg: 50 }

  # ── 乌诺卡里市：从镍矿到冶炼厂和矿石港 ──
  - id: poi_x53jfj
    subtype: mine
    status: generated
    names:
      zh: 乌诺维拉镍钴矿
      en: Unovila Nickel and Cobalt Mine
      art-x-ivuran: Unovila Unotam
    notes:
      zh: "乌诺凯苏山脉中的露天红土镍矿，开采镍和钴，矿石由乌诺维拉真空磁悬浮重载铁路运往佩鲁诺冶炼厂；采完的台阶随即复绿，尾矿全部回填。矿工们会在自己种下的复绿树苗上挂一块小木牌，写上名字和班组，矿区里因此有了一片片以班组命名的「矿工林」。"
      en: "An open-pit laterite mine in the Unokesu Mountains producing nickel and cobalt, whose ore goes by the Unovila heavy-haul railway to the Peruno smelter; worked-out benches are replanted at once and all tailings are backfilled. Miners hang a small wooden tag with their name and crew on each sapling they plant on the restored benches, so the mine is dotted with \"miners' woods\" named after their crews."
    in: div_6z737x
    offset_km: [-4.0, -5.0]
    site: { layout: mine, size_m: [4000, 2800] }
  - id: poi_7f58bt
    subtype: factory
    status: generated
    names:
      zh: 佩鲁诺冶炼厂
      en: Peruno Smelter
      art-x-ivuran: Peruno Unokaru
    notes:
      zh: "佩鲁诺区的高压酸浸冶炼厂，把红土镍矿炼成电池级的硫酸镍和硫酸钴，再由重载铁路运往塔卢马兰的电池厂；用山区水电站的电力，废渣处理后回填矿坑。红土把这里的一切染成了赭红色，工人下班时连眉毛都是红的，佩鲁诺区的澡堂一到傍晚就排起长队，本地人管这叫「洗红」。"
      en: "The high-pressure acid leach smelter of Peruno District, turning laterite ore into battery-grade nickel and cobalt sulphate for the Talumaran battery works by heavy-haul rail; it runs on mountain hydropower, and its residue is treated and returned to the pits. The red laterite stains everything ochre, workers come off shift red to the eyebrows, and by evening there are queues at the Peruno bathhouses for what locals call \"washing off the red\"."
    in: div_4m0x2v
    offset_km: [1.0, 1.0]
    site: { layout: complex, size_m: [1800, 1000] }
  - id: poi_yhc3jg
    subtype: port
    status: generated
    names:
      zh: 贝卢阿矿石港
      en: Belua Ore Port
      art-x-ivuran: Belua Unotalusam
    notes:
      zh: "贝卢阿矿石港在乌诺卡里市的贝卢阿区，是这座山中矿城的出海口，区名在伊武兰语里意为「海门」。港区占地约 4000 × 2500 米，有两个散货码头和一处油品泊位，乌诺卡里的镍产品在这里装船外运，封闭式的皮带廊和仓库防止粉尘外泄。乌诺维拉矿区开采红土镍矿和钴，佩鲁诺冶炼厂把矿石炼成电池级的镍盐，一部分由重载铁路运往塔卢马兰的电池厂，一部分从这里装船运往各地。约 6 公里长的港口公路把码头接上贝卢阿公路，向内陆经霍拉坦区和佩鲁诺区通往城区卡里纳。贝卢阿区面积 3 万平方公里，只有 11 万人，港外的海岸是渔村和椰林，领地按月监测港区周边的海水和空气。港口航运、采矿采石和渔业是贝卢阿区的主要行业。\n山谷里的雾气傍晚从山脊上漫下来，港口的灯光在雾里一闪一闪，像一船停在山谷口的星星。港口的工人很多住在附近的渔村，下了班换上拖鞋，就去椰林边的小摊吃一碗辣椒酸汤配米粉；渔民们爱拿港里的人开玩笑，说他们「一辈子跟石头打交道，却守着一片海」。装船时节，远洋货轮在港外排队等泊位，渔船从它们中间穿过，像一群小鱼游过鲸群。"
      en: "Belua Ore Port lies in Belua District of Unokari City and is the mountain mining city's outlet to the sea; the district's name means \"sea gate\" in Ivuran. Covering about 4,000 × 2,500 m, it has two bulk berths and an oil berth, Unokari's nickel products are shipped from here, and enclosed conveyors and sheds keep the dust in. The Unovila mining zone works laterite nickel and cobalt, and the Peruno Smelter refines the ore into battery-grade nickel salts, part of which goes by heavy-haul railway to the battery works of Talumaran and part of which is shipped from here to other destinations. A port road of about 6 km joins the quays to the Belua Road, which runs inland through Horatan and Peruno districts to the city district of Karina. Belua District covers 30,000 km² but has only 110,000 people; beyond the port the coast is fishing villages and coconut groves, and the territory checks the sea water and air around the port every month. Shipping, mining and quarrying and fishing are Belua District's main industries.\nIn the evening mist pours down from the ridges, and the port's lights blink through it like a boatload of stars moored at the valley mouth. Many of the port's workers live in the nearby fishing villages; after work they change into flip-flops and go to the stalls by the coconut groves for a bowl of chilli sour soup with rice noodles, and the fishermen like to tease them as people who \"spend their lives dealing in stone, yet keep watch over the sea\". In the loading season ocean-going freighters queue offshore for a berth, and the fishing boats slip between them like a shoal of little fish swimming through a pod of whales."
    in: div_w7bas1
    site: { size_m: [4000, 2500], layout: harbour, terminals: [bulk, bulk, oil] }

  # ── 埃武托拉公社：人民宫、公社大食堂、公社图书馆和环形公社住宅 ──
  - id: poi_103zvy
    subtype: plaza
    status: generated
    names:
      zh: 埃武托拉人民广场
      en: Evutola People's Square
      art-x-ivuran: Ondavu Evutola
    notes:
      zh: "埃武托拉人民广场在埃武托拉公社哈马图区的中心，伊武兰语叫「Ondavu Evutola」，长约 500 米、宽约 350 米，人民宫、公社大食堂和公社图书馆围在四周。哈马图区名意为「一起」，街道从广场向四周放射，通往各处的住宅区。人民宫是一座圆顶建筑，议事大厅能坐下上万人，公社委员会和居民议事会在这里开会，平时大厅也开放给居民开会、演出和办婚礼；广场东侧的公社大食堂是世界最大的公共食堂，一次可供三万人同时用餐，一日三餐和夜宵都免费；西侧的公社图书馆是世界最大的公共图书馆，图书、工具和乐器都可以免费借用。居民议事会表决的结果在广场上公布，免费的电车和公共汽车从广场通向各区，埃武托拉地铁 1 号线也有一站以公社大食堂命名。公社每周工作四天，第五天广场上满是去图书馆和菜园做义工的人。\n广场上有一座大棚，公社大会就在棚下召开，会开得再长，中间也一定会停下来，大家一起吃一顿大食堂送来的点心。每周的「周五菜」投票结果也贴在广场边，有一道椰浆焖鱼连着许多周高票当选，后来干脆进了菜单的固定栏目。\n居民们见面常用一句半开玩笑的话互相问候：「Tola evu, evu tola」，意思是「家是大家的，大家是一家」。"
      en: "Evutola People's Square is at the heart of Hamatu District in the Evutola Commune; in Ivuran it is \"Ondavu Evutola\", about 500 m long and 350 m wide, surrounded by the People's Palace, the Commune Canteen and the Commune Library. Hamatu's name means \"together\", and its streets radiate from the square to the housing all around. The People's Palace is a domed building whose assembly hall seats more than ten thousand; the commune committee and the residents' assemblies meet here, and at other times the hall is open to residents for meetings, performances and weddings. The Commune Canteen on the east side of the square is the largest public canteen in the world, seating thirty thousand at once, with three meals a day and a late-night meal all free, and the Commune Library on the west side is the largest public library in the world, lending books, tools and instruments free of charge. The votes of the residents' assemblies are announced on the square, free trams and buses leave from here for every district, and Evutola Metro Line 1 has a station named after the Commune Canteen. The commune works a four-day week, and on the fifth day the square is full of people on their way to volunteer at the library and the vegetable gardens.\nThe commune assembly meets under the great awning on the square, and however long the meeting runs it always breaks for snacks sent over from the canteen. The results of each week's vote on the \"Friday dish\" are posted at the edge of the square too; one coconut braised fish won week after week until it was simply given a permanent place on the menu.\nResidents greet each other with a half-joking \"Tola evu, evu tola\": home belongs to everyone, and everyone is one family."
    in: div_p3x7j4
    offset_km: [0, 0]
    site: { layout: plaza, size_m: [500, 350] }
  - id: bld_6cpsre
    subtype: government
    status: generated
    names:
      zh: 埃武托拉人民宫
      en: Evutola People's Palace
      art-x-ivuran: Evu Arakam
    notes:
      zh: 公社委员会和居民议事会开会的地方，圆形的议事大厅能坐下上万人，重大事务由居民直接表决；平时大厅开放给居民开会、演出和办婚礼。公社委员会自治、自定税率，政务院只管外交、国防等少数事务。
      en: Where the commune council and the residents' assemblies meet; its round assembly hall seats more than ten thousand, and major decisions are put to a direct vote of the residents. On other days the hall is open for meetings, performances and weddings. The commune council governs itself and sets its own taxes, leaving only foreign affairs, defence and a few other matters to the Executive Council.
    in: div_p3x7j4
    offset_km: [0, 0.65]
    emblem_of: div_6kjc7x
    site: { layout: dome, size_m: [300, 300] }
  - id: bld_e44vc4
    subtype: canteen
    status: generated
    names:
      zh: 埃武托拉公社大食堂
      en: Evutola Commune Canteen
      art-x-ivuran: Evu Pinaram
    wonder:
      zh: 世界最大的公共食堂，一次可供三万人同时用餐
      en: The largest public canteen in the world, seating thirty thousand at once
    notes:
      zh: "埃武托拉公社大食堂是世界最大的公共食堂，一次可供三万人同时用餐。它在埃武托拉公社哈马图区人民广场的东侧，与西侧的公社图书馆隔着广场相望，伊武兰语名叫 Evu Pinaram。食堂的大厅长约 420 米、宽约 260 米，长长的餐桌一排排铺开，一日三餐和夜宵都免费，夜宵专为夜班的工人和晚归的学生准备。食材来自塔尼武区的农业和渔业合作社：农业合作社种稻米、蔬菜和热带水果，渔业合作社的船队在近海捕鱼，收获清早就运进食堂的后厨。菜单由居民每月投票决定，厨房按得票排出每天的主菜、素菜和汤。后厨分成几十个灶台区，分别做米饭、咖喱、烤鱼、汤和点心，碗碟由传送带送进清洗间，剩下的饭菜按规定送回塔尼武区做堆肥和饲料。\n大食堂是公社生活方式最显眼的标志。公社里住房、交通、水电、教育和医疗全部免费，居民综合税负超过八成，大部分工资由劳动贡献积分代替，最高与最低收入之比不超过三倍；在大食堂掌勺、洗碗和送餐的人和工厂里的工人一样按岗位和工时记积分，每周工作四天。奥鲁武区的每个环形公社住宅底层都有自己的食堂，塔尼武区的每个村也有，但办婚宴、开大会或过节，人们还是爱来哈马图区的大食堂，因为只有这里坐得下全家族的亲戚。埃武托拉地铁 1 号线的一个站就叫埃武托拉公社大食堂站，饭点前后车厢里挤满了来吃饭的人。人民广场的大棚下召开公社大会时，会开得再长，中间也一定会停下来，大家一起吃一顿大食堂送来的点心。\n除了每月的菜单投票，居民每周还要投出一道「周五菜」，得票最高的菜在周五端上全公社的餐桌。有一道椰浆焖鱼连着许多周高票当选，后来干脆进了菜单的固定栏目，如今食堂的厨师说，每周五要焖的鱼得用小船一船一船地运。也有落选的菜：有人连续几个月提议榴莲饭，每次都因为气味被投下去，提议的人不死心，最后争取到在食堂门外的露天桌上单独开一个「榴莲角」。大厅墙上挂着一块大黑板，写着当周每道菜的票数和食材来自塔尼武区的哪个合作社，吃饭的人常常一边排队一边对着黑板争论下周该投什么。外地游客也可以进来吃饭，按规矩在门口的箱子里随意放些钱，收入归公社共有。"
      en: "The Evutola Commune Canteen is the largest public canteen in the world, seating thirty thousand at once. It stands on the east side of People's Square in Hamatu District of Evutola Commune, facing the Commune Library across the square on the west; its Ivuran name is Evu Pinaram. Its hall is about 420 m long and 260 m wide, laid out with row upon row of long tables, and serves three meals and a late supper every day free of charge, the late supper for night-shift workers and students coming home late. Its food comes from the farming and fishing co-operatives of Tanivu District: the farming co-operatives grow rice, vegetables and tropical fruit, the fishing co-operatives' boats fish inshore, and the harvest reaches the canteen kitchens early each morning. Residents vote on the menu each month, and the kitchen plans each day's main dishes, vegetable dishes and soups by the votes. The kitchens are divided into dozens of stations for rice, curries, grilled fish, soups and snacks, the dishes ride a conveyor to the washrooms, and leftovers go back to Tanivu by rule as compost and animal feed.\nThe canteen is the most visible sign of the commune's way of life. In the commune, housing, transport, water, power, education and health care are all free, residents' combined taxes exceed eighty per cent of income, most wages are replaced by labour contribution credits, and the highest income may be no more than three times the lowest; those who cook, wash up and serve in the canteen earn credits by post and hours just like factory workers, and work a four-day week. Every ring of the Oruvu Ring Homes has a canteen on its ground floor, and so does every village in Tanivu, but for weddings, big meetings and festivals people still like to come to the great canteen in Hamatu, because only here is there room for all the relatives. One station on Evutola Metro Line 1 is named Evutola Commune Canteen, and around mealtimes its trains are packed with people coming to eat. When the commune assembly meets under the great tent in People's Square, however long it runs it always breaks for a snack sent over from the canteen, and everyone eats together.\nBesides the monthly menu vote, residents pick a \"Friday dish\" every week, and the winner is served on every table in the commune on Friday. A coconut-braised fish won so many weeks running that it was finally given a permanent place on the menu, and the cooks now say the fish for each Friday has to come in boatload after boatload. Some dishes lose: one resident proposed durian rice for months on end and was voted down every time because of the smell, but did not give up and finally won a \"durian corner\" of open-air tables outside the canteen door. A big blackboard on the wall of the hall shows the week's votes for every dish and which Tanivu co-operative supplied the ingredients, and diners often argue in front of it about next week's vote while they queue. Visitors from outside may eat here too, by custom dropping whatever they like into a box at the door, and the money belongs to the commune as a whole."
    in: div_p3x7j4
    offset_km: [0.75, -0.45]
    site: { layout: hall, size_m: [420, 260] }
  - id: bld_azjj6r
    subtype: library
    status: generated
    names:
      zh: 埃武托拉公社图书馆
      en: Evutola Commune Library
      art-x-ivuran: Evutola Vilatam
    wonder:
      zh: 世界最大的公共图书馆，图书、工具和乐器都可以免费借用
      en: The largest public library in the world, lending books, tools and instruments free of charge
    notes:
      zh: "埃武托拉公社图书馆是世界最大的公共图书馆，图书、工具和乐器都可以免费借用。它在埃武托拉公社哈马图区人民广场的西侧，与东侧的公社大食堂隔着广场相望，人民宫也在广场边上，伊武兰语名叫 Evutola Vilatam。图书馆占了一整个街区，约 260 米长、200 米宽，除了图书，还借出工具、乐器、相机和露营装备；楼里有自习室、木工房和录音室，昼夜开放，夜班的工人下了班也能来借书、做木工。借书和借工具一样不收钱，也不用押金，只需登记姓名和归还的日子。馆里的藏书按伊武兰语、中文和英文三种语言分区，儿童区的绘本多是三语对照的，孩子们在这里学会的第一个词往往有三种说法。\n公社里住房、公共交通、水电、教育和医疗全部免费，汽车、电器等贵重物品也按需取用，图书馆就是这套制度里最大的一间「公共柜子」。各区社区中心的钥匙墙管的是汽车和帐篷，图书馆管的是更细碎的东西：电钻、缝纫机、提琴、鼓、望远镜、婴儿推车，乃至办婚礼用的一整套碗碟。馆里的木工房里有师傅坐班，居民可以把家具搬来自己修；录音室常被年轻乐队订满，公社节庆上演奏的曲子不少是在这里录的。公社的预算和账目副本也存在阅览室里，任何人都可以查阅，最大的反对党国际共产党的人是这里的常客，执政的人民公社共产主义运动则把这当作直接民主的一部分。免费的电车和公共汽车从人民广场通向各区，埃武托拉地铁 1 号线在广场附近设有埃武托拉公社大食堂站，所以从公社各处来图书馆都很方便。\n公社每周工作四天，第五天很多居民来图书馆做义工，这一天是馆里最热闹的时候：退休的老工人教孩子们修自行车，年轻人教老人用新的投票终端，会缝纫的人在角落里帮邻居改衣服。借出的工具和乐器都挂着一张小卡片，写着上一位使用者的留言，比如「这把锯子往左偏，锯的时候往右用点力」，或者「这把吉他的第三根弦容易跑调，请多调几次」。有一把旧手风琴的卡片已经换了好几张，攒了上百条留言，馆里干脆把它们装订成册，放在手风琴盒子里一起借出去。借期到了却还没用完的东西，只要没人排队，就可以在终端上续借；排队最长的常常是露营帐篷，一到旱季的假期就要提前几周登记。居民们说，在这里借到的不只是东西，还有邻居的经验。"
      en: "The Evutola Commune Library is the largest public library in the world, lending books, tools and instruments free of charge. It stands on the west side of People's Square in Hamatu District of Evutola Commune, facing the Commune Canteen across the square on the east, with the People's Palace also on the square; its Ivuran name is Evutola Vilatam. The library fills a whole block about 260 m long and 200 m wide and lends tools, instruments, cameras and camping gear as well as books; it has study rooms, a woodshop and recording studios open day and night, so that night-shift workers can come and borrow a book or do some woodwork when they finish. Borrowing a tool costs nothing, just like borrowing a book, and needs no deposit, only a name and a return date. The books are shelved in Ivuran, Chinese and English sections, most of the picture books in the children's area are trilingual, and the first word a child learns here often comes in three versions.\nIn the commune, housing, public transport, water, power, education and health care are all free, and costly things such as cars and appliances are taken as needed; the library is the biggest \"shared cupboard\" in that system. The key walls of the district community centres look after the cars and tents, while the library handles the smaller things: drills, sewing machines, violins, drums, telescopes, prams, even a full set of crockery for a wedding. A craftsman staffs the woodshop, and residents can bring in their furniture to mend it themselves; the recording studios are often booked solid by young bands, and much of the music played at commune festivals was recorded here. Copies of the commune's budget and accounts are kept in the reading room too, open to anyone; members of the largest opposition party, the International Communist Party, are regulars, while the governing People's Commune Communist Movement treats this as part of direct democracy. Free trams and buses run from People's Square to every district, and Evutola Metro Line 1 has a station near the square, Evutola Commune Canteen, so the library is easy to reach from anywhere in the commune.\nThe commune works a four-day week, and on the fifth day many residents volunteer at the library, its busiest day: retired workers teach children to mend bicycles, young people show their elders the new voting terminals, and those who can sew alter clothes for their neighbours in a corner. Every tool and instrument lent out carries a little card with a note from the last borrower, such as \"this saw pulls to the left, so lean right as you cut\" or \"the third string on this guitar slips out of tune, so check it often\". One old accordion has worn out several cards and gathered more than a hundred notes, so the library bound them into a booklet that goes out in the accordion case. Anything not finished with by the return date can be renewed at a terminal as long as no one is waiting; the longest queues are usually for camping tents, which must be booked weeks ahead for the dry-season holidays. Residents say that what you borrow here is not just things but your neighbours' experience."
    in: div_p3x7j4
    offset_km: [-0.8, -0.45]
    site: { layout: block, size_m: [260, 200] }
  - id: bld_w1cqt3
