      en: The Ministry of Labour and Social Security, at the south end of Lakelight Avenue on the east side, covers jobs, training, labour relations and social insurance. Its departments are Employment, Vocational Skills, General Trades, Special Trades, Labour Arbitration and Public Labour Insurance, of which Employment and Labour Arbitration have buildings of their own in the row behind. Special Trades sets the qualifications and hours for mines, smelters, shipyard welding and chip-plant clean rooms, and the rule that outdoor work stops in the midday heat; Vocational Skills runs courses in semiconductors, shipbuilding and tourism with each city's colleges; and Public Labour Insurance runs the territory-wide pension, unemployment and work-injury schemes and the long paid parental leave that both parents can take.
