  # ── 基鲁迈联合邦：群岛的机场、渡轮码头、潜水和珊瑚礁 ──
  - id: poi_16y65n
    subtype: airport
    status: generated
    names:
      zh: 基鲁迈机场
      en: Kirumai Airport
      art-x-ivuran: Kirumai Ulavan
    notes:
      zh: "基鲁迈机场是基鲁迈联合邦的民用机场，在基鲁迈岛北部的迈萨里区，离联合邦议会所在的港湾城区不远，一条约 4 公里的机场公路把航站楼和城区连起来。迈萨里的区名在伊武兰语里意为「珍珠的港湾」。度假和潜水的游客大多从这里入岛，有航班飞往萨伦纳姆和米雷兰；机场占地约 2800 × 900 米，跑道尽头就是海滩。下了飞机，游客可以沿基鲁迈群岛高速南下，经卡朗加区跨海前往蒂卢迈岛和奥罗武岛，也可以到迈萨里渡轮码头换船，去不通公路的马拉坎岛和皮卢岛。迈萨里区约四分之三的居民以伊武兰语为母语，机场的广播用中文、英文和伊武兰语三种语言轮流播报。\n航站楼不大，屋顶仿照伊武兰人高脚木屋的样子，用木梁和棕叶搭成，四面敞开，海风从候机厅里穿过。飞机降落时从舷窗能看到礁湖里深浅不一的蓝色，下了飞机，接机的民宿主人常常捧着一只刚砍开的嫩椰子等着。旅游旺季的周末，航班一架接一架，候机厅里满是背着潜水装备的游客；雨季的午后阵雨来得急，航班偶尔要在空中多绕几圈，等雨云从礁湖上飘过去。离岛那天，民宿主人会在客人的行李上系一串贝壳，说这样下次还能找到回来的路。"
      en: "Kirumai Airport is the civil airport of the Commonwealth of Kirumai, in Maisari District in the north of Kirumai Island, not far from the harbour town where the Commonwealth Assembly sits; an airport road of about 4 km links the terminal with the town. Maisari's name means \"harbour of pearls\" in Ivuran. Most holidaymakers and divers arrive here, and there are flights to Sarunnam and Mirelan; the airport covers about 2,800 × 900 m, and the runway ends at the beach. From the plane, visitors can head south on the Kirumai Islands Expressway through Karanga District and over the sea to Tilumai and Orovu islands, or change to a boat at the Maisari Ferry Terminal for Malakan and Pilu islands, which have no roads. About three in four people in Maisari District speak Ivuran as their mother tongue, and the airport's announcements are made in turn in Chinese, English and Ivuran.\nThe terminal is small, its roof modelled on the Ivuran stilt house, built of timber beams and palm thatch and open on all sides, so the sea breeze blows straight through the departure hall. On landing passengers see the lagoon's many shades of blue from the window; at arrivals, guesthouse hosts are often waiting with a freshly opened young coconut. At weekends in the high season flights come in one after another and the hall is full of visitors carrying dive gear; in the wet season the afternoon showers arrive fast, and planes sometimes circle a few extra times while the rain clouds drift off the lagoon. On the day guests leave, their hosts tie a string of shells to their luggage, so that, they say, they can find their way back next time."
    in: div_a0nff8
    offset_km: [2.5, -6.0]
    site: { size_m: [2800, 900], layout: airport, angle_deg: 0 }
  - id: poi_9a4940
    subtype: ferry_terminal
    status: generated
    names:
      zh: 迈萨里渡轮码头
      en: Maisari Ferry Terminal
      art-x-ivuran: Maisari Talusam
    notes:
      zh: "迈萨里港湾边的渡轮码头，渡轮从这里开往群岛各岛；不通公路的马拉坎岛和皮卢岛也靠这里的船只往来。傍晚渔船回港时，码头边的沙滩上会把渔获分成一堆堆，按老规矩「分海」，老人、孩子和没出海的人家也有一份。"
      en: "The ferry terminal on Maisari's harbour, from which ferries serve every island of the chain, including Malakan and Pilu, which have no roads. When the boats come home in the evening the catch is divided into heaps on the beach beside the terminal in the old custom of \"sharing the sea\", with a share for the old, the children and the families who stayed ashore."
    in: div_a0nff8
    site: { size_m: [800, 700], layout: port }
  - id: poi_r23m3t
    subtype: hotel
    status: generated
    names:
      zh: 蒂卢迈潜水度假村
      en: Tilumai Dive Resort
      art-x-ivuran: Tilumai Nalutola
    notes:
      zh: "蒂卢迈岛西岸的度假村和潜水学校，礁外的海底峭壁是有名的潜点；每处潜点每天限定人数，船只只能系在浮标上。潜水向导大多是本地渔民的孩子，他们给礁石上的大石斑鱼都起了名字，带客人下水时像介绍邻居一样介绍它们。"
      en: "The resort and dive school on the west coast of Tilumai Island, whose reef wall is a well-known dive site; each site takes a limited number of divers a day, and boats must tie up to buoys. Most of the dive guides are fishermen's children, who have named the big groupers on the reef and introduce them to divers like neighbours."
    in: div_3x32j4
    offset_km: [-0.8, 0.2]
    site: { layout: complex, size_m: [400, 250] }
  - id: poi_w9e5cc
    subtype: research_institute
    status: generated
    names:
      zh: 马拉坎珊瑚礁保护站
      en: Malakan Coral Reef Station
      art-x-ivuran: Malakan Kilavam
    notes:
      zh: "珊瑚礁保护区的管理和研究站，监测水温和珊瑚白化，培育珊瑚苗用于修复礁区；保护区不通公路，游客须随站里的船只进入。站里的珊瑚苗圃挂在水下的架子上，像一排排小树，志愿潜水员每月下水一次，把长大的珊瑚苗移种到白化过的礁石上。"
      en: "The management and research station of the coral reef reserve, monitoring water temperature and bleaching and growing coral for reef restoration; the reserve has no roads, and visitors go in on the station's boats. The station's coral nursery hangs on underwater frames like rows of little trees, and volunteer divers go down once a month to plant grown fragments onto bleached reef."
    in: div_5z620y
    offset_km: [0.5, -0.5]
    site: { layout: campus, size_m: [300, 200] }
  - id: poi_x715ke
    subtype: port
    status: generated
    names:
      zh: 皮卢补给码头
      en: Pilu Supply Quay
      art-x-ivuran: Pilu Talusam
    notes:
      zh: "皮卢补给码头在基鲁迈联合邦的皮卢区，位于群岛东端，场地约 700 × 700 米，去往瓦希拉群岛的补给船从这里出发；码头旁是小渔港和灯塔。皮卢区由群岛东端的两座小岛组成，区名在伊武兰语里意为「小船」，岛上不通公路，人员和货物都靠船只往来，与迈萨里渡轮码头之间有渡轮相通。皮卢区有 5 万人，约八成居民以伊武兰语为母语，渔业和旅游度假是主要行业，岛上还有小型度假村。瓦希拉群岛在岛链以东的外海，离最近的有人岛皮卢尼岛约 206 公里，是海军长夏舰队的基地，三座岛上的官兵和文职技术人员合计约 1.2 万人，民政归基鲁迈联合邦管理。补给船装着淡水、蔬果、邮件和零件出海，回程时带回休假的官兵；联合邦议会选举时，瓦希拉群岛的官兵在皮卢选区投票，选票也是搭补给船送回来的。\n补给船出发前，码头上的渔家会往船上送一筐嫩椰子，说是给去远岛的人「带一口家里的水」。渔民在礁外的深水里钓金枪鱼，清晨渔船回港时，补给船常常正好出港，两边的人隔着水面挥手打招呼。灯塔下的小酒馆是水手们等船的地方，墙上贴着历年补给船的航行记录，最长的一次因为风浪在海上多走了两天。"
      en: "Pilu Supply Quay lies in Pilu District of the Commonwealth of Kirumai, at the eastern end of the chain; its site covers about 700 × 700 m, the supply ships for the Vahira Islands leave from here, and beside it are a small fishing harbour and a lighthouse. Pilu District is made up of the two small islands at the eastern end of the chain, its name meaning \"little boat\" in Ivuran; the islands have no roads, people and goods travel by boat, and ferries link them with the Maisari Ferry Terminal. Pilu District has 50,000 people, about eight in ten of whom speak Ivuran as their mother tongue; fishing and tourism are its main industries, and the islands also have small resorts. The Vahira Islands lie out to sea east of the chain, about 206 km from Piluni Island, the nearest inhabited island, and are the base of the Navy's Everlong Summer Fleet; the service members and civilian technical staff on the three islands number about 12,000 in all, and their civil administration falls to the Commonwealth of Kirumai. The supply ships sail with fresh water, fruit and vegetables, mail and spare parts and come back with service members going on leave; at Commonwealth Assembly elections the Vahira service members vote in the Pilu constituency, and their ballots come back on the supply ship too.\nBefore the supply ship sails, the fishing families on the quay hand aboard a basket of young coconuts, \"a sip of home\" for those going out to the far islands. The fishermen catch tuna in the deep water beyond the reef, and as the fishing boats come home at dawn the supply ship is often just leaving, the crews waving to each other across the water. The little bar beneath the lighthouse is where sailors wait for their ship; its walls carry the supply ships' voyage logs from years past, and the longest voyage on record ran two days over because of heavy seas."
    in: div_xazhxw
    offset_km: [-4.3, 23.6]
    site: { size_m: [700, 700], layout: port }
  - id: poi_3yn82m
    subtype: air_base
    status: generated
    names:
      zh: 卡朗加空军基地
      en: Karanga Air Base
      art-x-ivuran: Karanga Ulavan
    notes:
      zh: 卡朗加空军基地位于基鲁迈岛南部的卡朗加区，是空军在长夏群岛的主基地，担负主岛西南部、基鲁迈群岛和瓦希拉群岛方向的空中防御。基地有两条平行跑道，跑道外侧是一排加固机库，战机可以从机库直接滑出起飞；预警机和加油机让战斗机能一直飞到瓦希拉群岛上空巡逻，与海军的岛屿机场互为备降场。热带的雷雨来得快，基地的气象站每小时发布一次预报，机库和弹药库都按防潮标准修建。官兵家属住在卡朗加城区，基地每年的航空开放日是全群岛的节日。
      en: Karanga Air Base, in Karanga District in the south of Kirumai Island, is the Air Force's main base in the Everlong Summer Islands, defending the air over the south-west of the main island, the Kirumai Islands and the approaches to the Vahira Islands. It has two parallel runways lined by hardened shelters from which fighters taxi straight out to take off. Its early-warning aircraft and tankers let the fighters patrol as far as the Vahira Islands, and the base and the navy's island airfield serve as each other's diversion fields. Tropical thunderstorms build quickly, so the base weather station issues a forecast every hour, and the hangars and magazines are built to keep out the damp. Service families live in the town of Karanga, and the base's yearly open day is a holiday for the whole island chain.
    in: div_3skbd8
    offset_km: [6.0, 8.0]
