      en: Ministry of Transport
    notes:
      zh: 长夏群岛领地政务院交通部，位于湖光大道南段东侧，负责全领地的道路、铁路、水运和航空。部内设政策司、交通从业人员司、道路运输司、公路司、铁路司、水路司和空运司。公路司管理伊米穆、塞洛、纳卢三条国家高速和各条领地高速，伊米穆高速经约 101 公里长的哈努西鲁河口跨海大桥通往基鲁迈群岛，领地的高速公路大多不限速；铁路司监管时速 800 公里的长夏、萨洛两条真空磁悬浮，时速 400 公里的瓦洛、米纳、塔纳三条高速铁路和乌诺维拉真空磁悬浮重载铁路；水路司监管瓦利凯、塔卢马兰和萨伦纳姆的港口，空运司协调萨伦纳姆国际机场和各地机场的航线。交通从业人员司负责驾驶员、船员和机组的资格考核。
      en: The Ministry of Transport, at the south end of Lakelight Avenue on the east side, runs the territory's roads, railways, shipping and air transport. Its departments are Policy, Transport Professions, Road Transport, Highways, Railways, Waterways and Air Transport. Highways manages the Imimu, Selo and Nalu national expressways and the territorial expressways; the Imimu Expressway reaches the Kirumai Islands over the Hanusiru Estuary Sea Bridge, about 101 km long, and most of the territory's expressways have no speed limit. Railways oversees the Everlong Summer and Sarunnam–Lomiran vacuum maglevs at 800 km/h, the three high-speed lines at 400 km/h and the Unovila Vacuum Maglev Heavy-Haul Railway, Waterways the ports of Vallikkai, Talumaran and Sarunnam, and Air Transport the routes of Sarunnam International and the other airports. Transport Professions examines and licenses drivers, seafarers and aircrew.
    in: div_z0z4vz
