      zh: 长夏群岛领地政务院卫生和人类服务部公共健康保险司，在卫生和人类服务部后排单独建楼，管理覆盖全体居民的全民医保。领地实行统一的公共健康保险，居民看病、住院和买药按统一目录报销，大多数项目个人不用付费；外岛和山区的病人转到萨伦纳姆或伊拉米区研究院附属医院治疗，路费也由保险承担。保险司每年与药厂和医院谈判药品和服务的价格，领地生物医药企业研制的热带病新药，也要经它评估后才能纳入报销目录。公共健康保险基金由社会保险费和财政拨款共同筹集，账目每年向社会公开。
      en: "The Public Health Insurance Department of the Ministry of Health and Human Services has its own building behind the ministry and runs the universal health cover that includes every resident. The territory has a single public health insurance scheme: doctor's visits, hospital stays and medicines are covered from one list, and most of it costs the patient nothing. Patients from the outer islands and the mountains who are sent on to Sarunnam or to the institute hospital in Ilami have their travel paid too. Every year the department negotiates drug and service prices with manufacturers and hospitals, and new medicines for tropical diseases from the territory's own biomedical firms are added to the list only after its review. The fund is paid for by social insurance contributions and the territorial budget, and its accounts are published every year."
