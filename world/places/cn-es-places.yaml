    notes:
      zh: 长夏群岛领地政务院司法部，位于湖光大道北段西侧，负责领地法规的起草和实施、检察事务和司法行政。部内设国家法律实施司、领地法规司、法律法规起草和规范司、检察事务司、司法监察司、拘留管理司、社区矫正管理司、司法从业人员司和司法研究司。领地法规以中文、英文和伊武兰语三种文本同时公布，起草和规范司负责三种文本的一致；领地对环境、劳动和食品安全的监管十分严格，检察事务司为此设有专门办理监管案件的检察处。领地的犯罪率很低，社区矫正管理司让大多数轻罪者留在社区里接受矫正和职业培训。大楼为 L 形，内院旁是法律图书馆。
      en: "The Ministry of Justice, at the north end of Lakelight Avenue on the west side, drafts and applies the territory's laws and runs prosecutions and the administration of justice. It has nine departments: National Law Enforcement, Territorial Regulations, Legislative Drafting and Standards, Prosecutions, Judicial Inspection, Detention, Community Corrections, Legal Professions and Legal Research. Territorial laws are published at once in Chinese, English and Ivuran, and the drafting department keeps the three texts in step. Because the territory regulates the environment, working conditions and food safety so strictly, Prosecutions has an office of its own for regulatory cases. Crime is rare, and Community Corrections lets most minor offenders stay in their communities under supervision and job training. The L-shaped building has a law library beside its inner yard."
    in: div_z0z4vz
