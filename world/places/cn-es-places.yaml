  - id: bld_kdkrvz
    subtype: marketplace
    status: generated
    names:
      zh: 塞鲁卡姆水上市场
      en: Serukkam Floating Market
      art-x-ivuran: Serukkam Sirumevalu
    wonder:
      zh: 世界最大的水上市场，每天清晨上千条小船在老城河道里交易
      en: The largest floating market in the world, a thousand boats trading on the old city's canals every morning
    notes:
      zh: "塞鲁卡姆水上市场是世界最大的水上市场，每天清晨上千条小船在萨伦纳姆老城的河道里交易，伊武兰语名叫 Serukkam Sirumevalu。市场在萨伦纳姆市塞鲁卡姆区，占了老城中心约 900 米长、500 米宽的一片河网，天不亮就开市，小船载着蔬果、鲜鱼、香料和小吃在河道里穿梭，买卖用伊武兰语南部方言讨价还价。许多船家世代在水上做生意，每条船摊都挂着食品监管部门发的卫生等级牌，检查员也坐着小船在河道里巡查。太阳升高以后，大部分船摊收摊回家，河道又还给接送居民的小船。\n塞鲁卡姆区的名字意为「运河之城」，是萨伦纳姆的老城，也是全领地人口最密的地方。高脚木屋和老商铺沿河排开，街巷窄而曲折，许多人家的后门直接开在水上，主妇不出门，在后门台阶上就能从路过的船上买菜。来市场卖货的船，有的从三角洲上的奥卢瓦尔区运来稻米和蔬菜，有的从皮拉凯区的渔村运来鱼虾和螃蟹，香料船上堆着胡椒、豆蔻、肉桂和丁香。市场的船大多是窄长的木船，船头翘起，船身漆成蓝色、绿色或红色，一条船就是一个摊位，也是船家的半个家，船舱里放着孩子的书包和午睡的席子。这里的本地人多讲伊武兰语南部方言，萨伦纳姆人自称「旧都人」，外人只要一开口还价，船家就听得出是不是本地人。萨伦纳姆地铁 2 号线在区里设有塞鲁卡姆水上市场站，萨伦纳姆环城高速也经过这里，从阿兰塔区的写字楼坐地铁来吃早点，只要十几分钟。\n小船上的摊贩用竹竿挑着货招呼岸上的客人，最受欢迎的早点是用香蕉叶包着的椰浆糯米饭和刚出锅的炸香蕉，船尾架着炭炉，热汤粉一碗碗从船上递到桥上。买卖谈妥，钱就放进竹竿头上的小篮子递过去，找的零钱再用同一个篮子递回来，竹竿上的篮子是这里最老的「收银台」。船家之间各有各的吆喝调子，老主顾不用看，听调子就知道是哪条船来了。外地游客最常闹的笑话是学着本地人从岸边跨到船上挑菜，结果一脚踩空掉进河里，船家们见怪不怪，伸出竹竿把人拉上来，再递上一块干毛巾。满月的「灯与月」之夜，市场的船只挂起油灯，一家老小坐船沿着老城河道去看旧王城和寺庙群的灯，河道里挤得船挨着船，卖小吃的船整夜都不收摊。"
      en: "The Serukkam Floating Market is the largest floating market in the world, with a thousand boats trading on the canals of Sarunnam's old town every morning; its Ivuran name is Serukkam Sirumevalu. The market is in Serukkam District of Sarunnam City and fills a web of canals about 900 m long and 500 m wide in the heart of the old town. It opens before daybreak, when boats laden with vegetables, fruit, fresh fish, spices and snacks weave along the canals and traders haggle in the southern Ivuran dialect. Many boat families have traded here for generations, every boat stall shows its hygiene grade from the food inspectors, and the inspectors patrol the canals by boat too. Once the sun is high most of the stalls pack up and go home, and the canals return to the boats that ferry residents about.\nThe name of Serukkam District means 'city of canals'; it is Sarunnam's old town and the most densely populated place in the territory. Stilt houses and old shops line the canals and the lanes are narrow and winding; many back doors open straight onto the water, so that a householder can buy the day's vegetables from a passing boat without leaving the back step. Some of the boats bring rice and vegetables from Oluvar District on the delta, some bring fish, prawns and crabs from the fishing villages of Pilakkai District, and the spice boats are piled with pepper, cardamom, cinnamon and cloves. Most of the market boats are long, narrow wooden craft with upturned bows, painted blue, green or red; each boat is a stall and half a home, with the children's schoolbags and a mat for the afternoon nap stowed in the hold. Most locals here speak the southern Ivuran dialect, and the people of Sarunnam call themselves \"old-capital folk\"; as soon as an outsider starts to bargain, the boat family can tell whether they are local. Sarunnam Metro Line 2 has a station in the district, Serukkam Floating Market, and the Sarunnam Ring Expressway runs through it too; breakfast here is only a dozen minutes by metro from the office towers of Aranta.\nTraders on the boats hold out their goods on bamboo poles to customers on the banks. The favourite breakfast is coconut sticky rice wrapped in banana leaf with banana fritters fresh from the pan, and charcoal stoves on the sterns send bowl after bowl of hot noodle soup up from the boats to the bridges. Once a price is agreed the money goes across in a little basket on the end of a bamboo pole and the change comes back in the same basket; the basket on the pole is the oldest \"till\" in the market. Each boat family has its own call, and regulars know which boat is coming by the tune without looking. The commonest mishap for visitors is to copy the locals and step from the bank onto a boat to choose their vegetables, only to miss their footing and fall in; the boat families think nothing of it, hold out a bamboo pole to haul them out and hand them a dry towel. On the full-moon night of Vilaru Imolu the market boats hang out oil lamps, families go by boat along the old-town canals to see the lamps of the royal city and the temples, the canals are so crowded that boats touch, and the snack boats stay open all night."
    in: div_xz0zqd
