      en: Everlong Summer Islands Policy and Planning Commission
    short_names:
      zh: 政策和计划委员会
      en: Policy and Planning Commission
    notes:
      zh: 长夏群岛领地政策和计划委员会，是政务院直属的特设委员会，位于公民广场东侧，与领地图书馆隔广场相对。委员会由总理主持，各部部长和独立专家参加，负责编制领地的中长期发展规划，协调跨部门的重大政策，并评估各项政策的实施效果。在高原上新建首府、修建长夏真空磁悬浮和哈努西鲁河口跨海大桥、把乌诺维拉的镍矿和塔卢马兰的电池厂连成产业链，这些大项目都是先在这里形成方案，再提交议会的；委员会每年发布领地发展报告，公开各市的人口、产出、公共服务和居民幸福感调查的结果。大楼是一座方形独栋，四面装有遮阳的格栅。
      en: The Everlong Summer Islands Policy and Planning Commission is a special commission directly under the Executive Council, on the east side of Civic Square facing the Territorial Library across it. Chaired by the premier, with the ministers and independent experts as members, it draws up the territory's medium- and long-term development plans, coordinates major policies that cross ministries and reviews how policies are working. Building a new capital on the plateau, the Everlong Summer Vacuum Maglev and the Hanusiru Estuary Sea Bridge, and linking the Unovila nickel mines to the Talumaran battery plants all took shape here before going to the assembly. Every year the commission publishes a development report with each city's population, output, public services and the results of the residents' happiness survey. The square building is screened on all four sides by sun louvres.
    in: div_z0z4vz
