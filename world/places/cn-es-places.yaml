      en: The Public Welfare Department of the Ministry of Health and Human Services has its own building behind the ministry and carries out the territory's generous welfare system. Every month it pays the universal basic income to every resident, whatever their income and whether or not they work. It also runs childcare, care homes, disability services and the community canteens of each district, and pays a childcare allowance to families with newborns. In the residents' happiness survey, what people mention most is that they need not worry about doctors, schooling or old age, and much of that is this department's work. Every district has a welfare service centre where residents can settle any welfare matter at a single counter, in Chinese, English or Ivuran.
