      en: The Ministry of Transport, at the south end of Lakelight Avenue on the east side, runs the territory's roads, railways, shipping and air transport. Its departments are Policy, Transport Professions, Road Transport, Highways, Railways, Waterways and Air Transport. Highways manages the Imimu, Selo and Nalu national expressways and the territorial expressways; the Imimu Expressway reaches the Kirumai Islands over the Hanusiru Estuary Sea Bridge, about 101 km long, and most of the territory's expressways have no speed limit. Railways oversees the Everlong Summer Maglev at 600 km/h and four high-speed lines at 400 km/h, Waterways the ports of Vallikkai, Talumaran and Sarunnam, and Air Transport the routes of Sarunnam International and the other airports. Transport Professions examines and licenses drivers, seafarers and aircrew.
