      en: The Office of the Central Government Inspector in the Everlong Summer Islands, in the second row on the east side of Lakelight Avenue's north end, is sent by the central government to inspect and oversee the territory's administration at every level. Inspectors regularly visit the Council's ministries, the city governments, the Evutola Commune council and public companies to check how policies are carried out, how public money is spent and whether officials are honest; what they find goes to both the central government and the premier, and they follow it up until it is put right. With taxes and welfare spending so large, one focus is how the universal basic income and public housing funds are used. The office's public reception room hears residents' complaints and reports in Chinese, English or Ivuran, and summaries of its inspection reports are published.
