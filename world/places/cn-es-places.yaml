  - id: bld_a14eb3
    subtype: tower
    status: generated
    names:
      zh: 萨伦纳姆塔
      en: Sarunnam Tower
      art-x-ivuran: Sarunnam Urakam
    wonder:
      zh: 世界最高的建筑，高约 960 米
      en: The tallest building in the world, about 960 m high
    notes:
      zh: "萨伦纳姆塔是世界最高的建筑，高约 960 米，矗立在萨伦纳姆市阿兰塔区，是这片中央商务区天际线的最高处，伊武兰语名 Sarunnam Urakam 里的 ura 意为「高」。塔楼底部占地约 120 米见方，楼内是银行、数字服务公司的办公室和酒店，顶部的观景台能望见整个哈努西鲁河三角洲和海上的基鲁迈群岛方向。塔身每隔几十层有一处空中花园，种着棕榈、蕨类和兰花，既是租户午休的去处，也是电梯换乘的大厅；外墙层层排开的遮阳鳍片挡住热带的阳光，让楼里少开空调。三角洲的地基是河流冲积的软土，塔楼靠深入地下的群桩坐在坚实的地层上，塔顶装着巨大的阻尼器，抵消季风吹来时塔身的摆动。塔里的高速电梯分段运行，从底层到观景台要在两处空中大厅换乘，全程不到十分钟；观景台的一段玻璃地板下就是几百米的空气，胆小的游客常常沿着墙根绕着走。\n阿兰塔区的名字意为「高处」，领地的银行、证券交易所、数字服务公司和跨国企业的地区总部都沿区里的规划大道排开，萨伦纳姆塔是这群摩天楼的领头者。萨伦纳姆是古王国的旧都，也是领地最大的城市和金融中心，塔楼与旧王城遥遥相望，一边是石塔，一边是玻璃幕墙，本地人说这是旧都的「两座塔」。和领地所有土地一样，塔楼脚下的地是公有的，由领地长期出租。地铁 1 号线在阿兰塔区设有多座车站，萨伦纳姆环城高速从区内经过，在这里上班的人大多是移民，早上坐地铁进区，再通过遮阳的空中连廊走进各座塔楼。塔楼的酒店占着最上面的几十层，客人早上拉开窗帘，常常发现自己在云层上面，楼下的街道却还在下雨。\n观景台向公众开放，傍晚是最热闹的时候：夕阳落进西边的海里，脚下的河道一条条亮起灯，河滨的夜市和屋顶餐厅热闹到很晚。游客最爱在观景台上找旧王城和伊什万塔寺庙群的石塔，往往要找上好一阵，因为从 900 多米的高处看下去，它们小得像棋子。每年雨季开始前，塔里还要办一场爬楼梯比赛，银行职员、清洁工和消防员一起从底层爬到观景台，最快的人也要爬一个多小时，冠军能得到一年免费的观景台通行证。满月的「灯与月」之夜，塔楼和阿兰塔区的其他摩天楼一起调暗灯光，从观景台上能看到旧王城和寺庙群里成千上万盏油灯，这一夜的观景台总是一票难求。"
      en: "Sarunnam Tower is the tallest building in the world, about 960 m high, standing in Aranta District of Sarunnam City as the highest point of the skyline of its central business district; ura in its Ivuran name, Sarunnam Urakam, means 'high'. The tower stands on a footprint about 120 m square and holds banks, the offices of digital service firms and a hotel, while the observation deck at the top looks out over the whole Hanusiru Delta and towards the Kirumai Islands at sea. Every few dozen floors there is a sky garden planted with palms, ferns and orchids, both a place for tenants to spend the lunch hour and a lobby for changing lifts; rows of fins on the façade shade it from the tropical sun, so that less air-conditioning is needed. The delta is built of soft river silt, so the tower rests on a mass of deep piles driven down to firm ground, and a huge damper at the top counters its sway when the monsoon winds blow. Its high-speed lifts run in stages, and the trip from the ground floor to the observation deck means changing at two sky lobbies and takes under ten minutes; under one stretch of glass floor on the deck there are hundreds of metres of air, and nervous visitors often edge round it along the wall.\nAranta's name means 'high place', and the territory's banks, its stock exchange, its digital service firms and the regional headquarters of multinationals line the district's planned avenues, with Sarunnam Tower at the head of the skyscrapers. Sarunnam is the old capital of the ancient kingdom as well as the territory's largest city and financial centre, and the tower looks across the city to the royal city, stone towers on one side and glass curtain walls on the other; locals call them the old capital's \"two kinds of tower\". Like all land in the territory, the ground beneath the tower is publicly owned and leased out long-term by the territory. Metro Line 1 has several stations in Aranta and the Sarunnam Ring Expressway runs through the district; most of the people who work here are immigrants, who ride the metro in each morning and walk into the towers along shaded skyways. The hotel occupies the top few dozen floors, and guests drawing back the curtains in the morning often find themselves above the clouds while it is still raining in the streets below.\nThe observation deck is open to the public and is busiest at dusk, when the sun sinks into the sea to the west, the canals below light up one by one, and the riverside night markets and rooftop restaurants stay lively until late. Visitors love to hunt for the royal city and the stone towers of the Ishvanta Temples from the deck, and it often takes them a while, because from more than 900 m up they look as small as chess pieces. Each year before the rains begin the tower holds a stair race, in which bank clerks, cleaners and firefighters climb together from the ground floor to the observation deck; even the fastest take more than an hour, and the winner gets a free observation-deck pass for a year. On the full-moon night of Vilaru Imolu the tower dims its lights with the other skyscrapers of Aranta, and from the observation deck you can see the thousands of oil lamps in the royal city and the temples; tickets for the deck that night are always hard to come by."
    in: div_1z75n0
