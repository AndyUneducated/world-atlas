    notes:
      zh: 长夏群岛领地政务院卫生和人类服务部食品监管司，在卫生和人类服务部后排单独建楼，是领地高监管制度里和居民打交道最多的部门。食品监管司检验全领地的稻米、香料、水果和海鲜，监测珍珠贝和鱼虾养殖海域的水质，出口的胡椒、豆蔻和热带水果都要经它抽检农药残留；萨伦纳姆水上市场的上千条船摊、各地的夜市和小吃摊都要挂它发放的卫生等级牌，等级每季度复查一次。司里设有热带食品检验实验室，雨季重点监测霉菌毒素和水产品的细菌指标。
      en: The Food Supervision Department of the Ministry of Health and Human Services has its own building behind the ministry and is the part of the territory's strict regulation that residents meet most often. It tests the territory's rice, spices, fruit and seafood, monitors the water where pearl oysters, fish and prawns are farmed, and spot-checks exported pepper, cardamom and tropical fruit for pesticide residues. The thousand boat stalls of the Sarunnam water market and every night market and food stall in the territory display its hygiene grade, which is rechecked every quarter. Its tropical food laboratory watches especially for mould toxins and for bacteria in seafood during the rainy season.
    in: div_z0z4vz
    offset_km: [-0.04, -1.32]
    site: { size_m: [120, 70], layout: slab }
  - id: bld_ter4s7
    subtype: government
    status: generated
    names:
      zh: 长夏群岛领地政务院劳动和社会保障部就业司
      en: Employment Department, Ministry of Labour and Social Security, Everlong Summer Islands Executive Council
    short_names:
      zh: 就业司
      en: Employment Department
    notes:
      zh: 长夏群岛领地政务院劳动和社会保障部就业司，在劳动和社会保障部后排单独建楼，负责全领地的就业服务和劳动力市场政策。领地一半居民是移民，每年还有成千上万的新移民来半导体、造船、电池和旅游等行业工作，就业司在各市设公共就业服务中心，为新来的人免费介绍工作、办理就业登记，发放学习语言的补贴；失业的居民除了领取失业保险，还可以免费参加职业能力司的培训课程。就业司每季度发布各市的岗位需求和工资水平，帮助学校和职业学院调整专业设置。
      en: The Employment Department of the Ministry of Labour and Social Security has its own building behind the ministry and runs the territory's employment services and labour market policy. Half the territory's people are migrants, and thousands more arrive every year to work in semiconductors, shipbuilding, batteries and tourism, so the department keeps a public employment centre in every city where newcomers can find work and register free of charge and receive grants for language classes. Residents out of work draw unemployment insurance and can also take the Vocational Skills Department's training courses for free. Every quarter the department publishes the demand for workers and the wages in each city, which schools and colleges use to plan their courses.
    in: div_z0z4vz
    offset_km: [0.63, -0.75]
    site: { size_m: [120, 70], layout: slab }
  - id: bld_y8pfmh
    subtype: government
    status: generated
    names:
      zh: 长夏群岛领地政务院劳动和社会保障部劳动仲裁司
      en: Labour Arbitration Department, Ministry of Labour and Social Security, Everlong Summer Islands Executive Council
    short_names:
      zh: 劳动仲裁司
      en: Labour Arbitration Department
    notes:
      zh: 长夏群岛领地政务院劳动和社会保障部劳动仲裁司，在劳动和社会保障部后排单独建楼，负责处理劳动争议。领地的劳动法规严格，最低工资、工时、带薪休假和高温作业都有明确标准，劳动者认为权益受损时可以免费申请仲裁；仲裁司在每个市设仲裁庭，案件一般在 45 天内审结，仲裁员能用中文、英文和伊武兰语审理。萨伦纳姆、塔卢马兰和基拉努的工业区案件最多，大多涉及加班费和工伤认定。仲裁司定期公布典型案例，帮助企业和工人了解规则。
      en: The Labour Arbitration Department of the Ministry of Labour and Social Security has its own building behind the ministry and settles labour disputes. The territory's labour laws are strict, with clear rules on minimum wages, hours, paid leave and work in the heat, and any worker who feels wronged can bring a case to arbitration free of charge. The department sits in every city, most cases are decided within 45 days, and arbitrators hear them in Chinese, English or Ivuran. The industrial districts of Sarunnam, Talumaran and Kilanu bring the most cases, mostly about overtime pay and whether an injury happened at work. The department publishes typical cases regularly so that employers and workers know the rules.
    in: div_z0z4vz
    offset_km: [0.68, -0.93]
    site: { size_m: [120, 70], layout: slab }

