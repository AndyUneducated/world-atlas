    notes:
      zh: 长夏群岛领地政务院公共安全部，位于湖光大道北段东侧，统一领导全领地的警务和治安。部内设警察司、警务司、边境服务和安全司、刑事侦查司、民事侦查司、经济犯罪调查司、社区安全司和技术和装备司。边境服务和安全司在瓦利凯、萨伦纳姆和塔卢马兰的港口和各国际机场设口岸检查站，打击走私和偷渡；社区安全司在各市推行社区警务，雨季还负责洪水和山体滑坡的应急救援；技术和装备司为高速公路警察配备在不限速路段使用的巡逻车和直升机。大楼底层是全领地的报警指挥中心，接警员能用中文、英文和伊武兰语应答。
      en: The Ministry of Public Security, at the north end of Lakelight Avenue on the east side, directs policing and public order across the territory. Its departments are Police, Policing Operations, Border Services and Security, Criminal Investigation, Civil Investigation, Economic Crime, Community Safety, and Technology and Equipment. Border Services and Security runs the checkpoints at the ports of Vallikkai, Sarunnam and Talumaran and at the international airports, working against smuggling and illegal entry; Community Safety runs neighbourhood policing in every city and, in the rainy season, rescue after floods and landslides; and Technology and Equipment supplies the expressway police with the patrol cars and helicopters they use on the unrestricted stretches. The territory's emergency call and dispatch centre is on the ground floor, where call-takers answer in Chinese, English or Ivuran.
    in: div_z0z4vz
