      en: The Office of the Central Government High Commissioner for Human Rights in the Everlong Summer Islands, in the second row on the west side of Lakelight Avenue's north end, is sent by the central government to watch over human rights in the territory. With half the population made up of migrants, the High Commissioner pays particular attention to equal treatment of migrants and local people in jobs, housing and public services, to the right of Ivuran speakers to use their own language in court and with the government, and to the rights of mine, shipyard and plantation workers. The office can examine records, visit remand centres and community corrections, hear individual complaints and make recommendations to territorial bodies. Its yearly human rights report is published, and the chapters on language rights and migrant workers draw the most attention.
