      en: The highest point of the Aranta skyline, with banks, digital service firms and a hotel inside; the observation deck at the top looks out over the whole delta and towards the Kirumai Islands at sea. Every few dozen floors there is a sky garden, and fins on the façade shade it from the tropical sun.
