      en: The Labour Arbitration Department of the Ministry of Labour and Social Security has its own building behind the ministry and settles labour disputes. The territory's labour laws are strict, with clear rules on minimum wages, hours, paid leave and work in the heat, and any worker who feels wronged can bring a case to arbitration free of charge. The department sits in every city, most cases are decided within 45 days, and arbitrators hear them in Chinese, English or Ivuran. The industrial districts of Sarunnam, Talumaran and Kilanu bring the most cases, mostly about overtime pay and whether an injury happened at work. The department publishes typical cases regularly so that employers and workers know the rules.
