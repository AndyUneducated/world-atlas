      en: Terrace upon terrace of rice fields on the mountainsides of eastern Undakan, thousands of paddies following the contours round the slopes, watered by streams from the forest above that pass down through every field in turn. The village communities share the upkeep and the water, and the whole village turns out to plant and harvest.
