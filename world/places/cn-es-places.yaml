    notes:
      zh: 老城河道上的水上市场，每天清晨开市，上千条小船载着蔬果、鲜鱼、香料和小吃在河道里交易，买卖用伊武兰语南部方言讨价还价；许多船家世代在水上做生意，每条船摊都挂着食品监管部门发的卫生等级牌。
      en: The floating market on the canals of the old city opens at dawn every day, when a thousand boats laden with vegetables, fruit, fresh fish, spices and snacks trade on the water, haggling in the southern Ivuran dialect. Many boat families have traded here for generations, and every boat stall shows its hygiene grade from the food inspectors.
