# Named places (buildings, landmarks, facilities) of the Everlong Summer Islands.
# Same conventions as cn-nv-places.yaml; names are Chinese, English and Ivuran (the Executive Council's
# ministries and offices have Chinese and English names only).
places:
  # ── 米雷兰市：湖光大道两端的政务院主楼和领地议会、中段的公民广场和领地图书馆；伊拉米区的研究院和大学 ──
  - id: bld_bby8as
    subtype: government
    status: generated
    names:
      zh: 长夏群岛领地政府
      en: Government of the Everlong Summer Islands
      art-x-ivuran: Imimu Selovaru Arakam
    short_names:
      zh: 领地政府
      en: Territorial Government
    notes:
      zh: 长夏群岛领地政务院的主楼，在首府米雷兰帕萨卢区湖光大道的北端，是一座回字形的庭院建筑，正门朝南对着整条大道，背后越过高原望向翁贝尔哈努湖。政务院是领地的最高行政机关，由领地总理组织，下设十一个部和若干直属机构；各部大楼沿湖光大道两侧向南排开，中段是公民广场和领地图书馆，南端是领地议会，政务院和议会隔着整条轴线遥遥相对。主楼北翼是总理办公室，东、西两翼是办公厅，南翼是向公众开放的服务大厅；办公厅下设综合行政局、媒体和出版局、财务局、安全局、档案局、采购局和公务员事务局。内院种满雨树和凤凰木，四面的长廊为来访的人遮阳挡雨。
      en: "The main building of the Everlong Summer Islands Executive Council stands at the north end of Lakelight Avenue in Pasalu District of the capital, Mirelan: a hollow square round a courtyard, its main door facing south down the whole length of the avenue and its back looking out over the plateau towards Lake Ombelhanu. The Executive Council is the territory's highest executive body, formed by the premier, with eleven ministries and several directly attached bodies. The ministries line both sides of Lakelight Avenue southwards, with Civic Square and the Territorial Library half-way along and the Territorial Assembly at the far end, so that government and assembly face each other along the axis. The north wing holds the Premier's Office, the east and west wings the General Office with its bureaus of General Administration, Media and Publishing, Finance, Security, Archives, Procurement and Civil Service Affairs, and the south wing a public service hall. Rain trees and flame trees fill the courtyard, and colonnades on all four sides shelter visitors from sun and rain."
    in: div_z0z4vz
    offset_km: [-0.26, 0.91]
    emblem_of: div_nwm019
    site: { layout: courtyard, size_m: [300, 240] }
  - id: bld_855nra
    subtype: government
    status: generated
    names:
      zh: 长夏群岛领地议会
      en: Everlong Summer Islands Territorial Assembly
      art-x-ivuran: Imimu Selovaru Ondaram
    notes:
      zh: 长夏群岛领地的立法机关，在湖光大道南端，与北端的政务院主楼隔着整条轴线相对。议员由各市居民选举产生，审议领地法规、预算和发展规划，质询政务院各部；议事厅里的辩论用中文、英文和伊武兰语进行，同声传译通到每个座位。议会大楼由圆形的议事厅和两翼的办公楼组成，屋顶是一圈宽大的挑檐，檐下的回廊在雨季也能让人不淋雨走到每一扇门。会期内旁听席向公众开放，各地的学生常组团来这里参观。
      en: The territory's legislature stands at the south end of Lakelight Avenue, facing the Government building at the north end along the whole axis. Its members are elected by the residents of each city and debate the territory's laws, budgets and development plans and question the Council's ministries. Debates in the chamber are held in Chinese, English and Ivuran, with simultaneous interpretation at every seat. The building is a round chamber between two office wings under a broad ring of eaves, whose colonnade lets people reach every door dry even in the rainy season. The public gallery is open while the assembly sits, and school groups from all over the territory come to visit.
    in: div_z0z4vz
    offset_km: [0.62, -1.18]
    site: { layout: complex, size_m: [300, 220] }
  - id: poi_42vw33
    subtype: plaza
    status: generated
    names:
      zh: 公民广场
      en: Civic Square
      art-x-ivuran: Ondavu Evu
    notes:
      zh: "公民广场在首府米雷兰的帕萨卢区，位于主轴线湖光大道的中段，长约 500 米、宽约 240 米，领地的庆典、国宾欢迎仪式和新年集会都在这里举行。湖光大道正对西北偏北约 27 公里外的翁贝尔哈努湖；广场跨在大道上，大道在广场处有意断开，车辆绕行，行人则可以沿着轴线一路走进广场。轴线北端是领地政府主楼，主楼与广场之间排列着对外、财政、司法、公共安全、民政、建设六部和三个中央派驻机构；广场以南是教育科学文化、交通、卫生、劳动和社会保障、自然资源五部，轴线南端是领地议会。广场西侧是领地图书馆，东侧是政策和计划委员会，四周种着成排的雨树，地铁的领地政府站和长夏大街站都在步行范围内。\n树荫下的长椅午后总坐满了人，附近各部的公务员常端着午饭来这里吃，退休的老人在雨树下下棋，孩子们在广场上追着鸽子跑。旱季的夜晚，广场上有露天电影和音乐会，高原夜里凉，来看电影的人都裹着毛衣，带一壶哈努帕拉的本地咖啡。领地议会开幕那天，议员们从湖边步行走过整条规划轴线进入议会，途经公民广场时，市民沿街撒花瓣，这条路因此被叫作「花瓣路」。新年集会上，三种语言的新年祝词依次念完，广场上的人一起喊出领地格言「长夏不尽，人人有家」。"
      en: "Civic Square lies in Pasalu District of the capital, Mirelan, half-way along the main axis, Lakelight Avenue; about 500 m long and 240 m wide, it is where the territory's ceremonies, state welcomes and New Year gatherings take place. Lakelight Avenue points straight at Lake Ombelhanu, about 27 km away to the north-north-west; the square sits across the avenue, which is deliberately broken at the square, so traffic goes round while people on foot can walk along the axis right into the square. At the northern end of the axis stands the main Government building, and between it and the square are the six ministries of External Affairs, Finance, Justice, Public Security, Civil Affairs and Construction and the three offices of the central government; south of the square are the five ministries of Education, Science and Culture, Transport, Health, Labour and Social Security and Natural Resources, and at the southern end of the axis is the Territorial Assembly. The Territorial Library stands on the square's west side and the Policy and Planning Commission on its east, rain trees line it on every side, and the Territorial Government and Everlong Summer Boulevard metro stations are both within walking distance.\nThe benches in the shade are full every afternoon: civil servants from the nearby ministries often bring their lunch here, retired people play chess under the rain trees and children chase the pigeons across the square. On dry-season evenings there are open-air films and concerts; plateau nights are cool, and the audience comes wrapped in sweaters with a flask of Hanupala's own coffee. On the day the Territorial Assembly opens, the members walk from the lakeside along the whole planned axis into the Assembly, and as they pass through Civic Square people along the way scatter petals, which is why the route is called \"the Petal Road\". At the New Year gathering, once the greetings have been read in all three languages, the crowd calls out the territory's motto together: \"Endless Summer, a Home for All\"."
    in: div_z0z4vz
    offset_km: [0.14, -0.48]
    site: { layout: plaza, size_m: [500, 240] }
  - id: bld_wt717j
    subtype: library
    status: generated
    names:
      zh: 长夏群岛领地图书馆
      en: Everlong Summer Islands Territorial Library
      art-x-ivuran: Imimu Selovaru Vilatam
    notes:
      zh: "长夏群岛领地图书馆是领地的总图书馆，伊武兰语叫「Imimu Selovaru Vilatam」，在首府米雷兰帕萨卢区的公民广场西侧，与东侧的政策和计划委员会隔着广场相对。公民广场在规划轴线湖光大道的中段，大道在广场处有意断开，领地的庆典、国宾欢迎仪式和新年集会都在这里举行。图书馆是一座长约 160 米、宽约 120 米的街区式建筑，收藏中文、英文和伊武兰语的图书、报刊和档案，古王国时代的棕榈叶手抄本保存在恒温恒湿的地下书库里。阅览室全天开放，各市的公共图书馆和学校图书馆都与它联网，居民可以在任何一处借还，从萨伦纳姆借的书，在基鲁迈的小岛上也能还。领地三种官方语言并用，馆里的目录、指示牌和咨询服务都有中文、英文和伊武兰语三种。\n首府的居民一半以上是公务员和研究人员，午休时阅览室里坐满了来查资料的人，晚上则是学生和退休的老人。高原上夜里常降到十度上下，阅览室的椅背上搭着几条薄毯，读书的人顺手披上；广场四周种着成排的雨树，下午阵雨一来，在树下长椅上看书的人就一起涌进馆里躲雨。\n棕榈叶手抄本难得展出一次，每逢展出，全领地都有人专程坐真空磁悬浮来看，讲解员说，这些用铁笔刻在叶子上的字，比馆里任何一本书都更怕潮。"
      en: "The Everlong Summer Islands Territorial Library is the territory's central library; in Ivuran it is \"Imimu Selovaru Vilatam\", and it stands on the west side of Civic Square in Pasalu District of the capital, Mirelan, facing the Policy and Planning Commission across the square. Civic Square lies midway along the planned axis, Lakelight Avenue, which is deliberately broken at the square, and the territory's celebrations, welcomes for state guests and New Year gatherings are held here. The library is a city-block building about 160 m long and 120 m wide holding books, newspapers and archives in Chinese, English and Ivuran, and the palm-leaf manuscripts of the old kingdom are kept in climate-controlled vaults underground. Its reading rooms are open all day, and every city's public and school libraries are linked to it, so residents can borrow and return anywhere: a book borrowed in Sarunnam can be returned on a small island in Kirumai. The territory uses all three of its official languages side by side, and the library's catalogue, signs and enquiry services come in Chinese, English and Ivuran.\nMore than half the capital's people are civil servants and researchers, and at lunchtime the reading rooms fill with people looking things up, giving way in the evening to students and retired people. Nights on the plateau often drop to around 10 °C, so a few light blankets hang over the chair backs for readers to wrap round their shoulders; rain trees line the square, and when the afternoon shower arrives the people reading on the benches beneath them all crowd into the library for shelter.\nThe palm-leaf manuscripts are seldom shown, and whenever they are, people come from all over the territory by vacuum maglev to see them; the guides say these words, incised on leaves with an iron stylus, fear damp more than any other book in the building."
    in: div_z0z4vz
    offset_km: [-0.21, -0.58]
    site: { layout: block, size_m: [160, 120] }
  - id: poi_07n4t0
    subtype: research_institute
    status: generated
    names:
      zh: 长夏群岛热带医学研究院
      en: Everlong Summer Islands Institute of Tropical Medicine
      art-x-ivuran: Imimu Selovaru Kilavam
    notes:
      zh: "伊拉米区的研究院，研究疟疾、登革热等热带传染病的疫苗和药物，与领地的生物医药企业共建实验室；附属医院接收全领地转来的疑难病人，来自世界各地的学者约占研究人员的三成。研究院的走廊里挂着一张世界地图，插满了研究人员故乡的小旗，周五傍晚各国学者轮流掌勺，在院里的厨房做家乡菜请同事吃。"
      en: "The institute in Ilami District that develops vaccines and medicines for malaria, dengue and other tropical infections, with laboratories shared with the territory's biomedical firms. Its hospital takes difficult cases referred from all over the territory, and about three in ten of its researchers come from abroad. A world map in its corridor bristles with little flags for the researchers' home countries, and on Friday evenings scholars take turns in the institute kitchen cooking dishes from home for their colleagues."
    in: div_56take
    offset_km: [-0.5, 0.4]
    site: { layout: campus, size_m: [700, 450] }
  - id: poi_4dhh8j
    subtype: university
    status: generated
    names:
      zh: 长夏群岛大学高原校区
      en: University of the Everlong Summer Islands, Plateau Campus
      art-x-ivuran: Imimu Selovaru Saluvam Pala
    notes:
      zh: "长夏群岛大学高原校区是长夏群岛大学在首府米雷兰的校区，位于首府东部的伊拉米区，区名在伊武兰语里意为「知识」。校园占地约 900 × 600 米，设有医学、公共卫生和农业科学学院，与隔壁的长夏群岛热带医学研究院合办研究生课程，研究疟疾、登革热等热带传染病的疫苗和药物，医学院的学生在研究院附属医院实习，那里接收全领地转来的疑难病人。校园在高原上，比沿海凉爽，试验田里种着高原咖啡和新的稻种，农业科学学院的研究人员常到哈努帕拉区的咖啡园和中脊山坡的梯田里做试验。主校区在萨伦纳姆的伊拉瓦姆区，两地之间有长夏真空磁悬浮相连，不少教师在两个校区之间往返授课。领地的教育免费到大学，区内来自世界各地的学者约占三成，课堂上中文、英文和伊武兰语都听得到。\n高原夜里凉，学生们来上课总要带一件毛衣，沿海来的新生入学时常被学长送一件印着校名的毛衣，算是「毛衣首府」的入门礼。试验田收获时，农学院会把新稻种煮成一大锅饭请全校师生尝，大家给每个品种投票，得票最高的由学生起一个昵称。医学院的学生毕业前要跟着研究院的团队下乡做一次蚊虫调查，回来时手臂上总少不了几个包，他们笑称这是「热带医学的学位证」。"
      en: "The Plateau Campus is the capital campus of the University of the Everlong Summer Islands, in Ilami District in the east of Mirelan, a name that means \"knowledge\" in Ivuran. Covering about 900 × 600 m, it has schools of medicine, public health and agricultural science and runs graduate courses jointly with the neighbouring Everlong Summer Islands Institute of Tropical Medicine, which works on vaccines and drugs for malaria, dengue and other tropical infectious diseases; medical students train at the institute's hospital, which takes difficult cases referred from all over the territory. Up on the plateau it is cooler than the coast, its trial fields grow highland coffee and new rice varieties, and the agricultural scientists often run trials in the coffee gardens of Hanupala District and on the terraces of the central ridge. The main campus is in Ilavam District, Sarunnam, linked to the capital by the Everlong Summer Vacuum Maglev, and many teachers commute between the two campuses to teach. Education is free up to university in the territory; about three in ten academics in the district come from around the world, and Chinese, English and Ivuran can all be heard in class.\nPlateau nights are cool and students always carry a sweater to class, so freshers from the coast are often given one printed with the university's name by older students, an initiation into \"the sweater capital\". When the trial fields are harvested, the agriculture school cooks the new rice in a great pot for the whole university to taste; everyone votes on each variety, and the winner is given a nickname by the students. Before graduating, medical students go out once with the institute's teams to survey mosquitoes in the countryside, and always come back with a few bites on their arms, which they jokingly call \"the tropical medicine diploma\"."
    in: div_56take
    offset_km: [1.0, -0.8]
    site: { layout: campus, size_m: [900, 600] }
  - id: poi_qkqw91
    subtype: airport
    status: generated
    names:
      zh: 米雷兰机场
      en: Mirelan Airport
      art-x-ivuran: Mirelan Ulavan
    notes:
      zh: "米雷兰机场是首府米雷兰的机场，在翁贝尔区的湖畔高原上，场区约 3400 × 900 米，有航班飞往萨伦纳姆、基拉努和各地机场；高原空气稀薄，跑道比沿海机场长一些。翁贝尔区的区名在伊武兰语里意为「湖」，是首府湖畔的住宅区，翁贝尔哈努湖岸修有长长的湖滨步道和公共浴场。翁贝尔区有 14 万人，住宅以低层的公寓和庭院住宅为主，许多楼房带有遮阳的长廊和屋顶花园；湖畔还有领地的公共疗养院和水上运动中心，周末首府居民来这里划船、游泳。同在翁贝尔区的米雷兰站是长夏真空磁悬浮和米纳高速铁路的车站，也通地铁 2 号线，许多旅客坐火车来首府，再从这里乘飞机去基鲁迈群岛度假。航班上常见去帕萨卢区开会的官员和议员，也有去伊拉米区热带医学研究院的学者和转诊病人。\n从沿海飞来的旅客一下飞机就感到凉意，机场商店卖得最好的居然是毛衣和本地咖啡，米雷兰「毛衣首府」的外号就是这么来的。首府白天二十四五度，夜里常降到十度上下，晚班飞机落地时，接机的人手里多半拿着一件外套。下午常有一场阵雨，雨后湖面上浮起一层薄雾，飞机降落时，旅客从舷窗能看到雾里的湖面和湖滨步道上散步的人。"
      en: "Mirelan Airport is the airport of the capital, Mirelan, on the lakeside plateau in Ombel District; its site covers about 3,400 × 900 m, with flights to Sarunnam, Kilanu and the other airports, and the thin plateau air means its runway is a little longer than those on the coast. Ombel, whose name means \"lake\" in Ivuran, is the capital's lakeside residential district, with a long promenade and public bathing beaches along the shore of Lake Ombelhanu. Ombel District has 140,000 people, mostly in low-rise flats and courtyard houses, many with shaded verandas and roof gardens; the lakeside also has the territory's public sanatorium and a water sports centre, and at weekends the capital's residents come here to row and swim. Mirelan Station, also in Ombel District, is served by the Everlong Summer Vacuum Maglev and the Mirelan–Nalumai High-Speed Railway as well as Metro Line 2, and many travellers come to the capital by train and fly on from here for holidays in the Kirumai Islands. The flights often carry officials and assembly members going to meetings in Pasalu District, as well as academics and referred patients bound for the Institute of Tropical Medicine in Ilami District.\nPassengers from the coast feel the chill the moment they step off the plane, and the airport shop's best sellers are, of all things, sweaters and local coffee, which is how Mirelan came to be called \"the sweater capital\". Days in the capital reach 24 or 25 degrees, but nights often fall to around ten, so people meeting late flights usually have a jacket in hand. There is often a shower in the afternoon, after which a thin mist rises off the lake, and as planes come in to land passengers can see the lake through the haze and people strolling along the promenade."
    in: div_f0wwdt
    offset_km: [4.5, -1.0]
    site: { size_m: [3400, 900], layout: airport, angle_deg: 30 }

  # ── 长夏群岛领地政务院机构（M45）：米雷兰帕萨卢区湖光大道两侧，北段是对外、财政、司法、治安、民政、建设和中央派驻机构，南段是教科文、交通、卫生、劳社、自然资源及单独建楼的五个司，政策和计划委员会在公民广场东侧 ──
  - id: bld_jj116n
    subtype: government
    status: generated
    names:
      zh: 长夏群岛领地政务院对外事务部
      en: Ministry of External Affairs, Everlong Summer Islands Executive Council
    short_names:
      zh: 对外事务部
      en: Ministry of External Affairs
    notes:
      zh: 长夏群岛领地政务院对外事务部，位于首府米雷兰湖光大道北段西侧，紧邻政务院主楼，负责领地的对外交往和与中央政府的联络。部内设政策司、中央政府联络司、外国使领馆司、礼宾司、国际交流司和领事服务司。领地一半居民是来自中国其他省份和世界各地的移民，外国驻领地的领事馆和商务代表处大多设在萨伦纳姆，由外国使领馆司对口联系；礼宾司在公民广场筹办国宾欢迎仪式，国际交流司组织热带医学、海洋科学和热带农业方面的国际合作，领事服务司用中文、英文和伊武兰语为外国居民办理证明和认证。大楼为 L 形，临街一面是遮阳的长廊。
      en: The Ministry of External Affairs stands at the north end of Lakelight Avenue in Mirelan, on the west side next to the Government building, and handles the territory's dealings abroad and its liaison with the central government. Its departments are Policy, Central Government Liaison, Foreign Missions, Protocol, International Exchange and Consular Services. Half of the territory's people came from other provinces of China or from abroad, and most foreign consulates and trade offices are in Sarunnam, where the Foreign Missions Department keeps in touch with them. Protocol stages state welcomes on Civic Square, International Exchange arranges cooperation in tropical medicine, ocean science and tropical farming, and Consular Services certifies documents for foreign residents in Chinese, English and Ivuran. The L-shaped building has a shaded colonnade along the avenue.
    in: div_z0z4vz
    offset_km: [-0.36, 0.54]
    site: { size_m: [140, 110], layout: lshape }
