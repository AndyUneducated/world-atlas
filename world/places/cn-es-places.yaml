      zh: "赫维拉岛外海的发电场，由漂浮式风机、波浪能装置和海洋温差发电站组成，岛上的储能电站把电力存起来，经海底电缆送往三座岛屿，供应海军基地的全部用电，也为激光防空阵地供电。漂浮风机的叶片在海面上排成整齐的阵列，从驶近的补给船上看，像一片会转动的白色森林。"
      en: "The power farm off Hevila Island, made up of floating wind turbines, wave energy machines and an ocean thermal power plant. A storage station on the island holds the power and sends it by undersea cable to all three islands, supplying the whole naval base, including the laser air defence site. The floating turbines stand in neat ranks on the sea, and from an approaching supply ship they look like a white forest that turns."
