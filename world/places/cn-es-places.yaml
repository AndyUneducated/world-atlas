      en: The royal city of the old kingdom, its walls and moat enclosing the ruins of the palace; inside, only walking and cycling are allowed. The palace's stone stairs, throne platform and bathing pools survive, the old houses have become museums, workshops and guesthouses, and at festivals the whole city comes here to light lamps and offer flowers.
