      en: "Rings of mid-rise flats round shared gardens, nurseries and canteens, each ring home to two or three thousand people. Homes are allocated by household size and rent-free, with laundries, clinics and care homes on the ground floors. Each ring's garden has a fruit tree planted together by its residents, whose fruit is shared out by household, the rest going to the ring's canteen. The key wall in each community centre holds the keys to the cars, drills and camping tents the ring's residents share."
