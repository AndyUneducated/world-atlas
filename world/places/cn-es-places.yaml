      zh: 瓦希拉基地营区是海军长夏舰队司令部和瓦希拉基地勤务保障部队的驻地，在瓦希拉岛东部的小镇旁，是群岛上唯一有成片住房的地方。营区里有司令部大楼、营房、医院、学校和商店，常驻的官兵和技术人员约一万二千人分布在三座岛上，轮休时大多回到这里。群岛离最近的有人岛二百多公里，淡水靠海水淡化厂，食品和燃料由皮卢补给码头出发的补给船每周运来，赫维拉岛的海上发电场供应全部电力。营区外围是热带树林，岛上禁止私人船只和飞机靠近。
      en: "Vahira Base Garrison is the seat of the headquarters of the Navy's Everlong Summer Fleet and of the base's support units, beside the small town in the east of Vahira Island, the only place in the islands with streets of homes. It has the fleet headquarters, barracks, a hospital, a school and shops, and most of the roughly twelve thousand service members and technicians posted across the three islands come back here when off duty. The islands are more than 200 km from the nearest inhabited island: fresh water comes from a desalination plant, food and fuel arrive weekly on supply ships from Pilu Supply Quay, and all the power comes from the offshore power farm off Hevila Island. Tropical woodland surrounds the garrison, and no private boats or aircraft may come near the islands."
    in: div_ykkw7q
    offset_km: [0.4, -0.4]
    site: { size_m: [1000, 700], layout: camp, variant: hq, angle_deg: 0 }
