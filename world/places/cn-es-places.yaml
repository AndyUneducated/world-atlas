      en: The Everlong Summer Islands Policy and Planning Commission is a special commission directly under the Executive Council, on the east side of Civic Square facing the Territorial Library across it. Chaired by the governor, with the ministers and independent experts as members, it draws up the territory's medium- and long-term development plans, coordinates major policies that cross ministries and reviews how policies are working. Building a new capital on the plateau, the Everlong Summer Maglev and the Hanusiru Estuary Sea Bridge, and linking the Unovila nickel mines to the Talumaran battery plants all took shape here before going to the assembly. Every year the commission publishes a development report with each city's population, output, public services and the results of the residents' happiness survey. The square building is screened on all four sides by sun louvres.
