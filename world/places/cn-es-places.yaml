    notes:
      zh: 塔鲁卡无人舰艇船坞沿塔鲁卡岛北岸排开，是无人舰艇和水下无人航行器的自动化母港。舰艇回港后由机械臂自动系泊、加注燃料、充电和装填，检修机器人沿船坞轨道巡检船体，整个过程几乎不需要人手；需要大修的舰艇由浮船坞抬出水面。船坞的控制室里，少数操作员同时照看几十艘无人舰艇，舰艇的巡逻任务由瓦希拉地下作战指挥中心统一安排。
      en: Taruka Unmanned Vessel Docks line the north shore of Taruka Island and are the automated home port of the fleet's unmanned surface vessels and underwater vehicles. When a vessel returns, robot arms moor, fuel, charge and rearm it and inspection robots run along rails to check the hull, with hardly a human hand involved; vessels needing major work are lifted out by a floating dock. In the control room a handful of operators watch over dozens of unmanned vessels at once, whose patrols are set by the Vahira Underground Operations Centre.
    in: div_ykkw7q
