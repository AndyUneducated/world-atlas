      zh: 维京群岛领地政务院自然资源和环境保护部，位于长船古城东南，负责群岛的土地、海洋和能源资源的保护与利用。部内设政策司、自然生态保护司、大陆生态环境司、水生态环境司、海洋生态环境司、大气环境司、土壤生态环境司、固体废物和化学品司、环境影响评价和排放管理司、生态环境监测司和生态环境执法署，其中海洋生态环境司单独建楼。环境影响评价和排放管理司审批海上风电场、地热电站和港口扩建，自然生态保护司管理各岛的海鸟繁殖地和灰海豹保护区，固体废物和化学品司监督造船厂和港口的污染治理。
      en: The Ministry of Natural Resources and Environmental Protection of the Viking Islands, south-east of Longship's old town, protects and manages the islands' land, sea and energy resources. Its departments are Policy, Nature Conservation, Land Ecology, Freshwater Ecology, Marine Ecology, Air Quality, Soil Ecology, Solid Waste and Chemicals, Environmental Impact and Emissions, and Environmental Monitoring, with an Environmental Enforcement Agency; Marine Ecology has its own building. The impact assessors approve offshore wind farms, geothermal stations and harbour extensions, Nature Conservation looks after the seabird colonies and grey seal sanctuaries of the islands, and Solid Waste and Chemicals polices pollution at the shipyards and ports.
