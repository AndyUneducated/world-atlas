      en: Longship International Airport
      art-x-viking: Internationaler Flughafen Langskip
      art-x-buckham: Aeroporto Internazionale di Navelunga
    notes:
      zh: 群岛的国际枢纽机场，跑道顺着长船岛的走向；阿夫琳港、阿克斯维克与暖泉的机场只飞岛际与近程航线
      en: The islands' international hub, its runway along the length of Longship Island; the Port Aveline, Akkersvik and Warmspring airports fly only inter-island and short-haul routes.
    in: div_xps98r
    offset_km: [-3, -2]
    site: { size_m: [3200, 1100], layout: airport, angle_deg: 32 }
  - id: poi_hjf6h0
    subtype: port
    status: generated
    names:
      zh: 奥斯特哈门集装箱码头
      en: Austhamn Container Terminal
      art-x-viking: Containerterminal Austhamn
      art-x-buckham: Terminal Container di Porto Est
    notes:
      zh: 长船的货运港，三座突堤为两座集装箱和一座滚装码头，奥斯特哈门港口高速从这里直通汇金
      en: Longship's cargo port; its three moles hold two container terminals and a ro-ro terminal, and the Austhamn Port Expressway runs straight from here to Goldmark.
    in: div_j6mw1m
    site: { size_m: [4500, 2600], layout: harbour, terminals: [container, container, roro] }

