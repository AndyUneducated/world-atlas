    names:
      zh: 中央政府常驻维京群岛领地高级国务督办办公室
      en: Office of the Senior State Commissioner of the Central Government in the Viking Islands
    short_names:
      zh: 高级国务督办办公室
      en: Senior State Commissioner's Office
    notes:
      zh: 中央政府常驻维京群岛领地高级国务督办办公室，位于长船古城东南，是中央政府派驻群岛的最高代表机构。高级国务督办代表中央政府督促国家法律和政策在群岛的实施，协调国防、外交等中央事权与领地事务的衔接，例如群岛周边海域的防务、与北维京岛共建的海底通道，以及外国船舶和船员的管理；领地重大事项需要中央批准时，也由办公室转呈并跟进。办公室与政务院定期举行联席会议，每年向中央政府提交群岛情况的报告。
      en: The Office of the Senior State Commissioner of the Central Government in the Viking Islands, south-east of Longship's old town, is the central government's highest standing representation in the islands. The Senior State Commissioner sees that national laws and policies are carried out and links central responsibilities such as defence and foreign affairs with territorial business, for example the defence of the surrounding seas, the undersea link built jointly with North Viking Island and the rules for foreign ships and crews. When a territorial matter needs central approval, the office forwards it and follows it up. It meets the Executive Council in regular joint sessions and reports on the islands to the central government every year.
    in: div_g2g1yc
    offset_km: [1.0, -0.84]
    site: { size_m: [70, 70], layout: block }

  - id: bld_f5vn0z
