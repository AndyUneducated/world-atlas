    notes:
      zh: 维京群岛领地政务院教育、科学和文化部，位于长船古城西北，管理群岛的各级教育、科学研究和文化遗产。部内设教育政策司、科学政策司、文化政策司、教育技术司、信息技术司、教育从业人员司、科技从业人员司、文化从业人员司、学前教育司、基础教育司、成人和职业教育司、高等教育司和教育督导署。小岛上的学校规模很小，教育技术司为它们开设远程课堂，成人和职业教育司与造船厂、航运公司合办海员和船舶工程培训；文化政策司负责维京王厅遗址、长船博物馆和古城石砌建筑的保护，群岛大学的经费和评估由高等教育司管理。
      en: The Ministry of Education, Science and Culture of the Viking Islands, north-west of Longship's old town, oversees schooling at every level, research and the islands' heritage. Its thirteen units are the Education Policy, Science Policy, Cultural Policy, Educational Technology, Information Technology, Teaching Professions, Science and Technology Professions, Cultural Professions, Pre-school, Basic Education, Adult and Vocational Education and Higher Education departments and the Education Inspectorate. Schools on the small islands are tiny, so Educational Technology runs remote classrooms for them, and Adult and Vocational Education trains seafarers and marine engineers with the shipyards and shipping lines. Cultural Policy protects the Viking Hall Ruins, the Longship Museum and the stone buildings of the old town, and Higher Education funds and reviews the University of the Islands.
    in: div_g2g1yc
    offset_km: [-0.7, 1.21]
    site: { size_m: [130, 100], layout: lshape }

