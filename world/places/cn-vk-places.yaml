  - id: poi_4hccr3
    subtype: park
    status: generated
    names:
      zh: 黑沙滩
      en: Black Sand Beach
      art-x-viking: Schwarzer Strand
      art-x-buckham: Spiaggia Nera
    notes:
      zh: "黑沙滩在暖泉市斯瓦特桑德区，是火山熔岩冲刷成的黑色沙滩，斯瓦特桑德区由此得名，维京语里「斯瓦特桑德」就是黑沙的意思。沙滩长约 900 米，由暖泉火山喷发的玄武岩碎屑被海浪磨碎而成，沙粒乌黑发亮，白浪拍打黑沙的景象是暖泉最有名的风光之一。沙滩背后就是暖泉火山，熔岩地貌步道从附近穿过凝固的熔岩流、熔岩洞和火山锥，群岛最大的斯瓦特桑德地热电站也在区内，远处常能看到电站冒出的白色蒸汽。\n黑沙滩在雪后最好看，白雪落在黑沙上，海浪一冲，黑白相间，摄影师们常在雪夜过后的清晨赶来，抢在雪化之前按下快门。沙滩上的沙粒带着火山的余温，冬天赤脚踩上去也不觉得冷，孩子们喜欢在沙里找带气孔的小火山石，攒满一口袋带回家。这里的海浪力量很大，海边立着提醒游客不要靠近浪线的牌子，本地人也会告诉初来的人，「看海要退后三步」。\n暖泉环山公路从区内经过，北接温泉区，南通新特雷曼和克莱特斯塔德，沿线的温泉村、黑沙滩和落日岬观景台构成一条著名的观光路线。徒步者、摄影师和地质爱好者常年来访，傍晚的沙滩上常有人支起三脚架，等夕阳把黑沙和浪花一起染成金色。"
      en: "Black Sand Beach in Svartsand District of Warmspring City is a black beach washed from volcanic lava, and the district takes its name from it, Svartsand meaning black sand in Viking. About 900 m long, it is made of basalt debris from Warmspring Volcano ground down by the waves, its sand glossy black, and white surf breaking on black sand is one of Warmspring's most famous sights. The volcano rises behind the beach, the lava trail nearby winds among frozen lava flows, lava caves and cinder cones, and the Svartsand Geothermal Power Station, the largest in the islands, is in the same district, its white steam often visible in the distance.\nThe beach is at its best after snow, when white snow lies on black sand and the waves wash through it in black and white; photographers come out on the morning after a snowy night to catch it before the snow melts. The sand still holds the volcano's warmth, so even in winter it does not feel cold to bare feet, and children love to hunt in it for little bubbly volcanic stones until their pockets are full. The waves here are powerful, signs warn visitors not to go near the surf line, and locals tell newcomers to \"take three steps back to watch the sea\".\nThe Warmspring Volcano Road passes through the district, north to Hot Springs and south to New Tremaine and Klettstad, and the hot-spring villages, Black Sand Beach and the Sunset Point viewpoint along it make a well-known scenic route. Walkers, photographers and geology enthusiasts come all year, and in the evening tripods often stand on the beach, waiting for the setting sun to turn the black sand and the surf to gold together."
    in: div_v2tq1k
    offset_km: [-0.5, -0.4]
    site: { layout: park, size_m: [900, 250] }
  - id: poi_gsnass
    subtype: airport
    status: generated
    names:
      zh: 暖泉机场
      en: Warmspring Airport
      art-x-viking: Flughafen Warmquell
      art-x-buckham: Aeroporto di Fontecalda
    notes:
      zh: "暖泉机场在暖泉市温泉区北面的海滨平原上，跑道长约 2.8 公里，和阿夫琳港、阿克斯维克的机场一样只飞岛际与近程航线，航班通往长船、北维京岛的维京港和群岛各岛。一条三公里多长的机场公路把航站楼与温泉区连起来，暖河高速也从温泉区出发，经一座七公里长的特大桥跨越暖河，通往暖河区的港口。\n冬季是机场最忙的季节，迎来看极光、泡温泉的游客。降落前旅客能从舷窗看到地热田上升起的白色蒸汽和远处的暖泉火山，山顶的冰帽在阳光下发亮，冬夜的航班有时会在极光里降落，绿色的光带在机翼上方飘动，机舱里一片惊叹。温泉区是暖泉市的中心城区，群岛规模最大的暖泉温泉度假村有数十个露天温泉池，泉水从三十多度到七十多度不等，区里的疗养院和会议度假村也常年有来自群岛和北维京岛的客人，许多人就是坐飞机来的。\n行李转盘旁有一块温泉区的公共浴池时刻表，许多人下了飞机就直接去泡澡，拖着行李箱走进浴池更衣室的旅客并不少见。机场的地勤人员说，冬天最常被问的问题不是「出租车在哪」，而是「今晚有没有极光」，所以到达大厅的屏幕上除了航班信息，还滚动播放着当晚的极光预报。"
      en: "Warmspring Airport lies on the coastal plain north of Hot Springs District in Warmspring City; its runway is about 2.8 km long and, like the Port Aveline and Akkersvik airports, it flies only inter-island and short-haul routes, with flights to Longship, Viking Port on North Viking Island and the other islands. An airport road a little over three kilometres long links the terminal with Hot Springs, from where the Warm River Expressway also sets out, crossing the Warm River on a seven-kilometre bridge to the port in Warm River District.\nWinter is the airport's busiest season, bringing visitors who come for the aurora and the hot springs. Before landing, passengers can see white steam rising from the geothermal fields and the volcano in the distance, its ice cap shining in the sun, and winter-night flights sometimes land through the aurora, green ribbons rippling above the wings to gasps in the cabin. Hot Springs is the central district of Warmspring City, and the Warmspring Spa Resort, the largest in the islands, has dozens of open-air pools ranging from the thirties to the seventies in degrees Celsius; the district's sanatoriums and conference resorts also host guests from the islands and North Viking Island all year, many of whom arrive by air.\nBeside the baggage carousel hangs a timetable for the public baths of Hot Springs, and many people go straight from the plane to bathe; travellers wheeling their suitcases into the changing rooms are not an unusual sight. The ground staff say that in winter the question they are asked most is not \"where are the taxis?\" but \"will there be an aurora tonight?\", so the screens in the arrivals hall scroll the night's aurora forecast along with the flight information."
    in: div_cz7sch
    offset_km: [4.2, 9.2]
    site: { size_m: [2800, 900], layout: airport, angle_deg: 60 }

  # ── 阿克斯维克市 ──
  - id: poi_grh5jd
    subtype: port
    status: generated
    names:
      zh: 阿克斯维克集装箱港
      en: Port of Akkersvik
      art-x-viking: Hafen Akkersvik
      art-x-buckham: Porto di Portancora
    notes:
      zh: "阿克斯维克集装箱港是群岛最大的港口，在阿克斯岛两爪之间的阿克斯维克湾里，属阿克斯维克市阿克斯维克区。阿克斯维克湾面积七百多平方公里，水深浪静，湾口有卡蒂马苏克岛屏障，东爪岬上的灯塔为进港船只导航，大型集装箱船和散货船可以全天候进出。港区长约 5 公里、宽约 3 公里，五座突堤为油品、散货、两座集装箱和滚装码头，岸桥林立，堆场一望无际，岛际货轮从这里把货物分拨到各岛，港口也是远洋航线上的重要中转港。\n港区后方是物流园、保税仓库、冷链中心和集装箱维修厂，码头工人、船员、报关员和卡车司机构成了社区的主体；湾对岸的瑙斯特海姆区有阿克斯维克造船厂，链城区的群岛航运交易所则在写字楼里为这些船买卖运价。阿克斯岛纵贯高速和阿斯跨海高速都从港区附近出发，集装箱卡车昼夜往返。夜晚的阿克斯维克湾灯火通明，岸桥和货轮的灯光倒映在湾水中，港口的汽笛声此起彼伏。\n傍晚时分，西爪岬的海岸步道上能看到集装箱船一艘接一艘驶出阿克斯维克湾，本地孩子比赛认船上的公司旗，认得最多的被大家叫作「小引水员」。码头工人的早餐是一大碗加了熏肉的豌豆汤，港区食堂天不亮就开始熬，夜班下来的人和早班上岗的人在同一张长桌上碰面。"
      en: "The Port of Akkersvik is the largest port in the islands, in Akkersvik Bay between Akkersey's two flukes, in Akkersvik District of Akkersvik City. The bay is more than 700 km², deep and calm, sheltered at its mouth by Kattimasuq Island, with the lighthouse on East Fluke guiding ships in, so large container ships and bulk carriers can come and go in any weather. The port area is about 5 km long and 3 km wide, its five moles holding oil, bulk, two container and a ro-ro terminal, with quay cranes in rows and yards as far as the eye can see; inter-island freighters distribute cargo from here to the other islands, and it is also an important transhipment port on deep-sea routes.\nBehind the port lie logistics parks, bonded warehouses, cold stores and container repair yards, and dockers, seafarers, customs brokers and lorry drivers make up most of the community; across the bay in Naustheim is the Akkersvik Shipyard, while in the offices of Chain Town the Islands Shipping Exchange buys and sells freight for these ships. The Akkersey Spine Expressway and the Akkersvik–Styrvik Sea Crossing both start near the port, and container lorries run back and forth day and night. At night Akkersvik Bay is ablaze with light, the cranes and freighters reflected in the water, and ships' horns sound one after another.\nIn the evening, from the coastal path on West Fluke, you can watch container ships leave Akkersvik Bay one after another, and local children compete to name the company flags on board; whoever knows the most is dubbed \"little pilot\". The dockers' breakfast is a big bowl of pea soup with bacon, which the port canteen starts simmering before dawn, and those coming off the night shift meet those starting the early shift at the same long table."
    in: div_a2n8cw
    offset_km: [-3.1, -1.8]
    site: { size_m: [5000, 3000], layout: harbour, terminals: [oil, bulk, container, container, roro] }
  - id: poi_a7t36e
    subtype: industrial_park
    status: generated
    names:
      zh: 阿克斯维克造船厂
      en: Akkersvik Shipyard
      art-x-viking: Werft Akkersvik
      art-x-buckham: Cantiere Navale di Portancora
    notes:
      zh: "群岛最大的造船厂，船台与干船坞建造渡轮、渔船和海上风电安装船，瑙斯特海姆区由此得名。每有新船下水，全厂工人站在船坞两侧一齐用扳手敲打钢栏杆，叮叮当当的声音传遍半座城，附近的居民听到就知道「又一艘船出嫁了」。"
      en: "The largest shipyard in the islands, whose slipways and dry docks build ferries, fishing boats and offshore wind installation vessels; the Naustheim District is named after it. Whenever a new ship is launched, the whole workforce lines both sides of the dock and beats the steel railings with spanners, a clangour heard across half the city that tells the neighbours \"another ship has been married off\"."
    in: div_qyhvjj
    offset_km: [0.7, -4.9]
    site: { size_m: [2000, 700], layout: port }
  - id: bld_77hf7p
    subtype: office
    status: generated
    names:
      zh: 群岛航运交易所
      en: Islands Shipping Exchange
      art-x-viking: Schifffahrtsbörse der Inseln
      art-x-buckham: Borsa Marittima delle Isole
    notes:
      zh: "船舶租赁与运费交易的大厅，与船级社一起坐落在锚链大道上。大厅里流行一种掺了朗姆酒的热咖啡，据说是给彻夜盯着远洋航线的经纪人提神的。墙上一块巨大的电子海图实时显示群岛船东的船舶位置，经纪人看一眼就知道哪片海域的运费要涨。"
      en: "The hall where ships are chartered and freight is traded, on Cable Avenue next to the classification society. The fashion in the hall is hot coffee laced with rum, said to keep brokers awake through nights spent watching the ocean routes. A huge electronic chart on the wall shows the position of every island-owned ship in real time, and one glance tells a broker where freight rates are about to rise."
    in: div_b569a2
    offset_km: [0.3, 0.3]
    site: { layout: hall, size_m: [200, 140] }
  - id: poi_1b074w
    subtype: airport
    status: generated
    names:
      zh: 阿克斯维克机场
      en: Akkersvik Airport
      art-x-viking: Flughafen Akkersvik
      art-x-buckham: Aeroporto di Portancora
    notes:
      zh: "阿克斯维克机场在阿克斯维克市链城区南面的平地上，是阿克斯岛的航空门户。机场有一条约 3 公里长的跑道，和阿夫琳港、暖泉的机场一样只飞岛际与近程航线，航班通往长船、北维京岛的维京港和群岛各岛；远程旅客则先飞长船国际机场转机。一条三公里多长的机场公路把航站楼与链城连在一起，阿克斯高速铁路的阿克斯维克站也在链城，从长船来的旅客常在飞机和高铁之间掂量哪个更快。\n阿克斯维克是群岛第二大城市，链城区有群岛航运交易所、船级社和许多远洋航运公司的总部，早班飞机上坐满了提着公文包的船舶经纪人、验船师和保险理赔员，他们当天飞去长船开会，晚上再飞回来。夏季的航班则多了来看峡湾和锚链冰川的游客，行李转盘上常能看到登山杖和冰爪。\n机场的候机厅里挂着一只巨大的铁锚，是阿克斯维克人送给每位旅客的第一眼问候，不少人下了飞机先在铁锚前拍一张照片。本地足球队客场比赛时，球迷们常常包下整架飞机出发，候机厅里满是围巾和歌声，机长起飞前也会在广播里祝球队好运；赢了球回来，跑道尽头的消防车有时会喷出两道水柱，给飞机来一次「凯旋洗礼」。"
      en: "Akkersvik Airport lies on flat ground south of Chain Town District in Akkersvik City, Akkersey's gateway by air. It has a runway about 3 km long and, like the Port Aveline and Warmspring airports, flies only inter-island and short-haul routes, with flights to Longship, Viking Port on North Viking Island and the other islands; long-haul passengers change at Longship International. An airport road a little over three kilometres long links the terminal with Chain Town, where Akkersvik Station on the Akkersey High-Speed Railway also stands, and travellers from Longship often weigh up whether the plane or the train is quicker.\nAkkersvik is the second city of the islands, and Chain Town is home to the Islands Shipping Exchange, the classification societies and the head offices of many deep-sea shipping lines, so the early flights are full of shipbrokers, surveyors and insurance adjusters with briefcases, flying to Longship for the day's meetings and back again in the evening. In summer the flights fill with visitors come to see the fjords and the Anchor Chain Glacier, and walking poles and crampons ride round the baggage carousel.\nA huge iron anchor hangs in the departure hall, Akkersvik's first greeting to every traveller, and many people take a photograph in front of it as soon as they land. When the local football team plays away, the fans often charter a whole plane, the hall fills with scarves and singing, and the captain wishes the team luck over the speakers before take-off; when they come home winners, the fire engines at the end of the runway sometimes spray two arcs of water over the plane in a \"victory wash\"."
    in: div_b569a2
    offset_km: [0.7, -10.6]
    site: { size_m: [3000, 900], layout: airport, angle_deg: 60 }

  # ── 其他城市 ──
  - id: poi_grhsm8
    subtype: power_station
    status: generated
    names:
      zh: 弗洛德维克潮汐电站
      en: Flodvik Tidal Power Station
      art-x-viking: Gezeitenkraftwerk Flodvik
      art-x-buckham: Centrale Mareomotrice di Baiamarea
    wonder:
      zh: 世界唯一的潮汐电站，坝顶兼作海堤
      en: The only tidal power station in the world, its dam doubling as a sea wall
    notes:
      zh: "弗洛德维克潮汐电站是世界唯一的潮汐电站，横跨弗洛德维克的海湾口，坝顶兼作海堤，坝区长约 1.2 公里。电站在长船岛西北岸的弗洛德维克市，阿克斯海峡在这里收窄，潮差大、潮流急，是群岛开发潮汐能的最佳地点。涨潮时海水穿过闸孔涌进湾内，落潮时湾里的水再从坝下流回海峡，涨落潮都推动坝下的水轮机组发电，每天两次的涨落潮为长船都市区提供清洁电力；电站的发电量也跟着潮汐表一涨一落，调度员每天按潮汐表排出发电的时段。大坝挡住了海峡里的风暴潮，坝后的老渔村和低处的街区因此少了被海水倒灌的担心。坝上设有观景步道和展示中心，展示中心讲解潮汐发电的原理，是学生和游客的热门去处，群岛的中小学生几乎都来这里上过一堂「潮水课」。\n弗洛德维克市全市只设弗洛德维克一区，人口约四十万，居民以维京语为母语的家庭居多，劳动年龄人口比例较高。电站的运维、海洋工程和电力设备制造带动了地方工业，许多居民就在电站、渔港和海鲜市场工作。弗洛德维克渔港是长船岛西北岸最大的渔港，弗洛德维克海鲜市场每天清晨拍卖新鲜的鳕鱼、比目鱼、螃蟹和贻贝，拍卖用维京语报价，长船的餐馆和超市大多从这里进货。阿克斯跨海高速从这里出发，以弗洛德维克特大桥跨过水深流急的阿克斯海峡通往阿克斯维克；阿克斯高速铁路在弗洛德维克设站，铁路桥与公路桥并排跨过海峡，晴天时站在坝上能看到对岸阿克斯岛的山影。长船西岸高速和长船西北岸公路也从这里经过或出发，周末许多长船人专程开车来坝上看潮、到市场吃海鲜。\n坝顶修了一条步道，涨落潮时可以站在坝上看海水从闸孔里翻滚而过，是本地人饭后散步的去处。弗洛德维克人的生活跟着潮水走，城里的日历、公交站牌和咖啡馆的纸杯上都印着当天的潮汐表，约朋友见面常说「涨潮时见」。闸孔外的急流里鱼多，傍晚坝下的护栏边总站着一排钓鱼的人，海鸥在他们头顶盘旋，等着分一口。每逢大潮，坝上的人比平时多一倍，潮水最急的时候，闸孔外的海面卷起一个个旋涡，孩子们趴在栏杆上数着旋涡等潮水转向。散步的老人们爱打赌下一次潮水几点几分转向，输的人请喝一杯咖啡，可惜潮汐表就印在杯子上，这个赌很难赢。"
      en: "The Flodvik Tidal Power Station is the only tidal power station in the world, a barrage about 1.2 km long across the mouth of Flodvik's bay whose crest doubles as a sea wall. It lies in Flodvik City on the north-west coast of Longship Island, where the Akkersey Strait narrows and the tidal range is great and the currents strong, the best place in the islands to harness the tide. On the rising tide the sea pours through the sluices into the bay, and on the falling tide the water in the bay runs back under the barrage to the strait; both drive the turbines in the dam, and the two tides a day supply clean power to the Longship metropolitan area. The station's output rises and falls with the tide table, and each day the dispatchers plan the generating hours from it. The barrage holds back storm surges from the strait, sparing the old fishing village and the low-lying streets behind it the fear of the sea flooding in. A viewing walkway and an exhibition centre sit on the barrage, the centre explaining how tidal power works, and it is a favourite with students and visitors; almost every schoolchild in the islands has had a \"tide lesson\" here.\nFlodvik City has only one district, Flodvik, and about 400,000 people, mostly from Viking-speaking families and with a high share of working age. Running the station, marine engineering and electrical equipment manufacturing support local industry, and many residents work at the station, the fishing port or the seafood market. Flodvik's fishing port is the largest on Longship Island's north-west coast, and every morning Flodvik's seafood market auctions fresh cod, flatfish, crab and mussels, bidding in Viking, while most of Longship's restaurants and supermarkets buy here. The Akkersey Strait Crossing starts here, crossing the deep, fast-flowing strait on the Flodvik Sea Bridge to Akkersvik; the Akkersey High-Speed Railway has a station at Flodvik, its rail bridge running alongside the road bridge across the strait, and on clear days you can see the hills of Akkersey across the water from the barrage. The Longship West Shore Expressway and the Longship North-West Shore Road also pass or start here, and at weekends many people drive out from Longship to watch the tide from the barrage and eat seafood at the market.\nA walkway runs along the top of the barrage, where at the turn of the tide you can watch the sea churn through the sluices, and it is where locals take their after-dinner stroll. Life in Flodvik follows the tide: the town's calendars, bus-stop signs and café cups all carry the day's tide table, and people arrange to meet \"at high water\". The race below the sluices is full of fish, so in the evening there is always a row of anglers along the railing at the foot of the barrage, with gulls wheeling overhead waiting for their share. At spring tides twice as many people come out onto the barrage, and when the tide runs hardest the sea beyond the sluices spins into whirlpool after whirlpool, which children lean on the railing to count while they wait for the tide to turn. Old people out for a stroll like to bet on the minute the next tide will turn, the loser buying a coffee, but since the tide table is printed on the cup it is a hard bet to win."
    in: div_0yqqc3
    offset_km: [-1.4, 2.8]
    site: { size_m: [1200, 300], layout: port }
  - id: poi_642znz
    subtype: ski_resort
    status: generated
    names:
      zh: 谢尔海姆山滑雪场
      en: Kjølheim Hills Ski Area
      art-x-viking: Skigebiet Kjølheimberge
      art-x-buckham: Comprensorio Sciistico di Monte Chiglia
    notes:
      zh: "谢尔海姆山滑雪场建在谢尔海姆市谢尔海姆区背后的山坡上，在谢尔海姆山的北坡，缆车从镇边出发，冬季雪道直通海岸。滑雪场拥有数十条雪道和多条缆车，从初级道到高难度的黑道一应俱全，谢尔海姆一月平均气温零下 1 度，是群岛少有的冬天积雪的地方。冬季周末长船和斯蒂尔维克的滑雪者蜂拥而至，许多人坐群岛高速铁路到谢尔海姆站，再换乘公交上山，滑雪学校、雪具租赁和山间旅馆的生意十分兴旺。\n夏季滑雪场变成山地自行车公园和高山草甸徒步线，山顶的观景台可以同时看到长船岛东西两侧的大海。缆车站门口挂着一块旧船板，据说是从岛上第一条渔船上拆下来的，长船人说整座岛是一条倒扣的船，谢尔海姆山是龙骨，滑雪的人就是在「船底」上往下冲。\n最后一班缆车下山前，工作人员会摇三下铜铃，听到铃声的滑雪者就知道该收工了，山坡上的人影便一个个朝镇边滑去。山脚木屋里的热巧克力、越橘松饼和鹿肉香肠是一天滑雪后的犒赏，木屋的壁炉边总挤满了脱下雪靴烤脚的人。镇上的孩子大多是在这片雪坡上学会滑雪的，老人们说，在谢尔海姆，「先会滑雪，后会骑车」。"
      en: "The Kjølheim Hills Ski Area lies on the hillside behind Kjølheim District in Kjølheim City, on the northern slopes of the Kjølheim Hills; its lifts start at the edge of town, and in winter its runs reach all the way down to the coast. It has dozens of runs and several lifts, from nursery slopes to steep black runs, and Kjølheim, averaging −1 °C in January, is one of the few places in the islands where snow lies in winter. On winter weekends skiers from Longship and Styrvik pour in, many taking the Island Chain High-Speed Railway to Kjølheim Station and a bus up the hill, and the ski schools, rental shops and mountain inns do a roaring trade.\nIn summer the ski area becomes a mountain-bike park and alpine-meadow walks, and the viewpoint on top looks out on the sea on both sides of Longship Island at once. An old ship's plank hangs at the door of the lift station, said to come from the first fishing boat ever built on the island; Longship people say the island is an upturned boat with the Kjølheim Hills as its keel, so skiers are racing down \"the bottom of the hull\".\nBefore the last lift goes down, the staff ring a brass bell three times, and skiers who hear it know it is time to stop, the figures on the slope streaming one by one towards the edge of town. Hot chocolate, lingonberry muffins and venison sausages in the lodge at the bottom are the reward after a day's skiing, and its fireside is always crowded with people warming their feet out of their boots. Most of the town's children learned to ski on these slopes, and old people say that in Kjølheim \"you ski before you can ride a bike\"."
    in: div_drqyc2
    offset_km: [0.6, 0.6]
    site: { layout: park, size_m: [900, 600] }
  - id: poi_bey42c
    subtype: hotel
    status: generated
    names:
      zh: 圣翁丁海滨度假村
      en: Saint-Ondine Beach Resort
      art-x-viking: Strandresort Saint-Ondine
      art-x-buckham: "Resort di Spiaggia di Sant'Ondine"
    notes:
      zh: "群岛最南端的海滨度假村，夏季日落很晚，晚上十点仍可在沙滩上看落日。度假村的露台面朝西方，夏天晚饭后客人们端着酒坐在露台上等日落，太阳沉进海里时常有人鼓掌。早餐少不了一种撒了海盐的煎饼，不少客人一住就是一整个夏天。"
      en: "The beach resort at the southern end of the islands; summer sunsets come late, and guests still watch them from the sand at ten in the evening. Its terraces face west, and on summer evenings guests sit out with a drink after dinner waiting for the sunset, often applauding as the sun goes into the sea. Breakfast always includes a pancake sprinkled with sea salt, and many guests stay the whole summer."
    in: div_ht5w2y
    offset_km: [0.4, 0.4]
    site: { layout: park, size_m: [600, 400] }
  - id: bld_n1tznn
    subtype: marketplace
    status: generated
    names:
      zh: 菲斯克海姆鱼市
      en: Fiskheim Fish Market
      art-x-viking: Fischmarkt Fiskheim
      art-x-buckham: Mercato del Pesce di Porto Pescatori
    notes:
      zh: "群岛最大的鲜鱼拍卖市场，渔船清晨靠岸后当场竞拍鳕鱼与鲱鱼。拍卖结束后，鱼市二楼的小食堂把当天的边角鱼货炖成一锅鱼汤，渔民和买家坐在同一张长桌上喝。萨尔塔维克的海盐也在这里出售，许多人买了鱼顺手带一袋盐回家腌鲱鱼。"
      en: "The largest fresh-fish auction in the islands; boats land at dawn and the cod and herring are auctioned on the spot. After the auction the little canteen upstairs stews the day's odds and ends into a pot of fish soup that fishermen and buyers drink at the same long table. Saltavik sea salt is sold here too, and many people pick up a bag with their fish to pickle herring at home."
    in: div_z1y7bz
