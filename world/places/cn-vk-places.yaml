    names:
      zh: 韦克斯利航天测控站
      en: Wexley Tracking Station
      art-x-viking: Bodenstation Wexley
      art-x-buckham: Stazione di Controllo di Wexley
    notes:
      zh: "韦克斯利岛上的航天测控站，几面大型天线跟踪从北维京岛发射的航天器，四面开阔的海天没有遮挡。每次北维京岛有发射，测控站的天线就一齐转向东北方，值班员在屏幕前盯着航天器飞过群岛上空。站外的空地上常有游客等着看天线转动，本地人说「天线一转，马斯林山就要放火箭了」。"
      en: "A spacecraft tracking station on Wexley Island; its large dishes follow the launches from North Viking Island across an open horizon on every side. Whenever there is a launch from North Viking Island the station's dishes all turn north-east together, and the duty crew watch the spacecraft cross the sky above the islands. Visitors often wait on the open ground outside to watch the dishes swing round; locals say \"when the dishes turn, Maslin Mountain is about to launch\"."
    in: div_v2tq1k
    offset_km: [19.6, -76.2]
  - id: poi_vh8f5f
    subtype: radar_station
    status: generated
    names:
      zh: 哨岛雷达站
      en: Sentinel Isle Radar Station
      art-x-viking: Radarstation Wachposteninsel
      art-x-buckham: Stazione Radar di Isola della Sentinella
    notes:
      zh: "哨岛山顶的海事与气象雷达，监视从东方进入群岛的航路。雷达站的值班员一年四季在山顶面对大风，本地人说这里是「群岛最先知道天气的人」。站里的气象数据每天清晨送到各条渡轮的驾驶台，船长们出航前都要看一眼哨岛的报告。"
      en: "The maritime and weather radar on the summit of Sentinel Isle, watching the sea lanes into the islands from the east. The radar crews face the wind on the summit in every season, and locals call them \"the first in the islands to know the weather\". The station's weather data reaches every ferry bridge each morning, and skippers check the Sentinel Isle report before they sail."
    in: div_72h3ge
    offset_km: [111.9, 0.9]
  - id: poi_93y3rq
    subtype: lighthouse
    status: generated
    names:
      zh: 哈洛兰岛灯塔
      en: Halloran Island Lighthouse
      art-x-viking: Leuchtturm Halloraninsel
      art-x-buckham: Faro di Isola Halloran
    notes:
      zh: "哈洛兰岛灯塔是群岛北部的灯塔，立在长船市西岸区外海的哈洛兰岛上，标出从北方进入群岛的航路，也是从北维京岛驶来的船只最先望见的灯光。哈洛兰岛面积近两百平方公里，地势低平，岛上除灯塔外只有零星的牧场和渔屋，旧时水手称这座灯塔为「北门」，过了它，就算进了群岛的海域。岛上的羊群和渔屋离灯塔不远，牧人和渔民偶尔会帮忙照看灯塔周围的围栏和小路。\n灯塔的白色塔身立在低平的海岛上，夜里光束扫过海面，为驶向长船的船只照路；冬季北风从海上直灌过来，浪花打上礁岩，灯光在风雨里一明一灭。从长船西岸区的海滨公园望去，西北海面上的哈洛兰岛灯塔是西岸的标志，夏季傍晚，居民在海边散步、野餐，看着灯塔亮起，夕阳沉入它身后的海面。\n乘船从北维京岛回来的群岛人都把它的灯光当作「快到家了」的信号，灯塔下挂着一块牌子，写着一句维京语的「欢迎回到群岛」。渡轮驶近时，船上常有人走到甲板上，等着看那块牌子从夜色里出现；离家多年的人说，看见哈洛兰岛的灯光那一刻，比踏上码头还要激动。西岸区的孩子们则把灯塔当作钟表，灯一亮，就知道该回家吃晚饭了。"
      en: "The Halloran Island Lighthouse is a lighthouse in the north of the islands, standing on Halloran Island off West Shore District of Longship; it marks the route into the islands from the north and is the first light seen by ships coming from North Viking Island. Halloran Island is nearly 200 km² of low, flat land with nothing but a few scattered pastures and fishermen's huts besides the lighthouse; old sailors called the light \"the North Gate\", and once past it you were in the islands' waters. The island's sheep and fishermen's huts are not far from the lighthouse, and the shepherds and fishermen sometimes help look after the fences and paths around it.\nThe white tower stands on the low island, its beam sweeping the sea at night to light the way for ships bound for Longship; in winter the north wind drives straight in off the sea, spray breaks over the rocks, and the light flashes through wind and rain. Seen from the seaside parks of Longship's West Shore District, the lighthouse out on the north-western sea is the emblem of the shore, and on summer evenings residents stroll and picnic by the sea, watching the light come on as the sun sinks into the sea behind it.\nIslanders coming home by sea from North Viking Island take its light as the sign that they are \"nearly home\", and a sign at the foot of the lighthouse says \"Welcome back to the islands\" in Viking. As the ferries draw near, people often go out on deck to wait for the sign to appear out of the dark; those who have been away for years say the moment they see Halloran's light moves them more than stepping onto the quay. West Shore's children, meanwhile, use the lighthouse as a clock: when the light comes on, it is time to go home for dinner."
    in: div_kecby5
    offset_km: [17.2, 132.1]
  - id: poi_2tkpby
    subtype: lighthouse
    status: generated
    names:
      zh: 灯塔岛灯塔
      en: Lighthouse Isle Light
      art-x-viking: Leuchtfeuer Leuchtturminsel
      art-x-buckham: Faro dell'Isola del Faro
    notes:
      zh: "灯塔岛灯塔是阿夫琳岛东端外灯塔岛上的老灯塔，为进出阿夫琳湾的邮轮与渔船引航，小岛也因它得名。灯塔立在岛上的高处，隔着宽不到三公里的灯塔水道，与阿夫琳岛上的阿夫琳港灯塔遥相呼应；水道是进出阿夫琳湾的航道，大型邮轮从灯塔下缓缓驶过，开进阿夫琳港邮轮母港。灯塔岛面积约 310 平方公里，全岛是草坡和礁石，海鸟在崖壁上筑巢。起雾的日子里，灯塔的雾笛一声接一声，在海湾里回荡，晴天时从灯塔下可以望见阿夫琳湾和远处的卡洛韦峰。\n灯塔岛上只住着一户看守人家，补给船每周从阿夫琳港来一次，送来食品、燃料和信件。看守人每天检查灯具、记录天气，风大的夜里还要起身查看灯光是否正常。看守人在岛上种了一小片土豆，说是「全阿夫琳最靠海的菜园」，海风咸、土层薄，土豆个头不大，煮熟后却格外粉甜，补给船的船员每次来都要讨几个带回去。\n夏天的观光船会绕岛一圈，看守人站在灯塔下挥手回应，船上的乘客也纷纷挥手，有人还会举起写着字的纸板向他问好。夏季座头鲸和虎鲸经灯塔水道洄游，观鲸船常在灯塔附近停下等鲸群，看守人在高处看得最清楚，有时会用无线电告诉船长鲸鱼在哪一边喷水。"
      en: "The Lighthouse Isle Light is the old lighthouse on Lighthouse Isle off the eastern end of Aveline Island, guiding cruise ships and fishing boats in and out of Aveline Bay; the islet is named after it. It stands on high ground and answers the Port Aveline Lighthouse on Aveline Island across Lighthouse Sound, less than three kilometres wide; the sound is the fairway into Aveline Bay, and big cruise ships glide slowly past below it into the Port Aveline Cruise Port. Lighthouse Isle is about 310 km² of grass and rock, with seabirds nesting on its cliffs. On foggy days the foghorn sounds again and again, echoing round the bay, and on clear days you can see Aveline Bay and Mount Calloway in the distance from the foot of the light.\nOnly one keeper's family lives on Lighthouse Isle, and a supply boat comes out from Port Aveline once a week with food, fuel and post. The keeper checks the lamp and records the weather every day, and on windy nights gets up to make sure the light is working. He has planted a small potato patch on the island, which he calls \"the vegetable garden closest to the sea in all of Port Aveline\"; with salty wind and thin soil the potatoes are small, but they cook up wonderfully floury and sweet, and the supply boat's crew always ask for a few to take home.\nIn summer the sightseeing boats circle the island and the keeper stands at the foot of the lighthouse waving back; the passengers wave too, and some hold up hand-lettered signs to greet him. Humpbacks and killer whales pass through Lighthouse Sound in summer, and the whale-watching boats often wait near the lighthouse for the pods; the keeper has the best view from up high, and sometimes radios the skippers to tell them on which side the whales are blowing."
    in: div_8a2hzm
    offset_km: [50.2, -2.9]
  - id: poi_4gy708
    subtype: nature_reserve
    status: generated
    names:
      zh: 赫里姆岛自然保护区
      en: Hrimey Nature Reserve
      art-x-viking: Naturschutzgebiet Hrimey
      art-x-buckham: "Riserva Naturale dell'Isola del Gelo"
    notes:
      zh: "赫里姆岛自然保护区覆盖阿克斯岛以北的整座赫里姆岛，面积一百八十多平方公里，属富鲁海姆市富鲁海姆区，苔原与海鸟崖保持原貌，只允许科考人员登岛。赫里姆岛每年冬季最早结霜，冬季常有海冰和霜雾笼罩，岛上是苔原、湿地和海鸟栖息地，是观察北极狐和海鸟的好地方，与锚链冰川一起是富鲁海姆最受欢迎的自然景点。\n岛上没有码头，科考人员只能在风平浪静的日子乘小艇登岸，赶上风暴就要在岛上的小屋里多住几天。小屋里备着罐头、燃料和无线电，墙上贴着历年登岛人员写下的观测记录和天气笔记。科考人员每年在岛上统计海鸟的巢数，观察北极狐的洞穴和苔原植物的生长，记录气候变化给这片最北端小岛带来的影响。游客不能上岸，夏季可以跟着向导乘小船从富鲁海姆镇出发，沿岸观察筑巢的海鸟，远远望见苔原上奔跑的北极狐。\n巡护员说，这里的海鸟从没见过游客，所以一点也不怕人，科考人员在崖边记录时，海鸟常常就落在几步之外，好奇地打量着他们的笔记本。有一年风暴来得突然，一组科考人员在小屋里困了一个多星期，回到富鲁海姆镇时，他们说最想念的不是热水澡，而是一杯新鲜的牛奶。"
      en: "The Hrimey Nature Reserve covers the whole of Hrimey, the island north of Akkersey, a little over 180 km² in Furuheim District of Furuheim City; its tundra and bird cliffs are kept untouched, and only researchers may land. Hrimey is the first place in the islands to see frost each winter and is often wrapped in sea ice and frost fog; it is tundra, wetland and seabird colonies, a fine place to watch arctic foxes and seabirds, and with the Anchor Chain Glacier Furuheim's most popular natural attraction.\nThere is no jetty, so researchers can only come ashore by dinghy on calm days, and if a storm blows up they must stay on in the island's hut for a few more days. The hut is stocked with tins, fuel and a radio, and its walls are covered with observation records and weather notes left by the teams of past years. Each year the researchers count seabird nests, watch the arctic foxes' dens and the growth of the tundra plants, and record what climate change is doing to this northernmost islet. Visitors may not land, but in summer they can go out with a guide by small boat from the town of Furuheim to watch the nesting seabirds along the shore and glimpse arctic foxes running across the tundra.\nThe rangers say the birds here have never seen tourists, so they are not in the least afraid; when researchers are taking notes at the cliff edge, birds often land a few steps away and study their notebooks with curiosity. One year a storm came up so suddenly that a team was stuck in the hut for more than a week, and when they got back to Furuheim they said what they had missed most was not a hot shower but a glass of fresh milk."
    in: div_k4wvwe
    offset_km: [-13.2, 88.9]
  - id: poi_5fyhtm
    subtype: nature_reserve
    status: generated
    names:
      zh: 塞尔霍尔姆岛自然保护区
      en: Selholm Nature Reserve
      art-x-viking: Naturschutzgebiet Selholm
      art-x-buckham: "Riserva Naturale dell'Isola delle Foche"
    notes:
      zh: "塞尔霍尔姆岛自然保护区覆盖圣翁丁岛东南外海的整座塞尔霍尔姆岛，面积两百四十多平方公里，属圣翁丁市圣翁丁区，是灰海豹的繁殖地。每年产仔季节，成百上千只海豹在礁石上产下雪白的幼崽，产仔季节禁止船只靠近礁石，人员登岛也受到严格限制，岛上的草坡和崖壁同时是海鸟栖息的地方，海豹的天敌很少，礁石又挡住了外海的大浪，这里因此成了它们最安心的产房。\n保护区的巡护员每年秋天清点一次新出生的小海豹，白色绒毛的幼崽趴在礁石上一动不动，远看像一团团没化的雪。研究人员在固定的观测点统计海豹和海鸟的数量，记下哪片礁石最受母海豹青睐、哪一年的风暴冲走了多少幼崽。游客的观察只能在对岸的观景台或远处的观察船上用望远镜进行，观察船从圣翁丁镇出发，往返半天，船长会在保护区边界外熄火，让大家静静地看海豹在礁石上晒太阳、在浅水里翻身。\n圣翁丁的孩子们会在观景台上给每一只小海豹起名字，学校还把这件事当作一堂自然课：老师发下画着礁石轮廓的纸，孩子们把看到的幼崽一个个标上去，再取上名字。巡护员说，这些名单比他们自己的记录还详细，有时清点数字对不上，他们就去学校借孩子们的图来核对。"
      en: "The Selholm Nature Reserve covers the whole of Selholm, the island off the south-east of Saint-Ondine Island, a little over 240 km² in Saint-Ondine District of Saint-Ondine, and is a breeding ground for grey seals. Each pupping season hundreds of seals give birth to snow-white pups on the rocks; boats may not approach the rocks in the pupping season, landing is strictly limited, and seabirds nest on the island's grassy slopes and cliffs as well; with few predators and rocks that break the ocean swell, it is the seals' safest nursery.\nThe reserve's rangers count the new pups once a year in autumn: the pups in their white fluffy coats lie motionless on the rocks, and from a distance look like lumps of unmelted snow. Researchers count the seals and seabirds from fixed observation points, noting which rocks the mothers favour and how many pups each year's storms have washed away. Visitors may only watch through binoculars from the viewing platform across the water or from viewing boats at a distance; the boats leave from the town of Saint-Ondine and are back within half a day, the skipper cutting the engine outside the reserve boundary so everyone can quietly watch the seals bask on the rocks and roll in the shallows.\nSaint-Ondine's children give every pup a name from the viewing platform, and the school makes a nature lesson of it: the teacher hands out sheets printed with the outline of the rocks, and the children mark each pup they see and give it a name. The rangers say these lists are more detailed than their own records, and when their counts do not add up they borrow the children's drawings from the school to check."
    in: div_ht5w2y
    offset_km: [73.0, -34.9]

  # ── 维京群岛领地政务院机构（M42）：分散在长船古城周边 ──
  - id: bld_5yzrxz
    subtype: government
    status: generated
    names:
      zh: 维京群岛领地政务院对外事务部
      en: Ministry of External Affairs, Viking Islands Executive Council
    short_names:
      zh: 对外事务部
      en: Ministry of External Affairs
    notes:
      zh: 维京群岛领地政务院对外事务部，位于长船古城东面的城墙外，负责群岛的对外交往和与中央政府的联络。部内设政策司、中央政府联络司、外国使领馆司、礼宾司、国际交流司和领事服务司，其中国际交流司因邮轮旅游和国际航运往来频繁而单独建楼。长船是群岛最国际化的城市，各国的航运公司、保险公司和银行在汇金区设有总部，许多国家在长船设有领事馆，外国使领馆司负责与它们的日常联系；礼宾司接待来访的外国船队和代表团，领事服务司为在群岛工作的外国船员和金融从业者办理证明和认证。
      en: The Ministry of External Affairs of the Viking Islands stands outside the walls to the east of Longship's old town and handles the islands' dealings abroad and liaison with the central government. Its departments are Policy, Central Government Liaison, Foreign Missions, Protocol, International Exchange and Consular Services; International Exchange, kept busy by cruise tourism and international shipping, has a building of its own. Longship is the most international city in the islands, with shipping lines, insurers and banks from many countries headquartered in Goldmark District and a number of consulates in town, which the Foreign Missions Department deals with day to day. Protocol receives visiting fleets and delegations, and Consular Services certifies documents for the foreign seafarers and finance workers who live on the islands.
    in: div_g2g1yc
    offset_km: [1.3, 0.0]
    site: { size_m: [130, 100], layout: lshape }

