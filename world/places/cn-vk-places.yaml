    names:
      zh: 灯塔岛灯塔
      en: Lighthouse Isle Light
      art-x-viking: Leuchtfeuer Leuchtturminsel
      art-x-buckham: Faro dell'Isola del Faro
    notes:
      zh: "阿夫琳岛东端外的老灯塔，为进出阿夫琳湾的邮轮与渔船引航。灯塔岛上只住着一户看守人家，补给船每周来一次；看守人在岛上种了一小片土豆，说是「全阿夫琳最靠海的菜园」。夏天的观光船会绕岛一圈，看守人站在灯塔下挥手回应。"
      en: "The old lighthouse off the east end of Aveline Island, guiding cruise ships and fishing boats in and out of Aveline Bay. A single keeper's family lives on the isle, supplied by boat once a week; the keeper grows a small patch of potatoes there, \"the Aveline vegetable plot nearest the sea\". Summer sightseeing boats circle the isle and the keeper waves back from the foot of the light."
    in: div_8a2hzm
    offset_km: [50.2, -2.9]
  - id: poi_4gy708
    subtype: nature_reserve
    status: generated
    names:
      zh: 赫里姆岛自然保护区
      en: Hrimey Nature Reserve
      art-x-viking: Naturschutzgebiet Hrimey
      art-x-buckham: "Riserva Naturale dell'Isola del Gelo"
    notes:
      zh: "覆盖全岛的自然保护区，苔原与海鸟崖保持原貌，只允许科考人员登岛。岛上没有码头，科考人员只能在风平浪静的日子乘小艇登岸，赶上风暴就要在岛上的小屋里多住几天。巡护员说，这里的海鸟从没见过游客，所以一点也不怕人。"
      en: "A nature reserve covering the whole island, its tundra and seabird cliffs left untouched; only researchers may land. The island has no harbour, so researchers can land only by dinghy on calm days, and if a storm comes up they stay on in the island's hut for a few more days. The rangers say its seabirds have never seen a tourist and are not the least bit afraid of people."
    in: div_k4wvwe
    offset_km: [-13.2, 88.9]
  - id: poi_5fyhtm
    subtype: nature_reserve
    status: generated
    names:
      zh: 塞尔霍尔姆岛自然保护区
      en: Selholm Nature Reserve
      art-x-viking: Naturschutzgebiet Selholm
      art-x-buckham: "Riserva Naturale dell'Isola delle Foche"
    notes:
      zh: "灰海豹的繁殖地，产仔季节禁止船只靠近礁石。保护区的巡护员每年秋天清点一次新出生的小海豹，白色绒毛的幼崽趴在礁石上一动不动，远看像一团团没化的雪。观察只能在对岸的观景台上用望远镜进行，圣翁丁的孩子们会在那里给每一只小海豹起名字。"
      en: "A breeding ground of grey seals; boats must keep clear of the rocks in the pupping season. Each autumn the rangers count the new pups, white and fluffy, lying motionless on the rocks like patches of unmelted snow. They may only be watched by telescope from the viewing platform across the water, where Saint-Ondine children give each pup a name."
    in: div_ht5w2y
    offset_km: [73.0, -34.9]

  # ── 维京群岛领地政务院机构（M42）：分散在长船古城周边 ──
  - id: bld_5yzrxz
    subtype: government
    status: generated
    names:
      zh: 维京群岛领地政务院对外事务部
      en: Ministry of External Affairs, Viking Islands Executive Council
    short_names:
      zh: 对外事务部
      en: Ministry of External Affairs
    notes:
      zh: 维京群岛领地政务院对外事务部，位于长船古城东面的城墙外，负责群岛的对外交往和与中央政府的联络。部内设政策司、中央政府联络司、外国使领馆司、礼宾司、国际交流司和领事服务司，其中国际交流司因邮轮旅游和国际航运往来频繁而单独建楼。长船是群岛最国际化的城市，各国的航运公司、保险公司和银行在汇金区设有总部，许多国家在长船设有领事馆，外国使领馆司负责与它们的日常联系；礼宾司接待来访的外国船队和代表团，领事服务司为在群岛工作的外国船员和金融从业者办理证明和认证。
      en: The Ministry of External Affairs of the Viking Islands stands outside the walls to the east of Longship's old town and handles the islands' dealings abroad and liaison with the central government. Its departments are Policy, Central Government Liaison, Foreign Missions, Protocol, International Exchange and Consular Services; International Exchange, kept busy by cruise tourism and international shipping, has a building of its own. Longship is the most international city in the islands, with shipping lines, insurers and banks from many countries headquartered in Goldmark District and a number of consulates in town, which the Foreign Missions Department deals with day to day. Protocol receives visiting fleets and delegations, and Consular Services certifies documents for the foreign seafarers and finance workers who live on the islands.
    in: div_g2g1yc
    offset_km: [1.3, 0.0]
    site: { size_m: [130, 100], layout: lshape }

  - id: bld_daawps
    subtype: government
    status: generated
    names:
      zh: 维京群岛领地政务院对外事务部国际交流司
      en: International Exchange Department, Ministry of External Affairs, Viking Islands Executive Council
    short_names:
      zh: 对外事务部国际交流司
      en: International Exchange Department
    notes:
      zh: 维京群岛领地政务院对外事务部国际交流司，在对外事务部北面不远处单独建楼，负责群岛与世界各地的人员、文化和旅游交流。每年夏季，大批国际邮轮停靠长船和阿夫琳港，国际交流司与港口和旅游部门协调，让邮轮旅客入境更加便利；它还管理群岛与海外城市的友好交流项目、国际会议和展会，以及群岛大学的国际学生和访问学者计划，并在海外推广群岛的航海节庆。司里的服务窗口可以用中文、维京语、巴克汉姆语和英语办理业务。
      en: The International Exchange Department of the Ministry of External Affairs has its own building a short way north of the ministry and looks after the islands' exchanges of people, culture and tourism with the rest of the world. Every summer international cruise ships call in numbers at Longship and Port Aveline, and the department works with the ports and the tourism authorities to make arrival easy for their passengers. It also runs the islands' twinning programmes with cities overseas, international conferences and fairs, and the schemes for foreign students and visiting scholars at the University of the Islands, and promotes the islands' seafaring festivals abroad. Its counters serve the public in Chinese, Viking, Buckham and English.
    in: div_g2g1yc
    offset_km: [1.15, 0.38]
    site: { size_m: [110, 70], layout: slab }

  - id: bld_d3e2wd
    subtype: government
    status: generated
    names:
      zh: 维京群岛领地政务院财政部
      en: Ministry of Finance, Viking Islands Executive Council
    short_names:
      zh: 财政部
      en: Ministry of Finance
    notes:
      zh: 维京群岛领地政务院财政部，位于长船古城东北，靠近通往汇金区的道路，负责群岛的税收、预算和财政监督。部内设税收司、关税司、监管司、行政部门预算司、企业事业单位预算司和中央财政事务司。群岛的财政收入主要来自航运、离岸金融和总部经济，监管司与汇金区的金融机构保持密切联系，监督离岸业务的合规；关税司管理长船、奥斯特哈门和各岛渡轮码头的进出口关税，企业事业单位预算司为群岛的公共渡轮公司、电网和地热电站编制预算。
      en: The Ministry of Finance of the Viking Islands, north-east of Longship's old town on the road to Goldmark District, runs the islands' taxes, budgets and financial oversight. Its departments are Taxation, Customs Tariffs, Supervision, Executive Budgets, Public Enterprise and Institution Budgets, and Central Finance. Most of the islands' revenue comes from shipping, offshore finance and head offices, so the Supervision Department keeps in close touch with the institutions in Goldmark and checks that offshore business stays within the rules. Customs Tariffs collects duties at Longship, Austhamn and the ferry piers of every island, and Public Enterprise and Institution Budgets sets the budgets of the public ferry company, the grid and the geothermal power stations.
    in: div_g2g1yc
    offset_km: [0.92, 0.92]
    site: { size_m: [130, 80], layout: slab }

  - id: bld_wnx8sz
    subtype: government
