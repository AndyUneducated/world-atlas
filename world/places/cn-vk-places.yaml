    names:
      zh: 维京群岛领地政务院对外事务部国际交流司
      en: International Exchange Department, Ministry of External Affairs, Viking Islands Executive Council
    short_names:
      zh: 对外事务部国际交流司
      en: International Exchange Department
    notes:
      zh: 维京群岛领地政务院对外事务部国际交流司，在对外事务部北面不远处单独建楼，负责群岛与世界各地的人员、文化和旅游交流。每年夏季，大批国际邮轮停靠长船和阿夫琳港，国际交流司与港口和旅游部门协调，让邮轮旅客入境更加便利；它还管理群岛与海外城市的友好交流项目、国际会议和展会，以及群岛大学的国际学生和访问学者计划，并在海外推广群岛的航海节庆。司里的服务窗口可以用中文、维京语、巴克汉姆语和英语办理业务。
      en: The International Exchange Department of the Ministry of External Affairs has its own building a short way north of the ministry and looks after the islands' exchanges of people, culture and tourism with the rest of the world. Every summer international cruise ships call in numbers at Longship and Port Aveline, and the department works with the ports and the tourism authorities to make arrival easy for their passengers. It also runs the islands' twinning programmes with cities overseas, international conferences and fairs, and the schemes for foreign students and visiting scholars at the University of the Islands, and promotes the islands' seafaring festivals abroad. Its counters serve the public in Chinese, Viking, Buckham and English.
    in: div_g2g1yc
    offset_km: [1.15, 0.38]
