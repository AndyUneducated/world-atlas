      zh: 维京群岛领地政务院劳动和社会保障部，位于长船古城南面，负责就业、职业培训、劳动关系和社会保险。部内设就业司、职业能力司、普通工种司、特殊工种司、劳动仲裁司和公共劳动保险司。群岛的造船、远洋航运、海上风电和渔业都有大量高危岗位，特殊工种司制定海员、潜水员、风机维修工和渔船船员的资格和工时标准；劳动仲裁司处理船员劳务纠纷，就业司帮助各岛的季节性旅游从业者找到冬季工作，公共劳动保险司管理全领地统一的养老、失业和工伤保险。
      en: The Ministry of Labour and Social Security of the Viking Islands, south of Longship's old town, covers jobs, training, labour relations and social insurance. Its departments are Employment, Vocational Skills, General Trades, Special Trades, Labour Arbitration and Public Labour Insurance. Shipbuilding, ocean shipping, offshore wind and fishing all involve hazardous work, and Special Trades sets the qualifications and hours of seafarers, divers, wind-turbine technicians and fishing crews. Labour Arbitration settles disputes over seafarers' contracts, Employment helps seasonal tourism workers on each island find winter jobs, and Public Labour Insurance runs the territory-wide pension, unemployment and work-injury schemes.
    in: div_g2g1yc
    offset_km: [-0.75, -1.06]
    site: { size_m: [120, 70], layout: slab }

