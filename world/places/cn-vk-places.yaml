      en: Office of the Central Government High Commissioner for Human Rights in the Viking Islands
    short_names:
      zh: 人权事务高级专员办公室
      en: Human Rights Commissioner's Office
    notes:
      zh: 中央政府常驻维京群岛领地人权事务高级专员办公室，位于长船古城北面，由中央政府派驻，监督群岛人权保障的情况。群岛有大量来自世界各地的海员、渔工和金融从业者，高级专员特别关注外籍劳动者的权益、船上的工作和生活条件，以及中文、维京语、巴克汉姆语和英语使用者在公共服务中的平等对待；它可以走访看守所、船舶和劳务中介机构，接受个人申诉，并向领地机关提出建议。办公室每年发布群岛人权报告，关于海员权益的章节常被航运界引用。
      en: The Office of the Central Government High Commissioner for Human Rights in the Viking Islands, north of Longship's old town, is sent by the central government to watch over human rights in the islands. With many seafarers, fishing hands and finance workers from all over the world, the High Commissioner pays particular attention to the rights of foreign workers, to working and living conditions on board ship and to equal treatment in public services for speakers of Chinese, Viking, Buckham and English. The office can visit remand centres, ships and labour agencies, hear individual complaints and make recommendations to territorial bodies, and the chapter on seafarers' rights in its yearly report is widely quoted in shipping circles.
    in: div_g2g1yc
    offset_km: [-0.31, 1.77]
    site: { size_m: [70, 70], layout: block }

  - id: bld_b9m6hh
    subtype: government
    status: generated
    names:
      zh: 维京群岛领地政策和计划委员会
      en: Viking Islands Policy and Planning Commission
    short_names:
      zh: 政策和计划委员会
      en: Policy and Planning Commission
    notes:
      zh: 维京群岛领地政策和计划委员会，是政务院直属的特设委员会，位于长船古城南面，由总督主持，各部部长和独立专家参加。委员会编制群岛的中长期发展规划，协调跨部门的重大政策，评估政策的实施效果；连接各岛的跨海高速、海上风电和地热的开发、港口扩建和通往维京港的海底通道这类涉及多个部门的大项目，都先在这里形成方案，再提交领地议会。委员会每年发布群岛发展报告，公开各岛人口、产出和公共服务的指标，小岛人口外流是报告里反复出现的话题。
      en: The Viking Islands Policy and Planning Commission is a special commission directly under the Executive Council, south of Longship's old town, chaired by the governor with the ministers and independent experts as members. It draws up the islands' medium- and long-term development plans, coordinates major policies that cross ministries and reviews how they are working. Projects that involve several ministries, such as the sea-crossing expressways between the islands, offshore wind and geothermal development, harbour extensions and the undersea link to Viking Port, take shape here before going to the territorial parliament. Its yearly development report gives figures on each island's population, output and public services, and the drift of people away from the small islands is a recurring theme.
    in: div_g2g1yc
    offset_km: [0.0, -0.9]
    site: { size_m: [80, 80], layout: block }
