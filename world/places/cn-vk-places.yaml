    notes:
      zh: 维京群岛领地政务院民政部，位于长船古城西南，负责社会组织、社会救助和行政区划。部内设政策司、社会组织司、社会救助司、慈善事业司、其他社会事务司和行政区划司。行政区划司管理群岛各市、区的设立和命名，群岛的地名以北欧风格为主，也有欧洲殖民风格和塔夫鲁纳克语的名称；社会组织司登记渔民协会、航运行业协会和各类基金会，社会救助司向困难家庭和海难遇难者的家属提供救助，其他社会事务司负责婚姻登记和殡葬，在各岛都设有服务站。
      en: The Ministry of Civil Affairs of the Viking Islands, south-west of Longship's old town, deals with civil society, social assistance and the administrative divisions. Its departments are Policy, Social Organisations, Social Assistance, Charities, Other Social Affairs and Administrative Divisions. Administrative Divisions sets up and names the islands' cities and districts, whose names are mostly Norse in style, with some colonial-style and Tavrunaq names. Social Organisations registers fishermen's associations, shipping associations and foundations, Social Assistance supports families in hardship and the families of those lost at sea, and Other Social Affairs handles marriage registration and funerals, with service points on every island.
    in: div_g2g1yc
    offset_km: [-1.21, -0.7]
    site: { size_m: [120, 70], layout: slab }

  - id: bld_2spd34
