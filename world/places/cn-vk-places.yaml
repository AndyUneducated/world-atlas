    notes:
      zh: 中央政府常驻维京群岛领地巡视员办公室，位于长船古城东面，由中央政府派驻，负责对群岛各级行政机关进行巡视监督。巡视员定期乘渡轮和直升机走访各岛的市、区政府，检查政策执行、财政资金使用和廉洁情况，对渡轮公司、电网等公共企业的经营也进行审查，发现的问题同时报告中央政府和领地总督，并跟踪整改。办公室设有公众来访接待室，居民可以当面或书面反映意见和举报，远离长船的小岛居民也可以在网上提交。巡视报告的摘要定期公开。
      en: The Office of the Central Government Inspector in the Viking Islands, east of Longship's old town, is sent by the central government to inspect and oversee the islands' administration at every level. Inspectors travel by ferry and helicopter to the city and district governments of every island to check how policies are carried out, how public money is spent and whether officials are honest, and they also review public companies such as the ferry company and the grid; what they find goes to both the central government and the governor, and they follow it up. Residents can raise complaints or report wrongdoing in the public reception room, and those on distant islands can do so online. Summaries of the inspection reports are published.
    in: div_g2g1yc
