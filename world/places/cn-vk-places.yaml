    notes:
      zh: "圣翁丁岛北岸的渡口，渡轮往返阿夫琳岛萨尔塔维克，圣翁丁公路从镇上翻过全岛到这里。夏天渡轮满载着度假的家庭和年轻人，码头上的行李推车比汽车还多；冬天游客散去，候船厅里常常只剩几个渔民和一只躺在暖气片边的猫。"
      en: "The ferry landing on the north shore of Saint-Ondine Island, with ferries to Saltavik on Aveline Island; the Saint-Ondine Road crosses the island from the town to here. In summer the ferries arrive packed with holidaying families and young people, and there are more luggage trolleys on the quay than cars; in winter the visitors leave and the waiting room is often down to a few fishermen and a cat stretched out by the radiator."
