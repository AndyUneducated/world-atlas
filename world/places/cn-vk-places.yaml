  - id: bld_tb1eh5
    subtype: tower
    status: generated
    names:
      zh: 阿夫琳港灯塔
      en: Port Aveline Lighthouse
      art-x-viking: Leuchtturm Port Aveline
      art-x-buckham: Faro di Porto Aveline
    notes:
      zh: "阿夫琳港灯塔是群岛最古老的灯塔，矗立在阿夫琳港市灯塔区海边的悬崖上，灯塔区由此得名。塔身由花岗岩砌成，隔着宽不到三公里的灯塔水道，与外海灯塔岛上的灯塔岛灯塔遥相呼应；灯塔旁的小博物馆讲述着守塔人的故事，陈列着旧时的灯具、航海日志和守塔人家里用过的器物。阿夫琳港灯塔公路从阿夫琳码头出发，沿海岸通往灯塔区，是阿夫琳岛最美的海滨公路之一。\n老灯塔如今不再为航船指路，却会在邮轮进港时闪三下灯，岸上的孩子们就跟着挥手。邮轮离港时，码头上的乐队奏起维京语的送别歌，船上的人常常一直挥手到看不见这座灯塔。夏季座头鲸和虎鲸经灯塔湾和灯塔水道洄游，灯塔区观鲸码头的观鲸船从塔下驶过，乘客在甲板上一边找鲸鱼，一边回头拍灯塔。\n灯塔区风景优美、远离喧嚣，许多退休人员和艺术家定居在这里，画家们最爱在傍晚支起画架，画夕阳里的白色塔身。灯塔下的码头边有一家熏鲭鱼小摊，是本地人的心头好，摊主每天清晨把鲭鱼挂进小熏房，中午开卖，配一片黑面包和一撮洋葱，常常不到傍晚就卖光了。老住户说，来灯塔区要做三件事：看灯塔闪灯，看鲸，再吃一条熏鲭鱼。"
      en: "The Port Aveline Lighthouse is the oldest lighthouse in the islands, standing on a seaside cliff in Lighthouse District of Port Aveline, which is named after it. Its tower is built of granite, and across Lighthouse Sound, less than three kilometres wide, it answers the Lighthouse Isle Light on the islet offshore; a small museum beside it tells the story of the keepers, with old lamps, logbooks and things the keepers' families used. The Port Aveline Lighthouse Road runs along the coast from Aveline Quay to Lighthouse District, one of the loveliest coast roads on Aveline Island.\nThe old lighthouse no longer guides ships, but it flashes three times whenever a cruise ship comes in, and the children on shore wave back. When a ship leaves, the band on the quay plays a Viking farewell song and passengers often keep waving until the lighthouse is out of sight. In summer humpbacks and killer whales pass through Lighthouse Bay and Lighthouse Sound, and the boats from Lighthouse District's whale-watching quay pass below the tower, their passengers looking for whales on one side and turning to photograph the lighthouse on the other.\nLighthouse District is beautiful and quiet, and many retired people and artists have settled here; painters love to set up their easels in the evening to paint the white tower in the setting sun. By the quay below the lighthouse is a smoked-mackerel stall that locals adore: every morning the owner hangs mackerel in a little smokehouse, sells them from noon with a slice of black bread and a pinch of onion, and is often sold out before evening. Old residents say there are three things to do in Lighthouse District: watch the lighthouse flash, watch the whales, and eat a smoked mackerel."
    in: div_8a2hzm
    offset_km: [0.4, 0.3]
    site: { layout: tower, size_m: [40, 40] }
  - id: poi_kqtf3b
    subtype: airport
    status: generated
    names:
      zh: 阿夫琳港机场
      en: Port Aveline Airport
      art-x-viking: Flughafen Port Aveline
      art-x-buckham: Aeroporto di Porto Aveline
    notes:
      zh: "阿夫琳港机场在阿夫琳港市帆城区北面的台地上，跑道长约 2.8 公里，和阿克斯维克、暖泉的机场一样只飞岛际与近程航线，航班通往长船、北维京岛和群岛各岛。一条二十多公里长的机场公路把机场与帆城老城连起来，阿夫琳港邮轮高速则把邮轮码头与机场连成一线，夏季有包机把游客直接送到邮轮母港，许多旅客下了飞机当天就登上邮轮。\n跑道尽头就是海，飞机起飞时从舷窗能看到灯塔区的老灯塔和港里排开的邮轮，天气晴朗时，卡洛韦峰从海边拔起的山影也一览无余。阿夫琳港是群岛第四大城市，全市约 60 万人，帆城是它的老城与市政中心，彩色木屋和石砌商栈沿港湾和山坡展开，城里的帆船俱乐部每年举办群岛帆船赛，比赛期间机场里常能看到扛着船帆和桅杆零件的选手。\n到达大厅里挂满了帆城造帆作坊缝制的三角旗，每一面都对应一艘来过阿夫琳港的邮轮，旗上绣着船名和一只海鸥。造帆作坊每缝好一面新旗，就送一面到邮轮上，再留一面挂在机场，年复一年，大厅的天花板几乎被挂满了。常来的旅客喜欢在旗海里找自己坐过的那艘船，找到了，就站在旗下拍一张照片。"
      en: "Port Aveline Airport lies on a terrace north of Sail Town District in Port Aveline; its runway is about 2.8 km long and, like the Akkersvik and Warmspring airports, it flies only inter-island and short-haul routes, with flights to Longship, North Viking Island and the other islands. An airport road more than 20 km long links it with the old town of Sail Town, and the Port Aveline Cruise Expressway connects the cruise quays with the airport; in summer charter flights bring visitors straight to the cruise port, and many board their ship the same day they land.\nThe end of the runway is the sea, and as planes take off passengers can see the old lighthouse of Lighthouse District and the cruise ships lined up in the harbour, and on clear days the whole of Mount Calloway rising from the sea. Port Aveline is the fourth city of the islands, with some 600,000 people, and Sail Town is its old town and civic centre, its painted wooden houses and stone warehouses climbing from the harbour up the hillside; the town's sailing club holds the islands' regatta every year, and during the race the airport is full of competitors carrying sails and spars.\nThe arrivals hall is hung with pennants sewn by the sailmakers of Sail Town, one for each cruise ship that has called at Port Aveline, each embroidered with the ship's name and a gull. For every new pennant the sailmakers make one for the ship and keep one for the airport, and year by year the ceiling of the hall has almost filled up. Regular travellers like to search the sea of flags for the ship they once sailed on, and when they find it they stand beneath it for a photograph."
    in: div_vhsby1
    offset_km: [-5.7, 21.2]
    site: { size_m: [2800, 900], layout: airport, angle_deg: 105 }

  # ── 暖泉市 ──
  - id: poi_v2pw1f
    subtype: hotel
    status: generated
    names:
      zh: 暖泉温泉度假村
      en: Warmspring Spa Resort
      art-x-viking: Thermalresort Warmquell
      art-x-buckham: Resort Termale di Fontecalda
    wonder:
      zh: 世界唯一的火山温泉度假村，冬夜可在极光下泡温泉
      en: The only volcanic hot spring resort in the world, where guests bathe under the aurora on winter nights
    notes:
      zh: "暖泉温泉度假村是世界唯一的火山温泉度假村，冬夜可在极光下泡温泉。它在暖泉市温泉区、暖泉火山脚下的温泉湾畔，占地约 600 米长、400 米宽，由露天温泉池和酒店组成，是群岛规模最大的温泉度假村。度假村有数十个露天温泉池，沿山坡一层层排开，泉水温度从三十多度到七十多度不等，富含硫磺和矿物质，最烫的池子只用来泡脚，客人从温度低的池子一路泡到高的。泉水直接从火山脚下涌出，斯瓦特桑德地热电站发电后的热水也送进温泉区，池子四季都冒着白气。酒店的客房朝着温泉湾，窗外是湾对面的浮石岛和身后的暖泉火山，晴天能看见火山顶上白色的暖泉冰帽和蒸汽。\n温泉区是暖泉市的中心城区，温泉酒店、疗养院与会议度假村沿温泉湾和山坡排开。区里的疗养院和康复中心利用温泉水和地热治疗风湿、皮肤病和运动损伤，来自群岛和北维京岛的疗养者常年在此休养，不少人上午做理疗，下午就到度假村的池子里泡着；会议度假村承办群岛的商务会议、学术研讨和企业年会，让酒店在淡季也有客人。暖泉是温和湿润的海洋性气候，冬天少有严寒，最冷的月份白天也有六度上下，但十二月的白昼只有七个多小时，漫长的冬夜正好用来等极光。暖泉机场在区的北部，有航班通往长船、维京港和群岛各岛；暖泉站在群岛高速铁路的环线上，冬季周末开往暖泉的列车总是挤满来泡温泉的游客，暖河高速和暖泉环山公路也从温泉区出发。在极光下泡温泉是群岛人招待远客的保留节目，长船的人家来了外地亲戚，多半要带到这里住一晚。\n极光出现时，度假村会敲响一面铜锣，提醒还在屋里的客人赶快出来，几分钟之内，池子里就挤满了披着浴袍跑出来的人。冬夜泡在池里，热水里的身子暖洋洋的，露在外面的头发却会结上一层白霜，客人们互相指着对方的「白头发」笑。泡温泉时最受欢迎的小吃是在喷气孔边的铁丝篮里煮熟的温泉蛋，配一片地热焖出来的黑麦面包。温泉区的老人们每天清晨在露天公共浴池里聚会，在热水里谈天说地，被戏称为「暖泉议会」，度假村的老员工下了夜班，也常常泡进这个「议会」里，把前一夜哪位客人等极光等到睡着的趣事讲给大家听。"
      en: "The Warmspring Spa Resort is the only volcanic hot spring resort in the world, where guests bathe under the aurora on winter nights. It lies on Hot Springs Bay at the foot of Warmspring Volcano in Hot Springs District of Warmspring City, about 600 m long and 400 m wide, made up of open-air hot pools and a hotel, and is the largest spa resort in the islands. It has dozens of open-air pools set in tiers up the slope, the water ranging from the low thirties to more than seventy degrees and rich in sulphur and minerals; the hottest pools are only for feet, and guests work their way up from the cooler pools to the hotter. The water wells straight up from the foot of the volcano, and the hot water left over from the Svartsand Geothermal Power Station also comes to the spa district, so the pools steam in every season. The hotel's rooms face Hot Springs Bay, looking out on Pumice Isle across the water and the volcano behind, and on clear days the white Warmspring Ice Cap and its steam can be seen on the summit.\nHot Springs District is the heart of Warmspring City, its spa hotels, sanatoria and conference resorts strung along Hot Springs Bay and up the hillsides. The district's sanatoria and rehabilitation centres use the spring water and geothermal heat to treat rheumatism, skin conditions and sports injuries, and patients from the islands and from North Viking Island come for long stays, many taking their therapy in the morning and spending the afternoon in the resort's pools; the conference resorts host the islands' business meetings, academic conferences and company gatherings, keeping the hotels busy in the low season. Warmspring has a mild, damp oceanic climate with little hard frost, and even in the coldest month daytime temperatures reach about six degrees, but in December there are only a little over seven hours of daylight, and the long winter nights are just right for waiting for the aurora. Warmspring Airport lies in the north of the district, with flights to Longship, Viking Port and the other islands; Warmspring Station is on the ring of the Island Chain High-Speed Railway, whose trains to Warmspring on winter weekends are always packed with people coming for the springs, and the Warm River Expressway and the Warmspring Volcano Road both start in Hot Springs District. Bathing under the aurora is the islanders' standard treat for guests from afar, and when relatives from elsewhere visit a Longship household, they are usually brought here for a night.\nWhen the aurora appears the resort strikes a gong to call guests out of their rooms, and within minutes the pools are crowded with people who have run out in their bathrobes. On a winter night in the pools your body is warm in the water while the hair above it grows a coat of white frost, and guests point at each other's \"white hair\" and laugh. The favourite snack in the pools is a hot-spring egg cooked in a wire basket over a steam vent, with a slice of rye bread baked in the geothermal sand. Every morning the old people of Hot Springs District meet in the open-air public baths to chat in the hot water, a gathering teasingly known as the \"Warmspring Parliament\", and the resort's old hands, coming off the night shift, often join the \"parliament\" too, telling everyone which guest fell asleep the night before while waiting for the aurora."
    in: div_cz7sch
