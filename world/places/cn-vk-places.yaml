  # ── 乌维克库特市 ──
  - id: poi_5w25ae
    subtype: ferry_terminal
    status: generated
    names:
      zh: 瓦莱渡轮码头
      en: Hvaley Ferry Terminal
      art-x-viking: Fährterminal Hvaley
      art-x-buckham: Terminal Traghetti di Isola Balena
    notes:
      zh: "往返长船古城的渡轮与观鲸船在此停靠。夏天观鲸船出海前，船长会先在码头上吹一声海螺号，据说鲸鱼听惯了这声音，会在船边多停留一会儿。"
      en: "Ferries to Longship's old town and the whale-watching boats call here. In summer, before a whale-watching boat sets out, the skipper blows a conch on the quay; the whales, they say, have grown used to the sound and linger longer by the boat."
    in: div_khmgcq
    site: { size_m: [600, 300], layout: port }
  - id: bld_may0w4
    subtype: museum
    status: generated
    names:
      zh: 瓦莱观鲸中心
      en: Hvaley Whale Centre
      art-x-viking: Walzentrum Hvaley
      art-x-buckham: Centro Balene di Isola Balena
    notes:
      zh: "瓦莱观鲸中心在乌维克库特市瓦莱区，是座头鲸研究站与展馆，也是群岛的鲸类研究和科普机构，夏季观鲸船从这里出发。展馆是一座长约 140 米、宽约 90 米的建筑，展出鲸鱼骨架、鲸歌录音和迁徙地图，研究人员常年在岛上观测和保护鲸群，记录鲸鱼的数量和迁徙路线。每年夏季，座头鲸、虎鲸和小须鲸在瓦莱岛外洄游，在北岸的观鲸湾里觅食，观鲸几乎每次出海都能看到鲸鱼喷水和跃身。\n研究站给每一头常来的座头鲸建档起名，凭的是鲸尾腹面独一无二的黑白花纹，展馆墙上贴满了这些「鲸尾身份证」，每张照片下写着鲸的名字、第一次被记录的年份和它带来过几头幼鲸。展馆里的鲸歌录音可以戴上耳机慢慢听，一段座头鲸的长歌能唱上二十多分钟，许多游客听完才知道鲸也有「方言」。\n游客回来后可以把自己拍到的鲸尾照片交给研究员，认出是哪头鲸的人会收到一张印着它名字的证书，若是拍到一头从没登记过的新鲸，研究站还会请拍摄者参与给它起名。瓦莱岛的孩子们几乎人人都有一两张这样的证书，渔家民宿的墙上也常挂着客人留下的鲸尾照片，旅游和渔业就这样在观鲸中心周围连在了一起。"
      en: "The Hvaley Whale Centre in Hvaley District of Uviqkut City is a humpback research station and exhibition hall, the islands' institute for whale research and education, and the whale-watching boats leave from here in summer. The hall, some 140 m long and 90 m wide, shows whale skeletons, recordings of whale song and migration maps, and the researchers watch over the whales around the island all year, recording their numbers and migration routes. Every summer humpback, killer and minke whales pass off Hvaley and feed in Whalewatch Bay on the north coast, and almost every trip sees whales blowing and breaching.\nThe station names and files every humpback that comes back regularly by the unique black-and-white pattern on the underside of its tail, and the walls of the hall are covered with these \"fluke ID cards\", each photograph labelled with the whale's name, the year it was first recorded and how many calves it has brought. Visitors can put on headphones and listen at leisure to the whale song; a single humpback song can last more than twenty minutes, and many come away surprised to learn that whales have \"dialects\".\nAfter a trip, visitors can hand in their own fluke photographs to the researchers, and anyone who identifies a whale receives a certificate printed with its name; if someone photographs a whale that has never been recorded, the station invites them to help name it. Nearly every child on Hvaley has a certificate or two, and the walls of fishing families' guesthouses are often hung with fluke photographs left by guests, so that tourism and fishing come together around the whale centre."
    in: div_khmgcq
    offset_km: [0.3, 0.3]
    site: { layout: hall, size_m: [140, 90] }
  - id: poi_jv4zc1
    subtype: nature_reserve
    status: generated
    names:
      zh: 西基克图克海鸟保护区
      en: Siqqiqtuuq Seabird Reserve
      art-x-viking: Seevogelschutzgebiet Siqqiqtuuq
      art-x-buckham: Riserva degli Uccelli Marini di Siqqiqtuuq
    notes:
      zh: "西基克图克海鸟保护区在乌维克库特市西基克图克区，是海鹦与三趾鸥在崖壁上筑巢的自然保护区，覆盖西基克图克岛大部分海崖和周边海域。岛的西岸是高达百米的海崖，每年春夏，数十万只海鹦、海鸠、三趾鸥和北方塘鹅聚集在岩架上筑巢产卵，是维京群岛重要的海鸟繁殖地。保护区里的灯塔建在岛的最高处，为乌维克库特海峡里的船只指引航向，灯塔旁的观测站常年监测海鸟数量和海洋环境。\n保护区严格限制人员进入，只开放崖顶的一条步道和几处观鸟台，为了不惊扰鸟巢，步道上禁止大声说话。夏天崖壁上海鹦成群，橙色的喙衔着一排小鱼飞回巢里，北方塘鹅则从高空收起翅膀，像箭一样扎进海里捕鱼。岛上的渔民在保护区外的海域捕鱼，夏季为观鸟游客提供船只和住宿，乌维克库特跨海公路是游客上岛的唯一公路，冬季风暴来临时公路和渡轮都会中断，保护区也随之进入一年中最安静的时候。\n本地孩子能叫出每一种海鸟的维京语名字，有的还会学几声鸟叫，引得游客跟着模仿。步道入口的志愿者会递给每位游客一张小卡片，上面画着四种主要海鸟的样子，走完一圈能认出全部四种的人，可以在卡片背面盖一个海鹦图案的印章。"
      en: "The Siqqiqtuuq Seabird Reserve in Siqqiqtuuq District of Uviqkut City is a nature reserve where puffins and kittiwakes nest on the cliffs, covering most of Siqqiqtuuq Island's sea cliffs and the waters around them. The west coast cliffs are a hundred metres high, and every spring and summer hundreds of thousands of puffins, guillemots, kittiwakes and northern gannets crowd onto their ledges to nest and lay, making it one of the Viking Islands' key seabird colonies. The reserve's lighthouse stands on the island's highest point, guiding ships through the Uviqkut Strait, and the observation station beside it monitors seabird numbers and the marine environment all year.\nAccess is strictly limited: only one clifftop path and a few hides are open, and to avoid disturbing the nests no loud talking is allowed on the path. In summer the cliffs swarm with puffins flying home with a row of little fish in their orange bills, while gannets fold their wings high above and plunge like arrows into the sea. The island's fishermen fish outside the reserve and in summer provide boats and beds for birdwatchers; the Uviqkut Causeway is the only road for visitors onto the island, and when winter storms cut both road and ferries the reserve enters the quietest time of its year.\nLocal children can name every seabird in Viking, and some can imitate a few calls, setting visitors trying to copy them. Volunteers at the start of the path hand each visitor a little card showing the four main seabirds, and anyone who can recognise all four by the end of the walk gets a puffin stamp on the back."
    in: div_5p2a2d
    offset_km: [0.6, 0.5]
    site: { layout: park, size_m: [800, 600] }

  # ── 外岛渡口 ──
  - id: poi_khwt70
