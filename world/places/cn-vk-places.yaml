      en: Ministry of Construction
    notes:
      zh: 维京群岛领地政务院建设部，位于长船古城西面，负责城乡规划、住房和建筑市场。部内设政策司、住房保障司、房地产市场监管司、建筑市场监管司、城市建设司和乡镇建设司。长船古城的石砌老屋受到严格保护，城市建设司规定古城内不得新建高楼，新的塔楼都集中在汇金区的湾畔；房地产市场监管司调控长船和汇金区的房价，住房保障司为海员、渔民和年轻家庭提供公共租赁住房，乡镇建设司负责各小岛的码头、供电和供水设施，建筑市场监管司制定抗风暴的建筑规范。
      en: The Ministry of Construction of the Viking Islands, west of Longship's old town, is in charge of planning, housing and the building trade. Its departments are Policy, Housing Support, Property Market Supervision, Building Market Supervision, Urban Development and Rural Development. The stone houses of the old town are strictly protected and Urban Development allows no towers inside it, so new high-rises stand on the Goldmark waterfront instead. Property Market Supervision keeps house prices in Longship and Goldmark in check, Housing Support provides public rental homes for seafarers, fishing families and young households, Rural Development builds piers, power and water supplies on the small islands, and Building Market Supervision writes the storm-resistant building codes.
    in: div_g2g1yc
    offset_km: [-1.3, -0.11]
    site: { size_m: [120, 90], layout: lshape }

  - id: bld_0adddq
