      zh: 维京群岛领地政务院卫生和人类服务部，位于长船古城南面，负责食品药品安全、医疗卫生、公共保险和公共福利。部内设食品政策司、食品监管司、食品从业人员司、医疗和药品政策司、医疗和药品监管司、医疗和药品从业人员司、医疗和药品技术司、公共健康保险司、其他公共保险司、公共卫生司和公共福利司。食品监管司检验群岛出口的鲜鱼和水产品，公共卫生司为没有医院的小岛安排医疗船和直升机急救，公共健康保险司让各岛居民按统一标准报销医疗费用，公共福利司负责养老院和托育服务。
      en: The Ministry of Health and Human Services of the Viking Islands, south of Longship's old town, is responsible for food and drug safety, health care, public insurance and welfare. Its eleven departments are Food Policy, Food Supervision, Food Professions, Medical and Drug Policy, Medical and Drug Supervision, Medical and Drug Professions, Medical and Drug Technology, Public Health Insurance, Other Public Insurance, Public Health and Public Welfare. Food Supervision inspects the fresh fish and seafood the islands export, Public Health sends hospital ships and air ambulances to islands without a hospital, Public Health Insurance reimburses treatment on the same terms on every island, and Public Welfare runs care homes and childcare.
    in: div_g2g1yc
    offset_km: [-0.24, -1.38]
    site: { size_m: [120, 90], layout: lshape }

