      en: Ministry of Transport
    notes:
      zh: 维京群岛领地政务院交通部，位于长船古城西北，负责群岛的海上、陆路和空中交通。部内设政策司、交通从业人员司、道路运输司、公路司、铁路司、水路司和空运司，其中水路司单独建楼。公路司管理连接各岛的跨海高速和岛内公路，铁路司负责维长城际铁路群岛段的运营监督，空运司协调长船国际机场与各岛小机场之间的航线，交通从业人员司为船员、引航员和驾驶员颁发执照。群岛居民的日常出行很大程度上依靠渡轮和跨海大桥，冬季风暴期间的停航和限行也由交通部统一发布。
      en: The Ministry of Transport of the Viking Islands, north-west of Longship's old town, runs travel by sea, road and air. Its departments are Policy, Transport Professions, Road Transport, Highways, Railways, Waterways and Air Transport, with Waterways in a building of its own. Highways manages the sea-crossing expressways between the islands and the roads on each, Railways oversees the island section of the Viking Port–Longship Intercity Railway, Air Transport coordinates routes between Longship International Airport and the small island airfields, and Transport Professions licenses seafarers, pilots and drivers. Islanders rely on ferries and sea bridges for everyday journeys, and in winter storms the ministry announces when sailings are cancelled and bridges restricted.
    in: div_g2g1yc
    offset_km: [-1.06, 0.75]
    site: { size_m: [130, 80], layout: slab }

  - id: bld_jgvp8n
