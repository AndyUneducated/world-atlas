      art-x-viking: Walzentrum Hvaley
      art-x-buckham: Centro Balene di Isola Balena
    notes:
      zh: "座头鲸研究站与展馆，夏季观鲸船从这里出发。研究站给每一头常来的座头鲸建档起名，凭的是鲸尾腹面独一无二的黑白花纹，展馆墙上贴满了这些「鲸尾身份证」。游客回来后可以把自己拍到的鲸尾照片交给研究员，认出是哪头鲸的人会收到一张印着它名字的证书。"
      en: "A humpback research station and exhibition; the summer whale-watching boats leave from here. The research station gives each regular humpback a file and a name, recognising it by the unique black-and-white pattern under its tail, and the gallery walls are covered with these \"tail ID cards\". Visitors can hand their own tail photos to the researchers, and anyone whose picture identifies a whale receives a certificate bearing its name."
    in: div_khmgcq
    offset_km: [0.3, 0.3]
    site: { layout: hall, size_m: [140, 90] }
  - id: poi_jv4zc1
    subtype: nature_reserve
