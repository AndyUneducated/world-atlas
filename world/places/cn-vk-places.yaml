    notes:
      zh: 维京群岛领地政务院公共安全部，位于长船古城北面，统一领导群岛的警务和治安。部内设警察司、警务司、边境服务和安全司、刑事侦查司、民事侦查司、经济犯罪调查司、社区安全司和技术和装备司。群岛由四座大岛和三十多座中小岛屿组成，警察司在每座有人居住的岛上都设有警务站，技术和装备司为海上警察配备巡逻艇和直升机；边境服务和安全司负责长船国际机场、各港口和维长海底隧道入口的出入境检查，经济犯罪调查司与汇金区的金融监管配合，打击洗钱和金融诈骗。
      en: The Ministry of Public Security of the Viking Islands, north of Longship's old town, directs policing and public order across the islands. Its departments are Police, Policing Operations, Border Services and Security, Criminal Investigation, Civil Investigation, Economic Crime, Community Safety, and Technology and Equipment. With four large islands and more than thirty smaller ones, the Police Department keeps a station on every inhabited island and Technology and Equipment supplies patrol boats and helicopters to the marine police. Border Services and Security checks arrivals at Longship International Airport, the ports and the mouth of the undersea tunnel to Viking Port, and Economic Crime works with Goldmark's financial regulators against money laundering and fraud.
    in: div_g2g1yc
    offset_km: [-0.11, 1.3]
    site: { size_m: [130, 80], layout: slab }

  - id: bld_nzzyh8
