    names:
      zh: 西基克图克海鸟保护区
      en: Siqqiqtuuq Seabird Reserve
      art-x-viking: Seevogelschutzgebiet Siqqiqtuuq
      art-x-buckham: Riserva degli Uccelli Marini di Siqqiqtuuq
    notes:
      zh: "海鹦与三趾鸥在崖壁上筑巢的自然保护区。夏天崖壁上海鹦成群，橙色的喙衔着一排小鱼飞回巢里，本地孩子能叫出每一种海鸟的维京语名字。保护区只开放崖顶的一条步道，为了不惊扰鸟巢，步道上禁止大声说话。"
      en: "A nature reserve where puffins and kittiwakes nest on the cliffs. In summer puffins crowd the cliffs, flying home with a row of small fish in their orange bills, and local children can name every seabird in Viking. Only one clifftop path is open, and to avoid disturbing the nests no loud talking is allowed on it."
    in: div_5p2a2d
    offset_km: [0.6, 0.5]
    site: { layout: park, size_m: [800, 600] }

