    names:
      zh: 维京群岛领地政务院司法部
      en: Ministry of Justice, Viking Islands Executive Council
    short_names:
      zh: 司法部
      en: Ministry of Justice
    notes:
      zh: 维京群岛领地政务院司法部，位于长船古城北面，负责群岛法规的起草和实施、检察事务和司法行政。部内设国家法律实施司、领地法规司、法律法规起草和规范司、检察事务司、司法监察司、拘留管理司、社区矫正管理司、司法从业人员司和司法研究司。群岛的航运和金融业务涉及大量国际合同，司法研究司长期研究海商法和离岸金融法规，法律法规起草和规范司负责领地法规的中文、维京语和巴克汉姆语文本；司法从业人员司管理律师和公证员的执业，各岛的法律援助站也由它设立。
      en: The Ministry of Justice of the Viking Islands, north of Longship's old town, drafts and applies the islands' laws and runs prosecutions and the administration of justice. Its nine departments are National Law Enforcement, Territorial Regulations, Legislative Drafting and Standards, Prosecutions, Judicial Inspection, Detention, Community Corrections, Legal Professions and Legal Research. Shipping and finance bring a great many international contracts to the islands, so Legal Research has long specialised in maritime and offshore financial law, while the drafting department keeps the Chinese, Viking and Buckham texts of territorial laws in step. Legal Professions licenses lawyers and notaries and has set up legal aid points on every island.
    in: div_g2g1yc
    offset_km: [0.48, 1.32]
    site: { size_m: [120, 90], layout: lshape }

  - id: bld_fdpyda
