  - id: poi_p3cv8y
    subtype: port
    status: generated
    names:
      zh: 布兰诺克堡风电运维港
      en: Fort Brannock Wind Service Port
      art-x-viking: Windpark-Servicehafen Fort Brannock
      art-x-buckham: Porto di Servizio Eolico di Forte Brannock
    notes:
      zh: "布兰诺克堡风电运维港在布兰诺克堡市亚利图克岛的南岸，是海上风电场的运维基地，也是全区的经济中心。运维船、起重船和风机安装船在这里停靠，往返阿夫琳港的渡轮也在此靠岸；港区占地约 700 米乘 300 米，叶片维修厂、零部件仓库和培训中心为群岛的风电场提供服务，渔港就在运维港旁边，渔民仍在近海捕鱼。亚利图克岛海风终年不息，岛上的山脊排列着成片的陆上风机，外海的大型海上风电场经海底电缆向长船和阿夫琳港送电。\n亚利图克岛公路全长四十多公里，从岛北部山谷里的布兰诺克堡镇出发，沿风机林立的山脊到达运维港，按运输超长叶片的要求设计。运送超长风机叶片的车队总在深夜开进港区，窗边的孩子们一边数叶片一边入睡，岛上管这叫「数风车」。布兰诺克堡是群岛最年轻的城市之一，运维港的技师、工程师和船员大多是带着家人搬来的，镇上的学校和幼儿园也因此越办越多。\n运维船上的厨师很有名，出海检修的技师一天的盼头就是午饭那锅加了熏肉和土豆的鱼汤，风浪再大，汤锅也被牢牢固定在灶台上。技师们说，在摇晃的甲板上喝一碗热汤，是爬完高高的风机塔之后最好的奖赏；也有新来的技师晕船吃不下，厨师就给他留一碗，等船回港再热给他喝。"
      en: "The Fort Brannock Wind Service Port, on the south coast of Jaalituuq Island in Fort Brannock, is the operations base for the offshore wind farms and the economic heart of the district. Service vessels, crane ships and turbine installation ships berth here, and the ferries to Port Aveline call too; the port covers about 700 by 300 metres, with a blade repair works, a parts warehouse and a training centre serving the islands' wind farms, and the fishing harbour is right beside it, where fishermen still work the inshore waters. The sea wind never stops on Jaalituuq, turbines line the island's ridges, and the large offshore wind farm out at sea sends power by submarine cable to Longship and Port Aveline.\nThe Jaalituuq Island Road, a little over 40 km long, runs from the town of Fort Brannock in a valley in the north of the island along the turbine-lined ridge to the port, built to carry extra-long blades. The convoys bringing the giant blades always drive into the port late at night, and children at their windows fall asleep counting them, which the island calls \"counting windmills\". Fort Brannock is one of the youngest cities in the islands; most of the port's technicians, engineers and crews came with their families, so the town keeps opening more schools and nurseries.\nThe cooks on the service vessels are famous, and what keeps the technicians going on a maintenance trip is the pot of fish soup with bacon and potatoes at lunch, the pot lashed firmly to the stove however rough the sea. The technicians say a bowl of hot soup on a rolling deck is the best reward after climbing a towering turbine; when a newcomer is too seasick to eat, the cook keeps a bowl aside and heats it up for him once the boat is back in port."
    in: div_72h3ge
    offset_km: [5.7, -41.7]
    site: { size_m: [700, 300], layout: port }

  # ── 外围小岛 ──
  - id: poi_qgq5hp
