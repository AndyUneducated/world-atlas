      en: "The airport on the flat ground south of Chain Town, the air gateway of Akkersey. A great iron anchor hangs in the departure hall, Akkersvik's first greeting to every traveller, and when the local football club plays away its fans often charter a whole plane."
    in: div_b569a2
    offset_km: [0.7, -10.6]
    site: { size_m: [3000, 900], layout: airport, angle_deg: 60 }

  # ── 其他城市 ──
  - id: poi_grhsm8
    subtype: power_station
    status: generated
    names:
      zh: 弗洛德维克潮汐电站
      en: Flodvik Tidal Power Station
      art-x-viking: Gezeitenkraftwerk Flodvik
      art-x-buckham: Centrale Mareomotrice di Baiamarea
    wonder:
      zh: 世界唯一的潮汐电站，坝顶兼作海堤
      en: The only tidal power station in the world, its dam doubling as a sea wall
    notes:
      zh: "横跨弗洛德维克湾口的潮汐坝，涨落潮推动坝下的水轮机组，坝顶兼作海堤。坝顶修了一条步道，涨落潮时可以站在坝上看海水从闸孔里翻滚而过，是本地人饭后散步的去处。弗洛德维克人的日历和咖啡杯上都印着潮汐表，电站的发电量也跟着潮汐表一涨一落。"
      en: "A tidal barrage across the mouth of Flodvik; the rising and falling tide drives the turbines in the dam, whose crest doubles as a sea wall. A walkway runs along the top of the barrage, where at the turn of the tide you can watch the sea churn through the sluices, and it is where locals take their after-dinner stroll. Flodvik's calendars and coffee cups carry the tide table, and the station's output rises and falls with it."
    in: div_0yqqc3
    offset_km: [-1.4, 2.8]
    site: { size_m: [1200, 300], layout: port }
  - id: poi_642znz
    subtype: ski_resort
    status: generated
