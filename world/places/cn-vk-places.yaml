  - id: poi_297zsp
    subtype: castle
    status: generated
    names:
      zh: 维京王厅遗址
      en: Viking Hall Ruins
      art-x-viking: Ruinen der Königshalle
      art-x-buckham: Rovine della Sala del Re
    wonder:
      zh: 世界唯一的维京长厅遗址，古城围绕它形成
      en: The only Viking longhall ruin in the world, around which the old town grew
    notes:
      zh: "维京王厅遗址是世界唯一的维京长厅遗址，维京时代群岛首领的长厅就建在这里，长船市福恩斯塔德区的古城后来围绕它形成。遗址在古城的山顶上，占地约 260 米长、200 米宽，如今是一片开阔的遗址公园，从这里可以俯瞰长船湾和湾对岸汇金区的玻璃塔楼。长厅的石砌墙基至今清晰可见，地面上用木桩标出了当年屋顶柱子的位置，两排木桩之间的长度能停下一艘长船；长厅中央残存一道长长的石砌火塘，首领和部众当年就在火塘两边吃饭、议事和过冬。遗址是群岛最重要的考古遗址，山脚港湾泥滩里发掘出的三艘长船陈列在长船博物馆，同时出土的兵器和金银器也收藏在馆里。\n福恩斯塔德区是维京群岛最古老、人口最密集的城区，每平方公里约八百人。古城建在维京时代长船停泊的港湾旁，城墙环绕的老城里街巷狭窄曲折，石屋、商栈和教堂依坡而建，城墙内只许步行，马车道和石阶把港口与山顶的王厅遗址连在一起，从码头走上来要爬好一阵坡。长船是领地的首府，全市 230 万人，城市「一湾两岸，一半古一半新」，王厅遗址就是古的那一半的起点。邮轮停靠时，成千上万的游客涌入老城，大多会沿着石阶爬到遗址；世代居住的维京家庭和来自世界各地的移民、学生在这里混居，导游用维京语、中文、巴克汉姆语和英语轮流讲解，一句话里夹着几种语言的「长船腔」在遗址上也听得到。长船站是群岛的铁路枢纽，群岛高速铁路和阿克斯高速铁路在这里与维长真空磁悬浮同站换乘，许多游客下了火车就直奔古城。\n每年夏季的长船节上，复原的长船从港内驶出，场面壮观；福恩斯塔德古城和汇金区各组一支三十人的划船队，驾着仿古长船在湾里比赛，输的一方要在对岸广场上支起大锅请围观的人喝鱼汤。比赛用的仿古长船，是照着博物馆里最大的那艘按比例复制的。开赛前，古城的划船队会先到遗址前集合，按老规矩向首领的长厅敬一杯莓果酒，剩下的酒洒在火塘的石框上。冬天下雪时，雪先在墙基上化掉，长厅的轮廓在白地上显出一圈黑线，老人们说那是首领还在给长厅烧火。学校组织孩子来遗址上课，老师让他们沿着木桩一步步量出长厅的长度，量完了才明白一艘长船到底有多长。"
      en: "The Viking Hall Ruins are the only Viking longhall ruin in the world: the long hall of the islands' Viking-age chieftains stood here, and the old town of Fornstad District in Longship City later grew up around it. The ruins stand on the hilltop of the old town, about 260 m long and 200 m wide, now an open archaeological park looking out over Longship Bay and the glass towers of Goldmark District across the water. The stone footings of the hall are still plain to see, and timber posts mark where the roof pillars once stood, the hall between the two rows of posts long enough to house a longship; down the middle of the hall runs what is left of a long stone hearth, on either side of which the chieftain and his people once ate, held council and saw out the winter. The ruins are the most important archaeological site in the islands; the three longships dug from the harbour mud at the foot of the hill are displayed in the Longship Museum, together with the weapons and gold and silver found with them.\nFornstad is the oldest and most densely populated district in the Viking Islands, with about 800 people per square kilometre. The old town grew up beside the harbour where the Viking-age longships were moored; inside its walls the lanes are narrow and winding, with stone houses, merchants' halls and churches built up the slope, only walking is allowed, and a carriage road and stone steps link the harbour with the hall ruins on the hilltop, a good climb up from the quays. Longship is the territory's capital, a city of 2.3 million, \"one bay, two shores, half old and half new\", and the hall ruins are where the old half begins. When cruise ships call, thousands of visitors pour into the old town and most climb the steps to the ruins; Viking families who have lived here for generations share the district with immigrants and students from all over the world, guides take turns in Viking, Chinese, Buckham and English, and the \"Longship lilt\" that mixes several languages in one sentence can be heard on the ruins too. Longship Station is the islands' rail hub, where the Island Chain High-Speed Railway and the Akkersey High-Speed Railway meet the Viking Port–Longship Vacuum Maglev, and many visitors head straight from the train to the old town.\nAt the Longship Festival each summer replica longships sail out of the harbour in a grand spectacle; the old town of Fornstad and Goldmark District each field a crew of thirty and race replica longships across the bay, and the losers must set up a great pot on the far shore and serve fish soup to the onlookers. The replica longships are scale copies of the largest ship in the museum. Before the race the old-town crew gather at the ruins and, by old custom, raise a glass of berry spirit to the chieftain's hall, pouring what is left onto the stones of the hearth. When snow falls in winter it melts first on the footings, so that the outline of the hall shows as a dark line on the white ground, and the old folk say the chieftain is still keeping a fire in his hall. Schools bring children to the ruins for lessons, and teachers have them pace out the length of the hall along the posts; only when they have finished do they understand just how long a longship is."
    in: div_g2g1yc
    offset_km: [-0.5, 0.2]
    site: { layout: park, size_m: [260, 200] }
  - id: bld_gxv1c9
    subtype: museum
    status: generated
    names:
      zh: 长船博物馆
      en: Longship Museum
      art-x-viking: Langskipmuseum
      art-x-buckham: Museo della Nave Lunga
    notes:
      zh: "长船博物馆在长船市福恩斯塔德区的古城里，离维京王厅遗址不远，陈列从港湾泥滩中发掘的三艘维京长船，是群岛最重要的维京时代收藏。三艘长船在泥滩里埋了很久，船板上的刻纹和铁钉仍然完好，馆里还收藏着同一时期出土的兵器和金银器。博物馆是一座长约 200 米、宽约 120 米的展厅，三艘船按发掘时的姿态并排停放，参观者可以沿着高处的回廊俯看船身的线条和船舷上排列圆盾的位置。\n古城是维京群岛最古老、人口最密集的城区，邮轮停靠长船港时，成千上万的游客涌入老城，长船博物馆和王厅遗址是几乎每个旅行团都要去的地方。本地的学校也常把历史课搬到馆里上，老师让学生数一数船上的桨孔，算算当年要多少人才能把船划出长船湾。\n每年夏天的划船比赛用的仿古长船，就是照着馆里最大的那艘按比例复制的，古城和汇金区的划船队赛前都会来馆里看一眼「老祖宗」。长船节上，复原的长船从港内驶出，场面壮观，博物馆门口也挤满了看热闹的人。博物馆的工坊还教游客用老办法编帆绳，把几股麻线搓在一起、一圈圈绕紧，许多孩子编完一小段，会郑重地系在手腕上带回家。"
      en: "The Longship Museum stands in the old town of Fornstad District in Longship, not far from the Viking Hall Ruins, and displays three Viking longships raised from the mud of the harbour, the islands' most important collection from the Viking age. The three longships lay long in the mud, yet the carving and iron rivets of their planks survive intact, and the museum also holds weapons and gold and silver work found from the same period. The museum is a hall some 200 m long and 120 m wide in which the three ships rest side by side as they were found, and visitors can look down from a high gallery on the lines of their hulls and the places along their sides where shields once hung.\nThe old town is the oldest and most densely peopled part of the Viking Islands, and when cruise ships call at Longship thousands of visitors pour into it; the museum and the hall ruins are on almost every tour. Local schools often move their history lessons into the museum, where teachers have pupils count the oar ports and work out how many people it took to row a ship out of Longship Bay.\nThe replica longships raced across the bay each summer are scaled copies of the largest of the three, and before the race the old-town and Goldmark crews both come to take a look at \"the ancestor\". At the Longship Festival the replicas sail out of the harbour in a grand spectacle, and the museum doors are crowded with onlookers. The museum workshop also teaches visitors to braid sail rope the old way, twisting several strands of hemp together and winding them tight, and many children who finish a short length solemnly tie it round their wrist to take home."
    in: div_g2g1yc
    offset_km: [0.6, -0.4]
    site: { layout: hall, size_m: [200, 120] }
  - id: bld_1cr259
    subtype: office
    status: generated
    names:
      zh: 汇金证券交易所
      en: Goldmark Stock Exchange
      art-x-viking: Börse Goldmark
      art-x-buckham: Borsa di Marcoro
    notes:
      zh: "群岛离岸金融的中心，汇金大道上的交易大厅。交易大厅开市前要敲一下铜钟，钟是从一艘退役的老帆船上拆下来的。每年夏天的划船比赛前，汇金区的银行都在这里给自家的划船队开誓师会，输了比赛的一方要去古城广场上请大家喝鱼汤。"
      en: "The centre of the islands' offshore finance, a trading hall on Goldmark Avenue. The trading day opens with the stroke of a bronze bell taken from an old retired sailing ship. Before the summer rowing race each year Goldmark's banks hold a send-off for their crews in the hall, and if they lose they must serve fish soup to the crowd on the old-town square."
    in: div_jzqknb
    offset_km: [-0.4, 0.3]
    site: { layout: hall, size_m: [220, 150] }
  - id: bld_kqvbk1
    subtype: tower
    status: generated
    names:
      zh: 群岛银行大厦
      en: Islands Bank Tower
      art-x-viking: Inselbankturm
      art-x-buckham: Torre della Banca delle Isole
    notes:
      zh: "群岛银行大厦是长船市汇金区天际线上最高的塔楼，群岛银行的总部，也是整个长船天际线的最高点。汇金区与长船古城隔湾相望，离岸银行、信托与基金公司聚集，玻璃塔楼沿汇金湾一字排开，是维京群岛的金融中心；大厦与群岛唯一的证券交易所汇金证券交易所相去不远，周围是数百家银行、保险、航运金融和律师事务所，奥斯特哈门港口高速从塔下经过。大厦占地约 110 米见方，底层是银行的营业大厅，上面是办公楼层，顶部是观景层。\n选举之夜，塔顶的灯会按第一群岛、蓝桨两党中胜选一方的颜色亮起，红色是第一群岛，蓝色是蓝桨，长船人看一眼汇金区的天际线就知道结果。首府长船是两党势均力敌的战场，开票夜里湾两岸的酒吧挤满了等结果的人，塔顶灯光迟迟不亮的那几个小时，往往是全城最紧张的时刻；灯一亮，一半人欢呼，另一半人默默结账回家。\n观景层的咖啡馆能望见整个长船湾，对岸是古城的城墙和王厅遗址，夏天划船比赛时这里一座难求，银行的职员们早早订好座位，为自家的划船队加油。平日里，楼下的员工中午常端着咖啡到汇金湾的滨海长廊上晒太阳，傍晚塔楼的灯光倒映在湾水中，是首府最摩登的景色之一。"
      en: "The Islands Bank Tower is the tallest tower on the skyline of Longship's Goldmark District, headquarters of the Islands Bank and the highest point on the whole Longship skyline. Goldmark faces Longship's old town across the bay, a cluster of offshore banks, trusts and fund houses whose glass towers line Goldmark Bay, the financial centre of the Viking Islands; the tower stands not far from the Goldmark Stock Exchange, the only stock exchange in the islands, among hundreds of banks, insurers, shipping financiers and law firms, and the Austhamn Port Expressway runs past its foot. The tower occupies a plot about 110 m square, with the bank's banking hall on the ground floor, offices above and the observation level at the top.\nOn election night the top of the tower is lit in the colour of the winner, red for First Islands and blue for Blue Oar, so Longship knows the result from one look at the Goldmark skyline. The capital is the battleground where the two parties are evenly matched, and on counting night the bars on both sides of the bay are full of people waiting; the hours before the light comes on are often the tensest in the city, and when it does, half the crowd cheers and the other half quietly pays and goes home.\nThe café on the observation level overlooks the whole of Longship Bay, with the old town walls and the hall ruins across the water, and during the summer rowing race there is not a seat to be had, the banks' staff booking early to cheer on their crews. On ordinary days the people who work in the tower often take their coffee out to the Goldmark Bay promenade at lunchtime, and in the evening the lights of the towers reflected in the bay are one of the capital's most modern sights."
    in: div_jzqknb
    offset_km: [0.5, -0.3]
    site: { layout: tower, size_m: [110, 110] }
  - id: poi_p2ynaf
    subtype: university
    status: generated
    names:
      zh: 群岛大学
      en: University of the Islands
      art-x-viking: Universität der Inseln
      art-x-buckham: Università delle Isole
    notes:
      zh: "群岛大学是领地唯一的大学，在长船市北岬区，以海洋学、旅游管理与金融法见长，航运专业也享有盛誉。校园占地约 700 米乘 450 米，沿长船湾一侧的海岸展开，教学楼和学生公寓依着山坡排列，学生和教师来自世界各地，科研人员和学生使北岬成为长船最年轻的区之一。附近就是长船国际机场，北面的山坡上还有牧羊草场，学生们常说，在群岛大学读书，窗外不是飞机就是羊。\n海洋学系的码头上停着学校自己的科考船，学生的第一堂实习课就是在船上学会看天、打绳结，再跟着老师到海湾里观测水温、潮流和浮游生物。旅游管理专业的学生暑假多去阿夫琳港的邮轮母港和暖泉的温泉度假村实习，金融法专业的学生则在汇金区的银行和律师事务所里度过假期，毕业后许多人就留在那里工作。校园里中文、维京语、巴克汉姆语和英语混杂，食堂的菜单也用四种语言写。\n每年夏天学校的划船队也会去湾里给古城和汇金区的划船比赛当裁判，裁判船上的学生穿着统一的白色队服，终点线前的判决常常引来两岸观众的欢呼和嘘声。划船队的队员说，给比赛当裁判比自己参赛还紧张，因为两边的观众「一边是房东，一边是未来的老板」。"
      en: "The University of the Islands, in North Cape District of Longship, is the territory's only university, known for oceanography, tourism management and financial law, and well regarded for shipping as well. The campus, about 700 by 450 metres, runs along the Longship Bay shore, its teaching buildings and student halls stepped up the hillside, and its students and staff come from all over the world, making North Cape one of the youngest districts in Longship. Longship International Airport is close by and the hillsides to the north are still sheep pasture, so students say that at the University of the Islands the view from the window is either planes or sheep.\nThe oceanography department keeps the university's own research ship at its jetty, where students' first practical class is learning to read the sky and tie knots aboard before going out into the bay with their teachers to measure water temperature, currents and plankton. Tourism management students spend their summers interning at the Port Aveline Cruise Port and the spa resort at Warmspring, while financial law students spend theirs in the banks and law firms of Goldmark, where many stay on after graduating. Chinese, Viking, Buckham and English mingle on campus, and the canteen menu is written in all four.\nEach summer the university rowing club also referees the race across the bay between the old town and Goldmark; the students on the umpires' boat wear matching white kit, and their calls at the finish line often draw cheers and boos from both shores. Club members say refereeing is more nerve-racking than racing, because the crowd on one side is \"your landlord\" and on the other \"your future boss\"."
    in: div_xps98r
    offset_km: [0.6, 0.5]
    site: { layout: campus, size_m: [700, 450] }
  - id: poi_jk9zca
    subtype: airport
    status: generated
    names:
      zh: 长船国际机场
      en: Longship International Airport
      art-x-viking: Internationaler Flughafen Langskip
      art-x-buckham: Aeroporto Internazionale di Navelunga
    notes:
      zh: "长船国际机场是群岛的国际枢纽机场，建在长船市北岬区北岬的平地上，是维京群岛最大的机场，跑道长约 3.2 公里，顺着长船岛的走向；阿夫琳港、阿克斯维克与暖泉的机场只飞岛际与近程航线，飞往北维京岛、群岛各岛和世界各地的航班都在这里起降。航空运输和机场服务是北岬区最大的产业，许多航空公司、货运代理和飞机维修企业在机场周边设立基地。\n长船机场高速全长九十多公里，以十公里长的福恩斯塔德高架桥从古城出发，沿北岬湾岸直达机场，长船西北岸公路也从北岬出发，沿海岸经西岸区通往弗洛德维克。机场北面的山坡上仍有牧羊草场，羊群和机场跑道相映成趣，起降的旅客从舷窗望下去，常能看到草坡上星星点点的白羊。附近还有群岛大学的校园，学生们放假回家，拖着行李箱从宿舍走到航站楼也用不了多久。\n到达大厅里有一块牌子写着当天各条渡轮航线的风向和浪高，群岛人下了飞机第一件事常常不是叫车，而是看今天的渡轮开不开。要转渡轮去外岛的旅客若看到牌子上亮起红灯，就知道今晚得在长船住一夜了，机场旁的旅馆因此常年有一批「等风的客人」。"
      en: "Longship International Airport is the islands' international hub, built on the flat ground of North Cape in Longship's North Cape District and the largest airport in the Viking Islands; its runway, about 3.2 km long, runs along the length of Longship Island. The Port Aveline, Akkersvik and Warmspring airports fly only inter-island and short-haul routes, so flights to North Viking Island, the other islands and the rest of the world all use this one. Air transport and airport services are North Cape's largest industry, and many airlines, freight forwarders and aircraft maintenance firms have bases around the airport.\nThe Longship Airport Expressway, more than 90 km long, leaves the old town on the ten-kilometre Fornstad Viaduct and runs along the shore of North Cape Bay to the airport, and the Longship North-West Shore Road sets out from North Cape along the coast through West Shore to Flodvik. The hillsides north of the airport are still sheep pasture, sheep and runway side by side, and passengers looking down from their windows often see white sheep dotted over the grass. The University of the Islands is nearby too, and students going home for the holidays can wheel their cases from their halls to the terminal in no time.\nA board in the arrivals hall shows the day's wind and wave height on each ferry route, and the first thing many islanders do after landing is not to find a taxi but to check whether today's ferries are running. Passengers heading on to the outer isles know that if a red light shows on the board they will be spending the night in Longship, so the hotels by the airport always have a few \"guests waiting for the wind\"."
    in: div_xps98r
    offset_km: [-3, -2]
    site: { size_m: [3200, 1100], layout: airport, angle_deg: 32 }
  - id: poi_hjf6h0
    subtype: port
    status: generated
    names:
      zh: 奥斯特哈门集装箱码头
      en: Austhamn Container Terminal
      art-x-viking: Containerterminal Austhamn
      art-x-buckham: Terminal Container di Porto Est
    notes:
      zh: "奥斯特哈门集装箱码头是长船的货运港，在长船岛东南岸的奥斯特哈门区，是维京群岛最繁忙的集装箱港之一。港区长约 4.5 公里、宽约 2.6 公里，三座突堤为两座集装箱和一座滚装码头，大型集装箱船沿着阿夫琳海峡的深水航道驶往北维京岛和世界各地。码头后方的物流园、冷链仓库和配送中心为整个长船都市区供应货物，附近的修船厂、海工装备厂和船舶配件企业形成了完整的船舶产业链。\n奥斯特哈门港口高速全长八十多公里，从古城经汇金区直通码头，途中以十公里长的汇金高架桥穿过汇金区，集装箱卡车昼夜不停地往返于港口和城区之间。奥斯特哈门区有四十多万人，大量码头工人、卡车司机、船员和技工在这里工作和生活，码头旁的船员新村配有船员服务中心、海员教堂和国际学校，来自世界各地的船员在这里歇脚。海岸虽然布满码头和吊机，但南端仍保留着一段海滩和滨海公园。\n码头和汇金区只隔一条高速，长船人说这是「货在东边上岸，钱在西边结账」：东边的岸桥把集装箱吊上岸，西边的玻璃塔楼里，银行和保险公司就把这批货的账结清了。夜班的码头工人收工后，常到船员新村的平价餐馆里吃一盘炸鱼配薯条，和刚下船的外国海员比划着聊天。"
      en: "The Austhamn Container Terminal is Longship's cargo port, in Austhamn District on the south-east coast of Longship Island, and one of the busiest container ports in the Viking Islands. The port area is about 4.5 km long and 2.6 km wide, its three moles holding two container terminals and a ro-ro terminal, and large container ships sail from here along the deep-water channel of Aveline Strait to North Viking Island and the wider world. The logistics parks, cold stores and distribution centres behind the quays supply the whole Longship metropolitan area, and nearby ship-repair yards, offshore equipment works and marine parts makers form a complete shipbuilding chain.\nThe Austhamn Port Expressway, more than 80 km long, runs from the old town by way of Goldmark straight to the terminal, crossing Goldmark on the ten-kilometre Goldmark Viaduct, and container lorries shuttle between port and city day and night. Austhamn District has more than 400,000 people, many of them dockers, lorry drivers, seafarers and technicians who live and work here, and the seafarers' village by the terminal, with a seafarers' centre, a seamen's church and an international school, gives sailors from all over the world a place to rest. The shore is lined with quays and cranes, but a stretch of beach and a seaside park survive at its southern end.\nOnly an expressway separates the terminal from Goldmark, and Longship people say \"the goods come ashore in the east and the money settles in the west\": the cranes in the east lift the containers ashore, and in the glass towers to the west the banks and insurers settle the accounts for the cargo. Night-shift dockers often finish with a plate of fish and chips in a cheap restaurant in the seafarers' village, chatting in gestures with foreign sailors fresh off their ships."
    in: div_j6mw1m
    site: { size_m: [4500, 2600], layout: harbour, terminals: [container, container, roro] }

  # ── 阿夫琳港市 ──
  - id: poi_yvdm1z
    subtype: port
    status: generated
    names:
      zh: 阿夫琳港邮轮母港
      en: Port Aveline Cruise Port
      art-x-viking: Kreuzfahrthafen Port Aveline
      art-x-buckham: Porto Crociere di Porto Aveline
    notes:
      zh: "阿夫琳港邮轮母港是群岛的邮轮母港，在阿夫琳港市阿夫琳码头区的阿夫琳湾畔，拥有多个超大型邮轮泊位，夏季每天有多艘邮轮同时靠泊，高峰时一天可以同时停靠四五艘，上万名游客从这里登岸游览阿夫琳港和周边岛屿，或者从这里出发开始群岛巡游。邮轮从灯塔岛旁的灯塔水道驶入阿夫琳湾，码头背后就是群岛最大的免税购物中心阿夫琳港免税城和满是酒店、餐厅的免税商业街；旁边的渡轮枢纽有航线通往长船、暖泉、西格拉维克和乌维克库特。\n邮轮、零售和港口服务是码头区的全部经济，夏季人手紧张，冬季相对安静。阿夫琳港邮轮高速从这里出发，连接帆城区的阿夫琳港机场，夏季的包机旅客下了飞机就能直接上船。阿夫琳湾的海滨长廊是观赏邮轮进出港和日落的好地方，每当巨轮鸣笛起航，岸边总有人挥手送别，灯塔区的老灯塔也会在邮轮进港时闪三下灯。\n每艘第一次靠港的邮轮，帆城的造帆作坊都要缝一面小三角旗送上船，旗上绣着船名和一只海鸥，船长们大多把它挂在驾驶台上，几年后再来时还能看见。邮轮离港时，码头上的乐队奏一支维京语的送别歌，船上的人常常一直挥手到看不见灯塔，码头上的孩子们也学会了这支歌，跟着乐队一起唱。"
      en: "The Port Aveline Cruise Port is the islands' cruise home port, on Aveline Bay in Aveline Quay District of Port Aveline, with several berths for the largest cruise ships; in summer several ships berth at once every day, four or five at the peak, and more than ten thousand visitors a day come ashore here to see Port Aveline and the nearby islands or set out on a cruise of the islands. The ships enter Aveline Bay through Lighthouse Sound past Lighthouse Isle, and behind the quays lie the Port Aveline Duty-Free Mall, the largest in the islands, and a duty-free street full of hotels and restaurants; the ferry hub next door has routes to Longship, Warmspring, Siglavik and Uviqkut.\nCruise ships, shops and port services are the whole economy of the quay district, short of hands in summer and fairly quiet in winter. The Port Aveline Cruise Expressway starts here and links it with Port Aveline Airport in Sail Town, so summer charter passengers can go straight from plane to ship. The promenade on Aveline Bay is the place to watch the ships come and go and the sun go down; whenever a liner sounds its horn and sails, there are always people waving from the shore, and the old lighthouse in Lighthouse District flashes three times as each cruise ship comes in.\nEvery cruise ship calling for the first time is sent a small pennant sewn by the sailmakers of Sail Town, embroidered with the ship's name and a gull, and most captains hang it on the bridge, where it is still there when they return years later. When a ship leaves, the band on the quay plays a Viking farewell song and passengers often keep waving until the lighthouse is out of sight; the children on the quay have learned the song too and sing along with the band."
    in: div_tkvfsx
    site: { size_m: [1400, 500], layout: port }
  - id: bld_43g6sp
    subtype: marketplace
    status: generated
    names:
      zh: 阿夫琳港免税城
      en: Port Aveline Duty-Free Mall
      art-x-viking: Zollfreie Stadt Port Aveline
      art-x-buckham: Città Duty Free di Porto Aveline
    notes:
      zh: "邮轮码头旁的免税购物城，离港旅客的必经之地。美食街上最抢手的是萨尔塔维克海盐焦糖和现烤的肉桂面包，邮轮旅客离港前常常排着长队买上几盒带走。"
      en: "The duty-free shopping town beside the cruise piers, on every departing passenger's way. In its food street the best sellers are Saltavik sea-salt caramels and fresh cinnamon bread, and cruise passengers often queue for boxes of them to take home before sailing."
    in: div_tkvfsx
    offset_km: [1.0, -0.6]
