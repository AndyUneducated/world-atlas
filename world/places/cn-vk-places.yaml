  - id: poi_vh8f5f
    subtype: radar_station
    status: generated
    names:
      zh: 哨岛雷达站
      en: Sentinel Isle Radar Station
      art-x-viking: Radarstation Wachposteninsel
      art-x-buckham: Stazione Radar di Isola della Sentinella
    notes:
      zh: "哨岛山顶的海事与气象雷达，监视从东方进入群岛的航路。雷达站的值班员一年四季在山顶面对大风，本地人说这里是「群岛最先知道天气的人」。站里的气象数据每天清晨送到各条渡轮的驾驶台，船长们出航前都要看一眼哨岛的报告。"
      en: "The maritime and weather radar on the summit of Sentinel Isle, watching the sea lanes into the islands from the east. The radar crews face the wind on the summit in every season, and locals call them \"the first in the islands to know the weather\". The station's weather data reaches every ferry bridge each morning, and skippers check the Sentinel Isle report before they sail."
    in: div_72h3ge
    offset_km: [111.9, 0.9]
  - id: poi_93y3rq
    subtype: lighthouse
    status: generated
    names:
      zh: 哈洛兰岛灯塔
      en: Halloran Island Lighthouse
      art-x-viking: Leuchtturm Halloraninsel
      art-x-buckham: Faro di Isola Halloran
    notes:
      zh: "群岛北部的灯塔，标出从北方进入群岛的航路，也是从北维京岛驶来的船只最先望见的灯光。乘船从北维京岛回来的群岛人都把它的灯光当作「快到家了」的信号，灯塔下挂着一块牌子，写着一句维京语的「欢迎回到群岛」。"
      en: "A lighthouse in the north of the islands, marking the way in from the north and the first light seen by ships coming from North Viking Island. Islanders coming home by sea from North Viking Island take its beam as the sign that they are \"nearly home\", and a sign beneath it reads \"welcome back to the islands\" in Viking."
    in: div_kecby5
