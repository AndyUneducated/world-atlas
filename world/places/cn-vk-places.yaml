    notes:
      zh: 维京群岛领地政务院自然资源和环境保护部，位于长船古城东南，负责群岛的土地、海洋和能源资源的保护与利用。部内设政策司、自然生态保护司、大陆生态环境司、水生态环境司、海洋生态环境司、大气环境司、土壤生态环境司、固体废物和化学品司、环境影响评价和排放管理司、生态环境监测司和生态环境执法署，其中海洋生态环境司单独建楼。环境影响评价和排放管理司审批海上风电场、地热电站和港口扩建，自然生态保护司管理各岛的海鸟繁殖地和灰海豹保护区，固体废物和化学品司监督造船厂和港口的污染治理。
      en: The Ministry of Natural Resources and Environmental Protection of the Viking Islands, south-east of Longship's old town, protects and manages the islands' land, sea and energy resources. Its departments are Policy, Nature Conservation, Land Ecology, Freshwater Ecology, Marine Ecology, Air Quality, Soil Ecology, Solid Waste and Chemicals, Environmental Impact and Emissions, and Environmental Monitoring, with an Environmental Enforcement Agency; Marine Ecology has its own building. The impact assessors approve offshore wind farms, geothermal stations and harbour extensions, Nature Conservation looks after the seabird colonies and grey seal sanctuaries of the islands, and Solid Waste and Chemicals polices pollution at the shipyards and ports.
    in: div_g2g1yc
    offset_km: [0.34, -1.26]
    site: { size_m: [130, 80], layout: slab }

  - id: bld_bggwj7
    subtype: government
    status: generated
    names:
      zh: 维京群岛领地政务院自然资源和环境保护部海洋生态环境司
      en: Marine Ecology and Environment Department, Ministry of Natural Resources and Environmental Protection, Viking Islands Executive Council
    short_names:
      zh: 海洋生态环境司
      en: Marine Ecology Department
    notes:
      zh: 维京群岛领地政务院自然资源和环境保护部海洋生态环境司，在部大楼东南单独建楼，是群岛最重要的环境机构。群岛的经济离不开海洋，渔业、邮轮旅游、海上风电和航运共用同一片海域：海洋生态环境司划定海洋保护区和禁渔期，监测海水质量、渔业资源和海鸟、海豹的数量，评估海上风电场和航道对海洋生物的影响；它还负责溢油应急，在主要港口储备围油栏和清污船，群岛水域发生泄漏时统一指挥清理。每年发布的群岛海洋状况报告是渔业配额的依据。
      en: The Marine Ecology and Environment Department of the Ministry of Natural Resources and Environmental Protection has its own building south-east of the ministry and is the islands' most important environmental body. The islands live from the sea, where fishing, cruise tourism, offshore wind and shipping share the same waters. The department draws up marine protected areas and closed fishing seasons, monitors water quality, fish stocks and the numbers of seabirds and seals, and assesses how wind farms and shipping lanes affect marine life. It also leads the response to oil spills, keeping booms and clean-up vessels at the main ports, and its yearly report on the state of the islands' seas is the basis for fishing quotas.
    in: div_g2g1yc
