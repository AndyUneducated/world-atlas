  - id: poi_pz8sfs
    subtype: power_station
    status: generated
    names:
      zh: 斯瓦特桑德地热电站
      en: Svartsand Geothermal Power Station
      art-x-viking: Geothermalkraftwerk Svartsand
      art-x-buckham: Centrale Geotermica di Sabbianera
    wonder:
      zh: 世界最大的地热电站，供应群岛约一半的电力
      en: The largest geothermal power station in the world, supplying about half the islands' electricity
    notes:
      zh: "斯瓦特桑德地热电站是世界最大的地热电站，供应维京群岛约一半的电力。电站在暖泉市斯瓦特桑德区、暖泉火山的山脚下，场区约 500 米长、300 米宽，利用火山的地热发电：一口口地热井从地下深处抽出高温蒸汽推动汽轮机，冷却后的水再注回地下，让热储一直保持压力。电站最早只有几台机组，随着暖泉的城镇和温室越建越多，一期期扩建成今天的规模；控制室里能同时看到每一口井的温度和压力，火山监测站的数据也接进这里，地表一有异常，钻井队就先停下手里的活。电力供应暖泉全岛，也经海底电缆送往群岛的其他岛屿，和弗洛德维克的潮汐电站、海上风电场一起撑起群岛的清洁电网。电站发电后的热水并不浪费，先送进暖泉的温泉区和居民家里，用于区域供暖、温室种植和家庭浴室，许多人家的后院因此接着温泉管，暖泉城里的街道冬季也不结冰。\n斯瓦特桑德区是暖泉火山脚下的火山地貌区，人口约十万，老年人比例较高，以维京语、中文和巴克汉姆语为母语的家庭混居。区里以火山黑沙滩、熔岩地貌步道和地热电站闻名：黑沙滩由火山喷发的玄武岩碎屑形成，沙粒乌黑发亮；熔岩地貌步道穿行在凝固的熔岩流、熔岩洞和火山锥之间，游客可以近距离观察喷气孔和沸泥塘。韦克斯利航天测控站建在区外海的韦克斯利岛上，天线追踪着从北维京岛马斯林山发射的航天器。旅游和地热是区里的两大支柱，电站的工程师、钻井工和维修工不少就住在附近，徒步者、摄影师和地质爱好者常年来访。暖泉环山公路从区内穿过，北接温泉区，南通新特雷曼和克莱特斯塔德，暖泉南环高速也绕经这里。\n电站旁的地热田冒着白色的蒸汽，本地人把黑麦面团装进铁罐埋进热沙，焖上一整天就是又黑又甜的地热面包，早上埋下，傍晚下班顺路挖出来，罐子上用粉笔写着各家的名字，从来不会拿错。冬天的清晨，电站的蒸汽柱在冷空气里升得很高，从温泉区也看得见，老人们看蒸汽往哪边斜就知道今天刮什么风，说这比天气预报还准。黑沙滩在雪后最好看，白雪落在黑沙上，海浪一冲，黑白相间，摄影的人常常把电站的白色蒸汽也拍进同一张照片里。电站每年开放一天让居民进厂参观，孩子们最爱看工程师从井口放出一股蒸汽，轰的一声比火车汽笛还响。"
      en: "The Svartsand Geothermal Power Station is the largest geothermal power station in the world, supplying about half the electricity of the Viking Islands. It stands at the foot of Warmspring Volcano in Svartsand District of Warmspring City, its site about 500 m long and 300 m wide, and generates power from the volcano's heat: wells draw high-temperature steam from deep underground to drive the turbines, and the cooled water is pumped back down to keep the reservoir under pressure. The station began with only a few units and was enlarged phase by phase to its present size as Warmspring's towns and greenhouses multiplied; its control room shows the temperature and pressure of every well at once, the volcano monitoring stations' data feed in too, and at the first sign of anything unusual in the ground the drilling crews down tools. Its power supplies the whole of Warmspring Island and goes by subsea cable to the other islands as well, carrying the islands' clean grid together with the tidal station at Flodvik and the offshore wind farms. The hot water left after generating is not wasted: it goes on to Warmspring's spa district and to homes, for district heating, greenhouses and bathrooms, which is why so many back gardens are piped to a spring and the streets of Warmspring do not freeze in winter.\nSvartsand District is a volcanic landscape at the foot of Warmspring Volcano, with about 100,000 people, many of them elderly, from Viking-, Chinese- and Buckham-speaking families. It is known for its black volcanic beaches, its lava trails and its power station: the black beaches are made of basalt grit from the volcano's eruptions, their sand glossy black; the lava trails wind among frozen lava flows, lava caves and cinder cones, where visitors can see fumaroles and boiling mud pools up close. The Wexley Tracking Station stands on Wexley Island off the district's coast, its dishes following spacecraft launched from Maslin Mountain on North Viking Island. Tourism and geothermal power are the district's two mainstays; many of the station's engineers, drillers and fitters live nearby, and hikers, photographers and geology enthusiasts visit all year. The Warmspring Volcano Road runs through the district, north to Hot Springs District and south to New Tremaine and Klettstad, and the Warmspring Southern Arc Expressway passes this way too.\nBeside the station the geothermal field steams white, and locals bury iron pots of rye dough in its hot sand for a whole day to make a dark, sweet geothermal bread, burying it in the morning and digging it up on the way home from work, each pot chalked with the family's name so that none is ever taken by mistake. On winter mornings the station's plume of steam rises high into the cold air and can be seen from Hot Springs District, and old people tell the day's wind from the way it leans, saying it beats the weather forecast. The black beaches are loveliest after snow, when white snow lies on black sand and the waves wash through it in black and white, and photographers often get the station's white plume into the same picture. Once a year the station opens its gates to residents, and children love watching the engineers let a blast of steam out of a wellhead with a roar louder than a train whistle."
    in: div_v2tq1k
