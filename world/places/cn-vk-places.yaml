      en: "The ferry landing on the east shore of Ulikjuaq Island, with ferries to Furuheim on Akkersey. In the cod season the ferry decks are stacked with bundles of stockfish, and the drying racks by the quay climb right up the hillside. People waiting for the boat often buy a bag of golden fried cod tongues from the stall on the quay to eat while they wait."
