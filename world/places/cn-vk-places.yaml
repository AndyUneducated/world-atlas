      en: Wexley Tracking Station
      art-x-viking: Bodenstation Wexley
      art-x-buckham: Stazione di Controllo di Wexley
    notes:
      zh: "韦克斯利岛上的航天测控站，几面大型天线跟踪从北维京岛发射的航天器，四面开阔的海天没有遮挡。每次北维京岛有发射，测控站的天线就一齐转向东北方，值班员在屏幕前盯着航天器飞过群岛上空。站外的空地上常有游客等着看天线转动，本地人说「天线一转，马斯林山就要放火箭了」。"
      en: "A spacecraft tracking station on Wexley Island; its large dishes follow the launches from North Viking Island across an open horizon on every side. Whenever there is a launch from North Viking Island the station's dishes all turn north-east together, and the duty crew watch the spacecraft cross the sky above the islands. Visitors often wait on the open ground outside to watch the dishes swing round; locals say \"when the dishes turn, Maslin Mountain is about to launch\"."
    in: div_v2tq1k
