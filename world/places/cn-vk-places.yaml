      zh: 维京群岛领地政务院交通部水路司，在交通部西面单独建楼，靠近长船港，是群岛最重要的交通管理机构之一。四座大岛和三十多座中小岛屿之间的渡轮航线、长船和奥斯特哈门的远洋航运、造船厂的船舶检验和登记，都由水路司管理；它设有海上交通管理中心，二十四小时监控群岛周围水域的船舶动态，协调引航、拖轮和海上搜救。群岛的船舶登记处也设在这里，许多国际航运公司把船舶注册在长船，使群岛成为重要的船籍港。
      en: The Waterways Department of the Ministry of Transport has its own building west of the ministry near Longship harbour and is one of the islands' most important transport authorities. It manages the ferry routes between the four large islands and more than thirty smaller ones, ocean shipping at Longship and Austhamn, and the inspection and registration of ships built in the islands' yards. Its vessel traffic centre watches shipping in the surrounding waters around the clock and coordinates pilots, tugs and search and rescue at sea. The islands' ship registry is here too, and since many international shipping lines register their ships in Longship, the islands are an important flag port.
    in: div_g2g1yc
    offset_km: [-1.55, 0.41]
    site: { size_m: [120, 70], layout: slab }

  - id: bld_bgp03k
