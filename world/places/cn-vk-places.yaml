# Named places (buildings, landmarks, facilities) of the Viking Islands.
# Same conventions as cn-nv-places.yaml.
places:
  # ── 长船市 ──
  - id: bld_jsrk65
    subtype: government
    status: generated
    names:
      zh: 维京群岛领地政府
      en: Government of the Territory of the Viking Islands
      art-x-viking: Regierung von Veiling Ysear
      art-x-buckham: Governo di Etei Viking
    notes:
      zh: 维京群岛领地政务院的主楼，在长船古城中心，是一座石砌的回字形庭院建筑，领地议会也在楼内。政务院是领地的最高行政机关，由领地总督组织，下设十一个部和若干直属机构，各部的大楼分散在古城四周城墙外的街区里，步行十几分钟可达。主楼北翼是总督办公室，东翼和南翼是办公厅，西翼是领地议会的议事厅。办公厅下设综合行政局、媒体和出版局、财务局、安全局、档案局、采购局和公务员事务局，负责政务院的日常运转、新闻发布、机关财务和安保、公文档案、政府采购，以及公务员的招录和考核。
      en: The main building of the Viking Islands Executive Council stands in the middle of Longship's old town, a stone hollow square round a courtyard that also houses the territorial parliament. The Executive Council is the territory's highest executive body, formed by the governor, with eleven ministries and several directly attached bodies whose buildings are spread around the old town in the streets outside the walls, a short walk away. The north wing holds the Governor's Office, the east and south wings the General Office and the west wing the parliament's chamber. The General Office's bureaus (General Administration, Media and Publications, Finance, Security, Archives, Procurement and Civil Service) keep the Council running, brief the press, manage its accounts and security, keep its records, buy its supplies and recruit and assess civil servants.
    in: div_g2g1yc
    offset_km: [0.3, 0.4]
    emblem_of: div_raat4g
    site: { layout: courtyard, size_m: [260, 220] }
  - id: poi_297zsp
    subtype: castle
    status: generated
    names:
      zh: 维京王厅遗址
      en: Viking Hall Ruins
      art-x-viking: Ruinen der Königshalle
      art-x-buckham: Rovine della Sala del Re
    wonder:
      zh: 世界唯一的维京长厅遗址，古城围绕它形成
      en: The only Viking longhall ruin in the world, around which the old town grew
    notes:
      zh: "维京时代群岛首领的长厅遗址，古城就在它周围形成。长厅的石砌墙基至今清晰可见，地面上用木桩标出了当年屋顶柱子的位置，长度能停下一艘长船。夏天的划船比赛开赛前，古城的划船队会先到遗址前集合，按老规矩向首领的长厅敬一杯莓果酒。"
      en: "The ruins of the long hall of the islands' Viking-age chieftains; the old town grew up around it. The stone footings of the hall are still plain to see, and timber posts mark where the roof pillars once stood, the hall long enough to house a longship. Before the summer rowing race the old-town crew gather at the ruins and, by old custom, raise a glass of berry spirit to the chieftain's hall."
    in: div_g2g1yc
    offset_km: [-0.5, 0.2]
    site: { layout: park, size_m: [260, 200] }
  - id: bld_gxv1c9
    subtype: museum
    status: generated
    names:
      zh: 长船博物馆
      en: Longship Museum
      art-x-viking: Langskipmuseum
      art-x-buckham: Museo della Nave Lunga
    notes:
      zh: "陈列从港湾泥滩中发掘的三艘维京长船。三艘长船在泥滩里埋了很久，船板上的刻纹和铁钉仍然完好。每年夏天的划船比赛用的仿古长船，就是照着馆里最大的那艘按比例复制的；博物馆的工坊还教游客用老办法编帆绳。"
      en: "Displays three Viking longships raised from the mud of the harbour. The three longships lay long in the mud, yet the carving and iron rivets of their planks survive intact. The replica longships raced across the bay each summer are scaled copies of the largest of them, and the museum workshop teaches visitors to braid sail rope the old way."
    in: div_g2g1yc
    offset_km: [0.6, -0.4]
    site: { layout: hall, size_m: [200, 120] }
  - id: bld_1cr259
    subtype: office
    status: generated
    names:
      zh: 汇金证券交易所
      en: Goldmark Stock Exchange
      art-x-viking: Börse Goldmark
      art-x-buckham: Borsa di Marcoro
    notes:
      zh: "群岛离岸金融的中心，汇金大道上的交易大厅。交易大厅开市前要敲一下铜钟，钟是从一艘退役的老帆船上拆下来的。每年夏天的划船比赛前，汇金区的银行都在这里给自家的划船队开誓师会，输了比赛的一方要去古城广场上请大家喝鱼汤。"
      en: "The centre of the islands' offshore finance, a trading hall on Goldmark Avenue. The trading day opens with the stroke of a bronze bell taken from an old retired sailing ship. Before the summer rowing race each year Goldmark's banks hold a send-off for their crews in the hall, and if they lose they must serve fish soup to the crowd on the old-town square."
    in: div_jzqknb
    offset_km: [-0.4, 0.3]
    site: { layout: hall, size_m: [220, 150] }
  - id: bld_kqvbk1
    subtype: tower
    status: generated
    names:
      zh: 群岛银行大厦
      en: Islands Bank Tower
      art-x-viking: Inselbankturm
      art-x-buckham: Torre della Banca delle Isole
    wonder:
      zh: 群岛银行总部，首府长船天际线的最高点
      en: Head office of the Islands Bank and the highest point on the Longship skyline
    notes:
      zh: "汇金区天际线上最高的塔楼，群岛银行总部。塔顶的灯在红帆党和蓝桨党选举之夜会按胜选一方的颜色亮起，长船人看一眼汇金区的天际线就知道结果。观景层的咖啡馆能望见整个长船湾，夏天划船比赛时这里一座难求。"
      en: "The tallest tower on the Goldmark skyline, headquarters of the Islands Bank. On election night the top of the tower is lit in the colour of the winner, Red Sail or Blue Oar, so Longship knows the result from one look at the Goldmark skyline. The café on its observation level overlooks the whole of Longship Bay, and during the summer rowing race there is not a seat to be had."
    in: div_jzqknb
    offset_km: [0.5, -0.3]
    site: { layout: tower, size_m: [110, 110] }
  - id: poi_p2ynaf
    subtype: university
    status: generated
    names:
      zh: 群岛大学
      en: University of the Islands
      art-x-viking: Universität der Inseln
      art-x-buckham: Università delle Isole
    notes:
      zh: "领地唯一的大学，以海洋学、旅游管理与金融法见长。校园沿长船湾展开，海洋学系的码头上停着学校自己的科考船，学生的第一堂实习课就是在船上学会看天、打绳结。每年夏天学校的划船队也会去湾里给古城和汇金区的划船比赛当裁判。"
      en: "The territory's only university, known for oceanography, tourism management and financial law. The campus runs along Longship Bay, and the oceanography department keeps the university's own research ship at its jetty, where students' first practical class is learning to read the sky and tie knots aboard. Each summer the university rowing club also referees the race across the bay between the old town and Goldmark."
    in: div_xps98r
    offset_km: [0.6, 0.5]
    site: { layout: campus, size_m: [700, 450] }
  - id: poi_jk9zca
    subtype: airport
    status: generated
    names:
      zh: 长船国际机场
      en: Longship International Airport
      art-x-viking: Internationaler Flughafen Langskip
      art-x-buckham: Aeroporto Internazionale di Navelunga
    notes:
      zh: "群岛的国际枢纽机场，跑道顺着长船岛的走向；阿夫琳港、阿克斯维克与暖泉的机场只飞岛际与近程航线。到达大厅里有一块牌子写着当天各条渡轮航线的风向和浪高，群岛人下了飞机第一件事常常不是叫车，而是看今天的渡轮开不开。"
      en: "The islands' international hub, its runway along the length of Longship Island; the Port Aveline, Akkersvik and Warmspring airports fly only inter-island and short-haul routes. A board in the arrivals hall shows the day's wind and wave height on each ferry route, and the first thing many islanders do after landing is not to find a taxi but to check whether today's ferries are running."
    in: div_xps98r
    offset_km: [-3, -2]
    site: { size_m: [3200, 1100], layout: airport, angle_deg: 32 }
  - id: poi_hjf6h0
    subtype: port
    status: generated
    names:
      zh: 奥斯特哈门集装箱码头
      en: Austhamn Container Terminal
      art-x-viking: Containerterminal Austhamn
      art-x-buckham: Terminal Container di Porto Est
    notes:
      zh: "长船的货运港，三座突堤为两座集装箱和一座滚装码头，奥斯特哈门港口高速从这里直通汇金。码头和汇金区只隔一条高速，长船人说这是「货在东边上岸，钱在西边结账」。"
      en: "Longship's cargo port; its three moles hold two container terminals and a ro-ro terminal, and the Austhamn Port Expressway runs straight from here to Goldmark. Only an expressway separates the terminal from Goldmark, and Longship people say \"the goods come ashore in the east and the money settles in the west\"."
    in: div_j6mw1m
    site: { size_m: [4500, 2600], layout: harbour, terminals: [container, container, roro] }

  # ── 阿夫琳港市 ──
  - id: poi_yvdm1z
    subtype: port
    status: generated
    names:
      zh: 阿夫琳港邮轮母港
      en: Port Aveline Cruise Port
      art-x-viking: Kreuzfahrthafen Port Aveline
      art-x-buckham: Porto Crociere di Porto Aveline
    notes:
      zh: "群岛的邮轮母港，夏季每天有多艘邮轮同时靠泊。每艘第一次靠港的邮轮，帆城的造帆作坊都要缝一面小三角旗送上船，旗上绣着船名和一只海鸥。邮轮离港时，码头上的乐队奏一支维京语的送别歌，船上的人常常一直挥手到看不见灯塔。"
      en: "The islands' cruise home port; in summer several ships berth at once every day. Every cruise ship calling for the first time is sent a small pennant sewn by the sailmakers of Sail Town, embroidered with the ship's name and a gull. When a ship leaves, the band on the quay plays a Viking farewell song, and passengers often keep waving until the lighthouse is out of sight."
    in: div_tkvfsx
    site: { size_m: [1400, 500], layout: port }
  - id: bld_43g6sp
    subtype: marketplace
    status: generated
    names:
      zh: 阿夫琳港免税城
      en: Port Aveline Duty-Free Mall
      art-x-viking: Zollfreie Stadt Port Aveline
      art-x-buckham: Città Duty Free di Porto Aveline
    notes:
      zh: "邮轮码头旁的免税购物城，离港旅客的必经之地。美食街上最抢手的是萨尔塔维克海盐焦糖和现烤的肉桂面包，邮轮旅客离港前常常排着长队买上几盒带走。"
      en: "The duty-free shopping town beside the cruise piers, on every departing passenger's way. In its food street the best sellers are Saltavik sea-salt caramels and fresh cinnamon bread, and cruise passengers often queue for boxes of them to take home before sailing."
    in: div_tkvfsx
    offset_km: [1.0, -0.6]
    site: { layout: market, size_m: [320, 180] }
  - id: bld_tb1eh5
    subtype: tower
    status: generated
    names:
      zh: 阿夫琳港灯塔
      en: Port Aveline Lighthouse
      art-x-viking: Leuchtturm Port Aveline
      art-x-buckham: Faro di Porto Aveline
    notes:
      zh: "群岛最古老的灯塔，灯塔区由此得名。老灯塔如今不再为航船指路，却会在邮轮进港时闪三下灯，岸上的孩子们就跟着挥手。灯塔下的码头边有一家熏鲭鱼小摊，是本地人的心头好。"
      en: "The oldest lighthouse in the islands, which gave the Lighthouse District its name. The old lighthouse no longer guides shipping, but it flashes three times whenever a cruise ship comes in, and the children on shore wave back. On the quay at its foot is a smoked-mackerel stall that locals swear by."
    in: div_8a2hzm
    offset_km: [0.4, 0.3]
    site: { layout: tower, size_m: [40, 40] }
  - id: poi_kqtf3b
    subtype: airport
    status: generated
    names:
      zh: 阿夫琳港机场
      en: Port Aveline Airport
      art-x-viking: Flughafen Port Aveline
      art-x-buckham: Aeroporto di Porto Aveline
    notes:
      zh: "帆城北面台地上的机场，夏季有包机把游客直接送到邮轮母港。跑道尽头就是海，飞机起飞时从舷窗能看到灯塔区的老灯塔和港里排开的邮轮。到达大厅里挂满了帆城造帆作坊缝制的三角旗，每一面都对应一艘来过阿夫琳港的邮轮。"
      en: "The airport on the terrace north of Sail Town; in summer charter flights bring visitors straight to the cruise port. The runway ends at the sea, and on take-off passengers can see the old lighthouse of Lighthouse District and the cruise ships lined up in port. The arrivals hall is hung with pennants sewn by the sailmakers of Sail Town, one for every cruise ship that has called at Port Aveline."
    in: div_vhsby1
    offset_km: [-5.7, 21.2]
    site: { size_m: [2800, 900], layout: airport, angle_deg: 105 }

  # ── 暖泉市 ──
  - id: poi_v2pw1f
    subtype: hotel
    status: generated
    names:
      zh: 暖泉温泉度假村
      en: Warmspring Spa Resort
      art-x-viking: Thermalresort Warmquell
      art-x-buckham: Resort Termale di Fontecalda
    wonder:
      zh: 世界唯一的火山温泉度假村，冬夜可在极光下泡温泉
      en: The only volcanic hot spring resort in the world, where guests bathe under the aurora on winter nights
    notes:
      zh: "火山脚下的露天温泉池与酒店，冬夜可在极光下泡温泉。极光出现时，度假村会敲响一面铜锣，提醒还在屋里的客人赶快出来。泡温泉时最受欢迎的小吃是在喷气孔边的铁丝篮里煮熟的温泉蛋，配一片地热焖出来的黑麦面包。"
      en: "Open-air hot pools and a hotel at the foot of the volcano; on winter nights guests bathe under the aurora. When the aurora appears the resort strikes a gong to call guests out of their rooms. The favourite snack in the pools is a hot-spring egg cooked in a wire basket over a steam vent, with a slice of rye bread baked in the geothermal sand."
    in: div_cz7sch
    offset_km: [0.4, 0.4]
    site: { layout: park, size_m: [600, 400] }
  - id: poi_pz8sfs
    subtype: power_station
    status: generated
    names:
      zh: 斯瓦特桑德地热电站
      en: Svartsand Geothermal Power Station
      art-x-viking: Geothermalkraftwerk Svartsand
      art-x-buckham: Centrale Geotermica di Sabbianera
    wonder:
      zh: 世界唯一的地热电站，供应群岛约一半的电力
      en: The only geothermal power station in the world, supplying about half the islands' electricity
    notes:
      zh: "利用火山地热发电，供应全群岛约一半的电力。电站发电后的热水再送进暖泉的温泉区和居民家里，许多人家的后院因此接着温泉管。电站旁的地热田冒着白色的蒸汽，本地人把黑麦面团装进铁罐埋进热沙，焖上一整天就是又黑又甜的地热面包。"
      en: "Generates power from the volcano's heat, supplying about half of the islands' electricity. After generating power its hot water goes on to Warmspring's spa district and to homes, which is why so many back gardens are piped to a spring. Beside the station the geothermal field steams white, and locals bury iron pots of rye dough in its hot sand for a whole day to make a dark, sweet geothermal bread."
    in: div_v2tq1k
    offset_km: [0.8, 0.6]
    site: { layout: complex, size_m: [500, 300] }
  - id: poi_4hccr3
    subtype: park
    status: generated
    names:
      zh: 黑沙滩
      en: Black Sand Beach
      art-x-viking: Schwarzer Strand
      art-x-buckham: Spiaggia Nera
    notes:
      zh: "火山熔岩冲刷成的黑色沙滩，斯瓦特桑德区由此得名。黑沙滩在雪后最好看，白雪落在黑沙上，海浪一冲，黑白相间。沙滩上的沙粒带着火山的余温，冬天赤脚踩上去也不觉得冷，孩子们喜欢在沙里找带气孔的小火山石。"
      en: "A black beach of volcanic sand washed from the lava, which gave Svartsand District its name. The beach is at its best after snow, when white falls on black sand and the waves wash through it in stripes. The sand keeps a little of the volcano's warmth, so it never feels cold underfoot even in winter, and children like to hunt in it for small bubbly volcanic pebbles."
    in: div_v2tq1k
    offset_km: [-0.5, -0.4]
    site: { layout: park, size_m: [900, 250] }
  - id: poi_gsnass
    subtype: airport
    status: generated
    names:
      zh: 暖泉机场
      en: Warmspring Airport
      art-x-viking: Flughafen Warmquell
      art-x-buckham: Aeroporto di Fontecalda
    notes:
      zh: "温泉区北面海滨平原上的机场，冬季迎来看极光、泡温泉的游客。降落前旅客能从舷窗看到地热田上升起的白色蒸汽和远处的暖泉火山，冬夜的航班有时会在极光里降落。行李转盘旁有一块温泉区的公共浴池时刻表，许多人下了飞机就直接去泡澡。"
      en: "The airport on the coastal plain north of Hot Springs, busy in winter with visitors who come for the aurora and the hot pools. On the approach passengers can see the white steam rising from the geothermal field and Warmspring Volcano beyond, and winter evening flights sometimes land under the aurora. Beside the baggage belt hangs the timetable of the public pools in Hot Springs District, and many people go straight from the plane to a soak."
    in: div_cz7sch
    offset_km: [4.2, 9.2]
    site: { size_m: [2800, 900], layout: airport, angle_deg: 60 }

  # ── 阿克斯维克市 ──
  - id: poi_grh5jd
    subtype: port
    status: generated
    names:
      zh: 阿克斯维克集装箱港
      en: Port of Akkersvik
      art-x-viking: Hafen Akkersvik
      art-x-buckham: Porto di Portancora
    wonder:
      zh: 群岛最大的港口，岛际货轮从这里分拨到各岛
      en: The largest port in the islands, where inter-island freighters fan out to every island
    notes:
      zh: "群岛最大的港口，在阿克斯岛两爪之间的阿克斯维克湾里；五座突堤为油品、散货、两座集装箱和滚装码头，岛际货轮从这里分拨到各岛。傍晚时分，西爪岬的海岸步道上能看到集装箱船一艘接一艘驶出阿克斯维克湾，本地孩子比赛认船上的公司旗，认得最多的被大家叫作「小引水员」。码头工人的早餐是一大碗加了熏肉的豌豆汤。"
      en: "The largest port in the islands, in Akkersvik Bay between the two flukes of Akkersey; its five moles hold the oil, bulk, two container and ro-ro terminals, and inter-island freighters distribute cargo from here to every island. In the evening the coastal path on West Fluke offers a view of container ships leaving Akkersvik Bay one after another, and local children compete to name the company flags; whoever knows the most is dubbed \"the little pilot\". Dockers breakfast on a big bowl of pea soup with bacon."
    in: div_a2n8cw
    offset_km: [-3.1, -1.8]
    site: { size_m: [5000, 3000], layout: harbour, terminals: [oil, bulk, container, container, roro] }
  - id: poi_a7t36e
    subtype: industrial_park
    status: generated
    names:
      zh: 阿克斯维克造船厂
      en: Akkersvik Shipyard
      art-x-viking: Werft Akkersvik
      art-x-buckham: Cantiere Navale di Portancora
    notes:
      zh: "群岛最大的造船厂，船台与干船坞建造渡轮、渔船和海上风电安装船，瑙斯特海姆区由此得名。每有新船下水，全厂工人站在船坞两侧一齐用扳手敲打钢栏杆，叮叮当当的声音传遍半座城，附近的居民听到就知道「又一艘船出嫁了」。"
      en: "The largest shipyard in the islands, whose slipways and dry docks build ferries, fishing boats and offshore wind installation vessels; the Naustheim District is named after it. Whenever a new ship is launched, the whole workforce lines both sides of the dock and beats the steel railings with spanners, a clangour heard across half the city that tells the neighbours \"another ship has been married off\"."
    in: div_qyhvjj
    offset_km: [0.7, -4.9]
    site: { size_m: [2000, 700], layout: port }
  - id: bld_77hf7p
    subtype: office
    status: generated
    names:
      zh: 群岛航运交易所
      en: Islands Shipping Exchange
      art-x-viking: Schifffahrtsbörse der Inseln
      art-x-buckham: Borsa Marittima delle Isole
    notes:
      zh: "船舶租赁与运费交易的大厅，与船级社一起坐落在锚链大道上。大厅里流行一种掺了朗姆酒的热咖啡，据说是给彻夜盯着远洋航线的经纪人提神的。墙上一块巨大的电子海图实时显示群岛船东的船舶位置，经纪人看一眼就知道哪片海域的运费要涨。"
      en: "The hall where ships are chartered and freight is traded, on Cable Avenue next to the classification society. The fashion in the hall is hot coffee laced with rum, said to keep brokers awake through nights spent watching the ocean routes. A huge electronic chart on the wall shows the position of every island-owned ship in real time, and one glance tells a broker where freight rates are about to rise."
    in: div_b569a2
    offset_km: [0.3, 0.3]
    site: { layout: hall, size_m: [200, 140] }
  - id: poi_1b074w
    subtype: airport
    status: generated
    names:
      zh: 阿克斯维克机场
      en: Akkersvik Airport
      art-x-viking: Flughafen Akkersvik
      art-x-buckham: Aeroporto di Portancora
