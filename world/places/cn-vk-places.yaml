      en: "The service port on the south shore of Jaalituuq Island, used by the offshore wind farm's service vessels and the ferries to Port Aveline. The convoys carrying the extra-long blades always roll into the port at night, while children at the windows count blades until they fall asleep, which the island calls \"counting windmills\". The service-boat cooks are famous, and what keeps the technicians going on a day at sea is the lunchtime pot of fish soup with bacon and potatoes."
