    youth_wing: {"zh": "青年社会民主派", "en": "Young Social Democrats"}
    slogan: {"zh": "没有人是外人", "en": "No one is a stranger"}
    policies: [{"zh": "努西法拉难民营的居民住满十年可以入籍", "en": "Let residents of the Nosifara camp who have lived there ten years become citizens"}, {"zh": "可可和香草种植园的雇工享有最低工资和医疗保险", "en": "Give the hired hands of the cocoa and vanilla plantations a minimum wage and health insurance"}, {"zh": "全民免费医疗扩大到牙科和眼科", "en": "Extend free health care to teeth and eyes"}, {"zh": "旅游业收入的一部分用于公共住房", "en": "Put part of the tourism revenue into public housing"}]
    targets: {"div_gebca7": 34}
    lean: {"young": 1.5, "income": -1.0, "aid": 0.6}
    notes: {"zh": "社会民主党是萨马伊自由邦议会的第二大党和最大的反对党，代表种植园和旅游业的工人、公务员、难民援助人员和年轻人。党首哈米西·法拉吉是一位说卡西里语的医生，在努西法拉岛的难民营诊所工作了十多年，他常说：「在营地里，我从来不问病人从哪里来。」党员约三万四千，比自由民主党还多。\n党的口号是「没有人是外人」。它主张努西法拉难民营的居民住满十年可以入籍；可可和香草种植园的雇工享有最低工资和医疗保险；全民免费医疗扩大到牙科和眼科；旅游业收入的一部分用于公共住房。在外交上，它支持世俗协约，但主张自由邦在调停中更多地关注难民和战争受害者，而不只是停火线。\n社民党曾与自由民主党组成联合政府，建立了全民免费医疗制度，又因难民入籍的问题与自民党分道扬镳。在野期间，它在议会里不断追问政府在难民营就业和住房上的进展，也与信仰社区联盟中的伊斯兰社区代表在福利问题上合作。自民党批评社民党的入籍计划会给小国带来太大的负担，社民党则回应说，营地里的孩子已经是萨马伊人了。\n社民党的组织以工会和地方支部为基础，种植园与旅游业工会的会员可以集体入党，工会在党的全国大会中拥有三分之一的票数。党首由全体党员直接选出，法拉吉在选举中击败了两位资深议员，成为党史上第一位说卡西里语的党首。党的章程规定，候选人名单中男女交替排列，并须有至少一名来自难民营的长期居民或援助人员。党的经费来自党费、工会的政治基金和众筹，它在努西法拉岛开设了一家免费诊所和一所夜校，由党员志愿者轮流值班。青年社会民主派每年组织「营地图书馆」活动，为难民营的孩子们募集图书和文具，并在营地里开办周末读书会，读书会的志愿者多是在营地里长大、后来考进萨马伊大学的年轻人。\n社民党的选民是年轻人和低收入者，在努西法拉岛、首都的工人区和东部的安提瓦最强。每年世界难民日，党在努西法拉的码头举办「同一张桌子」聚餐，难民营的居民和岛上的居民一起做饭、吃饭，孩子们在码头上踢球。党旗是红底上的一组白色链环，代表不同出身的人连在一起。", "en": "The Social Democratic Party is the second party in Samay's parliament and the largest in opposition, speaking for the workers of the plantations and of tourism, civil servants, refugee aid workers and the young. Its leader, Hamisi Faraji, is a Kasiri-speaking doctor who worked for more than ten years at the camp clinic on Nosifara, and who likes to say, 'In the camp I never asked a patient where they came from.' With some 34,000 members it has more than the Liberal Democrats. \nIts watchword is 'no one is a stranger'. It wants residents of the Nosifara camp who have lived there ten years to be able to become citizens; a minimum wage and health insurance for the hired hands of the cocoa and vanilla plantations; free health care extended to teeth and eyes; and part of the tourism revenue spent on public housing. Abroad it supports the Secular Accord, but wants the Free State's mediation to look more to refugees and the victims of war, not only to ceasefire lines. \nThe Social Democrats once governed with the Liberal Democrats and built the system of free health care for all, then parted over citizenship for refugees. In opposition they keep pressing the government in parliament on jobs and housing in the camp, and work with the Muslim community's members of the Alliance of Faith Communities on welfare. The Liberal Democrats say the citizenship plan would put too great a burden on a small state; the Social Democrats answer that the children of the camp are already Samayans. \nThe Social Democrats are built on the unions and local branches; members of the plantation and tourism workers' union may join collectively, and the unions hold a third of the votes at the national congress. The leader is elected by all members, and Faraji beat two senior members of parliament to become the party's first Kasiri-speaking leader. Its rules alternate women and men on candidate lists and require at least one long-time resident of the camp or aid worker on each. Money comes from dues, union political funds and crowdfunding, and on Nosifara it runs a free clinic and a night school staffed in turn by volunteer members. The Young Social Democrats run a Camp Library drive each year, collecting books and stationery for the children of the camp and holding weekend reading groups there, whose volunteers are mostly young people who grew up in the camp and went on to the University of Samay.\nIts voters are the young and the lower paid, and it is strongest on Nosifara, in the capital's workers' districts and in Antiva in the east. On World Refugee Day each year it holds 'One Table' on the quay at Nosifara, where people from the camp and from the island cook and eat together while the children play football on the quay. Its flag is white links on red, people of every origin joined together."}
    history: {"zh": "社会民主党由种植园工会、教师工会和难民援助组织联合组建。自由邦成立后，努西法拉岛的难民营不断扩大，援助人员和工会成员希望在议会中为难民和劳动者发声，于是组建了政党。", "en": "The Social Democratic Party was formed by the plantation and teachers' unions and the refugee aid groups. As the Nosifara camp grew after the Free State's founding, aid workers and union members wanted a voice in parliament for refugees and working people, and formed a party."}
    flag_notes: {"zh": "党旗是红底上的一组白色链环。红色是社会民主的传统颜色，链环代表不同出身的人连在一起。", "en": "The flag is white links on red. Red is the traditional colour of social democracy; the links are people of every origin joined together."}
    factions: [{"names": {"zh": "营地派", "en": "Camp Wing"}, "notes": {"zh": "难民援助人员和努西法拉岛的党员，最关心难民入籍、就业和难民学校。", "en": "Aid workers and members on Nosifara, who care most about citizenship, jobs and schools for refugees."}}, {"names": {"zh": "种植园派", "en": "Plantation Wing"}, "notes": {"zh": "可可和香草种植园的工会，最关心工资、医疗保险和土地。", "en": "The unions of the cocoa and vanilla plantations, who care most about pay, health insurance and land."}}]
    organisation: {"newspaper": {"zh": "《人民论坛报》", "en": "People's Tribune"}, "unions": {"zh": "萨马伊种植园与旅游业工会", "en": "Samay Plantation and Tourism Workers' Union"}, "women": {"zh": "社会民主妇女会", "en": "Social Democratic Women"}}
  - id: "pty_y19nf5"
    names: {"zh": "信仰社区联盟", "en": "Alliance of Faith Communities"}
    short_names: {"zh": "信仰联盟", "en": "Faith Alliance"}
    color: "#6A1B9A"
    flag: {"layout": "banner", "colors": ["#6A1B9A"], "charge": "book", "charge_color": "#E9B949"}
    spectrum: 0.6
    family: {"zh": "多宗教保守主义", "en": "Multi-faith conservative"}
    ideology: [{"zh": "宗教多元主义", "en": "Religious pluralism"}, {"zh": "社区自治", "en": "Community self-government"}, {"zh": "社会保守主义", "en": "Social conservatism"}]
    axes: {"econ": 4.5, "galtan": 6.5, "autonomy": 6.0, "green": 6.0}
    leader: {"zh": "沃阿汉吉·拉贝", "en": "Voahangy Rabe"}
