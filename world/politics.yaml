# Parties: cross-territory first, then each territory's own. family is the party's tradition in a few
# words; notes the card's introduction; history how it came to be (no dates).
parties:
  # ── 跨领地政党 ──
  - id: pty_09zrw1
    names: { zh: 公地联盟, en: Commons Alliance }
    short_names: { zh: 公地, en: "Commons" }
    color: "#C0392B"
    flag: { layout: banner, colors: ["#C0392B"], charge: dawn, charge_color: "#F6E7C1" }
    spectrum: -2.2
    family: { zh: 民主社会主义, en: Democratic socialism }
    leader: { zh: 梅鲁瓦伊·托兰加姆, en: Meruvai Tolangam }
    members: 64000
    youth_wing: { zh: 公地青年, en: Commons Youth }
    slogan: { zh: 共有的才是长久的, en: What we share is what lasts }
    policies:
      - { zh: 土地继续公有，长期租用的期限和租金由居民议事会公开审定, en: "Keep land in common ownership, with lease terms and rents set openly by residents' councils" }
      - { zh: 全民基本收入随生产率逐年上调, en: Raise the universal basic income every year in step with productivity }
      - { zh: 大型港口、电网和磁浮线路由公共机构持有，职工代表进董事会, en: "Hold the big ports, the grid and the maglev in public hands, with workers on their boards" }
      - { zh: 每个街区设免费的公共食堂和工具图书馆, en: Give every neighbourhood a free canteen and a tool library }
    allies: [pty_jh513z, pty_6c94cq, pty_18qa5s]
    targets: { div_fbfqv9: 4, div_raat4g: 1.5, div_hpmerr: 1.5, div_nwm019: 17.6 }
    lean: { young: 3, urban: 0.3, income: -0.3, manufacturing: 0.3, "status:commune": 1.0, "lang:en": -0.5 }
    notes:
      zh: "公地联盟是四个领地都有候选人的左翼政党，主张公共所有、全民福利和工作场所民主，名字取自「大家共有、共同照看的土地」。它的大本营在长夏群岛：那里土地公有、长期租用，教育免费到大学，全民基本收入覆盖每个居民，这些制度大多是公地联盟在领地议会里一条条推动写进法规的。现在它是长夏群岛领地议会的第一大党，与互助党、伊武兰复兴党联合执政，三党合计只比半数多一席，每次表决都要把议员一个不落地叫回议事厅，总督梅鲁瓦伊·托兰加姆因此被人叫作「点名总督」。在北维京岛它只有不到半成的选票，过不了门槛，在各市议会里也还没有席位；在维京群岛和北冰洋，它更像一个读书会和工会之间的网络。党员以教师、护士、港口工人和大学生为多，党部的会议室晚上常借给附近的合唱团和象棋社。"
      en: "The Commons Alliance is a left-wing party with candidates in all four territories, standing for public ownership, universal welfare and democracy at work; its name comes from the idea of land held and cared for in common. Its stronghold is the Everlong Summer Islands, where land is publicly owned and held on long leases, education is free through university and a universal basic income reaches every resident, rules the Alliance pushed into law one by one in the territorial assembly. It is now the largest party there and governs with the Mutual Aid Party and Ivuran Renewal; the three together have just one seat more than half, so every vote means calling each member back to the chamber, and Governor Meruvai Tolangam has been nicknamed the Roll-Call Governor. On North Viking Island it wins under one vote in twenty, short of the threshold, and has yet to win a seat on any city council there; in the Viking Islands and the Arctic Ocean it is more a network between reading circles and trade unions. Its members are mostly teachers, nurses, dockers and students, and in the evenings its branch rooms are lent to the local choirs and chess clubs."
    history:
      zh: "公地联盟由长夏群岛的稻农合作社、港口工会和大学里的读书会合并而成，最初只在萨伦纳姆和塔卢马兰竞选。土地公有和全民基本收入写进领地法规之后，它的声望迅速扩散，后来在其他三个领地也陆续成立了支部。"
      en: "The Alliance grew from a merger of the Everlong Summer rice cooperatives, the dockers' unions and university reading circles, and at first stood only in Sarunnam and Talumaran. Once public land and the basic income were written into the territory's laws its name spread fast, and branches followed in the other three territories."

  - id: pty_jh513z
    names: { zh: 互助党, en: Mutual Aid Party }
    short_names: { zh: 互助, en: "Mutual Aid" }
    color: "#E4572E"
    flag: { layout: bands, colors: ["#E4572E", "#FFFFFF", "#E4572E"], ratio: [1, 2, 1], charge: links, charge_color: "#E4572E" }
    spectrum: -1.0
    family: { zh: 社会民主主义, en: Social democracy }
    leader: { zh: 陆远舟, en: Lu Yuanzhou }
    members: 86000
    youth_wing: { zh: 互助青年, en: Young Mutualists }
    slogan: { zh: 你扶我一把，我拉你一程, en: A hand for a hand }
    policies:
      - { zh: 公共租赁住房每年新建一万套，优先给教师、护士和年轻家庭, en: "Build ten thousand public rental homes a year, first for teachers, nurses and young families" }
      - { zh: 港口、造船和冶炼行业推行行业集体合同, en: "Sector-wide collective agreements in the ports, shipbuilding and smelting" }
      - { zh: 偏远岛屿和内陆牧区的医疗、学校与渡轮由领地兜底, en: "The territory guarantees health care, schools and ferries on the outer islands and inland pastures" }
      - { zh: 退休金与工资同步上调, en: Raise pensions in step with wages }
      - { zh: 以低息贷款支持工人合作社接手无人继承的小企业, en: Cheap loans for workers' cooperatives taking over small firms with no heir }
    allies: [pty_09zrw1, pty_2033kv, pty_z573k7, pty_18qa5s]
    targets: { div_fbfqv9: 23, div_hpmerr: 13, div_nwm019: 16 }
    lean: { manufacturing: 0.4, port: 0.3, shipbuilding: 0.4, mining: 0.3, healthcare: 0.2, old: 1.5, income: -0.3 }
    notes:
      zh: "互助党是北维京岛最大的政党，也是北冰洋和长夏群岛政府的执政伙伴，传统上依靠工会、合作社和老工业城市的选民，主张以集体合同、公共住房和全民医疗把各个行业、各个岛屿的人拉在一起。党名来自北维京岛早年移民之间互相担保借钱、轮流帮忙盖房的「互助会」，党旗上两只相扣的链环就是当年互助会会员证上的图案。在北维京岛的混合选制下，它赢下了大多数选区议席，与绿脉党、罗盘党组成「红绿罗盘」政府，党主席陆远舟出任总督。在北冰洋，它是塔夫鲁利特人民党领导的四党政府中的第二大党；在长夏群岛，它与公地联盟、伊武兰复兴党共同执政。互助党在维京群岛不推候选人，那里的红帆党是它的姊妹党，两党的青年团每年夏天在海底通道两端轮流办营。党内常年争论的话题是：工会的老传统和年轻选民关心的气候与住房，到底谁先谁后。"
      en: "The Mutual Aid Party is the largest party on North Viking Island and a partner in the governments of the Arctic Ocean and the Everlong Summer Islands. It has traditionally drawn on trade unions, cooperatives and the old industrial towns, and seeks to hold every trade and every island together through collective agreements, public housing and universal health care. The name comes from the mutual aid societies of North Viking Island's early settlers, who stood surety for one another's loans and took turns helping to raise each other's houses; the two linked rings on the party flag were the emblem on a society member's card. Under the island's mixed system it wins most of the constituency seats, and it governs with Greenvein and the Compass Party in what people call the red-green compass, with the party chair Lu Yuanzhou as governor. In the Arctic Ocean it is the second party of the four-party government led by the Tavrulit People's Party, and in the Everlong Summer Islands it governs with the Commons Alliance and Ivuran Renewal. It does not stand in the Viking Islands, where Red Sail is its sister party; the two youth wings hold a summer camp each year, at either end of the undersea link in turn. The party's long-running argument is over which comes first, the unions' old causes or the climate and housing that its younger voters care about."
    history:
      zh: "互助党由北维京岛各城市的互助会和造船、港口工会联合组建，是领地议会成立后的第一批政党之一。北冰洋和长夏群岛的支部后来由北维京岛去的工会骨干帮助建立，至今三地仍共用一份党章。"
      en: "The party was formed by the mutual aid societies of North Viking Island's towns together with the shipbuilding and dockers' unions, and was among the first parties of the territorial parliament. Union organisers from North Viking Island later helped found its branches in the Arctic Ocean and the Everlong Summer Islands, and the three still share one party constitution."

  - id: pty_2033kv
    names: { zh: 绿脉党, en: Greenvein }
    short_names: { zh: 绿脉, en: "Greenvein" }
    color: "#2E9E5B"
    flag: { layout: diagonal, colors: ["#2E9E5B", "#1C6B3E"], charge: sprout }
    spectrum: -1.5
    family: { zh: 生态政治, en: Green politics }
    leader: { zh: 英格伦·瓦恩耶尔姆, en: Ingrun Varnhjelm }
    members: 38000
    youth_wing: { zh: 绿芽, en: Greenshoots }
    slogan: { zh: 给苔原和珊瑚一张选票, en: A vote for the moss and the coral }
    policies:
      - { zh: 各领地分阶段停止新开燃煤和燃油电厂，电网全部改用风、水、地热和潮汐, en: "Phase out new coal and oil power in every territory and run the grids on wind, water, geothermal and tide" }
      - { zh: 冻土区和珊瑚礁区的开发项目一律先做长期生态评估, en: Long-term ecological review before any project on permafrost or coral reefs }
      - { zh: 城际铁路和渡轮票价封顶，市内公共交通逐步免费, en: "Cap intercity rail and ferry fares and make city transit free step by step" }
      - { zh: 设立领地级的生物多样性基金，由采矿和航运收入出资, en: A territorial biodiversity fund paid for from mining and shipping revenues }
    allies: [pty_jh513z, pty_fn97vt, pty_09zrw1]
    targets: { div_fbfqv9: 11, div_raat4g: 5, div_hpmerr: 8, div_nwm019: 9 }
    lean: { urban: 0.35, education: 0.4, research: 0.4, young: 2.5, mining: -0.4, conservation: 0.5, tourism: 0.2, income: 0.2 }
    notes:
      zh: "绿脉党是四个领地都有议员候选人的生态政党，名字指叶片上输送养分的叶脉，也指把各地保护区连成一片的生态廊道。它在大学城、科学城和年轻人多的城区得票最高，主张电网完全改用可再生能源、冻土和珊瑚礁开发先做长期评估、公共交通逐步免费。北维京岛和北冰洋的政府里都有它：在北维京岛，它掌管环境与能源部，推动内陆风电场和海上风电并网；在北冰洋，它坚持每一个新矿都要先算清冻土融化的代价，与同在政府里的冶炼工会党经常在内阁会议上争得面红耳赤，两党的部长却是多年的冰钓搭档。在维京群岛的单一选区制下，绿脉党有近半成的选票，却一个议席也拿不到，所以它是群岛改革选举制度最积极的倡导者。党员平均年龄是各党里最低的，党代会开到深夜时，会场外常有人支起帐篷。"
      en: "Greenvein is an ecological party with candidates in all four territories; its name means the veins that carry sap through a leaf, and the wildlife corridors that link the reserves into one. It polls best in the university towns, Science City and young neighbourhoods, and wants grids run entirely on renewables, long-term review before any building on permafrost or reefs, and public transport made free step by step. It sits in the governments of North Viking Island and the Arctic Ocean. On North Viking Island it runs the Ministry of Environment and Energy and has driven the connection of the inland and offshore wind farms; in the Arctic Ocean it insists that every new mine first count the cost of thawing permafrost, which often has it arguing hard in cabinet with the Smelters' Union, also in government, though the two parties' ministers have been ice-fishing partners for years. Under the Viking Islands' single-member seats Greenvein wins nearly one vote in twenty and not one seat, which makes it the loudest voice there for electoral reform. Its members are the youngest of any party, and when its congress runs late into the night tents go up outside the hall."
    history:
      zh: "绿脉党起源于北维京岛科学城研究人员发起的冻土监测网络和北冰洋的苔原保护运动，两股力量在一次反对冰盖边缘露天矿的联合请愿后合并成党。长夏群岛的支部由珊瑚礁潜水员和梯田保护团体建立。"
      en: "Greenvein began with a permafrost monitoring network started by researchers in North Viking Island's Science City and with the Arctic Ocean's tundra conservation movement; the two came together as a party after a joint petition against an open-pit mine at the edge of the ice cap. Its Everlong Summer branch was founded by reef divers and terrace conservation groups."

