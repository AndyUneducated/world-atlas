        lead: pty_6c94cq  # the committee's chair by the coalition's agreement, at even seats with the Commons
        names: { zh: 公社人民代表大会, en: Commune People's Congress }
        mayor: { zh: 管理委员会主任, en: Chair of the Management Committee }
        speaker: { zh: 大会主席, en: President of the Congress }
        notes:
          zh: "埃武托拉公社不设市议会和市长，最高权力机关是公社人民代表大会。代表先在各街区和生产合作社的选民会议上提名，再由全体居民直选；选民随时可以联署罢免自己的代表，公社里管这叫「随叫随走」。代表大会选出公社管理委员会，主任和委员定期向大会述职，大会可以随时改选；委员会下设生产、住房、教育、卫生和财务五个组，委员轮流到各组和各街区蹲点。全体会议每月在公社广场的大棚下开一次，雨季移到粮仓改成的会堂，向全体居民开放，年满十六岁的居民都可以在旁听席上举牌要求发言。预算、税率和住房分配都要经代表大会表决，重大事项还要先交各街区的小组会讨论一轮。"
          en: "Evutola Commune has no city council and no mayor; its highest body is the Commune People's Congress. Delegates are first nominated at the voters' meetings of each neighbourhood and producers' cooperative and then elected by all the residents, and voters may recall their delegate at any time by a petition, which the commune calls 'come when called, go when told'. The congress elects the Commune Management Committee, whose chair and members report to it regularly and can be replaced whenever it likes; the committee works in five groups (production, housing, education, health and finance), and its members take turns spending time in each group and each neighbourhood. The full congress meets once a month under the great awning on Commune Square, moving in the rains to a hall that was once a granary, and its sittings are open to all: any resident aged sixteen or over may raise a card from the public benches and ask to speak. The budget, the tax rate and the allocation of homes all go to the congress's vote, and weighty matters are first talked through at neighbourhood meetings."

