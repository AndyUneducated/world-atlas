    lean: { lat: 0.12, wine: 0.6, cannabis: 0.6, tourism: 0.2, entertainment: 0.3, young: 1.5 }
    notes:
      zh: "加州独立党主张让加利福尼亚脱离美国，成为一个独立的国家。它在初选中得票6.9%，却在众议院和参议院一席也没有：它在每个选区都排第三或更靠后，而前两名初选从不给第三名机会。党员们把这叫作「被联邦制度消音」，民主党人则说这只是数学。\n登记为独立党的选民约有33万人，民调显示其中相当一部分人以为自己勾选的是「无党派」，直到收到党的会费通知才发现。党首朱妮珀·卡洛韦原是葡萄酒博主，她的视频以在酒窖里朗读独立宣言草稿出名；草稿已经改到第四十几版，每一版都比上一版更长。\n独立党的实力集中在北部的酒乡。梅洛特市长麦迪逊·克劳利以55.6%对44.4%击败共和党人当选，是全州唯一的独立党市长；可市议会11席里独立党只占3席，第一大党是有4席的共和党，市长只好和刚被她击败的那个党组成多数，议长也归了共和党。它在北部选民、酒庄与葡萄种植地区、影视和旅游地区最强，在南部最弱；南部的选民普遍认为，北边那些人真正想要的是从南方独立。\n党的独立方案还有一些细节没有解决：独立以后继续使用美元，国防请美国继续负担，联邦的供水工程和救灾拨款照常保留，移民执法则交给新国家自己来管，而且要管得更严。批评者说这不是独立，而是希望美国继续付账、只是不再过问。卡洛韦的回答是，所有伟大的国家起步时都欠过别人的钱。\n独立党已经三次收集到足以发起独立公投的签名，三次都在核验阶段失败，因为州务卿认定其中一半以上的签名出自模型。党把这当成独立的又一条理由，并成立了一个委员会，专门手工核验下一次的签名。\n独立党的文化是酒乡的文化。党的集会在葡萄园里举行，入场送一杯本地红酒，演讲在品酒之后才开始，因此常常比预定时间晚很久。党旗上画着一头熊，党员们说它代表加州不受管束的脾气；反对者指出，这头熊是从一家啤酒公司的商标上描下来的，党的回应是那家啤酒公司也支持独立。党还为未来的国家准备了一首国歌、一部宪法草案和一张钞票设计图，钞票上印着一串葡萄，面值以瓶计算。共和党和它在梅洛特合作执政，但在州议会里从不提独立，双方都假装没听见对方发言里的那一部分；共和党人解释说，他们合作的是葡萄酒，不是独立。"
      en: "The California Independence Party wants California to leave the United States and become a country of its own. It took 6.9% of the primary vote yet holds not one seat in either chamber: it finished third or lower in every district, and the top-two primary never gives the third-placed a chance. Its members call this being ‘silenced by the federal system’; the Democrats say it is only arithmetic.\nSome 330,000 voters are registered with the party, and polls suggest that a good many of them thought they were ticking ‘no party’ until the party’s dues notice arrived. Its leader Juniper Calloway was a wine blogger whose videos of herself reading drafts of a declaration of independence in her cellar made her name; the draft is now somewhere past its fortieth version, each longer than the last.\nThe party’s strength lies in the wine country of the north. The Mayor of Merlotte, Madison Crowley, beat a Republican by 55.6% to 44.4% and is the only Independence mayor in the state; but the party has only 3 of the 11 seats on the City Council, the largest party is the Republicans with 4, and so the mayor governs in a majority with the party she has just beaten, which also has the Speaker. It does best in the north, in the wine and vineyard areas and in film and tourism areas, and worst in the south, where voters generally suspect that what the northerners really want is independence from the south.\nA few details of its plan remain unsettled. After independence the state would keep the US dollar, ask the United States to go on paying for defence, keep the federal water projects and disaster funds, and take immigration enforcement into its own hands, and enforce it harder. Critics say this is not independence but wanting the United States to keep paying the bills and stop asking questions. Calloway’s answer is that every great nation started out owing someone money.\nThree times the party has gathered enough signatures for an independence referendum, and three times they have failed verification, the Secretary of State ruling that more than half were produced by models. The party counts this as one more reason for independence and has set up a committee to check the next batch of signatures by hand.\nIts culture is the culture of wine country. Rallies are held in vineyards, every guest gets a glass of local red, and the speeches start only after the tasting, so they usually run long past schedule. Its flag shows a bear, which members say stands for California’s untameable temper; opponents point out that it was traced from a brewery’s trademark, and the party replies that the brewery supports independence too. The party has also prepared an anthem, a draft constitution and a banknote design for the future country; the note shows a bunch of grapes, with its denominations counted in bottles. The Republicans govern with it in Merlotte, but never mention independence in the State Legislature, and both sides pretend not to hear that part of each other’s speeches; the Republicans explain that what they are working with is the wine, not the independence."
    history:
      zh: "加州独立党由北部酒乡的几位酒庄主、一家独立电影公司和一个徒步俱乐部共同创立，最初只是一场「加州比美国更像一个国家」的文化运动。前两名初选让它进不了议会，它就转而经营地方政治，先在梅洛特站稳了脚跟。"
      en: "The California Independence Party was founded by a few vintners from the northern wine country, an independent film company and a hiking club, and began as a cultural movement holding that California was more of a nation than the United States. Shut out of the Legislature by the top-two primary, it turned to local politics and took root first in Merlotte."
    flag_notes:
      zh: "党旗是白底，下方一道金黄色宽条，白底上一头深红色的熊。熊和金黄色都来自加州的老传统，白色据说是一张还没写字的宪法。党内有人提议把熊换成葡萄藤，被南方的支部否决了。"
      en: "The flag is white over a broad band of gold, with a deep red bear on the white. The bear and the gold come from old Californian tradition; the white, they say, is a constitution not yet written. A motion to swap the bear for a vine was voted down by the southern branches."
    factions:
      - names: { zh: "酒乡派", en: "Wine Country" }
        notes: { zh: "梅洛特和索诺莫尔的酒庄主和旅游业者，主张「深度自治」而不是立刻独立，愿意和任何一个党合作执政，在州里和民主党结盟，在梅洛特和共和党搭伙，是党内唯一真正掌权的一派。", en: "The vintners and tourism people of Merlotte and Sonomore, who favour ‘deep autonomy’ over immediate independence and will govern with any party, allied with the Democrats in the state and partnered with the Republicans in Merlotte; the only wing that actually holds power." }
      - names: { zh: "硬脱离派", en: "Hard Exit" }
        notes: { zh: "主张立刻宣布独立、不再等公投的激进派，多是年轻党员，在网上声势很大，但每次党代会表决都输给酒乡派。", en: "The radicals who want independence declared at once without waiting for a referendum; mostly young and loud online, they lose every convention vote to Wine Country." }
      - names: { zh: "太平洋邦联派", en: "Pacific Confederates" }
        notes: { zh: "认为加州独立以后应该和海上其他岛屿结成邦联的一派，热衷于设计邦联的旗帜和国歌，对具体怎么独立兴趣不大。", en: "A wing that thinks an independent California should join the other islands of the ocean in a confederation; keen on designing its flag and anthem, less so on how independence would actually come about." }
    organisation:
      newspaper: { zh: "《共和国前夜》", en: "Eve of the Republic" }
      think_tank: { zh: "加州主权研究所", en: "California Sovereignty Institute" }
      women: { zh: "独立女性会", en: "Independence Women’s Society" }

  - id: pty_391ngm
    names: { zh: 工人团结党, en: Workers' Solidarity Party, es: Partido Solidaridad Obrera }
    short_names: { zh: 工人团结, en: "Solidarity" }
    color: "#E85D04"
    flag: { layout: banner, colors: ["#E85D04", "#7A1F1F"], division: bordure, charge: wheat, charge_color: "#FFFFFF" }
    spectrum: -2.0
    family: { zh: 地区性劳工左翼, en: Regional labour left }
    ideology: [{ zh: 劳工主义, en: Labourism }, { zh: 民主社会主义, en: Democratic socialism }, { zh: 移民权利, en: Immigrant rights }]
    axes: { econ: 1.5, galtan: 4.5, autonomy: 3.5, green: 4.0 }
    leader: { zh: 玛丽塞拉·伊瓦拉, en: Marisela Ybarra }
    members: 280000
    youth_wing: { zh: 团结青年, en: Solidarity Youth }
    slogan: { zh: 是我们摘的，也该有我们一份, en: "We picked it, so a share is ours" }
    policies:
      - { zh: 农场和仓库的最低工资随杏仁和快递的价格联动, en: Tie the minimum wage on farms and in warehouses to the price of almonds and parcels }
      - { zh: 热浪天农场和仓库必须停工，工资照发, en: "Stop work on farms and in warehouses in a heatwave, on full pay" }
      - { zh: 移民执法人员进入工作场所须出示法院令，并且不得戴面罩, en: "Let immigration agents enter a workplace only with a court warrant, and with their faces uncovered" }
      - { zh: 渴谷每个镇建一座公共净水站，水费按收入计算, en: "Build a public water-treatment station in every town of Thirsty Valley, with charges by income" }
    targets: { div_x2z14w: 9 }
    lean: { "lang:es": 4.5, agriculture: 0.9, food: 0.7, gig: 0.5, residential: 0.3, income: -0.5, luxury: -1.2, ai: -0.6 }
    notes:
      zh: "工人团结党是一个地区性的劳工政党，西班牙语名称是「Partido Solidaridad Obrera」，在中央谷地的农业城镇和失落天使的工人街区以外几乎不推出候选人。党的骨干是农场工人、包装厂工人、仓库工人、厨师和清洁工，大多数党员的母语是西班牙语，党的会议和文件一律同时使用英语和西班牙语。党首玛丽塞拉·伊瓦拉在渴谷的杏仁园里当过多年采摘工，后来组织了谷地第一次包装厂罢工。\n工人团结党全州得票8.9%，但选票集中，在渴谷区拿到46%。它在众议院有2席：渴谷选区以65%对35%击败共和党，萨克拉钱托的堤坝选区以51%对49%险胜共和党。参议院的选区更大，它一席也没拿到，在烟雾谷选区的大选里输给了拔插头联盟。在地方上，它在阿尔蒙多市议会有3席，在萨克拉钱托和莫内特里各有1席；阿尔蒙多的市长选举中，它的候选人进入大选，以40.7%输给了民主党。\n党的主张很具体：最低工资随杏仁和快递的价格联动，热浪天农场和仓库必须停工、工资照发，渴谷每个镇建一座公共净水站。它最尖锐的议题是执法：移民执法人员常常戴着面罩、不出示法院令就闯进农场和厨房，许多街区的警察分局还向街边摊贩收保护费。党在每个镇都设了一条热线，接到电话的志愿者会开车赶到现场，用手机全程录像。\n工人团结党和民主党的关系很别扭：大选只剩民主党和共和党时，它的选民大多投给民主党，民主党也因此习惯把这些票当作自己的。党内常说，民主党记得谷地的时候，只有选举前那一个月。它和拔插头联盟在零工权益上是盟友，在争夺仓库工人的选票时又是对手。对加速党，它的看法很简单：无人工厂和无人农场越多，留在谷地的工人就越穷。\n党的文化生活离不开厨房和广场。每个周日，支部在镇上的广场举办集市，摊贩免费摆摊，乐队演奏传统民谣和谷地自己的劳动歌曲，党员轮流掌勺，给热浪天停工的工人做饭。党报用英语和西班牙语两面印刷，最受欢迎的栏目是「本周罚款榜」，刊登因违反劳动法被罚款的农场和仓库，以及它们拖了多久才缴清罚款。"
      en: "Workers’ Solidarity is a regional labour party, Partido Solidaridad Obrera in Spanish, which stands almost no candidates outside the farm towns of the Central Valley and the working-class neighbourhoods of Lost Angeles. Its backbone is farmworkers, packing-shed workers, warehouse workers, cooks and cleaners; most members speak Spanish as their first language, and its meetings and papers always use English and Spanish together. Its leader Marisela Ybarra picked almonds for many years in Thirsty Valley before organising the valley’s first packing-shed strike.\nThe party won 8.9% across the state, but its vote is concentrated, reaching 46% in the Thirsty Valley district. It holds 2 Assembly seats: Thirsty Valley, won from the Republicans by 65% to 35%, and the Levee district of Sacramoney, held against a Republican by 51% to 49%. The Senate’s larger districts gave it nothing, and in Smogdale it lost the general election to the Unplug League. Locally it has three seats on the Almondo City Council and one each in Sacramoney and Monetary; in Almondo its candidate for mayor reached the general election and lost to the Democrat with 40.7%.\nIts demands are concrete: a minimum wage tied to the price of almonds and parcels, work stopped on farms and in warehouses in a heatwave on full pay, and a public water-treatment station in every town of Thirsty Valley. Its sharpest issue is enforcement: immigration agents often burst into farms and kitchens masked and without a warrant, and in many neighbourhoods the police precincts collect protection money from street vendors. The party runs a hotline in every town, and the volunteer who takes the call drives to the scene and films the whole thing on a phone.\nIts relationship with the Democrats is awkward. When a general election comes down to a Democrat and a Republican, most of its voters back the Democrat, and the Democrats have grown used to treating those votes as their own. In the party they say the Democrats remember the valley for one month, the one before an election. It is the Unplug League’s ally on gig workers’ rights and its rival for warehouse workers’ votes. On the Accelerate Party its view is simple: the more lights-out factories and robot farms there are, the poorer the workers left in the valley.\nIts cultural life revolves around kitchens and plazas. Every Sunday the branches hold a market in the town plaza where vendors trade without fees, bands play folk ballads and the valley’s own work songs, and members take turns cooking for workers sent home in a heatwave. Its paper is printed in English on one side and Spanish on the other, and its most popular column is the weekly fines table, listing the farms and warehouses fined under labour law and how long each took to pay."
    history:
      zh: "工人团结党由渴谷的采摘工互助会和失落天使的厨房工人工会合并而成。两个组织多年来都把票投给民主党，直到一次热浪中谷地连续几天没有停工，州议会却忙着为数据中心减免水费，两边的会员才决定自己组党。"
      en: "Workers’ Solidarity was formed when the pickers’ mutual aid society of Thirsty Valley merged with the kitchen workers’ union of Lost Angeles. Both had voted Democratic for years, until a heatwave in which work in the valley went on day after day while the State Legislature busied itself cutting water charges for data centres; their members then decided to found a party of their own."
    flag_notes:
      zh: "党旗是橙色底、深红色宽边，中间一束白色的麦穗。橙色是谷地日落和采摘工安全背心的颜色，麦穗代表田里的劳动，深红色的边象征把工人围在一起的团结。"
      en: "The flag is orange with a broad deep red border and a white sheaf of wheat in the middle. Orange is the colour of sunset over the valley and of the pickers’ safety vests, the wheat is the work of the fields, and the red border is the solidarity that keeps the workers together."
    factions:
      - names: { zh: "田间派", en: "Field Wing" }
        notes: { zh: "渴谷和果仁区的采摘工、包装厂工人和小农，关心热浪停工、净水和水权，是党的发源地，也掌握着党的两个众议院议席。", en: "Pickers, packing-shed workers and smallholders from Thirsty Valley and the Kernel district, concerned with heatwave stoppages, clean water and water rights; the party’s birthplace, holding both its Assembly seats." }
      - names: { zh: "城市厨房派", en: "Kitchen Wing" }
        notes: { zh: "失落天使的厨师、清洁工、零工和街边摊贩，最关心警察分局收保护费和平台抽成，常与拔插头联盟合作。", en: "Cooks, cleaners, gig workers and street vendors in Lost Angeles, most concerned with the precincts’ protection money and the platforms’ cut, and often working with the Unplug League." }
      - names: { zh: "合作社派", en: "Cooperative Wing" }
        notes: { zh: "主张由工人合作社收购被抛荒的农场和关闭的包装厂，是党内的理论派，党的研究中心和夜校多由这一派主持。", en: "The theorists, who want worker cooperatives to buy up abandoned farms and closed packing sheds; they run most of the party’s policy centre and night schools." }
    organisation:
      newspaper: { zh: "《团结报》", en: "Solidaridad" }
      think_tank: { zh: "农工政策中心", en: "Centre for Farm and Labour Policy" }
      unions: { zh: "田野工人联合会、仓储与厨房工人工会", en: "Field Workers’ Federation, Warehouse and Kitchen Workers’ Union" }
      women: { zh: "劳动妇女会", en: "Working Women’s Council" }

  - id: pty_h0bv4g
    names: { zh: 防火绿党, en: Firebreak Greens, es: Verdes Cortafuegos }
