    lean: { government: 0.3, research: 0.3, education: 0.2, residential: 0.2 }
    notes:
      zh: "罗盘党（简称罗盘）自称「不左不右，只往前」，是一个以规划师、工程师、统计学者和退休公务员为骨干的中间派政党，信奉技术官僚式的治理和循证政策：每一项新法规附带成本收益评估、五年后自动复审，预算按项目公开到每一笔，公务员考试和晋升匿名评审，大型工程先做试点再推广。口号是「先看数据，再定方向」。它的内在矛盾也由此而来：一个号称只看证据的党，终究要在选举里亮出立场，而选民并不总是按成本收益表投票。党内一直有人主张干脆不定意识形态，只公布每个议案的评估结果，让议员自由投票；另一些人则反驳说，不表态本身就是一种表态。\n在北维京岛，罗盘以6.0%的得票拿下91席中的7席，席位不多，却是执政联盟过半数的关键：社会民主互助工党和绿脉党合计41席，加上罗盘的7席才达到48席。它在内阁中只占1个部，由党首程以衡出任公共安全部部长，交换条件是掌管政策和计划委员会，委员会的年度发展报告因此越写越厚，附表比正文还长。罗盘最得意的政绩是让每个新项目都有公开的评估报告，最受批评的是让一些急需的项目在试点阶段停留太久，互助的工会派抱怨它「把住房先试点成了排队名单」。在自由、西北、勒克尔、塔夫鲁普库维克、天城和马斯林山，它也是市政联盟的一员。\n罗盘在北冰洋和长夏群岛也有支部：在长夏群岛，它以3.0%的得票拿到2席，在野；在北冰洋，它2.3%的得票没能跨过门槛，只在努卡塔克市议会有1席。它在维京群岛不推候选人。罗盘的选民集中在行政与公共服务机构多的城区、新建住宅区和科研机构周围，退休公务员和年轻的数据分析师在它的集会上常坐在一起；它没有特别薄弱的地区，也没有一个真正的大本营，得票像一层均匀的薄雾，在北维京岛各市议会里大多只有三五席。\n罗盘的党旗是紫色旗面上的一枚罗盘，紫色由红与蓝调成，表示不站在任何一边。党代会的传统节目是现场考题：每位代表要在十分钟内估算一项领地开支，误差最小的人获赠一只黄铜罗盘。党首程以衡开会从不超时，议程上每一项都标着预计分钟数，超时的发言人要在下一次会议上负责计时；总书记叶安澜则坚持在每次会议结束前留出五分钟，让大家给这次会议本身打分，分数和改进意见会写进下一次会议的议程。"
      en: "The Compass Party (Compass for short) calls itself ‘neither left nor right, only forward’. It is a centrist party built around planners, engineers, statisticians and retired civil servants, committed to technocratic government and evidence-based policy: every new law costed and automatically reviewed after five years, every line of the budget published by project, civil service exams and promotions marked anonymously, and big projects piloted before they are rolled out. Its slogan is ‘Read the data, then set the course.’ Its inner contradiction follows from this: a party that claims to follow only the evidence must still take positions at elections, and voters do not always vote by cost-benefit table. Some members have long wanted the party to drop ideology altogether, publish its assessment of every bill and give its members a free vote; others reply that refusing to take a position is itself a position.\nOn North Viking Island Compass won 7 of the 91 seats on 6.0% of the vote. It is a small group, but it is what carries the government past half: the Social Democratic Mutual Aid Labour Party and Greenvein have 41 seats between them, and Compass’s seven bring the total to 48. It holds just one ministry, Public Security, under its leader Cheng Yiheng, and the price of its support was the Policy and Planning Commission, whose annual development report has grown thicker ever since, its tables now longer than its text. Its proudest achievement is that every new project now comes with a published assessment; the sharpest criticism is that some urgent projects linger too long at the pilot stage, and Mutual Aid’s union wing complains that Compass ‘piloted housing into a waiting list’. It is also part of the governing coalitions in Freedom, Northwest, Lekor, Tavrupukkuvik, Skytown and Maslin Mountain.\nCompass has branches in the Arctic Ocean and the Everlong Summer Islands as well. In the Everlong Summer Islands it won 2 seats on 3.0% of the vote and sits in opposition; in the Arctic Ocean its 2.3% fell short of the threshold, leaving it a single seat on the Nuqattaaq city council. It does not stand in the Viking Islands. Its voters cluster in districts full of government offices and public services, in new housing estates and around research institutes, and retired civil servants and young data analysts often sit side by side at its meetings. It has no especially weak areas but no real heartland either; its vote lies like an even mist, usually worth three to five seats on each North Viking Island council.\nThe flag is a compass on a purple field, purple being red and blue mixed, a sign that the party stands with neither side. A tradition of its congress is the quiz: each delegate has ten minutes to estimate a line of territorial spending, and the closest wins a brass compass. The leader, Cheng Yiheng, never lets a meeting overrun; every agenda item carries an estimated number of minutes, and any speaker who runs over keeps the time at the next meeting. The general secretary, Ye Anlan, insists on five minutes at the end of every meeting for everyone to score the meeting itself, and the scores and suggestions go onto the next agenda."
    history:
      zh: "罗盘党由北维京岛新城和科学城的规划师、工程师发起，起初是一个研究城市规划的学会，在一次关于首府扩建方案的争论后决定参加选举。学会时期的习惯一直保留下来：每份竞选纲领都附有估算表，每次党代会都先报告上一份纲领的兑现情况。后来，北冰洋和长夏群岛的统计人员和公务员也陆续成立了支部。"
      en: "The Compass Party was started by planners and engineers in New City and Science City on North Viking Island as a society for the study of town planning, and decided to stand for election after an argument over how the capital should grow. Habits from those days have stuck: every manifesto comes with a table of costings, and every congress opens with a report on how much of the last manifesto was delivered. Statisticians and civil servants later founded branches in the Arctic Ocean and the Everlong Summer Islands."
    flag_notes:
      zh: "党旗是紫色旗面上的一枚罗盘。紫色由红与蓝调和而成，表示罗盘党不站在左右任何一边，只看指针指向哪里；罗盘则来自学会时期会员证上的标志，也呼应党代会上奖给估算冠军的黄铜罗盘。旗面刻意不加任何文字和装饰，党员说这样「误差最小」。"
      en: "The flag is a compass on a purple field. Purple, the blend of red and blue, says the party sides with neither left nor right and simply follows where the needle points; the compass itself comes from the emblem on the old planning society’s membership card and echoes the brass compass awarded at congress to the best estimator. The field carries no words or ornament at all, which members say keeps ‘the margin of error’ as small as possible."
    factions:
      - names: { zh: "试点派", en: "Pilot Group" }
        notes: { zh: "以规划师和工程师为主，坚持每项政策先做小范围试点、附带成本收益评估，是政策和计划委员会的主要班底，常被社会民主互助工党的工会派批评为拖延。", en: "Mostly planners and engineers, insisting that every policy be piloted on a small scale and costed first. It staffs most of the Policy and Planning Commission, and Mutual Aid’s union wing often accuses it of delay." }
      - names: { zh: "中线俱乐部", en: "Midline Club" }
        notes: { zh: "主张罗盘保持在左右之间的灵活位置，不与任何一方长期绑定，在某些议题上愿意与全领地联邦联盟和灯塔自由民主党合作，在新城和长夏群岛的党员中较有影响。", en: "Wants Compass to keep a flexible position between left and right, tied to no side for good, and is willing to work with the All-Territories Federal Union and the Lighthouse Liberal Democrats on some issues. It is influential among members in New City and the Everlong Summer Islands." }
    organisation:
      newspaper: { zh: "《刻度》", en: "The Gauge" }
      think_tank: { zh: "循证政策中心", en: "Centre for Evidence-Based Policy" }
      unions: { zh: "公共服务专业人员协会", en: "Public Service Professionals’ Association" }
      women: { zh: "罗盘女性圈", en: "Compass Women’s Circle" }

  - id: pty_mak5vy
    names: { zh: 全领地联邦联盟, en: All-Territories Federal Union }
    short_names: { zh: 锚盟, en: "Anchor" }
    color: "#1F4E9E"
    flag: { layout: banner, colors: ["#1F4E9E", "#FFFFFF"], division: bordure, charge: anchor, extra: [{ charge: star5, color: "#FFFFFF", x: 9.5, y: 9.5, size: 6 }, { charge: star5, color: "#FFFFFF", x: 50.5, y: 9.5, size: 6 }, { charge: star5, color: "#FFFFFF", x: 9.5, y: 30.5, size: 6 }, { charge: star5, color: "#FFFFFF", x: 50.5, y: 30.5, size: 6 }] }
    spectrum: 1.0
    family: { zh: 保守派, en: Conservative }
    ideology: [{ zh: 自由保守主义, en: Liberal conservatism }, { zh: 联邦主义, en: Federalism }, { zh: 财政保守主义, en: Fiscal conservatism }]
    axes: { econ: 7.0, galtan: 6.0, autonomy: 4.0, green: 6.5 }
    leader: { zh: 邵承岳, en: Shao Chengyue }
    members: 72000
    youth_wing: { zh: 青锚, en: Young Anchors }
    slogan: { zh: 稳得住，才走得远, en: "Hold fast, go far" }
    policies:
      - { zh: 降低中小企业所得税，取消十几项重复的行业许可, en: "Cut tax on small and medium firms and scrap a dozen overlapping trade licences" }
      - { zh: 领地财政每年留出盈余，建立长期储备基金, en: Run a surplus every year and build a long-term reserve fund }
      - { zh: 家庭第一套住房的首付由领地担保, en: "Territorial guarantees for first-home deposits" }
      - { zh: 加强社区警务和港口安检, en: Strengthen neighbourhood policing and port security }
      - { zh: 中小学增加职业课程，与本地企业合办学徒制, en: "More vocational courses in schools, with apprenticeships run with local firms" }
    allies: [pty_ymxc2s, pty_hwkmx1, pty_x004cm]
    targets: { div_fbfqv9: 21, div_raat4g: 2, div_hpmerr: 10, div_nwm019: 9 }
    lean: { finance: 0.3, commerce: 0.3, trade: 0.3, income: 0.6, old: 1.5, residential: 0.2 }
    notes:
      zh: "全领地联邦联盟（简称锚盟）是北维京岛、北冰洋和长夏群岛的主要中右政党，主张稳健财政、低税、扶持中小企业和家庭置业，也重视社区治安和职业教育。它原名锚联盟，改名是为了把党内越来越重要的联邦主义主张写进名字：各领地应该在财政和规划上有更多自主权，同时守住领地之间共同的市场和规则。新名字也带来一个尴尬：在维京群岛，它只是名义上参选，支部负责人苏一帆领着一支很小的队伍；相近的立场由姊妹党蓝桨保守党代表，锚盟在多数选区让路给蓝桨，只拿到1.9%的选票，一席未得，对手因此常问「全领地」到底全在哪里。党员们则照旧把党叫作「锚盟」，口号「稳得住，才走得远」也没有改。\n在北维京岛，锚盟以21.0%的得票拿下91席中的25席，是领地议会第二大党和主要反对党，党首邵承岳是反对党领袖，他每周在质询时间与总理陆远舟的交锋被电视台做成了收视率不错的节目。它批评「红绿罗盘」政府的住房计划花钱多、进度慢，主张用首付担保代替大量公共建房。在市一级，锚盟在新城市担任市长、与社会民主互助工党共同执政，在贝克勒自由贸易区出任行政长官、与灯塔自由民主党联合执政，在萨科勒、洛龙山和雅利基卢克则是互助领导的市政联盟里的伙伴。在领地议会对垒、在市议会合作，让它的地方干部比领地领导层务实得多。\n在北冰洋，锚盟以6席成为反对派中仅次于金库党的力量；在长夏群岛，它以15席成为最大的反对党，反对党领袖何星河批评公地共产党领导的政府「把明天的钱提前发完了」，主张领地财政每年留出盈余、建立长期储备基金。党内的路线之争主要在财政保守的储备派和关注治安与家庭的街坊保守派之间：前者要求先算清账再谈减税，后者更愿意为社区警务和港口安检多花钱。推动改名的联邦派站在两者之间，提醒大家新名字承诺的是让各领地自己做主。\n锚盟的选民以高收入者、小企业主、专业人士、金融和商贸从业者以及年长的业主为多，在居住区的得票也很稳，低收入地区是它的弱项。贝克勒自由贸易区和新城是它在北维京岛的大本营，它在自贸区立法会47席中占18席。党旗是白边蓝底上的一只白锚，四角各有一颗白色五角星。它有72000名党员，党部的年度募款晚宴总在一艘退役渡轮上举行，开席前由主持人按船上的规矩喊一声「下锚」，全场举杯，晚宴结束时再喊「起锚」，算是为下一次选举送行。"
      en: "The All-Territories Federal Union (Anchor for short) is the main centre-right party of North Viking Island, the Arctic Ocean and the Everlong Summer Islands. It stands for sound finances, low taxes and help for small firms and home-buying families, and puts weight on neighbourhood safety and vocational training. It was once the Anchor Union, and the new name writes in the federalism that has grown ever more important inside the party: each territory should have more say over its own finances and planning while keeping a common market and common rules between them. The name brings an awkwardness too. In the Viking Islands the party stands in little more than name, with a small team under its branch leader  Su Yifan; its sister party, the Blue Oar Conservatives, holds similar ground there, Anchor stands aside for it in most constituencies and took 1.9% of the vote and no seat, and opponents like to ask where exactly ‘All-Territories’ is. Members still call it Anchor, and the slogan, ‘Hold fast, go far’, is unchanged.\nOn North Viking Island Anchor won 25 of the 91 seats on 21.0% of the vote, the second party in parliament and the main opposition, and its leader Shao Chengyue is Leader of the Opposition; his weekly clash at question time with Premier Lu Yuanzhou has become a television programme with respectable ratings. It attacks the red-green compass government’s housing plan as too costly and too slow, and would replace much public building with guaranteed deposits for buyers. At city level Anchor holds the mayoralty of New City, governing with the Social Democratic Mutual Aid Labour Party, and provides the chief executive of the Beckerle Free Trade Zone in coalition with the Lighthouse Liberal Democrats, while in Sakole, Lorond Mountain and Jaalikiluk it is a partner in councils led by Mutual Aid. Fighting in parliament and cooperating in the town hall has made its local officials far more pragmatic than its territorial leadership.\nIn the Arctic Ocean, Anchor’s 6 seats make it the strongest opposition party after the Vault Party. In the Everlong Summer Islands its 15 seats make it the largest opposition party, and the Leader of the Opposition, He Xinghe, accuses the government led by the Commons Communist Party of ‘spending tomorrow’s money today’, calling for a surplus every year and a long-term reserve fund. The party’s main argument runs between the fiscally hawkish Reserve Group, which wants the books balanced before any tax cut, and the Neighbourhood Conservatives, who care about safety and family and are readier to spend on community policing and port security. The federalists who pushed the change of name stand between them, reminding both that the new name promises each territory the right to run its own affairs.\nAnchor’s voters are mostly high earners, small business owners, professionals, people in finance and trade, and older homeowners, and its vote in residential districts is steady; low-income areas are its weak spot. The Beckerle Free Trade Zone and New City are its strongholds on North Viking Island, and it holds 18 of the 47 seats on the zone’s legislative council. Its flag is a white anchor on blue within a white border, with a white five-pointed star in each corner. It has 72,000 members, and its annual fundraising dinner is always held on board a retired ferry: before the meal the host calls ‘Drop anchor!’ in proper shipboard style and the room raises its glasses, and at the end comes ‘Weigh anchor!’, a send-off for the next election."
    history:
      zh: "全领地联邦联盟由北维京岛早期的商会、船东协会和几个地方保守派团体合并而成，原名锚联盟，与社会民主互助工党的前身互助党同为领地议会最早的两大党。北冰洋和长夏群岛的支部由在当地经营的北维京岛企业家牵头组建。随着各地支部要求更多自主，党内的联邦派推动改名，把「全领地」和「联邦」写进党名，但「锚盟」这个简称一直沿用。"
      en: "The All-Territories Federal Union was formed, as the Anchor Union, by merging the early chambers of commerce, the shipowners’ association and several local conservative groups of North Viking Island; with the Mutual Aid Party, forerunner of the Social Democratic Mutual Aid Labour Party, it was one of the two great parties of the first territorial parliament. Its Arctic Ocean and Everlong Summer branches were set up by North Viking Island business people working there. As the branches pressed for more autonomy, the party’s federalists pushed through a new name with ‘All-Territories’ and ‘Federal’ in it, though the short name Anchor has stayed."
    flag_notes:
      zh: "党旗是白边蓝底，中央一只白锚，四角各有一颗白色五角星。白锚寓意「不管风浪多大，船都要先下锚稳住」，蓝色是海，白边象征共同的规则把各地框在一起。四颗星代表四个领地，党内的联邦派把它们看作「全领地」的标志，尽管在维京群岛它多半让姊妹党出面。"
      en: "The flag is blue within a white border, with a white anchor in the centre and a white five-pointed star in each corner. The anchor means ‘however rough the sea, first drop anchor and hold steady’; the blue is the sea, and the white border the common rules that frame the territories together. The four stars stand for the four territories, and the party’s federalists see them as the mark of ‘All-Territories’, even though in the Viking Islands it mostly leaves the standing to its sister party."
    factions:
      - names: { zh: "储备派", en: "Reserve Group" }
        notes: { zh: "财政保守派，主张领地财政每年留出盈余、建立长期储备基金，减税要以收支平衡为前提，以会计师、小企业主和商会成员为主，是长夏群岛反对派批评政府开支的主力。", en: "The fiscal conservatives, who want an annual surplus and a long-term reserve fund and tax cuts only once the books balance. Mostly accountants, small business owners and chamber of commerce members, they lead the opposition’s attack on spending in the Everlong Summer Islands." }
      - names: { zh: "联邦论坛", en: "Federal Forum" }
        notes: { zh: "推动改名的联邦主义者，主张各领地在税收、规划和教育上有更多自主权，同时维护领地之间的共同市场，在北冰洋和长夏群岛的支部中很有影响。", en: "The federalists behind the change of name, who want each territory to have more say over tax, planning and education while keeping a common market between them; they are influential in the Arctic and Everlong Summer branches." }
      - names: { zh: "街坊保守派", en: "Neighbourhood Conservatives" }
        notes: { zh: "关注社区警务、港口安检、家庭置业和职业教育的社会保守派，支持者多为年长业主和居住区居民，在北维京岛的选区议员中很有分量。", en: "Social conservatives focused on community policing, port security, home ownership and vocational training, backed largely by older homeowners and residential districts, and strong among the party’s constituency members on North Viking Island." }
    organisation:
      newspaper: { zh: "《锚报》", en: "The Anchor" }
      think_tank: { zh: "稳健财政研究会", en: "Sound Finance Society" }
      unions: { zh: "中小企业商会联合会、船东协会", en: "Federation of Small Business Chambers, Shipowners’ Association" }
      women: { zh: "锚盟妇女协会", en: "Anchor Women’s Association" }

