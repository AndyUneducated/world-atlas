# Parties: cross-territory first, then each territory's own. family is the party's tradition in a few
# words; notes the card's introduction; history how it came to be (no dates).
parties:
  # ── 跨领地政党 ──
  - id: pty_09zrw1
    names: { zh: 公地共产党, en: Commons Communist Party }
    short_names: { zh: 公地, en: "Commons" }
    color: "#C0392B"
    flag: { layout: banner, colors: ["#C0392B"], charge: hammer_sickle, charge_color: "#F2C230" }
    spectrum: -2.2
    family: { zh: 激进左翼, en: Radical left }
    ideology: [{ zh: 民主社会主义, en: Democratic socialism }, { zh: 改良共产主义, en: Reform communism }, { zh: 合作社主义, en: Cooperativism }, { zh: 生态社会主义, en: Eco-socialism }]
    axes: { econ: 1.5, galtan: 2.0, autonomy: 2.5, green: 3.0 }
    leader: { zh: 梅鲁瓦伊·托兰加姆, en: Meruvai Tolangam }
    members: 64000
    youth_wing: { zh: 公地青年, en: Commons Youth }
    slogan: { zh: 共有的才是长久的, en: What we share is what lasts }
    policies:
      - { zh: 土地继续公有，长期租用的期限和租金由居民议事会公开审定, en: "Keep land in common ownership, with lease terms and rents set openly by residents' councils" }
      - { zh: 全民基本收入随生产率逐年上调, en: Raise the universal basic income every year in step with productivity }
      - { zh: 大型港口、电网和磁浮线路由公共机构持有，职工代表进董事会, en: "Hold the big ports, the grid and the maglev in public hands, with workers on their boards" }
      - { zh: 每个街区设免费的公共食堂和工具图书馆, en: Give every neighbourhood a free canteen and a tool library }
    allies: [pty_jh513z, pty_6c94cq, pty_18qa5s]
    targets: { div_fbfqv9: 4, div_raat4g: 1.5, div_hpmerr: 1.5, div_nwm019: 17.6 }
    lean: { young: 3, urban: 0.3, income: -0.3, manufacturing: 0.3, "status:commune": 1.0, "lang:en": -0.5 }
    notes:
      zh: "公地共产党（简称公地）是四个领地都推出候选人的激进左翼政党，原名公地联盟，名字取自「大家共有、共同照看的土地」。改名时党代会吵了两个通宵：赞成的一方说，土地公有和全民基本收入早已写进长夏群岛的法规，党不该再躲在一个温吞的名字后面；反对的一方担心新名字会吓跑北维京岛的中间选民。最后的折中是在党纲里写明「改良共产主义」：靠选举、议会和合作社一步步扩大公有的部分，而不是推倒重来。党旗随之换成红底上金色的镰刀、锤子和五角星，口号「共有的才是长久的」沿用至今。\n在长夏群岛，公地以17.5%的得票拿下领地议会121席中的23席，是第一大党，党首梅鲁瓦伊·托兰加姆出任总理，议长陈若溪也出自公地。它与社会民主互助工党、伊武兰民族复兴党联合执政，三党合计61席，刚好过半，每逢表决都要把议员一个不落地叫回议事厅，托兰加姆因此被叫作「点名总理」。内阁11个部里公地只占3个，与互助持平，对外事务、财政和司法三个部还交给了无党籍专家，许多设想因此打了折扣：基本收入随生产率上调的公式加进了复兴党要求的地区系数，港口董事会里的职工代表也没达到党纲要求的比例。支持者说这是「把理想折成能通过的条文」，批评者说公地执政越久，越像一个精于算账的社会民主党。总书记伊卢文娜·基拉努尔在党内立了一条规矩：谁提新开支，谁就得同时说明从哪里省。\n公地最微妙的关系在埃武托拉公社。公社人民代表大会55席中，公地和自由公社共产主义运动各占15席，两党共同执政，按联盟协议由公社运动出任管理委员会主任。两党都自称共产主义者，分歧却很深：公地相信公共机构、长期租约和经过议会审定的预算，认为规则写下来才护得住弱者；公社运动主张由街区大会直接决定一切，把常设机构减到最少。在公地干部眼里，公社运动擅长开会，却常在需要有人签字担责时退回大会；在公社运动眼里，公地已经变成了它当初反对的管理者。公社运动在领地议会只有3席，又不在领地政府之内，常从反对席上批评托兰加姆政府的妥协，于是两党在公社里同坐一桌，在领地议会里隔着走道对视。公地党内也有人抱怨：席位相等却让出主任，等于把公社的账本交给了不爱记账的人。\n公地在城市、公社、年轻人和低收入街区最强，制造业城镇也是它的票仓；它在萨伦纳姆、塔卢马兰和乌诺卡里三市担任市长，基拉努特别自治市的行政长官也出自公地；在复兴党执掌的彭纳拉姆、温达坎和基鲁迈联合邦，它则是联合政府里的小伙伴。乡村、高收入地区和英语母语者多的街区是它的短板。出了长夏群岛，它在北维京岛只拿到4.0%的选票，没能跨过门槛，在维京群岛和北冰洋都不到2%，更像读书会和工会之间的一张网。64000名党员以教师、护士、港口工人和大学生为多。党部的会议室晚上常借给合唱团和象棋社；党代会的第一顿饭照例在公共食堂吃，代表们自己洗碗，据说是为了提醒大家：公有的东西也得有人照看。"
      en: "The Commons Communist Party (the Commons for short) is a radical left party with candidates in all four territories. It began as the Commons Alliance, a name taken from the idea of land held and cared for in common. The change of name cost its congress two sleepless nights. Those in favour argued that with public land and a universal basic income long since written into the laws of the Everlong Summer Islands, the party should stop hiding behind a lukewarm name; those against feared it would frighten off the middle-ground voters of North Viking Island. The compromise was to write ‘reform communism’ into the programme: widening what is held in common step by step, through elections, parliament and cooperatives, rather than tearing everything down to start again. The flag became a gold hammer, sickle and star on red; the slogan, ‘What we share is what lasts’, stayed.\nIn the Everlong Summer Islands the Commons won 23 of the Territorial Assembly’s 121 seats on 17.5% of the vote, making it the largest party. Its leader Meruvai Tolangam is Premier, and the Speaker, Chen Ruoxi, is a Commons member too. It governs with the Social Democratic Mutual Aid Labour Party and the Ivuran National Renewal Party; the three hold 61 seats between them, a bare majority, so every vote means calling each member back to the chamber, and Tolangam has become the ‘Roll-Call Premier’. The Commons holds only three of the eleven ministries, the same as Mutual Aid, with External Affairs, Finance and Justice left to non-partisan experts, and much of its programme has been trimmed: the formula linking the basic income to productivity gained a regional weighting at Renewal’s insistence, and worker directors on the port boards still fall short of the share the programme demands. Supporters call this ‘folding ideals into clauses that can pass’; critics say the longer the Commons governs, the more it looks like a social democratic party with a gift for bookkeeping. The general secretary, Iluvenna Kiranur, has laid down a house rule: whoever proposes new spending must say in the same breath where the saving will come from.\nThe party’s most delicate relationship is in Evutola Commune. The Commons and the Libertarian Communist Commune Movement hold 15 seats each in the 55-seat Commune People’s Congress and govern together, and under their coalition agreement the Commune Movement chairs the management committee. Both call themselves communists, yet the gulf between them is wide. The Commons trusts public bodies, long leases and budgets settled by an elected chamber, believing that rules protect the weak only once they are written down; the Commune Movement wants neighbourhood assemblies to decide everything directly and standing institutions kept to a minimum. To Commons officials, the Commune Movement is superb at meetings but tends to retreat into the assembly whenever someone has to sign a decision and answer for it; to the Commune Movement, the Commons has become the very manager it once opposed. With only three seats in the Territorial Assembly and no place in the territorial government, the Commune Movement often attacks the Tolangam government’s compromises from the opposition benches, so the two parties share a table in the commune and eye each other across the aisle in the Assembly. Some in the Commons grumble that giving up the chair on equal seats handed the commune’s ledger to people who dislike keeping accounts.\nThe Commons is strongest in the towns, in the commune, among the young and in low-income neighbourhoods, and manufacturing towns are reliable ground. It holds the mayoralty in Sarunnam, Talumaran and Unokari and the office of Chief Executive in the Special Autonomous City of Kilanu, and is a junior partner in governments led by Renewal such as those of Pennaram, Undakan and the Commonwealth of Kirumai. The countryside, wealthier districts and neighbourhoods with many English speakers are its weak spots. Beyond the Everlong Summer Islands it is a different creature: on North Viking Island it took 4.0% of the vote, short of the threshold, and in the Viking Islands and the Arctic Ocean it wins under 2%, more a web strung between reading circles and trade unions. Its 64,000 members are mostly teachers, nurses, dockers and students. In the evenings its branch rooms are lent to choirs and chess clubs, and the first meal of every congress is eaten in a public canteen, where the delegates wash their own dishes: a reminder, it is said, that whatever is held in common still needs someone to look after it."
    history:
      zh: "公地共产党由长夏群岛的稻农合作社、港口工会和大学里的读书会合并而成，最初叫公地联盟，只在萨伦纳姆和塔卢马兰竞选。土地公有和全民基本收入写进领地法规之后，它的声望迅速扩散，其他三个领地也陆续成立了支部。随着党在长夏群岛进入政府，又在埃武托拉公社与自由公社共产主义运动既合作又竞争，党内要求亮明立场的声音越来越大，最终改用现名，并把「改良共产主义」写进党纲。"
      en: "The Commons Communist Party grew from a merger of the Everlong Summer rice cooperatives, the dockers’ unions and university reading circles. As the Commons Alliance it at first stood only in Sarunnam and Talumaran. Once public land and the basic income were written into the territory’s laws its name spread fast, and branches followed in the other three territories. As the party entered government in the Everlong Summer Islands, and found itself both partner and rival to the Libertarian Communist Commune Movement in Evutola Commune, calls to state its colours plainly grew louder; it took its present name and wrote ‘reform communism’ into its programme."
    flag_notes:
      zh: "党旗是红底上的金色镰刀、锤子和五角星，在党改名时启用。党内通行的解释是：镰刀代表创党时的稻农合作社，锤子代表港口和工厂的工人，五角星代表大学读书会和年轻党员，三股力量合在一起才是「公地」。红色象征共同的劳动与团结，金色象征收成，也象征公共财富要像谷仓一样向所有人敞开。"
      en: "The flag is a gold hammer, sickle and five-pointed star on red, adopted when the party changed its name. The usual reading within the party is that the sickle stands for the rice cooperatives that founded it, the hammer for the dock and factory workers, and the star for the university reading circles and the young; only together do the three make a commons. The red is shared labour and solidarity; the gold is the harvest, and public wealth that should stand open to all like a granary."
    factions:
      - names: { zh: "政务院派", en: "Cabinet Wing" }
        notes: { zh: "围绕总理托兰加姆、各部部长和四位公地市长的执政派，主张守住三党联盟，先保住基本收入和土地租约制度，再一点点扩大公有部分。成员多是部长、市议员和党的干部，被基层戏称为「算盘派」。", en: "The governing wing around Premier Tolangam, the ministers and the party’s four mayors. It wants to hold the three-party coalition together, secure the basic income and the lease system first, then widen public ownership bit by bit. Its members are mostly ministers, councillors and party officials, and the grassroots call it the ‘Abacus Wing’." }
      - names: { zh: "食堂论坛", en: "Canteen Forum" }
        notes: { zh: "以公地青年和街区支部为主，要求公共食堂和工具图书馆尽快铺开，批评联盟妥协太多，主张与自由公社共产主义运动走得更近，在埃武托拉公社的党员中很有影响。", en: "Drawn mainly from Commons Youth and the neighbourhood branches, it wants public canteens and tool libraries rolled out quickly, says the coalition has conceded too much, and favours closer ties with the Libertarian Communist Commune Movement. It carries real weight among members in Evutola Commune." }
      - names: { zh: "码头圈", en: "Dockside Circle" }
        notes: { zh: "由港口工会和制造业工人组成，最关心大型港口、电网和磁浮线路的公有化以及职工代表进董事会，对过快收紧工业排放的生态社会主义主张保持警惕。", en: "Made up of dockers’ unions and manufacturing workers, it cares most about public ownership of the big ports, the grid and the maglev lines, and about worker directors on their boards; it is wary of eco-socialist plans that would tighten industrial emissions too fast." }
    organisation:
      newspaper: { zh: "《公地报》", en: "The Commons" }
      think_tank: { zh: "公共所有研究所", en: "Institute for Common Ownership" }
      unions: { zh: "长夏港口工会、稻农合作社联合会", en: "Everlong Summer Dockers’ Union, Federation of Rice Cooperatives" }
      women: { zh: "公地妇女会", en: "Commons Women’s Council" }

  - id: pty_jh513z
    names: { zh: 社会民主互助工党, en: Social Democratic Mutual Aid Labour Party }
    short_names: { zh: 互助, en: "Mutual Aid" }
    color: "#E4572E"
    flag: { layout: bands, colors: ["#E4572E", "#FFFFFF", "#E4572E"], ratio: [1, 2, 1], charge: links, charge_color: "#E4572E" }
    spectrum: -1.0
    family: { zh: 社会民主, en: Social democratic }
    ideology: [{ zh: 社会民主主义, en: Social democracy }, { zh: 劳工主义, en: Labourism }, { zh: 合作社主义, en: Cooperativism }]
    axes: { econ: 3.0, galtan: 3.5, autonomy: 5.0, green: 4.5 }
    leader: { zh: 陆远舟, en: Lu Yuanzhou }
    members: 86000
    youth_wing: { zh: 互助青年, en: Young Mutualists }
    slogan: { zh: 你扶我一把，我拉你一程, en: A hand for a hand }
    policies:
      - { zh: 公共租赁住房每年新建一万套，优先给教师、护士和年轻家庭, en: "Build ten thousand public rental homes a year, first for teachers, nurses and young families" }
      - { zh: 港口、造船和冶炼行业推行行业集体合同, en: "Sector-wide collective agreements in the ports, shipbuilding and smelting" }
      - { zh: 偏远岛屿和内陆牧区的医疗、学校与渡轮由领地兜底, en: "The territory guarantees health care, schools and ferries on the outer islands and inland pastures" }
      - { zh: 退休金与工资同步上调, en: Raise pensions in step with wages }
      - { zh: 以低息贷款支持工人合作社接手无人继承的小企业, en: Cheap loans for workers' cooperatives taking over small firms with no heir }
    allies: [pty_09zrw1, pty_2033kv, pty_z573k7, pty_18qa5s]
    targets: { div_fbfqv9: 23, div_hpmerr: 13, div_nwm019: 16 }
    lean: { manufacturing: 0.4, port: 0.3, shipbuilding: 0.4, mining: 0.3, healthcare: 0.2, old: 1.5, income: -0.3 }
    notes:
      zh: "社会民主互助工党（简称互助）是以工会、合作社和老工业城市为根基的社会民主政党，主张用行业集体合同、公共租赁住房、全民医疗和与工资同步上调的退休金，把各个行业、各个岛屿的人拉在一起。党名来自北维京岛早年移民之间互相担保借钱、轮流帮忙盖房的「互助会」。它原名互助党，改名时加上「社会民主」和「工」字，党内争了很久：工会出身的老党员坚持写明「工党」，提醒党别忘了船坞和冶炼厂；年轻党员担心这个字让教师、护士和自由职业者觉得被排除在外。最后「工」字留在了名字末尾，口号「你扶我一把，我拉你一程」没有变。\n在北维京岛，互助以23.0%的得票拿下91席中的28席，是领地议会第一大党；靠着选区议席上的优势，它的席位比例明显高于得票。党首陆远舟出任总理，议长许若溪也出自互助。它与绿脉党、罗盘党组成「红绿罗盘」政府，三党合计48席，内阁11个部中互助占6个。推广行业集体合同和兴建公共租赁住房是它最常拿出来的政绩，但每年一万套的目标常被工地、审批和地价拖慢，反对党领袖邵承岳在每周的质询时间里总拿着工程进度表追问。罗盘党要先算成本，绿脉党要先做生态评估，陆远舟自嘲是「三本账一起算的总理」。在市一级，互助在北维京岛的十个市担任市长。\n在北冰洋，互助以8席位列议会第三，是塔夫鲁利特人民党领导的四党政府中的第二大党，掌管2个部，并在努卡塔克、萨尔瓦克、乌库拉克等多个城市和塔夫鲁利特原住民自治区参与执政。在长夏群岛，它以20席位居第二，与公地共产党、伊武兰民族复兴党共同执政，同样掌管3个部，并在米雷兰和瓦利凯担任市长。互助在维京群岛不推候选人，那里独自执政的第一群岛社会民主党是它的姊妹党，两党的青年团每年夏天在海底通道两端轮流办营。三地支部共用一份党章，北冰洋的矿工合同、长夏群岛的合作社贷款和北维京岛的住房方案，常在同一个党内委员会里互相借鉴。\n互助的票仓在港口、造船、冶炼和采矿城镇，在年长选民和低收入家庭中尤其稳固；在勒克尔和洛龙山，它占了市议会三到四成的席位，而高收入者集中的贝克勒自由贸易区则是它的弱项。党内常年争论的是：工会的老传统和年轻选民关心的气候与住房，到底谁先谁后。它的86000名党员里，退休船工和年轻护士常在同一个支部开会；支部会议照例以「互助箱」开场，大家往箱里投零钱或写下需要帮忙的事，散会前当场有人认领。"
      en: "The Social Democratic Mutual Aid Labour Party (Mutual Aid for short) is a social democratic party rooted in the trade unions, the cooperatives and the old industrial towns. It seeks to hold every trade and every island together through sector-wide collective agreements, public rental housing, universal health care and pensions that rise with wages. The name comes from the mutual aid societies of North Viking Island’s early settlers, who stood surety for one another’s loans and took turns raising each other’s houses. It was once simply the Mutual Aid Party, and adding ‘Social Democratic’ and ‘Labour’ took a long quarrel: older members from the unions insisted on ‘Labour’ so the party would never forget the shipyards and smelters, while younger members worried the word would make teachers, nurses and the self-employed feel shut out. In the end ‘Labour’ went at the end of the name, and the slogan, ‘A hand for a hand’, did not change.\nOn North Viking Island Mutual Aid took 28 of the 91 seats on 23.0% of the vote, the largest party in parliament; its strength in the constituency seats gives it a share of seats well above its share of votes. Its leader Lu Yuanzhou is Premier, and the Speaker, Xu Ruoxi, is also from the party. It governs with Greenvein and the Compass Party in what is known as the red-green compass; the three hold 48 seats, and Mutual Aid has six of the eleven ministries. Sector agreements and new public rental homes are the record it points to most often, but the target of ten thousand homes a year keeps slipping behind building sites, permits and land prices, and the opposition leader Shao Chengyue arrives at question time each week with the construction schedule in hand. With Compass wanting everything costed first and Greenvein wanting everything assessed for its ecological impact, Lu calls himself ‘the premier who keeps three sets of books at once’. At city level the party holds the mayoralty in ten towns on North Viking Island.\nIn the Arctic Ocean, Mutual Aid is third in the assembly with 8 seats and the second party of the four-party government led by the Tavrulit People’s Party, running two ministries and sharing power in Nuqattaaq, Saarvaq, Ukkulaaq and several other towns as well as the Tavrulit Indigenous Autonomous Region. In the Everlong Summer Islands it is second with 20 seats, governing with the Commons Communist Party and the Ivuran National Renewal Party, also with three ministries, and it holds the mayoralty of Mirelan and Vallikkai. It does not stand in the Viking Islands, where First Islands Social Democrats, governing alone, are its sister party; the two youth wings hold a summer camp each year at either end of the undersea link in turn. The three branches share one party constitution, and Arctic miners’ contracts, Everlong Summer cooperative loans and North Viking Island housing schemes are often borrowed from one another in the same party committee.\nMutual Aid’s heartlands are the port, shipbuilding, smelting and mining towns, and it is especially secure among older voters and low-income families; in Lekor and Lorond Mountain it holds between a third and two-fifths of the council seats, while the Beckerle Free Trade Zone, home to many high earners, is a weak spot. The party’s perennial argument is over which comes first, the unions’ old causes or the climate and housing its younger voters care about. Among its 86,000 members, retired shipwrights and young nurses often sit in the same branch; branch meetings traditionally open with the ‘mutual aid box’, into which people drop coins or notes saying what help they need, and someone takes each note before the meeting ends."
    history:
      zh: "社会民主互助工党由北维京岛各城市的互助会和造船、港口工会联合组建，原名互助党，是领地议会成立后的第一批政党之一。北冰洋和长夏群岛的支部后来由北维京岛去的工会骨干帮助建立，至今三地仍共用一份党章。随着党在三个领地都进入政府，党内要求在名字里亮明社会民主和劳工立场的呼声越来越高，最终改用现名。"
      en: "The party was formed by the mutual aid societies of North Viking Island’s towns together with the shipbuilding and dockers’ unions. Known at first as the Mutual Aid Party, it was among the first parties of the territorial parliament. Union organisers from North Viking Island later helped found its branches in the Arctic Ocean and the Everlong Summer Islands, and the three still share one party constitution. As it entered government in all three territories, calls to state its social democratic and labour identity in its name grew, and it took its present name."
    flag_notes:
      zh: "党旗是橙红、白、橙红三道横条，中间较宽的白条上是两只相扣的橙红色链环。链环来自早年互助会会员证上的图案，象征两个人互相担保、谁也不放开谁；橙红色是船坞焊花和炉火的颜色，白色代表互助会账本上清清楚楚的每一笔。"
      en: "The flag has three horizontal bands, orange-red, white and orange-red, with two interlocking orange-red links on the broader white band. The links come from the emblem on the early mutual aid societies’ membership cards: two people standing surety for each other, neither letting go. The orange-red is the colour of welding sparks and furnace fire in the shipyards; the white stands for the clean, honest entries in the societies’ ledgers."
    factions:
      - names: { zh: "船坞派", en: "Shipyard Wing" }
        notes: { zh: "以造船、港口和冶炼工会为骨干的传统派，主张行业集体合同、退休金与工资同步上调，对绿脉党的减排时间表和罗盘党的成本评估都心存戒备，在勒克尔和洛龙山的支部中影响很大。", en: "The traditional wing built on the shipbuilding, dock and smelting unions. It champions sector agreements and pensions that rise with wages, is wary of both Greenvein’s emissions timetable and Compass’s cost reviews, and is powerful in the Lekor and Lorond Mountain branches." }
      - names: { zh: "新屋论坛", en: "New Homes Forum" }
        notes: { zh: "由年轻党员、教师和护士组成，把公共租赁住房和气候放在首位，主张与绿脉党结成更紧密的联盟，常批评工会派「只为已经有工作的人说话」。", en: "Younger members, teachers and nurses who put public rental housing and the climate first, want a closer alliance with Greenvein, and often accuse the union wing of ‘speaking only for people who already have jobs’." }
      - names: { zh: "同舟俱乐部", en: "Same Boat Club" }
        notes: { zh: "围绕总理陆远舟和各市市长的务实派，负责维持与绿脉、罗盘以及北冰洋、长夏群岛盟友的联合政府，主张先守住执政再谈理想，常被两翼同时批评为「太会妥协」。", en: "The pragmatists around Premier Lu Yuanzhou and the mayors, who keep the coalitions with Greenvein, Compass and the Arctic and Everlong Summer allies running. They hold that staying in office comes before ideals, and both wings accuse them of being ‘too good at compromise’." }
    organisation:
      newspaper: { zh: "《互助周报》", en: "Mutual Aid Weekly" }
      think_tank: { zh: "担保人研究所", en: "Guarantor Institute" }
      unions: { zh: "造船与港口工人总会、工人合作社联合会", en: "General Union of Shipbuilders and Dockers, Union of Workers’ Cooperatives" }
      women: { zh: "互助妇女联谊会", en: "Mutual Aid Women’s Fellowship" }

  - id: pty_2033kv
    names: { zh: 绿脉党, en: Greenvein }
    short_names: { zh: 绿脉, en: "Greenvein" }
    color: "#2E9E5B"
    flag: { layout: diagonal, colors: ["#2E9E5B", "#1C6B3E"], charge: sprout }
    spectrum: -1.5
    family: { zh: 绿党, en: Green }
    ideology: [{ zh: 生态政治, en: Green politics }, { zh: 绿色左翼, en: Green left }, { zh: 分权主义, en: Decentralism }]
    axes: { econ: 3.0, galtan: 1.5, autonomy: 3.0, green: 0.5 }
    leader: { zh: 英格伦·瓦恩耶尔姆, en: Ingrun Varnhjelm }
    members: 38000
    youth_wing: { zh: 绿芽, en: Greenshoots }
    slogan: { zh: 给苔原和珊瑚一张选票, en: A vote for the moss and the coral }
    policies:
      - { zh: 各领地分阶段停止新开燃煤和燃油电厂，电网全部改用风、水、地热和潮汐, en: "Phase out new coal and oil power in every territory and run the grids on wind, water, geothermal and tide" }
      - { zh: 冻土区和珊瑚礁区的开发项目一律先做长期生态评估, en: Long-term ecological review before any project on permafrost or coral reefs }
      - { zh: 城际铁路和渡轮票价封顶，市内公共交通逐步免费, en: "Cap intercity rail and ferry fares and make city transit free step by step" }
      - { zh: 设立领地级的生物多样性基金，由采矿和航运收入出资, en: A territorial biodiversity fund paid for from mining and shipping revenues }
    allies: [pty_jh513z, pty_fn97vt, pty_09zrw1]
    targets: { div_fbfqv9: 11, div_raat4g: 5, div_hpmerr: 8, div_nwm019: 9 }
    lean: { urban: 0.35, education: 0.4, research: 0.4, young: 2.5, mining: -0.4, conservation: 0.5, tourism: 0.2, income: 0.2 }
    notes:
      zh: "绿脉党（简称绿脉）是四个领地都有候选人的生态政党，名字指叶片上输送养分的叶脉，也指把各地保护区连成一片的生态廊道。它主张分阶段停止新开燃煤和燃油电厂，电网全部改用风、水、地热和潮汐；冻土区和珊瑚礁区的开发项目一律先做长期生态评估；城际铁路和渡轮票价封顶，市内公共交通逐步免费。党内最根本的张力在于：它既是相信科学评估和长远规划的环保党，又是主张权力下放、让村镇和街区自己做主的分权党，而保护区、电网和铁路恰恰需要跨地区的统一规划。口号「给苔原和珊瑚一张选票」，说的是那些自己不会投票的东西也该有人替它们说话。\n在北维京岛，绿脉以11.0%的得票拿下13席，是领地议会第三大党，与社会民主互助工党、罗盘党组成「红绿罗盘」政府，掌管2个部，党首英格伦·瓦恩耶尔姆出任自然资源和环境保护部部长，推动了内陆风电场和海上风电并网。代价是它也得为一些不喜欢的决定投票，比如为了赶住房目标而放宽部分城郊用地，党代会上曾有代表为此当场交还党证。在北冰洋，它以5席进入塔夫鲁利特人民党领导的四党政府，掌管1个部，坚持每一个新矿都要先算清冻土融化的代价，常与同在政府里的冶炼与矿山工会社会主义工人党在内阁会议上争得面红耳赤，两党的部长却是冰钓搭档。在长夏群岛，绿脉有11席，不在领地政府之内，却在米雷兰、萨伦纳姆、塔卢马兰、基拉努和温达坎参与市政。\n绿脉的选民集中在城市、大学城、科学城和年轻人多的城区，在旅游度假地区和收入较高的街区也有不错的得票；乡村、低收入地区和采矿与石料城镇则是它很难打开的地方，那里的人常把「冻土评估」听成「工作没了」。在北维京岛，它在西北、塔夫鲁普库维克和贝克勒自由贸易区的议会各有8席，在洛龙山和马斯林山则只有4席。在维京群岛的单一选区制下，它拿到4.7%的选票，却一个议席也没有，因此成了群岛改革选举制度最积极的倡导者之一。\n绿脉有38000名党员，平均年龄很低，党代会开到深夜时，会场外常有人支起帐篷。青年组织「绿芽」每年夏天组织「廊道步行」，沿着保护区之间的生态走廊连走几天，记下沿途看到的鸟和苔藓，交给党的智库。党首英格伦·瓦恩耶尔姆和总书记王星河分工明确：前者在北维京岛的执政联盟里谈判，后者跑遍四个领地的支部，听嫌政府「太慢」的年轻党员发牢骚。"
      en: "Greenvein is an ecological party with candidates in all four territories. Its name means the veins that carry sap through a leaf, and the wildlife corridors that link the reserves into one. It wants new coal- and oil-fired power stations phased out and grids run entirely on wind, water, geothermal and tidal power; long-term ecological review before any building on permafrost or reefs; capped fares on intercity rail and ferries; and town public transport made free step by step. Its deepest tension is that it is at once an environmental party that trusts scientific assessment and long-range planning, and a decentralist party that wants villages and neighbourhoods to decide for themselves, when reserves, grids and railways are exactly the things that need planning across boundaries. Its slogan, ‘A vote for the moss and the coral’, means that the things that cannot vote deserve someone to speak for them.\nOn North Viking Island Greenvein won 13 seats on 11.0% of the vote, the third party in parliament, and governs with the Social Democratic Mutual Aid Labour Party and the Compass Party in the red-green compass. It holds two ministries, and its leader Ingrun Varnhjelm, as Minister of Natural Resources and Environmental Protection, has driven the connection of the inland and offshore wind farms to the grid. The price is voting for things it dislikes, such as loosening the rules on some land at the edge of towns to keep the housing target on track; at one congress a delegate handed back a membership card on the spot over it. In the Arctic Ocean it holds 5 seats and one ministry in the four-party government led by the Tavrulit People’s Party, and insists that every new mine first count the cost of thawing permafrost, which often has it arguing hard in cabinet with the Smelters’ and Miners’ Union Socialist Workers’ Party, also in government, though the two parties’ ministers are ice-fishing partners. In the Everlong Summer Islands it has 11 seats and sits outside the territorial government, yet shares power in Mirelan, Sarunnam, Talumaran, Kilanu and Undakan.\nGreenvein’s voters are concentrated in the towns, the university towns, Science City and young neighbourhoods, and it does well in holiday resorts and better-off districts. The countryside, low-income areas and mining and quarrying towns are hard ground, where ‘permafrost review’ is often heard as ‘no more jobs’. On North Viking Island it holds 8 seats each on the councils of Northwest, Tavrupukkuvik and the Beckerle Free Trade Zone, but only 4 in Lorond Mountain and Maslin Mountain. Under the Viking Islands’ single-member seats it won 4.7% of the vote and not one seat, which has made it one of the loudest voices there for electoral reform.\nGreenvein has 38,000 members and a young membership; when its congress runs late into the night, tents go up outside the hall. Each summer its youth wing, Greenshoots, organises a corridor walk, several days on foot along the wildlife corridors between the reserves, logging the birds and mosses seen on the way for the party’s think tank. The leader, Ingrun Varnhjelm, and the general secretary, Wang Xinghe, divide the work neatly: she negotiates inside the North Viking Island coalition, while he travels the branches of all four territories, listening to young members who find the government ‘too slow’."
    history:
      zh: "绿脉党起源于北维京岛科学城研究人员发起的冻土监测网络和北冰洋的苔原保护运动，两股力量在一次反对冰盖边缘露天矿的联合请愿后合并成党。长夏群岛的支部由珊瑚礁潜水员和梯田保护团体建立，维京群岛的支部则从沿海居民的海岸保护小组发展而来。进入北维京岛和北冰洋的政府之后，它从请愿者变成了要为风电场和矿山审批签字的执政党。"
      en: "Greenvein began with a permafrost monitoring network started by researchers in North Viking Island’s Science City and with the Arctic Ocean’s tundra conservation movement; the two came together as a party after a joint petition against an open-pit mine at the edge of the ice cap. Its Everlong Summer branch was founded by reef divers and terrace conservation groups, and its Viking Islands branch grew out of coastal residents’ shore protection groups. Entering government on North Viking Island and in the Arctic Ocean turned it from a petitioner into a party that has to sign off wind farms and mines."
    flag_notes:
      zh: "党旗由两种绿色沿对角线斜分，中间是一株嫩芽。浅绿代表苔原、草场和梯田，深绿代表森林和海草，斜分线像一条叶脉，把两种绿色连在一起，这正是党名的由来。嫩芽象征从冻土和礁石缝隙里长出的新生命，也象征党希望政策从基层长起来。"
      en: "The flag is divided diagonally into two greens, with a sprout at its heart. The lighter green stands for tundra, pasture and rice terraces, the darker for forest and seagrass, and the diagonal reads as a leaf vein joining the two, which is where the party’s name comes from. The sprout is new life pushing up through permafrost and reef, and policy that grows from the ground up."
    factions:
      - names: { zh: "廊道派", en: "Corridor Group" }
        notes: { zh: "以科研人员和保护区工作者为主的务实环保派，主张在政府里一项一项推动风电并网和生态评估，愿意为此与工会和矿业妥协，北维京岛和北冰洋的执政党员多属此派。", en: "Pragmatic environmentalists, mostly scientists and reserve staff, who push wind connections and ecological reviews through government one at a time and will compromise with unions and mining to do it. Most of the party’s office-holders on North Viking Island and in the Arctic Ocean belong to it." }
      - names: { zh: "红绿圈", en: "Red-Green Circle" }
        notes: { zh: "绿色左翼，主张把减排和公平绑在一起，要求免费公交、可负担住房和更高的最低收入，与社会民主互助工党和公地共产党走得很近，在长夏群岛支部和大学城里很有影响。", en: "The green left, which ties emissions cuts to fairness through free public transport, affordable housing and a higher minimum income. Close to Mutual Aid and the Commons, it is influential in the Everlong Summer branches and the university towns." }
      - names: { zh: "村社论坛", en: "Village Forum" }
        notes: { zh: "分权派，主张让村镇、街区和原住民社区自己决定开发项目和能源方案，对领地级的统一规划心存疑虑，常与廊道派为电网和风电场建在哪里争论。", en: "The decentralists, who want villages, neighbourhoods and Indigenous communities to decide their own development and energy plans. Suspicious of territory-wide planning, they often clash with the Corridor Group over where grids and wind farms should go." }
    organisation:
      newspaper: { zh: "《叶脉》", en: "The Leaf Vein" }
      think_tank: { zh: "廊道研究所", en: "Corridor Institute" }
      unions: { zh: "可再生能源工人协会、公共交通乘客联合会", en: "Renewable Energy Workers’ Association, Public Transport Riders’ Union" }
      women: { zh: "绿脉女性网络", en: "Greenvein Women’s Network" }

  - id: pty_ymxc2s
    names: { zh: 灯塔自由民主党, en: Lighthouse Liberal Democrats }
    short_names: { zh: 灯塔, en: "Lighthouse" }
    color: "#F2B705"
    flag: { layout: horizon, colors: ["#1C2E4A", "#F2B705", "#FFFFFF"], edge: waves, charge: lighthouse, charge_in: horizon }
    spectrum: 0.5
    family: { zh: 自由派, en: Liberal }
    ideology: [{ zh: 社会自由主义, en: Social liberalism }, { zh: 公民自由主义, en: Civil libertarianism }, { zh: 进步主义, en: Progressivism }]
    axes: { econ: 5.5, galtan: 2.0, autonomy: 5.0, green: 4.5 }
    leader: { zh: 许知微, en: Xu Zhiwei }
    members: 21000
    youth_wing: { zh: 年轻灯塔, en: Young Lighthouse }
    slogan: { zh: 照亮每一条航道, en: Light every channel }
    policies:
      - { zh: 公共数据默认公开，政务院各部的会议纪要一周内上网, en: "Open public data by default and publish every ministry's minutes within a week" }
      - { zh: 简化外来人才的居留和执业资格认定, en: "Simplify residence and professional recognition for people coming from elsewhere" }
      - { zh: 一人公司和小企业前三年减免登记费用, en: Waive registration fees for sole traders and small firms in their first three years }
      - { zh: 中文、英文和本地语言的双语、三语教育从幼儿园开始, en: "Bilingual and trilingual schooling in Chinese, English and the local language from nursery onwards" }
    allies: [pty_ydphtm, pty_mak5vy, pty_fn97vt]
    targets: { div_fbfqv9: 8, div_raat4g: 4, div_hpmerr: 4, div_nwm019: 3 }
    lean: { finance: 0.4, tech: 0.4, digital: 0.3, urban: 0.3, income: 0.5, "lang:en": 1.0, trade: 0.3 }
    notes:
      zh: "灯塔自由民主党（简称灯塔）是一个中间偏右的自由派政党，看重公民自由、政府透明和开放的市场，也支持全民医疗和教育，被对手形容为「左手拿着预算表，右手拿着人权宪章」。它原名灯塔自由党，改名时加上「民主」二字，表示它关心的不只是市场和个人自由，还有政务公开和公民参与。党内的张力正在这里：自贸区的企业家希望它专注减税和简化执照，律师、记者和教师出身的老党员更在乎会议纪要公开和言论自由，两边常为党纲里哪一条排在前面争论不休。它的主张包括公共数据默认公开、政务院各部会议纪要一周内上网、简化外来人才的居留和执业资格认定、一人公司和小企业前三年减免登记费用，以及从幼儿园开始的双语、三语教育。\n在北维京岛，灯塔以8.0%的得票拿下10席，是领地议会第四大党，目前在野。它在透明度问题上常与执政的「红绿罗盘」投同一张票，在税收和营业执照问题上则站到全领地联邦联盟一边，因此两边都想争取它。在贝克勒自由贸易区，它与锚盟共同执政，在自贸区立法会47席中占11席，行政长官由锚盟出任；灯塔在那里推动的一站式执照窗口和中英双语公文，被当地的外籍从业者视为它的招牌政绩，但也有人批评它只顾自贸区，忘了首府以外的小镇。在北冰洋，它以3.7%的得票拿到2席，在帕卢尔尼克金融特区立法会有3席；在长夏群岛，它有3席；在维京群岛的单一选区制下，它3.8%的选票没有换来议席。\n灯塔的选民集中在首府、金融和科技从业者多的城区，以及移民和英语使用者多的街区，收入较高的选民也偏爱它；乡村和低收入地区则几乎是它的空白。在贝克勒以外的北维京岛各市，它通常只有三五个议席，在马斯林山只有2席。它的21000名党员里，律师、程序员和外籍专业人士占了很大比例，党的地方支部常设在咖啡馆楼上，开会时桌上摆着笔记本电脑和法典。\n党的标志是海浪上的一座灯塔，党员见面时爱说「今晚的灯亮着吗」，意思是问对方有没有去参加党部每周四的公开讲座。党首许知微曾是一名海事律师，擅长在辩论中引用法条原文，口头禅是「请把条文念完」。灯塔每年出版一份透明度报告，给政府各部门的信息公开程度打分，得分最低的部门会收到一只坏掉的灯泡；据说曾有一个部门把灯泡挂在自己大门口，表示知耻而后改。"
      en: "The Lighthouse Liberal Democrats (Lighthouse for short) are a liberal party just right of centre, prizing civil liberties, open government and open markets while backing universal health care and education; opponents say they carry a budget sheet in one hand and a charter of rights in the other. The party was once the Lighthouse Liberals, and added ‘Democrats’ to say that it cares not only about markets and personal freedom but about open government and citizens’ participation. That is exactly where its tension lies: entrepreneurs in the free trade zone want it to concentrate on tax cuts and simpler licensing, while older members who came from the law, journalism and teaching care more about published minutes and free speech, and the two sides argue endlessly over which plank should come first. Its programme includes open public data by default, ministry minutes online within a week, simpler residence and professional recognition for skilled incomers, three years’ relief from registration fees for sole traders and small firms, and bilingual or trilingual schooling from nursery onwards.\nOn North Viking Island Lighthouse won 10 seats on 8.0% of the vote, the fourth party in parliament, and is in opposition. It often votes with the governing red-green compass on transparency and sides with the All-Territories Federal Union on tax and business licensing, so both camps court it. In the Beckerle Free Trade Zone it governs with Anchor, holding 11 of the 47 seats in the zone’s legislative council, with Anchor providing the chief executive; the one-stop licensing counter and bilingual Chinese and English paperwork it pushed through there are seen by foreign professionals as its signature achievement, though some say it attends to the zone and forgets the small towns beyond the capital. In the Arctic Ocean it won 2 seats on 3.7% of the vote and has 3 seats on the Pallurniq Financial Zone’s legislative council; in the Everlong Summer Islands it has 3 seats; under the Viking Islands’ single-member seats its 3.8% brought no seat at all.\nLighthouse voters are concentrated in the capitals, in districts full of finance and technology workers, and in neighbourhoods with many incomers and English speakers, and better-off voters lean its way; the countryside and low-income areas are close to blank on its map. Outside Beckerle it usually holds three to five seats on North Viking Island’s councils, and just 2 in Maslin Mountain. Lawyers, programmers and foreign professionals make up a large share of its 21,000 members, and its branches often meet above cafés, with laptops and statute books side by side on the table.\nIts emblem is a lighthouse over the waves, and members greet each other with ‘Is the lamp lit tonight?’, meaning ‘Have you been to the branch’s open lecture on Thursday?’. The leader, Xu Zhiwei, was a maritime lawyer who likes to quote statutes word for word in debate; her catchphrase is ‘Please read the clause to the end.’ Each year the party publishes a transparency report scoring every government department on openness, and the lowest scorer is sent a broken light bulb; one department is said to have hung its bulb above its own front door, as a promise to do better."
    history:
      zh: "灯塔自由民主党由北维京岛的一群律师、记者和大学教师创立，原名灯塔自由党，最早的诉求是让政务院公开会议纪要。贝克勒自由贸易区设立后，它在新来的外籍从业者中迅速扩大，随后在其他三个领地建立了支部。党内主张政务公开和公民参与的一派后来推动改名，在党名里加上「民主」二字，表明它的自由主义不只是市场上的自由。"
      en: "The Lighthouse Liberal Democrats were founded on North Viking Island, as the Lighthouse Liberals, by a group of lawyers, journalists and university teachers whose first demand was that the Executive Council publish its minutes. After the Beckerle Free Trade Zone opened they grew quickly among the professionals who came to work there, and then set up branches in the other three territories. The wing devoted to open government and citizens’ participation later pushed to add ‘Democrats’ to the name, to show that the party’s liberalism was about more than freedom in the market."
    flag_notes:
      zh: "党旗以深蓝、金色和白色构成：上方是夜空，下方是一道起伏的波浪形海平线，一座灯塔立在海天交界处。深蓝象征需要被照亮的黑暗，波浪象征航道上的风险，金色是灯塔射出的光。党员说，灯塔不替船决定去哪里，只让每一条船都看得见礁石，这正是他们理解的公开信息。"
      en: "The flag is made of deep blue, gold and white: a night sky above, a rolling wave-edged horizon below, and a lighthouse standing where sea meets sky. The blue is the darkness that needs lighting, the waves the hazards of the channel, the gold the beam itself. Members say a lighthouse never tells a ship where to go; it only lets every ship see the rocks, which is how they understand open information."
    factions:
      - names: { zh: "宪章派", en: "Charter Group" }
        notes: { zh: "律师、记者和教师出身的公民自由派，最看重言论自由、政务公开和司法独立，是年度透明度报告的主要编写者，在首府的老支部里很有分量。", en: "Civil libertarians from the law, journalism and teaching, who put free speech, open government and judicial independence first. They write most of the annual transparency report and carry weight in the old branches of the capital." }
      - names: { zh: "自贸区俱乐部", en: "Free Zone Club" }
        notes: { zh: "以贝克勒自由贸易区和帕卢尔尼克金融特区的企业家、金融和科技从业者为主，主张减免登记费、简化执照和吸引外来人才，愿意与锚盟长期合作。", en: "Entrepreneurs and finance and technology workers from the Beckerle Free Trade Zone and the Pallurniq Financial Zone, who want lower registration fees, simpler licensing and more skilled incomers, and are happy to work with Anchor for the long term." }
      - names: { zh: "社会自由论坛", en: "Social Liberal Forum" }
        notes: { zh: "主张自由主义也要讲公平，支持全民医疗和多语教育，倾向与「红绿罗盘」政府合作，在长夏群岛和北冰洋的支部较有影响。", en: "Holds that liberalism must also be about fairness, backs universal health care and multilingual schooling, leans towards working with the red-green compass government, and is influential in the Everlong Summer and Arctic branches." }
    organisation:
      newspaper: { zh: "《灯塔评论》", en: "The Lighthouse Review" }
      think_tank: { zh: "航道研究所", en: "Channel Institute" }
      unions: { zh: "独立专业人士协会、小企业主联合会", en: "Association of Independent Professionals, Federation of Small Business Owners" }
      women: { zh: "灯塔女性论坛", en: "Lighthouse Women’s Forum" }

