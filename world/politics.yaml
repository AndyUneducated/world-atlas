    targets: { div_fbfqv9: 23, div_hpmerr: 13, div_nwm019: 16 }
    lean: { manufacturing: 0.4, port: 0.3, shipbuilding: 0.4, mining: 0.3, healthcare: 0.2, old: 1.5, income: -0.3 }
    notes:
      zh: "社会民主互助工党（简称互助）是以工会、合作社和老工业城市为根基的社会民主政党，主张用行业集体合同、公共租赁住房、全民医疗和与工资同步上调的退休金，把各个行业、各个岛屿的人拉在一起。党名来自北维京岛早年移民之间互相担保借钱、轮流帮忙盖房的「互助会」。它原名互助党，改名时加上「社会民主」和「工」字，党内争了很久：工会出身的老党员坚持写明「工党」，提醒党别忘了船坞和冶炼厂；年轻党员担心这个字让教师、护士和自由职业者觉得被排除在外。最后「工」字留在了名字末尾，口号「你扶我一把，我拉你一程」没有变。\n在北维京岛，互助以23.0%的得票拿下91席中的28席，是领地议会第一大党；靠着选区议席上的优势，它的席位比例明显高于得票。党首陆远舟出任总理，议长许若溪也出自互助。它与绿脉党、罗盘党组成「红绿罗盘」政府，三党合计48席，内阁11个部中互助占7个。推广行业集体合同和兴建公共租赁住房是它最常拿出来的政绩，但每年一万套的目标常被工地、审批和地价拖慢，反对党领袖邵承岳在每周的质询时间里总拿着工程进度表追问。罗盘党要先算成本，绿脉党要先做生态评估，陆远舟自嘲是「三本账一起算的总理」。在市一级，互助在北维京岛的十个市担任市长。\n在北冰洋，互助以9席位列议会第三，是塔夫鲁利特人民党领导的四党政府中的第二大党，掌管3个部，并在努卡塔克、萨尔瓦克、乌库拉克等多个城市和塔夫鲁利特原住民自治区参与执政。在长夏群岛，它以20席位居第二，与公地共产党、伊武兰民族复兴党共同执政，同样掌管4个部，并在米雷兰和瓦利凯担任市长。互助在维京群岛不推候选人，那里独自执政的红帆社会民主党是它的姊妹党，两党的青年团每年夏天在海底通道两端轮流办营。三地支部共用一份党章，北冰洋的矿工合同、长夏群岛的合作社贷款和北维京岛的住房方案，常在同一个党内委员会里互相借鉴。\n互助的票仓在港口、造船、冶炼和采矿城镇，在年长选民和低收入家庭中尤其稳固；在勒克尔和洛龙山，它占了市议会约四成的席位，而高收入者集中的贝克勒自由贸易区则是它的弱项。党内常年争论的是：工会的老传统和年轻选民关心的气候与住房，到底谁先谁后。它的86000名党员里，退休船工和年轻护士常在同一个支部开会；支部会议照例以「互助箱」开场，大家往箱里投零钱或写下需要帮忙的事，散会前当场有人认领。"
      en: "The Social Democratic Mutual Aid Labour Party (Mutual Aid for short) is a social democratic party rooted in the trade unions, the cooperatives and the old industrial towns. It seeks to hold every trade and every island together through sector-wide collective agreements, public rental housing, universal health care and pensions that rise with wages. The name comes from the mutual aid societies of North Viking Island’s early settlers, who stood surety for one another’s loans and took turns raising each other’s houses. It was once simply the Mutual Aid Party, and adding ‘Social Democratic’ and ‘Labour’ took a long quarrel: older members from the unions insisted on ‘Labour’ so the party would never forget the shipyards and smelters, while younger members worried the word would make teachers, nurses and the self-employed feel shut out. In the end ‘Labour’ went at the end of the name, and the slogan, ‘A hand for a hand’, did not change.\nOn North Viking Island Mutual Aid took 28 of the 91 seats on 23.0% of the vote, the largest party in parliament; its strength in the constituency seats gives it a share of seats well above its share of votes. Its leader Lu Yuanzhou is Premier, and the Speaker, Xu Ruoxi, is also from the party. It governs with Greenvein and the Compass Party in what is known as the red-green compass; the three hold 48 seats, and Mutual Aid has seven of the eleven ministries. Sector agreements and new public rental homes are the record it points to most often, but the target of ten thousand homes a year keeps slipping behind building sites, permits and land prices, and the opposition leader Shao Chengyue arrives at question time each week with the construction schedule in hand. With Compass wanting everything costed first and Greenvein wanting everything assessed for its ecological impact, Lu calls himself ‘the premier who keeps three sets of books at once’. At city level the party holds the mayoralty in ten towns on North Viking Island.\nIn the Arctic Ocean, Mutual Aid is third in the assembly with 9 seats and the second party of the four-party government led by the Tavrulit People’s Party, running three ministries and sharing power in Nuqattaaq, Saarvaq, Ukkulaaq and several other towns as well as the Tavrulit Indigenous Autonomous Region. In the Everlong Summer Islands it is second with 20 seats, governing with the Commons Communist Party and the Ivuran National Renewal Party, also with four ministries, and it holds the mayoralty of Mirelan and Vallikkai. It does not stand in the Viking Islands, where Red Sail Social Democrats, governing alone, are its sister party; the two youth wings hold a summer camp each year at either end of the undersea link in turn. The three branches share one party constitution, and Arctic miners’ contracts, Everlong Summer cooperative loans and North Viking Island housing schemes are often borrowed from one another in the same party committee.\nMutual Aid’s heartlands are the port, shipbuilding, smelting and mining towns, and it is especially secure among older voters and low-income families; in Lekor and Lorond Mountain it holds around two-fifths of the council seats, while the Beckerle Free Trade Zone, home to many high earners, is a weak spot. The party’s perennial argument is over which comes first, the unions’ old causes or the climate and housing its younger voters care about. Among its 86,000 members, retired shipwrights and young nurses often sit in the same branch; branch meetings traditionally open with the ‘mutual aid box’, into which people drop coins or notes saying what help they need, and someone takes each note before the meeting ends."
    history:
      zh: "社会民主互助工党由北维京岛各城市的互助会和造船、港口工会联合组建，原名互助党，是领地议会成立后的第一批政党之一。北冰洋和长夏群岛的支部后来由北维京岛去的工会骨干帮助建立，至今三地仍共用一份党章。随着党在三个领地都进入政府，党内要求在名字里亮明社会民主和劳工立场的呼声越来越高，最终改用现名。"
      en: "The party was formed by the mutual aid societies of North Viking Island’s towns together with the shipbuilding and dockers’ unions. Known at first as the Mutual Aid Party, it was among the first parties of the territorial parliament. Union organisers from North Viking Island later helped found its branches in the Arctic Ocean and the Everlong Summer Islands, and the three still share one party constitution. As it entered government in all three territories, calls to state its social democratic and labour identity in its name grew, and it took its present name."
    flag_notes:
      zh: "党旗是橙红、白、橙红三道横条，中间较宽的白条上是两只相扣的橙红色链环。链环来自早年互助会会员证上的图案，象征两个人互相担保、谁也不放开谁；橙红色是船坞焊花和炉火的颜色，白色代表互助会账本上清清楚楚的每一笔。"
      en: "The flag has three horizontal bands, orange-red, white and orange-red, with two interlocking orange-red links on the broader white band. The links come from the emblem on the early mutual aid societies’ membership cards: two people standing surety for each other, neither letting go. The orange-red is the colour of welding sparks and furnace fire in the shipyards; the white stands for the clean, honest entries in the societies’ ledgers."
    factions:
      - names: { zh: "船坞派", en: "Shipyard Wing" }
        notes: { zh: "以造船、港口和冶炼工会为骨干的传统派，主张行业集体合同、退休金与工资同步上调，对绿脉党的减排时间表和罗盘党的成本评估都心存戒备，在勒克尔和洛龙山的支部中影响很大。", en: "The traditional wing built on the shipbuilding, dock and smelting unions. It champions sector agreements and pensions that rise with wages, is wary of both Greenvein’s emissions timetable and Compass’s cost reviews, and is powerful in the Lekor and Lorond Mountain branches." }
      - names: { zh: "新屋论坛", en: "New Homes Forum" }
        notes: { zh: "由年轻党员、教师和护士组成，把公共租赁住房和气候放在首位，主张与绿脉党结成更紧密的联盟，常批评工会派「只为已经有工作的人说话」。", en: "Younger members, teachers and nurses who put public rental housing and the climate first, want a closer alliance with Greenvein, and often accuse the union wing of ‘speaking only for people who already have jobs’." }
      - names: { zh: "同舟俱乐部", en: "Same Boat Club" }
        notes: { zh: "围绕总理陆远舟和各市市长的务实派，负责维持与绿脉、罗盘以及北冰洋、长夏群岛盟友的联合政府，主张先守住执政再谈理想，常被两翼同时批评为「太会妥协」。", en: "The pragmatists around Premier Lu Yuanzhou and the mayors, who keep the coalitions with Greenvein, Compass and the Arctic and Everlong Summer allies running. They hold that staying in office comes before ideals, and both wings accuse them of being ‘too good at compromise’." }
    organisation:
      newspaper: { zh: "《互助周报》", en: "Mutual Aid Weekly" }
      think_tank: { zh: "担保人研究所", en: "Guarantor Institute" }
      unions: { zh: "造船与港口工人总会、工人合作社联合会", en: "General Union of Shipbuilders and Dockers, Union of Workers’ Cooperatives" }
      women: { zh: "互助妇女联谊会", en: "Mutual Aid Women’s Fellowship" }

  - id: pty_2033kv
    names: { zh: 绿脉党, en: Greenvein }
    short_names: { zh: 绿脉, en: "Greenvein" }
    color: "#2E9E5B"
    flag: { layout: diagonal, colors: ["#2E9E5B", "#1C6B3E"], charge: sprout }
    spectrum: -1.5
    family: { zh: 绿党, en: Green }
    ideology: [{ zh: 生态政治, en: Green politics }, { zh: 绿色左翼, en: Green left }, { zh: 分权主义, en: Decentralism }]
    axes: { econ: 3.0, galtan: 1.5, autonomy: 3.0, green: 0.5 }
    leader: { zh: 英格伦·瓦恩耶尔姆, en: Ingrun Varnhjelm }
    members: 38000
    youth_wing: { zh: 绿芽, en: Greenshoots }
    slogan: { zh: 给苔原和珊瑚一张选票, en: A vote for the moss and the coral }
    policies:
      - { zh: 各领地分阶段停止新开燃煤和燃油电厂，电网全部改用风、水、地热和潮汐, en: "Phase out new coal and oil power in every territory and run the grids on wind, water, geothermal and tide" }
      - { zh: 冻土区和珊瑚礁区的开发项目一律先做长期生态评估, en: Long-term ecological review before any project on permafrost or coral reefs }
      - { zh: 城际铁路和渡轮票价封顶，市内公共交通逐步免费, en: "Cap intercity rail and ferry fares and make city transit free step by step" }
      - { zh: 设立领地级的生物多样性基金，由采矿和航运收入出资, en: A territorial biodiversity fund paid for from mining and shipping revenues }
    allies: [pty_jh513z, pty_fn97vt, pty_09zrw1]
    targets: { div_fbfqv9: 11, div_raat4g: 5, div_hpmerr: 8, div_nwm019: 9 }
    lean: { urban: 0.35, education: 0.4, research: 0.4, young: 2.5, mining: -0.4, conservation: 0.5, tourism: 0.2, income: 0.2 }
    notes:
      zh: "绿脉党（简称绿脉）是四个领地都有候选人的生态政党，名字指叶片上输送养分的叶脉，也指把各地保护区连成一片的生态廊道。它主张分阶段停止新开燃煤和燃油电厂，电网全部改用风、水、地热和潮汐；冻土区和珊瑚礁区的开发项目一律先做长期生态评估；城际铁路和渡轮票价封顶，市内公共交通逐步免费。党内最根本的张力在于：它既是相信科学评估和长远规划的环保党，又是主张权力下放、让村镇和街区自己做主的分权党，而保护区、电网和铁路恰恰需要跨地区的统一规划。口号「给苔原和珊瑚一张选票」，说的是那些自己不会投票的东西也该有人替它们说话。\n在北维京岛，绿脉以11.0%的得票拿下13席，是领地议会第三大党，与社会民主互助工党、罗盘党组成「红绿罗盘」政府，掌管3个部，其中环境与能源部推动了内陆风电场和海上风电并网。代价是它也得为一些不喜欢的决定投票，比如为了赶住房目标而放宽部分城郊用地，党代会上曾有代表为此当场交还党证。在北冰洋，它以5席进入塔夫鲁利特人民党领导的四党政府，掌管1个部，坚持每一个新矿都要先算清冻土融化的代价，常与同在政府里的冶炼与矿山工会社会主义工人党在内阁会议上争得面红耳赤，两党的部长却是冰钓搭档。在长夏群岛，绿脉有11席，不在领地政府之内，却在米雷兰、萨伦纳姆、塔卢马兰、基拉努和温达坎参与市政。\n绿脉的选民集中在城市、大学城、科学城和年轻人多的城区，在旅游度假地区和收入较高的街区也有不错的得票；乡村、低收入地区和采矿与石料城镇则是它很难打开的地方，那里的人常把「冻土评估」听成「工作没了」。在北维京岛，它在西北、塔夫鲁普库维克和贝克勒自由贸易区的议会各有8席，在洛龙山和马斯林山则只有4席。在维京群岛的单一选区制下，它拿到4.8%的选票，却一个议席也没有，因此成了群岛改革选举制度最积极的倡导者之一。\n绿脉有38000名党员，平均年龄很低，党代会开到深夜时，会场外常有人支起帐篷。青年组织「绿芽」每年夏天组织「廊道步行」，沿着保护区之间的生态走廊连走几天，记下沿途看到的鸟和苔藓，交给党的智库。党首英格伦·瓦恩耶尔姆和总书记王星河分工明确：前者在北维京岛的执政联盟里谈判，后者跑遍四个领地的支部，听嫌政府「太慢」的年轻党员发牢骚。"
      en: "Greenvein is an ecological party with candidates in all four territories. Its name means the veins that carry sap through a leaf, and the wildlife corridors that link the reserves into one. It wants new coal- and oil-fired power stations phased out and grids run entirely on wind, water, geothermal and tidal power; long-term ecological review before any building on permafrost or reefs; capped fares on intercity rail and ferries; and town public transport made free step by step. Its deepest tension is that it is at once an environmental party that trusts scientific assessment and long-range planning, and a decentralist party that wants villages and neighbourhoods to decide for themselves, when reserves, grids and railways are exactly the things that need planning across boundaries. Its slogan, ‘A vote for the moss and the coral’, means that the things that cannot vote deserve someone to speak for them.\nOn North Viking Island Greenvein won 13 seats on 11.0% of the vote, the third party in parliament, and governs with the Social Democratic Mutual Aid Labour Party and the Compass Party in the red-green compass. It holds three ministries, among them Environment and Energy, which has driven the connection of the inland and offshore wind farms to the grid. The price is voting for things it dislikes, such as loosening the rules on some land at the edge of towns to keep the housing target on track; at one congress a delegate handed back a membership card on the spot over it. In the Arctic Ocean it holds 5 seats and one ministry in the four-party government led by the Tavrulit People’s Party, and insists that every new mine first count the cost of thawing permafrost, which often has it arguing hard in cabinet with the Smelters’ and Miners’ Union Socialist Workers’ Party, also in government, though the two parties’ ministers are ice-fishing partners. In the Everlong Summer Islands it has 11 seats and sits outside the territorial government, yet shares power in Mirelan, Sarunnam, Talumaran, Kilanu and Undakan.\nGreenvein’s voters are concentrated in the towns, the university towns, Science City and young neighbourhoods, and it does well in holiday resorts and better-off districts. The countryside, low-income areas and mining and quarrying towns are hard ground, where ‘permafrost review’ is often heard as ‘no more jobs’. On North Viking Island it holds 8 seats each on the councils of Northwest, Tavrupukkuvik and the Beckerle Free Trade Zone, but only 4 in Lorond Mountain and Maslin Mountain. Under the Viking Islands’ single-member seats it won 4.8% of the vote and not one seat, which has made it one of the loudest voices there for electoral reform.\nGreenvein has 38,000 members and a young membership; when its congress runs late into the night, tents go up outside the hall. Each summer its youth wing, Greenshoots, organises a corridor walk, several days on foot along the wildlife corridors between the reserves, logging the birds and mosses seen on the way for the party’s think tank. The leader, Ingrun Varnhjelm, and the general secretary, Wang Xinghe, divide the work neatly: she negotiates inside the North Viking Island coalition, while he travels the branches of all four territories, listening to young members who find the government ‘too slow’."
    history:
      zh: "绿脉党起源于北维京岛科学城研究人员发起的冻土监测网络和北冰洋的苔原保护运动，两股力量在一次反对冰盖边缘露天矿的联合请愿后合并成党。长夏群岛的支部由珊瑚礁潜水员和梯田保护团体建立，维京群岛的支部则从沿海居民的海岸保护小组发展而来。进入北维京岛和北冰洋的政府之后，它从请愿者变成了要为风电场和矿山审批签字的执政党。"
      en: "Greenvein began with a permafrost monitoring network started by researchers in North Viking Island’s Science City and with the Arctic Ocean’s tundra conservation movement; the two came together as a party after a joint petition against an open-pit mine at the edge of the ice cap. Its Everlong Summer branch was founded by reef divers and terrace conservation groups, and its Viking Islands branch grew out of coastal residents’ shore protection groups. Entering government on North Viking Island and in the Arctic Ocean turned it from a petitioner into a party that has to sign off wind farms and mines."
    flag_notes:
      zh: "党旗由两种绿色沿对角线斜分，中间是一株嫩芽。浅绿代表苔原、草场和梯田，深绿代表森林和海草，斜分线像一条叶脉，把两种绿色连在一起，这正是党名的由来。嫩芽象征从冻土和礁石缝隙里长出的新生命，也象征党希望政策从基层长起来。"
      en: "The flag is divided diagonally into two greens, with a sprout at its heart. The lighter green stands for tundra, pasture and rice terraces, the darker for forest and seagrass, and the diagonal reads as a leaf vein joining the two, which is where the party’s name comes from. The sprout is new life pushing up through permafrost and reef, and policy that grows from the ground up."
    factions:
      - names: { zh: "廊道派", en: "Corridor Group" }
        notes: { zh: "以科研人员和保护区工作者为主的务实环保派，主张在政府里一项一项推动风电并网和生态评估，愿意为此与工会和矿业妥协，北维京岛和北冰洋的执政党员多属此派。", en: "Pragmatic environmentalists, mostly scientists and reserve staff, who push wind connections and ecological reviews through government one at a time and will compromise with unions and mining to do it. Most of the party’s office-holders on North Viking Island and in the Arctic Ocean belong to it." }
      - names: { zh: "红绿圈", en: "Red-Green Circle" }
        notes: { zh: "绿色左翼，主张把减排和公平绑在一起，要求免费公交、可负担住房和更高的最低收入，与社会民主互助工党和公地共产党走得很近，在长夏群岛支部和大学城里很有影响。", en: "The green left, which ties emissions cuts to fairness through free public transport, affordable housing and a higher minimum income. Close to Mutual Aid and the Commons, it is influential in the Everlong Summer branches and the university towns." }
      - names: { zh: "村社论坛", en: "Village Forum" }
        notes: { zh: "分权派，主张让村镇、街区和原住民社区自己决定开发项目和能源方案，对领地级的统一规划心存疑虑，常与廊道派为电网和风电场建在哪里争论。", en: "The decentralists, who want villages, neighbourhoods and Indigenous communities to decide their own development and energy plans. Suspicious of territory-wide planning, they often clash with the Corridor Group over where grids and wind farms should go." }
    organisation:
      newspaper: { zh: "《叶脉》", en: "The Leaf Vein" }
      think_tank: { zh: "廊道研究所", en: "Corridor Institute" }
      unions: { zh: "可再生能源工人协会、公共交通乘客联合会", en: "Renewable Energy Workers’ Association, Public Transport Riders’ Union" }
      women: { zh: "绿脉女性网络", en: "Greenvein Women’s Network" }

  - id: pty_ymxc2s
    names: { zh: 灯塔自由民主党, en: Lighthouse Liberal Democrats }
    short_names: { zh: 灯塔, en: "Lighthouse" }
    color: "#F2B705"
    flag: { layout: horizon, colors: ["#1C2E4A", "#F2B705", "#FFFFFF"], edge: waves, charge: lighthouse, charge_in: horizon }
    spectrum: 0.5
    family: { zh: 自由派, en: Liberal }
    ideology: [{ zh: 社会自由主义, en: Social liberalism }, { zh: 公民自由主义, en: Civil libertarianism }, { zh: 进步主义, en: Progressivism }]
    axes: { econ: 5.5, galtan: 2.0, autonomy: 5.0, green: 4.5 }
    leader: { zh: 许知微, en: Xu Zhiwei }
    members: 21000
    youth_wing: { zh: 年轻灯塔, en: Young Lighthouse }
    slogan: { zh: 照亮每一条航道, en: Light every channel }
    policies:
      - { zh: 公共数据默认公开，政务院各部的会议纪要一周内上网, en: "Open public data by default and publish every ministry's minutes within a week" }
      - { zh: 简化外来人才的居留和执业资格认定, en: "Simplify residence and professional recognition for people coming from elsewhere" }
      - { zh: 一人公司和小企业前三年减免登记费用, en: Waive registration fees for sole traders and small firms in their first three years }
      - { zh: 中文、英文和本地语言的双语、三语教育从幼儿园开始, en: "Bilingual and trilingual schooling in Chinese, English and the local language from nursery onwards" }
    allies: [pty_ydphtm, pty_mak5vy, pty_fn97vt]
    targets: { div_fbfqv9: 8, div_raat4g: 4, div_hpmerr: 4, div_nwm019: 3 }
    lean: { finance: 0.4, tech: 0.4, digital: 0.3, urban: 0.3, income: 0.5, "lang:en": 1.0, trade: 0.3 }
    notes:
      zh: "灯塔自由民主党（简称灯塔）是一个中间偏右的自由派政党，看重公民自由、政府透明和开放的市场，也支持全民医疗和教育，被对手形容为「左手拿着预算表，右手拿着人权宪章」。它原名灯塔自由党，改名时加上「民主」二字，表示它关心的不只是市场和个人自由，还有政务公开和公民参与。党内的张力正在这里：自贸区的企业家希望它专注减税和简化执照，律师、记者和教师出身的老党员更在乎会议纪要公开和言论自由，两边常为党纲里哪一条排在前面争论不休。它的主张包括公共数据默认公开、政务院各部会议纪要一周内上网、简化外来人才的居留和执业资格认定、一人公司和小企业前三年减免登记费用，以及从幼儿园开始的双语、三语教育。\n在北维京岛，灯塔以8.0%的得票拿下10席，是领地议会第四大党，目前在野。它在透明度问题上常与执政的「红绿罗盘」投同一张票，在税收和营业执照问题上则站到全领地联邦联盟一边，因此两边都想争取它。在贝克勒自由贸易区，它与锚盟共同执政，在自贸区立法会49席中占11席，行政长官由锚盟出任；灯塔在那里推动的一站式执照窗口和中英双语公文，被当地的外籍从业者视为它的招牌政绩，但也有人批评它只顾自贸区，忘了首府以外的小镇。在北冰洋，它以4.0%的得票拿到2席，在帕卢尔尼克金融特区立法会有3席；在长夏群岛，它有3席；在维京群岛的单一选区制下，它3.8%的选票没有换来议席。\n灯塔的选民集中在首府、金融和科技从业者多的城区，以及移民和英语使用者多的街区，收入较高的选民也偏爱它；乡村和低收入地区则几乎是它的空白。在贝克勒以外的北维京岛各市，它通常只有三五个议席，在马斯林山只有2席。它的21000名党员里，律师、程序员和外籍专业人士占了很大比例，党的地方支部常设在咖啡馆楼上，开会时桌上摆着笔记本电脑和法典。\n党的标志是海浪上的一座灯塔，党员见面时爱说「今晚的灯亮着吗」，意思是问对方有没有去参加党部每周四的公开讲座。党首许知微曾是一名海事律师，擅长在辩论中引用法条原文，口头禅是「请把条文念完」。灯塔每年出版一份透明度报告，给政府各部门的信息公开程度打分，得分最低的部门会收到一只坏掉的灯泡；据说曾有一个部门把灯泡挂在自己大门口，表示知耻而后改。"
      en: "The Lighthouse Liberal Democrats (Lighthouse for short) are a liberal party just right of centre, prizing civil liberties, open government and open markets while backing universal health care and education; opponents say they carry a budget sheet in one hand and a charter of rights in the other. The party was once the Lighthouse Liberals, and added ‘Democrats’ to say that it cares not only about markets and personal freedom but about open government and citizens’ participation. That is exactly where its tension lies: entrepreneurs in the free trade zone want it to concentrate on tax cuts and simpler licensing, while older members who came from the law, journalism and teaching care more about published minutes and free speech, and the two sides argue endlessly over which plank should come first. Its programme includes open public data by default, ministry minutes online within a week, simpler residence and professional recognition for skilled incomers, three years’ relief from registration fees for sole traders and small firms, and bilingual or trilingual schooling from nursery onwards.\nOn North Viking Island Lighthouse won 10 seats on 8.0% of the vote, the fourth party in parliament, and is in opposition. It often votes with the governing red-green compass on transparency and sides with the All-Territories Federal Union on tax and business licensing, so both camps court it. In the Beckerle Free Trade Zone it governs with Anchor, holding 11 of the 49 seats in the zone’s legislative council, with Anchor providing the chief executive; the one-stop licensing counter and bilingual Chinese and English paperwork it pushed through there are seen by foreign professionals as its signature achievement, though some say it attends to the zone and forgets the small towns beyond the capital. In the Arctic Ocean it won 2 seats on 4.0% of the vote and has 3 seats on the Pallurniq Financial Zone’s legislative council; in the Everlong Summer Islands it has 3 seats; under the Viking Islands’ single-member seats its 3.8% brought no seat at all.\nLighthouse voters are concentrated in the capitals, in districts full of finance and technology workers, and in neighbourhoods with many incomers and English speakers, and better-off voters lean its way; the countryside and low-income areas are close to blank on its map. Outside Beckerle it usually holds three to five seats on North Viking Island’s councils, and just 2 in Maslin Mountain. Lawyers, programmers and foreign professionals make up a large share of its 21,000 members, and its branches often meet above cafés, with laptops and statute books side by side on the table.\nIts emblem is a lighthouse over the waves, and members greet each other with ‘Is the lamp lit tonight?’, meaning ‘Have you been to the branch’s open lecture on Thursday?’. The leader, Xu Zhiwei, was a maritime lawyer who likes to quote statutes word for word in debate; her catchphrase is ‘Please read the clause to the end.’ Each year the party publishes a transparency report scoring every government department on openness, and the lowest scorer is sent a broken light bulb; one department is said to have hung its bulb above its own front door, as a promise to do better."
    history:
      zh: "灯塔自由民主党由北维京岛的一群律师、记者和大学教师创立，原名灯塔自由党，最早的诉求是让政务院公开会议纪要。贝克勒自由贸易区设立后，它在新来的外籍从业者中迅速扩大，随后在其他三个领地建立了支部。党内主张政务公开和公民参与的一派后来推动改名，在党名里加上「民主」二字，表明它的自由主义不只是市场上的自由。"
      en: "The Lighthouse Liberal Democrats were founded on North Viking Island, as the Lighthouse Liberals, by a group of lawyers, journalists and university teachers whose first demand was that the Executive Council publish its minutes. After the Beckerle Free Trade Zone opened they grew quickly among the professionals who came to work there, and then set up branches in the other three territories. The wing devoted to open government and citizens’ participation later pushed to add ‘Democrats’ to the name, to show that the party’s liberalism was about more than freedom in the market."
    flag_notes:
      zh: "党旗以深蓝、金色和白色构成：上方是夜空，下方是一道起伏的波浪形海平线，一座灯塔立在海天交界处。深蓝象征需要被照亮的黑暗，波浪象征航道上的风险，金色是灯塔射出的光。党员说，灯塔不替船决定去哪里，只让每一条船都看得见礁石，这正是他们理解的公开信息。"
      en: "The flag is made of deep blue, gold and white: a night sky above, a rolling wave-edged horizon below, and a lighthouse standing where sea meets sky. The blue is the darkness that needs lighting, the waves the hazards of the channel, the gold the beam itself. Members say a lighthouse never tells a ship where to go; it only lets every ship see the rocks, which is how they understand open information."
    factions:
      - names: { zh: "宪章派", en: "Charter Group" }
        notes: { zh: "律师、记者和教师出身的公民自由派，最看重言论自由、政务公开和司法独立，是年度透明度报告的主要编写者，在首府的老支部里很有分量。", en: "Civil libertarians from the law, journalism and teaching, who put free speech, open government and judicial independence first. They write most of the annual transparency report and carry weight in the old branches of the capital." }
      - names: { zh: "自贸区俱乐部", en: "Free Zone Club" }
        notes: { zh: "以贝克勒自由贸易区和帕卢尔尼克金融特区的企业家、金融和科技从业者为主，主张减免登记费、简化执照和吸引外来人才，愿意与锚盟长期合作。", en: "Entrepreneurs and finance and technology workers from the Beckerle Free Trade Zone and the Pallurniq Financial Zone, who want lower registration fees, simpler licensing and more skilled incomers, and are happy to work with Anchor for the long term." }
      - names: { zh: "社会自由论坛", en: "Social Liberal Forum" }
        notes: { zh: "主张自由主义也要讲公平，支持全民医疗和多语教育，倾向与「红绿罗盘」政府合作，在长夏群岛和北冰洋的支部较有影响。", en: "Holds that liberalism must also be about fairness, backs universal health care and multilingual schooling, leans towards working with the red-green compass government, and is influential in the Everlong Summer and Arctic branches." }
    organisation:
      newspaper: { zh: "《灯塔评论》", en: "The Lighthouse Review" }
      think_tank: { zh: "航道研究所", en: "Channel Institute" }
      unions: { zh: "独立专业人士协会、小企业主联合会", en: "Association of Independent Professionals, Federation of Small Business Owners" }
      women: { zh: "灯塔女性论坛", en: "Lighthouse Women’s Forum" }

  - id: pty_ydphtm
    names: { zh: 罗盘党, en: Compass Party }
    short_names: { zh: 罗盘, en: "Compass" }
    color: "#7A5BD6"
    flag: { layout: banner, colors: ["#7A5BD6"], charge: compass }
    spectrum: 0.0
    family: { zh: 中间派, en: Centrist }
    ideology: [{ zh: 中间主义, en: Centrism }, { zh: 技术官僚主义, en: Technocracy }, { zh: 循证政策, en: Evidence-based policy }]
    axes: { econ: 5.0, galtan: 4.5, autonomy: 6.0, green: 5.0 }
    leader: { zh: 程以衡, en: Cheng Yiheng }
    members: 15000
    youth_wing: { zh: 新罗盘, en: New Compass }
    slogan: { zh: 先看数据，再定方向, en: "Read the data, then set the course" }
    policies:
      - { zh: 每一项新法规都附带成本收益评估，五年后自动复审, en: "Attach a cost-benefit review to every new law, with an automatic review after five years" }
      - { zh: 预算按项目公开到每一笔，开放给公众查询, en: "Publish the budget down to every item, open for anyone to search" }
      - { zh: 公务员考试与晋升全部匿名评审, en: Anonymous marking for all civil service examinations and promotions }
      - { zh: 大型工程先做试点，再推广, en: "Pilot big projects before rolling them out" }
    allies: [pty_ymxc2s, pty_jh513z]
    targets: { div_fbfqv9: 6, div_hpmerr: 2.5, div_nwm019: 3 }
    lean: { government: 0.3, research: 0.3, education: 0.2, residential: 0.2 }
    notes:
      zh: "罗盘党（简称罗盘）自称「不左不右，只往前」，是一个以规划师、工程师、统计学者和退休公务员为骨干的中间派政党，信奉技术官僚式的治理和循证政策：每一项新法规附带成本收益评估、五年后自动复审，预算按项目公开到每一笔，公务员考试和晋升匿名评审，大型工程先做试点再推广。口号是「先看数据，再定方向」。它的内在矛盾也由此而来：一个号称只看证据的党，终究要在选举里亮出立场，而选民并不总是按成本收益表投票。党内一直有人主张干脆不定意识形态，只公布每个议案的评估结果，让议员自由投票；另一些人则反驳说，不表态本身就是一种表态。\n在北维京岛，罗盘以6.0%的得票拿下91席中的7席，席位不多，却是执政联盟过半数的关键：社会民主互助工党和绿脉党合计41席，加上罗盘的7席才达到48席。它在内阁中只占1个部，交换条件是掌管政策和计划委员会，委员会的年度发展报告因此越写越厚，附表比正文还长。罗盘最得意的政绩是让每个新项目都有公开的评估报告，最受批评的是让一些急需的项目在试点阶段停留太久，互助的工会派抱怨它「把住房先试点成了排队名单」。在自由、西北、塔夫鲁普库维克、洛龙山、天城和马斯林山，它也是市政联盟的一员。\n罗盘在北冰洋和长夏群岛也有支部：在长夏群岛，它以3.0%的得票拿到2席，在野；在北冰洋，它2.5%的得票没能跨过门槛，只在努卡塔克市议会有1席。它在维京群岛不推候选人。罗盘的选民集中在行政与公共服务机构多的城区、新建住宅区和科研机构周围，退休公务员和年轻的数据分析师在它的集会上常坐在一起；它没有特别薄弱的地区，也没有一个真正的大本营，得票像一层均匀的薄雾，在北维京岛各市议会里大多只有三五席。\n罗盘的党旗是紫色旗面上的一枚罗盘，紫色由红与蓝调成，表示不站在任何一边。党代会的传统节目是现场考题：每位代表要在十分钟内估算一项领地开支，误差最小的人获赠一只黄铜罗盘。党首程以衡开会从不超时，议程上每一项都标着预计分钟数，超时的发言人要在下一次会议上负责计时；总书记叶安澜则坚持在每次会议结束前留出五分钟，让大家给这次会议本身打分，分数和改进意见会写进下一次会议的议程。"
      en: "The Compass Party (Compass for short) calls itself ‘neither left nor right, only forward’. It is a centrist party built around planners, engineers, statisticians and retired civil servants, committed to technocratic government and evidence-based policy: every new law costed and automatically reviewed after five years, every line of the budget published by project, civil service exams and promotions marked anonymously, and big projects piloted before they are rolled out. Its slogan is ‘Read the data, then set the course.’ Its inner contradiction follows from this: a party that claims to follow only the evidence must still take positions at elections, and voters do not always vote by cost-benefit table. Some members have long wanted the party to drop ideology altogether, publish its assessment of every bill and give its members a free vote; others reply that refusing to take a position is itself a position.\nOn North Viking Island Compass won 7 of the 91 seats on 6.0% of the vote. It is a small group, but it is what carries the government past half: the Social Democratic Mutual Aid Labour Party and Greenvein have 41 seats between them, and Compass’s seven bring the total to 48. It holds just one ministry, and the price of its support was the Policy and Planning Commission, whose annual development report has grown thicker ever since, its tables now longer than its text. Its proudest achievement is that every new project now comes with a published assessment; the sharpest criticism is that some urgent projects linger too long at the pilot stage, and Mutual Aid’s union wing complains that Compass ‘piloted housing into a waiting list’. It is also part of the governing coalitions in Freedom, Northwest, Tavrupukkuvik, Lorond Mountain, Skytown and Maslin Mountain.\nCompass has branches in the Arctic Ocean and the Everlong Summer Islands as well. In the Everlong Summer Islands it won 2 seats on 3.0% of the vote and sits in opposition; in the Arctic Ocean its 2.5% fell short of the threshold, leaving it a single seat on the Nuqattaaq city council. It does not stand in the Viking Islands. Its voters cluster in districts full of government offices and public services, in new housing estates and around research institutes, and retired civil servants and young data analysts often sit side by side at its meetings. It has no especially weak areas but no real heartland either; its vote lies like an even mist, usually worth three to five seats on each North Viking Island council.\nThe flag is a compass on a purple field, purple being red and blue mixed, a sign that the party stands with neither side. A tradition of its congress is the quiz: each delegate has ten minutes to estimate a line of territorial spending, and the closest wins a brass compass. The leader, Cheng Yiheng, never lets a meeting overrun; every agenda item carries an estimated number of minutes, and any speaker who runs over keeps the time at the next meeting. The general secretary, Ye Anlan, insists on five minutes at the end of every meeting for everyone to score the meeting itself, and the scores and suggestions go onto the next agenda."
    history:
      zh: "罗盘党由北维京岛新城和科学城的规划师、工程师发起，起初是一个研究城市规划的学会，在一次关于首府扩建方案的争论后决定参加选举。学会时期的习惯一直保留下来：每份竞选纲领都附有估算表，每次党代会都先报告上一份纲领的兑现情况。后来，北冰洋和长夏群岛的统计人员和公务员也陆续成立了支部。"
      en: "The Compass Party was started by planners and engineers in New City and Science City on North Viking Island as a society for the study of town planning, and decided to stand for election after an argument over how the capital should grow. Habits from those days have stuck: every manifesto comes with a table of costings, and every congress opens with a report on how much of the last manifesto was delivered. Statisticians and civil servants later founded branches in the Arctic Ocean and the Everlong Summer Islands."
    flag_notes:
      zh: "党旗是紫色旗面上的一枚罗盘。紫色由红与蓝调和而成，表示罗盘党不站在左右任何一边，只看指针指向哪里；罗盘则来自学会时期会员证上的标志，也呼应党代会上奖给估算冠军的黄铜罗盘。旗面刻意不加任何文字和装饰，党员说这样「误差最小」。"
      en: "The flag is a compass on a purple field. Purple, the blend of red and blue, says the party sides with neither left nor right and simply follows where the needle points; the compass itself comes from the emblem on the old planning society’s membership card and echoes the brass compass awarded at congress to the best estimator. The field carries no words or ornament at all, which members say keeps ‘the margin of error’ as small as possible."
    factions:
      - names: { zh: "试点派", en: "Pilot Group" }
        notes: { zh: "以规划师和工程师为主，坚持每项政策先做小范围试点、附带成本收益评估，是政策和计划委员会的主要班底，常被社会民主互助工党的工会派批评为拖延。", en: "Mostly planners and engineers, insisting that every policy be piloted on a small scale and costed first. It staffs most of the Policy and Planning Commission, and Mutual Aid’s union wing often accuses it of delay." }
      - names: { zh: "中线俱乐部", en: "Midline Club" }
        notes: { zh: "主张罗盘保持在左右之间的灵活位置，不与任何一方长期绑定，在某些议题上愿意与全领地联邦联盟和灯塔自由民主党合作，在新城和长夏群岛的党员中较有影响。", en: "Wants Compass to keep a flexible position between left and right, tied to no side for good, and is willing to work with the All-Territories Federal Union and the Lighthouse Liberal Democrats on some issues. It is influential among members in New City and the Everlong Summer Islands." }
    organisation:
      newspaper: { zh: "《刻度》", en: "The Gauge" }
      think_tank: { zh: "循证政策中心", en: "Centre for Evidence-Based Policy" }
      unions: { zh: "公共服务专业人员协会", en: "Public Service Professionals’ Association" }
      women: { zh: "罗盘女性圈", en: "Compass Women’s Circle" }

  - id: pty_mak5vy
    names: { zh: 全领地联邦联盟, en: All-Territories Federal Union }
    short_names: { zh: 锚盟, en: "Anchor" }
    color: "#1F4E9E"
    flag: { layout: banner, colors: ["#1F4E9E", "#FFFFFF"], division: bordure, charge: anchor, extra: [{ charge: star5, color: "#FFFFFF", x: 9.5, y: 9.5, size: 6 }, { charge: star5, color: "#FFFFFF", x: 50.5, y: 9.5, size: 6 }, { charge: star5, color: "#FFFFFF", x: 9.5, y: 30.5, size: 6 }, { charge: star5, color: "#FFFFFF", x: 50.5, y: 30.5, size: 6 }] }
    spectrum: 1.0
    family: { zh: 保守派, en: Conservative }
    ideology: [{ zh: 自由保守主义, en: Liberal conservatism }, { zh: 联邦主义, en: Federalism }, { zh: 财政保守主义, en: Fiscal conservatism }]
    axes: { econ: 7.0, galtan: 6.0, autonomy: 4.0, green: 6.5 }
    leader: { zh: 邵承岳, en: Shao Chengyue }
    members: 72000
    youth_wing: { zh: 青锚, en: Young Anchors }
    slogan: { zh: 稳得住，才走得远, en: "Hold fast, go far" }
    policies:
      - { zh: 降低中小企业所得税，取消十几项重复的行业许可, en: "Cut tax on small and medium firms and scrap a dozen overlapping trade licences" }
      - { zh: 领地财政每年留出盈余，建立长期储备基金, en: Run a surplus every year and build a long-term reserve fund }
      - { zh: 家庭第一套住房的首付由领地担保, en: "Territorial guarantees for first-home deposits" }
      - { zh: 加强社区警务和港口安检, en: Strengthen neighbourhood policing and port security }
      - { zh: 中小学增加职业课程，与本地企业合办学徒制, en: "More vocational courses in schools, with apprenticeships run with local firms" }
    allies: [pty_ymxc2s, pty_hwkmx1, pty_x004cm]
    targets: { div_fbfqv9: 21, div_hpmerr: 10, div_nwm019: 9 }
    lean: { finance: 0.3, commerce: 0.3, trade: 0.3, income: 0.6, old: 1.5, residential: 0.2 }
    notes:
      zh: "全领地联邦联盟（简称锚盟）是北维京岛、北冰洋和长夏群岛的主要中右政党，主张稳健财政、低税、扶持中小企业和家庭置业，也重视社区治安和职业教育。它原名锚联盟，改名是为了把党内越来越重要的联邦主义主张写进名字：各领地应该在财政和规划上有更多自主权，同时守住领地之间共同的市场和规则。新名字也带来一个尴尬：它在维京群岛并不推候选人，那里由姊妹党蓝桨保守党代表相近的立场，对手因此常问「全领地」到底全在哪里。党员们则照旧把党叫作「锚盟」，口号「稳得住，才走得远」也没有改。\n在北维京岛，锚盟以21.0%的得票拿下91席中的25席，是领地议会第二大党和主要反对党，党首邵承岳是反对党领袖，他每周在质询时间与总理陆远舟的交锋被电视台做成了收视率不错的节目。它批评「红绿罗盘」政府的住房计划花钱多、进度慢，主张用首付担保代替大量公共建房。在市一级，锚盟在新城市担任市长、与社会民主互助工党共同执政，在贝克勒自由贸易区出任行政长官、与灯塔自由民主党联合执政，在萨科勒和雅利基卢克则是互助领导的市政联盟里的伙伴。在领地议会对垒、在市议会合作，让它的地方干部比领地领导层务实得多。\n在北冰洋，锚盟以7席成为反对派中仅次于金库党的力量；在长夏群岛，它以15席成为最大的反对党，反对党领袖何星河批评公地共产党领导的政府「把明天的钱提前发完了」，主张领地财政每年留出盈余、建立长期储备基金。党内的路线之争主要在财政保守的储备派和关注治安与家庭的街坊保守派之间：前者要求先算清账再谈减税，后者更愿意为社区警务和港口安检多花钱。推动改名的联邦派站在两者之间，提醒大家新名字承诺的是让各领地自己做主。\n锚盟的选民以高收入者、小企业主、专业人士、金融和商贸从业者以及年长的业主为多，在居住区的得票也很稳，低收入地区是它的弱项。贝克勒自由贸易区和新城是它在北维京岛的大本营，它在自贸区立法会49席中占20席。党旗是白边蓝底上的一只白锚，四角各有一颗白色五角星。它有72000名党员，党部的年度募款晚宴总在一艘退役渡轮上举行，开席前由主持人按船上的规矩喊一声「下锚」，全场举杯，晚宴结束时再喊「起锚」，算是为下一次选举送行。"
      en: "The All-Territories Federal Union (Anchor for short) is the main centre-right party of North Viking Island, the Arctic Ocean and the Everlong Summer Islands. It stands for sound finances, low taxes and help for small firms and home-buying families, and puts weight on neighbourhood safety and vocational training. It was once the Anchor Union, and the new name writes in the federalism that has grown ever more important inside the party: each territory should have more say over its own finances and planning while keeping a common market and common rules between them. The name brings an awkwardness too, since the party does not stand in the Viking Islands, where its sister party Blue Oar Conservatives holds similar ground, and opponents like to ask where exactly ‘All-Territories’ is. Members still call it Anchor, and the slogan, ‘Hold fast, go far’, is unchanged.\nOn North Viking Island Anchor won 25 of the 91 seats on 21.0% of the vote, the second party in parliament and the main opposition, and its leader Shao Chengyue is Leader of the Opposition; his weekly clash at question time with Premier Lu Yuanzhou has become a television programme with respectable ratings. It attacks the red-green compass government’s housing plan as too costly and too slow, and would replace much public building with guaranteed deposits for buyers. At city level Anchor holds the mayoralty of New City, governing with the Social Democratic Mutual Aid Labour Party, and provides the chief executive of the Beckerle Free Trade Zone in coalition with the Lighthouse Liberal Democrats, while in Sakole and Jaalikiluk it is a partner in councils led by Mutual Aid. Fighting in parliament and cooperating in the town hall has made its local officials far more pragmatic than its territorial leadership.\nIn the Arctic Ocean, Anchor’s 7 seats make it the strongest opposition party after the Vault Party. In the Everlong Summer Islands its 15 seats make it the largest opposition party, and the Leader of the Opposition, He Xinghe, accuses the government led by the Commons Communist Party of ‘spending tomorrow’s money today’, calling for a surplus every year and a long-term reserve fund. The party’s main argument runs between the fiscally hawkish Reserve Group, which wants the books balanced before any tax cut, and the Neighbourhood Conservatives, who care about safety and family and are readier to spend on community policing and port security. The federalists who pushed the change of name stand between them, reminding both that the new name promises each territory the right to run its own affairs.\nAnchor’s voters are mostly high earners, small business owners, professionals, people in finance and trade, and older homeowners, and its vote in residential districts is steady; low-income areas are its weak spot. The Beckerle Free Trade Zone and New City are its strongholds on North Viking Island, and it holds 20 of the 49 seats on the zone’s legislative council. Its flag is a white anchor on blue within a white border, with a white five-pointed star in each corner. It has 72,000 members, and its annual fundraising dinner is always held on board a retired ferry: before the meal the host calls ‘Drop anchor!’ in proper shipboard style and the room raises its glasses, and at the end comes ‘Weigh anchor!’, a send-off for the next election."
    history:
      zh: "全领地联邦联盟由北维京岛早期的商会、船东协会和几个地方保守派团体合并而成，原名锚联盟，与社会民主互助工党的前身互助党同为领地议会最早的两大党。北冰洋和长夏群岛的支部由在当地经营的北维京岛企业家牵头组建。随着各地支部要求更多自主，党内的联邦派推动改名，把「全领地」和「联邦」写进党名，但「锚盟」这个简称一直沿用。"
      en: "The All-Territories Federal Union was formed, as the Anchor Union, by merging the early chambers of commerce, the shipowners’ association and several local conservative groups of North Viking Island; with the Mutual Aid Party, forerunner of the Social Democratic Mutual Aid Labour Party, it was one of the two great parties of the first territorial parliament. Its Arctic Ocean and Everlong Summer branches were set up by North Viking Island business people working there. As the branches pressed for more autonomy, the party’s federalists pushed through a new name with ‘All-Territories’ and ‘Federal’ in it, though the short name Anchor has stayed."
    flag_notes:
      zh: "党旗是白边蓝底，中央一只白锚，四角各有一颗白色五角星。白锚寓意「不管风浪多大，船都要先下锚稳住」，蓝色是海，白边象征共同的规则把各地框在一起。四颗星代表四个领地，党内的联邦派把它们看作「全领地」的标志，尽管在维京群岛是由姊妹党代为参选。"
      en: "The flag is blue within a white border, with a white anchor in the centre and a white five-pointed star in each corner. The anchor means ‘however rough the sea, first drop anchor and hold steady’; the blue is the sea, and the white border the common rules that frame the territories together. The four stars stand for the four territories, and the party’s federalists see them as the mark of ‘All-Territories’, even though in the Viking Islands it is the sister party that stands."
    factions:
      - names: { zh: "储备派", en: "Reserve Group" }
        notes: { zh: "财政保守派，主张领地财政每年留出盈余、建立长期储备基金，减税要以收支平衡为前提，以会计师、小企业主和商会成员为主，是长夏群岛反对派批评政府开支的主力。", en: "The fiscal conservatives, who want an annual surplus and a long-term reserve fund and tax cuts only once the books balance. Mostly accountants, small business owners and chamber of commerce members, they lead the opposition’s attack on spending in the Everlong Summer Islands." }
      - names: { zh: "联邦论坛", en: "Federal Forum" }
        notes: { zh: "推动改名的联邦主义者，主张各领地在税收、规划和教育上有更多自主权，同时维护领地之间的共同市场，在北冰洋和长夏群岛的支部中很有影响。", en: "The federalists behind the change of name, who want each territory to have more say over tax, planning and education while keeping a common market between them; they are influential in the Arctic and Everlong Summer branches." }
      - names: { zh: "街坊保守派", en: "Neighbourhood Conservatives" }
        notes: { zh: "关注社区警务、港口安检、家庭置业和职业教育的社会保守派，支持者多为年长业主和居住区居民，在北维京岛的选区议员中很有分量。", en: "Social conservatives focused on community policing, port security, home ownership and vocational training, backed largely by older homeowners and residential districts, and strong among the party’s constituency members on North Viking Island." }
    organisation:
      newspaper: { zh: "《锚报》", en: "The Anchor" }
      think_tank: { zh: "稳健财政研究会", en: "Sound Finance Society" }
      unions: { zh: "中小企业商会联合会、船东协会", en: "Federation of Small Business Chambers, Shipowners’ Association" }
      women: { zh: "锚盟妇女协会", en: "Anchor Women’s Association" }

  - id: pty_0h5194
    names: { zh: 岛民之声爱国阵线, en: "Islanders' Voice Patriotic Front" }
    short_names: { zh: 岛声, en: "Islanders' Voice" }
    color: "#7B5E3B"
    flag: { layout: bands, colors: ["#7B5E3B", "#F3E9D2"], vertical: true, ratio: [1, 2], charge: horn, charge_band: 1, charge_color: "#7B5E3B" }
    spectrum: 2.8
    family: { zh: 激进右翼, en: Radical right }
    ideology: [{ zh: 右翼民粹主义, en: Right-wing populism }, { zh: 本土主义, en: Nativism }, { zh: 法律与秩序, en: Law and order }]
    axes: { econ: 6.5, galtan: 9.0, autonomy: 7.5, green: 8.5 }
    leader: { zh: 马铁山, en: Ma Tieshan }
    members: 27000
    youth_wing: { zh: 岛民青年之声, en: "Young Islanders' Voice" }
    slogan: { zh: 让岛民自己说话, en: Let islanders speak for themselves }
    policies:
      - { zh: 重大开支和税率调整须经全领地公投, en: "Put major spending and tax changes to a territory-wide referendum" }
      - { zh: 降低燃油税和渡轮票价, en: Cut fuel duty and ferry fares }
      - { zh: 外来人口的年度配额与住房和学位挂钩, en: "Tie the yearly quota of newcomers to the supply of homes and school places" }
      - { zh: 加重对盗窃、破坏公物和醉驾的处罚, en: "Tougher penalties for theft, vandalism and drink-driving" }
      - { zh: 议员薪酬冻结，议员人数减少三成, en: Freeze members' pay and cut the number of members by three-tenths }
    allies: []
    targets: { div_fbfqv9: 7, div_raat4g: 4, div_hpmerr: 6, div_nwm019: 4 }
    lean: { urban: -0.4, income: -0.4, old: 1.0, fishing: 0.3, mining: 0.3, logistics: 0.2, "lang:en": -1.0 }
    notes:
      zh: "岛民之声爱国阵线（简称岛声）是一个右翼民粹政党。它原名岛民之声，改名时加上「爱国阵线」，党内的说法是要把各个领地里觉得自己被首府忽视的人联合成一条阵线；批评者则认为，新名字把一个靠反对燃油税起家的抗议党推得更靠右了。它主张重大开支和税率调整须经全领地公投，降低燃油税和渡轮票价，外来人口的年度配额与住房和学位的供应挂钩，加重对盗窃、破坏公物和醉驾的处罚，并冻结议员薪酬、把议员人数减少三成。党内的张力在于：它一面要把更多决定交给公投，让普通人直接拍板，一面又要加强治安和管理；它的选民里既有想要更少政府的人，也有想要更强政府的人。\n岛声在四个领地都有候选人。在北维京岛，它以7.0%的得票拿下8席；在北冰洋，它以5.9%的得票拿下4席；在长夏群岛，它以4.0%的得票拿下6席；在维京群岛的单一选区制下，它3.8%的选票没有换来议席。它没有友党，也不在任何领地政府之中，它乐于以「唯一真正的反对派」自居。它在议会里的作用更多在于设定议题：燃油税和渡轮票价每次被提上议程，其他政党都得回应它的提案，一些偏远岛屿的渡轮票价补贴就是在它反复质询之后才被政府列入预算的。批评者指责它的配额主张把住房紧张的账算到了外来者头上，它则回答说，自己只是要求人口增长与房子和学位同步。\n岛声的支持者多在偏远渔港、矿区和物流城镇，乡村选民、低收入者和年长选民是它的基本盘，许多人觉得首府的政策离自己很远；大城市、收入较高的街区和英语母语者多的地区则很少投给它。渔港的选民对燃油价格格外敏感，油价一涨，一条渔船整季的辛苦就可能白费，这正是岛声的主张最能打动人的地方。在北维京岛的雅利基卢克市议会，它在23席中占4席；而在维京港这样的大港城，它在53席中只有3席。在长夏群岛，它在基鲁迈、纳卢迈等城市的议会里比在萨伦纳姆更有分量。\n党主席马铁山原是一名长途卡车司机，以在议会里拿出自己的加油小票质询燃油税出名。岛声的竞选集会常在港口的鱼市散场后举行，台下的人一边听一边吃刚出锅的炸鱼。它的议员每月要回到自己的选区开一次「拍桌会」，任何选民都可以当面拍着桌子提意见，议员必须当场记下来，记录本要在下一次拍桌会上念给大家听，没有回音的意见会被红笔圈出来。"
      en: "Islanders’ Voice Patriotic Front (Islanders’ Voice for short) is a right-wing populist party. It was once simply Islanders’ Voice; the party says it added ‘Patriotic Front’ to unite everyone, in every territory, who feels the capital has forgotten them, while critics say the new name pushed a protest party born of a fuel-duty revolt further to the right. It wants referendums across the territory on major spending and tax rates, lower fuel duty and ferry fares, a yearly quota of newcomers tied to the supply of homes and school places, tougher penalties for theft, vandalism and drink-driving, a freeze on members’ pay and a cut of three-tenths in the number of members of parliament. Its tension lies here: it wants more decisions handed to referendums so ordinary people can settle them directly, yet it also wants firmer policing and control, and its voters include both people who want less government and people who want stronger government.\nIslanders’ Voice stands in all four territories. On North Viking Island it won 8 seats on 7.0% of the vote; in the Arctic Ocean, 4 seats on 5.9%; in the Everlong Summer Islands, 6 seats on 4.0%; under the Viking Islands’ single-member seats its 3.8% brought no seat. It has no allied parties and no place in any territorial government, and is happy to call itself ‘the only real opposition’. Its influence in parliament lies mostly in setting the agenda: whenever fuel duty or ferry fares come up, the other parties have to answer its proposals, and some ferry fare subsidies for remote islands found their way into the budget only after its repeated questioning. Critics accuse it of blaming newcomers for the housing shortage with its quota; it replies that it asks only that population grow in step with homes and school places.\nIts supporters are mostly in remote fishing harbours, mining towns and haulage towns; rural voters, people on low incomes and older voters are its core, many of whom feel the capital’s policies are a long way off. Big cities, better-off districts and areas with many native English speakers rarely vote for it. Fishing harbours are acutely sensitive to fuel prices, since one rise can wipe out a boat’s whole season of work, and that is where the party’s message lands hardest. On the Jaalikiluk city council on North Viking Island it holds 4 of the 23 seats, while in a big port such as Viking Port it has just 3 of 53. In the Everlong Summer Islands it carries more weight on councils such as Kirumai and Nalumai than in Sarunnam.\nIts chair, Ma Tieshan, was a long-haul lorry driver and made his name by producing his own fuel receipts in parliament to question the duty. The party’s rallies are often held in a harbour fish market once trading ends, the crowd eating fish fresh from the fryer as they listen. Each of its members of parliament holds a monthly table-thumping meeting back home, where any voter may thump the table and speak their mind and the member must write it all down on the spot; the notebook is read aloud at the next meeting, and any complaint still without an answer is circled in red."
    history:
      zh: "岛民之声爱国阵线起于北维京岛一场反对上调燃油税的车队请愿，参加请愿的卡车司机、渔民和矿工后来组成了政党，最初叫岛民之声，随后在其他领地的渔港和矿区也有了支部。随着它在北维京岛、北冰洋和长夏群岛的议会都拿到议席，党内主张把各地支持者联合成一条阵线的一派占了上风，党名加上了「爱国阵线」。"
      en: "Islanders’ Voice Patriotic Front began with a convoy petition on North Viking Island against a rise in fuel duty; the lorry drivers, fishers and miners who took part went on to form a party, at first called simply Islanders’ Voice, and branches followed in the fishing harbours and mining towns of the other territories. Once it had won seats in the North Viking Island, Arctic Ocean and Everlong Summer parliaments, the wing that wanted to bind its supporters everywhere into a single front won the argument, and ‘Patriotic Front’ was added to the name."
    flag_notes:
      zh: "党旗由褐色和米色两道竖条组成，靠旗杆的褐色条较窄，较宽的米色条上是一只褐色号角。褐色代表渔船的木板、矿区的泥土和卡车的轮胎印，米色代表晒网的沙滩；号角来自车队请愿时司机们一齐鸣笛的场面，意思是让偏远地方的声音也能传到首府。"
      en: "The flag has two vertical bands, a narrower brown one at the hoist and a broader cream one bearing a brown horn. The brown is the planking of fishing boats, the soil of the mines and the tyre tracks of lorries; the cream is the beach where nets are spread to dry. The horn recalls the convoy petition, when the drivers sounded their horns together, and means that voices from remote places should carry all the way to the capital."
    factions:
      - names: { zh: "拍桌派", en: "Table-Thumpers" }
        notes: { zh: "直接民主派，主张重大开支和税率由公投决定、议员薪酬冻结、议员人数减少三成，以「拍桌会」为招牌，代表那些对首府政治感到失望的偏远选民。", en: "The direct democrats, who want major spending and tax rates settled by referendum, members’ pay frozen and the number of members cut by three-tenths. The table-thumping meeting is their trademark, and they speak for remote voters disillusioned with the capital’s politics." }
      - names: { zh: "秩序派", en: "Order Wing" }
        notes: { zh: "主张加重对盗窃、破坏公物和醉驾的处罚，加强社区治安，并把外来人口配额与住房和学位严格挂钩，立场较硬，常被其他政党点名批评。", en: "Wants tougher penalties for theft, vandalism and drink-driving, firmer local policing and a newcomer quota strictly tied to homes and school places. Its harder line draws frequent criticism by name from other parties." }
      - names: { zh: "渔港圈", en: "Harbour Circle" }
        notes: { zh: "以渔民、矿工和物流司机为主，关心燃油税、渡轮票价和偏远岛屿的交通，更像一个经济利益团体，对身份议题兴趣不大，偶尔愿意在具体议题上与其他政党投同一张票。", en: "Mainly fishers, miners and haulage drivers concerned with fuel duty, ferry fares and transport to remote islands. More an economic interest group than an ideological one, it has little interest in identity questions and will occasionally vote with other parties on specific measures." }
    organisation:
      newspaper: { zh: "《拍桌报》", en: "The Table-Thumper" }
      think_tank: { zh: "岛民政策研究会", en: "Islanders’ Policy Society" }
      unions: { zh: "长途货运司机协会、近海渔民联合会", en: "Long-Haul Drivers’ Association, Inshore Fishers’ Union" }
      women: { zh: "岛民妇女之声", en: "Islanders’ Women’s Voice" }

  - id: pty_fn97vt
    names: { zh: 开源党, en: Open Source Party }
    short_names: { zh: 开源, en: "Open Source" }
    color: "#6D6875"
    flag: { layout: banner, colors: ["#3D3A4B"], charge: brackets, charge_color: "#9EF0B5" }
    spectrum: -0.6
    family: { zh: 自由派, en: Liberal }
    ideology: [{ zh: 数字权利, en: Digital rights }, { zh: 开放政府, en: Open government }, { zh: 公民自由主义, en: Civil libertarianism }]
    axes: { econ: 4.0, galtan: 1.0, autonomy: 4.0, green: 4.0 }
    leader: { zh: 利维奥·塞兰迪, en: Livio Serrandi }
    members: 9800
    youth_wing: { zh: 分叉社, en: The Fork }
    slogan: { zh: 公开的代码，公开的政府, en: "Open code, open government" }
    policies:
      - { zh: 政府采购的软件一律开源，源代码公开托管, en: "All software the government buys to be open source, its code published" }
      - { zh: 个人数据未经本人同意不得跨机构共享, en: No sharing of personal data between agencies without consent }
      - { zh: 全民免费的基础宽带和公共算力配额, en: Free basic broadband and a public computing allowance for everyone }
      - { zh: 议会表决记录以机器可读格式实时公开, en: "Publish parliamentary votes live in machine-readable form" }
    allies: [pty_2033kv, pty_ymxc2s]
    targets: { div_fbfqv9: 3, div_raat4g: 1.5, div_hpmerr: 2.6, div_nwm019: 2 }
    lean: { datacenter: 0.6, tech: 0.5, digital: 0.6, young: 3.0, urban: 0.2 }
    notes:
      zh: "开源党把数字权利当作全部政治的起点。它的四条主张——政府采购的软件一律开源、个人数据未经本人同意不得跨机构共享、全民免费的基础宽带和公共算力配额、议会表决记录以机器可读格式实时公开——看似技术细节，背后是一套完整的权力观：政府应当像公开的代码一样谁都能检查，公民的私人生活则应当像加密的文件一样谁也打不开。党内大部分争论就卡在这两半之间。要求政府彻底透明的人和要求数据绝对保密的人常在同一份提案上撞车：公开官员的会面记录算透明，公开来访者的姓名算不算侵犯隐私？主张免费宽带和公共算力的人希望领地出钱建网、建机房，党内的公民自由主义者却担心政府手里的算力越多，监控的本事就越大。党纲在经济上略偏左，社会议题上极其开放，在领地自治与中央统筹之间不愿多表态，党内的说法是「先把接口定义清楚，再谈谁来运行」。\n在北维京岛，开源党在领地议会选举中拿到百分之三的选票，离百分之五的门槛还差一截；在维京群岛的单议席选区里只有百分之一点四，在北冰洋得到百分之二点六，也没有进入议会。它真正坐进议会的地方是长夏群岛，那里的分区比例代表制让它以百分之二的选票拿到一个议席，在一百二十一席里是孤零零的一票，却常在信息公开和数据保护的条款上成为各方争取的对象。长夏群岛的十二个市和公社议会里都有它的议员，北冰洋的图利瓦克市议会里也有两席。它在哪里都不执政，却练出一套在野的本事：把市政预算拆成表格放上网，逐项标注每笔采购用的是开源还是闭源软件，让执政党自己去解释。几座城市的议事规则因此加上了「表决结果当晚公开」的条款，这是它常拿出来说的政绩；批评者则说，它擅长挑错，却从没为一份完整的预算负过责。\n它的选民地图几乎就是一张光纤地图：城市、大学城、数据中心和信息技术企业集中的地方得票高，乡村几乎看不到它。北维京岛的票分散在各个城市，哪里都差一点，岛上的市议会里至今没有它的席位。党内因此把降低门槛列为头号制度议题，常和别的小党一起算账：北维京岛上一次选举中，没跨过门槛的各党加起来拿到了将近四分之一的选票。党名和口号「公开的代码，公开的政府」都取自软件世界的说法，党员说党旗上那对括号中间的空白，是留给每个公民去填写的。\n开源党的政治文化格外出名。党章托管在公开的代码仓库里，任何党员都可以提交修改，经全体投票后合并；党代会的议程也要先「提交」、再「审阅」、最后「合并」。表决软件由党员自己编写、会前公开审计，有人笑说开源党开会一半时间在修投票程序的漏洞。青年组织「分叉社」取名自代码仓库的「分叉」：不同意就另起一支，做得好再合回来。大会闭幕前，总书记方海宁要把本次合并的修改逐条念一遍，念到最后一条，全场齐喊「已合并」。"
      en: "The Open Source Party takes digital rights as the starting point for all of its politics. Its four demands — open-source software for everything the government buys, no sharing of personal data between agencies without consent, free basic broadband and a public computing allowance for all, and parliamentary votes published live in machine-readable form — look like technicalities, but they rest on a whole view of power: government should be open to inspection like public code, while a citizen's private life should be as sealed as an encrypted file. Most of the party's arguments sit on the seam between those two halves. Members who want total transparency in government and members who want absolute secrecy for personal data often collide over the same motion: publishing officials' meeting logs is transparency, but is publishing the names of their visitors an invasion of privacy? Those who want free broadband and public computing would have the territory pay for networks and server halls, while the party's civil libertarians worry that the more computing power a government holds, the better it gets at surveillance. The programme leans slightly left on economics, is thoroughly open on social questions and says little about home rule versus central coordination; as members put it, define the interface first, then argue about who runs it.\nIn North Viking Island the party took three per cent at the territorial election, well short of the five-per-cent threshold; in the Viking Islands' single-member seats it won 1.4 per cent, and in the Arctic Ocean 2.6 per cent, again without entering parliament. The one parliament it actually sits in is the Everlong Summer Islands', where regional proportional representation turned two per cent of the vote into a seat: a lone vote among 121, but one the other parties often court on clauses about freedom of information and data protection. It has councillors on all twelve city and commune councils of the Everlong Summer Islands, and two seats on Tullivaq's council in the Arctic Ocean. It governs nowhere, but it has learned the craft of opposition: it breaks municipal budgets into spreadsheets, posts them online and marks every purchase as open or closed software, leaving the governing parties to explain themselves. Several councils have since added a rule that results are published the same evening, an achievement it likes to cite; critics reply that it is good at finding faults but has never had to answer for a whole budget.\nIts electoral map is practically a fibre-optic map: strong in cities, university towns and places full of data centres and IT firms, nearly invisible in the countryside. In North Viking Island its vote is spread across the cities and falls just short everywhere, so it still holds no council seat on the island. That is why the party ranks a lower threshold as its first institutional cause, and it likes to do the sums with other small parties: at North Viking Island's last election, the parties that missed the threshold won nearly a quarter of the vote between them. The name and the slogan, open code, open government, both come from the language of software, and members say the blank space between the brackets on the flag is left for every citizen to fill in.\nThe party is famous for its political culture. Its constitution lives in a public code repository where any member may propose a change, merged after a vote of all members, and even the congress agenda must be committed, reviewed and merged. The voting software is written by members and publicly audited before every congress, and people joke that half of any Open Source meeting is spent fixing bugs in the voting procedure. The youth wing, The Fork, is named after forking a repository: if you disagree, branch off, and if you do it well, merge back. Before each congress closes, General Secretary Fang Haining reads out every change merged that session, and at the last one the hall answers together: merged."
    history:
      zh: "开源党由北冰洋数据中心的工程师和北维京岛科学城的程序员在网上共同发起。发起人起初只想写一份政府软件开源的倡议书，后来发现倡议书没人签收，才决定自己组党。第一次党代会完全在线上召开，表决用的软件也是党员自己写的，开票前先把源代码公开给所有人检查。此后它在长夏群岛的大学城和各市议会里扎下根，并在那里赢得了它在领地议会里的议席。"
      en: "The party was started online by data-centre engineers in the Arctic Ocean and programmers in North Viking Island's Science City. Its founders at first only meant to write a petition for open-source government software; when nobody would receive it, they decided to found a party themselves. The first congress was held entirely online, on voting software members had written, and the source code was opened to everyone for inspection before the count. The party later took root in the university towns and city councils of the Everlong Summer Islands, where it won its seat in a territorial parliament."
    flag_notes:
      zh: "开源党的党旗是深灰紫色的纯色旗面，中间一对薄荷绿的代码括号。深灰紫取自程序员熟悉的深色编辑器背景，薄荷绿是终端里字符的颜色。括号在代码里用来圈出一段可以被调用、也可以被检查的内容，党员说它象征「把权力放进括号」：公开、有边界、谁都能读。括号中间故意留白，意思是内容由公民来写。"
      en: "The flag is a plain field of dark slate-purple with a pair of mint-green code brackets in the centre. The dark field recalls the dark editor screens programmers know, and the mint green is the colour of text on a terminal. In code, brackets enclose a block that can be called and also inspected, and members say they stand for putting power in brackets: public, bounded and readable by anyone. The space between them is deliberately empty, because the content is for citizens to write."
    factions:
      - names: { zh: "主干派", en: "Mainline Caucus" }
        notes: { zh: "主张把开源党办成一个能谈判、能妥协的正常议会党，与绿脉党、灯塔自由民主党协调选举名单，必要时联合竞选以跨过门槛。成员多是年长的工程师和长夏群岛的市议员。", en: "Wants Open Source run as an ordinary parliamentary party that can negotiate and compromise, coordinating lists with Greenvein and the Lighthouse Liberal Democrats and running jointly if that is what it takes to clear the threshold. Its members are mostly older engineers and councillors in the Everlong Summer Islands." }
      - names: { zh: "隐私优先论坛", en: "Privacy First Forum" }
        notes: { zh: "党内的公民自由主义核心，认为数据保护高于一切，对政府出资建设公共算力和统一数字身份心存戒备，反对任何以安全为名的数据汇集。代表人群是律师、记者和网络安全研究者。", en: "The party's civil-libertarian core, which puts data protection above everything else, is wary of state-funded public computing and unified digital identity, and opposes any pooling of data in the name of security. It draws on lawyers, journalists and security researchers." }
      - names: { zh: "公共算力圈", en: "Public Compute Circle" }
        notes: { zh: "党内偏左的一翼，把免费宽带和公共算力看作新的公共设施，主张由领地投资建网、建机房，并对平台企业征税。成员多是大学生、分叉社的骨干和数据中心的一线技术员。", en: "The party's left wing, which sees free broadband and public computing as the new public utilities and wants the territory to build networks and server halls and to tax platform companies. Its members are mostly students, activists from The Fork and frontline data-centre technicians." }
    organisation:
      newspaper: { zh: "《提交日志》", en: "The Commit Log" }
      think_tank: { zh: "开放协议研究所", en: "Open Protocol Institute" }
      unions: { zh: "数据中心技术员协会", en: "Data Centre Technicians' Association" }
      women: { zh: "开源女性网络", en: "Open Source Women's Network" }
  - id: pty_x004cm
    names: { zh: 渔农党, en: Fishers and Farmers Party }
    short_names: { zh: 渔农, en: "Fish & Farm" }
    color: "#7BA23F"
    flag: { layout: bands, colors: ["#7BA23F", "#1F6FA8"], charge: wheat, charge_band: 0, extra: [{ charge: fish, color: "#FFFFFF", x: 30, y: 30, size: 15 }] }
    spectrum: 0.8
    family: { zh: 农民党, en: Agrarian }
    ideology: [{ zh: 农本主义, en: Agrarianism }, { zh: 渔业社区主义, en: Fishing-community politics }, { zh: 中间主义, en: Centrism }]
    axes: { econ: 5.5, galtan: 6.0, autonomy: 3.0, green: 6.0 }
    leader: { zh: 哈尔瓦·斯特兰莫, en: Hallvar Strandmo }
    members: 12000
    youth_wing: { zh: 渔农青年, en: Young Fishers and Farmers }
    slogan: { zh: 有人种地，有人出海，才有饭吃, en: "Someone sows, someone sails, everyone eats" }
    policies:
      - { zh: 渔业配额按港口分配，优先留给本地小船, en: "Share fishing quotas by harbour, first to local small boats" }
      - { zh: 农场、牧场和渔船的燃料与电价补贴, en: "Subsidise fuel and power for farms, pastures and fishing boats" }
      - { zh: 每个乡镇保留一所学校、一个邮局和一家诊所, en: "Keep a school, a post office and a clinic in every rural township" }
      - { zh: 本地农渔产品进入学校和医院食堂, en: Local farm and fish produce in school and hospital canteens }
    allies: [pty_mak5vy, pty_xmdckb, pty_vxz9jt]
    targets: { div_fbfqv9: 3, div_raat4g: 1.5, div_hpmerr: 1.5 }
    lean: { fishing: 0.8, agriculture: 0.8, dairy: 0.7, herding: 0.6, forestry: 0.5, aquaculture: 0.5, urban: -0.8 }
    notes:
      zh: "渔农党是一个把两种生计拴在一起的政党：内陆的奶农、牧民和林业工人，沿海的渔民和养殖户。它的口号「有人种地，有人出海，才有饭吃」说的是一种互相依存的乡村秩序，可这两半的利益并不总是一致。渔民要的是按港口分配、优先留给本地小船的渔业配额，农民要的是饲料、燃料和电价补贴；海湾里的养殖场既是渔村的新饭碗，又被捕捞渔民视为抢占渔场的对手。党在经济上居中，社会议题上偏传统，在生态与增长之间偏向增长，党内难解的问题是怎样面对能源转型：燃料补贴是乡村的命脉，却与减排的方向相反。党的回答是「先保住乡镇，再谈转型」，主张每个乡镇保留一所学校、一个邮局和一家诊所，本地农渔产品进入学校和医院食堂，让乡村先有留得住人的理由。\n在北维京岛的领地议会选举中，渔农党拿到百分之三的选票，跨不过百分之五的门槛；在维京群岛和北冰洋，它都只有百分之一点几。它的力量在市议会里：雅利基卢克市议会二十三席中有它三席，它与社会民主互助工党、全领地联邦联盟一起执政，在领地议会里分属执政与反对两边的两个大党，在这座小城里靠渔农党才坐到一张桌上。市里的渔港冷库和牧场饲料仓都是它在联合协议里争来的，代价是接受了一份它并不热心的气候规划。在马斯林山市议会，它有三席，坐在反对席上，常就乡镇诊所和道路预算与执政联盟讨价还价。在议会之外，它更像一张合作社网络：乳品合作社、渔民协会和乡镇诊所的请愿，往往由它的党员牵头。\n它的选民集中在乡村、渔港、种植业、林业、乳业和畜牧地区，城市里得票很低。北维京岛内陆的乳品合作社和沿海渔村是它的根基；在维京群岛，它更多与友党小岛联邦党配合，而不是与之争票；在北冰洋，它的支部守在几个渔港。它与高地牧场联盟是友党，两党常被问为什么不合并，回答通常是：一个看海，一个看山。党旗由绿、蓝两条色带组成，绿带上是麦穗，旁边一条白鱼，党员自嘲「我们的党旗能做一顿饭」。\n渔农党的会议时间表要迁就挤奶和潮汐，支部会议常在傍晚退潮之后开。每年秋收后的党代会在一个农场的谷仓里召开，会场一边坐渔民，一边坐农民，发言轮流进行；会后的晚宴只用代表们自己带来的东西，有人带奶酪，有人带一桶鱼，没有人知道最后会吃到什么。党首哈尔瓦·斯特兰莫习惯在大会开幕时报告当年的鱼获和收成，再报告党员人数，他说这才是正确的顺序。"
      en: "The Fishers and Farmers Party ties two livelihoods together: the dairy farmers, herders and forestry workers of the interior, and the fishers and fish farmers of the coast. Its slogan, someone sows, someone sails, everyone eats, describes a rural order of mutual dependence, but the two halves do not always want the same things. Fishers want quotas shared out by harbour and kept first for local small boats; farmers want help with feed, fuel and power prices; and the fish farms in the bays are at once a new livelihood for fishing villages and, to the boats that work the open sea, a rival for their grounds. The party sits in the centre on economics, leans traditional on social questions and towards growth over ecology, and its knottiest question is the energy transition: fuel subsidies are the lifeblood of the countryside and run against the drive to cut emissions. Its answer is to save the townships first and talk about transition afterwards: a school, a post office and a clinic in every township, and local produce and fish in school and hospital canteens, so that the countryside first has reasons for people to stay.\nAt North Viking Island's territorial election the party won three per cent, short of the five-per-cent threshold; in the Viking Islands and the Arctic Ocean it took only one and a bit per cent. Its strength is on the councils. It holds three of Jaalikiluk's 23 seats and governs there with the Social Democratic Mutual Aid Labour Party and the All-Territories Federal Union: two large parties that face each other across the territorial parliament share a table in this small city only because the Fishers and Farmers sit between them. The harbour cold store and the pasture feed barn were both won in the coalition agreement, at the price of accepting a climate plan the party was lukewarm about. On Maslin Mountain's council it has three seats in opposition, where it bargains with the governing coalition over township clinics and road budgets. Outside the chambers it works more like a network of cooperatives: petitions from dairy cooperatives, fishers' associations and township clinics are often led by its members.\nIts voters are in the countryside, the fishing harbours and the farming, forestry, dairy and herding districts, and it polls very little in the cities. The dairy cooperatives of North Viking Island's interior and the fishing villages of its coast are its roots; in the Viking Islands it works with its ally the Small Isles Federal Party rather than competing for its votes; in the Arctic Ocean its branches hold on in a few fishing harbours. Its ally the Upland Pasture Union is often asked why the two do not merge, and the usual answer is that one watches the sea and the other watches the hills. The flag is made of a green band and a blue band, with an ear of wheat on the green and a white fish beside it, and members joke that their flag makes a meal.\nParty meetings bend to the milking and the tides, and branches often meet in the evening once the tide has gone out. The congress after each harvest is held in a farm's barn, with fishers on one side and farmers on the other, speaking in turn; the dinner afterwards is made only from what the delegates bring, so some bring cheese, some bring a pail of fish, and no one knows what the meal will be. Party leader Hallvar Strandmo opens each congress by reporting the year's catch and harvest before the membership figures, which he says is the proper order."
    history:
      zh: "渔农党由北维京岛内陆的乳品合作社和沿海的渔民协会联合组建。两边起初只是在一次燃料涨价中联手请愿，发现彼此的诉求可以写进同一份纲领，于是决定合成一个党。后来它在维京群岛的小岛和北冰洋的渔港也建立了支部，并在雅利基卢克等乡村城市的市议会里站稳了脚跟。"
      en: "The party was formed by the dairy cooperatives of North Viking Island's interior and the fishers' associations of its coast. The two first joined forces in a petition over rising fuel prices, found that their demands fitted into one programme and decided to become one party. It later set up branches on the small islands of the Viking Islands and in the Arctic Ocean's fishing harbours, and gained a firm footing on the councils of rural cities such as Jaalikiluk."
    flag_notes:
      zh: "党旗由一条草绿色和一条海蓝色的色带组成，绿带代表田野和牧场，蓝带代表海洋和渔场。绿带上是一穗麦子，旁边游着一条白色的鱼，分别代表种地的人和出海的人。设计者说，两条色带并排而不分高下，是要说明农民和渔民在党内地位相同。党员则自嘲这面旗「能做一顿饭」。"
      en: "The flag has a grass-green band and a sea-blue band: the green for fields and pastures, the blue for the sea and the fishing grounds. On the green is an ear of wheat with a white fish beside it, for those who sow and those who sail. The designers say the two bands sit side by side with neither above the other, because farmers and fishers stand as equals in the party. Members simply joke that the flag makes a meal."
    factions:
      - names: { zh: "港口派", en: "Harbour Wing" }
        notes: { zh: "以沿海渔民协会为基础，首先看重按港口分配配额和保护本地小船，对海湾养殖场的扩张保持警惕，主张渔业政策由港口委员会而不是领地部门决定。", en: "Rooted in the coastal fishers' associations, it cares above all about quotas shared out by harbour and protection for local small boats, is wary of the spread of fish farms in the bays, and wants fishing policy set by harbour committees rather than territorial departments." }
      - names: { zh: "谷仓圈", en: "Barn Circle" }
        notes: { zh: "内陆乳品合作社和种植户的圈子，关心饲料、电价和乡镇服务，倾向于与全领地联邦联盟合作，也是推动与高地牧场联盟联合竞选的主要力量。", en: "The circle of inland dairy cooperatives and crop farmers, concerned with feed, power prices and township services; it leans towards working with the All-Territories Federal Union and is the main force behind a joint list with the Upland Pasture Union." }
      - names: { zh: "绿色乡村论坛", en: "Green Countryside Forum" }
        notes: { zh: "党内较年轻的一翼，主张把补贴从燃料逐步转向渔船电气化、农场沼气和本地能源合作社，愿意与绿脉党对话。成员多是渔农青年和返乡创业的年轻人。", en: "The party's younger wing, which wants subsidies moved gradually from fuel to electric boats, farm biogas and local energy cooperatives, and is open to talks with Greenvein. Its members are mostly from Young Fishers and Farmers and young people who have come home to start businesses." }
    organisation:
      newspaper: { zh: "《潮汐与收成》", en: "Tide and Harvest" }
      think_tank: { zh: "乡镇未来研究会", en: "Township Futures Institute" }
      unions: { zh: "沿海渔民协会、内陆乳品合作社联合会", en: "Coastal Fishers' Association, Federation of Inland Dairy Cooperatives" }
      women: { zh: "渔农妇女会", en: "Fishers and Farmers Women's Guild" }

  - id: pty_k4krwn
    names: { zh: 长屋党, en: Longhouse Party }
    short_names: { zh: 长屋, en: "Longhouse" }
    color: "#2C3E50"
    flag: { layout: banner, colors: ["#2C3E50"], charge: longhouse, charge_color: "#C9A227" }
    spectrum: 2.0
    family: { zh: 保守派, en: Conservative }
    ideology: [{ zh: 传统保守主义, en: Traditional conservatism }, { zh: 文化保守主义, en: Cultural conservatism }, { zh: 地方主义, en: Localism }]
    axes: { econ: 6.5, galtan: 8.0, autonomy: 3.0, green: 6.0 }
    leader: { zh: 埃斯特丽·豪厄伦, en: Eystrid Haugelund }
    members: 11000
    youth_wing: { zh: 长屋少年团, en: Longhouse Youth }
    slogan: { zh: 守住炉火, en: Keep the hearth }
    policies:
      - { zh: 维京语在学校里与中文同课时, en: Teach Viking for as many hours as Chinese in schools }
      - { zh: 古城、长屋遗址和老船坞列入保护名录，禁止拆除, en: "List the old towns, longhouse sites and old boatyards for protection, with no demolition" }
      - { zh: 有三个以上孩子的家庭减免所得税, en: Income tax relief for families with three or more children }
      - { zh: 地方节庆和传统航海活动由领地资助, en: Territorial funding for local festivals and traditional sailing }
    allies: [pty_mak5vy, pty_hwkmx1]
    targets: { div_fbfqv9: 4.6, div_raat4g: 2.5 }
    lean: { "lang:art-x-viking": 2.0, heritage: 0.3, old: 2.0, urban: -0.3, fishing: 0.2 }
    notes:
      zh: "长屋党是北维京岛和维京群岛的传统保守派，主张维京语在学校里与中文同课时，古城、长屋遗址和老船坞列入保护名录、禁止拆除，有三个以上孩子的家庭减免所得税，地方节庆和传统航海活动由领地资助。它的保守主义首先是文化的：守住语言、守住老城、守住一家几代人围着火塘过日子的方式。这也带来了党内的张力。一方面，它在经济上偏右，主张减税、精简领地机构；另一方面，它的几乎每一条主张都要花公共的钱，从修船坞到资助节庆。另一重张力在于与大党的关系：友党全领地联邦联盟在领地议会里是反对党，长屋党的不少老选民同时也投联邦联盟，党内一直有人主张干脆并入对方的名单，另一些人则认为一旦合并，维京语和老城就会沦为大党纲领里的一行脚注。\n在北维京岛上一次领地议会选举中，长屋党拿到百分之四点六的选票，是没进议会的党里得票最高的，离百分之五的门槛只差一点。党部把那一晚称作「差一桨之夜」，此后每次大会都会提起。在维京群岛的单议席选区制下，它只有百分之二点四，主要配合友党蓝桨保守党竞选。它在维京港、勒克尔、洛龙山和雅利基卢克的市议会里都有席位，在勒克尔和洛龙山各有五席，但哪里都不执政。它的影响力来自议会之外：老船坞免于拆除，是它发动居民签名、堵在推土机前换来的；在维京港市议会，它与执政的海港运动在老城保护上常投同一张票，尽管两党在别的问题上分歧很深。批评者说它反对的东西多，建设的东西少；它的回答是「有些东西拆了就再也没有了」。\n长屋党的选民是维京语母语者、年长的居民、乡村和渔村，以及古城、遗址和博物馆集中的地方，在城市里得票很低。维京语使用者多的老城镇是它的根据地，年轻人和新来的居民则很少投它。党名来自维京时代的长屋：一家几代人和来客都睡在同一个屋顶下，中间是一条长长的火塘；口号「守住炉火」由此而来。党旗是深蓝旗面上一座金色的长屋。\n长屋党的党代会在一间长厅里召开，代表们沿一张长桌对坐，按传统由年长的代表先发言。开幕时，代表们一起点燃一只铁火盆，闭幕时由最年轻的代表把它熄灭，党内说这是「把火交给下一代，也让下一代学会收火」。「差一桨之夜」之后，长屋少年团在每次竞选结束时都要划一次船，船上空出一支桨的位置，提醒大家还差那一下。党首埃斯特丽·豪厄伦的演讲总要用维京语开头、中文结尾，她说这样两种听众都会听完。"
      en: "The Longhouse Party is the traditional conservative party of North Viking Island and the Viking Islands. It wants the Viking language taught for as many hours as Chinese in schools, the old towns, longhouse sites and old boatyards listed and protected from demolition, income tax relief for families with three or more children, and local festivals and traditional seafaring events funded by the territory. Its conservatism is first of all cultural: keeping the language, keeping the old towns, keeping the way of life of several generations around one hearth. That brings its own tensions. On economics it leans right, wanting lower taxes and leaner territorial institutions, yet almost every one of its demands costs public money, from mending boatyards to funding festivals. Another tension lies in its relations with the larger parties. Its ally the All-Territories Federal Union is the opposition in the territorial parliament, and many older Longhouse voters also vote for the Federal Union; some in the party have long argued for simply joining its list, while others believe that once merged, the Viking language and the old towns would shrink to a footnote in a big party's programme.\nAt North Viking Island's last territorial election the Longhouse Party took 4.6 per cent, the highest share of any party left out of parliament and only just short of the five-per-cent threshold. The party calls that evening the night of the missing oar stroke, and it comes up at every congress since. Under the Viking Islands' single-member system it won only 2.4 per cent and mostly campaigns in support of its ally the Blue Oar Conservatives. It holds seats on the councils of Viking Port, Lekor, Lorond Mountain and Jaalikiluk, five each in Lekor and Lorond Mountain, but governs nowhere. Its influence comes from outside the chambers: the old boatyards were saved because it gathered residents' signatures and stood in front of the bulldozers, and on Viking Port's council it often votes with the governing Harbour Movement on protecting the old town, though the two disagree deeply on much else. Critics say it opposes more than it builds; its answer is that some things, once pulled down, are gone for good.\nIts voters are native Viking speakers, older residents, the countryside and fishing villages, and places rich in old towns, heritage sites and museums; it polls very little in the cities. The old towns where Viking is widely spoken are its home ground, while young people and newcomers rarely vote for it. The name comes from the Viking-age longhouse, where several generations and their guests slept under one roof along a single long hearth, and the slogan, keep the hearth, follows from it. The flag is a gold longhouse on a deep blue field.\nThe congress meets in a long hall, with delegates facing each other down one long table, and by custom the eldest speak first. It opens with the delegates lighting an iron brazier together and closes with the youngest delegate putting it out, which the party describes as handing the fire to the next generation and teaching it to bank the fire too. Since the night of the missing oar stroke, Longhouse Youth row a boat at the end of every campaign with one oar's place left empty, to remind everyone of the stroke still missing. Party leader Eystrid Haugelund always begins her speeches in Viking and ends them in Chinese, so that, she says, both audiences stay to the end."
    history:
      zh: "长屋党由北维京岛的维京语协会和几个老城保护团体组建，最初的目标是阻止拆除维京港的老船坞。那场保卫战打赢之后，发起人发现各地的老城都面临同样的问题，于是把一个临时联盟办成了政党。维京群岛的支部由长船古城的居民协会发起，后来与友党蓝桨保守党在选区里分工合作。"
      en: "The Longhouse Party was formed by North Viking Island's Viking language society and several old-town conservation groups, its first aim being to stop the demolition of Viking Port's old boatyards. Once that fight was won, the founders found that old towns everywhere faced the same threat, and turned a temporary alliance into a party. Its Viking Islands branch was started by the residents' association of Longship's old town, and later divided the constituencies with its ally the Blue Oar Conservatives."
    flag_notes:
      zh: "党旗是深蓝色的纯色旗面，中间一座金色的长屋。深蓝代表北方的夜和海，金色是火塘的光，也是老船坞里桐油木料的颜色。长屋象征一家几代人和来客同在一个屋顶下，正是党名和口号「守住炉火」的来源。党员说，旗面上只画屋子不画人，是因为屋子在，人就会回来。"
      en: "The flag is a plain deep blue field with a gold longhouse in the centre. The blue stands for the northern night and sea; the gold is the glow of the hearth and the colour of oiled timber in the old boatyards. The longhouse stands for several generations and their guests under one roof, the source of both the party's name and its slogan, keep the hearth. Members say the flag shows the house and not the people because, as long as the house stands, the people will come back."
    factions:
      - names: { zh: "火塘派", en: "Hearth Wing" }
        notes: { zh: "党内的文化保守核心，把维京语教育、老城保护和家庭政策放在首位，坚持长屋党独立竞选，反对并入任何大党名单。成员多是维京语教师、老城居民和年长的党员。", en: "The party's cultural-conservative core, which puts Viking-language schooling, old-town protection and family policy first, insists on Longhouse standing alone and opposes merging into any larger party's list. Its members are mostly Viking teachers, old-town residents and older members." }
      - names: { zh: "联邦合作派", en: "Federal Cooperation Group" }
        notes: { zh: "主张与全领地联邦联盟签订选举协议，甚至联合提名，以换取跨过门槛和进入议会的机会；在经济上更看重减税和精简机构。成员多是市议员和小企业主。", en: "Wants an electoral pact with the All-Territories Federal Union, even joint candidacies, in exchange for a path over the threshold and into parliament; on economics it cares more about tax cuts and leaner institutions. Its members are mostly councillors and small business owners." }
      - names: { zh: "船坞俱乐部", en: "Boatyard Club" }
        notes: { zh: "由修船匠、渔民和传统航海爱好者组成，关心老船坞、木船工艺和航海节庆，政治上较务实，愿意在遗产保护问题上与海港运动乃至绿脉党合作。", en: "Made up of boatwrights, fishers and traditional seafaring enthusiasts, concerned with old boatyards, wooden boatbuilding and seafaring festivals; it is more pragmatic and willing to work with the Harbour Movement and even Greenvein on heritage protection." }
    organisation:
      newspaper: { zh: "《炉火报》", en: "The Hearth" }
      think_tank: { zh: "长桌研究会", en: "Long Table Society" }
      unions: { zh: "老城居民协会联合会、木船工匠行会", en: "Federation of Old-Town Residents' Associations, Guild of Wooden Boatwrights" }
      women: { zh: "长屋妇女会", en: "Longhouse Women's Guild" }

  # ── 北维京岛政党 ──
  - id: pty_w45j5f
    names: { zh: 海港运动, en: Harbour Movement }
    short_names: { zh: 海港, en: "Harbour" }
    color: "#1F9ACF"
    flag: { layout: hoist, colors: ["#0F3B5F", "#1F9ACF", "#FFFFFF", "#1F9ACF"], charge: gull }
    spectrum: -0.4
    family: { zh: 地区主义, en: Regionalist }
    ideology: [{ zh: 地方主义, en: Localism }, { zh: 市政主义, en: Municipalism }, { zh: 社会自由主义, en: Social liberalism }]
    axes: { econ: 4.5, galtan: 3.5, autonomy: 2.5, green: 5.0 }
    leader: { zh: 秦望舒, en: Qin Wangshu }
    members: 6500
    youth_wing: { zh: 海港青年, en: Harbour Youth }
    slogan: { zh: 维京港的事，维京港定, en: Viking Port decides for Viking Port }
    policies:
      - { zh: 港口收入的一半留给维京港市, en: Half of the port's revenue to stay with Viking Port City }
      - { zh: 维京港老城和港区的规划由市议会而不是领地政府审批, en: "Viking Port's old town and harbour to be planned by the city council, not the territory" }
      - { zh: 海底通道的过路费减半, en: Halve the tolls on the undersea link }
      - { zh: 在老港区建一座海事博物馆, en: Build a maritime museum in the old harbour }
    allies: [pty_jh513z, pty_2033kv]
    targets: { div_fbfqv9: 3 }
    lean: { "city:div_m41gwn": 2.0, port: 0.3 }
    notes:
      zh: "海港运动只在维京港和周边竞选，是一个中间偏左的地方主义政党。维京港是北维京岛最早的城市，首府自由市建成后，政务院和议会都搬走了，许多维京港人觉得「港口赚的钱都流到了首府」。海港运动的主张都围着这口气：港口收入的一半留给本市，老城和港区的规划由市议会而不是领地政府审批，海底通道的过路费减半，在老港区建一座海事博物馆。它的内在张力也来自这里。它是一个政党，还是一座城市的游说团？党内一直有人主张把「本地事本地定」推广到勒克尔、萨科勒等城市，办成全岛的市政主义运动；另一些人则认为，离开维京港，海港运动就什么都不是。另一重张力在港口本身：老城保护和海事博物馆需要留住老码头，港口的就业和收入却需要扩建新泊位，两种诉求都写在党纲里。\n在领地议会选举中，海港运动拿到百分之三的选票，几乎全部来自一座城市，跨不过全领地百分之五的门槛。它的舞台是维京港市议会：五十三席中有它七席，它与社会民主互助工党、绿脉党组成执政联盟，市长属互助工党。在市里执政，它让老城的每一项改建都要先经市议会公开讨论，推动了海事博物馆的选址，也让市政厅门前的旗杆换回了老港区的一根旧桅杆。但它的几项招牌主张都绕不开领地政务院：港口收入分成和过路费减半要动领地预算，而领地的执政党正是它在市里的伙伴社会民主互助工党。于是它常常一边在市里与互助工党同桌，一边在领地层面向互助工党请愿，党内称之为「同船吵架」。在老城保护上，它又与反对派长屋党常投同一张票。\n它的选民是维京港市的居民，特别是港口、航运和码头一带，离开维京港几乎没有选票。码头工人、渡轮船员、老城的小店主和不愿搬去首府的年轻家庭构成了它的基础。口号「维京港的事，维京港定」写在每一张传单上。党旗靠旗杆一侧是一个深蓝色三角，旗面是蓝白相间的横条，上面飞着一只海鸥。\n海港运动的大会在老港区的一座旧货仓里召开，开会前要敲三下一口旧船钟，意思是「船靠岸了」。每年它都组织一次「回港日」游行，参加者从港务局大楼走到老码头，沿途把写着诉求的纸船放进海里。党内有个不成文的规矩：任何一份党纲草案都要先在码头边的咖啡馆里念给工人听，听不懂的就重写。党首秦望舒常说，海港运动的党纲不必比一张潮汐表更长。"
      en: "The Harbour Movement stands only in Viking Port and its surroundings, a localist party just left of centre. Viking Port is North Viking Island's oldest city, and when Freedom City was built as the capital the Executive Council and the parliament moved away; many in Viking Port feel the money the harbour makes flows to the capital. Every one of the movement's demands grows out of that grievance: half the port's revenue kept in the city, the old town and harbour district planned by the city council rather than the territorial government, the undersea link's tolls halved, and a maritime museum in the old harbour. Its inner tensions come from the same place. Is it a party, or one city's lobby? Some members have long wanted to carry local decisions for local places to Lekor, Sakole and other cities and build an island-wide municipalist movement; others believe that without Viking Port the movement is nothing. A second tension lies in the harbour itself: protecting the old town and housing a museum mean keeping the old quays, while the port's jobs and income depend on new berths, and both demands sit in the programme.\nAt territorial elections the movement takes three per cent of the vote, almost all of it from one city, and cannot clear the territory-wide five-per-cent threshold. Its stage is Viking Port's council, where it holds seven of 53 seats and governs with the Social Democratic Mutual Aid Labour Party and Greenvein under a Mutual Aid mayor. In city government it has ensured that every alteration in the old town is first debated in open council, pushed the choice of a site for the maritime museum, and seen the flagpole outside city hall replaced with an old mast from the harbour. But its signature demands all run through the territorial Executive Council: a share of port revenue and halved tolls touch the territorial budget, and the party governing the territory is its own city partner, the Social Democratic Mutual Aid Labour Party. So it often sits at the same table as Mutual Aid in the city while petitioning Mutual Aid at territorial level, which members call arguing in the same boat. On protecting the old town, it often votes with the opposition Longhouse Party.\nIts voters are the people of Viking Port, above all in the port, shipping and dockside districts, and outside the city it has almost no votes. Dockworkers, ferry crews, old-town shopkeepers and young families unwilling to move to the capital are its base. The slogan, Viking Port decides for Viking Port, is printed on every leaflet. The flag has a deep blue triangle at the hoist and blue and white stripes across the field, with a gull in flight.\nThe movement holds its congress in an old warehouse in the harbour district, and before it begins someone strikes an old ship's bell three times, meaning the ship has come in. Every year it organises a Homecoming Day march from the port authority building to the old quay, where marchers set paper boats carrying their demands on the water. There is an unwritten rule that every draft programme must first be read aloud to workers in a quayside café, and anything they cannot follow is rewritten. Party leader Qin Wangshu likes to say that the movement's programme need be no longer than a tide table."
    history:
      zh: "海港运动起于维京港居民反对把港务局迁往首府的一次请愿。请愿成功、港务局留在了老港区之后，发起人发现市民的不满远不止一个机构的去留，于是决定参加市议会选举，后来也参加领地议会选举。它此后一直坚持只在维京港和周边竞选，把「本地事本地定」当作立党的根本。"
      en: "The movement began with a petition by Viking Port residents against moving the port authority to the capital. When the petition succeeded and the port authority stayed in the old harbour, its organisers found that the city's discontent went far beyond where one office sat, and decided to stand for the city council, and later for the territorial parliament too. It has stood only in Viking Port and its surroundings ever since, treating local decisions for local places as the reason it exists."
    flag_notes:
      zh: "党旗靠旗杆一侧是一个深蓝色的三角，旗面由海蓝与白色相间的横条组成，上面飞着一只海鸥。深蓝三角象征老港的码头和城市的根，蓝白横条是港湾里一道道的浪和航道标线。海鸥是维京港码头上常见的鸟，总是绕着港口飞，从不远去，党员说它就像海港运动：只认这一座港。"
      en: "The flag has a deep blue triangle at the hoist and alternating sea-blue and white stripes across the field, with a gull flying over them. The triangle stands for the old harbour's quays and the city's roots; the stripes are the waves in the harbour and the lines of the channel. The gull is a familiar bird on Viking Port's quays and always circles the harbour without straying far, which members say is just like the movement: loyal to one port."
    factions:
      - names: { zh: "老码头派", en: "Old Quay Group" }
        notes: { zh: "以老城居民和小店主为主，首先看重老城保护、海事博物馆和规划审批权，对新泊位扩建持保留态度，在遗产问题上愿意与长屋党合作。", en: "Mostly old-town residents and shopkeepers, it puts old-town protection, the maritime museum and planning powers first, has reservations about new berths, and will work with the Longhouse Party on heritage." }
      - names: { zh: "新泊位论坛", en: "New Berth Forum" }
        notes: { zh: "码头工人、航运从业者和渡轮船员的圈子，关心港口就业、收入分成和过路费，主张扩建港区，与社会民主互助工党的工会关系密切。", en: "The circle of dockworkers, shipping workers and ferry crews, concerned with port jobs, revenue sharing and tolls; it backs expanding the port and has close ties to the Social Democratic Mutual Aid Labour Party's unions." }
      - names: { zh: "城市联盟派", en: "Cities Alliance Group" }
        notes: { zh: "主张把海港运动的市政主义推广到北维京岛其他城市，与各地的地方团体组成联合名单，冲击领地议会的门槛。成员多是海港青年和年轻的市议员。", en: "Wants to carry the movement's municipalism to other North Viking Island cities and form joint lists with local groups elsewhere to break the territorial threshold. Its members are mostly from Harbour Youth and younger councillors." }
    organisation:
      newspaper: { zh: "《港口信使》", en: "The Harbour Messenger" }
      think_tank: { zh: "老港城市研究所", en: "Old Harbour Urban Institute" }
      unions: { zh: "维京港码头工人协会", en: "Viking Port Dockworkers' Association" }
      women: { zh: "海港妇女会", en: "Harbour Women's Circle" }

  - id: pty_p15smt
    names: { zh: 巴克汉姆人联盟, en: Buckham League }
    short_names: { zh: 巴盟, en: "Buckham" }
    color: "#A23E8C"
    flag: { layout: diagonal, colors: ["#A23E8C", "#F7E6F0"], charge: tower }
    spectrum: -0.2
    family: { zh: 族群地区主义, en: Ethno-regionalist }
    ideology: [{ zh: 少数语言权利, en: Minority language rights }, { zh: 多元文化主义, en: Multiculturalism }, { zh: 社会自由主义, en: Social liberalism }]
    axes: { econ: 4.5, galtan: 3.0, autonomy: 2.5, green: 4.5 }
    leader: { zh: 奥塔维娅·卡尔韦西, en: Ottavia Calvessi }
    members: 4200
    youth_wing: { zh: 巴克汉姆青年, en: Buckham Youth }
    slogan: { zh: 两种语言，一个家, en: "Two tongues, one home" }
    policies:
      - { zh: 巴克汉姆语使用者超过一成的区，路牌和公文双语, en: "Bilingual signs and documents in every district where over a tenth speak Buckham" }
      - { zh: 设立巴克汉姆语广播电视频道, en: A Buckham-language radio and television channel }
      - { zh: 巴克汉姆语学校与中文学校同等拨款, en: Equal funding for Buckham-language and Chinese-language schools }
      - { zh: 修缮萨科勒老城的钟楼和石桥, en: "Restore the bell towers and stone bridges of Sakole's old town" }
    allies: [pty_jh513z, pty_ymxc2s]
    targets: { div_fbfqv9: 2 }
    lean: { "lang:art-x-buckham": 3.0 }
    notes:
      zh: "巴克汉姆人联盟代表北维京岛讲巴克汉姆语的居民，主张在巴克汉姆语使用者超过一成的区实行双语路牌和公文、设立巴克汉姆语广播电视频道、让巴克汉姆语学校与中文学校同等拨款、修缮萨科勒老城的钟楼和石桥。它是一个族群地区主义政党，却把多元文化主义写进了党纲，这本身就是它的核心张力：它到底是巴克汉姆人的党，还是所有支持双语的人的党？党内一部分人认为，联盟的意义在于守住一门语言和一个社群，口号「两种语言，一个家」里的「家」首先是巴克汉姆人的家；另一部分人则希望联盟成为全岛少数语言权利的代言人，把讲维京语、英语的少数群体也拉进来。在经济上它略偏左，在领地自治问题上倾向地方，与友党社会民主互助工党、灯塔自由民主党都能合作，但哪一家都不愿完全听它的。\n巴克汉姆语是北维京岛不少居民的母语，可联盟在领地议会选举中只拿到百分之二的选票，远远跨不过百分之五的门槛，这说明大多数讲巴克汉姆语的人投给了大党。党内对此看法不一：有人说这是联盟的失败，有人说这正是它的成功——大党为了争取巴克汉姆语选民，已经把双语路牌写进了自己的纲领。它在萨科勒市议会四十八席中有三席，但萨科勒由社会民主互助工党与全领地联邦联盟联合执政，联盟坐在反对席上。即便如此，市里新设的巴克汉姆语图书馆就是它促成的：它在预算表决中把三票押在图书馆上，换来执政联盟的让步。当初那几所面临合并的巴克汉姆语小学也是它保下来的。\n它的选民几乎全是巴克汉姆语母语者，集中在萨科勒和几个山谷小城。巴克汉姆人是岛上较早的移民之一，那里以石砌的钟楼、拱桥和长长的午餐闻名，联盟的竞选活动也常常就是一顿午餐。在巴克汉姆语社群以外，它几乎没有选票。联盟内部常说，巴克汉姆语的未来不在萨科勒的老城，而在山谷小城的小学：孩子一旦转进中文学校，一个家庭的语言往往一代人就换了。因此它把学校拨款看得比路牌更重。党旗是斜分的紫红与浅粉两色，上面一座钟楼，取自萨科勒老城。\n联盟的会议用两种语言进行，发言人每说一段就换一种语言，速记员要同时会两种文字。每年春天，它在萨科勒老城举办「两种语言」诗会，参赛的诗必须一半用中文、一半用巴克汉姆语写成，获奖的诗会被刻在一块石板上，嵌进老城的石墙。党首奥塔维娅·卡尔韦西的支部会议总是从中午开到傍晚，中间不设休息，因为午餐本身就是会议。"
      en: "The Buckham League speaks for North Viking Island's Buckham-speaking residents. It wants bilingual street signs and official documents in districts where more than a tenth of people speak Buckham, a Buckham radio and television channel, equal funding for Buckham-language and Chinese-language schools, and the restoration of the bell tower and stone bridge in Sakole's old town. It is an ethno-regionalist party that has written multiculturalism into its programme, and that is its central tension: is it the party of the Buckham, or of everyone who supports bilingualism? Some members believe the League exists to keep a language and a community alive, and that the home in its slogan, two tongues, one home, is first of all the Buckham home; others want it to speak for minority language rights across the island, bringing in Viking and English speakers too. On economics it leans slightly left and on home rule it favours the local level; it can work with both its allies, the Social Democratic Mutual Aid Labour Party and the Lighthouse Liberal Democrats, but neither will follow its lead entirely.\nBuckham is the mother tongue of many North Viking Islanders, yet the League won only two per cent at the territorial election, far below the five-per-cent threshold, which means most Buckham speakers vote for the larger parties. The party is divided on what that means: some call it the League's failure, others its success, since the larger parties, to win Buckham voters, have already written bilingual signs into their own programmes. It holds three of Sakole's 48 council seats, but Sakole is governed by the Social Democratic Mutual Aid Labour Party with the All-Territories Federal Union, and the League sits in opposition. Even so, the city's new Buckham library was its doing: in a budget vote it staked its three votes on the library and won a concession from the governing coalition. The Buckham primary schools once threatened with merger were also saved by its campaign.\nIts voters are almost all native Buckham speakers, concentrated in Sakole and a few valley towns. The Buckham were among the island's earlier settlers, and their towns are known for stone bell towers, arched bridges and long lunches; a League campaign event is often simply a lunch. Outside the Buckham-speaking community it has almost no votes. League members often say that the future of Buckham lies not in Sakole's old town but in the primary schools of the valley towns: once children move to Chinese-language schools, a family's language can change within a generation. That is why it puts school funding ahead of street signs. The flag is divided diagonally into plum and pale pink, with a bell tower taken from Sakole's old town.\nLeague meetings run in two languages, with speakers switching language every paragraph, and its minute-takers must write in both. Every spring it holds a two-tongues poetry contest in Sakole's old town, where each poem must be written half in Chinese and half in Buckham, and the winning poem is carved on a stone slab set into an old-town wall. Party leader Ottavia Calvessi's branch meetings run from noon to evening without a break, because lunch is itself the meeting."
    history:
      zh: "巴克汉姆人联盟由萨科勒的巴克汉姆语协会和教师工会组建，最初的目标是保住几所面临合并的巴克汉姆语小学。学校保住之后，发起人认为语言问题不能只靠一次次请愿，必须有人坐进议会，于是参加了萨科勒市议会选举，后来也在领地议会选举中推出名单。从那时起，学校问题一直是联盟的头等大事。"
      en: "The League was formed by Sakole's Buckham language society and teachers' union, at first to save a few Buckham-language primary schools that were to be merged. Once the schools were saved, the founders concluded that the language could not depend on one petition after another and needed someone in the chamber, so they stood for Sakole's council, and later put up a list at territorial elections too. Schools have been the League's first concern ever since."
    flag_notes:
      zh: "党旗沿对角线分成紫红与浅粉两色，上面是一座钟楼。两种颜色象征两种语言：彼此不同，却共用一面旗，正合口号「两种语言，一个家」。钟楼取自萨科勒老城的石砌钟楼，是巴克汉姆人社群熟悉的地标，也是联盟要修缮的对象。党员说，钟楼每到整点同时为两种语言的人报时。"
      en: "The flag is divided diagonally into plum and pale pink, with a bell tower on it. The two colours stand for two languages, different but sharing one flag, just as the slogan says: two tongues, one home. The tower is the stone bell tower of Sakole's old town, a landmark every Buckham speaker knows and one the League wants restored. Members say it strikes the hour for speakers of both languages at once."
    factions:
      - names: { zh: "钟楼派", en: "Bell Tower Group" }
        notes: { zh: "党内的社群核心，以萨科勒的语言协会和老城居民为主，主张联盟专注于巴克汉姆语教育、媒体和老城修缮，不必扩大成泛少数语言政党。", en: "The party's community core, mainly Sakole's language society and old-town residents, which wants the League to concentrate on Buckham schooling, media and old-town restoration rather than broaden into a party for all minority languages." }
      - names: { zh: "多语论坛", en: "Many Tongues Forum" }
        notes: { zh: "主张把联盟办成全岛少数语言权利的代言人，与维京语、英语社群的团体结盟，成员多是年轻的教师、翻译和巴克汉姆青年。", en: "Wants the League to speak for minority language rights across the island and to ally with Viking and English community groups; its members are mostly young teachers, translators and Buckham Youth activists." }
      - names: { zh: "山谷圈", en: "Valley Circle" }
        notes: { zh: "代表萨科勒以外的山谷小城，关心乡村学校、道路和小企业，政治上较务实，倾向与社会民主互助工党密切合作以换取具体项目。", en: "Represents the valley towns beyond Sakole, concerned with village schools, roads and small businesses; it is more pragmatic and inclined to work closely with the Social Democratic Mutual Aid Labour Party in return for concrete projects." }
    organisation:
      newspaper: { zh: "《双语周报》", en: "The Bilingual Weekly" }
      think_tank: { zh: "石桥语言政策研究所", en: "Stone Bridge Institute for Language Policy" }
      unions: { zh: "萨科勒巴克汉姆语教师工会", en: "Sakole Buckham Teachers' Union" }
      women: { zh: "巴克汉姆妇女协会", en: "Buckham Women's Association" }

  - id: pty_bvpxk0
    names: { zh: 星途党, en: Starward Party }
    short_names: { zh: 星途, en: "Starward" }
    color: "#3B3F8F"
    flag: { layout: horizon, colors: ["#1B1F4B", "#3B3F8F", "#FFFFFF"], edge: ridge, charge: orbit }
    spectrum: 0.4
    family: { zh: 自由派, en: Liberal }
    ideology: [{ zh: 科技进步主义, en: Techno-progressivism }, { zh: 未来主义, en: Futurism }, { zh: 增长主义, en: Pro-growth }]
    axes: { econ: 6.0, galtan: 3.0, autonomy: 6.5, green: 7.5 }
    leader: { zh: 闻天行, en: Wen Tianxing }
    members: 3900
    youth_wing: { zh: 星途学会, en: Starward Cadets }
    slogan: { zh: 下一站：星空, en: "Next stop: the stars" }
    policies:
      - { zh: 领地研发投入提高到生产总值的百分之五, en: Raise the territory's research spending to five per cent of output }
      - { zh: 西荒高原发射场扩建第三座发射台, en: Build a third launch pad at the West Heath spaceport }
      - { zh: 中学开设天文和编程必修课, en: Compulsory astronomy and programming in secondary schools }
      - { zh: 科学城的研究成果向本地企业免费授权, en: Free licences for Science City research to local firms }
    allies: [pty_ydphtm, pty_ymxc2s]
    targets: { div_fbfqv9: 2.5 }
    lean: { aerospace: 1.2, satellite: 0.8, research: 0.6, defence: 0.3 }
    notes:
      zh: "星途党是北维京岛一个以航天和科研为核心议题的小党，主张把领地研发投入提高到生产总值的百分之五、在西荒高原发射场扩建第三座发射台、中学开设天文和编程必修课、科学城的研究成果向本地企业免费授权。它的未来主义带着鲜明的增长色彩：在生态与增长之间，它站在增长一边；在领地自治与中央统筹之间，它又偏向统筹，认为火箭和大科学装置只有集中力量才造得出来。这让它在小党里显得格格不入，也让党内充满张力。一边是科学城的研究员，希望政府长期、稳定地投钱给基础研究；另一边是航天产业区的企业家，希望少管制、多订单。更敏感的是卫星和国防的关系：航天订单里有一部分来自防务，党内有人认为这是产业的命脉，有人则坚持「星空不该用来打仗」。\n在领地议会选举中，星途党拿到百分之二点五的选票，没有议席。它在马斯林山市议会三十七席中有两席，坐在反对席上；马斯林山由社会民主互助工党、绿脉党和罗盘党联合执政，其中罗盘党是星途党的友党，也在领地政府里掌握一个部。星途党因此学会了「借道」：它的提案常常由罗盘党的议员带进领地议会，换来的是在市里的预算表决中投罗盘党一票。另一个友党灯塔自由民主党在领地议会里是反对党，星途党在两家之间小心周旋。它常被提起的成就是推动市里为中学开设天文选修课，离必修还差一步；争议则集中在发射台扩建上，绿脉党担心高原生态，高原上的牧民也担心草场。在议会之外，它更像一个科普团体：党员到中学开讲座、给市议员写简报，每次领地预算公布后都算一遍研发投入占生产总值的比例，贴在党部门口。\n它的选民集中在航天、卫星和科研地区：马斯林山的航天产业区和西北市的科学城，党员里有不少火箭工程师和天文台的研究员。离开这两个地方，它的得票就很稀薄，乡村和老城里几乎没有支持者。在马斯林山，它的票随航天订单起落：订单多时，工程师们觉得不必投它；订单少了，它的票反而上升。党名和口号「下一站：星空」都说明了它的志向；党旗上是深蓝的夜空和一道山脊，夜空中画着一条白色的轨道。\n每次火箭发射成功，党部都会在门口挂出一面写着发射序号的小旗，门口如今挂满了旗。党代会开幕前要倒数十秒，数到零时全场起立。党内最受欢迎的活动是夏夜在发射场边的观星会，青年组织星途学会会架起望远镜，给附近的孩子讲星座。总书记英韦尔德·菲耶尔霍尔特有个习惯：每份党内文件都要写上「预计发射时间」，也就是这件事打算何时办成。"
      en: "The Starward Party is a small North Viking Island party whose core causes are spaceflight and research. It wants research spending raised to five per cent of the territory's output, a third launch pad at the West Heath spaceport, astronomy and programming made compulsory in secondary schools, and Science City's research licensed free to local firms. Its futurism is plainly pro-growth: between ecology and growth it stands with growth, and between home rule and central coordination it leans towards coordination, arguing that rockets and big scientific facilities can only be built by pooling effort. That makes it an odd fit among the small parties, and fills it with tensions of its own. On one side are Science City's researchers, who want steady long-term public money for basic science; on the other are the entrepreneurs of the space industry, who want fewer rules and more orders. More delicate still is the link between satellites and defence: some of the space orders come from defence work, and while some members see that as the industry's lifeline, others insist the stars should not be used for war.\nAt the territorial election the Starward Party won 2.5 per cent and no seats. It holds two of Maslin Mountain's 37 council seats, in opposition; the city is governed by the Social Democratic Mutual Aid Labour Party, Greenvein and the Compass Party, and Compass is Starward's ally and also holds one ministry in the territorial government. Starward has therefore learned to borrow a route: its proposals are often carried into the territorial parliament by Compass members, in return for a Starward vote for Compass in city budget votes. Its other ally, the Lighthouse Liberal Democrats, sits in opposition in the territorial parliament, and Starward steers carefully between the two. An achievement it often cites is persuading the city to offer astronomy as an elective in secondary schools, one step short of making it compulsory; the controversy centres on the new launch pad, where Greenvein worries about the heath's ecology and the herders on the plateau worry about their pastures. Outside the chambers it behaves more like a science outreach society: members give talks in secondary schools, write briefings for councillors, and after every territorial budget work out research spending as a share of output and post the figure at the party's door.\nIts voters are concentrated in the aerospace, satellite and research districts: Maslin Mountain's space industry district and Northwest's Science City, and its members include many rocket engineers and observatory researchers. Beyond those two places its vote is thin, and it has almost no supporters in the countryside or the old towns. In Maslin Mountain its vote moves against the order book: when space orders are plentiful, engineers see no need to vote for it, and when orders dry up its vote rises. The name and the slogan, next stop: the stars, speak for its ambitions; the flag shows a deep blue night sky over a mountain ridge, with a white orbit drawn across the sky.\nAfter every successful launch the party hangs a small flag bearing the launch number at its door, and the doorway is now hung thick with them. Each congress opens with a ten-second countdown, and at zero the whole hall stands. Its most popular event is a summer stargazing night beside the spaceport, where the youth wing, the Starward Cadets, sets up telescopes and shows local children the constellations. General Secretary Ingveld Fjellholt has a habit of putting an expected launch time on every party document, meaning the date by which the thing is meant to be done."
    history:
      zh: "星途党由马斯林山航天产业区的工程师在一次关于发射场扩建的市议会听证后创立。那次听证上，工程师们发现会场里几乎没有人能讲清楚发射场对城市意味着什么，于是决定自己站出来竞选。第一份党纲写在一张火箭装配图的背面，后来科学城的研究员也陆续加入，党纲才从发射台扩展到教育和科研。"
      en: "The party was founded by engineers of Maslin Mountain's space industry after a council hearing on enlarging the spaceport. At that hearing the engineers found that hardly anyone in the room could explain what the spaceport meant for the city, and decided to stand for election themselves. The first manifesto was written on the back of a rocket assembly drawing; as researchers from Science City joined, the programme grew from launch pads to education and research."
    flag_notes:
      zh: "党旗以天空与地平线构图：上方是深蓝的夜空，下方是一道靛蓝的山脊，夜空中画着一条白色的轨道。山脊代表马斯林山和西荒高原，是火箭升空的地方；深蓝夜空是天文台每晚看到的天；白色轨道象征人造卫星，也象征党名里的「途」。党员说，这面旗画的是发射前一刻的景色。"
      en: "The flag is built as sky and horizon: a deep blue night sky above an indigo mountain ridge, with a white orbit drawn across the sky. The ridge stands for Maslin Mountain and the West Heath plateau, where rockets lift off; the night sky is the one the observatories watch every evening; and the white orbit stands for satellites and for the way ahead in the party's name. Members say the flag shows the moment just before a launch."
    factions:
      - names: { zh: "发射台派", en: "Launch Pad Group" }
        notes: { zh: "以航天产业区的企业家和工程师为主，主张扩建发射台、放宽管制、争取更多商业和防务订单，与罗盘党关系密切。", en: "Mainly entrepreneurs and engineers of the space industry, it wants the new launch pad, lighter regulation and more commercial and defence orders, and has close ties to the Compass Party." }
      - names: { zh: "天文台圈", en: "Observatory Circle" }
        notes: { zh: "科学城研究员和教师的圈子，看重基础研究的长期拨款、中学天文和编程课以及研究成果免费授权，反对把航天绑在防务订单上。", en: "The circle of Science City researchers and teachers, which values long-term funding for basic research, astronomy and programming in schools and free licensing of research, and opposes tying spaceflight to defence orders." }
      - names: { zh: "高原对话论坛", en: "Plateau Dialogue Forum" }
        notes: { zh: "党内较温和的一翼，主张发射场扩建前先与高原牧民和绿脉党协商，把生态补偿写进项目，成员多是年轻党员和星途学会的骨干。", en: "The party's more moderate wing, which wants talks with the plateau herders and Greenvein before the spaceport is enlarged and ecological compensation written into the project; its members are mostly younger members and Starward Cadets activists." }
    organisation:
      newspaper: { zh: "《倒计时》", en: "Countdown" }
      think_tank: { zh: "轨道政策研究所", en: "Orbit Policy Institute" }
      unions: { zh: "马斯林山航天工程师协会", en: "Maslin Mountain Aerospace Engineers' Association" }
      women: { zh: "星途女性科学家网络", en: "Starward Women in Science Network" }

  - id: pty_xmdckb
    names: { zh: 高地牧场联盟, en: Upland Pasture Union }
    short_names: { zh: 牧盟, en: "Upland" }
