      justice: { zh: 司法厅, en: Department of Justice }
      security: { zh: 公共安全与移民执法厅, en: Department of Public Safety and Immigration Enforcement }
      education: { zh: 教育厅, en: Department of Education }
      transport: { zh: 交通与高铁厅, en: Department of Transportation and High-Speed Rail }
      construction: { zh: 住房与无家可归者厅, en: Department of Housing and Homelessness }
      civil: { zh: 算法与民政厅, en: Department of Algorithms and Civil Affairs }
      labour: { zh: 劳动与自动化失业厅, en: Department of Labor and Automation Unemployment }
      health: { zh: 卫生与人类服务厅, en: Department of Health and Human Services }
      environment: { zh: 山火、干旱与环境厅, en: "Department of Wildfire, Drought and Environment" }
    councils:
      div_35n7cb:
        names: { zh: 市政董事会, en: City Board }
        mayor: { zh: 市长兼首席执行官, en: Mayor and Chief Executive Officer }
        deputy_mayor: {zh: "副市长兼首席运营官", en: "Deputy Mayor and Chief Operating Officer"}
        speaker: { zh: 董事会主席, en: Chair of the Board }
        notes:
          zh: "贝叶斯市没有市议会，只有市政董事会。7名董事由各选区居民直选，市长兼首席执行官由全市直选，每个季度要向董事会提交一份报告，格式和上市公司的财报一样。董事会在一座数据中心的会议室里开会，会议记录由模型实时生成，董事们会后只需点击「同意」。全市常住居民不多，大多是公司高管和他们的安保人员，投票率62.5%，在全州各市中仅次于离岸群岛。机器人出租车和送货机器人不是选民，但董事会每年都要讨论一次是否给它们投票权。"
          en: "Bayesian has no city council, only a City Board. Its seven directors are elected by the residents of their districts and the Mayor and Chief Executive Officer by the whole city, and every quarter the mayor reports to the board in the format of a listed company’s results. The board meets in a conference room in a data centre; a model writes the minutes as it goes, and afterwards the directors only have to click ‘Approve’. The city has few residents, mostly executives and their security staff, and its turnout of 62.5% is second only to the Offshore Islands among the state’s cities. Robotaxis and delivery robots are not voters, but every year the board debates whether to give them the vote."
      div_943qb5:
        names: { zh: 业主大会, en: Owners' Assembly }
        speaker: { zh: 大会主席, en: Chair of the Assembly }
        notes:
          zh: "离岸群岛市的市议会叫业主大会，名字来自岛上最早的业主委员会：群岛的土地几乎全属于少数几家控股公司，居民大多是这些公司的董事、管家和保镖。大会的7名代表由各选区居民直选，市长也由全市直选。投票站设在游艇俱乐部，投票率64.0%，是全州各市中最高的。大会的主要议题是码头费、直升机起降的时段和要不要让游客上岛，每一项都要先征求控股公司法律顾问的意见。"
          en: "The Offshore Islands call their council the Owners’ Assembly, after the islands’ first owners’ committee: almost all the land belongs to a few holding companies, and most residents are their directors, butlers and bodyguards. The assembly’s seven members are elected by the residents of their districts and the mayor by the whole city. The polling station is in the yacht club, and turnout, at 64.0%, is the highest of any city in the state. The assembly’s business is mostly harbour dues, helicopter landing hours and whether to let tourists ashore, and on each it first consults the holding companies’ lawyers."

