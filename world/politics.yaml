    slogan: {"zh": "海湾不是垃圾场", "en": "The bay is not a rubbish tip"}
    policies: [{"zh": "出口加工区的废水全部处理后才能排入海湾", "en": "Treat all wastewater from the export zone before it reaches the bay"}, {"zh": "海湾南岸的红树林划为保护区，禁止填海造地", "en": "Make the mangroves of the south shore a reserve, with no land reclaimed from the sea"}, {"zh": "首都修建轻轨，公交免费", "en": "Build a light railway in the capital and make public transport free"}, {"zh": "甘蔗和棉花种植园逐步减少农药用量", "en": "Cut pesticide use on the sugar and cotton plantations step by step"}]
    allies: ["pty_sba4y2"]
    targets: {"div_4f0pgt": 9}
    lean: {"young": 2.0, "urban": 0.8, "income": 0.2}
    notes: {"zh": "港口绿党是贝洛瓦国会的第四大党，也是全岛少有的环保政党。它的起点是海湾南岸的渔民和大学生发起的红树林保护运动，当时出口加工区的扩建计划要填掉一大片红树林。党首索阿·拉索洛是一位海洋生物学家，在首都大学研究珊瑚礁，她常带着记者乘船去看海湾里的白化珊瑚。党员约一万二千，大多是三十岁以下的年轻人。\n党的主张包括：出口加工区的废水全部处理后才能排入海湾；海湾南岸的红树林划为保护区，禁止填海造地；首都修建轻轨，公交免费；甘蔗和棉花种植园逐步减少农药用量。在社会问题上，绿党与公民联盟立场接近，支持难民权利和提高最低工资，但更强调「一个被污染的海湾不会让任何人富起来」。\n绿党在国会里是反对派，常与公民联盟一起投票。它成功推动了一项海湾水质监测法案，监测数据每天在网上公布，政府和企业都难以回避。自由党批评绿党的环保标准会让加工区失去竞争力，绿党则回应说，海湾节的游客和渔民的收入都依赖干净的海水。党内对是否加入公民联盟的政府一直有争论，有人担心联合执政会冲淡绿党的环保主张。\n港口绿党的组织是全岛最「平」的：党没有单一的党首，而是由一男一女两位发言人共同领导，拉索洛是其中之一，另一位是南岸的一位渔民。所有重大决定都由党员大会表决，党员大会每季度在海滩上或旧仓库里举行，任何党员都可以提出议案。党的候选人名单通过抽签和投票相结合的方式产生，以保证年轻人和渔民都有机会进入议会。党的经费来自党费和小额捐款，它不接受任何企业捐款，议员还须把一部分薪水捐给党。青年绿色网络在全国的中学里组织环保社团，每年发布一份「海湾健康报告」，报告里的水质、鱼群和红树林数据都由中学生和渔民一起采集。\n绿党的选民是年轻人和受过高等教育的城市居民，在大学城和海湾沿岸的老渔村最强。每月第一个星期六，党员和志愿者在海湾南岸清理海滩、种植红树林幼苗，活动结束后在渔村的小饭馆里一起吃烤鱼。党旗上半是绿色，下半是蓝色，中间以波浪线分开，绿色上一株白色的幼苗，象征从海边重新长出来的森林。", "en": "The Harbour Greens are the fourth party in Belova's Congress and one of the few green parties on the island. They began in a campaign by the fishers and students of the bay's south shore to save the mangroves, when plans to enlarge the export zone would have filled in a great stretch of them. Their leader, Soa Rasolo, is a marine biologist who studies coral reefs at the capital's university and often takes reporters out by boat to see the bleached coral in the bay. Most of their 12,000 or so members are under thirty. \nThey want all wastewater from the export zone treated before it reaches the bay; the mangroves of the south shore made a reserve, with no more land reclaimed from the sea; a light railway in the capital and free public transport; and pesticide use cut step by step on the sugar and cotton plantations. On social questions they stand close to the Civic Alliance, backing refugees' rights and a higher minimum wage, but they stress that 'a poisoned bay will make no one rich'. \nIn Congress the Greens sit in opposition and often vote with the Civic Alliance. They carried a law on monitoring the bay's water, whose readings are published online every day and are hard for government and business alike to ignore. The Liberals say Green standards would cost the export zone its edge; the Greens answer that the Bay Festival's visitors and the fishers' earnings both depend on clean water. Whether to join a Civic Alliance government is a long-running argument in the party, some fearing that governing would water down its green aims. \nThe Harbour Greens are the flattest party on the island: instead of a single leader they have two spokespeople, a woman and a man, Rasolo being one and a fisher from the south shore the other. Every important decision goes to a members' assembly, held each quarter on a beach or in an old warehouse, where any member may bring a motion. Candidate lists are drawn up by a mix of lot and vote so that the young and the fishers both have a chance of a seat. Money comes from dues and small gifts; it takes nothing from business, and its members of Congress give part of their pay to the party. The Young Greens Network runs green clubs in secondary schools across the country and publishes a Bay Health Report every year, its readings of water, fish and mangroves gathered by pupils and fishers together.\nTheir voters are the young and graduates of the city, and they are strongest in the university quarter and the old fishing villages along the bay. On the first Saturday of every month members and volunteers clean beaches and plant mangrove seedlings on the south shore, and afterwards eat grilled fish together in a village eating house. Their flag is green over blue, divided by a wavy line, with a white seedling on the green, the forest growing back from the shore."}
    history: {"zh": "港口绿党由红树林保护运动的渔民、学生和科学家组建。运动成功阻止了填海计划后，参与者决定组成政党，把环保议题带进国会。", "en": "The Harbour Greens were formed by the fishers, students and scientists of the mangrove campaign. Once the campaign had stopped the reclamation, its members decided to form a party and take green causes into Congress."}
    flag_notes: {"zh": "党旗上半是绿色，下半是蓝色，以波浪线分开，绿色中有一株白色的幼苗。绿色是红树林，蓝色是海湾，幼苗是新生。", "en": "The flag is green over blue, divided by a wavy line, with a white seedling on the green. The green is the mangroves, the blue the bay, the seedling new growth."}
    factions: [{"names": {"zh": "红树林派", "en": "Mangrove Wing"}, "notes": {"zh": "渔民和环保组织，最关心海湾的水质、红树林和渔业资源。", "en": "Fishers and conservation groups, who care most about the water of the bay, the mangroves and the fish."}}, {"names": {"zh": "城市派", "en": "City Wing"}, "notes": {"zh": "首都的年轻人和大学生，关心公共交通、住房和气候，主张与公民联盟联合执政。", "en": "The young people and students of the capital, concerned with transport, housing and the climate, who favour governing with the Civic Alliance."}}]
    organisation: {"newspaper": {"zh": "《潮汐》网刊", "en": "Tide (online)"}, "think_tank": {"zh": "海湾生态研究所", "en": "Bay Ecology Institute"}, "unions": {"zh": "南岸渔民协会", "en": "South Shore Fishers' Association"}}
  - id: "pty_98adzp"
    names: {"zh": "基督教民主联盟", "en": "Christian Democratic Union"}
    short_names: {"zh": "基民盟", "en": "CDU"}
    color: "#0B6E4F"
    flag: {"layout": "banner", "colors": ["#0B6E4F", "#FFFFFF"], "division": "bordure", "charge": "cross", "charge_color": "#FFFFFF"}
    spectrum: 0.8
    family: {"zh": "基督教民主", "en": "Christian democratic"}
    ideology: [{"zh": "基督教民主主义", "en": "Christian democracy"}, {"zh": "君主立宪", "en": "Constitutional monarchism"}, {"zh": "社会市场经济", "en": "Social market economy"}]
    axes: {"econ": 5.5, "galtan": 6.5, "autonomy": 5.0, "green": 6.0}
    leader: {"zh": "里沃·拉乔纳", "en": "Rivo Rajaona"}
    members: 26000
    youth_wing: {"zh": "青年联盟", "en": "Young Union"}
    slogan: {"zh": "信仰、家庭与王国", "en": "Faith, family and kingdom"}
    policies: [{"zh": "家庭补贴和带薪育儿假延长到一年", "en": "Extend family allowances and paid parental leave to a year"}, {"zh": "旅游收入的一部分用于保护乡村教堂和历史小镇", "en": "Put part of the tourist revenue into the village churches and old towns"}, {"zh": "海军继续搜救难民船，难民由教会和社区安置", "en": "Keep the navy rescuing refugee boats, with churches and communities settling the refugees"}, {"zh": "渔业配额向本地小渔船倾斜", "en": "Favour local small boats in the fishing quotas"}]
    allies: ["pty_8d0gjg"]
    targets: {"div_78xf6t": 38}
    lean: {"old": 1.5, "income": 0.3, "urban": -0.2}
    notes: {"zh": "基督教民主联盟是米拉卡王国议会的第一大党，现任首相里沃·拉乔纳是党的领袖。他出身于首都一个圣公会牧师家庭，当过中学校长和旅游大臣，以温和、稳重著称。基民盟与王国党组成联合政府，两党都拥护君主立宪，在家庭和信仰问题上看法相近。党员约二万六千，在一个八十万人口的国家里，这是一个相当大的数字。\n党的思想来自欧洲的基督教民主传统，又融入了米拉卡的王室和乡村文化。它主张家庭补贴和带薪育儿假延长到一年；旅游收入的一部分用于保护乡村教堂和历史小镇；海军继续在海上搜救难民船，难民由教会和社区负责安置；渔业配额向本地的小渔船倾斜。在外交上，基民盟支持王国留在圣约同盟，但坚持米拉卡的温和立场，多次促成交战各方在首都的谈判。\n基民盟上一次与社会自由党组成大联合政府时，推动了难民接待中心的建设和一项新的渔业法，但两党在税收和教会学校上的争吵最终让联合破裂。此后它转而与王国党联合，基民盟掌握财政、国防、教育和内政等大部分部门，王国党负责卫生和自然资源，外交和司法两部则由无党派人士主持。社会自由党批评基民盟「把王国交给了保守派」，基民盟则说，稳定的政府比完美的政府更重要。\n基民盟的组织以教区和乡镇为基础，每个教区都有一个党的小组，小组每月在教堂的会堂里开会，会后一起喝茶、吃点心。党首由全国大会选出，传统上须是一位虔诚的教会成员，但章程并没有写明这一点。党的候选人名单由各选区的党员投票排序，再由全国委员会调整，以保证新教徒和天主教徒、男子和女子都有代表。党的经费来自党费、小额捐款和教会社团的义卖，它也接受一部分离岸服务业的捐款，社会自由党常就此批评它。青年联盟每年组织去难民接待中心的志愿服务，也在乡村教堂里组织青年诗班。\n基民盟的选民是年长者、乡村和小镇的居民，以及新教和天主教的教会成员。每年国王生日的前一天，党在首都的圣公会大教堂举行感恩礼拜，然后在教堂草坪上举办茶会，首相亲自给老人们倒茶。党旗是深绿色的旗面，四周一圈白色边框，中间一个白色十字，绿色是王国的田野和森林，白色十字代表信仰。", "en": "The Christian Democratic Union is the largest party in the Kingdom of Miraka's parliament, and its leader, Rivo Rajaona, is Prime Minister. He comes from the family of an Anglican vicar in the capital, was a headmaster and then tourism minister, and is known for being calm and steady. The CDU governs with the Kingdom Party; both uphold the constitutional monarchy and see eye to eye on family and faith. With some 26,000 members it is a large party for a country of 800,000. \nIts thinking comes from the Christian democratic tradition of Europe, blended with Miraka's royal and village culture. It wants family allowances and paid parental leave extended to a year; part of the tourist revenue spent on the village churches and old towns; the navy to keep rescuing refugee boats, with churches and communities settling the refugees; and the fishing quotas weighted towards local small boats. Abroad it keeps the kingdom in the Covenant League but holds to Miraka's moderate line, and has more than once brought the warring sides to talks in the capital. \nThe last time the CDU governed in a grand coalition with the Social Liberals, it built the refugee reception centre and passed a new fisheries law, but quarrels over tax and church schools finally broke the coalition. Since then it has governed with the Kingdom Party: the CDU holds most ministries, finance, defence, education and the interior among them, the Kingdom Party holds health and natural resources, and foreign affairs and justice are run by non-party ministers. The Social Liberals say the CDU has 'handed the kingdom to the conservatives'; the CDU says a stable government matters more than a perfect one. \nThe CDU is organised by parish and village: every parish has a party group that meets monthly in the church hall, with tea and cakes afterwards. The national congress elects the leader, who by tradition is a devout churchgoer, though the rules do not say so. Candidate lists are ranked by members' votes in each constituency and then adjusted by the national committee so that Protestants and Catholics, women and men all have a place. Money comes from dues, small gifts and church fêtes, and it also takes some donations from offshore services, for which the Social Liberals often criticise it. The Young Union volunteers at the refugee reception centre every year and runs youth choirs in the village churches.\nIts voters are older people, the people of the villages and small towns, and the members of the Protestant and Catholic churches. On the eve of the King's birthday each year the party holds a service of thanksgiving in the Anglican cathedral of the capital, followed by tea on the cathedral lawn, where the Prime Minister himself pours for the elderly. Its flag is dark green with a white border and a white cross: the green is the kingdom's fields and woods, the cross the faith."}
    history: {"zh": "基督教民主联盟由大分裂时请王室登基的教会领袖和群岛议员创立。王国成立后，它起草了宪法中关于家庭和教会的条款，此后长期是议会中最大的政党。", "en": "The Christian Democratic Union was founded by the church leaders and island councillors who asked the royal family to take the throne in the Sundering. Once the kingdom was founded it drafted the constitution's clauses on the family and the church, and it has long been the largest party in parliament."}
    flag_notes: {"zh": "党旗是深绿色的旗面，四周一圈白色边框，中间一个白色十字。绿色是王国的田野和森林，十字是信仰，边框代表守护。", "en": "The flag is dark green with a white border and a white cross. The green is the kingdom's fields and woods, the cross the faith and the border protection."}
    factions: [{"names": {"zh": "圣公会派", "en": "Anglican Wing"}, "notes": {"zh": "圣公会教区和乡村士绅，最关心教会学校、乡村教堂和王室传统。", "en": "The Anglican parishes and country gentry, who care most about church schools, village churches and royal tradition."}}, {"names": {"zh": "社会派", "en": "Social Wing"}, "notes": {"zh": "天主教徒和年轻党员，关心难民安置、育儿假和住房，主张与社会自由党合作。", "en": "Catholics and younger members, concerned with refugee settlement, parental leave and housing, who favour working with the Social Liberals."}}]
    organisation: {"newspaper": {"zh": "《王国周报》", "en": "Kingdom Weekly"}, "think_tank": {"zh": "家庭与社会研究所", "en": "Institute for Family and Society"}, "women": {"zh": "基督教妇女联合会", "en": "Christian Women's Union"}}
