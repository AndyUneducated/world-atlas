    allies: []
    targets: { div_fbfqv9: 7, div_raat4g: 4, div_hpmerr: 6, div_nwm019: 4 }
    lean: { urban: -0.4, income: -0.4, old: 1.0, fishing: 0.3, mining: 0.3, logistics: 0.2, "lang:en": -1.0 }
    notes:
      zh: "岛民之声爱国阵线（简称岛声）是一个右翼民粹政党。它原名岛民之声，改名时加上「爱国阵线」，党内的说法是要把各个领地里觉得自己被首府忽视的人联合成一条阵线；批评者则认为，新名字把一个靠反对燃油税起家的抗议党推得更靠右了。它主张重大开支和税率调整须经全领地公投，降低燃油税和渡轮票价，外来人口的年度配额与住房和学位的供应挂钩，加重对盗窃、破坏公物和醉驾的处罚，并冻结议员薪酬、把议员人数减少三成。党内的张力在于：它一面要把更多决定交给公投，让普通人直接拍板，一面又要加强治安和管理；它的选民里既有想要更少政府的人，也有想要更强政府的人。\n岛声在四个领地都有候选人。在北维京岛，它以7.0%的得票拿下8席；在北冰洋，它以5.6%的得票拿下4席；在长夏群岛，它以4.0%的得票拿下6席；在维京群岛的单一选区制下，它3.8%的选票没有换来议席。它没有友党，也不在任何领地政府之中，它乐于以「唯一真正的反对派」自居。它在议会里的作用更多在于设定议题：燃油税和渡轮票价每次被提上议程，其他政党都得回应它的提案，一些偏远岛屿的渡轮票价补贴就是在它反复质询之后才被政府列入预算的。批评者指责它的配额主张把住房紧张的账算到了外来者头上，它则回答说，自己只是要求人口增长与房子和学位同步。\n岛声的支持者多在偏远渔港、矿区和物流城镇，乡村选民、低收入者和年长选民是它的基本盘，许多人觉得首府的政策离自己很远；大城市、收入较高的街区和英语母语者多的地区则很少投给它。渔港的选民对燃油价格格外敏感，油价一涨，一条渔船整季的辛苦就可能白费，这正是岛声的主张最能打动人的地方。在北维京岛的雅利基卢克市议会，它在24席中占4席；而在维京港这样的大港城，它在55席中只有3席。在长夏群岛，它在基鲁迈、纳卢迈等城市的议会里比在萨伦纳姆更有分量。\n党主席马铁山原是一名长途卡车司机，以在议会里拿出自己的加油小票质询燃油税出名。岛声的竞选集会常在港口的鱼市散场后举行，台下的人一边听一边吃刚出锅的炸鱼。它的议员每月要回到自己的选区开一次「拍桌会」，任何选民都可以当面拍着桌子提意见，议员必须当场记下来，记录本要在下一次拍桌会上念给大家听，没有回音的意见会被红笔圈出来。"
      en: "Islanders’ Voice Patriotic Front (Islanders’ Voice for short) is a right-wing populist party. It was once simply Islanders’ Voice; the party says it added ‘Patriotic Front’ to unite everyone, in every territory, who feels the capital has forgotten them, while critics say the new name pushed a protest party born of a fuel-duty revolt further to the right. It wants referendums across the territory on major spending and tax rates, lower fuel duty and ferry fares, a yearly quota of newcomers tied to the supply of homes and school places, tougher penalties for theft, vandalism and drink-driving, a freeze on members’ pay and a cut of three-tenths in the number of members of parliament. Its tension lies here: it wants more decisions handed to referendums so ordinary people can settle them directly, yet it also wants firmer policing and control, and its voters include both people who want less government and people who want stronger government.\nIslanders’ Voice stands in all four territories. On North Viking Island it won 8 seats on 7.0% of the vote; in the Arctic Ocean, 4 seats on 5.6%; in the Everlong Summer Islands, 6 seats on 4.0%; under the Viking Islands’ single-member seats its 3.8% brought no seat. It has no allied parties and no place in any territorial government, and is happy to call itself ‘the only real opposition’. Its influence in parliament lies mostly in setting the agenda: whenever fuel duty or ferry fares come up, the other parties have to answer its proposals, and some ferry fare subsidies for remote islands found their way into the budget only after its repeated questioning. Critics accuse it of blaming newcomers for the housing shortage with its quota; it replies that it asks only that population grow in step with homes and school places.\nIts supporters are mostly in remote fishing harbours, mining towns and haulage towns; rural voters, people on low incomes and older voters are its core, many of whom feel the capital’s policies are a long way off. Big cities, better-off districts and areas with many native English speakers rarely vote for it. Fishing harbours are acutely sensitive to fuel prices, since one rise can wipe out a boat’s whole season of work, and that is where the party’s message lands hardest. On the Jaalikiluk city council on North Viking Island it holds 4 of the 24 seats, while in a big port such as Viking Port it has just 3 of 55. In the Everlong Summer Islands it carries more weight on councils such as Kirumai and Nalumai than in Sarunnam.\nIts chair, Ma Tieshan, was a long-haul lorry driver and made his name by producing his own fuel receipts in parliament to question the duty. The party’s rallies are often held in a harbour fish market once trading ends, the crowd eating fish fresh from the fryer as they listen. Each of its members of parliament holds a monthly table-thumping meeting back home, where any voter may thump the table and speak their mind and the member must write it all down on the spot; the notebook is read aloud at the next meeting, and any complaint still without an answer is circled in red."
    history:
      zh: "岛民之声爱国阵线起于北维京岛一场反对上调燃油税的车队请愿，参加请愿的卡车司机、渔民和矿工后来组成了政党，最初叫岛民之声，随后在其他领地的渔港和矿区也有了支部。随着它在北维京岛、北冰洋和长夏群岛的议会都拿到议席，党内主张把各地支持者联合成一条阵线的一派占了上风，党名加上了「爱国阵线」。"
      en: "Islanders’ Voice Patriotic Front began with a convoy petition on North Viking Island against a rise in fuel duty; the lorry drivers, fishers and miners who took part went on to form a party, at first called simply Islanders’ Voice, and branches followed in the fishing harbours and mining towns of the other territories. Once it had won seats in the North Viking Island, Arctic Ocean and Everlong Summer parliaments, the wing that wanted to bind its supporters everywhere into a single front won the argument, and ‘Patriotic Front’ was added to the name."
    flag_notes:
      zh: "党旗由褐色和米色两道竖条组成，靠旗杆的褐色条较窄，较宽的米色条上是一只褐色号角。褐色代表渔船的木板、矿区的泥土和卡车的轮胎印，米色代表晒网的沙滩；号角来自车队请愿时司机们一齐鸣笛的场面，意思是让偏远地方的声音也能传到首府。"
      en: "The flag has two vertical bands, a narrower brown one at the hoist and a broader cream one bearing a brown horn. The brown is the planking of fishing boats, the soil of the mines and the tyre tracks of lorries; the cream is the beach where nets are spread to dry. The horn recalls the convoy petition, when the drivers sounded their horns together, and means that voices from remote places should carry all the way to the capital."
    factions:
      - names: { zh: "拍桌派", en: "Table-Thumpers" }
        notes: { zh: "直接民主派，主张重大开支和税率由公投决定、议员薪酬冻结、议员人数减少三成，以「拍桌会」为招牌，代表那些对首府政治感到失望的偏远选民。", en: "The direct democrats, who want major spending and tax rates settled by referendum, members’ pay frozen and the number of members cut by three-tenths. The table-thumping meeting is their trademark, and they speak for remote voters disillusioned with the capital’s politics." }
      - names: { zh: "秩序派", en: "Order Wing" }
        notes: { zh: "主张加重对盗窃、破坏公物和醉驾的处罚，加强社区治安，并把外来人口配额与住房和学位严格挂钩，立场较硬，常被其他政党点名批评。", en: "Wants tougher penalties for theft, vandalism and drink-driving, firmer local policing and a newcomer quota strictly tied to homes and school places. Its harder line draws frequent criticism by name from other parties." }
      - names: { zh: "渔港圈", en: "Harbour Circle" }
        notes: { zh: "以渔民、矿工和物流司机为主，关心燃油税、渡轮票价和偏远岛屿的交通，更像一个经济利益团体，对身份议题兴趣不大，偶尔愿意在具体议题上与其他政党投同一张票。", en: "Mainly fishers, miners and haulage drivers concerned with fuel duty, ferry fares and transport to remote islands. More an economic interest group than an ideological one, it has little interest in identity questions and will occasionally vote with other parties on specific measures." }
    organisation:
      newspaper: { zh: "《拍桌报》", en: "The Table-Thumper" }
      think_tank: { zh: "岛民政策研究会", en: "Islanders’ Policy Society" }
      unions: { zh: "长途货运司机协会、近海渔民联合会", en: "Long-Haul Drivers’ Association, Inshore Fishers’ Union" }
      women: { zh: "岛民妇女之声", en: "Islanders’ Women’s Voice" }

  - id: pty_fn97vt
    names: { zh: 开源党, en: Open Source Party }
    short_names: { zh: 开源, en: "Open Source" }
    color: "#6D6875"
    flag: { layout: banner, colors: ["#3D3A4B"], charge: brackets, charge_color: "#9EF0B5" }
    spectrum: -0.6
    family: { zh: 自由派, en: Liberal }
    ideology: [{ zh: 数字权利, en: Digital rights }, { zh: 开放政府, en: Open government }, { zh: 公民自由主义, en: Civil libertarianism }]
    axes: { econ: 4.0, galtan: 1.0, autonomy: 4.0, green: 4.0 }
    leader: { zh: 利维奥·塞兰迪, en: Livio Serrandi }
    members: 9800
    youth_wing: { zh: 分叉社, en: The Fork }
    slogan: { zh: 公开的代码，公开的政府, en: "Open code, open government" }
    policies:
      - { zh: 政府采购的软件一律开源，源代码公开托管, en: "All software the government buys to be open source, its code published" }
      - { zh: 个人数据未经本人同意不得跨机构共享, en: No sharing of personal data between agencies without consent }
      - { zh: 全民免费的基础宽带和公共算力配额, en: Free basic broadband and a public computing allowance for everyone }
      - { zh: 议会表决记录以机器可读格式实时公开, en: "Publish parliamentary votes live in machine-readable form" }
    allies: [pty_2033kv, pty_ymxc2s]
    targets: { div_fbfqv9: 3, div_raat4g: 1.5, div_hpmerr: 2.6, div_nwm019: 2 }
    lean: { datacenter: 0.6, tech: 0.5, digital: 0.6, young: 3.0, urban: 0.2 }
    notes:
      zh: "开源党把数字权利当作全部政治的起点。它的四条主张——政府采购的软件一律开源、个人数据未经本人同意不得跨机构共享、全民免费的基础宽带和公共算力配额、议会表决记录以机器可读格式实时公开——看似技术细节，背后是一套完整的权力观：政府应当像公开的代码一样谁都能检查，公民的私人生活则应当像加密的文件一样谁也打不开。党内大部分争论就卡在这两半之间。要求政府彻底透明的人和要求数据绝对保密的人常在同一份提案上撞车：公开官员的会面记录算透明，公开来访者的姓名算不算侵犯隐私？主张免费宽带和公共算力的人希望领地出钱建网、建机房，党内的公民自由主义者却担心政府手里的算力越多，监控的本事就越大。党纲在经济上略偏左，社会议题上极其开放，在领地自治与中央统筹之间不愿多表态，党内的说法是「先把接口定义清楚，再谈谁来运行」。\n在北维京岛，开源党在领地议会选举中拿到百分之三的选票，离百分之五的门槛还差一截；在维京群岛的单议席选区里只有百分之一点四，在北冰洋得到百分之二点四，也没有进入议会。它真正坐进议会的地方是长夏群岛，那里的分区比例代表制让它以百分之二的选票拿到一个议席，在一百二十一席里是孤零零的一票，却常在信息公开和数据保护的条款上成为各方争取的对象。长夏群岛的城市和公社议会里，除了按岛分区选举的基鲁迈联合邦议会，都有它的议员，北冰洋的图利瓦克市议会里也有两席。它在哪里都不执政，却练出一套在野的本事：把市政预算拆成表格放上网，逐项标注每笔采购用的是开源还是闭源软件，让执政党自己去解释。几座城市的议事规则因此加上了「表决结果当晚公开」的条款，这是它常拿出来说的政绩；批评者则说，它擅长挑错，却从没为一份完整的预算负过责。\n它的选民地图几乎就是一张光纤地图：城市、大学城、数据中心和信息技术企业集中的地方得票高，乡村几乎看不到它。北维京岛的票分散在各个城市，哪里都差一点，岛上的市议会里至今没有它的席位。党内因此把降低门槛列为头号制度议题，常和别的小党一起算账：北维京岛上一次选举中，没跨过门槛的各党加起来拿到了将近四分之一的选票。党名和口号「公开的代码，公开的政府」都取自软件世界的说法，党员说党旗上那对括号中间的空白，是留给每个公民去填写的。\n开源党的政治文化格外出名。党章托管在公开的代码仓库里，任何党员都可以提交修改，经全体投票后合并；党代会的议程也要先「提交」、再「审阅」、最后「合并」。表决软件由党员自己编写、会前公开审计，有人笑说开源党开会一半时间在修投票程序的漏洞。青年组织「分叉社」取名自代码仓库的「分叉」：不同意就另起一支，做得好再合回来。大会闭幕前，总书记方海宁要把本次合并的修改逐条念一遍，念到最后一条，全场齐喊「已合并」。"
      en: "The Open Source Party takes digital rights as the starting point for all of its politics. Its four demands — open-source software for everything the government buys, no sharing of personal data between agencies without consent, free basic broadband and a public computing allowance for all, and parliamentary votes published live in machine-readable form — look like technicalities, but they rest on a whole view of power: government should be open to inspection like public code, while a citizen's private life should be as sealed as an encrypted file. Most of the party's arguments sit on the seam between those two halves. Members who want total transparency in government and members who want absolute secrecy for personal data often collide over the same motion: publishing officials' meeting logs is transparency, but is publishing the names of their visitors an invasion of privacy? Those who want free broadband and public computing would have the territory pay for networks and server halls, while the party's civil libertarians worry that the more computing power a government holds, the better it gets at surveillance. The programme leans slightly left on economics, is thoroughly open on social questions and says little about home rule versus central coordination; as members put it, define the interface first, then argue about who runs it.\nIn North Viking Island the party took three per cent at the territorial election, well short of the five-per-cent threshold; in the Viking Islands' single-member seats it won 1.4 per cent, and in the Arctic Ocean 2.4 per cent, again without entering parliament. The one parliament it actually sits in is the Everlong Summer Islands', where regional proportional representation turned two per cent of the vote into a seat: a lone vote among 121, but one the other parties often court on clauses about freedom of information and data protection. It has councillors on every city and commune council of the Everlong Summer Islands except the Commonwealth Assembly of Kirumai, which is elected island by island, and two seats on Tullivaq's council in the Arctic Ocean. It governs nowhere, but it has learned the craft of opposition: it breaks municipal budgets into spreadsheets, posts them online and marks every purchase as open or closed software, leaving the governing parties to explain themselves. Several councils have since added a rule that results are published the same evening, an achievement it likes to cite; critics reply that it is good at finding faults but has never had to answer for a whole budget.\nIts electoral map is practically a fibre-optic map: strong in cities, university towns and places full of data centres and IT firms, nearly invisible in the countryside. In North Viking Island its vote is spread across the cities and falls just short everywhere, so it still holds no council seat on the island. That is why the party ranks a lower threshold as its first institutional cause, and it likes to do the sums with other small parties: at North Viking Island's last election, the parties that missed the threshold won nearly a quarter of the vote between them. The name and the slogan, open code, open government, both come from the language of software, and members say the blank space between the brackets on the flag is left for every citizen to fill in.\nThe party is famous for its political culture. Its constitution lives in a public code repository where any member may propose a change, merged after a vote of all members, and even the congress agenda must be committed, reviewed and merged. The voting software is written by members and publicly audited before every congress, and people joke that half of any Open Source meeting is spent fixing bugs in the voting procedure. The youth wing, The Fork, is named after forking a repository: if you disagree, branch off, and if you do it well, merge back. Before each congress closes, General Secretary Fang Haining reads out every change merged that session, and at the last one the hall answers together: merged."
    history:
      zh: "开源党由北冰洋数据中心的工程师和北维京岛科学城的程序员在网上共同发起。发起人起初只想写一份政府软件开源的倡议书，后来发现倡议书没人签收，才决定自己组党。第一次党代会完全在线上召开，表决用的软件也是党员自己写的，开票前先把源代码公开给所有人检查。此后它在长夏群岛的大学城和各市议会里扎下根，并在那里赢得了它在领地议会里的议席。"
      en: "The party was started online by data-centre engineers in the Arctic Ocean and programmers in North Viking Island's Science City. Its founders at first only meant to write a petition for open-source government software; when nobody would receive it, they decided to found a party themselves. The first congress was held entirely online, on voting software members had written, and the source code was opened to everyone for inspection before the count. The party later took root in the university towns and city councils of the Everlong Summer Islands, where it won its seat in a territorial parliament."
    flag_notes:
      zh: "开源党的党旗是深灰紫色的纯色旗面，中间一对薄荷绿的代码括号。深灰紫取自程序员熟悉的深色编辑器背景，薄荷绿是终端里字符的颜色。括号在代码里用来圈出一段可以被调用、也可以被检查的内容，党员说它象征「把权力放进括号」：公开、有边界、谁都能读。括号中间故意留白，意思是内容由公民来写。"
      en: "The flag is a plain field of dark slate-purple with a pair of mint-green code brackets in the centre. The dark field recalls the dark editor screens programmers know, and the mint green is the colour of text on a terminal. In code, brackets enclose a block that can be called and also inspected, and members say they stand for putting power in brackets: public, bounded and readable by anyone. The space between them is deliberately empty, because the content is for citizens to write."
    factions:
      - names: { zh: "主干派", en: "Mainline Caucus" }
        notes: { zh: "主张把开源党办成一个能谈判、能妥协的正常议会党，与绿脉党、灯塔自由民主党协调选举名单，必要时联合竞选以跨过门槛。成员多是年长的工程师和长夏群岛的市议员。", en: "Wants Open Source run as an ordinary parliamentary party that can negotiate and compromise, coordinating lists with Greenvein and the Lighthouse Liberal Democrats and running jointly if that is what it takes to clear the threshold. Its members are mostly older engineers and councillors in the Everlong Summer Islands." }
      - names: { zh: "隐私优先论坛", en: "Privacy First Forum" }
        notes: { zh: "党内的公民自由主义核心，认为数据保护高于一切，对政府出资建设公共算力和统一数字身份心存戒备，反对任何以安全为名的数据汇集。代表人群是律师、记者和网络安全研究者。", en: "The party's civil-libertarian core, which puts data protection above everything else, is wary of state-funded public computing and unified digital identity, and opposes any pooling of data in the name of security. It draws on lawyers, journalists and security researchers." }
      - names: { zh: "公共算力圈", en: "Public Compute Circle" }
        notes: { zh: "党内偏左的一翼，把免费宽带和公共算力看作新的公共设施，主张由领地投资建网、建机房，并对平台企业征税。成员多是大学生、分叉社的骨干和数据中心的一线技术员。", en: "The party's left wing, which sees free broadband and public computing as the new public utilities and wants the territory to build networks and server halls and to tax platform companies. Its members are mostly students, activists from The Fork and frontline data-centre technicians." }
    organisation:
      newspaper: { zh: "《提交日志》", en: "The Commit Log" }
      think_tank: { zh: "开放协议研究所", en: "Open Protocol Institute" }
      unions: { zh: "数据中心技术员协会", en: "Data Centre Technicians' Association" }
      women: { zh: "开源女性网络", en: "Open Source Women's Network" }
  - id: pty_x004cm
    names: { zh: 渔农党, en: Fishers and Farmers Party }
    short_names: { zh: 渔农, en: "Fish & Farm" }
