    notes: {"zh": "基督教人民党是安博哈拉的天主教基督教民主政党，也是联邦第二大党和最大的反对党。它代表高原城市和东南沿海的天主教徒，党首米亚利·拉科托出身于首都一个教师家庭，当过天主教学校的校长，是联邦政坛少有的女性党首。在最近一次总统选举中，她进入第二轮，最终输给了家园党的拉沃哈西。党员约十八万，许多是教会合作社、天主教工会和慈善组织的成员。\n党的思想来自天主教社会教义：人的尊严高于市场，也高于国家。它主张最低工资与物价挂钩，由教会、雇主和工会共同参与工资谈判；每个联邦市设一所免费诊所；学校和医院交给联邦市自主管理，联邦政府只制定标准和拨款。在战争问题上，人民党支持维持军队和停火线，但主张开放家庭团聚的通道，让被停火线分开的亲人每年能在安巴罗托管地的监督下见一次面。这一主张被家园党批评为「天真」，却在战争难民和边境城镇的家庭中很受欢迎。\n人民党与家园党同属圣约同盟的支持者，在反对堕胎和同性婚姻上立场一致，但在税收和福利上分歧明显。家园党执政时，人民党常常与联邦自由党一起在议会里反对削减社会开支，又在家庭政策上与家园党联手投票，政治评论员称之为「一半在走廊这边，一半在走廊那边」。党内也有人主张与家园党组成大联合，认为联邦需要两大基督教政党一起面对北方的威胁。\n基督教人民党的党首由全体党员直接投票选出，这在联邦各党中是唯一的。党的章程规定，候选人名单中男女交替排列，每个联邦市的名单中至少要有一名工会代表和一名教会合作社的代表。党的经费来自党费、天主教合作社银行的贷款和小额捐款，它拒绝接受军火公司的捐款，这一规定在党内也有争议。党与海外的基督教民主党派保持联系，每年派年轻党员去学习社会市场经济和地方自治的经验。\n人民党的票仓在城市、受过教育的选民和年轻人中，首都的大学城和瓦凡博港的工人区都是它的据点。每年圣诞节前，党在全国各地的教堂和市场组织「人民的餐桌」募捐，党员为难民营和孤儿院送去食物和衣物。党的徽记是一只衔着橄榄枝的白鸽，党员见面时常说一句「愿你平安」。支持者说人民党是联邦的良心，反对者则说它太软弱，不配在战时执政。", "en": "The Christian People's Party is the Catholic Christian democratic party of Ambohara, the federation's second party and the largest in opposition. It speaks for the Catholics of the highland cities and the south-east coast. Its leader, Mialy Rakoto, grew up in a teacher's family in the capital and was headmistress of a Catholic school; she is one of the few women to lead a party in federal politics. In the last presidential election she reached the second round and lost to Ravohasy of the Homeland Party. Its 180,000 or so members are often members of church cooperatives, Catholic unions and charities too. \nIts thinking comes from Catholic social teaching: human dignity stands above the market and above the state. It wants the minimum wage linked to prices and set in talks among churches, employers and unions; a free clinic in every federal city; and schools and hospitals run by the federal cities themselves, the federation setting standards and paying. On the war it backs the army and the ceasefire line, but wants a crossing for divided families, so that relatives separated by the line can meet once a year under the eye of the Ambaro Trust Territory. Homeland calls this naive, but it is popular among war refugees and the families of the border towns. \nThe Christian People's Party, like Homeland, supports the Covenant League and agrees with it in opposing abortion and same-sex marriage, but the two differ sharply on taxes and welfare. With Homeland in power, the People's Party often joins the Federal Liberals in the Assembly against cuts in social spending, then votes with Homeland on family policy; commentators say it has 'one foot on each side of the aisle'. Some in the party want a grand coalition with Homeland, arguing the federation needs both great Christian parties together against the threat from the north. \nThe Christian People's Party elects its leader by a direct vote of all members, the only federal party to do so. Its rules alternate women and men on candidate lists, and each federal city's list must include at least one union member and one from the church cooperatives. Money comes from dues, loans from the Catholic cooperative bank and small gifts; it refuses donations from arms makers, a rule argued over inside the party too. It keeps in touch with Christian democratic parties abroad and sends young members each year to study the social market economy and local self-government.\nIts vote lies in the cities, among graduates and the young; the university quarter of the capital and the workers' districts of Vavambo port are its strongholds. Before Christmas each year the party holds 'The People's Table' collections in churches and markets across the country, and members take food and clothing to refugee camps and orphanages. Its emblem is a white dove with an olive branch, and members greet each other with 'peace be with you'. Supporters call it the conscience of the federation; opponents say it is too soft to govern in wartime."}
    history: {"zh": "基督教人民党起源于联合共和国时期的天主教工人运动和教会合作社。大分裂后，天主教会与福音派教会一起参加了制宪会议，但在社会政策上意见不同，天主教的政治团体于是单独组党，与家园党轮流执政。", "en": "The Christian People's Party has its origins in the Catholic workers' movement and church cooperatives of the United Republic. After the Sundering the Catholic Church sat in the constituent assembly alongside the evangelical churches, but the two differed on social policy, so the Catholic political groups formed a party of their own, which has taken turns in government with Homeland."}
    flag_notes: {"zh": "党旗是酒红色的旗面，四周是一圈米白色的边框，中央是一只米白色的白鸽。酒红色是天主教的祭衣色，白鸽代表和平与圣灵。", "en": "The flag is wine red with a cream border and a cream dove in the middle. The wine red is the colour of Catholic vestments; the dove is peace and the Holy Spirit."}
    factions: [{"names": {"zh": "工会派", "en": "Union Wing"}, "notes": {"zh": "天主教工会和瓦凡博港的工人党员，主张提高最低工资、加强劳动保护，是党内最靠左的一派。", "en": "Catholic unions and the dockers of Vavambo, who want a higher minimum wage and stronger labour protection; the party's left wing."}}, {"names": {"zh": "主教团派", "en": "Bishops' Wing"}, "notes": {"zh": "与主教团关系密切的党员，最关心教会学校、家庭政策和与家园党的合作，主张两大基督教政党联合执政。", "en": "Members close to the bishops, who care most about church schools and family policy and favour a grand coalition of the two Christian parties."}}]
    organisation: {"newspaper": {"zh": "《人民之声》", "en": "People's Voice"}, "unions": {"zh": "天主教工人联合会", "en": "Federation of Catholic Workers"}, "women": {"zh": "基督教母亲会", "en": "Christian Mothers' Union"}}
  - id: "pty_1pt8ss"
    names: {"zh": "高原农民党", "en": "Highland Farmers' Party"}
    short_names: {"zh": "农民党", "en": "Farmers"}
    color: "#3E7C2F"
    flag: {"layout": "bands", "colors": ["#3E7C2F", "#E3B23C"], "charge": "wheat", "charge_band": 0, "charge_color": "#E3B23C"}
    spectrum: 1.6
    family: {"zh": "农业保守主义", "en": "Agrarian conservative"}
    ideology: [{"zh": "农业主义", "en": "Agrarianism"}, {"zh": "地方自治", "en": "Localism"}, {"zh": "社会保守主义", "en": "Social conservatism"}]
    axes: {"econ": 4.0, "galtan": 7.5, "autonomy": 3.0, "green": 6.0}
    leader: {"zh": "埃里·兰德里亚", "en": "Hery Randria"}
    members: 95000
    youth_wing: {"zh": "农村青年会", "en": "Rural Youth"}
    slogan: {"zh": "稻田养活联邦", "en": "The paddies feed the federation"}
    policies: [{"zh": "稻米和咖啡实行保护价收购，干旱年由联邦补贴种子和化肥", "en": "Guarantee rice and coffee prices, with seed and fertiliser paid for in drought years"}, {"zh": "瘤牛放牧地归村社所有，不得出售给外国公司", "en": "Keep zebu pastures in village hands, never to be sold to foreign companies"}, {"zh": "每个乡镇修一条通往联邦公路的全天候道路", "en": "Build an all-weather road from every rural district to the federal highway"}, {"zh": "退伍军人优先分配国有荒地", "en": "Give veterans first claim on state wasteland"}]
    allies: ["pty_ndaaxe"]
    targets: {"div_mj41d0": 15}
    lean: {"agriculture": 1.2, "urban": -0.6, "old": 1.0}
    notes: {"zh": "高原农民党代表安德里纳高原和西部稀树草原的稻农、咖啡种植户和瘤牛牧人，是安博哈拉联邦议会的第三大党。党首埃里·兰德里亚是安德里纳市的一位稻农，种着祖传的几公顷梯田，至今仍在插秧季节回乡下田。党员约九万五千，几乎都在乡村，许多乡镇的农会主席同时是党的地方负责人。\n党的纲领围绕土地和收成。它主张稻米和咖啡实行保护价收购，干旱年份由联邦补贴种子和化肥；瘤牛放牧地归村社所有，不得出售给外国公司；每个乡镇都要修一条全天候道路通往联邦公路，让雨季的稻米也能运出去。战争使大量农村青年参军，许多梯田因无人耕种而荒芜，农民党因此主张退伍军人优先分配国有荒地，并为回乡务农的士兵提供低息贷款。\n在议会里，农民党与家园党组成多数，它不进入总统的内阁，却主持议会的农业与土地委员会，在农业、土地和乡村道路的立法上说话很有分量，被称为联邦的「粮仓伙伴」。两党在家庭和信仰上看法相近，但农民党更重视地方自治，常常反对联邦政府削减联邦市的预算。它与基督教人民党的关系也不坏，在农村诊所和乡村学校上经常一起投票。城市选民批评它只顾稻米价格，不顾城市居民的菜篮子。\n高原农民党没有全国性的大会，而是由各乡镇的农会推举代表组成「田野理事会」，理事会每年在收割后开会一次，选出党首和全国委员会。党的候选人几乎都是种田或放牧的人，城里的律师和教师很难拿到提名。党的经费来自农会的会费和稻米合作社的盈余，选举时，各乡镇的农民用牛车和拖拉机拉着党旗巡游，代替昂贵的电视广告。党对联邦政府的影响力主要来自它在农业部门的长期经验：许多农业官员、兽医和水利工程师都是党员。农村青年会每年组织插秧比赛和瘤牛选美，也负责在雨季帮助孤寡老人抢收稻谷，修补被洪水冲坏的田埂。\n农民党的力量集中在乡村和年长选民之中，首都和瓦凡博港几乎没有它的支部。每年收割季结束，党在安德里纳举办「丰收节」，各乡镇的农会带着最好的稻米、咖啡豆和瘤牛来参赛，获胜的瘤牛会披上党旗颜色的绿金彩带巡游。党的会议常在打谷场上举行，开会前先由最年长的农民祷告，感谢土地和雨水。", "en": "The Highland Farmers' Party speaks for the rice growers, coffee farmers and zebu herders of the Andrina Highlands and the western savanna, and is the third party in Ambohara's Federal Assembly. Its leader, Hery Randria, is a rice farmer from Andrina who works a few hectares of family terraces and still goes home to plant rice every season. Its 95,000 or so members are almost all rural, and in many districts the chairman of the farmers' association is also the party's local head. \nIts programme turns on land and harvest. It wants guaranteed prices for rice and coffee and seed and fertiliser paid for by the federation in drought years; zebu pastures kept in village hands and never sold to foreign companies; and an all-weather road from every rural district to the federal highway, so that the rice can be moved in the rains too. The war has taken many young men from the villages into the army and left many terraces untilled, so the party wants veterans to have first claim on state wasteland and cheap loans for soldiers who go home to farm. \nIn the Assembly it holds a majority with the Homeland Party; it sits outside the President's cabinet but chairs the Assembly's committee on farming and land and carries great weight in laws on farming, land and rural roads, the federation's 'granary partner'. The two agree on family and faith, but the Farmers care more for local self-rule and often oppose federal cuts to the cities' budgets. Its relations with the Christian People's Party are not bad either, and the two often vote together on village clinics and schools. City voters say it minds the price of rice and forgets the city shopper's basket. \nThe Highland Farmers' Party has no national congress; instead the district farmers' associations send delegates to a Field Council, which meets once a year after the harvest to elect the leader and the national committee. Its candidates are almost all people who farm or herd, and city lawyers and teachers rarely win a nomination. Money comes from association dues and the surpluses of the rice cooperatives, and at election time the farmers of each district parade the party flag on ox carts and tractors in place of costly television advertising. Its weight in government comes from long experience in farming: many agricultural officials, vets and irrigation engineers are members. Rural Youth holds rice-planting contests and zebu shows every year, and helps the elderly and widowed bring in their rice in the rains and mend the bunds the floods have broken.\nIts strength lies in the countryside and among older voters, and it has almost no branches in the capital or in Vavambo port. When the harvest is in each year the party holds a Harvest Festival in Andrina, where the farmers' associations bring their best rice, coffee and zebu to compete, and the winning bull parades in a sash of the party's green and gold. Its meetings are often held on the threshing floor, and begin with the oldest farmer giving thanks for the land and the rain."}
    history: {"zh": "高原农民党由联合共和国时期的稻农合作社和乡村农会联合组成。大分裂后，农会在战争中负责为军队和难民筹集粮食，战后改组为政党，在联邦议会中长期作为大党的伙伴参与执政。", "en": "The Highland Farmers' Party was formed by the rice cooperatives and village farmers' associations of the United Republic. In the war the associations gathered food for the army and the refugees, and afterwards they became a party that has long governed as the partner of a larger one."}
    flag_notes: {"zh": "党旗上半是绿色，下半是金色，绿色上有一束金色的稻穗。绿色是梯田，金色是成熟的稻谷。", "en": "The flag is green over gold, with a gold sheaf of rice on the green. The green is the terraces; the gold is the ripe rice."}
    factions: [{"names": {"zh": "稻农派", "en": "Paddy Wing"}, "notes": {"zh": "高原中部的稻农和合作社，最关心保护价和灌溉，是党的主体。", "en": "The rice farmers and cooperatives of the central highlands, who care most about guaranteed prices and irrigation; the party's core."}}, {"names": {"zh": "牧人派", "en": "Herders' Wing"}, "notes": {"zh": "西部草原的瘤牛牧人，关心放牧地的所有权和防盗牛，对联邦的土地登记政策常有不满。", "en": "The zebu herders of the western savanna, concerned with grazing rights and cattle theft and often unhappy with the federation's land registry."}}]
    organisation: {"newspaper": {"zh": "《田野报》", "en": "The Field"}, "unions": {"zh": "高原农会联合会", "en": "Federation of Highland Farmers' Associations"}, "women": {"zh": "农村妇女会", "en": "Rural Women's Association"}}
  - id: "pty_p223sw"
    names: {"zh": "联邦自由党", "en": "Federal Liberal Party"}
    short_names: {"zh": "自由党", "en": "Liberals"}
    color: "#F2A900"
    flag: {"layout": "diagonal", "colors": ["#F2A900", "#1C3F7A"], "charge": "star5"}
    spectrum: -0.3
    family: {"zh": "自由主义", "en": "Liberal"}
    ideology: [{"zh": "自由主义", "en": "Liberalism"}, {"zh": "宪政主义", "en": "Constitutionalism"}, {"zh": "经济开放", "en": "Economic openness"}]
    axes: {"econ": 6.0, "galtan": 3.5, "autonomy": 5.0, "green": 5.5}
    leader: {"zh": "尼里娜·拉扎菲", "en": "Nirina Razafy"}
    members: 42000
    youth_wing: {"zh": "青年自由派", "en": "Young Liberals"}
    slogan: {"zh": "信仰自由，才是真正的信仰", "en": "Faith is truest when it is free"}
    policies: [{"zh": "宪法保障所有宗教和无宗教者的平等地位，取消公立学校的强制祷告", "en": "Guarantee equal standing to every faith and to none, and end compulsory prayer in state schools"}, {"zh": "降低进口关税，吸引外资到瓦凡博港建设工业区", "en": "Cut import duties and bring foreign investment to an industrial zone at Vavambo port"}, {"zh": "设立独立的反腐败委员会，审计军费开支", "en": "Set up an independent anti-corruption commission to audit defence spending"}, {"zh": "放宽对新闻和网络的审查", "en": "Ease censorship of the press and the internet"}]
    allies: ["pty_qx8ded"]
    targets: {"div_mj41d0": 13}
    lean: {"urban": 0.8, "income": 0.8, "young": 1.5, "old": -1.5}
    notes: {"zh": "联邦自由党是安博哈拉唯一主张政教分离的议会政党，在一个以基督教立国的联邦里，它的处境相当特别。党首尼里娜·拉扎菲是首都大学的宪法学教授，也是一名虔诚的新教徒，她常说：「我反对的不是信仰，而是强迫。」党员约四万二千，多是律师、医生、商人、大学教师和学生，集中在首都和瓦凡博港。\n党的主张包括：宪法保障所有宗教和无宗教者的平等地位，取消公立学校的强制祷告；降低进口关税，吸引外资到瓦凡博港建设工业区；设立独立的反腐败委员会，审计常年占国内生产总值近百分之五的军费；放宽对新闻和网络的审查。它也是唯一公开主张修改婚姻法的政党，但为了避免吓跑选民，党纲只写了「由公民投票决定」。\n自由党在议会里是反对派，常与基督教人民党一起反对削减社会开支，又在审查和教会拨款问题上与人民党分道扬镳。家园党称自由党为「首都的沙龙」，说它的议员们一辈子没下过田；自由党则回敬说，家园党的预算从来不经审计。尽管席位不多，自由党在议会的调查委员会里十分活跃，几次军火采购丑闻都是由它的议员首先揭露的。\n联邦自由党的组织很松散，没有固定的地方支部，党员通过网络和每周的辩论会参与党务。党首和候选人由党员在网上投票选出，投票前每位候选人都要在公开辩论会上回答党员的提问。党的经费来自瓦凡博港商人的捐款和党员的小额捐款，它坚持每年公开全部账目，并请外部会计师审计，以此回应家园党「首都沙龙」的嘲讽。党与海外的自由派政党和人权组织联系密切，几次邀请外国观察员来监督联邦选举。青年自由派在大学里很活跃，每年举办模拟议会和宪法辩论赛，许多参加者后来成了律师、记者和外交官。党的议员还轮流在瓦凡博港的夜市摆摊，听商贩和码头工人谈物价。\n自由党的选民是城市里的高收入者和年轻人，年长选民和乡村几乎不投它的票。党的总部设在首都旧城一座红砖书店的楼上，每周四晚上举办公开辩论会，题目从「教会该不该交税」到「停火线能不能变成边界」，什么都可以讨论，辩论会结束时大家一起喝咖啡，不分党派。", "en": "The Federal Liberal Party is the only party in Ambohara's Assembly that stands for the separation of church and state, which puts it in an unusual position in a federation founded on Christianity. Its leader, Nirina Razafy, is a professor of constitutional law at the capital's university and a devout Protestant, who likes to say 'it is not faith I oppose, but compulsion'. Its 42,000 or so members are mostly lawyers, doctors, traders, lecturers and students, gathered in the capital and in Vavambo. \nIt wants the constitution to guarantee equal standing to every faith and to none, and compulsory prayer ended in state schools; import duties cut and foreign investment brought to an industrial zone at Vavambo; an independent anti-corruption commission to audit a defence budget that takes close to five per cent of output; and censorship of the press and the internet eased. It is the only party to speak openly of changing the marriage law, though to avoid frightening voters its programme says only that the people should decide by referendum. \nIn the Assembly it sits in opposition, often joining the Christian People's Party against cuts in social spending and parting from it again over censorship and church funding. Homeland calls the Liberals 'the capital's salon', whose members have never stood in a paddy; the Liberals reply that Homeland's budgets have never been audited. Its seats are few, but it is very active on the Assembly's committees of inquiry, and several arms-purchase scandals were first exposed by its members. \nThe Federal Liberal Party is loosely organised, with no fixed local branches; members take part online and at the weekly debates. The leader and candidates are chosen by an online vote of members, and before it every contender must answer members' questions at an open debate. Money comes from the merchants of Vavambo and small gifts from members, and the party publishes all its accounts every year with an outside audit, its reply to Homeland's jibe about 'the capital's salon'. It is close to liberal parties and human rights groups abroad and has several times invited foreign observers to watch federal elections. The Young Liberals are lively in the universities, running a mock parliament and a constitutional debating contest each year, and many who take part go on to be lawyers, journalists and diplomats. Its members of the Assembly also take turns keeping a stall at the Vavambo night market, hearing traders and dockers on prices.\nIts voters are the higher earners and the young of the cities; older voters and the countryside hardly vote for it at all. Its headquarters is above a red-brick bookshop in the capital's old town, where every Thursday evening it holds an open debate on anything from 'should the churches pay tax?' to 'can the ceasefire line become a border?'; at the end everyone drinks coffee together, whatever their party."}
    history: {"zh": "联邦自由党由首都的律师公会、大学教师和瓦凡博港的商会人士创立，最初只是一个宪法学研究会。研究会在制宪会议上主张政教分离未获通过，此后改组为政党，一直在议会中作为少数派发声。", "en": "The Federal Liberal Party was founded by the capital's bar, university teachers and the merchants of Vavambo, and began as a society for the study of the constitution. Its call for the separation of church and state failed at the constituent assembly, after which it became a party, a minority voice in the Assembly ever since."}
    flag_notes: {"zh": "党旗以对角线分为金色和深蓝两半，中间一颗白色五角星。金色代表开放和贸易，深蓝代表法治，白星代表每一个自由的公民。", "en": "The flag is split diagonally into gold and deep blue, with a white star in the middle. The gold is openness and trade, the blue the rule of law, the star every free citizen."}
    factions: [{"names": {"zh": "宪法派", "en": "Constitution Wing"}, "notes": {"zh": "律师和学者，最关心宗教自由、新闻自由和司法独立。", "en": "Lawyers and scholars, who care most about freedom of religion and of the press and the independence of the courts."}}, {"names": {"zh": "港口派", "en": "Port Wing"}, "notes": {"zh": "瓦凡博的商人和企业主，主张降低关税、开放外资，对社会议题较为低调。", "en": "The traders and business owners of Vavambo, who want lower duties and foreign investment and keep a low profile on social questions."}}]
    organisation: {"newspaper": {"zh": "《联邦观察》", "en": "Federal Observer"}, "think_tank": {"zh": "宪法与自由研究会", "en": "Society for the Constitution and Liberty"}, "women": {"zh": "自由妇女协会", "en": "Liberal Women's Association"}}
  - id: "pty_vwmra6"
