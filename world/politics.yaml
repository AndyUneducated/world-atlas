    policies: [{"zh": "潟湖和珊瑚礁划为全民公地，禁止外国渔船进入", "en": "Make the lagoons and reefs a commons of all islanders, closed to foreign boats"}, {"zh": "年轻人和男子在氏族议事中有表决权", "en": "Give the young and men a vote in clan meetings"}, {"zh": "全部电力来自太阳能和潮汐能", "en": "Draw all power from the sun and the tides"}, {"zh": "为海平面上升修建海堤，迁移低洼村落", "en": "Build sea walls against the rising sea and move low-lying villages"}]
