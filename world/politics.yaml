# Parties: cross-territory first, then each territory's own. family is the party's tradition in a few
# words; notes the card's introduction; history how it came to be (no dates).
parties:
  # ── 跨领地政党 ──
  - id: pty_09zrw1
    names: { zh: 公地共产党, en: Commons Communist Party }
    short_names: { zh: 公地, en: "Commons" }
    color: "#C0392B"
    flag: { layout: banner, colors: ["#C0392B"], charge: hammer_sickle, charge_color: "#F2C230" }
    spectrum: -2.2
    family: { zh: 激进左翼, en: Radical left }
    ideology: [{ zh: 民主社会主义, en: Democratic socialism }, { zh: 改良共产主义, en: Reform communism }, { zh: 合作社主义, en: Cooperativism }, { zh: 生态社会主义, en: Eco-socialism }]
    axes: { econ: 1.5, galtan: 2.0, autonomy: 2.5, green: 3.0 }
    leader: { zh: 梅鲁瓦伊·托兰加姆, en: Meruvai Tolangam }
    members: 64000
    youth_wing: { zh: 公地青年, en: Commons Youth }
    slogan: { zh: 共有的才是长久的, en: What we share is what lasts }
    policies:
      - { zh: 土地继续公有，长期租用的期限和租金由居民议事会公开审定, en: "Keep land in common ownership, with lease terms and rents set openly by residents' councils" }
      - { zh: 全民基本收入随生产率逐年上调, en: Raise the universal basic income every year in step with productivity }
      - { zh: 大型港口、电网和磁浮线路由公共机构持有，职工代表进董事会, en: "Hold the big ports, the grid and the maglev in public hands, with workers on their boards" }
      - { zh: 每个街区设免费的公共食堂和工具图书馆, en: Give every neighbourhood a free canteen and a tool library }
    allies: [pty_jh513z, pty_6c94cq, pty_18qa5s]
    targets: { div_fbfqv9: 4, div_raat4g: 1.5, div_hpmerr: 1.5, div_nwm019: 17.6 }
    lean: { young: 3, urban: 0.3, income: -0.3, manufacturing: 0.3, "status:commune": 1.0, "lang:en": -0.5 }
    notes:
      zh: "公地共产党（简称公地）是四个领地都推出候选人的激进左翼政党，原名公地联盟，名字取自「大家共有、共同照看的土地」。改名时党代会吵了两个通宵：赞成的一方说，土地公有和全民基本收入早已写进长夏群岛的法规，党不该再躲在一个温吞的名字后面，「共产主义」这个词也不能只留给自由公社共产主义运动去用；反对的一方担心新名字会吓跑北维京岛的中间选民。最后的折中是在党纲里写明「改良共产主义」：靠选举、议会和合作社一步步扩大公有的部分，而不是推倒重来。党旗随之换成红底上金色的镰刀、锤子和五角星，口号「共有的才是长久的」沿用至今。\n在长夏群岛，公地以17.5%的得票拿下领地议会121席中的23席，是第一大党，党首梅鲁瓦伊·托兰加姆出任总理，议长陈若溪也出自公地。它与社会民主互助工党、伊武兰民族复兴党联合执政，三党合计61席，刚好过半，每逢表决都要把议员一个不落地叫回议事厅，托兰加姆因此被叫作「点名总理」。内阁11个部里公地只占4个，与互助持平，许多设想因此打了折扣：基本收入随生产率上调的公式加进了复兴党要求的地区系数，港口董事会里的职工代表也没达到党纲要求的比例。支持者说这是「把理想折成能通过的条文」，批评者说公地执政越久，越像一个精于算账的社会民主党。总书记伊卢文娜·基拉努尔在党内立了一条规矩：谁提新开支，谁就得同时说明从哪里省。\n公地最微妙的关系在埃武托拉公社。公社人民代表大会55席中，公地和自由公社共产主义运动各占15席，两党共同执政，按联盟协议由公社运动出任管理委员会主任。两党都自称共产主义者，分歧却很深：公地相信公共机构、长期租约和经过议会审定的预算，认为规则写下来才护得住弱者；公社运动主张由街区大会直接决定一切，把常设机构减到最少。在公地干部眼里，公社运动擅长开会，却常在需要有人签字担责时退回大会；在公社运动眼里，公地已经变成了它当初反对的管理者。公社运动在领地议会只有3席，又不在领地政府之内，常从反对席上批评托兰加姆政府的妥协，于是两党在公社里同坐一桌，在领地议会里隔着走道对视。公地党内也有人抱怨：席位相等却让出主任，等于把公社的账本交给了不爱记账的人。\n公地在城市、公社、年轻人和低收入街区最强，制造业城镇也是它的票仓；它在萨伦纳姆、塔卢马兰、基拉努和乌诺卡里四市担任市长，在复兴党执掌的彭纳拉姆、温达坎、基鲁迈等市则是市政联盟里的小伙伴。乡村、高收入地区和英语母语者多的街区是它的短板。出了长夏群岛，它在北维京岛只拿到4.0%的选票，没能跨过门槛，在维京群岛和北冰洋都不到2%，更像读书会和工会之间的一张网。64000名党员以教师、护士、港口工人和大学生为多。党部的会议室晚上常借给合唱团和象棋社；党代会的第一顿饭照例在公共食堂吃，代表们自己洗碗，据说是为了提醒大家：公有的东西也得有人照看。"
      en: "The Commons Communist Party (the Commons for short) is a radical left party with candidates in all four territories. It began as the Commons Alliance, a name taken from the idea of land held and cared for in common. The change of name cost its congress two sleepless nights. Those in favour argued that with public land and a universal basic income long since written into the laws of the Everlong Summer Islands, the party should stop hiding behind a lukewarm name, and that the word ‘communist’ should not be left to the Libertarian Communist Commune Movement alone; those against feared it would frighten off the middle-ground voters of North Viking Island. The compromise was to write ‘reform communism’ into the programme: widening what is held in common step by step, through elections, parliament and cooperatives, rather than tearing everything down to start again. The flag became a gold hammer, sickle and star on red; the slogan, ‘What we share is what lasts’, stayed.\nIn the Everlong Summer Islands the Commons won 23 of the Territorial Assembly’s 121 seats on 17.5% of the vote, making it the largest party. Its leader Meruvai Tolangam is Premier, and the Speaker, Chen Ruoxi, is a Commons member too. It governs with the Social Democratic Mutual Aid Labour Party and the Ivuran National Renewal Party; the three hold 61 seats between them, a bare majority, so every vote means calling each member back to the chamber, and Tolangam has become the ‘Roll-Call Premier’. The Commons holds only four of the eleven ministries, the same as Mutual Aid, and much of its programme has been trimmed: the formula linking the basic income to productivity gained a regional weighting at Renewal’s insistence, and worker directors on the port boards still fall short of the share the programme demands. Supporters call this ‘folding ideals into clauses that can pass’; critics say the longer the Commons governs, the more it looks like a social democratic party with a gift for bookkeeping. The general secretary, Iluvenna Kiranur, has laid down a house rule: whoever proposes new spending must say in the same breath where the saving will come from.\nThe party’s most delicate relationship is in Evutola Commune. The Commons and the Libertarian Communist Commune Movement hold 15 seats each in the 55-seat Commune People’s Congress and govern together, and under their coalition agreement the Commune Movement chairs the management committee. Both call themselves communists, yet the gulf between them is wide. The Commons trusts public bodies, long leases and budgets settled by an elected chamber, believing that rules protect the weak only once they are written down; the Commune Movement wants neighbourhood assemblies to decide everything directly and standing institutions kept to a minimum. To Commons officials, the Commune Movement is superb at meetings but tends to retreat into the assembly whenever someone has to sign a decision and answer for it; to the Commune Movement, the Commons has become the very manager it once opposed. With only three seats in the Territorial Assembly and no place in the territorial government, the Commune Movement often attacks the Tolangam government’s compromises from the opposition benches, so the two parties share a table in the commune and eye each other across the aisle in the Assembly. Some in the Commons grumble that giving up the chair on equal seats handed the commune’s ledger to people who dislike keeping accounts.\nThe Commons is strongest in the towns, in the commune, among the young and in low-income neighbourhoods, and manufacturing towns are reliable ground. It holds the mayoralty in Sarunnam, Talumaran, Kilanu and Unokari, and is a junior partner in councils led by Renewal such as Pennaram, Undakan and Kirumai. The countryside, wealthier districts and neighbourhoods with many English speakers are its weak spots. Beyond the Everlong Summer Islands it is a different creature: on North Viking Island it took 4.0% of the vote, short of the threshold, and in the Viking Islands and the Arctic Ocean it wins under 2%, more a web strung between reading circles and trade unions. Its 64,000 members are mostly teachers, nurses, dockers and students. In the evenings its branch rooms are lent to choirs and chess clubs, and the first meal of every congress is eaten in a public canteen, where the delegates wash their own dishes: a reminder, it is said, that whatever is held in common still needs someone to look after it."
    history:
      zh: "公地共产党由长夏群岛的稻农合作社、港口工会和大学里的读书会合并而成，最初叫公地联盟，只在萨伦纳姆和塔卢马兰竞选。土地公有和全民基本收入写进领地法规之后，它的声望迅速扩散，其他三个领地也陆续成立了支部。随着党在长夏群岛进入政府，又在埃武托拉公社与自由公社共产主义运动既合作又竞争，党内要求亮明立场的声音越来越大，最终改用现名，并把「改良共产主义」写进党纲。"
      en: "The Commons Communist Party grew from a merger of the Everlong Summer rice cooperatives, the dockers’ unions and university reading circles. As the Commons Alliance it at first stood only in Sarunnam and Talumaran. Once public land and the basic income were written into the territory’s laws its name spread fast, and branches followed in the other three territories. As the party entered government in the Everlong Summer Islands, and found itself both partner and rival to the Libertarian Communist Commune Movement in Evutola Commune, calls to state its colours plainly grew louder; it took its present name and wrote ‘reform communism’ into its programme."
    flag_notes:
      zh: "党旗是红底上的金色镰刀、锤子和五角星，在党改名时启用。党内通行的解释是：镰刀代表创党时的稻农合作社，锤子代表港口和工厂的工人，五角星代表大学读书会和年轻党员，三股力量合在一起才是「公地」。红色象征共同的劳动与团结，金色象征收成，也象征公共财富要像谷仓一样向所有人敞开。"
      en: "The flag is a gold hammer, sickle and five-pointed star on red, adopted when the party changed its name. The usual reading within the party is that the sickle stands for the rice cooperatives that founded it, the hammer for the dock and factory workers, and the star for the university reading circles and the young; only together do the three make a commons. The red is shared labour and solidarity; the gold is the harvest, and public wealth that should stand open to all like a granary."
    factions:
      - names: { zh: "政务院派", en: "Cabinet Wing" }
        notes: { zh: "围绕总理托兰加姆、各部部长和四位公地市长的执政派，主张守住三党联盟，先保住基本收入和土地租约制度，再一点点扩大公有部分。成员多是部长、市议员和党的干部，被基层戏称为「算盘派」。", en: "The governing wing around Premier Tolangam, the ministers and the party’s four mayors. It wants to hold the three-party coalition together, secure the basic income and the lease system first, then widen public ownership bit by bit. Its members are mostly ministers, councillors and party officials, and the grassroots call it the ‘Abacus Wing’." }
      - names: { zh: "食堂论坛", en: "Canteen Forum" }
        notes: { zh: "以公地青年和街区支部为主，要求公共食堂和工具图书馆尽快铺开，批评联盟妥协太多，主张与自由公社共产主义运动走得更近，在埃武托拉公社的党员中很有影响。", en: "Drawn mainly from Commons Youth and the neighbourhood branches, it wants public canteens and tool libraries rolled out quickly, says the coalition has conceded too much, and favours closer ties with the Libertarian Communist Commune Movement. It carries real weight among members in Evutola Commune." }
      - names: { zh: "码头圈", en: "Dockside Circle" }
        notes: { zh: "由港口工会和制造业工人组成，最关心大型港口、电网和磁浮线路的公有化以及职工代表进董事会，对过快收紧工业排放的生态社会主义主张保持警惕。", en: "Made up of dockers’ unions and manufacturing workers, it cares most about public ownership of the big ports, the grid and the maglev lines, and about worker directors on their boards; it is wary of eco-socialist plans that would tighten industrial emissions too fast." }
    organisation:
      newspaper: { zh: "《公地报》", en: "The Commons" }
      think_tank: { zh: "公共所有研究所", en: "Institute for Common Ownership" }
      unions: { zh: "长夏港口工会、稻农合作社联合会", en: "Everlong Summer Dockers’ Union, Federation of Rice Cooperatives" }
      women: { zh: "公地妇女会", en: "Commons Women’s Council" }

  - id: pty_jh513z
    names: { zh: 社会民主互助工党, en: Social Democratic Mutual Aid Labour Party }
