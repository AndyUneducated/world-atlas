# Elections: the parties, each territory's legislature and electoral system, and the city councils
# (pipeline/atlas/politics.py). Every party and politician is fictional; party cards carry policies, not
# grievances against any group.
#
# A party's `targets` are its share of the vote in the territorial election, per territory it stands in
# (scaled to sum to 1); a district's vote leans from them by `lean`: per industry among the district's
# leading ones (rank-weighted 1, 0.6, 0.4, 0.3), per language share (lang:<tag>, 0–1), young and old (share
# of under-15s and over-65s), income (log of GDP per head over the territory's), urban (log10 of people
# per km²), lat (degrees), city:<id> and status:<special_status> (1 inside), each measured from the
# territory's mean. `roll` leans the vote of the reserved-seat roll further (log factor).
# spectrum: left (−3) to right (+3), for the order of the hemicycle and the cost of a coalition.
# Systems: mmp (a constituency per district, list seats by Sainte-Laguë to make the whole proportional
# among parties over the threshold or with a constituency; overhang seats kept), fptp (single-member wards
# shared out among the districts by population), pr_reserved (D'Hondt over the threshold, plus seats
# elected by the speakers of the reserved language, by Sainte-Laguë), pr_regional (each city a
# constituency, seats by population, at least 2, largest remainder). City councils use their territory's
# system: council_seats [a, b] gives a + b × log2(population / 100,000) seats, rounded to odd, within
# council_range; an mmp council elects half its seats in wards.
# The texts on the cards (who governs, who leads where) were written against the model's results; check
# them again after changing targets, leanings or systems.

electorate_share: 0.78  # of the population, 18 and over
perturbation: { vote: 0.12, turnout: 0.02, ward: 0.4 }  # at most, either way (log share, share, log share)
# A government is the winning coalition with no member to spare and the least cost: its left-right span,
# plus `partner` for each party beyond the first and `without_largest` if the largest party is not in it.
coalition_cost: { partner: 0.4, without_largest: 1.0 }

# Officeholders: the governor is appointed by the central government and belongs to no party; the
# premier (premier: their title) is the leader of the largest party in government, a party's leader in
# the territory where it is strongest and the head of its branch elsewhere; the speaker comes from the
# largest party in government; the leader of the opposition leads the largest party outside it. The
# cabinet holds the ministries below; the court has `judges` in all, the chief justice among them
# (`tongues`: how many at least speak a language). A city council's name and its speaker's title come
# from council_types (default: council), or from the city's entry under councils, which may also name
# the mayor's title, fix the seats, add notes and name the party that leads the government (lead).
# Under pr_regional a council may also be elected in constituencies, groups of its districts that take in
# each district once, with seats by population (at least two each) shared out within each by the vote.
council_types:
  council: { names: { zh: 市议会, en: City Council }, speaker: { zh: 议长, en: Speaker } }
  legco: { names: { zh: 市立法会, en: Legislative Council }, speaker: { zh: 主席, en: President } }
  municipal: { names: { zh: 市政会, en: Municipal Council }, speaker: { zh: 主席, en: Chair } }
  civic: { names: { zh: 市民议会, en: Civic Assembly }, speaker: { zh: 议长, en: Speaker } }
  common: { names: { zh: 市参议会, en: Common Council }, speaker: { zh: 议长, en: Speaker } }
  moot: { names: { zh: 市议事会, en: Town Assembly }, speaker: { zh: 主席, en: Chair } }
  diet: { names: { zh: 市议政会, en: City Diet }, speaker: { zh: 议政长, en: President of the Diet } }

# Ministries, in the order the cards list them. First each may go to a non-partisan expert, with odds
# `nonpartisan` (at most four, the likeliest first, and never so many that a governing party is left
# without one); the governing parties then pick the rest in D'Hondt order on their seats, each taking the
# free ministry that scores highest for it: `prestige` plus each `lean` times the party's position on that
# axis, measured from the centre (5) in fives (econ: left 0 to right 10; galtan: liberal to traditional;
# autonomy: territory to centre; green: ecology to growth).
ministries:
  - { id: external, names: { zh: 对外事务部, en: Ministry of External Affairs }, prestige: 2.6, nonpartisan: 0.5 }
  - { id: finance, names: { zh: 财政部, en: Ministry of Finance }, prestige: 3.0, lean: { econ: 0.8 }, nonpartisan: 0.1 }
  - { id: justice, names: { zh: 司法部, en: Ministry of Justice }, prestige: 2.0, lean: { galtan: -0.6 }, nonpartisan: 0.6 }
  - { id: security, names: { zh: 公共安全部, en: Ministry of Public Security }, prestige: 2.2, lean: { galtan: 1.4 }, nonpartisan: 0.1 }
  - { id: education, names: { zh: 教育、科学和文化部, en: "Ministry of Education, Science and Culture" }, prestige: 1.8, lean: { galtan: -1.0, autonomy: -0.6 }, nonpartisan: 0.15 }
  - { id: transport, names: { zh: 交通部, en: Ministry of Transport }, prestige: 1.4, lean: { green: 1.0, econ: 0.4 }, nonpartisan: 0.15 }
  - { id: construction, names: { zh: 建设部, en: Ministry of Construction }, prestige: 1.4, lean: { green: 0.8 } }
  - { id: civil, names: { zh: 民政部, en: Ministry of Civil Affairs }, prestige: 1.2, lean: { autonomy: -1.0 } }
  - { id: labour, names: { zh: 劳动和社会保障部, en: Ministry of Labour and Social Security }, prestige: 1.6, lean: { econ: -1.4 } }
  - { id: health, names: { zh: 卫生和人类服务部, en: Ministry of Health and Human Services }, prestige: 1.6, lean: { econ: -1.0 }, nonpartisan: 0.3 }
  - { id: environment, names: { zh: 自然资源和环境保护部, en: Ministry of Natural Resources and Environmental Protection }, prestige: 1.2, lean: { green: -2.0 } }

