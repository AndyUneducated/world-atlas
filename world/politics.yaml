    lean: { "lang:art-x-ivuran": 2.5, rice: 0.3, heritage: 0.4 }
    notes:
      zh: "伊武兰民族复兴党（简称复兴）是长夏群岛讲伊武兰语居民的主要政党，属中左翼，党员五万八千人。伊武兰语是群岛古王国的语言，也是群岛过半居民的母语，但在城市里，年轻人越来越少在家里说它。复兴的主张围绕语言展开：让伊武兰语成为第二官方语言，每所学校从一年级起开设伊武兰语课，修复古王国的寺庙、水渠和梯田，资助伊武兰语的电影、音乐和出版，文化遗产地的门票收入留给所在社区。它原名伊武兰复兴党，改名时加入「民族」二字，在党内引起了激烈的争论：支持者说，语言权利需要一个政治主体来承担；反对者担心「民族」会把一个讲社会自由主义的党推向排他的文化民族主义，让说中文和英语的邻居觉得被挡在门外。最后通过的党纲专门写了一句：「复兴是一种语言的复兴，不是一群人对另一群人的胜利。」\n在长夏群岛领地议会121席中，复兴占18席，得票13.9%，是第三大党。它与公地共产党、社会民主互助工党组成执政联盟，在总理梅鲁瓦伊·托兰加姆的政务院十一个部里分得三个。执政让复兴得到了许多它想要的东西：伊武兰语课进了更多的学校，寺庙和水渠的修缮列入了领地预算；但第二官方语言的立法始终停在委员会里，公地共产党更关心住房和公有化。党内有人抱怨复兴是联盟里「负责唱歌的那一个」——节庆和文化项目都交给它，真正的钱袋子却在别人手里。复兴还要在左右之间走钢丝：它的执政伙伴在左边，它的友党梯田农民党却在反对派一侧，两党在保护梯田和水渠上立场一致，在税收和土地规划上常常对立，议员们自称「同一块田里的两头牛」。\n复兴的选民集中在伊武兰语使用者多的老城、文化遗产地和梯田稻作区。彭纳拉姆、温达坎、洛米兰、纳卢迈和基鲁迈五座城市的市长都出自复兴，并由它牵头组成市政联盟；在彭纳拉姆和纳卢迈，它各占市议会51席中的12席。在其他城市它也大多参加执政，但在芯片海岸党较强的基拉努和塔卢马兰，它在57席和59席的市议会中都只有5席，那里有不少讲中文或英语的工程师家庭，伊武兰语课常被看作孩子额外的负担。在埃武托拉公社，它在公社人民代表大会55席中有5席，夹在两个共产主义政党之间，在语言和文化议题上常被双方争取。\n复兴的政治文化以语言为中心。集会开始前，主持人要用伊武兰语念出每一位到场者的名字，念错了要当场道歉；新党员入党时，要用伊武兰语写下自己的名字，再教另一个人写。口号「用自己的语言说出自己的名字」就来自这个仪式。党旗上半橙色、下半深红，中央一枚白色圆盘，盘上是一只深红色的犀鸟。伊武兰人有句老话：「犀鸟记得每一棵结过果的树。」党首塞尔瓦迈·哈努赖常在演讲结尾引用它，意思是一个民族不应忘记曾经养育过它的东西；总书记韩书瑶则爱补上一句：「也不应忘记现在和它同住一座岛的人。」"
      en: "The Ivuran National Renewal Party (Renewal for short) is the main party of the Everlong Summer Islands' Ivuran speakers, centre-left, with 58,000 members. Ivuran is the language of the islands' old kingdom and the mother tongue of more than half the islanders, but in the cities fewer and fewer young people speak it at home. The party's programme is built around the language: Ivuran as the second official language, Ivuran lessons in every school from the first year, the old kingdom's temples, channels and terraces restored, funding for Ivuran films, music and books, and heritage-site ticket money kept by the local community. It was once Ivuran Renewal, and adding the word 'national' set off a fierce argument. Supporters said language rights need a political community to carry them; opponents feared the word would push a socially liberal party towards an exclusive cultural nationalism and make Chinese- and English-speaking neighbours feel shut out. The programme finally adopted contains a sentence written for the purpose: 'Renewal is the renewal of a language, not the victory of one people over another.'\nRenewal holds 18 of the territorial assembly's 121 seats on 13.9% of the vote, the third party. It governs with the Commons Communist Party and Social Democratic Mutual Aid Labour and holds three of the eleven ministries in Premier Meruvai Tolangam's cabinet. Office has brought it much of what it wanted: Ivuran lessons in more schools, and temple and channel repairs in the territorial budget. But the bill on a second official language has never left committee; the Commons care more about housing and public ownership. Some members grumble that Renewal is 'the one who sings' in the coalition, handed the festivals and cultural programmes while someone else holds the purse. It also walks a tightrope between left and right: its partners in government are on the left, while its ally the Terrace Farmers' Party sits in opposition. The two agree on protecting the terraces and channels but often clash on tax and land planning, and their members call themselves two oxen in the same field.\nRenewal's voters are concentrated in old towns with many Ivuran speakers, heritage sites and terraced rice districts. The mayors of five cities, Pennaram, Undakan, Lomiran, Nalumai and Kirumai, are its members, and it leads the governing coalition in each; in Pennaram and Nalumai it holds 12 of 51 council seats. It is part of the governing coalition in most other cities too, but in Kilanu and Talumaran, where the Chip Coast Party is stronger, it holds only 5 seats on councils of 57 and 59; many engineers' families there speak Chinese or English, and Ivuran lessons are often seen as an extra load for the children. In Evutola Commune it holds 5 of the 55 seats in the Commune People's Congress, wedged between two communist parties and courted by both on language and culture.\nRenewal's political culture centres on the language. Before a rally begins, the chair reads out the name of everyone present in Ivuran and apologises on the spot for any name read wrong; a new member writes their own name in Ivuran and then teaches someone else to write theirs. The slogan 'Say your own name in your own language' comes from that ritual. The flag is orange above and deep red below, with a white disc in the centre bearing a deep-red hornbill, after an old Ivuran saying: the hornbill remembers every tree that ever bore fruit. The leader, Selvamai Hanurai, often ends speeches with it, meaning that a people should not forget what once fed it; the general secretary, Han Shuyao, likes to add that it should not forget those who share the island with it now either."
    history:
      zh: "伊武兰民族复兴党由一群伊武兰语教师和诗人创立，最初是一个在周末开办伊武兰语课的协会，课堂设在寺庙的回廊和稻农的晒谷场上。后来课堂越开越多，协会开始为语言课争取学校的教室和领地的经费，也就成了政党，起名伊武兰复兴党。党后来改为现名，加入「民族」二字，以表明伊武兰语使用者是一个有权要求语言权利的共同体；这一改动在党内至今仍有争议，不少老党员在日常说话里依然只说「复兴」。"
      en: "The party was founded by a group of Ivuran teachers and poets as a society running weekend Ivuran classes, held in temple cloisters and on farmers' threshing floors. The classes multiplied, the society began campaigning for classrooms in schools and money from the territory for language teaching, and so it became a party, Ivuran Renewal. It later took its present name, adding the word 'national' to declare that Ivuran speakers are a community entitled to language rights; the change is still disputed inside the party, and many long-standing members simply say 'Renewal' in everyday speech."
    flag_notes:
      zh: "党旗上半为橙色，下半为深红，两色之间隔着一道金色细带，中央是一枚金边白色圆盘，盘上一只深红色的犀鸟。橙色是寺庙屋瓦和成熟稻谷的颜色，深红与金色取自古王国的旧色，白色圆盘象征一页尚未写满的纸，留给每一代人写下自己的名字。犀鸟出自伊武兰老话「犀鸟记得每一棵结过果的树」，象征记忆与回报。"
      en: "The flag is orange above and deep red below, parted by a narrow gold stripe, with a gold-rimmed white disc in the centre bearing a deep-red hornbill. The orange is the colour of temple roof tiles and ripe rice; the deep red and gold are the old kingdom's colours; the white disc is a page not yet filled, left for each generation to write its own name. The hornbill comes from the old Ivuran saying that it remembers every tree that ever bore fruit, and stands for memory and gratitude."
    factions:
      - names: { zh: "母语学堂派", en: "Mother Tongue Schools" }
        notes: { zh: "以伊武兰语教师和诗人为主，继承党的创始传统，坚持把第二官方语言立法放在首位，认为语言保不住，一切文化复兴都是空话。在老城和稻作区的支部里根基深厚。", en: "Mostly Ivuran teachers and poets, heirs to the party's founding tradition, who put the second-official-language bill first and say that without the language every cultural revival is empty talk. They are deeply rooted in the branches of the old towns and rice districts." }
      - names: { zh: "新犀鸟圈", en: "New Hornbill Circle" }
        notes: { zh: "城市里的年轻专业人士和社会自由派，主张淡化「民族」色彩，把语言权利与住房、性别平等等议题结合起来，积极支持与公地共产党和社会民主互助工党的执政合作。", en: "Young urban professionals and social liberals who want to soften the 'national' tone and tie language rights to housing, gender equality and similar causes, and who strongly back governing with the Commons Communist Party and Mutual Aid Labour." }
      - names: { zh: "梯田寺庙派", en: "Terraces and Temples" }
        notes: { zh: "稻作区和文化遗产地的党员，关心寺庙、水渠和梯田的修复，坚持门票收入留给社区，与梯田农民党关系密切，在土地规划上比党的其他部分更保守。", en: "Members from the rice districts and heritage towns who care about restoring temples, channels and terraces and insist that ticket money stays with the community; close to the Terrace Farmers' Party and more conservative on land planning than the rest of the party." }
    organisation:
      newspaper: { zh: "《犀鸟报》", en: "The Hornbill" }
      think_tank: { zh: "语言权利研究所", en: "Institute for Language Rights" }
