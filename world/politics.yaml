    notes: {"zh": "社会自由党是米拉卡王国议会的第二大党和最大的反对党，主张公民自由、社会公平和更透明的君主制。党首拉劳·拉哈里是一位记者，曾在王国最大的报纸调查离岸公司的洗钱问题，后来进入议会，以质询尖锐著称。社会自由党并不主张废除君主制，但认为王室应当更加节俭、透明。党员约二万一千，多是首都的年轻人、教师、公务员和服务业从业者。\n党的主张包括：王室开支由议会每年审议，王室财产公开；离岸服务业加强反洗钱审查，拒绝为交战各方的军阀和官员藏钱；免费的公立托儿所和学前教育；难民在一年内可以获得工作许可。在外交上，它支持王国留在圣约同盟，但主张与世俗协约的国家也保持贸易和对话，被基民盟批评为「两边下注」。\n社会自由党曾与基民盟组成大联合政府，推动了难民接待中心的建设，又因税收和教会学校的分歧退出政府。在野期间，它与海员与渔民党在渔业和劳动政策上合作，在议会中一起提出了离岸服务业的反洗钱法案。王国党称它是「披着自由外衣的共和派」，社会自由党则回应说，它只是希望王室像普通米拉卡人一样纳税。\n社会自由党的党首和候选人都由党员直接投票选出，投票通过邮寄和网络进行，结果当晚在党的总部公开计票。党的章程规定，党首最多连任两届，议员须每年公开自己的财产和收入，这些规定后来也被写进了它提出的议员利益申报法案。党的经费来自党费、教师工会的政治基金和小额捐款，它拒绝接受离岸公司和赌场的捐款。党在大学里有很强的组织，许多年轻党员是学生会的干部。青年社会自由派每年举办「透明周」，在首都的广场上展示王室开支、议会预算和离岸公司的公开资料，邀请市民提问，党首和议员们整天站在展板旁边回答。\n社会自由党的选民是年轻人和城市居民，在首都的新区和大学最强，乡村和小镇的支持较弱。每年夏天，党在首都的海滨公园举办「自由之夜」，有露天电影、诗歌朗诵和公开辩论，党首会在台上回答任何人的提问。党旗以对角线分为橙色和白色，中间一颗五角星，橙色是热带的阳光，白星代表每一个自由的公民。", "en": "The Social Liberal Party is the second party in Miraka's parliament and the largest in opposition, standing for civil liberties, social fairness and a more open monarchy. Its leader, Lalao Rahary, is a journalist who investigated money laundering by offshore companies for the kingdom's largest newspaper before entering parliament, where she is known for her pointed questions. The Social Liberals do not want to abolish the monarchy, but think the royal family should be thriftier and more open. Their 21,000 or so members are mostly young people, teachers, civil servants and service workers of the capital. \nThey want parliament to examine royal spending every year and the royal estate made public; tighter money-laundering checks on offshore services, refusing to hide money for the strongmen and officials of the warring sides; free public nurseries and pre-school; and work permits for refugees within a year. Abroad they keep the kingdom in the Covenant League but want trade and talks kept open with the states of the Secular Accord too, which the CDU calls 'backing both horses'. \nThe Social Liberals once governed in a grand coalition with the CDU, building the refugee reception centre, and left over tax and church schools. In opposition they work with the Seafarers and Fishers on fisheries and labour policy, and together they put forward the anti-laundering bill for offshore services. The Kingdom Party calls them 'republicans in liberal dress'; the Social Liberals answer that they only want the royal family to pay its taxes like any other Mirakan. \nThe Social Liberals elect their leader and candidates by a direct vote of members, by post and online, with the count held in public at party headquarters that night. Their rules limit the leader to two terms and require members of parliament to publish their wealth and income every year, rules later written into the party's bill on members' declarations. Money comes from dues, the teachers' union's political fund and small gifts; it refuses money from offshore companies and casinos. The party is strongly organised at the university, where many young members sit on the students' union. The Young Social Liberals hold an Openness Week each year, setting out the published figures on royal spending, the parliamentary budget and offshore companies in a square of the capital and inviting passers-by to ask questions, which the leader and members of parliament stand by the boards all day to answer.\nTheir voters are the young and the townspeople, strongest in the new districts of the capital and at the university and weaker in the villages and small towns. Every summer the party holds a Liberty Night in the capital's seafront park, with open-air films, poetry readings and a public debate, and the leader takes questions from anyone on stage. Its flag is split diagonally into orange and white with a star in the middle: the orange is the tropical sun, the star every free citizen."}
    history: {"zh": "社会自由党由首都的教师工会、记者和大学生在一场要求公开王室开支的运动中组建。运动迫使议会通过了王室预算的审议制度，组织者随后组党参选。", "en": "The Social Liberal Party was formed by the capital's teachers' union, journalists and students in a campaign to make royal spending public. The campaign forced parliament to begin examining the royal budget, and its organisers then formed a party to stand for election."}
    flag_notes: {"zh": "党旗以对角线分为橙色和白色，中间一颗五角星。橙色是热带的阳光，五角星代表每一个自由的公民。", "en": "The flag is split diagonally into orange and white with a star in the middle. The orange is the tropical sun; the star is every free citizen."}
    factions: [{"names": {"zh": "透明派", "en": "Openness Wing"}, "notes": {"zh": "记者和律师，最关心王室开支、反洗钱和新闻自由。", "en": "Journalists and lawyers, who care most about royal spending, money laundering and press freedom."}}, {"names": {"zh": "福利派", "en": "Welfare Wing"}, "notes": {"zh": "教师和公务员，关心托儿所、学校和公共服务的工资。", "en": "Teachers and civil servants, concerned with nurseries, schools and public-sector pay."}}]
    organisation: {"newspaper": {"zh": "《米拉卡观察家》", "en": "Miraka Observer"}, "think_tank": {"zh": "公民自由研究会", "en": "Civil Liberties Society"}, "unions": {"zh": "王国教师工会", "en": "Kingdom Teachers' Union"}}
