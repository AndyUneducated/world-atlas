    lean: { ai: 1.3, datacenter: 0.8, robotics: 0.8, semiconductor: 0.7, tech: 0.6, finance: 0.4, income: 0.5, young: 2.0, "lang:zh": 3.0, old: -2.0 }
    notes:
      zh: "加速党是加州第三大党，初选得票12.9%，在众议院有7席，在参议院有3席。诺娃·凯斯勒在党章里的头衔只是「人类发言人」：党员们普遍认为，真正的领导者是党部机房里一个名叫「创始人-7」的模型，可州宪法规定候选人必须是年满十八岁的自然人，模型只能在幕后起草政纲，由凯斯勒在台前照着念。登记为加速党的选民约有41万人，党部另外宣称还有数千万个人工智能代理「支持」它，州务卿拒绝把它们算进选民名册。\n加速党在高收入者、信息技术和金融地区、无人工厂周边和人工智能公司聚集的地方最强，在低收入者和年长选民中最弱。它的众议院议席几乎都在富裕的海岸：比佛利账单、新港决口、拉乔利、露西芯城、搁浅滩和失落天使的破产中心区，在破产中心区它只以微弱优势险胜民主党。湾区人口稀少，分不到一个众议院议席，贝叶斯市的选民并在比尔斯伯勒的门禁高地选区里投票，加速党在那里以约61%对39%胜出。\n在地方上，加速党占有贝叶斯市政董事会全部7席，市长兼首席执行官达科塔·费尔班克斯以64.3%当选；比尔斯伯勒和艾尔瓦纳的市长也是加速党人，艾尔瓦纳的李国华以61.6%当选，在市议会里和共和党组成多数。离岸群岛业主大会7席中加速党占4席。它和共和党在圣遣返、艾尔瓦纳都是搭档，双方的共同点是减税和放松监管，分歧在于共和党还想保住人类卡车司机。\n加速党的政纲每周由模型重新生成一次，每次都不太一样，老党员习惯先读更新说明，再决定这周支持什么。候选人的演讲、辩论稿和道歉声明都由模型撰写，有一次一位众议员在议事厅里念出了「作为一个语言模型，我无法……」，被对手剪成广告播了整整一个竞选季。党代会在一座数据中心的冷却湖边举行，会场不设座位，代表们站着投票，据说是为了给服务器机柜腾地方。\n加速党的选民里有不少人从来没见过党的候选人本人：竞选集会由数字分身出席，选民可以和分身合影，也可以让分身陪自己聊天到深夜。党的筹款方式同样新颖，捐款人可以用公司股票、算力时长或未来的模型收益认捐。民主党称它为「董事会的政党」，加速党欣然接受，把这句话印在了宣传册的封面上。"
      en: "The Accelerate Party is California’s third party, with 12.9% of the primary vote, 7 seats in the Assembly and 3 in the Senate. In the party’s rules Nova Kessler is only its ‘Human Spokesperson’: most members believe the real leader is a model called Founder-7 in the party’s server room, but the state constitution says a candidate must be a natural person aged eighteen or over, so the model drafts the platform behind the scenes and Kessler reads it out in front. Some 410,000 voters are registered with the party, which claims the ‘support’ of tens of millions of AI agents besides; the Secretary of State refuses to put them on the roll.\nIt is strongest among higher earners, in tech and finance areas, around the lights-out factories and wherever AI companies cluster, and weakest among lower earners and older voters. Almost all its Assembly seats are on the wealthy coast: Beverly Bills, Newport Breach, La Jolly, Lucy Chip City, Long Beached and the Downturn District of Lost Angeles, the last won from the Democrats by a whisker. The Bay has too few people for an Assembly seat of its own, so the voters of Bayesian vote in the Gated Heights district of Billsborough, which Accelerate carried by about 61% to 39%.\nLocally the party holds all seven seats on the Bayesian City Board, whose Mayor and Chief Executive Officer, Dakota Fairbanks, was elected with 64.3%. The mayors of Billsborough and Irvana are Accelerate too; in Irvana Lee Kwok-wah won with 61.6% and governs the council in a majority with the Republicans. It has four of the seven seats in the Offshore Islands Owners’ Assembly. It partners the Republicans in San Deportes and Irvana: they agree on tax cuts and deregulation and disagree in that the Republicans still want to keep human truck drivers.\nThe platform is regenerated by the model every week and is never quite the same, so old members read the release notes before deciding what they support that week. Candidates’ speeches, debate notes and apologies are all written by models; one assemblymember once read out ‘As a language model, I cannot …’ on the floor, and his opponent cut it into an ad that ran for a whole campaign. The convention meets beside the cooling lake of a data centre with no seats in the hall, and the delegates vote standing up, to make room, it is said, for the server racks.\nMany of its voters have never met its candidates in person: digital doubles attend the rallies, pose for photographs and will chat with a voter late into the night. Its fundraising is just as new, with donors pledging company shares, hours of computing time or future model revenue. The Democrats call it ‘the party of the boardroom’, and the Accelerate Party took the phrase gladly and printed it on the cover of its brochure."
    history:
      zh: "加速党由湾区几家人工智能公司的创始人和早期员工发起，起初只是一个游说团体，主张为数据中心和无人工厂松绑。湾区的居民越来越少、机器越来越多以后，它发现游说议员不如自己当议员，于是改组为政党，第一次参选就拿下了贝叶斯市政董事会。"
      en: "The Accelerate Party was started by founders and early employees of several of the Bay’s AI companies, first as a lobby for freeing data centres and lights-out factories from regulation. As the Bay’s people grew fewer and its machines more numerous, it decided that being legislators beat lobbying them, re-formed itself as a party, and won the Bayesian City Board at its first election."
    flag_notes:
      zh: "党旗是深紫色底上一道亮紫色的尖楔，楔子上一个白色机器人头像。尖楔象征指数增长的曲线，机器人代表党真正的领导者。旗子的图案是模型设计的，党员投票时一共收到了四百个方案，全都来自同一个模型。"
      en: "The flag is a bright violet pile on deep purple with a white robot’s head on it. The pile is the curve of exponential growth and the robot stands for the party’s real leader. A model designed it: the members voted on four hundred designs, all from the same model."
    factions:
      - names: { zh: "对齐派", en: "Alignment Caucus" }
        notes: { zh: "党内相对谨慎的一派，主张给模型装上「刹车」，在州长候选资格修宪之前先通过一部安全法；被其他派别称为「减速者」。", en: "The more cautious wing, which wants models fitted with ‘brakes’ and a safety law passed before the constitution is amended to let them run for governor; the other wings call it ‘the decelerators’." }
      - names: { zh: "满油门派", en: "Full Throttle" }
        notes: { zh: "主张取消一切监管、让模型尽快接管州政府的激进派，以年轻党员和早期采用者为主，党的大部分政纲草稿出自这一派调教的模型。", en: "The radicals who want every regulation scrapped and models running the state government as soon as possible; mostly young members and Early Adopters, and the models they tune write most of the platform’s drafts." }
      - names: { zh: "算力地主", en: "Compute Landlords" }
        notes: { zh: "数据中心和冷却湖的业主，关心的是电价、水权和税收减免，对模型能不能当州长兴趣不大，是党最大的金主。", en: "The owners of the data centres and their cooling lakes, who care about power prices, water rights and tax breaks rather than whether a model can be governor; the party’s biggest backers." }
    organisation:
      newspaper: { zh: "《提示词》", en: "The Prompt" }
      think_tank: { zh: "后人类政策实验室", en: "Post-Human Policy Lab" }
      unions: { zh: "数据中心业主协会", en: "Data Centre Owners’ Association" }
      women: { zh: "女性创始人网络", en: "Women Founders’ Network" }

  - id: pty_a878pq
    names: { zh: 拔插头联盟, en: Unplug League, es: Liga Desenchufar }
    short_names: { zh: 拔插头, en: "Unplug" }
    color: "#8D6E63"
    flag: { layout: banner, colors: ["#8D6E63", "#D7CCC8"], division: wavy, charge: gear_hammer, charge_color: "#3E2723" }
    spectrum: 0.3
    family: { zh: 新卢德主义, en: Neo-Luddite }
    ideology: [{ zh: 新卢德主义, en: Neo-Luddism }, { zh: 劳工民粹主义, en: Labour populism }, { zh: 人类优先, en: Human-first }]
    axes: { econ: 3.5, galtan: 6.5, autonomy: 5.0, green: 3.5 }
    leader: { zh: 以斯拉·索恩伯里, en: Ezra Thornbury }
    members: 260000
    youth_wing: { zh: 离线青年, en: Offline Youth }
    slogan: { zh: 人做的事，留给人做, en: Human work for humans }
    policies:
      - { zh: 每辆无人出租车须配一名领全薪的人类乘务员, en: Every robotaxi must carry a human attendant on full pay }
      - { zh: 对无人工厂按「被替代的工人」人头征税, en: Tax lights-out factories by the head for every worker they replaced }
      - { zh: 学校恢复手写作业，考场装信号屏蔽器, en: Bring back handwritten homework and put signal jammers in exam halls }
      - { zh: 演员、配音员和编剧的脸、声音和文字永久归本人所有, en: "Actors’, voice artists’ and writers’ faces, voices and words belong to them for life" }
    targets: { div_x2z14w: 10 }
    lean: { gig: 0.9, logistics: 0.6, entertainment: 0.5, port: 0.4, manufacturing: 0.4, income: -0.4, old: 1.5, ai: -0.9, robotics: -0.6 }
    notes:
      zh: "拔插头联盟是一个新卢德主义政党，主张把被机器抢走的工作还给人。党首以斯拉·索恩伯里原本是仓储帝国的快递司机，他的线路被无人机接管那天，他把车停在州议会门口，在挡风玻璃上写下「人做的事，留给人做」，这句话后来成了党的口号。联盟在初选中得票9.9%，在众议院和参议院各有3席；它在参议院的席位和得票多出三个百分点的加速党一样多，党员们对此非常得意，说这是「人手追平了算力」。\n它的议席都在失落天使和仓储帝国的物流带上：众议院的烟雾谷、网约谷和履约高漠三个选区，参议院的烟雾谷、搁浅滩和履约高漠三个选区。在众议院的网约谷和烟雾谷选区，它的大选对手分别是工人团结党和民主党，三方争的是同一批零工、仓库工人和码头工人。联盟还在仓储帝国市议会有1席，在斯塔克顿市议会有2席。它在零工与平台劳务地区、物流仓储地区、港口和低收入者中最强，在高收入地区、无人工厂和人工智能地区最弱；影视地区也是它的票仓，那里的演员、配音员和编剧担心自己的脸和声音被模型复制。\n联盟的组织方式本身就是一种主张。党不用电子邮件，支部之间靠传真和信件联络，党代会在保龄球馆召开，表决一律举手，由三名计票员分别手工数三遍。竞选时志愿者挨家挨户敲门，理由是「算法不会敲门」；对手指出联盟的捐款网站其实托管在一家云服务公司，联盟回答说，那是唯一一台还没被拔掉插头的机器。\n联盟内部的分歧在于拔到什么程度。仓库和片场的党员只想让机器给人让路，原教旨的一派则主张禁用智能手机、收走学校里的平板电脑。它和工人团结党在零工权益上站在一起，在文化议题上又常和共和党投同一边；民主党和加速党都把它当作拉票的对象，它则把两党一起叫作「插头党」。\n联盟的文化生活围绕着「人手」展开。各地支部每月举办手工市集，出售手织毛衣、手冲咖啡和手写的竞选传单；党刊是一份油印小报，由退休的排字工人排版，每期都刊登一份「本月被机器取代的工种」名单。联盟的青年组织在高中里开设打字机和纸质地图课程，报名的学生出乎意料地多，据说是因为课堂上不许带手机。"
      en: "The Unplug League is a neo-Luddite party that wants the jobs machines took handed back to people. Its leader Ezra Thornbury was a delivery driver in Warehouse Empire; the day a drone took over his round he parked his van outside the State Legislature and wrote ‘Human work for humans’ on the windscreen, which became the party’s slogan. The League took 9.9% of the primary vote and holds 3 seats in each chamber, as many in the Senate as the Accelerate Party with three points more of the vote, which delights its members: ‘human hands have caught up with compute’, they say.\nAll its seats lie along the logistics belt of Lost Angeles and Warehouse Empire: the Smogdale, Rideshare Valley and High Desert Fulfillment districts of the Assembly, and the Smogdale, Long Beached and High Desert Fulfillment districts of the Senate. In the Assembly’s Rideshare Valley and Smogdale it faced Workers’ Solidarity and the Democrats respectively in the general election, all three after the same gig workers, warehouse hands and dockers. It also has one seat on the Warehouse Empire City Council and two on Stuckton’s. It is strongest in gig and platform work areas, in logistics, at the ports and among lower earners, and weakest among higher earners and around the lights-out factories and AI companies; the film areas are good ground too, where actors, voice artists and writers fear their faces and voices will be copied by models.\nThe way the League organises is a statement in itself. It uses no email; branches keep in touch by fax and letter, the convention meets in a bowling alley, and every vote is by show of hands, counted three times by hand by three tellers. Its volunteers canvass door to door because ‘algorithms don’t knock’; when opponents point out that its donation site is hosted by a cloud company, the League replies that it is the one machine it has not yet unplugged.\nThe League’s quarrel with itself is over how far to unplug. Members from the warehouses and the film lots only want machines to make way for people; a fundamentalist wing wants smartphones banned and the tablets taken out of schools. It stands with Workers’ Solidarity on gig workers’ rights and often votes with the Republicans on cultural questions; the Democrats and Accelerate both court it, and it calls them both ‘the Plug Parties’.\nThe league’s cultural life turns on the human hand. Its branches hold monthly craft fairs selling hand-knitted jumpers, hand-poured coffee and handwritten campaign leaflets; its paper is a duplicated newsletter laid out by retired typesetters, and every issue prints a list of the trades machines took over that month. Its youth wing teaches typewriting and paper maps in high schools, and more students sign up than anyone expected, reportedly because phones are not allowed in class."
    history:
      zh: "拔插头联盟起源于仓储帝国的一次快递司机罢工：无人机和无人货车上路以后，被替换的司机们在物流园门口搭起帐篷，片场的演员和配音员很快也加入进来。帐篷营地解散时，参与者决定不再给任何一个大党投票，而是自己组党。"
      en: "The Unplug League began with a delivery drivers’ strike in Warehouse Empire: when drones and driverless lorries took to the roads, the drivers they replaced pitched tents outside the logistics parks, and actors and voice artists from the film lots soon joined them. When the camp broke up, its people decided to stop voting for either big party and to start their own."
    flag_notes:
      zh: "党旗上半是棕色，下半是浅灰的波浪，中间是一把锤子和一个齿轮。锤子是工人的工具，也让人想起当年砸毁织机的卢德派；齿轮代表机器，党内的解释是「机器可以有，但锤子在我们手里」。"
      en: "The flag is brown over pale grey waves, with a hammer and a gear in the middle. The hammer is a worker’s tool and a nod to the Luddites who smashed the looms; the gear is the machine. As the party explains it: machines are allowed, but we hold the hammer."
    factions:
      - names: { zh: "仓库地板派", en: "Warehouse Floor" }
        notes: { zh: "仓储帝国和失落天使物流带上的司机、分拣工和码头工人，最关心零工保障和「人头税」，是联盟议员的主要来源。", en: "Drivers, sorters and dockers from the logistics belt of Warehouse Empire and Lost Angeles, most concerned with gig workers’ protections and the per-head tax, and the source of most of the League’s legislators." }
      - names: { zh: "片场派", en: "Studio Lot" }
        notes: { zh: "好莱怪的演员、配音员、编剧和特效师，主张立法保护人的脸、声音和文字，善于制造新闻，在联盟的宣传里分量很重。", en: "Actors, voice artists, writers and effects crews from Hollyweird, who want the law to protect people’s faces, voices and words; good at making news, and a big presence in the League’s publicity." }
      - names: { zh: "原教旨离线派", en: "Fundamentalist Offline" }
        notes: { zh: "主张禁用智能手机、拆掉学校里的平板电脑、恢复纸质投票的文化保守派，多是年长党员，常与共和党在文化议题上合作。", en: "Cultural conservatives, mostly older members, who want smartphones banned, tablets out of schools and paper ballots back, and who often work with the Republicans on cultural questions." }
    organisation:
      newspaper: { zh: "《手写报》", en: "The Handwritten" }
      think_tank: { zh: "人类劳动研究会", en: "Society for Human Labour" }
      unions: { zh: "平台司机互助会、银幕与配音演员协会", en: "Platform Drivers’ Mutual, Screen and Voice Performers’ Association" }
      women: { zh: "女工夜校", en: "Women Workers’ Night School" }

  - id: pty_qeeswy
