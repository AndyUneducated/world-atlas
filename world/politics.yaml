    notes:
      zh: "芯片海岸党是长夏群岛的中右翼科技自由派，选民集中在南部海岸的芯片、电池和制药工业城市，多是工程师和技术工人。它主张优先保障芯片和电池工厂的电力与用水，理工科大学扩招一倍，方便海外工程师的家属随迁，在工业园区周边修建新的住宅和轻轨。党名来自南部海岸的一串工业城市，当地人把它们叫作「芯片海岸」，夜里从海上看，工厂的灯光连成一条线。芯片海岸党在长夏群岛议会里有几个议席，在各市议会中以基拉努的议席最多。党首林澈原是一家晶圆厂的工艺工程师，她说自己参政的理由很简单：「工厂里的问题我会修，城市里的问题也想试试。」"
      en: "The Chip Coast Party is the Everlong Summer Islands' centre-right technological liberal party, its voters concentrated in the chip, battery and pharmaceutical cities of the south coast, many of them engineers and technicians. It wants power and water for chip and battery plants guaranteed first, the technical universities' intake doubled, easier moves for overseas engineers' families, and new housing and light rail around the industrial parks. Its name comes from the string of industrial cities along the south coast that locals call the Chip Coast, whose factory lights join into one line when seen from the sea at night. It has a few seats in the assembly, and of all the city councils it holds the most seats on Kilanu's. Its leader Lin Che was a process engineer at a wafer plant, and says her reason for entering politics is simple: she can fix the problems in a factory, and wants to try the problems in a city."
    history:
      zh: "芯片海岸党由南部海岸几家工业园区的工程师协会组建，起因是一个夏天的连续停电让几座晶圆厂停了产。"
      en: "The party was formed by the engineers' associations of several south-coast industrial parks after a summer of power cuts stopped production at several wafer plants."
