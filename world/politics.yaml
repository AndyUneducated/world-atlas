    spectrum: -0.4
    family: { zh: 地区主义, en: Regionalist }
    ideology: [{ zh: 地方主义, en: Localism }, { zh: 市政主义, en: Municipalism }, { zh: 社会自由主义, en: Social liberalism }]
    axes: { econ: 4.5, galtan: 3.5, autonomy: 2.5, green: 5.0 }
    leader: { zh: 秦望舒, en: Qin Wangshu }
    members: 6500
    youth_wing: { zh: 海港青年, en: Harbour Youth }
    slogan: { zh: 维京港的事，维京港定, en: Viking Port decides for Viking Port }
    policies:
      - { zh: 港口收入的一半留给维京港市, en: Half of the port's revenue to stay with Viking Port City }
      - { zh: 维京港老城和港区的规划由市议会而不是领地政府审批, en: "Viking Port's old town and harbour to be planned by the city council, not the territory" }
      - { zh: 海底通道的过路费减半, en: Halve the tolls on the undersea link }
      - { zh: 在老港区建一座海事博物馆, en: Build a maritime museum in the old harbour }
    allies: [pty_jh513z, pty_2033kv]
    targets: { div_fbfqv9: 3 }
    lean: { "city:div_m41gwn": 2.0, port: 0.3 }
    notes:
      zh: "海港运动只在维京港和周边竞选，是一个中间偏左的地方主义政党。维京港是北维京岛最早的城市，首府自由市建成后，政务院和议会都搬走了，许多维京港人觉得「港口赚的钱都流到了首府」。海港运动的主张都围着这口气：港口收入的一半留给本市，老城和港区的规划由市议会而不是领地政府审批，海底通道的过路费减半，在老港区建一座海事博物馆。它的内在张力也来自这里。它是一个政党，还是一座城市的游说团？党内一直有人主张把「本地事本地定」推广到勒克尔、萨科勒等城市，办成全岛的市政主义运动；另一些人则认为，离开维京港，海港运动就什么都不是。另一重张力在港口本身：老城保护和海事博物馆需要留住老码头，港口的就业和收入却需要扩建新泊位，两种诉求都写在党纲里。\n在领地议会选举中，海港运动拿到百分之三的选票，几乎全部来自一座城市，跨不过全领地百分之五的门槛。它的舞台是维京港市议会：五十五席中有它七席，它与社会民主互助工党、绿脉党组成执政联盟，市长属互助工党。在市里执政，它让老城的每一项改建都要先经市议会公开讨论，推动了海事博物馆的选址，也让市政厅门前的旗杆换回了老港区的一根旧桅杆。但它的几项招牌主张都绕不开领地政务院：港口收入分成和过路费减半要动领地预算，而领地的执政党正是它在市里的伙伴社会民主互助工党。于是它常常一边在市里与互助工党同桌，一边在领地层面向互助工党请愿，党内称之为「同船吵架」。在老城保护上，它又与反对派长屋党常投同一张票。\n它的选民是维京港市的居民，特别是港口、航运和码头一带，离开维京港几乎没有选票。码头工人、渡轮船员、老城的小店主和不愿搬去首府的年轻家庭构成了它的基础。口号「维京港的事，维京港定」写在每一张传单上。党旗靠旗杆一侧是一个深蓝色三角，旗面是蓝白相间的横条，上面飞着一只海鸥。\n海港运动的大会在老港区的一座旧货仓里召开，开会前要敲三下一口旧船钟，意思是「船靠岸了」。每年它都组织一次「回港日」游行，参加者从港务局大楼走到老码头，沿途把写着诉求的纸船放进海里。党内有个不成文的规矩：任何一份党纲草案都要先在码头边的咖啡馆里念给工人听，听不懂的就重写。党首秦望舒常说，海港运动的党纲不必比一张潮汐表更长。"
      en: "The Harbour Movement stands only in Viking Port and its surroundings, a localist party just left of centre. Viking Port is North Viking Island's oldest city, and when Freedom City was built as the capital the Executive Council and the parliament moved away; many in Viking Port feel the money the harbour makes flows to the capital. Every one of the movement's demands grows out of that grievance: half the port's revenue kept in the city, the old town and harbour district planned by the city council rather than the territorial government, the undersea link's tolls halved, and a maritime museum in the old harbour. Its inner tensions come from the same place. Is it a party, or one city's lobby? Some members have long wanted to carry local decisions for local places to Lekor, Sakole and other cities and build an island-wide municipalist movement; others believe that without Viking Port the movement is nothing. A second tension lies in the harbour itself: protecting the old town and housing a museum mean keeping the old quays, while the port's jobs and income depend on new berths, and both demands sit in the programme.\nAt territorial elections the movement takes three per cent of the vote, almost all of it from one city, and cannot clear the territory-wide five-per-cent threshold. Its stage is Viking Port's council, where it holds seven of 55 seats and governs with the Social Democratic Mutual Aid Labour Party and Greenvein under a Mutual Aid mayor. In city government it has ensured that every alteration in the old town is first debated in open council, pushed the choice of a site for the maritime museum, and seen the flagpole outside city hall replaced with an old mast from the harbour. But its signature demands all run through the territorial Executive Council: a share of port revenue and halved tolls touch the territorial budget, and the party governing the territory is its own city partner, the Social Democratic Mutual Aid Labour Party. So it often sits at the same table as Mutual Aid in the city while petitioning Mutual Aid at territorial level, which members call arguing in the same boat. On protecting the old town, it often votes with the opposition Longhouse Party.\nIts voters are the people of Viking Port, above all in the port, shipping and dockside districts, and outside the city it has almost no votes. Dockworkers, ferry crews, old-town shopkeepers and young families unwilling to move to the capital are its base. The slogan, Viking Port decides for Viking Port, is printed on every leaflet. The flag has a deep blue triangle at the hoist and blue and white stripes across the field, with a gull in flight.\nThe movement holds its congress in an old warehouse in the harbour district, and before it begins someone strikes an old ship's bell three times, meaning the ship has come in. Every year it organises a Homecoming Day march from the port authority building to the old quay, where marchers set paper boats carrying their demands on the water. There is an unwritten rule that every draft programme must first be read aloud to workers in a quayside café, and anything they cannot follow is rewritten. Party leader Qin Wangshu likes to say that the movement's programme need be no longer than a tide table."
    history:
      zh: "海港运动起于维京港居民反对把港务局迁往首府的一次请愿。请愿成功、港务局留在了老港区之后，发起人发现市民的不满远不止一个机构的去留，于是决定参加市议会选举，后来也参加领地议会选举。它此后一直坚持只在维京港和周边竞选，把「本地事本地定」当作立党的根本。"
      en: "The movement began with a petition by Viking Port residents against moving the port authority to the capital. When the petition succeeded and the port authority stayed in the old harbour, its organisers found that the city's discontent went far beyond where one office sat, and decided to stand for the city council, and later for the territorial parliament too. It has stood only in Viking Port and its surroundings ever since, treating local decisions for local places as the reason it exists."
    flag_notes:
      zh: "党旗靠旗杆一侧是一个深蓝色的三角，旗面由海蓝与白色相间的横条组成，上面飞着一只海鸥。深蓝三角象征老港的码头和城市的根，蓝白横条是港湾里一道道的浪和航道标线。海鸥是维京港码头上常见的鸟，总是绕着港口飞，从不远去，党员说它就像海港运动：只认这一座港。"
      en: "The flag has a deep blue triangle at the hoist and alternating sea-blue and white stripes across the field, with a gull flying over them. The triangle stands for the old harbour's quays and the city's roots; the stripes are the waves in the harbour and the lines of the channel. The gull is a familiar bird on Viking Port's quays and always circles the harbour without straying far, which members say is just like the movement: loyal to one port."
    factions:
      - names: { zh: "老码头派", en: "Old Quay Group" }
        notes: { zh: "以老城居民和小店主为主，首先看重老城保护、海事博物馆和规划审批权，对新泊位扩建持保留态度，在遗产问题上愿意与长屋党合作。", en: "Mostly old-town residents and shopkeepers, it puts old-town protection, the maritime museum and planning powers first, has reservations about new berths, and will work with the Longhouse Party on heritage." }
      - names: { zh: "新泊位论坛", en: "New Berth Forum" }
        notes: { zh: "码头工人、航运从业者和渡轮船员的圈子，关心港口就业、收入分成和过路费，主张扩建港区，与社会民主互助工党的工会关系密切。", en: "The circle of dockworkers, shipping workers and ferry crews, concerned with port jobs, revenue sharing and tolls; it backs expanding the port and has close ties to the Social Democratic Mutual Aid Labour Party's unions." }
      - names: { zh: "城市联盟派", en: "Cities Alliance Group" }
        notes: { zh: "主张把海港运动的市政主义推广到北维京岛其他城市，与各地的地方团体组成联合名单，冲击领地议会的门槛。成员多是海港青年和年轻的市议员。", en: "Wants to carry the movement's municipalism to other North Viking Island cities and form joint lists with local groups elsewhere to break the territorial threshold. Its members are mostly from Harbour Youth and younger councillors." }
    organisation:
      newspaper: { zh: "《港口信使》", en: "The Harbour Messenger" }
      think_tank: { zh: "老港城市研究所", en: "Old Harbour Urban Institute" }
      unions: { zh: "维京港码头工人协会", en: "Viking Port Dockworkers' Association" }
      women: { zh: "海港妇女会", en: "Harbour Women's Circle" }

  - id: pty_p15smt
    names: { zh: 巴克汉姆人联盟, en: Buckham League }
    short_names: { zh: 巴盟, en: "Buckham" }
    color: "#A23E8C"
    flag: { layout: diagonal, colors: ["#A23E8C", "#F7E6F0"], charge: tower }
    spectrum: -0.2
    family: { zh: 族群地区主义, en: Ethno-regionalist }
    ideology: [{ zh: 少数语言权利, en: Minority language rights }, { zh: 多元文化主义, en: Multiculturalism }, { zh: 社会自由主义, en: Social liberalism }]
    axes: { econ: 4.5, galtan: 3.0, autonomy: 2.5, green: 4.5 }
    leader: { zh: 奥塔维娅·卡尔韦西, en: Ottavia Calvessi }
    members: 4200
    youth_wing: { zh: 巴克汉姆青年, en: Buckham Youth }
    slogan: { zh: 两种语言，一个家, en: "Two tongues, one home" }
    policies:
      - { zh: 巴克汉姆语使用者超过一成的区，路牌和公文双语, en: "Bilingual signs and documents in every district where over a tenth speak Buckham" }
      - { zh: 设立巴克汉姆语广播电视频道, en: A Buckham-language radio and television channel }
      - { zh: 巴克汉姆语学校与中文学校同等拨款, en: Equal funding for Buckham-language and Chinese-language schools }
      - { zh: 修缮萨科勒老城的钟楼和石桥, en: "Restore the bell towers and stone bridges of Sakole's old town" }
    allies: [pty_jh513z, pty_ymxc2s]
    targets: { div_fbfqv9: 2 }
    lean: { "lang:art-x-buckham": 3.0 }
    notes:
      zh: "巴克汉姆人联盟代表北维京岛讲巴克汉姆语的居民，主张在巴克汉姆语使用者超过一成的区实行双语路牌和公文、设立巴克汉姆语广播电视频道、让巴克汉姆语学校与中文学校同等拨款、修缮萨科勒老城的钟楼和石桥。它是一个族群地区主义政党，却把多元文化主义写进了党纲，这本身就是它的核心张力：它到底是巴克汉姆人的党，还是所有支持双语的人的党？党内一部分人认为，联盟的意义在于守住一门语言和一个社群，口号「两种语言，一个家」里的「家」首先是巴克汉姆人的家；另一部分人则希望联盟成为全岛少数语言权利的代言人，把讲维京语、英语的少数群体也拉进来。在经济上它略偏左，在领地自治问题上倾向地方，与友党社会民主互助工党、灯塔自由民主党都能合作，但哪一家都不愿完全听它的。\n巴克汉姆语是北维京岛不少居民的母语，可联盟在领地议会选举中只拿到百分之二的选票，远远跨不过百分之五的门槛，这说明大多数讲巴克汉姆语的人投给了大党。党内对此看法不一：有人说这是联盟的失败，有人说这正是它的成功——大党为了争取巴克汉姆语选民，已经把双语路牌写进了自己的纲领。它在萨科勒市议会四十七席中有三席，但萨科勒由社会民主互助工党与全领地联邦联盟联合执政，联盟坐在反对席上。即便如此，市里新设的巴克汉姆语图书馆就是它促成的：它在预算表决中把三票押在图书馆上，换来执政联盟的让步。当初那几所面临合并的巴克汉姆语小学也是它保下来的。\n它的选民几乎全是巴克汉姆语母语者，集中在萨科勒和几个山谷小城。巴克汉姆人是岛上较早的移民之一，那里以石砌的钟楼、拱桥和长长的午餐闻名，联盟的竞选活动也常常就是一顿午餐。在巴克汉姆语社群以外，它几乎没有选票。联盟内部常说，巴克汉姆语的未来不在萨科勒的老城，而在山谷小城的小学：孩子一旦转进中文学校，一个家庭的语言往往一代人就换了。因此它把学校拨款看得比路牌更重。党旗是斜分的紫红与浅粉两色，上面一座钟楼，取自萨科勒老城。\n联盟的会议用两种语言进行，发言人每说一段就换一种语言，速记员要同时会两种文字。每年春天，它在萨科勒老城举办「两种语言」诗会，参赛的诗必须一半用中文、一半用巴克汉姆语写成，获奖的诗会被刻在一块石板上，嵌进老城的石墙。党首奥塔维娅·卡尔韦西的支部会议总是从中午开到傍晚，中间不设休息，因为午餐本身就是会议。"
      en: "The Buckham League speaks for North Viking Island's Buckham-speaking residents. It wants bilingual street signs and official documents in districts where more than a tenth of people speak Buckham, a Buckham radio and television channel, equal funding for Buckham-language and Chinese-language schools, and the restoration of the bell tower and stone bridge in Sakole's old town. It is an ethno-regionalist party that has written multiculturalism into its programme, and that is its central tension: is it the party of the Buckham, or of everyone who supports bilingualism? Some members believe the League exists to keep a language and a community alive, and that the home in its slogan, two tongues, one home, is first of all the Buckham home; others want it to speak for minority language rights across the island, bringing in Viking and English speakers too. On economics it leans slightly left and on home rule it favours the local level; it can work with both its allies, the Social Democratic Mutual Aid Labour Party and the Lighthouse Liberal Democrats, but neither will follow its lead entirely.\nBuckham is the mother tongue of many North Viking Islanders, yet the League won only two per cent at the territorial election, far below the five-per-cent threshold, which means most Buckham speakers vote for the larger parties. The party is divided on what that means: some call it the League's failure, others its success, since the larger parties, to win Buckham voters, have already written bilingual signs into their own programmes. It holds three of Sakole's 47 council seats, but Sakole is governed by the Social Democratic Mutual Aid Labour Party with the All-Territories Federal Union, and the League sits in opposition. Even so, the city's new Buckham library was its doing: in a budget vote it staked its three votes on the library and won a concession from the governing coalition. The Buckham primary schools once threatened with merger were also saved by its campaign.\nIts voters are almost all native Buckham speakers, concentrated in Sakole and a few valley towns. The Buckham were among the island's earlier settlers, and their towns are known for stone bell towers, arched bridges and long lunches; a League campaign event is often simply a lunch. Outside the Buckham-speaking community it has almost no votes. League members often say that the future of Buckham lies not in Sakole's old town but in the primary schools of the valley towns: once children move to Chinese-language schools, a family's language can change within a generation. That is why it puts school funding ahead of street signs. The flag is divided diagonally into plum and pale pink, with a bell tower taken from Sakole's old town.\nLeague meetings run in two languages, with speakers switching language every paragraph, and its minute-takers must write in both. Every spring it holds a two-tongues poetry contest in Sakole's old town, where each poem must be written half in Chinese and half in Buckham, and the winning poem is carved on a stone slab set into an old-town wall. Party leader Ottavia Calvessi's branch meetings run from noon to evening without a break, because lunch is itself the meeting."
    history:
      zh: "巴克汉姆人联盟由萨科勒的巴克汉姆语协会和教师工会组建，最初的目标是保住几所面临合并的巴克汉姆语小学。学校保住之后，发起人认为语言问题不能只靠一次次请愿，必须有人坐进议会，于是参加了萨科勒市议会选举，后来也在领地议会选举中推出名单。从那时起，学校问题一直是联盟的头等大事。"
      en: "The League was formed by Sakole's Buckham language society and teachers' union, at first to save a few Buckham-language primary schools that were to be merged. Once the schools were saved, the founders concluded that the language could not depend on one petition after another and needed someone in the chamber, so they stood for Sakole's council, and later put up a list at territorial elections too. Schools have been the League's first concern ever since."
    flag_notes:
      zh: "党旗沿对角线分成紫红与浅粉两色，上面是一座钟楼。两种颜色象征两种语言：彼此不同，却共用一面旗，正合口号「两种语言，一个家」。钟楼取自萨科勒老城的石砌钟楼，是巴克汉姆人社群熟悉的地标，也是联盟要修缮的对象。党员说，钟楼每到整点同时为两种语言的人报时。"
      en: "The flag is divided diagonally into plum and pale pink, with a bell tower on it. The two colours stand for two languages, different but sharing one flag, just as the slogan says: two tongues, one home. The tower is the stone bell tower of Sakole's old town, a landmark every Buckham speaker knows and one the League wants restored. Members say it strikes the hour for speakers of both languages at once."
    factions:
      - names: { zh: "钟楼派", en: "Bell Tower Group" }
        notes: { zh: "党内的社群核心，以萨科勒的语言协会和老城居民为主，主张联盟专注于巴克汉姆语教育、媒体和老城修缮，不必扩大成泛少数语言政党。", en: "The party's community core, mainly Sakole's language society and old-town residents, which wants the League to concentrate on Buckham schooling, media and old-town restoration rather than broaden into a party for all minority languages." }
      - names: { zh: "多语论坛", en: "Many Tongues Forum" }
        notes: { zh: "主张把联盟办成全岛少数语言权利的代言人，与维京语、英语社群的团体结盟，成员多是年轻的教师、翻译和巴克汉姆青年。", en: "Wants the League to speak for minority language rights across the island and to ally with Viking and English community groups; its members are mostly young teachers, translators and Buckham Youth activists." }
      - names: { zh: "山谷圈", en: "Valley Circle" }
        notes: { zh: "代表萨科勒以外的山谷小城，关心乡村学校、道路和小企业，政治上较务实，倾向与社会民主互助工党密切合作以换取具体项目。", en: "Represents the valley towns beyond Sakole, concerned with village schools, roads and small businesses; it is more pragmatic and inclined to work closely with the Social Democratic Mutual Aid Labour Party in return for concrete projects." }
    organisation:
      newspaper: { zh: "《双语周报》", en: "The Bilingual Weekly" }
      think_tank: { zh: "石桥语言政策研究所", en: "Stone Bridge Institute for Language Policy" }
      unions: { zh: "萨科勒巴克汉姆语教师工会", en: "Sakole Buckham Teachers' Union" }
      women: { zh: "巴克汉姆妇女协会", en: "Buckham Women's Association" }

