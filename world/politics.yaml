    targets: { div_hpmerr: 7 }
    lean: { "city:div_dk2gh7": 2.2, lat: 0.25, urban: -0.4, fishing: 0.5, port: 0.2 }
    notes:
      zh: "北岸联盟代表北冰洋领地北岸的居民，大本营是基卢克图阿尔原住民自治区。那里的小镇每年冬天要经历九十九天的极夜，海面封冻，补给全靠破冰船和飞机；大河两岸的人家靠捕鱼、狩猎和港口过日子，几乎家家门后挂着一支猎枪和一根鱼竿。联盟是一个保守的地方主义政党：经济上主张低税、少管制，社会议题上看重家庭、乡邻和祖辈传下的渔猎规矩，在领地自治与中央统筹之间站在最靠近自治的一端，信条只有一句：北岸的事情应当在北岸决定。它的主张都很具体：北岸近海和大河的渔业配额由自治区议事会分配，本地渔船优先；保留西尔米努卡的海警与破冰船基地，冬季每周至少一班破冰补给船；降低北岸的燃油税和极夜电价；未经自治区议事会同意，不在北岸新设保护区和禁猎区；狩猎和持枪许可证在自治区当地办理。党名里的「联盟」并非虚词——它最初就是几个小镇居民委员会的联合，党章至今规定，每个北岸小镇无论人口多少，在党代会上都有同样多的代表。\n联盟内部的张力也来自这种结构。主张「破冰船优先」的清单派相信，只要补给船、电价和诊所能落实，跟哪个政府谈都可以；大河派则认为，自治区既然有了自己的议事会，就该把渔业、港口和猎场的事一件件收回北岸，少向南方伸手。在生态与增长之间，联盟明显偏向增长，欢迎新的港口、冷库和加工厂，却对远洋拖网船队进入北岸渔场格外警惕；它反对不经北岸商量就划出的保护区，却又是北岸最积极组织巡河、清理河岸的政党，党员们说：「河是我们的，所以我们来管。」小镇的人口在减少，年轻人去南方读书后很少回来，联盟的每一份纲领都在回答同一个问题：怎样让留在大河边的人过得不比走掉的人差。\n上一次选举，北岸联盟得票6.5%，在北冰洋领地议会71席中拿到4席，在野。它不在塔夫鲁利特人民党领导的四党政府里，但只要预算里有北岸的破冰船和诊所，它仍是总理尼维卡克·陶武里亚克可以争取的票。联盟的议员以「一张清单」出名：每次预算谈判他们只带一张纸，上面列着北岸各镇当年最缺的东西，谈下一项就划掉一项；极夜电价却一直没有降到他们想要的水平，只在最冷的几周打了折扣，党内常拿这件事自嘲。在基卢克图阿尔原住民自治区议事会39席中，联盟占15席，是第一大党，自治区主席出自联盟，它与长老之道和金库党组成三党联合政府。友党渔农党在领地议会里没有议席，冰原上的北方领土保守党则是它最亲近的兄弟党，两党的议员在领地议会里常常一起投票。\n联盟的选民地理几乎就是一条大河：越靠近基卢克图阿尔河、越靠海、越是渔猎小镇，它的票越多；在南部和城市选民中，它的支持很薄。出了基卢克图阿尔，它在萨尔瓦克、图利瓦克、考尔尼克和乌维克萨克的市议会、西尔米瓦克自由邦议会和塔夫鲁利特原住民自治区议事会各只有1席，在努卡塔克和乌库拉克则没有议席。党旗是深蓝色的夜空压在白色的峡湾海岸上，夜空中一枚浅蓝色的雪花。联盟的党代会在每年极夜结束后的第一个晴天召开，代表们先一起到河口看太阳重新升起，再进会场；如果那天云又压了下来，会议就顺延。口号「冰封的海岸也要通航」最早用油漆写在一艘渔船的船舷上，补给船停航的那个冬天，这艘船在冰缝之间跑了一趟又一趟。"
      en: "The North Shore Alliance speaks for the people of the Arctic Ocean Territory's north coast, and its home ground is the Kiluktuar Indigenous Autonomous Region. Its towns go through ninety-nine days of polar night each winter while the sea freezes and supplies come only by icebreaker and aircraft; the households along the great river live by fishing, hunting and the harbour, and behind almost every door hang a hunting rifle and a fishing rod. The Alliance is a conservative regionalist party: low taxes and light regulation on the economy, family, neighbours and the fishing and hunting customs of the forebears on social questions, and on self-government versus central planning it stands at the self-government end, with a single creed: the north coast's business should be settled on the north coast. Its demands are concrete: fishing quotas on the north-coast waters and the great river shared out by the Regional Assembly, local boats first; the coast guard and icebreaker base at Sirminuqa kept, with at least one icebreaking supply ship a week in winter; lower fuel duty and polar-night power prices on the north coast; no new reserve or hunting ban on the north coast without the Regional Assembly's consent; and hunting and firearms licences issued locally. The 'alliance' in its name is meant literally. It began as a union of several towns' residents' committees, and its rules still give every north-coast town, whatever its size, the same number of delegates at congress.\nThat structure is also the source of the Alliance's tensions. The List, who put 'icebreakers first', believe that as long as the ships, the power prices and the clinics are delivered, the party can deal with any government; the River Wing holds that now the region has an assembly of its own, the fisheries, the harbours and the hunting grounds should be brought home to the north coast one by one, with less holding out of hands to the south. Between ecology and growth the Alliance leans clearly towards growth, welcoming new harbours, cold stores and processing plants, but it is wary of deep-sea trawler fleets entering north-coast waters; it opposes reserves drawn without asking the north coast, yet it is the party that most busily organises river patrols and riverbank clean-ups, and members say 'the river is ours, so we look after it'. The towns are shrinking, and the young who go south to study rarely come back, so every Alliance programme tries to answer the same question: how to make sure those who stay by the great river are no worse off than those who leave.\nAt the last election the Alliance won 6.5% and 4 of the Arctic Ocean assembly's 71 seats, and sits in opposition. It is not part of the four-party government led by the Tavrulit People's Party, but whenever the budget holds icebreakers and clinics for the north coast it is still a vote Premier Nivikkaaq Tauvvuriaq can win over. Its members are known for 'the list': they bring a single sheet of paper to every budget negotiation, listing what the north-coast towns most need that year, and cross off each item as it is won; polar-night power prices have never come down as far as they want, only a discount in the coldest weeks, and the party often jokes at its own expense about it. On the Kiluktuar Indigenous Autonomous Region's 39-seat assembly the Alliance holds 15 seats, the largest group; the Regional Chair comes from its ranks, and it governs in a three-party coalition with the Way of the Elders and the Vault Party. Its ally the Fishers and Farmers Party has no seat in the territorial assembly, while the Northern Territories Conservative Party of the ice fields is its closest sister party, and the two parties' members often vote together in the territorial assembly.\nThe Alliance's electoral map is almost the map of a river: the nearer the Kiluktuar River, the nearer the sea and the more a town lives by fishing and hunting, the more votes it gets, while its support among southern and urban voters is thin. Outside Kiluktuar it has a single seat each on the councils of Saarvaq, Tullivaq, Qaurniq and Uviqsaaq, in the Free State of Sirmivak's assembly and on the Tavrulit Indigenous Autonomous Region's council, and none in Nuqattaaq or Ukkulaaq. Its flag shows a deep-blue night sky over a white fjord coast, with a pale-blue snowflake in the sky. Its congress meets on the first clear day after the polar night ends each year, and the delegates first go down to the river mouth together to watch the sun come back before going inside; if the cloud closes in again, the congress waits. The slogan 'Even a frozen coast needs ships' was first painted on the side of a fishing boat that ran trip after trip through the cracks in the ice in the winter the supply ship stopped."
    history:
      zh: "北岸联盟起于一个冬天：那年的破冰补给船因故障停航了一个月，北岸几个小镇的居民自发组织起来，用渔船和雪地车运送补给，镇与镇之间靠无线电排班。危机过去后，各镇的居民委员会决定不再散伙，联合组成了一个政党，取名北岸联盟，并把那个冬天的经验写成了第一份纲领：补给、电力、医疗和渔获。党内至今把那个冬天称作「自救的冬天」，每次党代会开幕都要先念一遍当年的无线电排班表。此后，大河两岸的猎户和船东成了联盟的骨干，它的主张也从替小镇争预算，转向低税、少管制和北岸自己做主的保守地方主义；基卢克图阿尔原住民自治区设立后，联盟成为自治区议事会的第一大党。"
      en: "The Alliance began in a winter when the icebreaking supply ship broke down for a month. The people of several north-coast towns organised themselves to bring in supplies by fishing boat and snowmobile, drawing up a rota between the towns by radio. When the crisis was over, the towns' residents' committees decided not to disband and joined to form a party, the North Shore Alliance, turning that winter's experience into their first programme: supplies, power, health care and the catch. The party still calls it 'the winter we saved ourselves', and every congress opens with a reading of that winter's radio rota. Since then the hunters and boat owners of the great river have become the Alliance's backbone, and its programme has moved from fighting for small towns' budgets to a conservative regionalism of low taxes, light regulation and the north coast deciding for itself; once the Kiluktuar Indigenous Autonomous Region was created, the Alliance became the largest party on its assembly."
    flag_notes:
      zh: "党旗分上下两部分：上方是深蓝色的夜空，下方是白色的冰雪海岸，分界线两侧高、中间凹下，像一道切进海岸的峡湾。夜空正中是一枚浅蓝色的雪花。深蓝代表漫长的极夜，白色代表封冻的海面和积雪，雪花是北岸冬天的标志，也寓意每个小镇像雪花的一瓣，各不相同，又连在一起。"
      en: "The flag is divided into a deep-blue night sky above and a white coast of snow and ice below, the line between them rising at both sides and dipping in the middle like a fjord cutting into the shore. A pale-blue snowflake sits in the middle of the sky. The deep blue is the long polar night, the white the frozen sea and snow; the snowflake is the emblem of the north-coast winter, and its arms stand for the towns, each different and all joined."
    factions:
      - names: { zh: "清单派", en: "The List" }
        notes: { zh: "主张把精力集中在补给船、电价和诊所这些具体项目上，与任何政府逐项谈判，换取北岸的预算。代表小镇的镇议员和诊所、学校的工作人员，在领地议会的党团里占多数。", en: "Those who want to concentrate on concrete things like supply ships, power prices and clinics and bargain item by item with any government for the north coast's budget. They speak for town councillors and the staff of clinics and schools, and make up most of the party's group in the territorial assembly." }
      - names: { zh: "大河派", en: "River Wing" }
        notes: { zh: "主张把渔业配额、港口收入、猎场和能源项目的审批一件件收归自治区议事会，少向首府伸手，在税收和管制上比清单派更靠右。代表大河两岸的猎户、船东和回乡工作的年轻一代，是自治区政府里最有分量的一派。", en: "Those who want fishing quotas, harbour revenue, hunting grounds and the approval of energy projects brought one by one under the Regional Assembly, with less reliance on the capital, and who stand further right than the List on taxes and regulation. They speak for the hunters and boat owners along the great river and the young people who have come home to work, and carry the most weight in the regional government." }
      - names: { zh: "渔港合作圈", en: "Fishing Harbour Circle" }
        notes: { zh: "渔民和加工厂工人，关心渔获本地加工、冷库和渔港建设，与渔农党关系密切，对远洋拖网船进入北岸渔场尤其警惕。", en: "Fishers and processing workers who care about local processing, cold stores and harbour building, close to the Fishers and Farmers Party and especially wary of deep-sea trawlers in north-coast waters." }
    organisation:
      newspaper: { zh: "《北岸通讯》", en: "North Shore Dispatch" }
      think_tank: { zh: "偏远地区发展研究中心", en: "Centre for Remote Development" }
      unions: { zh: "北岸渔民合作社", en: "North Shore Fishers' Cooperative" }
      women: { zh: "北岸妇女会", en: "North Shore Women's Association" }

  - id: pty_xbk4h7
    names: { zh: 北方领土保守党, en: Northern Territories Conservative Party }
    short_names: { zh: 北保, en: "Northern Conservatives" }
    color: "#9C5B2E"
    flag: { layout: horizon, colors: ["#9C5B2E", "#F4F8FB"], edge: peaks, charge: bear, charge_color: "#F4F8FB" }
    spectrum: 2.2
    family: { zh: 保守主义, en: Conservative }
    ideology: [{ zh: 保守主义, en: Conservatism }, { zh: 地方主义, en: Localism }, { zh: 小政府, en: Small government }, { zh: 自耕自立, en: Self-reliance }]
    axes: { econ: 7.5, galtan: 7.5, autonomy: 0.5, green: 6.5 }
    leader: { zh: 卡卢拉克·图尼亚克, en: Kallurak Tuunijaq }
    members: 1900
    youth_wing: { zh: 冰原青年, en: Icefield Youth }
    slogan: { zh: 自己的雪自己铲, en: Everyone shovels their own snow }
    policies:
      - { zh: 在自由邦荒地上自建住房并常住的居民，可以把宅基地登记在自己名下, en: Residents who build and live on Free State wild land may register the homestead in their own name }
      - { zh: 冰川向导、猎人和探矿者的许可证由自由邦发放，三十天内批复, en: "Licences for glacier guides, hunters and prospectors issued by the Free State, within thirty days" }
      - { zh: 自由邦的地方税保持领地最低，预算逐笔公开, en: "The lowest local taxes in the territory, and every line of the Free State budget published" }
      - { zh: 防熊步枪许可证在各镇办事处当场办理, en: Bear-rifle licences issued on the spot at every town office }
      - { zh: 各镇学校的课程和校历由镇上的学校董事会决定, en: Each town's school board sets its own curriculum and calendar }
      - { zh: 领地的新规章在自由邦实施前，须经自由邦议会表决同意, en: New territorial regulations to take effect in the Free State only after a vote of the Free State Assembly }
    allies: [pty_4ahf45, pty_1aej3q, pty_mak5vy]
    targets: { div_hpmerr: 3.5 }
    lean: { "city:div_d48kz7": 3.0, urban: -0.3, old: 1.0, tourism: 0.3 }
    notes:
      zh: "北方领土保守党（简称北保）是西尔米瓦克自由邦的执政党，一个扎根冰原的保守主义政党。西尔米瓦克是领地面积最大、人口最稀的市级区划，镇与镇之间隔着上百公里的冰原，冰川向导、猎人、探矿者、观测站和滑雪场的工作人员是这里最常见的职业。北保相信小政府和自耕自立：在自由邦荒地上自建住房并常住的居民，可以把宅基地登记在自己名下；冰川向导、猎人和探矿者的许可证由自由邦发放，三十天内批复；地方税保持领地最低，预算逐笔公开；防熊步枪许可证在各镇办事处当场办理；各镇学校的课程和校历由镇上的学校董事会决定；领地的新规章在自由邦实施前，须经自由邦议会表决同意。党名里的「北方领土」说的是冰盖、冰原和北方海上的群岛，党员们说，这片土地太大、太冷，远在南岸的任何一间办公室都管不过来，只有住在冰原上的人自己管得了。\n党内最大的张力在荒野上。宅基地派希望把更多荒地放给自建住房的居民和小矿主，向导派却靠冰盖和群岛的原样吃饭，担心新房和矿坑会吓跑来看冰川的游客；两派住在同一个镇上，常常在同一家咖啡馆里争到打烊。另一重张力在小政府本身：北保主张少收税、少管事，可镇与镇之间的雪道、卫星电话基站和医疗直升机都要花钱，党内的镇议会派因此给每一笔开支都加上一句「这是不是只有政府才能做」，冰原上的选民则常常回答：「是，但要我们自己来管。」北保在社会议题上偏传统，看重家庭、邻里互助和自食其力；在生态与增长之间偏向增长，却坚持冰盖上的开发必须由自由邦自己审批。\n上一次选举，北保得票3.3%，刚好跨过门槛，在北冰洋领地议会71席中拿到2席，在野。在西尔米瓦克自由邦议会33席中，它占13席，是第一大党，自由邦主席出自北保，它与金库党和长老之道组成三党联合政府；三党在减税和简化许可证上意见一致，在冰盖开发上却要一项一项地谈。友党北岸联盟在大河边的基卢克图阿尔领导自治区政府，两党在领地议会里常常一起投票，南岸的报纸把它们合称为「北方两党」；长老之道和全领地联邦联盟也是它的友党。\n北保的选民几乎都在西尔米瓦克：冰川小镇、观测站和滑雪场是它的票仓，乡村选民和旅游业者是它的基本盘，城市选民很少投它；出了自由邦，它在任何一个市议会里都没有议席。党首卡卢拉克·图尼亚克当了大半辈子的冰川向导，至今每年夏天还要亲自带一队游客上冰盖，他说，在冰上待过的人都知道，规矩少一点，绳子就要系得更紧一点。党旗是铜褐色的天空下一道白色的雪峰，天空一角立着一头白熊。党代会在西尔米卡尔维克的冰旅馆里召开，会场里没有暖气，代表们穿着皮大衣举手表决，散会后一起去吃驯鹿肉排；口号「自己的雪自己铲」后面还有一句很少写出来的下半句：「邻居的雪，一起铲。」"
      en: "The Northern Territories Conservative Party (Northern Conservatives for short) governs the Free State of Sirmivak, a conservative party rooted in the ice fields. Sirmivak is the largest and most thinly peopled city-level division in the territory, its towns a hundred kilometres or more apart across the ice, and glacier guides, hunters, prospectors and the staff of observatories and ski fields are its most common trades. The party believes in small government and self-reliance: residents who build and live on Free State wild land may register the homestead in their own name; licences for glacier guides, hunters and prospectors are issued by the Free State within thirty days; local taxes are kept the lowest in the territory and every line of the budget is published; bear-rifle licences are issued on the spot at every town office; each town's school board sets its own curriculum and calendar; and new territorial regulations take effect in the Free State only after a vote of the Free State Assembly. The 'northern territories' of its name are the ice cap, the ice fields and the islands of the northern seas, and members say this land is too big and too cold for any office far away on the south coast to run; only the people who live on the ice can.\nThe party's deepest tension lies out in the wilderness. The Homesteaders want more wild land opened to people building their own homes and to small miners, while the Guides' Wing lives off the ice cap and the islands as they are and fears that new houses and pits will scare off the visitors who come to see the glaciers; the two live in the same towns and often argue in the same café until closing time. A second tension lies in small government itself: the party wants less tax and less interference, yet the snow roads between the towns, the satellite phone masts and the air ambulances all cost money, so the Town Hall Conservatives ask of every item of spending whether only government can do it, and the voters of the ice fields often answer: 'Yes, but let us run it.' On social questions the party leans traditional, valuing family, neighbourly help and paying one's own way; between ecology and growth it leans towards growth, but insists that development on the ice cap be approved by the Free State itself.\nAt the last election the Northern Conservatives won 3.3%, just over the threshold, and 2 of the Arctic Ocean assembly's 71 seats, and sit in opposition. On the Free State of Sirmivak's 33-seat assembly they hold 13 seats, the largest group; the President of the Free State comes from their ranks, and they govern in a three-party coalition with the Vault Party and the Way of the Elders. The three agree on tax cuts and simpler licences but have to negotiate development on the ice cap item by item. Their ally the North Shore Alliance leads the regional government in Kiluktuar by the great river, the two often vote together in the territorial assembly, and the south-coast papers call them 'the northern pair'; the Way of the Elders and the All-Territories Federal Union are also allies.\nAlmost all of the party's voters are in Sirmivak: the glacier towns, the observatories and the ski fields are its strongholds, rural voters and the tourism trade its core, and city voters seldom back it; outside the Free State it holds no seat on any city council. Its leader, Kallurak Tuunijaq, has spent most of his life as a glacier guide and still takes a party of visitors onto the ice cap himself every summer; anyone who has been on the ice, he says, knows that the fewer the rules, the tighter you tie the rope. The flag shows a white range of snow peaks under a copper-brown sky, with a white bear in one corner of the sky. The congress meets in the ice hotel at Sirmiqarvik, in a hall with no heating, where delegates vote with raised hands in fur coats and afterwards go off together for reindeer steaks; the slogan 'Everyone shovels their own snow' has a second half that is seldom written down: 'and the neighbours' snow together.'"
    history:
      zh: "北方领土保守党起于西尔米卡尔维克冰旅馆里的一场镇民大会。几位冰川向导、猎人和小旅馆老板发现，带客人上冰盖、进山打猎都要去南岸的首府办许可证，一张证要排上几个月的队，于是在冰砌的大厅里坐了一夜，决定自己组一个党。第一份纲领只有一页纸，写着三句话：许可证在本地办，税留在本地用，学校由本镇管。西尔米瓦克自由邦设立后，北保成为自由邦议会的第一大党，那一页纸至今镶在党部的墙上，旁边是一把冰镐。"
      en: "The Northern Territories Conservative Party began at a town meeting in the ice hotel at Sirmiqarvik. A few glacier guides, hunters and small hoteliers found that taking guests onto the ice cap or into the hills to hunt meant getting a licence in the capital on the south coast and queueing for months, so they sat up all night in the hall of ice and decided to form a party of their own. Its first programme was a single page with three sentences: licences issued here, taxes spent here, schools run by the town. When the Free State of Sirmivak was created the party became the largest on its assembly, and that page still hangs framed on the wall of the party office, beside an ice axe."
    flag_notes:
      zh: "铜褐色的天空下是一道白色的雪峰，天空一角立着一头白熊。铜褐色是冰原上傍晚的天色，也是老向导皮大衣的颜色；雪峰是西尔米冰盖和从冰上拔起的群峰；白熊是冰原上最古老的邻居，也是北保党员出门要带防熊步枪的原因。"
      en: "A white range of snow peaks under a copper-brown sky, with a white bear standing in one corner of the sky. The copper brown is the colour of the evening sky over the ice and of the old guides' fur coats; the peaks are the Sirmi Ice Cap and the summits rising from it; the bear is the ice fields' oldest neighbour, and the reason members never go out without a bear rifle."
    factions:
      - names: { zh: "宅基地派", en: "Homesteaders" }
        notes: { zh: "主张把更多荒地放给自建住房的居民和小矿主，简化宅基地登记，让年轻人能在冰原上安家。代表新来的居民、小矿主和建筑工人。", en: "Those who want more wild land opened to people building their own homes and to small miners, and simpler homestead registration so that the young can settle on the ice fields. They speak for newcomers, small miners and builders." }
      - names: { zh: "向导派", en: "Guides' Wing" }
        notes: { zh: "冰川向导、猎人和旅馆老板，靠冰盖和群岛的原样吃饭，支持减税和本地发证，却对新房和矿坑格外谨慎，坚持冰盖上的开发要先过他们这一关。", en: "Glacier guides, hunters and hoteliers who live off the ice cap and the islands as they are; they back tax cuts and local licensing but are wary of new houses and pits, and insist any development on the ice must get past them first." }
      - names: { zh: "镇议会派", en: "Town Hall Conservatives" }
        notes: { zh: "各镇的镇议员和学校董事，关心预算公开、雪道维护和学校自主，给每一笔开支都加上一句「这是不是只有政府才能做」，是党内的财政守门人。", en: "Town councillors and school board members who care about open budgets, snow-road upkeep and school self-rule, and ask of every item of spending whether only government can do it; they are the party's fiscal gatekeepers." }
    organisation:
      newspaper: { zh: "《冰原报》", en: "The Icefield Herald" }
      think_tank: { zh: "自耕自立研究所", en: "Institute for Self-Reliance" }
      unions: { zh: "西尔米瓦克向导与猎人协会", en: "Sirmivak Guides' and Hunters' Association" }
      women: { zh: "冰原妇女会", en: "Icefield Women's Association" }

