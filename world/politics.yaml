    lean: { port: 0.3, shipbuilding: 0.5, manufacturing: 0.3, fishing: 0.2, income: -0.4, urban: 0.2 }
    notes:
      zh: "第一群岛社会民主党（简称第一群岛）是维京群岛两大党之一，也是现在的执政党。党名里的「第一群岛」是殖民时代的旧称：宗主国的航海图把这片群岛标作「第一群岛」，因为它是远洋航线上最先遇到的岛群；船坞和渔船上的工人把这个名字反过来用，意思是群岛的事要先由住在群岛上的人说了算，排在远方的殖民当局和船东前面。它长期就叫「第一群岛党」，改名时在后面加上「社会民主」四个字，党内为此争了整整一届党代会：船坞城镇的老党员觉得「第一群岛就是第一群岛，用不着解释」，担心一个意识形态词会把渔民、酒店员工和小店主这些并不自认为左派的支持者推开；主张改名的一方则说，它与海底隧道另一头的社会民主互助工党本是姊妹党，名字应当说清楚自己站在哪里。最后简称照旧。这场争论背后是一个大帐篷政党的老难题：船坞工会要的是订单和工资，渔港要的是燃油和航线，长船城里的年轻租客要的是房子，旺季来打工的临时工要的是社保，四种诉求放进同一份预算，常常彼此挤占。\n在上一次选举中，第一群岛以百分之三十一点三的得票拿下六十一席中的三十二席，只比过半多一席，仍然单独执政。它的得票其实比蓝桨保守党少半个多百分点，赢在选票集中在船坞城镇和渔港的选区里；一席的余量经不起几次缺席，遇到重要表决，党鞭会提前排好每位议员的渡轮班次。内阁十一个部中有十个由第一群岛党人出掌，对外事务部交给了一位无党籍的职业外交官；党首卡娅·布伦维克出任首席部长，议长英韦尔德·埃尔德鲁普也出自第一群岛。布伦维克上任后先推全领地的集体工资协议，把渔船、船坞和酒店员工纳入同一套工资谈判，旅游旺季的临时工也享有同等社保。居民免费渡轮则受预算所限分批推行，先从外岛航线做起，大岛之间仍要买票，蓝桨保守党讥讽这是「一半免费的船」。最难兑现的是每座有人居住的岛上都有一名全科医生：医生不愿常住只有几十户人家的小岛，政府只好派巡诊船轮流停靠，批评者说那是「每周只来一天的医生」。从温泉和海滩收入中拿出一部分修公共住房的计划，则在暖泉岛的酒店业主中引起了强烈反对。\n第一群岛的地盘与群岛的航运和造船地图几乎重合。它在二十个市中的九个出任市长，并且都单独执政：弗洛德维克市议会三十五席中它占三十二席，西格拉维克三十五席中占二十八席，乌利克尤阿克市议事会二十九席中占二十四席，布兰诺克堡二十七席中占二十三席；在蓝桨实力不弱的集装箱大港阿克斯维克，它以二十一席对十八席守住了市长。另外几座城市争得很近：谢尔海姆和卡洛韦堡的市议会里，它与蓝桨席位打平，小岛联邦党的几席决定了归属，两市最后都由蓝桨与小岛联合执政；在托克维克，它的得票领先两个多百分点，席位却以十八对十九落后。首府长船和圣翁丁的市长也都出自蓝桨。它的弱点在乡村、高收入社区和老年人多的小镇：富鲁海姆市议会三十三席中它只有四席，排在小岛之后，莫塞、暖泉和埃德文港都由蓝桨执政；在小岛联邦党执政的乌维克库特，它只排第三。党内常说，第一群岛的票是跟着船走的，哪里有船坞的吊车和清晨的鱼市，哪里就有第一群岛。\n党旗上的帆，是群岛渔船的老式帆。党员爱说「风是大家的，帆也是大家的」，口号「同一阵风，同一条船」也由此而来。每到选举之夜，支持者会在长船古城的老码头升起一面红色的船帆，等计票结束再决定是否降下；隔着汇金湾，群岛银行大厦的塔顶会按胜选一方的颜色亮灯，老码头上的人看到对岸亮起红光，才肯散去。第一群岛的竞选集会少不了一场划船比赛，候选人常被拉上船掌一回舵。党代会照例在一座船坞的大棚里开，代表们坐在倒扣的船壳上发言。每年夏天，第一群岛青年与社会民主互助工党的青年团在海底隧道两端轮流办营。"
      en: "The First Islands Social Democrats (First Islands for short) are one of the Viking Islands' two big parties and the party now in government. 'First Islands' is an old colonial name. The colonial power's charts marked the archipelago as the First Islands, the first group met on the ocean route, and the boatyard and fishing crews turned the name around to mean that the islands' affairs belong first to the people who live on them, ahead of the distant colonial office and the boat owners. For most of its life the party was simply the First Islands Party, and adding the words 'Social Democrats' took a whole party congress of argument. Old members from the boatyard towns felt that the First Islands are the First Islands and need no explaining, and feared that an ideological label would push away the fishers, hotel staff and small shopkeepers who vote for the party without thinking of themselves as left-wing. The reformers replied that the party and the Social Democratic Mutual Aid Labour Party at the other end of the undersea tunnel are sister parties, and the name ought to say plainly where it stands. In the end the short name stayed as it was. Behind the quarrel lies the old problem of a big-tent party: the boatyard unions want orders and wages, the fishing harbours want fuel and routes, young renters in Longship want homes and seasonal workers want social insurance, and when all four are put into one budget they keep crowding each other out.\nAt the last election First Islands took 32 of the 61 seats on 31.3% of the vote, one more than a majority, and still governs alone. It actually polled more than half a point fewer votes than the Blue Oar Conservatives, and won because its vote is concentrated in the constituencies of the boatyard towns and fishing harbours. A majority of one does not survive many absences, so before an important vote the whips plan every member's ferry. It holds ten of the eleven ministries; External Affairs went to a non-partisan career diplomat. Its leader Kaja Brennvik is Chief Minister, and the Speaker, Ingveld Eldrup, is also First Islands. Brennvik began with a territory-wide collective wage agreement that brings fishing crews, boatyards and hotel staff into the same bargaining, with equal social insurance for seasonal tourist workers. Free ferries for residents are arriving in stages because of the budget, starting with the outer-island routes, so passengers between the big islands still buy tickets, and the Blue Oar Conservatives mock it as 'a half-free boat'. Hardest of all is the promise of a general practitioner on every inhabited island. Doctors are reluctant to live on islands of a few dozen households, so the government sends clinic boats on a rota, and critics call it 'a doctor one day a week'. The plan to put part of the hot spring and beach revenue into public housing has met fierce opposition from hotel owners on Warmspring Island.\nFirst Islands' map almost matches the islands' map of shipping and shipbuilding. It holds the mayoralty in nine of the twenty cities, governing alone in every one: 32 of the 35 seats on Flodvik's council, 28 of 35 in Siglavik, 24 of the 29 on Ulikjuaq's town assembly and 23 of 27 in Fort Brannock. In Akkersvik, the great container port where Blue Oar is strong, it holds the mayoralty with 21 seats to 18. Several other cities were close. On the councils of Kjølheim and Fort Calloway it tied with Blue Oar, a few Small Isles seats decided the outcome, and both are now run by Blue Oar with Small Isles; in Tåkevik it led by more than two points yet trails by 18 seats to 19. The mayors of the capital, Longship, and of Saint-Ondine are Blue Oar too. Its weak spots are the countryside, the well-off neighbourhoods and the small towns with many older people: it has just 4 of Furuheim's 33 seats, behind Small Isles, Måsey, Warmspring and Port Edevane are run by Blue Oar, and in Uviqkut, run by the Small Isles Federal Party, it comes third. Members say the party's vote follows the boats: wherever there are boatyard cranes and an early-morning fish market, there is First Islands.\nThe sail on the flag is the old sail of the islands' fishing boats. Members like to say that the wind belongs to everyone and so does the sail, which is where the slogan 'One wind, one boat' comes from. On election night supporters raise a red sail on the old quay of Longship's old town and decide whether to lower it only when the count is done; across Goldmark Bay the top of the Islands Bank Tower is lit in the winner's colour, and the crowd on the old quay goes home only once it sees red light on the far shore. A First Islands rally always has its rowing race, and candidates are often pulled into a boat to take the helm. The party congress is held in a boatyard shed, with delegates speaking from upturned hulls. Each summer First Islands Youth and the youth wing of the Social Democratic Mutual Aid Labour Party camp at either end of the undersea tunnel in turn."
    history:
      zh: "第一群岛社会民主党起源于殖民时代的渔民和船坞工人互助会。那时群岛的议会只有两个派别，一派代表船工，一派代表船东；船工们借用宗主国航海图上的旧称「第一群岛」，说群岛的事要先由群岛人做主。殖民统治结束后，船工一派成为第一群岛党，船东一派成为蓝桨党，两党轮流执政的格局由此定型。第一群岛党长期以船坞城镇和渔港为根基，后来又把旅游业员工和城市租客吸纳进来，成为一个大帐篷政党。最近它把正式名称改为第一群岛社会民主党，以表明自己与社会民主互助工党同属一个政治家族，简称仍是「第一群岛」。"
      en: "The First Islands Social Democrats grew out of the mutual aid societies of fishers and boatyard workers in colonial times, when the islands' assembly had only two factions, one for the boat crews and one for the boat owners. The crews borrowed the name the colonial charts gave the archipelago, the First Islands, to say that the islands' affairs belonged to the islanders first. When colonial rule ended the crews' faction became the First Islands Party and the owners' faction the Blue Oar Party, and the pattern of the two taking turns in government was set. The First Islands Party long rested on the boatyard towns and fishing harbours, and later drew in tourism workers and urban renters to become a big-tent party. It has recently changed its formal name to the First Islands Social Democrats to show that it belongs to the same political family as the Social Democratic Mutual Aid Labour Party; its short name is still First Islands."
    flag_notes:
      zh: "党旗由红色和深海蓝两色组成，中间以一道波浪线分开，旗面上是一面老式渔船帆。红色取自群岛渔船旧时染成红褐色的帆，那是船工们自己的颜色；深蓝是群岛四周的海，波浪线代表船工靠海吃饭，也代表风浪里同舟共济。党内老人说，帆画得这样朴素，是因为它本来就是渔船上再普通不过的东西，属于每一个出海的人。"
      en: "The flag is red and deep sea blue, parted by a wavy line, with an old fishing-boat sail upon it. The red is that of the red sails the islands' fishing boats once carried, the crews' own colour; the deep blue is the sea around the islands, and the wavy line stands for crews who live by the sea and pull together in rough weather. Old members say the sail is drawn so plainly because nothing on a fishing boat was ever more ordinary, belonging to everyone who went to sea."
    factions:
      - names: { zh: "船坞派", en: "Boatyard Wing" }
        notes: { zh: "以造船厂、港口和码头工会为核心，主张全领地集体工资协议优先，政府订单优先给群岛船坞，对财政让步最不耐烦。代表人群是船坞城镇的熟练工人和工会干部，也是反对改名最坚决的一群人。", en: "Built around the shipyard, port and dock unions, it puts the territory-wide wage agreement first, wants government orders steered to island boatyards and has the least patience for budget concessions. It speaks for skilled workers and union officers in the boatyard towns, and was the firmest opponent of the change of name." }
      - names: { zh: "渡口论坛", en: "Ferry Landing Forum" }
        notes: { zh: "由渔港和外岛的党员组成，最关心居民免费渡轮和每岛一名全科医生能否真正兑现，常在党内催促政府加快外岛航线和巡诊船。它与小岛联邦党关系不错，被看作第一群岛通往小岛的桥。", en: "Made up of members from the fishing harbours and outer islands, it cares most about whether free ferries and a doctor on every island are actually delivered, and presses the government to speed up outer-island routes and clinic boats. It gets on well with the Small Isles Federal Party and is seen as First Islands' bridge to the small islands." }
      - names: { zh: "新港圈", en: "New Harbour Circle" }
        notes: { zh: "以长船等大城市的年轻租客、酒店和服务业员工为主，主张用温泉和海滩收入多建公共住房，支持改名，希望第一群岛在城市议题上说得更明确。老党员有时嫌它离船坞太远。", en: "Mostly young renters and hotel and service workers in Longship and the other big towns, it wants more public housing paid for from hot spring and beach revenue, backed the change of name and wants First Islands to speak more clearly on urban issues. Older members sometimes find it too far from the boatyards." }
    organisation:
      newspaper: { zh: "《帆报》", en: "The Sail" }
      think_tank: { zh: "顺风研究所", en: "Fair Wind Institute" }
