    notes: {"zh": "新岛民党是伊纳拉岛民议会的第三大党，也是氏族传统党的执政伙伴。它代表经营家庭旅馆、潜水店和餐馆的岛民，以及希望群岛更多地与外界联系的年轻专业人士。党首拉娜·安齐经营着雷尼岛上最大的潜水中心，在联合政府中出任司法部长，她说自己的任务是「让习惯法和成文法说同一种语言」。党员约九千，大多是小企业主和旅游业从业者。\n党的口号是「让群岛与世界相连」。它主张扩建伊纳拉机场，开通直飞萨马伊和海外的航班；允许氏族与外资合作建设小型度假村，但氏族必须持有多数股份；每座岛建一所职业学校，培训导游、厨师和潜水教练；铺设连接萨马伊的海底光缆，让全岛都有高速网络。它尊重母系传统，但认为传统和发展并不矛盾，常说「宝贝贝壳也可以放进行李箱，带去看看世界」。\n在联合政府中，新岛民党掌管司法、教育和自然资源，推动了海底光缆和职业学校的建设。它与氏族党的分歧在度假村：氏族党坚持只发展家庭旅馆，新岛民党则认为小型度假村可以让更多的年轻人留在群岛。海洋公地党批评新岛民党会让群岛变成「另一个旅游岛」，新岛民党则回应说，没有收入，就没有钱修海堤。\n新岛民党的组织以行业协会为基础，家庭旅馆业主协会、潜水店主协会和餐馆协会都是党的集体成员，各协会在党的全国委员会中都有席位。党首由全体党员直接选出，候选人须得到所在氏族的同意，这是党与氏族传统之间的一种妥协，党员说「我们也是女儿和儿子」。党的经费来自协会的会费和党员的捐款，章程规定外资企业不得向党捐款，以回应「为外国资本开门」的批评。党与萨马伊和马哈维洛的商界保持联系，曾组织群岛的家庭旅馆业主去那里学习经营和营销。新岛民青年每年举办一次「群岛创业周」，为想留在岛上创业的年轻人提供培训和小额贷款，许多潜水店和咖啡馆就是这样开起来的。\n新岛民党的选民是城市居民和中等收入者，在首府伊纳拉和雷尼岛的旅游海岸最强。每年旅游季开始时，党在雷尼的海滩举办「开放日」，各氏族的家庭旅馆、潜水店和餐馆一起摆摊，游客和岛民可以免费品尝群岛的肉桂糕和烤鱼。党旗以对角线分为橙色和青绿色，中间一艘小船，代表从群岛出发、驶向世界的船。", "en": "The New Islanders' Party is the third party in Inara's Islanders' Assembly and the Clan Tradition Party's partner in government. It speaks for the islanders who run guesthouses, dive shops and eating houses and for young professionals who want the isles more connected to the world. Its leader, Rana Antsy, runs the largest dive centre on Reny and is justice minister in the coalition, where she says her task is 'to make customary law and written law speak the same language'. Its 9,000 or so members are mostly small business owners and people in tourism. \nIts watchword is 'connect the isles to the world'. It wants Inara airport enlarged, with direct flights to Samay and overseas; clans allowed to build small resorts with foreign partners, the clans holding the majority; a vocational school on every island to train guides, cooks and diving instructors; and a submarine cable to Samay bringing fast internet to every island. It respects the matrilineal tradition, but holds that tradition and development need not clash: 'a cowrie can go in a suitcase too, and see the world'. \nIn government the New Islanders hold justice, education and natural resources, and have brought in the submarine cable and the vocational schools. They differ with Clan Tradition over resorts: Clan Tradition holds to guesthouses only, while the New Islanders think small resorts would let more young people stay in the isles. Ocean Commons says they would turn the isles into 'just another tourist island'; they answer that without income there is no money for sea walls. \nThe New Islanders are built on the trade associations: the guesthouse owners', dive-shop owners' and eating-house associations are collective members, each with seats on the national committee. The leader is elected by all members, and candidates need their own clan's consent, a compromise between the party and clan tradition: 'we are daughters and sons too', members say. Money comes from association dues and members' gifts, and its rules bar foreign-owned firms from giving to the party, in answer to the charge that it would 'open the door to foreign capital'. It keeps in touch with business in Samay and Mahavelo and has taken the isles' guesthouse owners there to learn about running and marketing a business. Young New Islanders hold an Isles Start-up Week each year with training and small loans for young people who want to start a business at home, and many dive shops and cafés began that way.\nIts voters are townspeople and the middle paid, and it is strongest in Inara town and along Reny's tourist coast. When the tourist season opens each year the party holds an Open Day on the beach at Reny, where the clans' guesthouses, dive shops and eating houses set up stalls together and visitors and islanders taste the isles' cinnamon cakes and grilled fish for free. Its flag is split diagonally into orange and teal with a small boat in the middle, a boat setting out from the isles towards the world."}
    history: {"zh": "新岛民党由家庭旅馆业主、潜水店主和从海外归来的年轻人组建，最初是一个旅游业协会。协会在岛民议会中推动了机场扩建后改组为政党，此后成为氏族传统党的固定伙伴。", "en": "The New Islanders' Party was formed by guesthouse owners, dive-shop owners and young people home from abroad, beginning as a tourism association. Once the association had won the airport's enlargement in the Assembly it became a party, and has since been Clan Tradition's regular partner."}
    flag_notes: {"zh": "党旗以对角线分为橙色和青绿色，中间一艘小船。橙色是群岛的日落，青绿色是潟湖，小船代表从群岛驶向世界。", "en": "The flag is split diagonally into orange and teal with a small boat in the middle. The orange is the isles' sunset, the teal the lagoon and the boat the voyage from the isles to the world."}
    factions: [{"names": {"zh": "旅游派", "en": "Tourism Wing"}, "notes": {"zh": "家庭旅馆和潜水店的业主，最关心航班、游客数量和度假村政策。", "en": "The owners of guesthouses and dive shops, who care most about flights, visitor numbers and the resort policy."}}, {"names": {"zh": "网络派", "en": "Connected Wing"}, "notes": {"zh": "年轻专业人士和远程工作者，关心海底光缆、职业学校和让年轻人留在群岛。", "en": "Young professionals and remote workers, concerned with the cable, the vocational schools and keeping the young in the isles."}}]
