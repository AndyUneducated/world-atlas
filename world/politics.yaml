    ideology: [{"zh": "基督教保守主义", "en": "Christian conservatism"}, {"zh": "福音派政治", "en": "Evangelical politics"}, {"zh": "家庭主义", "en": "Familialism"}, {"zh": "反共主义", "en": "Anti-communism"}]
    axes: {"econ": 6.0, "galtan": 9.0, "autonomy": 6.5, "green": 6.5}
