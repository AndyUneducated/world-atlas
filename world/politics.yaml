    notes: {"zh": "海洋公地党是伊纳拉岛民议会的第二大党和最大的反对党，主张把潟湖、珊瑚礁和渔场作为全体岛民的公地来保护，并让年轻人和男子在氏族议事中拥有更多发言权。党首诺罗·瓦希纳是一位潜水教练和珊瑚礁修复志愿者，她领导的志愿者团队在雷尼岛外种下了几万株珊瑚。党员约一万一千，多是年轻人、渔民和回到群岛的大学毕业生。\n党的口号是「海洋属于所有人」。它主张潟湖和珊瑚礁划为全民公地，禁止外国渔船进入；年轻人和男子在氏族议事中有表决权；全部电力来自太阳能和潮汐能；为海平面上升修建海堤，迁移低洼的村落。它并不反对母系传统，但认为传统需要随时代改变，常说「我们的祖母也是从海上划船来的，她们也曾是新来的人」。\n公地党在议会里是反对派，在珊瑚礁保护和渔业上常与氏族传统党合作，两党一起通过了禁止外国渔船进入潟湖的法案。它与新岛民党在旅游业上针锋相对，反对任何外资度假村。氏族党批评公地党的氏族改革会动摇群岛的根基，公地党则回应说，如果年轻人在氏族里没有声音，他们就会离开群岛。\n公地党没有党首，而是由每年抽签产生的一个七人协调小组领导，瓦希纳是现任的召集人。所有重要决定都在每月大潮日的海滩会议上表决，任何党员都可以发言，会议的记录在网上公开。党的候选人名单通过党员投票产生，章程规定名单中男女交替排列，且每三位候选人中至少有一位不满三十岁。党的经费来自党员的会费、潜水店和渔民合作社的小额捐款，它不接受任何外资企业的捐款，议员须把一半的薪水捐给珊瑚礁修复基金。青年潮汐在每所中学都有社团，组织学生观察海龟产卵、记录潟湖的水温，这些数据后来被群岛邦的渔业部门采用。党与全岛和海外的海洋保护组织联系密切。\n公地党的选民是年轻人，在首府伊纳拉和雷尼岛的年轻家庭中最强。每月的大潮日，党员和志愿者在雷尼岛外的珊瑚礁上种植珊瑚，然后在海滩上开会，任何人都可以发言。党旗上半是深蓝色，下半是浅蓝色的波浪，中间一只海龟，海龟每年回到群岛的海滩产卵，党员说，这就是「回家」的意思。", "en": "The Ocean Commons Party is the second party in Inara's Islanders' Assembly and the largest in opposition. It wants the lagoons, reefs and fishing grounds protected as a commons of all islanders, and the young and men given more voice in clan meetings. Its leader, Noro Vahina, is a diving instructor and reef-restoration volunteer whose team has planted tens of thousands of corals off Reny. Its 11,000 or so members are mostly young people, fishers and graduates who have come home to the isles. \nIts watchword is 'the ocean belongs to everyone'. It wants the lagoons and reefs made a commons of all islanders, closed to foreign boats; a vote in clan meetings for the young and for men; all power from the sun and the tides; and sea walls against the rising sea, with low-lying villages moved. It does not oppose the matrilineal tradition, but holds that tradition must change with the times: 'Our grandmothers paddled here across the sea too; they were newcomers once.' \nIn the Assembly Ocean Commons sits in opposition, but often works with Clan Tradition on the reefs and fisheries, and the two passed the law closing the lagoons to foreign boats. It clashes with the New Islanders over tourism, opposing any foreign-owned resort. Clan Tradition says its clan reforms would shake the isles' foundations; Ocean Commons answers that if the young have no voice in the clans, they will leave the isles. \nOcean Commons has no leader; it is led by a coordinating group of seven chosen each year by lot, of which Vahina is the present convener. Every important decision is voted on at the beach meeting held each month at spring tide, where any member may speak, and the minutes are published online. Candidate lists are chosen by members' vote; its rules alternate women and men, with at least one of every three candidates under thirty. Money comes from dues and small gifts from dive shops and fishers' cooperatives; it takes nothing from foreign-owned firms, and its members of the Assembly give half their pay to a reef-restoration fund. Young Tides has a club in every secondary school, where pupils watch turtles nesting and log the lagoon's temperature, readings later taken up by the Commonwealth's fisheries service. The party is close to marine conservation groups on the island and abroad.\nIts voters are the young, and it is strongest among the young families of Inara town and Reny. At every spring tide its members and volunteers plant coral on the reef off Reny and then meet on the beach, where anyone may speak. Its flag is deep blue over pale blue waves with a turtle in the middle; turtles come back to the isles' beaches every year to lay their eggs, which members say is what 'coming home' means."}
    history: {"zh": "海洋公地党由珊瑚礁修复志愿者、年轻渔民和从海外留学归来的学生组建。一次反对外国拖网渔船进入潟湖的抗议后，组织者决定组党参选，几年后成为岛民议会的第二大党。", "en": "The Ocean Commons Party was formed by reef-restoration volunteers, young fishers and students home from study abroad. After a protest against foreign trawlers in the lagoon its organisers decided to stand for election, and within a few years it was the second party in the Islanders' Assembly."}
    flag_notes: {"zh": "党旗上半是深蓝色，下半是浅蓝色的波浪，中间一只海龟。深蓝是外海，浅蓝是潟湖，海龟代表回家。", "en": "The flag is deep blue over pale blue waves with a turtle in the middle. The deep blue is the open sea, the pale blue the lagoon, and the turtle coming home."}
    factions: [{"names": {"zh": "珊瑚派", "en": "Reef Wing"}, "notes": {"zh": "潜水员和珊瑚礁修复志愿者，最关心潟湖、珊瑚礁和海平面上升。", "en": "Divers and reef-restoration volunteers, who care most about the lagoons, the reefs and the rising sea."}}, {"names": {"zh": "改革派", "en": "Reform Wing"}, "notes": {"zh": "年轻人和男子党员，最关心氏族议事中的表决权和年轻人的就业。", "en": "Young people and men in the party, who care most about votes in clan meetings and jobs for the young."}}]
    organisation: {"newspaper": {"zh": "《大潮》", "en": "Spring Tide"}, "think_tank": {"zh": "群岛海洋研究中心", "en": "Isles Ocean Research Centre"}, "unions": {"zh": "青年渔民合作社", "en": "Young Fishers' Cooperative"}}
