    spectrum: 1.0
    family: {"zh": "古典自由主义", "en": "Classical liberal"}
    ideology: [{"zh": "古典自由主义", "en": "Classical liberalism"}, {"zh": "自由市场", "en": "Free market"}, {"zh": "世俗主义", "en": "Secularism"}, {"zh": "低税率", "en": "Low taxation"}]
    axes: {"econ": 8.5, "galtan": 3.0, "autonomy": 6.0, "green": 4.0}
    leader: {"zh": "莉娅·拉贝米", "en": "Lia Rabemy"}
    members: 38000
    youth_wing: {"zh": "青年自由论坛", "en": "Young Liberal Forum"}
    slogan: {"zh": "开放的海湾，自由的人", "en": "An open bay, a free people"}
    policies: [{"zh": "企业所得税保持在全岛最低水平，个人所得税实行单一税率", "en": "Keep company tax among the lowest on the island and a flat rate of income tax"}, {"zh": "出口加工区扩大一倍，外资企业五年免税", "en": "Double the export processing zone, with five years free of tax for foreign firms"}, {"zh": "政府只做裁判，港口、电力和电信交给私营公司经营", "en": "Let the state be referee, and leave the port, power and telecoms to private firms"}, {"zh": "与安博维卡特尔的冲突交给专业警察和海岸警卫队处理，不扩军", "en": "Leave the Ambovy cartels to professional police and the coast guard, without a larger army"}]
    allies: ["pty_2x7jg1"]
    targets: {"div_4f0pgt": 44}
    lean: {"income": 1.5, "finance": 0.8, "urban": 0.5, "old": 0.3}
    notes: {"zh": "自由党是贝洛瓦共和国的执政党和国会第一大党，主张自由市场、低税率和政府少干预，被认为是全岛最「经典」的资本主义政党。现任总统莉娅·拉贝米是党的领袖，她曾在首都的投资银行工作多年，后来出任财政部长，在总统选举的第二轮中击败了公民联盟的候选人。党员约三万八千，人数不多，但几乎每一家大银行、船运公司和软件公司的高层都是它的捐款人。\n党的口号是「开放的海湾，自由的人」。它主张企业所得税保持在全岛最低水平，个人所得税实行单一税率；出口加工区扩大一倍，外资企业前五年免税；政府只做裁判，港口、电力和电信交给私营公司经营。在安全问题上，自由党反对扩军，主张把与安博维卡特尔的冲突交给专业警察和海岸警卫队，把钱花在情报和无人机上。它支持世俗协约，但更看重与海外市场的贸易，常说「我们的盟友是每一个付钱的客户」。\n在国会，自由党与新贝洛瓦党组成多数，两党在减税和放松管制上一致，在移民和难民问题上分歧明显：新贝洛瓦党要求收紧难民营管理，自由党则认为难民是码头和工厂需要的劳动力，主张发放工作许可。公民联盟批评自由党的政策扩大了贫富差距，港口外的难民营和首都的玻璃高楼只隔着一条公路。拉贝米总统的回答是：「财富要先被创造出来，才能被分配。」\n自由党的组织像一家公司：全国委员会由党首、财务主管和各选区的负责人组成，日常事务由一个专业的竞选团队负责，团队里有民调专家、数据分析师和广告顾问。党的候选人通过党内初选产生，初选向所有登记的支持者开放，费用由候选人自己承担，这让富有的候选人更容易胜出，也常被批评。党的经费是全岛各政党中最充裕的，捐款名单按法律公开，银行和船运公司排在前列。青年自由论坛每年举办创业比赛，获胜者可以得到党的金主们提供的种子资金。\n自由党的选民是高收入者、金融业和科技业的从业者，以及首都海湾沿岸的新住宅区居民。党的总部设在金融区一座玻璃大楼的顶层，每年在海湾节期间举办「开放论坛」，邀请全岛和海外的企业家、经济学家来演讲，晚上在游艇上举行酒会。批评者说这是一个属于富人的政党，支持者说，正是它让贝洛瓦从一座战乱中的港口变成了全岛的金融中心。", "en": "The Liberal Party governs the Republic of Belova and is the largest party in Congress. It stands for free markets, low taxes and a light-handed state, and is often called the most classically capitalist party on the island. Its leader is the President, Lia Rabemy, who worked for many years at an investment bank in the capital before becoming finance minister, and who beat the Civic Alliance's candidate in the second round of the presidential election. It has only some 38,000 members, but the heads of almost every large bank, shipping line and software company give it money. \nIts watchword is 'an open bay, a free people'. It wants company tax kept among the lowest on the island and a flat rate of income tax; the export processing zone doubled, with foreign firms free of tax for their first five years; and the state as referee, leaving the port, power and telecoms to private firms. On security it opposes a larger army, preferring to leave the Ambovy cartels to professional police and the coast guard and to spend the money on intelligence and drones. It supports the Secular Accord, but sets more store by trade with markets overseas, and likes to say 'our allies are everyone who pays'. \nIn Congress the Liberals hold a majority with the New Belova Party. The two agree on tax cuts and deregulation but differ sharply on migration and refugees: New Belova wants the camps run more tightly, while the Liberals see the refugees as labour the docks and factories need and want them given work permits. The Civic Alliance says Liberal policies have widened the gap between rich and poor, the camp outside the port and the glass towers of the capital being separated only by a highway. President Rabemy's answer is that 'wealth must be created before it can be shared'. \nThe Liberal Party is organised like a company: a national committee of the leader, the treasurer and the heads of the constituencies, with day-to-day work done by a professional campaign team of pollsters, data analysts and advertising consultants. Candidates are chosen in party primaries open to every registered supporter, at their own expense, which favours wealthy candidates and draws frequent criticism. Its funds are the largest of any party on the island, and its donor list, published as the law requires, is headed by banks and shipping lines. The Young Liberal Forum holds a start-up contest each year whose winners receive seed money from the party's backers.\nIts voters are higher earners, people in finance and technology and the residents of the new districts along the capital's bay. Its headquarters is the top floor of a glass tower in the financial district, and during the Bay Festival each year it holds an Open Forum, inviting entrepreneurs and economists from the island and abroad to speak, with a reception on a yacht in the evening. Critics call it a party of the rich; its supporters say it is what turned Belova from a port in a war zone into the island's financial centre."}
    history: {"zh": "自由党由大分裂时组建临时政府的商人、银行家和技术官僚创立。共和国成立后，它起草了以低税率和自由贸易为核心的经济宪章，此后与公民联盟轮流执政。", "en": "The Liberal Party was founded by the merchants, bankers and technocrats who formed the provisional government in the Sundering. Once the republic was founded it drafted the economic charter of low taxes and free trade, and it has since taken turns in office with the Civic Alliance."}
    flag_notes: {"zh": "党旗是金黄色的旗面，从旗杆一侧伸出一个深蓝色的楔形，楔形中是一把金色的钥匙。钥匙代表「打开市场的大门」，金色是财富，深蓝是海湾。", "en": "The flag is golden yellow, with a navy wedge running in from the hoist bearing a gold key. The key 'opens the door to the market'; the gold is wealth and the navy the bay."}
    factions: [{"names": {"zh": "金融派", "en": "Finance Wing"}, "notes": {"zh": "银行家和基金经理，主张资本自由流动、保护银行保密制度，是党的主要金主。", "en": "Bankers and fund managers, who want capital to move freely and banking secrecy protected; the party's main backers."}}, {"names": {"zh": "自由意志派", "en": "Libertarian Wing"}, "notes": {"zh": "年轻的软件工程师和创业者，主张大麻合法化、取消审查和削减政府规模，在社会议题上比领导层更激进。", "en": "Young software engineers and founders, who want cannabis legalised, censorship ended and the state cut back, and are bolder on social questions than the leadership."}}]
    organisation: {"newspaper": {"zh": "《海湾财经》", "en": "Bay Finance"}, "think_tank": {"zh": "开放社会与市场研究所", "en": "Institute for Open Society and Markets"}, "women": {"zh": "女企业家网络", "en": "Women Entrepreneurs' Network"}}
  - id: "pty_2x7jg1"
    names: {"zh": "新贝洛瓦党", "en": "New Belova Party"}
    short_names: {"zh": "新贝洛瓦", "en": "New Belova"}
    color: "#1A2A5A"
    flag: {"layout": "bands", "colors": ["#1A2A5A", "#E87722", "#1A2A5A"], "charge": "tower", "charge_band": 1, "charge_color": "#1A2A5A"}
    spectrum: 1.8
    family: {"zh": "保守自由主义", "en": "Conservative liberal"}
    ideology: [{"zh": "保守自由主义", "en": "Conservative liberalism"}, {"zh": "法律与秩序", "en": "Law and order"}, {"zh": "限制移民", "en": "Immigration restriction"}]
    axes: {"econ": 7.5, "galtan": 6.5, "autonomy": 6.0, "green": 3.5}
    leader: {"zh": "安德里·拉索阿", "en": "Andry Rasoa"}
    members: 22000
    youth_wing: {"zh": "新贝洛瓦青年", "en": "New Belova Youth"}
    slogan: {"zh": "安全的城市，繁荣的共和国", "en": "A safe city, a prosperous republic"}
    policies: [{"zh": "难民营实行登记和工作许可制度，无证者限期离境", "en": "Register the refugee camps and issue work permits, with those without papers given a date to leave"}, {"zh": "增加警察人数，加重对走私和贩毒的刑罚", "en": "Hire more police and toughen sentences for smuggling and drug trafficking"}, {"zh": "与梅纳瓦利军政府的边界修建监控围栏", "en": "Build a monitored fence along the border with the Menavaly junta"}, {"zh": "降低中小企业税负，简化开业手续", "en": "Lower taxes on small firms and simplify the paperwork for opening one"}]
    allies: ["pty_4mfc5r"]
    targets: {"div_4f0pgt": 11}
    lean: {"old": 1.5, "income": 0.5, "urban": -0.3}
    notes: {"zh": "新贝洛瓦党是贝洛瓦国会的第三大党，也是自由党的执政伙伴。它在经济上主张自由市场，在社会问题上偏向保守，最关心的是治安和移民。党首安德里·拉索阿当过首都的警察局长，以打击走私团伙出名，他常说：「没有安全，就没有市场。」党员约二万二千，多是中小企业主、店主、退休警察和内陆城市安博塔的居民。\n党的主张包括：港口外的难民营实行登记和工作许可制度，无证者限期离境；增加警察人数，加重对走私和贩毒的刑罚；在与梅纳瓦利军政府的边界上修建监控围栏；降低中小企业税负，简化开业手续。它支持自由党的减税和私有化政策，但认为自由党太迁就大银行和外资，忽视了街头小店和内陆种植园主的利益。\n与自由党组成国会多数以来，新贝洛瓦党的议员主持国会的内政与司法委员会，推动了难民营的登记制度和一项新的反走私法。两党的分歧在难民问题上最为明显：自由党希望发放更多工作许可，新贝洛瓦党则希望控制人数。公民联盟和港口绿党批评它把难民当作替罪羊，人权组织也对边境围栏提出过质疑。党内有人主张与其他保守团体联合，组建一个更大的右翼政党。\n新贝洛瓦党的组织以街区为基础，每个街区都有一个「街区之友」小组，小组的成员多是店主和退休警察，负责组织夜间巡逻、收集居民对治安的意见。党首由全国大会选出，候选人须有至少五年在警察、消防或小企业工作的经历，党员说这样可以保证「我们的议员懂得街头的事」。党的经费来自中小企业主的捐款和党员的会费，大银行很少给它捐钱。党与海外的保守政党保持联系，曾邀请外国的治安专家来贝洛瓦介绍社区警务的经验。新贝洛瓦青年每年组织一次城市清洁日，在首都的老城区清理涂鸦和垃圾，党首也会拿起刷子一起干活。\n新贝洛瓦党的选民年龄偏大，集中在内陆的安博塔和首都的老城区，金融区的年轻人很少投它的票。每年共和国国庆日，党在安博塔的中央广场举行「秩序与繁荣」集会，警察乐队演奏进行曲，党首向退休警察和消防员颁发纪念章。党旗是深蓝和橙色的横条，中间一座塔楼，象征守卫城市的灯塔和城墙。", "en": "The New Belova Party is the third party in Belova's Congress and the Liberals' partner in government. It is free-market on the economy and conservative on social questions, and cares most about crime and migration. Its leader, Andry Rasoa, was the capital's police chief and made his name breaking smuggling gangs; he likes to say that 'without security there is no market'. Its 22,000 or so members are mostly owners of small businesses, shopkeepers, retired police officers and people of the inland city of Ambota. \nIt wants the refugee camp outside the port registered and work permits issued, with those without papers given a date to leave; more police and tougher sentences for smuggling and drug trafficking; a monitored fence along the border with the Menavaly junta; and lower taxes and simpler paperwork for small firms. It backs the Liberals' tax cuts and privatisations but thinks they bend too far to the big banks and foreign capital and forget the corner shop and the inland planter. \nSince forming a majority with the Liberals in Congress, New Belova's members have chaired its committee on the interior and justice, bringing in the registration of the camps and a new anti-smuggling law. The partners differ most on refugees: the Liberals want more work permits, New Belova wants fewer people. The Civic Alliance and the Harbour Greens say it makes scapegoats of the refugees, and human rights groups have questioned the border fence. Some in the party want to merge with other conservative groups into a larger party of the right. \nNew Belova is organised by neighbourhood, each with a 'Friends of the Street' group, mostly shopkeepers and retired police officers, who organise night patrols and gather residents' views on crime. The national congress elects the leader, and candidates need at least five years' work in the police, the fire service or a small business, which members say ensures 'our members know the street'. Money comes from small business owners and members' dues; the big banks rarely give to it. It keeps in touch with conservative parties abroad and has invited foreign experts to Belova to talk about community policing. New Belova Youth holds a city clean-up day each year, scrubbing graffiti and clearing litter in the capital's old town, and the leader picks up a brush too.\nIts voters are older and gathered in inland Ambota and the old districts of the capital; the young of the financial district rarely vote for it. On Republic Day each year it holds an 'Order and Prosperity' rally in Ambota's central square, where a police band plays marches and the leader presents medals to retired police officers and firefighters. Its flag is bands of navy and orange with a tower in the middle, the lighthouse and walls that guard the city."}
    history: {"zh": "新贝洛瓦党由首都的店主协会和退休警察协会联合组建，最初是一个要求加强治安的市民运动。运动在几次市议会选举中取得成功后改组为全国性政党，并成为自由党的固定伙伴。", "en": "The New Belova Party was formed by the capital's shopkeepers' association and retired police officers' association, beginning as a citizens' movement for safer streets. After it did well in several city elections it became a national party and the Liberals' regular partner."}
    flag_notes: {"zh": "党旗是深蓝、橙、深蓝三道横条，中间的橙条上有一座深蓝色的塔楼。塔楼代表守卫城市的灯塔和城墙，橙色取自国旗。", "en": "The flag is three bands of navy, orange and navy, with a navy tower on the orange. The tower is the lighthouse and walls that guard the city; the orange comes from the national flag."}
    factions: [{"names": {"zh": "治安派", "en": "Order Wing"}, "notes": {"zh": "退休警察和安博塔的地方领袖，最关心治安、边境和难民营管理。", "en": "Retired police officers and local leaders in Ambota, who care most about crime, the border and the camps."}}, {"names": {"zh": "小企业派", "en": "Small Business Wing"}, "notes": {"zh": "店主和小企业主，关心税负和营业许可，对大银行和外资心存不满。", "en": "Shopkeepers and small business owners, concerned with taxes and licences and resentful of the big banks and foreign capital."}}]
    organisation: {"newspaper": {"zh": "《共和国晨报》", "en": "Republic Morning Post"}, "think_tank": {"zh": "公共安全研究中心", "en": "Centre for Public Safety"}, "women": {"zh": "新贝洛瓦妇女会", "en": "New Belova Women's League"}}
  - id: "pty_sba4y2"
    names: {"zh": "公民联盟", "en": "Civic Alliance"}
    short_names: {"zh": "公民联盟", "en": "Civic Alliance"}
    color: "#6A3D9A"
    flag: {"layout": "bands", "colors": ["#6A3D9A", "#FFFFFF", "#6A3D9A"], "charge": "links", "charge_band": 1, "charge_color": "#6A3D9A"}
    spectrum: -0.6
    family: {"zh": "社会自由主义", "en": "Social liberal"}
    ideology: [{"zh": "社会自由主义", "en": "Social liberalism"}, {"zh": "社会市场经济", "en": "Social market economy"}, {"zh": "人权", "en": "Human rights"}]
    axes: {"econ": 4.5, "galtan": 2.5, "autonomy": 5.5, "green": 6.5}
    leader: {"zh": "托基·拉马纳纳", "en": "Toky Ramanana"}
    members: 45000
    youth_wing: {"zh": "公民青年", "en": "Young Citizens"}
    slogan: {"zh": "繁荣属于每一个人", "en": "Prosperity for everyone"}
    policies: [{"zh": "最低工资提高三成，码头和加工区工人享有医疗保险", "en": "Raise the minimum wage by a third and give dockers and zone workers health insurance"}, {"zh": "难民营居民可以申请永久居留，孩子免费上学", "en": "Let camp residents apply to stay for good, their children schooled for free"}, {"zh": "对超过一定规模的房产和金融交易征税，用于公共住房", "en": "Tax large properties and financial transactions to pay for public housing"}, {"zh": "保留港口为国有，由独立委员会经营", "en": "Keep the port in public hands, run by an independent board"}]
    allies: ["pty_trd3n4"]
    targets: {"div_4f0pgt": 34}
    lean: {"young": 1.5, "income": -0.8, "urban": 0.5}
    notes: {"zh": "公民联盟是贝洛瓦国会的第二大党和最大的反对党，由几个社会自由派、工会和人权团体联合组成，主张在市场经济之上建立更公平的社会。党首托基·拉马纳纳是一位人权律师，长期为难民营的居民和码头工人提供免费法律援助，在上一次总统选举中进入第二轮，输给了自由党的拉贝米。党员约四万五千，比自由党还多。\n党的主张包括：最低工资提高三成，码头和出口加工区的工人享有医疗保险；难民营居民可以申请永久居留，孩子免费上学；对超过一定规模的房产和金融交易征税，用于建设公共住房；港口保留为国有，由独立委员会经营。它并不反对市场，党首常说：「我们要的不是更少的银行，而是更多的学校。」在外交上，它支持世俗协约，也主张与萨希利亚之外的西海岸各国保持对话。\n公民联盟上一次执政时，推动了共和国的第一部劳动法和难民儿童入学计划，也因财政赤字扩大而在选举中失利。在野期间，它在国会里集中火力批评政府的私有化计划和难民营登记制度，与港口绿党一起投票反对边境围栏。自由党批评公民联盟的加税计划会把银行赶走，公民联盟则回应说，银行离不开贝洛瓦的法治和港口。\n公民联盟是一个联合政党，由社会自由派、码头工会和几家人权组织作为集体成员加入，每个成员组织在联盟的全国理事会中都有席位。党首由全体党员和集体成员的代表共同选出，候选人名单须经各成员组织协商，常常要谈上好几个星期。联盟的经费来自党费、工会的政治基金和众筹，它拒绝接受银行的捐款，这在一个以金融为生的国家里显得与众不同。联盟在首都的工人区开设了几家「公民之家」，提供免费的法律咨询、托儿和成人教育，许多新党员就是在这里认识联盟的。公民青年在大学里组织读书会和难民营的支教活动。\n公民联盟的选民是年轻人、低收入者、码头工人和大学生，在首都的工人区和大学城最强。每年五月，联盟在码头旁的旧仓库举办「公民节」，有音乐会、二手书市和法律咨询摊位，难民营的居民也会来卖手工艺品和家乡小吃。党旗是紫色和白色的横条，中间一组相扣的链环，象征不同背景的公民连在一起。", "en": "The Civic Alliance is the second party in Belova's Congress and the largest in opposition, a union of social liberals, trade unions and human rights groups that wants a fairer society on top of the market economy. Its leader, Toky Ramanana, is a human rights lawyer who has long given free legal help to the people of the refugee camp and the dockers; in the last presidential election he reached the second round and lost to the Liberals' Rabemy. With some 45,000 members it has more than the Liberals. \nIt wants the minimum wage raised by a third and health insurance for the workers of the docks and the export processing zone; camp residents allowed to apply to stay for good, their children schooled for free; a tax on large properties and financial transactions to build public housing; and the port kept in public hands, run by an independent board. It is not against the market: as its leader says, 'we don't want fewer banks, we want more schools'. Abroad it supports the Secular Accord and wants talks kept open with the west-coast states beyond Sahiliya. \nThe last time it governed, the Civic Alliance brought in the republic's first labour law and a plan to school refugee children, and lost the following election when the deficit grew. In opposition it has trained its fire on the government's privatisations and the registration of the camps, and voted with the Harbour Greens against the border fence. The Liberals say its tax plans would drive the banks away; the Alliance answers that the banks cannot do without Belova's rule of law and its port. \nThe Civic Alliance is a federation whose collective members, the social liberals, the dockers' union and several human rights groups, each hold seats on its national board. The leader is elected by members together with delegates of the collective members, and candidate lists are negotiated among the member groups, often for weeks. Money comes from dues, union political funds and crowdfunding; it refuses gifts from banks, which sets it apart in a country that lives by finance. It runs several Citizens' Houses in the capital's workers' districts offering free legal advice, childcare and adult education, where many new members first meet the Alliance. Young Citizens run reading groups at the university and volunteer teaching in the refugee camp.\nIts voters are the young, the lower paid, dockers and students, and it is strongest in the capital's workers' districts and the university quarter. Every May it holds a Citizens' Festival in an old warehouse by the docks, with concerts, a second-hand book market and stalls giving legal advice, and people from the camp come to sell crafts and the food of home. Its flag is bands of purple and white with interlocking links in the middle, citizens of every background joined together."}
    history: {"zh": "公民联盟由社会自由派知识分子、码头工会和几家人权组织在一次反对港口私有化的大游行后联合组建。它在随后的选举中首次赢得总统职位，此后与自由党轮流执政。", "en": "The Civic Alliance was formed by social-liberal intellectuals, the dockers' union and several human rights groups after a great march against the sale of the port. It won the presidency at the following election and has since taken turns in office with the Liberals."}
    flag_notes: {"zh": "党旗是紫、白、紫三道横条，白条中间是一组紫色的链环。紫色是联盟各成员组织的颜色混合而成，链环代表团结。", "en": "The flag is three bands of purple, white and purple, with purple links on the white. The purple mixes the colours of the Alliance's member groups; the links are solidarity."}
    factions: [{"names": {"zh": "工会派", "en": "Union Wing"}, "notes": {"zh": "码头和出口加工区的工会，最关心工资、医疗保险和港口不被私有化。", "en": "The unions of the docks and the export zone, who care most about wages, health insurance and keeping the port public."}}, {"names": {"zh": "人权派", "en": "Rights Wing"}, "notes": {"zh": "律师、记者和难民援助组织，最关心难民权利、新闻自由和警察问责。", "en": "Lawyers, journalists and refugee aid groups, who care most about refugees' rights, press freedom and holding the police to account."}}]
    organisation: {"newspaper": {"zh": "《公民报》", "en": "The Citizen"}, "unions": {"zh": "贝洛瓦码头与加工区工会", "en": "Belova Dock and Zone Workers' Union"}, "women": {"zh": "公民妇女联合会", "en": "Civic Women's Union"}}
  - id: "pty_trd3n4"
    names: {"zh": "港口绿党", "en": "Harbour Greens"}
