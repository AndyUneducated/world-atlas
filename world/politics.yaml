    ideology: [{"zh": "伊斯兰民主", "en": "Islamic democracy"}, {"zh": "社会保守主义", "en": "Social conservatism"}, {"zh": "福利国家", "en": "Welfare state"}]
    axes: {"econ": 5.0, "galtan": 7.0, "autonomy": 5.5, "green": 5.5}
