    lean: { herding: 0.8, agriculture: 0.5, forestry: 0.4, urban: -0.7 }
    notes:
      zh: "高地牧场联盟代表北维京岛内陆山区的牧民和小农，主张由领地负担牧区道路的冬季除雪、把驯鹿和牛羊的传统放牧路线写入土地法、风电场选址须征得附近牧场同意、山区学校保留寄宿部。它是乡村保守派，在社会议题上偏传统，在经济上偏右，在领地自治问题上强烈倾向地方。它的内在张力也一目了然：一个不信任领地政府、主张「山里的事山里定」的党，核心诉求却是要领地出钱除雪、办学。党内的说法是「我们不要政府管我们，只要政府别忘了我们」。另一重张力在于能源：内陆山区是建风电场的好地方，风电场能带来租金和道路，也会切断放牧路线、改变山地的样子，党内对此始终没有统一的答案。\n在领地议会选举中，联盟拿到百分之二的选票，离百分之五的门槛很远。它在雅利基卢克市议会二十三席中有两席，却坐在反对席上：雅利基卢克由社会民主互助工党、全领地联邦联盟和渔农党联合执政，友党渔农党在里面，联盟却在外面，这让两党的关系既亲近又微妙。友党长屋党在市里也是反对派，两党常在乡村学校和老路的问题上联手。联盟的影响力主要在议会之外：它的党员在领地议会的听证会上作证，在冬季暴雪后组织拖拉机车队清路，还给每一条传统放牧路线画了地图，交给土地部门备案。它与绿脉党在风电场选址上常有争执，在保护山地草场上又常常站在一起，两党的人说这叫「吵着架一起赶羊」。它与星途党在西荒高原发射场扩建上也有分歧，牧民担心新发射台和新修的道路会切断转场路线。\n它的选民在内陆山区的乡村、牧区、种植业和林业地区，城市里几乎没有。在雅利基卢克和周边的山谷里，它的票主要来自地势高的村子，越往山下、越靠近公路和城镇，票就越少，党员开玩笑说联盟的支持率可以用海拔来量。年轻人外流是它的隐忧：山区学校的寄宿部一旦关掉，一个家庭往往就会搬下山，所以联盟把保留寄宿部看得和除雪一样重。口号「山上也有人」来自一位牧民在议会听证会上的发言，当时议员们在讨论把一条山区公路降为季节性道路。党旗上方是浅蓝的天空，下方是褐色的山地，交界处是起伏的山峰，中间一对驯鹿角。\n联盟的党员证是一枚小铜铃，和挂在牛羊脖子上的铃一样；党代会开幕时，代表们一起摇铃，铃声停下才开始讲话。每年夏天，党代会在一片高山牧场上召开，代表们要赶着自家的牲口上山，会议时间按转场的日子来定。党首托尔莫·格拉斯豪说，只要一个牧民能在暴雪之后照常下山送孩子上学，联盟就算办成了一件事。"
      en: "The Upland Pasture Union speaks for the herders and smallholders of North Viking Island's mountainous interior. It wants the territory to pay for winter snow clearing on pasture roads, the traditional droving routes of reindeer, cattle and sheep written into land law, wind farms sited only with the consent of nearby pastures, and boarding kept at mountain schools. It is a rural conservative party, traditional on social questions, right of centre on economics and strongly in favour of local control. Its inner tension is plain to see: a party that distrusts the territorial government and wants the hills to decide for the hills makes its central demand that the territory pay for snow clearing and schools. As members put it, we do not want the government to run us, only not to forget us. A second tension lies in energy: the mountains are good places for wind farms, which bring rents and roads but can cut droving routes and change the face of the hills, and the party has never settled on one answer.\nAt the territorial election the Union won two per cent, far below the five-per-cent threshold. It holds two of Jaalikiluk's 23 council seats but sits in opposition: the city is governed by the Social Democratic Mutual Aid Labour Party, the All-Territories Federal Union and the Fishers and Farmers Party, so its ally is inside the coalition while the Union is outside, which makes the relationship close but delicate. Its other ally, the Longhouse Party, is also in opposition in the city, and the two often join forces over village schools and old roads. The Union's influence lies mostly outside the chambers: its members give evidence at hearings of the territorial parliament, organise tractor convoys to clear roads after winter blizzards, and have mapped every traditional droving route and lodged the maps with the land authorities. It often quarrels with Greenvein over where wind farms go, yet the two stand together on protecting mountain grassland, which their members call herding sheep while arguing. It also differs with the Starward Party over enlarging the West Heath spaceport, as herders fear that a new launch pad and its new roads would cut the droving routes.\nIts voters are in the villages, pastures, farming and forestry districts of the mountainous interior, and it has almost none in the cities. In and around Jaalikiluk its votes come mainly from the higher villages and thin out the further one goes downhill towards the roads and towns, so members joke that the Union's support can be measured by altitude. Young people leaving is its quiet worry: once a mountain school closes its boarding house, a family will often move down the valley, which is why the Union treats keeping boarding as seriously as clearing snow. Its slogan, people live up here too, comes from a herder's words at a parliamentary hearing on downgrading a mountain road to a seasonal one. The flag shows a pale blue sky over brown uplands, with a line of peaks where they meet and a pair of reindeer antlers in the centre.\nA member's card is a small brass bell, like the ones hung on cattle and sheep; at the opening of each congress the delegates ring their bells together, and speeches begin only when the ringing stops. Every summer the congress meets on a high pasture, with delegates driving their own animals up the mountain, and its dates are set by the seasonal move of the herds. Party leader Tormod Grashaug says that as long as a herder can come down after a blizzard and take the children to school as usual, the Union has done its job."
    history:
      zh: "高地牧场联盟由内陆的牧民协会组建，起因是一次冬季暴雪中几条山路因预算不足没有及时除雪，牧场被困了两周。暴雪过后，牧民们发现自己的声音在领地议会里几乎听不到，于是把几个协会合成一个政党。此后它与渔农党结为友党，在雅利基卢克等内陆城市的市议会里赢得了席位。"
      en: "The Union was formed by the inland herders' associations after a winter blizzard in which several mountain roads went uncleared for want of money and the pastures were cut off for a fortnight. After the snow, the herders found that their voice could hardly be heard in the territorial parliament, and merged their associations into a party. It later became an ally of the Fishers and Farmers Party and won seats on the councils of inland cities such as Jaalikiluk."
    flag_notes:
      zh: "党旗以天空与地平线构图：上方是浅蓝的天空，下方是褐色的山地，交界处是一排起伏的山峰，中间是一对驯鹿角。浅蓝是高原冬天晴朗的天，褐色是夏季牧场的泥土和枯草，山峰代表内陆的山脉。驯鹿角象征传统的放牧和转场，党员说，鹿角每年脱落又重新长出，就像山里人一年年守着牧场。"
      en: "The flag is built as sky and horizon: pale blue sky above brown uplands, with a line of peaks where they meet and a pair of reindeer antlers in the centre. The pale blue is the clear winter sky of the uplands, the brown the soil and dry grass of the summer pastures, and the peaks the mountains of the interior. The antlers stand for traditional herding and the seasonal drove; members say that antlers are shed and grow back every year, just as hill people hold on to their pastures year after year."
    factions:
      - names: { zh: "转场派", en: "Droving Road Group" }
        notes: { zh: "以驯鹿和牛羊牧民为主，首先看重把传统放牧路线写入土地法，坚决反对未经牧场同意的风电场，主张联盟保持独立。", en: "Mainly reindeer, cattle and sheep herders, it puts writing the traditional droving routes into land law first, firmly opposes wind farms without the pastures' consent, and wants the Union to stay independent." }
      - names: { zh: "山谷合作社圈", en: "Valley Cooperative Circle" }
        notes: { zh: "小农、林业工人和合作社的圈子，愿意在分享租金和修路的条件下接受风电场，主张与渔农党联合竞选，以求跨过门槛。", en: "The circle of smallholders, forestry workers and cooperatives, willing to accept wind farms in return for shared rents and new roads, and in favour of a joint list with the Fishers and Farmers Party to clear the threshold." }
    organisation:
      newspaper: { zh: "《山路报》", en: "The Mountain Road" }
      think_tank: { zh: "高地乡村研究会", en: "Upland Rural Institute" }
      unions: { zh: "内陆牧民协会联合会", en: "Federation of Inland Herders' Associations" }
      women: { zh: "牧场妇女会", en: "Pasture Women's Guild" }

  # ── 维京群岛政党 ──
  - id: pty_z573k7
    names: { zh: 红帆社会民主党, en: Red Sail Social Democrats }
    short_names: { zh: 红帆, en: "Red Sail" }
    color: "#D7263D"
    flag: { layout: banner, colors: ["#D7263D", "#1E3A5F"], division: wavy, charge: sail }
    spectrum: -1.0
    family: { zh: 社会民主, en: Social democratic }
    ideology: [{ zh: 社会民主主义, en: Social democracy }, { zh: 劳工主义, en: Labourism }, { zh: 大帐篷政党, en: Big tent }]
    axes: { econ: 3.0, galtan: 4.0, autonomy: 4.5, green: 5.0 }
    leader: { zh: 卡娅·布伦维克, en: Kaja Brennvik }
    members: 41000
    youth_wing: { zh: 红帆青年, en: Red Sail Youth }
    slogan: { zh: 同一阵风，同一条船, en: "One wind, one boat" }
    policies:
      - { zh: 岛际渡轮对居民免费, en: Free inter-island ferries for residents }
      - { zh: 渔船、船坞和酒店员工的集体工资协议覆盖全领地, en: "Territory-wide collective wage agreements for fishing crews, boatyards and hotels" }
      - { zh: 每座有人居住的岛上都有一名全科医生, en: A general practitioner on every inhabited island }
      - { zh: 温泉和海滩收入的一部分用于公共住房, en: Part of the hot spring and beach revenue for public housing }
      - { zh: 旅游旺季的临时工享有同等社保, en: Equal social insurance for seasonal tourism workers }
    allies: [pty_jh513z, pty_vxz9jt]
    targets: { div_raat4g: 36 }
    lean: { port: 0.3, shipbuilding: 0.5, manufacturing: 0.3, fishing: 0.2, income: -0.4, urban: 0.2 }
    notes:
      zh: "红帆社会民主党（简称红帆）是维京群岛两大党之一，也是现在的执政党。它长期就叫「红帆党」，改名时在「红帆」后面加上「社会民主」四个字，党内为此争了整整一届党代会：船坞城镇的老党员觉得「帆就是帆，用不着解释」，担心一个意识形态词会把渔民、酒店员工和小店主这些并不自认为左派的支持者推开；主张改名的一方则说，红帆与海底隧道另一头的社会民主互助工党本是姊妹党，名字应当说清楚自己站在哪里。最后简称照旧。这场争论背后是一个大帐篷政党的老难题：船坞工会要的是订单和工资，渔港要的是燃油和航线，长船城里的年轻租客要的是房子，旺季来打工的临时工要的是社保，四种诉求放进同一份预算，常常彼此挤占。\n在上一次选举中，红帆以百分之三十四点六的得票拿下六十一席中的三十七席，单独执政，内阁十一个部全部由红帆党人出掌，党首卡娅·布伦维克出任首席部长，议长英韦尔德·埃尔德鲁普也出自红帆。布伦维克上任后先推全领地的集体工资协议，把渔船、船坞和酒店员工纳入同一套工资谈判，旅游旺季的临时工也享有同等社保。居民免费渡轮则受预算所限分批推行，先从外岛航线做起，大岛之间仍要买票，蓝桨保守党讥讽这是「一半免费的船」。最难兑现的是每座有人居住的岛上都有一名全科医生：医生不愿常住只有几十户人家的小岛，政府只好派巡诊船轮流停靠，批评者说那是「每周只来一天的医生」。从温泉和海滩收入中拿出一部分修公共住房的计划，则在暖泉岛的酒店业主中引起了强烈反对。\n红帆的地盘与群岛的航运和造船地图几乎重合。它在二十个市中的十五个出任市长，并且都单独执政：首府长船市议会四十九席中它占三十席，斯蒂尔维克市民议会三十九席中占三十五席，布兰诺克堡市参议会的二十七席更是全部归红帆；在蓝桨实力不弱的集装箱大港阿克斯维克，它也以二十二席对十七席守住了市长。它的弱点在乡村、高收入社区和老年人多的小镇：富鲁海姆市议会三十三席中它只有六席，莫塞、暖泉和埃德文港都由蓝桨执政；在小岛联邦党执政的乌维克库特，它只排第三。党内常说，红帆的票是跟着船走的，哪里有船坞的吊车和清晨的鱼市，哪里就有红帆。\n党名和党旗上的红帆，是群岛渔船的老式帆。红帆党人爱说「风是大家的，帆也是大家的」，口号「同一阵风，同一条船」也由此而来。每到选举之夜，支持者会在长船古城的老码头升起一面红帆，等计票结束再决定是否降下；隔着汇金湾，群岛银行大厦的塔顶会按胜选一方的颜色亮灯，老码头上的人看到对岸亮起红光，才肯散去。红帆的竞选集会少不了一场划船比赛，候选人常被拉上船掌一回舵。党代会照例在一座船坞的大棚里开，代表们坐在倒扣的船壳上发言。每年夏天，红帆青年与社会民主互助工党的青年团在海底隧道两端轮流办营。"
      en: "The Red Sail Social Democrats (Red Sail for short) are one of the Viking Islands' two big parties and the party now in government. For most of its life it was simply the Red Sail Party, and adding the words 'Social Democrats' took a whole party congress of argument. Old members from the boatyard towns felt that a sail is a sail and needs no explaining, and feared that an ideological label would push away the fishers, hotel staff and small shopkeepers who vote Red Sail without thinking of themselves as left-wing. The reformers replied that Red Sail and the Social Democratic Mutual Aid Labour Party at the other end of the undersea tunnel are sister parties, and the name ought to say plainly where the party stands. In the end the short name stayed as it was. Behind the quarrel lies the old problem of a big-tent party: the boatyard unions want orders and wages, the fishing harbours want fuel and routes, young renters in Longship want homes and seasonal workers want social insurance, and when all four are put into one budget they keep crowding each other out.\nAt the last election Red Sail took 37 of the 61 seats on 34.6% of the vote and governs alone, holding all eleven ministries. Its leader Kaja Brennvik is Chief Minister, and the Speaker, Ingveld Eldrup, is also Red Sail. Brennvik began with a territory-wide collective wage agreement that brings fishing crews, boatyards and hotel staff into the same bargaining, with equal social insurance for seasonal tourist workers. Free ferries for residents are arriving in stages because of the budget, starting with the outer-island routes, so passengers between the big islands still buy tickets, and the Blue Oar Conservatives mock it as 'a half-free boat'. Hardest of all is the promise of a general practitioner on every inhabited island. Doctors are reluctant to live on islands of a few dozen households, so the government sends clinic boats on a rota, and critics call it 'a doctor one day a week'. The plan to put part of the hot spring and beach revenue into public housing has met fierce opposition from hotel owners on Warmspring Island.\nRed Sail's map almost matches the islands' map of shipping and shipbuilding. It holds the mayoralty in fifteen of the twenty cities, governing alone in every one: 30 of the 49 seats on the council of Longship, the capital, 35 of 39 on Styrvik's citizens' assembly and every one of the 27 seats on Fort Brannock's municipal senate. In Akkersvik, the great container port where Blue Oar is strong, it holds the mayoralty with 22 seats to 17. Its weak spots are the countryside, the well-off neighbourhoods and the small towns with many older people: it has just 6 of Furuheim's 33 seats, Måsey, Warmspring and Port Edevane are run by Blue Oar, and in Uviqkut, run by the Small Isles Federal Party, it comes third. Members say Red Sail's vote follows the boats: wherever there are boatyard cranes and an early-morning fish market, there is Red Sail.\nThe red sail of the name and the flag is the old sail of the islands' fishing boats. Members like to say that the wind belongs to everyone and so does the sail, which is where the slogan 'One wind, one boat' comes from. On election night supporters raise a red sail on the old quay of Longship's old town and decide whether to lower it only when the count is done; across Goldmark Bay the top of the Islands Bank Tower is lit in the winner's colour, and the crowd on the old quay goes home only once it sees red light on the far shore. A Red Sail rally always has its rowing race, and candidates are often pulled into a boat to take the helm. The party congress is held in a boatyard shed, with delegates speaking from upturned hulls. Each summer Red Sail Youth and the youth wing of the Social Democratic Mutual Aid Labour Party camp at either end of the undersea tunnel in turn."
    history:
      zh: "红帆社会民主党起源于殖民时代的渔民和船坞工人互助会。那时群岛的议会只有两个派别，一派代表船工，一派代表船东。殖民统治结束后，船工一派成为红帆党，船东一派成为蓝桨党，两党轮流执政的格局由此定型。红帆党长期以船坞城镇和渔港为根基，后来又把旅游业员工和城市租客吸纳进来，成为一个大帐篷政党。最近它把正式名称改为红帆社会民主党，以表明自己与社会民主互助工党同属一个政治家族，简称仍是「红帆」。"
      en: "The Red Sail Social Democrats grew out of the mutual aid societies of fishers and boatyard workers in colonial times, when the islands' assembly had only two factions, one for the boat crews and one for the boat owners. When colonial rule ended the crews' faction became the Red Sail Party and the owners' faction the Blue Oar Party, and the pattern of the two taking turns in government was set. Red Sail long rested on the boatyard towns and fishing harbours, and later drew in tourism workers and urban renters to become a big-tent party. It has recently changed its formal name to the Red Sail Social Democrats to show that it belongs to the same political family as the Social Democratic Mutual Aid Labour Party; its short name is still Red Sail."
    flag_notes:
      zh: "党旗由红色和深海蓝两色组成，中间以一道波浪线分开，旗面上是一面老式渔船帆。红色取自群岛渔船旧时的红帆，那是船工们自己的颜色；深蓝是群岛四周的海，波浪线代表船工靠海吃饭，也代表风浪里同舟共济。党内老人说，帆画得这样朴素，是因为它本来就是渔船上再普通不过的东西，属于每一个出海的人。"
      en: "The flag is red and deep sea blue, parted by a wavy line, with an old fishing-boat sail upon it. The red is that of the red sails the islands' fishing boats once carried, the crews' own colour; the deep blue is the sea around the islands, and the wavy line stands for crews who live by the sea and pull together in rough weather. Old members say the sail is drawn so plainly because nothing on a fishing boat was ever more ordinary, belonging to everyone who went to sea."
    factions:
      - names: { zh: "船坞派", en: "Boatyard Wing" }
        notes: { zh: "以造船厂、港口和码头工会为核心，主张全领地集体工资协议优先，政府订单优先给群岛船坞，对财政让步最不耐烦。代表人群是船坞城镇的熟练工人和工会干部，也是反对改名最坚决的一群人。", en: "Built around the shipyard, port and dock unions, it puts the territory-wide wage agreement first, wants government orders steered to island boatyards and has the least patience for budget concessions. It speaks for skilled workers and union officers in the boatyard towns, and was the firmest opponent of the change of name." }
      - names: { zh: "渡口论坛", en: "Ferry Landing Forum" }
        notes: { zh: "由渔港和外岛的党员组成，最关心居民免费渡轮和每岛一名全科医生能否真正兑现，常在党内催促政府加快外岛航线和巡诊船。它与小岛联邦党关系不错，被看作红帆通往小岛的桥。", en: "Made up of members from the fishing harbours and outer islands, it cares most about whether free ferries and a doctor on every island are actually delivered, and presses the government to speed up outer-island routes and clinic boats. It gets on well with the Small Isles Federal Party and is seen as Red Sail's bridge to the small islands." }
      - names: { zh: "新港圈", en: "New Harbour Circle" }
        notes: { zh: "以长船等大城市的年轻租客、酒店和服务业员工为主，主张用温泉和海滩收入多建公共住房，支持改名，希望红帆在城市议题上说得更明确。老党员有时嫌它离船坞太远。", en: "Mostly young renters and hotel and service workers in Longship and the other big towns, it wants more public housing paid for from hot spring and beach revenue, backed the change of name and wants Red Sail to speak more clearly on urban issues. Older members sometimes find it too far from the boatyards." }
    organisation:
      newspaper: { zh: "《帆报》", en: "The Sail" }
      think_tank: { zh: "顺风研究所", en: "Fair Wind Institute" }
      unions: { zh: "群岛船坞与码头工会、渔船船员工会", en: "Islands Boatyard and Dock Workers' Union, Fishing Crews' Union" }
      women: { zh: "红帆妇女会", en: "Red Sail Women" }

  - id: pty_hwkmx1
    names: { zh: 蓝桨保守党, en: Blue Oar Conservatives }
    short_names: { zh: 蓝桨, en: "Blue Oar" }
    color: "#2F6DB5"
    flag: { layout: banner, colors: ["#2F6DB5", "#1B3F73"], division: wavy, charge: rudder }
    spectrum: 1.1
    family: { zh: 保守派, en: Conservative }
    ideology: [{ zh: 保守自由主义, en: Conservative liberalism }, { zh: 经济自由主义, en: Economic liberalism }, { zh: 温和保守主义, en: Moderate conservatism }]
    axes: { econ: 7.0, galtan: 5.5, autonomy: 5.0, green: 6.5 }
    leader: { zh: 哈尔夫丹·厄斯特马克, en: Halvdan Østmark }
    members: 38000
    youth_wing: { zh: 蓝桨青年, en: Blue Oar Youth }
    slogan: { zh: 划得稳，靠得岸, en: "Row steady, reach the shore" }
    policies:
      - { zh: 降低船东和酒店业的营业税, en: Lower business tax for boat owners and hotels }
      - { zh: 领地预算每年平衡，债务不超过生产总值的三成, en: "A balanced budget every year, with debt under thirty per cent of output" }
      - { zh: 私人投资修建新的游艇码头和温泉酒店, en: Private investment in new marinas and hot spring hotels }
      - { zh: 维京群岛的海警和搜救队扩编, en: Enlarge the Viking Islands' coastguard and rescue service }
    allies: [pty_mak5vy, pty_k4krwn, pty_9w8gxv]
    targets: { div_raat4g: 33 }
    lean: { finance: 0.4, commerce: 0.2, tourism: 0.2, income: 0.5, old: 1.5, residential: 0.2 }
    notes:
      zh: "蓝桨保守党（简称蓝桨）是维京群岛的另一大党，也是现在的正式反对党。它原名「蓝桨党」，改名时加上「保守」二字，党内并非没有异议：汇金区的金融界党员认为蓝桨在经济上是自由派，「保守」会让年轻的专业人士望而却步；老城镇的党员却觉得这个词正说出了他们要守住的东西——平衡的账本、安静的街区和靠得住的海警。最后两边都接受了一句话：蓝桨守的是规矩，放开的是市场。蓝桨的路线本身就带着张力：它要降低船东和酒店业的营业税，又要领地预算每年平衡、债务不超过生产总值的三成，还要扩编海警和搜救队。减税、平衡预算和增加开支很难同时做到，每一份蓝桨的预算方案都要在这三者之间来回挪钱。\n在上一次选举中，蓝桨拿到百分之三十一点七的选票，与红帆社会民主党相差不到三个百分点，却只赢下二十三席，比红帆少十四席——单议席选区制下，几个点的差距就足以决定谁上台。党首哈尔夫丹·厄斯特马克以反对党领袖的身份坐在议会前排，每年都针对政府预算提出一份「影子预算」，逐项标出他认为可以省下的钱。蓝桨最常反对的是红帆的居民免费渡轮，理由是「免费的船也要有人付油钱」；它也坚决反对动用温泉收入修公共住房，认为这会吓走到暖泉投资的酒店。蓝桨上一次执政时，引入私人资本修建游艇码头和温泉酒店，旅游收入增加了，但也有人批评新码头占了渔船的泊位，这笔旧账红帆至今仍在竞选中提起。在地方上，蓝桨是莫塞、富鲁海姆、暖泉和埃德文港四市的第一大党，都单独执政，在乌维克库特则作为小岛联邦党的伙伴参与执政。\n蓝桨的选民偏年长、收入偏高，集中在金融和商业发达的城区、旅游度假小镇和以住宅为主的社区。长船的汇金区是它的钱袋子，长船市议会四十九席中它有十九席；莫塞市议会三十五席中它占二十五席，富鲁海姆三十三席中占二十三席，埃德文港二十九席中占二十席。它在船坞城镇和渔港最弱：斯蒂尔维克三十九席中只有四席，弗洛德维克三十五席中只有三席。年龄是蓝桨的晴雨表，在老年人多的社区，哪怕收入并不高，蓝桨也常常领先，这些选民看重的是治安、海上救援和养老金的稳定，而不是渡轮票价。\n党名来自殖民时代船东们在议会里举起的蓝色船桨标牌，口号「划得稳，靠得岸」说的是稳健理财。厄斯特马克出身船东家庭，年轻时在渔船上当过三年水手，常说自己「既懂账本，也懂缆绳」。红帆和蓝桨在议会辩论时互不相让，可每年群岛划船节上两党议员会同坐一条长船，按传统，谁划错了桨谁就要请全船人喝鱼汤。竞选集会上的划船比赛，蓝桨总让候选人坐在船尾掌舵，与党旗上的舵相呼应。选举之夜，蓝桨的支持者聚在汇金区，抬头看群岛银行大厦的塔顶：亮起蓝灯就开酒庆祝，亮起红灯就各自回家。"
      en: "The Blue Oar Conservatives (Blue Oar for short) are the Viking Islands' other big party and the official opposition. The party used to be called simply the Blue Oar Party, and adding 'Conservatives' was not without dissent. Members in Goldmark's financial world argued that Blue Oar is liberal on the economy and that the word would put off young professionals; members in the older towns felt it named exactly what they want to keep: balanced books, quiet streets and a coastguard you can count on. In the end both sides settled on a phrase: Blue Oar conserves the rules and frees the market. Its programme carries a built-in tension. It wants lower business tax for boat owners and hotels, a budget balanced every year with debt below three-tenths of output, and a larger coastguard and rescue service. Cutting taxes, balancing the books and spending more are hard to do at once, and every Blue Oar budget plan shuffles money back and forth among the three.\nAt the last election Blue Oar took 31.7% of the vote, less than three points behind the Red Sail Social Democrats, yet won only 23 seats, fourteen fewer than Red Sail: under single-seat constituencies a few points decide who governs. Its leader Halvdan Østmark sits on the front bench as Leader of the Opposition and each year answers the government's budget with a 'shadow budget' marking, line by line, the money he believes could be saved. The policy Blue Oar opposes most often is Red Sail's free ferries for residents, on the grounds that someone still has to pay for a free boat's fuel; it also fights the use of hot spring revenue for public housing, arguing that it will scare off hotel investment in Warmspring. When Blue Oar last governed it brought private capital into marinas and hot spring hotels, and tourism revenue rose, but critics said the new marinas took berths from fishing boats, an old score Red Sail still settles at election time. In local government Blue Oar is the largest party in Måsey, Furuheim, Warmspring and Port Edevane, governing alone in all four, and in Uviqkut it governs as the Small Isles Federal Party's partner.\nBlue Oar's voters are older and better off, concentrated in the commercial and financial districts, the holiday towns and the mainly residential neighbourhoods. Goldmark in Longship is its purse, and it holds 19 of the 49 seats on Longship's council; it has 25 of Måsey's 35 seats, 23 of Furuheim's 33 and 20 of Port Edevane's 29. It is weakest in the boatyard towns and fishing harbours: 4 of 39 seats in Styrvik and 3 of 35 in Flodvik. Age is Blue Oar's barometer. In neighbourhoods with many older people it often leads even where incomes are modest, because those voters care about public safety, sea rescue and steady pensions more than ferry fares.\nThe name comes from the blue oar placards the boat owners raised in the colonial assembly, and the slogan 'Row steady, reach the shore' is about careful money. Østmark comes from a boat-owning family and spent three years as a deckhand on a fishing boat in his youth; he likes to say he knows both the ledger and the ropes. Red Sail and Blue Oar give no quarter in debate, yet at the islands' rowing festival each year their members share one longboat, and by tradition whoever misses a stroke buys fish soup for the whole crew. In the rowing race at its campaign rallies Blue Oar always puts the candidate in the stern at the helm, to match the rudder on its flag. On election night its supporters gather in Goldmark and look up at the top of the Islands Bank Tower: if it lights up blue they open the bottles, if red they go home."
    history:
      zh: "蓝桨保守党起源于殖民时代议会里代表船东和商人的派别。那时船东们在议事厅里举起蓝色的船桨标牌表态，党名由此而来。殖民统治结束后，这一派与代表船工的一派分别成为蓝桨党和红帆党，此后两党轮流执政。蓝桨党长期以船东、商人和城镇中产为根基，后来又吸纳了旅游业和金融业的新选民。最近它把正式名称改为蓝桨保守党，简称仍是「蓝桨」。"
      en: "The Blue Oar Conservatives grew out of the colonial assembly's faction of boat owners and merchants; the name comes from the blue oar placards the owners raised in the chamber to show where they stood. When colonial rule ended this faction and the crews' faction became the Blue Oar and Red Sail parties, which have taken turns in government ever since. Blue Oar long rested on boat owners, merchants and the town middle class, and later drew in new voters from tourism and finance. It has recently changed its formal name to the Blue Oar Conservatives; its short name is still Blue Oar."
    flag_notes:
      zh: "党旗由两种蓝色组成，中间以一道波浪线分开，旗面上是一只船舵。浅一些的蓝是晴天的海面，深蓝是深水，波浪线是船走过的航道。党名叫蓝桨，旗上画的却是舵：老党员解释说，殖民时代船东们举的那支蓝桨，本来就是长船尾部用来转向的舵桨，后来才画成了舵的样子；党内也爱说，桨要大家一起划，舵要有人稳稳把住。"
      en: "The flag is in two blues parted by a wavy line, with a ship's rudder upon it. The lighter blue is the sea on a fine day, the darker the deep water, and the wavy line is a vessel's wake. The party is called Blue Oar, yet the flag shows a rudder: old members explain that the blue oar the colonial boat owners raised was in fact the steering oar at a longship's stern, later drawn as a rudder. Members also like to say that everyone pulls an oar, but someone has to hold the helm steady."
    factions:
      - names: { zh: "账本派", en: "Ledger Group" }
        notes: { zh: "财政鹰派，坚持预算每年平衡、债务不超过生产总值的三成，主张减税必须配上削减开支。成员多是汇金区的金融从业者和会计师，「影子预算」大多出自他们之手。", en: "The fiscal hawks, who insist on a balanced budget every year and debt below three-tenths of output, and want every tax cut matched by spending cuts. Many are finance professionals and accountants from Goldmark, and they write most of the shadow budget." }
      - names: { zh: "码头俱乐部", en: "Quayside Club" }
        notes: { zh: "代表游艇码头、温泉酒店和旅游业的投资者，主张大力引入私人资本，对营业税减免最热心。它在暖泉和旅游小镇势力最大，也最常被红帆指责「只替酒店说话」。", en: "Speaks for investors in marinas, hot spring hotels and tourism, wants private capital brought in on a large scale and is keenest on cutting business tax. It is strongest in Warmspring and the holiday towns, and the faction Red Sail most often accuses of speaking only for the hotels." }
      - names: { zh: "老港圈", en: "Old Harbour Circle" }
        notes: { zh: "由老城镇和住宅社区的年长党员组成，重视治安、海警和搜救、养老金的稳定，社会议题上偏传统，是改名加上「保守」二字的主要推动者。它对大规模开发持保留态度。", en: "Older members from the old towns and residential neighbourhoods who care about public safety, the coastguard and rescue service and steady pensions, and lean traditional on social questions; they did most to add 'Conservatives' to the name, and are wary of large-scale development." }
    organisation:
      newspaper: { zh: "《桨声》", en: "The Oarstroke" }
      think_tank: { zh: "稳舵研究会", en: "Steady Helm Institute" }
      unions: { zh: "群岛船东协会、酒店与温泉业主联合会", en: "Islands Shipowners' Association, Hotel and Spa Owners' Federation" }
      women: { zh: "蓝桨妇女协会", en: "Blue Oar Women's Association" }

  - id: pty_vxz9jt
    names: { zh: 小岛联邦党, en: Small Isles Federal Party }
    short_names: { zh: 小岛, en: "Small Isles" }
    color: "#4FB3A9"
    flag: { layout: banner, colors: ["#4FB3A9"], charge: star_ring, charge_color: "#F4FBFA", extra: [{ charge: isles, color: "#F4FBFA", x: 30, y: 20, size: 14 }] }
    spectrum: 0.1
    family: { zh: 地区主义, en: Regionalist }
    ideology: [{ zh: 联邦主义, en: Federalism }, { zh: 岛屿地方主义, en: Island localism }, { zh: 中间主义, en: Centrism }]
    axes: { econ: 5.0, galtan: 4.5, autonomy: 1.5, green: 4.0 }
    leader: { zh: 埃利西芙·霍尔姆韦尔, en: Ellisif Holmvær }
    members: 3600
    youth_wing: { zh: 小岛青年, en: Small Isles Youth }
    slogan: { zh: 别让最后一盏灯熄灭, en: Don't let the last light go out }
    policies:
      - { zh: 人口不足五百的岛屿免征房产税, en: No property tax on islands of under five hundred people }
      - { zh: 每座有人居住的岛每天至少两班渡轮, en: At least two ferries a day to every inhabited island }
      - { zh: 远程工作者迁居小岛可获安家补贴, en: Settling grants for remote workers moving to small islands }
      - { zh: 小岛上的学校即使只剩一个学生也不关闭, en: "No small-island school closes, even with one pupil left" }
    allies: [pty_z573k7, pty_hwkmx1, pty_x004cm]
    targets: { div_raat4g: 10 }
    lean: { fishing: 0.8, aquaculture: 0.6, old: 3.0, urban: -2.4 }
    notes:
      zh: "小岛联邦党（简称小岛）代表维京群岛外围小岛的居民。它原名「小岛联合」，改名时加入「联邦」二字，是党内联邦派长期推动的结果：他们认为，只靠在议会里为渡轮班次讨价还价，小岛永远是被照顾的一方，应当让人口稀少的岛群拥有自己的议事会和预算，在领地之内实行联邦式的分权。反对者担心这个词太大、太抽象，离码头上的渡轮时刻表太远，也怕选民把它和别的「联邦」党派混为一谈。最终党代会以不大的多数通过了新名，口号「别让最后一盏灯熄灭」则一字未改。小岛在经济上走中间路线，主张人口不足五百的岛屿免征房产税，又要求每座有人居住的岛每天至少两班渡轮、小岛上的学校即使只剩一个学生也不关闭——减税与加开支并列，正是它在两大党那里都找得到朋友、也都会遭到质疑的原因。\n在上一次选举中，小岛拿到百分之九点六的选票，却只赢下一席，得票与议席相差悬殊。那一席来自一个由几十座小岛组成的选区，党在议会里唯一的议员每次去开会都要先坐渡轮再换小船，路上要走大半天，她说这正是她要在议会里讲的事。红帆社会民主党单独过半，不需要小岛的一票，这让小岛在领地层面的影响力有限；它的办法是在委员会里一条航线一条航线地追问，并在每次预算辩论中提出「最远一户」修正案，要求任何交通和医疗开支都先算清楚对最远的那户人家意味着什么。在地方上，它的成绩更显眼：在乌维克库特市议会二十七席中占十二席，是第一大党，市长出自小岛，与蓝桨保守党联合执政；它在富鲁海姆、克莱特斯塔德、莫塞和卡洛韦堡的市议会也有议席。乌维克库特的联合市政府保住了几所学生只剩个位数的学校，也因为渡轮码头的修缮超支而受到批评。\n小岛的选民地图是群岛人口地图的反面：越是城市越弱，越是偏远、渔业和养殖业越重要、老年人越多的地方越强。许多小岛的年轻人去了大岛或北维京岛，留下的多是渔民和老人，他们是党的基本盘；在长船、阿克斯维克这样的大城市，它在市议会里一席也没有。近来，迁居小岛的远程工作者给党带来了一批新党员，他们关心宽带和学校，与老渔民关心的鱼价和渡轮未必一致，但都同意一件事：岛上不能没有灯。\n党的第一次大会是在一艘渡轮的甲板上召开的，至今党代会仍选在渡轮上或渡轮码头旁举行，议程按渡轮班次排定，最后一班船开船之前必须散会，因渡轮晚点而推迟表决的事并不少见。每个有党员的岛都会带一盏防风灯来，开会时摆成一圈；口号里的「最后一盏灯」，说的就是岛上最后一户人家。党首埃利西芙·霍尔姆韦尔把这一圈灯称作「党的选民登记册」。竞选期间，小岛也办划船比赛，只是划的不是仿古长船，而是小渔船，从一座岛划到邻近的另一座岛，岸上的人数清楚了，就知道这座岛还有多少户人家。"
      en: "The Small Isles Federal Party (Small Isles for short) speaks for the people of the Viking Islands' outlying small islands. It used to be the Small Isles Union, and adding 'Federal' to the name was the work of the party's federalists, who had pressed for it for a long time. They argued that as long as the party only haggles over ferry timetables in parliament, the small islands will always be on the receiving end of favours; thinly peopled island groups should have councils and budgets of their own, a federal sharing of power within the territory. Opponents worried that the word was too big and abstract, too far from the timetable on the quay, and that voters might confuse the party with others carrying 'federal' in their names. The congress passed the new name by a modest majority, and the slogan 'Don't let the last light go out' was left untouched. On the economy Small Isles keeps to the centre. It wants no property tax on islands of under five hundred people, yet also demands at least two ferries a day to every inhabited island and that no small-island school close while it has a single pupil. Putting tax cuts and new spending side by side is exactly why it finds friends in both big parties, and sceptics in both.\nAt the last election Small Isles took 9.6% of the vote but won only one seat, a wide gap between votes and seats. That seat is a constituency of dozens of small islands, and the party's only member of parliament takes a ferry and then a small boat to every sitting, most of a day's journey, which she says is exactly what she is there to talk about. With the Red Sail Social Democrats holding a majority on their own, the government does not need Small Isles' vote, which limits its weight in the territory. Its answer is to question ministers route by route in committee and to move a 'farthest household' amendment in every budget debate, demanding that any transport or health spending first be measured by what it means for the household farthest away. Locally its record is more visible. It holds 12 of the 27 seats on Uviqkut's council, the largest party, and the mayor is Small Isles, governing with the Blue Oar Conservatives; it also has seats on the councils of Furuheim, Klettstad, Måsey and Fort Calloway. Uviqkut's coalition has kept open several schools with pupils in single figures, and has been criticised for cost overruns on repairs to a ferry quay.\nSmall Isles' electoral map is the reverse of the islands' population map: the more urban a place, the weaker it is; the more remote, the more it depends on fishing and fish farming and the older its people, the stronger. Many young people from the small islands have left for the larger islands or North Viking Island, leaving mostly fishers and the old, and they are the party's core. In big cities such as Longship and Akkersvik it has no council seats at all. Lately remote workers settling on the small islands have brought in a new wave of members; they care about broadband and schools rather than fish prices and ferries, but they agree with the old fishers on one thing: an island cannot do without its lights.\nThe party's first meeting was held on a ferry's deck, and its congress still meets on a ferry or beside a ferry quay. The agenda is built around the sailings and the meeting must end before the last boat leaves, so votes are not infrequently delayed by a late ferry. Every island with party members brings a storm lantern, and the lanterns are set out in a ring; the 'last light' of the slogan is the last household on an island. The party leader, Ellisif Holmvær, calls the ring of lanterns the party's electoral roll. At election time Small Isles holds rowing races too, but in small fishing boats rather than replica longships, rowing from one island to its neighbour; once the crowd on the shore has been counted, everyone knows how many households the island still has."
    history:
      zh: "小岛联邦党的前身是小岛联合。几座小岛的居民会在渡轮班次被削减后联合起来，组建了这个组织，第一次大会就在一艘渡轮的甲板上召开。起初它只是各岛居民会之间的联络网，后来开始在议会选举中派出候选人，并在一个由几十座小岛组成的选区里赢下了议席。随着党内联邦派的壮大，它改名为小岛联邦党，把为小岛争取自己的议事会和预算写进了党纲。"
      en: "The Small Isles Federal Party began as the Small Isles Union, formed by the residents' councils of several small islands after their ferry services were cut; its first meeting was held on a ferry's deck. At first it was only a network linking the islands' councils, but it went on to field candidates in parliamentary elections and won the seat for a constituency of dozens of small islands. As its federalist wing grew, it renamed itself the Small Isles Federal Party and wrote into its programme the aim of councils and budgets of the small islands' own."
    flag_notes:
      zh: "青绿色的旗面上是九颗白星组成的环，左上方有一组小小的白色岛屿图案。青绿色是浅海和礁盘的颜色，也是外岛航道上的海水。九颗星并不对应哪九座岛，党内的说法是：环上的星一样大，没有哪一颗在中间，就像联邦里的岛不分大小。岛屿图案取自第一次大会时渡轮甲板上那面手绘的横幅。"
      en: "A teal field bears a ring of nine white stars, with a small group of white islands in the upper hoist. Teal is the colour of the shallows and the reefs, the water of the outer-island sea lanes. The nine stars do not stand for nine particular islands; as members put it, every star in the ring is the same size and none sits in the middle, just as no island in a federation counts for more than another. The islands come from the hand-painted banner hung on the ferry deck at the party's first meeting."
    factions:
      - names: { zh: "渡轮派", en: "Ferry Caucus" }
        notes: { zh: "党内最务实的一群人，主张把力气花在渡轮班次、学校和医生上，不急于谈宪制改革。成员多是年长的渔民和各岛居民会的老骨干，曾对改名心存疑虑。", en: "The most practical people in the party, who want its energy spent on ferry sailings, schools and doctors rather than constitutional reform. Many are older fishers and veterans of the island residents' councils, and they had doubts about the change of name." }
      - names: { zh: "联邦论坛", en: "Federal Forum" }
        notes: { zh: "推动改名的主力，主张让人口稀少的岛群拥有自己的议事会和预算，在领地内实行联邦式分权。成员多是受过高等教育、在大岛工作过又回到家乡的党员。", en: "The driving force behind the new name, it wants thinly peopled island groups to have councils and budgets of their own under a federal division of power within the territory. Many of its members are graduates who worked on the big islands and came home." }
      - names: { zh: "新岛民圈", en: "New Islanders' Circle" }
        notes: { zh: "由迁居小岛的远程工作者和返乡的年轻人组成，最关心宽带、安家补贴和学校，希望小岛不只是老人的家园。它与老渔民在鱼价、房价等问题上偶有分歧。", en: "Remote workers who have moved to the small islands and young people who have come back, most concerned with broadband, settling grants and schools, and keen that the islands be more than a home for the old. It sometimes differs with the older fishers over fish prices and house prices." }
    organisation:
      newspaper: { zh: "《渡口》", en: "The Landing" }
      think_tank: { zh: "外岛研究所", en: "Outer Isles Institute" }
      unions: { zh: "小岛渔民合作社", en: "Small Isles Fishers' Cooperative" }
      women: { zh: "灯火妇女会", en: "Lamplight Women's Guild" }

  - id: pty_9w8gxv
    names: { zh: 自由港党, en: Free Port Party }
    short_names: { zh: 自港, en: "Free Port" }
    color: "#C9A227"
    flag: { layout: banner, colors: ["#C9A227", "#1B1B1B"], division: pile, charge: key }
    spectrum: 1.8
    family: { zh: 自由派, en: Liberal }
    ideology: [{ zh: 古典自由主义, en: Classical liberalism }, { zh: 自由意志主义, en: Libertarianism }, { zh: 自由贸易, en: Free trade }]
    axes: { econ: 9.0, galtan: 3.5, autonomy: 4.0, green: 8.0 }
    leader: { zh: 叶书衡, en: Ye Shuheng }
    members: 2900
    youth_wing: { zh: 自由港青年, en: Young Free Port }
    slogan: { zh: 少一张表格，多一条船, en: "One form fewer, one ship more" }
    policies:
      - { zh: 把群岛的主要商港设为免税自由港, en: Make the islands' main trading harbours duty-free ports }
      - { zh: 取消船舶登记的地方附加费, en: Abolish local surcharges on ship registration }
      - { zh: 新企业注册一天内办完, en: Register a new business in a single day }
      - { zh: 领地公务员人数十年不增, en: No increase in the territorial civil service for ten years }
    allies: [pty_hwkmx1, pty_mak5vy]
    targets: { div_raat4g: 5 }
    lean: { finance: 0.9, trade: 0.4, income: 0.8, "lang:en": 1.5 }
    notes:
      zh: "自由港党（简称自港）是维京群岛的古典自由主义小党，主张把群岛的主要商港设为免税自由港、取消船舶登记的地方附加费、新企业注册一天内办完、领地公务员人数十年不增。别的党派纷纷在名称里加上意识形态词时，自由港党没有改名，党员们说「自由」本来就写在名字里。党内的张力来自它的两副面孔：在经济上它是彻底的市场派，在社会议题上却相当开放，主张尊重个人选择、反对多余的管制，这让它与蓝桨保守党的结盟始终带着一点别扭。另一重矛盾藏在它的招牌政策里：它要冻结公务员人数，可真要建成免税自由港，海关、检疫和港务的人手只会更多。对这个问题，党内的回答是「让表格变少，人就够用」，但连不少党员也承认这句话还需要一份更细的账。\n在上一次选举中，自由港党拿到百分之四点八的选票，却一个选区也没有赢下，在各市议会里也没有议席。它的票分散在许多选区，党首叶书衡说：「我们拿到的票够开一家很大的公司，却不够换一个议席。」为了不让右翼的票被分散，它常与蓝桨协调候选人，在一些选区里干脆不派人，让支持者去投蓝桨。这种做法在党内争议很大：务实派认为这样才能把自由港的主张写进蓝桨的竞选纲领，纯粹派则抱怨自由港党由此成了蓝桨的影子，每让出一个选区，都等于告诉选民投自己是白投。没有议席的自由港党把力气放在议会外：它每年把政府要求企业填写的表格收集起来，编成一本厚厚的册子，在议会门口逐页宣读哪一张应该取消，这本册子在船舶代理行里颇受欢迎。\n它的支持者多是港口贸易商、船舶代理和金融业从业者，集中在长船的汇金区和几座商港的城区，在以英语为母语的居民中支持率尤其高，汇金区的离岸金融和国际航运本来就多用英语做生意。群岛吞吐量最大的集装箱港阿克斯维克，也是它竞选时必去的地方。在收入偏低的船坞城镇和渔港，它的主张常被看作只替货主和银行着想，得票很低；一些渔民担心，免税自由港会让进口鱼货压低码头上的鱼价，这是自由港党至今没能说服的一群人。\n党部办公室只有一个房间，墙上挂着一张群岛航运图，标出了每一条可以免税的航线。口号「少一张表格，多一条船」被印在党员证的背面，党员证本身也只有一张卡片那么大。党的会议出了名的短：每项动议只能写在一页纸上，超过一页的直接退回，年会通常在一个下午之内开完。竞选集会上的划船比赛，自由港青年总是报名最积极的一队，赛前还要和对手签一份「自愿参赛协议」。选举之夜，群岛银行大厦的塔顶只会亮起红帆或蓝桨的颜色，自由港党员就在汇金区的酒吧里举杯，祝有一天塔顶亮起金色。"
      en: "The Free Port Party (Free Port for short) is a small classical liberal party in the Viking Islands. It wants the islands' main trading harbours made duty-free ports, local surcharges on ship registration abolished, new businesses registered within a day and no growth in the territory's civil service for ten years. When other parties added ideological words to their names, Free Port kept its own; members say the freedom is already in the name. Its internal tension comes from having two faces. On the economy it is wholeheartedly for the market, while on social questions it is quite open, standing for personal choice and against needless regulation, which keeps its alliance with the Blue Oar Conservatives a little awkward. A second contradiction lies in its flagship policy: it wants the civil service frozen, yet a real duty-free port would need more customs, inspection and harbour staff, not fewer. The party's answer is that fewer forms mean enough people, but plenty of members admit the sums behind that line still need working out.\nAt the last election Free Port took 4.8% of the vote but won no constituency, and it has no seats on any city council. Its vote is spread across many seats, and its leader Ye Shuheng says it has enough votes to run a very large company but not enough to win a seat. To avoid splitting the right-of-centre vote it often coordinates candidates with Blue Oar, standing down in some constituencies so that its supporters vote Blue Oar. This is hotly disputed inside the party. Pragmatists say it is the only way to get Free Port ideas into Blue Oar's manifesto; purists complain that it has turned the party into Blue Oar's shadow, and that every seat it gives up tells voters a Free Port vote is wasted. With no seats, the party works outside parliament: every year it collects the forms the government requires businesses to fill in, binds them into a thick volume and reads it out page by page at the parliament door, announcing which forms should go. The volume is a favourite in the ship agencies.\nIts supporters are mostly harbour traders, ship agents and people in finance, concentrated in Goldmark in Longship and the town centres of the trading harbours, and its support is notably high among native English speakers, since Goldmark's offshore finance and international shipping already do much of their business in English. Akkersvik, the islands' busiest container port, is a fixed stop on its campaigns. In the poorer boatyard towns and fishing harbours its ideas are often seen as serving only cargo owners and banks, and its vote is very low; some fishers fear a duty-free port would let imported catches push down prices on the quay, and they are a group the party has yet to win over.\nThe party office is a single room with a shipping chart of the islands on the wall, marking every route that could be duty-free. The slogan 'One form fewer, one ship more' is printed on the back of the membership card, itself no bigger than a business card. Party meetings are famously short: every motion must fit on one page, anything longer is sent back, and the annual meeting is usually over in an afternoon. In the rowing races at campaign rallies Young Free Port is always the keenest crew to enter, and signs a 'voluntary participation agreement' with its opponents before the start. On election night the top of the Islands Bank Tower lights only in Red Sail's or Blue Oar's colour, so Free Port members raise a glass in a Goldmark bar to the day it glows gold."
    history:
      zh: "自由港党由几位港口贸易商在一次船舶登记费上调后创立，起初只是一个商会里的游说小组，专门给议员递送关于关税和登记费的意见书。后来他们发现两大党都不愿彻底取消附加费，便决定自己组党参选。至今党内仍保留着商会的作风：开会讲效率，决议写得像合同条款，党员之间常以「合伙人」相称。"
      en: "The Free Port Party was founded by a handful of harbour traders after a rise in ship registration fees, beginning as a lobbying group within a chamber of commerce that sent members of parliament briefs on duties and registration fees. When they found that neither big party would scrap the surcharges outright, they decided to form a party and stand themselves. The party still keeps the manners of a chamber of commerce: meetings are run for efficiency, resolutions read like clauses in a contract and members often call one another partners."
    flag_notes:
      zh: "党旗由金色和黑色组成，以一道楔形分开，旗面上是一把钥匙。钥匙代表打开港口的大门，让货物和船只自由进出；金色是贸易带来的财富，也是商港夜里的灯光，黑色是账本上的墨水和夜里的深海。楔形像一只船头劈开海水，党员说这是「先开出航道，再谈别的」。"
      en: "The flag is gold and black, divided by a wedge, with a key upon it. The key opens the gates of the harbour so that goods and ships can come and go freely; gold is the wealth trade brings and the lights of a trading port at night, black the ink of the ledger and the deep sea after dark. The wedge is like a bow cutting through the water, which members read as 'open the sea lane first, then talk about the rest'."
    factions:
      - names: { zh: "零关税派", en: "Zero Tariff Wing" }
        notes: { zh: "党内的自由贸易纯粹派，主张所有商港都设为自由港、取消一切地方附加费，反对为争取议席而让出选区。成员多是港口贸易商和船舶代理，是党的创始圈子。", en: "The party's free-trade purists, who want every trading harbour made a free port and every local surcharge abolished, and oppose standing down candidates for the sake of seats. Mostly harbour traders and ship agents, they are the party's founding circle." }
      - names: { zh: "汇金俱乐部", en: "Goldmark Club" }
        notes: { zh: "以汇金区的金融从业者为主，关心离岸金融的监管和税制，主张与蓝桨保守党紧密协调候选人，是党内务实派的大本营。他们更愿意让自由港的主张进入蓝桨的纲领。", en: "Mostly finance professionals from Goldmark, concerned with offshore finance regulation and tax, and in favour of close coordination of candidates with the Blue Oar Conservatives; it is the stronghold of the party's pragmatists, who would rather see Free Port ideas in Blue Oar's programme." }
      - names: { zh: "小政府论坛", en: "Small State Forum" }
        notes: { zh: "党内的自由意志主义一翼，最关心冻结公务员人数和减少管制，在社会议题上最为开放，主张政府少管私人生活。成员多是年轻的创业者和自由港青年的骨干。", en: "The party's libertarian wing, most concerned with freezing the civil service and cutting regulation, and the most open on social questions, wanting government out of private life. Many members are young entrepreneurs and leading figures in Young Free Port." }
    organisation:
      newspaper: { zh: "《提单》", en: "The Bill of Lading" }
      think_tank: { zh: "开港研究所", en: "Open Port Institute" }
      unions: { zh: "群岛船舶代理人协会", en: "Islands Ship Agents' Association" }
      women: { zh: "自由港女性商会", en: "Free Port Women in Business" }

  # ── 北冰洋政党 ──
  - id: pty_6yj1xj
    names: { zh: 塔夫鲁利特人民党, en: Tavrulit People's Party }
    short_names: { zh: 塔人党, en: "Tavrulit" }
    color: "#B23A48"
    flag: { layout: border, colors: ["#B23A48", "#1C2B4A", "#FFFFFF"], charge: whaletail }
    spectrum: -1.2
    family: { zh: 原住民, en: Indigenous }
    ideology: [{ zh: 原住民权利, en: Indigenous rights }, { zh: 社会民主主义, en: Social democracy }, { zh: 土地权利, en: Land rights }]
    axes: { econ: 3.0, galtan: 4.0, autonomy: 1.5, green: 3.0 }
    leader: { zh: 尼维卡克·陶武里亚克, en: Nivikkaaq Tauvvuriaq }
    members: 47000
    youth_wing: { zh: 塔夫鲁利特青年, en: Tavrulit Youth }
    slogan: { zh: 这片土地记得我们, en: This land remembers us }
    policies:
      - { zh: 矿产和能源收入的一部分进入原住民共同基金, en: Part of mining and energy revenue into a common indigenous fund }
      - { zh: 塔夫鲁纳克语与中文同为学校的教学语言, en: Tavrunaq and Chinese as equal languages of teaching }
      - { zh: 驯鹿迁徙路线和传统猎场受法律保护, en: Legal protection for reindeer migration routes and traditional hunting grounds }
      - { zh: 新的矿山和港口须先征得附近社区同意, en: "New mines and harbours only with the consent of nearby communities" }
      - { zh: 每个村落都有宽带和卫星电话, en: Broadband and satellite phones in every village }
    allies: [pty_jh513z, pty_18qa5s, pty_2033kv]
    targets: { div_hpmerr: 19 }
    lean: { "lang:art-x-tavrunaq": 3.0, herding: 0.4, hunting: 0.4, fishing: 0.2 }
    roll: 2.6
    notes:
      zh: "塔夫鲁利特人民党（简称塔人党）是北冰洋领地议会第一大党，代表塔夫鲁利特人和其他讲塔夫鲁纳克语的居民，属中左翼。它把原住民权利与社会民主主义绑在一起：一方面要求矿产和能源收入的一部分进入原住民共同基金，让塔夫鲁纳克语与中文同为学校的教学语言，保护驯鹿迁徙路线和传统猎场；另一方面又要求每个村落都有宽带和卫星电话，把公共服务送到苔原深处。两条路线的交汇处也是党内的张力所在：共同基金需要矿山和能源项目带来收入，而党纲又规定新的矿山和港口须先征得附近社区同意。每当一座新矿开不开的问题摆上桌面，牧民合作社和村落议事会的代表往往站在一边，南岸城市里关心就业和福利的党员站在另一边。长老之道当初就是因为塔人党同意开发一座新矿而另立门户的，这段往事至今仍是党代会上的敏感话题。\n在上一次选举中，塔人党以百分之十八点八的得票拿下七十一席中的二十席，与社会民主互助工党、冶炼与矿山工会社会主义工人党和绿脉党组成四党联合政府，四党合计四十席，在议会中过半。党首尼维卡克·陶武里亚克出任总理，内阁十一个部中塔人党占六个，议长阿尼克萨克·卡尔苏克也出自塔人党。陶武里亚克在就职典礼上用塔夫鲁纳克语讲了一句老话：「冰会裂，但人要站在一起。」联合政府内部并不平静：冶炼与矿山工会社会主义工人党要保住矿山和冶炼厂的工作，绿脉党要扩大保护区，陶武里亚克的办法是把「社区同意」做成一道正式程序，每个新项目都要先在附近村落开听证会，由村落议事会表决，再进入领地的审批。支持者说，村落第一次在矿山面前有了真正的发言权；批评者则说审批变得太慢，金库党干脆把这道程序叫作「冰层下的排队」。\n塔人党的选民地图几乎就是塔夫鲁纳克语的分布图，驯鹿牧区和渔猎村落尤其稳固。它在领地十个市级单位中的八个出任市长或主席：首府努卡塔克、南岸的萨尔瓦克和乌库拉克、内陆的考尔尼克、北岸的基卢克图阿尔和西尔米瓦克，以及乌维克萨克和塔夫鲁利特原住民自治区，在自治区议事会四十一席中占十八席。它最弱的是帕卢尔尼克金融特区，三十一席中只有一席。在图利瓦克，它以七席排在金库党的八席之后，作为金库党市长的执政伙伴参与市政，在领地议会里针锋相对的两党，在这座南岸城市里要一起审同一份预算。\n口号「这片土地记得我们」，说的是土地上留着祖辈的猎场、迁徙路和石堆路标。塔人党的党代会每次都在一个不同的村落举行，代表们乘雪橇、渔船和小飞机赶去，会场常常就是村里学校的体育馆，东道主村落负责煮驯鹿肉汤，代表们自带睡袋，散会后睡在教室里。极夜结束的回光节那天，党的议员们会回到各自的村落，和乡亲们一起爬上高处等那几分钟的阳光；党内有一条不成文的规矩，回光节那天不谈政治，只听长老念祝词。"
      en: "The Tavrulit People's Party (Tavrulit for short) is the largest party in the Arctic Ocean assembly, a centre-left party speaking for the Tavrulit and the territory's other Tavrunaq speakers. It ties indigenous rights to social democracy. On one side it wants part of the mining and energy revenue paid into a common indigenous fund, Tavrunaq taught in schools on equal terms with Chinese, and the reindeer migration routes and traditional hunting grounds protected; on the other it wants broadband and satellite phones in every village, carrying public services deep into the tundra. Where the two lines meet lies the party's inner strain: the common fund needs revenue from mines and energy projects, while the programme says no new mine or harbour may go ahead without the consent of nearby communities. Whenever a new mine comes up, delegates from the herders' cooperatives and village councils tend to line up on one side and members from the south-coast towns, who care about jobs and welfare, on the other. The Way of the Elders broke away precisely because the party agreed to a new mine, and that episode is still a sensitive subject at any congress.\nAt the last election the party took 20 of the 71 seats on 18.8% of the vote and formed a four-party government with the Social Democratic Mutual Aid Labour Party, the Smelters' and Miners' Union Socialist Workers' Party and Greenvein, which together hold 40 seats, a majority. Its leader Nivikkaaq Tauvvuriaq became Premier, the party holds six of the eleven ministries, and the Speaker, Aniqsaaq Qaarsuk, is also from its ranks. At his inauguration Tauvvuriaq spoke an old saying in Tavrunaq: the ice cracks, but people stand together. The coalition is not a calm one. The Smelters' and Miners' Union Socialist Workers' Party wants to keep mine and smelter jobs and Greenvein wants more protected land, and Tauvvuriaq's answer has been to make community consent a formal procedure: every new project must first hold a hearing in the nearby villages and win a vote of the village council before it enters territorial approval. Supporters say the villages have for the first time a real voice when a mine comes; critics say approvals have become far too slow, and the Vault Party calls the procedure 'queueing under the ice'.\nThe party's electoral map is almost a map of where Tavrunaq is spoken, and it is especially secure in the reindeer pastures and the hunting and fishing villages. It holds the mayoralty or chair in eight of the territory's ten city-level units: the capital Nuqattaaq, Saarvaq and Ukkulaaq on the south coast, Qaurniq inland, Kiluktuar and Sirmivak on the north coast, Uviqsaaq, and the Tavrulit Indigenous Autonomous Region, where it holds 18 of the council's 41 seats. It is weakest in the Pallurniq Financial Zone, with one seat of 31. In Tullivaq its 7 seats trail the Vault Party's 8 and it governs as partner to a Vault mayor, so two parties at each other's throats in the territorial assembly have to pass the same budget in this south-coast city.\nThe slogan 'This land remembers us' refers to the hunting grounds, migration routes and stone cairns the ancestors left on the land. The party congress meets in a different village each time, with delegates arriving by sledge, fishing boat and small plane; the hall is usually the village school's gym, the host village cooks reindeer broth, and delegates bring sleeping bags and spend the night in the classrooms. On the day of the Return of the Light, when the polar night ends, the party's members of the assembly go home to their villages and climb to the high ground with their neighbours to wait for those few minutes of sun; by unwritten rule no one talks politics that day, and everyone listens to the elders' blessings."
    history:
      zh: "塔夫鲁利特人民党由几个驯鹿牧民合作社和村落议事会联合组建，最初的目标是在领地议会里为讲塔夫鲁纳克语的选民争取保留议席。保留议席设立后，它成为议会里的第一大党，此后一直站在北冰洋政坛的中心。它曾因同意开发一座新矿而失去一批长老，后者另立了长老之道。如今它领导四党联合政府，党首尼维卡克·陶武里亚克担任总理。"
      en: "The Tavrulit People's Party was formed by several reindeer herders' cooperatives and village councils, at first to win reserved seats in the territorial assembly for Tavrunaq-speaking voters. Once the reserved seats were set up it became the largest party in the assembly, and it has stood at the centre of Arctic Ocean politics ever since. Its agreement to a new mine once cost it a group of elders, who went on to found the Way of the Elders. Today it leads a four-party government, with its leader Nivikkaaq Tauvvuriaq as Premier."
    flag_notes:
      zh: "党旗靠旗杆的一侧是一条由红、深蓝、白三色构成的花纹带，旗面上是一条鲸尾。花纹带取自塔夫鲁利特人皮袍边缘的传统绣纹；鲸尾是鲸鱼潜入深海前露出水面的那一刻，象征以渔猎为生的祖辈，也象征沉下去的还会再浮上来。红色代表人，深蓝是极夜里的海，白色是冰雪。"
      en: "Along the hoist runs a patterned band in red, deep blue and white, and the field bears a whale's tail. The band is taken from the traditional embroidery on the hems of Tavrulit skin coats; the tail is the moment a whale shows itself before diving deep, standing for ancestors who lived by hunting and fishing, and for the promise that what goes under will rise again. Red stands for the people, deep blue for the sea in the polar night and white for ice and snow."
    factions:
      - names: { zh: "牧场派", en: "Pasture Wing" }
        notes: { zh: "以驯鹿牧民合作社和内陆村落议事会为根基，坚持「社区同意」不能打折，对新矿山和新港口最为警惕，主张优先保护迁徙路线和猎场。它与长老之道的距离最近，常被视为防止再次分裂的压舱石。", en: "Rooted in the reindeer herders' cooperatives and inland village councils, it insists community consent must not be watered down, is the most wary of new mines and harbours, and puts the migration routes and hunting grounds first. Closest of all to the Way of the Elders, it is seen as the ballast that keeps the party from splitting again." }
      - names: { zh: "南岸论坛", en: "South Coast Forum" }
        notes: { zh: "由首府和南岸城市里讲塔夫鲁纳克语的工薪阶层组成，最关心住房、就业、福利和双语学校，与社会民主互助工党关系密切，在矿山问题上更愿意以工作岗位换取让步。", en: "Tavrunaq-speaking working people in the capital and the south-coast towns, most concerned with housing, jobs, welfare and bilingual schools; close to the Social Democratic Mutual Aid Labour Party, it is readier to trade concessions on mines for jobs." }
      - names: { zh: "共同基金派", en: "Common Fund Group" }
        notes: { zh: "党内的务实谈判者，主张在严格的社区同意之下接受部分矿山和能源项目，用收入充实原住民共同基金，再把钱投进村落的宽带、学校和诊所。成员多是党的财政和政务干部。", en: "The party's pragmatic negotiators, who would accept some mines and energy projects under strict community consent and use the revenue to build up the common indigenous fund, then spend it on village broadband, schools and clinics. Many are the party's finance and government staff." }
    organisation:
      newspaper: { zh: "《苔原之声》", en: "Tundra Voice" }
      think_tank: { zh: "土地与记忆研究所", en: "Land and Memory Institute" }
      unions: { zh: "驯鹿牧民合作社联合会、北冰洋渔猎者协会", en: "Federation of Reindeer Herders' Cooperatives, Arctic Ocean Hunters' and Fishers' Association" }
      women: { zh: "塔夫鲁利特妇女会", en: "Tavrulit Women's Council" }

  - id: pty_1aej3q
    names: { zh: 长老之道, en: Way of the Elders }
    short_names: { zh: 长老, en: "Elders" }
    color: "#5B3A29"
    flag: { layout: border, colors: ["#5B3A29", "#E8D9B5", "#5B3A29"], charge: frame_drum, charge_color: "#E8D9B5" }
    spectrum: 1.3
    family: { zh: 原住民, en: Indigenous }
    ideology: [{ zh: 原住民传统主义, en: Indigenous traditionalism }, { zh: 社会保守主义, en: Social conservatism }, { zh: 自治主义, en: Self-rule }]
    axes: { econ: 5.0, galtan: 8.0, autonomy: 1.0, green: 2.5 }
    leader: { zh: 阿尔尼维克·苏卢尔塔克, en: Aarnivik Sullurtaq }
    members: 9000
    youth_wing: { zh: 火塘之子, en: Children of the Hearth }
    slogan: { zh: 先听长者，再问风雪, en: "Ask the elders first, then the blizzard" }
    policies:
      - { zh: 每个村落的长老议事会对土地使用有否决权, en: A veto over land use for every village's council of elders }
      - { zh: 传统狩猎和捕鲸不受配额限制, en: No quotas on traditional hunting and whaling }
      - { zh: 学校开设由长老授课的口述传统课, en: "Oral tradition lessons in schools, taught by elders" }
      - { zh: 限制酒类在村落里的销售, en: Limit the sale of alcohol in the villages }
    allies: [pty_6yj1xj, pty_ec1v2s]
    targets: { div_hpmerr: 6 }
    lean: { "lang:art-x-tavrunaq": 3.0, herding: 0.5, hunting: 0.5, old: 2.0, urban: -0.4 }
    roll: 2.6
    notes:
      zh: "长老之道（简称长老）是北冰洋讲塔夫鲁纳克语居民中的传统保守派，主张每个村落的长老议事会对土地使用有否决权、传统狩猎和捕鲸不受配额限制、学校开设由长老授课的口述传统课、限制村落里的酒类销售。它与塔夫鲁利特人民党争夺同一批选民：两党都主张原住民权利，但长老之道更看重传统，对矿山和新港口更为警惕，在税收和福利上又偏右。这几条主张合在一起，构成了它特有的张力：它要求领地政府少管村落的事，却又要求立法限制村落里的酒类销售；它反对新矿山，却与亲商的金库党结为友党，因为两党都主张低税、警惕领地政府越来越大的开支。党内有人把这种组合称作「冰上的两只脚」，一只踩在传统里，一只踩在自治里，哪一只陷下去都会摔倒。\n在上一次选举中，长老之道拿到百分之五点九的选票和六个议席，没有加入塔人党领导的联合政府，在议会中属于反对派。它没有在任何城市出任市长，但在塔夫鲁利特原住民自治区议事会四十一席中占七席，是自治区里不容忽视的少数。它的影响常常体现在别人的政策里：联合政府推行「社区同意」听证程序时，正是在长老之道的反复追问下，才把村落的长老议事会列为必须听取意见的一方；自治区的一些学校也已经请长老走进课堂。它的争议也不少：限制酒类销售的主张受到村里一些年轻人和小店主的抵制，他们认为这是把村民当孩子看；不设狩猎和捕鲸配额的要求，则遭到绿脉党和旅游业者的批评。长老之道的回答是，传统猎人取用多少向来由长老们商量决定，配额应当由村落自己来定，而不是由首府的办公室来定。\n它的选民集中在内陆牧区和偏远村落，年长者居多。在萨尔瓦克、乌库拉克和基卢克图阿尔三市的议会里，它各有四席；在首府努卡塔克的四十七席中却只有一席，在帕卢尔尼克金融特区则一席也没有。驯鹿迁徙路线经过的地方和靠海猎为生的村子，是它稳固的票仓，越靠近首府的暖廊和数据中心，它的票就越少。年轻人离村进城，是长老之道的一大心病，也是它至今没有找到答案的问题。\n党的集会总以一面框鼓开场，鼓声停下之前，没有人可以开口。党是由一群长老在一个冬天里坐着雪橇走访几十个村落建立起来的，至今每逢党代会之前，党首阿尔尼维克·苏卢尔塔克和总书记伊利维克·卡瓦卢克仍会分头乘雪橇去几个村落，听完各村的意见再回来起草决议。青年组织「火塘之子」的新成员，要在火塘边听长老讲完一段口述传统才算正式入会。口号「先听长者，再问风雪」也常被年轻党员半开玩笑地挂在嘴边，意思是遇到拿不准的事，先打电话问问家里的老人。回光节那天，长老们用塔夫鲁纳克语念诵祝词，台下的人群里总少不了长老之道的党员。"
      en: "The Way of the Elders (the Elders for short) is the traditional conservative party among the Arctic Ocean's Tavrunaq speakers. It wants every village's council of elders to have a veto over land use, no quotas on traditional hunting and whaling, lessons in oral tradition taught by elders in schools, and limits on the sale of alcohol in the villages. It competes with the Tavrulit People's Party for the same voters: both stand for indigenous rights, but the Elders set more store by tradition, are warier of mines and new harbours, and lean right on tax and welfare. Taken together these positions give the party a tension all its own. It wants the territorial government to keep out of village affairs, yet wants a law to limit alcohol sales in the villages; it opposes new mines, yet counts the pro-business Vault Party as an ally, because both want low taxes and distrust the territorial government's growing spending. Some members call this combination 'two feet on the ice', one planted in tradition and one in self-rule; if either sinks, you fall.\nAt the last election the Elders took 5.9% of the vote and six seats. They did not join the Tavrulit-led coalition and sit in opposition. They hold no mayoralty anywhere, but have 7 of the 41 seats on the Tavrulit Indigenous Autonomous Region's council, a minority no one there can ignore. Their influence often shows in other people's policies: when the coalition brought in its community consent hearings, it was after persistent questioning from the Elders that village councils of elders were named among the bodies that must be heard, and some schools in the autonomous region have already invited elders into the classroom. There is no shortage of controversy either. Some young villagers and shopkeepers resist the limits on alcohol, saying they treat villagers like children, and Greenvein and tourism operators criticise the demand for no hunting or whaling quotas. The Elders reply that traditional hunters have always decided together, with their elders, how much to take, and that any quota should be set by the village, not by an office in the capital.\nIts voters are concentrated in the inland pastures and remote villages, and most of them are older. It has four seats each on the councils of Saarvaq, Ukkulaaq and Kiluktuar, but only one of 47 in the capital Nuqattaaq and none at all in the Pallurniq Financial Zone. The places the reindeer migration routes cross and the villages that live by hunting at sea are its secure ground; the closer one gets to the capital's warm galleries and data centres, the thinner its vote. Young people leaving the villages for the towns is a constant worry for the Elders, and a problem to which they have yet to find an answer.\nThe party's meetings always open with a frame drum, and no one may speak before the drum falls silent. The party was built by a group of elders who spent a winter visiting dozens of villages by sledge, and to this day, before every congress, the leader Aarnivik Sullurtaq and the general secretary Ilivvik Kavvaaluk each travel by sledge to a few villages, hear what they have to say and come back to draft the resolutions. New members of the youth wing, Children of the Hearth, must sit by a hearth and hear an elder tell a piece of oral tradition to the end before they are fully admitted. Young members like to quote the slogan 'Ask the elders first, then the blizzard' half in jest, meaning that when you are unsure of something you first ring the old folk at home. On the day of the Return of the Light, when the elders recite their blessings in Tavrunaq, there are always Elders members in the crowd."
    history:
      zh: "长老之道由一群不满塔夫鲁利特人民党同意开发一座新矿山的长老创立。他们在一个冬天里坐着雪橇走访了几十个村落，在各村的火塘边讲述为什么土地不能随便交给矿山，回来时已经有了第一批党员。此后它一直以村落的长老议事会为根基，在领地议会和自治区议事会里为传统发声，与塔人党既是对手，也是友党。"
      en: "The Way of the Elders was founded by a group of elders unhappy that the Tavrulit People's Party had agreed to a new mine. They spent a winter visiting dozens of villages by sledge, explaining at each village hearth why the land should not be handed lightly to a mine, and came back with the party's first members. Ever since it has rested on the villages' councils of elders, speaking for tradition in the territorial assembly and the autonomous region's council, at once rival and ally of the Tavrulit People's Party."
    flag_notes:
      zh: "党旗由褐色和米色构成，靠旗杆的一侧是一条花纹带，旗面上是一面米色的框鼓。框鼓是长老之道集会开场用的鼓，也是回光节上鼓手敲响的皮鼓，象征长者的声音和村落的聚集。褐色是驯鹿皮和鼓框木头的颜色，米色是绷紧的鼓面，也是冬末苔原上枯草的颜色。"
      en: "The flag is brown and cream, with a patterned band along the hoist and a cream frame drum on the field. The frame drum is the one that opens the party's meetings and the skin drum the drummers beat at the Return of the Light, standing for the voice of the elders and the gathering of the village. Brown is the colour of reindeer hide and the drum's wooden frame; cream is the stretched drumskin, and the dry grass of the tundra at winter's end."
    factions:
      - names: { zh: "守村派", en: "Village Keepers" }
        notes: { zh: "党内最坚定的传统主义者，坚持长老议事会对土地使用的否决权和限制酒类销售，对与任何政府合作都十分谨慎。成员多是偏远村落的年长者和长老议事会成员。", en: "The party's firmest traditionalists, who hold fast to the elders' veto over land use and to limits on alcohol, and are very cautious about working with any government. Most are older people from remote villages and members of the councils of elders." }
      - names: { zh: "猎场论坛", en: "Hunting Grounds Forum" }
        notes: { zh: "由猎人、捕鲸者和驯鹿牧民组成，最关心配额、猎场和迁徙路线，主张由村落自定取用规则。在税收上它最接近金库党，也最反感首府对村落生计的管制。", en: "Hunters, whalers and reindeer herders, most concerned with quotas, hunting grounds and migration routes, who want each village to set its own rules on what may be taken. On tax it is closest to the Vault Party, and it resents the capital's regulation of village livelihoods most of all." }
      - names: { zh: "归村俱乐部", en: "Homecoming Club" }
        notes: { zh: "由进城工作后又回到村里的年轻党员组成，主张传统与宽带、学校并重，希望用口述传统课和村落就业把年轻人留住，对与塔人党合作持开放态度。", en: "Younger members who worked in the towns and came back to their villages, who want tradition alongside broadband and schools, hope oral tradition lessons and village jobs will keep young people at home, and are open to working with the Tavrulit People's Party." }
    organisation:
      newspaper: { zh: "《鼓声》", en: "The Drumbeat" }
      think_tank: { zh: "口述传统学会", en: "Oral Tradition Society" }
      unions: { zh: "内陆牧民互助会", en: "Inland Herders' Mutual Society" }
      women: { zh: "火塘妇女会", en: "Hearth Women's Circle" }

  - id: pty_ec1v2s
    names: { zh: 金库党, en: Vault Party }
    short_names: { zh: 金库, en: "Vault" }
    color: "#111827"
    flag: { layout: seal, colors: ["#111827", "#C9A227", "#111827"], charge: hexstar, charge_color: "#C9A227" }
    spectrum: 1.3
    family: { zh: 自由派, en: Liberal }
    ideology: [{ zh: 经济自由主义, en: Economic liberalism }, { zh: 财政保守主义, en: Fiscal conservatism }, { zh: 亲商主义, en: Pro-business }]
    axes: { econ: 8.5, galtan: 5.0, autonomy: 4.5, green: 7.5 }
    leader: { zh: 唐慕白, en: Tang Mubai }
    members: 8800
    youth_wing: { zh: 金库青年, en: Young Vault }
    slogan: { zh: 冰原上的金库，全民的红利, en: "A vault on the ice, a dividend for all" }
    policies:
      - { zh: 把帕卢尔尼克金融特区的税收优惠延长二十年, en: Extend the Pallurniq Financial Zone's tax breaks by twenty years }
      - { zh: 领地主权基金的收益每年向每位居民发放红利, en: "An annual dividend to every resident from the territory's sovereign fund" }
      - { zh: 数据中心的电价与水电成本挂钩, en: Peg data centre power prices to the cost of hydro power }
      - { zh: 外国专业人员三个月内获得工作许可, en: Work permits for foreign professionals within three months }
    allies: [pty_mak5vy, pty_ymxc2s]
    targets: { div_hpmerr: 14 }
    lean: { finance: 1.2, datacenter: 0.4, tech: 0.4, income: 0.8, "lang:en": 1.0 }
    notes:
      zh: "金库党（简称金库）是北冰洋的中右翼经济自由派，主张把帕卢尔尼克金融特区的税收优惠延长二十年、领地主权基金的收益每年向每位居民发放红利、数据中心的电价与水电成本挂钩、外国专业人员三个月内获得工作许可。党内最大的张力就藏在口号「冰原上的金库，全民的红利」里：它是财政保守的政党，主张少花钱、低税率，却又把全民红利当作招牌。红利是一笔每年都要发出去的现金，财政派担心它会变成谁也不敢削减的开支，红利派则认为，正是红利让金库党在金融特区以外也有人愿意听。另一重张力在主权基金本身：塔夫鲁利特人民党希望矿产和能源收入的一部分进入原住民共同基金，金库党希望它进入人人有份的主权基金，两种分法背后，是两种对「这片土地的收益该归谁」的回答。\n在上一次选举中，金库党以百分之十三点八的得票拿下十席，是北冰洋议会第二大党，党首唐慕白是反对党领袖。在议会里，它的主要武器是算账：每一笔新开支，金库党都会算出摊到每位居民头上是多少，再与当年的红利相比。每年发放红利的那一天，金库党的议员会在议会门口举着一块牌子，写着当年每人分到的数额。它对联合政府「社区同意」程序的批评——说审批慢得像「冰层下的排队」——在数据中心和矿业投资者中颇受欢迎，在村落里却让不少人反感。在地方上，它在帕卢尔尼克金融特区立法会三十一席中占二十三席，单独执政，行政长官出自金库党；在南岸的图利瓦克，它的市长与塔人党、社会民主互助工党联合执政，在领地议会里针锋相对的对手在这里一起审预算，这也让金库党在批评联合政府时多了几分分寸。\n金库党的选民集中在帕卢尔尼克金融特区和首府努卡塔克的商业区，外来的金融与科技从业者聚居的库马尔维克区和图维尔尤阿克区是它的票仓。银行、基金、数据中心和信息技术公司的员工，以英语为母语的居民和高收入者，是它的基本盘，首府市议会四十七席中它有八席。它在收入偏低的地区和讲塔夫鲁纳克语的村落最弱：在塔夫鲁利特原住民自治区议事会四十一席中只有两席，在萨尔瓦克、乌库拉克、考尔尼克、基卢克图阿尔、西尔米瓦克和乌维克萨克六市的议会里都只有三席。\n党名来自金融特区地下的一座数据金库，那里存放着几家大银行的备份服务器，冬天的余热用来给街区供暖；党员喜欢说，金库党的理念就是让钱和热都不白白散掉。党代会照例在一座数据中心的外厅举行，极夜里也温暖如春，代表们开玩笑说，这是领地里少有的不用穿外套开的党代会。金库青年每年办一场「红利计算大赛」，让中学生用公开的财政报表算出下一年每人能分到多少，算得最准的队伍可以到议会旁听一次预算辩论。"
      en: "The Vault Party (Vault for short) is the Arctic Ocean's centre-right economic liberal party. It wants the Pallurniq Financial Zone's tax breaks extended by twenty years, an annual dividend to every resident from the territory's sovereign fund, data centre power prices pegged to the cost of hydro power, and work permits for foreign professionals within three months. The party's deepest tension is hidden in its slogan, 'A vault on the ice, a dividend for all'. It is a fiscally conservative party that wants low spending and low taxes, yet its calling card is a universal dividend. The dividend is cash that must be paid out every year, and the fiscal wing fears it will become spending no one dares to cut; the dividend wing argues that it is precisely the dividend that gets Vault a hearing outside the financial zone. A second tension lies in the sovereign fund itself: the Tavrulit People's Party wants part of the mining and energy revenue in a common indigenous fund, Vault wants it in a sovereign fund in which everyone has a share, and behind the two formulas lie two answers to the question of whom the land's wealth should go to.\nAt the last election Vault won 10 seats on 13.8% of the vote, making it the second party in the Arctic Ocean assembly, and its leader Tang Mubai is Leader of the Opposition. In the assembly its main weapon is arithmetic: for every new item of spending Vault works out what it costs each resident and sets that against the year's dividend. On the day the dividend is paid each year its members stand at the assembly door with a placard showing what each resident got. Its attack on the coalition's community consent procedure, which it says makes approvals as slow as 'queueing under the ice', goes down well with data centre and mining investors but annoys many people in the villages. Locally it holds 23 of the 31 seats on the Pallurniq Financial Zone's legislative council and governs alone, with a Vault chief executive; in Tullivaq on the south coast its mayor governs with the Tavrulit People's Party and the Social Democratic Mutual Aid Labour Party, so opponents who clash in the territorial assembly pass budgets together there, which lends Vault a certain restraint when it criticises the coalition.\nVault's voters are concentrated in the Pallurniq Financial Zone and the business district of the capital, Nuqattaaq, and its strongholds are Qummarvik and Tuvvirjuaq, where the incoming finance and technology workers live. Staff of banks, funds, data centres and IT firms, native English speakers and high earners are its core, and it holds 8 of the 47 seats on the capital's council. It is weakest in poorer areas and in the Tavrunaq-speaking villages: 2 of the 41 seats on the Tavrulit Indigenous Autonomous Region's council, and only three seats each on the councils of Saarvaq, Ukkulaaq, Qaurniq, Kiluktuar, Sirmivak and Uviqsaaq.\nThe name comes from a data vault beneath the financial zone that holds several big banks' backup servers, whose waste heat warms the neighbourhood in winter; members like to say the party's whole idea is to let neither money nor heat go to waste. The party congress is held in the outer hall of a data centre, as warm as spring even in the polar night, and delegates joke that it is one of the few congresses in the territory where no one needs a coat. Every year Young Vault runs a 'dividend reckoning contest' in which secondary-school pupils use the published public accounts to work out next year's dividend per head, and the most accurate team wins a seat in the gallery for a budget debate."
    history:
      zh: "金库党由金融特区的几位基金经理和数据中心工程师创立，起因是一项要取消金融特区税收优惠的议案。议案被否决后，他们认为不能每次都靠游说过关，决定组党参选。金库党从特区的立法会起步，先在特区里赢得多数，再进入领地议会，逐渐成长为领地议会的第二大党和主要反对党。"
      en: "The Vault Party was founded by a few fund managers and data centre engineers in the financial zone, in response to a bill to scrap the zone's tax breaks. When the bill was defeated they concluded that they could not rely on lobbying every time, and decided to form a party and stand. Starting in the zone's legislative council, Vault first won a majority there, then entered the territorial assembly, and grew into its second party and the main opposition."
    flag_notes:
      zh: "党旗是一枚圆形印章，黑底上是一颗金色六角星。印章象征金库的封条和契约的信用，六角星既像金库门上的密码转盘，也像一片雪花，雪花本来就是六个角的。黑色是极夜，也是机房里一排排的服务器；金色是红利和财富，也是极夜里机房窗口透出的灯光。"
      en: "The flag is a round seal with a gold six-pointed star on black. The seal stands for the vault's seal and the good faith of a contract; the six-pointed star looks both like the combination dial on a vault door and like a snowflake, which has six points of its own. Black is the polar night and the rows of servers in the machine halls; gold is the dividend and wealth, and the light from machine-hall windows in the long dark."
    factions:
      - names: { zh: "红利派", en: "Dividend Wing" }
        notes: { zh: "把全民红利视为党的立身之本，主张红利逐年提高，并用它向金融特区以外的选民争取支持。成员多是年轻党员和首府商业区以外的支持者，是金库党走向大众的推手。", en: "Treats the universal dividend as the party's foundation, wants it raised year by year and uses it to win voters beyond the financial zone. Many members are young or come from outside the capital's business district, and they are the force pushing Vault towards a wider public." }
      - names: { zh: "平衡账簿俱乐部", en: "Balanced Books Club" }
        notes: { zh: "党内的财政保守派，主张红利必须与主权基金的实际收益挂钩，反对任何形式的赤字，对扩大开支的承诺一概存疑。成员多是金融特区的基金经理和银行从业者。", en: "The party's fiscal conservatives, who insist the dividend must track the sovereign fund's actual returns, oppose deficits of any kind and treat every spending promise with suspicion. Most are fund managers and bankers from the financial zone." }
      - names: { zh: "算力论坛", en: "Compute Forum" }
        notes: { zh: "由数据中心和信息技术行业的工程师组成，最关心电价、水电供应和外国专业人员的工作许可，对冰原生态问题比党内其他人更愿意妥协。", en: "Engineers from data centres and the IT industry, most concerned with power prices, hydro supply and work permits for foreign professionals, and readier than the rest of the party to compromise on the ecology of the ice." }
    organisation:
      newspaper: { zh: "《金库周报》", en: "The Vault Weekly" }
      think_tank: { zh: "极地资本研究所", en: "Polar Capital Institute" }
      unions: { zh: "北冰洋数据中心从业者协会", en: "Arctic Ocean Data Centre Professionals' Association" }
      women: { zh: "金库女性论坛", en: "Vault Women's Forum" }

  - id: pty_18qa5s
    names: { zh: 冶炼与矿山工会社会主义工人党, en: "Smelters' and Miners' Union Socialist Workers' Party" }
    short_names: { zh: 冶工, en: "Smelters" }
    color: "#8E2C1C"
    flag: { layout: banner, colors: ["#8E2C1C"], charge: gear_hammer, charge_color: "#F2A541" }
    spectrum: -1.8
    family: { zh: 激进左翼, en: Radical left }
    ideology: [{ zh: 工团主义, en: Syndicalism }, { zh: 社会主义, en: Socialism }, { zh: 劳工主义, en: Labourism }, { zh: 工业民主, en: Industrial democracy }]
    axes: { econ: 1.0, galtan: 6.0, autonomy: 6.0, green: 8.0 }
    leader: { zh: 杜铁成, en: Du Tiecheng }
    members: 14000
    youth_wing: { zh: 冶炼青年, en: Young Smelters }
    slogan: { zh: 炉火不灭，饭碗不丢, en: "While the furnace burns, no one loses work" }
    policies:
      - { zh: 矿山和冶炼厂的工人在董事会占三分之一席位, en: A third of the board seats at mines and smelters for their workers }
      - { zh: 冶炼厂改用水电和绿氢，但不裁员, en: "Move the smelters to hydro power and green hydrogen, without lay-offs" }
      - { zh: 矿工的退休年龄提前到五十五岁, en: Retirement at fifty-five for miners }
      - { zh: 矿区城市的住房由领地统一建设, en: Territorial building of housing in the mining towns }
    allies: [pty_jh513z, pty_6yj1xj]
    targets: { div_hpmerr: 9 }
    lean: { mining: 1.0, manufacturing: 0.8, port: 0.3, income: -0.4 }
    notes:
      zh: "冶炼与矿山工会社会主义工人党（简称冶工）是北冰洋领地由工会直接组建的激进左翼政党，党员一万四千人。它原名冶炼工会党，后来把「矿山」「社会主义」「工人」都写进了党名：矿工们说，党名里只有冶炼厂，等于说矿井里的人只是给炉子供料的；「社会主义」一词则是党内左翼争来的，他们担心党入阁之后只剩下讨价还价的工会习气。冶工的思想底色是工团主义：工厂应当由在炉前干活的人管理，政党不过是工会伸进议会的一只手。可它同时又是一个劳工主义的政党，要的是饭碗、退休金和住房，而非抽象的所有制革命。「炉火不灭，饭碗不丢」这句口号把两种气质捏在了一起——炉火是工业民主的象征，饭碗是工人最实际的盘算。\n上一次选举，冶工得票8.9%，在北冰洋领地议会71席中拿到6席，加入塔夫鲁利特人民党领导、社会民主互助工党和绿脉党共同参加的四党联合政府，在十一个部里分得一个。党首杜铁成在总理尼维卡克·陶武里亚克的政务院里主管工业与劳动事务。入阁让冶工站到了自己口号的对面：冶炼厂改用水电和绿氢本是冶工自己的主张，但每一座电解槽的投产都伴随着岗位重组的谈判。杜铁成坚持「换能源不换人」，把转岗培训和工龄保留写进了每一份转型协议，矿区工会因此叫他「炉前部长」；可是矿工五十五岁退休的承诺一直卡在预算里，绿脉党催促更快关停燃煤炉，互助的财政官员又嫌工人占董事会三分之一的方案会吓跑投资，冶工在内阁会议上常常是以一对二。党内批评者说杜铁成「把罢工纠察线搬进了会议室，却忘了带上纠察队」。\n冶工的票仓在矿山与冶炼城市。考尔尼克市议会37席中它占8席，是它在各市议会中议席最多的地方，它在那里与塔人党、绿脉党一起执政；在乌维克萨克市议会它占6席，执政格局相同；在乌库拉克也有5席。港口城市的码头工人投它的不少，因为矿石和金属锭要从那里装船。它的弱点同样清楚：收入较高的选民很少投它，帕卢尔尼克金融特区的立法会里没有它的议席；在塔夫鲁利特原住民自治区议事会41席中它只有2席，在那里，新矿口的规划要与土地和狩猎的用途反复协商，这也是冶工与盟友塔人党之间最需要小心的话题。冶工在生态与增长之间明显偏向增长，在社会议题上偏于持重，它的选民是倒班的工人家庭，关心夜班补贴和学校班车多于城市里的文化之争。\n冶工的政治文化带着车间的味道。党员证是一块用本地冶炼厂的铜铸成的小铜牌，背面刻着持有人的工号；党代会按班次开，表决时举起安全帽代替举手。党旗是铁锈红的旗面上一个琥珀色的齿轮，齿轮中间一把锤子：红是炉膛里铁水的颜色，琥珀是极夜里烟囱灯火的颜色。每到一年中极夜最深的那几天，各地支部会在冶炼厂门口点一盆炉火守到天亮，叫作「守炉夜」，党首和总书记阿尼克萨克·帕卢尔纳克要轮流到各厂去守。"
      en: "The Smelters' and Miners' Union Socialist Workers' Party (the Smelters for short) is a radical-left party built directly by the Arctic Ocean Territory's unions, with 14,000 members. It was once simply the Smelters' Union, and later wrote 'miners', 'socialist' and 'workers' into its name. The miners had complained that a name with only smelters in it made the people underground sound like suppliers to the furnaces; 'socialist' was won by the party's left, who feared that office would leave nothing but a union's habit of haggling. The party's underlying creed is syndicalism: works should be run by the people at the furnace, and the party is no more than the union's hand reaching into the assembly. Yet it is also a labourist party that wants jobs, pensions and homes rather than an abstract revolution in ownership. Its slogan, 'While the furnace burns, no one loses work', binds the two temperaments together: the furnace stands for industrial democracy, the job for the worker's most practical reckoning.\nAt the last election the Smelters won 8.9% and 6 of the Arctic Ocean assembly's 71 seats, and joined the four-party government led by the Tavrulit People's Party with Social Democratic Mutual Aid Labour and Greenvein, taking one of its eleven ministries. The leader, Du Tiecheng, runs industry and labour in Premier Nivikkaaq Tauvvuriaq's cabinet. Office has put the party on the far side of its own slogan: moving the smelters to hydro power and green hydrogen was the party's own policy, but every new electrolyser comes with a negotiation over reorganised jobs. Du insists on 'new energy, same workers' and has written retraining and protected seniority into every transition agreement, which earned him the name 'the furnace-floor minister' in the mining unions. But retirement at fifty-five for miners is still stuck in the budget, Greenvein presses for faster closure of the coal furnaces, and Mutual Aid's finance officials worry that a third of the board seats for workers will frighten off investment, so the Smelters often find themselves one against two at the cabinet table. Critics inside the party say Du 'brought the picket line into the meeting room and left the pickets outside'.\nThe Smelters' vote lies in the mining and smelting cities. They hold 8 of Qaurniq's 37 council seats, their largest group on any city council, and govern there with the Tavrulit People's Party and Greenvein; they hold 6 seats in Uviqsaaq, which has the same coalition, and 5 in Ukkulaaq. Plenty of dockers in the port cities vote for them too, since the ore and ingots are shipped from there. Their weaknesses are just as plain: better-off voters seldom back them, and they have no seat on the legislative council of the Pallurniq financial district. They hold only 2 of the 41 seats on the Tavrulit Indigenous Autonomous Region's council, where every plan for a new mine has to be negotiated again and again against the land's use for hunting, and this is the subject the party treads most carefully around with its ally the Tavrulit People's Party. Between ecology and growth the Smelters lean clearly towards growth, and on social questions they are steady rather than adventurous; their voters are shift-working families who care more about night-shift pay and school buses than about the cities' culture wars.\nThe party's political culture smells of the works floor. A member's card is a small plate cast from the local smelter's copper, with the holder's works number stamped on the back. Congress sits in shifts, and votes are taken by raising hard hats rather than hands. The flag shows an amber gear with a hammer inside it on a rust-red field: the red of molten metal in the furnace, the amber of the chimney lights in the polar night. In the darkest days of the polar night each branch lights a brazier at the smelter gates and keeps it burning till morning, the 'furnace watch', and the leader and the general secretary, Aniqsaaq Pallurnaq, take turns sitting it out at different works."
    history:
      zh: "冶炼与矿山工会社会主义工人党起于一场长达一个月的罢工：一座冶炼厂计划关闭，几家冶炼厂的工会联合停工声援，矿山的工人也停止了向这座冶炼厂供矿。罢工最终保住了那座冶炼厂，工会的领头人却意识到，厂子的生死是在议会和政务院里决定的，于是以几家工会为骨架组建了冶炼工会党。矿工工会后来作为平等的一方加入，党也随之改为现名，把矿山、社会主义和工人写进了党名。党章至今规定，每个地方支部都必须以一个工会分会为基础成立。"
      en: "The party grew out of a month-long strike over the planned closure of a smelter: the unions of several smelters walked out in support, and the miners stopped sending ore to the threatened works. The strike saved the smelter, but its leaders realised that the fate of the works was decided in the assembly and the cabinet, so they built the Smelters' Union party on the frame of their unions. The miners' unions later joined as equal partners, and the party took its present name, writing mining, socialism and workers into it. Its rules still require every local branch to be founded on a union branch."
    flag_notes:
      zh: "党旗是一面铁锈红的旗面，中央是一个琥珀色的齿轮，齿轮里嵌着一把锤子。铁锈红取自炉膛里铁水和矿石的颜色，琥珀色是极夜里冶炼厂烟囱的灯火。齿轮代表工厂与机器，锤子代表亲手干活的人；把锤子放在齿轮之内，意思是工人不在机器之外，而在机器的中心。这面旗是改名时由旧的工会旗改出来的，保留了旧旗的底色。"
      en: "The flag is a rust-red field with an amber gear in the centre and a hammer set inside it. The red is the colour of molten metal and ore, the amber the glow of the smelter chimneys in the polar night. The gear stands for the works and its machines, the hammer for the people who do the work with their hands; placing the hammer inside the gear says that workers are not outside the machine but at its heart. The design was adapted from the old union banner when the party was renamed, and keeps its field colour."
    factions:
      - names: { zh: "炉前派", en: "Furnace Floor" }
        notes: { zh: "工团主义的老班底，主张把工人董事从三分之一提高到一半，必要时以罢工推动立法，对入阁始终保持怀疑。代表冶炼厂的老工人和工会分会干部，在考尔尼克的支部里势力很大。", en: "The old syndicalist core, who want worker directors raised from a third of the board to half and are ready to strike to push legislation, and who have always been sceptical of office. They speak for veteran smelter workers and union branch officers, and are strong in the Qaurniq branches." }
      - names: { zh: "政务院派", en: "Cabinet Wing" }
        notes: { zh: "支持杜铁成的入阁路线，认为在联合政府里把转岗培训、住房和退休条款一项项写进协议，比街头抗争更有效。代表工会的谈判干部和各市的市议员。", en: "Supporters of Du Tiecheng's course in government, who believe that writing retraining, housing and retirement terms into agreements one by one achieves more than protest in the street. They speak for the unions' negotiators and the party's city councillors." }
      - names: { zh: "绿氢转型圈", en: "Green Hydrogen Circle" }
        notes: { zh: "年轻的技术工人和工程师，主张主动拥抱水电和绿氢，用新工厂换来新岗位，愿意与绿脉党密切合作，但坚持不裁员的底线。", en: "Younger technicians and engineers who want the party to embrace hydro power and green hydrogen and trade old works for new jobs, and who are happy to work closely with Greenvein while holding the line on no lay-offs." }
    organisation:
      newspaper: { zh: "《炉火报》", en: "The Furnace" }
      think_tank: { zh: "工业民主研究所", en: "Institute for Industrial Democracy" }
      unions: { zh: "北冰洋冶炼工人工会、北冰洋矿工工会", en: "Arctic Ocean Smelter Workers' Union, Arctic Ocean Mineworkers' Union" }
      women: { zh: "矿区妇女委员会", en: "Mining Towns Women's Committee" }

  - id: pty_4ahf45
    names: { zh: 北岸联盟, en: North Shore Alliance }
    short_names: { zh: 北岸, en: "North Shore" }
    color: "#5DA9E9"
    flag: { layout: horizon, colors: ["#0E2A47", "#FFFFFF"], edge: fjord, charge: snowflake, charge_color: "#5DA9E9" }
    spectrum: 0.2
    family: { zh: 地区主义, en: Regionalist }
    ideology: [{ zh: 地方主义, en: Localism }, { zh: 偏远地区发展, en: Remote development }, { zh: 中间主义, en: Centrism }]
    axes: { econ: 5.0, galtan: 5.5, autonomy: 2.0, green: 6.0 }
    leader: { zh: 萨基亚克·努努维克, en: Saqqiaq Nunnuvik }
    members: 2700
    youth_wing: { zh: 北岸青年, en: North Shore Youth }
    slogan: { zh: 冰封的海岸也要通航, en: Even a frozen coast needs ships }
    policies:
      - { zh: 北部海岸冬季每周至少一班破冰补给船, en: At least one icebreaking supply ship a week to the north coast in winter }
      - { zh: 极夜期间北岸居民的电费减半, en: Half-price electricity for north-coast residents during the polar night }
      - { zh: 北岸各镇的诊所配备远程医疗设备和医疗直升机, en: Telemedicine and air ambulances for the north-coast towns' clinics }
      - { zh: 北岸港口的渔获优先在本地加工, en: North-coast catches processed locally first }
    allies: [pty_x004cm, pty_6yj1xj]
    targets: { div_hpmerr: 4 }
    lean: { lat: 0.35, urban: -0.5, fishing: 0.4 }
    notes:
      zh: "北岸联盟代表北冰洋领地最北部海岸的居民。那里的小镇每年冬天要经历几十天的极夜，海面封冻，补给全靠破冰船和飞机；到了夏天渔船出海，捕上来的鱼却多半运到南方的大港去加工。联盟的主张因此都很具体：冬季每周至少一班破冰补给船，极夜期间北岸居民的电费减半，北岸各镇的诊所配备远程医疗设备和医疗直升机，北岸港口的渔获优先在本地加工。它自称中间派的地方主义政党，在经济上不左不右，在领地自治与中央统筹之间却站得很明确：北岸的事情应当在北岸决定。党名里的「联盟」并非虚词——它最初就是几个小镇居民委员会的联合，党章至今规定，每个北岸小镇无论人口多少，在党代会上都有同样多的代表。\n这种结构带来了联盟内部根本的张力。一边是「破冰船优先」的务实路线：只要补给船、电费和诊所能落实，跟哪个政府谈都可以；另一边是自治路线，要求北岸设立自己的地区议事机构，掌握本地的渔业配额和港口收入。前者担心后者会把一个替小镇争预算的党变成一个画地图的党，后者则认为年年在议会里讨价还价，等于年年向南方伸手。联盟在生态与增长之间略偏增长，欢迎新的港口和加工厂，却对远洋拖网船队进入北岸渔场格外警惕，这让它在渔业问题上时常与较大的政党意见相左。小镇的人口在减少，年轻人去南方读书后很少回来，联盟的每一份纲领都在回答同一个问题：怎样让留下来的人过得不比走掉的人差。\n上一次选举，北岸联盟得票4.0%，在北冰洋领地议会71席中拿到2席。它不在塔夫鲁利特人民党领导的四党政府里，却与塔人党互为友党，在许多预算表决上是总理尼维卡克·陶武里亚克可以争取的票。联盟的两位议员以「一张清单」出名：每次预算谈判他们只带一张纸，上面列着北岸各镇当年最缺的东西，谈下一项就划掉一项。破冰补给船的加班航次和诊所的远程医疗设备都曾写在这张纸上并被划掉；电费减半却一直没有完整实现，只在最冷的几周打了折扣，党内常拿这件事自嘲。它的另一个友党渔农党在北冰洋领地议会里没有议席，两党在渔获本地加工上立场一致，北岸联盟的议员常常替两党一起说话。\n联盟的选民地理几乎就是一张纬度图：越往北、越靠海、越是渔业小镇，它的票越多；在南部和城市选民中，它的支持很薄。它在基卢克图阿尔和西尔米瓦克市议会各有3席，是它在各市议会中议席最多的地方，在图利瓦克市议会和塔夫鲁利特原住民自治区议事会各有2席，在努卡塔克和乌库拉克市议会则没有议席。党旗是深蓝色的夜空压在白色的峡湾海岸上，夜空中一枚浅蓝色的雪花。联盟的党代会在每年极夜结束后的第一个晴天召开，代表们先一起到海边看太阳重新升起，再进会场；如果那天云又压了下来，会议就顺延。口号「冰封的海岸也要通航」最早用油漆写在一艘渔船的船舷上，补给船停航的那个冬天，这艘船在冰缝之间跑了一趟又一趟。"
      en: "The North Shore Alliance speaks for the people of the Arctic Ocean Territory's northernmost coast. Its towns go through weeks of polar night each winter while the sea freezes and supplies come only by icebreaker and aircraft; in summer the fishing boats go out, but most of the catch is shipped south to be processed in the big ports. So the Alliance's demands are concrete: at least one icebreaking supply ship a week in winter, half-price electricity for north-coast residents during the polar night, telemedicine equipment and air ambulances for the north-coast clinics, and north-coast catches processed locally first. It calls itself a centrist regionalist party, neither left nor right on the economy, but very clear on the question of self-government versus central planning: the north coast's business should be settled on the north coast. The 'alliance' in its name is meant literally. It began as a union of several towns' residents' committees, and its rules still give every north-coast town, whatever its size, the same number of delegates at congress.\nThat structure creates the Alliance's basic tension. On one side is the practical line of 'icebreakers first': as long as the ships, the power bills and the clinics are delivered, it will deal with any government. On the other is the autonomist line, which wants a regional council for the north coast with control of local fishing quotas and harbour revenue. The first camp fears the second will turn a party that fights for small towns' budgets into a party that draws maps; the second thinks that bargaining in the assembly every year means holding out a hand to the south every year. Between ecology and growth the Alliance leans slightly towards growth, welcoming new harbours and processing plants, but it is wary of deep-sea trawler fleets entering north-coast waters, which often sets it against larger parties on fisheries. The towns are shrinking, and the young who go south to study rarely come back, so every Alliance programme tries to answer the same question: how to make sure those who stay are no worse off than those who leave.\nAt the last election the Alliance won 4.0% and 2 of the Arctic Ocean assembly's 71 seats. It is not part of the four-party government led by the Tavrulit People's Party, but the two are allies, and on many budget votes it is a vote Premier Nivikkaaq Tauvvuriaq can win over. Its two members are known for 'the list': they bring a single sheet of paper to every budget negotiation, listing what the north-coast towns most need that year, and cross off each item as it is won. Extra icebreaker sailings and telemedicine for the clinics have both appeared on that sheet and been crossed off; half-price electricity has never been fully delivered, only a discount in the coldest weeks, and the party often jokes at its own expense about it. Its other ally, the Fishers and Farmers Party, has no seat in the Arctic Ocean assembly; the two agree on processing catches locally, and the Alliance's members often speak for both.\nThe Alliance's electoral map is almost a map of latitude: the further north, the nearer the sea and the more a town lives by fishing, the more votes it gets, while its support among southern and urban voters is thin. It holds 3 seats each on the Kiluktuar and Sirmivak councils, its largest groups on any city council, 2 each on the Tullivaq council and the Tavrulit Indigenous Autonomous Region's council, and none on the Nuqattaaq or Ukkulaaq councils. Its flag shows a deep-blue night sky over a white fjord coast, with a pale-blue snowflake in the sky. Its congress meets on the first clear day after the polar night ends each year, and the delegates first go down to the shore together to watch the sun come back before going inside; if the cloud closes in again, the congress waits. The slogan 'Even a frozen coast needs ships' was first painted on the side of a fishing boat that ran trip after trip through the cracks in the ice in the winter the supply ship stopped."
    history:
      zh: "北岸联盟起于一个冬天：那年的破冰补给船因故障停航了一个月，北岸几个小镇的居民自发组织起来，用渔船和雪地车运送补给，镇与镇之间靠无线电排班。危机过去后，各镇的居民委员会决定不再散伙，联合组成了一个政党，取名北岸联盟，并把那个冬天的经验写成了第一份纲领：补给、电力、医疗和渔获。党内至今把那个冬天称作「自救的冬天」，每次党代会开幕都要先念一遍当年的无线电排班表。"
      en: "The Alliance began in a winter when the icebreaking supply ship broke down for a month. The people of several north-coast towns organised themselves to bring in supplies by fishing boat and snowmobile, drawing up a rota between the towns by radio. When the crisis was over, the towns' residents' committees decided not to disband and joined to form a party, the North Shore Alliance, turning that winter's experience into their first programme: supplies, power, health care and the catch. The party still calls it 'the winter we saved ourselves', and every congress opens with a reading of that winter's radio rota."
    flag_notes:
      zh: "党旗分上下两部分：上方是深蓝色的夜空，下方是白色的冰雪海岸，分界线两侧高、中间凹下，像一道切进海岸的峡湾。夜空正中是一枚浅蓝色的雪花。深蓝代表漫长的极夜，白色代表封冻的海面和积雪，雪花是北岸冬天的标志，也寓意每个小镇像雪花的一瓣，各不相同，又连在一起。"
      en: "The flag is divided into a deep-blue night sky above and a white coast of snow and ice below, the line between them rising at both sides and dipping in the middle like a fjord cutting into the shore. A pale-blue snowflake sits in the middle of the sky. The deep blue is the long polar night, the white the frozen sea and snow; the snowflake is the emblem of the north-coast winter, and its arms stand for the towns, each different and all joined."
    factions:
      - names: { zh: "清单派", en: "The List" }
        notes: { zh: "主张把精力集中在补给船、电费和诊所这些具体项目上，与任何政府逐项谈判，换取北岸的预算。代表小镇的镇议员和诊所、学校的工作人员，是党内的主流。", en: "The mainstream, who want to concentrate on concrete things like supply ships, power bills and clinics and bargain item by item with any government for the north coast's budget. They speak for town councillors and the staff of clinics and schools." }
      - names: { zh: "北岸自治论坛", en: "North Shore Autonomy Forum" }
        notes: { zh: "主张设立北岸地区议事机构，掌握本地渔业配额、港口收入和能源项目的审批，认为年年讨价还价不是长久之计。代表年轻一代和回乡工作的大学毕业生。", en: "Advocates of a regional council for the north coast with control of local fishing quotas, harbour revenue and the approval of energy projects, who think bargaining every year is no long-term answer. They speak for the younger generation and graduates who have come home to work." }
      - names: { zh: "渔港合作圈", en: "Fishing Harbour Circle" }
        notes: { zh: "渔民和加工厂工人，关心渔获本地加工、冷库和渔港建设，与渔农党关系密切，对远洋拖网船进入北岸渔场尤其警惕。", en: "Fishers and processing workers who care about local processing, cold stores and harbour building, close to the Fishers and Farmers Party and especially wary of deep-sea trawlers in north-coast waters." }
    organisation:
      newspaper: { zh: "《北岸通讯》", en: "North Shore Dispatch" }
      think_tank: { zh: "偏远地区发展研究中心", en: "Centre for Remote Development" }
      unions: { zh: "北岸渔民合作社", en: "North Shore Fishers' Cooperative" }
      women: { zh: "北岸妇女会", en: "North Shore Women's Association" }

