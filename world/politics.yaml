      - { zh: 领地主权基金的收益每年向每位居民发放红利, en: "An annual dividend to every resident from the territory's sovereign fund" }
      - { zh: 数据中心的电价与水电成本挂钩, en: Peg data centre power prices to the cost of hydro power }
      - { zh: 外国专业人员三个月内获得工作许可, en: Work permits for foreign professionals within three months }
    allies: [pty_mak5vy, pty_ymxc2s]
    targets: { div_hpmerr: 14 }
    lean: { finance: 1.2, datacenter: 0.4, tech: 0.4, income: 0.8, "lang:en": 1.0 }
    notes:
      zh: "金库党是北冰洋的中右翼经济自由派，选民集中在帕卢尔尼克金融特区和首府的商业区，多是银行、基金和数据中心的从业者。它主张延长金融特区的税收优惠，用领地主权基金的收益每年给每位居民发一笔红利，让数据中心的电价与水电成本挂钩，加快外国专业人员的工作许可。党名来自金融特区地下的一座数据金库，那里存放着几家大银行的备份服务器，冬天的余热用来给街区供暖。金库党是北冰洋议会的第二大党和最大的反对党，在帕卢尔尼克金融特区的议会里占了大半议席，特区的首长也出自金库党。每年发放红利的那一天，金库党的议员会在议会门口举着一块牌子，写着当年每人分到的数额。"
      en: "The Vault Party is the Arctic Ocean's centre-right economic liberal party, its voters concentrated in the Pallurniq Financial Zone and the capital's business district, many of them working in banks, funds and data centres. It wants the zone's tax breaks extended, an annual dividend to every resident from the territory's sovereign fund, data centre power prices pegged to the cost of hydro power, and faster work permits for foreign professionals. Its name comes from a data vault beneath the financial zone that holds several big banks' backup servers, whose waste heat warms the neighbourhood in winter. The Vault Party is the second party in the Arctic Ocean assembly and the main opposition; it holds most of the seats on the Pallurniq Financial Zone's council, and the zone's head is a Vault member. On the day the dividend is paid each year, its members stand at the assembly door with a placard showing what each resident got."
    history:
      zh: "金库党由金融特区的几位基金经理和数据中心工程师创立，起因是一项要取消金融特区税收优惠的议案。议案被否决后，他们决定组党参选。"
      en: "The party was founded by a few fund managers and data centre engineers in the financial zone, in response to a bill to scrap its tax breaks. When the bill was defeated, they decided to form a party and stand."

