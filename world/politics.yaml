    policies: [{"zh": "王室开支由议会每年审议，王室财产公开", "en": "Have parliament examine royal spending every year and publish the royal estate"}, {"zh": "离岸服务业加强反洗钱审查", "en": "Tighten money-laundering checks on offshore services"}, {"zh": "免费的公立托儿所和学前教育", "en": "Free public nurseries and pre-school"}, {"zh": "难民可以在一年内获得工作许可", "en": "Give refugees a work permit within a year"}]
