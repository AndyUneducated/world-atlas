      div_24d8z4:  # Kilanu, the special autonomous city
        type: legco
        names: { zh: 立法会, en: Legislative Council }
        mayor: { zh: 行政长官, en: Chief Executive }
        deputy_mayor: {zh: "政务司司长", en: "Chief Secretary for Administration"}
        speaker: { zh: 立法会主席, en: President of the Legislative Council }
        lead: pty_09zrw1
        notes:
          zh: "基拉努特别自治市依《基拉努特别自治市宪章》治理。宪章由领地议会通过，修改须经立法会三分之二多数和领地议会同时同意。立法会 57 席，全市一个选区，按得票比例分配；行政长官由立法会选出，再提名行政会议的成员，每年向立法会作两次施政报告。和其他城市相比，基拉努多了几项自己的权力：自定企业所得税、研发抵免和产业园的工业用地租金；在领地每年的移民配额之内，自行审批工程师和研究人员的居留许可；基拉努港和基拉努国际机场是保税区，芯片、晶圆和设备进出不必逐票报关；城市规划、供电、供水和产业园的超纯水厂也由市里自己管。领地的全民基本收入、全民医保、免费教育、劳动法和环境标准在这里照常适用，宪章写明市里不能拿这些标准去换更低的税。现任行政长官出自公地共产党，与互助、绿脉和复兴组成市政联盟；芯片海岸党在立法会里有 6 席，是它在各城市议会中最多的一处。"
          en: "The Special Autonomous City of Kilanu is governed under the Kilanu Charter. The Territorial Assembly passed the charter, and amending it takes a two-thirds majority of the Legislative Council together with the consent of the Territorial Assembly. The Council has 57 seats, elected across the whole city in proportion to the vote; it chooses the Chief Executive, who names the members of the Executive Council and reports to the Council twice a year. Kilanu has several powers that other cities lack: it sets its own corporate income tax, research credits and the ground rent of the industrial park; it grants residence permits to engineers and researchers itself, within the territory's yearly immigration quota; Kilanu Port and Kilanu International Airport are a bonded zone, so chips, wafers and equipment pass in and out without a customs entry for each consignment; and the city runs its own planning, power and water, the park's ultrapure-water plant among them. The territory's universal basic income, public health insurance, free education, labour law and environmental standards apply here as everywhere, and the charter says the city may not trade any of them for lower taxes. The present Chief Executive comes from the Commons Communist Party, which governs with Mutual Aid, Greenvein and Renewal; the Chip Coast Party holds 6 seats, more than on any other city council."
      div_xp7ha2:  # Kirumai, a commonwealth of six islands
        names: { zh: 联合邦议会, en: Commonwealth Assembly }
        mayor: { zh: 首席部长, en: Chief Minister }
        deputy_mayor: {zh: "副首席部长", en: "Deputy Chief Minister"}
        speaker: { zh: 议长, en: Speaker }
        lead: pty_e7tyeb
        notes:
          zh: "基鲁迈联合邦由六座岛按《基鲁迈联合盟约》结成。盟约由六个岛议会和领地议会共同签署，修改须经每个岛议会和领地议会都同意。每座岛有自己的岛议会，议员由各村长屋的村民大会推举，管渔场、村社土地、小学和外人入村的许可；奥罗武岛的村落要经村社同意才能进入，这一条也写进了盟约。联合邦议会 47 席，按岛分为五个选区，每个选区至少两席，其余按人口分配：基鲁迈岛 22 席，蒂卢迈岛和奥罗武岛各 7 席，马拉坎岛 3 席，皮卢岛和皮卢尼岛合为一个选区，共 8 席，瓦希拉群岛的官兵也在这里登记投票；各选区内按得票比例分配议席，不设门槛。议会选出首席部长，部长会议里每座岛至少有一名部长。联合邦管预算、渡轮和跨海大桥、旅游许可和珊瑚礁保护；领地的渔业和旅游法规须经联合邦议会表决，才在群岛生效；全民基本收入、全民医保、免费教育和法院与全领地一致，瓦希拉群岛的海军基地仍归中央政府管辖。现任首席部长出自伊武兰民族复兴党，与社会民主互助工党和公地共产党组成联合邦政府。"
          en: "The Commonwealth of Kirumai joins six islands under the Kirumai Covenant. The six island councils and the Territorial Assembly signed it together, and amending it takes the consent of every island council and of the Territorial Assembly. Each island has its own island council, whose members are put forward by the village meetings of the longhouses; it looks after the fishing grounds, village land, primary schools and leave for outsiders to enter a village, and the rule that Orovu's villages may be entered only with their consent is written into the covenant too. The Commonwealth Assembly has 47 seats in five constituencies, one for each island, each with at least two seats and the rest shared by population: 22 for Kirumai Island, 7 each for Tilumai and Orovu, 3 for Malakan, and 8 for Pilu and Piluni, which vote together, the service members of the Vahira Islands registering there too; within each the seats go in proportion to the vote, with no threshold. The Assembly chooses the Chief Minister, and every island has at least one minister in the cabinet. The Commonwealth runs the budget, the ferries and the sea bridge, tourism licences and the protection of the reefs; the territory's fishing and tourism laws take effect in the islands only once the Assembly has voted them in, while the universal basic income, public health insurance, free education and the courts are the same as across the territory, and the naval base on the Vahira Islands remains with the central government. The present Chief Minister comes from the Ivuran National Renewal Party, which governs with the Social Democratic Mutual Aid Labour Party and the Commons Communist Party."
        constituencies:  # by island; Pilu and Piluni are one district, and the Vahira base votes with them
          kirumai: [div_a0nff8, div_3skbd8]
          tilumai: [div_3x32j4]
          orovu: [div_qsykjk]
          malakan: [div_5z620y]
          pilu: [div_xazhxw, div_ykkw7q]
      div_6kjc7x:
        lead: pty_6c94cq  # the committee's chair by the coalition's agreement, at even seats with the Commons
        names: { zh: 公社人民代表大会, en: Commune People's Congress }
        mayor: { zh: 管理委员会主任, en: Chair of the Management Committee }
        deputy_mayor: {zh: "管理委员会副主任", en: "Deputy Chair of the Management Committee"}
        speaker: { zh: 大会主席, en: President of the Congress }
        notes:
          zh: "埃武托拉公社不设市议会和市长，最高权力机关是公社人民代表大会。代表先在各街区和生产合作社的选民会议上提名，再由全体居民直选；选民随时可以联署罢免自己的代表，公社里管这叫「随叫随走」。代表大会选出公社管理委员会，主任和委员定期向大会述职，大会可以随时改选；委员会下设生产、住房、教育、卫生和财务五个组，委员轮流到各组和各街区蹲点。全体会议每月在公社广场的大棚下开一次，雨季移到粮仓改成的会堂，向全体居民开放，年满十六岁的居民都可以在旁听席上举牌要求发言。预算、税率和住房分配都要经代表大会表决，重大事项还要先交各街区的小组会讨论一轮。"
          en: "Evutola Commune has no city council and no mayor; its highest body is the Commune People's Congress. Delegates are first nominated at the voters' meetings of each neighbourhood and producers' cooperative and then elected by all the residents, and voters may recall their delegate at any time by a petition, which the commune calls 'come when called, go when told'. The congress elects the Commune Management Committee, whose chair and members report to it regularly and can be replaced whenever it likes; the committee works in five groups (production, housing, education, health and finance), and its members take turns spending time in each group and each neighbourhood. The full congress meets once a month under the great awning on Commune Square, moving in the rains to a hall that was once a granary, and its sittings are open to all: any resident aged sixteen or over may raise a card from the public benches and ask to speak. The budget, the tax rate and the allocation of homes all go to the congress's vote, and weighty matters are first talked through at neighbourhood meetings."
  # California elects its governor (executive: elected): every party stands in a statewide top-two race,
  # and the governor appoints the cabinet from their own party. The Assembly (seats) and the Senate (upper)
  # are both top-two, a single-member seat each; the speakers come from each chamber's majority, and every
  # mayor is elected by the whole city the same way.
  div_x2z14w:
    names: { zh: 加利福尼亚州众议院, en: California State Assembly }
    system: top_two
    executive: elected
    seats: 80
    upper:
      names: { zh: 加利福尼亚州参议院, en: California State Senate }
      seats: 40
      speaker: { zh: 临时议长, en: President pro Tempore }
    turnout: 0.5
    governor: { zh: 州长, en: Governor }
    minority: { zh: 少数党领袖, en: Minority Leader }
    speaker: { zh: 众议院议长, en: Speaker of the Assembly }
    deputy: {zh: "副州长", en: "Lieutenant Governor"}
    agencies:
    - {names: {zh: "州务卿办公室", en: "Office of the Secretary of State"}, title: {zh: "州务卿", en: "Secretary of State"}}
    - {names: {zh: "州审计长办公室", en: "Office of the State Controller"}, title: {zh: "州审计长", en: "State Controller"}}
    - {names: {zh: "公用事业委员会", en: "Public Utilities Commission"}, title: {zh: "主席", en: "President"}}
    - {names: {zh: "空气资源委员会", en: "Air Resources Board"}, title: {zh: "主席", en: "Chair"}}
    deputy_mayor: {zh: "副市长", en: "Deputy Mayor"}
    notes:
      zh: "加利福尼亚自治州属于美国，和其他领地不同，它实行总统制：州长由全州选民直选，不设总理，州长任命各厅厅长组成内阁，厅长大多出自州长所在的党。州议会分为众议院和参议院，法案须经两院通过、州长签署；州长否决的法案，两院各以三分之二多数可以推翻，加税同样需要三分之二多数。\n人口太少、分不到议席的区，和最近的有议席的区一起投票。湾区的贝叶斯市在众议院并入比尔斯伯勒的门禁高地选区，这一席由加速党赢得。\n加州还保留着直接民主：选民可以联署发起公投提案，也可以联署罢免任何一位民选官员，签名够数就要举行罢免投票。征集签名早已是一门生意，签名公司按每个签名计价，州务卿每次都要先剔除模型生成的签名，才能开始核验。每次大选的选票都附带几十项公投提案，提案说明书由游说公司用模型写成，越写越长，选民再用模型把它们总结成一句话。"
      en: "The California Autonomous State belongs to the United States and, unlike the other territories, has a presidential system: the governor is elected directly by the voters of the whole state, there is no premier, and the governor appoints the heads of the departments to form a cabinet, mostly from the governor’s own party. The State Legislature has two chambers, the Assembly and the Senate; a bill must pass both and be signed by the governor, a veto can be overridden by two-thirds of each chamber, and raising a tax takes two-thirds as well.\nA district too small for a seat of its own votes with the nearest one that has seats. In the Assembly, Bayesian in the Bay votes in the Gated Heights district of Billsborough, which the Accelerate Party won.\nCalifornia also keeps its direct democracy. Voters can petition to put a proposition on the ballot, or to recall any elected official, and once there are enough signatures the recall goes to a vote. Gathering signatures has long been a business, with firms paid by the signature, and every time the Secretary of State has to strike out the signatures generated by models before checking can begin. Every general election ballot comes with dozens of propositions whose explanatory leaflets are written by lobbying firms with models and grow longer each time, and voters use models to boil them down to a sentence."
    court:
      names: { zh: 加利福尼亚州最高法院, en: Supreme Court of California }
      title: { zh: 首席大法官, en: Chief Justice }
      judges: 7
      law: {zh: "普通法（加利福尼亚州法典）", en: "Common law (the California Codes)"}
    mayor: { zh: 市长, en: Mayor }
    council_seats: [9, 2]
