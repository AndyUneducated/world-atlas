    notes: {"zh": "王国党是米拉卡议会的第四大党，也是基督教民主联盟的执政伙伴。它是王国最坚定的君主主义政党，认为王室是米拉卡在三十多年战乱中保持安宁的原因。党首佐·拉科托是退役的海军上校，曾指挥巡逻舰在海上搜救难民船，也曾带队监视卡托拉雇佣兵的越界训练。党员约一万一千，许多是退役军人、乡村士绅和老一辈的王室支持者。\n党的主张包括：王室保留召集和解散议会的礼仪权力，宪法不作修改；海军增加两艘巡逻舰，加强对卡托拉越界训练的监视；公立学校讲授王室历史和米拉卡传统；离岸服务业维持现有的保密制度。它支持王国留在圣约同盟，主张与安博哈拉和努西拉加强军事合作，对社会自由党提出的王室开支审议和反洗钱法案都持保留态度。\n在联合政府中，王国党掌管卫生和自然资源两个部，它在组阁谈判中换来的是海军的巡逻舰采购和海岸雷达站的建设。两党在家庭和信仰问题上一致，但在离岸服务业上有分歧：基民盟的年轻党员希望加强反洗钱审查，王国党则担心这会吓跑客户。社会自由党批评王国党「比国王更保王」，王国党则回应说，王室是全体米拉卡人的，不属于任何一个党派。\n王国党的组织带有浓厚的军队色彩：全国分为几个「团」，每个团由一位退役军官或乡村士绅领导，党的全国委员会被党员称为「参谋部」。党首由全国大会选出，但传统上要先征得党内元老的同意，这一传统在年轻党员中引起了不少批评。党的候选人多是退役军人、地方士绅和律师，章程规定候选人须宣誓效忠国王和宪法。党的经费来自党员的会费、退伍军人协会的捐款和乡村士绅的私人捐赠，它也接受离岸服务业的捐款。王国青年近卫团每年组织野外拉练、航海训练和王室历史讲座，并在国王生日的游行中担任仪仗队，队员们身穿仿照旧总督卫队式样的酒红色制服。\n王国党的选民年龄偏大，集中在乡村、小镇和退役军人家庭。每年国王生日，党员佩戴酒红色和金色的绶带参加首都的游行和海上阅舰，晚上在老城的军官俱乐部举行舞会。党旗是酒红色的旗面，中间一个金色的圆形印章，印章里一颗八角星，象征王室的徽章和指引海员的星辰。", "en": "The Kingdom Party is the fourth party in Miraka's parliament and the CDU's partner in government. It is the kingdom's staunchest monarchist party, holding that the Crown is why Miraka has stayed calm through more than thirty years of war around it. Its leader, Zo Rakoto, is a retired naval captain who commanded patrol ships rescuing refugee boats and led the watch on Katora's mercenaries training across the boundary. Its 11,000 or so members are many of them veterans, country gentry and royalists of the older generation. \nIt wants the Crown to keep its ceremonial power to summon and dissolve parliament and the constitution left as it is; two more patrol ships for the navy and a closer watch on Katora's cross-border training; royal history and Mirakan tradition taught in state schools; and offshore services' confidentiality kept as it is. It keeps the kingdom in the Covenant League and wants closer military ties with Ambohara and Nusira, and it has doubts about both the Social Liberals' scrutiny of royal spending and their anti-laundering bill. \nIn government the Kingdom Party holds health and natural resources; the price of its support in the coalition talks was the navy's new patrol ships and the coastal radar stations. The partners agree on family and faith but differ on offshore services: the CDU's younger members want tighter money-laundering checks, while the Kingdom Party fears they would frighten clients away. The Social Liberals say it is 'more royalist than the King'; it answers that the Crown belongs to all Mirakans and to no party. \nThe Kingdom Party has a strongly military flavour: the country is divided into several 'regiments', each led by a retired officer or member of the country gentry, and members call the national committee 'the general staff'. The national congress elects the leader, but by tradition the party's elders must agree first, a tradition many younger members criticise. Its candidates are mostly veterans, gentry and lawyers, and its rules require them to swear allegiance to the King and the constitution. Money comes from dues, the veterans' associations and private gifts from the gentry, and it also takes donations from offshore services. The Kingdom Young Guard holds field exercises, sail training and lectures on royal history each year, and forms the guard of honour in the King's birthday parade, in wine-red uniforms modelled on those of the old governors' guard.\nIts voters are older and gathered in the villages, the small towns and the families of veterans. On the King's birthday each year its members wear sashes of wine red and gold in the capital's parade and naval review, and in the evening there is a ball at the officers' club in the old town. Its flag is wine red with a round gold seal in the middle bearing an eight-pointed star, the royal badge and the star that guides sailors."}
    history: {"zh": "王国党由退役军官和乡村士绅在王国成立初期组建，最初是一个拥护王室的退伍军人协会。协会在议会中长期支持基民盟政府，后来正式组党，成为基民盟的执政伙伴。", "en": "The Kingdom Party was formed by retired officers and country gentry in the kingdom's early years, beginning as a royalist veterans' association. The association long supported CDU governments in parliament, later became a party and is now the CDU's partner in government."}
    flag_notes: {"zh": "党旗是酒红色的旗面，中间一个金色的圆形印章，印章里一颗八角星。酒红色是王室的礼服，八角星是王室的徽章，也是指引海员的星辰。", "en": "The flag is wine red with a round gold seal bearing an eight-pointed star. The wine red is the royal robes; the star is the royal badge and the star that guides sailors."}
    factions: [{"names": {"zh": "近卫派", "en": "Guards Wing"}, "notes": {"zh": "退役军官和海军家属，最关心海军、国防和对卡托拉的警戒。", "en": "Retired officers and naval families, who care most about the navy, defence and the watch on Katora."}}, {"names": {"zh": "士绅派", "en": "Gentry Wing"}, "notes": {"zh": "乡村士绅和老一辈的王室支持者，最关心王室传统、乡村教堂和离岸服务业的保密制度。", "en": "Country gentry and older royalists, who care most about royal tradition, village churches and offshore confidentiality."}}]
    organisation: {"newspaper": {"zh": "《王冠报》", "en": "The Crown"}, "think_tank": {"zh": "王国传统学会", "en": "Society for the Kingdom's Traditions"}, "women": {"zh": "王国妇女会", "en": "Kingdom Women's Guild"}}
  - id: "pty_h3247c"
    names: {"zh": "自由商人党", "en": "Free Merchants' Party"}
