    notes: {"zh": "氏族传统党是伊纳拉群岛邦岛民议会的第一大党，代表各母系氏族和群岛的传统生活方式。党首马莉·伊纳拉索阿出任首席部长，她是伊纳拉岛最大氏族之一的长女，按照传统，她将在母亲去世后成为氏族的女家长。氏族党与新岛民党联合执政。它与母亲议会关系密切，许多党员同时是各氏族的家长或长女。党员约一万八千，在一个四十万人口的群岛上，这意味着几乎每个氏族都有党员。\n党的口号与群岛邦的国训一样：「母亲的海，女儿的岛」。它主张氏族土地不得出售，外人只能租用；游客只能住在氏族经营的家庭旅馆，收入由氏族共享；珍珠和海藻养殖场归氏族共同经营；学校用伊纳拉方言教授母系历史和航海歌谣。它并不反对现代化，但认为现代化必须经过氏族的同意，常说「新东西可以上岛，但要先敲门」。\n在联合政府中，氏族党掌管内政、建设、劳动、卫生和海岸巡逻五个部，新岛民党则负责司法、教育和自然资源。两党的分歧在旅游业：新岛民党希望允许外资建设度假村，氏族党坚持只发展家庭旅馆。海洋公地党批评氏族党太保守，让年轻人和男子在氏族中缺少发言权；氏族党则回应说，群岛的平等正是建立在母系传统之上的。\n氏族党的组织与氏族结构重合：每个氏族是一个支部，支部的负责人通常是氏族的女家长或长女，各支部推举代表组成党的「家长会议」，会议选出党首和候选人名单。按照传统，男子也可以入党和参选，但名单中女性的排位总是在前，党员说这是「母亲先上船」。党的经费来自各氏族的家庭旅馆、珍珠养殖场的收入和党员的会费，章程规定氏族的公共收入不得用于选举，只能来自党员的自愿捐献。女儿会每年组织年轻女子学习航海、编织和氏族的口述历史，也在成年礼上担任仪式的助手。党与萨马伊和安巴罗的原住民组织保持联系，常交流习惯法和土地保护的经验。\n氏族党的选民是年长者和乡村渔村的居民，在伊纳拉岛的老村落最强。每年满月时节的成年礼上，党员们帮助各氏族组织海滩篝火，首席部长也会回到自己的氏族，把传家的宝贝贝壳交到侄女或女儿手中。党旗是青绿色的旗面，中间一颗米白色的珍珠，代表潟湖里的珍珠养殖场，也代表氏族代代相传的财富。", "en": "The Clan Tradition Party is the largest party in the Islanders' Assembly of the Inara Isles, speaking for the matrilineal clans and the isles' traditional way of life. Its leader, Maly Inarasoa, is Chief Minister; she is the eldest daughter of one of the largest clans on Inara and by custom will become its woman head when her mother dies. The party governs with the New Islanders. It is close to the Mothers' Council, and many of its members are also clan heads or eldest daughters. With some 18,000 members in isles of 400,000, almost every clan has members in it. \nIts watchword is the Commonwealth's own motto, 'the mothers' sea, the daughters' isles'. It wants clan land never sold, outsiders only leasing it; visitors kept in clan-run guesthouses, the takings shared by the clan; the pearl and seaweed farms kept in the clans' joint hands; and matrilineal history and the sailing songs taught at school in the island dialect. It does not oppose modern ways, but holds that they must come with the clans' consent: 'new things may come to the isles, but they must knock first'. \nIn government the Clan Tradition Party holds five ministries, the interior, construction, labour, health and the coastal patrol, while the New Islanders hold justice, education and natural resources. The partners differ on tourism: the New Islanders would let foreign capital build resorts, while Clan Tradition holds to guesthouses only. The Ocean Commons Party says Clan Tradition is too conservative and leaves the young and men with too little voice in the clans; Clan Tradition answers that the isles' equality rests on the matrilineal tradition itself. \nClan Tradition's organisation matches the clans: each clan is a branch, usually led by its woman head or eldest daughter, and the branches send delegates to the party's Council of Heads, which chooses the leader and the candidate list. By custom men may join and stand too, but women always rank higher on the list, which members call 'mothers board first'. Money comes from the clans' guesthouses and pearl farms and from members' dues, and its rules forbid a clan's common income from being spent on elections, which must be paid for by members' own gifts. The Daughters' Circle teaches young women seamanship, weaving and the clans' oral history each year and assists at the coming-of-age rites. The party keeps in touch with indigenous organisations in Samay and Ambaro, trading experience of customary law and the protection of land.\nIts voters are older people and the people of the fishing villages, and it is strongest in the old villages of Inara. At the coming-of-age rites at the full moon each year its members help the clans light the beach bonfires, and the Chief Minister goes home to her own clan to hand the family cowrie to a niece or daughter. Its flag is teal with a cream pearl in the middle, the pearl farms of the lagoons and the wealth the clans hand down."}
    history: {"zh": "氏族传统党由各氏族的女家长在群岛邦成立时组建，最初是母亲议会在岛民议会中的代言人。随着岛民议会的权力扩大，它发展为一个独立的政党，长期是议会的第一大党。", "en": "The Clan Tradition Party was formed by the clans' women heads when the Commonwealth was founded, at first as the voice of the Mothers' Council in the Islanders' Assembly. As the Assembly's powers grew it became a party in its own right, and has long been its largest."}
    flag_notes: {"zh": "党旗是青绿色的旗面，中间一颗米白色的珍珠。青绿色是潟湖，珍珠是氏族代代相传的财富。", "en": "The flag is teal with a cream pearl in the middle. The teal is the lagoon; the pearl is the wealth the clans hand down."}
    factions: [{"names": {"zh": "长女派", "en": "Eldest Daughters"}, "notes": {"zh": "各氏族的长女和女家长，最关心土地、习惯法和母亲议会的地位。", "en": "The clans' eldest daughters and women heads, who care most about land, customary law and the Mothers' Council's standing."}}, {"names": {"zh": "舅舅派", "en": "Uncles' Circle"}, "notes": {"zh": "在氏族中负责教育外甥的男子，关心学校、航海技艺和传统歌谣，希望男子在氏族中有更多发言权。", "en": "The men who raise their sisters' children in the clans, concerned with schools, seamanship and the old songs, who want men to have more voice in the clans."}}]
    organisation: {"newspaper": {"zh": "《潟湖之声》", "en": "Voice of the Lagoon"}, "think_tank": {"zh": "母系习惯法研究会", "en": "Society for Matrilineal Customary Law"}, "women": {"zh": "女家长会", "en": "Council of Clan Mothers"}}
