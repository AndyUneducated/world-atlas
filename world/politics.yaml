      - { zh: 巴克汉姆语使用者超过一成的区，路牌和公文双语, en: "Bilingual signs and documents in every district where over a tenth speak Buckham" }
      - { zh: 设立巴克汉姆语广播电视频道, en: A Buckham-language radio and television channel }
      - { zh: 巴克汉姆语学校与中文学校同等拨款, en: Equal funding for Buckham-language and Chinese-language schools }
      - { zh: 修缮萨科勒老城的钟楼和石桥, en: "Restore the bell towers and stone bridges of Sakole's old town" }
    allies: [pty_jh513z, pty_ymxc2s]
    targets: { div_fbfqv9: 2 }
    lean: { "lang:art-x-buckham": 3.0 }
    notes:
      zh: "巴克汉姆人联盟代表北维京岛讲巴克汉姆语的居民，主张在巴克汉姆语使用者多的区实行双语路牌和公文、开办巴克汉姆语广播电视、让巴克汉姆语学校与中文学校同等拨款。巴克汉姆人是岛上较早的移民之一，聚居在萨科勒和几个山谷小城，以石砌的钟楼、拱桥和长长的午餐闻名。联盟在领地议会里没有议席，却在萨科勒市议会里有三席，市里新设的巴克汉姆语图书馆就是它促成的。联盟每年春天在萨科勒老城办一次「两种语言」诗会，参赛的诗必须一半用中文、一半用巴克汉姆语写成。"
      en: "The Buckham League speaks for North Viking Island's Buckham-speaking residents. It wants bilingual signs and documents where many speak Buckham, a Buckham radio and television channel, and equal funding for Buckham-language and Chinese-language schools. The Buckham were among the island's earlier settlers and live mostly in Sakole and a few valley towns, known for stone bell towers, arched bridges and long lunches. The League has no seats in the territorial parliament but holds three on Sakole's council, and the city's new Buckham library was its doing. Every spring it holds a two-tongues poetry contest in Sakole's old town, where each poem must be written half in Chinese and half in Buckham."
    history:
      zh: "巴克汉姆人联盟由萨科勒的巴克汉姆语协会和教师工会组建，最初的目标是保住几所面临合并的巴克汉姆语小学。"
      en: "The League was formed by Sakole's Buckham language society and teachers' union, at first to save a few Buckham-language primary schools that were to be merged."

