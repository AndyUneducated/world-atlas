      - { zh: 西荒高原发射场扩建第三座发射台, en: Build a third launch pad at the West Heath spaceport }
      - { zh: 中学开设天文和编程必修课, en: Compulsory astronomy and programming in secondary schools }
      - { zh: 科学城的研究成果向本地企业免费授权, en: Free licences for Science City research to local firms }
    allies: [pty_ydphtm, pty_ymxc2s]
    targets: { div_fbfqv9: 2.5 }
    lean: { aerospace: 1.2, satellite: 0.8, research: 0.6, defence: 0.3 }
    notes:
      zh: "星途党是北维京岛一个以航天和科研为核心议题的小党，主张把领地研发投入提高到生产总值的百分之五、在西荒高原发射场扩建第三座发射台、中学开设天文和编程必修课、科学城的研究成果向本地企业免费授权。它的未来主义带着鲜明的增长色彩：在生态与增长之间，它站在增长一边；在领地自治与中央统筹之间，它又偏向统筹，认为火箭和大科学装置只有集中力量才造得出来。这让它在小党里显得格格不入，也让党内充满张力。一边是科学城的研究员，希望政府长期、稳定地投钱给基础研究；另一边是航天产业区的企业家，希望少管制、多订单。更敏感的是卫星和国防的关系：航天订单里有一部分来自防务，党内有人认为这是产业的命脉，有人则坚持「星空不该用来打仗」。\n在领地议会选举中，星途党拿到百分之二点五的选票，没有议席。它在马斯林山市议会三十七席中有两席，坐在反对席上；马斯林山由社会民主互助工党、绿脉党和罗盘党联合执政，其中罗盘党是星途党的友党，也在领地政府里掌握一个部。星途党因此学会了「借道」：它的提案常常由罗盘党的议员带进领地议会，换来的是在市里的预算表决中投罗盘党一票。另一个友党灯塔自由民主党在领地议会里是反对党，星途党在两家之间小心周旋。它常被提起的成就是推动市里为中学开设天文选修课，离必修还差一步；争议则集中在发射台扩建上，绿脉党担心高原生态，高原上的牧民也担心草场。在议会之外，它更像一个科普团体：党员到中学开讲座、给市议员写简报，每次领地预算公布后都算一遍研发投入占生产总值的比例，贴在党部门口。\n它的选民集中在航天、卫星和科研地区：马斯林山的航天产业区和西北市的科学城，党员里有不少火箭工程师和天文台的研究员。离开这两个地方，它的得票就很稀薄，乡村和老城里几乎没有支持者。在马斯林山，它的票随航天订单起落：订单多时，工程师们觉得不必投它；订单少了，它的票反而上升。党名和口号「下一站：星空」都说明了它的志向；党旗上是深蓝的夜空和一道山脊，夜空中画着一条白色的轨道。\n每次火箭发射成功，党部都会在门口挂出一面写着发射序号的小旗，门口如今挂满了旗。党代会开幕前要倒数十秒，数到零时全场起立。党内最受欢迎的活动是夏夜在发射场边的观星会，青年组织星途学会会架起望远镜，给附近的孩子讲星座。总书记英韦尔德·菲耶尔霍尔特有个习惯：每份党内文件都要写上「预计发射时间」，也就是这件事打算何时办成。"
      en: "The Starward Party is a small North Viking Island party whose core causes are spaceflight and research. It wants research spending raised to five per cent of the territory's output, a third launch pad at the West Heath spaceport, astronomy and programming made compulsory in secondary schools, and Science City's research licensed free to local firms. Its futurism is plainly pro-growth: between ecology and growth it stands with growth, and between home rule and central coordination it leans towards coordination, arguing that rockets and big scientific facilities can only be built by pooling effort. That makes it an odd fit among the small parties, and fills it with tensions of its own. On one side are Science City's researchers, who want steady long-term public money for basic science; on the other are the entrepreneurs of the space industry, who want fewer rules and more orders. More delicate still is the link between satellites and defence: some of the space orders come from defence work, and while some members see that as the industry's lifeline, others insist the stars should not be used for war.\nAt the territorial election the Starward Party won 2.5 per cent and no seats. It holds two of Maslin Mountain's 37 council seats, in opposition; the city is governed by the Social Democratic Mutual Aid Labour Party, Greenvein and the Compass Party, and Compass is Starward's ally and also holds one ministry in the territorial government. Starward has therefore learned to borrow a route: its proposals are often carried into the territorial parliament by Compass members, in return for a Starward vote for Compass in city budget votes. Its other ally, the Lighthouse Liberal Democrats, sits in opposition in the territorial parliament, and Starward steers carefully between the two. An achievement it often cites is persuading the city to offer astronomy as an elective in secondary schools, one step short of making it compulsory; the controversy centres on the new launch pad, where Greenvein worries about the heath's ecology and the herders on the plateau worry about their pastures. Outside the chambers it behaves more like a science outreach society: members give talks in secondary schools, write briefings for councillors, and after every territorial budget work out research spending as a share of output and post the figure at the party's door.\nIts voters are concentrated in the aerospace, satellite and research districts: Maslin Mountain's space industry district and Northwest's Science City, and its members include many rocket engineers and observatory researchers. Beyond those two places its vote is thin, and it has almost no supporters in the countryside or the old towns. In Maslin Mountain its vote moves against the order book: when space orders are plentiful, engineers see no need to vote for it, and when orders dry up its vote rises. The name and the slogan, next stop: the stars, speak for its ambitions; the flag shows a deep blue night sky over a mountain ridge, with a white orbit drawn across the sky.\nAfter every successful launch the party hangs a small flag bearing the launch number at its door, and the doorway is now hung thick with them. Each congress opens with a ten-second countdown, and at zero the whole hall stands. Its most popular event is a summer stargazing night beside the spaceport, where the youth wing, the Starward Cadets, sets up telescopes and shows local children the constellations. General Secretary Ingveld Fjellholt has a habit of putting an expected launch time on every party document, meaning the date by which the thing is meant to be done."
    history:
      zh: "星途党由马斯林山航天产业区的工程师在一次关于发射场扩建的市议会听证后创立。那次听证上，工程师们发现会场里几乎没有人能讲清楚发射场对城市意味着什么，于是决定自己站出来竞选。第一份党纲写在一张火箭装配图的背面，后来科学城的研究员也陆续加入，党纲才从发射台扩展到教育和科研。"
      en: "The party was founded by engineers of Maslin Mountain's space industry after a council hearing on enlarging the spaceport. At that hearing the engineers found that hardly anyone in the room could explain what the spaceport meant for the city, and decided to stand for election themselves. The first manifesto was written on the back of a rocket assembly drawing; as researchers from Science City joined, the programme grew from launch pads to education and research."
    flag_notes:
      zh: "党旗以天空与地平线构图：上方是深蓝的夜空，下方是一道靛蓝的山脊，夜空中画着一条白色的轨道。山脊代表马斯林山和西荒高原，是火箭升空的地方；深蓝夜空是天文台每晚看到的天；白色轨道象征人造卫星，也象征党名里的「途」。党员说，这面旗画的是发射前一刻的景色。"
      en: "The flag is built as sky and horizon: a deep blue night sky above an indigo mountain ridge, with a white orbit drawn across the sky. The ridge stands for Maslin Mountain and the West Heath plateau, where rockets lift off; the night sky is the one the observatories watch every evening; and the white orbit stands for satellites and for the way ahead in the party's name. Members say the flag shows the moment just before a launch."
    factions:
      - names: { zh: "发射台派", en: "Launch Pad Group" }
        notes: { zh: "以航天产业区的企业家和工程师为主，主张扩建发射台、放宽管制、争取更多商业和防务订单，与罗盘党关系密切。", en: "Mainly entrepreneurs and engineers of the space industry, it wants the new launch pad, lighter regulation and more commercial and defence orders, and has close ties to the Compass Party." }
      - names: { zh: "天文台圈", en: "Observatory Circle" }
        notes: { zh: "科学城研究员和教师的圈子，看重基础研究的长期拨款、中学天文和编程课以及研究成果免费授权，反对把航天绑在防务订单上。", en: "The circle of Science City researchers and teachers, which values long-term funding for basic research, astronomy and programming in schools and free licensing of research, and opposes tying spaceflight to defence orders." }
      - names: { zh: "高原对话论坛", en: "Plateau Dialogue Forum" }
        notes: { zh: "党内较温和的一翼，主张发射场扩建前先与高原牧民和绿脉党协商，把生态补偿写进项目，成员多是年轻党员和星途学会的骨干。", en: "The party's more moderate wing, which wants talks with the plateau herders and Greenvein before the spaceport is enlarged and ecological compensation written into the project; its members are mostly younger members and Starward Cadets activists." }
    organisation:
      newspaper: { zh: "《倒计时》", en: "Countdown" }
      think_tank: { zh: "轨道政策研究所", en: "Orbit Policy Institute" }
      unions: { zh: "马斯林山航天工程师协会", en: "Maslin Mountain Aerospace Engineers' Association" }
      women: { zh: "星途女性科学家网络", en: "Starward Women in Science Network" }

  - id: pty_xmdckb
    names: { zh: 高地牧场联盟, en: Upland Pasture Union }
    short_names: { zh: 牧盟, en: "Upland" }
    color: "#8C6A3F"
    flag: { layout: horizon, colors: ["#9CC3E0", "#8C6A3F"], edge: peaks, charge: antlers }
    spectrum: 1.5
    family: { zh: 农民党, en: Agrarian }
    ideology: [{ zh: 乡村保守主义, en: Rural conservatism }, { zh: 农本主义, en: Agrarianism }, { zh: 地方主义, en: Localism }]
    axes: { econ: 6.0, galtan: 7.0, autonomy: 2.5, green: 6.5 }
    leader: { zh: 托尔莫·格拉斯豪, en: Tormod Grashaug }
    members: 5100
    youth_wing: { zh: 牧场青年, en: Young Pasture }
    slogan: { zh: 山上也有人, en: People live up here too }
    policies:
      - { zh: 内陆牧区的道路冬季除雪由领地负担, en: Territorial funding for winter snow clearing on inland pasture roads }
      - { zh: 驯鹿和牛羊的传统放牧路线写入土地法, en: "Write the traditional reindeer and sheep droving routes into land law" }
      - { zh: 风电场选址须征得附近牧场同意, en: Wind farms only with the consent of nearby pastures }
      - { zh: 山区学校保留寄宿部, en: Keep boarding houses at mountain schools }
    allies: [pty_x004cm, pty_k4krwn]
    targets: { div_fbfqv9: 2 }
    lean: { herding: 0.8, agriculture: 0.5, forestry: 0.4, urban: -0.7 }
    notes:
      zh: "高地牧场联盟代表北维京岛内陆山区的牧民和小农，主张由领地负担牧区道路的冬季除雪、把驯鹿和牛羊的传统放牧路线写入土地法、风电场选址须征得附近牧场同意、山区学校保留寄宿部。它是乡村保守派，在社会议题上偏传统，在经济上偏右，在领地自治问题上强烈倾向地方。它的内在张力也一目了然：一个不信任领地政府、主张「山里的事山里定」的党，核心诉求却是要领地出钱除雪、办学。党内的说法是「我们不要政府管我们，只要政府别忘了我们」。另一重张力在于能源：内陆山区是建风电场的好地方，风电场能带来租金和道路，也会切断放牧路线、改变山地的样子，党内对此始终没有统一的答案。\n在领地议会选举中，联盟拿到百分之二的选票，离百分之五的门槛很远。它在雅利基卢克市议会二十四席中有两席，却坐在反对席上：雅利基卢克由社会民主互助工党、全领地联邦联盟和渔农党联合执政，友党渔农党在里面，联盟却在外面，这让两党的关系既亲近又微妙。友党长屋党在市里也是反对派，两党常在乡村学校和老路的问题上联手。联盟的影响力主要在议会之外：它的党员在领地议会的听证会上作证，在冬季暴雪后组织拖拉机车队清路，还给每一条传统放牧路线画了地图，交给土地部门备案。它与绿脉党在风电场选址上常有争执，在保护山地草场上又常常站在一起，两党的人说这叫「吵着架一起赶羊」。它与星途党在西荒高原发射场扩建上也有分歧，牧民担心新发射台和新修的道路会切断转场路线。\n它的选民在内陆山区的乡村、牧区、种植业和林业地区，城市里几乎没有。在雅利基卢克和周边的山谷里，它的票主要来自地势高的村子，越往山下、越靠近公路和城镇，票就越少，党员开玩笑说联盟的支持率可以用海拔来量。年轻人外流是它的隐忧：山区学校的寄宿部一旦关掉，一个家庭往往就会搬下山，所以联盟把保留寄宿部看得和除雪一样重。口号「山上也有人」来自一位牧民在议会听证会上的发言，当时议员们在讨论把一条山区公路降为季节性道路。党旗上方是浅蓝的天空，下方是褐色的山地，交界处是起伏的山峰，中间一对驯鹿角。\n联盟的党员证是一枚小铜铃，和挂在牛羊脖子上的铃一样；党代会开幕时，代表们一起摇铃，铃声停下才开始讲话。每年夏天，党代会在一片高山牧场上召开，代表们要赶着自家的牲口上山，会议时间按转场的日子来定。党首托尔莫·格拉斯豪说，只要一个牧民能在暴雪之后照常下山送孩子上学，联盟就算办成了一件事。"
      en: "The Upland Pasture Union speaks for the herders and smallholders of North Viking Island's mountainous interior. It wants the territory to pay for winter snow clearing on pasture roads, the traditional droving routes of reindeer, cattle and sheep written into land law, wind farms sited only with the consent of nearby pastures, and boarding kept at mountain schools. It is a rural conservative party, traditional on social questions, right of centre on economics and strongly in favour of local control. Its inner tension is plain to see: a party that distrusts the territorial government and wants the hills to decide for the hills makes its central demand that the territory pay for snow clearing and schools. As members put it, we do not want the government to run us, only not to forget us. A second tension lies in energy: the mountains are good places for wind farms, which bring rents and roads but can cut droving routes and change the face of the hills, and the party has never settled on one answer.\nAt the territorial election the Union won two per cent, far below the five-per-cent threshold. It holds two of Jaalikiluk's 24 council seats but sits in opposition: the city is governed by the Social Democratic Mutual Aid Labour Party, the All-Territories Federal Union and the Fishers and Farmers Party, so its ally is inside the coalition while the Union is outside, which makes the relationship close but delicate. Its other ally, the Longhouse Party, is also in opposition in the city, and the two often join forces over village schools and old roads. The Union's influence lies mostly outside the chambers: its members give evidence at hearings of the territorial parliament, organise tractor convoys to clear roads after winter blizzards, and have mapped every traditional droving route and lodged the maps with the land authorities. It often quarrels with Greenvein over where wind farms go, yet the two stand together on protecting mountain grassland, which their members call herding sheep while arguing. It also differs with the Starward Party over enlarging the West Heath spaceport, as herders fear that a new launch pad and its new roads would cut the droving routes.\nIts voters are in the villages, pastures, farming and forestry districts of the mountainous interior, and it has almost none in the cities. In and around Jaalikiluk its votes come mainly from the higher villages and thin out the further one goes downhill towards the roads and towns, so members joke that the Union's support can be measured by altitude. Young people leaving is its quiet worry: once a mountain school closes its boarding house, a family will often move down the valley, which is why the Union treats keeping boarding as seriously as clearing snow. Its slogan, people live up here too, comes from a herder's words at a parliamentary hearing on downgrading a mountain road to a seasonal one. The flag shows a pale blue sky over brown uplands, with a line of peaks where they meet and a pair of reindeer antlers in the centre.\nA member's card is a small brass bell, like the ones hung on cattle and sheep; at the opening of each congress the delegates ring their bells together, and speeches begin only when the ringing stops. Every summer the congress meets on a high pasture, with delegates driving their own animals up the mountain, and its dates are set by the seasonal move of the herds. Party leader Tormod Grashaug says that as long as a herder can come down after a blizzard and take the children to school as usual, the Union has done its job."
    history:
      zh: "高地牧场联盟由内陆的牧民协会组建，起因是一次冬季暴雪中几条山路因预算不足没有及时除雪，牧场被困了两周。暴雪过后，牧民们发现自己的声音在领地议会里几乎听不到，于是把几个协会合成一个政党。此后它与渔农党结为友党，在雅利基卢克等内陆城市的市议会里赢得了席位。"
      en: "The Union was formed by the inland herders' associations after a winter blizzard in which several mountain roads went uncleared for want of money and the pastures were cut off for a fortnight. After the snow, the herders found that their voice could hardly be heard in the territorial parliament, and merged their associations into a party. It later became an ally of the Fishers and Farmers Party and won seats on the councils of inland cities such as Jaalikiluk."
    flag_notes:
      zh: "党旗以天空与地平线构图：上方是浅蓝的天空，下方是褐色的山地，交界处是一排起伏的山峰，中间是一对驯鹿角。浅蓝是高原冬天晴朗的天，褐色是夏季牧场的泥土和枯草，山峰代表内陆的山脉。驯鹿角象征传统的放牧和转场，党员说，鹿角每年脱落又重新长出，就像山里人一年年守着牧场。"
      en: "The flag is built as sky and horizon: pale blue sky above brown uplands, with a line of peaks where they meet and a pair of reindeer antlers in the centre. The pale blue is the clear winter sky of the uplands, the brown the soil and dry grass of the summer pastures, and the peaks the mountains of the interior. The antlers stand for traditional herding and the seasonal drove; members say that antlers are shed and grow back every year, just as hill people hold on to their pastures year after year."
    factions:
      - names: { zh: "转场派", en: "Droving Road Group" }
        notes: { zh: "以驯鹿和牛羊牧民为主，首先看重把传统放牧路线写入土地法，坚决反对未经牧场同意的风电场，主张联盟保持独立。", en: "Mainly reindeer, cattle and sheep herders, it puts writing the traditional droving routes into land law first, firmly opposes wind farms without the pastures' consent, and wants the Union to stay independent." }
      - names: { zh: "山谷合作社圈", en: "Valley Cooperative Circle" }
        notes: { zh: "小农、林业工人和合作社的圈子，愿意在分享租金和修路的条件下接受风电场，主张与渔农党联合竞选，以求跨过门槛。", en: "The circle of smallholders, forestry workers and cooperatives, willing to accept wind farms in return for shared rents and new roads, and in favour of a joint list with the Fishers and Farmers Party to clear the threshold." }
    organisation:
      newspaper: { zh: "《山路报》", en: "The Mountain Road" }
      think_tank: { zh: "高地乡村研究会", en: "Upland Rural Institute" }
      unions: { zh: "内陆牧民协会联合会", en: "Federation of Inland Herders' Associations" }
      women: { zh: "牧场妇女会", en: "Pasture Women's Guild" }

