    lean: { forestry: 1.4, cannabis: 0.9, conservation: 0.6, ski: 0.4, hydropower: 0.5, fishing: 0.4, lat: 0.32, urban: -0.25 }
    notes:
      zh: "防火绿党是北部森林地带的地区性政党，几乎只在红木和针叶林覆盖的北方推出候选人。党首罗恩·阿什科姆当过空降消防员，山火季从飞机上跳进火场开辟隔离带，党的名字就来自这种隔离带。党员里有消防员、伐木工、护林员、大麻种植户和漂流向导，这些人平时未必合得来，但都住在同一片会着火的山里。\n防火绿党全州得票只有5.0%，但在北部极为集中，红木帘区约三分之二的选民投给了它。它在众议院有2席：谦卑湾选区以64%对36%、涂黑选区以51%对49%击败共和党；参议院覆盖整个北部的涂黑选区也归它，大选得票65%。欧福利亚市议会11席全部属于防火绿党，市长选举的大选在两名防火绿党人之间进行，洛根·霍利斯特以51.6%当选；雷达克特的市长达科塔·斯托克韦尔也是防火绿党人，党在市议会11席中占6席。它在北部选民、乡村、林业、自然保护和水电地区最强，在南部和城市最弱。\n党的主张以防火为中心：每座山镇外修一圈防火带，由居民轮流维护；山火季节，数据中心的冷却湖先给消防飞机取水；电力公司的线路引发山火，董事须亲自上山参加扑救。最后一条在州议会里被称为「董事上山条款」，每次提出都被否决，每次都上新闻。\n防火绿党和民主党的气候计划关系冷淡。党的说法是，民主党的气候计划是一份很长的文件，而山火不读文件。它反对加速党在北部河谷修建新的数据中心，认为冷却用水会抽干山溪；在伐木问题上党内又有分歧，伐木工主张疏伐林下的枯木，红木派则连一棵活树都不许碰。党的总部设在欧福利亚一座废弃的防火瞭望塔里，每当山上冒烟，所有会议都会立刻延期。\n党员的生活节奏跟着山火季走。春天是党的大会和维护防火带的季节，夏天大家各自上山，秋天开始清点损失、写赔偿申请。党的志愿者每年为山镇居民举办疏散演练，从收拾应急背包到给马匹装车全程计时，成绩最好的镇会得到一面锦旗和一台二手抽水泵。大麻种植户是党的重要捐款人，他们的温室最怕山火，因此对防火也最热心。党内流传一句话：在北方，每个人都是消防员，只是有些人还没轮到。"
      en: "The Firebreak Greens are a regional party of the northern forests, standing candidates almost only in the north under the redwoods and conifers. Their leader Rowan Ashcombe was a smokejumper who leapt from aircraft into wildfires to cut firebreaks, the lines that give the party its name. Its members include firefighters, loggers, rangers, cannabis growers and river guides, people who do not always get on but all live in the same mountains that burn.\nThe party took only 5.0% of the vote across the state, but its vote is tightly packed in the north: about two-thirds of the voters of the Redwood Curtain district backed it. It holds 2 Assembly seats, Humbled Bay won from the Republicans by 64% to 36% and Blackout by 51% to 49%, and the Senate seat of Blackout, which covers the whole north, where it took 65% in the general election. All 11 seats on the Euphoria City Council belong to the Greens, and the city’s mayoral race was a general election between two of them, won by Logan Hollister with 51.6%. The Mayor of Redacted, Dakota Stockwell, is a Firebreak Green too, and the party has 6 of the 11 council seats there. It is strongest in the north, in the countryside and in forestry, conservation and hydropower areas, and weakest in the south and in the cities.\nIts programme is built round fire: a firebreak cleared round every hill town and kept by its residents in turn; in the fire season, data-centre cooling lakes to go first to firefighting aircraft; and when a power company’s lines start a wildfire, its directors to go up the mountain and fight it in person. The last is known in the Legislature as the ‘Directors Up the Mountain clause’; it is voted down every time it is moved and makes the news every time.\nThe party is cool towards the Democrats’ climate plan, which it describes as a very long document that wildfires do not read. It opposes Accelerate’s new data centres in the northern valleys, arguing that their cooling water would drain the mountain streams; on logging it is split, the loggers wanting the dead wood under the trees thinned and the Redwood Wing refusing to let a single living tree be touched. The party’s headquarters is a disused fire lookout tower in Euphoria, and whenever smoke rises on the mountain every meeting is postponed at once.\nMembers live by the fire season. Spring is for the party conference and clearing firebreaks, in summer everyone heads up the hills, and autumn is for counting losses and writing claims. Its volunteers run evacuation drills every year in the mountain towns, timing everything from packing an emergency bag to loading the horses, and the fastest town wins a pennant and a second-hand water pump. Cannabis growers are major donors, and since their greenhouses fear fire most, they are the keenest on firebreaks. A saying goes round the party: in the north everyone is a firefighter, some just haven’t had their turn yet."
    history:
      zh: "防火绿党由北部几个山镇的志愿消防队联合发起。一场大火烧掉了半个山镇以后，幸存的居民发现州里的防火预算大多花在了南方城市的宣传上，于是把消防队的联络网改造成了一个政党，第一个拿下的就是欧福利亚市议会。"
      en: "The Firebreak Greens were started jointly by the volunteer fire brigades of several northern hill towns. After a great fire burned down half of one of them, the survivors found that most of the state’s fire-prevention budget had gone on publicity in the southern cities, so they turned the brigades’ network into a party; the first prize it took was the Euphoria City Council."
    flag_notes:
      zh: "党旗上半是深绿色，下半是橙红色的波浪，中间一棵白色的松树。绿色是森林，橙红色的波浪是火线，松树站在两者之间，就像防火带守在森林和火之间。"
      en: "The flag is dark green over orange-red waves, with a white pine in the middle. The green is the forest and the waves are the fire line; the pine stands between them, as a firebreak stands between forest and fire."
    factions:
      - names: { zh: "锯木厂派", en: "Sawmill Wing" }
        notes: { zh: "伐木工、锯木厂工人和林区小镇的商户，主张疏伐枯木、给林木合作社减税，认为管好的森林才不会烧起来。", en: "Loggers, sawmill workers and the shopkeepers of forest towns, who want the dead wood thinned and timber cooperatives' taxes cut, holding that a well-kept forest is one that does not burn." }
      - names: { zh: "红木派", en: "Redwood Wing" }
        notes: { zh: "护林员、科学家和环保志愿者，坚持严格保护原始红木林，反对任何新的伐木许可，和锯木厂派的争吵是党代会的固定节目。", en: "Rangers, scientists and conservation volunteers who insist on strict protection for the old-growth redwoods and oppose every new logging permit; their row with the Sawmill Wing is a fixture of every convention." }
      - names: { zh: "大麻合作社圈", en: "Cannabis Co-op Circle" }
        notes: { zh: "红木帘一带的大麻种植合作社，关心营业税、用水许可和山火季的保险，是党最稳定的捐款来源。", en: "The cannabis growers' cooperatives of the Redwood Curtain, concerned with sales tax, water permits and fire-season insurance; the party's steadiest source of money." }
    organisation:
      newspaper: { zh: "《烟情通报》", en: "Smoke Report" }
      think_tank: { zh: "山火与森林研究所", en: "Institute for Wildfire and Forest" }
      unions: { zh: "山地消防员协会", en: "Mountain Firefighters' Association" }
      women: { zh: "林区妇女会", en: "Forest Women's Circle" }
