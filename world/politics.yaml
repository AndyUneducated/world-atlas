    policies: [{"zh": "转口贸易零关税，船舶登记费全岛最低", "en": "Keep entrepôt trade free of duty and ship registration fees among the lowest on the island"}, {"zh": "国际仲裁庭扩建，吸引海外商业纠纷到瓦罗纳裁决", "en": "Enlarge the arbitration court and bring overseas commercial disputes to Varona"}, {"zh": "填海新建一座集装箱码头和一片住宅区", "en": "Reclaim land for a new container quay and a housing district"}, {"zh": "对交战各方的商船一视同仁，只禁运武器", "en": "Treat the merchant ships of every warring side alike, embargoing only arms"}]
