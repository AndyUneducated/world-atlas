    policies:
      - { zh: 稻米、香料和水果的收购保护价, en: "Guaranteed purchase prices for rice, spices and fruit" }
      - { zh: 山区梯田的灌溉水渠由领地维护, en: Territorial upkeep of the hill terraces' irrigation channels }
