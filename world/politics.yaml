    spectrum: -1.6
    family: {"zh": "绿色政治", "en": "Green"}
    ideology: [{"zh": "绿色政治", "en": "Green politics"}, {"zh": "海洋保护", "en": "Marine conservation"}, {"zh": "社会正义", "en": "Social justice"}]
    axes: {"econ": 3.0, "galtan": 1.5, "autonomy": 6.5, "green": 9.5}
