          zh: "埃武托拉公社没有市议会，也没有市长。公社的最高机关是公社大会，年满十六岁的居民都可以出席、发言和表决，每月在公社广场的大棚下开一次，雨季移到粮仓改成的会堂里。大会选出十五人的协调委员会处理日常事务，委员抽签产生、一年一换，不能连任；预算、税率和住房分配都要经大会表决，重大事项还要在各街区的小组会上先讨论一轮。公社居民照常参加领地议会的选举，公社运动的议员就是在这里当选的。"
          en: "Evutola Commune has no city council and no mayor. Its highest body is the Commune Assembly, where every resident aged sixteen or over may attend, speak and vote; it meets once a month under the great awning on Commune Square, moving in the rains to a hall that was once a granary. The assembly chooses a coordinating committee of fifteen to handle day-to-day business, drawn by lot for a year at a time and never twice in a row, and the budget, the tax rate and the allocation of homes all go to the assembly's vote, with weighty matters first talked through at neighbourhood meetings. Commune residents vote in the territorial elections like everyone else, and it is here that the Commune Movement wins its members of the assembly."

