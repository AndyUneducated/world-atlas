    lean: { rice: 1.0, spice: 0.6, fruit: 0.6, agriculture: 0.8, urban: -0.6 }
    notes:
      zh: "梯田农民党（简称梯田）代表长夏群岛的稻农、香料园主和果农，属中右翼，党员两万一千人。它主张为稻米、香料和水果设收购保护价，由领地维护山区梯田的灌溉水渠，禁止把农地改作工业和住宅用地，农户子女上大学免学费。它的选民集中在内陆山区和平原的稻作区，那里的梯田一级一级修到山顶，水从最高的一级流下来，依次灌溉每一块田。口号「一级一级往上走」既是说梯田，也是说党的主张：不求一步登天。党名原本只有「梯田」二字，后来加上「农民」，是为了把香料园和果园的种植户也包括进来——山下的园主们曾抱怨，一个只叫梯田的党好像只管山上的稻子。\n梯田的保守主义是一种土地上的保守主义。它要守住的是水渠的规矩、田埂的界线和村里的长幼之序，而非某种抽象的意识形态。但这种保守里藏着它内在的矛盾：保护价意味着领地财政的长期补贴，与它在税收上的中右翼立场并不完全合拍；禁止农地转用保护了梯田，却也让一些想卖地进城的农户子女心生怨言。党内年长的稻农希望一切照旧，年轻的种植户则希望引进小型农机和合作社冷链，把香料和水果卖到更远的地方。党首帕拉瓦伊·特鲁韦尔的办法是把争论交给水渠协会：每个提案先拿到地方的用水会议上讨论，用老农的话说，「水往哪儿流，票就往哪儿投」。\n在长夏群岛领地议会121席中，梯田占11席，得票8.0%，属反对派。它的友党有全领地联邦联盟、王旗君主主义同盟，以及执政的伊武兰民族复兴党。这种跨越朝野的友谊让梯田在野而不完全在外：在梯田和水渠修缮的拨款上，它常常与复兴党一起投票，帮政务院的提案过关；在税收和土地规划上，两党却常常对立，议员们自称「同一块田里的两头牛」。它与公地共产党的分歧更深，后者的土地公有和合作社构想，在小农看来是要把世代相传的田交给别人来管。梯田在稻作城市的市议会里实力不俗：温达坎市议会49席中它占9席，是它在各市议会中议席最多的地方，彭纳拉姆有7席，纳卢迈也有7席；在城市化程度高的地方，它的支持明显减少，在埃武托拉公社的55席中只有2席。\n梯田的政治文化跟着农时走。党代会在收割之后召开，代表们带来各自村里的新米，在会场外摆成一排，散会前评出当年的「头等米」；每年插秧季，党首都要下田插一天秧，照片会登在党报的头版。党员里年长的稻农居多，党报副刊每期都登一份当季的农事历。党旗是三道深浅不同的绿色横条，从上到下由深到浅，中间一道上用白线勾出层层梯田。总书记唐书瑶领导的党部有一项不起眼却要紧的工作：每年收集各地水渠协会的用水记录，整理成册交给党的议员，凡是涉及水的法案，议员们都要先翻这本册子。"
      en: "The Terrace Farmers' Party (Terrace for short) speaks for the Everlong Summer Islands' rice farmers, spice growers and fruit farmers, a party of the centre-right with 21,000 members. It wants guaranteed purchase prices for rice, spices and fruit, the hill terraces' irrigation channels kept up by the territory, no rezoning of farmland for industry or housing, and free university tuition for farmers' children. Its voters are concentrated in the rice-growing districts of the inland hills and plains, where terraces climb step by step to the hilltops and water runs down from the highest, watering each field in turn. Its slogan, 'One step at a time', is about the terraces and about the party's outlook: no leap to the sky. Its name was once just 'Terrace'; 'Farmers' was added to bring in the spice and fruit growers, after planters down in the valleys complained that a party called only Terrace seemed to care only for the rice on the hills.\nThe party's conservatism is a conservatism of the land. What it wants to keep is the rule of the channels, the line of the field banks and the order of age in the village, not any abstract ideology. But that conservatism hides its own contradiction: guaranteed prices mean a lasting subsidy from the territorial budget, which sits awkwardly with its centre-right stance on tax, and the ban on rezoning protects the terraces but leaves some farmers' children, who would like to sell up and move to town, resentful. Older rice farmers want everything to stay as it is; younger growers want small machines and cooperative cold chains to sell spices and fruit further afield. The leader, Pallavai Teruvel, hands the argument to the channel associations: every proposal is first discussed at a local water meeting, or as old farmers put it, 'the vote goes where the water flows'.\nTerrace holds 11 of the territorial assembly's 121 seats on 8.0% of the vote and sits in opposition. Its allies are the All-Territories Federal Union, the Royal Banner Monarchist League and Ivuran National Renewal, which is in government. That friendship across the floor means Terrace is in opposition without being wholly outside: on money for terrace and channel repairs it often votes with Renewal and helps the cabinet's bills through, while on tax and land planning the two often clash, and their members call themselves two oxen in the same field. Its differences with the Commons Communist Party run deeper; to smallholders, the Commons' plans for public land and cooperatives look like handing fields passed down for generations to someone else to run. Terrace is a real force on the councils of rice-growing cities: it holds 9 of Undakan's 49 seats, its largest group on any city council, 7 in Pennaram and 7 in Nalumai. In more urban places its support falls away, and it holds just 2 of the 55 seats in Evutola Commune.\nThe party's political culture follows the farming year. Congress meets after the harvest; delegates bring new rice from their villages, set it out in a row outside the hall and, before leaving, choose the year's 'first rice'. Every planting season the leader spends a day planting rice in the fields, and the photograph goes on the front page of the party paper. Most members are older rice farmers, and every issue of the paper's supplement carries the season's farming calendar. The flag has three green stripes, darkest at the top and lightest at the bottom, with tiers of terraces drawn in white across the middle one. The party office under the general secretary, Tang Shuyao, has a modest but vital job: each year it gathers the water records of the channel associations and binds them into a book for the party's members of the assembly, who are expected to consult it before voting on any bill about water."
    history:
      zh: "梯田农民党由几个山区的灌溉水渠协会联合组建。这些协会管理梯田的用水已经有很多代了，规矩是水从最高的一级流下，谁也不许截流。当山下的城市开始扩建、农地被一块块划走时，各协会的长老们发现，靠村里的规矩已经护不住水源和田地，于是联合起来组建了梯田党。后来香料园主和果农陆续加入，党也改为现名，把「农民」写进党名，表示它代表的不只是山上的稻农。"
      en: "The party was formed by the irrigation channel associations of several hill districts, which had managed the terraces' water for many generations under one rule: water flows down from the highest tier, and no one may divert it. When the cities below began to spread and farmland was zoned away plot by plot, the associations' elders saw that village custom could no longer protect the water and the fields, and joined forces to found the Terrace Party. Spice and fruit growers joined later, and the party took its present name, writing 'farmers' into it to show it speaks for more than the rice growers on the hills."
    flag_notes:
      zh: "党旗由三道横条组成，从上到下是深绿、中绿和浅绿，中间一道上用白线勾出几级梯田的轮廓。三种绿色分别代表山顶的森林、山腰的稻田和山脚的香料园与果园，意思是一座山从上到下都要照顾到；白线是水渠里流动的清水，也是一级连着一级的田埂。图案最早绣在水渠协会的会旗上。"
      en: "The flag has three horizontal stripes, dark, mid and light green from top to bottom, with the outline of several terrace tiers drawn in white across the middle one. The three greens stand for the forest on the summit, the rice fields on the slopes and the spice gardens and orchards at the foot, meaning that a mountain must be cared for from top to bottom; the white lines are the clear water in the channels and the field banks linking tier to tier. The design was first embroidered on the channel associations' banners."
    factions:
      - names: { zh: "水渠长老派", en: "Channel Elders" }
        notes: { zh: "以水渠协会的长老和年长稻农为主，坚守农地不得转用和收购保护价，看重村社的用水规矩，对城市扩张和农业商业化都抱有戒心，是党的传统核心。", en: "The party's traditional core, mostly channel association elders and older rice farmers, who hold fast to the ban on rezoning and to guaranteed prices, value the villages' water rules and are wary of both urban sprawl and commercial farming." }
      - names: { zh: "香料果园圈", en: "Spice and Orchard Circle" }
        notes: { zh: "山下的香料园主和果农，主张拓展出口、改善冷链和道路，对市场更开放，在税收问题上更接近全领地联邦联盟。", en: "Spice growers and fruit farmers from the lowlands who want wider exports and better cold chains and roads, are more open to the market and stand closer to the All-Territories Federal Union on tax." }
      - names: { zh: "青年农人论坛", en: "Young Farmers' Forum" }
        notes: { zh: "年轻的种植户和农户子女，主张推广小型农机和农业合作社，允许有限度的农地流转，希望党在社会议题上更开放一些，以留住想回乡种地的年轻人。", en: "Young growers and farmers' children who want small machinery and farm cooperatives, limited transfers of farmland and a more open party on social questions, to keep young people who want to come back and farm." }
    organisation:
      newspaper: { zh: "《梯田农报》", en: "The Terrace Gazette" }
