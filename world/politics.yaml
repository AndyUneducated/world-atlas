    policies: [{"zh": "每个街区都有公立学校、图书馆和社区诊所", "en": "A state school, a library and a clinic in every neighbourhood"}, {"zh": "填海新区一半用于公共住房和公园", "en": "Give half the reclaimed land to public housing and parks"}, {"zh": "大议会议员公开财产和商业利益", "en": "Make Great Council members declare their wealth and business interests"}, {"zh": "改善渡轮和地铁，连接小岛和主岛", "en": "Improve the ferries and the metro linking the small island to the main one"}]
    allies: ["pty_h3247c"]
