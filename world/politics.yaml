    youth_wing: {"zh": "家园青年团", "en": "Homeland Youth"}
    slogan: {"zh": "一个上帝，一个家，一片土地", "en": "One God, one home, one land"}
    policies: [{"zh": "家庭补贴按子女人数递增，三代同堂的家庭减免房产税", "en": "Raise family allowances with each child and exempt three-generation households from property tax"}, {"zh": "公立学校保留晨祷和圣经课，家长可以选择宗教学校并获得学费补助", "en": "Keep morning prayer and Bible classes in state schools, and fund parents who choose church schools"}, {"zh": "停火线以北不让一寸土地，联邦陆军保持全岛规模最大", "en": "Yield not an inch north of the ceasefire line, and keep the Federal Army the largest on the island"}, {"zh": "教会兴办的医院和孤儿院享受与公立机构同等的拨款", "en": "Fund church hospitals and orphanages on the same terms as public ones"}]
