    youth_wing: {"zh": "青年信仰团契", "en": "Young Fellowship of Faiths"}
    slogan: {"zh": "每一种信仰都有一个家", "en": "A home for every faith"}
    policies: [{"zh": "宗教学校与世俗学校享受同等拨款", "en": "Fund religious schools equally with secular ones"}, {"zh": "各宗教社区自行管理婚姻登记和宗教节日", "en": "Let each faith community register its own marriages and keep its own festivals"}, {"zh": "宗教建筑和圣地列入国家保护名录", "en": "Put religious buildings and holy places on the national heritage list"}, {"zh": "社区慈善机构参与难民安置，享受税收减免", "en": "Bring community charities into refugee settlement, with tax relief"}]
    allies: ["pty_tg50gk"]
    targets: {"div_gebca7": 28}
    lean: {"old": 1.8, "urban": -0.3, "lang:art-x-kasiri": 0.5}
    notes: {"zh": "信仰社区联盟是萨马伊自由邦议会的第三大党，也是自由民主党的执政伙伴。它由天主教、新教、伊斯兰教、佛教和祖灵信仰的社区组织联合组成，是全岛唯一由多个宗教共同组建的政党。党首沃阿汉吉·拉贝是一位天主教修女出身的社会工作者，在首都经营一家各宗教合办的孤儿院，联盟的副主席则轮流由伊玛目和佛教住持担任。党员约二万八千，大多通过教会、清真寺和寺庙入党。\n联盟的口号是「每一种信仰都有一个家」。它主张宗教学校与世俗学校享受同等拨款；各宗教社区自行管理婚姻登记和宗教节日；宗教建筑和圣地列入国家保护名录；社区慈善机构参与难民安置，并享受税收减免。在社会问题上，联盟偏向保守，反对放宽堕胎，主张维护家庭；但它坚决支持宗教自由，认为保守的信仰与自由的国家可以共存。\n在联合政府中，联盟掌管外交、国防、劳动和社会保障、自然资源四个部，党首拉贝出任国防部长，把维和与救灾定为国防军的首要任务；联盟还推动了宗教学校同等拨款的法案。联盟内部各宗教之间也有分歧：伊斯兰社区更关心福利和难民，常与社会民主党合作；新教和天主教社区更关心家庭政策；祖灵信仰的社区则希望保护圣林和祖先墓地。每当有法案涉及某一宗教，联盟都要先召开各社区的联席会议。\n信仰联盟的组织与各宗教社区紧密相连：每个教区、清真寺和寺庙都可以成立一个联盟小组，各宗教社区在联盟的全国理事会中按人数分配席位。党首由全国理事会选出，章程规定党首和第一副主席不得出自同一宗教，候选人名单也须按各宗教社区的人数轮流排列。联盟的经费来自党费、各宗教社区的捐款和慈善义卖，它不接受酒类和赌博企业的捐款。联盟最重要的内部机构是「联席会议」，凡涉及宗教的法案，都要先在联席会议上取得各社区代表的一致意见，否则联盟的议员可以自由投票。青年信仰团契每年组织各宗教青年轮流参观彼此的礼拜场所，并一起为难民营做义工。\n联盟的选民年龄偏大，遍布全国的宗教社区，在说卡西里语的伊斯兰社区和乡村教区最强。每年三环节的前一晚，联盟在首都的广场上举行联合祈祷，牧师、伊玛目和僧侣依次领祷，然后大家一起点燃灯笼。党旗是紫色的旗面，中间一本金色的书，代表各宗教的经典，也代表联盟章程里写着的那句话：「我们读不同的书，住同一座岛。」", "en": "The Alliance of Faith Communities is the third party in Samay's parliament and the Liberal Democrats' partner in government. It joins the community organisations of Catholics, Protestants, Muslims, Buddhists and the ancestral religion, and is the only party on the island founded by several faiths together. Its leader, Voahangy Rabe, a former Catholic sister turned social worker, runs an orphanage in the capital shared by all the faiths, and the Alliance's deputy chair is held in turn by an imam and a Buddhist abbot. Its 28,000 or so members mostly join through their church, mosque or temple. \nIts watchword is 'a home for every faith'. It wants religious schools funded equally with secular ones; each faith community to register its own marriages and keep its own festivals; religious buildings and holy places put on the national heritage list; and community charities brought into refugee settlement, with tax relief. On social questions it leans conservative, opposing easier abortion and defending the family, but it stands firmly for religious freedom, holding that conservative faith and a free state can live together. \nIn government the Alliance holds four ministries, foreign affairs, defence, labour and natural resources; its leader Rabe is defence minister and has made peacekeeping and disaster relief the Defence Force's first tasks, and the Alliance carried the bill for equal funding of religious schools. The faiths within it differ too: the Muslim community cares more for welfare and refugees and often works with the Social Democrats; the Protestant and Catholic communities care more for family policy; and the communities of the ancestral religion want the sacred groves and ancestral tombs protected. Whenever a bill touches one faith, the Alliance first holds a joint meeting of all its communities. \nThe Faith Alliance is closely bound to the faith communities: every parish, mosque and temple may form an Alliance group, and each community holds seats on the national board in proportion to its members. The board elects the leader, and its rules forbid the leader and first deputy from belonging to the same faith; candidate lists rotate among the communities by their numbers too. Money comes from dues, gifts from the faith communities and charity sales; it refuses money from drink and gambling firms. Its most important body is the Joint Meeting: any bill touching religion must first win the agreement of every community's delegates there, or the Alliance's members of parliament may vote as they please. The Young Fellowship of Faiths takes young people of each faith to visit one another's places of worship in turn, and volunteers together in the refugee camp.\nIts voters are older and found in faith communities across the country, and it is strongest among the Kasiri-speaking Muslims and in the rural parishes. On the eve of the Festival of the Three Rings each year the Alliance holds a joint prayer in a square of the capital, a pastor, an imam and a monk leading in turn, after which everyone lights lanterns together. Its flag is purple with a gold book, the scriptures of every faith and the line in its charter: 'We read different books and live on one island.'"}
    history: {"zh": "信仰社区联盟由各宗教的社区组织在自由邦的制宪会议上联合组建。各宗教的代表一起争取了宗教学校和宗教节日的宪法地位，会后决定以一个联合政党参选。", "en": "The Alliance of Faith Communities was formed by the community organisations of the faiths at the Free State's constituent assembly. Their delegates together won a place in the constitution for religious schools and festivals, and afterwards decided to stand as one party."}
    flag_notes: {"zh": "党旗是紫色的旗面，中间一本金色的书。紫色是各宗教共同的庄严之色，书代表各宗教的经典。", "en": "The flag is purple with a gold book. Purple is a colour of solemnity shared by the faiths; the book is the scriptures of every faith."}
    factions: [{"names": {"zh": "教区派", "en": "Parish Wing"}, "notes": {"zh": "天主教和新教的教区，最关心家庭政策和教会学校。", "en": "The Catholic and Protestant parishes, who care most about family policy and church schools."}}, {"names": {"zh": "清真寺派", "en": "Mosque Wing"}, "notes": {"zh": "说卡西里语的伊斯兰社区，最关心福利、难民和伊斯兰学校，常与社会民主党合作。", "en": "The Kasiri-speaking Muslim communities, who care most about welfare, refugees and Islamic schools, and often work with the Social Democrats."}}]
    organisation: {"newspaper": {"zh": "《三环周刊》", "en": "Three Rings Weekly"}, "think_tank": {"zh": "宗教与公共生活研究所", "en": "Institute for Religion and Public Life"}, "women": {"zh": "各宗教妇女协会", "en": "Interfaith Women's Association"}}
