    policies: [{"zh": "码头工人、渔民和盐工享有统一的最低工资和医疗保险", "en": "One minimum wage and health insurance for dockers, fishers and salt workers"}, {"zh": "难民营的居民可以合法工作，孩子可以上公立学校", "en": "Let the people of the refugee camps work legally and their children attend state schools"}, {"zh": "丁香和腰果园的雇工有权组织工会", "en": "Give the hired hands of the clove and cashew farms the right to unionise"}, {"zh": "国家投资修建港口城市的廉租房", "en": "Build public rented housing in the port towns"}]
    targets: {"div_t5zph6": 27}
