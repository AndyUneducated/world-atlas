    leader: { zh: 哈尔瓦·斯特兰莫, en: Hallvar Strandmo }
    members: 12000
    youth_wing: { zh: 渔农青年, en: Young Fishers and Farmers }
    slogan: { zh: 有人种地，有人出海，才有饭吃, en: "Someone sows, someone sails, everyone eats" }
    policies:
      - { zh: 渔业配额按港口分配，优先留给本地小船, en: "Share fishing quotas by harbour, first to local small boats" }
      - { zh: 农场、牧场和渔船的燃料与电价补贴, en: "Subsidise fuel and power for farms, pastures and fishing boats" }
      - { zh: 每个乡镇保留一所学校、一个邮局和一家诊所, en: "Keep a school, a post office and a clinic in every rural township" }
      - { zh: 本地农渔产品进入学校和医院食堂, en: Local farm and fish produce in school and hospital canteens }
    allies: [pty_mak5vy, pty_xmdckb, pty_vxz9jt]
    targets: { div_fbfqv9: 3, div_raat4g: 1.5, div_hpmerr: 1.5 }
    lean: { fishing: 0.8, agriculture: 0.8, dairy: 0.7, herding: 0.6, forestry: 0.5, aquaculture: 0.5, urban: -0.8 }
    notes:
      zh: "渔农党是一个把两种生计拴在一起的政党：内陆的奶农、牧民和林业工人，沿海的渔民和养殖户。它的口号「有人种地，有人出海，才有饭吃」说的是一种互相依存的乡村秩序，可这两半的利益并不总是一致。渔民要的是按港口分配、优先留给本地小船的渔业配额，农民要的是饲料、燃料和电价补贴；海湾里的养殖场既是渔村的新饭碗，又被捕捞渔民视为抢占渔场的对手。党在经济上居中，社会议题上偏传统，在生态与增长之间偏向增长，党内难解的问题是怎样面对能源转型：燃料补贴是乡村的命脉，却与减排的方向相反。党的回答是「先保住乡镇，再谈转型」，主张每个乡镇保留一所学校、一个邮局和一家诊所，本地农渔产品进入学校和医院食堂，让乡村先有留得住人的理由。\n在北维京岛的领地议会选举中，渔农党拿到百分之三的选票，跨不过百分之五的门槛；在维京群岛和北冰洋，它都只有百分之一点几。它的力量在市议会里：雅利基卢克市议会二十四席中有它三席，它与社会民主互助工党、全领地联邦联盟一起执政，在领地议会里分属执政与反对两边的两个大党，在这座小城里靠渔农党才坐到一张桌上。市里的渔港冷库和牧场饲料仓都是它在联合协议里争来的，代价是接受了一份它并不热心的气候规划。在马斯林山市议会，它有三席，坐在反对席上，常就乡镇诊所和道路预算与执政联盟讨价还价。在议会之外，它更像一张合作社网络：乳品合作社、渔民协会和乡镇诊所的请愿，往往由它的党员牵头。\n它的选民集中在乡村、渔港、种植业、林业、乳业和畜牧地区，城市里得票很低。北维京岛内陆的乳品合作社和沿海渔村是它的根基；在维京群岛，它更多与友党小岛联邦党配合，而不是与之争票；在北冰洋，它的支部守在几个渔港。它与高地牧场联盟是友党，两党常被问为什么不合并，回答通常是：一个看海，一个看山。党旗由绿、蓝两条色带组成，绿带上是麦穗，旁边一条白鱼，党员自嘲「我们的党旗能做一顿饭」。\n渔农党的会议时间表要迁就挤奶和潮汐，支部会议常在傍晚退潮之后开。每年秋收后的党代会在一个农场的谷仓里召开，会场一边坐渔民，一边坐农民，发言轮流进行；会后的晚宴只用代表们自己带来的东西，有人带奶酪，有人带一桶鱼，没有人知道最后会吃到什么。党首哈尔瓦·斯特兰莫习惯在大会开幕时报告当年的鱼获和收成，再报告党员人数，他说这才是正确的顺序。"
      en: "The Fishers and Farmers Party ties two livelihoods together: the dairy farmers, herders and forestry workers of the interior, and the fishers and fish farmers of the coast. Its slogan, someone sows, someone sails, everyone eats, describes a rural order of mutual dependence, but the two halves do not always want the same things. Fishers want quotas shared out by harbour and kept first for local small boats; farmers want help with feed, fuel and power prices; and the fish farms in the bays are at once a new livelihood for fishing villages and, to the boats that work the open sea, a rival for their grounds. The party sits in the centre on economics, leans traditional on social questions and towards growth over ecology, and its knottiest question is the energy transition: fuel subsidies are the lifeblood of the countryside and run against the drive to cut emissions. Its answer is to save the townships first and talk about transition afterwards: a school, a post office and a clinic in every township, and local produce and fish in school and hospital canteens, so that the countryside first has reasons for people to stay.\nAt North Viking Island's territorial election the party won three per cent, short of the five-per-cent threshold; in the Viking Islands and the Arctic Ocean it took only one and a bit per cent. Its strength is on the councils. It holds three of Jaalikiluk's 24 seats and governs there with the Social Democratic Mutual Aid Labour Party and the All-Territories Federal Union: two large parties that face each other across the territorial parliament share a table in this small city only because the Fishers and Farmers sit between them. The harbour cold store and the pasture feed barn were both won in the coalition agreement, at the price of accepting a climate plan the party was lukewarm about. On Maslin Mountain's council it has three seats in opposition, where it bargains with the governing coalition over township clinics and road budgets. Outside the chambers it works more like a network of cooperatives: petitions from dairy cooperatives, fishers' associations and township clinics are often led by its members.\nIts voters are in the countryside, the fishing harbours and the farming, forestry, dairy and herding districts, and it polls very little in the cities. The dairy cooperatives of North Viking Island's interior and the fishing villages of its coast are its roots; in the Viking Islands it works with its ally the Small Isles Federal Party rather than competing for its votes; in the Arctic Ocean its branches hold on in a few fishing harbours. Its ally the Upland Pasture Union is often asked why the two do not merge, and the usual answer is that one watches the sea and the other watches the hills. The flag is made of a green band and a blue band, with an ear of wheat on the green and a white fish beside it, and members joke that their flag makes a meal.\nParty meetings bend to the milking and the tides, and branches often meet in the evening once the tide has gone out. The congress after each harvest is held in a farm's barn, with fishers on one side and farmers on the other, speaking in turn; the dinner afterwards is made only from what the delegates bring, so some bring cheese, some bring a pail of fish, and no one knows what the meal will be. Party leader Hallvar Strandmo opens each congress by reporting the year's catch and harvest before the membership figures, which he says is the proper order."
    history:
      zh: "渔农党由北维京岛内陆的乳品合作社和沿海的渔民协会联合组建。两边起初只是在一次燃料涨价中联手请愿，发现彼此的诉求可以写进同一份纲领，于是决定合成一个党。后来它在维京群岛的小岛和北冰洋的渔港也建立了支部，并在雅利基卢克等乡村城市的市议会里站稳了脚跟。"
      en: "The party was formed by the dairy cooperatives of North Viking Island's interior and the fishers' associations of its coast. The two first joined forces in a petition over rising fuel prices, found that their demands fitted into one programme and decided to become one party. It later set up branches on the small islands of the Viking Islands and in the Arctic Ocean's fishing harbours, and gained a firm footing on the councils of rural cities such as Jaalikiluk."
    flag_notes:
      zh: "党旗由一条草绿色和一条海蓝色的色带组成，绿带代表田野和牧场，蓝带代表海洋和渔场。绿带上是一穗麦子，旁边游着一条白色的鱼，分别代表种地的人和出海的人。设计者说，两条色带并排而不分高下，是要说明农民和渔民在党内地位相同。党员则自嘲这面旗「能做一顿饭」。"
      en: "The flag has a grass-green band and a sea-blue band: the green for fields and pastures, the blue for the sea and the fishing grounds. On the green is an ear of wheat with a white fish beside it, for those who sow and those who sail. The designers say the two bands sit side by side with neither above the other, because farmers and fishers stand as equals in the party. Members simply joke that the flag makes a meal."
    factions:
      - names: { zh: "港口派", en: "Harbour Wing" }
        notes: { zh: "以沿海渔民协会为基础，首先看重按港口分配配额和保护本地小船，对海湾养殖场的扩张保持警惕，主张渔业政策由港口委员会而不是领地部门决定。", en: "Rooted in the coastal fishers' associations, it cares above all about quotas shared out by harbour and protection for local small boats, is wary of the spread of fish farms in the bays, and wants fishing policy set by harbour committees rather than territorial departments." }
      - names: { zh: "谷仓圈", en: "Barn Circle" }
        notes: { zh: "内陆乳品合作社和种植户的圈子，关心饲料、电价和乡镇服务，倾向于与全领地联邦联盟合作，也是推动与高地牧场联盟联合竞选的主要力量。", en: "The circle of inland dairy cooperatives and crop farmers, concerned with feed, power prices and township services; it leans towards working with the All-Territories Federal Union and is the main force behind a joint list with the Upland Pasture Union." }
      - names: { zh: "绿色乡村论坛", en: "Green Countryside Forum" }
        notes: { zh: "党内较年轻的一翼，主张把补贴从燃料逐步转向渔船电气化、农场沼气和本地能源合作社，愿意与绿脉党对话。成员多是渔农青年和返乡创业的年轻人。", en: "The party's younger wing, which wants subsidies moved gradually from fuel to electric boats, farm biogas and local energy cooperatives, and is open to talks with Greenvein. Its members are mostly from Young Fishers and Farmers and young people who have come home to start businesses." }
    organisation:
      newspaper: { zh: "《潮汐与收成》", en: "Tide and Harvest" }
      think_tank: { zh: "乡镇未来研究会", en: "Township Futures Institute" }
      unions: { zh: "沿海渔民协会、内陆乳品合作社联合会", en: "Coastal Fishers' Association, Federation of Inland Dairy Cooperatives" }
      women: { zh: "渔农妇女会", en: "Fishers and Farmers Women's Guild" }

  - id: pty_k4krwn
    names: { zh: 长屋党, en: Longhouse Party }
    short_names: { zh: 长屋, en: "Longhouse" }
    color: "#2C3E50"
    flag: { layout: banner, colors: ["#2C3E50"], charge: longhouse, charge_color: "#C9A227" }
    spectrum: 2.0
    family: { zh: 保守派, en: Conservative }
    ideology: [{ zh: 传统保守主义, en: Traditional conservatism }, { zh: 文化保守主义, en: Cultural conservatism }, { zh: 地方主义, en: Localism }]
    axes: { econ: 6.5, galtan: 8.0, autonomy: 3.0, green: 6.0 }
    leader: { zh: 埃斯特丽·豪厄伦, en: Eystrid Haugelund }
    members: 11000
    youth_wing: { zh: 长屋少年团, en: Longhouse Youth }
    slogan: { zh: 守住炉火, en: Keep the hearth }
    policies:
      - { zh: 维京语在学校里与中文同课时, en: Teach Viking for as many hours as Chinese in schools }
      - { zh: 古城、长屋遗址和老船坞列入保护名录，禁止拆除, en: "List the old towns, longhouse sites and old boatyards for protection, with no demolition" }
      - { zh: 有三个以上孩子的家庭减免所得税, en: Income tax relief for families with three or more children }
      - { zh: 地方节庆和传统航海活动由领地资助, en: Territorial funding for local festivals and traditional sailing }
    allies: [pty_mak5vy, pty_hwkmx1]
    targets: { div_fbfqv9: 4.6, div_raat4g: 2.5 }
    lean: { "lang:art-x-viking": 2.0, heritage: 0.3, old: 2.0, urban: -0.3, fishing: 0.2 }
    notes:
      zh: "长屋党是北维京岛和维京群岛的传统保守派，主张维京语在学校里与中文同课时，古城、长屋遗址和老船坞列入保护名录、禁止拆除，有三个以上孩子的家庭减免所得税，地方节庆和传统航海活动由领地资助。它的保守主义首先是文化的：守住语言、守住老城、守住一家几代人围着火塘过日子的方式。这也带来了党内的张力。一方面，它在经济上偏右，主张减税、精简领地机构；另一方面，它的几乎每一条主张都要花公共的钱，从修船坞到资助节庆。另一重张力在于与大党的关系：友党全领地联邦联盟在领地议会里是反对党，长屋党的不少老选民同时也投联邦联盟，党内一直有人主张干脆并入对方的名单，另一些人则认为一旦合并，维京语和老城就会沦为大党纲领里的一行脚注。\n在北维京岛上一次领地议会选举中，长屋党拿到百分之四点六的选票，是没进议会的党里得票最高的，离百分之五的门槛只差一点。党部把那一晚称作「差一桨之夜」，此后每次大会都会提起。在维京群岛的单议席选区制下，它只有百分之二点四，主要配合友党蓝桨保守党竞选。它在维京港、勒克尔、洛龙山和雅利基卢克的市议会里都有席位，在勒克尔和洛龙山各有五席，但哪里都不执政。它的影响力来自议会之外：老船坞免于拆除，是它发动居民签名、堵在推土机前换来的；在维京港市议会，它与执政的海港运动在老城保护上常投同一张票，尽管两党在别的问题上分歧很深。批评者说它反对的东西多，建设的东西少；它的回答是「有些东西拆了就再也没有了」。\n长屋党的选民是维京语母语者、年长的居民、乡村和渔村，以及古城、遗址和博物馆集中的地方，在城市里得票很低。维京语使用者多的老城镇是它的根据地，年轻人和新来的居民则很少投它。党名来自维京时代的长屋：一家几代人和来客都睡在同一个屋顶下，中间是一条长长的火塘；口号「守住炉火」由此而来。党旗是深蓝旗面上一座金色的长屋。\n长屋党的党代会在一间长厅里召开，代表们沿一张长桌对坐，按传统由年长的代表先发言。开幕时，代表们一起点燃一只铁火盆，闭幕时由最年轻的代表把它熄灭，党内说这是「把火交给下一代，也让下一代学会收火」。「差一桨之夜」之后，长屋少年团在每次竞选结束时都要划一次船，船上空出一支桨的位置，提醒大家还差那一下。党首埃斯特丽·豪厄伦的演讲总要用维京语开头、中文结尾，她说这样两种听众都会听完。"
      en: "The Longhouse Party is the traditional conservative party of North Viking Island and the Viking Islands. It wants the Viking language taught for as many hours as Chinese in schools, the old towns, longhouse sites and old boatyards listed and protected from demolition, income tax relief for families with three or more children, and local festivals and traditional seafaring events funded by the territory. Its conservatism is first of all cultural: keeping the language, keeping the old towns, keeping the way of life of several generations around one hearth. That brings its own tensions. On economics it leans right, wanting lower taxes and leaner territorial institutions, yet almost every one of its demands costs public money, from mending boatyards to funding festivals. Another tension lies in its relations with the larger parties. Its ally the All-Territories Federal Union is the opposition in the territorial parliament, and many older Longhouse voters also vote for the Federal Union; some in the party have long argued for simply joining its list, while others believe that once merged, the Viking language and the old towns would shrink to a footnote in a big party's programme.\nAt North Viking Island's last territorial election the Longhouse Party took 4.6 per cent, the highest share of any party left out of parliament and only just short of the five-per-cent threshold. The party calls that evening the night of the missing oar stroke, and it comes up at every congress since. Under the Viking Islands' single-member system it won only 2.4 per cent and mostly campaigns in support of its ally the Blue Oar Conservatives. It holds seats on the councils of Viking Port, Lekor, Lorond Mountain and Jaalikiluk, five each in Lekor and Lorond Mountain, but governs nowhere. Its influence comes from outside the chambers: the old boatyards were saved because it gathered residents' signatures and stood in front of the bulldozers, and on Viking Port's council it often votes with the governing Harbour Movement on protecting the old town, though the two disagree deeply on much else. Critics say it opposes more than it builds; its answer is that some things, once pulled down, are gone for good.\nIts voters are native Viking speakers, older residents, the countryside and fishing villages, and places rich in old towns, heritage sites and museums; it polls very little in the cities. The old towns where Viking is widely spoken are its home ground, while young people and newcomers rarely vote for it. The name comes from the Viking-age longhouse, where several generations and their guests slept under one roof along a single long hearth, and the slogan, keep the hearth, follows from it. The flag is a gold longhouse on a deep blue field.\nThe congress meets in a long hall, with delegates facing each other down one long table, and by custom the eldest speak first. It opens with the delegates lighting an iron brazier together and closes with the youngest delegate putting it out, which the party describes as handing the fire to the next generation and teaching it to bank the fire too. Since the night of the missing oar stroke, Longhouse Youth row a boat at the end of every campaign with one oar's place left empty, to remind everyone of the stroke still missing. Party leader Eystrid Haugelund always begins her speeches in Viking and ends them in Chinese, so that, she says, both audiences stay to the end."
    history:
      zh: "长屋党由北维京岛的维京语协会和几个老城保护团体组建，最初的目标是阻止拆除维京港的老船坞。那场保卫战打赢之后，发起人发现各地的老城都面临同样的问题，于是把一个临时联盟办成了政党。维京群岛的支部由长船古城的居民协会发起，后来与友党蓝桨保守党在选区里分工合作。"
      en: "The Longhouse Party was formed by North Viking Island's Viking language society and several old-town conservation groups, its first aim being to stop the demolition of Viking Port's old boatyards. Once that fight was won, the founders found that old towns everywhere faced the same threat, and turned a temporary alliance into a party. Its Viking Islands branch was started by the residents' association of Longship's old town, and later divided the constituencies with its ally the Blue Oar Conservatives."
    flag_notes:
      zh: "党旗是深蓝色的纯色旗面，中间一座金色的长屋。深蓝代表北方的夜和海，金色是火塘的光，也是老船坞里桐油木料的颜色。长屋象征一家几代人和来客同在一个屋顶下，正是党名和口号「守住炉火」的来源。党员说，旗面上只画屋子不画人，是因为屋子在，人就会回来。"
      en: "The flag is a plain deep blue field with a gold longhouse in the centre. The blue stands for the northern night and sea; the gold is the glow of the hearth and the colour of oiled timber in the old boatyards. The longhouse stands for several generations and their guests under one roof, the source of both the party's name and its slogan, keep the hearth. Members say the flag shows the house and not the people because, as long as the house stands, the people will come back."
    factions:
      - names: { zh: "火塘派", en: "Hearth Wing" }
        notes: { zh: "党内的文化保守核心，把维京语教育、老城保护和家庭政策放在首位，坚持长屋党独立竞选，反对并入任何大党名单。成员多是维京语教师、老城居民和年长的党员。", en: "The party's cultural-conservative core, which puts Viking-language schooling, old-town protection and family policy first, insists on Longhouse standing alone and opposes merging into any larger party's list. Its members are mostly Viking teachers, old-town residents and older members." }
      - names: { zh: "联邦合作派", en: "Federal Cooperation Group" }
        notes: { zh: "主张与全领地联邦联盟签订选举协议，甚至联合提名，以换取跨过门槛和进入议会的机会；在经济上更看重减税和精简机构。成员多是市议员和小企业主。", en: "Wants an electoral pact with the All-Territories Federal Union, even joint candidacies, in exchange for a path over the threshold and into parliament; on economics it cares more about tax cuts and leaner institutions. Its members are mostly councillors and small business owners." }
      - names: { zh: "船坞俱乐部", en: "Boatyard Club" }
        notes: { zh: "由修船匠、渔民和传统航海爱好者组成，关心老船坞、木船工艺和航海节庆，政治上较务实，愿意在遗产保护问题上与海港运动乃至绿脉党合作。", en: "Made up of boatwrights, fishers and traditional seafaring enthusiasts, concerned with old boatyards, wooden boatbuilding and seafaring festivals; it is more pragmatic and willing to work with the Harbour Movement and even Greenvein on heritage protection." }
    organisation:
      newspaper: { zh: "《炉火报》", en: "The Hearth" }
      think_tank: { zh: "长桌研究会", en: "Long Table Society" }
      unions: { zh: "老城居民协会联合会、木船工匠行会", en: "Federation of Old-Town Residents' Associations, Guild of Wooden Boatwrights" }
      women: { zh: "长屋妇女会", en: "Longhouse Women's Guild" }

