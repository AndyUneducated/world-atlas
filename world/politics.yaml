    lean: { mining: 1.0, manufacturing: 0.8, port: 0.3, income: -0.4 }
    notes:
      zh: "冶炼工会党由北冰洋的矿工和冶炼工人工会组建，属左翼。它主张矿山和冶炼厂的工人在董事会占三分之一席位，冶炼厂改用水电和绿氢但不裁员，矿工五十五岁退休，矿区城市的住房由领地统一建设。它的票仓在考尔尼克等矿业和冶炼城市，那里的冶炼厂终年不停，烟囱在极夜里是城市最亮的地方。上一次选举后，它加入了塔夫鲁利特人民党领导的四党联合政府，党首杜铁成出任工业与劳动事务的政务委员；在考尔尼克市议会里，它与塔人党一起执政。工会党的党员证是一块小小的铜牌，用本地冶炼厂的铜铸成，背面刻着持有人的工号。"
      en: "The Smelters' Union was formed by the Arctic Ocean's miners' and smelter workers' unions, a party of the left. It wants a third of the board seats at mines and smelters for their workers, the smelters moved to hydro power and green hydrogen without lay-offs, retirement at fifty-five for miners, and housing in the mining towns built by the territory. Its strongholds are mining and smelting cities such as Qaurniq, where the smelters run all year and the chimneys are the brightest thing in town through the polar night. After the last election it joined the four-party government led by the Tavrulit People's Party, its leader Du Tiecheng becoming the councillor for industry and labour; on Qaurniq's council it governs with the Tavrulit People's Party. A member's card is a small copper plate cast from the local smelter's copper, with the holder's works number stamped on the back."
    history:
      zh: "冶炼工会党由几家冶炼厂的工会在一次长达一个月的罢工后组建，罢工的起因是一座冶炼厂计划关闭。"
      en: "The party was formed by the unions of several smelters after a month-long strike over the planned closure of one of them."

  - id: pty_4ahf45
    names: { zh: 北岸联盟, en: North Shore Alliance }
    short_names: { zh: 北岸, en: "North Shore" }
    color: "#5DA9E9"
    flag: { layout: horizon, colors: ["#0E2A47", "#FFFFFF"], edge: fjord, charge: snowflake, charge_color: "#5DA9E9" }
    spectrum: 0.2
    family: { zh: 地方主义, en: Regionalism }
    leader: { zh: 萨基亚克·努努维克, en: Saqqiaq Nunnuvik }
    members: 2700
    youth_wing: { zh: 北岸青年, en: North Shore Youth }
    slogan: { zh: 冰封的海岸也要通航, en: Even a frozen coast needs ships }
    policies:
      - { zh: 北部海岸冬季每周至少一班破冰补给船, en: At least one icebreaking supply ship a week to the north coast in winter }
      - { zh: 极夜期间北岸居民的电费减半, en: Half-price electricity for north-coast residents during the polar night }
      - { zh: 北岸各镇的诊所配备远程医疗设备和医疗直升机, en: Telemedicine and air ambulances for the north-coast towns' clinics }
      - { zh: 北岸港口的渔获优先在本地加工, en: North-coast catches processed locally first }
    allies: [pty_x004cm, pty_6yj1xj]
    targets: { div_hpmerr: 4 }
    lean: { lat: 0.35, urban: -0.5, fishing: 0.4 }
    notes:
      zh: "北岸联盟代表北冰洋最北部海岸的居民，那里的小镇在冬天要经历几十天的极夜，海面封冻，补给全靠破冰船和飞机。联盟主张冬季每周至少一班破冰补给船、极夜期间电费减半、给北岸各镇的诊所配备远程医疗设备和医疗直升机、让北岸港口的渔获优先在本地加工。它是一个中间派的地方主义政党，在北冰洋议会里有一两个议席，常与执政联盟就北岸的预算讨价还价。联盟的党代会在每年极夜结束后的第一个晴天召开，代表们会先一起到海边看太阳重新升起，再进会场。"
      en: "The North Shore Alliance speaks for the people of the Arctic Ocean's northernmost coast, whose towns go through weeks of polar night each winter while the sea freezes and supplies come only by icebreaker and aircraft. It wants at least one icebreaking supply ship a week in winter, half-price electricity during the polar night, telemedicine and air ambulances for the north-coast clinics, and north-coast catches processed locally first. A centrist regionalist party, it has a seat or two in the Arctic Ocean assembly and often bargains with the government over the north coast's budget. Its congress meets on the first clear day after the polar night ends each year, and the delegates first go down to the shore together to watch the sun come back before going inside."
    history:
      zh: "北岸联盟起于一个冬天：那年的破冰补给船因故障停航了一个月，北岸几个小镇的居民自发组织起来，用渔船和雪地车运送补给，事后决定组党。"
      en: "The Alliance began in a winter when the icebreaking supply ship broke down for a month; the people of several north-coast towns organised themselves to bring supplies by fishing boat and snowmobile, and afterwards decided to form a party."

  # ── 长夏群岛政党 ──
  - id: pty_e7tyeb
    names: { zh: 伊武兰复兴党, en: Ivuran Renewal }
    short_names: { zh: 复兴, en: "Renewal" }
    color: "#D9822B"
    flag: { layout: ivuran, colors: ["#D9822B", "#8E1B3A", "#E9B949", "#FFFFFF"], charge: hornbill, charge_color: "#8E1B3A" }
    spectrum: -0.8
    family: { zh: 民族文化复兴、社会自由主义, en: "Cultural revival, social liberalism" }
    leader: { zh: 塞尔瓦迈·哈努赖, en: Selvamai Hanurai }
    members: 58000
    youth_wing: { zh: 复兴青年, en: Renewal Youth }
    slogan: { zh: 用自己的语言说出自己的名字, en: Say your own name in your own language }
    policies:
      - { zh: 伊武兰语成为长夏群岛的第二官方语言, en: Ivuran as the Everlong Summer Islands' second official language }
      - { zh: 每所学校从一年级起开设伊武兰语课, en: Ivuran lessons in every school from the first year }
      - { zh: 修复古王国的寺庙、水渠和梯田, en: "Restore the old kingdom's temples, channels and terraces" }
      - { zh: 伊武兰语电影、音乐和出版获得领地资助, en: "Territorial funding for Ivuran films, music and books" }
      - { zh: 文化遗产地的门票收入留给所在社区, en: Heritage site ticket revenue to stay with the local community }
    allies: [pty_09zrw1, pty_jh513z, pty_4zctgr]
    targets: { div_nwm019: 14 }
    lean: { "lang:art-x-ivuran": 2.5, rice: 0.3, heritage: 0.4 }
    notes:
      zh: "伊武兰复兴党是长夏群岛讲伊武兰语居民的主要政党，属中左翼，主张让伊武兰语成为第二官方语言、每所学校从一年级起开设伊武兰语课、修复古王国的寺庙、水渠和梯田、资助伊武兰语的电影、音乐和出版。伊武兰语是长夏群岛古王国的语言，许多老城的街名、节日和菜名都来自它，但在城市里，年轻人越来越少在家里说它。复兴党的选民集中在伊武兰语使用者多的老城和稻作区，它是长夏群岛议会的第三大党，与公地联盟、互助党组成执政联盟，在彭纳拉姆、温达坎、洛米兰等城市的市议会里是第一大党，市长也出自复兴党。复兴党的集会上，主持人会先用伊武兰语念出每一位到场者的名字，念错了要当场道歉。党旗上是一只犀鸟，伊武兰人有句老话：「犀鸟记得每一棵结过果的树。」"
      en: "Ivuran Renewal is the main party of the Everlong Summer Islands' Ivuran speakers, centre-left. It wants Ivuran made the second official language, Ivuran lessons in every school from the first year, the old kingdom's temples, channels and terraces restored, and funding for Ivuran films, music and books. Ivuran is the language of the islands' old kingdom, and many old towns' street names, festivals and dishes come from it, but in the cities fewer and fewer young people speak it at home. The party's voters are concentrated in the old towns and rice-growing districts where Ivuran is widely spoken; it is the third party in the assembly and governs with the Commons Alliance and the Mutual Aid Party, and it is the largest party on the councils of Pennaram, Undakan, Lomiran and other cities, whose mayors are its members. At its meetings the chair first reads out the name of everyone present in Ivuran, and apologises on the spot for any name read wrong. Its flag bears a hornbill, after an old Ivuran saying: the hornbill remembers every tree that ever bore fruit."
    history:
      zh: "伊武兰复兴党由一群伊武兰语教师和诗人创立，最初是一个在周末开办伊武兰语课的协会，后来课堂越开越多，协会也成了政党。"
      en: "The party was founded by a group of Ivuran teachers and poets as a society running weekend Ivuran classes; the classes multiplied, and the society became a party."

  - id: pty_4zctgr
    names: { zh: 梯田党, en: Terrace Party }
    short_names: { zh: 梯田, en: "Terrace" }
    color: "#4C8C2B"
    flag: { layout: bands, colors: ["#4C8C2B", "#7DB24A", "#A9CF6B"], charge: terraces, charge_band: 1, charge_color: "#FFFFFF" }
    spectrum: 0.9
    family: { zh: 农本主义、保守主义, en: "Agrarianism, conservatism" }
    leader: { zh: 帕拉瓦伊·特鲁韦尔, en: Pallavai Teruvel }
    members: 21000
    youth_wing: { zh: 梯田青年, en: Young Terrace }
    slogan: { zh: 一级一级往上走, en: One step at a time }
    policies:
      - { zh: 稻米、香料和水果的收购保护价, en: "Guaranteed purchase prices for rice, spices and fruit" }
      - { zh: 山区梯田的灌溉水渠由领地维护, en: Territorial upkeep of the hill terraces' irrigation channels }
      - { zh: 农地不得改作工业和住宅用地, en: No rezoning of farmland for industry or housing }
      - { zh: 农户子女上大学免学费, en: Free university tuition for farmers' children }
    allies: [pty_mak5vy, pty_e7tyeb, pty_0a67en]
    targets: { div_nwm019: 8 }
    lean: { rice: 1.0, spice: 0.6, fruit: 0.6, agriculture: 0.8, urban: -0.6 }
    notes:
      zh: "梯田党代表长夏群岛的稻农、香料园主和果农，属中右翼，主张为稻米、香料和水果设收购保护价，由领地维护山区梯田的灌溉水渠，禁止把农地改作工业和住宅用地，农户子女上大学免学费。它的选民集中在内陆山区和平原的稻作区，那里的梯田一级一级修到山顶，水从最高的一级流下来，依次灌溉每一块田。党的口号「一级一级往上走」既是说梯田，也是说党的主张：不求一步登天。梯田党在长夏群岛议会里属反对派，在温达坎、彭纳拉姆等稻作城市的市议会里有不少议席。每年插秧季，党首都要下田插一天秧，照片会登在党报的头版。梯田党与伊武兰复兴党在保护梯田和水渠上立场一致，在税收和土地规划上却常常对立，两党的议员说他们是「同一块田里的两头牛」。党员里年长的稻农居多，党报副刊每期都登一份当季的农事历。"
      en: "The Terrace Party speaks for the Everlong Summer Islands' rice farmers, spice growers and fruit farmers, a party of the centre-right. It wants guaranteed purchase prices for rice, spices and fruit, the hill terraces' irrigation channels kept up by the territory, no rezoning of farmland for industry or housing, and free university tuition for farmers' children. Its voters are concentrated in the rice-growing districts of the inland hills and plains, where terraces climb step by step to the hilltops and water runs down from the highest, watering each field in turn. Its slogan, one step at a time, is about the terraces and about the party's outlook: no leap to the sky. It is in opposition in the assembly and holds many seats on the councils of rice-growing cities such as Undakan and Pennaram. Every planting season the leader spends a day planting rice in the fields, and the photograph goes on the front page of the party paper. The Terrace Party and Ivuran Renewal agree on protecting the terraces and channels but often clash on tax and land planning; their members call themselves two oxen in the same field. Most of its members are older rice farmers, and every issue of the party paper's supplement carries the season's farming calendar."
    history:
      zh: "梯田党由几个山区的灌溉水渠协会联合组建，这些协会管理梯田的用水已经有很多代了。"
      en: "The party was formed by the irrigation channel associations of several hill districts, which had managed the terraces' water for many generations."

  - id: pty_0a67en
    names: { zh: 王旗会, en: Royal Banner Society }
    short_names: { zh: 王旗, en: "Banner" }
    color: "#8E1B3A"
    flag: { layout: banner, colors: ["#8E1B3A"], charge: sun, charge_color: "#E9B949" }
    spectrum: 2.2
    family: { zh: 传统主义、君主主义, en: "Traditionalism, monarchism" }
    leader: { zh: 翁贝卢·瓦拉塞里, en: Ombelu Varaseri }
    members: 13000
    youth_wing: { zh: 王旗青年, en: Banner Youth }
    slogan: { zh: 古老的旗帜，崭新的岛, en: "An old banner, a new island" }
    policies:
      - { zh: 恢复古王国王室后裔的礼仪性地位, en: A ceremonial role for the old kingdom's royal descendants }
      - { zh: 萨伦纳姆老王宫重新用作领地的礼仪中心, en: Sarunnam's old palace to become the territory's ceremonial centre again }
      - { zh: 传统节日列为领地公共假日, en: Traditional festivals as territorial public holidays }
      - { zh: 降低家庭企业和老字号的税负, en: Lower tax for family firms and old shops }
    allies: [pty_4zctgr, pty_mak5vy]
    targets: { div_nwm019: 6 }
    lean: { heritage: 0.6, old: 2.0, "lang:art-x-ivuran": 1.0, "city:div_kv6b3e": 1.0 }
    notes:
      zh: "王旗会是长夏群岛的传统主义右翼小党，主张恢复古王国王室后裔的礼仪性地位，让萨伦纳姆老王宫重新成为领地的礼仪中心，把传统节日列为公共假日，降低家庭企业和老字号的税负。它不主张恢复君主统治，而是希望古王国的旗帜和仪式在今天的领地生活里有一席之地。王旗会的选民多是年长者，集中在古王国旧都萨伦纳姆和周边的老城，它在萨伦纳姆市议会里的议席是在其他任何城市的两倍多。党旗用的是古王国旗帜的颜色：深红底上一轮金色的太阳。每年王国节，王旗会的成员会穿着传统服装，从萨伦纳姆老王宫走到海边，把一面旧旗在海水里浸一下，再升起来。"
      en: "The Royal Banner Society is a small traditionalist party of the right in the Everlong Summer Islands. It wants a ceremonial role for the old kingdom's royal descendants, Sarunnam's old palace made the territory's ceremonial centre again, traditional festivals made public holidays and lower tax for family firms and old shops. It does not seek a return to monarchy, but wants the old kingdom's banner and rites to have a place in the territory's life today. Its voters are mostly older and concentrated in Sarunnam, the old kingdom's capital, and the old towns around it, and it holds more than twice as many seats on Sarunnam's council as on any other. Its flag uses the old kingdom's colours, a golden sun on deep red. Every Kingdom Day its members walk in traditional dress from Sarunnam's old palace to the sea, dip an old banner in the water and raise it again."
    history:
      zh: "王旗会起初是萨伦纳姆的一个老王宫保护协会，在老王宫险些被改建成酒店之后转为政党。"
      en: "The Society began as a conservation society for Sarunnam's old palace and became a party after the palace was nearly turned into a hotel."

  - id: pty_6c94cq
    names: { zh: 公社运动, en: Commune Movement }
    short_names: { zh: 公社, en: "Commune" }
    color: "#E63946"
    flag: { layout: bands, colors: ["#E63946", "#F4A261"], ratio: [2, 1], charge: ring_homes, charge_band: 0 }
    spectrum: -3.0
    family: { zh: 直接民主、自治主义, en: "Direct democracy, autonomism" }
    leader: { zh: 伊拉瓦伊·科卢门, en: Iravai Kolumen }
    leader_title: { zh: 轮值发言人, en: Rotating spokesperson }
    members: 7600
    youth_wing: { zh: 公社青年, en: Commune Youth }
    slogan: { zh: 一切归于大会, en: All to the assembly }
    policies:
      - { zh: 每个街区设居民大会，决定本街区的预算, en: "An assembly in every neighbourhood, deciding its own budget" }
      - { zh: 土地和住房由社区合作社持有, en: Land and housing held by community cooperatives }
      - { zh: 议员任期一届，不得连任, en: "One term for every representative, with no re-election" }
      - { zh: 议员工资与当地工人平均工资相同, en: "Representatives paid the local average wage" }
    allies: [pty_09zrw1]
    targets: { div_nwm019: 4 }
    lean: { "status:commune": 3.5, young: 2.0 }
    notes:
      zh: "公社运动是长夏群岛最左的政党，主张直接民主：每个街区都设居民大会决定本街区的预算，土地和住房由社区合作社持有，议员只做一届、工资与当地工人平均工资相同。它的大本营在埃武托拉公社，那里的公共事务不由市议会而由全体居民参加的公社大会决定，大会在中央广场的大榕树下召开，任何居民都可以发言。公社运动没有党首，只有一位每年轮换的发言人，现任发言人是伊拉瓦伊·科卢门。它在长夏群岛议会里的议席几乎都来自埃武托拉，在议会里通常支持公地联盟，但从不加入政府。它的议员每周回埃武托拉一次，向公社大会报告自己在议会里的每一次投票。"
      en: "The Commune Movement is the Everlong Summer Islands' furthest-left party and stands for direct democracy: an assembly in every neighbourhood deciding its own budget, land and housing held by community cooperatives, and representatives who serve one term on the local average wage. Its base is Evutola Commune, whose public business is decided not by a council but by the Commune Assembly of all residents, which meets under the great banyan in the central square, where any resident may speak. The movement has no leader, only a spokesperson who changes every year, at present Iravai Kolumen. Nearly all its seats in the assembly come from Evutola; it usually backs the Commons Alliance there but never joins a government. Its members go back to Evutola once a week to report every vote they cast to the Commune Assembly."
    history:
      zh: "公社运动起于埃武托拉的一场住房合作运动，居民们买下了一片要被拆除的老街区，在街区大会上决定如何修缮，后来这种做法推广到了整个城市。"
      en: "The movement grew out of a housing cooperative in Evutola: residents bought an old quarter due for demolition and decided at a neighbourhood assembly how to repair it, and the practice later spread to the whole town."

