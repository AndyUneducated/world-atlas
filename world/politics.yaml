    notes: {"zh": "港城公民党是瓦罗纳大议会的第三大党，也是自由商人党的执政伙伴。它是一个中间派政党，既不代表商会，也不代表工会，而是代表教师、医生、公务员、小店主和普通住户，它的口号是「一座属于居民的城市」。党首海因戈·安德里安是一位中学校长，在联合政府中担任教育部长，主持了全岛第一个公立学校免费午餐计划。党员约一万三千。\n党的主张包括：每个街区都有公立学校、图书馆和社区诊所；填海新区一半用于公共住房和公园；大议会议员公开财产和商业利益，商会成员在涉及本行业的表决中回避；改善渡轮和地铁，连接东北的小岛和主岛。它在经济上支持自由贸易，在社会上主张更多的公共服务，常被称为共和国的「平衡锤」。\n在联合政府中，港城公民党掌管教育、劳动和社会保障、卫生三个部。它说服自由商人党把填海新区的一半用于公共住房，这是两党组成联合政府的条件之一。海员工党批评公民党「被商会收买」，自由商人党的船东派则抱怨公民党的议员财产公开法案干涉了商业隐私。党内对是否改与海员工党合作一直有讨论，许多年轻党员认为住房问题需要更大胆的政策。\n港城公民党的组织以街区居民会为基础，每个街区都有一个公民小组，小组每月在社区中心开会，讨论学校、交通和住房等身边的问题。党首由全体党员直接选出，候选人须在街区小组中服务至少两年，党员说「先管好一条街，再去管一座城」。党的经费来自党费和小额捐款，章程规定任何一笔捐款都不得超过党全年收入的百分之二，以免党被少数捐款人左右。党与萨马伊自由邦的自由民主党关系密切，两党常交流城市规划和教育政策的经验。青年公民每年组织「街区地图」活动，让中学生走遍自己的街区，画出需要改善的地方，再交给大议会的议员。\n公民党的选民是城市中产阶级和年轻家庭，在主岛的新住宅区和东北小岛最强。每年开学的第一天，党员在各街区的学校门口为孩子们分发书包和文具，党首会去一所学校上一堂课。党旗是青绿色的旗面，旗杆一侧是一道白色竖条，竖条上一座青绿色的灯塔，代表港城的灯塔和指引方向的公民精神。", "en": "The Harbour Citizens' Party is the third party in Varona's Great Council and the Free Merchants' partner in government. It is a centrist party that speaks neither for the merchant houses nor for the unions but for teachers, doctors, civil servants, shopkeepers and ordinary households, under the watchword 'a city for those who live in it'. Its leader, Haingo Andrian, is a headmaster who serves as education minister in the coalition and led the island's first free lunch scheme in state schools. It has some 13,000 members. \nIt wants a state school, a library and a clinic in every neighbourhood; half the reclaimed land given to public housing and parks; members of the Great Council to declare their wealth and business interests, with merchant-house members standing aside from votes on their own trades; and better ferries and metro links between the small island in the north-east and the main island. It backs free trade on the economy and more public services in society, and is often called the republic's 'counterweight'. \nIn government the Harbour Citizens hold education, labour and health. They persuaded the Free Merchants to give half the reclaimed land to public housing, one of their conditions for joining the coalition. Seafarers' Labour says the party has been 'bought by the merchant houses', while the Free Merchants' shipowners complain that its bill for councillors to declare their interests intrudes on business privacy. Whether to switch to working with Seafarers' Labour is a standing debate in the party, many younger members believing housing needs bolder policies. \nThe Harbour Citizens are built on the neighbourhood residents' groups: every neighbourhood has a citizens' circle that meets monthly at the community centre to talk about schools, transport, housing and other matters close to home. The leader is elected by all members, and candidates must have served at least two years in a neighbourhood circle: 'look after a street first, then a city'. Money comes from dues and small gifts, and its rules forbid any single gift above two per cent of the party's yearly income, so that no handful of donors can steer it. It is close to the Liberal Democrats of Samay, and the two often trade ideas on planning and schooling. Young Citizens run a Neighbourhood Map project each year in which secondary pupils walk their own streets, mark what needs fixing and hand it to members of the Great Council.\nIts voters are the city's middle class and young families, and it is strongest in the new districts of the main island and on the small north-eastern island. On the first day of each school year members hand out school bags and stationery at the gates of the neighbourhood schools, and the leader teaches a lesson at one of them. Its flag is teal with a white band at the hoist bearing a teal lighthouse, the harbour lighthouse and the civic spirit that shows the way."}
    history: {"zh": "港城公民党由教师协会、医生协会和街区居民会联合组建，最初是一场要求公开大议会议员商业利益的公民运动。运动推动了第一部议员利益申报法后，组织者组建政党参选。", "en": "The Harbour Citizens' Party was formed by the teachers' and doctors' associations and neighbourhood residents' groups, beginning as a citizens' campaign for Great Council members to declare their business interests. Once the campaign had won the first law on declarations, its organisers formed a party to stand for election."}
    flag_notes: {"zh": "党旗是青绿色的旗面，旗杆一侧是一道白色竖条，竖条上一座青绿色的灯塔。青绿色是港湾的海水，灯塔代表指引方向的公民精神。", "en": "The flag is teal with a white band at the hoist bearing a teal lighthouse. The teal is the harbour's water; the lighthouse is the civic spirit that shows the way."}
    factions: [{"names": {"zh": "教育派", "en": "Education Wing"}, "notes": {"zh": "教师和校长，最关心公立学校、免费午餐和图书馆。", "en": "Teachers and heads, who care most about state schools, free lunches and libraries."}}, {"names": {"zh": "廉政派", "en": "Integrity Wing"}, "notes": {"zh": "律师和年轻专业人士，最关心议员利益申报和商会在议会中的影响。", "en": "Lawyers and young professionals, who care most about councillors' declarations and the merchant houses' sway in the council."}}]
    organisation: {"newspaper": {"zh": "《港城晚报》", "en": "Harbour Evening News"}, "think_tank": {"zh": "城市公共政策研究所", "en": "Institute for Urban Public Policy"}, "unions": {"zh": "瓦罗纳教师协会", "en": "Varona Teachers' Association"}}
