# Elections: the parties, each territory's legislature and electoral system, and the city councils
# (pipeline/atlas/politics.py). Every party and politician is fictional; party cards carry policies, not
# grievances against any group.
#
# A party's `targets` are its share of the vote in the territorial election, per territory it stands in
# (scaled to sum to 1); a district's vote leans from them by `lean`: per industry among the district's
# leading ones (rank-weighted 1, 0.6, 0.4, 0.3), per language share (lang:<tag>, 0–1), young and old (share
# of under-15s and over-65s), income (log of GDP per head over the territory's), urban (log10 of people
# per km²), lat (degrees), city:<id> and status:<special_status> (1 inside), each measured from the
# territory's mean. `roll` leans the vote of the reserved-seat roll further (log factor).
# spectrum: left (−3) to right (+3), for the order of the hemicycle and the cost of a coalition.
# Systems: mmp (a constituency per district, list seats by Sainte-Laguë to make the whole proportional
# among parties over the threshold or with a constituency; overhang seats kept), fptp (single-member wards
# shared out among the districts by population), pr_reserved (D'Hondt over the threshold, plus seats
# elected by the speakers of the reserved language, by Sainte-Laguë), pr_regional (each city a
# constituency, seats by population, at least 2, largest remainder). City councils use their territory's
# system: council_seats [a, b] gives a + b × log2(population / 100,000) seats, rounded to odd, within
# council_range; an mmp council elects half its seats in wards.
# The texts on the cards (who governs, who leads where) were written against the model's results; check
# them again after changing targets, leanings or systems.

electorate_share: 0.78  # of the population, 18 and over
perturbation: { vote: 0.12, turnout: 0.02, ward: 0.4 }  # at most, either way (log share, share, log share)
# A government is the winning coalition with no member to spare and the least cost: its left-right span,
# plus `partner` for each party beyond the first and `without_largest` if the largest party is not in it.
coalition_cost: { partner: 0.4, without_largest: 1.0 }

