    policies:
      - { zh: 维京语在学校里与中文同课时, en: Teach Viking for as many hours as Chinese in schools }
      - { zh: 古城、长屋遗址和老船坞列入保护名录，禁止拆除, en: "List the old towns, longhouse sites and old boatyards for protection, with no demolition" }
      - { zh: 有三个以上孩子的家庭减免所得税, en: Income tax relief for families with three or more children }
      - { zh: 地方节庆和传统航海活动由领地资助, en: Territorial funding for local festivals and traditional sailing }
    allies: [pty_mak5vy, pty_hwkmx1]
    targets: { div_fbfqv9: 4.6, div_raat4g: 2.5 }
    lean: { "lang:art-x-viking": 2.0, heritage: 0.3, old: 2.0, urban: -0.3, fishing: 0.2 }
    notes:
      zh: "长屋党是北维京岛和维京群岛的传统保守派，主张维护维京语、古城和航海传统，支持多子女家庭，反对拆除老城区和老船坞。它的选民集中在维京语使用者多的老城镇和渔村，年长的选民居多。在北维京岛上一次选举中，它的得票只差一点就跨过百分之五的门槛，党部为此把那一晚称作「差一桨之夜」；它在维京港、勒克尔、洛龙山等地的市议会里都有席位。党名来自维京时代的长屋：一家几代人和来客都睡在同一个屋顶下，中间是一条长长的火塘。长屋党的党代会开幕时，代表们要一起点燃一只铁火盆，闭幕时由最年轻的代表把它熄灭。"
      en: "The Longhouse Party is the traditional conservative party of North Viking Island and the Viking Islands. It seeks to keep up the Viking language, the old towns and seafaring traditions, backs large families and opposes pulling down old quarters and boatyards. Its voters are concentrated in the old towns and fishing villages where Viking is widely spoken, and most of them are older. At the last North Viking Island election it fell just short of the five-per-cent threshold, a night the party now calls the night of the missing oar stroke; it sits on the city councils of Viking Port, Lekor, Lorond Mountain and others. The name comes from the Viking-age longhouse, where several generations and their guests slept under one roof along a single long hearth. The party's congress opens with the delegates lighting an iron brazier together, and closes with the youngest delegate putting it out."
    history:
      zh: "长屋党由北维京岛的维京语协会和几个老城保护团体组建，最初的目标是阻止拆除维京港的老船坞。维京群岛的支部由长船古城的居民协会发起。"
      en: "The Longhouse Party was formed by North Viking Island's Viking language society and several old-town conservation groups, its first aim being to stop the demolition of Viking Port's old boatyards. Its Viking Islands branch was started by the residents' association of Longship's old town."

  # ── 北维京岛政党 ──
  - id: pty_w45j5f
    names: { zh: 海港运动, en: Harbour Movement }
    short_names: { zh: 海港, en: "Harbour" }
    color: "#1F9ACF"
    flag: { layout: hoist, colors: ["#0F3B5F", "#1F9ACF", "#FFFFFF", "#1F9ACF"], charge: gull }
    spectrum: -0.4
    family: { zh: 地方主义, en: Regionalism }
    leader: { zh: 秦望舒, en: Qin Wangshu }
    members: 6500
    youth_wing: { zh: 海港青年, en: Harbour Youth }
    slogan: { zh: 维京港的事，维京港定, en: Viking Port decides for Viking Port }
    policies:
      - { zh: 港口收入的一半留给维京港市, en: Half of the port's revenue to stay with Viking Port City }
      - { zh: 维京港老城和港区的规划由市议会而不是领地政府审批, en: "Viking Port's old town and harbour to be planned by the city council, not the territory" }
      - { zh: 海底通道的过路费减半, en: Halve the tolls on the undersea link }
      - { zh: 在老港区建一座海事博物馆, en: Build a maritime museum in the old harbour }
    allies: [pty_jh513z, pty_2033kv]
    targets: { div_fbfqv9: 3 }
    lean: { "city:div_m41gwn": 2.0, port: 0.3 }
    notes:
      zh: "海港运动只在维京港和周边竞选，是一个中间偏左的地方主义政党。维京港是北维京岛最早的城市，首府自由市建成后，政务院和议会都搬走了，许多维京港人觉得「港口赚的钱都流到了首府」。海港运动主张港口收入留一半给本市、老城规划由市议会审批、海底通道过路费减半。在领地议会选举中，它的得票集中在一座城市，跨不过全领地的门槛，但在维京港市议会里是第三大党，与互助党、绿脉党组成执政联盟，市长顾静宜上任第一件事就是把市政厅的旗杆换回了老港区的旧桅杆。"
      en: "The Harbour Movement stands only in Viking Port and around it, a regionalist party just left of centre. Viking Port is North Viking Island's oldest city, and when Freedom City was built as the capital the Executive Council and the parliament moved away; many in Viking Port feel the money the harbour makes flows to the capital. The movement wants half the port's revenue kept in the city, the old town planned by the city council and the undersea link's tolls halved. In territorial elections its vote is concentrated in one city and cannot clear the territory-wide threshold, but on Viking Port's council it is the third party and governs with the Mutual Aid Party and Greenvein; the first thing Mayor Gu Jingyi did in office was to replace the city hall's flagpole with an old mast from the harbour."
    history:
      zh: "海港运动起于维京港居民反对把港务局迁往首府的一次请愿，请愿成功后，发起人决定参加市议会选举，后来也参加领地议会选举。"
      en: "The movement began with a petition by Viking Port residents against moving the port authority to the capital; when the petition succeeded its organisers decided to stand for the city council, and later for the territorial parliament too."

  - id: pty_p15smt
    names: { zh: 巴克汉姆人联盟, en: Buckham League }
