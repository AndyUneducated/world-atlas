    notes: {"zh": "人民劳动党是萨希利亚的社会民主政党，也是议会中最大的反对党。它代表码头工人、渔民、盐工、丁香和腰果园的雇工，以及越来越多的城市青年。党首祖贝里·姆维尼当过班达里港的码头工人和工会主席，以讲话直白著称，他在议会里的一句「我们的祷告和我们的工资一样重要」成了党的名言。党员约十一万，许多是工会会员。\n劳动党把自己的思想称为「伊斯兰社会主义」：它认为伊斯兰教的天课和济贫传统与社会民主的福利国家是一致的。它主张码头工人、渔民和盐工享有统一的最低工资和医疗保险；丁香和腰果园的雇工有权组织工会；国家投资修建港口城市的廉租房。在难民问题上，劳动党是唯一主张让难民营居民合法工作、让难民儿童进入公立学校的议会政党，它说：「他们已经在这里住了二十年，他们的孩子是我们的邻居。」\n劳动党支持共和国留在圣约同盟，但批评政府把太多预算花在军队上，主张把一部分军费转为北部山区的道路、学校和就业计划。它与海岸民族党在工资和港口私有化问题上针锋相对，与伊斯兰公正党则在福利政策上有不少共同点，政治评论员一直猜测，公正党有一天会换掉海岸党，改与劳动党联合执政。\n劳动党与工会的关系非常紧密：港口与渔业工会联合会的会员自动成为党的支持者，工会在党代会中拥有三分之一的票数。党首由党代会选出，但须同时获得工会代表和普通党员代表的多数，这一双重多数规则曾让党内的几次领导权之争拖了好几个月。党的经费主要来自工会会费的政治基金，它几乎不接受企业捐款，因此在选举宣传上远不如海岸党。党在难民营周边设立了法律援助站，为难民提供工作和居留方面的咨询，这些援助站也成了党在年轻人中招募新党员的地方。劳动青年团在码头区开办夜校，教授会计、电工和英语。\n劳动党的选民是年轻人和低收入者，在港口的工人区和班达里港南的难民营周边最强。每年五月一日，党在萨希勒的码头广场举行集会，码头工人推着装满鲜鱼的手推车游行，集会以集体祷告开始，以工人歌曲结束。党的旗帜是红底上的齿轮和锤子，党员说，齿轮是港口的起重机，锤子是修船的工人。", "en": "The People's Labour Party is Sahiliya's social democratic party and the largest party in opposition. It speaks for dockers, fishers, salt workers and the hired hands of the clove and cashew farms, and for more and more of the young in the towns. Its leader, Zuberi Mwinyi, was a docker and union chairman at Bandari, and is known for speaking plainly; his line in parliament, 'our prayers matter as much as our wages', has become the party's motto. It has some 110,000 members, many of them union members too. \nLabour calls its thinking 'Islamic socialism', holding that the Islamic traditions of zakat and relief for the poor are at one with the welfare state of social democracy. It wants one minimum wage and health insurance for dockers, fishers and salt workers, the right to unionise for the hired hands of the clove and cashew farms, and public rented housing built in the port towns. On refugees it is the only party in parliament that would let the people of the camps work legally and their children go to state schools: 'They have lived here twenty years,' it says, 'and their children are our neighbours.' \nLabour backs the republic's place in the Covenant League but says the government spends too much of the budget on the army, and would move part of the defence bill to roads, schools and jobs in the northern hills. It clashes with Coast National over wages and the sale of the ports, and has a good deal in common with Islamic Justice on welfare, so commentators have long wondered whether Justice will one day drop Coast National and govern with Labour instead. \nLabour is tightly bound to the unions: members of the Federation of Port and Fishing Unions count as the party's supporters, and the unions hold a third of the votes at party conference. The conference elects the leader, who needs a majority of both the union delegates and the ordinary members' delegates; this double majority has dragged several leadership contests out for months. Most of its money comes from the political funds of union dues, and it takes almost nothing from business, so its campaigns are far smaller than Coast National's. It runs legal aid posts round the refugee camps, advising refugees on work and residence, and these have also become where it recruits young members. Labour Youth runs night classes in the dock districts in accounting, electrical work and English.\nIts voters are the young and the lower paid, and it is strongest in the workers' districts of the ports and round the refugee camps south of Bandari. On the first of May each year the party rallies in the dock square at Sahil, dockers parading handcarts loaded with fresh fish; the rally opens with prayer and ends with workers' songs. Its flag is a gear and hammer on red, which members say are the cranes of the port and the workers who mend the ships."}
    history: {"zh": "人民劳动党由港口工会、渔民合作社和盐工协会联合组建。共和国成立初期，工会在战乱中维持港口运转，此后组建政党，在议会中代表劳动者发声。", "en": "The People's Labour Party was formed by the dockers' unions, fishing cooperatives and salt workers' associations. In the early years of the republic the unions kept the ports running through the fighting, and later formed a party to speak for working people in parliament."}
    flag_notes: {"zh": "党旗是红底上的米白色齿轮和锤子。红色代表劳动者的团结，齿轮是港口的起重机，锤子是造船和修船的工人。", "en": "The flag is a cream gear and hammer on red. The red is the solidarity of working people; the gear is the port cranes and the hammer the shipwrights."}
    factions: [{"names": {"zh": "码头派", "en": "Dockside Wing"}, "notes": {"zh": "码头和盐场的工会会员，最关心工资、医疗保险和港口不被私有化。", "en": "Union members of the docks and salt pans, who care most about wages, health insurance and keeping the ports public."}}, {"names": {"zh": "青年派", "en": "Youth Wing"}, "notes": {"zh": "城市青年和大学生，关心就业、住房和难民权利，希望党在社会议题上更进步。", "en": "Young townspeople and students, concerned with jobs, housing and refugees' rights, who want the party bolder on social questions."}}]
    organisation: {"newspaper": {"zh": "《劳动者报》", "en": "The Worker"}, "unions": {"zh": "萨希利亚港口与渔业工会联合会", "en": "Sahiliya Federation of Port and Fishing Unions"}, "women": {"zh": "劳动妇女会", "en": "Working Women's Association"}}
  - id: "pty_4mfc5r"
    names: {"zh": "自由党", "en": "Liberal Party"}
    short_names: {"zh": "自由党", "en": "Liberals"}
