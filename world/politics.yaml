    policies: [{"zh": "清真寺、学校和诊所三位一体，每个街区都有", "en": "A mosque, a school and a clinic together in every neighbourhood"}, {"zh": "天课基金与国家福利合并管理，账目每年公开", "en": "Run the zakat funds with state welfare, the accounts published every year"}, {"zh": "女性参加议会和公职的比例逐步提高到三分之一", "en": "Raise women's share of seats and public office step by step to a third"}, {"zh": "与北部山区的部落长老对话，切断贾巴利亚武装的兵源", "en": "Talk to the tribal elders of the northern hills and cut off the Jabaliya fighters' recruits"}]
    allies: ["pty_n471ee"]
    targets: {"div_t5zph6": 40}
    lean: {"old": 1.0, "urban": -0.2, "lang:art-x-kasiri": 0.6}
    notes: {"zh": "伊斯兰公正党是萨希利亚伊斯兰共和国的第一大党，主张以伊斯兰价值和民主制度结合治理国家。党首巴卡里·朱马出任总理，他出身于萨希勒老城一个香料商人家庭，在海外读过经济学，回国后当过清真寺学校的老师和市议员。公正党与海岸民族党组成联合政府，两党在反恐和对外结盟上看法一致，在宗教与世俗的界限上则时有争执。党员约十四万。\n党的口号是「信仰与公正同行」。它主张每个街区都有清真寺、学校和诊所，三者合在一处，由社区共同管理；天课基金与国家福利合并管理，账目每年公开，接受审计；女性参加议会和公职的比例逐步提高到三分之一，党的议员名单中女性排位与男性交替。在安全问题上，公正党主张一手强硬打击贾巴利亚武装，一手与北部山区的部落长老对话，修建道路和学校，切断武装组织的兵源。\n公正党的执政被国际观察者称为「温和伊斯兰」的样板：它坚持宪法规定的教法原则，却反对宗教学者委员会扩大权力；它支持圣约同盟，与基督教的安博哈拉结盟，在党内曾引起不小的争论。党内的保守派批评领导层向世俗派让步太多，青年党员则希望党在妇女权利和新闻自由上走得更远。总理朱马的说法是：「我们的信仰教导我们守约，与基督徒的盟约也是盟约。」\n公正党的组织以清真寺街区为基础，每个街区支部每月开一次会，会议在晚祷之后举行。党的全国协商会议每三年选举一次党首，宗教学者和商人各占一部分席位，章程还规定协商会议中至少四分之一是女性。党的候选人须能背诵《古兰经》的若干章节，也须通过一场关于预算和法律的考试，党员说这是「信仰与能力的双重考验」。党的经费来自党费和商人的捐款，部分清真寺协会也提供场地和志愿者。公正姐妹会在各地开办识字班和小额贷款，许多参加者后来成了市议员和街区支部的负责人。\n公正党的选民遍布全国，在年长选民、卡西里语社区和港口城市的老城区最强。每年斋月，党在全国各地的海滨组织开斋长桌宴，所有人都可以入座，不问信仰。党的标志是绿色旗面上的一弯白色新月，象征新的开始。党员中流传着一句话：「在清真寺里祈祷，在议会里算账，在街区里做事。」", "en": "The Islamic Justice Party is the largest party in the Islamic Republic of Sahiliya, and stands for governing by Islamic values and democratic institutions together. Its leader, Bakari Juma, is Prime Minister. He comes from a spice merchant's family in old Sahil, studied economics abroad, and on coming home taught at a mosque school and sat on the city council. Justice governs with the Coast National Party; the two agree on fighting terrorism and on the country's alliances, and argue now and then over where faith ends and the secular begins. It has some 140,000 members. \nIts watchword is 'faith and justice walk together'. It wants a mosque, a school and a clinic together in every neighbourhood, run by the community; the zakat funds run together with state welfare, their accounts published and audited every year; and women's share of seats and public office raised step by step to a third, its own candidate lists alternating women and men. On security it would strike hard at the Jabaliya fighters with one hand and with the other talk to the tribal elders of the northern hills, building roads and schools to cut off the armed group's recruits. \nInternational observers hold up its government as a model of moderate Islam: it upholds the constitution's principles of religious law yet opposes wider powers for the Council of Religious Scholars, and it backs the Covenant League, an alliance with Christian Ambohara that caused no small argument within the party. Its conservatives say the leadership gives too much ground to the secularists; its young members want it to go further on women's rights and press freedom. As Prime Minister Juma puts it: 'Our faith teaches us to keep our word, and a covenant with Christians is a covenant too.' \nJustice is organised round the mosque neighbourhoods; each neighbourhood branch meets once a month after the evening prayer. Its national consultative council elects the leader every three years, with seats for both religious scholars and merchants, and its rules require at least a quarter of the council to be women. Candidates must be able to recite certain chapters of the Qur'an and pass an examination on the budget and the law, which members call 'the double test of faith and ability'. Money comes from dues and merchants' gifts, and some mosque associations provide rooms and volunteers. The Sisters of Justice run literacy classes and small loans across the country, and many who take part go on to sit on city councils and lead neighbourhood branches.\nIts voters are spread across the country and it is strongest among older voters, the Kasiri-speaking communities and the old towns of the ports. Every Ramadan the party sets long tables along seafronts across the country to break the fast, open to all whatever their faith. Its emblem is a white crescent on green, a sign of new beginnings, and a saying goes round its members: 'Pray in the mosque, keep accounts in the chamber, get things done in the street.'"}
    history: {"zh": "伊斯兰公正党由沿海各城的清真寺协会、宗教学校教师和商会人士在共和国成立时组建。它在协商会议上主张宪法同时写入教法原则和妇女选举权，此后成为议会中最大的政党。", "en": "The Islamic Justice Party was formed by the mosque associations, religious-school teachers and merchants of the coastal towns when the republic was founded. At the consultative assembly it argued for both the principles of religious law and women's suffrage in the constitution, and it has been the largest party in parliament since."}
    flag_notes: {"zh": "党旗是绿底上的一弯白色新月。绿色是伊斯兰的传统颜色，新月象征新的开始，也象征斋月的开始和结束。", "en": "The flag is a white crescent on green. Green is the traditional colour of Islam; the crescent is a new beginning, and the start and end of Ramadan."}
    factions: [{"names": {"zh": "清真寺派", "en": "Mosque Wing"}, "notes": {"zh": "宗教学校教师和清真寺协会，坚持教法原则和家庭价值，对与基督教国家结盟有所保留。", "en": "Religious-school teachers and mosque associations, who hold to the principles of religious law and family values and have doubts about the alliance with Christian states."}}, {"names": {"zh": "市场派", "en": "Market Wing"}, "notes": {"zh": "港口城市的商人和年轻专业人士，主张开放贸易、扩大妇女就业，是总理朱马的主要支持者。", "en": "Merchants and young professionals of the port towns, who want open trade and more women at work; Prime Minister Juma's main support."}}]
    organisation: {"newspaper": {"zh": "《公正报》", "en": "Justice"}, "think_tank": {"zh": "伊斯兰与发展研究中心", "en": "Centre for Islam and Development"}, "women": {"zh": "公正姐妹会", "en": "Sisters of Justice"}}
  - id: "pty_n471ee"
    names: {"zh": "海岸民族党", "en": "Coast National Party"}
    short_names: {"zh": "海岸党", "en": "Coast National"}
    color: "#0E4C75"
    flag: {"layout": "horizon", "colors": ["#0E4C75", "#F4F1E8"], "edge": "waves", "charge": "sail"}
    spectrum: 0.4
    family: {"zh": "民族自由主义", "en": "National liberal"}
    ideology: [{"zh": "萨希利亚民族主义", "en": "Sahiliyan nationalism"}, {"zh": "商业自由主义", "en": "Commercial liberalism"}, {"zh": "温和世俗主义", "en": "Moderate secularism"}]
    axes: {"econ": 6.5, "galtan": 5.0, "autonomy": 6.0, "green": 7.0}
    leader: {"zh": "阿米娜·沙巴尼", "en": "Amina Shabani"}
    members: 90000
    youth_wing: {"zh": "海岸青年联合会", "en": "Coast Youth Union"}
    slogan: {"zh": "海洋把我们连在一起", "en": "The sea binds us together"}
    policies: [{"zh": "把萨希勒和班达里港建成自由贸易区，单桅帆船贸易免税", "en": "Make Sahil and Bandari free-trade ports, with dhow trade free of duty"}, {"zh": "宗教学者委员会只审查法律，不干预教育和文化", "en": "Let the Council of Religious Scholars review laws but keep out of schools and culture"}, {"zh": "渔业资源属于全体国民，外国船队须缴纳捕捞费", "en": "Hold the fisheries for the nation and charge foreign fleets for their catch"}, {"zh": "海军扩建巡逻艇队，保护航道不受海盗和走私者侵扰", "en": "Build up the navy's patrol boats to keep the sea lanes free of pirates and smugglers"}]
    allies: ["pty_vwmra6"]
    targets: {"div_t5zph6": 33}
    lean: {"urban": 0.6, "income": 0.6, "young": 0.8}
    notes: {"zh": "海岸民族党是萨希利亚的第二大党，代表港口城市的商人、船东、渔业公司和受过教育的中产阶级。党首阿米娜·沙巴尼曾任共和国第一位女性外交部长，现任财政部长，出身于班达里港一个船东家族，能说卡西里语、拉诺瓦语和英语。海岸党与伊斯兰公正党组成联合政府，掌管财政、司法、教育、交通和内政五个部。党员约九万。\n党的思想是萨希利亚民族主义和商业自由主义的结合：它认为萨希利亚的身份来自海洋和贸易，而不只是宗教。它主张把萨希勒和班达里建成自由贸易港，单桅帆船贸易免税；宗教学者委员会只审查法律，不干预教育和文化；渔业资源属于全体国民，外国船队必须缴纳捕捞费；海军扩建巡逻艇队，保护航道不受海盗和走私者侵扰。它是圣约同盟最坚定的支持者之一，认为与安博哈拉和努西拉的结盟是共和国安全的基础。\n在联合政府中，海岸党常扮演「刹车」的角色：当公正党的保守派提出扩大宗教学者委员会权力或收紧服装规定时，海岸党总会以退出政府相威胁。两党的合作被称为「新月与帆」，彼此需要，又互相提防。海岸党与人民劳动党的关系紧张，劳动党批评它代表船东而非水手，海岸党则说劳动党的工资政策会让港口失去竞争力。\n海岸党的组织以港口和商会为基础，每座港口城市有一个地方委员会，委员会由船东、商人、律师和教师组成。党首由全国代表大会选出，任期四年，最多连任两届，这一规定是为了防止党被少数船东家族把持。党的经费主要来自船东协会和渔业公司的捐款，反对者因此称它为「船东的党」，党则每年公布捐款名单，并设立一个独立的伦理委员会审查利益冲突。党在海外的萨希利亚侨民中很受欢迎，侨民的捐款和投票在选举中占不小的比重。海岸青年联合会每年组织航海夏令营，带年轻人驾驶单桅帆船沿西海岸航行。\n海岸党的选民是城市居民、高收入者和年轻人，在萨希勒新城和班达里港最强，乡村和北部山区几乎没有它的支部。每年航海季开始时，党在萨希勒港举办单桅帆船赛，几十艘挂着党旗的帆船从老城的海堤出发，绕过港外的小岛返回。党员喜欢说：「我们的祖先驾着帆船来到这里，我们也要驾着帆船走向世界。」", "en": "The Coast National Party is Sahiliya's second party, speaking for the merchants, shipowners, fishing companies and educated middle class of the port towns. Its leader, Amina Shabani, was the republic's first woman Foreign Minister and is now Minister of Finance; she comes from a shipowning family of Bandari and speaks Kasiri, Ranovan and English. Coast National governs with the Islamic Justice Party and holds five ministries: finance, justice, education, transport and the interior. It has some 90,000 members. \nIts thinking joins Sahiliyan nationalism to commercial liberalism: it holds that Sahiliya's identity comes from the sea and from trade, not from religion alone. It wants Sahil and Bandari made free-trade ports with the dhow trade free of duty; the Council of Religious Scholars to review laws but keep out of schools and culture; the fisheries held for the whole nation, with foreign fleets paying for their catch; and more patrol boats for the navy to keep the sea lanes free of pirates and smugglers. It is one of the firmest supporters of the Covenant League, seeing the alliance with Ambohara and Nusira as the foundation of the republic's security. \nIn government it often acts as the brake: whenever Justice's conservatives propose wider powers for the scholars' council or stricter dress rules, Coast National threatens to walk out. The partnership is known as 'the crescent and the sail', each needing and each watching the other. Relations with the People's Labour Party are tense: Labour says Coast National speaks for shipowners, not sailors, and Coast National says Labour's wage policy would leave the ports unable to compete. \nCoast National is organised round the ports and chambers of commerce, with a local committee of shipowners, merchants, lawyers and teachers in each port town. The national congress elects the leader for four years, with at most two terms, a rule meant to stop a few shipowning families taking the party over. Most of its money comes from the shipowners' association and the fishing companies, so its opponents call it 'the shipowners' party'; it publishes its donors each year and has an independent ethics committee to review conflicts of interest. It is popular among Sahiliyans abroad, whose gifts and votes count for a good deal at elections. The Coast Youth Union runs a sailing camp every summer, taking young people down the west coast in dhows.\nIts voters are townspeople, higher earners and the young; it is strongest in new Sahil and Bandari port, and has almost no branches in the countryside or the northern hills. When the sailing season opens each year the party holds a dhow race in Sahil harbour, dozens of boats flying its flag setting out from the old town's sea wall, rounding the islet off the port and coming home. Its members like to say: 'Our forebears came here under sail, and under sail we will go out into the world.'"}
    history: {"zh": "海岸民族党由港口城市的商会、船东协会和世俗派知识分子组建。共和国成立时，它在协商会议上主张限制宗教学者委员会的权力，此后与伊斯兰公正党轮流或联合执政。", "en": "The Coast National Party was formed by the chambers of commerce and shipowners' associations of the port towns and by secular-minded intellectuals. At the founding consultative assembly it argued for limits on the Council of Religious Scholars, and it has since governed with or in turn with the Islamic Justice Party."}
    flag_notes: {"zh": "党旗上半是深蓝色，下半是米白色的波浪，中间是一面白色的帆。深蓝是大海，白帆是西海岸的单桅帆船。", "en": "The flag is deep blue over cream waves, with a white sail in the middle. The blue is the sea; the sail is the dhows of the west coast."}
    factions: [{"names": {"zh": "船东派", "en": "Shipowners' Wing"}, "notes": {"zh": "港口的大船东和渔业公司，主张自由贸易和低税率，是党的主要捐款人。", "en": "The great shipowners and fishing companies of the ports, who want free trade and low taxes; the party's main donors."}}, {"names": {"zh": "世俗派", "en": "Secular Wing"}, "notes": {"zh": "大学教师、律师和年轻专业人士，最关心限制宗教学者委员会的权力和妇女权利。", "en": "Lecturers, lawyers and young professionals, who care most about limits on the scholars' council and about women's rights."}}]
    organisation: {"newspaper": {"zh": "《海岸日报》", "en": "Coast Daily"}, "think_tank": {"zh": "海洋与贸易研究所", "en": "Institute for the Sea and Trade"}, "women": {"zh": "海岸妇女联合会", "en": "Coast Women's Union"}}
