    notes: {"zh": "自由商人党是瓦罗纳商业共和国大议会的第一大党，由三大商会的商人、船东和银行家支持，现任执政官安娜·瓦罗尼是它的领袖。她出身于瓦罗纳最古老的航运家族之一，年轻时在家族的船上当过见习船副，后来接手家族的船运公司，再进入大议会。按照宪法，执政官由大议会从议员中选出，任期六年，不得连任，所以每一任执政官都是党内的一次交接。党员约一万六千，人数不多，但几乎每一家商行都有党员。\n党的口号是「港口对所有人开放」，这也是共和国立国时的国策。它主张转口贸易零关税，船舶登记费保持在全岛最低水平；国际仲裁庭扩建，吸引海外的商业纠纷到瓦罗纳裁决；填海新建一座集装箱码头和一片住宅区，缓解全岛最紧张的住房；对交战各方的商船一视同仁，只禁运武器。它是世俗协约的支持者，但更强调共和国的商业中立，常说「我们和所有人做生意，但不为任何人打仗」。\n在大议会，自由商人党与港城公民党联合执政，后者掌管教育、劳动和社会保障、卫生三个部，弥补了商人党在普通市民中的短板。海员工党批评商人党只代表船东和银行家，码头工人和船员的工资多年没有跟上房价；商人党则回应说，瓦罗纳的每一份工作都来自港口的生意。党内对填海计划也有争论，一部分商人担心新码头会压低现有码头的租金。\n自由商人党的组织与三大商会交织在一起：每个商会的会员大会也是党的地方会议，商会的会长往往就是党的地方负责人。党的候选人名单由三大商会按比例推荐，再由党的全国委员会排序，名单上的前几位几乎总是各商会的世家成员，年轻党员对此常有不满。党的经费由三大商会共同承担，按法律公开，金额在瓦罗纳各政党中最高。党的章程规定，执政官在任期间须把自己在商行中的股份交给独立的信托管理，这一规定被写进了共和国的宪法。青年商人会每年组织「见习船副」计划，送年轻人到商船上航行一个月，了解航运和贸易。\n商人党的选民是高收入者、商行职员和老城区的世家，在港口北岸的商会街区最强。每年海神节，执政官把金戒指投入大海之后，商人党在商会大厅举办晚宴，三大商会的会长轮流致辞，宴会的收入捐给海员子弟学校。党旗是深红色的旗面，中间一个金色的圆形印章，印章里一把钥匙，代表「打开港口的钥匙」，也代表商会大厅里保存的共和国宪章。", "en": "The Free Merchants' Party is the largest party in the Great Council of the Merchant Republic of Varona, backed by the traders, shipowners and bankers of the three great merchant houses, and its leader, Ana Varony, is the Doge. She comes from one of Varona's oldest shipping families, sailed as a cadet officer on the family's ships when young, took over the family line and then entered the Great Council. Under the constitution the Great Council chooses the Doge from among its members for six years without a second term, so every Doge is a handover within the party. Its 16,000 or so members are few, but almost every trading house has one. \nIts watchword, 'a port open to all', was the republic's founding policy. It wants entrepôt trade free of duty and ship registration fees among the lowest on the island; the arbitration court enlarged to bring overseas commercial disputes to Varona; land reclaimed for a new container quay and a housing district, to ease the tightest housing on the island; and the merchant ships of every warring side treated alike, with only arms embargoed. It supports the Secular Accord, but stresses the republic's commercial neutrality: 'we trade with everyone, and fight for no one'. \nIn the Great Council the Free Merchants govern with the Harbour Citizens' Party, which holds education, labour and health and makes up for the merchants' weakness among ordinary townspeople. The Seafarers' Labour Party says the Free Merchants speak only for shipowners and bankers, and that dockers' and crews' pay has lagged behind house prices for years; the Free Merchants answer that every job in Varona comes from the port's trade. The reclamation plan is argued over inside the party too, some merchants fearing a new quay would bring down the rents of the old ones. \nThe Free Merchants are interwoven with the three great houses: each house's general meeting is also a local party meeting, and the head of a house is often the party's local leader. Candidate lists are put forward by the three houses in proportion and ranked by the national committee, and the top places almost always go to members of the old families, a frequent grievance of younger members. The three houses pay the party's way together, published as the law requires, and its funds are the largest of any party in Varona. Its rules require a Doge to place their shares in the family firm in an independent trust while in office, a rule later written into the republic's constitution. The Young Merchants run a cadet scheme each year that sends young people to sail on a merchant ship for a month and learn about shipping and trade.\nIts voters are higher earners, the clerks of the trading houses and the old families of the old town, and it is strongest in the merchant houses' quarter on the north side of the harbour. At the Sea Festival each year, once the Doge has thrown the gold ring into the sea, the party holds a dinner in the merchants' hall where the heads of the three houses speak in turn, the takings going to the school for seafarers' children. Its flag is crimson with a round gold seal bearing a key, 'the key to the port' and the republic's charter kept in the merchants' hall."}
    history: {"zh": "自由商人党由大分裂时组织城市卫队守住港口的商人家族创立。共和国成立后，三大商会的议员组成议会党团，后来改组为政党，长期是大议会的第一大党。", "en": "The Free Merchants' Party was founded by the merchant families who raised the city guard to hold the port in the Sundering. Once the republic was founded the councillors of the three great houses formed a group in the council, which later became a party and has long been the largest in the Great Council."}
    flag_notes: {"zh": "党旗是深红色的旗面，中间一个金色的圆形印章，印章里一把钥匙。深红是商船的帆色，钥匙代表打开港口的钥匙和共和国的宪章。", "en": "The flag is crimson with a round gold seal bearing a key. The crimson is the sails of the merchant fleet; the key is the key to the port and the republic's charter."}
    factions: [{"names": {"zh": "船东派", "en": "Shipowners' Wing"}, "notes": {"zh": "大船东和船运公司，最关心船舶登记、航线安全和对交战各方的中立。", "en": "The great shipowners and lines, who care most about ship registration, safe sea lanes and neutrality towards the warring sides."}}, {"names": {"zh": "银行派", "en": "Bankers' Wing"}, "notes": {"zh": "银行家和仲裁律师，关心仲裁庭、金融监管和与海外市场的联系。", "en": "Bankers and arbitration lawyers, concerned with the court, financial regulation and links to markets overseas."}}]
    organisation: {"newspaper": {"zh": "《瓦罗纳商报》", "en": "Varona Mercantile Gazette"}, "think_tank": {"zh": "海洋贸易研究院", "en": "Academy of Maritime Trade"}, "women": {"zh": "女商人协会", "en": "Merchant Women's Guild"}}
