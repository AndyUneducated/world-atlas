    policies: [{"zh": "扩建伊纳拉机场，开通直飞萨马伊和海外的航班", "en": "Enlarge Inara airport, with direct flights to Samay and overseas"}, {"zh": "允许氏族与外资合作建设小型度假村，氏族持多数股份", "en": "Let clans build small resorts with foreign partners, the clans holding the majority"}, {"zh": "每座岛建一所职业学校，培训导游、厨师和潜水教练", "en": "Build a vocational school on every island to train guides, cooks and diving instructors"}, {"zh": "海底光缆连接萨马伊，全岛高速网络", "en": "Lay a submarine cable to Samay and bring fast internet to every island"}]
