  - id: pty_0a67en
    names: { zh: 王旗君主主义同盟, en: Royal Banner Monarchist League }
    short_names: { zh: 王旗, en: "Royal Banner" }
    color: "#8E1B3A"
    flag: { layout: banner, colors: ["#8E1B3A"], charge: sun, charge_color: "#E9B949" }
    spectrum: 2.2
    family: { zh: 保守派, en: Conservative }
    ideology: [{ zh: 君主主义, en: Monarchism }, { zh: 传统主义, en: Traditionalism }, { zh: 文化民族主义, en: Cultural nationalism }]
    axes: { econ: 6.5, galtan: 9.0, autonomy: 1.0, green: 5.0 }
    leader: { zh: 翁贝卢·瓦拉塞里, en: Ombelu Varaseri }
    members: 13000
    youth_wing: { zh: 王旗青年, en: Banner Youth }
    slogan: { zh: 古老的旗帜，崭新的岛, en: "An old banner, a new island" }
    policies:
      - { zh: 恢复古王国王室后裔的礼仪性地位, en: A ceremonial role for the old kingdom's royal descendants }
      - { zh: 萨伦纳姆老王宫重新用作领地的礼仪中心, en: Sarunnam's old palace to become the territory's ceremonial centre again }
      - { zh: 传统节日列为领地公共假日, en: Traditional festivals as territorial public holidays }
      - { zh: 降低家庭企业和老字号的税负, en: Lower tax for family firms and old shops }
    allies: [pty_4zctgr, pty_mak5vy]
    targets: { div_nwm019: 6 }
    lean: { heritage: 0.6, old: 2.0, "lang:art-x-ivuran": 1.0, "city:div_kv6b3e": 1.0 }
    notes:
      zh: "王旗君主主义同盟（简称王旗）是长夏群岛的传统主义右翼政党，党员一万三千人。它主张恢复古王国王室后裔的礼仪性地位，让萨伦纳姆老王宫重新成为领地的礼仪中心，把传统节日列为领地公共假日，降低家庭企业和老字号的税负。它原名王旗会，改名时把「君主主义」写进党名，在党外引来不少误解：批评者以为它要恢复君主统治，它却一再声明，自己要的不是王座，而是仪式——让古王国的旗帜、礼乐和节日在今天的领地生活里有一席之地。党内的老会员至今更愿意自称「王旗会的人」，觉得「同盟」两个字太像政客。口号「古老的旗帜，崭新的岛」概括了它的自我定位：不是要回到过去，而是带着过去往前走。\n这种定位让王旗始终处在一个微妙的位置。在社会议题上，它极为传统，看重家庭、礼俗和长幼之序；在领地自治上，它的主张也极为坚决，因为在它看来，古王国的传承本身就是长夏群岛自治的理由。它与伊武兰民族复兴党耕的是同一片土壤：两党都珍视伊武兰语、寺庙和老城，复兴讲的是语言权利和社会自由主义，王旗讲的是礼仪和传承。复兴的年轻党员笑王旗是「穿礼服的博物馆」，王旗则回敬复兴「只会念名字，不会行礼」。党内也有分歧：一部分人希望把王室后裔的礼仪地位写进领地的法规，另一部分人认为只要老王宫对公众开放、节日得到恢复就已足够，再往前走反而会坐实「君主主义」的误解。\n上一次选举，王旗得票6.0%，在长夏群岛领地议会121席中得到5席，属反对派。它的友党是梯田农民党和全领地联邦联盟，三党在减税和农村事务上常常一起投票。王旗在野时的代表性成就是保住了老王宫：老王宫险些被改建成酒店时，正是它的前身发起了保护运动；但把传统节日列为公共假日的提案，屡次在执政联盟的多数面前落败，执政的公地共产党认为假日太多会让工资最低的人丢掉加班费。王旗的选民多是年长者，集中在古王国旧都萨伦纳姆和周边的老城：它在萨伦纳姆市议会67席中占7席，是它在其他任何城市议席的两倍多，在其余各市大多只有两三席。伊武兰语母语者和文化遗产地区是它的另一片票仓，年轻选民则很少投它。\n王旗的政治文化处处讲究礼仪。党的会议以击鼓开场，发言者要先向会场正中的旧旗鞠躬；党首翁贝卢·瓦拉塞里主持会议时从不坐主位，主位上放着一面折好的旗，意思是旗比人大。每年王国节，王旗的成员穿着传统服装，从萨伦纳姆老王宫走到海边，把一面旧旗在海水里浸一下，再升起来，寓意古老的旗帜在新的海水里重新开始。党旗用的是古王国旗帜的颜色：深红底上一轮金色的太阳。王旗的根基还在家庭企业，萨伦纳姆的许多老字号店铺门口挂着小小的王旗，店主们说，这比任何招牌都更能说明自家的年头。总书记塞瓦鲁·哈努韦尔的一项日常工作，就是登记这些店铺，每年王国节前给它们换一面新旗。"
      en: "The Royal Banner Monarchist League (the Royal Banner for short) is a traditionalist party of the right in the Everlong Summer Islands, with 13,000 members. It wants a ceremonial role restored to the old kingdom's royal descendants, Sarunnam's old palace made the territory's ceremonial centre again, traditional festivals made territorial public holidays, and lower tax for family firms and long-established shops. It was once the Royal Banner Society, and writing 'monarchist' into its name caused plenty of misunderstanding outside the party. Critics assumed it wanted the crown back in power; it has said again and again that it wants not a throne but ritual, a place for the old kingdom's banner, music and festivals in the territory's life today. Older members still prefer to call themselves 'Society people' and think 'League' sounds too much like politicians. The slogan 'An old banner, a new island' sums up how it sees itself: not going back to the past, but carrying the past forward.\nThat leaves the party in a delicate position. On social questions it is deeply traditional, prizing family, custom and respect for elders; on self-government it is just as firm, since in its view the old kingdom's heritage is itself the reason the islands should run their own affairs. It works the same soil as Ivuran National Renewal: both cherish the Ivuran language, the temples and the old towns, but Renewal talks of language rights and social liberalism, the Royal Banner of ritual and inheritance. Renewal's young members tease it as 'a museum in a dress uniform', and the Royal Banner replies that Renewal 'can read out names but cannot bow'. The party is divided too: some want the royal descendants' ceremonial role written into territorial law, while others think an open palace and restored festivals are enough and that going further would only confirm the 'monarchist' misunderstanding.\nAt the last election the Royal Banner won 6.0% and 5 of the territorial assembly's 121 seats, and sits in opposition. Its allies are the Terrace Farmers' Party and the All-Territories Federal Union, and the three often vote together on tax cuts and rural affairs. Its signature achievement out of office is saving the old palace: when the palace was nearly turned into a hotel, it was the party's forerunner that led the campaign to protect it. Its bill to make traditional festivals public holidays, however, has fallen more than once before the governing majority, with the governing Commons Communist Party arguing that too many holidays cost the lowest-paid their overtime. Its voters are mostly older and concentrated in Sarunnam, the old kingdom's capital, and the old towns around it: it holds 7 of Sarunnam's 67 council seats, more than twice as many as on any other council, and two or three in most other cities. Ivuran speakers and heritage districts are its other source of votes; young voters rarely back it.\nRitual runs through the party's political culture. Meetings open with a drum, and every speaker first bows to the old banner at the centre of the hall; when the leader, Ombelu Varaseri, chairs a meeting, the chair of honour is never taken, which holds a folded banner instead, meaning the banner is greater than any person. Every Kingdom Day its members walk in traditional dress from Sarunnam's old palace to the sea, dip an old banner in the water and raise it again, so that the old banner begins anew in new water. Its flag uses the old kingdom's colours, a golden sun on deep red. The party's roots also lie in family businesses: many of Sarunnam's old shops hang a small Royal Banner by the door, and their owners say it shows how long they have been trading better than any signboard. One of the routine jobs of the general secretary, Sevaru Hanuvel, is keeping the register of these shops and sending each a new banner before Kingdom Day."
    history:
      zh: "王旗君主主义同盟起初是萨伦纳姆的一个老王宫保护协会，成员多是老城的店主、退休教师和寺庙的看守人。老王宫险些被改建成酒店时，协会组织了连续数周的守夜，会员们在宫门前轮流举着古王国的旧旗，最终使改建计划搁浅。此后协会转为政党，起名王旗会；后来为了在选票上亮明立场，改为现名，把「君主主义」写进了党名，但党纲仍明确只主张王室后裔的礼仪性地位。"
      en: "The League began as a conservation society for Sarunnam's old palace, whose members were mostly old-town shopkeepers, retired teachers and temple keepers. When the palace was nearly turned into a hotel, the society kept a vigil for weeks on end, members taking turns to hold the old kingdom's banner at the palace gate, until the conversion plan was shelved. The society then became a party, the Royal Banner Society; it later took its present name to make its position plain on the ballot, writing 'monarchist' into it, though its programme still asks only for a ceremonial role for the royal descendants."
    flag_notes:
      zh: "党旗是一面深红色的旗面，中央是一轮金色的太阳。深红与金色是古王国旗帜的颜色，老人们说古王国的国王在日出时即位，太阳因此成为传承与新一天的象征。王旗取用这一图案，却把太阳画得朴素，没有王冠和权杖，意在表明它纪念的是传承与仪式，而不是统治。"
      en: "The flag is a deep-red field with a golden sun in the centre. Deep red and gold are the colours of the old kingdom's banner, and the old people say the kingdom's rulers took the throne at sunrise, which made the sun a symbol of inheritance and of a new day. The party took the emblem but drew the sun plainly, with no crown or sceptre, to show that it honours heritage and ritual, not rule."
    factions:
      - names: { zh: "王宫礼仪派", en: "Palace Rites Group" }
        notes: { zh: "主张把王室后裔的礼仪地位写进领地法规，由王室后裔在王国节等场合主持仪式，重视礼制的完整。代表萨伦纳姆的老会员和寺庙团体。", en: "Those who want the royal descendants' ceremonial role written into territorial law, with descendants presiding over rites such as Kingdom Day, and who care about keeping the ceremonies whole. They speak for Sarunnam's older members and temple groups." }
      - names: { zh: "老字号商会派", en: "Old Shops Guild" }
        notes: { zh: "以家庭企业和老字号店主为主，主张降低家庭企业的税负、保护老城的商铺，对礼制细节兴趣不大，更看重经济议题，与梯田农民党和全领地联邦联盟合作密切。", en: "Mostly family businesses and long-established shopkeepers, who want lower tax for family firms and protection for old-town shops, care less about the finer points of ritual than about economics, and work closely with the Terrace Farmers and the All-Territories Federal Union." }
      - names: { zh: "新旗圈", en: "New Banner Circle" }
        notes: { zh: "较年轻的会员，主张把王旗塑造成保护文化遗产的政党，淡化「君主主义」色彩，愿意在老城保护和伊武兰语议题上与伊武兰民族复兴党合作。", en: "Younger members who want to recast the party as a heritage party, play down the 'monarchist' label and work with Ivuran National Renewal on protecting the old towns and the Ivuran language." }
    organisation:
      newspaper: { zh: "《王旗报》", en: "The Banner" }
      think_tank: { zh: "古王国礼制研究会", en: "Old Kingdom Rites Society" }
      unions: { zh: "萨伦纳姆老字号商户协会", en: "Sarunnam Old Shops Association" }
      women: { zh: "王宫妇女会", en: "Palace Women's Circle" }

  - id: pty_6c94cq
    names: { zh: 自由公社共产主义运动, en: Libertarian Communist Commune Movement }
    short_names: { zh: 公社, en: "Commune" }
    color: "#E63946"
    flag: { layout: diagonal, colors: ["#E63946", "#1B1B1B"], charge: ring_homes, charge_color: "#FFFFFF" }
    spectrum: -3.0
    family: { zh: 激进左翼, en: Radical left }
    ideology: [{ zh: 自由意志共产主义, en: Libertarian communism }, { zh: 直接民主, en: Direct democracy }, { zh: 自治主义, en: Autonomism }, { zh: 公社主义, en: Communalism }]
    axes: { econ: 0.0, galtan: 0.5, autonomy: 0.5, green: 2.0 }
    leader: { zh: 伊拉瓦伊·科卢门, en: Iravai Kolumen }
    leader_title: { zh: 轮值发言人, en: Rotating spokesperson }
    members: 7600
    youth_wing: { zh: 公社青年, en: Commune Youth }
    slogan: { zh: 一切归于大会, en: All to the assembly }
    policies:
      - { zh: 每个街区设居民大会，决定本街区的预算, en: "An assembly in every neighbourhood, deciding its own budget" }
      - { zh: 土地和住房由社区合作社持有, en: Land and housing held by community cooperatives }
      - { zh: 议员任期一届，不得连任, en: "One term for every representative, with no re-election" }
      - { zh: 议员工资与当地工人平均工资相同, en: "Representatives paid the local average wage" }
    allies: [pty_09zrw1]
    targets: { div_nwm019: 4 }
    lean: { "status:commune": 3.5, young: 2.0 }
    notes:
      zh: "自由公社共产主义运动（简称公社）站在长夏群岛政治光谱的最左端。它主张直接民主：每个街区设居民大会，决定本街区的预算；土地和住房由社区合作社持有；议员任期一届，不得连任，工资与当地工人的平均工资相同。它原名公社运动，改名的争论旷日持久。一派认为，把任何「主义」写进党名，都是把活的大会变成死的教条；另一派则说，当改革派的公地也把「共产党」三个字写进党名时，公社若不亮出自己的旗号，「共产主义」就只剩下政务院里的那一种。最后的方案在「共产主义」前面加上「自由」，在后面留下「公社」——用公社成员的话说，自由是方法，公社是地方，共产主义是目的。口号「一切归于大会」来自老街区的修缮会议，意思是任何决定都不应在大会之外作出。\n公社的大本营是埃武托拉公社。那里的权力机关是公社人民代表大会，55名代表随时可以由选民联署罢免，公社成员把代表的本分概括为「叫来就来，叫走就走」。在55席中，公社与公地共产党各占15席，两党合计过半，按联合协议由公社出任公社管理委员会主任；现任主任尼拉迈·翁巴赖和代表大会主席乌玛蕾萨·韦卢卡姆都是公社的人。对一个反对等级的运动来说，这是一种别扭的成功：它掌管着一座城市的预算、垃圾车和自来水，又要不断证明自己没有变成它批评的那种「管理者」。尼拉迈·翁巴赖每周在中央广场的大榕树下公开答问，管理委员会的每一笔开支都先在街区大会上公示，街区大会可以把预算退回去，也真的退回过。\n与公地共产党的关系是公社绕不开的矛盾。两党在埃武托拉一起执政，在领地层面却站在不同的位置：公地是长夏群岛领地议会第一大党，在总理梅鲁瓦伊·托兰加姆的政务院十一个部里握有三个；公社在121席中只有3席，得票4.0%，从不入阁，只在住房、合作社和公共服务的法案上逐案投赞成票。在公社看来，公地走的是「从上往下的共产主义」：居民被请来参加听证，却不被请来做决定。公社也承认，公地的政务院办成了公社自己办不成的事，领地范围的租金管制和合作社贷款表决时，公社议员都投了赞成票，在执政联盟只多一席的议会里，这几票让政务院松了一口气。这种既是同志又是对手的关系，公社内部有个说法：「我们和公地吃同一锅饭，但各自洗碗。」\n公社的选民几乎都来自两类人：埃武托拉的居民和年轻选民。在埃武托拉之外，它在九座城市的议会里各只有一席，在温达坎市议会和按岛分区选举的基鲁迈联合邦议会里没有议席；这些孤零零的市议员多是从租户运动和学生团体里走出来的年轻人，被同伴戏称为「孤岛代表」。公社没有党首，只有一位轮值发言人，现任发言人是伊拉瓦伊·科卢门；总书记拉韦卢·塞洛迈在党内被戏称为「记录员」，职责是记下大会的决定，而不是作出决定。它的领地议员每周回埃武托拉一次，向街区大会报告自己的每一次投票。党旗沿斜线分为红黑两色，红色一侧是一圈白色的房屋，代表合作社的街区。"
      en: "The Libertarian Communist Commune Movement (the Commune for short) stands at the far-left end of the Everlong Summer Islands' political spectrum. It stands for direct democracy: an assembly in every neighbourhood deciding its own budget, land and housing held by community cooperatives, and representatives who serve a single term on the local average wage. It was once simply the Commune Movement, and the argument over its new name dragged on and on. One side held that writing any '-ism' into the name would turn a living assembly into dead dogma; the other said that once the reformers of the Commons had put 'Communist Party' into their own name, the movement had to raise its own flag, or communism would come to mean only the kind practised in the cabinet. The final wording put 'libertarian' before 'communist' and kept 'commune' after it; as members put it, freedom is the method, the commune is the place, and communism is the goal. The slogan 'All to the assembly' comes from the old quarter's repair meetings and means that no decision should be taken outside the assembly.\nThe movement's base is Evutola Commune, governed by a Commune People's Congress of 55 delegates who can be recalled at any time by petition; members sum up a delegate's duty as 'come when called, go when told'. The Commune and the Commons Communist Party hold 15 seats each, a majority between them, and under their coalition agreement the Commune chairs the Commune Management Committee; the chair, Nilamai Ombarai, and the President of the Congress, Umaresa Velukkam, both belong to the movement. For a movement opposed to hierarchy it is an awkward success: it runs a town's budget, bin lorries and water supply while having to prove, again and again, that it has not become the kind of 'manager' it criticises. Nilamai Ombarai takes public questions under the great banyan in the central square every week, every item of the committee's spending is posted first at the neighbourhood assemblies, and those assemblies can send a budget back, and have done.\nThe relationship with the Commons Communist Party is the contradiction the movement cannot get round. The two govern Evutola together but stand in different places in the territory: the Commons are the largest party in the territorial assembly and hold three of the eleven ministries in Premier Meruvai Tolangam's cabinet, while the Commune has 3 of the 121 seats on 4.0% of the vote, never joins the government and votes for bills on housing, cooperatives and public services case by case. To the Commune, the Commons practise 'communism from the top down', in which residents are invited to the hearings but not to the decisions. The movement also admits that the Commons' cabinet has done what it could not do itself: when territory-wide rent controls and cooperative loans came to a vote, the Commune's members voted for them, and in an assembly where the coalition has a single seat to spare, those votes let the cabinet breathe easier. Members have a phrase for this comradeship and rivalry: 'We eat from the same pot as the Commons, but we each wash our own bowls.'\nThe movement's voters come almost entirely from two groups: the people of Evutola and the young. Outside Evutola it holds a single seat on each of nine city councils and none on Undakan's or on the Commonwealth Assembly of Kirumai, which is elected island by island; these lone councillors are mostly young people from tenants' campaigns and student groups, nicknamed 'island delegates' by their comrades. The movement has no leader, only a rotating spokesperson, at present Iravai Kolumen; the general secretary, Ravelu Selomai, is jokingly called 'the recorder', whose job is to write down the assembly's decisions, not to make them. Its members of the territorial assembly go back to Evutola once a week to report every vote they cast to the neighbourhood assemblies. The flag is divided diagonally into red and black, with a ring of white houses on the red, standing for the cooperative neighbourhood."
    history:
      zh: "自由公社共产主义运动起于埃武托拉的一场住房合作运动：一片老街区面临拆除，居民们凑钱把它买了下来，在街区大会上一户一户地决定如何修缮、谁先搬回。这种做法后来推广到整座城市，街区大会成了埃武托拉公共生活的基本单位，参加这场运动的人也组成了公社运动。后来党改为现名，在党名中写明自由意志共产主义，以区别于同样自称共产主义的改革派公地共产党。"
      en: "The movement grew out of a housing cooperative in Evutola: residents pooled their money to buy an old quarter due for demolition and decided, household by household at a neighbourhood assembly, how to repair it and who would move back first. The practice later spread across the town, the neighbourhood assembly became the basic unit of Evutola's public life, and the people of that campaign formed the Commune Movement. The party later took its present name, spelling out libertarian communism to set itself apart from the reformers of the Commons Communist Party, who also call themselves communists."
    flag_notes:
      zh: "党旗沿一条从旗尾上角斜向旗杆下角的斜线一分为二，靠旗杆的上半是红色，另一半是黑色。红色代表共产主义，黑色代表拒绝等级与命令的自由传统，两色并列，意思是两者缺一不可。红色上是一圈白色的房屋，屋门都朝向圆心，象征街区大会：每一户都面对共同的广场。这个图案最早画在老街区修缮时合作社的门牌上。"
      en: "The flag is divided by a diagonal running from the upper fly corner down to the lower hoist corner, red in the upper part by the hoist and black in the other. Red stands for communism, black for the libertarian refusal of hierarchy and command, side by side because neither will do without the other. On the red is a ring of white houses with every door facing the centre, standing for the neighbourhood assembly, every household facing the shared square. The design was first painted on the cooperative's door plates when the old quarter was repaired."
    factions:
      - names: { zh: "大会派", en: "Assembly Tendency" }
        notes: { zh: "直接民主的原则派，主张公社不出任管理委员会主任，只在代表大会和街区大会里监督，以免沾上管理者的习气；对与公地共产党的联合协议始终持保留态度。代表老街区合作社的元老。", en: "The purists of direct democracy, who want the movement to give up the Management Committee chair and confine itself to scrutiny in the Congress and neighbourhood assemblies, so as not to catch the manager's habits; they have always had reservations about the coalition with the Commons. They speak for the old quarter's cooperative veterans." }
      - names: { zh: "管委会派", en: "Committee Tendency" }
        notes: { zh: "支持出任管理委员会主任，认为公社必须证明直接民主能管好一座城市的水、电和垃圾车，主张在领地层面与公地共产党逐案合作。代表埃武托拉的街区干部和公共服务人员。", en: "Supporters of holding the Management Committee chair, who believe the movement must prove that direct democracy can run a town's water, power and bin lorries, and who favour case-by-case cooperation with the Commons in the territory. They speak for Evutola's neighbourhood organisers and public service workers." }
      - names: { zh: "外城合作社圈", en: "Beyond Evutola Circle" }
        notes: { zh: "致力于把住房合作社和街区大会带到埃武托拉以外的城市，依靠年轻租户和学生团体，主张优先在各地建设合作社网络，而不是争取更多议席。", en: "Activists working to carry housing cooperatives and neighbourhood assemblies to cities beyond Evutola, relying on young tenants and student groups, and putting a network of cooperatives ahead of winning more seats." }
    organisation:
      newspaper: { zh: "《榕树下》", en: "Under the Banyan" }
      think_tank: { zh: "直接民主工作坊", en: "Direct Democracy Workshop" }
      unions: { zh: "埃武托拉住房合作社联合会", en: "Evutola Federation of Housing Cooperatives" }
      women: { zh: "公社妇女大会", en: "Commune Women's Assembly" }

  - id: pty_e3vfvk
    names: { zh: 芯片海岸党, en: Chip Coast Party }
    short_names: { zh: 芯岸, en: "Chip Coast" }
    color: "#00B4D8"
    flag: { layout: banner, colors: ["#00B4D8"], charge: crystal }
    spectrum: 0.6
    family: { zh: 自由派, en: Liberal }
    ideology: [{ zh: 科技自由主义, en: Tech liberalism }, { zh: 亲商主义, en: Pro-business }, { zh: 城市进步主义, en: Urban progressivism }]
    axes: { econ: 6.5, galtan: 3.0, autonomy: 5.0, green: 6.5 }
    leader: { zh: 林澈, en: Lin Che }
    members: 6400
    youth_wing: { zh: 芯岸青年, en: Chip Coast Youth }
    slogan: { zh: 把未来做成芯片, en: Etch the future }
    policies:
      - { zh: 芯片和电池工厂的电价与用水优先保障, en: Priority power and water supply for chip and battery plants }
      - { zh: 理工科大学扩招一倍, en: Double the intake of the technical universities }
      - { zh: 海外工程师的家属随迁便利, en: "Easier moves for overseas engineers' families" }
      - { zh: 工业园区周边修建新的住宅和轻轨, en: New housing and light rail around the industrial parks }
    allies: [pty_ymxc2s, pty_mak5vy]
    targets: { div_nwm019: 5 }
    lean: { semiconductor: 1.0, battery: 0.5, tech: 0.6, pharma: 0.3, income: 0.6, "lang:en": 1.0 }
    notes:
      zh: "芯片海岸党（简称芯岸）是长夏群岛的中右翼科技自由派，党员六千四百人，选民多是南部海岸芯片、电池和制药工业城市里的工程师和技术工人。党名来自那一串工业城市，当地人把它们叫作「芯片海岸」，夜里从海上看，工厂的灯光连成一条线。它主张优先保障芯片和电池工厂的电力与用水，理工科大学扩招一倍，方便海外工程师的家属随迁，在工业园区周边修建新的住宅和轻轨。口号「把未来做成芯片」有两层意思：一是产业，二是方法——像设计电路一样设计政策，先画图，再测试，出了错就改版。党首林澈原是一家晶圆厂的工艺工程师，她说自己参政的理由很简单：「工厂里的问题我会修，城市里的问题也想试试。」\n芯岸的内在张力在于它既是亲商的政党，又是城市进步主义的政党。在税收、监管和工厂审批上，它站在企业一边，希望政府少设关卡；在社会议题上，它又相当开放，支持海外工程师的家属随迁、多语种的学校和夜间公交。两种立场在住房问题上最容易相撞：企业希望园区周边快速建房以留住工程师，园区里的年轻技术员却在为房租抗议，要求租金管制，而这正是党内亲商派最不愿听到的词。党内为此有一句自嘲：「我们的选民一半是老板，一半在给老板写辞职信。」芯岸还与梯田农民党有着长期的分歧：工厂要水，梯田也要水；园区要扩建住宅，梯田农民党却坚持农地不得改作工业和住宅用地。每逢旱季，两党在议会里的辩论被记者称作「晶圆对稻田」。\n芯岸在长夏群岛领地议会121席中有3席，得票5.0%，属反对派。它的友党是灯塔自由民主党和全领地联邦联盟，三党在预算辩论中常常联手，要求降低工业电价、简化园区审批。它在野的影响力主要来自专业：芯岸议员提出的电网与供水调度方案，曾被公地共产党主导的政务院部分采纳，夏季用电高峰时晶圆厂的限电因此减少，林澈说这是「在反对席上交付的项目」。在各市议会中，它以基拉努的议席最多，在57席中占6席，在塔卢马兰有4席，在温达坎、彭纳拉姆这样的稻作城市则各只有1席。英语母语者、高收入者和信息技术行业的从业者是它稳定的选民，低收入者对它较为冷淡，不少人觉得它关心的是工厂，而不是工人。\n芯岸的政治文化像一家工程公司。党代会被党员叫作「评审会」，每项提案都要附一页「失败模式分析」，写明这项政策可能在哪里出错；党员可以在网上对纲领逐条提交修改，像提交代码一样排队审核，通过的修改会署上提交人的名字。新党员的入党仪式是在一块报废的晶圆上签名，这些晶圆挂满了党部的一面墙，在灯下闪闪发光。党旗是青蓝色的旗面上一枚多面的晶体，青蓝是南部海岸的海水和洁净室灯光的颜色，晶体代表硅，也代表透明。在总书记伊卢文娜·哈努韦尔的主持下，党部每季度公布一份「承诺进度表」，用绿、黄、红三色标出每项竞选主张的进展，红色的那一栏从不删去。"
      en: "The Chip Coast Party (Chip Coast for short) is the Everlong Summer Islands' centre-right technological liberal party, with 6,400 members; its voters are mostly engineers and technicians in the chip, battery and pharmaceutical cities of the south coast. Its name comes from that string of industrial cities, which locals call the Chip Coast, whose factory lights join into one line when seen from the sea at night. It wants power and water for chip and battery plants guaranteed first, the technical universities' intake doubled, easier moves for overseas engineers' families, and new housing and light rail around the industrial parks. Its slogan, 'Etch the future', carries two meanings: one is industry, the other method, designing policy the way one designs a circuit: draw it, test it, and revise it when it fails. Its leader, Lin Che, was a process engineer at a wafer plant, and says her reason for entering politics is simple: she can fix the problems in a factory, and wants to try the problems in a city.\nThe party's inner tension is that it is both pro-business and urban-progressive. On tax, regulation and planning consent for plants it sides with business and wants fewer hurdles; on social questions it is quite open, backing family moves for overseas engineers, multilingual schools and night buses. The two collide most readily over housing: firms want homes built fast around the parks to keep their engineers, while young technicians in the parks protest over rents and demand rent controls, the very words the party's pro-business wing least likes to hear. Members joke that 'half our voters are bosses and the other half are writing their resignation letters to them'. Chip Coast also has a long-running quarrel with the Terrace Farmers' Party: factories need water and so do terraces, and the parks want new housing while the Terrace Farmers insist no farmland be rezoned for industry or homes. In the dry season reporters call their debates in the assembly 'wafers versus paddies'.\nChip Coast holds 3 of the territorial assembly's 121 seats on 5.0% of the vote and sits in opposition. Its allies are the Lighthouse Liberal Democrats and the All-Territories Federal Union, and the three often join forces in budget debates to demand cheaper industrial power and simpler approval for the parks. Its influence out of office comes mainly from expertise: a plan from its members for dispatching power and water was partly adopted by the cabinet led by the Commons Communist Party, cutting power restrictions on wafer plants at summer peaks, which Lin Che calls 'a project delivered from the opposition benches'. Of all the city councils it holds the most seats on Kilanu's, 6 of 57, and has 4 in Talumaran, but just one each in rice-growing cities such as Undakan and Pennaram. English speakers, high earners and people working in information technology are its steady voters; low-income voters are cool towards it, and many feel it cares about factories rather than the people who work in them.\nThe party's political culture is that of an engineering firm. Members call its congress 'the design review', and every motion must come with a one-page 'failure mode analysis' setting out where the policy could go wrong; members can submit amendments to the programme clause by clause online, queued for review like code, and accepted changes carry the name of the person who proposed them. New members are welcomed by signing a scrapped wafer, and these wafers cover a whole wall of the party office, glittering under the lights. The flag shows a many-faceted crystal on a cyan field: the cyan of the south-coast sea and of clean-room lighting, the crystal standing for silicon and for transparency. Under the general secretary, Iluvenna Hanuvel, the party office publishes a quarterly 'pledge tracker' that marks the progress of each election promise in green, amber or red, and the red column is never deleted."
    history:
      zh: "芯片海岸党由南部海岸几家工业园区的工程师协会组建。起因是一个夏天的连续停电：电网在用电高峰时一再跳闸，几座晶圆厂被迫停产，报废的晶圆堆满了仓库。工程师们发现，没有哪个政党能说清楚电网为什么会垮，于是自己写了一份供电改进方案，带着它去参选。党名取自当地人对这串工业城市的称呼「芯片海岸」，那份方案的封面后来成了党的第一张竞选海报。"
      en: "The party was formed by the engineers' associations of several south-coast industrial parks after a summer of power cuts: the grid kept tripping at peak demand, several wafer plants were forced to stop, and scrapped wafers piled up in the warehouses. The engineers found that no party could explain why the grid kept failing, so they wrote their own plan for improving the power supply and stood for election on it. The name comes from what locals call that string of industrial cities, the Chip Coast, and the cover of the plan became the party's first campaign poster."
    flag_notes:
      zh: "党旗是一面青蓝色的旗面，中央是一枚多面的晶体。青蓝取自南部海岸的海水，也是晶圆厂洁净室里灯光的颜色；晶体既代表硅这种芯片的原料，也代表芯岸希望政府做到的透明——每一个切面都看得见。这个图案最初是工程师协会会徽上的一颗单晶硅，建党时被简化成现在的样子。"
      en: "The flag is a cyan field with a many-faceted crystal in the centre. The cyan is the sea off the south coast and the light of the wafer plants' clean rooms; the crystal stands for silicon, the raw material of chips, and for the transparency the party wants from government, every face visible. The emblem began as a silicon crystal on the engineers' associations' badge and was simplified into its present form when the party was founded."
    factions:
      - names: { zh: "洁净室派", en: "Clean Room Group" }
        notes: { zh: "晶圆厂和电池厂的工程师，是党的创始班底，主张以技术官僚的方式治理，重视电网、供水和人才政策，对意识形态之争兴趣不大。", en: "Engineers from the wafer and battery plants, the party's founding core, who favour technocratic government, focus on the grid, water and skills policy, and have little interest in ideological battles." }
      - names: { zh: "园区租户论坛", en: "Park Tenants' Forum" }
        notes: { zh: "年轻的技术员和外来工程师家庭，主张在园区周边大规模建设租赁住房和轻轨，部分人支持温和的租金管制，是党内城市进步主义的一翼。", en: "Young technicians and incoming engineers' families who want rental housing and light rail built at scale around the parks, some backing mild rent controls; the party's urban-progressive wing." }
      - names: { zh: "海岸商会圈", en: "Coast Chamber Circle" }
        notes: { zh: "园区的企业主和供应商，主张降低工业电价、简化审批和减税，反对租金管制，与全领地联邦联盟、灯塔自由民主党关系密切。", en: "Business owners and suppliers in the parks who want cheaper industrial power, simpler approvals and lower taxes, oppose rent controls, and are close to the All-Territories Federal Union and the Lighthouse Liberal Democrats." }
    organisation:
      newspaper: { zh: "《芯岸周刊》", en: "Chip Coast Weekly" }
      think_tank: { zh: "海岸创新研究所", en: "Coast Innovation Institute" }
      unions: { zh: "南岸工程师协会", en: "South Coast Engineers' Association" }
      women: { zh: "女工程师网络", en: "Women Engineers' Network" }

  # ── 加利福尼亚自治州 ──
  # members: voters registered with the party, as California counts them.
  - id: pty_tjjewx
    names: { zh: 民主党, en: Democratic Party, es: Partido Demócrata }
    short_names: { zh: 民主党, en: "Democrats" }
    color: "#1F5FBF"
    flag: { layout: bands, colors: ["#1F5FBF", "#FFFFFF", "#1F5FBF"], ratio: [1, 2, 1], charge: star5, charge_color: "#1F5FBF" }
    spectrum: -0.9
    family: { zh: 中左翼自由派, en: Centre-left liberal }
    ideology: [{ zh: 现代自由主义, en: Modern liberalism }, { zh: 进步主义, en: Progressivism }, { zh: 技术乐观主义, en: Techno-optimism }]
    axes: { econ: 4.0, galtan: 2.5, autonomy: 4.0, green: 4.5 }
    leader: { zh: 帕克斯顿·黑尔, en: Paxton Hale }
    leader_title: { zh: 党领袖（州长）, en: Party leader (Governor) }
    members: 2300000
    youth_wing: { zh: 青年民主党人, en: Young Democrats }
    slogan: { zh: 我们正在研究这个问题, en: We are studying the problem }
    policies:
      - { zh: 再成立一个无家可归者问题工作组，专门评估此前各个工作组的成效, en: Set up another task force on homelessness to assess how the earlier task forces did }
      - { zh: 高速铁路继续修，下一期工程一定通到失落天使, en: "Keep building the high-speed railway: the next phase will surely reach Lost Angeles" }
      - { zh: 人工智能公司签署自愿伦理承诺以后，可以「负责任地」减税, en: Let AI companies that sign a voluntary ethics pledge have their taxes cut ‘responsibly’ }
      - { zh: 每个警察分局配一名社区联络员，同时再配一辆新装甲车, en: "Give every police precinct a community liaison officer, and a new armoured car as well" }
    targets: { div_x2z14w: 34 }
    lean: { urban: 0.3, "lang:es": 0.6, young: 1.0, education: 0.5, entertainment: 0.6, media: 0.4, oil: -0.6, enforcement: -0.4, agriculture: -0.2 }
    notes:
      zh: "民主党是加利福尼亚自治州最大的政党，在选民登记表上勾选民主党的约有230万人。州长帕克斯顿·黑尔是民主党人，他在前两名初选中领先，又在大选里以61.3%对38.7%击败共和党的科尔特·巴林顿。民主党在众议院80席中占52席，在参议院40席中占25席，两院都是多数党，众议院议长埃弗里·斯特林和参议院临时议长埃夫拉因·巴拉甘都出自民主党。不过两院都没到三分之二，各差两席，而加税和推翻州长否决都需要三分之二，所以每逢预算季，党鞭都要去和加速党、拔插头联盟逐个谈条件，谈下来的往往是又一条税收减免。\n前两名初选让民主党最大的对手常常是民主党人自己。众议院有20个选区的大选是同党对决，其中14个是两名民主党人；失落天使市长泰勒·克劳利也是在大选里以51.0%对49.0%击败另一位民主党人才当选的。同党对决比跨党竞选打得更凶，候选人互相指责对方「收了模型公司的钱」，而这在多数情况下都属实。\n黑尔的内阁里，11个厅有9个由民主党人主持，司法厅和卫生与人类服务厅交给了无党籍专家。党纲承诺解决无家可归、住房和治安问题，实际的做法是成立工作组：州里现在有十几个研究无家可归问题的工作组，最新的一个负责评估前面那些工作组。许多街区的警察分局像帮派一样划地盘、收保护费，民主党一边承诺改革，一边在每次选举前接受警察工会的背书。高速铁路是党的招牌工程，修了这么久只通了中央谷地的一段，每天两班车，党的宣传册上却一直印着通到失落天使的线路图。\n民主党在城市、影视与流媒体地区、高校周边和西班牙语母语者中最强，在乡村、油田和移民执法机构集中的地区最弱。七座城市的市长是民主党人：首府萨克拉钱托、最大城市失落天使，以及仓储帝国、阿尔蒙多、斯塔克顿、圣塞雷娜和莫内特里。失落天使市议会17席全部归民主党，这里的政治斗争全在党内进行。\n党的筹款晚宴大多在比佛利账单区和比尔斯伯勒的豪宅里举行，捐款最多的是科技公司和制片公司。党的演讲稿越来越多地由模型起草，党代会为此专门通过了一项决议，要求每篇演讲稿里「至少有一个真人想出来的笑话」。"
      en: "The Democratic Party is the largest party in the California Autonomous State: some 2.3 million voters tick its box on the voter roll. Governor Paxton Hale is a Democrat; he led the top-two primary and then beat the Republican Colt Barrington in the general election by 61.3% to 38.7%. The Democrats hold 52 of the Assembly’s 80 seats and 25 of the Senate’s 40, the majority in both chambers, and both the Speaker of the Assembly, Avery Sterling, and the President pro Tempore of the Senate, Efraín Barragán, are Democrats. Neither chamber gives them two-thirds, though: they are two seats short in each, and raising a tax or overriding the governor’s veto takes two-thirds. So every budget season the whips go round the Accelerate Party and the Unplug League one by one, and what comes back is usually one more tax break.\nUnder the top-two primary the Democrats’ fiercest rivals are often other Democrats. Twenty Assembly districts went to a general election between two candidates of one party, fourteen of them between two Democrats, and the Mayor of Lost Angeles, Tyler Crowley, won his general election by 51.0% to 49.0% against another Democrat. Same-party races are nastier than the cross-party kind: the candidates accuse each other of ‘taking money from the model companies’, and in most cases they are right.\nNine of the eleven departments in Hale’s cabinet are led by Democrats, with Justice and Health and Human Services left to non-partisan experts. The platform promises to solve homelessness, housing and public safety; in practice the party sets up task forces. The state now has a dozen or so task forces on homelessness, the newest of them charged with assessing the others. In many neighbourhoods the police precincts carve up turf and collect protection money like gangs; the Democrats promise reform and take the police union’s endorsement before every election. The high-speed railway is the party’s flagship: after all this time only one stretch in the Central Valley is open, with two trains a day, while the party’s leaflets still show the line running all the way to Lost Angeles.\nThe party is strongest in the cities, in film and streaming areas, around the universities and among Spanish speakers, and weakest in the countryside, the oilfields and the areas where immigration enforcement is concentrated. Seven cities have Democratic mayors: the capital Sacramoney, the largest city Lost Angeles, and Warehouse Empire, Almondo, Stuckton, Santa Serena and Monetary. All 17 seats on the Lost Angeles City Council belong to Democrats, so the city’s politics happen entirely inside the party.\nIts fundraising dinners are mostly held in mansions in Beverly Bills and Billsborough, and its biggest donors are tech and production companies. More and more of its speeches are drafted by models, so the party convention passed a resolution requiring every speech to contain ‘at least one joke thought up by a human’."
    history:
      zh: "民主党在加州的历史和州议会一样长。早年它是港口工人、农场工人和新来移民的党，后来湾区的科技公司兴起，它又成了工程师和创业者的党，从此长期执政。湾区的工厂和机房改由机器运转、工程师们搬走以后，党的选民留在了失落天使和中央谷地的城市里，捐款却仍然来自湾区的公司，这道裂缝至今没有弥合。"
      en: "The Democrats are as old as the State Legislature. At first they were the party of dockers, farmworkers and newly arrived immigrants; when the Bay’s tech companies rose they became the party of engineers and founders too, and have governed ever since. Once the Bay’s factories and server halls were handed over to machines and the engineers moved away, the party’s voters stayed in Lost Angeles and the towns of the Central Valley while its money kept coming from the Bay’s companies, a rift that has never closed."
    flag_notes:
      zh: "党旗是蓝、白、蓝三道横条，中间的白条上有一颗蓝色五角星。蓝色是党的传统颜色，五角星代表美国。党内有人提议在星星旁边加一个芯片图案，感谢科技界多年的支持，提案在党代会上被搁置，交给了一个工作组研究。"
      en: "The flag is three bands, blue, white and blue, with a blue star on the white. Blue is the party’s traditional colour and the star stands for the United States. A motion to add a microchip beside the star, in thanks for the tech industry’s long support, was shelved at the convention and handed to a task force."
    factions:
      - names: { zh: "进步核心", en: "Progressive Core" }
        notes: { zh: "以年轻党员、租房者和失落天使的街区组织为主，要求租金管制、对人工智能公司征收自动化税、解散警察分局里的「保护费小组」，常在初选里挑战现任议员；众议院的同党对决大多是这一派对上捐款人圈。", en: "Mostly young members, renters and Lost Angeles neighbourhood groups. It wants rent control, an automation tax on AI companies and the disbanding of the precincts’ ‘protection squads’, and often challenges sitting members in the primary; most of the Assembly’s same-party races pit it against the Donor Circle." }
      - names: { zh: "捐款人圈", en: "Donor Circle" }
        notes: { zh: "围绕科技和影视捐款人的温和派，主张「负责任的创新」和企业减税，控制着党的筹款委员会；党的演讲稿和竞选广告大多出自这一派签约的模型公司。", en: "The moderates around the tech and film donors, who favour ‘responsible innovation’ and business tax cuts and control the party’s finance committee; most of its speeches and campaign ads come from model companies under contract to this wing." }
      - names: { zh: "萨克拉钱托机器", en: "Sacramoney Machine" }
        notes: { zh: "由资深议员、游说区的顾问和公共部门工会组成，擅长在两院之间交换条款，也是警察工会和监狱看守工会在党内的联络人。批评者说，州里的每一个工作组都出自这一派之手。", en: "Veteran legislators, consultants from the Lobbyton District and public-sector unions, skilled at trading clauses between the two chambers and the party’s link to the police and prison guards’ unions. Critics say every task force in the state is its work." }
    organisation:
      newspaper: { zh: "《蓝色海岸日报》", en: "Blue Coast Daily" }
      think_tank: { zh: "负责任未来研究所", en: "Institute for a Responsible Future" }
      unions: { zh: "州立学校教职员联合会、公共雇员大联盟", en: "State School Staff Federation, Public Employees’ Alliance" }
      women: { zh: "民主党妇女联合会", en: "Democratic Women’s Federation" }

  - id: pty_wnve4x
    names: { zh: 共和党, en: Republican Party, es: Partido Republicano }
    short_names: { zh: 共和党, en: "Republicans" }
    color: "#C8102E"
    flag: { layout: banner, colors: ["#C8102E", "#FFFFFF"], division: bordure, charge: star5, charge_color: "#FFFFFF" }
    spectrum: 2.2
    family: { zh: 保守右翼, en: Conservative right }
    ideology: [{ zh: 保守主义, en: Conservatism }, { zh: 财政保守主义, en: Fiscal conservatism }, { zh: 移民限制主义, en: Immigration restrictionism }]
    axes: { econ: 7.5, galtan: 8.0, autonomy: 7.0, green: 8.5 }
    leader: { zh: 科尔特·巴林顿, en: Colt Barrington }
    members: 1450000
    youth_wing: { zh: 青年共和党人, en: Young Republicans }
    slogan: { zh: 让加州重新负担得起, en: Make California Affordable Again }
    policies:
      - { zh: 取消汽油税，省下的钱用来把停车场修得更宽, en: Scrap the petrol tax and spend the savings on wider car parks }
      - { zh: 南海岸的钢墙再加高三米，并装上人脸识别, en: Raise the steel wall on the south coast by another three metres and fit it with face recognition }
      - { zh: 拆下高速铁路的钢轨卖掉，偿还建设债券, en: Pull up the high-speed railway’s rails and sell them to pay off the construction bonds }
      - { zh: 恢复全部石油钻井许可，把荒漠枢纽站改成炼油厂的员工食堂, en: Restore every drilling permit and turn Desert Hub Station into a refinery canteen }
    allies: [pty_gcy2g7]
    targets: { div_x2z14w: 23 }
    lean: { urban: -0.4, old: 3.0, oil: 0.9, agriculture: 0.4, dairy: 0.5, enforcement: 0.9, security: 0.4, defence: 0.5, luxury: 0.3, "lang:es": -1.2 }
    notes:
      zh: "共和党是加州第二大党，登记选民约145万人。党领袖科尔特·巴林顿在州长初选中排第二，进入大选后以38.7%输给民主党的帕克斯顿·黑尔，现在是众议院的少数党领袖。共和党在初选中得票22.8%，在众议院有14席，在参议院有8席。前两名初选对它很不友好：在民主党占优的城市选区，共和党候选人常常排在两名民主党人之后，连大选都进不去。\n共和党的地盘在乡村、油田、农场和移民执法机构集中的地区，压裂原区和后山区是它得票最高的地方。巴雷尔斯菲尔德和帕姆斯普林克勒的市议会全部席位、玛门市议会的大部分席位都归共和党。这些地方的政治同样在党内解决：众议院有6个选区的大选是两名共和党人对决，巴雷尔斯菲尔德、帕姆斯普林克勒、玛门和离岸群岛四座城市的市长选举也一样。共和党还拿下了第二大城市圣遣返的市长，阿图罗·巴尔德斯皮诺以50.4%对49.6%险胜民主党对手；市议会里共和党和民主党各占8席，共和党靠加速党的1席组成多数。在艾尔瓦纳，它又反过来支持加速党的市长。\n共和党的口号是「让加州重新负担得起」，主张取消汽油税、削减监管、恢复石油钻井，并要求移民执法更加严厉。这在一个早已以移民执法严苛出名的州里并不容易：民主党政府的公共安全与移民执法厅年年扩编，共和党只好主张把南海岸的钢墙再加高三米、装上人脸识别。党内也有人担心，等无人工厂和无人农场把活全干完，移民执法这门生意会第一个失业。\n乡村地区的治安官大多和共和党关系密切。批评者说，有些地方的治安官协会把警徽当成会员卡，收会费比收税还准时；共和党的回应是，问题出在民主党城市的警察分局。共和党最大的捐款人住在离岸群岛的避税列岛区，他们反对一切税收，包括离岸群岛自己的码头费。党的筹款会照例在牧场举行，晚宴吃牛排，甜点用杏仁做，杏仁园的主人每次都提醒来宾，这些杏仁是用他们自己抽的地下水浇出来的。\n共和党的文化是牧场和皮卡的文化。每年夏天，党在后山区举办射击、套牛和越野摩托比赛，冠军可以和党领袖共进早餐。党内最近争论的是要不要接受加速党的捐款：一派认为钱就是钱，另一派担心收了钱以后，党的政纲也会每周更新一次。"
      en: "The Republicans are California’s second party, with some 1.45 million registered voters. Their leader Colt Barrington came second in the primary for governor and lost the general election to the Democrat Paxton Hale with 38.7%; he is now Minority Leader in the Assembly. The party took 22.8% of the primary vote and holds 14 seats in the Assembly and 8 in the Senate. The top-two primary is unkind to it: in city districts where Democrats are strong, a Republican often finishes behind two Democrats and never reaches the general election at all.\nIts ground is the countryside, the oilfields, the farms and the areas where immigration enforcement is concentrated; its best results come in the Fracklands and Backcountry districts. Every seat on the councils of Barrelsfield and Palm Sprinklers and most of Mammon’s belong to Republicans. There, too, politics is settled inside the party: six Assembly districts went to a general election between two Republicans, and so did the mayoral races in four cities, Barrelsfield, Palm Sprinklers, Mammon and the Offshore Islands. The party also won the mayoralty of the second city, San Deportes, where Arturo Valdespino edged out his Democratic rival by 50.4% to 49.6%; Republicans and Democrats hold eight council seats each, and the Republicans make a majority with the Accelerate Party’s one. In Irvana the favour runs the other way, and the Republicans back an Accelerate mayor.\nUnder the slogan ‘Make California Affordable Again’ the party wants to scrap the petrol tax, cut regulation, restore oil drilling and enforce the immigration laws harder still. That is no easy pitch in a state already notorious for the severity of its enforcement: the Democratic government’s Department of Public Safety and Immigration Enforcement grows every year, which leaves the Republicans calling for the steel wall on the south coast to be raised by another three metres and fitted with face recognition. Some in the party worry that once lights-out factories and robot farms do all the work, immigration enforcement will be the first trade to lose its job.\nRural sheriffs are mostly close to the party. Critics say some sheriffs’ associations treat the badge as a membership card and collect their dues more reliably than any tax; the party answers that the trouble lies with the police precincts of Democratic cities. Its biggest donors live in the Tax Shelter Islands of the Offshore Islands and oppose every tax, including the Offshore Islands’ own harbour dues. Its fundraisers are held on ranches, as tradition demands, with steak for dinner and almond pudding to follow, and every time the almond growers remind the guests that the almonds were watered with groundwater they pumped themselves.\nRepublican culture is the culture of ranches and pickup trucks. Every summer the party holds shooting, roping and dirt-bike contests in the Backcountry, and the winners breakfast with the party leader. Its latest quarrel is over taking money from the Accelerate Party: one side says money is money, the other fears that once the money comes in, the platform too will start updating every week."
    history:
      zh: "共和党在加州起家于牧场、油田和沿海的小城，曾经多次赢得州长。随着城市扩张、西班牙语选民增多，它在城市里节节败退，退守内陆和山区。前两名初选实行以后，它在许多选区连进入大选的机会都没有了，党内从此一直争论：是该向中间靠拢，还是把乡村的地盘守得更牢。"
      en: "The Republicans grew up on the ranches, in the oilfields and in the small coastal towns, and more than once won the governorship. As the cities spread and Spanish-speaking voters grew in number they lost ground in town after town and fell back on the interior and the mountains. Once the top-two primary came in they could not even reach the general election in many districts, and the party has argued ever since over whether to move to the centre or dig in harder in the countryside."
    flag_notes:
      zh: "党旗是红底上的一颗白色五角星，四周镶一圈白边。红色是党的传统颜色，五角星代表美国，白边据说代表边境。党内的边墙派提议把白边加宽，牧场派觉得现在这样就挺好。"
      en: "The flag is a white star on red within a white border. Red is the party’s traditional colour and the star stands for the United States; the border, it is said, stands for the border. The Wall Caucus wants it made wider, while the ranchers think it is fine as it is."
    factions:
      - names: { zh: "石油与牧场派", en: "Oil and Ranch Wing" }
        notes: { zh: "巴雷尔斯菲尔德的石油商、谷地的大农场主和牧场主，主张恢复钻井许可、放开地下水抽取、取消汽油税，是党内资金最雄厚、也最务实的一派。", en: "Barrelsfield’s oilmen and the Valley’s big farmers and ranchers, who want drilling permits back, groundwater pumping freed and the petrol tax scrapped; the party’s richest and most practical wing." }
      - names: { zh: "边墙派", en: "Wall Caucus" }
        notes: { zh: "以圣遣返和南海岸边界线一带的议员为主，要求把钢墙加高、给移民执法再加预算，和治安官协会、拘押中心的承包商来往密切。", en: "Centred on members from San Deportes and Borderline on the south coast. It wants the steel wall raised and more money for immigration enforcement, and is close to the sheriffs’ associations and the detention centres’ contractors." }
      - names: { zh: "离岸俱乐部", en: "Offshore Club" }
        notes: { zh: "住在离岸群岛和比佛利账单的富豪捐款人，关心的是遗产税、资本利得税和直升机起降许可，对移民和石油都不太在意，常常私下和加速党一起吃饭。", en: "The wealthy donors of the Offshore Islands and Beverly Bills, who care about estate tax, capital gains tax and helicopter landing permits rather than immigration or oil, and often dine privately with the Accelerate Party." }
    organisation:
      newspaper: { zh: "《边疆论坛报》", en: "The Frontier Tribune" }
      think_tank: { zh: "自由企业与常识研究所", en: "Institute for Free Enterprise and Common Sense" }
      unions: { zh: "加州治安官协会、油田工人兄弟会", en: "California Sheriffs’ Association, Oilfield Brotherhood" }
      women: { zh: "共和党妇女俱乐部", en: "Republican Women’s Club" }

