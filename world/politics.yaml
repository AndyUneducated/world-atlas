    leader: { zh: 尼维卡克·陶武里亚克, en: Nivikkaaq Tauvvuriaq }
    members: 47000
    youth_wing: { zh: 塔夫鲁利特青年, en: Tavrulit Youth }
    slogan: { zh: 这片土地记得我们, en: This land remembers us }
    policies:
      - { zh: 矿产和能源收入的一部分进入原住民共同基金, en: Part of mining and energy revenue into a common indigenous fund }
      - { zh: 塔夫鲁纳克语与中文同为学校的教学语言, en: Tavrunaq and Chinese as equal languages of teaching }
      - { zh: 驯鹿迁徙路线和传统猎场受法律保护, en: Legal protection for reindeer migration routes and traditional hunting grounds }
      - { zh: 新的矿山和港口须先征得附近社区同意, en: "New mines and harbours only with the consent of nearby communities" }
      - { zh: 每个村落都有宽带和卫星电话, en: Broadband and satellite phones in every village }
    allies: [pty_jh513z, pty_18qa5s, pty_2033kv]
    targets: { div_hpmerr: 19 }
    lean: { "lang:art-x-tavrunaq": 3.0, herding: 0.4, hunting: 0.4, fishing: 0.2 }
    roll: 2.6
    notes:
      zh: "塔夫鲁利特人民党是北冰洋最大的政党，代表塔夫鲁利特人和其他讲塔夫鲁纳克语的居民，属中左翼。它主张把矿产和能源收入的一部分放进原住民共同基金，让塔夫鲁纳克语与中文同为教学语言，保护驯鹿迁徙路线和传统猎场，新的矿山和港口须先征得附近社区同意。北冰洋议会为讲塔夫鲁纳克语的选民保留了八个议席，塔人党在其中占了大多数，在全领地的比例代表议席中也是第一大党。上一次选举后，它与互助党、冶炼工会党和绿脉党组成四党联合政府，党首尼维卡克·陶武里亚克出任总督。他在就职典礼上用塔夫鲁纳克语讲了一句老话：「冰会裂，但人要站在一起。」塔人党的党代会每次都在一个不同的村落举行，代表们乘雪橇、渔船和小飞机赶去，会场常常就是村里学校的体育馆。"
      en: "The Tavrulit People's Party is the Arctic Ocean's largest party, centre-left, speaking for the Tavrulit and the territory's other Tavrunaq speakers. It wants part of the mining and energy revenue paid into a common indigenous fund, Tavrunaq taught on equal terms with Chinese, the reindeer migration routes and traditional hunting grounds protected, and no new mine or harbour without the consent of nearby communities. The Arctic Ocean assembly keeps eight seats for Tavrunaq-speaking voters; the party holds most of them and is also the largest party in the territory-wide proportional seats. After the last election it formed a four-party government with the Mutual Aid Party, the Smelters' Union and Greenvein, and its leader Nivikkaaq Tauvvuriaq became governor. At his inauguration he spoke an old saying in Tavrunaq: the ice cracks, but people stand together. Its congress meets in a different village each time, the delegates arriving by sledge, fishing boat and small plane, and the hall is usually the village school's gym."
    history:
      zh: "塔夫鲁利特人民党由几个驯鹿牧民合作社和村落议事会联合组建，最初的目标是争取保留议席。保留议席设立后，它成为议会里的第一大党。"
      en: "The party was formed by several reindeer herders' cooperatives and village councils, at first to win reserved seats. Once the reserved seats were set up it became the largest party in the assembly."

  - id: pty_1aej3q
    names: { zh: 长老之道, en: Way of the Elders }
    short_names: { zh: 长老, en: "Elders" }
    color: "#5B3A29"
    flag: { layout: border, colors: ["#5B3A29", "#E8D9B5", "#5B3A29"], charge: frame_drum, charge_color: "#E8D9B5" }
    spectrum: 1.3
    family: { zh: 原住民传统保守主义, en: Indigenous traditional conservatism }
    leader: { zh: 阿尔尼维克·苏卢尔塔克, en: Aarnivik Sullurtaq }
    members: 9000
    youth_wing: { zh: 火塘之子, en: Children of the Hearth }
    slogan: { zh: 先听长者，再问风雪, en: "Ask the elders first, then the blizzard" }
    policies:
      - { zh: 每个村落的长老议事会对土地使用有否决权, en: A veto over land use for every village's council of elders }
      - { zh: 传统狩猎和捕鲸不受配额限制, en: No quotas on traditional hunting and whaling }
      - { zh: 学校开设由长老授课的口述传统课, en: "Oral tradition lessons in schools, taught by elders" }
      - { zh: 限制酒类在村落里的销售, en: Limit the sale of alcohol in the villages }
    allies: [pty_6yj1xj, pty_ec1v2s]
    targets: { div_hpmerr: 6 }
    lean: { "lang:art-x-tavrunaq": 3.0, herding: 0.5, hunting: 0.5, old: 2.0, urban: -0.4 }
    roll: 2.6
    notes:
      zh: "长老之道是北冰洋讲塔夫鲁纳克语居民中的传统保守派，主张让每个村落的长老议事会对土地使用有否决权、传统狩猎和捕鲸不受配额限制、学校开设由长老授课的口述传统课、限制村落里的酒类销售。它的选民集中在内陆的牧区和偏远的村落，年长者居多。它与塔夫鲁利特人民党争夺同一批选民：两党都主张原住民权利，但长老之道更看重传统，对矿山和新港口更为警惕，在税收和福利上又偏右。它在保留议席中占了两席，在塔夫鲁利特原住民自治区的议会里是重要的少数。党的集会总以一面框鼓开场，鼓声停下之前，没有人可以开口。"
      en: "The Way of the Elders is the traditional conservative party among the Arctic Ocean's Tavrunaq speakers. It wants every village's council of elders to have a veto over land use, no quotas on traditional hunting and whaling, oral tradition lessons taught by elders in schools, and limits on the sale of alcohol in the villages. Its voters are concentrated in the inland pastures and remote villages, and most of them are older. It competes with the Tavrulit People's Party for the same voters: both stand for indigenous rights, but the Way of the Elders sets more store by tradition, is warier of mines and new harbours, and leans right on tax and welfare. It holds two of the reserved seats and is an important minority in the Tavrulit Indigenous Autonomous Region's council. Its meetings always open with a frame drum, and no one may speak before the drum falls silent."
    history:
      zh: "长老之道由一群不满塔人党同意开发一座新矿山的长老创立，他们在一个冬天里坐着雪橇走访了几十个村落，回来时已经有了第一批党员。"
      en: "The Way of the Elders was founded by a group of elders unhappy that the Tavrulit People's Party had agreed to a new mine; they spent a winter visiting dozens of villages by sledge and came back with the party's first members."

