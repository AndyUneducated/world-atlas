    lean: { finance: 0.4, commerce: 0.2, tourism: 0.2, income: 0.5, old: 1.5, residential: 0.2 }
    notes:
      zh: "蓝桨党是维京群岛的另一大党，属中右翼，与北维京岛的锚联盟是姊妹党。它主张降低船东和酒店业的营业税、每年平衡预算、让私人投资修建游艇码头和温泉酒店、扩编海警和搜救队。蓝桨党的选民偏年长、收入偏高，集中在金融和商业发达的城区、旅游小镇和老年人多的社区。在上一次选举中，它以二十多个选区的议席成为议会反对党，但在暖泉、莫塞、富鲁海姆和埃德文港的市议会里都是第一大党。红帆党和蓝桨党在议会辩论时互不相让，可每年群岛划船节上两党议员会同坐一条长船，按传统，谁划错了桨谁就要请全船人喝鱼汤。党首哈尔夫丹·厄斯特马克出身船东家庭，年轻时在渔船上当过三年水手，常说自己「既懂账本，也懂缆绳」。蓝桨党最常提的议案是减税和修码头，最常反对的是红帆党的渡轮免费计划，理由是「免费的船也要有人付油钱」。"
      en: "The Blue Oar Party is the Viking Islands' other big party, centre-right and the sister party of North Viking Island's Anchor Union. It wants lower business tax for boat owners and hotels, a balanced budget every year, private investment in marinas and hot spring hotels, and a larger coastguard and rescue service. Its voters are older and better off, concentrated in the commercial and financial districts, the tourist towns and the older communities. At the last election it won some two dozen constituencies to become the opposition, but it is the largest party on the councils of Warmspring, Måsey, Furuheim and Port Edevane. The two parties give no quarter in parliamentary debates, yet at the islands' rowing festival each year their members share one longboat, and by tradition whoever misses a stroke buys fish soup for the whole crew. Its leader Halvdan Østmark comes from a boat-owning family and spent three years as a deckhand on a fishing boat in his youth; he likes to say he knows both the ledger and the ropes. The bills it moves most often are tax cuts and new quays, and the policy it opposes most often is Red Sail's free ferries, on the grounds that someone still has to pay for a free boat's fuel."
    history:
      zh: "蓝桨党起源于殖民时代议会里代表船东和商人的派别，党名来自船东们在议会里举的蓝色船桨标牌。"
      en: "The Blue Oar Party grew out of the colonial assembly's faction of boat owners and merchants; its name comes from the blue oar placards the owners raised in the chamber."

  - id: pty_vxz9jt
    names: { zh: 小岛联合, en: Small Isles Union }
    short_names: { zh: 小岛, en: "Small Isles" }
    color: "#4FB3A9"
    flag: { layout: mirror, colors: ["#4FB3A9", "#F4FBFA"] }
    spectrum: 0.1
    family: { zh: 地方主义, en: Regionalism }
    leader: { zh: 埃利西芙·霍尔姆韦尔, en: Ellisif Holmvær }
    members: 3600
    youth_wing: { zh: 小岛青年, en: Small Isles Youth }
    slogan: { zh: 别让最后一盏灯熄灭, en: Don't let the last light go out }
    policies:
      - { zh: 人口不足五百的岛屿免征房产税, en: No property tax on islands of under five hundred people }
      - { zh: 每座有人居住的岛每天至少两班渡轮, en: At least two ferries a day to every inhabited island }
      - { zh: 远程工作者迁居小岛可获安家补贴, en: Settling grants for remote workers moving to small islands }
      - { zh: 小岛上的学校即使只剩一个学生也不关闭, en: "No small-island school closes, even with one pupil left" }
    allies: [pty_z573k7, pty_hwkmx1, pty_x004cm]
    targets: { div_raat4g: 10 }
    lean: { fishing: 0.8, aquaculture: 0.6, old: 3.0, urban: -2.4 }
    notes:
      zh: "小岛联合代表维京群岛外围的小岛居民，主张给人口不足五百的岛屿免征房产税、保证每座有人居住的岛每天至少两班渡轮、给迁居小岛的远程工作者安家补贴。许多小岛的年轻人去了大岛或北维京岛，留下的多是渔民和老人，联盟的口号「别让最后一盏灯熄灭」说的就是岛上最后一户人家。在单议席选区制下，它只在一个由几十座小岛组成的选区里赢下了议席，却常常在红帆党和蓝桨党之间斡旋；在乌维克库特市议会里，它是第一大党，与蓝桨党联合执政，市长也出自小岛联合。联盟的议员每次去议会开会都要先坐渡轮再换小船，路上要走大半天，她说这正是她要在议会里讲的事。"
      en: "The Small Isles Union speaks for the people of the Viking Islands' outlying small islands. It wants no property tax on islands of under five hundred people, at least two ferries a day to every inhabited island, and settling grants for remote workers who move to the small islands. Many young islanders have left for the larger islands or North Viking Island, leaving mostly fishers and the old, and its slogan about the last light refers to the last household on an island. Under single-seat constituencies it has won only one seat, in a constituency of dozens of small islands, but it often mediates between the Red Sail and Blue Oar parties, and on Uviqkut's council it is the largest party, governing with the Blue Oar Party under a Small Isles mayor. Its member of parliament takes a ferry and then a small boat to every sitting, most of a day's journey, which she says is exactly what she is there to talk about."
    history:
      zh: "小岛联合由几座小岛的居民会在渡轮班次被削减后联合组建，第一次大会在一艘渡轮的甲板上召开。"
      en: "The Union was formed by the residents' councils of several small islands after their ferry services were cut; its first meeting was held on a ferry's deck."

  - id: pty_9w8gxv
    names: { zh: 自由港党, en: Free Port Party }
    short_names: { zh: 自港, en: "Free Port" }
    color: "#C9A227"
    flag: { layout: banner, colors: ["#C9A227", "#1B1B1B"], division: pile, charge: key }
    spectrum: 1.8
    family: { zh: 古典自由主义, en: Classical liberalism }
    leader: { zh: 叶书衡, en: Ye Shuheng }
    members: 2900
    youth_wing: { zh: 自由港青年, en: Young Free Port }
    slogan: { zh: 少一张表格，多一条船, en: "One form fewer, one ship more" }
    policies:
      - { zh: 把群岛的主要商港设为免税自由港, en: Make the islands' main trading harbours duty-free ports }
      - { zh: 取消船舶登记的地方附加费, en: Abolish local surcharges on ship registration }
      - { zh: 新企业注册一天内办完, en: Register a new business in a single day }
      - { zh: 领地公务员人数十年不增, en: No increase in the territorial civil service for ten years }
    allies: [pty_hwkmx1, pty_mak5vy]
    targets: { div_raat4g: 5 }
    lean: { finance: 0.9, trade: 0.4, income: 0.8, "lang:en": 1.5 }
    notes:
      zh: "自由港党是维京群岛的一个古典自由主义小党，主张把主要商港设为免税自由港、取消船舶登记的地方附加费、新企业注册一天内办完、领地公务员人数十年不增。它的支持者多是港口贸易商、船舶代理和金融业从业者，集中在几座商港的城区。在单议席选区制下，它的票分散在许多选区里，一个选区也没有赢下，党首叶书衡说：「我们拿到的票够开一家很大的公司，却不够换一个议席。」它常与蓝桨党协调候选人，在一些选区里干脆不派人，让支持者去投蓝桨党。党部办公室只有一个房间，墙上挂着一张群岛航运图，标出了每一条可以免税的航线。"
      en: "The Free Port Party is a small classical liberal party in the Viking Islands. It wants the main trading harbours made duty-free ports, local surcharges on ship registration abolished, new businesses registered in a day and no growth in the civil service for ten years. Its supporters are mostly harbour traders, ship agents and people in finance, concentrated in the trading harbours' town centres. Under single-seat constituencies its vote is spread across many seats and it has won none; its leader Ye Shuheng says it has enough votes to run a very large company but not enough to win a seat. It often coordinates candidates with the Blue Oar Party, standing down in some constituencies so that its supporters vote Blue Oar. Its office is a single room with a shipping chart of the islands on the wall, marking every route that could be duty-free."
    history:
      zh: "自由港党由几位港口贸易商在一次船舶登记费上调后创立，起初只是一个商会的游说小组。"
      en: "The party was founded by a handful of harbour traders after a rise in ship registration fees, beginning as a lobbying group within a chamber of commerce."

  # ── 北冰洋政党 ──
  - id: pty_6yj1xj
