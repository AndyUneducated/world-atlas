    policies: [{"zh": "宪法法院保护宗教自由，任何宗教不得成为国教", "en": "Have the constitutional court protect religious freedom, with no faith made the state's"}, {"zh": "萨马伊大学扩招，向全岛各国的学生提供奖学金", "en": "Enlarge the University of Samay and offer scholarships to students from every state on the island"}, {"zh": "在各方之间继续调停，把停火谈判留在萨马伊", "en": "Keep mediating between the sides and keep the ceasefire talks in Samay"}, {"zh": "可可、香草和咖啡的出口实行公平贸易认证", "en": "Certify the cocoa, vanilla and coffee exports as fair trade"}]
    allies: ["pty_y19nf5"]
    targets: {"div_gebca7": 38}
    lean: {"education": 1.0, "income": 0.8, "urban": 0.5}
    notes: {"zh": "自由民主党是萨马伊自由邦议会的第一大党，现任总理奥尼·拉索阿是党的领袖。她是萨马伊大学的国际关系教授，参加过安巴罗之围的调停，后来出任外交部长，以耐心和善于倾听著称。自民党与信仰社区联盟联合执政，社会民主党是最大的反对党。党员约三万，大多是教师、学者、律师和旅游业的从业者。\n党的口号就是自由邦的国训「多元一体」。它主张宪法法院保护宗教自由，任何宗教不得成为国教；萨马伊大学扩招，向全岛各国的学生提供奖学金，让大学成为「全岛的学校」；在交战各方之间继续调停，把停火谈判留在萨马伊；可可、香草和咖啡的出口实行公平贸易认证。它是世俗协约中民主国家的代表，但主张协约以防卫和贸易为限，不干涉成员国的内政。\n自民党与信仰社区联盟的合作建立在宗教自由的共识上：联盟代表各宗教社区，最关心宗教学校和节日；自民党则保证世俗国家的原则不受动摇。两党一起通过了宗教学校与世俗学校同等拨款的法案，也一起扩建了努西法拉岛的难民学校。社会民主党批评政府在难民营的就业和住房问题上动作太慢，许多难民已在营地里住了二十多年。\n自民党的组织以各城市和各岛的地方委员会为基础，地方委员会选出代表参加全国大会，大会每三年选举一次党首。党的章程规定，候选人名单中须有来自不同宗教和语言社区的人，名单的前十位里至少有一名说卡西里语的候选人和一名努西法拉岛的候选人。党的经费来自党费、小额捐款和旅游业、教育界人士的捐款，按法律全部公开。党与全岛和海外的自由派政党保持联系，萨马伊大学的许多教授是党员，党的智库和平与调解研究所也设在大学里。青年自由民主派每年组织「三环青年营」，邀请不同宗教背景的年轻人一起露营、讨论和做志愿服务。\n自民党的选民是受过高等教育的城市居民和中高收入者，在首都的大学城和旅游海岸最强。每年三环节，党员与各宗教社区一起参加首都的联合游行，总理走在游行队伍的最前面，身边是天主教主教、伊玛目和佛教住持。党旗是蓝、白、蓝三道横条，白条中间一个金色的星环，代表围绕在一起的多元社区。", "en": "The Liberal Democratic Party is the largest party in the parliament of the Free State of Samay, and its leader, Ony Rasoa, is Prime Minister. She is a professor of international relations at the University of Samay who took part in the mediation that ended the Siege of Ambaro and later became foreign minister, known for her patience and for listening. The Liberal Democrats govern with the Alliance of Faith Communities, and the Social Democrats are the largest party in opposition. Its 30,000 or so members are mostly teachers, scholars, lawyers and people in tourism. \nIts watchword is the Free State's own motto, 'many in one'. It wants the constitutional court to protect religious freedom, with no faith made the state's; the University of Samay enlarged, with scholarships for students from every state on the island, to make it 'the island's school'; the mediation between the warring sides carried on and the ceasefire talks kept in Samay; and fair-trade certification for the cocoa, vanilla and coffee exports. It represents the democracies in the Secular Accord, but wants the Accord kept to defence and trade, staying out of its members' internal affairs. \nThe partnership with the Alliance of Faith Communities rests on a shared belief in religious freedom: the Alliance speaks for the faith communities and cares most about religious schools and festivals, while the Liberal Democrats guarantee that the principle of a secular state stands firm. Together they passed equal funding for religious and secular schools and enlarged the refugee schools on Nosifara. The Social Democrats say the government is too slow on jobs and housing in the camp, where many refugees have lived for over twenty years. \nThe Liberal Democrats are organised in local committees for each city and island, which send delegates to a national congress that elects the leader every three years. Its rules require candidate lists to include people from different faith and language communities, with at least one Kasiri speaker and one candidate from Nosifara in the top ten. Money comes from dues, small gifts and people in tourism and education, all published as the law requires. It keeps in touch with liberal parties on the island and abroad; many professors at the University of Samay are members, and its think tank, the Institute for Peace and Mediation, is housed at the university. The Young Liberal Democrats hold a Three Rings Youth Camp each year, inviting young people of different faiths to camp, talk and volunteer together.\nIts voters are graduates of the cities and the middle and higher paid, and it is strongest in the capital's university quarter and along the tourist coast. At the Festival of the Three Rings each year its members join the faith communities in the capital's joint procession, the Prime Minister at the head beside the Catholic bishop, an imam and a Buddhist abbot. Its flag is three bands of blue, white and blue with a gold ring of stars on the white, the many communities gathered together."}
    history: {"zh": "自由民主党由东南各岛与中央政府谈判和平分离的议员们创立。自由邦成立后，它起草了不设国教的宪法，此后长期是议会中的最大政党。", "en": "The Liberal Democratic Party was founded by the councillors of the south-eastern islands who negotiated the peaceful separation from the central government. Once the Free State was founded it drafted the constitution that establishes no state religion, and it has long been the largest party in parliament."}
    flag_notes: {"zh": "党旗是蓝、白、蓝三道横条，白条中间一个金色的星环。蓝色取自自由邦的蓝色船旗，星环代表围绕在一起的多元社区。", "en": "The flag is three bands of blue, white and blue with a gold ring of stars on the white. The blue comes from the Free State's blue ensign; the ring is the many communities gathered together."}
    factions: [{"names": {"zh": "大学派", "en": "University Wing"}, "notes": {"zh": "学者和学生，最关心大学、奖学金和学术自由。", "en": "Scholars and students, who care most about the university, scholarships and academic freedom."}}, {"names": {"zh": "调停派", "en": "Mediators"}, "notes": {"zh": "外交官和前维和人员，最关心停火谈判、安巴罗托管地和世俗协约的边界。", "en": "Diplomats and former peacekeepers, who care most about the ceasefire talks, the Ambaro Trust Territory and the limits of the Secular Accord."}}]
    organisation: {"newspaper": {"zh": "《萨马伊时报》", "en": "Samay Times"}, "think_tank": {"zh": "和平与调解研究所", "en": "Institute for Peace and Mediation"}, "women": {"zh": "自由民主妇女会", "en": "Liberal Democratic Women"}}
  - id: "pty_v1pkft"
    names: {"zh": "社会民主党", "en": "Social Democratic Party"}
    short_names: {"zh": "社民党", "en": "Social Democrats"}
    color: "#C62828"
    flag: {"layout": "banner", "colors": ["#C62828"], "charge": "links", "charge_color": "#FFFFFF"}
    spectrum: -1.0
    family: {"zh": "社会民主", "en": "Social democratic"}
    ideology: [{"zh": "社会民主主义", "en": "Social democracy"}, {"zh": "难民权利", "en": "Refugee rights"}, {"zh": "劳工主义", "en": "Labourism"}]
    axes: {"econ": 3.0, "galtan": 2.5, "autonomy": 5.0, "green": 6.5}
