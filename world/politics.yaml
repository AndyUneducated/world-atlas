    targets: {"div_mj41d0": 46}
    lean: {"old": 2.0, "urban": -0.3, "agriculture": 0.2, "income": -0.2}
    notes: {"zh": "家园党是安博哈拉基督教联邦的福音派保守政党，也是联邦议会的第一大党。现任联邦总统塔希里·拉沃哈西是它的党首，他在两轮制的总统选举中击败了基督教人民党的候选人。党的根基在高原各地数以千计的福音派教会：许多地方支部就设在教堂的副楼里，礼拜结束后的茶点时间也是党员发展新人的时间。党员约三十一万，在全岛各政党中名列前茅。\n党的纲领以家庭、信仰和国防为三根支柱。它主张家庭补贴随子女人数递增，三代同堂的家庭减免房产税；公立学校保留晨祷和圣经课，家长选择教会学校可以领取学费补助；教会兴办的医院和孤儿院与公立机构享受同等拨款。在战争问题上，家园党是联邦最强硬的声音，它的口号是「停火线以北不让一寸土地」，支持把军费维持在国内生产总值的百分之五左右，并与海外的伙伴保持密切的军事合作。\n在联邦议会，家园党与高原农民党组成议会多数，农民党议员主持议会的农业与土地委员会，这常常让家园党在城市里背上「只管乡下」的名声。党内对与基督教人民党的关系一直有争论：一部分人认为两党都是基督徒，应当在战争和家庭政策上联手；另一部分人则担心天主教会的社会教义会把联邦推向更高的税收和更大的福利开支。总统拉沃哈西本人在议会演说中常引用《诗篇》，在内阁会议前也坚持带领祷告。\n家园党的组织以教区为单位：每个福音派教会可以成立一个支部，支部选出代表参加各联邦市的党代会，再由全国党代会每四年选举一次党首。党的候选人名单须经一个由牧师和平信徒组成的「品格委员会」审查，离婚、酗酒和赌博都会让候选人落选。党的经费主要来自党员的十一奉献和教会的捐款，联邦法律要求政党公开五百拉罗以上的捐款，家园党每年的捐款名单长达数百页。青年团在暑假组织「家园营」，带城市的青少年到高原的农场和兵营体验生活。\n家园党的选民以年长者、乡村和高原小镇的居民为主，城市年轻人和受过高等教育的人对它的保守社会政策较为疏远。每年复活节后的第一个星期日，党在首都的大教堂广场举行「家园大会」，几万名党员和家属带着野餐和赞美诗集从全国赶来，大会以联邦国歌和《高原上的十字架》开场，以党首的讲话和全场合唱结束。批评者说党把政治和信仰绑得太紧，支持者则说，正是这种信仰让联邦在三十多年的战争中挺了下来。", "en": "The Homeland Party is the evangelical conservative party of the Christian Federation of Ambohara and the largest party in the Federal Assembly. Its leader is the Federal President, Tahiry Ravohasy, who beat the Christian People's Party's candidate in the two-round presidential election. The party's roots are in the thousands of evangelical churches across the highlands: many local branches meet in church annexes, and the tea after Sunday service is when members bring in new ones. With some 310,000 members it is among the largest parties on the island. \nIts programme stands on three pillars: family, faith and defence. It wants family allowances to rise with each child and three-generation households to pay no property tax; morning prayer and Bible classes kept in state schools, with fees paid for parents who choose church schools; and church hospitals and orphanages funded on the same terms as public ones. On the war it is the hardest voice in the federation. Its watchword is 'not an inch north of the ceasefire line', and it backs keeping defence at around five per cent of output and close military ties with partners abroad. \nIn the Federal Assembly the Homeland Party holds a majority together with the Highland Farmers' Party, whose members chair the Assembly's committee on farming and land, which often earns Homeland the name of a party that only cares for the countryside. Its relations with the Christian People's Party are a long-running argument inside the party: some say both are Christian parties and should stand together on the war and on the family; others fear the social teaching of the Catholic Church would push the federation towards higher taxes and a larger welfare bill. President Ravohasy quotes the Psalms in his speeches to the Assembly and insists on leading a prayer before cabinet meetings. \nThe Homeland Party is organised by parish: every evangelical church may form a branch, the branches send delegates to the party conference of each federal city, and the national conference elects the leader every four years. Candidate lists are vetted by a 'character committee' of pastors and lay members, and divorce, drink and gambling can all cost a candidate a place. Money comes mostly from members' tithes and church gifts; federal law requires parties to publish donations above five hundred laro, and Homeland's list runs to hundreds of pages a year. Its youth wing runs Homeland Camps in the summer holidays, taking city teenagers to highland farms and barracks.\nIts voters are mostly older people and the people of the countryside and the highland towns; the young of the cities and graduates keep their distance from its conservative social policies. On the first Sunday after Easter each year the party holds its Homeland Rally in the cathedral square of the capital, where tens of thousands of members and their families come from all over the country with picnics and hymn books; the rally opens with the federal anthem and 'The Cross upon the Highlands' and ends with the leader's speech and everyone singing together. Critics say the party binds politics and faith too tightly; supporters say that faith is what carried the federation through more than thirty years of war."}
    history: {"zh": "家园党由联合共和国末期高原各地的福音派教会联合会和农村祈祷会发展而来。大分裂时，这些教会组织了民兵和难民救济，制宪会议上它们的代表主张在宪法序言中写入「上帝的律法」。联邦成立后，教会联合会的政治委员会改组为家园党，此后多次赢得总统选举。", "en": "The Homeland Party grew from the highland federations of evangelical churches and village prayer meetings in the last days of the United Republic. In the Sundering the churches organised militias and refugee relief, and at the constituent assembly their delegates pressed for 'the law of God' in the preamble. Once the federation was founded, the churches' political committee became the Homeland Party, which has since won the presidency many times."}
    flag_notes: {"zh": "党旗是深蓝底上的金色十字。深蓝取自联邦国旗的海洋色，金色十字代表信仰，也代表党所说的「照亮家园的光」。", "en": "The flag is a gold cross on deep blue. The blue is the sea of the federal flag; the gold cross is the faith, and what the party calls 'the light over the homeland'."}
    factions: [{"names": {"zh": "讲坛派", "en": "Pulpit Wing"}, "notes": {"zh": "以牧师和教会长老为核心，最关心学校祈祷、婚姻法和教会拨款，是党内最保守的一翼。", "en": "Built round pastors and church elders, it cares most for school prayer, marriage law and church funding, and is the party's most conservative wing."}}, {"names": {"zh": "前线派", "en": "Frontline Wing"}, "notes": {"zh": "退伍军人、军官家属和北部边境城镇的党员，主张增加军费、扩充国民警卫队，对任何停火谈判都保持警惕。", "en": "Veterans, officers' families and members in the northern border towns, who want more spending on defence and a larger National Guard and are wary of any ceasefire talks."}}]
    organisation: {"newspaper": {"zh": "《家园报》", "en": "The Homeland"}, "think_tank": {"zh": "家庭与信仰研究所", "en": "Institute for Family and Faith"}, "women": {"zh": "家园妇女祈祷会", "en": "Homeland Women's Prayer Fellowship"}}
