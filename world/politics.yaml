    slogan: {"zh": "海是我们的田", "en": "The sea is our field"}
    policies: [{"zh": "近海渔场只许本国渔船作业，外国拖网渔船须缴高额费用", "en": "Reserve the inshore grounds for Mirakan boats and charge foreign trawlers heavily"}, {"zh": "渔民和船员享有养老金和海上事故保险", "en": "Give fishers and crews a pension and insurance against accidents at sea"}, {"zh": "酒店和游艇码头的工人有权组织工会", "en": "Give the workers of the hotels and marinas the right to unionise"}, {"zh": "每个渔村修建冷库和码头", "en": "Build a cold store and a jetty in every fishing village"}]
    allies: ["pty_n8jyz6"]
    targets: {"div_78xf6t": 16}
    lean: {"fishing": 1.5, "income": -1.0, "urban": -0.5}
    notes: {"zh": "海员与渔民党是米拉卡王国议会的第三大党，代表渔民、船员、码头工人和酒店服务员，是王国唯一以劳动者为主要支持者的政党。党首法利·拉韦洛是西部贝拉诺镇的一位渔船船长，十五岁就跟着父亲出海，至今每年还要出几次海。党员约一万四千，大多是渔民合作社和工会的成员。\n党的口号是「海是我们的田」。它主张近海渔场只许本国渔船作业，外国拖网渔船须缴纳高额费用；渔民和船员享有养老金和海上事故保险；酒店和游艇码头的工人有权组织工会；每个渔村修建冷库和码头。它与社会自由党在劳动政策上合作，但比社会自由党更关心乡村和渔村，对首都的中产阶级议题兴趣不大。\n渔民党在议会里是反对派，但在渔业问题上常与基民盟合作，两党一起通过了新的渔业法，把渔业配额向本地小渔船倾斜。它反对王国党提出的海军扩建计划，认为钱应该花在搜救和渔港上。在难民问题上，渔民党的立场很特别：许多渔民在海上救过难民，党既支持搜救，又担心难民进入渔业和酒店业会压低工资。\n渔民党的组织以渔民合作社和码头工会为基础，每个渔村和码头都有一个支部，支部的负责人往往就是合作社的社长或工会的代表。党首由全国代表大会选出，代表大会在渔汛结束后的淡季举行，开会的地点轮流设在各个渔村，代表们睡在渔民家里。党的候选人几乎都在海上或码头上工作过，党员说「没有晒黑过的人，不懂我们的事」。党的经费来自工会的政治基金、合作社的捐款和党员的会费，规模不大，选举时主要靠渔船上的标语和码头上的集会宣传。青年海员会为渔村的年轻人开办航海和机修培训班，也组织海上安全演习，教孩子们游泳和使用救生衣。党与全岛其他国家的渔民组织保持联系，每年在米拉卡举办一次渔民交流会。\n渔民党的选民是渔村和港口的低收入者，在贝拉诺和首都的旧渔港最强。每年渔汛开始前，党在贝拉诺的码头举行祈福仪式，牧师为渔船洒圣水，渔民们挂起蓝色和沙色的党旗出海，晚上在码头上烤鱼、跳舞。党旗上半是蓝色的大海，下半是沙色的波浪，中间一条鱼，渔民说这是他们一年的收成。", "en": "The Seafarers' and Fishers' Party is the third party in Miraka's parliament and speaks for fishers, crews, dockers and hotel workers, the kingdom's only party whose main support is working people. Its leader, Faly Ravelo, is a fishing captain from Belano in the west who first went to sea with his father at fifteen and still goes out several times a year. Its 14,000 or so members mostly belong to fishing cooperatives and unions. \nIts watchword is 'the sea is our field'. It wants the inshore grounds reserved for Mirakan boats and foreign trawlers charged heavily; pensions and insurance against accidents at sea for fishers and crews; the right to unionise for the workers of the hotels and marinas; and a cold store and a jetty in every fishing village. It works with the Social Liberals on labour policy, but cares more than they do for the villages and fishing harbours, and has little interest in the concerns of the capital's middle class. \nIn parliament the party is in opposition, but on fisheries it often works with the CDU, and the two passed the new fisheries law that weights quotas towards local small boats. It opposes the Kingdom Party's plan to enlarge the navy, wanting the money spent on rescue and fishing harbours. On refugees its position is unusual: many fishers have pulled refugees from the sea, and the party backs rescue while worrying that refugees entering fishing and the hotels will push down wages. \nThe Seafarers and Fishers are organised round the fishing cooperatives and dockers' union, with a branch in every fishing village and on every quay, usually led by the cooperative's chair or the union's shop steward. The national congress elects the leader; it meets in the slack season after the fishing, in a different village each time, the delegates lodging with fishing families. Nearly all its candidates have worked at sea or on the docks, and members say 'no one who has never been sunburnt understands us'. Money comes from union political funds, cooperative gifts and members' dues; it is not much, and at elections the party relies on slogans painted on fishing boats and rallies on the quays. Young Seafarers run seamanship and engine courses for village youth and hold sea-safety drills that teach children to swim and use a life jacket. The party keeps in touch with fishers' organisations in other states on the island and hosts a fishers' meeting in Miraka every year.\nIts voters are the lower paid of the fishing villages and ports, and it is strongest in Belano and the capital's old fishing harbour. Before the fishing season opens each year the party holds a blessing on the quay at Belano, where a priest sprinkles the boats with holy water and the fishers go out flying the party's blue and sand flag; in the evening there is grilled fish and dancing on the quay. Its flag is the blue sea above sand-coloured waves with a fish in the middle, which the fishers say is their year's catch."}
    history: {"zh": "海员与渔民党由西部渔村的渔民合作社和首都的码头工会联合组建。它最初只是一个争取渔业配额的游说团体，后来参加议会选举，成为王国的第三大党。", "en": "The Seafarers' and Fishers' Party was formed by the fishing cooperatives of the western villages and the capital's dockers' union. It began as a lobby for fishing quotas and later stood for parliament, becoming the kingdom's third party."}
    flag_notes: {"zh": "党旗上半是蓝色，下半是沙色的波浪，中间一条鱼。蓝色是大海，沙色是海滩，鱼是渔民的收成。", "en": "The flag is blue above sand-coloured waves with a fish in the middle. The blue is the sea, the sand the beaches and the fish the fishers' catch."}
    factions: [{"names": {"zh": "渔村派", "en": "Village Wing"}, "notes": {"zh": "西部渔村的船长和合作社，最关心渔场、配额和渔港。", "en": "The captains and cooperatives of the western villages, who care most about fishing grounds, quotas and harbours."}}, {"names": {"zh": "码头派", "en": "Dockside Wing"}, "notes": {"zh": "首都的码头工人和酒店服务员，关心工资和工会权利，主张与社会自由党结盟。", "en": "The dockers and hotel workers of the capital, concerned with wages and union rights, who favour an alliance with the Social Liberals."}}]
    organisation: {"newspaper": {"zh": "《渔讯》", "en": "Fishing News"}, "unions": {"zh": "米拉卡海员与码头工会", "en": "Miraka Seafarers' and Dockers' Union"}, "women": {"zh": "渔村妇女合作社", "en": "Fishing Village Women's Cooperative"}}
