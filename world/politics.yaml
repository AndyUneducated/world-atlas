    youth_wing: { zh: 年轻灯塔, en: Young Lighthouse }
    slogan: { zh: 照亮每一条航道, en: Light every channel }
    policies:
      - { zh: 公共数据默认公开，政务院各部的会议纪要一周内上网, en: "Open public data by default and publish every ministry's minutes within a week" }
      - { zh: 简化外来人才的居留和执业资格认定, en: "Simplify residence and professional recognition for people coming from elsewhere" }
      - { zh: 一人公司和小企业前三年减免登记费用, en: Waive registration fees for sole traders and small firms in their first three years }
      - { zh: 中文、英文和本地语言的双语、三语教育从幼儿园开始, en: "Bilingual and trilingual schooling in Chinese, English and the local language from nursery onwards" }
    allies: [pty_ydphtm, pty_mak5vy, pty_fn97vt]
    targets: { div_fbfqv9: 8, div_raat4g: 4, div_hpmerr: 4, div_nwm019: 3 }
    lean: { finance: 0.4, tech: 0.4, digital: 0.3, urban: 0.3, income: 0.5, "lang:en": 1.0, trade: 0.3 }
    notes:
      zh: "灯塔自由党是一个中间偏右的自由派政党，看重公民自由、政府透明和开放的市场，也支持全民医疗和教育，被对手形容为「左手拿着预算表，右手拿着人权宪章」。它的选民集中在首府、金融和科技从业者多的城区，以及移民和英语使用者多的街区。在北维京岛，它是议会里的第四大党，目前在野，但在贝克勒自由贸易区与锚联盟共同执掌市政；在北冰洋和长夏群岛，它各有几个议席，常在预算表决中充当关键的少数。党的标志是海浪上的一座灯塔，党员见面时爱说「今晚的灯亮着吗」，意思是问对方最近有没有去参加党部每周四的公开讲座。党首许知微曾是一名海事律师，擅长在辩论中引用法条原文，她的口头禅是「请把条文念完」。灯塔自由党每年出版一份透明度报告，给政府各部门的信息公开程度打分，得分最低的部门会收到一只坏掉的灯泡。"
      en: "The Lighthouse Liberals are a liberal party just right of centre, prizing civil liberties, open government and open markets while backing universal health care and education; opponents say they carry a budget sheet in one hand and a charter of rights in the other. Their voters are concentrated in the capitals, in districts full of finance and technology workers, and in neighbourhoods with many incomers and English speakers. On North Viking Island they are the fourth party in parliament and in opposition, but they run the Beckerle Free Trade Zone together with the Anchor Union; in the Arctic Ocean and the Everlong Summer Islands they have a few seats each and often hold the balance in budget votes. Their emblem is a lighthouse over the waves, and members greet each other with is the lamp lit tonight, meaning have you been to the branch's open lecture on Thursday. Their leader Xu Zhiwei was a maritime lawyer who likes to quote statutes word for word in debate; her catchphrase is please read the clause to the end. Each year the party publishes a transparency report scoring every government department on openness, and the lowest scorer is sent a broken light bulb."
    history:
      zh: "灯塔自由党由北维京岛的一群律师、记者和大学教师创立，最早的诉求是让政务院公开会议纪要。贝克勒自由贸易区设立后，它在新来的外籍从业者中迅速扩大，随后在其他三个领地建立了支部。"
      en: "The Lighthouse Liberals were founded on North Viking Island by a group of lawyers, journalists and university teachers whose first demand was that the Executive Council publish its minutes. After the Beckerle Free Trade Zone opened they grew quickly among the professionals who came to work there, and then set up branches in the other three territories."

  - id: pty_ydphtm
    names: { zh: 罗盘党, en: Compass Party }
    short_names: { zh: 罗盘, en: "Compass" }
    color: "#7A5BD6"
    flag: { layout: banner, colors: ["#7A5BD6"], charge: compass }
    spectrum: 0.0
    family: { zh: 中间派、技术官僚, en: "Centrism, technocracy" }
    leader: { zh: 程以衡, en: Cheng Yiheng }
    members: 15000
    youth_wing: { zh: 新罗盘, en: New Compass }
    slogan: { zh: 先看数据，再定方向, en: "Read the data, then set the course" }
    policies:
      - { zh: 每一项新法规都附带成本收益评估，五年后自动复审, en: "Attach a cost-benefit review to every new law, with an automatic review after five years" }
      - { zh: 预算按项目公开到每一笔，开放给公众查询, en: "Publish the budget down to every item, open for anyone to search" }
      - { zh: 公务员考试与晋升全部匿名评审, en: Anonymous marking for all civil service examinations and promotions }
      - { zh: 大型工程先做试点，再推广, en: "Pilot big projects before rolling them out" }
    allies: [pty_ymxc2s, pty_jh513z]
    targets: { div_fbfqv9: 6, div_hpmerr: 2.5, div_nwm019: 3 }
    lean: { government: 0.3, research: 0.3, education: 0.2, residential: 0.2 }
    notes:
      zh: "罗盘党自称「不左不右，只往前」，是一个以规划师、工程师、统计学者和退休公务员为骨干的中间派政党，主张政策先做试点、法规附带成本评估、预算公开到每一笔。它在北维京岛议会里只有几个议席，却是互助党、绿脉党政府能过半数的关键一块，交换条件是由它掌管政策和计划委员会，委员会的年度发展报告因此越写越厚，附表比正文还长。罗盘党在北冰洋和长夏群岛也有支部：在长夏群岛不设门槛的比例代表制下有一两个议席，在北冰洋则没能跨过门槛。党代会的传统节目是现场考题：每位代表要在十分钟内估算一项领地开支，误差最小的人获赠一只黄铜罗盘。"
      en: "The Compass Party calls itself neither left nor right, only forward. It is a centrist party built around planners, engineers, statisticians and retired civil servants, and wants policies piloted first, every law costed and every line of the budget published. It has only a handful of seats in the North Viking Island parliament, yet those seats are what carry the Mutual Aid and Greenvein government past half, and the price was the Policy and Planning Commission, whose annual development report has grown thicker ever since, its tables now longer than its text. It has branches in the Arctic Ocean and the Everlong Summer Islands as well: the Everlong Summer Islands' proportional system, with no threshold, gives it a seat or two, while in the Arctic Ocean it falls short of the threshold. A tradition of its congress is the quiz: each delegate has ten minutes to estimate a line of territorial spending, and the closest wins a brass compass."
    history:
      zh: "罗盘党由北维京岛新城和科学城的规划师、工程师发起，起初是一个研究城市规划的学会，在一次关于首府扩建方案的争论后决定参加选举。"
      en: "The Compass Party was started by planners and engineers in New City and Science City on North Viking Island as a society for the study of town planning, and decided to stand for election after an argument over how the capital should grow."

  - id: pty_mak5vy
    names: { zh: 锚联盟, en: Anchor Union }
    short_names: { zh: 锚盟, en: "Anchor" }
    color: "#1F4E9E"
    flag: { layout: banner, colors: ["#1F4E9E", "#FFFFFF"], division: bordure, charge: anchor }
    spectrum: 1.0
    family: { zh: 自由保守主义, en: Liberal conservatism }
    leader: { zh: 邵承岳, en: Shao Chengyue }
    members: 72000
    youth_wing: { zh: 青锚, en: Young Anchors }
    slogan: { zh: 稳得住，才走得远, en: "Hold fast, go far" }
    policies:
      - { zh: 降低中小企业所得税，取消十几项重复的行业许可, en: "Cut tax on small and medium firms and scrap a dozen overlapping trade licences" }
      - { zh: 领地财政每年留出盈余，建立长期储备基金, en: Run a surplus every year and build a long-term reserve fund }
      - { zh: 家庭第一套住房的首付由领地担保, en: "Territorial guarantees for first-home deposits" }
      - { zh: 加强社区警务和港口安检, en: Strengthen neighbourhood policing and port security }
      - { zh: 中小学增加职业课程，与本地企业合办学徒制, en: "More vocational courses in schools, with apprenticeships run with local firms" }
    allies: [pty_ymxc2s, pty_hwkmx1, pty_x004cm]
    targets: { div_fbfqv9: 21, div_hpmerr: 10, div_nwm019: 9 }
    lean: { finance: 0.3, commerce: 0.3, trade: 0.3, income: 0.6, old: 1.5, residential: 0.2 }
    notes:
      zh: "锚联盟是北维京岛、北冰洋和长夏群岛的主要中右政党，主张稳健财政、低税、扶持中小企业和家庭置业，也重视社区治安和职业教育。党旗是白边蓝底上的一只白锚，寓意「不管风浪多大，船都要先下锚稳住」。在北维京岛，它是第二大党和主要反对党，赢下了贝克勒的全部选区、新城的大部分选区和维京港的一半选区，党主席邵承岳每周在议会质询时间与总督陆远舟的交锋，被电视台做成了收视率不错的节目；它在新城和贝克勒自由贸易区执掌市政。在北冰洋，它是反对派中仅次于金库党的力量；在长夏群岛，它是最大的反对党，批评现政府「把明天的钱提前发完了」。在维京群岛，它不推候选人，与蓝桨党结为姊妹党。锚联盟的支持者以小企业主、专业人士和年长的业主为多，党部的年度募款晚宴总在一艘退役渡轮上举行。"
      en: "The Anchor Union is the main centre-right party of North Viking Island, the Arctic Ocean and the Everlong Summer Islands. It stands for sound finances, low taxes and help for small firms and home-buying families, and puts weight on neighbourhood safety and vocational training. Its flag is a white anchor on blue within a white border: however rough the sea, first drop anchor and hold steady. On North Viking Island it is the second party and the main opposition and takes every constituency in Beckerle, most of New City's and half of Viking Port's; the weekly clash at question time between its chair Shao Chengyue and Governor Lu Yuanzhou has become a television programme with respectable ratings, and it runs the councils of New City and the Beckerle Free Trade Zone. In the Arctic Ocean it is the strongest opposition party after the Vault Party, and in the Everlong Summer Islands it leads the opposition, accusing the government of spending tomorrow's money today. It does not stand in the Viking Islands, where Blue Oar is its sister party. Its supporters are mostly small business owners, professionals and older homeowners, and its annual fundraising dinner is always held on board a retired ferry."
    history:
      zh: "锚联盟由北维京岛早期的商会、船东协会和几个地方保守派团体合并而成，与互助党同为领地议会最早的两大党。北冰洋和长夏群岛的支部由在当地经营的北维京岛企业家牵头组建。"
      en: "The Anchor Union was formed by merging the early chambers of commerce, the shipowners' association and several local conservative groups of North Viking Island, and with the Mutual Aid Party it was one of the two great parties of the first territorial parliament. Its Arctic Ocean and Everlong Summer branches were set up by North Viking Island business people working there."

  - id: pty_0h5194
    names: { zh: 岛民之声, en: "Islanders' Voice" }
    short_names: { zh: 岛声, en: "Voice" }
    color: "#7B5E3B"
    flag: { layout: bands, colors: ["#7B5E3B", "#F3E9D2"], vertical: true, ratio: [1, 2], charge: horn, charge_band: 1, charge_color: "#7B5E3B" }
    spectrum: 2.8
    family: { zh: 右翼民粹主义, en: Right-wing populism }
    leader: { zh: 马铁山, en: Ma Tieshan }
    members: 27000
    youth_wing: { zh: 岛民青年之声, en: "Young Islanders' Voice" }
    slogan: { zh: 让岛民自己说话, en: Let islanders speak for themselves }
    policies:
      - { zh: 重大开支和税率调整须经全领地公投, en: "Put major spending and tax changes to a territory-wide referendum" }
      - { zh: 降低燃油税和渡轮票价, en: Cut fuel duty and ferry fares }
      - { zh: 外来人口的年度配额与住房和学位挂钩, en: "Tie the yearly quota of newcomers to the supply of homes and school places" }
      - { zh: 加重对盗窃、破坏公物和醉驾的处罚, en: "Tougher penalties for theft, vandalism and drink-driving" }
      - { zh: 议员薪酬冻结，议员人数减少三成, en: Freeze members' pay and cut the number of members by three-tenths }
    allies: []
    targets: { div_fbfqv9: 7, div_raat4g: 4, div_hpmerr: 6, div_nwm019: 4 }
    lean: { urban: -0.4, income: -0.4, old: 1.0, fishing: 0.3, mining: 0.3, logistics: 0.2, "lang:en": -1.0 }
    notes:
      zh: "岛民之声是一个右翼民粹政党，主张以公投决定重大开支和税率、降低燃油税和渡轮票价、让外来人口的年度配额跟住房和学位的供应挂钩，并加重对盗窃和醉驾的处罚。它的支持者多在偏远渔港、矿区和物流城镇，许多人觉得首府的政策离自己很远。党主席马铁山原是一名长途卡车司机，以在议会里拿出自己的加油小票质询燃油税出名。岛民之声在四个领地都有候选人，在北维京岛、北冰洋和长夏群岛都进了议会，但其他政党都不愿与它组成政府，它也乐于以「唯一真正的反对派」自居。它的竞选集会常在港口的鱼市散场后举行，台下的人一边听一边吃刚出锅的炸鱼。它的议员每月要回到自己的选区开一次「拍桌会」，任何选民都可以当面拍着桌子提意见，议员必须当场记下来。"
      en: "Islanders' Voice is a right-wing populist party. It wants referendums on major spending and tax rates, lower fuel duty and ferry fares, a yearly quota of newcomers tied to the supply of homes and school places, and tougher penalties for theft and drink-driving. Its supporters are mostly in remote fishing harbours, mining towns and haulage towns, where many feel the capital's policies are far away. Its chair, Ma Tieshan, was a long-haul lorry driver and made his name by producing his own fuel receipts in parliament to question the duty. The party stands in all four territories and has seats in the North Viking Island, Arctic Ocean and Everlong Summer parliaments, but no other party will govern with it, and it is happy to call itself the only real opposition. Its rallies are often held in a harbour fish market after the trading ends, the crowd eating fish fresh from the fryer as they listen. Its members of parliament hold a table-thumping meeting back home every month, where any voter may thump the table and speak their mind, and the member must write it all down on the spot."
    history:
      zh: "岛民之声起于北维京岛一场反对上调燃油税的车队请愿，参加请愿的卡车司机、渔民和矿工后来组成了政党，随后在其他领地的渔港和矿区也有了支部。"
      en: "Islanders' Voice began with a convoy petition on North Viking Island against a rise in fuel duty; the lorry drivers, fishers and miners who took part went on to form a party, and branches followed in the fishing harbours and mining towns of the other territories."

  - id: pty_fn97vt
    names: { zh: 开源党, en: Open Source Party }
    short_names: { zh: 开源, en: "Open Source" }
    color: "#6D6875"
    flag: { layout: banner, colors: ["#3D3A4B"], charge: brackets, charge_color: "#9EF0B5" }
    spectrum: -0.6
    family: { zh: 数字权利, en: Digital rights }
    leader: { zh: 利维奥·塞兰迪, en: Livio Serrandi }
    members: 9800
    youth_wing: { zh: 分叉社, en: The Fork }
    slogan: { zh: 公开的代码，公开的政府, en: "Open code, open government" }
    policies:
      - { zh: 政府采购的软件一律开源，源代码公开托管, en: "All software the government buys to be open source, its code published" }
      - { zh: 个人数据未经本人同意不得跨机构共享, en: No sharing of personal data between agencies without consent }
      - { zh: 全民免费的基础宽带和公共算力配额, en: Free basic broadband and a public computing allowance for everyone }
      - { zh: 议会表决记录以机器可读格式实时公开, en: "Publish parliamentary votes live in machine-readable form" }
    allies: [pty_2033kv, pty_ymxc2s]
    targets: { div_fbfqv9: 3, div_raat4g: 1.5, div_hpmerr: 2.6, div_nwm019: 2 }
    lean: { datacenter: 0.6, tech: 0.5, digital: 0.6, young: 3.0, urban: 0.2 }
    notes:
      zh: "开源党是一个关注数字权利的小党，主张政府软件开源、个人数据未经同意不得共享、基础宽带和公共算力人人免费，议会表决记录要以机器可读的格式实时公开。它的党员多是程序员、数据中心工程师和大学生，党章本身就托管在公开的代码仓库里，任何党员都可以提交修改，经全体投票后合并。开源党在北冰洋的数据中心城镇得票最高，但还差一点才到百分之三的门槛；在长夏群岛的比例代表制下，它拿到过一个议席。党内的青年团叫「分叉社」，取自代码仓库「分叉」的说法，意思是「不同意就另起一支，做得好再合回来」。"
      en: "The Open Source Party is a small party for digital rights. It wants government software to be open source, no sharing of personal data without consent, free basic broadband and computing for everyone, and parliamentary votes published live in machine-readable form. Its members are mostly programmers, data-centre engineers and students, and its constitution is itself kept in a public code repository where any member may propose a change, merged after a vote of all members. It does best in the Arctic Ocean's data-centre towns, though still short of the threshold there, and under the Everlong Summer Islands' proportional system it has won a seat. Its youth wing is called The Fork, after forking a repository: if you disagree, branch off, and if you do it well, merge back."
    history:
      zh: "开源党由北冰洋数据中心的工程师和北维京岛科学城的程序员在网上共同发起，第一次党代会完全在线上召开，表决用的软件也是党员自己写的。"
      en: "The party was started online by data-centre engineers in the Arctic Ocean and programmers in North Viking Island's Science City; its first congress was held entirely online, on voting software its members wrote themselves."
  - id: pty_x004cm
    names: { zh: 渔农党, en: Fishers and Farmers Party }
    short_names: { zh: 渔农, en: "Fish & Farm" }
    color: "#7BA23F"
    flag: { layout: bands, colors: ["#7BA23F", "#1F6FA8"], charge: wheat, charge_band: 0, extra: [{ charge: fish, color: "#FFFFFF", x: 30, y: 30, size: 15 }] }
    spectrum: 0.8
    family: { zh: 农本主义, en: Agrarianism }
    leader: { zh: 哈尔瓦·斯特兰莫, en: Hallvar Strandmo }
    members: 12000
    youth_wing: { zh: 渔农青年, en: Young Fishers and Farmers }
    slogan: { zh: 有人种地，有人出海，才有饭吃, en: "Someone sows, someone sails, everyone eats" }
    policies:
      - { zh: 渔业配额按港口分配，优先留给本地小船, en: "Share fishing quotas by harbour, first to local small boats" }
      - { zh: 农场、牧场和渔船的燃料与电价补贴, en: "Subsidise fuel and power for farms, pastures and fishing boats" }
      - { zh: 每个乡镇保留一所学校、一个邮局和一家诊所, en: "Keep a school, a post office and a clinic in every rural township" }
      - { zh: 本地农渔产品进入学校和医院食堂, en: Local farm and fish produce in school and hospital canteens }
    allies: [pty_mak5vy, pty_xmdckb, pty_vxz9jt]
    targets: { div_fbfqv9: 3, div_raat4g: 1.5, div_hpmerr: 1.5 }
    lean: { fishing: 0.8, agriculture: 0.8, dairy: 0.7, herding: 0.6, forestry: 0.5, aquaculture: 0.5, urban: -0.8 }
    notes:
      zh: "渔农党代表北方三个领地的农民、牧民、渔民和林业工人，主张渔业配额按港口分配、给农场和渔船补贴燃料与电价、每个乡镇都保留学校、邮局和诊所。它在领地议会里没有议席，北维京岛百分之五的门槛对它来说太高，可在乡村和小港口的市议会里很有分量：雅利基卢克市议会里，它与互助党、锚联盟组成执政联盟，市里的渔港冷库和牧场饲料仓就是它争取来的。党旗上方是麦穗，下方是一条鱼，党员自嘲「我们的党旗能做一顿饭」。每年秋收后的党代会都在一个农场的谷仓里开，会后的晚宴只用代表们自己带来的东西。"
      en: "The Fishers and Farmers Party speaks for the farmers, herders, fishers and forestry workers of the three northern territories. It wants fishing quotas shared out by harbour, cheaper fuel and power for farms and boats, and a school, a post office and a clinic kept in every township. It has no seats in any territorial parliament, North Viking Island's five-per-cent threshold being too high for it, but it carries weight on rural and small-harbour councils: in Jaalikiluk it governs with the Mutual Aid Party and the Anchor Union, and the town's harbour cold store and pasture feed barn were its doing. Its flag has an ear of wheat above and a fish below, and members joke that their flag makes a meal. The congress after each harvest is held in a farm's barn, and the dinner afterwards is made only from what the delegates bring."
    history:
      zh: "渔农党由北维京岛内陆的乳品合作社和沿海的渔民协会联合组建，后来在维京群岛的小岛和北冰洋的渔港也建立了支部。"
      en: "The party was formed by the dairy cooperatives of North Viking Island's interior and the fishers' associations of its coast, and later set up branches on the small islands of the Viking Islands and in the Arctic Ocean's fishing harbours."

  - id: pty_k4krwn
    names: { zh: 长屋党, en: Longhouse Party }
