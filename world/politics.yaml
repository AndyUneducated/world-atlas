    notes:
      zh: "星途党是北维京岛一个以航天和科研为核心议题的小党，主张把领地研发投入提高到生产总值的百分之五、扩建西荒高原的发射场、让中学开设天文和编程必修课。它的选民集中在马斯林山的航天产业区和西北市的科学城，党员里有不少火箭工程师和天文台的研究员。星途党在领地议会里没有议席，在马斯林山市议会里有两席。每次火箭发射成功，党部都会在门口挂出一面写着发射序号的小旗，党部的门口因此挂满了旗。党内最受欢迎的活动是夏夜在发射场边上的观星会。"
      en: "The Starward Party is a small North Viking Island party whose core causes are spaceflight and research. It wants research spending raised to five per cent of the territory's output, the West Heath spaceport expanded, and astronomy and programming made compulsory in secondary schools. Its voters are concentrated in Maslin Mountain's space industry district and Northwest's Science City, and its members include many rocket engineers and observatory researchers. It has no seats in the territorial parliament and two on Maslin Mountain's council. After every successful launch the branch hangs a small flag with the launch number at its door, and its doorway is now hung thick with them. Its most popular event is a summer stargazing night beside the spaceport."
    history:
      zh: "星途党由马斯林山航天产业区的工程师在一次关于发射场扩建的市议会听证后创立，第一份党纲写在一张火箭装配图的背面。"
      en: "The party was founded by engineers of Maslin Mountain's space industry after a council hearing on enlarging the spaceport; its first manifesto was written on the back of a rocket assembly drawing."

  - id: pty_xmdckb
    names: { zh: 高地牧场联盟, en: Upland Pasture Union }
    short_names: { zh: 牧盟, en: "Upland" }
    color: "#8C6A3F"
    flag: { layout: horizon, colors: ["#9CC3E0", "#8C6A3F"], edge: peaks, charge: antlers }
    spectrum: 1.5
    family: { zh: 乡村保守主义, en: Rural conservatism }
    leader: { zh: 托尔莫·格拉斯豪, en: Tormod Grashaug }
    members: 5100
    youth_wing: { zh: 牧场青年, en: Young Pasture }
    slogan: { zh: 山上也有人, en: People live up here too }
    policies:
      - { zh: 内陆牧区的道路冬季除雪由领地负担, en: Territorial funding for winter snow clearing on inland pasture roads }
      - { zh: 驯鹿和牛羊的传统放牧路线写入土地法, en: "Write the traditional reindeer and sheep droving routes into land law" }
      - { zh: 风电场选址须征得附近牧场同意, en: Wind farms only with the consent of nearby pastures }
      - { zh: 山区学校保留寄宿部, en: Keep boarding houses at mountain schools }
    allies: [pty_x004cm, pty_k4krwn]
    targets: { div_fbfqv9: 2 }
    lean: { herding: 0.8, agriculture: 0.5, forestry: 0.4, urban: -0.7 }
    notes:
      zh: "高地牧场联盟代表北维京岛内陆山区的牧民和小农，主张由领地负担牧区道路的冬季除雪、把传统放牧路线写入土地法、风电场选址须征得附近牧场同意。它的口号「山上也有人」来自一位牧民在议会听证会上的发言，当时议员们在讨论把一条山区公路降为季节性道路。联盟在领地议会里没有议席，在雅利基卢克市议会里有两席。它与绿脉党在风电场选址上常有争执，但在保护山地草场上又常常站在一起，两党的人说这叫「吵着架一起赶羊」。联盟的党员证是一枚小铜铃。"
      en: "The Upland Pasture Union speaks for the herders and smallholders of North Viking Island's mountainous interior. It wants the territory to pay for winter snow clearing on pasture roads, the traditional droving routes written into land law, and wind farms sited only with the consent of nearby pastures. Its slogan, people live up here too, comes from a herder's words at a parliamentary hearing on downgrading a mountain road to a seasonal one. It has no seats in the territorial parliament and two on Jaalikiluk's council. It often quarrels with Greenvein over where wind farms go, yet the two stand together on protecting mountain grassland, which their members call herding sheep while arguing. A member's card is a small brass bell."
    history:
      zh: "高地牧场联盟由内陆的牧民协会组建，起因是一次冬季暴雪中几条山路因预算不足没有及时除雪，牧场被困了两周。"
      en: "The Union was formed by the inland herders' associations after a winter blizzard in which several mountain roads went uncleared for want of money and the pastures were cut off for a fortnight."

  # ── 维京群岛政党 ──
  - id: pty_z573k7
    names: { zh: 红帆党, en: Red Sail Party }
    short_names: { zh: 红帆, en: "Red Sail" }
    color: "#D7263D"
    flag: { layout: banner, colors: ["#D7263D", "#1E3A5F"], division: wavy, charge: sail }
    spectrum: -1.0
    family: { zh: 社会民主主义, en: Social democracy }
    leader: { zh: 卡娅·布伦维克, en: Kaja Brennvik }
    members: 41000
    youth_wing: { zh: 红帆青年, en: Red Sail Youth }
    slogan: { zh: 同一阵风，同一条船, en: "One wind, one boat" }
    policies:
      - { zh: 岛际渡轮对居民免费, en: Free inter-island ferries for residents }
      - { zh: 渔船、船坞和酒店员工的集体工资协议覆盖全领地, en: "Territory-wide collective wage agreements for fishing crews, boatyards and hotels" }
      - { zh: 每座有人居住的岛上都有一名全科医生, en: A general practitioner on every inhabited island }
      - { zh: 温泉和海滩收入的一部分用于公共住房, en: Part of the hot spring and beach revenue for public housing }
      - { zh: 旅游旺季的临时工享有同等社保, en: Equal social insurance for seasonal tourism workers }
    allies: [pty_jh513z, pty_vxz9jt]
    targets: { div_raat4g: 36 }
    lean: { port: 0.3, shipbuilding: 0.5, manufacturing: 0.3, fishing: 0.2, income: -0.4, urban: 0.2 }
    notes:
      zh: "红帆党是维京群岛两大党之一，属社会民主主义，与北维京岛的互助党是姊妹党。它主张岛际渡轮对居民免费、集体工资协议覆盖渔船、船坞和酒店员工、每座有人居住的岛上都有一名全科医生。维京群岛沿用殖民时代留下的单议席选区制，红帆党与蓝桨党轮流执政的传统由此而来，小党很难赢下选区。在上一次选举中，红帆党在六十一个选区里赢下了过半数，单独执政，党首卡娅·布伦维克出任总督。它的票仓在船坞城镇、渔港和收入偏低的工人社区。党旗上的红帆是群岛渔船的老式帆，红帆党人说：「风是大家的，帆也是大家的。」每次选举之夜，红帆党的支持者会在长船古城的老码头升起一面红帆，等计票结束后再决定是否把它降下。红帆青年每年夏天与互助党的青年团在海底通道两端轮流办营。"
      en: "The Red Sail Party is one of the Viking Islands' two big parties, a social democratic party and the sister party of North Viking Island's Mutual Aid Party. It wants free inter-island ferries for residents, collective wage agreements covering fishing crews, boatyards and hotels, and a general practitioner on every inhabited island. The Viking Islands keep the single-seat constituencies left from colonial times, which is where the tradition of the Red Sail and Blue Oar parties taking turns in government comes from, and small parties seldom win a seat. At the last election the Red Sail Party won a majority of the sixty-one constituencies and governs alone, with its leader Kaja Brennvik as governor. Its strongholds are the boatyard towns, the fishing harbours and the poorer working districts. The red sail on its flag is the old sail of the islands' fishing boats, and its members say the wind belongs to all, and so does the sail. On every election night its supporters raise a red sail on the old quay of Longship's old town, and decide whether to lower it only when the count is done. Each summer Red Sail Youth and the Mutual Aid Party's youth wing hold a camp at either end of the undersea link in turn."
    history:
      zh: "红帆党起源于殖民时代的渔民和船坞工人互助会，那时群岛的议会只有两个派别，一派代表船工，一派代表船东。殖民统治结束后，这两个派别分别成为红帆党和蓝桨党。"
      en: "The Red Sail Party grew out of the mutual aid societies of fishers and boatyard workers in colonial times, when the islands' assembly had only two factions, one for the boat crews and one for the boat owners. When colonial rule ended the two factions became the Red Sail and Blue Oar parties."

