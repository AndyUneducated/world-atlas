    policies: [{"zh": "政府每年建造一万套公共租赁住房", "en": "Build ten thousand public rented homes a year"}, {"zh": "码头工人、船厂工人和船员的工资与房价指数挂钩", "en": "Link the pay of dockers, shipyard workers and crews to the house-price index"}, {"zh": "对空置的豪宅和投资性住房征收重税", "en": "Tax empty mansions and investment property heavily"}, {"zh": "外籍船员享有与本地船员同等的劳动保护", "en": "Give foreign crews the same labour protection as Varonese ones"}]
    allies: ["pty_vcr9n8"]
    targets: {"div_hxyyfe": 34}
    lean: {"income": -1.2, "young": 1.2, "shipbuilding": 1.0}
    notes: {"zh": "海员工党是瓦罗纳大议会的第二大党和最大的反对党，代表码头工人、船厂工人、船员和住在高层公寓里的普通家庭。党首马米·拉钦巴当过船厂的焊工和工会主席，以组织船厂罢工出名，那次罢工让船厂工人的工资提高了两成。党员约二万四千，比自由商人党还多，大多是工会会员。\n党的口号是「造船的人也要有房住」。瓦罗纳的房价是全岛最高的，许多码头工人一家四口住在不到四十平方米的公寓里，所以海员工党把住房放在纲领的第一位：政府每年建造一万套公共租赁住房；对空置的豪宅和投资性住房征收重税；码头工人、船厂工人和船员的工资与房价指数挂钩。它还主张外籍船员享有与本地船员同等的劳动保护，这在一个靠航运为生的城邦里是一个有争议的立场。\n海员工党支持共和国的中立和世俗协约，但批评自由商人党把中立当作做生意的借口，主张禁止与侵犯人权的政权做军火以外的敏感贸易。它上一次进入政府时，推动了船员的最低工资和海上事故保险，但因为与商人党在填海计划上的分歧退出了联合政府。港城公民党在住房问题上与它有共同点，政治评论员常常讨论两党联合执政的可能。\n海员工党与船厂工会和海员工会的关系密不可分：两大工会的会员可以集体入党，工会在党的全国大会中拥有一半的票数。党首由全国大会选出，传统上出身于船厂或船上，拉钦巴就是在船坞里被工友们推举出来的。党的候选人名单中至少一半是工会会员，章程还规定每份名单都要有一名外籍船员的代表，这在瓦罗纳的政党中是唯一的。党的经费来自工会的政治基金和党员的会费，规模远不如自由商人党，选举时主要靠工会的志愿者挨家挨户敲门。党在南岸的公共住宅区设立了租户咨询站，帮助住户与房东和房屋管理部门交涉。青年海员组织夜间篮球赛和工人合唱团。\n海员工党的选民是年轻人和低收入者，在船厂区和南岸的公共住宅区最强。每年五月一日，船厂工人从船坞出发游行到商会大厅门前，船厂的汽笛同时鸣响，集会以《海员之歌》结束。党旗上半是红色，下半是蓝色，以波浪线分开，中间一只白色的铁锚，红色是劳动者，蓝色是大海，铁锚是港口和船员。", "en": "The Seafarers' Labour Party is the second party in Varona's Great Council and the largest in opposition, speaking for dockers, shipyard workers, crews and the ordinary families of the tower blocks. Its leader, Mamy Ratsimba, was a welder and union chairman at the shipyard and made his name organising a shipyard strike that won a fifth more pay. Its 24,000 or so members, more than the Free Merchants have, are mostly union members. \nIts watchword is 'those who build the ships need homes too'. Varona has the highest house prices on the island and many dockers' families of four live in flats of under forty square metres, so housing comes first in the programme: ten thousand public rented homes a year; heavy taxes on empty mansions and investment property; and the pay of dockers, shipyard workers and crews linked to the house-price index. It also wants foreign crews given the same labour protection as Varonese, a contested position in a city-state that lives by shipping. \nThe party supports the republic's neutrality and the Secular Accord, but says the Free Merchants use neutrality as an excuse for business, and wants sensitive trade beyond arms banned with regimes that abuse human rights. The last time it was in government it brought in a minimum wage and accident insurance for crews, then left the coalition over the reclamation plan. The Harbour Citizens share some of its housing aims, and commentators often discuss the two governing together. \nSeafarers' Labour is inseparable from the shipyard and seafarers' unions: their members may join the party collectively, and the unions hold half the votes at the national congress. The congress elects the leader, who by tradition comes from the yard or the ships; Ratsimba was put forward by his workmates in the dock. At least half of every candidate list must be union members, and its rules require a representative of foreign crews on every list, the only party in Varona to do so. Money comes from union political funds and members' dues, far less than the Free Merchants have, and at elections it relies on union volunteers knocking on doors. It runs tenants' advice posts on the south-shore estates to help residents deal with landlords and the housing authority. Young Seafarers run night-time basketball and a workers' choir.\nIts voters are the young and the lower paid, and it is strongest in the shipyard district and the public housing estates of the south shore. On the first of May each year the shipyard workers march from the docks to the doors of the merchants' hall while every siren in the yard sounds, and the rally ends with 'The Seafarers' Song'. Its flag is red over blue, divided by a wavy line, with a white anchor in the middle: the red is working people, the blue the sea and the anchor the port and its crews."}
    history: {"zh": "海员工党由船厂工会和海员工会联合组建。大分裂时，船厂工人和船员也参加了守卫港口的城市卫队，共和国成立后，他们要求在大议会中有自己的代表，于是组建了政党。", "en": "The Seafarers' Labour Party was formed by the shipyard and seafarers' unions. In the Sundering shipyard workers and crews served in the city guard that held the port, and once the republic was founded they wanted their own voice in the Great Council and formed a party."}
    flag_notes: {"zh": "党旗上半是红色，下半是蓝色，以波浪线分开，中间一只白色的铁锚。红色是劳动者，蓝色是大海，铁锚是港口和船员。", "en": "The flag is red over blue, divided by a wavy line, with a white anchor in the middle. The red is working people, the blue the sea and the anchor the port and its crews."}
    factions: [{"names": {"zh": "船厂派", "en": "Shipyard Wing"}, "notes": {"zh": "船厂工会，最关心工资、工时和船厂的订单。", "en": "The shipyard unions, who care most about pay, hours and the yard's order book."}}, {"names": {"zh": "住房派", "en": "Housing Wing"}, "notes": {"zh": "公共住宅区的居民组织和年轻党员，最关心房价、租金和公共住房。", "en": "Tenants' groups of the public estates and younger members, who care most about house prices, rents and public housing."}}]
    organisation: {"newspaper": {"zh": "《船坞报》", "en": "The Dockyard"}, "unions": {"zh": "瓦罗纳船厂与海员工会联合会", "en": "Varona Federation of Shipyard and Seafarers' Unions"}, "women": {"zh": "海员家属会", "en": "Seafarers' Families' Association"}}
