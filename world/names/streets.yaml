# Street name parts for generated city streets (pipeline/atlas/streets.py).
#
# Each entry is "zh | en | viking | buckham [| tavrunaq [| ivuran]]", "-" where an entry has no form in a
# language. A street name is a stem plus a suffix of its class, e.g. 松林 + 巷 = 松林巷 /
# Pinewood Lane / Kiefernweg / Vicolo dei Pini. A city's streets are named only in the
# languages its territory uses (those its cities are named in).
#   viking: stems are in compounding form and the suffix is joined to them (Birken + allee);
#           a stem with a space is joined with hyphens (Freistad-auf-Hea-Straße).
#   buckham: the suffix comes first (Viale + del Popolo).
#   tavrunaq: the suffix follows as a word (Qavvalu Pirtuar); only stems with a Tavrunaq form
#           (the polar theme, Arctic place names) get a Tavrunaq name. Polar stems are native words:
#           English uses the Tavrunaq form and Chinese its transliteration (meaning in the comment).
#   ivuran: the suffix comes first (Sevu + Nalu); only stems with an Ivuran form (the tropic theme,
#           Everlong Summer place names) get an Ivuran name; English and Chinese as for Tavrunaq.
# Parallel streets of one neighbourhood may share a stem with an ordinal: 松林二巷 /
# Pinewood Lane 2 / Kiefernweg II / Vicolo dei Pini II.
# Themes are chosen per neighbourhood, weighted by the district's street style.

suffixes:
  arterial:
    - 大道 | Avenue | allee | Viale | Pirtuar | Pelavu
    - 大街 | Boulevard | chaussee | Corso | Sallituar | Hanusevu
    - 路 | Road | straße | Via | Pirri | Sevu
  collector:
    - 路 | Road | straße | Via | Pirri | Sevu
    - 街 | Street | gasse | Strada | Sallik | Sorai
    - 大街 | High Street | markt | Corso | Sallituar | Hanusorai
  local:
    - 街 | Street | gasse | Via | Sallik | Sorai
    - 巷 | Lane | weg | Vicolo | Kippaq | Kilai
    - 里 | Close | hof | Corte | Sannuk | Toruva
    - 弄 | Alley | gang | Calle | Saqqit | Pisevu
    - 坊 | Row | zeile | Borgo | Taavrut | Taroma
    - 路 | Way | pfad | Salita | Pirriut | Sevuni

