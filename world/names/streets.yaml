  planned: { civic: 3, culture: 3, numbered: 2, china: 2, sky: 2, trees: 1, places: 2 }
  mixed: { trees: 2, animals: 2, sky: 2, china: 2, landscape: 2, families: 1, culture: 1, places: 2, norse: 1 }
  organic: { trades: 3, norse: 2, families: 2, landscape: 2, animals: 1, trees: 1, places: 1 }
