    notes:
      zh: "基库维克岛西尔米基克山南段的最高峰，海拔 2236 米，峰顶覆盖着基克西尔米冰帽，尖峭的山形像露出冰面的獠牙，山名由此而来。山峰远在海上，离最近的公路也有近 300 公里。从海上远远望去，冰帽上的峰尖像一颗獠牙露出冰面，过往的船员都叫它「冰上的牙」。"
      en: "The highest point of the southern Sirmikiiq Mountains on Kiiquviq Island, 2,236 m, capped by the Kiiqsirmi Ice Cap; its sharp shape, like a fang through the ice, gave it its name. It stands far out at sea, nearly 300 km from the nearest road. Seen from far out at sea, the peak juts from the ice cap like a tusk, and passing sailors all call it \"the tooth in the ice\"."
  - id: nat_k55z4h
    subtype: peak
