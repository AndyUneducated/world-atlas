# Mountain landforms of the Arctic Ocean Territory: peaks, passes and glaciers, found in the
# terrain by the generator (pipeline/atlas/relief.py) and named by `detect: {kind, at_km}`.
features:
  - id: nat_aqrt62
    subtype: glacier
    status: generated
    detect: { kind: glacier, at_km: [470, 228] }
    names:
      zh: 西尔米冰盖
      en: Sirmi Ice Cap
      art-x-tavrunaq: Sirmitavru
    wonder:
      zh: 世界最大的冰盖，面积约 2.95 万平方公里
      en: The largest ice cap in the world, about 29,500 km²
    notes:
      zh: "覆盖西尔米高地的冰盖，面积约 2.95 万平方公里，是领地最大的冰川，平均海拔近 1900 米，大部分在西尔米冰盖管理区，西南缘伸入内陆矿区。冰盖深处的冰芯钻探站钻取冰芯研究过去的气候；西卢阿高速沿冰盖东侧外缘修建，不上冰面。西尔米卡尔维克的工匠每年入冬用冰盖边缘采来的冰块砌起一座冰旅馆，到了春天整座旅馆慢慢化回水里；游客最喜欢的纪念是一杯用冰盖古冰泡的茶，冰块在杯里化开时噼啪作响。"
      en: "The ice cap over the Sirmi Highlands, about 29,500 km², the largest glacier in the territory, with a mean height of nearly 1,900 m; most of it lies in the Sirmi Ice Cap Administration Zone, its south-western edge reaching into the inland mining zone. The ice core station deep on the cap drills cores to study past climate, and the Sillua Expressway follows its eastern edge without going onto the ice. Each winter the craftsmen of Sirmiqarvik build an ice hotel from blocks cut at the edge of the ice cap, and in spring it slowly melts back into water; visitors' favourite souvenir is tea made with ancient ice from the cap, which crackles as it melts in the cup."

  # ── Peaks, passes and glaciers named in M29 ─────────────
  - id: nat_c28dp2
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [499.2, 234.8] }
    names: { zh: 西尔米峰, en: "Mount Sirmi", art-x-tavrunaq: Sirmipirruk }
    notes:
      zh: "西尔米高地的最高峰，海拔 2506 米，是领地最高峰，峰顶埋在西尔米冰盖之下，只是冰面上一处平缓的隆起。西卢阿高速在约 60 公里外经过，登顶须长途穿越冰盖。登顶的科考队说，站在领地最高处，四周看到的却只有一望无际的白色，「找不到峰顶，只能相信卫星定位」。"
      en: "The highest point of the Sirmi Highlands, 2,506 m and the highest peak in the territory, its summit buried under the Sirmi Ice Cap as a gentle swelling of the ice. The Sillua Expressway passes some 60 km away, and reaching the top means a long crossing of the ice cap. Teams who have reached it say that from the territory's highest point there is nothing in any direction but endless white: \"you can't see a summit, you just have to trust the satellite fix\"."
  - id: nat_scswkr
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [426.8, 315.8] }
    names: { zh: 基克皮鲁克峰, en: Mount Kiiqpirruk, art-x-tavrunaq: Kiiqpirruk }
    notes:
      zh: "基库维克岛西尔米基克山的主峰，海拔 2236 米，是领地第二高峰，峰顶覆盖着基克西尔米冰帽，尖峭的山形像露出冰面的獠牙，山名由此而来。山峰远在海上，离最近的公路也有近 300 公里。从海上远远望去，冰帽上的峰尖像一颗獠牙露出冰面，过往的船员都叫它「冰上的牙」。"
      en: "The summit of the Sirmikiiq Mountains on Kiiquviq Island, 2,236 m and the second highest peak in the territory, capped by the Kiiqsirmi Ice Cap; its sharp shape, like a fang through the ice, gave it its name. It stands far out at sea, nearly 300 km from the nearest road. Seen from far out at sea, the peak juts from the ice cap like a tusk, and passing sailors all call it \"the tooth in the ice\"."
  - id: nat_k55z4h
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [451.2, 142.2] }
    names: { zh: 陶武皮鲁克峰, en: Mount Tauvvupirruk, art-x-tavrunaq: Tauvvupirruk }
    notes:
      zh: "苏瓦尔尤伊特山脉的最高峰，海拔 2022 米，是领地第三高峰，在乌库拉克市西卢阿苏瓦特生态保护区，陶武西尔米冰川从峰顶向四周流下。西卢阿高速在约 50 公里外经过。峰名的意思是「天峰」，晴朗的夏天，乌库拉克的登山爱好者喜欢来爬它，站在峰顶能望见冰封的远山和不冻的港湾。"
      en: "The highest summit of the Suvvarjuit Mountains, 2,022 m and the third highest peak in the territory, in the Silluasuvvat Nature Reserve of Ukkulaaq City, with the Tauvvusirmi Glacier flowing down from it on all sides. The Sillua Expressway passes some 50 km away. Its name means \"sky peak\", and on clear summer days Ukkulaaq's climbers like to come here, seeing from the top frozen mountains in the distance and the ice-free harbour below."
  - id: nat_szhgrt
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [233.8, 137.2] }
    names: { zh: 尼尔萨皮鲁克峰, en: Mount Nirsapirruk, art-x-tavrunaq: Nirsapirruk }
    notes:
      zh: "苏瓦西尔米冰原的最高点，海拔 1950 米，是领地第四高峰，在塔夫鲁利特原住民自治区的尼尔萨图维特生态保护区。驯鹿群每年春秋沿山脚的谷地迁徙，山名由此而来。牧民的老话「Nirsa pirri, tavru pirri」说「驯鹿走的路，就是土地的路」，山脚的迁徙谷地正是这样一条路，迁徙季节谷地里不许修路，也不许飞机低飞。"
      en: "The highest point of the Suvvasirmi Icefield, 1,950 m and the fourth highest peak in the territory, in the Nirsatuvvit Nature Reserve of the Tavrulit Indigenous Autonomous Region. Reindeer herds migrate along the valleys at its foot every spring and autumn, hence the name. The herders' saying \"Nirsa pirri, tavru pirri\", the road the reindeer walk is the road of the land, describes exactly the migration valleys at its foot, where no roads may be built and aircraft may not fly low in the migration season."
  - id: nat_bfyxfg
