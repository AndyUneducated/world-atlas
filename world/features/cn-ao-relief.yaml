      zh: "苏瓦尔尤伊特山脉中的山口，海拔 991 米，在首府以北的伊卢克图克生态保护区，乌库利特高速从山口经过。山口因南面的首府库马尔维克区得名。山口的服务区是矿工轮换途中歇脚的地方，热鱼汤和驯鹿肉丸是固定菜，墙上挂着历年山口风雪最大时的照片。"
      en: "A pass in the Suvvarjuit Mountains, 991 m, in the Illuqtuuq Nature Reserve north of the capital, through which the Ukkuliit Expressway runs. It is named after Qummarvik District in the capital to the south. The pass service area is where miners on rotation stop to rest, with hot fish soup and reindeer meatballs always on, beneath photographs of the worst storms the pass has seen."
  - id: nat_tkxdfd
