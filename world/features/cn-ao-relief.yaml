      en: "A peak in Illuqsaat District, 1,887 m and the fourth highest named peak on the mainland, capped by the Unnasirmi Glacier. The Ukkuliit Expressway passes some 40 km away. Its meltwater gathers in a string of small lakes at its foot, blue and green in summer, echoing the brine pools of the lithium works not far away."
