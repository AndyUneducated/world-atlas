    notes:
      zh: "苏瓦尔尤伊特山脉西段的冰原，面积约 1.03 万平方公里，是领地第二大冰川，近一半在尼尔萨瓦克区，其余在尼尔萨图维特生态保护区、普拉苏瓦米乌特区和阿卡皮图米乌特区，最高点尼尔萨皮鲁克峰海拔 1950 米。冰原的融水汇入尼尔萨河和基卢克图阿尔河。冰原边缘的融水夏天汇成一条条小溪，驯鹿迁徙时沿着溪谷走，牧民说冰原是「驯鹿的水缸」。"
      en: "The icefield of the western Suvvarjuit Mountains, about 10,300 km², the second largest glacier in the territory; nearly half of it is in the Nirsavaq District and the rest in the Reindeer Migration reserve, Pullasuvvamiut and the Aqqapitummiut District, and its highest point is Mount Nirsapirruk at 1,950 m. Its meltwater feeds the Nirsa and Kiluktuar rivers. In summer the meltwater at the icefield's edge gathers into streams whose valleys the migrating reindeer follow, and herders call the icefield \"the reindeer's water jar\"."
