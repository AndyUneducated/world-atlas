      en: "A col on the Sirmi Ice Cap, 2,102 m, the highest named pass in the territory, entirely under ice and snow; no road crosses it, only research parties on snow vehicles. Snowcats crossing the col plant a line of coloured flags as markers and collect them one by one on the way back; the teams say \"flags in on the way out, flags out on the way back, leave nothing on the ice\"."
  - id: nat_pgmb4p
    subtype: glacier
    status: generated
    detect: { kind: glacier, at_km: [261.1, 139.6] }
    names: { zh: 苏瓦西尔米冰原, en: Suvvasirmi Icefield, art-x-tavrunaq: Suvvasirmi }
    notes:
      zh: "苏瓦西尔米冰原在苏瓦尔尤伊特山脉西段，面积约 1.03 万平方公里，是领地第三大冰川、大陆第二大冰川，仅次于西尔米冰盖，最高点尼尔萨皮鲁克峰海拔 1950 米，是大陆上第三高的命名山峰。冰原近一半在塔夫鲁利特原住民自治区的尼尔萨瓦克区，其余在尼尔萨图维特生态保护区、萨尔瓦克市的普拉苏瓦米乌特区和阿卡皮图米乌特区。冰原的融水向北汇入尼尔萨河和基卢克图阿尔河：尼尔萨河长约 471 公里，是领地第二长的河流，基卢克图阿尔河的流域面积在领地居第二，河口就是北岸的基卢基亚克。尼尔萨皮鲁克峰的名字来自 nirsa「驯鹿」，驯鹿群每年春秋沿山脚的谷地迁徙，尼尔萨图维特生态保护区就是为这条迁徙路线划定的。\n冰原边缘的融水夏天汇成一条条小溪，驯鹿迁徙时沿着溪谷走，牧民说冰原是「驯鹿的水缸」。尼尔萨瓦克区的牧民大多随鹿群在苔原上转场，夏天鹿群被蚊子追得往高处走，常常一直走到冰原脚下的残雪上乘凉，牧民就在冰缘下扎营，用冰块镇着刚钓上的鱼。区里的苔原上还立着通古阿利特石人群，张着双臂的石人面朝水源、渡口和驯鹿的迁徙路线，起雾时猎人靠它们找路。"
      en: "The Suvvasirmi Icefield lies in the western Suvvarjuit Mountains, about 10,300 km², the third largest glacier in the territory and the second largest on the mainland after the Sirmi Ice Cap; its highest point, Mount Nirsapirruk at 1,950 m, is the third highest named peak on the mainland. Nearly half of it is in the Nirsavaq District of the Tavrulit Indigenous Autonomous Region, and the rest in the Nirsatuvvit Nature Reserve, Pullasuvvamiut District of Saarvaq City and the Aqqapitummiut District. Its meltwater runs north into the Nirsa and Kiluktuar rivers: the Nirsa, about 471 km, is the second longest river in the territory, and the Kiluktuar has the territory's second largest basin, reaching the sea at Kilukkiaq on the north coast. Mount Nirsapirruk is named for nirsa, \"reindeer\", whose herds migrate every spring and autumn along the valleys at its foot, and the Nirsatuvvit Nature Reserve was drawn for that migration route.\nIn summer the meltwater at the icefield's edge gathers into streams whose valleys the migrating reindeer follow, and herders call the icefield \"the reindeer's water jar\". Most herders of the Nirsavaq District move with their herds across the tundra; in summer the deer, driven uphill by the mosquitoes, often climb all the way to the old snow at the foot of the icefield to cool off, and the herders camp below the ice edge and keep freshly caught fish cold on blocks of ice. The district's tundra also holds the Tuunngualiit Stone Figures, stone men with arms outstretched facing water, fords and the reindeer routes, which hunters once followed in fog."
  - id: nat_sem37w
    subtype: glacier
    status: generated
    detect: { kind: glacier, at_km: [446.9, 319.9] }
    names: { zh: 基克西尔米冰帽, en: Kiiqsirmi Ice Cap, art-x-tavrunaq: Kiiqsirmi }
    notes:
      zh: "基克西尔米冰帽覆盖基库维克岛南部的山顶，面积约 5400 平方公里，比岛北的乌维克西尔米冰帽略小，最高点基克皮鲁克峰海拔 2236 米，属西尔米瓦克自由邦的西尔米乌维特冰盖管理区。西尔米基克山纵贯基库维克岛，南北两段各顶着一座冰帽，这一座在南段。基克皮鲁克峰尖峭的山形像露出冰面的獠牙，峰名由此而来，过往的船员都叫它「冰上的牙」；山峰远在海上，离最近的公路也有近 300 公里。冰川从冰帽边缘直入大海，冰帽边缘的冰崖直立在海面上，崩落的冰山漂进群岛之间的海面，东面的基库利克岛就是因为常有冰山漂过而得名，有的冰山在岛边一搁浅就是一整个夏天。\n冰帽边缘的冰崖夏天崩落时溅起几层楼高的水花，船只总是远远地停下来看。夏季前来观赏冰川的邮轮会在这里放慢船速，船员给游客讲「冰上的牙」和北面「大獠牙」的故事：南边这座先有了名字，北面那座更高的后来才被测出来，船员们便管它叫「大哥牙」。冰山观测站的工作人员说，冰帽南缘每崩落一座大冰山，他们就多了一个要一路追踪到化掉为止的「孩子」。"
      en: "The Kiiqsirmi Ice Cap covers the summits of southern Kiiquviq Island, about 5,400 km², a little smaller than the Uviqsirmi Ice Cap in the north of the island, its highest point Mount Kiiqpirruk at 2,236 m, in the Sirmiuviit Ice Administration Zone of the Free State of Sirmivak. The Sirmikiiq Mountains run the length of Kiiquviq and carry an ice cap on each half, this one on the southern. The sharp form of Mount Kiiqpirruk looks like a tusk breaking through the ice, which gives the peak its name, and passing sailors all call it \"the tooth on the ice\"; it lies far out at sea, nearly 300 km from the nearest road. Its glaciers flow from its edges straight into the sea, the ice cliffs at its rim rising sheer from the water, and calved icebergs drift into the waters among the islands; Kiqqulik Island to the east is named for the bergs that so often drift past, some of which run aground off its shore and stay a whole summer.\nWhen the ice cliffs at its edge calve in summer they throw up spray several storeys high, and ships always stop well off to watch. Cruise ships that come in summer to see the glaciers slow down here while the crew tell passengers the story of \"the tooth on the ice\" and the \"great tusk\" to the north: the southern peak was named first, and the higher one to the north was measured only later, so the sailors called it \"big brother tooth\". The staff of the iceberg station say that every time a large berg breaks from the southern rim of the cap, they gain another \"child\" to follow until it melts away."
  - id: nat_cyrg37
    subtype: glacier
    status: generated
    detect: { kind: glacier, at_km: [375.4, 143.1] }
    names: { zh: 温纳西尔米冰川, en: Unnasirmi Glacier, art-x-tavrunaq: Unnasirmi }
    notes:
      zh: "温纳西尔米冰川环绕温纳皮鲁克峰，面积约 4200 平方公里，跨考尔尼克市的伊卢克萨特区和伊卢克图克生态保护区，最高点温纳皮鲁克峰海拔 1887 米，是大陆上第四高的命名山峰。冰川在苏瓦尔尤伊特山脉之中，乌库利特高速在约 40 公里外经过。冰川的融水在山脚汇成一串小湖，再注入伊卢考湖一带的湖泊；伊卢考湖是伊卢克萨特区的盐湖，湖水含锂，伊卢克萨特提锂厂从湖中的卤水提取锂，伊卢克萨特区也因这片湖得名。伊卢克萨特区约 8.3 万人，提锂和矿业运输是主要的生计；伊卢克图克生态保护区则是大湖苔原，领地最大的伊卢尔尤阿克湖就在区内，乌库利特真空磁悬浮重载铁路的管道从保护区里穿过。\n冰川下游的湖泊夏天水色碧绿，深浅不一，湖边的苔原上开满了小花，是伊卢克萨特区居民周末野餐的去处。提锂厂的卤水池冬天结冰停产，到了夏天，工人们一放假就带着孩子开车去湖边，在石头上烤驯鹿肉肠，看冰川在远处的山顶上发亮。孩子们喜欢比谁能在冰川融水汇成的小湖里站得更久，水冷得没人能坚持过十秒，上岸后一个个冻得直跺脚，大人们就在旁边笑。"
      en: "The Unnasirmi Glacier surrounds Mount Unnapirruk, about 4,200 km², spanning Illuqsaat District and the Illuqtuuq Nature Reserve of Qaurniq City; its highest point, Mount Unnapirruk at 1,887 m, is the fourth highest named peak on the mainland. The glacier lies among the Suvvarjuit Mountains, and the Ukkuliit Expressway passes some 40 km away. Its meltwater gathers in a string of small lakes at the foot of the mountain and then feeds the lakes around Illuqqau Lake, the salt lake of Illuqsaat, whose brine is rich in lithium and is worked by the Illuqsaat Brine Works; the district takes its name from the lake. Illuqsaat has about 83,000 people, living mainly from lithium and mine transport; the Illuqtuuq Nature Reserve is a country of great lakes and tundra, home to Illurjuaq Lake, the largest in the territory, and crossed by the tube of the Ukkuliit Vacuum Maglev Heavy-Haul Railway.\nThe lakes below the glacier are jade green in summer in every shade, their shores of tundra covered with small flowers, and Illuqsaat people picnic there at weekends. The brine pools of the lithium works freeze and stop in winter, and in summer, as soon as they have time off, the workers drive their children out to the lakes, grilling reindeer sausages on the rocks and watching the glacier shine on the distant summit. The children compete to see who can stand longest in the small lakes of meltwater below the glacier; the water is so cold that no one lasts ten seconds, and they come out stamping their feet while the grown-ups laugh."
  - id: nat_abpe0e
    subtype: glacier
    status: generated
    detect: { kind: glacier, at_km: [441.9, 143.9] }
    names: { zh: 陶武西尔米冰川, en: Tauvvusirmi Glacier, art-x-tavrunaq: Tauvvusirmi }
    notes:
      zh: "陶武西尔米冰川环绕陶武皮鲁克峰，面积约 3700 平方公里，大部分在乌库拉克市的西卢阿苏瓦特生态保护区，北缘伸入内陆矿区，最高点陶武皮鲁克峰海拔 2022 米。陶武皮鲁克峰是苏瓦尔尤伊特山脉的最高峰，也是大陆上仅次于西尔米峰的第二高命名山峰，冰川从峰顶向四周流下，铺满了周围的高谷。名字里的 tauvvu 在塔夫鲁纳克语里意为「天」，冰川顶在大陆南部最高的山上，本地人说它「离天最近」。西卢阿苏瓦特生态保护区面积约 1.93 万平方公里，常住只有约 3500 人；保护区里发源的乌库基卢克河水流湍急，流经基萨尔维克区，河上的水电站为基萨尔维克冶炼厂供电。西卢阿高速在约 50 公里外经过。\n冰川表面的裂隙在夏天的阳光下泛出幽蓝色，登山向导带人走冰川时，每一步都要先用冰镐探路。基萨尔维克的年轻人夏天爱组队上冰川，出发前在冶炼厂的食堂里吃一顿热鱼汤，回来后把冰镐挂在宿舍门口，算是一种炫耀。从镍城的高处向北望，晴天能看见冰川在山脊上发白，冶炼厂的老工人说，看冰川亮不亮就知道明天的天气，比收音机里的预报还准。"
      en: "The Tauvvusirmi Glacier surrounds Mount Tauvvupirruk, about 3,700 km², mostly in the Silluasuvvat Nature Reserve of Ukkulaaq City with its northern edge in the inland mining zone, its highest point Mount Tauvvupirruk at 2,022 m. Mount Tauvvupirruk is the highest summit of the Suvvarjuit Mountains and the second highest named peak on the mainland after Mount Sirmi, and the glacier flows from its summit in every direction, filling the high valleys around it. The tauvvu in its name is Tavrunaq for \"sky\", and since the glacier sits on the highest mountain in the south of the mainland, locals say it is \"nearest the sky\". The Silluasuvvat Nature Reserve covers about 19,300 km² with only some 3,500 residents; the fast-flowing Ukkukiluk River rises in the reserve and runs through Qissarvik District, where hydro plants on it power the Qissarvik smelter. The Sillua Expressway passes some 50 km away.\nThe crevasses on the glacier's surface glow deep blue in the summer sun, and guides leading parties across it probe every step ahead with an ice axe. Young people from Qissarvik like to go up onto the glacier in groups in summer, eating a bowl of hot fish soup in the smelter canteen before they set off and hanging their ice axes by their doors when they come back, as a bit of a boast. On clear days the glacier shows white on the ridges from the high ground of the nickel town, and the smelter's old hands say that whether it shines or not tells you tomorrow's weather more surely than the forecast on the radio."
  - id: nat_32cx7h
    subtype: glacier
    status: generated
    detect: { kind: glacier, at_km: [156.4, 134.1] }
    names: { zh: 帕利西尔米冰川, en: Paalisirmi Glacier, art-x-tavrunaq: Paalisirmi }
    notes:
      zh: "帕利西尔米冰川覆盖在帕利皮鲁克峰顶，面积约 2200 平方公里，在萨尔瓦克市的普拉苏瓦米乌特区，最高点帕利皮鲁克峰海拔 1879 米，在苏瓦尔尤伊特山脉的西端。普拉苏瓦米乌特区面积约 3.85 万平方公里，是萨尔瓦克市最大的区，峡湾深切的山地里散落着村镇；普拉苏瓦公路从萨尔努卡区向西北深入峡湾地带，在约 20 公里外经过冰川，西卢阿真空磁悬浮也在约 20 公里外穿过山地。冰川名和峰名里的 paali 在塔夫鲁纳克语里意为「白」，冰川顶在峰上，远看就像山峰戴着一顶白色的冠冕，山名和冰川名都由此而来。冰川的融水顺着山谷流下，夏天谷里的溪水带着冰川磨下的细粉，是浑浊的奶白色。\n从普拉苏瓦公路上望去，冰川像一顶白色的冠冕戴在峰顶上，晴天时峡湾的水面上能看到它的倒影。峡湾村镇的人家把冰川当作天气预报：峰顶清清楚楚，第二天就能出海；冠冕被云遮住，船老大便把船拴牢。夏天常有徒步者从公路边出发，走一整天到冰川脚下，在冰舌前的碎石滩上扎营，夜里听冰川深处传来闷闷的开裂声，第二天一早再沿原路返回。"
      en: "The Paalisirmi Glacier lies on the summit of Mount Paalipirruk, about 2,200 km², in Pullasuvvamiut District of Saarvaq City; its highest point, Mount Paalipirruk, at 1,879 m, stands at the western end of the Suvvarjuit Mountains. Pullasuvvamiut, about 38,500 km², is Saarvaq's largest district, mountain country cut by deep fjords and scattered with villages; the Pullasuvva Road runs north-west from Saarnuqa deep into the fjords and passes some 20 km from the glacier, and the Sillua Vacuum Maglev also crosses the mountains some 20 km away. The paali in the names of glacier and peak is Tavrunaq for \"white\": the glacier sits on the summit like a white crown when seen from afar, which gives both their names. Its meltwater runs down the valleys, and in summer the streams are a cloudy milky white with the fine flour the glacier grinds from the rock.\nFrom the Pullasuvva Road the glacier sits like a white crown on the summit, and on clear days its reflection lies on the water of the fjord. The fjord villages use it as a weather forecast: if the summit is sharp and clear, tomorrow you can put to sea; if cloud hides the crown, the skippers tie their boats down fast. In summer walkers often set off from the roadside and walk a full day to the foot of the glacier, camping on the gravel flats before its tongue, listening at night to dull cracks from deep in the ice and walking back the same way next morning."
  - id: nat_2efp2e
    subtype: glacier
    status: generated
    detect: { kind: glacier, at_km: [145.9, 203.4] }
    names: { zh: 普卡西尔米冰帽, en: Pukkasirmi Ice Cap, art-x-tavrunaq: Pukkasirmi }
    notes:
      zh: "普卡西尔米冰帽覆盖在普拉普卡高原顶上，面积约 1100 平方公里，是大陆上最小的命名冰川，最高点海拔 1573 米，大部分在图利瓦克市的普拉普卡特生态保护区，东缘伸入尼尔萨图维特生态保护区。冰帽盖住了高原的最高点普卡皮鲁克峰，峰的四周平坦，冰帽并不从深谷里流下，而是像一块白色的桌布平铺在高原顶上，向四面缓缓变薄。名字里的 sirmi 在塔夫鲁纳克语里意为「冰」。高原上风大雪深，西卢阿高速以长约 76 公里的普拉普卡高原防雪棚翻越高原，尼尔萨瓦克高速则以普拉普卡高原隧道穿过；图利基卢克河也发源于这片高原，河水即使在夏天也冰凉刺骨，是图利亚利维克区的水源。\n冰帽不大，夏天有经验的徒步者能在一天之内绕它走一圈，冰帽边缘常能看到雪兔留下的脚印。保护区的巡护员每年夏末沿冰帽边缘走一遍，在固定的几处石堆旁量一量冰缘离石堆有多远，记在本子上。暴风雪来时高原上能见度几乎为零，巡护员的忠告是，在冰帽上迷了路就原地坐下等风停，千万别乱走。图利亚利维克的人夏天周末喜欢开车上高原，远远看一眼冰帽在阳光下发亮，再回城里喝一杯用图利基卢克河水泡的茶。"
      en: "The Pukkasirmi Ice Cap lies on top of the Pullapukka Plateau, about 1,100 km², the smallest named glacier on the mainland, rising to 1,573 m; most of it is in the Pullapukkat Nature Reserve of Tullivaq City, and its eastern edge reaches into the Nirsatuvvit Nature Reserve. It covers the plateau's highest point, Mount Pukkapirruk, around which the ground is flat, so the ice does not pour down deep valleys but lies spread over the plateau like a white tablecloth, thinning gently towards its edges. The sirmi in its name is Tavrunaq for \"ice\". The plateau is windy and deep in snow; the Sillua Expressway crosses it under the 76 km Pullapukka Plateau Snow Shed and the Nirsavaq Expressway passes through it in the Pullapukka Plateau Tunnel, and the Tullikiluk River rises here too, its water icy even in summer, supplying Tullijaalivik District.\nThe ice cap is small, and experienced walkers can circle it in a day in summer, often finding mountain-hare tracks along its edge. Every late summer the reserve's rangers walk its rim and, at a few fixed cairns, measure how far the ice edge lies from each and write it in their notebooks. In a blizzard visibility on the plateau falls almost to nothing, and the rangers' advice is that if you lose your way on the ice cap you sit down and wait for the wind to drop, and never wander. On summer weekends Tullijaalivik people like to drive up onto the plateau for a distant look at the ice cap shining in the sun, then go back to town for a cup of tea made with Tullikiluk water."

  # ── Peaks and glaciers of the northern islands, named in M61 ─────────────
  - id: nat_sanqd9
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [540.8, 450.2] }
    names: { zh: 卡拉克皮鲁克峰, en: Mount Kallaaqpirruk, art-x-tavrunaq: Kallaaqpirruk }
    notes:
      zh: "皮鲁克尔尤伊特山脉的主峰，海拔 2917 米，是北方群岛的最高峰，在领地仅次于大陆上的西尔米峰，在皮鲁库维特生态保护区皮鲁克尔尤阿克岛的中部，卡拉克西尔米冰原从峰顶向四面铺开，冰川沿山谷一直流进南北两岸的峡湾。山峰远在北冰洋深处，没有任何道路可达，登山队要先乘包机降落在冰原边缘，再花三四个星期沿冰川一路向上。峰名的意思是「永昼峰」：夏天太阳整夜绕着峰顶转圈，从不落下，登山队可以在午夜冲顶，下山时自己的影子拖得比人长十几倍。山顶的登顶簿装在一只铁罐里，冻在一根铝杆脚下，翻开来，每一页上写得最多的一句话都是「太阳还在」。"
      en: "The summit of the Pirrukrjuit Mountains, 2,917 m, the highest peak of the northern islands and second in the territory only to Mount Sirmi on the mainland, in the middle of Pirrukrjuaq Island in the Pirrukuviit Nature Reserve; the Kallaaqsirmi Icefield spreads from it on every side, and its glaciers flow down the valleys into the fjords of the north and south coasts. It stands far out in the Arctic Ocean with no road anywhere near; climbers fly in by charter to the edge of the icefield and then spend three or four weeks working up the glaciers. Its name means \"midnight-sun peak\": in summer the sun circles the summit all night without setting, parties can make their summit push at midnight, and on the way down their shadows trail more than ten times their own length. The summit register is kept in a tin frozen to the foot of an aluminium pole, and the line written most often on its pages is \"the sun is still up\"."
  - id: nat_qe7p4x
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [616.6, 434.1] }
    names: { zh: 贾利皮鲁克峰, en: Mount Jaalipirruk, art-x-tavrunaq: Jaalipirruk }
    notes:
      zh: "皮鲁克尔尤伊特山脉东段的最高峰，海拔 2477 米，峰顶周围的山地覆盖着贾利西尔米冰川。东段的山脊正对着北冰洋上吹来的风，峰顶终年刮着大风，雪被吹成一条条横在空中的雪旗，山名意为「风峰」。登山队说这座峰「不是爬上去的，是被风推上去又推下来的」；科考队在峰下的山口装过两次风速计，都没有撑过一个冬天。"
      en: "The highest summit of the eastern Pirrukrjuit Mountains, 2,477 m, the high ground around it covered by the Jaalisirmi Glacier. The eastern ridges face straight into the wind off the Arctic Ocean, the summit is wind-blasted all year with snow streaming from it in long banners, and its name means \"wind peak\". Climbers say this mountain \"isn't climbed so much as blown up and blown down again\"; the research team has twice fixed an anemometer on the col below it, and neither survived a winter."
  - id: nat_1y6ng9
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [456.1, 454.6] }
    names: { zh: 帕卡皮鲁克峰, en: Mount Pakkapirruk, art-x-tavrunaq: Pakkapirruk }
    notes:
      zh: "皮鲁克尔尤伊特山脉西段的最高峰，海拔 2052 米，峰顶下是帕卡西尔米冰川。西段的山脊被冰川切成一段段破碎的锯齿，山名意为「碎峰」。夏天海冰化开后，从普拉乌维克岛一带的海上望去，参差的山尖一字排开，像一把掉了好几颗齿的旧梳子，往来的科考船员就叫它「破梳子」。"
      en: "The highest summit of the western Pirrukrjuit Mountains, 2,052 m, with the Pakkasirmi Glacier beneath it. The western ridges have been cut by the ice into broken saw-teeth, and its name means \"broken peak\". When the sea ice opens in summer, the ragged summits stand in a row seen from the sea off Pullauviq Island, like an old comb with several teeth missing, and the crews of the research ships call it \"the broken comb\"."
  - id: nat_8g268b
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [474.4, 354.4] }
    names: { zh: 基克尔尤阿克峰, en: Mount Kiiqrjuaq, art-x-tavrunaq: Kiiqrjuaq }
    notes:
      zh: "西尔米基克山的主峰，海拔 2356 米，在基库维克岛北部，是西尔米乌维特群岛的最高峰，比岛南的基克皮鲁克峰高出一百多米，峰顶覆盖着乌维克西尔米冰帽。峰名意为「大獠牙」：南边那座「冰上的牙」先有了名字，北面这座更高的山后来被测量出来，船员们便管它叫「大哥牙」。山峰北坡直落北冰洋，冰川入海处的冰崖有几十米高。"
      en: "The summit of the Sirmikiiq Mountains, 2,356 m, in the north of Kiiquviq Island, the highest point of the Sirmiuviit Islands and more than a hundred metres higher than Mount Kiiqpirruk in the south of the island, capped by the Uviqsirmi Ice Cap. Its name means \"great fang\": the \"tooth in the ice\" to the south was named first, and when this higher mountain to the north was surveyed later, sailors began calling it \"the big brother tooth\". Its north face drops straight to the Arctic Ocean, where the ice cliffs of its glaciers stand tens of metres high."
  - id: nat_edd9sc
    subtype: glacier
    status: generated
    detect: { kind: glacier, at_km: [530.6, 450.9] }
    names: { zh: 卡拉克西尔米冰原, en: Kallaaqsirmi Icefield, art-x-tavrunaq: Kallaaqsirmi }
    notes:
      zh: "卡拉克西尔米冰原在皮鲁克尔尤伊特山脉中段，面积约 2.5 万平方公里，是领地第二大冰川，也是世界第二大，仅次于西尔米冰盖，全部在西尔米瓦克自由邦的皮鲁库维特生态保护区，最高点卡拉克皮鲁克峰海拔 2917 米，是北方群岛的最高峰。山不算高，三片山群都在 3000 米以下，可这里在北纬 80 度以北，雪线比大陆低三百米，宽阔的中段山群几乎整片埋在冰下，只有几座山尖露出冰面；东西两侧的低山口把它和贾利西尔米冰川、帕卡西尔米冰川隔开。冰原向南北两面伸出十几条山谷冰川，长的一直流进峡湾，冰崖崩落的冰山漂向外海。冰原名里的 kallaaq 在塔夫鲁纳克语里意为「永昼」，sirmi 意为「冰」，合起来就是「永昼之冰」。\n冰原只对持许可证的科考队和登山队开放，夏季从西尔米卡尔维克起飞的包机降落在岛上的冰川跑道。永昼的夏天里，冰面整日反射着阳光，科考队员要戴两层墨镜才能工作，他们说这里「一天有二十四小时的白天，影子却一直在绕着人转圈」。营地的帐篷搭在冰原边缘的岩石上，队员们半夜照样出去测量，常常回到帐篷才发现手表已经又走过了一整圈。"
      en: "The Kallaaqsirmi Icefield lies in the central Pirrukrjuit Mountains, about 25,000 km², the second largest glacier in the territory and in the world after the Sirmi Ice Cap, entirely within the Pirrukuviit Nature Reserve of the Free State of Sirmivak; its highest point, Mount Kallaaqpirruk at 2,917 m, is the highest peak in the northern islands. The mountains are not especially high, all three massifs below 3,000 m, but north of 80°N the snowline lies 300 m lower than on the mainland, and the broad central massif is almost entirely buried, only a few summits breaking through the ice; low cols to the east and west divide it from the Jaalisirmi and Pakkasirmi glaciers. More than a dozen valley glaciers reach out from it to the north and south, the longest running into the fjords, where icebergs calve from the ice cliffs and drift out to sea. The kallaaq in its name is Tavrunaq for \"endless day\" and sirmi means \"ice\": together, \"the ice of endless day\".\nThe icefield is open only to research and climbing parties with permits, and summer charters from Sirmiqarvik land on a glacier runway on the island. In the summer of the midnight sun the ice reflects sunlight all day long and researchers work in two pairs of sunglasses; here, they say, \"the day lasts twenty-four hours and your shadow keeps walking round you\". The camp tents are pitched on rock at the edge of the icefield, and the researchers go out to measure in the middle of the night just the same, often finding when they get back to the tent that their watches have gone round once more."
  - id: nat_ncqeq0
    subtype: glacier
    status: generated
    detect: { kind: glacier, at_km: [605.6, 437.6] }
    names: { zh: 贾利西尔米冰川, en: Jaalisirmi Glacier, art-x-tavrunaq: Jaalisirmi }
    notes:
      zh: "贾利西尔米冰川在皮鲁克尔尤伊特山脉东段，面积约 3400 平方公里，最高点贾利皮鲁克峰海拔 2477 米，全部在西尔米瓦克自由邦的皮鲁库维特生态保护区。三片山群里，中段埋在卡拉克西尔米冰原之下，西段是帕卡西尔米冰川，东段的这一条大小居中，面积是西段的三倍多。名字里的 jaali 在塔夫鲁纳克语里意为「风」，东段的山脊正对着北冰洋上吹来的风，峰顶终年刮着大风，雪被吹成一条条横在空中的雪旗；再往东的贾利尤阿克岛也以风为名，意为「大风岛」，岛上几乎没有高过脚踝的植物。这里在北纬 80 度以北，雪线比大陆低三百米，冰川从峰顶一直铺到低处的谷地，夏天的融水顺着谷地流进北冰洋。\n东段终年大风，冰面上的积雪被吹成一道道坚硬的雪垄，像冻住的海浪，雪地车开过去一路颠簸，科考队员说坐一趟比出一次海还晕。营地的帐篷要用冰螺栓和雪袋压住四角，夜里风声大得像有人在外面不停地敲门。队员们半开玩笑地把这里叫作「风的老家」，回到西尔米卡尔维克的头几天，常常还会在安静的夜里被耳朵里残留的风声吵醒。"
      en: "The Jaalisirmi Glacier lies in the eastern Pirrukrjuit Mountains, about 3,400 km², rising to 2,477 m at Mount Jaalipirruk, entirely within the Pirrukuviit Nature Reserve of the Free State of Sirmivak. Of the three massifs, the central one is buried under the Kallaaqsirmi Icefield and the western carries the Pakkasirmi Glacier; this glacier in the east is the middle one in size, more than three times the area of the western. The jaali in its name is Tavrunaq for \"wind\": the eastern ridges face the wind off the Arctic Ocean, gales blow over the summit all year and the snow streams from it in banners hanging across the sky; Jaalijuaq Island further east is named for the wind too, \"island of great wind\", with hardly a plant on it higher than an ankle. North of 80°N the snowline lies 300 m lower than on the mainland, and the glacier spreads from the summit right down to the low valleys, its summer meltwater running down them into the Arctic Ocean.\nThe eastern massif is windswept all year and the snow on the ice is carved into hard ridges like frozen waves; snowcats lurch across them, and researchers say one ride is worse for seasickness than a trip to sea. The camp tents have their corners held down with ice screws and snow bags, and at night the wind is so loud it sounds like someone knocking at the door without pause. The researchers half-jokingly call this place \"the wind's home\", and for their first few days back in Sirmiqarvik they are often woken on quiet nights by the wind still sounding in their ears."
  - id: nat_4tndg7
    subtype: glacier
    status: generated
    detect: { kind: glacier, at_km: [454.4, 453.9] }
    names: { zh: 帕卡西尔米冰川, en: Pakkasirmi Glacier, art-x-tavrunaq: Pakkasirmi }
    notes:
      zh: "帕卡西尔米冰川在皮鲁克尔尤伊特山脉西段，面积约 1100 平方公里，最高点帕卡皮鲁克峰海拔 2052 米，全部在西尔米瓦克自由邦的皮鲁库维特生态保护区。皮鲁克尔尤伊特山脉分东、中、西三片山群，中段埋在卡拉克西尔米冰原之下，东段是贾利西尔米冰川，西段的这一条是三者中最小的。西段的山脊被冰川切成一段段破碎的锯齿，帕卡皮鲁克峰的名字意为「碎峰」，冰川也被锯齿般的山脊分成好几条冰流，顺着山谷伸向海岸。这里在北纬 80 度以北，雪线比大陆低三百米，冰川虽小，终年不化的冰面却一直铺到低处的谷口。西面的普拉乌维克岛是群岛西端的低平鸟岛，夏天散布着成千上万个融水小湖。\n西段的冰面上布满裂隙，向导带队过冰川时要一人一根绳子连成一串，他们说这里的冰「看着平，底下全是门」。夏天海冰化开后，从普拉乌维克岛一带的海上望去，参差的峰尖立在冰川之上，像一排缺了齿的梳子；鸟类调查队收工以后，常坐船绕到这片海上看一会儿冰川。登山营地的厨师喜欢用冰川的融水煮咖啡，说北纬 80 度以北的水「什么味道都没有，所以什么味道都留得住」。"
      en: "The Pakkasirmi Glacier lies in the western Pirrukrjuit Mountains, about 1,100 km², rising to 2,052 m at Mount Pakkapirruk, entirely within the Pirrukuviit Nature Reserve of the Free State of Sirmivak. The Pirrukrjuit Mountains fall into eastern, central and western massifs: the central one is buried under the Kallaaqsirmi Icefield, the eastern carries the Jaalisirmi Glacier, and this glacier in the west is the smallest of the three. The ridges of the western massif are cut by the ice into broken saw-teeth, Mount Pakkapirruk meaning \"broken peak\", and the glacier too is split by the jagged ridges into several ice streams running down the valleys towards the coast. North of 80°N the snowline lies 300 m lower than on the mainland, and small as it is, the glacier's permanent ice reaches right down to the low valley mouths. To the west lies Pullauviq Island, the low island of birds at the western end of the archipelago, scattered in summer with thousands of meltwater pools.\nThe ice of the western massif is riddled with crevasses, and guides crossing it rope their parties together in a single line: the ice here, they say, \"looks flat, but underneath it's all doors\". In summer, once the sea ice has gone, the ragged summits seen from the sea off Pullauviq stand above the glacier like a comb with missing teeth, and the bird survey teams often take a boat round to these waters after work to watch the glacier for a while. The cook at the climbing camp likes to make coffee with glacier meltwater, saying water from north of 80° \"tastes of nothing, so it keeps every flavour you give it\"."
  - id: nat_jvvfkd
    subtype: glacier
    status: generated
    detect: { kind: glacier, at_km: [469.4, 353.4] }
    names: { zh: 乌维克西尔米冰帽, en: Uviqsirmi Ice Cap, art-x-tavrunaq: Uviqsirmi }
    notes:
      zh: "乌维克西尔米冰帽覆盖基库维克岛北部的山地，面积约 6000 平方公里，比岛南的基克西尔米冰帽还大，最高点基克尔尤阿克峰海拔 2356 米，是西尔米乌维特群岛的最高峰。冰帽属西尔米瓦克自由邦的西尔米乌维特冰盖管理区；基库维克岛面积约 5.7 万平方公里，是领地第二大岛，纵贯全岛的西尔米基克山南北两段各顶着一座冰帽，这一座在北段。冰帽的名字由 uviq「岛」和 sirmi「冰」组成，就是「岛上的冰」。冰川从冰帽北缘直入北冰洋，基克尔尤阿克峰的北坡直落海面，冰川入海处的冰崖有几十米高；冰山观测站为南岸航线发布冰山预报，从这里崩落的大冰山都会被编号建档，一直追踪到化掉为止。\n冰帽北缘崩落的冰山一路向北漂进海冰里，被冻住以后要好几年才能挪动；科考队在一座冰山上插过一面小旗，三年后在八十公里外的海冰上又看见了它，旗子已经褪成了白色，旗杆却还立着。夏天有邮轮前来观赏冰川，船上的人隔着几公里就能听见冰崖崩落的轰响，像远处在打雷。冬天的极夜里，冰帽隐在黑暗中，只有极光亮起来的时候，才能看见山顶那一大片泛着绿光的白。"
      en: "The Uviqsirmi Ice Cap covers the mountains of northern Kiiquviq Island, about 6,000 km², larger than the Kiiqsirmi Ice Cap in the south of the island, its highest point Mount Kiiqrjuaq at 2,356 m, the highest peak of the Sirmiuviit Islands. It lies in the Sirmiuviit Ice Administration Zone of the Free State of Sirmivak; Kiiquviq, about 57,000 km², is the territory's second largest island, and the Sirmikiiq Mountains that run its length carry an ice cap on each half, this one on the northern. Its name joins uviq, \"island\", and sirmi, \"ice\": \"the island's ice\". Its glaciers flow from its northern edge straight into the Arctic Ocean; the north face of Mount Kiiqrjuaq drops straight to the sea, and where the glaciers meet it the ice cliffs are tens of metres high. The iceberg station issues iceberg forecasts for the south-coast lanes, and every large berg calved here is numbered, filed and tracked until it melts.\nIcebergs calved from the northern edge drift north into the pack and, once frozen in, take years to move on; a research team once planted a small flag on one, and three years later saw it again on the sea ice eighty kilometres away, the flag bleached white but the pole still standing. Cruise ships come in summer to see the glaciers, and their passengers can hear the roar of the ice cliffs calving from kilometres off, like distant thunder. In the polar night of winter the ice cap is hidden in darkness, and only when the aurora lights up can you see the great white expanse on the summits glowing green."
