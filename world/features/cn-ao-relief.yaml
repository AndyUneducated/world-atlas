      en: "A pass in Illuqsaat District, 1,037 m, the way across the Illuqsaat uplands. The pass is open tundra where reindeer graze in summer; the Ukkuliit Vacuum Maglev Heavy-Haul Railway runs in its tube some 40 km away, not a sound of it reaches the pass, and the reindeer never know that trains run nearby."
  - id: nat_v3jjph
