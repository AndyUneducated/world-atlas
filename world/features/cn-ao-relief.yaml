    names: { zh: 普卡西尔米冰帽, en: Pukkasirmi Ice Cap, art-x-tavrunaq: Pukkasirmi }
    notes:
      zh: "普拉普卡高原顶上的冰帽，面积约 1100 平方公里，是领地七条命名冰川中最小的，最高点海拔 1573 米，东缘伸入尼尔萨图维特生态保护区。冰帽不大，夏天有经验的徒步者能在一天之内绕它走一圈，冰帽边缘常能看到雪兔留下的脚印。"
      en: "The ice cap on top of the Pullapukka Plateau, about 1,100 km², the smallest of the territory's seven named glaciers, rising to 1,573 m, its eastern edge reaching into the Nirsatuvvit Nature Reserve. The ice cap is small, and experienced walkers can circle it in a day in summer, often finding mountain-hare tracks along its edge."
