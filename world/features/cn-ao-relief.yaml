      zh: 镍城区东北的山口，海拔 776 米，在南岸峡湾生态保护区内，是镍城通往内陆山地的传统通道。
      en: A pass north-east of Nickel Town, 776 m, in the South Fjords Nature Reserve, the traditional way from Nickel Town into the inland mountains.
  - id: nat_9mss07
    subtype: pass
    status: generated
    detect: { kind: pass, at_km: [135.8, 143.2] }
    names: { zh: 图拉卡蒂克山口, en: Tullakatiq Pass, art-x-tavrunaq: Tullakatiq }
    notes:
      zh: 图利瓦克市冷谷区的山口，海拔 502 米，是领地最低的命名山口，冷风从山口沿谷地吹向冷谷峡湾。
      en: A pass in Cold Valley District of Tullivaq City, 502 m, the lowest named pass in the territory, through which cold winds pour down the valley to Cold Valley Fjord.
  - id: nat_t34zj9
    subtype: pass
    status: generated
    detect: { kind: pass, at_km: [479.8, 225.2] }
    names: { zh: 西尔米卡蒂克山口, en: Sirmikatiq Col, art-x-tavrunaq: Sirmikatiq }
    notes:
      zh: 西尔米冰盖上的鞍部，海拔 2102 米，是领地最高的命名山口，全部被冰雪覆盖，没有道路通过，只有科考队乘雪地车经过。
      en: A col on the Sirmi Ice Cap, 2,102 m, the highest named pass in the territory, entirely under ice and snow; no road crosses it, only research parties on snow vehicles.
  - id: nat_pgmb4p
    subtype: glacier
    status: generated
    detect: { kind: glacier, at_km: [261.1, 139.6] }
    names: { zh: 苏瓦西尔米冰原, en: Suvvasirmi Icefield, art-x-tavrunaq: Suvvasirmi }
    notes:
      zh: 千峡山脉西段的冰原，面积约 1.03 万平方公里，是领地第二大冰川，近一半在苔原牧区，其余在驯鹿迁徙生态保护区、西峡区和北岸猎区，最高点驯鹿峰海拔 1950 米。冰原的融水汇入尼尔萨河和基卢克图阿尔河。
      en: The icefield of the western Thousand Fjords Range, about 10,300 km², the second largest glacier in the territory; nearly half of it is in the Tundra Herding District and the rest in the Reindeer Migration reserve, West Fjord and the North Shore Hunting District, and its highest point is Reindeer Peak at 1,950 m. Its meltwater feeds the Nirsa and Kiluktuar rivers.
  - id: nat_sem37w
    subtype: glacier
    status: generated
    detect: { kind: glacier, at_km: [446.9, 319.9] }
    names: { zh: 基克西尔米冰帽, en: Kiiqsirmi Ice Cap, art-x-tavrunaq: Kiiqsirmi }
    notes:
      zh: 覆盖冰牙岛山顶的冰帽，面积约 5200 平方公里，是领地第三大冰川，最高点冰牙峰海拔 2236 米，冰川从冰帽边缘直入大海。
      en: The ice cap on the mountains of Icefang Island, about 5,200 km², the third largest glacier in the territory, its highest point Icefang Peak at 2,236 m; its glaciers flow from its edges straight into the sea.
  - id: nat_cyrg37
    subtype: glacier
    status: generated
    detect: { kind: glacier, at_km: [375.4, 143.1] }
    names: { zh: 温纳西尔米冰川, en: Unnasirmi Glacier, art-x-tavrunaq: Unnasirmi }
    notes:
      zh: 极夜峰周围的冰川，面积约 4200 平方公里，跨锂湖区和大湖苔原生态保护区，最高点极夜峰海拔 1887 米。冰川的融水注入锂湖一带的湖泊。
      en: The glacier around Polar Night Peak, about 4,200 km², spanning Lithium Lakes District and the Great Lakes Tundra Nature Reserve, its highest point Polar Night Peak at 1,887 m. Its meltwater feeds the lakes around Lithium Lake.
  - id: nat_abpe0e
    subtype: glacier
    status: generated
    detect: { kind: glacier, at_km: [441.9, 143.9] }
    names: { zh: 陶武西尔米冰川, en: Tauvvusirmi Glacier, art-x-tavrunaq: Tauvvusirmi }
    notes:
      zh: 苍穹峰周围的冰川，面积约 3700 平方公里，大部分在南岸峡湾生态保护区，北缘伸入内陆矿区，最高点苍穹峰海拔 2022 米。
      en: The glacier around Skydome Peak, about 3,700 km², mostly in the South Fjords Nature Reserve with its northern edge in the inland mining zone, its highest point Skydome Peak at 2,022 m.
  - id: nat_32cx7h
    subtype: glacier
    status: generated
    detect: { kind: glacier, at_km: [156.4, 134.1] }
    names: { zh: 帕利西尔米冰川, en: Paalisirmi Glacier, art-x-tavrunaq: Paalisirmi }
    notes:
      zh: 白冠峰顶的冰川，面积约 2200 平方公里，在萨尔瓦克市西峡区，最高点白冠峰海拔 1879 米，西峡公路在约 20 公里外经过。
      en: The glacier on Whitecrown Peak, about 2,200 km², in West Fjord District of Saarvaq City, its highest point Whitecrown Peak at 1,879 m; the West Fjord Road passes some 20 km away.
  - id: nat_2efp2e
    subtype: glacier
    status: generated
    detect: { kind: glacier, at_km: [145.9, 203.4] }
    names: { zh: 普卡西尔米冰帽, en: Pukkasirmi Ice Cap, art-x-tavrunaq: Pukkasirmi }
    notes:
      zh: 西部高原顶上的冰帽，面积约 1100 平方公里，是领地七条命名冰川中最小的，最高点海拔 1573 米，东缘伸入驯鹿迁徙生态保护区。
      en: The ice cap on top of the Western Plateau, about 1,100 km², the smallest of the territory's seven named glaciers, rising to 1,573 m, its eastern edge reaching into the Reindeer Migration Nature Reserve.
