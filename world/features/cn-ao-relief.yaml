# Mountain landforms of the Arctic Ocean Territory: peaks, passes and glaciers, found in the
# terrain by the generator (pipeline/atlas/relief.py) and named by `detect: {kind, at_km}`.
features:
  - id: nat_aqrt62
    subtype: glacier
    status: generated
    detect: { kind: glacier, at_km: [470, 228] }
    names:
      zh: 西尔米冰盖
      en: Sirmi Ice Cap
      art-x-tavrunaq: Sirmitavru
    wonder:
      zh: 世界最大的冰盖，面积约 2.95 万平方公里
      en: The largest ice cap in the world, about 29,500 km²
    notes:
      zh: "西尔米冰盖覆盖领地东北部的西尔米高地，面积约 2.95 万平方公里，是世界上最大的冰盖，也是领地最大的冰川；排在它后面的卡拉克西尔米冰原在北方海上的皮鲁克尔尤阿克岛，面积约 2.48 万平方公里。冰盖平均海拔约 1950 米，冰面上拔起的西尔米峰海拔 4014 米，比四周的冰面高出一千五百多米，是领地最高峰；冰盖边缘的西尔米卡蒂克山口海拔 2102 米，是领地最高的命名山口。冰盖大部分在西尔米冰盖管理区，属西尔米瓦克自由邦，西南缘伸入考尔尼克市的乌库利特矿区管理区。塔夫鲁纳克语名 Sirmitavru 由 sirmi「冰」和 tavru「土地」合成，意思就是「冰的土地」。\n冰盖是一层压在高地上的巨大冰壳，中部最厚，向四周缓缓降低，边缘伸出一条条冰舌，夏天冰舌前积起蓝绿色的融水湖。领地的雪线在海拔 1250 米上下，冰盖的绝大部分都在雪线以上，冬天落下的雪到夏天化不完，一年年压实成冰，冰盖就是这样积起来的。融水在冰盖南缘汇成西尔米河，一路向南注入大海，是领地最长的河流。冰面上终年寒冷，从中部高处吹下的冷风很少停歇，极夜里几乎没有人在冰上活动。冰盖管理区面积 72600 平方公里，常住只有约 1700 人，多是科研人员、向导和维护机场与道路的职工。\n西尔米冰芯钻探站在冰盖深处，只在夏季有飞机往返，科学家从冰层里钻出长长的冰芯，一节一节读出过去的气候：每一层冰都封着当年落下的雪和当年的空气。西卢阿高速沿冰盖东侧外缘的基岩修建，不上冰面；冰盖以东的陶瓦尼克区高地上散布着天文台和观测站。进入冰盖的冰川向导、猎人和探矿者都要领自由邦议会发的许可证，西尔米卡尔维克冰川游客中心是冰川徒步和冰洞游览的起点。冰盖北面外海的西尔米乌维特群岛也划归冰盖管理区，西尔米乌维特冰山观测站在那里记录从冰川上崩落入海的冰山。\n老向导能从冰的颜色读出它的年纪：越蓝的冰越老、越密。西尔米卡尔维克的工匠每年入冬用冰盖边缘采来的冰块砌起一座冰旅馆，墙、床和酒杯都是冰做的，到了春天整座旅馆慢慢化回水里，下一个冬天再从头砌起。游客最喜欢的纪念是一杯用冰盖古冰泡的茶，冰块在杯里化开时噼啪作响，那是封在冰里的古老空气在释放。向导带客人上冰前总要叮嘱一句：「冰盖不欠你什么，路要自己看。」"
      en: "The Sirmi Ice Cap covers the Sirmi Highlands in the north-east of the territory. At about 29,500 km² it is the largest ice cap in the world and the largest glacier in the territory; next after it comes the Kallaaqsirmi Icefield on Pirrukrjuaq Island out in the northern sea, about 24,800 km². The cap has a mean height of about 1,950 m, and Mount Sirmi, rising from the ice to 4,014 m and standing more than 1,500 m above the surrounding surface, is the highest peak in the territory; Sirmikatiq Col on the edge of the cap, at 2,102 m, is the territory's highest named pass. Most of the cap lies in the Sirmi Ice Cap Administration Zone of the Free State of Sirmivak, and its south-western edge reaches into the Ukkuliit Mining Administration Zone of Qaurniq City. Its Tavrunaq name, Sirmitavru, joins sirmi, \"ice\", and tavru, \"land\": simply \"the land of ice\".\nThe cap is an immense shell of ice pressing down on the highlands, thickest in the middle and falling gently towards its edges, where tongues of ice reach out and blue-green meltwater lakes gather in front of them in summer. The territory's snowline lies at about 1,250 m, and nearly all of the cap is above it: the snow that falls in winter does not all melt in summer, and year after year it is packed into ice, which is how the cap was built up. The meltwater comes together at the southern edge as the Sirmi River, which flows south to the sea and is the longest river in the territory. The surface is cold all year, a cold wind pours down from the high centre and seldom drops, and in the polar night almost no one is out on the ice. The administration zone covers 72,600 km² but has only some 1,700 residents, most of them scientists, guides and the staff who keep the airfield and roads running.\nThe Sirmi Ice Core Station lies deep on the cap and is reached by air only in summer. Its scientists drill long cores from the ice and read past climates from them section by section, each layer holding the snow that fell that year and the air of that year. The Sillua Expressway follows the eastern edge of the cap on bedrock without going onto the ice, and the observatories and stations of Tauvvaniq District are scattered across the uplands to the east. Glacier guides, hunters and prospectors going onto the cap need a licence from the Free State parliament, and the Sirmiqarvik Glacier Visitor Centre is the starting point for glacier walks and ice-cave tours. The Sirmiuviit Islands in the sea to the north also belong to the administration zone, where the Sirmiuviit Iceberg Station records the icebergs that calve from the glaciers into the sea.\nOld guides can tell the age of ice from its colour: the bluer it is, the older and denser. Each winter the craftsmen of Sirmiqarvik build an ice hotel from blocks cut at the edge of the cap, with walls, beds and glasses all made of ice; in spring the whole hotel slowly melts back into water, and the next winter they build it again from scratch. Visitors' favourite souvenir is tea made with ancient ice from the cap, which crackles as it melts in the cup: the old air sealed in the ice escaping. Before taking guests onto the ice, guides always warn them: \"The ice cap owes you nothing; watch your own path.\""

  # ── 伊卢克帕卡群岛的山峰（M117）─────────────
  - id: nat_zjjsna
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [316.2, 408.8] }
    names: { zh: 卡鲁克皮鲁克峰, en: Mount Karuqpirruk, art-x-tavrunaq: Karuqpirruk }
    notes: { zh: "卡鲁克山的主峰，海拔 1313 米，在帕卡尔尤阿克岛东部，是伊卢克帕卡区和伊卢克帕卡群岛的最高点，比西边的伊卢克皮鲁克峰高出近 180 米，峰顶一带积着约 320 平方公里的小冰帽，是群岛上唯一终年不化的冰。峰名意为「熊峰」，冬天母熊在背风山坡的厚雪里挖洞产仔。群岛没有公路，登顶的多是夏天上岛的探矿队员和科考队员；猎人们说，上这座山之前，得先问问熊答不答应。", en: "The summit of the Karuq Mountains, 1,313 m, in the east of Pakkarjuaq Island and the highest point of Illuqpakka District and the Illuqpakka Islands, nearly 180 m higher than Mount Illuqpirruk to the west; a small ice cap of about 320 km² lies around the summit, the only ice in the islands that never melts. The name means \"bear peak\", and in winter mother bears dig dens to give birth in the deep snow of its sheltered slopes. There are no roads in the islands, and most of those who reach the top are prospectors and research teams who come over in summer; the hunters say that before you climb this mountain you had better ask the bears." }
  - id: nat_zmpp2r
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [261.2, 395.2] }
    names: { zh: 伊卢克皮鲁克峰, en: Mount Illuqpirruk, art-x-tavrunaq: Illuqpirruk }
    notes: { zh: "帕卡尔尤伊特山的最高峰，海拔 1134 米，在帕卡尔尤阿克岛中部，是伊卢克帕卡群岛仅次于卡鲁克皮鲁克峰的第二高峰，东西两侧各隔着一道山口。峰名由 illuq「湖」和 pirruk「峰」合成，意为「湖峰」：晴天站在峰顶，四面八方都是亮闪闪的湖。峰顶有一座老石堆，村里的孩子第一次登顶都要往上添一块石头，再试着数一数脚下的湖，至今没有谁数完过，老人说「数到一半，太阳就转到背后去了」。", en: "The highest summit of the Pakkarjuit Mountains, 1,134 m, in the middle of Pakkarjuaq Island and the second highest peak of the Illuqpakka Islands after Mount Karuqpirruk, with a col on either side. The name joins illuq, \"lake\", and pirruk, \"peak\": \"lake peak\", for on a clear day the summit looks out on shining lakes in every direction. An old cairn stands on top, and every village child who climbs it for the first time adds a stone and then tries to count the lakes below; no one has ever finished, and the old say \"by the time you're halfway, the sun has gone round behind you\"." }
  - id: nat_k01txd
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [248.8, 388.8] }
    names: { zh: 图恩皮鲁克峰, en: Mount Tuunpirruk, art-x-tavrunaq: Tuunpirruk }
    notes: { zh: "帕卡尔尤伊特山西端的山峰，海拔 959 米，与东面的伊卢克皮鲁克峰隔着一道海拔约 640 米的山口。峰名由 tuun「石」和 pirruk「峰」合成，意为「石峰」：峰顶裸露着大片浅色岩石，秋天这里最早落雪，春天最晚化雪。群岛没有公路，从湖边走到峰顶要大半天。岛西部的渔民在湖上远远望见它变白，就知道该把船拖上岸、把雪橇从棚里拉出来了。", en: "The peak at the western end of the Pakkarjuit Mountains, 959 m, separated from Mount Illuqpirruk to the east by a col at about 640 m. The name joins tuun, \"stone\", and pirruk, \"peak\": \"stone peak\". Its rock is pale, and it is the first place to take the snow in autumn and the last to lose it in spring. There are no roads in the islands, and the walk from the lakeshore to the top takes the better part of a day. When the fishermen of the west of the island see it turn white from out on the lakes, they know it is time to haul the boats ashore and bring the sledges out of the shed." }
  - id: nat_pk53sg
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [273.8, 398.8] }
    names: { zh: 乌瓦克皮鲁克峰, en: Mount Uvvaakpirruk, art-x-tavrunaq: Uvvaakpirruk }
    notes: { zh: "帕卡尔尤伊特山东端的山峰，海拔 923 米，与西面的伊卢克皮鲁克峰隔着一道海拔约 690 米的山口。峰名由 uvvaak「海象」和 pirruk「峰」合成，意为「海象峰」：山顶浑圆，从北面的湖上望去像一头趴在冰上的海象，峰顶垂下的两道白色石英脉正好是一对獠牙。群岛没有公路，夏天登山要先划船到山脚。再往东越过五十多公里的湖沼低地，就是卡鲁克山。", en: "The peak at the eastern end of the Pakkarjuit Mountains, 923 m, separated from Mount Illuqpirruk to the west by a col at about 690 m. The name joins uvvaak, \"walrus\", and pirruk, \"peak\": \"walrus peak\". Its top is rounded, and seen from the lakes to the north it looks like a walrus lying on the ice, two white veins of quartz running down from the summit for its tusks. There are no roads in the islands, and in summer climbers must first row to the foot of the mountain. More than fifty kilometres further east, across the lake-strewn lowland, rise the Karuq Mountains." }

  # ── Peaks, passes and glaciers named in M29 ─────────────
  - id: nat_c28dp2
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [503.2, 236.8] }
    names: { zh: 西尔米峰, en: "Mount Sirmi", art-x-tavrunaq: Sirmipirruk }
    notes:
      zh: "西尔米高地的最高峰，海拔 4014 米，是领地最高峰。西尔米冰盖大多是一片平缓起伏的白色高原，西尔米峰却从冰面上陡然拔起一千五百多米，是一座通体裹着冰雪的金字塔形尖峰，晴天时从冰盖边缘一百多公里外都能望见。西卢阿高速在约 60 公里外经过，登顶要先长途穿越冰盖，再沿冰壁攀上峰顶。登顶的科考队说，站在领地最高处，四周是一望无际的白色冰原，脚下的峰顶却只有一张桌子那么大，「上来很难，找到它倒很容易」。"
      en: "The highest point of the Sirmi Highlands, 4,014 m and the highest peak in the territory. Most of the Sirmi Ice Cap is a gently rolling white plateau, but Mount Sirmi rises steeply more than 1,500 m out of the ice, a pyramid sheathed in ice and snow from foot to summit that can be seen on clear days from more than 100 km away at the edge of the cap. The Sillua Expressway passes some 60 km away, and reaching the top means a long crossing of the ice cap and then a climb up its ice walls. Teams who have reached it say that from the territory's highest point there is endless white ice in every direction, while the summit underfoot is no bigger than a table: \"it's hard to get up, but at least it's easy to find\"."
  - id: nat_scswkr
