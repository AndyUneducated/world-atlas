# Mountain landforms of the Arctic Ocean Territory: peaks, passes and glaciers, found in the
# terrain by the generator (pipeline/atlas/relief.py) and named by `detect: {kind, at_km}`.
features:
  - id: nat_aqrt62
    subtype: glacier
    status: generated
    detect: { kind: glacier, at_km: [470, 228] }
    names:
      zh: 西尔米冰盖
      en: Sirmi Ice Cap
      art-x-tavrunaq: Sirmitavru
    notes:
      zh: 覆盖西尔米高地的冰盖，面积约 2.95 万平方公里，是领地最大的冰川，平均海拔近 1900 米，大部分在西尔米冰盖管理区，西南缘伸入内陆矿区。冰盖深处的冰芯钻探站钻取冰芯研究过去的气候；冰原高速沿冰盖东侧外缘修建，不上冰面。
      en: The ice cap over the Sirmi Highlands, about 29,500 km², the largest glacier in the territory, with a mean height of nearly 1,900 m; most of it lies in the Sirmi Ice Cap Administration Zone, its south-western edge reaching into the inland mining zone. The ice core station deep on the cap drills cores to study past climate, and the Icefield Expressway follows its eastern edge without going onto the ice.

  # ── Peaks, passes and glaciers named in M29 ─────────────
  - id: nat_c28dp2
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [499.2, 234.8] }
    names: { zh: 西尔米峰, en: "Mount Sirmi", art-x-tavrunaq: Sirmipirruk }
    notes:
      zh: 西尔米高地的最高峰，海拔 2506 米，是领地最高峰，峰顶埋在西尔米冰盖之下，只是冰面上一处平缓的隆起。冰原高速在约 60 公里外经过，登顶须长途穿越冰盖。
      en: The highest point of the Sirmi Highlands, 2,506 m and the highest peak in the territory, its summit buried under the Sirmi Ice Cap as a gentle swelling of the ice. The Icefield Expressway passes some 60 km away, and reaching the top means a long crossing of the ice cap.
  - id: nat_scswkr
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [426.8, 315.8] }
    names: { zh: 基克皮鲁克峰, en: Mount Kiiqpirruk, art-x-tavrunaq: Kiiqpirruk }
    notes:
      zh: 冰牙岛冰牙山的主峰，海拔 2236 米，是领地第二高峰，峰顶覆盖着冰牙冰帽，尖峭的山形像露出冰面的獠牙，山名由此而来。山峰远在海上，离最近的公路也有近 300 公里。
      en: The summit of the Icefang Mountains on Icefang Island, 2,236 m and the second highest peak in the territory, capped by the Icefang Ice Cap; its sharp shape, like a fang through the ice, gave it its name. It stands far out at sea, nearly 300 km from the nearest road.
  - id: nat_k55z4h
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [451.2, 142.2] }
    names: { zh: 陶武皮鲁克峰, en: Mount Tauvvupirruk, art-x-tavrunaq: Tauvvupirruk }
    notes:
      zh: 千峡山脉的最高峰，海拔 2022 米，是领地第三高峰，在乌库拉克市南岸峡湾生态保护区，苍穹冰川从峰顶向四周流下。冰原高速在约 50 公里外经过。
      en: The highest summit of the Thousand Fjords Range, 2,022 m and the third highest peak in the territory, in the South Fjords Nature Reserve of Ukkulaaq City, with the Skydome Glacier flowing down from it on all sides. The Icefield Expressway passes some 50 km away.
  - id: nat_szhgrt
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [233.8, 137.2] }
    names: { zh: 尼尔萨皮鲁克峰, en: Mount Nirsapirruk, art-x-tavrunaq: Nirsapirruk }
    notes:
      zh: 千峡冰原的最高点，海拔 1950 米，是领地第四高峰，在塔夫鲁利特原住民自治区的驯鹿迁徙生态保护区。驯鹿群每年春秋沿山脚的谷地迁徙，山名由此而来。
      en: The highest point of the Thousand Fjords Icefield, 1,950 m and the fourth highest peak in the territory, in the Reindeer Migration Nature Reserve of the Tavrulit Indigenous Autonomous Region. Reindeer herds migrate along the valleys at its foot every spring and autumn, hence the name.
  - id: nat_bfyxfg
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [377.8, 140.8] }
    names: { zh: 温纳皮鲁克峰, en: Mount Unnapirruk, art-x-tavrunaq: Unnapirruk }
    notes:
      zh: 锂湖区的山峰，海拔 1887 米，是领地第五高峰，峰顶覆盖着极夜冰川。矿区高速在约 40 公里外经过。
      en: A peak in Lithium Lakes District, 1,887 m and the fifth highest in the territory, capped by the Polar Night Glacier. The Mining Expressway passes some 40 km away.
  - id: nat_1jamq7
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [147.8, 132.8] }
    names: { zh: 帕利皮鲁克峰, en: Mount Paalipirruk, art-x-tavrunaq: Paalipirruk }
    notes:
      zh: 萨尔瓦克市西峡区的山峰，海拔 1879 米，峰顶的白冠冰川像一顶白色的冠冕，山名由此而来。南岸高速铁路在约 25 公里外经过。
      en: A peak in West Fjord District of Saarvaq City, 1,879 m, crowned by the Whitecrown Glacier like a white crown, hence the name. The South Coast High-Speed Railway passes some 25 km away.
  - id: nat_dew0ng
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [508.8, 147.2] }
    names: { zh: 皮瓦皮鲁克峰, en: Mount Pivapirruk, art-x-tavrunaq: Pivapirruk }
    notes:
      zh: 乌库拉克市东峡区的山峰，海拔 1681 米，俯临东峡区的峡湾村镇，冰原高速在约 30 公里外经过。
      en: A peak in East Fjord District of Ukkulaaq City, 1,681 m, looking down on the fjord villages of the district; the Icefield Expressway passes some 30 km away.
  - id: nat_8n8hxn
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [142.8, 198.8] }
    names: { zh: 普卡皮鲁克峰, en: Mount Pukkapirruk, art-x-tavrunaq: Pukkapirruk }
    notes:
      zh: 西部高原的最高点，海拔 1568 米，在西部高原生态保护区，顶上覆盖着高原冰帽。高原顶四周平坦，冰帽从这里向四面铺开。
      en: The highest point of the Western Plateau, 1,568 m, in the Western Plateau Nature Reserve, capped by the Plateau Ice Cap. The ground around it is flat, and the ice cap spreads out from here on all sides.
  - id: nat_efvm12
    subtype: pass
    status: generated
    detect: { kind: pass, at_km: [342.2, 140.2] }
    names: { zh: 库马卡蒂克山口, en: Qummakatiq Pass, art-x-tavrunaq: Qummakatiq }
    notes:
      zh: 千峡山脉中的山口，海拔 991 米，在首府以北的大湖苔原生态保护区，矿区高速从山口经过。山口因南面的首府穹顶区得名。
      en: A pass in the Thousand Fjords Range, 991 m, in the Great Lakes Tundra Nature Reserve north of the capital, through which the Mining Expressway runs. It is named after Dome District in the capital to the south.
  - id: nat_tkxdfd
    subtype: pass
    status: generated
    detect: { kind: pass, at_km: [404.2, 144.2] }
    names: { zh: 伊卢克卡蒂克山口, en: Illuqkatiq Pass, art-x-tavrunaq: Illuqkatiq }
    notes:
      zh: 锂湖区的山口，海拔 1037 米，内陆矿区重载铁路在山口下方以隧道穿过，免去了重载列车翻越山口的陡坡。
      en: A pass in Lithium Lakes District, 1,037 m; the Inland Mines Heavy-Haul Railway runs beneath it in a tunnel, sparing its heavy trains the climb.
  - id: nat_v3jjph
    subtype: pass
    status: generated
    detect: { kind: pass, at_km: [191.8, 130.2] }
    names: { zh: 萨尔卡蒂克山口, en: Saarkatiq Pass, art-x-tavrunaq: Saarkatiq }
    notes:
      zh: 西峡区的山口，海拔 1052 米，南岸的暖风从这里吹向内陆，山口由此得名。南岸高速铁路在约 12 公里外经过。
      en: A pass in West Fjord District, 1,052 m, through which warm winds from the south coast blow inland, hence the name. The South Coast High-Speed Railway passes some 12 km away.
  - id: nat_ztzv82
    subtype: pass
    status: generated
    detect: { kind: pass, at_km: [470.2, 145.2] }
    names: { zh: 基萨尔卡蒂克山口, en: Qissarkatiq Pass, art-x-tavrunaq: Qissarkatiq }
