# Rivers and lakes of the California Autonomous State. Geometry is produced by the generator
# (see world/generator/us-ca.yaml). Names are Chinese, English and Spanish (es).
features:
  - id: nat_ea84va
    subtype: river
    status: generated
    names:
      zh: 萨克拉钱托河
      en: Sacramoney River
      es: Río Sacradinero
    notes:
      zh: "萨克拉钱托河是自治州北部的大河，长约 430 公里，是全州第二长的河，流域约 15.4 万平方公里。它发源于级联故障山脉，流经雷达克特市，在涂黑区出山，城北的大水库和水坝把它拦住发电，电送往南边的城市；出山后向南穿过萨克拉钱托河谷，经首府以北堤坝区的稻田、核桃园和李子园，在首府南边与圣囤积河汇成三角洲，流进海湾。河在河谷里宽阔平缓，两岸是高高的防洪堤。\n河水在上游被大坝拦住发电，在河谷里被引去种稻，在三角洲被抽去南边，剩下的才流进海湾；河上的每一升水都有主人，主人大多不住在河边。堤坝区的水权在拍卖会上一年一卖，买得起水的是湾区的基金，种地的人只能租水。上游的鲑鱼被大坝挡住，只能在坝下打转。\n冬天河水上涨时，堤坝区的人轮流上堤巡查，打着手电沿防洪堤走上一夜；夏天河谷干热，几个月滴雨不下，水全靠上游水库放下来。春天稻田放水时，从飞机上看下去，河谷里一块块水田像铺开的镜子。首府的人爱在傍晚沿河散步，冬天浓雾从三角洲漫上来，河面和堤岸一起消失在白雾里，散步的人只能听着水声辨认方向。河边的老码头上还有几家卖烤鱼和啤酒的小馆，雾天生意反倒最好。"
      en: "The Sacramoney River is the great river of the north of the state, about 430 km long, the second longest in the state, with a catchment of about 154,000 km². It rises in the Cascading Failure Range and flows through Redacted City, leaving the mountains at Blackout District, where a great reservoir and dam north of the town hold it back to generate power for the cities to the south; it then runs south down the Sacramoney valley, past the rice fields, walnut groves and plum orchards of Levee District north of the capital, and joins the San Hoarding River in a delta south of the capital before flowing into the bay. In the valley it runs broad and slow between high flood levees.\nUpstream its water is dammed for power, in the valley it is diverted for rice and at the delta it is pumped south, and only what is left reaches the bay; every litre in the river has an owner, and most of the owners do not live by it. The water rights of Levee District are auctioned once a year, the buyers who can afford them are Bay Area funds, and the people who farm can only rent the water. Upstream, the salmon are stopped by the dam and can only circle below it.\nIn winter, when the river rises, the people of Levee District take turns patrolling the levees, walking them all night by torchlight; in summer the valley is hot and dry, without a drop of rain for months, and all the water comes down from the reservoirs upstream. In spring, when the rice fields are flooded, the paddies seen from an aeroplane look like mirrors laid out across the valley. People in the capital like to walk along the river in the evening, and in winter, when thick fog creeps up from the delta, the river and its banks vanish together into the white, and walkers find their way by the sound of the water. A few little places on the old riverside quay still sell grilled fish and beer, and they do their best trade on foggy days."
  - id: nat_ezeckp
    subtype: river
    status: generated
    names:
      zh: 圣囤积河
      en: San Hoarding River
      es: Río San Acaparador
    notes:
      zh: "圣囤积河是中央渴谷南半部的河流，长约 670 公里，是自治州最长的河，流域约 10 万平方公里。它发源于中央渴谷南端外的高地，沿谷底一路向北，沿途汇入估值山脉西坡流下的一条条雪水河，流过渴谷区的果园和农田，最后在首府南边的三角洲与萨克拉钱托河汇合，流进海湾。单调领道跨过它的圣囤积河特大桥约 27.6 公里，是全州最长的桥。\n河名来自谷里的水权：上游的农场和基金把河水一段一段地买下来囤着，旱年时河的中段常常整段干涸，下游的人只能看着河床。渴谷区的河水在旱季常常还没流到下游就被抽干，水权的价格涨得比两岸的地价还快；有的基金买下水权后根本不用水，只等旱年高价转手。\n河的下游反倒比中游更像一条河：三角洲附近水道纵横，斯塔克顿的河港通过三角洲的航道连着海湾，驳船运来化肥，运走番茄罐头。中段干涸的年份，谷里的孩子在河床上踢球，球门是两根插在沙里的旧水表；老人说，这条河从来没有真正干过，只是水都锁在别人的账户里。每年春天雪水最大的几天，河水会一路流到三角洲，沿岸的人管这几天叫「解冻期」，基金经理们则管它叫「流动性释放」。"
      en: "The San Hoarding River is the river of the southern Central Thirsty Valley, about 670 km long, the longest in the state, with a catchment of about 100,000 km². It rises in the uplands beyond the valley's southern end and flows north along the valley floor, gathering one snow-fed stream after another off the western slopes of the Sierra Valuation and passing the orchards and farms of Thirsty Valley District, until it joins the Sacramoney River in the delta south of the capital and flows into the bay. The Monotone Road crosses it on the San Hoarding River Bridge, about 27.6 km long and the longest bridge in the state.\nIts name comes from the valley's water rights: farms and funds upstream have bought up the river stretch by stretch and hoard it, and in dry years the middle of the river often runs dry for whole stretches while the people downstream stare at the bed. In Thirsty Valley District the river is often pumped dry in the dry season before it reaches the lower course, and water rights have risen in price faster than the land on either bank; some funds buy water rights without ever using the water, simply waiting to sell them on at a high price in a dry year.\nThe lower river looks more like a river than the middle does: near the delta channels criss-cross, and Stuckton's river port is linked to the bay through the delta waterways, with barges bringing in fertiliser and taking out tinned tomatoes. In the years the middle course runs dry, the valley's children play football on the riverbed with two old water meters stuck in the sand for goalposts; the old people say the river has never truly run dry, it is just that the water is all locked up in other people's accounts. For a few days each spring, when the snowmelt is at its height, the river flows all the way to the delta; people along its banks call these days \"the thaw\", and the fund managers call them \"a liquidity release\"."
  - id: nat_jjj34z
    subtype: lake
    status: generated
    names:
      zh: 塔克斯霍湖
      en: Lake Taxhoe
      es: Lago Taxhoe
    notes:
      zh: "塔克斯霍湖是估值山脉北段的高山深湖，面积约 530 平方公里，在萨克拉钱托市木屋区的东端。湖盆四周雪山环绕，湖水极深，清澈见底，冬天也很少结冰，水色从岸边的浅绿一直过渡到湖心的深蓝。湖岸几乎被富人的木屋和私人码头占满，公众能走到水边的地方只剩几小段。\n湖名来自湖边的避税传统：木屋登记成农业用地，游艇登记成渔船，屋里的酒窖登记成水利设施，湖边的人说这片湖的水是全州唯一不用交税的东西。从首府来湖边要翻过海拔 1510 米的堵车山口，那是唯一的通道；离线领道则沿估值山脉东麓而来，用约 6.2 公里长的塔克斯霍湖特大桥从湖面上跨过，再钻进约 17.8 公里长的木屋隧道。\n冬天雪道开放，山路上堵满了从湾区来的自动驾驶越野车，车里没有司机，乘客在后座睡觉，堵车可以一直堵到春天。每到周五傍晚州议会散会，议员和说客的车一齐开出游说区，去湖边的别墅过周末；湖边的人说，州里一半的法案是在这片湖上的游艇里谈成的，而那些游艇登记的都是渔船。夏天湖水依旧冰凉，敢下水游泳的多是来木屋打工的年轻人，他们说在这片湖里游一圈，是这里唯一不用付钱的享受。"
      en: "Lake Taxhoe is a deep mountain lake in the northern Sierra Valuation, about 530 km² in area, at the eastern end of Chalet District in Sacramoney City. Its basin is ringed by snowy peaks, and its water is very deep and clear to the bottom, seldom freezing even in winter, its colour shading from pale green at the shore to deep blue in the middle. Its shores are almost entirely taken up by the chalets and private jetties of the rich, and only a few short stretches are left where the public can reach the water.\nIts name comes from the lakeside tradition of tax avoidance, chalets registered as farmland, yachts as fishing boats and wine cellars as water-management works; people by the lake say its water is the only thing in the state that pays no tax. From the capital the only way to the lake is over Gridlock Pass at 1,510 metres, while the Offline Road comes up along the eastern foot of the Sierra Valuation, crosses the lake on the Lake Taxhoe Bridge, about 6.2 km long, and then plunges into the Chalet Tunnel, about 17.8 km long.\nIn winter, when the ski runs open, the mountain roads fill with self-driving SUVs from the Bay Area, nobody at the wheel and the passengers asleep in the back, so the jam can last until spring. Every Friday evening, when the legislature rises, the cars of legislators and lobbyists pour out of Lobbyton together for weekends at their lakeside villas; people by the lake say half the state's bills are agreed on yachts on this lake, all of them registered as fishing boats. In summer the water is still icy, and those who dare to swim are mostly the young people who come to work in the chalets, who say a swim in the lake is the only pleasure here that costs nothing."
  - id: nat_m7pm6k
    subtype: lake
    status: generated
    names:
      zh: 清除记录湖
      en: Clear History Lake
      es: Lago Borrar Historial
    notes:
      zh: "清除记录湖是雾帘山脉东边的一个大湖，面积约 190 平方公里，在梅洛特市索诺莫尔区的北部。湖坐落在一片古老的火山地带里，湖盆宽而浅，湖水温暖，养分丰富，夏天长满藻类，湖面常常绿得像一锅浓汤。湖边有温泉和几座老火山，火山早已不再喷发，只留下冒热气的泉眼、黑色的火山岩和山坡上的橡树林。湖的西边隔着山岭是葡萄园和红杉林，来梅洛特品酒的人常把一趟酒庄之旅和湖边的温泉连在一起。\n湖名来自湖边的温泉旅馆：名人和政客来这里「消失几天」，退房时旅馆会替他们清除所有记录。旅馆不登记真名，房间里没有摄像头，结账只收现金，连停车场的车牌识别也会在客人离开后自动删除。\n本地人见惯了戴墨镜、压低帽檐的客人，从不多看一眼；湖边的渔民说，他们一年里见过的名人比电视上还多，可一个也说不出名字。夏天藻类最盛的时候，湖水有一股淡淡的腥味，温泉旅馆便在大堂里点上熏香，宣传册上写着「在这里，连气味都不会留下」。偶尔有记者来湖边蹲守，旅馆会客气地请他们泡个温泉，记者泡完出来，常常发现相机里的照片也不见了。"
      en: "Clear History Lake is a large lake east of the Fogwall Range, about 190 km² in area, in the north of Sonomore District in Merlotte City. It lies in an old volcanic landscape, in a broad, shallow basin, its water warm and rich in nutrients and thick with algae in summer, when the surface often looks green as a thick soup. On its shores are hot springs and several old volcanoes, long since extinct, which have left steaming springs, black volcanic rock and oak woods on the slopes. West of the lake, beyond the ridges, lie vineyards and redwood forest, and people who come to Merlotte to taste wine often combine a tour of the wineries with the hot springs by the lake.\nThe name comes from the lakeside hot-spring hotels where celebrities and politicians come to \"disappear for a few days\"; when they check out, the hotel clears every record of their stay. The hotels do not register real names, have no cameras in the rooms and take only cash, and even the car park's number-plate cameras delete their records automatically once a guest has gone.\nLocals are used to guests in dark glasses with their hats pulled low and never give them a second look; the fishermen on the lake say they see more famous people in a year than on television, and cannot name a single one. In summer, when the algae are at their thickest, the water has a faint fishy smell, so the hotels burn incense in their lobbies, and their brochures say that \"here, not even a smell is left behind\". Now and then reporters come to stake out the lake, and the hotels politely invite them for a soak in the springs; when they come out, the reporters often find the photos on their cameras have gone too."
  - id: nat_2s269s
    subtype: lake
    status: generated
    names:
      zh: 苏打饼海
      en: Saltine Sea
      es: Mar Salado
    notes:
      zh: "苏打饼海是东南荒漠里的一个咸水湖，面积约 950 平方公里，在帕姆斯普林克勒市帝国尘区，喷灌区以东的帝国尘谷里。它不是天然的老湖，而是一次水渠决口灌出来的：从北边引来灌溉帝国尘谷农田的水渠决了口，水流进谷底最低的洼地，积成了这片湖。湖没有出口，靠帝国尘谷农田流下的灌溉余水维持，水里的盐分只进不出。夏天湖面被晒得发烫，浅水处的水温常常比洗澡水还高。\n湖水越来越咸，鱼一批批死去，湖岸退出几公里，露出白花花的湖床，盐壳底下还埋着农田冲下来的农药和化肥，风一吹满天是咸味的尘土，本地人说它尝起来像苏打饼干。尘土飘进城里，帕姆斯普林克勒的医生说，看哮喘的病人一年比一年多。湖边曾经有度假村和游艇俱乐部，如今码头搁在离水几公里远的干地上，栈桥的尽头是一片盐壳。\n冬天候鸟仍然成群飞来，在浅水里觅食，观鸟的人举着望远镜站在死鱼骨铺成的「沙滩」上，鞋底踩下去咔嚓作响。帝国尘区的农场主们为湖水开过很多次会：有人提议从海里引水，有人提议在湖床上铺光伏板，最后的决议是继续观察。湖边的小商店卖一种苏打饼干，包装上印着湖的照片，店主说这是全州唯一一种原料就地取材的零食。"
      en: "The Saltine Sea is a salt lake in the south-eastern desert, about 950 km² in area, in Imperial Dust District of Palm Sprinklers City, in the Imperial Dust valley east of Sprinkler District. It is no ancient natural lake but the product of a canal breach: the canal bringing water from the north to irrigate the fields of the Imperial Dust valley burst its banks, and the water ran into the lowest hollow of the valley floor and pooled there as this lake. It has no outlet and is kept going by the irrigation water draining from the valley's fields, so salt comes in and never leaves. In summer the surface bakes, and in the shallows the water is often warmer than a bath.\nIts water grows ever saltier, its fish die off in waves and its shore has retreated several kilometres, baring a white lake bed with the pesticides and fertiliser washed off the fields buried beneath its salt crust; when the wind blows the sky fills with salty dust, which locals say tastes like saltine crackers. The dust drifts into town, and doctors in Palm Sprinklers say they see more asthma patients every year. There were once resorts and a yacht club on the shore; today the jetty stands on dry ground kilometres from the water, and the end of the pier is a crust of salt.\nMigrating birds still arrive in flocks every winter to feed in the shallows, and birdwatchers stand with their binoculars on a \"beach\" made of dead fish bones that crunch underfoot. The farmers of Imperial Dust District have held many meetings about the lake: some have proposed piping in seawater, others covering the lake bed with solar panels, and the resolution each time has been to keep watching. The little shop on the shore sells a brand of saltine crackers with a photo of the lake on the packet, and its owner says they are the only snack in the state made from local ingredients."
  - id: nat_nc93at
    subtype: lake
    status: generated
    names:
      zh: 垄断湖
      en: Monopoly Lake
      es: Lago Monopolio
    notes:
      zh: "垄断湖是估值山脉东麓的一个古老咸水湖，面积约 190 平方公里，在玛门市雪道区。湖已经存在了很久，没有出口，山上溪水带来的盐分只能留在湖里，湖水又咸又碱，鱼活不下去，水里却有成群的卤虫和小飞虫，养活了来这里歇脚的候鸟。湖底的泉水含钙，和湖水相遇时一点点沉淀，堆成了一根根白色的石灰华柱；湖上的岛是海鸥的繁殖地，每年春天成群的海鸥飞来筑巢。\n湖的取水权被失落天使独家买断，溪水在入湖之前就被截走，湖面因此一年年下降，石灰华柱越露越高，游客们反而更爱来了。雪道区的人说，这片湖本来只属于海鸥，现在归了失落天使，海鸥只是租客。截水的渠道从湖边经过，渠里的水比湖里的清得多。\n湖面下降以后，湖中的岛和岸边连了起来，郊狼可以走过去偷海鸥蛋，鸟类研究员只好每年春天在浅滩上拉起围栏。夏天滑雪小城的游客开车下山，在湖边看日出，石灰华柱在晨光里像一座座白色的城堡；冬天湖边寒风刺骨，只剩下摄影师守着拍雾凇。湖边的游客中心挂着一张水位变化图，图的最下面有人用铅笔加了一行字：「请继续下降，谢谢合作——游客」。"
      en: "Monopoly Lake is an ancient salt lake at the eastern foot of the Sierra Valuation, about 190 km² in area, in Ski District of Mammon City. It has existed for a very long time without an outlet, so the salt brought down by the mountain streams has nowhere to go, and its water is so salty and alkaline that no fish can live in it, though it teems with brine shrimp and tiny flies that feed the migrating birds stopping here. Springs on the lake bed carry calcium, which settles out bit by bit where it meets the lake water and has built up white tufa towers; the islands in the lake are a nesting ground for gulls, which arrive in flocks every spring.\nLost Angeles holds the sole rights to its water, so the streams are taken before they reach the lake, its surface falls year after year, the tufa towers stand ever taller, and the tourists like it all the more. People in Ski District say the lake used to belong only to the gulls; now it belongs to Lost Angeles, and the gulls are merely tenants. The channels that take the water run right past the lake, and the water in them is far clearer than the water in it.\nAs the lake has fallen its islands have joined the shore, letting coyotes walk across to steal gulls' eggs, so the bird researchers have to string fences across the shallows every spring. In summer visitors from the ski town drive down to watch the sunrise from the shore, when the tufa towers look like white castles in the morning light; in winter a bitter wind blows off the lake and only photographers stay, waiting to shoot the hoarfrost. The visitor centre by the lake has a chart of the falling water level, and at the bottom someone has added in pencil: \"Please keep falling. Thank you for your cooperation. — A tourist.\""
