  - id: nat_n225ck
    subtype: river
    status: generated
    detect: { kind: river, at_km: [349.8, 149.2] }
    names:
      zh: 沉没成本河
      en: Sunk Cost River
      es: Río Costo Hundido
    notes:
      zh: "沉没成本河是高原荒漠里的河，长约 390 公里，流域约 3.4 万平方公里，是自治州第三长的河。它发源于荒漠西北角的山地，向东穿过荒漠流入东海岸，沿途是干湖、沙丘、丝兰林和裸露的石山。荒漠里一年只下几场雨，河水大半年断流，河床是一条干涸的沙沟，宽处有几百米，只有暴雨后才突然涨满，洪水夹着泥沙和石块冲下来，一两天后又渗进沙里不见了。\n一家公司曾沿河修了一条运河，准备把荒漠变成农田，钱花完了一半才发现河里没水，可已经花了那么多，就又把另一半也花完了；那条运河现在是越野车道，沿线的抽水站和渡槽至今还立在沙地里，闸门锈死在半开的位置。\n周末的越野车手从城里开来，在运河的水泥渠底飙车，扬起的尘土几公里外都看得见；渠边还立着当年的招商牌，上面画着绿油油的麦田和一条蓝色的大河，牌子已经被晒得褪了色。偶尔一场暴雨过后，河床真的流起水来，附近的人会开车赶来，站在岸边拍照，说「这钱总算没白花」。商学院的老师每年带学生来这里上一课，课后作业只有一道题：如果你是那家公司的老板，在花完第一半钱的那天，你会怎么做？"
      en: "The Sunk Cost River is the river of the high desert, about 390 km long with a catchment of about 34,000 km², the third longest in the state. It rises in the hills at the desert's north-western corner and flows east across the desert to the east coast, past dry lakes, dunes, yucca woodland and bare rocky hills. The desert gets only a few showers a year, so the river is dry for most of it, a sandy wash several hundred metres wide in places that fills suddenly only after a storm, when a flood carrying mud and stones rushes down and then, a day or two later, sinks back into the sand and is gone.\nA company once built a canal along it to turn the desert into farmland, and found when half the money was spent that there was no water in the river; but having spent so much already, it spent the other half too. The canal is now an off-road track, and its pumping stations and aqueducts still stand in the sand along the way, their sluice gates rusted fast half open.\nAt weekends off-road drivers come out from town to race along the canal's concrete bed, raising dust that can be seen kilometres away; beside the canal still stands the old investment hoarding, painted with green wheatfields and a great blue river and now bleached by the sun. Once in a while, after a storm, the riverbed really does run with water, and people nearby drive out to stand on the bank taking photos and saying, \"At least the money wasn't wasted.\" Every year a business-school lecturer brings students here for a class, and the homework afterwards is a single question: if you had run that company, what would you have done on the day the first half of the money ran out?"
  - id: nat_4hbjtr
    subtype: river
    status: generated
    detect: { kind: river, at_km: [328.2, 54.2] }
    names:
      zh: 透支河
      en: Overdraft River
      es: Río Sobregiro
    notes:
      zh: "透支河是东南荒漠的河，长约 360 公里，流域约 3.3 万平方公里，是自治州第四长的河。它发源于付费墙山脉的订阅峰一带，山上冬天的积雪是它最主要的水源，出山后向东南流过荒漠和帝国尘谷，最后流入南海岸。上游的河谷里还有松林和草地，进了荒漠就只剩两岸一线柽柳和芦苇，河床越来越宽，水却越来越浅；冬天暴雨过后，河水会突然涨满，几天后又退成细流。\n帝国尘谷的农场从河里抽水，又从地下抽水，抽得比雨水补回来的多得多，河水一年比一年少，谷底一年比一年低；农场主说这叫「透支」，等下雨就还。谷里的冬季蔬菜运往全州，靠的就是这条河和地下水，而地下水抽走以后，地面跟着下沉，有的井口如今高出地面一大截。入海口一带的湿地也一年比一年小，候鸟只好往别处飞。\n本地人说透支河是全州唯一一条有信用额度的河：额度用完了，就从地下借；地下借完了，就等天上还。帝国尘区的一位老农在自家井口旁边立了一根木杆，每年在上面刻一道线，记下地面又沉了多少，木杆上的刻度已经密得像一把尺子。银行的人来谷里考察过一次，看完那根木杆，回去就提高了农场贷款的利率。"
      en: "The Overdraft River is the river of the south-eastern desert, about 360 km long with a catchment of about 33,000 km², the fourth longest in the state. It rises near Mount Subscription in the Paywall Range, fed above all by the winter snow on the mountain, and after leaving the hills flows south-east across the desert and the Imperial Dust valley to the south coast. In its upper valley there are still pine woods and meadows, but once it enters the desert there is only a thin line of tamarisk and reeds along its banks, and the bed grows ever wider as the water grows ever shallower; after a winter storm the river suddenly runs full, then shrinks back to a trickle within days.\nThe valley's farms pump water from the river and from the ground, far more than the rain puts back, so the river shrinks and the valley floor sinks year after year; the farmers call it an \"overdraft\", to be paid back when it rains. The winter vegetables the valley sends all over the state depend on this river and on groundwater, and as the groundwater is pumped away the land sinks with it, so that some wellheads now stand well clear of the ground. The wetlands at the river's mouth shrink year by year too, and the migrating birds have had to go elsewhere.\nLocals say the Overdraft is the only river in the state with a credit limit: when the limit runs out it borrows from underground, and when the underground runs out it waits for the sky to pay it back. An old farmer in Imperial Dust District has set up a wooden pole by his wellhead and cuts a notch in it every year to record how much further the ground has sunk, and the notches are now as close together as the marks on a ruler. A team from the bank came to look at the valley once, saw the pole, and went home and raised the interest rate on farm loans."
  - id: nat_s3z6zt
    subtype: river
    status: generated
    detect: { kind: river, at_km: [138.8, 419.8] }
    names:
      zh: 流量河
      en: Traffic River
      es: Río Tráfico
    notes:
      zh: "流量河是北部山区的河，长约 220 公里，流域约 1.7 万平方公里。它发源于级联故障山脉，先在火山脚下的高原上缓缓流淌，再折向北，穿过一道道深峡谷，流入北海岸。上游是开阔的草地和沼泽，下游的峡谷两岸是陡峭的山坡和茂密的针叶林，河水清冷湍急，河里有鲑鱼洄游；河口一带是沙洲和潟湖，海狮常在那里等着鲑鱼入河。\n河上原有四座水坝，鲑鱼游不上去，坝下的河水夏天又浅又暖，鱼一年比一年少，下游靠捕鱼为生的人家也一年比一年穷。后来四座水坝全拆了，库区露出的淤泥上重新长出了柳树和野草，鲑鱼回来了，网红也跟着来了：秋天鲑鱼洄游时，河边站满拍视频的人，比鲑鱼还多。\n洄游最盛的那几周，峡谷里的小路堵得像城里的领道，有人架着三脚架在河边一站就是一整天，只为等一条鲑鱼跃出水面的镜头；熊在对岸捕鱼，也被拍成了几百万次播放的短视频。下游的渔民说，鲑鱼回来以后，他们的收入确实涨了，只不过涨的不是卖鱼的钱，而是给网红带路、出租河边站位的钱。拆坝以后，有人往河里扔了一块写着「点赞」的牌子，第二年春汛就把它冲进了大海。"
      en: "The Traffic River is a river of the northern mountains, about 220 km long with a catchment of about 17,000 km². It rises in the Cascading Failure Range, meanders first across the plateau at the foot of the volcanoes and then turns north through one deep canyon after another to the north coast. Its upper reaches are open meadows and marshes, its lower canyons steep slopes under dense conifer forest, its water cold and fast, with salmon running up it; its mouth is a place of sandbars and lagoons, where sea lions often lie in wait for the salmon entering the river.\nIt once had four dams that the salmon could not pass, and below them the river ran shallow and warm in summer, so there were fewer fish every year and the fishing families downstream grew poorer every year. Then all four dams came down, willows and wild grass grew back on the mud left by the old reservoirs, the salmon returned, and so did the influencers: in autumn, when the salmon run, the banks are lined with people filming, more of them than there are fish.\nIn the peak weeks of the run the canyon paths jam like the state roads in town, and some people stand by the river with tripods all day waiting for the shot of a salmon leaping clear of the water; bears fishing on the far bank have become short videos with millions of views. The fishermen downstream say their income really did go up after the salmon came back, only it was not from selling fish but from guiding influencers and renting out spots on the bank. After the dams came down someone threw a sign reading \"Like\" into the river, and the next spring's floods carried it out to sea."
  - id: nat_awj4xs
    subtype: river
    status: generated
    detect: { kind: river, at_km: [231.8, 98.2] }
    names:
      zh: 水泥河
      en: Concrete River
      es: Río de Concreto
    notes:
      zh: "水泥河是失落天使盆地的河，长约 160 公里，流域约 1.1 万平方公里，从边检山脉北端流下，向西穿过盆地流入大海，从出山口到入海口，河槽两边几乎全是城区和立交桥。它本是一条季节河：夏天几乎断流，冬天暴雨一来，山上的水几个小时就冲进盆地，从前常常漫过两岸，淹掉低处的房子。为了防洪，城市把整条河的河床和两岸都浇上了水泥，河道变成一条又宽又直的水泥槽，暴雨时洪水被一口气送进大海。\n一年里大部分时间，水泥槽里只有一线细水，两岸的斜坡涂满了涂鸦，河道常被拿来拍飙车电影，摄制组在槽底一铺就是几公里。市政府一直说要把河「还原成自然」，规划图画了好几版，水泥一块也没拆。暴雨过后的一两天，槽里的水又急又浑，能冲走一辆车，市民这时才想起它是一条河。\n河道两边的堤顶上有自行车道和遛狗的人，桥洞下住着无家可归的人，暴雨预警一响，市里的广播车就沿着堤顶喊他们上来。槽底偶尔有一只白鹭站在那一线细水里，路人会停下来拍照，好像看见了什么稀罕东西。最新一版的「还原规划」是在水泥上画一条蓝色的河，市议会讨论了一年，因为颜料预算超支而搁置。"
      en: "The Concrete River is the river of the Lost Angeles basin, about 160 km long with a catchment of about 11,000 km², coming down from the northern end of the Checkpoint Range and flowing west across the basin to the sea, lined almost entirely with city and flyovers from where it leaves the hills to its mouth. It was a seasonal river, almost dry in summer, while in winter a storm could send the mountain water racing into the basin within hours, often spilling over its banks and flooding the low-lying houses. To stop the floods the city poured concrete over the whole riverbed and both banks, turning it into a wide, straight concrete channel that sends floodwater to the sea in one rush.\nFor most of the year the channel holds only a trickle, its sloping sides covered in graffiti, and it is often used for filming car chases, with film crews spreading out for kilometres along the bottom. The city keeps promising to \"return the river to nature\"; several versions of the plan have been drawn, and not one slab of concrete has come out. For a day or two after a storm the channel runs fast and muddy enough to sweep away a car, and only then do people remember it is a river.\nAlong the tops of the levees run cycle paths and people walking dogs, and homeless people live under the bridges; when a storm warning sounds, the city's loudspeaker vans drive along the levees calling them up. Now and then an egret stands in the trickle at the bottom of the channel, and passers-by stop to photograph it as if they had seen something rare. The latest version of the \"restoration plan\" is to paint a blue river on the concrete; the city council debated it for a year and shelved it when the paint budget overran."
  - id: nat_xhbbde
    subtype: river
    status: generated
    detect: { kind: river, at_km: [60.2, 390.8] }
    names:
      zh: 滑头河
      en: Slippery River
      es: Río Resbaloso
    notes:
      zh: "滑头河是红木林里的河，长约 140 公里，流域约 1.2 万平方公里，在陡峭松软的山谷里向西北流，在谦卑湾以北入海。流域的山坡由松散破碎的岩层构成，雨季从海上来的暴雨一场接一场，山坡吸饱了水就整片往下滑，泥沙多得河水常年浑黄。河谷两岸是高大的红杉林，林下潮湿阴暗，长满了蕨类和苔藓。\n沿河的公路年年被冲断，修路的承包商年年中标；本地人说河滑，承包商更滑。绿雾领道从谦卑湾区向东，穿过红杉林和滑头河的河谷，翻山去雷达克特的涂黑区，滑坡的路段每年都由同一家承包商抢修，他们在路边立了一块牌子：「感谢您的耐心，我们明年还会再来。」\n河口一带的泥沙在海里堆出一片浑黄的扇面，渔船进出要绕开浅滩。每年雨季过后，沿河的居民都要开车出去看看路还在不在，有一户人家门前的路已经往河边挪了三次，他家的信箱也跟着搬了三次。承包商的工程车在河谷里停得太久，有人在车门上贴了张纸：「本车已登记为本地居民」。红杉林里的老伐木工说，这条河其实很老实，它只是把山一点一点地搬进海里，滑头的是那些每年都来算账的人。"
      en: "The Slippery River is a river of the redwood country, about 140 km long with a catchment of about 12,000 km², flowing north-west through steep, crumbling valleys to the sea north of Humbled Bay. The slopes of its basin are made of loose, broken rock, and in the rainy season storm after storm rolls in from the sea; once the hillsides are saturated, whole slopes slide downhill, and the river carries so much silt that its water is yellow all year. Tall redwood forest lines both sides of the valley, damp and dark beneath, carpeted with ferns and moss.\nThe road along it is washed out every year and the same contractor wins the repair contract every year; locals say the river is slippery, and the contractor more so. The Green Haze Road runs east from Humbled Bay District through the redwoods and the valley of the Slippery River and over the mountains to Blackout District in Redacted, and every year the same contractor repairs its landslips, having put up a sign by the road: \"Thank you for your patience. We'll be back next year.\"\nAt the river's mouth the silt has built a muddy yellow fan out into the sea, and fishing boats have to steer round the shallows. After every rainy season the people along the river drive out to see whether the road is still there; outside one family's house the road has moved towards the river three times, and their mailbox has moved with it three times. The contractor's works vehicles stay in the valley so long that someone stuck a note on one door: \"This vehicle is now registered as a local resident.\" The old loggers of the redwoods say the river itself is honest enough, only carrying the mountains into the sea bit by bit; the slippery ones are those who come every year to present the bill."
  - id: nat_bmg2a3
    subtype: river
    status: generated
    detect: { kind: river, at_km: [262.8, 228.2] }
    names:
      zh: 挪用河
      en: Diverted River
      es: Río Desviado
    notes:
      zh: "挪用河是坏账谷的河，长约 140 公里，流域约 1.2 万平方公里，在玛门市境内。它汇集估值山脉东坡的雪水，一条条短促的溪流从陡崖上冲下来，在谷底汇成一条河，沿谷底向北流到东海岸；河两岸长着柳树和白杨，是荒漠里难得的一线绿色。估值山脉挡住了海上的雨，谷里本身极少下雨，河水几乎全靠山上的积雪，春末夏初融雪时最满，到了秋天就细成一条线。\n失落天使很早就买下了谷里的水权，修了一条几百公里长的引水渠，把河水整条「挪用」到城里去，渠道沿着山脚一路向南，有一段要靠虹吸管把水送过山谷，谷里的湖干成了盐碱滩，农场一个个荒废。法院后来判了一部分水要还回来，失落天使还了，按的是法院判决书上的最低值。\n干掉的湖床如今白茫茫一片，风大的日子盐碱尘卷上半空，谷里的人出门要戴口罩。引水渠的闸门口立着一块牌子，写着「本渠水源：挪用河」，谷里的老人说，至少失落天使在这件事上很诚实。每年春天融雪最大的那几天，渠里装不下的水会漫回河道，谷里的孩子们跑到河边去看「河回家了」，大人们则抓紧时间给果树浇一次水。"
      en: "The Diverted River is the river of Bad Debt Valley, about 140 km long with a catchment of about 12,000 km², in Mammon City. It gathers the snowmelt off the eastern slopes of the Sierra Valuation, where short, steep streams tumble down the escarpment and join on the valley floor, and runs north along the valley to the east coast, its banks lined with willows and poplars, a rare strip of green in the desert. The Sierra Valuation keeps the sea rain out and the valley itself sees hardly any, so the river lives almost entirely on mountain snow, running fullest at the end of spring and the start of summer and shrinking to a thread by autumn.\nLost Angeles bought up the valley's water rights long ago and built an aqueduct hundreds of kilometres long to divert the whole river to the city, running south along the foot of the mountains and carrying the water across one valley in a siphon; the valley's lake dried into an alkali flat and its farms were abandoned one by one. A court later ordered part of the water returned, and Lost Angeles returned it, at the lowest figure in the judgment.\nThe dry lake bed is now a sheet of white, and on windy days alkali dust whirls up into the sky, so people in the valley wear masks when they go out. At the aqueduct's intake gate stands a sign reading \"Source of this aqueduct: Diverted River\", and the valley's old people say that on this point, at least, Lost Angeles is honest. For a few days each spring, when the melt is at its height, the water the aqueduct cannot hold spills back into the riverbed, and the valley's children run down to the bank to see \"the river come home\" while the adults hurry to give their fruit trees a drink."
  - id: nat_3w6ah5
    subtype: river
    status: generated
    detect: { kind: river, at_km: [181.8, 377.8] }
    names:
      zh: 深坑河
      en: Pitfall River
      es: Río Trampa
    notes:
      zh: "深坑河是东北部火山高原上的河，长约 130 公里，流域约 1.2 万平方公里，在雷达克特市的熔岩高原区。它从重启峰脚下熔岩台地里的大泉涌出，泉水是渗进熔岩的雨雪在地下流了很久才冒出来的，水温常年冰凉，水色清澈，河因此在旱季也不断流。河水向东北穿过熔岩高原，流入东海岸，沿途是松林、牧场和一片片黑色的熔岩流。河里有冷水鳟鱼，钓鱼的人在泉口下游一字排开。\n河谷两侧到处是熔岩管和塌陷坑：熔岩冷却时外壳先凝固，里面的岩浆流走，留下一条条空心的管道，管道顶塌下来就成了坑，最大的塌陷坑能装下一整座谷仓。徒步的人一不小心就掉下去，牧场主的牛也偶尔失踪。保险公司因此不再承保这一带的房子，房价一落千丈，于是搬来了一大批「数字游民」，他们只要有卫星网络就行。\n数字游民们把熔岩管当成天然的冷藏室和机房，在洞口挂上门帘，夏天钻进去开视频会议；有人在塌陷坑边上搭了木平台，挂出「深坑共享办公」的招牌。熔岩高原区的老牧场主看不懂这些新邻居，说他们掉进坑里时，第一件事不是呼救，而是先看看手机还有没有信号。镇上的五金店如今卖得最好的东西是绳梯和头灯。"
      en: "The Pitfall River is a river of the volcanic plateau in the north-east, about 130 km long with a catchment of about 12,000 km², in Lava Plateau District of Redacted City. It wells up from great springs in the lava tablelands below Mount Reboot, water from rain and snow that has seeped into the lava and flowed underground for a long time before re-emerging, cold and clear all year, so the river keeps running even in the dry season. It flows north-east across the lava plateau to the east coast, past pine woods, pastures and one black lava flow after another. Cold-water trout live in it, and anglers line up along the bank below the springs.\nThe valley sides are riddled with lava tubes and sinkholes: when lava cools, its crust hardens first and the molten rock inside drains away, leaving hollow tubes, and where a tube's roof collapses a sinkhole forms, the biggest of them large enough to swallow a whole barn. Unwary hikers fall into them, and the ranchers' cattle disappear now and then. Insurers have therefore stopped covering houses in the area, prices have collapsed, and so it has drawn a crowd of \"digital nomads\", who need nothing but satellite internet.\nThe nomads use the lava tubes as natural cold stores and server rooms, hanging curtains across the entrances and crawling inside for video calls in summer; one has built a timber deck on the edge of a sinkhole and hung out a sign for \"Pitfall Coworking\". The old ranchers of Lava Plateau District cannot make sense of their new neighbours, and say that when one of them falls into a hole, the first thing they do is not shout for help but check whether their phone still has a signal. The best sellers in the town's hardware shop these days are rope ladders and head torches."
