# Rivers and lakes of the Arctic Ocean Territory. River geometry is traced by the generator from
# the drainage (named_rivers in world/generator/cn-ao.yaml); lakes are placed by hydrology.lakes.
features:
  - id: nat_g8qz1t
    subtype: river
    status: generated
    names:
      zh: 基卢克图阿尔河
      en: Kiluktuar River
      art-x-tavrunaq: Kiluktuar
    notes:
      zh: "基卢克图阿尔河是北岸的大河，长约 376 公里，在领地河流中排第三，流域面积约 8.5 万平方公里，居领地第二，仅次于西尔米河，基卢克图阿尔原住民自治区因它得名，「基卢克图阿尔」在塔夫鲁纳克语里就是「大河」。河流发源于苏瓦尔尤伊特山脉北麓，苏瓦西尔米冰原的融水也汇入其中，流经塔夫鲁利特原住民自治区的尼尔萨瓦克区和基卢克图阿尔的帕基卢克区，向北流向北岸，在基卢基亚克区入海，河口的三角洲划为湿地保护区。河谷是内陆与南北两岸之间的交通走廊：努基高速沿内陆北上到达北岸，尼尔萨瓦克高速横穿三角洲，阿卡皮图克公路穿过三角洲湿地通往阿卡尼克。自治区首府基卢基亚克区建在大河入海处的低地上，最高处海拔只有 41 米。\n春末大河开冰的那几天，河岸上站满了人，冰块挤压的轰鸣声隔着几公里都听得见，老人们会念一句：「Sirmi pakka, kiluk sigga」，意思是「冰破了，河就是新的」，开冰日也被当作新一年的开始。开冰之前，城里每年都有一场竞猜：大家在冰面中央立一根木桩，猜它哪一天、哪一刻随冰沉下，猜中的人能赢得一整年的鲜鱼。"
      en: "The Kiluktuar River is the great river of the north coast, about 376 km long, third among the territory's rivers, with a basin of some 85,000 km², second in the territory after the Sirmi River; it gives the Kiluktuar Indigenous Autonomous Region its name, Kiluktuar meaning \"great river\" in Tavrunaq. It rises on the northern side of the Suvvarjuit Mountains, is joined by meltwater from the Suvvasirmi Icefield, and flows north through the Nirsavaq District of the Tavrulit Indigenous Autonomous Region and Kiluktuar's Paakiluk District to reach the sea at Kilukkiaq District, where its delta is protected as a wetland reserve. Its valley is the corridor between the inland and both coasts: the Nuqattaaq–Kiluktuar Expressway runs north across the interior to the north coast, the Nirsavaq Expressway crosses the delta, and the Aqqapituk Road runs through the delta wetlands to Aqqanik. Kilukkiaq, the region's capital, is built on the low ground where the river meets the sea, its highest point only 41 m above sea level.\nIn the late-spring days when the river breaks up, the banks are crowded and the grinding of the ice can be heard kilometres away, and the elders say \"Sirmi pakka, kiluk sigga\": when the ice breaks the river is new again; break-up day is taken as the start of a new year. Before it comes the town holds its yearly sweepstake: a wooden stake is set up in the middle of the ice, and everyone guesses the day and the minute it will go down with the ice; whoever guesses right wins a whole year's fresh fish."
  - id: nat_xdztvm
    subtype: lake
    status: generated
    names:
      zh: 伊卢尔尤阿克湖
      en: Illurjuaq Lake
      art-x-tavrunaq: Illurjuaq
    notes:
      zh: "伊卢尔尤阿克湖是考尔尼克市伊卢克图克生态保护区的大湖，面积约 2100 平方公里，是领地最大的湖泊，湖名里的 -rjuaq 在塔夫鲁纳克语里意为「大」。伊卢克图克生态保护区面积约 3.5 万平方公里，常住约 5500 人，是首府以北的大湖苔原，湖沼星罗棋布，乌库利特高速和乌库利特真空磁悬浮重载铁路都从保护区里穿过，重载铁路在这里建有约 18 公里长的伊卢克图克防雪棚。从考卢尤阿克区出发的考卢尤阿克—伊卢克图克公路以长约 17 公里的伊卢尔尤阿克湖特大桥跨过湖面，这是一条市道；冬季湖面封冻后，冰上还开辟有雪地车道。考卢尤阿克区是考尔尼克的城区，有 23 万人，内陆钻石矿的原石就在那里切割、抛光和分级。\n冬天湖冰结得一米多厚，冰上的道路连起湖边的村子，夏天冰一化，那些路就沉进了湖里，只剩大桥还横在水面上。湖边的人家每年秋天都要等冰「长」到够厚，才敢把雪地车开上去，老人拿冰镐敲一敲，听声音就知道能不能走。夏天湖上起风时浪头不小，渔民说伊卢尔尤阿克湖「脾气像海」，出湖打鱼也要先看天色。"
      en: "Illurjuaq Lake is the great lake of the Illuqtuuq Nature Reserve in Qaurniq City, about 2,100 km², the largest lake in the territory; the -rjuaq in its name is Tavrunaq for \"great\". The Illuqtuuq Nature Reserve covers about 35,000 km² with some 5,500 residents, a country of great lakes and tundra north of the capital dotted with lakes and marshes, crossed by the Ukkuliit Expressway and the Ukkuliit Vacuum Maglev Heavy-Haul Railway, which has its 18 km Illuqtuuq Snow Shed here. The Qaulujjuaq–Illuqtuuq Road, a city road from Qaulujjuaq District, crosses the lake on the 17 km Illurjuaq Lake Bridge, and when the lake freezes in winter snowmobile tracks are marked out on the ice. Qaulujjuaq is the city proper of Qaurniq, with 230,000 people, where rough stones from the inland diamond mine are cut, polished and graded.\nIn winter the ice is over a metre thick and roads across it link the lakeside villages; when the ice melts in summer those roads sink into the lake, leaving only the bridge across the water. Every autumn lakeside families wait for the ice to \"grow\" thick enough before they dare drive a snowmobile onto it, and the old people tap it with an ice axe and can tell by the sound whether it will bear. When the wind gets up in summer the waves are no small matter, and fishermen say Illurjuaq Lake \"has the temper of the sea\": before going out to fish you look at the sky first."
  - id: nat_16pp3d
    subtype: lake
    status: generated
    names:
      zh: 伊卢考湖
      en: Illuqqau Lake
      art-x-tavrunaq: Illuqqau
    notes:
      zh: "伊卢考湖是考尔尼克市伊卢克萨特区的盐湖，面积约 320 平方公里，湖水含锂，伊卢克萨特提锂厂从湖中的卤水提取锂，产品供应电池工厂，伊卢克萨特区也因这片湖得名。湖周是苔原与大小湖泊相连的低地，南面温纳西尔米冰川的融水注入这一带的湖泊。乌库利特高速和乌库利特真空磁悬浮重载铁路都在约 11 公里外经过，重载铁路在伊卢克萨特设有货运站；考伊公路在湖泊之间的冰碛垄上修建，跨过湖间的窄处，把努基高速和乌库利特高速连成一张网。伊卢克萨特区约 8.3 万人，提锂和矿业运输是主要的生计，区里的伊卢克卡蒂克山口海拔 1037 米，夏天驯鹿在山口的苔原上吃草。\n夏天的阳光下，湖边的卤水池呈现深浅不一的蓝绿色，从飞机上看像一块调色板，乘客常常趴在舷窗上拍照。冬天卤水池结冰停产，提锂厂的工人们转去室内的精制车间，等到春天冰化再重新开池；开池那天，老工人会往第一个池子里撒一把盐，算是给湖打个招呼。湖水咸，本地人开玩笑说伊卢考湖「只养锂，不养鱼」，想钓鱼得开车去冰川脚下的淡水湖。区里的孩子在学校里认识的第一个化学元素，往往就是锂。"
      en: "Illuqqau Lake is the salt lake of Illuqsaat District in Qaurniq City, about 320 km², whose brine is rich in lithium; the Illuqsaat Brine Works extracts it for battery factories, and the district is named after the lake. Around it lie lowlands where tundra and lakes large and small run into one another, and meltwater from the Unnasirmi Glacier to the south feeds the lakes of the area. The Ukkuliit Expressway and the Ukkuliit Vacuum Maglev Heavy-Haul Railway both pass some 11 km away, the railway with a freight station at Illuqsaat; the Qaulujjuaq–Illuqsaat Road is built along the moraine ridges between the lakes and crosses a narrow stretch between them, tying the Nuqattaaq–Kiluktuar and Ukkuliit expressways into one network. Illuqsaat District has about 83,000 people, living mainly from lithium and mine transport, and in summer reindeer graze the tundra of its Illuqkatiq Pass, 1,037 m up.\nIn the summer sun the brine pools by the lake shine in every shade of blue and green, like a painter's palette seen from the air, and passengers often press against the windows to take pictures. In winter the pools freeze and production stops, and the workers move to the indoor refining sheds until the ice melts in spring and the pools reopen; on reopening day the old hands throw a handful of salt into the first pool to greet the lake. The water is salty, and locals joke that Illuqqau Lake \"raises lithium, not fish\": if you want to fish, you drive to the freshwater lakes at the foot of the glacier. The first chemical element the district's children learn at school is very often lithium."
  - id: nat_bzp202
    subtype: lake
    status: generated
    names:
      zh: 尼尔赛卢湖
      en: Nirsaillu Lake
      art-x-tavrunaq: Nirsaillu
    notes:
      zh: "尼尔赛卢湖在塔夫鲁利特原住民自治区的尼尔萨瓦克区，面积约 530 平方公里，是领地第三大湖，仅次于伊卢尔尤阿克湖和伊卢克塔克湖。夏季驯鹿群在湖边饮水和觅食，湖名由此而来，nirsa 在塔夫鲁纳克语里意为驯鹿。湖岸平缓，浅水一直延伸到离岸很远的地方，岸边是开阔的草甸和苔原。尼尔萨瓦克区面积约 3.78 万平方公里，有 16.6 万人，大片苔原是牧场，苏瓦西尔米冰原近一半在区内。努阿高速从首府图维尔尤阿克区向西北穿过尼尔萨瓦克区的牧场通往阿卡尼克，在约 13 公里外经过湖边，高速上长约 9 公里的尼尔赛卢湖特大桥就以湖为名；沿途的石堆路标原样保留，路旁设有观景停车点。\n夏天的傍晚，驯鹿群站在湖边的浅水里避蚊，湖面上倒映着成片的鹿角，牧民说这是「湖里长出的树林」。开车去阿卡尼克的人在观景停车点歇脚时，常有牧民的孩子提着篮子来卖驯鹿肉干和云莓。秋天鹿群离开湖边以后，湖面渐渐封冻，牧民在冰上凿洞下网，渔获就冻在雪里，一直吃到来年春天；老人们说，湖冰封得早的年份，第二年夏天的草一定长得好。"
      en: "Nirsaillu Lake lies in the Nirsavaq District of the Tavrulit Indigenous Autonomous Region, about 530 km², the third largest lake in the territory after Illurjuaq and Illuqtaq lakes. In summer reindeer herds come down to drink and graze on its shores, hence the name, nirsa being Tavrunaq for reindeer. Its shores are gentle, the shallows reaching far out from the bank, with open meadow and tundra along the shore. The Nirsavaq District covers about 37,800 km² with 166,000 people, its wide tundra given over to pasture, and nearly half of the Suvvasirmi Icefield lies within it. The Nuqattaaq–Aqqanik Expressway runs north-west from Tuvvirjuaq District in the capital through the Nirsavaq pastures to Aqqanik, passing some 13 km from the lake, and the expressway's 9 km Nirsaillu Lake Bridge is named after it; the cairns along the way have been left as they were, and there are viewpoint lay-bys by the road.\nOn summer evenings the reindeer stand in the shallows to escape the mosquitoes, their antlers mirrored on the water in a crowd that herders call \"the forest growing in the lake\". When drivers bound for Aqqanik stop at the lay-bys, herders' children often come by with baskets of dried reindeer meat and cloudberries to sell. In autumn, once the herds have left the shore, the lake gradually freezes, and herders cut holes in the ice to set their nets, keeping the catch frozen in the snow to last until the next spring; the old people say that in a year when the lake freezes early, the grass will grow well the following summer."
  - id: nat_2b0688
    subtype: lake
    status: generated
    names:
      zh: 伊卢克塔克湖
      en: Illuqtaq Lake
      art-x-tavrunaq: Illuqtaq
    notes:
      zh: "伊卢克塔克湖在塔夫鲁利特原住民自治区的尼尔萨图维特生态保护区，面积约 660 平方公里，是领地第二大湖，仅次于伊卢尔尤阿克湖。湖身狭长，湖名由此而来。保护区面积约 5.02 万平方公里，是驯鹿迁徙路线所在的地方，常住约 1.7 万人，多为随鹿群迁徙的牧民；驯鹿每年春季回到尼尔萨普库维克产仔地产仔，迁徙时沿湖岸行进，所以湖岸一圈不修道路，只有从阿卡尼克通往保护区的阿卡尼克—尼尔萨图维特公路以长约 9 公里的伊卢克塔克湖特大桥跨过湖区。海拔 1950 米的尼尔萨皮鲁克峰也在保护区内，晴天从湖上能望见它的冰原。\n湖周只有牧民的雪地摩托辙印和驯鹿的蹄印，迁徙季节长长的鹿群沿着湖岸走上好几天，远看像一条移动的褐色河流贴着湖水流淌。牧民在湖边扎营，夜里围着火堆喝驯鹿肉汤，讲哪一年鹿群走得早、哪一年湖冰化得晚；长老们常说「Nirsa pirri, tavru pirri」，驯鹿走的路就是土地的路。冬天湖面冻实以后，牧民凿开冰洞钓北极红点鲑，冻硬的鱼切成薄片，是苔原上最常见的点心。"
      en: "Illuqtaq Lake lies in the Nirsatuvvit Nature Reserve of the Tavrulit Indigenous Autonomous Region, about 660 km², the second largest lake in the territory after Illurjuaq Lake. It is long and narrow, hence the name. The reserve, about 50,200 km², holds the reindeer migration route and has some 17,000 residents, mostly herders who move with the herds; the reindeer return each spring to calve at the Nirsapukkuvik Calving Grounds and follow the lake shores on their migration, so no road runs round the lake, and only the Aqqanik–Nirsatuvvit Road from Aqqanik into the reserve crosses the lake on the 9 km Illuqtaq Lake Bridge. Mount Nirsapirruk, 1,950 m, is also in the reserve, and on clear days its icefield can be seen from the lake.\nAround the lake there are only herders' snowmobile tracks and reindeer hoofprints, and in the migration season long lines of deer walk its shores for days, from afar like a moving brown river flowing beside the water. Herders camp by the lake and at night drink reindeer broth round the fire, talking of the years the herds left early and the years the lake ice melted late; the elders often say \"Nirsa pirri, tavru pirri\": the reindeer's road is the land's road. Once the lake has frozen solid in winter, herders cut holes in the ice to fish for Arctic char, and the fish, frozen hard and sliced thin, is the commonest snack on the tundra."
  - id: nat_3cy7vg
    subtype: lake
    status: generated
    names:
      zh: 西尔米库利克图克湖
      en: Sirmiqulliqtuuq Lake
      art-x-tavrunaq: Sirmiqulliqtuuq
    notes:
      zh: "西尔米库利克图克湖在西尔米瓦克自由邦的陶瓦尼克区，面积约 180 平方公里，由西尔米冰盖的融水汇成，湖水清冷，湖名由此而来，sirmi 在塔夫鲁纳克语里就是「冰」。湖的四周是冰盖退去后留下的碎石和冰碛，只在背风的洼地里长着苔藓和贴地的矮柳。陶瓦尼克区是西尔米冰盖以东的高地，面积 3.5 万平方公里，只有 7.8 万人，以科研和卫星遥感为业；冬季连续数月的黑夜和干冷的空气适合天文观测，陶瓦尼克天文台和极光观测站散布在高地上。西卢阿高速在约 5 公里外经过，这条高速在陶瓦尼克区内延伸约 195 公里，陶瓦尼克防雪棚长约 42 公里，沿线不设路灯，以免影响观测。\n湖水冷得连夏天也只有几度，陶瓦尼克天文台的观测员说，夏末夜里湖面平静时，能在水里看见天上的星星。冬天湖面封冻，冰面黑得发亮，极光出现时整片湖像铺开了一面绿色的镜子，观测员下了夜班常绕到湖边站一会儿再回去睡觉，他们给这片湖起了个外号，叫「天文台的第二块镜片」，新来的同事上班第一周总会被领到湖边看一回。这一带的司机都守一条规矩：晚上经过时不开远光灯，有人说这是给天文台面子，也有人说是给星星面子。"
      en: "Sirmiqulliqtuuq Lake lies in Tauvvaniq District of the Free State of Sirmivak, about 180 km², filled by meltwater from the Sirmi Ice Cap, cold and clear, hence the name, sirmi being Tavrunaq for \"ice\". Around it lie the gravel and moraines left by the retreating ice, with moss and creeping dwarf willow only in sheltered hollows. Tauvvaniq District is the upland east of the Sirmi Ice Cap, 35,000 km² with only 78,000 people, who work in research and satellite remote sensing; months of winter darkness and dry, cold air make it good for astronomy, and the Tauvvaniq Observatory and the aurora stations are scattered over the upland. The Sillua Expressway passes some 5 km away; it runs for about 195 km through Tauvvaniq District, including the 42 km Tauvvaniq Snow Shed, with no street lights along it so as not to disturb the observations.\nThe water stays only a few degrees above freezing even in summer, and the observers of the Tauvvaniq Observatory say that on still nights at the end of summer you can see the stars in the water. In winter the lake freezes over, the ice dark and gleaming, and when the aurora appears the whole lake becomes a green mirror; observers coming off the night shift often walk round to the shore to stand a while before going to bed; they have nicknamed the lake \"the observatory's second lens\", and newcomers are always taken down to see it in their first week. Drivers round here keep one rule: no full beam at night when passing, which some say is out of respect for the observatory and others say is out of respect for the stars."
  - id: nat_xvz2c8
    subtype: lake
    status: generated
    names:
      zh: 帕利卢湖
      en: Paalillu Lake
      art-x-tavrunaq: Paalillu
    notes:
      zh: "帕利卢湖在首府的帕利瓦克区，面积约 87 平方公里，是领地命名湖泊中最小的，离努卡塔克环线和努基高速都只有七八公里，是首府居民夏季划船、冬季冰钓的地方，湖名里的 paali 在塔夫鲁纳克语里意为「白」。湖岸平缓，夏天湖边的草地上满是野餐的人家和遛狗的人。帕利瓦克区是首府的城郊区，面积约 2000 平方公里，有 13.5 万人，区内的帕利瓦克垂直农场用人工光照种植蔬菜和浆果，供应首府大部分的新鲜蔬菜，苏瓦基卢克河也流经这里。环线上最长的桥帕利卢湖特大桥长约 11 公里，也以这片湖为名；环线的照明按极夜标准加密，路面埋设融雪管，冬天开车来湖边也不难。\n冬天湖面冻实后，首府人在冰上凿洞钓鱼，冰钓的小帐篷五颜六色地散在湖面上，孩子们则在旁边滑冰，大人们在帐篷里支起小炉子煮咖啡、烤鱼。极夜里湖上每年办一场冰钓比赛，钓到最大一条鱼的人，可以把鱼挂在帐篷门口神气一整天。夏天的永昼里，下了班的人开车来湖边划船，半夜回城时太阳还挂在湖上。首府的小学生秋天常有一堂校外课：上午在垂直农场亲手摘一颗草莓，下午到帕利卢湖边看候鸟成群飞走。"
      en: "Paalillu Lake lies in Paalivaq District of the capital, about 87 km², the smallest of the territory's named lakes, only seven or eight kilometres from the Nuqattaaq Ring Road and the Nuqattaaq–Kiluktuar Expressway; it is where the capital's people go boating in summer and ice fishing in winter, and the paali in its name is Tavrunaq for \"white\". Its shores are gentle, and in summer the grass by the lake is full of families picnicking and people walking their dogs. Paalivaq is the capital's outer district, about 2,000 km² with 135,000 people, where the Paalivaq Vertical Farm grows vegetables and berries under artificial light and supplies most of the capital's fresh vegetables, and the Suvvakiluk River also passes through. The longest bridge on the ring road, the 11 km Paalillu Lake Bridge, is named after the lake; the ring road is lit to polar-night standards and has snow-melting pipes under its surface, so driving out to the lake in winter is easy enough.\nWhen the lake freezes solid in winter, capital folk cut holes in the ice to fish, their small colourful tents scattered across it while children skate alongside and the grown-ups set up little stoves in the tents to brew coffee and grill fish. Every polar night the lake holds an ice-fishing contest, and whoever lands the biggest fish may hang it proudly by the tent door for a whole day. In the midnight sun of summer people drive out after work to go boating, and when they head back to town at midnight the sun is still hanging over the lake. The capital's schoolchildren often have an autumn outing: in the morning they pick a strawberry with their own hands at the vertical farm, and in the afternoon they watch the migrating birds leave in flocks from the shore of Paalillu Lake."

  # ── Rivers named by their mouths ────────────────────────
  - id: nat_23cx58
    subtype: river
    status: generated
    detect: { kind: river, at_km: [590.2, 154.8] }
    names: { zh: 西尔米河, en: "Sirmi River", art-x-tavrunaq: Sirmikiluk }
    wonder:
      zh: 世界最长的极地河流，长约 499 公里
      en: The longest polar river in the world, about 499 km
    notes:
      zh: "西尔米河是领地最长的河流，长约 499 公里，也是世界上最长的极地河流；流域面积约 10.7 万平方公里，是领地最大的流域。河流源自西尔米冰盖的融水，从冰盖南缘流出后向南，先后流经考尔尼克市的乌库利特矿区管理区、西尔米瓦克自由邦的陶瓦尼克区和乌库拉克市的皮瓦苏瓦区，在南岸的峡湾地带注入大海。塔夫鲁纳克语名 Sirmikiluk 由 sirmi「冰」和 kiluk「河」合成，就是「冰河」的意思；领地第三长的河流是北岸带三角洲的基卢克图阿尔河。\n上游靠近冰盖的河段水流湍急，河道在碎石滩上分成许多股，夏天融水最多时漫过整片河滩，冬天则大半冻住，只在冰层下缓缓流动。河的流量随季节变化极大：河面每年封冻半年以上，冰下只剩细细的水流；初夏冰盖开始融化，水位一天天上涨，到盛夏达到顶峰，入秋后又迅速回落。冰川磨碎的细石粉随融水进入河里，使河水在夏天呈现一种奶白色。上游流经的乌库利特矿区管理区常住 3.9 万人，多为轮班的矿工和物流人员，考卢尤阿克钻石矿和乌库利特镍矿都是露天矿。中游穿过冰盖以东的陶瓦尼克高地，这里人烟稀少，以科研和卫星遥感为业，天文台和极光观测站散布在河谷两侧的高处。下游的皮瓦苏瓦区是峡湾地带，7 万人分散在峡湾两岸的村镇，塔夫鲁纳克语母语者占 85%，渔业和峡湾观光是主要生计；西卢阿高速通车以前，这些村镇之间只能乘夏季的渡船往来。\n河两岸是冻土苔原，春天解冻时河冰成块崩裂，冰块在弯道处挤成冰坝，几天后才被上游涌来的水冲开，下游的人管这叫「河翻身」。夏天北极鲑沿河而上，河口的村子在岸边支起木架晾鱼、熏鱼，秋天把熏好的鱼装箱运往首府。矿区的人在上游取水时，按自由邦和领地的规定把用过的水处理干净才能放回河里，下游的渔民说，这条河「从冰里出来是干净的，到海里也得是干净的」。\n夏天冰盖融水最多时，整条河白得像牛奶，本地人管它叫「冰的牛奶」。孩子们第一次看到总要问，河里的水能不能喝，老人们就舀一碗放在岸边，等细石粉沉到碗底，上面便是一层清水，他们说这是冰盖「把奶熬成了水」。河口的渔民还说，看河水的颜色就能知道山里的天气：河水一夜之间变得更白，是冰盖上出了大太阳；河水变清，是山里转冷了。"
      en: "The Sirmi River is the longest river in the territory, about 499 km, and the longest polar river in the world; its basin of some 107,000 km² is also the territory's largest. It rises in the meltwater of the Sirmi Ice Cap and, leaving the southern edge of the cap, flows south through the Ukkuliit Mining Administration Zone of Qaurniq City, Tauvvaniq District in the Free State of Sirmivak and Pivasuvva District in Ukkulaaq City, reaching the sea among the fjords of the south coast. Its Tavrunaq name, Sirmikiluk, joins sirmi, \"ice\", and kiluk, \"river\": simply \"ice river\". The territory's third-longest river is the Kiluktuar on the north coast, with its delta.\nNear the ice cap the upper river runs fast, splitting into many channels across gravel flats; in summer, when the meltwater is at its height, it floods the whole flat, and in winter most of it freezes, moving slowly beneath the ice. Its flow changes enormously with the seasons: the river is frozen over for more than half of each year, leaving only a thin stream under the ice; in early summer the ice cap begins to melt and the water rises day by day to a peak in high summer, falling quickly again in autumn. Fine rock flour ground by the glaciers comes down with the meltwater and turns the river milky white in summer. Upstream it passes through the Ukkuliit Mining Administration Zone, home to 39,000 people, most of them miners and logistics workers on rotation, where the Qaulujjuaq Diamond Mine and Ukkuliit Nickel Mine are both open pits. The middle river crosses the Tauvvaniq uplands east of the cap, a thinly peopled district living by research and satellite remote sensing, with observatories and aurora stations scattered on the heights either side of the valley. The lower river runs through Pivasuvva, a district of fjords where 70,000 people live in villages and towns along both shores, 85% of them Tavrunaq speakers, making their living from fishing and fjord tourism; until the Sillua Expressway opened, these villages could reach each other only by summer ferry.\nPermafrost tundra lines both banks. When the river thaws in spring its ice breaks into slabs that pile up into ice dams at the bends, until a few days later the water surging from upstream bursts them, which people downriver call \"the river turning over\". In summer Arctic char run upriver, the villages at the mouth put up wooden racks on the shore to dry and smoke the fish, and in autumn the smoked fish is packed and shipped to the capital. When the mines take water upstream, the rules of the Free State and the territory require them to clean it before it goes back into the river; the fishermen downstream say the river \"comes out of the ice clean and must reach the sea clean\".\nIn summer, when the ice cap's meltwater is at its height, the whole river runs as white as milk, and locals call it \"the ice's milk\". Children seeing it for the first time always ask whether the water can be drunk, so the old people scoop up a bowl and set it on the bank; once the rock flour has settled, clear water lies on top, and they say the ice cap has \"boiled its milk down to water\". The fishermen at the mouth also say the river's colour tells them the weather up in the hills: if the water turns whiter overnight, the sun is blazing on the ice cap; if it runs clearer, the hills have turned cold."
  - id: nat_y29gc8
    subtype: river
    status: generated
    detect: { kind: river, at_km: [227.8, 228.2] }
    names: { zh: 尼尔萨河, en: "Nirsa River", art-x-tavrunaq: Nirsakiluk }
    notes:
      zh: "尼尔萨河是领地第二长的河流，长约 471 公里，仅次于西尔米河，流域面积约 7.6 万平方公里，「尼尔萨」在塔夫鲁纳克语中意为驯鹿，塔夫鲁纳克语里它叫 Nirsakiluk，就是「驯鹿河」。河流自萨尔瓦克市普拉苏瓦米乌特区的山地向北，苏瓦西尔米冰原的融水也汇入其中，流经塔夫鲁利特原住民自治区的尼尔萨图维特生态保护区和阿卡皮图米乌特区，到阿卡尼克区入海，驯鹿群沿河谷迁徙。尼尔萨图维特生态保护区就是为这条迁徙路线划定的，面积约 5.02 万平方公里，驯鹿每年春季回到保护区里的尼尔萨普库维克产仔地产仔；西卢阿高速和尼尔萨瓦克高速穿过保护区时抬高路堤、加宽涵洞，并在迁徙季节限制夜间车流。河口的阿卡尼克区是自治区首府，有 29.1 万人，长老议事会、文化中心和雪橇赛场都在那里。\n每年春秋，成千上万头驯鹿沿河谷迁徙，过河时整群驯鹿跳进河里游到对岸，牧民在岸边等着清点，谁家的鹿耳朵上剪着什么记号，老牧民隔着河就认得出来。长老们说「Nirsa pirri, tavru pirri」，驯鹿走的路就是土地的路，领地要在河谷里修路架线，涉及迁徙路线的法案都得先经长老议事会同意。冬天河面封冻，下游的人家在冰上凿洞钓鱼，雪橇沿着冰封的河道一直跑到海边。"
      en: "The Nirsa River is the second longest river in the territory, about 471 km, after the Sirmi River, with a basin of some 76,000 km²; nirsa is the Tavrunaq word for reindeer, and in Tavrunaq the river is Nirsakiluk, \"reindeer river\". It flows north from the mountains of Pullasuvvamiut District in Saarvaq City, joined by meltwater from the Suvvasirmi Icefield, through the Nirsatuvvit Nature Reserve and the Aqqapitummiut District of the Tavrulit Indigenous Autonomous Region to the sea in Aqqanik District, and reindeer herds migrate along its valley. The Nirsatuvvit Nature Reserve, about 50,200 km², was drawn for that migration route, and every spring the reindeer return to calve at the Nirsapukkuvik Calving Grounds within it; where the Sillua and Nirsavaq expressways cross the reserve they run on raised embankments with widened culverts and limit night traffic in the migration season. Aqqanik, at the river mouth, is the region's capital, with 291,100 people and the Council of Elders, the cultural centre and the sled race grounds.\nEvery spring and autumn thousands of reindeer migrate along the valley, plunging in to swim across when they reach the river while herders wait on the bank to count them; the old herders can tell from across the river whose deer they are by the marks cut in their ears. The elders say \"Nirsa pirri, tavru pirri\": the reindeer's road is the land's road, and before the territory builds a road or a power line in the valley, any bill touching the migration routes must first have the Council of Elders' consent. In winter the river freezes, families downstream cut holes in the ice to fish, and sleds run along the frozen channel all the way to the sea."
  - id: nat_e9c7y8
    subtype: river
    status: generated
    detect: { kind: river, at_km: [295.2, 250.8] }
    names: { zh: 瓦克基卢克河, en: Vaqkiluk River, art-x-tavrunaq: Vaqkiluk }
    notes:
      zh: "瓦克基卢克河是基卢克图阿尔原住民自治区的河流，长约 201 公里，流域面积约 2 万平方公里，流经帕基卢克区的苔原，在西尔米努卡区附近入海，名字里的 kiluk 在塔夫鲁纳克语里意为「河」。河谷地势平缓，夏天两岸的湿地里落满候鸟，秋天又成群飞走。帕基卢克区面积约 3.1 万平方公里，有 11 万人，沿河是牧场和渔村；下游的西尔米努卡区有 12.7 万人，以船舶与海工装备和港口航运为业，领地海警与破冰船队的基地西尔米努卡破冰船基地就在这里，努基高速和尼尔萨瓦克高速都经过区内。北岸冬季封冻，河面从秋末一直冻到春末，开冰以后渔船才能出河口，冬天则由破冰船为北岸航线开路。\n帕基卢克的渔村会把整条河鱼埋进雪里冷藏，吃的时候再挖出来，冻得硬邦邦的河鲑薄片是这一带冬天最爱吃的东西，配一碗驯鹿肉汤就是一顿饭。夏天渔民在河口下网，孩子们在岸边捡被冲上来的浮木，晒干了留着冬天烧；村里的老人还记得坐狗拉雪橇沿着冰封的河面去西尔米努卡赶集的年月。破冰船每次出港开道，河口的孩子们都沿着岸跑一段为它送行，船员会拉响汽笛回应；老渔民说，听见汽笛声从河口传进村子，就知道冬天真的来了。"
      en: "The Vaqkiluk River is a river of the Kiluktuar Indigenous Autonomous Region, about 201 km long with a basin of some 20,000 km², flowing across the tundra of Paakiluk District to the sea near Sirminuqa District; the kiluk in its name is Tavrunaq for \"river\". Its valley is gentle, and in summer the wetlands along its banks fill with migrating birds that leave again in flocks in autumn. Paakiluk covers about 31,000 km² with 110,000 people, pasture and fishing villages along the rivers; downstream, Sirminuqa District has 127,000 people who work in shipbuilding, offshore equipment and port shipping, and it is home to the Sirminuqa Icebreaker Base of the territory's coast guard and icebreaker fleet, with the Nuqattaaq–Kiluktuar and Nirsavaq expressways both passing through. The north coast freezes in winter and the river stays frozen from late autumn to late spring; only after break-up can the fishing boats leave the river mouth, and in winter the icebreakers clear the north-coast lanes.\nThe fishing villages of Paakiluk bury whole river fish in the snow to keep and dig them out to eat, and slices of char frozen hard are the winter favourite along this river; with a bowl of reindeer broth they make a meal. In summer fishermen set their nets at the mouth, and children gather driftwood washed up on the banks, drying it to burn in winter; the village elders still remember the years when they rode dog sleds down the frozen river to market in Sirminuqa. Whenever an icebreaker leaves to clear the channel, children at the river mouth run along the bank to see it off and the crew answer with the whistle; the old fishermen say that when you hear that whistle carry up from the mouth into the village, you know winter has truly come."
  - id: nat_f9a92v
    subtype: river
    status: generated
    detect: { kind: river, at_km: [328.2, 99.8] }
    names: { zh: 苏瓦基卢克河, en: Suvvakiluk River, art-x-tavrunaq: Suvvakiluk }
    notes:
      zh: "苏瓦基卢克河在首府北面，长约 156 公里，流域面积约 1 万平方公里，发源于塔夫鲁利特原住民自治区的尼尔萨瓦克区，流经首府的帕利瓦克区和苏瓦利克区，注入努卡塔克峡湾。河的上游是尼尔萨瓦克区的牧场苔原，进入首府以后，两岸渐渐变成成排的住宅楼。努卡塔克峡湾长约 79 公里，是领地最长的峡湾，暖流让湾口终年不冻。苏瓦利克区是首府北部的住宅区，有 30 万人，北冰洋大学就在区内，学生和教师让这里比市中心更年轻；帕利瓦克区是首府的城郊，帕利瓦克垂直农场供应首府大部分的新鲜蔬菜，帕利卢湖也在区内。努基高速经过苏瓦利克区，环线和一条地铁也经过区内。\n苏瓦利克区的大学生夏天爱在河边烧烤，永昼里烤到半夜也不用开灯，烤的多半是驯鹿肉肠和熏北极鲑。冬天河面结冰以后，河岸成了首府越野滑雪的一条热门路线，周末一早就有人背着雪板坐地铁过来，沿着河岸一路滑到峡湾边，再去苏瓦利克冰雕园看冰雕；冰雕园用的冰块，就是从峡湾内段采来的。春天开冰时，北冰洋大学冰川学专业的学生会来河边测冰厚、记下开冰的日子，算是一堂野外实习课。"
      en: "The Suvvakiluk River lies north of the capital, about 156 km long with a basin of some 10,000 km², rising in the Nirsavaq District of the Tavrulit Indigenous Autonomous Region and flowing through Paalivaq and Suvvalik districts of the capital into Nuqattaaq Fjord. Its upper course runs through the pastures and tundra of the Nirsavaq District, and once it enters the capital its banks gradually give way to rows of apartment blocks. Nuqattaaq Fjord, about 79 km long, is the longest fjord in the territory, its mouth kept free of ice all year by the warm current. Suvvalik is the capital's northern residential district, home to 300,000 people and to the University of the Arctic Ocean, whose students and staff make it younger than the city centre; Paalivaq is the capital's outer fringe, where the Paalivaq Vertical Farm supplies most of the capital's fresh vegetables and Paalillu Lake also lies. The Nuqattaaq–Kiluktuar Expressway passes through Suvvalik, and the ring road and a metro line also serve the district.\nStudents from Suvvalik like to barbecue by the river in summer, grilling until midnight in the midnight sun without ever needing a lamp, mostly reindeer sausages and smoked Arctic char. When the river freezes in winter its banks become one of the capital's favourite cross-country ski routes: early on weekend mornings people arrive by metro with skis on their shoulders, ski along the banks all the way to the fjord and then go to see the sculptures at the Suvvalik Ice Sculpture Garden, whose ice is cut from the inner fjord. When the river breaks up in spring, glaciology students from the University of the Arctic Ocean come to measure the ice and record the day of break-up as a piece of fieldwork."
  - id: nat_ph9ex7
    subtype: river
    status: generated
    detect: { kind: river, at_km: [85.2, 171.8] }
    names: { zh: 图利基卢克河, en: Tullikiluk River, art-x-tavrunaq: Tullikiluk }
    notes:
      zh: "图利基卢克河是图利瓦克市的河流，长约 131 公里，流域面积约 8600 平方公里，发源于普拉普卡高原，流经图拉卡特区和图利亚利维克区一带入海，是图利亚利维克区的水源。上游在高原上流过冰帽脚下的荒原，下游进入城区以后，水厂的取水口就设在河边。全市 31.5 万人，城区图利亚利维克区有 17.5 万人，西卢阿高速和尼尔萨瓦克高速都从这里出发；图拉卡特区面积约 1.42 万平方公里，峡湾和谷地纵横，海拔 502 米的图拉卡蒂克山口是领地最低的命名山口，冷风从山口沿谷地吹向图拉苏瓦峡湾。河名里的 tulli 意为「冷」，和市名、湾名同出一源：冬季的冷风从高原上吹下来，河谷就是风走的路。\n河水即使在夏天也冰凉刺骨，本地人说用它泡的茶「喝一口就清醒了」。图利瓦克人早就习惯和冷打交道：海上的图卡鲁维特群岛用极地冷空气和海水冷却数据中心，排出的热水送进图利瓦克的游泳馆和温室，本地人说冷风「从山口进城，在数据中心里干活」。夏天河边常有人钓北极红点鲑，冬天河面冻住以后，孩子们沿着河道滑冰，一直滑到入海口的冰面上。"
      en: "The Tullikiluk River is a river of Tullivaq City, about 131 km long with a basin of some 8,600 km², rising on the Pullapukka Plateau and flowing through Tullakkat and Tullijaalivik districts to the sea; it supplies Tullijaalivik's water. Its upper course crosses the wilderness below the ice cap on the plateau, and where its lower course enters the town the waterworks' intake stands on its bank. The city has 315,000 people, 175,000 of them in Tullijaalivik, the city proper, and both the Sillua and Nirsavaq expressways start there; Tullakkat District covers about 14,200 km² of fjords and valleys, and its Tullakatiq Pass, at 502 m the lowest named pass in the territory, sends the cold wind down the valley towards Tullasuvva Fjord. The tulli in the river's name means \"cold\", the same root as in the names of the city and the bay: in winter the cold wind blows down off the plateau, and the river valley is the road it takes.\nIts water is icy even in summer, and locals say tea made with it \"wakes you up with one sip\". Tullivaq people have long been used to living with the cold: out at sea the Tukkaruviit Islands cool their data centres with polar air and seawater, the warm water they discharge heats Tullivaq's swimming pools and greenhouses, and locals say the cold wind \"comes into town through the pass and goes to work in the data centres\". In summer people often fish for Arctic char by the river, and when it freezes in winter children skate along its course all the way out onto the ice at its mouth."
  - id: nat_fnd27t
    subtype: river
    status: generated
    detect: { kind: river, at_km: [332.2, 116.2] }
    names: { zh: 帕利基卢克河, en: Paalikiluk River, art-x-tavrunaq: Paalikiluk }
    notes:
      zh: "帕利基卢克河在首府东北，长约 78 公里，流域面积约 8100 平方公里，上游在帕利瓦克区和伊卢克图克生态保护区，大部分河段流经尼尔萨库特区。尼尔萨库特区是首府东北的城郊区，面积近 4000 平方公里，只有 4.5 万人，大片苔原上仍有驯鹿放牧，塔夫鲁纳克语母语者过半；努卡塔克国际机场在区内，西卢阿高速、努基高速、帕卢尔尼克高速、环线和乌库利特高速都从区内经过，是首府外围的交通枢纽。河谷里的苔原夏天开满白色的棉花草，河名里的 paali 意为「白」，牧民说就是因为这一片白花。河水清浅，夏天能看清河底的卵石，周末常有首府人来钓北极红点鲑。尼尔萨库特午夜高尔夫球场也建在区内的苔原上，极昼时节午夜也能开球。\n棉花草开花的时候，河谷像落了一场夏天的雪，飞机降落国际机场之前，靠窗的乘客能看见一条白色的带子沿着河谷铺开。牧民的驯鹿在河边吃草，常常一路溜达到高尔夫球场的球道上，场边立着「驯鹿优先」的牌子。冬天河谷被雪盖平，驯鹿用蹄子刨开积雪，啃食下面的地衣。秋天棉花草的白絮被风吹散，牧民的孩子会把它们收集起来塞进枕头，说枕着河谷的白花睡觉，夜里不怕冷。"
      en: "The Paalikiluk River lies north-east of the capital, about 78 km long with a basin of some 8,100 km²; its upper course is in Paalivaq and the Illuqtuuq Nature Reserve, and most of it flows through Nirsakut District. Nirsakut is the capital's north-eastern fringe, nearly 4,000 km² with only 45,000 people, where reindeer are still herded on wide tundra and more than half speak Tavrunaq as their mother tongue; Nuqattaaq International Airport is in the district, and the Sillua, Nuqattaaq–Kiluktuar, Pallurniq and Ukkuliit expressways and the ring road all pass through it, making it the transport hub of the capital's outskirts. In summer the tundra of its valley is white with cotton grass, and herders say the paali, \"white\", in its name comes from those white flowers. The water is clear and shallow, the pebbles on its bed plain to see in summer, and at weekends people from the capital often come to fish for Arctic char. The Nirsakut Midnight Sun Golf Course is also laid out on the district's tundra, where you can tee off at midnight in the season of the midnight sun.\nWhen the cotton grass is in flower the valley looks as if summer snow has fallen, and passengers at the windows of planes coming in to the international airport can see a white ribbon laid along the valley. The herders' reindeer graze by the river and often wander onto the fairways of the golf course, where a sign reads \"Reindeer have priority\". In winter the valley is smoothed over with snow, and the reindeer dig through it with their hooves to graze the lichen beneath. In autumn, when the wind scatters the white tufts of cotton grass, the herders' children gather them to stuff pillows, saying that if you sleep on the valley's white flowers you will not feel the cold at night."
  - id: nat_w4ejk6
