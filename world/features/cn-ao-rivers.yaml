# Rivers and lakes of the Arctic Ocean Territory. River geometry is traced by the generator from
# the drainage (named_rivers in world/generator/cn-ao.yaml); lakes are placed by hydrology.lakes.
features:
  - id: nat_g8qz1t
    subtype: river
    status: generated
    names:
      zh: 基卢克图阿尔河
      en: Kiluktuar River
      art-x-tavrunaq: Kiluktuar
    notes:
      zh: 北岸的大河，长约 376 公里，流域面积约 8.5 万平方公里，居领地第二，基卢克图阿尔市因它得名。河流发源于苏瓦尔尤伊特山脉北麓，流经尼尔萨瓦克区和帕基卢克区，向北流向北岸，河谷是内陆与南北两岸之间的交通走廊。
      en: The great river of the north coast, about 376 km long with a basin of some 85,000 km², the second largest in the territory, which gives Kiluktuar City its name. It rises on the northern side of the Suvvarjuit Mountains and flows north through the Nirsavaq District and Paakiluk District towards the north coast, and its valley carries goods between the inland and both coasts.
  - id: nat_xdztvm
    subtype: lake
    status: generated
    names:
      zh: 伊卢尔尤阿克湖
      en: Illurjuaq Lake
      art-x-tavrunaq: Illurjuaq
    notes:
      zh: 伊卢克图克生态保护区的大湖，面积约 2100 平方公里，是领地最大的湖泊。一条市道以长约 16 公里的伊卢尔尤阿克湖特大桥跨过湖面，冬季湖面封冻后，冰上还开辟有雪地车道。
      en: The great lake of the Illuqtuuq Nature Reserve, about 2,100 km², the largest lake in the territory. A city road crosses it on the 16 km Illurjuaq Lake Bridge, and when it freezes in winter snowmobile tracks are marked out on the ice.
  - id: nat_16pp3d
    subtype: lake
    status: generated
    names:
      zh: 伊卢考湖
      en: Illuqqau Lake
      art-x-tavrunaq: Illuqqau
    notes:
      zh: 伊卢克萨特区的盐湖，面积约 320 平方公里，湖水含锂，伊卢克萨特提锂厂从湖中的卤水提取锂，伊卢克萨特区因它得名。乌库利特高速和重载铁路都在约 13 公里外经过。
      en: The salt lake of Illuqsaat District, about 320 km², whose brine is rich in lithium; the Illuqqau Lake works extracts it, and the district is named after the lake. The Ukkuliit Expressway and the heavy-haul railway both pass some 13 km away.
  - id: nat_bzp202
    subtype: lake
    status: generated
    names:
      zh: 尼尔赛卢湖
      en: Nirsaillu Lake
      art-x-tavrunaq: Nirsaillu
    notes:
      zh: 尼尔萨瓦克区的湖泊，面积约 530 平方公里，是领地第三大湖。夏季驯鹿群在湖边饮水和觅食，湖名由此而来；努阿高速在约 13 公里外经过。
      en: A lake in the Nirsavaq District, about 530 km², the third largest in the territory. In summer reindeer herds come down to drink and graze on its shores, hence the name; the Nuqattaaq–Aqqanik Expressway passes some 13 km away.
  - id: nat_2b0688
    subtype: lake
    status: generated
    names:
      zh: 伊卢克塔克湖
      en: Illuqtaq Lake
      art-x-tavrunaq: Illuqtaq
    notes:
      zh: 尼尔萨图维特生态保护区的湖泊，面积约 660 平方公里，是领地第二大湖，湖身狭长，湖名由此而来。驯鹿迁徙时沿湖岸行进，湖周不修道路。
      en: A lake in the Nirsatuvvit Nature Reserve, about 660 km², the second largest in the territory, long and narrow, hence the name. Migrating reindeer follow its shores, and no roads are built around it.
  - id: nat_3cy7vg
    subtype: lake
    status: generated
    names:
      zh: 西尔米库利克图克湖
      en: Sirmiqulliqtuuq Lake
      art-x-tavrunaq: Sirmiqulliqtuuq
    notes:
      zh: 陶瓦尼克区的湖泊，面积约 180 平方公里，由西尔米冰盖的融水汇成，湖水清冷，湖名由此而来。西卢阿高速在约 5 公里外经过。
      en: A lake in Tauvvaniq District, about 180 km², filled by meltwater from the Sirmi Ice Cap, cold and clear, hence the name. The Sillua Expressway passes some 5 km away.
  - id: nat_xvz2c8
    subtype: lake
    status: generated
    names:
      zh: 帕利卢湖
      en: Paalillu Lake
      art-x-tavrunaq: Paalillu
    notes:
      zh: 首府帕利瓦克区的湖泊，面积约 87 平方公里，是领地命名湖泊中最小的，离环线和努基高速都只有七八公里，是首府居民夏季划船、冬季冰钓的地方。
      en: A lake in Paalivaq District of the capital, about 87 km², the smallest of the territory's named lakes, only seven or eight kilometres from the ring road and the Nuqattaaq–Kiluktuar Expressway, where the capital's people go boating in summer and ice fishing in winter.

  # ── Rivers named by their mouths ────────────────────────
  - id: nat_23cx58
    subtype: river
    status: generated
    detect: { kind: river, at_km: [590.2, 154.8] }
    names: { zh: 西尔米河, en: "Sirmi River", art-x-tavrunaq: Sirmikiluk }
    wonder:
      zh: 世界最长的河流，长约 499 公里
      en: The longest river in the world, about 499 km
    notes:
      zh: 领地最长的河流，长约 499 公里，流域面积约 10.7 万平方公里，也是领地最大的流域。河流源自西尔米冰盖的融水，向南流经内陆矿区、陶瓦尼克区和皮瓦苏瓦区，注入南岸的大海。
      en: The longest river in the territory, about 499 km, with a basin of some 107,000 km², also the largest in the territory. It rises in the meltwater of the Sirmi Ice Cap and flows south through the inland mining zone, Tauvvaniq and Pivasuvva to the sea on the south coast.
  - id: nat_y29gc8
    subtype: river
    status: generated
    detect: { kind: river, at_km: [227.8, 228.2] }
    names: { zh: 尼尔萨河, en: "Nirsa River", art-x-tavrunaq: Nirsakiluk }
    notes:
      zh: 领地第二长的河流，长约 471 公里，流域面积约 7.6 万平方公里，「尼尔萨」在塔夫鲁纳克语中意为驯鹿。河流自普拉苏瓦米乌特区的山地向北，流经尼尔萨图维特生态保护区和阿卡皮图米乌特区，到阿卡尼克区入海，驯鹿群沿河谷迁徙。
      en: The second longest river in the territory, about 471 km, with a basin of some 76,000 km²; nirsa is the Tavrunaq word for reindeer. It flows north from the mountains of Pullasuvvamiut through the Reindeer Migration reserve and the Aqqapitummiut District to the sea in Aqqanik District, and reindeer herds migrate along its valley.
  - id: nat_e9c7y8
    subtype: river
    status: generated
    detect: { kind: river, at_km: [295.2, 250.8] }
    names: { zh: 瓦克基卢克河, en: Vaqkiluk River, art-x-tavrunaq: Vaqkiluk }
    notes:
      zh: 基卢克图阿尔市的河流，长约 201 公里，流经帕基卢克区的苔原，在西尔米努卡区附近入海。
      en: A river of Kiluktuar City, about 201 km long, flowing across the tundra of Paakiluk District to the sea near Sirminuqa.
  - id: nat_f9a92v
    subtype: river
    status: generated
    detect: { kind: river, at_km: [328.2, 99.8] }
    names: { zh: 苏瓦基卢克河, en: Suvvakiluk River, art-x-tavrunaq: Suvvakiluk }
    notes:
      zh: 首府北面的河流，长约 156 公里，发源于尼尔萨瓦克区，流经帕利瓦克区和苏瓦利克区，注入努卡塔克峡湾。
      en: A river north of the capital, about 156 km long, rising in the Nirsavaq District and flowing through Paalivaq and Suvvalik into Nuqattaaq Fjord.
  - id: nat_ph9ex7
    subtype: river
    status: generated
    detect: { kind: river, at_km: [85.2, 171.8] }
    names: { zh: 图利基卢克河, en: Tullikiluk River, art-x-tavrunaq: Tullikiluk }
    notes:
      zh: 图利瓦克市的河流，长约 131 公里，发源于普拉普卡高原，流经图拉卡特区和图利亚利维克区一带入海，是图利亚利维克区的水源。
      en: A river of Tullivaq City, about 131 km long, rising on the Pullapukka Plateau and flowing through Tullakkat and Tullijaalivik districts to the sea; it supplies Tullijaalivik's water.
  - id: nat_fnd27t
    subtype: river
    status: generated
    detect: { kind: river, at_km: [332.2, 116.2] }
    names: { zh: 帕利基卢克河, en: Paalikiluk River, art-x-tavrunaq: Paalikiluk }
    notes:
      zh: 首府东北的河流，长约 78 公里，大部分流经尼尔萨库特区，上游在帕利瓦克区和伊卢克图克生态保护区。
      en: A river north-east of the capital, about 78 km long, flowing mostly through Nirsakut District, with its upper course in Paalivaq and the Illuqtuuq Nature Reserve.
  - id: nat_w4ejk6
    subtype: river
    status: generated
    detect: { kind: river, at_km: [454.8, 109.2] }
    names: { zh: 乌库基卢克河, en: Ukkukiluk River, art-x-tavrunaq: Ukkukiluk }
    notes:
      zh: 乌库拉克市的河流，长约 69 公里，是领地命名河流中最短的，发源于西卢阿苏瓦特生态保护区，流经基萨尔维克区和乌库努卡区，基萨尔维克冶炼厂从河上的水电站取电。
      en: A river of Ukkulaaq City, about 69 km long, the shortest of the territory's named rivers, rising in the Silluasuvvat Nature Reserve and flowing through Qissarvik and Ukkunuqa; the Qissarvik smelter draws power from hydro plants on it.
