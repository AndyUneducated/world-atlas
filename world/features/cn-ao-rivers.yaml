    names: { zh: 乌库基卢克河, en: Ukkukiluk River, art-x-tavrunaq: Ukkukiluk }
    notes:
      zh: "乌库基卢克河是乌库拉克市的河流，长约 69 公里，流域面积约 5500 平方公里，是领地命名河流中最短的。河流发源于西卢阿苏瓦特生态保护区，从山地里流出，短短几十公里落差很大，正适合建水电站；流经基萨尔维克区和乌库努卡区入海，乌库拉克的乌库苏瓦峡湾内段也属这片保护区。名字里的 ukku 意为「矿」，这条河也确实和矿分不开：基萨尔维克冶炼厂冶炼内陆矿区的镍矿石，从河上的水电站取电，再用水电和余热为镍城供暖，产品从乌库努卡区的散货码头装船运出，乌库努卡区是乌库拉克的城区和港口，有 21 万人。基萨尔维克区有 14 万人，冶炼厂每八小时换一次班，换班时整座城的公交、食堂和澡堂都跟着忙一阵，本地人约时间常说「早班后」「夜班前」。\n河虽短，水流却急，夏天常有皮划艇爱好者从上游一路漂到峡湾口，冶炼厂的工人说这条河「一半给我们发电，一半给年轻人玩」。夜班工人下班时，食堂专门留着一锅热鱼汤，有人喝完就扛着皮划艇去河边，趁着永昼的天光再漂一程。冬天河面大半封冻，只有水电站下游的一小段水流太急，终冬不冻，冒着白汽，镍城的人管那里叫「河的烟囱」。"
      en: "The Ukkukiluk River is a river of Ukkulaaq City, about 69 km long with a basin of some 5,500 km², the shortest of the territory's named rivers. It rises in the Silluasuvvat Nature Reserve and comes out of the mountains with a steep fall over a few dozen kilometres, ideal for hydro power, then flows through Qissarvik and Ukkunuqa districts to the sea; the inner reaches of Ukkulaaq's Ukkusuvva Fjord also belong to that reserve. The ukku in its name means \"ore\", and the river is indeed bound up with mining: the Qissarvik smelter, which smelts nickel ore from the inland mining zone, draws power from hydro plants on the river and uses hydro power and waste heat to warm the nickel town, and its output is shipped from the bulk terminal in Ukkunuqa, the city proper and port of Ukkulaaq, with 210,000 people. Qissarvik District has 140,000 people; the smelter changes shift every eight hours, the whole town's buses, canteens and bathhouses rush with each change, and locals make appointments for \"after the early shift\" or \"before the night shift\".\nShort as it is, the river runs fast, and in summer kayakers often ride it from the upper reaches all the way to the fjord mouth; the smelter workers say the river \"is half for our power and half for the young people's fun\". When the night shift comes off, the canteen keeps a pot of hot fish soup for them, and some finish it and carry their kayaks down to the river for another run in the light of the midnight sun. In winter most of the river freezes, but one short stretch below the hydro plants runs too fast to freeze all winter and steams in the cold; the people of the nickel town call it \"the river's chimney\"."
