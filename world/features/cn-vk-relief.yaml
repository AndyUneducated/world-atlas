# Peaks, passes and glaciers of the Viking Islands found by the generator (pipeline/atlas/relief.py).
# Each entry names the landform of `detect.kind` nearest to `detect.at_km` (design km).
features:
  # ── Peaks (highest first) ────────────────────────────────
  - id: nat_242405
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [65.2, 45.8] }
    names: { zh: 火口峰, en: Crater Peak, art-x-viking: Kraterspitze, art-x-buckham: Picco del Cratere }
    notes:
      zh: "暖泉火山的火口缘最高点，海拔两千二百八十多米，是群岛的最高峰，属克莱特斯塔德市克莱特斯塔德区。峰顶覆盖着群岛唯一的冰帽暖泉冰帽，火口内终年冒着蒸汽，冰帽中央被地热融出一圈湖水。登上火口峰可以俯瞰全岛：东面是温泉区的度假村和温泉湾，南面是新特雷曼的地热田，西面是克莱特斯塔德的港口和玄武岩台地，北面是暖河的谷地，晴天时还能望见远处的长船岛和西格利岛。登山者从克莱特斯塔德一侧经冰帽边缘攀登，必须由向导带领，火山监测站会根据地震和地表变形情况发布登山通告。夏季是登顶的季节，冬季峰顶常被风雪笼罩。登顶的人会在火口缘上捡一块冷却的火山渣带下山，向导提醒大家只拿一块，说火山「会记账」；克莱特斯塔德的纪念品店里卖的火口峰石头，都是从山脚的采石场里来的。"
      en: "The highest point of Warmspring Volcano's crater rim, a little over 2,280 m and the highest summit in the islands, in Klettstad District of Klettstad City. It is capped by the Warmspring Ice Cap, the islands' only ice cap, steam rises from the crater all year, and the heat has melted a ring of water in the middle of the ice. From the top the whole island is laid out: the resorts of Hot Springs District and Hot Springs Bay to the east, the geothermal fields of Tremaine Bay to the south, the harbour and basalt terraces of Klettstad to the west and the Warm River valley to the north, and on clear days Longship and Mast islands in the distance. Climbers come up from the Klettstad side across the edge of the ice cap, always with a guide, and the monitoring station issues climbing notices according to earthquakes and ground movement. Summer is the season for the summit; in winter it is often lost in wind and snow. Climbers pick up one cooled cinder on the crater rim to take home, and guides insist on just one because the volcano \"keeps count\"; the Crater Peak stones sold in Klettstad's souvenir shops all come from the quarries at the foot of the mountain."
  - id: nat_fxqmaw
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [105.8, 179.2] }
    names: { zh: 铁锚峰, en: Iron Anchor Peak, art-x-viking: Eisenankerspitze, art-x-buckham: Picco dell'Ancora di Ferro }
    notes:
      zh: "锚链山的主峰，海拔两千零七十多米，是阿克斯岛的最高点，也是群岛仅次于火口峰的第二高峰，属富鲁海姆市富鲁海姆区，北坡挂着群岛唯一的山岳冰川锚链冰川。从富鲁海姆镇出发，林间的伐木道和步道穿过一望无际的松林通往山脚，夏季有向导带领游客上冰，再沿冰川边缘的山脊登顶。峰顶可以俯瞰阿克斯岛东北的林海、富鲁海姆湾和锚链山连绵的山脊，晴天时还能望见远处开阔的海面。山脚的森林木屋和狩猎营地为登山者提供住宿，冬季则有越野滑雪道。富鲁海姆的冬夜漫长寂静，极光常在铁锚峰的雪顶上空舞动。富鲁海姆的猎人营地里流传一句话：「看见铁锚峰的雪顶，就知道离家不远」，在松林里迷了方向的人，只要爬上一棵高树找到那个白顶，就能走回镇上。"
      en: "The main summit of the Anchor Chain Mountains, a little over 2,070 m, the highest point of Akkersey and the second highest in the islands after Crater Peak, in Furuheim District of Furuheim City; the Anchor Chain Glacier, the islands' only mountain glacier, hangs on its north face. From the town of Furuheim, logging tracks and trails run through endless pine forest to its foot, and in summer guides take visitors onto the ice and up the ridge beside the glacier to the top. The summit looks down on the forests of north-eastern Akkersey, Furuheim Bay and the long ridge of the range, and on clear days the open sea far beyond. Forest cabins and hunting camps at its foot house climbers, and in winter there are cross-country ski trails. Furuheim's winter nights are long and still, and the aurora often dances over the snowy summit. The hunting camps of Furuheim have a saying, \"see the snow on Iron Anchor and you're nearly home\": anyone lost in the pinewoods need only climb a tall tree and find that white summit to walk back to town."
  - id: nat_n4vs23
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [79.8, 131.2] }
    names: { zh: 佩洛峰, en: Mount Pellow, art-x-viking: Pellowspitze, art-x-buckham: Picco Pellow }
    notes:
      zh: "锚链山南段的高峰，海拔一千九百多米，属阿克斯维克市西爪区，圆顶如船上的绞盘，是阿克斯维克附近最高的山峰。峰顶可以俯瞰阿克斯维克湾的港口、岸桥和往来的货轮，西北是托克维克湾的海面，北面是锚链山连绵的山脊。从西爪区的牧场出发，徒步道穿过草坡和碎石坡登上圆顶，是阿克斯维克人周末最喜欢的登山路线之一，山脚的牧场民宿和乡村餐馆为登山者提供补给。山坡下部是奶牛和绵羊放牧的草场，上部是高山草甸和裸露的岩石。夏季的傍晚，从峰顶可以看到阿克斯维克湾的灯火渐次亮起，冬季山顶积雪，从港口望去如一顶白色的圆帽。阿克斯维克的港口工人管佩洛峰叫「绞盘」，说是它把一条条货轮「绞」进港来的；山脚牧场民宿的招牌菜是羊肉汤配黑面包，登山回来的人一口气能喝两碗。"
      en: "The high summit of the southern Anchor Chain Mountains, a little over 1,900 m, in West Fluke District of Akkersvik; its rounded top is like a ship's capstan, and it is the highest peak near Akkersvik. The top looks down on the port of Akkersvik Bay with its cranes and freighters, north-west over the waters of Tåkevik Bay and north along the long ridge of the range. A trail climbs from the pastures of West Fluke over grassy slopes and scree to the dome, one of Akkersvik people's favourite weekend climbs, with farm guesthouses and country inns at its foot to feed the walkers. Dairy cows and sheep graze its lower slopes, and alpine meadow and bare rock cover the upper ones. On summer evenings you can watch the lights of Akkersvik Bay come on one by one from the summit; in winter its snowy top looks from the port like a white cap. Akkersvik dockers call Mount Pellow \"the capstan\" that winds the freighters into harbour; the farm guesthouses at its foot are known for mutton broth with dark bread, and walkers back from the summit put away two bowls without stopping."
  - id: nat_msexyn
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [233.2, 112.2] }
    names: { zh: 卡洛韦峰, en: Mount Calloway, art-x-viking: Callowayspitze, art-x-buckham: Picco Calloway }
    notes:
      zh: "卡洛韦岭的最高峰，海拔一千五百二十多米，是阿夫琳岛的最高点，耸立在阿夫琳湾畔，属阿夫琳港市灯塔区。山峰从海边拔地而起，几乎全部的高度都从海面算起，从阿夫琳湾进港的邮轮上可以看到它巨大的山影，阿夫琳岛的帆形轮廓就以它为顶点。登山步道从阿夫琳码头和灯塔区的海边出发，沿山脊攀登，山顶可以俯瞰阿夫琳湾的邮轮母港、马拉布尔岛和马拉布尔水道，晴天时向西眺望阿夫琳海峡，向东眺望埃德文岛方向的开阔海面。阿夫琳港灯塔公路从山脚的海岸经过。夏季的山顶是看日出的好地方，冬季山峰被白雪覆盖，从海上望去像一面白帆。邮轮进港时，船上的广播会提醒乘客到甲板上看卡洛韦峰，许多人第一眼以为是一片低垂的云，等船靠近才发现那是一整座从海里站起来的山。"
      en: "The highest summit of Calloway Ridge, a little over 1,520 m and the highest point of Aveline Island, rising above Aveline Bay in Lighthouse District of Port Aveline. It climbs almost straight out of the sea, so nearly all its height is seen from sea level; from cruise ships coming into Aveline Bay its great bulk fills the view, and it forms the peak of the island's sail-shaped outline. Trails climb the ridge from the shore at Aveline Quay and Lighthouse District, and the summit looks down on the cruise port, Lighthouse Isle and Marrable Sound; on clear days you can see Aveline Strait to the west and the open sea towards Port Edevane to the east. The Port Aveline Lighthouse Road runs along the coast at its foot. In summer the top is a fine place to watch the sunrise, and in winter, covered in snow, it looks from the sea like a white sail. As cruise ships come in, the announcements call passengers on deck to see Mount Calloway, and many at first take it for a low bank of cloud until the ship draws near and it turns out to be a whole mountain standing up out of the sea."
  - id: nat_1cqe9c
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [201.8, 95.8] }
    names: { zh: 费兰丁峰, en: Mount Ferrandine, art-x-viking: Ferrandinespitze, art-x-buckham: Picco Ferrandine }
    notes:
      zh: "卡洛韦岭中段的山峰，海拔近一千五百米，属萨尔塔维克市萨尔塔维克区，矗立在区的西侧，是卡洛韦岭中段的高峰。站在峰顶，西北可以眺望阿夫琳海峡，东南可以俯瞰萨尔塔维克湾的盐田、海上风电场和阿夫琳岛东南的海岸线。山峰北面隔卡洛韦垭口与卡洛韦峰相望，徒步者常从垭口沿山脊攀登。阿夫琳纵贯高速从山脚下经过。山坡下部是望海区的果园和牧场，上部是高山草甸和裸露的岩石，夏季野花盛开，秋季山坡被果园和落叶染成金黄。萨尔塔维克的人说，在费兰丁峰顶能同时看见「盐、风和苹果」：东南的盐田和风电场，脚下的果园，徒步者下山时常顺路在果园门口买一袋刚摘的苹果。"
      en: "A summit in the middle of Calloway Ridge, nearly 1,500 m high, in Saltavik District of Saltavik City, rising on the district's western side as the high point of the middle ridge. From the top you can look north-west over Aveline Strait and south-east down on the salt pans of Saltavik Bay, the offshore wind farm and the south-east coast of Aveline Island. To the north it faces Mount Calloway across Calloway Saddle, and walkers often climb it along the crest from the saddle. The Aveline Spine Expressway runs along its foot. Orchards and pastures cover its lower slopes and alpine meadow and bare rock its upper ones; wild flowers bloom in summer, and in autumn the orchards and turning leaves colour the slopes gold. Saltavik people say that from the top of Ferrandine you can see \"salt, wind and apples\" all at once, the salt pans and wind farm to the south-east and the orchards below, and walkers often buy a bag of fresh-picked apples at an orchard gate on the way down."
  - id: nat_fczk77
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [150.8, 133.8] }
    names: { zh: 斯塔文廷峰, en: Stavntind, art-x-viking: Stavntind, art-x-buckham: Picco di Prua }
    notes:
      zh: "谢尔海姆山的主峰，海拔一千二百九十多米，是长船岛的最高点，属长船市朗桑德区，从山顶向四面都没有更高的山，突起高度与海拔相同。山峰位于长船岛中部，周围是谢尔海姆山东北麓的丘陵和谷地，家庭农场种植蔬菜、草莓和饲草，山坡上是云杉和松树林场。登山步道从朗桑德区的农场出发，穿过林地和高山草甸登顶，山顶可以同时看到长船岛东西两侧的大海，晴天时东望阿夫琳海峡和阿夫琳岛的卡洛韦岭，西望阿克斯海峡和阿克斯岛的雪峰。夏季周末许多长船人来这里登山、采摘，冬季山顶积雪，是雪鞋徒步的去处。朗桑德的农场在登山步道口摆着无人看管的草莓摊，一盒草莓配一个投钱的铁罐，登山的人边走边吃，农场主说铁罐里的钱「几乎从来没少过」。"
      en: "The main summit of the Kjølheim Hills, a little over 1,290 m and the highest point of Longship Island, in Langsand District of Longship; no higher ground rises anywhere around it, so its prominence equals its height. It stands in the middle of the island among the foothills and valleys of the north-eastern Kjølheim Hills, where family farms grow vegetables, strawberries and fodder and spruce and pine plantations cover the slopes. A trail climbs from the Langsand farms through woodland and alpine meadow, and from the top you can see the sea on both sides of the island at once: on clear days Aveline Strait and Calloway Ridge to the east, and Akkersey Strait and the snowy peaks of Akkersey to the west. On summer weekends many Longship people come to climb and pick fruit, and in winter the snowy top is a place for snowshoeing. Langsand farms leave unattended strawberry stands at the trailhead, a punnet beside a tin for the money, walkers eat as they climb, and the farmers say the tin has \"hardly ever come up short\"."
  - id: nat_pqybvd
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [121.8, 104.2] }
    names: { zh: 斯蒂尔廷峰, en: Styrtind, art-x-viking: Styrtind, art-x-buckham: Picco del Timone }
    notes:
      zh: "谢尔海姆山西南端的高峰，海拔近千米，属斯蒂尔维克市斯蒂尔维克区，在长船岛的「船尾」如一把船舵，山峰和斯蒂尔维克都由此得名。斯蒂尔维克老城沿港湾和斯蒂尔廷峰的山坡展开，彩色木屋和石砌仓库层层叠叠。登上斯蒂尔廷峰可以俯瞰三岛交汇的水道和往来的渡轮：西面是阿斯跨海高速伸向阿克斯维克湾的海面，南面是船尾和暖泉方向的跨海长桥，东面是阿夫琳海峡。登山步道从老城出发，穿过林地和草坡登顶，傍晚常有居民上山看日落。斯蒂尔维克是群岛跨海高速、长船西岸高速和阿斯跨海高速的交汇点，山顶的观景台上可以看到桥上和水道里车船往来不绝。斯蒂尔维克的老城居民傍晚上山看日落时，常带一保温瓶咖啡和一袋肉桂面包，山顶的长凳上总有人分享食物，本地人说这是「船舵上的晚茶」。"
      en: "The high summit at the south-west end of the Kjølheim Hills, nearly 1,000 m, in Styrvik District of Styrvik City; it stands at Longship Island's \"stern\" like a rudder, and both the peak and the town are named for it. The old town of Styrvik climbs from the harbour up its slopes in tiers of painted wooden houses and stone warehouses. From the top you look down on the waters where three islands meet and the ferries come and go: to the west the sea crossed by the Akkersvik–Styrvik Sea Crossing towards Akkersvik Bay, to the south the long bridges towards the stern and Warmspring, and to the east Aveline Strait. A trail climbs from the old town through woodland and grassy slopes, and in the evenings people come up to watch the sunset. Styrvik is where three expressways meet, and from the summit lookout the traffic on the bridges and the boats in the channels never seem to stop. Old-town Styrvik residents climbing up for the sunset usually carry a flask of coffee and a bag of cinnamon buns, there is always someone sharing food on the summit benches, and locals call it \"tea on the rudder\"."

  # ── Passes ───────────────────────────────────────────────
  - id: nat_02xmec
    subtype: pass
    status: generated
    detect: { kind: pass, at_km: [130.2, 113.8] }
    names: { zh: 谢尔斯卡德山口, en: Kjølskard, art-x-viking: Kjølskard, art-x-buckham: Passo della Chiglia }
    notes:
      zh: 谢尔海姆山西南段最低的山口，海拔只有五百多米，属谢尔海姆市谢尔海姆区，旧时长船岛东西两岸的居民由此翻山往来。山口两侧是谢尔海姆山连绵的林场，云杉和松树林间有古老的驮道和石砌路标，如今山口没有公路，只有徒步道翻过鞍部，是谢尔海姆镇周边最受欢迎的半日徒步路线之一，秋季落叶时节最为美丽。站在山口上，东面是谢尔海姆镇的山谷，西面可以望见长船岛西岸的海面。群岛跨海高速则沿谢尔海姆山东南麓从区内经过，谢尔海姆山公路纵贯山麓，车辆不必再翻越山口。冬季山口积雪较深，是越野滑雪和雪鞋徒步的去处。
      en: The lowest gap in the south-western Kjølheim Hills, only a little over 500 m high, in Kjølheim District of Kjølheim City, where people once crossed between the east and west coasts of Longship Island. Forest plantations of the Kjølheim Hills cover both sides, with an old packhorse track and stone waymarks among the spruce and pine. No road crosses it today, only a footpath over the saddle, one of the most popular half-day walks around the town of Kjølheim and at its loveliest in autumn. From the gap the valley of Kjølheim lies to the east, and to the west you can see the sea off Longship's west coast. The Island Chain Expressway runs along the south-east foot of the hills through the district and the Kjølheim Hills Road along their flanks, so traffic no longer has to climb over the gap. In winter the snow lies deep, and it becomes a place for cross-country skiing and snowshoeing.
  - id: nat_7xxwr5
    subtype: pass
    status: generated
    detect: { kind: pass, at_km: [221.2, 106.8] }
    names: { zh: 卡洛韦垭口, en: Calloway Saddle, art-x-viking: Callowaysattel, art-x-buckham: Sella Calloway }
    notes:
      zh: 卡洛韦峰与费兰丁峰之间的鞍部，海拔一千二百多米，属阿夫琳港市望海区，是翻越卡洛韦岭的山口。观景山道从望海区的果园间盘旋而上，沿途春季果花盛开、秋季果实累累，垭口的观景台可以眺望阿夫琳港、长船岛和远处的群岛，是阿夫琳港最受欢迎的观景点。垭口两侧，北面是阿夫琳岛最高的卡洛韦峰，南面是卡洛韦岭中段的费兰丁峰，徒步者常从这里出发，沿山脊攀登两座山峰。阿夫琳纵贯高速从垭口附近的山脚下经过。夏季的傍晚，垭口上常有人驻足看日落，冬季则有雪鞋徒步者沿山脊行走。
      en: The saddle between Mount Calloway and Mount Ferrandine, a little over 1,200 m high, in Seawatch District of Port Aveline, and the pass over Calloway Ridge. A scenic mountain road climbs to it through the orchards of Seawatch, white with blossom in spring and heavy with fruit in autumn, and the viewpoint at the top looks out over Port Aveline harbour, Longship Island and the islands beyond, Port Aveline's most popular viewpoint. To the north rises Mount Calloway, the highest on the island, and to the south Mount Ferrandine in the middle of the ridge; walkers often set out from here along the crest to climb both. The Aveline Spine Expressway passes close by at the foot of the mountains. On summer evenings people stop at the saddle to watch the sunset, and in winter snowshoers walk the ridge.

