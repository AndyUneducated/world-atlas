# Peaks and passes of the Viking Islands found by the generator (pipeline/atlas/relief.py).
# Each entry names the landform of `detect.kind` nearest to `detect.at_km` (design km).
features:
  # ── Peaks (highest first) ────────────────────────────────
  - id: nat_242405
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [47.8, 33.8] }
