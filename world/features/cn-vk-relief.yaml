    notes:
      zh: 暖泉火山的火口缘最高点，群岛最高峰，火口内终年冒着蒸汽。
      en: The highest point of Warmspring Volcano's crater rim and of the islands; steam rises from the crater all year.
  - id: nat_pqybvd
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [92.2, 54.8] }
    names: { zh: 舵峰, en: Rudder Peak, art-x-viking: Ruderspitze, art-x-buckham: Picco del Timone }
