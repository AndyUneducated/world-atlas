    names: { zh: 暖泉冰帽, en: Warmspring Ice Cap, art-x-viking: Warmquell-Eiskappe, art-x-buckham: Calotta di Fontecalda }
    notes:
      zh: "覆盖暖泉火山山顶的冰帽，面积三百六十多平方公里，平均海拔两千一百多米，是群岛唯一的冰帽，属克莱特斯塔德市克莱特斯塔德区与暖泉市斯瓦特桑德区。冰帽在火口峰下铺开，火口的地热让冰帽中央终年融出一圈湖水，蒸汽从冰面的裂缝和湖面上袅袅升起，晴天时从温泉区和克莱特斯塔德都能望见山顶的白色冰帽和蒸汽。冰帽与火山相互塑造：冰雪在火山的热力下不断融化又不断积累，融水顺着山坡汇入四面的河流。登山者从克莱特斯塔德一侧经冰帽边缘攀登火口峰，必须由向导带领，并遵守火山监测站的通告。冰与火在这里比邻而居，是暖泉岛最著名的地标之一。冰帽中央那圈热融湖冬天也不结冰，湖面的蒸汽在冷空气里凝成一根白柱，克莱特斯塔德的渔民出海时以它为路标，管它叫「山顶的烟囱」。"
      en: "The ice cap over the summit of Warmspring Volcano, a little over 360 km² with a mean height of over 2,100 m, the only ice cap in the islands, shared between Klettstad District and Svartsand District. It spreads out below Crater Peak, and the heat of the crater keeps a ring of meltwater open in its middle all year, with steam drifting up from the crevasses and the lake; on clear days the white cap and its plume can be seen from both Hot Springs and Klettstad. Ice and volcano shape each other here, the snow melting in the volcano's heat and building up again, and the meltwater running down the slopes into the rivers on every side. Climbers reach Crater Peak from the Klettstad side across the edge of the ice cap, always with a guide and under the notices of the volcano monitoring station. Fire and ice side by side make it one of Warmspring's best-known landmarks. The meltwater lake in the middle of the ice cap stays open even in winter, its steam condensing into a white column in the cold air, and Klettstad fishers use it as a landmark at sea, calling it \"the chimney on the mountain\"."
  - id: nat_fhe7tf
    subtype: glacier
    status: generated
    detect: { kind: glacier, at_km: [105.6, 180.4] }
    names: { zh: 锚链冰川, en: Anchor Chain Glacier, art-x-viking: Ankerkettengletscher, art-x-buckham: Ghiacciaio della Catena }
    notes:
      zh: "铁锚峰北坡的小冰川，面积三十多平方公里，平均海拔近两千米，是群岛唯一的山岳冰川，属富鲁海姆市富鲁海姆区。冰川挂在锚链山主峰的北坡上，冰舌向下伸入松林覆盖的山谷，冰面上布满蓝色的冰裂缝，融水汇成溪流流向富鲁海姆湾。从富鲁海姆镇出发，林间的伐木道和步道通往铁锚峰和冰川脚下，夏季有向导带领游客穿上冰爪徒步上冰，登上冰川可以眺望阿克斯岛东北的林海和远处的海面。冰川周围是高山草甸和碎石坡，常能看到驯鹿和雷鸟。森林木屋和山间营地为登山者提供住宿，冬季这里是越野滑雪和雪鞋徒步的去处。向导们说锚链冰川是「群岛的冰箱」，夏天带游客上冰时，他们会在冰裂缝边凿下一块幽蓝的老冰，回到营地放进果汁里，冰块化的时候会噼啪作响。"
      en: "The small glacier on the north face of Iron Anchor Peak, a little over 30 km² and nearly 2,000 m high on average, the only mountain glacier in the islands, in Furuheim District of Furuheim City. It hangs on the north side of the main summit of the Anchor Chain Mountains, its tongue reaching down into pine-covered valleys, its surface laced with blue crevasses, and its meltwater running in streams towards Furuheim Bay. From the town of Furuheim, logging tracks and trails through the forest lead to Iron Anchor Peak and the foot of the ice, and in summer guides take visitors out onto the glacier in crampons, where they look out over the forests of north-eastern Akkersey to the sea beyond. Alpine meadows and scree surround it, often with reindeer and ptarmigan. Forest cabins and mountain camps house climbers, and in winter it is a place for cross-country skiing and snowshoeing. Guides call the Anchor Chain Glacier \"the islands' fridge\", and on summer walks they chip a lump of old blue ice from beside a crevasse to drop into juice back at camp, where it crackles and pops as it melts."
