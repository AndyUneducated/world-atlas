features:
  - id: nat_bb9whq
    subtype: mountain_range
    status: generated
    names:
      zh: 谢尔海姆山
      en: Kjølheim Hills
      art-x-viking: Kjølheimberge
      art-x-buckham: Colli della Chiglia
    notes:
      zh: "谢尔海姆山是纵贯长船岛的低山脊，主峰斯塔文廷峰海拔一千二百九十多米，是长船岛的最高点，从山顶向四面都没有更高的山。山形如倒扣的船龙骨，这也是长船城名来历的传说之一。山脊从北岬一带向西南延伸，经西岸、朗桑德和谢尔海姆，直到船尾近千米高的斯蒂尔廷峰，把长船岛分成东西两岸：迎风的西岸湿润多雨，背风的东岸干爽，长船一年只有约 900 毫米降水。\n谢尔海姆镇坐落在山脚下，山坡上是连绵的云杉、冷杉和松树林场，谢尔海姆一月平均气温零下 1 度，是群岛少有的冬天积雪的地方。谢尔海姆山滑雪场建在北坡，冬季长船和斯蒂尔维克的滑雪者蜂拥而至，夏季变成山地自行车公园和高山草甸徒步线，山顶的观景台可以同时看到东西两侧的大海。西南段海拔五百多米的谢尔斯卡德山口是最低的山口，旧时东西两岸的居民由此翻山往来。谢尔海姆山公路沿山麓纵贯全岛，长近三百公里，长船西岸高速也沿山脚延伸，群岛跨海高速沿东南麓经过，途中穿过谢尔海姆隧道，群岛高速铁路在山下的谢尔海姆站停靠。\n长船人爱说，整座岛是一条倒扣在海上的船，谢尔海姆山是龙骨，所以岛上的人「住在船底下也从不晕船」；滑雪场的缆车站门口挂着一块旧船板，据说是从岛上第一条渔船上拆下来的。"
      en: "The Kjølheim Hills are the low ridge running the length of Longship Island; their main summit, Stavntind at a little under 1,300 m, is the island's highest point, with no higher ground in any direction. The ridge is shaped like an upturned keel, which is one of the legends of how the city of Longship got its name. It runs south-west from around North Cape through West Shore, Langsand and Kjølheim to Styrtind, nearly 1,000 m high, at the stern, dividing the island into an east and a west shore: the windward west is damp and rainy, the sheltered east is dry, and Longship gets only about 900 mm of rain a year.\nThe town of Kjølheim lies at the foot of the hills, whose slopes are an unbroken spread of spruce, fir and pine plantations; Kjølheim averages −1 °C in January, one of the few places in the islands where snow lies in winter. The Kjølheim Hills Ski Area is on the northern slopes, crowded in winter with skiers from Longship and Styrvik and turned in summer into a mountain-bike park and alpine-meadow walks, and the viewpoint on top looks out on the sea on both sides at once. In the south-west, Kjølskard, at a little over 500 m, is the lowest pass, where in the old days people from the two shores crossed the hills to visit each other. The Kjølheim Hills Road runs the length of the island along the foot of the hills for nearly 300 km, the Longship West Shore Expressway also follows the foothills, the Island Chain Expressway runs along the south-eastern foot, passing through the Kjølheim Tunnel, and the Island Chain High-Speed Railway stops at Kjølheim Station below.\nLongship people like to say that the whole island is a boat turned upside down on the sea with the Kjølheim Hills as its keel, which is why its people \"live under the hull and never get seasick\"; an old ship's plank hangs at the door of the ski area's lift station, said to come from the first fishing boat ever built on the island."
  - id: nat_1kngjx
    subtype: volcano
    status: generated
    names:
      zh: 暖泉火山
      en: Warmspring Volcano
      art-x-viking: Warmquellvulkan
      art-x-buckham: Vulcano Fontecalda
    wonder:
      zh: 世界唯一的活火山，火口上覆盖着冰帽
      en: The only active volcano in the world, its crater capped with ice
    notes:
      zh: "暖泉火山是世界唯一的活火山，火口上覆盖着冰帽，在维京群岛西南端暖泉岛的中央。主峰火口峰海拔两千二百八十多米，是群岛的最高点，山顶覆盖着暖泉冰帽，火口内终年冒着蒸汽。整座暖泉岛就是这座火山堆成的圆形火山岛，面积近三万四千平方公里，是群岛第四座大岛：一层层熔岩流和火山灰从火口向四面铺开，冷却成缓缓倾斜的山坡，西岸的熔岩在海边凝成玄武岩台地和海崖。河流从火山向四面流入大海，暖河和灰河都发源于它的山坡，暖河全长一百一十多公里，是群岛最长的河，灰河带着火山灰呈灰白色，在特雷曼湾外堆出了灰岛。火山的维京语名 Warmquellvulkan、巴克汉姆语名 Vulcano Fontecalda 和中文名一样，都取自山麓的温泉。\n火山的地热让山麓遍布温泉、喷气孔和地热田：东麓的温泉区以露天温泉闻名，南麓的新特雷曼有泥火山和地热温室，城市得名于最早在湾边开采硫磺的特雷曼家族，斯瓦特桑德区的黑沙滩由火山喷发的玄武岩碎屑形成，西麓的克莱特斯塔德开采玄武岩、浮石和火山渣，东岸外浮石岛的海滩上堆满了火山喷出的浮石。地热电站为全岛供应电力和暖气，温泉水被引进酒店、疗养院、温室和家庭，城市的街道冬季也不结冰。暖泉岛是温和湿润的海洋性气候，冬天少有严寒，山顶却终年积雪；暖泉冰帽面积三百六十多平方公里，平均海拔两千一百多米，是群岛唯一的冰帽，火口的地热让冰帽中央终年融出一圈湖水，冰雪在火山的热力下不断融化又不断积累，融水顺着山坡汇入四面的河流。冰帽下的火山口与冰川相映，形成冰与火交融的奇观。火山监测站常年监测地震和地表变形，并据此发布登山通告。\n登山者从克莱特斯塔德一侧经冰帽边缘攀登火口峰，必须由向导带领，夏季是登顶的季节，冬季峰顶常被风雪笼罩。登顶的人会在火口缘上捡一块冷却的火山渣带下山，向导提醒大家只拿一块，说火山「会记账」。冰帽中央那圈热融湖冬天也不结冰，湖面的蒸汽在冷空气里凝成一根白柱，克莱特斯塔德的渔民出海时以它为路标，管它叫「山顶的烟囱」。山麓的人家把鸡蛋装进网兜，放进喷气孔旁的热泉里煮，十几分钟就熟了，蛋白带着一点硫磺味，游客管它叫「火山蛋」，本地人则说这是「山给的早饭」。"
      en: "Warmspring Volcano is the only active volcano in the world, its crater capped with ice, at the centre of Warmspring Island at the south-western end of the Viking Islands. Its main summit, Crater Peak, a little over 2,280 m, is the highest point in the islands, capped by the Warmspring Ice Cap, with steam rising from the crater all year. The whole of Warmspring Island, nearly 34,000 km² and the fourth of the islands' large islands, is the round cone this volcano has built: layer upon layer of lava and ash has spread out from the crater on every side and cooled into gently sloping flanks, and on the west coast the lava has set into basalt plateaus and sea cliffs. Rivers run from the volcano to the sea on every side, among them the Warm River and the Ash River; the Warm River, a little over 110 km long, is the longest river in the islands, while the Ash River runs greyish-white with volcanic ash and has built Ash Isle off Tremaine Bay. The volcano's Viking name, Warmquellvulkan, and its Buckham name, Vulcano Fontecalda, like its Chinese name, come from the hot springs at its foot.\nIts heat fills the foothills with hot springs, fumaroles and geothermal fields: Hot Springs District to the east is famous for its open-air pools; New Tremaine to the south has mud pots and geothermal greenhouses, the town named after the Tremaine family who first mined sulphur by the bay; the black beaches of Svartsand are made of basalt grit from its eruptions; Klettstad to the west quarries its basalt, pumice and scoria; and the beaches of Pumice Isle off the east coast are heaped with the pumice it has thrown out. Geothermal power stations supply the whole island with electricity and heat, hot spring water is piped into hotels, sanatoria, greenhouses and homes, and the streets do not freeze in winter. Warmspring Island has a mild, damp oceanic climate with little hard frost in winter, yet the summit is snow-covered all year; the Warmspring Ice Cap, over 360 km² with a mean elevation above 2,100 m, is the only ice cap in the islands, and the heat of the crater keeps a ring of open water melted at its centre all year, the snow and ice constantly melting under the volcano's heat and constantly building up again, their meltwater running down the slopes into the rivers on every side. The crater beneath the ice cap makes a striking meeting of fire and ice. Monitoring stations track earthquakes and ground movement all year and issue climbing notices accordingly.\nClimbers reach Crater Peak from the Klettstad side along the edge of the ice cap and must go with a guide; summer is the season for the summit, and in winter it is often lost in wind and snow. Those who reach the top pick up a piece of cooled scoria on the crater rim to take home, and the guides remind them to take only one, saying the volcano \"keeps accounts\". The warm lake at the centre of the ice cap does not freeze even in winter, and its steam condenses in the cold air into a white column that Klettstad's fishermen steer by at sea, calling it \"the chimney on the mountain\". Households on the lower slopes put eggs in a net bag and lower them into the hot springs beside the fumaroles, done in a quarter of an hour with a faint whiff of sulphur in the white; visitors call them \"volcano eggs\" and locals \"the mountain's breakfast\"."
  - id: nat_kdza0d
    subtype: mountain_range
    status: generated
    names:
      zh: 卡洛韦岭
      en: Calloway Ridge
      art-x-viking: Callowaygrat
      art-x-buckham: Cresta Calloway
    notes:
      zh: "卡洛韦岭是纵贯阿夫琳岛中部的山岭，最高处一千五百多米，从海上望去如一面鼓满的帆。山岭从东北端的灯塔区一直延伸到西南的维托斯，主峰卡洛韦峰海拔一千五百二十多米，耸立在阿夫琳湾畔，几乎全部高度都从海面算起；中段的费兰丁峰近一千五百米，可以同时眺望阿夫琳海峡与东南外海，两峰之间海拔一千二百多米的卡洛韦垭口是翻越山岭的鞍部。在维托斯一带，山岭伸展成一道道白色石灰岩山脊，维托斯的名字就来自这些白色的山。\n西北麓的卡洛韦堡区是林场和山区小镇，东麓的望海区山坡上种满苹果、梨和樱桃，东南麓则俯瞰萨尔塔维克湾的盐田和海上风电场。卡洛韦岭公路沿西北麓的阶地连接帆城与莫塞，全长近三百公里，阿夫琳纵贯高速沿东南侧的低丘延伸，从垭口附近的山脚下经过。夏季高山草甸上野花盛开，徒步者从垭口沿山脊攀登两座高峰；冬季山顶积雪，从海上望去像一面白帆，山间有越野滑雪道，常能看到极光在山脊上空舞动。\n望海区的果农说，卡洛韦岭这面「帆」替果园挡住了西北来的冷风，苹果才能在海边结得又红又甜，秋天收获时果农们会在山脚办一场「谢帆节」。邮轮进港时，许多乘客第一眼把卡洛韦峰当成一片低垂的云，等船靠近才发现那是一整座从海里站起来的山。"
      en: "Calloway Ridge runs down the middle of Aveline Island, rising to over 1,500 m, and from the sea looks like a full sail. It stretches from Lighthouse District at the north-eastern end to Hvitås in the south-west; its main summit, Mount Calloway at just over 1,520 m, rises above Aveline Bay with nearly all of its height measured from the sea, and Mount Ferrandine in the middle section, nearly 1,500 m, looks out over both Aveline Strait and the open sea to the south-east, with Calloway Saddle, a little over 1,200 m, the gap between the two peaks where the ridge can be crossed. Around Hvitås the ridge spreads out into white limestone crests, the white hills that give Hvitås its name.\nOn the north-western slopes Fort Calloway is forestry and hill towns, the eastern slopes of Seawatch are planted with apples, pears and cherries, and the south-eastern slopes look down on the salt pans and offshore wind farm of Saltavik Bay. The Calloway Ridge Road follows the north-western terraces from Sail Town to Måsey for nearly 300 km, and the Aveline Spine Expressway runs along the low hills on the south-eastern side, passing below the saddle. In summer the alpine meadows are full of wild flowers and walkers climb both peaks along the crest from the saddle; in winter the summits are snow-covered and look from the sea like a white sail, there are cross-country ski trails, and the aurora often dances over the ridge.\nSeawatch's fruit growers say the \"sail\" of Calloway Ridge shields their orchards from the cold north-westerly winds, which is why apples ripen so red and sweet beside the sea, and at harvest they hold a \"Thank-the-Sail Festival\" at the foot of the ridge. When cruise ships come in, many passengers first take Mount Calloway for a low-hanging cloud, and only as the ship draws near do they see that it is a whole mountain standing up out of the sea."
  - id: nat_9bt7gf
    subtype: mountain_range
    status: generated
    names:
      zh: 锚链山
      en: Anchor Chain Mountains
      art-x-viking: Ankerkettengebirge
      art-x-buckham: Monti della Catena
    notes:
      zh: "锚链山是纵贯阿克斯岛中部的山脉，主峰铁锚峰海拔两千零七十多米，是群岛除暖泉火山外最高的山地，一串山峰如出水的锚链，山脉和阿克斯岛都由此得名。铁锚峰北坡挂着群岛唯一的山岳冰川锚链冰川，南段的佩洛峰海拔一千九百多米，圆顶如船上的绞盘，俯瞰阿克斯维克湾。\n山脉的西坡直落海边，冰川在西岸和中部刻出一条条狭长的峡湾，两岸陡崖高达数百米，瀑布从崖顶直泻入海，山下的峡湾是天然的避风锚地。从大洋吹来的湿润西风在山前凝结成雾，迎风的西坡一年降水超过两千毫米，托克维克的清晨大多笼罩在海雾里；东坡相对干燥，山麓是松林和牧场，北段的富鲁海姆一带林海连绵。阿托高速以九公里长的锚链山隧道穿过主脊，把阿克斯维克与西岸的托克维克连起来；阿克斯岛峡湾公路沿西岸峡湾的阶地绕行湾头，全长四百五十多公里，沿途设有多个观景停车点。\n托克维克的渔民说海雾是锚链山「呼出的气」，早上雾越浓，下午天越晴，所以雾大的早晨他们反而不慌，先喝咖啡、补网，等雾散了再出海。峡湾公路上的司机也有自己的规矩：遇到瀑布旁的停车点，总要停下来接一壶山泉水，说是比镇上买的任何饮料都甜。"
      en: "The Anchor Chain Mountains run down the middle of Akkersey; their main summit, Iron Anchor Peak at just over 2,070 m, makes them the highest range in the islands apart from Warmspring Volcano, and the string of summits is like an anchor chain rising from the water, which gave both the range and Akkersey their names. The Anchor Chain Glacier, the only mountain glacier in the islands, hangs on the north face of Iron Anchor Peak, and in the south Mount Pellow, a little over 1,900 m with a dome like a ship's capstan, overlooks Akkersvik Bay.\nThe western slopes drop straight to the sea, and glaciers have carved long, narrow fjords into the west coast and the middle of the range, with cliffs hundreds of metres high on either side and waterfalls plunging from their tops into the sea; the fjords below are natural sheltered anchorages. Damp westerlies off the ocean condense into fog against the mountains, the windward western slopes get more than 2,000 mm a year, and most mornings in Tåkevik are wrapped in sea fog; the eastern slopes are drier, with pine forest and pasture at their feet, and around Furuheim in the north the forest runs on unbroken. The Akkersvik–Tåkevik Expressway pierces the main ridge in the nine-kilometre Anchor Chain Tunnel, linking Akkersvik with Tåkevik on the west coast, and the Akkersey Fjord Road follows the terraces of the western fjords round the heads of the inlets for more than 450 km, with many viewpoints and lay-bys along the way.\nTåkevik's fishermen say the fog is the mountains \"breathing out\": the thicker it is in the morning, the clearer the afternoon, so on foggy mornings they are in no hurry, drinking coffee and mending nets first and going out once it lifts. Drivers on the fjord road have their own custom: at the lay-bys beside the waterfalls they always stop to fill a flask with spring water, which they say is sweeter than anything you can buy in town."
