# Named natural features of the Viking Islands.
# subtype follows OSM natural=* values. Geometry is produced by the generator
# (see world/generator/cn-vk.yaml); this file only holds identity and semantics.
features:
  - id: nat_bb9whq
    subtype: mountain_range
    status: generated
    names:
      zh: 龙骨山
      en: Keel Hills
      art-x-viking: Kielberge
      art-x-buckham: Colli della Chiglia
    notes:
      zh: 纵贯长船岛的低山脊，主峰船首峰海拔一千二百九十多米，是长船岛的最高点，山形如倒扣的船龙骨，这也是长船城名来历的传说之一。山脊从北岬一带向西南延伸，经西岸、长滩和龙骨，直到船尾的舵峰，把长船岛分成东西两岸。龙骨镇坐落在山脚下，山坡上是连绵的云杉、冷杉和松树林场；龙骨山滑雪场建在北坡，冬季长船和舵港的滑雪者蜂拥而至，夏季变成山地自行车公园和高山草甸徒步线，山顶的观景台可以同时看到东西两侧的大海。西南段的龙骨口是最低的山口，龙骨山公路沿山麓纵贯全岛，长船西岸高速也沿山脚延伸。
      en: The low ridge running the length of Longship Island, its main summit Prow Peak a little over 1,290 m and the island's highest point; it is shaped like an upturned keel, one of the stories behind Longship's name. It runs south-west from the North Cape area through West Shore, Longbeach and Keel to Rudder Peak at the stern, dividing the island into its east and west coasts. The town of Keel lies at its foot, and its slopes are covered with spruce, fir and pine plantations. The Keel Hills ski area on the north slope draws crowds of skiers from Longship and Rudderhaven in winter and becomes a mountain-bike park and alpine meadow trails in summer, and the lookout on top sees the sea on both sides of the island at once. Keel Gap in the south-west is its lowest pass; the Keel Hills Road runs the length of the island along its foot, and the Longship West Shore Expressway follows it too.
  - id: nat_1kngjx
    subtype: volcano
    status: generated
    names:
      zh: 暖泉火山
      en: Warmspring Volcano
      art-x-viking: Warmquellvulkan
      art-x-buckham: Vulcano Fontecalda
    notes:
      zh: 暖泉岛中央的活火山，主峰火口峰海拔两千二百八十多米，是群岛的最高点，山顶覆盖着暖泉冰帽，火口内终年冒着蒸汽。整座暖泉岛就是这座火山堆成的圆形火山岛，河流从火山向四面流入大海，暖河和灰河都发源于它的山坡。火山的地热让山麓遍布温泉、喷气孔和地热田：东麓的温泉区以露天温泉闻名，南麓的硫磺湾有泥火山和地热温室，黑沙区的黑沙滩由火山喷发的玄武岩碎屑形成，西麓的岩港开采玄武岩、浮石和火山渣，地热电站为全岛供应电力和暖气。火山监测站常年监测地震和地表变形。冰帽下的火山口与冰川相映，形成冰与火交融的奇观。
      en: "The active volcano at the centre of Warmspring Island; its main summit, Crater Peak, a little over 2,280 m, is the highest point in the islands, capped by the Warmspring Ice Cap, with steam rising from the crater all year. The whole of Warmspring Island is the round cone this volcano has built, with rivers running from it to the sea on every side, among them the Warm River and the Ash River. Its heat fills the foothills with hot springs, fumaroles and geothermal fields: Hot Springs District to the east is famous for its open-air pools, Sulphur Bay to the south has mud pots and geothermal greenhouses, the black beaches of Black Sand are made of basalt grit from its eruptions, Rockhaven to the west quarries its basalt, pumice and scoria, and geothermal power stations supply the whole island with electricity and heat. Monitoring stations track earthquakes and ground movement all year. The crater beneath the ice cap makes a striking meeting of fire and ice."
  - id: nat_kdza0d
    subtype: mountain_range
    status: generated
    names:
      zh: 帆影岭
      en: Sailshadow Ridge
      art-x-viking: Segelschattengrat
      art-x-buckham: Cresta Ombra di Vela
    notes:
      zh: 纵贯白帆岛中部的山岭，最高处一千五百多米，从海上望去如一面鼓满的帆，白帆岛由此得名。山岭从东北端的灯塔区一直延伸到西南的白岭，主峰帆影峰耸立在帆港湾畔，中段的望海峰可以同时眺望白帆海峡与东南外海；在白岭一带，山岭伸展成一道道白色石灰岩山脊。西北麓的帆影区是林场和山区小镇，东麓的望海区山坡上种满苹果、梨和樱桃。帆影岭公路沿西北麓的阶地连接帆城与银鸥，白帆纵贯高速沿东南侧的低丘延伸，以望海隧道穿过中段的山脚。夏季高山草甸上野花盛开，冬季则有越野滑雪，常能看到极光在山脊上空舞动。
      en: "The ridge running down the middle of White Sail Island, a little over 1,500 m at its highest; seen from the sea it looks like a full sail, which gave the island its name. It runs from Lighthouse District in the north-east to Whiteridge in the south-west: its main summit, Sailshadow Peak, rises above Sail Harbour Bay, Seawatch Peak in the middle looks over both White Sail Strait and the open sea to the south-east, and around Whiteridge the ridge spreads into a series of white limestone crests. On the north-west side Sailshadow District is a land of forestry and small mountain towns, while the eastern slopes of Seawatch are planted with apples, pears and cherries. The Sailshadow Ridge Road follows the terraces along the north-west foot between Sail Town and Silvergull, and the White Sail Spine Expressway keeps to the low hills on the south-east side, tunnelling under the middle of the ridge at Seawatch. In summer the high meadows are full of flowers; in winter there is cross-country skiing, and the aurora often dances above the crest."
  - id: nat_9bt7gf
    subtype: mountain_range
    status: generated
    names:
      zh: 锚链山
      en: Anchor Chain Mountains
      art-x-viking: Ankerkettengebirge
      art-x-buckham: Monti della Catena
    notes:
      zh: 纵贯锚岛中部的山脉，主峰铁锚峰海拔两千零七十多米，是群岛除暖泉火山外最高的山地，一串山峰如出水的锚链，山脉和锚岛都由此得名。山脉的西坡直落海边，冰川在西岸和中部刻出一条条狭长的峡湾，两岸陡崖高达数百米，瀑布从崖顶直泻入海，山下的峡湾是天然的避风锚地。从大洋吹来的湿润西风在山前凝结成雾，雾湾的清晨大多笼罩在海雾里。铁锚峰北坡挂着锚链冰川，南段的绞盘峰俯瞰锚湾。锚雾高速以九公里长的锚链山隧道穿过主脊，锚岛峡湾公路沿西岸峡湾的阶地绕行湾头，沿途设有多个观景停车点。
      en: The range running down the middle of Anchor Island, its main summit Iron Anchor Peak a little over 2,070 m high, the highest ground in the islands after Warmspring Volcano; its line of summits looks like an anchor chain rising from the sea, which gave both the range and the island their names. Its western slopes drop straight to the sea, and glaciers have cut long, narrow fjords into the west coast and the interior, walled by cliffs hundreds of metres high with waterfalls plunging into the sea; the fjords below are natural sheltered anchorages. Moist westerlies off the ocean condense into fog against the mountains, so Mistbay spends most mornings under sea mist. The Anchor Chain Glacier hangs on the north face of Iron Anchor Peak, and Capstan Peak in the south looks down on Anchor Bay. The Anchorhaven–Mistbay Expressway passes under the main ridge in the 9 km Anchor Chain Mountains Tunnel, and the Anchor Island Fjord Road keeps to the terraces of the western fjords, going round their heads, with many viewpoints along the way.
