# Named natural features of Ranova. Geometry is produced by the generator (see world/generator/ranova.yaml);
# this file only holds identity and semantics. Names are Chinese, English and Ranovan (art-x-ranova)
# or Kasiri (art-x-kasiri).
features:
  - id: nat_0qx3pm
    subtype: mountain_range
    status: generated
    names: {zh: 马洛卡山, en: Maroka Massif, art-x-ranova: Tendrombohitra Maroka}
    notes:
      zh: "马洛卡山是拉诺瓦岛北部的花岗岩山地，位于阿瓦拉齐社会主义共和国境内，主峰海拔 3209 米，是全岛地势最高的地方，也被看作阿瓦拉齐的屏障。迎着东北信风的东坡终年云雾缭绕，覆盖着茂密的山地雨林，林下溪涧纵横；背风的西坡干燥得多，是灌木和草地。山中的河流向东注入大海，向西流进稻作河谷，灌溉着阿瓦拉齐的稻田和甘蔗园。山地西南的马罗瓦托一带蕴藏着铬和镍，马沃重载铁路把矿石运往首都沃希马希的港口。\n阿瓦拉齐人说「马洛卡山挡住了风暴，也挡住了敌人」。雨季的风暴从东面扑来，大部分雨水倾泻在东坡上，西坡的河谷因此少受风灾。高原战争中，人民军的指挥部就设在山中的隧道里，据说隧道里有发电机、印刷机和野战医院，前线的命令从这里经电话线和骑摩托车的通信兵送出。停火以后，一部分隧道改作粮库，另一些仍是军事禁区，登山的人须绕道而行。\n东坡的山村以采野蜂蜜和种山茶为生，西坡的牧人赶着瘤牛在草坡上放牧，雨季前把牛群赶回河谷。每逢国庆前后，工农赤卫队的年轻人常被组织来登山拉练，山顶的石堆上插满了红旗，山下的人开玩笑说，那是全国离天最近的标语。"
      en: "The Maroka Massif is the granite upland of northern Ranova, inside the Socialist Republic of Avaratsy. Its main peak, at 3209 m, is the highest ground on the island, and the massif is seen as Avaratsy's shield. The eastern side, facing the north-east trades, is wrapped in cloud all year under dense montane rainforest laced with streams; the sheltered western side is far drier, with scrub and grass. Its rivers run east to the sea and west into the rice valleys, watering Avaratsy's paddies and cane fields. To the south-west, around Marovato, lie deposits of chromium and nickel, and the Marovato–Vohimahy Heavy-Haul Railway carries the ore to the harbour of the capital, Vohimahy.\nAvaratsy people say that \"the Maroka keeps out the storms, and the enemy too\". The rainy-season storms come in from the east and drop most of their rain on the eastern slopes, so the valleys to the west suffer little wind damage. In the Highland War the People's Army had its headquarters in tunnels inside the mountain; the tunnels are said to have held generators, printing presses and a field hospital, and orders went out to the front by telephone wire and by dispatch riders on motorcycles. Since the ceasefire some of the tunnels have become grain stores, while others are still a military zone that climbers must walk around.\nThe villages on the eastern slopes live by gathering wild honey and growing mountain tea; on the western slopes herders graze zebu on the grassy hillsides and bring the herds back down to the valleys before the rains. Around National Day the young members of the Workers' and Peasants' Red Guards are often marched up the mountain on training climbs, and the summit cairn bristles with red flags, which people below joke is the slogan closest to heaven in the whole country."
  - id: nat_k2kne7
    subtype: plateau
    status: generated
    names: {zh: 安德里纳高原, en: Andrina Highlands, art-x-ranova: Lembalemba Andrina}
    notes:
      zh: "安德里纳高原纵贯拉诺瓦岛中部，海拔大多在八百到一千多米之间，最高点是西部海拔 2719 米的安卡瓦火山，是安博哈拉基督教联邦的心脏。高原上是起伏的草地、红土丘陵和层层梯田，气候凉爽，首都安博哈拉就坐落在高原中部八百多米的台地上，十二座山丘环绕着旧城。高原东缘以法拉纳断崖陡落到东海岸，西缘缓缓降向西部的稀树草原。安博河发源于首都附近，向西北流向瓦凡博；马纳纳河则从高原西坡出发，向西流入萨希利亚。\n联合共和国时期，这里是全岛的政治和宗教中心；大分裂后，高原各省成立了基督教联邦，北方的阿瓦拉齐随即与之爆发高原战争，人民军一度攻上高原，后被联邦军击退。高原由此成为高原战争的主战场，前线在高原北缘拉锯多年，最终在停火线上对峙至今。\n高原上的农民在梯田里种稻，在草坡上放养瘤牛，菲安特拉一带的梯田沿着山坡一直铺到河谷。瓦塔铁路从高原中部穿过，一头下到西北湾的瓦凡博，一头通往东海岸的塔马塔。星期日全国停业，高原的村庄里教堂钟声此起彼伏；旱季的清晨，红土路上结着薄霜，裹着披肩的农民赶着牛车去集市。"
      en: "The Andrina Highlands run down the middle of Ranova, mostly between 800 and over 1,000 m high, their highest point the 2719 m Ankava Volcano in the west, and they are the heart of the Christian Federation of Ambohara. Rolling grassland, red-earth hills and stepped terraces cover the plateau, the climate is cool, and the capital, Ambohara, stands on a terrace over 800 m up in the middle of it, its old town ringed by twelve hills. The eastern edge falls away over the Farana Escarpment to the east coast; the western edge slopes gently down to the savanna of the west. The Ambo River rises near the capital and flows north-west towards Vavambo, while the Manana River sets out from the western slopes and flows west into Sahiliya.\nUnder the United Republic this was the island's political and religious centre. After the Sundering the highland provinces founded the Christian Federation, and Avaratsy in the north at once went to war with it in the Highland War; the People's Army once fought its way up onto the plateau before the Federal Army drove it back. The highlands thus became the main battlefield of the Highland War, the front swinging back and forth along their northern edge for years until the two sides settled into the standoff along the ceasefire line that continues today.\nHighland farmers grow rice on the terraces and graze zebu on the grassy slopes, and around Fiantra the terraces run down the hillsides all the way to the valley floor. The Vavambo–Tamata Railway crosses the middle of the plateau, one end going down to Vavambo on the north-western bay and the other to Tamata on the east coast. On Sundays the whole country closes, and church bells ring out one after another across the highland villages; on dry-season mornings a thin frost lies on the red dirt roads as farmers wrapped in shawls drive their ox-carts to market."
  - id: nat_42cbxt
    subtype: volcano
    status: generated
    names: {zh: 安卡瓦火山, en: Ankava Volcano, art-x-ranova: Ankava}
    notes:
      zh: "安卡瓦火山是安德里纳高原西部的一座休眠火山，属于安博哈拉基督教联邦，海拔 2719 米，是高原的最高点。火山锥高高耸立在起伏的高原上，山顶有一个积水的火山口湖，湖水在晴天呈深蓝色，带着淡淡的硫磺味，雨季常被云雾遮住。火山灰土十分肥沃，山脚的安卡瓦城周围种满咖啡、玉米和果树，安卡瓦咖啡庄园的咖啡是联邦有名的出口货；城外还有石墨矿和国营兵工厂。安卡瓦地热电站利用火山的余热发电，为首都安博哈拉供电。\n拉诺瓦语里「安卡瓦」意为「冒烟的山」。老人说火山最后一次喷发时天空黑了三天，鸡不打鸣，牛群挤在一起不肯吃草，喷发过后的几年里庄稼却长得格外好。如今火山口偶尔还会冒出几缕白汽，地热电站的工程师们定期上山测量地温，山脚的村民则把这看作火山仍在「呼吸」的证据。\n登山步道从咖啡园一直通到火山口湖边，星期日做完礼拜，城里的家庭常带着野餐上山，在湖边铺开草席。湖边立着一座小十字架，据说是早年的传教士立的，路过的人会在下面放一束野花。采收季节，咖啡园的工人背着竹篓穿行在山坡上，空气里弥漫着烘豆的香味。"
      en: "Ankava Volcano is a dormant volcano in the western Andrina Highlands, in the Christian Federation of Ambohara, and at 2719 m it is the highest point of the highlands. Its cone stands high above the rolling plateau with a crater lake at the top, deep blue on clear days, with a faint smell of sulphur, and often hidden in cloud in the rainy season. Its ash soils are very fertile: coffee, maize and orchards cover the land around the town of Ankava at its foot, and the coffee of the Ankava Coffee Estate is one of the federation's well-known exports; outside the town there are also a graphite mine and a state arms factory. The Ankava Geothermal Power Station draws on the volcano's lingering heat to generate electricity for the capital, Ambohara.\nIn Ranovan \"Ankava\" means \"the smoking mountain\". The old people say that the last time it erupted the sky went dark for three days, the cocks did not crow and the cattle huddled together and would not graze, yet for some years afterwards the crops grew unusually well. Now and then a few wisps of white steam still rise from the crater; engineers from the geothermal station climb up regularly to measure the ground temperature, and the villagers below take it as proof that the volcano is still \"breathing\".\nA trail runs from the coffee gardens all the way to the crater lake, and after Sunday service families from the town often climb up with a picnic and spread their mats by the water. By the lake stands a small cross, said to have been put up by early missionaries, and passers-by leave a bunch of wild flowers beneath it. In the harvest season coffee workers with bamboo baskets on their backs move across the slopes, and the air smells of roasting beans."
  - id: nat_jcks74
    subtype: ridge
    status: generated
    names: {zh: 法拉纳断崖, en: Farana Escarpment, art-x-ranova: Hantsana Farana}
    notes: {zh: 安德里纳高原东缘的大断崖，绵延数百公里，从高原上陡落数百米到东部的丘陵和海岸平原。断崖迎着东北信风，雨水极多，覆盖着全岛最茂密的热带雨林，雨季时一道道瀑布带着红土倾泻而下。断崖上有水电站，断崖下是马索沃利（连同它在沿海战争中吞并的法尼里）、洛哈瓦托和最神圣的黎明千年国。沿海战争后，马索沃利与伊瓦洛公社之间的冻结战线就沿着伊瓦洛下方的断崖脚下延伸，爬上断崖的公路被雷区截断。, en: 'The great escarpment along the eastern edge of the Andrina Highlands, running for hundreds of kilometres and dropping several hundred metres from the plateau to the hills and coastal plains of the east. It faces the north-east trades and gets a great deal of rain, and is covered in the densest rainforest on the island; in the rains waterfall after waterfall pours red earth down its face. There are hydroelectric plants along the top, and Masovoly (with Faniry, annexed in the Coastal War), Lohavato and the Dawn Realm lie below. Since the Coastal War the frozen front between Masovoly and the Ivalo communes has run along the foot of the escarpment below Ivalo, and the road up the cliffs is cut by minefields.'}
  - id: nat_d5npq4
    subtype: mountain_range
    status: generated
    names: {zh: 伊瓦卡山, en: Ivaka Mountains, art-x-ranova: Ivaka}
    notes:
      zh: "伊瓦卡山是拉诺瓦岛南部的山地，大部分位于齐马罗沃民族社会主义帝国境内，最高处海拔 2601 米。伊拉希河发源于此，向东流经首都齐马罗沃所在的盆地，再穿过伊拉希河谷流向东海岸。山上是干燥的松林和草坡，旱季漫长，山火时有发生，山脊上残留着烧焦的树干；雨季时溪水暴涨，把红土冲进下游的河道。\n山谷里有齐马罗沃的军事基地和国营农场。国营农场按「血统证书」招募一等公民管理，田里的重活多由被强制迁来的劳工承担。南方战争期间，这里是齐马罗沃进攻阿拉齐纳牧区的出发地，部队从山谷里的基地出发，沿山路南下攻入原住民氏族的草原。国际调查机构记录的强迫迁徙，有不少就是从这一带开始的。\n山区人烟稀少，公路两旁每隔一段就有民族卫队的检查站，外人进山须持特别通行证，连运送补给的卡车司机也要在每个检查站出示证件。牧羊人在高处的草坡上放牧，秋天把羊群赶回山谷越冬。山里流传着许多关于逃亡者的故事：有人说，南方战争最激烈的年份，曾有牧民在夜里领着被驱逐的家庭翻过伊瓦卡山的山口，向南逃往阿拉齐纳。"
      en: "The Ivaka Mountains are uplands in southern Ranova, mostly inside the National Socialist Empire of Tsimarovo, rising to 2601 m. The Ilahy River rises here and flows east through the basin of the capital, Tsimarovo, then down the Ilahy valley to the east coast. Dry pine woods and grassy slopes cover the mountains; the dry season is long, wildfires are common and scorched trunks still stand on the ridges, while in the rainy season the streams swell and wash red earth into the rivers below.\nThe valleys hold Tsimarovo's military bases and state farms. The state farms are run by first-class citizens recruited according to the \"blood certificates\", while the heavy work in the fields falls mostly to labourers moved there by force. In the Southern War the mountains were the starting point of Tsimarovo's attacks on the Alatsina pastures, troops setting out from the valley bases and marching south along the mountain roads into the grasslands of the Indigenous clans. Many of the forced removals recorded by international investigators began in this area.\nThe mountains are thinly peopled, the roads are lined at intervals with checkpoints of the National Guard, and outsiders need a special pass to enter; even the drivers of supply lorries must show their papers at every checkpoint. Herders graze their flocks on the high grassy slopes and bring them back down to the valleys in autumn to winter there. Many stories of escape circulate in the mountains: some say that in the worst years of the Southern War herders led expelled families over the passes of the Ivaka Mountains by night, south to Alatsina."
  - id: nat_xe4fc1
    subtype: mountain_range
    status: generated
    names: {zh: 伊索卡山, en: Isoka Massif, art-x-ranova: Isoka}
    notes:
      zh: "伊索卡山是拉诺瓦岛西南部的崎岖山地，峡谷深切，森林茂密，最高处海拔 2434 米，是伊索卡人民战争解放区的根据地，也是解放区境内的最高点。解放区以这片山地为中心，伊索卡和东部的卡里是游击队的两个主要据点，伊索卡山顶观察哨和伊索卡山口检查站控制着进出山区的道路。山地四周分别是安博哈拉、梅纳瓦利、安博维和齐马罗沃，这四国都把解放区列为恐怖组织控制区。\n游击队的营地和兵工厂藏在山中的岩洞和密林里，三十多年来周边各国的军队多次进山清剿都无功而返，游击队自己也在清剿中遭受重创。人民战争党在山村中没收地主和种植园的土地分给农民，同时以严厉的手段处决「阶级敌人」和「告密者」，至今仍为当地人所恐惧；青少年常被征入游击队，许多家庭因此逃往邻国。\n山区贫困，道路稀少，居民靠梯田和放牧为生，没有货币，实行配给和集体劳动，一处小金矿是少有的收入来源。雨季时山路泥泞难行，峡谷里的溪流暴涨，连游击队的骡队也常被困在半路。山里的人说，伊索卡山的雾比任何哨兵都可靠：清剿部队的直升机来了，雾一合拢，山谷就什么也看不见了。"
      en: "The Isoka Massif is a rugged upland in south-western Ranova, deeply cut by gorges and thickly forested, rising to 2434 m. It is the base of the Isoka People's War Liberated Zone and also the highest point in it. The zone is centred on these mountains; Isoka and Kary to the east are the guerrillas' two main strongholds, and the Mount Isoka Lookout and the Isoka Pass Checkpoint control the roads in and out. Around the massif lie Ambohara, Menavaly, Ambovy and Tsimarovo, all four of which list the zone as a terrorist-held area.\nThe guerrillas' camps and workshops are hidden in caves and dense forest, and in more than thirty years the armies of the neighbouring states have gone into the mountains again and again without success, though the guerrillas themselves have also been badly mauled in these sweeps. In the mountain villages the People's War Party seized the land of landlords and plantations and handed it to the peasants, while executing \"class enemies\" and \"informers\" with great harshness, and local people still fear it; teenagers are often taken into the guerrilla forces, and many families have fled to neighbouring countries because of it.\nThe mountains are poor, with few roads; people live by terraced fields and herding, without money, under rationing and collective labour, and a small gold mine is one of the few sources of income. In the rainy season the mountain paths turn to mud and the streams in the gorges swell, often stranding even the guerrillas' mule trains halfway. People in the mountains say that the Isoka mist is more reliable than any sentry: when the helicopters of a sweep arrive, the mist closes in and nothing can be seen in the valleys."
  - id: nat_bjmj3q
    subtype: volcano
    status: generated
    names: {zh: 坦德罗圣山, en: Holy Mount Tendro, art-x-ranova: Tendro Masina}
    notes:
      zh: "坦德罗圣山是东南群岛中坦德罗岛上的一座古老火山，主峰海拔 2631 米，深红色的火山岩山体从海中拔地而起，几乎占满整座岛屿。山坡上散布着坦德罗古教会的二十座修道院，最高的修道院建在峰顶附近的悬崖上，峰顶另有一座小礼拜堂。圣山修道院与坦德罗骑士团的全部国土就是这座山和西北面的一座小岛，首府坦德罗是圣山脚下的港口小镇。\n据传，最早的修士从海上来到这里，在山洞中隐修，后来逐渐建起修道院，鹰岩和寂静谷的隐修处至今仍有修士独居。各国的基督徒都把到圣山朝圣看作一生的心愿，但登山需要僧团发放的通行证，每天限定人数，而且圣山区域只允许男性进入，女性朝圣者只能在首府和西北小岛上的女修道院朝拜。约一百五十名坦德罗骑士团的平信徒骑士守卫着朝圣步道和各座修道院。\n山坡下部是修道院的葡萄园、橄榄园和蜂箱，越往上越是陡峭的岩壁和灌木。朝圣者通常从港口出发，沿石阶步道走一整天，在半山的修道院借宿，修士们用面包、橄榄和自酿的葡萄酒招待客人。每年复活节前夜，二十座修道院同时点燃烛火，从海上望去，整座圣山像一棵挂满灯火的树。"
      en: "Holy Mount Tendro is an ancient volcano on the island of Tendro in the south-eastern isles. Its main peak rises to 2631 m, and its dark red volcanic rock climbs straight from the sea and fills almost the whole island. The twenty monasteries of the Old Church of Tendro are scattered over its slopes, the highest on a cliff just below the summit, and a small chapel stands on the summit itself. The mountain and a small island to the north-west are the whole territory of the Monastery of the Holy Mount and Knights of Tendro, and the capital, Tendro, is the little harbour town at its foot.\nTradition holds that the first monks came here by sea and lived as hermits in the caves before gradually building monasteries, and monks still live alone at the hermitages of Eagle Rock and the Silent Valley. Christians of every country count a pilgrimage to the Holy Mount as a lifelong wish, but climbing it needs a permit from the brotherhood, numbers are limited each day, and only men may enter the mountain itself; women pilgrims can worship only in the capital and at the convent on the small island to the north-west. About one hundred and fifty lay knights of the Knights of Tendro guard the pilgrim paths and the monasteries.\nThe lower slopes are the monasteries' vineyards, olive groves and beehives; higher up there is only steep rock and scrub. Pilgrims usually set out from the harbour and climb the stone stairway for a whole day, sleeping at a monastery halfway up, where the monks feed their guests bread, olives and their own wine. On the eve of Easter all twenty monasteries light their candles at the same moment, and from the sea the whole mountain looks like a tree hung with lights."
  - id: nat_f4w8r2
    subtype: mountain_range
    status: generated
    names: {zh: 贾巴勒丘陵, en: Jabal Hills, art-x-kasiri: Jabal}
    notes:
      zh: "贾巴勒丘陵是拉诺瓦岛西北部干燥的石灰岩丘陵，大部分海拔一千多米，最高处 1845 米。山谷狭窄，泉水稀少，谷底有小块农田和枣椰林，山坡上开着窄窄的梯田，种着大麦和高粱，牧人赶着山羊和瘤牛在灌丛间觅食。卡西里语里「贾巴勒」就是「山」的意思。联合共和国时期，西北山区是全岛最贫困、最闭塞的地方。\n丘陵现为贾巴利亚伊斯兰酋长国控制，这个由极端武装组织建立的政权没有获得任何国家承认，被各阵营和国际组织列为恐怖组织控制区，外人很少进入。主要城镇贾巴勒建在丘陵的山谷中，舒拉议事厅设在一座旧堡垒里，城外还有更古老的古堡遗址；山口设有收费检查站，向过往车辆收取过路费。武装组织在山洞里设指挥所，在山谷里藏着武器仓库和作坊，从这里向萨希利亚北部的城镇发动袭击，西岸战争由此延续了三十多年。\n控制区内禁止音乐和影像，女孩小学之后不得上学，三十多年来十四万多名居民逃离山区，在萨希利亚和邻国的难民营中生活。逃出来的人常常怀念山谷里的枣椰：每年秋天枣子成熟时，难民营里的老人会把托人捎来的几把干枣分给孩子，告诉他们家乡的泉水有多甜。近年部分部落长老与萨希利亚政府秘密谈判，谈判时断时续。"
      en: "The Jabal Hills are dry limestone hills in north-western Ranova, mostly over 1,000 m high and rising to 1845 m. The valleys are narrow and springs few; small fields and date groves lie on the valley floors, narrow terraces of barley and sorghum climb the slopes, and herders drive goats and zebu to forage among the scrub. In Kasiri \"jabal\" simply means \"mountain\". Under the United Republic the north-western uplands were the poorest and most isolated part of the island.\nThe hills are now held by the Islamic Emirate of Jabaliya, a regime set up by an extremist armed group that no state recognises and that the blocs and international organisations list as a terrorist-held zone; outsiders rarely go there. The main town, Jabal, lies in a valley among the hills, its Shura hall housed in an old fort, with the ruins of a still older fort outside the town; toll checkpoints on the passes charge passing vehicles. The armed group keeps command posts in caves and weapons caches and workshops in the valleys, and from here it attacks the towns of northern Sahiliya, which has kept the West Coast War going for more than thirty years.\nMusic and images are banned in the zone and girls may not attend school beyond primary level; over thirty-odd years more than 140,000 people have fled the hills and live in refugee camps in Sahiliya and neighbouring countries. Those who got out often miss the date palms of the valleys: every autumn, when the dates ripen, old people in the camps share out among the children a few handfuls of dried dates sent by someone back home, and tell them how sweet the springs there are. In recent years some tribal elders have been negotiating secretly with the government of Sahiliya, in talks that start and stall by turns."
  - id: nat_2df1pc
    subtype: mountain_range
    status: generated
    names: {zh: 金日山, en: Golden Sun Range}
    notes:
      zh: "金日山是太阳神国度中部东西走向的山脉，主脊海拔约 2400 米，最高处 2480 米，从国土中部横贯东西，把王国分成南北两半。山坡从谷底到山脊层层开成梯田，一直修进云里，种着土豆、金藜和高原谷物，也种着喂养维洛纳驼的牧草；这种长毛驮兽是山里唯一的运输工具。石砌的驿道沿山脊连接各个村社和王家粮仓，驿卒接力奔跑，一条消息一天之内就能从西海岸的安西拉送到东部隘口瓦瓦哈迪。\n王国的人相信太阳每天从山脊上升起时会先照到王宫和都城沃沃南德罗的太阳神庙，所以把这条山脉看作太阳在人间的台阶。大分裂时道路中断、集市无粮，守庙人召集各村派人修复金日山梯田、沿山间古道背运粮食，山里的村社因此熬过了饥荒，这段经历至今是王国立国故事的核心。王国改名后，山名仍保留旧称「金日」。\n梯田由村社共同修护，各家每年轮流服劳役，雨季前要把垮塌的石埂重新垒好；国际劳工机构把这种轮流劳役视为强迫劳动，村民离开所在的一方也须持结绳通行证。冬至那一夜，驿卒举着从金镜取来的新火沿山脊奔跑，从远处望去，一串火光在黑暗的山脊上缓缓移动。"
      en: "The Golden Sun Range is the east-west range across the middle of the Realm of the Sun God. Its main ridge stands at about 2400 m and its highest point at 2480 m, and it runs right across the middle of the country, dividing the kingdom into north and south. Its slopes are terraced from valley floor to ridge, the terraces climbing into the clouds, growing potatoes, golden quinoa and highland grain, as well as fodder for the vilona camels, the long-haired pack animals that are the only means of transport in the mountains. Stone relay roads along the crest link the village communities and the royal granaries, and relay runners pass messages hand to hand, carrying word from Ansira on the west coast to the eastern pass town of Vavahady within a single day.\nThe kingdom's people believe the rising sun touches the royal palace and the Temple of the Sun in the capital, Vovonandro, first as it clears the ridge, and call the range the sun's stair on earth. During the Sundering, when the roads were cut and the markets empty, the temple keeper called on every village to send people to repair the Golden Sun Terraces and carry grain along the old mountain paths, and the mountain communities came through the famine; that episode is still the heart of the kingdom's founding story. When the country was renamed, the range kept its old name, \"Golden Sun\".\nThe terraces are kept up by the village communities, each household taking its turn at labour service every year, and the fallen stone walls must be rebuilt before the rains; international labour bodies regard this rota of service as forced labour, and villagers need a knotted-cord pass to leave their quarter of the realm. On the night of the winter solstice the relay runners carry the new fire, lit from the golden mirror, along the crest, and from far off a string of flames can be seen moving slowly along the dark ridge."
  - id: nat_r6dgg2
    subtype: mountain_range
    status: generated
    names: {zh: 雪伞山, en: Snow Parasol Mountains}
    notes:
      zh: "雪伞山是转轮无边法王国内陆南北走向的山地，主峰一般记作约二千二百米，山地的最高处海拔 3089 米，也是王国的最高点。雪伞山隔开了王国和东面的齐马罗沃，山中有几处山口，雪伞山口哨所就设在其中一处。这里地处热带，山上从不下雪，「雪伞」之名来自佛经中护佑众生的白伞；法王国的人相信历代法王的转世都由山顶的云气预示，寻访司的僧人每逢法王圆寂，都要先上山观看云气的方向。\n据说很久以前，游方僧人从高原北部翻山而来，在雪伞山中建起第一座寺院，白伞宗由此发源。如今山坡和山谷里分布着大大小小的寺院，雪伞大寺是其中最重要的一座。土地全部属于寺院，农民为寺院耕种梯田和茶园，把收成的三分之一交给寺院粮仓，离开庄园须持住持签发的通行证。人权组织批评这一制度近似农奴制。\n谷底是红米和芋头的梯田，山坡上是茶园和云雾森林，雪伞溪上的小水电站为都城安巴尼埃洛供电。朝圣者沿着雪伞山转山道绕山而行，一圈要走好几天。齐马罗沃的民族卫队多次越过雪伞山口追捕逃亡者，山口一带的村民夜里常听见枪声。每年白伞节，各地农户背着新米翻山来到寺院。"
      en: "The Snow Parasol Mountains are the north-south uplands in the interior of the Kingdom of the Boundless Dharma Wheel. The main peak is usually given as about 2,200 m, while the highest point of the uplands reaches 3089 m, which is also the highest point in the kingdom. The mountains separate the kingdom from Tsimarovo to the east, and they are crossed by a few passes, at one of which stands the Snow Parasol Pass Post. This is the tropics and snow never falls here; the name comes from the white parasol of the scriptures that shelters all beings, and the kingdom's people believe the clouds on the summit foretell each rebirth of the Dharma King, so whenever a Dharma King dies the monks of the Office of Search first climb the mountain to watch which way the clouds drift.\nLong ago, it is said, wandering monks crossed the mountains from the north of the highlands and built the first monastery among these peaks, and the White Parasol school grew from it. Today monasteries large and small dot the slopes and valleys, the most important being the Great Monastery of the Snow Parasol. All the land belongs to the monasteries; farmers work their terraces and tea gardens, hand a third of the harvest to the monastery granaries, and need a pass signed by the abbot to leave the estate. Human rights groups say the system is close to serfdom.\nThe valley floors are terraces of red rice and taro, the slopes tea gardens and cloud forest, and a small hydro station on the Snow Parasol Brook supplies power to the capital, Ambanielo. Pilgrims walk the Snow Parasol Pilgrims' Circuit round the mountains, a circuit that takes several days. Tsimarovo's National Guard has crossed the Snow Parasol passes many times in pursuit of fugitives, and villagers near the passes often hear gunfire at night. At every White Parasol Festival farmers from all over the kingdom carry new rice over the mountains to the monasteries."
  - id: nat_jn52f2
    subtype: mountain_range
    status: generated
    names: {zh: 安多希山, en: Andohy Range, art-x-ranova: Andohy}
    notes:
      zh: "安多希山是拉诺瓦岛最南部的山脉，从南海岸向北延伸，最高处海拔 2126 米，是阿拉齐纳原住民邦联境内的最高点，也是九个氏族共同的圣地。山脚是干燥的草原，遍布猴面包树，西南面渐渐过渡到多刺灌木林和石灰岩台地。邦联的议事中心阿拉齐纳就坐落在山脚下的草原上，九个氏族的长老在城中的圆形议事场轮流主持会议。\n氏族的祖先墓地建在山坡的岩石间，石垒的墓室上竖着雕刻的木柱，柱上刻着瘤牛、船和星辰，记录着死者一生的事迹。每年旱季末、雨季开始之际，九个氏族的牧人赶着牛群汇聚到阿拉齐纳，各氏族再登上山坡举行祭祖仪式，献上牛只、蜂蜜和米酒，长老们在墓前向祖先报告这一年的收成、婚嫁和氏族之间的争端。仪式过后的赛牛会是一年中最热闹的日子。\n南方战争中，许多被齐马罗沃逐出牧区的家庭沿着山脚南迁，老人们说，只要还能望见安多希山，就不算离开了祖先的土地。如今山坡上仍有氏族共有的蓝宝石矿，矿工按氏族的规矩分配收益；开矿以前，长老要先到墓地请求祖先的允许。外人登山须由氏族的向导陪同，不得触碰墓地的木柱，也不得在墓前高声说笑。"
      en: "The Andohy Range is the range at the far south of Ranova, running north from the south coast. Its highest point, at 2126 m, is the highest in the Alatsina Indigenous Confederacy, and the range is sacred to all nine clans. Dry grassland dotted with baobabs spreads at its foot, giving way to the south-west to thorny scrub and limestone plateaus. The Confederacy's council seat, Alatsina, stands on the grassland at the foot of the range, where the elders of the nine clans take turns to chair the council on the round council ground in the town.\nThe clans' ancestral tombs stand among the rocks of the slopes: stone-built chambers topped with carved wooden posts showing zebu, boats and stars that record the deeds of the dead. Each year at the end of the dry season, as the rains begin, the herders of the nine clans drive their cattle to Alatsina, and each clan then climbs the slopes to honour its ancestors with offerings of cattle, honey and rice beer, the elders reporting to the forebears at the tombs on the year's harvest, marriages and quarrels between clans. The zebu races that follow the rites are the liveliest days of the year.\nIn the Southern War many families driven from their pastures by Tsimarovo moved south along the foot of the range, and the old people say that as long as you can still see the Andohy you have not left the land of your ancestors. The clans still share a sapphire mine on the slopes, and the miners divide its earnings by clan custom; before any digging begins, the elders must first go to the tombs to ask the ancestors' leave. Outsiders may climb only with a clan guide, and may neither touch the posts on the tombs nor talk or laugh loudly in front of them."
  - id: nat_1ndyaz
    subtype: volcano
    status: generated
    names: {zh: 萨马伊火山, en: Mount Samay, art-x-ranova: Samay}
    notes:
      zh: "萨马伊火山位于东南群岛萨马伊自由邦主岛的中部，海拔 2127 米，是自由邦的最高峰。山顶常年云雾缭绕，山坡上是茶园和雨林，山麓肥沃的火山灰土上种满可可、香草和咖啡，海边则是白沙滩和珊瑚礁。萨马伊自由邦的蓝色国旗上就有这座火山的剪影。萨安高速铁路绕过火山山麓，以一连串桥梁和隧道连接首都萨马伊和东部的安提瓦，列车以时速 400 公里在山脚的雨林间穿行。\n火山脚下的温泉是岛上的度假胜地。周末，首都的家庭开车来泡露天温泉，小贩在池边卖煮玉米、烤芭蕉和姜茶，学生们则在附近的旅舍里过夜复习功课。山顶有一座观景台，各派宗教的朝圣者常来这里祈祷：有人捻着念珠，有人铺开拜毯，也有人点起蜡烛，彼此互不打扰。萨马伊人喜欢说，火山是全国唯一一处所有宗教都承认的圣地。\n山腰的雨林里栖息着多种鹦鹉和变色龙，护林员每月沿步道巡查一次。山上的茶园多是小农经营，采茶季节，山路上排着运茶的小卡车，茶叶和咖啡一起从萨马伊港运往全岛和海外。每年三环节前后，登山步道上挤满了徒步的年轻人，许多人在山顶迎接日出，再赶回首都参加基督徒、穆斯林和佛教徒的联合游行。"
      en: "Mount Samay stands in the middle of the main island of the Free State of Samay in the south-eastern isles, and at 2127 m it is the Free State's highest peak. Its summit is usually in cloud, its slopes are covered in tea gardens and rainforest, cocoa, vanilla and coffee fill the rich volcanic soils at its foot, and the coast below is white sand and coral reef. The volcano's silhouette is on the Free State's blue flag. The Samay–Antiva high-speed railway skirts the foot of the mountain, linking the capital, Samay, with Antiva in the east through a chain of bridges and tunnels, its trains running at 400 km/h through the rainforest below the slopes.\nThe hot springs at the foot of the volcano are the island's favourite resort. At weekends families drive out from the capital to soak in the open-air pools while hawkers sell boiled maize, grilled plantain and ginger tea at the edge, and students stay overnight in the guesthouses nearby to revise. On the summit is a lookout where pilgrims of every faith come to pray, some telling their beads, some unrolling prayer mats, some lighting candles, none disturbing the others. People in Samay like to say that the volcano is the only holy place in the country that every religion accepts.\nMany kinds of parrot and chameleon live in the rainforest on the middle slopes, and rangers walk the trails once a month. The tea gardens on the mountain are mostly smallholdings, and in the picking season small lorries queue on the mountain roads to carry the leaf down; tea and coffee leave together through the Port of Samay for the rest of the island and overseas. Around the Festival of the Three Rings the trails fill with young hikers, many of whom watch the sunrise from the summit before hurrying back to the capital for the joint procession of Christians, Muslims and Buddhists."
  - id: nat_6bzxtr
    subtype: mountain_range
    status: generated
    names: {zh: 努西拉丘陵, en: Nusira Hills, art-x-kasiri: Milima ya Nusira}
    notes:
      zh: "努西拉丘陵位于西北群岛努西拉苏丹国的主岛上，最高处海拔 1821 米，是苏丹国的最高点。丘陵岩石裸露，干燥多风，山坡上只有稀疏的灌木和耐旱的草丛，雨季短暂，山谷里的干河床一年中大半时间滴水不流。山谷里铺设着苏丹国的油气管道，把近海油气田的产品输往炼油厂和石油港，谷口一带还建有海水淡化厂，为首都努西拉和周边的村镇供水。\n丘陵最高处的古城堡是苏丹家族的发祥地。很久以前，在群岛上经商的卡西里世家在这里修筑了瞭望海面的堡垒，后来家族的势力扩展到整个群岛；如今城堡是王室的避暑行宫，夏天苏丹和王室成员会来这里躲避海边的湿热，城堡的大门平时不对外开放。山脚的村民说，城堡上升起王旗，就知道苏丹回到山上来了。\n丘陵的气候比海边凉爽，周末常有首都的家庭开车上山，在路边的观景处喝着加了豆蔻的咖啡看日落。牧羊人赶着山羊在岩石之间觅食，石缝里长出的野生百里香被采来做香料，山谷的集市上一小包就能卖出好价钱。外籍劳工在管道和淡化厂里轮班，他们的工棚散落在山谷的公路边，与山顶的行宫遥遥相对。"
      en: "The Nusira Hills stand on the main island of the Sultanate of Nusira in the north-western isles, and their highest point, at 1821 m, is the highest in the Sultanate. They are bare-rocked, dry and windy, with only sparse scrub and drought-hardy grasses on the slopes; the rains are short, and the dry riverbeds in the valleys carry no water for most of the year. The Sultanate's oil and gas pipelines run along the valleys, carrying the output of the offshore fields to the refinery and the oil port, and desalination plants near the valley mouths supply water to the capital, Nusira, and the towns and villages around it.\nThe old castle on the highest hill is where the Sultan's family began. Long ago the Kasiri merchant house that traded across the islands built a fort here to watch the sea, and in time the family's power spread over the whole archipelago; today the castle is a royal summer palace, where the Sultan and the royal family come in summer to escape the humid heat of the coast, and its gates are normally closed to the public. Villagers at the foot of the hills say that when the royal standard is raised over the castle, they know the Sultan has come back to the mountain.\nThe hills are cooler than the coast, and at weekends families from the capital often drive up to sip cardamom coffee at the roadside lookouts and watch the sunset. Shepherds drive goats to forage among the rocks, and the wild thyme that grows in the cracks is gathered as a spice, a small packet of which fetches a good price at the valley markets. Foreign workers work shifts at the pipelines and desalination plants, and their huts are scattered along the valley roads, looking up across the hills at the palace on the summit."
  - id: nat_5bqna9
    subtype: plateau
    status: generated
    names: {zh: 贝马希石林台地, en: Bemahy Stone Forest Plateau, art-x-ranova: Bemahy}
    notes:
      zh: "贝马希石林台地是拉诺瓦岛西部的石灰岩台地，最高处海拔 1283 米，也是萨希利亚伊斯兰共和国境内的最高点。雨水千万年来溶蚀岩石，切出成片尖利的石林和深深的裂谷，石峰如刀刃般林立，人和牛都难以通行，台地上几乎没有永久的村庄。石林中藏着溶洞、地下河和许多只有这里才有的动植物：狐猴在石峰之间跳跃，耐旱的多肉植物和小型兰花扎根在石缝里，溶洞深处的地下河里生活着眼睛退化的盲鱼。\n台地横亘在萨希利亚和贝洛瓦之间，是两国天然的边界。两国的边境巡逻队很少深入石林，只在台地边缘的谷口设哨；当地人说，石林里的路「只有雨水认得」。拉诺瓦语里「贝马希」意为「多刺的地方」，指的就是那些割破鞋底和衣裳的石刃。\n台地边缘的村民在石林外围的谷地里种玉米和木薯，雨季到来时，雨水沿着石缝迅速渗入地下，从台地脚下的泉眼里涌出，村子就靠这些泉水过旱季。贝洛瓦大学和萨希勒大学的研究者常结伴来考察溶洞，向导是熟悉山路的猎户。传说石林深处有一座溶洞，洞顶有一个天窗，正午时一束阳光直射洞底的水潭，猎户们把它叫作「太阳的井」。"
      en: "The Bemahy Stone Forest Plateau is a limestone plateau in western Ranova whose highest point, at 1283 m, is also the highest point in the Islamic Republic of Sahiliya. Over countless ages rain has dissolved the rock into fields of sharp stone pinnacles and deep clefts, the peaks standing like rows of blades that neither people nor cattle can easily cross, and there are almost no permanent villages on the plateau. Caves, underground rivers and many plants and animals found nowhere else hide among the stone forest: lemurs leap between the pinnacles, drought-hardy succulents and small orchids root in the cracks, and blind fish with shrunken eyes live in the underground rivers deep in the caves.\nThe plateau lies between Sahiliya and Belova and makes a natural border between them. Border patrols from both countries seldom go deep into the stone forest and keep their posts at the mouths of the valleys around its edge; local people say that the paths through the pinnacles are \"known only to the rain\". In Ranovan \"Bemahy\" means \"the thorny place\", after the stone blades that cut through shoe soles and clothing.\nVillagers around the edge of the plateau grow maize and cassava in the valleys outside the stone forest. When the rains come, the water sinks quickly through the cracks and wells up again from springs at the foot of the plateau, and the villages live on these springs through the dry season. Researchers from the University of Belova and the University of Sahil often come together to survey the caves, guided by hunters who know the paths. Legend tells of a cave deep in the stone forest with an opening in its roof through which, at noon, a shaft of sunlight falls straight onto a pool on the floor; the hunters call it \"the sun's well\"."
  - id: nat_w5rzfx
    subtype: mountain_range
    status: generated
    names: {zh: 沃希阿拉丘陵, en: Vohiala Hills, art-x-ranova: Havoana Vohiala}
    notes:
      zh: "沃希阿拉丘陵是马索沃利民主主义人民共和国首都安德里安巴海湾西岸的一道东西走向的小山岭，主峰海拔 686 米，是安德里安巴市境的最高点。主峰在山岭西段，东段是一道陡峭的窄脊，沃希阿拉隧道从窄脊下面穿过，过了窄脊，山岭才没入海湾边的低地，山坡上是茂密的雨林，拉诺瓦语里「沃希阿拉」意为「森林山」。\n山岭把海湾西岸的丘陵分成南北两片盆地：南面的拉诺迈措湖一带是领袖的拉诺迈措湖官邸区，北面的法里希凯利湖一带是党和国家高层领导人居住的法里希凯利湖干部区。两地之间只有一条穿山而过的人民军军用2964公路，干部们每天由领袖保卫局的汽车经隧道进入官邸区，傍晚前必须原路返回。\n整片丘陵都是军事禁区，山脊上设有领袖保卫局的哨所和雷达，原来住在山里的村民在官邸区修建时被成批迁往菲拉纳的国营农场。外国情报机构根据卫星图像推测，山腹里还挖有连通两片盆地的地下坑道，官方从未承认。"
      en: "The Vohiala Hills are a small east–west range on the western shore of the bay of Andriamba, capital of the Democratic People's Republic of Masovoly. Their summit, at 686 m, is the highest point of the city's territory. The summit is in the west; to the east the range narrows into a steep crest, under which the Vohiala Tunnel passes, before sinking into the low ground by the bay. Its slopes are clothed in dense rainforest; in Ranovan 'Vohiala' means 'forest hill'.\nThe range splits the hills west of the bay into two basins: to the south, around Lake Ranomaitso, lie the leader's Lake Ranomaitso Residences, and to the north, around Lake Farihikely, the Lake Farihikely Cadre Quarter where the party and state leadership live. The only link between them is People's Army Military Road 2964 through the hills; every day the cadres are driven through the tunnel into the Residences in Leader's Guard Bureau cars, and they must return the same way before nightfall.\nThe whole range is a military zone, with Leader's Guard Bureau posts and radars along the crest, and the villagers who once lived in the hills were moved in batches to the state farms of Firana when the Residences were built. Foreign intelligence services believe from satellite images that tunnels dug through the hills also join the two basins underground; the government has never admitted it."
