    names:
      zh: 彭纳西鲁河
      en: Pennasiru River
      art-x-ivuran: Pennasiru
    notes:
      zh: "彭纳西鲁河是彭纳拉姆市西南的河流，全长约 180 公里，流域面积约 2 万平方公里，伊武兰语叫「Pennasiru」，意为「胡椒之河」。河流从蒂拉凯苏山脉西南段的山地流下，穿过山坡上的香料园和沿海的稻田，在蒂拉凯湾入海。蒂拉凯湾面积约 290 平方公里，湾边是蒂拉凯区的渔村和海滩，渔船清晨出海、午后回港，渔获在码头边直接拍卖，海滩上的家庭旅馆以看日落闻名。彭纳拉姆是领地的香料之城，城名意为「胡椒之城」，古王国时代起，胡椒就从山里顺着这条河而下，在河口装船运往远方，河口的老仓库如今改成了香料博物馆。从前的香料商队也走陆路，翻过彭纳瓦苏山口把胡椒运往哈努西鲁河谷和三角洲，但大宗的货物还是靠河运最省力。\n如今河上运的多是游客和渔获，胡椒改走公路和港口，可收获季里两岸的屋顶和院子照旧铺满晾晒的胡椒，顺河漂下的香味一直飘到湾口。湾边家庭旅馆的主人会在日落前半小时敲门提醒客人，大家端着杯子坐到沙滩上，看太阳落进海里。\n香料博物馆里陈列着老商人的木秤和账本，账本里一斤胡椒的价钱常常比一斤稻米高出几十倍，馆员说，彭纳拉姆的老房子多半是用这条河运出去的胡椒盖起来的。"
      en: "The Pennasiru is a river south-west of Pennaram City, about 180 km long with a basin of about 20,000 km²; in Ivuran it is \"Pennasiru\", meaning \"river of pepper\". It comes down from the hills of the south-western Tirakesu Mountains, through spice gardens on the slopes and rice fields near the coast, and enters Tirakkai Bay. The bay, about 290 km², is fringed by the fishing villages and beaches of Tirakkai District, whose boats put out at dawn and return in the afternoon, their catch auctioned right on the quay, and whose family guesthouses are famous for their sunsets. Pennaram is the territory's city of spice, its name meaning \"city of pepper\", and since the days of the old kingdom pepper has come down this river from the hills to be loaded onto ships at the mouth and sent far away; the old warehouse at the mouth is now a spice museum. Spice caravans also went overland in the past, carrying pepper over the Pennavasu Pass to the Hanusiru valley and the delta, but bulk cargo always went most easily by river.\nToday the river carries mostly visitors and fish, and the pepper goes by road and through the port, yet at harvest time the roofs and yards along both banks are still spread with drying pepper, and its scent drifts downstream all the way to the mouth of the bay. Half an hour before sunset the hosts of the guesthouses on the bay knock on their guests' doors, and everyone takes a glass down to the beach to watch the sun sink into the sea.\nThe spice museum displays old merchants' wooden scales and ledgers in which a measure of pepper often fetched dozens of times the price of the same weight of rice, and the curators say most of Pennaram's old houses were built on pepper shipped down this river."
