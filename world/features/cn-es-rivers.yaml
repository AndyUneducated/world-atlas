# Rivers and lakes of the Everlong Summer Islands Territory. River geometry is traced by the generator from
# the drainage: the two longest by named_rivers in world/generator/cn-es.yaml, the rest by `detect` at their
# mouths; lakes are placed by hydrology.lakes.
features:
  - id: nat_cr4hvt
    subtype: river
    status: generated
    names:
      zh: 哈努西鲁河
      en: Hanusiru River
      art-x-ivuran: Hanusiru
    wonder:
      zh: 世界最长的河流，长约 1400 公里
      en: The longest river in the world, about 1,400 km
    notes:
      zh: "哈努西鲁河是世界最长的河流，全长约 1400 公里，流域面积约 16.8 万平方公里，伊武兰语意为「大河」。河流发源于主岛中部的哈努帕拉高原，在米雷兰市哈努帕拉区的高原东南缘从断崖上跌落成瀑布，随后沿蒂拉凯苏山脉东南侧的长谷向西南流去。它先擦过洛米哈努国家公园管理区的边缘，再流过温达坎市的佩伦达区、托兰卡区和乌拉韦劳自然保护区的山脚，经瓦利凯市萨卢瓦伊区的内陆和彭纳拉姆市帕拉武尔区、埃拉库尔区的山地边缘，最后在主岛西南端分成众多汊道，冲积成哈努西鲁河三角洲。萨伦纳姆市就建在三角洲上，河水流过奥卢瓦尔区、门达卢尔区和皮拉凯区，在萨鲁凯区的哈努西鲁河口入海，河口离萨伦纳姆老城约九十公里。\n河谷是领地最重要的稻作区和交通走廊。蒂拉凯苏山脉挡住了西北来的雨云，山的西北坡常在下雨，东南的河谷却多晴天，农民说「山把雨留给了雨林，把太阳留给了稻田」。上游托兰卡区的河谷里有水电站和整齐的咖啡园，沿河村庄建在高出洪水线的台地上；中游佩伦达区的山坡上，水稻梯田一层层修到海拔一千多米。下游三角洲上的奥卢瓦尔区面积 3.2 万平方公里，是领地最大的稻米产区，河道和灌渠把稻田分成方格，一年两到三熟，稻米合作社收购的香米出口到世界各地。河水每年从高原带下大量淤泥，三角洲的人说「Hanu siru, hanu olu」，意思是「大河大，稻也大」。旧时西北海岸的香料商队翻过彭纳瓦苏山口，把胡椒运进河谷，再装船顺流而下；如今河口两岸是萨伦纳姆港的集装箱码头和散货码头，三角洲的稻米、香料和水产从这里装船出口。伊米穆高速在河口外以约 101 公里长的哈努西鲁河口跨海大桥从基鲁迈岛跨海登上主岛，那是世界最长的桥梁。\n河谷属热带季风气候，雨季旱季分明。雨季河水暴涨、漫进稻田，三角洲上许多地方要乘船往来；旱季水位回落，河滩露出大片沙洲，孩子们在上面放风筝、踢球。三角洲外缘的皮拉凯区海岸长满红树林，是鱼虾和水鸟的繁育地，退潮时成群的弹涂鱼在泥滩上蹦跳。河谷里的人管哈努西鲁河叫「大妈妈」，雨季洪水漫上河岸时，农民不慌不忙把船拴在屋柱上，说这是「大妈妈来给田送饭了」。老船工还爱跟外地人较真：别处的河是「流」下去的，哈努西鲁河是「走」下去的，从高原走到海边要走上好几个星期。每逢满月的「灯与月」之夜，河口港里的船只也挂起油灯，从河口望去，灯光一路连到旧王城。"
      en: "The Hanusiru is the longest river in the world, about 1,400 km long with a basin of about 168,000 km²; in Ivuran the name means 'great river'. It rises on the Hanupala Plateau in the middle of the main island, falls in waterfalls from the cliffs of the plateau's south-eastern edge in Hanupala District of Mirelan City, and then runs south-west down the long valley on the south-eastern side of the Tirakesu Mountains. It brushes the edge of the Lomihanu National Park Administration Zone, flows past the foot of Perunda District, Toranka District and the Uravelau Nature Reserve in Undakan City, passes through the interior of Saluvai District in Vallikkai City and along the edge of the uplands of Palavur and Elakur Districts in Pennaram City, and divides at last into many channels at the south-western end of the main island to build the Hanusiru Delta. Sarunnam City stands on the delta; the river flows through Oluvar, Mendalur and Pilakkai Districts and reaches the sea at the Hanusiru Mouth in Sarukkai District, about ninety kilometres from Sarunnam's old town.\nIts valley is the territory's greatest rice-growing land and its main corridor of travel. The Tirakesu Mountains hold back the rain clouds from the north-west, so that it is often raining on their north-western slopes while the valley to the south-east is sunny, and farmers say \"the mountains keep the rain for the rainforest and the sun for the rice\". In Toranka District upstream the valley holds hydroelectric stations and neat coffee gardens, with the riverside villages built on terraces above the flood line; in Perunda District midstream the rice terraces climb the slopes to more than 1,000 m. Downstream on the delta, Oluvar District, 32,000 km², is the territory's largest rice-growing area, its paddies cut into squares by channels and irrigation ditches, bringing in two or three harvests a year, and the fragrant rice bought by its co-operatives is exported all over the world. Every year the river brings down a great load of silt from the plateau, and the delta says \"Hanu siru, hanu olu\": big river, big rice. In the old days the spice caravans of the north-west coast crossed the Pennavasu Pass to carry pepper into the valley and ship it downstream; today both banks of the mouth are lined with the container and bulk terminals of Sarunnam Port, from which the delta's rice, spices and seafood are shipped abroad. Beyond the mouth the Imimu Expressway crosses the sea from Kirumai Island to the main island on the Hanusiru Mouth Bridge, about 101 km long, the longest bridge in the world.\nThe valley has a tropical monsoon climate with distinct wet and dry seasons. In the wet season the river rises and spills into the paddies, and much of the delta can only be reached by boat; in the dry season the water falls and wide sandbanks appear, where children fly kites and play football. The coast of Pilakkai District on the outer edge of the delta is thick with mangroves, a nursery for fish, prawns and water birds, where at low tide crowds of mudskippers hop across the mud. The valley calls the Hanusiru \"Big Mother\", and when the wet-season flood spills over the banks farmers calmly tie their boats to the house posts and say \"Big Mother has brought the fields their dinner\". Old boatmen like to correct visitors: other rivers flow down to the sea, but the Hanusiru walks, and it takes weeks to walk from the plateau to the coast. On the full-moon night of Vilaru Imolu the ships in the harbour at the mouth hang out oil lamps too, and from the mouth the lights run all the way to the royal city."
  - id: nat_prhp24
    subtype: river
    status: generated
    names:
      zh: 洛米西鲁河
      en: Lomisiru River
      art-x-ivuran: Lomisiru
    notes:
      zh: "洛米西鲁河是流经洛米兰雨林的大河，全长约 270 公里，流域面积约 2.5 万平方公里，伊武兰语叫「Lomisiru」，意为「森林之河」。河流发源于哈努帕拉高原西北缘，跌落成瀑布后穿过洛米哈努国家公园的雨林，在马纳卢区的马纳卢湾西侧入海，河口两岸是红树林。洛米哈努国家公园是领地最大的国家公园，面积约 7 万平方公里，低地雨林、沼泽林和山地雨林连成一片，栖息着犀鸟、云豹、长臂猿和上千种兰花，林间有巡护小道，河上有船往来。河上没有水坝，雨季河水漫进森林，形成大片季节性的淹水林。河口的马纳卢区名意为「河口」，有渔港和椰林，海滩是海龟的产卵地，产卵季节海滩夜间封闭；红树林是鱼虾的育苗场。瓦洛高速铁路以约 75 公里长的洛米西鲁河特大桥跨过河流和两岸的低地，这是领地最长的铁路桥。\n坐火车过桥的人说，窗外一边是望不到头的绿，一边是河上慢慢划着的独木舟，「进了洛米兰，连空气都是湿的」。产卵季的夜里，河口海滩上的志愿者打着红光手电，护送刚孵出的小海龟爬向大海。\n雨季淹水林里的鱼会游进林子里吃落下的果子，村民划着独木舟在树梢之间撒网，孩子们说这是一年里唯一能「在树上钓鱼」的季节。"
      en: "The Lomisiru is the great river of the Lomiran rainforest, about 270 km long with a basin of about 25,000 km²; in Ivuran it is \"Lomisiru\", meaning \"river of the forest\". It rises on the north-western edge of the Hanupala Plateau, falls in waterfalls and crosses the rainforest of Lomihanu National Park to reach the sea on the western side of Manalu Bay in Manalu District, between mangroves. Lomihanu National Park is the largest national park in the territory, about 70,000 km² of lowland rainforest, swamp forest and montane rainforest in one unbroken expanse, home to hornbills, clouded leopards, gibbons and a thousand kinds of orchid, with ranger trails through the forest and boats on the river. There are no dams on the river, and in the wet season it spills into the forest, flooding wide stretches of it for months. Manalu, the district at its mouth, whose name means \"river mouth\", has a fishing harbour and coconut groves, its beaches are turtle nesting grounds closed at night in the nesting season, and the mangroves are a nursery for fish and prawns. The Vallikkai–Lomiran High-Speed Railway crosses the river and the lowlands on either side by the Lomisiru River Bridge, about 75 km long and the longest railway bridge in the territory.\nPassengers crossing the bridge say there is endless green on one side of the train and canoes paddling slowly on the river on the other, and that \"once you are in Lomiran even the air is wet\". On nesting-season nights volunteers with red torches on the beaches at the river mouth escort newly hatched turtles down to the sea.\nIn the wet season the fish swim into the flooded forest to eat fallen fruit, villagers cast their nets among the treetops from canoes, and the children say it is the one time of year you can \"fish in the trees\"."
  - id: nat_xxg5nt
    subtype: lake
    status: generated
    names:
      zh: 翁贝尔哈努湖
      en: Lake Ombelhanu
      art-x-ivuran: Ombelhanu
    notes:
      zh: "翁贝尔哈努湖是哈努帕拉高原上的大湖，面积约 1590 平方公里，伊武兰语叫「Ombelhanu」，意为「大湖」，是领地最大的湖泊。湖面大部分在米雷兰市的哈努帕拉区，东南岸属翁贝尔区，首府米雷兰就建在这里。帕萨卢区的规划轴线湖光大道正对西北偏北约 27 公里外的湖面，翁贝尔区的湖滨步道和公共浴场是首府居民周末休闲的地方，湖畔还有领地的公共疗养院和水上运动中心；湖边的芦苇荡是水鸟的栖息地，村庄沿湖岸分布，渔家划船捕湖鱼。高原上一年降水两千六百多毫米，下午常有一场阵雨，雨后湖面上浮起一层薄雾。湖边的老人爱说「Ombel velau, selo imimu」，意思是「湖上有云，夏天就长」，翁贝尔哈努湖的水汽让高原四季如春。\n周末，首府居民来湖边划船、游泳，伊拉米区的研究员和学生骑车绕湖，湖边的渔家把刚捕的湖鱼裹上香叶烤熟，配一碗红米饭。领地议会开幕那天，议员们从湖边出发，步行走过整条规划轴线进入议会。\n傍晚湖面起风时，首府的上班族喜欢下班后来湖边吃一碗烤鱼配米线，本地人说米雷兰的规划轴线朝着湖面，「是为了让开会的人记得抬头」。"
      en: "Lake Ombelhanu is the great lake of the Hanupala Plateau, about 1,590 km² in area; in Ivuran it is \"Ombelhanu\", meaning \"great lake\", and it is the largest lake in the territory. Most of the lake lies in Hanupala District of Mirelan City, while its south-eastern shore belongs to Ombel District, where the capital, Mirelan, was built. Lakelight Avenue, the planned axis of Pasalu District, looks straight out towards the lake about 27 km to the north-north-west; the lakeside promenade and bathing beaches of Ombel District are where the capital's people spend their weekends, and the territory's public sanatorium and a water sports centre stand by the shore; reedbeds along the lake shelter water birds, villages line its shores, and fishing families net lake fish from their boats. The plateau gets more than 2,600 mm of rain a year, usually as an afternoon shower, after which a thin mist rises from the lake. Old people by the lake like to say \"Ombel velau, selo imimu\", \"when there are clouds on the lake, the summer is long\", for the lake's moisture keeps the plateau mild all year round.\nAt weekends townspeople come to the lake to row and swim, researchers and students from Ilami District cycle round it, and the fishing families grill freshly caught lake fish wrapped in fragrant leaves and serve it with a bowl of red rice. On the day the Territorial Assembly opens, its members set off from the lakeside and walk the whole length of the planned axis into the Assembly.\nWhen the evening breeze rises off the lake, office workers from the capital come down after work for grilled fish and rice noodles, and locals say Mirelan's planning axis faces the lake \"so that people in meetings remember to look up\"."
  - id: nat_mfx833
    subtype: lake
    status: generated
    names:
      zh: 翁贝尔韦劳湖
      en: Lake Ombelvelau
      art-x-ivuran: Ombelvelau
    notes:
      zh: "翁贝尔韦劳湖是温达坎市乌拉韦劳自然保护区里的高山湖泊，面积约 130 平方公里，伊武兰语叫「Ombelvelau」，意为「云中之湖」，湖面常年笼罩在云雾里。保护区是蒂拉凯苏山脉最高的一段，面积约 2.5 万平方公里，常住人口约 5000 人，多为护林员和山民，领地最高峰乌拉韦劳峰也在区内；保护区只开放几条徒步路线，到湖边要走山间小道。湖周是云雾林，附生的苔藓和兰花挂满树枝，林子终年湿漉漉的，树干上长着厚厚的一层青苔；湖边没有村落，只有护林员的几间小木屋。湖水是山下梯田泉水的源头之一，温达坎的梯田靠山顶的森林蓄水，村里的老人常念「Uvesa lomi, olu unda」，意思是「雨落进森林，稻长上台阶」，所以砍山顶的树在这里是最大的忌讳，每个村社都选出专人看护水源林。\n温达坎的村社每年在湖边举行祭水仪式，各村的人背着竹筒和米袋，走一整天的山路上来，夜里在湖边生火唱歌，等天亮时云雾稍稍散开再开始仪式。\n祭水仪式上，各村的长者把一竹筒新米和一竹筒湖水交换，带回村里倒进最高的那块梯田，村民说这样「云里的水就认得我们的田」。"
      en: "Lake Ombelvelau is a mountain lake in the Uravelau Nature Reserve of Undakan City, about 130 km² in area; in Ivuran it is \"Ombelvelau\", meaning \"lake in the clouds\", and mist lies over it most of the year. The reserve is the highest stretch of the Tirakesu Mountains, about 25,000 km² with some 5,000 inhabitants, most of them forest rangers and hill people, and Mount Uravelau, the highest summit in the territory, is within it; only a few hiking routes are open, and the lake is reached by mountain paths. Cloud forest surrounds the lake, its branches hung with mosses and orchids, the woods wet all year and the tree trunks thick with moss; there are no villages by the lake, only a few rangers' huts. The lake feeds the springs that water the terraces below: Undakan's terraces depend on the forest on the heights to hold the water, and the village elders often recite \"Uvesa lomi, olu unda\", \"rain falls into the forest, rice climbs the steps\", so cutting trees on the heights is the greatest taboo here, and every village community chooses people to watch over its watershed forest.\nUndakan's village communities hold a water ceremony on the lake shore every year: people from each village climb a full day up the mountain paths with bamboo tubes and bags of rice, light fires and sing by the lake through the night, and begin the ceremony at dawn when the mist thins a little.\nAt the water ceremony each village's elders exchange a bamboo tube of new rice for a tube of lake water and pour it into their highest terrace at home, so that, villagers say, \"the water in the clouds knows our fields\"."
  - id: nat_ng8px9
    subtype: lake
    status: generated
    names:
      zh: 洛米翁贝尔湖
      en: Lake Lomiombel
      art-x-ivuran: Lomiombel
    notes:
      zh: "洛米翁贝尔湖是洛米兰雨林深处的黑水湖，在洛米兰市卡塔穆区，面积约 350 平方公里，伊武兰语叫「Lomiombel」，意为「森林之湖」。湖水被落叶染成茶色，湖岸是淹水林，雨季时湖面扩大到旱季的两倍，林中的树干有一半泡在水里。卡塔穆区名意为「藤与草」，林区村落的村民按领地的许可在林中采集藤条、蜂蜜和药用植物，湖边的村落划独木舟捕鱼；研究人员在这里研究雨林的水循环，洛米兰人常说「Lomi uvesa, uvesa lomi」，意思是「森林生雨，雨生森林」，这片湖正是他们观测的地方。湖周的林冠里栖息着犀鸟，伊武兰语叫它 kuvala，午后成群叫起来，傍晚多半要下雨。\n黑水湖里的鱼不多却很肥，村民撒网前要先看风向，捕到的鱼用芭蕉叶包着香料烤成叶包鱼。采蜜也要先领许可，同一棵树一年只采一次。研究人员借住在村里，跟着村民学划独木舟，几个月下来，有人学会了看犀鸟的叫声猜天气。\n茶色的湖水平静得像一面镜子，倒映着周围的树冠，独木舟划过时分不清哪边是天、哪边是水，村里的老人提醒新来的研究员「别低头看太久，会晕」。"
      en: "Lake Lomiombel is a blackwater lake deep in the Lomiran rainforest, in Katamu District of Lomiran City, about 350 km² in area; in Ivuran it is \"Lomiombel\", meaning \"lake of the forest\". Fallen leaves stain its water the colour of tea, flooded forest lines its shores, and in the wet season it spreads to twice its dry-season size, with the trees standing half-drowned. Katamu's name means \"vines and grasses\": under territorial permits the people of its forest villages gather rattan, honey and medicinal plants, and the villages around the lake fish from canoes; researchers study the water cycle of the rainforest here, and the lake is where they test the Lomiran saying \"Lomi uvesa, uvesa lomi\", \"the forest makes rain, and rain makes the forest\". Hornbills, kuvala in Ivuran, live in the canopy round the lake, and when they call together in the afternoon it usually rains by evening.\nThe blackwater lake holds few fish, but they are fat; villagers check the wind before casting their nets and bake the catch with spices in plantain leaves. Honey-gathering needs a permit too, and no tree may be robbed more than once a year. Researchers lodge in the villages and learn to paddle canoes from their hosts, and after a few months some have learned to guess the weather from the hornbills' calls.\nThe tea-coloured water lies still as a mirror under the canopy, and as a canoe glides across it is hard to tell sky from water; village elders warn newly arrived researchers \"don't stare down too long, you'll get dizzy\"."
  - id: nat_3pza4g
    subtype: river
    status: generated
    detect: { kind: river, at_km: [430.2, 347.2] }
    names:
      zh: 纳卢西鲁河
      en: Nalusiru River
      art-x-ivuran: Nalusiru
    notes:
      zh: "纳卢西鲁河是主岛西北部的大河，全长约 430 公里，流域面积约 5.7 万平方公里，仅次于哈努西鲁河，伊武兰语叫「Nalusiru」，意为「浪之河」。河流发源于主岛中部的高地，向西北流过纳卢迈市托武卢区的丘陵和帕兰图区的果园平原，在纳卢迈城区入海，下游两岸是芒果园、榴莲园和稻田。纳卢迈一带是热带草原气候，旱季有两三个月几乎滴雨不下，年降水约 1200 毫米，河水随季节涨落：雨季浑黄满槽，旱季退成几道清浅的水流，露出大片沙洲。帕兰图区名意为「果实累累」，芒果、榴莲、菠萝蜜、山竹和红毛丹的果园一望无际，果园靠河水灌溉，水果合作社的冷链车每天把鲜果运往港口和机场。\n旱季的沙洲上，孩子们追着鹭鸟跑，渔民在浅水里撒网捉河虾；果园在旱季末开始收获，河边的路上堆满了果摊，空气里一股甜香。傍晚的河口，河水和海浪在纳卢迈海滨的长堤外交汇，堤上满是看日落的人，本地人说「浪之河」的名字大概就是这么来的。\n榴莲季里，河边的果园主人会把熟透落地的榴莲装上小船顺流运到城里，纳卢迈人闻到河面飘来的榴莲香，就知道「河送果子来了」。"
      en: "The Nalusiru is a great river of the north-west of the main island, about 430 km long with a basin of about 57,000 km², second only to the Hanusiru's; in Ivuran it is \"Nalusiru\", meaning \"river of waves\". It rises in the uplands of the middle of the island, flows north-west through the hills of Tovulu District and the orchard plains of Parantu District in Nalumai City, and reaches the sea in Nalumai itself, between mango and durian orchards and rice fields. The Nalumai country has a tropical savanna climate, with two or three months of the dry season almost without rain and about 1,200 mm a year, so the river rises and falls with the seasons: brown and brim-full in the wet season, it shrinks in the dry season to a few clear, shallow channels between wide sandbanks. Parantu's name means \"laden with fruit\", and its orchards of mango, durian, jackfruit, mangosteen and rambutan stretch as far as the eye can see, watered from the river, while the fruit co-operatives' refrigerated lorries carry fresh fruit to the port and the airport every day.\nOn the dry-season sandbanks children chase egrets and fishers cast their nets for river prawns in the shallows; the orchards begin to harvest at the end of the dry season, and the riverside roads fill with fruit stalls and a sweet smell in the air. At dusk river and waves meet beyond the long seafront mole of Nalumai, crowded with people watching the sunset, and locals reckon that is probably how the \"river of waves\" got its name.\nIn durian season orchard owners load the ripe fallen fruit into boats and float them downstream to town, and when Nalumai people smell durian drifting off the water they say \"the river is bringing the fruit\"."
  - id: nat_5dqwy8
    subtype: river
    status: generated
    detect: { kind: river, at_km: [540.8, 282.2] }
    names:
      zh: 奥卢西鲁河
      en: Olusiru River
      art-x-ivuran: Olusiru
    notes:
      zh: "奥卢西鲁河是塔卢马兰市帕达兰区的大河，全长约 410 公里，流域面积约 4.1 万平方公里，伊武兰语叫「Olusiru」，意为「稻米之河」。河流发源于乌诺凯苏山脉，向东南流过帕达兰区的稻田和椰林，在塔卢马兰城区东北入海，河口是渔港和红树林。帕达兰区名意为「稻作之乡」，是塔卢马兰背后广阔的腹地，面积约 6.5 万平方公里，只住着 10 万人，从沿海平原一直延伸到乌诺凯苏山脉的山坡：平原上是稻田和椰林，山坡上种可可、咖啡和丁香，村庄里的居民大多讲伊武兰语北部方言。河水是平原稻田的命脉，一年能收两季稻，雨季河水漫进低洼的田里，退水后留下一层肥沃的泥。河口的红树林是鱼虾的育苗场，渔港的小船清晨出海，午后就回来；周末常有塔卢马兰人来河口的红树林划船，看退潮后泥滩上蹦跳的弹涂鱼。\n上游的山坡上，库瓦拉峰的老林里常能看到成对的犀鸟；下游的村子里，插秧和收割都是全村一起出工，田埂上摆着椰子和米饭，干累了就坐下来吃。\n稻子收割后，河岸的人家会用新米和椰浆做一种绿色的糯米糕，用香兰叶染色，帕达兰的孩子们说，吃到这种糕就知道「河又养了我们一年」。"
      en: "The Olusiru is the great river of Padaran District in Talumaran City, about 410 km long with a basin of about 41,000 km²; in Ivuran it is \"Olusiru\", meaning \"river of rice\". It rises in the Unokesu Mountains, flows south-east through the rice fields and coconut groves of Padaran and reaches the sea north-east of Talumaran, where its mouth holds a fishing harbour and mangroves. Padaran, whose name means \"land of rice-growing\", is the broad hinterland behind Talumaran, about 65,000 km² with only 100,000 people, stretching from the coastal plain up to the slopes of the Unokesu Mountains: rice and coconut palms on the plain, cocoa, coffee and cloves on the slopes, and villages where most people speak the northern dialect of Ivuran. The river is the lifeblood of the paddy on the plain, which yields two crops a year; in the wet season it spills into the low-lying fields and leaves a layer of rich silt when it drains away. The mangroves at the mouth are a nursery for fish and prawns, and the small boats of the fishing harbour put out at dawn and are back by early afternoon; at weekends Talumaran people often come to paddle in the mangroves at the mouth and watch mudskippers hopping on the flats at low tide.\nOn the upper slopes pairs of hornbills are often seen in the old forest of Mount Kuvala; in the villages downstream the whole village turns out to plant and to harvest, with coconuts and rice laid out on the field banks for anyone who needs a rest.\nAfter the rice harvest the riverside households make a green sticky-rice cake with new rice and coconut milk, coloured with pandan leaf, and Padaran children say the taste of it means \"the river has fed us for another year\"."
  - id: nat_1465sf
    subtype: river
    status: generated
    detect: { kind: river, at_km: [310.2, 316.2] }
    names:
      zh: 卡塔西鲁河
      en: Katasiru River
      art-x-ivuran: Katasiru
    notes:
      zh: "卡塔西鲁河是洛米兰市卡塔穆区的河流，全长约 290 公里，流域面积约 1.8 万平方公里，伊武兰语叫「Katasiru」，意为「藤之河」。河流从内陆的山地流下，穿过雨林中的林区村落，在洛米兰城区东北入海。卡塔穆区名意为「藤与草」，面积近 3 万平方公里，只住着约 3.7 万人，村民按领地的许可在林中采集藤条、蜂蜜和药用植物，草药合作社把药材卖给生物医药企业，收益按惠益分享的规定返还村社。洛米兰一带雨水充沛，河水终年不断，雨季涨得满满的，河岸两边是高大的雨林，林冠里有犀鸟和长臂猿，清晨的河面常飘着一层薄雾。\n林区的路少，河就是村与村之间的路，村民划独木舟走亲访友、运送藤条和草药，研究药用植物的人员也常搭村民的船进林子，合作社的收购船每隔几天沿河收一次货，再把药材送到城里的实验室。孩子们放学后在浅滩上学划船，老人坐在吊脚屋的廊下编藤筐，编好的藤筐一部分自用，一部分顺河卖到城里的林产品集市。\n林区村落的独木舟船头都刻着自家的图案，村民在河上相遇时不用喊名字，看一眼船头就知道是谁家的人，顺便交换几捆藤条和一筐草药。"
      en: "The Katasiru is the river of Katamu District in Lomiran City, about 290 km long with a basin of about 18,000 km²; in Ivuran it is \"Katasiru\", meaning \"river of vines\". It comes down from the inland hills, runs past the forest villages of the rainforest and reaches the sea north-east of the town of Lomiran. Katamu, whose name means \"vines and grasses\", covers nearly 30,000 km² but has only about 37,000 people; under territorial permits the villagers gather rattan, honey and medicinal plants in the forest, and the herb co-operative sells the herbs to biomedical companies, with the proceeds returned to the villages under benefit-sharing rules. Rain is plentiful around Lomiran, the river never runs dry and swells to the brim in the wet season, tall rainforest lines both banks, hornbills and gibbons live in the canopy, and a thin mist often lies on the water in the early morning.\nThere are few roads in the forest, so the river is the road between villages: the villagers paddle canoes to visit relatives and carry rattan and herbs, researchers studying medicinal plants often hitch a ride into the forest in villagers' boats, and the co-operative's buying boat comes along the river every few days to collect the herbs and take them to the laboratories in town. After school children learn to paddle in the shallows, and old people sit on the verandas of their stilt houses weaving rattan baskets, some for their own use and some sent downriver to the forest-produce market in town.\nEvery forest village canoe has its family's emblem carved on the bow, so people meeting on the river know each other at a glance without calling out, and swap a few bundles of rattan or a basket of herbs in passing."
  - id: nat_fh951p
    subtype: river
    status: generated
    detect: { kind: river, at_km: [382.8, 229.2] }
    names:
      zh: 基拉西鲁河
      en: Kilasiru River
      art-x-ivuran: Kilasiru
    notes:
      zh: "基拉西鲁河是基拉努特别自治市的河流，全长约 250 公里，流域面积约 2.2 万平方公里，伊武兰语叫「Kilasiru」，意为「明亮的河」。河流从哈努帕拉高原的东南缘跌落，流过乌拉帕区的果园和山村，在基拉湾入海。乌拉帕区名意为「高地」，是基拉努背后的丘陵和山地，面积约 5.8 万平方公里，只住着 8 万人，山坡上种可可和热带水果，河谷里有小水电站和村庄，居民多是讲伊武兰语的本地人。基拉湾面积约 150 平方公里，湾边是洁白的石英砂滩和海滨公园，踩上去会发出轻轻的吱吱声。基拉西鲁河是基拉努半导体产业园的水源之一，努维拉区的晶圆厂需要大量稳定的用水，园区有自己的超纯水厂，领地对工业用水和废水排放实行严格监管，上游的森林和河水因此被看得格外紧。\n雨季的河水带着高原的红土，在湾口染出一道浑黄的水线，旱季又变得清亮，名字里的「明亮」说的就是这时候。周末，基拉努的工程师们常带着孩子到上游的果园采山竹，再沿河开车下来，到基拉湾的沙滩上看日落。\n产业园的工程师和上游的果农每季开一次「水的会」，商量用水和护林，散会时果农总会送一筐刚摘的山竹，工程师们说这是全年最受欢迎的会议。"
      en: "The Kilasiru is the river of the Special Autonomous City of Kilanu, about 250 km long with a basin of about 22,000 km²; in Ivuran it is \"Kilasiru\", meaning \"bright river\". It drops from the south-eastern edge of the Hanupala Plateau, flows past the orchards and hill villages of Urapa District and enters Kila Bay. Urapa, whose name means \"highlands\", is the hill and mountain country behind Kilanu, about 58,000 km² with only 80,000 people, growing cocoa and tropical fruit on its slopes, with small hydro stations and villages in its valleys and a population mostly of Ivuran-speaking locals. Kila Bay, about 150 km², is fringed with white quartz sand that squeaks softly underfoot and a seaside park. The Kilasiru is one of the sources of water for Kilanu's semiconductor park: the wafer fabs of Nuvila District need large and steady supplies of water, the park has its own ultrapure water plant, and the territory strictly regulates industrial water use and discharges, so the upstream forests and the river are watched with particular care.\nIn the wet season the river carries red earth from the plateau and paints a muddy line across the mouth of the bay; in the dry season it runs clear again, and that is the brightness of its name. At weekends Kilanu's engineers often take their children upriver to pick mangosteens in the orchards, then drive back down along the river to watch the sunset on the sands of Kila Bay.\nThe industrial park's engineers and the upstream fruit growers hold a \"water meeting\" every season to settle water use and forest care, the growers always bring a basket of fresh mangosteens, and the engineers call it the most popular meeting of the year."
  - id: nat_s81c1h
    subtype: river
    status: generated
    detect: { kind: river, at_km: [442.2, 249.8] }
    names:
      zh: 托武西鲁河
      en: Tovusiru River
      art-x-ivuran: Tovusiru
    notes:
      zh: "托武西鲁河是基拉努特别自治市乌拉帕区东部的河流，全长约 260 公里，流域面积约 3 万平方公里，伊武兰语叫「Tovusiru」，意为「海龟之河」，河口两侧的沙滩是海龟的产卵地。乌拉帕区名意为「高地」，是基拉努背后的丘陵和山地，一直延伸到哈努帕拉高原的东南缘，面积约 5.8 万平方公里，只住着 8 万人，居民多是讲伊武兰语的本地人。托武西鲁河从山地流下，中上游的河谷里有小水电站和果园，山坡上种可可和热带水果；雨季河水涨得快，村庄都建在高出洪水线的台地上，台地边沿种着椰子和芭蕉，洪水退后留下的淤泥是果园最好的肥料。下游河口一带是沙滩和红树林，渔民划小船出海，产卵季节海滩夜间禁止进入。\n基拉努城里的工程师周末常开车来河口露营，到了产卵季，露营地就挪到离沙滩远一些的林子里。上游的小水电站由村里合作经营，发的电除了自用，也并进基拉努的电网。\n海龟上岸产卵的夜里，河口的村庄会熄掉海边的灯，大人们说这是在「给海龟让路」，孩子们则趴在窗边，偷偷数沙滩上爬过的黑影。第二天一早，村里的老人看沙滩上留下的爬痕，就能说出昨夜上岸的是哪一种海龟。"
      en: "The Tovusiru is a river in the east of Urapa District in the Special Autonomous City of Kilanu, about 260 km long with a basin of about 30,000 km²; in Ivuran it is \"Tovusiru\", meaning \"river of turtles\", after the nesting beaches on either side of its mouth. Urapa, whose name means \"highlands\", is the hill and mountain country behind Kilanu, reaching to the south-eastern edge of the Hanupala Plateau, about 58,000 km² with only 80,000 people, most of them Ivuran-speaking locals. The Tovusiru comes down from the hills; small hydro stations and orchards fill its middle and upper valleys, with cocoa and tropical fruit on the slopes. In the wet season the river rises fast, so the villages stand on terraces above the flood line, their edges planted with coconuts and plantains, and the silt left behind by the floods is the best fertiliser the orchards could have. Around the mouth are beaches and mangroves, fishermen row their small boats out to sea, and in the nesting season the beaches are closed at night.\nEngineers from Kilanu often drive out to camp at the river mouth at weekends, and in the nesting season the campsite moves into the woods further back from the sand. The small hydro stations upstream are run as village co-operatives, and the power they make beyond their own needs goes into Kilanu's grid.\nOn nights when the turtles come ashore to lay, the villages at the river mouth switch off their seafront lights, \"making way for the turtles\" as the grown-ups put it, while the children lie at the windows secretly counting the dark shapes crawling up the sand. Early next morning the village elders can tell from the tracks left on the beach which kind of turtle came ashore in the night."
  - id: nat_h8fa19
    subtype: river
    status: generated
    detect: { kind: river, at_km: [197.2, 280.8] }
    names:
      zh: 凯纳西鲁河
      en: Kainasiru River
      art-x-ivuran: Kainasiru
    notes:
      zh: "凯纳西鲁河是彭纳拉姆市帕拉武尔区的河流，全长约 250 公里，流域面积约 2.9 万平方公里，伊武兰语叫「Kainasiru」，意为「香料之河」。河流从蒂拉凯苏山脉北坡流下，两岸的山坡是胡椒园、咖啡园和可可园，在帕拉武尔区北部入海。帕拉武尔区名意为「果树之村」，是彭纳拉姆内陆的高地，面积约 3.5 万平方公里，住着 8 万人，林间散布着小村庄，咖啡合作社的烘焙厂在区中心的集镇上。流域里的凯纳峰海拔 2264 米，名字也是「香料」的意思，山坡下部是咖啡园和可可园，中部是胡椒和豆蔻的林下种植园，山上是云雾林；西南方的彭纳瓦苏山口是彭纳拉姆翻越山脉通往哈努西鲁河谷的通道。全市本地人近八成，许多家庭世代经营香料园。\n本地人开玩笑说，从凯纳峰山脚走到山腰，一路上就能把一顿早饭和晚饭的香料采齐。雨季的傍晚，河边的人家喜欢煮一壶浓稠的热可可，配着用豆蔻调味的点心，看河面上的雨；咖啡合作社的烘焙厂一开工，整个集镇都飘着焦香。\n下游的河水在收获季会带着一股淡淡的胡椒香，那是两岸晾晒胡椒的气味顺风飘到了河面上，渔民说这一段的鱼「天生就是调好味的」。"
      en: "The Kainasiru is the river of Palavur District in Pennaram City, about 250 km long with a basin of about 29,000 km²; in Ivuran it is \"Kainasiru\", meaning \"river of spice\". It runs down the northern slopes of the Tirakesu Mountains between hillsides of pepper, coffee and cocoa and reaches the sea in the north of Palavur. Palavur, whose name means \"village of fruit trees\", is Pennaram's inland upland, about 35,000 km² with 80,000 people, its small villages scattered through the woods and the coffee co-operative's roastery in the market town at its centre. In the basin stands Mount Kaina, 2,264 m high, whose name also means \"spice\": coffee and cocoa gardens on its lower slopes, pepper and cardamom grown under the trees higher up and cloud forest above; to the south-west the Pennavasu Pass is Pennaram's way over the range to the Hanusiru valley. Nearly eight in ten of the city's people are locals, and many families have run spice gardens for generations.\nLocals joke that walking from the foot of Mount Kaina to its middle slopes you can pick all the spices for a day's breakfast and supper. On wet-season evenings riverside households like to make a pot of thick hot cocoa and eat cardamom-spiced sweets with it while watching the rain on the river, and whenever the co-operative's roastery fires up, the whole market town smells of roasting coffee.\nIn the harvest season the lower river carries a faint scent of pepper, blown onto the water from the drying yards along the banks, and fishers say the fish of this stretch \"come ready seasoned\"."
  - id: nat_ptetwc
    subtype: river
    status: generated
    detect: { kind: river, at_km: [498.2, 273.2] }
    names:
      zh: 塔卢西鲁河
      en: Talusiru River
      art-x-ivuran: Talusiru
    notes:
      zh: "塔卢西鲁河是流经塔卢马兰城区的河流，全长约 180 公里，流域面积约 2.9 万平方公里，伊武兰语叫「Talusiru」，意为「停泊之河」，在伦博湾顶入海。伦博湾是塔卢马兰湾东北角伸进城区的狭长内湾，长约 25 公里，伊武兰语意为「船湾」，伦博船厂的干船坞和龙门吊沿湾排开，老港的石砌防波堤和灯塔就在湾口。塔卢马兰是领地第二大城市，城名意为「停泊之地」，河名、湾名和城名一脉相承。河两岸修有滨河绿道，清晨有人跑步、骑车，傍晚是散步的一家老小，雨季河水涨高时，老码头的石阶会被淹掉好几级；下游的老码头改成了海事博物馆和夜市，博物馆里陈列着老港的船模、海图和老商行的货单。全市移民约占三分之二，河边夜市汇集了工人们家乡的味道，从各省的面食到大洋彼岸的烤肉应有尽有，河边的长椅上常有老海员给孩子们讲跑船的故事。\n湾两岸的船厂中午收工时汽笛一齐拉响，湾顶河口的小吃摊听到汽笛就开始下面，汽笛停时第一碗刚好端上桌。\n海事博物馆旁的夜市一到傍晚就亮起一串串灯笼，倒映在河面上，船厂下班的工人们说，在河边吃完一碗椰浆咖喱鱼，一天的累就随河水流走了。"
      en: "The Talusiru is the river that flows through Talumaran, about 180 km long with a basin of about 29,000 km²; in Ivuran it is \"Talusiru\", meaning \"river of mooring\", and it enters the sea at the head of Lumbo Bay. Lumbo Bay is the narrow inner bay, about 25 km long, that reaches from the north-eastern corner of Talumaran Bay into the city; its Ivuran name means \"ship bay\", the dry docks and gantry cranes of the Lumbo Shipyard line its shores, and the stone breakwater and lighthouse of the old harbour stand at its mouth. Talumaran is the territory's second city, its name meaning \"place of mooring\", so river, bay and city share one root. Riverside greenways follow both banks, with joggers and cyclists in the early morning and families strolling in the evening, and in the wet season the rising river drowns several of the old quay steps, and the old quays on the lower river are now a maritime museum and a night market, the museum showing ship models, charts and the bills of lading of the old trading houses. About two-thirds of the city's people are immigrants, and the riverside night market gathers the flavours of the workers' home towns, from noodles of every province to grilled meat from across the ocean, and old seamen on the riverside benches tell children tales of their voyages.\nWhen the shipyards on both shores break for lunch their sirens sound together, the snack stalls at the river mouth at the head of the bay start boiling noodles at the first blast, and the first bowl reaches the table just as the sirens stop.\nStrings of lanterns light up the night market beside the maritime museum at dusk and shine back from the river, and shipyard workers say a bowl of coconut fish curry by the water carries the day's tiredness away downstream."
