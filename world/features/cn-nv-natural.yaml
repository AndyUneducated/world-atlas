# Named natural features of North Viking Island.
# subtype follows OSM natural=* / waterway=* values. Geometry is produced by the
# generator (see world/generator/cn-nv.yaml); this file only holds identity and semantics.
features:
  - id: nat_b9bmz2
    subtype: mountain_range
    status: generated
    names:
      zh: 洛龙山脉
      en: Lorond Range
      art-x-viking: Lorondgebirge
    notes:
      zh: "纵贯北维京岛中部的主山脉，南起纳帕图克冰川一带，北到德雷卡廷峰和克拉尔瓦滕湖南面，长一百五十公里左右，最高峰洛龙峰海拔 2701 米，相对高度两千五百多米。山脊上自南向北依次排列着洛龙峰、杉顶和德雷卡廷峰，其间的纳帕图克垭口和卡蒂尔尤阿克是翻越山脉的两处山口；卡蒂尔尤阿克山口自古就是商队和邮差冒雪翻山的要道，旧驿站如今改成了卡蒂尔尤阿克驿站博物馆。洛龙冰川面积上千平方公里，是山脉中最大的冰川，杉顶、龙首和纳帕图克冰川较小。雅利基卢克河发源于山脉东坡，克拉尔瓦滕湖则汇集北段的融雪。山脉把全岛分成东西两半，原勒克尔市与原马斯林山市曾大致以山脊为界，如今山地大多属洛龙山市，纳帕图克的云杉和冷杉林海在严格的轮伐制度下经营。纳帕图克公路以洛龙山脉隧道从纳帕图克垭口附近穿山，环北维京岛高速也在那一带越岭，卡蒂尔尤阿克高速则在德雷卡廷峰以北穿过主脊，西马高速铁路和新洛高速铁路在山中的洛龙山站汇合。\n山里冬天最低气温可以跌到零下二十五度，大雪封山时，司机们都收听卡蒂尔尤阿克广播站念的山口通行情况。两岸的人至今爱拿山脊开玩笑：东边的人说「山那边下雨」，西边的人说「山那边起雾」，其实同一天的天气往往一模一样，只是谁都不愿意承认。"
      en: "The main range running down the middle of North Viking Island, from the Napatuuq Glacier area in the south to Drekatind and the south side of Lake Klarvatn in the north, about 150 km long. Its highest summit, Lorond Peak, stands 2701 m high with a prominence of more than 2500 m. Along the crest from south to north stand Lorond Peak, Fir Top and Drekatind, and between them Napatuuq Col and Katirjuaq are the two passes across the range. The Katirjuaq pass has been the route of caravans and postmen struggling over through the snow since early times, and its old post house is now the Katirjuaq Post House Museum. The Lorond Glacier, over 1000 km², is the range's largest; the Fir Top, Dragon Prow and Napatuuq glaciers are smaller. The Jaalikiluk River rises on the eastern slopes, and Lake Klarvatn gathers the snowmelt of the northern section. The range divides the island into east and west, and the old Lekor City and old Maslin Mountain City were once roughly divided along the crest; today most of the mountains belong to Lorond Mountain City, where the spruce and fir forests of Napatuuq are worked under strict rotation. The Napatuuq Highway pierces the range through the Lorond Range Tunnel near Napatuuq Col, the North Viking Island Ring Expressway also crosses in that area, and the Katirjuaq Expressway crosses the main ridge north of Drekatind, while the Northwest–Maslin Mountain High-Speed Railway and the New City–Lorond Mountain High-Speed Railway meet at Lorond Mountain Station in the hills.\nWinter lows in the mountains can fall to minus 25 degrees, and when snow closes the roads drivers tune in to Katirjuaq radio station for its reading of pass conditions. People on either side still like to joke about the ridge: the east says \"it's raining over there\", the west says \"it's foggy over there\", when in fact the weather on any given day is usually exactly the same, and neither side will admit it."
  - id: nat_qsrakx
    subtype: mountain_range
    status: generated
    names:
      zh: 马斯林山脉
      en: Maslin Range
      art-x-viking: Maslingebirge
    notes:
      zh: "北维京岛东部的大山脉，呈马蹄形从北、西、南三面环抱马斯林山盆地，只在东面向海岸平原敞开，全岛最高峰蒂鲁尤阿克峰就在山脉之中，海拔 4313 米，也是世界最高峰。北翼最高最险，自雅尔斯托尔峰（4020 米）向东依次是西坪垭口（3491 米）、卡瓦卢克图克峰（4213 米）、霍尔沃思峰（4236 米）和蒂鲁尤阿克峰，四千米级的高峰连成一线，五千多平方公里的雅尔斯托尔冰原覆盖其上；西翼经海拔 1766 米的马斯林山口南延到索利峰（3085 米），索利冰川沿山脊铺展；南翼较低，西起铁岗山，东到海拔 1723 米的天台山。北翼与西翼之间是群峰训练管理区，蒂鲁尤阿克峰光学观测站和霍尔沃思峰激光站建在峰顶，监视和测量在轨卫星与太空碎片，人员和物资只能靠直升机运送。马斯林河汇集盆地众水向东入海，柳萨河和台河则从盆地南部流向东南海岸。\n盆地里的人说马斯林山是「一只张开的手」，三面山是手指，东面的海岸平原是手心，冬天的寒风被手指挡在外面，所以盆地里的雪比四周山上少得多，马斯林山也成了全岛降水最少的城市。火箭从西坪升空时，尾焰划过三面雪峰，全城的人都站在街边仰头看。"
      en: "The great range of eastern North Viking Island, wrapping the Maslin Mountain basin in a horseshoe on the north, west and south and opening only to the coastal plain on the east. The island's highest summit, Mount Tirrujuaq, rises within it to 4313 m, the highest peak in the world. The northern arm is the highest and wildest: from Jarlstol (4020 m) eastwards come West Heath Saddle (3491 m), Mount Qavvaluktuuq (4213 m), Mount Hallworth (4236 m) and Mount Tirrujuaq, a line of four-thousand-metre peaks under the Jarlstol Icefield of more than 5000 km². The western arm runs south over Maslin Pass, 1766 m high, to Mount Sorley (3085 m), with the Sorley Glacier spread along its crest. The southern arm is lower, running from Iron Knoll in the west to Sky Terrace Mountain, 1723 m, in the east. Between the northern and western arms lies the High Peaks Training Area, and the Mount Tirrujuaq Optical Station and Mount Hallworth Laser Station on the summits watch and measure satellites and space debris in orbit; people and supplies can reach them only by helicopter. The Maslin River gathers the basin's waters and flows east to the sea, while the Ljosa River and the Terrace River run from the south of the basin to the south-east coast.\nPeople in the basin say the Maslin Range is \"an open hand\": the three mountain walls are the fingers and the coastal plain to the east is the palm. The fingers keep out the winter winds, so the basin gets far less snow than the mountains around it, and Maslin Mountain is the driest city on the island. When a rocket lifts off from West Heath, its plume streaks across the three snowy walls while the whole city stands in the street looking up."
  - id: nat_papy7d
    subtype: ridge
    status: generated
    names:
      zh: 寒岭
      en: Frost Ridge
      art-x-viking: Frostkamm
    notes:
      zh: 西北市北部东西走向的山岭，西起帕利基尔纳克峰，东到尼尔萨图克山，长一百四十公里左右，最高峰西尔米卡塔克峰海拔两千四百多米，峰顶的西尔米卡塔克冰川是山岭唯一较大的冰川。山脊自西向东依次排列着帕利基尔纳克峰、基尔纳克山口、西尔米卡塔克峰、蒂鲁山口和瓦格恩廷峰，东端的尼尔萨皮里山口和尼尔萨图克山已降为低山，是鹿群季节迁徙的通道。山岭北坡直落北海岸的科罗比湾和望星湾，南坡是寒岭区的原始森林和高山草甸，冬季积雪期长，越野滑雪和冰川观光吸引着不少游客。寒岭被视为西北市的生态屏障，新的开发受到严格控制，寒岭生态研究站常年在这里监测森林、冰川和野生动物。西岸公路的终点也在寒岭区内。
      en: An east–west ridge across the north of Northwest City, from Mount Paalikirnaq in the west to Nirsatuuq Hill in the east, some 140 km long. Its highest summit is Mount Sirmiqattaq, just over 2,400 m, whose summit glacier is the only sizeable glacier on the ridge. Along the crest from west to east come Mount Paalikirnaq, Kirnaq Pass, Mount Sirmiqattaq, Tirru Pass and Vagntind; at the eastern end Nirsapirri Pass and Nirsatuuq Hill drop to low hills where the deer cross on their seasonal migration. The north side falls straight to Corrowby Bay and Stargaze Bay on the north coast, and the south side is the old-growth forest and alpine meadow of Frost Ridge District; the snow lies long in winter, and cross-country skiing and glacier trips draw a steady flow of visitors. The ridge is treated as Northwest City's ecological buffer, new development is tightly controlled, and the Frost Ridge Ecological Station monitors its forests, glaciers and wildlife all year. The West Coast Highway also ends in Frost Ridge District.
  - id: nat_h7v2kd
    subtype: ridge
    status: generated
    names:
      zh: 菲亚尔马克丘陵
      en: Fjallmark Hills
      art-x-viking: Fjallmarkhügel
      art-x-buckham: Colli di Fjallmark
    notes:
      zh: 维京港与自由市之间西北—东南走向的低山，最高处海拔七百八十多米，把两座城市所在的滨海平原隔开。维京语中「菲亚尔马克」意为「山地」，丘陵的大部分属维京港市的菲亚尔马克区，多划为森林公园，只有零散的村镇和别墅区，是维京港人口最少的区；东南端伸入自由市的沙洲区。环北维京岛高速绕行丘陵，自维高速则以四公里长的菲亚尔马克丘陵隧道直穿而过，北河公路沿丘陵东缘下到沙洲。丘陵上是成片的云杉林和桦树林，林间步道和自行车道纵横，周末是两座城市居民共同的后花园。丘陵为两座城市提供水源、木材和休闲空间，新的开发受到严格限制。
      en: Low hills running north-west to south-east between Viking Port and Freedom City, rising to just under 790 m and separating the coastal plains of the two cities. "Fjallmark" means "hill country" in Viking. Most of the hills belong to Fjallmark District of Viking Port, mostly forest park with scattered villages and houses, and the least populous district in the city, while the south-eastern end reaches into Sandbar District of Freedom City. The ring expressway goes round the hills, but the Freedom–Viking Port Expressway runs straight through them in the 4 km Fjallmark Hills Tunnel, and the North River Highway comes down their eastern edge to Sandbar. The hills are clothed in spruce and birch, criss-crossed by footpaths and cycle trails, and at weekends they are the shared back garden of both cities. The hills supply both with water, timber and room to breathe, and new building is tightly restricted.
  - id: nat_x9bmeh
    subtype: river
    status: generated
    names:
      zh: 自由河
      en: Freedom River
      art-x-viking: Freifluss
    notes:
      zh: "自由市的母亲河，全长两百三十多公里（233.6 公里），流域面积两万五千多平方公里，是北维京岛第二长的河流。自由河发源于首府北面的北河区，先向西流入西北市林道区的森林谷地，再折向南，流过首府所在的台地，在沙洲区注入大海，入海处冲积出连绵的沙洲，沙洲区因此得名。首府坐落在自由河与北河之间的台地上，市旗上夹着白色台地的两道深蓝就是这两条河。河口一带地势低平，大片土地仍是湿地和沙丘，沙洲公园建在河口的沙丘上，可以观看候鸟和潮水涨落；沙洲港承担首府的散货、建材与燃料进口。北维京岛大学、沙洲老渔市和沙洲钟楼都离河不远，滨河地带是首府居民最喜欢的散步去处。环北维京岛高速、自勒高速、西塔高速和观星高速都在河上架桥，北河公路也在河口一带经过。\n首府的人管自由河叫「老河」，夏日傍晚，北维京岛大学的学生们会把小木船划到河中央，船上放着手风琴和烤香肠，岸边散步的人常常被琴声拉进船上。秋天两河之间的台地上白桦叶黄，倒映在河里一片金色；冬天老渔市的鳕鱼浓汤摊前排起长队，等汤的人望着结了薄冰的河口，数着沙洲钟楼的钟声。"
      en: "Freedom City's mother river, over 230 km long (233.6 km) with a catchment of more than 25,000 km², the second-longest river on North Viking Island. The Freedom River rises in North River District north of the capital, flows west into the forested valleys of Woodway District in Northwest City, then turns south across the terrace on which the capital stands and reaches the sea in Sandbar District, where it has built up a chain of sandbars that give the district its name. The capital stands on the terrace between the Freedom River and the North River, and the two deep blue bands on either side of the white on the city flag are these two rivers. The land around the mouth is low and flat, much of it still wetland and dunes; Sandbar Park, laid out on the estuary dunes, is a place to watch migrating birds and the rise and fall of the tide, and Sandbar Port handles the capital's imports of bulk goods, building materials and fuel. The University of North Viking Island, the Sandbar Old Fish Market and the Sandbar Clock Tower are all close to the river, and the riverside is the capital's favourite place for a stroll. The North Viking Island Ring Expressway, the Freedom–Lekor Expressway, the Northwest–Tavrupukkuvik Expressway and the Stargazer Expressway all bridge the river, and the North River Highway passes near the mouth.\nPeople in the capital call the Freedom River \"the old river\". On summer evenings students from the University of North Viking Island row small wooden boats out to the middle with an accordion and grilled sausages aboard, and strollers on the bank are often drawn on board by the music. In autumn the birches on the terrace between the two rivers turn yellow and the river is gold with their reflection; in winter queues form at the cod chowder stalls of the old fish market, and those waiting gaze at the thinly iced mouth of the river and count the chimes of the Sandbar Clock Tower."
  - id: nat_9h7mcd
    subtype: river
    status: generated
    names:
      zh: 北河
      en: North River
      art-x-viking: Nordfluss
    notes:
      zh: "自由市的两条大河之一，全长一百三十公里左右（130.7 公里），流域面积近两万平方公里。北河源出首府北部的北河区，向东南流去，中游一段贴着塔夫鲁普库维克市的普库图克区流过，再经首府白桦区一带，在沙洲区东部的北河口入海。首府坐落在北河与自由河之间的台地上，市旗上的两道深蓝就是夹着市区流过的这两条河，中间的白色是建城的台地。北河区沿河展开，北河大道因此得名，两岸修有滨河步道和自行车道，夏夜常有露天集市。北河水流平缓，北河区北半部的河谷里仍是草场和奶牛场，乳业合作社为首府和维京港供应鲜奶，北河市场周末摆满了北部牧场的奶酪、黄油和时令蔬菜；北河公路沿河谷上行，承担着北部农产品进城的运输，环北维京岛高速和西塔高速都从河上经过。\n北河谷的奶牛场每天清晨把鲜奶送进城，首府的老人至今习惯说「北河的奶」，咖啡馆里最受欢迎的早餐是一杯热牛奶配一块刚出炉的肉桂卷，城里最有名的甜点北河奶冻也用这里的鲜奶做成。北河两岸的滨河步道是首府人傍晚遛狗、慢跑的地方，冬天河面结了薄冰，孩子们沿岸扔石子，听冰面发出清脆的回响。"
      en: "One of Freedom City's two great rivers, about 130 km long (130.7 km) with a catchment of nearly 20,000 km². The North River rises in North River District in the north of the capital and flows south-east, skirting Pukkutuuq District of Tavrupukkuvik City along part of its middle course, then passing the Birchwood area of the capital before reaching the sea at the North River Mouth in the east of Sandbar District. The capital stands on the terrace between the North River and the Freedom River; the two deep blue bands on the city flag are these two rivers framing the city, and the white between them is the terrace where it was built. North River District runs along the river and North River Avenue takes its name from it; both banks have riverside paths and cycle lanes, and on summer evenings there are often open-air markets. The river flows gently, and the valley in the northern half of North River District is still pasture and dairy farms whose cooperatives supply fresh milk to the capital and Viking Port; at weekends North River Market is piled with cheese, butter and seasonal vegetables from the northern farms. The North River Highway follows the valley upstream and carries farm produce into town, and the North Viking Island Ring Expressway and the Northwest–Tavrupukkuvik Expressway both cross the river.\nEvery morning the dairy farms of the North River valley send fresh milk into town, and the capital's older people still say \"North River milk\"; the most popular café breakfast is a glass of hot milk with a cinnamon bun straight from the oven, and the city's best-known dessert, North River milk pudding, is made from the same milk. The riverside paths are where people in the capital walk their dogs and jog in the evening, and in winter, when thin ice forms on the river, children skim stones along the bank to hear the ice ring."
  - id: nat_ww491j
    subtype: river
    status: generated
    names:
      zh: 雅利基卢克河
      en: Jaalikiluk River
      art-x-viking: Jaalikiluk Fluß
    notes:
      zh: "北维京岛最长、流域最广的河流，全长三百五十多公里（355.1 公里），流域面积四万五千多平方公里。雅利基卢克河发源于洛龙山脉东坡的纳帕图克区，洛龙冰川的融水是源头的重要补给；河水先向东流出山地，穿过新城市的中苑区和北苑区，再折向北进入伊卡苏瓦区的峡谷，在谷底被古冰川的冰碛堵成碧绿的伊卡苏瓦湖，然后流经上雅利基卢克改良区的荒野，汇集洛龙、马斯林两山之间的众水，进入雅利基卢克市的冲积平原，在基卢克维克区的雅利基卢克河口注入北部海域。下游平原上是麦田、饲草地和家庭奶牛场，河口有一座小渔港，渔船在河口和近海捕捞鲑鱼和鳕鱼，宽阔的三角洲湿地是候鸟迁徙的重要停歇地。雅利基卢克河公路自新城沿河谷北上直到下游的基卢克维克区，是全岛最长的领道。河名在塔夫鲁纳克语里意为「风河」。\n下游的农民说，春天风一转暖，上游的冰雪就开始化，河水一涨，田里就该播种了；河谷里风总是顺着河道吹，牧民那句「Jaali kiluk, nirsa pirri」，「风走河道，驯鹿走风道」，说的正是这条河：在雪原上迷了路，就顺着风找到河，再顺着河找到人家。冬夜里，基卢克维克沿河的人家习惯在窗台上点一盏蜡烛，给走夜路的人照亮。"
      en: "North Viking Island's longest river with the largest catchment, over 350 km long (355.1 km) and draining more than 45,000 km². The Jaalikiluk River rises in Napatuuq District on the eastern slopes of the Lorond Range, where meltwater from the Lorond Glacier is an important source. It first flows east out of the mountains through Central Gardens and North Gardens districts of New City, then turns north into the gorge of Ikkasuvva District, where an ancient glacial moraine dams it into the jade-green Lake Ikkasuvva on the valley floor. It then crosses the wilderness of the Upper Jaalikiluk Improvement District, gathering the waters between the Lorond and Maslin ranges, and enters the alluvial plain of Jaalikiluk City, reaching the northern sea at the Jaalikiluk Mouth in Kilukvik District. The lower plain is wheat fields, fodder meadows and family dairy farms; there is a small fishing port at the mouth, whose boats catch salmon and cod in the estuary and inshore, and the broad delta wetlands are an important stopover for migrating birds. The Jaalikiluk River Highway follows the valley north from New City all the way to Kilukvik on the lower river, the longest territorial road on the island. In Tavrunaq the river's name means \"wind river\".\nFarmers on the lower river say that in spring, as soon as the wind turns warm, the snow upstream begins to melt, and when the river rises it is time to sow. The wind in the valley always blows along the river, and the herders' saying \"Jaali kiluk, nirsa pirri\", \"the wind follows the river, the reindeer follow the wind\", is about this river: lost on the snowfields, follow the wind to the river and the river to people. On winter nights, households along the river at Kilukvik put a candle in the window to light the way for anyone walking in the dark."
  - id: nat_jaxtgn
    subtype: lake
    status: generated
    names:
      zh: 克拉尔瓦滕湖
      en: Lake Klarvatn
      art-x-viking: Klarvatn
    notes:
      zh: "北维京岛面积最大的湖泊，面积两百三十多平方公里（237.4 平方公里），位于勒克尔市克拉尔瓦滕区，北端伸入勒克尔维克区。湖水来自洛龙山脉北段的融雪和冰川融水，德雷卡廷冰川的融水也顺山谷流入，水质极清，晴天时可以看到几米深的湖底，湖名由此而来。环湖分布着几座小镇和木屋酒店，居民以维京语为母语，老年人和退休移居者较多，周围山坡上的针叶林养活着林业和木材加工；区里严格控制湖岸开发，保护水源和湿地。夏季可以划船、游泳、帆板和垂钓，冬季湖面封冻后成为冰钓和滑冰的乐园；湖里出产鳟鱼和白鲑，渔民用传统方法捕捞，烟熏鳟鱼是当地特产。纳帕图克公路从洛龙山区下来，在湖的南岸到达终点，是从平原进入山区的必经之路。湖岸的克拉尔瓦滕湖滨公园修有步道、观鸟台和露营地；从北岸南望，德雷卡廷峰一带的雪峰倒映湖中，日出和日落时尤其动人。\n冬季湖面封冻后，冰钓的人在冰上搭起一座座彩色小木屋，排成一座小镇，屋里生着炉子，钓上来的白鲑当场在炉上煎；冰层够厚的时候，湖心还会办一场冰上集市。湖岸的人说冬天的湖上「比夏天的镇上还热闹」。"
      en: "North Viking Island's largest lake, over 230 km² (237.4 km²), in Klarvatn District of Lekor City, its northern end reaching into Lekorvik District. Its water comes from the snowmelt and glacier melt of the northern Lorond Range, including meltwater from the Drekatind Glacier running down the valleys, and it is so clear that on a sunny day you can see the bottom several metres down, which is what the name means. Small towns and log-cabin hotels ring the lake; the people speak Viking as their first language, many are elderly or retirees who moved here, and the conifer forests on the slopes keep forestry and timber mills going. The district strictly limits building on the shore to protect the water supply and wetlands. In summer there is boating, swimming, windsurfing and fishing, and in winter the frozen lake becomes a playground for ice fishing and skating; the lake yields trout and whitefish caught by traditional methods, and smoked trout is the local speciality. The Napatuuq Highway comes down from the Lorond mountains and ends on the south shore, the gateway from the plain into the hills. Klarvatn Shore Park has paths, a bird hide and a campsite; from the north shore, the snowy peaks around Drekatind are mirrored in the lake, especially lovely at sunrise and sunset.\nOnce the lake freezes, ice fishers put up brightly painted little huts on the ice, lined up like a small town, with a stove in each where whitefish are fried as soon as they are caught; when the ice is thick enough, an ice market is held in the middle of the lake. People on the shore say that in winter the lake is \"livelier than the town in summer\"."
