    names: { zh: 暖河, en: Warm River, art-x-viking: Warmfluss, art-x-buckham: Fiume Caldo }
    notes:
      zh: 群岛最长的河，全长一百一十多公里，流域六千多平方公里，发源于暖泉火山东北坡，先经克莱特斯塔德市落日区的高地，再向东流过暖泉市暖河区入海，河口正对长船岛的船尾。温泉水汇入后，河水冬季也不封冻，河口的港口全年通航，是暖泉岛最重要的货运港和渔港，港区的水产加工厂把鳕鱼、鲑鱼、虾和贝类加工后销往群岛各地。暖河两岸修建了滨河公园和步道，冬季河面上蒸汽升腾，与岸边的积雪相映成趣。西格利跨海高速以近二十七公里长的暖河特大桥跨越河口外的海面，暖河高速从河口通往温泉区和暖泉机场，途中以一座七公里长的特大桥跨越暖河。
      en: The longest river in the islands, a little over 110 km long with a basin of more than 6,000 km². It rises on the north-east slope of Warmspring Volcano, crosses the uplands of Sunset District in Klettstad City and then flows east through Warm River District of Warmspring City to the sea, its mouth facing Longship Island's stern. Fed by hot springs, it never freezes even in winter, so the port at its mouth is open all year, the most important cargo and fishing port on the island, where processing plants prepare cod, salmon, prawns and shellfish for the rest of the islands. Riverside parks and paths line both banks, and in winter steam rises from the water against the snow on the banks. The Sigley Sea Crossing spans the sea off the mouth on the Warm River Sea Bridge, nearly 27 km long, and the Warm River Expressway, running from the mouth to Hot Springs District and Warmspring Airport, crosses the river on a 7 km bridge of its own.
  - id: nat_n7yk9p
    subtype: river
    status: generated
    detect: { kind: river, at_km: [36.2, 23.8] }
    names: { zh: 灰河, en: Ash River, art-x-viking: Aschefluss, art-x-buckham: Fiume della Cenere }
    notes:
      zh: 暖泉火山西南坡的河，全长一百多公里，流域八千多平方公里，发源于克莱特斯塔德市克莱特斯塔德区，向南流经新特雷曼区的谷地后入海。河水带着火山灰，呈灰白色，灰河由此得名，入海处冲出黑色的沙洲；特雷曼湾外由火山灰堆积而成的灰岛，是海鸟和海豹的栖息地。河谷两侧是新特雷曼区的地热田和温室区，玻璃温室沿着地热管道成片排列，冬季的黑夜里亮着补光灯。群岛跨海高速、暖泉南环高速和暖泉环山公路都跨越灰河，沿河谷的公路可以看到喷气孔冒出的白色蒸汽。灰河的流域面积比暖河更大，长度则稍短一些。
      en: The river of Warmspring Volcano's south-west slope, a little over 100 km long with a basin of more than 8,000 km². It rises in Klettstad District of Klettstad City and flows south through the valleys of New Tremaine District to the sea. Its water carries volcanic ash and runs greyish white, which gave the Ash River its name, and it has built black sandbars at its mouth; Ash Isle off Tremaine Bay, piled up from volcanic ash, is home to seabirds and seals. Geothermal fields and greenhouses line the valley, rows of glasshouses following the heating mains and shining with grow-lights through the winter dark. The Island Chain Expressway, the Warmspring Southern Arc Expressway and the Warmspring Volcano Road all cross the Ash River, and from the valley roads you can see white steam rising from the vents. Its basin is larger than the Warm River's, though the river itself is a little shorter.
