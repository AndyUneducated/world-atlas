    names: { zh: 灰河, en: Ash River, art-x-viking: Aschefluss, art-x-buckham: Fiume della Cenere }
    notes:
      zh: "灰河是暖泉火山西南坡的河，全长一百多公里，流域八千多平方公里，发源于克莱特斯塔德市克莱特斯塔德区，向南流经新特雷曼区的谷地后入海。河水带着火山灰，呈灰白色，灰河由此得名，入海处冲出黑色的沙洲；特雷曼湾外由火山灰堆积而成的灰岛，是海鸟和海豹的栖息地。灰河的流域面积比暖河更大，长度则稍短一些。\n河谷两侧是新特雷曼区的地热田和温室区，喷气孔冒着白色的蒸汽，泥火山咕嘟作响，玻璃温室沿着地热管道成片排列，冬季的黑夜里亮着补光灯，从远处看像一片发光的湖面。新特雷曼年平均气温近 11 度，是群岛最暖的城市，地热又把冬天的温室烘得暖洋洋的，番茄、黄瓜和香草四季不断，经冷藏车运往长船和群岛各地。群岛跨海高速和暖泉环山公路都跨越灰河，沿河谷的公路可以看到喷气孔冒出的白色蒸汽。\n灰河的水不能直接饮用，却是天然的「颜料」：河口的黑沙被孩子们装进玻璃瓶做纪念品，镇上的陶匠把河泥掺进釉里，烧出灰蓝色的碗盘。地热温室里种出的番茄和黄瓜在冬夜的补光灯下长得飞快，新特雷曼的人说，在灰河谷「冬天吃的蔬菜，是火山种的」。"
      en: "The Ash River flows from the south-western slopes of Warmspring Volcano, a little over 100 km long with a basin of more than 8,000 km²; it rises in Klettstad District of Klettstad City and runs south through the valleys of New Tremaine District to the sea. Its water carries volcanic ash and runs greyish white, which gave the river its name, and at its mouth it builds black sandbars; Ash Isle, built of volcanic ash outside Tremaine Bay, is home to seabirds and seals. The Ash River drains a larger basin than the Warm River but is a little shorter.\nOn either side of the valley lie New Tremaine's geothermal fields and greenhouses: fumaroles send up white steam, mud pots bubble, and glasshouses line the geothermal pipes in rows, their grow lamps lit through the winter dark so that from afar they look like a glowing lake. New Tremaine averages nearly 11 °C over the year, the warmest city in the islands, and geothermal heat keeps the greenhouses warm through winter, so tomatoes, cucumbers and herbs are grown all year and go by refrigerated lorry to Longship and the rest of the islands. The Island Chain Expressway and the Warmspring Volcano Road both cross the Ash River, and from the valley road you can see white steam rising from the fumaroles.\nThe river's water is not fit to drink, but it is a natural \"paint\": children fill glass bottles with the black sand from its mouth as souvenirs, and the town's potters mix river mud into their glazes to fire grey-blue bowls and plates. Tomatoes and cucumbers in the geothermal greenhouses grow fast under the winter lamps, and New Tremaine people say that in the Ash valley \"the vegetables we eat in winter are grown by the volcano\"."
