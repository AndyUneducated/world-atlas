    names: { zh: 暖河, en: Warm River, art-x-viking: Warmfluss, art-x-buckham: Fiume Caldo }
    notes:
      zh: "暖河是群岛最长的河，全长一百一十多公里，流域六千多平方公里，发源于暖泉火山东北坡，先经克莱特斯塔德市落日区的高地，再向东流过暖泉市暖河区入海，河口正对长船岛的船尾。温泉水汇入后，河水冬季也不封冻，河口的港口全年通航，是暖泉岛最重要的货运港和渔港，港区的水产加工厂把鳕鱼、鲑鱼、虾和贝类加工后销往群岛各地。\n暖河区约有 16 万人，港口工人、渔民和加工厂的员工是区里的主力。暖河两岸修建了滨河公园和步道，冬季河面上蒸汽升腾，与岸边的积雪相映成趣，秋天则有鲑鱼逆流而上，钓鱼的人沿河岸排开。西格利跨海高速以近二十七公里长的暖河特大桥跨越河口外的海面，暖河高速从河口通往温泉区和暖泉机场，途中以一座七公里长的特大桥跨越暖河，暖泉的游客从机场下来，常沿着这条高速一路看着河谷的蒸汽进城。\n冬天河面蒸汽升腾时，暖河区的孩子们会在岸边看「河冒烟」，比赛谁先在雾里认出对岸的路灯。渔港的鱼市一早就开，刚上岸的鳕鱼当场切块，配上土豆和黄油做成一锅鱼汤，是暖泉人冬天的头号家常菜。老渔民说，暖河的鱼汤之所以鲜，是因为「河是热的，鱼是冷的」，冷水里的鱼肉紧实，到了热锅里正好。"
      en: "The Warm River is the longest river in the islands, a little over 110 km long with a basin of more than 6,000 km²; it rises on the north-eastern slopes of Warmspring Volcano, crosses the uplands of Sunset District in Klettstad City and then flows east through Warm River District of Warmspring City to the sea, its mouth facing Longship Island's stern. Fed by hot springs, it does not freeze even in winter, so the port at its mouth is open all year, Warmspring Island's most important cargo and fishing port, where seafood plants process cod, salmon, prawns and shellfish for sale across the islands.\nWarm River District has some 160,000 people, mostly dockers, fishermen and seafood workers. Riverside parks and paths line both banks; in winter steam rises off the water against the snow on the banks, and in autumn salmon run upstream with anglers lined up along the shore. The Sigley Sea Crossing spans the sea off the river mouth on the Warm River Sea Bridge, nearly 27 km long, while the Warm River Expressway runs from the mouth to Hot Springs District and Warmspring Airport, crossing the river on a seven-kilometre bridge on the way; visitors arriving at the airport often ride into town along it watching the steam in the valley.\nWhen steam rises off the river in winter, Warm River's children gather on the bank to watch \"the river smoking\" and race to spot the streetlights on the far side through the mist. The fish market at the harbour opens early, cod fresh off the boats are cut up on the spot and cooked with potatoes and butter into fish soup, Warmspring's favourite winter dish. Old fishermen say Warm River fish soup tastes so good because \"the river is warm and the fish are cold\": fish from cold water have firm flesh, just right for the hot pot."
  - id: nat_n7yk9p
