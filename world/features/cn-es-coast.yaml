      zh: "埃武托拉公社中心外的海湾，面积约 95 平方公里，名字意为「大家的家的海湾」。公社的渔港、公共浴场和海滨公园沿湾排开，湾畔的长堤是公社居民傍晚散步的地方，每逢节日，湾里的龙舟赛由各区的合作社组队参加。公社的龙舟赛没有奖金，赢的队伍只得到一面写着「Evu」的旗，下一年由他们负责请所有队伍吃饭，所以赢家常常笑着抱怨赢得太贵。"
      en: "The bay off the centre of Evutola Commune, about 95 km²; its name means 'bay of everyone's home'. The commune's fishing harbour, public baths and seaside park line it, the long embankment on its shore is where the commune's people walk in the evening, and on festival days the cooperatives of every district race dragon boats on it. The commune's dragon-boat race has no prize money: the winning crew gets only a flag reading \"Evu\" and must host a dinner for every crew the next year, so winners often grumble, laughing, that victory comes expensive."
  - id: nat_qrx8p0
