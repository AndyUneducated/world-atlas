    names: { zh: 塔卢努海峡, en: Talunu Strait, art-x-ivuran: Talunutiva }
    notes:
      zh: "塔卢努岛和主岛之间的海峡，宽约 23 公里，是进出塔卢马兰湾的主航道，航道两侧设有灯浮标，进港的大船在这里换上引航员。海峡里潮流湍急，渔民的小船常在退潮时沿岸边进出。引航员登船时要从小艇攀上大船舷边的绳梯，塔卢马兰的引航员个个手上有老茧，他们自嘲说「我们是靠爬梯子吃饭的」。"
      en: "The strait between Talunu Island and the main island, about 23 km wide and the main channel into and out of Talumaran Bay; lit buoys mark the fairway, and large ships take on their pilots here. The tide runs fast through the strait, and fishing boats keep to the shore when it ebbs. Pilots board by climbing a rope ladder from their launch up the side of the big ships, every Talumaran pilot has calloused hands, and they joke that \"we earn our living on ladders\"."
  - id: nat_rhcv7j
    subtype: estuary
    status: generated
    detect: { kind: estuary, at_km: [85.2, 170.8] }
    names: { zh: 哈努西鲁河口, en: Hanusiru Mouth, art-x-ivuran: Hanusirukalu }
    notes:
      zh: "领地最长的河流哈努西鲁河入海的地方，在萨伦纳姆市萨鲁凯区，离萨伦纳姆老城约九十公里。河口宽阔，分汊的水道之间是沙洲和红树林；萨伦纳姆港的集装箱码头和散货码头沿河口两岸展开，三角洲的稻米、香料和水产从这里装船出口。三角洲的人说哈努西鲁河一路从高原背下来的不是水，是土：「Hanu siru, hanu olu」，意思是「大河大，稻也大」，每年河水带来的淤泥让三角洲的稻田越种越肥。"
      en: "Where the Hanusiru, the longest river in the territory, reaches the sea, in Sarukkai District of Sarunnam City, some 90 km from the old city. The mouth is wide, with sandbars and mangroves between its branching channels, and the container and bulk quays of the Port of Sarunnam line both banks, shipping out the rice, spices and seafood of the delta. Delta people say the Hanusiru carries not water down from the plateau but soil: \"Hanu siru, hanu olu\", great river, great rice, for the silt the river brings each year makes the delta's paddies richer with every season."
  # ── Capes ──────────────────────────────
  - id: nat_bpv2zp
