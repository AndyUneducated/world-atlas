    notes:
      zh: "瓦希拉群岛三座岛屿围成的海湾，面积约 450 平方公里，湾内水深浪静，是海军基地的锚地和舰艇训练水域，未经许可的船只不得驶入。水兵们把锚地叫作「家里的院子」，演训结束回到湾里，舰艇会拉一声长笛，岸上的营区听到就知道「人都回来了」。"
      en: "The bay enclosed by the three Vahira Islands, about 450 km², deep and calm; it is the naval base's anchorage and training water, and no ship may enter without permission. Sailors call the anchorage \"the back yard\", and when the ships return from exercises they sound one long blast, so everyone ashore in the base knows \"they're all home\"."
  - id: nat_2ff02a
