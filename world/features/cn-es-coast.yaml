      en: "A bay on the coast south-west of Pennaram City, about 290 km²; in Ivuran the name means 'bay of the shore of waves'. The Pennasiru River enters at its head, the fishing villages on its shore put out at dawn and come home in the afternoon, and the family guesthouses on its beaches are known for their sunsets. Guesthouse owners knock on doors half an hour before sunset, everyone carries a glass of palm wine down to the sand, and the whole beach applauds the moment the sun drops into the sea."
  - id: nat_mer33e
