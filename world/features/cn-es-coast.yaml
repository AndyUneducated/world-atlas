    names: { zh: 皮卢海峡, en: Pilu Strait, art-x-ivuran: Pilutiva }
    notes:
      zh: "皮卢岛和皮卢尼岛之间的海峡，宽约 23 公里，伊武兰语名意为「小船的水道」。皮卢区的渔船和去往瓦希拉群岛的补给船都从这里经过，海峡两岸各有一座灯塔。两岸的灯塔一明一暗交替闪烁，渔民说这是两座岛在「说悄悄话」，夜里渡海时只要对准两盏灯中间走，就不会偏航。"
      en: "The strait between Pilu Island and Piluni Island, about 23 km wide; its Ivuran name means 'channel of the little boats'. The fishing boats of Pilu District and the supply ships for the Vahira Islands pass through it, and a lighthouse stands on each shore. The two lighthouses flash in turn, which fishers call the two islands \"whispering\"; crossing at night, you only need to steer midway between the two lights to keep your course."
  - id: nat_wcvgvv
    subtype: strait
    status: generated
