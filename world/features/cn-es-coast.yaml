    notes:
      zh: "彭纳拉姆市西南海岸的海湾，面积约 290 平方公里，伊武兰语意为「浪之岸的海湾」。彭纳西鲁河在湾顶入海，湾边的渔村清晨出海、午后回港，海滩上的家庭旅馆以看日落闻名。家庭旅馆的主人会在日落前半小时敲门提醒客人，大家端着一杯椰子酒坐到沙滩上，太阳落进海里的那一刻，整片海滩会一起鼓掌。"
      en: "A bay on the coast south-west of Pennaram City, about 290 km²; in Ivuran the name means 'bay of the shore of waves'. The Pennasiru River enters at its head, the fishing villages on its shore put out at dawn and come home in the afternoon, and the family guesthouses on its beaches are known for their sunsets. Guesthouse owners knock on doors half an hour before sunset, everyone carries a glass of palm wine down to the sand, and the whole beach applauds the moment the sun drops into the sea."
  - id: nat_mer33e
    subtype: bay
    status: generated
    detect: { kind: bay, at_km: [256.8, 294.8] }
    names: { zh: 马纳卢湾, en: Manalu Bay, art-x-ivuran: Manalulavu }
    notes:
      zh: "洛米兰市马纳卢区外的海湾，面积约 230 平方公里，伊武兰语意为「河口之湾」，洛米西鲁河在湾的西侧入海。湾岸是红树林和椰林，海滩上有海龟产卵地，产卵季节海滩在夜间封闭。产卵季的夜里，志愿者打着红光手电在海滩上巡逻，护送刚孵出的小海龟爬向大海，村里的孩子们以能当一晚「海龟护卫」为荣。"
      en: "The bay off Manalu District of Lomiran City, about 230 km²; in Ivuran the name means 'bay of the river mouth', and the Lomisiru River enters its western side. Mangroves and coconut groves line it, and turtles nest on its beaches, which close at night in the nesting season. On nesting-season nights volunteers patrol the beach with red-light torches, escorting newly hatched turtles to the sea, and the village children count a night as a \"turtle guard\" a great honour."
  - id: nat_9fy0x5
    subtype: bay
    status: generated
    detect: { kind: bay, at_km: [258.2, 36.2] }
