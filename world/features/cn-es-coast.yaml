    notes:
      zh: 领地最长的河流哈努西鲁河入海的地方，在萨伦纳姆市萨鲁凯区，离萨伦纳姆老城约九十公里。河口宽阔，分汊的水道之间是沙洲和红树林；萨伦纳姆港的集装箱码头和散货码头沿河口两岸展开，三角洲的稻米、香料和水产从这里装船出口。
      en: Where the Hanusiru, the longest river in the territory, reaches the sea, in Sarukkai District of Sarunnam City, some 90 km from the old city. The mouth is wide, with sandbars and mangroves between its branching channels, and the container and bulk quays of the Port of Sarunnam line both banks, shipping out the rice, spices and seafood of the delta.
