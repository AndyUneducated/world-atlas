    notes:
      zh: "洛米兰市塔卡维区向西北伸入海中的岬角，伸出约 18 公里，是领地最突出的岬角，伊武兰语意为「树冠之岬」。岬上覆盖着原始的低地雨林，林冠一直长到海边的崖顶，犀鸟常在岬角的大树上筑巢。岬上的犀鸟每天清晨飞越岬角去对岸觅食，翅膀扇动的声音像远处有人在拍被子，护林员说，听这声音就能数出今年有几对犀鸟。"
      en: "The headland of Takavi District, Lomiran City, reaching about 18 km out to sea to the north-west, the most prominent cape in the territory; in Ivuran the name means 'cape of the canopy'. Old lowland rainforest covers it, its canopy running right to the cliff tops by the sea, and hornbills nest in its great trees. Every morning the cape's hornbills fly across it to feed, their wingbeats sounding like someone beating a quilt in the distance, and the forest guards say they can count this year's pairs by ear."
  - id: nat_syv19z
    subtype: cape
    status: generated
    detect: { kind: cape, at_km: [347.8, 203.2] }
