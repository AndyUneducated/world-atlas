# Coastal landforms of the Everlong Summer Islands Territory: islands and their archipelagos, bays, capes,
# straits and river mouths. The generator finds them in the coastline (pipeline/atlas/coast.py); each entry
# names the landform of `detect.kind` nearest to `detect.at_km` (design km, x east, y north). An archipelago
# is the named islands it lists. Unnamed landforms are listed in .cache/candidates-div_nwm019.json after a build.
features:
  # ── Islands ──────────────────────────────
  - id: nat_8rtv1q
    subtype: island
    status: generated
    detect: { kind: island, at_km: [55.2, 130.8] }
    names: { zh: 基鲁迈岛, en: Kirumai Island, art-x-ivuran: Kirumai }
    notes:
      zh: "基鲁迈岛是基鲁迈群岛的主岛，面积约 2.04 万平方公里，是主岛之外领地最大的岛屿，伊武兰语叫「Kirumai」，意为「一串珍珠」，与群岛和联合邦同名。岛上地势低缓，最高处海拔五百米左右，中部的丘陵上是椰林和小块的稻田。岛北港湾边的迈萨里区是城区和联合邦议会所在地，区名意为「珍珠的港湾」，住着 16 万人，港湾边是渡轮码头、海鲜市场和度假酒店，老街保留着高脚木屋和雕花的船屋，基鲁迈机场有航班飞往萨伦纳姆和米雷兰；伊米穆高速从这里出发，经哈努西鲁河口跨海大桥通往主岛。岛南的卡朗加区是乡村和传统村落，区名意为「珊瑚」，住着 6 万人，村落沿海湾分布，村里的长屋是议事和过节的地方；卡朗加空军基地也在岛南，是空军在长夏群岛的主基地。\n村民至今按老规矩出海，几户人家合用一条船，回港后把渔获在沙滩上分成一堆堆，老人、孩子和没出海的人家也有一份，叫作「分海」。空军基地每年的航空开放日是全群岛的节日，那天渡轮上挤满从别的岛赶来看飞机的孩子。\n岛民把环岛公路叫作「珍珠线」，骑车绕岛一圈要两三天，沿途每个村口都有卖嫩椰子的小摊，砍开就喝，椰壳顺手还给摊主当柴烧。"
      en: "Kirumai Island is the main island of the Kirumai Islands, about 20,400 km² and the largest island in the territory after the main island; in Ivuran it is \"Kirumai\", meaning \"a string of pearls\", the name it shares with the islands and the Commonwealth. The island is low and gentle, rising to about 500 m, with coconut groves and small rice fields on the hills in the middle. Maisari District, by the harbour in the north, is the town and the seat of the Commonwealth Assembly; its name means \"harbour of pearls\", it is home to 160,000 people, the ferry terminal, seafood market and resort hotels stand by the harbour, the old streets keep their stilt houses and carved boat houses, and Kirumai Airport has flights to Sarunnam and Mirelan; the Imimu Expressway starts here and crosses to the main island by the Hanusiru Mouth Bridge. Karanga District in the south, whose name means \"coral\", is country of farms and traditional villages with 60,000 people; the villages lie along the bays, and their long houses are where the village meets and celebrates; Karanga Air Base, the air force's main base in the Everlong Summer Islands, is in the south of the island as well.\nVillagers still go to sea by the old rules: several households share a boat, and back in harbour the catch is divided into heaps on the sand, with a share for the old, the children and the households that did not go out, a custom called \"sharing the sea\". The air base's annual open day is a holiday for all the islands, and the ferries that day are crowded with children from the other islands coming to see the planes.\nIslanders call the round-the-island road the \"Pearl Line\"; cycling the loop takes two or three days, every village entrance has a stall selling green coconuts cut open on the spot, and the empty shells go back to the stallholder as firewood."
  - id: nat_y42v6p
    subtype: island
    status: generated
    detect: { kind: island, at_km: [66.2, 78.8] }
    names: { zh: 蒂卢迈岛, en: Tilumai Island, art-x-ivuran: Tilumai }
    notes:
      zh: "蒂卢迈岛是基鲁迈群岛的第二大岛，面积约 1.22 万平方公里，伊武兰语叫「Tilumai」，意为「三颗珍珠」，全岛属蒂卢迈区，住着约 6 万人。岛上地势平缓，最高处海拔四百多米，内陆是椰林、小块稻田和次生林，基鲁迈群岛高速跨海通到岛上，把它和基鲁迈岛、奥罗武岛连在一起。岛上的村落世代打渔、种椰子，如今不少人家开起了潜水店和民宿。岛周围的珊瑚礁和礁外的海底峭壁是有名的潜水地，潜水学校和度假村沿西岸排开，蒂卢迈潜水度假村就在西岸，礁外的峭壁一直陡降到深蓝色的海里。为了保护珊瑚，领地规定每处潜点每天的潜水人数，船只只能系在浮标上，不准抛锚。\n潜水向导大多是本地渔民的孩子，他们给礁石上的大石斑鱼都起了名字，带客人下水时像介绍邻居一样介绍它们；收工后，向导们在沙滩上烤鱼，跟游客讲哪条石斑最近胖了、哪只海龟又回来了。旺季的西岸海滩上，晾着成排的潜水服，傍晚的海面上漂着一串串系在浮标上的小船。\n潜水教练都有一份私藏的「海底地图」，标着哪块礁石下住着哪条海鳝，新学员第一次下水，教练总会先带去跟最温顺的那条「打个招呼」。"
      en: "Tilumai Island is the second island of the Kirumai Islands, about 12,200 km² in area; in Ivuran it is \"Tilumai\", meaning \"three pearls\", and the whole island is Tilumai District, home to about 60,000 people. The island is gentle, rising to a little over 400 m, with coconut groves, small rice fields and regrown forest inland, and the Kirumai Islands Expressway crosses the sea to it, linking it with Kirumai and Orovu. Its villages have fished and grown coconuts for generations, and today many families also run dive shops and guesthouses. The reefs around it and the underwater cliffs beyond them are well known to divers, and dive schools and resorts line its western shore, among them the Tilumai Dive Resort, beyond whose reef the cliffs drop away into deep blue water. To protect the coral, the territory limits the number of divers at each site each day, and boats may only tie up to buoys, never drop anchor.\nMost of the dive guides are local fishers' children, who have named the big groupers on the reef and introduce them to visitors underwater as if they were neighbours; after work the guides grill fish on the beach and tell visitors which grouper has put on weight lately and which turtle has come back. In the high season rows of wetsuits hang drying along the western beaches, and in the evening strings of small boats ride at their buoys.\nEvery dive instructor keeps a private \"seabed map\" marking which moray lives under which rock, and on a new student's first dive the instructor always takes them to \"say hello\" to the gentlest one first."
  - id: nat_n46nzp
    subtype: island
    status: generated
    detect: { kind: island, at_km: [93.8, 43.2] }
    names: { zh: 奥罗武岛, en: Orovu Island, art-x-ivuran: Orovu }
    notes:
      zh: "奥罗武岛在基鲁迈群岛的中部，面积约 8700 平方公里，伊武兰语叫「Orovu」，意为「老家」，传说是伊武兰人的祖先渡海登陆的地方。全岛属奥罗武区，住着约 5 万人，岛上地势起伏和缓，最高处海拔 353 米，丘陵上是椰林和雨林，海岸是沙滩和红树林。基鲁迈群岛高速跨海通到岛上，是这条高速的终点。岛上的村落保留着群岛最完整的传统，长屋、船屋和祭祀场按古老的格局排列：长屋是全村议事和节庆的地方，船屋里收着雕花的独木舟，祭祀场上立着刻满花纹的木柱。岛议会由各村长屋的村民大会推举，管着渔场、村社土地和小学。游客须经村社同意才能进入村落，进村前要在村口的长凳上等一等，由长者出来迎接。\n岛民按老规矩生活，几户人家合用一条船出海，回港后在沙滩上「分海」；孩子们从小学划独木舟，十来岁就能在礁湖里比赛。每年的登陆节是全群岛最大的节日，各岛的独木舟船队都会划到这里，岸上的人整夜敲着木鼓等船。\n登陆节那天，独木舟船队在黎明时分同时冲上沙滩，第一条船的桨手要把一捧沙带回自己的岛，撒在家门口，岛民说这样祖先就认得回家的路。"
      en: "Orovu Island lies in the middle of the Kirumai Islands, about 8,700 km² in area; in Ivuran it is \"Orovu\", meaning \"old home\", and legend makes it the place where the ancestors of the Ivuran people came ashore from across the sea. The whole island is Orovu District, home to about 50,000 people; the land rolls gently up to 353 m, with coconut groves and rainforest on the hills and beaches and mangroves on the coast. The Kirumai Islands Expressway crosses the sea to the island and ends here. Its villages keep the most complete traditions in the islands, with long houses, boat houses and ceremonial grounds laid out in the old pattern: the long house is where the village meets and celebrates, the boat house holds carved canoes, and carved wooden posts stand on the ceremonial ground. The island assembly, chosen by the village meetings of the long houses, looks after fishing grounds, village land and primary schools. Visitors may enter a village only with the community's consent, and before going in they wait on the bench at the village entrance until an elder comes out to greet them.\nIslanders live by the old rules: several households share a boat, and back in harbour the catch is \"shared out\" on the sand; children learn to paddle canoes almost as soon as they can walk and are racing in the lagoon by the age of ten or so. The annual Landing Festival is the biggest festival in all the islands; canoe fleets from every island paddle here, and people on shore beat wooden drums all night waiting for the boats.\nOn Landing Day the canoe fleets run up the beach together at dawn, and the paddlers of the first boat ashore carry a handful of sand home to scatter at their doors, so that, islanders say, the ancestors know the way home."
  - id: nat_6b65mm
    subtype: island
    status: generated
    detect: { kind: island, at_km: [134.8, 26.2] }
    names: { zh: 马拉坎岛, en: Malakan Island, art-x-ivuran: Malakan }
    notes:
      zh: "马拉坎岛是基鲁迈群岛最南端的岛屿，面积约 6500 平方公里，伊武兰语叫「Malakan」，意为「花园之海」。岛上地势低平，最高处海拔一百多米，平均不到 90 米，四周是宽阔的礁盘和浅水潟湖。岛和周围的礁盘整片属马拉坎珊瑚礁保护区，常住人口约 8000 人；礁盘上栖息着海龟、蝠鲼和上千种珊瑚鱼，是群岛保存得最完好的一片珊瑚礁。保护区禁止捕捞，只允许有许可的小船进入，潜水和游船都要按名额预约；岛上不通公路，游客从基鲁迈岛的迈萨里渡轮码头乘船过来，再随保护站的船只进入礁区。\n马拉坎珊瑚礁保护站是岛上最重要的机构，研究人员监测水温和珊瑚白化，在水下的架子上培育珊瑚苗，一排排挂着像小树林；志愿潜水员每月下水一次，把长大的珊瑚苗移种到白化过的礁石上。岛上的常住居民大多在保护区工作，当巡护员、船工、向导和研究助手，傍晚收工后在沙滩边烤鱼，鱼是从别的岛买来的，因为自家门口的海一条也不许打。产卵季的夜里，沙滩边不许点亮灯，居民走夜路都打着发红光的小手电，免得把刚爬出沙窝的小海龟引错方向。\n孩子们放学后跟着巡护员数海龟巢，谁先数到一百个巢，就能给下一只孵出的小海龟起名字。"
      en: "Malakan Island is the southernmost of the Kirumai Islands, about 6,500 km² in area; in Ivuran it is \"Malakan\", meaning \"garden sea\". The island is low and flat, rising only a little over 100 m and averaging less than 90 m, and is ringed by broad reef flats and shallow lagoons. The island and its reefs are all the Malakan Coral Reef Reserve, home to about 8,000 people; turtles, manta rays and a thousand kinds of reef fish live on the reefs, the best-preserved coral in the islands. Fishing is banned in the reserve, only licensed small boats may enter, and dives and boat trips are by booked quota; there are no roads to the island, and visitors come by boat from the Maisari Ferry Terminal on Kirumai Island and then go out to the reefs on the station's boats.\nThe Malakan Coral Reef Station is the island's most important institution: its researchers monitor water temperatures and coral bleaching and raise coral seedlings on underwater frames, hung in rows like a little forest, and once a month volunteer divers go down to transplant the grown seedlings onto bleached reef. Most residents work for the reserve as rangers, boatmen, guides and research assistants, and in the evening after work they grill fish on the beach, fish bought from the other islands, since not one may be caught in the sea at their own door. On nesting-season nights no bright lights are allowed near the beaches, and residents walk about after dark with little red torches so as not to lead hatchlings astray as they climb out of the sand.\nAfter school the children help the rangers count turtle nests; whoever reaches a hundred first gets to name the next hatchling."
  - id: nat_kbsy7t
    subtype: island
    status: generated
    detect: { kind: island, at_km: [167.8, 28.8] }
    names: { zh: 皮卢岛, en: Pilu Island, art-x-ivuran: Pilu }
    notes:
      zh: "皮卢岛是基鲁迈群岛东端两座岛屿中较大的一座，面积约 4500 平方公里，伊武兰语叫「Pilu」，意为「小船」，与东边的皮卢尼岛同属皮卢区，两岛合计约 5 万人，在联合邦议会选举中合为一个选区，瓦希拉群岛的官兵也在这里投票。岛上地势低平，最高处海拔 138 米，环岛是珊瑚礁，礁外就是深水；岛上不通公路，进出全靠船。皮卢岛与皮卢尼岛隔着宽约 23 公里的皮卢海峡，两岸各有一座灯塔，一明一暗交替闪烁，渔民说那是两座岛在「说悄悄话」，夜里渡海时只要对准两盏灯中间走，就不会偏航。\n渔民从岛南的渔港出海，在礁外的深水里钓金枪鱼，钓上来的鱼除了在本岛卖，也冰鲜后装船运到迈萨里的海鲜市场。去往瓦希拉群岛的补给船也从这里出发，皮卢补给码头旁就是小渔港和灯塔，补给船起航前，码头上的渔家会往船上送一筐嫩椰子，说是给去远岛的人「带一口家里的水」。岛上还有一座小型度假村，来的多是想跟渔民出海钓鱼的游客。\n渔民钓到第一条金枪鱼，要切下鱼腹最肥的一块，当场在船上蘸青柠和辣椒生吃，岛上叫它「海的头一口」，回港后整条鱼才拿去卖。"
      en: "Pilu Island is the larger of the two islands at the eastern end of the Kirumai Islands, about 4,500 km² in area; in Ivuran it is \"Pilu\", meaning \"little boat\". With Piluni Island to the east it makes up Pilu District, about 50,000 people in all, which forms a single constituency in Commonwealth Assembly elections, and the personnel of the Vahira Islands vote here too. The island is low and flat, rising to 138 m, ringed by coral reef with deep water just beyond; there are no roads to it, and everything comes and goes by boat. Pilu and Piluni are separated by the Pilu Strait, about 23 km wide, with a lighthouse on each shore flashing in turn, and fishers say the two islands are \"whispering\"; crossing at night, you only have to steer between the two lights to stay on course.\nFishermen sail from the harbour in the south to catch tuna in the deep water beyond the reef, and besides what is sold on the island the catch is iced and shipped to the seafood market in Maisari. The supply ships for the Vahira Islands leave from here too; the Pilu Supply Quay stands beside a small fishing harbour and a lighthouse, and before a supply ship sails the fishing families on the quay hand a basket of green coconuts aboard, \"a sip of water from home\" for those going to the far islands. The island also has a small resort, whose guests mostly come to go out fishing with the fishermen.\nWhen a fisher lands the first tuna of a trip, the fattiest cut of the belly is eaten raw on deck with lime and chilli, \"the sea's first bite\" in island speech, before the rest of the fish goes to market."
  - id: nat_5waqej
    subtype: island
    status: generated
    detect: { kind: island, at_km: [192.8, 35.2] }
    names: { zh: 皮卢尼岛, en: Piluni Island, art-x-ivuran: Piluni }
    notes:
      zh: "皮卢尼岛在基鲁迈群岛的东端、皮卢岛以东，面积约 2900 平方公里，伊武兰语叫「Piluni」，名字意为「小皮卢」，词尾「-ni」在伊武兰语里就是「小」的意思。它是基鲁迈群岛六座岛屿中最小的一座，与皮卢岛隔着皮卢海峡相望，两岛同属皮卢区，在联合邦议会选举中合为一个选区。岛虽小，地势却比皮卢岛高，最高处海拔 290 米，平均海拔约 170 米，像一块从海里抬起的台地；岛上不通公路，进出全靠船。皮卢尼岛也是离瓦希拉群岛最近的有人岛，两地相隔约 206 公里。\n岛上人不多，有一座小型度假村和指引航道的灯塔，村民打渔、种椰子，也给度假村划船、当向导；渔场和入村许可这些事由岛议会商量决定。来度假的人多半是为了清静，夜里除了灯塔的光和满天的星星，四下一片漆黑。基鲁迈一带一年降水两千多毫米，月月有雨，岛上的坡地长满椰林和灌木，海鸟在临海的崖壁上筑巢；环岛的礁盘外就是深水，皮卢岛的金枪鱼渔船常到这一带下钓。\n灯塔守护人一家三代住在岛上，灯塔的铜钟每到整点敲一次，皮卢岛的渔民说，听不见钟声的时候，就是该回家的时候了。"
      en: "Piluni Island lies at the eastern end of the Kirumai Islands, east of Pilu Island, and covers about 2,900 km²; in Ivuran it is \"Piluni\", meaning \"little Pilu\", the ending \"-ni\" being the Ivuran for \"little\". It is the smallest of the six Kirumai Islands and looks across the Pilu Strait to Pilu Island; the two islands together make up Pilu District and form a single constituency in Commonwealth Assembly elections. Small as it is, it stands higher than Pilu Island, rising to 290 m with an average height of about 170 m, like a tableland lifted out of the sea; there are no roads to it, and everything comes and goes by boat. Piluni is also the inhabited island nearest the Vahira Islands, about 206 km away.\nFew people live here; there is a small resort and a lighthouse marking the channel, and the villagers fish, grow coconuts and row and guide for the resort, while matters such as fishing grounds and permission to enter the villages are settled by the island assembly. Most holidaymakers come for the quiet: at night there is nothing but the beam of the lighthouse and a sky full of stars. Kirumai gets more than 2,000 mm of rain a year, with rain in every month, so the island's slopes are thick with coconut palms and scrub, and seabirds nest on the sea cliffs; beyond the reef around the island lies deep water, where Pilu's tuna boats often come to fish.\nThree generations of one family have kept the lighthouse, whose brass bell rings on the hour; Pilu's fishers say that when they can no longer hear the bell, it is time to turn for home."
  - id: nat_e7syqw
    subtype: island
    status: generated
    detect: { kind: island, at_km: [259.2, 40.8] }
    names: { zh: 瓦希拉岛, en: Vahira Island, art-x-ivuran: Vahira }
    notes:
      zh: "瓦希拉岛是瓦希拉群岛的主岛，面积约 250 平方公里，是三座岛屿中最大的，最高处海拔 226 米，伊武兰语叫「Vahira」，意为「远方的岩石」。全岛属基鲁迈联合邦的瓦希拉群岛管理区，是海军基地的核心，未经许可不得靠近。岛东部小镇旁的瓦希拉基地营区是长夏舰队司令部和勤务保障部队的驻地，也是群岛上唯一有成片住房的地方，司令部大楼、营房、医院、学校和商店都在这里，分散在三座岛上的约 1.2 万名官兵和技术人员轮休时大多回到营区。岛中部的山体里开凿着瓦希拉地下作战指挥中心，地面上只看得到几处隧道口、通风竖井和天线；岛南的瓦希拉岛屿机场跑道不长，战斗机靠电磁弹射起飞、拦阻索降落，与基鲁迈岛的卡朗加空军基地互为备降场。岛上的淡水来自海水淡化厂，电力来自赫维拉岛的海上发电场，食品和燃料每周由补给船从皮卢补给码头运来。\n营区旁的小镇只有几条街，学校里的孩子大多是官兵和技术人员的子女。营区外围是热带树林，傍晚下了岗的官兵在林边跑步，偶尔能惊起一群海鸟。营区有一间对全体官兵开放的食堂，周末供应基鲁迈的炭烤鱼，水兵们说，轮岗离岛后最想念的不是海景，而是那盘烤鱼。"
      en: "Vahira Island is the main island of the Vahira Islands, about 250 km² and the largest of the three, rising to 226 m; in Ivuran it is \"Vahira\", meaning \"distant rocks\". The whole island is in the Vahira Islands Administration Zone of the Commonwealth of Kirumai and is the heart of the naval base, and it may not be approached without permission. The Vahira Base Garrison, beside a small town in the east of the island, houses the Everlong Summer Fleet headquarters and the base support units and is the only place in the islands with housing in any quantity: the headquarters building, barracks, hospital, school and shops are all here, and most of the roughly 12,000 service personnel and technicians spread over the three islands come back to the garrison on their rest days. The Vahira Underground Operations Centre is cut into the hill in the middle of the island, with nothing to be seen above ground but a few tunnel mouths, ventilation shafts and antennas; the runway of the Vahira Island Airfield in the south is short, so fighters launch by electromagnetic catapult and land on arrester wires, and the airfield and Karanga Air Base on Kirumai Island serve as each other's diversion fields. The island's fresh water comes from a desalination plant, its electricity from the offshore power farm off Hevila, and its food and fuel by weekly supply ship from the Pilu Supply Quay.\nThe small town beside the garrison has only a few streets, and most of the children at its school belong to service personnel and technicians. Tropical woodland surrounds the garrison, and in the evening off-duty personnel run along its edge, now and then startling a flock of seabirds. The base canteen is open to every rank and serves Kirumai-style grilled fish at weekends; sailors say what they miss most after rotating off the island is not the view but that plate of fish."
  - id: nat_zhnfs6
    subtype: island
    status: generated
    detect: { kind: island, at_km: [264.8, 35.2] }
    names: { zh: 塔鲁卡岛, en: Taruka Island, art-x-ivuran: Taruka }
    notes:
      zh: "塔鲁卡岛在瓦希拉群岛的东侧，面积约 140 平方公里，最高处海拔 245 米，是三座岛中最高的，伊武兰语叫「Taruka」，意为「深处」。全岛属瓦希拉群岛管理区，岛周围的海水很深，海军基地的潜艇洞库就开凿在岛上的山体里。塔鲁卡潜艇洞库是世界最大的潜艇洞库，可同时停靠 12 艘潜艇，洞口开在岛北的深水海湾，潜艇可以在水下直接驶进山体，泊位、维修船坞和弹药库都在岩层之下，洞库有独立的电源、通风和淡水系统，大型无人潜航器也在这里维护和充电。无人舰艇和水下无人航行器的自动化船坞沿岛的北岸排开：舰艇回港后由机械臂系泊、加注燃料、充电和装填，检修机器人沿轨道巡检船体，需要大修的由浮船坞抬出水面；控制室里少数几名操作员同时照看几十艘无人舰艇，巡逻任务由瓦希拉岛上的地下作战指挥中心统一安排。\n潜艇出港后不久就能潜入深海，从空中和卫星上都很难看到它们的进出，岛上的人也只是偶尔在清晨看见海湾里的水面起了一圈涟漪。\n岛名「深处」名副其实，离岸不远海底就陡降成深渊，潜艇从山体里的洞库直接驶入深水，岛上的老兵爱说「这里的海是竖着的」。"
      en: "Taruka Island lies on the eastern side of the Vahira Islands, about 140 km² in area and rising to 245 m, the highest of the three; in Ivuran it is \"Taruka\", meaning \"the deep\". The whole island is in the Vahira Islands Administration Zone, the water around it is very deep, and the naval base's submarine pens are cut into its hill. The Taruka Submarine Pens are the largest in the world, able to berth twelve submarines at once; their entrance opens onto a deep-water bay in the north of the island, submarines can sail into the hill without surfacing, and the berths, repair docks and magazines all lie beneath the rock, with their own power, ventilation and fresh water, while large uncrewed submersibles are maintained and charged here too. The automated docks for uncrewed ships and underwater vehicles line the northern shore: returning craft are moored, fuelled, charged and rearmed by robotic arms, inspection robots run along rails checking their hulls, and those due for overhaul are lifted out by a floating dock; a handful of operators in the control room watch over dozens of uncrewed vessels at once, their patrols assigned by the underground operations centre on Vahira Island.\nSubmarines leaving port can dive into deep water almost at once, and their comings and goings are hard to see from the air or from satellites; people on the island just occasionally notice a ring of ripples on the bay in the early morning.\nThe name \"the deep\" is earned: the seabed drops into an abyss close offshore, submarines sail straight from their caverns in the hillside into deep water, and the island's old hands like to say \"the sea here stands on end\"."
  - id: nat_z1x5j4
    subtype: island
    status: generated
    detect: { kind: island, at_km: [255.8, 33.2] }
    names: { zh: 赫维拉岛, en: Hevila Island, art-x-ivuran: Hevila }
    notes:
      zh: "赫维拉岛在瓦希拉群岛的西南，面积约 130 平方公里，最高处海拔 227 米，伊武兰语叫「Hevila」，名字意为「风中的光」，全岛属瓦希拉群岛管理区，是海军基地的能源和防空岛。岛外海面上是赫维拉海上发电场，由漂浮式风机、波浪能装置和海洋温差发电站组成，岛上的储能电站把电存起来，经海底电缆送往三座岛屿，供应基地的全部用电。岛上高处是定向能防空阵地，用高能激光和高功率微波拦截来袭的无人机、导弹和炮弹，激光只耗电、不耗弹药；热带的高温高湿会削弱光束，阵地旁的气象站随时测量大气、调整光束。岛外系泊着长约 1500 米的巨型浮动平台，由几段模块拼成，甲板上有直升机和无人机起降场、仓库和维修车间，是舰艇的海上前进补给站；深海研究站的水下生活舱也从这里下潜，能住 24 人，深潜器从这里下到数千米深的海沟。\n漂浮风机的叶片在海面上排成整齐的阵列，从驶近的补给船上看去，像一片会转动的白色森林，岛名「风中的光」也就有了新的意思。\n研究站的潜航员下潜前都要在码头边的木桩上系一根彩绳，回来再解下，木桩上常年挂着几根，岛上的人看一眼就知道今天有几个人在海底。"
      en: "Hevila Island lies in the south-west of the Vahira Islands, about 130 km² in area and rising to 227 m; in Ivuran it is \"Hevila\", meaning \"light in the wind\". The whole island is in the Vahira Islands Administration Zone, and it is the naval base's island of power and air defence. Offshore lies the Hevila Offshore Power Farm of floating wind turbines, wave energy devices and an ocean thermal energy plant; a storage station on the island holds the power and sends it by subsea cable to all three islands, supplying all the base's electricity. On the island's high ground is the directed-energy air defence site, which uses high-energy lasers and high-power microwaves to stop incoming drones, missiles and shells, the lasers consuming only electricity and no ammunition; the tropical heat and humidity weaken the beam, so a weather station beside the site constantly measures the air and adjusts it. Moored off the island is a giant floating platform about 1,500 m long, assembled from several modules, its deck carrying helicopter and drone pads, stores and workshops, a forward supply station for ships at sea; the underwater habitats of the deep-sea research station are lowered from here too, with room for 24 people, and deep submersibles dive from here into trenches thousands of metres deep.\nThe blades of the floating turbines stand in neat ranks on the sea, and from an approaching supply ship they look like a white forest that turns, which gives the island's name, \"light in the wind\", a new meaning.\nBefore a dive, each of the research station's pilots ties a coloured cord to a post on the quay and unties it on return; a few cords always hang there, and anyone on the island can tell at a glance how many people are under the sea."
  - id: nat_er2w9g
    subtype: island
    status: generated
    detect: { kind: island, at_km: [479.8, 251.8] }
    names: { zh: 塔卢努岛, en: Talunu Island, art-x-ivuran: Talunu }
    notes:
      zh: "塔卢努岛在塔卢马兰湾口外，面积约 310 平方公里，伊武兰语叫「Talunu」，意为「停泊之沙」，属塔卢马兰市的帕达兰区。岛上地势低平，最高处海拔只有 66 米，大部分是沙地、椰林和白沙海滩，岛名里的「沙」就来自环岛的白沙，退潮时沙洲一直伸到海里，涨潮时又缩回去。岛屿横在湾口，挡住了外海的风浪，使面积约 1630 平方公里、领地最大的塔卢马兰湾成为天然的避风港；岛和主岛之间是宽约 23 公里的塔卢努海峡，是进出塔卢马兰湾的主航道，航道两侧设有灯浮标，进港的大船在这里换上引航员。海峡里潮流湍急，渔民的小船常趁退潮沿岸边进出。\n岛上有灯塔、古老的石砌海防工事和白沙海滩，从塔卢马兰老港乘渡轮就能到，灯塔至今仍为进港的船只指路。石砌海防工事如今是一座小博物馆，炮台的射击孔被改成了观景窗，从窗里望出去，一边是外海，一边是湾里排队进港的货轮和伦博船厂的龙门吊。周末渡轮上多是来晒太阳、游泳的塔卢马兰人，船厂和电池厂的工人带着孩子来岛上露营，夜里躺在沙滩上看海峡里来往的船灯。\n渡轮上的导游常说，这座岛守了海湾这么多代，如今只用来守日落。"
      en: "Talunu Island lies off the mouth of Talumaran Bay, about 310 km² in area; in Ivuran it is \"Talunu\", meaning \"mooring sand\", and it belongs to Padaran District of Talumaran City. The island is low and flat, rising to only 66 m, mostly sand, coconut groves and white beaches; the \"sand\" in its name comes from the white sand all round it, whose bars run far out into the sea at low tide and shrink back as the tide rises. Lying across the mouth of the bay, it breaks the swell from the open sea and makes Talumaran Bay, about 1,630 km² and the largest bay in the territory, a natural haven; between the island and the main island runs the Talunu Strait, about 23 km wide, the main channel into and out of the bay, marked by lit buoys on either side, where incoming ships take on their pilots. The tidal streams in the strait are strong, and fishermen's small boats often slip in and out along the shore at low tide.\nThe island has a lighthouse, old stone sea defences and white beaches, and ferries run to it from Talumaran's old harbour; the lighthouse still guides ships into port. The stone sea defences are now a small museum with their gun ports turned into viewing windows, looking out on one side to the open sea and on the other to the freighters queuing to enter the bay and the gantry cranes of the Lumbo Shipyard. At weekends the ferries are full of Talumaran people coming to sunbathe and swim, and shipyard and battery workers bring their children to camp, lying on the beach at night watching the lights of ships passing through the strait.\nFerry guides like to say that the island guarded the bay for generations and now guards only the sunset."
  - id: nat_wdgcxk
    subtype: island
    status: generated
    detect: { kind: island, at_km: [176.8, 171.2] }
    names: { zh: 塞里努岛, en: Serinu Island, art-x-ivuran: Serinu }
    notes:
      zh: "塞里努岛是萨卢瓦伊湾里的小岛，面积约 170 平方公里，伊武兰语叫「Serinu」，意为「静沙」，属瓦利凯市的萨卢瓦伊区。岛上地势低平，最高处海拔 46 米，四周是宽阔的滩涂和浅水。萨卢瓦伊湾在主岛南岸西段、哈努西鲁河三角洲以东，面积约 760 平方公里，湾内风浪小、滩涂宽，萨卢瓦伊的区名意为「盐风」，沿岸是鱼虾和海藻的养殖场和晒盐场。塞里努岛周围的浅水是海藻和贝类的养殖场，岛上有晒盐场和几座渔村，家家门前晾着海藻和渔网，老人坐在檐下修补竹篓，渡船每天往返于岛和萨卢瓦伊区的海岸之间。养殖场按领地的环境标准运行，排水经过处理后才能入海。\n瓦利凯一带是领地雨水最多的地方，晒盐全看老天脸色，盐工们一看到天边起了雨云，就赶紧把盐堆盖上，岛上的孩子从小就会看云。退潮后的滩涂上，孩子们提着竹篓捡螺和小蟹，捡回家用香茅和辣椒一炒，就是萨卢瓦伊人常说的「海给的下酒菜」；养殖户划着小船收海藻，晒干后做成瓦利凯人出远门必带的海藻饼。\n晒盐场的盐工凌晨就下田耙盐，太阳一高就收工，岛上出的海盐带着一点海藻的鲜味，被瓦利凯的厨师们称为「会说话的盐」。"
      en: "Serinu Island is a small island in Saluvai Bay, about 170 km² in area; in Ivuran it is \"Serinu\", meaning \"still sand\", and it belongs to Saluvai District of Vallikkai City. The island is low and flat, rising to 46 m, and surrounded by wide mudflats and shallows. Saluvai Bay, on the western part of the main island's south coast east of the Hanusiru delta, covers about 760 km²; its waters are calm and its flats broad, Saluvai's name means \"salt wind\", and its shores are lined with fish, prawn and seaweed farms and salt pans. The shallows around Serinu are farmed for seaweed and shellfish, the island has salt pans and a few fishing villages, where seaweed and nets hang to dry outside every door and old people sit under the eaves mending bamboo baskets, and a ferry crosses every day between the island and the Saluvai coast. The farms are run to the territory's environmental standards, and their waste water is treated before it reaches the sea.\nThe country around Vallikkai is the rainiest in the territory, and salt-making depends on the weather: as soon as the salt workers see rain clouds on the horizon they rush to cover their heaps, and the island's children learn to read the clouds from an early age. On the flats at low tide the children gather whelks and small crabs in bamboo baskets, to be stir-fried at home with lemongrass and chilli, what Saluvai people call \"the sea's gift to go with a drink\", while the farmers row out to harvest seaweed, which is dried and made into the seaweed cakes Vallikkai people always pack for a long journey.\nSalt workers rake the pans before dawn and stop once the sun is high; the island's sea salt carries a faint savour of seaweed, and Vallikkai's cooks call it \"the salt that talks\"."
  # ── Archipelagos ──────────────────────────────
  - id: nat_69pc21
    subtype: archipelago
    status: generated
    islands: [nat_8rtv1q, nat_y42v6p, nat_n46nzp, nat_6b65mm, nat_kbsy7t, nat_5waqej]
    names: { zh: 基鲁迈群岛, en: Kirumai Islands, art-x-ivuran: Kirumaivaru }
    notes:
      zh: "基鲁迈群岛在主岛西南端外，由基鲁迈岛、蒂卢迈岛、奥罗武岛、马拉坎岛、皮卢岛和皮卢尼岛六座岛屿组成，总面积约 5.5 万平方公里，伊武兰语叫「Kirumaivaru」，群岛名意为「一串珍珠」。六座岛从主岛西南端向南延伸、再向东弯成一道弧形，和主岛之间隔着约 140 公里宽的海面；最大的基鲁迈岛约 2.04 万平方公里，最小的皮卢尼岛不到 3000 平方公里，各岛地势低缓，最高处是基鲁迈岛上海拔五百米左右的丘陵。群岛靠近赤道，一年降水两千四百到两千七百毫米，月月有雨。六座岛结成基鲁迈联合邦，全邦 40 万人，本地人约占八成；东端以东外海的瓦希拉群岛是海军基地，不算在这串珍珠里。\n岛上是白沙海滩、珊瑚礁和伊武兰人的传统村落，海岛度假和潜水是主要产业，马拉坎珊瑚礁保护区护着大片完好的珊瑚礁。伊米穆高速从基鲁迈岛的迈萨里区出发，经约 101 公里长、世界最长的哈努西鲁河口跨海大桥登上主岛；基鲁迈群岛高速跨海连起基鲁迈、蒂卢迈和奥罗武三岛，最长的一座是约 43 公里的卡朗加特大桥。马拉坎岛、皮卢岛和皮卢尼岛不通公路，群岛也不修铁路，各岛之间主要靠渡轮。\n岛民之间有个说法：每座岛是一颗珍珠，串起它们的线是渡轮，所以渡轮停航的日子被叫作「断线天」，那天大家都留在自己岛上过节。"
      en: "The Kirumai Islands lie off the south-western end of the main island: Kirumai, Tilumai, Orovu, Malakan, Pilu and Piluni, six islands of about 55,000 km² in all; in Ivuran they are \"Kirumaivaru\", and the name means \"a string of pearls\". The six run south from the tip of the main island and then curve round to the east in an arc, separated from the main island by about 140 km of sea; the largest, Kirumai Island, covers about 20,400 km² and the smallest, Piluni, less than 3,000 km², and all of them are low and gentle, the highest ground being hills of about 500 m on Kirumai Island. Lying close to the equator, the islands get 2,400 to 2,700 mm of rain a year, with rain in every month. The six are joined as the Commonwealth of Kirumai, home to 400,000 people, about eight in ten of them locals; the Vahira Islands, far out to sea east of the chain's eastern end, are a naval base and are not counted among the pearls.\nThe islands are a place of white beaches, coral reefs and traditional Ivuran villages, island holidays and diving are the main industries, and the Malakan Coral Reef Reserve protects a large expanse of intact reef. The Imimu Expressway starts in Maisari District on Kirumai Island and reaches the main island over the Hanusiru Mouth Bridge, about 101 km long and the longest bridge in the world; the Kirumai Islands Expressway crosses the sea to link Kirumai, Tilumai and Orovu, its longest crossing the Karanga Sea Bridge of about 43 km. Malakan, Pilu and Piluni have no road links, there are no railways in the islands, and travel between them is mostly by ferry.\nIslanders say each island is a pearl and the ferries are the string, so a day the ferries stop is a \"broken-string day\", and everyone stays home on their own island and makes a holiday of it."
  - id: nat_4z65yt
    subtype: archipelago
