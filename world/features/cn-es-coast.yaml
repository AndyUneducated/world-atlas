    notes:
      zh: "主岛南岸的岬角，伸出约 13 公里，伊武兰语意为「太阳之岬」。岬角朝向东南，是看日出的名胜，岬顶有灯塔和观日台，每逢新年，许多人在黎明前登上岬顶等候第一缕阳光。新年黎明，观日台上的人们会把一朵鸡蛋花抛向大海，相传花朵漂得越远，新的一年越顺遂；灯塔守护人说，那天早上海面上全是白花。"
      en: "A headland on the south coast of the main island, reaching about 13 km out to sea; in Ivuran the name means 'cape of the sun'. It faces south-east and is a famous place to watch the sunrise, with a lighthouse and a viewing terrace on top, and at the new year many people climb it before dawn to wait for the first light. At dawn on New Year's Day the crowd on the viewing platform throws frangipani flowers into the sea, the farther the flower drifts the better the year, and the lighthouse keeper says the water is white with blossoms that morning."
  - id: nat_xw81nd
    subtype: cape
    status: generated
    detect: { kind: cape, at_km: [276.2, 189.2] }
    names: { zh: 赫瓦鲁岬, en: Cape Hevaru, art-x-ivuran: Hevaruruvai }
    notes:
      zh: "瓦利凯市以东的岬角，伸出约 13 公里，伊武兰语意为「风之岬」。岬角迎着季风，常年风大浪急，岬上建有风力发电场，岬角两侧的海湾是冲浪的好去处。冲浪者和风电场的工程师常在岬下的小咖啡馆碰面，一个盼浪，一个盼风，两拨人最常聊的话题都是明天的天气预报。"
      en: "A headland east of Vallikkai City, reaching about 13 km out to sea; in Ivuran the name means 'cape of the wind'. It stands full in the monsoon, windy and rough all year, with a wind farm on top, and the bays on either side are good for surfing. Surfers and wind-farm engineers meet in the little café under the cape, one lot hoping for waves and the other for wind, and both talk mostly about tomorrow's forecast."
  - id: nat_jdczs5
    subtype: cape
    status: generated
    detect: { kind: cape, at_km: [415.2, 220.8] }
    names: { zh: 蒂克瓦岬, en: Cape Tikeva, art-x-ivuran: Tikevaruvai }
    notes:
      zh: "基拉努市东南的岬角，伸出约 12 公里，伊武兰语意为「星」。岬上的灯塔夜里一闪一闪，从海上看去像一颗星，岬角由此得名；岬下的海水清澈，是基拉努人浮潜的地方。基拉努的情侣喜欢在岬顶等灯塔亮起，灯光第一次扫过海面时许愿，本地人笑称这是全城唯一一颗「准时出现的星」。"
      en: "A headland south-east of Kilanu City, reaching about 12 km out to sea; in Ivuran the name means 'star', after its lighthouse, which twinkles like a star seen from the sea at night. The water below it is clear, and Kilanu's people come here to snorkel. Kilanu couples like to wait on the headland for the lighthouse to come on and make a wish as the first beam sweeps the sea; locals joke it is the only star in town that always turns up on time."
