      zh: "洛米兰市马纳卢区外的海湾，面积约 230 平方公里，伊武兰语意为「河口之湾」，洛米西鲁河在湾的西侧入海。湾岸是红树林和椰林，海滩上有海龟产卵地，产卵季节海滩在夜间封闭。产卵季的夜里，志愿者打着红光手电在海滩上巡逻，护送刚孵出的小海龟爬向大海，村里的孩子们以能当一晚「海龟护卫」为荣。"
      en: "The bay off Manalu District of Lomiran City, about 230 km²; in Ivuran the name means 'bay of the river mouth', and the Lomisiru River enters its western side. Mangroves and coconut groves line it, and turtles nest on its beaches, which close at night in the nesting season. On nesting-season nights volunteers patrol the beach with red-light torches, escorting newly hatched turtles to the sea, and the village children count a night as a \"turtle guard\" a great honour."
  - id: nat_9fy0x5
