    notes:
      zh: "基拉努东南的岬角，伸出约 12 公里，伊武兰语意为「星」。岬上的灯塔夜里一闪一闪，从海上看去像一颗星，岬角由此得名；岬下的海水清澈，是基拉努人浮潜的地方。基拉努的情侣喜欢在岬顶等灯塔亮起，灯光第一次扫过海面时许愿，本地人笑称这是全城唯一一颗「准时出现的星」。"
      en: "A headland south-east of Kilanu, reaching about 12 km out to sea; in Ivuran the name means 'star', after its lighthouse, which twinkles like a star seen from the sea at night. The water below it is clear, and Kilanu's people come here to snorkel. Kilanu couples like to wait on the headland for the lighthouse to come on and make a wish as the first beam sweeps the sea; locals joke it is the only star in town that always turns up on time."
