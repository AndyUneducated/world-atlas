      en: A headland on the south coast of the main island, reaching about 13 km out to sea; in Ivuran the name means 'cape of the sun'. It faces south-east and is a famous place to watch the sunrise, with a lighthouse and a viewing terrace on top, and at the new year many people climb it before dawn to wait for the first light.
