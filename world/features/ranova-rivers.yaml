features:
  - id: nat_pveqx6
    subtype: river
    status: generated
    names: {zh: 安博河, en: Ambo River, art-x-ranova: Ony Ambo}
    notes:
      zh: "安博河是安博哈拉基督教联邦的母亲河，全长 673.9 公里，流域面积约 9.9 万平方公里。河流发源于首都附近的安德里纳高原，向西北流经菲安特拉的梯田，在瓦凡博注入西北湾。上游流过红土丘陵和高原草地，中游河谷开阔，两岸梯田层层叠叠；河谷是联邦的粮仓，出产的稻米养活了高原上的大部分人口。河口的滩涂上栖息着成群的白鹭，渔民划着独木舟在其间撒网。\n河口的瓦凡博是联邦唯一的深水港和工业城市，炼油厂、造船厂和纺织厂沿河口排开，联邦海军的西北舰队也驻扎在这里。瓦塔铁路从瓦凡博出发，经首都安博哈拉通往东海岸的塔马塔，把河口的港口和高原连在一起。联合共和国时期修建的水坝和灌溉渠至今仍在使用，虽然年久失修，每到旱季，下游的农民仍要靠这些水渠引水插秧。\n菲安特拉的稻作研究所在河谷里培育耐旱的稻种，附近的路德派神学院则培养着高原各地的牧师。沿河的村庄每逢收获后的星期日，都会在河边的草地上举行感恩礼拜和家宴，孩子们在浅滩里摸鱼。雨季时河水暴涨成赭红色，老人们说，那是高原的红土顺着安博河去看海了。"
      en: "The Ambo River is the mother river of the Christian Federation of Ambohara, 673.9 km long with a drainage basin of about 99,000 km². It rises on the Andrina Highlands near the capital and flows north-west past the terraces of Fiantra to the north-western bay at Vavambo. Its upper reaches cross red-earth hills and highland grassland; along its middle course the valley widens, its banks stepped with terrace upon terrace. The valley is the federation's granary, and its rice feeds most of the people of the highlands. Flocks of egrets live on the mudflats at the river mouth, where fishermen paddle dugout canoes among them casting their nets.\nVavambo at the river mouth is the federation's only deep-water harbour and its industrial city, with an oil refinery, shipyard and textile mill lined along the estuary, and the federal navy's North-West Fleet is based there. The Vavambo–Tamata Railway sets out from Vavambo and runs through the capital, Ambohara, to Tamata on the east coast, linking the port at the river mouth with the highlands. The dams and irrigation canals built under the United Republic are still in use; though long neglected, they are still what the farmers downstream rely on every dry season to bring water to plant their rice.\nThe rice research institute at Fiantra breeds drought-resistant varieties in the valley, while the Lutheran seminary nearby trains pastors for the whole of the highlands. On the Sunday after the harvest the riverside villages hold thanksgiving services and family feasts on the meadows by the water, while children grope for fish in the shallows. In the rainy season the river swells to an ochre red, and the old people say that the red earth of the highlands is going down the Ambo to see the sea."
  - id: nat_wby64d
    subtype: river
    status: generated
    names: {zh: 马纳纳河, en: Manana River, art-x-kasiri: Mto Manana}
    notes:
      zh: "马纳纳河是萨希利亚伊斯兰共和国境内的河流，全长 894.8 公里，流域面积约 37.6 万平方公里。河流发源于安德里纳高原西坡，向西穿过干燥的稀树草原和丘陵，在首都萨希勒附近入海。中游河谷里散布着放牧瘤牛的村庄和丁香、腰果园，旱季河水变浅，牧人赶着牛群到河边饮水；雨季时河面宽阔，浑浊的河水把泥沙一直带进海里。\n河口一带是红树林和稻田，渔民在红树林的水道里捕蟹，晒盐的盐田沿海岸排开。萨希勒是全岛最古老的贸易港，沿岸的清真寺和古老的商栈见证了卡西里人的航海贸易：很久以前，卡西里商人驾着单桅帆船沿河而上收购货物，再从河口出海，往来于各岛之间，伊斯兰教、卡西里语和以商会为中心的城市传统也随之传播开来。萨希勒大清真寺和老城集市至今仍是河口最热闹的地方。\n如今河上仍能看到运货的单桅帆船，只是船上多装了柴油机，船工们依旧在船头漆上一双眼睛，说这样船才认得回家的路。河口的渔民有一句老话：「马纳纳河从高原带来泥，大海给我们带来鱼。」斋月的夜晚，萨希勒海滨的长桌宴会一直持续到黎明，人们吃着河口捕来的螃蟹和用丁香煮的米饭。"
      en: "The Manana River is the river of the Islamic Republic of Sahiliya, 894.8 km long with a drainage basin of about 376,000 km². It rises on the western slopes of the Andrina Highlands and flows west through dry savanna and hills to the sea near the capital, Sahil. Villages that graze zebu and groves of cloves and cashews are scattered along its middle valley; in the dry season the river runs shallow and herders drive their cattle down to drink, while in the rains it spreads wide and its muddy water carries silt far out to sea.\nMangroves and paddies line its mouth, fishermen catch crabs in the mangrove channels, and salt pans stretch along the coast. Sahil is the oldest trading port on the island, and the mosques and old trading houses along the river bear witness to the seafaring trade of the Kasiri: long ago Kasiri merchants sailed their single-masted dhows upriver to buy goods and then out from the mouth to trade among the islands, and Islam, the Kasiri language and a civic tradition centred on the merchant guilds spread with them. The Great Mosque of Sahil and the Old Town Souk are still the busiest places at the river mouth.\nCargo dhows can still be seen on the river, though most now carry a diesel engine, and the boatmen still paint a pair of eyes on the bow, saying that this way the boat knows the road home. The fishermen at the mouth have an old saying: \"The Manana brings us mud from the highlands, and the sea brings us fish.\" On Ramadan nights the long-table feasts on the Sahil seafront go on until dawn, with crab from the river mouth and rice cooked with cloves."
  - id: nat_qn0gnd
    subtype: lake
    status: generated
    names: {zh: 安德拉诺拉瓦湖, en: Lake Andranolava, art-x-ranova: Farihin'Andranolava}
    notes:
      zh: "安德拉诺拉瓦湖是大天使军团国北部内陆的一条狭长湖泊，湖面约 45.5 平方公里，在安德拉诺拉瓦城东南，顺着低丘之间的谷地伸展，城名「长水」即由此而来。湖的四周是雨林覆盖的低山丘陵，其间点缀着白色的石灰岩山丘；安德拉诺拉瓦城靠近大衡王朝和转轮无边法王国的边界，城北设有检查站，城外还有军团的野战训练场。\n湖岸是全国最大的稻作区，湖水经堤坝和水渠灌溉两岸的水田，稻米由合作社统一收购，再经安德拉诺拉瓦合作社市场分配。堤坝和水渠的维修多半靠荣誉劳动与公共工程部调配的无偿劳动，每个成年人每年都要来湖边出工，人权组织把这种制度列为强迫劳动。阵亡军团员的家属优先分得湖边最好的水田，这项特权被军团宣传为「殉道者的恩典」，没有烈士的家庭只能耕种离水较远的田地。\n湖上有小渔船捕捞罗非鱼和小虾，傍晚时渔民在岸边晾网，孩子们在浅水里摸螺。每年殉道者纪念日，城里的人在湖上放下纸灯，灯上写着阵亡者的名字和他们的「亡名」，成百上千盏灯顺着狭长的湖面漂向远处。也有人悄悄在纸灯上写下死于劳役和拘押的亲人，这在军团国是不被允许的。"
      en: "Lake Andranolava is a long, narrow lake in the northern interior of the Legionary State of the Archangel, about 45.5 km² in area, south-east of the town of Andranolava and stretching along a valley between low hills; the town's name, \"long water\", comes from it. Around the lake rise low hills under rainforest, dotted with white limestone knolls; the town of Andranolava lies near the borders of the Great Heng Dynasty and the Kingdom of the Boundless Dharma Wheel, with a checkpoint at its north gate and a Legion field training area outside the town.\nIts shores are the country's largest rice-growing area, watered from the lake through dikes and channels; the rice is bought up by the cooperatives and distributed through the Andranolava Cooperative Market. The dikes and channels are kept up mostly by the unpaid labour allotted by the Ministry of Honour Labour and Public Works, every adult coming to work by the lake each year, and human rights groups list the system as forced labour. The families of fallen legionaries get first pick of the best paddies by the lake, a privilege the Legion promotes as \"the grace of the martyrs\", while families without a martyr can farm only fields farther from the water.\nSmall boats fish the lake for tilapia and shrimp, fishermen hang their nets to dry on the shore in the evening, and children grope for snails in the shallows. Each Martyrs' Day the townspeople set paper lanterns on the water, written with the names of the fallen and their \"death names\", and hundreds upon hundreds of lights drift away down the long, narrow lake. Some people quietly write on their lanterns the names of relatives who died in labour service or detention, which is not permitted in the Legionary State."
  - id: nat_mm8423
    subtype: river
    status: generated
    names: {zh: 衡河, en: Heng River}
    notes:
      zh: "衡河是大衡王朝的母亲河，全长 550 公里，流域面积约 6.6 万平方公里。河流发源于齐马罗沃边境的丘陵，向西流过王朝全境，冲积出岛上最大的水田平原之一，在都城承天附近注入西海；承天就建在衡河入海口的南岸。上游的衡源是东部边境的府城，附近有铜矿和边军大营；中游的稷丰是全国的粮仓，常平仓和万顷田沿河铺开。\n两岸是连片的水田和堤坝，水渠纵横，村落掩映在竹林和榕树之间。沿河的官道和驿站把都城与东部的州府连在一起，驿马和运粮的漕船昼夜往来；下游河口水面宽阔，承天市舶司管理的商船从这里出海。转轮无边法王国不靠海，红米、茶叶和药材也经大衡王朝顺衡河出海。王朝每年春天在河畔举行亲耕礼，由天子亲手犁下第一道田垄，百官随后依品级各犁数道，礼成之后，各府县才开始春耕。\n衡河平原的农家讲究按时令行事，清明前后修堤，芒种插秧，秋收后在河边晒谷、祭祀河神。夏季的洪水是王朝最担心的灾害，堤坝上每隔一里设一座水志亭，涨水时由河工击鼓报警。学塾的先生常对学生说，读书人要像衡河的水，不急不缓，却终年不息。"
      en: "The Heng River is the mother river of the Great Heng Dynasty, 550 km long with a drainage basin of about 66,000 km². It rises in the hills on the Tsimarovo border and flows west across the whole country, laying down one of the largest paddy plains on the island, before entering the western sea near the capital, Chengtian, which is built on the south bank of the river mouth. On its upper reaches Hengyuan is the prefectural town of the eastern frontier, with a copper mine and a frontier army camp nearby; on its middle reaches Jifeng is the nation's granary, its ever-normal granary and broad paddies spread along the river.\nPaddy fields and dikes line both banks, criss-crossed by canals, and villages lie half hidden among bamboo groves and banyans. The post road and relay stations along the river link the capital with the prefectures of the east, and post horses and grain barges come and go day and night; at the broad river mouth downstream, merchant ships under the Chengtian Maritime Trade Office put out to sea. The landlocked Kingdom of the Boundless Dharma Wheel also sends its red rice, tea and medicinal herbs down the Heng through the Great Heng Dynasty to the sea. Each spring the dynasty holds the ploughing rite on the riverbank, where the Son of Heaven cuts the first furrow with his own hands and the officials follow with a few furrows each in order of rank; only when the rite is complete do the prefectures and counties begin their spring ploughing.\nFarming families on the Heng plain keep strictly to the seasons, mending the dikes around Qingming, transplanting rice at Grain in Ear, and after the autumn harvest drying grain by the river and making offerings to the river god. Summer floods are the disaster the dynasty fears most; a water-gauge pavilion stands on the dikes every li, and when the river rises the river workers beat drums to raise the alarm. Village schoolmasters like to tell their pupils that a scholar should be like the Heng's water, never hurried and never slack, but flowing all year round."
  - id: nat_51fkqp
    subtype: river
    status: generated
    names: {zh: 伊拉希河, en: Ilahy River, art-x-ranova: Ony Ilahy}
    notes:
      zh: "伊拉希河是齐马罗沃民族社会主义帝国的主要河流，全长 709.1 公里，流域面积约 15.9 万平方公里。河流发源于伊瓦卡山，向东穿过首都齐马罗沃所在的盆地，经福罗纳沿伊拉希河谷东下，在伊拉希港注入东海。上游是干燥的高原和稀树草原，河水在旱季变得细弱，雨季则裹着红土奔流；下游河谷开阔，河口一带是全国唯一的出海口。\n河上的水坝和灌溉工程是齐马罗沃政权引以为傲的「民族工程」，修建时动用了大量强迫劳动，劳工多是被剥夺公民等级的居民和战俘。灌溉渠把河水引到沿河的国营农场和「定居者村」，宣传画上常常画着金色的稻浪和水坝前挥手的青年团员，却从不提及修坝时死去的劳工。国际调查机构的报告里，记录了工地上的拘押营和集体惩罚。\n伊拉希河谷也是帝国的交通命脉：齐伊铁路自首都经福罗纳沿河谷东下到伊拉希港，福伊重载铁路在它旁边另有一条线，把福罗纳的铁矿石运往港口；伊拉希港的造船厂、海军基地和军用卡车厂都靠河口而建。沿河的渔民在浅滩上撒网，旱季的傍晚，孩子们在退水后的沙洲上踢球，河岸的高音喇叭里一遍遍播放着领袖的讲话。"
      en: "The Ilahy River is the main river of the National Socialist Empire of Tsimarovo, 709.1 km long with a drainage basin of about 159,000 km². It rises in the Ivaka Mountains and flows east through the basin of the capital, Tsimarovo, then past Forona down the Ilahy valley to the eastern sea at the port of Ilahy. Its upper reaches cross dry highland and savanna, where the river thins in the dry season and runs thick with red earth in the rains; the lower valley is broad, and its mouth is the country's only outlet to the sea.\nThe dams and irrigation works on the river are the regime's proud \"national works\", built with a great deal of forced labour, most of it by residents stripped of their citizen rank and by prisoners of war. Canals carry the water to the state farms and \"settler villages\" along the river, and propaganda posters show golden waves of rice and youth league members waving in front of the dams, but never mention the labourers who died building them. Reports by international investigators record the detention camps and collective punishments on the construction sites.\nThe Ilahy valley is also the empire's transport lifeline: the Tsimarovo–Ilahy railway runs from the capital past Forona down the valley to the port of Ilahy, and the Forona–Ilahy heavy-haul railway runs on a separate line beside it, carrying Forona's iron ore to the port; the shipyards, naval base and military lorry works of Ilahy all stand by the river mouth. Fishermen cast their nets in the shallows along the river, and on dry-season evenings children play football on the sandbanks left by the falling water while loudspeakers on the bank play the leader's speeches over and over."
