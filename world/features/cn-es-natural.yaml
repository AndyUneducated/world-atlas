# Named natural features of the Everlong Summer Islands Territory.
# subtype follows OSM natural=* values. Geometry is produced by the generator
# (see world/generator/cn-es.yaml); this file only holds identity and semantics.
# Names are Chinese, English and Ivuran (art-x-ivuran).
features:
  - id: nat_2ens6y
    subtype: mountain_range
    status: generated
    names:
      zh: 蒂拉凯苏山脉
      en: Tirakesu Mountains
      art-x-ivuran: Tirakesu
    notes:
      zh: "蒂拉凯苏山脉是主岛西南半部的中脊，伊武兰语叫「Tirakesu」，意为「古老的山」，是一条古老的褶皱山脉。山脉从萨伦纳姆背后向东北延伸到哈努帕拉高原，把西北海岸的雨林和香料园与东南的哈努西鲁河谷分开；世界最长的河流哈努西鲁河就沿着山脉东南侧的长谷流向西南。最高峰乌拉韦劳峰海拔 3179 米，是领地最高峰，东北的蒂拉图马峰海拔 3071 米，两峰之间的乌拉瓦苏山口是领地最高的山口；山脉与高原相接处耸立着洛米图马峰。乌拉韦劳峰一带划为乌拉韦劳自然保护区，山腰以上是挂满苔藓和兰花的云雾林，林线以上是高山草甸，云中的翁贝尔韦劳湖也在保护区里。中段温达坎市的山坡上是层层叠叠的水稻梯田，佩伦达梯田是世界最大的水稻梯田；北坡流下凯纳西鲁河，坡上是彭纳拉姆的胡椒园和咖啡园。伊米穆高速以约 34 公里长的蒂拉凯苏山脉隧道穿过中脊，这是世界最长的公路山岭隧道。\n乌拉瓦苏山口只有徒步小道，常年云雾缭绕，登乌拉韦劳峰的人路过山口，都会在一块长满苔藓的大石头上放一粒小石子；山脚的村子相信峰顶的云是祖先在看护梯田。\n山脉两侧的天气常常截然不同，西北坡在下雨，东南谷里却晴着，农民们说「山把雨留给了雨林，把太阳留给了稻田」。"
      en: "The Tirakesu Mountains are the spine of the south-western half of the main island; in Ivuran the name means \"the old mountains\", and they are an ancient fold range. They run north-east from behind Sarunnam to the Hanupala Plateau, dividing the rainforests and spice gardens of the north-west coast from the Hanusiru valley to the south-east; the Hanusiru, the longest river in the world, flows south-west down the long valley on the range's south-eastern side. The highest summit, Mount Uravelau, at 3,179 m, is the highest point in the territory, and Mount Tiratuma to its north-east reaches 3,071 m, with the Uravasu Pass between them the highest pass in the territory; where the range meets the plateau rises Mount Lomituma. The country around Mount Uravelau is the Uravelau Nature Reserve, with cloud forest hung with mosses and orchids above mid-slope and alpine meadows above the tree line, and Lake Ombelvelau, the lake in the clouds, lies within it. The slopes of Undakan City in the middle of the range are stepped with rice terraces, and the Perunda Rice Terraces are the largest in the world; the Kainasiru runs down the northern slopes, past the pepper and coffee gardens of Pennaram. The Imimu Expressway passes beneath the range through the Tirakesu Mountains Tunnel, about 34 km long and the longest mountain road tunnel in the world.\nOnly footpaths cross the Uravasu Pass, wrapped in cloud for most of the year, and climbers bound for Mount Uravelau leave a pebble on a big moss-covered boulder as they pass; the villages at the foot of the range believe the clouds on the summit are the ancestors watching over the terraces.\nThe weather on either side of the range is often quite different, rain on the north-west slopes while the south-east valley lies in sunshine, and farmers say \"the mountains keep the rain for the forest and the sun for the rice\"."
  - id: nat_hnhpgn
    subtype: plateau
    status: generated
    names:
      zh: 哈努帕拉高原
      en: Hanupala Plateau
      art-x-ivuran: Hanupala
    notes:
      zh: "哈努帕拉高原在主岛中部，伊武兰语叫「Hanupala」，意为「大高原」，高原面海拔一千多米到一千六百米，气候凉爽。高原的大部分属米雷兰市的哈努帕拉区，面积约 6.7 万平方公里，只住着 5 万人，多是讲伊武兰语的本地人，村庄沿湖和河谷分布。高原上的翁贝尔哈努湖约 1590 平方公里，是领地最大的湖泊，首府米雷兰就在湖的东南岸；高原上有牧场、咖啡园和稻田，东部的帕拉图马峰海拔 2036 米，是米雷兰市的最高点，峰顶有一座气象站。高原西端与蒂拉凯苏山脉相接，耸立着洛米图马峰。高原边缘是陡峭的断崖，世界最长的河流哈努西鲁河发源于高原，从东南缘跌落成瀑布流向东南的低地，洛米西鲁河从西北缘跌落，流向洛米兰的雨林，基拉西鲁河也从高原东南缘落下。\n首府米雷兰年平均气温不到 18 度，白天二十四五度，夜里常降到十度上下，一年降水两千六百多毫米，下午常有一场阵雨；沿海的人来高原开会，行李箱里总要塞一件毛衣。\n高原的咖啡是首府的骄傲，政务院的会议室里只供应本地豆。气象站的观测员每天清晨骑车上山读数，牧民们习惯先问观测员今天下不下雨，再决定把牛赶到哪片草场去。"
      en: "The Hanupala Plateau lies in the middle of the main island; in Ivuran the name means \"great plateau\". Its surface stands between a thousand and 1,600 m up and is cool all year. Most of the plateau belongs to Hanupala District of Mirelan City, about 67,000 km² with only 50,000 people, mostly Ivuran-speaking locals living in villages along the lake and the river valleys. Lake Ombelhanu, about 1,590 km² and the largest lake in the territory, lies on the plateau, with the capital, Mirelan, on its south-eastern shore; there are pastures, coffee gardens and rice fields, and Mount Palatuma in the east, at 2,036 m, is the highest point in Mirelan City, with a weather station on its summit. At its western end, where it meets the Tirakesu Mountains, rises Mount Lomituma. The plateau's edges are steep escarpments: the Hanusiru, the longest river in the world, rises on the plateau and falls from its south-eastern edge in waterfalls towards the lowlands to the south-east, the Lomisiru drops from the north-western edge towards the rainforest of Lomiran, and the Kilasiru too falls from the south-eastern rim.\nMirelan averages less than 18 °C over the year, 24 or 25 °C by day and often down to around 10 °C at night, with more than 2,600 mm of rain and a shower most afternoons; people from the coast coming up to the plateau for meetings always squeeze a jumper into their suitcases.\nThe plateau's coffee is the capital's pride, and the meeting rooms of the Executive Council serve nothing but local beans. The weather observers ride up the mountain every morning to take the readings, and the herders have got into the habit of asking them whether it will rain before deciding which pasture to drive the cattle to."
  - id: nat_yrg1cq
    subtype: mountain_range
    status: generated
    names:
      zh: 乌诺凯苏山脉
      en: Unokesu Mountains
      art-x-ivuran: Unokesu
    notes:
      zh: "乌诺凯苏山脉是主岛东北半部的山脉，伊武兰语叫「Unokesu」，意为「矿石之山」。山中的红土镍矿是领地最大的矿产，乌诺卡里市的矿区、冶炼厂和水电站都在山间：乌诺维拉矿区管理区在山坡上露天开采镍和钴，佩鲁诺冶炼厂用山区水电站的电力把矿石炼成电池级的镍盐，乌诺维拉真空磁悬浮重载铁路再把产品运往塔卢马兰的电池厂。领地要求边采边复绿，采过的山坡随即回填、覆土，种上原生树种。最高峰乌诺图马峰海拔近 2500 米，山顶一带的原始山地雨林划为禁采区；塔卢马兰背后的库瓦拉峰海拔 2448 米，老林里常能看到成对的犀鸟。霍拉瓦苏山口是乌诺卡里盆地通往西北海岸的通道，常年起雾；奥卢西鲁河发源于山中，塞洛高速以约 37 公里长的乌诺凯苏山脉隧道穿过山地。山脉北坡是纳卢迈的橡胶园和次生林。\n山谷里比海边凉快，傍晚雾气从山脊上漫下来；禁采线上每隔一段立着一根红白相间的界桩，矿工们管这条线叫「山的腰带」。\n矿区的复绿队每种下一棵树，就在树旁插一块写着种树人名字的小木牌，老矿工带孙辈进山，最爱指着一片已经成林的山坡说「那是爷爷种的」。"
      en: "The Unokesu Mountains are the mountains of the north-eastern half of the main island; in Ivuran the name means \"mountains of ore\". Their laterite nickel is the territory's greatest mineral wealth, and the mines, smelters and hydro stations of Unokari City lie among them: in the Unovila Mining Administration Zone nickel and cobalt are dug from open pits on the slopes, the Peruno Smelter refines the ore into battery-grade nickel salts with power from the mountain hydro stations, and the Unovila Vacuum Maglev Heavy-Haul Railway carries the product to the battery plants of Talumaran. The territory requires mined slopes to be restored as mining goes on, backfilled, covered with soil and replanted with native trees. The highest summit, Mount Unotuma, stands nearly 2,500 m high, and the primeval montane rainforest around its top is closed to mining; Mount Kuvala behind Talumaran reaches 2,448 m, and pairs of hornbills are often seen in its old forest. The Horavasu Pass, foggy all year, leads from the Unokari basin to the north-west coast; the Olusiru rises in these mountains, and the Selo Expressway passes beneath them through the Unokesu Mountains Tunnel, about 37 km long. On the northern slopes are the rubber gardens and regrown forest of Nalumai.\nThe valleys are cooler than the coast, and at dusk mist pours down off the ridges; red-and-white marker posts stand at intervals along the no-mining line, which the miners call \"the mountain's belt\".\nThe mine's replanting crews put a small wooden tag with the planter's name beside every tree, and old miners love to take their grandchildren into the hills, point to a slope now grown into woodland and say \"Grandpa planted that\"."
  - id: nat_ypq4a1
    subtype: ridge
    status: generated
    names:
      zh: 佩萨维丘陵
      en: Pesavi Hills
      art-x-ivuran: Pesavi
    notes:
      zh: "哈努帕拉高原东南缘的丘陵，在基拉努背后，伊武兰语意为「高地」，最高处海拔一千一百多米。丘陵的山坡上种着可可和热带水果，山脚下是基拉努的半导体产业园，从高原流下的溪水是产业园的水源之一。丘陵上的可可农和山下产业园的工程师常是一家人，周末一起采可可，本地人说基拉努的人「白天做芯片，周末做巧克力」。"
      en: "The hills on the south-eastern edge of the Hanupala Plateau, behind Kilanu, rising to a little over 1,100 m; their Ivuran name means 'the uplands'. Cocoa and tropical fruit grow on their slopes, the semiconductor park of Kilanu lies at their foot, and the streams that come down from the plateau are among its sources of water. The cocoa farmers on the hills and the engineers at the industrial park below are often from the same families and pick cocoa together at weekends, so Kilanu people are said to \"make chips by day and chocolate at weekends\"."
  - id: nat_11kf5w
    subtype: ridge
    status: generated
    names:
      zh: 瓦利凯苏丘陵
      en: Vallikesu Hills
      art-x-ivuran: Vallikesu
    notes:
      zh: "沿主岛东南海岸西段延伸的丘陵和低山，最高处海拔一千二百多米，伊武兰语意为「长岸之山」，把哈努西鲁河谷与瓦利凯一带的海岸平原隔开。丘陵上是橡胶园、椰林和次生林，山脚的村庄种稻和养鱼；从河谷通往瓦利凯港的公路和铁路都要翻过或穿过这道丘陵。翻越丘陵的公路上有一处急弯叫「回头湾」，从这里能同时望见河谷的稻田和远处的海，长途司机都习惯在这里停车喝一杯路边的椰子咖啡。"
      en: "The hills and low mountains that run along the western part of the main island's south-east coast, rising to a little over 1,200 m; in Ivuran the name means 'hills of the long shore'. They separate the Hanusiru valley from the coastal plain around Vallikkai, carry rubber gardens, coconut groves and regrown forest, and the villages at their foot grow rice and raise fish; the roads and railways from the valley to the Port of Vallikkai have to cross or tunnel through them. The road over the hills has a hairpin called the Look-Back Bend, where you can see both the rice of the valley and the sea beyond, and long-distance drivers always stop there for a cup of coconut coffee from the roadside stall."
