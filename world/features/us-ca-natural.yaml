# Named natural features of the California Autonomous State.
# subtype follows OSM natural=* values. Geometry is produced by the generator
# (see world/generator/us-ca.yaml); this file only holds identity and semantics.
# Names are Chinese, English and Spanish (es).
features:
  - id: nat_atgnnd
    subtype: mountain_range
    status: generated
    names:
      zh: 估值山脉
      en: Sierra Valuation
      es: Sierra Valoración
    notes:
      zh: "估值山脉是纵贯自治州东部的大山脉，是一块向西缓缓倾斜、向东陡然断落的巨大断块，西坡是巨杉林和深切的峡谷，东坡是陡崖和荒漠。主峰独角兽峰海拔 3516 米，是全州最高峰，十角兽峰 3325 米、降价轮峰 3275 米次之；独角兽峰和十角兽峰之间是海拔 2891 米的融资轮山口，北段的堵车山口海拔 1510 米，是首府通往塔克斯霍湖的必经之路。北段的高山深湖塔克斯霍湖和东麓的咸水湖垄断湖，都在它的怀抱里。\n山脉得名于它的「估值」：每座山峰都被一家公司按市值挂牌，峰越高估值越高，最高的独角兽峰因此得名；峰顶的估值牌每季度更新一次，只升不降，估值降了的山要改名，降价轮峰就是这样来的。山脉挡住了从海上来的冬季风暴，西坡积雪很深，春天融雪流进中央渴谷，圣囤积河沿途汇入一条条从西坡下来的雪水河，这道山因此是全州的水塔；东坡背风，荒漠一直延伸到海边。\n翻山的路不多。融资窗口领道穿过巨杉区的巨杉林，再穿过约 21.8 公里的估值山脉隧道到雪道区，那是全州最长的公路隧道，车流几乎全在夏天；堵车领道冬天的周末在堵车山口排出几十公里。西坡的巨杉旁边立着捐款富豪的名牌，护林员在名牌背面偷偷写上了树原来的名字。登山的人在独角兽峰的估值牌前排队拍照，没人看测量标上的真实海拔。"
      en: "The Sierra Valuation runs the length of the east of the state, one enormous fault block tilting gently to the west and breaking off steeply to the east, with giant sequoia groves and deep canyons on its western slope and cliffs and desert on the east. Its highest summit, Mount Unicorn, at 3,516 metres, is the highest point in the state, followed by Mount Decacorn at 3,325 metres and Mount Down Round at 3,275 metres; between Unicorn and Decacorn lies Funding Round Pass at 2,891 metres, and in the north Gridlock Pass, at 1,510 metres, is the only way from the capital to Lake Taxhoe. Lake Taxhoe, the deep mountain lake of the northern Sierra, and Monopoly Lake, the salt lake at its eastern foot, both lie in its embrace.\nThe range takes its name from its \"valuations\": every summit has been listed by a company at a market value, the higher the peak the higher the valuation, which is how Mount Unicorn, the highest, got its name; the valuation board on each summit is updated every quarter and only ever goes up, and a mountain whose valuation falls must change its name, which is how Mount Down Round came to be. The range blocks the winter storms coming in from the sea, so snow lies deep on its western slope, and in spring the meltwater pours into the Central Thirsty Valley, where the San Hoarding River gathers one snow-fed stream after another off the western slopes, making the range the state's water tower; the eastern side lies in the lee, and desert runs from there all the way to the sea.\nFew roads cross it. The Funding Window Road passes through the sequoias of Giant Grove District and then the Sierra Valuation Tunnel, about 21.8 km long and the longest road tunnel in the state, to Ski District, carrying almost all its traffic in summer; the Gridlock Road queues for dozens of kilometres at Gridlock Pass on winter weekends. Beside the giant sequoias on the western slope stand nameplates for the rich donors, and the rangers have secretly written each tree's original name on the back. Climbers queue to be photographed in front of the valuation board on Mount Unicorn, and nobody looks at the true height on the survey marker."
  - id: nat_sdw6qb
    subtype: mountain_range
    status: generated
    names:
      zh: 级联故障山脉
      en: Cascading Failure Range
      es: Cordillera de la Falla en Cascada
    notes:
      zh: "级联故障山脉是自治州北部的火山山脉，在雷达克特市境内，两座孤立的火山锥高高耸立在森林和熔岩高原之上：北边的宕机峰海拔 2370 米，在待建州区，山顶终年积雪，晴天时从城里也看得见；南边的重启峰海拔 2343 米，在熔岩高原区的西部，山腰有冒着热气的硫磺泉和泥浆池。山脚下是松林、熔岩流和熔岩洞，萨克拉钱托河和流量河都发源于这里，一条向南流进河谷，一条向北穿过深峡谷流入北海岸。\n山名来自一次全州大停电：宕机峰冒烟触发了电网的自动保护，保护又触发了另一处保护，一路连锁下去，整个自治州停电三天，事后调查报告的标题就是「级联故障」。大停电的第三天，电网工程师在重启峰下的地热电站手动重启了全州电网，那座山因此得名，电站门口挂着一块牌子：「先拔掉，再插上」。\n宕机峰山脚的小镇从此家家备着发电机，纪念品店卖一种印着火山的蜡烛。待建州区的人对那三天另有说法：他们说那是这一带最像「独立」的日子，没有州政府的电，也没有州政府的账单。火山学家每年上山测一次地温，测完总要到地热电站门口的牌子前拍张照，说这是他们见过最诚实的操作手册。"
      en: "The Cascading Failure Range is the volcanic range of the north of the state, in Redacted City, where two isolated volcanic cones stand high above the forests and lava plateaus: in the north, Mount Outage, 2,370 metres high, in Statehood-Pending District, snow-capped all year and visible from the city on clear days; in the south, Mount Reboot, 2,343 metres high, in the west of Lava Plateau District, with steaming sulphur springs and mud pots on its flanks. Around their feet lie pine woods, lava flows and lava caves, and both the Sacramoney River and the Traffic River rise here, one flowing south into the valley and the other north through deep canyons to the north coast.\nThe name comes from a statewide blackout: smoke from Mount Outage tripped the grid's automatic protection, which tripped another protection, and so on down the line until the whole state was without power for three days; the title of the official inquiry report was \"Cascading Failure\". On the third day of the blackout, grid engineers restarted the state's grid by hand at the geothermal power station below Mount Reboot, which is how that mountain got its name, and a sign at the station gate reads \"Unplug it, then plug it back in.\"\nEvery household in the town at the foot of Mount Outage has kept a generator ever since, and the souvenir shop sells candles printed with the volcano. People in Statehood-Pending District see those three days differently: they say it was the closest the area has ever come to \"independence\", with no electricity from the state and no bills from it either. Volcanologists climb the mountains once a year to take ground temperatures, and afterwards always stop to have their photo taken by the sign at the geothermal station gate, which they call the most honest operating manual they have ever seen."
  - id: nat_wj4n7d
    subtype: mountain_range
    status: generated
    names:
      zh: 点击诱饵山脉
      en: Clickbait Mountains
      es: Montañas Ciberanzuelo
    notes:
      zh: "点击诱饵山脉是自治州西北角的崎岖山地，主峰标题党峰海拔 2074 米，在欧福利亚市红木帘区。山体被许多条河流切割得支离破碎，河谷深切，两岸是陡峭的山坡，山上是茂密的原始森林，低处有红杉，高处是冷杉和松树。冬天的雨和雪从海上源源不断地来，山顶要到初夏才化雪；山谷里的溪水冰凉清澈，秋天常有熊下到河边。山里人烟稀少，公路沿着河谷绕来绕去，从一条谷进另一条谷，往往要翻好几道山梁。\n山名来自山里的旅游广告：「你绝对想不到这座山后面有什么」，翻过山去，后面还是山。标题党峰山脚的广告写着「登上这座山，你的人生将彻底改变」，登上去的人说，改变的主要是膝盖。\n区里的旅游广告每年换一批新词，「第七个山谷让所有人都哭了」「本地人不想让你知道的瀑布」，游客照着广告一个山谷一个山谷地找，最后在一家路边咖啡馆里坐下来，发现墙上贴满了往年的广告。咖啡馆老板说，这些广告其实一句也没骗人：山后面确实有东西，只不过还是山；倒是他这家咖啡馆，才是整片山里唯一一个游客真正想不到的地方。咖啡馆的招牌甜点是一块标着「你绝对想不到里面是什么」的派，切开来是苹果馅。"
      en: "The Clickbait Mountains are the rugged uplands of the state's north-western corner, their highest summit Mount Headline at 2,074 metres, in Redwood Curtain District of Euphoria City. The range is cut to pieces by many rivers, with deep valleys between steep slopes, and covered in dense old-growth forest, redwoods lower down and firs and pines higher up. Winter rain and snow roll in from the sea without end, and the summits do not lose their snow until early summer; the streams in the valleys run cold and clear, and in autumn bears often come down to the water. Few people live in the mountains, and the roads wind along the valleys; getting from one valley to the next often means climbing over several ridges.\nThe name comes from the mountains' tourist advertising: \"You won't believe what's behind this mountain.\" Cross it and what is behind it is another mountain. The advert at the foot of Mount Headline reads \"Climb this mountain and your life will change for ever\"; those who have climbed it say the main thing that changed was their knees.\nThe district's tourist adverts get a new batch of slogans every year, \"The seventh valley made everyone cry\", \"The waterfall locals don't want you to know about\", and visitors follow them valley by valley until they finally sit down in a roadside café and find its walls papered with the adverts of years gone by. The café's owner says the adverts never told a single lie: there really is something behind the mountain, it just happens to be more mountain; his café, on the other hand, is the one place in all these hills that visitors genuinely never expected. Its signature dessert is a pie labelled \"You won't believe what's inside\"; cut it open and it is apple."
  - id: nat_j62b8f
    subtype: mountain_range
    status: generated
    names:
      zh: 雾帘山脉
      en: Fogwall Range
      es: Sierra Muro de Niebla
    notes:
      zh: "雾帘山脉是北海岸背后的一连串海岸山岭，最高处海拔约 1822 米，从北海岸一直延伸到海湾北岸。山岭大致与海岸平行，一道接一道排开，靠海的一面陡峭潮湿，长着高大的红杉林，背海的一面较为干燥，山谷里铺满了葡萄园，梅洛特的葡萄酒大多出自这些山谷。山脉东边是清除记录湖，湖边有温泉和老火山。\n夏天海雾每天下午从海上漫过来，被山岭挡住，在山脊上堆成一堵白墙，山名由此而来。雾墙的一边阴凉潮湿，红杉靠雾气里的水分熬过无雨的夏天；另一边阳光灼热，葡萄在晴天里成熟。酿酒师们说，好酒就长在雾墙的边上，雾线往东挪一公里，一个酒庄的价格就要翻一番。广告牌领道沿北海岸穿过索诺莫尔区，开车的人常常前一分钟还在晴天里，后一分钟就一头扎进白茫茫的雾里。\n索诺莫尔区的酒庄把雾墙画进了酒标，有的干脆按雾的厚度给酒分级。一家科技公司曾在山脊上装了一排传感器，想用人工智能预测雾墙的位置，好卖「雾线地块」的期货；模型预测得很准，只是每次都比雾晚到一个下午。山里的老居民不看预测，他们看红杉梢上挂的水珠：水珠一滴下来，雾就要到了。"
      en: "The Fogwall Range is a chain of coastal ridges behind the north coast, rising to about 1,822 metres and running from the north coast all the way to the north shore of the bay. The ridges run roughly parallel to the coast, one behind another, their seaward faces steep and damp and clothed in tall redwood forest, their landward sides drier, with valleys carpeted in vineyards; most of Merlotte's wine comes from these valleys. East of the range lies Clear History Lake, with hot springs and old volcanoes on its shores.\nEvery summer afternoon the sea fog rolls in from the ocean, is stopped by the ridges and piles up along the crest in a white wall, which gives the range its name. One side of the wall is cool and damp, and the redwoods live through the rainless summer on the moisture in the fog; the other side is baking hot, and the grapes ripen in the sun. Winemakers say the best wine grows right at the edge of the fog wall, and that if the fog line moved a kilometre east, a winery's price would double. The Billboard Road runs through Sonomore District along the north coast, and drivers are often in sunshine one minute and plunging into white fog the next.\nThe wineries of Sonomore District draw the fog wall on their labels, and some even grade their wines by the thickness of the fog. A tech company once set up a row of sensors along the crest to predict the fog wall's position with AI, hoping to sell futures in \"fog-line plots\"; the model's predictions were very accurate, except that they always arrived an afternoon after the fog. Old people in the hills ignore the forecasts and watch the drops of water on the tips of the redwoods instead: when a drop falls, the fog is on its way."
  - id: nat_gbs1f4
    subtype: mountain_range
    status: generated
    names:
      zh: 滤镜山脉
      en: Filter Range
      es: Sierra Filtro
    notes:
      zh: "滤镜山脉是中部海岸的海岸山脉，最高处海拔约 1672 米，山体直接插进大海，形成一百多公里长的悬崖海岸。西坡陡峭，被冬天的雨水切出一道道深谷，谷里是红杉和溪流，崖下是海浪和礁石；东坡缓一些，山后是一条长长的谷地，莫内特里市大附加费区的生菜谷就在那里，全州大部分的生菜都出自那里。北段的美颜峰海拔 1645 米，西坡直落大海，常年被海雾拦腰截断。\n海景付费公路挂在悬崖上，从圣塞雷娜的露西芯城区沿海岸北上，经大附加费区和冲浪棚区去湾区，每座桥、每个弯道观景台都要单独付费；广告牌领道则走山脉背后的谷地。这是网红们最爱的地方，山名来自他们发出的照片：每一张都加了滤镜，山的真实颜色已经没有人记得。网红们在悬崖边排队，为了一张照片可以等两个小时，领道局索性在最热门的弯道旁修了一座按层收费的「自拍停车楼」。\n美颜峰上拍的照片都加了美颜，山在照片里比实际高了一倍，一家旅行社按照片里的高度卖登山套餐，退款官司至今还在打。本地的老人说，真正的滤镜山脉其实是灰绿色的，雾散开的那几分钟最好看，可那几分钟通常没人拍照，因为大家都在等雾散完了再修图。"
      en: "The Filter Range is the coast range of the central coast, rising to about 1,672 metres and plunging straight into the sea to form more than a hundred kilometres of cliff coast. Its western slope is steep, cut by the winter rains into deep ravines holding redwoods and streams above the waves and rocks below; the eastern side is gentler, and behind the range lies a long valley, the lettuce valley of Big Surcharge District in Monetary City, which grows most of the state's lettuce. In the north, Mount Beautify, at 1,645 metres, drops straight into the sea on its western side and is nearly always cut in half by sea fog.\nThe Pay-per-View Coast Road hangs on the cliffs, running north along the shore from Lucy Chip City District in Santa Serena through Big Surcharge and Surf Shack Districts to the Bay Area, with every bridge and every viewpoint on a bend charged separately, while the Billboard Road follows the valley behind the range. This is the influencers' favourite place, and the range is named after the photos they post: every one has a filter on it, and no one remembers the mountains' real colour any more. Influencers queue at the cliff edge, ready to wait two hours for a single shot, so the State Roads Department simply built a \"selfie car park\" by the most popular bend, charged by the floor.\nEvery photo taken on Mount Beautify has a beauty filter on it, and in the pictures the mountain is twice its real height; one travel agency sold climbing packages based on the height in the photos, and the refund lawsuit is still going on. Old people here say the real Filter Range is a greyish green and looks its best in the few minutes when the fog is lifting, but nobody usually takes pictures then, because everyone is waiting for the fog to clear so they can retouch."
  - id: nat_r4x2cb
    subtype: mountain_range
    status: generated
    names:
      zh: 调试山脉
      en: Debugger Range
      es: Sierra Depuradora
    notes:
      zh: "调试山脉是海湾以东、中央渴谷以西的一道干燥山岭，最高处只有约 690 米，是全州有名的山脉里最矮的一条。山势低缓，一道道浑圆的山脊之间是开阔的草坡和零散的橡树，夏天几个月滴雨不下，山坡一片金黄，冬天雨一来就转绿。它挡在海湾和谷地之间，下午的海风顺着山口灌向内陆，山口一带风大，适合装风机。山脉北段在贝叶斯边际区的南部，那一带铺满了太阳能板，低处挖着给数据中心降温的冷却池。\n山名来自湾区的程序员：他们周末来这里徒步，说爬上山顶才能想明白代码哪里出了问题。如今程序员都走了，山上只剩下风机。空车领道从后验区向东，经边际区的冷却池和光伏场翻过这一带山丘到斯塔克顿，路上跑的多半是空着的机器人出租车。\n从前山顶的步道边常坐着一排对着笔记本电脑发呆的人，护林员说他们一坐就是一下午，下山时有人欢呼，有人沉默；如今步道上只剩下巡检风机的无人机。一位不肯搬走的老程序员仍然每个周末上山，他说代码已经不用人写了，可「找到问题的那一刻」还得亲自爬上来才有。山顶的界桩上被人刻了一行字：「在我的机器上能运行。」"
      en: "The Debugger Range is a dry range east of the bay and west of the Central Thirsty Valley, rising only to about 690 metres, the lowest of the state's named ranges. Its relief is gentle, with open grassy slopes and scattered oaks between rounded ridges; in the months of summer without a drop of rain the hills turn golden, and in winter they go green as soon as the rain comes. It stands between the bay and the valley, and in the afternoons the sea breeze pours inland through its gaps, making the passes windy and good for turbines. The northern part of the range lies in the south of Marginal District in Bayesian, covered in solar panels, with cooling ponds for the data centres dug in the low ground.\nThe range is named after the Bay Area's programmers, who came hiking here at weekends and said they had to climb to the top to work out what was wrong with their code. The programmers have all gone now, and only the wind turbines are left. The Empty Car Road runs east from Posterior District past the cooling ponds and solar farms of Marginal District and over these hills to Stuckton, carrying mostly empty robotaxis.\nThe trail along the top used to be lined with people staring at their laptops; the rangers say they would sit there all afternoon, and on the way down some would be cheering and some silent. Today the trails carry only drones inspecting the turbines. One old programmer who refused to move away still climbs the range every weekend; code no longer needs people to write it, he says, but \"the moment you find the bug\" still only comes if you climb up here yourself. Someone has carved a line on the boundary post at the top: \"Works on my machine.\""
  - id: nat_hzhj81
    subtype: mountain_range
    status: generated
    names:
      zh: 付费墙山脉
      en: Paywall Range
      es: Sierra Muro de Pago
    notes:
      zh: "付费墙山脉沿南海岸东西横亘，最高处海拔 2463 米，把失落天使盆地和北边的高原荒漠隔开。西段俯瞰盆地，热搜峰海拔 2097 米，峰顶有天文台和一排电视发射塔；东段的山峰最高，主峰订阅峰冬天积雪，透支河就发源于订阅峰一带。南坡迎着海风，长着灌丛和松林，北坡背风干燥，下去就是荒漠；海拔 1305 米的次日达山口在山脉和高原荒漠之间，仓储帝国的货车日夜不停地从那里翻进翻出。山上是国家森林，每年山火季，大火常从这里烧起，烟一直飘到海边。\n山名来自穿山的几条领道：每条都要收费，而且越往山上越贵，本地人说翻过这道山，就到了「付费墙的另一边」。单调领道和仓储领道翻山的一段按海拔分段收费，次日达领道穿过约 11.3 公里的付费墙山脉隧道，按辆收费。订阅峰的步道按月收费，免费用户只能走到半山腰的观景台，山顶的登山者签名簿也是付费的，签名后每月自动续费，取消要打电话。\n热搜峰的山坡上立着几个巨大的白色字母，拼出当天全州搜索量最高的词，由人工智能每天更新，山火季时那几个字母常常是「山火」。天使冠区山后的「低价郊区」离城很远，开车进城单程要三个小时，住在那里的人每天翻山两次，说交的过路费比房贷还多。"
      en: "The Paywall Range runs east to west along the south coast, rising to 2,463 metres and separating the Lost Angeles basin from the high desert to the north. Its western part looks down over the basin, where Mount Trending, at 2,097 metres, carries an observatory and a row of television masts on its summit; the eastern part has the highest peaks, and its main summit, Mount Subscription, carries snow in winter and is near the source of the Overdraft River. The southern slopes face the sea wind and bear scrub and pine woods, while the northern slopes lie dry in the lee and drop into the desert; Next-Day Pass, at 1,305 metres, lies between the range and the high desert, and the lorries of Warehouse Empire grind over it day and night. The mountains are national forest, and every wildfire season fires often start here, their smoke drifting all the way to the coast.\nThe range is named after the state roads that cross it, every one of them tolled, and the higher up the mountain the dearer; locals say that crossing it takes you to \"the other side of the paywall\". The climbs of the Monotone Road and the Warehouse Road are tolled in sections by altitude, and the Next-Day Road goes through the Paywall Range Tunnel, about 11.3 km long, tolled per vehicle. The trail up Mount Subscription is charged by the month: free users can only go as far as the viewpoint halfway up, and even the summit register is paid for, renewing automatically every month once you sign, with cancellation by phone only.\nOn the slopes of Mount Trending stand several giant white letters spelling out the state's most-searched word of the day, updated daily by an AI; in the wildfire season they often spell \"WILDFIRE\". The \"budget suburbs\" beyond the mountains in Angel Crest District are a long way from town, three hours' drive each way, and the people who live there cross the range twice a day and say they pay more in tolls than on their mortgages."
  - id: nat_9emh9n
    subtype: mountain_range
    status: generated
    names:
      zh: 特哈聊天山脉
      en: Tehachatbot Mountains
      es: Montañas Tehachatbot
    notes:
      zh: "特哈聊天山脉是连接估值山脉南端和付费墙山脉的一道山地，最高处海拔约 1266 米，像一道门槛横在中央渴谷的南端：北边是一望无际的谷地农田和油田，翻过山去就是失落天使盆地和高原荒漠。山不算高，坡上是金黄的草地、橡树和灌丛，冬天偶尔落雪；山口一带常年刮着强风，风在荒漠和谷地之间来回灌，山口上于是站满了风机。山的西北麓是巴雷尔斯菲尔德市的压裂原区，几万台抽油机散布在干燥的丘陵上，和山口的风机一起起落、转动。\n山名来自山口上的一座服务区：服务区的客服早就换成了聊天机器人，问路的人常常被它绕进几小时的对话里。单调领道从这里翻过山去，翻山的路段最大坡度约 60‰；沉没成本领道从井口区出发，经压裂原区翻过山到仓储帝国的履约高漠区，路边的收费站从来没收过一分钱。\n冬天起大雾或下雪时，翻山的领道偶尔封路，货车司机挤在服务区里等通车，闲着没事就和聊天机器人斗嘴。据说有位司机花了一整夜，终于让它承认「我也不知道路什么时候通」，这句话后来被印在服务区的冰箱贴上，成了最畅销的纪念品。风电场的维修工说，山口的风比机器人的话还多，可至少风是真的在干活。"
      en: "The Tehachatbot Mountains are a range of uplands linking the southern end of the Sierra Valuation with the Paywall Range, rising to about 1,266 metres and lying like a threshold across the southern end of the Central Thirsty Valley: to the north stretch the endless farms and oilfields of the valley, and over the top lie the Lost Angeles basin and the high desert. They are not high, their slopes covered in golden grass, oaks and scrub, with the occasional snowfall in winter; strong winds blow through the passes all year, funnelling back and forth between desert and valley, so the passes are crowded with wind turbines. On the north-western flank lies Fracklands District of Barrelsfield City, where tens of thousands of pumpjacks dot the dry hills, nodding while the turbines in the passes turn.\nThe range is named after a service area on the pass, where the customer service desk was long ago handed over to a chatbot that often draws people asking the way into conversations lasting hours. The Monotone Road crosses the range here, with grades of up to about 60‰ on the climb; the Sunk Cost Road runs from Wellhead District through Fracklands District and over the range to High Desert Fulfillment District in Warehouse Empire, past toll booths that have never collected a cent.\nIn winter fog or snow the roads over the range are sometimes closed, and lorry drivers crowd into the service area to wait, bickering with the chatbot to pass the time. One driver is said to have spent an entire night getting it to admit \"I don't know when the road will reopen either\"; the line was later printed on the service area's fridge magnets and became its best-selling souvenir. The wind-farm engineers say the pass has even more wind than the chatbot has words, but at least the wind is actually doing some work."
  - id: nat_9981nk
    subtype: mountain_range
    status: generated
    names:
      zh: 边检山脉
      en: Checkpoint Range
      es: Sierra del Retén
    notes:
      zh: "边检山脉是自治州南端由北向南延伸的山脉，北端的主峰通关峰海拔约 2433 米。山脉西坡迎着海上来的湿气，长着松林和苹果园，东坡陡然落进荒漠，在雨影下一片焦黄。北端的高峰冬天积雪，山脚就是帕姆斯普林克勒喷灌区的高尔夫球场，山下四十五度时山顶有时在下雪，一条缆车从山脚直上山顶。山脉南段穿过圣遣返市的后山区，山后是一片沙漠公园；水泥河从山脉北端流下，向西穿过失落天使盆地入海。\n山名来自移民执法局的检查站：山里每条路上都有一座。边墙领道贴着南海岸的钢墙向东，再折进边检山脉，执法局把一座检查站修在山口正中间，山路上不能掉头，上了山口的车只能一直开到检查站前排队。通关峰的缆车站也设了检查站，上山要出示证件，下山还要再出示一次，登山者说这是全州唯一要「出入境」两次的山。\n后山区的人进一趟城要停三四次，牧场主说他的牛被查证件的次数比他还多。秋天苹果熟了，山里的果农开着皮卡下山卖果子，车斗里的每一箱苹果都要过一遍扫描仪；有果农在箱子上贴了张纸条：「本箱苹果均为本地出生」，检查站的警员看了也忍不住笑。"
      en: "The Checkpoint Range runs north to south at the southern end of the state, its highest summit Mount Clearance, at the northern end, about 2,433 metres high. Its western slopes catch the moist air off the sea and carry pine woods and apple orchards, while its eastern side drops steeply into the desert, scorched brown in the rain shadow. The northern summits carry snow in winter, and at their foot lie the golf courses of Sprinkler District in Palm Sprinklers; when it is forty-five degrees below, it is sometimes snowing on top, and a cable car runs from the foot of the mountain to the summit. The southern part of the range runs through Backcountry District of San Deportes, with a desert park behind it, and the Concrete River comes down from the northern end of the range and flows west across the Lost Angeles basin to the sea.\nThe range is named after the checkpoints of the immigration enforcement agency, one on every road through it. The Wall Road runs east along the steel wall on the south coast and then turns into the Checkpoint Range, and the agency has built a checkpoint in the very middle of the pass; there is no turning on the mountain road, so every car that reaches the pass must drive on and queue at the checkpoint. The cable-car station on Mount Clearance has a checkpoint too, where you show your papers going up and again coming down, and climbers say it is the only mountain in the state where you have to \"clear immigration\" twice.\nPeople in Backcountry District are stopped three or four times on a trip into town, and one rancher says his cattle have had their papers checked more often than he has. In autumn, when the apples ripen, the growers drive their pickups down the mountain to sell them, and every crate in the back has to go through a scanner; one grower stuck a note on his crates reading \"All apples in this crate were born locally\", and even the officers at the checkpoint could not help laughing."
  - id: nat_3t794s
    subtype: mountain_range
    status: generated
    names:
      zh: 白皮书山脉
      en: White Paper Mountains
      es: Montañas del Libro Blanco
    notes:
      zh: "白皮书山脉是估值山脉以东的一道干燥高山，最高处海拔约 1575 米，玛门市坏账谷区的荒漠盆地就在它和薄荷币山脉之间。它在估值山脉的雨影里，海上来的风暴翻过估值山脉时已经把雨雪落尽，山上一年到头干燥少雨。山顶的石灰岩和雪终年泛白，坡上没有成片的森林，只有零散的老松树，树龄好几千年，树干被风沙扭成螺旋，一半已经枯死，另一半仍在发芽。山脚下是碎石扇和干沟，夏天正午的地面烫得能煎蛋，冬天夜里却冷到零下，昼夜温差大得能把岩石冻裂。\n山名来自湾区公司的「白皮书」：读起来很长，看起来很白，里面什么也长不出来。湾区的公司曾经爱在发布新产品时附上一份厚厚的白皮书，本地人说这道山和那些文件一样，远看气势很大，走近了只有石头。\n老松林是山里唯一的看点。护林员从不公开树龄最大的那几棵在哪里，免得游客去剥树皮、刻名字。一家初创公司曾提出给每棵老松树「上链」，发行对应的数字藏品，用募来的钱保护松林，护林员读完了对方送来的白皮书，回信只有一句：「松树已经活了几千年，不需要你们的路线图。」夏天有少数徒步者专程进山，找到一棵老松，在树下坐上一整天，说这是全州最安静的地方。"
      en: "The White Paper Mountains are a dry, high range east of the Sierra Valuation, rising to about 1,575 metres, with the desert basin of Bad Debt Valley District in Mammon City lying between them and the Mintcoin Range. They stand in the rain shadow of the Sierra Valuation: by the time storms from the sea have crossed the Sierra they have dropped all their rain and snow, so the range is dry all year round. Its summits of limestone and snow stay white all year, and its slopes carry no continuous forest, only scattered ancient pines thousands of years old, their trunks twisted into spirals by wind and sand, half dead and half still putting out shoots. At the foot of the range lie gravel fans and dry gullies; at noon in summer the ground is hot enough to fry an egg, yet winter nights drop below freezing, and the swing between day and night is enough to split the rock.\nThe name comes from the \"white papers\" of Bay Area companies: long to read, very white to look at, and nothing grows in them. Bay Area companies used to love attaching a thick white paper to every new product, and locals say these mountains are just like those documents, imposing from afar and nothing but rock up close.\nThe old pine groves are the only attraction. The rangers never reveal where the oldest trees stand, so that visitors cannot strip their bark or carve their names. A start-up once proposed putting every ancient pine \"on the chain\" and issuing matching digital collectibles, with the money raised going to protect the groves; the rangers read the white paper it sent them and replied in a single line: \"The pines have lived for thousands of years. They don't need your roadmap.\" In summer a few hikers make the trip on purpose, find an old pine and sit beneath it all day, calling it the quietest place in the state."
  - id: nat_35ng5c
    subtype: mountain_range
    status: generated
    names:
      zh: 薄荷币山脉
      en: Mintcoin Range
      es: Sierra Mentamoneda
    notes:
      zh: "薄荷币山脉是坏账谷西边一道荒凉的山岭，属玛门市坏账谷区，主峰矿机峰海拔 2004 米。山体是干燥的石山，坡上只有稀疏的灌丛和几株矮松，沟谷里是碎石和干河床；坏账谷区的荒漠盆地就夹在它和白皮书山脉之间，最低的盆地夏天热得能把鸡蛋烤熟，山顶在冬天却偶尔积雪。山里有废弃的银矿和矿城，木头搭的矿井架和空荡荡的酒馆还立在风里。这些银矿是淘银时代开的，矿城最兴旺时住着好几千人，银子挖完以后，人走得一个不剩；如今从坏账谷区沿土路进山，要颠簸好几个小时。\n山名来自一种在山里「挖」出来的加密货币。一家公司把矿机峰山腰的银矿坑道装满了矿机，借山里的低温散热，后来币价归零，矿机全部断电，和银矿一起被废弃了；坑道里至今排着成千上万台机器，蝙蝠在上面筑巢。\n如今进山的多是越野车手、拍废墟照片的游客和寻找旧矿机的拾荒者，他们从坑道里拆出芯片和铜线，运到山下去卖。老矿城的墓地里，淘银时代的墓碑旁边多了一块新碑，刻着那种币的名字和它归零的日子，不知是谁立的。坏账谷区的人说，这座山被挖空过两次：第一次挖走的是银子，第二次挖走的是投资者的钱，两次都没给山下留下什么。"
      en: "The Mintcoin Range is a barren range west of Bad Debt Valley, in Bad Debt Valley District of Mammon City, its highest summit Mount Mining Rig at 2,004 metres. It is a range of dry rock, with only sparse scrub and a few stunted pines on its slopes and gravel and dry washes in its gullies; the desert basin of Bad Debt Valley District lies between it and the White Paper Mountains, its lowest hollow hot enough in summer to bake an egg, while the summits sometimes carry snow in winter. In the mountains are abandoned silver mines and mining towns, their timber headframes and empty saloons still standing in the wind. The mines were opened in the silver-rush days, and at their height the towns held several thousand people; when the silver ran out, every last one of them left, and today the dirt road up from Bad Debt Valley District is a jolting drive of several hours.\nThe name comes from a cryptocurrency once \"mined\" in the mountains. A company filled the old silver-mine tunnels on the flanks of Mount Mining Rig with mining rigs, using the cool of the mountain to keep them from overheating; then the coin's price went to zero, every rig was switched off, and they were abandoned along with the silver mine. Thousands upon thousands of machines still stand in rows in the tunnels, with bats nesting on top of them.\nToday those who come into the mountains are mostly off-road drivers, tourists photographing the ruins and scavengers hunting for old rigs, who strip out the chips and copper wire and carry them down to sell. In the old mining town's cemetery a new headstone has appeared beside the graves of the silver-rush days, carved with the coin's name and the day it hit zero, and nobody knows who put it there. People in Bad Debt Valley say the range has been dug hollow twice, once for silver and once for investors' money, and neither time left anything for the valley below."
  - id: nat_tkmfq1
    subtype: mountain_range
    status: generated
    names:
      zh: 脚本丘陵
      en: Javascript Hills
      es: Colinas Javascript
    notes:
      zh: "脚本丘陵是东南荒漠里一列列低矮的石山，最高处海拔约 1436 米，在帕姆斯普林克勒市帝国尘区的荒漠里。石山一列接一列排开，山体是风化的岩石，表面被晒成深褐色，山间是沙丘和干湖，干湖底平得像桌面，雨后会短暂地积起一层浅水，几天就蒸发得只剩盐壳。这里夏天酷热，冬天夜里却很冷，几乎没有树，只有仙人掌、灌丛和蜥蜴；荒漠里还有一个军用靶场，风向对时，能听见远处沉闷的爆炸声。\n山名来自山里的一座大型太阳能电站：它的控制系统据说是用一段没有人看得懂的脚本写的，写它的人早已离职，谁也不敢动它，于是它一直在运行。电站的光伏板铺满了几道山谷，从高处看像一片反着光的湖，常有迷路的水鸟俯冲下来，又失望地飞走。\n电站的值班员说，他们的工作不是维护系统，而是确保没有人去碰它。曾经有一位新来的工程师想给脚本加一行注释，第二天电站的发电量莫名其妙地下降了百分之三，他把注释删掉，发电量又回来了；从那以后，机房门口贴了一张纸：「能跑就别动。」帝国尘区的人说，脚本丘陵里最古老的东西不是石头，而是那段代码。"
      en: "The Javascript Hills are rows of low rocky hills in the south-eastern desert, rising to about 1,436 metres, in the desert of Imperial Dust District in Palm Sprinklers City. The hills line up one row after another, built of weathered rock baked dark brown on the surface, with dunes and dry lakes between them; the dry lake beds are flat as a tabletop, briefly holding a skin of shallow water after rain that evaporates within days to a crust of salt. Summers are scorching and winter nights cold, and there are almost no trees, only cacti, scrub and lizards; there is also a military range in the desert, and when the wind is right you can hear dull explosions in the distance.\nThe hills are named after a great solar power station among them, whose control system is said to have been written in a script nobody can understand; its author left long ago, nobody dares touch it, and so it just keeps running. The station's panels cover several valleys, and from above they look like a shining lake; lost waterbirds often swoop down to it and fly away disappointed.\nThe station's staff say their job is not to maintain the system but to make sure nobody touches it. A new engineer once tried to add a comment to the script, and the next day the station's output inexplicably fell by three per cent; he deleted the comment and the output came back. Since then a sheet of paper has been taped to the control-room door: \"If it runs, don't touch it.\" People in Imperial Dust say the oldest thing in the Javascript Hills is not the rock but that code."
