  - id: nat_sa0fd2
    subtype: strait
    status: generated
    detect: { kind: strait, at_km: [250.5, 52.8] }
    names: { zh: 斯瓦尔霍尔姆水道, en: Svalholm Sound, art-x-viking: Svalholmsund }
    notes:
      zh: 斯瓦尔霍尔姆岛与马拉布尔岛之间的水道，宽约九公里半，是进出隆迪纳亚湾的主航道。隆迪纳亚湾内暗礁密布，只有这条水道水深足够、航道清晰，大型货船都经这里驶向湾畔的隆迪纳亚保税物流园。航道两侧设有浮标和灯标，马拉布尔岛山顶的灯塔为船只导航，引航员常在水道口登船，带领大船穿过暗礁区。水道南侧的斯瓦尔霍尔姆岛是海燕繁殖的岩岛，春夏时节过往的船员能看到成群的海鸟在岛崖间起落。
      en: The channel between Svalholm and Marrable Island, about 9.5 km wide and the main fairway into Rondinaia Bay. The bay is full of reefs, and only this channel has deep enough water and a clear line, so large cargo ships come this way to the shore of the Rondinaia Bonded Logistics Park. Buoys and lights mark both sides, the lighthouse on Marrable Island guides vessels in, and pilots often board at the mouth to take big ships through the reefs. Svalholm on the south side is a rock where storm petrels breed, and in spring and summer passing crews see flocks of seabirds rising and settling along its cliffs.
  - id: nat_ch1td2
    subtype: strait
    status: generated
    detect: { kind: strait, at_km: [247.8, 55.8] }
    names: { zh: 马拉布尔水道, en: Marrable Sound, art-x-viking: Marrablesund }
    notes:
      zh: "马拉布尔岛与斯瓦尔内斯角之间的狭窄水道，宽不到三公里，从西侧连通隆迪纳亚湾与外海。水道两侧都是岩岸，中间有几处暗礁，水深变化大，大型船舶不走这里，只有熟悉水情的渔船、观鸟船和游艇从这里抄近路进出隆迪纳亚湾。马拉布尔岛山顶的灯塔正对水道，夜间为过往船只指明方向。涨落潮时水道里流速较快，海燕和燕鸥常在水道上空盘旋，捕食被潮水卷起的小鱼。当地渔民有个说法，过马拉布尔水道要「听潮不听人」，涨落潮的时间一错，水道就变脸，所以船长们出发前都要先看灯塔旁挂着的潮汐表。"
      en: "The narrow channel between Marrable Island and Svalnes, less than 3 km wide, linking Rondinaia Bay with the open sea on its western side. Both shores are rock and there are reefs in mid-channel, so the depth changes sharply; large ships avoid it, and only fishing boats, birdwatching boats and yachts that know the water use it as a short cut into the bay. The lighthouse on the island's summit looks straight down the channel and guides boats through at night. The tide runs fast here on the flood and the ebb, and storm petrels and terns wheel overhead, picking off the small fish it stirs up. Local fishers say you cross Marrable Sound \"by the tide, not by anyone's advice\": get the tide wrong and the sound turns on you, so skippers check the tide table posted by the lighthouse before setting out."
  - id: nat_kgkyyt
    subtype: strait
    status: generated
    detect: { kind: strait, at_km: [236.0, 59.0] }
    names: { zh: 镜岛水道, en: Mirror Sound, art-x-viking: Spiegelsund }
    notes:
      zh: "镜岛与北面铁岬之间的水道，宽只有两公里左右，水浅流缓，连通斯佩基亚拉湾北部与湾顶的柳萨湾一带。水道底部是柳萨河带来的细沙和泥，水深只有几米，大船无法通行，只有游艇、皮划艇和小渔船往来。风平浪静时水面像一面镜子，倒映着镜岛的松林和铁岬红褐色的岩壁。水道两岸的浅滩是贝类、小鱼和涉禽聚集的地方，周末常有人在铁岬一侧垂钓。风平浪静的清晨，皮划艇从镜岛水道划过，船桨每划一下，水里的松林倒影就碎开又合上，划手们说在这里划船「像在画上划」。"
      en: "The channel between Mirror Isle and Iron Point to the north, only about 2 km wide, shallow and slow, linking the northern part of Specchiara Bay with Ljosa Bay at its head. Its floor is fine sand and mud brought down by the Ljosa River, only a few metres deep, so large ships cannot pass; only yachts, kayaks and small fishing boats use it. On calm days the water is a mirror for the island's pines and the rust-red rock of Iron Point. The shallows on either side gather shellfish, small fish and waders, and anglers line the Iron Point side at weekends. On a still morning kayaks slide through Mirror Sound, the reflected pines shattering and closing again with every paddle stroke, and paddlers say rowing here is \"like rowing across a painting\"."
  - id: nat_5xt2h0
    subtype: strait
    status: generated
    detect: { kind: strait, at_km: [296.2, 90.2] }
    names: { zh: 金纳尔维克水道, en: Qinnarvik Sound, art-x-viking: Qinnarviksund }
    notes:
      zh: "金纳尔维克岛与本岛之间的水道，宽约四公里，是东营湾的南入口。水道两岸低平，岸边是沙滩和盐沼，水深不大，潮水随涨落来回流动，大船一般不走这里，进出东营湾的主航线在北面的布德水道。金纳尔维克水道是近海渔船和小艇进出海湾的捷径，也是海豹和海鸟常出没的地方，金纳尔维克岛的旧哨楼俯瞰着整条水道。冬季风暴时，渔船常从这里驶入海湾避风。旧哨楼如今是一间小咖啡馆，窗口正对水道，坐在窗边常能看到海豹在水里探出头来，咖啡馆老板说，海豹比客人来得还准时。"
      en: "The channel between Qinnarvik Island and the mainland, about 4 km wide and the southern entrance to East Camp Bay. Its shores are low beaches and salt marsh and the water is not deep, the tide running back and forth through it with the ebb and flow; large ships keep to Budey Sound in the north, the bay's main fairway. Qinnarvik Sound is the short cut for inshore fishing boats and small craft and a haunt of seals and seabirds, and the old watchtower on Qinnarvik Island overlooks its whole length. In winter storms fishing boats often run in through it to shelter in the bay. The old watchtower is now a small café whose windows face the sound, seals often poke their heads up as you sit by the glass, and the owner says the seals keep better time than the customers."
  - id: nat_xg4y0d
    subtype: strait
    status: generated
    detect: { kind: strait, at_km: [297.0, 94.5] }
    names: { zh: 布德水道, en: Budey Sound, art-x-viking: Budeysund }
    notes:
      zh: "布德岛西侧的水道，宽约六公里，是东营湾的主航道。水道比南面的金纳尔维克水道更深更宽，进出东营湾的船只大多走这里，两侧设有浮标和灯标。布德岛挡住了东面外海的大浪，水道里即使在冬季风暴中也相对平稳，是近海渔船和补给船避风的通道。水道西侧就是布德内斯角和东营湾北部较深的湾区，涨潮时海水从这里大量涌入湾内，退潮时又经此流回外海。布德岛的老渔民说，这条水道是「海湾的大门」，风暴天里看到渔船一条接一条驶进来，就知道全湾的人今晚都能睡个好觉。"
      en: "The channel west of Budey, about 6 km wide and the main fairway of East Camp Bay. Deeper and wider than Qinnarvik Sound to the south, it carries most of the traffic in and out of the bay and is marked by buoys and lights on both sides. Budey breaks the big seas from the east, so the channel stays fairly calm even in winter storms and is the sheltered way in for inshore fishing boats and supply vessels. To its west lie Budnes and the deeper northern basin of the bay; on the flood the sea pours in through it, and on the ebb it drains back to the open sea. Budey's old fishers call the sound \"the bay's front door\", and on a stormy day, seeing the boats come in one after another, they know everyone around the bay will sleep well tonight."
