# Coastal landforms of North Viking Island: islands, bays, fjords, capes and straits.
# The generator finds them in the coastline (pipeline/atlas/coast.py); each entry names the
# landform of `detect.kind` nearest to `detect.at_km` (design km, x east, y north).
# Unnamed landforms are listed in .cache/candidates-<territory>.json after a build.
features:
  # ── Islands ──────────────────────────────────────────────
  - id: nat_vwan1x
    subtype: island
    status: generated
    detect: { kind: island, at_km: [251.2, 50.2] }
    names: { zh: 斯瓦尔霍尔姆岛, en: Svalholm, art-x-viking: Svalholm }
    notes:
      zh: "隆迪纳亚湾口外的小岛，行政上属天城市天台区，面积不到十平方公里（9.6 平方公里），却高出海面四百五十多米（458 米），平均海拔也有 330 多米，几乎整座岛都是陡立的岩壁，只有顶部留着几片草坡。每年春季，大群海燕从远海飞回，在岩壁的缝隙和草坡上的洞穴里筑巢产卵，入夜后成千上万只海燕鸣叫着归巢，隆迪纳亚区和隆迪纳亚湾都因此得名；湾里的离岛和礁石同样是海燕和燕鸥的繁殖地，部分岛礁划为保护区。岛上不住人，也没有码头，观鸟船只能绕岛航行，在保护距离之外观看，乘船观鸟是隆迪纳亚区独有的旅游项目。斯瓦尔霍尔姆岛与北面的马拉布尔岛之间是宽约九公里半的斯瓦尔霍尔姆水道，湾内暗礁密布，只有这条水道水深足够，大型船舶都从这里进出隆迪纳亚湾，春夏时节过往的船员能看到成群的海鸟在岛崖间起落。\n观鸟船多在黄昏出发，赶在海燕归巢时绕到岛的背风面，船长会关掉引擎，让船随浪漂着，船上的人屏住呼吸听岩壁上越来越响的鸣叫声。隆迪纳亚保税物流园的工人说，春天加夜班时，即使隔着海湾，也能在风停的间隙听见斯瓦尔霍尔姆岛方向传来的鸟叫，那是一年里「海燕回来上班了」的信号。"
      en: "A small island outside the mouth of Rondinaia Bay, administered as part of Sky Terrace District of Skytown City. It covers less than 10 km² (9.6 km²) yet rises more than 450 m (458 m) above the sea, with an average height of over 330 m; almost the whole island is sheer cliff, with just a few grassy slopes left on top. Every spring great flocks of petrels return from the open ocean to nest and lay their eggs in crevices in the cliffs and burrows in the grass, and after dark tens of thousands of them fly home calling; Rondinaia District and Rondinaia Bay are both named after them. The islets and reefs inside the bay are breeding grounds for petrels and terns as well, and some are protected. No one lives on the island and there is no landing stage; birdwatching boats can only sail around it and watch from beyond the protection limit, and boat trips to see the birds are something only Rondinaia District offers. Between Svalholm and Marrable Island to the north lies Svalholm Sound, about 9.5 km wide. Rondinaia Bay is thick with reefs and only this channel is deep enough, so every large ship enters and leaves the bay this way, and in spring and summer passing crews can watch flocks of seabirds rising and settling along the island's cliffs.\nThe birdwatching boats usually leave at dusk, timing their arrival on the island's lee side for the petrels' homecoming; the skipper cuts the engine and lets the boat drift on the swell while everyone aboard holds their breath and listens to the calling on the cliffs grow louder and louder. Workers at the Rondinaia Bonded Logistics Park say that on spring night shifts, even across the bay, you can hear the birds from the direction of Svalholm in the lulls of the wind, the year's signal that \"the petrels are back at work\"."
  - id: nat_sq09st
    subtype: island
    status: generated
    detect: { kind: island, at_km: [249.2, 55.2] }
    names: { zh: 马拉布尔岛, en: Marrable Island, art-x-viking: Marrableinsel }
    notes:
      zh: "隆迪纳亚湾口的岛屿，行政上属天城市天台区，面积近十九平方公里（18.8 平方公里），全岛是一座海拔三百多米（329 米）的圆顶山丘，四面陡峭。山顶的灯塔为进出斯佩基亚拉湾和隆迪纳亚湾的船只导航，是东南海岸最重要的航标之一。岛的西侧隔着窄窄的马拉布尔水道与斯瓦尔内斯角相望，那条水道宽不到三公里，暗礁多、流速快，只有熟悉水情的渔船、观鸟船和游艇从这里抄近路；南侧隔着宽约九公里半的斯瓦尔霍尔姆水道与斯瓦尔霍尔姆岛相对，隆迪纳亚湾内暗礁密布，大型船舶就从斯瓦尔霍尔姆水道进出，驶向湾畔的隆迪纳亚保税物流园，引航员常在水道口登船。岛上只有灯塔守护人和气象站的工作人员，岩坡上栖息着成群的海燕和燕鸥，岛周围的部分礁石划为海鸟保护区，乘船观鸟的航线常从岛下经过。\n灯塔守护人和气象站的工作人员每两周换一次班，补给船赶上风浪大的日子靠不了岸，就只好在水道里转一圈回去。守护人说，岛上最热闹的时候是春天海鸟回巢，最安静的时候是冬夜起雾，灯塔的光柱在雾里像一根白色的柱子，远处船上的人隔着无线电向他们道一声谢，是值班时最暖心的事。"
      en: "An island at the mouth of Rondinaia Bay, administered as part of Sky Terrace District of Skytown City: nearly 19 km² (18.8 km²), the whole island a single domed hill a little over 300 m high (329 m) with steep sides all round. The lighthouse on the summit guides ships in and out of Specchiara Bay and Rondinaia Bay and is one of the most important navigation marks on the south-east coast. To the west, across the narrow Marrable Sound, lies Svalnes; that channel is less than 3 km wide, rocky and fast-flowing, and only fishing boats, birdwatching boats and yachts that know its waters use it as a short cut. To the south, across Svalholm Sound, about 9.5 km wide, lies Svalholm. Rondinaia Bay is thick with reefs, so large ships enter and leave through Svalholm Sound on their way to the Rondinaia Bonded Logistics Park on the shore, often taking on a pilot at the mouth of the channel. The only people on the island are the lighthouse keepers and the staff of the weather station; petrels and terns nest in colonies on the rocky slopes, part of the surrounding reefs is a seabird reserve, and the birdwatching boats often pass beneath the island.\nThe keepers and weather staff change shifts every two weeks, and when seas are rough the supply boat cannot land and simply circles in the sound and turns back. The keepers say the island is liveliest in spring when the seabirds return to nest and quietest on foggy winter nights, when the beam stands in the mist like a white pillar; a word of thanks over the radio from a ship far out is the warmest moment of a watch."
  - id: nat_xr4bvf
    subtype: island
    status: generated
    detect: { kind: island, at_km: [236.2, 57.8] }
    names: { zh: 镜岛, en: Mirror Isle, art-x-viking: Spiegelinsel }
    notes:
      zh: "斯佩基亚拉湾北部、湾顶附近的岛屿，属贝克勒自由贸易区斯佩基亚拉区，面积二十四平方公里多（24.6 平方公里），岛中央是一座海拔近两百米（194 米）的圆丘。岛的北面隔着两公里宽的镜岛水道与铁岬相望，水道底部是柳萨河带来的细沙和泥，水深只有几米，大船无法通行，只有游艇、皮划艇和小渔船往来；铁岬的岩石富含铁质，被海水浸出红褐色，与镜岛的松林隔水相映。斯佩基亚拉湾是北维京岛面积最大的海湾，湾口朝南，水深浪静，风平的日子里岛影完整地倒映在湾面上，是贝克勒自由贸易区的标志景观，也画在自贸区的旗帜上，斯佩基亚拉滨海公园的长廊正对着这片倒影。岛上保留着成片的松林和草甸，没有高楼和工厂，只有环岛步道和几处观景亭，周末有船从斯佩基亚拉港载游客上岛。从岛顶南望，斯佩基亚拉国际金融中心的双塔和自贸区的港口尽收眼底。\n寸土寸金的自贸区里，镜岛是少有的一片「空地」，斯佩基亚拉区的金融从业者把上岛散步叫作「去对面充电」，周末的渡船上常有人一下船就把手机调成静音。风平浪静的清晨，皮划艇从镜岛水道划过，船桨每划一下，水里的松林倒影就碎开又合上；摄影师们为了拍一张完整的倒影，常常在滨海公园的长廊上从天亮等到中午。"
      en: "An island in the north of Specchiara Bay, near the head of the bay, in Specchiara District of the Beckerle Free Trade Zone: a little over 24 km² (24.6 km²), with a rounded hill nearly 200 m high (194 m) at its centre. To the north, across Mirror Sound, 2 km wide, lies Iron Point. The sound's bed is fine sand and mud brought down by the Ljosa River and only a few metres deep, so large ships cannot pass and only yachts, kayaks and small fishing boats use it; the iron-rich rock of Iron Point, stained rust-brown by the sea, faces the island's pinewoods across the water. Specchiara Bay is the largest bay on North Viking Island, opening to the south, deep and calm, and on still days the island's reflection lies complete on the water. It is the emblem of the Beckerle Free Trade Zone and appears on the zone's flag, and the promenade of Specchiara Waterfront Park looks straight out at the reflection. The island keeps its pinewoods and meadows, with no high-rises or factories, only a path around the shore and a few viewing pavilions, and at weekends boats bring visitors over from Specchiara Port. From the summit, looking south, the twin towers of the Specchiara International Finance Centre and the zone's port are spread out below.\nIn a free trade zone where every square metre is precious, Mirror Isle is one of the few \"empty\" places, and Specchiara's finance workers call a walk on the island \"going across to recharge\"; on the weekend boats people often switch their phones to silent as soon as they step ashore. On calm mornings kayaks glide through Mirror Sound, and with each stroke the reflected pines shatter and close again; photographers after a perfect reflection often wait on the park promenade from dawn until noon."
  - id: nat_hzrb58
    subtype: island
    status: generated
    detect: { kind: island, at_km: [297.2, 89.8] }
    names: { zh: 金纳尔维克岛, en: Qinnarvik Island, art-x-viking: Qinnarvikinsel }
    notes:
      zh: "东营湾南侧的岛屿，属马斯林山市东营区，面积十四平方公里多（14.6 平方公里），最高处海拔 93 米，平均海拔约 60 米。岛与本岛之间隔着宽约四公里的金纳尔维克水道，水道是东营湾的南入口，两岸低平，水深不大，大船一般不走这里，近海渔船和小艇却常从这里抄近路进出海湾，冬季风暴时也从这里驶入湾内避风。岛上地势低缓，覆盖着石楠和草甸，夏末石楠开花，整座岛染成一片淡紫。高地上的旧哨所曾日夜守望东部海域，岛名由此而来，如今只剩石砌的哨楼和瞭望台，旧哨楼改成了一间小咖啡馆，窗口正对着水道。岛的四周是礁石和小海湾，海鸟在崖边筑巢，海豹常在礁石上晒太阳。金纳尔维克岛与北面的布德岛一起，为东营湾挡住了外海的风浪，湾内因此保持着沙滩、盐沼和防风林的安静模样。\n东营区是马斯林山市的后勤和航空保障基地，岛上的游客多是驻军家属和来休假的工程师。周末坐小船上岛，在哨楼咖啡馆的窗边点一杯热咖啡，常能看见海豹在水道里探出头来，又一下子沉下去；本地人说，数清一杯咖啡的工夫里冒出几只海豹，比读天气预报还准，海豹多的日子，第二天准是好天。"
      en: "An island on the south side of East Camp Bay, in East Camp District of Maslin Mountain City: a little over 14 km² (14.6 km²), rising to 93 m with an average height of about 60 m. It is separated from the mainland by Qinnarvik Sound, about 4 km wide and the bay's southern entrance. The sound is low-shored and shallow, and large ships generally keep away, but inshore fishing boats and small craft often take it as a short cut into the bay and run in through it to shelter from winter storms. The island is low and rolling, covered in heather and meadow, and when the heather flowers in late summer the whole island turns pale purple. On its high ground an old watch post once kept an eye on the eastern sea day and night, which gave the island its name; only the stone watchtower and lookout remain, and the old tower has become a small café whose window looks straight out over the sound. Rocks and coves ring the shore, seabirds nest along the cliff edges and seals bask on the skerries. Together with Budey to the north it shelters East Camp Bay from the open sea, which is why the bay keeps its quiet shore of beaches, salt marsh and windbreak woods.\nEast Camp is Maslin Mountain City's logistics and air-support base, and most visitors to the island are service families and engineers on leave. At weekends people take a small boat across, order a hot coffee at the window of the watchtower café, and often see seals poke their heads up in the sound and slip back under. Locals say that counting the seals that surface while you drink one cup is a better forecast than the weather report: on a day with plenty of seals, tomorrow will be fine."
  - id: nat_q60x3z
    subtype: island
    status: generated
    detect: { kind: island, at_km: [298.2, 95.8] }
    names: { zh: 布德岛, en: Budey, art-x-viking: Budey }
    notes:
      zh: "东营湾外侧的岛屿，属马斯林山市东营区，面积近十五平方公里（14.7 平方公里），地势低平，最高处只有 72 米，平均海拔约 54 米。岛的西侧是宽约六公里的布德水道，比南面的金纳尔维克水道更深更宽，是进出东营湾的主航道，两侧设有浮标和灯标；岛的东面直面外海，冬季风暴的浪头先打在布德岛的岩岸上，它与南面的金纳尔维克岛一起替东营湾挡住了外海的风浪，即使在风暴中，布德水道里也相对平稳，是近海渔船和补给船避风的通道。东营湾内没有商港，全市的货运都经北面的马斯林河口港进出，湾口外的布德岛因此少有大船打扰。传说早年驻军在岛上扎过营盘，岛名由此而来。如今岛上是成片的草甸和沙丘，夏季开满野花，东营湾和布德岛构成了东营区最主要的海岸风景。\n马斯林山是全岛降水最少的城市，布德岛的夏天晴朗温暖，东营区的驻军家属常在周末坐船上岛，在沙丘背风处野餐、放风筝。布德岛的老渔民管西侧的水道叫「海湾的大门」，风暴天里看着渔船一条接一条驶进来，才算放下心；他们还说，站在岛东的岩岸上数浪头，数到第七个最大的浪拍上来，就该收拾东西回家了。"
      en: "An island on the outer side of East Camp Bay, in East Camp District of Maslin Mountain City: nearly 15 km² (14.7 km²), low and flat, rising to only 72 m with an average height of about 54 m. To its west lies Budey Sound, about 6 km wide, deeper and broader than Qinnarvik Sound to the south and the main channel in and out of the bay, marked with buoys and lights. The island's east side faces the open sea, and winter storm waves break first on Budey's rocky shore; together with Qinnarvik Island to the south it shelters East Camp Bay, so that even in a storm Budey Sound stays relatively calm, a refuge channel for inshore fishing boats and supply vessels. East Camp Bay has no commercial port, since all the city's freight goes through the Maslin Mouth Port to the north, so few large ships disturb Budey. Legend has it that soldiers once pitched camp on the island, which gave it its name. Today it is covered in meadow and dunes, carpeted with wild flowers in summer, and East Camp Bay and Budey are East Camp District's main coastal scenery.\nMaslin Mountain has the lowest rainfall of any city on the island, and Budey's summers are bright and warm; service families from East Camp often take a boat out at weekends to picnic and fly kites in the lee of the dunes. Budey's old fishermen call the sound on its west side \"the gate of the bay\" and only relax when they have watched the boats come in one after another on a stormy day. They also say that if you stand on the rocks on the east side counting waves, by the time the seventh big one breaks it is time to pack up and go home."

  # ── Bays and fjords ──────────────────────────────────────
  - id: nat_yvejfq
    subtype: bay
    status: generated
    detect: { kind: bay, at_km: [225.2, 36.2] }
    names: { zh: 萨科湾, en: Sako Bay, art-x-viking: Sakobucht }
    notes:
      zh: 萨科勒市萨科区南岸的海湾，面积五十多平方公里，东侧是萨科角。湾畔的萨科镇原是巴克汉姆人的渔镇，也是萨科勒市最早的定居点，彩色的石屋沿港湾排开。萨科渔港至今仍是本岛南部最繁忙的渔港之一，渔船每天清晨把鳕鱼、鲭鱼和贝类送到萨科鱼市拍卖，鱼市旁的小餐馆以巴克汉姆风味的海鲜汤闻名。罗卡区岩堡公园的岩丘上有观景台，可以眺望萨科湾和来往的船只；内陆的萨科山口则是登山者喜爱的去处。
      en: A bay on the south coast of Sako District in Sakole, a little over 50 km², with Cape Sako on its east side. Sako town on its shore began as a Buckham fishing village and was the first settlement of Sakole; its painted stone houses still line the harbour. Sako harbour remains one of the busiest fishing ports in the south of the island. Every morning the boats bring cod, mackerel and shellfish to the Sako Fish Market for auction, and the little restaurants beside it are known for their Buckham-style fish soup. The lookout on the rock in Rocca Park looks out over the bay and the passing boats, and Sako Pass inland is a favourite with walkers.
  - id: nat_7n9nyd
    subtype: bay
    status: generated
    detect: { kind: bay, at_km: [233.2, 40.8] }
    names: { zh: 卡波湾, en: Capo Bay, art-x-viking: Kapbucht }
    notes:
      zh: 萨科角与卡波角之间的海湾，湾口朝南，面积八十多平方公里。海湾西岸属萨科勒市的萨科区，是渔村和石屋散布的乡间海岸；东岸属贝克勒自由贸易区的卡波区，区内是自贸区的空港与联运物流园，两岸一静一忙。南岸公路以卡波湾跨海大桥越过海湾，大桥长两公里多，是这条领道上最长的桥梁，车过桥面时，常能看到起降的飞机从海湾上空掠过。卡波角上的灯塔和海崖步道是眺望海湾的好去处，贝克勒国际医院也建在湾畔。
      en: The south-facing bay between Cape Sako and Cape Capo, a little over 80 km². Its west shore belongs to Sako District in Sakole, a country coast of fishing villages and stone houses; its east shore belongs to Capo District in the Beckerle Free Trade Zone, home to the zone's airport and intermodal logistics park, so one side is quiet and the other busy. The South Coast Highway crosses the water on the Capo Bay Bridge, a little under 3 km long and the longest bridge on that highway, and drivers on the deck often see aircraft passing low over the bay. The lighthouse and cliff path on Cape Capo are the best places to look out over it, and Beckerle International Hospital stands on the shore.
  - id: nat_xfj32x
    subtype: bay
    status: generated
    detect: { kind: bay, at_km: [246.8, 51.2] }
    names: { zh: 隆迪纳亚湾, en: Rondinaia Bay, art-x-viking: Rondinaiabucht }
    notes:
      zh: 北维京岛东南海岸的大湾，面积四百一十多平方公里，与西面的斯佩基亚拉湾隔着细长的斯瓦尔内斯角半岛并列。湾内暗礁密布，大型船舶必须经斯瓦尔霍尔姆岛与马拉布尔岛之间宽约九公里的斯瓦尔霍尔姆水道进出，马拉布尔岛与斯瓦尔内斯角之间的马拉布尔水道较窄，主要走小船。湾里的离岛和礁石是海燕和燕鸥的繁殖地，每年春夏数以万计的海鸟在礁上筑巢，部分岛礁划为保护区，乘船观鸟是隆迪纳亚区独有的旅游项目。湾畔有隆迪纳亚保税物流园，南岸公路的终点也在湾边；湾口的两座岛屿则属天城市的天台区。
      en: The great bay of the south-east coast, a little over 410 km², lying beside Specchiara Bay to the west with the slender Swallowtail peninsula between them. Its floor is studded with reefs, so large ships must use Svalholm Sound, about 9 km wide between Svalholm and Marrable Island; the narrower Marrable Sound, between Marrable Island and Svalnes, is mostly for small craft. The islets and reefs inside the bay are breeding grounds for storm petrels and terns, and every spring and summer tens of thousands of seabirds nest on the rocks. Some of them are protected, and birdwatching by boat is Rondinaia District's own attraction. The Rondinaia Bonded Logistics Park and the end of the South Coast Highway are on the shore, while the two islands at the mouth belong to Sky Terrace District in Skytown.
  - id: nat_3xvtrb
    subtype: bay
    status: generated
    detect: { kind: bay, at_km: [238.8, 51.8] }
    names: { zh: 斯佩基亚拉湾, en: Specchiara Bay, art-x-viking: Specchiarabucht }
    notes:
      zh: 北维京岛面积最大的海湾，面积四百三十多平方公里，湾口朝南，东面隔着斯瓦尔内斯角半岛与隆迪纳亚湾并列，北端收窄为圆形的柳萨湾。湾内水深浪静，风平时水面如镜，斯佩基亚拉区由此得名。湾顶附近的镜岛与铁岬隔着镜岛水道相望，岛影倒映湾中，是贝克勒自由贸易区的标志景观，也画在自贸区的旗帜上。湾岸是自贸区的心脏：斯佩基亚拉国际金融中心和贝克勒国际商品交易所矗立在湾畔，斯佩基亚拉港停靠游艇和高速客轮，湾外填海建成的保税港区则是集装箱码头和转口加工区。环北维京岛高速从湾北经过，斯佩基亚拉滨海公园的长廊沿湾岸延伸。
      en: "The largest bay on North Viking Island, a little over 430 km², opening to the south, with Rondinaia Bay beside it to the east beyond the Swallowtail peninsula; at its northern end it narrows into the round Ljosa Bay. The water is deep and sheltered and on still days lies as smooth as a mirror, which gave Specchiara District its name, from the Buckham word for mirror. Near the head of the bay Mirror Isle faces Iron Point across Mirror Sound, and its reflection on the water is the sight that stands for the Beckerle Free Trade Zone, drawn on the zone's flag. The shore is the zone's heart: the Specchiara International Finance Centre and the Beckerle International Commodity Exchange stand on the water, Specchiara Port takes yachts and fast ferries, and the Bonded Port Zone, built on reclaimed land outside the bay, holds the container terminals and re-export industries. The ring expressway passes the north of the bay, and the promenade of Specchiara Waterfront Park runs along its shore."
  - id: nat_np7fbj
    subtype: bay
    status: generated
    detect: { kind: bay, at_km: [132.8, 58.2] }
    names: { zh: 牛角湾, en: Oxhorn Bay, art-x-viking: Ochsenhornbucht }
    notes:
      zh: 塔夫鲁普库维克市南端的小海湾，面积约六十平方公里，东侧是牛角岬，西侧是较小的邓莱维角，两岬环抱，湾形弯曲如牛角，因此得名。牛角岬上的灯塔是附近渔船的航标，也标出塔夫鲁普库维克市海岸的最南端。湾岸是普库图克区的林地和木材加工厂，为区里提供了不少就业；湾畔的牛角湾海滨公园有沙滩、草坪和野餐区，夏季是全市居民消暑的去处。海湾水浅浪小，适合游泳和划皮划艇，退潮时滩涂上常有拾贝的家庭。
      en: A small bay at the southern end of Tavrupukkuvik, about 60 km², held between Oxhorn Point on the east and the smaller Cape Dunlevy on the west; its curving shape gives it its name. The lighthouse on Oxhorn Point is a mark for local fishing boats and stands at the southernmost point of the Tavrupukkuvik coast. Woodland and sawmills along the shore of Pukkutuuq District provide a good share of local jobs, and Oxhorn Bay Seaside Park by the water has a beach, lawns and picnic grounds where the whole city comes to cool off in summer. The bay is shallow and sheltered, good for swimming and kayaking, and at low tide families comb the flats for shellfish.
  - id: nat_zn3d92
    subtype: fjord
    status: generated
    detect: { kind: fjord, at_km: [250.8, 62.2] }
    names: { zh: 天台峡湾, en: Sky Terrace Fjord, art-x-viking: Himmelfjord }
    notes:
      zh: "深入天城市天台区的狭长峡湾，长约十九公里（19.2 公里），面积五十多平方公里，台河从马斯林山盆地流下，注入峡湾湾顶，在入湾处切出一级级河岸阶地，阶地上层层排开度假村、公寓式酒店和果园。峡湾两岸是陡峭的山坡和森林，秋天林叶转红，沿岸的步道是天台区赏枫的好去处；东南面是山顶平台状的天台山，这座孤峰海拔 1723 米，天台区和天城市都由它得名，乘登山缆车上山可以俯瞰整条峡湾和海上日出。峡湾水深浪静，天城港就建在峡湾沿岸，夏季客轮从维京港、维京群岛和更远的地方载来度假的游客，游艇和游船在这里停靠，出海观鸟、钓鱼的小游船也从这里出发；天城机场就在附近。夏季的峡湾游船沿岸驶到湾顶，可以看到台河入湾处的阶地和阶地上的度假村，也有人从台河上游划皮划艇顺流而下，一直划进峡湾。\n天城是全岛最湿的城市，一年降水接近两千三百毫米，峡湾上空的云雾常常顺着山坡翻上天台山，又在雨后散开。游船上的导游有个固定节目：雨一停就请大家到甲板上找彩虹，找到的人可以多领一杯热苹果酒。傍晚游船归航时，总有海鸥跟在船尾，等着游客把剩下的面包屑撒进峡湾。"
      en: "A long, narrow fjord reaching into Sky Terrace District of Skytown City, about 19 km long (19.2 km) and a little over 50 km² in area. The Terrace River comes down from the Maslin Mountain basin and enters at the head of the fjord, cutting a flight of river terraces where it meets the water, and resorts, serviced apartments and orchards stand tier upon tier on them. Both shores are steep, wooded slopes; in autumn the leaves turn red and the shoreline paths are Sky Terrace's favourite place to see the autumn colours. To the south-east rises flat-topped Sky Terrace Mountain, a solitary peak 1723 m high that gave its name to both Sky Terrace District and Skytown, and a cable car carries visitors up to look down over the whole fjord and the sunrise over the sea. The fjord is deep and calm, and Skytown Harbour stands on its shore: in summer passenger ships bring holidaymakers from Viking Port, the Viking Islands and further afield, yachts and pleasure boats moor here, and small boats leave for birdwatching and fishing trips; Skytown Airport is close by. Summer cruise boats follow the shore to the head of the fjord, where the terraces and their resorts come into view, and some visitors kayak down the Terrace River all the way into the fjord.\nSkytown is the wettest city on the island, with nearly 2300 mm of rain a year, and mist over the fjord often rolls up the slopes of Sky Terrace Mountain and clears after the rain. The cruise guides have a regular routine: the moment the rain stops they invite everyone on deck to look for a rainbow, and whoever spots one first gets an extra cup of hot cider. When the boats return in the evening, gulls always follow in their wake, waiting for passengers to scatter the last breadcrumbs on the water."
  - id: nat_h1xfkg
    subtype: bay
    status: generated
    detect: { kind: bay, at_km: [236.2, 63.2] }
    names: { zh: 柳萨湾, en: Ljosa Bay, art-x-viking: Ljosabucht }
    notes:
      zh: 斯佩基亚拉湾最北端的圆形海湾，面积六十多平方公里，柳萨河在湾顶的柳萨河口入海。海湾东岸是天城市的天台区，西岸是萨科勒市的铁岗区，环北维京岛高速从湾顶附近经过。柳萨河从马斯林山脉带下的泥沙在河口淤出浅滩和芦苇荡，涨潮时海鸟成群觅食；东岸的沙滩与度假酒店连成一线，是天城最热闹的海滨之一。海湾向南敞向斯佩基亚拉湾，湾口西南侧就是铁岬和镜岛。从岚山森林公园的山顶可以俯瞰整个柳萨湾，远处是马斯林山脉的雪峰。
      en: The round bay at the northern end of Specchiara Bay, a little over 60 km², where the Ljosa River enters at Ljosa Mouth. Its east shore is Sky Terrace District in Skytown and its west shore Iron Knoll District in Sakole, and the ring expressway passes close to its head. Silt carried down from the Maslin Range by the river has built shoals and reed beds at the mouth, where seabirds gather to feed on the rising tide. On the east shore beaches and resort hotels run in an unbroken line, one of the liveliest seafronts in Skytown. To the south the bay opens into Specchiara Bay, with Iron Point and Mirror Isle at the south-west corner of its mouth. From the hilltop in Mist Hill Forest Park you can see the whole bay, with the snow peaks of the Maslin Range beyond.
  - id: nat_w3swqc
    subtype: bay
    status: generated
    detect: { kind: bay, at_km: [297.2, 94.2] }
    names: { zh: 东营湾, en: East Camp Bay, art-x-viking: Ostlagerbucht }
    notes:
      zh: 马斯林山市东海岸最大的海湾，面积两百六十多平方公里，湾口外的布德岛和南侧的金纳尔维克岛替它挡住了外海的风浪。湾岸中部的布德内斯角伸入水中，把海湾分成南北两部分。船只可以从南面经金纳尔维克水道进湾，也可以走布德岛西侧较宽的布德水道，后者宽约六公里，是海湾的主航道。湾内没有商港，全市的货运都经北面的马斯林河口港进出，湾岸因此保持着安静的模样：沙滩、盐沼和防风林沿岸排开，冬季风暴来临时，近海的渔船常进湾避风。东营湾和布德岛是东营区最主要的海岸风景。
      en: "The largest bay on the Maslin Mountain City coast, over 260 km², sheltered from the open sea by Budey off its mouth and Qinnarvik Island to the south. Budnes juts out from the middle of the shore and divides the water into a northern and a southern basin. Ships can come in from the south through Qinnarvik Sound or by the wider Budey Sound west of Budey, about 6 km across and the bay's main fairway. There is no commercial port here: the city's freight passes through the river port at Maslin Mouth further north, so the shore stays quiet, with beaches, salt marsh and shelter belts, and inshore fishing boats run in to wait out winter storms. The bay and Budey are East Camp District's best-known coast."
  - id: nat_nwn6ja
    subtype: bay
    status: generated
    detect: { kind: bay, at_km: [20.2, 98.2] }
    names: { zh: 菲尔内斯湾, en: Fyrnes Bay, art-x-viking: Fyrnesbucht }
    notes:
      zh: 维京港市西海岸的深湾，面积两百平方公里左右，由古冰川刻蚀而成，两岸陡直。湾口南侧是全岛最西端的海门角，海湾大部分属菲尔内斯区。菲尔内斯客运码头和海关大楼建在湾畔，渡轮和邮轮旅客在这里上下船，城市轨道交通也一路通到码头旁。湾内风平浪静，岸边修有长长的滨海步道，岬角顶端保留着烽火台遗址，是看日落和眺望船只进出的好地方。西岸公路沿湾岸北上，从这里通往鹿鸣和寒岭。
      en: A deep inlet on the west coast of Viking Port, about 200 km², carved by ancient glaciers between steep walls. Seagate Cape, the westernmost point of the island, guards the south side of its mouth, and most of the shore belongs to Fyrnes District. The Fyrnes Ferry Terminal and the Fyrnes Customs House stand on the water, where ferry and cruise passengers come and go, and the city's rail lines run right up to the terminal. The bay is usually calm. A long promenade follows the shore, and the remains of a beacon tower on the headland make a fine place to watch the sunset and the ships coming and going. The West Coast Highway follows the shore north from here towards Deersong and the Frost Ridge.
  - id: nat_q138sx
    subtype: fjord
    status: generated
    detect: { kind: fjord, at_km: [33.2, 119.2] }
    names: { zh: 寒岭峡湾, en: Frost Fjord, art-x-viking: Frostfjord }
    notes:
      zh: "北维京岛最长的峡湾，长约四十二公里（41.6 公里），面积近三百平方公里，自西北海岸蜿蜒深入山地，北岸属西北市寒岭区，南岸属鹿鸣区。两岸是冰川刨蚀出的陡峭岩壁，夏季融雪化成一道道瀑布从崖顶直落水面，峡湾深处水面平静如镜，是北维京岛最美的峡湾之一。冬季峡湾口常结海冰，北岸靠近湾口的尼利尔尤阿克角首当其冲，北风从湾口灌入，岬上的岩石结满白霜。寒岭生态研究站长期监测峡湾的水体、海冰和野生动物，在尼利尔尤阿克角设有观测点，记录海冰的形成和消融以及湾口水温的变化，许多大学的野外实习也在这里进行。峡湾游船、皮划艇和沿岸徒步是这里最主要的旅游项目，游船从岬下驶过时，游客能看到崖壁上筑巢的海鸟和顺着崖壁落下的瀑布；沿岸的小镇和村落里住着研究站的职工和渔民，许多人兼营民宿和手工艺。\n寒岭的冬天漫长，极光常常挂在峡湾上空，映在没有封冻的深水里，像天上和水里同时亮起了两道光。划皮划艇的人最爱在峡湾深处喊一声，回声在两岸岩壁之间来回撞上好几次才散去；向导说，夏天瀑布水量最大的时候，回声会被水声吞掉，要等到秋天才能听得清楚。"
      en: "North Viking Island's longest fjord, about 42 km long (41.6 km) and nearly 300 km² in area, winding from the north-west coast deep into the mountains; the north shore belongs to Frost Ridge District of Northwest City and the south shore to Deersong District. Both sides are sheer walls carved by glaciers, and in summer meltwater pours off the clifftops in waterfall after waterfall; deep inside the fjord the water lies still as a mirror, making it one of the most beautiful fjords on the island. In winter sea ice often forms at the mouth, and Cape Nillirjuaq on the north shore near the entrance takes the brunt of it: the north wind funnels in from the sea and frost coats the rocks on the headland. The Frost Ridge Ecological Station has long monitored the fjord's water, sea ice and wildlife, keeping an observation post on Cape Nillirjuaq that records the formation and melting of the ice and the water temperature at the mouth, and many universities run their field courses here. Fjord cruises, kayaking and shoreline hiking are the main attractions; as the boats pass beneath the cape, visitors can see seabirds nesting on the cliffs and waterfalls running down the rock. The small towns and villages along the shore are home to station staff and fishermen, many of whom also run guesthouses and crafts on the side.\nWinters at Frost Ridge are long, and the aurora often hangs over the fjord, reflected in the deep unfrozen water so that two lights seem to shine at once, one in the sky and one in the sea. Kayakers love to shout from deep inside the fjord and hear the echo bounce between the walls several times before it fades; the guides say that in summer, when the waterfalls are at their fullest, the water swallows the echo, and you have to wait until autumn to hear it clearly."
  - id: nat_w7c1m4
    subtype: bay
    status: generated
    detect: { kind: bay, at_km: [87.2, 138.8] }
    names: { zh: 望星湾, en: Stargaze Bay, art-x-viking: Sternwachtbucht }
    notes:
      zh: 西北市北海岸的海湾，面积八十多平方公里，北面有望瓦罗角伸入海中，替海湾挡住外海的风浪，东面远处是较小的瓦罗角。湾内水面平静，冬季长夜里空气清冷、天空澄澈，是北维京岛观赏极光最有名的地方之一。望星天文台建在湾畔的高地上，拥有领地最大的民用光学望远镜，晴朗的夜晚向公众开放；望瓦罗角岬顶还有一座极光观测站。从南面寒岭上的蒂鲁山口山口北望，海湾尽收眼底。湾的西侧是狭长的科罗比湾，夏季鲸群常在两湾之间的海面出没。
      en: A bay on the north coast of Northwest City, a little over 80 km². Cape Stargaze reaches out to the north and breaks the swell of the open sea, and the smaller Cape Varrow lies further east. The water inside is calm, and on long winter nights the air is cold and the sky clear, making this one of the best-known places on North Viking Island to watch the aurora. The Stargaze Observatory stands on high ground by the shore with the territory's largest public optical telescope, open to visitors on clear nights, and there is an aurora station on the crest of Cape Stargaze. From the Tirru Pass pass in the Frost Ridge to the south you look straight down on the bay. To the west lies narrow Corrowby Bay, and in summer whales are often seen in the water between the two.
  - id: nat_akr4q4
    subtype: bay
    status: generated
    detect: { kind: bay, at_km: [81.8, 139.2] }
    names: { zh: 科罗比湾, en: Corrowby Bay, art-x-viking: Corrowbybucht }
    notes:
      zh: "望星湾西侧的狭长海湾，面积五十多平方公里，西岸属寒岭区，东岸属望星区。海湾又深又窄，湾底的冷水上涌带来丰富的磷虾和小鱼，夏季常有小须鲸和座头鲸入湾觅食，鲸鱼浮出水面时，黑色的脊背像一道道礁石。湾岸几乎没有道路和村落，两侧是长满桦树和苔原植物的岩坡，只有观鲸船和科研船偶尔进湾。寒岭生态研究站在湾口设有观测点，记录鲸类的出没和海水温度的变化。观鸟船的船长们说，鲸鱼喷气时会传来一股浓重的鱼腥味，乘客闻到味道就知道鲸鱼近了，有经验的船长甚至能闻出是哪一种鲸。"
      en: "A long, narrow bay west of Stargaze Bay, a little over 50 km², with Frost Ridge District on its west shore and Stargaze District on its east. It is deep and narrow, and cold water welling up from the bottom brings krill and small fish, so in summer minke and humpback whales often come in to feed. When they surface their dark backs lie on the water like a line of reefs. There are almost no roads or villages on its shores, only rocky slopes of birch and tundra, and only whale-watching and research boats come in now and then. The Frost Ridge Ecological Station keeps an observation post at the mouth, recording the whales' visits and the changing temperature of the sea. The whale-boat skippers say a blowing whale gives off a strong fishy smell, passengers know a whale is near the moment they catch it, and the most experienced skippers claim they can tell the species by nose."

  # ── Capes ────────────────────────────────────────────────
  - id: nat_f0ypp1
    subtype: cape
    status: generated
    detect: { kind: cape, at_km: [230.2, 35.2] }
    names: { zh: 萨科角, en: Cape Sako, art-x-viking: Sakokap }
    notes:
      zh: "萨科湾东侧的岬角，也是萨科湾与东面卡波湾之间的分界，伸向南面的大海，是萨科区海岸线上最突出的地方。岬角由坚硬的岩层构成，崖壁陡峭，海浪在崖下切出岩洞和海蚀柱。萨科湾和萨科角是区里的海岸景观，渔船从萨科渔港出海时，要绕过岬角才进入外海。岬上有一条通往崖顶的小路，从崖顶可以同时俯瞰萨科湾的彩色石屋和卡波湾对岸的卡波区。渔船绕过岬角返港时会拉一声汽笛，萨科湾彩色石屋里的人听到就知道渔船平安回来了，渔民的妻子们说这一声汽笛「比什么都好听」。"
      en: "The headland on the east side of Sako Bay, dividing it from Capo Bay to the east and reaching out towards the southern sea, the most prominent point on the Sako District coast. It is built of hard rock with steep cliffs, at whose foot the waves have cut caves and sea stacks. Sako Bay and Cape Sako are the district's coastal scenery, and boats leaving Sako harbour must round the cape to reach open water. A path climbs to the cliff top, from where you can look down on the painted stone houses of Sako Bay on one side and across Capo Bay to Capo District on the other. Fishing boats sound their horns as they round the cape homeward, the people in Sako Bay's painted stone houses know the boats are back safe, and the fishers' families say there is no sweeter sound."
  - id: nat_vj5hej
    subtype: cape
    status: generated
    detect: { kind: cape, at_km: [235.2, 38.2] }
    names: { zh: 卡波角, en: Cape Capo, art-x-viking: Kap Capo }
    notes:
      zh: 贝克勒自由贸易区南岸向南突出的岬角，位于卡波湾东侧，卡波区因此得名，巴克汉姆语中「卡波」就是「海角」的意思。岬角是一道陡峭的海崖，崖顶的灯塔为进出卡波湾和斯佩基亚拉湾的船只导航，海崖步道沿岬缘延伸，可以眺望卡波湾的船只和起降的飞机，是区里最受欢迎的观景点。卡波区是自贸区的空港与联运枢纽，跑道、货运站和物流仓库离岬角不远，海崖风光与繁忙的空港近在咫尺。贝克勒国际医院也建在附近。
      en: A headland jutting south from the Beckerle Free Trade Zone's coast on the east side of Capo Bay. Capo District is named after it; in Buckham "capo" means "cape". The point ends in steep sea cliffs, and the lighthouse on top guides ships in and out of Capo Bay and Specchiara Bay. A cliff path runs round its edge with views of the boats in the bay and the aircraft landing and taking off, the district's favourite lookout. Capo is the zone's airport and intermodal hub, and its runway, cargo terminals and warehouses are not far from the cape, so the wild cliffs and the busy airport are close neighbours. Beckerle International Hospital stands nearby.
  - id: nat_6c66xb
    subtype: cape
    status: generated
    detect: { kind: cape, at_km: [245.2, 54.2] }
    names: { zh: 斯瓦尔内斯角, en: Svalnes, art-x-viking: Svalnes }
    notes:
      zh: 隆迪纳亚区一道细长半岛的末端，半岛分隔西面的斯佩基亚拉湾与东面的隆迪纳亚湾，尖端分叉，形如燕尾，因此得名。岬角外是马拉布尔岛，两者之间是窄窄的马拉布尔水道，小船从这里抄近路进出隆迪纳亚湾。半岛上大多是低矮的岩丘和石楠灌丛，海燕和燕鸥在岬角附近的礁石上筑巢，春夏时节海鸟起落不停。隆迪纳亚湾和斯瓦尔内斯角构成了隆迪纳亚区曲折的海岸线，乘船观鸟的航线常在岬角外绕行。
      en: The tip of the long, slender peninsula in Rondinaia District that divides Specchiara Bay to the west from Rondinaia Bay to the east; its forked end looks like a swallow's tail. Off the point lies Marrable Island, with narrow Marrable Sound between them, a short cut for small boats into Rondinaia Bay. The peninsula is mostly low rocky knolls and heather, and storm petrels and terns nest on the rocks around the point, so in spring and summer the birds come and go all day. Rondinaia Bay and Svalnes make up the district's ragged coastline, and birdwatching boats often round the point.
  - id: nat_qpscw3
    subtype: cape
    status: generated
    detect: { kind: cape, at_km: [271.2, 45.8] }
    names: { zh: 银角, en: Silver Cape, art-x-viking: Silberkap }
    notes:
      zh: "天城市银滩区南端的岬角，两侧是绵延的细白沙滩，银滩区和银角都因沙滩在阳光下闪着银光而得名。岬角本身是一道低矮的花岗岩岬，岩石被海浪磨得圆滑，岬顶有步道和观景台。东北方向不远处，银溪从岚山直落海滨，溪口附近的沙滩格外洁白。夏季银角两侧的沙滩上满是游泳、晒太阳和冲浪的游客，岬角的岩石则是孩子们攀爬和观察潮池生物的地方。潮池里的海星和小螃蟹是孩子们的「朋友」，银滩区的小学每年组织一次「潮池日」，孩子们观察完要把每只小动物放回原处，再跟它们说声再见。"
      en: "The headland at the southern end of Silver Beach District in Skytown, flanked by long beaches of fine white sand; the district and the cape are both named for the way the sand shines silver in the sun. The point itself is a low granite headland, its rocks rounded by the waves, with a path and lookout on top. A little to the north-east the Silver Brook drops from the Mist Hills straight to the shore, and the sand near its mouth is especially white. In summer the beaches on either side are crowded with swimmers, sunbathers and surfers, while children clamber over the rocks of the cape and peer into the rock pools. The starfish and little crabs in the rock pools are the children's friends, and Silver Beach primary schools hold a Rock Pool Day each year, when the children study the creatures, put each one back where they found it and say goodbye."
  - id: nat_ahnx6g
    subtype: cape
    status: generated
    detect: { kind: cape, at_km: [133.8, 55.8] }
    names: { zh: 牛角岬, en: Oxhorn Point, art-x-viking: Ochsenhorn }
    notes:
      zh: 牛角湾东侧的岬角，也是塔夫鲁普库维克市海岸的最南端，与西面的邓莱维角一起把牛角湾环抱成一道弯曲的牛角。岬上的灯塔是附近渔船的航标，灯塔下是一片被海风吹得低伏的草坡和岩礁。从岬顶向北可以望见整片牛角湾和湾畔的海滨公园，向南则是开阔的外海。岬角附近海域水流较急，渔民习惯对着灯塔的方向进出海湾。普库图克区居民周末常沿湾岸步道走到岬角，在灯塔下野餐、看海。
      en: The headland on the east side of Oxhorn Bay and the southernmost point of the Tavrupukkuvik coast; with Cape Dunlevy to the west it curls the bay into the shape of a horn. Its lighthouse is a mark for local fishing boats, standing above windswept grass and rock. From the top you look north over the whole bay and the seaside park on its shore, and south to the open sea. The current runs fast off the point, and fishermen steer by the lighthouse going in and out. People from Pukkutuuq District often walk out along the shore path at the weekend to picnic and watch the sea below the light.
  - id: nat_xyxtqa
    subtype: cape
    status: generated
    detect: { kind: cape, at_km: [130.2, 58.2] }
    names: { zh: 邓莱维角, en: Cape Dunlevy, art-x-viking: Kap Dunlevy }
    notes:
      zh: "牛角湾西侧较小的岬角，与东面的牛角岬遥遥相对，像大牛角旁的一只小犊角。岬角低矮平缓，伸入海中不远，四周是浅滩和礁石，退潮时可以步行到岬尖。岬上没有灯塔，只有一座小小的石砌航标，夏季常有普库图克区的家庭在这里拾贝、钓鱼和露营。邓莱维角与牛角岬之间的海湾水浅浪小，是附近居民学游泳和划皮划艇的地方，傍晚时分，夕阳正好落在岬角背后的海面上。普库图克的人说，邓莱维角是牛角岬的「小牛犊」，大人在大岬角钓鱼，孩子们就在小岬角学游泳，许多人第一次游泳、第一次钓到鱼都是在这里。"
      en: "The smaller headland on the west side of Oxhorn Bay, facing Oxhorn Point across the water like a calf's horn beside a bull's. It is low and gentle and does not reach far out to sea; shallows and rocks surround it, and at low tide you can walk out to its tip. There is no lighthouse, only a small stone beacon, and in summer families from Pukkutuuq District come here to gather shellfish, fish and camp. The shallow, sheltered water between Cape Dunlevy and Oxhorn Point is where local people learn to swim and paddle, and in the evening the sun sets into the sea just behind the point. Pukkutuuq people call Cape Dunlevy the calf beside the great horn: the grown-ups fish from the big cape and the children learn to swim at the small one, and many first swims and first fish happen here."
  - id: nat_kz388s
    subtype: cape
    status: generated
    detect: { kind: cape, at_km: [236.2, 59.8] }
    names: { zh: 铁岬, en: Iron Point, art-x-viking: Eisenspitze }
    notes:
      zh: 铁岗区伸入斯佩基亚拉湾北部的岩岬，与南面的镜岛隔着只有两公里宽的镜岛水道相望。岬角的岩石和铁岗山一样富含铁质，岩面被海水和雨水浸出铁锈般的红褐色，夕阳下格外醒目，岬名由此而来。北面不远就是柳萨湾和柳萨河口。镜岛水道水浅流缓，岬下的浅滩是贝类和小鱼聚集的地方，周末常有人来垂钓。站在岬尖，可以看见远处斯佩基亚拉国际金融中心的双塔，以及倒映在湾面上的镜岛。
      en: A rocky point of Iron Knoll District reaching into the north of Specchiara Bay, facing Mirror Isle to the south across Mirror Sound, only 2 km wide. Like Iron Knoll itself, its rock is rich in iron, and rain and sea have stained it a rusty red-brown that glows in the evening sun, hence its name. Ljosa Bay and the Ljosa River mouth lie a short way north. Mirror Sound is shallow and slow-moving, and the shoals below the point attract shellfish, small fish and, at weekends, anglers. From the tip you can see the twin towers of the Specchiara International Finance Centre in the distance and Mirror Isle reflected in the bay.
  - id: nat_59166f
    subtype: cape
    status: generated
    detect: { kind: cape, at_km: [296.2, 93.8] }
    names: { zh: 布德内斯角, en: Budnes, art-x-viking: Budnes }
    notes:
      zh: "东营湾内的岬角，从湾岸中部伸入水中，把海湾分成南北两部分。岬角低平，四周是沙嘴和盐沼，涨潮时海水漫过岬根的滩地，落潮后又露出大片泥滩，涉禽和野鸭在这里觅食。岬尖立着一座航标灯，指引渔船避开岬外的浅滩。南面的湾区较浅，靠近金纳尔维克水道；北面的湾区较深，对着布德水道，是进出东营湾的主航线所在。岬上的步道是东营区居民观鸟和看日出的地方。春秋两季候鸟过境时，岬上的步道挤满了举着长焦镜头的观鸟者，东营区的面包店会在那几周推出一种鸟形的小面包，叫「过路鸟」。"
      en: "A point inside East Camp Bay, reaching out from the middle of the shore and dividing the bay into a northern and a southern basin. It is low and flat, edged with sand spits and salt marsh; at high tide the sea floods the flats at its root, and at low tide wide mudflats appear where waders and wild duck feed. A beacon on the tip keeps fishing boats off the shoals beyond it. The southern basin is shallower and lies towards Qinnarvik Sound; the northern basin is deeper and faces Budey Sound, the main way in and out of the bay. The path along the point is where East Camp people come to watch birds and the sunrise. When the migrants pass through in spring and autumn the cape's path is lined with long lenses, and East Camp's bakeries bring out a little bird-shaped bun for those weeks, called the \"passing bird\"."
  - id: nat_5seexw
    subtype: cape
    status: generated
    detect: { kind: cape, at_km: [16.2, 96.2] }
    names: { zh: 海门角, en: Seagate Cape, art-x-viking: Seetorkap }
    notes:
      zh: 北维京岛的最西端，岬角伸入西海，菲尔内斯湾在它的北侧，海门区以它为「通往西海之门」而得名。角上的灯塔与观景平台可以眺望进出菲尔内斯湾的船只，晴天时西面是一望无际的大海，这里也是全岛最晚看到日落的地方之一。岬角两侧的海岸修有自行车道和沙滩，向南连着海门区的滨海商务带，玻璃幕墙的写字楼与岬角的老灯塔隔水相望。西岸公路纵贯海门区，北上菲尔内斯，南下瓦尔维克。
      en: The westernmost point of North Viking Island, a headland reaching into the western sea with Fyrnes Bay on its north side; Seagate District is named after this "gate to the western sea". The lighthouse and viewing platform on the cape look over the ships entering and leaving Fyrnes Bay, and on clear days there is nothing to the west but open ocean; it is one of the last places on the island to see the sun go down. Cycle paths and beaches run along the shore on either side, and to the south the point joins Seagate's waterfront business belt, so glass office towers and the old lighthouse face each other across the water. The West Coast Highway runs the length of the district, north to Fyrnes and south to Walvik.
  - id: nat_ke9p9y
    subtype: cape
    status: generated
    detect: { kind: cape, at_km: [31.8, 122.2] }
    names: { zh: 尼利尔尤阿克角, en: Cape Nillirjuaq, art-x-viking: Kap Nillirjuaq }
    notes:
      zh: "寒岭峡湾北岸的岬角，靠近峡湾口，冬季常被海冰包围，岬上的岩石结满白霜，因此得名。岬角是一道陡峭的岩壁，崖顶长着低矮的桦树和苔原植物，冬季北风从峡湾口灌入，岬角首当其冲。寒岭生态研究站在岬上设有一处观测点，记录海冰的形成和消融以及峡湾口水温的变化。夏季峡湾游船从岬下驶过，游客可以看到崖壁上筑巢的海鸟和顺着崖壁落下的瀑布。研究站的观测员冬天要在岬上值守好几天，屋里只有一台收音机和一壶咖啡，他们说在这里听北风吹过崖壁，「像在听一首永远不会结束的歌」。"
      en: "A point on the north shore of Frost Fjord near its mouth, often hemmed in by sea ice in winter, when its rocks are furred with hoar frost, which gives it its name. It is a steep rock wall topped by dwarf birch and tundra plants, and when the north wind funnels into the fjord in winter, the point takes the full force. The Frost Ridge Ecological Station keeps an observation post here, recording how the sea ice forms and breaks up and how the water temperature changes at the mouth of the fjord. In summer the fjord cruise boats pass beneath it, and passengers can see seabirds nesting on the cliffs and waterfalls spilling down the rock. The station's observers keep watch on the cape for days at a stretch in winter with only a radio and a pot of coffee, and they say the north wind across the cliffs is \"like a song that never ends\"."
  - id: nat_p20bak
    subtype: cape
    status: generated
    detect: { kind: cape, at_km: [134.2, 131.8] }
    names: { zh: 勒克尔维克角, en: Lekorvik Cape, art-x-viking: Lekorvikkap }
    notes:
      zh: 勒克尔市北海岸的岬角，伸入北部海域，是勒克尔维克区海岸的标志。岬角附近有一座小港，港湾受岬角庇护，冬季不冻，勒克尔丘陵和河谷出产的粮食和奶制品从这里装船外运，近海的渔船也在此停靠卸货。岬上是开阔的草坡和低矮的海崖，夏季牛羊一直放牧到岬顶，冬季北风强劲，浪花常拍上崖顶。勒克尔维克区是北河公路的终点、卡蒂尔尤阿克高速的起点，也是自勒高速铁路的终点，岬角和小港是区里看海的去处。
      en: A headland on the north coast of Lekor, reaching out into the northern sea and the landmark of Lekorvik's shoreline. A small harbour sheltered by the point stays ice-free in winter; grain and dairy produce from the Lekor hills and valleys are shipped from here, and inshore fishing boats land their catch. The point itself is open grassland above low sea cliffs, grazed by cattle and sheep right to the tip in summer, while in winter the north wind drives spray over the cliff tops. Lekorvik is where the North River Highway ends, the Katirjuaq Expressway begins and the Freedom City–Lekor High-Speed Railway terminates, and the point and its harbour are where the district goes to look at the sea.
  - id: nat_j3fyfr
    subtype: cape
    status: generated
    detect: { kind: cape, at_km: [102.8, 138.2] }
    names: { zh: 瓦罗角, en: Cape Varrow, art-x-viking: Kap Varrow }
    notes:
      zh: "望星区东部的岬角，位于望星湾以东，比西面的望瓦罗角低矮，是一片伸入海中的平缓岩岬。岬角远离城镇和道路的灯光，夜空格外黑暗，晴朗的冬夜里银河和极光都清晰可见，望星天文台的观测者和摄影爱好者常到这里拍摄星空。岬上没有建筑，只有几处石砌的观星平台和避风矮墙。夏季岬角周围的海面上常有海鸟成群觅食，退潮时礁石间可以捡到贝壳和海星。观星平台上的石墙是天文爱好者们一块块垒起来的，每块石头背后都刻着垒石人的名字缩写，望星区的人说，这道墙是「星星看着长高的」。"
      en: "A point in the east of Stargaze District, beyond Stargaze Bay; lower than Cape Stargaze to the west, it is a gentle tongue of rock running out into the sea. Far from the lights of towns and roads, it has an especially dark sky, and on clear winter nights the Milky Way and the aurora stand out sharply; observers from the Stargaze Observatory and astrophotographers often come here. There are no buildings, only a few stone viewing platforms and low walls against the wind. In summer seabirds feed in flocks off the point, and at low tide shells and starfish can be found among the rocks. The stargazers built the platforms' stone walls one stone at a time, each carved on the back with its builder's initials, and Stargaze people say the wall \"grew up under the stars' gaze\"."
  - id: nat_m9w71f
    subtype: cape
    status: generated
    detect: { kind: cape, at_km: [89.2, 142.2] }
    names: { zh: 望星角, en: Cape Stargaze, art-x-viking: Sternwachtkap }
    notes:
      zh: 西北市北海岸最突出的岬角，向北伸入大海，替南面的望星湾挡住外海的风浪。岬顶是开阔的石质高地，建有一座极光观测站，常年记录极光和高空大气的变化，晴朗的冬夜也向游客开放观测平台。望星湾和望瓦罗角是望星区最有名的海岸风景，海湾平静、夜空清澈，是北维京岛观测极光的热门地点。从岬顶回望，南面是寒岭的雪峰和蒂鲁山口山口，西面是狭长的科罗比湾，夏季常能看到鲸鱼在海面喷水。
      en: The most prominent headland on Northwest City's north coast, reaching north into the sea and shielding Stargaze Bay to its south from the swell. Its crest is open, stony upland with an aurora station that records the aurora and the changes of the upper atmosphere all year; on clear winter nights its viewing platform is open to visitors. Stargaze Bay and Cape Stargaze are Stargaze District's best-known coast, a calm bay under a clear sky and one of North Viking Island's favourite places to see the aurora. Looking back from the crest you see the snow peaks of the Frost Ridge and the Tirru Pass pass to the south, and narrow Corrowby Bay to the west, where whales can often be seen blowing in summer.

