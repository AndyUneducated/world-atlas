# Rivers, river mouths and lakes of North Viking Island found by the generator.
# Rivers and estuaries are matched by the position of their mouth (`detect.at_km`, design km);
# the three rivers named through a division live in cn-nv-natural.yaml.
features:
  # ── Rivers (largest first) ───────────────────────────────
  - id: nat_qt12rq
    subtype: river
    status: generated
    detect: { kind: river, at_km: [281.8, 114.2] }
    names: { zh: 马斯林河, en: Maslin River, art-x-viking: Maslinfluss }
    notes:
      zh: "马斯林山盆地的主河，全长一百八十多公里（185.3 公里），流域面积一万八千多平方公里。马斯林河发源于盆地西部的西坪区，汇集马斯林山脉北、西、南三面流下的众多溪流，雅尔斯托尔冰原南坡的融水也流入其中，向东流过市政中心和平区，再穿过东部的海岸平原，在星港区与东营区之间入海。盆地里的河段水流平缓，马斯林山高速、雪谷公路和西岭公路都在河谷中经过，马斯林山高速的和平高架桥跨过城区和马斯林河，马斯林山军医院就在河边；下游的东营区是全市的后勤和航空保障基地。河口的马斯林河口港是全市唯一的港口，驻军物资和大型航天部件都从这里上岸，大部分部件再由马斯林山航天高速铁路从东营站转运到西坪发射场。马斯林山三面环山，是全岛降水最少的城市，一年只有八百多毫米，河谷里晴天多、夏天暖，七月午后常在二十度以上，河边的草地是驻地家庭夏天野餐的去处。\n河口港卸下超出铁路限界的特大航天部件时，部件要在夜里用特种车沿河谷慢慢运进盆地，沿途的居民会站在路边看「巨物夜行」，孩子们追着车队跑上好一段。第二天，和平区的学校里总有孩子在作文里写：昨晚，一枚火箭从我家门口经过。"
      en: "The main river of the Maslin Mountain basin, more than 180 km long (185.3 km) with a catchment of over 18,000 km². The Maslin rises in West Heath District in the west of the basin and gathers the many streams coming down from the north, west and south walls of the Maslin Range, including meltwater from the south slope of the Jarlstol Icefield. It flows east through Peace District, the civic centre, then across the coastal plain to the east, reaching the sea between Starport and East Camp districts. In the basin it flows gently; the Maslin Expressway, the Snow Valley Highway and the West Ridge Highway all run along the valley, the Maslin Expressway's Peace Viaduct crosses the town and the river, and the Maslin Mountain Military Hospital stands on the bank. East Camp on the lower river is the city's logistics and air-support base. The Maslin Mouth Port at the river mouth is the city's only port, where garrison supplies and large aerospace components come ashore, most of the components then going on by the Maslin Mountain Aerospace High-Speed Railway from East Camp Station to the West Heath launch site. Ringed by mountains on three sides, Maslin Mountain is the driest city on the island, with only a little over 800 mm of rain a year; the valley gets many sunny days and warm summers, July afternoons are often above 20 degrees, and the riverside meadows are where garrison families picnic in summer.\nWhen the port unloads an outsize component too big for the railway, it is moved slowly up the valley into the basin by special vehicles at night, and people along the way stand by the road to watch \"the giant's night walk\" while children chase the convoy for a good stretch. The next day there is always a child at a Peace District school who writes in an essay: last night a rocket went past my front door."
  - id: nat_bpjv97
    subtype: river
    status: generated
    detect: { kind: river, at_km: [208.8, 148.8] }
    names: { zh: 阿恩萨河, en: Arnsa River, art-x-viking: Arnsafluss }
    notes:
      zh: "雅利基卢克河以东的一条河流，全长七十多公里（73.7 公里），流域面积三千七百多平方公里，发源于尼尔萨利特牧区的高原，向西北穿过台地边缘的峡谷，在雅利基卢克市基卢克维克区注入北部海域。上游峡谷两侧是陡峭的岩壁，海雕在崖顶筑巢，常在河谷上空盘旋，河名由此而来。中游以下河谷开阔，是尼尔萨利特牧民冬季放牧的谷地，环北维京岛高速和雅利基卢克河公路都在下游跨过阿恩萨河。河口两侧是砾石滩和沼泽，秋季有鲑鱼洄游，基卢克维克区的渔民在河口设网捕捞。基卢克维克区常住人口约一万，基卢克维克集镇是全市唯一的城镇，镇上每周一次的集市上常能买到阿恩萨河口的鲑鱼和驯鹿肉干，居民以维京语为母语，许多家庭世代在河边耕种和捕鱼。阿恩萨河峡谷人迹罕至，是北维京岛观察猛禽的好地方，夏季白夜里也能看见海雕在峡谷上空巡飞，冬季河谷上空常挂着极光。\n观鸟的人在峡谷口一守就是一整天，基卢克维克的老渔民却说，想看海雕不用等，秋天跟着鲑鱼走就行：鲑鱼一进河口，海雕就从峡谷里飞下来，和渔民抢同一片水面。渔民们有个不成文的规矩，每年收的第一网鲑鱼要留一条放在河口的石头上，说是给海雕的「过路费」。"
      en: "A river east of the Jaalikiluk, over 70 km long (73.7 km) with a catchment of more than 3700 km². It rises on the plateau of the Nirsaliit Pastoral District, cuts north-west through a gorge at the edge of the plateau and reaches the northern sea in Kilukvik District of Jaalikiluk City. The upper gorge is walled with sheer cliffs where sea eagles nest on the tops and often circle over the valley, which gave the river its name. Below its middle reaches the valley opens out into the winter grazing grounds of the Nirsaliit herders, and the North Viking Island Ring Expressway and the Jaalikiluk River Highway both cross the lower river. Gravel banks and marsh flank the mouth, salmon run up in autumn, and fishermen from Kilukvik set nets in the estuary. Kilukvik District has about 10,000 permanent residents, and Kilukvik town, the only town in the city, holds a weekly market where salmon from the Arnsa mouth and dried reindeer meat are often on sale; the people speak Viking as their first language and many families have farmed and fished by the river for generations. The Arnsa gorge is seldom visited and one of the best places on North Viking Island to watch birds of prey: on summer white nights the sea eagles can still be seen patrolling above the gorge, and in winter the aurora often hangs over the valley.\nBirdwatchers will wait all day at the mouth of the gorge, but Kilukvik's old fishermen say there is no need to wait for the eagles: in autumn just follow the salmon. As soon as the fish enter the estuary the eagles come down from the gorge to fish the same stretch of water as the men. The fishermen have an unwritten rule that one salmon from the year's first net is left on a rock at the mouth as the eagles' \"toll\"."
  - id: nat_34dfkf
    subtype: river
    status: generated
    detect: { kind: river, at_km: [235.8, 64.8] }
    names: { zh: 柳萨河, en: Ljosa River, art-x-viking: Ljosafluss }
    notes:
      zh: "发源于马斯林山脉西翼东坡的河流，全长近八十公里（77.5 公里），流域面积六千七百多平方公里。柳萨河的源头在雅利基卢克市阿基尼克区的高山上，向东南流过马斯林山盆地西南部的西坪区，再穿过南翼的山地，沿萨科勒市铁岗区与天城市天台区之间南下，在柳萨河口注入斯佩基亚拉湾北端的柳萨湾。柳萨湾是一座六十多平方公里的圆形海湾，东岸是天台区的沙滩与度假酒店，西岸是铁岗区，湾口西南侧就是铁岬和镜岛。河水从马斯林山脉带下的泥沙在河口淤出浅滩和芦苇荡，涨潮时海鸟成群觅食；下游两岸一边是天城的度假区，一边是铁岗的旧矿区和铁岗矿业博物馆，旧矿坑和选矿厂与对岸的酒店隔水相望。环北维京岛高速和东岸公路都在下游跨过柳萨河，河口的木栈道和观鸟台是天城难得的自然湿地，天台国际会议中心的落地窗也正对着柳萨湾。\n天城一年里雨水多，雨后柳萨湾上空常挂起彩虹，河口观鸟台上的人说，彩虹的一头总像是落在芦苇荡里。秋天河口的贻贝最肥，天城海滨酒店露台上的柳萨湾贻贝配薯条卖得最好，铁岗下了夜班的工人也爱过桥来吃一盘，再就着一杯冰镇苹果酒看潮水退去。"
      en: "A river rising on the eastern slopes of the western arm of the Maslin Range, nearly 80 km long (77.5 km) with a catchment of more than 6700 km². The Ljosa rises high in the mountains of Aaqqiniq District of Jaalikiluk City, flows south-east through West Heath District in the south-west of the Maslin Mountain basin, crosses the hills of the southern arm and runs south between Iron Knoll District of Sakole and Sky Terrace District of Skytown, entering Ljosa Bay at the northern end of Specchiara Bay through the Ljosa Mouth. Ljosa Bay is a round bay of a little over 60 km², with the beaches and resort hotels of Sky Terrace on its east shore and Iron Knoll on its west; off its south-western mouth lie Iron Point and Mirror Isle. Silt carried down from the Maslin Range has built shoals and reed beds at the mouth, where seabirds feed in flocks on the rising tide. On the lower river one bank is Skytown's resort district and the other Iron Knoll's old mining area and the Iron Knoll Mining Museum, old pits and the ore-dressing plant facing the hotels across the water. The North Viking Island Ring Expressway and the East Coast Highway both cross the lower river, the boardwalks and bird hides at the mouth are a rare natural wetland for Skytown, and the floor-to-ceiling windows of the Sky Terrace International Convention Centre look straight out on Ljosa Bay.\nSkytown gets plenty of rain, and after it a rainbow often hangs over Ljosa Bay; people in the bird hides at the mouth say one end always seems to come down in the reed beds. In autumn the mussels at the mouth are at their plumpest, Ljosa Bay mussels and chips are the best seller on the terraces of Skytown's seafront hotels, and workers off the night shift at Iron Knoll like to cross the bridge for a plate, with a cold cider, while they watch the tide go out."
  - id: nat_xwk44c
    subtype: river
    status: generated
    detect: { kind: river, at_km: [113.2, 133.8] }
    names: { zh: 勒河, en: Lek River, art-x-viking: Lekfluss }
    notes:
      zh: "勒克尔市的主要河流，全长七十公里左右（69.0 公里），流域面积近四千平方公里。勒河发源于塔夫鲁普库维克市西加维克区的丘陵，向北流经勒克尔市的科恩达尔区，在勒克尔维克区注入北部海域。中游的科恩达尔土壤肥沃、日照充足，是北维京岛唯一成规模的葡萄酒产区，科恩达尔酒庄和数十家家庭酒庄沿向阳坡地种植耐寒的葡萄，酿造白葡萄酒、冰酒和苹果酒，谷地里还有大片果园、蔬菜田和蜂场；科恩达尔丰收广场是每年秋天勒克尔丰收节的主会场，农产品评比、民族舞蹈、拖拉机巡游和篝火晚会都在这里举行。下游的勒克尔维克区是全岛的粮仓和奶源地之一，麦田和牧场沿河谷铺开，北岸勒克尔维克角附近的小港冬季不冻，出口粮食和奶制品。勒河水流平缓，夏季常有人划独木舟顺流而下，河边的乡村旅馆和农家餐厅接待着来自首府和维京港的周末游客。两岸居民以维京语为主要母语，许多家庭世代务农。\n秋天丰收节开幕那天，自由市、西北市、塔夫鲁普库维克和洛龙山各派一辆彩车「回娘家」，勒河两岸的村民站在桥头看车队过河。科恩达尔的酒庄用耐寒葡萄酿出带苹果香的白葡萄酒，冬天烫热了加香料喝，河边的农家餐厅总配一盘撒满盐粒的硬奶酪和烤猪肘。"
      en: "Lekor City's main river, about 70 km long (69.0 km) with a catchment of nearly 4000 km². The Lek rises in the hills of Siggavik District in Tavrupukkuvik City, flows north through Korndal District of Lekor and reaches the northern sea in Lekorvik District. Korndal on the middle river has fertile soil and plenty of sun and is North Viking Island's only wine region of any size: the Korndal Winery and dozens of family wineries grow hardy grapes on the sunny slopes to make white wine, ice wine and cider, and the valley also holds broad orchards, vegetable fields and apiaries. Korndal Festival Square is the main venue of the Lekor Harvest Festival each autumn, with produce competitions, folk dancing, a tractor parade and bonfire evenings. Lekorvik on the lower river is one of the island's granaries and dairy regions, with wheat fields and pastures spread along the valley, and the small harbour near Lekorvik Cape on the north coast stays ice-free in winter and ships grain and dairy produce. The Lek flows gently, in summer people often canoe downstream, and riverside country inns and farm restaurants welcome weekend visitors from the capital and Viking Port. People on both banks mostly speak Viking as their first language, and many families have farmed here for generations.\nOn the opening day of the autumn harvest festival, Freedom City, Northwest, Tavrupukkuvik and Lorond Mountain each send a float \"home to the old family house\", and villagers on both banks of the Lek gather at the bridgeheads to watch the convoy cross. Korndal's wineries make an apple-scented white from hardy grapes that is drunk hot and spiced in winter, and the riverside farm restaurants always serve it with a plate of hard, salt-crusted cheese and roast pork knuckle."
  - id: nat_sh3rkk
    subtype: river
    status: generated
    detect: { kind: river, at_km: [247.8, 66.2] }
    names: { zh: 台河, en: Terrace River, art-x-viking: Terrassenfluss }
    notes:
      zh: "发源于马斯林山盆地西坪区的河流，全长五十多公里（56.4 公里），流域面积三千八百多平方公里。台河向东南流过雪谷区的边缘，进入天城市的天台区，在阶地间蜿蜒而下，注入天台峡湾的湾顶。下游河段在天台区切出一级级河岸阶地，阶地上层层排开度假村、公寓式酒店和果园，夏季可以划皮划艇顺流到峡湾，峡湾游船也常开到湾顶，让游客从水上看这片阶地。天台峡湾水深浪静，沿岸的天城港停靠来自维京港和维京群岛的客轮，天台山就在峡湾东南面。环北维京岛高速和东岸公路都在下游跨过台河，雪谷公路也从天台出发，沿河谷附近向西深入马斯林山。上游的西坪区是维京-马斯林山发射与降落中心所在的高原台地，周围是火箭总装、推进剂和飞船整修工厂，河谷两侧是高山草甸，与下游的度假区风光迥异：一头是航天工程师，一头是来度假的游客和退休移居的老人。\n每逢发射日，台地上空的火箭尾焰在数十公里外都能看到，阶地上的度假村会提前在露台上摆好躺椅，客人们端着咖啡等倒计时。果园的老农说，台河的水从发射场那边流下来，所以这里的苹果「沾了点火箭的劲儿」，格外脆甜。"
      en: "A river rising in West Heath District in the Maslin Mountain basin, a little over 50 km long (56.4 km) with a catchment of more than 3800 km². The Terrace River flows south-east along the edge of Snow Valley District into Sky Terrace District of Skytown City, winding down between terraces to enter the head of Sky Terrace Fjord. On its lower course it has cut a flight of river terraces in Sky Terrace, where resorts, serviced apartments and orchards stand tier upon tier; in summer you can kayak downstream into the fjord, and fjord cruise boats often run to the head so passengers can see the terraces from the water. Sky Terrace Fjord is deep and calm, Skytown Harbour on its shore receives passenger ships from Viking Port and the Viking Islands, and Sky Terrace Mountain rises south-east of the fjord. The North Viking Island Ring Expressway and the East Coast Highway both cross the lower river, and the Snow Valley Highway also starts from Sky Terrace and heads west into the Maslin mountains near the valley. Upstream, West Heath is the plateau of the Viking–Maslin Mountain Launch and Landing Centre, surrounded by rocket assembly, propellant and spacecraft refurbishment plants, with alpine meadows on either side of the valley, a world away from the resorts downstream: aerospace engineers at one end, holidaymakers and retired incomers at the other.\nOn launch days the rocket plume above the plateau can be seen from tens of kilometres away, and the resorts on the terraces set out loungers on their terraces in advance so guests can await the countdown with coffee in hand. Old orchard farmers say that because the Terrace River flows down from the launch site, their apples \"have a bit of rocket in them\", which is why they are so crisp and sweet."
  - id: nat_8va6kk
    subtype: river
    status: generated
    detect: { kind: river, at_km: [270.8, 124.8] }
    names: { zh: 蒂鲁基卢克河, en: Tirrukiluk River, art-x-viking: Tirrukilukfluss }
    notes:
      zh: "马斯林山市星港区的主要河流，全长二十六公里（26.2 公里），流域面积两千多平方公里，全程都在星港区内。河口就是星港，这座航天港拥有发射工位和着陆场，发射台面向大海，星港区由此得名。星港区是深空太空军马斯林山指挥中心的驻地，河口周围是星港指挥中心、星港深空测控站、星港发动机试车台、星港防空阵地和星港海岸雷达站等设施，试车时的轰鸣声在河谷里回荡数十公里，大部分河段属军事管理区，不对公众开放。区内常住人口约两万二千，绝大多数是军人、航天工程师和他们的家属，街道以航天器和星座命名。环北维京岛高速在下游跨过蒂鲁基卢克河，从桥上能远远望见河口的发射台和测控站的大口径天线。星港航天博物馆是区里唯一向公众常年开放的设施，展出退役的火箭、返回舱和深空探测器模型，每逢发射日，都有大批游客和航天爱好者前来。\n河谷上游人迹罕至，只有巡逻车和测控站的检修人员偶尔经过。星港的工程师们说，蒂鲁基卢克河是全岛「最懂火箭的河」：每次发射，尾焰的倒影从河口一路映到上游的水面，下游的水鸟早已习惯，只在点火那一瞬间齐齐飞起，等轰鸣声远去又落回原处。"
      en: "The main river of Starport District in Maslin Mountain City, 26 km long (26.2 km) with a catchment of more than 2000 km², flowing entirely within the district. At its mouth is Starport, a spaceport with launch pads and landing zones whose pads face the sea, which gave the district its name. Starport District is the seat of the Deep Space Force's Maslin Mountain Command Centre, and around the mouth stand the Starport Command Centre, the Starport Deep Space Station, the Starport Engine Test Stands, the Starport Air Defence Site and the Starport Coastal Radar Station; the roar of engine tests echoes for tens of kilometres up the valley. Most of the river lies within a military zone closed to the public. About 22,000 people live in the district, nearly all servicemen and women, aerospace engineers and their families, and its streets are named after spacecraft and constellations. The North Viking Island Ring Expressway crosses the lower river, and from the bridge the launch pads at the mouth and the great dishes of the tracking station can be seen in the distance. The Starport Space Museum is the only facility in the district open to the public all year, showing retired rockets, return capsules and models of deep-space probes, and on launch days crowds of visitors and space enthusiasts arrive.\nThe upper valley is almost untouched, visited only by patrol vehicles and maintenance crews from the tracking station. Starport's engineers call the Tirrukiluk \"the river that knows rockets best\": at every launch the reflection of the plume runs up the water from the mouth, and the waterbirds downstream, long used to it, rise together only at the moment of ignition and settle again once the roar has faded."
