    names: { zh: 瓦尔河, en: Wal River, art-x-viking: Walfluss }
    notes:
      zh: "维京港市瓦尔维克区的短河，全长二十多公里（23.0 公里），流域面积三千一百多平方公里，在维京港市西南部的瓦尔维克区入海。河名与区名同源，瓦尔维克在维京语中意为「鲸湾」，这里是旧时捕鲸站所在的海湾，维京港这座城市就是从湾畔的捕鲸站和格约特斯塔德的维京石垒起源的。河流下游早已被城市包围，两岸是堤岸、公园和老港工住宅，入海处附近是鲸湾港的码头和临港产业带，船舶修理厂、冷链仓库和机械工厂一直排到河口。鲸湾捕鲸站博物馆保留着旧捕鲸站的砖砌炼油房、绞盘和捕鲸船，讲述城市的起源。瓦尔维克如今是维京港人口最多的区，人口约三十一万，也是领地最大的港区，码头和市场上最常听到的是维京语。维京港一年降水将近一千九百毫米，瓦尔河常年水量充沛，如今两岸修有滨河绿道，是瓦尔维克居民在港区之外难得的一片绿地。\n港口夜班让瓦尔维克几乎不睡觉，绿道却是区里最安静的地方：清晨下了夜班的码头工人沿着河边走回家，常能看见苍鹭站在浅滩上一动不动。老港工们爱说，瓦尔河的水最后都流进了鲸湾港，所以港里的船「喝的都是瓦尔维克的水」；夏天河边的老人们一边钓鱼，一边用维京语争论今年的鲱鱼是不是比去年肥。"
      en: "A short river in Walvik District of Viking Port City, a little over 20 km long (23.0 km) with a catchment of more than 3100 km², reaching the sea in Walvik in the south-west of the city. River and district share a name: Walvik means \"whale bay\" in Viking, the bay where the old whaling station stood, and Viking Port itself grew from that whaling station and the Viking stone fort at Grjotstad. The lower river has long been surrounded by the city, its banks lined with embankments, parks and old dockworkers' housing, and near the mouth are the quays of Walvik Harbour and the waterfront industrial belt, with ship repair yards, cold stores and machinery works running right down to the river mouth. The Walvik Whaling Station Museum keeps the old station's brick try-works, capstans and whaling boats and tells the story of how the city began. Walvik is now Viking Port's most populous district, with about 310,000 people, and the territory's largest port area, and Viking is the language heard most on its quays and in its markets. Viking Port gets nearly 1900 mm of rain a year and the Wal runs full all year round; today both banks have a riverside greenway, a rare stretch of green in Walvik outside the port.\nNight shifts keep Walvik almost permanently awake, but the greenway is the quietest place in the district: dockers walking home along the river after the night shift often see a heron standing motionless in the shallows. Old dock hands like to say that all the Wal's water ends up in Walvik Harbour, so the ships there \"all drink Walvik water\"; in summer the old men fishing along the bank argue in Viking about whether this year's herring are fatter than last year's."
  - id: nat_g46cfd
    subtype: river
    status: generated
    detect: { kind: river, at_km: [256.8, 136.8] }
    names: { zh: 圣梅林河, en: Saint-Merrin River, art-x-viking: Saint-Merrin-Fluss }
    notes:
      zh: "马斯林山市星港区东北海岸的短河，全长十五公里（15.3 公里），流域面积一千四百多平方公里，从海岸丘陵上急泻而下，向东北注入北部海域。河道短而陡，多急流和浅滩，每年秋季鲑鱼从海里逆流而上，跃过一道道岩坎到上游的砾石滩产卵。鲑鱼洄游时，河岸上常有海雕和水獭守候，星港区的居民也会到下游的观鱼平台观看鲑鱼跳跃。钓鱼须持许可证并遵守禁捕期，洄游季节的河岸步道是区里少有的安静去处。星港区是深空太空军马斯林山指挥中心的驻地，区内大部分地方是军事管理区，常住的两万多居民绝大多数是军人、航天工程师和他们的家属；发动机试车台试车时轰鸣声在山谷中回荡数十公里，圣梅林河的河谷却离这些设施较远，成了驻地家庭周末散步、野餐的地方。马斯林山是全岛降水最少的城市，秋天晴朗的日子多，正适合在河边看鱼。\n鲑鱼洄游最旺的那几天，星港区的居民会在观鱼平台上数鱼跳，一个下午能数到几百次，孩子们比赛谁先看到「跳得最高的那一条」。工程师们则习惯带着秒表和笔记本，记下鲑鱼跃过岩坎的次数和高度，有人半开玩笑地说，看鲑鱼一次次起跳，比看火箭发射还让人揪心。"
      en: "A short river on the north-east coast of Starport District in Maslin Mountain City, 15 km long (15.3 km) with a catchment of more than 1400 km², rushing down from the coastal hills north-east into the northern sea. Its course is short and steep, full of rapids and shallows, and every autumn salmon run up from the sea, leaping ledge after ledge to spawn on the gravel beds upstream. During the run sea eagles and otters wait on the banks, and Starport residents come down to the viewing platform on the lower river to watch the salmon leap. Fishing requires a permit and must respect the closed season, and in the spawning season the riverside path is one of the few quiet places in the district. Starport District is the seat of the Deep Space Force's Maslin Mountain Command Centre and most of it is a military zone; nearly all its twenty-odd thousand residents are servicemen and women, aerospace engineers and their families. When the engine test stands fire, the roar echoes for tens of kilometres through the hills, but the Saint-Merrin valley lies further from these installations and has become where garrison families walk and picnic at weekends. Maslin Mountain is the driest city on the island, and autumn brings many clear days, just right for watching fish by the river.\nAt the peak of the run, Starport residents count leaps from the viewing platform, reaching several hundred in an afternoon, and children compete to be first to spot \"the one that jumps highest\". The engineers tend to bring stopwatches and notebooks to record how often and how high the salmon clear the ledges, and some say, half joking, that watching the salmon try again and again is more nerve-racking than watching a rocket launch."
  - id: nat_63q4d4
    subtype: river
    status: generated
    detect: { kind: river, at_km: [235.8, 143.8] }
    names: { zh: 帕利卡图克河, en: Paaliqattuk River, art-x-viking: Paaliqattukfluss }
    notes:
      zh: "雅利基卢克市尼尔萨利特牧区北部的短河，全长三十多公里（36.7 公里），流域面积三千五百多平方公里，从尼尔萨利特的高原台地流下，向东北注入北部海域。河流切过台地边缘时形成一段段急流，水声在空旷的高原上能传出很远；下游河谷变宽，河口两侧是河水冲下的石英砂堆积成的白色沙滩，河名由此而来。尼尔萨利特是雅利基卢克河东岸高原上的驯鹿冬季牧场，常住人口每平方公里不到零点三人，是全岛唯一以游牧为主要生计的地区；每年秋季牧民赶着鹿群从北部的夏季牧场南迁，冬季带着鹿群在河谷里避风，河岸的桦树林是鹿群觅食地衣的地方，春天冰雪消融后再随鹿群北上。牧区的流动学校和流动诊所跟着牧民一起迁徙，冬天也会在河谷里扎营。环北维京岛高速在下游跨过帕利卡图克河，夏季河口的白沙滩上几乎看不到人影，只有海鸟和偶尔下到海边的驯鹿。\n牧民说，帕利卡图克河是鹿群的「冬天的家门」：秋天鹿群走到台地边缘，听见急流的水声，就知道快到避风的河谷了。流动学校的孩子们冬天在河谷营地上课，下课后最爱跑到冰封的急流边，听冰层下面的水声，老师说那是河在冰下「打呼噜」。"
      en: "A short river in the north of the Nirsaliit Pastoral District of Jaalikiluk City, a little over 30 km long (36.7 km) with a catchment of more than 3500 km², running down from the Nirsaliit plateau north-east into the northern sea. Where it cuts through the edge of the plateau it breaks into a series of rapids whose roar carries far across the empty upland; further down the valley widens, and on either side of the mouth white beaches of quartz sand washed down by the river give the river its name. Nirsaliit is the reindeer winter pasture on the plateau east of the Jaalikiluk River, with fewer than 0.3 permanent residents per square kilometre, the only area on the island where herding is the main way of life. Each autumn the herders drive their reindeer south from the summer pastures in the north, shelter with them from the wind in the river valley through the winter, where the riverside birch woods are where the herds forage for lichen, and move north again in spring as the snow melts. The district's mobile schools and clinics travel with the herders and camp in the valley in winter too. The North Viking Island Ring Expressway crosses the lower river, and in summer the white beaches at the mouth are almost deserted, visited only by seabirds and the odd reindeer come down to the sea.\nThe herders call the Paaliqattuk the herds' \"winter front door\": in autumn, when the reindeer reach the edge of the plateau and hear the rapids, they know the sheltered valley is near. Children at the mobile school have their lessons at the valley camp in winter, and after class they love to run to the frozen rapids and listen to the water under the ice, which their teacher says is the river \"snoring\" beneath it."
  - id: nat_dctsdf
    subtype: river
    status: generated
    detect: { kind: river, at_km: [276.2, 49.2] }
    names: { zh: 银溪, en: Silver Brook, art-x-viking: Silberbach }
    notes:
      zh: "天城市银滩区的山溪，全长约十公里（10.2 公里），流域面积一千三百多平方公里，发源于北面岚山的阔叶林中，一路跌宕直落海滨，在银角东北的沙滩上入海。溪水清澈见底，中游有几级小瀑布和深潭，夏季是游人戏水和野餐的地方，沿溪修有一条通往岚山森林公园的步道，从公园的山顶可以俯瞰整个柳萨湾。银溪带下的白色石英砂堆积在溪口两侧，使这一带的沙滩格外洁白；银滩区拥有北维京岛最长、最白的沙滩，沿海岸绵延十几公里，银溪口是其中最安静的一段。溪口附近的海滨酒店和度假屋沿沙滩排开，是天城度假区里安静的一角，与热闹的银滩主题乐园和银滩大酒店一带隔着一段海岸。春季银滩海滨公园的沙丘上有候鸟停歇，溪口的浅水里也常见涉禽觅食。天城一年降水接近两千三百毫米，雨后的银溪水声最响，瀑布也最壮观。\n银溪的深潭水冷得刺骨，银滩区的年轻人有个夏天的传统：从瀑布边的岩石上跳进深潭，再一口气游到对岸，敢跳的人才算「真正的银滩人」。夏季来打工的季节工往往也会被拉去试一次，跳完的人在岸边裹着毛巾发抖，旁边的本地人递上一杯热可可，算是正式欢迎入伙。"
      en: "A mountain stream in Silver Beach District of Skytown City, about 10 km long (10.2 km) with a catchment of more than 1300 km². It rises in the broadleaf woods of Mist Hill to the north and tumbles all the way down to the shore, entering the sea on the beach north-east of Silver Cape. The water is crystal clear, and in its middle course there are several small waterfalls and deep pools where visitors paddle and picnic in summer; a path follows the stream up to Mist Hill Forest Park, from whose summit the whole of Ljosa Bay can be seen. White quartz sand brought down by the stream has built up on either side of its mouth, making the beach here especially white. Silver Beach District has the longest, whitest beach on North Viking Island, stretching for more than ten kilometres along the coast, and the mouth of Silver Brook is its quietest stretch. Seaside hotels and holiday cottages line the sand near the mouth, a peaceful corner of Skytown's resort district, separated by a stretch of coast from the bustle of Silver Beach Theme Park and the Silver Beach Grand Hotel. In spring migrating birds rest on the dunes of Silver Beach Seafront Park, and waders feed in the shallows at the mouth. Skytown gets nearly 2300 mm of rain a year, and after rain Silver Brook is at its loudest and its waterfalls at their finest.\nThe water in Silver Brook's deep pool is bitingly cold, and Silver Beach's young people have a summer tradition: jump into the pool from the rocks beside the waterfall and swim straight across to the far side; only those who dare count as \"real Silver Beachers\". The seasonal workers who come for the summer usually get dragged along to try it once, and as they shiver in their towels on the bank, a local hands them a hot chocolate as their official welcome."

  # ── River mouths ─────────────────────────────────────────
  - id: nat_n5s4er
    subtype: estuary
    status: generated
    detect: { kind: estuary, at_km: [171.8, 138.8] }
    names: { zh: 雅利基卢克河口, en: Jaalikiluk Mouth, art-x-viking: Jaalikilukmündung }
    notes:
      zh: 北维京岛最长的河流雅利基卢克河注入北部海域的地方，河口宽阔，分汊的水道、沙洲和芦苇荡铺开成一片三角洲湿地，春秋两季是候鸟迁徙的重要停歇地，成群的雁鸭、鹬类和天鹅在这里觅食休整。河口的一座小渔港停泊着基卢克维克区的渔船，渔民在河口和近海捕捞鲑鱼和鳕鱼，秋季鲑鱼洄游时最为忙碌。三角洲以南是雅利基卢克河下游的冲积平原，麦田、饲草地和奶牛场一直延伸到河岸。夏季白夜时，河口的湿地在午夜仍笼罩着淡淡的天光，是北维京岛最原始的景色之一。
      en: Where the Jaalikiluk, the longest river on North Viking Island, reaches the northern sea. The mouth is wide, and its branching channels, sandbars and reed beds spread into a delta wetland that is a major stopover for migrating birds in spring and autumn, when flocks of geese, ducks, waders and swans rest and feed here. A small fishing harbour shelters the boats of Kilukvik District, which take salmon and cod in the estuary and inshore and are busiest during the autumn salmon run. South of the delta the alluvial plain of the lower Jaalikiluk runs right to the riverbanks in fields of cereals, fodder meadows and dairy farms. In the white nights of summer the wetlands still lie under a pale glow at midnight, one of the wildest sights on North Viking Island.
  - id: nat_zawm5e
    subtype: estuary
    status: generated
    detect: { kind: estuary, at_km: [68.8, 65.8] }
    names: { zh: 自由河口, en: Freedom River Mouth, art-x-viking: Freiflussmündung }
    notes:
      zh: 自由河注入大海的地方，河口沙洲连绵，沙洲区因此得名。沙洲之间是纵横的水道、湿地和沙丘，候鸟成群栖息，建在河口沙丘上的沙洲公园是观看候鸟和潮水涨落的地方。河口一带是首府的港口门户：沙洲港承担首府的散货、建材与燃料进口，沙洲老渔市的木构鱼棚沿码头排开，旁边的沙洲钟楼是老港区的地标，维西磁悬浮在沙洲站停靠。北河公路从河口经过，向南穿过菲亚尔马克丘陵通往维京港。
      en: "Where the Freedom River meets the sea, among the long chain of sandbars that gave Sandbar District its name. Between the bars lies a maze of channels, wetland and dunes where migrating birds gather in flocks, and Sandbar Park, laid out on the dunes, is the place to watch the birds and the tides. The mouth is the capital's gateway to the sea: Sandbar Port handles the capital's imports of bulk cargo, building materials and fuel, the wooden fish sheds of the Sandbar Old Fish Market line the quay beside the Sandbar Clock Tower, landmark of the old port, and the Viking Port–Northwest Maglev stops at Sandbar Station. The North River Highway passes the mouth on its way south through the Fjallmark Hills to Viking Port."
  - id: nat_3xnyt2
    subtype: estuary
    status: generated
    detect: { kind: estuary, at_km: [112.2, 71.2] }
    names: { zh: 北河口, en: North River Mouth, art-x-viking: Nordflussmündung }
    notes:
      zh: "北河在沙洲区东部注入大海的地方，河口两侧是低平的滩涂和盐沼，退潮时露出大片泥滩，是涉禽和野鸭觅食的地方。与西面热闹的自由河口相比，这里安静得多，周末常有首府居民骑车来这里看候鸟。北河流域近两万平方公里，河水平缓，带来的细泥在河口外淤出浅滩，渔民在浅滩上设网捕捞鳗鱼和比目鱼。沙洲区是自由市唯一临海的区，自由河口和北河口这两个河口都在区内。鳗鱼季里，河口的渔民会在岸边的小棚里烟熏鳗鱼，烟味顺风飘到骑车的人鼻子里，常有首府的骑行者停下来买一条，坐在河堤上就吃。"
      en: "Where the North River reaches the sea in the east of Sandbar District. Low mudflats and salt marsh line both sides of the mouth, and at low tide wide flats appear where waders and wild duck feed. It is far quieter than the busy Freedom River Mouth to the west, and at weekends people from the capital cycle out to watch the migrants. The North River drains nearly 20,000 km² and flows gently, and the fine silt it carries has built shoals off the mouth where fishermen set nets for eel and flatfish. Sandbar is Freedom City's only coastal district, and both the Freedom and North river mouths lie within it. In eel season the estuary fishers smoke eels in little sheds on the shore, the smoke drifts across to passing cyclists, and riders from the capital often stop to buy one and eat it sitting on the embankment."
  - id: nat_915gyn
    subtype: estuary
    status: generated
    detect: { kind: estuary, at_km: [281.8, 114.2] }
    names: { zh: 马斯林河口, en: Maslin Mouth, art-x-viking: Maslinmündung }
    notes:
      zh: 马斯林河注入大海的地方，河口位于马斯林山市星港区与东营区之间。河口港是全市唯一的港口，也是马斯林山市的货运门户：驻军的油料、食品和装备，以及大型航天部件，都经海路运抵这里，再由马斯林山航天高速铁路转运到西坪发射场，或先存入东营后勤基地，再由卡车分送各个基地。港区码头沿河口南岸排开，配有重型吊机和专供超大件装卸的泊位。河口北面不远是星港区的航天港，南岸的东营区北部则是东营空军基地和东营后勤基地。
      en: "Where the Maslin River reaches the sea, between Starport and East Camp districts of Maslin Mountain City. The river port here is the city's only port and its freight gateway: fuel, food and equipment for the garrison, as well as large spacecraft components, arrive by sea and go on by the Maslin Mountain Aerospace High-Speed Railway to the West Heath launch site, or into the East Camp Supply Depot for distribution by lorry. The quays line the south bank of the mouth, with heavy cranes and berths built for outsize loads. The spaceport of Starport District lies a short way north, while the East Camp air base and supply depot occupy the north of East Camp District on the south side."
  - id: nat_3fftzc
    subtype: estuary
    status: generated
    detect: { kind: estuary, at_km: [235.8, 64.8] }
    names: { zh: 柳萨河口, en: Ljosa Mouth, art-x-viking: Ljosamündung }
    notes:
      zh: 柳萨河注入柳萨湾的地方，位于湾顶，西岸属萨科勒市的铁岗区，东岸属天城市的天台区。柳萨河从马斯林山脉带下的泥沙在河口淤出浅滩、沙洲和芦苇荡，涨潮时海水倒灌入河，退潮后露出大片泥滩，海鸟和涉禽成群觅食。环北维京岛高速在河口附近跨过柳萨河，桥上可以望见柳萨湾和湾畔的度假酒店。河口两岸修有木栈道和观鸟台，是天城度假区里难得的一片自然湿地，也是附近居民傍晚散步的地方。
      en: Where the Ljosa River enters Ljosa Bay, at the head of the bay, with Iron Knoll District of Sakole on the west bank and Sky Terrace District of Skytown on the east. Silt brought down from the Maslin Range has built shoals, sandbars and reed beds at the mouth; the rising tide pushes sea water up the river, and at low tide broad mudflats appear where seabirds and waders gather to feed. The ring expressway crosses the river close to the mouth, with a view of the bay and the resort hotels on its shore. Boardwalks and bird hides line both banks, a rare stretch of natural wetland in Skytown's resort district and a favourite evening walk for people who live nearby.

  # ── Lakes ────────────────────────────────────────────────
  - id: nat_kxhv1k
    subtype: lake
    status: generated
    names: { zh: 雪湖, en: Snow Lake, art-x-viking: Schneesee }
    notes:
      zh: "马斯林山市雪谷区中央的冰川湖，面积八十多平方公里（83.8 平方公里），东缘伸入和平区。湖盆由古冰川刨蚀而成，四周是陡峭的雪峰和冰川，气候严寒，湖面终年冰封，只有盛夏时湖岸边会融出一圈窄窄的水面。冰面上积雪皑皑，与周围的雪峰连成一片白色。雪谷是马斯林山脉中终年积雪的高山谷地，常住人口不到两万，大多是军人和家属。湖畔是解放军马斯林山联合训练基地的营区和训练场，雪谷营区驻有陆军寒区部队，雪谷装甲训练场在谷底的冻土和雪原上为装甲部队提供演练场地，大部分湖岸不对公众开放；谷中还有全岛海拔最高的作战机场雪谷空军基地和起降空天飞机的雪谷空天飞机基地，马斯林山空天高速以雪谷空军基地为终点，雪谷公路则把雪谷与天台、和平、西坪连在一起。雪谷滑雪场是区里唯一面向公众的设施，拥有全岛雪期最长、落差最大的雪道，夏季仍可在高处的冰川上滑雪，从滑雪场的高处可以俯瞰整个雪湖和环绕它的雪峰。\n滑雪场的教练们说，雪湖是全岛最「安静」的地方，站在滑雪场高处往下看，冰封的湖面连一丝风纹都没有，像一块被人遗忘的白色桌布。偶尔有空天飞机从湖面上空掠过，轰鸣声在雪峰间回荡好一阵，教练们便停下来，等声音散尽才继续讲课。"
      en: "A glacial lake in the middle of Snow Valley District in Maslin Mountain City, more than 80 km² (83.8 km²), its eastern edge reaching into Peace District. The basin was gouged out by ancient glaciers and is ringed by steep snowy peaks and glaciers; the climate is bitter and the lake stays frozen all year, with only a narrow ring of open water thawing along the shore at the height of summer. Snow lies deep on the ice and merges with the surrounding peaks into one sweep of white. Snow Valley is a high valley in the Maslin Range under snow all year, with fewer than 20,000 residents, most of them servicemen and women and their families. On the shore are the barracks and training grounds of the People's Liberation Army's Maslin Mountain joint training base: Snow Valley Garrison houses the army's cold-region troops, and the Snow Valley Armour Range gives armoured units room to manoeuvre on the frozen ground and snowfields of the valley floor, so most of the shoreline is closed to the public. The valley also holds Snow Valley Air Base, the highest combat airfield on the island, and the Snow Valley Spaceplane Base; the Maslin Aerospace Expressway ends at Snow Valley Air Base, and the Snow Valley Highway links the valley with Sky Terrace, Peace and West Heath. Snow Valley Ski Area is the district's only facility open to the public, with the longest season and greatest vertical drop on the island and glacier skiing high up even in summer, and from its upper slopes the whole of Snow Lake and its ring of peaks can be seen.\nThe ski instructors say Snow Lake is the \"quietest\" place on the island: from the top of the slopes the frozen surface shows not a ripple of wind, like a white tablecloth someone has forgotten. Now and then a spaceplane sweeps over the lake and its roar echoes among the peaks for a long while, and the instructors stop and wait for it to die away before carrying on with the lesson."
  - id: nat_9mpvb7
    subtype: lake
    status: generated
    names: { zh: 鹿鸣湖, en: Deersong Lake, art-x-viking: Hirschliedsee }
    notes:
      zh: "西北市鹿鸣区林间的湖泊，面积约二十五平方公里（25.0 平方公里），四周是云杉和桦树混交林。秋季发情期，雄鹿在湖畔林中高声鸣叫，湖名和区名都由此而来，中文名又暗合古诗「呦呦鹿鸣」，湖边常有野鹿出没。鹿鸣区是西北市的市政与传媒中心，人口约二十五万，占全市四成以上，西北市人民政府、市议会和西北广播电视中心都在区内，西北机场在区的西侧。鹿鸣公园环湖而建，湖岸有步道、码头和露营地，公园里的露天剧场每年夏天举办音乐节和电影节，吸引全岛的年轻人。湖边步道是市民下班后散步的去处，夏天有人在码头租小船划到湖心，冬季湖面封冻后还可以滑冰。湖水清凉，湖畔的混交林秋天一片金黄，与云杉的深绿相间，是西北市摄影爱好者最常去的地方；学校也常把自然课搬到湖边，让孩子们辨认鹿的足迹和啃过的树皮。\n秋天的音乐节常赶上鹿的发情期，演出间隙台下突然安静下来，林子里传来雄鹿的鸣叫，观众就会大笑着鼓掌，乐手们说这是「最难请的嘉宾」。冬天湖面结冰后，公园管理处会在冰上清出几条滑道，傍晚下班的人穿上冰刀绕湖一圈，偶尔能看见几头鹿站在岸边的树林里，好奇地望着滑冰的人。"
      en: "A lake in the woods of Deersong District in Northwest City, about 25 km² (25.0 km²), surrounded by mixed forest of spruce and birch. In the autumn rut the stags bell loudly in the woods by the shore, which gave both lake and district their name, the Chinese name also echoing a line of classical verse about deer calling; wild deer are often seen at the water's edge. Deersong is Northwest City's civic and media centre, with about 250,000 people, more than four-tenths of the city; the Northwest City Government, the city council and the Northwest Broadcasting Centre are in the district, and Northwest Airport lies on its western side. Deersong Park surrounds the lake, with paths, a jetty and a campsite on the shore, and its open-air theatre holds music and film festivals every summer that draw young people from across the island. The lakeside path is where residents walk after work; in summer people hire small boats at the jetty and row out to the middle, and in winter, when the lake freezes, there is skating. The water is cool, and in autumn the mixed woods turn gold against the dark green of the spruce, making it the favourite spot of Northwest's photographers; schools often bring nature lessons to the shore so children can learn to recognise deer tracks and gnawed bark.\nThe autumn music festival often coincides with the rut. When the stage falls silent between acts and a stag's call rings out of the woods, the audience laughs and applauds, and musicians call it \"the hardest guest to book\". When the lake freezes, the park office clears several skating lanes on the ice, and in the evening people skate a lap of the lake after work, now and then spotting a few deer standing among the trees on the shore, watching the skaters with curiosity."
  - id: nat_j67079
    subtype: lake
    status: generated
    names: { zh: 伊卡苏瓦湖, en: Lake Ikkasuvva, art-x-viking: Ikkasuvvasee }
    notes:
      zh: "洛龙山市伊卡苏瓦区峡谷谷底的狭长湖泊，面积约二十平方公里（19.7 平方公里），是雅利基卢克河在峡谷中被古冰川的冰碛堵塞后形成的堰塞湖。湖水深而冷，因含有冰川磨细的岩粉而呈碧绿色，四周是数百米高的陡峭岩壁，夏季融雪从崖顶化作瀑布落入湖中。雅利基卢克河公路贴着湖岸穿过峡谷，沿途设有观景停车点；伊卡苏瓦高速也从区内穿过，以一连串桥梁和隧道在峡谷中穿行，本身就是一道风景。湖边只有零星的木屋和一处小码头，夏季可以乘小船游湖；同在伊卡苏瓦区的伊卡苏瓦瀑布公园是全岛最著名的自然景区，最高一级瀑布落差上百米，与伊卡苏瓦湖一起吸引着徒步和摄影的游客。峡谷谷底散布着古老的山村和梯田，许多村落只有几十户人家，居民以维京语为母语，年轻人多外出工作，夏季游客到来时村里才热闹起来；隆冬时节，瀑布冻成冰墙，湖面也封冻成一片青白。\n湖水的碧绿色随季节变化，融雪最多的初夏颜色最浓，摄影师们管那几周叫「绿周」，木屋早在冬天就被订满了。湖边码头的船夫说，划到湖心往下看，绿得像一块化不开的玉，不少游客伸手去摸湖水，冷得立刻缩回来，才相信这水是从冰川上流下来的。"
      en: "A long, narrow lake on the floor of the gorge in Ikkasuvva District of Lorond Mountain City, about 20 km² (19.7 km²), formed where an ancient glacial moraine dammed the Jaalikiluk River in the gorge. The water is deep and cold, coloured jade green by rock flour ground fine by the glaciers, and walled by cliffs hundreds of metres high from whose tops snowmelt falls into the lake as waterfalls in summer. The Jaalikiluk River Highway hugs the shore through the gorge with viewpoint lay-bys along the way, and the Ikkasuvva Expressway also crosses the district, threading the gorge on a chain of bridges and tunnels that is a sight in itself. On the shore there are only a few scattered cabins and a small jetty, and in summer you can take a boat out on the lake. Ikkasuvva Falls Park, also in the district, is the island's most famous natural attraction, its highest fall dropping over a hundred metres, and together with the lake it draws hikers and photographers. Old villages and terraced fields are scattered along the valley floor, many only a few dozen households; the people speak Viking as their first language, most of the young have left for work, and the villages only come alive when summer visitors arrive. In deep winter the waterfalls freeze into walls of ice and the lake freezes a pale blue-white.\nThe lake's green changes with the seasons and is deepest in early summer when the snowmelt is at its height; photographers call those weeks \"green weeks\", and the cabins are booked solid by winter. The boatmen at the jetty say that from the middle of the lake the water looks like a block of jade that will never dissolve, and many visitors reach down to touch it, snatching their hands back at the cold and only then believing it really comes off the glaciers."
