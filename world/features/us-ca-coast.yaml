      en: "An island off the north-east coast, about 150 km², of pine woods and lava. Supporters of the State of Pending movement once raised their own flag here and declared it 'the first territory of the new state'; the state government ignored them, and the island's twenty-odd households still call themselves 'already independent' while crossing to the main island each month to collect their social security cheques."
  # ── Archipelagos ─────────────────────────────
