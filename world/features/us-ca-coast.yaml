# Names are Chinese, English and Spanish (es).
features:
  # ── Islands ──────────────────────────────────
  - id: nat_0vhyfv
    subtype: island
    status: generated
    detect: { kind: island, at_km: [188.8, 105.8] }
    names: { zh: 空壳岛, en: Shell Island, es: Isla Fantasma }
    notes:
      zh: "离岸群岛最大的岛，面积约 1290 平方公里，也是自治州主岛之外最大的岛，岛上是峡谷、海崖、橡树林和成群的海鸟。岛名来自岛上登记的几万家空壳公司：它们的总部是岛上小镇唯一一条街两边的邮箱，员工人数一栏写的都是零。岛上真正的居民是看管邮箱的人、海鸟研究员和只有家猫大小的灰狐狸；每年报税季前，送信的船会多开三班。"
      en: "The largest of the Offshore Islands, about 1,290 km² and the largest island in the state after the main island, a place of canyons, sea cliffs, oak woods and great colonies of seabirds. It is named for the tens of thousands of shell companies registered here, whose headquarters are the mailboxes along both sides of the island town's only street and whose staff numbers all read zero. The real islanders are the mailbox keepers, seabird researchers and grey foxes no bigger than house cats; before every tax season the mail boat runs three extra sailings."
  - id: nat_j044py
    subtype: island
    status: generated
    detect: { kind: island, at_km: [166.8, 107.2] }
    names: { zh: 信箱岛, en: Mailbox Island, es: Isla Buzón }
    notes:
      zh: "空壳岛西边的小岛，面积约 220 平方公里，常年大风，岛上几乎没有树，只有一座灯塔和一排排海狮。空壳岛的邮箱排满之后，新公司都登记在这里：岛上没有街，邮箱就钉在灯塔外墙上，从塔底一直钉到塔顶，灯塔看守人兼任全岛的邮政局长。"
      en: "A small island west of Shell Island, about 220 km², windswept all year and almost treeless, with a lighthouse and rows of sea lions. Once Shell Island's mailboxes were full, new companies registered here instead: the island has no street, so the mailboxes are nailed to the lighthouse walls from the foot of the tower to the top, and the keeper doubles as the island's postmaster."
  - id: nat_trcbf4
    subtype: island
    status: generated
    detect: { kind: island, at_km: [197.2, 75.8] }
    names: { zh: 信托岛, en: Trust Island, es: Isla Fideicomiso }
