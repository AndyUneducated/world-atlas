    notes:
      zh: "主岛东北角伸进海里的大岬角，面积约 250 平方公里，是一片长满松树的熔岩台地。待建州运动把这里当作新州的起点，岬角上立着一块界碑，一面刻着「加利福尼亚」，一面刻着「待建州」，两面之间隔着一层薄薄的青苔。"
      en: "The great headland at the north-east corner of the main island, about 250 km², a lava tableland covered in pines. The State of Pending movement treats it as the starting point of the new state, and a boundary stone stands on it, 'California' carved on one face and 'State of Pending' on the other, with a thin layer of moss between them."
  - id: nat_0asqkg
