      zh: "海湾半岛的北端，面对风投湾的湾口，悬崖上是老炮台和灯塔。岬名来自湾区的创业者：公司被收购或上市叫「退出」，退出成功的人都爱来这里拍一张以湾口为背景的照片，然后搬走。"
      en: "The northern tip of the bay peninsula, facing the mouth of Venture Bay, with old gun batteries and a lighthouse on its cliffs. It is named after the Bay Area's founders, for whom a company's sale or listing is an 'exit': everyone who made a successful exit came here for a photo with the mouth of the bay behind them, and then moved away."
