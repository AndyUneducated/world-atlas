# Coastal landforms of the California Autonomous State: islands, bays and capes, found in the coastline
# by the generator (pipeline/atlas/coast.py) and named by `detect: {kind, at_km}`.
# Names are Chinese, English and Spanish (es).
features:
  # ── Islands ──────────────────────────────────
  - id: nat_0vhyfv
    subtype: island
    status: generated
    detect: { kind: island, at_km: [188.8, 105.8] }
    names: { zh: 空壳岛, en: Shell Island, es: Isla Fantasma }
    notes:
      zh: "空壳岛是离岸群岛最大的岛，面积约 1290 平方公里，也是自治州主岛之外最大的岛，属离岸群岛市避税列岛区，最高处海拔约 276 米。岛的四周是被海浪切出的海崖，内陆是一道道干燥的峡谷和缓丘，向阳的坡上长着灌丛，背风的谷里是橡树林。气候和南海岸一样是地中海式的，冬天下雨，夏天几乎滴雨不下，清晨常有海雾漫上崖顶。海崖上住着成群的海鸟，林子里有一种只有家猫大小的灰狐狸。\n岛名来自岛上登记的几万家空壳公司。它们的总部是岛上小镇唯一一条街两边的邮箱，每只邮箱刻着一家公司的名字，员工人数一栏写的都是零。在岛上登记的公司不交州税，州政府给的理由是「海岛的土地还在测量中」，这场测量已经进行了很多年。\n岛上真正的居民是看管邮箱的人、海鸟研究员和那些灰狐狸。看管邮箱的人每天沿街走一趟，把信件分进邮箱，再按公司的要求转寄到湾区或海外；每年报税季前，送信的船要多开三班，码头上的信袋堆得比人还高。岛上没有医院，居民看病要搭送货的船去本岛。研究员说灰狐狸已经学会了躲在邮箱底下乘凉，偶尔还会叼走一封没人认领的信，那多半是一份催缴税款的通知。"
      en: "Shell Island is the largest of the Offshore Islands, about 1,290 km² in area and the largest island in the state after the main island, part of Tax Shelter Islands District in Offshore Islands City, rising to about 276 metres. Its shores are sea cliffs cut by the waves, and inland lie dry canyons and rolling hills, with scrub on the sunny slopes and oak woods in the sheltered valleys. Its climate, like the south coast's, is Mediterranean, with rain in winter, hardly a drop in summer and sea fog often creeping over the clifftops in the early morning. Great colonies of seabirds live on the cliffs, and in the woods lives a grey fox no bigger than a house cat.\nThe island is named for the tens of thousands of shell companies registered here. Their headquarters are the mailboxes along both sides of the only street in the island's town, each engraved with a company's name, and every one gives its staff numbers as zero. Companies registered on the island pay no state tax, and the reason the state government gives is that \"the island's land is still being surveyed\"; the survey has been going on for many years.\nThe real islanders are the mailbox keepers, the seabird researchers and the grey foxes. The keepers walk the street once a day, sorting the post into the boxes and forwarding it to the Bay Area or overseas as each company instructs; before every tax season the mail boat runs three extra sailings and the mailbags on the quay are piled higher than a man. There is no hospital on the island, and islanders who need a doctor catch the supply boat to the main island. The researchers say the foxes have learned to shelter from the sun under the mailboxes and now and then carry off an unclaimed letter, most often a demand for unpaid tax."
  - id: nat_j044py
    subtype: island
    status: generated
    detect: { kind: island, at_km: [166.8, 107.2] }
    names: { zh: 信箱岛, en: Mailbox Island, es: Isla Buzón }
    notes:
      zh: "信箱岛是空壳岛西边的小岛，面积约 220 平方公里，最高处海拔只有约 74 米，属离岸群岛市避税列岛区。它是群岛里地势最低的岛之一，台地平坦，直接面对外海，常年大风，岛上几乎没有树，只有被风压得贴地生长的灌丛和草。沙滩和礁石上趴着一排排海狮，繁殖季节岸边吵得像集市；岛上唯一的建筑是一座灯塔，它是船只从西边驶近群岛时看到的第一盏灯。岛上没有淡水，看守人的饮用水和每周的邮件一起由船运来。\n空壳岛的邮箱排满之后，新公司都登记在这里。岛上没有街，邮箱就钉在灯塔外墙上，从塔底一直钉到塔顶，灯塔看守人兼任全岛的邮政局长。和群岛的其他岛一样，在这里登记的公司不交州税，于是新邮箱越钉越高，最上面一圈已经挨着灯室的窗户了。\n看守人每天的工作分两半：天黑前点亮灯塔，天亮后爬梯子分信。顶层的邮箱要系着安全绳才够得着，风大的日子信件会被吹走，海狮于是常常躺在印着公司抬头的信封上晒太阳。航海的人说，远远看去，信箱岛的灯塔比别的灯塔「胖」一圈，因为外面裹着几千只邮箱；有船长抱怨邮箱挡住了灯光，看守人回答说，灯塔的主要业务早就不是照明了。"
      en: "Mailbox Island is a small island west of Shell Island, about 220 km² in area and rising only to about 74 metres, part of Tax Shelter Islands District in Offshore Islands City. It is one of the lowest islands of the group, a flat tableland facing the open ocean and windswept all year, with almost no trees, only scrub and grass pressed flat against the ground by the wind. Rows of sea lions lie on its beaches and rocks, and in the breeding season the shore is as noisy as a market; the island's only building is a lighthouse, the first light ships see as they approach the group from the west. There is no fresh water on the island, and the keeper's drinking water comes by boat with the weekly post.\nOnce Shell Island's mailboxes were full, new companies registered here instead. The island has no street, so the mailboxes are nailed to the lighthouse walls from the foot of the tower to the top, and the keeper doubles as the island's postmaster. As on the other islands of the group, companies registered here pay no state tax, so the new boxes climb ever higher, and the topmost ring now reaches the windows of the lantern room.\nThe keeper's day has two halves: lighting the lamp before dark and climbing the ladder to sort the post after dawn. The top boxes can only be reached on a safety rope, and on windy days letters blow away, so the sea lions are often found basking on envelopes printed with company letterheads. Sailors say that from a distance the Mailbox Island light looks a size \"fatter\" than other lighthouses, being wrapped in thousands of mailboxes; when a captain complained that the boxes blocked the light, the keeper replied that lighting had long since stopped being the lighthouse's main business."
  - id: nat_trcbf4
    subtype: island
    status: generated
    detect: { kind: island, at_km: [197.2, 75.8] }
    names: { zh: 信托岛, en: Trust Island, es: Isla Fideicomiso }
    notes:
      zh: "信托岛是离岸群岛南边的孤岛，面积约 390 平方公里，最高处海拔约 175 米，属离岸群岛市避税列岛区。岛的大部分地势低平，海边是连绵的沙丘，沙丘上长着矮草，内陆有几道低缓的山梁，冬天的雨让山坡短暂地绿起来，到夏天又晒成一片枯黄。它离群岛的其他岛都有一段距离，四周海面开阔，风浪比别处大，海鸟在沙丘间筑巢，海狮在岸边的沙滩上晒太阳。\n整座岛归一家家族信托所有，信托的受益人是另一家信托，那家信托的受益人是一只基金，基金的地址又回到这座岛上。州税务局的稽查员顺着这条线查了三年，最后在报告里画了一个圆圈。和群岛的其他岛一样，岛上的土地「还在测量中」，不交房产税。\n岛上没有常住的人，只有信托雇的一名看护员，每季度乘船来一次，检查沙丘上的界桩还在不在，再在登记簿上签个字。登记簿上的「岛主」一栏写的是那家信托的名字，看护员签字的那一栏写着「受托人代表」，他自己也说不清是在替谁签字。那份画着圆圈的稽查报告后来被税务局的同事复印了许多份，贴在各个科室的墙上，旁边有人加了一行小字：「本局年度最佳流程图。」"
      en: "Trust Island is a lone island south of the Offshore Islands, about 390 km² in area and rising to about 175 metres, part of Tax Shelter Islands District in Offshore Islands City. Most of it is low and flat, with a long line of dunes along the shore covered in short grass and a few low ridges inland; the winter rain turns the slopes briefly green before summer bakes them yellow again. It lies some way from the other islands of the group, in open water where the wind and waves are rougher than elsewhere; seabirds nest among the dunes and sea lions bask on the beaches.\nThe whole island belongs to a family trust whose beneficiary is another trust, whose beneficiary is a fund, whose address is this island again. A state tax inspector followed the chain for three years and ended his report with a drawing of a circle. As on the other islands of the group, the land is \"still being surveyed\" and pays no property tax.\nNobody lives on the island; there is only a caretaker employed by the trust, who comes by boat once a quarter to check that the boundary posts on the dunes are still there and sign the register. The register's \"owner\" line bears the name of the trust, and the caretaker signs on the line marked \"for the trustee\", though he cannot say on whose behalf he is signing. The inspector's report with the circle was later photocopied many times by his colleagues and pinned up in every office of the tax department, where someone added a line in small print: \"Best flowchart of the year.\""
  - id: nat_12g09q
    subtype: island
    status: generated
    detect: { kind: island, at_km: [211.8, 73.2] }
    names: { zh: 抽屉岛, en: Drawer Island, es: Isla Cajón }
    notes:
      zh: "抽屉岛是离岸群岛西部的一座小岛，在信托岛以东，面积约 240 平方公里，最高处海拔约 181 米，属离岸群岛市避税列岛区。岛上地势起伏不大，低矮的山丘上长着耐旱的灌丛和野草，海岸多是礁石，只有一处小湾能停船，私人码头就修在那里。冬季的风暴从西边来，夏天则常年干旱，岛上没有长流的溪水，只有雨季时山沟里积起的几洼水，海鸟和海狮是这里最常见的动物。\n岛上只有一座私人码头和一间铁皮屋。铁皮屋里有一排文件柜，柜子的每个抽屉里放着一家公司的全部文件，岛名由此而来。岛主说这是全世界人均公司最多的地方，因为岛上没有人：公司数除以零，结果是无穷大。和群岛的其他岛一样，在这里登记的公司不交州税。\n每隔几个月，一条小船载着律师上岛，打开铁皮屋的门锁，往抽屉里放进几份新文件，再取走几份要注销的。抽屉不够用时，岛主就再运来一个柜子，铁皮屋于是越接越长，从海上看像一节搁浅的火车车厢。州税务局的稽查员曾经申请上岛检查，得到的答复是「岛上没有可以接待您的人」，他只好隔着窗户数了一遍柜子，回去在报告里写下柜子的数量；抽屉里装着什么，他至今不知道。"
      en: "Drawer Island is a small island in the west of the Offshore Islands, east of Trust Island, about 240 km² in area and rising to about 181 metres, part of Tax Shelter Islands District in Offshore Islands City. The land is gently rolling, with drought-hardy scrub and wild grass on its low hills, and the shore is mostly rock, with only one small cove where a boat can put in, which is where the private jetty stands. Winter storms come in from the west and the summers are dry year after year; the island has no running streams, only a few pools that gather in the gullies in the rainy season, and seabirds and sea lions are the commonest animals.\nThere is nothing on the island but a private jetty and a tin shed. The shed holds a row of filing cabinets, each drawer containing every paper of one company, which is where the island gets its name. Its owner likes to say it has more companies per head than anywhere in the world, since nobody lives there: the number of companies divided by zero comes out as infinity. As on the other islands of the group, companies registered here pay no state tax.\nEvery few months a small boat brings lawyers over; they unlock the shed, put a few new files into the drawers and take out a few that are to be struck off. When the drawers run out the owner ships in another cabinet, so the shed keeps growing longer, and from the sea it looks like a stranded railway carriage. A state tax inspector once applied to inspect the island and was told that \"there is no one on the island to receive you\"; he had to count the cabinets through the window and go home to write their number in his report. What is in the drawers he still does not know."
  - id: nat_weawv6
    subtype: island
    status: generated
    detect: { kind: island, at_km: [232.8, 82.2] }
    names: { zh: 亿万岛, en: Billionaire Island, es: Isla Milmillonaria }
    notes:
      zh: "亿万岛是失落天使港外的岛，面积约 480 平方公里，最高处海拔约 213 米，属离岸群岛市亿万岛区。岛上是起伏的山坡和一个个小海湾，原本长着灌丛和橡树，如今山坡被分成几十块私人领地，每块都有自己的豪宅、码头和停机坪，草坪和棕榈树靠淡化的海水浇灌，在一座干燥的海岛上绿得扎眼。岛上的海湾水清浪静，是停泊游艇的好地方；停机坪比路还多，岛主们去邻居家做客，大多也是飞过去的。\n岛上唯一的小镇只接待岛主的客人，镇上的咖啡馆不收现金也不收卡，只记在主人账上。和群岛的其他岛一样，岛上的豪宅不交房产税，理由是「海岛的土地还在测量中」。岛与本岛之间只有私人渡轮和直升机，没有一班公共航线，在豪宅里干活的厨师、园丁和保安搭送货的船往返，夜里就住在小镇后面的员工宿舍。\n从失落天使望过去，晴天的晚上能看见岛上的灯光，市民说那是全州电费唯一准时付清的地方。山火季时，失落天使的烟飘到海上，岛上的人会把游艇开到上风处躲一躲；搁浅滩区的人则说，港外排队的货轮和亿万岛的游艇停在同一片海上，一边在甲板上种菜养鸡，一边在甲板上开香槟。"
      en: "Billionaire Island lies off the port of Lost Angeles, about 480 km² in area and rising to about 213 metres, part of Billionaire Isles District in Offshore Islands City. It is a place of rolling hillsides and little coves, once covered in scrub and oaks; today the slopes are divided into dozens of private estates, each with its own mansion, jetty and helipad, and lawns and palms watered with desalinated seawater stand out a garish green on a dry island. Its coves are clear and calm, perfect for mooring yachts, and there are more helipads than roads; when the owners visit their neighbours, they mostly fly.\nThe island's only town serves only the owners' guests, and its café takes neither cash nor cards but puts everything on the host's account. As on the other islands of the group, the mansions pay no property tax, on the grounds that \"the island's land is still being surveyed\". Only private ferries and helicopters link it with the main island, with not one public service, so the cooks, gardeners and guards who work in the mansions travel on the supply boats and sleep in the staff quarters behind the town.\nOn clear evenings the island's lights can be seen from Lost Angeles, and people there say it is the only place in the state whose power bill is paid on time. In the wildfire season, when the smoke from Lost Angeles drifts out to sea, islanders take their yachts upwind to escape it; people in Long Beached say that the freighters queuing outside the port and the yachts of Billionaire Island lie on the same stretch of sea, one lot growing vegetables and keeping chickens on deck and the other opening champagne on it."
  - id: nat_ff8gyg
    subtype: island
    status: generated
    detect: { kind: island, at_km: [228.8, 62.2] }
    names: { zh: 地堡岛, en: Bunker Island, es: Isla Búnker }
    notes:
      zh: "地堡岛是离岸群岛最南的岛，面积约 500 平方公里，最高处海拔约 353 米，属离岸群岛市亿万岛区。岛的中部是一座浑圆的石山，四周的缓坡上是光秃秃的灌丛和一处旧靶场，海岸陡峭，风大的日子浪头能打上崖顶。岛上雨水少，几乎没有树，地面上看不出什么人烟，真正的建筑都在地下。\n富豪们合资把岛上的山体挖空，在里面建了水库、温室、医院、酒窖和几百套公寓，据说够几百个家庭在地下住上几年。据说挖出来的石头装了几千船运回本岛，铺进了富人区的私家车道。入口由三道门守着，最后一道门的密码只有一个人工智能知道；有人问如果人工智能出了故障怎么办，答复是「它会提前通知」。\n地堡岛每年做一次「末日演习」：演习那天岛主们乘直升机上岛，在地堡里吃一顿晚餐，然后离开，岛上的工作人员说那是一年中最热闹的一晚。平日里住在岛上的只有维护人员、厨师和保安，他们住在地面上的板房里，因为地下的公寓不对员工开放。温室里种出的番茄每周装船送到亿万岛，工作人员说这是全世界最安全的番茄，可惜还从来没有人在地堡里吃过一顿真正的末日晚餐。"
      en: "Bunker Island is the southernmost of the Offshore Islands, about 500 km² in area and rising to about 353 metres, part of Billionaire Isles District in Offshore Islands City. A rounded rocky hill fills the middle of the island, its gentle slopes covered in bare scrub and an old firing range; the coast is steep, and on windy days the waves break over the clifftops. Rain is scarce and there are almost no trees; on the surface there is little sign of anyone, because every real building is underground.\nThe very rich jointly hollowed out the island's hill and built inside it a reservoir, greenhouses, a hospital, wine cellars and hundreds of flats, said to be enough for hundreds of families to live below ground for years. The excavated rock, it is said, filled thousands of boatloads and went back to the main island to pave the private drives of wealthy neighbourhoods. Three doors guard the entrance, and only an AI knows the code to the last; asked what happens if the AI fails, the management replied that \"it will give notice\".\nOnce a year Bunker Island holds a \"doomsday drill\": on that day the owners fly in by helicopter, eat dinner in the bunker and leave, and the staff say it is the liveliest night of the year. The rest of the time the only people on the island are the maintenance crew, cooks and guards, who live in prefabricated huts on the surface, since the flats below are not open to staff. Every week the tomatoes grown in the greenhouses are shipped to Billionaire Island; the staff say they are the safest tomatoes in the world, though nobody has ever yet eaten a real doomsday dinner in the bunker."
  - id: nat_34yzk0
    subtype: island
    status: generated
    detect: { kind: island, at_km: [109.8, 249.3] }
    names: { zh: 算力岛, en: Compute Island, es: Isla Cómputo }
    notes:
      zh: "算力岛是风投湾南湾里的一座人工岛，面积约 20 平方公里，最高处只比海面高出约 30 米，属贝叶斯市似然谷区。岛是填海造出来的，地势低平，整座岛就是一座数据中心：算力岛数据中心的机房一栋挨着一栋，中间夹着变电站，几乎把岛面铺满，四周围着一圈冷却水的出水口。机房直接抽海水冷却，排出的热水让出水口附近的海面冬天也冒着热气；湾里起雾的下午，冷却塔的白汽和海雾混在一起，从岸上已经分不清哪是天气、哪是算力。\n岛上运行着湾区几家人工智能公司的大模型，州里的救济审批、法案起草和学校里给每个学生配的人工智能家教，很多都是在这里算出来的。岛上没有居民，只有机器人维护员和少数轮班的工程师，他们坐船上岛，上岸前要在码头换上防静电的鞋套。\n湾里的海狮喜欢趴在出水口边取暖，冬天常常挤成一片，似然谷区的人说它们是全州唯一从人工智能那里得到好处的动物。数据中心的安保系统起初把海狮识别成「未授权入侵者」，每天报警几千次，工程师最后只好给海狮建了一份白名单；如今每头常来的海狮都有一个编号，比新来的工程师还先拿到门禁权限。"
      en: "Compute Island is an artificial island in the south arm of Venture Bay, about 20 km² in area and rising no more than about 30 metres above the sea, part of Likelihood Valley District in Bayesian City. Built on reclaimed land, it is low and flat, and the whole island is one data centre: the halls of the Compute Island Data Centre stand side by side with substations between them, covering almost every inch of ground, and a ring of cooling-water outfalls runs round the shore. The halls draw seawater straight in for cooling, and the warm discharge keeps the sea by the outfalls steaming even in winter; on foggy afternoons in the bay the white plumes from the cooling towers mix with the sea fog, and from the shore no one can tell any more which is weather and which is compute.\nThe island runs the large models of several of the Bay's AI companies, and much of the state's welfare approvals, bill drafting and the AI tutors given to every schoolchild is computed here. Nobody lives on the island except the maintenance robots and a few engineers working shifts, who come over by boat and must pull on anti-static overshoes at the jetty before they step ashore.\nThe bay's sea lions like to bask by the outfalls, often packed together in winter, and people in Likelihood Valley say they are the only animals in the state to have done well out of AI. The data centre's security system at first identified the sea lions as \"unauthorised intruders\" and raised thousands of alarms a day, until the engineers gave up and put the sea lions on a whitelist; today every regular has a number, and they got their access rights before the newest engineers did."
