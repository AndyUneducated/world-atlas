      zh: "离岸群岛南边的孤岛，面积约 390 平方公里，地势低平，沙丘上长着矮草。整座岛归一家家族信托所有，信托的受益人是另一家信托，那家信托的受益人是一只基金，基金的地址又回到这座岛上，州税务局的稽查员顺着这条线查了三年，最后在报告里画了一个圆圈。"
      en: "A lone island south of the group, about 390 km², low and flat, with short grass on its dunes. The whole island belongs to a family trust whose beneficiary is another trust, whose beneficiary is a fund, whose address is this island again; a state tax inspector followed the chain for three years and ended his report with a drawing of a circle."
  - id: nat_12g09q
    subtype: island
    status: generated
    detect: { kind: island, at_km: [211.8, 73.2] }
    names: { zh: 抽屉岛, en: Drawer Island, es: Isla Cajón }
    notes:
      zh: "信托岛以东的小岛，面积约 240 平方公里，岛上只有一座私人码头和一间铁皮屋。铁皮屋里有一排文件柜，柜子的每个抽屉里放着一家公司的全部文件，岛名由此而来；岛主说这是全世界人均公司最多的地方，因为岛上没有人。"
      en: "A small island east of Trust Island, about 240 km², with nothing on it but a private jetty and a tin shed. The shed holds a row of filing cabinets, each drawer containing every paper of one company, which gives the island its name; its owner likes to say it has more companies per head than anywhere, since nobody lives there."
  - id: nat_weawv6
    subtype: island
    status: generated
    detect: { kind: island, at_km: [232.8, 82.2] }
    names: { zh: 亿万岛, en: Billionaire Island, es: Isla Milmillonaria }
    notes:
      zh: "失落天使港外的岛，面积约 480 平方公里，岛上的山坡被分成几十块私人领地，每块都有自己的豪宅、码头和停机坪。岛上唯一的小镇只接待岛主的客人，镇上的咖啡馆不收现金也不收卡，只记在主人账上。从失落天使望过去，晴天能看见岛上的灯光，市民说那是全州电费唯一准时付清的地方。"
      en: "The island off the port of Lost Angeles, about 480 km², its hillsides divided into dozens of private estates, each with its own mansion, jetty and helipad. The island's only town serves only the owners' guests, and its café takes neither cash nor cards but puts everything on the host's account. On clear evenings the island's lights can be seen from Lost Angeles, and people there say it is the only place in the state whose power bill is paid on time."
  - id: nat_ff8gyg
    subtype: island
    status: generated
    detect: { kind: island, at_km: [228.8, 62.2] }
    names: { zh: 地堡岛, en: Bunker Island, es: Isla Búnker }
    notes:
      zh: "离岸群岛最南的岛，面积约 500 平方公里，表面是一片光秃秃的灌丛和旧靶场，真正的建筑都在地下：富豪们合资把岛上的山体挖空，建了水库、温室、医院、酒窖和几百套公寓，据说够几百个家庭在地下住上几年。入口由三道门守着，最后一道门的密码只有一个人工智能知道；有人问如果人工智能出了故障怎么办，答复是「它会提前通知」。"
      en: "The southernmost of the Offshore Islands, about 500 km², bare scrub and an old firing range on the surface with every real building underground: the very rich jointly hollowed out its hill to hold a reservoir, greenhouses, a hospital, wine cellars and hundreds of flats, said to be enough for hundreds of families to live below ground for years. Three doors guard the entrance, and only an AI knows the code to the last; asked what happens if the AI fails, the management replied that 'it will give notice'."
  - id: nat_34yzk0
    subtype: island
    status: generated
    detect: { kind: island, at_km: [109.8, 249.3] }
    names: { zh: 算力岛, en: Compute Island, es: Isla Cómputo }
    notes:
      zh: "风投湾南湾里的人工岛，面积约 18 平方公里，整座岛是一座数据中心，机房一栋挨着一栋，岛的四周围着一圈冷却水的出水口，出水口附近的海水冬天也冒着热气。岛上没有居民，只有机器人维护员；湾里的海狮喜欢趴在出水口边取暖，似然谷区的人说它们是全州唯一从人工智能那里得到好处的动物。"
      en: "An artificial island in the south arm of Venture Bay, about 18 km², which is one data centre from end to end, its halls packed side by side and ringed by cooling-water outfalls; the water by the outfalls steams even in winter. Nobody lives there except the maintenance robots, and the bay's sea lions like to bask by the warm outfalls; people in Likelihood Valley say they are the only animals in the state to have done well out of AI."
  - id: nat_qhdwv6
    subtype: island
    status: generated
    detect: { kind: island, at_km: [87.2, 251.2] }
    names: { zh: 大雾礁, en: Great Fog Rock, es: Gran Peñón de Niebla }
    notes:
      zh: "风投湾湾口外雾礁群岛最大的岛，面积约 30 平方公里，花岗岩的礁岛上住着上万只海鸟和海狮，一年里大半时间裹在海雾里。岛上有一座气象站和一座自动灯塔，还有一座海底光缆的登陆站，湾区的数据从这里进出大洋，岛上的海鸟比上网的人还多。"
      en: "The largest of the Fog Rocks off the mouth of Venture Bay, about 30 km², a granite rock home to tens of thousands of seabirds and sea lions and wrapped in sea fog much of the year. It has a weather station, an automatic lighthouse and a landing station for submarine cables, through which the Bay Area's data passes to and from the ocean; there are more seabirds on the island than people online."
  - id: nat_ghqd1h
    subtype: island
