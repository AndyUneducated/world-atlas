      en: "Three granite rocks some forty kilometres off the mouth of Venture Bay, Great, North and South Fog Rock, part of Prior District of Bayesian City and the realm of seabirds, sea lions and great white sharks. They spend most of the year in fog, and Bay Area people say that to know tomorrow's weather you need only look for the Fog Rocks: if you can see them, the weather is about to change."
  # ── Bays ─────────────────────────────────────
