    names: { zh: 大雾礁, en: Great Fog Rock, es: Gran Peñón de Niebla }
    notes:
      zh: "大雾礁是风投湾湾口外雾礁群岛最大的岛，面积约 30 平方公里，最高处海拔约 120 米，属贝叶斯市先验区。它是一块浑圆的花岗岩礁岛，岩石被海浪和海风打磨得光滑，背风的坡上有一层薄薄的草皮，崖壁和岩台上住着上万只海鸟和海狮。岛一年里大半时间裹在海雾里，夏天尤其如此，雾从外海漫过来，常常一连几天看不见太阳；冬天雾少一些，晴朗的日子从湾口两岸的山上能望见它灰色的轮廓。\n岛上有一座气象站、一座自动灯塔，还有一座海底光缆的登陆站：几条光缆从这里上岸，再经海底接回湾区，湾区的数据从这里进出大洋，岛上的海鸟比上网的人还多。三座设施都已无人值守，气象站的数据和灯塔的状态直接传回本岛，只有检修时才有人乘船上岛，风浪大时一等就是好几个星期。灯塔的光每晚扫过湾口外的航道，进出海湾的船靠它校准方向。\n光缆登陆站的机房是全岛最暖和的地方，冬天海狮爱挤在机房外墙边，检修人员上岛时要先把它们一头一头请开，才能打开门。湾区的程序员流行一个说法：网速慢的时候，多半是大雾礁上的海狮又压到了什么东西。气象站的预报员则说，在大雾礁上预报天气最省事，「明天有雾」这句话在大多数日子里都是对的。"
      en: "Great Fog Rock is the largest of the Fog Rocks off the mouth of Venture Bay, about 30 km² in area and rising to about 120 metres, part of Prior District in Bayesian City. It is a rounded granite island, its rock worn smooth by waves and sea wind, with a thin skin of turf on the sheltered slopes, and its cliffs and ledges are home to tens of thousands of seabirds and sea lions. It is wrapped in sea fog for most of the year, and especially in summer, when the fog rolls in from the open ocean and the sun can stay hidden for days on end; in winter there is less fog, and on clear days its grey outline can be seen from the hills on either side of the bay mouth.\nThe island has a weather station, an automatic lighthouse and a landing station for submarine cables: several cables come ashore here and run back under the sea to the Bay Area, so the Bay's data passes to and from the ocean through this rock, and there are more seabirds on the island than people online. All three installations are unmanned, sending their readings and status straight back to the main island, and people come over by boat only for maintenance, sometimes waiting weeks when the sea is rough. Every night the lighthouse beam sweeps the shipping lanes off the bay mouth, and vessels entering and leaving the bay take their bearings from it.\nThe cable station's equipment room is the warmest place on the island, and in winter the sea lions like to crowd against its outer wall; maintenance crews have to move them along one by one before they can open the door. Bay Area programmers have a saying that when the internet is slow, the sea lions on Great Fog Rock have probably lain on something again. The weather station's forecasters say that Great Fog Rock is the easiest place in the world to forecast, since \"fog tomorrow\" is right on most days."
  - id: nat_ghqd1h
    subtype: island
    status: generated
    detect: { kind: island, at_km: [84.8, 253.2] }
    names: { zh: 北雾礁, en: North Fog Rock, es: Peñón de Niebla Norte }
    notes:
      zh: "北雾礁是雾礁群岛西北的礁岛，面积约 24 平方公里，最高处海拔约 106 米，属贝叶斯市先验区。它是三座雾礁里最荒凉的一座：整座岛是裸露的花岗岩，没有一棵树，石缝里只长着地衣和几丛耐盐的草，崖壁上挤满了海鸟的巢，岸边的岩台上趴着海狮。岛的四周水深流急，海狮多的地方大白鲨就多，周围的海里常有它们出没，研究员见过一天之内好几道背鳍同时露出水面，渔船都绕着走。冬天风暴来时，浪花能一直溅到岛顶。\n为了保护海鸟，北雾礁不许登陆。只有鸟类研究员每年乘船来一次，在船上用望远镜和无人机数一遍海鸟，再记下海狮身上的鲨鱼咬痕；风浪太大时船靠不近，他们就隔着几百米的海面数。研究员说，这里是自治州唯一没被分配到一个应用程序的地方：没有共享单车，没有外卖，没有机器人出租车，连手机信号也只有一格。\n湾区一家公司曾申请在北雾礁上装一座「生态监测基站」，宣传材料里画满了太阳能板和摄像头，州里拒绝了，理由很简单：岛上的海鸟不需要被监测，只需要不被打扰。研究员们把这份拒绝信的复印件贴在船舱里，每年出海前读一遍，提醒自己数完鸟就走。"
      en: "North Fog Rock is the north-western island of the Fog Rocks, about 24 km² in area and rising to about 106 metres, part of Prior District in Bayesian City. It is the bleakest of the three: the whole island is bare granite without a single tree, with only lichens and a few clumps of salt-tolerant grass in the cracks, its cliffs crowded with seabird nests and its shore ledges covered with sea lions. The water around it is deep and fast, and where there are many sea lions there are many great white sharks, which are often seen in the surrounding sea; researchers have seen several fins break the surface at once in a single day, and fishing boats give the island a wide berth. When the winter storms come, the spray reaches right to the top of the island.\nTo protect the seabirds, landing on North Fog Rock is forbidden. Only bird researchers come, once a year by boat, counting the seabirds from the deck with binoculars and drones and noting the shark bites on the sea lions; when the sea is too rough to get close they count from several hundred metres off. The researchers say it is the only place in the state that has not been assigned an app: no shared bikes, no food delivery, no robotaxis, and a single bar of phone signal at best.\nA Bay Area company once applied to install an \"ecological monitoring station\" on North Fog Rock, its brochure full of solar panels and cameras, and the state turned it down for a simple reason: the island's seabirds do not need monitoring, only to be left alone. The researchers have pinned a copy of the refusal in the boat's cabin and read it before every year's trip, to remind themselves to count the birds and go."
  - id: nat_8acs4z
    subtype: island
    status: generated
    detect: { kind: island, at_km: [88.8, 248.8] }
    names: { zh: 南雾礁, en: South Fog Rock, es: Peñón de Niebla Sur }
    notes:
      zh: "南雾礁是雾礁群岛南端的礁岛，面积约 20 平方公里，最高处海拔约 108 米，属贝叶斯市先验区。和大雾礁、北雾礁一样，它是一块从海里拱起的花岗岩，土层极薄，只有背风的石缝里长着低矮的草丛和地衣，海鸟在崖壁上筑巢，海狮趴在岸边的岩台上晒太阳，周围的海里有大白鲨出没。岛顶比四周高出一截，视野开阔，于是很早就修了一座雷达站，用来监视湾口外的海面，值班员换防时要在雾里扶着绳索上下山；后来雷达站被废弃，只剩空荡荡的机房和锈蚀的天线座。\n一家初创公司曾想把雷达站改造成「海上远程办公度假村」，承诺让人「在世界的边缘高效工作」。宣传片里的南雾礁阳光灿烂，可宣传片拍完的第二天，大雾就再也没有散开。公司在雾里撑了半年，员工每天在雷达站里对着白茫茫的窗外开视频会议，网络时断时续，最后公司解散，雷达站里至今挂着一块写着「欢迎来到未来」的牌子。\n如今上岛的只有偶尔来检修航标的工人和观鸟的研究员。他们说岛上最好的东西就是那块牌子：雾大的日子，它是全岛唯一看得清的东西。工人们每次离开前都会把它擦干净，说这样等未来真的来了，好歹能找到地方。"
      en: "South Fog Rock is the southern island of the Fog Rocks, about 20 km² in area and rising to about 108 metres, part of Prior District in Bayesian City. Like Great and North Fog Rock it is a block of granite thrust up from the sea, with the thinnest of soils; only in sheltered cracks do low grasses and lichens grow, seabirds nest on the cliffs, sea lions bask on the rock ledges by the shore and great white sharks patrol the surrounding sea. Its summit stands a little above the rest and commands a wide view, so a radar station was built there long ago to watch the sea beyond the mouth of the bay, its crews feeling their way up and down the hill along a rope in the fog when the watch changed; it was later abandoned, leaving only empty equipment rooms and rusting antenna mounts.\nA start-up once planned to turn the radar station into an \"offshore remote-work resort\", promising \"productive work at the edge of the world\". In its promotional film South Fog Rock was bathed in sunshine, but the day after the film was shot the fog came down and never lifted. The company lasted six months in the murk, its staff holding video calls every day in the radar station with nothing but white outside the windows and the connection coming and going, and then it folded; a sign reading \"Welcome to the Future\" still hangs in the radar station.\nToday the only visitors are the occasional workmen who come to service the navigation marks and researchers watching birds. They say the best thing on the island is that sign: on foggy days it is the only thing on the whole island you can see clearly. The workmen always wipe it clean before they leave, so that when the future really does arrive, they say, it will at least be able to find the place."
  - id: nat_y1f76c
    subtype: island
    status: generated
    detect: { kind: island, at_km: [311.8, 202.2] }
    names: { zh: 海市蜃楼岛, en: Mirage Island, es: Isla Espejismo }
    notes:
      zh: "海市蜃楼岛是东海岸外的荒岛，面积约 220 平方公里，最高处海拔约 94 米，属帕姆斯普林克勒市帝国尘区。岛上是沙丘、盐滩和几座光秃秃的石山，几乎没有植被。夏天的热浪从荒漠和海面一起蒸腾起来，从岸上看去，岛的轮廓总在晃动，时而像浮在半空，时而又像沉进了水里，岛名由此而来。岛上没有淡水，一年也下不了几场雨，只有海鸟和蜥蜴能在这里过日子。冬天起大风时，沙丘会整片挪动，岛的海岸线每年都和海图上画的不太一样。\n岛上规划过一座「沙漠智慧城市」，开发商卖出了几千套期房，宣传册上画着玻璃塔楼、人工运河和无人驾驶的空中巴士。交付日那天，岛上只有一块写着「即将上线」的广告牌。买房的人每年乘船来看一次，看完回去接着还贷。\n那块广告牌如今是岛上唯一的建筑，被风沙打磨得发白，夏天在热浪里也跟着晃动，从岸上看去，有时真像有一座城立在那里。帝国尘区的渔民说，开发商当年最大的本事就是挑对了地方：在海市蜃楼岛上，什么都看得见，什么都摸不着。业主们组织过维权会，开会地点选在岸边的一家冷饮店，会开到一半，大家总要跑到窗边看一眼岛上的「城」。"
      en: "Mirage Island is a barren island off the east coast, about 220 km² in area and rising to about 94 metres, part of Imperial Dust District in Palm Sprinklers City. It is all dunes, salt flats and a few bare stony hills, with almost no vegetation. In summer the heat rises shimmering from the desert and the sea alike, so that from the shore the island's outline never stands still, at times seeming to float in mid-air and at times to sink into the water, which is how it got its name. There is no fresh water and hardly any rain in a year, and only seabirds and lizards can make a living there. When the big winter winds blow, whole dunes shift, and every year the island's shoreline differs a little from the one on the chart.\nA \"desert smart city\" was once planned on the island, and the developer sold thousands of homes off the plan, its brochures showing glass towers, artificial canals and driverless sky buses. On handover day there was nothing on the island but a billboard reading \"Coming Soon\". The buyers sail out once a year to look at it, then go home to keep paying their mortgages.\nThe billboard is now the island's only structure, bleached white by wind and sand, and in summer it shimmers in the heat with everything else, so that from the shore it sometimes really looks as if a city stands there. Fishermen in Imperial Dust say the developer's real talent was choosing the right spot: on Mirage Island you can see everything and touch nothing. The owners have formed a protest committee that meets in a juice bar on the shore, and halfway through every meeting they all go to the window to take a look at the \"city\" on the island."
  - id: nat_vkv6js
    subtype: island
    status: generated
    detect: { kind: island, at_km: [191.8, 372.2] }
    names: { zh: 脱离岛, en: Secession Island, es: Isla Secesión }
    notes:
      zh: "脱离岛是东北海岸外的岛，面积约 150 平方公里，最高处海拔约 156 米，属雷达克特市熔岩高原区。岛是火山熔岩堆起来的，黑色的熔岩台地上长着松林，海岸是一段段被海浪啃出的熔岩礁，冬天风暴大，夏天凉爽多雾。岛上只有二十几户人家，靠捕鱼、打零工和社会保障支票过日子，一条土路把几处房子和小码头连在一起。岛和本岛之间隔着一道风急浪高的海峡，天气不好时渡船就停开，岛民一连几天出不了门。\n待建州运动的支持者在岛上升起过自己的旗，宣布这里是「新州的第一块领土」，州政府没有理会。雷达克特北部的居民几十年来一直在争取从加州分出去另立一州，这座岛是他们唯一真正插上了旗的地方。岛上的二十几户人家至今自称「已经独立」，但每个月照样坐船去本岛领社会保障支票。\n岛民的旗挂在码头边的旗杆上，海风大，一年要换好几面，新旗由本岛的支持者寄来，信封上的地址写着「待建州脱离岛」，邮局照常投递。每年运动的纪念日，岛民在码头上办一场小小的「独立庆典」，烤鱼、唱歌、轮流发表演说，散场前总有人提醒大家：明天是领支票的日子，船早上七点开。岛上的孩子在本岛上学，平日住在亲戚家，周末才回到「独立的家乡」。"
      en: "Secession Island lies off the north-east coast, about 150 km² in area and rising to about 156 metres, part of Lava Plateau District in Redacted City. It is built of volcanic lava, with pine woods on black lava tablelands and a shore of lava reefs gnawed by the waves; winters are stormy and summers cool and foggy. Only twenty-odd households live there, getting by on fishing, odd jobs and social security cheques, with a dirt track linking the few houses and the little jetty. A rough, windy strait separates it from the main island, and in bad weather the boat stops running and islanders cannot get off for days.\nSupporters of the State of Pending movement once raised their own flag here and declared it \"the first territory of the new state\"; the state government ignored them. People in the north of Redacted have campaigned for decades to split from California and form a state of their own, and this island is the only place where they have actually planted a flag. Its twenty-odd households still call themselves \"already independent\", while crossing to the main island by boat each month to collect their social security cheques.\nThe islanders' flag flies from a pole by the jetty, and the sea wind is so strong that several have to be replaced each year; new ones are posted by supporters on the main island, addressed to \"Secession Island, State of Pending\", and the post office delivers them as usual. On the movement's anniversary each year the islanders hold a small \"independence celebration\" on the jetty, grilling fish, singing and taking turns at speeches, and before they break up someone always reminds everyone that tomorrow is cheque day and the boat leaves at seven. The island's children go to school on the main island, staying with relatives during the week and coming home to their \"independent homeland\" only at weekends."
  # ── Archipelagos ─────────────────────────────
  - id: nat_azpgnq
    subtype: archipelago
    status: generated
    islands: [nat_0vhyfv, nat_j044py, nat_trcbf4, nat_12g09q, nat_weawv6, nat_ff8gyg]
    names: { zh: 离岸群岛, en: Offshore Islands, es: Islas Paraíso Fiscal }
    notes:
      zh: "离岸群岛是南海岸外的六座岛：西边的空壳岛、信箱岛、信托岛和抽屉岛，东边的亿万岛和地堡岛，合计面积约 3100 平方公里，合起来就是离岸群岛市。西边四座归避税列岛区，东边两座归亿万岛区；最大的空壳岛约 1290 平方公里，是自治州主岛以外最大的岛。岛上有峡谷、海崖、橡树林和灌丛，夏天多雾，冬天有雨，海崖上栖息着成群的海鸟和海狮，空壳岛上还有只有家猫大小的灰狐狸。\n群岛是自治州的避税天堂。全市只有 1.5 万人，岛上登记的公司却比海鸟还多：在岛上登记的公司不交州税，岛上的豪宅也不交房产税，理由是「海岛的土地还在测量中」。西边四座岛上是一排排刻着公司名字的邮箱、铁皮屋里的文件柜和一层套一层的信托；东边的亿万岛是度假豪宅和游艇码头，地堡岛的山体被挖空，能让几百个家庭在地下住上几年。\n岛与岛之间有私人渡轮和直升机，却没有一班公共航线，岛民去本岛看病要搭送货的船。离岸群岛人说岛上最多的是三样东西：邮箱、海鸟和律师。每年报税季前后，海面上的私人游艇和送信船明显多起来，渔民说那是一年里唯一需要给大船让路的季节。"
      en: "The Offshore Islands are the six islands off the south coast, Shell, Mailbox, Trust and Drawer Islands in the west and Billionaire and Bunker Islands in the east, about 3,100 km² in all, which together make up Offshore Islands City. The western four belong to Tax Shelter Islands District and the eastern two to Billionaire Isles District; the largest, Shell Island, at about 1,290 km², is the largest island in the state after the main island. The islands have canyons, sea cliffs, oak woods and scrub, with fog in summer and rain in winter; great colonies of seabirds and sea lions live on the cliffs, and Shell Island also has grey foxes no bigger than house cats.\nThe group is the state's tax haven. The whole city has only 15,000 people, yet more companies are registered on the islands than there are seabirds: companies registered here pay no state tax, and the mansions pay no property tax either, on the grounds that \"the island's land is still being surveyed\". The four western islands hold row upon row of mailboxes engraved with company names, filing cabinets in a tin shed and trusts nested one inside another; in the east, Billionaire Island has holiday mansions and yacht marinas, and Bunker Island's hill has been hollowed out to let hundreds of families live underground for years.\nPrivate ferries and helicopters run between the islands, but not one public service, and islanders who need a doctor on the main island catch a supply boat. Offshore islanders say the three things the islands have most of are mailboxes, seabirds and lawyers. Around tax season the private yachts and mail boats noticeably multiply, and fishermen say it is the only time of year they have to give way to big ships."
  - id: nat_5tk0yj
    subtype: archipelago
    status: generated
    islands: [nat_qhdwv6, nat_ghqd1h, nat_8acs4z]
    names: { zh: 雾礁群岛, en: Fog Rocks, es: Peñones de Niebla }
    notes:
      zh: "雾礁群岛是风投湾湾口外四十多公里的三座花岗岩礁岛：大雾礁、北雾礁和南雾礁，合计面积约 68 平方公里，属贝叶斯市先验区。三座岛都是从海里拱起的花岗岩，岛上几乎没有土，礁岩被海浪和大风磨得光秃，最高的大雾礁顶上也只有一百多米。岛外的海水陡然变深，深处的冷水带着养分翻上来，养活了成群的鱼、海鸟和海狮，也引来了大白鲨，这一片海是它们的天下。\n群岛一年里大半时间都在雾里。夏天的海雾从这一带涌向湾口，再漫进海湾，湾区的人说想知道明天的天气，看雾礁就行：看得见雾礁，就是要变天了。大雾礁上有一座气象站、一座自动灯塔和一座海底光缆的登陆站，湾区的数据从这里进出大洋；南雾礁顶上有一座废弃的雷达站；北雾礁不许登陆，只有鸟类研究员每年来数一次海鸟。\n群岛名义上归先验区管，可先验区的人很少来，渡海要几个小时，风浪大时根本开不了船。区政府每年照例给群岛寄一份「市政服务满意度调查」，从没收到过回信。海钓的人爱在群岛外下竿，常常钓到一半就被海狮抢走了鱼；要是看见水里一道灰影掠过，船老大会立刻收线，说一句「今天就到这里」。"
      en: "The Fog Rocks are three granite islands some forty-odd kilometres off the mouth of Venture Bay, Great Fog Rock, North Fog Rock and South Fog Rock, about 68 km² in all and part of Prior District in Bayesian City. All three are granite thrust up out of the sea, with almost no soil, their rock scoured bare by waves and wind; even Great Fog Rock, the highest, tops out at little over a hundred metres. Beyond them the sea deepens sharply and cold, nutrient-rich water wells up from below, feeding shoals of fish, seabirds and sea lions and drawing great white sharks, whose realm these waters are.\nThe islands spend most of the year in fog. In summer the sea fog rolls from here towards the mouth of the bay and on into it, and Bay Area people say that to know tomorrow's weather you need only look for the Fog Rocks: if you can see them, the weather is about to change. Great Fog Rock has a weather station, an automatic lighthouse and a submarine-cable landing station through which the Bay's data passes to and from the ocean; South Fog Rock has an abandoned radar station on its top; North Fog Rock is closed to landing, visited only by bird researchers who come once a year to count the seabirds.\nThe islands belong to Prior District in name, but people from the district rarely come: the crossing takes hours, and in heavy seas no boat can go at all. Every year the district office dutifully posts the islands a \"municipal services satisfaction survey\" and has never had a reply. Sea anglers like to fish off the islands and often have their catch snatched by a sea lion halfway in; and if a grey shadow slides past in the water, the skipper reels in at once and says, \"That'll do for today.\""
  # ── Bays ─────────────────────────────────────
  - id: nat_x4vdb3
    subtype: bay
    status: generated
    detect: { kind: bay, at_km: [106.8, 263.8] }
    names: { zh: 风投湾, en: Venture Bay, es: Bahía del Capital Riesgo }
    notes:
      zh: "中部海岸的大海湾，面积约 1330 平方公里，是自治州最大的海湾，只靠一道窄窄的海峡通向大洋，湾里分出南湾、北边的两片内湾和三角洲的水道，算力岛和遣返岛在湾中。湾名来自湾边的风险投资：两岸曾经挤满了投资基金，基金把钱投进湾边的公司，公司把湾边的房子买下来，房子空着等升值。如今公司换成了机器，房子还空着，湾里的潮水照旧一天涨落两回。"
      en: "The great bay of the central coast, about 1,330 km² and the largest bay in the state, reaching the ocean only through a narrow strait; it divides into the south arm, two inner bays to the north and the channels of the delta, with Compute Island and Deportation Island in its waters. The name comes from venture capital: its shores were once crowded with funds, which put money into the companies by the bay, which bought up the houses by the bay and left them empty to appreciate. The companies have since become machines and the houses are still empty, while the tide still rises and falls twice a day."
  - id: nat_bqkwhp
    subtype: bay
    status: generated
    detect: { kind: fjord, at_km: [269.8, 54.2] }
    names: { zh: 圣遣返湾, en: San Deportes Bay, es: Bahía de San Deportes }
    notes:
      zh: "南海岸的天然良港，面积约 64 平方公里，一道沙嘴挡在湾口，湾里停着海军舰艇、移民执法局的巡逻艇和遣返船。遣返船每天早上出港，傍晚空着回来；码头上的电子屏实时显示当天的遣返人数，旁边的游客中心卖印着这块屏幕的明信片。"
      en: "The natural harbour of the south coast, about 64 km², sheltered by a sandspit across its mouth, where navy ships, Immigration Enforcement patrol boats and deportation ships lie at anchor. The deportation ships sail every morning and come back empty in the evening; a screen on the quay shows the day's deportation count as it happens, and the visitor centre next to it sells postcards of the screen."
  - id: nat_jeyde3
    subtype: bay
    status: generated
    detect: { kind: bay, at_km: [283.8, 53.8] }
    names: { zh: 隔离墙湾, en: Wall Bay, es: Bahía del Muro }
    notes:
      zh: "圣遣返以东的海湾，面积约 270 平方公里。旧国界成了海岸之后，界墙没有拆，而是被一直修进了海里：一道钢柱墙从岸上伸进湾中好几公里，墙上装着摄像头和探照灯，墙外是空荡荡的大海。移民执法局说这道墙「防住了来自海上的一切」，渔民说它防住的主要是鱼。"
      en: "The bay east of San Deportes, about 270 km². When the old national border became coast, the border wall was not taken down but carried on into the sea: a wall of steel posts runs several kilometres out into the bay, with cameras and searchlights, and beyond it there is nothing but empty ocean. Immigration Enforcement says the wall 'stops everything that comes from the sea'; fishermen say what it mostly stops is fish."
  - id: nat_h7w8ks
