      zh: "东海岸外的荒岛，面积约 220 平方公里，岛上是沙丘、盐滩和几座光秃秃的石山，夏天热浪蒸腾，从岸上看去岛的轮廓总在晃动。岛上规划过一座「沙漠智慧城市」，开发商卖出了几千套期房，交付日只有一块写着「即将上线」的广告牌；买房的人每年乘船来看一次，看完回去接着还贷。"
      en: "A barren island off the east coast, about 220 km², all dunes, salt flats and a few bare stony hills, so shimmering with summer heat that from the shore its outline never stands still. A 'desert smart city' was once planned here and the developer sold thousands of homes off the plan; on handover day there was only a billboard reading 'Coming Soon'. The buyers sail out once a year to look at it, then go home to keep paying their mortgages."
  - id: nat_vkv6js
