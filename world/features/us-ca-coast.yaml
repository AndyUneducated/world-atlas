      en: "A bay on the coast of Redwood Curtain District, about 300 km², with two small islands at its mouth. On the slopes around it clear-cut logging plots alternate with old redwood forest, so that from the sea they look like a patched green blanket; the logging company has put up a sign on the hillside reading 'For every tree we cut, we plant a promise.'"
  # ── Capes ────────────────────────────────────
