    detect: { kind: bay, at_km: [57.2, 372.2] }
    names: { zh: 谦卑湾, en: Humbled Bay, es: Bahía Humilde }
    notes:
      zh: "北海岸唯一的大海湾，面积约 230 平方公里，两道长长的沙嘴把湾和外海隔开，湾里是牡蛎养殖场、渔港和运原木的码头。湾边的老伐木城维多利亚式木屋保存完好，本地人介绍自己时总说「我们以前很有钱，现在很谦卑」。"
      en: "The only large bay on the north coast, about 230 km², shut off from the open sea by two long sandspits, with oyster farms, a fishing harbour and log quays inside. The old lumber town's Victorian houses by the bay are well kept, and locals always introduce themselves with 'We used to be rich; now we're humble.'"
  - id: nat_mmmttg
    subtype: bay
    status: generated
    detect: { kind: bay, at_km: [238.2, 93.2] }
    names: { zh: 滞港湾, en: Backlog Bay, es: Bahía del Atasco }
    notes:
      zh: "失落天使港所在的海湾，面积约 70 平方公里，防波堤后面是集装箱码头和自动化的龙门吊。湾外常年停着排队等泊位的货轮，最多时排出去几十公里；有些船等得太久，船员干脆在船上种菜养鸡，搁浅滩区的人划着小船去船上买鸡蛋。"
      en: "The bay of the port of Lost Angeles, about 70 km², with container terminals and automated gantry cranes behind its breakwater. Freighters queue outside all year for a berth, at times stretching out tens of kilometres; some ships wait so long that their crews grow vegetables and keep chickens on deck, and people from Long Beached row out to buy eggs from them."
  - id: nat_82yck8
    subtype: bay
    status: generated
    detect: { kind: bay, at_km: [356.2, 78.8] }
    names: { zh: 尘湾, en: Dust Bay, es: Bahía del Polvo }
    notes:
      zh: "东海岸南段的海湾，面积约 440 平方公里，湾岸是沙丘和盐滩，背后的荒漠一直伸到水边。夏天的风从荒漠吹向大海，把沙尘铺在湾面上，海水常常是土黄色的；湾边只有一座海水淡化厂和一个渔村，淡化厂的水全部送去喷灌区的高尔夫球场。"
      en: "A bay on the southern part of the east coast, about 440 km², its shores dunes and salt flats with the desert running right down to the water. In summer the wind blows from the desert out to sea and lays dust across the bay, often turning the water a muddy yellow; the only things on its shore are a desalination plant and a fishing village, and every drop from the plant goes to the golf courses of Sprinkler District."
  - id: nat_zqy6gp
    subtype: bay
    status: generated
    detect: { kind: bay, at_km: [184.8, 404.2] }
    names: { zh: 待定湾, en: Pending Bay, es: Bahía Pendiente }
    notes:
      zh: "东北海岸的海湾，面积约 320 平方公里，湾边是松林、熔岩和几座伐木小镇。待建州运动打算把未来的州首府建在湾边，选址的木桩已经打了三回，每回都被冬天的风暴冲走，湾名由此而来。"
      en: "A bay on the north-east coast, about 320 km², with pine woods, lava and a few logging towns on its shores. The State of Pending movement plans to build its future capital beside it; the site's marker posts have been driven in three times and each time washed away by the winter storms, which gives the bay its name."
  - id: nat_rh7amj
    subtype: bay
    status: generated
    detect: { kind: bay, at_km: [62.2, 338.2] }
    names: { zh: 皆伐湾, en: Clearcut Bay, es: Bahía de la Tala Rasa }
    notes:
      zh: "红木帘区海岸的海湾，面积约 300 平方公里，湾口有两座小岛。湾边的山坡上，一片片砍光的伐木场和老红木林交错，从海上看去像一块打了补丁的绿毯子；伐木公司在山坡上竖了一块牌子，写着「每砍一棵，就种下一个承诺」。"
      en: "A bay on the coast of Redwood Curtain District, about 300 km², with two small islands at its mouth. On the slopes around it clear-cut logging plots alternate with old redwood forest, so that from the sea they look like a patched green blanket; the logging company has put up a sign on the hillside reading 'For every tree we cut, we plant a promise.'"
  # ── Capes ────────────────────────────────────
  - id: nat_ndkmwp
