      en: "The southern rock of the Fog Rocks, about 20 km², with an abandoned radar station on its top. A start-up once planned to turn it into an 'offshore remote-work resort'; the day after its promotional film was shot the fog came down and never lifted, the company lasted six months in the murk before folding, and a sign reading 'Welcome to the Future' still hangs in the radar station."
  - id: nat_y1f76c
