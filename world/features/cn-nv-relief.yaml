# Peaks, passes and glaciers of North Viking Island found by the generator
# (pipeline/atlas/relief.py). Each entry names the landform of `detect.kind` nearest to
# `detect.at_km` (design km). Elevation and prominence come from the generated terrain.
features:
  # ── Peaks (highest first) ────────────────────────────────
  - id: nat_7fcbdm
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [214.8, 111.8] }
    names: { zh: 王座峰, en: Throne Peak, art-x-viking: Thronspitze }
    notes:
      zh: 全岛最高峰，马斯林山脉北翼与西翼交会处的主峰，终年被王座冰原覆盖。
      en: The highest summit of the island, where the northern and western arms of the Maslin Range meet; capped all year by the Throne Icefield.
  - id: nat_m9thfe
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [212.8, 67.2] }
    names: { zh: 南冠峰, en: Southcrown, art-x-viking: Südkrone }
    notes:
      zh: 马斯林山脉西翼南端的高峰，峰顶冰川在晴天自新城市清晰可见。
      en: High summit at the southern end of the Maslin Range's western arm; its ice cap is clearly visible from New City on fine days.
  - id: nat_4xvk5v
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [148.2, 71.8] }
    names: { zh: 洛龙峰, en: Lorond Peak, art-x-viking: Lorondspitze }
    notes:
      zh: 洛龙山脉最高峰，洛龙山市因其得名。
      en: The highest summit of the Lorond Range, which gave Lorond Mountain City its name.
  - id: nat_8ess6e
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [148.2, 111.8] }
    names: { zh: 龙首峰, en: Dragonhead, art-x-viking: Drachenkopf }
    notes:
      zh: 洛龙山脉北段的主峰，与南面的山脊合称"龙脊"，俯瞰龙关。
      en: The main summit of the northern Lorond Range, overlooking Dragon Pass; with the ridges to the south it forms the "Dragon's Spine".
  - id: nat_nans6b
    subtype: peak
