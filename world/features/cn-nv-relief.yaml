    names: { zh: 杉岭冰川, en: Fir Ridge Glacier, art-x-viking: Fichtenkammgletscher }
    notes:
      zh: 洛龙山脉最南端的小冰川，面积约三十五平方公里，位于洛龙峰南侧，平均海拔两千一百多米。冰川所在的山地属洛龙山市杉岭区，四周是云杉和冷杉组成的原始针叶林，冰川与森林之间只隔着一片碎石和高山草甸，冰雪与林海近在咫尺。杉岭森林公园的林间步道从山坡上的云杉原始林一路上行，通往杉岭冰川的冰舌，夏季是徒步者喜爱的一日路线，沿途可以看到冰川退缩后留下的冰碛和冰蚀湖。冰川融水汇成清澈的溪流，流入杉岭的林海，为杉岭区的森林涵养水源。
      en: A small glacier at the southern end of the Lorond Range, about 35 km², lying south of Lorond Peak at a mean height of just over 2,100 m. The mountains around it belong to Fir Ridge District of Lorond Mountain City and are clothed in old-growth spruce and fir; only a band of scree and alpine meadow separates ice from forest, so the glacier and the trees can be seen side by side. A trail from Fir Ridge Forest Park climbs through the old spruce to the glacier's tongue, a favourite day walk in summer that passes the moraines and small ice-carved lakes left behind as the ice retreated. Its meltwater gathers into clear streams that run down into the forests of Fir Ridge and keep them watered.
  - id: nat_a7552a
