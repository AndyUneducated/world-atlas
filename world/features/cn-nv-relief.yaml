    names: { zh: 德雷卡廷冰川, en: Drekatind Glacier, art-x-viking: Drekatindgletscher }
    notes:
      zh: 洛龙山脉北段主峰德雷卡廷峰周围的冰川，面积近一百平方公里，最高处海拔两千两百多米，横跨洛龙山市龙关区和勒克尔市澄湖区。冰川环绕德雷卡廷峰顶铺开，从远处看像是龙头上的一圈白鬃，与南面的山脊合称「龙脊」。冰川北面不远是澄湖，晴天时从澄湖北岸南望，德雷卡廷峰和它的冰川倒映在湖中；龙关高速则在德雷卡廷峰以北穿过洛龙山脉主脊。融雪和冰川融水顺山谷流下，是澄湖的水源之一。冰川一带不通公路，夏季有向导从龙关集镇带领登山者上山。
      en: The glacier around Drekatind, the main summit of the northern Lorond Range, nearly 100 km² of ice reaching a little over 2,200 m and spanning Dragon Pass District of Lorond Mountain City and Clearlake District of Lekor. The ice spreads round the summit like a white mane on a dragon's head, and with the ridges to the south it forms the "Dragon's Spine". Clear Lake lies a short way north, and from its north shore on a fine day Drekatind and its glacier are mirrored in the water; the Long Pass Expressway passes beneath the main ridge north of Drekatind. Snowmelt and meltwater running down the valleys are among the sources of Clear Lake. No road comes near the ice, and in summer guides from the town of Dragon Pass lead climbers up.
  - id: nat_af1705
