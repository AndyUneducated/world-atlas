features:
  # ── Peaks (highest first) ────────────────────────────────
  - id: nat_nans6b
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [258.8, 113.2] }
    names: { zh: 蒂鲁尤阿克峰, en: Mount Tirrujuaq, art-x-viking: Tirrujuaqspitze }
    wonder:
      zh: 世界最高峰，海拔 4313 米
      en: The highest peak in the world, 4,313 m
    notes:
      zh: "蒂鲁尤阿克峰海拔 4313 米，是世界最高峰，也是北维京岛的最高峰；因为它是全岛最高点，相对高度也是 4313 米。山峰是马斯林山脉北翼东端高山群的主峰，属马斯林山市群峰训练管理区，东面俯临星港区。马斯林山脉呈马蹄形从北、西、南三面环抱马斯林山盆地，北翼最高最险，自雅尔斯托尔峰向东依次是西坪垭口、卡瓦卢克图克峰、霍尔沃思峰和蒂鲁尤阿克峰。峰顶被雅尔斯托尔冰原东端的冰雪覆盖，西接海拔 4236 米的霍尔沃思峰和 4213 米的卡瓦卢克图克峰，三座四千米级高峰连成一线，分别是全岛第一、第二、第三高峰。\n雅尔斯托尔冰原面积五千多平方公里，是北维京岛最大的冰原，西起雅尔斯托尔峰，东到蒂鲁尤阿克峰，平均海拔三千多米。北维京岛的雪线在海拔 2200 米上下，蒂鲁尤阿克峰比雪线高出两千多米，山体上部终年冰封，冰川从峰顶向四周的山谷伸展，融水汇入马斯林河，向东流过星港区入海。马斯林山是全岛降水最少的城市，晴天多，从星港区和西坪台地都能望见蒂鲁尤阿克峰的雪顶。\n峰顶建有深空太空军的蒂鲁尤阿克峰光学观测站：这里常在云层之上，空气稀薄干燥，夜空极为清澈，站内的 3 台光学望远镜可以拍摄很暗的卫星和太空碎片，测定它们的轨道；一套卫星激光测距仪向装有反射器的卫星发射激光脉冲，把距离精确到厘米，为导航卫星和测地卫星校准轨道。观测站约有 60 人，站房保温密封，室内补充氧气以减轻高山反应，观测数据汇集到星港指挥中心。西北方霍尔沃思峰峰顶的激光站与它遥遥相望，晴夜里偶尔能望见一道细细的光柱从霍尔沃思峰顶射向天空，星港区的居民管它叫「霍尔沃思的针」。\n蒂鲁尤阿克峰不通公路，值守人员每隔数周靠直升机轮换，峰顶是军事禁区，不对公众开放，也没有登山路线。观测站的值守人员轮换下山时，总会给星港区的孩子们带回一张峰顶拍到的星空照片，孩子们把照片贴在教室墙上，说那是「最高的窗户」看到的天。盆地里的人说马斯林山是「一只张开的手」，蒂鲁尤阿克峰就是最高的那根手指，冬天的寒风被手指挡在外面，所以盆地里的雪比山上少得多。西坪台地的牧民则看西边卡瓦卢克图克峰顶上空的极光预报天气，三座高峰在他们眼里各有各的用处。"
      en: "Mount Tirrujuaq, 4,313 m, is the highest peak in the world and the highest summit on North Viking Island; as the island's highest point its prominence is also 4,313 m. It is the main peak of the high massif at the eastern end of the Maslin Range's northern arm, in the High Peaks Training Area of Maslin Mountain City, looking down on Starport District to the east. The Maslin Range curves like a horseshoe round the Maslin Mountain basin on the north, west and south; its northern arm is the highest and steepest, running east from Jarlstol through the West Heath Saddle, Mount Qavvaluktuuq and Mount Hallworth to Mount Tirrujuaq. The summit lies under the snow of the eastern Jarlstol Icefield, with Mount Hallworth, 4,236 m, and Mount Qavvaluktuuq, 4,213 m, to the west forming a line of three four-thousand-metre peaks, the first, second and third highest on the island.\nThe Jarlstol Icefield, over 5,000 km², is the largest icefield on North Viking Island, stretching from Jarlstol in the west to Mount Tirrujuaq in the east at a mean height of over 3,000 m. The island's snowline lies at about 2,200 m, so Mount Tirrujuaq rises more than 2,000 m above it; the upper mountain is ice-bound all year, glaciers spread from the summit into the valleys around, and their meltwater feeds the Maslin River, which flows east through Starport District to the sea. Maslin Mountain is the driest city on the island, with many clear days, and the mountain's snowy top can be seen from Starport and the West Heath plateau.\nOn the top stands the Deep Space Force's Mount Tirrujuaq Optical Station. Often above the clouds, in thin, dry air and very clear skies, its three optical telescopes can photograph faint satellites and space debris and measure their orbits, and a satellite laser ranging system fires laser pulses at satellites carrying reflectors, measuring distance to the centimetre to calibrate the orbits of navigation and geodetic satellites. The station has about 60 staff in a sealed, insulated building with extra oxygen indoors to ease altitude sickness, and its data goes to the Starport Command Centre. The laser station on the summit of Mount Hallworth faces it from the north-west, and on clear nights a thin beam of light can sometimes be seen shooting into the sky from Mount Hallworth's top, which Starport people call \"Hallworth's needle\".\nNo road reaches Mount Tirrujuaq; the crew rotates by helicopter every few weeks, and the summit is a restricted military area, closed to the public, with no climbing route. When the observatory crew rotate down from the summit they always bring the Starport children a photo of the night sky taken at the top, and the children pin it up in class as the sky seen from \"the highest window\". People in the basin say Maslin Mountain is \"an open hand\", and Mount Tirrujuaq is its tallest finger: the fingers keep out the winter winds, which is why the basin gets far less snow than the mountains. The herders of the West Heath plateau, for their part, forecast the weather by the aurora over Mount Qavvaluktuuq to the west; to them each of the three great peaks has its own use."
  - id: nat_w3c8nk
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [253.2, 116.8] }
    names: { zh: 霍尔沃思峰, en: Mount Hallworth, art-x-viking: Hallworthspitze, art-x-buckham: Picco Hallworth }
    notes:
      zh: "马斯林山脉北翼东段高山群的中峰，海拔四千二百三十多米，是北维京岛第二高峰，位于蒂鲁尤阿克峰西北，属群峰训练管理区。峰顶三面冰斗环抱，形如冠冕，与西南方的索利峰遥遥相对，两峰一北一南。峰顶建有深空太空军的霍尔沃思峰激光站：高山上大气稀薄，激光衰减小，站内的自适应光学系统可以把光束精确地聚焦到轨道上的目标，用于激光通信、能量传输试验和清除小块太空碎片。霍尔沃思峰不通公路，人员和物资靠直升机运送，四周是雅尔斯托尔冰原的冰川，峰顶也不对公众开放。激光站工作时，晴夜里偶尔能从远处望见一道细细的光柱从峰顶射向天空，星港区的居民管它叫「霍尔沃思的针」，说峰顶在给天上的卫星「穿线」。"
      en: "The central summit of the high massif on the eastern part of the Maslin Range's northern arm, a little over 4,230 m and the second highest peak on North Viking Island, lying north-west of Mount Tirrujuaq in the High Peaks Training Area. Cirques ring its summit on three sides like a crown, and it faces Mount Sorley far to the south-west, one crown in the north and one in the south. On its summit stands the deep-space force's Mount Hallworth Laser Station: the thin air at altitude weakens the beam far less, and adaptive optics focus it precisely on targets in orbit for laser communication, power-beaming tests and nudging small pieces of space debris out of orbit. No road reaches it; staff and supplies come by helicopter, the summit is surrounded by the ice of the Jarlstol Icefield, and it is closed to the public. When the laser station is working, a thin beam can sometimes be seen on clear nights rising from the summit, which Starport people call \"Hallworth's needle\", the mountain \"threading\" the satellites overhead."
  - id: nat_r6y4ex
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [245.2, 115.8] }
    names: { zh: 卡瓦卢克图克峰, en: Mount Qavvaluktuuq, art-x-viking: Qavvaluktuuqspitze, art-x-buckham: Picco Qavvaluktuuq }
    notes:
      zh: "马斯林山脉北翼的四千米级高峰，海拔四千二百一十多米，是北维京岛第三高峰，位于霍尔沃思峰西侧、西坪垭口以东，属马斯林山市群峰训练管理区。峰顶被雅尔斯托尔冰原覆盖，冰川从峰顶向南北两侧铺展。马斯林山的冬季漫长，夜晚晴朗时，极光常在峰顶上空舞动，从西坪台地或星港区望去，绿色的光带正好悬在峰顶之上，山峰因此得名。卡瓦卢克图克峰与东面的霍尔沃思峰、蒂鲁尤阿克峰连成一线，构成北翼东段的高山群。山峰位于军事训练区内，不通公路，也不对公众开放，只能从远处观赏。西坪台地的牧民说，极光悬在卡瓦卢克图克峰顶时，第二天的天气一定晴，于是放牧前先看一眼峰顶，成了当地人代代相传的「天气预报」。"
      en: "A four-thousand-metre summit in the northern arm of the Maslin Range, a little over 4,210 m and the third highest peak on North Viking Island, lying west of Mount Hallworth and east of West Heath Saddle in the High Peaks Training Area of Maslin Mountain City. Its top is buried in the Jarlstol Icefield, whose ice spreads from the summit down both sides. Winters in the Maslin Range are long, and on clear nights the aurora often dances above the peak; seen from the West Heath plateau or from Starport, the green curtains hang right over its summit, which gave it its name. With Mount Hallworth and Mount Tirrujuaq to the east it forms the high massif of the eastern northern arm. The peak lies inside the military training area, with no road and no public access, and can only be admired from afar. West Heath herders say that when the aurora hangs over the summit the next day will be fine, so a glance at the peak before driving out the herd has become the local forecast, handed down through generations."
  - id: nat_7fcbdm
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [214.8, 111.8] }
    names: { zh: 雅尔斯托尔峰, en: Jarlstol, art-x-viking: Jarlstol }
    notes:
      zh: "马斯林山脉北翼与西翼交会处的主峰，海拔四千零二十米，是北维京岛第四高峰，位于雅利基卢克市阿基尼克区。峰顶终年被雅尔斯托尔冰原覆盖，雅尔斯托尔冰原就从这里向东铺展到蒂鲁尤阿克峰，因此以雅尔斯托尔峰命名。从西面的雅利基卢克河谷或阿基尼克的阶地上望去，雅尔斯托尔峰巍然端坐在群峰之首，宽阔的山肩如同王座的扶手，山名由此而来。雅尔斯托尔峰西坡俯临上雅利基卢克改良区的荒野，南面经马斯林山口与索利峰山体相连，东面是西坪垭口。山峰不通公路，攀登须穿越冰原，是一条艰难的高山路线。阿基尼克的老人爱说，雅尔斯托尔峰是坐在王座上的老国王，冰原是他铺开的白袍，每到春天冰原边缘融水哗哗作响，就是「老国王在抖袍子」。"
      en: "The main summit where the northern and western arms of the Maslin Range meet, 4,020 m and the fourth highest peak on North Viking Island, in Aaqqiniq District of Jaalikiluk City. It is capped all year by the Jarlstol Icefield, which spreads east from here to Mount Tirrujuaq and takes its name from the peak. Seen from the Jaalikiluk valley to the west or from the terraces of Aaqqiniq, Jarlstol sits enthroned at the head of the range, its broad shoulders like the arms of a throne, hence the name. Its western slopes look down on the wilderness of the Upper Jaalikiluk Improvement District; to the south it is linked to the Mount Sorley massif by Maslin Pass, and to the east lies West Heath Saddle. No road comes near, and the ascent across the icefield is a demanding high-mountain route. Aaqqiniq elders say Jarlstol is an old king on his throne with the icefield as his white robe, and when meltwater roars off the icefield's edge each spring, \"the old king is shaking out his robe\"."
  - id: nat_m9thfe
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [212.8, 67.2] }
    names: { zh: 索利峰, en: Mount Sorley, art-x-viking: Sorleyspitze }
    notes:
      zh: "马斯林山脉西翼南端的高峰，海拔三千零八十多米，相对高度一千三百多米，位于新城市北苑区与南驿区之间的高山上。峰顶被索利冰川覆盖，冰帽在晴天从新城市清晰可见，是新城的地标，与东北方的霍尔沃思峰南北相对。索利冰川以索利峰为中心向北铺展到马斯林山口南侧，是全岛第二大的冰川。北苑区北部的山脚下是森林和溪谷，新城居民常来这里徒步和野餐；登顶则须穿越冰川，属于高山探险路线，夏季也须结组并携带冰爪。新城的出租车司机习惯用索利峰来认方向，迷路的乘客只要问「索利峰在哪边」，司机就能告诉你往北还是往南，本地人笑称这是新城「最高的路牌」。"
      en: "The high summit at the southern end of the Maslin Range's western arm, just over 3,080 m with a prominence of over 1,300 m, standing in the mountains between North Gardens and South Post districts of New City. It is capped by the Sorley Glacier, whose ice is clearly visible from New City on fine days and serves as the city's landmark, and it faces Mount Hallworth far to the north-east, a southern crown answering a northern one. Centred on the peak, the glacier stretches north to just south of Maslin Pass and is the second largest on the island. The forests and stream valleys at the foot of the mountains in the north of North Gardens are a favourite with New City families for walks and picnics, while the summit itself is a high-mountain expedition across the ice, roped up and with crampons even in summer. New City's taxi drivers find their bearings by Mount Sorley, and a lost passenger need only ask \"which way is Sorley?\" to learn north from south; locals joke it is the city's tallest road sign."
  - id: nat_4xvk5v
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [148.2, 71.8] }
    names: { zh: 洛龙峰, en: Lorond Peak, art-x-viking: Lorondspitze }
    notes:
      zh: "洛龙山脉最高峰，海拔两千七百零一米，相对高度两千五百多米，位于洛龙山市纳帕图克区，洛龙山市因其得名。峰顶和北坡被一千多平方公里的洛龙冰川覆盖，南侧是较小的纳帕图克冰川，晴天时从塔夫鲁普库维克平原和新城都能望见它白色的山体。洛龙峰是北维京岛登山者心目中的经典山峰：登顶路线从纳帕图克区的森林出发，穿过冰川上的冰裂缝区到达峰顶，通常需要两到三天，夏季是唯一适合攀登的季节。上千平方公里的洛龙冰川、纳帕图克冰川和伊卡苏瓦湖一起，让洛龙山市成为登山和徒步的胜地。登顶洛龙峰的人回到山下的林场小镇，旅馆老板会在门口的木板上刻下他们的名字，木板已经换过好几块，旧板子挂在旅馆的大堂里当作「登顶者的家谱」。"
      en: "The highest summit of the Lorond Range, 2,701 m with a prominence of over 2,500 m, in Napatuuq District of Lorond Mountain City, which is named after it. Its summit and northern side are covered by the more than 1,000 km² of the Lorond Glacier, with the smaller Napatuuq Glacier to the south, and on a clear day its white bulk can be seen from the Tavrupukkuvik plain and from New City. Lorond Peak is a classic among North Viking climbers: the route to the top sets out from the forests of Napatuuq District and crosses the crevasse fields of the glacier, usually taking two or three days, and summer is the only season for an ascent. Together with the Lorond Glacier, the Napatuuq Glacier and Lake Ikkasuvva, it makes Lorond Mountain City a favourite with climbers and walkers. Climbers who reach the top of Lorond Peak have their names carved on a board by the inn door in the forest village below; the board has been replaced several times, and the old ones hang in the lobby as a \"family tree of summiteers\"."
  - id: nat_8ess6e
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [148.2, 111.8] }
    names: { zh: 德雷卡廷峰, en: Drekatind, art-x-viking: Drekatind }
    notes:
      zh: "洛龙山脉北段的主峰，海拔两千二百六十多米，位于洛龙山市卡蒂尔尤阿克区，南面俯瞰卡蒂尔尤阿克山口，峰顶周围是近一百平方公里的德雷卡廷冰川。山峰形似昂起的龙头，与南面的山脊合称「龙脊」；山下的卡蒂尔尤阿克在塔夫鲁纳克语里意为「大山口」，卡蒂尔尤阿克区以山口得名。德雷卡廷峰北面不远是克拉尔瓦滕湖，晴天时从克拉尔瓦滕湖北岸南望，雪峰倒映湖中，是全岛最受欢迎的风景之一；卡蒂尔尤阿克高速在德雷卡廷峰以北穿过洛龙山脉主脊。夏季登山者从卡蒂尔尤阿克集镇出发，由向导带领穿越德雷卡廷冰川登顶。卡蒂尔尤阿克的孩子们从小听「龙头」的故事：冰川是龙的白鬃，山口是龙张开的嘴，高速穿过主脊时，司机们会开玩笑说「我们又从龙嘴里过了一回」。"
      en: "The main summit of the northern Lorond Range, a little over 2,260 m, in Katirjuaq District of Lorond Mountain City, looking south over Katirjuaq and ringed by the nearly 100 km² of the Drekatind Glacier. Shaped like a dragon's raised head, it forms the \"Dragon's Spine\" with the ridges to the south, while the pass below is Katirjuaq, Tavrunaq for great pass, which gave the district its name. Lake Klarvatn lies a short way north, and from its north shore on a fine day the snow peak is mirrored in the water, one of the best-loved views on the island; the Katirjuaq Expressway passes beneath the main ridge north of the peak. In summer climbers set out from the town of Katirjuaq and cross the Drekatind Glacier to the summit with a guide. Katirjuaq children grow up on tales of the dragon's head, the glacier its white mane and the pass its open jaws, and drivers crossing the spine on the expressway joke \"through the dragon's mouth again\"."
  - id: nat_baqmce
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [146.2, 88.2] }
    names: { zh: 杉顶, en: Fir Top, art-x-viking: Fichtenkopf }
    notes:
      zh: "洛龙山脉中段的山峰，海拔两千三百七十多米，位于洛龙山市纳帕图克区，纳帕图克垭口以北。峰顶覆盖着一百二十多平方公里的杉顶冰川，山腰以下是茂密的云杉林，林海一直铺到山脚，纳帕图克区就因这片林海得名，「杉顶」则意为杉林之上的山顶。杉顶南面是纳帕图克垭口，纳帕图克公路和环北维京岛高速都在那一带经过洛龙山脉，晴天时从公路上就能望见杉顶的冰帽。纳帕图克林业研究所长期在杉顶的山坡上研究树种培育和林线变化，杉顶也是纳帕图克森林公园徒步路线的远景。林业研究所的人有一句玩笑话：「Napa pukku, sirmi tuqqa」，意思是「树往上长，冰留在原地」，他们每年测量林线往山上爬了多少，就像在给山量身高。"
      en: "A summit in the middle of the Lorond Range, a little over 2,370 m, in Napatuuq District of Lorond Mountain City, north of Napatuuq Col. Its summit carries the more than 120 km² of the Fir Top Glacier, and below its shoulders a dense spruce forest runs right down to the foot of the mountain; Napatuuq District takes its name from the forest, and Fir Top means the summit above the firs. Napatuuq Col lies to the south, where the Napatuuq Highway and the ring expressway pass through the range, and on a clear day the ice cap of Fir Top can be seen from the road. The Napatuuq Forestry Institute has long studied tree breeding and the tree line on its slopes, and the peak is the backdrop to the trails of Napatuuq Forest Park. The forestry institute staff have a joking saying, \"Napa pukku, sirmi tuqqa\", the trees grow, the ice stays put; every year they measure how far the treeline has climbed, as if taking the mountain's height."
  - id: nat_8e3s2q
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [68.8, 133.2] }
    names: { zh: 西尔米卡塔克峰, en: Mount Sirmiqattaq, art-x-viking: Sirmiqattaqspitze }
    notes:
      zh: "寒岭最高峰，海拔两千四百一十多米，相对高度两千一百多米，位于西北市寒岭区，峰顶的西尔米卡塔克冰川终年不化，像一顶白色的霜冠，山名由此而来。西尔米卡塔克峰西接基尔纳克山口和帕利基尔纳克峰，东经蒂鲁山口与瓦格恩廷峰相连，北坡直落北海岸，南坡是寒岭区的原始森林和高山草甸。西岸公路的终点离山峰只有十来公里，从那里徒步上山要穿过森林和草甸，登顶须穿越冰川，夏季有向导带队。寒岭生态研究站长期在西尔米卡塔克峰一带监测冰川和野生动物，冬季山脚下的越野滑雪道吸引着不少游客。寒岭区的人说，西尔米卡塔克峰的霜冠在秋天第一次变白的那天，就是该把屋外的木柴搬进柴房的日子，山上一白，家家户户都忙着搬柴。"
      en: "The highest summit of the Frost Ridge, a little over 2,410 m with a prominence of more than 2,100 m, in Frost Ridge District of Northwest City. The Sirmiqattaq Glacier on its summit never melts and sits on it like a crown of frost, hence the name. To the west lie Kirnaq Pass and Mount Paalikirnaq, to the east it connects through Tirru Pass to Vagntind, and its northern side drops straight to the north coast while its southern slopes carry the old-growth forest and alpine meadows of Frost Ridge District. The West Coast Highway ends only ten kilometres or so from the peak; from there the walk up leads through forest and meadow, and the summit itself is reached across the glacier, with guided parties in summer. The Frost Ridge Ecological Station has long monitored the ice and the wildlife around the peak, and in winter the cross-country ski trails at its foot draw many visitors. Frost Ridge people say that the day Sirmiqattaq's frost crown first turns white in autumn is the day to carry the woodpile into the shed, and as soon as the mountain whitens every household is busy hauling logs."
  - id: nat_chx2bf
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [52.2, 131.2] }
    names: { zh: 帕利基尔纳克峰, en: Mount Paalikirnaq, art-x-viking: Paalikirnaqspitze }
    notes:
      zh: "寒岭西段的山峰，海拔两千二百四十多米，位于西北市寒岭区，是寒岭的西端。山峰北坡陡峭，冬季积雪厚重，峰顶常年被白雪覆盖，远看像一头蹲伏的白狼。当地传说冬季有白狼在山上出没，山名由此而来，东边的基尔纳克山口也因此得名。寒岭生态研究站的红外相机确实常在这一带拍到狼的身影，寒岭的狼群主要在西段的原始森林中活动。夏季可以从基尔纳克山口沿山脊登顶，西南望寒岭峡湾，北望北海岸，是寒岭西段视野最好的山峰之一。研究站的研究员给红外相机拍到的每头狼都起了名字，最有名的是一头毛色几乎全白的老母狼，山下的孩子们都相信，传说里的白狼就是它。"
      en: "A summit in the western Frost Ridge, a little over 2,240 m, in Frost Ridge District of Northwest City, marking the western end of the ridge. Its northern face is steep, the winter snow lies deep, and the white-capped summit looks from afar like a crouching white wolf. Local legend tells of white wolves roaming the mountain in winter, which gave it its name, and Kirnaq Pass to the east takes its name from the same story. The camera traps of the Frost Ridge Ecological Station do often catch wolves here, and the wolf packs of the Frost Ridge range mostly through the old-growth forest of its western part. In summer it can be climbed along the ridge from Kirnaq Pass, with views south-west to Frost Fjord and north to the coast, one of the finest viewpoints on the western ridge. The research station staff have named every wolf the camera traps catch, the most famous an old she-wolf almost wholly white, and the children below are sure she is the white wolf of the legend."
  - id: nat_g4572m
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [84.2, 132.2] }
    names: { zh: 瓦格恩廷峰, en: Vagntind, art-x-viking: Vagntind }
    notes:
      zh: "西北市望星区寒岭东段的山峰，海拔两千一百多米，位于蒂鲁山口以东。冬夜从望星区南望，北斗七星正悬于峰顶之上，山峰因此得名，望星区的居民把它当作冬季夜空的路标。瓦格恩廷峰西接蒂鲁山口，东面是尼尔萨皮里山口和尼尔萨图克山，寒岭从这里开始逐渐降低。峰顶是一片碎石和苔原，夏季可以从蒂鲁山口沿山脊徒步登顶，一路俯瞰望星湾和北海岸。望星区夜空清澈，冬季长夜里常有极光掠过瓦格恩廷峰，天文爱好者喜欢在山脚取景，把山峰、北斗和极光同时摄入画面。望星区的天文爱好者有个默契：冬至前后的晴夜，大家会在山脚同一片空地上架起相机，第二天互相比谁拍到的星星和极光最好，输的人请大家喝热巧克力。"
      en: "A summit in the eastern Frost Ridge in Stargaze District of Northwest City, a little over 2,100 m, east of Tirru Pass. On winter nights, looking south from Stargaze District, the seven stars of the Plough hang directly above its summit, which gave it its name, and local people use it as a landmark in the winter sky. Tirru Pass lies to the west, and to the east Nirsapirri Pass and Nirsatuuq Hill, where the Frost Ridge begins to fall away. The summit is a stretch of scree and tundra, and in summer it can be climbed along the ridge from Tirru Pass, with views over Stargaze Bay and the north coast all the way. The skies of Stargaze District are clear, the aurora often sweeps over the peak in the long winter nights, and astronomers like to set up at its foot to frame the peak, the Plough and the aurora together. Stargaze's amateur astronomers have an understanding: on clear nights around midwinter they all set up cameras in the same clearing at the foot of the peak, compare their star and aurora shots next day, and the loser buys everyone hot chocolate."
  - id: nat_reahta
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [256.2, 59.2] }
    names: { zh: 天台山, en: Sky Terrace Mountain, art-x-viking: Himmelterrassenberg }
    notes:
      zh: "马斯林山脉南翼东端的孤峰，海拔一千七百二十多米，相对高度一千五百多米，矗立在天城市天台区的海岸背后。山顶是一片平坦的台地，远看像一座天上的平台，天台区和天城市都由此得名。山坡上是茂密的森林和步道，登山缆车从天台区的度假区出发，把游客送上山顶观赏日出、柳萨湾和天台峡湾；晴天时山顶视野开阔，东南海岸的度假区和海湾尽收眼底。天台山脚下是度假酒店和天台国际会议中心，山与海相依，是天城最有代表性的风景，四季都有游客登山。缆车的末班车总是挤满了要在山顶看日落的情侣，天台区的人说，在天台山顶求婚的人很多，答应的比例「比任何别的山都高」，不过谁也没认真统计过。"
      en: "An isolated summit at the eastern end of the Maslin Range's southern arm, just over 1,720 m with a prominence of more than 1,500 m, rising behind the coast of Sky Terrace District in Skytown. Its top is a flat tableland that looks from afar like a terrace in the sky, and it gave both the district and the city their names. Forests and footpaths cover its slopes, and a cable car from the resorts of Sky Terrace carries visitors to the top to watch the sunrise over Ljosa Bay and Sky Terrace Fjord; on a clear day the resorts and bays of the south-east coast are spread out below. Resort hotels and the Sky Terrace International Convention Centre stand at its foot, mountain and sea side by side, the most characteristic view in Skytown, and people climb it in every season. The last cable car up is always packed with couples going to watch the sunset, and Sky Terrace people say plenty propose on the summit and more say yes \"than on any other mountain\", though nobody has ever actually counted."
  - id: nat_m92aq4
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [229.8, 50.2] }
    names: { zh: 铁岗山, en: Iron Knoll, art-x-viking: Eisenkopf }
    notes:
      zh: "马斯林山脉南翼西端的山峰，海拔一千三百七十多米，位于萨科勒市铁岗区，山体富含铁矿，铁岗区因此得名。铁岗山一带的铁矿开采历史悠久，山上的露天矿坑和竖井曾是全岛最主要的铁矿来源；矿藏逐渐采尽后，部分矿山仍在开采石料和建筑骨料，规模已大为缩小，旧矿区周围铺开了铁岗先进制造产业园。铁岗矿业博物馆由旧铁矿的选矿厂改建，游客可以乘坐矿车深入地下巷道。山的西侧是萨科山口，古道翻过山口通往萨科湾；从山顶可以望见萨科湾、旧矿坑和山脚下的工业园。矿业博物馆的讲解员大多是老矿工，他们讲到矿车下井的那一段，总会把巷道里的灯关上几秒，让游客体会「矿工每天进山的那一刻」。"
      en: "A summit at the western end of the Maslin Range's southern arm, a little over 1,370 m, in Iron Knoll District of Sakole; its iron-rich rock gave the district its name. Iron has been mined here for a long time, and the open pits and shafts on the mountain were once the island's main source of ore. As the deposits ran out, some quarries carried on producing stone and aggregate on a much smaller scale, and the Iron Knoll Advanced Manufacturing Park has spread around the old mining area. The Iron Knoll Mining Museum, built in the old ore-dressing plant, takes visitors by mine cart into the underground galleries. Sako Pass lies to the west, where an old track crosses to Sako Bay, and from the summit you can see Sako Bay, the old pits and the industrial park at the foot of the mountain. Most of the mining museum's guides are old miners, and when they reach the part about the cars going underground they switch off the tunnel lights for a few seconds so visitors can feel \"the moment a miner went into the mountain every day\"."
  - id: nat_5xevyh
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [97.8, 128.2] }
    names: { zh: 尼尔萨图克山, en: Nirsatuuq Hill, art-x-viking: Nirsatuuqberg }
    notes:
      zh: "寒岭东端的山峰，海拔一千一百六十多米，位于西北市望星区，尼尔萨皮里山口以东。山顶两座峰头并立，中间隔着一道浅浅的鞍部，远看形似一对鹿角，山名由此而来，西边的尼尔萨皮里山口（意为「驯鹿之路」）也与它一起构成寒岭东端以驯鹿为名的一组地名。寒岭到这里已降为低缓的丘陵，山坡上是桦树林和苔原，每年春秋两季鹿群经尼尔萨皮里山口迁徙时，尼尔萨图克山的山坡是观看鹿群的好地方。山顶可以徒步半天往返，北望望星湾，南望西北市的科研走廊，是望星区居民周末常去的地方。鹿群迁徙的日子，山坡上挤满了带着望远镜的人，望星区的学校甚至会放半天假，老人们念叨「Nirsa katiq, nirsa pirri」，意思是「鹿的山口，就是鹿的路」。"
      en: "A summit at the eastern end of the Frost Ridge, a little over 1,160 m, in Stargaze District of Northwest City, east of Nirsapirri Pass. Two tops stand side by side, separated by a shallow saddle, and from a distance they look like a pair of antlers, hence the name; with Nirsapirri Pass to the west it gives the eastern end of the ridge its run of deer names. Here the Frost Ridge has fallen to gentle hills, its slopes covered in birch and tundra, and when the herds cross by Nirsapirri Pass each spring and autumn the slopes of Nirsatuuq Hill are a good place to watch them. The summit is a half-day walk there and back, with views north to Stargaze Bay and south to Northwest City's research corridor, and Stargaze people often come up at weekends. On migration days the slopes are crowded with binoculars and Stargaze's schools even give a half-day off, while the old people murmur \"Nirsa katiq, nirsa pirri\", the deer's pass is the deer's road."

