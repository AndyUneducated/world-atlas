      zh: 马斯林山脉南翼东端的孤峰，山顶平台状，天台区与天城市以其得名。
      en: Isolated summit at the eastern end of the Maslin Range's southern arm. Its flat, terrace-like top gave Sky Terrace District and Skytown their names.
  - id: nat_m92aq4
