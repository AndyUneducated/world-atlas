  - id: nat_h9chf5
    subtype: pass
    status: generated
    detect: { kind: pass, at_km: [211.2, 94.2] }
    names: { zh: 马斯林山口, en: Maslin Pass, art-x-viking: Maslinpass }
    notes:
      zh: 马斯林山脉西翼的鞍部，海拔一千七百六十多米，位于雅利基卢克市上雅利基卢克改良区，分隔北面的雅尔斯托尔峰山体和南面的索利峰山体。鞍部以南就是索利冰川的北缘，以北是雅尔斯托尔冰原所在的北翼高山，山口本身则是两片冰原之间一段较低的岩石山脊，夏季积雪融化后露出苔原和碎石坡。山口西侧是雅利基卢克河上游的荒野，东侧俯临马斯林山盆地，旧时驯鹿牧民和猎人曾经由这里往来于两地。如今山口仍不通公路，只有护林员和野外探险者偶尔经过，是马斯林山脉最荒凉的地方之一。
      en: A saddle in the western arm of the Maslin Range, just over 1,760 m high, in the Upper Jaalikiluk Improvement District of Jaalikiluk City, dividing the Jarlstol massif to the north from the Mount Sorley massif to the south. Just south of it begins the northern edge of the Sorley Glacier, and to the north rise the high mountains of the northern arm under the Jarlstol Icefield; the pass itself is a lower stretch of rocky ridge between the two icefields, where tundra and scree show through once the snow melts in summer. To the west lies the wilderness of the upper Jaalikiluk, and to the east it looks down on the Maslin basin; reindeer herders and hunters once crossed here between the two. There is still no road over it, and only forest rangers and the occasional expedition pass by, one of the loneliest places in the Maslin Range.
  - id: nat_68ggx2
    subtype: pass
    status: generated
    detect: { kind: pass, at_km: [146.8, 104.2] }
    names: { zh: 卡蒂尔尤阿克山口, en: Katirjuaq Pass, art-x-viking: Katirjuaqpass }
    notes:
      zh: 洛龙山脉中北部的山口，海拔一千七百米，位于洛龙山市纳帕图克区，德雷卡廷峰以南。卡蒂尔尤阿克自古就是翻越洛龙山脉中北段的要道，旧时的驿站、马厩和关卡至今保存在卡蒂尔尤阿克驿站博物馆里，讲述着商队和邮差冒雪翻山的故事，东北麓谷地里的卡蒂尔尤阿克集镇和卡蒂尔尤阿克区都由山口得名。如今的公路都不经过山口：卡蒂尔尤阿克高速改从德雷卡廷峰以北穿过主脊，纳帕图克公路则在南面的纳帕图克垭口附近以隧道穿山，老山口只剩下一条石砌古道。夏季徒步者沿古道走一整天，可以从山口俯瞰两侧的谷地和远处的克拉尔瓦滕湖。
      en: "A pass in the north-central Lorond Range, about 1,700 m high, in Napatuuq District of Lorond Mountain City, south of Drekatind. Katirjuaq has long been the main way over the north-central range: its old post house, stables and toll gate survive in the Katirjuaq Post House Museum, which tells of caravans and postmen crossing the mountains in the snow, and the town of Katirjuaq in the valley to the north-east, and Katirjuaq District, take their names from it. No road uses the pass today: the Katirjuaq Expressway crosses beneath the main ridge north of Drekatind, and the Napatuuq Highway tunnels through near Napatuuq Col to the south, leaving the old pass to a stone-paved track. In summer walkers follow it for a full day, looking down from the pass on the valleys on both sides and the distant Lake Klarvatn."
  - id: nat_m6jx55
    subtype: pass
    status: generated
    detect: { kind: pass, at_km: [243.8, 114.2] }
    names: { zh: 西坪垭口, en: West Heath Saddle, art-x-viking: Westheidesattel }
    notes:
      zh: 马斯林山脉北翼雅尔斯托尔峰与卡瓦卢克图克峰之间的鞍部，海拔三千四百九十多米，是北维京岛海拔最高的山口。鞍部被雅尔斯托尔冰原覆盖，终年冰雪不化，北侧冰舌下伸到雅利基卢克市尼尔萨利特牧区的高原，南坡则是马斯林山市西坪区的高山草甸，西坪区和西坪垭口都由这片高原台地得名。垭口不通公路，冰面上暗藏冰裂缝，只有经过训练的登山队和驻军的高山分队才会穿越。站在南坡的西坪台地上，可以看到垭口两侧的雅尔斯托尔峰和卡瓦卢克图克峰，以及每逢发射日从台地上空升起的火箭尾焰。
      en: A saddle in the northern arm of the Maslin Range between Jarlstol and Mount Qavvaluktuuq, just under 3,500 m and the highest pass on North Viking Island. It lies under the Jarlstol Icefield and is never free of snow and ice; on the north side the ice tongues reach down to the upland of the Nirsaliit Pastoral District in Jaalikiluk City, while the southern slope falls to the alpine meadows of West Heath District in Maslin Mountain City, after whose upland plateau both the district and the saddle are named. No road crosses it, and hidden crevasses mean that only trained mountaineering teams and the garrison's alpine units attempt the crossing. From the West Heath plateau below you can see Jarlstol and Mount Qavvaluktuuq on either side of the saddle, and on launch days the trails of rockets climbing above the plateau.
  - id: nat_qksmah
    subtype: pass
    status: generated
    detect: { kind: pass, at_km: [147.2, 83.8] }
    names: { zh: 纳帕图克垭口, en: Napatuuq Col, art-x-viking: Napatuuqsattel }
    notes:
      zh: 洛龙山市纳帕图克区洛龙峰与杉顶之间的高海拔垭口，海拔两千零八十多米，是洛龙山脉中南段的分水岭。垭口北侧紧邻洛龙冰川，四周是碎石坡和终年积雪，夏季也常有风雪。旧时翻越这里要走险峻的盘山道，如今纳帕图克公路以隧道代替盘山道，从垭口附近穿过主脊，环北维京岛高速也从垭口近旁通过，把塔夫鲁普库维克平原与洛龙山东麓连在一起。纳帕图克森林公园的徒步道从山下的云杉林一路上行到垭口，晴天时可以同时看到洛龙冰川和杉顶的冰帽，是纳帕图克区最经典的登山路线之一。
      en: A high col between Lorond Peak and Fir Top in Napatuuq District of Lorond Mountain City, a little over 2,080 m, on the watershed of the central and southern Lorond Range. The Lorond Glacier lies right against its northern side, and around it are scree slopes and permanent snow, with snow squalls even in summer. In the past the crossing meant a steep zigzag track; today the Napatuuq Highway tunnels beneath the crest close to the col, and the ring expressway also passes nearby, linking the Tavrupukkuvik plain with the eastern foot of the range. A trail from Napatuuq Forest Park climbs from the spruce woods below to the col, from which on a clear day you can see both the Lorond Glacier and the ice cap of Fir Top, one of the classic climbs of Napatuuq District.
  - id: nat_ryk6ny
    subtype: pass
    status: generated
    detect: { kind: pass, at_km: [61.2, 130.8] }
    names: { zh: 基尔纳克山口, en: Kirnaq Pass, art-x-viking: Kirnaqpass }
    notes:
      zh: 寒岭西段帕利基尔纳克峰与西尔米卡塔克峰之间的山口，海拔一千八百二十多米，位于西北市寒岭区与鹿鸣区之间。山口两侧是陡峭的岩壁，冬季北风从海上灌入，在狭窄的缺口里呼啸而过，声如狼嚎，山口和西边的帕利基尔纳克峰都因此以塔夫鲁纳克语里的「狼」（基尔纳克）为名。基尔纳克山口不通公路，只有一条古老的猎人小道翻越山口，连接寒岭南坡的森林和北海岸，夏季常有徒步者沿这条小道走寒岭西段的穿越路线。山口附近是寒岭生态研究站的野生动物监测区，红外相机常拍到狼、猞猁和驯鹿的身影。
      en: A pass in the western Frost Ridge between Mount Paalikirnaq and Mount Sirmiqattaq, just over 1,820 m, on the line between Frost Ridge and Deersong districts of Northwest City. Steep rock walls flank it, and in winter the north wind pours in from the sea and howls through the narrow gap like a wolf, which is why both the pass and Mount Paalikirnaq to the west bear the name. No road crosses it; only an old hunters' path climbs over, linking the forests on the south side of the Frost Ridge with the north coast, and in summer walkers follow it on traverses of the western ridge. The area around the pass is a wildlife monitoring zone of the Frost Ridge Ecological Station, whose camera traps often catch wolves, lynx and reindeer.
  - id: nat_28qqas
    subtype: pass
    status: generated
    detect: { kind: pass, at_km: [80.2, 132.8] }
    names: { zh: 蒂鲁山口, en: Tirru Pass, art-x-viking: Tirrupass }
    notes:
      zh: 西北市望星区寒岭中段的山口，海拔一千八百五十多米，位于西尔米卡塔克峰与瓦格恩廷峰之间。从南面望去，两座山峰之间的缺口像一道敞开的门，晴朗的冬夜，星空和极光从门中透出，山口由此得名；站在山口北望，就是望星湾和北海岸的海面。蒂鲁山口不通公路，一条徒步小道从寒岭南坡的森林上行，越过山口下到望星湾畔，是寒岭最受欢迎的穿越路线之一，夏季要走一整天，冬季积雪深厚时只有经验丰富的越野滑雪者才会尝试。山口附近视野开阔、光污染极少，也是天文爱好者拍摄星空的地方。
      en: A pass in the middle of the Frost Ridge in Stargaze District of Northwest City, just over 1,850 m high, between Mount Sirmiqattaq and Vagntind. Seen from the south, the gap between the two peaks looks like an open gate, and on clear winter nights the stars and the aurora shine through it, which gave the pass its name; from the pass itself the view north is over Stargaze Bay and the sea of the north coast. No road crosses it. A footpath climbs from the forest on the south side of the Frost Ridge, crosses the pass and drops to the shore of Stargaze Bay, one of the most popular traverses of the ridge, a full day's walk in summer, while in deep winter snow only experienced cross-country skiers attempt it. Wide skies and almost no light pollution also make it a place for photographing the night sky.
  - id: nat_6p167r
    subtype: pass
    status: generated
    detect: { kind: pass, at_km: [225.2, 48.2] }
    names: { zh: 萨科山口, en: Sako Pass, art-x-viking: Sakopass }
    notes:
      zh: 萨科勒市铁岗山西侧的山口，海拔一千一百五十多米，位于萨科区与铁岗区之间，是马斯林山脉南翼西端的低鞍部，连接萨科区与东南沿海。旧时萨科镇的渔民和铁岗的矿工就沿着山口的古道往来，把鱼货运进矿区、把铁器带回渔镇。如今山口不通公路，古道成了登山者喜爱的去处，沿途是石楠荒坡和桦树林，山口上可以同时望见萨科湾和铁岗山的旧矿坑。秋季石楠花开时，整片山坡染成紫红色，萨科老镇的巴克汉姆人常在这时结伴上山。
      en: "A pass west of Iron Knoll in Sakole, a little over 1,150 m, between Sako and Iron Knoll districts: a low saddle at the western end of the Maslin Range's southern arm linking Sako District with the south-east coast. In the past the fishermen of Sako and the miners of Iron Knoll travelled the old track over the pass, carrying fish into the mining country and bringing ironware back to the fishing town. Today no road crosses the pass, and the old track has become a favourite with walkers, climbing through heather and birch to a saddle from which you can see Sako Bay and the old open pits of Iron Knoll at once. When the heather flowers in autumn the hillsides turn purple-red, and Buckham families from the old town of Sako come up together to see it."
  - id: nat_0syp9a
    subtype: pass
    status: generated
    detect: { kind: pass, at_km: [96.2, 128.2] }
    names: { zh: 尼尔萨皮里山口, en: Nirsapirri Pass, art-x-viking: Nirsapirripass }
    notes:
      zh: 西北市望星区寒岭东端的低山口，海拔九百三十多米，位于瓦格恩廷峰与尼尔萨图克山之间，是寒岭最低的山口。寒岭到这里已降为低缓的丘陵，山口两侧是桦树林和苔原，每年春秋两季，鹿群沿着山口翻越寒岭，在南坡的森林和北海岸的夏季草场之间迁徙，山口由此得名。迁徙季节，寒岭生态研究站的研究人员会在山口统计鹿群数量，望星区的居民也常来山坡上远远观看。尼尔萨皮里山口不通公路，为了不干扰迁徙，山口一带只开放一条徒步小道，迁徙高峰期还会临时关闭。
      en: A low pass at the eastern end of the Frost Ridge in Stargaze District of Northwest City, just over 930 m high, between Vagntind and Nirsatuuq Hill, and the lowest pass on the ridge. Here the Frost Ridge has dropped to gentle hills, with birch woods and tundra on either side, and every spring and autumn herds of deer cross the ridge through the pass on their way between the forests of the south side and the summer pastures of the north coast, which gave it its name. In the migration season researchers from the Frost Ridge Ecological Station count the herds at the pass, and people from Stargaze District come to watch from the slopes at a distance. No road crosses it; to avoid disturbing the animals only one footpath is open, and even that is closed at the height of the migration.

  # ── Glaciers (largest first) ─────────────────────────────
  - id: nat_hvjjwy
    subtype: glacier
    status: generated
    detect: { kind: glacier, at_km: [232.6, 114.4] }
    names: { zh: 雅尔斯托尔冰原, en: Jarlstol Icefield, art-x-viking: Jarlstoleisfeld }
    notes:
      zh: "北维京岛最大的冰原，面积五千多平方公里（5023.4 平方公里），覆盖马斯林山脉北翼，西起雅尔斯托尔峰，东到全岛最高峰、也是世界最高峰的蒂鲁尤阿克峰（4313 米），平均海拔三千多米，行政上归入雅利基卢克市尼尔萨利特牧区。冰原上耸立着雅尔斯托尔峰（4020 米）、卡瓦卢克图克峰（4213 米）、霍尔沃思峰（4236 米）和蒂鲁尤阿克峰四座四千米级高峰，海拔 3491 米的西坪垭口的鞍部也埋在冰雪之下。冰原的北坡朝向尼尔萨利特，冰舌在这一侧下伸得最低，驯鹿冬季牧场的边缘就与冰原相连；南坡俯临西坪区的高山草甸和群峰训练管理区。冰原东段的峰顶建有蒂鲁尤阿克峰光学观测站和霍尔沃思峰激光站，监视在轨卫星与太空碎片，人员和物资只能靠直升机运送。冰原的融水顺南北两坡流下，汇入马斯林河和尼尔萨利特的河流，帕利卡图克河就从冰原北面的高原台地流向北部海域。\n尼尔萨利特的牧民说，牧场边的冰舌是冰原「伸出来的舌头」，牛羊和驯鹿夏天走到冰舌边去舔冰水，牧民们笑称这是「冰原和牛在接吻」。观测站换班的直升机飞过冰原时，机上的工程师常把脸贴在舷窗上，说从上面看下去，四座高峰像四个围着一张白桌子开会的老人。"
      en: "North Viking Island's largest icefield, more than 5000 km² (5023.4 km²), covering the northern arm of the Maslin Range from Jarlstol in the west to Mount Tirrujuaq (4313 m) in the east, the island's highest peak and the highest in the world. Its average height is over 3000 m, and it is administered as part of the Nirsaliit Pastoral District of Jaalikiluk City. Four peaks above 4000 m rise from the ice, Jarlstol (4020 m), Mount Qavvaluktuuq (4213 m), Mount Hallworth (4236 m) and Mount Tirrujuaq, and the saddle of West Heath Saddle, 3491 m, is also buried under it. The north slope faces Nirsaliit, where the ice tongues reach lowest and the edge of the reindeer winter pastures runs right up to the ice; the south slope looks down on the alpine meadows of West Heath District and the High Peaks Training Area. On the summits of the eastern section stand the Mount Tirrujuaq Optical Station and the Mount Hallworth Laser Station, which watch satellites and space debris in orbit; people and supplies can reach them only by helicopter. Meltwater runs down both slopes into the Maslin River and the rivers of Nirsaliit, and the Paaliqattuk River flows from the plateau north of the icefield to the northern sea.\nThe Nirsaliit herders call the ice tongues beside their pastures the icefield's \"tongue sticking out\"; in summer their cattle, sheep and reindeer wander up to lick the meltwater, and the herders joke that \"the icefield is kissing the cows\". When the helicopters carrying the station shifts fly over the ice, engineers often press their faces to the windows and say that from above the four great peaks look like four old men in a meeting round a white table."
  - id: nat_62jkkn
    subtype: glacier
    status: generated
    detect: { kind: glacier, at_km: [212.6, 67.1] }
    names: { zh: 索利冰川, en: Sorley Glacier, art-x-viking: Sorleygletscher }
    notes:
      zh: "覆盖马斯林山脉西翼南段的大冰川，面积一千七百多平方公里（1737.7 平方公里），属新城市北苑区，在北维京岛仅次于雅尔斯托尔冰原。冰川以海拔 3085 米的索利峰为中心，沿西翼山脊向北一直延伸到马斯林山口南侧，平均海拔约 2500 米，冰盖边缘伸出多条冰舌，融水向西流入雅利基卢克河上游的荒野，向东则汇入马斯林山盆地。索利峰相对高度一千三百多米，它和它的冰帽在晴天从新城市清晰可见，北苑区北部的山脚下是新城居民徒步和野餐的森林与溪谷。冰川一带不通公路，登山者从北苑或上雅利基卢克改良区出发，要徒步一两天才能到达冰缘，夏季也须结组并携带冰爪；冬季山上风雪猛烈，只有经验丰富的登山队才会上去。北苑区是新城人口最多的区，成片的新社区和学校就建在冰川脚下的平地上，许多家庭的窗口正对着这片白色的山脊。\n北苑区的孩子们从小就知道，索利冰川的冰帽在晴天会变色：早上是粉的，中午是白的，傍晚是金的，新城的学校美术课常让孩子们画三幅不同颜色的冰川。新城第一中学的毕业生有个传统，毕业那年夏天结伴徒步到冰缘，在冰舌前拍一张合影，挂在学校的走廊上，一届接着一届，已经挂满了半面墙。"
      en: "A great glacier covering the southern part of the western arm of the Maslin Range, more than 1700 km² (1737.7 km²), in North Gardens District of New City, second only to the Jarlstol Icefield on North Viking Island. It is centred on Mount Sorley, 3085 m high, and stretches north along the crest of the western arm to the south side of Maslin Pass, with an average height of about 2500 m. Several tongues reach out from the edge of the ice cap; meltwater flows west into the wilderness of the upper Jaalikiluk River and east into the Maslin Mountain basin. Mount Sorley has a prominence of over 1300 m, and on clear days the peak and its ice cap are plainly visible from New City; at the foot of the mountains in northern North Gardens lie the forests and ravines where New City people hike and picnic. There are no roads near the glacier: climbers set out from North Gardens or the Upper Jaalikiluk Improvement District and need one or two days on foot to reach the ice edge, roped up and wearing crampons even in summer; in winter the storms on the mountain are fierce and only experienced teams go up. North Gardens is New City's most populous district, its new neighbourhoods and schools built on the flat land below the glacier, and many families' windows look straight out at the white ridge.\nChildren in North Gardens learn early that on clear days the Sorley ice cap changes colour: pink in the morning, white at noon and gold in the evening, and New City's school art classes often have them paint the glacier three times in three colours. Graduates of New City No. 1 High School have a tradition of hiking together to the ice edge in the summer they leave and taking a group photo in front of the tongue, which is hung in a school corridor; year after year the photos have filled half a wall."
  - id: nat_1r9x72
    subtype: glacier
    status: generated
    detect: { kind: glacier, at_km: [149.6, 75.6] }
    names: { zh: 洛龙冰川, en: Lorond Glacier, art-x-viking: Lorondgletscher }
    notes:
      zh: "洛龙山脉最大的冰川，面积一千零四十多平方公里（1045.3 平方公里），位于洛龙山市纳帕图克区，覆盖洛龙山脉最高峰洛龙峰的北坡，最高处就是海拔 2701 米的洛龙峰顶，平均海拔两千三百多米，整片冰原都在北维京岛 2200 米左右的雪线之上。冰川从洛龙峰向北铺展到海拔两千多米的纳帕图克垭口一带，冰舌伸入两侧的山谷，冰舌下方就是纳帕图克的云杉和冷杉林海。环北维京岛高速从冰川边缘附近经过，纳帕图克公路也在垭口附近以隧道穿山，司机在晴天就能看到冰原和冰舌。洛龙山市以洛龙峰和这片冰原闻名，上千平方公里的洛龙冰川与纳帕图克冰川、伊卡苏瓦湖一起，让这里成为登山和徒步的胜地；冰川融水是雅利基卢克河源头的重要补给，顺着林间溪谷向东流出山地。纳帕图克区地广人稀，每平方公里只有约七人，冬季大雪封山，冰川一带只有护林员和科研人员偶尔上山。\n高速上开车的司机有个习惯：经过冰川边缘的观景停车点时一定要停一下，在冰舌前拍张照片发给家人，长途司机说这是「给家里报平安的地方」。冬天山里最冷时跌到零下二十五度，观景点的栏杆上结满冰花，停车的人往往只敢下车拍一张就钻回车里。"
      en: "The largest glacier in the Lorond Range, more than 1040 km² (1045.3 km²), in Napatuuq District of Lorond Mountain City. It covers the northern slopes of Lorond Peak, the range's highest summit, reaching its highest point at the 2701 m summit itself, with an average height of over 2300 m, so the whole icefield lies above North Viking Island's snowline of about 2200 m. The glacier spreads north from Lorond Peak to the area around Napatuuq Col, a little over 2000 m high, and its tongues reach down into the valleys on either side, just above the spruce and fir forests of Napatuuq. The North Viking Island Ring Expressway passes close to its edge and the Napatuuq Highway tunnels through the range near the col, so on clear days drivers can see the icefield and its tongues. Lorond Mountain City is famous for Lorond Peak and this icefield, and the thousand square kilometres of the Lorond Glacier, together with the Napatuuq Glacier and Lake Ikkasuvva, make the area a magnet for climbers and hikers. The glacier's meltwater is an important source of the Jaalikiluk River, flowing east out of the mountains through forest ravines. Napatuuq District is vast and nearly empty, with only about seven people per square kilometre; in winter snow closes the mountains and only the occasional forest ranger or researcher goes up to the ice.\nDrivers on the expressway have a habit: at the viewpoint lay-by by the glacier's edge they always stop to take a photo in front of the ice tongue and send it to their families, and long-distance drivers call it \"the place you tell home you're safe\". In the coldest part of winter the mountains drop to minus 25 degrees, the viewpoint railings are crusted with ice flowers, and most people dare only jump out for a single photo before diving back into the car."
  - id: nat_azh3cs
    subtype: glacier
    status: generated
    detect: { kind: glacier, at_km: [147.6, 114.6] }
    names: { zh: 德雷卡廷冰川, en: Drekatind Glacier, art-x-viking: Drekatindgletscher }
    notes:
      zh: "洛龙山脉北段主峰德雷卡廷峰周围的冰川，面积近一百平方公里（97.8 平方公里），最高处海拔两千两百多米，平均海拔 2127 米，横跨洛龙山市卡蒂尔尤阿克区和勒克尔市克拉尔瓦滕区。冰川环绕德雷卡廷峰顶铺开，从远处看像是龙头上的一圈白鬃，与南面的山脊合称「龙脊」。冰川北面不远是北维京岛最大的湖泊克拉尔瓦滕湖，晴天时从克拉尔瓦滕湖北岸南望，德雷卡廷峰和它的冰川倒映在湖中；卡蒂尔尤阿克高速则在德雷卡廷峰以北穿过洛龙山脉主脊。融雪和冰川融水顺山谷流下，是克拉尔瓦滕湖的水源之一，湖水因此清澈见底。冰川一带不通公路，夏季有向导从卡蒂尔尤阿克集镇带领登山者上山；集镇是洛龙山市的行政中心和公路枢纽，两侧山坡上的雪道冬季人满为患，夏季则转为徒步和山地自行车基地，从集镇出发的登山者多把德雷卡廷冰川当作第一次上冰的练习地。\n卡蒂尔尤阿克的向导带人上冰前，总会先在冰川边上点一根蜡烛，说是向「龙」借路，下山时如果蜡烛还没被风吹灭，大家就说这条路「龙同意了」。蜡烛若是灭了，向导也不慌，笑着说龙只是打了个喷嚏，第二天再来就是。"
      en: "The glacier around Drekatind, the main summit of the northern Lorond Range, nearly 100 km² (97.8 km²), rising to over 2200 m with an average height of 2127 m and straddling Katirjuaq District of Lorond Mountain City and Klarvatn District of Lekor City. The ice spreads around the summit of Drekatind and from afar looks like a white mane around a dragon's head; together with the ridge to the south it is called \"the Dragon's Back\". Not far to the north lies Lake Klarvatn, the largest lake on North Viking Island, and on clear days, looking south from its north shore, Drekatind and its glacier are mirrored in the water; the Katirjuaq Expressway crosses the main ridge of the Lorond Range north of Drekatind. Snowmelt and glacier melt run down the valleys and are one of the sources of Lake Klarvatn, which is why its water is so clear. No road reaches the glacier, and in summer guides lead climbers up from Katirjuaq town, the administrative centre and road hub of Lorond Mountain City, whose ski runs on the slopes either side are packed in winter and turn into a base for hiking and mountain biking in summer; climbers from the town often use the Drekatind Glacier for their first practice on ice.\nBefore taking anyone onto the ice, the Katirjuaq guides always light a candle at the glacier's edge, asking \"the dragon\" for passage, and if the candle is still burning on the way down, everyone says the dragon \"agreed\". If it has gone out, the guides are unbothered: the dragon only sneezed, they laugh, and you can come back tomorrow."
  - id: nat_af1705
    subtype: glacier
    status: generated
    detect: { kind: glacier, at_km: [151.1, 58.9] }
    names: { zh: 纳帕图克冰川, en: Napatuuq Glacier, art-x-viking: Napatuuqgletscher }
    notes:
      zh: "洛龙山脉最南端的小冰川，面积约三十五平方公里（35.2 平方公里），位于洛龙峰南侧，最高处海拔 2271 米，平均海拔两千一百多米，洛龙山脉就从这一带向北延伸。冰川所在的山地属洛龙山市纳帕图克区，四周是云杉和冷杉组成的原始针叶林，冰川与森林之间只隔着一片碎石和高山草甸，冰雪与林海近在咫尺。纳帕图克森林公园保护着这里最古老的一片原始林，园内有高大的冷杉、苔藓覆盖的岩石和清澈的溪流，林间步道从山坡上的云杉原始林一路上行，通往纳帕图克冰川的冰舌，夏季是徒步者喜爱的一日路线，沿途可以看到冰川退缩后留下的冰碛和冰蚀湖。冰川融水汇成清澈的溪流，流入纳帕图克的林海，为纳帕图克区的森林涵养水源。纳帕图克林业研究所在冰川边缘设有观测样地，研究冰川退缩后先长出的苔藓、草本和幼树，看林海怎样一步步向上爬。\n徒步者在冰舌前常会把手伸进融水溪里，冰得几秒就要缩回来，纳帕图克的向导说，能坚持十秒的人，就可以喝一口「冰川的第一口水」。向导还会指给大家看碎石滩上新冒出的小冷杉，说它们是「从林海里跑出来追冰川的孩子」，每年都比去年跑得更远一点。"
      en: "The southernmost small glacier of the Lorond Range, about 35 km² (35.2 km²), on the south side of Lorond Peak, rising to 2271 m with an average height of over 2100 m; the Lorond Range runs north from here. The mountains around it belong to Napatuuq District of Lorond Mountain City and are clothed in old-growth conifer forest of spruce and fir; only a strip of scree and alpine meadow separates ice from trees, so snow and forest lie almost side by side. Napatuuq Forest Park protects the oldest stand of old-growth forest here, with tall firs, moss-covered rocks and clear streams, and a forest trail climbs from the old spruce woods on the slopes all the way to the tongue of the Napatuuq Glacier. In summer it is a favourite day hike, passing moraines and small glacial lakes left as the ice retreated. The meltwater gathers into clear streams that flow into the Napatuuq forest and keep its woods watered. The Napatuuq Forestry Institute keeps study plots at the glacier's edge, watching the mosses, herbs and seedlings that first grow on ground the ice has left, to see how the forest creeps uphill step by step.\nIn front of the ice tongue hikers often plunge a hand into the meltwater stream and pull it out again within seconds; the Napatuuq guides say anyone who can hold out for ten seconds earns a sip of \"the glacier's first water\". The guides also point out the little firs sprouting on the scree, calling them \"children run out of the forest to chase the glacier\", each year a little further than the last."
  - id: nat_a7552a
    subtype: glacier
    status: generated
    detect: { kind: glacier, at_km: [147.6, 88.9] }
    names: { zh: 杉顶冰川, en: Fir Top Glacier, art-x-viking: Fichtenkopfgletscher }
    notes:
      zh: "覆盖洛龙山脉中段杉顶峰顶的冰川，面积一百二十多平方公里（121.3 平方公里），位于洛龙山市纳帕图克区，最高处就是海拔 2377 米的杉顶峰顶，平均海拔两千一百多米。冰帽从峰顶向四周铺开，在山腰以上与杉顶的岩壁和雪坡相接，山腰以下则是茂密的云杉林，纳帕图克区的名字就来自这片林海。冰川南面不远是纳帕图克垭口，纳帕图克公路和环北维京岛高速都在垭口附近经过洛龙山脉，晴天时从公路上可以望见杉顶白色的冰帽。冰川融水顺山谷流下，汇成纳帕图克林海里的溪流，为全岛涵养水源。纳帕图克的林场按严格的轮伐制度采伐，伐后及时补种，纳帕图克林业研究所的科研人员和护林员是山里最主要的常住人口，他们也定期记录冰帽的进退。冰川一带不通公路，登山者从纳帕图克的林场出发，沿林道和碎石坡上行，一天可以到达冰缘；冬季大雪封山，林区只剩季节性驻地。\n林场工人有个老说法，杉顶的冰帽是「林海的帽子」，哪年冰帽缩小了，哪年林海就要多种一片树，所以林场每年都会对着冰帽种树。护林员冬天下山前，会在能望见冰帽的林道口挂一盏防风灯，等来年春天上山时看看灯还在不在，灯在，就说山神也看守了一冬。"
      en: "A glacier covering the summit of Fir Top in the middle of the Lorond Range, more than 120 km² (121.3 km²), in Napatuuq District of Lorond Mountain City. Its highest point is the 2377 m summit of Fir Top itself, and its average height is over 2100 m. The ice cap spreads out from the summit and meets Fir Top's rock walls and snow slopes above mid-height; below that lies dense spruce forest, the sea of trees that gave Napatuuq District its name. Not far south of the glacier is Napatuuq Col, where the Napatuuq Highway and the North Viking Island Ring Expressway both cross the Lorond Range, and on clear days the white cap of Fir Top can be seen from the road. Meltwater runs down the valleys into the streams of the Napatuuq forest, conserving water for the whole island. The Napatuuq forests are felled under strict rotation and replanted promptly, and the researchers of the Napatuuq Forestry Institute and the forest rangers, the mountains' main permanent residents, also keep a regular record of the ice cap's advance and retreat. No road reaches the glacier: climbers set out from the Napatuuq forestry camps along forest tracks and scree slopes and can reach the ice edge in a day; in winter heavy snow closes the mountains and only seasonal posts remain in the forest.\nThe forestry workers have an old saying that the Fir Top ice cap is \"the forest's hat\": in any year the cap shrinks, the forest must plant another stand, so every year the camps plant trees facing the ice cap. Before coming down for the winter, the rangers hang a storm lantern at the head of a forest track within sight of the cap, and check in spring whether it is still there; if it is, they say the mountain spirit kept watch all winter too."
  - id: nat_wwyev3
    subtype: glacier
    status: generated
    detect: { kind: glacier, at_km: [71.6, 134.4] }
    names: { zh: 西尔米卡塔克冰川, en: Sirmiqattaq Glacier, art-x-viking: Sirmiqattaqgletscher }
    notes:
      zh: "西北市寒岭区西尔米卡塔克峰顶的冰川，面积一百三十多平方公里（136.8 平方公里），最高处海拔 2413 米，平均海拔 2131 米，是寒岭唯一较大的冰川。西尔米卡塔克峰是寒岭的最高峰，相对高度两千一百多米，冰帽终年不化，覆盖着它的峰顶，「霜冠」之名就来自这顶白色的冰冠；冰舌沿南坡伸入原始森林上方的高山草甸，北坡则俯临北海岸的海湾。寒岭区大部分土地是原始森林和高山草甸，居民分散在峡湾沿岸的小镇和山谷村落，许多是研究站的职工和退休的科研人员。寒岭生态研究站长期监测西尔米卡塔克冰川的进退和融水变化，为领地的环境保护和气候研究提供数据，许多大学的野外实习也在这里进行。冰川观光是寒岭区近年兴起的生态旅游项目，向导带领游客从森林边缘徒步上冰，冬季则有越野滑雪路线绕行冰川脚下；寒岭的冬季漫长，极光常常挂在冰帽上空。\n野外实习的大学生在冰川边上搭起帐篷，夜里能听见冰川「说话」，冰层移动时发出低沉的咔咔声，研究员们说这是冰川在「伸懒腰」。研究站有一本传了好几届的值班日记，学生们在里面记下每晚听到几声，谁听到的最多，就有资格在离开前给冰川边的一块石头起个外号。"
      en: "The glacier on the summit of Mount Sirmiqattaq in Frost Ridge District of Northwest City, more than 130 km² (136.8 km²), rising to 2413 m with an average height of 2131 m, the only sizeable glacier in Frost Ridge. Mount Sirmiqattaq is the highest point of the Frost Ridge, with a prominence of over 2100 m, and its summit wears an ice cap that never melts; the name \"frost crown\" comes from this white crown of ice. Its tongue reaches down the south slope onto the alpine meadows above the old-growth forest, while the north slope looks down on the bays of the north coast. Most of Frost Ridge District is old-growth forest and alpine meadow, and its people live scattered in small towns along the fjord and in valley villages, many of them station staff or retired researchers. The Frost Ridge Ecological Station has long monitored the glacier's advance, retreat and meltwater, providing data for the territory's environmental protection and climate research, and many universities run field courses here. Glacier tours are one of Frost Ridge's newer ecotourism attractions: guides lead visitors on foot from the forest edge onto the ice, and in winter cross-country ski routes circle the glacier's foot. Winters at Frost Ridge are long, and the aurora often hangs above the ice cap.\nUniversity students on field courses pitch their tents beside the glacier and at night can hear it \"talking\": as the ice moves it gives a low cracking groan, which the researchers say is the glacier \"stretching\". The station keeps a duty diary handed down over several years in which students note how many groans they heard each night; whoever heard the most earns the right to give a nickname to one of the boulders beside the ice before they leave."
