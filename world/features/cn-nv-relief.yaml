    detect: { kind: peak, at_km: [258.8, 112.8] }
    names: { zh: 观星峰, en: Starwatch Peak, art-x-viking: Sternwartspitze }
    notes:
      zh: 马斯林山脉北翼东端的高峰，俯临星港区。
      en: High summit at the eastern end of the Maslin Range's northern arm, above Starport District.
  - id: nat_baqmce
