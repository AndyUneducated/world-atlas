# Peaks, passes and glaciers of North Viking Island found by the generator
# (pipeline/atlas/relief.py). Each entry names the landform of `detect.kind` nearest to
# `detect.at_km` (design km). Elevation and prominence come from the generated terrain.
features:
  # ── Peaks (highest first) ────────────────────────────────
  - id: nat_nans6b
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [258.8, 113.2] }
    names: { zh: 蒂鲁尤阿克峰, en: Mount Tirrujuaq, art-x-viking: Tirrujuaqspitze }
    wonder:
      zh: 世界最高峰，海拔 4313 米
      en: The highest peak in the world, 4,313 m
    notes:
      zh: 北维京岛最高峰，海拔四千三百一十三米，是马斯林山脉北翼东端高山群的主峰，属马斯林山市群峰训练管理区，东面俯临星港区。峰顶被雅尔斯托尔冰原东端的冰雪覆盖，西接霍尔沃思峰和卡瓦卢克图克峰，三座四千米级高峰连成一线。峰顶建有深空太空军的蒂鲁尤阿克峰光学观测站：这里常在云层之上，空气稀薄干燥，夜空极为清澈，望远镜可以拍摄很暗的卫星和太空碎片，测定它们的轨道，站内的激光测距仪还为导航卫星校准轨道。蒂鲁尤阿克峰不通公路，值守人员靠直升机轮换，峰顶不对公众开放，从星港区和西坪台地都能望见它的雪顶。
      en: "The highest summit on North Viking Island, 4,313 m, the main peak of the high massif at the eastern end of the Maslin Range's northern arm, in the High Peaks Training Area of Maslin Mountain City and looking down on Starport District to the east. Its summit lies under the snow of the eastern Jarlstol Icefield, with Mount Hallworth and Mount Qavvaluktuuq to the west forming a line of three four-thousand-metre peaks. On the top stands the deep-space force's Mount Tirrujuaq Optical Station: often above the clouds, in thin, dry air and very clear skies, its telescopes can photograph faint satellites and debris and measure their orbits, and its laser ranging system calibrates the orbits of navigation satellites. No road reaches the summit; the crew rotates by helicopter, the summit is closed to the public, and its snowy top can be seen from Starport and the West Heath plateau."
  - id: nat_w3c8nk
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [253.2, 116.8] }
    names: { zh: 霍尔沃思峰, en: Mount Hallworth, art-x-viking: Hallworthspitze, art-x-buckham: Picco Hallworth }
    notes:
      zh: 马斯林山脉北翼东段高山群的中峰，海拔四千二百三十多米，是北维京岛第二高峰，位于蒂鲁尤阿克峰西北，属群峰训练管理区。峰顶三面冰斗环抱，形如冠冕，与西南方的索利峰遥遥相对，两峰一北一南。峰顶建有深空太空军的霍尔沃思峰激光站：高山上大气稀薄，激光衰减小，站内的自适应光学系统可以把光束精确地聚焦到轨道上的目标，用于激光通信、能量传输试验和清除小块太空碎片。霍尔沃思峰不通公路，人员和物资靠直升机运送，四周是雅尔斯托尔冰原的冰川，峰顶也不对公众开放。
      en: "The central summit of the high massif on the eastern part of the Maslin Range's northern arm, a little over 4,230 m and the second highest peak on North Viking Island, lying north-west of Mount Tirrujuaq in the High Peaks Training Area. Cirques ring its summit on three sides like a crown, and it faces Mount Sorley far to the south-west, one crown in the north and one in the south. On its summit stands the deep-space force's Mount Hallworth Laser Station: the thin air at altitude weakens the beam far less, and adaptive optics focus it precisely on targets in orbit for laser communication, power-beaming tests and nudging small pieces of space debris out of orbit. No road reaches it; staff and supplies come by helicopter, the summit is surrounded by the ice of the Jarlstol Icefield, and it is closed to the public."
  - id: nat_r6y4ex
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [245.2, 115.8] }
    names: { zh: 卡瓦卢克图克峰, en: Mount Qavvaluktuuq, art-x-viking: Qavvaluktuuqspitze, art-x-buckham: Picco Qavvaluktuuq }
    notes:
      zh: 马斯林山脉北翼的四千米级高峰，海拔四千二百一十多米，是北维京岛第三高峰，位于霍尔沃思峰西侧、西坪垭口以东，属马斯林山市群峰训练管理区。峰顶被雅尔斯托尔冰原覆盖，冰川从峰顶向南北两侧铺展。马斯林山的冬季漫长，夜晚晴朗时，极光常在峰顶上空舞动，从西坪台地或星港区望去，绿色的光带正好悬在峰顶之上，山峰因此得名。卡瓦卢克图克峰与东面的霍尔沃思峰、蒂鲁尤阿克峰连成一线，构成北翼东段的高山群。山峰位于军事训练区内，不通公路，也不对公众开放，只能从远处观赏。
      en: A four-thousand-metre summit in the northern arm of the Maslin Range, a little over 4,210 m and the third highest peak on North Viking Island, lying west of Mount Hallworth and east of West Heath Saddle in the High Peaks Training Area of Maslin Mountain City. Its top is buried in the Jarlstol Icefield, whose ice spreads from the summit down both sides. Winters in the Maslin Range are long, and on clear nights the aurora often dances above the peak; seen from the West Heath plateau or from Starport, the green curtains hang right over its summit, which gave it its name. With Mount Hallworth and Mount Tirrujuaq to the east it forms the high massif of the eastern northern arm. The peak lies inside the military training area, with no road and no public access, and can only be admired from afar.
  - id: nat_7fcbdm
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [214.8, 111.8] }
    names: { zh: 雅尔斯托尔峰, en: Jarlstol, art-x-viking: Jarlstol }
    notes:
      zh: 马斯林山脉北翼与西翼交会处的主峰，海拔四千零二十米，是北维京岛第四高峰，位于厄定河市旧府区。峰顶终年被雅尔斯托尔冰原覆盖，雅尔斯托尔冰原就从这里向东铺展到蒂鲁尤阿克峰，因此以雅尔斯托尔峰命名。从西面的厄定河谷或旧府的阶地上望去，雅尔斯托尔峰巍然端坐在群峰之首，宽阔的山肩如同王座的扶手，山名由此而来。雅尔斯托尔峰西坡俯临上厄定改良区的荒野，南面经马斯林山口与索利峰山体相连，东面是西坪垭口。山峰不通公路，攀登须穿越冰原，是一条艰难的高山路线。
      en: The main summit where the northern and western arms of the Maslin Range meet, 4,020 m and the fourth highest peak on North Viking Island, in Old Prefecture District of Erding River City. It is capped all year by the Jarlstol Icefield, which spreads east from here to Mount Tirrujuaq and takes its name from the peak. Seen from the Erding valley to the west or from the terraces of Old Prefecture, Jarlstol sits enthroned at the head of the range, its broad shoulders like the arms of a throne, hence the name. Its western slopes look down on the wilderness of the Upper Erding Improvement District; to the south it is linked to the Mount Sorley massif by Maslin Pass, and to the east lies West Heath Saddle. No road comes near, and the ascent across the icefield is a demanding high-mountain route.
  - id: nat_m9thfe
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [212.8, 67.2] }
    names: { zh: 索利峰, en: Mount Sorley, art-x-viking: Sorleyspitze }
    notes:
      zh: 马斯林山脉西翼南端的高峰，海拔三千零八十多米，相对高度一千三百多米，位于新城市北苑区与南驿区之间的高山上。峰顶被索利冰川覆盖，冰帽在晴天从新城市清晰可见，是新城的地标，与东北方的霍尔沃思峰南北相对。索利冰川以索利峰为中心向北铺展到马斯林山口南侧，是全岛第二大的冰川。北苑区北部的山脚下是森林和溪谷，新城居民常来这里徒步和野餐；登顶则须穿越冰川，属于高山探险路线，夏季也须结组并携带冰爪。
      en: The high summit at the southern end of the Maslin Range's western arm, just over 3,080 m with a prominence of over 1,300 m, standing in the mountains between North Gardens and South Post districts of New City. It is capped by the Sorley Glacier, whose ice is clearly visible from New City on fine days and serves as the city's landmark, and it faces Mount Hallworth far to the north-east, a southern crown answering a northern one. Centred on the peak, the glacier stretches north to just south of Maslin Pass and is the second largest on the island. The forests and stream valleys at the foot of the mountains in the north of North Gardens are a favourite with New City families for walks and picnics, while the summit itself is a high-mountain expedition across the ice, roped up and with crampons even in summer.
  - id: nat_4xvk5v
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [148.2, 71.8] }
    names: { zh: 洛龙峰, en: Lorond Peak, art-x-viking: Lorondspitze }
    notes:
      zh: 洛龙山脉最高峰，海拔两千七百零一米，相对高度两千五百多米，位于洛龙山市杉岭区，洛龙山市因其得名。峰顶和北坡被一千多平方公里的洛龙冰川覆盖，南侧是较小的杉岭冰川，晴天时从塔夫鲁普库维克平原和新城都能望见它白色的山体。洛龙峰是北维京岛登山者心目中的经典山峰：登顶路线从杉岭区的森林出发，穿过冰川上的冰裂缝区到达峰顶，通常需要两到三天，夏季是唯一适合攀登的季节。上千平方公里的洛龙冰川、杉岭冰川和深峡湖一起，让洛龙山市成为登山和徒步的胜地。
      en: "The highest summit of the Lorond Range, 2,701 m with a prominence of over 2,500 m, in Fir Ridge District of Lorond Mountain City, which is named after it. Its summit and northern side are covered by the more than 1,000 km² of the Lorond Glacier, with the smaller Fir Ridge Glacier to the south, and on a clear day its white bulk can be seen from the Tavrupukkuvik plain and from New City. Lorond Peak is a classic among North Viking climbers: the route to the top sets out from the forests of Fir Ridge District and crosses the crevasse fields of the glacier, usually taking two or three days, and summer is the only season for an ascent. Together with the Lorond Glacier, the Fir Ridge Glacier and Gorge Lake, it makes Lorond Mountain City a favourite with climbers and walkers."
  - id: nat_8ess6e
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [148.2, 111.8] }
    names: { zh: 德雷卡廷峰, en: Drekatind, art-x-viking: Drekatind }
    notes:
      zh: 洛龙山脉北段的主峰，海拔两千二百六十多米，位于洛龙山市龙关区，南面俯瞰龙关山口，峰顶周围是近一百平方公里的德雷卡廷冰川。山峰形似昂起的龙头，与南面的山脊合称「龙脊」，龙关和龙关区也都与这条「龙」有关。德雷卡廷峰北面不远是澄湖，晴天时从澄湖北岸南望，雪峰倒映湖中，是全岛最受欢迎的风景之一；龙关高速在德雷卡廷峰以北穿过洛龙山脉主脊。夏季登山者从龙关集镇出发，由向导带领穿越德雷卡廷冰川登顶。
      en: The main summit of the northern Lorond Range, a little over 2,260 m, in Dragon Pass District of Lorond Mountain City, looking south over Dragon Pass and ringed by the nearly 100 km² of the Drekatind Glacier. Shaped like a dragon's raised head, it forms the "Dragon's Spine" with the ridges to the south, and both Dragon Pass and the district carry on the dragon theme. Clear Lake lies a short way north, and from its north shore on a fine day the snow peak is mirrored in the water, one of the best-loved views on the island; the Long Pass Expressway passes beneath the main ridge north of the peak. In summer climbers set out from the town of Dragon Pass and cross the Drekatind Glacier to the summit with a guide.
  - id: nat_baqmce
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [146.2, 88.2] }
    names: { zh: 杉顶, en: Fir Top, art-x-viking: Fichtenkopf }
    notes:
      zh: 洛龙山脉中段的山峰，海拔两千三百七十多米，位于洛龙山市杉岭区，杉岭垭口以北。峰顶覆盖着一百二十多平方公里的杉顶冰川，山腰以下是茂密的云杉林，林海一直铺到山脚，杉岭区就因这片林海得名，「杉顶」则意为杉林之上的山顶。杉顶南面是杉岭垭口，杉岭公路和环北维京岛高速都在那一带经过洛龙山脉，晴天时从公路上就能望见杉顶的冰帽。杉岭林业研究所长期在杉顶的山坡上研究树种培育和林线变化，杉顶也是杉岭森林公园徒步路线的远景。
      en: A summit in the middle of the Lorond Range, a little over 2,370 m, in Fir Ridge District of Lorond Mountain City, north of Fir Ridge Col. Its summit carries the more than 120 km² of the Fir Top Glacier, and below its shoulders a dense spruce forest runs right down to the foot of the mountain; Fir Ridge District takes its name from the forest, and Fir Top means the summit above the firs. Fir Ridge Col lies to the south, where the Fir Ridge Highway and the ring expressway pass through the range, and on a clear day the ice cap of Fir Top can be seen from the road. The Fir Ridge Forestry Institute has long studied tree breeding and the tree line on its slopes, and the peak is the backdrop to the trails of Fir Ridge Forest Park.
  - id: nat_8e3s2q
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [68.8, 133.2] }
    names: { zh: 西尔米卡塔克峰, en: Mount Sirmiqattaq, art-x-viking: Sirmiqattaqspitze }
    notes:
      zh: 寒岭最高峰，海拔两千四百一十多米，相对高度两千一百多米，位于西北市寒岭区，峰顶的西尔米卡塔克冰川终年不化，像一顶白色的霜冠，山名由此而来。西尔米卡塔克峰西接基尔纳克山口和帕利基尔纳克峰，东经蒂鲁山口与瓦格恩廷峰相连，北坡直落北海岸，南坡是寒岭区的原始森林和高山草甸。西岸公路的终点离山峰只有十来公里，从那里徒步上山要穿过森林和草甸，登顶须穿越冰川，夏季有向导带队。寒岭生态研究站长期在西尔米卡塔克峰一带监测冰川和野生动物，冬季山脚下的越野滑雪道吸引着不少游客。
      en: The highest summit of the Frost Ridge, a little over 2,410 m with a prominence of more than 2,100 m, in Frost Ridge District of Northwest City. The Sirmiqattaq Glacier on its summit never melts and sits on it like a crown of frost, hence the name. To the west lie Kirnaq Pass and Mount Paalikirnaq, to the east it connects through Tirru Pass to Vagntind, and its northern side drops straight to the north coast while its southern slopes carry the old-growth forest and alpine meadows of Frost Ridge District. The West Coast Highway ends only ten kilometres or so from the peak; from there the walk up leads through forest and meadow, and the summit itself is reached across the glacier, with guided parties in summer. The Frost Ridge Ecological Station has long monitored the ice and the wildlife around the peak, and in winter the cross-country ski trails at its foot draw many visitors.
  - id: nat_chx2bf
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [52.2, 131.2] }
    names: { zh: 帕利基尔纳克峰, en: Mount Paalikirnaq, art-x-viking: Paalikirnaqspitze }
    notes:
      zh: 寒岭西段的山峰，海拔两千二百四十多米，位于西北市寒岭区，是寒岭的西端。山峰北坡陡峭，冬季积雪厚重，峰顶常年被白雪覆盖，远看像一头蹲伏的白狼。当地传说冬季有白狼在山上出没，山名由此而来，东边的基尔纳克山口也因此得名。寒岭生态研究站的红外相机确实常在这一带拍到狼的身影，寒岭的狼群主要在西段的原始森林中活动。夏季可以从基尔纳克山口沿山脊登顶，西南望寒岭峡湾，北望北海岸，是寒岭西段视野最好的山峰之一。
      en: A summit in the western Frost Ridge, a little over 2,240 m, in Frost Ridge District of Northwest City, marking the western end of the ridge. Its northern face is steep, the winter snow lies deep, and the white-capped summit looks from afar like a crouching white wolf. Local legend tells of white wolves roaming the mountain in winter, which gave it its name, and Kirnaq Pass to the east takes its name from the same story. The camera traps of the Frost Ridge Ecological Station do often catch wolves here, and the wolf packs of the Frost Ridge range mostly through the old-growth forest of its western part. In summer it can be climbed along the ridge from Kirnaq Pass, with views south-west to Frost Fjord and north to the coast, one of the finest viewpoints on the western ridge.
  - id: nat_g4572m
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [84.2, 132.2] }
    names: { zh: 瓦格恩廷峰, en: Vagntind, art-x-viking: Vagntind }
    notes:
      zh: 西北市望星区寒岭东段的山峰，海拔两千一百多米，位于蒂鲁山口以东。冬夜从望星区南望，北斗七星正悬于峰顶之上，山峰因此得名，望星区的居民把它当作冬季夜空的路标。瓦格恩廷峰西接蒂鲁山口，东面是尼尔萨皮里山口和尼尔萨图克山，寒岭从这里开始逐渐降低。峰顶是一片碎石和苔原，夏季可以从蒂鲁山口沿山脊徒步登顶，一路俯瞰望星湾和北海岸。望星区夜空清澈，冬季长夜里常有极光掠过瓦格恩廷峰，天文爱好者喜欢在山脚取景，把山峰、北斗和极光同时摄入画面。
      en: A summit in the eastern Frost Ridge in Stargaze District of Northwest City, a little over 2,100 m, east of Tirru Pass. On winter nights, looking south from Stargaze District, the seven stars of the Plough hang directly above its summit, which gave it its name, and local people use it as a landmark in the winter sky. Tirru Pass lies to the west, and to the east Nirsapirri Pass and Nirsatuuq Hill, where the Frost Ridge begins to fall away. The summit is a stretch of scree and tundra, and in summer it can be climbed along the ridge from Tirru Pass, with views over Stargaze Bay and the north coast all the way. The skies of Stargaze District are clear, the aurora often sweeps over the peak in the long winter nights, and astronomers like to set up at its foot to frame the peak, the Plough and the aurora together.
  - id: nat_reahta
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [256.2, 59.2] }
    names: { zh: 天台山, en: Sky Terrace Mountain, art-x-viking: Himmelterrassenberg }
    notes:
      zh: 马斯林山脉南翼东端的孤峰，海拔一千七百二十多米，相对高度一千五百多米，矗立在天城市天台区的海岸背后。山顶是一片平坦的台地，远看像一座天上的平台，天台区和天城市都由此得名。山坡上是茂密的森林和步道，登山缆车从天台区的度假区出发，把游客送上山顶观赏日出、柳萨湾和天台峡湾；晴天时山顶视野开阔，东南海岸的度假区和海湾尽收眼底。天台山脚下是度假酒店和天台国际会议中心，山与海相依，是天城最有代表性的风景，四季都有游客登山。
      en: An isolated summit at the eastern end of the Maslin Range's southern arm, just over 1,720 m with a prominence of more than 1,500 m, rising behind the coast of Sky Terrace District in Skytown. Its top is a flat tableland that looks from afar like a terrace in the sky, and it gave both the district and the city their names. Forests and footpaths cover its slopes, and a cable car from the resorts of Sky Terrace carries visitors to the top to watch the sunrise over Ljosa Bay and Sky Terrace Fjord; on a clear day the resorts and bays of the south-east coast are spread out below. Resort hotels and the Sky Terrace International Convention Centre stand at its foot, mountain and sea side by side, the most characteristic view in Skytown, and people climb it in every season.
  - id: nat_m92aq4
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [229.8, 50.2] }
    names: { zh: 铁岗山, en: Iron Knoll, art-x-viking: Eisenkopf }
    notes:
      zh: 马斯林山脉南翼西端的山峰，海拔一千三百七十多米，位于萨科勒市铁岗区，山体富含铁矿，铁岗区因此得名。铁岗山一带的铁矿开采历史悠久，山上的露天矿坑和竖井曾是全岛最主要的铁矿来源；矿藏逐渐采尽后，部分矿山仍在开采石料和建筑骨料，规模已大为缩小，旧矿区周围铺开了铁岗先进制造产业园。铁岗矿业博物馆由旧铁矿的选矿厂改建，游客可以乘坐矿车深入地下巷道。山的西侧是萨科山口，古道翻过山口通往萨科湾；从山顶可以望见萨科湾、旧矿坑和山脚下的工业园。
      en: A summit at the western end of the Maslin Range's southern arm, a little over 1,370 m, in Iron Knoll District of Sakole; its iron-rich rock gave the district its name. Iron has been mined here for a long time, and the open pits and shafts on the mountain were once the island's main source of ore. As the deposits ran out, some quarries carried on producing stone and aggregate on a much smaller scale, and the Iron Knoll Advanced Manufacturing Park has spread around the old mining area. The Iron Knoll Mining Museum, built in the old ore-dressing plant, takes visitors by mine cart into the underground galleries. Sako Pass lies to the west, where an old track crosses to Sako Bay, and from the summit you can see Sako Bay, the old pits and the industrial park at the foot of the mountain.
  - id: nat_5xevyh
    subtype: peak
    status: generated
    detect: { kind: peak, at_km: [97.8, 128.2] }
    names: { zh: 尼尔萨图克山, en: Nirsatuuq Hill, art-x-viking: Nirsatuuqberg }
    notes:
      zh: 寒岭东端的山峰，海拔一千一百六十多米，位于西北市望星区，尼尔萨皮里山口以东。山顶两座峰头并立，中间隔着一道浅浅的鞍部，远看形似一对鹿角，山名由此而来，西边的尼尔萨皮里山口（意为「驯鹿之路」）也与它一起构成寒岭东端以驯鹿为名的一组地名。寒岭到这里已降为低缓的丘陵，山坡上是桦树林和苔原，每年春秋两季鹿群经尼尔萨皮里山口迁徙时，尼尔萨图克山的山坡是观看鹿群的好地方。山顶可以徒步半天往返，北望望星湾，南望西北市的科研走廊，是望星区居民周末常去的地方。
      en: A summit at the eastern end of the Frost Ridge, a little over 1,160 m, in Stargaze District of Northwest City, east of Nirsapirri Pass. Two tops stand side by side, separated by a shallow saddle, and from a distance they look like a pair of antlers, hence the name; with Nirsapirri Pass to the west it gives the eastern end of the ridge its run of deer names. Here the Frost Ridge has fallen to gentle hills, its slopes covered in birch and tundra, and when the herds cross by Nirsapirri Pass each spring and autumn the slopes of Nirsatuuq Hill are a good place to watch them. The summit is a half-day walk there and back, with views north to Stargaze Bay and south to Northwest City's research corridor, and Stargaze people often come up at weekends.

  # ── Passes ───────────────────────────────────────────────
  - id: nat_h9chf5
    subtype: pass
    status: generated
    detect: { kind: pass, at_km: [211.2, 94.2] }
    names: { zh: 马斯林山口, en: Maslin Pass, art-x-viking: Maslinpass }
    notes:
      zh: 马斯林山脉西翼的鞍部，海拔一千七百六十多米，位于厄定河市上厄定改良区，分隔北面的雅尔斯托尔峰山体和南面的索利峰山体。鞍部以南就是索利冰川的北缘，以北是雅尔斯托尔冰原所在的北翼高山，山口本身则是两片冰原之间一段较低的岩石山脊，夏季积雪融化后露出苔原和碎石坡。山口西侧是厄定河上游的荒野，东侧俯临马斯林山盆地，旧时驯鹿牧民和猎人曾经由这里往来于两地。如今山口仍不通公路，只有护林员和野外探险者偶尔经过，是马斯林山脉最荒凉的地方之一。
      en: A saddle in the western arm of the Maslin Range, just over 1,760 m high, in the Upper Erding Improvement District of Erding River City, dividing the Jarlstol massif to the north from the Mount Sorley massif to the south. Just south of it begins the northern edge of the Sorley Glacier, and to the north rise the high mountains of the northern arm under the Jarlstol Icefield; the pass itself is a lower stretch of rocky ridge between the two icefields, where tundra and scree show through once the snow melts in summer. To the west lies the wilderness of the upper Erding, and to the east it looks down on the Maslin basin; reindeer herders and hunters once crossed here between the two. There is still no road over it, and only forest rangers and the occasional expedition pass by, one of the loneliest places in the Maslin Range.
  - id: nat_68ggx2
    subtype: pass
    status: generated
    detect: { kind: pass, at_km: [146.8, 104.2] }
    names: { zh: 龙关, en: Dragon Pass, art-x-viking: Drachenpass }
    notes:
      zh: 洛龙山脉中北部的山口，海拔一千七百米，位于洛龙山市杉岭区，德雷卡廷峰以南。龙关自古就是翻越洛龙山脉中北段的要道，旧时的驿站、马厩和关卡至今保存在龙关驿站博物馆里，讲述着商队和邮差冒雪翻山的故事，东北麓谷地里的龙关集镇和龙关区都由山口得名。如今的公路都不经过山口：龙关高速改从德雷卡廷峰以北穿过主脊，杉岭公路则在南面的杉岭垭口附近以隧道穿山，老山口只剩下一条石砌古道。夏季徒步者沿古道走一整天，可以从山口俯瞰两侧的谷地和远处的澄湖。
      en: "A pass in the north-central Lorond Range, about 1,700 m high, in Fir Ridge District of Lorond Mountain City, south of Drekatind. Dragon Pass has long been the main way over the north-central range: its old post house, stables and toll gate survive in the Dragon Pass Post House Museum, which tells of caravans and postmen crossing the mountains in the snow, and the town of Dragon Pass in the valley to the north-east, and Dragon Pass District, take their names from it. No road uses the pass today: the Long Pass Expressway crosses beneath the main ridge north of Drekatind, and the Fir Ridge Highway tunnels through near Fir Ridge Col to the south, leaving the old pass to a stone-paved track. In summer walkers follow it for a full day, looking down from the pass on the valleys on both sides and the distant Clear Lake."
  - id: nat_m6jx55
    subtype: pass
    status: generated
    detect: { kind: pass, at_km: [243.8, 114.2] }
    names: { zh: 西坪垭口, en: West Heath Saddle, art-x-viking: Westheidesattel }
    notes:
      zh: 马斯林山脉北翼雅尔斯托尔峰与卡瓦卢克图克峰之间的鞍部，海拔三千四百九十多米，是北维京岛海拔最高的山口。鞍部被雅尔斯托尔冰原覆盖，终年冰雪不化，北侧冰舌下伸到厄定河市尼尔萨利特牧区的高原，南坡则是马斯林山市西坪区的高山草甸，西坪区和西坪垭口都由这片高原台地得名。垭口不通公路，冰面上暗藏冰裂缝，只有经过训练的登山队和驻军的高山分队才会穿越。站在南坡的西坪台地上，可以看到垭口两侧的雅尔斯托尔峰和卡瓦卢克图克峰，以及每逢发射日从台地上空升起的火箭尾焰。
      en: A saddle in the northern arm of the Maslin Range between Jarlstol and Mount Qavvaluktuuq, just under 3,500 m and the highest pass on North Viking Island. It lies under the Jarlstol Icefield and is never free of snow and ice; on the north side the ice tongues reach down to the upland of the Nirsaliit Pastoral District in Erding River City, while the southern slope falls to the alpine meadows of West Heath District in Maslin Mountain City, after whose upland plateau both the district and the saddle are named. No road crosses it, and hidden crevasses mean that only trained mountaineering teams and the garrison's alpine units attempt the crossing. From the West Heath plateau below you can see Jarlstol and Mount Qavvaluktuuq on either side of the saddle, and on launch days the trails of rockets climbing above the plateau.
  - id: nat_qksmah
    subtype: pass
    status: generated
    detect: { kind: pass, at_km: [147.2, 83.8] }
    names: { zh: 杉岭垭口, en: Fir Ridge Col, art-x-viking: Fichtensattel }
    notes:
      zh: 洛龙山市杉岭区洛龙峰与杉顶之间的高海拔垭口，海拔两千零八十多米，是洛龙山脉中南段的分水岭。垭口北侧紧邻洛龙冰川，四周是碎石坡和终年积雪，夏季也常有风雪。旧时翻越这里要走险峻的盘山道，如今杉岭公路以隧道代替盘山道，从垭口附近穿过主脊，环北维京岛高速也从垭口近旁通过，把塔夫鲁普库维克平原与洛龙山东麓连在一起。杉岭森林公园的徒步道从山下的云杉林一路上行到垭口，晴天时可以同时看到洛龙冰川和杉顶的冰帽，是杉岭区最经典的登山路线之一。
      en: A high col between Lorond Peak and Fir Top in Fir Ridge District of Lorond Mountain City, a little over 2,080 m, on the watershed of the central and southern Lorond Range. The Lorond Glacier lies right against its northern side, and around it are scree slopes and permanent snow, with snow squalls even in summer. In the past the crossing meant a steep zigzag track; today the Fir Ridge Highway tunnels beneath the crest close to the col, and the ring expressway also passes nearby, linking the Tavrupukkuvik plain with the eastern foot of the range. A trail from Fir Ridge Forest Park climbs from the spruce woods below to the col, from which on a clear day you can see both the Lorond Glacier and the ice cap of Fir Top, one of the classic climbs of Fir Ridge District.
  - id: nat_ryk6ny
    subtype: pass
    status: generated
    detect: { kind: pass, at_km: [61.2, 130.8] }
    names: { zh: 基尔纳克山口, en: Kirnaq Pass, art-x-viking: Kirnaqpass }
    notes:
      zh: 寒岭西段帕利基尔纳克峰与西尔米卡塔克峰之间的山口，海拔一千八百二十多米，位于西北市寒岭区与鹿鸣区之间。山口两侧是陡峭的岩壁，冬季北风从海上灌入，在狭窄的缺口里呼啸而过，声如狼嚎，山口和西边的帕利基尔纳克峰都因此以塔夫鲁纳克语里的「狼」（基尔纳克）为名。基尔纳克山口不通公路，只有一条古老的猎人小道翻越山口，连接寒岭南坡的森林和北海岸，夏季常有徒步者沿这条小道走寒岭西段的穿越路线。山口附近是寒岭生态研究站的野生动物监测区，红外相机常拍到狼、猞猁和驯鹿的身影。
      en: A pass in the western Frost Ridge between Mount Paalikirnaq and Mount Sirmiqattaq, just over 1,820 m, on the line between Frost Ridge and Deersong districts of Northwest City. Steep rock walls flank it, and in winter the north wind pours in from the sea and howls through the narrow gap like a wolf, which is why both the pass and Mount Paalikirnaq to the west bear the name. No road crosses it; only an old hunters' path climbs over, linking the forests on the south side of the Frost Ridge with the north coast, and in summer walkers follow it on traverses of the western ridge. The area around the pass is a wildlife monitoring zone of the Frost Ridge Ecological Station, whose camera traps often catch wolves, lynx and reindeer.
  - id: nat_28qqas
    subtype: pass
    status: generated
    detect: { kind: pass, at_km: [80.2, 132.8] }
    names: { zh: 蒂鲁山口, en: Tirru Pass, art-x-viking: Tirrupass }
    notes:
      zh: 西北市望星区寒岭中段的山口，海拔一千八百五十多米，位于西尔米卡塔克峰与瓦格恩廷峰之间。从南面望去，两座山峰之间的缺口像一道敞开的门，晴朗的冬夜，星空和极光从门中透出，山口由此得名；站在山口北望，就是望星湾和北海岸的海面。蒂鲁山口不通公路，一条徒步小道从寒岭南坡的森林上行，越过山口下到望星湾畔，是寒岭最受欢迎的穿越路线之一，夏季要走一整天，冬季积雪深厚时只有经验丰富的越野滑雪者才会尝试。山口附近视野开阔、光污染极少，也是天文爱好者拍摄星空的地方。
      en: A pass in the middle of the Frost Ridge in Stargaze District of Northwest City, just over 1,850 m high, between Mount Sirmiqattaq and Vagntind. Seen from the south, the gap between the two peaks looks like an open gate, and on clear winter nights the stars and the aurora shine through it, which gave the pass its name; from the pass itself the view north is over Stargaze Bay and the sea of the north coast. No road crosses it. A footpath climbs from the forest on the south side of the Frost Ridge, crosses the pass and drops to the shore of Stargaze Bay, one of the most popular traverses of the ridge, a full day's walk in summer, while in deep winter snow only experienced cross-country skiers attempt it. Wide skies and almost no light pollution also make it a place for photographing the night sky.
  - id: nat_6p167r
    subtype: pass
    status: generated
    detect: { kind: pass, at_km: [225.2, 48.2] }
    names: { zh: 萨科山口, en: Sako Pass, art-x-viking: Sakopass }
    notes:
      zh: 萨科勒市铁岗山西侧的山口，海拔一千一百五十多米，位于萨科区与铁岗区之间，是马斯林山脉南翼西端的低鞍部，连接萨科区与东南沿海。旧时萨科镇的渔民和铁岗的矿工就沿着山口的古道往来，把鱼货运进矿区、把铁器带回渔镇。如今山口不通公路，古道成了登山者喜爱的去处，沿途是石楠荒坡和桦树林，山口上可以同时望见萨科湾和铁岗山的旧矿坑。秋季石楠花开时，整片山坡染成紫红色，萨科老镇的巴克汉姆人常在这时结伴上山。
      en: "A pass west of Iron Knoll in Sakole, a little over 1,150 m, between Sako and Iron Knoll districts: a low saddle at the western end of the Maslin Range's southern arm linking Sako District with the south-east coast. In the past the fishermen of Sako and the miners of Iron Knoll travelled the old track over the pass, carrying fish into the mining country and bringing ironware back to the fishing town. Today no road crosses the pass, and the old track has become a favourite with walkers, climbing through heather and birch to a saddle from which you can see Sako Bay and the old open pits of Iron Knoll at once. When the heather flowers in autumn the hillsides turn purple-red, and Buckham families from the old town of Sako come up together to see it."
  - id: nat_0syp9a
    subtype: pass
    status: generated
    detect: { kind: pass, at_km: [96.2, 128.2] }
    names: { zh: 尼尔萨皮里山口, en: Nirsapirri Pass, art-x-viking: Nirsapirripass }
    notes:
      zh: 西北市望星区寒岭东端的低山口，海拔九百三十多米，位于瓦格恩廷峰与尼尔萨图克山之间，是寒岭最低的山口。寒岭到这里已降为低缓的丘陵，山口两侧是桦树林和苔原，每年春秋两季，鹿群沿着山口翻越寒岭，在南坡的森林和北海岸的夏季草场之间迁徙，山口由此得名。迁徙季节，寒岭生态研究站的研究人员会在山口统计鹿群数量，望星区的居民也常来山坡上远远观看。尼尔萨皮里山口不通公路，为了不干扰迁徙，山口一带只开放一条徒步小道，迁徙高峰期还会临时关闭。
      en: A low pass at the eastern end of the Frost Ridge in Stargaze District of Northwest City, just over 930 m high, between Vagntind and Nirsatuuq Hill, and the lowest pass on the ridge. Here the Frost Ridge has dropped to gentle hills, with birch woods and tundra on either side, and every spring and autumn herds of deer cross the ridge through the pass on their way between the forests of the south side and the summer pastures of the north coast, which gave it its name. In the migration season researchers from the Frost Ridge Ecological Station count the herds at the pass, and people from Stargaze District come to watch from the slopes at a distance. No road crosses it; to avoid disturbing the animals only one footpath is open, and even that is closed at the height of the migration.

  # ── Glaciers (largest first) ─────────────────────────────
  - id: nat_hvjjwy
    subtype: glacier
    status: generated
    detect: { kind: glacier, at_km: [232.6, 114.4] }
    names: { zh: 雅尔斯托尔冰原, en: Jarlstol Icefield, art-x-viking: Jarlstoleisfeld }
    notes:
      zh: 北维京岛最大的冰原，面积五千多平方公里，覆盖马斯林山脉北翼，西起雅尔斯托尔峰，东到全岛最高峰蒂鲁尤阿克峰，平均海拔三千多米。冰原上耸立着雅尔斯托尔峰、卡瓦卢克图克峰、霍尔沃思峰和蒂鲁尤阿克峰四座四千米级高峰，西坪垭口的鞍部也埋在冰雪之下。冰原的北坡朝向尼尔萨利特，冰舌在这一侧下伸得最低，牧场边缘就与冰原相连；南坡俯临西坪区的高山草甸和群峰训练管理区。冰原东段的峰顶建有蒂鲁尤阿克峰光学观测站和霍尔沃思峰激光站，人员和物资只能靠直升机运送。冰原的融水顺南北两坡流下，汇入马斯林河和尼尔萨利特的河流。
      en: The largest icefield on North Viking Island, more than 5,000 km² of ice over the northern arm of the Maslin Range from Jarlstol in the west to Mount Tirrujuaq, the island's highest summit, in the east, at a mean height of over 3,000 m. Four four-thousand-metre summits rise from it, Jarlstol, Mount Qavvaluktuuq, Mount Hallworth and Mount Tirrujuaq, and the saddle of West Heath Saddle lies buried beneath its snow. The north side faces the Nirsaliit, where the ice tongues reach lowest and the pastures run right up to the edge of the ice; the south side looks down on the alpine meadows of West Heath District and the High Peaks Training Area. On the summits at its eastern end stand the Mount Tirrujuaq Optical Station and the Mount Hallworth Laser Station, supplied only by helicopter. Its meltwater runs down both sides into the Maslin River and the rivers of the Nirsaliit.
  - id: nat_62jkkn
    subtype: glacier
    status: generated
    detect: { kind: glacier, at_km: [212.6, 67.1] }
    names: { zh: 索利冰川, en: Sorley Glacier, art-x-viking: Sorleygletscher }
    notes:
      zh: 覆盖马斯林山脉西翼南段的大冰川，面积一千七百多平方公里，在北维京岛仅次于雅尔斯托尔冰原。冰川以索利峰为中心，沿西翼山脊向北一直延伸到马斯林山口南侧，平均海拔约两千五百米，冰盖边缘伸出多条冰舌，融水向西流入厄定河上游的荒野，向东则汇入马斯林山盆地。索利峰和它的冰帽在晴天从新城市清晰可见，北苑区北部的山脚下是新城居民徒步和野餐的森林与溪谷。冰川一带不通公路，登山者从北苑或上厄定改良区出发，要徒步一两天才能到达冰缘，夏季也须结组并携带冰爪。
      en: "The great glacier on the southern part of the Maslin Range's western arm, more than 1,700 km² of ice, second on North Viking Island only to the Jarlstol Icefield. Centred on Mount Sorley, it stretches north along the crest of the western arm to just south of Maslin Pass at a mean height of about 2,500 m, and many tongues push out from its edges; its meltwater runs west into the wilderness of the upper Erding and east into the Maslin basin. Mount Sorley and its ice cap are clearly visible from New City on fine days, and the forests and stream valleys at the foot of the mountains in the north of North Gardens District are where New City families go walking and picnicking. No road comes near the ice: climbers set out from North Gardens or the Upper Erding Improvement District and walk a day or two to reach its edge, roped up and with crampons even in summer."
  - id: nat_1r9x72
    subtype: glacier
    status: generated
    detect: { kind: glacier, at_km: [149.6, 75.6] }
    names: { zh: 洛龙冰川, en: Lorond Glacier, art-x-viking: Lorondgletscher }
    notes:
      zh: 洛龙山脉最大的冰川，面积一千零四十多平方公里，覆盖洛龙山脉最高峰洛龙峰的北坡，最高处就是海拔两千七百零一米的洛龙峰顶，平均海拔两千三百多米。冰川从洛龙峰向北铺展到杉岭垭口一带，冰舌伸入两侧的山谷，环北维京岛高速从冰川边缘附近经过，司机在晴天就能看到冰原和冰舌。洛龙山市以洛龙峰和这片冰原闻名，上千平方公里的洛龙冰川与杉岭冰川、深峡湖一起，让这里成为登山和徒步的胜地。冰川融水是厄定河源头的重要补给。
      en: The largest glacier in the Lorond Range, more than 1,040 km² of ice covering the northern side of Lorond Peak, the range's highest summit; its top is the 2,701 m summit itself, and its mean height is a little over 2,300 m. The ice spreads north from Lorond Peak towards Fir Ridge Col, with tongues reaching down into the valleys on either side. The ring expressway passes close to its edge, so drivers can see the icefield and its tongues on a clear day. Lorond Mountain City is known for Lorond Peak and this icefield, which together with the Fir Ridge Glacier and Gorge Lake make the area a favourite for climbing and walking. Meltwater from the glacier is an important source of the Erding River.
  - id: nat_azh3cs
