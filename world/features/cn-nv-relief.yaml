    names: { zh: 杉顶冰川, en: Fir Top Glacier, art-x-viking: Fichtenkopfgletscher }
    notes:
      zh: 覆盖洛龙山脉中段杉顶峰顶的冰川，面积一百二十多平方公里，最高处海拔两千三百多米。冰帽从峰顶向四周铺开，在山腰以上与杉顶的岩壁和雪坡相接，山腰以下则是茂密的云杉林，杉岭区的名字就来自这片林海。冰川南面不远是杉岭垭口，杉岭公路和环北维京岛高速都在垭口附近经过洛龙山脉，晴天时从公路上可以望见杉顶白色的冰帽。冰川融水顺山谷流下，汇成杉岭林海里的溪流。冰川一带不通公路，登山者从杉岭的林场出发，沿林道和碎石坡上行，一天可以到达冰缘。
      en: The glacier capping Fir Top in the middle of the Lorond Range, more than 120 km² of ice reaching just over 2,300 m. The ice cap spreads from the summit to meet the rock walls and snow slopes of the upper mountain, and below its shoulders lies the dense spruce forest that gave Fir Ridge District its name. Fir Ridge Col lies a short way south, where both the Fir Ridge Highway and the ring expressway pass through the range, and on a clear day the white cap of Fir Top can be seen from the road. Its meltwater runs down the valleys into the streams of the Fir Ridge forest. No road comes near the ice; climbers set out from the forestry camps of Fir Ridge and follow forest tracks and scree slopes up to its edge in a day.
  - id: nat_wwyev3
    subtype: glacier
    status: generated
    detect: { kind: glacier, at_km: [71.6, 134.4] }
    names: { zh: 西尔米卡塔克冰川, en: Sirmiqattaq Glacier, art-x-viking: Sirmiqattaqgletscher }
    notes:
      zh: 西北市寒岭区西尔米卡塔克峰顶的冰川，面积一百三十多平方公里，最高处海拔两千四百一十多米，是寒岭唯一较大的冰川。冰帽终年不化，覆盖着寒岭最高峰西尔米卡塔克峰的峰顶，「霜冠」之名就来自这顶白色的冰冠；冰舌沿南坡伸入原始森林上方的高山草甸，北坡则俯临北海岸的海湾。寒岭生态研究站长期监测西尔米卡塔克冰川的进退和融水变化，许多大学的野外实习也在这里进行。冰川观光是寒岭区近年兴起的生态旅游项目，向导带领游客从森林边缘徒步上冰，冬季则有越野滑雪路线绕行冰川脚下。
      en: The glacier on the summit of Mount Sirmiqattaq in Frost Ridge District of Northwest City, more than 130 km² of ice rising to just over 2,410 m, and the only sizeable glacier on the Frost Ridge. The ice cap never melts and covers the summit of the ridge's highest peak; the name Mount Sirmiqattaq comes from this white crown. Its tongues reach down the southern side to the alpine meadows above the old-growth forest, while the northern side looks out over the bays of the north coast. The Frost Ridge Ecological Station has long monitored the glacier's advance and retreat and its meltwater, and many universities run their field courses here. Glacier walks are one of the eco-tourism trips that have grown up in Frost Ridge District in recent years, with guides leading visitors from the forest edge onto the ice, and in winter cross-country ski trails circle below it.
