      zh: 洛龙山脉中段的山峰，山腰以下为茂密的云杉林，杉岭区因此得名。
      en: Summit in the middle of the Lorond Range. Dense spruce forest below its shoulders gave Fir Ridge District its name.
  - id: nat_8e3s2q
