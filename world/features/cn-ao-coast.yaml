  # ── Fjords ──────────────────────────────────────────────
  - id: nat_mhybpm
    subtype: fjord
    status: generated
    detect: { kind: fjord, at_km: [330.2, 96.8] }
    names: { zh: 努卡塔克峡湾, en: "Nuqattaaq Fjord", art-x-tavrunaq: Nuqasuvva }
    notes:
      zh: "努卡塔克峡湾是首府努卡塔克的大峡湾，长约 79 公里，面积约 610 平方公里，是领地最长的峡湾，塔夫鲁纳克语名 Nuqasuvva 由 nuqa（港）和 suvva（峡湾）合成，意为「港峡湾」。峡湾从北面的大湖苔原伸向南岸的大海，内段两岸是低缓的苔原和湖沼，属伊卢克图克生态保护区；外段两岸是首府的城区：库马尔维克区沿峡湾展开，领地政府、中央穹顶和铁路总站努卡塔克站都在这里，北冰洋大学所在的苏瓦利克区也在峡湾岸边，湾口两岸是由老渔港发展起来的努坎加克区和港口区伊马萨尔维克区。暖流让湾口终年不冻，伊马萨尔维克港区是领地最大的港区，集装箱、矿石、油品和滚装码头沿着突堤排开。西卢阿高速以一段直线的努卡塔克峡湾跨海大桥在努坎加克区和伊马萨尔维克区之间跨过湾口，努卡塔克环线也以大桥跨过峡湾。\n冬天峡湾上常飘着冰雾，船只像从雾里浮出来一样进出港；苏瓦利克冰雕园用的冰块也是从峡湾内段采来的，采冰的人赶在冰最厚最清的时候下锯，一块块冰砖用雪地车拖进城。首府人说，峡湾的两半各有各的脾气：外段的水终年流动，热闹得像一条街，内段的冰一冻就是大半年，安静得能听见冰层底下的水声。乌库拉克城区还有一条以它命名的努卡塔克峡湾街，地铁站也叫这个名字。"
      en: "Nuqattaaq Fjord is the great fjord of the capital, Nuqattaaq, about 79 km long and about 610 km² in area, the longest fjord in the territory; its Tavrunaq name, Nuqasuvva, joins nuqa, \"harbour\", and suvva, \"fjord\": \"harbour fjord\". It runs from the lake tundra in the north down to the sea on the south coast. The inner fjord lies between low tundra and marsh in the Illuqtuuq Nature Reserve; the outer fjord is lined with the capital's districts: Qummarvik District stretches along it, home to the Government of the Arctic Ocean Territory, the Central Dome and the main railway terminus, Nuqattaaq Station; Suvvalik District, with the University of the Arctic Ocean, also lies on its shore; and at its mouth stand Nuqangaq District, grown from the old fishing port, and the port district of Immasaarvik. The warm current keeps the mouth ice-free all year, and Immasaarvik Harbour, the largest port in the territory, ranges its container, ore, oil and ro-ro berths along the jetties. The Sillua Expressway crosses the mouth between Nuqangaq and Immasaarvik on the dead-straight Nuqattaaq Fjord Bridge, and the Nuqattaaq Ring Road also crosses the fjord by bridge.\nIn winter frost smoke often hangs over the fjord, and ships seem to float out of the fog as they come and go; the ice for the Suvvalik Ice Sculpture Garden is cut in the inner fjord too, the ice-cutters sawing when the ice is at its thickest and clearest and hauling the blocks into town by snowmobile. People in the capital say each half of the fjord has its own temper: the water of the outer fjord moves all year and bustles like a street, while the ice of the inner fjord stays frozen for more than half the year and is so quiet you can hear the water under it. In Ukkulaaq there is even a Nuqattaaq Fjord Street named after it, and a metro station of the same name."
