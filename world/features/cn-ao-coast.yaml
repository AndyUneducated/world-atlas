    notes:
      zh: "图拉卡特区南岸的岬角，暖流与冷空气在这里相遇，海面上常起浓雾，岬角由此得名，岬上设有雾笛。雾笛的声音低沉悠长，渔民说它「像一头在雾里叫的海象」，听惯了的人在雾里一听就知道自己的位置。"
      en: "A cape on the south coast of Tullakkat District, where the warm current meets cold air and thick fog often lies on the sea, hence the name; it has a foghorn. The foghorn's note is long and low, \"like a walrus calling in the fog\" as fishermen say, and those used to it can tell where they are by its sound."
  - id: nat_qy2q83
