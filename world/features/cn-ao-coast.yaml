      en: "A strait between the Qavvaluviit Islands, about 3 km wide, where the resort's boats sail at night in winter to watch the aurora. The hills on either side are low, so the whole sky is visible when the aurora appears, and the night boats douse their lights and slow down until only the sound of water is left."
