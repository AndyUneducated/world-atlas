    notes:
      zh: 通纳库维特群岛的主岛，面积约 3400 平方公里，海岸上成排的六角形玄武岩柱是保护区的核心，崖上栖息着海鸦与北极鸥。
      en: The main island of the Tuunnaquviit Islands, about 3,400 km²; the rows of hexagonal basalt columns on its coast are the heart of the reserve, and guillemots and Arctic gulls nest on the cliffs.
  - id: nat_ftskb5
    subtype: island
    status: generated
    detect: { kind: island, at_km: [123, 69] }
    names: { zh: 米尔尼克岛, en: Mirnik Island, art-x-tavrunaq: Mirnik }
    notes:
      zh: 通纳库维特群岛东部的岛屿，面积约 2800 平方公里，最高处海拔四百多米，由深色的玄武岩构成，岛名由此而来。
      en: An island in the east of the Tuunnaquviit Islands, about 2,800 km², rising to over 400 m and built of dark basalt, hence the name.
  - id: nat_w4fpp3
    subtype: island
    status: generated
    detect: { kind: island, at_km: [70, 69] }
    names: { zh: 尼帕克图克岛, en: Nipaqtuuq Isle, art-x-tavrunaq: Nipaqtuuq }
    notes:
      zh: 通纳库维特群岛西部的小岛，面积约 830 平方公里。海浪冲进岩柱之间的空隙，发出像管风琴一样的声音，岛名由此而来。
      en: A small island in the west of the Tuunnaquviit Islands, about 830 km². Waves rushing into the gaps between its columns sound like an organ, hence the name.

  # ── 图卡鲁维特群岛 ────────────────────────────────────────────
  - id: nat_3njsdv
    subtype: island
    status: generated
    detect: { kind: island, at_km: [39, 189] }
    names: { zh: 图卡尔尤阿克岛, en: Tukkarjuaq Island, art-x-tavrunaq: Tukkarjuaq }
    notes:
      zh: 图卡鲁维特群岛的主岛，面积约 3900 平方公里，岛名来自岛上的图卡尔尤阿克数据中心：它用极地冷空气和海水冷却服务器，余热为岛上的住宅供暖。
      en: The main island of the Tukkaruviit Islands, about 3,900 km², named after the Coldvault Data Centre on it, which cools its servers with polar air and seawater and heats the island's homes with the waste heat.
  - id: nat_x904y1
    subtype: island
    status: generated
    detect: { kind: island, at_km: [55, 161] }
    names: { zh: 阿利克塔克岛, en: Aliqtaq Isle, art-x-tavrunaq: Aliqtaq }
    notes:
      zh: 图卡鲁维特群岛东部的岛屿，面积约 1800 平方公里，西隔阿利克马苏克海峡与帕利塔库岛相望。连接世界各地的海底光缆在这里登陆，岛名由此而来。
      en: An island in the east of the Tukkaruviit Islands, about 1,800 km², facing Paalitaqqu Isle across Aliqmasuq Strait to the west. The submarine cables that link the islands to the rest of the world come ashore here, hence the name.
  - id: nat_estcp4
