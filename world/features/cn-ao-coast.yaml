    names: { zh: 乌库苏瓦峡湾, en: Ukkusuvva Fjord, art-x-tavrunaq: Ukkusuvva }
    notes:
      zh: "乌库苏瓦峡湾是乌库拉克市的峡湾，长约 57 公里，面积约 320 平方公里，在领地五条命名峡湾中排第三。峡湾名由 ukku（矿）和 suvva（峡湾）合成，意为「矿峡湾」。湾口是乌库努卡区的港口，暖流让码头终年不冻，基萨尔维克冶炼厂的产品和东部矿山的矿石从湾内的乌库努卡散货码头装船，旁边是油品码头和物流仓库，乌库拉克地铁1号线的起点站就设在码头边。峡湾内段深入西卢阿苏瓦特生态保护区，两岸是陡峭的山坡和冰川山地，保护区里海拔 2022 米的陶武皮鲁克峰是大陆上第二高的命名山峰，陶武西尔米冰川从峰顶向四周流下，融水沿着沟谷注入峡湾。一条市道从乌库努卡区通到保护区，近一半路段建在防雪棚下。峡湾外段繁忙，内段安静，夏天有徒步者和登山爱好者沿市道进山。\n峡湾两岸的山坡上，冶炼厂换班时的灯光一阵亮一阵暗，乌库拉克人说「看峡湾的灯就知道换班了」。冬夜里矿石船亮着灯从峡湾口进出，冰雾贴着水面浮动，码头的拱顶棚像几座发光的山丘。到了内段，灯光和机器声都听不见了，只有冰川融水的哗哗声，城里人周末划船进来，说是「去峡湾的另一半透透气」。"
      en: "Ukkusuvva Fjord is the fjord of Ukkulaaq City, about 57 km long and about 320 km² in area, the third longest of the territory's five named fjords. Its name joins ukku, \"ore\", and suvva, \"fjord\": \"ore fjord\". At its mouth is the harbour of Ukkunuqa District, kept ice-free all year by the warm current, where the products of the Qissarvik smelter and ore from the eastern mines are loaded at the Ukkunuqa Bulk Terminal, with an oil terminal and logistics warehouses beside it, and the first station of Ukkulaaq Metro Line 1 stands by the quay. The inner fjord reaches deep into the Silluasuvvat Nature Reserve between steep slopes and glaciated mountains; in the reserve Mount Tauvvupirruk, 2,022 m, is the second highest named peak on the mainland, the Tauvvusirmi Glacier flows down from its summit on every side, and its meltwater runs down the gullies into the fjord. A city road runs from Ukkunuqa District into the reserve, nearly half of it under snow sheds. The outer fjord is busy and the inner fjord quiet, and in summer hikers and climbers follow the road into the mountains.\nOn the slopes on either side the smelter's lights brighten and dim at each shift change, and Ukkulaaq people say \"you can tell the shift from the fjord lights\". On winter nights the ore ships pass in and out of the mouth with their lights on, frost smoke drifting low over the water and the vaulted roofs of the terminal glowing like hills. In the inner fjord the lights and the noise of machinery fall away, leaving only the rush of glacier meltwater, and townspeople paddle in at weekends for what they call \"a breath of air in the other half of the fjord\"."
  - id: nat_xxs71y
    subtype: fjord
    status: generated
    detect: { kind: fjord, at_km: [177.2, 104.8] }
    names: { zh: 萨尔苏瓦峡湾, en: Saarsuvva Fjord, art-x-tavrunaq: Saarsuvva }
    notes:
      zh: "萨尔苏瓦峡湾是萨尔瓦克市的峡湾，长约 55 公里，在领地五条命名峡湾中排第四，只比图拉苏瓦峡湾略长一点。湾口是萨尔瓦克的城区萨尔努卡区，南岸的暖流从湾口经过，港口终年不冻，萨尔努卡渔港就建在湾内，深海渔船和养殖运输船在这里卸货，岸上是冷库和水产加工厂；峡湾深处属普拉苏瓦米乌特区，两岸是陡峭的山坡和零散的峡湾村镇。普拉苏瓦公路从萨尔努卡区出发，向西北深入普拉苏瓦米乌特区的峡湾地带，一半以上的路段在防雪棚和落石棚下。晴天从峡湾内段向北望，能看见帕利皮鲁克峰顶的帕利西尔米冰川，它的倒影常常落在平静的水面上。\n极夜的日子里，峡湾口的灯塔和渔港的灯火连成一条光带，是从海上回家的人最熟悉的风景。峡湾深处的村子没有通到家门口的路，孩子们靠「校船」上学：清晨小船沿着峡湾挨村接人，到普拉苏瓦公路尽头的码头换乘校车，傍晚再一村一村送回去，船老大记得每个孩子家的灯是哪一盏。渔港的鱼市天不亮就开张，峡湾里的人家习惯把鱼切成薄片冻硬，蘸海盐和浆果酱生吃。到了夏天的永昼，渔民收网回来已是半夜，太阳却还挂在峡湾上空，码头上照样有人在补网、聊天。"
      en: "Saarsuvva Fjord is the fjord of Saarvaq City, about 55 km long, fourth of the territory's five named fjords and only slightly longer than Tullasuvva Fjord. Saarnuqa District, the city proper of Saarvaq, stands at its mouth; the south coast's warm current passes the entrance and keeps the port free of ice all year, and Saarnuqa Fishing Harbour lies inside the fjord, where deep-sea trawlers and fish-farm carriers land their catch beside cold stores and fish-processing plants. Its inner reaches belong to Pullasuvvamiut District, steep slopes with scattered fjord villages. The Pullasuvva Road sets out from Saarnuqa and runs north-west deep into the fjord country of Pullasuvvamiut, more than half of it under snow sheds and rockfall shelters. On clear days, looking north from the inner fjord, you can see the Paalisirmi Glacier on the summit of Mount Paalipirruk, its reflection often lying on the still water.\nIn the polar night the lighthouse at the fjord mouth and the lights of the harbour form a single band of light, the sight anyone coming home by sea knows best. The villages deep in the fjord have no road to their doors, and their children go to school by \"school boat\": in the early morning a small boat calls at each village in turn and takes them to the quay at the end of the Pullasuvva Road to change to the school bus, and in the evening brings them back village by village; the skipper knows which light belongs to each child's house. The fish market at the harbour opens before dawn, and fjord households slice their fish thin, freeze it hard and eat it raw dipped in sea salt and berry jam. In the midnight sun of summer the fishermen come back from hauling their nets at midnight with the sun still hanging over the fjord, and there are always people on the quay mending nets and chatting."
  - id: nat_q1g8ny
    subtype: fjord
    status: generated
    detect: { kind: fjord, at_km: [83.2, 151.2] }
    names: { zh: 图拉苏瓦峡湾, en: Tullasuvva Fjord, art-x-tavrunaq: Tullasuvva }
    notes:
      zh: "图拉苏瓦峡湾是图利瓦克市图拉卡特区的峡湾，长约 55 公里，面积约 320 平方公里，是领地五条命名峡湾中最短的。峡湾名由塔夫鲁纳克语的 tulli（冷）和 suvva（峡湾）合成，意为「冷峡湾」，和图利瓦克的市名出自同一个词根。峡湾两岸是陡峭的谷壁，峡湾向内陆延伸为苏瓦基卢克河谷，冷风从海拔 502 米的图拉卡蒂克山口沿谷地吹向海面，这座山口是领地最低的命名山口。峡湾两侧的河流筑有水电站，电力和冷空气吸引了大批数据中心落户，图拉卡特区 7.9 万人，年轻的技术人员多，65 岁以上居民只占 6%，比例是全领地各区中最低的。西卢阿高速和尼尔萨瓦克高速都穿过区内；南岸的塔库昆纳尔岬上设有雾笛，暖流与冷空气在那里相遇，海面上常起浓雾。\n冬天冷风沿谷地吹到海面上，水面会冒起一层薄薄的白汽，本地人说峡湾「在呼气」。图利瓦克人说冷风「从山口进城，在数据中心里干活，从游泳馆里出来」，图拉苏瓦峡湾就是这条风的必经之路。峡湾边的水电站值班员有个习惯，每天清早先看一眼峡湾冒不冒白汽，再看仪表上的出力，他们说，峡湾呼气越重，数据中心就越省电。"
      en: "Tullasuvva Fjord is the fjord of Tullakkat District in Tullivaq City, about 55 km long and about 320 km² in area, the shortest of the territory's five named fjords. Its name joins the Tavrunaq tulli, \"cold\", and suvva, \"fjord\": \"cold fjord\", from the same root as the name of Tullivaq itself. Steep valley walls line both sides, and inland the fjord continues as the Suvvakiluk valley, down which cold wind blows to the sea from the Tullakatiq Pass, 502 m, the lowest named pass in the territory. The rivers on either side of the fjord are dammed for hydropower, and the power and the cold air have drawn a large number of data centres; Tullakkat District has 79,000 people, many of them young technicians, and residents aged 65 and over make up only 6%, the lowest share of any district in the territory. The Sillua and Nirsavaq expressways both cross the district, and Taqqukunnar Point on the south coast has a foghorn, where the warm current meets the cold air and thick fog often rises from the sea.\nIn winter, when the cold wind blows down the valley onto the water, a thin white vapour rises from the surface, and locals say the fjord is \"breathing out\". Tullivaq people say the cold wind \"comes into town through the pass, works in the data centres and leaves through the swimming pools\", and Tullasuvva Fjord is the road that wind must take. The duty staff at the hydropower stations by the fjord have a habit of looking first thing each morning to see whether the fjord is steaming before checking the output on their gauges; the harder the fjord breathes, they say, the less power the data centres need."
  - id: nat_sn5pj0
    subtype: fjord
    status: generated
    detect: { kind: fjord, at_km: [398.2, 114.8] }
    names: { zh: 伊图苏瓦峡湾, en: Ittusuvva Fjord, art-x-tavrunaq: Ittusuvva }
    notes:
      zh: "伊图苏瓦峡湾是考尔尼克市伊卢克萨特区南岸的峡湾，长约 63 公里，面积约 300 平方公里，是领地第二长的峡湾，仅次于首府的努卡塔克峡湾。峡湾深而窄，两岸的山壁几乎直落水面，少有可以靠岸的平地，因此两岸少有人烟。伊卢克萨特区从内陆的伊卢考湖一直延伸到这里，区内有从盐湖卤水中提锂的伊卢克萨特提锂厂、海拔 1887 米的温纳皮鲁克峰和温纳西尔米冰川，8.3 万居民大多住在内陆，峡湾一带反倒成了全区最清静的角落。峡湾口外的南岸上有库利昆纳尔岬，岬上的灯塔为驶向首府伊马萨尔维克港和乌库努卡港的船只指引航道。西卢阿高速、乌库利特高速和考伊公路都经过伊卢克萨特区，但都远离峡湾深处。峡湾里的水冷而清，夏天常有海豹从湾口游进来追鱼。\n峡湾两岸几乎没有人家，只有夏天偶尔驶进来的皮划艇，划船的人说在这里说话会听到好几遍回声。有人试过在峡湾中段喊自己的名字，数到第五遍回声才渐渐听不见，于是划船人之间流传着一个玩笑：在伊图苏瓦峡湾吵架最划算，一句话能吵五遍。夜里在岸边扎营的人，常常整夜只听见冰川融水落进峡湾的声音，第二天早上醒来，才发现自己说话都不自觉地放轻了。"
      en: "Ittusuvva Fjord is the fjord on the south coast of Illuqsaat District in Qaurniq City, about 63 km long and about 300 km² in area, the second longest fjord in the territory after the capital's Nuqattaaq Fjord. It is deep and narrow, its walls dropping almost sheer into the water with little flat ground to land on, so its shores are almost uninhabited. Illuqsaat District stretches all the way here from Illuqqau Lake inland; it has the Illuqsaat Brine Works, which extracts lithium from the salt lake's brine, Mount Unnapirruk, 1,887 m, and the Unnasirmi Glacier, and most of its 83,000 people live inland, which leaves the fjord the quietest corner of the district. Outside the fjord mouth on the south coast lies Qullikunnar Point, whose lighthouse guides ships bound for the capital's Immasaarvik Harbour and for Ukkunuqa. The Sillua Expressway, the Ukkuliit Expressway and the Qaulujjuaq–Illuqsaat Road all pass through Illuqsaat District, but all keep well away from the inner fjord. The fjord's water is cold and clear, and in summer seals often swim in from the mouth after fish.\nThere are hardly any homes along its shores, only the occasional kayak that paddles in during summer, and paddlers say that anything you say here comes back in several echoes. Someone once tried shouting their own name in the middle of the fjord and counted five echoes before it died away, so a joke goes round among paddlers that Ittusuvva is the best place to have a row, since every word gets said five times. People camping on the shore often hear nothing all night but glacier meltwater falling into the fjord, and wake next morning to find they are unconsciously speaking more quietly."

