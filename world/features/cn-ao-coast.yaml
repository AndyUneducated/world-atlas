      en: "A cape on the west coast of the Pullapukkat Nature Reserve, north of Tullijaalivik District, where in winter the snow drifts right down to the sea, hence the name. When the snow melts in spring, meltwater hangs in little falls down the headland's cliffs, glittering in the sun."
  - id: nat_t51rsa
