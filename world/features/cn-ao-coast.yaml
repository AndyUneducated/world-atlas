      en: "An archipelago in the sea south-east of Ukkulaaq City, made up of Lightcurtain, Longnight and Greenlight islands, about 14,700 km² in all, forming the Qavvaluviit District and known for aurora tourism. The name is Tavrunaq for \"the aurora islands\", and on winter nights boats cruise the straits while passengers lie wrapped in blankets on deck watching the lights overhead."
  - id: nat_mhtezd
