      en: "The southernmost of the Ulikuviit Islands, about 1,100 km², rising to over 500 m; the lighthouse at its southern tip guides ships bound for the capital. The lighthouse keeper grows potatoes in a little garden at its foot, \"the vegetable plot nearest the sea in the whole capital area\", and at harvest gives a bag to passing fishing boats."

  # ── 通纳库维特群岛 ────────────────────────────────────────
