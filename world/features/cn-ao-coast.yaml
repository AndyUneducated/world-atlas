      en: "A bay west of Tullijaalivik District, about 830 km², the smallest of the territory's named bays. Its mouth faces the Tukkaruviit Islands, and in winter cold winds blow down from the plateau across it, which gave the bay and the district their names. The tulli in the names of town and bay is Tavrunaq for \"cold\", and locals say this cold wind is Tullivaq's most valuable resource, cooling the data centres' servers."
