      en: "The westernmost of the Ulikuviit Islands, about 1,500 km², with wide kelp forests in its shallows; plants on the island process the seaweed into food and feed. At low tide the fronds of the kelp forest float to the surface like a golden-brown prairie in the sun, and sea otters lie on their backs among them cracking shells."
  - id: nat_ptewc9
