      en: "An archipelago in the north-east of the territory, made up of Icefang, Iceberg and Drift Ice islands, about 31,900 km² in all, the largest archipelago in the territory. It is almost uninhabited and forms the Sirmiuviit Islands Ice Cap Administration Zone of Sirmivak City. The islands hold nothing but glaciers, ice cliffs and bergs; the occasional research team flies in, and they say it is so quiet \"you can hear your own heartbeat\"."
  - id: nat_75d2jp
