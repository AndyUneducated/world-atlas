      en: "An archipelago off the western south coast, made up of Tuunnaq and Mirnik islands and Nipaqtuuq Isle, about 7,000 km² in all, named after the hexagonal basalt columns of its coasts; all of it is a nature reserve. Only one sightseeing route is open, the boats passing slowly round the columns while the skipper cuts the engine so passengers can hear the waves echoing among the pillars."
  - id: nat_gph7ym
