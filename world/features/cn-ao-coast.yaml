    islands: [nat_p61nkb, nat_qpjgxz, nat_ptewc9, nat_9f9td0]
    names: { zh: 乌利库维特群岛, en: Ulikuviit Islands, art-x-tavrunaq: Ulikuviit }
    notes:
      zh: "乌利库维特群岛是首府西南海上的群岛，由乌利卡尔维克岛、库卡利克岛、萨里马岛和西卢阿库利岛组成，总面积约 7300 平方公里，构成萨尔瓦克市的乌利库维特区，常住 7.7 万人。群岛名里的 ulik 在塔夫鲁纳克语中意为鱼。暖流使这里的海水较暖，岛间海湾水深浪静，以深海网箱养殖为业：群岛南部的萨尔卡拉湾面积约 1500 平方公里，湾里的海水比外海暖几度，布满养殖鲑鱼和北极红点鲑的网箱，岸上是孵化场和加工厂，养殖、渔业和水产加工占经济的大半。主岛萨里马岛住着全区大多数人；乌利卡尔维克岛周围排满网箱，最西的库卡利克岛有大片海藻林和海藻加工厂，最南的西卢阿库利岛是群岛最高的岛，岛南端的灯塔为驶向首府的船只指引航道。群岛上没有高速公路，与大陆之间靠船只往来。\n萨尔瓦克人管这片群岛叫「海上牧场」，养殖工人每天坐船去喂鱼，像牧民去放牧一样。每批鱼苗出海放进网箱时，孵化场的老工人会在船头敲三下皮鼓，祝它们在冷水里长得又肥又结实。到了冬天收鱼的季节，各岛的码头连夜灯火通明，冷藏船一艘接一艘地开往萨尔努卡渔港，第二天清晨的鱼市上，最抢手的就是群岛来的整条养殖鲑鱼。"
      en: "The Ulikuviit Islands are an archipelago in the sea south-west of the capital, made up of Ulikkarvik, Kuuqalik, Saarimma and Silluaqulli islands, about 7,300 km² in all; they form the Ulikuviit District of Saarvaq City, with 77,000 residents. The ulik in the name is the Tavrunaq for \"fish\". A warm current keeps the water mild, and the deep, calm bays between the islands are given over to deep-sea cage farming: Saarqalla Bay in the south of the archipelago, about 1,500 km², is a few degrees warmer than the open sea and filled with cages of salmon and Arctic char, with hatcheries and processing plants on shore, and fish farming, fishing and seafood processing make up most of the economy. Most of the district's people live on the main island, Saarimma; Ulikkarvik is ringed with cages, Kuuqalik in the far west has great kelp forests and a kelp-processing plant, and Silluaqulli, the southernmost, is the highest island of the group, with a lighthouse at its southern tip guiding ships bound for the capital. There are no expressways on the islands, which are linked to the mainland by boat.\nSaarvaq people call these islands \"the pastures of the sea\", and the farm workers go out to feed the fish by boat every day like herders going out to their flocks. Whenever a batch of fry goes out to the cages, the old hatchery hands beat a skin drum three times at the bow, wishing them a fat, strong growth in the cold water. In the winter harvest season the jetties on every island are lit all night, refrigerated ships leave one after another for Saarnuqa Fishing Harbour, and at the fish market the next morning the most sought-after catch is whole farmed salmon from the islands."
  - id: nat_t8xydj
    subtype: archipelago
    status: generated
    islands: [nat_mgz2yw, nat_ftskb5, nat_w4fpp3]
    names: { zh: 通纳库维特群岛, en: Tuunnaquviit Islands, art-x-tavrunaq: Tuunnaquviit }
    notes:
      zh: "通纳库维特群岛是南岸西部海上的群岛，由通纳克岛、米尔尼克岛和尼帕克图克岛组成，总面积约 7000 平方公里，因海岸上的六角形玄武岩柱得名，群岛名由 tuun（石头）加上表示群岛的后缀构成。全境划为萨尔瓦克市的通纳库特生态保护区，常住约 1800 人，多为巡护员和渔民。群岛是一片古老的玄武岩熔岩台地，熔岩冷却时裂成六角形的石柱，海浪又把台地边缘切成陡崖：主岛通纳克岛的海岸上成排的岩柱高出海面，是通纳库特玄武岩柱保护区的核心；东部的米尔尼克岛最高四百二十米，由深色玄武岩构成；西部的尼帕克图克岛岩柱间的空隙被海浪冲击，发出管风琴般的声音。崖壁上栖息着成千上万的海鸦和北极鸥。\n保护区只开放一条海上观光航线，游客只能乘船在保护距离外观看，游船绕着岩柱缓缓驶过，船长会关掉马达，让乘客听海浪在石柱间回响。塔夫鲁纳克人的传说里，这些石柱是海神为海鸦搭的石梯，所以崖下从不捕鸟，渔民至今下网时都离石柱远远的。从萨尔瓦克出发的游船夏天每天一班，船票常常提前很久就卖光了，船长们说，来过的人回去以后，记住的不是石头，而是关了马达那一刻的寂静和浪声。"
      en: "The Tuunnaquviit Islands are an archipelago in the sea off the western south coast, made up of Tuunnaq Island, Mirnik Island and Nipaqtuuq Isle, about 7,000 km² in all, named for the hexagonal basalt columns along their shores; the name joins tuun, \"stone\", to the suffix for an archipelago. The whole archipelago is the Tuunnaqut Nature Reserve of Saarvaq City, with about 1,800 residents, mostly rangers and fishermen. The islands are an ancient basalt lava tableland that cracked into hexagonal columns as it cooled, its edges then cut into cliffs by the sea: rows of columns rise from the sea along the shore of the main island, Tuunnaq, the heart of the Tuunnaqut Basalt Pillars Reserve; Mirnik Island in the east, the highest at 420 m, is made of dark basalt; and on Nipaqtuuq Isle in the west the waves striking the gaps between the columns make a sound like a pipe organ. Thousands upon thousands of guillemots and Arctic gulls nest on the cliffs.\nThe reserve opens only one sightseeing sea route, and visitors may only watch from boats beyond the protection limit; the boats pass slowly round the columns and the captain cuts the engine so passengers can hear the waves echoing among the stones. In Tavrunaq legend the columns are a stairway the sea god built for the guillemots, so no one ever takes birds beneath the cliffs, and fishermen still set their nets well away from them. In summer the tour boat sails once a day from Saarvaq, and tickets often sell out long in advance; the captains say that what visitors remember afterwards is not the stones but the silence and the sound of the waves the moment the engine stops."
  - id: nat_gph7ym
    subtype: archipelago
    status: generated
    islands: [nat_3njsdv, nat_x904y1, nat_estcp4]
    names: { zh: 图卡鲁维特群岛, en: Tukkaruviit Islands, art-x-tavrunaq: Tukkaruviit }
    notes:
      zh: "图卡鲁维特群岛是图利瓦克市西面海上的群岛，由图卡尔尤阿克岛、阿利克塔克岛和帕利塔库岛组成，总面积约 6900 平方公里，是领地命名群岛中面积最小的，构成图利瓦克市的图卡鲁维特区，常住 4.9 万人。图利瓦克的冷空气和图拉卡特区的水电让这一带成为领地的数据中心与算力基地：主岛图卡尔尤阿克岛上有群岛最大的图卡尔尤阿克数据中心和为人工智能训练出租算力的北极光算力中心，用极地冷空气和海水冷却，余热为岛上的住宅供暖；东部的阿利克塔克岛是海底光缆的登陆地，光缆沿阿利克塔克岛与帕利塔库岛之间的阿利克马苏克海峡铺设，这道海峡宽约 11 公里，是领地最宽的命名海峡；西部的帕利塔库岛夏天常被海雾笼罩。北面远海上陶武维特群岛的地面站接收卫星数据，也转发到这里。\n群岛上的工程师来自世界各地，图卡尔尤阿克岛上的一条小街就能吃到好几个国家的菜，食堂按全球时区开饭，深夜两点的餐厅里也坐满了人。岛上人说话中文、英文和塔夫鲁纳克语夹着说，再掺几句机房里的行话；本地老人起初听不懂，后来也学会了一句「服务器热了」，意思是天要转暖。"
      en: "The Tukkaruviit Islands are an archipelago in the sea west of Tullivaq City, made up of Tukkarjuaq Island, Aliqtaq Isle and Paalitaqqu Isle, about 6,900 km² in all, the smallest of the territory's named archipelagos; they form the Tukkaruviit District of Tullivaq City, with 49,000 residents. Tullivaq's cold air and the hydropower of Tullakkat District have made this the territory's base for data centres and computing: the main island, Tukkarjuaq, holds the largest data centre in the islands, the Tukkarjuaq Data Centre, and the Northern Lights Compute Centre, which rents out computing power for training artificial intelligence, both cooled by polar air and seawater, their waste heat warming the island's homes; Aliqtaq Isle in the east is where the submarine cables come ashore, laid along the Aliqmasuq Strait between Aliqtaq and Paalitaqqu, which at about 11 km is the widest named strait in the territory; and Paalitaqqu Isle in the west is often shrouded in sea fog in summer. The satellite data received by the ground station on the Tauvvuviit Islands, far out to sea to the north, is relayed here too.\nThe islands' engineers come from all over the world, a single little street on Tukkarjuaq serves the food of several countries, and with canteens serving meals by the world's time zones the restaurants are full even at two in the morning. Islanders talk in a mix of Chinese, English and Tavrunaq with a sprinkling of machine-room jargon; the local elders could not follow it at first, but they have since picked up the phrase \"the servers are warming up\", meaning the weather is about to turn mild."

