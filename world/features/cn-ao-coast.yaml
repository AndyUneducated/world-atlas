      en: "A bay among the Ukkuuviit Islands, about 1,300 km², mostly in the Ukkuuviit Mining Administration Zone with its northern shore in Uviqnuqa District, used by ships calling at the harbour. The bay is sheltered, and supply ships wait here for their turn to enter port; when islanders see a ship in the bay, they know fresh fruit and milk are on the way."
  - id: nat_7s3g87
