    notes:
      zh: "图卡鲁维特群岛中阿利克塔克岛与帕利塔库岛之间的海峡，宽约 11 公里，是领地最宽的命名海峡，连接图卡鲁维特群岛的海底光缆沿海峡底部铺设，海峡由此得名。光缆维修船偶尔会在海峡里停泊几天，潜水员下到海底检修光缆，岛上的人管它叫「给世界接线的船」。"
      en: "The strait between Aliqtaq Isle and Paalitaqqu Isle in the Tukkaruviit Islands, about 11 km wide, the widest named strait in the territory; the submarine cables to the Tukkaruviit Islands run along its floor, hence the name. A cable-repair ship sometimes anchors in the strait for a few days while divers go down to inspect the cables, and islanders call it \"the ship that wires up the world\"."
