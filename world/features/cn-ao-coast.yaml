      en: "An archipelago in the sea south-west of the capital, made up of Netpen, Seaweed, Warmtide and South Light islands, about 7,300 km² in all, forming the Ulikuviit District of Saarvaq City. The warm current keeps the water mild, and the bays between the islands are given over to deep-water fish farming. When each batch of fry goes out to the pens, the old hands from the hatchery beat a skin drum three times at the bow, wishing the fish a fat, strong life in the cold water."
  - id: nat_t8xydj
