      en: "A bay on the north-eastern edge of the Sirmi Ice Cap, about 1,300 km², where tongues of the ice cap reach into the water, with Sirmiqarvik District and the Sirmiuviit Islands on either side. Icebergs calved from the tongues drift out through its mouth. The waves raised when the ice tongue calves reach the far shore, and the old guides of Sirmiqarvik can read the age of the ice from its colour: the bluer, the older and denser."
  - id: nat_ek0rtm
