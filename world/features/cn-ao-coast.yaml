      en: "The main island of the Tuunnaquviit Islands, about 3,400 km²; the rows of hexagonal basalt columns on its coast are the heart of the reserve, and guillemots and Arctic gulls nest on the cliffs. In Tavrunaq legend the columns are a stair the sea spirit built for the guillemots, so birds are never taken below the cliffs; in summer thousands of seabirds sit on every \"step\", their calls louder than the surf."
  - id: nat_ftskb5
