      en: "The cape of Qavvaluviit District on the mainland, looking south across the sea to the Qavvaluviit Islands; on winter nights the aurora can be seen rising over the islands from here, hence the name. On winter nights people wait on the headland with cameras for the aurora, and locals say that here \"you watch it walk slowly towards you from the islands across the sea\"."

  # ── Straits ─────────────────────────────────────────────
