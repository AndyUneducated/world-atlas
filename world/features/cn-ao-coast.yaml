    notes:
      zh: 乌库乌维特群岛西部的低平小岛，面积约 1100 平方公里，最高处海拔一百多米。岛上的岩石含磁铁矿，罗盘在这里会偏转，岛名由此而来。
      en: A low, small island in the west of the Ukkuuviit Islands, about 1,100 km², rising to a little over 100 m. Its rocks contain magnetite that turns compass needles, hence the name.
  - id: nat_wrjnnn
    subtype: island
    status: generated
    detect: { kind: island, at_km: [660, 203] }
    names: { zh: 阿考库岛, en: Aqqaukku Island, art-x-tavrunaq: Aqqaukku }
    notes:
      zh: 乌库乌维特群岛最北的岛屿，面积约 670 平方公里，最高处海拔近五百米，是矿区勘探中的岛屿。
      en: The northernmost of the Ukkuuviit Islands, about 670 km², rising to nearly 500 m, and under exploration by the mining zone.

  # ── 卡瓦卢维特群岛 ────────────────────────────────────────────
  - id: nat_vv2c47
    subtype: island
    status: generated
    detect: { kind: island, at_km: [523, 42] }
    names: { zh: 卡瓦卢格尤阿克岛, en: Qavvalugjuaq Island, art-x-tavrunaq: Qavvalugjuaq }
    notes:
      zh: 卡瓦卢维特群岛的主岛，面积约 1.12 万平方公里，是领地第二大岛。岛上地势低平、远离城市灯光，冬季夜空开阔，卡瓦卢维特观光度假村的玻璃屋顶客房就散布在岛上。
      en: The main island of the Qavvaluviit Islands, about 11,200 km², the second largest island in the territory. It is low and flat, far from city lights and open to the winter sky, and the glass-roofed rooms of the Qavvaluviit Islands Resort are scattered across it.
  - id: nat_95v2tq
    subtype: island
    status: generated
    detect: { kind: island, at_km: [574, 51] }
    names: { zh: 温纳塔克岛, en: Unnataq Island, art-x-tavrunaq: Unnataq }
    notes:
      zh: 卡瓦卢维特群岛东部的岛屿，面积约 3000 平方公里，最高处海拔四百多米。冬季极夜漫长，岛名由此而来，岛上有观赏极光的小屋和步道。
      en: An island in the east of the Qavvaluviit Islands, about 3,000 km², rising to over 400 m. It is named for the long polar night, and has huts and trails for watching the aurora.
  - id: nat_y023md
    subtype: island
    status: generated
    detect: { kind: island, at_km: [546, 60] }
    names: { zh: 库拉克岛, en: Qurrak Isle, art-x-tavrunaq: Qurrak }
    notes:
      zh: 卡瓦卢维特群岛的小岛，面积约 470 平方公里，在卡瓦卢格尤阿克岛与温纳塔克岛之间。岛名来自极光常见的绿色光带。
      en: A small island in the Qavvaluviit Islands, about 470 km², between Lightcurtain and Longnight islands. It is named after the green bands that are the aurora's commonest colour.

  # ── 乌利库维特群岛 ────────────────────────────────────────────
  - id: nat_p61nkb
    subtype: island
    status: generated
    detect: { kind: island, at_km: [241, 50] }
    names: { zh: 乌利卡尔维克岛, en: Ulikkarvik Island, art-x-tavrunaq: Ulikkarvik }
    notes:
      zh: 乌利库维特群岛西部的岛屿，面积约 1700 平方公里。周围的海湾里排列着深海养殖网箱，岛名由此而来。
      en: An island in the west of the Ulikuviit Islands, about 1,700 km². The bays around it are lined with deep-water fish pens, hence the name.
  - id: nat_qpjgxz
    subtype: island
    status: generated
    detect: { kind: island, at_km: [211, 57] }
    names: { zh: 库卡利克岛, en: Kuuqalik Island, art-x-tavrunaq: Kuuqalik }
    notes:
      zh: 乌利库维特群岛最西的岛屿，面积约 1500 平方公里，沿岸浅水里生长着大片海藻林，岛上的工厂把海藻加工成食品和饲料。
      en: The westernmost of the Ulikuviit Islands, about 1,500 km², with wide kelp forests in its shallows; plants on the island process the seaweed into food and feed.
  - id: nat_ptewc9
    subtype: island
    status: generated
    detect: { kind: island, at_km: [292, 72] }
    names: { zh: 萨里马岛, en: Saarimma Island, art-x-tavrunaq: Saarimma }
    notes:
      zh: 乌利库维特群岛的主岛，面积约 2900 平方公里，离首府只有一百多公里。暖流经过岛的周围，海水比别处温暖，乌利库维特区的居民大多住在这里。
      en: The main island of the Ulikuviit Islands, about 2,900 km², only a little over 100 km from the capital. The warm current flows round it and its waters are warmer than elsewhere, and most of the district's people live here.
  - id: nat_9f9td0
    subtype: island
    status: generated
    detect: { kind: island, at_km: [301, 42] }
    names: { zh: 西卢阿库利岛, en: Silluaqulli Isle, art-x-tavrunaq: Silluaqulli }
    notes:
      zh: 乌利库维特群岛最南的岛屿，面积约 1100 平方公里，最高处海拔五百多米，岛南端的灯塔为驶向首府的船只指引航道。
      en: The southernmost of the Ulikuviit Islands, about 1,100 km², rising to over 500 m; the lighthouse at its southern tip guides ships bound for the capital.

  # ── 通纳库维特群岛 ────────────────────────────────────────
  - id: nat_mgz2yw
    subtype: island
    status: generated
    detect: { kind: island, at_km: [94, 85] }
