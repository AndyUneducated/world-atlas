      en: "An island in the west of the Ulikuviit Islands, about 1,700 km². The bays around it are lined with deep-water fish pens, hence the name. Fish-farm workers go out by boat every day to feed the fish as herders go out to their flocks, which is why Saarvaq people call this sea \"the sea pastures\"."
