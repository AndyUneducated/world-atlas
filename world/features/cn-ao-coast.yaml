      en: "The main island of the Tukkaruviit Islands, about 3,900 km², named after the Coldvault Data Centre on it, which cools its servers with polar air and seawater and heats the island's homes with the waste heat. The island's pool and greenhouses are heated by the data centre's waste heat, and locals joke that they \"swim in the servers' bathwater\"."
