# Coastal landforms of the Arctic Ocean Territory: islands and their archipelagos, bays, fjords, capes
# and straits. The generator finds them in the coastline (pipeline/atlas/coast.py); each entry names the
# landform of `detect.kind` nearest to `detect.at_km` (design km, x east, y north). An archipelago is
# the named islands it lists. Unnamed landforms are listed in .cache/candidates-div_hpmerr.json after a build.
features:
  # ── 陶武维特群岛 ────────────────────────────────────────────
  - id: nat_dppqz7
    subtype: island
    status: generated
    detect: { kind: island, at_km: [55, 317] }
    names: { zh: 陶瓦克岛, en: Tauvvaq Island, art-x-tavrunaq: Tauvvaq }
    notes:
      zh: 陶武维特群岛的主岛，面积约 7400 平方公里，地势低缓，最高处海拔两百多米。岛上空旷开阔、少有遮挡，陶武维特地面站的天线阵就建在这里，极轨卫星每一圈经过时都能被跟踪接收。
      en: The main island of the Tauvvuviit Islands, about 7,400 km², low and gentle, rising to a little over 200 m. Its open, unobstructed ground is home to the antenna arrays of the Tauvvuviit Ground Station, which track polar-orbiting satellites on every pass.
  - id: nat_rhderc
    subtype: island
    status: generated
    detect: { kind: island, at_km: [100, 326] }
    names: { zh: 萨卡利特岛, en: Saqqaliit Isle, art-x-tavrunaq: Saqqaliit }
    notes:
      zh: 陶武维特群岛的小岛，面积约 340 平方公里，是领地最小的命名岛屿，最高处海拔约一百米。岛名来自岛上为地面站接力的天线。
      en: A small island in the Tauvvuviit Islands, about 340 km², the smallest named island in the territory, rising to about 100 m. It is named after the relay antennas that serve the ground station.

  # ── 皮图库维特群岛 ────────────────────────────────────────────
  - id: nat_b1fv64
    subtype: island
    status: generated
    detect: { kind: island, at_km: [184, 279] }
    names: { zh: 皮图克尤阿克岛, en: Pitukjuaq Island, art-x-tavrunaq: Pitukjuaq }
    notes:
      zh: 皮图库维特群岛的主岛，面积约 1.04 万平方公里，是领地第三大岛，属塔夫鲁利特原住民自治区。岛上地势起伏不大，海岸是传统的海豹与海象猎场，海边岩石上留有刻着鲸、海豹和皮划艇的岩雕。
      en: The main island of the Pitukuviit Islands, about 10,400 km², the third largest island in the territory, in the Tavrulit Indigenous Autonomous Region. Its ground is gently rolling, its coasts are traditional seal and walrus hunting grounds, and rocks by the shore carry carvings of whales, seals and kayaks.
  - id: nat_dstxyg
    subtype: island
    status: generated
    detect: { kind: island, at_km: [205, 263] }
    names: { zh: 瑙卡克岛, en: Naukkaq Island, art-x-tavrunaq: Naukkaq }
    notes:
      zh: 皮图库维特群岛的第二大岛，面积约 1100 平方公里，在皮图克尤阿克岛东南，地势低平。岛名来自塔夫鲁利特猎人用来猎海豹的鱼叉。
      en: The second island of the Pitukuviit Islands, about 1,100 km², south-east of Pitukjuaq Island and low-lying. It is named after the harpoon Tavrulit hunters use for seals.

  # ── 纳卢维特群岛 ────────────────────────────────────────────
  - id: nat_5hdtr2
    subtype: island
    status: generated
    detect: { kind: island, at_km: [323, 311] }
    names: { zh: 纳卢尤阿克岛, en: Naallujuaq Island, art-x-tavrunaq: Naallujuaq }
    notes:
      zh: 纳卢维特群岛的主岛，面积约 7000 平方公里，最高处海拔五百多米。北冰洋极地研究所设在岛上，研究海冰、冻土与北极生态，每年夏季从这里派出科考船。
      en: The main island of the Naalluviit Islands, about 7,000 km², rising to over 500 m. The Arctic Ocean Polar Research Institute stands here, studying sea ice, permafrost and Arctic ecology, and sends out its research ships every summer.
  - id: nat_r5e7sa
    subtype: island
    status: generated
    detect: { kind: island, at_km: [357, 324] }
    names: { zh: 普塔克岛, en: Puttaq Isle, art-x-tavrunaq: Puttaq }
    notes:
      zh: 纳卢维特群岛东部的小岛，面积约 880 平方公里，最高处海拔四百多米。研究所在周围海域布放的海洋浮标由这里维护，岛名由此而来。
      en: A small island in the east of the Naalluviit Islands, about 880 km², rising to over 400 m. The institute's ocean buoys in the surrounding waters are serviced from here, hence the name.
  - id: nat_2vhfdf
    subtype: island
    status: generated
    detect: { kind: island, at_km: [278, 347] }
    names: { zh: 阿卡尼尔维克岛, en: Aqqanirvik Isle, art-x-tavrunaq: Aqqanirvik }
    notes:
      zh: 纳卢维特群岛最北的小岛，面积约 590 平方公里，向北面对封冻的北冰洋，岛上设有观测海冰的站点。
      en: The northernmost of the Naalluviit Islands, about 590 km², facing the frozen Arctic Ocean to the north, with a station that watches the sea ice.

  # ── 西尔米乌维特群岛 ────────────────────────────────────────────
  - id: nat_99nd2b
    subtype: island
    status: generated
    detect: { kind: island, at_km: [452, 313] }
    names: { zh: 基库维克岛, en: Kiiquviq Island, art-x-tavrunaq: Kiiquviq }
    notes:
      zh: 西尔米乌维特群岛的主岛，面积约 2.87 万平方公里，是领地最大的岛屿，也是地势最高的岛：西尔米基克山纵贯全岛，主峰基克皮鲁克峰海拔 2236 米，山顶覆盖着基克西尔米冰帽。岛上没有常住居民，属西尔米乌维特冰盖管理区。
      en: The main island of the Sirmiuviit Islands, about 28,700 km², the largest island in the territory and also the highest; the Sirmikiiq Mountains run its length, their summit Mount Kiiqpirruk reaching 2,236 m under the Kiiqsirmi Ice Cap. No one lives here permanently; it belongs to the Sirmiuviit Islands Ice Cap Administration Zone.
  - id: nat_b3kk8p
    subtype: island
    status: generated
    detect: { kind: island, at_km: [520, 301] }
    names: { zh: 基库利克岛, en: Kiqqulik Island, art-x-tavrunaq: Kiqqulik }
    notes:
      zh: 西尔米乌维特群岛的第二大岛，面积约 2200 平方公里，在基库维克岛以东。基库维克岛冰川入海崩落的冰山常在附近漂过，岛名由此而来。
      en: The second island of the Sirmiuviit Islands, about 2,200 km², east of Kiiquviq Island. Icebergs calved from Kiiquviq Island's glaciers often drift past, hence the name.
  - id: nat_tfkcz1
    subtype: island
    status: generated
    detect: { kind: island, at_km: [570, 318] }
    names: { zh: 西尔米奥拉岛, en: Sirmiaulla Island, art-x-tavrunaq: Sirmiaulla }
    notes:
      zh: 西尔米乌维特群岛东端的小岛，面积约 980 平方公里，周围海面常年漂着浮冰，岛名由此而来。
      en: A small island at the eastern end of the Sirmiuviit Islands, about 980 km², surrounded by drifting ice for much of the year, hence the name.

  # ── 乌瓦卡鲁库维特群岛 ──────────────────────────────────────────
  - id: nat_zrtk04
    subtype: island
    status: generated
    detect: { kind: island, at_km: [604, 290] }
    names: { zh: 乌瓦克岛, en: "Uvvaak Island", art-x-tavrunaq: Uvvaakuviq }
    notes:
      zh: 乌瓦卡鲁库维特群岛的主岛，面积约 9400 平方公里，「乌瓦克」在塔夫鲁纳克语中意为海象。岛的海滩是海象的聚居地，保护区的巡护站监测海象栖息地和北极熊的迁移，全岛禁止开发。
      en: The main island of the Uvvaakkaruquviit Islands, about 9,400 km²; uvvaak is the Tavrunaq word for walrus. Its beaches are walrus haul-outs, the reserve's ranger station monitors the walrus grounds and the movements of polar bears, and the whole island is closed to development.
  - id: nat_6xq372
    subtype: island
    status: generated
    detect: { kind: island, at_km: [640, 263] }
    names: { zh: 卡鲁克岛, en: "Karuq Island", art-x-tavrunaq: Karuquviq }
    notes:
      zh: 乌瓦卡鲁库维特群岛的第二大岛，面积约 5500 平方公里，「卡鲁克」在塔夫鲁纳克语中意为熊。冬季北极熊沿海冰来到岛上，在积雪中筑窝产仔。
      en: The second island of the Uvvaakkaruquviit Islands, about 5,500 km²; karuq is the Tavrunaq word for bear. In winter polar bears come over the sea ice and dig dens in the snow to give birth.
  - id: nat_6fra25
    subtype: island
    status: generated
    detect: { kind: island, at_km: [631, 317] }
    names: { zh: 图拉利克岛, en: Turralik Island, art-x-tavrunaq: Turralik }
    notes:
      zh: 乌瓦卡鲁库维特群岛的低平岛屿，面积约 4600 平方公里，最高处海拔只有一百多米，海岸是陡立的冰崖，岛名由此而来。
      en: A low, flat island in the Uvvaakkaruquviit Islands, about 4,600 km², rising only to a little over 100 m, its coast walled by sheer ice cliffs, hence the name.
  - id: nat_wbttjv
    subtype: island
    status: generated
    detect: { kind: island, at_km: [656, 296] }
    names: { zh: 普塔西尔米岛, en: Puttasirmi Island, art-x-tavrunaq: Puttasirmi }
    notes:
      zh: 乌瓦卡鲁库维特群岛东端的岛屿，面积约 1700 平方公里，冬春之际周围的海面布满浮冰，是海象和北极熊出没的地带。
      en: The island at the eastern end of the Uvvaakkaruquviit Islands, about 1,700 km²; in late winter and spring the sea around it fills with floes, the haunt of walruses and polar bears.

  # ── 乌库乌维特群岛 ────────────────────────────────────────────
  - id: nat_6y7y3n
    subtype: island
    status: generated
    detect: { kind: island, at_km: [644, 174] }
    names: { zh: 乌维克萨克岛, en: "Uviqsaaq Island", art-x-tavrunaq: Uviqsaaq }
    notes:
      zh: 乌库乌维特群岛的主岛，面积约 6600 平方公里，最高处海拔 783 米，是领地仅次于基库维克岛的高岛。乌维克萨克市的乌维克努卡港和机场在岛的一侧，其余大部分属乌库乌维特矿区管理区。
      en: The main island of the Ukkuuviit Islands, about 6,600 km², rising to 783 m, the highest island in the territory after Kiiquviq Island. Uviqsaaq City's harbour and airport are on one side of it, and most of the rest belongs to the Ukkuuviit Mining Administration Zone.
  - id: nat_ps1ygb
    subtype: island
    status: generated
    detect: { kind: island, at_km: [654, 145] }
    names: { zh: 西卢奥库岛, en: Silluaukku Island, art-x-tavrunaq: Silluaukku }
    notes:
      zh: 乌库乌维特群岛南部的岛屿，面积约 2700 平方公里，地势低缓，乌库乌维特露天矿就在岛上，精矿运往乌维克努卡港装船。
      en: An island in the south of the Ukkuuviit Islands, about 2,700 km² and gently rolling; the Ukkuuviit Islands Open-Pit Mine is here, and its concentrate goes to the harbour for shipping.
  - id: nat_0mnzj7
    subtype: island
