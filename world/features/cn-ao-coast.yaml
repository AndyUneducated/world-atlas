      en: "The main island of the Ulikuviit Islands, about 2,900 km², only a little over 100 km from the capital. The warm current flows round it and its waters are warmer than elsewhere, and most of the district's people live here. At the end of the day the boats come home in line, and families on the quay can pick out their own boat's light from far off."
  - id: nat_9f9td0
