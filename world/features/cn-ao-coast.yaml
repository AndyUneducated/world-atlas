      en: "An island in the east of the Tuunnaquviit Islands, about 2,800 km², rising to over 400 m and built of dark basalt, hence the name. After rain the basalt turns black and gleaming, and the whole island looks like an inkstone soaked in water, recognisable far out at sea."
  - id: nat_w4fpp3
