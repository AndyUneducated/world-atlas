      en: "The easternmost archipelago of the territory, made up of Uviqsaaq, South Ore, Lodestone and North Ore islands, about 11,100 km² in all, which together form Uviqsaaq City. The islands produce rare earths, shipped out as concentrate from the harbour. There is no road to the mainland, and locals say \"our expressways are the air routes and the sea lanes\"; supply-ship days are like holidays on the islands."
  - id: nat_vpay49
