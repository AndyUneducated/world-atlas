    names: { zh: 基蒂利克岛, en: Qittilik Island, art-x-tavrunaq: Qittilik }
    notes:
      zh: "基蒂利克岛是乌库乌维特群岛西部的低平小岛，面积约 1100 平方公里，最高处海拔一百多米，平均不到七十米，属乌维克萨克市的乌库乌维特矿区管理区。岛上是一片低缓的岩盘台地，地表裸露着深色的岩石，苔原只在背风的洼地里长得厚些，海岸平直，少有能避风的港湾。岛上的岩石含磁铁矿，罗盘在这里会偏转，岛名由此而来。乌库乌维特群岛以稀土矿闻名，矿区管理区的地质队也常来这座岛上测量磁异常，在岩盘上留下一个个刷着红漆的测点；岛上没有村落，夏天只有地质队、学生考察队和偶尔上岛的渔民，岛上唯一的房子是老向导的一间木屋。冬天这一带风暴多，船只常常要在乌库卡拉湾里等上几天才能靠岸。\n来岛上考察的学生第一件事就是掏出罗盘看指针乱转，有人还会把罗盘放在不同的石头上，看指针在哪块石头上转得最欢。岛上的老向导干脆只靠太阳和海岸线认路，到了阴天和极夜，就靠记在脑子里的每一道岩脊。向导常对学生说：「在基蒂利克岛，罗盘会撒谎，石头不会。」考察结束时，学生们会在向导的小屋里留下一枚旧罗盘，墙上的钉子上已经挂了满满一排，指针各指一方。"
      en: "Qittilik Island is a low, small island in the west of the Ukkuuviit Islands, about 1,100 km², rising to a little over 100 m and averaging under 70 m, in the Ukkuuviit Mining Administration Zone of Uviqsaaq City. It is a low rock tableland of bare dark stone, with tundra growing thick only in sheltered hollows, and a straight coast with few harbours to shelter in. Its rocks contain magnetite that turns compass needles, hence the name. The Ukkuuviit Islands are known for their rare earths, and the mining zone's geologists often come to survey the island's magnetic anomalies, leaving survey points daubed with red paint on the bare rock; there is no village, and in summer the only visitors are geologists, student field parties and the occasional fisherman, and the only building on the island is the old guide's wooden hut. Storms are frequent here in winter, and boats often wait for days in Ukkuqalla Bay before they can land.\nThe first thing visiting students do is take out a compass to watch the needle wander, and some set compasses on different stones to see which makes the needle spin most. The old guides simply find their way by the sun and the shoreline, and on overcast days and in the polar night by every rock ridge they carry in their heads. \"On Qittilik the compass lies, but the stones don't,\" a guide will tell the students. At the end of a field trip the students leave an old compass in the guide's hut, and the nails on its wall now hold a full row of them, each needle pointing its own way."
  - id: nat_wrjnnn
    subtype: island
    status: generated
    detect: { kind: island, at_km: [660, 203] }
    names: { zh: 阿考库岛, en: Aqqaukku Island, art-x-tavrunaq: Aqqaukku }
    notes:
      zh: "阿考库岛是乌库乌维特群岛最北的岛屿，面积约 670 平方公里，属乌维克萨克市的乌库乌维特矿区管理区。岛虽小，地势却陡，最高处海拔近五百米，平均两百五十多米，四周多是海崖和陡坡，山脊上裸露着带锈色的岩层，只有南岸有一片能扎营的缓坡。乌库乌维特群岛以稀土矿闻名，西卢奥库岛上的露天矿已经开采多年，阿考库岛则是矿区还在勘探中的岛屿：地质队每年夏天上岛钻孔取芯、采集岩样，把一箱箱岩芯运回乌维克努卡化验，看这里的矿值不值得开采。岛上没有常住居民，冬天勘探队撤走后，只剩钻机的铁架和几根标桩立在雪里。勘探至今没有定论，岛上的人说，阿考库岛是群岛里「还没想好要不要当矿山」的那一座。\n勘探队夏天在岛上扎营，营地的帐篷排成一行，远看像一串彩色的纽扣钉在灰色的山坡上。帐篷的颜色各有用处，红的住人，黄的放岩芯，蓝的是厨房，新来的队员只要记住「蓝帐篷开饭」就不会饿着。营地的老队员说，阿考库岛的天气一天能换四个季节，早上晒太阳，中午下冰雹，傍晚又起雾，所以他们每次出门钻孔都带齐了全套衣服，背包比岩芯箱还沉。"
      en: "Aqqaukku Island is the northernmost of the Ukkuuviit Islands, about 670 km², in the Ukkuuviit Mining Administration Zone of Uviqsaaq City. Small as it is, it is steep, rising to nearly 500 m and averaging over 250 m, ringed mostly by sea cliffs and steep slopes, with rusty rock strata exposed along its ridges and only one gentle slope on the south shore fit for a camp. The Ukkuuviit Islands are known for their rare earths, and while the open pit on Silluaukku Island has been worked for years, Aqqaukku is still under exploration: every summer geologists come to drill cores and collect rock samples, shipping crate after crate of core back to Uviqnuqa for assay to see whether the ore here is worth mining. The island has no permanent residents, and once the exploration team leaves in winter only the iron frames of the drill rigs and a few marker posts stand in the snow. The exploration has yet to reach a verdict, and islanders say Aqqaukku is the one island in the group that \"hasn't made up its mind whether to be a mine\".\nIn summer the team camps on the island, its tents in a row that from afar look like a string of coloured buttons sewn onto the grey hillside. Each colour has its use: red for sleeping, yellow for core, blue for the kitchen, and a newcomer need only remember \"blue tent, mealtime\" to avoid going hungry. The old hands say Aqqaukku's weather can run through four seasons in a day, sun in the morning, hail at noon and fog by evening, so they take a full set of clothes every time they go out to drill, and their rucksacks weigh more than the core boxes."

  # ── 卡瓦卢维特群岛 ────────────────────────────────────────────
  - id: nat_vv2c47
    subtype: island
    status: generated
    detect: { kind: island, at_km: [523, 42] }
    names: { zh: 卡瓦卢格尤阿克岛, en: Qavvalugjuaq Island, art-x-tavrunaq: Qavvalugjuaq }
    notes:
      zh: "卡瓦卢格尤阿克岛是卡瓦卢维特群岛的主岛，在乌库拉克市东南的海上，面积约 1.12 万平方公里，是领地第四大岛，属乌库拉克市卡瓦卢维特区。岛名由 qavvaluk（极光）和表示「大」的后缀合成，意为「大极光岛」。岛上地势低平，平均海拔只有八十多米，最高处也不过一百八十米，大片是平坦的苔原、湖塘和砾石滩，没有高山遮挡视线，又远离城市灯光，冬季夜空开阔，是领地看极光最好的地方之一。岛的西北侧是面积约 900 平方公里的卡瓦卢卡拉湾，冬夜湾面平静时，极光倒映在海冰和水面上；卡瓦卢维特观光度假村的玻璃屋顶客房就散布在岛上。卡瓦卢维特区 8.4 万人，旅游和邮轮业占经济的大半，岛上的居民不少在度假村、游船和向导行业工作。\n度假村给每位客人一个「极光闹钟」，夜里极光一出现，前台就挨个打电话叫醒客人，有人一个冬天被叫醒十几次也毫无怨言。早餐桌上最受欢迎的是热浆果粥，配着讲昨夜极光的故事；没看到的客人只好听别人讲，再续住一晚。岛上的向导冬夜常带人坐在湾边的冰上，带一壶热浆果茶，说「极光要等，茶要趁热」。"
      en: "Qavvalugjuaq Island is the main island of the Qavvaluviit Islands, in the sea south-east of Ukkulaaq City. At about 11,200 km² it is the fourth largest island in the territory, and it belongs to the Qavvaluviit District of Ukkulaaq City. Its name joins qavvaluk, \"aurora\", to the suffix for \"great\": \"great aurora island\". The island is low and flat, averaging only a little over 80 m and rising to no more than 180 m, mostly level tundra, ponds and gravel beaches; with no mountains to block the view and far from city lights, its winter skies are wide open, and it is one of the best places in the territory to see the aurora. On its north-western side lies Qavvaluqalla Bay, about 900 km², where on still winter nights the aurora is mirrored in the sea ice and the water; the glass-roofed rooms of the Qavvaluviit Lodge are scattered across the island. Qavvaluviit District has 84,000 people, tourism and cruises make up more than half its economy, and many islanders work at the lodge, on the tour boats or as guides.\nThe lodge gives every guest an \"aurora alarm\": when the lights appear in the night, reception rings round and wakes the guests one by one, and some are woken a dozen times in a winter without a word of complaint. The favourite at breakfast is hot berry porridge, served with stories of last night's aurora; guests who missed it can only listen to the others and book one more night. On winter nights the island's guides often take visitors to sit on the ice by the bay with a flask of hot berry tea, saying \"the aurora won't be hurried, but the tea won't stay hot\"."
  - id: nat_95v2tq
    subtype: island
    status: generated
    detect: { kind: island, at_km: [574, 51] }
    names: { zh: 温纳塔克岛, en: Unnataq Island, art-x-tavrunaq: Unnataq }
    notes:
      zh: "温纳塔克岛是卡瓦卢维特群岛东部的岛屿，面积约 3000 平方公里，属乌库拉克市卡瓦卢维特区。岛上是起伏的丘陵，最高处海拔四百二十多米，是群岛地势最高的岛，平均一百五十米上下，西边隔着小小的库拉克岛与主岛卡瓦卢格尤阿克岛相对，岛与岛之间是宽约 3 公里的卡瓦卢马苏克海峡。冬季极夜漫长，岛名由此而来。岛上有观赏极光的小屋和步道，步道从海边的码头沿着山脊一路向上，每隔一段就有一座小屋，越往高处视野越开阔，晴夜里能看见极光从海峡上空一直铺到天边。观光度假村的游船冬季沿海峡夜航，常在温纳塔克岛的码头停靠，放下想上山过夜的客人。首府苏瓦利克区还有一条以它命名的大街，地铁 3 号线在那里设有温纳塔克岛大街站。\n步道沿途的小屋里备着柴火、热茶和毯子，看极光的人可以在屋里等，极光一出来就推门出去。小屋不上锁，墙上挂着一本本留言簿，客人们写下看到极光的时间和颜色，有人画了画，有人只写一句「今晚没有，明晚再来」。岛上的老向导说，极夜里最难熬的不是冷，是等；可只要极光一出来，所有人都会忘了自己等了多久，下山时嘴里只剩一句话：「值了。」"
      en: "Unnataq Island lies in the east of the Qavvaluviit Islands, about 3,000 km², in the Qavvaluviit District of Ukkulaaq City. It is rolling hill country rising to a little over 420 m, the highest island in the group, and averaging around 150 m; to the west it faces the main island, Qavvalugjuaq, across little Qurrak Isle, and the Qavvalumasuq Strait, about 3 km wide, runs between the islands. The polar night here is long, hence the name. The island has aurora-watching huts and trails: the trail climbs from the jetty by the sea along the ridges, with a hut every so often, the view widening the higher you go, and on clear nights you can watch the aurora spread from above the strait to the horizon. The tour boats of the island resort sail the strait at night in winter and often call at Unnataq's jetty to drop guests who want to spend the night up on the hill. The capital's Suvvalik District even has a street named after the island, where Metro Line 3 has its Unnataq Island High Street station.\nThe huts along the trail are stocked with firewood, hot tea and blankets, so aurora-watchers can wait indoors and step outside the moment the lights appear. They are never locked, and visitors' books hang on the walls, where guests write down the time and colours of the aurora they saw; some draw pictures, some write only \"nothing tonight, back tomorrow\". The island's old guides say that the hardest part of the polar night is not the cold but the waiting; yet as soon as the aurora comes out everyone forgets how long they waited, and on the way down there is only one thing anyone says: \"worth it\"."
  - id: nat_y023md
    subtype: island
    status: generated
    detect: { kind: island, at_km: [546, 60] }
    names: { zh: 库拉克岛, en: Qurrak Isle, art-x-tavrunaq: Qurrak }
    notes:
      zh: "库拉克岛是卡瓦卢维特群岛的小岛，面积约 470 平方公里，最高处海拔约 310 米，夹在卡瓦卢格尤阿克岛与温纳塔克岛之间，是群岛三座岛中最小的一座，在领地的命名岛屿里也只比萨卡利特岛大。群岛属乌库拉克市卡瓦卢维特区，以观赏极光的旅游业闻名，群岛的名字在塔夫鲁纳克语里就是「极光群岛」；库拉克岛的名字则来自极光最常见的那种绿色光带。岛上是低矮的岩丘和苔原，没有村落、道路和灯光，冬天积雪很厚，冬至前后连续数周见不到太阳。岛屿之间的卡瓦卢马苏克海峡宽约 3 公里，卡瓦卢维特观光度假村的游船冬季就沿着海峡夜航。\n冬夜里库拉克岛一片漆黑，只有极光照亮雪地。游船经过时会熄掉所有灯光、放慢船速，让乘客在黑暗里看极光倒映在水面上，船上只听得见水声和偶尔的惊叹。度假村的向导喜欢说，库拉克岛是群岛里「最安静的观众席」：岛上没有一扇亮着的窗户，极光照下来时，整片雪地就成了一块绿色的银幕。到了夏天的永昼，岛上的苔原开出细小的花，海鸟在岩丘上筑巢，偶尔有划皮划艇的游客在岛边靠岸歇脚，坐在石头上吃块面包再划回去。"
      en: "Qurrak Isle is a small island in the Qavvaluviit Islands, about 470 km² and rising to about 310 m, lying between Qavvalugjuaq and Unnataq islands; it is the smallest of the archipelago's three islands, and among the territory's named islands only Saqqaliit Isle is smaller. The archipelago belongs to Qavvaluviit District of Ukkulaaq City and is known for aurora tourism, its name meaning \"aurora islands\" in Tavrunaq; Qurrak Isle itself is named after the green bands that are the aurora's commonest colour. The isle is low rocky knolls and tundra, with no villages, roads or lights, and lies under deep snow in winter, without sight of the sun for weeks around midwinter. The Qavvalumasuq Strait between the islands is about 3 km wide, and the boats of the Qavvaluviit Lodge cruise along it at night in winter.\nOn winter nights Qurrak Isle is pitch dark, lit only by the aurora on the snow. Passing boats switch off every lamp and slow down so that passengers can watch the aurora mirrored on the water in the dark, with nothing to hear but the water and the occasional gasp. The lodge guides like to call Qurrak \"the quietest seat in the house\": there is not one lit window on the isle, and when the aurora shines down, the whole snowfield becomes a green screen. In the midnight sun of summer small flowers open on its tundra, seabirds nest on the knolls, and now and then kayakers pull in to rest, sitting on a rock to eat a piece of bread before paddling back."

  # ── 乌利库维特群岛 ────────────────────────────────────────────
  - id: nat_p61nkb
    subtype: island
    status: generated
    detect: { kind: island, at_km: [241, 50] }
    names: { zh: 乌利卡尔维克岛, en: Ulikkarvik Island, art-x-tavrunaq: Ulikkarvik }
    notes:
      zh: "乌利卡尔维克岛是乌利库维特群岛西部的岛屿，面积约 1700 平方公里，属萨尔瓦克市乌利库维特区。岛上地势低缓，最高处两百四十多米，平均一百米出头，海岸曲折，多避风的小湾，岸上散布着孵化场、饲料仓库和养殖工人住的村子。周围的海湾里排列着深海养殖网箱，岛名由此而来，名字里的 ulik 在塔夫鲁纳克语中意为鱼。暖流从群岛之间流过，海水比别处温暖，网箱里养着鲑鱼和北极红点鲑；群岛南部的萨尔卡拉湾和岛周围的海面上，一排排圆形网箱像浮在海上的一串串项链。岛上没有高速公路，与大陆和群岛其他岛屿之间靠船只往来，萨尔瓦克的养殖运输船每天把成鱼运回萨尔努卡渔港。\n养殖工人每天坐船出海喂鱼，像牧民去放牧一样，萨尔瓦克人因此把这一片海叫作「海上牧场」。喂鱼的船清早出港，船上装满饲料，工人们管自己的网箱叫「圈」，管鱼群叫「羊」，谁家的「羊」长得肥，冬天收鱼时就能多分一份奖金。孵化场的老工人放鱼苗出海时，会在船头敲三下皮鼓，祝它们在冷水里长得又肥又结实；年轻工人起初觉得好笑，干了几年以后，放苗那天比谁敲得都认真。"
      en: "Ulikkarvik Island lies in the west of the Ulikuviit Islands, about 1,700 km², in the Ulikuviit District of Saarvaq City. It is low and gentle, rising to a little over 240 m and averaging just over 100 m, with an indented coast of sheltered coves, and hatcheries, feed stores and the villages of the fish-farm workers dotted along its shores. The bays around it are lined with deep-sea fish cages, hence the name; the ulik in it means \"fish\" in Tavrunaq. A warm current flows between the islands, keeping the water warmer than elsewhere, and the cages hold salmon and Arctic char; in Saarqalla Bay in the south of the archipelago and in the waters around the island, rows of round cages float like strings of necklaces on the sea. There is no expressway on the island; it is linked to the mainland and the other islands by boat, and Saarvaq's fish carriers take the grown fish to Saarnuqa Fishing Harbour every day.\nFish-farm workers go out by boat to feed the fish every day, like herders going out to their flocks, so Saarvaq people call these waters \"the pastures of the sea\". The feed boats leave harbour early, loaded with feed; the workers call their cages \"pens\" and their fish \"sheep\", and whoever's \"sheep\" grow fattest earns a bigger bonus when the fish are harvested in winter. When the old hatchery hands release fry to the cages they beat a skin drum three times at the bow, wishing them a fat, strong growth in the cold water; the young workers find it funny at first, but after a few years they beat the drum more earnestly than anyone on release day."
  - id: nat_qpjgxz
    subtype: island
    status: generated
    detect: { kind: island, at_km: [211, 57] }
    names: { zh: 库卡利克岛, en: Kuuqalik Island, art-x-tavrunaq: Kuuqalik }
    notes:
      zh: "库卡利克岛是乌利库维特群岛最西的岛屿，面积约 1500 平方公里，属萨尔瓦克市乌利库维特区。岛上地势低平，最高处海拔一百九十多米，平均不到一百米，内陆是苔原和湖塘，西岸迎着外海的风浪，东岸则隔着海面与乌利卡尔维克岛相望。沿岸浅水里生长着大片海藻林，暖流带来的养分让海藻长得又密又长，岛上的工厂把海藻加工成食品和饲料，一部分饲料就送到群岛的养殖网箱里喂鱼。夏天采藻船贴着岸边作业，收割下来的海藻在岸上的晒场里摊开晾干，整座岛都弥漫着一股咸咸的海味。岛上的居民多在海藻厂和养殖场工作，与群岛其他岛屿和大陆之间靠船只往来。冬天海藻停止生长，采藻船靠岸检修，工人们就转去养殖场帮忙，开春后再回到海藻林里。\n退潮时海藻林的叶片浮上水面，在阳光下像一片金褐色的草原，海獭常在其中仰躺着敲贝壳，有时还用海藻把自己缠住，免得睡着时被浪冲走。岛上的孩子放学后爱去岸边数海獭，看谁能找到「抱着孩子睡觉」的那一只。海藻厂的食堂有一道招牌菜，是用本岛海藻熬的鱼汤，工人们说喝惯了这碗汤，到了别处总觉得汤里「少了一片海」。"
      en: "Kuuqalik Island is the westernmost of the Ulikuviit Islands, about 1,500 km², in the Ulikuviit District of Saarvaq City. It is low and flat, rising to a little over 190 m and averaging under 100 m, with tundra and ponds inland; its west shore takes the wind and waves of the open sea, while its east shore looks across the water to Ulikkarvik Island. Great kelp forests grow in the shallows along its coast, the nutrients brought by the warm current making them thick and long, and the island's factory processes the kelp into food and feed, some of which goes to the archipelago's fish cages. In summer the kelp boats work close inshore, and the harvested kelp is spread to dry on drying grounds along the shore, filling the whole island with a salty smell of the sea. Most islanders work at the kelp factory and the fish farms, and the island is linked to the other islands and the mainland by boat. In winter the kelp stops growing and the kelp boats are laid up for repairs, so the workers go to help at the fish farms, returning to the kelp forests in spring.\nAt low tide the fronds of the kelp forest float to the surface and shine in the sun like a golden-brown meadow, where sea otters lie on their backs cracking shells, sometimes wrapping themselves in kelp so they are not carried off by the waves while they sleep. The island's children like to go down to the shore after school to count the otters and see who can find the one \"sleeping with its baby in its arms\". The kelp factory canteen's signature dish is a fish soup simmered with the island's own kelp, and the workers say that once you are used to it, soup anywhere else always seems to be \"missing a piece of the sea\"."
  - id: nat_ptewc9
    subtype: island
    status: generated
    detect: { kind: island, at_km: [292, 72] }
    names: { zh: 萨里马岛, en: Saarimma Island, art-x-tavrunaq: Saarimma }
    notes:
      zh: "萨里马岛是乌利库维特群岛的主岛，面积约 2900 平方公里，属萨尔瓦克市乌利库维特区，离首府只有一百多公里。岛上是起伏的丘陵，最高处海拔五百米出头，平均两百五十米上下，丘陵之间的谷地里散落着村镇，港湾和码头沿着避风的东岸排开。暖流经过岛的周围，海水比别处温暖，冬天港湾也很少封冻，乌利库维特区的 7.7 万居民大多住在这座岛上。乌利库维特深海养殖基地就设在岛边的海湾里，网箱里养着鲑鱼和北极红点鲑，岸上是孵化场与加工厂，养殖、渔业和水产加工占全区经济的大半。岛上没有高速公路，与大陆之间靠船只往来，加工好的鱼片和熏鱼装上冷藏船，运往萨尔瓦克和首府。岛上小学的教室窗外就是一排排网箱。\n每天清晨，养殖船从萨里马岛的码头出发去喂鱼，傍晚收工时船队排成一行回港，码头上的家人隔着老远就能认出自家的船灯：有人挂红灯，有人挂两盏白灯，有人在桅杆顶上绑一面小旗。冬天天黑得早，下午三四点钟船队就亮着灯回来了，孩子们放学后跑到码头上，比赛谁先认出自家的船。岛上的人说，萨里马的灯塔有一座，可码头上每一户人家都是自家船的灯塔。"
      en: "Saarimma Island is the main island of the Ulikuviit Islands, about 2,900 km², in the Ulikuviit District of Saarvaq City, only a little over 100 km from the capital. It is rolling hill country rising to just over 500 m and averaging around 250 m, with villages and towns scattered in the valleys between the hills and harbours and jetties ranged along the sheltered east coast. A warm current flows round the island, keeping the water warmer than elsewhere, so that even in winter the harbours seldom freeze, and most of Ulikuviit District's 77,000 residents live here. The Ulikuviit Aquaculture Base lies in the bays off the island, its cages holding salmon and Arctic char, with hatcheries and processing plants ashore; fish farming, fishing and seafood processing make up most of the district's economy. There is no expressway on the island, which is linked to the mainland by boat, and the processed fillets and smoked fish are loaded onto refrigerated ships for Saarvaq and the capital. Outside the windows of the island's primary school lie row upon row of fish cages.\nEvery morning the fish-farm boats leave Saarimma's jetties to feed the fish, and at the end of the day they come home in a line, while families on the quay recognise their own boat's lights from far off: one hangs a red lamp, another two white ones, another ties a small flag to the masthead. In winter it gets dark early, and by three or four in the afternoon the boats are already coming home lit up, while children run down to the quay after school to see who can spot their family's boat first. The islanders say Saarimma has only one lighthouse, but on the quay every family is the lighthouse for its own boat."
  - id: nat_9f9td0
    subtype: island
    status: generated
    detect: { kind: island, at_km: [301, 42] }
    names: { zh: 西卢阿库利岛, en: Silluaqulli Isle, art-x-tavrunaq: Silluaqulli }
    notes:
      zh: "西卢阿库利岛是乌利库维特群岛最南的岛屿，面积约 1100 平方公里，属萨尔瓦克市乌利库维特区。岛虽小，却是群岛地势最高的岛，最高处海拔五百一十多米，平均两百五十多米，山坡陡峭，海岸多崖，只有北岸有几处能停船的小湾。岛南端的灯塔为驶向首府的船只指引航道：从西面驶来的货船、渔船和养殖运输船，过了西卢阿库利岛就该转向首府的峡湾口，灯塔的光束在极夜里能照出很远，渔民说看见它就算到了家门口。岛上住着灯塔的看守人和少数渔民，补给靠群岛之间的船只，夏天偶尔也有游客坐船来看灯塔。首府苏瓦利克区有一条以它命名的大街，地铁 1 号线在那里设有西卢阿库利岛大街站，不少首府人是先认识了这个站名，才知道海上有这样一座岛。\n灯塔的看守人每年都在塔下的小菜园里种土豆，说是「全首府最靠海的菜地」，收获时会给路过的渔船送上一袋。菜园四周垒着挡风的石墙，土是一筐筐从山下背上来的，种出来的土豆只有核桃大小，渔民们却说比城里买的香。渔船回赠的是刚打上来的鳕鱼，看守人就在灯塔下煮一锅土豆鳕鱼汤，风大的夜里，汤的热气和灯塔的光一起往海上飘。"
      en: "Silluaqulli Isle is the southernmost of the Ulikuviit Islands, about 1,100 km², in the Ulikuviit District of Saarvaq City. Small as it is, it is the highest island in the group, rising to a little over 510 m and averaging over 250 m, with steep slopes and a cliffed coast, and only a few coves on the north shore where boats can put in. The lighthouse at its southern tip guides ships bound for the capital: freighters, fishing boats and fish carriers coming from the west turn for the capital's fjord mouth once they have passed Silluaqulli, and in the polar night the beam reaches far out to sea, and fishermen say that once they see it they are as good as home. The isle is home to the lighthouse keeper and a handful of fishermen, supplied by boats running between the islands, and in summer the occasional visitor comes by boat to see the lighthouse. The capital's Suvvalik District has a street named after it, where Metro Line 1 has its Silluaqulli Isle High Street station, and many people in the capital knew the station's name before they learned there was such an island at sea.\nEvery year the lighthouse keeper grows potatoes in a little garden at the foot of the tower, calling it \"the capital's most seaward vegetable patch\", and at harvest gives a bag to passing fishing boats. The garden is walled with stones against the wind, its soil carried up from below basket by basket, and the potatoes it yields are only the size of walnuts, but the fishermen say they taste better than any bought in town. The boats return the favour with freshly caught cod, and the keeper cooks a pot of potato and cod soup at the foot of the lighthouse; on windy nights the steam of the soup drifts out to sea with the lighthouse beam."

  # ── 通纳库维特群岛 ────────────────────────────────────────
  - id: nat_mgz2yw
    subtype: island
    status: generated
    detect: { kind: island, at_km: [94, 85] }
    names: { zh: 通纳克岛, en: Tuunnaq Island, art-x-tavrunaq: Tuunnaq }
    notes:
      zh: "通纳克岛是通纳库维特群岛的主岛，面积约 3400 平方公里，在领地的岛屿中排第十四，属萨尔瓦克市通纳库特生态保护区。岛上是一片低平的熔岩台地，最高处海拔一百七十多米，平均九十米上下，台地由一层层古老的玄武岩熔岩叠成，冷却时裂成六角形的石柱，海浪把台地边缘切成陡崖，成排的六角形玄武岩柱高出海面，岛名里的 tuun 在塔夫鲁纳克语中意为石头。这些石柱是通纳库特玄武岩柱保护区的核心，崖上栖息着海鸦与北极鸥，整个群岛都划为生态保护区，常住约 1800 人，多为巡护员和渔民。游客只能乘船在保护距离外观看，保护区只开放一条海上观光航线，游船绕着岩柱缓缓驶过，船长会关掉马达，让乘客听海浪在石柱间回响。\n塔夫鲁纳克人的传说里，这些石柱是海神为海鸦搭的石梯，所以崖下从不捕鸟；夏天成千上万只海鸟停在每一级「台阶」上，叫声盖过了浪声。岛上的渔民至今守着这条老规矩，下网时离石柱远远的，说是「不在神的楼梯底下干活」。巡护员每年夏天乘小艇沿崖数鸟，数到哪一级台阶上鸟最多，就在本子上记下那根石柱的编号，几十年下来，最受欢迎的几级「台阶」从来没换过。"
      en: "Tuunnaq Island is the main island of the Tuunnaquviit Islands. At about 3,400 km² it is the fourteenth largest island in the territory, and it belongs to the Tuunnaqut Nature Reserve of Saarvaq City. It is a low lava tableland rising to a little over 170 m and averaging around 90 m, built up of layer upon layer of ancient basalt flows that cracked into hexagonal columns as they cooled; the waves have cut the tableland's edges into cliffs, where rows of hexagonal basalt columns stand above the sea, and the tuun in the island's name is the Tavrunaq for \"stone\". The columns are the heart of the Tuunnaqut Basalt Pillars Reserve, with guillemots and Arctic gulls nesting on the cliffs, and the whole archipelago is a nature reserve with about 1,800 residents, mostly rangers and fishermen. Visitors may only watch from boats beyond the protection limit; the reserve opens just one sightseeing sea route, on which the boats pass slowly round the columns and the captain cuts the engine so passengers can hear the waves echoing among the stones.\nIn Tavrunaq legend the columns are a stone stairway the sea god built for the guillemots, so no one ever takes birds beneath the cliffs; in summer thousands upon thousands of seabirds perch on every \"step\", their cries drowning out the waves. The island's fishermen still keep the old rule, setting their nets well away from the columns, saying they \"don't work under the god's staircase\". Every summer the rangers count the birds from a dinghy along the cliffs, noting the number of the column whose step holds the most birds; over decades the most popular \"steps\" have never changed."
  - id: nat_ftskb5
    subtype: island
    status: generated
    detect: { kind: island, at_km: [123, 69] }
    names: { zh: 米尔尼克岛, en: Mirnik Island, art-x-tavrunaq: Mirnik }
    notes:
      zh: "米尔尼克岛是通纳库维特群岛东部的岛屿，面积约 2800 平方公里，属萨尔瓦克市通纳库特生态保护区。岛上是一座层层叠起的熔岩高地，最高处海拔四百二十米，平均两百三十多米，是群岛地势最高的岛，四面是陡峭的海崖，崖壁上一层层深色的熔岩像摞起来的石板。全岛由深色的玄武岩构成，岛名由此而来。岩石风化后的碎屑在背风的坡地上积成薄薄的土层，夏天长出苔藓、矮草和成片的紫色虎耳草，崖顶和崖缝里栖息着海鸦、三趾鸥和北极鸥，海面上常有海豹探头。和群岛其他岛屿一样，米尔尼克岛属生态保护区，游客只能乘船在保护距离外观看，岛上只有巡护员的哨所和几间渔民的季节小屋。\n雨后玄武岩被淋得发黑发亮，整座岛像一块浸了水的墨石，从海上远远就能认出来。渔民说，在雾天和雨天里，别的岛都会隐进灰色里，只有米尔尼克岛反而更黑、更清楚，所以它是群岛一带最靠得住的航标。塔夫鲁纳克的老人还说，海神给海鸦搭石梯时用的石头就是从这座岛上取的，所以米尔尼克岛才比别的岛高，岛上的黑石头至今没人去搬，连巡护员修哨所用的石料都是从大陆运来的。"
      en: "Mirnik Island lies in the east of the Tuunnaquviit Islands, about 2,800 km², in the Tuunnaqut Nature Reserve of Saarvaq City. It is an upland built up of layer upon layer of lava, rising to 420 m and averaging over 230 m, the highest island of the group, ringed by steep sea cliffs whose dark lava beds are stacked like slabs of stone. The whole island is made of dark basalt, hence the name. Weathered grit has gathered into a thin soil on the sheltered slopes, where mosses, short grasses and drifts of purple saxifrage grow in summer, while guillemots, kittiwakes and Arctic gulls nest on the clifftops and in the crevices, and seals often put their heads up offshore. Like the rest of the archipelago, Mirnik is part of the nature reserve; visitors may only watch from boats beyond the protection limit, and the island has nothing but a rangers' post and a few seasonal fishermen's huts.\nAfter rain the basalt turns black and gleaming, and the whole island looks like an inkstone soaked in water, recognisable from far out at sea. The fishermen say that in fog and rain the other islands fade into the grey, but Mirnik only grows blacker and clearer, which makes it the most reliable seamark in these waters. Tavrunaq elders also say that the stones the sea god used for the guillemots' stairway were taken from this island, which is why Mirnik stands higher than the rest; nobody moves its black stones to this day, and even the stone for the rangers' post was shipped in from the mainland."
  - id: nat_w4fpp3
    subtype: island
    status: generated
    detect: { kind: island, at_km: [70, 69] }
    names: { zh: 尼帕克图克岛, en: Nipaqtuuq Isle, art-x-tavrunaq: Nipaqtuuq }
    notes:
      zh: "尼帕克图克岛是通纳库维特群岛西部的小岛，面积约 830 平方公里，属萨尔瓦克市通纳库特生态保护区。岛上地势低平，最高处海拔一百九十多米，平均八十米左右，四周是被海浪切开的玄武岩海岸，六角形的岩柱一根根挤在一起，有的高出海面十几米，有的只剩半截，柱与柱之间留下宽窄不一的缝隙和海蚀洞。海浪冲进岩柱之间的空隙，发出像管风琴一样的声音，岛名由此而来。岛的西面就是开阔的外海，风浪从这里直扑过来，岩柱间的声音随风浪的大小一会儿低沉、一会儿尖细。岛上没有居民，崖上栖息着海鸦和北极鸥，游客只能乘船在保护距离外听。首府努坎加克区有一条以它命名的大街，地铁 4 号线在那里设有尼帕克图克岛大街站。\n风浪大的日子，岩柱间的「管风琴」声音最响，渔民说听到它在唱歌，就该回港了。老渔民还能从声音里听出更多东西：低沉的长音是涌浪从外海推过来，急促的短音是风向要变，要是「管风琴」突然不出声，反倒要格外小心。保护区的游船在风平浪静时开到岛边，船长关掉马达，乘客们屏住呼吸，等下一道浪钻进石缝，奏出一个悠长的音。"
      en: "Nipaqtuuq Isle is a small island in the west of the Tuunnaquviit Islands, about 830 km², in the Tuunnaqut Nature Reserve of Saarvaq City. It is low and flat, rising to a little over 190 m and averaging about 80 m, ringed by a basalt coast cut by the waves, where hexagonal columns crowd together, some standing a dozen metres or more above the sea and others broken off halfway, leaving gaps and sea caves of every width between them. The waves rushing into the gaps between the columns make a sound like a pipe organ, which gives the island its name. To the west lies the open sea, from which wind and waves strike straight at the island, and the sound among the columns swings from deep to shrill as the swell rises and falls. Nobody lives here; guillemots and Arctic gulls nest on the cliffs, and visitors may only listen from boats beyond the protection limit. The capital's Nuqangaq District has a street named after the island, where Metro Line 4 has its Nipaqtuuq Isle High Street station.\nOn rough days the \"organ\" among the columns is at its loudest, and fishermen say that when they hear it singing it is time to head for port. Old fishermen can hear more in it: a long, deep note means swell rolling in from the open sea, short quick notes mean the wind is about to shift, and if the \"organ\" suddenly falls silent, that is the time to take most care. In calm weather the reserve's tour boat comes close to the island, the captain cuts the engine, and the passengers hold their breath waiting for the next wave to slip into the rocks and play a long, drawn-out note."

  # ── 图卡鲁维特群岛 ────────────────────────────────────────────
  - id: nat_3njsdv
    subtype: island
    status: generated
    detect: { kind: island, at_km: [39, 189] }
    names: { zh: 图卡尔尤阿克岛, en: Tukkarjuaq Island, art-x-tavrunaq: Tukkarjuaq }
    notes:
      zh: "图卡尔尤阿克岛是图卡鲁维特群岛的主岛，在图利瓦克市西面的海上，面积约 3900 平方公里，在领地的岛屿中排第十三，属图利瓦克市图卡鲁维特区。岛上地势低缓，最高处两百多米，平均一百一十多米，海岸平直，冬天寒风从北冰洋上直吹过来。岛名来自岛上的图卡尔尤阿克数据中心：它是群岛上最大的数据中心，用极地冷空气和海水冷却服务器，余热为岛上的住宅供暖。旁边的北极光算力中心为人工智能训练出租算力，海底光缆从这里连到世界各地，大楼外墙的灯带随着算力负载变换颜色。图卡鲁维特区 4.9 万人，大多住在这座岛上，居民多是数据中心的工程师和运维人员，来自世界各地，岛上的一条小街就能吃到好几个国家的菜。\n岛上的游泳馆和温室靠数据中心的余热取暖，本地人开玩笑说自己是「泡在服务器的洗澡水里游泳」。机房里冷风呼呼地吹，值班工程师一年四季都穿着抓绒衣；北极光算力中心的食堂按全球时区排班开饭，什么时候去都有热饭。本地人看一眼算力中心的墙色就知道「机器今天忙不忙」，有人说，岛上的天气预报看天，心情预报看墙。"
      en: "Tukkarjuaq Island is the main island of the Tukkaruviit Islands, in the sea west of Tullivaq City. At about 3,900 km² it is the thirteenth largest island in the territory, and it belongs to the Tukkaruviit District of Tullivaq City. The island is low and gentle, rising to a little over 200 m and averaging a little over 110 m, with a straight coast and winter winds blowing straight off the Arctic Ocean. It takes its name from the Tukkarjuaq Data Centre, the largest in the islands, which cools its servers with polar air and seawater and heats the island's homes with the waste heat. Beside it the Northern Lights Compute Centre rents out computing power for training artificial intelligence; submarine cables link it to the whole world, and the light strips on its facade change colour with the computing load. Tukkaruviit District has 49,000 people, most of them living on this island, largely data-centre engineers and operations staff from all over the world, and a single little street on the island serves the food of several countries.\nThe island's swimming pool and greenhouses are heated by the data centre's waste heat, and locals joke that they \"swim in the servers' bathwater\". Cold air roars through the machine halls, so the engineers on duty wear fleeces all year round, and the Northern Lights canteen serves meals on a rota set to the world's time zones, so there is hot food whenever you turn up. Locals can tell from a glance at the compute centre's walls \"whether the machines are busy today\", and some say that on the island you read the weather forecast from the sky and the mood forecast from the wall."
  - id: nat_x904y1
    subtype: island
    status: generated
    detect: { kind: island, at_km: [55, 161] }
    names: { zh: 阿利克塔克岛, en: Aliqtaq Isle, art-x-tavrunaq: Aliqtaq }
    notes:
      zh: "阿利克塔克岛是图卡鲁维特群岛东部的岛屿，面积约 1800 平方公里，属图利瓦克市图卡鲁维特区，西隔阿利克马苏克海峡与帕利塔库岛相望。岛上是起伏的低丘，最高处海拔三百多米，是群岛地势最高的岛，平均一百三十米上下，海岸曲折，多砾石滩和小海湾。连接世界各地的海底光缆在这里登陆，岛名由此而来：光缆从外海沿阿利克马苏克海峡的海底铺来，在岛上的登陆站上岸，再连到图卡尔尤阿克岛的数据中心。阿利克马苏克海峡宽约 11 公里，是领地最宽的命名海峡，光缆维修船偶尔会在海峡里停泊几天，潜水员下到海底检修光缆，岛上的人管它叫「给世界接线的船」。首府苏瓦利克区有一条以它命名的路，地铁 1 号线在那里设有阿利克塔克岛路站。\n光缆登陆站旁立着一块石碑，刻着光缆另一端连接的地方，岛上的孩子说他们的岛「一伸手就能摸到世界」。每当有一条新光缆接通，登陆站的工程师就在石碑上添刻一行，孩子们会跑来看又多了哪个地方，回家在地图上找。维修船来的那几天，岸边总围着一群看热闹的人，潜水员浮出水面时，大家会齐声问一句：「世界接上了吗？」"
      en: "Aliqtaq Isle lies in the east of the Tukkaruviit Islands, about 1,800 km², in the Tukkaruviit District of Tullivaq City, looking west across the Aliqmasuq Strait to Paalitaqqu Isle. It is rolling low hills rising to a little over 300 m, the highest island of the group, and averaging around 130 m, with an indented coast of gravel beaches and small coves. The submarine cables that link the islands to the whole world come ashore here, hence the name: they run in from the open sea along the bed of the Aliqmasuq Strait, land at the island's landing station and continue to the data centres on Tukkarjuaq Island. The Aliqmasuq Strait, about 11 km wide, is the widest named strait in the territory; now and then a cable repair ship anchors in it for a few days while divers go down to inspect the cables, and the islanders call it \"the ship that wires up the world\". The capital's Suvvalik District has a road named after the island, where Metro Line 1 has its Aliqtaq Isle Road station.\nBeside the cable landing station stands a stone tablet carved with the places the cables reach at their far ends, and the island's children say their island \"can touch the world just by reaching out\". Whenever a new cable is connected, the station's engineers carve another line on the tablet, and the children run to see which place has been added, then go home to find it on a map. In the days the repair ship is in, a crowd of onlookers always gathers on the shore, and when a diver surfaces everyone asks at once, \"Is the world connected?\""
  - id: nat_estcp4
    subtype: island
    status: generated
    detect: { kind: island, at_km: [32, 166] }
    names: { zh: 帕利塔库岛, en: Paalitaqqu Isle, art-x-tavrunaq: Paalitaqqu }
    notes:
      zh: "帕利塔库岛是图卡鲁维特群岛西部的岛屿，面积约 1200 平方公里，属图利瓦克市图卡鲁维特区，东隔宽约 11 公里的阿利克马苏克海峡与阿利克塔克岛相望。岛上地势低缓，最高处两百五十多米，平均一百一十米上下，内陆是苔原和湖塘，海岸多低崖和礁石。夏季暖流与冷空气相遇，岛上常被白色海雾笼罩，岛名里的 paali 在塔夫鲁纳克语中意为白，岛名由此而来。雾浓的日子，从海上望去整座岛只剩一个模糊的白影，岛上的人出门要沿着拉在路边的绳子走。岛上住着灯塔的看守人和少数渔民，补给靠群岛之间的渡船。冬天海雾少了，换来的是漫长的极夜。首府库马尔维克区有一条以它命名的大道，地铁 1 号线从大连站出发后的第二站就是帕利塔库岛大道站。\n海雾来时，岛上的灯塔和雾笛同时启动，渔民说在帕利塔库岛附近航行「靠耳朵比靠眼睛管用」。雾笛的声音低沉，一长一短，渔民们从小就记住了它的节奏，雾里听见它就知道自己离岛还有多远、该往哪边转舵。有一年夏天雾笛坏了几天，全岛的渔民干脆停了工，看守人修好雾笛的那天晚上，码头上的人围着他喝了一夜的酒。"
      en: "Paalitaqqu Isle lies in the west of the Tukkaruviit Islands, about 1,200 km², in the Tukkaruviit District of Tullivaq City, looking east across the Aliqmasuq Strait, about 11 km wide, to Aliqtaq Isle. It is low and gentle, rising to a little over 250 m and averaging around 110 m, with tundra and ponds inland and a coast of low cliffs and reefs. In summer the warm current meets the cold air and the island is often wrapped in white sea fog; the paali in its name is the Tavrunaq for \"white\", and that is where the name comes from. On thick days the whole island is just a blurred white shape from the sea, and islanders going out follow ropes strung along the paths. The isle is home to the lighthouse keeper and a few fishermen, supplied by ferries running between the islands. In winter the fog thins, and the long polar night takes its place. The capital's Qummarvik District has an avenue named after it, and the second stop on Metro Line 1 after Dalian is Paalitaqqu Isle Avenue.\nWhen the fog comes in, the island's lighthouse and foghorn start up together, and fishermen say that near Paalitaqqu \"your ears are more use than your eyes\". The foghorn's note is deep, one long and one short, and fishermen learn its rhythm as children: hearing it in the fog, they know how far they are from the island and which way to turn the helm. One summer the foghorn broke down for a few days and all the island's fishermen simply stopped work; on the night the keeper got it going again, the people on the quay gathered round him and drank all night."

  # ── Archipelagos ────────────────────────────────────────
  - id: nat_fe3007
    subtype: archipelago
    status: generated
    islands: [nat_dppqz7, nat_rhderc]
    names: { zh: 陶武维特群岛, en: Tauvvuviit Islands, art-x-tavrunaq: Tauvvuviit }
    notes:
      zh: "陶武维特群岛是图利瓦克市以北远海上的群岛，由陶瓦克岛和萨卡利特岛组成，总面积约 7700 平方公里，构成图利瓦克市的陶武维特区，常住约 1.1 万人。群岛名由塔夫鲁纳克语的 tauvvu（天）加上表示群岛的后缀构成，意为「天之群岛」，因卫星地面站得名：极轨卫星每一圈都经过高纬度上空，陶瓦克岛上的陶武维特地面站接收卫星数据，萨卡利特岛上的天线为它接力，数据再转发到图卡鲁维特群岛。两座岛都地势低平，主岛最高处两百多米，小岛只有一百米上下，岛上是冰川磨平的岩丘、苔原和夏天的融水洼，没有高过膝盖的植物。萨卡利特岛面积约 340 平方公里，是领地最小的命名岛屿。\n群岛的居民多是地面站的工程师、值班员和家属，孩子们从小听惯了天线转动时的嗡嗡声，学校的第一堂自然课就是在操场上抬头找卫星。两座岛上的天线一大一小遥遥相对，地面站的人说它们是「一对隔海说话的兄弟」。冬季的极夜里，天线座上的警示灯和天上的极光交相辉映；夏季冰化后，补给船从南边的大陆开来，船一靠岸，全岛的人都到码头帮着卸货，卸完了就在码头上烤一锅鱼，算是给夏天开个头。"
      en: "The Tauvvuviit Islands are an archipelago in the open sea north of Tullivaq City, made up of Tauvvaq Island and Saqqaliit Isle, about 7,700 km² in all; they form the Tauvvuviit District of Tullivaq City, with about 11,000 residents. The name joins the Tavrunaq tauvvu, \"sky\", to the suffix for an archipelago, \"islands of the sky\", and comes from the satellite ground station: polar-orbiting satellites cross the high latitudes on every orbit, the Tauvvuviit Ground Station on Tauvvaq Island receives their data, the antennas on Saqqaliit relay for it, and the data is passed on to the Tukkaruviit Islands. Both islands are low and flat, the main island rising to a little over 200 m and the small one to only about 100 m, with glacier-smoothed rock knolls, tundra and summer meltwater pools, and no plant taller than your knee. At about 340 km², Saqqaliit Isle is the smallest named island in the territory.\nMost islanders are the station's engineers and duty staff and their families; children grow up used to the hum of turning dishes, and their first nature lesson at school is looking for satellites from the playground. The antennas on the two islands face each other across the water, one large and one small, and the station staff call them \"a pair of brothers talking across the sea\". In the polar night the warning lights on the antenna mounts answer the aurora overhead; in summer, once the ice has gone, the supply ship comes up from the mainland to the south, and when it berths the whole island turns out at the quay to help unload, then grills a pot of fish on the quayside to open the summer."
  - id: nat_554jpc
    subtype: archipelago
    status: generated
    islands: [nat_b1fv64, nat_dstxyg]
    names: { zh: 皮图库维特群岛, en: Pitukuviit Islands, art-x-tavrunaq: Pitukuviit }
    notes:
      zh: "皮图库维特群岛是北岸外海的群岛，由皮图克尤阿克岛和瑙卡克岛组成，总面积一万一千五百多平方公里，构成塔夫鲁利特原住民自治区的皮图库维特区，常住约 8.3 万人，是塔夫鲁利特人传统的海上猎场。主岛皮图克尤阿克岛面积一万零四百多平方公里，是领地第五大岛；两岛之间的皮图克马苏克海峡宽约 5 公里，群岛西南端的皮图昆纳尔岬是猎人出海的地标，岬上的老石堆路标至今立着。群岛地势低缓，最高处不到四百米，内陆是苔原和湖塘，海岸岩石上刻着鲸、海豹与皮划艇的皮图库维特岩雕。自治区由塔夫鲁利特人民党执政，群岛上的狩猎季和猎场分配沿用长老们定下的老规矩。\n冬季海峡封冻后，猎人们乘雪橇在岛屿之间往来，夏天则换成小船，岩雕上刻着的皮划艇至今仍是岛上孩子学的第一种船。路过皮图昆纳尔岬的人有往石堆上添一块石头的习惯，但谁也不能拿走一块，老人说石堆每高一寸，就是又有一个人平安回了家。秋天海豹最肥的时候，各村把猎获拿到海边一起分，晚上点起油灯唱歌，熏海豹肉和浆果干是这一季家家都备着的过冬吃食。孩子们最盼的是分肉那晚，长辈会讲祖先乘皮划艇绕过皮图昆纳尔岬的故事。"
      en: "The Pitukuviit Islands are an archipelago off the north coast, made up of Pitukjuaq Island and Naukkaq Island, a little over 11,500 km² in all; they form the Pitukuviit District of the Tavrulit Indigenous Autonomous Region, with about 83,000 residents, and are the traditional sea-hunting grounds of the Tavrulit. The main island, Pitukjuaq, at a little over 10,400 km², is the fifth largest island in the territory; the Pitukmasuq Strait between the two islands is about 5 km wide, and Cape Pitukkunnar at the archipelago's south-western tip is the hunters' landmark for putting out to sea, its old cairn still standing. The islands are low and gentle, under 400 m at their highest, with tundra and ponds inland, and the shore rocks bear the Pitukuviit Rock Carvings of whales, seals and kayaks. The autonomous region is governed by the Tavrulit People's Party, and the hunting seasons and the division of the hunting grounds still follow the old rules laid down by the elders.\nWhen the strait freezes in winter, hunters cross between the islands by sled, and in summer by small boat; the kayak carved on the rocks is still the first boat island children learn to paddle. People passing Cape Pitukkunnar add a stone to the cairn, but no one may take one away, and the elders say every inch the cairn grows is one more person who came home safely. In autumn, when the seals are fattest, each village brings its catch to the shore to share out, and in the evening they light oil lamps and sing; smoked seal meat and dried berries are the winter stores every household lays in that season. What the children look forward to most is the night of the sharing, when the elders tell stories of their ancestors rounding Cape Pitukkunnar by kayak."
  - id: nat_3832s0
    subtype: archipelago
    status: generated
    islands: [nat_5hdtr2, nat_r5e7sa, nat_2vhfdf]
    names: { zh: 纳卢维特群岛, en: Naalluviit Islands, art-x-tavrunaq: Naalluviit }
    notes:
      zh: "纳卢维特群岛是北岸外海的群岛，由纳卢尤阿克岛、普塔克岛和阿卡尼尔维克岛组成，总面积八千六百多平方公里，构成基卢克图阿尔原住民自治区的纳卢维特区，常住约 1.1 万人，多为科研人员和他们的家属，是领地极地科研的基地。群岛名取自塔夫鲁纳克语的 naallu，意为考察。主岛纳卢尤阿克岛最高五百六十多米，岛上有北冰洋极地研究所，研究海冰、冻土与北极生态；东面的普塔克岛维护研究所布放在海上的浮标，最北的阿卡尼尔维克岛设有观测海冰的站点，三座岛分工协作，常年记录海冰与洋流。群岛以北隔着海峡是伊卢克帕卡群岛。自治区议事会管着北岸近海的渔业配额和狩猎季，领地要在这一带新设保护区，须经它同意。\n每年夏天科考船从这里出发去北方的海冰，岛上的研究员说，他们一年只有两个季节：「出海」和「等出海」。科研人员和自治区的猎人打交道久了，彼此都学会了对方的一套本事：猎人教研究员看冰的颜色、听冰的声音，研究员把卫星冰图打印出来送给猎人。冬天的晚上，研究所的食堂里常有人拉起手风琴，北岸的老歌和实验室里编的顺口溜混在一起唱，一唱就到半夜。"
      en: "The Naalluviit Islands are an archipelago off the north coast, made up of Naallujuaq Island, Puttaq Isle and Aqqanirvik Isle, a little over 8,600 km² in all; they form the Naalluviit District of the Kiluktuar Indigenous Autonomous Region, with about 11,000 residents, mostly researchers and their families, and are the base of the territory's polar research. The name comes from the Tavrunaq naallu, \"research\". The main island, Naallujuaq, rising to a little over 560 m, is home to the Arctic Ocean Polar Research Institute, which studies sea ice, permafrost and Arctic ecology; Puttaq Isle to the east services the institute's ocean buoys, and Aqqanirvik Isle, the northernmost, has a sea-ice observation post, the three islands sharing the work of recording the sea ice and currents all year. North of the islands, across a strait, lie the Illuqpakka Islands. The autonomous region's council controls the fishing quotas and hunting seasons of these northern coastal waters, and the territory may not create a new reserve here without its consent.\nEvery summer the research ship sets out from here for the northern sea ice, and the islands' researchers say they have only two seasons: \"at sea\" and \"waiting to go to sea\". Researchers and the region's hunters have worked together so long that each has picked up the other's skills: the hunters teach the researchers to read the colour of the ice and listen to its sounds, and the researchers print out satellite ice charts for the hunters. On winter evenings someone in the institute canteen often strikes up an accordion, and old north-shore songs get sung alongside rhymes made up in the laboratories, often until midnight."
  - id: nat_8f01h7
    subtype: archipelago
    status: generated
    islands: [nat_99nd2b, nat_sr3rmn, nat_b3kk8p, nat_ymb49v, nat_s25e8t, nat_tfkcz1]
    names: { zh: 西尔米乌维特群岛, en: Sirmiuviit Islands, art-x-tavrunaq: Sirmiuviit }
    notes:
      zh: "西尔米乌维特群岛是领地东北海上的群岛，由基库维克岛、帕利乌维克岛、基库利克岛、图利乌维克岛、乌维库卢克岛和西尔米奥拉岛组成，总面积约 6.6 万平方公里，是领地第二大的群岛，仅次于更北面的皮鲁库维特群岛。群岛名由 sirmi（冰）加上表示群岛的后缀构成，意为「冰之群岛」。群岛几乎无人居住，整片划为西尔米瓦克自由邦的西尔米乌维特冰盖管理区，常住只有约 1100 人。主岛基库维克岛面积约 5.7 万平方公里，是领地第二大岛，西尔米基克山纵贯全岛，南北两头各有一座冰帽：北段的主峰基克尔尤阿克峰海拔 2356 米，顶着乌维克西尔米冰帽，南段的基克皮鲁克峰海拔 2236 米，顶着基克西尔米冰帽，冰川从山上一直流进海里。其余五座岛都是低矮的碎石岛和雪岛，有的是北极熊产仔的地方，有的终年被浮冰包围。\n群岛上只有冰川、冰崖和冰山，偶尔有科考队乘飞机上岛，他们说这里安静得「连自己的心跳都听得见」。西尔米乌维特冰山观测站为南岸航线发布冰山预报，夏季有邮轮前来观赏冰崖崩落。自由邦的规矩在这里也一样：带队上岛的向导、猎人和探矿者，都要持自由邦议会发的许可证，自由邦的人说，这片冰原「是大家的，也得有人管」。"
      en: "The Sirmiuviit Islands are an archipelago in the north-east of the territory, made up of Kiiquviq, Paaliuviq, Kiqqulik, Tulliuviq, Uviqkuluk and Sirmiaulla islands, about 66,000 km² in all, the second largest archipelago in the territory after the Pirrukuviit Islands further north. The name joins sirmi, \"ice\", to the suffix for an archipelago: \"islands of ice\". The islands are almost uninhabited and form, as a whole, the Sirmiuviit Ice Administration Zone of the Free State of Sirmivak, with only about 1,100 residents. The main island, Kiiquviq, about 57,000 km², is the second largest island in the territory; the Sirmikiiq Mountains run its length with an ice cap at each end: in the north the highest summit, Mount Kiiqrjuaq, 2,356 m, carries the Uviqsirmi Ice Cap, and in the south Mount Kiiqpirruk, 2,236 m, carries the Kiiqsirmi Ice Cap, and glaciers flow from the mountains straight into the sea. The other five islands are low islands of stone and snow, one a place where polar bears give birth, another hemmed in by floating ice all year.\nThe islands hold nothing but glaciers, ice cliffs and bergs; the occasional research team flies in, and they say it is so quiet \"you can hear your own heartbeat\". The Sirmiuviit Iceberg Station issues iceberg forecasts for the south-coast shipping lanes, and in summer cruise ships come to watch the ice cliffs calve. The Free State's rules apply here as everywhere: guides, hunters and prospectors who bring parties ashore must hold a permit from the Free State's parliament, and Sirmivak people say this icy wilderness \"belongs to everyone, but someone has to look after it\"."
  - id: nat_yfsb4k
    subtype: archipelago
    status: generated
    islands: [nat_gny1z0, nat_pjr6a4, nat_mwt1e8]
    names: { zh: 皮鲁库维特群岛, en: Pirrukuviit Islands, art-x-tavrunaq: Pirrukuviit }
    notes:
      zh: "皮鲁库维特群岛是领地最北的群岛，由皮鲁克尔尤阿克岛、普拉乌维克岛和贾利尤阿克岛组成，总面积约 13.9 万平方公里，是领地面积最大的群岛，群岛名意为「群峰之岛」。主岛皮鲁克尔尤阿克岛面积约 13.2 万平方公里，是领地最大的岛屿。全境是西尔米瓦克自由邦的皮鲁库维特生态保护区，常住的只有约 800 名巡护员、科研人员和登山营地的工作人员，只准持许可证的科考队和登山队进入。主岛的皮鲁克尔尤伊特山脉分为东、中、西三片山群，主峰卡拉克皮鲁克峰海拔 2917 米，是领地第二高峰；这里在北纬 80 度以北，雪线比大陆低三百米，中段山群埋在世界第二大的冰原卡拉克西尔米冰原之下，东段有贾利西尔米冰川，西段有帕卡西尔米冰川。两座附属岛一西一东：西端的普拉乌维克岛地势低缓，夏天散布着成千上万个融水小湖，是海鸟、北极雁和雪鸮的繁殖地，是一座鸟岛；东端的贾利尤阿克岛正对北冰洋吹来的风，地上几乎没有高过脚踝的植物，是一座风岛。\n群岛北面就是终年封冻的北冰洋。夏季的包机从西尔米卡尔维克起飞，降落在岛上的冰川跑道，要飞一个多小时才能看见山顶的冰原；登山营地只在永昼的几个月里开放，向导带队过冰川时要用绳子把人连成一串。冬天的极夜里，群岛上只剩保护站的几盏灯，巡护员说，那时整片群岛「只有风和北极狐醒着」。"
      en: "The Pirrukuviit Islands are the northernmost archipelago of the territory, made up of Pirrukrjuaq, Pullauviq and Jaalijuaq islands, about 139,000 km² in all, the largest archipelago in the territory; the name means \"islands of peaks\". The main island, Pirrukrjuaq, at about 132,000 km², is the largest island in the territory. All of it is the Pirrukuviit Nature Reserve of the Free State of Sirmivak, whose only residents are some 800 rangers, researchers and staff of the climbing camps, and only research and climbing parties with permits may enter. The Pirrukrjuit Mountains of the main island fall into eastern, central and western massifs, their summit Mount Kallaaqpirruk at 2,917 m the territory's second highest peak; north of 80°N the snowline lies 300 m lower than on the mainland, the central massif is buried under the Kallaaqsirmi Icefield, the second largest in the world, the eastern massif carries the Jaalisirmi Glacier and the western the Pakkasirmi Glacier. The two lesser islands lie one to the west and one to the east: Pullauviq in the west is low and gentle, scattered in summer with thousands of meltwater pools where seabirds, Arctic geese and snowy owls breed, an island of birds; Jaalijuaq in the east faces the wind off the Arctic Ocean, with almost no plant higher than an ankle, an island of wind.\nNorth of the islands lies the Arctic Ocean, frozen all year. The summer charters from Sirmiqarvik land on a glacier runway on the island and fly for more than an hour before the icefields on the summits come into view; the climbing camps open only in the months of the midnight sun, and guides rope their parties together in a line to cross the glaciers. In the polar night of winter only a few lamps at the ranger posts remain, and then, the rangers say, \"only the wind and the Arctic foxes are awake\"."
  - id: nat_bk19x1
    subtype: archipelago
    status: generated
    islands: [nat_ac00q9, nat_f63ac7]
    names: { zh: 伊卢克帕卡群岛, en: Illuqpakka Islands, art-x-tavrunaq: Illuqpakka }
    notes:
      zh: "伊卢克帕卡群岛是纳卢维特群岛以北海上的群岛，由帕卡尔尤阿克岛和伊卢克库卢克岛组成，总面积约 3.1 万平方公里，构成基卢克图阿尔原住民自治区最北的伊卢克帕卡区，群岛名意为「碎湖」。主岛帕卡尔尤阿克岛面积约 3 万平方公里，是领地第三大岛。岛上是冰川磨平的低矮岩盘，湖泊、水道和海湾交错，最高处不到 500 米，岸线被无数峡湾和水道切得支离破碎，除了数得出名字的大湖，区内还散布着上千个无名小湖。伊卢克帕卡区常住约 6000 人，塔夫鲁纳克语母语者占九成，居民散居在几个渔猎村里，靠捕鱼、狩猎和采矿为生，以湖鱼、驯鹿和海豹为主食，夏天有探矿队上岛。群岛没有公路，夏天乘船、冬天乘雪橇在湖与湖之间往来；南面隔着海峡是纳卢维特群岛，海峡每年秋天封冻后，雪橇就能一路跑到阿卡尼尔维克岛。\n从飞机上往下看，整片群岛像撒在海上的一把碎玻璃，阳光一照满眼都是反光。村里的老人说，祖先给每一个湖都起过名字，只是湖太多，名字传着传着就忘了一半，剩下的一半，要靠孩子们夏天一个湖一个湖地去重新认。村里的学校每年夏天办一次「认湖」比赛，谁记住的湖名最多，谁就能在冬天的婚礼上坐头一辆雪橇。"
      en: "The Illuqpakka Islands are an archipelago in the sea north of the Naalluviit Islands, made up of Pakkarjuaq Island and Illuqkuluk Isle, about 31,000 km² in all; they form the Illuqpakka District, the northernmost district of the Kiluktuar Indigenous Autonomous Region, and the name means \"broken lakes\". The main island, Pakkarjuaq, at about 30,000 km², is the third largest island in the territory. The islands are low bedrock planed by glaciers, a maze of lakes, channels and bays, under 500 m at their highest, with a coastline broken up by countless fjords and channels, and besides the larger lakes the district is scattered with more than a thousand small unnamed ones. Illuqpakka District has about 6,000 residents, nine in ten of them native Tavrunaq speakers, living scattered in a few fishing and hunting villages and making their living from fishing, hunting and mining, with lake fish, reindeer and seal as their staple food; prospecting parties come over in summer. There are no roads, and people travel between the lakes by boat in summer and by sled in winter; to the south across a strait lie the Naalluviit Islands, and once the strait freezes each autumn a sled can run all the way to Aqqanirvik Isle.\nFrom an aircraft the islands look like a handful of broken glass scattered on the sea, every piece flashing when the sun catches it. The village elders say their ancestors named every single lake, but there were so many that half the names were forgotten as they were handed down, and the other half the children must learn again each summer, one lake at a time. The village schools hold a \"lake-naming\" contest every summer, and whoever remembers the most lake names gets to ride in the first sled at the winter weddings."
  - id: nat_75d2jp
    subtype: archipelago
    status: generated
    islands: [nat_zrtk04, nat_6xq372, nat_6fra25, nat_wbttjv]
    names: { zh: 乌瓦卡鲁库维特群岛, en: Uvvaakkaruquviit Islands, art-x-tavrunaq: Uvvaakkaruquviit }
    notes:
      zh: "乌瓦卡鲁库维特群岛是领地东北远海的群岛，由乌瓦克岛、卡鲁克岛、图拉利克岛和普塔西尔米岛组成，总面积约 2.11 万平方公里，名字合塔夫鲁纳克语的「海象」（uvvaak）与「熊」（karuq）两词，全境是保护海象和北极熊的乌瓦卡鲁克生态保护区，属西尔米瓦克自由邦。保护区常住只有约 600 人，是全领地人口最少的区，几乎都是巡护员和科考人员。主岛乌瓦克岛面积约 9400 平方公里，海滩是海象的聚居地；卡鲁克岛是北极熊冬季筑窝产仔的地方；图拉利克岛海岸是陡立的冰崖；普塔西尔米岛在东端，冬春之际四周布满浮冰。群岛环抱的乌瓦克湾面积约 6100 平方公里，是领地最大的命名海湾，湾内冬季封冻，海冰是北极熊捕猎海豹的场所，夏季海象在湾岸的海滩上聚集，北极熊在浮冰和岛屿之间迁移。\n保护区只允许巡护员和获得许可的科考人员进入，游客只能乘船在外海远远观看，望远镜里常能同时看到海象和北极熊。乌瓦卡鲁库维特保护站的巡护员给常来海岸的北极熊编号建档，熟悉的几只还有外号；站房的门窗都加了钢栅，值班日志里专门有一栏写着「今日来访」。巡护员说，在这片群岛上，人才是客人，主人们一个长着獠牙，一个披着白毛。"
      en: "The Uvvaakkaruquviit Islands are an archipelago in the far north-eastern seas of the territory, made up of Uvvaak, Karuq, Turralik and Puttasirmi islands, about 21,100 km² in all. The name joins the Tavrunaq words for \"walrus\" (uvvaak) and \"bear\" (karuq), and the whole archipelago is the Uvvaakkaruq Nature Reserve, protecting walrus and polar bears, in the Free State of Sirmivak. The reserve has only about 600 residents, the fewest of any district in the territory, nearly all of them rangers and researchers. The main island, Uvvaak, about 9,400 km², has beaches where walrus gather; Karuq Island is where polar bears den and give birth in winter; Turralik Island is ringed by sheer ice cliffs; and Puttasirmi Island at the eastern end is surrounded by floating ice in winter and spring. Uvvaak Bay, embraced by the islands, covers about 6,100 km² and is the largest named bay in the territory; it freezes in winter, when the sea ice is the polar bears' hunting ground for seals, and in summer the walrus gather on its beaches while bears move between the floes and the islands.\nOnly rangers and licensed researchers may enter the reserve, and visitors can only watch from boats well offshore, where binoculars often show walrus and polar bears at the same time. The rangers of the Uvvaakkaruquviit Ranger Station number and keep files on the bears that come to the coast regularly, a few familiar ones even having nicknames; the station's doors and windows are barred with steel, and the duty log has a column headed \"today's visitors\". In these islands, the rangers say, people are the guests: one of the hosts has tusks and the other wears white fur."
  - id: nat_m6cr39
    subtype: archipelago
    status: generated
    islands: [nat_6y7y3n, nat_ps1ygb, nat_0mnzj7, nat_wrjnnn]
    names: { zh: 乌库乌维特群岛, en: Ukkuuviit Islands, art-x-tavrunaq: Ukkuuviit }
    notes:
      zh: "乌库乌维特群岛是领地最东端的群岛，由乌维克萨克岛、西卢奥库岛、基蒂利克岛和阿考库岛组成，总面积约 1.11 万平方公里，构成乌维克萨克市，全市 15.5 万人，在首府以东约 930 公里。群岛名由 ukku（矿）加上表示群岛的后缀构成，意为「矿之群岛」。主岛乌维克萨克岛最高 783 米，城区乌维克努卡区和机场都在岛上；南面的西卢奥库岛上是乌库乌维特露天矿，出产稀土，精矿由乌维克努卡港运出；西部的基蒂利克岛岩石含磁铁矿，最北的阿考库岛还在勘探中。群岛之间是乌库卡拉湾，往来乌维克努卡港的船只经湾内进出；乌维克努卡区城外的乌库马苏克海峡宽约 2 公里，是领地最窄的命名海峡。采矿、港口和制造业是全市的主业，第二产业占经济的四成多。\n群岛没有一条通往大陆的公路，本地人说「我们的高速公路是航线和海路」，补给船靠岸的日子在岛上像过节，超市门口排起长队抢购新鲜水果和牛奶。风暴一来，船和飞机都停，岛上的人就靠冻鱼、腌菜和自家烤的面包过日子，机场候机厅成了全市打牌聊天的地方。矿工来自领地各地，孩子们把矿上运出来的矿石叫作「彩色石头」。"
      en: "The Ukkuuviit Islands are the easternmost archipelago of the territory, made up of Uviqsaaq, Silluaukku, Qittilik and Aqqaukku islands, about 11,100 km² in all; they form Uviqsaaq City, with 155,000 people, about 930 km east of the capital. The name joins ukku, \"ore\", to the suffix for an archipelago: \"islands of ore\". The main island, Uviqsaaq, rises to 783 m and holds both the urban Uviqnuqa District and the airport; Silluaukku Island to the south has the Ukkuuviit Open Pit, producing rare earths whose concentrate is shipped out through Uviqnuqa; the rocks of Qittilik in the west contain magnetite; and Aqqaukku, the northernmost, is still being explored. Between the islands lies Ukkuqalla Bay, through which ships come and go from Uviqnuqa, and outside the town the Ukkumasuq Strait, about 2 km wide, is the narrowest named strait in the territory. Mining, the port and manufacturing are the city's mainstays, with industry making up over two-fifths of the economy.\nThere is not a single road to the mainland, and locals say \"our motorways are the flight paths and the sea lanes\"; the day the supply ship berths is like a festival, with long queues outside the supermarket for fresh fruit and milk. When a storm blows in, ships and planes stop alike, and islanders get by on frozen fish, pickles and home-baked bread, while the airport lounge becomes the city's place for cards and gossip. The miners come from all over the territory, and the children call the ore from the mine \"coloured stones\"."
  - id: nat_vpay49
    subtype: archipelago
    status: generated
    islands: [nat_vv2c47, nat_95v2tq, nat_y023md]
    names: { zh: 卡瓦卢维特群岛, en: Qavvaluviit Islands, art-x-tavrunaq: Qavvaluviit }
    notes:
      zh: "卡瓦卢维特群岛是乌库拉克市东南海上的群岛，由卡瓦卢格尤阿克岛、温纳塔克岛和库拉克岛组成，总面积约 1.47 万平方公里，构成乌库拉克市的卡瓦卢维特区，常住 8.4 万人，以观赏极光的旅游业闻名，旅游和邮轮业占经济的大半。群岛的名字在塔夫鲁纳克语里就是「极光群岛」。主岛卡瓦卢格尤阿克岛面积约 1.12 万平方公里，是领地第四大岛，地势低平，岛上散布着卡瓦卢维特观光度假村的玻璃屋顶客房；东边的温纳塔克岛是群岛最高的岛，有看极光的小屋和步道；两岛之间的库拉克岛名字来自极光常见的绿色光带，岛上没有灯。冬季极光常在西北侧的卡瓦卢卡拉湾和岛屿之间宽约 3 公里的卡瓦卢马苏克海峡上空出现，北面大陆上的卡瓦昆纳尔岬也是观赏的去处，在那里能看着极光从群岛上空升起。\n冬夜里游船沿海峡夜航，船长熄掉所有灯光慢慢行驶，乘客躺在甲板的毯子里看头顶的极光，船上只听得见水声。度假村给每位客人一个「极光闹钟」，极光一出现就挨个打电话叫醒客人。岛上人家的孩子从小看惯了极光，反倒是外地来的游客教会了他们一件事：原来极光是值得半夜爬起来的。"
      en: "The Qavvaluviit Islands are an archipelago in the sea south-east of Ukkulaaq City, made up of Qavvalugjuaq Island, Unnataq Island and Qurrak Isle, about 14,700 km² in all; they form the Qavvaluviit District of Ukkulaaq City, with 84,000 residents, and are known for aurora tourism, with tourism and cruises making up more than half the economy. In Tavrunaq the name simply means \"aurora islands\". The main island, Qavvalugjuaq, about 11,200 km², is the fourth largest island in the territory, low and flat, and the glass-roofed rooms of the Qavvaluviit Lodge are scattered across it; Unnataq Island to the east is the highest island of the group, with aurora-watching huts and trails; and Qurrak Isle between them is named after the green bands the aurora so often shows, and has no lights at all. In winter the aurora often appears over Qavvaluqalla Bay on the north-west side and over the Qavvalumasuq Strait, about 3 km wide, between the islands, and Qavvakunnar Point on the mainland to the north is another place to watch it, where you can see the lights rise over the islands.\nOn winter nights tour boats sail the strait with every light put out, moving slowly while passengers lie wrapped in blankets on deck watching the aurora overhead, with nothing to hear but the water. The lodge gives every guest an \"aurora alarm\" and rings round to wake them all the moment the lights appear. Island children grow up so used to the aurora that it was the visitors who taught them something: that the aurora is worth getting up in the middle of the night for."
