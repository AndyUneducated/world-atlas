# Coastal landforms of the Arctic Ocean Territory: islands and their archipelagos, bays, fjords, capes
# and straits. The generator finds them in the coastline (pipeline/atlas/coast.py); each entry names the
# landform of `detect.kind` nearest to `detect.at_km` (design km, x east, y north). An archipelago is
# the named islands it lists. Unnamed landforms are listed in .cache/candidates-div_hpmerr.json after a build.
features:
  # ── 陶武维特群岛 ────────────────────────────────────────────
  - id: nat_dppqz7
    subtype: island
    status: generated
    detect: { kind: island, at_km: [55, 317] }
    names: { zh: 陶瓦克岛, en: Tauvvaq Island, art-x-tavrunaq: Tauvvaq }
    notes:
      zh: "陶瓦克岛是陶武维特群岛的主岛，在图利瓦克市以北的远海上，面积约 7400 平方公里，在领地的岛屿中排第七，属图利瓦克市陶武维特区。全岛地势低缓，平均海拔一百米上下，最高处也只有两百多米，地表是被冰川磨圆的岩丘和铺满苔藓、地衣的冻土苔原，夏天融雪在低洼处积成一片片浅水洼。岛名取自塔夫鲁纳克语的 tauvvu，意为「天」。岛上空旷开阔、少有遮挡，陶武维特地面站的天线阵就建在这里：极轨卫星每一圈都经过高纬度上空，地面站一天要跟踪接收几十次过境的卫星数据，再转发到图卡鲁维特群岛。岛上的居民大多是地面站的工程师、值班员和他们的家属，补给靠夏季的船和常年往返的小飞机。\n岛上的天线阵在雪原上排成整齐的白色圆盘，极夜里只有天线座上的红色警示灯一明一灭，从海上望去像一片会呼吸的星星。地面站的值班员有个老习惯，每有卫星飞过头顶就在黑板上画一道，一年下来黑板要擦好几百次；新来的人头一个月的功课，就是学会在十几秒内认出天上正在过境的是哪一颗卫星。北极狐常在天线底座下面躲风，值班员给其中几只起了卫星的名字，谁起名的狐狸先在雪地里露面，谁就请大家喝咖啡。"
      en: "Tauvvaq Island is the main island of the Tauvvuviit Islands, in the open sea north of Tullivaq City. At about 7,400 km² it is the seventh largest island in the territory, and it belongs to the Tauvvuviit District of Tullivaq City. The whole island is low and gentle, averaging around 100 m and rising to only a little over 200 m; its surface is glacier-rounded rock knolls and permafrost tundra carpeted with moss and lichen, and in summer the meltwater gathers in sheets of shallow pools in the hollows. The name comes from the Tavrunaq word tauvvu, \"sky\". Its open, unobstructed ground is home to the antenna arrays of the Tauvvuviit Ground Station: polar-orbiting satellites cross the high latitudes on every orbit, and the station tracks dozens of passes a day, relaying the data on to the Tukkaruviit Islands. Most of the islanders are the station's engineers and duty staff and their families, supplied by ship in summer and by small aircraft all year round.\nThe dishes stand in neat white rows on the snowfield, and in the polar night only the red warning lights on their mounts blink on and off, so that from the sea they look like a field of breathing stars. The duty staff have an old habit of chalking a stroke on a blackboard for every satellite overhead, wiping the board hundreds of times a year; a newcomer's homework for the first month is learning to tell, within a dozen seconds or so, which satellite is passing overhead. Arctic foxes shelter from the wind under the antenna mounts, and the staff have named several of them after satellites: whoever's fox shows itself first on the snow buys everyone coffee."
  - id: nat_rhderc
    subtype: island
    status: generated
    detect: { kind: island, at_km: [100, 326] }
    names: { zh: 萨卡利特岛, en: Saqqaliit Isle, art-x-tavrunaq: Saqqaliit }
    notes:
      zh: "萨卡利特岛是陶武维特群岛的小岛，在主岛陶瓦克岛以东的海上，面积约 340 平方公里，是领地最小的命名岛屿，最高处海拔约一百米，平均不到六十米，整座岛像一块平摊在海面上的灰色石板。岛名来自塔夫鲁纳克语的 saqqa，意为天线盘：岛上的天线为陶瓦克岛上的陶武维特地面站接力，把卫星信号补到主岛天线顾不到的那一段天空。岛上没有村落，只有几座天线和一间维护小屋。冬季四周海面封冻，夏季冰化后浮冰在岛边挤来挤去，船只靠岸要看准时机。岛的四周是浅滩，海豹常在退潮后的礁石上晒太阳，夏天也有绒鸭和北极燕鸥在碎石滩上筑巢。\n维护人员乘船上岛，检修完天线当天就走，可一旦起了风暴，就只能在小屋里多住几天。小屋的墙上贴满了历次「滞留」的日期，最长的一次有十一天，旁边有人用铅笔补了一句「罐头吃完了，海豹还在」。小屋的书架上摆着历任维护员带来又没带走的书，规矩是拿走一本就得留下一本，久而久之成了群岛上最小的图书馆。地面站的人说，萨卡利特岛虽小，却是陶武维特群岛的「另一只耳朵」，少了它，天上就有一段话听不见了。"
      en: "Saqqaliit Isle is the small island of the Tauvvuviit Islands, in the sea east of the main island, Tauvvaq. At about 340 km² it is the smallest named island in the territory; it rises to about 100 m and averages under 60 m, so the whole island lies on the sea like a flat grey slab. The name comes from the Tavrunaq saqqa, \"antenna dish\": the antennas here relay for the Tauvvuviit Ground Station on Tauvvaq Island, covering the stretch of sky the main island's dishes cannot reach. There is no village, only a few antennas and a maintenance hut. In winter the surrounding sea freezes; in summer, once the ice breaks up, floes jostle along the shore and boats must pick their moment to land. Shoals ring the island, seals bask on the rocks at low tide, and in summer eiders and Arctic terns nest on the shingle beaches.\nThe technicians come out by boat and usually leave the same day once the antennas are serviced, but when a storm blows up they have no choice but to stay on in the hut. Its wall is covered with the dates of past \"strandings\", the longest of them eleven days, beside which someone has pencilled \"the tins have run out, the seals are still here\". The hut's shelf holds books that past technicians brought and never took home, and the rule is that you may take one only if you leave one, so over the years it has become the smallest library in the islands. The station staff say that small as it is, Saqqaliit is the Tauvvuviit Islands' \"other ear\": without it, part of what the sky says would go unheard."

  # ── 皮图库维特群岛 ────────────────────────────────────────────
  - id: nat_b1fv64
    subtype: island
    status: generated
    detect: { kind: island, at_km: [184, 279] }
    names: { zh: 皮图克尤阿克岛, en: Pitukjuaq Island, art-x-tavrunaq: Pitukjuaq }
    notes:
      zh: "皮图克尤阿克岛是皮图库维特群岛的主岛，在北岸外海，面积一万零四百多平方公里，是领地第五大岛，属塔夫鲁利特原住民自治区皮图库维特区。岛上地势起伏不大，最高处海拔三百七十多米，平均一百五十米上下，内陆是缓缓起伏的苔原和散落的湖塘，海岸曲折，多礁石和浅湾。东南隔着宽约 5 公里的皮图克马苏克海峡与瑙卡克岛相望，冬季海峡封冻后就是猎人乘雪橇往来的冰上通道；群岛西南端的皮图昆纳尔岬是出海的地标。岛的海岸是塔夫鲁利特人传统的海豹与海象猎场，海边岩石上留有皮图库维特岩雕，刻着鲸、海豹和皮划艇。皮图库维特区的 8.3 万居民大多住在这座岛的海岸村镇里。\n塔夫鲁利特猎人至今在这里按季节狩猎，春天在冰缘守着海豹的呼吸孔，夏秋换成小船追海象，猎获按老规矩分给全村，先给老人和失去依靠的人家，猎手自己留最后一份。岩雕有的只在退潮时露出水面，向导会掐着潮汐表带人来看；岩雕禁止拓印和触摸，孩子们在文化中心里用复制品学着描画祖先刻下的图案。岛上的老人说，岩雕上的皮划艇和今天孩子们划的船一模一样，「祖先早就把船的样子画好了，我们只是照着做」。"
      en: "Pitukjuaq Island is the main island of the Pitukuviit Islands, off the north coast. At a little over 10,400 km² it is the fifth largest island in the territory, and it belongs to the Pitukuviit District of the Tavrulit Indigenous Autonomous Region. Its ground is gently rolling, rising to a little over 370 m and averaging around 150 m; the interior is undulating tundra scattered with lakes and ponds, and the coast is indented, full of rocks and shallow bays. To the south-east it faces Naukkaq Island across the Pitukmasuq Strait, about 5 km wide, which becomes an ice road for hunters' sleds once it freezes in winter; Cape Pitukkunnar at the south-western tip of the archipelago is the landmark for putting out to sea. The island's coasts are the traditional seal and walrus hunting grounds of the Tavrulit, and rocks by the shore carry the Pitukuviit Rock Carvings of whales, seals and kayaks. Most of the 83,000 people of Pitukuviit District live in the island's coastal villages and towns.\nTavrulit hunters still hunt here by the seasons, waiting at the ice edge by the seals' breathing holes in spring and chasing walrus in small boats in summer and autumn, and the catch is shared with the whole village by old custom: first to the elderly and to households with no one to provide for them, with the hunter's own share taken last. Some of the carvings show only at low tide, so guides bring visitors by the tide table; rubbing and touching are forbidden, and children learn to draw their ancestors' figures from replicas at the cultural centre. The island's elders say the kayaks in the carvings are exactly like the boats children paddle today: \"our ancestors drew the boat long ago, and we just build it the way they drew it\"."
  - id: nat_dstxyg
    subtype: island
    status: generated
    detect: { kind: island, at_km: [205, 263] }
    names: { zh: 瑙卡克岛, en: Naukkaq Island, art-x-tavrunaq: Naukkaq }
    notes:
      zh: "瑙卡克岛是皮图库维特群岛的第二大岛，面积一千一百多平方公里，在主岛皮图克尤阿克岛东南，隔着宽约 5 公里的皮图克马苏克海峡，属塔夫鲁利特原住民自治区皮图库维特区。岛上地势低平，最高处海拔一百六十米，平均不到八十米，大片是潮湿的苔原和浅湖，海岸平缓，退潮后露出宽阔的砾石滩。岛名来自塔夫鲁利特猎人用来猎海豹的鱼叉。冬季海峡封冻后，两岛之间的冰面成了雪橇道，猎人从主岛的村子赶着雪橇过来，在岛边的冰上守候海豹；夏天冰化后则换成小船。岛的北岸正对着开阔的外海，冬天的北风常把海冰推上砾石滩，堆成一道道冰脊。岛上没有村子，只有几处在狩猎季才住人的石头小屋，屋外的木架上常年挂着晾干的海豹皮。\n老猎人说，岛的形状就像一支斜放在海上的鱼叉，从皮图克尤阿克岛的高处看最清楚，像是随时准备出手。塔夫鲁利特的孩子第一次跟着大人上岛，长辈会让他在岛的「叉尖」上找一块石头带回家，说这样以后打猎手才稳。夏天岛上的浅湖里挤满了北极雁和绒鸭，猎人们按规矩只在岛的西岸捡蛋，东岸留给鸟儿安心孵化，这条不成文的约定，比岛上任何一座石堆路标都老。"
      en: "Naukkaq Island is the second island of the Pitukuviit Islands, a little over 1,100 km², lying south-east of the main island, Pitukjuaq, across the Pitukmasuq Strait, about 5 km wide; it belongs to the Pitukuviit District of the Tavrulit Indigenous Autonomous Region. The island is low and flat, rising to 160 m and averaging under 80 m, mostly damp tundra and shallow lakes, with a gentle shore that uncovers wide gravel beaches at low tide. It is named after the harpoon Tavrulit hunters use for seals. When the strait freezes in winter the ice between the two islands becomes a sled road, and hunters drive their teams over from the villages on the main island to wait for seals on the ice off its shore; once the ice melts in summer they come by small boat instead. The north shore faces the open sea, and in winter the north wind drives the sea ice up onto the gravel beaches in ridge after ridge. There is no village, only a few stone huts lived in during the hunting season, with drying sealskins hanging on the wooden racks outside all year.\nOld hunters say the island is shaped like a harpoon laid slantwise on the sea, best seen from the high ground of Pitukjuaq, as if poised to strike. When a Tavrulit child first comes to the island with the adults, the elders have them pick up a stone from the harpoon's \"tip\" to take home, so that their aim will be steady when they hunt. In summer the island's shallow lakes are crowded with geese and eiders, and by custom the hunters gather eggs only on the west shore, leaving the east shore for the birds to brood in peace; that unwritten agreement is older than any cairn on the island."

  # ── 纳卢维特群岛 ────────────────────────────────────────────
  - id: nat_5hdtr2
    subtype: island
    status: generated
    detect: { kind: island, at_km: [323, 311] }
    names: { zh: 纳卢尤阿克岛, en: Naallujuaq Island, art-x-tavrunaq: Naallujuaq }
    notes:
      zh: "纳卢尤阿克岛是纳卢维特群岛的主岛，在北岸外海，面积七千一百多平方公里，在领地的岛屿中排第八，属基卢克图阿尔原住民自治区纳卢维特区。岛上是起伏的高地，平均海拔两百多米，最高处五百六十多米，海岸多陡坎和小海湾，内陆的冻土上散布着融冻丘和多边形的冻土纹。岛名由塔夫鲁纳克语的 naallu（考察）加上表示「大」的后缀构成，北冰洋极地研究所就设在岛上，研究海冰、冻土与北极生态，岛上的浮标站和观测塔常年记录海冰与洋流，每年夏季从这里派出科考船。岛的东北岸隔海望着普塔克岛，研究所的小艇夏天常在两岛之间往返。纳卢维特区常住约 1.1 万人，多为科研人员和他们的家属，岛上的学校、医务室和商店都围着研究所建起来。\n科考船夏天出发时，研究所的人站在码头上敲一阵皮鼓送行，船上的人则把一面印着研究所徽章的小旗挂上桅杆，直到秋天回港才取下。船走后的几个月，岛上剩下的人轮流守着观测塔和冻土钻孔，晚上在食堂里对着卫星电话听船上的消息。研究员的孩子们从小在冻土剖面前做作业，能说出好几种海冰的塔夫鲁纳克语名字；岛上流传一句玩笑：在纳卢尤阿克岛，连狗都知道海冰有几种。"
      en: "Naallujuaq Island is the main island of the Naalluviit Islands, off the north coast. At a little over 7,100 km² it is the eighth largest island in the territory, and it belongs to the Naalluviit District of the Kiluktuar Indigenous Autonomous Region. The island is rolling upland averaging over 200 m and rising to a little over 560 m, with a coast of steep banks and small coves and an interior of permafrost scattered with frost mounds and polygonal ground. The name joins the Tavrunaq naallu, \"research\", to the suffix for \"great\", and the Arctic Ocean Polar Research Institute stands here, studying sea ice, permafrost and Arctic ecology; the island's buoy station and observation towers record the sea ice and currents all year, and research ships set out from here every summer. Its north-eastern shore looks across the water to Puttaq Isle, and in summer the institute's launches shuttle between the two islands. Naalluviit District has about 11,000 residents, mostly researchers and their families, and the island's school, clinic and shops have grown up around the institute.\nWhen the research ship sails in summer, the institute's staff see it off from the quay with a burst of skin drums, and those aboard hoist a small flag bearing the institute's badge to the mast, not to come down until they return in autumn. In the months after the ship has gone, those left behind take turns minding the observation towers and permafrost boreholes, and in the evenings they gather in the canteen to hear news from the ship over the satellite phone. Researchers' children do their homework in front of permafrost sections and can name several kinds of sea ice in Tavrunaq; the island joke goes that on Naallujuaq even the dogs know how many kinds of sea ice there are."
  - id: nat_r5e7sa
    subtype: island
    status: generated
    detect: { kind: island, at_km: [357, 324] }
    names: { zh: 普塔克岛, en: Puttaq Isle, art-x-tavrunaq: Puttaq }
    notes:
      zh: "普塔克岛是纳卢维特群岛东部的小岛，在主岛纳卢尤阿克岛东北的海上，面积约 890 平方公里，属基卢克图阿尔原住民自治区纳卢维特区。岛虽小却不矮，最高处海拔四百六十米，平均两百多米，四面多是陡峭的海崖，只有西南岸有一处能停船的小湾。北冰洋极地研究所在周围海域布放的海洋浮标由这里维护，岛名由此而来：浮标测量海冰厚度、水温和洋流，数据经卫星发回纳卢尤阿克岛。岛上只有维护站的几间屋子、一座小码头和堆放浮标的仓库，维护人员夏天常驻，冬天海面封冻后撤回主岛，整座岛只剩自动气象站在工作，风大的夜里，主岛上的人能从数据里「听见」普塔克岛在刮多大的风。海崖上栖息着成群的海鸦和三趾鸥，夏天崖下的海面上常有海象和环斑海豹出没。\n浮标每年秋天回收一次，维护人员说，浮标上挂满的海藻和贝壳，是它们在海上过了一年的「履历」。回收的浮标在仓库前排成一排，大家会先比一比谁身上的「履历」最厚，再拆开读数据。有一年一只浮标被冰挤断了缆绳，在海上漂了一整年，第二年秋天竟然自己漂回了普塔克岛附近，维护站给它起了个外号叫「回家的那只」，至今还摆在仓库门口。"
      en: "Puttaq Isle is a small island in the east of the Naalluviit Islands, in the sea north-east of the main island, Naallujuaq. It covers about 890 km² and belongs to the Naalluviit District of the Kiluktuar Indigenous Autonomous Region. Small as it is, it is not low: it rises to 460 m and averages over 200 m, ringed mostly by steep sea cliffs, with only one small cove on the south-west shore where boats can put in. The ocean buoys that the Arctic Ocean Polar Research Institute moors in the surrounding waters are serviced from here, hence the name; they measure ice thickness, water temperature and currents and send their data by satellite back to Naallujuaq. The isle has only the service station's few buildings, a small jetty and a store for the buoys; the technicians live here in summer and withdraw to the main island once the sea freezes in winter, leaving only the automatic weather station at work; on stormy nights the people on the main island can \"hear\" from the data how hard the wind is blowing on Puttaq. Colonies of guillemots and kittiwakes nest on the cliffs, and in summer walrus and ringed seals are often seen in the water below.\nThe buoys are recovered once every autumn, and the technicians say the weed and shells hanging from them are \"the record of their year at sea\". The recovered buoys are lined up in front of the store, and everyone first compares whose \"record\" is thickest before opening them up to read the data. One year a buoy had its mooring snapped by the ice and drifted for a whole year, only to float back near Puttaq Isle the next autumn of its own accord; the station nicknamed it \"the one that came home\", and it still stands by the store door."
  - id: nat_2vhfdf
    subtype: island
    status: generated
    detect: { kind: island, at_km: [278, 347] }
    names: { zh: 阿卡尼尔维克岛, en: Aqqanirvik Isle, art-x-tavrunaq: Aqqanirvik }
    notes:
      zh: "阿卡尼尔维克岛是纳卢维特群岛最北的小岛，面积约 590 平方公里，属基卢克图阿尔原住民自治区纳卢维特区，隔着海峡北望伊卢克帕卡群岛。岛上地势低缓，最高处两百五十多米，平均一百二十米上下，地表是碎石坡和稀疏的苔原，海岸多砾石滩，冬天被海冰团团围住，夏天冰化后才露出灰黑色的岸线。岛上设有观测海冰的站点，几间低矮的站屋围着一座观测塔，北冰洋极地研究所的观测员轮班驻守，记录海冰的生成、漂移和融化，数据与纳卢尤阿克岛上的浮标站和观测塔汇总在一起。每年秋天，北面的海峡从这里开始封冻，冻结的消息会在第一时间传到群岛各处。站屋旁立着一根刻满刻度的木杆，观测员每天用它量一次岸边冰的厚度。\n站里的观测员管自己叫「看门人」：哪天海峡冻上了，伊卢克帕卡的雪橇就该来了。封冻后的头几个星期，对岸的猎人和渔民赶着雪橇过海，常在站屋前歇脚，喝一杯热茶，顺便问问冰面哪里结实；观测员也乐意拿最新的冰图给他们看，换来一条冻鱼或几句塔夫鲁纳克语的冰情俗语。冬天站屋的窗户上常常结着一层厚厚的冰花，观测员说，屋里的人每天第一件事是刮窗户，第二件事才是看海。"
      en: "Aqqanirvik Isle is the northernmost of the Naalluviit Islands, about 590 km², in the Naalluviit District of the Kiluktuar Indigenous Autonomous Region, looking north across a strait to the Illuqpakka Islands. It is low and gentle, rising to a little over 250 m and averaging around 120 m, with scree slopes and sparse tundra and a shore of gravel beaches; in winter the sea ice closes all round it, and only when the ice breaks up in summer does the grey-black shoreline appear. The isle has a sea-ice observation post, a few low huts around an observation tower, where observers of the Arctic Ocean Polar Research Institute keep watch in shifts, recording how the ice forms, drifts and melts; their data is pooled with that of the buoy station and observation towers on Naallujuaq Island. Every autumn the strait to the north begins to freeze from here, and the news is passed round the islands at once. Beside the huts stands a wooden pole marked with a scale, against which the observers measure the thickness of the shore ice every day.\nThe observers call themselves \"the gatekeepers\": the day the strait freezes over, the sleds from Illuqpakka will be on their way. In the first weeks after the freeze, hunters and fishermen from across the strait drive their sleds over and often stop at the huts for a cup of hot tea and a word on where the ice is sound; the observers are happy to show them the latest ice charts in return for a frozen fish or a few Tavrunaq sayings about the ice. In winter the hut windows are often coated with thick frost flowers, and the observers say the first job of the day is scraping the windows; looking at the sea comes second."

  # ── 西尔米乌维特群岛 ────────────────────────────────────────────
  - id: nat_99nd2b
    subtype: island
    status: generated
    detect: { kind: island, at_km: [452.2, 326.8] }
    names: { zh: 基库维克岛, en: Kiiquviq Island, art-x-tavrunaq: Kiiquviq }
    notes:
      zh: "基库维克岛是西尔米乌维特群岛的主岛，面积约 5.7 万平方公里，是领地第二大岛，仅次于皮鲁克尔尤阿克岛，属西尔米瓦克自由邦西尔米乌维特冰盖管理区。西尔米基克山纵贯全岛，北段的主峰基克尔尤阿克峰海拔 2356 米，是群岛的最高峰，顶上是面积约 6000 平方公里的乌维克西尔米冰帽；南段的基克皮鲁克峰海拔 2236 米，顶上是略小的基克西尔米冰帽。全岛的平均海拔也有六百多米，冰川从冰帽边缘顺着山谷流下，直入大海，入海处的冰崖有几十米高。岛名里的 kiiq 意为獠牙，指的就是从冰面上露出的尖峭山峰。岛上没有常住居民，只有西尔米乌维特冰山观测站的值守人员，他们观测冰川入海与冰山漂移，为南岸航线发布冰山预报。\n冰川从山上流进海里，夏天冰崖崩落的轰鸣声隔着海峡都能听见，路过的船只总会放慢速度远远地看一会儿；夏季有邮轮专程开来，乘客们站在甲板上等冰崖「开口」，等上半天也心甘情愿。大冰山一旦从冰川上分离，观测站就给它编号建档，一直追踪到它化掉为止。冰山预报每天随天气预报一起播出，南岸的渔民和船长听完才决定航线，他们说基库维克岛是「冰山的老家」，每年都有新的孩子离家出海。"
      en: "Kiiquviq Island is the main island of the Sirmiuviit Islands. At about 57,000 km² it is the second largest island in the territory after Pirrukrjuaq Island, and it belongs to the Sirmiuviit Ice Administration Zone of the Free State of Sirmivak. The Sirmikiiq Mountains run the length of the island. In the north their highest summit, Mount Kiiqrjuaq, 2,356 m and the highest point of the archipelago, is capped by the Uviqsirmi Ice Cap of about 6,000 km²; in the south Mount Kiiqpirruk, 2,236 m, is capped by the slightly smaller Kiiqsirmi Ice Cap. Even averaged over the whole island the land stands over 600 m, and glaciers flow from the edges of the caps down the valleys and straight into the sea, ending in ice cliffs tens of metres high. The kiiq in the island's name means \"fang\", for the sharp peaks that jut from the ice. The island has no permanent residents, only the staff on duty at the Sirmiuviit Iceberg Station, who watch the glaciers calve and the icebergs drift and issue iceberg forecasts for the south-coast shipping lanes.\nIts glaciers flow from the mountains into the sea, the roar of the ice cliffs collapsing in summer carries across the straits, and passing ships always slow down to watch from a distance; in summer cruise ships come specially, their passengers standing on deck waiting for a cliff to \"open its mouth\" and happy to wait half a day for it. As soon as a large berg breaks from a glacier the station gives it a number and a file and tracks it until it melts away. The iceberg forecast goes out every day with the weather forecast, and fishermen and captains on the south coast listen before deciding their course; they call Kiiquviq \"the icebergs' old home\", from which new children leave for the sea every year."
  - id: nat_b3kk8p
    subtype: island
    status: generated
    detect: { kind: island, at_km: [520, 301] }
    names: { zh: 基库利克岛, en: Kiqqulik Island, art-x-tavrunaq: Kiqqulik }
    notes:
      zh: "基库利克岛在基库维克岛以东，面积约 2200 平方公里，是西尔米乌维特群岛的第三大岛，属西尔米瓦克自由邦西尔米乌维特冰盖管理区。岛上是起伏的低山和碎石高地，最高处海拔三百五十多米，平均一百五十米上下，海岸曲折，多浅湾和沙洲，岸外的海底平缓，水深不大。基库维克岛冰川入海崩落的冰山顺着洋流向东漂，常在这座岛附近漂过，岛名由此而来。岛上没有居民，西尔米乌维特冰山观测站的人员夏天会乘船来，在岛的高处架起相机，记录冰山漂过的路线和速度，这些数据也写进每天播出的冰山预报。浅滩上的冰山搁浅后慢慢融化，融水让近岸的海水格外清冷，引来成群的北极鳕和追逐它们的海豹。\n冰山漂过时常在岛边搁浅，有的一搁就是一整个夏天，岛周围的海面因此像一座不断变换的冰雕展：今天是一座城堡，下个星期塌成一只卧着的熊，再过几天又被浪削成一艘船。观测站的人给搁浅的大冰山起名字，记在本子上，秋天再记下它们各自「走」了没有。夏天来观赏冰山的邮轮也爱在这里多停一会儿，船员们会指着岸边的冰山说，这些都是基库维克岛的「老住客」，只是从来不交房租。"
      en: "Kiqqulik Island lies east of Kiiquviq Island. At about 2,200 km² it is the third island of the Sirmiuviit Islands, and it belongs to the Sirmiuviit Ice Administration Zone of the Free State of Sirmivak. It is rolling low hills and stony upland rising to a little over 350 m and averaging around 150 m, with an indented coast of shallow bays and sandbars and a gently shelving, shallow seabed offshore. Icebergs calved where Kiiquviq Island's glaciers meet the sea drift east on the current and often pass close by, hence the island's name. Nobody lives here, but staff from the Sirmiuviit Iceberg Station come by boat in summer and set up cameras on the high ground to record the routes and speeds of the passing bergs, data that also goes into the daily iceberg forecast. Bergs that run aground on the shoals melt slowly, their meltwater keeping the inshore water especially cold and clear, which draws shoals of polar cod and the seals that hunt them.\nPassing icebergs often run aground off the island, some staying a whole summer, so that the sea around it is like an ever-changing exhibition of ice sculpture: a castle today, slumped into a sleeping bear the next week, then carved by the waves into a ship a few days later. The station staff name the big stranded bergs and write them in a notebook, and in autumn note down whether each has \"moved out\". The cruise ships that come to see the icebergs in summer like to linger here too, and the crews point at the bergs along the shore and call them Kiiquviq's \"old lodgers\", who never pay any rent."
  - id: nat_tfkcz1
    subtype: island
    status: generated
    detect: { kind: island, at_km: [570, 318] }
    names: { zh: 西尔米奥拉岛, en: Sirmiaulla Island, art-x-tavrunaq: Sirmiaulla }
    notes:
      zh: "西尔米奥拉岛是西尔米乌维特群岛东端的小岛，面积约 980 平方公里，属西尔米瓦克自由邦西尔米乌维特冰盖管理区。岛上是一片低矮的台地，最高处海拔三百二十多米，平均一百六十米上下，台地边缘是碎石坡和低矮的海崖，岸边的砾石滩上常年堆着被风浪推上来的冰块。周围海面常年漂着浮冰，夏天也不会完全化开，岛名由塔夫鲁纳克语的 sirmi（冰）构成，就是因此得名。岛上没有居民，也不通航线，只有西尔米乌维特冰山观测站的人员偶尔乘直升机来，检查架在岛上的自动相机和气象仪，顺便清点一下岸边的海豹和海象。岛的东面再往外就是开阔的海冰，冬天整座岛和群岛其他岛屿一起被冻在冰里。\n浮冰之间常有海豹爬上冰面晒太阳，冰山观测站的工作人员说这是「浮冰上的沙滩」。晴朗的夏日，一块浮冰上能挤着十几只海豹，彼此隔着一身的距离，一有动静就齐刷刷地扭头去看。偶尔也有北极熊悄悄趴在浮冰边上守候，观测员从相机里看到这一幕，会在日志里写一句「沙滩今天有不速之客」。他们说，岛上的季节不按日历走，看海豹在冰上待了多久就知道了。"
      en: "Sirmiaulla Island is a small island at the eastern end of the Sirmiuviit Islands, about 980 km², in the Sirmiuviit Ice Administration Zone of the Free State of Sirmivak. It is a low tableland rising to a little over 320 m and averaging around 160 m, edged by scree slopes and low sea cliffs, with blocks of ice pushed up by wind and waves lying on its gravel beaches all year. The surrounding sea is strewn with floating ice that never entirely clears even in summer, and the name, built on the Tavrunaq sirmi, \"ice\", comes from that. Nobody lives here and no shipping route calls; only staff from the Sirmiuviit Iceberg Station occasionally fly in by helicopter to check the automatic cameras and weather instruments set up on the island, counting the seals and walrus along the shore while they are at it. East of the island lies open sea ice, and in winter the whole island is frozen into the ice together with the rest of the archipelago.\nSeals often haul out to bask on the floes, and the iceberg station staff call them \"beaches on the ice\". On a clear summer day a dozen or more seals crowd onto a single floe, each a body's length from the next, and at the slightest disturbance they all turn their heads together to look. Sometimes a polar bear lies in wait at the edge of a floe, and when the observers see it on camera they write in the log, \"uninvited guest on the beach today\". They say the island's seasons do not follow the calendar: you can tell them by how long the seals stay on the ice."
  - id: nat_sr3rmn
    subtype: island
    status: generated
    detect: { kind: island, at_km: [540.2, 360.8] }
    names: { zh: 帕利乌维克岛, en: Paaliuviq Island, art-x-tavrunaq: Paaliuviq }
    notes:
      zh: "帕利乌维克岛在基库维克岛东北的海上，面积约 2500 平方公里，是西尔米乌维特群岛的第二大岛，属西尔米瓦克自由邦西尔米乌维特冰盖管理区。岛上是一片低缓的山地，最高处海拔两百五十多米，平均一百二十米左右，山坡平缓，谷地里积着厚厚的雪，到了盛夏也只融掉向阳的一面。岛上的低山一年里大半时间盖着积雪，从海上望去整座岛一片白，岛名由塔夫鲁纳克语的 paali（白）和 uviq（岛）合成，意为「白岛」。岛上没有居民，也不设任何长期设施，只有几根标示巡护路线的木杆和一间应急小屋。四周的海面冬季封冻，与基库维克岛之间的海冰一直连到春末。\n春天海冰还没化开时，北极熊沿着冰面从基库维克岛走过来，在岛的南岸挖洞产仔，巡护员每年乘直升机来数一次雪洞。雪洞的入口只有脸盆大小，藏在背风的雪坡上，从空中看只是一个个小黑点，巡护员要贴着舷窗一个一个地数，回去再和往年的记录对照。母熊带着幼崽出洞的那几天，巡护员会远远守在海冰上，看小熊第一次跌跌撞撞地走下雪坡；他们说，帕利乌维克岛是群岛上「最安静的产房」。"
      en: "Paaliuviq Island lies in the sea north-east of Kiiquviq Island. At about 2,500 km² it is the second island of the Sirmiuviit Islands, and it belongs to the Sirmiuviit Ice Administration Zone of the Free State of Sirmivak. It is a stretch of low, gentle hills rising to a little over 250 m and averaging about 120 m, with easy slopes and valleys holding deep snow, of which even in high summer only the sunny side melts. The low hills are under snow for most of the year, so from the sea the whole island looks white, and its name joins the Tavrunaq paali, \"white\", and uviq, \"island\": \"White Island\". It has no inhabitants and no permanent installations, only a few wooden poles marking the patrol route and an emergency hut. The surrounding sea freezes in winter, and the ice between it and Kiiquviq holds until late spring.\nIn spring, before the sea ice breaks up, polar bears walk across from Kiiquviq Island and dig dens on the south shore to give birth, and every year the rangers come by helicopter to count the dens. A den entrance is no bigger than a washbasin, hidden on a sheltered snow slope, just a small black dot from the air, and the rangers count them one by one with their faces pressed to the windows, then compare the tally with past years' records. In the days when the mothers lead their cubs out of the dens, the rangers keep watch from far off on the sea ice to see the cubs stumble down the snow slope for the first time; they call Paaliuviq \"the quietest maternity ward\" in the islands."
  - id: nat_ymb49v
    subtype: island
    status: generated
    detect: { kind: island, at_km: [398.8, 368.2] }
    names: { zh: 图利乌维克岛, en: Tulliuviq Island, art-x-tavrunaq: Tulliuviq }
    notes:
      zh: "图利乌维克岛在基库维克岛西北，面积约 1800 平方公里，最高处海拔约 400 米，是西尔米乌维特群岛六座岛中的第四大岛，属西尔米瓦克自由邦的西尔米乌维特冰盖管理区。岛的北面没有任何遮挡，直接迎着北冰洋吹来的寒风，岛名意为「冷岛」，塔夫鲁纳克语的 tulli 就是「冷」。岛上是碎石荒原和几片苔藓，地势从海岸向中部的石丘缓缓抬升，夏天也常常飘雪，海岸外的海面一年里大半时间封着海冰；这里远在北纬 78 度，极夜比南岸长得多。南面的基库维克岛上，西尔米基克山的冰川不断入海崩落冰山，冰山观测站为南岸航线发布冰山预报，有的冰山会随海流漂到图利乌维克岛附近。\n冰盖管理区常住的只有一千多人，图利乌维克岛上没有村落，夏天偶尔有科考队乘船登岛，在背风的岩石下搭帐篷，老队员的经验是帐篷门一定要朝南开。科考队在岛上放过一台自动相机拍北极狐，一年后取回时，镜头上结着厚厚的霜，存下的照片里有一半是狐狸凑近来闻镜头的鼻子。队员们把最清楚的一张洗出来贴在营地的墙上，说这是图利乌维克岛唯一的「常住居民」，每年上岛都要先跟它打个招呼。"
      en: "Tulliuviq Island lies north-west of Kiiquviq Island, about 1,800 km² and rising to about 400 m, the fourth largest of the six islands of the Sirmiuviit Islands, in the Sirmiuviit Ice Administration Zone of the Free State of Sirmivak. Nothing to the north shelters it from the wind off the Arctic Ocean, and its name means \"cold island\", tulli being Tavrunaq for \"cold\". It is gravel desert and a few patches of moss, rising gently from the coast to stony knolls in the middle; it often snows even in summer, and the sea off its shores is frozen for most of the year; this far north, at 78°N, the polar night lasts much longer than on the south coast. To the south, the glaciers of the Sirmikiiq Mountains on Kiiquviq Island keep calving icebergs into the sea, the iceberg station issues iceberg forecasts for the south-coast lanes, and some of the bergs drift on the currents to the waters off Tulliuviq.\nThe ice administration zone has only a little over a thousand residents, and there is no settlement on Tulliuviq; in summer research teams occasionally land by boat and pitch their tents in the lee of the rocks, where old hands insist the door must face south. A research team once left an automatic camera on the island to photograph Arctic foxes; when they collected it a year later the lens was thick with frost, and half the pictures it had saved were of a fox's nose sniffing the lens. The team printed the clearest one and pinned it on the camp wall, calling it Tulliuviq's only \"permanent resident\", and greet it first thing every year they land."
  - id: nat_s25e8t
    subtype: island
    status: generated
    detect: { kind: island, at_km: [513.2, 386.2] }
    names: { zh: 乌维库卢克岛, en: Uviqkuluk Island, art-x-tavrunaq: Uviqkuluk }
    notes:
      zh: "乌维库卢克岛是西尔米乌维特群岛最北的岛屿，在帕利乌维克岛西北的海上，面积约 1100 平方公里，属西尔米瓦克自由邦西尔米乌维特冰盖管理区。岛名由 uviq（岛）和表示「小」的后缀 -kuluk 合成，就是「小岛」的意思，可它并不平：岛上最高处海拔三百七十多米，平均一百七十米上下，北岸是被海冰和寒风磨蚀的陡坡，南面的谷地里夏天积着一片片融水塘。岛上没有居民，只有苔藓、地衣和零星的北极罂粟，夏天北极狐在碎石间找鸟蛋，偶尔有北极熊从海冰上过来歇脚。岛的北面是终年不化的海冰，冰缘随季节进退，夏末离岛最远，冬天则一直压到岸边。极夜里岛上一连几个月不见太阳，只有极光和冰面反射的星光。\n往北航行的科考船常在岛边停一停，等冰缘裂开一条水道，有时一等就是好几天。船员说在这里下锚，就是「在世界的门槛上坐一会儿」。等待的日子里，大家轮流上岛走一走，在南岸的一块大石头下面留一张写着船名和日期的纸条，压上几块石头，下一条船来的人会把它们读完再放回去。这堆纸条越积越厚，被科考队员们称作北冰洋上最北的留言簿。"
      en: "Uviqkuluk Island is the northernmost of the Sirmiuviit Islands, in the sea north-west of Paaliuviq Island, about 1,100 km², in the Sirmiuviit Ice Administration Zone of the Free State of Sirmivak. Its name joins uviq, \"island\", to the diminutive suffix -kuluk, so it simply means \"little island\", but it is not flat: it rises to a little over 370 m and averages around 170 m, with a north shore of steep slopes worn by sea ice and cold winds and southern valleys dotted with meltwater ponds in summer. Nobody lives here; there are only mosses, lichens and the odd Arctic poppy, Arctic foxes hunting for birds' eggs among the stones in summer, and now and then a polar bear resting on its way across the sea ice. North of the island lies sea ice that never melts, its edge advancing and retreating with the seasons, furthest away in late summer and pressed right up to the shore in winter. In the polar night the island goes months without the sun, lit only by the aurora and starlight glancing off the ice.\nResearch ships heading north often stop here to wait for a lead to open in the ice edge, sometimes for days. The crews say that dropping anchor here is \"sitting for a while on the threshold of the world\". While they wait, people take turns going ashore for a walk and leave a note with the ship's name and the date under a big boulder on the south shore, weighted with a few stones; the next ship's crew read them all and put them back. The pile of notes grows thicker every year, and the research teams call it the northernmost visitors' book on the Arctic Ocean."

  # ── 皮鲁库维特群岛 ──────────────────────────────────────────────
  - id: nat_gny1z0
    subtype: island
    status: generated
    detect: { kind: island, at_km: [529.2, 445.2] }
    names: { zh: 皮鲁克尔尤阿克岛, en: Pirrukrjuaq Island, art-x-tavrunaq: Pirrukrjuaq }
    notes:
      zh: "皮鲁克尔尤阿克岛是皮鲁库维特群岛的主岛，面积约 13.2 万平方公里，是领地最大的岛屿，也是地势最高的岛，岛名由 pirruk（峰）和表示「大」的后缀合成，意为「大峰岛」。皮鲁克尔尤伊特山脉由三座山群组成，从西向东纵贯全岛，主峰卡拉克皮鲁克峰海拔 2917 米，仅次于大陆上的西尔米峰；中段山群几乎整片埋在世界第二大的卡拉克西尔米冰原之下，东段的贾利皮鲁克峰海拔 2477 米，西段的帕卡皮鲁克峰海拔 2052 米，各自顶着一片冰川。山群之间是低矮的山口和宽阔的冰川谷地，南北两岸被十几条峡湾切开。岛在北纬 80 度以北，雪线比大陆低三百米，夏天太阳整夜不落，冬天有四个月不升起。全岛属西尔米瓦克自由邦的皮鲁库维特生态保护区，没有村镇，只有巡护站、科考站和夏季的登山营地，只准持许可证的科考队和登山队进入。\n登山季只有极昼里短短两个月，登山队从西尔米卡尔维克乘包机降落在冰原边缘的跑道上，再花三四个星期沿冰川一路向上。登山队员说，在这座岛上最难习惯的不是冷，而是「明明半夜了，太阳还挂在山顶上看着你」。营地的厨师有句口头禅：「这里一天只有一顿饭，从早吃到晚。」"
      en: "Pirrukrjuaq Island is the main island of the Pirrukuviit Islands. At about 132,000 km² it is the largest island in the territory and also the highest; its name joins pirruk, \"peak\", to the suffix for \"great\": \"island of great peaks\". The Pirrukrjuit Mountains, made up of three massifs, run the length of the island from west to east. Their highest summit, Mount Kallaaqpirruk, 2,917 m, is second only to Mount Sirmi on the mainland; the central massif is almost entirely buried under the Kallaaqsirmi Icefield, the second largest in the world, while Mount Jaalipirruk, 2,477 m, in the east and Mount Pakkapirruk, 2,052 m, in the west each carry a glacier of their own. Between the massifs lie low passes and broad glacial valleys, and more than a dozen fjords cut into the north and south coasts. The island lies north of 80° N, where the snowline is three hundred metres lower than on the mainland; in summer the sun never sets and in winter it does not rise for four months. The whole island is the Pirrukuviit Nature Reserve of the Free State of Sirmivak: there are no villages, only ranger stations, research stations and the summer climbing camps, and only research and climbing parties holding permits may enter.\nThe climbing season is a mere two months of midnight sun; parties fly by charter from Sirmiqarvik to a runway at the edge of the icefield, then spend three or four weeks working their way up the glaciers. Climbers say the hardest thing to get used to on this island is not the cold but \"the sun still sitting on the summit watching you in the middle of the night\". The camp cook has a stock phrase: \"There's only one meal a day here, and it lasts from morning till night.\""
  - id: nat_pjr6a4
    subtype: island
    status: generated
    detect: { kind: island, at_km: [377.8, 471.2] }
    names: { zh: 普拉乌维克岛, en: Pullauviq Island, art-x-tavrunaq: Pullauviq }
    notes:
      zh: "普拉乌维克岛是皮鲁库维特群岛西端的岛屿，面积约 4600 平方公里，属西尔米瓦克自由邦皮鲁库维特生态保护区，岛名由塔夫鲁纳克语的 pulla（西）和 uviq（岛）合成，意为「西岛」。与山高冰厚的主岛不同，这座岛地势低缓，最高处海拔只有一百一十多米，平均不到九十米，地表是冰川退去后留下的砾石平原和泥炭苔原，夏天的苔原上散布着成千上万个融水小湖，远看像一张撒满碎镜片的毯子。岛上没有居民点，是海鸟、北极雁和雪鸮的繁殖地，群岛里的人管它叫「鸟岛」；北极狐和偶尔路过的北极熊靠鸟蛋和雏鸟过夏。夏天海冰化开后，从岛周围的海上东望，主岛西段帕卡皮鲁克峰参差的山尖一字排开，科考船员叫它「破梳子」。\n保护区的鸟类调查队每年七月上岛，在湖与湖之间搭起观察棚，一个夏天要数完几十万只鸟；队员们说数到最后，闭上眼睛也能看见满天的翅膀。调查队有个规矩，每数满十万只，全队就在帐篷里煮一锅加了浆果的甜粥庆祝，有一年鸟特别多，调查队带上岛的浆果没等到秋天就吃光了，于是第二年出发前，队长在装备清单上把浆果的分量翻了一倍。"
      en: "Pullauviq Island is the island at the western end of the Pirrukuviit Islands, about 4,600 km², in the Pirrukuviit Nature Reserve of the Free State of Sirmivak; its name joins the Tavrunaq pulla, \"west\", and uviq, \"island\": \"West Island\". Unlike the high, ice-laden main island, it is low and gentle, rising to only a little over 110 m and averaging under 90 m, a gravel plain and peaty tundra left behind by retreating glaciers; in summer the tundra is scattered with thousands upon thousands of meltwater pools, so that from afar it looks like a rug strewn with shards of mirror. There is no settlement; it is a breeding ground for seabirds, Arctic geese and snowy owls, and the islands' people call it \"the bird island\", while Arctic foxes and the odd passing polar bear live through the summer on eggs and chicks. Once the sea ice melts in summer, looking east from the waters around the island you can see the ragged summits of Mount Pakkapirruk at the western end of the main island ranged in a line, which research crews call \"the broken comb\".\nThe reserve's bird survey team lands every July and sets up hides between the pools, counting several hundred thousand birds in a single summer; by the end, team members say, they can see a sky full of wings with their eyes shut. The team has a rule that every time the count passes a hundred thousand they cook a pot of sweet porridge with berries in the tent to celebrate; one year there were so many birds that the berries they had brought ran out long before autumn, and before setting out the next year the leader doubled the berry ration on the kit list."
  - id: nat_mwt1e8
    subtype: island
    status: generated
    detect: { kind: island, at_km: [661.8, 424.8] }
    names: { zh: 贾利尤阿克岛, en: Jaalijuaq Island, art-x-tavrunaq: Jaalijuaq }
    notes:
      zh: "贾利尤阿克岛是皮鲁库维特群岛东端的岛屿，面积约 2600 平方公里，属西尔米瓦克自由邦皮鲁库维特生态保护区，岛名由 jaali（风）和表示「大」的后缀合成，意为「大风岛」，群岛里的人也叫它「风岛」。岛上是起伏的碎石台地，最高处海拔三百七十多米，平均两百米左右，没有山谷可以挡风。岛正对着北冰洋上吹来的风，地上几乎没有高过脚踝的植物，只有贴着地面生长的苔藓、地衣和垫状的小花，连石头都被风沙磨得光溜溜的，有的磨出了棱角分明的切面。主岛东段的贾利皮鲁克峰也因大风得名，两处的风从同一片海上吹来。岛上没有居民，夏天偶尔有科考队上岛采集被风磨过的岩石标本，冬天四周的海面封冻，整座岛只剩风声。\n保护区在岛上设了一座无人气象站，每小时把风速发回西尔米卡尔维克，那里的气象员看一眼贾利尤阿克岛的读数，就知道这一天北冰洋上的风有多大。有一年冬天，站房的门被一阵大风整个卷走，第二年夏天巡护员在四公里外的海滩上找到了它，门上的铰链还在。如今那扇门挂在巡护站的墙上，下面写着一行字：「它比我们任何人都先到了海边。」"
      en: "Jaalijuaq Island is the island at the eastern end of the Pirrukuviit Islands, about 2,600 km², in the Pirrukuviit Nature Reserve of the Free State of Sirmivak; its name joins jaali, \"wind\", to the suffix for \"great\", \"island of great winds\", and the islands' people also call it \"the wind island\". It is rolling, stony tableland rising to a little over 370 m and averaging about 200 m, with no valleys to break the wind. The island faces straight into the winds off the Arctic Ocean, and almost nothing grows higher than your ankle: only mosses, lichens and cushion flowers pressed to the ground, while even the stones are polished smooth by wind-blown grit, some ground into sharp-edged facets. Mount Jaalipirruk at the eastern end of the main island is also named for its gales, and the wind in both places comes off the same sea. Nobody lives here; in summer the occasional research team lands to collect wind-worn rock samples, and in winter the sea freezes all round and the island is left to the sound of the wind.\nThe reserve keeps an unmanned weather station here that sends the wind speed back to Sirmiqarvik every hour, and the forecasters there can tell from one glance at Jaalijuaq's readings how hard the wind is blowing over the Arctic Ocean that day. One winter the door of the station hut was carried off whole by a gust, and the next summer the rangers found it on a beach four kilometres away, hinges still attached. That door now hangs on the wall of the ranger station above a line of writing: \"It got to the seaside before any of us.\""

  # ── 伊卢克帕卡群岛 ──────────────────────────────────────────────
  - id: nat_ac00q9
    subtype: island
    status: generated
    detect: { kind: island, at_km: [260.8, 400.8] }
    names: { zh: 帕卡尔尤阿克岛, en: Pakkarjuaq Island, art-x-tavrunaq: Pakkarjuaq }
    notes:
      zh: "帕卡尔尤阿克岛是伊卢克帕卡群岛的主岛，面积约 3 万平方公里，是领地第三大岛，属基卢克图阿尔原住民自治区伊卢克帕卡区。地表是冰川磨平的古老岩盘，被上千个湖泊和曲折的水道切得支离破碎，地图上看去像一块摔碎的镜子，岛名由 pakka（破）和表示「大」的后缀合成，意为「破碎的大岛」。全岛最高处不到 500 米，平均不到一百五十米，岩盘上留着冰川刮出的擦痕和一道道蛇形的砾石垄，湖与湖之间常常只隔着一道窄窄的石梁。居民散居在海岸和湖边的渔猎村落里，伊卢克帕卡区常住约 6000 人，塔夫鲁纳克语母语者占九成，靠湖鱼、驯鹿和海豹为生，夏天也有探矿队上岛。自治区议事会管着北岸近海的渔业配额和狩猎季，岛上人家的墙上大多挂着猎枪，也挂着一架手风琴。\n岛上没有公路，夏天坐船、冬天坐雪橇，湖和水道封冻以后反而最好走。本地人说岛上的路「冬天有一千条，夏天一条也没有」。夏天划船出门得懂得哪里能扛着船翻过石梁，哪里会突然冒出一片新的湖，老人教孩子认路，不靠路标，靠湖的形状。冬天村里办婚礼，客人们赶着雪橇从各个湖上汇过来，冰面上一整夜都是手风琴声。"
      en: "Pakkarjuaq Island is the main island of the Illuqpakka Islands. At about 30,000 km² it is the third largest island in the territory, and it belongs to the Illuqpakka District of the Kiluktuar Indigenous Autonomous Region. Its surface is ancient bedrock planed down by glaciers and broken into fragments by more than a thousand lakes and winding channels, so that on a map it looks like a shattered mirror; the name joins pakka, \"broken\", to the suffix for \"great\": \"great broken island\". Its highest point is under 500 m and its average under 150 m; the bedrock still bears the scratches of the ice and sinuous gravel ridges, and often only a narrow rock rib separates one lake from the next. People live scattered in fishing and hunting villages along the coast and by the lakes; Illuqpakka District has about 6,000 residents, nine in ten of them native Tavrunaq speakers, living on lake fish, reindeer and seals, and prospecting parties come over in summer. The autonomous region's council controls the fishing quotas and hunting seasons of the northern coastal waters, and on the walls of most island homes hangs a hunting rifle, and an accordion beside it.\nThere are no roads; people travel by boat in summer and by sled in winter, and the going is actually best once the lakes and channels freeze. Locals say the island has \"a thousand roads in winter and not one in summer\". To get about by boat in summer you must know where you can carry the boat over a rock rib and where a new lake will suddenly open up, and the elders teach children the way not by signposts but by the shapes of the lakes. When a village holds a wedding in winter the guests drive their sleds in from lakes all around, and the accordions play on the ice all night."
  - id: nat_f63ac7
    subtype: island
    status: generated
    detect: { kind: island, at_km: [272.8, 428.2] }
    names: { zh: 伊卢克库卢克岛, en: Illuqkuluk Isle, art-x-tavrunaq: Illuqkuluk }
    notes:
      zh: "伊卢克库卢克岛是帕卡尔尤阿克岛北面的小岛，面积约 630 平方公里，属基卢克图阿尔原住民自治区伊卢克帕卡区，与主岛一同构成伊卢克帕卡群岛。岛上地势低平，最高处海拔一百九十米，平均不到一百米，和主岛一样是冰川磨平的岩盘，湖泊星罗棋布，大大小小的湖占去了岛上不少面积，岛名由 illuq（湖）和表示「小」的后缀合成，意为「小湖岛」。岛上没有村子，只有渔民盖的几座石头小屋，屋顶压着草皮，冬天被雪埋得只露出烟囱。湖与湖之间是长着苔藓和矮柳的低地，夏天有驯鹿从主岛游过海峡来吃草，秋天再游回去。冬天湖面和海峡一起封冻，渔民就改乘雪橇过来凿冰钓鱼。\n夏天湖里的北极红点鲑肥美，帕卡尔尤阿克岛的渔民划船过来下网，在岛上的石头小屋里住上几天，把鱼挂在风里晾成鱼干，秋天再一船船运回去。晾鱼的木架沿着湖岸排开，风一吹，满岛都是鱼干的味道，渔民说这是伊卢克库卢克岛「夏天的香水」。每座小屋都不上锁，屋里留着干柴、火柴和一罐茶叶，谁用了谁补上；有一年一位探矿队员在风暴里迷了路，就是靠一座小屋里的柴火熬过了三天，后来他每年夏天都托渔民捎一捆柴上岛。"
      en: "Illuqkuluk Isle is a small island north of Pakkarjuaq Island, about 630 km², in the Illuqpakka District of the Kiluktuar Indigenous Autonomous Region, and with the main island it makes up the Illuqpakka Islands. It is low and flat, rising to 190 m and averaging under 100 m, glacier-planed bedrock like the main island and dotted with lakes large and small that take up a good part of its area; its name joins illuq, \"lake\", to the diminutive suffix: \"little lake island\". There is no village, only a few stone huts built by fishermen, roofed with turf and buried in winter until only the chimneys show. Between the lakes lie low grounds of moss and dwarf willow, and in summer reindeer swim the strait from the main island to graze, swimming back in autumn. In winter the lakes and the strait freeze together, and the fishermen come over by sled instead to fish through holes in the ice.\nIn summer the Arctic char in the lakes are fat, and fishermen from Pakkarjuaq row over to set their nets, staying a few days in the stone huts and hanging the fish in the wind to dry, then carrying the dried fish home boatload by boatload in autumn. The drying racks stand along the lake shores, and when the wind blows the whole island smells of dried fish, which the fishermen call Illuqkuluk's \"summer perfume\". None of the huts is locked; each keeps dry firewood, matches and a tin of tea, and whoever uses them replaces them. One year a prospector lost in a storm got through three days on the firewood in one of the huts, and ever since he has sent a bundle of wood over with the fishermen every summer."

  # ── 乌瓦卡鲁库维特群岛 ──────────────────────────────────────────
  - id: nat_zrtk04
    subtype: island
    status: generated
    detect: { kind: island, at_km: [604, 290] }
    names: { zh: 乌瓦克岛, en: "Uvvaak Island", art-x-tavrunaq: Uvvaakuviq }
    notes:
      zh: "乌瓦克岛是乌瓦卡鲁库维特群岛的主岛，面积约 9400 平方公里，最高处海拔约 545 米，是群岛中面积最大、地势最高的岛，「乌瓦克」在塔夫鲁纳克语中意为海象。群岛整片划为西尔米瓦克自由邦的乌瓦卡鲁克生态保护区，常住只有约 600 人，是全领地人口最少的区。保护区的巡护站监测海象栖息地和北极熊的迁移，全岛禁止开发，只允许巡护员和获得许可的科考人员上岛。乌瓦克岛与卡鲁克岛、图拉利克岛、普塔西尔米岛一起环抱着乌瓦克湾，湾面约 6100 平方公里，是领地最大的命名海湾，冬季封冻后，北极熊在湾里的海冰上捕猎海豹。\n岛的海滩是海象的聚居地。夏天成千上万头海象挤在海滩上，远看像一片褐色的礁石，巡护员说它们的叫声在几公里外的船上都听得见。游客只能乘船在外海远远观看，船长会关掉引擎，让船随浪漂一会儿，乘客举着望远镜看海象用长牙撑着身子爬上岸，运气好时，同一个镜头里还能看到远处岸边慢慢踱步的北极熊。巡护员给常来海岸的北极熊编号建档，几只熟面孔还有外号；春天海冰开始破裂时，熊沿着浮冰离开，巡护员就在日志上写一句「走了，明年见」。"
      en: "Uvvaak Island is the main island of the Uvvaakkaruquviit Islands, about 9,400 km² and rising to about 545 m, the largest and highest of the group; uvvaak is the Tavrunaq word for walrus. The whole archipelago is the Uvvaakkaruq Nature Reserve of the Free State of Sirmivak, with only about 600 residents, the least populous district in the territory. The reserve's ranger station monitors the walrus grounds and the movements of polar bears; the whole island is closed to development, and only rangers and researchers with permits may land. Together with Karuq, Turralik and Puttasirmi islands, Uvvaak encloses Uvvaak Bay, about 6,100 km², the largest named bay in the territory, where polar bears hunt seals on the sea ice once it freezes in winter.\nThe island's beaches are walrus haul-outs. In summer thousands of walruses crowd the beaches, from afar like a brown reef, and the rangers say their bellowing can be heard from boats kilometres away. Visitors may only watch from boats well offshore; the skipper cuts the engine and lets the boat drift on the swell while passengers follow through binoculars as the walruses heave themselves ashore on their tusks, and with luck the same view holds a polar bear padding slowly along the shore beyond. The rangers keep numbered files on the polar bears that visit the coast, and the familiar ones have nicknames; when the sea ice starts to break up in spring and the bears leave along the floes, the rangers write in the log: \"Gone. See you next year.\""
  - id: nat_6xq372
    subtype: island
    status: generated
    detect: { kind: island, at_km: [640, 263] }
    names: { zh: 卡鲁克岛, en: "Karuq Island", art-x-tavrunaq: Karuquviq }
    notes:
      zh: "卡鲁克岛是乌瓦卡鲁库维特群岛的第二大岛，面积约 5500 平方公里，在领地的岛屿中排第十，属西尔米瓦克自由邦乌瓦卡鲁克生态保护区，「卡鲁克」在塔夫鲁纳克语中意为熊。岛在主岛乌瓦克岛东南，地势起伏，最高处海拔三百五十多米，平均一百六十米上下，背风的山坡和谷地里冬天积着厚厚的雪，正是北极熊挖窝的好地方。冬季北极熊沿海冰来到岛上，在积雪中筑窝产仔；春天母熊带着幼崽出洞，再沿海冰回到乌瓦克湾一带捕猎海豹。夏天海冰退去，岛上露出苔原和碎石坡，北极狐、雪鹀和成群的海鸟在这里度夏，近岸的海里偶尔能看见海象。夏天的岛上安静得出奇，只听得见海鸟的叫声和远处海象低沉的吼声。\n小熊出生后要在雪窝里待到春天才出洞，这段时间全岛禁止任何人登陆，连巡护员也只在海上用望远镜观察，数着雪坡上哪里多出了一个洞口、哪里的雪地上出现了一大两小的脚印。等到小熊跟着母亲走上海冰，巡护员才上岛查看空了的雪窝，量一量洞的大小，记进档案。保护站的人说，卡鲁克岛是群岛上唯一一个人类「要排队等熊先走」的地方，每年春天，第一串一大两小的脚印就是岛上的开门通知。"
      en: "Karuq Island is the second island of the Uvvaakkaruquviit Islands. At about 5,500 km² it is the tenth largest island in the territory, and it belongs to the Uvvaakkaruq Nature Reserve of the Free State of Sirmivak; \"Karuq\" means \"bear\" in Tavrunaq. The island lies south-east of the main island, Uvvaak, and is hilly, rising to a little over 350 m and averaging around 160 m; deep snow gathers in winter on its sheltered slopes and in its valleys, just the place for polar bears to dig dens. In winter the bears come to the island over the sea ice and den in the snow to give birth; in spring the mothers lead their cubs out and return over the ice to hunt seals around Uvvaak Bay. When the sea ice retreats in summer the island's tundra and scree slopes appear, Arctic foxes, snow buntings and flocks of seabirds spend the summer here, and walrus are sometimes seen in the inshore waters. Summer on the island is strangely quiet, with nothing to hear but the cries of seabirds and the deep bellowing of walrus in the distance.\nThe cubs stay in the dens until spring, and during that time nobody may land on the island; even the rangers watch only through binoculars from the sea, counting where a new den entrance has appeared on a snow slope and where a set of tracks, one large and two small, has crossed the snow. Only when the cubs have followed their mother out onto the sea ice do the rangers go ashore to inspect the empty dens, measure them and enter them in the records. The station staff say Karuq is the one island in the archipelago where people \"queue up and wait for the bears to leave first\", and each spring the first line of tracks, one large and two small, is the island's notice that it is open."
  - id: nat_6fra25
    subtype: island
    status: generated
    detect: { kind: island, at_km: [631, 317] }
    names: { zh: 图拉利克岛, en: Turralik Island, art-x-tavrunaq: Turralik }
    notes:
      zh: "图拉利克岛是乌瓦卡鲁库维特群岛的低平岛屿，在主岛乌瓦克岛东北，面积约 4600 平方公里，属西尔米瓦克自由邦乌瓦卡鲁克生态保护区。全岛地势平坦，平均海拔不到九十米，最高处也只有一百多米，岛面大半常年积着厚厚的冰雪，积冰一直铺到岛的边缘，在岸边断成陡立的冰崖，岛名由此而来。岛的南岸临着群岛环抱的乌瓦克湾，这片面积约 6100 平方公里的海湾是领地最大的命名海湾，冬季封冻后是北极熊捕猎海豹的冰原，夏天冰化后，海象成群地在湾里觅食。岛上没有居民，也没有巡护设施，巡护员只在夏天乘船沿岸巡视，记录冰崖后退了多少、湾里的海冰什么时候化开。冬天整座岛和海湾冻成一片，从空中几乎分不清哪里是岛、哪里是海。\n冰崖在夏天的阳光下泛着蓝光，船只经过时要远远绕开，因为冰崖随时可能崩落一大块，溅起的浪能把小艇掀得东倒西歪。巡护员说，冰崖崩落前常会先发出几声闷响，像有人在冰里敲门，听到这声音就得赶紧把船开走。夏天北极熊偶尔会爬上冰崖顶上歇脚，从海上望去，白熊站在白色的冰崖上，只有走动时才看得出来；巡护员数熊的时候，最怕数漏的就是图拉利克岛冰崖上的那几只。"
      en: "Turralik Island is the low, flat island of the Uvvaakkaruquviit Islands, north-east of the main island, Uvvaak, about 4,600 km², in the Uvvaakkaruq Nature Reserve of the Free State of Sirmivak. The whole island is level, averaging under 90 m and rising to only a little over 100 m, and most of its surface lies under thick ice and snow all year; the ice reaches right to the island's edge and breaks off at the shore in sheer ice cliffs, which give the island its name. Its south shore faces Uvvaak Bay, embraced by the archipelago; at about 6,100 km² it is the largest named bay in the territory, an icefield where polar bears hunt seals once it freezes in winter, and when the ice melts in summer walrus feed in the bay in herds. Nobody lives on the island and there are no ranger facilities; rangers patrol the coast by boat only in summer, recording how far the ice cliffs have retreated and when the sea ice in the bay breaks up. In winter the island and the bay freeze into one, and from the air it is almost impossible to tell where island ends and sea begins.\nThe ice cliffs glow blue in the summer sun, and ships give them a wide berth, since a great slab may come down at any moment, raising a wave that can toss a small boat about. The rangers say that before a collapse the cliffs often give a few dull thuds, like someone knocking on a door inside the ice, and when you hear that you must get the boat away fast. In summer polar bears sometimes climb onto the clifftops to rest, and from the sea a white bear on a white cliff can be seen only when it moves; when the rangers count bears, the ones they most fear missing are the few on Turralik's ice cliffs."
  - id: nat_wbttjv
    subtype: island
    status: generated
    detect: { kind: island, at_km: [656, 296] }
    names: { zh: 普塔西尔米岛, en: Puttasirmi Island, art-x-tavrunaq: Puttasirmi }
    notes:
      zh: "普塔西尔米岛是乌瓦卡鲁库维特群岛东端的岛屿，面积约 1700 平方公里，属西尔米瓦克自由邦乌瓦卡鲁克生态保护区，岛名里的 sirmi 在塔夫鲁纳克语里意为冰。岛上地势低平，平均海拔只有八十米左右，东部有几座两百多米高的石丘，是全岛最高的地方，其余是砾石滩、苔原和夏天的融水洼。冬春之际周围的海面布满浮冰，是海象和北极熊出没的地带：海象趴在浮冰上休息，北极熊在冰缘之间游走，等着海豹从冰缝里探头。岛的西面隔海是乌瓦克湾，春天湾里的海冰开始破裂时，浮冰顺着洋流从岛边漂过，一路往外海散去。夏天浮冰退去后，海鸟在岸边的石缝里筑巢，北极狐沿着海滩找食。这里是群岛离外海最近的地方，巡护员说站在岛的东岸，眼前就只剩一望无际的冰和海。\n巡护员的小屋建在东部的高处，屋顶上画着一个巨大的白熊图案，方便飞机在雪原上辨认。这只白熊每隔几年就要重新刷一遍漆，刷漆的那天巡护员会顺手在白熊旁边添一个小记号，如今屋顶上已经有了一排，像熊身后跟着的一串脚印。驾驶员说，在一片白茫茫的浮冰和雪地里，这只画出来的熊是他们最好认的路标，「真熊会跑，这只不会」。"
      en: "Puttasirmi Island is the island at the eastern end of the Uvvaakkaruquviit Islands, about 1,700 km², in the Uvvaakkaruq Nature Reserve of the Free State of Sirmivak; the sirmi in its name is the Tavrunaq for \"ice\". The island is low and flat, averaging only about 80 m; a few stony knolls in the east rise to a little over 200 m, its highest ground, and the rest is gravel beach, tundra and summer meltwater pools. In winter and spring the surrounding sea is crowded with floating ice, a haunt of walrus and polar bears: the walrus rest on the floes while the bears roam the ice edges, waiting for seals to put their heads up through the cracks. West of the island across the water lies Uvvaak Bay, and when its sea ice begins to break up in spring the floes drift past the island on the current, scattering out to the open sea. Once the ice withdraws in summer, seabirds nest in the crevices along the shore and Arctic foxes forage along the beaches. This is the point of the archipelago nearest the open ocean, and the rangers say that standing on the east shore you see nothing ahead but endless ice and sea.\nThe rangers' hut stands on the high ground in the east, with a huge white bear painted on its roof so that aircraft can pick it out on the snowfield. The bear needs repainting every few years, and on painting day the rangers add a small mark beside it; there is now a whole row of them on the roof, like a trail of footprints following the bear. The pilots say that amid the endless white of floes and snow this painted bear is their easiest landmark: \"the real bears wander off, this one doesn't\"."

  # ── 乌库乌维特群岛 ────────────────────────────────────────────
  - id: nat_6y7y3n
    subtype: island
    status: generated
    detect: { kind: island, at_km: [644, 174] }
    names: { zh: 乌维克萨克岛, en: "Uviqsaaq Island", art-x-tavrunaq: Uviqsaaq }
    notes:
      zh: "乌维克萨克岛是乌库乌维特群岛的主岛，面积约 6600 平方公里，在领地的岛屿中排第九，最高处海拔 783 米，是乌库乌维特群岛地势最高的岛，平均海拔也有四百多米。乌维克萨克市的城区乌维克努卡区在岛的一侧，13.8 万人住在这里，乌维克努卡码头运出稀土精矿、运进燃料和补给，乌维克萨克机场有航班飞往首府和西尔米瓦克；城外的乌库马苏克海峡宽约 2 公里，是领地最窄的命名海峡。岛的其余大部分属乌库乌维特矿区管理区，是起伏的山地和碎石高原，少有人烟。岛名里有塔夫鲁纳克语的 uviq「岛」，乌维克萨克市因岛得名，全市都在这片群岛上，没有一条通往大陆的公路，对外全靠船只和航班。冬天山顶先白，城区的人看山顶的雪往下压了几分，就知道离极夜还有多久。\n岛上的最高处是全市孩子们最爱的远足地，晴天能望见群岛的每一座岛，岛民说这里是「看得见全市的地方」。学校每年夏天组织一次登顶，孩子们在山顶的石堆上各添一块石头，再对着远处的岛一座座喊出名字。补给船进港的日子，从山顶就能先看见它的影子，消息比船跑得还快，等船靠上乌维克努卡码头，超市门口早已排起了买新鲜水果和牛奶的长队。"
      en: "Uviqsaaq Island is the main island of the Ukkuuviit Islands. At about 6,600 km² it is the ninth largest island in the territory, and at 783 m its highest point makes it the highest island of the Ukkuuviit group; even its average elevation is over 400 m. Uviqnuqa District, the urban core of Uviqsaaq City, lies on one side of the island with 138,000 people: Uviqnuqa Quay ships out rare-earth concentrate and brings in fuel and supplies, and Uviqsaaq Airport has flights to the capital and to Sirmivak. Outside the town the Ukkumasuq Strait, about 2 km wide, is the narrowest named strait in the territory. Most of the rest of the island belongs to the Ukkuuviit Mining Administration Zone, rolling hills and stony plateau with few people. The name contains the Tavrunaq uviq, \"island\"; Uviqsaaq City takes its name from the island and lies entirely within the archipelago, without a single road to the mainland, relying wholly on ships and flights. In winter the summit whitens first, and people in town can tell how far off the polar night is by how far the snow has crept down from the top.\nThe island's summit is the children's favourite hike in the city, and on a clear day you can see every island in the group from it, so islanders call it \"the place you can see the whole city from\". The schools organise a climb every summer, and the children each add a stone to the cairn on top, then shout out the names of the distant islands one by one. On days when the supply ship is due its silhouette can be seen from the summit first, and the news travels faster than the ship: by the time it berths at Uviqnuqa Quay there is already a long queue outside the supermarket for fresh fruit and milk."
  - id: nat_ps1ygb
    subtype: island
    status: generated
    detect: { kind: island, at_km: [654, 145] }
    names: { zh: 西卢奥库岛, en: Silluaukku Island, art-x-tavrunaq: Silluaukku }
    notes:
      zh: "西卢奥库岛是乌库乌维特群岛南部的岛屿，面积约 2700 平方公里，属乌维克萨克市的乌库乌维特矿区管理区。岛上地势低缓，最高处两百多米，平均一百二十米左右，北面隔着乌库卡拉湾和乌库马苏克海峡与主岛乌维克萨克岛相望。乌库乌维特露天矿就在岛上，出产稀土，精矿运往乌维克努卡港装船外运；矿区的采场、选矿厂和运矿道路占去了岛中部的一大片，周围是苔原和堆放剥离土石的排土场。矿区管理区常住约 1.7 万人，多为矿工，有的住在岛上的工人宿舍，有的两周一轮换，乘飞机往返首府。乌库卡拉湾风浪较小，补给船和运矿船在湾里等待进港的时机。矿区的灯光整夜不灭，极夜里从乌维克努卡隔湾望去，西卢奥库岛像一艘停在海上的大船。\n矿坑一圈圈向下的台阶从飞机上看得清清楚楚，像一只巨大的漏斗，第一次飞来的人都会挤到舷窗边去看。岛上的孩子把矿里运出来的矿石叫作「彩色石头」，学校的标本柜里摆着一整排，每块下面都贴着一张手写的标签，写着矿石的名字和是谁家爸爸妈妈带回来的。矿工们说，在西卢奥库岛上班，一年里最好的日子是轮换回家的那天，第二好的是回到岛上、看见漏斗又深了一圈的那天。"
      en: "Silluaukku Island lies in the south of the Ukkuuviit Islands, about 2,700 km², in the Ukkuuviit Mining Administration Zone of Uviqsaaq City. It is low and gentle, rising to a little over 200 m and averaging about 120 m, and looks north across Ukkuqalla Bay and the Ukkumasuq Strait to the main island, Uviqsaaq. The Ukkuuviit Open Pit is on the island, producing rare earths, and the concentrate goes to Uviqnuqa for shipment; the pit, the processing plant and the haul roads take up a large tract of the island's centre, surrounded by tundra and spoil heaps of stripped rock. The mining zone has about 17,000 residents, most of them miners, some living in workers' housing on the island and others on two-week rotations, flying to and from the capital. Ukkuqalla Bay is fairly sheltered, and supply ships and ore carriers wait there for their chance to enter port. The mine's lights burn all night, and in the polar night, seen across the water from Uviqnuqa, Silluaukku looks like a great ship lying at anchor.\nThe pit's benches, ring after ring descending, are clearly visible from the air, like a giant funnel, and first-time arrivals all crowd to the windows to look. The island's children call the ore that comes out of the mine \"coloured stones\", and the school's specimen cabinet holds a whole row of them, each with a handwritten label giving the ore's name and whose mum or dad brought it home. The miners say that on Silluaukku the best day of the year is the day you rotate home, and the second best is the day you come back and see the funnel has grown one ring deeper."
