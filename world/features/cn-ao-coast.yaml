# Coastal landforms of the Arctic Ocean Territory: islands and their archipelagos, bays, fjords, capes
# and straits. The generator finds them in the coastline (pipeline/atlas/coast.py); each entry names the
# landform of `detect.kind` nearest to `detect.at_km` (design km, x east, y north). An archipelago is
# the named islands it lists. Unnamed landforms are listed in .cache/candidates-div_hpmerr.json after a build.
features:
  # ── 卫星群岛 ────────────────────────────────────────────
  - id: nat_dppqz7
    subtype: island
    status: generated
    detect: { kind: island, at_km: [55, 317] }
    names: { zh: 天穹岛, en: "Skyvault Island", art-x-tavrunaq: Tauvvaq }
    notes:
      zh: 卫星群岛的主岛，面积约 7400 平方公里，地势低缓，最高处海拔两百多米。岛上空旷开阔、少有遮挡，卫星群岛地面站的天线阵就建在这里，极轨卫星每一圈经过时都能被跟踪接收。
      en: The main island of the Satellite Islands, about 7,400 km², low and gentle, rising to a little over 200 m. Its open, unobstructed ground is home to the antenna arrays of the Satellite Islands Ground Station, which track polar-orbiting satellites on every pass.
  - id: nat_rhderc
    subtype: island
    status: generated
    detect: { kind: island, at_km: [100, 326] }
    names: { zh: 天线岛, en: "Antenna Isle", art-x-tavrunaq: Tauvvulik }
    notes:
      zh: 卫星群岛的小岛，面积约 340 平方公里，是领地最小的命名岛屿，最高处海拔约一百米。岛名来自岛上为地面站接力的天线。
      en: A small island in the Satellite Islands, about 340 km², the smallest named island in the territory, rising to about 100 m. It is named after the relay antennas that serve the ground station.

  # ── 渔猎群岛 ────────────────────────────────────────────
  - id: nat_b1fv64
    subtype: island
    status: generated
    detect: { kind: island, at_km: [184, 279] }
    names: { zh: 大猎岛, en: "Great Hunting Island", art-x-tavrunaq: Pituktuar }
    notes:
      zh: 渔猎群岛的主岛，面积约 1.04 万平方公里，是领地第三大岛，属塔夫鲁利特原住民自治区。岛上地势起伏不大，海岸是传统的海豹与海象猎场，海边岩石上留有刻着鲸、海豹和皮划艇的岩雕。
      en: The main island of the Hunting Islands, about 10,400 km², the third largest island in the territory, in the Tavrulit Indigenous Autonomous Region. Its ground is gently rolling, its coasts are traditional seal and walrus hunting grounds, and rocks by the shore carry carvings of whales, seals and kayaks.
  - id: nat_dstxyg
    subtype: island
    status: generated
    detect: { kind: island, at_km: [205, 263] }
    names: { zh: 鱼叉岛, en: "Harpoon Island", art-x-tavrunaq: Naukkaq }
    notes:
      zh: 渔猎群岛的第二大岛，面积约 1100 平方公里，在大猎岛东南，地势低平。岛名来自塔夫鲁利特猎人用来猎海豹的鱼叉。
      en: The second island of the Hunting Islands, about 1,100 km², south-east of Great Hunting Island and low-lying. It is named after the harpoon Tavrulit hunters use for seals.

  # ── 科考群岛 ────────────────────────────────────────────
  - id: nat_5hdtr2
    subtype: island
    status: generated
    detect: { kind: island, at_km: [323, 311] }
    names: { zh: 探知岛, en: "Insight Island", art-x-tavrunaq: Naallutuar }
    notes:
      zh: 科考群岛的主岛，面积约 7000 平方公里，最高处海拔五百多米。北冰洋极地研究所设在岛上，研究海冰、冻土与北极生态，每年夏季从这里派出科考船。
      en: The main island of the Research Islands, about 7,000 km², rising to over 500 m. The Arctic Ocean Polar Research Institute stands here, studying sea ice, permafrost and Arctic ecology, and sends out its research ships every summer.
  - id: nat_r5e7sa
    subtype: island
    status: generated
    detect: { kind: island, at_km: [357, 324] }
    names: { zh: 浮标岛, en: "Buoy Isle", art-x-tavrunaq: Puttaq }
    notes:
      zh: 科考群岛东部的小岛，面积约 880 平方公里，最高处海拔四百多米。研究所在周围海域布放的海洋浮标由这里维护，岛名由此而来。
      en: A small island in the east of the Research Islands, about 880 km², rising to over 400 m. The institute's ocean buoys in the surrounding waters are serviced from here, hence the name.
  - id: nat_2vhfdf
    subtype: island
    status: generated
    detect: { kind: island, at_km: [278, 347] }
    names: { zh: 北望岛, en: "Northwatch Isle", art-x-tavrunaq: Aqqaniq }
    notes:
      zh: 科考群岛最北的小岛，面积约 590 平方公里，向北面对封冻的北冰洋，岛上设有观测海冰的站点。
      en: The northernmost of the Research Islands, about 590 km², facing the frozen Arctic Ocean to the north, with a station that watches the sea ice.

  # ── 冰川群岛 ────────────────────────────────────────────
  - id: nat_99nd2b
    subtype: island
    status: generated
    detect: { kind: island, at_km: [452, 313] }
    names: { zh: 冰牙岛, en: "Icefang Island", art-x-tavrunaq: Kiiquviq }
    notes:
      zh: 冰川群岛的主岛，面积约 2.87 万平方公里，是领地最大的岛屿，也是地势最高的岛：冰牙山纵贯全岛，主峰冰牙峰海拔 2236 米，山顶覆盖着冰牙冰帽。岛上没有常住居民，属冰川群岛冰盖管理区。
      en: The main island of the Glacier Islands, about 28,700 km², the largest island in the territory and also the highest; the Icefang Mountains run its length, their summit Icefang Peak reaching 2,236 m under the Icefang Ice Cap. No one lives here permanently; it belongs to the Glacier Islands Ice Cap Administration Zone.
  - id: nat_b3kk8p
    subtype: island
    status: generated
    detect: { kind: island, at_km: [520, 301] }
    names: { zh: 冰山岛, en: "Iceberg Island", art-x-tavrunaq: Kiqqulik }
    notes:
      zh: 冰川群岛的第二大岛，面积约 2200 平方公里，在冰牙岛以东。冰牙岛冰川入海崩落的冰山常在附近漂过，岛名由此而来。
      en: The second island of the Glacier Islands, about 2,200 km², east of Icefang Island. Icebergs calved from Icefang Island's glaciers often drift past, hence the name.
  - id: nat_tfkcz1
    subtype: island
    status: generated
    detect: { kind: island, at_km: [570, 318] }
    names: { zh: 漂冰岛, en: "Drift Ice Island", art-x-tavrunaq: Sirmiaulla }
    notes:
      zh: 冰川群岛东端的小岛，面积约 980 平方公里，周围海面常年漂着浮冰，岛名由此而来。
      en: A small island at the eastern end of the Glacier Islands, about 980 km², surrounded by drifting ice for much of the year, hence the name.

  # ── 海象熊群岛 ──────────────────────────────────────────
  - id: nat_zrtk04
    subtype: island
    status: generated
    detect: { kind: island, at_km: [604, 290] }
    names: { zh: 乌瓦克岛, en: "Uvvaak Island", art-x-tavrunaq: Uvvaakuviq }
    notes:
      zh: 海象熊群岛的主岛，面积约 9400 平方公里，「乌瓦克」在塔夫鲁纳克语中意为海象。岛的海滩是海象的聚居地，保护区的巡护站监测海象栖息地和北极熊的迁移，全岛禁止开发。
      en: The main island of the Walrus and Bear Islands, about 9,400 km²; uvvaak is the Tavrunaq word for walrus. Its beaches are walrus haul-outs, the reserve's ranger station monitors the walrus grounds and the movements of polar bears, and the whole island is closed to development.
  - id: nat_6xq372
    subtype: island
    status: generated
    detect: { kind: island, at_km: [640, 263] }
    names: { zh: 卡鲁克岛, en: "Karuq Island", art-x-tavrunaq: Karuquviq }
    notes:
      zh: 海象熊群岛的第二大岛，面积约 5500 平方公里，「卡鲁克」在塔夫鲁纳克语中意为熊。冬季北极熊沿海冰来到岛上，在积雪中筑窝产仔。
      en: The second island of the Walrus and Bear Islands, about 5,500 km²; karuq is the Tavrunaq word for bear. In winter polar bears come over the sea ice and dig dens in the snow to give birth.
  - id: nat_6fra25
    subtype: island
    status: generated
    detect: { kind: island, at_km: [631, 317] }
    names: { zh: 冰崖岛, en: "Ice Cliff Island", art-x-tavrunaq: Turralik }
    notes:
      zh: 海象熊群岛的低平岛屿，面积约 4600 平方公里，最高处海拔只有一百多米，海岸是陡立的冰崖，岛名由此而来。
      en: A low, flat island in the Walrus and Bear Islands, about 4,600 km², rising only to a little over 100 m, its coast walled by sheer ice cliffs, hence the name.
  - id: nat_wbttjv
    subtype: island
    status: generated
    detect: { kind: island, at_km: [656, 296] }
    names: { zh: 浮冰岛, en: "Floe Island", art-x-tavrunaq: Puttasirmi }
    notes:
      zh: 海象熊群岛东端的岛屿，面积约 1700 平方公里，冬春之际周围的海面布满浮冰，是海象和北极熊出没的地带。
      en: The island at the eastern end of the Walrus and Bear Islands, about 1,700 km²; in late winter and spring the sea around it fills with floes, the haunt of walruses and polar bears.

  # ── 稀土群岛 ────────────────────────────────────────────
  - id: nat_6y7y3n
    subtype: island
    status: generated
    detect: { kind: island, at_km: [644, 174] }
    names: { zh: 乌维克萨克岛, en: "Uviqsaaq Island", art-x-tavrunaq: Uviqsaaq }
    notes:
      zh: 稀土群岛的主岛，面积约 6600 平方公里，最高处海拔 783 米，是领地仅次于冰牙岛的高岛。乌维克萨克市的稀土港和机场在岛的一侧，其余大部分属稀土群岛矿区管理区。
      en: The main island of the Rare Earth Islands, about 6,600 km², rising to 783 m, the highest island in the territory after Icefang Island. Uviqsaaq City's harbour and airport are on one side of it, and most of the rest belongs to the Rare Earth Islands Mining Administration Zone.
  - id: nat_ps1ygb
    subtype: island
    status: generated
    detect: { kind: island, at_km: [654, 145] }
    names: { zh: 南矿岛, en: "South Ore Island", art-x-tavrunaq: Silluaukku }
    notes:
      zh: 稀土群岛南部的岛屿，面积约 2700 平方公里，地势低缓，稀土群岛露天矿就在岛上，精矿运往稀土港装船。
      en: An island in the south of the Rare Earth Islands, about 2,700 km² and gently rolling; the Rare Earth Islands Open-Pit Mine is here, and its concentrate goes to the harbour for shipping.
  - id: nat_0mnzj7
    subtype: island
    status: generated
    detect: { kind: island, at_km: [632, 141] }
    names: { zh: 磁石岛, en: "Lodestone Island", art-x-tavrunaq: Qittilik }
    notes:
      zh: 稀土群岛西部的低平小岛，面积约 1100 平方公里，最高处海拔一百多米。岛上的岩石含磁铁矿，罗盘在这里会偏转，岛名由此而来。
      en: A low, small island in the west of the Rare Earth Islands, about 1,100 km², rising to a little over 100 m. Its rocks contain magnetite that turns compass needles, hence the name.
  - id: nat_wrjnnn
    subtype: island
    status: generated
    detect: { kind: island, at_km: [660, 203] }
    names: { zh: 北矿岛, en: "North Ore Island", art-x-tavrunaq: Aqqaukku }
    notes:
      zh: 稀土群岛最北的岛屿，面积约 670 平方公里，最高处海拔近五百米，是矿区勘探中的岛屿。
      en: The northernmost of the Rare Earth Islands, about 670 km², rising to nearly 500 m, and under exploration by the mining zone.

  # ── 极光群岛 ────────────────────────────────────────────
  - id: nat_vv2c47
    subtype: island
    status: generated
    detect: { kind: island, at_km: [523, 42] }
    names: { zh: 光幕岛, en: "Lightcurtain Island", art-x-tavrunaq: Qavvaluktuar }
    notes:
      zh: 极光群岛的主岛，面积约 1.12 万平方公里，是领地第二大岛。岛上地势低平、远离城市灯光，冬季夜空开阔，极光群岛观光度假村的玻璃屋顶客房就散布在岛上。
      en: The main island of the Aurora Islands, about 11,200 km², the second largest island in the territory. It is low and flat, far from city lights and open to the winter sky, and the glass-roofed rooms of the Aurora Islands Resort are scattered across it.
  - id: nat_95v2tq
    subtype: island
    status: generated
    detect: { kind: island, at_km: [574, 51] }
    names: { zh: 长夜岛, en: "Longnight Island", art-x-tavrunaq: Unnataq }
    notes:
      zh: 极光群岛东部的岛屿，面积约 3000 平方公里，最高处海拔四百多米。冬季极夜漫长，岛名由此而来，岛上有观赏极光的小屋和步道。
      en: An island in the east of the Aurora Islands, about 3,000 km², rising to over 400 m. It is named for the long polar night, and has huts and trails for watching the aurora.
  - id: nat_y023md
    subtype: island
    status: generated
    detect: { kind: island, at_km: [546, 60] }
    names: { zh: 绿光岛, en: "Greenlight Isle", art-x-tavrunaq: Qurrak }
    notes:
      zh: 极光群岛的小岛，面积约 470 平方公里，在光幕岛与长夜岛之间。岛名来自极光常见的绿色光带。
      en: A small island in the Aurora Islands, about 470 km², between Lightcurtain and Longnight islands. It is named after the green bands that are the aurora's commonest colour.

  # ── 海牧群岛 ────────────────────────────────────────────
  - id: nat_p61nkb
    subtype: island
    status: generated
    detect: { kind: island, at_km: [241, 50] }
    names: { zh: 网箱岛, en: "Netpen Island", art-x-tavrunaq: Ulikniq }
    notes:
      zh: 海牧群岛西部的岛屿，面积约 1700 平方公里。周围的海湾里排列着深海养殖网箱，岛名由此而来。
      en: An island in the west of the Sea Pasture Islands, about 1,700 km². The bays around it are lined with deep-water fish pens, hence the name.
  - id: nat_qpjgxz
    subtype: island
    status: generated
    detect: { kind: island, at_km: [211, 57] }
    names: { zh: 海藻岛, en: "Seaweed Island", art-x-tavrunaq: Kuuqalik }
    notes:
      zh: 海牧群岛最西的岛屿，面积约 1500 平方公里，沿岸浅水里生长着大片海藻林，岛上的工厂把海藻加工成食品和饲料。
      en: The westernmost of the Sea Pasture Islands, about 1,500 km², with wide kelp forests in its shallows; plants on the island process the seaweed into food and feed.
  - id: nat_ptewc9
    subtype: island
    status: generated
    detect: { kind: island, at_km: [292, 72] }
    names: { zh: 暖潮岛, en: "Warmtide Island", art-x-tavrunaq: Saarimma }
    notes:
      zh: 海牧群岛的主岛，面积约 2900 平方公里，离首府只有一百多公里。暖流经过岛的周围，海水比别处温暖，海牧群岛区的居民大多住在这里。
      en: The main island of the Sea Pasture Islands, about 2,900 km², only a little over 100 km from the capital. The warm current flows round it and its waters are warmer than elsewhere, and most of the district's people live here.
  - id: nat_9f9td0
    subtype: island
    status: generated
    detect: { kind: island, at_km: [301, 42] }
    names: { zh: 南灯岛, en: "South Light Isle", art-x-tavrunaq: Silluaqulli }
    notes:
      zh: 海牧群岛最南的岛屿，面积约 1100 平方公里，最高处海拔五百多米，岛南端的灯塔为驶向首府的船只指引航道。
      en: The southernmost of the Sea Pasture Islands, about 1,100 km², rising to over 500 m; the lighthouse at its southern tip guides ships bound for the capital.

  # ── 玄武岩柱群岛 ────────────────────────────────────────
  - id: nat_mgz2yw
    subtype: island
    status: generated
    detect: { kind: island, at_km: [94, 85] }
    names: { zh: 石柱岛, en: "Pillar Island", art-x-tavrunaq: Tuunnaq }
    notes:
      zh: 玄武岩柱群岛的主岛，面积约 3400 平方公里，海岸上成排的六角形玄武岩柱是保护区的核心，崖上栖息着海鸦与北极鸥。
      en: The main island of the Basalt Pillar Islands, about 3,400 km²; the rows of hexagonal basalt columns on its coast are the heart of the reserve, and guillemots and Arctic gulls nest on the cliffs.
  - id: nat_ftskb5
    subtype: island
    status: generated
    detect: { kind: island, at_km: [123, 69] }
    names: { zh: 黑岩岛, en: "Darkstone Island", art-x-tavrunaq: Mirnik }
    notes:
      zh: 玄武岩柱群岛东部的岛屿，面积约 2800 平方公里，最高处海拔四百多米，由深色的玄武岩构成，岛名由此而来。
      en: An island in the east of the Basalt Pillar Islands, about 2,800 km², rising to over 400 m and built of dark basalt, hence the name.
  - id: nat_w4fpp3
    subtype: island
    status: generated
    detect: { kind: island, at_km: [70, 69] }
    names: { zh: 风琴岛, en: "Organ Isle", art-x-tavrunaq: Nipaq }
    notes:
      zh: 玄武岩柱群岛西部的小岛，面积约 830 平方公里。海浪冲进岩柱之间的空隙，发出像管风琴一样的声音，岛名由此而来。
      en: A small island in the west of the Basalt Pillar Islands, about 830 km². Waves rushing into the gaps between its columns sound like an organ, hence the name.

  # ── 数据群岛 ────────────────────────────────────────────
  - id: nat_3njsdv
    subtype: island
    status: generated
    detect: { kind: island, at_km: [39, 189] }
    names: { zh: 冷存岛, en: "Coldvault Island", art-x-tavrunaq: Tukkartuar }
    notes:
      zh: 数据群岛的主岛，面积约 3900 平方公里，岛名来自岛上的冷存数据中心：它用极地冷空气和海水冷却服务器，余热为岛上的住宅供暖。
      en: The main island of the Data Islands, about 3,900 km², named after the Coldvault Data Centre on it, which cools its servers with polar air and seawater and heats the island's homes with the waste heat.
  - id: nat_x904y1
    subtype: island
    status: generated
    detect: { kind: island, at_km: [55, 161] }
    names: { zh: 光缆岛, en: "Cable Isle", art-x-tavrunaq: Aliqtaq }
    notes:
      zh: 数据群岛东部的岛屿，面积约 1800 平方公里，西隔光缆海峡与白雾岛相望。连接世界各地的海底光缆在这里登陆，岛名由此而来。
      en: An island in the east of the Data Islands, about 1,800 km², facing Whitefog Isle across Cable Strait to the west. The submarine cables that link the islands to the rest of the world come ashore here, hence the name.
  - id: nat_estcp4
    subtype: island
    status: generated
    detect: { kind: island, at_km: [32, 166] }
    names: { zh: 白雾岛, en: "Whitefog Isle", art-x-tavrunaq: Paalitaqqu }
    notes:
      zh: 数据群岛西部的岛屿，面积约 1200 平方公里，夏季暖流与冷空气相遇，岛上常被白色海雾笼罩，岛名由此而来。
      en: An island in the west of the Data Islands, about 1,200 km²; in summer, where the warm current meets cold air, it is often wrapped in white sea fog, hence the name.

  # ── Archipelagos ────────────────────────────────────────
  - id: nat_fe3007
    subtype: archipelago
    status: generated
    islands: [nat_dppqz7, nat_rhderc]
    names: { zh: 卫星群岛, en: "Satellite Islands", art-x-tavrunaq: Tauvvuviit }
    notes:
      zh: 图利瓦克市以北海上的群岛，由天穹岛和天线岛组成，总面积约 7700 平方公里，属卫星群岛区。群岛因卫星地面站得名。
      en: An archipelago in the sea north of Tullivaq City, made up of Skyvault Island and Antenna Isle, about 7,700 km² in all, forming the Satellite Islands District. It is named after its satellite ground station.
  - id: nat_554jpc
    subtype: archipelago
    status: generated
    islands: [nat_b1fv64, nat_dstxyg]
    names: { zh: 渔猎群岛, en: "Hunting Islands", art-x-tavrunaq: Pitukuviit }
    notes:
