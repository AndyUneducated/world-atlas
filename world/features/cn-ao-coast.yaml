      en: "A bay enclosed by the Uvvaakkaruquviit Islands, about 6,100 km², the largest named bay in the territory. It freezes over in winter, when the sea ice is where polar bears hunt seals, and in summer walruses gather on its beaches. When the ice begins to break up in spring, polar bears wait at the floe edge by the seals' breathing holes, and the rangers say it is the tensest season of the year in the reserve."
