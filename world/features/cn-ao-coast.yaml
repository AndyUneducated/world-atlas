# Coastal landforms of the Arctic Ocean Territory: islands and their archipelagos, bays, fjords, capes
# and straits. The generator finds them in the coastline (pipeline/atlas/coast.py); each entry names the
# landform of `detect.kind` nearest to `detect.at_km` (design km, x east, y north). An archipelago is
# the named islands it lists. Unnamed landforms are listed in .cache/candidates-div_hpmerr.json after a build.
features:
  # ── 陶武维特群岛 ────────────────────────────────────────────
  - id: nat_dppqz7
    subtype: island
    status: generated
    detect: { kind: island, at_km: [55, 317] }
    names: { zh: 陶瓦克岛, en: Tauvvaq Island, art-x-tavrunaq: Tauvvaq }
    notes:
      zh: "陶武维特群岛的主岛，面积约 7400 平方公里，地势低缓，最高处海拔两百多米。岛上空旷开阔、少有遮挡，陶武维特地面站的天线阵就建在这里，极轨卫星每一圈经过时都能被跟踪接收。岛上的天线阵在雪原上排成整齐的白色圆盘，地面站的值班员每有卫星飞过头顶就在黑板上画一道，一年下来黑板要擦好几百次。"
      en: "The main island of the Tauvvuviit Islands, about 7,400 km², low and gentle, rising to a little over 200 m. Its open, unobstructed ground is home to the antenna arrays of the Tauvvuviit Ground Station, which track polar-orbiting satellites on every pass. The dishes stand in neat white rows on the snowfield, and the duty staff chalk a stroke on a blackboard for every satellite overhead, wiping the board hundreds of times a year."
  - id: nat_rhderc
    subtype: island
    status: generated
    detect: { kind: island, at_km: [100, 326] }
    names: { zh: 萨卡利特岛, en: Saqqaliit Isle, art-x-tavrunaq: Saqqaliit }
    notes:
      zh: "陶武维特群岛的小岛，面积约 340 平方公里，是领地最小的命名岛屿，最高处海拔约一百米。岛名来自岛上为地面站接力的天线。岛上只有几座天线和一间维护小屋，维护人员乘船上岛，风暴天就在小屋里多住几天，墙上贴满了历次「滞留」的日期。"
      en: "A small island in the Tauvvuviit Islands, about 340 km², the smallest named island in the territory, rising to about 100 m. It is named after the relay antennas that serve the ground station. The isle has only a few antennas and a maintenance hut; technicians come by boat and stay on in the hut when storms blow up, its wall covered with the dates of past \"strandings\"."

  # ── 皮图库维特群岛 ────────────────────────────────────────────
  - id: nat_b1fv64
    subtype: island
    status: generated
    detect: { kind: island, at_km: [184, 279] }
    names: { zh: 皮图克尤阿克岛, en: Pitukjuaq Island, art-x-tavrunaq: Pitukjuaq }
    notes:
      zh: "皮图库维特群岛的主岛，面积约 1.04 万平方公里，是领地第三大岛，属塔夫鲁利特原住民自治区。岛上地势起伏不大，海岸是传统的海豹与海象猎场，海边岩石上留有刻着鲸、海豹和皮划艇的岩雕。塔夫鲁利特猎人至今在这里按季节狩猎，猎获按老规矩分给全村，岩雕只在退潮时露出来，向导会掐着潮汐表带人来看。"
      en: "The main island of the Pitukuviit Islands, about 10,400 km², the third largest island in the territory, in the Tavrulit Indigenous Autonomous Region. Its ground is gently rolling, its coasts are traditional seal and walrus hunting grounds, and rocks by the shore carry carvings of whales, seals and kayaks. Tavrulit hunters still hunt here by the seasons and share the catch with the whole village by old custom, and the carvings show only at low tide, so guides bring visitors by the tide table."
  - id: nat_dstxyg
    subtype: island
    status: generated
    detect: { kind: island, at_km: [205, 263] }
    names: { zh: 瑙卡克岛, en: Naukkaq Island, art-x-tavrunaq: Naukkaq }
    notes:
      zh: "皮图库维特群岛的第二大岛，面积约 1100 平方公里，在皮图克尤阿克岛东南，地势低平。岛名来自塔夫鲁利特猎人用来猎海豹的鱼叉。老猎人说，岛的形状就像一支斜放在海上的鱼叉，从皮图克尤阿克岛的高处看最清楚。"
      en: "The second island of the Pitukuviit Islands, about 1,100 km², south-east of Pitukjuaq Island and low-lying. It is named after the harpoon Tavrulit hunters use for seals. Old hunters say the island is shaped like a harpoon laid slantwise on the sea, best seen from the high ground of Pitukjuaq."

  # ── 纳卢维特群岛 ────────────────────────────────────────────
  - id: nat_5hdtr2
    subtype: island
    status: generated
    detect: { kind: island, at_km: [323, 311] }
    names: { zh: 纳卢尤阿克岛, en: Naallujuaq Island, art-x-tavrunaq: Naallujuaq }
    notes:
      zh: "纳卢维特群岛的主岛，面积约 7000 平方公里，最高处海拔五百多米。北冰洋极地研究所设在岛上，研究海冰、冻土与北极生态，每年夏季从这里派出科考船。科考船夏天出发时，研究所的人站在码头上敲一阵皮鼓送行，船上的人则把一面小旗挂上桅杆，直到秋天回港才取下。"
      en: "The main island of the Naalluviit Islands, about 7,000 km², rising to over 500 m. The Arctic Ocean Polar Research Institute stands here, studying sea ice, permafrost and Arctic ecology, and sends out its research ships every summer. When the research ship sails in summer the institute's staff see it off from the quay with a burst of skin drums, and those aboard hoist a small flag to the mast, not to come down until they return in autumn."
  - id: nat_r5e7sa
    subtype: island
    status: generated
    detect: { kind: island, at_km: [357, 324] }
    names: { zh: 普塔克岛, en: Puttaq Isle, art-x-tavrunaq: Puttaq }
    notes:
      zh: "纳卢维特群岛东部的小岛，面积约 880 平方公里，最高处海拔四百多米。研究所在周围海域布放的海洋浮标由这里维护，岛名由此而来。浮标每年秋天回收一次，维护人员说，浮标上挂满的海藻和贝壳，是它们在海上过了一年的「履历」。"
      en: "A small island in the east of the Naalluviit Islands, about 880 km², rising to over 400 m. The institute's ocean buoys in the surrounding waters are serviced from here, hence the name. The buoys are recovered every autumn, and the technicians say the weed and shells hanging from them are \"the record of their year at sea\"."
  - id: nat_2vhfdf
    subtype: island
    status: generated
    detect: { kind: island, at_km: [278, 347] }
    names: { zh: 阿卡尼尔维克岛, en: Aqqanirvik Isle, art-x-tavrunaq: Aqqanirvik }
    notes:
      zh: "纳卢维特群岛最北的小岛，面积约 590 平方公里，向北面对封冻的北冰洋，岛上设有观测海冰的站点。站里的观测员说，这里是「领地最后一块看得见海的地方」，再往北只有一望无际的海冰，冬天站屋的窗户上常常结着一层厚厚的冰花。"
      en: "The northernmost of the Naalluviit Islands, about 590 km², facing the frozen Arctic Ocean to the north, with a station that watches the sea ice. The observers say this is \"the last place in the territory where you can see open water\"; to the north there is only endless sea ice, and in winter the station windows are thick with frost flowers."

  # ── 西尔米乌维特群岛 ────────────────────────────────────────────
  - id: nat_99nd2b
    subtype: island
    status: generated
    detect: { kind: island, at_km: [452, 313] }
    names: { zh: 基库维克岛, en: Kiiquviq Island, art-x-tavrunaq: Kiiquviq }
    notes:
      zh: "西尔米乌维特群岛的主岛，面积约 2.87 万平方公里，是领地最大的岛屿，也是地势最高的岛：西尔米基克山纵贯全岛，主峰基克皮鲁克峰海拔 2236 米，山顶覆盖着基克西尔米冰帽。岛上没有常住居民，属西尔米乌维特冰盖管理区。冰川从山上流进海里，夏天冰崖崩落的轰鸣声隔着海峡都能听见，路过的船只总会放慢速度远远地看一会儿。"
      en: "The main island of the Sirmiuviit Islands, about 28,700 km², the largest island in the territory and also the highest; the Sirmikiiq Mountains run its length, their summit Mount Kiiqpirruk reaching 2,236 m under the Kiiqsirmi Ice Cap. No one lives here permanently; it belongs to the Sirmiuviit Islands Ice Cap Administration Zone. Glaciers flow from its mountains into the sea, and in summer the roar of calving ice cliffs can be heard across the strait; passing ships always slow down to watch from a distance."
  - id: nat_b3kk8p
    subtype: island
    status: generated
    detect: { kind: island, at_km: [520, 301] }
    names: { zh: 基库利克岛, en: Kiqqulik Island, art-x-tavrunaq: Kiqqulik }
    notes:
      zh: "西尔米乌维特群岛的第二大岛，面积约 2200 平方公里，在基库维克岛以东。基库维克岛冰川入海崩落的冰山常在附近漂过，岛名由此而来。冰山漂过时常在岛边搁浅，有的一搁就是一整个夏天，岛周围的海面因此像一座不断变换的冰雕展。"
      en: "The second island of the Sirmiuviit Islands, about 2,200 km², east of Kiiquviq Island. Icebergs calved from Kiiquviq Island's glaciers often drift past, hence the name. Drifting bergs often run aground along its shores, some staying the whole summer, so the sea around it is like an ever-changing ice-sculpture show."
  - id: nat_tfkcz1
    subtype: island
    status: generated
    detect: { kind: island, at_km: [570, 318] }
    names: { zh: 西尔米奥拉岛, en: Sirmiaulla Island, art-x-tavrunaq: Sirmiaulla }
    notes:
      zh: "西尔米乌维特群岛东端的小岛，面积约 980 平方公里，周围海面常年漂着浮冰，岛名由此而来。浮冰之间常有海豹爬上冰面晒太阳，冰山观测站的工作人员说这是「浮冰上的沙滩」。"
      en: "A small island at the eastern end of the Sirmiuviit Islands, about 980 km², surrounded by drifting ice for much of the year, hence the name. Seals often haul out on the floes to bask, which the iceberg-station staff call \"the beaches on the ice\"."

  # ── 乌瓦卡鲁库维特群岛 ──────────────────────────────────────────
  - id: nat_zrtk04
    subtype: island
    status: generated
    detect: { kind: island, at_km: [604, 290] }
    names: { zh: 乌瓦克岛, en: "Uvvaak Island", art-x-tavrunaq: Uvvaakuviq }
    notes:
      zh: "乌瓦卡鲁库维特群岛的主岛，面积约 9400 平方公里，「乌瓦克」在塔夫鲁纳克语中意为海象。岛的海滩是海象的聚居地，保护区的巡护站监测海象栖息地和北极熊的迁移，全岛禁止开发。夏天成千上万头海象挤在海滩上，远看像一片褐色的礁石，巡护员说它们的叫声在几公里外的船上都听得见。"
      en: "The main island of the Uvvaakkaruquviit Islands, about 9,400 km²; uvvaak is the Tavrunaq word for walrus. Its beaches are walrus haul-outs, the reserve's ranger station monitors the walrus grounds and the movements of polar bears, and the whole island is closed to development. In summer thousands of walruses crowd the beaches, from afar like a brown reef, and the rangers say their bellowing can be heard from boats kilometres away."
  - id: nat_6xq372
    subtype: island
    status: generated
    detect: { kind: island, at_km: [640, 263] }
    names: { zh: 卡鲁克岛, en: "Karuq Island", art-x-tavrunaq: Karuquviq }
    notes:
      zh: "乌瓦卡鲁库维特群岛的第二大岛，面积约 5500 平方公里，「卡鲁克」在塔夫鲁纳克语中意为熊。冬季北极熊沿海冰来到岛上，在积雪中筑窝产仔。小熊出生后要在雪窝里待到春天才出洞，这段时间全岛禁止任何人登陆，连巡护员也只在海上用望远镜观察。"
      en: "The second island of the Uvvaakkaruquviit Islands, about 5,500 km²; karuq is the Tavrunaq word for bear. In winter polar bears come over the sea ice and dig dens in the snow to give birth. Cubs born in the dens stay in the snow until spring, and through that time no one may land, not even the rangers, who watch from the sea with binoculars."
  - id: nat_6fra25
    subtype: island
    status: generated
    detect: { kind: island, at_km: [631, 317] }
    names: { zh: 图拉利克岛, en: Turralik Island, art-x-tavrunaq: Turralik }
    notes:
      zh: "乌瓦卡鲁库维特群岛的低平岛屿，面积约 4600 平方公里，最高处海拔只有一百多米，海岸是陡立的冰崖，岛名由此而来。冰崖在夏天的阳光下泛着蓝光，船只经过时要远远绕开，因为冰崖随时可能崩落一大块。"
      en: "A low, flat island in the Uvvaakkaruquviit Islands, about 4,600 km², rising only to a little over 100 m, its coast walled by sheer ice cliffs, hence the name. The ice cliffs glow blue in the summer sun, and ships give them a wide berth, since a great slab can break away at any moment."
  - id: nat_wbttjv
    subtype: island
    status: generated
    detect: { kind: island, at_km: [656, 296] }
    names: { zh: 普塔西尔米岛, en: Puttasirmi Island, art-x-tavrunaq: Puttasirmi }
    notes:
      zh: "乌瓦卡鲁库维特群岛东端的岛屿，面积约 1700 平方公里，冬春之际周围的海面布满浮冰，是海象和北极熊出没的地带。巡护员的小屋建在高处，屋顶上画着一个巨大的白熊图案，方便飞机在雪原上辨认。"
      en: "The island at the eastern end of the Uvvaakkaruquviit Islands, about 1,700 km²; in late winter and spring the sea around it fills with floes, the haunt of walruses and polar bears. The rangers' hut stands on high ground, a huge white bear painted on its roof so that aircraft can pick it out on the snowfield."

  # ── 乌库乌维特群岛 ────────────────────────────────────────────
  - id: nat_6y7y3n
    subtype: island
    status: generated
    detect: { kind: island, at_km: [644, 174] }
    names: { zh: 乌维克萨克岛, en: "Uviqsaaq Island", art-x-tavrunaq: Uviqsaaq }
    notes:
      zh: "乌库乌维特群岛的主岛，面积约 6600 平方公里，最高处海拔 783 米，是领地仅次于基库维克岛的高岛。乌维克萨克市的乌维克努卡港和机场在岛的一侧，其余大部分属乌库乌维特矿区管理区。岛上的最高处是全市孩子们最爱的远足地，晴天能望见群岛的每一座岛，岛民说这里是「看得见全市的地方」。"
      en: "The main island of the Ukkuuviit Islands, about 6,600 km², rising to 783 m, the highest island in the territory after Kiiquviq Island. Uviqsaaq City's harbour and airport are on one side of it, and most of the rest belongs to the Ukkuuviit Mining Administration Zone. The island's summit is the favourite outing of the city's children, and on clear days every island in the group can be seen from it; islanders call it \"the place where you can see the whole city\"."
  - id: nat_ps1ygb
    subtype: island
    status: generated
    detect: { kind: island, at_km: [654, 145] }
    names: { zh: 西卢奥库岛, en: Silluaukku Island, art-x-tavrunaq: Silluaukku }
    notes:
      zh: "乌库乌维特群岛南部的岛屿，面积约 2700 平方公里，地势低缓，乌库乌维特露天矿就在岛上，精矿运往乌维克努卡港装船。矿坑一圈圈向下的台阶从飞机上看得清清楚楚，像一只巨大的漏斗，岛上的孩子把矿里运出来的矿石叫作「彩色石头」。"
      en: "An island in the south of the Ukkuuviit Islands, about 2,700 km² and gently rolling; the Ukkuuviit Islands Open-Pit Mine is here, and its concentrate goes to the harbour for shipping. The rings of benches descending into the pit are plain to see from the air, like a giant funnel, and island children call the ore from it \"coloured stones\"."
  - id: nat_0mnzj7
    subtype: island
    status: generated
    detect: { kind: island, at_km: [632, 141] }
    names: { zh: 基蒂利克岛, en: Qittilik Island, art-x-tavrunaq: Qittilik }
    notes:
      zh: "乌库乌维特群岛西部的低平小岛，面积约 1100 平方公里，最高处海拔一百多米。岛上的岩石含磁铁矿，罗盘在这里会偏转，岛名由此而来。来岛上考察的学生第一件事就是掏出罗盘看指针乱转，岛上的老向导干脆只靠太阳和海岸线认路。"
      en: "A low, small island in the west of the Ukkuuviit Islands, about 1,100 km², rising to a little over 100 m. Its rocks contain magnetite that turns compass needles, hence the name. The first thing visiting students do is take out a compass to watch the needle wander, and the old guides simply find their way by the sun and the shoreline."
  - id: nat_wrjnnn
    subtype: island
    status: generated
    detect: { kind: island, at_km: [660, 203] }
    names: { zh: 阿考库岛, en: Aqqaukku Island, art-x-tavrunaq: Aqqaukku }
    notes:
      zh: "乌库乌维特群岛最北的岛屿，面积约 670 平方公里，最高处海拔近五百米，是矿区勘探中的岛屿。勘探队夏天在岛上扎营，营地的帐篷排成一行，远看像一串彩色的纽扣钉在灰色的山坡上。"
      en: "The northernmost of the Ukkuuviit Islands, about 670 km², rising to nearly 500 m, and under exploration by the mining zone. Survey teams camp here in summer, their tents in a line that from afar looks like a string of coloured buttons sewn onto the grey hillside."

  # ── 卡瓦卢维特群岛 ────────────────────────────────────────────
  - id: nat_vv2c47
    subtype: island
    status: generated
    detect: { kind: island, at_km: [523, 42] }
    names: { zh: 卡瓦卢格尤阿克岛, en: Qavvalugjuaq Island, art-x-tavrunaq: Qavvalugjuaq }
    notes:
      zh: "卡瓦卢维特群岛的主岛，面积约 1.12 万平方公里，是领地第二大岛。岛上地势低平、远离城市灯光，冬季夜空开阔，卡瓦卢维特观光度假村的玻璃屋顶客房就散布在岛上。度假村给每位客人一个「极光闹钟」，夜里极光一出现，前台就挨个打电话叫醒客人，有人一个冬天被叫醒十几次也毫无怨言。"
      en: "The main island of the Qavvaluviit Islands, about 11,200 km², the second largest island in the territory. It is low and flat, far from city lights and open to the winter sky, and the glass-roofed rooms of the Qavvaluviit Islands Resort are scattered across it. The lodge gives every guest an \"aurora alarm\": when the lights appear at night, reception rings each room in turn, and some guests are woken a dozen times in a winter without complaint."
  - id: nat_95v2tq
    subtype: island
    status: generated
    detect: { kind: island, at_km: [574, 51] }
    names: { zh: 温纳塔克岛, en: Unnataq Island, art-x-tavrunaq: Unnataq }
    notes:
      zh: "卡瓦卢维特群岛东部的岛屿，面积约 3000 平方公里，最高处海拔四百多米。冬季极夜漫长，岛名由此而来，岛上有观赏极光的小屋和步道。步道沿途的小屋里备着柴火、热茶和毯子，看极光的人可以在屋里等，极光一出来就推门出去。"
      en: "An island in the east of the Qavvaluviit Islands, about 3,000 km², rising to over 400 m. It is named for the long polar night, and has huts and trails for watching the aurora. The huts along the trail keep firewood, hot tea and blankets, so aurora-watchers can wait indoors and step out the moment the lights appear."
  - id: nat_y023md
    subtype: island
    status: generated
    detect: { kind: island, at_km: [546, 60] }
    names: { zh: 库拉克岛, en: Qurrak Isle, art-x-tavrunaq: Qurrak }
    notes:
      zh: "卡瓦卢维特群岛的小岛，面积约 470 平方公里，在卡瓦卢格尤阿克岛与温纳塔克岛之间。岛名来自极光常见的绿色光带。岛上没有灯，冬夜里只有极光照亮雪地，游船经过时会熄掉所有灯光，让乘客在黑暗里看极光倒映在水面上。"
      en: "A small island in the Qavvaluviit Islands, about 470 km², between Lightcurtain and Longnight islands. It is named after the green bands that are the aurora's commonest colour. There are no lights on the isle, only the aurora on the snow on winter nights, and passing boats switch off every lamp so passengers can watch it mirrored on the water in the dark."

  # ── 乌利库维特群岛 ────────────────────────────────────────────
