      en: "An archipelago in the far north-east of the territory, made up of Uvvaak, Karuq, Ice Cliff and Floe islands, about 21,100 km² in all; its name joins the words for walrus and bear, and all of it is a reserve for walruses and polar bears. Only rangers and permitted researchers may enter the reserve; visitors watch from boats offshore, often seeing walruses and polar bears in the same binocular view."
  - id: nat_m6cr39
