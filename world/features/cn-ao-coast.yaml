      en: "A small island in the west of the Tuunnaquviit Islands, about 830 km². Waves rushing into the gaps between its columns sound like an organ, hence the name. On rough days the \"organ\" among the columns sounds loudest, and fishermen say that when you hear it singing, it is time to head for harbour."

