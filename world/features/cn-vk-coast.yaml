    detect: { kind: bay, at_km: [65.2, 146.2] }
    names: { zh: 托克维克湾, en: Tåkevik Bay, art-x-viking: Tåkevikbucht, art-x-buckham: Baia della Nebbia }
    notes:
      zh: 阿克斯岛西岸的海湾，面积一百六十多平方公里，湾岸分属托克维克市托克维克区和阿克斯维克市西爪区。从大洋吹来的湿润西风在锚链山前凝结成雾，使托克维克湾一年中大部分清晨都笼罩在海雾里，港口的雾笛和灯塔昼夜为渔船指引方向，海湾和城市都由此得名。湾畔的托克维克湾渔港是阿克斯岛西岸的主要渔港，托克维克湾老城依山而建，彩色的木屋沿陡坡层层排列，鱼市和海鲜餐馆是游客必到之处。阿托高速以隧道穿过锚链山主脊，再到达湾畔，是西岸通往阿克斯维克的快速通道；雾湾公路从湾畔的渔港出发，向东北接上沿西岸北上通往富鲁海姆的阿克斯岛峡湾公路。
      en: A bay on the west coast of Akkersey, a little over 160 km², its shores shared between Tåkevik District of Tåkevik City and West Fluke District of Akkersvik. Moist westerlies off the ocean condense into fog against the Anchor Chain Mountains, so that on most mornings of the year the bay lies under sea mist, with the harbour's foghorn and lighthouse guiding the fishing boats day and night; both bay and city take their name from it. Tåkevik's fishing harbour on the bay is the main fishing port of Akkersey's west coast, and the old town climbs the hillside in tiers of painted wooden houses, with a fish market and seafood restaurants no visitor misses. The Akkersvik–Tåkevik Expressway tunnels through the main ridge of the Anchor Chain Mountains and reaches the bay, the fast link from the west coast to Akkersvik, and the Fog Bay Road runs north-east from the port on the bay to join the Akkersey Fjord Road on its way north up the coast to Furuheim.
  - id: nat_3w3ayk
