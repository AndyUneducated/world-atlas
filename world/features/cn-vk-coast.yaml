    notes:
      zh: 群岛北部的小岛，面积近两百平方公里，位于长船岛西北岸外，属长船市西岸区，是离北维京岛最近的岛屿之一。岛上的哈洛兰岛灯塔标出从北方进入群岛的航路，也是从北维京岛驶来的船只最先望见的灯光之一，旧时水手称它为「北门」。哈洛兰岛地势低平，最高处一百三十多米，岛上除灯塔外只有零星的牧场和渔屋。从长船西岸区的海滨公园望去，西北海面上的哈洛兰岛灯塔是西岸的标志，夏季傍晚，居民在海边看着灯塔亮起，夕阳沉入它身后的海面。
      en: An islet in the north of the archipelago, nearly 200 km², lying off the north-west shore of Longship Island in West Shore District of Longship City, and one of the islands nearest North Viking Island. The Halloran Island Lighthouse on it marks the way into the islands from the north and is among the first lights seen by ships coming from North Viking Island, and old sailors called it the north gate. The island is low, rising to just over 130 m, and apart from the lighthouse has only a few pastures and fishermen's huts. From the seaside parks of West Shore the lighthouse on the north-western horizon is the district's emblem, and on summer evenings people on the shore watch it light up as the sun sets into the sea behind it.
  - id: nat_zr2zjt
