    names: { zh: 东爪岬, en: East Fluke, art-x-viking: Ostflunke, art-x-buckham: Marra Est }
    notes:
      zh: 阿克斯维克湾东侧的岬角，属阿克斯维克市阿克斯维克区，面向阿克斯海峡口，与西侧的西爪岬一起如锚的两爪抱住阿克斯维克湾，岬名由此而来。东爪岬上的灯塔为进出阿克斯维克湾的船只导航，大型集装箱船和散货船从岬旁驶入群岛最大的集装箱港。岬外就是阿克斯海峡的南口，阿斯跨海高速从阿克斯维克湾出发跨越海峡口通往长船岛的斯蒂尔维克，从岬上可以望见跨海长桥伸向东南的海面。岬角的草坡上是观景步道，傍晚常有阿克斯维克人来这里看货轮进港。
      en: The cape on the east side of Akkersvik Bay, in Akkersvik District of Akkersvik, facing the mouth of Akkersey Strait; with West Fluke to the west it holds the bay like the two flukes of an anchor, hence its name. The lighthouse on East Fluke guides ships in and out of Akkersvik Bay, and big container ships and bulk carriers pass close by on their way into the largest container port in the islands. Beyond the cape lies the southern mouth of Akkersey Strait, which the Akkersvik–Styrvik Sea Crossing spans from Akkersvik Bay to Styrvik on Longship Island, and from the headland you can see its long bridge reaching away to the south-east. A path runs along the grassy top, and in the evenings Akkersvik people often come out to watch the freighters come in.
  - id: nat_15mbb9
    subtype: cape
    status: generated
    detect: { kind: cape, at_km: [148.2, 52.8] }
