    names: { zh: 雾湾, en: Mist Bay, art-x-viking: Nebelbucht, art-x-buckham: Baia della Nebbia }
    notes:
      zh: 锚岛西岸的海湾，面积一百六十多平方公里，湾岸分属雾湾市雾湾区和锚港市西爪区。从大洋吹来的湿润西风在锚链山前凝结成雾，使雾湾一年中大部分清晨都笼罩在海雾里，港口的雾笛和灯塔昼夜为渔船指引方向，海湾和城市都由此得名。湾畔的雾湾渔港是锚岛西岸的主要渔港，雾湾老城依山而建，彩色的木屋沿陡坡层层排列，鱼市和海鲜餐馆是游客必到之处。锚雾高速以隧道穿过锚链山主脊，再以雾湾高架桥到达湾畔，是西岸通往锚港的快速通道；锚岛峡湾公路也从湾畔经过，沿西岸北上通往松林。
      en: A bay on the west coast of Anchor Island, a little over 160 km², its shores shared between Mistbay District of Mistbay City and West Fluke District of Anchorhaven. Moist westerlies off the ocean condense into fog against the Anchor Chain Mountains, so that on most mornings of the year the bay lies under sea mist, with the harbour's foghorn and lighthouse guiding the fishing boats day and night; both bay and city take their name from it. Mistbay's fishing harbour on the bay is the main fishing port of Anchor Island's west coast, and the old town climbs the hillside in tiers of painted wooden houses, with a fish market and seafood restaurants no visitor misses. The Anchorhaven–Mistbay Expressway tunnels through the main ridge of the Anchor Chain Mountains and reaches the bay on the Mistbay Viaduct, the fast link from the west coast to Anchorhaven, and the Anchor Island Fjord Road passes the bay on its way north up the coast to Pinewood.
  - id: nat_3w3ayk
    subtype: bay
    status: generated
    detect: { kind: bay, at_km: [126.2, 198.2] }
    names: { zh: 松湾, en: Pine Bay, art-x-viking: Kiefernbucht, art-x-buckham: Baia dei Pini }
    notes:
      zh: 锚岛东北端的海湾，面积两百多平方公里，属松林市松林区，四周松林环绕。湾畔的松林镇是松林市的中心，湾边是锯木厂、木材码头和木结构的小镇，镇上有一条以木工坊、皮具店和猎人商店为主的老街，木材从这里装船运往锚港和群岛各地。湾外是霜岛自然保护区，冬季常有海冰和霜雾；锚岛峡湾公路沿西岸经雾湾、峡湾北上到达松湾，锚岛纵贯高速也从锚港通往这里。松林间的步道通往锚岛最高峰铁锚峰和锚链冰川，夏季游客在湾畔的森林木屋住下，再徒步上山。
      en: A bay at the north-eastern end of Anchor Island, a little over 200 km², in Pinewood District of Pinewood City, ringed by pine forest. The town of Pinewood on its shore is the city's centre, with sawmills, timber quays and wooden houses along the water and an old street of woodworkers, leather shops and hunters' outfitters; timber is shipped from here to Anchorhaven and across the islands. Off the bay lies the Frost Isle Nature Reserve, often wrapped in sea ice and frost fog in winter. The Anchor Island Fjord Road comes north up the west coast by way of Mist Bay and the fjords to reach Pine Bay, and the Anchor Island Spine Expressway runs here from Anchorhaven too. Trails through the pines lead to Iron Anchor Peak, the island's highest summit, and the Anchor Chain Glacier, and in summer visitors stay in forest cabins by the bay before setting off on foot.
  - id: nat_nzwany
    subtype: bay
    status: generated
    detect: { kind: bay, at_km: [97.2, 50.8] }
    names: { zh: 温泉湾, en: Hot Springs Bay, art-x-viking: Thermenbucht, art-x-buckham: Baia delle Terme }
    notes:
      zh: 暖泉岛东岸的海湾，面积三百六十多平方公里，属暖泉市温泉区，湾畔的海滩下涌出温泉，海湾由此得名。温泉酒店、疗养院与会议度假村沿温泉湾和山坡排开，群岛最大的暖泉温泉度假村拥有数十个露天温泉池，冬季客人泡在热气腾腾的池水里仰望极光，是群岛最有名的体验。湾外是浮石岛，岛与暖泉岛之间的暖泉海峡是从长船岛船尾前往暖泉的海上航道。暖泉环山公路从温泉区出发，环绕暖泉火山经黑沙、硫磺湾和岩港通往落日；湾的东端是伸向长船岛方向的温泉岬。
      en: A bay on the east coast of Warmspring Island, a little over 360 km², in Hot Springs District of Warmspring City; hot springs well up beneath its beaches, which gave it its name. Spa hotels, sanatoriums and conference resorts line the bay and the slopes behind, and the Warmspring Spa Resort, the largest in the islands, has dozens of open-air pools where winter guests soak in the steam and gaze up at the aurora, the most famous experience in the islands. Pumice Isle lies off the bay, and the Warmspring Strait between it and the main island is the sea route from Longship's stern to Warmspring. The Warmspring Volcano Road sets off from Hot Springs District and circles the volcano by way of Black Sand, Sulphur Bay and Rockhaven to Sunset; at the eastern end of the bay Hot Springs Point reaches out towards Longship Island.
  - id: nat_qq80wg
    subtype: bay
