    names: { zh: 硫磺湾, en: Sulphur Bay, art-x-viking: Schwefelbucht, art-x-buckham: Baia dello Zolfo }
    notes:
      zh: 暖泉岛南岸的海湾，面积近三百平方公里，属硫磺湾市硫磺湾区，湾底的喷气孔让海水泛着硫磺味，海湾和城市都由此得名。湾边的地热田里喷气孔冒着白色的蒸汽，泥火山咕嘟作响，岩石被硫磺染成黄色和橙色，地热步道和观景台让游客可以安全地近距离观看；地热电站排出的温水汇入海边的露天温泉浴场。温室区沿着地热管道成片排列，冬季的黑夜里亮着补光灯，从远处看像一片发光的湖面。湾口外是火山灰堆成的灰岛，暖泉南环高速以十公里长的硫磺湾高架桥经过湾畔，是这条高速上最长的桥梁。
      en: A bay on the south coast of Warmspring Island, nearly 300 km², in Sulphur Bay District of Sulphur Bay City; vents on its floor give the water a smell of sulphur, and both bay and city take their name from it. On the geothermal field by the shore fumaroles send up white steam, mud pots bubble and the rocks are stained yellow and orange, with walkways and viewing platforms that let visitors come close in safety, and warm water from the power station feeds an open-air bathing lagoon by the sea. Greenhouses stand in rows along the heating mains, their grow-lights shining through the winter dark like a glowing lake. Off the mouth lies Ash Isle, built of volcanic ash, and the Warmspring Southern Arc Expressway passes the bay on the 10 km Sulphur Bay Viaduct, the longest bridge on that road.
  - id: nat_k4q61d
    subtype: bay
    status: generated
    detect: { kind: bay, at_km: [14.8, 153.2] }
    names: { zh: 观鲸湾, en: Whalewatch Bay, art-x-viking: Walschaubucht, art-x-buckham: Baia delle Balene }
    notes:
      zh: 鲸岛北岸的海湾，面积一百九十多平方公里，属外屿市鲸岛区，观鲸船从这里出海，海湾由此得名。每年夏季，座头鲸、虎鲸和小须鲸沿外屿的海域洄游，在观鲸湾里觅食，几乎每次出海都能看到鲸鱼喷水、跃身和摆尾，观鲸是鲸岛最重要的旅游项目。湾的东北面是海雀岛，两岛之间的海雀水道上横跨着外屿跨海公路的海雀水道跨海大桥，桥面设有观鲸平台。鲸岛观鲸中心的研究人员常年在湾里观测和保护鲸群，记录鲸鱼的数量和迁徙路线。夏夜的湾面上，常能听到鲸鱼的歌声。
      en: A bay on the north coast of Whale Isle, a little over 190 km², in Whale Isle District of Outer Isles City, where the whale-watching boats set out, hence its name. Every summer humpback, killer and minke whales migrate through the waters of the Outer Isles and feed in the bay, and almost every trip sees whales blowing, breaching and lobtailing; whale-watching is Whale Isle's most important attraction. Puffin Isle lies to the north-east, and across Puffin Sound between the two islands runs the Puffin Sound bridge of the Outer Isles Causeway, with whale-watching platforms on its deck. Researchers from the Whale Isle Whale Centre observe and protect the whales in the bay year round, recording their numbers and routes. On summer nights whale song can often be heard across the water.

  # ── Capes ────────────────────────────────────────────────
  - id: nat_6tf7yp
