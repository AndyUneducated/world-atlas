    names: { zh: 埃德文海峡, en: Edevane Strait, art-x-viking: Edevanestraße, art-x-buckham: Stretto di Edevane }
    notes:
      zh: 阿夫琳岛与埃德文岛之间的海峡，宽近三十公里，属埃德文港市埃德文港区。海峡里大片浅水滩涂随潮水涨落时隐时现，是候鸟迁徙的重要停歇地，春秋两季鹬类、鸻类和雁鸭成群聚集，成千上万的水鸟在这里觅食。埃德文港公路的大半路段位于埃德文海峡跨海大桥上，这座近二十九公里长的低矮长桥贴着滩涂延伸，桥下潮水自由进出，水鸟栖息地得以保留；候鸟季节桥上禁止停车，观鸟需到两端的观测点。渡轮也穿过海峡往返埃德文岛与阿夫琳岛的灯塔区。
      en: "The strait between Aveline Island and Edevane Island, nearly 30 km wide, in Port Edevane District of Port Edevane. Broad shallow mudflats in the strait appear and vanish with the tide and are a major stopover for migrating birds: every spring and autumn waders, plovers, geese and ducks gather in their thousands to feed. Most of the Port Edevane Road runs on the Edevane Strait bridge, a low span nearly 29 km long laid along the flats, with the tide flowing freely beneath it so that the birds' habitat survives; stopping on the bridge is banned in the bird season, and birdwatchers use the observation points at either end. Ferries also cross the strait between Port Edevane and Lighthouse District on Aveline Island."
  - id: nat_jrnd2d
