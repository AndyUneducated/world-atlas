      en: "The large bay on the north-west side of Longship Island's bow, a little over 500 km², sheltered by North Cape and the largest bay on the island's north-west coast; its shores belong to North Cape and West Shore districts of Longship. The University of the Islands has its main campus on the hillside above it, and its oceanography students and staff often take their observations and fieldwork out on the bay. Longship International Airport stands on the flat land of North Cape; the Longship Airport Expressway follows the shore into the cape on viaduct, and the Longship North-West Shore Road also arrives along the coast through West Shore. The water is wide and open: on the West Shore side a chain of seaside parks, beaches and cycle paths draws people out on summer evenings to stroll and watch the sunset, while sheep still graze the slopes on the North Cape side."
