    names: { zh: 瓦克特岛, en: Vaktey, art-x-viking: Vaktey, art-x-buckham: Isola della Vedetta }
    notes:
      zh: "瓦克特岛是长船岛船首外的小岛，面积十五平方公里左右，是群岛已命名岛屿中最小的一座，位于北岬以东，属长船市北岬区，隔四公里宽的瓦克特水道与长船岛相望。维京时代，人们在岛顶点燃烽火，预警从北方驶来的船只，湾内的村落望见火光便会戒备，岛名由此而来，维京语里的「瓦克特」就是守望的意思，旁边的瓦克特维克湾和瓦克特水道也因它得名。\n岛上保留着烽火台的石基，最高处只有三十多米，全岛是低矮的草坡和礁石，只有海鸟和偶尔上岛放羊的牧人。瓦克特水道是从北方进出长船的航道，从北维京岛方向驶来的船只绕过船首，经水道南下，再沿东岸驶入长船湾的港口。如今维长高速的维京海底公路隧道从岛下的海底穿过，一条直线连接北维京岛的维京港与长船古城，车辆在海底行驶，海面上的瓦克特岛依旧安静；北面不远的斯塔文内斯岬，维长真空磁悬浮的海底隧道也在那里出地面。\n从北岬一带的海岸和瓦克特维克湾畔的山坡，可以望见它低伏在水道外的身影。北岬的老人说，过去渔船夜归，只要看见瓦克特岛的黑影就知道快到家了；如今海底隧道里的司机看不见它，却总有人在经过时想起，头顶上就是那座点过烽火的小岛。"
      en: "Vaktey is an islet off Longship Island's bow, about 15 km² and the smallest of the named islands, lying east of North Cape in North Cape District of Longship City and facing Longship across the four-kilometre Vaktsund. In the Viking age a beacon was lit on its top to warn of ships approaching from the north, and the villages in the bay would stand ready when they saw the fire; that gave the island its name, \"vakt\" meaning watch in Viking, and the neighbouring Vaktvik Bay and Vaktsund are named after it in turn.\nThe stone base of the beacon survives on its top, which is only just over 30 m high; the rest is low grass and rock, visited by seabirds and the occasional shepherd who brings sheep across. Vaktsund is the fairway into Longship from the north: ships coming from the direction of North Viking Island round the bow, run south through the sound and follow the east coast into the harbours of Longship Bay. Today the Viking Undersea Road Tunnel of the Viking Port–Longship Expressway passes beneath the seabed under the island, running in a straight line from Viking Port on North Viking Island to Longship's old town; the traffic flows under the sea while Vaktey above stays quiet, and at Stavnnes, a little to the north, the undersea tunnel of the Vacuum Maglev also comes to the surface.\nIts low outline can be seen beyond the sound from the North Cape shore and the hills above Vaktvik Bay. Old people in North Cape say that fishing boats coming home at night knew they were nearly there when they saw Vaktey's dark shape; drivers in the undersea tunnel cannot see it, yet some still remember as they pass that above them is the little island where the beacon once burned."
  - id: nat_37jgdq
    subtype: island
    status: generated
    detect: { kind: island, at_km: [130.2, 58.2] }
    names: { zh: 托利文特岛, en: Tollivant Island, art-x-viking: Tollivantinsel, art-x-buckham: Isola Tollivant }
    notes:
      zh: "托利文特岛是长船岛船尾、阿夫琳岛与西格利岛之间的小岛，面积两百四十多平方公里，属西格拉维克市西格拉维克区。三岛之间的航道在这里交汇，长约三百公里的阿夫琳海峡的南端也从岛旁经过，岛名是殖民时代沿用下来的姓氏。岛的北面是引水岛，进出阿夫琳海峡的大船在这一带接送引航员，船只在三岛之间的水道中流穿行。\n岛上地势起伏，最高处两百五十多米，草坡上牧放着羊群，几座小渔村散布在避风的海湾里。渔民的船和西格拉维克渔港的船一样，在周边海域捕捞鳕鱼、鲱鱼和扇贝，晴天时还会划小艇去引水岛一带钓鱼。岛上没有公路干线，只有连接渔村和牧场的土路，居民进城要先坐船到西格利岛，再转车去西格拉维克。冬季西风大作时，渡船常常停航，岛上的人家早已习惯在屋里囤好面粉、咸鱼和羊毛线，围着炉火织一冬天的毛衣。\n从岛的高处可以同时望见长船岛的船尾、阿夫琳岛西南端的山岭和西格利岛的松林，海峡里的大船一艘接一艘从脚下驶过。岛上的牧羊人说，在这里放羊得学会看船：远处有引航船靠上大船，就说明快到中午了，因为引航员总在潮水最平稳的时候登船。"
      en: "Tollivant Island is an islet between Longship Island's stern, Aveline Island and Sigley, a little over 240 km², in Siglavik District of Siglavik City. The channels between the three islands meet here and the southern end of the 300 km Aveline Strait passes beside it; its name is a surname handed down from colonial times. Pilot Isle lies to the north, where big ships bound in and out of the strait pick up and drop their pilots, and ships thread midstream through the channels between the three islands.\nThe island is hilly, rising to just over 250 m; sheep graze its grassy slopes, and a few small fishing villages shelter in its coves. Like those of Siglavik's fishing harbour, its boats take cod, herring and scallops in the surrounding waters, and on fine days the fishermen row out to fish around Pilot Isle. There is no main road, only dirt tracks between the villages and the pastures, and to go to town the islanders first take a boat to Sigley and then a bus to Siglavik. When the westerlies blow hard in winter the boats are often cancelled, and island households are long used to laying in flour, salt fish and knitting wool and spending the winter knitting jumpers by the stove.\nFrom the island's high ground you can see Longship's stern, the hills at the south-western end of Aveline Island and the pine forests of Sigley all at once, while big ships pass one after another below. The island's shepherds say that to keep sheep here you have to learn to read the ships: when a pilot boat draws alongside a big ship in the distance it is nearly noon, because the pilots always board when the tide is at its calmest."
  - id: nat_myqvrf
    subtype: island
    status: generated
    detect: { kind: island, at_km: [14.2, 228.2] }
    names: { zh: 艾因谢尔岛, en: Einsker, art-x-viking: Einsker, art-x-buckham: Scoglio Solitario }
    notes:
      zh: "艾因谢尔岛是群岛最西、也是最西北的无人小岛，面积一百四十平方公里左右，位于乌利克尤阿克岛外海，属乌利克尤阿克市乌利克尤阿克区，与乌利克尤阿克岛、赫里姆岛同在群岛的最北端。艾因谢尔岛孤零零地立在外海，四周没有别的岛屿，岛名由此而来，意思是「孤礁」。\n岛上是裸露的礁石和草坡，最高处两百多米，西面直接迎着大洋，长年的风浪把海岸切成陡峭的崖壁，崖下堆满了被浪磨圆的巨石。礁石上的灯塔为渔船指引方向，它是岛上唯一的建筑，无人值守，维护人员只在风平浪静的夏日乘船上岛检修一次。海鸟在崖壁上栖息，夏季的崖壁上鸟声不断，海浪退去时，礁石缝里还能看到海星和海胆。周围的海域是乌利克尤阿克渔民的传统渔场，冷水里鳕鱼成群，鳕鱼汛期时，渔船常在艾因谢尔岛附近作业，遇到风暴就到岛的背风面避风，几艘船并排抛锚，船员们隔着船舷互相递咖啡和烟。\n对乌利克尤阿克的渔民来说，艾因谢尔岛是渔场的界碑，也是回家路上的第一个记号：从外海返航，先看见它的灯塔，再往东开几个小时，就能闻到镇上鱼干架的味道。老渔民教年轻人认路时总说，「找不到艾因谢尔，就说明你走得太远了」。"
      en: "Einsker is the westernmost and most north-westerly island in the archipelago, an uninhabited islet of about 140 km² lying off Ulikjuaq Island in Ulikjuaq District of Ulikjuaq City, and with Ulikjuaq Island and Hrimey it lies at the very top of the archipelago. It stands alone in the outer sea with no other island around it, hence its name, meaning \"lonely skerry\".\nThe island is bare rock and grass, rising to just over 200 m; its western side faces straight onto the ocean, and years of wind and waves have cut the coast into steep cliffs with wave-rounded boulders piled below. A lighthouse on the rocks guides fishing boats; it is the only building on the island and is unmanned, and maintenance crews land only once a year, on a calm summer day, to service it. Seabirds nest on the cliffs, in summer the cliffs ring with their calls, and when the waves draw back, starfish and sea urchins can be seen in the cracks of the rocks. The surrounding waters are the traditional grounds of Ulikjuaq's fishermen, with cod shoaling in the cold water; in the cod season boats often fish near Einsker and run for its lee when a storm comes, several anchoring side by side while the crews pass coffee and cigarettes across the rails.\nFor Ulikjuaq's fishermen Einsker is the boundary stone of the grounds and the first landmark on the way home: coming in from the open sea you see its lighthouse first, and a few hours further east you can smell the drying racks of the town. When old fishermen teach the young ones the way they always say: \"If you can't find Einsker, you've gone too far.\""
  - id: nat_k3jb4e
    subtype: island
    status: generated
    detect: { kind: island, at_km: [170.2, 211.8] }
    names: { zh: 哈洛兰岛, en: Halloran Island, art-x-viking: Halloraninsel, art-x-buckham: Isola Halloran }
    notes:
      zh: "哈洛兰岛是群岛北部的小岛，面积近两百平方公里，位于长船岛西北岸外，属长船市西岸区，是离北维京岛最近的岛屿之一。岛上的哈洛兰岛灯塔标出从北方进入群岛的航路，也是从北维京岛驶来的船只最先望见的灯光之一，旧时水手称它为「北门」，岛名则是殖民时代留下的姓氏。\n哈洛兰岛地势低平，最高处一百三十多米，岛上除灯塔外只有零星的牧场和渔屋，羊群在草坡上吃草，海鸟在礁石上栖息。冬季北风从海上直灌过来，浪花打上礁岩，灯塔的光束在风雨里一明一灭，为驶向长船的船只照路。从北维京岛乘船回来的群岛人都把它的灯光当作「快到家了」的信号，灯塔下挂着一块牌子，用维京语写着「欢迎回到群岛」，渡轮经过时，甲板上常有人举起手机，隔着海面拍下这块牌子和灯塔的白色塔身。\n从长船西岸区的海滨公园望去，西北海面上的哈洛兰岛灯塔是西岸的标志。西岸区住着四十万人，许多是从群岛各岛和北维京岛迁来的年轻家庭，夏季傍晚，居民在海边散步、野餐，看着灯塔亮起，夕阳沉入它身后的海面。孩子们说，灯塔亮了就该回家吃晚饭了，西岸的父母于是省了不少喊人的力气。"
      en: "Halloran Island is an islet in the north of the archipelago, nearly 200 km², lying off Longship Island's north-west coast in West Shore District of Longship City, one of the islands closest to North Viking Island. Its Halloran Island Lighthouse marks the route into the islands from the north and is one of the first lights seen by ships coming from North Viking Island; old sailors called it \"the North Gate\", and the island's name is a surname left from colonial times.\nThe island is low and flat, rising only to a little over 130 m, and apart from the lighthouse there are only a few scattered pastures and fishermen's huts; sheep graze the grassy slopes and seabirds nest on the rocks. In winter the north wind drives straight in off the sea, spray breaks over the rocks, and the beam of the lighthouse flashes through wind and rain to light the way for ships bound for Longship. Islanders coming home by sea from North Viking Island take its light as the sign that they are \"nearly home\", and a sign at the foot of the lighthouse says \"Welcome back to the islands\" in Viking; as the ferries pass, people on deck often hold up their phones to photograph the sign and the white tower across the water.\nSeen from the seaside parks of Longship's West Shore District, the lighthouse out on the north-western sea is the emblem of the shore. West Shore has 400,000 people, many of them young families who have moved from the other islands and North Viking Island, and on summer evenings residents stroll and picnic by the sea, watching the light come on as the sun sinks into the sea behind it. Children say that when the lighthouse comes on it is time to go home for dinner, which saves West Shore's parents a good deal of shouting."
  - id: nat_zr2zjt
    subtype: island
    status: generated
    detect: { kind: island, at_km: [120.2, 227.8] }
    names: { zh: 赫里姆岛, en: Hrimey, art-x-viking: Hrimey, art-x-buckham: Isola del Gelo }
    notes:
      zh: "赫里姆岛是阿克斯岛以北的无人岛，面积一百八十多平方公里，最高处 143 米，属富鲁海姆市富鲁海姆区，位于富鲁海姆湾外海，与艾因谢尔岛、乌利克尤阿克岛同在群岛的最北端。赫里姆岛每年冬季最早结霜，岛名由此而来，维京语里的「赫里姆」就是白霜，冬季常有海冰和霜雾笼罩。\n岛上是苔原、湿地和海鸟栖息地，全岛划为赫里姆岛自然保护区，苔原与海鸟崖保持原貌，是观察北极狐和海鸟的好地方，与锚链冰川一起是富鲁海姆最受欢迎的自然景点。保护区严格限制登岛，只允许科考人员上岸；岛上没有码头，科考人员只能在风平浪静的日子乘小艇登岸，赶上风暴就要在岛上的小屋里多住几天。夏季有向导带领小船从富鲁海姆镇出发，沿岸观察筑巢的海鸟，游客在船上就能看到崖壁上密密麻麻的鸟巢和在苔原上奔跑的北极狐。北极狐夏天毛色灰褐，冬天换成雪白，和岛上的白霜几乎分不出来。\n巡护员说，这里的海鸟从没见过游客，所以一点也不怕人，小艇靠近崖下时，它们只是歪着头看一眼，又继续忙着喂雏鸟。富鲁海姆人则把赫里姆岛当作冬天的报信者：哪天早上望见湾外的小岛白了一层，就该把木屋的柴火堆满，准备过冬了。"
      en: "Hrimey is an uninhabited island north of Akkersey, a little over 180 km² and rising to 143 m, in Furuheim District of Furuheim City, lying off Furuheim Bay; with Einsker and Ulikjuaq Island it lies at the very top of the archipelago. It is the first place in the islands to see frost each winter, hence its name, \"hrim\" meaning hoar frost in Viking, and in winter it is often wrapped in sea ice and frost fog.\nThe island is tundra, wetland and seabird colonies, all of it in the Hrimey Nature Reserve, where the tundra and bird cliffs are kept untouched; it is a fine place to watch arctic foxes and seabirds and, with the Anchor Chain Glacier, Furuheim's most popular natural attraction. Landing is strictly limited to researchers; there is no jetty, so they can only come ashore by dinghy on calm days, and if a storm blows up they must stay on in the island's hut for a few more days. In summer guides take small boats out from the town of Furuheim to watch the nesting seabirds along the shore, and from the boats visitors can see the crowded nests on the cliffs and arctic foxes running across the tundra. The foxes are greyish brown in summer and turn snow-white in winter, almost invisible against the island's frost.\nThe rangers say the birds here have never seen tourists, so they are not in the least afraid; when a dinghy comes in under the cliffs they just cock their heads for a look and go back to feeding their chicks. Furuheim people treat Hrimey as winter's herald: the morning they see the islet beyond the bay turned white, it is time to fill the woodshed and get ready for winter."
  - id: nat_eb28w4
    subtype: island
    status: generated
    detect: { kind: island, at_km: [16.2, 157.8] }
    names: { zh: 伦达霍尔姆岛, en: Lundaholm, art-x-viking: Lundaholm, art-x-buckham: Isola delle Pulcinelle }
    notes:
      zh: "伦达霍尔姆岛是瓦莱岛东北的小岛，面积近两百平方公里，最高处近 200 米，属乌维克库特市瓦莱区，隔着三公里宽的伦达霍尔姆水道与瓦莱岛相望。每年夏季，数万只海雀和海鹦在岛上的草坡上挖洞筑巢，岛名由此而来，维京语里的「伦达」就是海鹦。夏日的傍晚，成群的海鹦叼着小鱼从海上飞回巢穴，橙色的喙在夕阳里格外醒目。\n岛上的草坡土层松软，正适合海鹦挖掘深达一臂的巢洞，整片山坡被洞口点得像筛子一样，岛上没有常住居民，也没有狐狸和老鼠，海鸟才能安心繁殖。乌维克库特跨海公路的伦达霍尔姆水道跨海大桥从岛旁经过，向北跨海七十多公里通往西基克图克岛，桥面设有观鲸平台，从桥上和船上都能看到海鹦成群掠过水面。岛旁就是瓦莱岛北岸的观鲸湾，夏季鲸鱼常在伦达霍尔姆岛与瓦莱岛之间的水道里觅食，观鲸船从瓦莱渡轮码头出发，常绕过伦达霍尔姆岛寻找鲸群。\n入秋以后，海鹦一夜之间全部离岛，回到外海过冬，草坡上只剩空荡荡的洞口。瓦莱岛的渔民说，哪天早上海面上看不到海鹦了，就该把渔船上的夏季缆绳换成冬天用的粗缆；孩子们则会在桥上的观景平台挥手，向最后一批飞走的海鹦道别。"
      en: "Lundaholm is an islet north-east of Hvaley, nearly 200 km² and rising to nearly 200 m, in Hvaley District of Uviqkut City, facing Hvaley across the three-kilometre Lundaholm Sound. Every summer tens of thousands of auks and puffins dig their burrows in its grassy slopes, which gave the island its name, \"lunde\" meaning puffin in Viking. On summer evenings flocks of puffins fly home from the sea with fish in their beaks, their orange bills bright in the setting sun.\nThe soil of the slopes is soft, just right for puffins to dig burrows an arm's length deep, and whole hillsides are pocked with holes like a sieve; nobody lives on the island and there are no foxes or rats, so the birds can breed in peace. The Lundaholm Sound Bridge of the Uviqkut Causeway passes beside the island and runs north across more than 70 km of sea to Siqqiqtuuq Island; its deck has whale-watching platforms, and from the bridge and from boats you can see puffins skimming the water in flocks. Whalewatch Bay on Hvaley's north coast lies alongside, whales often feed in the sound between Lundaholm and Hvaley in summer, and the boats from the Hvaley Ferry Terminal often round Lundaholm looking for them.\nIn autumn the puffins leave the island all at once, overnight, to winter out at sea, leaving only empty burrows on the slopes. Hvaley's fishermen say that the morning you see no more puffins on the water is the morning to change the boat's summer ropes for heavy winter ones, and children wave from the bridge's viewing platforms to bid the last of them goodbye."
