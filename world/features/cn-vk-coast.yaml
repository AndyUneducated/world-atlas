    notes:
      zh: 暖泉岛南岸的海湾，面积近三百平方公里，属新特雷曼市新特雷曼区，湾底的喷气孔让海水泛着硫磺味，海湾和城市都以最早在这里开采硫磺的特雷曼家族命名。湾边的地热田里喷气孔冒着白色的蒸汽，泥火山咕嘟作响，岩石被硫磺染成黄色和橙色，地热步道和观景台让游客可以安全地近距离观看；地热电站排出的温水汇入海边的露天温泉浴场。温室区沿着地热管道成片排列，冬季的黑夜里亮着补光灯，从远处看像一片发光的湖面。湾口外是火山灰堆成的灰岛，暖泉南环高速以十公里长的新特雷曼高架桥经过湾畔，是这条高速上最长的桥梁。
      en: A bay on the south coast of Warmspring Island, nearly 300 km², in New Tremaine District of New Tremaine; vents on its floor give the water a smell of sulphur, and both bay and city are named after the Tremaine family, who first mined sulphur here. On the geothermal field by the shore fumaroles send up white steam, mud pots bubble and the rocks are stained yellow and orange, with walkways and viewing platforms that let visitors come close in safety, and warm water from the power station feeds an open-air bathing lagoon by the sea. Greenhouses stand in rows along the heating mains, their grow-lights shining through the winter dark like a glowing lake. Off the mouth lies Ash Isle, built of volcanic ash, and the Warmspring Southern Arc Expressway passes the bay on the 10 km New Tremaine Viaduct, the longest bridge on that road.
