    notes:
      zh: 暖泉岛东岸外的小岛，面积一百平方公里左右，属暖泉市温泉区，隔着五公里宽的暖泉海峡与暖泉岛相望。浮石岛地势低平，最高处只有六十多米，岛上的海滩堆满了暖泉火山喷出的浮石，这种多孔的火山石轻得能浮在水面上，岛名由此而来。从温泉区的海边望去，浮石岛横在温泉湾外，是度假区海景的一部分；游客乘小船登岛，在灰白色的浮石滩上散步、捡拾浮石，再回到温泉度假村泡温泉。岛上没有常住居民，海鸟在礁石上栖息。
      en: An islet off the east coast of Warmspring Island, about 100 km², in Hot Springs District of Warmspring City, facing Warmspring across the five-kilometre Warmspring Strait. It is low and flat, rising only to just over 60 m, and its beaches are heaped with pumice thrown out by Warmspring Volcano, a porous stone light enough to float, which gave the island its name. Seen from the Hot Springs shore it lies across the mouth of Hot Springs Bay as part of the resort's sea view; visitors take small boats across to stroll the pale-grey pumice beaches and gather stones before returning to soak at the spa resort. No one lives there, and seabirds nest on the rocks.
  - id: nat_5zcers
