    notes:
      zh: 长船岛船首尖端的海湾，面积一百一十多平方公里，属长船市北岬区，面向北维京岛。海湾就在斯塔文内斯岬旁，是长船岛离维京港最近的海岸，维长城际铁路的维京海底铁路隧道在斯塔文内斯岬出地面，以高架桥登陆，再经北岬区的地面线进入长船。湾内的海岸多是岩石和砾石滩，冬季北风从海峡上直灌入湾，浪大风急。斯塔文内斯岬上的观景台面朝开阔的海峡，可以俯瞰整个斯塔文维克湾，晴天时海天一色，海鸟在湾外的礁石上盘旋。
      en: The bay at the very tip of Longship Island's bow, a little over 110 km², in North Cape District of Longship, facing North Viking Island. It lies beside Stavnnes, the stretch of Longship's coast nearest Viking Port, where the Viking Undersea Rail Tunnel of the Viking Port–Longship Intercity Railway surfaces and comes ashore on a viaduct before running across North Cape on the surface into Longship. Its shores are mostly rock and shingle, and in winter the north wind drives straight in off the strait, raising heavy seas. The viewpoint on Stavnnes faces the open strait and looks down over the whole bay; on a clear day sea and sky merge, and seabirds wheel over the skerries outside it.
  - id: nat_r2hpck
    subtype: bay
    status: generated
    detect: { kind: bay, at_km: [176.8, 173.2] }
    names: { zh: 北岬湾, en: North Cape Bay, art-x-viking: Nordkapbucht, art-x-buckham: Baia di Capo Nord }
    notes:
      zh: 长船岛船首西北侧的大湾，面积五百多平方公里，由北岬环抱，是长船岛西北岸最大的海湾，湾岸分属长船市北岬区和西岸区。群岛大学的主校区坐落在湾畔的山坡上，海洋学专业的师生常在湾里进行观测和实习。长船国际机场建在北岬的平地上，长船机场高速以十三公里长的北岬高架桥沿湾岸进入北岬，长船西北岸公路也沿海岸经西岸区到达这里。湾内水面开阔，西岸区一侧是连串的海滨公园、沙滩和自行车道，夏季傍晚居民在海边散步看日落，北岬一侧的山坡上仍有牧羊草场。
      en: "The large bay on the north-west side of Longship Island's bow, a little over 500 km², sheltered by North Cape and the largest bay on the island's north-west coast; its shores belong to North Cape and West Shore districts of Longship. The University of the Islands has its main campus on the hillside above it, and its oceanography students and staff often take their observations and fieldwork out on the bay. Longship International Airport stands on the flat land of North Cape; the Longship Airport Expressway follows the shore into the cape on the 13 km North Cape Viaduct, and the Longship North-West Shore Road also arrives along the coast through West Shore. The water is wide and open: on the West Shore side a chain of seaside parks, beaches and cycle paths draws people out on summer evenings to stroll and watch the sunset, while sheep still graze the slopes on the North Cape side."
  - id: nat_dw7pxt
    subtype: bay
    status: generated
    detect: { kind: bay, at_km: [241.2, 113.8] }
    names: { zh: 阿夫琳湾, en: Aveline Bay, art-x-viking: Avelinebucht, art-x-buckham: Baia Aveline }
    notes:
      zh: 阿夫琳岛东端的深水大湾，面积五百五十多平方公里，是阿夫琳港市的海上门户。阿夫琳港邮轮母港就在湾内，邮轮码头、免税商业街和渡轮枢纽集中在阿夫琳码头区的湾畔，渡轮从这里通往长船、暖泉、西格拉维克和乌维克库特。湾口外的马拉布尔岛和马拉布尔水道是进出海湾的航道，马拉布尔岛上的老灯塔为邮轮和渔船引航。阿夫琳湾的海滨长廊是观赏邮轮进出港和日落的好地方，每当巨轮鸣笛起航，岸边总有人挥手送别；阿夫琳港邮轮高速把湾畔的码头与阿夫琳港机场和老城连在一起。
      en: The large deep-water bay at the eastern end of Aveline Island, a little over 550 km², Port Aveline's gateway to the sea. The Port Aveline Cruise Port lies within it, and the cruise terminal, duty-free shopping streets and ferry hub are gathered on the Aveline Quay District shore, with ferries to Longship, Warmspring, Siglavik and the Uviqkut. Lighthouse Isle and Marrable Sound off its mouth form the fairway in, and the old light on Lighthouse Isle guides cruise ships and fishing boats in. The seafront promenade is the place to watch the cruise ships come and go and the sun go down, and whenever a liner sounds its horn and sails there are always people on the shore waving it off. The Port Aveline Cruise Expressway links the quays with Port Aveline Airport and the old town.
  - id: nat_ht8qd3
    subtype: bay
    status: generated
    detect: { kind: bay, at_km: [230.8, 122.2] }
    names: { zh: 灯塔湾, en: Lighthouse Bay, art-x-viking: Leuchtturmbucht, art-x-buckham: Baia del Faro }
    notes:
      zh: 阿夫琳湾以北的小海湾，面积五十多平方公里，属阿夫琳港市灯塔区，湾畔是海滨别墅和阿夫琳港灯塔。灯塔区位于阿夫琳岛东北端的海角，老灯塔、海滨别墅与观鲸码头构成区里的风景；每年夏季，座头鲸和虎鲸经灯塔湾和马拉布尔水道洄游，观鲸码头每天有多班观鲸船出海。湾内水面平静，沙滩和岩岸交错，别墅的花园一直延伸到海边，夏季是阿夫琳港人避暑的地方。阿夫琳港灯塔公路从阿夫琳码头出发，沿海岸通往灯塔区，是阿夫琳岛最美的海滨公路之一。
      en: A small bay north of Aveline Bay, a little over 50 km², in Lighthouse District of Port Aveline, lined with seaside villas and overlooked by the Port Aveline Lighthouse. Lighthouse District sits on the headland at the north-eastern end of Aveline Island, where the old lighthouse, the villas and the whale-watching quay make up the scene; every summer humpbacks and killer whales pass through Lighthouse Bay and Marrable Sound, and several whale-watching boats leave the quay each day. The water is calm, beaches and rocky shores alternate, and the villa gardens run down to the sea; in summer it is where Port Aveline people escape the heat. The Port Aveline Lighthouse Road follows the coast from Aveline Quay to Lighthouse District, one of the most beautiful seaside drives on the island.
  - id: nat_1q1ey6
    subtype: bay
    status: generated
    detect: { kind: bay, at_km: [140.8, 69.8] }
    names: { zh: 莫斯维克湾, en: Måsvik Bay, art-x-viking: Måsvik, art-x-buckham: Baia dei Gabbiani }
    notes:
      zh: 阿夫琳岛西南端的海湾，面积近三百平方公里，属莫塞市莫塞区，成群的银鸥在码头和渔船上空盘旋，莫塞市由此得名。湾内风平浪静，白色的沙滩和松林环抱的小海湾适合游泳、帆船和皮划艇，夏季湾里满是白帆；湾畔是度假住宅、海滨酒店和老渔港。湾口的引水岛上有引水站和灯塔，引航员在这里登上驶入阿夫琳海峡的大船，渡船也把游客送到岛上野餐和观鸟。阿夫琳纵贯高速和西格利跨海高速在湾畔的城郊交会，卡洛韦岭公路也从这里翻山通往帆城。莫斯维克湾的日落把海面染成金色，是阿夫琳岛最有名的海滨景色之一。
      en: The bay at the south-western end of Aveline Island, nearly 300 km², in Måsey District of Måsey City; flocks of herring gulls wheel over its quays and boats and gave the city its name. The water is calm, and white beaches and small coves ringed by pines are ideal for swimming, sailing and kayaking, so that in summer the bay is full of sails; holiday homes, seaside hotels and the old fishing harbour line the shore. Pilot Isle at its mouth has a pilot station and a lighthouse, where pilots board the big ships bound up Aveline Strait, and boats also take visitors out to picnic and watch birds. The Aveline Spine Expressway and the Sigley Sea Crossing meet on the edge of town, and the Calloway Ridge Road sets off from here over the mountains to Sail Town. Sunset over Måsvik Bay turns the water to gold, one of the best-known seaside views on the island.
  - id: nat_c4cftd
    subtype: bay
    status: generated
    detect: { kind: bay, at_km: [227.2, 82.2] }
    names: { zh: 萨尔塔维克湾, en: Saltavik Bay, art-x-viking: Saltavikbucht, art-x-buckham: Baia del Sale }
    notes:
      zh: 阿夫琳岛东南岸的海湾，面积七十多平方公里，旧时在湾畔晒盐腌鱼，萨尔塔维克市由此得名。这里海水清澈、风大日照足，自维京时代起就以日晒和熬煮法生产海盐，湾岸铺开数十平方公里的盐田，夏季阳光下盐田像一面面镜子，传统作坊熬出的「萨尔塔维克湾花盐」是群岛餐桌上的珍品，盐田旁的海盐博物馆讲述着制盐的历史。湾外的海面上是海上风电场，萨尔塔维克湾港是风电场的运维基地。阿夫琳纵贯高速经过湾畔，萨尔塔维克海滨公路沿海岸经过盐田，连接菲斯克海姆和望海的果园。
      en: "A bay on the south-east coast of Aveline Island, a little over 70 km², where salt was once panned to cure fish, and the source of Saltavik City's name. The water is clear, the wind strong and the sun plentiful, and sea salt has been made here by solar evaporation and boiling since the Viking age: tens of square kilometres of salt pans line the shore, shining like mirrors in the summer sun, the flaky Saltavik salt boiled in traditional works is prized on island tables, and the salt museum beside the pans tells the story. An offshore wind farm stands in the sea beyond the bay, and Saltavik harbour is its service base. The Aveline Spine Expressway passes the bay, and the Saltavik Coast Road runs along the shore past the salt pans between Fiskheim and the orchards of Seawatch."
  - id: nat_gd3pyt
    subtype: bay
    status: generated
    detect: { kind: bay, at_km: [71.8, 107.8] }
    names: { zh: 阿克斯维克湾, en: Akkersvik Bay, art-x-viking: Akkersvikbucht, art-x-buckham: "Baia dell'Ancora" }
    notes:
      zh: 阿克斯岛南端两只锚爪西爪岬与东爪岬之间的大湾，面积七百多平方公里，是群岛最大的海湾，水深浪静，湾口有卡蒂马苏克岛屏障，自古就是群岛最好的天然良港。群岛第二大城市阿克斯维克因城市坐落在两只锚爪之间的阿克斯维克湾而得名，湾内的阿克斯维克集装箱港是群岛最大的集装箱港，大型集装箱船和散货船可以全天候进出。阿克斯岛纵贯高速沿湾岸延伸，以七公里多长的阿克斯维克湾跨海大桥跨越海湾，阿斯跨海高速从这里跨越阿克斯海峡口通往长船岛的斯蒂尔维克，阿克斯维克湾公路连接西爪和瑙斯特海姆两区。夜晚的阿克斯维克湾灯火通明，岸桥和货轮的灯光倒映在湾水中。
      en: The great bay between the two flukes at the southern end of Akkersey, West Fluke and East Fluke, a little over 700 km² and the largest bay in the islands. Deep and calm, with Kattimasuq Island sheltering its mouth, it has always been the finest natural harbour in the islands. Akkersvik, the second city of the archipelago, is named for its place in Akkersvik Bay between the two flukes, and the Port of Akkersvik within the bay is the largest container port in the islands, open to big container ships and bulk carriers in any weather. The Akkersey Spine Expressway follows the shore and crosses the bay on the 7.5 km Akkersvik Bay Bridge, the Akkersvik–Styrvik Sea Crossing sets off from here across the mouth of Akkersey Strait to Styrvik on Longship Island, and the Akkersvik Bay Road links West Fluke with the Naustheim District. At night the bay blazes with light, the quay cranes and freighters mirrored in its water.
  - id: nat_6r8rng
    subtype: bay
    status: generated
    detect: { kind: bay, at_km: [65.2, 146.2] }
    names: { zh: 托克维克湾, en: Tåkevik Bay, art-x-viking: Tåkevikbucht, art-x-buckham: Baia della Nebbia }
    notes:
      zh: 阿克斯岛西岸的海湾，面积一百六十多平方公里，湾岸分属托克维克市托克维克区和阿克斯维克市西爪区。从大洋吹来的湿润西风在锚链山前凝结成雾，使托克维克湾一年中大部分清晨都笼罩在海雾里，港口的雾笛和灯塔昼夜为渔船指引方向，海湾和城市都由此得名。湾畔的托克维克湾渔港是阿克斯岛西岸的主要渔港，托克维克湾老城依山而建，彩色的木屋沿陡坡层层排列，鱼市和海鲜餐馆是游客必到之处。阿托高速以隧道穿过锚链山主脊，再到达湾畔，是西岸通往阿克斯维克的快速通道；阿克斯岛峡湾公路也从湾畔经过，沿西岸北上通往富鲁海姆。
      en: A bay on the west coast of Akkersey, a little over 160 km², its shores shared between Tåkevik District of Tåkevik City and West Fluke District of Akkersvik. Moist westerlies off the ocean condense into fog against the Anchor Chain Mountains, so that on most mornings of the year the bay lies under sea mist, with the harbour's foghorn and lighthouse guiding the fishing boats day and night; both bay and city take their name from it. Tåkevik's fishing harbour on the bay is the main fishing port of Akkersey's west coast, and the old town climbs the hillside in tiers of painted wooden houses, with a fish market and seafood restaurants no visitor misses. The Akkersvik–Tåkevik Expressway tunnels through the main ridge of the Anchor Chain Mountains and reaches the bay, the fast link from the west coast to Akkersvik, and the Akkersey Fjord Road passes the bay on its way north up the coast to Furuheim.
  - id: nat_3w3ayk
    subtype: bay
    status: generated
    detect: { kind: bay, at_km: [126.2, 198.2] }
    names: { zh: 富鲁海姆湾, en: Furuheim Bay, art-x-viking: Furuheimbucht, art-x-buckham: Baia dei Pini }
    notes:
      zh: 阿克斯岛东北端的海湾，面积两百多平方公里，属富鲁海姆市富鲁海姆区，四周松林环绕。湾畔的富鲁海姆镇是富鲁海姆市的中心，湾边是锯木厂、木材码头和木结构的小镇，镇上有一条以木工坊、皮具店和猎人商店为主的老街，木材从这里装船运往阿克斯维克和群岛各地。湾外是赫里姆岛自然保护区，冬季常有海冰和霜雾；阿克斯岛峡湾公路沿西岸经托克维克、尤普峡湾北上到达富鲁海姆湾，阿克斯岛纵贯高速也从阿克斯维克通往这里。松林间的步道通往阿克斯岛最高峰铁锚峰和锚链冰川，夏季游客在湾畔的森林木屋住下，再徒步上山。
      en: A bay at the north-eastern end of Akkersey, a little over 200 km², in Furuheim District of Furuheim City, ringed by pine forest. The town of Furuheim on its shore is the city's centre, with sawmills, timber quays and wooden houses along the water and an old street of woodworkers, leather shops and hunters' outfitters; timber is shipped from here to Akkersvik and across the islands. Off the bay lies the Hrimey Nature Reserve, often wrapped in sea ice and frost fog in winter. The Akkersey Fjord Road comes north up the west coast by way of Tåkevik Bay and the fjords to reach Furuheim Bay, and the Akkersey Spine Expressway runs here from Akkersvik too. Trails through the pines lead to Iron Anchor Peak, the island's highest summit, and the Anchor Chain Glacier, and in summer visitors stay in forest cabins by the bay before setting off on foot.
  - id: nat_nzwany
    subtype: bay
    status: generated
    detect: { kind: bay, at_km: [97.2, 50.8] }
    names: { zh: 温泉湾, en: Hot Springs Bay, art-x-viking: Thermenbucht, art-x-buckham: Baia delle Terme }
    notes:
      zh: 暖泉岛东岸的海湾，面积三百六十多平方公里，属暖泉市温泉区，湾畔的海滩下涌出温泉，海湾由此得名。温泉酒店、疗养院与会议度假村沿温泉湾和山坡排开，群岛最大的暖泉温泉度假村拥有数十个露天温泉池，冬季客人泡在热气腾腾的池水里仰望极光，是群岛最有名的体验。湾外是浮石岛，岛与暖泉岛之间的暖泉海峡是从长船岛船尾前往暖泉的海上航道。暖泉环山公路从温泉区出发，环绕暖泉火山经斯瓦特桑德、新特雷曼和克莱特斯塔德通往落日；湾的东端是伸向长船岛方向的温泉岬。
      en: A bay on the east coast of Warmspring Island, a little over 360 km², in Hot Springs District of Warmspring City; hot springs well up beneath its beaches, which gave it its name. Spa hotels, sanatoriums and conference resorts line the bay and the slopes behind, and the Warmspring Spa Resort, the largest in the islands, has dozens of open-air pools where winter guests soak in the steam and gaze up at the aurora, the most famous experience in the islands. Pumice Isle lies off the bay, and the Warmspring Strait between it and the main island is the sea route from Longship's stern to Warmspring. The Warmspring Volcano Road sets off from Hot Springs District and circles the volcano by way of Svartsand, Tremaine Bay and Klettstad to Sunset; at the eastern end of the bay Hot Springs Point reaches out towards Longship Island.
  - id: nat_qq80wg
    subtype: bay
    status: generated
    detect: { kind: bay, at_km: [49.8, 15.8] }
    names: { zh: 特雷曼湾, en: Tremaine Bay, art-x-viking: Tremainebucht, art-x-buckham: Baia Tremaine }
    notes:
      zh: 暖泉岛南岸的海湾，面积近三百平方公里，属新特雷曼市新特雷曼区，湾底的喷气孔让海水泛着硫磺味，海湾和城市都以最早在这里开采硫磺的特雷曼家族命名。湾边的地热田里喷气孔冒着白色的蒸汽，泥火山咕嘟作响，岩石被硫磺染成黄色和橙色，地热步道和观景台让游客可以安全地近距离观看；地热电站排出的温水汇入海边的露天温泉浴场。温室区沿着地热管道成片排列，冬季的黑夜里亮着补光灯，从远处看像一片发光的湖面。湾口外是火山灰堆成的灰岛，暖泉南环高速以十公里长的新特雷曼高架桥经过湾畔，是这条高速上最长的桥梁。
      en: A bay on the south coast of Warmspring Island, nearly 300 km², in New Tremaine District of New Tremaine; vents on its floor give the water a smell of sulphur, and both bay and city are named after the Tremaine family, who first mined sulphur here. On the geothermal field by the shore fumaroles send up white steam, mud pots bubble and the rocks are stained yellow and orange, with walkways and viewing platforms that let visitors come close in safety, and warm water from the power station feeds an open-air bathing lagoon by the sea. Greenhouses stand in rows along the heating mains, their grow-lights shining through the winter dark like a glowing lake. Off the mouth lies Ash Isle, built of volcanic ash, and the Warmspring Southern Arc Expressway passes the bay on the 10 km New Tremaine Viaduct, the longest bridge on that road.
  - id: nat_k4q61d
    subtype: bay
    status: generated
    detect: { kind: bay, at_km: [14.8, 153.2] }
    names: { zh: 观鲸湾, en: Whalewatch Bay, art-x-viking: Walschaubucht, art-x-buckham: Baia delle Balene }
    notes:
      zh: 瓦莱岛北岸的海湾，面积一百九十多平方公里，属乌维克库特市瓦莱区，观鲸船从这里出海，海湾由此得名。每年夏季，座头鲸、虎鲸和小须鲸沿乌维克库特的海域洄游，在观鲸湾里觅食，几乎每次出海都能看到鲸鱼喷水、跃身和摆尾，观鲸是瓦莱岛最重要的旅游项目。湾的东北面是伦达霍尔姆岛，两岛之间的伦达霍尔姆水道上横跨着乌维克库特跨海公路的伦达霍尔姆水道跨海大桥，桥面设有观鲸平台。瓦莱观鲸中心的研究人员常年在湾里观测和保护鲸群，记录鲸鱼的数量和迁徙路线。夏夜的湾面上，常能听到鲸鱼的歌声。
      en: A bay on the north coast of Hvaley, a little over 190 km², in Hvaley District of Uviqkut City, where the whale-watching boats set out, hence its name. Every summer humpback, killer and minke whales migrate through the waters of the Uviqkut and feed in the bay, and almost every trip sees whales blowing, breaching and lobtailing; whale-watching is Hvaley's most important attraction. Lundaholm lies to the north-east, and across Lundaholm Sound between the two islands runs the Lundaholm Sound bridge of the Uviqkut Causeway, with whale-watching platforms on its deck. Researchers from the Hvaley Whale Centre observe and protect the whales in the bay year round, recording their numbers and routes. On summer nights whale song can often be heard across the water.

