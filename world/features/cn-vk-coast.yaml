      en: An islet off the south-east of Aveline Island, a little over 280 km², in Aveline Quay District of Port Aveline. Its herring-fishing village is old, and in the herring season the boats cast their nets all around the island while the smokehouses and salting sheds work day and night; pickled and smoked herring are its traditional specialities. The island is low and gentle, rising only to a little over 130 m, with painted fishermen's houses and net racks scattered over the grassy slopes. In summer visitors come over by boat from Port Aveline to eat fresh herring and go out with the fishermen, and family guesthouses have grown up to take them in.
  - id: nat_v3sgfp
