    detect: { kind: island, at_km: [299.8, 61.8] }
    names: { zh: 东极岛, en: Eastmost Isle, art-x-viking: Ostendinsel, art-x-buckham: Isola Estrema }
    notes:
      zh: 群岛最东的小岛，面积三百多平方公里，位于埃德文岛东侧，属埃德文港市埃德文港区。东极岛地势低平，最高处不到一百米，四周是开阔的外海，岛上只有一座灯塔和几户渔家，是群岛东端的标志。每天清晨，群岛的第一缕阳光从这里的海平线上升起，埃德文岛的游客常乘小船登岛，在灯塔下看日出。岛的周围是渔民的传统渔场，海鸟在礁石和草坡上栖息。从东极岛向东，就是群岛之外的茫茫大洋。
      en: The easternmost islet of the archipelago, a little over 300 km², lying east of Edevane Island in Port Edevane District of Port Edevane. It is low and flat, nowhere reaching a hundred metres, with open sea on every side; there is only a lighthouse and a few fishing families, and it marks the eastern end of the islands. Each morning the islands' first sunlight rises over the horizon here, and visitors to Port Edevane often take a small boat across to watch the sunrise beneath the lighthouse. The waters around it are traditional fishing grounds, and seabirds nest on its rocks and grassy slopes. East of it there is nothing but the open ocean beyond the islands.
  - id: nat_kt82ch
    subtype: island
    status: generated
    detect: { kind: island, at_km: [289.8, 151.8] }
    names: { zh: 哨岛, en: Sentinel Isle, art-x-viking: Wachposteninsel, art-x-buckham: Isola della Sentinella }
    notes:
      zh: 群岛东北外海的小岛，面积一百四十多平方公里，位于亚利图克岛外海，属布兰诺克堡市布兰诺克堡区。哨岛扼守从东方进入群岛的航路，山顶的哨岛雷达站是海事与气象雷达，日夜监视东方航路上的船只和天气，把信息传给群岛的海事和气象部门，岛名由此而来。岛的地势不高，最高处不到两百米，四周是陡峭的海岸，岛上还有海鸟栖息地。除雷达站的值守人员外，岛上几乎没有居民，补给船定期从布兰诺克堡运来物资。
      en: "An islet in the open sea north-east of the archipelago, a little over 140 km², lying off Jaalituuq Island in Fort Brannock District of Fort Brannock. It guards the way into the islands from the east: the Sentinel Isle Radar Station on its summit is a maritime and weather radar, watching shipping and weather on the eastern approaches day and night and passing what it sees to the islands' maritime and weather services, hence the name. The island is not high, rising to less than 200 m, with steep shores all round and seabird colonies. Apart from the radar crew hardly anyone lives there, and a supply boat brings stores from Fort Brannock at regular intervals."
  - id: nat_0j0p38
    subtype: island
    status: generated
    detect: { kind: island, at_km: [246.2, 114.8] }
    names: { zh: 灯塔岛, en: Lighthouse Isle, art-x-viking: Leuchtturminsel, art-x-buckham: Isola del Faro }
    notes:
      zh: 阿夫琳岛东端外的小岛，面积三百多平方公里，属阿夫琳港市灯塔区。岛上的马拉布尔岛灯塔是一座老灯塔，为进出阿夫琳湾的邮轮与渔船引航，与阿夫琳岛上的阿夫琳港灯塔遥相呼应。马拉布尔岛与阿夫琳岛之间隔着不到三公里宽的马拉布尔水道，是进出阿夫琳湾的航道，大型邮轮从岛旁缓缓驶入阿夫琳港邮轮母港。夏季座头鲸和虎鲸经马拉布尔水道洄游，灯塔区观鲸码头的船只常在岛外看到鲸群。岛上草坡和礁石是海鸟栖息的地方，晴天时从灯塔下可以望见阿夫琳湾和卡洛韦峰。
      en: An islet off the eastern end of Aveline Island, a little over 300 km², in Lighthouse District of Port Aveline. Its old Lighthouse Isle Light guides cruise ships and fishing boats in and out of Aveline Bay and answers the Port Aveline Lighthouse on the main island. Marrable Sound, less than three kilometres wide, separates it from Port Aveline and is the fairway into the bay, and big cruise ships glide past the island into the Port Aveline Cruise Port. In summer humpbacks and killer whales pass through the sound, and the boats from Lighthouse District's whale-watching quay often find them off the island. Seabirds nest on its grassy slopes and rocks, and on a clear day you can see Aveline Bay and Mount Calloway from the foot of the lighthouse.
  - id: nat_36qzhj
    subtype: island
    status: generated
    detect: { kind: island, at_km: [75.2, 101.8] }
    names: { zh: 卡蒂马苏克岛, en: Kattimasuq Island, art-x-viking: Kattimasuqinsel, art-x-buckham: Isola Kattimasuq }
    notes:
      zh: 阿克斯岛南端外的小岛，面积两百二十多平方公里，属阿克斯维克市阿克斯维克区，位于阿克斯维克湾湾口。阿克斯海峡的潮流与来自暖泉方向的潮流在岛旁交汇，岛名由此而来。卡蒂马苏克岛像一道天然的屏障挡在湾口，使阿克斯维克湾水深浪静，大型集装箱船和散货船可以全天候进出群岛最大的集装箱港阿克斯维克。阿克斯岛纵贯高速、阿斯跨海高速和阿克斯维克湾公路都从岛旁经过，岛上的灯标为进港船只导航。岛的高处是一片草坡，可以俯瞰阿克斯维克湾的岸桥和来往的货轮。
      en: An islet off the southern end of Akkersey, a little over 220 km², in Akkersvik District of Akkersvik City, lying at the mouth of Akkersvik Bay. The tides of Akkersey Strait meet those coming from the direction of Warmspring beside it, hence its name. It stands across the mouth of the bay like a natural breakwater, keeping Akkersvik Bay deep and calm so that large container ships and bulk carriers can come and go in any weather at the Port of Akkersvik, the largest container port in the islands. The Akkersey Spine Expressway, the Akkersvik–Styrvik Sea Crossing and the Akkersvik Bay Road all pass close by, and beacons on the island guide ships into port. Its high ground is grassy slope looking down on the quay cranes and freighters of the bay.
  - id: nat_yk9yaz
    subtype: island
    status: generated
    detect: { kind: island, at_km: [129.2, 66.8] }
    names: { zh: 引水岛, en: Pilot Isle, art-x-viking: Lotseninsel, art-x-buckham: Isola dei Piloti }
    notes:
      zh: 托利文特岛北面的小岛，面积五十多平方公里，位于莫斯维克湾湾口外，属莫塞市莫塞区。旧时港口引航员在这里等候，登上进出阿夫琳海峡的大船，带它们穿过海峡里的浅滩和航道，岛名由此而来。岛上保留着一座老引水站和灯塔，如今引航员改从港口乘引航船出海，引水岛成了度假小岛，渡船把游客送到岛上野餐和观鸟。岛的地势低缓，最高处九十多米，从岛上可以望见莫斯维克湾里的点点白帆和阿夫琳海峡中往来的大船。
      en: An islet north of Tollivant Island, a little over 50 km², lying off the mouth of Måsvik Bay in Måsey District of Måsey City. Harbour pilots once waited here to board the big ships bound in and out of Aveline Strait and take them through its shoals and channels, hence its name. An old pilot station and lighthouse survive; today the pilots go out by pilot boat from the harbour, and Pilot Isle has become a holiday islet where ferries bring visitors to picnic and watch birds. It is low and gentle, rising to just over 90 m, and from it you can see the sails dotting Måsvik Bay and the big ships moving through Aveline Strait.

  # ── Bays ─────────────────────────────────────────────────
  - id: nat_zgv4r2
    subtype: bay
