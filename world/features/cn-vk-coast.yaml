    notes:
      zh: 群岛最西、也是最西北的无人小岛，面积一百四十平方公里左右，位于乌利克尤阿克岛外海，属乌利克尤阿克市乌利克尤阿克区。艾因谢尔岛孤零零地立在外海，四周没有别的岛屿，岛名由此而来。岛上是裸露的礁石和草坡，最高处两百多米，礁石上的灯塔为渔船指引方向，海鸟在崖壁上栖息。周围的海域是乌利克尤阿克渔民的传统渔场，鳕鱼汛期时，渔船常在艾因谢尔岛附近作业，遇到风暴就到岛的背风面避风。
      en: The westernmost and north-westernmost islet of the archipelago, about 140 km² and uninhabited, lying off Ulikjuaq Island in Ulikjuaq District of Ulikjuaq City. It stands alone in the open sea with no other island near, hence its name. It is bare rock and grassy slope rising to just over 200 m; a lighthouse on the rocks guides the fishing boats, and seabirds nest on its cliffs. The surrounding waters are the traditional grounds of the Ulikjuaq fishermen, and in the cod season boats often work near Einsker and shelter in its lee when a storm blows up.
  - id: nat_k3jb4e
