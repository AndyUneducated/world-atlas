    names: { zh: 灰岛, en: Ash Isle, art-x-viking: Ascheinsel, art-x-buckham: Isola della Cenere }
    notes:
      zh: "灰岛是暖泉岛南岸外的小岛，面积六十多平方公里，属新特雷曼市新特雷曼区，位于特雷曼湾湾口外，与暖泉岛一起构成群岛的最南端。全岛由暖泉火山喷出的火山灰堆积而成，地势低平，最高处七十多米，灰黑色的地面上只长着稀疏的草和苔藓，岛名由此而来。不远处的灰河带着火山灰入海，在河口冲出黑色的沙洲。\n岛上没有居民，也没有码头，是海鸟和海豹的栖息地，海豹在灰黑色的沙滩上晒太阳，远看几乎和地面融为一体。火山灰土质疏松，雨水一下就渗走，风大时地面会扬起细细的灰尘，岛上的植物只能贴着地面生长。从新特雷曼的海岸可以望见它低伏在海面上的灰色身影，特雷曼湾畔的温室在冬夜亮起补光灯时，灰岛就成了光海外的一道暗影。暖泉南环高速的新特雷曼高架桥沿湾畔延伸，开车经过的人在桥上就能看到湾口外的这座小岛。\n研究人员常来岛上观察火山灰地面上植物和动物的定居过程：哪种苔藓最先扎根，哪种昆虫随风而来，海鸟的粪便又怎样让土壤一点点变肥。他们在岛上设了几块固定的样方，每年夏天回来拍照、计数。新特雷曼的人开玩笑说，灰岛是火山「还没写完的一页」，岛上的每一株草都是这一页上新添的一个字。"
      en: "Ash Isle is an islet off the south coast of Warmspring Island, a little over 60 km², in New Tremaine District of New Tremaine, lying outside the mouth of Tremaine Bay; together with Warmspring Island it forms the southernmost point of the archipelago. The whole island is built of ash thrown out by Warmspring Volcano; it is low and flat, rising only to a little over 70 m, and its grey-black ground carries only sparse grass and moss, hence its name. Nearby, the Ash River carries volcanic ash to the sea and builds black sandbars at its mouth.\nNo one lives on the island and it has no jetty; it is home to seabirds and seals, and the seals basking on the dark beaches almost vanish into the ground from a distance. The loose ash soaks up rain at once, fine dust lifts off the ground when the wind blows hard, and the island's plants can only grow pressed close to the ground. Its low grey outline can be seen from the New Tremaine shore, and when the greenhouses beside Tremaine Bay light their grow lamps on winter nights, Ash Isle becomes a dark shadow beyond the sea of light. The New Tremaine Viaduct of the Warmspring Southern Arc Expressway runs along the bay, and drivers can see the islet outside the bay mouth from the bridge.\nResearchers often come to watch how plants and animals settle on the ash: which moss takes root first, which insects arrive on the wind, and how the droppings of seabirds slowly enrich the soil. They have marked a few fixed plots on the island and come back each summer to photograph and count them. New Tremaine people joke that Ash Isle is a page the volcano \"hasn't finished writing\", and every blade of grass on it is a new word on that page."
  - id: nat_vvd2md
    subtype: island
    status: generated
    detect: { kind: island, at_km: [101.8, 49.8] }
    names: { zh: 浮石岛, en: Pumice Isle, art-x-viking: Bimssteininsel, art-x-buckham: Isola della Pomice }
    notes:
      zh: "浮石岛是暖泉岛东岸外的小岛，面积一百平方公里左右，属暖泉市温泉区，隔着五公里宽的暖泉海峡与暖泉岛相望。浮石岛地势低平，最高处只有六十多米，岛上的海滩堆满了暖泉火山喷出的浮石，这种多孔的火山石轻得能浮在水面上，岛名由此而来。\n暖泉海峡是从长船岛船尾前往暖泉的海上航道，海峡里水流平缓，船只穿过海峡进入温泉湾，甲板上一边是浮石岛灰白色的海滩，一边是温泉区冒着蒸汽的海岸和身后的暖泉火山。从温泉区的海边望去，浮石岛横在温泉湾外，是度假区海景的一部分；游客乘小船登岛，在灰白色的浮石滩上散步、捡拾浮石，再回到暖泉温泉度假村泡温泉。夏季常有游艇和皮划艇在浮石岛与温泉湾之间往来，划到岛边的人常把桨一放，躺在船上晒太阳。岛上没有常住居民，海鸟在礁石上栖息，滩上的浮石被浪推来推去，踩上去会发出沙沙的轻响。\n渡轮驶入海峡时，船员会建议乘客往两边看。孩子们最爱在浮石岛捡一块浮石带回家，放进浴缸里看它漂；度假村的浴室里也备着浮石，给泡完温泉的客人磨脚后跟。当地人说，暖泉火山给了东岸两样宝贝，一样是热水，一样是能浮在热水上的石头。"
      en: "Pumice Isle is an islet off the east coast of Warmspring Island, about 100 km², in Hot Springs District of Warmspring City, facing Warmspring Island across the five-kilometre Warmspring Strait. It is low and flat, rising only to a little over 60 m, and its beaches are heaped with pumice thrown out by Warmspring Volcano, a porous volcanic stone so light it floats on water, hence the island's name.\nWarmspring Strait is the sea lane from Longship's stern to Warmspring, its currents gentle; ships pass through it into Hot Springs Bay with Pumice Isle's pale grey beaches on one side and, on the other, the steaming shore of Hot Springs District and the volcano behind. Seen from the Hot Springs waterfront, Pumice Isle lies across the mouth of the bay as part of the resort's sea view; visitors take small boats over to stroll on the pale pumice beaches and collect stones, then return to the Warmspring Spa Resort to bathe. In summer yachts and kayaks often ply between the island and the bay, and those who paddle over often lay down their paddles and lie back in the sun. No one lives on the island, seabirds nest on its rocks, and the pumice on the beaches, pushed to and fro by the waves, rustles softly underfoot.\nAs the ferries enter the strait, the crew tell passengers to look both ways. Children love to take a piece of pumice home from the island and float it in the bath, and the resort's bathrooms keep pumice too, for guests to rub their heels after a soak. Locals say the volcano gave the east coast two treasures: hot water, and stones that float on it."
  - id: nat_5zcers
    subtype: island
    status: generated
    detect: { kind: island, at_km: [99.8, 14.2] }
    names: { zh: 韦克斯利岛, en: Wexley Island, art-x-viking: Wexleyinsel, art-x-buckham: Isola Wexley }
    notes:
      zh: "韦克斯利岛是群岛南端的小岛，面积两百六十多平方公里，位于暖泉岛东南外海，属暖泉市斯瓦特桑德区。韦克斯利岛地势低平，最高处一百多米，平均只有 60 米，四面是开阔的海天，没有山峦遮挡视线，因此建起了韦克斯利航天测控站。测控站的几面大型天线跟踪从北维京岛马斯林山发射的航天器，日夜监测在轨卫星和飞船，是马斯林山航天发射的重要测控站之一。\n测控站是岛上唯一的大型设施，天线、机房和职工宿舍集中在岛的一角，其余的地方仍是低矮的草坡和礁石海岸，海鸟在草坡和礁石上栖息。除测控站的职工外，岛上几乎没有居民，职工轮班上岛，补给船从斯瓦特桑德运来食品和燃料。斯瓦特桑德区的地热电站为暖泉岛供电，测控站的值班人员休假时，常回到对岸泡温泉、走黑沙滩，再乘船返回这片安静的小岛。\n岛上没有城镇的灯光，晴朗的夜里，星空格外明亮，银河从海平线的一端横跨到另一端。每逢马斯林山有发射任务，值班室里人人屏息，等着天线转向天际、锁定目标的那一声提示音；任务结束后，大家会到宿舍门口的草坡上抬头找一找刚刚经过头顶的那颗亮点。职工们说，在韦克斯利岛上，「看星星是工作，也是下班后的消遣」。"
      en: "Wexley Island is an islet at the southern end of the archipelago, a little under 270 km², lying off the south-east of Warmspring Island in Svartsand District of Warmspring City. It is low and flat, rising only to just over 100 m and averaging 60 m, with open sea and sky on every side and no mountains to block the view, which is why the Wexley Tracking Station was built here. Its large dishes follow spacecraft launched from Maslin Mountain on North Viking Island and track satellites and spacecraft in orbit day and night, one of the key tracking stations for the Maslin Mountain launches.\nThe station is the only large installation on the island: the dishes, equipment halls and staff quarters are grouped in one corner, and the rest is still low grassy slope and rocky shore where seabirds nest. Apart from the station staff hardly anyone lives here; the staff come out in shifts, and a supply boat brings food and fuel from Svartsand. Svartsand's geothermal power station supplies Warmspring Island, and when the staff are off duty they often go back across the water to bathe in the hot springs and walk the black beach before taking the boat back to their quiet island.\nThere are no town lights on the island, and on clear nights the stars are especially bright, the Milky Way stretching from one edge of the sea to the other. Whenever Maslin Mountain has a launch, everyone in the control room holds their breath, waiting for the tone that means the dishes have swung round and locked on; afterwards people step out onto the grass by the quarters to look for the bright point that has just passed overhead. The staff say that on Wexley \"stargazing is the job, and also what you do after work\"."
  - id: nat_bnz64a
    subtype: island
    status: generated
    detect: { kind: island, at_km: [185.8, 15.8] }
    names: { zh: 牡蛎岛, en: Oyster Isle, art-x-viking: Austerninsel, art-x-buckham: Isola delle Ostriche }
    notes:
      zh: "牡蛎岛是西格利岛东南的小岛，面积两百四十多平方公里，位于西格利岛与圣翁丁岛之间，属西格拉维克市西格拉维克区。岛的地势低平，最高处不到 80 米，周围是大片浅湾和沙洲，海水温和、营养丰富，岛上的渔村在浅滩上养殖牡蛎，是群岛著名的牡蛎养殖场，岛名就来自这片养殖场。\n养殖户把幼蚝挂在浅滩的木架和网袋里，靠潮水带来的养分慢慢长大，退潮时养殖架和滩涂一直延伸到远处的海面，穿着长筒胶靴的工人在架间翻袋、分拣，涨潮时又只露出一排排木桩的尖顶。西格拉维克牡蛎肉质饱满，是长船和阿夫琳港餐馆的招牌菜，收获季节冷藏车每天从渡船码头把一箱箱牡蛎运过海去。岛上的渔民也和西格拉维克渔港的船一样出海捕捞鳕鱼、鲱鱼和扇贝，海鸟在沙洲上成群觅食。\n每年的牡蛎节是西格拉维克最热闹的节日，游客乘船来到岛上，在养殖场旁品尝刚出水的生蚝，配一片黑面包和一杯本地苹果酒。节日的压轴是开蚝比赛，选手们戴着护手比谁在一分钟里撬开的牡蛎最多、最干净，冠军能拿到一把刻着名字的开蚝刀。老养殖户说，牡蛎岛的蚝好吃，全靠「一半海水、一半耐心」。"
      en: "Oyster Isle is an islet south-east of Sigley, a little over 240 km², lying between Sigley and Saint-Ondine Island in Siglavik District of Siglavik City. It is low and flat, rising to less than 80 m, and is surrounded by broad shallow bays and sandbars where the water is mild and rich in nutrients; the villagers farm oysters on the shallows, the best-known oyster beds in the islands and the source of the island's name.\nThe farmers hang young oysters in racks and mesh bags on the shallows, where the tides bring the food they grow on; at low tide the racks and mudflats stretch far out towards the sea and workers in tall rubber boots turn and sort the bags between them, while at high tide only the tips of the posts show. Siglavik oysters are plump and a signature dish in the restaurants of Longship and Port Aveline, and in the harvest season refrigerated lorries carry crate after crate across the water from the ferry landing every day. Like the boats of Siglavik's fishing harbour, the island's fishermen also go out for cod, herring and scallops, and seabirds feed in flocks on the sandbars.\nThe yearly oyster festival is Siglavik's liveliest: visitors come over by boat to eat oysters fresh from the water beside the beds, with a slice of black bread and a glass of local cider. The finale is the shucking contest, in which competitors in protective gloves race to open the most oysters, and the cleanest, in one minute; the winner takes home an oyster knife engraved with their name. The old farmers say Oyster Isle's oysters taste so good thanks to \"half sea water, half patience\"."
  - id: nat_sfcte5
    subtype: island
    status: generated
    detect: { kind: island, at_km: [258.2, 13.8] }
    names: { zh: 塞尔霍尔姆岛, en: Selholm, art-x-viking: Selholm, art-x-buckham: Isola delle Foche }
    notes:
      zh: "塞尔霍尔姆岛是圣翁丁岛东南的无人岛，面积两百四十多平方公里，最高处 191 米，属圣翁丁市圣翁丁区。岛名在维京语里意为「海豹小岛」：岛的礁石海岸是灰海豹的繁殖地，每年产仔季节，成百上千只海豹在礁石上产下雪白的幼崽，全岛划为塞尔霍尔姆岛自然保护区。\n保护区严格限制人员登岛，产仔季节禁止船只靠近礁石，游客只能在远处的观察船上或对岸的观景台用望远镜观看。刚出生的幼崽披着白色绒毛，趴在礁石上一动不动，几周后才褪去胎毛、学着下水，母海豹则守在近旁的浅水里。岛上的草坡和崖壁也是海鸟栖息的地方，研究人员每年在固定的观测点统计海豹和海鸟的数量，巡护员则在秋天清点一次新出生的小海豹，记下它们在礁石上的位置，数字逐年上升时，整个圣翁丁镇都会跟着高兴。\n从圣翁丁镇乘观察船出海，往返半天就能看到海豹在礁石上晒太阳，船长会在保护区边界外熄火，让大家安静地等海豹抬头。圣翁丁的孩子们最爱这项活动，他们在观景台上给每一只小海豹起名字，有的叫「小雪球」，有的随了发现它的孩子的名字，第二年再来时，总要争论哪一只是去年的老朋友。"
      en: "Selholm is an uninhabited island south-east of Saint-Ondine Island, a little over 240 km² and rising to 191 m, in Saint-Ondine District of Saint-Ondine. Its Viking name means \"seal islet\": its rocky shores are a grey seal breeding ground where hundreds of seals give birth to snow-white pups on the rocks each pupping season, and the whole island is the Selholm Nature Reserve.\nLanding is strictly limited, boats may not approach the rocks in the pupping season, and visitors can watch only through binoculars from viewing boats at a distance or from the viewing platform across the water. Newborn pups wear white fluffy coats and lie motionless on the rocks, shedding them after a few weeks and learning to swim while their mothers keep watch in the shallows nearby. Seabirds nest on the grassy slopes and cliffs too; researchers count the seals and birds every year from fixed observation points, and the rangers take a census of the new pups each autumn, noting where each lies on the rocks, and when the numbers rise from one year to the next the whole town of Saint-Ondine shares the pleasure.\nA viewing boat from the town of Saint-Ondine reaches the seals sunning themselves on the rocks and is back within half a day, the skipper cutting the engine outside the reserve boundary so that everyone can wait quietly for a seal to lift its head. Saint-Ondine's children love these trips; on the viewing platform they give every pup a name, some \"Snowball\", some the name of the child who spotted it, and when they come back the next year they always argue over which one is last year's old friend."
  - id: nat_bs1dbj
    subtype: island
    status: generated
    detect: { kind: island, at_km: [251.8, 82.2] }
    names: { zh: 亨纳科特岛, en: Hennacott Island, art-x-viking: Hennacottinsel, art-x-buckham: Isola Hennacott }
    notes:
      zh: "亨纳科特岛是阿夫琳岛东南外的小岛，面积两百八十多平方公里，属阿夫琳港市阿夫琳码头区。岛的地势低缓，最高处一百三十多米，草坡上散布着彩色的渔屋和晾网架，岛名是殖民时代留下的姓氏。岛上的鲱鱼渔村历史悠久，每年鲱鱼汛期，渔船在岛周围的海面撒网，渔村里的熏鱼房和腌鱼作坊昼夜忙碌，腌鲱鱼和熏鲱鱼是这里的传统特产。\n鲱鱼上岸后，女工们在长桌边去头去内脏，一部分抹盐装桶，压上石块腌上几个月，一部分挂进熏鱼房，用木屑慢火熏到金黄。整座渔村在汛期里都飘着烟熏和海盐的味道，熏好的鲱鱼装箱后乘船运到阿夫琳港，再从那里分送到群岛各地的鱼店和餐馆。群岛几乎每家都有一道自家的腌鲱鱼方子，亨纳科特的老渔家则爱说，别处的方子最早都是从这座岛上学去的。\n夏季常有游客从阿夫琳港乘船来岛上品尝新鲜的鲱鱼，跟随渔民出海体验捕鱼，渔家民宿也随之兴起。邮轮靠港的日子里，一些游客专程搭小船过来，坐在熏鱼房门口吃一盘刚出炉的熏鲱鱼，配土豆和酸奶油。渔村的孩子们则在码头上帮忙收网，一边捡出卡在网眼里的小鱼喂海鸥，一边数今天又来了几船客人。"
      en: "Hennacott Island is an islet off the south-east of Aveline Island, a little over 280 km², in Aveline Quay District of Port Aveline. It is low and gentle, rising only to a little over 130 m, with painted fishermen's houses and net racks scattered over its grassy slopes; its name is a surname left from colonial times. Its herring-fishing village is old, and in the herring season the boats cast their nets all around the island while the smokehouses and salting sheds work day and night; pickled and smoked herring are its traditional specialities.\nWhen the herring come ashore, women at long tables head and gut them; some are salted into barrels and weighted with stones to cure for months, others are hung in the smokehouses and slow-smoked over wood shavings until golden. Through the season the whole village smells of smoke and sea salt, and the boxed smoked herring go by boat to Port Aveline and on from there to fishmongers and restaurants across the islands. Nearly every family in the islands has its own pickled-herring recipe, and Hennacott's old fishing families like to say that all the others were first learned on this island.\nIn summer visitors often come over by boat from Port Aveline to eat fresh herring and go out with the fishermen, and family guesthouses have grown up to take them in. On days when cruise ships are in, some passengers make the trip by small boat just to sit at a smokehouse door over a plate of herring straight from the smoke, with potatoes and sour cream. The village children help haul nets on the quay, picking the little fish caught in the mesh to feed the gulls and counting how many boatloads of guests have come today."
  - id: nat_v3sgfp
    subtype: island
    status: generated
    detect: { kind: island, at_km: [299.8, 61.8] }
    names: { zh: 东极岛, en: Eastmost Isle, art-x-viking: Ostendinsel, art-x-buckham: Isola Estrema }
    notes:
      zh: "东极岛是群岛最东的小岛，面积三百多平方公里，位于埃德文岛东侧，属埃德文港市埃德文港区。东极岛地势低平，最高处不到一百米，四周是开阔的外海，岛上只有一座灯塔和几户渔家，是群岛东端的标志，岛名也由此而来。东风从大洋上直吹过来，岛上的草长得又矮又密，树木几乎无法成活。\n每天清晨，群岛的第一缕阳光从这里的海平线上升起，埃德文岛的游客常乘小船登岛，在灯塔下看日出。夏季天亮得极早，看日出的船在凌晨就要从埃德文港出发，船家会在舱里备好热茶和面包，乘客裹着毯子在甲板上等待天边泛白。岛的周围是渔民的传统渔场，几户渔家守着灯塔世代捕鱼，海鸟在礁石和草坡上栖息，风大的日子里，整座岛只听得见浪声和鸟叫。\n渔家的房子都背对东风而建，窗户开在西面，老人说这样既挡风，又能在傍晚看着埃德文岛的灯火亮起。灯塔下的岩石上有人用白漆画了一道线，说是群岛「最东的一步」，来看日出的游客总要踩在线上拍一张照片。从东极岛向东，就是群岛之外的茫茫大洋，晴天时海平线笔直得像用尺子画出来的一样，渔民们管这里叫「天亮的地方」。"
      en: "Eastmost Isle is the easternmost islet in the archipelago, a little over 300 km², lying east of Edevane Island in Port Edevane District of Port Edevane. It is low and flat, rising to less than 100 m, with open sea all around; there is only a lighthouse and a few fishing families on it, and it marks the eastern end of the islands, which gave it its name. The east wind blows straight in off the ocean, the grass grows short and dense, and trees can hardly survive.\nEvery morning the islands' first light rises over the horizon here, and visitors on Edevane Island often take a small boat across to watch the sunrise at the foot of the lighthouse. In summer dawn comes very early, so the sunrise boats must leave Port Edevane in the small hours; the boatmen keep hot tea and bread in the cabin, and passengers wait on deck wrapped in blankets for the sky to pale. The waters around are the fishermen's traditional grounds, the few families by the lighthouse have fished here for generations, seabirds nest on the rocks and grass, and on windy days the whole island hears nothing but waves and birds.\nThe fishing families' houses are all built with their backs to the east wind and their windows on the west side; the old people say this keeps out the wind and lets them watch the lights of Edevane Island come on in the evening. Someone has painted a white line on the rocks below the lighthouse and called it the islands' \"easternmost step\", and sunrise visitors always stand on it for a photograph. East of Eastmost Isle there is nothing but the open ocean beyond the islands; on clear days the horizon is as straight as if drawn with a ruler, and the fishermen call this \"the place where day breaks\"."
  - id: nat_kt82ch
    subtype: island
    status: generated
    detect: { kind: island, at_km: [289.8, 151.8] }
    names: { zh: 哨岛, en: Sentinel Isle, art-x-viking: Wachposteninsel, art-x-buckham: Isola della Sentinella }
    notes:
      zh: "哨岛是群岛东北外海的小岛，面积一百四十多平方公里，位于亚利图克岛外海，属布兰诺克堡市布兰诺克堡区。哨岛扼守从东方进入群岛的航路，山顶的哨岛雷达站是海事与气象雷达，日夜监视东方航路上的船只和天气，把信息传给群岛的海事和气象部门，岛名由此而来。\n岛的地势不高，最高处不到两百米，四周是陡峭的海岸，浪大的日子里海浪拍打崖壁，白沫一直溅到崖顶的草坡上。岛上还有海鸟栖息地，春夏两季崖壁上挤满了筑巢的海鸟，雷达站的值守人员闲时会在望远镜里数一数鸟巢。除雷达站的值守人员外，岛上几乎没有居民，补给船定期从布兰诺克堡运来食品、燃料和信件，风浪太大时，补给就得推迟几天。雷达天线在山顶缓缓旋转，从亚利图克岛的山脊上就能望见它的白色罩子。值守人员轮班上岛，一班要住上好几周，宿舍里的书架上堆满了前几班留下的小说和棋盘。\n雷达站的值守人员说，在哨岛上值班最要紧的是两件事：盯紧屏幕上从东方驶来的光点，和看准补给船来的日子。他们最先发现东边压过来的风暴，消息传到布兰诺克堡，运维港的船就开始收工回港；岛上的人也因此常说，布兰诺克堡的天气预报，是哨岛「站岗」站出来的。"
      en: "Sentinel Isle is an islet in the north-eastern outer waters, a little over 140 km², lying off Jaalituuq Island in Fort Brannock District of Fort Brannock. It guards the sea route into the islands from the east, and the Sentinel Isle Radar Station on its summit, a maritime and weather radar, watches the ships and weather on the eastern approaches day and night and passes the information to the islands' maritime and weather services, which gave the island its name.\nThe island is not high, rising to less than 200 m, and is ringed by steep coasts; on rough days the waves crash against the cliffs and the spray reaches the grass at the top. There are seabird colonies too, and in spring and summer the cliffs are crowded with nesting birds, which the radar crew sometimes count through their telescopes in quiet hours. Apart from the radar station's crew hardly anyone lives on the island; a supply boat comes out regularly from Fort Brannock with food, fuel and post, and when the sea is too rough the supplies have to wait a few days. The radar turns slowly on the summit, and its white dome can be seen from the ridges of Jaalituuq Island. The crew come out in shifts of several weeks at a time, and the shelves in their quarters are piled with novels and board games left by earlier shifts.\nThe radar crew say that two things matter most on a Sentinel Isle shift: keeping an eye on the blips coming in from the east, and knowing which day the supply boat is due. They are the first to see storms rolling in from the east, and when word reaches Fort Brannock the boats at the service port start heading in; so people on the island like to say that Fort Brannock's weather forecast is made by Sentinel Isle \"standing guard\"."
  - id: nat_0j0p38
    subtype: island
    status: generated
    detect: { kind: island, at_km: [246.2, 114.8] }
    names: { zh: 灯塔岛, en: Lighthouse Isle, art-x-viking: Leuchtturminsel, art-x-buckham: Isola del Faro }
    notes:
      zh: "灯塔岛是阿夫琳岛东端外的小岛，面积约 310 平方公里，最高处 211 米，属阿夫琳港市灯塔区。它与阿夫琳岛之间隔着宽不到 3 公里的灯塔水道，这条水道是进出阿夫琳湾的航道，大型邮轮从岛旁缓缓驶过，开进湾内的阿夫琳港邮轮母港。岛上的灯塔岛灯塔是一座老灯塔，为进出阿夫琳湾的邮轮与渔船引航，与阿夫琳岛上的阿夫琳港灯塔隔着水道遥相呼应，小岛也因这座灯塔得名。\n全岛是起伏的草坡和裸露的礁岩，几乎不见树木，海风终年吹拂，起雾的日子里，灯塔的光束和雾笛是水道上最可靠的路标。草坡和礁石是海鸟栖息的地方，春夏之交崖壁上挤满了筑巢的海鸟。每年夏季，座头鲸和虎鲸经灯塔水道洄游，灯塔区观鲸码头的观鲸船常在岛外看到鲸群喷水，船长们习惯以灯塔为参照，向乘客报出鲸群的方位。\n岛上只住着灯塔看守人一家，补给船每周从阿夫琳港来一次。晴天时站在灯塔下，眼前是阿夫琳湾和湾里排开的邮轮，远处是从海边拔起的卡洛韦峰。看守人说，邮轮进港时乘客总爱举着相机对准灯塔，他最常做的事就是站在门口挥手，「一个夏天下来，胳膊比渔民的还壮」。"
      en: "Lighthouse Isle is an islet off the eastern end of Aveline Island, about 310 km² and rising to 211 m, in Lighthouse District of Port Aveline. Lighthouse Sound, less than 3 km wide, separates it from Aveline Island; the sound is the fairway into Aveline Bay, and big cruise ships glide slowly past the island on their way to the Port Aveline Cruise Port inside the bay. The island's Lighthouse Isle Light is an old lighthouse that guides cruise ships and fishing boats in and out of Aveline Bay and answers the Port Aveline Lighthouse on the main island across the sound; the island takes its name from it.\nThe whole island is rolling grass and bare rock with hardly a tree, swept by wind all year, and on foggy days the beam and foghorn of the light are the surest marks on the sound. Seabirds nest on the grassy slopes and rocks, and in late spring the cliffs are crowded with nesting birds. Every summer humpbacks and killer whales pass through Lighthouse Sound, and the boats from Lighthouse District's whale-watching quay often see pods blowing off the island; their skippers are used to calling out the whales' bearing to passengers by the lighthouse.\nOnly the lighthouse keeper's family lives on the island, and a supply boat comes out from Port Aveline once a week. On a clear day, standing at the foot of the light, you look out over Aveline Bay and the cruise ships lined up in it, with Mount Calloway rising straight from the sea in the distance. The keeper says that when a cruise ship comes in the passengers always point their cameras at the lighthouse, and what he does most is stand at the door and wave: \"by the end of the summer my arm is stronger than a fisherman's\"."
  - id: nat_36qzhj
    subtype: island
    status: generated
    detect: { kind: island, at_km: [75.2, 101.8] }
    names: { zh: 卡蒂马苏克岛, en: Kattimasuq Island, art-x-viking: Kattimasuqinsel, art-x-buckham: Isola Kattimasuq }
    notes:
      zh: "卡蒂马苏克岛是阿克斯岛南端外的小岛，面积两百二十多平方公里，最高处 220 米，属阿克斯维克市阿克斯维克区，位于阿克斯维克湾湾口。阿克斯海峡的潮流与来自暖泉方向的潮流在岛旁交汇，岛名由此而来，这个塔夫鲁纳克语名在一片北欧地名中格外显眼。\n卡蒂马苏克岛像一道天然的屏障挡在湾口，使七百多平方公里的阿克斯维克湾水深浪静，大型集装箱船和散货船可以全天候进出群岛最大的集装箱港阿克斯维克。湾的两侧是西爪岬和东爪岬，东爪岬上的灯塔与岛上的灯标一起为进港船只导航，两股潮流在岛旁相遇时，水面会出现一道道细碎的涡纹，引航员对这片水域的脾气了如指掌。阿克斯岛纵贯高速、阿斯跨海高速和阿克斯维克湾公路都从岛旁经过，阿斯跨海高速的阿克斯维克特大桥从湾口伸向东南的海面，通往长船岛的斯蒂尔维克。\n岛的高处是一片草坡，可以俯瞰阿克斯维克湾的岸桥、堆场和来往的货轮，岛上没有常住居民，只有维护灯标的工人定期乘船上岛，海鸟在礁石和草坡上栖息。阿克斯维克的码头工人说，卡蒂马苏克岛是港口「不领工资的门卫」：风暴天里外海浪高数米，湾里的岸桥照样作业，全靠这座小岛挡在门口。"
      en: "Kattimasuq Island is an islet off the southern end of Akkersey, a little over 220 km² and rising to 220 m, in Akkersvik District of Akkersvik City, at the mouth of Akkersvik Bay. The tides of Akkersey Strait meet those coming from the direction of Warmspring beside it, hence its name, a Tavrunaq name that stands out among the Nordic place names around it.\nIt stands across the mouth of the bay like a natural breakwater, keeping the 700-odd km² of Akkersvik Bay deep and calm so that large container ships and bulk carriers can come and go in any weather at the Port of Akkersvik, the largest container port in the islands. West Fluke and East Fluke flank the bay, and the lighthouse on East Fluke and the beacons on the island together guide ships into port; where the two tides meet beside the island the water breaks into fine eddies, and the pilots know every mood of these waters. The Akkersey Spine Expressway, the Akkersvik–Styrvik Sea Crossing and the Akkersvik Bay Road all pass close by, and the Akkersvik Sea Bridge of the Akkersvik–Styrvik Sea Crossing reaches out from the bay mouth across the sea to the south-east, towards Styrvik on Longship Island.\nIts high ground is a grassy slope looking down on the quay cranes, container yards and passing freighters of the bay. No one lives on the island; only the men who maintain the beacons come out by boat from time to time, and seabirds nest on the rocks and grass. Akkersvik's dockers call Kattimasuq the port's \"unpaid doorman\": on stormy days the waves outside run several metres high, yet the cranes in the bay keep working, all thanks to the little island standing at the door."
  - id: nat_yk9yaz
    subtype: island
    status: generated
    detect: { kind: island, at_km: [129.2, 66.8] }
    names: { zh: 引水岛, en: Pilot Isle, art-x-viking: Lotseninsel, art-x-buckham: Isola dei Piloti }
    notes:
      zh: "引水岛是托利文特岛北面的小岛，面积五十多平方公里，位于莫斯维克湾湾口外，属莫塞市莫塞区。旧时港口引航员在这里等候，登上进出阿夫琳海峡的大船，带它们穿过海峡里的浅滩和航道，岛名由此而来。长约三百公里的阿夫琳海峡在这一带收窄成南口，三岛之间的水道在附近交汇，是大船最需要引航的一段。\n岛上保留着一座老引水站和灯塔，石砌的引水站里还挂着旧时的潮汐表和信号旗，墙上刻着一代代引航员的名字缩写。如今引航员改从港口乘引航船出海，引水岛成了度假小岛，渡船把游客送到岛上野餐和观鸟，老引水站的一间屋子改成了小小的展室，讲述引航员的故事。岛的地势低缓，最高处九十多米，草坡上开满野花，从岛上可以望见莫斯维克湾里的点点白帆和阿夫琳海峡中往来的大船，湾里成群的银鸥也常飞来岛上歇脚，莫塞市的名字正是从这些海鸥而来。\n莫塞人周末最爱带一篮子面包、熏鱼和果汁上岛，在灯塔下铺一块毯子坐一下午。老引航员的后人说，过去引航员在岛上等船时最怕起雾，一等就是好几天，只好靠下棋和钓鱼打发时间，引水站门口的那块平石头，就是他们当年的棋盘。"
      en: "Pilot Isle is an islet north of Tollivant Island, a little over 50 km², lying outside the mouth of Måsvik Bay in Måsey District of Måsey City. In the old days the port's pilots waited here to board the big ships bound in and out of Aveline Strait and take them through its shoals and channels, hence the island's name. The 300 km Aveline Strait narrows here into its southern mouth, and the channels between the three islands meet nearby, the stretch where big ships most need a pilot.\nThe island keeps an old pilot station and a lighthouse; the stone pilot station still has old tide tables and signal flags on its walls, carved with the initials of generations of pilots. Nowadays the pilots go out by pilot boat from the harbour, and Pilot Isle has become a holiday islet, with boats bringing visitors over for picnics and birdwatching, and one room of the old pilot station has become a small exhibition telling the pilots' story. It is low and gentle, rising to just over 90 m, its grassy slopes full of wild flowers, and from it you can see the white sails dotted over Måsvik Bay and the big ships passing in the strait; flocks of herring gulls from the bay often rest on the island too, the gulls that gave Måsey its name.\nAt weekends Måsey people love to take a basket of bread, smoked fish and juice over to the island and spend the afternoon on a blanket below the lighthouse. Descendants of the old pilots say that what the pilots feared most while waiting for ships was fog, which could keep them waiting for days with only chess and fishing to pass the time; the flat stone by the pilot station door was their chessboard."

  # ── Bays ─────────────────────────────────────────────────
  - id: nat_zgv4r2
    subtype: bay
    status: generated
    detect: { kind: bay, at_km: [189.8, 149.2] }
    names: { zh: 长船湾, en: Longship Bay, art-x-viking: Langskipbucht, art-x-buckham: Baia Navelunga }
    notes:
      zh: 长船岛东岸的海湾，面积九十多平方公里，维京长船曾在此停泊，湾畔是长船古城，海湾和首府都由此得名。古城的城墙、教堂和石屋沿港湾和山坡层层排开，山顶是群岛最重要的考古遗址维京王厅遗址，长船博物馆收藏着出土的长船、兵器和金银器；每年夏季的长船节，复原的维京长船从港湾驶出，场面壮观。维京群岛领地政府就设在古城附近，长船站是首府的铁路枢纽，维长高速从北维京岛穿过海底，在福恩斯塔德区出地面。湾南是汇金区，玻璃塔楼与对岸的古城隔水相望，新旧长船在湾两岸交相辉映。
      en: A bay on the east coast of Longship Island, a little over 90 km², where the Viking longships once lay; the old town of Longship stands on its shore, and both bay and capital take their name from it. The walls, churches and stone houses of the old town climb in tiers from the harbour up the slopes, and on the hilltop are the Viking Hall Ruins, the most important archaeological site in the islands, whose longships, weapons and gold and silver are shown in the Longship Museum; at the Longship Festival each summer reconstructed longships sail out of the harbour in a spectacular show. The territorial government sits near the old town, Longship station is the capital's rail hub, and the Viking Port–Longship Expressway surfaces in Fornstad after its run beneath the sea from North Viking Island. To the south lies Goldmark, whose glass towers face the old town across the water, old and new Longship on either shore.
  - id: nat_h3knsp
    subtype: bay
    status: generated
    detect: { kind: bay, at_km: [189.2, 136.2] }
    names: { zh: 汇金湾, en: Goldmark Bay, art-x-viking: Goldmarkbucht, art-x-buckham: Baia Marcoro }
    notes:
      zh: 长船湾以南的小海湾，面积六十多平方公里，属长船市汇金区，湾的东侧是伸向外海的金角。汇金区的玻璃塔楼环湾而立，离岸银行、信托与基金公司聚集，汇金证券交易所和群岛银行大厦是这里的地标，这一带是维京群岛的金融中心。湾畔修建了滨海长廊和游艇码头，从这里可以眺望北面古城的城墙和王厅遗址，夜晚塔楼的灯光倒映在湾水中，是首府最摩登的景色。奥斯特哈门港口高速经过湾畔，西接福恩斯塔德，东通奥斯特哈门。
      en: A small bay south of Longship Bay, a little over 60 km², in Goldmark District of Longship, with Gold Point reaching out to sea on its eastern side. The glass towers of Goldmark ring the bay, home to offshore banks, trust companies and funds, with the Goldmark Stock Exchange and the Islands Bank Tower as landmarks; this is the financial centre of the Viking Islands. A seafront promenade and marina line the shore, looking north to the walls of the old town and the ruins of the royal hall, and at night the lights of the towers are mirrored in the water, the capital's most modern view. The Austhamn Port Expressway passes the bay, linking the old town to the west with Austhamn to the east.
  - id: nat_1abejp
    subtype: bay
    status: generated
    detect: { kind: bay, at_km: [192.2, 169.8] }
    names: { zh: 瓦克特维克湾, en: Vaktvik Bay, art-x-viking: Vaktvik, art-x-buckham: Baia della Vedetta }
    notes:
      zh: 长船岛船首南侧的海湾，面积一百八十多平方公里，属长船市北岬区，紧靠北岬，湾口外是瓦克特岛。瓦克特岛与长船岛之间四公里宽的瓦克特水道，是从北方进出长船的航道，船只从这里绕过船首驶向长船湾。维京时代，瓦克特岛顶的烽火预警北方来船，湾内的村落望见火光便会戒备，海湾和小岛都由此得名。如今维长高速的维京海底公路隧道从湾外的海底穿过，海面上依旧安静，湾岸是牧羊草场和零星的渔屋，从湾畔的山坡上可以望见瓦克特岛上烽火台的石基。
      en: A bay on the south side of Longship Island's bow, a little over 180 km², in North Cape District of Longship, lying right beside North Cape with Vaktey off its mouth. The four-kilometre Vaktsund between Vaktey and Longship Island is the way in to Longship from the north, and ships round the bow here on their way to Longship Bay. In the Viking age a beacon on Vaktey warned of ships from the north, and the villages on the bay would stand ready when they saw it, which gave both the bay and the island their names. Today the Viking Undersea Road Tunnel of the Viking Port–Longship Expressway runs beneath the seabed outside the bay while the surface stays quiet; sheep pastures and scattered fishermen's huts line the shore, and from the slopes above you can see the stone base of the beacon on Vaktey.
  - id: nat_az5da5
    subtype: bay
    status: generated
    detect: { kind: bay, at_km: [190.8, 177.2] }
    names: { zh: 斯塔文维克湾, en: Stavnvik Bay, art-x-viking: Stavnvik, art-x-buckham: Baia di Prua }
    notes:
      zh: 长船岛船首尖端的海湾，面积一百一十多平方公里，属长船市北岬区，面向北维京岛。海湾就在斯塔文内斯岬旁，是长船岛离维京港最近的海岸，维长真空磁悬浮的维京海底铁路隧道在斯塔文内斯岬出地面，以高架桥登陆，再经北岬区的地面线进入长船。湾内的海岸多是岩石和砾石滩，冬季北风从海峡上直灌入湾，浪大风急。斯塔文内斯岬上的观景台面朝开阔的海峡，可以俯瞰整个斯塔文维克湾，晴天时海天一色，海鸟在湾外的礁石上盘旋。
      en: The bay at the very tip of Longship Island's bow, a little over 110 km², in North Cape District of Longship, facing North Viking Island. It lies beside Stavnnes, the stretch of Longship's coast nearest Viking Port, where the Viking Undersea Rail Tunnel of the Viking Port–Longship Vacuum Maglev surfaces and comes ashore on a viaduct before running across North Cape on the surface into Longship. Its shores are mostly rock and shingle, and in winter the north wind drives straight in off the strait, raising heavy seas. The viewpoint on Stavnnes faces the open strait and looks down over the whole bay; on a clear day sea and sky merge, and seabirds wheel over the skerries outside it.
  - id: nat_r2hpck
