      en: An islet off Longship Island's bow, about 15 km² and the smallest of the named islands, lying east of North Cape in North Cape District of Longship City and facing Longship across the four-kilometre Vaktsund. In the Viking age a beacon lit on its top warned of ships approaching from the north, which gave it its name. Today the Viking Undersea Road Tunnel of the Viking Port–Longship Expressway passes beneath the seabed under the island, running in a straight line from Viking Port on North Viking Island to Longship's old town; the traffic flows under the sea while Vaktey above stays quiet. The stone base of the beacon survives on its top, which is only just over 30 m high, and its low outline can be seen beyond the sound from the North Cape shore.
  - id: nat_37jgdq
