    names: { zh: 富鲁海姆湾, en: Furuheim Bay, art-x-viking: Furuheimbucht, art-x-buckham: Baia dei Pini }
    notes:
      zh: 阿克斯岛东北端的海湾，面积两百多平方公里，属富鲁海姆市富鲁海姆区，四周松林环绕。湾畔的富鲁海姆镇是富鲁海姆市的中心，湾边是锯木厂、木材码头和木结构的小镇，镇上有一条以木工坊、皮具店和猎人商店为主的老街，木材从这里装船运往阿克斯维克和群岛各地。湾外是赫里姆岛自然保护区，冬季常有海冰和霜雾；阿克斯岛峡湾公路沿西岸经尤普峡湾北上到达富鲁海姆湾，阿克斯岛纵贯高速也从阿克斯维克通往这里。松林间的步道通往阿克斯岛最高峰铁锚峰和锚链冰川，夏季游客在湾畔的森林木屋住下，再徒步上山。
      en: A bay at the north-eastern end of Akkersey, a little over 200 km², in Furuheim District of Furuheim City, ringed by pine forest. The town of Furuheim on its shore is the city's centre, with sawmills, timber quays and wooden houses along the water and an old street of woodworkers, leather shops and hunters' outfitters; timber is shipped from here to Akkersvik and across the islands. Off the bay lies the Hrimey Nature Reserve, often wrapped in sea ice and frost fog in winter. The Akkersey Fjord Road comes north up the west coast by way of Djupfjord and the fjords to reach Furuheim Bay, and the Akkersey Spine Expressway runs here from Akkersvik too. Trails through the pines lead to Iron Anchor Peak, the island's highest summit, and the Anchor Chain Glacier, and in summer visitors stay in forest cabins by the bay before setting off on foot.
  - id: nat_nzwany
