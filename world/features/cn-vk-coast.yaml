      en: An islet off the south coast of Warmspring Island, a little over 60 km², in New Tremaine District of New Tremaine, lying off the mouth of Tremaine Bay and, with Warmspring Island, at the southern limit of the archipelago. The whole island is covered in ash from Warmspring Volcano, low and flat at little more than 70 m, its grey-black ground bearing only sparse grass and moss, hence its name. No one lives there; it is home to seabirds and seals, and from the shore of Tremaine Bay its low grey shape can be seen lying on the sea. Researchers often visit to watch how plants and animals settle on the volcanic ash.
