    names: { zh: 西爪岬, en: West Fluke, art-x-viking: Westflunke, art-x-buckham: Marra Ovest }
    notes:
      zh: 阿克斯维克湾西侧的岬角，属阿克斯维克市西爪区，与东爪岬一起如锚的两爪抱住阿克斯维克湾，是阿克斯岛西侧的锚爪。岬角深入大海，海崖、草坡和沙湾交错，阿克斯维克人周末最喜欢沿着海岸步道徒步，观赏海鸟和日落。西爪区是阿克斯维克市面积最大、最有田园风光的区，岬上的大部分土地是起伏的牧场，奶牛和绵羊在草坡上吃草，乳品厂为城市供应黄油、奶酪和酸奶。阿克斯维克湾公路以西爪特大桥通往岬角一带，向东经阿克斯维克湾通往瑙斯特海姆区。从岬尖望去，阿克斯维克湾的港口、卡蒂马苏克岛和远处的东爪岬尽收眼底。
      en: The cape on the west side of Akkersvik Bay, in West Fluke District of Akkersvik; with East Fluke it holds the bay like the two flukes of an anchor, the western fluke of Akkersey. It reaches far into the sea, with cliffs, grassy slopes and sandy coves alternating, and at weekends Akkersvik people love to walk the coast path watching seabirds and the sunset. West Fluke is the largest and most rural district of the city, and most of the cape is rolling pasture where dairy cows and sheep graze and creameries make butter, cheese and yoghurt for the city. The Akkersvik Bay Road reaches the cape over the West Fluke Viaduct and runs east round the bay to the Naustheim District. From the tip of the cape the port, Kattimasuq Island and East Fluke across the water are all in view.
  - id: nat_11r771
