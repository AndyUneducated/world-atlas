    detect: { kind: bay, at_km: [189.8, 149.2] }
    names: { zh: 长船湾, en: Longship Bay, art-x-viking: Langskipbucht, art-x-buckham: Baia Navelunga }
    notes:
      zh: 长船岛东岸的海湾，面积九十多平方公里，维京长船曾在此停泊，湾畔是长船古城，海湾和首府都由此得名。古城的城墙、教堂和石屋沿港湾和山坡层层排开，山顶是群岛最重要的考古遗址维京王厅遗址，长船博物馆收藏着出土的长船、兵器和金银器；每年夏季的长船节，复原的维京长船从港湾驶出，场面壮观。维京群岛领地政府就设在古城附近，长船站是首府的铁路枢纽，维长高速从北维京岛穿过海底，在福恩斯塔德区出地面。湾南是汇金区，玻璃塔楼与对岸的古城隔水相望，新旧长船在湾两岸交相辉映。
      en: A bay on the east coast of Longship Island, a little over 90 km², where the Viking longships once lay; the old town of Longship stands on its shore, and both bay and capital take their name from it. The walls, churches and stone houses of the old town climb in tiers from the harbour up the slopes, and on the hilltop are the Viking Hall Ruins, the most important archaeological site in the islands, whose longships, weapons and gold and silver are shown in the Longship Museum; at the Longship Festival each summer reconstructed longships sail out of the harbour in a spectacular show. The territorial government sits near the old town, Longship station is the capital's rail hub, and the Viking Port–Longship Expressway surfaces in Fornstad after its run beneath the sea from North Viking Island. To the south lies Goldmark, whose glass towers face the old town across the water, old and new Longship on either shore.
  - id: nat_h3knsp
    subtype: bay
    status: generated
    detect: { kind: bay, at_km: [189.2, 136.2] }
    names: { zh: 汇金湾, en: Goldmark Bay, art-x-viking: Goldmarkbucht, art-x-buckham: Baia Marcoro }
    notes:
      zh: 长船湾以南的小海湾，面积六十多平方公里，属长船市汇金区，湾的东侧是伸向外海的金角。汇金区的玻璃塔楼环湾而立，离岸银行、信托与基金公司聚集，汇金证券交易所和群岛银行大厦是这里的地标，这一带是维京群岛的金融中心。湾畔修建了滨海长廊和游艇码头，从这里可以眺望北面古城的城墙和王厅遗址，夜晚塔楼的灯光倒映在湾水中，是首府最摩登的景色。奥斯特哈门港口高速经过湾畔，西接福恩斯塔德，东通奥斯特哈门。
      en: A small bay south of Longship Bay, a little over 60 km², in Goldmark District of Longship, with Gold Point reaching out to sea on its eastern side. The glass towers of Goldmark ring the bay, home to offshore banks, trust companies and funds, with the Goldmark Stock Exchange and the Islands Bank Tower as landmarks; this is the financial centre of the Viking Islands. A seafront promenade and marina line the shore, looking north to the walls of the old town and the ruins of the royal hall, and at night the lights of the towers are mirrored in the water, the capital's most modern view. The Austhamn Port Expressway passes the bay, linking the old town to the west with Austhamn to the east.
  - id: nat_1abejp
    subtype: bay
    status: generated
    detect: { kind: bay, at_km: [192.2, 169.8] }
    names: { zh: 瓦克特维克湾, en: Vaktvik Bay, art-x-viking: Vaktvik, art-x-buckham: Baia della Vedetta }
    notes:
      zh: 长船岛船首南侧的海湾，面积一百八十多平方公里，属长船市北岬区，紧靠北岬，湾口外是瓦克特岛。瓦克特岛与长船岛之间四公里宽的瓦克特水道，是从北方进出长船的航道，船只从这里绕过船首驶向长船湾。维京时代，瓦克特岛顶的烽火预警北方来船，湾内的村落望见火光便会戒备，海湾和小岛都由此得名。如今维长高速的维京海底公路隧道从湾外的海底穿过，海面上依旧安静，湾岸是牧羊草场和零星的渔屋，从湾畔的山坡上可以望见瓦克特岛上烽火台的石基。
      en: A bay on the south side of Longship Island's bow, a little over 180 km², in North Cape District of Longship, lying right beside North Cape with Vaktey off its mouth. The four-kilometre Vaktsund between Vaktey and Longship Island is the way in to Longship from the north, and ships round the bow here on their way to Longship Bay. In the Viking age a beacon on Vaktey warned of ships from the north, and the villages on the bay would stand ready when they saw it, which gave both the bay and the island their names. Today the Viking Undersea Road Tunnel of the Viking Port–Longship Expressway runs beneath the seabed outside the bay while the surface stays quiet; sheep pastures and scattered fishermen's huts line the shore, and from the slopes above you can see the stone base of the beacon on Vaktey.
  - id: nat_az5da5
