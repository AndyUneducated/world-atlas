# Coastal landforms of the Viking Islands: islands, bays, capes and straits.
# The generator finds them in the coastline (pipeline/atlas/coast.py); each entry names the
# landform of `detect.kind` nearest to `detect.at_km` (design km, x east, y north).
# Unnamed landforms are listed in .cache/candidates-div_raat4g.json after a build.
features:
  # ── Main islands ─────────────────────────────────────────
  - id: nat_170rsf
    subtype: island
    status: generated
    detect: { kind: island, at_km: [148.2, 130.2] }
    names: { zh: 长船岛, en: Longship Island, art-x-viking: Langskipinsel, art-x-buckham: Isola Navelunga }
    notes:
      zh: "长船岛是维京群岛最大的岛，面积四万一千多平方公里，狭长如一艘长船，船首朝东北指向北维京岛，船尾朝西南伸向暖泉岛与阿夫琳岛之间的水道。谢尔海姆山像倒扣的船龙骨纵贯全岛，主峰斯塔文廷峰海拔一千二百九十多米，是岛上最高点，山脊把全岛分成东西两岸。长船、斯蒂尔维克、谢尔海姆和弗洛德维克四座市都在这座岛上。\n首府长船建在船首一带的长船湾畔，古城里有维京王厅遗址和长船博物馆，对岸的汇金区是群岛的金融中心，北岬有长船国际机场和群岛大学。船尾的斯蒂尔维克是几条跨海高速的交汇点，山脚下的谢尔海姆镇以林场和滑雪场闻名，西北岸的弗洛德维克有横跨海湾口的潮汐电站。山脊挡住了西风，背风的长船一年只有约 900 毫米降水，迎风的西岸则湿润得多。维长高速和维长真空磁悬浮以海底隧道直通北维京岛的维京港，长阿、阿克斯、阿斯、群岛和西格利五条跨海高速从这里通往其他大岛，群岛高速铁路和阿克斯高速铁路也在长船站交会，长船岛因此是整个群岛的交通中心。\n长船人爱说，整座岛是一条倒扣在海上的船，谢尔海姆山是龙骨，所以岛上的人「住在船底下也从不晕船」。从船首到船尾开车要大半天，沿途从古城的石屋、汇金的玻璃塔楼一路换成山坡上的林场和船尾的渔村。"
      en: "Longship Island is the largest of the Viking Islands, more than 41,000 km², long and narrow like a longship, its bow pointing north-east at North Viking Island and its stern reaching south-west towards the waters between Warmspring and Aveline islands. The Kjølheim Hills run its length like an upturned keel; their main summit, Stavntind at a little under 1,300 m, is the island's highest point, and the ridge divides the island into an east and a west shore. Four cities, Longship, Styrvik, Kjølheim and Flodvik, lie on the island.\nThe capital, Longship, stands on Longship Bay near the bow: the old town has the Viking Hall Ruins and the Longship Museum, Goldmark across the bay is the islands' financial centre, and North Cape has Longship International Airport and the University of the Islands. Styrvik at the stern is where several sea-crossing expressways meet, Kjølheim at the foot of the hills is known for its forests and ski slopes, and Flodvik on the north-west coast has a tidal power station across the mouth of its bay. The hills keep off the westerlies, so sheltered Longship gets only about 900 mm of rain a year while the windward west shore is much wetter. The Viking Port–Longship Expressway and Vacuum Maglev run through undersea tunnels to Viking Port on North Viking Island, five sea-crossing expressways (Longship–Port Aveline, Akkersey Strait, Akkersvik–Styrvik, Island Chain and Sigley) lead from here to the other large islands, and the Island Chain and Akkersey high-speed railways meet at Longship Station, making Longship Island the hub of the whole archipelago.\nLongship people like to say that the whole island is a boat turned upside down on the sea with the Kjølheim Hills as its keel, which is why its people \"live under the hull and never get seasick\". Driving from bow to stern takes the best part of a day, and along the way the old town's stone houses and Goldmark's glass towers give way to hillside forests and the fishing villages of the stern."
  - id: nat_2p2v9m
    subtype: island
    status: generated
    detect: { kind: island, at_km: [206.8, 101.2] }
    names: { zh: 阿夫琳岛, en: Aveline Island, art-x-viking: Avelineinsel, art-x-buckham: Isola Aveline }
    notes:
      zh: "阿夫琳岛是长船岛东南的大岛，面积三万六千四百多平方公里，在群岛中排第三，隔长约三百公里的阿夫琳海峡与长船岛平行。卡洛韦岭纵贯全岛中部，从海上望去如一面鼓满的白帆，岛名则来自早年最先在这里靠岸的商船「阿夫琳号」。最高峰卡洛韦峰海拔一千五百二十多米，耸立在东端的阿夫琳湾畔；山岭向西南延伸到维托斯，伸展成一道道白色石灰岩山脊。岛上有阿夫琳港、卡洛韦堡、萨尔塔维克和莫塞四座市。\n岛的东北端是群岛第四大城市阿夫琳港，邮轮母港、免税城和老城帆城区沿海湾展开，群岛高速铁路也在这里设站。东南岸的萨尔塔维克以海盐和海上风电闻名，菲斯克海姆鱼市是全岛最大的鲜鱼市场；西北麓的卡洛韦堡是林场和山区小镇，东麓望海区的山坡上种满苹果、梨和樱桃；西南端的莫斯维克湾风平浪静，是度假胜地。长阿跨海高速越过阿夫琳海峡通往首府长船，阿夫琳纵贯高速经萨尔塔维克南下到西南端的莫塞，西格利跨海高速再从那里经西格利岛通往暖泉岛，卡洛韦岭公路则沿西北麓连接帆城与莫塞。\n卡洛韦岭这面「帆」替东麓的果园挡住了西北来的冷风，苹果才能在海边结得又红又甜。秋收时果农在山脚办「谢帆节」，盐田的工人送来花盐，渔港送来鲜鱼，一张长桌从果园摆到路边，路过的人都可以坐下尝一口。"
      en: "Aveline Island is the large island south-east of Longship Island, more than 36,400 km², third in size among the islands, lying parallel to Longship across the 300 km Aveline Strait. Calloway Ridge runs along its middle and from the sea looks like a full white sail, while the island is named after the Aveline, the merchant ship that first put in here. Its highest summit, Mount Calloway at just over 1,520 m, rises above Aveline Bay at the eastern end, and the ridge runs south-west to Hvitås, where it spreads out into white limestone crests. Four cities lie on the island: Port Aveline, Fort Calloway, Saltavik and Måsey.\nIn the north-east is Port Aveline, the fourth city of the islands, whose cruise port, duty-free mall and old town of Sail Town line the bay, and where the Island Chain High-Speed Railway has a station. Saltavik on the south-east coast is known for sea salt and offshore wind, and the Fiskheim Fish Market is the island's largest; Fort Calloway on the north-western slopes is forest and hill towns, the slopes of Seawatch on the eastern side are planted with apples, pears and cherries, and Måsvik Bay at the south-western end is calm water and a holiday favourite. The Longship–Port Aveline Sea Crossing bridges the strait to the capital, the Aveline Spine Expressway runs south by way of Saltavik to Måsey at the south-western end, the Sigley Sea Crossing continues from there by way of Sigley to Warmspring Island, and the Calloway Ridge Road follows the north-western slopes from Sail Town to Måsey.\nThe \"sail\" of Calloway Ridge shields the eastern orchards from the cold north-westerly winds, which is why apples ripen so red and sweet beside the sea. At harvest the growers hold a \"Thank-the-Sail Festival\" at the foot of the ridge: the salt workers bring flaky salt, the harbour brings fresh fish, a long table runs from the orchard to the roadside, and anyone passing may sit down for a taste."
  - id: nat_bcjvmn
    subtype: island
    status: generated
    detect: { kind: island, at_km: [101.8, 162.8] }
    names: { zh: 阿克斯岛, en: Akkersey, art-x-viking: Akkersey, art-x-buckham: "Isola dell'Ancora" }
    notes:
      zh: "阿克斯岛是长船岛西北的大岛，面积三万六千九百多平方公里，在群岛中仅次于长船岛，隔一百四十公里长的阿克斯海峡与长船岛相望，岛上有阿克斯维克、托克维克和富鲁海姆三座市。锚链山纵贯全岛，主峰铁锚峰海拔两千零七十多米，是阿克斯岛最高点，也是群岛仅次于火口峰的第二高峰，北坡挂着群岛唯一的山岳冰川锚链冰川；西岸峡湾深切，两岸陡崖高达数百米。岛的南端两只「锚爪」西爪岬和东爪岬抱住阿克斯维克湾，水深浪静，是群岛最好的天然良港，阿克斯岛（维京语里意为「锚岛」）也由此得名。\n群岛第二大城市阿克斯维克就在阿克斯维克湾畔，拥有群岛最大的集装箱港和造船基地，瑙斯特海姆区沿海峡排开船坞，链城区有群岛航运交易所；西岸的托克维克清晨多半笼罩在海雾里，北部的富鲁海姆市是大片松林和林场。阿克斯跨海高速经弗洛德维克、阿斯跨海高速经斯蒂尔维克与长船岛相连，阿克斯岛纵贯高速把南端的阿克斯维克与东北端的富鲁海姆连成一线，阿托高速以九公里长的隧道穿过锚链山主脊，阿克斯高速铁路则经弗洛德维克通往长船。\n托克维克的渔民说海雾是锚链山「呼出的气」，雾越浓，下午天越晴，所以雾大的早晨他们先喝咖啡、补网，等雾散了再出海。富鲁海姆的猎人则有另一句老话：在松林里迷了路，只要爬上高树找到铁锚峰的雪顶，就能走回家。"
      en: "Akkersey is the large island north-west of Longship Island, more than 36,900 km², second in size only to Longship and facing it across the 140 km Akkersey Strait; three cities lie on it, Akkersvik, Tåkevik and Furuheim. The Anchor Chain Mountains run its length; their main summit, Iron Anchor Peak at just over 2,070 m, is the island's highest point and the second-highest peak in the islands after Crater Peak, and carries on its north face the Anchor Chain Glacier, the only mountain glacier in the islands. Fjords cut deep into the west coast between cliffs hundreds of metres high. At the southern end the two \"flukes\", West Fluke and East Fluke, hold Akkersvik Bay between them, deep and calm, the finest natural harbour in the islands and the source of the island's name, which means \"anchor island\" in Viking.\nAkkersvik, the second city of the islands, stands on the bay with the largest container port and shipbuilding base in the archipelago; Naustheim lines the strait with its docks and Chain Town holds the Islands Shipping Exchange. Tåkevik on the west coast spends most mornings in sea fog, and Furuheim in the north is a land of pine forest and timber holdings. The Akkersey Strait Crossing via Flodvik and the Akkersvik–Styrvik Sea Crossing via Styrvik link it to Longship Island, the Akkersey Spine Expressway joins Akkersvik in the south to Furuheim in the north-east, the Akkersvik–Tåkevik Expressway pierces the main ridge in a nine-kilometre tunnel, and the Akkersey High-Speed Railway runs by way of Flodvik to Longship.\nTåkevik's fishermen say the fog is the Anchor Chain Mountains \"breathing out\", and the thicker it is the clearer the afternoon, so on foggy mornings they drink coffee and mend nets first and go out when it lifts. Furuheim's hunters have another old saying: if you lose your way in the pine forest, climb a tall tree, find the snowy top of Iron Anchor Peak, and you can walk home."
  - id: nat_9ajbb1
    subtype: island
    status: generated
    detect: { kind: island, at_km: [62.2, 48.8] }
    names: { zh: 暖泉岛, en: Warmspring Island, art-x-viking: Warmquellinsel, art-x-buckham: Isola Fontecalda }
    notes:
      zh: "暖泉岛是群岛西南端的圆形火山岛，面积近三万四千平方公里，是群岛第四座大岛，岛上有暖泉、新特雷曼和克莱特斯塔德三座市。岛心是一座活火山暖泉火山，整座岛就是它堆成的，主峰火口峰海拔两千二百八十多米，是群岛最高峰，峰顶的暖泉冰帽终年不化，火口内终年冒着蒸汽。河流从火山向四面流入大海，暖河是群岛最长的河，灰河的流域则更大。\n火山的地热让全岛遍布温泉、喷气孔和地热田：东岸的温泉区有群岛最大的温泉度假村，斯瓦特桑德区有黑沙滩和群岛最大的地热电站，南岸的新特雷曼以地热温室著称，西岸的克莱特斯塔德是矿业与地热港城，开采玄武岩、浮石和火山渣，西端的落日岬以日落闻名。南端的新特雷曼年平均气温近 11 度，是群岛最暖的城市，暖泉的最低纪录也只有零下 6 度。群岛跨海高速从克莱特斯塔德横贯全岛跨海通往长船岛，西格利跨海高速以近 27 公里长的暖河特大桥跨越暖河口外的海面，暖泉南环高速和暖泉环山公路环绕火山，群岛高速铁路也在暖泉站停靠，从这里分别跨海通往长船岛和西格利岛。\n冬天属于暖泉岛：游客从暖泉机场下来，直接去泡温泉，在极光下的露天池里仰望夜空，是群岛人招待远客的保留节目。山麓的人家把鸡蛋装进网兜放进热泉里煮，十几分钟就熟，本地人说这是「山给的早饭」。"
      en: "Warmspring Island is the round volcanic island at the south-western end of the archipelago, nearly 34,000 km², the fourth of the large islands, with three cities: Warmspring, New Tremaine and Klettstad. At its heart is Warmspring Volcano, an active volcano that built the whole island; its summit, Crater Peak at just over 2,280 m, is the highest point in the islands, the Warmspring Ice Cap never melts on its top, and steam rises from the crater all year. Rivers run from the volcano to the sea on every side; the Warm River is the longest in the islands, while the Ash River drains a larger basin.\nVolcanic heat fills the island with hot springs, fumaroles and geothermal fields: Hot Springs District on the east coast has the islands' largest spa resort, Svartsand has its black beach and the largest geothermal power station in the islands, New Tremaine on the south coast is known for its geothermal greenhouses, Klettstad on the west coast is a mining and geothermal port that quarries basalt, pumice and scoria, and Sunset Point at the western tip is famous for its sunsets. New Tremaine in the south averages nearly 11 °C over the year, the warmest city in the islands, and Warmspring's record low is only −6 °C. The Island Chain Expressway crosses the island from Klettstad and bridges the sea to Longship Island, the Sigley Sea Crossing spans the sea off the Warm River mouth on the Warm River Sea Bridge, nearly 27 km long, the Warmspring Southern Arc Expressway and the Warmspring Volcano Road circle the volcano, and the Island Chain High-Speed Railway stops at Warmspring Station, crossing the sea from there to Longship Island one way and to Sigley the other.\nWinter belongs to Warmspring Island: visitors step off at Warmspring Airport and go straight to the hot springs, and gazing up at the aurora from an open-air pool is how islanders entertain guests from afar. Households on the lower slopes put eggs in a net bag and lower them into a hot spring, and in ten minutes or so they are done; locals call it \"breakfast from the mountain\"."

  # ── Medium islands ───────────────────────────────────────
  - id: nat_h86h79
    subtype: island
    status: generated
    detect: { kind: island, at_km: [136.2, 33.8] }
    names: { zh: 西格利岛, en: Sigley, art-x-viking: Sigley, art-x-buckham: "Isola dell'Albero" }
    notes:
      zh: "西格利岛是长船岛船尾以南的岛，面积近六千平方公里，是四座大岛之外最大的岛屿，坐落在暖泉岛与阿夫琳岛之间的海面上。岛的地势低缓，最高处只有 169 米，全岛属西格拉维克市，分为北部的西格拉维克区和南部的南桅区，全市约 35 万人。岛上长满笔直高大的松树，旧时为长船港的船坞供应桅木，西格利岛和岛上的西格拉维克市都由此得名。\n北端的西格拉维克是城市中心和渔港，渔船沿着宽约三公里的西格利海峡排开，在海峡和周边海域捕捞鳕鱼、鲱鱼和扇贝，东北端的西格拉内斯岬上有灯塔俯瞰海峡；东南外的牡蛎岛一带的牡蛎养殖远近闻名。南部是南桅区的松林和村庄，锯木坊和小码头散布在林间。西格利跨海高速以西格利岛为中间支点，一段跨海通往长船岛船尾和暖泉，一段跨越西格利海峡通往阿夫琳岛的莫塞；西格利岛公路全长六十多公里，穿过松林连接南桅与西格拉维克，是岛上最有名的风景路线。\n日落时，跨海长桥的桥影映在海峡上，是西格拉维克最美的景色，过境的旅客常在岬角附近的服务区停下来吃一盘烤扇贝。南桅的老木匠至今会挑选最直的松树做帆船桅杆，他们说一根好桅木要「站得直、长得慢」，林子里长得最慢的那几棵，往往要等上几代人才舍得砍。"
      en: "Sigley is the island south of Longship Island's stern, nearly 6,000 km², the largest island after the four big ones, lying in the sea between Warmspring and Aveline islands. It is low and gentle, rising only to 169 m, and the whole island belongs to Siglavik City, divided into Siglavik District in the north and South Mast District in the south, with some 350,000 people in all. The island is covered in tall, straight pines that once supplied masts to the shipyards of Longship's harbour, which gave both Sigley and its city their names.\nSiglavik at the northern end is the city centre and fishing harbour; its boats line the three-kilometre Sigley Strait and take cod, herring and scallops in the strait and nearby waters, and a lighthouse on Siglanes at the north-eastern tip looks over the strait. The oyster beds around Oyster Isle to the south-east are famous. The south is South Mast's pine forests and villages, with sawmills and small jetties among the trees. The Sigley Sea Crossing uses the island as its stepping stone, one span reaching across the sea to Longship's stern and Warmspring and another crossing Sigley Strait to Måsey on Aveline Island, and the Sigley Road, a little over 60 km long, runs through the pines between South Mast and Siglavik, the island's best-known scenic drive.\nAt sunset the shadow of the long bridge falls across the strait, Siglavik's finest view, and travellers passing through often stop at the service area near the cape for a plate of grilled scallops. South Mast's old carpenters still choose the straightest pines for sailing-boat masts; a good mast, they say, must \"stand straight and grow slowly\", and the slowest-growing trees in the forest are often left for generations before anyone can bear to fell them."
  - id: nat_0zxng2
    subtype: island
    status: generated
    detect: { kind: island, at_km: [232.8, 36.2] }
    names: { zh: 圣翁丁岛, en: Saint-Ondine Island, art-x-viking: Saint-Ondine-Insel, art-x-buckham: "Isola Sant'Ondine" }
    notes:
      zh: "圣翁丁岛是群岛南部外海的岛，面积五千多平方公里，最高处 222 米，全岛属圣翁丁市，岛上约 23 万人。圣翁丁镇建在南岸的海湾里，以航海者的守护圣人圣翁丁命名，传说维京航海者曾以岛顶上方的南天星辰定向。南岸绵长的沙滩和温和的海水使圣翁丁成为群岛最受欢迎的夏季度假地之一，圣翁丁海滨度假村和渔村沿海岸分布，岛民以渔业和海岛度假为生，渔民在南部海域捕捞鲭鱼和螃蟹。\n岛的内陆是起伏的石楠荒原和牧场，徒步步道从镇上通往山顶的观景台。圣翁丁公路自圣翁丁镇出发，翻过全岛到达北岸的圣翁丁渡轮码头，全长六十多公里，是岛上唯一的干线公路；渡轮从那里往返阿夫琳岛的萨尔塔维克，是圣翁丁对外交通的唯一通道，每班渡轮靠岸后，公路上都会出现一阵集中的车流。岛的东南外海是灰海豹繁殖的塞尔霍尔姆岛，观察船从镇上出海，半天就能往返。\n夏天是圣翁丁的旺季，海滨大街上冰淇淋店、海鲜摊和冲浪用品店挤满了人，晚上十点还能在沙滩上看落日，在外地工作的年轻人也多在这时回岛，帮家里打理民宿。到了冬天，度假村安静下来，小镇又变回渔镇，老人们说这才是「圣翁丁自己的季节」。渔港旁的熏鱼坊一年四季冒着烟，熏鲭鱼配黑面包是岛上最家常的午饭。"
      en: "Saint-Ondine Island lies in the southern outer waters of the archipelago, more than 5,000 km² and rising to 222 m; all of it belongs to Saint-Ondine, and some 230,000 people live here. The town of Saint-Ondine stands in a bay on the south coast and is named after the patron saint of seafarers, and Viking navigators are said to have steered by the southern stars above the island's summit. The long beaches and mild water of the south coast make it one of the islands' favourite summer holiday spots, and the Saint-Ondine Beach Resort and fishing villages line the shore; islanders live by fishing and holidaymakers, and the fishermen take mackerel and crab in the southern waters.\nInland the island is rolling heather moor and pasture, and footpaths climb from the town to a viewpoint on the summit. The Saint-Ondine Road runs from the town over the island to the Saint-Ondine Ferry Terminal on the north coast, a little over 60 km and the only main road on the island; from there ferries cross to Saltavik on Aveline Island, the island's only link with the outside, and every time a ferry docks a short burst of traffic fills the road. Off the south-east coast lies Selholm, where grey seals breed; viewing boats go out from the town and are back within half a day.\nSummer is Saint-Ondine's high season: the ice-cream parlours, seafood stalls and surf shops of the seafront street are packed, you can still watch the sun set from the beach at ten at night, and young people working elsewhere often come home to help run the family guesthouse. In winter the resort goes quiet and the town turns back into a fishing village, which the old people call \"Saint-Ondine's own season\". The smokehouses by the fishing harbour send up smoke all year round, and smoked mackerel with black bread is the island's everyday lunch."
  - id: nat_43xwsq
    subtype: island
    status: generated
    detect: { kind: island, at_km: [22.8, 138.8] }
    names: { zh: 瓦莱岛, en: Hvaley, art-x-viking: Hvaley, art-x-buckham: Isola Balena }
    notes:
      zh: "瓦莱岛是乌维克库特最大的岛，面积五千一百多平方公里，最高处 302 米，是乌维克库特市的主岛和中心，属瓦莱区，岛上约 8.6 万人。岛名在维京语里意为「鲸岛」。每年夏季，座头鲸、虎鲸和小须鲸在岛外洄游，在北岸的观鲸湾里觅食，观鲸船从瓦莱渡轮码头出发，几乎每次出海都能看到鲸鱼喷水和跃身；瓦莱观鲸中心是群岛的鲸类研究和科普机构，展出鲸鱼骨架、鲸歌录音和迁徙地图。\n岛上的渔村沿港湾分布，渔民捕捞鳕鱼、鲱鱼和龙虾，鱼干晾架和红色的渔屋是瓦莱岛的标志性景观，许多渔家兼营民宿和海鲜餐馆，旅游和渔业相互依存。学校、诊所和商店集中在渡轮码头附近的小镇里，维京语是最主要的母语，老年人比例较高。渡轮从瓦莱岛通往阿夫琳港、阿克斯维克和长船，乌维克库特跨海公路则经伦达霍尔姆岛旁的伦达霍尔姆水道跨海大桥北上，这座七十多公里长的大桥通往乌维克库特的另一座大岛西基克图克岛，桥面设有观鲸平台。\n瓦莱岛一年降水一千六百多毫米，冬天阴冷多风，夏天的白昼却长达十七八个小时，午夜时分天边仍泛着微光。观鲸中心给常来的座头鲸按尾鳍花纹建档起名，岛上的孩子从小就能认出几头「老熟人」，谁家的船先看见它们回来，整个渔村都会知道今年的夏天开始了。"
      en: "Hvaley is the largest of the Uviqkut, more than 5,100 km² and rising to 302 m, the main island and centre of Uviqkut City and home to Hvaley District's 86,000 people. Its Viking name means \"whale island\". Every summer humpback, killer and minke whales pass offshore and feed in Whalewatch Bay on the north coast, and the boats that leave from the Hvaley Ferry Terminal see whales blowing and breaching on almost every trip; the Hvaley Whale Centre is the islands' institute for whale research and education, with skeletons, recordings of whale song and migration maps.\nFishing villages line the harbours and their boats take cod, herring and lobster; drying racks and red fishermen's houses are the island's signature sight, and many fishing families also run guesthouses and seafood restaurants, so that tourism and fishing lean on each other. Schools, the clinic and shops are gathered in the small town by the ferry terminal; Viking is the main mother tongue, and there are many older people. Ferries run from Hvaley to Port Aveline, Akkersvik and Longship, and the Uviqkut Causeway heads north over the Lundaholm Sound Bridge past Lundaholm; the bridge, more than 70 km long with whale-watching platforms on its deck, carries it to Siqqiqtuuq Island, the other large island of the group.\nHvaley gets more than 1,600 mm of rain a year and its winters are raw and windy, but summer days last seventeen or eighteen hours and the sky still glows at midnight. The whale centre names and files the humpbacks that return each year by the markings on their flukes, and island children grow up able to recognise a few \"old friends\"; whichever boat first sees them come back, the whole village soon knows that summer has begun."
  - id: nat_n4g4mt
    subtype: island
    status: generated
    detect: { kind: island, at_km: [283.8, 109.8] }
    names: { zh: 埃德文岛, en: Edevane Island, art-x-viking: Edevaneinsel, art-x-buckham: Isola Edevane }
    notes:
      zh: "埃德文岛是群岛东端的岛，面积三千六百多平方公里，最高处 266 米，是群岛最东的中等岛屿，与东侧的东极岛一起组成埃德文港市，全市约 17.7 万人。岛上的埃德文港镇以最早在这里筑港的埃德文船长命名，这里每天最早迎来群岛的第一缕阳光，清晨在海边看日出是游客必做的事。\n埃德文岛与阿夫琳岛之间是近三十公里宽的埃德文海峡，海峡的滩涂是候鸟迁徙的重要停歇地，春秋两季鹬类、鸻类和雁鸭成群聚集。埃德文港公路全长五十多公里，大半路段位于贴着滩涂延伸的埃德文海峡跨海大桥上，这座近 29 公里长的低矮长桥让桥下潮水自由进出，候鸟季节桥上禁止停车，观鸟要到两端的观测点。渡轮从西岸的埃德文港渡轮码头往返阿夫琳岛的灯塔区，日出旅游、海上风电和渔业是岛上的主要生计。在领地议会选举中，蓝桨保守党是埃德文港的第一大党。\n日出季节，镇上的民宿天不亮就为客人备好热咖啡和毯子，海滨步道上挤满了等待的人，太阳一露头，就有人举起杯子说一声「早」。观鸟的人则偏爱秋天：清晨退潮时，成千上万的水鸟在滩涂上起落，从桥头的观测点望去，像一片被风吹动的灰色云影。"
      en: "Edevane Island lies at the eastern end of the archipelago, more than 3,600 km² and rising to 266 m, the easternmost of the mid-sized islands; with Eastmost Isle to its east it makes up Port Edevane, a city of some 177,000. The town of Port Edevane is named after Captain Edevane, who first built a harbour here, and every day it is the first place in the islands to see the sun; watching the sunrise from the shore is a must for visitors.\nBetween Edevane and Aveline islands lies the Edevane Strait, nearly 30 km wide, whose mudflats are an important stopover for migrating birds, with flocks of sandpipers, plovers, geese and ducks gathering in spring and autumn. Most of the Port Edevane Road, a little over 50 km long, runs on the Edevane Strait Bridge, a low bridge nearly 29 km long that hugs the mudflats and lets the tide flow freely beneath; stopping on it is banned in the migration season, and birdwatchers must use the observation points at either end. Ferries run from the Port Edevane Ferry Terminal on the west coast to Lighthouse District on Aveline Island, and sunrise tourism, offshore wind and fishing are the island's main livelihoods. In elections to the territorial parliament, Blue Oar is the largest party in Port Edevane.\nIn the sunrise season the town's guesthouses have hot coffee and blankets ready for guests before dawn, the seafront path fills with people waiting, and as the sun breaks the horizon someone always raises a cup and says \"morning\". Birdwatchers prefer autumn: at low tide in the early morning thousands of waders rise and settle over the flats, and from the observation point at the end of the bridge they look like a grey cloud-shadow moving in the wind."
  - id: nat_g7hv2z
    subtype: island
    status: generated
    detect: { kind: island, at_km: [49.2, 221.8] }
    names: { zh: 乌利克尤阿克岛, en: Ulikjuaq Island, art-x-viking: Ulikjuaqinsel, art-x-buckham: Isola Ulikjuaq }
    notes:
      zh: "乌利克尤阿克岛是群岛西北外海的渔岛，面积三千一百多平方公里，最高处两百多米，与艾因谢尔岛一起组成乌利克尤阿克市，全市约 15 万人，岛的北缘与艾因谢尔岛、赫里姆岛同在群岛的最北端。岛名是塔夫鲁纳克语，意为「大鱼」，南面隔着宽近四十公里的乌维克库特海峡是西基克图克岛。周围的冷水海域是鳕鱼的产卵场和洄游通道，每年冬末春初鳕鱼汛期，渔船倾巢而出。\n乌利克尤阿克镇坐落在岛西岸的海湾里，港内停满拖网船和延绳钓船，镇边成排的木制鱼干架绵延数公里，鳕鱼去头剖开后成对挂在架上，在海风中风干两三个月，制成群岛最著名的特产风干鳕鱼。乌利克尤阿克岛公路从镇子后方绕过晾晒场，横穿全岛到东岸的乌利克尤阿克渡轮码头，全长七十多公里，途中还有一座一公里多长的特大桥；冷藏货车把鱼货运上渡轮，再经阿克斯岛的富鲁海姆运往各地。\n汛期的乌利克尤阿克镇彻夜灯火通明，码头上的称重员、切鱼工和挂鱼工轮班干活，空气里满是海水和鱼的味道。风干鳕鱼要在水里泡上几天才能下锅，岛上的老人说，好鳕鱼「在架上晒一春，在锅里香一冬」，家家户户的冬日餐桌上，都少不了一锅加了土豆和黄油的鳕鱼炖菜。"
      en: "Ulikjuaq Island is a fishing island in the north-western outer waters, more than 3,100 km² and rising to just over 200 m; with Einsker it makes up Ulikjuaq City, home to some 150,000 people, and its northern edge lies with Einsker and Hrimey at the very top of the archipelago. Its Tavrunaq name means \"big fish\", and to the south, across the Uviqkut Strait, nearly 40 km wide, lies Siqqiqtuuq Island. The cold waters around it are a spawning ground and migration route for cod, and in the cod season at the end of winter and start of spring the whole fleet puts to sea.\nThe town of Ulikjuaq stands in a bay on the west coast, its harbour crowded with trawlers and longliners, and rows of wooden drying racks run for kilometres beside it; the cod are headed, split and hung in pairs on the racks to dry in the sea wind for two or three months, becoming the islands' most famous speciality, dried cod. The Ulikjuaq Island Road skirts the drying grounds behind the town and crosses the island to the Ulikjuaq Ferry Terminal on the east coast, a little over 70 km with a sea bridge more than a kilometre long on the way; refrigerated lorries carry the catch onto the ferries, and it travels on through Furuheim on Akkersey to the rest of the islands.\nIn the season the town is lit all night, weighers, cutters and hangers working in shifts on the quay, the air full of the smell of sea water and fish. Dried cod must soak in water for several days before it can be cooked, and the old people say good cod \"dries a spring on the rack and warms a winter in the pot\"; no household's winter table is without a pot of cod stew with potatoes and butter."
  - id: nat_dvayg1
    subtype: island
    status: generated
    detect: { kind: island, at_km: [254.8, 146.8] }
    names: { zh: 亚利图克岛, en: Jaalituuq Island, art-x-viking: Jaalituuqinsel, art-x-buckham: Isola Jaalituuq }
    notes:
      zh: "亚利图克岛是阿夫琳岛东北的岛，面积两千三百多平方公里，最高处近 300 米，与外海的哨岛一起组成布兰诺克堡市，全市约 12.6 万人，是离北维京岛最近的中等岛屿之一。岛名是塔夫鲁纳克语，意为「风多的地方」，名副其实：亚利图克岛海风终年不息，是群岛风力发电的主要基地，岛上的山脊排列着成片的陆上风机，外海还建有大型海上风电场，电力经海底电缆输往长船和阿夫琳港。\n布兰诺克堡镇坐落在岛北部的山谷里，是一座年轻的新兴小镇，许多住宅是为风电工程师和技术工人家庭新建的公寓，镇上有学校、医院、体育中心和一条新建的商业街，街上随处可见推着婴儿车的年轻父母，是群岛最年轻的地方之一。亚利图克岛公路自布兰诺克堡镇出发，沿风机林立的山脊到南岸的布兰诺克堡风电运维港，全长四十多公里，按运输超长叶片的要求设计；运维港里停着运维船和起重船，往返阿夫琳港的渡轮也在那里停靠，渔民仍在近海捕鱼。\n山脊上的观景台是看日落和风机剪影的好地方，傍晚时成排的叶片在逆光里缓缓转动。运送叶片的车队总在深夜沿公路开进运维港，岛上的孩子趴在窗边一边数叶片一边入睡，大人们管这叫「数风车」。"
      en: "Jaalituuq Island lies north-east of Aveline Island, more than 2,300 km² and rising to nearly 300 m; with Sentinel Isle offshore it makes up Fort Brannock, a city of some 126,000, and it is one of the mid-sized islands closest to North Viking Island. Its Tavrunaq name means \"windy place\", and it lives up to it: the sea wind never stops, making it the islands' main base for wind power, with onshore turbines lined up along its ridges and a large offshore wind farm out at sea, whose power runs by submarine cable to Longship and Port Aveline.\nThe town of Fort Brannock sits in a valley in the north of the island, a young new town where many of the homes are flats newly built for the families of wind engineers and technicians; it has schools, a hospital, a sports centre and a new shopping street full of young parents pushing prams, and it is one of the youngest places in the islands. The Jaalituuq Island Road runs from the town along the turbine-lined ridge to the Fort Brannock Wind Service Port on the south coast, a little over 40 km and built to carry extra-long blades; service and crane vessels berth at the port, the ferries to Port Aveline call there too, and fishermen still work the inshore waters.\nThe viewpoint on the ridge is the place for sunsets and turbine silhouettes, the rows of blades turning slowly against the evening light. The convoys bringing blades always drive into the port late at night, and the island's children fall asleep at the window counting them, which grown-ups call \"counting windmills\"."
  - id: nat_nwd97h
    subtype: island
    status: generated
    detect: { kind: island, at_km: [23.8, 196.8] }
    names: { zh: 西基克图克岛, en: Siqqiqtuuq Island, art-x-viking: Siqqiqtuuqinsel, art-x-buckham: Isola Siqqiqtuuq }
    notes:
      zh: "西基克图克岛是乌维克库特北部的岛，面积两千二百多平方公里，位于瓦莱岛以北，属乌维克库特市西基克图克区，岛上约有 4 万人。岛的四周是海鸟筑巢的悬崖，西岸的海崖高达百米，每年春夏，数十万只海鹦、海鸠、三趾鸥和北方塘鹅聚集在岩架上筑巢产卵，是维京群岛重要的海鸟繁殖地，也是群岛保护得最好的海洋生态区之一。\n西基克图克海鸟保护区覆盖全岛大部分海崖和周边海域，游客只能沿指定的步道和观鸟台观赏；保护区里的灯塔建在岛的最高处，为乌维克库特海峡里的船只指引航向，灯塔旁的观测站常年监测海鸟数量和海洋环境。岛上只有几座小渔村，许多居民是世代守岛的渔民家庭，在保护区外的海域捕鱼，夏季则为观鸟游客提供船只和住宿。乌维克库特跨海公路是唯一的公路，向南经七十多公里长的伦达霍尔姆水道跨海大桥通往瓦莱岛；北面隔着宽近四十公里的乌维克库特海峡是乌利克尤阿克岛。冬季风暴来临时，公路和渡轮都会中断，岛上便与外界隔绝几天。\n夏天的崖顶上，鸟鸣声和海浪声交织在一起，观鸟的人得扯着嗓子说话，或者干脆不说。渔村的老人说，岛上的孩子先学会认鸟，后学会认字，听翅膀拍水的声音就能分出是海鹦还是海鸠。"
      en: "Siqqiqtuuq Island lies in the north of the Uviqkut, more than 2,200 km², north of Hvaley in Siqqiqtuuq District of Uviqkut City, with some 40,000 people. It is ringed by cliffs where seabirds nest, those on the west coast a hundred metres high, and every spring and summer hundreds of thousands of puffins, guillemots, kittiwakes and northern gannets crowd onto the ledges to nest and lay, making it one of the Viking Islands' key seabird colonies and one of the best-protected marine areas in the islands.\nThe Siqqiqtuuq Seabird Reserve covers most of the island's cliffs and the waters around them, and visitors may watch only from marked paths and hides; the reserve's lighthouse stands on the island's highest point, guiding ships through the Uviqkut Strait, and the observation station beside it monitors seabird numbers and the marine environment all year. There are only a few small fishing villages, many of their people from families who have kept the island for generations; they fish outside the reserve and in summer provide boats and beds for birdwatchers. The Uviqkut Causeway is the only road, running south over the Lundaholm Sound Bridge, more than 70 km long, to Hvaley; to the north, across the Uviqkut Strait, nearly 40 km wide, lies Ulikjuaq Island. When winter storms come the road and the ferries are both cut, and the island is shut off from the world for a few days.\nOn the clifftops in summer the cries of the birds and the roar of the waves mingle, so birdwatchers have to shout, or give up talking altogether. Old people in the villages say the island's children learn their birds before their letters, and can tell a puffin from a guillemot by the sound of its wings on the water."

