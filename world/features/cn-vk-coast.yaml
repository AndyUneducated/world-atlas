    names: { zh: 阿夫琳海峡, en: Aveline Strait, art-x-viking: Avelinestraße, art-x-buckham: Stretto di Aveline }
    notes:
      zh: 长船岛与阿夫琳岛之间狭长的内海，长约三百公里，面积六千七百多平方公里，两岸港口与大船航道都在海峡里。长船岛东南岸的奥斯特哈门集装箱码头是长船的货运港，大型集装箱船沿着海峡的深水航道往来于群岛与北维京岛和远方之间；对岸阿夫琳岛的帆城、卡洛韦堡和莫塞沿海岸分布。长阿跨海高速以跨海大桥越过海峡，连接首府长船与阿夫琳港；海峡南端有托利文特岛和引水岛，引航员在这一带登船，带大船进出海峡，南口外的西格利海峡上还有西格利跨海高速通过。海峡里风浪较外海平静，是群岛帆船运动的好去处。
      en: The long, narrow inland sea between Longship and Aveline islands, about 300 km long and more than 6,700 km² in area, holding the ports on both shores and the deep-sea fairways. The Austhamn Container Terminal on the south-east shore of Longship Island is the capital's cargo port, and big container ships follow the strait's deep-water channels between the islands, North Viking Island and the wider world, while Sail Town, Fort Calloway and Måsey line the Aveline shore opposite. The Longship–Port Aveline Sea Crossing bridges the strait between the capital and Port Aveline; at its southern end lie Midway and Pilot isles, where pilots board to take ships in and out, and beyond its southern mouth the Sigley Sea Crossing spans Sigley Strait. Its waters are calmer than the open sea and a favourite of island sailors.
  - id: nat_rssv0a
    subtype: strait
    status: generated
    detect: { kind: fjord, at_km: [106.8, 124.8] }
    names: { zh: 阿克斯海峡, en: Akkersey Strait, art-x-viking: Akkerseystraße, art-x-buckham: "Stretto dell'Ancora" }
    notes:
      zh: 阿克斯岛与长船岛之间的海峡，长约一百四十公里，面积两千四百多平方公里，是群岛最繁忙的航道之一。海峡水深流急，在长船岛西北岸的弗洛德维克一带收窄，潮差大、潮流急，弗洛德维克潮汐电站横跨海湾口，利用每天两次的涨落潮为长船都市区发电。阿克斯岛东南岸的瑙斯特海姆区沿海峡排开造船厂、船坞和海工装备基地，新船下水时市民聚集在岸边观看巨轮滑入海峡。阿克斯跨海高速从弗洛德维克跨越海峡到阿克斯岛的瑙斯特海姆区，长船西岸高速沿长船岛一侧的海岸延伸，阿斯跨海高速则在海峡南口跨海，把阿克斯维克湾与长船岛的船尾连在一起。
      en: The strait between Anchor and Longship islands, about 140 km long and more than 2,400 km², one of the busiest shipping lanes in the islands. Its water is deep and swift, and it narrows off Flodvik on Longship's north-west shore, where the tidal range is large and the current strong; the Flodvik Tidal Power Station spans the mouth of the bay and uses the twice-daily tides to power the Longship area. Along the Akkersey side, the Naustheim District lines the strait with yards, docks and offshore fabrication sites, and when a new ship is launched people gather on the shore to watch it slide into the strait. The Akkersey Strait Crossing bridges it from Flodvik to the Naustheim District on Akkersey, the Longship West Shore Expressway follows the Longship shore, and the Akkersvik–Styrvik Sea Crossing crosses its southern mouth to join Akkersvik Bay with Longship's stern.
  - id: nat_qcp61q
    subtype: strait
    status: generated
    detect: { kind: strait, at_km: [99.8, 51.8] }
    names: { zh: 暖泉海峡, en: Warmspring Strait, art-x-viking: Warmquellstraße, art-x-buckham: Stretto di Fontecalda }
    notes:
      zh: "暖泉岛东岸与浮石岛之间的海峡，宽约五公里，属暖泉市温泉区，是从长船岛船尾前往暖泉的海上航道。从船尾方向驶来的船只穿过海峡进入温泉湾，在甲板上就能望见海滩上升起的温泉蒸汽和身后的暖泉火山。海峡东侧的浮石岛海滩堆满了火山浮石，西侧是温泉区的度假酒店和群岛最大的暖泉温泉度假村。海峡里水流平缓，夏季常有游艇和皮划艇在浮石岛与温泉湾之间往来。渡轮驶入海峡时，船员会建议乘客往两边看：一边是浮石岛上可以浮在水上的石头，一边是冒着蒸汽的温泉海滩，孩子们最爱在浮石岛捡一块浮石，回家放进浴缸里看它漂。"
      en: "The strait between the east coast of Warmspring Island and Pumice Isle, about five kilometres wide, in Hot Springs District of Warmspring City, and the sea route from Longship Island's stern to Warmspring. Boats coming from the stern pass through it into Hot Springs Bay, and from the deck you can see steam rising from the beaches and the volcano behind. On the east side, Pumice Isle's beaches are heaped with volcanic pumice; on the west side stand the resort hotels of Hot Springs District and the Warmspring Spa Resort, the largest in the islands. The current is gentle, and in summer yachts and kayaks cross back and forth between Pumice Isle and Hot Springs Bay. As the ferry enters the strait, the crew tell passengers to look both ways, at the floating stones of Pumice Isle on one side and the steaming hot-spring beaches on the other, and children love to take a pumice stone home to watch it float in the bath."
  - id: nat_pf80ey
    subtype: strait
    status: generated
    detect: { kind: strait, at_km: [198.8, 166.2] }
    names: { zh: 瓦克特水道, en: Vaktsund, art-x-viking: Vaktsund, art-x-buckham: Canale della Vedetta }
    notes:
      zh: 瓦克特岛与长船岛北岬之间的水道，宽约四公里，属长船市北岬区，是从北方进出长船的航道。从北维京岛方向驶来的船只绕过长船岛的船首，经瓦克特水道南下，再沿东岸驶入长船湾的港口。维京时代瓦克特岛顶的烽火就是为守住这条水道而设，水道、瓦克特岛和湾内的瓦克特维克湾都由此得名。如今维长高速的维京海底公路隧道从水道附近的海底穿过，一条直线连接维京港与长船古城，海面上的船只与海底的车流各行其道。
      en: The channel between Vaktey and North Cape on Longship Island, about four kilometres wide, in North Cape District of Longship and the way in to Longship from the north. Ships coming from North Viking Island round the bow of Longship Island, run south through Vaktsund and then follow the east coast into the harbours of Longship Bay. The Viking-age beacon on Vaktey was set there to guard this channel, which gave the sound, the island and Vaktvik Bay their names. Today the Viking Undersea Road Tunnel of the Viking Port–Longship Expressway runs beneath the seabed close to the sound in a straight line from Viking Port to Longship's old town, so that ships on the surface and traffic under the sea each go their own way.
  - id: nat_cyt4bq
    subtype: strait
    status: generated
    detect: { kind: strait, at_km: [146.2, 58.0] }
    names: { zh: 西格利海峡, en: Sigley Strait, art-x-viking: Sigleystraße, art-x-buckham: "Stretto dell'Albero" }
    notes:
      zh: 西格利岛与阿夫琳岛西南端之间的海峡，宽约三公里，属西格拉维克市西格拉维克区，是阿夫琳海峡的南口。西格利跨海高速从西格利岛北端的西格拉内斯岬旁跨越海峡，在对岸的莫塞登陆，向北接阿夫琳纵贯高速；两段海上长桥以西格利岛为中间支点，把暖泉岛与阿夫琳岛连成一线，群岛高速铁路的铁路桥也在公路桥旁跨过海峡。西格拉维克渔港沿着海峡的岸边排开，渔船在海峡和周边海域捕捞鳕鱼、鲱鱼和扇贝，西格拉内斯岬上的灯塔俯瞰着海峡。日落时，跨海长桥的桥影映在海面上，是西格拉维克最美的景色。
      en: The strait between Sigley and the south-western end of Aveline Island, about three kilometres wide, in Siglavik District of Siglavik City, and the southern mouth of Aveline Strait. The Sigley Sea Crossing spans it beside Siglanes at the northern end of Sigley and lands at Måsey on the far side, where it meets the Aveline Spine Expressway; its two long sea bridges use Sigley as a stepping stone to tie Warmspring and Port Aveline together, and the Island Chain High-Speed Railway crosses beside it on a rail bridge of its own. Siglavik's fishing harbour lines the shore of the strait, its boats taking cod, herring and scallops in the strait and the waters around, and the lighthouse on Siglanes looks out over it. At sunset the shadow of the bridge on the water is Siglavik's loveliest sight.
  - id: nat_t6kg3e
