# Coastal landforms of the Viking Islands: islands, bays, capes and straits.
# The generator finds them in the coastline (pipeline/atlas/coast.py); each entry names the
# landform of `detect.kind` nearest to `detect.at_km` (design km, x east, y north).
# Unnamed landforms are listed in .cache/candidates-div_raat4g.json after a build.
features:
  # ── Main islands ─────────────────────────────────────────
  - id: nat_170rsf
    subtype: island
    status: generated
    detect: { kind: island, at_km: [148.2, 130.2] }
    names: { zh: 长船岛, en: Longship Island, art-x-viking: Langskipinsel, art-x-buckham: Isola Navelunga }
    notes:
      zh: 群岛最大的岛，狭长如一艘长船，船首朝东北指向北维京岛，船尾朝西南。
      en: The largest of the islands, long and narrow like a longship, its bow to the north-east pointing at North Viking Island and its stern to the south-west.
  - id: nat_2p2v9m
    subtype: island
    status: generated
    detect: { kind: island, at_km: [206.8, 101.2] }
    names: { zh: 白帆岛, en: White Sail Island, art-x-viking: Weißsegelinsel, art-x-buckham: Isola Velabianca }
    notes:
      zh: 长船岛东南的大岛，隔白帆海峡与长船岛平行；远望山岭如一面白帆。
      en: The large island south-east of Longship Island, lying alongside it across White Sail Strait; from afar its ridge looks like a white sail.
  - id: nat_bcjvmn
    subtype: island
    status: generated
    detect: { kind: island, at_km: [101.8, 162.8] }
    names: { zh: 锚岛, en: Anchor Island, art-x-viking: Ankerinsel, art-x-buckham: Isola dell'Ancora }
    notes:
      zh: 长船岛西北的大岛，西岸峡湾深入，南端的锚湾是群岛最好的避风锚地，岛名由此而来。
      en: The large island north-west of Longship Island. Fjords cut deep into its west coast, and Anchor Bay at its southern end is the best sheltered anchorage in the islands, which gave the island its name.
  - id: nat_9ajbb1
    subtype: island
    status: generated
    detect: { kind: island, at_km: [62.2, 48.8] }
    names: { zh: 暖泉岛, en: Warmspring Island, art-x-viking: Warmquellinsel, art-x-buckham: Isola Fontecalda }
    notes:
      zh: 群岛西南端的圆形火山岛，岛心是暖泉火山，河流从火山向四面流入大海。
      en: The round volcanic island at the south-west end of the islands, with Warmspring Volcano at its heart and rivers running from it to the sea on every side.

