      en: An uninhabited island south-east of Saint-Ondine Island, a little over 240 km², in Saint-Ondine District of Saint-Ondine. Its rocky shores are a breeding ground for grey seals, and each pupping season hundreds of seals give birth to white-coated pups on the rocks; the whole island is the Selholm Nature Reserve. Landing is strictly limited, boats may not approach the rocks during the pupping season, and visitors watch through binoculars from observation boats at a distance. Seabirds also nest on its grassy slopes and cliffs, and researchers count the seals and birds every year from fixed observation points. A half-day trip by observation boat from the town of Saint-Ondine is enough to see the seals basking on the rocks.
  - id: nat_bs1dbj
