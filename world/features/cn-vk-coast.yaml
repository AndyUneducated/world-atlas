      en: An islet north-east of Hvaley, nearly 200 km², in Hvaley District of Uviqkut City, facing Hvaley across the three-kilometre Lundaholm Sound. Every summer tens of thousands of auks and puffins dig their burrows in its grassy slopes, which gave it its name, and on summer evenings flocks of puffins fly home from the sea with fish in their beaks. The Lundaholm Sound bridge of the Uviqkut Causeway passes beside the island and runs more than seventy kilometres north across the sea to Siqqiqtuuq Island, with whale-watching platforms on the deck. Whalewatch Bay on the north coast of Hvaley lies close by, and in summer whales often feed in the channel between Lundaholm and Hvaley.
