    detect: { kind: strait, at_km: [267.0, 110.2] }
    names: { zh: 埃德文海峡, en: Edevane Strait, art-x-viking: Edevanestraße, art-x-buckham: Stretto di Edevane }
    notes:
      zh: 阿夫琳岛与埃德文岛之间的海峡，宽近三十公里，属埃德文港市埃德文港区。海峡里大片浅水滩涂随潮水涨落时隐时现，是候鸟迁徙的重要停歇地，春秋两季鹬类、鸻类和雁鸭成群聚集，成千上万的水鸟在这里觅食。埃德文港公路的大半路段位于埃德文海峡跨海大桥上，这座近二十九公里长的低矮长桥贴着滩涂延伸，桥下潮水自由进出，水鸟栖息地得以保留；候鸟季节桥上禁止停车，观鸟需到两端的观测点。渡轮也穿过海峡往返埃德文岛与阿夫琳岛的灯塔区。
      en: "The strait between Aveline Island and Edevane Island, nearly 30 km wide, in Port Edevane District of Port Edevane. Broad shallow mudflats in the strait appear and vanish with the tide and are a major stopover for migrating birds: every spring and autumn waders, plovers, geese and ducks gather in their thousands to feed. Most of the Port Edevane Road runs on the Edevane Strait bridge, a low span nearly 29 km long laid along the flats, with the tide flowing freely beneath it so that the birds' habitat survives; stopping on the bridge is banned in the bird season, and birdwatchers use the observation points at either end. Ferries also cross the strait between Port Edevane and Lighthouse District on Aveline Island."
  - id: nat_jrnd2d
    subtype: strait
    status: generated
    detect: { kind: strait, at_km: [36.0, 209.8] }
    names: { zh: 乌维克库特海峡, en: Uviqkut Strait, art-x-viking: Uviqkutstraße, art-x-buckham: Stretto di Uviqkut }
    notes:
      zh: 乌维克库特北部西基克图克岛与乌利克尤阿克岛之间的海峡，宽近四十公里，是乌维克库特渔船的主航道。海峡里的冷水海域鱼群丰富，乌利克尤阿克和西基克图克的渔船常年在这里作业，鳕鱼汛期时海面上渔船往来不绝。每年夏季，座头鲸、虎鲸和小须鲸也经过乌维克库特一带的海域洄游。西基克图克海鸟保护区的灯塔建在西基克图克岛的最高处，为海峡里的船只指引航向，灯塔旁的观测站常年监测海鸟数量和海洋环境。海峡上没有桥梁，冬季风暴来临时风浪很大，渔船常到两岸的港湾里避风。
      en: The strait between Siqqiqtuuq Island and Ulikjuaq Island in the north of the Uviqkut, nearly 40 km wide and the main channel of the Uviqkut' fishing boats. Its cold waters are rich in fish, the boats of Ulikjuaq and Siqqiqtuuq work here all year, and in the cod season the sea is busy with boats coming and going. Every summer humpback, killer and minke whales also pass through the waters of the Uviqkut. The lighthouse of the Siqqiqtuuq Seabird Reserve on the island's highest point guides ships through the strait, and the observatory beside it monitors seabird numbers and the marine environment all year. No bridge crosses it, the winter storms raise heavy seas, and the fishing boats often shelter in the harbours on either side.
  - id: nat_rhtezf
    subtype: strait
    status: generated
    detect: { kind: strait, at_km: [19.2, 155.2] }
    names: { zh: 伦达霍尔姆水道, en: Lundaholm Sound, art-x-viking: Lundaholmsund, art-x-buckham: Canale delle Pulcinelle }
    notes:
      zh: 瓦莱岛与伦达霍尔姆岛之间的窄水道，宽约三公里，属乌维克库特市瓦莱区。乌维克库特跨海公路的伦达霍尔姆水道跨海大桥以这条水道命名，大桥长七十多公里，占全线近一半，从瓦莱岛出发跨过水道，再向北跨越开阔的海面直达西基克图克岛，是群岛最长的桥梁之一，桥面设有观鲸平台。水道旁就是瓦莱岛北岸的观鲸湾，夏季鲸鱼常在水道和湾里觅食，观鲸船从瓦莱岛出发，绕过伦达霍尔姆岛寻找鲸群。夏季的伦达霍尔姆岛上满是筑巢的海鹦，从桥上和船上都能看到它们成群掠过水面。
      en: "The narrow channel between Hvaley and Lundaholm, about three kilometres wide, in Hvaley District of Uviqkut City. The Lundaholm Sound bridge of the Uviqkut Causeway is named after it: more than seventy kilometres long and nearly half the length of the road, it leaves Hvaley across the sound and runs north over the open sea to Siqqiqtuuq Island, one of the longest bridges in the islands, with whale-watching platforms on its deck. Whalewatch Bay on Hvaley's north coast lies beside the sound, whales often feed in the sound and the bay in summer, and the whale-watching boats from Hvaley round Lundaholm in search of them. In summer Lundaholm is full of nesting puffins, and flocks of them can be seen skimming the water from the bridge and the boats."
