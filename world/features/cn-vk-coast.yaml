    notes:
      zh: 群岛南端的小岛，面积两百六十多平方公里，位于暖泉岛东南外海，属暖泉市斯瓦特桑德区。韦克斯利岛地势低平，最高处一百多米，四面是开阔的海天，没有山峦遮挡视线，因此建起了韦克斯利航天测控站。测控站的几面大型天线跟踪从北维京岛马斯林山发射的航天器，日夜监测在轨卫星和飞船，是马斯林山航天发射的重要测控站之一。岛上除测控站的职工外几乎没有居民，草坡和礁石上栖息着海鸟。晴朗的夜里，岛上的星空格外明亮。
      en: An islet at the southern end of the archipelago, a little under 270 km², lying off the south-east of Warmspring Island in Svartsand District of Warmspring City. It is low and flat, rising only to just over 100 m, with open sea and sky on every side and no mountains to block the view, which is why the Wexley Tracking Station was built here. Its large dishes follow spacecraft launched from Maslin Mountain on North Viking Island and track satellites and spacecraft in orbit day and night, one of the key tracking stations for the Maslin Mountain launches. Apart from the station staff hardly anyone lives on the island, and seabirds nest on its grass and rocks. On clear nights its stars are especially bright.
  - id: nat_bnz64a
