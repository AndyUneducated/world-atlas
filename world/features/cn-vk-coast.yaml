      en: An uninhabited island north of Akkersey, a little over 180 km², in Furuheim District of Furuheim City, lying off Furuheim Bay and, with Einsker and Ulikjuaq Island, at the northern limit of the archipelago. It is the first island to frost over each winter, which gave it its name, and in winter it is often wrapped in sea ice and frost fog. Tundra, wetland and seabird colonies cover it, and the whole island is the Hrimey Nature Reserve, a good place to watch arctic foxes and seabirds; with the Anchor Chain Glacier it is Furuheim's most popular natural sight. Visitor numbers are strictly limited, and in summer guides take small boats out from the town of Furuheim to watch the nesting birds from offshore.
  - id: nat_eb28w4
