    names: { zh: 萨尔塔维克湾, en: Saltavik Bay, art-x-viking: Saltavikbucht, art-x-buckham: Baia del Sale }
    notes:
      zh: 阿夫琳岛东南岸的海湾，面积七十多平方公里，旧时在湾畔晒盐腌鱼，萨尔塔维克市由此得名。这里海水清澈、风大日照足，自维京时代起就以日晒和熬煮法生产海盐，湾岸铺开数十平方公里的盐田，夏季阳光下盐田像一面面镜子，传统作坊熬出的「萨尔塔维克湾花盐」是群岛餐桌上的珍品，盐田旁的海盐博物馆讲述着制盐的历史。湾外的海面上是海上风电场，萨尔塔维克湾港是风电场的运维基地。阿夫琳纵贯高速经过湾畔，萨尔塔维克海滨公路沿海岸经过盐田，连接菲斯克海姆和望海的果园。
      en: "A bay on the south-east coast of Aveline Island, a little over 70 km², where salt was once panned to cure fish, and the source of Saltavik City's name. The water is clear, the wind strong and the sun plentiful, and sea salt has been made here by solar evaporation and boiling since the Viking age: tens of square kilometres of salt pans line the shore, shining like mirrors in the summer sun, the flaky Saltavik salt boiled in traditional works is prized on island tables, and the salt museum beside the pans tells the story. An offshore wind farm stands in the sea beyond the bay, and Saltavik harbour is its service base. The Aveline Spine Expressway passes the bay, and the Saltavik Coast Road runs along the shore past the salt pans between Fiskheim and the orchards of Seawatch."
  - id: nat_gd3pyt
