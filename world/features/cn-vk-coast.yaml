      en: The large deep-water bay at the eastern end of Aveline Island, a little over 550 km², Port Aveline's gateway to the sea. The Port Aveline Cruise Port lies within it, and the cruise terminal, duty-free shopping streets and ferry hub are gathered on the Aveline Quay District shore, with ferries to Longship, Warmspring, Siglavik and the Uviqkut. Lighthouse Isle and Marrable Sound off its mouth form the fairway in, and the old light on Lighthouse Isle guides cruise ships and fishing boats in. The seafront promenade is the place to watch the cruise ships come and go and the sun go down, and whenever a liner sounds its horn and sails there are always people on the shore waving it off. The Port Aveline Cruise Expressway links the quays with Port Aveline Airport and the old town.
