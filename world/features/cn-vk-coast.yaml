    names: { zh: 观鲸湾, en: Whalewatch Bay, art-x-viking: Walschaubucht, art-x-buckham: Baia delle Balene }
    notes:
      zh: 瓦莱岛北岸的海湾，面积一百九十多平方公里，属乌维克库特市瓦莱区，观鲸船从这里出海，海湾由此得名。每年夏季，座头鲸、虎鲸和小须鲸沿乌维克库特的海域洄游，在观鲸湾里觅食，几乎每次出海都能看到鲸鱼喷水、跃身和摆尾，观鲸是瓦莱岛最重要的旅游项目。湾的东北面是伦达霍尔姆岛，两岛之间的伦达霍尔姆水道上横跨着乌维克库特跨海公路的伦达霍尔姆水道跨海大桥，桥面设有观鲸平台。瓦莱观鲸中心的研究人员常年在湾里观测和保护鲸群，记录鲸鱼的数量和迁徙路线。夏夜的湾面上，常能听到鲸鱼的歌声。
      en: A bay on the north coast of Hvaley, a little over 190 km², in Hvaley District of Uviqkut City, where the whale-watching boats set out, hence its name. Every summer humpback, killer and minke whales migrate through the waters of the Uviqkut and feed in the bay, and almost every trip sees whales blowing, breaching and lobtailing; whale-watching is Hvaley's most important attraction. Lundaholm lies to the north-east, and across Lundaholm Sound between the two islands runs the Lundaholm Sound bridge of the Uviqkut Causeway, with whale-watching platforms on its deck. Researchers from the Hvaley Whale Centre observe and protect the whales in the bay year round, recording their numbers and routes. On summer nights whale song can often be heard across the water.

  # ── Capes ────────────────────────────────────────────────
  - id: nat_6tf7yp
    subtype: cape
    status: generated
    detect: { kind: cape, at_km: [188.2, 181.2] }
    names: { zh: 斯塔文内斯岬, en: Stavnnes, art-x-viking: Stavnnes, art-x-buckham: Capo di Prua }
    notes:
      zh: 长船岛的东北端，即「船首」，属长船市北岬区，是长船岛离北维京岛维京港最近的地方。维长真空磁悬浮的维京海底铁路隧道长一百四十公里，从维京港出发穿越海峡，在斯塔文内斯岬出地面，以高架桥登陆，再经北岬区的地面线到长船站；磁悬浮选择在这里登陆，是为了尽量缩短海底段。岬上的观景台面朝斯塔文维克湾和北面开阔的海峡，晴天时海天一色，列车在管道里看不见，但每当一班车驶出隧道口，管道上的灯带就沿着高架桥一路亮向长船，这一瞬间是铁路迷喜爱的拍摄画面。岬角是北岬区海岸风景的一部分，周围的山坡上有牧羊草场和零星的渔屋。
      en: The north-eastern tip of Longship Island, its "prow", in North Cape District of Longship, and the point of the island nearest Viking Port on North Viking Island. The Viking Undersea Rail Tunnel of the Viking Port–Longship Vacuum Maglev runs 140 km from Viking Port beneath the strait and surfaces at Stavnnes, coming ashore on a viaduct before crossing North Cape on the surface to Longship station; the maglev lands here to keep the undersea section as short as possible. The viewpoint on the point faces Stavnvik Bay and the open strait to the north, sea and sky merging on clear days; the trains cannot be seen inside the tube, but each time one leaves the tunnel portal the light strip along the tube runs on along the viaduct towards Longship, a favourite shot for railway photographers. The cape is part of North Cape's coastline, with sheep pastures and a few fishermen's huts on the slopes around it.
  - id: nat_1da50f
    subtype: cape
    status: generated
    detect: { kind: cape, at_km: [196.2, 166.8] }
    names: { zh: 北岬, en: North Cape, art-x-viking: Nordkap, art-x-buckham: Capo Nord }
    notes:
      zh: 长船岛船首以南的宽大岬角，属长船市北岬区，隔四公里宽的瓦克特水道与瓦克特岛相望，北岬区由此得名。北岬环抱着西北侧的北岬湾，岬上的平地建有维京群岛最大的机场长船国际机场，航班飞往北维京岛、群岛各岛和世界各地；长船机场高速以高架桥从古城直达机场。群岛大学的主校区坐落在北岬湾畔的山坡上，科研人员和学生使北岬成为长船最年轻的区之一。岬的北部山坡上仍有牧羊草场，羊群和机场跑道相映成趣，长船西北岸公路从这里出发，沿海岸经西岸区通往弗洛德维克。
      en: The broad headland south of Longship Island's prow, in North Cape District of Longship, facing Vaktey across the four-kilometre Vaktsund; the district takes its name from it. North Cape shelters North Cape Bay on its north-west side, and on its flat land stands Longship International Airport, the largest in the Viking Islands, with flights to North Viking Island, the other islands and the world; the Longship Airport Expressway runs from the old town straight to the airport, much of it on viaduct. The University of the Islands has its main campus on the hillside above North Cape Bay, and its researchers and students make North Cape one of the youngest districts in Longship. Sheep still graze the slopes in the north of the cape beside the runways, and the Longship North-West Shore Road sets off from here along the coast through West Shore to Flodvik.
  - id: nat_m5r3gc
    subtype: island
    status: generated
    detect: { kind: island, at_km: [91.8, 90.2] }
    names: { zh: 斯库特岛, en: Skutey, art-x-viking: Skutey, art-x-buckham: Isola di Poppa }
    notes:
      zh: "斯库特岛是长船岛西南端「船尾」外的小岛，面积三十多平方公里，最高处 151 米，属斯蒂尔维克市斯库特斯塔德区，隔一道窄水与长船岛相连，隔着海面与暖泉岛相望。岛名在维京语里意为「船尾岛」，与长船岛「船首」一带的地名遥相对应。\n岛上只有一座灯塔和几户渔家，是海鸟和海豹的栖息地，灯塔为进出长船、暖泉与阿夫琳港三岛之间水道的船只指引方向。船尾一带是群岛最繁忙的水域之一：斯蒂尔维克是群岛跨海高速、长船西岸高速和阿斯跨海高速的交汇点，斯库特斯塔德区的海面上，群岛跨海高速和群岛高速铁路的斯库特斯塔德特大桥伸向暖泉，往来的渡轮和货船从斯库特岛旁穿行。岛上的渔家守着灯塔世代捕鱼，退潮时海豹爬上礁石晒太阳，海鸟在崖壁上盘旋。\n斯库特斯塔德区近年兴起乡村旅游，游客住进长船岛上的渔家民宿，跟随渔民出海时常绕到斯库特岛看海豹，渔民会把船停在离礁石不远的地方，熄火让大家静静地看。沿船尾悬崖的海岸步道也可以远眺斯库特岛和暖泉岛的火山，晴天的傍晚，火山顶的蒸汽被夕阳染成粉色，走步道的人常在崖边的长凳上一坐就是半个小时。"
      en: "Skutey is an islet off the south-western \"stern\" of Longship Island, a little over 30 km² and rising to 151 m, in Skutstad District of Styrvik City; a narrow channel separates it from Longship Island, and it faces Warmspring Island across the sea. Its Viking name means \"stern island\", a counterpart to the place names around Longship's \"bow\".\nThere is only a lighthouse and a few fishing families on the island, which is home to seabirds and seals, and the lighthouse guides ships through the channels between Longship, Warmspring and Aveline islands. The waters off the stern are among the busiest in the islands: Styrvik is where the Island Chain Expressway, the Longship West Shore Expressway and the Akkersvik–Styrvik Sea Crossing meet, the Skutstad Sea Bridge of the Island Chain Expressway and the Island Chain High-Speed Railway reaches out across the sea of Skutstad towards Warmspring, and ferries and freighters thread past Skutey. The fishing families on the island have fished beside the lighthouse for generations; at low tide seals haul out on the rocks to bask and seabirds wheel over the cliffs.\nRural tourism has grown in Skutstad in recent years: visitors stay in fishing families' guesthouses on Longship Island, and when they go out with the fishermen they often swing round Skutey to see the seals, the fishermen stopping the boat not far from the rocks and cutting the engine so everyone can watch in silence. The coastal path along the stern cliffs also looks out to Skutey and the volcano on Warmspring Island; on clear evenings the steam on the volcano's summit turns pink in the sunset, and walkers often sit on the clifftop benches for half an hour."
  - id: nat_3r1gvb
    subtype: cape
    status: generated
    detect: { kind: cape, at_km: [192.2, 137.2] }
    names: { zh: 金角, en: Gold Point, art-x-viking: Goldspitze, art-x-buckham: Punta d'Oro }
    notes:
      zh: 汇金湾东侧伸向外海的岬角，属长船市汇金区。岬角护住汇金湾的东面，使湾内风平浪静，汇金区的玻璃塔楼就沿着湾岸一字排开，「金角」之名与汇金区一样，寄托着财富汇聚的寓意。岬上修建了滨海长廊和观景平台，从这里西望是汇金湾畔的塔楼和游艇码头，北望是长船湾和古城的城墙，夜晚塔楼的灯光与湾水相映，是首府最有名的夜景之一。岬外是开阔的外海，往来阿夫琳海峡和长船湾的船只从岬前经过。
      en: The headland on the east, seaward side of Goldmark Bay, in Goldmark District of Longship. It shelters the bay from the east and keeps the water calm, and the glass towers of Goldmark line the shore behind it; like the district's own name, "Gold Point" expresses the hope of wealth gathering here. A seafront promenade and viewing platform run along the point, looking west to the towers and marina of Goldmark Bay and north to Longship Bay and the walls of the old town, and at night the lights of the towers mirrored in the bay make one of the capital's best-known night views. Beyond the point lies the open sea, and ships bound for Aveline Strait and Longship Bay pass in front of it.
  - id: nat_x8bkdv
    subtype: cape
    status: generated
    detect: { kind: cape, at_km: [104.8, 59.2] }
    names: { zh: 温泉岬, en: Hot Springs Point, art-x-viking: Thermenspitze, art-x-buckham: Punta delle Terme }
    notes:
      zh: 暖泉岛的东端，属暖泉市温泉区，与长船岛的船尾隔水相望，岬名取自北面的温泉湾。温泉岬是暖泉岛伸向长船岛方向的岬角，岬外的海面上船只往来，天晴时可以望见对岸长船岛的船尾。岬上是火山熔岩形成的黑色岩岸，岩缝里有几处温泉涌出，退潮时在海边形成天然的温泉池，当地人冬天常来这里泡脚看海。温泉岬和温泉湾构成温泉区的海岸风景，岬上的步道可以俯瞰温泉湾畔的度假村和身后的暖泉火山。
      en: The eastern tip of Warmspring Island, in Hot Springs District of Warmspring City, facing Longship Island's stern across the water and named after Hot Springs Bay just to the north. It is the cape where Warmspring reaches out towards Longship, and on clear days you can see ships at sea and Longship's stern on the far side. The headland is black lava rock, and a few hot springs rise from its cracks, forming natural pools at the water's edge at low tide where locals come in winter to soak their feet and watch the sea. With Hot Springs Bay it makes up the coastline of Hot Springs District, and the path along it looks down on the resorts by the bay and the volcano behind.
  - id: nat_xet2vm
    subtype: cape
    status: generated
    detect: { kind: cape, at_km: [30.8, 69.2] }
    names: { zh: 落日岬, en: Sunset Point, art-x-viking: Abendspitze, art-x-buckham: Punta del Tramonto }
    notes:
      zh: 暖泉岛的西端，属克莱特斯塔德市落日区，是暖泉岛向西伸入大洋的岬角，也是看海上落日的地方，岬名和落日区都由此得名。岬上的观景台面朝开阔的海面，每当天气晴朗的傍晚，太阳缓缓沉入大洋，把黑色的熔岩海崖和白色的浪花染成金红色，观景台上常常挤满了从温泉区和克莱特斯塔德驱车而来的游客。岬角周围是火山熔岩形成的海岸，渔村散布其间。暖泉环山公路经过岬角一带，沿线的温泉村、斯瓦特桑德海滩和落日岬观景台构成了一条著名的观光路线，傍晚最为热闹。
      en: The western tip of Warmspring Island, in Sunset District of Klettstad City, the cape where the island reaches west into the ocean and the place to watch the sun set over the sea; both the cape and the district are named for it. The viewpoint on the point faces the open water, and on clear evenings, as the sun sinks into the ocean and turns the black lava cliffs and white surf red-gold, it is crowded with visitors who have driven over from Hot Springs and Klettstad. Lava shores surround the cape, with fishing villages scattered among them. The Warmspring Volcano Road passes nearby, and the hot-spring villages, the black beaches and the Sunset Point viewpoint along it make a famous scenic route, liveliest in the evening.
  - id: nat_emve42
    subtype: cape
    status: generated
    detect: { kind: cape, at_km: [65.8, 107.2] }
    names: { zh: 西爪岬, en: West Fluke, art-x-viking: Westflunke, art-x-buckham: Marra Ovest }
    notes:
      zh: 阿克斯维克湾西侧的岬角，属阿克斯维克市西爪区，与东爪岬一起如锚的两爪抱住阿克斯维克湾，是阿克斯岛西侧的锚爪。岬角深入大海，海崖、草坡和沙湾交错，阿克斯维克人周末最喜欢沿着海岸步道徒步，观赏海鸟和日落。西爪区是阿克斯维克市面积最大、最有田园风光的区，岬上的大部分土地是起伏的牧场，奶牛和绵羊在草坡上吃草，乳品厂为城市供应黄油、奶酪和酸奶。阿克斯维克湾公路通往岬角一带，向东经阿克斯维克湾通往瑙斯特海姆区。从岬尖望去，阿克斯维克湾的港口、卡蒂马苏克岛和远处的东爪岬尽收眼底。
      en: The cape on the west side of Akkersvik Bay, in West Fluke District of Akkersvik; with East Fluke it holds the bay like the two flukes of an anchor, the western fluke of Akkersey. It reaches far into the sea, with cliffs, grassy slopes and sandy coves alternating, and at weekends Akkersvik people love to walk the coast path watching seabirds and the sunset. West Fluke is the largest and most rural district of the city, and most of the cape is rolling pasture where dairy cows and sheep graze and creameries make butter, cheese and yoghurt for the city. The Akkersvik Bay Road reaches the cape and runs east round the bay to the Naustheim District. From the tip of the cape the port, Kattimasuq Island and East Fluke across the water are all in view.
  - id: nat_11r771
    subtype: cape
    status: generated
    detect: { kind: cape, at_km: [80.8, 104.2] }
    names: { zh: 东爪岬, en: East Fluke, art-x-viking: Ostflunke, art-x-buckham: Marra Est }
    notes:
      zh: 阿克斯维克湾东侧的岬角，属阿克斯维克市阿克斯维克区，面向阿克斯海峡口，与西侧的西爪岬一起如锚的两爪抱住阿克斯维克湾，岬名由此而来。东爪岬上的灯塔为进出阿克斯维克湾的船只导航，大型集装箱船和散货船从岬旁驶入群岛最大的集装箱港。岬外就是阿克斯海峡的南口，阿斯跨海高速从阿克斯维克湾出发跨越海峡口通往长船岛的斯蒂尔维克，从岬上可以望见跨海长桥伸向东南的海面。岬角的草坡上是观景步道，傍晚常有阿克斯维克人来这里看货轮进港。
      en: The cape on the east side of Akkersvik Bay, in Akkersvik District of Akkersvik, facing the mouth of Akkersey Strait; with West Fluke to the west it holds the bay like the two flukes of an anchor, hence its name. The lighthouse on East Fluke guides ships in and out of Akkersvik Bay, and big container ships and bulk carriers pass close by on their way into the largest container port in the islands. Beyond the cape lies the southern mouth of Akkersey Strait, which the Akkersvik–Styrvik Sea Crossing spans from Akkersvik Bay to Styrvik on Longship Island, and from the headland you can see its long bridge reaching away to the south-east. A path runs along the grassy top, and in the evenings Akkersvik people often come out to watch the freighters come in.
  - id: nat_15mbb9
    subtype: cape
    status: generated
    detect: { kind: cape, at_km: [148.2, 52.8] }
    names: { zh: 西格拉内斯岬, en: Siglanes, art-x-viking: Siglanes, art-x-buckham: Punta della Coffa }
    notes:
      zh: 西格利岛东北端的长岬，属西格拉维克市西格拉维克区，深入西格利海峡，是西格利岛北端的标志。岬上的灯塔俯瞰着三公里宽的西格利海峡，西格利跨海高速从岬旁跨越海峡，在对岸阿夫琳岛的莫塞登陆，日落时桥影映在海面上，是西格拉维克最美的景色。岬的两侧是西格拉维克渔港，渔船沿着海峡的岸边排开，在海峡和周边海域捕捞鳕鱼、鲱鱼和扇贝；跨海高速的服务区和观景台就在岬角附近，吸引过境的旅客停留，海鲜餐馆、民宿和游船码头随之兴旺。
      en: The long cape at the north-eastern end of Sigley, in Siglavik District of Siglavik City, reaching out into Sigley Strait and marking the northern end of the island. Its lighthouse looks out over the three-kilometre strait, which the Sigley Sea Crossing spans right beside the cape to land at Måsey on Aveline Island across the water; at sunset the bridge's shadow on the sea is Siglavik's loveliest sight. On either side of the cape lies Siglavik's fishing harbour, its boats ranged along the shore of the strait and taking cod, herring and scallops in the strait and the waters around. The expressway's service area and viewpoint are close to the cape and tempt passing travellers to stop, and seafood restaurants, guesthouses and boat-trip quays have flourished as a result.
  - id: nat_bqm9rk
    subtype: cape
    status: generated
    detect: { kind: cape, at_km: [212.2, 132.8] }
    names: { zh: 灯塔岬, en: Lighthouse Point, art-x-viking: Leuchtturmspitze, art-x-buckham: Punta del Faro }
    notes:
      zh: 阿夫琳岛北岸的岬角，属阿夫琳港市帆城区，面向阿夫琳海峡。岬角位于阿夫琳港老城帆城区的海岸，旧时帆城的渔民和水手在岬上点灯，为夜里返航的船只指引方向，岬名由此而来。站在岬上北望，就是宽阔的阿夫琳海峡和对岸的长船岛，大船沿着海峡里的深水航道往来于两岸的港口。帆城区是阿夫琳港航海传统保存最完整的地方，帆船俱乐部每年举办群岛帆船赛，比赛的航线常常绕过灯塔岬，岬上是观赛的最佳位置。岬角的草坡上修有步道和长椅，是帆城居民傍晚散步的去处。
      en: A cape on the north coast of Aveline Island, in Sail Town District of Port Aveline, facing Aveline Strait. It lies on the shore of Sail Town, the old town of Port Aveline, where fishermen and sailors once lit a lamp on the point to guide boats home at night, hence its name. Looking north from the cape you see the broad Aveline Strait and Longship Island beyond, with big ships moving along the deep-water fairways between the ports on either shore. Sail Town keeps Port Aveline's seafaring tradition most completely, and the course of the sailing club's annual island regatta often rounds Lighthouse Point, the best place to watch the race. Paths and benches run over its grassy slopes, an evening walk for the people of Sail Town.

  # ── Straits ──────────────────────────────────────────────
  - id: nat_5h94f5
    subtype: strait
    status: generated
