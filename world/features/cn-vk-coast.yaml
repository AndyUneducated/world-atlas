    notes:
      zh: 阿克斯岛南端两只锚爪西爪岬与东爪岬之间的大湾，面积七百多平方公里，是群岛最大的海湾，水深浪静，湾口有卡蒂马苏克岛屏障，自古就是群岛最好的天然良港。群岛第二大城市阿克斯维克因城市坐落在两只锚爪之间的阿克斯维克湾而得名，湾内的阿克斯维克集装箱港是群岛最大的集装箱港，大型集装箱船和散货船可以全天候进出。阿克斯岛纵贯高速沿湾岸延伸，以七公里多长的阿克斯维克湾跨海大桥跨越海湾，阿斯跨海高速从这里跨越阿克斯海峡口通往长船岛的斯蒂尔维克，阿克斯维克湾公路连接西爪和瑙斯特海姆两区。夜晚的阿克斯维克湾灯火通明，岸桥和货轮的灯光倒映在湾水中。
      en: The great bay between the two flukes at the southern end of Akkersey, West Fluke and East Fluke, a little over 700 km² and the largest bay in the islands. Deep and calm, with Kattimasuq Island sheltering its mouth, it has always been the finest natural harbour in the islands. Akkersvik, the second city of the archipelago, is named for its place in Akkersvik Bay between the two flukes, and the Port of Akkersvik within the bay is the largest container port in the islands, open to big container ships and bulk carriers in any weather. The Akkersey Spine Expressway follows the shore and crosses the bay on the 7.5 km Akkersvik Bay Bridge, the Akkersvik–Styrvik Sea Crossing sets off from here across the mouth of Akkersey Strait to Styrvik on Longship Island, and the Akkersvik Bay Road links West Fluke with the Naustheim District. At night the bay blazes with light, the quay cranes and freighters mirrored in its water.
  - id: nat_6r8rng
