    notes:
      zh: 长船岛的东北端，即「船首」，属长船市北岬区，是长船岛离北维京岛维京港最近的地方。维长城际铁路的维京海底铁路隧道长一百四十公里，从维京港出发穿越海峡，在船首岬出地面，以高架桥登陆，再经北岬区的地面线到长船站；铁路选择在这里登陆，是为了尽量缩短海底段。岬上的观景台面朝船首湾和北面开阔的海峡，晴天时海天一色，列车从隧道口驶出的瞬间是铁路迷喜爱的拍摄画面。岬角是北岬区海岸风景的一部分，周围的山坡上有牧羊草场和零星的渔屋。
      en: The north-eastern tip of Longship Island, its "prow", in North Cape District of Longship, and the point of the island nearest Viking Port on North Viking Island. The Viking Undersea Rail Tunnel of the Viking Port–Longship Intercity Railway runs 140 km from Viking Port beneath the strait and surfaces at Prow Point, coming ashore on a viaduct before crossing North Cape on the surface to Longship station; the railway lands here to keep the undersea section as short as possible. The viewpoint on the point faces Prow Bay and the open strait to the north, sea and sky merging on clear days, and a train bursting out of the tunnel portal is a favourite shot for railway photographers. The cape is part of North Cape's coastline, with sheep pastures and a few fishermen's huts on the slopes around it.
  - id: nat_1da50f
    subtype: cape
    status: generated
    detect: { kind: cape, at_km: [196.2, 166.8] }
    names: { zh: 北岬, en: North Cape, art-x-viking: Nordkap, art-x-buckham: Capo Nord }
    notes:
      zh: 长船岛船首以南的宽大岬角，属长船市北岬区，隔四公里宽的守望水道与守望岛相望，北岬区由此得名。北岬环抱着西北侧的北岬湾，岬上的平地建有维京群岛最大的机场长船国际机场，航班飞往北维京岛、群岛各岛和世界各地；长船机场高速以北岬高架桥从古城直达机场。群岛大学的主校区坐落在北岬湾畔的山坡上，科研人员和学生使北岬成为长船最年轻的区之一。岬的北部山坡上仍有牧羊草场，羊群和机场跑道相映成趣，长船西北岸公路从这里出发，沿海岸经西岸区通往潮湾。
      en: The broad headland south of Longship Island's prow, in North Cape District of Longship, facing Watch Isle across the four-kilometre Watch Sound; the district takes its name from it. North Cape shelters North Cape Bay on its north-west side, and on its flat land stands Longship International Airport, the largest in the Viking Islands, with flights to North Viking Island, the other islands and the world; the Longship Airport Expressway runs from the old town straight to the airport over the North Cape Viaduct. The University of the Islands has its main campus on the hillside above North Cape Bay, and its researchers and students make North Cape one of the youngest districts in Longship. Sheep still graze the slopes in the north of the cape beside the runways, and the Longship North-West Shore Road sets off from here along the coast through West Shore to Tidebay.
  - id: nat_m5r3gc
    subtype: island
    status: generated
    detect: { kind: island, at_km: [91.8, 90.2] }
    names: { zh: 船尾岛, en: Stern Isle, art-x-viking: Heckinsel, art-x-buckham: Isola di Poppa }
    notes:
      zh: 长船岛西南端「船尾」外的小岛，面积三十多平方公里，属舵港市船尾区，隔一道窄水与长船岛相连，隔着海面与暖泉岛相望。岛上只有一座灯塔和几户渔家，是海鸟和海豹的栖息地，灯塔为进出长船、暖泉与白帆三岛之间水道的船只指引方向。船尾区近年兴起乡村旅游，游客住进长船岛上的渔家民宿，跟随渔民出海时常绕到船尾岛看海豹，沿船尾悬崖的海岸步道也可以远眺船尾岛和暖泉岛的火山。
      en: An islet off the south-western tip of Longship Island, its "stern", a little over 30 km², in Stern District of Rudderhaven City, separated from Longship by a narrow channel and facing Warmspring Island across the sea. There is only a lighthouse and a few fishing families, and the island is home to seabirds and seals; its light guides ships through the waters between Longship, Warmspring and White Sail. Rural tourism has grown up in Stern District in recent years, and visitors staying with fishing families on Longship often go round by boat to see the seals on Stern Isle, while the coastal path along the stern cliffs looks out over the island and the volcano of Warmspring beyond.
  - id: nat_3r1gvb
    subtype: cape
    status: generated
    detect: { kind: cape, at_km: [192.2, 137.2] }
    names: { zh: 金角, en: Gold Point, art-x-viking: Goldspitze, art-x-buckham: Punta d'Oro }
    notes:
      zh: 汇金湾东侧伸向外海的岬角，属长船市汇金区。岬角护住汇金湾的东面，使湾内风平浪静，汇金区的玻璃塔楼就沿着湾岸一字排开，「金角」之名与汇金区一样，寄托着财富汇聚的寓意。岬上修建了滨海长廊和观景平台，从这里西望是汇金湾畔的塔楼和游艇码头，北望是长船湾和古城的城墙，夜晚塔楼的灯光与湾水相映，是首府最有名的夜景之一。岬外是开阔的外海，往来白帆海峡和长船湾的船只从岬前经过。
      en: The headland on the east, seaward side of Goldmark Bay, in Goldmark District of Longship. It shelters the bay from the east and keeps the water calm, and the glass towers of Goldmark line the shore behind it; like the district's own name, "Gold Point" expresses the hope of wealth gathering here. A seafront promenade and viewing platform run along the point, looking west to the towers and marina of Goldmark Bay and north to Longship Bay and the walls of the old town, and at night the lights of the towers mirrored in the bay make one of the capital's best-known night views. Beyond the point lies the open sea, and ships bound for White Sail Strait and Longship Bay pass in front of it.
  - id: nat_x8bkdv
    subtype: cape
    status: generated
    detect: { kind: cape, at_km: [104.8, 59.2] }
    names: { zh: 温泉岬, en: Hot Springs Point, art-x-viking: Thermenspitze, art-x-buckham: Punta delle Terme }
    notes:
      zh: 暖泉岛的东端，属暖泉市温泉区，与长船岛的船尾隔水相望，岬名取自北面的温泉湾。温泉岬是暖泉岛伸向长船岛方向的岬角，岬外的海面上船只往来，天晴时可以望见对岸长船岛的船尾。岬上是火山熔岩形成的黑色岩岸，岩缝里有几处温泉涌出，退潮时在海边形成天然的温泉池，当地人冬天常来这里泡脚看海。温泉岬和温泉湾构成温泉区的海岸风景，岬上的步道可以俯瞰温泉湾畔的度假村和身后的暖泉火山。
      en: The eastern tip of Warmspring Island, in Hot Springs District of Warmspring City, facing Longship Island's stern across the water and named after Hot Springs Bay just to the north. It is the cape where Warmspring reaches out towards Longship, and on clear days you can see ships at sea and Longship's stern on the far side. The headland is black lava rock, and a few hot springs rise from its cracks, forming natural pools at the water's edge at low tide where locals come in winter to soak their feet and watch the sea. With Hot Springs Bay it makes up the coastline of Hot Springs District, and the path along it looks down on the resorts by the bay and the volcano behind.
  - id: nat_xet2vm
    subtype: cape
    status: generated
    detect: { kind: cape, at_km: [30.8, 69.2] }
    names: { zh: 落日岬, en: Sunset Point, art-x-viking: Abendspitze, art-x-buckham: Punta del Tramonto }
    notes:
      zh: 暖泉岛的西端，属岩港市落日区，是暖泉岛向西伸入大洋的岬角，也是看海上落日的地方，岬名和落日区都由此得名。岬上的观景台面朝开阔的海面，每当天气晴朗的傍晚，太阳缓缓沉入大洋，把黑色的熔岩海崖和白色的浪花染成金红色，观景台上常常挤满了从温泉区和岩港驱车而来的游客。岬角周围是火山熔岩形成的海岸，渔村散布其间。暖泉环山公路经过岬角一带，沿线的温泉村、黑沙海滩和落日岬观景台构成了一条著名的观光路线，傍晚最为热闹。
      en: The western tip of Warmspring Island, in Sunset District of Rockhaven City, the cape where the island reaches west into the ocean and the place to watch the sun set over the sea; both the cape and the district are named for it. The viewpoint on the point faces the open water, and on clear evenings, as the sun sinks into the ocean and turns the black lava cliffs and white surf red-gold, it is crowded with visitors who have driven over from Hot Springs and Rockhaven. Lava shores surround the cape, with fishing villages scattered among them. The Warmspring Volcano Road passes nearby, and the hot-spring villages, the black beaches and the Sunset Point viewpoint along it make a famous scenic route, liveliest in the evening.
  - id: nat_emve42
    subtype: cape
    status: generated
    detect: { kind: cape, at_km: [65.8, 107.2] }
    names: { zh: 西爪岬, en: West Fluke, art-x-viking: Westflunke, art-x-buckham: Marra Ovest }
    notes:
      zh: 锚湾西侧的岬角，属锚港市西爪区，与东爪岬一起如锚的两爪抱住锚湾，是锚岛西侧的锚爪。岬角深入大海，海崖、草坡和沙湾交错，锚港人周末最喜欢沿着海岸步道徒步，观赏海鸟和日落。西爪区是锚港市面积最大、最有田园风光的区，岬上的大部分土地是起伏的牧场，奶牛和绵羊在草坡上吃草，乳品厂为城市供应黄油、奶酪和酸奶。锚湾公路以西爪高架桥通往岬角一带，向东经锚湾通往船厂区。从岬尖望去，锚湾的港口、潮汇岛和远处的东爪岬尽收眼底。
      en: The cape on the west side of Anchor Bay, in West Fluke District of Anchorhaven; with East Fluke it holds the bay like the two flukes of an anchor, the western fluke of Anchor Island. It reaches far into the sea, with cliffs, grassy slopes and sandy coves alternating, and at weekends Anchorhaven people love to walk the coast path watching seabirds and the sunset. West Fluke is the largest and most rural district of the city, and most of the cape is rolling pasture where dairy cows and sheep graze and creameries make butter, cheese and yoghurt for the city. The Anchor Bay Road reaches the cape over the West Fluke Viaduct and runs east round the bay to the Shipyard District. From the tip of the cape the port, Tidemeet Isle and East Fluke across the water are all in view.
  - id: nat_11r771
    subtype: cape
    status: generated
    detect: { kind: cape, at_km: [80.8, 104.2] }
    names: { zh: 东爪岬, en: East Fluke, art-x-viking: Ostflunke, art-x-buckham: Marra Est }
    notes:
      zh: 锚湾东侧的岬角，属锚港市锚湾区，面向锚岛海峡口，与西侧的西爪岬一起如锚的两爪抱住锚湾，岬名由此而来。东爪岬上的灯塔为进出锚湾的船只导航，大型集装箱船和散货船从岬旁驶入群岛最大的集装箱港。岬外就是锚岛海峡的南口，锚舵跨海高速从锚湾出发跨越海峡口通往长船岛的舵港，从岬上可以望见跨海长桥伸向东南的海面。岬角的草坡上是观景步道，傍晚常有锚港人来这里看货轮进港。
      en: The cape on the east side of Anchor Bay, in Anchor Bay District of Anchorhaven, facing the mouth of Anchor Strait; with West Fluke to the west it holds the bay like the two flukes of an anchor, hence its name. The lighthouse on East Fluke guides ships in and out of Anchor Bay, and big container ships and bulk carriers pass close by on their way into the largest container port in the islands. Beyond the cape lies the southern mouth of Anchor Strait, which the Anchor–Rudder Sea Crossing spans from Anchor Bay to Rudderhaven on Longship Island, and from the headland you can see its long bridge reaching away to the south-east. A path runs along the grassy top, and in the evenings Anchorhaven people often come out to watch the freighters come in.
  - id: nat_15mbb9
    subtype: cape
    status: generated
    detect: { kind: cape, at_km: [148.2, 52.8] }
    names: { zh: 桅顶岬, en: Masthead Point, art-x-viking: Mastkorbspitze, art-x-buckham: Punta della Coffa }
    notes:
      zh: 桅岛东北端的长岬，属桅港市桅港区，深入桅岛海峡，是桅岛北端的标志。岬上的灯塔俯瞰着三公里宽的桅岛海峡，桅岛跨海高速从岬旁跨越海峡，在对岸白帆岛的银鸥登陆，日落时桥影映在海面上，是桅港最美的景色。岬的两侧是桅港渔港，渔船沿着海峡的岸边排开，在海峡和周边海域捕捞鳕鱼、鲱鱼和扇贝；跨海高速的服务区和观景台就在岬角附近，吸引过境的旅客停留，海鲜餐馆、民宿和游船码头随之兴旺。
      en: The long cape at the north-eastern end of Mast Island, in Masthaven District of Masthaven City, reaching out into Mast Strait and marking the northern end of the island. Its lighthouse looks out over the three-kilometre strait, which the Mast Island Sea Crossing spans right beside the cape to land at Silvergull on White Sail Island across the water; at sunset the bridge's shadow on the sea is Masthaven's loveliest sight. On either side of the cape lies Masthaven's fishing harbour, its boats ranged along the shore of the strait and taking cod, herring and scallops in the strait and the waters around. The expressway's service area and viewpoint are close to the cape and tempt passing travellers to stop, and seafood restaurants, guesthouses and boat-trip quays have flourished as a result.
  - id: nat_bqm9rk
    subtype: cape
    status: generated
    detect: { kind: cape, at_km: [212.2, 132.8] }
    names: { zh: 灯塔岬, en: Lighthouse Point, art-x-viking: Leuchtturmspitze, art-x-buckham: Punta del Faro }
    notes:
      zh: 白帆岛北岸的岬角，属白帆市帆城区，面向白帆海峡。岬角位于白帆老城帆城区的海岸，旧时帆城的渔民和水手在岬上点灯，为夜里返航的船只指引方向，岬名由此而来。站在岬上北望，就是宽阔的白帆海峡和对岸的长船岛，大船沿着海峡里的深水航道往来于两岸的港口。帆城区是白帆航海传统保存最完整的地方，帆船俱乐部每年举办群岛帆船赛，比赛的航线常常绕过灯塔岬，岬上是观赛的最佳位置。岬角的草坡上修有步道和长椅，是帆城居民傍晚散步的去处。
      en: A cape on the north coast of White Sail Island, in Sail Town District of White Sail City, facing White Sail Strait. It lies on the shore of Sail Town, the old town of White Sail, where fishermen and sailors once lit a lamp on the point to guide boats home at night, hence its name. Looking north from the cape you see the broad White Sail Strait and Longship Island beyond, with big ships moving along the deep-water fairways between the ports on either shore. Sail Town keeps White Sail's seafaring tradition most completely, and the course of the sailing club's annual island regatta often rounds Lighthouse Point, the best place to watch the race. Paths and benches run over its grassy slopes, an evening walk for the people of Sail Town.

  # ── Straits ──────────────────────────────────────────────
  - id: nat_5h94f5
    subtype: strait
    status: generated
    detect: { kind: fjord, at_km: [135.2, 84.8] }
    names: { zh: 白帆海峡, en: White Sail Strait, art-x-viking: Weißsegelstraße, art-x-buckham: Stretto di Velabianca }
    notes:
      zh: 长船岛与白帆岛之间狭长的内海，长约三百公里，面积六千七百多平方公里，两岸港口与大船航道都在海峡里。长船岛东南岸的东港集装箱码头是长船的货运港，大型集装箱船沿着海峡的深水航道往来于群岛与北维京岛和远方之间；对岸白帆岛的帆城、帆影和银鸥沿海岸分布。长白跨海高速以跨海大桥越过海峡，连接首府长船与白帆；海峡南端有中流岛和引水岛，引航员在这一带登船，带大船进出海峡，南口外的桅岛海峡上还有桅岛跨海高速通过。海峡里风浪较外海平静，是群岛帆船运动的好去处。
      en: The long, narrow inland sea between Longship and White Sail islands, about 300 km long and more than 6,700 km² in area, holding the ports on both shores and the deep-sea fairways. The East Harbour Container Terminal on the south-east shore of Longship Island is the capital's cargo port, and big container ships follow the strait's deep-water channels between the islands, North Viking Island and the wider world, while Sail Town, Sailshadow and Silvergull line the White Sail shore opposite. The Longship–White Sail Sea Crossing bridges the strait between the capital and White Sail; at its southern end lie Midway and Pilot isles, where pilots board to take ships in and out, and beyond its southern mouth the Mast Island Sea Crossing spans Mast Strait. Its waters are calmer than the open sea and a favourite of island sailors.
  - id: nat_rssv0a
    subtype: strait
    status: generated
    detect: { kind: fjord, at_km: [106.8, 124.8] }
    names: { zh: 锚岛海峡, en: Anchor Strait, art-x-viking: Ankerstraße, art-x-buckham: Stretto dell'Ancora }
    notes:
      zh: 锚岛与长船岛之间的海峡，长约一百四十公里，面积两千四百多平方公里，是群岛最繁忙的航道之一。海峡水深流急，在长船岛西北岸的潮湾一带收窄，潮差大、潮流急，潮湾潮汐电站横跨海湾口，利用每天两次的涨落潮为长船都市区发电。锚岛东南岸的船厂区沿海峡排开造船厂、船坞和海工装备基地，新船下水时市民聚集在岸边观看巨轮滑入海峡。锚岛跨海高速从潮湾跨越海峡到锚岛的船厂区，长船西岸高速沿长船岛一侧的海岸延伸，锚舵跨海高速则在海峡南口跨海，把锚湾与长船岛的船尾连在一起。
      en: The strait between Anchor and Longship islands, about 140 km long and more than 2,400 km², one of the busiest shipping lanes in the islands. Its water is deep and swift, and it narrows off Tidebay on Longship's north-west shore, where the tidal range is large and the current strong; the Tidebay Tidal Power Station spans the mouth of the bay and uses the twice-daily tides to power the Longship area. Along the Anchor Island side, the Shipyard District lines the strait with yards, docks and offshore fabrication sites, and when a new ship is launched people gather on the shore to watch it slide into the strait. The Anchor Strait Crossing bridges it from Tidebay to the Shipyard District on Anchor Island, the Longship West Shore Expressway follows the Longship shore, and the Anchor–Rudder Sea Crossing crosses its southern mouth to join Anchor Bay with Longship's stern.
  - id: nat_qcp61q
    subtype: strait
    status: generated
    detect: { kind: strait, at_km: [99.8, 51.8] }
    names: { zh: 暖泉海峡, en: Warmspring Strait, art-x-viking: Warmquellstraße, art-x-buckham: Stretto di Fontecalda }
    notes:
      zh: 暖泉岛东岸与浮石岛之间的海峡，宽约五公里，属暖泉市温泉区，是从长船岛船尾前往暖泉的海上航道。从船尾方向驶来的船只穿过海峡进入温泉湾，在甲板上就能望见海滩上升起的温泉蒸汽和身后的暖泉火山。海峡东侧的浮石岛海滩堆满了火山浮石，西侧是温泉区的度假酒店和群岛最大的暖泉温泉度假村。海峡里水流平缓，夏季常有游艇和皮划艇在浮石岛与温泉湾之间往来。
      en: The strait between the east coast of Warmspring Island and Pumice Isle, about five kilometres wide, in Hot Springs District of Warmspring City, and the sea route from Longship Island's stern to Warmspring. Boats coming from the stern pass through it into Hot Springs Bay, and from the deck you can see steam rising from the beaches and the volcano behind. On the east side, Pumice Isle's beaches are heaped with volcanic pumice; on the west side stand the resort hotels of Hot Springs District and the Warmspring Spa Resort, the largest in the islands. The current is gentle, and in summer yachts and kayaks cross back and forth between Pumice Isle and Hot Springs Bay.
  - id: nat_pf80ey
    subtype: strait
    status: generated
    detect: { kind: strait, at_km: [198.8, 166.2] }
    names: { zh: 守望水道, en: Watch Sound, art-x-viking: Wachtsund, art-x-buckham: Canale della Vedetta }
    notes:
      zh: 守望岛与长船岛北岬之间的水道，宽约四公里，属长船市北岬区，是从北方进出长船的航道。从北维京岛方向驶来的船只绕过长船岛的船首，经守望水道南下，再沿东岸驶入长船湾的港口。维京时代守望岛顶的烽火就是为守住这条水道而设，水道、守望岛和湾内的守望湾都由此得名。如今维长高速的维京海底公路隧道从水道附近的海底穿过，一条直线连接维京港与长船古城，海面上的船只与海底的车流各行其道。
      en: The channel between Watch Isle and North Cape on Longship Island, about four kilometres wide, in North Cape District of Longship and the way in to Longship from the north. Ships coming from North Viking Island round the bow of Longship Island, run south through Watch Sound and then follow the east coast into the harbours of Longship Bay. The Viking-age beacon on Watch Isle was set there to guard this channel, which gave the sound, the island and Watch Bay their names. Today the Viking Undersea Road Tunnel of the Viking Port–Longship Expressway runs beneath the seabed close to the sound in a straight line from Viking Port to Longship's old town, so that ships on the surface and traffic under the sea each go their own way.
  - id: nat_cyt4bq
    subtype: strait
    status: generated
    detect: { kind: strait, at_km: [146.2, 58.0] }
    names: { zh: 桅岛海峡, en: Mast Strait, art-x-viking: Maststraße, art-x-buckham: Stretto dell'Albero }
    notes:
      zh: 桅岛与白帆岛西南端之间的海峡，宽约三公里，属桅港市桅港区，是白帆海峡的南口。桅岛跨海高速从桅岛北端的桅顶岬旁跨越海峡，在对岸的银鸥登陆，向北接白帆纵贯高速；两段海上长桥以桅岛为中间支点，把暖泉岛与白帆岛连成一线。桅港渔港沿着海峡的岸边排开，渔船在海峡和周边海域捕捞鳕鱼、鲱鱼和扇贝，桅顶岬上的灯塔俯瞰着海峡。日落时，跨海长桥的桥影映在海面上，是桅港最美的景色。
      en: The strait between Mast Island and the south-western end of White Sail Island, about three kilometres wide, in Masthaven District of Masthaven City, and the southern mouth of White Sail Strait. The Mast Island Sea Crossing spans it beside Masthead Point at the northern end of Mast Island and lands at Silvergull on the far side, where it meets the White Sail Spine Expressway; its two long sea bridges use Mast Island as a stepping stone to tie Warmspring and White Sail together. Masthaven's fishing harbour lines the shore of the strait, its boats taking cod, herring and scallops in the strait and the waters around, and the lighthouse on Masthead Point looks out over it. At sunset the shadow of the bridge on the water is Masthaven's loveliest sight.
  - id: nat_t6kg3e
    subtype: strait
    status: generated
    detect: { kind: strait, at_km: [248.8, 120.2] }
    names: { zh: 灯塔水道, en: Lighthouse Sound, art-x-viking: Leuchtturmsund, art-x-buckham: Canale del Faro }
    notes:
      zh: 灯塔岛与白帆岛之间的水道，宽不到三公里，属白帆市灯塔区，是进出帆港湾的航道。大型邮轮和渔船从这里驶入白帆邮轮母港所在的帆港湾，灯塔岛上的灯塔岛灯塔与白帆岛上的白帆灯塔隔着水道遥相呼应，为夜里进港的船只指引方向。每年夏季，座头鲸和虎鲸经灯塔湾和灯塔水道洄游，灯塔区观鲸码头的观鲸船每天有多班出海，常在水道里看到鲸鱼喷水。水道两岸是灯塔区的海滨别墅和礁石海岸，邮轮鸣笛进港时，岸边常有游客驻足观看。
      en: The channel between Lighthouse Isle and White Sail Island, less than three kilometres wide, in Lighthouse District of White Sail City, and the fairway into Sail Harbour Bay. Big cruise ships and fishing boats pass through it into the bay of the White Sail Cruise Port, and the Lighthouse Isle Light and the White Sail Lighthouse answer each other across the water, guiding ships into port at night. Every summer humpbacks and killer whales pass through Lighthouse Bay and Lighthouse Sound, and the boats from Lighthouse District's whale-watching quay, out several times a day, often see them blowing in the sound. Seaside villas and rocky shores line both sides, and when a cruise ship sounds its horn coming in, visitors on the shore stop to watch.
  - id: nat_vtgsq9
    subtype: strait
    status: generated
    detect: { kind: strait, at_km: [267.0, 110.2] }
    names: { zh: 晨光海峡, en: Dawnlight Strait, art-x-viking: Morgenlichtstraße, art-x-buckham: Stretto dell'Aurora }
    notes:
      zh: 白帆岛与晨光岛之间的海峡，宽近三十公里，属晨光市晨光区。海峡里大片浅水滩涂随潮水涨落时隐时现，是候鸟迁徙的重要停歇地，春秋两季鹬类、鸻类和雁鸭成群聚集，成千上万的水鸟在这里觅食。晨光公路的大半路段位于晨光海峡跨海大桥上，这座近二十九公里长的低矮长桥贴着滩涂延伸，桥下潮水自由进出，水鸟栖息地得以保留；候鸟季节桥上禁止停车，观鸟需到两端的观测点。渡轮也穿过海峡往返晨光岛与白帆岛的灯塔区。
      en: "The strait between White Sail Island and Dawnlight Island, nearly 30 km wide, in Dawnlight District of Dawnlight City. Broad shallow mudflats in the strait appear and vanish with the tide and are a major stopover for migrating birds: every spring and autumn waders, plovers, geese and ducks gather in their thousands to feed. Most of the Dawnlight Road runs on the Dawnlight Strait bridge, a low span nearly 29 km long laid along the flats, with the tide flowing freely beneath it so that the birds' habitat survives; stopping on the bridge is banned in the bird season, and birdwatchers use the observation points at either end. Ferries also cross the strait between Dawnlight and Lighthouse District on White Sail Island."
  - id: nat_jrnd2d
    subtype: strait
    status: generated
    detect: { kind: strait, at_km: [36.0, 209.8] }
    names: { zh: 外屿海峡, en: Outer Isles Strait, art-x-viking: Außeninselstraße, art-x-buckham: Stretto delle Isole Esterne }
    notes:
      zh: 外屿北部鸟崖岛与鳕岛之间的海峡，宽近四十公里，是外屿渔船的主航道。海峡里的冷水海域鱼群丰富，鳕港和鸟崖的渔船常年在这里作业，鳕鱼汛期时海面上渔船往来不绝。每年夏季，座头鲸、虎鲸和小须鲸也经过外屿一带的海域洄游。鸟崖海鸟保护区的灯塔建在鸟崖岛的最高处，为海峡里的船只指引航向，灯塔旁的观测站常年监测海鸟数量和海洋环境。海峡上没有桥梁，冬季风暴来临时风浪很大，渔船常到两岸的港湾里避风。
      en: The strait between Bird Cliff Isle and Cod Island in the north of the Outer Isles, nearly 40 km wide and the main channel of the Outer Isles' fishing boats. Its cold waters are rich in fish, the boats of Codhaven and Bird Cliff work here all year, and in the cod season the sea is busy with boats coming and going. Every summer humpback, killer and minke whales also pass through the waters of the Outer Isles. The lighthouse of the Bird Cliff Seabird Reserve on the island's highest point guides ships through the strait, and the observatory beside it monitors seabird numbers and the marine environment all year. No bridge crosses it, the winter storms raise heavy seas, and the fishing boats often shelter in the harbours on either side.
  - id: nat_rhtezf
    subtype: strait
    status: generated
    detect: { kind: strait, at_km: [19.2, 155.2] }
    names: { zh: 海雀水道, en: Puffin Sound, art-x-viking: Lundsund, art-x-buckham: Canale delle Pulcinelle }
    notes:
      zh: 鲸岛与海雀岛之间的窄水道，宽约三公里，属外屿市鲸岛区。外屿跨海公路的海雀水道跨海大桥以这条水道命名，大桥长七十多公里，占全线近一半，从鲸岛出发跨过水道，再向北跨越开阔的海面直达鸟崖岛，是群岛最长的桥梁之一，桥面设有观鲸平台。水道旁就是鲸岛北岸的观鲸湾，夏季鲸鱼常在水道和湾里觅食，观鲸船从鲸岛出发，绕过海雀岛寻找鲸群。夏季的海雀岛上满是筑巢的海鹦，从桥上和船上都能看到它们成群掠过水面。
      en: "The narrow channel between Whale Isle and Puffin Isle, about three kilometres wide, in Whale Isle District of Outer Isles City. The Puffin Sound bridge of the Outer Isles Causeway is named after it: more than seventy kilometres long and nearly half the length of the road, it leaves Whale Isle across the sound and runs north over the open sea to Bird Cliff Isle, one of the longest bridges in the islands, with whale-watching platforms on its deck. Whalewatch Bay on Whale Isle's north coast lies beside the sound, whales often feed in the sound and the bay in summer, and the whale-watching boats from Whale Isle round Puffin Isle in search of them. In summer Puffin Isle is full of nesting puffins, and flocks of them can be seen skimming the water from the bridge and the boats."
