# Coastal landforms of the Viking Islands: islands, bays, capes and straits.
# The generator finds them in the coastline (pipeline/atlas/coast.py); each entry names the
# landform of `detect.kind` nearest to `detect.at_km` (design km, x east, y north).
# Unnamed landforms are listed in .cache/candidates-div_raat4g.json after a build.
features:
  # ── Main islands ─────────────────────────────────────────
  - id: nat_170rsf
    subtype: island
    status: generated
    detect: { kind: island, at_km: [148.2, 130.2] }
    names: { zh: 长船岛, en: Longship Island, art-x-viking: Langskipinsel, art-x-buckham: Isola Navelunga }
    notes:
      zh: 维京群岛最大的岛，面积四万一千多平方公里，狭长如一艘长船，船首朝东北指向北维京岛，船尾朝西南伸向暖泉岛与阿夫琳岛之间的水道。谢尔海姆山像倒扣的船龙骨纵贯全岛，主峰斯塔文廷峰海拔一千二百九十多米，是岛上最高点。首府长船建在船首一带的长船湾畔，古城里有维京王厅遗址和长船博物馆，对岸的汇金区是群岛的金融中心，北岬有长船国际机场和群岛大学。维长高速和维长城际铁路以海底隧道直通北维京岛的维京港，长白、阿克斯岛、锚舵、群岛和西格利岛五条跨海高速从这里通往其他大岛，长船岛因此是整个群岛的交通中心。
      en: "The largest of the Viking Islands, more than 41,000 km², long and narrow like a longship, its bow pointing north-east at North Viking Island and its stern reaching south-west towards the waters between Warmspring and Aveline islands. The Kjølheim Hills run its length like an upturned keel, and their main summit, Stavntind at a little under 1,300 m, is the island's highest point. The capital, Longship, stands on Longship Bay near the bow: the old town has the Viking Hall Ruins and the Longship Museum, Goldmark across the bay is the islands' financial centre, and North Cape has Longship International Airport and the University of the Islands. The Viking Port–Longship Expressway and Intercity Railway run under the sea to Viking Port on North Viking Island, and five sea-crossing expressways lead from here to the other large islands, making Longship Island the hub of the whole archipelago."
  - id: nat_2p2v9m
    subtype: island
    status: generated
    detect: { kind: island, at_km: [206.8, 101.2] }
    names: { zh: 阿夫琳岛, en: Aveline Island, art-x-viking: Avelineinsel, art-x-buckham: Isola Aveline }
    notes:
      zh: 长船岛东南的大岛，面积三万六千四百多平方公里，在群岛中排第三，隔长约三百公里的阿夫琳海峡与长船岛平行。卡洛韦岭纵贯全岛中部，从海上望去如一面鼓满的白帆，岛名则来自早年最先在这里靠岸的商船「阿夫琳号」，最高峰卡洛韦峰海拔一千五百二十多米，耸立在东端的阿夫琳湾畔。岛的东北端是群岛第四大城市阿夫琳港，邮轮母港、免税城和老城帆城区沿海湾展开；东南岸的萨尔塔维克以海盐和海上风电闻名，菲斯克海姆鱼市是全岛最大的鲜鱼市场；西南端的莫斯维克湾风平浪静，是度假胜地。长阿跨海高速越过阿夫琳海峡通往首府长船，阿夫琳纵贯高速经萨尔塔维克南下到西南端的莫塞，西格利跨海高速再从那里经西格利岛通往暖泉岛。
      en: The large island south-east of Longship Island, more than 36,400 km², third in size among the islands, lying parallel to Longship across the 300 km Aveline Strait. Calloway Ridge runs along its middle and from the sea looks like a full white sail, while the island is named after the Aveline, the merchant ship that first put in here; its highest summit, Mount Calloway at just over 1,520 m, rises above Aveline Bay at the eastern end. In the north-east is Port Aveline, the fourth city of the islands, whose cruise port, duty-free town and old town of Sail Town line the bay; Saltavik Bay on the south-east coast is known for sea salt and offshore wind, and the Fiskheim fish market is the island's largest; Måsvik Bay at the south-western end is calm water and a holiday favourite. The Longship–Port Aveline Sea Crossing bridges the strait to the capital, the Aveline Spine Expressway runs south by way of Saltavik Bay to Måsey at the south-western end, and from there the Sigley Sea Crossing continues by way of Sigley to Warmspring.
  - id: nat_bcjvmn
    subtype: island
    status: generated
    detect: { kind: island, at_km: [101.8, 162.8] }
    names: { zh: 阿克斯岛, en: Akkersey, art-x-viking: Akkersey, art-x-buckham: "Isola dell'Ancora" }
    notes:
      zh: 长船岛西北的大岛，面积三万六千九百多平方公里，在群岛中仅次于长船岛，隔一百四十公里长的阿克斯海峡与长船岛相望。锚链山纵贯全岛，主峰铁锚峰海拔两千零七十多米，是阿克斯岛最高点，北坡挂着群岛唯一的山岳冰川锚链冰川；西岸峡湾深切。岛的南端两只「锚爪」西爪岬和东爪岬抱住阿克斯维克湾，水深浪静，是群岛最好的天然良港，阿克斯岛（维京语里意为「锚岛」）也由此得名。群岛第二大城市阿克斯维克就在阿克斯维克湾畔，拥有群岛最大的集装箱港和造船基地；北部的富鲁海姆市是大片松林和林场。阿克斯跨海高速经弗洛德维克、阿斯跨海高速经斯蒂尔维克与长船岛相连，阿克斯岛纵贯高速则把南端的阿克斯维克与东北端的富鲁海姆连成一线。
      en: The large island north-west of Longship Island, more than 36,900 km², second in size only to Longship and facing it across the 140 km Akkersey Strait. The Anchor Chain Mountains run its length; their main summit, Iron Anchor Peak at just over 2,070 m, is the island's highest point and carries on its north face the Anchor Chain Glacier, the only mountain glacier in the islands. Fjords cut deep into the west coast. At the southern end the two "flukes", West Fluke and East Fluke, hold Akkersvik Bay between them, deep and calm, the finest natural harbour in the islands and the source of the island's name. Akkersvik, the second city of the islands, stands on the bay with the largest container port and shipbuilding base in the archipelago, while Furuheim in the north is a land of pine forest and timber holdings. The Akkersey Strait Crossing via Flodvik and the Akkersvik–Styrvik Sea Crossing via Styrvik link it to Longship Island, and the Akkersey Spine Expressway joins Akkersvik in the south to Furuheim in the north-east.
  - id: nat_9ajbb1
    subtype: island
    status: generated
    detect: { kind: island, at_km: [62.2, 48.8] }
    names: { zh: 暖泉岛, en: Warmspring Island, art-x-viking: Warmquellinsel, art-x-buckham: Isola Fontecalda }
    notes:
      zh: 群岛西南端的圆形火山岛，面积近三万四千平方公里，是群岛第四座大岛。岛心是一座活火山暖泉火山，主峰火口峰海拔两千二百八十多米，是群岛最高峰，峰顶的暖泉冰帽终年不化，火口内终年冒着蒸汽；河流从火山向四面流入大海，暖河是群岛最长的河。火山的地热让全岛遍布温泉、喷气孔和地热田：东岸的温泉区有群岛最大的温泉度假村，斯瓦特桑德区有黑沙滩和群岛最大的地热电站，南岸的新特雷曼以地热温室著称，西岸的克莱特斯塔德是矿业与地热港城，西端的落日岬以日落闻名。群岛跨海高速从克莱特斯塔德横贯全岛跨海通往长船岛，暖泉南环高速和环山公路环绕火山。
      en: "The round volcanic island at the south-western end of the archipelago, nearly 34,000 km², the fourth of the large islands. At its heart is Warmspring Volcano, an active volcano whose summit, Crater Peak at just over 2,280 m, is the highest point in the islands; the Warmspring Ice Cap never melts on its top, and steam rises from the crater all year. Rivers run from the volcano to the sea on every side, and the Warm River is the longest in the islands. Volcanic heat fills the island with hot springs, fumaroles and geothermal fields: Hot Springs District on the east coast has the islands' largest spa resort, Svartsand has its black beaches and the largest geothermal power station in the islands, Tremaine Bay on the south coast is known for its geothermal greenhouses, Klettstad on the west coast is a mining and geothermal port, and Sunset Point at the western tip is famous for its sunsets. The Island Chain Expressway crosses the island from Klettstad and bridges the sea to Longship Island, while the Southern Arc Expressway and the Volcano Road circle the volcano."

  # ── Medium islands ───────────────────────────────────────
  - id: nat_h86h79
    subtype: island
    status: generated
    detect: { kind: island, at_km: [136.2, 33.8] }
    names: { zh: 西格利岛, en: Sigley, art-x-viking: Sigley, art-x-buckham: "Isola dell'Albero" }
    notes:
      zh: 长船岛船尾以南的岛，面积近六千平方公里，是四座大岛之外最大的岛屿，坐落在暖泉岛与阿夫琳岛之间的海面上。岛上长满笔直高大的松树，旧时为长船港的船坞供应桅木，西格利岛和岛上的西格拉维克市都由此得名。北端的西格拉维克是城市中心和渔港，渔船在西格利海峡和周边海域捕捞鳕鱼、鲱鱼和扇贝，东南外的牡蛎岛一带的牡蛎养殖远近闻名；南部是南桅区的松林和村庄。西格利跨海高速以西格利岛为中间支点，一段跨海通往长船岛船尾和暖泉，一段跨越西格利海峡通往阿夫琳岛的莫塞，西格利岛公路穿过松林连接南桅与西格拉维克，是岛上最有名的风景路线。
      en: The island south of Longship Island's stern, nearly 6,000 km², the largest in the archipelago after the four big islands, lying in the sea between Warmspring and Port Aveline. Tall, straight pines cover it and once supplied mast timber to the Longship yards, which gave both the island and its city, Siglavik, their names. Siglavik at the northern end is the town centre and fishing port, whose boats take cod, herring and scallops in Sigley Strait and the surrounding waters, and the oyster beds around Oyster Isle to the south-east are known across the islands; the south is the pine forest and villages of South Mast District. The Sigley Sea Crossing uses the island as its stepping stone, one leg crossing the sea to Longship's stern and Warmspring and the other spanning Sigley Strait to Måsey on Aveline Island, while the Sigley Road through the pines between South Mast and Siglavik is the island's best-known scenic drive.
  - id: nat_0zxng2
    subtype: island
    status: generated
    detect: { kind: island, at_km: [232.8, 36.2] }
    names: { zh: 圣翁丁岛, en: Saint-Ondine Island, art-x-viking: Saint-Ondine-Insel, art-x-buckham: "Isola Sant'Ondine" }
    notes:
      zh: 群岛南部外海的岛，面积五千多平方公里，全岛属圣翁丁市。岛上的圣翁丁镇建在南岸，以航海者的守护圣人圣翁丁命名，传说维京航海者以岛顶上方的南天星辰定向。南岸绵长的沙滩和温和的海水使圣翁丁成为群岛最受欢迎的夏季度假地之一，圣翁丁海滨度假村和渔村沿海岸分布，岛民以渔业和海岛度假为生。圣翁丁公路自圣翁丁镇出发，翻过全岛到达北岸的圣翁丁渡轮码头，全长六十多公里，是岛上唯一的干线公路；渡轮从那里往返阿夫琳岛的萨尔塔维克，是圣翁丁对外交通的唯一通道。岛的东南外海是灰海豹繁殖的塞尔霍尔姆岛。
      en: An island in the southern outer waters of the archipelago, more than 5,000 km², all of it in Saint-Ondine. The town of Saint-Ondine on the south coast is named after the patron saint of seafarers, and Viking navigators are said to have steered by the stars above the island's summit. The long beaches and mild water of the south coast make it one of the islands' favourite summer holiday spots, and the Saint-Ondine Seaside Resort and fishing villages line the shore; islanders live by fishing and tourism. The Saint-Ondine Road runs from the town over the island to the Saint-Ondine Ferry Terminal on the north coast, a little over 60 km and the only main road on the island, and from there ferries cross to Saltavik Bay on Aveline Island, the island's only link with the outside. Off its south-eastern shore lies Selholm, where grey seals breed.
  - id: nat_43xwsq
    subtype: island
    status: generated
    detect: { kind: island, at_km: [22.8, 138.8] }
    names: { zh: 瓦莱岛, en: Hvaley, art-x-viking: Hvaley, art-x-buckham: Isola Balena }
    notes:
      zh: 乌维克库特最大的岛，面积五千一百多平方公里，是乌维克库特市的主岛和中心。每年夏季，座头鲸、虎鲸和小须鲸在岛外洄游，在北岸的观鲸湾里觅食，观鲸船从瓦莱渡轮码头出发，几乎每次出海都能看到鲸鱼喷水和跃身；瓦莱观鲸中心是群岛的鲸类研究和科普机构，展出鲸鱼骨架、鲸歌录音和迁徙地图。岛上的渔村沿港湾分布，鱼干晾架和红色的渔屋是瓦莱岛的标志性景观，许多渔家兼营民宿和海鲜餐馆。渡轮从瓦莱岛通往阿夫琳港、阿克斯维克和长船，乌维克库特跨海公路则经伦达霍尔姆岛旁的伦达霍尔姆水道跨海大桥北上，通往乌维克库特的另一座大岛西基克图克岛。
      en: The largest of the Uviqkut, more than 5,100 km², the main island and centre of Uviqkut City. Every summer humpback, killer and minke whales pass offshore and feed in Whalewatch Bay on the north coast, and the boats that leave from the Hvaley Ferry Terminal see whales blowing and breaching on almost every trip; the Hvaley Whale Centre is the islands' institute for whale research and education, with skeletons, recordings of whale song and migration maps. Fishing villages line the harbours, and drying racks and red fishermen's houses are the island's signature sight; many fishing families also run guesthouses and seafood restaurants. Ferries run from here to Port Aveline, Akkersvik and Longship, and the Uviqkut Causeway heads north over the Lundaholm Sound bridge past Lundaholm to Siqqiqtuuq Island, the other large island of the group.
  - id: nat_n4g4mt
    subtype: island
    status: generated
    detect: { kind: island, at_km: [283.8, 109.8] }
    names: { zh: 埃德文岛, en: Edevane Island, art-x-viking: Edevaneinsel, art-x-buckham: Isola Edevane }
    notes:
      zh: 群岛东端的岛，面积三千六百多平方公里，是群岛最东的中等岛屿，与东侧的东极岛一起组成埃德文港市。岛上的埃德文港镇以最早在这里筑港的埃德文船长命名，这里每天最早迎来群岛的第一缕阳光，清晨在海边看日出是游客必做的事。埃德文岛与阿夫琳岛之间是近三十公里宽的埃德文海峡，海峡的滩涂是候鸟迁徙的重要停歇地，春秋两季鹬类、鸻类和雁鸭成群聚集。埃德文港公路的大半路段位于贴着滩涂延伸的埃德文海峡跨海大桥上，桥下潮水自由进出，候鸟季节桥上禁止停车。渡轮从西岸的埃德文港渡轮码头往返阿夫琳岛的灯塔区，日出旅游、海上风电和渔业是岛上的主要生计。
      en: An island at the eastern edge of the archipelago, more than 3,600 km², the easternmost of the medium-sized islands, forming Port Edevane together with Eastmost Isle beside it. The town of Port Edevane, named after Captain Edevane who first built a harbour here, catches the islands' first sunlight each morning, and watching the sunrise from the shore is a must for visitors. Between Port Edevane and Port Aveline lies the Edevane Strait, nearly 30 km wide, whose mudflats are a major stopover for migrating birds; every spring and autumn waders, plovers, geese and ducks gather in flocks. Most of the Port Edevane Road runs on the low Edevane Strait bridge laid along the flats, with the tide flowing freely beneath, and stopping on it is banned in the bird season. Ferries leave the Port Edevane ferry terminal on the west coast for Lighthouse District on Aveline Island, and sunrise tourism, offshore wind and fishing are the island's livelihoods.
  - id: nat_g7hv2z
    subtype: island
    status: generated
    detect: { kind: island, at_km: [49.2, 221.8] }
    names: { zh: 乌利克尤阿克岛, en: Ulikjuaq Island, art-x-viking: Ulikjuaqinsel, art-x-buckham: Isola Ulikjuaq }
    notes:
      zh: 群岛西北外海的渔岛，面积三千一百多平方公里，与艾因谢尔岛一起组成乌利克尤阿克市，岛的北缘与艾因谢尔岛、赫里姆岛同在群岛的最北端。周围的冷水海域是鳕鱼的产卵场和洄游通道，每年冬末春初鳕鱼汛期，渔船倾巢而出，乌利克尤阿克镇海边成排的木制鱼干架绵延数公里，鳕鱼在海风中风干两三个月，制成群岛最著名的特产风干鳕鱼。乌利克尤阿克镇坐落在岛西岸的海湾里，港内停满拖网船和延绳钓船。乌利克尤阿克岛公路从镇子后方绕过晾晒场，横穿全岛到东岸的乌利克尤阿克渡轮码头，冷藏货车把鱼货运上渡轮，再经阿克斯岛的富鲁海姆运往各地。南面隔着乌维克库特海峡是西基克图克岛。
      en: The fishing island in the north-western outer waters, more than 3,100 km², forming Ulikjuaq City with Einsker; its northern shore, with Einsker and Hrimey, marks the northern limit of the archipelago. The cold waters around it are the spawning grounds and migration route of the cod, and in the cod season at the end of winter the whole fleet puts to sea; rows of wooden drying racks stretch for kilometres along the shore at Ulikjuaq, where the fish dry in the sea wind for two or three months into stockfish, the islands' most famous product. The town lies in a bay on the west coast, its harbour packed with trawlers and longliners. The Ulikjuaq Island Road skirts the drying grounds behind the town and crosses the island to the Ulikjuaq Ferry Terminal on the east coast, where refrigerated lorries take the catch aboard for Furuheim on Akkersey and beyond. Siqqiqtuuq Island lies to the south across the Uviqkut Strait.
  - id: nat_dvayg1
    subtype: island
    status: generated
    detect: { kind: island, at_km: [254.8, 146.8] }
    names: { zh: 亚利图克岛, en: Jaalituuq Island, art-x-viking: Jaalituuqinsel, art-x-buckham: Isola Jaalituuq }
    notes:
      zh: 阿夫琳岛东北的岛，面积两千三百多平方公里，与外海的哨岛一起组成布兰诺克堡市，是离北维京岛最近的中等岛屿之一。亚利图克岛海风终年不息，是群岛风力发电的主要基地：岛上的山脊排列着成片的陆上风机，外海还建有大型海上风电场，电力经海底电缆输往长船和阿夫琳港。布兰诺克堡镇坐落在岛北部的山谷里，是一座年轻的新兴小镇，许多住宅是为风电工程师和技术工人家庭新建的公寓。亚利图克岛公路自布兰诺克堡镇出发，沿风机林立的山脊到南岸的布兰诺克堡风电运维港，按运输超长叶片的要求设计，往返阿夫琳港的渡轮也在运维港停靠。山脊上的观景台是看日落和风机剪影的好地方。
      en: "The island north-east of Aveline Island, more than 2,300 km², forming Fort Brannock with Sentinel Isle offshore, and one of the medium-sized islands nearest North Viking Island. The wind never stops here, and the island is the islands' main wind-power base: rows of onshore turbines line its ridges, a large wind farm stands offshore, and the power goes by subsea cable to Longship and Port Aveline. Fort Brannock, in a valley in the north, is a young and growing town, much of its housing new flats for the families of wind engineers and technicians. The Jaalituuq Island Road runs from the town along the turbine-lined ridge to the Fort Brannock Wind Service Port on the south coast, built to carry extra-long blades, and the ferry to Port Aveline calls at the service port too. The viewpoint on the ridge is the place to watch the sunset behind the turbines."
  - id: nat_nwd97h
    subtype: island
    status: generated
    detect: { kind: island, at_km: [23.8, 196.8] }
    names: { zh: 西基克图克岛, en: Siqqiqtuuq Island, art-x-viking: Siqqiqtuuqinsel, art-x-buckham: Isola Siqqiqtuuq }
    notes:
      zh: 乌维克库特北部的岛，面积两千二百多平方公里，位于瓦莱岛以北，属乌维克库特市西基克图克区。岛的四周是海鸟筑巢的悬崖，西岸的海崖高达百米，每年春夏，数十万只海鹦、海鸠、三趾鸥和北方塘鹅聚集在岩架上筑巢产卵，是维京群岛重要的海鸟繁殖地。西基克图克海鸟保护区覆盖全岛大部分海崖和周边海域，游客只能沿指定的步道和观鸟台观赏；保护区里的灯塔建在岛的最高处，为乌维克库特海峡里的船只指引航向。岛上只有几座小渔村，乌维克库特跨海公路是唯一的公路，向南经七十多公里长的伦达霍尔姆水道跨海大桥通往瓦莱岛；北面隔着乌维克库特海峡是乌利克尤阿克岛。
      en: The northern island of the Uviqkut, more than 2,200 km², lying north of Hvaley in Siqqiqtuuq District of Uviqkut City. Seabird cliffs ring it, rising to a hundred metres on the west coast, and every spring and summer hundreds of thousands of puffins, guillemots, kittiwakes and gannets crowd the ledges to nest, one of the great seabird colonies of the Viking Islands. The Siqqiqtuuq Seabird Reserve covers most of the cliffs and the surrounding waters, and visitors keep to marked trails and hides; the reserve's lighthouse stands on the island's highest point and guides ships through the Uviqkut Strait. There are only a few small fishing villages, and the Uviqkut Causeway is the only road, running south to Hvaley over the Lundaholm Sound bridge, more than seventy kilometres long. Ulikjuaq Island lies to the north across the Uviqkut Strait.

