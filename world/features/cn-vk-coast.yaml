      en: An islet between Longship Island's stern, Aveline Island and Sigley, a little over 240 km², in Siglavik District of Siglavik City; the channels between the three islands meet here, and the southern end of Aveline Strait passes beside it. Pilot Isle lies to the north, where big ships bound in and out of the strait pick up and drop their pilots, and ships thread midstream between the three islands. The island is hilly, rising to just over 250 m, sheep graze its grassy slopes, and a few small fishing villages shelter in its coves. From its high ground you can see Longship's stern, the hills of south-western Port Aveline and the pine forests of Sigley at once.
  - id: nat_myqvrf
