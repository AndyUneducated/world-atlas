      en: An islet south-east of Sigley, a little over 240 km², lying between Sigley and Saint-Ondine Island in Siglavik District of Siglavik City. Broad shallow bays and sandbars surround it, the water mild and rich in nutrients, and the village farms oysters on the shallows, the best-known oyster beds in the islands. Siglavik oysters are plump and a signature dish in the restaurants of Longship and Port Aveline, and the yearly oyster festival is Siglavik's liveliest, when visitors come over by boat to eat oysters fresh from the water beside the beds. The island is low and flat, rising to less than 80 m, and at low tide the racks and mudflats stretch far out towards the sea.
  - id: nat_sfcte5
