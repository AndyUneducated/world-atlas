# Coastal landforms of the Viking Islands: islands, bays, capes and straits.
# The generator finds them in the coastline (pipeline/atlas/coast.py); each entry names the
# landform of `detect.kind` nearest to `detect.at_km` (design km, x east, y north).
# Unnamed landforms are listed in .cache/candidates-div_raat4g.json after a build.
features:
  # ── Main islands ─────────────────────────────────────────
  - id: nat_170rsf
    subtype: island
    status: generated
    detect: { kind: island, at_km: [148.2, 130.2] }
    names: { zh: 长船岛, en: Longship Island, art-x-viking: Langskipinsel, art-x-buckham: Isola Navelunga }
    notes:
      zh: 维京群岛最大的岛，面积四万一千多平方公里，狭长如一艘长船，船首朝东北指向北维京岛，船尾朝西南伸向暖泉岛与白帆岛之间的水道。龙骨山像倒扣的船龙骨纵贯全岛，主峰船首峰海拔一千二百九十多米，是岛上最高点。首府长船建在船首一带的长船湾畔，古城里有维京王厅遗址和长船博物馆，对岸的汇金区是群岛的金融中心，北岬有长船国际机场和群岛大学。维长高速和维长城际铁路以海底隧道直通北维京岛的维京港，长白、锚岛、锚舵、群岛和桅岛五条跨海高速从这里通往其他大岛，长船岛因此是整个群岛的交通中心。
      en: "The largest of the Viking Islands, more than 41,000 km², long and narrow like a longship, its bow pointing north-east at North Viking Island and its stern reaching south-west towards the waters between Warmspring and White Sail islands. The Keel Hills run its length like an upturned keel, and their main summit, Prow Peak at a little under 1,300 m, is the island's highest point. The capital, Longship, stands on Longship Bay near the bow: the old town has the Viking Hall Ruins and the Longship Museum, Goldmark across the bay is the islands' financial centre, and North Cape has Longship International Airport and the University of the Islands. The Viking Port–Longship Expressway and Intercity Railway run under the sea to Viking Port on North Viking Island, and five sea-crossing expressways lead from here to the other large islands, making Longship Island the hub of the whole archipelago."
  - id: nat_2p2v9m
    subtype: island
    status: generated
    detect: { kind: island, at_km: [206.8, 101.2] }
    names: { zh: 白帆岛, en: White Sail Island, art-x-viking: Weißsegelinsel, art-x-buckham: Isola Velabianca }
    notes:
      zh: 长船岛东南的大岛，面积三万六千四百多平方公里，在群岛中排第三，隔长约三百公里的白帆海峡与长船岛平行。帆影岭纵贯全岛中部，从海上望去如一面鼓满的白帆，岛名由此而来，最高峰帆影峰海拔一千五百二十多米，耸立在东端的帆港湾畔。岛的东北端是群岛第三大城市白帆，邮轮母港、免税城和老城帆城区沿海湾展开；东南岸的盐湾以海盐和海上风电闻名，渔港鱼市是全岛最大的鲜鱼市场；西南端的银鸥湾风平浪静，是度假胜地。长白跨海高速越过白帆海峡通往首府长船，白帆纵贯高速经盐湾南下到西南端的银鸥，桅岛跨海高速再从那里经桅岛通往暖泉岛。
      en: The large island south-east of Longship Island, more than 36,400 km², third in size among the islands, lying parallel to Longship across the 300 km White Sail Strait. Sailshadow Ridge runs along its middle and from the sea looks like a full white sail, which gave the island its name; its highest summit, Sailshadow Peak at just over 1,520 m, rises above Sail Harbour Bay at the eastern end. In the north-east is White Sail, the third city of the islands, whose cruise port, duty-free town and old town of Sail Town line the bay; Salt Bay on the south-east coast is known for sea salt and offshore wind, and the Fishing Harbour fish market is the island's largest; Silvergull Bay at the south-western end is calm water and a holiday favourite. The Longship–White Sail Sea Crossing bridges the strait to the capital, the White Sail Spine Expressway runs south by way of Salt Bay to Silvergull at the south-western end, and from there the Mast Island Sea Crossing continues by way of Mast Island to Warmspring.
  - id: nat_bcjvmn
    subtype: island
    status: generated
    detect: { kind: island, at_km: [101.8, 162.8] }
    names: { zh: 锚岛, en: Anchor Island, art-x-viking: Ankerinsel, art-x-buckham: Isola dell'Ancora }
    notes:
      zh: 长船岛西北的大岛，面积三万六千九百多平方公里，在群岛中仅次于长船岛，隔一百四十公里长的锚岛海峡与长船岛相望。锚链山纵贯全岛，主峰铁锚峰海拔两千零七十多米，是锚岛最高点，北坡挂着群岛唯一的山岳冰川锚链冰川；西岸峡湾深切。岛的南端两只「锚爪」西爪岬和东爪岬抱住锚湾，水深浪静，是群岛最好的天然良港，锚岛也由此得名。群岛第二大城市锚港就在锚湾畔，拥有群岛最大的集装箱港和造船基地；北部的松林市是大片松林和林场。锚岛跨海高速经潮湾、锚舵跨海高速经舵港与长船岛相连，锚岛纵贯高速则把南端的锚港与东北端的松林连成一线。
      en: The large island north-west of Longship Island, more than 36,900 km², second in size only to Longship and facing it across the 140 km Anchor Strait. The Anchor Chain Mountains run its length; their main summit, Iron Anchor Peak at just over 2,070 m, is the island's highest point and carries on its north face the Anchor Chain Glacier, the only mountain glacier in the islands. Fjords cut deep into the west coast. At the southern end the two "flukes", West Fluke and East Fluke, hold Anchor Bay between them, deep and calm, the finest natural harbour in the islands and the source of the island's name. Anchorhaven, the second city of the islands, stands on the bay with the largest container port and shipbuilding base in the archipelago, while Pinewood in the north is a land of pine forest and timber holdings. The Anchor Strait Crossing via Tidebay and the Anchor–Rudder Sea Crossing via Rudderhaven link it to Longship Island, and the Anchor Island Spine Expressway joins Anchorhaven in the south to Pinewood in the north-east.
  - id: nat_9ajbb1
    subtype: island
    status: generated
    detect: { kind: island, at_km: [62.2, 48.8] }
    names: { zh: 暖泉岛, en: Warmspring Island, art-x-viking: Warmquellinsel, art-x-buckham: Isola Fontecalda }
    notes:
      zh: 群岛西南端的圆形火山岛，面积近三万四千平方公里，是群岛第四座大岛。岛心是一座活火山暖泉火山，主峰火口峰海拔两千二百八十多米，是群岛最高峰，峰顶的暖泉冰帽终年不化，火口内终年冒着蒸汽；河流从火山向四面流入大海，暖河是群岛最长的河。火山的地热让全岛遍布温泉、喷气孔和地热田：东岸的温泉区有群岛最大的温泉度假村，黑沙区有黑沙滩和群岛最大的地热电站，南岸的硫磺湾以地热温室著称，西岸的岩港是矿业与地热港城，西端的落日岬以日落闻名。群岛跨海高速从岩港横贯全岛跨海通往长船岛，暖泉南环高速和环山公路环绕火山。
      en: "The round volcanic island at the south-western end of the archipelago, nearly 34,000 km², the fourth of the large islands. At its heart is Warmspring Volcano, an active volcano whose summit, Crater Peak at just over 2,280 m, is the highest point in the islands; the Warmspring Ice Cap never melts on its top, and steam rises from the crater all year. Rivers run from the volcano to the sea on every side, and the Warm River is the longest in the islands. Volcanic heat fills the island with hot springs, fumaroles and geothermal fields: Hot Springs District on the east coast has the islands' largest spa resort, Black Sand has its black beaches and the largest geothermal power station in the islands, Sulphur Bay on the south coast is known for its geothermal greenhouses, Rockhaven on the west coast is a mining and geothermal port, and Sunset Point at the western tip is famous for its sunsets. The Island Chain Expressway crosses the island from Rockhaven and bridges the sea to Longship Island, while the Southern Arc Expressway and the Volcano Road circle the volcano."

  # ── Medium islands ───────────────────────────────────────
  - id: nat_h86h79
    subtype: island
    status: generated
    detect: { kind: island, at_km: [136.2, 33.8] }
    names: { zh: 桅岛, en: Mast Island, art-x-viking: Mastinsel, art-x-buckham: Isola dell'Albero }
    notes:
      zh: 长船岛船尾以南的岛，面积近六千平方公里，是四座大岛之外最大的岛屿，坐落在暖泉岛与白帆岛之间的海面上。岛上长满笔直高大的松树，旧时为长船港的船坞供应桅木，桅岛和岛上的桅港市都由此得名。北端的桅港是城市中心和渔港，渔船在桅岛海峡和周边海域捕捞鳕鱼、鲱鱼和扇贝，东南外的牡蛎岛一带的牡蛎养殖远近闻名；南部是南桅区的松林和村庄。桅岛跨海高速以桅岛为中间支点，一段跨海通往长船岛船尾和暖泉，一段跨越桅岛海峡通往白帆岛的银鸥，桅岛公路穿过松林连接南桅与桅港，是岛上最有名的风景路线。
      en: The island south of Longship Island's stern, nearly 6,000 km², the largest in the archipelago after the four big islands, lying in the sea between Warmspring and White Sail. Tall, straight pines cover it and once supplied mast timber to the Longship yards, which gave both the island and its city, Masthaven, their names. Masthaven at the northern end is the town centre and fishing port, whose boats take cod, herring and scallops in Mast Strait and the surrounding waters, and the oyster beds around Oyster Isle to the south-east are known across the islands; the south is the pine forest and villages of South Mast District. The Mast Island Sea Crossing uses the island as its stepping stone, one leg crossing the sea to Longship's stern and Warmspring and the other spanning Mast Strait to Silvergull on White Sail Island, while the Mast Island Road through the pines between South Mast and Masthaven is the island's best-known scenic drive.
  - id: nat_0zxng2
    subtype: island
    status: generated
    detect: { kind: island, at_km: [232.8, 36.2] }
    names: { zh: 南星岛, en: Southstar Island, art-x-viking: Südsterninsel, art-x-buckham: Isola Stella del Sud }
    notes:
      zh: 群岛南部外海的岛，面积五千多平方公里，全岛属南星市。岛上的南星镇建在南岸，因夜空中明亮的南方星辰得名，传说维京航海者以岛顶上方的南天星辰定向。南岸绵长的沙滩和温和的海水使南星成为群岛最受欢迎的夏季度假地之一，南星海滨度假村和渔村沿海岸分布，岛民以渔业和海岛度假为生。南星公路自南星镇出发，翻过全岛到达北岸的南星渡轮码头，全长六十多公里，是岛上唯一的干线公路；渡轮从那里往返白帆岛的盐湾，是南星对外交通的唯一通道。岛的东南外海是灰海豹繁殖的海豹岛。
      en: An island in the southern outer waters of the archipelago, more than 5,000 km², all of it in Southstar City. The town of Southstar on the south coast takes its name from the bright southern stars, and Viking navigators are said to have steered by the stars above the island's summit. The long beaches and mild water of the south coast make it one of the islands' favourite summer holiday spots, and the Southstar Seaside Resort and fishing villages line the shore; islanders live by fishing and tourism. The Southstar Road runs from the town over the island to the Southstar Ferry Terminal on the north coast, a little over 60 km and the only main road on the island, and from there ferries cross to Salt Bay on White Sail Island, the island's only link with the outside. Off its south-eastern shore lies Seal Isle, where grey seals breed.
  - id: nat_43xwsq
    subtype: island
    status: generated
    detect: { kind: island, at_km: [22.8, 138.8] }
    names: { zh: 鲸岛, en: Whale Isle, art-x-viking: Walinsel, art-x-buckham: Isola Balena }
    notes:
      zh: 外屿最大的岛，面积五千一百多平方公里，是外屿市的主岛和中心。每年夏季，座头鲸、虎鲸和小须鲸在岛外洄游，在北岸的观鲸湾里觅食，观鲸船从鲸岛渡轮码头出发，几乎每次出海都能看到鲸鱼喷水和跃身；鲸岛观鲸中心是群岛的鲸类研究和科普机构，展出鲸鱼骨架、鲸歌录音和迁徙地图。岛上的渔村沿港湾分布，鱼干晾架和红色的渔屋是鲸岛的标志性景观，许多渔家兼营民宿和海鲜餐馆。渡轮从鲸岛通往白帆、锚港和长船，外屿跨海公路则经海雀岛旁的海雀水道跨海大桥北上，通往外屿的另一座大岛鸟崖岛。
      en: The largest of the Outer Isles, more than 5,100 km², the main island and centre of Outer Isles City. Every summer humpback, killer and minke whales pass offshore and feed in Whalewatch Bay on the north coast, and the boats that leave from the Whale Isle Ferry Terminal see whales blowing and breaching on almost every trip; the Whale Isle Whale Centre is the islands' institute for whale research and education, with skeletons, recordings of whale song and migration maps. Fishing villages line the harbours, and drying racks and red fishermen's houses are the island's signature sight; many fishing families also run guesthouses and seafood restaurants. Ferries run from here to White Sail, Anchorhaven and Longship, and the Outer Isles Causeway heads north over the Puffin Sound bridge past Puffin Isle to Bird Cliff Isle, the other large island of the group.
  - id: nat_n4g4mt
    subtype: island
    status: generated
    detect: { kind: island, at_km: [283.8, 109.8] }
    names: { zh: 晨光岛, en: Dawnlight Island, art-x-viking: Morgenlichtinsel, art-x-buckham: Isola dell'Aurora }
    notes:
      zh: 群岛东端的岛，面积三千六百多平方公里，是群岛最东的中等岛屿，与东侧的东极岛一起组成晨光市。岛上的晨光镇因每天最早迎来群岛的第一缕阳光而得名，清晨在海边看日出是游客必做的事。晨光岛与白帆岛之间是近三十公里宽的晨光海峡，海峡的滩涂是候鸟迁徙的重要停歇地，春秋两季鹬类、鸻类和雁鸭成群聚集。晨光公路的大半路段位于贴着滩涂延伸的晨光海峡跨海大桥上，桥下潮水自由进出，候鸟季节桥上禁止停车。渡轮从西岸的晨光渡轮码头往返白帆岛的灯塔区，日出旅游、海上风电和渔业是岛上的主要生计。
      en: An island at the eastern edge of the archipelago, more than 3,600 km², the easternmost of the medium-sized islands, forming Dawnlight City together with Eastmost Isle beside it. The town of Dawnlight is named for catching the islands' first sunlight each morning, and watching the sunrise from the shore is a must for visitors. Between Dawnlight and White Sail lies the Dawnlight Strait, nearly 30 km wide, whose mudflats are a major stopover for migrating birds; every spring and autumn waders, plovers, geese and ducks gather in flocks. Most of the Dawnlight Road runs on the low Dawnlight Strait bridge laid along the flats, with the tide flowing freely beneath, and stopping on it is banned in the bird season. Ferries leave the Dawnlight ferry terminal on the west coast for Lighthouse District on White Sail Island, and sunrise tourism, offshore wind and fishing are the island's livelihoods.
  - id: nat_g7hv2z
    subtype: island
    status: generated
    detect: { kind: island, at_km: [49.2, 221.8] }
    names: { zh: 鳕岛, en: Cod Island, art-x-viking: Dorschinsel, art-x-buckham: Isola del Merluzzo }
    notes:
      zh: 群岛西北外海的渔岛，面积三千一百多平方公里，与孤礁岛一起组成鳕港市，岛的北缘与孤礁岛、霜岛同在群岛的最北端。周围的冷水海域是鳕鱼的产卵场和洄游通道，每年冬末春初鳕鱼汛期，渔船倾巢而出，鳕港镇海边成排的木制鱼干架绵延数公里，鳕鱼在海风中风干两三个月，制成群岛最著名的特产风干鳕鱼。鳕港镇坐落在岛西岸的海湾里，港内停满拖网船和延绳钓船。鳕岛公路从镇子后方绕过晾晒场，横穿全岛到东岸的鳕港渡轮码头，冷藏货车把鱼货运上渡轮，再经锚岛的松林运往各地。南面隔着外屿海峡是鸟崖岛。
      en: The fishing island in the north-western outer waters, more than 3,100 km², forming Codhaven City with Lone Skerry; its northern shore, with Lone Skerry and Frost Isle, marks the northern limit of the archipelago. The cold waters around it are the spawning grounds and migration route of the cod, and in the cod season at the end of winter the whole fleet puts to sea; rows of wooden drying racks stretch for kilometres along the shore at Codhaven, where the fish dry in the sea wind for two or three months into stockfish, the islands' most famous product. The town lies in a bay on the west coast, its harbour packed with trawlers and longliners. The Cod Island Road skirts the drying grounds behind the town and crosses the island to the Codhaven Ferry Terminal on the east coast, where refrigerated lorries take the catch aboard for Pinewood on Anchor Island and beyond. Bird Cliff Isle lies to the south across the Outer Isles Strait.
  - id: nat_dvayg1
    subtype: island
    status: generated
    detect: { kind: island, at_km: [254.8, 146.8] }
    names: { zh: 风岛, en: Wind Isle, art-x-viking: Windinsel, art-x-buckham: Isola del Vento }
    notes:
      zh: 白帆岛东北的岛，面积两千三百多平方公里，与外海的哨岛一起组成风港市，是离北维京岛最近的中等岛屿之一。风岛海风终年不息，是群岛风力发电的主要基地：岛上的山脊排列着成片的陆上风机，外海还建有大型海上风电场，电力经海底电缆输往长船和白帆。风港镇坐落在岛北部的山谷里，是一座年轻的新兴小镇，许多住宅是为风电工程师和技术工人家庭新建的公寓。风岛公路自风港镇出发，沿风机林立的山脊到南岸的风港风电运维港，按运输超长叶片的要求设计，往返白帆的渡轮也在运维港停靠。山脊上的观景台是看日落和风机剪影的好地方。
      en: "The island north-east of White Sail Island, more than 2,300 km², forming Windhaven City with Sentinel Isle offshore, and one of the medium-sized islands nearest North Viking Island. The wind never stops here, and the island is the islands' main wind-power base: rows of onshore turbines line its ridges, a large wind farm stands offshore, and the power goes by subsea cable to Longship and White Sail. Windhaven, in a valley in the north, is a young and growing town, much of its housing new flats for the families of wind engineers and technicians. The Wind Isle Road runs from the town along the turbine-lined ridge to the Windhaven Wind Service Port on the south coast, built to carry extra-long blades, and the ferry to White Sail calls at the service port too. The viewpoint on the ridge is the place to watch the sunset behind the turbines."
  - id: nat_nwd97h
    subtype: island
    status: generated
    detect: { kind: island, at_km: [23.8, 196.8] }
    names: { zh: 鸟崖岛, en: Bird Cliff Isle, art-x-viking: Vogelklippeninsel, art-x-buckham: Isola Scogliera Uccelli }
    notes:
      zh: 外屿北部的岛，面积两千二百多平方公里，位于鲸岛以北，属外屿市鸟崖区。岛的四周是海鸟筑巢的悬崖，西岸的海崖高达百米，每年春夏，数十万只海鹦、海鸠、三趾鸥和北方塘鹅聚集在岩架上筑巢产卵，是维京群岛重要的海鸟繁殖地。鸟崖海鸟保护区覆盖全岛大部分海崖和周边海域，游客只能沿指定的步道和观鸟台观赏；保护区里的灯塔建在岛的最高处，为外屿海峡里的船只指引航向。岛上只有几座小渔村，外屿跨海公路是唯一的公路，向南经七十多公里长的海雀水道跨海大桥通往鲸岛；北面隔着外屿海峡是鳕岛。
      en: The northern island of the Outer Isles, more than 2,200 km², lying north of Whale Isle in Bird Cliff District of Outer Isles City. Seabird cliffs ring it, rising to a hundred metres on the west coast, and every spring and summer hundreds of thousands of puffins, guillemots, kittiwakes and gannets crowd the ledges to nest, one of the great seabird colonies of the Viking Islands. The Bird Cliff Seabird Reserve covers most of the cliffs and the surrounding waters, and visitors keep to marked trails and hides; the reserve's lighthouse stands on the island's highest point and guides ships through the Outer Isles Strait. There are only a few small fishing villages, and the Outer Isles Causeway is the only road, running south to Whale Isle over the Puffin Sound bridge, more than seventy kilometres long. Cod Island lies to the north across the Outer Isles Strait.

  # ── Small islands ────────────────────────────────────────
  - id: nat_d329td
    subtype: island
    status: generated
    detect: { kind: island, at_km: [199.8, 166.8] }
    names: { zh: 守望岛, en: Watch Isle, art-x-viking: Wachtinsel, art-x-buckham: Isola della Vedetta }
    notes:
      zh: 长船岛船首外的小岛，面积十五平方公里左右，是群岛已命名岛屿中最小的一座，位于北岬以东，属长船市北岬区，隔四公里宽的守望水道与长船岛相望。维京时代，人们在岛顶点燃烽火，预警从北方驶来的船只，岛名由此而来。如今维长高速的维京海底公路隧道从岛下的海底穿过，一条直线连接北维京岛的维京港与长船古城，车辆在海底行驶，海面上的守望岛依旧安静。岛上保留着烽火台的石基，最高处只有三十多米，从北岬一带的海岸可以望见它低伏在水道外的身影。
      en: An islet off Longship Island's bow, about 15 km² and the smallest of the named islands, lying east of North Cape in North Cape District of Longship City and facing Longship across the four-kilometre Watch Sound. In the Viking age a beacon lit on its top warned of ships approaching from the north, which gave it its name. Today the Viking Undersea Road Tunnel of the Viking Port–Longship Expressway passes beneath the seabed under the island, running in a straight line from Viking Port on North Viking Island to Longship's old town; the traffic flows under the sea while Watch Isle above stays quiet. The stone base of the beacon survives on its top, which is only just over 30 m high, and its low outline can be seen beyond the sound from the North Cape shore.
  - id: nat_37jgdq
    subtype: island
    status: generated
    detect: { kind: island, at_km: [130.2, 58.2] }
    names: { zh: 中流岛, en: Midway Isle, art-x-viking: Mittelinsel, art-x-buckham: Isola di Mezzo }
    notes:
      zh: 长船岛船尾、白帆岛与桅岛之间的小岛，面积两百四十多平方公里，属桅港市桅港区，三岛之间的航道在这里交汇，白帆海峡的南端也从岛旁经过。岛的北面是引水岛，进出白帆海峡的大船在这一带接送引航员，船只在三岛之间的水道中流穿行，中流岛因此得名。岛上地势起伏，最高处两百五十多米，草坡上牧放着羊群，几座小渔村散布在避风的海湾里。从岛的高处可以同时望见长船岛的船尾、白帆岛西南端的山岭和桅岛的松林。
      en: An islet between Longship Island's stern, White Sail Island and Mast Island, a little over 240 km², in Masthaven District of Masthaven City; the channels between the three islands meet here, and the southern end of White Sail Strait passes beside it. Pilot Isle lies to the north, where big ships bound in and out of the strait pick up and drop their pilots, and ships thread midstream between the three islands, which is how Midway Isle got its name. The island is hilly, rising to just over 250 m, sheep graze its grassy slopes, and a few small fishing villages shelter in its coves. From its high ground you can see Longship's stern, the hills of south-western White Sail and the pine forests of Mast Island at once.
  - id: nat_myqvrf
    subtype: island
    status: generated
    detect: { kind: island, at_km: [14.2, 228.2] }
    names: { zh: 孤礁岛, en: Lone Skerry, art-x-viking: Einsamer Schären, art-x-buckham: Scoglio Solitario }
    notes:
      zh: 群岛最西、也是最西北的无人小岛，面积一百四十平方公里左右，位于鳕岛外海，属鳕港市鳕港区。孤礁岛孤零零地立在外海，四周没有别的岛屿，岛名由此而来。岛上是裸露的礁石和草坡，最高处两百多米，礁石上的灯塔为渔船指引方向，海鸟在崖壁上栖息。周围的海域是鳕港渔民的传统渔场，鳕鱼汛期时，渔船常在孤礁岛附近作业，遇到风暴就到岛的背风面避风。
      en: The westernmost and north-westernmost islet of the archipelago, about 140 km² and uninhabited, lying off Cod Island in Codhaven District of Codhaven City. It stands alone in the open sea with no other island near, hence its name. It is bare rock and grassy slope rising to just over 200 m; a lighthouse on the rocks guides the fishing boats, and seabirds nest on its cliffs. The surrounding waters are the traditional grounds of the Codhaven fishermen, and in the cod season boats often work near Lone Skerry and shelter in its lee when a storm blows up.
  - id: nat_k3jb4e
    subtype: island
    status: generated
    detect: { kind: island, at_km: [170.2, 211.8] }
    names: { zh: 北门岛, en: Northgate Isle, art-x-viking: Nordtorinsel, art-x-buckham: Isola Porta Nord }
    notes:
      zh: 群岛北部的小岛，面积近两百平方公里，位于长船岛西北岸外，属长船市西岸区，是离北维京岛最近的岛屿之一。岛上的北门岛灯塔标出从北方进入群岛的航路，也是从北维京岛驶来的船只最先望见的灯光之一，「北门」之名由此而来。北门岛地势低平，最高处一百三十多米，岛上除灯塔外只有零星的牧场和渔屋。从长船西岸区的海滨公园望去，西北海面上的北门岛灯塔是西岸的标志，夏季傍晚，居民在海边看着灯塔亮起，夕阳沉入它身后的海面。
      en: An islet in the north of the archipelago, nearly 200 km², lying off the north-west shore of Longship Island in West Shore District of Longship City, and one of the islands nearest North Viking Island. The Northgate Lighthouse on it marks the way into the islands from the north and is among the first lights seen by ships coming from North Viking Island, hence the name "north gate". The island is low, rising to just over 130 m, and apart from the lighthouse has only a few pastures and fishermen's huts. From the seaside parks of West Shore the lighthouse on the north-western horizon is the district's emblem, and on summer evenings people on the shore watch it light up as the sun sets into the sea behind it.
  - id: nat_zr2zjt
    subtype: island
    status: generated
    detect: { kind: island, at_km: [120.2, 227.8] }
    names: { zh: 霜岛, en: Frost Isle, art-x-viking: Frostinsel, art-x-buckham: Isola del Gelo }
    notes:
      zh: 锚岛以北的无人岛，面积一百八十多平方公里，属松林市松林区，位于松湾外海，与孤礁岛、鳕岛同在群岛的最北端。霜岛每年冬季最早结霜，岛名由此而来，冬季常有海冰和霜雾笼罩。岛上是苔原、湿地和海鸟栖息地，全岛划为霜岛自然保护区，是观察北极狐和海鸟的好地方，与锚链冰川一起是松林最受欢迎的自然景点。保护区严格限制登岛人数，夏季有向导带领小船从松林镇出发，沿岸观察筑巢的海鸟。
      en: An uninhabited island north of Anchor Island, a little over 180 km², in Pinewood District of Pinewood City, lying off Pine Bay and, with Lone Skerry and Cod Island, at the northern limit of the archipelago. It is the first island to frost over each winter, which gave it its name, and in winter it is often wrapped in sea ice and frost fog. Tundra, wetland and seabird colonies cover it, and the whole island is the Frost Isle Nature Reserve, a good place to watch arctic foxes and seabirds; with the Anchor Chain Glacier it is Pinewood's most popular natural sight. Visitor numbers are strictly limited, and in summer guides take small boats out from the town of Pinewood to watch the nesting birds from offshore.
  - id: nat_eb28w4
    subtype: island
    status: generated
    detect: { kind: island, at_km: [16.2, 157.8] }
    names: { zh: 海雀岛, en: Puffin Isle, art-x-viking: Lundinsel, art-x-buckham: Isola delle Pulcinelle }
    notes:
      zh: 鲸岛东北的小岛，面积近两百平方公里，属外屿市鲸岛区，隔着三公里宽的海雀水道与鲸岛相望。每年夏季，数万只海雀和海鹦在岛上的草坡上挖洞筑巢，岛名由此而来，夏日的傍晚，成群的海鹦叼着小鱼从海上飞回巢穴。外屿跨海公路的海雀水道跨海大桥从岛旁经过，向北跨海七十多公里通往鸟崖岛，桥面设有观鲸平台。岛的北面就是鲸岛北岸的观鲸湾，夏季鲸鱼常在海雀岛与鲸岛之间的水道里觅食。
      en: An islet north-east of Whale Isle, nearly 200 km², in Whale Isle District of Outer Isles City, facing Whale Isle across the three-kilometre Puffin Sound. Every summer tens of thousands of auks and puffins dig their burrows in its grassy slopes, which gave it its name, and on summer evenings flocks of puffins fly home from the sea with fish in their beaks. The Puffin Sound bridge of the Outer Isles Causeway passes beside the island and runs more than seventy kilometres north across the sea to Bird Cliff Isle, with whale-watching platforms on the deck. Whalewatch Bay on the north coast of Whale Isle lies close by, and in summer whales often feed in the channel between Puffin Isle and Whale Isle.
  - id: nat_ra0qnz
    subtype: island
    status: generated
    detect: { kind: island, at_km: [51.2, 10.8] }
    names: { zh: 灰岛, en: Ash Isle, art-x-viking: Ascheinsel, art-x-buckham: Isola della Cenere }
    notes:
      zh: 暖泉岛南岸外的小岛，面积六十多平方公里，属硫磺湾市硫磺湾区，位于硫磺湾湾口外，与暖泉岛一起构成群岛的最南端。全岛覆盖着暖泉火山喷出的火山灰，地势低平，最高处七十多米，灰黑色的地面上只长着稀疏的草和苔藓，岛名由此而来。岛上没有居民，是海鸟和海豹的栖息地，从硫磺湾的海岸可以望见它低伏在海面上的灰色身影。研究人员常来岛上观察火山灰地面上植物和动物的定居过程。
      en: An islet off the south coast of Warmspring Island, a little over 60 km², in Sulphur Bay District of Sulphur Bay City, lying off the mouth of Sulphur Bay and, with Warmspring Island, at the southern limit of the archipelago. The whole island is covered in ash from Warmspring Volcano, low and flat at little more than 70 m, its grey-black ground bearing only sparse grass and moss, hence its name. No one lives there; it is home to seabirds and seals, and from the shore of Sulphur Bay its low grey shape can be seen lying on the sea. Researchers often visit to watch how plants and animals settle on the volcanic ash.
  - id: nat_vvd2md
    subtype: island
    status: generated
    detect: { kind: island, at_km: [101.8, 49.8] }
    names: { zh: 浮石岛, en: Pumice Isle, art-x-viking: Bimssteininsel, art-x-buckham: Isola della Pomice }
    notes:
      zh: 暖泉岛东岸外的小岛，面积一百平方公里左右，属暖泉市温泉区，隔着五公里宽的暖泉海峡与暖泉岛相望。浮石岛地势低平，最高处只有六十多米，岛上的海滩堆满了暖泉火山喷出的浮石，这种多孔的火山石轻得能浮在水面上，岛名由此而来。从温泉区的海边望去，浮石岛横在温泉湾外，是度假区海景的一部分；游客乘小船登岛，在灰白色的浮石滩上散步、捡拾浮石，再回到温泉度假村泡温泉。岛上没有常住居民，海鸟在礁石上栖息。
      en: An islet off the east coast of Warmspring Island, about 100 km², in Hot Springs District of Warmspring City, facing Warmspring across the five-kilometre Warmspring Strait. It is low and flat, rising only to just over 60 m, and its beaches are heaped with pumice thrown out by Warmspring Volcano, a porous stone light enough to float, which gave the island its name. Seen from the Hot Springs shore it lies across the mouth of Hot Springs Bay as part of the resort's sea view; visitors take small boats across to stroll the pale-grey pumice beaches and gather stones before returning to soak at the spa resort. No one lives there, and seabirds nest on the rocks.
  - id: nat_5zcers
    subtype: island
    status: generated
    detect: { kind: island, at_km: [99.8, 14.2] }
    names: { zh: 远望岛, en: Farsight Isle, art-x-viking: Fernsichtinsel, art-x-buckham: Isola Lungimirante }
    notes:
      zh: 群岛南端的小岛，面积两百六十多平方公里，位于暖泉岛东南外海，属暖泉市黑沙区。远望岛地势低平，最高处一百多米，四面是开阔的海天，没有山峦遮挡视线，因此建起了远望航天测控站。测控站的几面大型天线跟踪从北维京岛马斯林山发射的航天器，日夜监测在轨卫星和飞船，是马斯林山航天发射的重要测控站之一。岛上除测控站的职工外几乎没有居民，草坡和礁石上栖息着海鸟。晴朗的夜里，岛上的星空格外明亮。
      en: An islet at the southern end of the archipelago, a little under 270 km², lying off the south-east of Warmspring Island in Black Sand District of Warmspring City. It is low and flat, rising only to just over 100 m, with open sea and sky on every side and no mountains to block the view, which is why the Farsight Tracking Station was built here. Its large dishes follow spacecraft launched from Maslin Mountain on North Viking Island and track satellites and spacecraft in orbit day and night, one of the key tracking stations for the Maslin Mountain launches. Apart from the station staff hardly anyone lives on the island, and seabirds nest on its grass and rocks. On clear nights its stars are especially bright.
  - id: nat_bnz64a
    subtype: island
    status: generated
    detect: { kind: island, at_km: [185.8, 15.8] }
    names: { zh: 牡蛎岛, en: Oyster Isle, art-x-viking: Austerninsel, art-x-buckham: Isola delle Ostriche }
    notes:
      zh: 桅岛东南的小岛，面积两百四十多平方公里，位于桅岛与南星岛之间，属桅港市桅港区。岛的周围是大片浅湾和沙洲，海水温和、营养丰富，岛上的渔村在浅滩上养殖牡蛎，是群岛著名的牡蛎养殖场。桅港牡蛎肉质饱满，是长船和白帆餐馆的招牌菜，每年的牡蛎节是桅港最热闹的节日，游客乘船来到岛上，在养殖场旁品尝刚出水的生蚝。岛的地势低平，最高处不到八十米，退潮时养殖架和滩涂一直延伸到远处的海面。
      en: An islet south-east of Mast Island, a little over 240 km², lying between Mast Island and Southstar Island in Masthaven District of Masthaven City. Broad shallow bays and sandbars surround it, the water mild and rich in nutrients, and the village farms oysters on the shallows, the best-known oyster beds in the islands. Masthaven oysters are plump and a signature dish in the restaurants of Longship and White Sail, and the yearly oyster festival is Masthaven's liveliest, when visitors come over by boat to eat oysters fresh from the water beside the beds. The island is low and flat, rising to less than 80 m, and at low tide the racks and mudflats stretch far out towards the sea.
  - id: nat_sfcte5
    subtype: island
    status: generated
    detect: { kind: island, at_km: [258.2, 13.8] }
    names: { zh: 海豹岛, en: Seal Isle, art-x-viking: Robbeninsel, art-x-buckham: Isola delle Foche }
    notes:
      zh: 南星岛东南的无人岛，面积两百四十多平方公里，属南星市南星区。岛的礁石海岸是灰海豹的繁殖地，每年产仔季节，成百上千只海豹在礁石上产下雪白的幼崽，全岛划为海豹岛自然保护区。保护区严格限制人员登岛，产仔季节禁止船只靠近礁石，游客只能在远处的观察船上用望远镜观看。岛上的草坡和崖壁也是海鸟栖息的地方，研究人员每年在固定的观测点统计海豹和海鸟的数量。从南星镇乘观察船出海，往返半天就能看到海豹在礁石上晒太阳。
      en: An uninhabited island south-east of Southstar Island, a little over 240 km², in Southstar District of Southstar City. Its rocky shores are a breeding ground for grey seals, and each pupping season hundreds of seals give birth to white-coated pups on the rocks; the whole island is the Seal Isle Nature Reserve. Landing is strictly limited, boats may not approach the rocks during the pupping season, and visitors watch through binoculars from observation boats at a distance. Seabirds also nest on its grassy slopes and cliffs, and researchers count the seals and birds every year from fixed observation points. A half-day trip by observation boat from the town of Southstar is enough to see the seals basking on the rocks.
  - id: nat_bs1dbj
    subtype: island
    status: generated
    detect: { kind: island, at_km: [251.8, 82.2] }
    names: { zh: 鲱鱼岛, en: Herring Isle, art-x-viking: Heringsinsel, art-x-buckham: Isola delle Aringhe }
    notes:
      zh: 白帆岛东南外的小岛，面积两百八十多平方公里，属白帆市帆港区。岛上的鲱鱼渔村历史悠久，每年鲱鱼汛期，渔船在岛周围的海面撒网，渔村里的熏鱼房和腌鱼作坊昼夜忙碌，腌鲱鱼和熏鲱鱼是这里的传统特产。岛的地势低缓，最高处一百三十多米，草坡上散布着彩色的渔屋和晾网架。夏季常有游客从白帆乘船来岛上品尝新鲜的鲱鱼，跟随渔民出海体验捕鱼，渔家民宿也随之兴起。
      en: An islet off the south-east of White Sail Island, a little over 280 km², in Sail Harbour District of White Sail City. Its herring-fishing village is old, and in the herring season the boats cast their nets all around the island while the smokehouses and salting sheds work day and night; pickled and smoked herring are its traditional specialities. The island is low and gentle, rising only to a little over 130 m, with painted fishermen's houses and net racks scattered over the grassy slopes. In summer visitors come over by boat from White Sail to eat fresh herring and go out with the fishermen, and family guesthouses have grown up to take them in.
  - id: nat_v3sgfp
    subtype: island
    status: generated
    detect: { kind: island, at_km: [299.8, 61.8] }
    names: { zh: 东极岛, en: Eastmost Isle, art-x-viking: Ostendinsel, art-x-buckham: Isola Estrema }
    notes:
      zh: 群岛最东的小岛，面积三百多平方公里，位于晨光岛东侧，属晨光市晨光区。东极岛地势低平，最高处不到一百米，四周是开阔的外海，岛上只有一座灯塔和几户渔家，是群岛东端的标志。每天清晨，群岛的第一缕阳光从这里的海平线上升起，晨光岛的游客常乘小船登岛，在灯塔下看日出。岛的周围是渔民的传统渔场，海鸟在礁石和草坡上栖息。从东极岛向东，就是群岛之外的茫茫大洋。
      en: The easternmost islet of the archipelago, a little over 300 km², lying east of Dawnlight Island in Dawnlight District of Dawnlight City. It is low and flat, nowhere reaching a hundred metres, with open sea on every side; there is only a lighthouse and a few fishing families, and it marks the eastern end of the islands. Each morning the islands' first sunlight rises over the horizon here, and visitors to Dawnlight often take a small boat across to watch the sunrise beneath the lighthouse. The waters around it are traditional fishing grounds, and seabirds nest on its rocks and grassy slopes. East of it there is nothing but the open ocean beyond the islands.
  - id: nat_kt82ch
    subtype: island
    status: generated
    detect: { kind: island, at_km: [289.8, 151.8] }
    names: { zh: 哨岛, en: Sentinel Isle, art-x-viking: Wachposteninsel, art-x-buckham: Isola della Sentinella }
    notes:
      zh: 群岛东北外海的小岛，面积一百四十多平方公里，位于风岛外海，属风港市风港区。哨岛扼守从东方进入群岛的航路，山顶的哨岛雷达站是海事与气象雷达，日夜监视东方航路上的船只和天气，把信息传给群岛的海事和气象部门，岛名由此而来。岛的地势不高，最高处不到两百米，四周是陡峭的海岸，岛上还有海鸟栖息地。除雷达站的值守人员外，岛上几乎没有居民，补给船定期从风港运来物资。
      en: "An islet in the open sea north-east of the archipelago, a little over 140 km², lying off Wind Isle in Windhaven District of Windhaven City. It guards the way into the islands from the east: the Sentinel Isle Radar Station on its summit is a maritime and weather radar, watching shipping and weather on the eastern approaches day and night and passing what it sees to the islands' maritime and weather services, hence the name. The island is not high, rising to less than 200 m, with steep shores all round and seabird colonies. Apart from the radar crew hardly anyone lives there, and a supply boat brings stores from Windhaven at regular intervals."
  - id: nat_0j0p38
    subtype: island
    status: generated
    detect: { kind: island, at_km: [246.2, 114.8] }
    names: { zh: 灯塔岛, en: Lighthouse Isle, art-x-viking: Leuchtturminsel, art-x-buckham: Isola del Faro }
    notes:
      zh: 白帆岛东端外的小岛，面积三百多平方公里，属白帆市灯塔区。岛上的灯塔岛灯塔是一座老灯塔，为进出帆港湾的邮轮与渔船引航，与白帆岛上的白帆灯塔遥相呼应。灯塔岛与白帆岛之间隔着不到三公里宽的灯塔水道，是进出帆港湾的航道，大型邮轮从岛旁缓缓驶入白帆邮轮母港。夏季座头鲸和虎鲸经灯塔水道洄游，灯塔区观鲸码头的船只常在岛外看到鲸群。岛上草坡和礁石是海鸟栖息的地方，晴天时从灯塔下可以望见帆港湾和帆影峰。
      en: An islet off the eastern end of White Sail Island, a little over 300 km², in Lighthouse District of White Sail City. Its old Lighthouse Isle Light guides cruise ships and fishing boats in and out of Sail Harbour Bay and answers the White Sail Lighthouse on the main island. Lighthouse Sound, less than three kilometres wide, separates it from White Sail and is the fairway into the bay, and big cruise ships glide past the island into the White Sail Cruise Port. In summer humpbacks and killer whales pass through the sound, and the boats from Lighthouse District's whale-watching quay often find them off the island. Seabirds nest on its grassy slopes and rocks, and on a clear day you can see Sail Harbour Bay and Sailshadow Peak from the foot of the lighthouse.
  - id: nat_36qzhj
    subtype: island
    status: generated
    detect: { kind: island, at_km: [75.2, 101.8] }
    names: { zh: 潮汇岛, en: Tidemeet Isle, art-x-viking: Gezeiteninsel, art-x-buckham: Isola delle Maree }
    notes:
      zh: 锚岛南端外的小岛，面积两百二十多平方公里，属锚港市锚湾区，位于锚湾湾口。锚岛海峡的潮流与来自暖泉方向的潮流在岛旁交汇，岛名由此而来。潮汇岛像一道天然的屏障挡在湾口，使锚湾水深浪静，大型集装箱船和散货船可以全天候进出群岛最大的集装箱港锚港。锚岛纵贯高速、锚舵跨海高速和锚湾公路都从岛旁经过，岛上的灯标为进港船只导航。岛的高处是一片草坡，可以俯瞰锚湾的岸桥和来往的货轮。
      en: An islet off the southern end of Anchor Island, a little over 220 km², in Anchor Bay District of Anchorhaven City, lying at the mouth of Anchor Bay. The tides of Anchor Strait meet those coming from the direction of Warmspring beside it, hence its name. It stands across the mouth of the bay like a natural breakwater, keeping Anchor Bay deep and calm so that large container ships and bulk carriers can come and go in any weather at the Port of Anchorhaven, the largest container port in the islands. The Anchor Island Spine Expressway, the Anchor–Rudder Sea Crossing and the Anchor Bay Road all pass close by, and beacons on the island guide ships into port. Its high ground is grassy slope looking down on the quay cranes and freighters of the bay.
  - id: nat_yk9yaz
    subtype: island
    status: generated
    detect: { kind: island, at_km: [129.2, 66.8] }
    names: { zh: 引水岛, en: Pilot Isle, art-x-viking: Lotseninsel, art-x-buckham: Isola dei Piloti }
    notes:
      zh: 中流岛北面的小岛，面积五十多平方公里，位于银鸥湾湾口外，属银鸥市银鸥区。旧时港口引航员在这里等候，登上进出白帆海峡的大船，带它们穿过海峡里的浅滩和航道，岛名由此而来。岛上保留着一座老引水站和灯塔，如今引航员改从港口乘引航船出海，引水岛成了度假小岛，渡船把游客送到岛上野餐和观鸟。岛的地势低缓，最高处九十多米，从岛上可以望见银鸥湾里的点点白帆和白帆海峡中往来的大船。
      en: An islet north of Midway Isle, a little over 50 km², lying off the mouth of Silvergull Bay in Silvergull District of Silvergull City. Harbour pilots once waited here to board the big ships bound in and out of White Sail Strait and take them through its shoals and channels, hence its name. An old pilot station and lighthouse survive; today the pilots go out by pilot boat from the harbour, and Pilot Isle has become a holiday islet where ferries bring visitors to picnic and watch birds. It is low and gentle, rising to just over 90 m, and from it you can see the sails dotting Silvergull Bay and the big ships moving through White Sail Strait.

  # ── Bays ─────────────────────────────────────────────────
  - id: nat_zgv4r2
    subtype: bay
    status: generated
    detect: { kind: bay, at_km: [189.8, 149.2] }
    names: { zh: 长船湾, en: Longship Bay, art-x-viking: Langskipbucht, art-x-buckham: Baia Navelunga }
    notes:
      zh: 长船岛东岸的海湾，面积九十多平方公里，维京长船曾在此停泊，湾畔是长船古城，海湾和首府都由此得名。古城的城墙、教堂和石屋沿港湾和山坡层层排开，山顶是群岛最重要的考古遗址维京王厅遗址，长船博物馆收藏着出土的长船、兵器和金银器；每年夏季的长船节，复原的维京长船从港湾驶出，场面壮观。维京群岛领地政府就设在古城附近，长船站是首府的铁路枢纽，维长高速从北维京岛穿过海底，在古城区出地面。湾南是汇金区，玻璃塔楼与对岸的古城隔水相望，新旧长船在湾两岸交相辉映。
      en: A bay on the east coast of Longship Island, a little over 90 km², where the Viking longships once lay; the old town of Longship stands on its shore, and both bay and capital take their name from it. The walls, churches and stone houses of the old town climb in tiers from the harbour up the slopes, and on the hilltop are the Viking Hall Ruins, the most important archaeological site in the islands, whose longships, weapons and gold and silver are shown in the Longship Museum; at the Longship Festival each summer reconstructed longships sail out of the harbour in a spectacular show. The territorial government sits near the old town, Longship station is the capital's rail hub, and the Viking Port–Longship Expressway surfaces in Old Town after its run beneath the sea from North Viking Island. To the south lies Goldmark, whose glass towers face the old town across the water, old and new Longship on either shore.
  - id: nat_h3knsp
    subtype: bay
    status: generated
    detect: { kind: bay, at_km: [189.2, 136.2] }
    names: { zh: 汇金湾, en: Goldmark Bay, art-x-viking: Goldmarkbucht, art-x-buckham: Baia Marcoro }
    notes:
      zh: 长船湾以南的小海湾，面积六十多平方公里，属长船市汇金区，湾的东侧是伸向外海的金角。汇金区的玻璃塔楼环湾而立，离岸银行、信托与基金公司聚集，汇金证券交易所和群岛银行大厦是这里的地标，这一带是维京群岛的金融中心。湾畔修建了滨海长廊和游艇码头，从这里可以眺望北面古城的城墙和王厅遗址，夜晚塔楼的灯光倒映在湾水中，是首府最摩登的景色。东港港口高速以十七公里长的汇金高架桥经过湾畔，西接古城，东通东港。
      en: A small bay south of Longship Bay, a little over 60 km², in Goldmark District of Longship, with Gold Point reaching out to sea on its eastern side. The glass towers of Goldmark ring the bay, home to offshore banks, trust companies and funds, with the Goldmark Stock Exchange and the Islands Bank Tower as landmarks; this is the financial centre of the Viking Islands. A seafront promenade and marina line the shore, looking north to the walls of the old town and the ruins of the royal hall, and at night the lights of the towers are mirrored in the water, the capital's most modern view. The East Harbour Port Expressway passes the bay on the 17 km Goldmark Viaduct, linking the old town to the west with East Harbour to the east.
  - id: nat_1abejp
    subtype: bay
    status: generated
    detect: { kind: bay, at_km: [192.2, 169.8] }
    names: { zh: 守望湾, en: Watch Bay, art-x-viking: Wachtbucht, art-x-buckham: Baia della Vedetta }
    notes:
      zh: 长船岛船首南侧的海湾，面积一百八十多平方公里，属长船市北岬区，紧靠北岬，湾口外是守望岛。守望岛与长船岛之间四公里宽的守望水道，是从北方进出长船的航道，船只从这里绕过船首驶向长船湾。维京时代，守望岛顶的烽火预警北方来船，湾内的村落望见火光便会戒备，海湾和小岛都由此得名。如今维长高速的维京海底公路隧道从湾外的海底穿过，海面上依旧安静，湾岸是牧羊草场和零星的渔屋，从湾畔的山坡上可以望见守望岛上烽火台的石基。
      en: A bay on the south side of Longship Island's bow, a little over 180 km², in North Cape District of Longship, lying right beside North Cape with Watch Isle off its mouth. The four-kilometre Watch Sound between Watch Isle and Longship Island is the way in to Longship from the north, and ships round the bow here on their way to Longship Bay. In the Viking age a beacon on Watch Isle warned of ships from the north, and the villages on the bay would stand ready when they saw it, which gave both the bay and the island their names. Today the Viking Undersea Road Tunnel of the Viking Port–Longship Expressway runs beneath the seabed outside the bay while the surface stays quiet; sheep pastures and scattered fishermen's huts line the shore, and from the slopes above you can see the stone base of the beacon on Watch Isle.
  - id: nat_az5da5
    subtype: bay
    status: generated
    detect: { kind: bay, at_km: [190.8, 177.2] }
    names: { zh: 船首湾, en: Prow Bay, art-x-viking: Bugbucht, art-x-buckham: Baia di Prua }
    notes:
      zh: 长船岛船首尖端的海湾，面积一百一十多平方公里，属长船市北岬区，面向北维京岛。海湾就在船首岬旁，是长船岛离维京港最近的海岸，维长城际铁路的维京海底铁路隧道在船首岬出地面，以高架桥登陆，再经北岬区的地面线进入长船。湾内的海岸多是岩石和砾石滩，冬季北风从海峡上直灌入湾，浪大风急。船首岬上的观景台面朝开阔的海峡，可以俯瞰整个船首湾，晴天时海天一色，海鸟在湾外的礁石上盘旋。
      en: The bay at the very tip of Longship Island's bow, a little over 110 km², in North Cape District of Longship, facing North Viking Island. It lies beside Prow Point, the stretch of Longship's coast nearest Viking Port, where the Viking Undersea Rail Tunnel of the Viking Port–Longship Intercity Railway surfaces and comes ashore on a viaduct before running across North Cape on the surface into Longship. Its shores are mostly rock and shingle, and in winter the north wind drives straight in off the strait, raising heavy seas. The viewpoint on Prow Point faces the open strait and looks down over the whole bay; on a clear day sea and sky merge, and seabirds wheel over the skerries outside it.
  - id: nat_r2hpck
    subtype: bay
    status: generated
    detect: { kind: bay, at_km: [176.8, 173.2] }
    names: { zh: 北岬湾, en: North Cape Bay, art-x-viking: Nordkapbucht, art-x-buckham: Baia di Capo Nord }
    notes:
      zh: 长船岛船首西北侧的大湾，面积五百多平方公里，由北岬环抱，是长船岛西北岸最大的海湾，湾岸分属长船市北岬区和西岸区。群岛大学的主校区坐落在湾畔的山坡上，海洋学专业的师生常在湾里进行观测和实习。长船国际机场建在北岬的平地上，长船机场高速以十三公里长的北岬高架桥沿湾岸进入北岬，长船西北岸公路也沿海岸经西岸区到达这里。湾内水面开阔，西岸区一侧是连串的海滨公园、沙滩和自行车道，夏季傍晚居民在海边散步看日落，北岬一侧的山坡上仍有牧羊草场。
      en: "The large bay on the north-west side of Longship Island's bow, a little over 500 km², sheltered by North Cape and the largest bay on the island's north-west coast; its shores belong to North Cape and West Shore districts of Longship. The University of the Islands has its main campus on the hillside above it, and its oceanography students and staff often take their observations and fieldwork out on the bay. Longship International Airport stands on the flat land of North Cape; the Longship Airport Expressway follows the shore into the cape on the 13 km North Cape Viaduct, and the Longship North-West Shore Road also arrives along the coast through West Shore. The water is wide and open: on the West Shore side a chain of seaside parks, beaches and cycle paths draws people out on summer evenings to stroll and watch the sunset, while sheep still graze the slopes on the North Cape side."
  - id: nat_dw7pxt
    subtype: bay
    status: generated
    detect: { kind: bay, at_km: [241.2, 113.8] }
    names: { zh: 帆港湾, en: Sail Harbour Bay, art-x-viking: Segelhafenbucht, art-x-buckham: Baia Porto Vela }
    notes:
      zh: 白帆岛东端的深水大湾，面积五百五十多平方公里，是白帆市的海上门户。白帆邮轮母港就在湾内，邮轮码头、免税商业街和渡轮枢纽集中在帆港区的湾畔，渡轮从这里通往长船、暖泉、桅港和外屿。湾口外的灯塔岛和灯塔水道是进出海湾的航道，灯塔岛上的老灯塔为邮轮和渔船引航。帆港湾的海滨长廊是观赏邮轮进出港和日落的好地方，每当巨轮鸣笛起航，岸边总有人挥手送别；帆港邮轮高速把湾畔的码头与白帆机场和老城连在一起。
      en: The large deep-water bay at the eastern end of White Sail Island, a little over 550 km², White Sail's gateway to the sea. The White Sail Cruise Port lies within it, and the cruise terminal, duty-free shopping streets and ferry hub are gathered on the Sail Harbour District shore, with ferries to Longship, Warmspring, Masthaven and the Outer Isles. Lighthouse Isle and Lighthouse Sound off its mouth form the fairway in, and the old light on Lighthouse Isle guides cruise ships and fishing boats in. The seafront promenade is the place to watch the cruise ships come and go and the sun go down, and whenever a liner sounds its horn and sails there are always people on the shore waving it off. The Sail Harbour Cruise Expressway links the quays with White Sail Airport and the old town.
  - id: nat_ht8qd3
    subtype: bay
    status: generated
    detect: { kind: bay, at_km: [230.8, 122.2] }
    names: { zh: 灯塔湾, en: Lighthouse Bay, art-x-viking: Leuchtturmbucht, art-x-buckham: Baia del Faro }
    notes:
      zh: 帆港湾以北的小海湾，面积五十多平方公里，属白帆市灯塔区，湾畔是海滨别墅和白帆灯塔。灯塔区位于白帆岛东北端的海角，老灯塔、海滨别墅与观鲸码头构成区里的风景；每年夏季，座头鲸和虎鲸经灯塔湾和灯塔水道洄游，观鲸码头每天有多班观鲸船出海。湾内水面平静，沙滩和岩岸交错，别墅的花园一直延伸到海边，夏季是白帆人避暑的地方。白帆灯塔公路从帆港出发，沿海岸通往灯塔区，是白帆岛最美的海滨公路之一。
      en: A small bay north of Sail Harbour Bay, a little over 50 km², in Lighthouse District of White Sail City, lined with seaside villas and overlooked by the White Sail Lighthouse. Lighthouse District sits on the headland at the north-eastern end of White Sail Island, where the old lighthouse, the villas and the whale-watching quay make up the scene; every summer humpbacks and killer whales pass through Lighthouse Bay and Lighthouse Sound, and several whale-watching boats leave the quay each day. The water is calm, beaches and rocky shores alternate, and the villa gardens run down to the sea; in summer it is where White Sail people escape the heat. The White Sail Lighthouse Road follows the coast from Sail Harbour to Lighthouse District, one of the most beautiful seaside drives on the island.
  - id: nat_1q1ey6
    subtype: bay
    status: generated
    detect: { kind: bay, at_km: [140.8, 69.8] }
    names: { zh: 银鸥湾, en: Silvergull Bay, art-x-viking: Silbermöwenbucht, art-x-buckham: Baia dei Gabbiani }
    notes:
      zh: 白帆岛西南端的海湾，面积近三百平方公里，属银鸥市银鸥区，成群的银鸥在码头和渔船上空盘旋，银鸥市由此得名。湾内风平浪静，白色的沙滩和松林环抱的小海湾适合游泳、帆船和皮划艇，夏季湾里满是白帆；湾畔是度假住宅、海滨酒店和老渔港。湾口的引水岛上有引水站和灯塔，引航员在这里登上驶入白帆海峡的大船，渡船也把游客送到岛上野餐和观鸟。白帆纵贯高速和桅岛跨海高速在湾畔的城郊交会，帆影岭公路也从这里翻山通往帆城。银鸥湾的日落把海面染成金色，是白帆岛最有名的海滨景色之一。
      en: The bay at the south-western end of White Sail Island, nearly 300 km², in Silvergull District of Silvergull City; flocks of herring gulls wheel over its quays and boats and gave the city its name. The water is calm, and white beaches and small coves ringed by pines are ideal for swimming, sailing and kayaking, so that in summer the bay is full of sails; holiday homes, seaside hotels and the old fishing harbour line the shore. Pilot Isle at its mouth has a pilot station and a lighthouse, where pilots board the big ships bound up White Sail Strait, and boats also take visitors out to picnic and watch birds. The White Sail Spine Expressway and the Mast Island Sea Crossing meet on the edge of town, and the Sailshadow Ridge Road sets off from here over the mountains to Sail Town. Sunset over Silvergull Bay turns the water to gold, one of the best-known seaside views on the island.
  - id: nat_c4cftd
    subtype: bay
    status: generated
    detect: { kind: bay, at_km: [227.2, 82.2] }
    names: { zh: 盐湾, en: Salt Bay, art-x-viking: Salzbucht, art-x-buckham: Baia del Sale }
    notes:
      zh: 白帆岛东南岸的海湾，面积七十多平方公里，旧时在湾畔晒盐腌鱼，盐湾市由此得名。这里海水清澈、风大日照足，自维京时代起就以日晒和熬煮法生产海盐，湾岸铺开数十平方公里的盐田，夏季阳光下盐田像一面面镜子，传统作坊熬出的「盐湾花盐」是群岛餐桌上的珍品，盐田旁的海盐博物馆讲述着制盐的历史。湾外的海面上是海上风电场，盐湾港是风电场的运维基地。白帆纵贯高速以盐湾高架桥经过湾畔，盐湾海滨公路沿海岸经过盐田，连接渔港和望海的果园。
      en: "A bay on the south-east coast of White Sail Island, a little over 70 km², where salt was once panned to cure fish, and the source of Saltbay City's name. The water is clear, the wind strong and the sun plentiful, and sea salt has been made here by solar evaporation and boiling since the Viking age: tens of square kilometres of salt pans line the shore, shining like mirrors in the summer sun, the flaky Saltbay salt boiled in traditional works is prized on island tables, and the salt museum beside the pans tells the story. An offshore wind farm stands in the sea beyond the bay, and Saltbay harbour is its service base. The White Sail Spine Expressway passes the bay on the Saltbay Viaduct, its longest bridge, and the Salt Bay Coast Road runs along the shore past the salt pans between Fishing Harbour and the orchards of Seawatch."
  - id: nat_gd3pyt
    subtype: bay
    status: generated
    detect: { kind: bay, at_km: [71.8, 107.8] }
    names: { zh: 锚湾, en: Anchor Bay, art-x-viking: Ankerbucht, art-x-buckham: Baia dell'Ancora }
    notes:
      zh: 锚岛南端两只锚爪西爪岬与东爪岬之间的大湾，面积七百多平方公里，是群岛最大的海湾，水深浪静，湾口有潮汇岛屏障，自古就是群岛最好的天然良港。群岛第二大城市锚港因城市坐落在两只锚爪之间的锚湾而得名，湾内的锚港集装箱港是群岛最大的集装箱港，大型集装箱船和散货船可以全天候进出。锚岛纵贯高速以十四公里长的锚湾高架桥沿湾岸延伸，锚舵跨海高速从这里跨越锚岛海峡口通往长船岛的舵港，锚湾公路连接西爪和船厂两区。夜晚的锚湾灯火通明，岸桥和货轮的灯光倒映在湾水中。
      en: The great bay between the two flukes at the southern end of Anchor Island, West Fluke and East Fluke, a little over 700 km² and the largest bay in the islands. Deep and calm, with Tidemeet Isle sheltering its mouth, it has always been the finest natural harbour in the islands. Anchorhaven, the second city of the archipelago, is named for its place in Anchor Bay between the two flukes, and the Port of Anchorhaven within the bay is the largest container port in the islands, open to big container ships and bulk carriers in any weather. The Anchor Island Spine Expressway follows the shore on the 14 km Anchor Bay Viaduct, the Anchor–Rudder Sea Crossing sets off from here across the mouth of Anchor Strait to Rudderhaven on Longship Island, and the Anchor Bay Road links West Fluke with the Shipyard District. At night the bay blazes with light, the quay cranes and freighters mirrored in its water.
  - id: nat_6r8rng
