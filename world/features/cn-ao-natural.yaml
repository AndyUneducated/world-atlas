# Named natural features of the Arctic Ocean Territory.
# subtype follows OSM natural=* values. Geometry is produced by the generator
# (see world/generator/cn-ao.yaml); this file only holds identity and semantics.
# Names are Chinese, English and Tavrunaq (art-x-tavrunaq).
features:
  - id: nat_s1p5cz
    subtype: mountain_range
    status: generated
    names:
      zh: 苏瓦尔尤伊特山脉
      en: Suvvarjuit Mountains
      art-x-tavrunaq: Suvvarjuit
    notes:
      zh: 横贯大陆南部的山脉，在南岸背后东西绵延数百公里，跨越普拉苏瓦米乌特区、尼尔萨瓦克区、伊卢克萨特区、西卢阿苏瓦特生态保护区和皮瓦苏瓦区等多个区，最高峰是东段的陶武皮鲁克峰，海拔 2022 米。山脉把南岸的城市与内陆苔原隔开，努基高速、努阿高速、乌库利特高速和普拉苏瓦公路都以长段防雪棚翻越，西卢阿高速铁路以苏瓦尔尤伊特山脉隧道穿过。
      en: The range that runs across the south of the mainland, stretching for hundreds of kilometres from west to east behind the south coast through many districts, among them Pullasuvvamiut, the Nirsavaq District, Illuqsaat, the Silluasuvvat Nature Reserve and Pivasuvva; its highest summit is Mount Tauvvupirruk in the east, 2,022 m. It separates the south-coast cities from the inland tundra, and the Nuqattaaq–Kiluktuar, Nuqattaaq–Aqqanik and Mining expressways and the Pullasuvva Road all cross it under long snow sheds, while the Sillua High-Speed Railway passes through it in the Suvvarjuit Mountains Tunnel.
  - id: nat_1wpnhj
    subtype: mountain_range
    status: generated
    names:
      zh: 西尔米高地
      en: Sirmi Highlands
      art-x-tavrunaq: Sirmipukka
    notes:
      zh: "西尔米冰盖之下的高地，几乎全部在西尔米冰盖管理区内，最高点西尔米峰海拔 2506 米，是领地地势最高的山地。高地终年被冰盖覆盖，只有边缘的山峰露出冰面。冰面上露出的山峰被科考队叫作「冰上的岛」，夏天飞机在冰盖上空飞过，这些黑色的山尖是唯一能辨认方位的标记。"
      en: "The highlands beneath the Sirmi Ice Cap, almost entirely within the Sirmi Ice Cap Administration Zone; their highest point, Mount Sirmi at 2,506 m, makes them the highest ground in the territory. They lie under the ice all year, with only peaks at the edges showing through. The research teams call the peaks that break the surface \"islands in the ice\", and for planes crossing the ice cap in summer these dark summits are the only landmarks to steer by."
  - id: nat_9zwd86
    subtype: plateau
    status: generated
    names:
      zh: 普拉普卡高原
      en: Pullapukka Plateau
      art-x-tavrunaq: Pullapukka
    notes:
      zh: "图利瓦克市以东的高原，大部分在普拉普卡特生态保护区，南缘伸入图拉卡特区，最高点普卡皮鲁克峰海拔 1568 米，顶上覆盖着普卡西尔米冰帽。高原上风大雪深，西卢阿高速以长约 76 公里的普拉普卡高原防雪棚翻越，尼尔萨瓦克高速以普拉普卡高原隧道穿过。高原上的风吹得积雪像流水一样贴着地面移动，司机们说开在防雪棚里，能听见雪粒打在棚顶上沙沙作响。"
      en: "The plateau east of Tullivaq City, mostly in the Pullapukkat Nature Reserve with its southern edge in Tullakkat District; its highest point, Mount Pukkapirruk at 1,568 m, is capped by the Pukkasirmi Ice Cap. It is windy and deep in snow, and the Sillua Expressway crosses it under the 76 km Pullapukka Plateau Snow Shed while the Nirsavaq Expressway passes through it in the Pullapukka Plateau Tunnel. The plateau wind drives the snow across the ground like running water, and drivers say that inside the snow sheds you can hear it hissing against the roof."
  - id: nat_1ahtkg
    subtype: mountain_range
    status: generated
    names:
      zh: 西尔米基克山
      en: Sirmikiiq Mountains
      art-x-tavrunaq: Sirmikiiq
    notes:
      zh: "纵贯基库维克岛的山脉，全部在西尔米乌维特冰盖管理区内，主峰基克皮鲁克峰海拔 2236 米，山顶覆盖着基克西尔米冰帽，冰川从山上流入四周的海中。山脉的冰川从四面流进大海，夏天船只绕岛航行，能看到一条条冰川像白色的河流从山顶淌下来。"
      en: "The mountains that run the length of Kiiquviq Island, entirely within the Sirmiuviit Islands Ice Cap Administration Zone; their summit, Mount Kiiqpirruk, reaches 2,236 m under the Kiiqsirmi Ice Cap, and glaciers flow from them into the surrounding sea. Its glaciers flow into the sea on every side, and ships sailing round the island in summer see them pouring from the summits like white rivers."
  - id: nat_0hg79k
    subtype: ridge
    status: generated
    names:
      zh: 考卢卡特丘陵
      en: Qaulukkat Hills
      art-x-tavrunaq: Qaulukkat
    notes:
      zh: "伊卢克萨特区与伊卢克图克生态保护区之间的丘陵，最高处海拔近 1700 米。乌库利特重载铁路以长约 26 公里的考卢卡特丘陵隧道穿过，这是领地最长的隧道；乌库利特高速也以隧道穿过，考伊公路则以防雪棚翻越。丘陵上的苔原夏天开满小花，满载矿石的列车从隧道里钻出来时，常惊起一群在铁路边觅食的雷鸟。"
      en: "The hills between Illuqsaat District and the Illuqtuuq Nature Reserve, rising to nearly 1,700 m. The Ukkuliit Heavy-Haul Railway passes beneath them in the 26 km Qaulukkat Hills Tunnel, the longest tunnel in the territory; the Ukkuliit Expressway also tunnels through, while the Qaulujjuaq–Illuqsaat Road crosses them under a snow shed. In summer its tundra is covered with small flowers, and when an ore train emerges from the tunnel it often startles a flock of ptarmigan feeding by the line."
