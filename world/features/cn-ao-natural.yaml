# Named natural features of the Arctic Ocean Territory.
# subtype follows OSM natural=* values. Geometry is produced by the generator
# (see world/generator/cn-ao.yaml); this file only holds identity and semantics.
# Names are Chinese, English and Tavrunaq (art-x-tavrunaq).
features:
  - id: nat_s1p5cz
    subtype: mountain_range
    status: generated
    names:
      zh: 苏瓦尔尤伊特山脉
      en: Suvvarjuit Mountains
      art-x-tavrunaq: Suvvarjuit
    notes:
      zh: "苏瓦尔尤伊特山脉横贯大陆南部，在南岸背后东西绵延数百公里，跨越普拉苏瓦米乌特区、尼尔萨瓦克区、伊卢克萨特区、西卢阿苏瓦特生态保护区和皮瓦苏瓦区等多个区，最高峰是东段的陶武皮鲁克峰，海拔 2022 米，也是大陆上仅次于西尔米峰的第二高命名山峰。山脉西段顶着约 1.03 万平方公里的苏瓦西尔米冰原，最高点尼尔萨皮鲁克峰海拔 1950 米；山中还有普拉苏瓦米乌特区的帕利西尔米冰川、伊卢克萨特区的温纳西尔米冰川和陶武皮鲁克峰周围的陶武西尔米冰川。基卢克图阿尔河发源于山脉北麓，苏瓦西尔米冰原的融水则注入尼尔萨河和基卢克图阿尔河，一路向北流向北岸。\n山脉把南岸的城市与内陆苔原隔开，翻山的公路都要在防雪棚里走很长一段：乌库利特高速的苏瓦尔尤伊特山脉防雪棚长约 140 公里，是世界最长的防雪棚；努基高速的同名防雪棚长约 59 公里，努阿高速约 54 公里，普拉苏瓦公路约 38 公里。乌库利特高速从海拔 991 米的库马卡蒂克山口翻过，山口的服务区是矿工轮换途中歇脚的地方。\n南岸有暖流，山脉北面却是冷得多的苔原，司机们说进防雪棚前还看得见南岸港口的灯，出棚时眼前已是白茫茫的一片。驯鹿每年春秋沿山脚的谷地迁徙，穿过保护区的高速在迁徙季节限制夜间车流，牧民说山是驯鹿的围栏，谷口才是它们的门。"
      en: "The Suvvarjuit Mountains run across the south of the mainland, stretching for hundreds of kilometres from west to east behind the south coast through many districts, among them Pullasuvvamiut, the Nirsavaq District, Illuqsaat, the Silluasuvvat Nature Reserve and Pivasuvva; their highest summit is Mount Tauvvupirruk in the east, 2,022 m, which is also the second highest named peak on the mainland after Mount Sirmi. The western part of the range carries the Suvvasirmi Icefield of some 10,300 km², whose highest point is Mount Nirsapirruk at 1,950 m; the range also holds the Paalisirmi Glacier in Pullasuvvamiut, the Unnasirmi Glacier in Illuqsaat and the Tauvvusirmi Glacier around Mount Tauvvupirruk. The Kiluktuar River rises on the northern side of the range, and the meltwater of the Suvvasirmi Icefield feeds the Nirsa and Kiluktuar rivers, which flow north towards the north coast.\nThe range separates the south-coast cities from the inland tundra, and every road that crosses it runs a long way under snow sheds: the Suvvarjuit Mountains Snow Shed of the Ukkuliit Expressway, about 140 km, is the longest snow shed in the world; the shed of the same name on the Nuqattaaq–Kiluktuar Expressway is about 59 km, that of the Nuqattaaq–Aqqanik Expressway about 54 km and that of the Pullasuvva Road about 38 km. The Ukkuliit Expressway crosses at Qummakatiq Pass, 991 m, whose service area is where miners break their journey on the way to and from their shifts.\nThe south coast has its warm current, but north of the range lies much colder tundra; drivers say that going into the snow shed they can still see the lights of the south-coast ports, and coming out there is nothing but white. Reindeer migrate along the valleys at the foot of the range every spring and autumn, the expressways through the reserves limit night traffic in the migration season, and herders say the mountains are the reindeer's fence and the valley mouths their gates."
  - id: nat_1wpnhj
    subtype: mountain_range
    status: generated
    names:
      zh: 西尔米高地
      en: Sirmi Highlands
      art-x-tavrunaq: Sirmipukka
    notes:
      zh: "西尔米高地是西尔米冰盖之下的高地，几乎全部在西尔米瓦克自由邦的西尔米冰盖管理区内，最高点西尔米峰海拔 4014 米，是领地最高峰，西尔米高地因此也是领地地势最高的山地。高地终年被冰盖覆盖：西尔米冰盖面积约 2.95 万平方公里，平均海拔近 1900 米，是世界最大的冰盖，只有西尔米峰和高地边缘的山峰露出冰面。西尔米峰从平缓起伏的冰原上陡然拔起一千五百多米，是一座通体裹着冰雪的金字塔形尖峰，晴天时从冰盖边缘一百多公里外都能望见；冰盖上的鞍部西尔米卡蒂克山口海拔 2102 米，是领地最高的命名山口，没有道路通过。冰盖的融水向南汇成领地最长的河流西尔米河，东北缘的冰舌伸入西尔米卡拉湾，崩落的冰山从湾口漂向外海。\n冰盖管理区面积 72600 平方公里，常住只有约 1700 人。冰盖深处的西尔米冰芯钻探站钻取冰芯研究过去的气候，夏季才有飞机往返；西卢阿高速只沿冰盖东侧外缘的基岩修建，不上冰面，其中的西尔米冰盖隧道长约 14 公里，是领地最长的公路隧道。冰面上露出的山峰被科考队叫作「冰上的岛」，夏天飞机在冰盖上空飞过，这些黑色的山尖是唯一能辨认方位的标记；雪地车穿过鞍部时要沿途插一排彩色小旗作路标，回程再一面面收回。"
      en: "The Sirmi Highlands are the highlands beneath the Sirmi Ice Cap, almost entirely within the Sirmi Ice Cap Administration Zone of the Free State of Sirmivak; their highest point, Mount Sirmi at 4,014 m, is the highest peak in the territory, which makes them the territory's highest ground. They lie under the ice all year: the Sirmi Ice Cap, about 29,500 km² with an average elevation of nearly 1,900 m, is the largest ice cap in the world, and only Mount Sirmi and the peaks at the edges of the highlands break through it. Mount Sirmi rises abruptly more than 1,500 m above the gently rolling ice, a pyramid sheathed in snow and ice that can be seen on clear days from more than a hundred kilometres beyond the edge of the cap; the Sirmikatiq Col on the ice, at 2,102 m, is the highest named pass in the territory, crossed by no road. The cap's meltwater runs south as the Sirmi River, the territory's longest, and its north-eastern ice tongue reaches into Sirmiqalla Bay, where calved icebergs drift out to sea.\nThe administration zone covers 72,600 km² and has only about 1,700 residents. Deep in the ice the Sirmi Ice Core Station drills cores to study past climates, reached by plane only in summer; the Sillua Expressway keeps to the bedrock along the outer eastern edge of the cap and never goes onto the ice, its Sirmi Ice Cap Tunnel, about 14 km, being the longest road tunnel in the territory. The research teams call the peaks that break the surface \"islands in the ice\", and for planes crossing the cap in summer these dark summits are the only landmarks to steer by; snowcats crossing the col plant a line of coloured flags as markers and gather them up one by one on the way back."
  - id: nat_9zwd86
    subtype: plateau
    status: generated
    names:
      zh: 普拉普卡高原
      en: Pullapukka Plateau
      art-x-tavrunaq: Pullapukka
    notes:
      zh: "普拉普卡高原在图利瓦克市以东，大部分在普拉普卡特生态保护区，南缘伸入图拉卡特区，最高点普卡皮鲁克峰海拔 1568 米，顶上覆盖着约 1100 平方公里的普卡西尔米冰帽，这是大陆上最小的命名冰川。普卡皮鲁克峰四周平坦，冰帽从这里向四面铺开，东缘伸进尼尔萨图维特生态保护区。高原北岸是陶武卡拉湾，西侧是图利卡拉湾，西海岸的坎尼昆纳尔岬冬季积雪一直堆到海边；图利基卢克河发源于高原，流经图拉卡特区和图利亚利维克区入海，是图利亚利维克区的水源。\n高原上风大雪深，暴风雪来时能见度几乎为零。西卢阿高速以长约 76 公里的普拉普卡高原防雪棚翻越，这是这条世界最长的极地高速公路上最长的一段防雪棚；尼尔萨瓦克高速从图利亚利维克区出发，以长约 1.3 公里的普拉普卡高原隧道穿过高原，再向北翻进普拉苏瓦米乌特区的山地。冬季的冷风从高原吹过图利卡拉湾，图利瓦克一带的地名多带着塔夫鲁纳克语的 tulli「冷」。\n高原上的风吹得积雪像流水一样贴着地面移动，司机们说开在防雪棚里，能听见雪粒打在棚顶上沙沙作响。到了夏天，有经验的徒步者能在一天之内绕冰帽走一圈，冰帽边缘常能看到雪兔留下的脚印。"
      en: "The Pullapukka Plateau lies east of Tullivaq City, mostly in the Pullapukkat Nature Reserve with its southern edge in Tullakkat District; its highest point, Mount Pukkapirruk at 1,568 m, is capped by the Pukkasirmi Ice Cap of about 1,100 km², the smallest named glacier on the mainland. The ground around Mount Pukkapirruk is flat, and the ice cap spreads from it in every direction, its eastern edge reaching into the Nirsatuvvit Nature Reserve. Tauvvuqalla Bay lies on the plateau's northern shore and Tulliqalla Bay to the west, and at Cape Qannikunnar on the west coast the winter snow piles up right to the sea; the Tullikiluk River rises on the plateau and flows through Tullakkat and Tullijaalivik districts to the sea, supplying Tullijaalivik's water.\nThe plateau is windy and deep in snow, and in a blizzard visibility falls almost to nothing. The Sillua Expressway crosses it under the 76 km Pullapukka Plateau Snow Shed, the longest snow shed on the longest polar expressway in the world; the Nirsavaq Expressway sets out from Tullijaalivik and passes through the plateau in the 1.3 km Pullapukka Plateau Tunnel before climbing north into the mountains of Pullasuvvamiut. The winter wind blows off the plateau across Tulliqalla Bay, and many place names around Tullivaq carry the Tavrunaq tulli, \"cold\".\nThe plateau wind drives the snow across the ground like running water, and drivers say that inside the snow sheds you can hear it hissing against the roof. In summer experienced walkers can circle the ice cap in a day, often finding mountain-hare tracks along its edge."
  - id: nat_1ahtkg
    subtype: mountain_range
    status: generated
    names:
      zh: 西尔米基克山
      en: Sirmikiiq Mountains
      art-x-tavrunaq: Sirmikiiq
    notes:
      zh: "西尔米基克山纵贯基库维克岛，全部在西尔米瓦克自由邦的西尔米乌维特冰盖管理区内。基库维克岛面积约 5.7 万平方公里，是领地第二大岛，山脉从岛的北部延伸到南部，南北两段各顶着一座冰帽：北段的主峰基克尔尤阿克峰海拔 2356 米，是西尔米乌维特群岛的最高峰，顶上是约 6000 平方公里的乌维克西尔米冰帽；南段的基克皮鲁克峰海拔 2236 米，顶上是基克西尔米冰帽。领地的雪线只有 1250 米左右，两段山顶都远在雪线之上，冰川从山上向四面流进大海，北缘的冰川直入北冰洋。山名里的 sirmi 意为「冰」；两座主峰都以獠牙为名，基克皮鲁克峰尖峭的山形像露出冰面的獠牙，后来测出的北面那座更高，便叫作基克尔尤阿克峰，意为「大獠牙」。\n山脉远在海上，南段的基克皮鲁克峰离最近的公路也有近 300 公里，平常只有冰山观测站的工作人员和夏季的科考队来往，夏天也有邮轮专程前来观赏冰川。船只绕岛航行时，能看到一条条冰川像白色的河流从山顶淌下来，冰崖崩落时溅起几层楼高的水花。冰山观测站给每座从这里崩落的大冰山编号建档，一直追踪到它化掉为止，南岸的渔民和船长听完每天的冰山预报，才决定往哪边开。"
      en: "The Sirmikiiq Mountains run the length of Kiiquviq Island, entirely within the Sirmiuviit Ice Administration Zone of the Free State of Sirmivak. Kiiquviq, about 57,000 km², is the territory's second largest island, and the range stretches from its north to its south, each half capped with ice: in the north the summit, Mount Kiiqrjuaq at 2,356 m, the highest peak of the Sirmiuviit Islands, lies under the Uviqsirmi Ice Cap of some 6,000 km²; in the south Mount Kiiqpirruk, 2,236 m, lies under the Kiiqsirmi Ice Cap. With the territory's snowline at only about 1,250 m, both halves rise far above it, and glaciers flow from the mountains into the sea on every side, those of the northern edge straight into the Arctic Ocean. The sirmi in the name means \"ice\"; both main summits are named for tusks: the sharp form of Mount Kiiqpirruk looks like a tusk breaking through the ice, and when the peak to the north was later measured higher it was called Mount Kiiqrjuaq, \"great tusk\".\nThe range lies far out at sea, Mount Kiiqpirruk in the south nearly 300 km from the nearest road, and the only comings and goings are the staff of the iceberg station and summer research teams, though cruise ships also come in summer to see the glaciers. Ships sailing round the island see them pouring from the summits like white rivers, and when an ice cliff calves it throws up spray several storeys high. The iceberg station numbers and files every large berg that breaks off here and tracks it until it melts, and the fishermen and captains of the south coast decide their course only after hearing the daily iceberg forecast."
  - id: nat_ce7yk1
    subtype: mountain_range
    status: generated
    names:
      zh: 皮鲁克尔尤伊特山脉
      en: Pirrukrjuit Mountains
      art-x-tavrunaq: Pirrukrjuit
    notes:
      zh: "皮鲁克尔尤伊特山脉纵贯皮鲁克尔尤阿克岛，全部在西尔米瓦克自由邦的皮鲁库维特生态保护区内，是北方群岛最高的山脉，山名由 pirruk「峰」和表示「大的」复数后缀 -rjuit 组成，意思是「群大峰」。皮鲁克尔尤阿克岛面积约 13.2 万平方公里，是领地最大的岛屿，山脉从西向东横贯全岛，分成东、中、西三片山群，中间隔着低矮的山口，每一片都在 3000 米以下。主峰卡拉克皮鲁克峰海拔 2917 米，在岛的中部，是北方群岛的最高峰，在领地仅次于大陆上的西尔米峰。这里在北纬 80 度以北，雪线比大陆低三百米：宽阔的中段几乎整片埋在约 2.5 万平方公里的卡拉克西尔米冰原之下，这是世界第二大冰川；东段的贾利皮鲁克峰海拔 2477 米，顶着贾利西尔米冰川；西段的帕卡皮鲁克峰海拔 2052 米，顶着帕卡西尔米冰川。\n山脉只对持许可证的科考队和登山队开放，夏季包机从西尔米卡尔维克飞来，降落在岛上的冰川跑道，登山营地只在永昼的几个月里有人。三片山群性格各不相同：东段正对北冰洋的风，峰顶常年飘着雪旗；西段的山脊被冰川切成一段段锯齿，帕卡皮鲁克峰的名字就是「碎峰」；中段则是一整片白，只有几座山尖露出冰面。向导们说，翻过一道低山口就像换了一座山，背包里的装备也得跟着换一套。"
      en: "The Pirrukrjuit Mountains run the length of Pirrukrjuaq Island, entirely within the Pirrukuviit Nature Reserve of the Free State of Sirmivak, the highest mountains in the northern islands; the name joins pirruk, \"peak\", to the plural suffix -rjuit, \"great ones\", and means something like \"the great peaks\". Pirrukrjuaq, about 132,000 km², is the largest island in the territory, and the range crosses it from west to east in three massifs, eastern, central and western, divided by low cols and each below 3,000 m. The summit, Mount Kallaaqpirruk at 2,917 m in the middle of the island, is the highest peak of the northern islands and second in the territory only to Mount Sirmi on the mainland. North of 80°N the snowline lies 300 m lower than on the mainland: the broad central massif is almost wholly buried under the Kallaaqsirmi Icefield of some 25,000 km², the second largest glacier in the world; in the east Mount Jaalipirruk, 2,477 m, carries the Jaalisirmi Glacier, and in the west Mount Pakkapirruk, 2,052 m, carries the Pakkasirmi Glacier.\nThe range is open only to research and climbing parties with permits; summer charters fly in from Sirmiqarvik to land on a glacier runway on the island, and the climbing camps are staffed only in the months of the midnight sun. The three massifs each have a character of their own: the east faces the wind off the Arctic Ocean, with snow banners streaming from its summits all year; the ridges of the west are cut by the glaciers into broken saw-teeth, and Mount Pakkapirruk's name means \"broken peak\"; the centre is one unbroken white, with only a few summits showing above the ice. Crossing a low col, the guides say, is like arriving at a different mountain, and the gear in your pack has to change with it."
  - id: nat_0hg79k
    subtype: ridge
    status: generated
    names:
      zh: 考卢卡特丘陵
      en: Qaulukkat Hills
      art-x-tavrunaq: Qaulukkat
    notes:
      zh: "伊卢克萨特区与伊卢克图克生态保护区之间的丘陵，最高处海拔近 1700 米。乌库利特真空磁悬浮重载铁路以长约 21 公里的考卢卡特丘陵隧道穿过，这是领地最长的隧道；乌库利特高速也以隧道穿过，考伊公路则以防雪棚翻越。丘陵上的苔原夏天开满小花，在管道边觅食的雷鸟早已习惯了管道里无声驶过的列车，只有管道上的灯带亮起来时，才会抬头看一眼。"
      en: "The hills between Illuqsaat District and the Illuqtuuq Nature Reserve, rising to nearly 1,700 m. The Ukkuliit Vacuum Maglev Heavy-Haul Railway passes beneath them in the 21 km Qaulukkat Hills Tunnel, the longest tunnel in the territory; the Ukkuliit Expressway also tunnels through, while the Qaulujjuaq–Illuqsaat Road crosses them under a snow shed. In summer its tundra is covered with small flowers, and the ptarmigan feeding beside the tube have long since got used to the trains passing silently inside it; they look up only when the light strip along the tube comes on."
