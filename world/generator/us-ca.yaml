  urban_terrace_slope_deg: 18
  wetland_max_elev_m: 20
  wetland_wetness: 3.0
  farm_max_elev_m: 250
  farm_max_slope_deg: 3
  farm_reach_km: 40
  treeline_m: 3300
  treeline_aspect_m: 200
  rock_above_treeline_m: 300
  rock_slope_deg: 33
  dry_zones:
