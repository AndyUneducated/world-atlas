# A few metros only: the basin, the border port, the capital and the Bay, whose driverless trains run on timetable with nobody aboard.
metro:
  spacing_km: 1.4
  cities:
    - city: div_w1vh1a   # 失落天使市
      names: { zh: 失落天使地铁, en: Lost Angeles Metro, es: Metro de Los Ángeles Perdidos }
      lines:
        - district: div_jqddbd   # 破产中心区
          axis: 0
          notes:
            zh: "失落天使地铁 1 号线全长约 8.1 公里，设 7 座车站，全在破产中心区，从东头的贝里站向西，经友谊大街、共和路、失落天使警察局总部、彗星和干河大街，到西头的亿万岛路站。全市三条地铁线各在一个区里，彼此不相交，也没有换乘站；1 号线是穿过老市中心的那一条。设计时速 100 公里，DC 1500 V 架空接触网供电，6 辆编组 B 型车，CBTC 信号，GoA4 全自动无人驾驶。\n破产中心区 22 万人，摩天楼、市政厅和几座老剧院都在这里，可写字楼的空置率过了一半，楼下的人行道上是绵延十几个街区的帐篷城。线上最要紧的一站是失落天使警察局总部站，出站三百多米就是市民叫作「玻璃堡」的总部大楼，每周分局长联席会议那天，站口停满各个分局颜色的警车。彗星站离再就业提示词学院不远，早上九点以前，失业的司机、客服和会计从这里出站，去上「再就业提示词课程」。高峰时段的乘客早已不是白领，而是数据机房的值班员、自动仓库的维修工和去市政厅门口排队办事的人。\n夜里不少无家可归的人在站厅里避寒，地铁公司为此装过一套人工智能「驱离系统」，它算了一个月，结论是驱离的成本高于开放的成本，于是站厅的灯现在整夜亮着。从贝里站到亿万岛路站，地面上开车常常要堵四十分钟，坐地铁只要十几分钟，本地人说这是失落天使唯一不堵的东西。"
            en: "Lost Angeles Metro Line 1 runs about 8.1 km with 7 stations, all in Downturn District, from Berg at its eastern end west through Friendship Boulevard, Republic Road, Lost Angeles Police Headquarters, Comet and Arroyo High Street to Billionaire Island Road at its western end. Each of the city's three metro lines lies within a single district; they do not cross and there are no interchanges, and Line 1 is the one through the old downtown. It has a design speed of 100 km/h, DC 1500 V overhead line, six-car B-type trains, CBTC signalling and fully driverless GoA4 operation.\nDownturn District has 220,000 people and holds the skyscrapers, City Hall and several old theatres, but more than half its office space stands empty and the pavements below are a tent city stretching a dozen blocks. The line's most important stop is Lost Angeles Police Headquarters station: a little over 300 metres from its exit stands the headquarters building that people call the Glass Fort, and on the day of the weekly meeting of precinct chiefs the station entrance is lined with patrol cars in every precinct's colours. Comet station is not far from the Re-employment Prompt Academy, and before nine each morning laid-off drivers, call-centre staff and accountants come out of it on their way to \"re-employment prompt courses\". The rush-hour riders are long since not office workers but the night staff of data halls, the maintenance crews of automated warehouses and people going to queue for paperwork at City Hall.\nAt night many homeless people shelter from the cold in the ticket halls. The metro company once installed an AI \"dispersal system\" to deal with this; after a month of calculation it concluded that dispersing them cost more than letting them stay, and the ticket-hall lights now stay on all night. Driving from Berg to Billionaire Island Road often means forty minutes in traffic, while the metro takes a little over ten, and locals say it is the one thing in Lost Angeles that never jams."
        - district: div_16m2n3   # 好莱怪区
          axis: 0
          notes:
            zh: "失落天使地铁 2 号线全长约 8.4 公里，设 7 座车站，全在好莱怪区，从东南的青岛站向西北，经剧院大街、好莱怪无人片场、苔原路、鹈鹕大街和脱离岛路，到西北端的估值山脉路站。它与 1 号线、3 号线都不相交，乘客要换线只能出站，坐公交或机器人出租车去另一个区。车辆和信号与全州的地铁一样：设计时速 100 公里，DC 1500 V 架空接触网，6 辆编组 B 型车，CBTC 信号，GoA4 全自动无人驾驶。\n好莱怪区 28 万人，是影视业的老家，山坡上那排巨大的白色字母从车窗里就看得见。好莱怪无人片场站离片场大门不到五百米，剧院大街站在老剧院一带，星光大道的二维码地砖就铺在站口外。每天清早，去片场排队「被扫描」的人从这两站涌出来：试镜要的不再是演技，而是一张能被模型反复授权的脸。傍晚收工以后，配音演员和群众演员又坐 2 号线回家，车厢里常有人对着手机，查自己的声音今天被模型用了几次、收到了多少版税。\n2 号线的报站声音是向一位老配音演员按次授权的，每播放一次他就能收到一笔很小的版税，算下来他靠这条地铁挣的钱，比演了一辈子电影还多。站名里有好几个和本区毫无关系：脱离岛远在自治州东北的海上，估值山脉在北边两百公里开外，苔原路附近连一片像样的草地都没有，游客常以为这些站是给电影搭的布景。"
            en: "Lost Angeles Metro Line 2 runs about 8.4 km with 7 stations, all in Hollyweird District, from Qingdao in the south-east north-west through Theatre High Street, Hollyweird Unmanned Studios, Tundra Road, Pelican Boulevard and Secession Island Road to Sierra Valuation Road at its north-western end. It does not meet Line 1 or Line 3, so passengers who want to change lines must leave the station and take a bus or a robotaxi to another district. Its trains and signalling are the same as every metro in the state: a design speed of 100 km/h, DC 1500 V overhead line, six-car B-type trains, CBTC signalling and fully driverless GoA4 operation.\nHollyweird District, with 280,000 people, is the old home of the film industry, and the row of giant white letters on the hillside can be seen from the train windows. Hollyweird Unmanned Studios station is less than 500 metres from the studio gates, and Theatre High Street station is in the old theatre quarter, with the QR-code paving of the Walk of Fame right outside its exit. Early every morning the people going to queue at the studios to \"be scanned\" pour out of these two stations: auditions no longer call for acting, only a face that a model can license again and again. After work in the evening, voice actors and extras ride Line 2 home, and there is often someone in the carriage checking on a phone how many times a model used their voice that day and how much it paid in royalties.\nThe voice that announces the stations on Line 2 is licensed per use from an old voice actor, who earns a tiny royalty every time it plays; by his reckoning he has made more from this metro line than from a lifetime of films. Several station names have nothing to do with the district: Secession Island lies far off in the sea in the state's north-east, the Sierra Valuation is more than two hundred kilometres to the north, and there is not even a decent patch of grass near Tundra Road, so visitors often take these stations for film sets."
        - district: div_3rwj4m   # 搁浅滩区
          axis: 1
          notes:
            zh: "失落天使地铁 3 号线全长约 16.8 公里，设 13 座车站，是全州最长的地铁线，全在搁浅滩区，从北头的晨星站一路向南，经闭环大道、期权路、苏打饼海大道、退出角大街、算力大道、分家角大道、渡鸦、算力街、烧钱大街、索尔街和利伯塔德大街，到南端的搁浅滩港站。全市三条线各在一个区里，3 号线和另外两条都不相交。车辆和系统同全州的地铁：设计时速 100 公里，DC 1500 V 架空接触网，6 辆编组 B 型车，CBTC 信号，GoA4 全自动无人驾驶。\n搁浅滩区是失落天使的港区，52 万人，3 号线把北边的住宅区和南边的港口串成一线。终点搁浅滩港站离港区只有四百米，离索尔街站一公里多是市民叫作「码头帮」的港口分局。集装箱码头早已全部无人化，从前每天成千上万的码头工人坐这条线上班，如今早高峰的乘客是执法局检查站的警员、港口分局的人和去码头边摆摊的小贩。码头工人罢工的那几年，3 号线是工会的「流动会议室」，纠察队员在车厢里排班，从北头坐到南头正好开完一次会。\n南端的站台望得见港外排队的货轮，船员在甲板上种菜养鸡，周末区里的人坐 3 号线到终点，再划小船去船上买鸡蛋。海滩边那艘老邮轮改成的旅馆在站厅里挂了广告：「坐到终点，再往前一步就是大海。」站名大多与港区无关，算力大道站和算力街站之间隔着两站，第一次来的人常常坐过头。"
            en: "Lost Angeles Metro Line 3 runs about 16.8 km with 13 stations, the longest metro line in the state, all in Long Beached District, from Morning Star at its northern end south through Feedback Loop Avenue, Stock Option Road, Saltine Sea Avenue, Exit Point Boulevard, Compute Avenue, Point Split Avenue, Raven, Compute Street, Burn Rate High Street, Sol Street and Libertad High Street to Port of Long Beached at its southern end. Each of the city's three lines lies within one district, and Line 3 crosses neither of the others. Its trains and systems are those of every metro in the state: a design speed of 100 km/h, DC 1500 V overhead line, six-car B-type trains, CBTC signalling and fully driverless GoA4 operation.\nLong Beached District is the port district of Lost Angeles, with 520,000 people, and Line 3 strings the housing in the north and the port in the south together. The terminus, Port of Long Beached, is only 400 metres from the port, and a little over a kilometre from Sol Street station stands the Harbour Precinct, the police station people call \"the Dock Gang\". The container terminals have long been fully automated; thousands of dockers once rode this line to work every day, and today's rush-hour riders are officers of the agency's inspection station, men from the Harbour Precinct and hawkers heading for the quays. In the years of the dockers' strike Line 3 was the union's \"mobile meeting room\": pickets were rostered in the carriages, and a ride from one end to the other was exactly long enough for a meeting.\nFrom the southern platforms you can see the freighters queuing outside the port, where crews grow vegetables and keep chickens on deck, and at weekends people from the district ride Line 3 to the end of the line and row out to the ships to buy eggs. The old cruise liner turned hotel on the beach advertises in the ticket hall: \"Ride to the end of the line, and one more step is the sea.\" Most station names have nothing to do with the port, and with two stations between Compute Avenue and Compute Street, first-time riders often go too far."
    - city: div_3mdaee   # 圣遣返市
      names: { zh: 圣遣返地铁, en: San Deportes Metro, es: Metro de San Deportes }
      lines:
        - district: div_ad0sg9   # 签证区
          axis: 0
          notes:
            zh: "圣遣返地铁 1 号线是圣遣返的第一条地铁，全长约 10.4 公里，设 8 座车站，全线都在签证区的建成区里，从东南端的协同路站向西北，经赋能路、葡萄藤路、海狮大街、科拉松路、脚本丘陵路和提示词路，到西北端的上海站。站距约 1.4 公里，和全州其他地铁一样，设计时速 100 公里，DC 1500 V 架空接触网供电，6 辆编组的 B 型车，CBTC 信号，GoA4 全自动无人驾驶。全市两条地铁线互不相交，没有换乘站，1 号线也不与铁路相接。\n签证区是全市的市中心，42 万人住在港湾北岸，执法局总部大楼是全城最高的建筑。科拉松路站离总部大楼只有七百米左右，早上八点前后，在这一站下车的大半是执法局的文员、翻译和律师，挂着工牌的人群一出站就分成两股，一股走向总部大楼，一股走向对面街上替被拘押者家属办手续的律师楼。海狮大街站靠近港湾边的老煤气灯街区，夜里酒吧散场的人坐末班车回家，车厢的广告屏上滚动着执法局「举报有奖」的二维码。西北端的上海站离圣遣返国际机场一公里多，拖着行李箱的游客在这里下车，再走一段路去航站楼。\n车厢广播用英语和西班牙语报站，每到一站还要加一句「请随身携带有效证件」。列车上没有司机，每节车厢的门边却都装着一台证件扫描仪，乘客说这是全州唯一「车上没人开、证件有人查」的地铁。上海站附近并没有什么和上海有关的东西，外地游客爱在站名牌下拍照，本地人也说不清这个名字是怎么来的。"
            en: "San Deportes Metro Line 1 was the city's first metro line. It runs about 10.4 km with 8 stations, all within the built-up area of Visa District, from Synergy Road at its south-eastern end north-west through Empowerment Road, Vineyard Road, Sea Lion High Street, Corazón Road, Javascript Hills Road and Prompt Road to Shanghai at its north-western end. Stations are about 1.4 km apart and, like every other metro in the state, it has a design speed of 100 km/h, DC 1500 V overhead line, six-car B-type trains, CBTC signalling and fully driverless GoA4 operation. The city's two metro lines do not meet, so there is no interchange, and Line 1 does not connect with any railway either.\nVisa District is the city centre, home to 420,000 people on the north shore of the harbour, and the agency's headquarters tower is the tallest building in town. Corazón Road station is only about 700 metres from the tower, and around eight in the morning most of the people getting off there are the agency's clerks, interpreters and lawyers; the crowd with lanyards splits in two as it leaves the station, one stream heading for the tower and the other for the law offices across the street that handle paperwork for detainees' families. Sea Lion High Street station is close to the old gaslamp quarter by the harbour, and at night people leaving the bars take the last train home while the carriage screens scroll the agency's \"rewards for reporting\" QR code. Shanghai station, at the north-western end, is a little over a kilometre from San Deportes International Airport, and tourists with suitcases get off here and walk the rest of the way to the terminal.\nAnnouncements are made in English and Spanish, and at every stop they add \"Please carry valid identification.\" The trains have no drivers, yet every carriage has an ID scanner beside its doors, and passengers say it is the only metro in the state where \"nobody drives, but somebody checks your papers.\" There is nothing connected with Shanghai anywhere near Shanghai station; visitors like to take photos under the station sign, and locals cannot say where the name came from."
        - district: div_jmthr1   # 边界线区
          axis: 0
          notes:
            zh: "圣遣返地铁 2 号线全长约 14 公里，设 11 座车站，全线在边界线区的建成区里，大致东西走向：东头是上坡站，往西经光明街、裁员大街、日落街、杭州、钟楼、亿万岛大道、帕斯大道、敏捷大道和团结大道，到西头的约翰森站。它比 1 号线长三分之一多，车站也多三座，是全市最长的地铁线，两条线之间没有换乘站。车辆和系统与全州其他地铁相同：设计时速 100 公里，DC 1500 V 架空接触网，6 辆编组 B 型车，CBTC 信号，GoA4 全自动无人驾驶。\n边界线区 38 万人，大多是州移民与海关执法局的雇员和他们的家属，2 号线因此被本地人叫作「换班线」。早上六点、下午两点和晚上十点前后，拘押中心、检查站和训练营换班，列车上挤满穿制服的人；其余时候，车厢里多是推着婴儿车的家属和放学的孩子。钟楼站在全线正中，站外几条街是快餐店、制服店和修理无人机的小铺子，是区里最热闹的地方；裁员大街站附近住着不少被执法局裁掉的前雇员，他们在站口摆摊，卖二手的靴子和对讲机。\n2 号线的站厅里贴满了执法局的招募海报，口号是「保卫我们的海岸线」。有一年市政府办「遣返马拉松」，把一段赛道改到了 2 号线沿线，地铁那天加开了班次，结果来坐车看比赛的人比跑步的人还少。约翰森站的名字常被人当成某位执法局长官的姓，执法局专门发过声明说局里没有这个人，可站里的乘客照样这么猜。"
            en: "San Deportes Metro Line 2 runs about 14 km with 11 stations, all within the built-up area of Borderline District, roughly east to west: Uphill at the eastern end, then westward through Bright Street, Layoff High Street, Sunset Street, Hangzhou, Clock Tower, Billionaire Island Avenue, Paz Avenue, Agile Avenue and Unity Avenue to Johansen at the western end. It is more than a third longer than Line 1 and has three more stations, making it the city's longest metro line; the two lines have no interchange. Its trains and systems are the same as on every other metro in the state: a design speed of 100 km/h, DC 1500 V overhead line, six-car B-type trains, CBTC signalling and fully driverless GoA4 operation.\nBorderline District has 380,000 people, most of them employees of the State Immigration and Customs Enforcement Agency and their families, which is why locals call Line 2 \"the shift line\". Around six in the morning, two in the afternoon and ten at night, when the detention centre, the checkpoints and the training camp change shifts, the trains fill with people in uniform; the rest of the time the carriages hold mostly family members with pushchairs and children coming home from school. Clock Tower is the midpoint of the line, and the streets outside it, lined with fast-food places, uniform shops and little drone-repair stalls, are the liveliest in the district; around Layoff High Street live many former employees the agency has let go, who set up stalls at the station entrance selling second-hand boots and walkie-talkies.\nThe ticket halls of Line 2 are covered in the agency's recruiting posters, with the slogan \"Defend our coastline.\" One year the city moved part of the course of its \"Deportation Marathon\" onto the route of Line 2 and the metro ran extra trains that day; in the end fewer people came by train to watch than ran the race. Johansen is often taken for the surname of some senior agency officer, and the agency has issued a statement that it has nobody of that name, but passengers go on guessing all the same."
    - city: div_91r9b3   # 萨克拉钱托市
      names: { zh: 萨克拉钱托地铁, en: Sacramoney Metro, es: Metro de Sacramoney }
      lines:
        - district: div_ymeec8   # 游说区
          axis: 0
          notes:
            zh: "萨克拉钱托地铁 1 号线是首府唯一的地铁线，全长约 11.3 公里，设 9 座车站，全在游说区的建成区里，大致东西走向：东头是王家站，往西经干河街、对齐路、付费墙山脉路、团结大街、西湾、弗洛雷斯路和昆明，到西头的春晓站。设计时速 100 公里，DC 1500 V 架空接触网供电，6 辆编组 B 型车，CBTC 信号，GoA4 全自动无人驾驶。\n游说区是首府的中心，33 万人，州议会大厦、州长办公厅和各厅局都在这里。付费墙山脉路站离州务卿办公厅不到五百米，离州长办公厅七百多米，离州议会大厦一公里左右，是议会开会日最挤的一站；对齐路站离州长官邸七百多米，团结大街站离说客大厦也是七百多米。乘客大多是公务员、议员助理和游说公司的职员。到了周五傍晚议会散会，列车反倒空了，因为议员和说客都开车去了木屋区的湖边。\n本地人管这条线叫「游说专线」：说客们发现在车厢里「偶遇」议员比在筹款餐厅订位便宜得多，于是早高峰常有人在付费墙山脉路站的站台上来回踱步，等某位议员的那班车。州议会讨论过要不要设「无游说车厢」，提案起草到一半，起草提案的说客自己先下了车。站名多半与政治无关，对齐路算是唯一应景的一个，议员们说它提醒人「投票前先对齐一下立场」。"
            en: "Sacramoney Metro Line 1 is the capital's only metro line, about 11.3 km long with 9 stations, all within the built-up area of Lobbyton District, running roughly east to west: Wangjia at the eastern end, then westward through Arroyo Street, Alignment Road, Paywall Range Road, Unity High Street, West Cove, Flores Road and Kunming to Spring Dawn at the western end. It has a design speed of 100 km/h, DC 1500 V overhead line, six-car B-type trains, CBTC signalling and fully driverless GoA4 operation.\nLobbyton District is the heart of the capital, with 330,000 people, and holds the State Capitol, the Office of the Governor and the state departments. Paywall Range Road station is less than 500 metres from the Office of the Secretary of State, a little over 700 metres from the Office of the Governor and about a kilometre from the Capitol, and is the busiest station on sitting days; Alignment Road station is a little over 700 metres from the Governor's Mansion, and Unity High Street station likewise a little over 700 metres from Lobbyist Tower. Most riders are civil servants, legislators' aides and lobbying-firm staff. On Friday evenings, when the legislature rises, the trains are empty instead, because the legislators and lobbyists have all driven off to the lakeside in Chalet District.\nLocals call it \"the lobbying line\": lobbyists have found that \"bumping into\" a legislator in a carriage is far cheaper than booking a table at a fundraising restaurant, so at the morning peak there is often someone pacing the platform at Paywall Range Road, waiting for a particular legislator's train. The legislature once debated a \"lobby-free carriage\", and halfway through drafting the bill, the lobbyist drafting it got off first. Most station names have nothing to do with politics; Alignment Road is the only apt one, and legislators say it reminds them to \"get aligned before the vote\"."
    - city: div_35n7cb   # 贝叶斯市
      names: { zh: 贝叶斯地铁, en: Bayesian Metro, es: Metro Bayesiano }
      lines:
        - district: div_0vf1b0   # 先验区
          axis: 0
          notes:
            zh: "贝叶斯地铁 1 号线是贝叶斯唯一的地铁线，全长约 3.3 公里，只有三座车站，全在先验区的老城里，从东头的奇点路站向西经丁香站到书院街站。它是世界上第二短的地铁线，只比最短的那条长一百米。按州里的规划标准，只有首府和五十万人以上的城市才修地铁，贝叶斯只剩 4.5 万人，是全州唯一的例外：地铁是城里人多的时候规划的，修好时人已经走了大半。技术和别的地铁一样，设计时速 100 公里，DC 1500 V 架空接触网，6 辆编组 B 型车，CBTC 信号，GoA4 全自动无人驾驶，只是列车加速到一半就该减速进站了。\n先验区是海湾半岛北端的老城，1.8 万人，坡道很陡，老缆车由机器人驾驶，维多利亚式的彩色木屋大多空着，由机器人维持原样。书院街站离加利福尼亚州最高法院七百多米，偶尔有律师坐地铁去法院，可大法官们大多在家视频开庭；离奇点路站一公里多是闭源智能的总部园区，园区员工上下班坐公司的无人车，很少下到站台。\n无人驾驶的列车照着时刻表来回跑，车厢里常常一个人也没有。市政董事会为「世界第二」开过三次会，讨论要不要把终点站往回挪一百米好拿下第一，最后决定先让人工智能评估一下。评估报告至今没有交上来，据说模型算出挪站之后车站离得太近，乘客会改为步行，客流将「下降到负数」。"
            en: "Bayesian Metro Line 1 is Bayesian's only metro line, about 3.3 km long with just three stations, all in the old town of Prior District, running from Singularity Road in the east west through Lilac to Academy Street. It is the second-shortest metro line in the world, only a hundred metres longer than the shortest. Under the state's planning standards only the capital and cities of more than half a million people get a metro; Bayesian, with only 45,000 people left, is the one exception in the state, because the line was planned when the city was full and by the time it opened most of the people had gone. Its technology is the same as on other metros, a design speed of 100 km/h, DC 1500 V overhead line, six-car B-type trains, CBTC signalling and fully driverless GoA4 operation, except that the trains are only halfway through accelerating when it is time to brake for the next station.\nPrior District is the old town at the northern tip of the bay peninsula, home to 18,000 people, with steep streets, old cable cars driven by robots and painted Victorian wooden houses, most of them empty and kept just as they were by robots. Academy Street station is a little over 700 metres from the Supreme Court of California, and now and then a lawyer takes the metro to court, though the justices mostly hold hearings by video from home; a little over a kilometre from Singularity Road station is the ClosedAI Headquarters campus, whose staff travel in the company's driverless cars and seldom come down to the platform.\nThe driverless trains shuttle back and forth to the timetable, often with nobody aboard. The city's Municipal Board has met three times over being \"second in the world\", debating whether to move the terminus back a hundred metres to take first place, and in the end decided to have an AI assess it first. The assessment has still not been delivered; the model is said to have worked out that if the station moved, the stations would be so close that passengers would walk instead, and ridership would \"fall below zero\"."

# Facts the build checks and reports; a failed check is printed as a warning.
