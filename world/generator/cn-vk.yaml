    div_zg05xa: [88.8, 135.7]    # 锚港市
    div_3zqdra: [79.3, 158.1]    # 雾湾市
    div_bbmwea: [116.5, 195]     # 松林市
    # 暖泉岛：东部的暖泉，南部的硫磺湾，西部的岩港
