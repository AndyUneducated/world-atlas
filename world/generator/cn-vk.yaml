    div_5rbg50: { style: mixed, mix: { houses: 2.2, park: 1.2 } }                                # 望海区
    div_vk1835: { style: mixed, mix: { industrial: 2.2, houses: 0.8 } }                          # 暖河区：河口港区
    div_a2n8cw: { style: planned, mix: { industrial: 3.0, slabs: 0.4, houses: 0.2, towers: 0.2 } } # 阿克斯维克区：集装箱港
