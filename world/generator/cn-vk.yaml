# Procedural generator parameters for the Viking Islands.
#
# Same conventions as cn-nv.yaml: positions and lengths in design kilometres inside a local
# equal-area frame centred on frame.origin_lonlat, at the same scale as North Viking Island.
# South-west of North Viking Island: Longship Island's bow lies ~120 km from Viking Port and no
# coast comes within 100 km of the other territory. Four main islands of 34–42k km² (Longship,
# White Sail, Anchor, Warmspring), seven medium islands and two dozen small ones.
territory: div_raat4g
seed: 23
frame:
  origin_lonlat: [-1.68, 56.96]
  size_km: [320, 240]
  scale: 2.8284  # same as North Viking Island: one design km is 2.83 real km

land:
  # Gaussian lobes: [cx, cy, rx, ry, rotation_deg, weight]
  lobes:
    # four main islands
    - [146.5, 128.5, 72, 28, 45, 1.0]     # 长船岛：船首朝东北指向维京港
    - [196, 94, 62, 29, 28, 1.0]          # 阿夫琳岛
    - [94, 160, 60, 30, 58, 1.0]          # 阿克斯岛
    - [62, 46, 41, 38.6, 0, 1.0]          # 暖泉岛：圆形火山岛
    # medium islands
    - [22, 140, 20, 13, 70, 1.0]          # 瓦莱岛
    - [24, 196, 13, 10, 30, 1.0]          # 西基克图克岛
    - [52, 222, 21, 9, 5, 1.0]
    - [232, 36, 21, 12.6, 15, 1.0]
    - [140, 30, 20, 13, -10, 1.0]
    - [286, 112, 17, 12.4, 60, 1.0]
    - [256, 148, 14, 10, 20, 1.0]
    - [191, 187, 4.5, 3.5, 0, -0.5]       # 不留船首外的礁石：与北维京岛的海岸保持 100 km 以上
    # small islands
    - [14, 228, 3, 2.2, 0, 1.2]           # 艾因谢尔岛
    - [290, 152, 3.5, 2.5, 30, 1.2]
    - [300, 62, 4, 3, 0, 1.2]
    - [258, 14, 3.5, 2.5, -20, 1.2]
    - [186, 16, 4, 2.5, 30, 1.2]
    - [100, 14, 3.5, 2.5, 0, 1.2]
    - [170, 212, 3, 2.5, 0, 1.2]
    - [126, 154, 3, 2.2, 0, 1.2]
    - [104, 82, 3.5, 2.5, 10, 1.2]
    - [16, 158, 3, 2.2, 0, 1.2]
    - [252, 82, 3, 2.5, 0, 1.2]
    - [120, 228, 3, 2.2, 0, 1.2]
    - [182, 132, 3, 2.2, 0, 1.2]
    - [172, 118, 2.5, 2, 0, 1.2]
  coast_noise: { amplitude: 0.08, scale_km: 40, octaves: 7, detail_amplitude: 0.07, detail_scale_km: 6 }
  # Straits between the main islands, cut like fjords: [path, width_km, depth].
  fjords:
    - [[[85, 100], [128, 150], [158, 187]], 3, 1.2]      # 阿克斯岛—长船岛
    - [[[124, 77], [168, 110], [206, 139]], 3, 1.2]      # 长船岛—阿夫琳岛
    - [[[78, 94], [96, 76], [115, 57]], 3, 1.2]          # 长船岛—暖泉岛
    - [[[50, 150], [70, 145]], 1.2, 0.8]                 # 阿克斯岛西岸的峡湾
    - [[[66, 205], [82, 192]], 1.2, 0.8]
    - [[[222, 62], [212, 76]], 1.2, 0.8]                 # 阿夫琳岛东南岸的峡湾

terrain:
  max_elevation_m: 2600
  ridges:
    - { feature: nat_bb9whq, path: [[118, 100], [146, 127], [175, 157]], height_m: 450, width_km: 9 }   # 谢尔海姆山
    - { feature: nat_1kngjx, path: [[62, 47], [62.5, 47.5]], height_m: 3200, width_km: 10 }             # 暖泉火山
    - { feature: nat_kdza0d, path: [[161, 75], [196, 93], [231, 113]], height_m: 550, width_km: 8 }     # 卡洛韦岭
    - { feature: nat_9bt7gf, path: [[76, 130], [94, 160], [112, 190]], height_m: 1300, width_km: 10 }   # 锚链山
  # City-centre lowlands on the harbours: Longship, Anchorhaven, Sail Harbour, Hot Springs
  plains:
    - [186, 146, 12, 0.75]
    - [74, 112, 9, 0.7]
    - [245, 112, 6, 0.7]
    - [97, 55, 7, 0.6]

hydrology:
  river_min_drainage_km2: 25
  river_candidate_km2: 150
  estuary_km2: 700
  named_rivers: []

coast:
  mainland: false        # an archipelago: every landmass is an island with its own capes and straits
  island_min_km2: 0.8
  bay_close_km: 5
  bay_min_km2: 6
  cape_open_km: 2.5
  cape_min_prominence_km: 1.5
  strait_max_gap_km: 14
  match_radius_km: 10

relief:
  peak_min_elev_m: 600
  peak_min_prominence_m: 150
  pass_min_elev_m: 400
  snowline_m: 2200
  snowline_aspect_m: 300
  glacier_max_slope_deg: 42

# Cool-temperate maritime islands: lowland forest and farmland, moorland above the treeline,
# ice only on the summit of Warmspring Volcano.
landcover:
  urban_density_per_km2: 4500   # flat land is scarce on the islands: denser, taller towns than North Viking Island
  urban_terrace_slope_deg: 22
  wetland_max_elev_m: 80
  wetland_wetness: 2.4
  farm_max_elev_m: 250
  farm_max_slope_deg: 6
  farm_reach_km: 20
  treeline_m: 650
  treeline_aspect_m: 120
  rock_above_treeline_m: 600
  rock_slope_deg: 31

streets:
  local_spacing_km: { planned: [0.15, 0.2], mixed: [0.13, 0.19], organic: [0.1, 0.16] }
  # Local streets and generic buildings fill a core zone around the district centre, one km² per
  # core_people_per_km2 residents; the rest of the built-up area gets arterials and collectors.
  # detail_km2: a larger core zone of that size, or full for all the built-up area.
  districts:
    div_g2g1yc: { style: organic, mix: { perimeter: 1.8, houses: 1.2, industrial: 0.2 } }        # 福恩斯塔德区：城墙内的石砌老城
    div_jzqknb: { style: planned, detail_km2: 60, mix: { towers: 2.4, podium: 1.8, civic: 0.6, industrial: 0.1 } }  # 汇金区：离岸金融
    div_xps98r: { style: mixed, mix: { houses: 2.0, park: 1.2, industrial: 0.4 } }               # 北岬区：居住与草场
    div_tkvfsx: { style: mixed, detail_km2: 40, mix: { podium: 1.8, towers: 0.8, industrial: 0.5 } }       # 阿夫琳码头区：邮轮码头与免税街
    div_8a2hzm: { style: organic, detail_km2: 20, mix: { houses: 2.4, park: 1.5, industrial: 0.1 } }       # 灯塔区：海滨别墅
    div_cz7sch: { style: organic, mix: { podium: 1.2, houses: 1.6, park: 2.0, industrial: 0.1 } } # 温泉区：温泉酒店与疗养院
    div_v2tq1k: { style: organic, detail_km2: 15, mix: { houses: 2.0, industrial: 0.8 } }                  # 斯瓦特桑德区：黑沙滩与地热电站
    div_khmgcq: { style: organic, detail_km2: full, mix: { houses: 2.2, industrial: 0.6 } }      # 瓦莱区：渔村与观鲸码头
    div_5p2a2d: { style: organic, detail_km2: full, mix: { houses: 2.2, park: 1.0 } }            # 西基克图克区：保护区小镇
    div_b569a2: { style: planned, mix: { towers: 2.0, podium: 1.6, civic: 0.5, industrial: 0.2 } } # 链城区：航运交易所与船级社
    div_j6mw1m: { style: planned, mix: { industrial: 3.0, slabs: 0.4, houses: 0.2, towers: 0.2 } } # 奥斯特哈门区：集装箱码头
    div_kecby5: { style: mixed, mix: { slabs: 1.4, houses: 1.4 } }                               # 西岸区：住宅区
