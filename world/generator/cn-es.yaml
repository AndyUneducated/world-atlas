# whose centre maps to frame.origin_lonlat; frame.scale converts design km to real km (areas by its
# square). Division areas are taken from world/divisions/cn-es.yaml (area_km2, real km²) and enforced.
# Coordinates were laid out along the main island's axis (see DECISIONS.md, M43).
