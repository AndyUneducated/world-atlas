  cities:
    - city: div_kv6b3e   # 萨伦纳姆市
      names: { zh: 萨伦纳姆地铁, en: Sarunnam Metro, art-x-ivuran: Sarunnam Pitlorai }
      lines:
        - district: div_1z75n0   # 阿兰塔区
          axis: 0
          notes:
            zh: "萨伦纳姆地铁 1 号线在萨伦纳姆市的中央商务区阿兰塔区，伊武兰语叫「Sarunnam Pitlorai Lorai 1」，线路标识为红色，全长约 6.6 公里，自画廊路站起，经凤凰木大道、繁荣大道、音乐厅路和维拉大道，到广场街站，共 6 座车站。阿兰塔区名意为「高处」，摩天楼沿规划大道排开，领地的银行、证券交易所、数字服务公司和跨国企业的地区总部都在这里，天际线最高处是萨伦纳姆塔。线路从摩天楼脚下穿过，车站与写字楼的地下层相通，再接上高楼之间遮阳的空中连廊，上班的人可以一路不晒太阳走进办公室。列车最高时速 100 公里，DC 1500 V 架空接触网供电，6 辆编组的 B 型车，CBTC 信号，全自动无人驾驶，高峰时两三分钟就来一班。\n白天在阿兰塔工作的人大多是移民，早高峰的车厢里能听到十几种语言，报站也用中文、英文和伊武兰语轮流播一遍。傍晚人流掉了个头，下班的人坐到河滨去逛夜市，或者在音乐厅路站下车听一场演出，屋顶餐厅的灯一直亮到很晚。\n每逢满月的「灯与月」之夜，阿兰塔的摩天楼调暗灯光，1 号线的车厢也换上暖黄色的灯，载满去瓦什塔赖旧王城看灯的人。金融圈里还有一句玩笑：要是 1 号线上的交易员们都低着头不说话，那天的股市多半不太好。"
            en: "Sarunnam Metro Line 1 serves Aranta District, the central business district of Sarunnam City; in Ivuran it is \"Sarunnam Pitlorai Lorai 1\", its colour is red, and it runs about 6.6 km from Gallery Road by way of Flame Tree Avenue, Prosperity Avenue, Concert Hall Road and Vila Avenue to Square Street, six stations in all. Aranta, whose name means \"the heights\", has skyscrapers ranged along its planned avenues; the territory's banks, the stock exchange, digital services companies and the regional headquarters of multinationals are all here, and the highest point of the skyline is the Sarunnam Tower. The line passes beneath the feet of the skyscrapers, its stations open into the basements of the office towers and connect with the shaded sky bridges between them, so office workers can reach their desks without ever stepping into the sun. The trains reach 100 km/h on DC 1500 V overhead line, run as six-car B-type sets under CBTC signalling and are fully driverless, coming every two or three minutes at peak times.\nMost of the people who work in Aranta by day are immigrants; in the morning rush you can hear a dozen or more languages in a single car, and station announcements go out in Chinese, English and Ivuran in turn. In the evening the flow reverses, as people leaving work ride out to the riverside night markets or get off at Concert Hall Road for a performance, and the rooftop restaurants stay lit until late.\nOn every full-moon night of \"Lamps and Moon\", Aranta's skyscrapers dim their lights and the cars of Line 1 switch to a warm yellow glow, packed with people on their way to see the lamps at the Vashtarai Royal City. The financial district also has a joke: if the traders on Line 1 are all staring at the floor in silence, the market is probably having a bad day."
        - district: div_xz0zqd   # 塞鲁卡姆区
          axis: 0
          notes:
            zh: "萨伦纳姆地铁 2 号线在萨伦纳姆的老城塞鲁卡姆区，伊武兰语叫「Sarunnam Pitlorai Lorai 2」，线路标识为蓝色，全长约 8.3 公里，自北坡站起，经塞鲁卡姆水上市场、新月、铁锚大街、约翰森、基拉湾一大街和面包房路，到桶匠一街站，共 8 座车站。塞鲁卡姆区名意为「运河之城」，河道纵横，高脚木屋和老商铺沿河排开，街巷窄而曲折，人口密度居全领地之首。老城里修不了宽路，2 号线就成了这里最快的交通；线路从河道和老房子底下穿过，施工时先加固河床下的软土，再一段段推进隧道，尽量不惊动两岸的老屋。列车最高时速 100 公里，DC 1500 V 架空接触网供电，6 辆编组的 B 型车，CBTC 信号，全自动无人驾驶。\n塞鲁卡姆水上市场站是全线的招牌，每天清晨开市前，头几班车就把买菜的老人、餐馆的采购和来看热闹的游客送到河边，一出站就能看见上千条小船载着蔬果、鲜鱼、香料和小吃挤满河道。本地人多讲伊武兰语南部方言，车上的老人用方言聊着今天的鱼价；许多家庭世代在水上做买卖，如今的年轻摊贩先坐地铁，再换小船进河道。\n老城人爱说 2 号线是「地下的那条河」：上面的河运货，下面的河运人。站口常有人卖用香蕉叶包着的椰浆糯米饭，赶早的人边走边吃，叶子随手丢进站口的堆肥桶。"
            en: "Sarunnam Metro Line 2 serves Serukkam District, Sarunnam's old town; in Ivuran it is \"Sarunnam Pitlorai Lorai 2\", its colour is blue, and it runs about 8.3 km from North Slope by way of Serukkam Floating Market, Crescent, Anchor High Street, Johansen, Kila Bay High Street 1 and Bakehouse Road to Cooper Street 1, eight stations in all. Serukkam, whose name means \"city of canals\", is criss-crossed by waterways, with stilt houses and old shops along the banks and narrow, winding lanes, and it is the most densely populated place in the territory. There is no room for wide roads in the old town, so Line 2 is the fastest way around it; the line runs beneath the canals and the old houses, and during construction the soft ground under the canal beds was strengthened first and the tunnels then driven forward section by section, disturbing the old houses on the banks as little as possible. The trains reach 100 km/h on DC 1500 V overhead line, run as six-car B-type sets under CBTC signalling and are fully driverless.\nSerukkam Floating Market is the line's showpiece station: every morning before the market opens the first few trains deliver elderly shoppers, restaurant buyers and curious visitors to the waterside, and right outside the station a thousand small boats laden with fruit and vegetables, fresh fish, spices and snacks crowd the canals. Most locals speak the southern dialect of Ivuran, and the old people on the train discuss the day's fish prices in it; many families have traded on the water for generations, and today's young boat vendors ride the metro first and then change to a boat for the canals.\nPeople in the old town like to call Line 2 \"the river underground\": the river above carries goods, the river below carries people. Outside the stations someone is usually selling coconut sticky rice wrapped in banana leaf, early risers eat it on the move, and the leaves go into the compost bins at the station entrance."
        - district: div_n90922   # 伊拉瓦姆区
          axis: 0
          notes:
            zh: "萨伦纳姆地铁 3 号线在伊拉瓦姆区，伊武兰语叫「Sarunnam Pitlorai Lorai 3」，线路标识为橙色，全长约 8.9 公里，自基拉努特别自治大道站起，经飞鱼一大街、犀鸟大街、萨伦纳姆站、南京大街、长夏群岛大学和瓦希拉湾大街，到月光站，共 8 座车站。伊拉瓦姆是萨伦纳姆人口最多的区，区名意为「青年之地」，以住宅和教育为主，成片的公共租赁住房配有学校、诊所和社区食堂。线路在萨伦纳姆站与长夏真空磁悬浮和萨洛真空磁悬浮换乘，去领地其他城市的旅客多在这里转车；长夏群岛大学站就在主校区门口，这所大学以热带农业、海洋科学和伊武兰语研究见长。列车最高时速 100 公里，DC 1500 V 架空接触网，6 辆编组的 B 型车，CBTC 信号，全自动无人驾驶。\n开学和放假的那几天 3 号线最热闹：拖着行李箱的大学生在萨伦纳姆站下了真空磁悬浮，换乘几站就到学校，车厢里塞满了箱子和刚认识的室友。平日里区内年轻人多，咖啡馆和书店沿林荫大道一字排开，晚上的车厢里有人捧着书，也有人抱着冲浪板去海边。\n「基拉努特别自治大道站」的站名长得出名，报站要念好几秒，学生们比赛谁能用三种语言一口气念完。另一头的月光站是不少学生回家的终点，上完晚自习坐末班车的人说，坐到「月光」，一天才算真正结束。"
            en: "Sarunnam Metro Line 3 serves Ilavam District; in Ivuran it is \"Sarunnam Pitlorai Lorai 3\", its colour is orange, and it runs about 8.9 km from Special Autonomous City of Kilanu Avenue by way of Flying Fish High Street 1, Hornbill High Street, Sarunnam Station, Nanjing High Street, University of the Everlong Summer Islands and Vahira Bay Boulevard to Moonlight, eight stations in all. Ilavam is Sarunnam's most populous district; its name means \"land of the young\", and it is given over mainly to housing and education, with estates of public rented housing complete with schools, clinics and community canteens. At Sarunnam Station the line meets the Everlong Summer Vacuum Maglev and the Sarunnam–Lomiran Vacuum Maglev, and most travellers bound for the territory's other cities change here; University of the Everlong Summer Islands station is at the gates of the main campus of the university, which is strong in tropical agriculture, marine science and Ivuran studies. The trains reach 100 km/h on DC 1500 V overhead line, run as six-car B-type sets under CBTC signalling and are fully driverless.\nLine 3 is at its liveliest in the days around the start and end of term, when students with suitcases step off the vacuum maglev at Sarunnam Station and change for the few stops to the university, the cars crammed with luggage and newly met roommates. On ordinary days the district is full of young people, cafés and bookshops line its tree-shaded avenues, and in the evening some riders have their noses in books while others carry surfboards to the beach.\nSpecial Autonomous City of Kilanu Avenue is famous for its long name, which takes several seconds to announce, and students compete to see who can say it in all three languages in one breath. Moonlight at the other end is where many students get off for home, and those who ride the last train after evening study say the day is not really over until you reach \"Moonlight\"."
        - district: div_54sm84   # 门达卢尔区，东至萨伦纳姆国际机场
          axis: 0
          to: poi_kk4d9s
          notes:
            zh: "萨伦纳姆地铁 4 号线在萨伦纳姆东部的新城门达卢尔区，伊武兰语叫「Sarunnam Pitlorai Lorai 4」，线路标识为绿色，全长约 11.9 公里，自公园路站起，经建设大街、剧院大道、议会路、瓦希拉岛街、云雀、夏至、阿蒙森、橡树和榛子，向东到萨伦纳姆国际机场站，共 11 座车站，是领地最长的地铁线，市民按区名叫它「门达卢尔线」。门达卢尔新城按规划路网建设，住宅多为高层公寓，居民以近二三十年迁来的移民家庭为主；萨伦纳姆国际机场是领地最大的航空港，航线通往世界各地，周围是物流园、航空维修基地和会展中心，4 号线向东延伸，就是为了把机场接进城。列车最高时速 100 公里，DC 1500 V 架空接触网供电，6 辆编组的 B 型车，CBTC 信号，全自动无人驾驶。\n4 号线的乘客一半拖着行李箱，一半穿着工装：清早是去航空维修基地和物流园上班的技师和仓管员，白天是赶飞机的旅客和去会展中心看展的人，深夜还有下了晚班的空乘。车厢里留出了放行李的空位，报站时会顺带提醒乘客照看好行李和孩子。\n新城的孩子们周末常坐到终点，在机场看飞机起降。夏至站和阿蒙森站只隔一站，本地人开玩笑说，坐一站就从一年里白天最长的日子到了极地探险家那里；不过在赤道附近的萨伦纳姆，白昼一年到头都差不多长，「夏至」那天和别的日子没什么两样。"
            en: "Sarunnam Metro Line 4 serves Mendalur District, the new town in the east of Sarunnam; in Ivuran it is \"Sarunnam Pitlorai Lorai 4\", its colour is green, and it runs about 11.9 km from Park Road by way of Progress Boulevard, Theatre Avenue, Parliament Road, Vahira Island Street, Lark, Midsummer, Amundsen, Oak and Hazel east to Sarunnam International Airport, eleven stations in all. It is the longest metro line in the territory, and people call it the \"Mendalur line\" after its district. The new town of Mendalur was built on a planned street grid, its homes mostly high-rise flats and its residents mainly immigrant families who have arrived in the last twenty or thirty years; Sarunnam International Airport is the territory's largest airport, with routes all over the world, surrounded by logistics parks, an aircraft maintenance base and a convention centre, and Line 4 was extended east precisely to bring the airport into the city. The trains reach 100 km/h on DC 1500 V overhead line, run as six-car B-type sets under CBTC signalling and are fully driverless.\nHalf of Line 4's passengers pull suitcases and half wear work clothes: early in the morning come the technicians and warehouse staff heading for the maintenance base and the logistics parks, in the daytime travellers rushing for flights and visitors to the convention centre, and late at night cabin crew coming off late shifts. The cars have space set aside for luggage, and the announcements remind passengers to keep an eye on their bags and their children.\nAt weekends the new town's children often ride to the end of the line to watch the planes take off and land. Midsummer and Amundsen are just one stop apart, and locals joke that one stop takes you from the longest day of the year to the polar explorer; but in Sarunnam, close to the equator, the days are much the same length all year, and \"midsummer\" is hardly different from any other day."
        - district: div_8jecyx   # 瓦什塔赖区
          axis: 0
          notes:
            zh: "萨伦纳姆地铁 5 号线在萨伦纳姆的旧王城瓦什塔赖区，伊武兰语叫「Sarunnam Pitlorai Lorai 5」，线路标识为紫色，全长约 7.6 公里，自奥卢大街站起，经珍珠贝一路、瓦什塔赖旧王城、符文、扶桑一街和檀香街，到暮光站，共 7 座车站。瓦什塔赖的区名是雅言里的「王冠之座」，城墙和护城河围着宫殿遗址，伊什万塔寺庙群的上百座石塔在城北连成一片，是古王国留下的最大遗产。城墙内只许步行和骑车，地铁就成了进出旧王城的主要方式；线路从城墙和老房子底下深埋穿过，瓦什塔赖旧王城站的出口做成低矮的石砌门廊，从地面上几乎看不出是一座地铁站。列车最高时速 100 公里，DC 1500 V 架空接触网，6 辆编组的 B 型车，CBTC 信号，全自动无人驾驶。\n寺庙至今仍有僧侣居住，清晨的头班车上常能看到去寺里的僧侣和提着花篮去献花的老人；白天乘客多是游客，城墙内的老房子多改作博物馆、手工作坊和客栈，背包客出了站就拖着箱子走进城里的客栈。\n每逢满月的「灯与月」之夜，全城的人来这里点灯、献花，5 号线通宵运行，车厢里挤满捧着油灯和鲜花的一家老小。有人发现傍晚从符文站坐到暮光站，出站正好赶上旧王城的日落，「坐 5 号线看暮光」于是成了情侣们最爱的约会路线。"
            en: "Sarunnam Metro Line 5 serves Vashtarai District, Sarunnam's old royal city; in Ivuran it is \"Sarunnam Pitlorai Lorai 5\", its colour is purple, and it runs about 7.6 km from Olu High Street by way of Pearl Oyster Road 1, Vashtarai Royal City, Rune, Hibiscus Street 1 and Sandalwood Street to Twilight, seven stations in all. Vashtarai's name means \"seat of the crown\" in the classical tongue: walls and a moat enclose the remains of the palace, and the hundred and more stone towers of the Ishvanta Temples stand together in the north of the city, the greatest legacy of the old kingdom. Inside the walls only walking and cycling are allowed, so the metro is the main way in and out of the royal city; the line runs deep beneath the walls and the old houses, and the exit at Vashtarai Royal City is built as a low stone porch, so that from street level it hardly looks like a metro station at all. The trains reach 100 km/h on DC 1500 V overhead line, run as six-car B-type sets under CBTC signalling and are fully driverless.\nMonks still live in the temples, and on the first train of the morning you often see monks on their way to the temples and old people carrying baskets of flowers to offer; in the daytime the riders are mostly visitors, since many of the old houses inside the walls have become museums, craft workshops and guesthouses, and backpackers emerge from the station and wheel their cases straight to their lodgings in the old city.\nOn every full-moon night of \"Lamps and Moon\" the whole city comes here to light lamps and offer flowers, Line 5 runs all night, and the cars are packed with families carrying oil lamps and flowers. Someone noticed that riding from Rune to Twilight in the early evening brings you out just in time for sunset over the royal city, and \"taking Line 5 to Twilight\" has become a favourite outing for couples."
    - city: div_5tgnmz   # 塔卢马兰市
      names: { zh: 塔卢马兰地铁, en: Talumaran Metro, art-x-ivuran: Talumaran Pitlorai }
      lines:
        - district: div_2fhccc   # 塔卢区
          axis: 0
          notes:
            zh: "塔卢马兰地铁 1 号线在塔卢马兰的市中心和老港塔卢区，伊武兰语叫「Talumaran Pitlorai Lorai 1」，线路标识为红色，全长约 10.0 公里，自赫瓦鲁大街站起，经埃武托拉湾大街、河畔、西安、塔卢马兰站、杜松、豆蔻街、雨树路和库瓦拉大道，到萤火街站，共 10 座车站，是塔卢马兰地铁最长的一条。塔卢区名意为「停泊」，老码头的石砌防波堤和灯塔还在使用，海员会馆、老商行和鱼市沿港排开，市政厅、海事法院和航运交易所都在区内，新的商业街和办公楼在老港背后的规划街区里。线路在塔卢马兰站与长夏真空磁悬浮和塔纳高速铁路换乘，是全市的交通枢纽。列车最高时速 100 公里，DC 1500 V 架空接触网供电，6 辆编组的 B 型车，CBTC 信号，全自动无人驾驶。\n全市移民约占三分之二，1 号线的车厢就像一座小小的移民城：刚下真空磁悬浮、拖着行李找住处的新人，去航运交易所上班的经纪人，去鱼市进货的厨师，挤在一起各说各的乡音。下班的船厂工人常在老港一带下车，去码头夜市吃一碗椰浆咖喱鱼配米饭再回家。\n本地人欢迎新来的人时爱说「Talu oruka, maran tola」，意思是「船停下的地方，就是家」，这句话就写在塔卢马兰站换乘通道的墙上。萤火街站在线路的一头，附近的孩子说傍晚出站时偶尔真能看见几只萤火虫，算是全线最名副其实的站名。"
            en: "Talumaran Metro Line 1 serves Talu District, the city centre and old harbour of Talumaran; in Ivuran it is \"Talumaran Pitlorai Lorai 1\", its colour is red, and it runs about 10.0 km from Hevaru High Street by way of Evutola Bay High Street, Riverside, Xi'an, Talumaran Station, Juniper, Cardamom Street, Rain Tree Road and Kuvala Avenue to Firefly Street, ten stations in all, the longest line of the Talumaran Metro. Talu's name means \"mooring\": the stone breakwater and lighthouse of the old harbour are still in use, the seamen's hall, old trading houses and fish market line the waterfront, the city hall, the maritime court and the shipping exchange are all in the district, and new shopping streets and office blocks fill the planned blocks behind the old port. At Talumaran Station the line meets the Everlong Summer Vacuum Maglev and the Talumaran–Nalumai High-Speed Railway, making it the city's transport hub. The trains reach 100 km/h on DC 1500 V overhead line, run as six-car B-type sets under CBTC signalling and are fully driverless.\nAbout two-thirds of the city's people are immigrants, and a car on Line 1 is a small immigrant city of its own: newcomers just off the vacuum maglev hauling their luggage in search of a room, brokers on their way to the shipping exchange and cooks going to the fish market for supplies, all squeezed together, each speaking with the accent of home. Shipyard workers on their way home often get off around the old harbour for a bowl of coconut fish curry and rice at the quayside night market.\nLocals welcome newcomers with the saying \"Talu oruka, maran tola\", \"where the boat stops is home\", and the words are written on the wall of the interchange passage at Talumaran Station. Firefly Street is at one end of the line, and children nearby say that coming out of the station at dusk you can now and then really see a few fireflies, which makes it the most aptly named station on the line."
        - district: div_py6kpa   # 米纳萨区
          axis: 0
          notes:
            zh: "塔卢马兰地铁 2 号线在塔卢马兰西部的住宅区米纳萨区，伊武兰语叫「Talumaran Pitlorai Lorai 2」，线路标识为蓝色，全长约 6.3 公里，自上坡站起，经长沙路、蜂房、檀香大道和哈尔滨街，到翠鸟大街站，共 6 座车站。米纳萨区名意为「安居」，公共租赁住房、学校和医院沿林荫大道分布，许多船厂和电池厂的工人家庭住在这里，塔卢马兰海事学院也在区内，培养船员和造船工程师。2 号线在住宅街坊之间穿行，居民坐到站后，再换公交和电动班车去伦博的船厂和伊拉坦的电池厂。列车最高时速 100 公里，DC 1500 V 架空接触网供电，6 辆编组的 B 型车，CBTC 信号，全自动无人驾驶。\n早上的车厢里，穿着海事学院制服的学员和背着书包的孩子挤在一起，学员们在车上互相考信号旗和航海术语；白天乘客多是去医院看病的老人和推着婴儿车的父母，傍晚下了班的工人家庭又把车厢坐满。线上的站名有的取中国城市，长沙在南、哈尔滨在北，住在附近的南方工人和北方工人各自把其中一站认作「老家站」。\n蜂房站附近的居民楼密密排开，阳台挨着阳台，晚上灯一盏盏亮起来，真像一个蜂巢。上坡站也名副其实，出站就是一段坡路，海事学院的学员每天早上从这里跑步上坡，说是练船上爬舷梯的腿劲。"
            en: "Talumaran Metro Line 2 serves Minasa District, the residential district in the west of Talumaran; in Ivuran it is \"Talumaran Pitlorai Lorai 2\", its colour is blue, and it runs about 6.3 km from Uphill by way of Changsha Road, Beehive, Sandalwood Avenue and Harbin Street to Kingfisher High Street, six stations in all. Minasa's name means \"settled home\": public rented housing, schools and hospitals stand along its tree-lined avenues, many families of shipyard and battery workers live here, and the district is also home to the Talumaran Maritime Academy, which trains seafarers and shipbuilding engineers. Line 2 threads between the residential blocks, and from its stations residents change to buses and electric works shuttles for the shipyards of Lumbo and the battery plants of Ilatan. The trains reach 100 km/h on DC 1500 V overhead line, run as six-car B-type sets under CBTC signalling and are fully driverless.\nIn the morning cadets in Maritime Academy uniform squeeze in beside children with school bags, the cadets testing each other on signal flags and nautical terms; in the daytime the riders are mostly older people on their way to hospital and parents with prams, and in the evening workers' families coming home fill the cars again. Some of the stations are named after Chinese cities, Changsha in the south and Harbin in the north, and workers from the south and the north who live nearby have each adopted one of them as their \"home-town station\".\nThe blocks of flats around Beehive stand close together, balcony beside balcony, and when the lights come on one by one at night it really does look like a hive. Uphill earns its name too, with a slope right outside the station, and Maritime Academy cadets run up it every morning, training, they say, the leg strength for climbing a ship's gangway."
        - district: div_3e94sq   # 伊拉坦区
          axis: 0
          notes:
            zh: "塔卢马兰地铁 3 号线在塔卢马兰北部的新能源产业区伊拉坦区，伊武兰语叫「Talumaran Pitlorai Lorai 3」，线路标识为橙色，全长约 7.7 公里，自樱桃站起，经凯伊纳路、钟楼大街、兰花大道、团结路和塔卢马兰机场，到体育场路站，共 7 座车站。伊拉坦区名意为「新的田」，电池正极材料厂、电芯厂和新能源车整车厂连成一条产业链，伊拉坦电池厂和伊拉坦新能源车厂用的是乌诺卡里矿区的镍和钴；厂区屋顶铺满太阳能板，废旧电池在区内的回收厂拆解再生。塔卢马兰机场也在区内，由 3 号线的塔卢马兰机场站服务。列车最高时速 100 公里，DC 1500 V 架空接触网供电，6 辆编组的 B 型车，CBTC 信号，全自动无人驾驶。\n区里的工人大多是年轻的移民，3 号线的早晚高峰几乎全是穿工装的年轻人，有人戴着耳机补觉，有人在手机上看家乡的直播。周末换了一批乘客：体育场路站附近有球赛的日子，球迷们披着队服一路唱着歌进站，散场时再唱着歌回来。\n厂里的人爱说 3 号线是一条「从矿石到天上」的线：镍从乌诺卡里运来，在这里变成电池、装进车里，坐到机场站，人就能飞往世界各地。新能源车厂的工人还有个小骄傲：地铁站外排队等客的出租车，几乎全是自己厂里造的电动车。"
            en: "Talumaran Metro Line 3 serves Ilatan District, the new-energy industrial district in the north of Talumaran; in Ivuran it is \"Talumaran Pitlorai Lorai 3\", its colour is orange, and it runs about 7.7 km from Cherry by way of Kaina Road, Clock Tower Boulevard, Orchid Avenue, Unity Road and Talumaran Airport to Stadium Road, seven stations in all. Ilatan's name means \"new field\": cathode material plants, cell plants and an electric vehicle assembly plant form a single chain, and the Ilatan Battery Works and the Ilatan Electric Vehicle Plant use nickel and cobalt from the Unokari mines; the factory roofs are covered with solar panels, and spent batteries are dismantled and recycled in the district's own recycling plant. Talumaran Airport is in the district too, served by Line 3's Talumaran Airport station. The trains reach 100 km/h on DC 1500 V overhead line, run as six-car B-type sets under CBTC signalling and are fully driverless.\nMost of the district's workers are young immigrants, and Line 3's morning and evening rush hours are almost all young people in work clothes, some catching up on sleep under their headphones, others watching live streams from home on their phones. At weekends a different crowd takes over: on match days near Stadium Road, fans in team shirts sing all the way into the station and sing all the way back after the final whistle.\nFactory people like to call Line 3 the line \"from ore to the sky\": the nickel comes from Unokari, becomes batteries here and goes into cars, and ride on to the airport station and you can fly anywhere in the world. Workers at the vehicle plant have a small point of pride as well: the taxis queuing outside the metro stations are nearly all electric cars built in their own factory."
        - district: div_yakrhd   # 伦博区
          axis: 0
          notes:
            zh: "塔卢马兰地铁 4 号线在塔卢马兰的造船区伦博区，伊武兰语叫「Talumaran Pitlorai Lorai 4」，线路标识为绿色，全长约 8.1 公里，自画廊站起，经拉萨大道、平等路、南京路、共和大街、苏州和陈家，到冰巨人站，共 8 座车站。伦博区名意为「船」，伦博船厂的干船坞和龙门吊沿伦博湾排开，建造集装箱船、液化气运输船、海上风电安装船和海洋平台，周围是钢结构、船用发动机和电子设备的配套工厂；船厂的焊工、电工和工程师多住在区内的工人新村。4 号线把工人新村和船厂、配套工厂连在一起，换班时整列车坐满穿着工装的人。列车最高时速 100 公里，DC 1500 V 架空接触网，6 辆编组的 B 型车，CBTC 信号，全自动无人驾驶。\n伦博船厂每有新船下水，船头都要挂一串鸡蛋花编成的花环，下水那天 4 号线加开班次，工人们带着家人去看，车厢里飘着鸡蛋花的香味。平时下了夜班的焊工在车上摘下安全帽打个盹，快到站时总有工友拍拍他的肩膀。\n线路一头的冰巨人站是领地最让人摸不着头脑的站名之一，在终年炎热的伦博，谁也没见过冰，更别说巨人。工人们自己给了个解释：夜里亮着灯的龙门吊远远看去，就像一排站在海边的巨人，至于「冰」字，大概是给热得冒汗的焊工们留一点念想。"
            en: "Talumaran Metro Line 4 serves Lumbo District, Talumaran's shipbuilding district; in Ivuran it is \"Talumaran Pitlorai Lorai 4\", its colour is green, and it runs about 8.1 km from Gallery by way of Lhasa Avenue, Equality Road, Nanjing Road, Republic High Street, Suzhou and Chenjia to Frost Giant, eight stations in all. Lumbo's name means \"ship\": the dry docks and gantry cranes of the Lumbo Shipyard line Lumbo Bay, building container ships, gas carriers, offshore wind installation vessels and offshore platforms, surrounded by suppliers of steel structures, marine engines and electronics; the yard's welders, electricians and engineers mostly live in the district's workers' estates. Line 4 links the workers' estates with the shipyard and its suppliers, and at shift change whole trains fill with people in overalls. The trains reach 100 km/h on DC 1500 V overhead line, run as six-car B-type sets under CBTC signalling and are fully driverless.\nWhenever a new ship is launched at the Lumbo Shipyard, a garland of frangipani is hung on her bow; on launch days Line 4 runs extra trains, workers bring their families to watch, and the cars smell of frangipani. On ordinary days welders coming off the night shift take off their hard hats and doze on the train, and as their stop approaches a workmate always taps them on the shoulder.\nFrost Giant at one end of the line is one of the most puzzling station names in the territory: in Lumbo, hot all year round, nobody has ever seen ice, let alone a giant. The workers have come up with their own explanation: at night the lit-up gantry cranes look from afar like a row of giants standing by the sea, and as for the \"frost\", it is probably there to give the sweating welders something to dream about."
    - city: div_24d8z4   # 基拉努特别自治市
      names: { zh: 基拉努地铁, en: Kilanu Metro, art-x-ivuran: Kilanu Pitlorai }
      lines:
        - district: div_rmy0kf   # 萨基拉区
          axis: 0
          notes:
            zh: "基拉努地铁 1 号线是基拉努特别自治市萨基拉区的地铁线，伊武兰语叫「Kilanu Pitlorai Lorai 1」，线路标识为红色，全长约 3.2 公里，设石楠、白桦、乌诺图马峰大道和云杉 4 座车站。它比贝叶斯地铁 1 号线还短 0.1 公里，是世界上最短的地铁线。线路整段在萨基拉区的建成区内，这里是基拉努的市中心，区名意为「光的中心」，塔楼和商场沿海滨大道排开，科技公司的总部、风险投资机构和软件企业都集中在区内。列车按领地地铁的统一标准建造：最高时速 100 公里，DC 1500 V 架空接触网供电，6 辆编组的 B 型车，CBTC 信号系统，全自动无人驾驶（GoA4）。\n早高峰的车厢里多是拎着电脑包的程序员和投资人，从乌诺图马峰大道站出来，几步就进了写字楼；午饭时间不少人坐两站去海边吃一碗海鲜炒河粉，再坐回来开下午的会。傍晚以后，乘客换成了去海滨散步、逛夜市的一家老小，石英砂滩上的人一直待到深夜，末班车上常有孩子的鞋里还带着「会唱歌的沙」。\n全线从头坐到尾只要几分钟，本地人开玩笑说，还没刷完一条新闻就到站了。拿下「世界最短」之后，有人在站台上贴过一张告示，提醒乘客「本线禁止睡过站，因为根本来不及睡着」；据说贝叶斯那边听到消息，还认真讨论过要不要把终点站往回挪一点。"
            en: "Kilanu Metro Line 1 is the metro line of Sakila District in the Special Autonomous City of Kilanu; in Ivuran it is \"Kilanu Pitlorai Lorai 1\", its colour is red, and it runs about 3.2 km with four stations: Heather, Birch, Mount Unotuma Avenue and Spruce. It is 0.1 km shorter even than Bayes Metro Line 1, which makes it the shortest metro line in the world. The whole line lies within the built-up area of Sakila District, the centre of Kilanu, whose name means \"centre of light\"; towers and shopping centres line the seafront avenue, and the headquarters of technology companies, venture capital firms and software businesses are concentrated here. The trains are built to the territory's common metro standard: a top speed of 100 km/h, DC 1500 V overhead line, six-car B-type sets, CBTC signalling and fully driverless operation (GoA4).\nIn the morning rush the cars are full of programmers and investors with laptop bags, who step out at Mount Unotuma Avenue and are in their office towers within a few paces; at lunchtime plenty ride two stops to the seafront for a plate of seafood fried rice noodles and ride back for the afternoon meeting. After dusk the riders become families heading for the seafront promenade and the night market; people stay on the quartz sand until late, and on the last train children often still have some of the \"singing sand\" in their shoes.\nThe whole line takes only a few minutes end to end, and locals joke that you reach your stop before you have finished scrolling one news story. After it took the title of \"world's shortest\", someone put up a notice on a platform reminding passengers that \"sleeping past your stop is forbidden on this line, because there is no time to fall asleep\"; word is that when the news reached Bayes, people there seriously discussed moving their terminus back a little."
        - district: div_07wzvt   # 埃莱努区
          axis: 0
          notes:
            zh: "基拉努地铁 2 号线在基拉努特别自治市的埃莱努区，伊武兰语叫「Kilanu Pitlorai Lorai 2」，线路标识为蓝色，全长约 6.4 公里，自扶桑街站起，经海豚路、尼拉普大街、翁贝尔哈努湖街和维拉街，到大连站，共 6 座车站。埃莱努区名意为「学习的岸」，是基拉努的大学和住宅区：基拉努理工大学以集成电路、材料和软件见长，与产业园的企业共建实验室，成片的公寓楼住着年轻的工程师家庭，区内的国际学校用中文、英文和伊武兰语三种语言教学。2 号线穿过这些住宅街坊，站距约 1.2 公里，大多数居民步行几分钟就能到站。列车最高时速 100 公里，DC 1500 V 架空接触网供电，6 辆编组的 B 型车，CBTC 信号，全自动无人驾驶。\n早上七点多，车厢里一半是背着书包去国际学校的孩子，一半是去实验室的研究生，孩子们在车上用三种语言轮流背单词，是三语课堂带出来的习惯。晚高峰回家的车上，常能听到工程师们讨论流片进度，旁边的老人则在商量周末去哪片海滩。\n线路两头的站名一个取中国的城市，一个取热带的花，本地人说 2 号线「一头连着大连，一头开着扶桑花」。理工大学的新生入学那天，学长学姐有个不成文的规矩：带新生把 2 号线从头坐到尾，一站一站讲哪里的夜宵最好吃、哪家咖啡馆可以通宵写代码。"
            en: "Kilanu Metro Line 2 serves Elenu District in the Special Autonomous City of Kilanu; in Ivuran it is \"Kilanu Pitlorai Lorai 2\", its colour is blue, and it runs about 6.4 km from Hibiscus Street by way of Dolphin Road, Nilapu Boulevard, Lake Ombelhanu Street and Vila Street to Dalian, six stations in all. Elenu, whose name means \"shore of learning\", is Kilanu's university and residential district: the Kilanu University of Technology is strong in integrated circuits, materials and software and runs joint laboratories with companies in the industrial park, blocks of flats house young engineers' families, and the district's international schools teach in three languages, Chinese, English and Ivuran. Line 2 runs through these residential neighbourhoods with stations about 1.2 km apart, so most residents can walk to a station in a few minutes. The trains reach 100 km/h on DC 1500 V overhead line, run as six-car B-type sets under CBTC signalling and are fully driverless.\nJust after seven in the morning half the riders are children with school bags bound for the international schools and half are postgraduates on their way to the laboratories; the children take turns testing each other on vocabulary in all three languages, a habit carried over from their trilingual classrooms. On the way home in the evening rush you often hear engineers discussing the progress of a chip tape-out while the older passengers beside them debate which beach to visit at the weekend.\nThe stations at either end take their names from a Chinese city and a tropical flower, and locals say Line 2 \"has Dalian at one end and hibiscus in bloom at the other\". On the day new students arrive at the university of technology, older students follow an unwritten rule: they ride the whole of Line 2 with the freshers, explaining station by station where the best late-night food is and which café lets you write code all night."
        - district: div_qr8ay4   # 努维拉区
          axis: 0
          notes:
            zh: "基拉努地铁 3 号线在基拉努特别自治市的努维拉区，伊武兰语叫「Kilanu Pitlorai Lorai 3」，线路标识为橙色，全长约 7.3 公里，设花楸、榕树大道、茉莉路、红树路、星图、托马库大道和达尔 7 座车站，是基拉努地铁三条线中最长的一条。努维拉区名意为「沙中之光」，是领地的半导体产业园：十多座晶圆厂、封装测试厂和光刻胶、特种气体等配套工厂沿规划路网排开，园区有自己的变电站和超纯水厂。3 号线穿行在厂区和职工住宅之间，是园区工程师、技术员和操作工上下班的主要交通。列车最高时速 100 公里，DC 1500 V 架空接触网供电，6 辆编组的 B 型车，CBTC 信号系统，全自动无人驾驶；靠近晶圆厂的路段铺了减振轨道，免得列车的震动传进对震动极其敏感的光刻车间。\n晶圆厂三班倒，3 号线的高峰一天有三次，换班的人潮在站台上交错，穿着便服的人和刚脱下洁净服、头发还被帽子压得扁扁的人擦肩而过。深夜的末班车上，常有下了班的工程师靠着车窗打盹，无人驾驶的列车安安静静地把他们送到家门口的车站。\n园区里流传一个说法：星图站的名字最配这里，因为晶圆上的电路在显微镜下看起来就像一张星图。新员工第一天从红树路站出来，前辈们总要指着远处一排排白色的厂房说一句「欢迎来到沙中之光」。"
            en: "Kilanu Metro Line 3 serves Nuvila District in the Special Autonomous City of Kilanu; in Ivuran it is \"Kilanu Pitlorai Lorai 3\", its colour is orange, and it runs about 7.3 km with seven stations, Rowan, Banyan Avenue, Jasmine Road, Mangrove Road, Star Chart, Tomaku Avenue and Dahl, the longest of Kilanu's three metro lines. Nuvila, whose name means \"light in the sand\", is the territory's semiconductor park: more than ten wafer fabs, packaging and test plants and suppliers of photoresist, specialty gases and the like stand along its planned street grid, and the park has its own substation and ultrapure water plant. Line 3 runs between the plants and the staff housing and is the main way the park's engineers, technicians and operators get to and from work. The trains reach 100 km/h on DC 1500 V overhead line, run as six-car B-type sets under CBTC signalling and are fully driverless; near the fabs the track is laid on vibration-damping beds so that the trains do not shake the lithography halls, which are extremely sensitive to vibration.\nThe fabs work three shifts, so Line 3 has three rush hours a day, and the crowds changing shift cross on the platforms: people in their own clothes brush past others who have just taken off their cleanroom suits, their hair still flattened by the caps. On the last train late at night engineers going off duty often doze against the windows while the driverless train carries them quietly to the station by their front door.\nThe park has a saying that Star Chart is the station name that suits the place best, because the circuits on a wafer look like a star chart under the microscope. On a new employee's first day, as they come up out of Mangrove Road, the old hands always point at the rows of white plant buildings in the distance and say \"welcome to the light in the sand\"."
    - city: div_11j4xw   # 瓦利凯市
      names: { zh: 瓦利凯地铁, en: Vallikkai Metro, art-x-ivuran: Vallikkai Pitlorai }
      lines:
        - district: div_3ytmrh   # 坎纳鲁尔区
          axis: 0
          notes:
            zh: "瓦利凯地铁 1 号线在瓦利凯的老城坎纳鲁尔区，伊武兰语叫「Vallikkai Pitlorai Lorai 1」，线路标识为红色，全长约 6.1 公里，自坎纳鲁尔香料仓库博物馆站起，经瓦利凯站、海豹、蒂拉凯苏山脉路和索里努岬路，到青岛站，共 6 座车站。坎纳鲁尔区名意为「眼前的村」，骑楼街沿老港排开，石砌的香料仓库和老商行改作了餐馆和博物馆，清晨的鱼市和傍晚的海滨夜市是老城最热闹的时候。线路在瓦利凯站与长夏真空磁悬浮和瓦洛高速铁路换乘，是外地旅客进瓦利凯城的第一程。列车最高时速 100 公里，DC 1500 V 架空接触网供电，6 辆编组的 B 型车，CBTC 信号，全自动无人驾驶。\n瓦利凯是领地雨水最多的城市，一年降水两千七百多毫米，老城的骑楼连成一片，1 号线的车站出口也都接进骑楼的廊道，乘客出了站不用打伞就能去买菜、喝茶。老城居民多讲伊武兰语南部方言，早班车上的老人拎着刚从鱼市买的鱼，用方言议论今天的价钱。\n起点站出来就是坎纳鲁尔香料仓库博物馆，馆里的茶室用老配方煮香料奶茶。游客下了真空磁悬浮，坐一站地铁就能喝上一杯，于是有人把瓦利凯的旅游路线总结成「先喝茶，再看海」。本地人还爱拿 1 号线开玩笑：在瓦利凯，就算没赶上车也淋不着雨。"
            en: "Vallikkai Metro Line 1 serves Kannarur District, Vallikkai's old town; in Ivuran it is \"Vallikkai Pitlorai Lorai 1\", its colour is red, and it runs about 6.1 km from Kannarur Spice Warehouse Museum by way of Vallikkai Station, Seal, Tirakesu Mountains Road and Cape Sorinu Road to Qingdao, six stations in all. Kannarur's name means \"the village before your eyes\": arcaded streets line the old harbour, the stone spice warehouses and old trading houses have become restaurants and museums, and the old town is at its liveliest at the early-morning fish market and the evening night market by the sea. At Vallikkai Station the line meets the Everlong Summer Vacuum Maglev and the Vallikkai–Lomiran High-Speed Railway, so for visitors it is the first leg of the journey into town. The trains reach 100 km/h on DC 1500 V overhead line, run as six-car B-type sets under CBTC signalling and are fully driverless.\nVallikkai is the rainiest city in the territory, with more than 2,700 mm of rain a year; the arcades of the old town join up into one long covered walk, and every exit of Line 1 opens into them, so passengers can leave the station and go shopping or drinking tea without an umbrella. Most old-town residents speak the southern dialect of Ivuran, and on the early trains old people carrying fish fresh from the market discuss the day's prices in it.\nRight outside the first station is the Kannarur Spice Warehouse Museum, whose tea room brews spiced milk tea to an old recipe. Visitors off the vacuum maglev can be drinking a cup after a single stop on the metro, and someone has summed up the Vallikkai tour as \"tea first, then the sea\". Locals like to joke about Line 1 too: in Vallikkai, even if you miss your train you will not get wet."
        - district: div_qj7vjy   # 图拉凯区
          axis: 0
          notes:
            zh: "瓦利凯地铁 2 号线在瓦利凯的深水转运港区图拉凯区，伊武兰语叫「Vallikkai Pitlorai Lorai 2」，线路标识为蓝色，全长约 6.1 公里，与 1 号线一样长，自檀香路站起，经海燕、博爱街、瀑布和纳卢大道，到苍鹭站，共 6 座车站。图拉凯区名意为「港口之岸」，图拉凯集装箱码头的四个集装箱突堤沿防波堤展开，大型集装箱船在这里换装驳船和支线船，转运箱量居领地之首，港区还有船舶加油站和修船码头。2 号线连接港区的住宅和码头，是码头工人、调度员、报关员和修船工上下班的主要交通。列车最高时速 100 公里，DC 1500 V 架空接触网供电，6 辆编组的 B 型车，CBTC 信号，全自动无人驾驶。\n码头昼夜不停，2 号线也跟着码头的节奏走，凌晨换班时的车厢比白天还满，车厢里的屏幕滚动播放着港口的船期。吊车司机被称作「云上的人」，他们在几十米高的驾驶室里吃午饭，饭盒用绳子吊上去；下了班钻进地铁回家，有人开玩笑说，这是「云上的人」一天里离云最远的时候。\n站名多取海鸟和水边的景物，海燕和苍鹭都是港区常见的鸟，老码头工人说，看见苍鹭在防波堤上站成一排，就快涨潮了。瓦利凯人出远门必带的海藻饼，在 2 号线的站口小摊上也买得到，夜班工人常揣两块当夜宵。"
            en: "Vallikkai Metro Line 2 serves Turakkai District, Vallikkai's deep-water transhipment port; in Ivuran it is \"Vallikkai Pitlorai Lorai 2\", its colour is blue, and at about 6.1 km it is exactly as long as Line 1, running from Sandalwood Road by way of Petrel, Fraternity Street, Waterfall and Nalu Avenue to Heron, six stations in all. Turakkai's name means \"shore of the harbour\": the four container piers of the Turakkai Container Terminal reach out along the breakwater, large container ships transfer their boxes here to barges and feeder ships, the terminal handles more transhipment containers than any other in the territory, and the port also has a bunkering station and repair quays. Line 2 links the port's housing with the quays and is the main way to work for dockers, dispatchers, customs brokers and ship repairers. The trains reach 100 km/h on DC 1500 V overhead line, run as six-car B-type sets under CBTC signalling and are fully driverless.\nThe terminal never stops, and Line 2 keeps to its rhythm, with cars fuller at the small-hours shift change than in the daytime and screens in every car scrolling the port's shipping schedule. The crane drivers are known as \"the people in the clouds\"; they eat lunch in cabs dozens of metres up, their lunch boxes hauled up on a rope, and as they head underground for the metro home, some joke that this is the furthest \"the people in the clouds\" get from the clouds all day.\nMost of the station names come from seabirds and waterside scenes; petrels and herons are common birds around the port, and old dockers say that when the herons line up on the breakwater the tide is about to come in. The seaweed cakes that Vallikkai people always pack for a long journey are sold at stalls outside Line 2's stations too, and night-shift workers often slip a couple in their pockets for a midnight snack."
        - district: div_0hrhwh   # 埃鲁塔姆区
          axis: 0
          notes:
            zh: "瓦利凯地铁 3 号线在瓦利凯北部的物流区埃鲁塔姆区，伊武兰语叫「Vallikkai Pitlorai Lorai 3」，线路标识为橙色，全长约 5.0 公里，设体育场、伦博湾大道、石桥、沙丘和剧院 5 座车站，是瓦利凯地铁三条线中最短的一条。埃鲁塔姆区名意为「货仓之地」，物流园、冷链仓库和食品加工厂沿高速公路分布，领地的进口商品从埃鲁塔姆物流园分拨到全岛，水产和香料在这里加工包装后出口。区里住着 20 万人，3 号线串起区内的住宅、学校和商业街，上班的人出站后再换班车去物流园和加工厂。列车最高时速 100 公里，DC 1500 V 架空接触网供电，6 辆编组的 B 型车，CBTC 信号，全自动无人驾驶。\n线路一头是体育场站，一头是剧院站，本地人说 3 号线「一头喊加油，一头喊安可」：周末有球赛又有演出的晚上，两拨观众在车厢里相遇，一边是披着围巾的球迷，一边是捧着鲜花的戏迷。平日的早班车上多是去冷链仓库和加工厂上班的工人，下班时有人身上还带着一点虾和香料的味道，车厢里的空调把它吹得到处都是。\n伦博湾大道这个站名常让外地人摸不着头脑，伦博湾远在东南海岸的塔卢马兰。瓦利凯人自己也说不清来历，只说埃鲁塔姆的货反正要送到全岛各地，叫哪个湾都不算远。"
            en: "Vallikkai Metro Line 3 serves Eruttam District, the logistics district in the north of Vallikkai; in Ivuran it is \"Vallikkai Pitlorai Lorai 3\", its colour is orange, and it runs about 5.0 km with five stations, Stadium, Lumbo Bay Avenue, Stone Bridge, Dune and Theatre, the shortest of Vallikkai's three metro lines. Eruttam's name means \"land of warehouses\": logistics parks, cold stores and food processing plants stand along the expressway, the territory's imports are distributed from the Eruttam Logistics Park to the whole island, and seafood and spices are processed and packed here for export. The district is home to 200,000 people, and Line 3 strings together its housing, schools and shopping streets, with commuters changing at the stations to works buses for the logistics park and the processing plants. The trains reach 100 km/h on DC 1500 V overhead line, run as six-car B-type sets under CBTC signalling and are fully driverless.\nWith Stadium at one end and Theatre at the other, locals say Line 3 \"shouts 'come on!' at one end and 'encore!' at the other\": on weekend evenings with both a match and a show, the two crowds meet in the cars, football fans in scarves on one side and theatregoers holding flowers on the other. On ordinary days the early trains carry workers to the cold stores and processing plants, and on the way home some still carry a whiff of prawns and spices, which the air conditioning spreads through the whole car.\nLumbo Bay Avenue often baffles visitors, since Lumbo Bay is far away in Talumaran on the south-east coast. Vallikkai people cannot explain the name either; they just say that Eruttam's goods go all over the island anyway, so no bay is too far away to borrow a name from."
    - city: div_6kjc7x   # 埃武托拉公社
      names: { zh: 埃武托拉地铁, en: Evutola Metro, art-x-ivuran: Evutola Pitlorai }
      lines:
        - district: div_p3x7j4   # 哈马图区
          axis: 0
          notes:
            zh: "埃武托拉地铁 1 号线在埃武托拉公社的中心区哈马图区，伊武兰语叫「Evutola Pitlorai Lorai 1」，线路标识为红色，全长约 8.4 公里，自凤凰木街站起，经自由大道、塞里努岛路、学府、埃武托拉站、埃武托拉公社大食堂和莲塘大街，到北京站，共 8 座车站。哈马图区名意为「一起」，人民宫、公社大食堂和公社图书馆围着人民广场，区内的街道从广场向四周放射。线路在埃武托拉站与长夏真空磁悬浮换乘，是公社通往领地其他城市的门户。和公社的电车、公共汽车一样，地铁不收钱，车站也不设闸机。列车最高时速 100 公里，DC 1500 V 架空接触网供电，6 辆编组的 B 型车，CBTC 信号，全自动无人驾驶。\n中午前后是 1 号线最挤的时候：公社大食堂有 3 万个座位，周边上班的人都坐一两站过来吃饭，埃武托拉公社大食堂站的出口正对着食堂大门，站台上飘着当天菜单的香味。公社每周工作四天，第五天的车厢里多是去菜园、托儿所和公社图书馆做义工的人，还有背着工具箱去教孩子修自行车的退休老工人。\n从真空磁悬浮下来的外地旅客，常在埃武托拉站的进站口前犹豫，找不到刷卡的地方，站里的志愿者就笑着说一句「Tola evu」，挥手让他们直接进去。公社大会开会的日子，地铁加开班次，车厢里的屏幕轮流显示当天的议程和「周五菜」的投票结果。"
            en: "Evutola Metro Line 1 serves Hamatu District, the centre of the Evutola Commune; in Ivuran it is \"Evutola Pitlorai Lorai 1\", its colour is red, and it runs about 8.4 km from Flame Tree Street by way of Liberty Avenue, Serinu Island Road, College, Evutola Station, Evutola Commune Canteen and Lotus Pond Boulevard to Beijing, eight stations in all. Hamatu, whose name means \"together\", has the People's Palace, the Commune Canteen and the Commune Library round the People's Square, with streets radiating from the square in every direction. At Evutola Station the line meets the Everlong Summer Vacuum Maglev, making it the commune's gateway to the territory's other cities. Like the commune's trams and buses, the metro is free, and the stations have no ticket gates. The trains reach 100 km/h on DC 1500 V overhead line, run as six-car B-type sets under CBTC signalling and are fully driverless.\nLine 1 is busiest around midday: the Commune Canteen has 30,000 seats, people working nearby ride a stop or two to eat there, the exit at Evutola Commune Canteen opens right onto the canteen doors, and the scent of the day's menu drifts across the platform. The commune works a four-day week, and on the fifth day the cars are full of people going to volunteer at the vegetable gardens, nurseries and the Commune Library, and retired workers carrying toolboxes on their way to teach children to mend bicycles.\nVisitors stepping off the vacuum maglev often hesitate at the entrance at Evutola Station, looking for somewhere to tap a card, and a volunteer will smile, say \"Tola evu\" and wave them straight through. On days when the commune assembly meets, extra trains run, and the screens in the cars take turns showing the day's agenda and the results of the vote on the \"Friday dish\"."
        - district: div_qp9ner   # 奥鲁武区
          axis: 0
          notes:
            zh: "埃武托拉地铁 2 号线在公社的住宅区奥鲁武区，伊武兰语叫「Evutola Pitlorai Lorai 2」，线路标识为蓝色，全长约 8.6 公里，自回声站起，经博物馆大道、奥鲁武环形公社住宅、瓦利凯路、和平路、宪章路和团结大道，到拉萨站，共 8 座车站，比 1 号线略长。奥鲁武区名意为「环形的家」，环形公社住宅是一圈圈围合的多层住宅楼，中间是公共花园、托儿所和食堂，每个环住着两三千人，住房按家庭人数分配、不收租金。2 号线把这些住宅环串在一起，再接上公社的电车和公共汽车，居民去哈马图区的人民宫开会、去合作社和工厂上班都靠它，乘车同样免费。技术标准与领地其他地铁相同：最高时速 100 公里，DC 1500 V 架空接触网，6 辆编组的 B 型车，CBTC 信号，全自动无人驾驶。\n奥鲁武环形公社住宅站是全线最忙的车站，早上送孩子去托儿所的父母和赶去上班的年轻人在内院里分手，一个往托儿所走，一个往站口跑。白天车厢里多是老人，他们坐几站去别的环串门，在人家的内院里下一盘棋再回来；公共洗衣房、诊所和养老院都设在环的底层，老人们说，有了地铁，「整个奥鲁武就是一座大院子」。\n孩子们爱在回声站的站台上喊一声，听自己的声音能传多远。公社议事会讨论过要不要把站名改得更「有意义」，表决那天，家长们几乎全投了反对票，理由是「孩子们会不高兴」。"
            en: "Evutola Metro Line 2 serves Oruvu District, the commune's residential district; in Ivuran it is \"Evutola Pitlorai Lorai 2\", its colour is blue, and it runs about 8.6 km, a little longer than Line 1, from Echo by way of Museum Avenue, Oruvu Ring Homes, Vallikkai Road, Peace Road, Charter Road and Unity Avenue to Lhasa, eight stations in all. Oruvu's name means \"ring of homes\": the Oruvu Ring Homes are ring after ring of enclosed low-rise blocks around communal gardens, nurseries and canteens, each ring housing two or three thousand people, with homes allotted by family size and no rent charged. Line 2 strings these rings together and links them with the commune's trams and buses; residents rely on it to reach meetings at the People's Palace in Hamatu District and their jobs in the co-operatives and factories, and riding it is free as well. Its technical standard is the same as the territory's other metros: 100 km/h, DC 1500 V overhead line, six-car B-type trains, CBTC signalling and fully driverless operation.\nOruvu Ring Homes is the busiest station on the line: in the morning parents taking children to the nursery and young people hurrying to work part in the courtyard, one heading for the nursery, the other running for the station entrance. In the daytime the cars are mostly full of older people riding a few stops to visit another ring, where they play a game of chess in someone else's courtyard before coming home; the communal laundries, clinics and care homes are all on the ground floors of the rings, and the old folk say that with the metro \"the whole of Oruvu is one big courtyard\".\nChildren love to shout on the platform at Echo to hear how far their voices carry. The residents' assembly once debated renaming the stations to something more \"meaningful\"; on the day of the vote almost every parent voted against, on the grounds that \"the children would be upset\"."
    - city: div_khxhrn   # 米雷兰市（首府）
      names: { zh: 米雷兰地铁, en: Mirelan Metro, art-x-ivuran: Mirelan Pitlorai }
      lines:
        - district: div_z0z4vz   # 帕萨卢区，沿规划轴线
          axis: 0
          notes:
            zh: "米雷兰地铁 1 号线在首府米雷兰的行政中心帕萨卢区，伊武兰语叫「Mirelan Pitlorai Lorai 1」，线路标识为红色，全长约 3.6 公里，设卫生和人类服务部、长夏大街、领地政府和库瓦拉峰路 4 座车站，是领地第二短的地铁线，只比基拉努地铁 1 号线长 0.4 公里。帕萨卢区名意为「轴线」，1 号线就沿着规划轴线湖光大道铺设：轴线北端是政务院主楼所在的领地政府，南端是领地议会，中段是公民广场，广场西侧是领地图书馆；各部和中央派驻机构的大楼排在两侧，卫生和人类服务部在广场以南。长夏大街站在区中心，与过区中心的横向主干道长夏大街相交。列车最高时速 100 公里，DC 1500 V 架空接触网供电，6 辆编组的 B 型车，CBTC 信号，全自动无人驾驶。\n首府居民一半以上是公务员、研究人员和他们的家人，1 号线的早高峰几乎是一趟「公务专列」，人人拿着文件夹，手里多半还有一杯在咖啡摊买的本地咖啡。公务员大多住在步行可达的地方，晴天走路上班，反倒是下午阵雨来时坐地铁的人最多。\n领地议会开幕那天，议员们从湖边步行走过整条轴线进入议会，市民沿街撒花瓣，这条路因此叫「花瓣路」。地铁在这一天照常运行，只是站口的台阶上落满了花瓣，清洁工要扫到傍晚。"
            en: "Mirelan Metro Line 1 serves Pasalu District, the administrative centre of the capital, Mirelan; in Ivuran it is \"Mirelan Pitlorai Lorai 1\", its colour is red, and it runs about 3.6 km with four stations, Ministry of Health and Human Services, Everlong Summer Boulevard, Territorial Government and Mount Kuvala Road, the second-shortest metro line in the territory, only 0.4 km longer than Kilanu Metro Line 1. Pasalu's name means \"axis\", and Line 1 is laid along the planned axis, Lakelight Avenue: at the axis's northern end is the Territorial Government, the main building of the Executive Council, at its southern end the Territorial Assembly, and in the middle Civic Square, with the Territorial Library on its western side; the ministries and the central government's resident offices stand on either side, the Ministry of Health and Human Services south of the square. Everlong Summer Boulevard station is at the centre of the district, where the line crosses Everlong Summer Boulevard, the main cross street. The trains reach 100 km/h on DC 1500 V overhead line, run as six-car B-type sets under CBTC signalling and are fully driverless.\nMore than half the capital's people are civil servants, researchers and their families, and Line 1's morning rush is practically an \"official special\", everyone carrying a folder and most of them a cup of local coffee from a street stall as well. Most civil servants live within walking distance and walk to work on fine days, so the line is busiest not in the rush hour but when the afternoon shower arrives.\nOn the day the Territorial Assembly opens, members walk the whole length of the axis from the lakeside into the Assembly while citizens strew petals along the way, which is why the road is called the \"Petal Road\". The metro runs as usual that day, but the steps at the station entrances are covered in petals, and the cleaners are sweeping until evening."
        - district: div_f0wwdt   # 翁贝尔区
          axis: 0
          notes:
            zh: "米雷兰地铁 2 号线在首府湖畔的住宅区翁贝尔区，伊武兰语叫「Mirelan Pitlorai Lorai 2」，线路标识为蓝色，全长约 4.8 公里，自晨星站起，经米雷兰站、灰狼和奥鲁卡路，到翠鸟路站，共 5 座车站。翁贝尔区名意为「湖」，翁贝尔哈努湖岸修有长长的湖滨步道和公共浴场，住宅以低层的公寓和庭院住宅为主，许多楼房带着遮阳的长廊和屋顶花园，湖畔还有领地的公共疗养院和水上运动中心。线路在米雷兰站与长夏真空磁悬浮和米纳高速铁路换乘，从领地各地来首府开会、办事的人大多在这里换乘地铁。列车最高时速 100 公里，DC 1500 V 架空接触网供电，6 辆编组的 B 型车，CBTC 信号，全自动无人驾驶。\n米雷兰是领地少有需要毛衣的城市，白天二十四五度，夜里常降到十度上下。在米雷兰站的站台上一眼就能分出谁是外地人：胳膊上搭着一件毛衣、刚从沿海坐真空磁悬浮上来的，多半是来开会的。周末，2 号线挤满去湖边划船、游泳的首府居民，有人扛着桨，有人抱着游泳圈，下了车一路说笑着走向湖滨。\n晨星站是首班车的起点，天还没亮，去湖边烤鱼的渔家和疗养院上早班的护士就在这里上车。本地人说 2 号线的站名排得巧，从「晨星」坐到「翠鸟」，正好是湖边一个早晨从启明星到鸟叫的样子。"
            en: "Mirelan Metro Line 2 serves Ombel District, the capital's lakeside residential district; in Ivuran it is \"Mirelan Pitlorai Lorai 2\", its colour is blue, and it runs about 4.8 km from Morning Star by way of Mirelan Station, Wolf and Oruka Road to Kingfisher Road, five stations in all. Ombel's name means \"lake\": a long promenade and public bathing beaches line the shore of Lake Ombelhanu, homes are mostly low-rise flats and courtyard houses, many of them with shaded loggias and roof gardens, and the lakeside also has the territory's public sanatorium and a water sports centre. At Mirelan Station the line meets the Everlong Summer Vacuum Maglev and the Mirelan–Nalumai High-Speed Railway, and most people coming to the capital from around the territory for meetings and official business change to the metro here. The trains reach 100 km/h on DC 1500 V overhead line, run as six-car B-type sets under CBTC signalling and are fully driverless.\nMirelan is one of the few cities in the territory where you need a jumper, at 24 or 25 °C by day and often down to around 10 °C at night. On the platforms of Mirelan Station you can tell the visitors at a glance: anyone with a jumper over one arm, just up from the coast on the vacuum maglev, is most likely here for a meeting. At weekends Line 2 is packed with townspeople going boating and swimming on the lake, some shouldering oars, some clutching rubber rings, chatting and laughing all the way to the shore when they get off.\nMorning Star is where the first train starts; before dawn the fishing families who grill fish by the lake and the nurses on the sanatorium's early shift board here. Locals say the station names are nicely arranged: riding from \"Morning Star\" to \"Kingfisher\" is a lakeside morning from the morning star to the first birdsong."
    - city: div_7z142e   # 乌诺卡里市
      names: { zh: 乌诺卡里地铁, en: Unokari Metro, art-x-ivuran: Unokari Pitlorai }
      lines:
        - district: div_y57m7b   # 卡里纳区
          axis: 0
          notes:
            zh: "乌诺卡里地铁 1 号线是乌诺卡里市唯一的地铁线，在山间盆地里的城区卡里纳区，伊武兰语叫「Unokari Pitlorai Lorai 1」，线路标识为红色，全长约 8.2 公里，自乌拉韦劳峰大道站起，经蒂拉凯苏山脉街、号角、李家、风车、人民大道和钟楼街，到博物馆站，共 8 座车站。卡里纳区名意为「山谷之城」，矿业公司的总部、矿业学院和医院在这里，矿工家庭住在城区的公共住房里，山坡上的老城保留着伊武兰人的木屋街巷。盆地里平地有限，1 号线把老城、新住宅区和矿业公司的办公楼串在一起；去乌诺维拉矿区和佩鲁诺冶炼厂上班的人在城区坐地铁，再换矿区的班车进山。列车最高时速 100 公里，DC 1500 V 架空接触网供电，6 辆编组的 B 型车，CBTC 信号，全自动无人驾驶。\n傍晚下了班的矿工连眉毛都被红土染红，他们先去佩鲁诺区的澡堂「洗红」，再坐地铁回家，车厢里的座椅特意选了耐脏的深色。矿业学院的学生也常坐这条线，背着地质锤和岩芯箱去实习，车厢里叮叮当当响成一片。\n开头两站的站名一个取乌拉韦劳峰，一个取蒂拉凯苏山脉，可这两处都远在主岛的西南半部，乌诺卡里的人打趣说，自家的矿山明明在乌诺凯苏，地铁却「替别人家的山做广告」。"
            en: "Unokari Metro Line 1 is Unokari City's only metro line, serving Karina District, the town proper in a mountain basin; in Ivuran it is \"Unokari Pitlorai Lorai 1\", its colour is red, and it runs about 8.2 km from Mount Uravelau Avenue by way of Tirakesu Mountains Street, Horn, Lijia, Windmill, People's Avenue and Clock Tower Street to Museum, eight stations in all. Karina's name means \"city of the valley\": the mining company's headquarters, the mining college and the hospital are here, miners' families live in the town's public housing, and the old town on the hillside keeps its lanes of Ivuran timber houses. Flat land is scarce in the basin, and Line 1 strings together the old town, the new housing estates and the mining company's offices; people working at the Unovila mines and the Peruno Smelter ride the metro in town and change to the mine buses into the hills. The trains reach 100 km/h on DC 1500 V overhead line, run as six-car B-type sets under CBTC signalling and are fully driverless.\nMiners coming off shift in the evening are red with laterite down to their eyebrows; they go first to the bathhouses of Peruno District to \"wash off the red\" and then take the metro home, and the seats were deliberately chosen in a dark colour that does not show the dirt. Students of the mining college ride the line often too, carrying geological hammers and core boxes out to their placements, and the cars rattle and clink with their gear.\nThe first two stations are named after Mount Uravelau and the Tirakesu Mountains, both far away in the south-western half of the main island, and Unokari people joke that their own mines are in the Unokesu, yet their metro \"advertises somebody else's mountains\"."
    - city: div_8hy4nc   # 彭纳拉姆市
      names: { zh: 彭纳拉姆地铁, en: Pennaram Metro, art-x-ivuran: Pennaram Pitlorai }
      lines:
        - district: div_a3c8d6   # 马伦杜尔区
          axis: 0
          notes:
            zh: "彭纳拉姆地铁 1 号线是彭纳拉姆市唯一的地铁线，在城区马伦杜尔区，伊武兰语叫「Pennaram Pitlorai Lorai 1」，线路标识为红色，全长约 5.1 公里，自鹿鸣站起，经缆绳路、织布大道和奥鲁卡大道，到天文台站，共 5 座车站。马伦杜尔区名意为「树荫下的村」，城区的街巷沿着山坡层层展开，马伦杜尔香料市场的大棚里堆满胡椒、豆蔻和肉桂，老港边的石砌香料仓库和老商行仍在使用。坡陡巷窄，地铁从山坡底下打隧道穿过，有的车站埋得很深，出站要坐好几段长长的自动扶梯。列车最高时速 100 公里，DC 1500 V 架空接触网供电，6 辆编组的 B 型车，CBTC 信号，全自动无人驾驶。\n全市本地人近八成，许多家庭世代经营香料园，早班车上常有提着香料筐去市场的老人，车厢里一股辛辣的香味。胡椒收获的季节，外地游客进站没多久就忍不住打喷嚏，本地人笑说这是「彭纳拉姆的欢迎礼」，地铁里也不例外。\n缆绳路和织布大道两个站名留着老港的记忆，旧时人们在这一带搓缆绳、织麻袋，好把胡椒装上船运往远方。另一头的天文台站地势高，雨停后的晴夜，孩子们坐车上去看星星，再沿着坡路一路走回家。"
            en: "Pennaram Metro Line 1 is Pennaram City's only metro line, serving Marandur District, the town proper; in Ivuran it is \"Pennaram Pitlorai Lorai 1\", its colour is red, and it runs about 5.1 km from Deer Call by way of Ropewalk Road, Weavers' Avenue and Oruka Avenue to Observatory, five stations in all. Marandur's name means \"village in the shade\": the town's lanes climb the hillside tier upon tier, the halls of the Marandur Spice Market are piled with pepper, cardamom and cinnamon, and the stone spice warehouses and old trading houses by the old harbour are still in use. With steep slopes and narrow lanes above, the metro is tunnelled beneath the hillside, and some stations lie so deep that leaving them takes several long escalators. The trains reach 100 km/h on DC 1500 V overhead line, run as six-car B-type sets under CBTC signalling and are fully driverless.\nNearly eight in ten of the city's people are locals, and many families have run spice gardens for generations; on the early trains there are often old people carrying baskets of spice to market, and the cars smell sharp and fragrant. In the pepper harvest visitors start sneezing soon after entering a station, and locals laugh that it is \"Pennaram's welcome\", underground as much as anywhere.\nRopewalk Road and Weavers' Avenue keep the memory of the old harbour, where people once twisted rope and wove sacks to ship the pepper far away. At the other end, Observatory stands on high ground, and on clear nights after rain children ride up to look at the stars and then walk all the way home down the slopes."
    - city: div_bca7d9   # 纳卢迈市
      names: { zh: 纳卢迈地铁, en: Nalumai Metro, art-x-ivuran: Nalumai Pitlorai }
      lines:
        - district: div_afy2b3   # 塞纳卢区
          axis: 0
          notes:
            zh: "纳卢迈地铁 1 号线是纳卢迈市唯一的地铁线，在城区塞纳卢区，伊武兰语叫「Nalumai Pitlorai Lorai 1」，线路标识为红色，全长约 6.3 公里，自杭州路站起，经维兰塔湾大道、雪鸮、茉莉街、纳卢迈站和奥卢路，到鲸歌站，共 7 座车站。塞纳卢区名意为「浪的中心」，海滨大道边是塞纳卢珍珠市场、海鲜餐馆和度假酒店，老城里有水果批发市场和果脯加工厂。线路在纳卢迈站与米纳高速铁路和塔纳高速铁路换乘，从首府和塔卢马兰来度假的游客大多在这里下高铁、换地铁。列车最高时速 100 公里，DC 1500 V 架空接触网供电，6 辆编组的 B 型车，CBTC 信号，全自动无人驾驶。\n全市本地人近八成，早班车上是去水果批发市场和果脯厂上班的人，白天换成了拎着泳衣去海滩、去珍珠市场挑首饰的游客，傍晚又挤满去海滨长堤看日落的人。榴莲季里，城里的公交车贴着「请勿携带榴莲」的告示，地铁也贴了一张，可车厢里还是常常飘着一股果香，没人真去较这个真。\n雪鸮站是游客最爱拍照的站名：在终年炎热的海滨城市，谁也没见过雪鸮，站里的壁画上于是画了一只白色的猫头鹰，蹲在椰子树上。另一头的鲸歌站名字浪漫，本地人却说，鲸鱼的歌要坐船出海才听得到。"
            en: "Nalumai Metro Line 1 is Nalumai City's only metro line, serving Senalu District, the town proper; in Ivuran it is \"Nalumai Pitlorai Lorai 1\", its colour is red, and it runs about 6.3 km from Hangzhou Road by way of Viranta Bay Avenue, Snowy Owl, Jasmine Street, Nalumai Station and Olu Road to Whalesong, seven stations in all. Senalu's name means \"heart of the waves\": the Senalu Pearl Market, seafood restaurants and resort hotels line the seafront avenue, and the old town has a wholesale fruit market and dried-fruit factories. At Nalumai Station the line meets the Mirelan–Nalumai and Talumaran–Nalumai high-speed railways, and most holidaymakers from the capital and Talumaran step off the high-speed train and onto the metro here. The trains reach 100 km/h on DC 1500 V overhead line, run as six-car B-type sets under CBTC signalling and are fully driverless.\nNearly eight in ten of the city's people are locals; the early trains carry workers to the wholesale fruit market and the dried-fruit factories, in the daytime they fill with visitors carrying swimming things to the beach or going to choose jewellery at the pearl market, and in the evening they are crowded again with people heading for the long seafront mole to watch the sunset. In durian season the city's buses carry \"no durians\" notices, and the metro has put one up too, yet the cars still often smell of fruit, and nobody makes much of a fuss about it.\nSnowy Owl is the station name visitors most love to photograph: nobody in this hot seaside city has ever seen a snowy owl, so the mural in the station shows a white owl perched in a coconut palm. Whalesong at the other end has a romantic name, but locals point out that to hear the whales sing you have to take a boat out to sea."

