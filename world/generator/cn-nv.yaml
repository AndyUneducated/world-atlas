# Procedural generator parameters for North Viking Island (layout draft A, "spine").
#
# All positions and lengths are in design kilometres inside a local equal-area
# (sinusoidal) frame whose centre maps to frame.origin_lonlat; frame.scale converts
# design km to real km on the planet (areas scale by its square). Changing a number
# here and re-running `npm run data` rebuilds coastline, terrain, rivers, boundaries
# and roads. Division areas are taken from world/divisions/*.yaml (area_km2, real km²)
# and enforced.
territory: div_fbfqv9
seed: 11
frame:
  origin_lonlat: [8.0, 60.0]
  size_km: [320, 190]
  scale: 2.8284  # √8: the island is 8× the area of the original sketch
  resolution_km: 0.25

land:
  # Gaussian lobes: [cx, cy, rx, ry, rotation_deg, weight]; negative weight carves bays.
  lobes:
    - [160, 95, 135, 46, 0, 1.0]
    - [70, 112, 48, 36, 0, 0.55]
    - [250, 82, 48, 42, 0, 0.6]
    - [195, 48, 45, 22, -8, 0.45]
    - [30, 80, 25, 30, 0, 0.4]
    - [204, 128, 42, 20, 12, 0.5]   # Erding valley mouth on the north coast
  coast_noise: { amplitude: 0.14, scale_km: 60, octaves: 7, detail_amplitude: 0.05, detail_scale_km: 9 }
  # Fjords: polyline cut into the coast, [path, width_km, depth].
  fjords:
    - [[[2, 128], [30, 118], [42, 121]], 1.3, 0.9]
    - [[[0, 100], [24, 98]], 1.2, 0.8]
    - [[[58, 175], [64, 140]], 1.4, 0.9]
    - [[[120, 190], [118, 140]], 1.2, 0.8]

terrain:
  max_elevation_m: 4800  # soft ceiling (tanh): the north-east massif tops out near 4500 m
  ridges:
    - { feature: nat_b9bmz2, path: [[150, 128], [144, 98], [150, 66], [162, 38]], height_m: 1900, width_km: 13 }
    - { feature: nat_qsrakx, path: [[212, 112], [236, 116], [258, 112]], height_m: 2100, width_km: 8 }
    - { feature: nat_qsrakx, path: [[212, 112], [208, 82], [214, 56]], height_m: 2200, width_km: 8 }
    - { feature: nat_qsrakx, path: [[214, 56], [240, 50], [262, 56]], height_m: 1900, width_km: 8 }
    - { feature: nat_papy7d, path: [[38, 132], [72, 136], [96, 130]], height_m: 1150, width_km: 9 }
    # Bergland Hills between Viking Port and Freedom City, like the hills around a bay plain: a
    # narrow, steep ridge, so the straight G-NV-2 has to tunnel through rather than climb over
    - { feature: nat_h7v2kd, path: [[51, 65], [46, 72], [41, 80]], height_m: 500, width_km: 1.8 }
    # North-east high massif on the Maslin Range's northern arm: a crest and three summits above 4000 m
    # (heights are before the tanh ceiling, which compresses them strongly near max_elevation_m)
    - { feature: nat_qsrakx, path: [[240, 115], [250, 116.5], [260, 113]], height_m: 2700, width_km: 5 }
    - { feature: nat_qsrakx, path: [[244.5, 115.5], [245.5, 115.8]], height_m: 3800, width_km: 2.5 }
    - { feature: nat_qsrakx, path: [[251.5, 116.5], [252.5, 116.6]], height_m: 5200, width_km: 2.5 }
    - { feature: nat_qsrakx, path: [[258, 113.5], [258.8, 113]], height_m: 1400, width_km: 2.5 }
    # Iron Knoll on the southern arm, kept distinct from the Beckerle lowland next to it
    - { feature: nat_qsrakx, path: [[229.6, 50.2], [230.2, 50.6]], height_m: 500, width_km: 2.5 }
  # Plains flatten terrain: [cx, cy, radius_km, strength 0..1]
  plains:
    - [108, 72, 28, 0.75]
    - [265, 82, 10, 0.7]
    # City-centre lowlands near sea level (Shanghai / bay plain): Viking Port, Freedom City,
    # the Beckerle free trade zone and New City
    - [31.9, 63.6, 10, 0.96]   # 瓦尔维克区
    - [18.4, 87.4, 8, 0.9]     # 海门区
    - [41.9, 90.1, 9, 0.9]     # 斯坦堡区、奥斯特海姆区
    - [20.1, 100.9, 8, 0.85]   # 菲尔内斯区
    - [58.9, 82.6, 10, 0.95]   # 白桦区
    - [68.9, 64.6, 9, 0.95]    # 沙洲区
    - [239.5, 46.5, 8, 0.95]   # 贝克勒自由贸易区
    - [183.1, 58.1, 10, 0.93]  # 青坪区、米特区
    # 澄湖 basin in the northern Lorond Range: the lakeside town and the lake
    - [150.5, 118.3, 5, 0.9]
    - [150.4, 122.6, 5, 0.88]
  # Valleys: a floor falling from source_m at the first point to the sea at the last. The floor
  # only guides the river where it lies below the surrounding land, so source_m stays under the
  # Erding plain (~120 m); the valley rises north of the New City lowland, which drains south.
  valleys:
    - { feature: nat_ww491j, path: [[180, 62], [186, 80], [190, 94], [193, 112], [186, 127], [172, 139]], width_km: 14, source_m: 120, strength: 0.95 }

hydrology:
  river_min_drainage_km2: 25  # design km²
  # Rivers draining at least this much reach the naming list (features with detect.kind: river).
  river_candidate_km2: 150
  # River mouths draining at least this much are listed as estuaries.
  estuary_km2: 700
  # Lakes: a lobed disc of radius_km (design km) at offset_km (real km) from the district centre.
  lakes:
    - { feature: nat_jaxtgn, in: div_t8bg0d, radius_km: 3.0, offset_km: [0, 13] }     # 澄湖：澄湖区集镇北岸
    - { feature: nat_kxhv1k, in: div_0tsyzy, radius_km: 1.8, offset_km: [-16, 14] }   # 雪湖
    - { feature: nat_9mpvb7, in: div_zs7kjk, radius_km: 1.0, offset_km: [-16, 10] }   # 鹿鸣湖：西北城区以西的林间
    - { feature: nat_j67079, in: div_0t2t36, radius_km: 0.9, offset_km: [11, 17.6] }  # 深峡湖：厄定河上
  named_rivers:
    # The named river is the largest stream crossing the given division (city or district)
    # that no river above it in this list already follows; one that runs into such a river
    # ends at the confluence as its tributary.
    - { feature: nat_x9bmeh, through: div_g4a8q0 }
    - { feature: nat_9h7mcd, through: div_b1dx32 }
    - { feature: nat_ww491j, through: div_8emjne }

# Coastal landform detection (design km / km²). Detected landforms are named in
# world/features/*.yaml by `detect: {kind, at_km}`; the build pairs each entry with the
# nearest landform of that kind and lists the rest in .cache/candidates-<id>.json.
coast:
  island_min_km2: 0.8
  bay_close_km: 5        # coast that wraps around water narrower than 2× this forms a bay
  bay_min_km2: 6
  cape_open_km: 2.5      # land sticking out further than this from the coast forms a cape
  cape_min_prominence_km: 1.5
  strait_max_gap_km: 4
  match_radius_km: 10

# Mountain landforms, named the same way as coastal ones (see pipeline/atlas/relief.py).
relief:
  peak_min_elev_m: 700
  peak_min_prominence_m: 150
  pass_min_elev_m: 450     # key saddles of the peaks above this become passes
  snowline_m: 2200         # on flat ground; north-facing slopes hold ice down to snowline − aspect
  snowline_aspect_m: 300
  glacier_max_slope_deg: 42
  ice_min_km2: 0.5         # smallest ice field drawn (design km²)
  glacier_min_km2: 4       # smallest ice field listed for naming

# Land cover rules (real units); see pipeline/atlas/landcover.py.
landcover:
  urban_density_per_km2: 3000   # built-up area around each district centre = population / this
  urban_max_slope_deg: 12
  urban_terrace_slope_deg: 22   # mountain towns with no gentler ground near their centre
  urban_max_area_ratio: 2       # a town whose buildable ground is scattered keeps only the nearest of it
  wetland_max_elev_m: 90
  wetland_wetness: 2.4          # log(upstream area) − 0.6 × slope, plus noise
  farm_max_elev_m: 300
  farm_max_slope_deg: 5
  farm_reach_km: 22             # farmland within this distance of a built-up area
  treeline_m: 800               # lower on north-facing slopes
  treeline_aspect_m: 150
  rock_above_treeline_m: 650
  rock_slope_deg: 31

# City street networks inside the built-up land cover (real km; see pipeline/atlas/streets.py).
# style: planned (regular grid on two axes), mixed (looser grid and a ring road) or organic
# (radial avenues, a ring, irregular lanes). angle_deg: direction of the first axis, east = 0.
# mix: factors on the style's building typology weights (slabs, towers, perimeter, houses,
# podium, industrial, civic, park). named: fixed names for grid arterials (planned and mixed
# styles); axis 0/1 and line n count from the district centre.
streets:
  cities: [div_nbrnfr, div_m41gwn, div_0yef9a, div_k4s990, div_yjghe9, div_k4hg7b, div_da3s38, div_q4d6n6, div_ygk521, div_prcxzt, div_rdypg7, div_8emjne]
  arterial_spacing_km: 1.5
  neighbourhood_km: 1.3
  local_spacing_km: { planned: [0.15, 0.2], mixed: [0.13, 0.19], organic: [0.1, 0.16] }
  warp_km: { planned: 0.02, mixed: 0.05, organic: 0.09 }
  warp_wavelength_km: 1.6
  river_gap_km: 0.05
  districts:
    div_16cxr8: { style: planned, angle_deg: 33.7 }  # 白桦区：1990 年新建的首府，人民大道从区中心直通议会综合办公区
    div_b1dx32: { style: mixed, angle_deg: -34 }     # 北河区：北河大道与北河流向平行，人民大道与之垂直
    div_g4a8q0: { style: organic }                   # 沙洲区：河口沙洲上的老港区
    div_z29w6h: { style: mixed, mix: { industrial: 2.5, houses: 0.6 } }      # 瓦尔维克区：鲸湾港区与临港产业带
    div_pkfa1g: { style: mixed, mix: { podium: 1.4 } }                       # 菲尔内斯区：客运码头、邮轮与海关
    div_t3bfmm: { style: organic }                                           # 斯坦堡区：围绕维京时代石垒形成的旧城
    div_k1yr6m: { style: planned, mix: { towers: 1.6, podium: 1.3, industrial: 0.3 } }  # 海门区：二十一世纪的商务居住带
    div_zs7kjk: { style: planned, mix: { civic: 2.0 } }                      # 鹿鸣区：1990 年建市时规划的市级机关与广电区
    div_g27nda: { style: planned, mix: { civic: 1.8, industrial: 0.6 } }     # 望星区：科学大道沿线的科研区
    div_fr1vq9: { style: mixed, mix: { civic: 2.5, park: 1.5 } }             # 林道区：大学城
    div_479xae: { style: organic, mix: { houses: 1.5, park: 2.5, industrial: 0.3 } }  # 寒岭区：低密度科研居住与生态缓冲带
    div_7rk2mh: { style: planned, mix: { slabs: 1.3, towers: 1.2, industrial: 0.4 } }  # 奥斯特海姆区：二十一世纪的东部住宅新城
    div_b3qw9e: { style: organic, mix: { houses: 2.0, park: 2.5, industrial: 0.2 } }   # 贝格兰区：丘陵上的低密度住宅与森林公园
    div_s8f4kt: { style: planned, mix: { civic: 2.2, park: 1.4, industrial: 0.5 } }    # 科学城：实验室、大学分校与航天企业
    div_m2tz6c: { style: planned, angle_deg: 12, mix: { towers: 1.8, podium: 1.6, civic: 1.5, industrial: 0.2 } }  # 米特区：2000 年代的新市中心与商务区
    div_z8yxye: { style: planned, angle_deg: 12, mix: { towers: 1.5, podium: 1.2, industrial: 0.5 } }  # 青坪区：高层住宅、商业与轨道交通枢纽
    div_s1qwxh: { style: planned, mix: { slabs: 1.5, civic: 1.4, industrial: 0.3 } }   # 北苑区：成片新建社区与学校
    div_hyxnpg: { style: mixed, angle_deg: -36, mix: { industrial: 1.5, podium: 1.1, houses: 0.8 } }  # 南驿区：通往萨科勒的快速路、公交走廊与物流园
    div_0wvh63: { style: mixed, mix: { houses: 1.6, industrial: 1.4, towers: 0.3 } }   # 勒北区：农牧核心的集镇，粮仓与农产品加工
    div_davn2j: { style: organic, mix: { houses: 2.2, park: 1.8, industrial: 0.4, towers: 0.2 } }  # 丰谷区：酒庄、民宿与丰收节
    div_t8bg0d: { style: organic, mix: { houses: 2.0, park: 2.2, industrial: 0.2, towers: 0.2 } }  # 澄湖区：环湖集镇与水上休闲
    div_6byxb5: { style: planned, mix: { industrial: 2.6, slabs: 1.2, houses: 0.5 } }  # 铁岗区：1990 年代起布局的制造业园区与工人新村
