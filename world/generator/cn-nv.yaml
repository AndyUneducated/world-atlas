# City metro systems (real km; see build_metro in pipeline/build.py). Each line runs straight along
# street-grid axis 0 or 1 of a district (the main axis of its built-up area where it has no streets
# yet) through the district centre moved by at_km, across the built-up area, and on to the places
# named by from / to. Stations are about spacing_km apart; crossing lines share a station and a
# line passing a railway station stops there. Lines are numbered in order.
metro:
  spacing_km: 1.2
  cities:
    - city: div_nbrnfr   # 自由市
      names: { zh: 自由市地铁, en: Freedom City Metro, art-x-viking: Freistad U-Bahn, art-x-buckham: Metropolitana di Frei }
      lines:
        - district: div_16cxr8                    # 人民大道下，经人民广场至议会综合办公区
          axis: 0
          notes:
            zh: "自由市地铁1号线全长 8.5 公里，设 8 座车站，全线都在白桦区内，标识色为红色，是首府的「政务线」。线路一端起自青岛站，经团结大道、博爱大街两站到达自由市站，在这里与地铁2号线、自勒高速铁路和维西磁悬浮换乘，随后依次经过领地图书馆、人民广场、政策和计划委员会三站，终点是雪鸮站。白桦区是自由市的行政与文化核心，政务院各部沿人民大道排成「政务院大街」，领地政府、议会综合办公区和自由市政厅都在区内；人民广场四周依次排开领地博物馆、领地图书馆和自由市大剧院，自由塔在广场东侧拔地而起，1 号线的中段正好从这片机关与文化设施中间穿过。政策和计划委员会站以北维京岛领地政策和计划委员会命名，是公务员最集中的一站。列车最高时速 100 公里，DC 1500 V 架空接触网供电，6 辆编组 B 型车，CBTC 信号，GoA4 级全自动无人驾驶。\n早上八点前后，1 号线的车厢里几乎全是提着公文包的公务员，九点以后换成去博物馆参观的学生团和游客。冬天领地图书馆开到午夜，末班车上常坐满抱着书、打着哈欠的大学生，站务员说这是全线「最安静的一班车」。每届领地议会开幕的晚上，大剧院在广场上直播免费音乐会，人民广场站的出口一直挤到深夜，裹着毯子的市民从车站鱼贯而出，散场后又带着一身寒气挤回车厢。"
            en: "Freedom City Metro Line 1 is 8.5 km long with eight stations, all within Birchwood District. Its colour is red, and it is the capital's \"government line\". From Qingdao station at one end it passes Unity Avenue and Fraternity Boulevard to reach Freedom City Station, where it meets Metro Line 2, the Freedom City–Lekor High-Speed Railway and the Viking Port–Northwest Maglev, then runs through Territorial Library, People's Square and Policy and Planning Commission to its terminus at Snowy Owl. Birchwood is the administrative and cultural heart of Freedom City: the ministries of the Executive Council line People's Avenue as \"Executive Council Row\", and the territorial government, the Parliament Complex and Freedom City Hall are all in the district. Around People's Square stand the Territorial Museum, the Territorial Library and the Freedom City Grand Theatre, with Liberty Tower rising on its east side, and the middle of Line 1 runs right through this cluster of offices and cultural buildings. Policy and Planning Commission station, named after the North Viking Island Policy and Planning Commission, has the most civil servants of any stop. Trains reach 100 km/h on a DC 1500 V overhead supply, with six-car B-type trains and CBTC signalling for fully driverless GoA4 operation.\nAround eight in the morning Line 1's carriages are almost all civil servants with briefcases; after nine they give way to school groups and tourists heading for the museum. In winter the Territorial Library stays open until midnight, and the last train is often full of yawning university students hugging their books; station staff call it the line's \"quietest train\". On the opening night of each Parliament, when the Grand Theatre relays its free concert onto the square, the exits at People's Square stay crowded late into the night: residents wrapped in blankets stream out of the station and, when the music ends, squeeze back into the carriages bringing the cold in with them."
        - district: div_16cxr8    # 自由大道下，南至自由市机场
          axis: 1
          to: poi_3tcbx9
          notes:
            zh: "自由市地铁2号线全长 11.8 公里，设 11 座车站，是首府最长的地铁线，标识色为蓝色，全线都在白桦区内。线路一端起自马斯林山路站，经日晷、夏至大道、铁岬大道、广州大道等站进入首府棋盘格式的街区，在自由市站与地铁1号线、自勒高速铁路和维西磁悬浮换乘，再经广场路、昆明大道、松林和海燕各站，终点是台地边缘的自由市机场站。沿线车站多以相交的大道和街道命名。自由市站是全城唯一的四线换乘站，去维京港、勒克尔和西北市出差的公务员多在这里换乘城际列车；自由市机场主要飞往维京港、天城和马斯林山，2 号线让机场与政务中心之间只隔一趟车。列车最高时速 100 公里，DC 1500 V 架空接触网供电，6 辆编组 B 型车，CBTC 信号，GoA4 级全自动无人驾驶。\n白桦区白天人潮涌入、夜里安静下来，2 号线的客流也跟着起落：早高峰从机场一头进城的车厢里坐满了刚下早班飞机的公务员和赶去北维京岛大学上课的学生，晚上八点以后，一节车厢常常只有几位乘客。首府人冬天照样骑车上班，可一遇暴雪，2 号线的乘客就会突然多出一倍，站务员管这种日子叫「雪天加班」。海燕站出口离跑道不远，飞机起降时从头顶低低掠过，拍照的孩子们掐着时间，等飞机和进站的列车「同框」。"
            en: "Freedom City Metro Line 2 is 11.8 km long with 11 stations, the longest metro line in the capital. Its colour is blue and it runs entirely within Birchwood District. From Maslin Mountain Road station at one end it passes Sundial, Midsummer Avenue, Iron Point Avenue, Guangzhou Avenue and other stations into the capital's grid of streets, meets Metro Line 1, the Freedom City–Lekor High-Speed Railway and the Viking Port–Northwest Maglev at Freedom City Station, then continues through Square Road, Kunming Avenue, Pinewood and Petrel to its terminus at Freedom City Airport on the edge of the terrace. Most stations are named after the avenues and streets they cross. Freedom City Station is the only four-line interchange in the city, where civil servants bound for Viking Port, Lekor and Northwest change to intercity trains; Freedom City Airport mainly serves Viking Port, Skytown and Maslin Mountain, and Line 2 puts it a single ride from the government quarter. Trains reach 100 km/h on a DC 1500 V overhead supply, with six-car B-type trains and CBTC signalling for fully driverless GoA4 operation.\nBirchwood fills up by day and goes quiet at night, and Line 2's traffic rises and falls with it. In the morning peak, trains coming in from the airport end are packed with civil servants off the early flights and students hurrying to classes at the University of North Viking Island; after eight in the evening a carriage often holds only a handful of passengers. People in the capital cycle to work all winter, but when a blizzard comes Line 2's ridership suddenly doubles, and station staff call those \"snow overtime\" days. The exit at Petrel is not far from the runway, and as aircraft pass low overhead, children with cameras time their shots to catch a plane and an arriving train in the same frame."
    - city: div_m41gwn   # 维京港市
      names: { zh: 维京港地铁, en: Viking Port Metro, art-x-viking: Veiling Havn U-Bahn, art-x-buckham: Metropolitana di Veiling Porto }
      lines:
        - district: div_z29w6h                  # 瓦尔维克区西北—东南线
          axis: 0
          at_km: [0.2, -2.7]
          notes:
            zh: "维京港地铁1号线全长 12.4 公里，设 11 座车站，是维京港最长的地铁线，全线都在瓦尔维克区内，标识色为红色。线路一端起自春晓街站，第二站鲸湾港站就在港区边上，随后经瀑布站，在隆迪纳亚湾路站与 2 号线换乘，再经龙首、杉顶大道、柳岸大道、樱桃、图书馆和天文台各站，终点是白桦站。瓦尔维克在维京语中意为「鲸湾」，旧时是捕鲸站所在的海湾，如今人口三十一万，是全市人口最多的区和领地最大的港区：鲸湾港沿湾岸排开集装箱、散货和滚装码头，临港产业带布满船舶修理厂、冷链仓库和机械电气工厂，维京港市政厅、中央广场、鲸湾捕鲸站博物馆和全领地最大的维京港体育场也都在区内。1 号线的乘客以港口工人、工厂职工和在市中心上班的人为主。列车最高时速 100 公里，DC 1500 V 架空接触网供电，6 辆编组 B 型车，CBTC 信号，GoA4 级全自动无人驾驶。\n鲸湾港站是全线最有港口气息的一站，换班时站台上满是穿反光背心的码头工人，车站的广播用中文和维京语报站，码头上的人说维京语那一遍「才算数」。维京港体育场有比赛的日子，1 号线和 2 号线都加开班次，球迷一路唱着歌进站。夏至那一夜，1 号线通宵运行，载着去鲸湾港边听午夜鸣笛的人来回奔忙。"
            en: "Viking Port Metro Line 1 is 12.4 km long with 11 stations, the longest metro line in Viking Port, running entirely within Walvik District. Its colour is red. It starts at Spring Dawn Street; the second station, Walvik Harbour, sits on the edge of the port; it then passes Waterfall, meets Line 2 at Rondinaia Bay Road and continues through Dragon Prow, Fir Top Avenue, Willow Avenue, Cherry, Library and Observatory to its terminus at Birch. Walvik means \"whale bay\" in Viking, the bay where the old whaling station stood. Today it has 310,000 people, the most populous district in the city and the territory's largest port area: Walvik Harbour lines the bay with container, bulk and ro-ro berths, the waterfront industrial belt is full of ship repair yards, cold stores and machinery and electrical plants, and Viking Port City Hall, the Central Square, the Walvik Whaling Station Museum and Viking Port Stadium, the biggest in the territory, are all in the district. Most of Line 1's passengers are port workers, factory staff and people working in the city centre. Trains reach 100 km/h on a DC 1500 V overhead supply, with six-car B-type trains and CBTC signalling for fully driverless GoA4 operation.\nWalvik Harbour is the line's most nautical station. At shift change its platforms fill with dockers in high-visibility vests; announcements are made in Chinese and Viking, and the dock hands say only the Viking one \"counts\". On match days at Viking Port Stadium, Lines 1 and 2 both run extra trains and fans sing their way into the stations. On midsummer night Line 1 runs all night, shuttling people back and forth to the harbour to hear the ships' horns at midnight."
        - district: div_z29w6h                      # 瓦尔维克区东西线，东至维京港国际机场
          axis: 1
          to: poi_g4z5j4
          notes:
            zh: "维京港地铁2号线全长 10.9 公里，设 10 座车站，全线都在瓦尔维克区内，标识色为蓝色。线路一端起自轨道站，在隆迪纳亚湾路站与 1 号线换乘，随后到达维京港站，与维西磁悬浮、维贝真空磁悬浮和维长真空磁悬浮换乘，再经苍鹰大街、贝里路、榛子大街、上坡、西安和西湾各站，终点是维京港国际机场站。瓦尔维克是维京港人口最多的区和领地最大的港区，维京港国际机场是领地最繁忙的机场，也是飞往维京群岛和远方的主要门户，2 号线因此成了全岛旅客最多的地铁线之一：坐真空磁悬浮从贝克勒、新城来的旅客，坐维长真空磁悬浮经海底隧道从长船来的旅客，都在维京港站换乘 2 号线去机场。列车最高时速 100 公里，DC 1500 V 架空接触网供电，6 辆编组 B 型车，CBTC 信号，GoA4 级全自动无人驾驶。\n港口夜班让瓦尔维克成为全岛少有的不夜之地，2 号线清晨的第一班车上，刚下夜班、工作服上还沾着油污的码头工人和拖着行李箱、赶早班飞机的旅客常常并排坐着。车厢里专门留出了放大件行李的位置，从群岛回来的人常把整箱熏鱼和羊毛毯塞在那里。夏至前后港里船只午夜鸣笛时，2 号线加开夜班车，许多人坐到维京港站下车，步行去鲸湾边听笛声。"
            en: "Viking Port Metro Line 2 is 10.9 km long with ten stations, all within Walvik District. Its colour is blue. From Orbit station at one end it meets Line 1 at Rondinaia Bay Road and then reaches Viking Port Station, where it connects with the Viking Port–Northwest Maglev, the Viking Port–Beckerle Vacuum Maglev and the Viking Port–Longship Vacuum Maglev, before running on through Goshawk High Street, Berg Road, Hazel High Street, Uphill, Xi'an and West Cove to its terminus at Viking Port International Airport. Walvik is Viking Port's most populous district and the territory's largest port area, and Viking Port International Airport is the territory's busiest, the main gateway to the Viking Islands and beyond. Line 2 is therefore one of the busiest metro lines on the island for travellers: passengers arriving by vacuum maglev from Beckerle and New City, or from Longship through the undersea tunnel on the Viking Port–Longship Vacuum Maglev, all change at Viking Port Station for the airport. Trains reach 100 km/h on a DC 1500 V overhead supply, with six-car B-type trains and CBTC signalling for fully driverless GoA4 operation.\nNight shifts at the port make Walvik one of the few places on the island that never sleeps, and on Line 2's first train of the morning dockers just off the night shift, their overalls still smeared with oil, often sit beside travellers with suitcases rushing for early flights. The carriages have space set aside for bulky luggage, and people coming back from the islands often wedge whole boxes of smoked fish and woollen blankets into it. Around midsummer, when the ships in the harbour sound their horns at midnight, Line 2 runs extra late trains, and many ride to Viking Port Station and walk down to Whale Bay to hear them."
        - district: div_pkfa1g   # 菲尔内斯区，至客运码头
          axis: 0
          at_km: [2.1, 4.4]
          to: poi_z7m0xm
          notes:
            zh: "维京港地铁3号线全长 12.0 公里，设 11 座车站，全线都在菲尔内斯区内，标识色为橙色。线路一端起自杭州站，经西安大街、陈家路、议事石大街、北京路、丁香、石桥、冰巨人大道、雅尔斯托尔峰大街和尼尔萨图克山路各站，终点是菲尔内斯客运码头站。菲尔内斯在维京语中意为「烽火岬」，得名于岬角上旧时为归航船只点燃的烽火，如今是维京港的海上客运门户：菲尔内斯客运码头有渡轮通往沙洲、萨科和维京群岛，夏季的邮轮也在此靠岸，码头旁的菲尔内斯海关大楼负责旅客与行李查验。码头背后的步行街集中了免税店、海鲜餐馆、纪念品商店和酒店，3 号线把这片客运和旅游区与区内的住宅街区连在一起，沿线站名大多取自相交的老街，议事石大街和冰巨人大道带着浓厚的维京色彩。列车最高时速 100 公里，DC 1500 V 架空接触网供电，6 辆编组 B 型车，CBTC 信号，GoA4 级全自动无人驾驶。\n3 号线的客流跟着航运季节起伏：夏天邮轮靠岸的日子，终点站的站台上全是拖着行李箱、戴着遮阳帽的游客，车厢里能听到好几种语言；冬天码头冷清，不少店铺歇业，晚上的列车常常空着大半。区里许多居民在码头、酒店和商店工作，渡轮晚点时，最后一班车会等到下船的旅客出站再开，本地人说 3 号线「看着渡轮的脸色过日子」。"
            en: "Viking Port Metro Line 3 is 12.0 km long with 11 stations, all within Fyrnes District. Its colour is orange. From Hangzhou station at one end it runs through Xi'an High Street, Chenjia Road, Thing Stone High Street, Beijing Road, Lilac, Stone Bridge, Frost Giant Avenue, Jarlstol High Street and Nirsatuuq Hill Road to its terminus at Fyrnes Ferry Terminal. Fyrnes means \"beacon cape\" in Viking, after the fires once lit on the headland for ships coming home, and today it is Viking Port's gateway for sea passengers: from Fyrnes Ferry Terminal ferries sail to Sandbar, Sako and the Viking Islands, cruise ships call in summer, and the Fyrnes Customs House beside the quay checks passengers and luggage. Behind the terminal a pedestrian street gathers duty-free shops, seafood restaurants, souvenir shops and hotels, and Line 3 links this passenger and tourist quarter with the district's residential streets. Most stations are named after the old streets they cross, and Thing Stone High Street and Frost Giant Avenue have a strong Viking flavour. Trains reach 100 km/h on a DC 1500 V overhead supply, with six-car B-type trains and CBTC signalling for fully driverless GoA4 operation.\nLine 3's traffic rises and falls with the shipping season. On summer days when cruise ships are in, the terminus platform is crowded with tourists pulling suitcases and wearing sun hats, and several languages can be heard in the carriages; in winter the quay is quiet, many shops close and evening trains often run more than half empty. Many residents work at the terminal, in hotels and in shops, and when a ferry is late the last train waits until the passengers are off the boat before leaving; locals say Line 3 \"lives by the ferries' moods\"."
        - district: div_t3bfmm                                       # 格约特斯塔德区
          axis: 0
          notes:
            zh: "维京港地铁4号线全长 7.6 公里，设河畔、号角大道、蔷薇大道、缆绳大街、瓦尔哈拉大街、上坡街和榛子 7 座车站，全线都在格约特斯塔德区内，标识色为绿色。格约特斯塔德是维京港的老城区，围绕维京时代修筑的格约特斯塔德石垒逐渐形成，石垒脚下是迷宫般的石板窄街、陡坡屋顶的石屋、手工作坊和老酒馆。老城建筑受到严格保护，少有新建高楼，4 号线便成了老城里最重要的现代交通，站名多取自相交的老街，缆绳大街、瓦尔哈拉大街和号角大道都带着港口和维京传说的味道。4 号线不与其他地铁线相交，乘客要换乘公交或沿观星高速往东去奥斯特海姆和自由市。列车最高时速 100 公里，DC 1500 V 架空接触网供电，6 辆编组 B 型车，CBTC 信号，GoA4 级全自动无人驾驶。\n格约特斯塔德的老年人比例是全市最高的，工作日上午的 4 号线上，提着菜篮去集市的老人比上班族还多，车厢里听到的维京语也比中文多。夏季的维京长船节和每周的传统集市一开，游客挤满了车站，背着相机的人和抱着羊毛织物、木雕、熏鱼回家的摊主挤在一起。上坡街站名副其实，出站就是一段长长的坡道，老城的人说，从这里走到石垒，「腿比地铁还累」。"
            en: "Viking Port Metro Line 4 is 7.6 km long with seven stations, Riverside, Horn Avenue, Rose Avenue, Ropewalk High Street, Valhalla High Street, Uphill Street and Hazel, all within Grjotstad District. Its colour is green. Grjotstad is Viking Port's old town, which grew up around the Viking-age stone fort of Grjotstad; below the fort lies a maze of narrow flagstone lanes, steep-roofed stone houses, craft workshops and old taverns. The old buildings are strictly protected and new high-rises are rare, so Line 4 has become the old town's most important piece of modern transport. Most stations are named after the old streets they cross, and Ropewalk High Street, Valhalla High Street and Horn Avenue all carry a flavour of the harbour and the Viking sagas. Line 4 does not meet any other metro line, and passengers change to buses or follow the Stargazer Expressway east to Osterheim and Freedom City. Trains reach 100 km/h on a DC 1500 V overhead supply, with six-car B-type trains and CBTC signalling for fully driverless GoA4 operation.\nGrjotstad has the highest share of elderly residents in the city, and on weekday mornings Line 4 carries more pensioners with shopping baskets on their way to market than office workers; more Viking than Chinese is heard in the carriages. When the summer Longship Festival and the weekly traditional market are on, tourists fill the stations, people with cameras squeezed in among stallholders carrying home woollens, wood carvings and smoked fish. Uphill Street lives up to its name: the exit leads straight onto a long slope, and old-town people say that walking from there to the fort \"tires your legs more than the metro saves them\"."
    - city: div_0yef9a   # 西北市
      names: { zh: 西北地铁, en: Northwest Metro, art-x-viking: Nordwest U-Bahn, art-x-buckham: Metropolitana di Nordveste }
      lines:
        - district: div_zs7kjk                       # 鹿鸣区南北线
          axis: 1
          at_km: [8, 9]
          notes:
            zh: "西北地铁1号线全长 3.5 公里，设音乐厅、和平路、鹿鸣大道和星港大道 4 座车站，全线都在鹿鸣区内，标识色为红色，是西北市三条地铁中最短的一条。鹿鸣区是西北市的市政与传媒中心，人口约二十五万，占全市四成以上，西北市人民政府、市议会、西北广播电视中心和鹿鸣公园都在区内，购物中心、餐馆和书店沿主干道排开。1 号线穿过区里最繁华的商业街区，鹿鸣大道站是它与 2 号线唯一的换乘站，也是全线最繁忙的车站，往来机场和市政府的乘客多在这里换车。和平路站和星港大道站以相交的街道命名，周围是写字楼、酒店和住宅。列车按领地统一的地铁标准运行，最高时速 100 公里，DC 1500 V 架空接触网供电，6 辆编组 B 型车，CBTC 信号，GoA4 级全自动无人驾驶。\n乘客中公务员、媒体从业者和商户居多，早上常能在车厢里认出刚从西北广播电视中心下了早班的主持人，那档用中文、维京语和巴克汉姆语轮流播报的天气节目播完，他们就搭 1 号线回家补觉。夏天鹿鸣公园的露天剧场办音乐节和电影节，全岛的年轻人涌进鹿鸣区，鹿鸣大道站的换乘通道一直挤到深夜，车站干脆在通道里循环播放音乐节的节目单。全线只有四站，本地人说坐 1 号线「比等红灯还快」。"
            en: "Northwest Metro Line 1 is 3.5 km long with four stations, Concert Hall, Peace Road, Deersong Avenue and Starport Avenue, all within Deersong District. Its colour is red, and it is the shortest of Northwest City's three metro lines. Deersong is the city's civic and media centre, home to about 250,000 people, more than four-tenths of the city, with the Northwest City Government, the city council, the Northwest Broadcasting Centre and Deersong Park, and shopping centres, restaurants and bookshops lining the main roads. Line 1 runs through the district's busiest shopping streets. Deersong Avenue, its only interchange with Line 2, is the busiest station on the line, where passengers heading for the airport or the city government change trains. Peace Road and Starport Avenue are named after the streets they cross and are surrounded by offices, hotels and housing. Trains run to the territory's common metro standard: 100 km/h, DC 1500 V overhead supply, six-car B-type trains and CBTC signalling with fully driverless GoA4 operation.\nMost passengers are civil servants, media workers and shopkeepers. In the morning you can often spot presenters just off the early shift at the Northwest Broadcasting Centre: once the weather bulletin, read in turn in Chinese, Viking and Buckham, is over, they ride Line 1 home to catch up on sleep. In summer, when the open-air theatre in Deersong Park holds its music and film festivals, young people from all over the island pour into Deersong, the interchange passage at Deersong Avenue stays packed until late at night, and the station simply plays the festival programme on a loop along the passage. With only four stations, locals say a ride on Line 1 is \"quicker than waiting at a red light\"."
        - district: div_zs7kjk                      # 鹿鸣区东西线，西至西北机场
          axis: 0
          to: poi_1f5czt
          notes:
            zh: "西北地铁2号线全长 20.7 公里，设 19 座车站，是北维京岛最长、车站最多的地铁线，全线都在鹿鸣区内，标识色为蓝色。线路一端起自厦门大道站，经柳岸大街、拉森两站，在鹿鸣大道站与 1 号线换乘，随后经草甸、月光路、体育场大街、暮光路、繁荣路、工匠路、南京大街、成都大道和和平大道等站，到达西北市人民政府站，再经友谊路、落叶松、极光、北辰各站，终点是区西郊的西北机场站。鹿鸣区是西北市的市政与传媒中心，人口约二十五万，占全市四成以上，2 号线几乎把区里的商业街、住宅区和公共机构都串了起来，沿线站名大多取自相交的大道和街道。西北机场以岛内航线为主，旅客里科研人员和航天工程师占了很大一部分。列车最高时速 100 公里，DC 1500 V 架空接触网供电，6 辆编组 B 型车，CBTC 信号，GoA4 级全自动无人驾驶。\n2 号线全程要坐半个多小时，乘客习惯在车上看书、改论文，西北市人自嘲这是「全岛最长的阅览室」。往机场方向的列车上常有人小心地抱着贴有「精密仪器，轻拿轻放」字样的箱子，宁可一路站着也不肯放到行李架上。秋天鹿鸣湖畔的雄鹿开始鸣叫，落叶松站和极光站一带的乘客偶尔会在清晨的站口看到野鹿，车站的广播会提醒大家「请勿投喂」。"
            en: "Northwest Metro Line 2 is 20.7 km long with 19 stations, the longest metro line on North Viking Island and the one with the most stations, running entirely within Deersong District. Its colour is blue. From Xiamen Avenue at one end it passes Willow High Street and Larsen, meets Line 1 at Deersong Avenue, and runs on through Meadow, Moonlight Road, Stadium High Street, Twilight Road, Prosperity Road, Artisans' Road, Nanjing High Street, Chengdu Avenue, Peace Avenue and other stations to Northwest City Government, then through Friendship Road, Larch, Aurora and Pole Star to its terminus at Northwest Airport on the district's western edge. Deersong is Northwest City's civic and media centre, with about 250,000 people, more than four-tenths of the city, and Line 2 links nearly all its shopping streets, housing and public institutions; most stations are named after the avenues and streets they cross. Northwest Airport serves mainly domestic routes, and researchers and aerospace engineers make up a large share of its passengers. Trains reach 100 km/h on a DC 1500 V overhead supply, with six-car B-type trains and CBTC signalling for fully driverless GoA4 operation.\nAn end-to-end ride on Line 2 takes more than half an hour, and passengers read or mark up papers on the way; Northwest people joke that it is \"the island's longest reading room\". On trains towards the airport someone is often carefully holding a box labelled \"Precision instruments, handle with care\", preferring to stand the whole way rather than put it on the luggage rack. In autumn, when the stags start calling by Deersong Lake, passengers around Larch and Aurora sometimes see wild deer at the station entrances in the early morning, and the station announcements remind everyone \"please do not feed the deer\"."
        - district: div_g27nda                                       # 望星区
          axis: 0
          notes:
            zh: "西北地铁3号线全长 6.3 公里，设卡尔松、松林路、上海路、天鹅、议会大道和苍鹭 6 座车站，全线都在望星区内，标识色为橙色。望星区是西北市的科研核心，沿科学大道展开，深空太空军北维京研发中心、望星天文台、国家实验室、航天研究所和精密仪器企业聚集在大道两侧，3 号线就是这条科研走廊里的通勤线。区里的居民以科研人员、工程师和军方技术人员为主，劳动年龄人口比例很高，乘客中背着电脑包、挂着工作证的人占了大半；国际学校和外国专家公寓也在沿线，上下学时段车厢里能听到好几种语言。3 号线与鹿鸣区的 1 号线、2 号线不相交，往来市中心的乘客要换乘公交或走观星高速。列车最高时速 100 公里，DC 1500 V 架空接触网供电，6 辆编组 B 型车，CBTC 信号，GoA4 级全自动无人驾驶。\n望星区的街道多以星座和天文学名词命名，3 号线的乘客因此爱拿站名开玩笑，说天鹅站和苍鹭站「一个在天上，一个在湖边」。冬天每逢晴朗的新月之夜，望星区和科学城的路灯统一调暗两小时，3 号线的车站出口也跟着关掉一半的灯，出站的乘客常常站在路口先抬头看一会儿星星再回家。研发中心交接班的深夜，最后一班车上坐满了刚下班的工程师，有人说这是全岛「平均学历最高的一节车厢」。"
            en: "Northwest Metro Line 3 is 6.3 km long with six stations, Karlsson, Pinewood Road, Shanghai Road, Swan, Parliament Avenue and Heron, all within Stargaze District. Its colour is orange. Stargaze is Northwest City's research core, laid out along Science Avenue, where the Deep Space Force North Viking Research and Development Centre, the Stargaze Observatory, national laboratories, aerospace institutes and precision-instrument firms line both sides of the road; Line 3 is the commuter line of this research corridor. Most residents are researchers, engineers and military technicians and the working-age share is very high, so most passengers carry laptop bags and wear staff passes. The international schools and foreign experts' flats are along the line too, and at school times several languages can be heard in the carriages. Line 3 does not meet Lines 1 and 2 in Deersong, and passengers for the city centre change to buses or take the Stargazer Expressway. Trains reach 100 km/h on a DC 1500 V overhead supply, with six-car B-type trains and CBTC signalling for fully driverless GoA4 operation.\nStargaze's streets are mostly named after constellations and astronomical terms, and Line 3's passengers like to joke that Swan and Heron are \"one in the sky and one by the lake\". On clear new-moon nights in winter, the street lights of Stargaze and Science City are dimmed for two hours, and Line 3's station entrances switch off half their lights as well; passengers coming out often stop at the corner to look up at the stars before heading home. On late shift-change nights at the research centre the last train fills with engineers just off work, and some call it the island's \"most highly educated carriage\"."
    - city: div_k4s990   # 新城市
      names: { zh: 新城地铁, en: New City Metro, art-x-viking: Neustad U-Bahn, art-x-buckham: Metropolitana di Neu Teatu }
      lines:
        - district: div_m2tz6c                                       # 新城大道下，中苑区—青坪区
          axis: 0
          notes:
            zh: "新城地铁1号线是新城市最短的一条地铁，全长 3.8 公里，设海鸥、回声、新城市人民政府和杉顶冰川大街 4 座车站，全线都在中苑区的建成区内，标识色为红色。中苑区是从青坪区北部析出的新市中心，也是全市密度最高的区，新城市人民政府、市议会、新城国际会展中心和中苑公园都集中在这里，1号线正好把这片政务与会展商务区串在一起。新城市人民政府站是全线最繁忙的一站，出站就是开放式的政务中心，市民办事、公务员上下班都从这里进出；杉顶冰川大街站以相交的大街命名，周围是写字楼、酒店和餐饮街。1号线与 2 号线不相交，要转乘维贝真空磁悬浮或新洛高速铁路，得换公交到北苑区的新城站。列车按领地统一的地铁标准运行，最高时速 100 公里，DC 1500 V 架空接触网供电，6 辆编组 B 型车，CBTC 信号，GoA4 级全自动无人驾驶。\n新城人管 1 号线叫「婴儿车专线」：工作日白天，车厢里最多的是推着婴儿车去中苑公园的年轻父母，每节车厢都留出宽敞的推车位，站台与车门齐平，推车一步就能进出。每年开春会展中心办「新家博览会」，1 号线加密班次，散场后车厢里挤满抱着样品、翻着家具目录的年轻夫妇。全程只要几分钟，常有人说刚坐稳就该下车了；也有孩子把趴在无人驾驶列车最前面的玻璃窗前看轨道迎面而来当成周末节目，一来一回能坐上好几趟。"
            en: "New City Metro Line 1 is New City's shortest metro line: 3.8 km long, with four stations, Gull, Echo, New City Government and Fir Top Glacier Boulevard, all within the built-up area of Central Gardens District. Its colour is red. Central Gardens, carved out of the northern part of Greenmead, is the new city centre and the most densely populated district in the city. The New City Government, the city council, the New City International Exhibition Centre and Central Gardens Park are all here, and Line 1 strings this civic and exhibition quarter together. New City Government is the busiest station on the line, opening straight onto the open-plan civic centre where residents come to deal with paperwork and civil servants arrive and leave for work; Fir Top Glacier Boulevard takes its name from the boulevard it crosses and is surrounded by office blocks, hotels and a street of restaurants. Line 1 does not meet Line 2, and passengers for the Viking Port–Beckerle Vacuum Maglev or the New City–Lorond Mountain High-Speed Railway must take a bus to New City Station in North Gardens. Trains run to the territory's common metro standard: a top speed of 100 km/h, DC 1500 V overhead supply, six-car B-type trains and CBTC signalling with fully driverless GoA4 operation.\nNew City people call Line 1 the \"pushchair line\". On weekdays the carriages are full of young parents wheeling pushchairs to Central Gardens Park; every car has a generous pushchair bay, and platform and doors sit level so a pushchair rolls straight on. Each spring, when the exhibition centre holds its \"New Home Fair\", Line 1 runs more trains, and after closing time the carriages fill with young couples clutching samples and leafing through furniture catalogues. The whole trip takes only a few minutes, and people joke that you have barely sat down before it is time to get off. Some children make a weekend outing of kneeling at the front window of the driverless train to watch the track rush towards them, riding back and forth several times."
        - district: div_hyxnpg                       # 南驿区萨科勒大道下，至新城机场
          axis: 0
          to: poi_h1vjx3
          notes:
            zh: "新城地铁2号线全长 11.6 公里，设 11 座车站，全线都在南驿区内，标识色为蓝色，是新城市最长的地铁线。线路一端起自柳岸站，第二站就是南驿物流园站，随后经广州、云杉路、奥丁、灰狼、东岗、鲸歌、苹果园和峡湾各站，终点是新城机场站。南驿区面向萨科勒方向，南岸公路纵贯全区，2 号线大致与这条通勤走廊平行。南驿物流园紧邻机场和公路，仓储、配送和电商分拣中心聚集，物流业是区里最大的雇主；新城机场有航班通往维京港、自由市、西北市和维京群岛，也是本岛南部的航空货运站。沿线还有为萨科勒工业园配套的零部件、包装和印刷工厂，以及房价较低、年轻工人家庭聚居的住宅区。2 号线与中苑区的 1 号线不相交。列车最高时速 100 公里，DC 1500 V 架空接触网供电，6 辆编组 B 型车，CBTC 信号，GoA4 级全自动无人驾驶。\n南驿是全市儿童比例最高的区之一，2 号线的早高峰分成两拨：七点前是去物流园和工厂换班的工人，八点前后是背着书包、由家长领着去新开学校的孩子。物流园的分拣中心昼夜不停，凌晨换班时南驿物流园站的人流比白天还多，站外的早点摊专做夜班生意，热汤和烤肠卖到天亮。苹果园站一带还能看到区西南部的苗圃和菜地，春天出站的人常顺手买一捆刚剪下的花枝带回家。"
            en: "New City Metro Line 2 is 11.6 km long with 11 stations, all within South Post District. Its colour is blue and it is New City's longest metro line. It starts at Willow station, reaches South Post Logistics Park at the second stop, and then runs through Guangzhou, Spruce Road, Odin, Wolf, East Ridge, Whalesong, Orchard and Fjord to its terminus at New City Airport. South Post faces towards Sakole, with the South Coast Highway running the length of the district, and Line 2 roughly follows this commuter corridor. South Post Logistics Park, next to the airport and the road, gathers warehouses, distribution and e-commerce sorting centres, and logistics is the district's biggest employer; New City Airport has flights to Viking Port, Freedom City, Northwest and the Viking Islands and is the air-freight station for the south of the island. Along the line are also parts, packaging and printing works supplying the Sakole industrial parks, and cheaper housing where young working families live. Line 2 does not meet Line 1 in Central Gardens. Trains reach 100 km/h on a DC 1500 V overhead supply, with six-car B-type trains and CBTC signalling for fully driverless GoA4 operation.\nSouth Post has one of the highest shares of children in the city, and Line 2's morning peak comes in two waves: before seven, workers heading for shifts at the logistics park and the factories; around eight, children with satchels led by their parents to the new schools. The sorting centres at the logistics park run day and night, and at the small-hours shift change South Post Logistics Park station is busier than by day; the breakfast stalls outside cater to the night shift, selling hot soup and grilled sausages until dawn. Around Orchard station the nurseries and vegetable plots of the district's south-west are still in view, and in spring people coming out of the station often pick up a bunch of freshly cut flowering branches to take home."

