# Procedural generator parameters for North Viking Island (layout draft A, "spine").
#
# All positions and lengths are in design kilometres inside a local equal-area
# (sinusoidal) frame whose centre maps to frame.origin_lonlat; frame.scale converts
# design km to real km on the planet (areas scale by its square). Changing a number
# here and re-running `npm run data` rebuilds coastline, terrain, rivers, boundaries
# and roads. Division areas are taken from world/divisions/*.yaml (area_km2, real km²)
# and enforced.
territory: div_fbfqv9
seed: 11
frame:
  origin_lonlat: [8.0, 60.0]
  size_km: [320, 190]
  scale: 2.8284  # √8: the island is 8× the area of the original sketch
  resolution_km: 0.25

land:
  # Gaussian lobes: [cx, cy, rx, ry, rotation_deg, weight]; negative weight carves bays.
  lobes:
    - [160, 95, 135, 46, 0, 1.0]
    - [70, 112, 48, 36, 0, 0.55]
    - [250, 82, 48, 42, 0, 0.6]
    - [195, 48, 45, 22, -8, 0.45]
    - [30, 80, 25, 30, 0, 0.4]
    - [204, 128, 42, 20, 12, 0.5]   # Erding valley mouth on the north coast
  coast_noise: { amplitude: 0.14, scale_km: 60, octaves: 7, detail_amplitude: 0.05, detail_scale_km: 9 }
  # Fjords: polyline cut into the coast, [path, width_km, depth].
  fjords:
    - [[[2, 128], [30, 118], [42, 121]], 1.3, 0.9]
    - [[[0, 100], [24, 98]], 1.2, 0.8]
    - [[[58, 175], [64, 140]], 1.4, 0.9]
    - [[[120, 190], [118, 140]], 1.2, 0.8]

terrain:
  max_elevation_m: 2500
  ridges:
    - { feature: nat_b9bmz2, path: [[150, 128], [144, 98], [150, 66], [162, 38]], height_m: 1900, width_km: 13 }
    - { feature: nat_qsrakx, path: [[212, 112], [236, 116], [258, 112]], height_m: 2100, width_km: 8 }
    - { feature: nat_qsrakx, path: [[212, 112], [208, 82], [214, 56]], height_m: 2200, width_km: 8 }
    - { feature: nat_qsrakx, path: [[214, 56], [240, 50], [262, 56]], height_m: 1900, width_km: 8 }
    - { feature: nat_papy7d, path: [[38, 132], [72, 136], [96, 130]], height_m: 1150, width_km: 9 }
  # Plains flatten terrain: [cx, cy, radius_km, strength 0..1]
  plains:
    - [108, 72, 28, 0.75]
    - [265, 82, 10, 0.7]
  # Valleys: a floor falling from source_m at the first point to the sea at the last.
  valleys:
    - { feature: nat_ww491j, path: [[178, 46], [184, 70], [190, 94], [198, 116], [206, 138], [210, 150]], width_km: 16, source_m: 520, strength: 0.85 }

hydrology:
  river_min_drainage_km2: 25  # design km²
  # Rivers draining at least this much reach the naming list (features with detect.kind: river).
  river_candidate_km2: 150
  # River mouths draining at least this much are listed as estuaries.
  estuary_km2: 700
  named_rivers:
    # The named river is the largest stream crossing the given division (city or district)
    # that no river above it in this list already follows; one that runs into such a river
    # ends at the confluence as its tributary.
    - { feature: nat_x9bmeh, through: div_g4a8q0 }
    - { feature: nat_9h7mcd, through: div_b1dx32 }
    - { feature: nat_ww491j, through: div_8emjne }

# Coastal landform detection (design km / km²). Detected landforms are named in
# world/features/*.yaml by `detect: {kind, at_km}`; the build pairs each entry with the
# nearest landform of that kind and lists the rest in .cache/candidates-<id>.json.
coast:
  island_min_km2: 0.8
  bay_close_km: 5        # coast that wraps around water narrower than 2× this forms a bay
  bay_min_km2: 6
  cape_open_km: 2.5      # land sticking out further than this from the coast forms a cape
  cape_min_prominence_km: 1.5
  strait_max_gap_km: 4
  match_radius_km: 10

# Mountain landforms, named the same way as coastal ones (see pipeline/atlas/relief.py).
relief:
  peak_min_elev_m: 700
  peak_min_prominence_m: 150
  pass_min_elev_m: 450     # key saddles of the peaks above this become passes
  snowline_m: 2000         # on flat ground; north-facing slopes hold ice down to snowline − aspect
  snowline_aspect_m: 300
  glacier_max_slope_deg: 38
  ice_min_km2: 0.5         # smallest ice field drawn (design km²)
  glacier_min_km2: 4       # smallest ice field listed for naming

# Land cover rules (real units); see pipeline/atlas/landcover.py.
landcover:
  urban_density_per_km2: 4000   # built-up area around each district centre = population / this
  urban_max_slope_deg: 12
  wetland_max_elev_m: 90
  wetland_wetness: 2.4          # log(upstream area) − 0.6 × slope, plus noise
  farm_max_elev_m: 300
  farm_max_slope_deg: 5
  farm_reach_km: 22             # farmland within this distance of a built-up area
  treeline_m: 800               # lower on north-facing slopes
  treeline_aspect_m: 150
  rock_above_treeline_m: 650
  rock_slope_deg: 31

# City street networks inside the built-up land cover (real km; see pipeline/atlas/streets.py).
# style: planned (regular grid on two axes), mixed (looser grid and a ring road) or organic
# (radial avenues, a ring, irregular lanes). angle_deg: direction of the first axis, east = 0.
# named: fixed names for arterials; axis 0/1 and line n count from the district centre.
streets:
  cities: [div_nbrnfr]
  arterial_spacing_km: 1.5
  neighbourhood_km: 1.3
  local_spacing_km: { planned: [0.15, 0.2], mixed: [0.13, 0.19], organic: [0.1, 0.16] }
  warp_km: { planned: 0.02, mixed: 0.05, organic: 0.09 }
  warp_wavelength_km: 1.6
  river_gap_km: 0.05
  districts:
    div_16cxr8: { style: planned, angle_deg: 33.7 }  # 白桦区：1990 年新建的首府，人民大道从区中心直通议会综合办公区
    div_b1dx32: { style: mixed }                     # 北河区
    div_g4a8q0: { style: organic }                   # 沙洲区：河口沙洲上的老港区
  named:
    - { district: div_16cxr8, axis: 0, line: 0, status: canon, names: { zh: 人民大道, en: People's Avenue, art-x-viking: Volksallee, art-x-buckham: Viale del Popolo } }
    - { district: div_16cxr8, axis: 1, line: 0, status: generated, names: { zh: 自由大道, en: Liberty Avenue, art-x-viking: Freiheitsallee, art-x-buckham: Viale della Libertà } }
    - { district: div_16cxr8, axis: 1, line: -1, status: generated, names: { zh: 平等大街, en: Equality Boulevard, art-x-viking: Gleichheitschaussee, art-x-buckham: Corso dell'Uguaglianza } }
    - { district: div_16cxr8, axis: 1, line: 1, status: generated, names: { zh: 博爱大街, en: Fraternity Boulevard, art-x-viking: Brüderlichkeitschaussee, art-x-buckham: Corso della Fraternità } }

# Facts the build checks and reports; a failed check is printed as a warning.
expect:
  longest_river: nat_ww491j
  largest_cities_by_area: [div_8emjne, div_rdypg7, div_prcxzt]
  lakes:
    - { feature: nat_jaxtgn, in: div_t8bg0d, radius_km: 4.2 }
    - { feature: nat_kxhv1k, in: div_0tsyzy, radius_km: 3.0 }
    - { feature: nat_9mpvb7, in: div_zs7kjk, radius_km: 2.6 }
    - { feature: nat_j67079, in: div_0t2t36, radius_km: 2.4 }

