    div_w1ea18: [-0.8, 0]    # 天台区
    div_f5s7ax: [0.2, -0.9]  # 银滩区
    div_ts88e3: [0.6, 0.8]   # 岚山区
    div_6byxb5: [1, 0]       # 新厂区
    div_8m0jx4: [0, 0]       # 萨科区
