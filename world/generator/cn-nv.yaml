# City metro systems (real km; see build_metro in pipeline/build.py). Each line runs straight along
# street-grid axis 0 or 1 of a district (the main axis of its built-up area where it has no streets
# yet) through the district centre moved by at_km, across the built-up area, and on to the places
# named by from / to. Stations are about spacing_km apart; crossing lines share a station and a
# line passing a railway station stops there. Lines are numbered in order.
metro:
  spacing_km: 1.2
  cities:
    - city: div_nbrnfr   # 自由市
      names: { zh: 自由市地铁, en: Freedom City Metro, art-x-viking: Freistad U-Bahn, art-x-buckham: Metropolitana di Frei }
