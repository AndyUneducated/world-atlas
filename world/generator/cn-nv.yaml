    div_qpyn9e: { style: mixed, mix: { houses: 1.8, industrial: 1.0, podium: 0.6 } }   # 厄定区：河畔集镇与农业
    div_1qm5cj: { style: organic, mix: { houses: 1.6, civic: 1.6, park: 1.2 } }        # 旧府区：旧机关与博物馆
