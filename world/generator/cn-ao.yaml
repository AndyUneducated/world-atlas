# Procedural generator parameters for the Arctic Ocean Territory: one large mainland and ten
# archipelagos around it, north of North Viking Island.
#
# All positions and lengths are in design kilometres inside a local equal-area (sinusoidal) frame
# whose centre maps to frame.origin_lonlat; frame.scale converts design km to real km (areas by its
# square). Division areas are taken from world/divisions/cn-ao.yaml (area_km2, real km²) and enforced.
