  urban_max_slope_deg: 12
  urban_terrace_slope_deg: 22
  urban_max_area_ratio: 2       # a town whose centre lies by ice or a lake keeps only the nearest buildable ground
  wetland_max_elev_m: 260
  wetland_wetness: 1.8
  farm_max_elev_m: 60
  farm_max_slope_deg: 3
  farm_reach_km: 3
  treeline_m: 60
  treeline_aspect_m: 60
  rock_above_treeline_m: 520
  rock_slope_deg: 31

