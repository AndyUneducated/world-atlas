    notes: {"zh": "阿拉齐纳公路全长约五百三十公里，从齐马罗沃向东南，经伊特拉的宝石矿区到达阿拉齐纳和海边的法里。南方战争期间，成千上万的难民沿着这条路逃往阿拉齐纳，路边至今立着为途中死去的人竖起的石堆。如今援助组织的白色卡车每天沿着这条路往返于法里港和阿拉齐纳的难民营之间。", "en": "The Alatsina Road runs some 530 km south-east from Tsimarovo through the gem fields of Itra to Alatsina and Fary on the coast. In the Southern War tens of thousands of refugees fled along it to Alatsina, and cairns raised for those who died on the way still stand beside it. Today the white lorries of the aid agencies travel it every day between the port of Fary and the Alatsina refugee camp."}
    background: {"zh": "联合共和国时期，全岛的国道由国家公路局统一修建和养护，以首都安博哈拉为中心向四方辐射。阿拉齐纳公路原是联合共和国的十号国道。南方战争后，国际援助组织出资修复了阿拉齐纳境内被毁的桥梁和路面，以便援助物资从法里港运往难民营。", "en": "Under the United Republic the island's national roads were built and kept by a single national roads office, radiating from the capital, Ambohara. The Alatsina Road was the United Republic's National Road 10. After the Southern War international aid agencies paid to repair the bridges and road destroyed in Alatsina so that aid could reach the camp from the port of Fary."}
