    notes: {"zh": "拉诺梅纳公路全长约五百九十公里，从首都安博哈拉向东南，经拉诺梅纳的水电站和雨林，沿法拉纳断崖蜿蜒而下，到达东海岸的港口塔马塔，是首都通往东海岸最近的路。断崖路段有几十个急弯，路边的瀑布在雨季水量最大，常有游客停车拍照。塔马塔港进口的燃料和货物沿着这条路运上高原。", "en": "The Ranomena Road runs some 590 km south-east from the capital, Ambohara, past the hydroelectric station and rainforest of Ranomena and winding down the Farana Escarpment to the east-coast port of Tamata, the shortest road from the capital to the east coast. The escarpment stretch has dozens of hairpins, and the waterfalls beside it are at their fullest in the rains, when visitors often stop to take pictures. Fuel and goods landed at Tamata are carried up to the plateau along it."}
    background: {"zh": "联合共和国时期，全岛的国道由国家公路局统一修建和养护，以首都安博哈拉为中心向四方辐射。拉诺梅纳公路原是联合共和国的十一号国道，修建时动用了上万名工人在断崖上开凿路基。联邦成立后，用海外援助的资金在断崖路段加装了护栏和防落石网。", "en": "Under the United Republic the island's national roads were built and kept by a single national roads office, radiating from the capital, Ambohara. The Ranomena Road was the United Republic's National Road 11, and tens of thousands of labourers cut its roadbed into the escarpment. After the federation was founded, overseas aid paid for crash barriers and rockfall nets on the escarpment stretch."}
