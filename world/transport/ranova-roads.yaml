  - id: rte_hfz6wg
    ref: PA-2964
    network: municipal_road
    class: secondary
    status: generated
    names: {"zh": "人民军军用2964公路", "en": "People's Army Military Road 2964"}
    notes:
      zh: "人民军军用2964公路是马索沃利的军用公路，编号 PA-2964，从北面法里希凯利湖干部区的干部区管理局门前出发，向南穿过沃希阿拉丘陵东段窄脊下的沃希阿拉隧道，到达拉诺迈措湖官邸区的三号官邸，是两片住区之间唯一供干部通行的道路：海湾边的人民军军用7351公路虽然也连着干部区东门和官邸区北门，干部的汽车却一律不准驶上这条公路。公路名义上属于人民军，实际由领袖保卫局管理；隧道两端各有一道铁门和一座检查站，北口由第二警卫旅、南口由第一警卫旅把守。\n奉召去见领袖的干部在干部区管理局门前换乘领袖保卫局的汽车，自己的司机和警卫不得同行；汽车在隧道北口检查站停车受检，穿过隧道，在南口再查验一次证件，把他们送到领袖接见干部的三号官邸，会见结束后再原路送回。领袖本人的车队过隧道时不停车。日落前，隧道的铁门就关上了，夜里谁也不能留在官邸区。干部们说，一进隧道，就把自己交给了领袖保卫局。"
      en: "People's Army Military Road 2964 is a Masovoly military road, numbered PA-2964. From the door of the Cadre Quarter Administration in the Lake Farihikely Cadre Quarter to the north, it runs south through the Vohiala Tunnel under the narrow eastern crest of the Vohiala Hills to Residence No. 3 in the Lake Ranomaitso Residences; it is the only road between the two compounds open to the cadres, for although People's Army Military Road 7351 by the bay also links the quarter's East Gate with the Residences' North Gate, cadres' cars may not use it at all. It belongs on paper to the People's Army, but the Leader's Guard Bureau runs it; at each end of the tunnel is an iron gate and a checkpoint, the northern held by the 2nd Guard Brigade and the southern by the 1st.\nCadres summoned to the leader change into Leader's Guard Bureau cars at the Cadre Quarter Administration, leaving their own drivers and bodyguards behind; the cars are searched at the North Checkpoint, pass through the tunnel, have their papers checked again at the South Checkpoint and take them to Residence No. 3, where the leader receives cadres, bringing them back the same way when the audience is over. The leader's own motorcade goes through without stopping. The tunnel gates close before sunset, and nobody may stay in the Residences overnight. The cadres say that once you enter the tunnel, you have handed yourself over to the Leader's Guard Bureau."
