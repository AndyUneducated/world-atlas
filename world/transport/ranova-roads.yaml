  - id: rte_m1c1rs
    ref: PA-5108
    network: municipal_road
    class: secondary
    status: generated
    names: {"zh": "人民军军用5108公路", "en": "People's Army Military Road 5108"}
    notes:
      zh: "人民军军用5108公路是马索沃利的军用公路，编号 PA-5108，从海湾西岸法里希凯利湖干部区的北门检查站出发，公路止步于北门，不进入干部区，车上的人在北门转运站换乘干部区的专用汽车；它绕过海湾顶端，直达首都领袖广场西北的劳动党机关建筑群，不对普通车辆开放。公路名义上属于人民军，实际由领袖保卫局管理，沿途除了干部区北门，还有三座检查站；「一心号」专列停开的日子，干部们就乘劳动党总务局的黑色轿车走这条路进城，干部区工作人员的通勤大客车也每天早晚走这条路。\n车辆凭领袖保卫局签发的通行证放行，每一辆车进出的时间和车上的人都要登记，报给领袖保卫局和劳动党政治保卫部。路边没有村庄和商店，只有一排排桉树，政治局委员的车队经过时，路上的其他车辆都要靠边停下；只有领袖的车队可以不经检查直接通过。"
      en: "People's Army Military Road 5108 is a Masovoly military road, numbered PA-5108. It starts at the North Gate Checkpoint of the Lake Farihikely Cadre Quarter on the western shore of the bay; the road stops at the gate and does not enter the quarter, and those aboard change at the North Gate Transfer Station into the quarter's own cars. From the gate it rounds the head of the bay and runs straight to the Workers' Party buildings north-west of Leaders' Square in the capital, closed to ordinary traffic. It belongs on paper to the People's Army, but the Leader's Guard Bureau runs it, with three checkpoints along the way besides the quarter's North Gate; on days when the One Heart special train does not run, the cadres are driven into town along it in the black saloons of the party's General Affairs Bureau, and the coaches carrying the quarter's staff use it every morning and evening.\nVehicles pass only on a Leader's Guard Bureau pass; the time of every car in or out and the names of those aboard are logged and reported to the Bureau and the party's Political Security Department. There are no villages or shops along it, only rows of eucalyptus, and when a Politburo member's motorcade passes, every other car on the road must pull over and stop; only the leader's motorcade may go straight through unchecked."
