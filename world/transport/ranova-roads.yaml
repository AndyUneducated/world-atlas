# Trunk roads of Ranova (拉诺瓦岛): the old national roads of the United Republic of Ranova, each
# section now kept by the country it runs through. All are territorial highways (S-RA-101..,
# class primary); see cn-nv-roads.yaml for the fields. via lists cities in order.
routes:
  - id: rte_zmrp2y
    ref: S-RA-101
    network: territorial_highway
    class: primary
    status: generated
    names: {"zh": "联邦干线", "en": "Federal Trunk Road"}
    notes: {"zh": "联邦干线全长约一千三百公里，从西北的深水港瓦凡博出发，经菲安特拉的稻田上到安德里纳高原，穿过首都安博哈拉，再沿高原南缘下到东南海岸的安帕尼，是安博哈拉基督教联邦从一端到另一端的唯一公路，被称为联邦的「脊梁」。全线双向两车道，高原路段弯多坡陡，雨季常有塌方。沿线每隔几十公里就有一座教堂和路边的圣母像，长途卡车司机习惯在经过时按一声喇叭。军队的车队也走这条路，在西北和东南两支舰队之间调动兵力。", "en": "The Federal Trunk Road runs some 1,300 km from the deep-water port of Vavambo in the north-west, up through the rice fields of Fiantra onto the Andrina Highlands, through the capital Ambohara and down the southern edge of the plateau to Ampany on the south-east coast. It is the only road from one end of the Christian Federation of Ambohara to the other and is called the federation's 'spine'. It has one lane each way throughout; the highland stretches are steep and winding, and landslides are common in the rains. Every few dozen kilometres there is a church or a wayside statue of the Virgin, and long-distance lorry drivers sound their horns as they pass. Army convoys use it too, moving troops between the north-western and south-eastern fleets."}
    background: {"zh": "联合共和国时期，全岛的国道由国家公路局统一修建和养护，以首都安博哈拉为中心向四方辐射。这条路原是联合共和国的一号国道。大分裂后，联邦继承了它的大部分路段，把它定为国家干线，重修了被高原战争炸毁的桥梁，并在安德里纳高原上新修了几段避开塌方区的改线。", "en": "Under the United Republic the island's national roads were built and kept by a single national roads office, radiating from the capital, Ambohara. This road was the United Republic's National Road 1. After the Sundering the federation inherited most of it, made it the national trunk road, rebuilt the bridges blown up in the Highland War and cut new sections on the Andrina Highlands to avoid the landslide zones."}
    shield: peaks
    via: [div_cwevsp, div_wzx2kn, div_qnzksj, div_7kqjx0, div_0b42e0]  # 瓦凡博—菲安特拉—安博哈拉—安德里纳—安帕尼
  - id: rte_3rjep2
    ref: S-RA-102
    network: territorial_highway
    class: primary
    status: generated
    names: {"zh": "东海岸公路", "en": "East Coast Road"}
    notes: {"zh": "东海岸公路全长约一千三百公里，沿拉诺瓦岛的东海岸从北方的沃希马希一路向南，经过阿瓦拉齐、马索沃利、法尼里公社、洛哈瓦托和黎明国，到达安博哈拉的港口塔马塔，一条路穿过六个国家。路的东边是法拉纳断崖和雨林，西边不远就是大海，雨季时常被山洪冲断。每过一道国界都要停车检查，卡车司机的驾驶室里总放着一沓不同国家的通行证。洛哈瓦托段的路边有许多佛寺和茶摊，是全线最平静的一段。", "en": "The East Coast Road runs about 1,300 km down Ranova's east coast from Vohimahy in the north, through Avaratsy, Masovoly, the Faniry Commune, Lohavato and the Dawn State, to the Ambohara port of Tamata: one road through six countries. The Farana Escarpment and the rainforest rise to the east and the sea is never far, and flash floods often cut it in the rains. There is a stop at every border, and lorry drivers keep a stack of passes from different countries in the cab. The Lohavato stretch, lined with Buddhist temples and tea stalls, is the calmest of the whole road."}
    background: {"zh": "联合共和国时期，全岛的国道由国家公路局统一修建和养护，以首都安博哈拉为中心向四方辐射。东海岸公路原是联合共和国的二号国道。大分裂后，沿线各国分段接管，养护水平差别很大：阿瓦拉齐段由军队工程兵维修，法尼里段由公社居民义务修补，黎明国段只在朝圣季节前整修一次。", "en": "Under the United Republic the island's national roads were built and kept by a single national roads office, radiating from the capital, Ambohara. The East Coast Road was the United Republic's National Road 2. After the Sundering each country along it took over its own stretch, and the upkeep varies widely: Avaratsy's army engineers repair their section, the Faniry Commune's residents patch theirs as volunteers, and the Dawn State mends its stretch only before the pilgrimage season."}
    shield: sunrise
    via: [div_89czvj, div_1zgqyc, div_gt2h78, div_tjwyxx, div_mt8f0c, div_0a6gt7, div_gjh4td]  # 沃希马希—安科里卡—安德里安巴—法尼里—洛哈瓦托—马扎瓦—塔马塔
  - id: rte_jmse8c
    ref: S-RA-103
    network: territorial_highway
    class: primary
    status: generated
    names: {"zh": "西海岸公路", "en": "West Coast Road"}
    notes: {"zh": "西海岸公路全长约九百三十公里，沿干燥的西海岸从贾巴勒丘陵向南，经萨希利亚的首都萨希勒、港口班达里和贝洛瓦共和国的首都贝洛瓦，到达梅纳瓦利，是西海岸各港口之间运输货物的主要通道。路边是稀树草原、盐田和猴面包树，旱季尘土飞扬。萨希利亚段和贝洛瓦段路况最好，贾巴勒段则被武装组织设卡收费，大部分货车宁愿绕道走海路。", "en": "The West Coast Road runs some 930 km down the dry west coast from the Jabal hills, through Sahiliya's capital Sahil, the port of Bandari and Belova, capital of the Republic of Belova, to Menavaly, the main road for goods between the west coast ports. Savanna, salt pans and baobabs line it, and in the dry season it is deep in dust. The Sahiliya and Belova stretches are the best kept; on the Jabal stretch the armed group levies tolls at its checkpoints, and most lorries would rather go round by sea."}
    background: {"zh": "联合共和国时期，全岛的国道由国家公路局统一修建和养护，以首都安博哈拉为中心向四方辐射。西海岸公路原是联合共和国的三号国道，连接西海岸的盐场和港口。大分裂后，萨希利亚和贝洛瓦合资重修了两国之间的路段，把它铺成了全岛最平整的公路之一。", "en": "Under the United Republic the island's national roads were built and kept by a single national roads office, radiating from the capital, Ambohara. The West Coast Road was the United Republic's National Road 3, linking the salt works and ports of the west coast. After the Sundering Sahiliya and Belova jointly rebuilt the stretch between them, making it one of the smoothest roads on the island."}
    shield: wave
    via: [div_2e6j0g, div_n49g57, div_f9gjbe, div_2btpwg, div_xfvevz, div_8p600p]  # 贾巴勒—扎纳拉—萨希勒—班达里—贝洛瓦—梅纳瓦利
  - id: rte_ev76at
    ref: S-RA-104
    network: territorial_highway
    class: primary
    status: generated
    names: {"zh": "横贯公路", "en": "Cross-Island Road"}
    notes: {"zh": "横贯公路全长约九百八十公里，从西海岸的萨希勒出发，向东穿过萨希利亚的香料种植区，爬上安德里纳高原到达安博哈拉，再下到东海岸的马扎瓦，是全岛唯一一条从西海岸直通东海岸的公路。高原西坡的一段路沿着深谷开凿，一边是峭壁，一边是悬崖，当地人叫它「天梯」。圣约同盟的物资和援助车队多走这条路往来于萨希勒港和安博哈拉之间。", "en": "The Cross-Island Road runs some 980 km from Sahil on the west coast east through Sahiliya's spice country, up onto the Andrina Highlands to Ambohara and down to Mazava on the east coast, the only road across the island from coast to coast. On the western slope of the plateau one stretch is cut along a deep gorge, a rock wall on one side and a drop on the other, which locals call 'the Ladder to Heaven'. The Covenant League's supply and aid convoys mostly use it between the port of Sahil and Ambohara."}
    background: {"zh": "联合共和国时期，全岛的国道由国家公路局统一修建和养护，以首都安博哈拉为中心向四方辐射。横贯公路是联合共和国晚期修建的最后一条国道，原计划拓宽为高速公路，大分裂时工程中断，高原西坡的「天梯」路段一直保持着两车道的原样。", "en": "Under the United Republic the island's national roads were built and kept by a single national roads office, radiating from the capital, Ambohara. The Cross-Island Road was the last national road the United Republic built, meant to be widened into an expressway; the work stopped at the Sundering, and the 'Ladder to Heaven' on the western slope has stayed a two-lane road ever since."}
    shield: compass
    via: [div_f9gjbe, div_m9kp3y, div_qnzksj, div_0a6gt7]  # 萨希勒—姆吉尼—安博哈拉—马扎瓦
  - id: rte_efzs0e
    ref: S-RA-105
    network: territorial_highway
    class: primary
    status: generated
    names: {"zh": "南方公路", "en": "Southern Road"}
    notes: {"zh": "南方公路全长约七百八十公里，横贯拉诺瓦岛南部，从西海岸的梅纳瓦利经瘤牛牧区阿纳拉到齐马罗沃，再经矿城福罗纳到达东海岸的伊拉希港。齐马罗沃段是全岛路面最宽、最笔直的公路之一，修建时就考虑了坦克和装甲车的通行，路两侧每隔一段就有一个军用停车区。旱季时，牧民赶着成群的瘤牛沿公路去集市，汽车常要等上半个小时。", "en": "The Southern Road runs some 780 km across the south of Ranova, from Menavaly on the west coast through the zebu country of Anala to Tsimarovo, then through the mining town of Forona to the port of Ilahy on the east coast. The Tsimarovo stretch is one of the widest and straightest roads on the island, built with tanks and armoured vehicles in mind, with military lay-bys at intervals along both sides. In the dry season herders drive their zebu along it to market, and cars often wait half an hour to get by."}
    background: {"zh": "联合共和国时期，全岛的国道由国家公路局统一修建和养护，以首都安博哈拉为中心向四方辐射。南方公路原是联合共和国的四号国道。齐马罗沃立国后，把境内的路段改建为军用标准的公路，南方战争期间，它是齐马罗沃军队向东西两个方向推进的主要通道。", "en": "Under the United Republic the island's national roads were built and kept by a single national roads office, radiating from the capital, Ambohara. The Southern Road was the United Republic's National Road 4. After its founding Tsimarovo rebuilt the stretch through its territory to military standards, and in the Southern War it was the main road by which Tsimarovo's army pushed east and west."}
    shield: cow
    via: [div_8p600p, div_rxj1qr, div_j0txx6, div_2xgnjq, div_s0cxrv]  # 梅纳瓦利—阿纳拉—齐马罗沃—福罗纳—伊拉希
  - id: rte_kf3jwh
    ref: S-RA-106
    network: territorial_highway
    class: primary
    status: generated
    names: {"zh": "北方公路", "en": "Northern Road"}
    notes: {"zh": "北方公路全长约一千二百公里，连接拉诺瓦岛北端的丁香产地察拉沃卡、阿瓦拉齐的首都沃希马希、安巴拉努西河谷的稻田和矿城马罗瓦托，最后到达马索沃利的菲拉纳，是世俗协约两个盟国之间的陆上通道。路边的集体农庄和国营工厂门口都挂着红色的标语牌，拖拉机和卡车在路上并行。阿瓦拉齐的拖拉机和马索沃利的大米就沿着这条路互相交换。", "en": "The Northern Road runs some 1,200 km from the clove country of Tsaravoka at Ranova's northern tip through Avaratsy's capital Vohimahy, the rice fields of the Ambalanosy valley and the mining town of Marovato to Firana in Masovoly, the overland link between the two Secular Accord allies. Red slogan boards hang at the gates of the collective farms and state factories along it, and tractors and lorries share the road. Avaratsy's tractors and Masovoly's rice are traded along it."}
    background: {"zh": "联合共和国时期，全岛的国道由国家公路局统一修建和养护，以首都安博哈拉为中心向四方辐射。北方公路原是联合共和国北部的五号国道。阿瓦拉齐和马索沃利立国后，按照两国的友好条约共同维护这条路，两国边境上的口岸被命名为「友谊口岸」。", "en": "Under the United Republic the island's national roads were built and kept by a single national roads office, radiating from the capital, Ambohara. The Northern Road was the United Republic's National Road 5 in the north. Since their founding Avaratsy and Masovoly have kept it up together under their friendship treaty, and the crossing on their border is named the Friendship Crossing."}
    shield: wheat
    via: [div_xvdp2k, div_89czvj, div_jhtwr7, div_cq4dgt, div_qe8t49]  # 察拉沃卡—沃希马希—安巴拉努西—马罗瓦托—菲拉纳
  - id: rte_zg9rtz
    ref: S-RA-107
    network: territorial_highway
    class: primary
    status: generated
    names: {"zh": "高原北路", "en": "Highland North Road"}
    notes: {"zh": "高原北路全长约二百四十公里，从阿瓦拉齐的矿城马罗瓦托向南，翻过高原北缘到达安博哈拉的菲安特拉，是高原战争的主战场之一。停火后，公路在停火线上被两道铁丝网和雷区截断，中间是一片荒废的缓冲区，只有停火线口岸在每月的固定日子开放，供离散家庭团聚和红十字会的车队通过。路边至今能看到被击毁的坦克残骸和弹坑。", "en": "The Highland North Road runs some 240 km south from the Avaratsy mining town of Marovato over the northern rim of the plateau to Fiantra in Ambohara, and was one of the main battlefields of the Highland War. Since the ceasefire it has been cut at the ceasefire line by two wire fences and minefields with an abandoned buffer zone between them, and only the Ceasefire Line Crossing opens, on set days each month, for divided families to meet and for Red Cross convoys. Wrecked tanks and shell craters can still be seen along it."}
    background: {"zh": "联合共和国时期，全岛的国道由国家公路局统一修建和养护，以首都安博哈拉为中心向四方辐射。高原北路原是联合共和国连接北部矿区和首都的六号国道。高原战争中，双方为争夺这条路反复拉锯，沿线的桥梁全部被炸毁；停火后，两国各自修复了本方一侧的路段，中间的缓冲区至今无人修整。", "en": "Under the United Republic the island's national roads were built and kept by a single national roads office, radiating from the capital, Ambohara. The Highland North Road was the United Republic's National Road 6, linking the northern mines with the capital. In the Highland War the two sides fought back and forth over it and every bridge was blown; since the ceasefire each country has repaired its own side, but the buffer zone between them has never been touched."}
    shield: wall
    via: [div_cq4dgt, div_wzx2kn]  # 马罗瓦托—菲安特拉
  - id: rte_ad9hrk
    ref: S-RA-108
    network: territorial_highway
    class: primary
    status: generated
    names: {"zh": "香草公路", "en": "Vanilla Road"}
    notes: {"zh": "香草公路全长约五百四十公里，从西海岸的贝洛瓦向东，经安博塔的甘蔗田进入安博维的香草产区，再经拉诺马的森林到达安博哈拉的安德里纳高原。每年收获季节，满载香草荚的卡车由武装保安护送着开往贝洛瓦港出口，路边的检查站比加油站还多。国际调查报告指出，这条路也是毒品从岛外转运的通道之一。", "en": "The Vanilla Road runs some 540 km east from Belova on the west coast through the cane fields of Ambota into the vanilla country of Ambovy, then through the forests of Ranoma to Andrina on the Ambohara highlands. Each harvest, lorries laden with vanilla pods drive to the port of Belova for export under armed escort, and there are more checkpoints than filling stations along the way. International investigations say it is also one of the routes by which drugs are moved on from off the island."}
    background: {"zh": "联合共和国时期，全岛的国道由国家公路局统一修建和养护，以首都安博哈拉为中心向四方辐射。香草公路原是联合共和国的七号国道，为香草和甘蔗的外运而修建。大分裂后，安博维的「三家族」出资重修了境内的路段，并在沿线设立了收费站。", "en": "Under the United Republic the island's national roads were built and kept by a single national roads office, radiating from the capital, Ambohara. The Vanilla Road was the United Republic's National Road 7, built to carry vanilla and sugar out to the coast. After the Sundering Ambovy's 'Three Families' paid to rebuild the stretch through their country and set up toll stations along it."}
    shield: palm
    via: [div_xfvevz, div_ah0qbp, div_3j9c24, div_zjhw8d, div_7kqjx0]  # 贝洛瓦—安博塔—安博维—拉诺马—安德里纳
  - id: rte_afghhd
    ref: S-RA-109
    network: territorial_highway
    class: primary
    status: generated
    names: {"zh": "卡西里公路", "en": "Kasiri Road"}
    notes: {"zh": "卡西里公路全长约四百二十公里，从安博哈拉的地热城安卡瓦向西，下到萨希利亚的瘤牛牧区卡西里，再到达西海岸的班达里港。这一带是讲拉诺瓦语的高原和讲卡西里语的海岸之间的过渡地带，沿线的村庄里，教堂和清真寺常常相隔不远，集市上两种语言混着用。每周一次的卡西里瘤牛集市吸引着两国的牧民。", "en": "The Kasiri Road runs some 420 km west from the Ambohara geothermal town of Ankava down to the zebu country of Kasiri in Sahiliya and on to the port of Bandari on the west coast. This is the borderland between the Ranovan-speaking highlands and the Kasiri-speaking coast: in the villages along it churches and mosques often stand close together, and the markets use both languages. The weekly Kasiri zebu market draws herders from both countries."}
    background: {"zh": "联合共和国时期，全岛的国道由国家公路局统一修建和养护，以首都安博哈拉为中心向四方辐射。卡西里公路原是联合共和国的八号国道。安博哈拉和萨希利亚同属圣约同盟，两国在公路上的口岸实行简化手续，牧民凭身份证就能赶着牛群过境。", "en": "Under the United Republic the island's national roads were built and kept by a single national roads office, radiating from the capital, Ambohara. The Kasiri Road was the United Republic's National Road 8. Ambohara and Sahiliya both belong to the Covenant League and keep simplified formalities at their crossing on this road, so herders can drive their cattle across on an identity card."}
