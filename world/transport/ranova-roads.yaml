    via: [div_6py47w, div_6jwhzg, div_2btpwg]  # 安卡瓦—卡西里—班达里
  - id: rte_g1n049
    ref: S-RA-110
    network: territorial_highway
    class: primary
    status: generated
    names: {"zh": "西南公路", "en": "South-West Road"}
    notes: {"zh": "西南公路全长约五百公里，从齐马罗沃向西南，经安塔诺的牧区和贝拉纳的盐湖到达卡波拉，穿过拉诺瓦岛最干燥的多刺灌木林和半荒漠。沿途村庄稀少，加油站之间相隔上百公里，司机们出发前都会多带几桶水和燃料。卡波拉边境冲突期间，这条路是齐马罗沃军队进攻卡波拉的通道，路边至今留着当年的战壕。", "en": "The South-West Road runs some 500 km south-west from Tsimarovo through the grazing lands of Antano and the salt lake of Belana to Kabola, crossing the driest spiny thicket and semi-desert on Ranova. Villages are few and filling stations a hundred kilometres or more apart, so drivers set off with extra cans of water and fuel. In the Kabola border conflict it was the road by which Tsimarovo's army attacked Kabola, and the old trenches are still there beside it."}
    background: {"zh": "联合共和国时期，全岛的国道由国家公路局统一修建和养护，以首都安博哈拉为中心向四方辐射。西南公路原是联合共和国通往西南盐区的九号国道，路基建在干涸的河床上。大分裂后，齐马罗沃和卡波拉各自维护本方的路段，两国之间的口岸长期关闭。", "en": "Under the United Republic the island's national roads were built and kept by a single national roads office, radiating from the capital, Ambohara. The South-West Road was the United Republic's National Road 9 to the salt country of the south-west, built along dry river beds. Since the Sundering Tsimarovo and Kabola have each kept up their own stretch, and the crossing between them has long been closed."}
    shield: crystal
