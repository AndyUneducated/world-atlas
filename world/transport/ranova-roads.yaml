  - id: rte_ks7b24
    ref: PA-6639
    network: municipal_road
    class: secondary
    status: generated
    names: {"zh": "人民军军用6639公路", "en": "People's Army Military Road 6639"}
    notes:
      zh: "人民军军用6639公路是马索沃利的军用公路，编号 PA-6639，是拉诺迈措湖官邸区西缘的一条林中道路，从领袖保卫局防空阵地南面的官邸区道路向西岔出，经过林间别墅群检查站，向北穿过雨林，到达林间别墅群最北端的三号别墅，全长约 7 公里，是进出林间别墅群的唯一道路。公路名义上属于人民军，实际由领袖保卫局管理，路面只铺到检查站，再往里是一条碎石路，两旁的树木从不砍伐，树冠在路的上空合拢。\n检查站以外，除了领袖的车队、别墅的女服务员和领袖保卫局第五处的汽车，谁也不准走这条路；卫兵只把守检查站和林子外围的铁丝网，不准沿路进入林子。官邸区的地图上，检查站以北的一段路没有画出来。"
      en: "People's Army Military Road 6639 is a Masovoly military road, numbered PA-6639: a forest road on the western edge of the Lake Ranomaitso Residences. It leaves the Residences' road south of the Leader's Guard Bureau air defence site, runs west past the Forest Villas Checkpoint and then north through the rainforest to Villa No. 3 at the northern end of the Forest Villas. About 7 km long, it is the one way into or out of the Forest Villas. It belongs on paper to the People's Army, but the Leader's Guard Bureau runs it; it is paved only as far as the checkpoint and is gravel beyond, and the trees along it are never felled, so that their crowns close over it.\nBeyond the checkpoint nobody may use the road but the leader's motorcade, the villas' maids and the cars of the Bureau's Fifth Office; the guards hold only the checkpoint and the wire fence round the woods and may not follow the road into the trees. On maps of the Residences the stretch north of the checkpoint is not drawn."
