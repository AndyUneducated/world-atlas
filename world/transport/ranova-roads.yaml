# Trunk roads of Ranova (拉诺瓦岛): the old national roads of the United Republic of Ranova, each
# section now kept by the country it runs through. All are territorial highways (S-RA-101..,
# class primary); see cn-nv-roads.yaml for the fields. via lists cities in order.
routes:
  - id: rte_zmrp2y
    ref: S-RA-101
    network: territorial_highway
    class: primary
    status: generated
    names: {"zh": "联邦干线", "en": "Federal Trunk Road"}
    notes:
      zh: "联邦干线是领道 S-RA-101，全长约 1287 公里，从西北的深水港瓦凡博出发，经菲安特拉的稻田上到安德里纳高原，穿过首都安博哈拉，再经安卡瓦和安德里纳，沿高原南缘下到东南海岸的安帕尼，是安博哈拉基督教联邦从一端到另一端的唯一公路，被称为联邦的「脊梁」。全线是联合共和国时期修的双向八车道一级公路，但大分裂后养护不足，高原路段弯多坡陡，雨季常有塌方。沿途有 22 座跨河桥，最长的安卡瓦特大桥约 2.7 公里，安德里纳高原隧道约 1.3 公里；安德里纳境内的路段最长，约 346 公里。日均车流 2.3 万到 13 万辆，按巡航速度全程约十小时。\n沿线每隔几十公里就有一座教堂和路边的圣母像，长途卡车司机习惯在经过时按一声喇叭，路牌上画着连绵的山峰。军队的车队也走这条路，在西北和东南两支舰队之间调动兵力，遇到车队经过，民用车辆都要靠边让行。"
      en: "The Federal Trunk Road is territorial highway S-RA-101, about 1,287 km long. It starts at the deep-water port of Vavambo in the north-west, climbs through the rice fields of Fiantra onto the Andrina Highlands, crosses the capital, Ambohara, and runs by way of Ankava and Andrina along the southern rim of the highlands down to Ampany on the south-east coast; it is the only road from one end of the Christian Federation of Ambohara to the other and is called the federation's 'backbone'. The whole road is an eight-lane dual carriageway built under the United Republic, but it has been poorly maintained since the Sundering; the highland sections are winding and steep, and landslides are common in the rains. It crosses 22 rivers, its longest bridge being the Ankava Viaduct at about 2.7 km, and the Andrina Highlands Tunnel is about 1.3 km long; the longest stretch, about 346 km, is in Andrina. It carries 23,000 to 130,000 vehicles a day, and at cruising speed the whole road takes about ten hours.\nEvery few dozen kilometres there is a church and a roadside statue of the Virgin, and long-distance lorry drivers sound their horns once as they pass; the road's sign shows a range of peaks. Army convoys use it too, moving forces between the north-western and south-eastern fleets, and when a convoy comes through, civilian traffic must pull over to let it pass."
    background: {"zh": "联合共和国时期，全岛的国道由国家公路局统一修建和养护，以首都安博哈拉为中心向四方辐射。这条路原是联合共和国的一号国道。大分裂后，联邦继承了它的大部分路段，把它定为国家干线，重修了被高原战争炸毁的桥梁，并在安德里纳高原上新修了几段避开塌方区的改线。", "en": "Under the United Republic the island's national roads were built and kept by a single national roads office, radiating from the capital, Ambohara. This road was the United Republic's National Road 1. After the Sundering the federation inherited most of it, made it the national trunk road, rebuilt the bridges blown up in the Highland War and cut new sections on the Andrina Highlands to avoid the landslide zones."}
    shield: peaks
    via: [div_cwevsp, div_wzx2kn, div_qnzksj, div_7kqjx0, div_0b42e0]  # 瓦凡博—菲安特拉—安博哈拉—安德里纳—安帕尼
  - id: rte_3rjep2
    ref: S-RA-102
    network: territorial_highway
    class: primary
    status: generated
    names: {"zh": "东海岸公路", "en": "East Coast Road"}
    notes:
      zh: "东海岸公路是领道 S-RA-102，全长约 1158 公里，在拉诺瓦岛十三条领道中仅次于联邦干线。它沿东海岸从北方的沃希马希一路向南，经过阿瓦拉齐的安科里卡、马索沃利的首都安德里安巴和沿海战争中被马索沃利吞并的法尼里，再经洛哈瓦托，沿黎明国马扎瓦的西部边缘穿行约 80 公里而不进马扎瓦城，到达安博哈拉的港口塔马塔，一条路穿过五个国家。路的西边是法拉纳断崖和雨林，东边不远就是大海，沿途有 23 座跨河桥，最长的塔马塔高架桥约 1.4 公里，最长的洛哈瓦托隧道约 1.3 公里；雨季时常被山洪冲断。全线双向八车道、不限速，日均车流 1.8 万到 4.5 万辆，按巡航速度开完全程要九个小时左右。\n实际上很少有人一口气开完：每过一道国界都要停车检查，卡车司机的驾驶室里总放着一沓不同国家的通行证。沿海战争以后，这条路在法尼里以南断成了两截：马索沃利封锁了通往洛哈瓦托的边界，洛哈瓦托也关闭了自己一侧的口岸，从北方开来的车辆只能开到法尼里为止；从法尼里通往内陆伊瓦洛的公路则在断崖脚下被雷区截断。洛哈瓦托段的路边有许多佛寺和茶摊，是全线最平静的一段，司机们常在这里歇脚，喝一杯甜茶再上路。"
      en: "The East Coast Road is territorial highway S-RA-102, about 1,158 km long, second only to the Federal Trunk Road among Ranova's thirteen territorial highways. It runs south along the east coast from Vohimahy in the north through Ankorika in Avaratsy, Andriamba, the capital of Masovoly, and Faniry, annexed by Masovoly in the Coastal War, then through Lohavato and some 80 km along the western edge of Mazava in the Dawn Realm, without entering the town, to Tamata, the port of Ambohara: one road through five countries. To the west of it rise the Farana Escarpment and the rainforest, and to the east the sea is never far; it crosses 23 rivers, its longest bridge is the Tamata Viaduct at about 1.4 km and its longest tunnel the Lohavato Tunnel at about 1.3 km, and in the rains flash floods often cut it. It is an eight-lane dual carriageway with no speed limit, carrying 18,000 to 45,000 vehicles a day, and at cruising speed the whole road takes about nine hours.\nIn practice few people drive it in one go: at every border there is a stop and a check, and lorry drivers keep a sheaf of permits from different countries in the cab. Since the Coastal War the road has been broken in two south of Faniry: Masovoly has sealed its border with Lohavato and Lohavato has closed the crossing on its own side, so traffic from the north can go no further than Faniry, while the road from Faniry inland to Ivalo is cut by minefields at the foot of the escarpment. The Lohavato section, lined with Buddhist temples and tea stalls, is the calmest stretch of the road, and drivers often stop there for a cup of sweet tea before going on."
    background: {"zh": "联合共和国时期，全岛的国道由国家公路局统一修建和养护，以首都安博哈拉为中心向四方辐射。东海岸公路原是联合共和国的二号国道。大分裂后，沿线各国分段接管，养护水平差别很大：阿瓦拉齐段由军队工程兵维修，法尼里段过去由公社居民义务修补，被马索沃利吞并后改由人民军工程兵维修，黎明国段只在朝圣季节前整修一次。", "en": "Under the United Republic the island's national roads were built and kept by a single national roads office, radiating from the capital, Ambohara. The East Coast Road was the United Republic's National Road 2. After the Sundering each country along it took over its own stretch, and the upkeep varies widely: Avaratsy's army engineers repair their section, the Faniry stretch, once patched by the commune's residents as volunteers, has been kept by the People's Army's engineers since Masovoly annexed it, and the Dawn State mends its stretch only before the pilgrimage season."}
    shield: sunrise
    via: [div_89czvj, div_1zgqyc, div_gt2h78, div_tjwyxx, div_mt8f0c, div_gjh4td]  # 沃希马希—安科里卡—安德里安巴—法尼里—洛哈瓦托—塔马塔
  - id: rte_jmse8c
    ref: S-RA-103
    network: territorial_highway
    class: primary
    status: generated
    names: {"zh": "西海岸公路", "en": "West Coast Road"}
    notes:
      zh: "西海岸公路是领道 S-RA-103，全长约 933 公里，沿干燥的西海岸从贾巴勒丘陵向南，经萨希利亚的扎纳拉、首都萨希勒、港口班达里和贝洛瓦共和国的首都贝洛瓦，到达梅纳瓦利，是西海岸各港口之间运输货物的主要通道。全线双向八车道、不限速，没有隧道，沿途有 31 座跨河桥，是十三条领道中跨河最多的一条，最长的班达里特大桥约 2.7 公里。日均车流 1.7 万到 4.9 万辆，按巡航速度全程约七小时。\n路边是稀树草原、盐田和猴面包树，旱季尘土飞扬，路牌上画着一道海浪。萨希利亚段和贝洛瓦段路况最好；贾巴勒段约 103 公里，被武装组织设卡收费，大部分货车宁愿绕道走海路。盐田边常有卖海盐和烤鱼的小摊，跑长途的司机习惯在班达里港外的停车场过夜，第二天一早再赶往贝洛瓦，赶在港口开闸前排上队。"
      en: "The West Coast Road is territorial highway S-RA-103, about 933 km long, running south along the dry west coast from the Jabal Hills through Zanara in Sahiliya, the capital Sahil, the port of Bandari and Belova, capital of the Republic of Belova, to Menavaly; it is the main freight route between the west-coast ports. It is an eight-lane dual carriageway with no speed limit and no tunnels, crossing 31 rivers, more than any other of the thirteen territorial highways; its longest bridge is the Bandari Viaduct at about 2.7 km. It carries 17,000 to 49,000 vehicles a day, and at cruising speed the whole road takes about seven hours.\nSavanna, salt pans and baobabs line the road, the dust flies in the dry season, and its sign shows a wave. The Sahiliya and Belova sections are in the best condition; the Jabal section, about 103 km, has armed groups collecting tolls at roadblocks, and most lorries would rather go round by sea. Stalls selling sea salt and grilled fish stand beside the salt pans, and long-distance drivers like to spend the night in the lorry park outside the port of Bandari and set off for Belova early next morning, to be in the queue before the port gates open."
    background: {"zh": "联合共和国时期，全岛的国道由国家公路局统一修建和养护，以首都安博哈拉为中心向四方辐射。西海岸公路原是联合共和国的三号国道，连接西海岸的盐场和港口。大分裂后，萨希利亚和贝洛瓦合资重修了两国之间的路段，把它铺成了全岛最平整的公路之一。", "en": "Under the United Republic the island's national roads were built and kept by a single national roads office, radiating from the capital, Ambohara. The West Coast Road was the United Republic's National Road 3, linking the salt works and ports of the west coast. After the Sundering Sahiliya and Belova jointly rebuilt the stretch between them, making it one of the smoothest roads on the island."}
    shield: wave
    via: [div_2e6j0g, div_n49g57, div_f9gjbe, div_2btpwg, div_xfvevz, div_8p600p]  # 贾巴勒—扎纳拉—萨希勒—班达里—贝洛瓦—梅纳瓦利
  - id: rte_ev76at
    ref: S-RA-104
    network: territorial_highway
    class: primary
    status: generated
    names: {"zh": "横贯公路", "en": "Cross-Island Road"}
    notes:
      zh: "横贯公路是领道 S-RA-104，全长约 882 公里，从西海岸的萨希勒出发，向东穿过萨希利亚姆吉尼一带的香料种植区，经安卡瓦爬上安德里纳高原到达安博哈拉，再经拉诺梅纳下到东海岸的马扎瓦，是全岛贯通东西海岸的两条公路中偏北的一条，另一条是岛南部的南方公路。沿途有 14 座跨河桥，最长的拉诺梅纳特大桥约 1.3 公里，隧道共约 4 公里，最长的马扎瓦隧道约 2.7 公里。全线不限速，乡间路段日均车流约 1.8 万辆，进入首都安博哈拉的路段却高达约 26 万辆；按巡航速度全程约七小时。\n高原西坡的一段路沿着深谷开凿，一边是峭壁，一边是悬崖，当地人叫它「天梯」。圣约同盟的物资和援助车队多走这条路往来于萨希勒港和安博哈拉之间，车队里常能看到萨希利亚和联邦的车牌并排行驶。过「天梯」时，司机们习惯放慢车速、关掉收音机，等车开上高原，才松一口气。"
      en: "The Cross-Island Road is territorial highway S-RA-104, about 882 km long. It starts at Sahil on the west coast and runs east through the spice plantations around Mjini in Sahiliya, climbs by way of Ankava onto the Andrina Highlands to Ambohara, and then descends by way of Ranomena to Mazava on the east coast. It is the northern of the island's two coast-to-coast roads, the other being the Southern Road in the south. It crosses 14 rivers, its longest bridge being the Ranomena Viaduct at about 1.3 km, and has about 4 km of tunnels, the longest the Mazava Tunnel at about 2.7 km. There is no speed limit; the rural sections carry about 18,000 vehicles a day, but the stretch into the capital, Ambohara, carries as many as 260,000. At cruising speed the whole road takes about seven hours.\nOn the western slope of the highlands one stretch is cut along a deep gorge, a rock wall on one side and a precipice on the other, and locals call it the 'Sky Ladder'. Covenant League supplies and aid convoys mostly use this road between the port of Sahil and Ambohara, and Sahiliyan and Federation number plates are often seen side by side in the convoys. On the Sky Ladder drivers like to slow down and switch off the radio, breathing out only once they reach the plateau."
    background: {"zh": "联合共和国时期，全岛的国道由国家公路局统一修建和养护，以首都安博哈拉为中心向四方辐射。横贯公路是联合共和国晚期修建的最后一条国道，原计划升级为全封闭、全立交的高速公路，大分裂时工程中断，全线至今仍是双向八车道的一级公路，高原西坡的「天梯」路段连护栏都没有修完。", "en": "Under the United Republic the island's national roads were built and kept by a single national roads office, radiating from the capital, Ambohara. The Cross-Island Road was the last national road the United Republic built, meant to be upgraded to a fully grade-separated expressway; the work stopped at the Sundering, and the road is still a dual carriageway of four lanes each way, with the 'Sky Ladder' on the western slope never even given its full crash barriers."}
    shield: compass
    via: [div_f9gjbe, div_m9kp3y, div_qnzksj, div_0a6gt7]  # 萨希勒—姆吉尼—安博哈拉—马扎瓦
  - id: rte_efzs0e
    ref: S-RA-105
    network: territorial_highway
    class: primary
    status: generated
    names: {"zh": "南方公路", "en": "Southern Road"}
    notes:
      zh: "南方公路是领道 S-RA-105，全长约 782 公里，横贯拉诺瓦岛南部，从西海岸的梅纳瓦利经瘤牛牧区阿纳拉到齐马罗沃，再经矿城福罗纳到达东海岸的伊拉希港，最后一小段进入安博哈拉的安帕尼。它和偏北的横贯公路是全岛仅有的两条贯通东西海岸的公路。全线双向八车道、不限速，沿途有 18 座跨河桥，最长的齐马罗沃高架桥约 9.5 公里；齐马罗沃帝国境内的路段占了一半以上，日均车流 1.9 万到 3.9 万辆，按巡航速度全程约六小时。\n齐马罗沃段是全岛路面最宽、最笔直的公路之一，修建时就考虑了坦克和装甲车的通行，路两侧每隔一段就有一个军用停车区。福罗纳的矿石和钢材过去只能靠这条路上的卡车运往伊拉希港，重载铁路通车后，卡车才少了一些。旱季时，牧民赶着成群的瘤牛沿公路去集市，汽车常要等上半个小时；路牌上画的正是一头牛。"
      en: "The Southern Road is territorial highway S-RA-105, about 782 km long, crossing the south of Ranova from Menavaly on the west coast through the zebu pastures of Anala to Tsimarovo, then through the mining city of Forona to the port of Ilahy on the east coast, with a short last stretch into Ampany in Ambohara. Together with the Cross-Island Road further north it is one of only two roads on the island that run from coast to coast. It is an eight-lane dual carriageway with no speed limit, crossing 18 rivers; its longest bridge is the Tsimarovo Viaduct at about 9.5 km. More than half its length lies within the Tsimarovo empire; it carries 19,000 to 39,000 vehicles a day, and at cruising speed the whole road takes about six hours.\nThe Tsimarovo section is one of the widest and straightest roads on the island, built with tanks and armoured vehicles in mind, with military lay-bys at intervals on both sides. The ore and steel of Forona used to reach the port of Ilahy only by lorry along this road, and the lorries thinned out only when the heavy-haul railway opened. In the dry season herders drive great herds of zebu along the road to market, and cars often have to wait half an hour; fittingly, the road's sign shows a cow."
    background: {"zh": "联合共和国时期，全岛的国道由国家公路局统一修建和养护，以首都安博哈拉为中心向四方辐射。南方公路原是联合共和国的四号国道。齐马罗沃立国后，把境内的路段改建为军用标准的公路，南方战争期间，它是齐马罗沃军队向东西两个方向推进的主要通道。", "en": "Under the United Republic the island's national roads were built and kept by a single national roads office, radiating from the capital, Ambohara. The Southern Road was the United Republic's National Road 4. After its founding Tsimarovo rebuilt the stretch through its territory to military standards, and in the Southern War it was the main road by which Tsimarovo's army pushed east and west."}
    shield: cow
    via: [div_8p600p, div_rxj1qr, div_j0txx6, div_2xgnjq, div_s0cxrv]  # 梅纳瓦利—阿纳拉—齐马罗沃—福罗纳—伊拉希
  - id: rte_kf3jwh
    ref: S-RA-106
    network: territorial_highway
    class: primary
    status: generated
    names: {"zh": "北方公路", "en": "Northern Road"}
    notes:
      zh: "北方公路是领道 S-RA-106，全长约 747 公里，连接拉诺瓦岛北端的丁香产地察拉沃卡、阿瓦拉齐的首都沃希马希和矿城马罗瓦托，最后到达马索沃利的菲拉纳，是世俗协约两个盟国之间的陆上通道。全线双向八车道、不限速，没有隧道，沿途有 17 座跨河桥；约 681 公里在阿瓦拉齐境内，途中还经过东海岸的安科里卡，最后约 66 公里在菲拉纳；通往安巴拉努西河谷稻田的稻谷公路在察拉沃卡与它相接。日均车流 1.5 万到 4.5 万辆，按巡航速度全程约六小时。\n路边的集体农庄和国营工厂门口都挂着红色的标语牌，拖拉机和卡车在路上并行，路牌上画着一束麦穗。阿瓦拉齐的拖拉机和马索沃利的大米就沿着这条路互相交换。两国边境上的「友谊口岸」每逢两国的节日都挂满彩旗，双方的边防军官要在口岸中间握手合影。卡车司机都知道，在阿瓦拉齐段开车要带足油票，沿途的国营加油站常常排着长队。"
      en: "The Northern Road is territorial highway S-RA-106, about 747 km long, linking Tsaravoka, the clove country at the northern tip of Ranova, with Avaratsy's capital Vohimahy and the mining city of Marovato, and ending at Firana in Masovoly; it is the overland link between the two allies of the Secular Accord. It is an eight-lane dual carriageway with no speed limit and no tunnels, crossing 17 rivers; some 681 km lie within Avaratsy, where it also passes Ankorika on the east coast, and the last 66 km or so are in Firana, while the Rice Road from the paddies of the Ambalanosy valley joins it in Tsaravoka. It carries 15,000 to 45,000 vehicles a day, and at cruising speed the whole road takes about six hours.\nRed slogan boards hang at the gates of the collective farms and state factories along the road, tractors drive alongside lorries, and its sign shows a sheaf of wheat. Avaratsy's tractors and Masovoly's rice are traded along this road. The 'Friendship Crossing' on the border between the two countries is hung with bunting on both countries' holidays, when the border officers of each side shake hands for photographs in the middle of the crossing. Lorry drivers know to carry plenty of fuel coupons on the Avaratsy section, where queues often form at the state filling stations."
    background: {"zh": "联合共和国时期，全岛的国道由国家公路局统一修建和养护，以首都安博哈拉为中心向四方辐射。北方公路原是联合共和国北部的五号国道。阿瓦拉齐和马索沃利立国后，按照两国的友好条约共同维护这条路，两国边境上的口岸被命名为「友谊口岸」。", "en": "Under the United Republic the island's national roads were built and kept by a single national roads office, radiating from the capital, Ambohara. The Northern Road was the United Republic's National Road 5 in the north. Since their founding Avaratsy and Masovoly have kept it up together under their friendship treaty, and the crossing on their border is named the Friendship Crossing."}
    shield: wheat
    via: [div_xvdp2k, div_89czvj, div_cq4dgt, div_qe8t49]  # 察拉沃卡—沃希马希—马罗瓦托—菲拉纳
  - id: rte_zg9rtz
    ref: S-RA-107
    network: territorial_highway
    class: primary
    status: generated
    names: {"zh": "高原北路", "en": "Highland North Road"}
    notes:
      zh: "高原北路是领道 S-RA-107，全长约 367 公里，是联合共和国留下的十二条旧国道中最短的一条。它从阿瓦拉齐的矿城马罗瓦托向南，翻过高原北缘到达安博哈拉的菲安特拉，约 91 公里在马罗瓦托境内，约 276 公里在菲安特拉境内。这里是高原战争的主战场之一。停火后，公路在停火线上被两道铁丝网和雷区截断，中间是一片荒废的缓冲区，只有停火线口岸在每月的固定日子开放，供离散家庭团聚和国际救援组织的车队通过。全线只有 3 座跨河桥，没有隧道，最大坡度约 60‰，日均车流 2.5 万到 2.8 万辆，都集中在停火线两侧的路段。\n路边至今能看到被击毁的坦克残骸和弹坑，路牌上画着一道墙。口岸开放的那天，两边的家人一大早就来排队，隔着铁丝网等上半天，带来的米糕和照片要先交给检查人员过目。"
      en: "The Highland North Road is territorial highway S-RA-107, about 367 km long, the shortest of the twelve old national roads of the United Republic. It runs south from the mining city of Marovato in Avaratsy over the northern rim of the highlands to Fiantra in Ambohara, with about 91 km in Marovato and 276 km in Fiantra. It was one of the main battlefields of the Highland War. Since the ceasefire the road has been cut on the ceasefire line by two belts of barbed wire and minefields with an abandoned buffer zone between them, and only the ceasefire-line crossing opens, on fixed days each month, for divided families to meet and for convoys of international relief agencies to pass. The road has only 3 river bridges and no tunnels, with grades of up to about 60‰, and its 25,000 to 28,000 vehicles a day are all on the sections either side of the ceasefire line.\nWrecked tanks and shell craters can still be seen beside the road, and its sign shows a wall. On crossing days families on both sides queue from early morning and wait half the day at the wire, and the rice cakes and photographs they bring must first be shown to the inspectors."
    background: {"zh": "联合共和国时期，全岛的国道由国家公路局统一修建和养护，以首都安博哈拉为中心向四方辐射。高原北路原是联合共和国连接北部矿区和首都的六号国道。高原战争中，双方为争夺这条路反复拉锯，沿线的桥梁全部被炸毁；停火后，两国各自修复了本方一侧的路段，中间的缓冲区至今无人修整。", "en": "Under the United Republic the island's national roads were built and kept by a single national roads office, radiating from the capital, Ambohara. The Highland North Road was the United Republic's National Road 6, linking the northern mines with the capital. In the Highland War the two sides fought back and forth over it and every bridge was blown; since the ceasefire each country has repaired its own side, but the buffer zone between them has never been touched."}
    shield: wall
    via: [div_cq4dgt, div_wzx2kn]  # 马罗瓦托—菲安特拉
  - id: rte_ad9hrk
    ref: S-RA-108
    network: territorial_highway
    class: primary
    status: generated
    names: {"zh": "香草公路", "en": "Vanilla Road"}
    notes:
      zh: "香草公路是领道 S-RA-108，全长约 540 公里，从西海岸的贝洛瓦向东，经安博塔的甘蔗田进入安博维的香草产区，再经拉诺马的森林到达安博哈拉的安德里纳，爬上安德里纳高原。全线双向八车道、不限速，没有隧道，沿途有 13 座跨河桥，最大坡度约 52‰；贝洛瓦境内约 77 公里，安博塔约 117 公里，安博维约 135 公里，拉诺马约 133 公里，安德里纳约 79 公里。日均车流 1.2 万到 3.9 万辆，按巡航速度全程约四个多小时。\n每年收获季节，满载香草荚的卡车由武装保安护送着开往贝洛瓦港出口，路边的检查站比加油站还多，路牌上画着一棵棕榈。拉诺马口岸是这条路上安博维与安博哈拉之间的口岸，收获季节等候过境的货车排出几公里长。国际调查报告指出，这条路也是毒品从岛外转运的通道之一。司机们说，在这条路上要准备三样东西：通行证、零钱和耐心。"
      en: "The Vanilla Road is territorial highway S-RA-108, about 540 km long, running east from Belova on the west coast through the sugar-cane fields of Ambota into the vanilla country of Ambovy, then through the forests of Ranoma to Andrina in Ambohara, climbing onto the Andrina Highlands. It is an eight-lane dual carriageway with no speed limit and no tunnels, crossing 13 rivers, with grades of up to about 52‰; some 77 km lie in Belova, 117 km in Ambota, 135 km in Ambovy, 133 km in Ranoma and 79 km in Andrina. It carries 12,000 to 39,000 vehicles a day, and at cruising speed the whole road takes a little over four hours.\nEvery harvest, lorries loaded with vanilla pods drive to the port of Belova for export under armed escort, there are more checkpoints along the road than petrol stations, and its sign shows a palm tree. The Ranoma Crossing, on this road between Ambovy and Ambohara, sees queues of lorries kilometres long in the harvest season. International investigations have found that the road is also one of the routes by which drugs leave the island. Drivers say you need three things on this road: your permits, small change and patience."
    background: {"zh": "联合共和国时期，全岛的国道由国家公路局统一修建和养护，以首都安博哈拉为中心向四方辐射。香草公路原是联合共和国的七号国道，为香草和甘蔗的外运而修建。大分裂后，安博维的「三家族」出资重修了境内的路段，并在沿线设立了收费站。", "en": "Under the United Republic the island's national roads were built and kept by a single national roads office, radiating from the capital, Ambohara. The Vanilla Road was the United Republic's National Road 7, built to carry vanilla and sugar out to the coast. After the Sundering Ambovy's 'Three Families' paid to rebuild the stretch through their country and set up toll stations along it."}
    shield: palm
    via: [div_xfvevz, div_ah0qbp, div_3j9c24, div_zjhw8d, div_7kqjx0]  # 贝洛瓦—安博塔—安博维—拉诺马—安德里纳
  - id: rte_afghhd
    ref: S-RA-109
    network: territorial_highway
    class: primary
    status: generated
    names: {"zh": "卡西里公路", "en": "Kasiri Road"}
    notes:
      zh: "卡西里公路是领道 S-RA-109，全长约 415 公里，从安博哈拉的地热城安卡瓦向西，下到萨希利亚的瘤牛牧区卡西里，再到达西海岸的班达里港。全线双向八车道、不限速，没有隧道，沿途有 7 座跨河桥，最大坡度约 47‰；安卡瓦境内约 84 公里，卡西里约 168 公里，班达里约 163 公里。日均车流 1.8 万到 2.4 万辆，按巡航速度全程约三小时。\n这一带是讲拉诺瓦语的高原和讲卡西里语的海岸之间的过渡地带，沿线的村庄里，教堂和清真寺常常相隔不远，集市上两种语言混着用，路牌上画着一面鼓。每周一次的卡西里瘤牛集市吸引着两国的牧民，赶集那天清晨，公路上满是牛群，卡车只能跟在后面慢慢挪。从高原下来的司机常在半路停车，买一包海边运上来的鱼干；从海边上去的人则带回高原的咖啡。"
      en: "The Kasiri Road is territorial highway S-RA-109, about 415 km long, running west from the geothermal city of Ankava in Ambohara down to the zebu pastures of Kasiri in Sahiliya and on to the port of Bandari on the west coast. It is an eight-lane dual carriageway with no speed limit and no tunnels, crossing 7 rivers, with grades of up to about 47‰; some 84 km lie in Ankava, 168 km in Kasiri and 163 km in Bandari. It carries 18,000 to 24,000 vehicles a day, and at cruising speed the whole road takes about three hours.\nThis is the borderland between the Ranovan-speaking highlands and the Kasiri-speaking coast: in the villages along the road churches and mosques often stand close together, the two languages are mixed in the markets, and the road's sign shows a drum. The weekly zebu market at Kasiri draws herders from both countries, and on market mornings the road fills with cattle and lorries can only creep along behind them. Drivers coming down from the highlands often stop on the way to buy a packet of dried fish brought up from the coast, and those going up take highland coffee home."
    background: {"zh": "联合共和国时期，全岛的国道由国家公路局统一修建和养护，以首都安博哈拉为中心向四方辐射。卡西里公路原是联合共和国的八号国道。安博哈拉和萨希利亚同属圣约同盟，两国在公路上的口岸实行简化手续，牧民凭身份证就能赶着牛群过境。", "en": "Under the United Republic the island's national roads were built and kept by a single national roads office, radiating from the capital, Ambohara. The Kasiri Road was the United Republic's National Road 8. Ambohara and Sahiliya both belong to the Covenant League and keep simplified formalities at their crossing on this road, so herders can drive their cattle across on an identity card."}
    shield: drum
    via: [div_6py47w, div_6jwhzg, div_2btpwg]  # 安卡瓦—卡西里—班达里
  - id: rte_g1n049
    ref: S-RA-110
    network: territorial_highway
    class: primary
    status: generated
    names: {"zh": "西南公路", "en": "South-West Road"}
    notes:
      zh: "西南公路是领道 S-RA-110，全长约 502 公里，从齐马罗沃向西南，经安塔诺的牧区和贝拉纳的盐湖到达卡波拉，穿过拉诺瓦岛最干燥的多刺灌木林和半荒漠。全线双向八车道、不限速，没有隧道，沿途有 13 座跨河桥，桥梁共约 17 公里，最长的齐马罗沃特大桥约 13.7 公里；约 418 公里在齐马罗沃帝国境内，最后约 84 公里在卡波拉新秩序自由领。日均车流 1.4 万到 3.7 万辆，按巡航速度全程约四小时。\n沿途村庄稀少，加油站之间相隔上百公里，司机们出发前都会多带几桶水和燃料，路牌上画着一枚晶体。安塔诺的牧民赶着瘤牛到路边的水坑饮水，贝拉纳一带的盐湖在旱季结出白色的盐壳，正午的热浪让远处的盐湖看起来像一片会移动的水。卡波拉边境冲突期间，这条路是齐马罗沃军队进攻卡波拉的通道，路边至今留着当年的战壕，沙土慢慢把它们填平了一半。"
      en: "The South-West Road is territorial highway S-RA-110, about 502 km long, running south-west from Tsimarovo through the pastures of Antano and past the salt lakes of Belana to Kabola, across the driest spiny thicket and semi-desert on Ranova. It is an eight-lane dual carriageway with no speed limit and no tunnels, crossing 13 rivers on about 17 km of bridges, the longest the Tsimarovo Viaduct at about 13.7 km; some 418 km lie within the Tsimarovo empire and the last 84 km or so in the New Order Free Territory of Kabola. It carries 14,000 to 37,000 vehicles a day, and at cruising speed the whole road takes about four hours.\nVillages are few, petrol stations are more than a hundred kilometres apart, and drivers set out with extra cans of water and fuel; the road's sign shows a crystal. Herders in Antano bring their zebu to drink at roadside water holes, the salt lakes around Belana form a white crust in the dry season, and at midday the heat haze makes the distant lakes look like water on the move. In the Kabola border conflict the road was Tsimarovo's line of attack on Kabola, and the trenches of those days still line it, half filled by drifting sand."
    background: {"zh": "联合共和国时期，全岛的国道由国家公路局统一修建和养护，以首都安博哈拉为中心向四方辐射。西南公路原是联合共和国通往西南盐区的九号国道，路基建在干涸的河床上。大分裂后，齐马罗沃和卡波拉各自维护本方的路段，两国之间的口岸长期关闭。", "en": "Under the United Republic the island's national roads were built and kept by a single national roads office, radiating from the capital, Ambohara. The South-West Road was the United Republic's National Road 9 to the salt country of the south-west, built along dry river beds. Since the Sundering Tsimarovo and Kabola have each kept up their own stretch, and the crossing between them has long been closed."}
    shield: crystal
    via: [div_j0txx6, div_vqr33a, div_fv1vhe, div_axvb2e]  # 齐马罗沃—安塔诺—贝拉纳—卡波拉
  - id: rte_32wwny
    ref: S-RA-111
    network: territorial_highway
    class: primary
    status: generated
    names: {"zh": "阿拉齐纳公路", "en": "Alatsina Road"}
    notes:
      zh: "阿拉齐纳公路是领道 S-RA-111，全长约 526 公里，从齐马罗沃向东南，经伊特拉的宝石矿区到达阿拉齐纳和海边的法里。全线是双向八车道的一级公路，没有隧道，沿途有 11 座跨河桥，最长的齐马罗沃特大桥约 9.3 公里，各段由所经国家的公路部门管养。约 165 公里在齐马罗沃境内，其余在阿拉齐纳原住民邦联：伊特拉的牧区约 109 公里，阿拉齐纳约 138 公里，法里约 106 公里。日均车流在 1.4 万到 3.7 万辆之间，全线不限速，按巡航速度走完全程约需四小时。\n南方战争期间，成千上万的难民沿着这条路逃往阿拉齐纳，路边至今立着为途中死去的人竖起的石堆，公路的路牌图案也是一座石堆。如今援助组织的白色卡车每天沿着这条路往返于法里港和阿拉齐纳的难民营之间，车头插着小旗，开得不紧不慢。旱季牧人赶着瘤牛走在路肩上，司机们远远就放慢车速；经过石堆时，邦联的司机习惯停一下，往上添一块石头。"
      en: "The Alatsina Road is territorial highway S-RA-111, about 526 km long, running south-east from Tsimarovo through the gem fields of Itra to Alatsina and Fary on the coast. It is an eight-lane dual carriageway with no tunnels and 11 river bridges, the longest the Tsimarovo Viaduct at about 9.3 km, and each section is kept by the road authority of the country it crosses. About 165 km lie in Tsimarovo and the rest in the Alatsina Indigenous Confederacy: some 109 km in the pastures of Itra, 138 km in Alatsina and 106 km in Fary. Between 14,000 and 37,000 vehicles use it daily; there is no speed limit, and at cruising speed the whole road takes about four hours.\nIn the Southern War tens of thousands of refugees fled along it to Alatsina, and cairns raised for those who died on the way still stand beside it; the road's sign carries a cairn too. Today the white lorries of the aid agencies travel it every day between the port of Fary and the Alatsina refugee camp, small flags on their bonnets, never in a hurry. In the dry season herders drive their zebu along the hard shoulder and drivers slow down from far off; passing the cairns, drivers from the Confederacy like to stop for a moment and add a stone."
    background: {"zh": "联合共和国时期，全岛的国道由国家公路局统一修建和养护，以首都安博哈拉为中心向四方辐射。阿拉齐纳公路原是联合共和国的十号国道。南方战争后，国际援助组织出资修复了阿拉齐纳境内被毁的桥梁和路面，以便援助物资从法里港运往难民营。", "en": "Under the United Republic the island's national roads were built and kept by a single national roads office, radiating from the capital, Ambohara. The Alatsina Road was the United Republic's National Road 10. After the Southern War international aid agencies paid to repair the bridges and road destroyed in Alatsina so that aid could reach the camp from the port of Fary."}
    shield: cairn
    via: [div_j0txx6, div_3jg5nn, div_xa2b3m, div_xa2n57]  # 齐马罗沃—伊特拉—阿拉齐纳—法里
  - id: rte_mg3f38
    ref: S-RA-112
    network: territorial_highway
    class: primary
    status: generated
    names: {"zh": "拉诺梅纳公路", "en": "Ranomena Road"}
    notes:
      zh: "拉诺梅纳公路是领道 S-RA-112，全长约 505 公里，从首都安博哈拉向东南，经拉诺梅纳的水电站和雨林，沿法拉纳断崖蜿蜒而下，到达东海岸的港口塔马塔，是首都通往东海岸最近的路。安博哈拉境内约 73 公里，拉诺梅纳约 218 公里，塔马塔约 214 公里。全线双向八车道、不限速，没有隧道，沿途有 13 座跨河桥，最长的塔马塔特大桥约 1.3 公里，最大坡度 60‰。日均车流 2.2 万到 9.6 万辆，按巡航速度全程约四小时。\n断崖路段有几十个急弯，路边的瀑布在雨季水量最大，常有游客停车拍照，路牌上画的也是一道瀑布。塔马塔港进口的燃料和货物沿着这条路运上高原，重载卡车下断崖时要一路点刹，弯道旁的避险车道常年铺着碎石。星期日全国停业，这条平日繁忙的路也安静下来，路上多是去教堂的家庭。"
      en: "The Ranomena Road is territorial highway S-RA-112, about 505 km long, running south-east from the capital, Ambohara, past the hydroelectric stations and rainforest of Ranomena and winding down the Farana Escarpment to the port of Tamata on the east coast; it is the shortest way from the capital to the east coast. Some 73 km lie in Ambohara, 218 km in Ranomena and 214 km in Tamata. It is an eight-lane dual carriageway with no speed limit and no tunnels, crossing 13 rivers; its longest bridge is the Tamata Viaduct at about 1.3 km, and its steepest grade is 60‰. It carries 22,000 to 96,000 vehicles a day, and at cruising speed the whole road takes about four hours.\nThe escarpment section has dozens of hairpin bends, the waterfalls beside the road are at their fullest in the rains, and visitors often pull over to take pictures; the road's sign shows a waterfall too. Fuel and goods imported through Tamata are carried up to the highlands on this road, heavy lorries brake all the way down the escarpment, and the escape lanes beside the bends are kept covered in gravel all year. On Sundays the whole country stops, and this busy road falls quiet, travelled mostly by families on their way to church."
    background: {"zh": "联合共和国时期，全岛的国道由国家公路局统一修建和养护，以首都安博哈拉为中心向四方辐射。拉诺梅纳公路原是联合共和国的十一号国道，修建时动用了上万名工人在断崖上开凿路基。联邦成立后，用海外援助的资金在断崖路段加装了护栏和防落石网。", "en": "Under the United Republic the island's national roads were built and kept by a single national roads office, radiating from the capital, Ambohara. The Ranomena Road was the United Republic's National Road 11, and tens of thousands of labourers cut its roadbed into the escarpment. After the federation was founded, overseas aid paid for crash barriers and rockfall nets on the escarpment stretch."}
    shield: waterfall
    via: [div_qnzksj, div_z0k237, div_gjh4td]  # 安博哈拉—拉诺梅纳—塔马塔
  - id: rte_m7tc5h
    ref: S-RA-113
    network: territorial_highway
    class: primary
    status: generated
    names: {"zh": "稻谷公路", "en": "Rice Road"}
    notes:
      zh: "稻谷公路是领道 S-RA-113，全长约 185 公里，从阿瓦拉齐西北海岸的农业城市安巴拉努西出发，沿安巴拉努西河谷而上，向南进入察拉沃卡，在那里接上北方公路，全线都在阿瓦拉齐境内。全线双向八车道、不限速，没有隧道，最长的桥是约 1.3 公里的察拉沃卡特大桥，按巡航速度全程约一个半小时。河谷里是全国最大的稻田和甘蔗田，「红旗」集体农庄的大米、甘蔗和糖厂的蔗糖都沿这条路运出河谷，再经北方公路运往首都沃希马希和马索沃利，马索沃利的拖拉机零件和化肥也沿这条路运进来。\n路两边是一眼望不到头的稻田，插秧季田里站满了庄员，收割季公路上拖拉机拉着稻谷一辆接一辆，路牌上画着一株稻穗。路边的碾米厂门口堆着成袋的新米，集体农庄的大喇叭从清晨响到傍晚，开车经过的人隔着车窗都能听见当天的生产任务。"
      en: "The Rice Road is territorial highway S-RA-113, about 185 km long, running from Ambalanosy, the farming city on Avaratsy's north-west coast, up the Ambalanosy valley and south into Tsaravoka, where it joins the Northern Road; it lies wholly within Avaratsy. It is an eight-lane dual carriageway with no speed limit and no tunnels; its longest bridge is the Tsaravoka Viaduct at about 1.3 km, and at cruising speed the whole road takes about an hour and a half. The valley holds the country's largest rice and sugar-cane fields, and the rice and cane of the Red Flag collective farm and the sugar of the valley's mills leave by this road for the Northern Road, the capital Vohimahy and Masovoly, while tractor parts and fertiliser come in along it.\nRice fields stretch out of sight on both sides; at planting time the paddies are full of farm members, at harvest tractors hauling rice follow one another along the road, and its sign shows a rice plant. Sacks of new rice are piled at the gates of the roadside mills, and the farms' loudspeakers play from dawn to dusk, so passing drivers can hear the day's production targets through the window."
    background: {"zh": "联合共和国时期，全岛的国道由国家公路局统一修建和养护，以首都安博哈拉为中心向四方辐射。稻谷公路原是五号国道通往安巴拉努西河谷的支线，北方公路过去要绕进河谷再折回来。阿瓦拉齐立国后，把北方公路拉直，把这条支线拓宽成与北方公路同样的双向八车道，单独编号，集体农庄的大米和蔗糖由此运往首都和友好的马索沃利。", "en": "Under the United Republic the island's national roads were built and kept by a single national roads office, radiating from the capital, Ambohara. The Rice Road was the branch of National Road 5 into the Ambalanosy valley, and the Northern Road used to turn into the valley and come back out. After its founding Avaratsy straightened the Northern Road and widened this branch to the same eight-lane dual carriageway, numbered on its own, and the collective farms' rice and sugar now go out along it to the capital and to friendly Masovoly."}
    shield: rice
    ends_at_network: true
    via: [div_jhtwr7, div_89czvj]  # 安巴拉努西—沃希马希
  - id: rte_k0qy3n
    ref: PA-7351
    network: municipal_road
    class: secondary
    status: generated
    names: {"zh": "人民军军用7351公路", "en": "People's Army Military Road 7351"}
    notes:
      zh: "人民军军用7351公路是马索沃利的军用公路，编号 PA-7351，从首都安德里安巴城北天文台大道附近的领袖保卫局215设施出发，向西穿过城北，经过东口检查站进入人民军军用3826隧道，在海底径直穿过海湾，在西岸法里希凯利湖干部区的东侧上岸，经过干部区东门检查站，再沿海湾西岸南下，进入拉诺迈措湖官邸区北门检查站，到达官邸区里的领袖保卫局721设施，是领袖往返首都和官邸区的道路。公路的官方名称只是人民军的一个编号，不编入国家公路网，国内的地图上从不标出，实际由领袖保卫局管理和经营。它和人民军军用8203铁路都是领袖专用的，各走各的海湾隧道，路线完全保密：除了领袖保卫局的警卫和司机，任何官员都不得接触、使用这条公路。3826隧道两端的洞口各有一座检查站；上岸以后，沿途除了干部区东门和官邸区北门，还有三座领袖保卫局哨所，路旁的树林被砍出几十米宽的空地，以防有人埋伏。\n领袖的车队由十几辆一模一样的黑色轿车组成，外人不知道领袖坐在哪一辆里。车队穿过隧道以后，在干部区东门不停车，直接开到官邸区北门，进门抵达领袖的官邸；领袖进城时，车队开到215设施，领袖在那里下车，换乘首都的警卫车队前往市中心的党政军机关。干部区东门是公路上岸后的第一站，但干部区的人一律不准驶上公路，连政治局委员进城也要走5108公路绕行海湾。车队出发前一小时，隧道里的其他车辆一律清空，沿途哨所封锁所有通向公路的小路，附近的居民不得走出家门。领袖保卫局的养路车和巡逻车在每座检查站和哨所都要停车，出示领袖保卫局签发的通行证；其余时间路上只有巡逻车隔一段时间开过。"
      en: "People's Army Military Road 7351 is a Masovoly military road, numbered PA-7351. From Leader's Guard Bureau Facility 215 near Observatory Avenue in the north of the capital, Andriamba, it runs west across the north of the city, passes the East Portal Checkpoint into People's Army Military Tunnel 3826, crosses straight under the bay, and comes ashore on the western side, east of the Lake Farihikely Cadre Quarter; it then passes the quarter's East Gate Checkpoint and runs south along the shore through the North Gate Checkpoint of the Lake Ranomaitso Residences to Leader's Guard Bureau Facility 721 inside them. It is the leader's road between the capital and the Residences. Its official name is no more than a People's Army number: it lies outside the national road network and never appears on maps printed in the country, and in fact the Leader's Guard Bureau runs it. Like People's Army Military Railway 8203 it is for the leader alone, and each has its own tunnel under the bay; their routes are kept wholly secret, and no official but the Bureau's own guards and drivers may go near the road or use it. Tunnel 3826 has a checkpoint at either portal; ashore, besides the quarter's East Gate and the Residences' North Gate, three Leader's Guard Bureau posts stand along the road, and the forest has been cleared for some tens of metres on either side so that nobody can lie in wait.\nThe leader's motorcade is a dozen or more identical black saloons, and outsiders never know which one he is in. Out of the tunnel it passes the quarter's East Gate without stopping and drives straight to the Residences' North Gate and on to the leader's residence; when the leader goes to town, the motorcade takes him to Facility 215, where he alights and changes into the capital's guard convoy for the party, army and state buildings in the city centre. The East Gate is the road's first stop ashore, but nobody from the quarter may drive onto the road, and even Politburo members go to town the long way round the bay on Road 5108. An hour before the motorcade sets out, the tunnel is cleared of all other traffic, the posts close every lane leading onto the road and the people nearby may not leave their houses. The Bureau's own maintenance and patrol vehicles must stop at each checkpoint and post and show a Bureau pass; the rest of the time the road is empty but for a patrol car passing now and then."
