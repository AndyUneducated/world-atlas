# Road routes of the Everlong Summer Islands Territory.
#
# Four grades, the same in every territory; route numbers carry the territory infix:
#   G-ES-1..99    国家高速 national expressway    (class motorway)
#   S-ES-1..99    领地高速 territorial expressway (class motorway)
#   S-ES-101..    领道 territorial highway        (class primary)
#   X-ES-001..    市道 city road                  (class secondary)
# The fields are those of world/transport/cn-nv-roads.yaml. Malakan, Pilu and the Vahira Islands
# have no road link and are reached by sea.
routes:
  - id: rte_p0mcjs
    ref: G-ES-1
    network: national_expressway
    class: motorway
    status: generated
    names:
      zh: 伊米穆高速
      en: Imimu Expressway
      art-x-ivuran: Imimu Vesupelavu
    wonder:
      structure: bridge
      zh: 世界最长的桥梁，长约 101 公里，从基鲁迈岛跨海通往主岛
      en: The longest bridge in the world, about 101 km, crossing the sea from Kirumai Island to the main island
    notes:
      zh: "伊米穆高速是长夏群岛的 1 号国家高速公路，全长约 3490 公里，是世界最长的高速公路，也是领地唯一一条经过全部十二个市和公社的公路，伊武兰语名意为「长久的高速公路」。它从基鲁迈岛的迈萨里区出发，以约 101 公里的哈努西鲁河口跨海大桥越海登上主岛，经萨伦纳姆的萨鲁凯、伊拉瓦姆、奥卢瓦尔区，彭纳拉姆的埃拉库尔区，瓦利凯的埃鲁塔姆区，温达坎的坎达瓦、托兰卡区，洛米兰的塔卡维区和洛米哈努国家公园，首府米雷兰的翁贝尔、帕萨卢、伊拉米区，基拉努的乌拉帕区，纳卢迈的托武卢区，塔卢马兰的帕达兰区和乌诺卡里的卡里纳区，到埃武托拉公社的哈马图区，全程约二十二小时。全线双向十二车道，城区和桥隧密集的山区路段限速 140 公里，其余路段不限速。线路有约 313 公里桥梁、51 公里隧道和 68 座跨河桥；蒂拉凯苏山脉隧道长约 35 公里，在洛米兰市马纳卢区穿过中脊，是世界最长的公路山岭隧道。萨伦纳姆伊拉瓦姆区一段日均车流约 5.3 万辆，是领地最繁忙的高速路段。\n跑完全程要穿过雨季和旱季交界的好几个地方，长途司机们说「一天之内能遇上三场雨」。沿线服务区各有招牌：萨伦纳姆的椰浆糯米饭、瓦利凯的海藻饼、米雷兰的高原咖啡、彭纳拉姆的黑胡椒炒蟹，有人专门按服务区的菜单安排行程。"
      en: "The Imimu Expressway is National Expressway 1 of the Everlong Summer Islands. About 3,490 km long, it is the longest expressway in the world and the only road in the territory that passes through all twelve of its cities and the commune; its Ivuran name means 'the lasting expressway'. It sets out from Maisari District on Kirumai Island, crosses the sea to the main island on the Hanusiru Mouth Bridge, about 101 km long, and runs through Sarukkai, Ilavam and Oluvar in Sarunnam, Elakur in Pennaram, Eruttam in Vallikkai, Kandava and Toranka in Undakan, Takavi and the Lomihanu National Park in Lomiran, Ombel, Pasalu and Ilami in the capital Mirelan, Urapa in Kilanu, Tovulu in Nalumai, Padaran in Talumaran and Karina in Unokari to Hamatu District in Evutola Commune, about twenty-two hours' driving in all. It has six lanes each way; urban stretches and mountain stretches dense with bridges and tunnels are limited to 140 km/h, and the rest has no limit. There are about 313 km of bridges, 51 km of tunnels and 68 river bridges; the Tirakesu Mountains Tunnel, about 35 km long, passes under the central range in Manalu District of Lomiran and is the longest mountain road tunnel in the world. The stretch through Ilavam District of Sarunnam carries some 53,000 vehicles a day, the busiest expressway section in the territory.\nA full run crosses several places where the wet and dry seasons meet, and long-distance drivers say \"you'll get three showers in a day\". Each service area along it has its own speciality: coconut sticky rice near Sarunnam, seaweed cake near Vallikkai, plateau coffee near Mirelan, black-pepper crab near Pennaram, and some people plan their trips around the service-area menus."
    background:
      zh: 长夏群岛的主岛东北—西南长约 2400 公里，十二个市分布在西南的三角洲、南岸和西北岸的平原、中脊山地、中部高原和外海的群岛上，过去城市之间大多靠海运和航班往来。领地设立后，政务院决定修建一条贯穿全境、经过每一个市的国家高速公路，编为 1 号。线路从基鲁迈群岛出发，以长桥跨过哈努西鲁河口外的海面登上主岛，经三角洲和南岸进入山地，以长隧道穿过蒂拉凯苏山脉，翻上哈努帕拉高原经过首府，再沿主岛中部的谷地和丘陵一路延伸到东北端的埃武托拉公社。穿过国家公园的路段与其他路段同样建设，沿线设有动物通道。全线开通后，从岛链到公社都能驾车直达，沿线的小城和村镇也接入了全岛的路网。
      en: The main island of the Everlong Summer Islands runs some 2,400 km from north-east to south-west, and its twelve cities lie on the delta in the south-west, the plains of the south and north-west coasts, the central range, the central plateau and the islands offshore; travel between them used to be mostly by sea and by air. After the territory was founded the Executive Council decided to build a national expressway through the whole territory and every one of its cities, numbered 1. It starts in the Kirumai Islands, crosses the sea off the mouth of the Hanusiru on a long bridge to reach the main island, runs over the delta and along the south into the mountains, passes under the Tirakesu Mountains in a long tunnel, climbs to the Hanupala Plateau and the capital, and then follows the valleys and hills of the middle of the island all the way to Evutola Commune at the north-eastern tip. Through the national park it is built like any other stretch, with crossings for wildlife along it. Since it opened one can drive all the way from the island chain to the commune, and the small towns and villages along it have joined the island's road network.
    tunnel_cost: 3.5
    via: [div_a0nff8, div_ycfvt9, div_n90922, div_0dgwyn, div_v7v7hg, div_0hrhwh, div_6cy2yw, div_gzefq6, div_a5rwcq, div_f0wwdt, div_z0z4vz, div_56take, div_daamp6, div_pr78k0, div_n11kpv, div_y57m7b, div_h88tgx, div_p3x7j4]  # maisari – sarukkai – ilavam – oluvar – elakur – eruttam – kandava – toranka – takavi – ombel – pasalu – ilami – urapa – tovulu – padaran – karina – tanivu – hamatu
  - id: rte_t9ghre
    ref: G-ES-2
    network: national_expressway
    class: motorway
    status: generated
    names:
      zh: 塞洛高速
      en: Selo Expressway
      art-x-ivuran: Selo Vesupelavu
    notes:
      zh: "塞洛高速是长夏群岛的 2 号国家高速公路，全长约 2250 公里，伊武兰语名意为「夏天的高速公路」。它从瓦利凯的老城坎纳鲁尔区出发，经萨卢瓦伊区进入山地，经温达坎的乌拉韦劳自然保护区、托兰卡区和佩伦达区，穿过洛米哈努国家公园南部，再经米雷兰哈努帕拉区的南缘下到东南岸，经基拉努的埃莱努、萨基拉、佩萨维区，塔卢马兰的伦博、塔卢、塞拉努区，乌诺卡里的贝卢阿区和乌诺维拉矿区，到埃武托拉公社的奥鲁武区和哈马图区，全程约十四小时。全线双向十二车道，城区和山区路段限速 140 公里，其余路段不限速。线路有约 91 公里桥梁、5 公里隧道和 41 座跨河桥，佩伦达高架桥长约 12 公里，塔卢隧道长约 5 公里。基拉努和塔卢马兰两段日均车流三万多辆，晶圆厂、船厂和电池厂的货车往来不断。\n穿过乌拉韦劳自然保护区的路段，晴天能望见领地最高峰的峰顶，山下的村子相信那是祖先在看护梯田，司机们经过时也习惯放慢车速多看一眼。雨季第一场大雨的「雨鼓日」，沿线村镇的木鼓声隔着车窗都能听见。"
      en: "The Selo Expressway is National Expressway 2 of the Everlong Summer Islands, about 2,250 km long; its Ivuran name means 'the summer expressway'. It sets out from Kannarur, the old town of Vallikkai, climbs into the mountains through Saluvai District, runs through the Uravelau Nature Reserve and Toranka and Perunda districts of Undakan and across the south of the Lomihanu National Park, then comes down past the southern edge of Hanupala District in Mirelan to the south-east coast and runs through Elenu, Sakila and Pesavi in Kilanu, Lembo, Talu and Seranu in Talumaran, and Belua and the Unovila mining zone in Unokari to Oruvu and Hamatu districts in Evutola Commune, about fourteen hours' driving in all. It has six lanes each way, limited to 140 km/h in towns and in the mountains and unlimited elsewhere. There are about 91 km of bridges, 5 km of tunnels and 41 river bridges; the Perunda Viaduct is about 12 km long and the Talu Tunnel about 5 km. Through Kilanu and Talumaran it carries more than 30,000 vehicles a day, with lorries running to and from the chip fabs, shipyards and battery plants.\nWhere it crosses the Uravelau Nature Reserve, on clear days you can see the summit of the territory's highest peak, which the villages below believe is the ancestors watching over the terraces, and drivers tend to slow down for a second look. On Uvesa Tomaku, the day of the wet season's first heavy rain, the wooden drums of the villages along the way can be heard through the car windows."
    background:
      zh: 东南岸是领地的工业和科技走廊：瓦利凯港是国际转运枢纽，基拉努有领地的半导体产业园，塔卢马兰有船厂、深水港和电池厂，乌诺卡里的镍产品从贝卢阿装船外运。领地修建塞洛高速，把这几座城市串成一条走廊，再延伸到东北端的埃武托拉公社。瓦利凯和基拉努之间横着蒂拉凯苏山脉的南坡，线路从瓦利凯进入山地，经温达坎的梯田区和国家公园南部的雨林，在哈努帕拉高原南缘下到基拉努，与伊米穆高速和磁悬浮一起构成东南岸的主要通道。
      en: "The south-east coast is the territory's corridor of industry and technology: Vallikkai port is the international transhipment hub, Kilanu has the territory's semiconductor park, Talumaran has shipyards, a deep-water port and battery plants, and Unokari's nickel is shipped from Belua. The territory built the Selo Expressway to string these cities into one corridor and on to Evutola Commune at the north-eastern tip. Between Vallikkai and Kilanu lie the southern slopes of the Tirakesu Mountains, so the road climbs into the mountains from Vallikkai, crosses the terraces of Undakan and the rainforest in the south of the national park and comes down past the southern edge of the Hanupala Plateau to Kilanu; with the Imimu Expressway and the maglev it is one of the main routes of the south-east coast."
    tunnel_cost: 3.5
    via: [div_3ytmrh, div_w2pbh1, div_rmy0kf, div_yah63b, div_2fhccc, div_w7bas1, div_qp9ner]  # kannarur – perunda – sakila – pesavi – talu – belua – oruvu
  - id: rte_yb3kje
    ref: G-ES-3
    network: national_expressway
    class: motorway
    status: generated
    names:
      zh: 纳卢高速
      en: Nalu Expressway
      art-x-ivuran: Nalu Vesupelavu
    notes:
      zh: "纳卢高速是长夏群岛的 3 号国家高速公路，全长约 2700 公里，伊武兰语名意为「浪」。它从萨伦纳姆的瓦什塔赖区出发，穿过皮拉凯区的红树林海岸，沿西北岸经彭纳拉姆的蒂拉凯、马伦杜尔区，洛米兰的卢瓦纳、卡塔穆区和洛米哈努国家公园，纳卢迈的迈卢阿、塞纳卢、维兰塔、帕兰图区，再经乌诺卡里的霍拉坦区和乌诺维拉矿区，到埃武托拉公社的帕卡里区，全程约十七小时。全线双向十二车道，城区和山区路段限速 140 公里，其余路段不限速。线路有约 65 公里桥梁、3 公里隧道和 34 座跨河桥；洛米翁贝尔湖特大桥长约 12 公里，跨过雨林深处黑水湖的淹水林，卡塔穆隧道长约 2 公里。日均车流 1.6 万到 2.7 万辆，沿线是香料园、雨林、珍珠贝养殖场和果园，游客和运送香料、水果的货车占了很大比例。\n沿西北岸的路段一边是海、一边是香料园和果园，车窗一开，胡椒和豆蔻的香味就飘进来。路边的果摊在旱季末堆满了芒果、榴莲和菠萝蜜，司机们说这条路「开着开着就饿了」。"
      en: "The Nalu Expressway is National Expressway 3 of the Everlong Summer Islands, about 2,700 km long; Nalu is Ivuran for 'wave'. It sets out from Vashtarai District in Sarunnam, crosses the mangrove coast of Pilakkai District and follows the north-west coast through Tirakkai and Marandur in Pennaram, Luvana, Katamu and the Lomihanu National Park in Lomiran, and Mailua, Senalu, Viranta and Parantu in Nalumai, then through Horatan and the Unovila mining zone in Unokari to Pakari District in Evutola Commune, about seventeen hours' driving in all. It has six lanes each way, limited to 140 km/h in towns and in the mountains and unlimited elsewhere. There are about 65 km of bridges, 3 km of tunnels and 34 river bridges; the Lake Lomiombel Bridge, about 12 km long, crosses the flooded forest of the blackwater lake deep in the rainforest, and the Katamu Tunnel is about 2 km long. It carries 16,000 to 27,000 vehicles a day past spice gardens, rainforest, pearl farms and orchards, and tourists and lorries carrying spices and fruit make up a large share of them.\nAlong the north-west coast the road runs between the sea and the spice gardens and orchards, and with the window open the scent of pepper and cardamom drifts in. At the end of the dry season the roadside stalls are piled with mangoes, durians and jackfruit, and drivers say this road \"makes you hungry as you go\"."
    background:
      zh: 主岛的西北岸是领地的香料、雨林和果园之乡：彭纳拉姆的山坡上种胡椒和豆蔻，洛米兰有领地最大的热带雨林，纳卢迈沿海养珍珠贝、平原上种芒果和榴莲。这些城市过去与萨伦纳姆之间只有沿海的旧公路，雨季常被冲断。领地修建纳卢高速，自萨伦纳姆沿西北岸一路向东北，把香料、水果和珍珠运往三角洲的港口，也把游客送进雨林和海滩。线路在雨林里尽量沿已有的旧路走廊，跨过河流和淹水林时多用桥梁；过了纳卢迈，它折入乌诺凯苏山地，经乌诺维拉矿区到埃武托拉公社。
      en: "The north-west coast of the main island is the territory's country of spices, rainforest and orchards: pepper and cardamom on the slopes of Pennaram, the territory's largest tropical rainforest in Lomiran, pearl oysters off Nalumai and mango and durian on its plain. These cities were once linked to Sarunnam only by an old coast road that the rains often washed out. The territory built the Nalu Expressway north-east from Sarunnam along the north-west coast to carry spices, fruit and pearls to the ports of the delta and to bring visitors to the rainforest and the beaches. In the rainforest it keeps as far as it can to the corridor of the old road, crossing rivers and flooded forest mostly on bridges; beyond Nalumai it turns into the Unokesu uplands and runs through the Unovila mining zone to Evutola Commune."
    via: [div_8jecyx, div_k880h3, div_a3c8d6, div_pgh98w, div_8p898f, div_pfrpr2, div_afy2b3, div_a349sd, div_gkda74, div_27fbbk]  # vashtarai – pilakkai – marandur – luvana – katamu – mailua – senalu – viranta – parantu – pakari
  - id: rte_yx03y0
    ref: S-ES-1
    network: territorial_expressway
    class: motorway
    status: generated
    names:
      zh: 萨伦纳姆环城高速
      en: Sarunnam Ring Expressway
      art-x-ivuran: Sarunnam Uriva Vesupelavu
    notes:
      zh: "萨伦纳姆环城高速是一条环线，全长约 102 公里，绕萨伦纳姆城区一周，依次经伊拉瓦姆、瓦什塔赖、塞鲁卡姆、阿兰塔和门达卢尔五个区，跑完一圈约 44 分钟，伊武兰语名中的 Uriva 意为「环」。全线都在城区，双向十二车道，限速 140 公里；约 41 公里是高架桥，阿兰塔高架桥长约 20 公里，从中央商务区的摩天楼之间穿过。日均车流 3.6 万到 4.7 万辆，塞鲁卡姆区一段最繁忙。伊米穆高速和纳卢高速都在环线上与它相接。\n满月的「灯与月」之夜，环城高速经过阿兰塔区的路段，两旁的摩天楼会一起调暗灯光，司机们从高架上能望见旧王城和寺庙群里成千上万盏油灯。本地出租车司机用伊武兰语南部方言跟乘客聊天，一听口音就知道是「旧都人」。"
      en: "The Sarunnam Ring Expressway is a ring about 102 km long round the city of Sarunnam, through Ilavam, Vashtarai, Serukkam, Aranta and Mendalur districts in turn, about 44 minutes for a full circuit; Uriva in its Ivuran name means 'ring'. It is urban all the way, with six lanes each way and a limit of 140 km/h; about 41 km of it is viaduct, and the Aranta Viaduct, about 20 km long, threads between the towers of the business district. It carries 36,000 to 47,000 vehicles a day, most through Serukkam District. The Imimu and Nalu expressways both meet it on the ring.\nOn the full-moon night of Vilaru Imolu the skyscrapers along the Aranta stretch dim their lights together, and from the viaduct drivers can see thousands of oil lamps in the royal city and the temples. Local taxi drivers chat in the southern Ivuran dialect, and their accent marks them out as \"old capital folk\" at once."
    background:
      zh: 萨伦纳姆有 350 万人，老城河道纵横、街道狭窄，过去穿城的车辆和货车都要挤过老城。环城高速把中央商务区阿兰塔、塞鲁卡姆老城、瓦什塔赖旧王城、人口最多的伊拉瓦姆区和机场所在的门达卢尔区连成一圈，过境车辆不必再穿过老街区，伊米穆高速和纳卢高速也在环线上交汇。线路多以高架桥跨过三角洲的河道和低洼地，雨季涨水时照常通行。
      en: Sarunnam has 3.5 million people, and its old city is a maze of canals and narrow streets that through traffic and lorries once had to squeeze across. The ring links the Aranta business district, the old city of Serukkam, the old royal city of Vashtarai, Ilavam, the most populous district, and Mendalur with the airport, so through traffic no longer crosses the old quarters, and the Imimu and Nalu expressways meet on it. Much of it runs on viaduct over the channels and low ground of the delta, so it stays open when the rivers rise in the wet season.
    shield: compass
    ring: true
    via: [div_n90922, div_8jecyx, div_xz0zqd, div_1z75n0, div_54sm84]  # ilavam – vashtarai – serukkam – aranta – mendalur
  - id: rte_17aygk
    ref: S-ES-2
    network: territorial_expressway
    class: motorway
    status: generated
    names:
      zh: 基鲁迈群岛高速
      en: Kirumai Islands Expressway
      art-x-ivuran: Kirumai Vesupelavu
    notes:
      zh: "基鲁迈群岛高速全长约 500 公里，自基鲁迈岛北部的迈萨里区出发，经岛南的卡朗加区跨海到蒂卢迈岛，再跨海到奥罗武岛，全程约三小时。全线双向十二车道，全程不限速，有约 90 公里跨海桥梁，卡朗加特大桥长约 43 公里，是全线最长的桥。日均车流 1.2 万到 1.5 万辆，以度假游客、潜水爱好者和岛民为主。马拉坎岛是珊瑚礁保护区，皮卢岛和皮卢尼岛离得较远，都不通公路，靠渡轮往来。\n跨海路段两侧是深浅不一的蓝色礁湖，晴天能看到海龟在桥下游过，桥上禁止停车，许多人只好放慢车速看一眼。岛民说六座岛是一串挂在海上的珍珠，这条高速就是串起珍珠的那根线。"
      en: "The Kirumai Islands Expressway runs about 500 km from Maisari District in the north of Kirumai Island through Karanga District in the south of the island, across the sea to Tilumai Island and across again to Orovu Island, about three hours in all. It has six lanes each way with no speed limit, and about 90 km of sea bridges; the Karanga Sea Bridge, about 43 km, is the longest. It carries 12,000 to 15,000 vehicles a day, mostly holidaymakers, divers and islanders. Malakan Island is a coral reef reserve and Pilu and Piluni lie further off; none of them has a road link, and they are reached by ferry.\nOn the sea crossings the lagoons on both sides are every shade of blue, and on clear days turtles can be seen swimming beneath the bridges; stopping is forbidden, so many drivers simply slow for a look. Islanders say the six islands are a string of pearls on the sea, and this expressway is the thread."
    background:
      zh: 基鲁迈群岛的白沙海滩和珊瑚礁吸引了大量度假和潜水的游客，岛与岛之间过去只能坐船。伊米穆高速的跨海大桥把基鲁迈岛接上主岛之后，领地又沿岛链修建了这条高速，以跨海桥连起基鲁迈岛、蒂卢迈岛和奥罗武岛，游客从萨伦纳姆驾车就能到达西岸的潜水学校和度假村，奥罗武岛的登陆节也有了更多访客。桥墩避开了珊瑚礁，桥下留出独木舟和渔船的航道；马拉坎珊瑚礁保护区和较远的皮卢岛、皮卢尼岛不修公路。
      en: The white beaches and coral reefs of the Kirumai Islands draw many holidaymakers and divers, and the islands used to be linked only by boat. Once the sea bridge of the Imimu Expressway had joined Kirumai Island to the main island, the territory built this expressway down the chain, joining Kirumai, Tilumai and Orovu islands by sea bridges, so visitors can drive from Sarunnam to the dive schools and resorts of the west coast, and the Landing Festival on Orovu has more visitors. The piers keep clear of the reefs and leave channels beneath for canoes and fishing boats; no roads are built to the Malakan Coral Reef Reserve or to Pilu and Piluni further off.
    shield: turtle
    via: [div_a0nff8, div_3skbd8, div_3x32j4, div_qsykjk]  # maisari – karanga – tilumai – orovu
  - id: rte_pxgkc5
    ref: S-ES-3
    network: territorial_expressway
    class: motorway
    status: generated
    names:
      zh: 图拉凯港口高速
      en: Turakkai Port Expressway
      art-x-ivuran: Turakkai Vesupelavu
    notes:
      zh: "图拉凯港口高速全长约 53 公里，自瓦利凯图拉凯区的深水码头到埃鲁塔姆区的物流园，全程约 23 分钟。全线都在城区，双向十二车道，限速 140 公里；图拉凯高架桥长约 10 公里，以高架穿过港区。日均车流 1.6 万到 1.8 万辆，集装箱卡车占了大半。\n高架桥上每天跑着上千辆集装箱卡车，码头上的吊车司机俯视着车流，说从「云上」看下去，卡车像一串串移动的积木。货车不必进入坎纳鲁尔老城，骑楼下喝香料奶茶的人因此能安安静静地坐一下午。"
      en: "The Turakkai Port Expressway runs about 53 km from the deep-water quays of Turakkai District in Vallikkai to the logistics park in Eruttam District, about 23 minutes. It is urban all the way, with six lanes each way and a limit of 140 km/h; the Turakkai Viaduct, about 10 km long, carries it over the port district. It carries 16,000 to 18,000 vehicles a day, more than half of them container lorries.\nThousands of container lorries run over its viaduct every day, and the crane drivers above the quays say that from \"the clouds\" they look like strings of moving building blocks. Because lorries never need to enter the old town of Kannarur, people drinking spiced milk tea under its arcades can sit undisturbed all afternoon."
    background:
      zh: 瓦利凯港是领地的国际转运枢纽，图拉凯区的深水码头装卸往来大洋之间的集装箱，过去卡车要穿过坎纳鲁尔老城的骑楼街才能上高速。港口高速把码头和埃鲁塔姆区的物流园直接连起来，并在埃鲁塔姆接上伊米穆高速，集装箱卡车从此不进老城；港区一段以高架通过，不占码头和堆场的作业面。
      en: Vallikkai port is the territory's international transhipment hub, and the deep-water quays of Turakkai District handle containers on their way between the oceans; lorries used to cross the arcaded streets of the old town of Kannarur to reach the expressway. The port expressway links the quays directly to the logistics park of Eruttam District and joins the Imimu Expressway there, so container lorries no longer enter the old town; through the port it runs on viaduct, taking no space from the quays and yards.
    shield: anchor
    via: [div_qj7vjy, div_0hrhwh]  # turakkai – eruttam
  - id: rte_0y7qbq
    ref: S-ES-4
    network: territorial_expressway
    class: motorway
    status: generated
    names:
      zh: 塞拉努港口高速
      en: Seranu Port Expressway
      art-x-ivuran: Seranu Vesupelavu
    notes:
      zh: "塞拉努港口高速全长约 160 公里，自塔卢马兰的塞拉努区深水码头出发，经米纳萨区、伊拉坦区的电池厂和新能源车厂，到内陆的帕达兰区接上伊米穆高速，全程约一小时。全线双向十二车道，城区路段限速 140 公里，内陆路段不限速；有约 11 公里桥梁和 8 座跨河桥，塞拉努高架桥长约 5 公里。日均车流 1.3 万到 2 万辆，以集装箱卡车和运送新车的车辆为主。\n路上跑的出租车、公交车和货车几乎都是伊拉坦造的电动车，开在这条路上的司机爱说一句：「车是这里造的，电池是这里装的，路也是这里修的。」新车下线后经这条高速直送码头，车头上常常还挂着工人放的一朵鸡蛋花。"
      en: "The Seranu Port Expressway runs about 160 km from the deep-water quays of Seranu District in Talumaran through Minasa District and the battery and electric-car plants of Ilatan District to inland Padaran District, where it joins the Imimu Expressway; about an hour in all. It has six lanes each way, limited to 140 km/h in town and unlimited inland, with about 11 km of bridges and 8 river bridges; the Seranu Viaduct is about 5 km long. It carries 13,000 to 20,000 vehicles a day, mostly container lorries and car transporters.\nNearly all its taxis, buses and lorries are electric vehicles built in Ilatan, and drivers like to say \"the car was made here, the battery fitted here and the road built here\". New cars go straight from the line to the docks along it, often still carrying the frangipani flower the workers placed inside."
    background:
      zh: 塞拉努区的深水码头是领地最大的集装箱港之一，伊拉坦区的电池厂和新能源车厂用乌诺卡里的镍制造电池和整车。港口高速把码头、工厂和内陆的伊米穆高速连成一线，零部件从码头直送工厂，新车从工厂直送码头装船，运往岛内各地的货车也不必穿过塔卢马兰的老港区。
      en: The deep-water quays of Seranu District are among the territory's largest container ports, and the battery and electric-car plants of Ilatan District make batteries and cars from Unokari nickel. The port expressway joins quays, plants and the Imimu Expressway inland in a single line, so parts go straight from ship to plant and new cars straight from plant to ship, and lorries bound for the rest of the island no longer cross the old harbour of Talumaran.
    shield: ship
    via: [div_hceeaa, div_3e94sq, div_n11kpv]  # seranu – ilatan – padaran
  - id: rte_7dxvrt
    ref: S-ES-101
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 哈努帕拉高原公路
      en: Hanupala Plateau Road
      art-x-ivuran: Hanupala Pelavu
    notes:
      zh: "哈努帕拉高原公路全长约 200 公里，自首府米雷兰的哈努帕拉区出发，从海拔一千五百多米的高原边缘一路下到纳卢迈的迈卢阿区海岸，全程约一个半小时。全线双向八车道，全程不限速，最大坡度约 41‰，沿途没有长桥和隧道，路随山势盘旋，高原牧场、咖啡园和山谷里的瀑布都在路边。日均车流 7500 到 9300 辆。\n公路从凉爽的高原一路下到炎热的海岸，司机们说开完这条路「一个半小时从春天开进盛夏」。山腰的观景台上常有咖啡摊，卖的是哈努帕拉的本地咖啡，晴天能从这里一直望见迈卢阿湾里一排排的珍珠贝养殖笼。"
      en: "The Hanupala Plateau Road runs about 200 km from Hanupala District in the capital Mirelan down from the edge of the plateau, more than 1,500 m up, to the coast of Mailua District in Nalumai, about an hour and a half. It has four lanes each way with no speed limit and grades of up to about 41‰, with no long bridges or tunnels; it winds with the mountainside past upland pastures, coffee gardens and waterfalls in the valleys. It carries 7,500 to 9,300 vehicles a day.\nThe road runs from the cool plateau down to the hot coast, and drivers say it takes you \"from spring into high summer in an hour and a half\". Coffee stalls at the lookouts on the mountainside sell Hanupala's own coffee, and on clear days you can see from them all the way to the rows of pearl-oyster cages in Mailua Bay."
    background:
      zh: 哈努帕拉高原上的牧场和咖啡园过去要绕经首府才能把产品运到海边。领道从高原北缘直接下到纳卢迈的珍珠海岸，咖啡、乳品和高原蔬菜由此运往港口，海边的游客也能当天上高原看湖。线路依山势展线，不打隧道，在几处观景台可以俯瞰高原边缘的瀑布和远处的海面。
      en: The pastures and coffee gardens of the Hanupala Plateau once had to send their produce round by the capital to reach the sea. This highway drops straight from the northern rim of the plateau to the pearl coast of Nalumai, carrying coffee, dairy and upland vegetables to the ports and letting visitors from the coast go up to see the lake and back in a day. It follows the lie of the mountain without tunnels, and several viewpoints along it look out over the waterfalls of the plateau rim to the sea beyond.
    shield: waterfall
    via: [div_t5wpdw, div_pfrpr2]  # hanupala – mailua
  - id: rte_2rakh3
    ref: S-ES-102
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 温达坎梯田公路
      en: Undakan Terraces Road
      art-x-ivuran: Undakan Pelavu
    notes:
      zh: "温达坎梯田公路全长约 450 公里，自温达坎的西林达区出发，经乌拉韦劳自然保护区到城区坎达瓦区，再经托兰卡区到佩伦达区，全程约三个半小时。全线双向八车道，城区限速 120 公里，其余路段不限速，沿山腰展线，最大坡度约 60‰，有 11 座跨河桥。沿途是层层叠叠的水稻梯田，插秧和收割时节游客最多；日均车流 6300 到 1.2 万辆。\n沿路的梯田层层叠叠，插秧季时能看到全村人排成一行在田里倒退着插秧，田埂上的鼓点隔着车窗都听得见。收割季节，路边的村子会摆出竹筒饭和稻田鱼招待过路的人，司机们管这叫「梯田路上的午饭」。"
      en: "The Undakan Terraces Road runs about 450 km from Silinda District in Undakan through the Uravelau Nature Reserve to the city district of Kandava, then through Toranka District to Perunda District, about three and a half hours. It has four lanes each way, limited to 120 km/h in town and unlimited elsewhere, and follows the mountainside at grades of up to about 60‰, with 11 river bridges. Rice terraces climb the slopes all along it, and visitors are most numerous at planting and harvest; it carries 6,300 to 12,000 vehicles a day.\nTerraces rise tier upon tier beside the road, and in planting season you can see whole villages walking backwards in a line across the paddies, the drumbeat on the banks audible through the windows. At harvest the roadside villages offer bamboo-roasted rice and paddy fish to passers-by, which drivers call \"lunch on the terrace road\"."
    background:
      zh: 温达坎的梯田从河谷一直修到海拔一千多米的山腰，散落在山坡上的村社过去只有窄小的山路通往城区。领道沿等高线把西林达、坎达瓦、托兰卡和佩伦达几个区的梯田村落串起来，稻米和山货由此运进城区，游客也能沿路观赏梯田。线路尽量顺着山势，不切开梯田的田埂和灌溉渠，路下设涵洞让山泉照常流进田里。
      en: The terraces of Undakan climb from the valley floors to more than 1,000 m up the mountainsides, and the village communities scattered across the slopes once had only narrow mountain tracks to town. The highway follows the contours to string together the terrace villages of Silinda, Kandava, Toranka and Perunda, bringing rice and mountain produce into town and letting visitors take in the terraces on the way. It follows the lie of the land and cuts no terrace banks or irrigation channels, with culverts beneath so the springs still run into the fields.
    shield: wheat
    via: [div_9hrhrv, div_6cy2yw, div_w2pbh1]  # silinda – kandava – perunda
  - id: rte_tw60g3
    ref: S-ES-103
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 帕拉武尔公路
      en: Palavur Road
      art-x-ivuran: Palavur Pelavu
    notes:
      zh: "帕拉武尔公路全长约 410 公里，自彭纳拉姆城区马伦杜尔区出发，翻过帕拉武尔区的山地，经蒂拉凯区到埃拉库尔区，全程约三小时。全线双向八车道，城区限速 120 公里，其余路段不限速，最大坡度约 30‰。沿途山坡上是胡椒、豆蔻、肉桂和丁香园，内陆高地种咖啡和可可；日均车流 8600 到 1.5 万辆。\n翻过帕拉武尔的山地时，路边的香料园一片接一片，胡椒收获季节，家家户户的院子里铺满了晾晒的胡椒，过路的司机常常被香味呛得打喷嚏。马伦杜尔香料市场的批发商每天清早开着货车沿这条路收货。"
      en: "The Palavur Road runs about 410 km from Marandur, the city district of Pennaram, over the uplands of Palavur District and through Tirakkai District to Elakur District, about three hours. It has four lanes each way, limited to 120 km/h in town and unlimited elsewhere, with grades of up to about 30‰. Pepper, cardamom, cinnamon and clove gardens line the slopes along it, with coffee and cocoa on the inland heights; it carries 8,600 to 15,000 vehicles a day.\nCrossing the Palavur uplands the road passes one spice garden after another, and in the pepper harvest every courtyard is spread with drying peppercorns, so passing drivers often sneeze at the scent. The wholesalers of the Marandur Spice Market drive out along it every morning to collect their stock."
    background:
      zh: 彭纳拉姆市从西北海岸一直延伸到主岛中部，香料园和咖啡、可可园散布在内陆的山地上，过去收获的香料要用卡车沿山路运到马伦杜尔的香料市场。领道从马伦杜尔翻山到埃拉库尔，把各个香料产区和城区的市场连起来，并在埃拉库尔接上伊米穆高速，内陆的香料园因此也能直接把货运到南岸的港口。
      en: Pennaram City reaches from the north-west coast into the middle of the island, with spice, coffee and cocoa gardens scattered over its inland hills; the harvest used to come down mountain tracks by lorry to the spice market of Marandur. The highway crosses the hills from Marandur to Elakur, linking the spice-growing areas with the market in town, and joins the Imimu Expressway at Elakur, so the inland gardens can also ship straight to the ports of the south coast.
    shield: peaks
    via: [div_a3c8d6, div_mw1wjx, div_v7v7hg]  # marandur – palavur – elakur
  - id: rte_ffxbnw
    ref: S-ES-104
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 乌诺维拉矿区公路
      en: Unovila Mines Road
      art-x-ivuran: Unovila Pelavu
    notes:
      zh: "乌诺维拉矿区公路全长约 230 公里，自乌诺卡里的霍拉坦区通往乌诺维拉矿区管理区，全程约一小时四十五分钟。全线双向八车道，全程不限速，最大坡度约 60‰。矿石由重载铁路运出，公路主要供矿工、工程师、设备和补给车辆往来；日均车流 7800 到 8700 辆。\n路上跑的多是矿区的通勤车和工程车，车身常常蒙着一层赭红色的红土。沿路的复绿台阶上种满了树苗，每棵都挂着一块写着矿工名字的小木牌，司机们说这是「一路的签名」。"
      en: "The Unovila Mines Road runs about 230 km from Horatan District in Unokari to the Unovila Mining Administration Zone, about an hour and three quarters. It has four lanes each way with no speed limit and grades of up to about 60‰. The ore leaves by heavy-haul railway, and the road serves mainly miners, engineers, equipment and supply vehicles; it carries 7,800 to 8,700 vehicles a day.\nIts traffic is mostly mine commuter buses and service vehicles, often coated with ochre laterite. The restored benches beside it are planted with saplings, each hung with a small wooden tag bearing a miner's name, which drivers call \"signatures all the way\"."
    background:
      zh: 乌诺维拉矿区在乌诺凯苏山脉深处，开采红土镍矿和钴。矿石由重载铁路运往佩鲁诺的冶炼厂，领道则为矿区运送人员、设备和补给，替代了过去的矿区便道。领地要求矿区边采边复绿，公路两侧的取土场和弃土场在完工后都已重新种上林木。
      en: The Unovila mining zone lies deep in the Unokesu Mountains, working laterite nickel and cobalt. The ore goes by heavy-haul railway to the smelters of Peruno, and this highway carries people, equipment and supplies to the mines in place of the old haul tracks. The territory requires mines to replant as they dig, and the borrow pits and spoil tips along the road were all replanted with trees once it was finished.
    shield: pickaxe
    via: [div_fwnndh, div_6z737x]  # horatan – unovila
  - id: rte_7k06ya
    ref: S-ES-105
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 贝卢阿公路
      en: Belua Road
      art-x-ivuran: Belua Pelavu
    notes:
      zh: "贝卢阿公路全长约 190 公里，自乌诺卡里的贝卢阿区矿石港出发，经霍拉坦区和佩鲁诺区的冶炼厂到城区卡里纳区，全程约一个半小时。全线双向八车道，城区限速 120 公里，其余路段不限速；日均车流 9100 到 1.5 万辆。\n傍晚山谷里起雾，从公路上往下看，贝卢阿矿石港的灯光在雾里一闪一闪，像一船停在山谷口的星星。佩鲁诺区的澡堂就在公路边，下班的工人开车经过总要先停下来「洗红」。"
      en: "The Belua Road runs about 190 km from the ore port of Belua District in Unokari through Horatan District and the smelters of Peruno District to the city district of Karina, about an hour and a half. It has four lanes each way, limited to 120 km/h in town and unlimited elsewhere; it carries 9,100 to 15,000 vehicles a day.\nWhen mist fills the valley in the evening, the lights of the Belua Ore Port blink up through it like a boatload of stars moored at the valley mouth. The Peruno bathhouses stand right by the road, and workers driving home always stop first to \"wash off the red\"."
    background:
      zh: 贝卢阿区的矿石港把乌诺卡里的镍产品装船外运，佩鲁诺区的冶炼厂和城区卡里纳之间人员往来频繁。领道把港口、冶炼厂和城区连成一线，工人通勤和港口的零散货运都走这条路，大宗矿石则由铁路运输。线路避开了矿区的复绿林带，沿河谷而行，坡度平缓，雨季也很少中断。
      en: The ore port of Belua District ships Unokari's nickel products abroad, and there is constant traffic between the smelters of Peruno District and the city district of Karina. The highway links port, smelters and town in a single line; workers commute and the port's smaller loads travel by it, while the bulk ore goes by rail. It keeps clear of the replanted belts of the mining zone and follows the valleys at gentle grades, so it is seldom cut even in the wet season.
    shield: palm
    via: [div_w7bas1, div_y57m7b]  # belua – karina
  - id: rte_cdsnm9
    ref: S-ES-106
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 埃武托拉海岸公路
      en: Evutola Coast Road
      art-x-ivuran: Evutola Pelavu
    notes:
      zh: "埃武托拉海岸公路全长约 125 公里，自埃武托拉公社的哈马图区出发，经塔尼武区、帕卡里区到卢阿努区，沿公社的东北海岸而行，全程约一小时。全线双向八车道，城区限速 120 公里，其余路段不限速；日均车流 9200 到 1.7 万辆。公社的公共汽车免费，沿线各村镇都有站点。\n公社的车都是按需登记取用的，所以路上很少有两辆一样的车停在同一户人家门口。周末公社的居民骑着帕卡里造的自行车沿海岸骑行，路边的公社食堂免费供应椰浆焖鱼和热茶，骑行的人在这里歇脚聊天。"
      en: "The Evutola Coast Road runs about 125 km from Hamatu District in Evutola Commune through Tanivu and Pakari districts to Luanu District along the commune's north-eastern coast, about an hour. It has four lanes each way, limited to 120 km/h in town and unlimited elsewhere; it carries 9,200 to 17,000 vehicles a day. The commune's buses are free, with stops at every village and town along it.\nThe commune's cars are signed out as needed, so you rarely see the same car outside the same house twice. At weekends residents cycle the coast on bicycles made at Pakari, and the commune canteens along the road serve free coconut-braised fish and hot tea to riders who stop to rest and chat."
    background:
      zh: 埃武托拉公社的几个区沿东北海岸分布，公社委员会决定修建这条领道，把各区的合作社、公共食堂和海边的村镇连起来。公社里的汽车由公社提供、按需取用，公共汽车免费，沿线的停车场和充电站也都免费使用；海岸路段设有观看日出的平台。
      en: The districts of Evutola Commune lie along the north-eastern coast, and the commune council decided to build this highway to link the cooperatives, the public canteens and the seaside villages of each district. Cars in the commune are provided by the commune and taken as needed, buses are free, and so are the car parks and charging stations along the road; on the coast there are platforms for watching the sunrise.
    shield: sunrise
