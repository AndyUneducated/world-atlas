# Road routes of the Arctic Ocean Territory.
#
# Four grades, the same in every territory; route numbers carry the territory infix:
#   G-AO-1..99    国家高速 national expressway    (class motorway)
#   S-AO-1..99    领地高速 territorial expressway (class motorway)
#   S-AO-101..    领道 territorial highway        (class primary)
#   X-AO-001..    市道 city road                  (class secondary)
# The fields are those of world/transport/cn-nv-roads.yaml. The territory has no road link to
# the others; the islands have no roads of national or territorial grade.
routes:
  - id: rte_bjj6j2
    ref: G-AO-1
    network: national_expressway
    class: motorway
    status: generated
    names:
      zh: 西卢阿高速
      en: Sillua Expressway
      art-x-tavrunaq: Sillua Pirrituar
    wonder:
      zh: 世界最长的极地高速公路，长约 2190 公里
      en: The longest polar expressway in the world, about 2,190 km
    notes:
      zh: 西卢阿高速全长约 2190 公里，是世界最长的极地高速公路，全程约十四小时。南岸段约 1350 公里，西起图利瓦克图利亚利维克区，经图拉卡特、萨尔瓦克萨尔努卡区和乌利图克区、首府努坎加克区与伊马萨尔维克区，东到乌库拉克乌库努卡区，在首府以西绕经内陆的驯鹿迁徙保护区和尼尔萨瓦克区，在首府以东绕经大湖苔原保护区、伊卢克萨特区和内陆矿区；北段约 840 公里，从乌库努卡区经基萨尔维克区、南岸峡湾和皮瓦苏瓦区的峡湾地带，绕过西尔米冰盖东侧北上，经陶瓦尼克区到西尔米瓦克西尔米卡尔维克区。全线双向十二车道，城区和山区路段限速 140 公里，其余路段不限速。线路有约 134 公里桥梁、23 公里隧道和 292 公里防雪棚：努卡塔克峡湾跨海大桥长约 12 公里，在努坎加克区和伊马萨尔维克区之间直线跨过峡湾口，是全线最长的桥；西尔米冰盖隧道长约 14 公里，是领地最长的公路隧道；翻越普拉普卡高原的普拉普卡高原防雪棚长约 76 公里，是全线最长的防雪棚；陶瓦尼克区的陶瓦尼克防雪棚长约 42 公里，这一段不设路灯，只有低矮的反光标志，以免影响天文观测。首府周边路段日均车流两万多辆，是领地最繁忙的高速之一；北段以游客、科研人员和峡湾村镇的居民为主，日均一万五千到两万多辆。
      en: The Sillua Expressway is about 2,190 km long, the longest polar expressway in the world, some fourteen hours end to end. The south-coast section, about 1,350 km, runs from Tullijaalivik in Tullivaq through Tullakkat, Saarvaq's Saarnuqa and Ulittuuq and the capital's Nuqangaq and Immasaarvik to Ukkunuqa in Ukkulaaq, swinging inland west of the capital through the Reindeer Migration reserve and the Nirsavaq District and east of it through the Great Lakes Tundra reserve, Illuqsaat and the inland mining zone. The northern section, about 840 km, goes on from Ukkunuqa through Qissarvik and the fjord country of the South Fjords and Pivasuvva, then north round the eastern side of the Sirmi Ice Cap through Tauvvaniq to Sirmiqarvik District in Sirmivak. It has six lanes each way, a 140 km/h limit in towns and mountains and no limit elsewhere. It has some 134 km of bridges, 23 km of tunnels and 292 km of snow sheds. The Nuqattaaq Fjord Bridge, about 12 km, runs straight across the fjord mouth between Nuqangaq and Immasaarvik and is the longest bridge on the road; the Sirmi Ice Cap Tunnel, about 14 km, is the longest road tunnel in the territory; the Pullapukka Plateau Snow Shed, about 76 km over the Pullapukka Plateau, is its longest shed; and the 42 km Tauvvaniq Snow Shed has no street lighting, only low reflective markers, so as not to disturb the observatories. Near the capital it carries over 25,000 vehicles a day, among the busiest expressways in the territory; the northern section carries mostly visitors, scientists and the people of the fjord villages, from 15,000 to over 20,000 vehicles a day.
    background:
      zh: 北冰洋领地的人口大多住在南岸：暖流让这里的港口终年不冻，图利瓦克、萨尔瓦克、首府努卡塔克和乌库拉克沿海岸自西向东排开。过去城市之间只靠沿岸航运和冬季冰面上的雪橇道往来，一场暴风雪就能让陆路断绝。领地把一条贯通南岸的高速定为第一项交通工程，从首府向东西两头同时修建。线路建在冻土上，路基下铺保温层和通风管，防止路面融沉；峡湾口和河口以桥梁跨过，风口路段加建防雪棚。南岸贯通后，线路又从乌库努卡区向北延伸：西尔米瓦克市的城区在西尔米冰盖东北边缘，陶瓦尼克区的观测站散布在冰盖以东的高地上，过去只有夏季才能通车的砂石路通往南岸，皮瓦苏瓦区的峡湾村镇只能靠夏季的渡船往来。北段不上冰盖：冰面每年移动、裂隙难测，线路沿冰盖外缘的基岩和冻土布设，并在冰舌附近留出缓冲带。全线贯通后，南岸各城和北方的冰原城市都可以全年通车，其余高速和领道大多从它分出。
      en: Most of the Arctic Ocean Territory's people live on the south coast, where a warm current keeps the harbours open all year and Tullivaq, Saarvaq, the capital Nuqattaaq and Ukkulaaq lie in a row from west to east. The cities used to depend on coastal shipping and winter sled trails over the ice, and a single blizzard could cut them off by land. The territory made a south-coast expressway its first transport project, built outwards from the capital to the east and the west at once. It stands on permafrost, with insulation and ventilation ducts under the embankment to keep the ground from thawing and sinking; fjord mouths and river mouths are crossed on bridges, and the windiest stretches run under snow sheds. Once the south coast was joined, the road was carried on north from Ukkunuqa. Sirmivak's town lies on the north-east edge of the Sirmi Ice Cap and the observatories of Tauvvaniq are scattered over the uplands east of it; their only road south had been a gravel track open in summer, and the fjord villages of Pivasuvva relied on the summer ferry. The northern section never goes onto the ice, which moves every year and hides crevasses; it keeps to the bedrock and permafrost along the edge of the cap and leaves a buffer zone near the glacier tongues. Once it was complete the south-coast cities and the ice-cap city to the north could be reached by road all year, and most later expressways and territorial highways branch off it.
    tunnel_cost: 3.5
    legs:
      div_jvwq60: { straight: true }  # 旧港—不冻港: across the mouth of the capital's fjord
      # north of Ukkunuqa, round the Sirmi Ice Cap to Sirmiqarvik: no tunnel cap here
      div_1d76zf: { tunnel_cost: null }
      div_stts1z: { tunnel_cost: null }
      div_3j7f20: { tunnel_cost: null }
      div_73wt00: { tunnel_cost: null }
    via: [div_79wfwy, div_najb0c, div_3rb2ha, div_qg40vj, div_q7cydv, div_jvwq60, div_yh6ysj, div_1d76zf, div_stts1z, div_3j7f20, div_73wt00]
  - id: rte_3sphft
    ref: G-AO-2
    network: national_expressway
    class: motorway
    status: generated
    names:
      zh: 努基高速
      en: Nuqattaaq–Kiluktuar Expressway
      art-x-tavrunaq: Nuqattaaq–Kiluktuar Pirrituar
    notes:
      zh: 努基高速全长约 650 公里，自首府库马尔维克区经尼尔萨库特、帕利瓦克、苏瓦利克区北上，翻过苏瓦尔尤伊特山脉进入内陆苔原，经考尔尼克考卢尤阿克区、基卢克图阿尔帕基卢克区到北岸的基卢基亚克区，全程约四小时十分钟，是首府通往北岸最快的公路。全线双向十二车道，城区和山区路段限速 140 公里，其余路段不限速。高地路段的苏瓦尔尤伊特山脉防雪棚长约 67 公里，苏瓦利克区的苏瓦利克高架桥长约 10 公里；线路跨越河流 14 次，在帕基卢克区内延伸约 170 公里。阿卡皮图克公路在帕基卢克区与它相接，尼尔萨瓦克高速在西尔米努卡附近汇入。
      en: The Nuqattaaq–Kiluktuar Expressway runs about 650 km from Qummarvik District in the capital north through Nirsakut, Paalivaq and Suvvalik, over the Suvvarjuit Mountains into the inland tundra, and on through Qaulujjuaq District in Qaurniq and Paakiluk District in Kiluktuar to Kilukkiaq on the north coast, in about four hours ten minutes, the fastest road from the capital to the north coast. It has six lanes each way, a 140 km/h limit in towns and mountains and no limit elsewhere. Over the uplands the Suvvarjuit Mountains Snow Shed runs about 67 km, and the Suvvalik Viaduct in the capital is about 10 km long; the road crosses rivers 14 times and runs some 170 km through Paakiluk. The Aqqapituk Road meets it in Paakiluk, and the Nirsavaq Expressway joins it near Sirminuqa.
    background:
      zh: 基卢克图阿尔是北岸大河入海处的城市，北岸冬季封冻，它与首府努卡塔克之间又隔着中部高地，过去两城往来只能绕海路或乘飞机。努基高速从首府库马尔维克区出发，经苏瓦利克区、帕利瓦克区北上，从两片冰川之间翻过中部高地进入内陆苔原，经考尔尼克考卢尤阿克区、基卢克图阿尔帕基卢克区到基卢基亚克区，把南北两岸第一次用公路连起来。高地路段海拔高、风雪大，修建了长段防雪棚；苔原段大部分建在冻土路堤上，每隔一段留出涵洞，让融水和驯鹿通过。通车后，北岸的渔获和内陆考卢尤阿克区的产品都可以由公路运往南岸的伊马萨尔维克港。
      en: Kiluktuar stands where the great river of the north coast meets the sea. The north coast freezes in winter and the central uplands lie between it and the capital, Nuqattaaq, so travel between the two once meant a long voyage or a flight. The Nuqattaaq–Kiluktuar Expressway leaves the capital's Qummarvik District, runs north through Suvvalik and Paalivaq, climbs between two glaciers over the central uplands into the inland tundra and continues through Qaulujjuaq District in Qaurniq and Paakiluk District in Kiluktuar to Kilukkiaq, the first road between the two coasts. The high, stormy upland stretch runs under long snow sheds; across the tundra the road is mostly on permafrost embankment, with culverts at intervals for meltwater and migrating reindeer. Since it opened, north-coast catches and the products of inland Qaulujjuaq District can go by road to the ice-free harbours of the south.
    via: [div_9s80v8, div_j06x18, div_k8cx0t, div_k66r1n, div_xvm6y0, div_anjqnh]
  - id: rte_642apd
    ref: G-AO-3
    network: national_expressway
    class: motorway
    status: generated
    names:
      zh: 尼尔萨瓦克高速
      en: Nirsavaq Expressway
      art-x-tavrunaq: Nirsavaq Pirrituar
    notes:
      zh: 尼尔萨瓦克高速全长约 860 公里，自图利瓦克图利亚利维克区翻过普拉普卡高原，经普拉苏瓦米乌特区的山地和驯鹿迁徙保护区北上，过塔夫鲁利特自治区首府阿卡尼克，再横穿基卢克图阿尔河三角洲，到基卢基亚克区和西尔米努卡区，全程约五小时二十分钟。全线双向十二车道，城区和山区路段限速 140 公里，其余路段不限速，迁徙季节夜间限制车流。线路跨越河流 31 次，是领地跨河最多的公路；阿卡尼克高架桥长约 10 公里，图拉卡特防雪棚长约 60 公里，三角洲上的路堤延伸约 150 公里。
      en: The Nirsavaq Expressway runs about 860 km from Tullijaalivik in Tullivaq over the Pullapukka Plateau, north through the mountains of Pullasuvvamiut and the Reindeer Migration reserve, past Aqqanik, the capital of the Tavrulit autonomous region, and across the Kiluktuar delta to Kilukkiaq and Sirminuqa, in about five hours twenty minutes. It has six lanes each way, a 140 km/h limit in towns and mountains and no limit elsewhere, with night traffic restricted in the migration season. It crosses rivers 31 times, more than any other road in the territory; the Aqqanik Viaduct is about 10 km long, the Tullakkat Snow Shed about 60 km, and the embankment across the delta runs some 150 km.
    background:
      zh: 尼尔萨瓦克高速横贯大陆西部和北部的苔原，自图利瓦克图利亚利维克区出发，经塔夫鲁利特原住民自治区的阿卡尼克区，到基卢克图阿尔基卢基亚克区和西尔米努卡区。这片苔原是驯鹿迁徙和原住民狩猎的传统地带，修路前领地与自治区长老议事会逐段商定线路：道路避开产仔地和主要迁徙通道，必须穿过时抬高路堤、加宽涵洞，并在迁徙季节限制夜间车流。线路大部分建在冻土路堤上，河流以短桥跨过。通车后，阿卡尼克与南北两岸都有了全年通行的道路，北岸西尔米努卡区的破冰船基地也接入了路网。
      en: The Nirsavaq Expressway crosses the tundra of the west and north of the mainland, from Tullijaalivik District in Tullivaq through Aqqanik District in the Tavrulit Indigenous Autonomous Region to Kilukkiaq and Sirminuqa in Kiluktuar. This tundra is the traditional ground of the reindeer migration and of indigenous hunting, and before construction the territory and the autonomous region's council of elders agreed the line section by section. The road avoids the calving grounds and the main migration corridors; where it has to cross them the embankment is raised and the culverts widened, and night traffic is restricted in the migration season. Most of it is on permafrost embankment, with short bridges over the rivers. Since it opened Aqqanik has had an all-year road to both coasts, and the icebreaker base at Sirminuqa on the north coast has joined the road network.
    via: [div_79wfwy, div_ek897t, div_anjqnh, div_m0b417]
  - id: rte_6e4v8h
    ref: S-AO-1
    network: territorial_expressway
    class: motorway
    status: generated
    names:
      zh: 帕卢尔尼克高速
      en: Pallurniq Expressway
      art-x-tavrunaq: Pallurniq Pirrituar
    notes:
      zh: 帕卢尔尼克高速全长约 50 公里，自首府库马尔维克区经帕卢尔尼克金融特区到尼尔萨库特区，全程约二十分钟。线路约四分之一建在桥上，帕卢库特高架桥长约 7 公里，是全线最长的桥，从库马尔维克区直通金融特区的塔楼群，其余路段多为高架和半地下通道。全线双向十二车道，城区限速 140 公里。早晚高峰车流以金融城的雇员和前往尼尔萨库特区机场的旅客为主。
      en: The Pallurniq Expressway runs about 50 km from Qummarvik District in the capital through the Pallurniq Financial Zone to Nirsakut District, in about twenty minutes. About a quarter of it is on bridges; the Pallukut Viaduct, about 7 km and the longest, leads straight from Qummarvik District to the zone's towers, and the rest is mostly viaduct or half-buried cutting. It has six lanes each way and a 140 km/h limit through the city. At peak hours its traffic is mostly the zone's staff and travellers heading for the airport in Nirsakut.
    shield: dome
    background:
      zh: 帕卢尔尼克金融特区是领地在首府旁新设的金融城，北冰洋公共银行和附属机构都在这里。帕卢尔尼克高速自努卡塔克库马尔维克区出发，经帕卢库特区到尼尔萨库特区，一头接努基高速的起点，一头接环线，金融城的车流不经首府的城区街道就能驶上干线。线路很短，几乎全程在城区之内，以高架和半地下通道通过，沿线出入口直通塔楼的地下车库和暖廊。领地修建它，是为了让金融城的雇员和访客不必穿过首府市中心，也为金融城以后的扩建预留了通道。
      en: The Pallurniq Financial Zone is the financial city the territory set up beside its capital, home to the Arctic Ocean Public Bank and its affiliates. The Pallurniq Expressway runs from Qummarvik District in Nuqattaaq through Pallukut District to Nirsakut District, meeting the start of the Nuqattaaq–Kiluktuar Expressway at one end and the ring road at the other, so the zone's traffic reaches the trunk roads without using the capital's streets. It is short and almost entirely built-up, on viaduct or in half-buried cuttings, with exits leading straight into the tower car parks and skyways. The territory built it so that the zone's staff and visitors need not cross the centre of the capital, and it leaves room for the zone to grow.
    straight: true
    via: [div_9s80v8, div_ga9pxy, div_k4vyb1]
  - id: rte_hefmsp
    ref: S-AO-2
    network: territorial_expressway
    class: motorway
    status: generated
    names:
      zh: 努阿高速
      en: Nuqattaaq–Aqqanik Expressway
      art-x-tavrunaq: Nuqattaaq–Aqqanik Pirrituar
    notes:
      zh: 努阿高速全长约 415 公里，自首府图维尔尤阿克区向西北穿过尼尔萨瓦克区的牧场，到塔夫鲁利特自治区首府阿卡尼克，全程约两个半小时。线路有约 153 公里建在防雪棚下，苏瓦尔尤伊特山脉防雪棚长约 54 公里，尼尔萨瓦克隧道长约 5 公里，图维尔尤阿克高架桥长约 4 公里。全线双向十二车道，城区和山区路段限速 140 公里，其余路段不限速。沿途的石堆路标原样保留，路旁设有观景停车点。
      en: The Nuqattaaq–Aqqanik Expressway runs about 415 km north-west from Tuvvirjuaq District in the capital across the pastures of the Nirsavaq District to Aqqanik, the capital of the Tavrulit autonomous region, in about two and a half hours. Some 153 km of it is under snow sheds, the Suvvarjuit Mountains Snow Shed being about 54 km, the Nirsavaq Tunnel is about 5 km long and the Tuvvirjuaq Viaduct about 4 km. It has six lanes each way, a 140 km/h limit in towns and mountains and no limit elsewhere. The cairns along the way were left where they stood, with lay-bys beside them.
    shield: drum
    background:
      zh: 阿卡尼克是塔夫鲁利特原住民自治区的首府和长老议事会所在地，与领地首府努卡塔克之间隔着尼尔萨瓦克区的大片牧场。努阿高速自首府图维尔尤阿克区出发，向西北穿过尼尔萨瓦克区到阿卡尼克区，是两座首府之间最直接的公路。路线由领地和自治区共同选定，避开了牧区的冬季草场和传统营地，沿途的石堆路标原样保留，在路旁另设了观景停车点。线路大部分建在冻土路堤上，冬季风口路段加建防雪棚。通车后，议事会成员往返两地开会，牧区的鹿肉和手工艺品运往首府，都只需几个小时。
      en: Aqqanik is the capital of the Tavrulit Indigenous Autonomous Region and the seat of its council of elders, and the wide pastures of the Nirsavaq District lie between it and the territorial capital, Nuqattaaq. The Nuqattaaq–Aqqanik Expressway runs north-west from Tuvvirjuaq District in the capital across the Nirsavaq District to Aqqanik, the most direct road between the two capitals. The territory and the autonomous region chose its line together, keeping clear of the winter grazing and the traditional camps; the cairns along the way were left where they stood, with lay-bys beside them for travellers to stop. Most of it is on permafrost embankment, with snow sheds on the windiest stretches. Council members travelling to meetings and reindeer meat and crafts bound for the capital now take only a few hours.
    tunnel_cost: 3.5
    via: [div_3b9pkz, div_d9hctg, div_ek897t]
  - id: rte_759zpn
    ref: S-AO-3
    network: territorial_expressway
    class: motorway
    status: generated
    names:
      zh: 努卡塔克环线
      en: Nuqattaaq Ring Road
      art-x-tavrunaq: Nuqattaaq Kaaput
    notes:
      zh: 努卡塔克环线绕首府一周，全长约 257 公里，经图维尔尤阿克、帕利瓦克、苏瓦利克、尼尔萨库特、伊马萨尔维克和努坎加克区，绕行一周约一小时四十分钟。线路地势平缓，有约 24 公里桥梁，以约 9 公里的努卡塔克峡湾跨海大桥跨过峡湾。全线双向十二车道，城区限速 140 公里，照明按极夜标准加密，路面埋设融雪管。部分路段日均车流两万多辆，是领地最繁忙的道路之一。
      en: The Nuqattaaq Ring Road circles the capital, about 257 km through Tuvvirjuaq, Paalivaq, Suvvalik, Nirsakut, Immasaarvik and Nuqangaq, a lap taking about an hour and forty minutes. It runs over gentle ground with some 24 km of bridges, crossing Nuqattaaq Fjord on the Nuqattaaq Fjord Bridge of about 9 km. It has six lanes each way and a 140 km/h limit through the city, with lighting built to the polar-night standard and heating pipes under the surface. Some stretches carry over 20,000 vehicles a day, among the busiest roads in the territory.
    shield: aurora
    background:
      zh: 首府努卡塔克的七个区围绕大峡湾口分布，西卢阿高速和努基高速都要穿过市中心，早晚高峰车流常常堵到峡湾两岸。领地在城区外围修建了一条环线，经图维尔尤阿克区、帕利瓦克区、尼尔萨库特区和伊马萨尔维克区绕城一周，过境车辆和前往港口的货车可以不进市中心。环线跨越峡湾的路段以大桥通过，城区段多为高架和半地下通道，与暖廊和地铁站相接。为了在极夜里保证行车安全，全线照明按冬季标准加密，路面埋设融雪管。
      en: The seven districts of the capital, Nuqattaaq, are spread around the mouth of its great fjord, and both the South Coast and the Nuqattaaq–Kiluktuar expressways run through the centre, so peak-hour traffic used to back up on both sides of the fjord. The territory built a ring road around the edge of the city, through Tuvvirjuaq, Paalivaq, Nirsakut and Immasaarvik districts, so that through traffic and lorries bound for the harbour can stay out of the centre. It crosses the fjord on bridges, and in the city it is mostly on viaduct or in half-buried cuttings that connect with the skyways and metro stations. For safe driving in the polar night its lighting is denser than usual, built to the winter standard, and heating pipes under the surface keep it clear of snow.
    ring: true
    straight: true
    via: [div_3b9pkz, div_k8cx0t, div_k4vyb1, div_jvwq60]
  - id: rte_p7t6rv
    ref: S-AO-4
    network: territorial_expressway
    class: motorway
    status: generated
    names:
      zh: 乌库利特高速
      en: Ukkuliit Expressway
      art-x-tavrunaq: Ukkuliit Pirrituar
    wonder:
      structure: snow_shed
      zh: 世界最长的防雪棚，长约 128 公里
      en: The longest snow shed in the world, about 128 km
    notes:
      zh: 乌库利特高速全长约 490 公里，自首府伊马萨尔维克区经尼尔萨库特区北上，穿过大湖苔原保护区，经伊卢克萨特区到乌库利特矿区管理区，全程约三小时。线路有约 225 公里建在防雪棚下，是领地防雪棚最长的公路，其中苏瓦尔尤伊特山脉防雪棚长约 128 公里，是领地最长的一段防雪棚；考卢卡特丘陵隧道长约 8 公里。全线双向十二车道，城区和山区路段限速 140 公里，其余路段不限速。车流以矿工、设备和零散货物为主，日均一万到一万五千辆。
      en: The Ukkuliit Expressway runs about 490 km from Immasaarvik in the capital north through Nirsakut, across the Great Lakes Tundra reserve and through Illuqsaat to the Ukkuliit Mining Administration Zone, in about three hours. Some 225 km of it is under snow sheds, more than any other road in the territory, and its Suvvarjuit Mountains Snow Shed, about 128 km, is the longest single shed in the territory; the Qaulukkat Hills Tunnel is about 8 km long. It has six lanes each way, a 140 km/h limit in towns and mountains and no limit elsewhere. Its traffic is mostly miners, equipment and smaller freight, from 10,000 to 15,000 vehicles a day.
    shield: pickaxe
    background:
      zh: 考尔尼克市的内陆矿区出产锂、镍和钻石，伊卢克萨特区的盐湖提锂厂也在附近，矿产大多从首府的伊马萨尔维克区装船出口。重载铁路通车前，矿石全靠冬季冰路上的卡车车队运出，春季解冻后冰路就无法通行。乌库利特高速自伊马萨尔维克区出发，向北经伊卢克萨特区到乌库利特矿区管理区，与重载铁路大体平行，承担人员、设备和零散货物的运输。线路大部分建在冻土路堤上，路基下埋设通风管，防止冻土融化；绕过冰川翻越中部高地的路段建有长段防雪棚。
      en: The Ukkuliit Mining Administration Zone of Qaurniq City produces lithium, nickel and diamonds, the brine lithium plants of Illuqsaat District are close by, and most of the output is shipped from Immasaarvik District in the capital. Before the heavy-haul railway opened, all the ore left by lorry convoys on winter ice roads, which became impassable once the spring thaw set in. The Ukkuliit Expressway runs north from Immasaarvik through Illuqsaat to the mining zone, roughly parallel to the railway, and carries workers, equipment and smaller freight. Most of it is on permafrost embankment with ventilation ducts underneath to keep the ground frozen, and long snow sheds cover the stretch that climbs round the glaciers over the central uplands.
    via: [div_jvwq60, div_qaxzqj, div_m541k8]
  - id: rte_jmx8jy
    ref: S-AO-101
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 普拉苏瓦公路
      en: Pullasuvva Road
      art-x-tavrunaq: Pullasuvva Pirri
    notes:
      zh: 普拉苏瓦公路全长约 97 公里，自萨尔瓦克萨尔努卡区向西北深入普拉苏瓦米乌特区的峡湾地带，全程约四十五分钟。线路一半以上在防雪棚和落石棚下，苏瓦尔尤伊特山脉防雪棚长约 36 公里，普拉苏瓦米乌特大桥架在峡湾最窄处；最大坡度 6%，在领地各条高速和领道中最陡。全线双向八车道，城区和山区路段限速 120 公里，其余路段不限速。
      en: The Pullasuvva Road runs about 97 km north-west from Saarnuqa in Saarvaq into the fjord country of Pullasuvvamiut District, in about forty-five minutes. More than half of it is under snow sheds and rock-fall shelters, the Suvvarjuit Mountains Snow Shed being about 36 km, and the Pullasuvvamiut Viaduct spans a fjord at its narrowest; its steepest grade, 6%, is the steepest on any of the territory's expressways and territorial highways. It has four lanes each way, a 120 km/h limit in towns and mountains and no limit elsewhere.
    shield: kayak
    background:
      zh: 萨尔瓦克市的普拉苏瓦米乌特区地广人稀，居民住在峡湾深处的渔村和小镇里，过去只能乘船出入，冬季风浪大时常常停航。普拉苏瓦公路自萨尔努卡区出发，向西北深入峡湾地带，到普拉苏瓦米乌特区的镇上。沿途峡湾一条接一条，线路时而沿峡湾岸边修建，时而以短隧道穿过山嘴，在峡湾最窄处架桥跨过。陡坡路段建有防雪棚和落石棚。通车后，峡湾村镇的渔获和养殖产品可以由公路运到萨尔努卡，居民看病和上学也不再依赖渡船。
      en: Pullasuvvamiut District in Saarvaq City is large and thinly peopled, with fishing villages and small towns at the heads of its fjords that once could be reached only by boat, often cut off when winter seas ran high. The Pullasuvva Road runs north-west from Saarnuqa into the fjord country to the district's town. Fjord follows fjord along the way; the road clings to the shore, cuts through headlands in short tunnels and bridges each fjord at its narrowest. The steep stretches have snow sheds and rock-fall shelters. Since it opened, the fjord villages' catches and farmed fish go by road to Saarnuqa, and people no longer depend on the ferry to see a doctor or go to school.
    via: [div_3rb2ha, div_hrrg7q]
  - id: rte_hq1xf6
    ref: S-AO-102
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 阿卡皮图克公路
      en: Aqqapituk Road
      art-x-tavrunaq: Aqqapituk Pirri
    notes:
      zh: 阿卡皮图克公路全长约 260 公里，自阿卡尼克区向东经阿卡皮图米乌特区和三角洲湿地，到基卢克图阿尔帕基卢克区与努基高速相接，全程约两小时。线路地势平坦，全程不限速，双向八车道；阿卡皮图米乌特防雪棚长约 13 公里。雪橇道与公路交叉处设专用通道，冬季雪橇优先通行。
      en: The Aqqapituk Road runs about 260 km east from Aqqanik through the Aqqapitummiut District and the delta wetlands to Paakiluk District in Kiluktuar, where it meets the Nuqattaaq–Kiluktuar Expressway, in about two hours. It runs over flat ground with no speed limit throughout and four lanes each way, and the Aqqapitummiut Snow Shed is about 13 km long. Where sled trails cross it there are dedicated crossings, and in winter sleds have right of way.
    shield: harpoon
    background:
      zh: 塔夫鲁利特原住民自治区的阿卡皮图米乌特区是传统的海豹与海象猎场，猎人们冬季沿海冰上的雪橇道往来，夏季则靠小船。阿卡皮图克公路自阿卡尼克区出发，向东经阿卡皮图米乌特区到基卢克图阿尔帕基卢克区，与努基高速相接。线路由自治区主持修建，避开海岸的猎场和冰上通道，在雪橇道与公路交叉处设专用通道，冬季雪橇优先通行。道路大部分建在冻土路堤上，河流以短桥跨过。通车后，猎区的猎人和渔民可以全年往返自治区首府和大河沿岸的城镇。
      en: The Aqqapitummiut District of the Tavrulit Indigenous Autonomous Region is a traditional seal and walrus hunting ground, where hunters travel by sled trails on the sea ice in winter and by small boat in summer. The Aqqapituk Road runs east from Aqqanik District through the hunting district to Paakiluk District in Kiluktuar, where it meets the Nuqattaaq–Kiluktuar Expressway. The autonomous region built it, keeping clear of the coastal hunting grounds and the routes onto the ice; where sled trails cross the road there are dedicated crossings, and in winter sleds have right of way. Most of it is on permafrost embankment, with short bridges over the rivers. Since it opened, the district's hunters and fishers can travel all year to the regional capital and the towns along the great river.
    via: [div_ek897t, div_m34jqk, div_xvm6y0]
  - id: rte_e78zxk
    ref: S-AO-103
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 考伊公路
      en: Qaulujjuaq–Illuqsaat Road
      art-x-tavrunaq: Qauluk–Illuqsaat Pirri
    notes:
      zh: 考伊公路全长约 160 公里，自考尔尼克考卢尤阿克区穿过大湖苔原保护区到伊卢克萨特区，全程约一小时十五分钟，把努基高速和乌库利特高速连成网。线路在湖泊之间的冰碛垄上修建，伊卢克萨特大桥跨过湖间的窄处，翻越考卢卡特丘陵的考卢卡特丘陵防雪棚长约 36 公里。全线双向八车道，城区和山区路段限速 120 公里，其余路段不限速。
      en: The Qaulujjuaq–Illuqsaat Road runs about 160 km from Qaulujjuaq District in Qaurniq across the Great Lakes Tundra reserve to Illuqsaat, in about an hour and a quarter, tying the Nuqattaaq–Kiluktuar and Mining expressways together. It follows the moraine ridges between the lakes, the Illuqsaat Viaduct spans a narrows, and the Qaulukkat Hills Snow Shed over the Qaulukkat Hills is about 36 km long. It has four lanes each way, a 120 km/h limit in towns and mountains and no limit elsewhere.
    shield: crystal
    background:
      zh: 考尔尼克市的考卢尤阿克区和伊卢克萨特区一个在努基高速上，一个在乌库利特高速上，两区之间隔着内陆的湖泊与苔原，过去往来要先绕回首府。考伊公路在内陆把两区直接连起来，也把领地的两条南北向干线连成网。线路在湖泊之间的冰碛垄上修建，尽量少占湖岸和湿地，跨湖处以短桥通过。冬季湖面结冰后，这一带原有的冰路仍然开放，供雪地车和雪橇通行。通车后，考卢尤阿克区的加工厂和伊卢克萨特区的提锂厂之间的人员和设备往来不再绕道。
      en: Qaulujjuaq District and Illuqsaat District in Qaurniq City lie one on the Nuqattaaq–Kiluktuar Expressway and the other on the Ukkuliit Expressway, with inland lakes and tundra between them, and travel from one to the other used to mean going back through the capital. The Qaulujjuaq–Illuqsaat Road links them directly inland, and ties the territory's two north–south trunk roads into a network. It runs along the moraine ridges between the lakes, keeping off the shores and wetlands as far as possible, and crosses the narrows on short bridges. In winter, when the lakes freeze, the old ice roads of the area still open for snowmobiles and sleds. Since it opened, staff and equipment move between the processing plants of Qaulujjuaq District and the lithium works of Illuqsaat without the detour.
    via: [div_k66r1n, div_qaxzqj]
