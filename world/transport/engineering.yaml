# Engineering standards behind the route cards: structure profile, cost estimate, speed limits
# and technical data. Used by pipeline/atlas/engineering.py.
#
# Profile: the generator fits a grade line to the terrain along each route (moving average over
#   smooth_km, then clamped to max_grade). Where the ground stands more than tunnel_above_m
#   above the grade line the route is in tunnel; where it lies more than bridge_below_m below,
#   or over water, the route is on a bridge or viaduct. Every river crossing adds
#   river_bridge_km of bridge.
# urban (optional): new-built stretches through built-up land are grade-separated, on viaduct
#   near the edge of the town and in cut-and-cover tunnel more than tunnel_depth_km inside it.
# Snow sheds: where a territory's generator sets snow_sheds {above_m, min_km, gap_km}, at-grade
#   stretches on ground at or above above_m are roofed (galleries of at least min_km, gaps under
#   gap_km closed); they cost snow_shed per km instead of grade.
# Costs are 2026 US dollars, per km of route by structure type (grade, bridge, tunnel), checked
#   against recent projects of the same kind. At-grade cost rises with the relief of the
#   ground (hill_factor at 60 m of rise per km and above). climate scales everything for a
#   subarctic island: frost-proof foundations, snow galleries, winter maintenance.
# speed: each grade sets only a floor (min, km/h). Rural stretches have no limit; urban and
#   mountain stretches are limited to the floor, so no posted limit is ever lower.
#   urban: districts with at least urban_density people per km²
#   mountain: stretches where bridges and tunnels make up at least mountain_structure_share
# cross_section: lanes per direction (grow: busy stretches get more, one per lane_capacity_vpd
#   of daily traffic each way), lane, emergency lane (shoulder_m), inner shoulder, verge and
#   median widths in m. cruise_kmh: the driving speed on stretches without a limit.
climate: { construction: 1.10, upkeep: 1.30 }
urban_density: 250
mountain_structure_share: 0.35
river_min_drainage_km2: 150

# Traffic and service (pipeline/atlas/traffic.py), gravity models over the places along each line.
# Roads: daily vehicles on a stretch = base_vpd + local_trips_per_person of the district it runs
#   through + gravity × people × people / km between the districts on either side. A district
#   counts in full once the route runs full_share_km through it.
# Rail: daily trips between two stations = gravity × people × people / km, a city's people shared
#   among its stations; the busiest stretch in the peak hour sets the headway.
traffic:
  base_vpd: { national_expressway: 15000, territorial_expressway: 10000, territorial_highway: 6000 }
  local_trips_per_person: 0.03
  gravity: 4.0e-7
  min_km: 15
  full_share_km: 6
rail_service:
  gravity: 1.2e-6
  min_km: 20
  peak_hour_share: 0.11
  peak_direction_share: 0.6
  load_factor: 0.85
  headways_min: [3, 4, 5, 6, 8, 10, 12, 15, 20, 30]
  start_stop_min: 4

standards:
  national_expressway:
    cross_section: { lanes: 6, grow: true, lane_m: 3.75, shoulder_m: 3.5, inner_shoulder_m: 0.75, verge_m: 0.75, median_m: 4.5 }
    lane_capacity_vpd: 16000
    cruise_kmh: 160
    smooth_km: 4
    max_grade: 0.04
    tunnel_above_m: 45
    bridge_below_m: 20
    river_bridge_km: 0.4
    urban: { tunnel_depth_km: 5 }
    hill_factor: 1.6
    cost_musd_per_km: { grade: 16, bridge: 60, tunnel: 110, snow_shed: 40 }
    upkeep_kusd_per_km: { grade: 120, bridge: 350, tunnel: 800, snow_shed: 260 }
    speed: { min: 140 }
  territorial_expressway:
    cross_section: { lanes: 6, grow: true, lane_m: 3.75, shoulder_m: 3.5, inner_shoulder_m: 0.75, verge_m: 0.75, median_m: 4.5 }
    lane_capacity_vpd: 16000
    cruise_kmh: 160
    smooth_km: 3
    max_grade: 0.045
    tunnel_above_m: 45
    bridge_below_m: 20
    river_bridge_km: 0.35
    urban: { tunnel_depth_km: 6 }
    hill_factor: 1.6
    cost_musd_per_km: { grade: 14, bridge: 50, tunnel: 95, snow_shed: 36 }
    upkeep_kusd_per_km: { grade: 100, bridge: 300, tunnel: 700, snow_shed: 230 }
    speed: { min: 140 }
  # 领道: dual carriageways (一级公路) with grade-separated main junctions.
  territorial_highway:
    cross_section: { lanes: 4, lane_m: 3.75, shoulder_m: 3.0, inner_shoulder_m: 0.75, verge_m: 0.75, median_m: 3.0 }
    lane_capacity_vpd: 18000
    cruise_kmh: 130
    smooth_km: 2
    max_grade: 0.06
    tunnel_above_m: 55
    bridge_below_m: 25
    river_bridge_km: 0.25
    hill_factor: 1.5
    cost_musd_per_km: { grade: 7, bridge: 30, tunnel: 60, snow_shed: 20 }
    upkeep_kusd_per_km: { grade: 50, bridge: 200, tunnel: 500, snow_shed: 150 }
    speed: { min: 120 }
  municipal_road:
    smooth_km: 1.5
    max_grade: 0.07
    tunnel_above_m: 60
    bridge_below_m: 25
    river_bridge_km: 0.15
    hill_factor: 1.4
    cost_musd_per_km: { grade: 3, bridge: 18, tunnel: 40, snow_shed: 10 }
    upkeep_kusd_per_km: { grade: 25, bridge: 120, tunnel: 350, snow_shed: 90 }
    speed: { min: 100 }
  # Double-track high-speed line, 25 kV, slab track; stations are costed per stop.
  intercity_rail:
    smooth_km: 8
    max_grade: 0.025
    tunnel_above_m: 30
    bridge_below_m: 15
    river_bridge_km: 0.5
    urban: { tunnel_depth_km: 5 }
    hill_factor: 1.5
    cost_musd_per_km: { grade: 18, bridge: 32, tunnel: 55, snow_shed: 30 }
    upkeep_kusd_per_km: { grade: 180, bridge: 300, tunnel: 600, snow_shed: 240 }
    station_musd: 150
    station_upkeep_musd: 3
    tech:
      gauge_mm: 1435
      electrification: 25 kV 50 Hz AC
      signalling: CTCS-3 + ATO
      formation: { cars: 8, coupled: 16 }
      tracks: 2
      min_curve_radius_m: 7000
      train: { names: { zh: 北辰 400 型, en: Polaris 400 }, seats: 576 }
  # Intercity railway with maglev: true. Double guideway with the long-stator linear motor built
  # into it, so no overhead line and no rails; steeper grades than wheeled lines; driverless;
  # stations costed per stop.
  maglev:
    smooth_km: 10
    max_grade: 0.08
    tunnel_above_m: 40
    bridge_below_m: 25
    river_bridge_km: 0.5
    urban: { tunnel_depth_km: 5 }
    hill_factor: 1.3
    cost_musd_per_km: { grade: 42, bridge: 58, tunnel: 95, snow_shed: 50 }
    upkeep_kusd_per_km: { grade: 320, bridge: 420, tunnel: 820, snow_shed: 380 }
    station_musd: 260
    station_upkeep_musd: 5
    tech:
      levitation: { zh: 常导电磁悬浮，悬浮间隙 10 毫米, en: "electromagnetic suspension, 10 mm gap" }
      propulsion: { zh: 长定子直线同步电机, en: long-stator linear synchronous motor }
      signalling: GoA4
      formation: { cars: 10 }
      tracks: 2
      min_curve_radius_m: 8000
      train: { names: { zh: 流星 600 型, en: Meteor 600 }, seats: 620 }
  # Double-track heavy-haul freight line, 25 kV, ballasted; driverless trains; yards are costed per stop.
  freight_rail:
    smooth_km: 6
    max_grade: 0.012
    tunnel_above_m: 25
    bridge_below_m: 12
    river_bridge_km: 0.5
    urban: { tunnel_depth_km: 2 }
    hill_factor: 1.8
    cost_musd_per_km: { grade: 9, bridge: 24, tunnel: 45, snow_shed: 22 }
    upkeep_kusd_per_km: { grade: 150, bridge: 260, tunnel: 520, snow_shed: 200 }
    station_musd: 60
    station_upkeep_musd: 2
    tech:
      gauge_mm: 1435
      electrification: 25 kV 50 Hz AC
      signalling: ETCS Level 3 + ATO GoA4
      tracks: 2
      min_curve_radius_m: 1200
      axle_load_t: 32.5

# City streets (主干道 / 次干道 / 支路), km/h; arterials outside the dense core have no limit.
street_speed:
  local: 80
  collector: 100
  arterial: 120
  arterial_outer: null
  outer_density: 150

metro_tech:
  design_speed_kmh: 100
  gauge_mm: 1435
  power: { voltage: DC 1500 V, supply: overhead }
  formation: { cars: 6, type: B }
  signalling: CBTC GoA4
