# Engineering standards behind the route cards: structure profile, cost estimate, speed limits
# and technical data. Used by pipeline/atlas/engineering.py.
#
# Profile: the generator fits a grade line to the terrain along each route (moving average over
#   smooth_km, then clamped to max_grade). Where the ground stands more than tunnel_above_m
#   above the grade line the route is in tunnel; where it lies more than bridge_below_m below,
#   or over water, the route is on a bridge or viaduct. Every river crossing adds
#   river_bridge_km of bridge.
# urban (optional): new-built stretches through built-up land are grade-separated, on viaduct
#   near the edge of the town and in cut-and-cover tunnel more than tunnel_depth_km inside it.
# Snow sheds: where a territory's generator sets snow_sheds {above_m, min_km, gap_km}, at-grade
#   stretches on ground at or above above_m are roofed (galleries of at least min_km, gaps under
#   gap_km closed); they cost snow_shed per km instead of grade.
# Costs are 2026 US dollars, per km of route by structure type (grade, bridge, tunnel), checked
#   against recent projects of the same kind. At-grade cost rises with the relief of the
#   ground (hill_factor at 60 m of rise per km and above). climate scales everything for a
#   subarctic island: frost-proof foundations, snow galleries, winter maintenance.
# speed: each grade sets only a floor (min, km/h). Rural stretches have no limit; urban and
#   mountain stretches are limited to the floor, so no posted limit is ever lower.
#   urban: districts with at least urban_density people per km²
#   mountain: stretches where bridges and tunnels make up at least mountain_structure_share
# cross_section: lanes per direction (grow: busy stretches get more, one per lane_capacity_vpd
#   of daily traffic each way), lane, emergency lane (shoulder_m), inner shoulder, verge and
#   median widths in m. cruise_kmh: the driving speed on stretches without a limit.
climate: { construction: 1.10, upkeep: 1.30 }
urban_density: 250
mountain_structure_share: 0.35
river_min_drainage_km2: 150

# Traffic and service (pipeline/atlas/traffic.py), gravity models over the places along each line.
# Roads: daily vehicles on a stretch = base_vpd + local_trips_per_person of the district it runs
#   through + gravity × people × people / km between the districts on either side. A district
#   counts in full once the route runs full_share_km through it.
# Rail: daily trips between two stations = gravity × people × people / km, a city's people shared
#   among its stations; the busiest stretch in the peak hour sets the headway.
traffic:
  base_vpd: { national_expressway: 15000, territorial_expressway: 10000, territorial_highway: 6000 }
  local_trips_per_person: 0.03
  gravity: 4.0e-7
  min_km: 15
  full_share_km: 6
rail_service:
  gravity: 1.2e-6
  min_km: 20
  peak_hour_share: 0.11
  peak_direction_share: 0.6
  load_factor: 0.85
  headways_min: [3, 4, 5, 6, 8, 10, 12, 15, 20, 30]
  start_stop_min: 4

standards:
  national_expressway:
    cross_section: { lanes: 6, grow: true, lane_m: 3.75, shoulder_m: 3.5, inner_shoulder_m: 0.75, verge_m: 0.75, median_m: 4.5 }
    lane_capacity_vpd: 16000
    cruise_kmh: 160
    smooth_km: 4
    max_grade: 0.04
    tunnel_above_m: 45
    bridge_below_m: 20
    river_bridge_km: 0.4
    urban: { tunnel_depth_km: 5 }
    hill_factor: 1.6
    cost_musd_per_km: { grade: 16, bridge: 60, tunnel: 110, snow_shed: 40 }
    upkeep_kusd_per_km: { grade: 120, bridge: 350, tunnel: 800, snow_shed: 260 }
    speed: { min: 140 }
  territorial_expressway:
    cross_section: { lanes: 6, grow: true, lane_m: 3.75, shoulder_m: 3.5, inner_shoulder_m: 0.75, verge_m: 0.75, median_m: 4.5 }
    lane_capacity_vpd: 16000
    cruise_kmh: 160
    smooth_km: 3
    max_grade: 0.045
    tunnel_above_m: 45
    bridge_below_m: 20
    river_bridge_km: 0.35
    urban: { tunnel_depth_km: 6 }
    hill_factor: 1.6
    cost_musd_per_km: { grade: 14, bridge: 50, tunnel: 95, snow_shed: 36 }
    upkeep_kusd_per_km: { grade: 100, bridge: 300, tunnel: 700, snow_shed: 230 }
    speed: { min: 140 }
  # 领道: dual carriageways (一级公路) with grade-separated main junctions.
  territorial_highway:
    cross_section: { lanes: 4, lane_m: 3.75, shoulder_m: 3.0, inner_shoulder_m: 0.75, verge_m: 0.75, median_m: 3.0 }
    lane_capacity_vpd: 18000
    cruise_kmh: 130
    smooth_km: 2
    max_grade: 0.06
    tunnel_above_m: 55
    bridge_below_m: 25
    river_bridge_km: 0.25
    hill_factor: 1.5
    cost_musd_per_km: { grade: 7, bridge: 30, tunnel: 60, snow_shed: 20 }
    upkeep_kusd_per_km: { grade: 50, bridge: 200, tunnel: 500, snow_shed: 150 }
    speed: { min: 120 }
  municipal_road:
    smooth_km: 1.5
    max_grade: 0.07
    tunnel_above_m: 60
    bridge_below_m: 25
    river_bridge_km: 0.15
    hill_factor: 1.4
    cost_musd_per_km: { grade: 3, bridge: 18, tunnel: 40, snow_shed: 10 }
    upkeep_kusd_per_km: { grade: 25, bridge: 120, tunnel: 350, snow_shed: 90 }
    speed: { min: 100 }
  # Double-track high-speed line, 25 kV, slab track; stations are costed per stop.
  intercity_rail:
    smooth_km: 8
    max_grade: 0.025
    tunnel_above_m: 30
    bridge_below_m: 15
    river_bridge_km: 0.5
    urban: { tunnel_depth_km: 5 }
    hill_factor: 1.5
    cost_musd_per_km: { grade: 18, bridge: 32, tunnel: 55, snow_shed: 30 }
    upkeep_kusd_per_km: { grade: 180, bridge: 300, tunnel: 600, snow_shed: 240 }
    station_musd: 150
    station_upkeep_musd: 3
    tech:
      gauge_mm: 1435
      electrification: 25 kV 50 Hz AC
      signalling: CTCS-3 + ATO
      formation: { cars: 8, coupled: 16 }
      tracks: 2
      min_curve_radius_m: 7000
      train: { names: { zh: 北辰 400 型, en: Polaris 400 }, seats: 576 }
  # Intercity railway with conventional: true (铁路, M112): double-track electrified line on ballast, under
  # 400 km/h, for the island states and for routes too thin for a high-speed line; much cheaper per km.
  conventional_rail:
    smooth_km: 4
    max_grade: 0.02
    tunnel_above_m: 40
    bridge_below_m: 15
    river_bridge_km: 0.3
    urban: { tunnel_depth_km: 2 }
    hill_factor: 1.6
    cost_musd_per_km: { grade: 7, bridge: 18, tunnel: 35, snow_shed: 14 }
    upkeep_kusd_per_km: { grade: 70, bridge: 140, tunnel: 300, snow_shed: 110 }
    station_musd: 30
    station_upkeep_musd: 0.8
    tech:
      gauge_mm: 1435
      electrification: 25 kV 50 Hz AC
      signalling: ETCS level 2
      formation: { cars: 6, coupled: 12 }
      tracks: 2
      min_curve_radius_m: 2000
      train: { names: { zh: 信风 160 型, en: Tradewind 160 }, seats: 420 }
  # Heavy-haul line with conventional: true (重载铁路, M112): wheeled double-track electrified freight line for
  # bulk ore and coal, slow and heavy; the vacuum capsule line below is the top tier.
  conventional_freight:
    smooth_km: 4
    max_grade: 0.012
    tunnel_above_m: 35
    bridge_below_m: 12
    river_bridge_km: 0.3
    urban: { tunnel_depth_km: 1 }
    hill_factor: 1.8
    cost_musd_per_km: { grade: 6, bridge: 16, tunnel: 30, snow_shed: 12 }
    upkeep_kusd_per_km: { grade: 60, bridge: 120, tunnel: 260, snow_shed: 100 }
    station_musd: 25
    station_upkeep_musd: 0.6
    tech:
      gauge_mm: 1435
      electrification: 25 kV 50 Hz AC
      signalling: ETCS level 2
      tracks: 2
      min_curve_radius_m: 800
  # Intercity railway with maglev: true (vacuum maglev, 真空磁悬浮). Double guideway inside a sealed low-vacuum tube, with the
  # long-stator linear motor built into it, so no overhead line and no rails; steeper grades than
  # wheeled lines; driverless; stations (with airlocks) costed per stop. Untried technology, priced far
  # above any line yet built: a tube sealed over its whole length, superconducting magnets cooled
  # along the guideway, and vacuum pumps that run day and night.
  maglev:
    smooth_km: 10
    max_grade: 0.08
    tunnel_above_m: 40
    bridge_below_m: 25
    river_bridge_km: 0.5
    urban: { tunnel_depth_km: 5 }
    hill_factor: 1.3
    cost_musd_per_km: { grade: 150, bridge: 210, tunnel: 340, snow_shed: 170 }
    upkeep_kusd_per_km: { grade: 1400, bridge: 1800, tunnel: 2900, snow_shed: 1500 }
    station_musd: 1000
    station_upkeep_musd: 20
    tech:
      tube: { zh: 低真空管道，管内气压约为大气压的十分之一, en: "low-vacuum tube, about a tenth of atmospheric pressure" }
      levitation: { zh: 高温超导电动悬浮，悬浮间隙 100 毫米, en: "high-temperature superconducting electrodynamic suspension, 100 mm gap" }
      propulsion: { zh: 长定子直线同步电机, en: long-stator linear synchronous motor }
      signalling: GoA4
      formation: { cars: 10 }
      tracks: 2
      min_curve_radius_m: 12000
      train: { names: { zh: 流星 800 型, en: Meteor 800 }, seats: 620 }
  # Intercity railway with maglev: open (M111). Double superconducting maglev guideway in the open air: no
  # tube, so cheaper to build and run than the vacuum line but slower, held back by air resistance; long-stator
  # linear motor in the guideway, no overhead line, no rails; driverless.
  maglev_open:
    smooth_km: 9
    max_grade: 0.06
    tunnel_above_m: 35
    bridge_below_m: 20
    river_bridge_km: 0.5
    urban: { tunnel_depth_km: 5 }
    hill_factor: 1.4
    cost_musd_per_km: { grade: 70, bridge: 110, tunnel: 180, snow_shed: 90 }
    upkeep_kusd_per_km: { grade: 600, bridge: 800, tunnel: 1300, snow_shed: 700 }
    station_musd: 400
    station_upkeep_musd: 8
    tech:
      levitation: { zh: 低温超导电动悬浮，悬浮间隙 100 毫米, en: "low-temperature superconducting electrodynamic suspension, 100 mm gap" }
      propulsion: { zh: 长定子直线同步电机, en: long-stator linear synchronous motor }
      signalling: GoA4
      formation: { cars: 12 }
      tracks: 2
      min_curve_radius_m: 8000
      train: { names: { zh: 疾风 600 型, en: Gale 600 }, seats: 720 }
  # Double-track heavy-haul freight line: capsule trains levitating in a sealed low-vacuum tube, no
  # wheels and no overhead line; driverless; yards (with airlocks) are costed per stop. Slower than the
  # maglev, with looser tolerances and no superconductors, so cheaper per km, but still untried technology.
  freight_rail:
    smooth_km: 6
    max_grade: 0.012
    tunnel_above_m: 25
    bridge_below_m: 12
    river_bridge_km: 0.5
    urban: { tunnel_depth_km: 2 }
    hill_factor: 1.8
    cost_musd_per_km: { grade: 60, bridge: 110, tunnel: 190, snow_shed: 80 }
    upkeep_kusd_per_km: { grade: 800, bridge: 1100, tunnel: 1700, snow_shed: 900 }
    station_musd: 300
    station_upkeep_musd: 8
    tech:
      tube: { zh: 低真空管道，管内气压约为大气压的十分之一, en: "low-vacuum tube, about a tenth of atmospheric pressure" }
      levitation: { zh: 常导电磁悬浮，悬浮间隙 15 毫米, en: "electromagnetic suspension, 15 mm gap" }
      propulsion: { zh: 长定子直线同步电机, en: long-stator linear synchronous motor }
      signalling: GoA4
      tracks: 2
      min_curve_radius_m: 2500

# City streets (主干道 / 次干道 / 支路), km/h; arterials outside the dense core have no limit.
street_speed:
  local: 80
  collector: 100
  arterial: 120
  arterial_outer: null
  outer_density: 150

metro_tech:
  design_speed_kmh: 100
  gauge_mm: 1435
  power: { voltage: DC 1500 V, supply: overhead }
  formation: { cars: 6, type: B }
  signalling: CBTC GoA4
