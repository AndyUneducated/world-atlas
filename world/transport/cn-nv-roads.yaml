# Road routes of North Viking Island.
#
# Four grades, the same in every territory; route numbers carry the territory infix:
#   G-NV-1..99    国家高速 national expressway    (class motorway)
#   S-NV-1..99    领地高速 territorial expressway (class motorway)
#   S-NV-101..    领道 territorial highway        (class primary)
#   X-NV-001..    市道 city road                  (class secondary)
# There are no national roads below expressway grade and no township roads.
# class uses Overture Maps / OSM highway=* road classes.
#
# via: ordered list of divisions; the generator routes between their urban cores
# over the terrain. Municipal roads to every district are derived automatically.
# ring (optional): the route returns from the last via to the first.
# ends_at_network (optional): the route runs from the first via towards the last and
#   stops where it meets an earlier route (a spur).
# tunnel_cost (optional): caps the per-km cost of steep terrain, letting the route
#   tunnel through mountains instead of detouring around them.
# legs (optional): per-leg overrides keyed by the via the leg arrives at, e.g. a lower
#   tunnel_cost for a straighter stretch, or straight: true for one straight stretch.
# straight (optional): every leg is a straight line, crossing hills and water on tunnels and bridges.
# via entries may be cities (the route stops at the city's core) or districts (at the district centre).
# shield (territorial routes): symbol in the upper half of the route shield (see src/lib/shields.ts);
#   every territorial route has its own, chosen from what the road is known for.
# Every road segment belongs to exactly one route: routes are built in the order
# below and later routes avoid the corridors of earlier ones.
routes:
  - id: rte_rr93s4
    ref: G-NV-1
    network: national_expressway
    class: motorway
    status: canon
    names:
      zh: 环北维京岛高速
      en: North Viking Island Ring Expressway
      art-x-viking: Ringautobahn Hea Veiling
    notes:
      zh: 环北维京岛高速全长约一千九百公里，沿海岸环绕全岛一周，依次经过维京港、自由市、奥克西诺、新城、萨科勒、贝克勒自由贸易区、天城、马斯林山东部、厄定河、勒克尔与西北，是领地公路网的主骨架，其余高速和领道大多从它分出。全线双向十二车道，乡村路段不限速，城区和桥隧密集的山区路段限速 140 公里。南岸城市相连的路段最繁忙，北岸峡湾段车流较少但桥隧相接，铁岗特大桥和马斯林山脉隧道分别是全线最长的桥梁和隧道。冬季除雪车沿线昼夜值守，即使暴雪也很少全线封闭。
      en: The North Viking Island Ring Expressway runs some 1,900 km round the whole coast, through Viking Port, Freedom City, Oxino, New City, Sakole, the Beckerle Free Trade Zone, Skytown, eastern Maslin Mountain, Erding River, Lekor and Northwest. It is the backbone of the territory's road network, and most other expressways and territorial highways branch off it. It has six lanes each way throughout, with no limit on rural stretches and 140 km/h through towns and on mountain stretches dense with bridges and tunnels. The south-coast stretches between neighbouring cities are the busiest; the northern fjord stretches carry less traffic but run from bridge to tunnel, and the Iron Knoll Viaduct and Maslin Range Tunnel are the longest of each on the line. Snowploughs patrol it day and night in winter, and even heavy snow rarely closes the whole road.
    background:
      zh: 北维京岛的城市沿海岸分布，过去城市之间多靠沿岸航运和山间便道往来，冬季海面结冰、山路积雪，一些城市每年都有数月几乎与外界隔绝。领地成立后，把一条环岛高速定为交通建设的第一要务，分段同时开工：南岸平原段最先通车，北岸峡湾段工程最难，需要连续跨越峡湾并开凿穿山隧道。由于冬季只能在隧道内施工，北段工期远长于南段。全线贯通后，岛上所有城市第一次可以全年通行，其余高速和领道大多以它为骨架向内陆延伸。
      en: North Viking Island's cities lie along its coast. They used to depend on coastal shipping and mountain tracks, and in winter, with ice on the sea and snow on the passes, some were cut off for months. When the territory was founded, a ring expressway became its first transport priority, built in many sections at once. The southern plain sections opened first; the northern fjord sections were the hardest, with one fjord crossing and mountain tunnel after another, and since only tunnel work can go on in winter they took far longer. Once the ring was closed every city on the island could be reached all year, and most later expressways and territorial highways branch off it.
    ring: true
    tunnel_cost: 3.5
    legs:
      div_q4d6n6: { tunnel_cost: 1.8 }  # 自由市—奥克西诺: straighter, more tunnels
    via: [div_m41gwn, div_nbrnfr, div_q4d6n6, div_k4s990, div_da3s38, div_k4hg7b, div_ygk521, div_8emjne, div_yjghe9, div_0yef9a]
  - id: rte_h4x8zc
    ref: G-NV-2
    network: national_expressway
    class: motorway
    status: canon
    names:
      zh: 自维高速
      en: Freedom–Viking Port Expressway
      art-x-viking: Autobahn Freistad–Veiling Havn
    notes:
      zh: 自维高速自首府自由市的白桦区出发，经沙洲、贝格兰直达维京港瓦尔维克区，全长约一百公里，全程四十分钟左右，是首府与最大城市之间最快的公路。全线是一条直线，在贝格兰丘陵下以隧道穿过，在沙洲河口湿地以长长的高架桥通过，贝格兰特大桥是全线最长的桥梁。全线双向十二车道，两端城区限速 140 公里，中段乡村不限速。早晚高峰通勤车流密集，白天以商务车辆和往返维京港国际机场的旅客为主，是全岛最繁忙的高速之一。
      en: The Freedom–Viking Port Expressway runs about 100 km from Birchwood in the capital, Freedom City, through Sandbar and Bergland to Walvik in Viking Port. At around forty minutes end to end it is the fastest road between the capital and the largest city. The whole line is one straight stretch, tunnelling under the Bergland Hills and crossing the Sandbar estuary wetlands on a long viaduct; the Bergland Viaduct is its longest bridge. It has six lanes each way, a 140 km/h limit in the built-up areas at either end and no limit on the rural middle section. Commuters fill it at the morning and evening peaks, and during the day it carries mostly business traffic and travellers to and from Viking Port International Airport, making it one of the busiest expressways on the island.
    background:
      zh: 首府自由市与最大城市维京港相距不远，环岛高速在两地之间却要绕行贝格兰丘陵，政府机关、企业总部和机场旅客每天往返两城，旧路早已不堪重负。领地议会决定另修一条直线高速，选线不避山水：贝格兰丘陵以隧道穿过，沙洲区的河口湿地全线架设高架桥，桥下保留原有水道和候鸟栖息地。通车后两城车程大为缩短，沿线的贝格兰、沙洲成为两城共同的通勤带，这条路也成为全岛最繁忙的高速之一。
      en: The capital, Freedom City, and the largest city, Viking Port, are close neighbours, yet the ring expressway between them winds around the Bergland Hills, and the daily flow of officials, company staff and air travellers had long outgrown it. The territorial assembly chose a second, straight expressway that goes through whatever lies in its way. It tunnels under the Bergland Hills and crosses the Sandbar estuary wetlands on viaduct from end to end, leaving the old channels and the bird habitat beneath untouched. It cut the drive between the two cities sharply, turned Bergland and Sandbar into a shared commuter belt, and is now one of the busiest expressways on the island.
    straight: true
    via: [div_nbrnfr, div_m41gwn]
  - id: rte_cs3vnw
    ref: G-NV-3
    network: national_expressway
    class: motorway
    status: generated
    names:
      zh: 龙关高速
      en: Long Pass Expressway
    notes:
      zh: 龙关高速是山城洛龙山通往外界的主要通道，自勒克尔勒北区的环岛高速枢纽出发，经澄湖南面的谷地上行，在德雷卡廷峰以北穿过洛龙山脉主脊，到达洛龙山龙关区，全长约一百公里，全程四十多分钟。澄湖特大桥跨越澄湖南面的深谷，是全线最长的桥梁；越岭隧道洞口建有防雪长廊。全线双向十二车道，谷地和越岭路段限速 140 公里，其余路段不限速。车流以运往勒克尔港的木材、矿石货车和冬季前往山城滑雪的游客为主，雪季周末尤其繁忙。
      en: The Long Pass Expressway is the mountain city of Lorond Mountain's main road to the outside world. From the ring expressway junction in Lekor North it climbs through the valleys south of Clear Lake and crosses the main ridge of the Lorond Range north of Drekatind to Dragon Pass District, about 100 km in a little over forty minutes. The Clearlake Viaduct, over a deep valley south of the lake, is its longest bridge, and the summit tunnel portals are covered by snow galleries. It has six lanes each way, with a 140 km/h limit on the valley and summit stretches and no limit elsewhere. Most of its traffic is timber and ore lorries bound for the port of Lekor and, in winter, skiers heading for the mountain city, which makes snow-season weekends especially busy.
    background:
      zh: 洛龙山市深居洛龙山脉腹地，过去只有一条翻越龙关的盘山公路通往北岸，冬季积雪和雪崩常使山城与外界断绝数周。为让山城全年通行，领地把龙关高速列为国家高速，与环岛高速在勒克尔相接。线路自勒北区经澄湖南面的谷地上行，谷壁陡峭处以连续桥梁贴山而过，越岭段以长隧道从德雷卡廷峰北侧的主脊下穿过，洞口加建防雪长廊。通车后山城到北岸港口的车程大大缩短，洛龙山的木材、矿产和冬季旅游都靠这条路运出运进。
      en: Lorond Mountain City lies deep in the Lorond Range. Its only road to the north coast used to be a hairpin route over Dragon Pass, and snow and avalanches often cut the city off for weeks each winter. To keep it open all year the territory made the Long Pass Expressway a national expressway, joining the ring expressway at Lekor. From Lekor North it climbs through the valleys south of Clear Lake, on a chain of bridges where the slopes are steep, then passes beneath the main ridge north of Drekatind in a long tunnel with snow galleries at its portals. The mountain city's timber, minerals and winter visitors now all travel this road.
    tunnel_cost: 3.5
    via: [div_yjghe9, div_prcxzt]
  - id: rte_dprjx3
    ref: G-NV-4
    network: national_expressway
    class: motorway
    status: generated
    names:
      zh: 马斯林山高速
      en: Maslin Expressway
    notes:
      zh: 马斯林山高速自环岛高速分出，经马斯林山和平区城区西行，横贯马斯林盆地直达西坪区的发射与降落中心，全长约九十公里，全程三十多分钟。盆地地势平坦，全线以路堤为主，和平高架桥跨过城区和马斯林河，是全线最长的桥梁。全线双向十二车道，全程不限速。平日车流以航天产业区的职工、运送箭体和推进剂的特种车辆为主；每逢发射日，前往西坪观看发射的车辆会排起长队，沿线临时开放的观礼停车场也随之启用。
      en: The Maslin Expressway leaves the ring expressway and runs west through the town of Peace in Maslin Mountain, then straight across the Maslin basin to the launch and landing centre in West Heath, about 90 km in just over half an hour. The basin is flat, so the line is mostly on embankment; the Peace Viaduct, which carries it over the town and the Maslin River, is its longest bridge. It has six lanes each way and no speed limit anywhere. On ordinary days it carries workers from the space industry zone and the special vehicles that haul rocket stages and propellant. On launch days queues of cars bound for West Heath build up along it, and temporary viewing car parks open beside the road.
    background:
      zh: 西坪区的发射与降落中心建成后，火箭部件、燃料和每次发射前后的大批人员都要经马斯林山市进出，原有的盆地公路穿城而过，既慢又不安全。领地因此修建马斯林山高速，从环岛高速分出，横贯马斯林盆地直达西坪。盆地地势平坦，线路以路堤为主，跨越马斯林河及其支流时架设多座桥梁；为运送大型火箭部件，全线桥梁按超重超宽车辆设计，净空也高于一般高速。通车后，发射中心的物资可以全天候运抵，马斯林山也因此成为航天配套产业的聚集地。
      en: Once the launch and landing centre at West Heath was built, rocket stages, propellant and the crowds that come with every launch all had to pass through Maslin Mountain City, on a basin road that ran through the town, slow and unsafe. The territory built the Maslin Expressway to fix this, branching off the ring expressway and crossing the Maslin basin straight to West Heath. The basin is flat, so most of the line runs on embankment, with bridges over the Maslin River and its tributaries. Every bridge is rated for oversize, overweight loads and the clearances are higher than usual, so whole rocket stages can travel by road. The launch centre is now supplied in any weather, and Maslin has become a hub for space industry suppliers.
    ends_at_network: true
    via: [div_nwke3f, div_rdypg7, div_ygk521]
  - id: rte_2w74xj
    ref: S-NV-1
    network: territorial_expressway
    class: motorway
    status: generated
    names:
      zh: 自勒高速
      en: Freedom–Lekor Expressway
    notes:
      zh: 自勒高速自首府自由市的白桦区出发，沿北河谷地北上，经北河、林道、西诺和丰谷到勒克尔，全长约二百五十公里，全程一个半小时左右，是首府通往北岸港口最快的公路。谷地开阔平坦，全线几乎都是路堤，白桦高架桥是全线最长的桥梁，跨北河的桥梁都不在河中立墩。全线双向十二车道，沿途都是乡村，全程不限速。车流以运送粮食、乳制品和饲料的货车为主，秋收季节尤其繁忙；与它并行的北河公路承担谷地内部的短途交通。
      en: The Freedom–Lekor Expressway leaves Birchwood in the capital, Freedom City, and runs north up the North River valley through North River, Lindau, Ino and Harvest Vale to Lekor, about 250 km in roughly an hour and a half; it is the fastest road from the capital to the north-coast port. The valley is wide and flat, so the road is almost entirely on embankment. The Birchwood Viaduct is its longest bridge, and none of its North River crossings has piers in the water. It has six lanes each way and, running through open country all the way, no speed limit. Its traffic is mostly lorries carrying grain, dairy and feed, at its busiest at harvest time, while the parallel North River Highway takes the valley's local trips.
    background:
      zh: 勒克尔是北岸最大的港口，北河谷地和丰谷是全岛的粮仓，但从首府到勒克尔走环岛高速要绕岛西北一大圈。领地高速网规划中，自勒高速是第一条贯穿内陆的线路，沿北河谷地北上，经林道、西诺和丰谷到勒克尔。谷地开阔平坦，线路几乎全为路堤，桥梁主要用于跨越北河及其支流。为不打扰谷地的农田灌溉，沿线修建了大量涵洞和农机通道；跨北河的桥梁不设水中桥墩，保证鲑鱼洄游不受阻挡。通车后谷地的粮食和乳制品可以当天运抵首府和勒克尔港。
      en: Lekor is the largest port on the north coast and the North River valley and Harvest Vale are the island's granary, but from the capital to Lekor the ring expressway makes a long loop round the north-west. The Freedom–Lekor Expressway was the first inland line in the territorial expressway plan, running up the North River valley through Lindau, Ino and Harvest Vale to Lekor. The valley is wide and flat, so the road is almost all embankment, with bridges mainly over the North River and its tributaries. Many culverts and farm underpasses keep the irrigation and field access intact, and the North River bridges stand clear of the water so the salmon runs are not blocked. Grain and dairy from the valley now reach the capital and Lekor's port the same day.
    shield: wheat
    via: [div_nbrnfr, div_yjghe9]
  - id: rte_72cfce
    ref: S-NV-2
    network: territorial_expressway
    class: motorway
    status: generated
    names:
      zh: 西奥高速
      en: Northwest–Oxino Expressway
    notes:
      zh: 西奥高速自西北市鹿鸣区南下，穿过林道和北河谷地到奥克西诺的奥克区，全长约二百四十公里，全程一个半小时左右，是岛西部内陆唯一的南北向高速。线路多次跨越北河水系，桥梁短而多，奥克高架桥是全线最长的一座；鹿鸣湖周边设有供驯鹿通过的动物天桥。全线双向十二车道，沿途以林地和农田为主，全程不限速。车流以奥克西诺的木材和林产品货车为主，北河谷地段汇入谷地农庄的车辆后最为繁忙；秋季驯鹿迁徙期间，鹿鸣湖一带会临时提醒车辆减速。
      en: The Northwest–Oxino Expressway runs south from Deersong in Northwest City through Lindau and the North River valley to Ox District in Oxino, about 240 km in some ninety minutes, the only north–south expressway in the island's western interior. It crosses the North River system again and again on many short bridges, the Ox Viaduct being the longest, and near Deersong Lake it has wildlife overpasses for reindeer. It has six lanes each way and, running mostly through forest and farmland, no speed limit. Its traffic is mainly timber and forest products from Oxino, and it is busiest in the North River valley, where farm traffic joins. During the autumn reindeer migration, drivers around Deersong Lake are asked to slow down.
    background:
      zh: 西北市与奥克西诺分处岛的西北和西南，两城之间原本只能经环岛高速沿西海岸绕行，奥克西诺的林产品运往西北港口要多走很长的路。西奥高速作为领地高速网的南北纵线，自西北鹿鸣区南下，穿过林道、北河谷地到奥克区，把岛西部的内陆串成一线。沿线河流众多，线路多次跨越北河水系，桥梁都不长但数量多；经过鹿鸣湖周边的驯鹿迁徙通道时，设置了专用的动物天桥和下穿通道。通车后，西部内陆的林场和乡镇第一次有了直通南北两座城市的高速。
      en: Northwest City and Oxino sit at the north-west and south-west of the island, and the only road between them was the ring expressway along the west coast, so Oxino's timber took a long way round to the north-west's ports. The Northwest–Oxino Expressway was built as the north–south spine of the territorial network, running south from Deersong through Lindau and the North River valley to Ox District and tying the western interior together. It crosses the North River system again and again on many short bridges, and where it passes the reindeer migration routes around Deersong Lake it has dedicated wildlife overpasses and underpasses. The forest settlements of the western interior now have a direct expressway to both cities.
    shield: compass
    via: [div_0yef9a, div_q4d6n6]
  - id: rte_5r9t2v
    ref: S-NV-3
    network: territorial_expressway
    class: motorway
    status: generated
    names:
      zh: 观星高速
      en: Stargazer Expressway
    notes:
      zh: 观星高速自维京港斯坦堡老城出发，经奥斯特海姆、首府白桦区和林道区，爬上西北高原到望星区的天文台和科学城，全长约四百公里，全程两个半小时以上，也是首府通往西北方向最快的公路。线路在高原边缘以连续桥隧爬升，斯坦堡高架桥和望星隧道分别是全线最长的桥梁和隧道。全线双向十二车道，城区和山区路段限速 140 公里，其余路段不限速；望星区段没有路灯，只用低位反光标志。车流以科研人员、实验设备运输车和前往天文台参观的游客为主，夜间车辆很少。
      en: The Stargazer Expressway starts in the old town of Steinburg in Viking Port and runs through Osterheim, the capital's Birchwood district and Lindau, then climbs onto the north-western plateau to the observatory and Science City at Stargaze. It is about 400 km long, over two and a half hours end to end, and also the fastest road from the capital towards the north-west. It climbs the edge of the plateau on a run of bridges and tunnels, the Steinburg Viaduct and the Stargaze Tunnel being the longest of each. It has six lanes each way, a 140 km/h limit through towns and mountains and no limit elsewhere; the Stargaze section has no street lighting, only low reflective markers. Its traffic is mostly scientists, equipment transporters and visitors to the observatory, and there is very little at night.
    background:
      zh: 望星区的天文台和科学城选址在岛西北的高原，那里夜空黑暗、空气干冷，但离各大城市都很远，科研人员和设备进出全靠一条山区公路。为支撑科学城的建设，领地修建观星高速，自维京港斯坦堡老城出发，经奥斯特海姆、首府白桦区和林道区直达望星。线路翻越高原边缘时以连续桥隧爬升；为避免车灯和路灯干扰观测，望星区段不设路灯，采用低位反光标志，隧道洞口朝向也避开天文台。通车后科学城迅速发展，这条路也成为首府通往西北的最快通道。
      en: The observatory and Science City at Stargaze were sited on the north-western plateau for its dark, dry, cold skies, far from every large city, with only a mountain road for staff and equipment. To build Science City the territory laid the Stargazer Expressway from Viking Port's old Steinburg district through Osterheim, the capital's Birchwood district and Lindau to Stargaze. It climbs the edge of the plateau on a run of bridges and tunnels. To keep headlights and street lighting from spoiling the observations, the Stargaze section has no lighting and uses low reflective markers, and the tunnel portals face away from the observatory. Science City grew quickly once the road opened, and it is also the fastest route from the capital to the north-west.
    shield: star
    via: [div_z29w6h, div_t3bfmm, div_7rk2mh, div_16cxr8, div_fr1vq9, div_g27nda, div_s8f4kt]
  - id: rte_9f3k6w
    ref: S-NV-4
    network: territorial_expressway
    class: motorway
    status: generated
    names:
      zh: 深峡高速
      en: Deep Gorge Expressway
    notes:
      zh: 深峡高速自新城米特区出发，经青坪、北苑北上，沿深峡区的瀑布峡谷穿越山地到洛龙山龙关区，全长约二百八十公里，全程不到两小时，是新城通往洛龙山的直达高速。青坪高架桥是全线最长的桥梁，峡谷段多处以高墩桥梁跨越支谷，坡度在全岛高速中属于最陡的一类。全线双向十二车道，峡谷和城区路段限速 140 公里，其余路段不限速。平日以新城运往山区的工业品货车为主，夏秋周末则挤满前往深峡瀑布观景台的自驾游客。
      en: The Deep Gorge Expressway runs north from Mitte in New City through Greenmead and North Gardens, then up the waterfall gorge of Deep Gorge District through the mountains to Dragon Pass in Lorond Mountain. It is about 280 km long, under two hours end to end, and the direct expressway from New City to Lorond Mountain. The Greenmead Viaduct is its longest bridge; in the gorge it crosses side valleys on tall-pier bridges in many places, and its grades are among the steepest of any expressway on the island. It has six lanes each way, a 140 km/h limit in the gorge and through towns and no limit elsewhere. On weekdays it carries mostly New City's manufactured goods into the mountains; on summer and autumn weekends it fills with drivers heading for the lookouts over the Deep Gorge falls.
    background:
      zh: 新城是南岸新兴的工业城市，洛龙山则是内陆的山城，两者之间的货运原本要经环岛高速绕行勒克尔。深峡高速自新城米特区出发，经青坪、北苑北上，沿深峡区的瀑布峡谷穿越山地，直达洛龙山龙关区。峡谷两岸绝壁陡立，线路多处以高墩桥梁跨越支谷；为保护瀑布景观，主桥避开瀑布正面，观景台与服务区合建。冬季在峡谷内施工风大雪急，高墩和桥面大量采用工厂预制、现场拼装。通车后新城的工业品可以直接运往山区，深峡瀑布也成了岛上最热门的自驾目的地之一。
      en: New City is a young industrial city on the south coast and Lorond Mountain a city deep inland, and freight between them used to go round by Lekor on the ring expressway. The Deep Gorge Expressway runs north from New City's Mitte through Greenmead and North Gardens, then up the waterfall gorge of Deep Gorge District to Dragon Pass. The gorge walls are sheer, so the road crosses side valleys on tall-pier bridges in many places. To spare the view of the falls the main bridge stands to one side of them, with a lookout built into the service area. Winter work in the gorge meant high winds and heavy snow, so the piers and decks were largely prefabricated and assembled on site. New City's goods now go straight into the mountains, and the gorge falls have become one of the island's favourite drives.
    tunnel_cost: 3.5
    shield: waterfall
    via: [div_m2tz6c, div_z8yxye, div_s1qwxh, div_0t2t36, div_j82dgm]
  - id: rte_45kxch
    ref: S-NV-5
    network: territorial_expressway
    class: motorway
    status: generated
    names:
      zh: 马斯林山空天高速
      en: Maslin Aerospace Expressway
    notes:
      zh: 马斯林山空天高速自东营空军基地出发，经东营区、马斯林山城区南下雪谷，途经雪谷空天飞机基地，过雪谷空军基地后接入环岛高速，全长约一百六十公里，全程一小时左右。线路全程位于平原和缓丘上，以路堤和低桥为主，雪谷高架桥是全线最长的桥梁；靠近机场的路段灯杆低矮，并与跑道保持安全距离。全线双向十二车道，全程不限速。车流以往来各基地的军人、职工和运送航空器部件、推进剂的特种车辆为主，空天飞机执行任务前后最为繁忙；道路对所有车辆开放，基地本身则需凭证件进入。
      en: The Maslin Aerospace Expressway starts at East Camp Air Base and runs through East Camp District and the city of Maslin Mountain south to Snow Valley, past the Snow Valley Spaceplane Base, and joins the ring expressway beyond Snow Valley Air Base. It is about 160 km long and takes about an hour end to end. The whole line crosses plain and gentle hills, mostly on embankment and low bridges, the Snow Valley Viaduct being the longest; near the airfields the lighting columns are kept low and the road keeps clear of the runways. It has six lanes each way and no speed limit anywhere. Its traffic is mainly service personnel and staff moving between the bases and the special vehicles that carry aircraft parts and propellant, peaking around spaceplane missions. The road is open to everyone; the bases themselves need a pass.
    background:
      zh: 马斯林山的空军和深空太空军基地分散在盆地东部和南部的平原上，过去彼此之间只能走城市道路和雪谷公路，运送大型航空器部件和推进剂的车辆不得不穿过城区。马斯林山空天高速自东营空军基地出发，经东营区和马斯林山城区南下雪谷，直达空天飞机基地和雪谷空军基地，把几座机场连成一条走廊。线路全程位于平原和缓丘上，以路堤和低桥为主，桥梁按超重超宽车辆设计；靠近机场的路段降低了灯杆高度，并与跑道保持安全距离，以免干扰飞机起降。通车后，各基地之间的人员和物资往来不再穿城，城区的交通压力也随之缓解。
      en: Maslin Mountain's air force and Deep Space Force bases are spread across the plains in the east and south of the basin, and they used to be linked only by city streets and the Snow Valley Highway, so vehicles carrying large aircraft parts and propellant had to cross the town. The Maslin Aerospace Expressway runs from East Camp Air Base through East Camp District and the city of Maslin Mountain south to Snow Valley, ending at the spaceplane base and Snow Valley Air Base, and turns the airfields into a single corridor. The whole line crosses plain and gentle hills, mostly on embankment and low bridges, with every bridge rated for oversize and overweight loads. Near the airfields the lighting columns are kept low and the road keeps a safe distance from the runways so as not to disturb flying. Since it opened, traffic between the bases no longer passes through the town, easing the pressure on the city's streets.
    shield: rocket
    via: [poi_f12qtt, div_tc0ngk, div_nvrjpg, poi_1e99xq, poi_ez2t6k]

  # 领道 (territorial highways, class primary): dual carriageways threading district centres, so
  # that every district centre lies on a territorial route.
  - id: rte_p3w6nd
    ref: S-NV-101
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 西岸公路
      en: West Coast Highway
    notes:
      zh: 西岸公路自维京港瓦尔维克区出发，沿岛西岸北上，经海门、菲尔内斯、林道和鹿鸣到寒岭脚下，全长约三百三十公里，全程两个半小时左右。线路紧贴海岸，在岬角之间以隧道穿过山嘴，寒岭隧道是全线最长的隧道，靠海路段建有防浪墙；沿途的老灯塔站如今是观景点和小型博物馆。全线双向八车道，城区和山区路段限速 120 公里，其余路段不限速。维京港近郊的路段通勤车流最大，往北以渔获冷藏车和自驾游客为主，夏季沿线观景停车区常常停满。
      en: The West Coast Highway leaves Walvik in Viking Port and runs up the west coast through Seagate, Fyrnes, Lindau and Deersong to the foot of Frost Ridge, about 330 km in some two and a half hours. It keeps close to the shore and tunnels through the headlands between capes; the Frost Ridge Tunnel is its longest, and the seaward stretches are walled against storm waves. The old lighthouse stations along the way are now lookouts and small museums. It has four lanes each way, a 120 km/h limit through towns and mountains and no limit elsewhere. Commuter traffic is heaviest on the outskirts of Viking Port; further north the road carries mostly refrigerated lorries with the day's catch and touring drivers, and in summer the lay-bys with sea views are often full.
    background:
      zh: 岛西岸峡湾密布，沿岸的渔村和灯塔站过去只能靠渔船和补给船往来。西岸公路是领地修建的第一批领道之一，自维京港瓦尔维克区北上，经海门、菲尔内斯、鹿鸣直到寒岭脚下。线路紧贴海岸，在岬角之间以隧道穿过山嘴，避免盘山绕行；靠海路段加高路基并设置防浪墙，以抵御冬季风暴潮。沿线灯塔站改建为观景点和小型博物馆。通车后西岸渔获可以连夜运到维京港鱼市，这条风景优美的海岸公路也吸引了大批自驾游客。
      en: The west coast is cut by fjords, and its fishing villages and lighthouse stations once relied on fishing boats and supply ships. The West Coast Highway was among the first territorial highways, running north from Walvik in Viking Port through Seagate, Fyrnes and Deersong to the foot of Frost Ridge. It keeps close to the shore and tunnels through the headlands between capes instead of climbing over them; on the seaward stretches the roadbed is raised and walled against winter storm surges. Lighthouse stations along the way have become lookouts and small museums. The west coast's catch now reaches the Viking Port fish market overnight, and the scenic shore road draws many touring drivers.
    shield: lighthouse
    via: [div_z29w6h, div_k1yr6m, div_pkfa1g, div_zs7kjk, div_479xae]
  - id: rte_c8j4ya
    ref: S-NV-102
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 北河公路
      en: North River Highway
    notes:
      zh: 北河公路自贝格兰丘陵下到沙洲，经首府白桦区沿北河上行，过林道、西诺和丰谷抵达勒克尔，全长约四百五十公里，全程三个半小时左右，沿途穿过谷地的大小村镇。线路跨越北河及支流十多次，所有跨河桥都不在河中立墩；沿河设有观鱼台和钓鱼停车区，鲑鱼洄游季节常有游客驻足。全线双向八车道，沿途都是乡村，全程不限速。长途车辆大多改走并行的自勒高速，这条路主要承担谷地农庄之间的短途交通、农机和校车，日均车流在领道中属于较少的一类。
      en: The North River Highway drops from the Bergland Hills to Sandbar, passes the capital's Birchwood district and follows the North River up through Lindau, Ino and Harvest Vale to Lekor, about 450 km in roughly three and a half hours, through the valley's towns and villages. It crosses the North River and its tributaries more than a dozen times, always on bridges with no piers in the water, and the fish-watching platforms and anglers' lay-bys along the river draw visitors during the salmon run. It has four lanes each way and, running through countryside all the way, no speed limit. Long-distance traffic mostly takes the parallel Freedom–Lekor Expressway, so this road carries the valley's local trips between farms, farm machinery and school buses, and is one of the quieter territorial highways.
    background:
      zh: 北河是岛上鲑鱼洄游最盛的河，谷地两岸是密集的农庄和渔场。在自勒高速建成之前，北河公路就已是谷地的主要通道，后经领地全线改建为双向分隔的领道。线路自贝格兰丘陵下到沙洲，经首府白桦区沿北河上行，过西诺、丰谷抵达勒克尔。改建时线路尽量远离河岸，众多跨河桥全部改为大跨度桥梁，河中不留桥墩；沿河设置的观鱼台和钓鱼停车区保留了老公路的生活气息。如今它与自勒高速并行，承担谷地内部的短途交通。
      en: The North River has the island's richest salmon runs, and its valley is lined with farms and fisheries. The North River Highway was the valley's main road well before the Freedom–Lekor Expressway, and the territory later rebuilt it throughout as a divided territorial highway. It drops from the Bergland Hills to Sandbar, passes the capital's Birchwood district and follows the North River up through Ino and Harvest Vale to Lekor. The rebuilt line keeps away from the banks, and every one of its many river crossings was replaced with a long-span bridge with no piers in the water. Fish-watching platforms and anglers' lay-bys keep something of the old road's character. Today it runs alongside the expressway and carries the valley's local traffic.
    shield: salmon
    via: [div_b3qw9e, div_g4a8q0, div_16cxr8, div_b1dx32, div_mpfctv, div_davn2j, div_0wvh63]
  - id: rte_m2q7xb
    ref: S-NV-103
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 杉岭公路
      en: Fir Ridge Highway
    notes:
      zh: 杉岭公路自奥克西诺的奥克区出发，穿过杉岭的针叶林海，经龙关到勒克尔的澄湖，全长约二百二十公里，全程一小时四十分钟左右。越岭段以隧道代替盘山道，洛龙山脉隧道和澄湖特大桥分别是全线最长的隧道和桥梁；沿线设有防火隔离带和消防取水点。全线双向八车道，林区山地和城区路段限速 120 公里，其余路段不限速。车流以运木车和木材加工厂的货车为主，秋季观赏林海变色的自驾游客也很多；林区防火期间部分休息区禁止明火。
      en: The Fir Ridge Highway runs from Ox District in Oxino through the conifer forests of Fir Ridge and by way of Dragon Pass to Clearlake in Lekor, about 220 km in an hour and forty minutes. Over the passes it tunnels rather than climbing in hairpins; the Lorond Range Tunnel and the Clearlake Viaduct are the longest of each on the line, and firebreaks and fire-fighting water points line the route. It has four lanes each way, a 120 km/h limit in the forested mountains and through towns and no limit elsewhere. Its traffic is mostly log trucks and lorries from the sawmills, joined in autumn by drivers who come to see the forest change colour; during the fire season open flames are banned at some rest areas.
    background:
      zh: 杉岭是全岛最大的针叶林区，林场分散在山谷之中，木材过去靠河道放排运出，季节性强、损耗也大。杉岭公路自奥克西诺的奥克区出发，穿过杉岭林海，经龙关到勒克尔的澄湖，把林区与南北两岸的港口连了起来。翻越杉岭垭口时，线路以隧道代替盘山道，桥梁跨越林间深谷；为防止森林火灾，沿线设置防火隔离带和消防取水点。修路时砍伐的林木全部就地用于施工便道和护坡。通车后放排逐渐停止，林区的木材加工厂也沿公路集中起来。
      en: Fir Ridge is the island's largest conifer forest, its logging camps scattered through the valleys, and timber used to be floated out by river, a seasonal and wasteful trade. The Fir Ridge Highway runs from Ox District in Oxino through the forest and by way of Dragon Pass to Clearlake in Lekor, linking the forest to ports on both coasts. At Fir Ridge Col it tunnels rather than climbing in hairpins, and bridges carry it over the deep forest valleys. Firebreaks and fire-fighting water points line the route, and the timber felled to clear it was all used on site for haul roads and slope protection. River floating died out after it opened, and the sawmills have gathered along the road.
    shield: fir
    via: [div_rzw76f, div_k5f1mz, div_j82dgm, div_t8bg0d]
  - id: rte_t6h2pe
    ref: S-NV-104
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 厄定河公路
      en: Erding River Highway
    notes:
      zh: 厄定河公路是全岛最长的领道，自新城北苑区北上，经深峡、上厄定改良区和旧府古城，穿过尼尔萨利特的冬季牧场到厄定河下游的厄定区，全长约六百五十公里，全程五小时左右。上厄定特大桥和马斯林山脉隧道分别是全线最长的桥梁和隧道；冻土路段路基下埋有通风管，路面常年保持平整。全线双向八车道，沿途大多是乡村，全程不限速，驯鹿迁徙季节牧场路段临时限速。南段靠近新城的车流较大，北段车辆稀少，以农牧产品货车和前往旧府古城的游客为主。
      en: The Erding River Highway is the longest territorial highway on the island. It runs north from North Gardens in New City through Deep Gorge, the Upper Erding Improvement District and the old town of Old Prefecture, then across the reindeer's winter pastures to Erding District on the lower river, about 650 km in some five hours. The Upper Erding Viaduct and the Maslin Range Tunnel are the longest of each on the line, and on the permafrost stretches ventilation pipes under the roadbed keep the surface even all year. It has four lanes each way and, running mostly through open country, no speed limit, except for temporary limits on the pasture stretches during the reindeer migration. Traffic is heavy at the southern end near New City and sparse further north, mostly farm and herding produce and visitors to Old Prefecture.
    background:
      zh: 厄定河自内陆高原流向北岸，上游是待开发的改良区，中游有旧府古城，下游是尼尔萨利特的冬季牧场。厄定河公路是全岛最长的领道，自新城北苑北上，沿厄定河谷一路到河口，把南岸工业区与北部的农牧区连在一起。线路穿越大片冻土，路基下铺设通风管和隔热层，防止冻土融化导致路面沉陷；穿过驯鹿牧场时，按牧民的转场路线设置了宽阔的动物通道，迁徙季节还会临时限速。这条路的修通，使上厄定改良区得以大规模垦殖，旧府也重新成为河谷的集散中心。
      en: The Erding River flows from the inland plateau to the north coast, past the Upper Erding Improvement District, the old town of Old Prefecture and the winter pastures of the Nirsaliit. The Erding River Highway is the island's longest territorial highway, running north from New City's North Gardens down the Erding valley to the river mouth and linking the southern industrial belt with the farming and herding north. Much of it crosses permafrost, so the roadbed has ventilation ducts and insulation to keep the ground frozen and the surface from sinking. Through the reindeer pastures it has wide animal crossings on the herders' migration routes, with temporary limits in the migration season. The road opened Upper Erding to large-scale farming and made Old Prefecture the valley's market town again.
    shield: reindeer
    via: [div_s1qwxh, div_4vnc7y, div_1qm5cj, div_e2pk5r, div_qpyn9e]
  - id: rte_x4b8rn
    ref: S-NV-105
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 南岸公路
      en: South Coast Highway
    notes:
      zh: 南岸公路自新城青坪区出发，沿岛南岸东行，经南驿、萨科勒的罗卡与萨科、卡波、镜湾和保税港区，到贝克勒自由贸易区的燕礁，全长约二百五十公里，全程两小时左右，沿途串起一个接一个的港口和城镇。卡波湾跨海大桥是全线最长的桥梁；港区路段设有集装箱专用车道，镇区路段则是两侧带自行车道的林荫大道。全线双向八车道，城区路段限速 120 公里，乡村路段不限速。它与环岛高速并行，承担南岸港口之间的短途货运和城镇通勤，是车流最大的领道之一。
      en: The South Coast Highway leaves Greenmead in New City and runs east along the south coast through South Post, Sakole's Rocca and Sako districts, Capo, Mirror Bay and the Bonded Port Zone to Swallow Reef in the Beckerle Free Trade Zone, about 250 km in some two hours, threading one port and town after another. The Capo Bay Bridge is its longest bridge; through the port areas it has dedicated container lanes, and through the towns it becomes a tree-lined boulevard with cycle lanes on both sides. It has four lanes each way, a 120 km/h limit through towns and no limit in open country. Running alongside the ring expressway, it carries short freight runs between the south-coast ports and local commuting, and is one of the busiest territorial highways.
    background:
      zh: 岛南岸地势平缓，城镇和港口一个接一个，是全岛人口最密的地带。南岸公路在环岛高速之外为沿海城镇提供一条不收费的平行通道，自新城青坪出发，经南驿、萨科勒的罗卡与萨科、卡波、镜湾和保税港区，到贝克勒自由贸易区的燕礁。线路串联多个港区，路面按重载货车标准加厚，港区路段设置独立的集装箱车道；穿过镇区时改为林荫大道式断面，两侧设自行车道。它分担了大量短途货运和通勤车流，让环岛高速得以专注于长途交通。
      en: The south coast is gentle country, town after town and port after port, and the most densely settled part of the island. The South Coast Highway gives these towns a toll-free road parallel to the ring expressway, running from Greenmead in New City through South Post, Sakole's Rocca and Sako, Capo, Mirror Bay and the Bonded Port Zone to Swallow Reef in the Beckerle Free Trade Zone. It links several port areas, so the pavement is built for heavy trucks and the port stretches have separate container lanes; through the towns it becomes a tree-lined boulevard with cycle tracks on both sides. It carries much of the short freight and commuter traffic and leaves the ring expressway to long-distance trips.
    shield: swallow
