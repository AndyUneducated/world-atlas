  - id: rte_2d7v5m
    ref: S-NV-106
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 东岸公路
      en: East Coast Highway
    notes:
      zh: 东岸公路自萨科勒铁岗区的矿区出发，经雪谷、天城的天台、银滩和岚山，沿东海岸北上到马斯林山东营区，全长约三百五十公里，全程两小时四十分钟左右，是全岛最先迎来日出的公路。线路大部分沿海岸阶地修筑，桥隧很少，风口路段设有挡风墙，两侧种着多排防风林。全线双向八车道，沿途大多是乡村，全程不限速。南段以铁岗的矿石货车为主，中段银滩、岚山的海滨度假区夏季游客很多，北段接近东营空军基地，清晨常有驱车看日出的游客。
      en: The East Coast Highway runs from the mines of Iron Knoll in Sakole through Snow Valley and Skytown's Sky Terrace, Silver Beach and Mist Hill, north along the east coast to East Camp in Maslin Mountain. It is about 350 km long, some two hours forty minutes end to end, and the first road on the island to see the sunrise. Most of it runs on the coastal terraces with few bridges or tunnels; wind walls guard the exposed stretches, and rows of shelterbelt trees line both sides. It has four lanes each way and, running mostly through open country, no speed limit. Ore lorries from Iron Knoll dominate the southern end, the beach resorts of Silver Beach and Mist Hill fill the middle section in summer, and the northern end, near East Camp Air Base, sees drivers out early to watch the sun rise.
    background:
      zh: 岛东岸面向开阔的大洋，是全岛最先迎来日出的地方，沿岸散布着矿镇、海滩和渔港。东岸公路自萨科勒铁岗区的矿区出发，经天城天台、银滩、岚山北上到马斯林山东营区，把东海岸的城镇第一次用公路连成一线。线路大部分沿海岸阶地修筑，地势较平，工程量不大，但冬季海风强劲，沿线种植了多排防风林，并在风口路段设置挡风墙。铁岗的矿石经这条路运往南岸港口，银滩和岚山的海滨度假区也因它兴起，每到清晨常有游客驱车看日出。
      en: The east coast faces the open ocean and sees the sunrise before anywhere else on the island, with mining towns, beaches and fishing harbours along its shore. The East Coast Highway runs from the mines of Iron Knoll in Sakole through Skytown's Sky Terrace, Silver Beach and Mist Hill north to East Camp in Maslin, the first road to link the east coast's towns. Most of it runs on the coastal terraces, easy ground, but the winter sea winds are fierce, so it is lined with rows of shelter belts and has wind walls at the gaps. Iron Knoll's ore travels it to the southern ports, the beach resorts at Silver Beach and Mist Hill grew up along it, and at dawn there are always cars out to watch the sunrise.
    shield: sunrise
    via: [div_6byxb5, div_w1ea18, div_f5s7ax, div_ts88e3, div_tc0ngk]
  - id: rte_7k2m9q
    ref: S-NV-107
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 雪谷公路
      en: Snow Valley Highway
    notes:
      zh: 雪谷公路自天城天台区北上，经雪谷、马斯林山和平区、西坪，穿过群峰训练管理区到星港，全长约四百四十公里，全程三个半小时左右，是岛东北部山区唯一的南北通道。群峰特大桥和群峰隧道分别是全线最长的桥梁和隧道，高海拔路段建有防雪长廊和融雪路面。全线双向八车道，山区和城区路段限速 120 公里，其余路段不限速。沿线的雪谷营区、西坪航天工厂和星港各处设施都靠它通勤与补给；穿越训练管理区的路段平时对所有车辆开放，演训期间临时封闭，冬季暴雪时也常需封路除雪。
      en: The Snow Valley Highway runs north from Sky Terrace in Skytown through Snow Valley, Peace in Maslin Mountain and West Heath, then across the High Peaks Training Area to Starport, about 440 km in some three and a half hours; it is the only north–south road through the mountains of the island's north-east. The High Peaks Viaduct and High Peaks Tunnel are the longest of each on the line, and the high stretches have snow galleries and heated road surfaces. It has four lanes each way, a 120 km/h limit in the mountains and through towns and no limit elsewhere. The Snow Valley garrison, the space plants of West Heath and the facilities around Starport all rely on it for commuting and supply. The stretch across the training area is open to all traffic except during exercises, and heavy winter snow still closes it from time to time.
    background:
      zh: 雪谷公路是岛东北部山区唯一的南北通道，自天城天台北上，经雪谷、马斯林山和平区、西坪，穿过群峰训练管理区到达星港。它主要为发射中心和群峰训练管理区提供后勤保障，也服务沿线的山区牧场。线路海拔高、积雪期长，全线设置多段防雪长廊和融雪路面，但冬季暴雪时仍常需封闭。穿越训练管理区的路段由管理部门统一管控，平时对民用车辆开放，演训期间临时封闭。为在短暂的夏季完成施工，工程大量采用预制构件，桥梁和隧道同时开工。
      en: The Snow Valley Highway is the only north–south road through the island's north-eastern mountains, running north from Sky Terrace in Skytown through Snow Valley, Maslin's Peace District and West Heath, across the High Peaks Training Area to Starport. It mainly supplies the launch centre and the training area, and it also serves the mountain pastures along the way. It runs high and the snow lies long, so it has several snow galleries and heated pavement, yet heavy snowstorms still close it in winter. The stretch across the training area is controlled by the area's authority, open to civilian traffic most of the time and closed during exercises. To finish within the short summers it was built largely from prefabricated parts, with the bridges and tunnels started at the same time.
    shield: snowflake
    via: [div_w1ea18, div_0tsyzy, div_nvrjpg, div_nwke3f, div_q5h8zp, div_nytsvb]
  - id: rte_jd77nt
    ref: S-NV-108
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 西岭公路
      en: West Ridge Highway
    notes:
      zh: 西岭公路自西坪区城区北上，沿山谷逐段爬升进入群峰训练管理区西部，经群峰拦截弹阵地和群峰寒区训练场，终点是海拔一千六百多米山顶上的西岭雷达站，全长约七十公里，全程半小时左右。群峰隧道是全线最长的隧道，陡坡路段以回头弯盘旋而上，易发雪崩处建有防雪长廊，山顶附近铺有融雪路面。全线双向八车道，全程不限速。车流以轮换的官兵、补给车辆和训练车队为主，民用车辆平时可以通行，演训期间临时封闭；终点雷达站不对外开放。
      en: The West Ridge Highway climbs north from the town of West Heath up a valley into the western High Peaks Training Area, past the High Peaks Interceptor Field and the High Peaks Cold-Weather Training Ground, to West Ridge Radar Station on a summit more than 1,600 m up. It is about 70 km long and takes around half an hour. The High Peaks Tunnel is its longest tunnel; the steepest stretches climb in hairpins, snow galleries cover the avalanche-prone sections and the road near the summit has a heated surface. It has four lanes each way and no speed limit anywhere. Its traffic is mostly rotating personnel, supply vehicles and training convoys; civilian vehicles may use it except during exercises, but the radar station at the end is closed to the public.
    background:
      zh: 群峰训练管理区西部的山地上分布着拦截弹阵地、寒区训练场和西岭雷达站，过去只有简易的山间土路相通，冬季大雪后常常数周无法通行，高山站点的补给只能等待天晴。西岭公路自西坪区城区北上，沿山谷逐段爬升，经拦截弹阵地和寒区训练场，最终到达海拔一千六百多米的西岭雷达站。线路在陡坡处以回头弯盘旋而上，易发雪崩的路段修建了防雪长廊，山岭附近的路面铺设了融雪设施。公路由训练管理区统一管理，平时允许民用车辆通行，演训期间临时封闭。通车后，各站点在冬季也能定期补给，官兵轮换也不再受天气限制。
      en: The mountains in the west of the High Peaks Training Area hold the interceptor field, the cold-weather training ground and West Ridge Radar Station, which used to be reached only by rough tracks that heavy snow could close for weeks, leaving the high stations waiting for clear weather to be resupplied. The West Ridge Highway runs north from the town of West Heath and climbs the valleys stage by stage past the interceptor field and the cold-weather ground to West Ridge Radar Station, more than 1,600 m up. It zigzags up the steepest slopes on hairpin bends, avalanche-prone stretches run through snow galleries, and the pavement near the ridge is heated. The training area authority runs the road, open to civilian traffic most of the time and closed during exercises. Since it opened the stations can be resupplied regularly through the winter, and crews can rotate whatever the weather.
    shield: peaks
    via: [div_nwke3f, poi_ncp61s, poi_rmf9wx, poi_2b8f1g]
