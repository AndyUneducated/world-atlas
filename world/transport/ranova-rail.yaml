      operating_speed_kmh: 100
      design_speed_kmh: 120
      train: { names: { zh: 红星重载列车, en: Red Star heavy-haul train }, wagons: 60, net_t: 4200 }
      loaded_trains_per_day: 4
    via: [poi_bg3kg7, div_89czvj]  # 马罗瓦托铬镍矿—沃希马希
  - id: rte_7xfjh2
    network: freight_rail
    conventional: true
    status: generated
    names:
      zh: 福伊重载铁路
      en: Forona–Ilahy Heavy-Haul Railway
      art-x-ranova: Lalamby Entana Mavesatra Forona–Ilahy
    wonder:
      structure: tunnel
      zh: 世界最长的山岭隧道，长约 74 公里
      en: The longest mountain tunnel in the world, about 74 km
    notes:
      zh: "福伊重载铁路自伊瓦卡山脚下的福罗纳铁矿出发，沿伊拉希河谷东下到伊拉希港的矿石码头，全长约二百四十公里，全程是自己的线路，在河谷里与齐伊铁路并行。线路有约 86 公里桥梁和 85 公里隧道：安德里纳高原隧道长约 74 公里，是世界最长的山岭隧道；伊拉希特大桥长约 68 公里，顺着河谷而下。满载列车运营时速 100 公里，全程两个多小时；列车为铁锤重载列车，每列八十节货车、净载约六千吨，每天开出四列满载列车，运出铝土矿、福罗纳钢铁联合企业用不完的铁矿石和钢坯，一年运量约九百万吨，回程运回进口的焦煤。线路沿河谷下行，重车下坡、空车上坡，最大坡度 12‰。\n矿区的工人说，听到专用线上三声长笛，就知道又一列满载的列车出发了。沿线道口的看守员大多是退伍军人，每过一列重车，就在本子上记一笔。"
      en: "The Forona–Ilahy Heavy-Haul Railway runs from the Forona Iron Mine at the foot of the Ivaka Mountains down the Ilahy valley to the ore quay in the port of Ilahy, about 240 km, on its own line all the way, running beside the Tsimarovo–Ilahy Railway down the valley. It has about 86 km of bridges and 85 km of tunnels: the Andrina Highlands Tunnel, about 74 km long, is the longest mountain tunnel in the world, and the Ilahy Viaduct, about 68 km, carries it down the valley. Its loaded trains run at 100 km/h and take a little over two hours; its Hammer heavy-haul trains of eighty wagons carry some 6,000 tonnes each, and four loaded trains a day take out bauxite, the iron ore and steel billets the Forona Iron and Steel Combine cannot use, about nine million tonnes a year, bringing back imported coking coal. The line runs down the valley, so the loaded trains go downhill and the empties climb, at grades of no more than 12‰.\nMine workers say three long whistles on the sidings mean another loaded train has left. Most of the crossing keepers along the line are army veterans, who make a mark in their notebooks for every loaded train that passes."
    background:
      zh: 福罗纳的铁矿和铝土矿是齐马罗沃重工业的基础，除了供应旁边的炼钢厂，多余的矿石和钢材过去只能沿齐伊铁路的普通货车和南方公路的卡车运到伊拉希港，运力常年不足。国家铁路从福罗纳铁矿另修了一条全程独立的重载线路，以长隧道穿过安德里纳高原的边缘，以长桥顺伊拉希河谷而下，在齐伊铁路旁边一路通到伊拉希港的矿石码头，让八十节的长列车能从矿山直达码头，矿石在码头直接装船。工程由工程兵部队和国营建筑公司修建；武器禁运使进口机车难以到手，重载机车是用旧机车改装的，运力的提升主要靠加长列车。
      en: The iron ore and bauxite of Forona are the base of Tsimarovo's heavy industry. Beyond what the steelworks next door take, the surplus ore and steel used to reach the port of Ilahy only in ordinary goods trains on the Tsimarovo–Ilahy Railway or in lorries on the Southern Road, never with enough capacity. The state railways built a heavy-haul line of its own the whole way from the Forona Iron Mine, through the edge of the Andrina Highlands in a long tunnel and down the Ilahy valley on long viaduct beside the Tsimarovo–Ilahy Railway to an ore quay at Ilahy, so that eighty-wagon trains can run straight from the mine to the quay and the ore goes directly onto ships. Army engineers and state builders did the work; with the arms embargo making imported locomotives hard to come by, the heavy-haul engines are rebuilt from old ones, and the extra capacity comes mostly from longer trains.
    operator: { zh: 齐马罗沃国家铁路, en: Tsimarovo State Railways }
    color: '#7A5C3E'
    tech:
      operating_speed_kmh: 100
      design_speed_kmh: 120
      train: { names: { zh: 铁锤重载列车, en: Hammer heavy-haul train }, wagons: 80, net_t: 6000 }
      loaded_trains_per_day: 4
    via: [poi_gjjw4m, div_s0cxrv]  # 福罗纳铁矿—伊拉希
