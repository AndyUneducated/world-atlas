# Railways of the Everlong Summer Islands Territory.
#
# network: intercity_rail (高速铁路 or 磁悬浮) or freight_rail (重载铁路). The other fields are those of
#   world/transport/cn-nv-rail.yaml. Intercity railways carry no numbers.
# maglev: true (intercity only): a vacuum maglev (真空磁悬浮), costed and equipped by the maglev
#   standard of engineering.yaml, on its own guideway; it shares no track with wheeled lines either
#   way. A freight_rail line (……真空磁悬浮重载铁路, capsules in a vacuum tube) also has a guideway of
#   its own.
railways:
  - id: rte_ajz4qv
    network: intercity_rail
    maglev: true
    status: generated
    names:
      zh: 长夏真空磁悬浮
      en: Everlong Summer Vacuum Maglev
      art-x-ivuran: Selo Vilalorai
    wonder:
      zh: 世界最长的铁路，全长约 2430 公里
      en: The longest railway in the world, about 2,430 km
    notes:
      zh: "长夏真空磁悬浮是领地的交通主干，全长约 2430 公里，自西南向东北连接萨伦纳姆、瓦利凯、首府米雷兰、基拉努、塔卢马兰和埃武托拉公社，最快约三小时七分跑完全程，伊武兰语名意为「夏天的光之线」。导轨全线封在低真空管道里，管内气压约为大气压的十分之一，列车几乎不受空气阻力，车站以气闸和管道相接。列车为流星 800 型，十节编组、620 座，高温超导电动悬浮、长定子直线同步电机驱动，运营时速 800 公里，全自动无人驾驶。高峰每 20 分钟一班，每年运送约 1500 万人次，是世界客运量最大的磁悬浮铁路。导轨不与轮轨铁路共用线位，能以 58‰ 的坡度直接爬上哈努帕拉高原；全线有约 80 公里桥梁和 10 公里隧道，埃莱努高架桥长约 8 公里，塔卢隧道长约 4 公里。\n车厢里的广播用中文、英文和伊武兰语轮流报站，同一个站名常常要念出三种不同的腔调。管道里看不见外面，车窗换成了屏幕，实时放映管道外的景色；从沿海一路上到高原，屏幕上的雨林渐渐换成高原草甸，乘客们笑说「屏幕上没了雨林，就该拿毛衣了」。满月的「灯与月」之夜，开往萨伦纳姆的列车会加开班次，车厢里坐满了去旧王城看灯的人。"
      en: "The Everlong Summer Vacuum Maglev is the backbone of the territory's transport, about 2,430 km long, linking Sarunnam, Vallikkai, the capital Mirelan, Kilanu, Talumaran and Evutola Commune from south-west to north-east, the fastest trains covering it in about three hours seven minutes; its Ivuran name means 'summer line of light'. The whole guideway is sealed in a low-vacuum tube at about a tenth of atmospheric pressure, so the trains meet almost no air resistance, and the stations join the tube through airlocks. Its Meteor 800 trains of ten cars and 620 seats float by high-temperature superconducting electrodynamic suspension and are driven by a long-stator linear synchronous motor at 800 km/h, fully automatic and driverless. At peak times there is a train every 20 minutes, and with some 15 million trips a year it is the busiest maglev railway in the world. The guideway shares no track with wheeled lines and climbs straight up to the Hanupala Plateau at grades of up to 58‰; the line has about 80 km of bridges and 10 km of tunnels, with the Elenu Viaduct about 8 km long and the Talu Tunnel about 4 km.\nStations are announced in Chinese, English and Ivuran in turn, often the same name in three different lilts. Nothing outside can be seen from the tube, so the windows are screens showing the view outside as the train passes; as the line climbs from the coast to the plateau the rainforest on the screens gives way to upland meadow, and passengers joke that \"when the rainforest goes, it's time to get your sweater out\". On the full-moon night of Vilaru Imolu extra services run to Sarunnam, packed with people going to see the lamps in the royal city."
    background:
      zh: 萨伦纳姆和南岸、东南岸的瓦利凯、基拉努、塔卢马兰是领地人口和产业最集中的城市，与首府和东北端的埃武托拉公社相隔一千到两千多公里，开车要一整天。领地决定以一条时速 800 公里的真空管道磁悬浮作为交通主干，让首尾两端三个多小时可达。磁悬浮能爬陡坡，线路从瓦利凯穿过洛米哈努国家公园的雨林，直接爬上一千五百米的哈努帕拉高原到首府，再下到东南岸，不必像公路那样绕行；密封的管道也把雨林的湿气和台风挡在外面。萨伦纳姆、瓦利凯、米雷兰和塔卢马兰站与其他铁路同站换乘。开通后，领地内的大部分航班被它取代。
      en: Sarunnam and Vallikkai, Kilanu and Talumaran on the south and south-east coasts are where most of the territory's people and industry are, a thousand to more than two thousand kilometres from the capital and from Evutola Commune at the north-eastern tip, a full day's drive. The territory chose an 800 km/h vacuum-tube maglev as the backbone of its transport, bringing the two ends within a little over three hours of each other. A maglev can climb steep grades, so the line runs from Vallikkai through the rainforest of the Lomihanu National Park and straight up to the Hanupala Plateau, 1,500 m up, to the capital, then down to the south-east coast, without the detours of the roads; the sealed tube also keeps out the damp of the rainforest and the typhoons. At Sarunnam, Vallikkai, Mirelan and Talumaran its stations are shared with the other railways. Since it opened it has replaced most flights within the territory.
    color: '#D6336C'
    tech:
      operating_speed_kmh: 800
      design_speed_kmh: 850
    via: [div_kv6b3e, div_11j4xw, div_khxhrn, div_24d8z4, div_5tgnmz, div_6kjc7x]  # Sarunnam – Vallikkai – Mirelan – Kilanu – Talumaran – Evutola
  - id: rte_15g5a4
    network: intercity_rail
    maglev: true
    status: generated
    names:
      zh: 萨洛真空磁悬浮
      en: Sarunnam–Lomiran Vacuum Maglev
      art-x-ivuran: Sarunnam–Lomiran Vilalorai
    notes:
      zh: "萨洛真空磁悬浮全长约 920 公里，自萨伦纳姆站经西北岸的彭纳拉姆站到雨林中的洛米兰站，最快一小时十三分钟，伊武兰语名中的 Vilalorai 意为「光之线」，是伊武兰人对真空磁悬浮的叫法。导轨全线封在低真空管道里，管内气压约为大气压的十分之一，车站以气闸和管道相接；列车为流星 800 型，十节编组、620 座，高温超导电动悬浮、长定子直线同步电机驱动，运营时速 800 公里，全自动无人驾驶。高峰每 30 分钟一班，每年运送约 390 万人次。线路沿三角洲和西北岸的平原铺设，有约 21 公里桥梁，没有隧道，最长的马伦杜尔高架桥约 4.8 公里。\n原来的犀鸟 400 型车头涂成犀鸟的黑白色，孩子们管它叫「大嘴鸟」，换成流星 800 型以后，孩子们还是这么叫。胡椒收获的季节，彭纳拉姆站的气闸一打开，辛辣的香味就涌进车厢，满车的人跟着打喷嚏，乘务员笑着说这是「彭纳拉姆的欢迎礼」。"
      en: "The Sarunnam–Lomiran Vacuum Maglev runs about 920 km from Sarunnam Station by way of Pennaram Station on the north-west coast to Lomiran Station in the rainforest, the fastest trains taking an hour and thirteen minutes; Vilalorai in its Ivuran name means 'line of light', the Ivuran word for a vacuum maglev. The whole guideway is sealed in a low-vacuum tube at about a tenth of atmospheric pressure, and the stations join the tube through airlocks; its Meteor 800 trains of ten cars and 620 seats float by high-temperature superconducting electrodynamic suspension and are driven by a long-stator linear synchronous motor at 800 km/h, fully automatic and driverless. At peak times there is a train every 30 minutes, carrying some 3.9 million trips a year. The line keeps to the plains of the delta and the north-west coast, with about 21 km of bridges and no tunnels; the longest bridge is the Marandur Viaduct, about 4.8 km.\nThe old Hornbill 400 trains had noses painted in a hornbill's black and white, and children called them \"the big beaks\"; the Meteor 800 has taken over the name. In the pepper harvest, when the airlocks open at Pennaram the spicy scent pours into the carriages and the whole train starts sneezing, which the attendants laughingly call \"Pennaram's welcome\"."
    background:
      zh: 彭纳拉姆和洛米兰在主岛西北部，一个是香料之城，一个是雨林之城，与最大城市萨伦纳姆之间过去只有公路。萨洛高速铁路原是一条时速 400 公里的轮轨线路，自萨伦纳姆向北越过三角洲，经彭纳拉姆沿西北岸到洛米兰，把香料产区、雨林旅游和生物医药研究与三角洲的港口和机场连在一起。萨伦纳姆是领地最大的城市，香料和生物医药的生意越做越大，领地便把这条线升级为真空磁悬浮，萨伦纳姆到洛米兰从两个多小时缩短到一小时出头，游客当天就能往返雨林。洛米兰站与瓦洛高速铁路相接，它和瓦洛高速铁路、长夏真空磁悬浮在主岛西南部构成一个环。
      en: Pennaram and Lomiran lie in the north-west of the main island, the one a city of spices, the other a city of rainforest, and both were once linked to Sarunnam, the largest city, only by road. The Sarunnam–Lomiran High-Speed Railway was first a 400 km/h wheeled line running north from Sarunnam across the delta and through Pennaram along the north-west coast to Lomiran, joining the spice country, rainforest tourism and biomedical research to the ports and airport of the delta. Sarunnam is the territory's largest city, and as the spice and biomedical trades grew the territory rebuilt the line as a vacuum maglev, cutting the trip from Sarunnam to Lomiran from over two hours to little more than one, so that visitors can see the rainforest and be back the same day. At Lomiran it meets the Vallikkai–Lomiran line, and with that line and the Everlong Summer Vacuum Maglev it forms a loop through the south-west of the island.
    color: '#2A9D8F'
    tech:
      operating_speed_kmh: 800
      design_speed_kmh: 850
    via: [div_kv6b3e, div_8hy4nc, div_k4tk68]  # Sarunnam – Pennaram – Lomiran
  - id: rte_px6pnc
    network: intercity_rail
    status: generated
    names:
      zh: 瓦洛高速铁路
      en: Vallikkai–Lomiran High-Speed Railway
      art-x-ivuran: Vallikkai–Lomiran Vesulorai
    notes:
      zh: "瓦洛高速铁路全长约 590 公里，自瓦利凯站北上，经梯田山城温达坎的温达坎站到洛米兰站，最快约一个半小时。列车为犀鸟 400 型，运营时速 400 公里，高峰每 30 分钟一班，每年运送约 180 万人次。线路桥隧相连，有约 92 公里桥梁和 47 公里隧道：洛米西鲁河特大桥长约 75 公里，是领地最长的轮轨铁路桥；蒂拉凯苏山脉隧道长约 47 公里，穿过中脊，是领地客运铁路中最长的隧道。\n插秧季的周末，开往温达坎的列车上坐满了去梯田的游客，有人还带着雨靴，准备跟着村民的鼓点学倒退着插秧。从温达坎站往北进入雨林，车窗外的绿色一下子浓得化不开，常坐这趟车的人说，「进了洛米兰，连空气都是湿的」。"
      en: "The Vallikkai–Lomiran High-Speed Railway runs about 590 km north from Vallikkai Station through Undakan Station in the terraced mountain city of Undakan to Lomiran Station, the fastest trains taking about an hour and a half. Its Hornbill 400 trains run at 400 km/h, every 30 minutes at peak times, carrying some 1.8 million trips a year. It runs from bridge to tunnel, with about 92 km of bridges and 47 km of tunnels: the Lomisiru River Bridge, about 75 km long, is the longest wheel-on-rail railway bridge in the territory, and the Tirakesu Mountains Tunnel, about 47 km, passes under the central range and is the longest tunnel on the territory's passenger railways.\nOn planting-season weekends the trains to Undakan are full of visitors heading for the terraces, some carrying wellies to learn backward planting to the villagers' drums. North of Undakan the line enters the rainforest and the green outside turns suddenly dense; regulars say \"once you're in Lomiran, even the air is wet\"."
    background:
      zh: 温达坎在蒂拉凯苏山脉中段，翻山到南岸的瓦利凯和北面的洛米兰都要走盘山公路。瓦洛高速铁路自瓦利凯北上，以长隧道穿过蒂拉凯苏山脉，在坎达瓦区设温达坎站，再下到洛米兰的雨林，沿洛米西鲁河谷以连续的高架桥跨过淹水林，到洛米兰站。它把南岸的港口和山区的梯田、北面的雨林连在一起，与萨洛、长夏两条真空磁悬浮在主岛西南部构成一个环。
      en: Undakan lies in the middle of the Tirakesu Mountains, and the roads over to Vallikkai on the south coast and Lomiran to the north both wind over the mountains. The line runs north from Vallikkai, passes under the Tirakesu Mountains in a long tunnel, stops at Undakan Station in Kandava District and descends into the rainforest of Lomiran, crossing the flooded forest of the Lomisiru valley on continuous viaduct to Lomiran Station. It joins the ports of the south coast to the terraces of the mountains and the rainforest to the north, and with the Sarunnam–Lomiran and Everlong Summer vacuum maglevs forms a loop through the south-west of the island.
    color: '#E9A23B'
    tech:
      operating_speed_kmh: 400
      design_speed_kmh: 450
      train: { names: { zh: 犀鸟 400 型, en: Hornbill 400 }, seats: 600 }
    via: [div_11j4xw, div_mzhe0m, div_k4tk68]  # Vallikkai – Undakan – Lomiran
  - id: rte_h2yqvj
    network: intercity_rail
    status: generated
    names:
      zh: 米纳高速铁路
      en: Mirelan–Nalumai High-Speed Railway
      art-x-ivuran: Mirelan–Nalumai Vesulorai
    notes:
      zh: "米纳高速铁路全长约 510 公里，自首府米雷兰站从哈努帕拉高原下到西北岸的纳卢迈站，最快约一小时二十一分钟。列车为犀鸟 400 型，运营时速 400 公里，高峰每 30 分钟一班，每年运送约 21 万人次，客流以公务出行和游客为主。线路有约 80 公里桥梁和 22 公里隧道，在高原边缘以哈努帕拉特大桥（约 13 公里）和哈努帕拉隧道（约 4 公里）盘下陡坡。\n列车从高原一路下到海边，乘客上车时穿着毛衣，下车时换上短袖，车厢的行李架上常常挂满了脱下来的外套。周末，纳卢迈的果农在站台上摆摊，榴莲季里站台上贴着「请勿携带榴莲上车」的告示，乘客们只好在站台上吃完再走。"
      en: "The Mirelan–Nalumai High-Speed Railway runs about 510 km from Mirelan Station in the capital down from the Hanupala Plateau to Nalumai Station on the north-west coast, the fastest trains taking about an hour and twenty-one minutes. Its Hornbill 400 trains run at 400 km/h, every 30 minutes at peak times, carrying some 210,000 trips a year, mostly official travel and visitors. It has about 80 km of bridges and 22 km of tunnels, coming down the edge of the plateau on the Hanupala Viaduct (about 13 km) and through the Hanupala Tunnel (about 4 km).\nThe line drops from the plateau to the sea, and passengers who board in sweaters step off in short sleeves, the luggage racks hung with discarded coats. At weekends Nalumai's fruit growers set up stalls on the platform; in durian season a notice reads \"no durians on board\", so passengers eat theirs on the platform before they go."
    background:
      zh: 首府米雷兰在海拔一千五百多米的高原上，长夏真空磁悬浮把它与南岸和东南岸的城市连起来，西北岸的纳卢迈却仍要走盘山公路。米纳高速铁路从首府向北下到纳卢迈，在高原边缘以长桥和隧道盘下陡坡，再穿过雨林到海边。线路为首府与西北岸之间的公务往来服务，也把首府的居民送到纳卢迈的海滩、果园和维兰塔植物园。
      en: The capital Mirelan stands on a plateau more than 1,500 m up; the Everlong Summer Vacuum Maglev links it to the cities of the south and south-east coasts, but Nalumai on the north-west coast was still reached by a winding mountain road. The line drops north from the capital to Nalumai, coming down the edge of the plateau on long bridges and through tunnels, then through the rainforest to the sea. It serves official travel between the capital and the north-west coast and takes the capital's residents to the beaches, orchards and Viranta Botanic Garden of Nalumai.
    color: '#7B61FF'
    tech:
      operating_speed_kmh: 400
      design_speed_kmh: 450
      train: { names: { zh: 犀鸟 400 型, en: Hornbill 400 }, seats: 600 }
    via: [div_khxhrn, div_bca7d9]  # Mirelan – Nalumai
  - id: rte_hg0kqa
    network: intercity_rail
    status: generated
    names:
      zh: 塔纳高速铁路
      en: Talumaran–Nalumai High-Speed Railway
      art-x-ivuran: Talumaran–Nalumai Vesulorai
    notes:
      zh: "塔纳高速铁路全长约 760 公里，自东南岸的塔卢马兰站出发，经乌诺卡里站穿过乌诺凯苏山地，到西北岸的纳卢迈站，最快约两小时。列车为犀鸟 400 型，运营时速 400 公里，高峰每 30 分钟一班，每年运送约 270 万人次。线路有约 52 公里桥梁和 38 公里隧道：塔卢西鲁河特大桥长约 8.5 公里，是全线最长的桥梁；霍拉坦隧道长约 28 公里，穿过乌诺凯苏山地。\n这条线一头是电池和整车厂，一头是珍珠和果园，乘客里既有穿工装的工程师，也有提着果篮的农户。列车穿过乌诺凯苏山地时，车窗外是一片片矿工种下的「矿工林」，乘务员会指给乘客看哪片林子是哪个班组种的。"
      en: "The Talumaran–Nalumai High-Speed Railway runs about 760 km from Talumaran Station on the south-east coast through Unokari Station and across the Unokesu uplands to Nalumai Station on the north-west coast, the fastest trains taking about two hours. Its Hornbill 400 trains run at 400 km/h, every 30 minutes at peak times, carrying some 2.7 million trips a year. It has about 52 km of bridges and 38 km of tunnels: the Talusiru River Bridge, about 8.5 km long, is its longest bridge, and the Horatan Tunnel, about 28 km, passes under the Unokesu uplands.\nOne end of the line is batteries and car plants, the other pearls and orchards, and its passengers range from engineers in overalls to farmers carrying baskets of fruit. Crossing the Unokesu Mountains the windows look out on the \"miners' woods\", and the attendants point out which crew planted which."
    background:
      zh: 塔卢马兰是领地第二大城市和工业中心，乌诺卡里的镍矿为它的电池厂供料，矿区和工厂之间的工程师和工人往来频繁。塔纳高速铁路自塔卢马兰向北，经乌诺卡里穿过乌诺凯苏山地到西北岸的纳卢迈，横贯主岛东北部，把工业带、矿区和西北岸的果园海岸连起来；在纳卢迈与米纳高速铁路相接，西北岸由此也有铁路通往首府。
      en: Talumaran is the territory's second city and its industrial centre, its battery plants fed by the nickel mines of Unokari, and engineers and workers travel constantly between mines and plants. The line runs north from Talumaran through Unokari and across the Unokesu uplands to Nalumai on the north-west coast, crossing the north-east of the main island to join the industrial belt, the mines and the orchard coast of the north-west; at Nalumai it meets the Mirelan–Nalumai line, which gives the north-west coast a railway to the capital as well.
    color: '#3A86FF'
    tech:
      operating_speed_kmh: 400
      design_speed_kmh: 450
      train: { names: { zh: 犀鸟 400 型, en: Hornbill 400 }, seats: 600 }
    via: [div_5tgnmz, div_7z142e, div_bca7d9]  # Talumaran – Unokari – Nalumai
  - id: rte_pvm4xp
