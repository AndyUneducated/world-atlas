# Railways of the Everlong Summer Islands Territory.
#
# network: intercity_rail (城际铁路) or freight_rail (重载铁路). The other fields are those of
#   world/transport/cn-nv-rail.yaml. Intercity railways carry no numbers.
# maglev: true (intercity only): a maglev line, costed and equipped by the maglev standard of
#   engineering.yaml, on its own guideway; it shares no track with wheeled lines either way.
railways:
  - id: rte_ajz4qv
    network: intercity_rail
    maglev: true
    status: generated
    names:
      zh: 长夏磁悬浮
      en: Everlong Summer Maglev
      art-x-ivuran: Selo Vilalorai
    wonder:
      zh: 世界最快、最长的铁路，运营时速 600 公里，全长约 2530 公里
      en: "The fastest and longest railway in the world: 600 km/h and about 2,530 km"
    notes:
      zh: 长夏磁悬浮是领地的交通主干，全长约 2530 公里，自西南向东北连接萨伦纳姆、瓦利凯、首府米雷兰、基拉努、塔卢马兰和埃武托拉公社，最快约四小时十七分跑完全程，伊武兰语名意为「夏天的光之线」。列车为流星 600 型，十节编组、620 座，常导电磁悬浮、长定子直线同步电机驱动，运营时速 600 公里，全自动无人驾驶。高峰每 20 分钟一班，每年运送约 1400 万人次，是世界客运量最大的城际铁路。导轨不与轮轨铁路共用线位，能以 46.5‰ 的坡度直接爬上哈努帕拉高原；全线有约 97 公里桥梁和 5 公里隧道，萨基拉高架桥长约 10.5 公里，洛米哈努国家公园隧道长约 3 公里。
      en: The Everlong Summer Maglev is the backbone of the territory's transport, about 2,530 km long, linking Sarunnam, Vallikkai, the capital Mirelan, Kilanu, Talumaran and Evutola Commune from south-west to north-east, the fastest trains covering it in about four hours seventeen minutes; its Ivuran name means 'summer line of light'. Its Meteor 600 trains of ten cars and 620 seats float by electromagnetic suspension and are driven by a long-stator linear synchronous motor at 600 km/h, fully automatic and driverless. At peak times there is a train every 20 minutes, and with some 14 million trips a year it is the busiest intercity railway in the world. The guideway shares no track with wheeled lines and climbs straight up to the Hanupala Plateau at grades of up to 46.5‰; the line has about 97 km of bridges and 5 km of tunnels, with the Sakila Viaduct about 10.5 km long and the Lomihanu National Park Tunnel about 3 km.
    background:
      zh: 萨伦纳姆和南岸、东南岸的瓦利凯、基拉努、塔卢马兰是领地人口和产业最集中的城市，与首府和东北端的埃武托拉公社相隔一千到两千多公里，开车要一整天。领地决定以一条时速 600 公里的磁悬浮线作为交通主干，让首尾两端四个多小时可达。磁悬浮能爬陡坡，线路从瓦利凯穿过洛米哈努国家公园的雨林，直接爬上一千五百米的哈努帕拉高原到首府，再下到东南岸，不必像公路那样绕行。萨伦纳姆、瓦利凯、米雷兰和塔卢马兰站与高速铁路同站换乘。开通后，领地内的大部分航班被它取代。
      en: Sarunnam and Vallikkai, Kilanu and Talumaran on the south and south-east coasts are where most of the territory's people and industry are, a thousand to more than two thousand kilometres from the capital and from Evutola Commune at the north-eastern tip, a full day's drive. The territory chose a 600 km/h maglev as the backbone of its transport, bringing the two ends within a little over four hours of each other. A maglev can climb steep grades, so the line runs from Vallikkai through the rainforest of the Lomihanu National Park and straight up to the Hanupala Plateau, 1,500 m up, to the capital, then down to the south-east coast, without the detours of the roads. At Sarunnam, Vallikkai, Mirelan and Talumaran its stations are shared with the high-speed railways. Since it opened it has replaced most flights within the territory.
    color: '#D6336C'
    tech:
      operating_speed_kmh: 600
      design_speed_kmh: 650
    via: [div_kv6b3e, div_11j4xw, div_khxhrn, div_24d8z4, div_5tgnmz, div_6kjc7x]  # Sarunnam – Vallikkai – Mirelan – Kilanu – Talumaran – Evutola
  - id: rte_15g5a4
    network: intercity_rail
    status: generated
    names:
      zh: 萨洛高速铁路
      en: Sarunnam–Lomiran High-Speed Railway
      art-x-ivuran: Sarunnam–Lomiran Vesulorai
    notes:
      zh: 萨洛高速铁路全长约 880 公里，自萨伦纳姆站经西北岸的彭纳拉姆站到雨林中的洛米兰站，最快约两小时十六分钟，伊武兰语名中的 Vesulorai 意为「快线」。列车为犀鸟 400 型，八辆编组 600 座、可重联十六辆，运营时速 400 公里。高峰每 30 分钟一班，每年运送约 400 万人次。线路有约 26 公里桥梁和 23 公里隧道，奥卢瓦尔隧道长约 13 公里，伊拉瓦姆高架桥长约 6 公里，以高架穿过萨伦纳姆城区。
      en: The Sarunnam–Lomiran High-Speed Railway runs about 880 km from Sarunnam Station by way of Pennaram Station on the north-west coast to Lomiran Station in the rainforest, the fastest trains taking about two hours sixteen minutes; Vesulorai in its Ivuran name means 'swift line'. Its Hornbill 400 trains of eight cars and 600 seats, which can run in pairs of sixteen, run at 400 km/h. At peak times there is a train every 30 minutes, carrying some 4 million trips a year. The line has about 26 km of bridges and 23 km of tunnels; the Oluvar Tunnel is about 13 km long and the Ilavam Viaduct, about 6 km, carries it over the city of Sarunnam.
    background:
      zh: 彭纳拉姆和洛米兰在主岛西北部，一个是香料之城，一个是雨林之城，与最大城市萨伦纳姆之间过去只有公路。萨洛高速铁路自萨伦纳姆向北越过三角洲，经彭纳拉姆沿西北岸到洛米兰，把香料产区、雨林旅游和生物医药研究与三角洲的港口和机场连在一起，游客从萨伦纳姆乘车两个多小时就能到达雨林边缘。洛米兰站与瓦洛高速铁路相接，两条线和磁悬浮在主岛西南部构成一个环。
      en: Pennaram and Lomiran lie in the north-west of the main island, the one a city of spices, the other a city of rainforest, and both were once linked to Sarunnam, the largest city, only by road. The line runs north from Sarunnam across the delta and through Pennaram along the north-west coast to Lomiran, joining the spice country, rainforest tourism and biomedical research to the ports and airport of the delta, so visitors from Sarunnam reach the edge of the rainforest in a little over two hours. At Lomiran it meets the Vallikkai–Lomiran line, and the two with the maglev form a loop through the south-west of the island.
    color: '#2A9D8F'
    tech:
      operating_speed_kmh: 400
      design_speed_kmh: 450
      train: { names: { zh: 犀鸟 400 型, en: Hornbill 400 }, seats: 600 }
    via: [div_kv6b3e, div_8hy4nc, div_k4tk68]  # Sarunnam – Pennaram – Lomiran
  - id: rte_px6pnc
    network: intercity_rail
    status: generated
    names:
      zh: 瓦洛高速铁路
      en: Vallikkai–Lomiran High-Speed Railway
      art-x-ivuran: Vallikkai–Lomiran Vesulorai
    notes:
      zh: 瓦洛高速铁路全长约 580 公里，自瓦利凯站北上，经梯田山城温达坎的温达坎站到洛米兰站，最快约一个半小时。列车为犀鸟 400 型，运营时速 400 公里，高峰每 30 分钟一班，每年运送约 180 万人次。线路桥隧相连，有约 88 公里桥梁和 52 公里隧道：洛米西鲁河特大桥长约 76 公里，是领地最长的铁路桥；蒂拉凯苏山脉隧道长约 47 公里，穿过中脊，是领地高速铁路中最长的隧道。
      en: "The Vallikkai–Lomiran High-Speed Railway runs about 580 km north from Vallikkai Station through Undakan Station in the terraced mountain city of Undakan to Lomiran Station, the fastest trains taking about an hour and a half. Its Hornbill 400 trains run at 400 km/h, every 30 minutes at peak times, carrying some 1.8 million trips a year. It runs from bridge to tunnel, with about 88 km of bridges and 52 km of tunnels: the Lomisiru River Bridge, about 76 km long, is the longest railway bridge in the territory, and the Tirakesu Mountains Tunnel, about 47 km, passes under the central range and is the longest tunnel on the territory's high-speed lines."
    background:
      zh: 温达坎在蒂拉凯苏山脉中段，翻山到南岸的瓦利凯和北面的洛米兰都要走盘山公路。瓦洛高速铁路自瓦利凯北上，以长隧道穿过蒂拉凯苏山脉，在坎达瓦区设温达坎站，再下到洛米兰的雨林，沿洛米西鲁河谷以连续的高架桥跨过淹水林，到洛米兰站。它把南岸的港口和山区的梯田、北面的雨林连在一起，与萨洛高速铁路和磁悬浮在主岛西南部构成一个环。
      en: Undakan lies in the middle of the Tirakesu Mountains, and the roads over to Vallikkai on the south coast and Lomiran to the north both wind over the mountains. The line runs north from Vallikkai, passes under the Tirakesu Mountains in a long tunnel, stops at Undakan Station in Kandava District and descends into the rainforest of Lomiran, crossing the flooded forest of the Lomisiru valley on continuous viaduct to Lomiran Station. It joins the ports of the south coast to the terraces of the mountains and the rainforest to the north, and with the Sarunnam–Lomiran line and the maglev forms a loop through the south-west of the island.
    color: '#E9A23B'
    tech:
      operating_speed_kmh: 400
      design_speed_kmh: 450
      train: { names: { zh: 犀鸟 400 型, en: Hornbill 400 }, seats: 600 }
    via: [div_11j4xw, div_mzhe0m, div_k4tk68]  # Vallikkai – Undakan – Lomiran
  - id: rte_h2yqvj
    network: intercity_rail
    status: generated
    names:
      zh: 米纳高速铁路
      en: Mirelan–Nalumai High-Speed Railway
      art-x-ivuran: Mirelan–Nalumai Vesulorai
    notes:
      zh: 米纳高速铁路全长约 450 公里，自首府米雷兰站从哈努帕拉高原下到西北岸的纳卢迈站，最快约一小时十二分钟。列车为犀鸟 400 型，运营时速 400 公里，高峰每 30 分钟一班，每年运送约 23 万人次，客流以公务出行和游客为主。线路有约 54 公里桥梁和 14 公里隧道，在高原边缘以哈努帕拉特大桥（约 7.5 公里）和哈努帕拉高原隧道（约 4 公里）盘下陡坡。
      en: The Mirelan–Nalumai High-Speed Railway runs about 450 km from Mirelan Station in the capital down from the Hanupala Plateau to Nalumai Station on the north-west coast, the fastest trains taking about an hour and twelve minutes. Its Hornbill 400 trains run at 400 km/h, every 30 minutes at peak times, carrying some 230,000 trips a year, mostly official travel and visitors. It has about 54 km of bridges and 14 km of tunnels, coming down the edge of the plateau on the Hanupala Viaduct (about 7.5 km) and through the Hanupala Plateau Tunnel (about 4 km).
    background:
      zh: 首府米雷兰在海拔一千五百多米的高原上，磁悬浮把它与南岸和东南岸的城市连起来，西北岸的纳卢迈却仍要走盘山公路。米纳高速铁路从首府向北下到纳卢迈，在高原边缘以长桥和隧道盘下陡坡，再穿过雨林到海边。线路为首府与西北岸之间的公务往来服务，也把首府的居民送到纳卢迈的海滩、果园和维兰塔植物园。
      en: The capital Mirelan stands on a plateau more than 1,500 m up; the maglev links it to the cities of the south and south-east coasts, but Nalumai on the north-west coast was still reached by a winding mountain road. The line drops north from the capital to Nalumai, coming down the edge of the plateau on long bridges and through tunnels, then through the rainforest to the sea. It serves official travel between the capital and the north-west coast and takes the capital's residents to the beaches, orchards and Viranta Botanic Garden of Nalumai.
    color: '#7B61FF'
    tech:
      operating_speed_kmh: 400
      design_speed_kmh: 450
      train: { names: { zh: 犀鸟 400 型, en: Hornbill 400 }, seats: 600 }
    via: [div_khxhrn, div_bca7d9]  # Mirelan – Nalumai
  - id: rte_hg0kqa
    network: intercity_rail
    status: generated
    names:
      zh: 塔纳高速铁路
      en: Talumaran–Nalumai High-Speed Railway
      art-x-ivuran: Talumaran–Nalumai Vesulorai
    notes:
      zh: 塔纳高速铁路全长约 760 公里，自东南岸的塔卢马兰站出发，经乌诺卡里站穿过乌诺凯苏山地，到西北岸的纳卢迈站，最快约两小时。列车为犀鸟 400 型，运营时速 400 公里，高峰每 30 分钟一班，每年运送约 270 万人次。线路有约 82 公里桥梁和 40 公里隧道：帕兰图特大桥长约 54 公里，跨过纳卢迈帕兰图区的果园平原；霍拉坦隧道长约 28 公里，穿过乌诺凯苏山地。
      en: "The Talumaran–Nalumai High-Speed Railway runs about 760 km from Talumaran Station on the south-east coast through Unokari Station and across the Unokesu uplands to Nalumai Station on the north-west coast, the fastest trains taking about two hours. Its Hornbill 400 trains run at 400 km/h, every 30 minutes at peak times, carrying some 2.7 million trips a year. It has about 82 km of bridges and 40 km of tunnels: the Parantu Viaduct, about 54 km long, crosses the orchard plain of Parantu District in Nalumai, and the Horatan Tunnel, about 28 km, passes under the Unokesu uplands."
    background:
      zh: 塔卢马兰是领地第二大城市和工业中心，乌诺卡里的镍矿为它的电池厂供料，矿区和工厂之间的工程师和工人往来频繁。塔纳高速铁路自塔卢马兰向北，经乌诺卡里穿过乌诺凯苏山地到西北岸的纳卢迈，横贯主岛东北部，把工业带、矿区和西北岸的果园海岸连起来；在纳卢迈与米纳高速铁路相接，西北岸由此也有铁路通往首府。
      en: Talumaran is the territory's second city and its industrial centre, its battery plants fed by the nickel mines of Unokari, and engineers and workers travel constantly between mines and plants. The line runs north from Talumaran through Unokari and across the Unokesu uplands to Nalumai on the north-west coast, crossing the north-east of the main island to join the industrial belt, the mines and the orchard coast of the north-west; at Nalumai it meets the Mirelan–Nalumai line, which gives the north-west coast a railway to the capital as well.
    color: '#3A86FF'
    tech:
      operating_speed_kmh: 400
      design_speed_kmh: 450
      train: { names: { zh: 犀鸟 400 型, en: Hornbill 400 }, seats: 600 }
    via: [div_5tgnmz, div_7z142e, div_bca7d9]  # Talumaran – Unokari – Nalumai
  - id: rte_pvm4xp
    network: freight_rail
    status: generated
    names:
      zh: 乌诺维拉重载铁路
      en: Unovila Heavy-Haul Railway
      art-x-ivuran: Unovila Lumalorai
    wonder:
      structure: tunnel
      zh: 世界最长的山岭隧道，长约 72 公里
      en: The longest mountain tunnel in the world, about 72 km
    notes:
      zh: 乌诺维拉重载铁路全长约 450 公里，自乌诺维拉矿区管理区的货运站，经冶炼厂所在的佩鲁诺区货运站，到塔卢马兰电池厂所在的伊拉坦区货运站，满载列车全程约五个半小时，伊武兰语名中的 Lumalorai 意为「货物之线」。全线由无人驾驶的红土 80 型重载列车运行，每列 80 节车皮、载货 6400 吨，每天发出 8 列满载列车，每年运出约 1900 万吨矿石和镍产品。线路最大坡度 12‰，桥隧占了新建线路的八成：乌诺凯苏山脉隧道长约 72 公里，霍拉坦特大桥长约 40 公里。
      en: "The Unovila Heavy-Haul Railway runs about 450 km from the freight yard of the Unovila Mining Administration Zone through the freight yard of Peruno District, home of the smelters, to that of Ilatan District in Talumaran, home of the battery plants, a loaded train taking about five and a half hours; Lumalorai in its Ivuran name means 'line of goods'. It is worked entirely by driverless Laterite 80 heavy-haul trains of 80 wagons carrying 6,400 t each, eight loaded trains a day and some 19 million tonnes of ore and nickel products a year. Its grades are 12‰ at most, and bridges and tunnels make up four-fifths of the new line: the Unokesu Mountains Tunnel is about 72 km long and the Horatan Viaduct about 40 km."
    background:
      zh: 乌诺凯苏山脉中的红土镍矿是领地最大的矿产，矿石要先到佩鲁诺区冶炼成电池级的镍盐，再运往塔卢马兰伊拉坦区的电池厂。山区公路坡陡弯急，大批矿车既慢又扰民。领地修建了这条重载铁路，以长隧道直穿乌诺凯苏山脉，以长桥跨过霍拉坦的河谷，线路坡度平缓，矿区、冶炼厂和电池厂由此连成一条完整的产业链。列车全部电力牵引、无人驾驶，矿区的山坡上不必再修运矿公路，开采后的山地也更容易复绿。
      en: The laterite nickel of the Unokesu Mountains is the territory's largest mineral resource; the ore is first smelted into battery-grade nickel salts in Peruno District and then sent to the battery plants of Ilatan District in Talumaran. The mountain roads are steep and winding, and long convoys of ore lorries were slow and a nuisance to the towns. The territory built this heavy-haul railway, driving straight through the Unokesu Mountains in a long tunnel and across the Horatan valley on a long bridge at gentle grades, so that mines, smelters and battery plants form a single chain. Its trains are all electric and driverless, no haul roads need be cut across the mining slopes, and the worked-out hillsides are easier to replant.
    color: '#8C6B4A'
    tech:
      operating_speed_kmh: 80
      design_speed_kmh: 100
      train: { names: { zh: 红土 80 型重载列车, en: Laterite 80 heavy-haul train }, wagons: 80, net_t: 6400 }
      loaded_trains_per_day: 8
    via: [div_6z737x, div_4m0x2v, div_3e94sq]  # unovila – peruno – ilatan
