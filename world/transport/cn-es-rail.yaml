    names:
      zh: 乌诺维拉真空磁悬浮重载铁路
      en: Unovila Vacuum Maglev Heavy-Haul Railway
      art-x-ivuran: Unovila Lumalorai
    wonder:
      structure: bridge
      zh: 世界最长的桥梁，长约 121 公里
      en: The longest bridge in the world, about 121 km
    notes:
      zh: "乌诺维拉真空磁悬浮重载铁路全长约 190 公里，自乌诺卡里市乌诺维拉矿区管理区的乌诺维拉矿区货运站，到冶炼厂和电池厂所在的佩鲁诺区的佩鲁诺货运站，满载列车全程约十九分钟，伊武兰语名 Unovila Lumalorai 中的 Lumalorai 意为「货物之线」。线路是一条密封的低真空管道，管内气压约为大气压的十分之一，货运舱以常导电磁悬浮在管道里前进，悬浮间隙 15 毫米，由长定子直线同步电机推动，不用车轮，也不用接触网；它有自己的导轨，不与任何轮轨线路共用线位。全线由无人驾驶（GoA4）的红土 600 型重载列车运行，运营时速 600 公里、设计时速 650 公里，每列 80 节货运舱、载货 6400 吨，每天发出 8 列满载列车，每年运出约 1900 万吨矿石。线路最大坡度 12‰，几乎全线是桥和隧道：桥梁合计约 122 公里、隧道约 70 公里，跨越 1 条河流；霍拉坦特大桥长约 121 公里，是世界最长的桥梁；乌诺凯苏山脉隧道长约 70 公里，是领地最长的隧道。线路由长夏群岛磁浮与铁路公司运营，建设投资约 298 亿美元，每年维护费约 3.5 亿美元。\n霍拉坦特大桥跨过乌诺卡里市霍拉坦区的高地和河谷，区名意为「雾中之地」，桥下是稻田、果园和保留着伊武兰人传统的村寨，山间的水电站为佩鲁诺的冶炼厂供电。佩鲁诺区的高压酸浸冶炼厂把红土镍矿炼成电池级的硫酸镍和硫酸钴，废渣经过处理后回填矿坑；旁边的佩鲁诺电池厂接着把它们做成正极材料、电芯和电池包，再由公路运往塔卢马兰伊拉坦区的新能源车厂，塔卢马兰街上的出租车和公交车几乎都出自那里。\n货运舱在矿区装车时常常蒙上一层赭红色的红土，进管道前要先过一道冲洗门，矿工们说这些车也要「洗红」。管道里的列车几乎没有声音，沿线的人只看得见管道上的指示灯按时一盏接一盏亮过山谷，村子里的人不看钟，看见灯亮过去就知道该吃午饭了。霍拉坦的雾天，河谷被白雾填满，只有特大桥上的管道浮在雾面上，像一条搭在云上的长绳，村里的孩子管它叫「云上的路」。"
      en: "The Unovila Vacuum Maglev Heavy-Haul Railway runs about 190 km from the Unovila Mining Freight Yard in the Unovila Mining Administration Zone of Unokari City to the Peruno Freight Yard in Peruno District, home of the smelter and the battery works, a loaded train taking about nineteen minutes; Lumalorai in its Ivuran name, Unovila Lumalorai, means 'line of goods'. The line is a sealed low-vacuum tube at about a tenth of atmospheric pressure, in which the capsules float along by electromagnetic suspension with a 15 mm gap, pushed by a long-stator linear synchronous motor, with no wheels and no overhead line; it runs on a guideway of its own and shares no track with any wheeled line. It is worked entirely by driverless (GoA4) Laterite 600 heavy-haul trains running at 600 km/h with a design speed of 650 km/h, each of 80 capsules carrying 6,400 t, eight loaded trains a day and some 19 million tonnes of ore a year. Its grades are 12‰ at most, and it is almost all bridge and tunnel, some 122 km of bridges and 70 km of tunnels in all, crossing one river: the Horatan Viaduct, about 121 km long, is the longest bridge in the world, and the Unokesu Mountains Tunnel, about 70 km, the longest tunnel in the territory. It is operated by Everlong Summer Maglev and Railways and cost about US$29.8 billion to build and about US$350 million a year to maintain.\nThe Horatan Viaduct crosses the uplands and valleys of Horatan District in Unokari City, whose name means 'land in the mist'; below it lie rice fields, orchards and villages that keep the Ivuran traditions, and hydroelectric stations in the hills power the smelter of Peruno. The high-pressure acid leach smelter of Peruno District turns the laterite ore into battery-grade nickel sulphate and cobalt sulphate, and the treated residue goes back into the pits; the Peruno Battery Works next door makes them into cathode materials, cells and packs, which go by road to the electric-vehicle plant of Ilatan District in Talumaran, where almost every taxi and bus on Talumaran's streets is built.\nThe capsules are often coated with ochre laterite as they load at the mines, and they pass through a wash gate before entering the tube, so miners say the trains need \"washing off the red\" too. The trains in the tube make almost no sound; all anyone along the line sees is the row of lights on the tube coming on one after another across the valley at fixed times, and villagers need no clock: when the lights go by, it is time for lunch. On misty days in Horatan the valleys fill with white fog and only the tube on the viaduct floats above it like a long rope laid across the clouds, which the village children call \"the road on the clouds\"."
    background:
      zh: "乌诺凯苏山脉中的红土镍矿是领地最大的矿产，矿石要先到佩鲁诺区冶炼成电池级的镍盐，再在旁边的电池厂做成电池。山区公路坡陡弯急，大批矿车既慢又扰民。领地修建了这条重载铁路，以长隧道直穿乌诺凯苏山脉，以长桥跨过霍拉坦的河谷，线路坡度平缓，矿区、冶炼厂和电池厂由此连成一条完整的产业链。早年重载列车有一段走高速铁路的轨道；改为在低真空管道里悬浮运行的货运舱后，线路另建了全程独立的导轨，列车也换成了时速 600 公里、无人驾驶的红土 600 型。矿粉和噪声都封在管道里，矿区的山坡上不必再修运矿公路，开采后的山地也更容易复绿。"
      en: "The laterite nickel of the Unokesu Mountains is the territory's largest mineral resource; the ore is first smelted into battery-grade nickel salts in Peruno District and then made into batteries at the works next door. The mountain roads are steep and winding, and long convoys of ore lorries were slow and a nuisance to the towns. The territory built this heavy-haul railway, driving straight through the Unokesu Mountains in a long tunnel and across the Horatan valley on a long bridge at gentle grades, so that mines, smelter and battery works form a single chain. In its early years the heavy-haul trains ran over part of a high-speed line; once the line became capsules floating in a low-vacuum tube it was given a guideway of its own the whole way, and its trains became the driverless, 600 km/h Laterite 600. The tube keeps the ore dust and the noise inside, no haul roads need be cut across the mining slopes, and the worked-out hillsides are easier to replant."
