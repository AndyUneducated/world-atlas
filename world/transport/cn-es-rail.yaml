      zh: 世界最长的铁路桥梁，长约 94 公里
      en: The longest railway bridge in the world, about 94 km
    notes:
      zh: "乌诺维拉真空磁悬浮重载铁路全长约 430 公里，自乌诺维拉矿区管理区的货运站，经冶炼厂所在的佩鲁诺区货运站，到塔卢马兰电池厂所在的伊拉坦区货运站，满载列车全程约四十三分钟，伊武兰语名中的 Lumalorai 意为「货物之线」。线路是一条密封的低真空管道，管内气压约为大气压的十分之一，货运舱以常导电磁悬浮在管道里前进，不用车轮，也不用接触网；它有自己的导轨，不与任何轮轨线路共用线位。全线由无人驾驶的红土 600 型重载列车运行，运营时速 600 公里，每列 80 节货运舱、载货 6400 吨，每天发出 8 列满载列车，每年运出约 1900 万吨矿石和镍产品。线路最大坡度 12‰，桥隧约占全线一半：霍拉坦特大桥长约 94 公里，是世界最长的铁路桥梁；乌诺凯苏山脉隧道长约 63 公里，是领地最长的隧道。\n货运舱在矿区装车时常常蒙上一层赭红色的红土，进管道前要先过一道冲洗门，矿工们说这些车也要「洗红」。管道里的列车几乎没有声音，沿线的人只看得见管道上的指示灯按时一盏接一盏亮过山谷，村子里的人不看钟，看见灯亮过去就知道该吃午饭了。"
      en: "The Unovila Vacuum Maglev Heavy-Haul Railway runs about 430 km from the freight yard of the Unovila Mining Administration Zone through the freight yard of Peruno District, home of the smelters, to that of Ilatan District in Talumaran, home of the battery plants, a loaded train taking about forty-three minutes; Lumalorai in its Ivuran name means 'line of goods'. The line is a sealed low-vacuum tube at about a tenth of atmospheric pressure, in which the capsules float along by electromagnetic suspension with no wheels and no overhead line; it runs on a guideway of its own and shares no track with any wheeled line. It is worked entirely by driverless Laterite 600 heavy-haul trains running at 600 km/h, each of 80 capsules carrying 6,400 t, eight loaded trains a day and some 19 million tonnes of ore and nickel products a year. Its grades are 12‰ at most, and bridges and tunnels make up about half the line: the Horatan Viaduct, about 94 km long, is the longest railway bridge in the world, and the Unokesu Mountains Tunnel, about 63 km, the longest tunnel in the territory.\nThe capsules are often coated with ochre laterite as they load at the mines, and they pass through a wash gate before entering the tube, so miners say the trains need \"washing off the red\" too. The trains in the tube make almost no sound; all anyone along the line sees is the row of lights on the tube coming on one after another across the valley at fixed times, and villagers need no clock: when the lights go by, it is time for lunch."
    background:
      zh: 乌诺凯苏山脉中的红土镍矿是领地最大的矿产，矿石要先到佩鲁诺区冶炼成电池级的镍盐，再运往塔卢马兰伊拉坦区的电池厂。山区公路坡陡弯急，大批矿车既慢又扰民。领地修建了这条重载铁路，以长隧道直穿乌诺凯苏山脉，以长桥跨过霍拉坦的河谷，线路坡度平缓，矿区、冶炼厂和电池厂由此连成一条完整的产业链。早年重载列车有一段走塔纳高速铁路的轨道；改为在低真空管道里悬浮运行的货运舱后，线路另建了全程独立的导轨，列车也换成了时速 600 公里、无人驾驶的红土 600 型。矿粉和噪声都封在管道里，矿区的山坡上不必再修运矿公路，开采后的山地也更容易复绿。
      en: The laterite nickel of the Unokesu Mountains is the territory's largest mineral resource; the ore is first smelted into battery-grade nickel salts in Peruno District and then sent to the battery plants of Ilatan District in Talumaran. The mountain roads are steep and winding, and long convoys of ore lorries were slow and a nuisance to the towns. The territory built this heavy-haul railway, driving straight through the Unokesu Mountains in a long tunnel and across the Horatan valley on a long bridge at gentle grades, so that mines, smelters and battery plants form a single chain. In its early years the heavy-haul trains ran over part of the Talumaran–Nalumai High-Speed Railway; once the line became capsules floating in a low-vacuum tube it was given a guideway of its own the whole way, and its trains became the driverless, 600 km/h Laterite 600. The tube keeps the ore dust and the noise inside, no haul roads need be cut across the mining slopes, and the worked-out hillsides are easier to replant.
