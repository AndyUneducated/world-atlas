# Railways of the Arctic Ocean Territory.
#
# network: intercity_rail (高速铁路 or 磁悬浮) or freight_rail (重载铁路: capsule trains in a vacuum tube, goods
#   only, on a guideway of their own and stopping at freight yards of their own; named
#   ……真空磁悬浮重载铁路). The other fields are those of world/transport/cn-nv-rail.yaml.
# A freight line's tech also names its train (wagons, net tonnes a train) and the loaded trains
#   a day, from which the card works out the freight carried a year.
railways:
  - id: rte_7nyk0m
    network: intercity_rail
    maglev: true
    status: generated
    names:
      zh: 西卢阿真空磁悬浮
      en: Sillua Vacuum Maglev
      art-x-tavrunaq: Sillua Sukkapirri
    wonder:
      structure: snow_shed
      zh: 世界最长的铁路防雪棚，长约 58 公里
      en: The longest railway snow shed in the world, about 58 km
    notes:
      zh: "西卢阿真空磁悬浮全长约 1345 公里，自西向东经图利瓦克、萨尔瓦克、首府努卡塔克到乌库拉克，只设四座车站，最快一小时四十五分钟跑完全程。导轨全线封在低真空管道里，管内气压约为大气压的十分之一，车站以气闸和管道相接；列车为极光 800 型，十节编组、620 座，高温超导电动悬浮、长定子直线同步电机驱动，运营时速 800 公里，全自动无人驾驶。高峰每 30 分钟一班，每年运送约 250 万人次。线路有约 85 公里桥梁、17 公里隧道和 373 公里防雪棚：萨尔努卡高架桥长约 15 公里，普拉苏瓦米乌特隧道长约 4 公里，尼尔萨瓦克防雪棚长约 58 公里，是世界上最长的铁路防雪棚。冻土路段的管道支墩以桩基和热棒稳定地基，最大坡度 55.9‰。\n四座车站都在城市中心：图利瓦克站在图利亚利维克区，萨尔瓦克站在萨尔努卡区，努卡塔克站在首府的库马尔维克区，是领地的铁路总站，乌库拉克站在乌库努卡区。防雪棚是罩在管道外的钢筋混凝土长廊，迎风一侧封闭，背风一侧留着通风口，暴风雪来时积雪落在棚顶和棚外，管道和旁边的检修通道始终干净；长约 58 公里的尼尔萨瓦克防雪棚以首府西北的尼尔萨瓦克区为名，护着全线风最大的一段。全线双线，最小曲线半径 12 公里，设计时速 850 公里，悬浮间隙 100 毫米，跨河桥梁 24 座；升级工程投资约 2560 亿美元，每年维护费约 27.6 亿美元，由北冰洋领地铁路公司运营。\n本地人仍管它叫「极光快车」：管道里看不见外面，车窗换成了屏幕，实时放映管道外的天空，极夜里屏幕上常有极光，列车广播一提醒「左侧屏幕上有极光」，整节车厢的人还是习惯挤到一侧去看。乘务员推着小车送热浆果茶，回光节那天的头班车上，每位乘客还会领到一张印着太阳的车票。"
      en: "The Sillua Vacuum Maglev runs about 1,345 km from west to east through Tullivaq, Saarvaq and the capital Nuqattaaq to Ukkulaaq, with only four stations, the fastest trains covering it in an hour and three quarters. The whole guideway is sealed in a low-vacuum tube at about a tenth of atmospheric pressure, and the stations join the tube through airlocks; its Aurora 800 trains of ten cars and 620 seats float by high-temperature superconducting electrodynamic suspension and are driven by a long-stator linear synchronous motor at 800 km/h, fully automatic and driverless. At peak times there is a train every 30 minutes, carrying some 2.5 million passengers a year. The line has about 85 km of bridges, 17 km of tunnels and 373 km of snow sheds; the Saarnuqa Viaduct is about 15 km long, the Pullasuvvamiut Tunnel about 4 km, and the Nirsavaq Snow Shed, about 58 km, is the longest railway snow shed in the world. On permafrost the tube's piers stand on piles and thermosyphons, and its grades reach 55.9‰.\nAll four stations are in city centres: Tullivaq Station in Tullijaalivik District, Saarvaq Station in Saarnuqa District, Nuqattaaq Station in Qummarvik District in the capital, the territory's rail terminus, and Ukkulaaq Station in Ukkunuqa District. The snow sheds are long reinforced-concrete galleries over the tube, closed on the windward side and vented on the lee side, so that in a blizzard the snow settles on the roof and outside while the tube and the maintenance walkway beside it stay clear; the Nirsavaq Snow Shed, about 58 km long and named after Nirsavaq District north-west of the capital, guards the windiest stretch of the line. The line is double-tracked, with a minimum curve radius of 12 km, a design speed of 850 km/h, a levitation gap of 100 mm and 24 river bridges; the upgrade cost some 256 billion US dollars, upkeep runs to about 2.76 billion a year, and Arctic Ocean Railways operates it.\nLocals still call it \"the aurora express\": nothing outside can be seen from the tube, so the windows are screens showing the sky outside, the aurora is often on them in the polar night, and when the announcement says \"aurora on the left-hand screens\" the whole carriage still crowds over to that side. Attendants come round with hot berry tea, and on the first train of the Return of the Light every passenger is given a ticket printed with a sun."
    background:
      zh: 北冰洋领地的大城市都在南岸，图利瓦克、萨尔瓦克、首府努卡塔克和乌库拉克之间相距数百公里，冬季极夜漫长、暴风雪频繁，公路时常封闭，航班也会因能见度停飞。领地最初在南岸修建了一条时速 350 公里的西卢阿高速铁路，作为恶劣天气里也能运行的主干。领地富裕起来以后，决定把它升级为真空磁悬浮：密封的管道把暴风雪和积雪挡在外面，不必再给道岔和接触网融冰，首尾之间的车程也从四个多小时缩短到不到两小时。新导轨能爬更陡的坡，峡湾口和河口以长桥跨过，山嘴以隧道穿过，风口路段的管道外再罩上防雪棚，建在冻土上的路段以桩基和热棒稳定地基。升级后，南岸城市之间的航班大多停飞，极夜里乘客也能准点到达。
      en: "The large cities of the Arctic Ocean Territory all lie on the south coast, and Tullivaq, Saarvaq, the capital Nuqattaaq and Ukkulaaq are hundreds of kilometres apart. Winter brings a long polar night and frequent blizzards, the roads often close and flights are grounded when visibility fails. The territory first built the Sillua High-Speed Railway along the south coast at 350 km/h, a trunk line that kept running in bad weather. Once the territory had grown rich it decided to rebuild it as a vacuum maglev: the sealed tube keeps blizzards and drifting snow out, there are no points or overhead line to de-ice, and the journey from end to end fell from over four hours to under two. The new guideway can take steeper grades; it crosses fjord mouths and river mouths on long bridges and passes headlands in tunnels, the tube is roofed with snow sheds on the windiest stretches, and where it stands on permafrost the ground is held by piles and thermosyphons. Since the upgrade most flights between the south-coast cities have stopped, and passengers arrive on time even in the polar night."
    color: '#1F8FD6'
    tech:
      operating_speed_kmh: 800
      design_speed_kmh: 850
      train: { names: { zh: 极光 800 型, en: Aurora 800}, seats: 620 }
    via: [div_aggzhy, div_nbf1bw, div_8besy9, div_dfmj5f]
  - id: rte_x0kyvk
    network: freight_rail
    status: generated
    names:
      zh: 乌库利特真空磁悬浮重载铁路
      en: Ukkuliit Vacuum Maglev Heavy-Haul Railway
      art-x-tavrunaq: Ukkuliit Usirpirri
    notes:
      zh: "乌库利特真空磁悬浮重载铁路全长约 465 公里，自乌库利特矿区管理区的货运站经伊卢克萨特货运站到首府的伊马萨尔维克货运站，矿石在港口直接装船，满载列车全程约四十七分钟。线路是一条密封的低真空管道，管内气压约为大气压的十分之一，货运舱以常导电磁悬浮在管道里前进，不用车轮，也不怕道岔结冰和轨道积雪；它有自己的导轨，不与任何轮轨线路共用线位。全线由无人驾驶的冰原 600 型重载列车运行，运营时速 600 公里，每列 100 节货运舱、载货 1 万吨，每天发出 10 列满载列车，每年运出约 3600 万吨矿石。线路坡度平缓，最大坡度 12‰，有约 126 公里桥梁、77 公里隧道和 93 公里防雪棚：尼尔萨库特特大桥长约 34 公里，考卢卡特丘陵隧道长约 21 公里，是领地最长的隧道，伊卢克图克防雪棚长约 18 公里。\n牧民把这条不鸣笛、不停站的长管道叫作「不说话的长蛇」。管道在每一条驯鹿迁徙通道上都架高到离地五米，驯鹿从下面走过，列车从上面通过，谁也不用等谁；春秋迁徙季的夜里，调度中心仍会把管道上的灯带调暗，免得惊着驯鹿。"
      en: "The Ukkuliit Vacuum Maglev Heavy-Haul Railway runs about 465 km from the freight yard of the Ukkuliit Mining Administration Zone through Illuqsaat to the Immasaarvik freight yard in the capital, where the ore goes straight onto ships; a loaded train takes about forty-seven minutes. The line is a sealed low-vacuum tube at about a tenth of atmospheric pressure, in which the capsules float along by electromagnetic suspension with no wheels, untroubled by frozen points or snow on the track; it runs on a guideway of its own and shares no track with any wheeled line. It is worked entirely by driverless Icefield 600 heavy-haul trains running at 600 km/h, each of 100 capsules carrying 10,000 t, ten loaded trains a day and some 36 million tonnes of ore a year. It keeps to gentle gradients, 12‰ at most, with about 126 km of bridges, 77 km of tunnels and 93 km of snow sheds; the Nirsakut Viaduct is about 34 km long, the Qaulukkat Hills Tunnel, about 21 km, is the longest tunnel in the territory, and the Illuqtuuq Snow Shed is about 18 km long.\nHerders call this long tube that neither whistles nor stops \"the snake that doesn't talk\". Over every reindeer migration path the tube is raised five metres off the ground, so the reindeer walk underneath while the trains pass overhead and nobody waits for anybody; on migration nights in spring and autumn the control centre still dims the light strip along the tube so as not to startle the herds."
    background:
      zh: 考尔尼克市的内陆矿区出产锂、镍和钻石，过去矿石只能在冬季用卡车车队沿冰路运出，春季冰路解冻后矿山就要停运或囤货。领地修建了这条重载铁路，自乌库利特矿区管理区出发，经伊卢克萨特区到首府的伊马萨尔维克区，矿石在港口直接装船出口。线路坡度平缓，以考卢卡特丘陵隧道等长隧道穿过丘陵，冻土路段以热棒和保温路基防止融沉，风口加建防雪棚。货运舱在低真空管道里悬浮运行、无人驾驶，调度中心设在伊马萨尔维克，管道把暴风雪挡在外面，列车在极夜和暴风雪中照常发车，矿山因此可以全年生产。后来列车从时速 200 公里的冰原 200 型换成了时速 600 公里的冰原 600 型，满载列车从矿区到港口不到一小时。
      en: The Ukkuliit Mining Administration Zone of Qaurniq City produces lithium, nickel and diamonds, and its ore used to leave only by lorry convoy on winter ice roads; when the ice roads thawed in spring the mines had to stop or stockpile. The territory built this heavy-haul railway from the mining zone through Illuqsaat District to Immasaarvik District in the capital, where the ore goes straight onto ships. The line keeps to gentle gradients, passing the hills in long tunnels such as the Qaulukkat Hills Tunnel; on permafrost it stands on thermosyphons and insulated embankment to keep the ground from thawing, and snow sheds cover its windiest stretches. Its driverless capsule trains float along a low-vacuum tube, controlled from Immasaarvik; the tube keeps the blizzards out, the trains run through the polar night and through storms, and so the mines can produce all year. The 200 km/h Icefield 200 trains have since given way to the 600 km/h Icefield 600, and a loaded train now reaches the port from the mines in under an hour.
    color: '#8C6B4A'
    tech:
      operating_speed_kmh: 600
      design_speed_kmh: 650
      train: { names: { zh: 冰原 600 型重载列车, en: Icefield 600 heavy-haul train}, wagons: 100, net_t: 10000 }
      loaded_trains_per_day: 10
    via: [div_m541k8, div_qaxzqj, div_jvwq60]
