    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 编号错误领道
      en: Misnumbered Road
      es: Carretera Mal Numerada
    notes:
      zh: "编号错误领道全长约 6 公里，全在贝叶斯后验区的南部，把集装箱领道和空车领道接起来，开完全程两三分钟。沿线没有一段算城区，全线双向八车道、不限速，最大坡度约 13‰，没有桥梁和隧道。日均车流约 6400 辆。\n路牌厂每年都会寄来一份更正建议，给 238 换一个「更合理」的编号，每年建议的编号都不一样；领道局把这些建议钉在办公室的墙上，如今已经钉满了一面墙，没有两份是一样的。附近的学校拿它出数学题：「238 号公路是从哪条主线分出来的？」标准答案是「此题无解」，答对的学生可以加分。"
      en: "The Misnumbered Road runs about 6 km, all in the south of Posterior District in Bayesian, linking the Container Road and the Empty Car Road, two or three minutes end to end. No stretch of it counts as urban, so it has four lanes each way and no speed limit anywhere, with grades of up to about 13‰ and no bridges or tunnels. It carries about 6,400 vehicles a day.\nEvery year the sign works send in a correction proposing a 'more sensible' number for 238, a different one each year; the State Roads Department pins them on its office wall, which is now covered, with no two alike. The nearby school uses it for a maths question, 'Which main line does Route 238 branch off?', to which the model answer is 'This question has no solution', and pupils who give it get extra marks."
    background:
      zh: 后验区南部一小段把集装箱领道和空车领道接起来的领道。按规矩，三位数的州际编号要从一条两位数的主线分出来，可全州根本没有 38 号公路。据说当年的编号是让模型填的，模型自信地填了 238，还附上一条规范引文，那条规范并不存在；议会后来决定不改了，因为要重印的路牌加起来比这条路还长。
      en: "A short state road in the south of Posterior District linking the Container Road and the Empty Car Road. By the rules, a three-digit Interstate number branches off a two-digit main line, but the state has no Route 38 at all. It is said the number was filled in by a model, which confidently wrote 238 and added a citation to a standard that does not exist; the legislature later decided to leave it, because the signs that would need reprinting would, laid end to end, be longer than the road."
