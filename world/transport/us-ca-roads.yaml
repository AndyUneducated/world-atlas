    class: primary
    status: generated
    names:
      zh: 延迟领道
      en: Latency Road
      es: Carretera de la Latencia
    notes:
      zh: "延迟领道全长约 116 公里，自斯塔克顿的终点站区出发，向西经边际区三角洲边缘的低地和丘陵，到贝叶斯的后验区，开完全程将近一小时。沿线没有一段算城区，全线双向八车道、不限速，最大坡度只有约 8‰，跨过 2 条河，桥梁约 0.5 公里。日均车流 6100 到 8100 辆。\n领道局给全线做过一次「性能优化」，把限速牌全部撤掉，结果车速一点没变，因为瓶颈不在路上，而在出口的红绿灯；工程师们又给红绿灯加了缓存，现在每个路口都记得上一次是绿灯，于是下一次直接亮红灯。三角洲边缘涨潮时，路边的芦苇荡会漫到路肩，司机们说这时候的领道是被水「限流」了。"
      en: "The Latency Road runs about 116 km from Terminus District in Stuckton west through the lowlands and hills of Marginal District on the edge of the delta to Posterior District in Bayesian, nearly an hour end to end. No stretch of it counts as urban, so it has four lanes each way and no speed limit anywhere, with grades of only about 8‰; it crosses two rivers on about 0.5 km of bridges. It carries 6,100 to 8,100 vehicles a day.\nThe State Roads Department once gave the whole road a performance optimization, taking down every speed-limit sign, and the traffic went no faster at all, because the bottleneck is not the road but the traffic lights at the exits; the engineers then gave the lights a cache, so that every junction now remembers it was green last time and goes straight to red. When the tide is high on the edge of the delta the reed beds flood up to the hard shoulder, and drivers say the road is being rate-limited by the water."
    background:
      zh: 从后验区向东，经边际区的丘陵和低地通往三角洲边缘的领道。沿线的住宅区一片接一片地盖，路却总是慢一步，早高峰从头开到尾的时间，比用拨号上网下载一部电影还长。领道局在路边装了一块巨大的进度条，上面写着「您的通勤已完成 37%」，它从装好那天起就没动过。
      en: "The state road east from Posterior District through the hills and lowlands of Marginal District to the edge of the delta. Housing estates go up along it one after another and the road is always a step behind: at morning rush hour the drive from end to end takes longer than downloading a film over dial-up. The State Roads Department has put up a giant progress bar by the road reading 'Your commute is 37% complete', and it has not moved since the day it was installed."
