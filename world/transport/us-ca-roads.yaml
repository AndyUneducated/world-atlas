  - id: rte_hm5b75
    ref: SR-82
    build_order: 26
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 遗留领道
      en: Legacy Road
      es: Carretera Heredada
    notes:
      zh: "遗留领道全长约 67 公里，自圣克拉拉区出发，沿半岛湾边的平地经似然谷区北上，到贝叶斯的先验区，开完全程理论上约半小时。沿线没有一段算城区，按领道的规矩全线双向八车道、不限速，最大坡度约 36‰，没有桥梁和隧道；可红绿灯一个接一个，从来没有人在这条路上开到过 60 公里。日均车流 6100 到 6600 辆。\n沿街的卷饼店按红绿灯的节奏做生意：红灯一亮，店员就把卷饼递进车窗，绿灯亮之前收好钱，熟练的店员一个红灯能做三单。领道局试过把全线的红绿灯交给人工智能统一调度，模型算了三天，给出的最优方案是把所有灯都设成红灯，理由是这样「事故率为零」。"
      en: "The Legacy Road runs about 67 km from Santa Clara District north along the flat bayside of the peninsula through Likelihood Valley to Prior District in Bayesian, in theory about half an hour end to end. No stretch of it counts as urban, so by the rules for state roads it has four lanes each way and no speed limit anywhere, with grades of up to about 36‰ and no bridges or tunnels; but the traffic lights come one after another, and no one has ever reached 60 km/h on it. It carries 6,100 to 6,600 vehicles a day.\nThe burrito stands along it trade to the rhythm of the lights: when one turns red the staff pass a burrito in through the car window and take the money before it turns green, and a practised hand can serve three orders in one red light. The State Roads Department once tried handing all its lights to a single AI; the model worked for three days and found the optimal plan was to set every light to red, since that way 'the accident rate is zero'."
    background:
      zh: 旧传教士小道本身：从圣何塞经圣克拉拉区和似然谷区一直通到先验区，比旁边所有的领道都老，名义上是领道，实际上是一条红绿灯一个接一个的大街。它就像一段没人敢动的遗留代码：人人都知道它慢，人人都说要重构，可沿街几百家小店、汽车旅馆和卷饼店全靠它活着，谁也不敢删。每隔几年就有人提交一份「彻底重写」的方案，审查到一半，提案人自己先跳槽了。
      en: "The old mission trail itself: from San Jose through Santa Clara District and Likelihood Valley all the way to Prior District, older than every state road beside it, a state highway in name and in fact a street with one set of traffic lights after another. It is like a stretch of legacy code that no one dares touch: everyone knows it is slow and everyone says it should be refactored, but hundreds of small shops, motels and burrito stands along it live off it, and nobody dares delete it. Every few years someone submits a plan to 'rewrite it from scratch', and halfway through the review the author leaves for another company."
