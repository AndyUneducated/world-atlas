  - id: rte_ysjp19
    ref: SR-24
    build_order: 24
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 隧道视野领道
      en: Tunnel Vision Road
      es: Carretera de la Visión de Túnel
    notes:
      zh: "隧道视野领道全长约 22 公里，全在贝叶斯的后验区，自市区向东到山后的谷地，开完全程约十分钟。沿线没有一段算城区，全线双向八车道、不限速，最大坡度只有约 7‰，没有桥梁；名字里有隧道，路上却没有隧道。日均车流约 6400 辆。\n路边那座不通车的隧道口如今成了网红打卡点，人们站在洞口前拍照，假装自己刚从山里开出来；领道局后来在洞口里面贴了一张山的照片，好让照片更逼真。山后谷地的学区排名每年公布一次，公布那天路上挤满了开去看房的车，看完房价开回来时，车速明显慢了许多。"
      en: "The Tunnel Vision Road runs about 22 km, all in Posterior District in Bayesian, east from the city to the valleys behind the hills, about ten minutes end to end. No stretch of it counts as urban, so it has four lanes each way and no speed limit anywhere, with grades of only about 7‰, and it has no bridges, nor, for all its name, any tunnel. It carries about 6,400 vehicles a day.\nThe tunnel mouth by the road, which leads nowhere, has become a selfie spot where people pose as if they had just driven out of the mountain; the State Roads Department later pasted a photograph of a mountain inside it to make the pictures more convincing. The school-district rankings for the valleys behind the hills come out once a year, and on that day the road fills with people driving out to view houses; on the way back, having seen the prices, they drive noticeably slower."
    background:
      zh: 从后验区的市区出发，向东通往山后谷地的领道。规划图上画着一条穿过东湾山脊的长隧道，工程队开到现场才发现，按最新的高程数据这里的山矮得不值得挖，隧道于是没有修，只在路边立了一座水泥的隧道口，车从旁边绕过去。路这头是雾，那头是太阳，出发时开雨刮器，到了戴墨镜。这头的人说山后的人眼里只有学区，山后的人说隧道这头的人眼里只有自己的创业项目，这条路因此得名。
      en: "The state road from the city in Posterior District east to the valleys behind the hills. The plans showed a long tunnel under the East Bay ridge, but when the crews arrived they found that by the latest elevation data the hills were too low to be worth boring, so the tunnel was never built; only a concrete tunnel mouth stands by the road, and the cars drive round it. At one end there is fog and at the other sunshine, so drivers set off with the wipers on and arrive in sunglasses. People on this side say those behind the hills can see nothing but school districts, those behind the hills say people on this side can see nothing but their own start-ups, and that is how the road got its name."
    shield: lighthouse
