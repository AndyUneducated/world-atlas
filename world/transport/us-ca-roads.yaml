  - id: rte_62gec5
    ref: SR-99
    build_order: 4
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 杏仁领道
      en: Almond Road
      es: Carretera del Almendro
    notes:
      zh: "杏仁领道全长约 500 公里，自巴雷尔斯菲尔德的井口区出发，经阿尔蒙多的果仁区、斯塔克顿的谦逊区和终点站区，到萨克拉钱托的蔓延维尔区，开完全程将近四小时。全线在渴谷的平地上，双向八车道，城区限速 120 公里，乡村路段不限速，最大坡度只有约 8‰；沿途跨过 23 条河和灌渠，桥梁共约 6 公里。日均车流 9000 到 22000 辆，收获季的货车最多。\n每年早春杏仁花开的时候，几十万箱蜜蜂被卡车从全州各地运来授粉，路上的蜂箱车一辆接一辆，司机们说那几个星期挡风玻璃上全是蜜蜂，雨刮器刮一下，蜂蜜就抹开一片。农场主们最近改用无人机授粉，结果无人机和蜜蜂在花丛里打了起来，保险公司至今没想好这算哪一类事故。"
      en: "The Almond Road runs about 500 km from Wellhead District in Barrelsfield through Kernel District in Almondo, Modestly and Terminus in Stuckton to Sprawlville District in Sacramoney, nearly four hours end to end. It runs on the flat floor of the valley with four lanes each way, a limit of 120 km/h in towns and none on rural stretches, and grades of only about 8‰; it crosses 23 rivers and canals on about 6 km of bridges. It carries 9,000 to 22,000 vehicles a day, with most lorries in the harvest.\nEvery early spring, when the almonds blossom, hundreds of thousands of hives are trucked in from all over the state to pollinate them; the beehive lorries follow one another down the road, and drivers say that for those few weeks their windscreens are covered in bees and every sweep of the wipers smears honey. The growers lately switched to pollinating drones, only for the drones and the bees to start fighting in the blossom, and the insurers have yet to decide what kind of accident that is."
    background:
      zh: 中央渴谷东缘的农业领道，从巴雷尔斯菲尔德向北经阿尔蒙多、谦逊区和斯塔克顿到萨克拉钱托城郊，单调领道绕开的农业城镇都在这条路上。路两边是一眼望不到头的杏仁园，杏仁树喝掉的水比全州所有城市加起来还多，收获季节满载杏仁的卡车一辆接一辆。州移民与海关执法局在路上设了几座固定检查站，奇怪的是每到收获季检查站就会「系统维护」，收获季一过又准时恢复。
      en: "The farm highway along the eastern edge of the Central Valley, north from Barrelsfield through Almondo, Modestly and Stuckton to the outskirts of Sacramoney; the farm towns that the Monotony Road avoided all lie on it. On both sides are almond orchards as far as the eye can see, trees that drink more water than every city in the state together, and in the harvest season lorries loaded with almonds follow one another nose to tail. The State Immigration and Customs Enforcement Agency keeps several fixed checkpoints on it; oddly, every harvest season they go down for 'system maintenance', and they come back on time the day the harvest ends."
    shield: almond
    via: [div_zs0myf, div_r0qhbd, div_tnbcec, div_zqpg46, div_0aep50]  # wellhead – kernel – modestly – terminus – sprawlville
  - id: rte_1xsdj8
    ref: I-80
    build_order: 5
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 堵车领道
      en: Gridlock Road
      es: Carretera del Atasco
    notes:
      zh: "堵车领道全长约 330 公里，自贝叶斯的先验区跨过海湾到后验区，沿海湾东岸经边际区、梅洛特的赤霞珠丘区、首府萨克拉钱托的游说区和蔓延维尔区，翻过估值山脉北段的堵车山口到木屋区，开完全程约两个半小时。全线双向八车道，城区限速 120 公里，乡村路段不限速，上山一段最大坡度约 60‰；桥梁共约 26 公里，最长的后验特大桥约 12 公里，从半岛跨海到后验区。日均车流 6200 到 18000 辆。\n如今全线最堵的不是山口，而是周五傍晚的游说区出口：州议会一散会，议员和说客的车一齐开出来，去木屋区的湖边别墅过周末，排在最前面的往往是同一位说客的三辆车，每辆车里坐着一个党派的议员。后验特大桥上的机器人出租车夜里也成串地跑，桥灯和车灯连成两条线，湾区剩下的人管这叫「空城的心电图」。"
      en: "The Gridlock Road runs about 330 km from Prior District in Bayesian across the bay to Posterior, along the eastern shore of the bay through Marginal District, Cabernet Hills in Merlotte and Lobbyton and Sprawlville in the capital Sacramoney, and over Gridlock Pass in the northern Sierra Valuation to Chalet District, about two and a half hours end to end. It has four lanes each way, a limit of 120 km/h in towns and none on rural stretches, and grades of up to about 60‰ on the climb; it has about 26 km of bridges, the longest being the Posterior Sea Bridge, about 12 km, from the peninsula across the water to Posterior. It carries 6,200 to 18,000 vehicles a day.\nThe worst jam on the road now is not at the pass but at the Lobbyton exit on Friday evenings, when the legislature rises and the members and lobbyists all drive out at once for their lakeside houses in Chalet District; at the front of the queue there are often three cars belonging to one lobbyist, each carrying members of a different party. At night the robotaxis run in strings over the Posterior Sea Bridge, and with the bridge lights the headlamps make two lines that the Bay's last residents call 'the empty city's heartbeat'."
    background:
      zh: 从湾区的先验区出发，跨过海湾到后验区，再经赤霞珠丘和首府萨克拉钱托翻过堵车山口，通到山上的木屋区。湾区还住满人的时候，这是全州最堵的路，跨湾的后验特大桥上每天排着几十万辆车；如今桥上跑的大多是没有乘客的机器人出租车和运服务器的货车，堵车的名声却留了下来。冬天的周末，湾区的自动驾驶越野车和萨克拉钱托的人一齐上山滑雪，山口前的队伍能排八个小时，路边的小贩卖热可可、防滑链和「堵车保险」。
      en: "From Prior District in the Bay across the water to Posterior, then by way of Cabernet Hills and the capital Sacramoney over Gridlock Pass to Chalet District in the mountains. When the Bay was still full of people this was the most congested road in the state, with hundreds of thousands of cars queuing on the Posterior Sea Bridge across the bay every day; today the bridge carries mostly passengerless robotaxis and lorries full of servers, but the reputation has stuck. On winter weekends the Bay's self-driving SUVs and the people of Sacramoney all go up to ski at once, the queue before the pass can last eight hours, and roadside sellers offer hot chocolate, snow chains and 'traffic-jam insurance'."
    shield: snowflake
    line: { to: div_jytczs, points: [[105.83, 253.73], [105.79, 253.96], [105.83, 254.09], [106.29, 254.5], [107.19, 255.53], [107.41, 255.7], [107.62, 255.8], [108.45, 255.94], [108.7, 256.01], [109.09, 256.06], [109.31, 256.14], [109.37, 256.21], [109.38, 256.28], [109.3, 256.52], [108.99, 258.28], [108.97, 258.45], [109.02, 258.75], [108.94, 258.99], [108.75, 259.4], [108.74, 259.8], [108.5, 260.28], [108.48, 260.37], [108.58, 260.68], [108.39, 261.32], [108.46, 261.45], [108.69, 261.64], [108.88, 262.27], [109.01, 262.51], [109.22, 262.63], [109.64, 262.71], [109.8, 262.78], [111.04, 264.39], [111.77, 265.04], [111.79, 265.14], [111.77, 265.57], [111.58, 265.96], [111.56, 266.12], [111.68, 266.62], [111.71, 267.74], [112.12, 268.53], [112.18, 268.92], [112.4, 269.3], [112.9, 269.74], [113.03, 269.93], [113.27, 270.17], [113.55, 270.29], [113.64, 270.36], [113.89, 270.67], [114.36, 271.16], [115.01, 271.71], [115.31, 271.91], [116.75, 272.67], [116.83, 272.74], [117.95, 274.36], [118.0, 274.99], [118.06, 275.31], [118.29, 275.63], [118.63, 276.24], [118.76, 276.34], [119.69, 276.79], [121.53, 278.52]] }
    via: [div_0vf1b0, div_9tazhz, div_jytczs, div_ymeec8, div_0aep50, div_w1h5d7]  # prior – posterior – cabernet hills – lobbyton – sprawlville – chalet
  - id: rte_vpkqzb
    ref: I-10
    build_order: 6
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 仓储领道
      en: Warehouse Road
      es: Carretera de los Almacenes
    notes:
      zh: "仓储领道全长约 230 公里，自失落天使的破产中心区出发，经仓储帝国的托盘维尔区和无河区，翻过付费墙山脉东端的山口到帕姆斯普林克勒的喷灌区，开完全程约一小时五十分钟。全线双向八车道，城区限速 120 公里，乡村路段不限速，翻山一段最大坡度约 48‰，按海拔分段收费，几乎没有桥梁和隧道。日均车流 10000 到 28000 辆，大半是货车。\n无人货车在这条路上排成十几辆一串的车队，车距只有几米，人开的车很难插进去，想下领道的司机常常要在车队旁边并行好几公里才等到空当。仓储帝国的工人每天骑电动车沿辅路去仓库「补位」，他们说领道上跑的货比他们一年挣的钱还多，而且没有一件是给他们的。"
      en: "The Warehouse Road runs about 230 km from Downturn District in Lost Angeles through Palletville and Riverless in Warehouse Empire, over the pass at the east end of the Paywall Range to Sprinkler District in Palm Sprinklers, about an hour and fifty minutes end to end. It has four lanes each way, a limit of 120 km/h in towns and none on rural stretches, and grades of up to about 48‰ over the pass, which is tolled by altitude, with hardly any bridges or tunnels. It carries 10,000 to 28,000 vehicles a day, most of them lorries.\nThe driverless lorries run in platoons of a dozen or more, a few metres apart, so tightly that human drivers find it hard to cut in, and anyone wanting to leave the highway may have to run alongside a platoon for kilometres before a gap opens. Warehouse Empire's workers ride e-bikes along the service road each day to their 'fill-in' shifts at the warehouses, and say the goods on the highway are worth more than they earn in a year, and not one parcel is for them."
    background:
      zh: 从失落天使的破产中心区向东，经仓储帝国的托盘维尔区和无河区，翻过付费墙山脉东端的山口到帕姆斯普林克勒的绿洲城。港口卸下的集装箱沿这条路运进仓储帝国的仓库，再装上无人货车分发到全州，夜里路上的车灯连成一条看不到头的光带，车上一个司机也没有。东段穿过荒漠里的风口，路两边是一排排光伏板和风车，再往东就是喷灌区的高尔夫球场，荒漠里的草绿得不像真的。
      en: "East from Downturn District in Lost Angeles through Palletville and Riverless in Warehouse Empire, over the pass at the east end of the Paywall Range to the oasis city of Palm Sprinklers. The containers unloaded at the port travel up it to the warehouses of Warehouse Empire and leave again on driverless lorries for the rest of the state; at night their lights run together into a band with no end in sight, and not one of them has a driver. Its eastern stretch crosses the desert's windy gap between rows of solar panels and turbines, and beyond them lie the golf courses of Sprinkler District, grass greener than anything in a desert has a right to be."
    shield: parcel
    via: [div_jqddbd, div_sc80nv, div_aca2hs, div_g96sq9]  # downturn – palletville – riverless – sprinkler
  - id: rte_e3hdf1
    ref: I-15
    build_order: 7
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 次日达领道
      en: Next-Day Road
      es: Carretera de Entrega al Día Siguiente
    notes:
      zh: "次日达领道全长约 400 公里，自圣遣返的后山区出发，经仓储帝国的无河区和履约高漠区，到帕姆斯普林克勒的帝国尘区，开完全程约三小时十分钟。全线双向八车道，城区限速 120 公里，乡村路段不限速，最大坡度约 60‰；桥梁共约 2 公里、隧道约 11 公里，付费墙山脉隧道约 11.3 公里，按辆收费。日均车流 8500 到 24000 辆。\n付费墙山脉隧道的入口挂着一块倒计时牌，显示的不是离出口还有多远，而是离「次日」截止还有几个小时，货车司机看一眼就知道这一车能不能准时。隧道里每隔一公里有一个包裹急救站，专门收留从车上掉下来的快递，攒满一屋子就由无人机统一补送，备注栏写着「已送达（迟到）」。"
      en: "The Next-Day Road runs about 400 km from Backcountry District in San Deportes through Riverless and High Desert Fulfillment in Warehouse Empire to Imperial Dust District in Palm Sprinklers, about three hours ten minutes end to end. It has four lanes each way, a limit of 120 km/h in towns and none on rural stretches, and grades of up to about 60‰; it has about 2 km of bridges and 11 km of tunnels, and the Paywall Range Tunnel, about 11.3 km, is tolled by the vehicle. It carries 8,500 to 24,000 vehicles a day.\nA countdown board hangs over the mouth of the Paywall Range Tunnel, showing not how far it is to the other end but how many hours are left before the next-day deadline, so a lorry driver knows at a glance whether the load will make it. Every kilometre inside there is a parcel first-aid station for deliveries that fall off the lorries; when a room fills up, drones redeliver the lot, marked 'Delivered (late)'."
    background:
      zh: 从圣遣返背后的后山区向北经仓储帝国的无河区，在次日达山口东边穿过付费墙山脉到履约高漠区，再穿过荒漠通到东边的帝国尘区。它是仓储帝国的「后门」：从港口和南边来的货在无河区分拣，翻山送进高原荒漠上的物流基地，所有包裹都保证次日送达。老路走的是次日达山口，一下雪就封，包裹变成了「次次日达」，几家物流公司于是凑钱在山口旁边打了一条隧道，好让广告词继续成立。荒漠一段的天上飞满了送货无人机，司机们说开车时要小心的不是前面的车，而是从天上掉下来的包裹。
      en: "North from Backcountry District behind San Deportes through Riverless in Warehouse Empire, through the Paywall Range just east of Next-Day Pass to High Desert Fulfillment District, then across the desert to Imperial Dust District in the east. It is Warehouse Empire's back door: goods from the port and the south are sorted in Riverless and sent over the mountains to the logistics bases on the high desert, every parcel guaranteed to arrive the next day. The old road went by Next-Day Pass, which snow closes, turning next-day delivery into next-next-day delivery, so a few logistics companies clubbed together to bore a tunnel beside the pass and keep their slogan true. Over the desert stretch the sky is full of delivery drones, and drivers say the thing to watch out for is not the car in front but parcels falling from the sky."
    shield: drone
    legs:
      div_s76w0x: { tunnel_cost: 2.5 }   # straight over Next-Day Pass, not round by the basin
    via: [div_j1wv5r, div_aca2hs, div_s76w0x, div_4c9mhq]  # backcountry – riverless – high desert fulfillment – imperial dust
  - id: rte_k7akef
    ref: US-395
    build_order: 8
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 离线领道
      en: Offline Road
      es: Carretera Sin Conexión
    notes:
      zh: "离线领道全长约 750 公里，自仓储帝国的履约高漠区出发，沿估值山脉东麓经玛门的坏账谷区和雪道区、木屋区，到雷达克特的熔岩高原区，开完全程将近六小时。全线双向八车道，城区限速 120 公里，乡村路段不限速，最大坡度约 60‰；桥梁共约 18 公里、隧道约 19 公里，最长的塔克斯霍湖特大桥约 6.2 公里，从湖面上跨过，木屋隧道约 17.8 公里。日均车流 6500 到 9200 辆。\n全线唯一有信号的地方是木屋隧道：领道局在隧道里装了信号中继，好让出了事故的人能报警，结果司机们一进隧道就放慢车速回消息、刷新闻，隧道成了整条路唯一堵车的地方。出了隧道信号一断，车里常常有人「啊」地叫一声，本地人管这叫「二次离线」。"
      en: "The Offline Road runs about 750 km from High Desert Fulfillment District in Warehouse Empire along the eastern foot of the Sierra Valuation through Bad Debt Valley and Ski District in Mammon and Chalet District to the Lava Plateau in Redacted, nearly six hours end to end. It has four lanes each way, a limit of 120 km/h in towns and none on rural stretches, and grades of up to about 60‰; it has about 18 km of bridges and 19 km of tunnels, the longest being the Lake Taxhoe Bridge, about 6.2 km, across the lake, and the Chalet Tunnel, about 17.8 km. It carries 6,500 to 9,200 vehicles a day.\nThe one place on the road with a signal is the Chalet Tunnel: the State Roads Department put repeaters inside so that anyone in an accident could call for help, and now drivers slow down as soon as they enter to answer messages and scroll the news, making the tunnel the only place on the whole road with a traffic jam. When the signal drops at the far end someone in the car usually lets out a cry, which locals call 'going offline twice'."
    background:
      zh: 沿估值山脉东麓南北延伸的领道，从履约高漠区向北经坏账谷、雪道区和木屋区到北边的熔岩高原。山脉挡住了信号，沿线几百公里几乎没有手机网络，是全州唯一一条人工智能找不到你的路。湾区剩下的工程师每年都要来这里做「数字排毒」，在山脚的温泉里泡着，交换彼此还记得的、不靠模型的生活技能；路边加油站卖的纸质地图是全州最畅销的商品之一。
      en: "The highway along the eastern foot of the Sierra Valuation, north from High Desert Fulfillment through Bad Debt Valley, Ski District and Chalet District to the Lava Plateau. The range blocks the signal, and for hundreds of kilometres there is almost no mobile network: it is the one road in the state where artificial intelligence cannot find you. The Bay's remaining engineers come every year for a 'digital detox', soaking in the hot springs at the foot of the mountains and swapping life skills they still remember without a model; the paper maps sold at its filling stations are among the best-selling goods in the state."
    shield: peaks
    via: [div_s76w0x, div_9n9342, div_9fqezr, div_w1h5d7, div_j311rd]  # high desert fulfillment – bad debt valley – ski – chalet – lava plateau
  - id: rte_f9gvwk
    ref: SR-58
    build_order: 9
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 沉没成本领道
      en: Sunk Cost Road
      es: Carretera del Costo Hundido
    notes:
      zh: "沉没成本领道全长约 180 公里，自巴雷尔斯菲尔德的井口区出发，经压裂原区翻过特哈聊天山脉，到仓储帝国的履约高漠区，开完全程约一小时二十五分钟。全线双向八车道，城区限速 120 公里，乡村路段不限速，最大坡度约 36‰，桥梁不到 1 公里，没有隧道。日均车流 8000 到 16000 辆。\n压裂原一段两边的抽油机大多早已停产，石油公司走后，有一家初创公司把它们接上电机，让它们照旧上下点头，再按小时出租给拍「能源复兴」广告的摄制组。路边的收费站从来没有收过一分钱：建成时议会决定通车后再定收费标准，标准至今还在讨论，收费员每天照常上班。"
      en: "The Sunk Cost Road runs about 180 km from Wellhead District in Barrelsfield through the Fracklands and over the Tehachatbot Mountains to High Desert Fulfillment District in Warehouse Empire, about an hour and twenty-five minutes end to end. It has four lanes each way, a limit of 120 km/h in towns and none on rural stretches, and grades of up to about 36‰, with less than a kilometre of bridges and no tunnels. It carries 8,000 to 16,000 vehicles a day.\nMost of the pumpjacks along the Fracklands stretch stopped pumping long ago; after the oil company left, a start-up wired them to motors so that they keep nodding, and rents them by the hour to film crews shooting 'energy renaissance' commercials. The toll booths by the road have never taken a cent: when it opened the legislature decided to set the tolls once traffic was running, the tolls are still under discussion, and the toll collectors still come to work every day."
    background:
      zh: 从巴雷尔斯菲尔德的井口区向东，经压裂原区翻过特哈聊天山脉，到履约高漠区的荒漠。这条路原是为油田修的，石油公司说要在压裂原开出全州最大的新油田，州里出钱把路修成了双向八车道；路修好时油价跌了，公司撤走了，留下一排排还在点头的抽油机和一条宽得过分的路。议会后来几次讨论要不要继续投钱把它延伸到东海岸，每次的理由都是「已经花了这么多了」。
      en: "East from Wellhead District in Barrelsfield through the Fracklands and over the Tehachatbot Mountains to the desert of High Desert Fulfillment. It was built for the oil fields: an oil company said it would open the state's largest new field in the Fracklands, and the state paid to build the road four lanes each way; by the time it was finished the oil price had fallen and the company had left, leaving rows of nodding pumpjacks and a road far too wide for its traffic. The legislature has since debated several times whether to spend more extending it to the east coast, each time on the grounds that 'we have already spent so much'."
    shield: pumpjack
    via: [div_zs0myf, div_xfjrth, div_s76w0x]  # wellhead – fracklands – high desert fulfillment
  - id: rte_qah9bk
    ref: I-8
    build_order: 10
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 边墙领道
      en: Wall Road
      es: Carretera del Muro
    notes:
      zh: "边墙领道全长约 300 公里，自圣遣返的边界线区出发，贴着南海岸的钢墙向东，再折进边检山脉，经后山区到帕姆斯普林克勒的喷灌区，开完全程约两小时二十分钟。全线双向八车道，城区限速 120 公里，乡村路段不限速，最大坡度约 21‰，沿山谷绕行，没有桥梁和隧道。日均车流 9100 到 19000 辆。\n执法局把一座检查站修在了边检山脉山口的正中间，山路上不能掉头，上了山口的车只能一直开到检查站前排队；路边的灯杆上装着摄像头和扩音器，每隔几分钟用英语和西班牙语播一遍「请准备好您的证件」。山口下的谷地里住着几户牧场主，他们说一辈子没被查过证件，因为执法局的人从来不下山。"
      en: "The Wall Road runs about 300 km from Borderline District in San Deportes east along the steel wall on the south coast, then turns into the Checkpoint Range through Backcountry District to Sprinkler District in Palm Sprinklers, about two hours twenty minutes end to end. It has four lanes each way, a limit of 120 km/h in towns and none on rural stretches, and grades of up to about 21‰, winding round by the valleys with no bridges or tunnels. It carries 9,100 to 19,000 vehicles a day.\nThe Enforcement Agency built one of its checkpoints in the very middle of the pass through the Checkpoint Range, where there is no turning back, so every car on the climb has to drive on and queue for it; cameras and loudspeakers on the lamp posts repeat 'Please have your papers ready' in English and Spanish every few minutes. A few ranchers live in the valleys below, and they say they have never had their papers checked in their lives, because the Agency's officers never come down off the mountain."
    background:
      zh: 从圣遣返的边界线区出发，贴着南海岸的钢墙向东，再折进边检山脉到帕姆斯普林克勒的喷灌区。它是州移民与海关执法局的路：钢墙每加高一次，路就跟着拓宽一次，好让运钢板和巡逻车的卡车并排通过；山里一段每隔十几公里就有一座检查站，开完全程要停下来出示证件七八次。普通司机很少走这条路，路上跑的大多是执法局的车、运被拘押者的大巴和给检查站送盒饭的承包商。
      en: "From Borderline District in San Deportes east along the steel wall on the south coast, then into the Checkpoint Range to Sprinkler District in Palm Sprinklers. It is the road of the State Immigration and Customs Enforcement Agency: each time the wall is raised the road is widened too, so lorries of steel plate and patrol cars can pass side by side, and in the mountains there is a checkpoint every dozen kilometres or so, so that a driver shows papers seven or eight times on the way. Ordinary drivers seldom use it; its traffic is mostly enforcement vehicles, coaches carrying detainees and contractors delivering lunch boxes to the checkpoints."
    shield: wall
    via: [div_jmthr1, div_j1wv5r, div_g96sq9]  # borderline – backcountry – sprinkler
  - id: rte_283773
    ref: SR-299
    build_order: 11
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 绿雾领道
      en: Green Haze Road
      es: Carretera de la Neblina Verde
    notes:
      zh: "绿雾领道全长约 435 公里，自欧福利亚的谦卑湾区出发，穿过红木帘区的红杉林和河谷，经雷达克特的涂黑区上到熔岩高原区，开完全程约三小时二十分钟。沿线没有一段算城区，全线双向八车道、不限速，山区一段最大坡度约 60‰；沿途跨过 9 条河，桥梁共约 2.9 公里。日均车流 6500 到 9400 辆。\n红杉林里的小镇如今靠路边的「怀旧大麻博物馆」过活，博物馆里展出的是合法化以前的种植棚、偷运用的假油罐车和一辆被警察追了三个州的旧卡车，门票包含一包从荒漠温室进的货。滑坡的路段每年由同一家承包商抢修，他们在路边立了一块牌子：「感谢您的耐心，我们明年还会再来。」"
      en: "The Green Haze Road runs about 435 km from Humbled Bay District in Euphoria through the redwoods and river valleys of Redwood Curtain and Blackout District in Redacted up to the Lava Plateau, about three hours twenty minutes end to end. No stretch of it counts as urban, so it has four lanes each way and no speed limit anywhere, with grades of up to about 60‰ in the mountains; it crosses 9 rivers on about 2.9 km of bridges. It carries 6,500 to 9,400 vehicles a day.\nThe towns in the redwoods now live off the 'cannabis heritage museums' by the road, which display the growing sheds of the days before legalization, the fake tanker lorries used for smuggling and an old truck once chased by the police through three states, with a packet of desert-greenhouse produce included in the ticket. The stretches that slide are repaired every year by the same contractor, which has put up a sign by the road: 'Thank you for your patience. We'll be back next year.'"
    background:
      zh: 从北海岸的谦卑湾区向东，穿过红杉林和滑头河的河谷，翻山到雷达克特的涂黑区，再上到熔岩高原。合法化以前，林子深处的大麻从这条路运出去，路边的小镇因此富得流油；合法化以后，大麻改从荒漠的温室里运进来，小镇一个接一个空了，只剩下路名。河谷一段的山坡松软，一下雨就滑坡，路几乎每年都要断几次，修路的承包商是沿线少数还在赚钱的生意。
      en: "East from Humbled Bay on the north coast through the redwoods and the valley of the Slippery River, over the mountains to Blackout District in Redacted and up onto the Lava Plateau. Before legalization the cannabis of the deep forest left by this road and the towns along it grew rich; since then cannabis comes in the other way from the desert greenhouses, the towns have emptied one by one, and only the road's name is left. The slopes of the river valley are soft and slide whenever it rains, the road is cut several times nearly every year, and the contractors who repair it are among the few businesses along it still making money."
    shield: fir
    via: [div_taah7d, div_qayjg1, div_j311rd]  # humbled bay – blackout – lava plateau
  - id: rte_angvy2
    ref: I-580
    build_order: 12
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 空车领道
      en: Empty Car Road
      es: Carretera del Coche Vacío
    notes:
      zh: "空车领道全长约 230 公里，自海湾北岸的边际区出发，经风投湾跨海大桥到贝叶斯的后验区，再向东经边际区的冷却池和光伏场，翻过海湾东边的山丘到斯塔克顿的终点站区，开完全程约一小时四十五分钟。全线双向八车道，城区限速 120 公里，乡村路段不限速，最大坡度约 51‰；桥梁共约 10 公里，几乎全在约 9.1 公里长的风投湾跨海大桥上。日均车流 6100 到 13000 辆。\n领道局的计数器把每一辆机器人出租车都算作一辆车，所以车流数字看起来并不冷清，可路边加油站的店员说，他们已经三年没见过一个下车买咖啡的人了，加油站后来改成了机器人出租车的充电站，店员改行给充电桩擦屏幕。边际区一段的冷却池在冬天冒着白汽，起雾的早晨，空车的车灯在雾里排成长长的一串，像一支没人送行的送葬队伍。"
      en: "The Empty Car Road runs about 230 km from Marginal District on the north shore of the bay over the Venture Bay Bridge to Posterior District in Bayesian, then east past the cooling ponds and solar fields of Marginal District and over the hills east of the bay to Terminus District in Stuckton, about an hour and three quarters end to end. It has four lanes each way, a limit of 120 km/h in towns and none on rural stretches, and grades of up to about 51‰; of its roughly 10 km of bridges almost all is the Venture Bay Bridge, about 9.1 km long. It carries 6,100 to 13,000 vehicles a day.\nThe State Roads Department's counters count every robotaxi as a vehicle, so the figures hardly look deserted; but the attendants at the roadside filling station say they have not seen anyone get out to buy a coffee in three years. The station has since become a robotaxi charging depot, and its attendants now wipe the screens of the chargers. The cooling ponds of Marginal District steam in winter, and on foggy mornings the empty cars' lights stretch out through the mist in a long file, like a funeral procession with no mourners."
    background:
      zh: 从海湾北岸的边际区跨过风投湾到后验区，再向东经边际区的冷却池和光伏板，翻过海湾东边的山丘到斯塔克顿的终点站区。湾区还有人的时候，这是几十万人每天往返两三个小时的「超级通勤」路；如今通勤的人走光了，路上跑的是成千上万辆空着的机器人出租车，它们按预测需求在湾区和斯塔克顿之间来回巡游，等着接永远不会出现的乘客。斯塔克顿人管它们叫「幽灵车队」，在路边的山坡上能看到车灯排成两条一模一样的光带，一条往东，一条往西。
      en: "From Marginal District on the north shore of the bay across Venture Bay to Posterior District, then east past the cooling ponds and solar panels of Marginal District and over the hills east of the bay to Terminus District in Stuckton. When the Bay still had people this was the 'supercommute' that hundreds of thousands drove for two or three hours a day; now the commuters are gone and it carries thousands upon thousands of empty robotaxis, cruising between the Bay and Stuckton on predicted demand, waiting for passengers who never appear. Stuckton people call them the ghost fleet, and from the hillsides along the road their lights can be seen as two identical bands, one heading east and one west."
    shield: robotaxi
