  - id: rte_g3r84t
    ref: I-380
    build_order: 28
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 无处领道
      en: Road to Nowhere
      es: Carretera a Ninguna Parte
    notes:
      zh: "无处领道全长约 3 公里，全在贝叶斯的先验区，把门禁领道和广告牌领道接起来，开完全程一两分钟。沿线没有一段算城区，全线双向八车道、不限速，路面几乎是平的，没有桥梁和隧道。日均车流约 6500 辆。\n领道局每年都会收到几封来信，问这条路什么时候修到海边，回信用的是同一份模板：「感谢您的关注，该项目目前处于规划阶段。」这份模板已经用了很多年，信纸的抬头换过三次，正文一个字也没改。导航软件至今把它的西头标成「道路尽头」，提醒司机「前方道路尚未建成」，司机们看一眼窗外的门禁领道，照常开了过去。"
      en: "The Road to Nowhere runs about 3 km, all in Prior District in Bayesian, linking the Gatekeeper Road and the Billboard Road, a minute or two end to end. No stretch of it counts as urban, so it has four lanes each way and no speed limit anywhere; it is almost flat and has no bridges or tunnels. It carries about 6,500 vehicles a day.\nEvery year the State Roads Department receives a few letters asking when the road will reach the coast, and answers them all with the same template: 'Thank you for your interest. The project is currently at the planning stage.' The template has been in use for many years; its letterhead has changed three times and its text not by a word. Satnavs still mark the western end as a dead end and warn drivers that the road ahead has not been built, and drivers glance out at the Gatekeeper Road and carry straight on."
    background:
      zh: 门禁领道和广告牌领道之间的一小段领道。它原计划翻过半岛的山脊一直通到海边，修完头几公里后，护城河山区的业主们集体反对，工程就停在了那里；于是它两头都接着别的路，哪儿也不通。路牌上写着「通往海边」，后面用小字补了一句「理论上」。
      en: "A short state road between the Gatekeeper Road and the Billboard Road. It was meant to cross the ridge of the peninsula and run on to the sea, but after the first few kilometres the estate owners of Moat Hills objected as one and the works stopped there; so both its ends join other roads and it goes nowhere. Its signs read 'To the coast', followed in small print by 'in theory'."
    shield: compass
