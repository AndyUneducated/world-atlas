  - id: rte_9m7c9y
    ref: SR-84
    build_order: 23
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 备用链路领道
      en: Failover Road
      es: Carretera de Respaldo
    notes:
      zh: "备用链路领道全长约 84 公里，自海边的护城河山区出发，翻过半岛山脊经门禁高地区，下到似然谷区，跨过海湾南部到贝叶斯的后验区，再穿过峡谷到边际区，开完全程约四十分钟。全线双向八车道，城区限速 120 公里，乡村路段不限速，最大坡度约 60‰；桥梁共约 4 公里、隧道约 1.4 公里，最长的是跨海的备用跨海大桥，约 4 公里，和山里的护城河山隧道，约 0.7 公里。日均车流 6100 到 8100 辆。\n备用跨海大桥的收费站装着两套一模一样的系统，一套工作，一套待命；每年演练一次切换，那天两套系统会同时向每辆车各收一次钱，领道局称之为「数据一致性验证」，事后全额退款，退款要排队。护城河山隧道只有 0.7 公里，却装了三套照明、两套通风和一套备用的备用电源，隧道管理员说他最怕的不是停电，而是三套照明同时争着当主系统。"
      en: "The Failover Road runs about 84 km from Moat Hills on the coast over the ridge of the peninsula through Gated Heights, down to Likelihood Valley, across the south of the bay to Posterior District in Bayesian and through a canyon to Marginal District, about forty minutes end to end. It has four lanes each way, a limit of 120 km/h in towns and none on rural stretches, and grades of up to about 60‰; it has about 4 km of bridges and 1.4 km of tunnels, the longest being the Failover Bridge over the bay, about 4 km, and the Moat Hills Tunnel in the hills, about 0.7 km. It carries 6,100 to 8,100 vehicles a day.\nThe toll plaza on the Failover Bridge runs two identical systems, one live and one on standby; once a year they rehearse switching over, and that day both systems charge every car once each, which the State Roads Department calls a data-consistency check. Everything is refunded afterwards, but there is a queue for refunds. The Moat Hills Tunnel is only 0.7 km long, yet it has three lighting systems, two ventilation systems and a backup for its backup power, and its keeper says what he fears most is not a power cut but all three lighting systems fighting to be primary."
    background:
      zh: 从海边的护城河山区翻过山脊，经门禁高地区跨过海湾南部的长桥，再经后验区的南端穿过峡谷通往边际区的领道。它是湾区南部的备用链路：每当另一座大桥堵死，导航就把所有车切换到这里，于是这里也堵死，导航再把所有车切回去。工程师们称之为「高可用架构」，并指出它全年从未真正宕机，只是一直在切换。
      en: "The state road from Moat Hills on the coast over the ridge, through Gated Heights and across the long bridge in the south of the bay, through the southern end of Posterior District and a canyon to Marginal District. It is the southern Bay's failover link: whenever another bridge jams solid, the satnavs switch every car over here, so it jams solid too, and the satnavs switch every car back. Engineers call this a high-availability architecture and point out that it has never once gone down all year; it is only ever switching over."
    shield: anchor
    structure_names: { bridge: { zh: 备用跨海大桥, en: Failover Bridge } }
