  - id: rte_s652vm
    ref: SR-17
    build_order: 19
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 过拟合领道
      en: Overfit Road
      es: Carretera del Sobreajuste
    notes:
      zh: "过拟合领道全长约 39 公里，自海边与海景付费公路相接的地方出发，翻过半岛南端的山脉，经护城河山区和边际区，下到似然谷区的圣何塞一侧，开完全程约二十分钟。沿线没有一段算城区，全线双向八车道、不限速，翻山一段最大坡度约 60‰；只有一座约 0.7 公里的边际大桥。日均车流 6100 到 7600 辆，周五傍晚去海滩的车最多。\n自动驾驶车在这条路上也会「晕车」：它们的模型每过一个弯就要重新预测一次，开到山顶常常要在观景台停下来「冷却」几分钟。观景台的小卖部不卖纪念品，只卖晕车药、塑料袋和一种叫「验证集」的矿泉水，据说喝了以后，下山的路就没有上山时那么陡了。"
      en: "The Overfit Road runs about 39 km from its junction with the Pay-per-View Coast Road by the sea, over the mountains at the southern end of the peninsula through Moat Hills and Marginal District and down to the San Jose side of Likelihood Valley, about twenty minutes end to end. No stretch of it counts as urban, so it has four lanes each way and no speed limit anywhere, with grades of up to about 60‰ over the mountains; its one bridge is the Marginal Viaduct, about 0.7 km. It carries 6,100 to 7,600 vehicles a day, most of them on Friday evenings, heading for the beach.\nEven self-driving cars get carsick on it: their models must predict afresh at every bend, and at the summit they often have to stop at the viewpoint to cool down for a few minutes. The kiosk at the viewpoint sells no souvenirs, only travel-sickness pills, paper bags and a mineral water called Validation Set, which is said to make the road down feel less steep than the road up."
    background:
      zh: 从圣何塞一侧向西南翻过山脉、通往海边的领道，弯道一个接一个，每一座小山包都被它绕了一遍。据说规划时把地形数据交给模型，要它「贴合地形」，模型贴得太认真，把每一处起伏都学了进去：路修成以后，在训练集上表现完美，一到雨天和周五傍晚去海滩的车流里就一塌糊涂。沿线的加油站把晕车药摆在收银台最显眼的位置，旁边是一块牌子：「本店不提供正则化。」
      en: "The state road south-west from the San Jose side over the mountains towards the sea, one bend after another, winding round every last hillock. It is said that when it was planned the terrain data was given to a model with the instruction to 'fit the terrain', and the model fitted it so faithfully that it learned every bump: the finished road performed perfectly on the training set and falls apart in the rain and in the Friday-evening traffic to the beach. The filling stations along it keep travel-sickness pills in the most prominent spot by the till, beside a sign: 'We do not provide regularization.'"
