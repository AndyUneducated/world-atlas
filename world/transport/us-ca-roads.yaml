  - id: rte_cdkq01
    ref: SR-85
    build_order: 18
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 园区领道
      en: Campus Road
      es: Carretera del Campus
    notes:
      zh: "园区领道全长约 40 公里，自南圣何塞区的广告牌领道出发，绕着山脚向西北画了半个圈，经似然谷区的西南边缘，又回到广告牌领道，开完全程约二十分钟。沿线没有一段算城区，全线双向八车道、不限速，最大坡度约 52‰，没有桥梁和隧道。日均车流 6100 到 6200 辆。\n园区里的员工管这条路叫「绩效曲线」：起点和终点都在广告牌领道上，中间绕了一大圈，开完一趟回到差不多同一条路上，和每年的绩效评估一样。几家公司的班车每天早上在这条路上排成一列，车上有无线网、按摩椅和投影仪，员工们在车上就把一天的会开完了，到了公司反而无事可做，只好坐班车回家。"
      en: "The Campus Road runs about 40 km from the Billboard Road in South San Jose District, drawing half a circle north-west round the foot of the hills along the south-western edge of Likelihood Valley and back to the Billboard Road, about twenty minutes end to end. No stretch of it counts as urban, so it has four lanes each way and no speed limit anywhere, with grades of up to about 52‰ and no bridges or tunnels. It carries 6,100 to 6,200 vehicles a day.\nThe campus staff call it the performance curve: it starts and ends on the Billboard Road and goes a long way round in between, so that a full run brings you back to much the same road, just like the annual review. Every morning the shuttle buses of several companies line up on it, fitted with wifi, massage chairs and projectors; the staff get through the whole day's meetings on board, find nothing left to do when they reach the office, and take the shuttle home."
    background:
      zh: 沿着似然谷区西南边缘画了半个圈的领道，从广告牌领道出发，绕过山脚，又回到广告牌领道。它从几家大公司的园区背后经过，其中一家的总部是一个巨大的圆环，员工们说从天上看，这条领道正好是那个圆环被老板否掉的一版草稿。沿线的隔音墙修得格外高，据说是为了让路上的司机听不见园区里的产品发布会，免得分心。
      en: "The state road that draws half a circle round the south-western edge of Likelihood Valley, leaving the Billboard Road, skirting the foot of the hills and coming back to it. It passes behind the campuses of several large companies, one of whose headquarters is a giant ring, and its staff say that from the air the road looks exactly like a draft of that ring the boss turned down. Its sound walls are unusually high, said to be so that drivers can't hear the product launches on the campuses and lose concentration."
    shield: dome
