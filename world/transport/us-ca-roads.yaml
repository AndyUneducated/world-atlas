  - id: rte_53xp2j
    ref: SR-92
    build_order: 22
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 南瓜领道
      en: Pumpkin Road
      es: Carretera de la Calabaza
    notes:
      zh: "南瓜领道全长约 42 公里，自海边的护城河山区出发，翻过半岛山脊经门禁高地区，下到似然谷区，跨过海湾中部到贝叶斯的后验区，开完全程约二十分钟。全线双向八车道，城区限速 120 公里，乡村路段不限速，最大坡度约 20‰；中湾跨海大桥约 17.1 公里，仅次于单调领道的圣囤积河特大桥和融资窗口领道的雪道特大桥，是全州第三长的桥。日均车流 6200 到 8100 辆，南瓜节那个周末最多。\n每年秋天，冠军南瓜要装上卡车过桥进城展出，过桥前先在桥头过磅；南瓜一年比一年重，领道局的工程师每年都要把桥的承重重新算一遍，算完总是长出一口气：「今年还行。」桥中间的海面上常年停着几只鹈鹕，盯着桥上的车流看个不停，渔民们说它们是在给这座桥做尽职调查。"
      en: "The Pumpkin Road runs about 42 km from Moat Hills on the coast over the ridge of the peninsula through Gated Heights, down to Likelihood Valley and across the middle of the bay to Posterior District in Bayesian, about twenty minutes end to end. It has four lanes each way, a limit of 120 km/h in towns and none on rural stretches, and grades of up to about 20‰; the Mid-Bay Bridge, about 17.1 km, is the third-longest bridge in the state, after the San Hoarding River Bridge on the Monotony Road and the Ski Viaduct on the Funding Window Road. It carries 6,200 to 8,100 vehicles a day, most of them on the weekend of the pumpkin festival.\nEach autumn the champion pumpkin is trucked over the bridge to be shown in the city, and is weighed at the bridgehead first; the pumpkins grow heavier every year, so every year the State Roads Department's engineers recalculate the bridge's load limit and, when they have finished, breathe out: 'Fine for this year.' A few pelicans sit on the water mid-bay all year round, watching the traffic on the bridge without pause, and the fishermen say they are doing due diligence on it."
    background:
      zh: 从海边的护城河山区翻过半岛的山脊，跨过海湾中部的长桥，通往后验区的领道。海边小镇每年秋天办南瓜节，评选全州最重的南瓜，冠军南瓜比一辆小汽车还重；于是每到那个周末，山路上就堵满了去看南瓜的车，堵车的长度每年都破纪录，比南瓜破纪录还准时。领道局曾经提议用无人机把南瓜运到湾区展出，被小镇以「南瓜也需要隐私」为由拒绝。
      en: "The state road from Moat Hills on the coast over the ridge of the peninsula and across the long bridge in the middle of the bay to Posterior District. Every autumn the seaside town holds a pumpkin festival to crown the heaviest pumpkin in the state, and the winner outweighs a small car; so on that weekend the mountain road fills with people driving to see it, and the jam sets a new record every year, more reliably than the pumpkins do. The State Roads Department once proposed flying the pumpkin to the Bay by drone for display, and the town refused on the grounds that 'pumpkins need privacy too'."
