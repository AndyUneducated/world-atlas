    class: primary
    status: generated
    names:
      zh: 短路领道
      en: Short Circuit Road
      es: Carretera del Cortocircuito
    notes:
      zh: "短路领道全长约 3 公里，全在贝叶斯后验区的市中心，把集装箱领道和空车领道、隧道视野领道接起来，开完全程一两分钟。沿线没有一段算城区，全线双向八车道、不限速，路面几乎是平的，没有桥梁和隧道。日均车流约 6400 辆。\n每年都有新来的实习工程师提交工单，要求「修复这处短路」，工单会被系统自动关闭，标签是「按设计工作」；资深工程师们说，这是他们唯一一张从来不用开会讨论的工单。路边立着一块牌子：「这是已知问题，不是缺陷。」牌子下面有人用记号笔补了一行：「也不是功能。」"
      en: "The Short Circuit Road runs about 3 km, all in downtown Posterior District in Bayesian, linking the Container Road with the Empty Car Road and the Tunnel Vision Road, a minute or two end to end. No stretch of it counts as urban, so it has four lanes each way and no speed limit anywhere; it is almost flat and has no bridges or tunnels. It carries about 6,400 vehicles a day.\nEvery year a new intern engineer files a ticket asking for this short circuit to be fixed, and the system closes it automatically with the label 'working as designed'; the senior engineers say it is the only ticket they have never had to hold a meeting about. A sign by the road reads 'This is a known issue, not a bug', and underneath someone has added in marker pen: 'Not a feature either.'"
    background:
      zh: 后验区市中心的一小段领道，把集装箱领道和空车领道、隧道视野领道接起来。它原本规划要穿过整个东湾，修了几公里就没钱了，结果正好把几条领道短接在一起；工程师们说，这是全州唯一一处「设计失误刚好有用」的地方，并请求大家不要修复它。
      en: "A short state road in downtown Posterior District linking the Container Road with the Empty Car Road and the Tunnel Vision Road. It was planned to cross the whole East Bay, ran out of money after a few kilometres and happened to short-circuit several state roads together; engineers call it the one place in the state where a design fault turned out to be useful, and have asked everyone not to fix it."
    shield: crystal
