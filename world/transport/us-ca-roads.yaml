  - id: rte_j5spq7
    ref: I-680
    build_order: 17
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 归属期领道
      en: Vesting Road
      es: Carretera de la Consolidación
    notes:
      zh: "归属期领道全长约 123 公里，自海峡北边的边际区出发，跨过海峡，沿东湾山丘背后的谷地经后验区的郊外和边际区一路南下，到似然谷区的圣何塞一侧，开完全程约一小时。沿线没有一段算城区，全线双向八车道、不限速，最大坡度约 43‰；桥梁共约 6.5 公里，最长的边际特大桥约 6.2 公里，跨过海峡。日均车流 6100 到 6500 辆。\n边际特大桥两头各立着一块牌子，北头写着「悬崖期：一年」，南头写着「恭喜，您已归属 25%」，常有人为了拍这两块牌子特意过一趟桥。沿线的工程师们流行拼车上班，四个人一辆车，约好谁的期权先全部归属谁请喝咖啡；一年下来，请客的总是同一个人，因为另外三个早就辞职了。"
      en: "The Vesting Road runs about 123 km from Marginal District north of the strait, across the strait and south along the valleys behind the East Bay hills through the outskirts of Posterior District and Marginal District to the San Jose side of Likelihood Valley, about an hour end to end. No stretch of it counts as urban, so it has four lanes each way and no speed limit anywhere, with grades of up to about 43‰; it has about 6.5 km of bridges, the longest being the Marginal Sea Bridge, about 6.2 km, across the strait. It carries 6,100 to 6,500 vehicles a day.\nAt either end of the Marginal Sea Bridge stands a sign: the northern one reads 'Cliff: one year', the southern 'Congratulations, you are 25% vested', and people often cross the bridge just to photograph the pair. Engineers along the road like to share cars to work, four to a car, and agree that whoever fully vests first buys the coffee; by the end of the year it is always the same person paying, because the other three resigned long ago."
    background:
      zh: 从圣何塞一侧出发，沿东湾山丘背后的谷地向北，经后验区的郊外到边际区，再跨过海峡北去的领道。沿线的郊区住满了在湾区上班的工程师，他们每天清早开上这条路，一边开一边算自己的期权还要多久才能全部归属；领道局于是在路边立了一排电子牌，显示的不是到下一个出口的距离，而是「距下一个归属日还有多少天」。每个归属日后的第二天，路上的车都会少一些，因为又有人辞职了。
      en: "From the San Jose side north along the valleys behind the East Bay hills, through the outskirts of Posterior District to Marginal District and over the strait to the north. Its suburbs are full of engineers who work in the Bay; every morning they drive onto it working out how long until their stock options fully vest, so the State Roads Department put up a row of electronic signs that show not the distance to the next exit but 'days to your next vesting date'. On the day after each vesting date the traffic is a little lighter, because a few more people have resigned."
    shield: sunrise
