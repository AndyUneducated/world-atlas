  - id: rte_zm23m9
    ref: I-280
    build_order: 13
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 门禁领道
      en: Gatekeeper Road
      es: Carretera del Portero
    notes:
      zh: "门禁领道全长约 90 公里，自贝叶斯的先验区沿半岛山脊向南，经比尔斯伯勒的门禁高地区和护城河山区，下到似然谷区和圣克拉拉区，开完全程约四十分钟。全线双向八车道，城区限速 120 公里，乡村路段不限速，最大坡度约 60‰；桥梁共约 3.5 公里，最长的似然谷特大桥约 2.1 公里。日均车流 6000 到 8100 辆。\n庄园主们不许别人在自家窗外盖房子，却很乐意让别人看见自己的房子：山脊上的一段是专门修高的，好让过路的车望见山谷里的庄园、马场和私人湖泊。路上禁止停车，可护栏上每隔一段就有一块铜牌，写着脚下这座庄园的主人和占地面积，路人只能一边开车一边读。下到圣克拉拉区，铜牌换成了芯片公司的楼牌，写的不再是占地面积，而是楼里有多少块显卡。"
      en: "The Gatekeeper Road runs about 90 km from Prior District in Bayesian south along the ridge of the peninsula through Gated Heights and Moat Hills in Billsborough, down to Likelihood Valley and Santa Clara District, about forty minutes end to end. It has four lanes each way, a limit of 120 km/h in towns and none on rural stretches, and grades of up to about 60‰; it has about 3.5 km of bridges, the longest being the Likelihood Valley Viaduct, about 2.1 km. It carries 6,000 to 8,100 vehicles a day.\nThe estate owners will not let anyone build outside their windows, but are happy to be looked at: the stretch along the ridge was built high on purpose, so that passing cars can look down on the estates, stables and private lakes in the valleys. Stopping is forbidden, but every so often a brass plaque on the crash barrier gives the owner and acreage of the estate below, and passers-by must read them as they drive. Down in Santa Clara District the plaques give way to the nameplates of chip companies, which list not acreage but how many graphics cards are inside."
    background:
      zh: 沿湾区半岛的山脊从先验区向南，经门禁高地区和护城河山区到似然谷和圣克拉拉，和湾边的广告牌领道平行。山脊两边是比尔斯伯勒的庄园，路是领道，出口却几乎都是私人的：每个出口后面是一道门、一座岗亭和一块写着「仅限受邀访客」的牌子。路两边的山坡保留着橡树林和草地，因为庄园主们集体出钱买下了沿线的视野，谁也不许在别人家的窗外盖房子。
      en: "Along the ridge of the Bay peninsula from Prior District south through Gated Heights and Moat Hills to Likelihood Valley and Santa Clara, parallel to the Billboard Road on the bayside. The estates of Billsborough lie on both sides of the ridge; the road is a state highway, but almost all its exits are private, each leading to a gate, a guardhouse and a sign reading 'Invited guests only'. The hillsides along it keep their oak woods and grassland, because the estate owners clubbed together to buy the views along the route, so that no one may build outside anyone else's window."
    shield: padlock
