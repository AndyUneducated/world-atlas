    names:
      zh: 捷径领道
      en: Shortcut Road
      es: Carretera del Atajo
    notes:
      zh: "捷径领道全长约 3 公里，全在似然谷区，把集装箱领道和归属期领道接起来，开完全程一两分钟。沿线没有一段算城区，全线双向八车道、不限速，路面几乎是平的，没有桥梁和隧道。日均车流约 6200 辆。\n领道局按规矩给它配齐了全套标志：起点牌、终点牌、出口预告牌和里程牌，几块牌子从头排到尾，几乎没给路面留下地方，里程牌上只有两个数：0 和 3。附近的公司把它写进了新员工手册，当作「捷径」的标准例子：确实更快，但等你弄明白它在哪儿，它就已经结束了。"
      en: "The Shortcut Road runs about 3 km, all in Likelihood Valley, linking the Container Road and the Vesting Road, a minute or two end to end. No stretch of it counts as urban, so it has four lanes each way and no speed limit anywhere; it is almost flat and has no bridges or tunnels. It carries about 6,200 vehicles a day.\nThe State Roads Department gave it the full set of signs the rules require, start, end, exit warning and distance markers, and from one end to the other they leave almost no room for the road; the distance markers show just two numbers, 0 and 3. Nearby companies put it in their new-starter handbooks as the textbook example of a shortcut: it really is quicker, but by the time you have worked out where it is, it is over."
    background:
      zh: 集装箱领道和归属期领道之间的一条短连接线，让两条领道上的车不用穿过城区就能换路。它短得连导航都来不及播报：司机刚听见「前方进入捷径领道」，紧接着就是「您已离开捷径领道」。
      en: "A short link between the Container Road and the Vesting Road, letting traffic change from one to the other without going through town. It is so short that the satnav can hardly keep up: drivers have barely heard 'Entering the Shortcut Road' when it says 'You have left the Shortcut Road'."
    shield: swallow
