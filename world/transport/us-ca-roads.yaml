  - id: rte_15s04b
    ref: SR-1
    build_order: 3
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 海景付费公路
      en: Pay-per-View Coast Road
      es: Carretera Costera de Pago por Vista
    notes:
      zh: "海景付费公路全长约 470 公里，自圣塞雷娜的露西芯城区沿海岸向北，经莫内特里的大附加费区和冲浪棚区、比尔斯伯勒的护城河山区，到湾区贝叶斯的先验区，开完全程约三小时四十分钟。全线双向八车道，城区限速 120 公里，乡村路段不限速，最大坡度约 60‰；桥梁共约 20 公里，没有隧道，最长的冲浪棚特大桥约 15.5 公里，贴着冲浪棚区的海崖架在海面上。日均车流 6300 到 10000 辆。\n网红们为了一张悬崖照片在路边排队，领道局于是在最热门的弯道旁修了一座「自拍停车楼」，按层收费，越高越贵，顶层能拍到海、悬崖和下面几层排队的人。冲浪棚特大桥的护栏上每隔几十米有一个二维码，扫码可以听一段由人工智能朗读的「这里的海有多美」，付费版没有广告。"
      en: "The Pay-per-View Coast Road runs about 470 km north along the coast from Lucy Chip City District in Santa Serena through Big Surcharge and Surf Shack in Monetary and Moat Hills in Billsborough to Prior District in Bayesian, about three hours forty minutes end to end. It has four lanes each way, a limit of 120 km/h in towns and none on rural stretches, and grades of up to about 60‰; it has about 20 km of bridges and no tunnels, the longest being the Surf Shack Viaduct, about 15.5 km, carried over the sea along the cliffs of Surf Shack District. It carries 6,300 to 10,000 vehicles a day.\nInfluencers queue at the roadside for a picture of the cliffs, so the State Roads Department built a 'selfie car park' beside the most popular bend, charged by the floor and dearer the higher you go; from the top you can photograph the sea, the cliffs and the queues on the floors below. Every few dozen metres the Surf Shack Viaduct's railing carries a QR code that plays an AI reading of 'how beautiful the sea is here'; the paid version has no adverts."
    background:
      zh: 挂在滤镜山脉悬崖上的海岸公路，从圣塞雷娜的露西芯城区沿海岸向北，经大附加费区、冲浪棚区和护城河山区到湾区的先验区。悬崖、海湾和老石拱桥是全州最常被拍的风景，于是这条路也成了全州最会收钱的路：观景台扫码付费，弯道上的停车位按分钟计时，雾天看不到海可以申请部分退款，但要先看完一段广告。山体一下雨就滑坡，公路几乎每年都有一段被冲进海里，修路的工程每次都由同一家公司中标。
      en: "The coast road that hangs on the cliffs of the Filter Range, north from Lucy Chip City District in Santa Serena along the shore through Big Surcharge, Surf Shack and Moat Hills to Prior District in the Bay. Its cliffs, coves and old stone arch bridges are the most photographed scenery in the state, so it has also become the state's best road at taking money: the viewpoints are pay-by-scan, the lay-bys on the bends are timed by the minute, and on foggy days, when there is no sea to see, drivers may claim a partial refund after watching an advertisement. The mountainside slides whenever it rains, a stretch of road falls into the sea nearly every year, and the contract to rebuild it always goes to the same company."
