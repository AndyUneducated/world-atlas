  - id: rte_t33dg7
    ref: SR-13
    build_order: 27
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 梯度下降领道
      en: Gradient Descent Road
      es: Carretera del Descenso de Gradiente
    notes:
      zh: "梯度下降领道全长约 19 公里，全在贝叶斯的后验区，沿市区背后的山坡穿过树林，到海湾边的平地与空车领道相接，开完全程不到十分钟。沿线没有一段算城区，全线双向八车道、不限速，最大坡度却只有约 8‰，没有桥梁和隧道。日均车流约 6400 辆。\n学生们抱怨这条路的坡太缓，梯度小得几乎「消失」，开车的人常常分不清自己是在下坡还是在平路上，教授说这正是训练深层网络的真实体验。每学期期末，学生们在这条路上做「学习率实验」：同一辆车用不同的速度往山下开，开太快的在弯道上冲出路面，开太慢的到天黑还没到山脚，教授给两组写了同一句评语：「不收敛。」"
      en: "The Gradient Descent Road runs about 19 km, all in Posterior District in Bayesian, along the wooded hillside behind the city to the flat land by the bay, where it meets the Empty Car Road, under ten minutes end to end. No stretch of it counts as urban, so it has four lanes each way and no speed limit anywhere, yet its grades are only about 8‰, and it has no bridges or tunnels. It carries about 6,400 vehicles a day.\nStudents complain that its slopes are so gentle that the gradient all but vanishes, and drivers often cannot tell whether they are going downhill or on the level; their professors say this is exactly what training a deep network feels like. At the end of each term the students hold a learning-rate experiment on it, driving the same car down at different speeds: those who go too fast leave the road on the bends, those who go too slow are still short of the bottom at nightfall, and the professors give both groups the same remark: 'Did not converge.'"
    background:
      zh: 后验区背后山坡上的一小段领道，在树林里一路往下，从山脊落到海湾边的平地。附近大学的学生把它当作「梯度下降」的现场教学：开车的人不看地图，只管往低处开，最后总能到达山脚，只是不保证是自己想去的那个山脚。教授们补充说，走到半山腰的停车场就以为到了底的，叫「局部最优」。
      en: "A short state road on the hillside behind Posterior District, running down through the woods from the ridge to the flat land by the bay. Students at the nearby university use it as a field class in gradient descent: drive without a map, always heading downhill, and you will always reach the foot of the hill, though not necessarily the foot you wanted. Their professors add that those who stop at the car park halfway down thinking they have reached the bottom have found a 'local optimum'."
