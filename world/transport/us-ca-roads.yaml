  - id: rte_6nk8sr
    ref: I-405
    build_order: 14
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 停车场领道
      en: Parking Lot Road
      es: Carretera del Estacionamiento
    notes:
      zh: "停车场领道全长约 127 公里，自失落天使的网约谷区出发，经比佛利账单区、烟雾谷区和搁浅滩区，到艾尔瓦纳的新港决口区、总规划区和业主委员会山区，不堵车时开完全程约一小时。全线双向八车道，城区限速 120 公里，乡村路段不限速，最大坡度只有约 5‰。日均车流 12000 到 54000 辆，是全州最繁忙的领道。全州只有这一条领道不归领道局管，由加州收费道路特许经营公司收费经营。\n收费按人工智能实时算出的「愿付价格」计算：系统看车型、看车主的信用记录、看车里坐了几个人，同一段路，开豪车的人付的钱是开旧车的人的好几倍，赶时间的人还要再加价。为了「改善公平」，公司推出了会员计划，会员的车每月可以在快车道上堵一次免费的车。"
      en: "The Parking Lot Road runs about 127 km from Rideshare Valley in Lost Angeles through Beverly Bills, Smogdale and Long Beached to Newport Breach, Masterplan and HOA Hills in Irvana, about an hour end to end when it is not jammed. It has four lanes each way, a limit of 120 km/h in towns and none on rural stretches, and grades of only about 5‰. It carries 12,000 to 54,000 vehicles a day, the busiest state highway in California. It is also the only one not run by the State Roads Department: California Toll Road Concessions Inc. operates it for tolls.\nThe toll is the 'willingness to pay' worked out live by an artificial intelligence from the make of the car, the owner's credit record and the number of people inside; on the same stretch the owner of a luxury car pays several times what the driver of an old one does, and anyone in a hurry pays more again. To 'improve fairness' the company has launched a membership scheme whose members may sit in one free jam a month in the express lanes."
    background:
      zh: 失落天使盆地西边的南北干道，从网约谷区翻过山口，经比佛利账单区、烟雾谷区和搁浅滩区，一直通到艾尔瓦纳的新港决口区和业主委员会山区。它是全州车流最大的路，也是全州最慢的路，高峰时段的平均车速比步行还慢，本地人干脆管它叫「停车场」。州领道局为了治堵已经把它拓宽过两次，每拓宽一次车就更多一些；第三次拓宽的方案正在由人工智能评估，评估报告的结论已经提前写好：「需要更多车道。」
      en: "The north–south trunk on the west side of the Lost Angeles basin, from Rideshare Valley over the pass through Beverly Bills, Smogdale and Long Beached to Newport Breach and HOA Hills in Irvana. It carries more traffic than any other road in the state and is also the slowest: at rush hour its average speed is below walking pace, and locals simply call it 'the car park'. To cure the jams the State Roads Department has widened it twice, and each time the traffic grew; a third widening is being assessed by an artificial intelligence, whose report already has its conclusion written: 'More lanes are needed.'"
    shield: cone
    operator: { zh: 加州收费道路特许经营公司, en: California Toll Road Concessions Inc. }
    via: [div_7jac05, div_5sjc4x, div_rwfcw9, div_3rwj4m, div_77vac6, div_2jmm39]  # rideshare valley – beverly bills – smogdale – long beached – newport breach – hoa hills
  - id: rte_q8mt00
    ref: SR-120
    build_order: 15
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 融资窗口领道
      en: Funding Window Road
      es: Carretera de la Ventana de Financiación
    notes:
      zh: "融资窗口领道全长约 140 公里，自阿尔蒙多的果仁区出发，穿过巨杉区的巨杉林，穿过估值山脉到玛门的雪道区，开完全程一小时出头。全线双向八车道，城区限速 120 公里，乡村路段不限速，上山一段最大坡度约 60‰；桥梁共约 22 公里、隧道约 24 公里，估值山脉隧道约 21.8 公里，是全州最长的公路隧道，雪道特大桥约 21.6 公里。日均车流 7400 到 18000 辆，几乎全在夏天。\n每年开山的日子由领道局的人工智能根据积雪、天气和游客预约量预测，结果每年都比实际晚两个星期，于是山下排满了等着翻山的车，一开放就一齐冲上去。巨杉林一段的树离路很近，最大的几棵树旁边立着捐款富豪的名牌，护林员在名牌背面偷偷写上了树原来的名字，只有下山的车才看得见。"
      en: "The Funding Window Road runs about 140 km from Kernel District in Almondo through the giant sequoias of Giant Grove and under the Sierra Valuation to Ski District in Mammon, a little over an hour end to end. It has four lanes each way, a limit of 120 km/h in towns and none on rural stretches, and grades of up to about 60‰ on the climb; it has about 22 km of bridges and 24 km of tunnels, the Sierra Valuation Tunnel, about 21.8 km, being the longest road tunnel in the state, and the Ski Viaduct about 21.6 km. It carries 7,400 to 18,000 vehicles a day, almost all of them in summer.\nEach year the day the mountain stretch opens is forecast by the State Roads Department's AI from the snow, the weather and visitor bookings, and each year it comes two weeks later than the real thing, so cars queue at the foot of the mountains and all charge up together the moment it opens. In the sequoia grove the trees stand close to the road, the largest beside nameplates of the billionaires who paid for them, and the rangers have secretly written each tree's old name on the back of its plate, where only cars coming down the mountain can see it."
    background:
      zh: 从阿尔蒙多的果仁区向东，穿过巨杉区的巨杉林，在融资轮山口以北以长隧道穿过估值山脉，下到东坡的雪道区。通往隧道口的山路每年只在夏天开放几个月，冬天大雪封山，和湾区创业公司的融资窗口一样，开放的日子要看天，关闭则毫无预兆。巨杉林里的老树有几千岁，州政府给每棵大树都起了名字，最大的几棵按捐款最多的科技富豪命名，护林员说树比富豪们长寿，名字迟早还会换回来。
      en: "East from Kernel District in Almondo through the giant sequoias of Giant Grove, under the Sierra Valuation by a long tunnel north of Funding Round Pass and down to Ski District on the eastern slope. The mountain road up to the tunnel portals is open only for a few months each summer and snowed in all winter, much like the funding windows of Bay start-ups: it opens when the weather allows and shuts without warning. Some of the sequoias are thousands of years old; the state has named every great tree, the largest after the tech billionaires who gave the most, and the rangers say the trees will outlive the billionaires and the names will change back sooner or later."
    shield: dollar
    via: [div_r0qhbd, div_p6j9x8, div_9fqezr]  # kernel – giant grove – ski
  - id: rte_p7a0sb
    ref: I-880
    build_order: 16
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 集装箱领道
      en: Container Road
      es: Carretera de los Contenedores
    notes:
      zh: "集装箱领道全长约 71 公里，自圣克拉拉区出发，经似然谷区沿海湾东岸的平地北上，到贝叶斯后验区的港口，开完全程约半小时。沿线没有一段算城区，全线双向八车道、不限速，最大坡度约 17‰，跨过 1 条河，几乎没有桥梁和隧道。日均车流 6100 到 6500 辆，大多是港口出来的集装箱车。\n领道局每天派一辆检测车开一遍全程，车里放着一杯倒满的咖啡，洒出一滴，那一段就要重新磨平；检测车的司机说他已经好几年没喝完过一杯咖啡了，因为每天下班时那杯咖啡还要留着做证据。港口的龙门吊由人工智能调度，按「紧急程度」决定先卸哪个集装箱，可每个集装箱上都贴着「加急」，模型想了一晚上，决定按字体大小排序。"
      en: "The Container Road runs about 71 km from Santa Clara District through Likelihood Valley and north along the flat eastern shore of the bay to the port in Posterior District, Bayesian, about half an hour end to end. No stretch of it counts as urban, so it has four lanes each way and no speed limit anywhere, with grades of up to about 17‰; it crosses one river and has hardly any bridges or tunnels. It carries 6,100 to 6,500 vehicles a day, most of them container lorries from the port.\nEvery day the State Roads Department sends an inspection car down the whole road with a brimming cup of coffee inside; if a single drop spills, that stretch is ground flat again. Its driver says he has not finished a cup of coffee in years, because each evening the cup has to be kept as evidence. The port's gantry cranes are scheduled by an AI that unloads the containers in order of urgency, but every container is labelled 'URGENT', so after a night's thought the model decided to sort them by font size."
    background:
      zh: 沿海湾东岸的平地，从后验区的港口一路向南到圣克拉拉区和圣何塞的领道。港口每天卸下成千上万个集装箱，里面装的大多是显卡，于是这条路上的货车比哪条路上的都怕颠：领道局把路面磨得像镜子一样平，每块限速牌下面都另挂一块小牌子：「前方有显卡，请温柔驾驶。」货车司机说，开这条路最紧张的不是遇到警察，而是副驾驶上坐着押车的保险公司代表。
      en: "The state road along the flat eastern shore of the bay, from the port in Posterior District south to Santa Clara District and San Jose. The port unloads thousands of containers a day, most of them full of graphics cards, so the lorries here fear a bump more than those on any other road: the State Roads Department has ground the surface as flat as a mirror, and under every speed-limit sign hangs a smaller one: 'GPUs ahead. Please drive gently.' Drivers say the most nervous moments on this road come not from the police but from the insurer's representative riding in the passenger seat beside the cargo."
