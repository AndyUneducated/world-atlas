  - id: rte_v48mye
    ref: SR-237
    build_order: 21
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 优先级领道
      en: Priority Road
      es: Carretera de Prioridad
    notes:
      zh: "优先级领道全长约 19 公里，自似然谷区东北的集装箱领道出发，沿海湾南岸向西，穿过圣克拉拉区的北角，到似然谷区西北与广告牌领道相接，开完全程约十分钟。沿线没有一段算城区，全线双向八车道、不限速，最大坡度约 38‰，跨过 1 条河，几乎没有桥梁。日均车流 6100 到 6200 辆。\n收费快车道的价格牌每分钟变一次，有人把一年的价格画成曲线，发现和附近几家芯片公司的股价走势几乎一模一样；领道局否认两者有关，但承认收费系统用的正是那几家公司的芯片。路北的盐田一格一格泛着粉红、橘黄和铁锈红，从车窗望出去像一张色彩过饱和的热力图，工程师们说，这是他们见过的唯一一张不需要调参的热力图。"
      en: "The Priority Road runs about 19 km from the Container Road in north-eastern Likelihood Valley west along the southern shore of the bay, through the northern corner of Santa Clara District to the Billboard Road in the north-west of Likelihood Valley, about ten minutes end to end. No stretch of it counts as urban, so it has four lanes each way and no speed limit anywhere, with grades of up to about 38‰; it crosses one river and has hardly any bridges. It carries 6,100 to 6,200 vehicles a day.\nThe price board of the express toll lane changes every minute; someone plotted a year of its prices and found the curve almost exactly matched the share prices of a few nearby chip companies, and the State Roads Department denies any connection but admits that the toll system runs on those companies' chips. North of the road the salt ponds glow in squares of pink, orange and rust, like an oversaturated heat map seen from the car window, and engineers say it is the only heat map they have ever seen that needed no tuning."
    background:
      zh: 沿着海湾南岸横穿似然谷区北缘的一小段领道，把广告牌领道和集装箱领道接起来。它有一条收费快车道，价格随堵车程度实时浮动，高峰时贵得像调用一次最大的模型；工程师们每天早上在车里算「多付钱早到 10 分钟」和「不付钱晚到 10 分钟」哪个划算，算完的时候，车已经开进公司停车场了。
      en: "A short state road across the northern edge of Likelihood Valley along the southern shore of the bay, linking the Billboard Road and the Container Road. It has an express toll lane whose price floats live with the traffic, at rush hour as dear as a call to the largest model; every morning engineers sit in their cars working out whether 'pay and arrive ten minutes early' beats 'pay nothing and arrive ten minutes late', and by the time they have the answer they are pulling into the company car park."
