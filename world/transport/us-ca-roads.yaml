  - id: rte_g5c0tg
    ref: SR-87
    build_order: 20
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 降落领道
      en: Final Approach Road
      es: Carretera de Aproximación Final
    notes:
      zh: "降落领道全长约 17 公里，自南圣何塞区与园区领道相接的地方出发，沿着河向北穿过似然谷区的市中心，到圣克拉拉区的机场旁边，开完全程不到十分钟。沿线没有一段算城区，全线双向八车道、不限速，最大坡度约 33‰，没有桥梁和隧道。日均车流 6100 到 6200 辆。\n领道局在路面上画了一排巨大的白色箭头，指向机场的方向，本来是给司机看的，后来飞行员也开始参考它，塔台只好发了一份通知：「请勿跟随地面车道降落。」市中心的楼盖不高，开发商们就往地下挖，有一座写字楼的地下停车场比地面上的楼还深，租户们说，在这里上班，抬头看到的是飞机，低头看到的是自己的车。"
      en: "The Final Approach Road runs about 17 km from its junction with the Campus Road in South San Jose District, north along the river through the downtown of Likelihood Valley to beside the airport in Santa Clara District, under ten minutes end to end. No stretch of it counts as urban, so it has four lanes each way and no speed limit anywhere, with grades of up to about 33‰ and no bridges or tunnels. It carries 6,100 to 6,200 vehicles a day.\nThe State Roads Department painted a row of huge white arrows on the carriageway pointing to the airport; they were meant for drivers, but pilots began to use them too, and the control tower had to issue a notice: 'Do not follow the road markings to land.' Downtown cannot build tall, so developers dig down instead, and one office block has a car park that goes deeper underground than the building rises above it; its tenants say that working there you look up to see planes and down to see your car."
    background:
      zh: 圣何塞的一小段领道，沿着河从机场旁边向南穿过市中心。飞机落地前从这条路的车顶上低低地掠过，市中心因此盖不了高楼；开发商们每次开车路过都要抬头看一眼飞机，眼神像在看一位挡着他们发财的邻居。路边的司机们早已习惯，飞机经过时谁也不抬头，只有第一次来的人会把车速降到一半，然后被后面的机器人出租车按喇叭。
      en: "A short state road in San Jose, along the river south from beside the airport through downtown. Planes come in low over the roofs of its cars before they land, which is why downtown can't build tall; whenever developers drive along it they look up at the planes the way one looks at a neighbour standing between oneself and a fortune. Regular drivers no longer notice, and nobody looks up as a plane goes over; only first-timers slow to half speed, and are honked at by the robotaxi behind."
