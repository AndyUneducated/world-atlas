# Railways of the California Autonomous State.
#
# Fields as in world/transport/cn-nv-rail.yaml. tech.trains_per_day (optional): a fixed
#   timetable of that many trains a day in both directions together, instead of a headway set
#   by demand; the line carries no more than those trains seat.
railways:
  - id: rte_karbey
    network: intercity_rail
    status: generated
    names:
      zh: 加州高速铁路
      en: California High-Speed Railway
      es: Tren de Alta Velocidad de California
    notes:
      zh: "加州高速铁路已建成的一段全长约 370 公里，自斯塔克顿城南的斯塔克顿站出发，经谦逊站、阿尔蒙多站，到压裂原荒漠里的荒漠枢纽站，直达最快约一小时十七分钟。列车为下一期 300 型，八辆编组、可重联十六辆，运营时速 300 公里，设计时速 350 公里。全线有约 39 公里桥梁，没有隧道，最长的果仁高架桥约 16.5 公里，从阿尔蒙多城区上空穿过。每天只开两班，每年运送约 74 万人次，班班满座。\n因为一天只有两班，车票总是提前几个月卖光，斯塔克顿站门口有黄牛专门倒卖高铁票，价格比机票还贵，买到票的人上车第一件事是拍一张车票的照片发出去。荒漠枢纽站方圆几十公里没有城镇，站前广场上只有一排机器人出租车和一块「此处规划中央商务区」的牌子，下车的人大多原车坐回去，为的只是说自己坐过加州的高铁。"
      en: "The finished stretch of the California High-Speed Railway runs about 370 km from Stuckton Station south of the city through Modestly and Almondo stations to Desert Hub Station in the desert of the Fracklands, the fastest trains taking about an hour and seventeen minutes. Its Next Phase 300 trains of eight cars, which can run in pairs of sixteen, run at 300 km/h on a line designed for 350. It has about 39 km of bridges and no tunnels, the longest being the Kernel Viaduct, about 16.5 km, which carries it over the town of Almondo. Only two trains run a day, carrying some 740,000 trips a year, every one of them full.\nWith only two trains a day, tickets sell out months ahead, touts outside Stuckton Station resell them for more than an air fare, and the first thing anyone who gets one does on board is post a picture of the ticket. There is no town for dozens of kilometres around Desert Hub Station, and its forecourt holds only a rank of robotaxis and a sign reading 'Future site of the central business district'; most passengers ride straight back on the same train, just to say they have taken California's high-speed railway."
    background:
      zh: 加州高速铁路原本要连起失落天使、湾区和首府，全长一千多公里，三小时走完全程。自治州为它成立了高速铁路管理局，管理局的名字后面至今挂着「建设中」三个字。线路被拆成十几期，每一期都要先做环境评估、再做第二次环境评估、再请人工智能写一份评估环境评估的报告；修了这么多年，建成的只有中央渴谷里斯塔克顿城南到压裂原荒漠的一段，两头都不在任何人想去的地方。管理局说这是「先建最难的部分」，渴谷的人说这是「先建最没用的部分」。
      en: "The California High-Speed Railway was meant to link Lost Angeles, the Bay and the capital, more than a thousand kilometres in three hours. The state set up a High-Speed Rail Authority for it, whose name still ends in the words 'Under Construction'. The line was split into more than a dozen phases, each needing an environmental review, then a second environmental review, then a report by an artificial intelligence assessing the environmental reviews; after all these years the only stretch built runs through the Central Valley from the south of Stuckton to the desert of the Fracklands, and neither end is anywhere anyone wants to go. The Authority says it is 'building the hardest part first'; the valley says it is 'building the most useless part first'."
    color: '#E36414'
    tech:
      operating_speed_kmh: 300
      design_speed_kmh: 350
      trains_per_day: 2
      train: { names: { zh: 下一期 300 型, en: Next Phase 300, es: Próxima Fase 300 }, seats: 600 }
    station_names:
      div_xfjrth: { zh: 荒漠枢纽站, en: Desert Hub Station, es: Estación Centro del Desierto }
    via: [div_zqpg46, div_tnbcec, div_r0qhbd, div_xfjrth]  # terminus – modestly – kernel – fracklands

  - id: rte_mag7jz
    network: intercity_rail
    maglev: true
    status: generated
    names:
      zh: 露西—乔什磁悬浮
      en: Lucy–Josh Maglev
      es: Maglev Lucy–Josh
    wonder:
      zh: 世界最快的铁路，运营时速 700 公里
      en: The fastest railway in the world, running at 700 km/h
    notes:
      zh: "露西—乔什磁悬浮是一条只有两个站的私人铁路，从露西宅邸东门外的露西宅邸站，到乔什宅邸西门外的乔什宅邸站，全长约 70 公里。导轨和露西—乔什私人公路并肩走同一条直线，运营时速 700 公里，设计时速 750 公里，是世界上最快的铁路。公路顺着地势翻山越岭，导轨为了在 700 公里的时速下保持平稳，遇山钻隧道、遇谷上高架，全线约有 15 公里桥梁和 10 公里隧道，最长的露西芯城特大桥约 3.3 公里，最长的滤镜山脉隧道约 4.2 公里。从一家到另一家只要十分钟，正好是露西在 AI 洗护中心卸一次妆的时间，于是她常常在出门前开始卸妆，下车时刚好卸完。\n列车只有一节车厢，叫「长餐桌 700 型」，车厢正中摆着一张能坐二十个人的长餐桌，和乔什宅邸餐厅里那张一样长，规矩也一样：桌上不看手机，但可以讨论还没发布的应用。每天只开六班，按两家的饭点排：早上一班送露西去乔什家看赛车，中午一班送乔什去露西家吃甜品工坊专门给他做的榴莲点心，晚上几班专门送吃完饭的客人回家。车厢的空气由清风中心的工程师调过，闷热指数从来没超过零；车尾有一个密封的小隔间，可以在车上吃榴莲，抽风系统照着乔什庄园的气味隔离塔缩小，通过了露西「还行，像焦糖」的验收。\n列车全自动驾驶，每一班开车前，广播里都是两个人的声音各说一句：露西说「请系好安全带，车上不闷」，乔什说「先坐稳，再改变世界」。"
      en: "The Lucy–Josh Maglev is a private railway of just two stations, from Lucy's House Station outside the east gate of Lucy's House to Josh's House Station outside the west gate of Josh's House, about 70 km apart. The guideway runs side by side with the Lucy–Josh Private Road along the same straight line, and its trains run at 700 km/h on a line designed for 750, making it the fastest railway in the world. Where the road rides up and down over the land, the guideway keeps level for 700 km/h, tunnelling through hills and crossing valleys on viaducts: about 15 km of bridges and 10 km of tunnels in all, the longest being the Lucy Chip City Viaduct, about 3.3 km, and the Filter Range Tunnel, about 4.2 km. The trip from one house to the other takes ten minutes, exactly as long as Lucy's make-up removal at the AI Care Centre, so she often starts removing it before she leaves and finishes as the train pulls in.\nThe train is a single car, the Long Table 700, with a table for twenty down the middle, as long as the one in the dining room of Josh's House and with the same rules: no phones at the table, but apps not yet released may be discussed. Only six trains run a day, timed to the two households' meals: a morning train takes Lucy to watch the racing at Josh's, a midday train takes Josh to Lucy's for the durian sweets the dessert workshop makes just for him, and the evening trains take dinner guests home. The air in the car was tuned by engineers from the Breeze Centre, and its stuffiness index has never risen above zero; at the back is a sealed compartment where durian may be eaten on board, its extraction scaled down from the Durian Odour Isolation Tower on Josh's estate, and it passed Lucy's test of 'not bad, like caramel'.\nThe train drives itself, and before each departure the announcement is in both their voices, one line each: Lucy says 'Please fasten your seat belt; it is never stuffy on board', and Josh says 'Sit tight first, then change the world'."
    background:
      zh: 露西和乔什是多年的朋友，一个住在露西芯城区，一个住在乔什庄园区，两家相隔七十多公里，开车要沿着广告牌领道绕一大圈，露西嫌路上闷，乔什嫌路上慢。两人一起出钱修了这条磁悬浮和旁边的私人公路：露西芯片设计中心设计了列车的控制芯片，乔什的车库实验室写了调度软件，线路取两家之间的直线，遇山打隧道，遇谷架高架桥。通车那天，两人在半路上的列车里吃了第一顿饭，从此两家的晚饭常常是同一顿。
      en: "Lucy and Josh are old friends, one living in Lucy Chip City District and the other in Josh Estate District, more than seventy kilometres apart; driving meant a long way round on Billboard Road, which Lucy found stuffy and Josh found slow. Together they paid for this maglev and the private road beside it: the Lucy Chip Design Centre designed the train's control chips, Josh's garage lab wrote the dispatching software, and the line takes the straight way between the two houses, tunnelling through hills and crossing valleys on viaducts. On opening day the two of them ate the first meal on board halfway, and since then the two households have often shared the same dinner."
    operator: { zh: 露西—乔什磁悬浮公司, en: Lucy–Josh Maglev Company }
    color: '#C77DFF'
    tech:
      operating_speed_kmh: 700
      design_speed_kmh: 750
      trains_per_day: 6
      formation: { cars: 1 }
      train: { names: { zh: 长餐桌 700 型, en: Long Table 700, es: Mesa Larga 700 }, seats: 20 }
    station_names:
      poi_hj2ap8: { zh: 露西宅邸站, en: Lucy's House Station, es: Estación Casa de Lucy }
      poi_6v8a3r: { zh: 乔什宅邸站, en: Josh's House Station, es: Estación Casa de Josh }
    line: { points: [[167.3067, 146.1578], [167.5542, 145.9457], [189.8573, 135.3143], [190.1048, 135.2613]] }
    via: [poi_hj2ap8, poi_6v8a3r]  # Lucy's House – Josh's House
