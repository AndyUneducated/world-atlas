# Railways of North Viking Island.
#
# network: intercity_rail (城际铁路).
# via: ordered stops. A city stops at its core district (the most populous one), a district
#   at its own centre. The generator lays the line over the terrain, keeping to gentler
#   gradients than roads and tunnelling through mountains (tunnel_cost caps the per-km cost
#   of steep ground, default 2.5); later lines run on the track of earlier ones where their
#   corridors meet, and stations are shared.
# station_names (optional): names for the station of a via entry. By default a city's
#   station is named after the city (维京港站 / Viking Port Station) and a district's after
#   the district (沙洲站 / Sandbar Station).
# color: the line's colour on cards and in station lists.
# tech: operating and design speed (km/h, 300–400 in service); gauge, power, signalling and
#   train formation default to the intercity_rail standard in engineering.yaml.
# City metro lines are generated from the `metro` section of world/generator/.
railways:
  - id: rte_v7khx2
    network: intercity_rail
    status: generated
    names:
      zh: 维西城际铁路
      en: Viking Port–Northwest Intercity Railway
      art-x-viking: Intercity-Bahn Veiling Havn–Nordwest
      art-x-buckham: Ferrovia Intercity Veiling Porto–Nordveste
    notes:
      zh: 连接维京港、自由市与西北三座最大的城市，途经自由市沙洲区
      en: Links the three largest cities, Viking Port, Freedom City and Northwest, by way of Sandbar District.
    background:
      zh: 维京港、自由市和西北是北维京岛最大的三座城市，三城之间的公路交通在节假日常常拥堵，冬季暴雪时更是时断时续。维西城际铁路是北维京岛修建的第一条高速铁路，自维京港出发，经自由市沙洲区、首府自由市到西北，把三座城市连成一条走廊。线路穿过沙洲河口湿地和北河谷地时大量采用高架桥，既节约农田，也避免冬季积雪阻断线路；全线道岔和接触网配有融冰装置。开通后三城之间的旅客大量转向铁路，这条线也是全岛客流最大的铁路之一。
      en: Viking Port, Freedom City and Northwest are North Viking Island's three largest cities, and the roads between them were jammed on holidays and unreliable in winter blizzards. The Viking Port–Northwest Intercity Railway was the island's first high-speed line, running from Viking Port through Sandbar to the capital, Freedom City, and on to Northwest, making the three cities a single corridor. Across the Sandbar estuary wetlands and the North River valley it is largely on viaduct, which saves farmland and keeps drifting snow off the track, and all its points and overhead line have de-icing equipment. Since it opened most travel between the three cities has moved to the train, and it is one of the island's busiest lines.
    color: '#3E63DD'
    tech: { operating_speed_kmh: 400, design_speed_kmh: 450 }
    via: [div_m41gwn, div_g4a8q0, div_nbrnfr, div_0yef9a]
    station_names:
      div_nbrnfr: { zh: 自由市站, en: Freedom City Station }
  - id: rte_cnfpey
    network: intercity_rail
    status: generated
    names:
      zh: 维贝铁路
      en: Viking Port–Beckerle Railway
      art-x-viking: Bahn Veiling Havn–Beckerle
      art-x-buckham: Ferrovia Veiling Porto–Beckerle
    notes:
      zh: 沿岛南部自西向东，串联维京港、奥克西诺、新城、萨科勒与贝克勒自由贸易区
      en: Runs west to east across the south of the island through Viking Port, Oxino, New City, Sakole and the Beckerle Free Trade Zone.
    background:
      zh: 北维京岛南部是人口最密、工商业最发达的地带，维京港、奥克西诺、新城、萨科勒和贝克勒自由贸易区自西向东一字排开。维贝铁路沿岛南部自西向东，串联这五座城市，是全岛的铁路主干。线路要穿过南部沿海的丘陵和众多入海河流，桥隧比例很高，长大桥梁和隧道一座接一座。贝克勒自由贸易区和保税港区带来了大量商务客流，铁路为此在贝克勒设置了大型枢纽站，与港口和自贸区直接相连。开通后沿线相邻城市之间形成了便捷的通勤圈，沿线新城迅速发展。
      en: The south of North Viking Island is its most crowded and most commercial belt, with Viking Port, Oxino, New City, Sakole and the Beckerle Free Trade Zone in a line from west to east. The Viking Port–Beckerle Railway runs along the south from west to east and links all five, the backbone of the island's railways. It has to cross the southern coastal hills and many rivers running to the sea, so a large share of it is bridge and tunnel, one long structure after another. The free trade zone and bonded port at Beckerle bring a great deal of business travel, and the line has a large hub station there with direct links to the port and the zone. Neighbouring cities along it are now within easy commuting distance, and the new towns along the line have grown fast.
    color: '#E5484D'
    tech: { operating_speed_kmh: 350, design_speed_kmh: 400 }
    via: [div_m41gwn, div_q4d6n6, div_k4s990, div_da3s38, div_k4hg7b]
    station_names:
      div_k4s990: { en: New City Station }
  - id: rte_fk2x5w
    network: intercity_rail
    status: generated
    names:
      zh: 西马铁路
      en: Northwest–Maslin Mountain Railway
      art-x-viking: Bahn Nordwest–Maslinberg
      art-x-buckham: Ferrovia Nordveste–Maslin Tehee
    notes:
      zh: 自西北经勒克尔、洛龙山、厄定河通往马斯林山
      en: From Northwest through Lekor, Lorond Mountain and Erding River to Maslin Mountain.
    background:
      zh: 西马铁路是北维京岛最长的铁路，自西北出发，经北岸的勒克尔，翻越洛龙山脉到洛龙山，再经厄定河通往东部的马斯林山。它的修建主要是为了让内陆山城和北部农牧区也能接入高速铁路网，并为马斯林山附近的发射中心提供大运量的人员运输。线路翻越洛龙山脉时以长隧道穿过山体；在厄定河谷跨越大片冻土，路基采用热管和隔热层保持冻土稳定，穿过驯鹿牧场时以连续高架桥通过，桥下留出迁徙通道。全线开通后，北部与东部的山城第一次与西北、首府有了全天候的快速联系。
      en: The Northwest–Maslin Mountain Railway is North Viking Island's longest line. It runs from Northwest along the north coast to Lekor, crosses the Lorond Range to Lorond Mountain, then follows the Erding River east to Maslin Mountain. It was built mainly to bring the inland mountain cities and the farming and herding north onto the high-speed network, and to carry large numbers of people to the launch centre near Maslin. It passes under the Lorond Range in long tunnels. In the Erding valley it crosses wide permafrost on a roadbed kept frozen with heat pipes and insulation, and runs through the reindeer pastures on continuous viaduct with the migration routes left open beneath. Once it opened, the mountain cities of the north and east had their first fast, all-weather link to Northwest and the capital.
    color: '#30A46C'
    tech: { operating_speed_kmh: 300, design_speed_kmh: 350 }
    via: [div_0yef9a, div_yjghe9, div_prcxzt, div_8emjne, div_rdypg7]
  - id: rte_cy9xmf
    network: intercity_rail
    status: generated
    names:
      zh: 贝马铁路
      en: Beckerle–Maslin Mountain Railway
      art-x-viking: Bahn Beckerle–Maslinberg
      art-x-buckham: Ferrovia Beckerle–Maslin Tehee
    notes:
      zh: 自贝克勒自由贸易区经天城北上马斯林山
      en: North from the Beckerle Free Trade Zone through Skytown to Maslin Mountain.
    background:
      zh: 马斯林山附近的发射与降落中心需要源源不断的人员往来，而离它最近的大型港口城市是南岸的贝克勒自由贸易区。贝马铁路自贝克勒出发，经天城北上马斯林山，是连接南岸港口与东部山城的捷径。线路自南岸平原逐步爬升进入马斯林山区，在天城以北以桥梁和隧道跨越山谷和山嘴，坡度按高速铁路标准严格控制。发射日前后，线路会加开临时列车，运送前往观看发射的游客。它开通后，与维贝、西马、维西三条铁路共同构成环绕全岛的铁路环线。
      en: The launch and landing centre near Maslin Mountain needs a steady flow of people, and the nearest large port city is the Beckerle Free Trade Zone on the south coast. The Beckerle–Maslin Mountain Railway runs from Beckerle through Skytown north to Maslin Mountain, the short cut between the southern port and the eastern mountain city. It climbs steadily from the coastal plain into the Maslin uplands, bridging valleys and tunnelling through spurs north of Skytown, with its gradients held strictly within high-speed limits. Around launch days extra trains run for the crowds who come to watch. With it, the Viking Port–Beckerle, Northwest–Maslin Mountain and Viking Port–Northwest lines close a rail ring around the whole island.
    color: '#F76B15'
    tech: { operating_speed_kmh: 300, design_speed_kmh: 350 }
    via: [div_k4hg7b, div_ygk521, div_rdypg7]
  - id: rte_5pkw2p
    network: intercity_rail
    status: generated
    names:
      zh: 自勒城际铁路
      en: Freedom City–Lekor Intercity Railway
      art-x-viking: Intercity-Bahn Freistad–Lekor
      art-x-buckham: Ferrovia Intercity Frei–Lekor
    notes:
      zh: 自首府经北河区通往勒克尔
      en: From the capital through North River District to Lekor.
    background:
      zh: 自勒城际铁路自首府自由市出发，经北河区通往北岸港口勒克尔，与自勒高速走同一条北河谷地。谷地开阔平坦，线路几乎全部铺设在路基上，没有一座隧道，是北维京岛造价最低的高速铁路之一。修建它的初衷是为首府与北岸港口之间提供可靠的冬季交通：高速公路遇暴雪需要封闭除雪，铁路则可借助融雪装置照常运行。线路跨越北河时采用大跨度桥梁，不在河中立墩，以免影响鲑鱼洄游。开通后谷地城镇有了直达首府的列车，北河站也成为谷地居民进城的主要门户。
      en: The Freedom City–Lekor Intercity Railway runs from the capital through North River District to the north-coast port of Lekor, sharing the North River valley with the Freedom–Lekor Expressway. The valley is wide and flat, so the line lies almost entirely on embankment without a single tunnel, one of the cheapest high-speed lines on the island. It was built to give the capital and the northern port a link that works all winter, since the expressway has to close for snow clearing in blizzards while the railway keeps running with its snow-melting equipment. The North River is crossed on long spans with no piers in the river, so the salmon runs are not disturbed. The valley's towns now have direct trains to the capital, and North River station has become their gateway to the city.
    color: '#8E4EC6'
    tech: { operating_speed_kmh: 350, design_speed_kmh: 400 }
    via: [div_nbrnfr, div_b1dx32, div_yjghe9]
    station_names:
      div_nbrnfr: { zh: 自由市站, en: Freedom City Station }
  - id: rte_nx028x
    network: intercity_rail
    status: generated
    names:
      zh: 新洛铁路
      en: New City–Lorond Mountain Railway
      art-x-viking: Bahn Neustad–Lorondberg
      art-x-buckham: Ferrovia Neu Teatu–Lorond Tehee
    notes:
      zh: 自新城青坪区枢纽北上洛龙山
      en: North from the Greenmead hub of New City to Lorond Mountain.
    background:
      zh: 新城是南岸新兴的工业城市，洛龙山是内陆的山城，过去两地之间乘火车要在中途下车换乘，耗时很长。线网规划时发现，维贝铁路与西马铁路在两城之间已经相互交会，只需在交会站调整道岔和信号，列车就能从一条干线直接转入另一条。新洛铁路因此没有另建正线：列车从新城青坪区枢纽出发，先沿维贝铁路运行，在交会站转入西马铁路北上洛龙山，全程使用既有的高速线路，冬季同样有除雪车和道岔融雪装置保障。这一方案投资很少、开通很快，新城与山区之间的商务和旅游客流随之显著增长。
      en: New City is a young industrial city on the south coast and Lorond Mountain a city deep inland, and by train the trip between them used to mean a long journey with a change of trains on the way. Network planners found that the Viking Port–Beckerle and Northwest–Maslin Mountain railways already met between the two cities, so new points and signalling at the junction were enough to let trains run from one line straight onto the other. The New City–Lorond Mountain Railway therefore has no track of its own. Its trains leave the Greenmead hub in New City along the Viking Port–Beckerle line, switch to the Northwest–Maslin Mountain line at the junction and run north to Lorond Mountain, all on existing high-speed track kept open in winter by snowploughs and heated points. The scheme cost little and opened quickly, and business and leisure travel between New City and the mountains has grown markedly since.
    color: '#12A594'
    tech: { operating_speed_kmh: 300, design_speed_kmh: 350 }
    via: [div_k4s990, div_prcxzt]
