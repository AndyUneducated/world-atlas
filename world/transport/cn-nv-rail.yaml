# Railways of North Viking Island.
#
# network: intercity_rail (高速铁路 or 磁悬浮).
# via: ordered stops. A city stops at its core district (the most populous one), a district
#   at its own centre. The generator lays the line over the terrain, keeping to gentler
#   gradients than roads and tunnelling through mountains (tunnel_cost caps the per-km cost
#   of steep ground, default 2.5); every line builds its own track (one name to each stretch), and
#   stations are shared. A stop may also be a place with a site: its station,
#   named after it, stands on the track nearest the place, in its district.
# maglev (optional): true for a vacuum maglev (真空磁悬浮, the maglev standard in engineering.yaml),
#   open for an open-air maglev (磁悬浮, maglev_open). Every maglev line has 磁悬浮 in its name, a
#   vacuum one 真空磁悬浮; it runs on its own guideway and shares no track with wheeled lines.
# line (optional, maglev only): { points: [[x, y], …] } the guideway in design km, built and drawn
#   exactly as given; the stops are served where it passes nearest.
# station_names (optional): names for the station of a via entry. By default a city's
#   station is named after the city (维京港站 / Viking Port Station) and a district's after
#   the district (沙洲站 / Sandbar Station).
# color: the line's colour on cards and in station lists.
# tech: operating and design speed (km/h; in service at least 400 on wheeled lines, 500 on an
#   open-air maglev and 600 on a vacuum maglev); gauge, power, signalling and train formation
#   default to the line's standard in engineering.yaml.
# City metro lines are generated from the `metro` section of world/generator/.
railways:
  - id: rte_v7khx2
    network: intercity_rail
    maglev: open
    status: generated
    names:
      zh: 维西磁悬浮
      en: Viking Port–Northwest Maglev
      art-x-viking: Magnetbahn Veiling Havn–Nordwest
      art-x-buckham: Maglev Veiling Porto–Nordveste
    notes:
      zh: "维西磁悬浮连接最大城市维京港、首府自由市和西北，自维京港站出发，经沙洲站、自由市站到西北站，全长约二百七十公里，是北维京岛的两条露天磁悬浮之一。导轨架在露天，不封管道，列车为疾风 600 型，十二节编组、720 座，低温超导电动悬浮、长定子直线同步电机驱动，运营时速 600 公里，全自动无人驾驶，直达最快三十一分钟。线路有约 34 公里桥梁和 5 公里隧道，自由河特大桥长约 6 公里，是全线最长的桥梁，菲亚尔马克丘陵隧道长约 5 公里，是最长的隧道。高峰时段每半小时一班，年客运量二百四十万人次左右，是全岛最繁忙的线路之一。三座城市之间的商务客流和周末探亲客流占了大部分，冬季公路因暴雪封闭时客流还会明显增加。\n西北市的研究员和首府的公务员是这趟车的常客，车厢里常能看到有人摊开笔记本电脑改论文或写公文，维京港人笑称这是「博士和科长的专列」；改成磁悬浮以后车程只剩半小时，常有人论文还没改完一段就到站了。车到沙洲站时正对着自由河口，晴天傍晚，满车的人会不约而同地转头看窗外的落日。"
      en: "The Viking Port–Northwest Maglev links Viking Port, the largest city, with the capital, Freedom City, and with Northwest, running from Viking Port station through Sandbar and Freedom City to Northwest. It is about 270 km long and one of North Viking Island's two open-air maglevs. Its guideway stands in the open air with no tube; its Gale 600 trains of twelve cars and 720 seats float by low-temperature superconducting electrodynamic suspension and are driven by a long-stator linear synchronous motor at 600 km/h, fully automatic and driverless, the quickest non-stop service taking thirty-one minutes. The line has about 34 km of bridges and 5 km of tunnels; the Freedom River Bridge, about 6 km, is its longest bridge and the Fjallmark Hills Tunnel, about 5 km, its longest tunnel. At peak times a train leaves every half hour, and with some 2.4 million trips a year it is one of the busiest lines on the island. Business travel between the three cities and weekend family visits make up most of its traffic, which rises sharply whenever snow closes the roads.\nNorthwest's researchers and the capital's civil servants are its regulars, and laptops open on papers and memos are a common sight, so Viking Port teases that it is \"the doctors' and section chiefs' special\"; since it became a maglev the trip takes half an hour, and many arrive before they have finished a paragraph. The Sandbar stop looks straight out over the Freedom River's mouth, and on fine evenings the whole carriage turns as one to watch the sunset."
    background:
      zh: 维京港、自由市和西北是北维京岛往来最密切的三座城市，三城之间的公路交通在节假日常常拥堵，冬季暴雪时更是时断时续。维西高速铁路是北维京岛修建的第一条高速铁路，时速 400 公里，自维京港出发，经自由市沙洲区、首府自由市到西北，把三座城市连成一条走廊。三城之间的商务往来越来越多，开通多年后客流仍在增长，领地决定把它升级为磁悬浮。线路只有二百七十公里，真空管道省下的几分钟抵不上它的造价，于是选了导轨露天的磁悬浮，时速 600 公里，三城之间的车程缩短到半小时上下。新导轨穿过沙洲河口湿地和北河谷地时大量采用高架桥，既节约农田，也避免积雪阻断线路；导轨和道岔都装有融冰加热装置。
      en: Viking Port, Freedom City and Northwest are three of North Viking Island's most closely linked cities, and the roads between them were jammed on holidays and unreliable in winter blizzards. The Viking Port–Northwest High-Speed Railway was the island's first high-speed line, running at 400 km/h from Viking Port through Sandbar to the capital, Freedom City, and on to Northwest, making the three cities a single corridor. Business between the three cities kept growing, and so did the traffic years after opening, until the territory decided to rebuild the line as a maglev. At only about 270 km, the few minutes a vacuum tube would save were not worth its cost, so it chose an open-air maglev at 600 km/h, which brings the three cities within about half an hour of each other. Across the Sandbar estuary wetlands and the North River valley the new guideway is largely on viaduct, which saves farmland and keeps drifting snow off the line, and the guideway and its switches are heated against ice.
    color: '#3E63DD'
    tech: { operating_speed_kmh: 600, design_speed_kmh: 650 }
    via: [div_m41gwn, div_g4a8q0, div_nbrnfr, div_0yef9a]
    station_names:
      div_nbrnfr: { zh: 自由市站, en: Freedom City Station }
  - id: rte_cnfpey
    network: intercity_rail
    maglev: true
    status: generated
    names:
      zh: 维贝真空磁悬浮
      en: Viking Port–Beckerle Vacuum Maglev
      art-x-viking: Vakuum-Magnetbahn Veiling Havn–Beckerle
      art-x-buckham: Maglev a vuoto Veiling Porto–Beckerle
    notes:
      zh: "维贝真空磁悬浮是北维京岛的交通主干，沿岛南部自西向东，经维京港、塔夫鲁普库维克、新城、萨科勒到贝克勒自由贸易区，全长约七百公里，全程直达五十六分钟。导轨全线封在低真空管道里，管内气压约为大气压的十分之一，车站以气闸和管道相接；列车为流星 800 型，十节编组、620 座，高温超导电动悬浮、长定子直线同步电机驱动，运营时速 800 公里，全自动无人驾驶。线路桥隧相连，有约 120 公里桥梁和 46 公里隧道，最长的铁岗高架桥约 10 公里，最大坡度 80‰。高峰时段每 20 分钟一班，年客运量一千一百万人次左右，在岛内各线中居首位。沿线相邻城市之间的通勤客流很大，贝克勒站与港口和自贸区直接相连，商务旅客占了相当比例。\n每天清晨从新城站开出的第一班车被称作「咖啡车」，卖热咖啡和奶油面包的推车从车头走到车尾，如今推车常常还没走完一趟，车就到站了；周末从贝克勒回程的列车堆满购物袋，又成了「购物专列」。维京港和贝克勒的足球赛日，车厢里挤满穿着两队球衣的球迷，乘务员会把两队的球迷分到不同车厢。"
      en: "The Viking Port–Beckerle Vacuum Maglev is the transport backbone of North Viking Island, running west to east across the south of the island through Viking Port, Tavrupukkuvik, New City and Sakole to the Beckerle Free Trade Zone. It is about 700 km long and takes fifty-six minutes non-stop. The whole guideway is sealed in a low-vacuum tube at about a tenth of atmospheric pressure, and the stations join the tube through airlocks; its Meteor 800 trains of ten cars and 620 seats float by high-temperature superconducting electrodynamic suspension and are driven by a long-stator linear synchronous motor at 800 km/h, fully automatic and driverless. It runs from bridge to tunnel, with about 120 km of bridges and 46 km of tunnels, the longest being the Iron Knoll Viaduct, about 10 km, and grades of up to 80‰. At peak times there is a train every 20 minutes, and with some eleven million trips a year it is the busiest line within the island. Commuting between neighbouring cities is heavy, Beckerle station connects directly with the port and the free trade zone, and business travellers make up a large share.\nThe first train out of New City each morning is \"the coffee train\", a trolley of hot coffee and cream buns working its way from front to back, and these days the train often arrives before the trolley has done its round; at weekends the trains home from Beckerle are piled with shopping bags and become \"the shopping specials\". On Viking Port–Beckerle match days the carriages are packed with fans in both teams' shirts, and the attendants seat the two sets of supporters in separate coaches."
    background:
      zh: 北维京岛南部是人口最密、工商业最发达的地带，维京港、塔夫鲁普库维克、新城、萨科勒和贝克勒自由贸易区自西向东一字排开。维贝铁路原是一条时速 350 公里的高速铁路，沿岛南部串联这五座城市，是全岛的铁路主干。沿线经济越来越发达，列车越开越挤，领地决定把它升级为真空磁悬浮，首尾之间的车程从两个小时缩短到不到一小时。新导轨能爬 80‰ 的陡坡，穿过南部沿海的丘陵和众多入海河流时仍要架桥打洞，长大桥梁一座接一座。贝克勒自由贸易区和保税港区带来了大量商务客流，线路在贝克勒设有大型枢纽站，与港口和自贸区直接相连。升级后沿线相邻城市之间的通勤圈进一步扩大，沿线新城迅速发展；原先借用它轨道的新洛高速铁路则另修了自己的线路。
      en: The south of North Viking Island is its most crowded and most commercial belt, with Viking Port, Tavrupukkuvik, New City, Sakole and the Beckerle Free Trade Zone in a line from west to east. The Viking Port–Beckerle Railway was first a 350 km/h high-speed line linking all five along the south, the backbone of the island's railways. As the towns along it grew richer and its trains fuller, the territory decided to rebuild it as a vacuum maglev, cutting the journey from end to end from two hours to under one. The new guideway can climb grades of 80‰, but crossing the southern coastal hills and the many rivers running to the sea still takes bridges and tunnels, one long structure after another. The free trade zone and bonded port at Beckerle bring a great deal of business travel, and the line has a large hub station there with direct links to the port and the zone. Since the upgrade the cities along it have drawn even closer as one commuting belt and the new towns along the line have grown fast; the New City–Lorond Mountain High-Speed Railway, which used to run on its track, has built a line of its own.
    color: '#E5484D'
    tech: { operating_speed_kmh: 800, design_speed_kmh: 850 }
    via: [div_m41gwn, div_q4d6n6, div_k4s990, div_da3s38, div_k4hg7b]
    station_names:
      div_k4s990: { en: New City Station }
  - id: rte_fk2x5w
    network: intercity_rail
    status: generated
    names:
      zh: 西马高速铁路
      en: Northwest–Maslin Mountain High-Speed Railway
      art-x-viking: Schnellbahn Nordwest–Maslinberg
      art-x-buckham: Ferrovia ad alta velocità Nordveste–Maslin Tehee
    wonder:
      structure: bridge
      zh: 世界最长的轮轨铁路桥，长约 77 公里
      en: The longest wheel-on-rail railway bridge in the world, about 77 km
    notes:
      zh: "西马高速铁路是北维京岛最长的铁路，自西北站出发，经勒克尔、洛龙山、雅利基卢克河到马斯林山，全长约七百六十公里，与长夏群岛的塔纳高速铁路几乎一样长。列车为北辰 400 型，运营速度每小时 400 公里，全程直达两小时左右。线路有约 117 公里桥梁和 53 公里隧道：卡蒂尔尤阿克特大桥长约 77 公里，是全岛最长的桥梁，也是世界上最长的轮轨铁路桥；洛龙山脉隧道长约 39 公里，穿过山脉主脊；雅利基卢克河谷的冻土路段和驯鹿牧场的连续高架桥也是这条线的特色。高峰时段每半小时一班，年客运量二百二十万人次左右。客流以内陆山城与西北、勒克尔之间的旅客为主，马斯林山发射日前后还会加开前往马斯林山站的临时列车。\n跑完全程要穿过平原、山地和河谷，乘客们说「上车时看麦田，中途看雪峰，下车时看火箭」。冬天大雪封山时，这条铁路是洛龙山和雅利基卢克对外的生命线，列车上常有带着整箱面粉和药品回家的山里人。"
      en: "The Northwest–Maslin Mountain High-Speed Railway is the longest railway on North Viking Island, running from Northwest station through Lekor, Lorond Mountain and Jaalikiluk River to Maslin Mountain. At about 760 km it is almost exactly as long as the Talumaran–Nalumai High-Speed Railway in the Everlong Summer Islands. Its Polaris 400 trains run at 400 km/h and take around two hours non-stop. The line has about 117 km of bridges and 53 km of tunnels: the Katirjuaq Viaduct, about 77 km long, is the longest bridge on the island and the longest wheel-on-rail railway bridge in the world, and the Lorond Range Tunnel, about 39 km, passes under the range's main ridge; the permafrost stretches of the Jaalikiluk valley and the long viaducts over the reindeer pastures are also features of the line. At peak times there is a train every half hour, and it carries some 2.2 million trips a year, mostly between the inland mountain cities and Northwest or Lekor; around launch days at Maslin Mountain extra trains run to Maslin Mountain station.\nThe full journey crosses plains, mountains and river valleys, and passengers say \"you board among the wheatfields, pass the snow peaks and get off among the rockets\". When snow closes the mountains in winter it is the lifeline of Lorond Mountain and Jaalikiluk, and mountain folk heading home with whole cases of flour and medicine are a common sight aboard."
    background:
      zh: 西马高速铁路是北维京岛最长的铁路，自西北出发，经北岸的勒克尔，翻越洛龙山脉到洛龙山，再经雅利基卢克河通往东部的马斯林山。它的修建主要是为了让内陆山城和北部农牧区也能接入高速铁路网，并为马斯林山附近的发射中心提供大运量的人员运输。线路翻越洛龙山脉时以长隧道穿过山体；在雅利基卢克河谷跨越大片冻土，路基采用热管和隔热层保持冻土稳定，穿过驯鹿牧场时以连续高架桥通过，桥下留出迁徙通道。全线开通后，北部与东部的山城第一次与西北、首府有了全天候的快速联系；后来线路提速到每小时 400 公里。
      en: The Northwest–Maslin Mountain High-Speed Railway is North Viking Island's longest line. It runs from Northwest along the north coast to Lekor, crosses the Lorond Range to Lorond Mountain, then follows the Jaalikiluk River east to Maslin Mountain. It was built mainly to bring the inland mountain cities and the farming and herding north onto the high-speed network, and to carry large numbers of people to the launch centre near Maslin. It passes under the Lorond Range in long tunnels. In the Jaalikiluk valley it crosses wide permafrost on a roadbed kept frozen with heat pipes and insulation, and runs through the reindeer pastures on continuous viaduct with the migration routes left open beneath. Once it opened, the mountain cities of the north and east had their first fast, all-weather link to Northwest and the capital; the line has since been raised to 400 km/h.
    color: '#30A46C'
    tech: { operating_speed_kmh: 400, design_speed_kmh: 450 }
    via: [div_0yef9a, div_yjghe9, div_prcxzt, div_8emjne, div_rdypg7]
  - id: rte_cy9xmf
    network: intercity_rail
    maglev: open
    status: generated
    names:
      zh: 贝马磁悬浮
      en: Beckerle–Maslin Mountain Maglev
      art-x-viking: Magnetbahn Beckerle–Maslinberg
      art-x-buckham: Maglev Beckerle–Maslin Tehee
    notes:
      zh: "贝马磁悬浮自贝克勒站出发，经天城站北上到马斯林山站，全长约二百二十公里，是南岸港口通往东部山城最快的线路，也是北维京岛的两条露天磁悬浮之一。导轨架在露天，列车为疾风 600 型，十二节编组、720 座，运营时速 600 公里，全自动无人驾驶，全程直达二十六分钟。线路自南岸平原逐步爬升进入马斯林山区，有约 41 公里桥梁和 8 公里隧道，铁岗特大桥（约 13 公里）和铁岗山隧道（约 4 公里）分别是全线最长的桥梁和隧道。高峰时段每半小时一班，年客运量二百五十万人次左右。平日客流以往返贝克勒自贸区的商务旅客和马斯林山的航天产业职工为主；发射日前后加开临时列车，运送前往观看发射的游客。\n列车穿过铁岗山隧道时会出一阵雨、进一阵晴，天城站的站台上摆着一排免费借用的公共雨伞，下车的人顺手拿一把。发射日前后，开往马斯林山的列车格外拥挤，车上常有带着望远镜和小板凳去看火箭的家庭。"
      en: "The Beckerle–Maslin Mountain Maglev runs from Beckerle station north through Skytown to Maslin Mountain, about 220 km; it is the fastest route from the south-coast ports to the eastern mountain city and one of North Viking Island's two open-air maglevs. Its guideway stands in the open air, and its Gale 600 trains of twelve cars and 720 seats run at 600 km/h, fully automatic and driverless, taking twenty-six minutes non-stop. The line climbs gradually from the south-coast plain into the Maslin mountains, with about 41 km of bridges and 8 km of tunnels; the Iron Knoll Viaduct (about 13 km) and Iron Knoll Tunnel (about 4 km) are the longest of each. At peak times there is a train every half hour, and it carries about 2.5 million trips a year. On ordinary days its passengers are mostly business travellers to and from the Beckerle free trade zone and workers in Maslin Mountain's space industry; around launch days extra trains bring spectators to watch the launches.\nTrains run in and out of rain through the Iron Knoll Tunnel, and on the Skytown platform stands a rack of free public umbrellas that passengers pick up as they step off. Around launch days the trains to Maslin Mountain are especially crowded, often with families carrying binoculars and folding stools to watch the rocket."
    background:
      zh: 马斯林山附近的发射与降落中心需要源源不断的人员往来，而离它最近的大型港口城市是南岸的贝克勒自由贸易区。贝马铁路原是一条时速 300 公里的高速铁路，自贝克勒出发，经天城北上马斯林山，是连接南岸港口与东部山城的捷径。自贸区和航天产业越做越大，领地把它升级为导轨露天的磁悬浮，时速 600 公里，贝克勒到马斯林山不到半小时。线路自南岸平原逐步爬升进入马斯林山区，沿途以桥梁和隧道跨越山谷和山嘴。发射日前后，线路会加开临时列车，运送前往观看发射的游客。它与维贝、西马、维西三条线路在车站相接，围成环绕全岛的铁路网。
      en: The launch and landing centre near Maslin Mountain needs a steady flow of people, and the nearest large port city is the Beckerle Free Trade Zone on the south coast. The Beckerle–Maslin Mountain Railway was first a 300 km/h high-speed line from Beckerle through Skytown north to Maslin Mountain, the short cut between the southern port and the eastern mountain city. As the free trade zone and the space industry grew, the territory rebuilt it as an open-air maglev at 600 km/h, bringing Maslin Mountain within half an hour of Beckerle. It climbs steadily from the coastal plain into the Maslin uplands, bridging valleys and tunnelling through spurs on the way. Around launch days extra trains run for the crowds who come to watch. Meeting the Viking Port–Beckerle, Northwest–Maslin Mountain and Viking Port–Northwest lines at their stations, it closes a rail ring around the whole island.
    color: '#F76B15'
    tech: { operating_speed_kmh: 600, design_speed_kmh: 650 }
    via: [div_k4hg7b, div_ygk521, div_rdypg7]
  - id: rte_5pkw2p
    network: intercity_rail
    status: generated
    names:
      zh: 自勒高速铁路
      en: Freedom City–Lekor High-Speed Railway
      art-x-viking: Schnellbahn Freistad–Lekor
      art-x-buckham: Ferrovia ad alta velocità Frei–Lekor
    notes:
      zh: "自勒高速铁路自首府自由市站出发，经北河站到北岸港口勒克尔站，全长约二百六十公里，列车为北辰 400 型，运营速度每小时 400 公里，全程直达四十多分钟。线路沿开阔的北河谷地铺设，几乎全为路基，没有一座隧道，北河高架桥长约 6 公里，是全线最长的桥梁；全程铺设自己的轨道，在勒克尔站与西马高速铁路换乘。高峰时段每半小时一班，年客运量五十多万人次，是岛内客流较少的铁路，但冬季公路因暴雪封闭时，它是首府与北岸之间最可靠的交通方式。北河站是谷地居民进城的主要门户，周末常有前往北河观看鲑鱼洄游的游客。\n丰收节开幕那天，首府送给勒克尔的书和奶冻就搭这趟车去「回娘家」，车厢里还会挂上麦穗和彩带。平日里北河站上车的多是去首府上班的家庭，车窗外的北河谷地一年四季换着颜色：春天的油菜花、夏天的牧场、秋天的麦田和冬天的雪原。"
      en: "The Freedom City–Lekor High-Speed Railway runs from Freedom City station in the capital through North River to Lekor, the north-coast port, about 260 km; its Polaris 400 trains run at 400 km/h and take a little over forty minutes non-stop. It follows the broad North River valley almost entirely on embankment, without a single tunnel; the North River Viaduct, about 6 km, is its longest bridge, and it runs on its own track all the way, meeting the Northwest–Maslin Mountain High-Speed Railway at Lekor station. At peak times there is a train every half hour. With a little over half a million trips a year it is one of the quieter lines on the island, but when snow closes the roads it is the most reliable link between the capital and the north coast. North River station is the valley's main gateway to the city, and at weekends it brings visitors to watch the salmon run.\nOn the opening day of the Harvest Festival the capital's gifts of books and milk jelly ride this train to \"visit the old home\", the carriages hung with ears of wheat and ribbons. On ordinary days North River's passengers are mostly families commuting to the capital, and the valley outside changes colour with the seasons: rapeseed in spring, pasture in summer, wheat in autumn and snow in winter."
    background:
      zh: 自勒高速铁路自首府自由市出发，经北河区通往北岸港口勒克尔，与自勒高速走同一条北河谷地。谷地开阔平坦，线路几乎全部铺设在路基上，没有一座隧道，是北维京岛造价最低的高速铁路之一。修建它的初衷是为首府与北岸港口之间提供可靠的冬季交通：高速公路遇暴雪需要封闭除雪，铁路则可借助融雪装置照常运行。线路跨越北河时采用大跨度桥梁，不在河中立墩，以免影响鲑鱼洄游。开通后谷地城镇有了直达首府的列车，北河站也成为谷地居民进城的主要门户。
      en: The Freedom City–Lekor High-Speed Railway runs from the capital through North River District to the north-coast port of Lekor, sharing the North River valley with the Freedom–Lekor Expressway. The valley is wide and flat, so the line lies almost entirely on embankment without a single tunnel, one of the cheapest high-speed lines on the island. It was built to give the capital and the northern port a link that works all winter, since the expressway has to close for snow clearing in blizzards while the railway keeps running with its snow-melting equipment. The North River is crossed on long spans with no piers in the river, so the salmon runs are not disturbed. The valley's towns now have direct trains to the capital, and North River station has become their gateway to the city.
    color: '#8E4EC6'
    tech: { operating_speed_kmh: 400, design_speed_kmh: 450 }
    via: [div_nbrnfr, div_b1dx32, div_yjghe9]
    station_names:
      div_nbrnfr: { zh: 自由市站, en: Freedom City Station }
  - id: rte_nx028x
    network: intercity_rail
    status: generated
    names:
      zh: 新洛高速铁路
      en: New City–Lorond Mountain High-Speed Railway
      art-x-viking: Schnellbahn Neustad–Lorondberg
      art-x-buckham: Ferrovia ad alta velocità Neu Teatu–Lorond Tehee
    notes:
      zh: "新洛高速铁路自新城青坪区的新城站出发北上，到达洛龙山站，全长约一百六十公里，列车为北辰 400 型，运营速度每小时 400 公里，全程直达半小时左右。全程都是它自己的线路，北苑特大桥长约 27 公里，是全线最长的桥梁，全线没有隧道。高峰时段每半小时一班，年客运量近五十万人次。客流以新城与山区之间的商务旅客、冬季前往洛龙山滑雪的游客为主；在洛龙山站可换乘西马高速铁路。\n新城的年轻家庭周末常坐这趟车去洛龙山滑雪或看冰瀑，车厢里婴儿车和滑雪板挤在一起，乘务员开玩笑说这是「从婴儿车之城开往雪道的列车」。"
      en: "The New City–Lorond Mountain High-Speed Railway leaves New City station in Greenmead heading north and runs to Lorond Mountain station. It is about 160 km long, and its Polaris 400 trains run at 400 km/h, taking around half an hour non-stop. The line is its own all the way, with the North Gardens Viaduct, about 27 km, its longest bridge and no tunnels at all. At peak times there is a train every half hour, and it carries nearly half a million trips a year, mostly business travel between New City and the mountains and, in winter, skiers bound for Lorond Mountain. At Lorond Mountain station it meets the Northwest–Maslin Mountain line.\nNew City's young families often take it at weekends to ski or see the frozen falls at Lorond Mountain, prams and skis crammed in together, and the attendants joke that it is \"the train from Pram City to the piste\"."
    background:
      zh: 新城是南岸新兴的工业城市，洛龙山是内陆的山城，过去两地之间乘火车要在中途下车换乘，耗时很长。线网规划时发现，维贝铁路与西马高速铁路在两城之间已经相互交会，只需在交会站调整道岔和信号，列车就能从一条干线直接转入另一条，新洛高速铁路因此起初没有另建正线，全程借用两条干线的轨道。后来维贝铁路升级为真空磁悬浮，轮轨列车不能再走它的导轨，新洛高速铁路便从新城青坪区枢纽另修了一条自己的线路，以长约 27 公里的北苑特大桥跨过沿途的低地，一路北上到洛龙山，不再借用别的线路，冬季有除雪车和道岔融雪装置保障。新城与山区之间的商务和旅游客流随之显著增长。
      en: New City is a young industrial city on the south coast and Lorond Mountain a city deep inland, and by train the trip between them used to mean a long journey with a change of trains on the way. Network planners found that the Viking Port–Beckerle and Northwest–Maslin Mountain railways already met between the two cities, so new points and signalling at the junction were enough to let trains run from one line straight onto the other, and at first the New City–Lorond Mountain High-Speed Railway had no track of its own. When the Viking Port–Beckerle line was rebuilt as a vacuum maglev, wheeled trains could no longer use it, so the New City–Lorond Mountain line built its own track from the Greenmead hub in New City, crossing the low ground on the way on the North Gardens Viaduct, about 27 km long, and running north all the way to Lorond Mountain on track of its own, kept open in winter by snowploughs and heated points. Business and leisure travel between New City and the mountains has grown markedly since.
    color: '#12A594'
    tech: { operating_speed_kmh: 400, design_speed_kmh: 450 }
    via: [div_k4s990, div_prcxzt]
  - id: rte_0qtt3d
    network: intercity_rail
    status: generated
    names:
      zh: 马斯林山航天高速铁路
      en: Maslin Mountain Aerospace High-Speed Railway
      art-x-viking: Raumfahrt-Schnellbahn Maslinberg
      art-x-buckham: Ferrovia aerospaziale ad alta velocità di Maslin Tehee
    wonder:
      zh: 世界唯一的航天铁路，把箭体、发动机和推进剂直接送进航天工厂
      en: The only space railway in the world, taking rocket stages, engines and propellant straight into the space works
    notes:
      zh: "马斯林山航天高速铁路自东营站出发，经马斯林山站西行到西坪站，全长约一百五十公里，列车为北辰 400 型，运营速度每小时 400 公里，全程直达二十六分钟，把东营的空军基地、后勤基地与西坪的发射与降落中心、航天产业区连在一起。线路穿越平坦的马斯林盆地，以路基和低桥为主，和平高架桥长约 2.8 公里，是全线最长的桥梁。平日每半小时一班，客流以基地官兵和航天工厂职工为主，每年三万人次左右；发射日前后信号系统与发射中心联动，加开密集班次。夜间客车停运后，货运列车经专用线把箭体、发动机和推进剂槽车直接送进西坪的工厂。\n乘客多是穿着军装或工装的军人和工程师，发射日的早班车最安静，大家都在看手机上的倒计时。列车从西坪站开出时，车窗正对着三座发射台，常坐的人说，看一眼发射台上有没有火箭，就知道今天的车会不会挤。"
      en: "The Maslin Mountain Aerospace High-Speed Railway runs west from East Camp station through Maslin Mountain station to West Heath, about 150 km; its Polaris 400 trains run at 400 km/h and take twenty-six minutes non-stop, linking the air base and supply depot at East Camp with the launch and landing centre and the space industry zone at West Heath. It crosses the flat Maslin basin mostly on embankment and low bridges; the Peace Viaduct, about 2.8 km, is its longest bridge. On ordinary days there is a train every half hour, carrying mostly service personnel and space-plant workers, some 30,000 trips a year. Around launches its signalling is linked to the launch centre and extra trains run at short intervals. At night, after the passenger trains stop, freight trains take rocket stages, engines and propellant tank wagons along sidings straight into the West Heath plants.\nMost passengers are soldiers and engineers in uniform or overalls, and the early train on a launch day is the quietest, everyone watching the countdown on their phones. Leaving West Heath the windows face the three launch pads, and regulars say one glance at whether a rocket is on the pad tells you how crowded the train will be."
    background:
      zh: 西坪区的发射与降落中心和周边的火箭总装厂、推进剂厂、飞船整修厂聚集了上万名职工，每逢发射日还有大批观众涌来，马斯林山高速常常拥堵。马斯林山航天高速铁路自东营区出发，经马斯林山城区西行到西坪，把东营的空军基地、后勤基地与西坪的航天产业区连在一起。线路穿越平坦的马斯林盆地，以路基和低桥为主，建设难度不大；为配合发射，沿线的信号系统与发射中心联动，发射前后可以加开密集的班次。航天产业区的铁路专用线与正线相接，夜间客车停运后，货运列车把箭体、发动机和推进剂槽车直接送进工厂。开通后，西坪与城区之间形成了半小时通勤圈，西坪人口随之快速增长。
      en: The launch and landing centre in West Heath and the rocket assembly, propellant and spacecraft refurbishment plants around it employ more than ten thousand people, and launch days bring crowds of spectators on top, so the Maslin Expressway was often jammed. The Maslin Mountain Aerospace High-Speed Railway runs west from East Camp through the city of Maslin Mountain to West Heath, joining the air base and supply depot at East Camp to the West Heath space industry zone. It crosses the flat Maslin basin mostly on embankment and low bridges and was not hard to build. Its signalling is linked to the launch centre so that a dense timetable of extra trains can run before and after each launch. The space industry zone's sidings join the main line, and at night, once passenger trains have stopped, freight trains take rocket stages, engines and propellant tankers straight into the plants. Since it opened West Heath has been within half an hour of the city, and its population has grown fast.
    color: '#0090FF'
    tech: { operating_speed_kmh: 400, design_speed_kmh: 450 }
    via: [div_tc0ngk, div_rdypg7, div_nwke3f]
