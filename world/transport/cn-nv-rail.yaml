# Railways of North Viking Island.
#
# network: intercity_rail (城际铁路).
# via: ordered stops. A city stops at its core district (the most populous one), a district
#   at its own centre. The generator lays the line over the terrain, keeping to gentler
#   gradients than roads and tunnelling through mountains (tunnel_cost caps the per-km cost
#   of steep ground, default 2.5); later lines run on the track of earlier ones where their
#   corridors meet, and stations are shared.
# station_names (optional): names for the station of a via entry. By default a city's
#   station is named after the city (维京港站 / Viking Port Station) and a district's after
#   the district (沙洲站 / Sandbar Station).
# color: the line's colour on cards and in station lists.
# tech: operating and design speed (km/h, 300–400 in service); gauge, power, signalling and
#   train formation default to the intercity_rail standard in engineering.yaml.
# City metro lines are generated from the `metro` section of world/generator/.
railways:
  - id: rte_v7khx2
    network: intercity_rail
    status: generated
    names:
      zh: 维西城际铁路
      en: Viking Port–Northwest Intercity Railway
      art-x-viking: Intercity-Bahn Veiling Havn–Nordwest
      art-x-buckham: Ferrovia Intercity Veiling Porto–Nordveste
    notes:
      zh: 维西城际铁路连接最大城市维京港、首府自由市和西北，自维京港站出发，经沙洲站、自由市站到西北站，全长约二百七十公里，是全岛运营速度最高的铁路，列车以每小时 400 公里运行，直达最快四十多分钟。沙洲特大桥跨过沙洲河口湿地，是全线最长的桥梁，贝格兰丘陵隧道是最长的隧道。高峰时段每半小时一班，八辆编组的北辰 400 型列车可以重联成十六辆，年客运量二百四十万人次左右，是全岛最繁忙的铁路之一。三座城市之间的商务客流和周末探亲客流占了大部分，冬季公路因暴雪封闭时客流还会明显增加。
      en: The Viking Port–Northwest Intercity Railway links Viking Port, the largest city, with the capital, Freedom City, and with Northwest, running from Viking Port station through Sandbar and Freedom City to Northwest. It is about 270 km long and the fastest railway on the island, with trains running at 400 km/h and the quickest non-stop service taking just over forty minutes. The Sandbar Viaduct across the Sandbar estuary wetlands is its longest bridge and the Bergland Hills Tunnel its longest tunnel. At peak times a train leaves every half hour, and the eight-car Polaris 400 sets can run coupled as sixteen. With some 2.4 million trips a year it is one of the busiest lines on the island. Business travel between the three cities and weekend family visits make up most of its traffic, which rises sharply whenever snow closes the roads.
    background:
      zh: 维京港、自由市和西北是北维京岛往来最密切的三座城市，三城之间的公路交通在节假日常常拥堵，冬季暴雪时更是时断时续。维西城际铁路是北维京岛修建的第一条高速铁路，自维京港出发，经自由市沙洲区、首府自由市到西北，把三座城市连成一条走廊。线路穿过沙洲河口湿地和北河谷地时大量采用高架桥，既节约农田，也避免冬季积雪阻断线路；全线道岔和接触网配有融冰装置。开通后三城之间的旅客大量转向铁路，这条线也是全岛客流最大的铁路之一。
      en: Viking Port, Freedom City and Northwest are three of North Viking Island's most closely linked cities, and the roads between them were jammed on holidays and unreliable in winter blizzards. The Viking Port–Northwest Intercity Railway was the island's first high-speed line, running from Viking Port through Sandbar to the capital, Freedom City, and on to Northwest, making the three cities a single corridor. Across the Sandbar estuary wetlands and the North River valley it is largely on viaduct, which saves farmland and keeps drifting snow off the track, and all its points and overhead line have de-icing equipment. Since it opened most travel between the three cities has moved to the train, and it is one of the island's busiest lines.
    color: '#3E63DD'
    tech: { operating_speed_kmh: 400, design_speed_kmh: 450 }
    via: [div_m41gwn, div_g4a8q0, div_nbrnfr, div_0yef9a]
    station_names:
      div_nbrnfr: { zh: 自由市站, en: Freedom City Station }
  - id: rte_cnfpey
    network: intercity_rail
    status: generated
    names:
      zh: 维贝铁路
      en: Viking Port–Beckerle Railway
      art-x-viking: Bahn Veiling Havn–Beckerle
      art-x-buckham: Ferrovia Veiling Porto–Beckerle
    notes:
      zh: 维贝铁路是北维京岛的铁路主干，沿岛南部自西向东，经维京港、奥克西诺、新城、萨科勒到贝克勒自由贸易区，全长约七百公里，运营速度每小时 350 公里，全程直达约两小时。线路桥隧相连，杉岭特大桥和洛龙山脉隧道都是全岛最长的铁路桥隧之一。高峰时段每半小时一班，年客运量一千一百万人次左右，在岛内铁路中居首位。沿线相邻城市之间的通勤客流很大，贝克勒站与港口和自贸区直接相连，商务旅客占了相当比例；新洛铁路的列车也借用它的一段线路。
      en: The Viking Port–Beckerle Railway is the main line of North Viking Island, running west to east across the south of the island through Viking Port, Oxino, New City and Sakole to the Beckerle Free Trade Zone. It is about 700 km long, with trains at 350 km/h taking some two hours non-stop. It runs from bridge to tunnel, and the Fir Ridge Viaduct and the Lorond Range Tunnel are among the longest railway structures on the island. At peak times there is a train every half hour, and with some eleven million trips a year it is the busiest railway within the island. Commuting between neighbouring cities is heavy, Beckerle station connects directly with the port and the free trade zone, and business travellers make up a large share; New City–Lorond Mountain trains also use part of its line.
    background:
      zh: 北维京岛南部是人口最密、工商业最发达的地带，维京港、奥克西诺、新城、萨科勒和贝克勒自由贸易区自西向东一字排开。维贝铁路沿岛南部自西向东，串联这五座城市，是全岛的铁路主干。线路要穿过南部沿海的丘陵和众多入海河流，桥隧比例很高，长大桥梁和隧道一座接一座。贝克勒自由贸易区和保税港区带来了大量商务客流，铁路为此在贝克勒设置了大型枢纽站，与港口和自贸区直接相连。开通后沿线相邻城市之间形成了便捷的通勤圈，沿线新城迅速发展。
      en: The south of North Viking Island is its most crowded and most commercial belt, with Viking Port, Oxino, New City, Sakole and the Beckerle Free Trade Zone in a line from west to east. The Viking Port–Beckerle Railway runs along the south from west to east and links all five, the backbone of the island's railways. It has to cross the southern coastal hills and many rivers running to the sea, so a large share of it is bridge and tunnel, one long structure after another. The free trade zone and bonded port at Beckerle bring a great deal of business travel, and the line has a large hub station there with direct links to the port and the zone. Neighbouring cities along it are now within easy commuting distance, and the new towns along the line have grown fast.
    color: '#E5484D'
    tech: { operating_speed_kmh: 350, design_speed_kmh: 400 }
    via: [div_m41gwn, div_q4d6n6, div_k4s990, div_da3s38, div_k4hg7b]
    station_names:
      div_k4s990: { en: New City Station }
  - id: rte_fk2x5w
    network: intercity_rail
    status: generated
    names:
      zh: 西马铁路
      en: Northwest–Maslin Mountain Railway
      art-x-viking: Bahn Nordwest–Maslinberg
      art-x-buckham: Ferrovia Nordveste–Maslin Tehee
    notes:
      zh: 西马铁路是北维京岛最长的铁路，自西北站出发，经勒克尔、洛龙山、厄定河到马斯林山，全长约九百四十公里，运营速度每小时 300 公里，全程直达三小时十分钟左右。龙关特大桥长七十多公里，是全岛最长的桥梁，洛龙山脉隧道穿过山脉主脊；厄定河谷的冻土路段和驯鹿牧场的连续高架桥也是这条线的特色。高峰时段每半小时一班，年客运量二百二十万人次左右。客流以内陆山城与西北、勒克尔之间的旅客为主，马斯林山发射日前后还会加开前往马斯林山站的临时列车。
      en: The Northwest–Maslin Mountain Railway is the longest railway on North Viking Island, running from Northwest station through Lekor, Lorond Mountain and Erding River to Maslin Mountain. It is about 940 km long, with trains at 300 km/h taking around three hours ten minutes non-stop. The Dragon Pass Viaduct, more than 70 km long, is the longest bridge on the island, and the Lorond Range Tunnel passes under the range's main ridge; the permafrost stretches of the Erding valley and the long viaducts over the reindeer pastures are also features of the line. At peak times there is a train every half hour, and it carries some 2.2 million trips a year, mostly between the inland mountain cities and Northwest or Lekor; around launch days at Maslin Mountain extra trains run to Maslin Mountain station.
    background:
      zh: 西马铁路是北维京岛最长的铁路，自西北出发，经北岸的勒克尔，翻越洛龙山脉到洛龙山，再经厄定河通往东部的马斯林山。它的修建主要是为了让内陆山城和北部农牧区也能接入高速铁路网，并为马斯林山附近的发射中心提供大运量的人员运输。线路翻越洛龙山脉时以长隧道穿过山体；在厄定河谷跨越大片冻土，路基采用热管和隔热层保持冻土稳定，穿过驯鹿牧场时以连续高架桥通过，桥下留出迁徙通道。全线开通后，北部与东部的山城第一次与西北、首府有了全天候的快速联系。
      en: The Northwest–Maslin Mountain Railway is North Viking Island's longest line. It runs from Northwest along the north coast to Lekor, crosses the Lorond Range to Lorond Mountain, then follows the Erding River east to Maslin Mountain. It was built mainly to bring the inland mountain cities and the farming and herding north onto the high-speed network, and to carry large numbers of people to the launch centre near Maslin. It passes under the Lorond Range in long tunnels. In the Erding valley it crosses wide permafrost on a roadbed kept frozen with heat pipes and insulation, and runs through the reindeer pastures on continuous viaduct with the migration routes left open beneath. Once it opened, the mountain cities of the north and east had their first fast, all-weather link to Northwest and the capital.
    color: '#30A46C'
    tech: { operating_speed_kmh: 300, design_speed_kmh: 350 }
    via: [div_0yef9a, div_yjghe9, div_prcxzt, div_8emjne, div_rdypg7]
  - id: rte_cy9xmf
    network: intercity_rail
    status: generated
    names:
      zh: 贝马铁路
      en: Beckerle–Maslin Mountain Railway
      art-x-viking: Bahn Beckerle–Maslinberg
      art-x-buckham: Ferrovia Beckerle–Maslin Tehee
    notes:
      zh: 贝马铁路自贝克勒站出发，经天城站北上到马斯林山站，全长约二百五十公里，运营速度每小时 300 公里，全程直达不到一小时，是南岸港口通往东部山城最快的线路。天台特大桥和天台隧道分别是全线最长的桥梁和隧道，线路自南岸平原逐步爬升进入马斯林山区。高峰时段每半小时一班，年客运量二百四十万人次左右。平日客流以往返贝克勒自贸区的商务旅客和马斯林山的航天产业职工为主；发射日前后加开临时列车，运送前往观看发射的游客。它与维贝、西马、维西三条铁路共同构成环绕全岛的铁路环线。
      en: The Beckerle–Maslin Mountain Railway runs from Beckerle station north through Skytown to Maslin Mountain, about 250 km at 300 km/h, under an hour non-stop; it is the fastest route from the south-coast ports to the eastern mountain city. The Sky Terrace Viaduct and Sky Terrace Tunnel are the longest of each on the line, which climbs gradually from the south-coast plain into the Maslin mountains. At peak times there is a train every half hour, and it carries about 2.4 million trips a year. On ordinary days its passengers are mostly business travellers to and from the Beckerle free trade zone and workers in Maslin Mountain's space industry; around launch days extra trains bring spectators to watch the launches. With the Viking Port–Beckerle, Northwest–Maslin Mountain and Viking Port–Northwest lines it completes a rail ring round the island.
    background:
      zh: 马斯林山附近的发射与降落中心需要源源不断的人员往来，而离它最近的大型港口城市是南岸的贝克勒自由贸易区。贝马铁路自贝克勒出发，经天城北上马斯林山，是连接南岸港口与东部山城的捷径。线路自南岸平原逐步爬升进入马斯林山区，在天城以北以桥梁和隧道跨越山谷和山嘴，坡度按高速铁路标准严格控制。发射日前后，线路会加开临时列车，运送前往观看发射的游客。它开通后，与维贝、西马、维西三条铁路共同构成环绕全岛的铁路环线。
      en: The launch and landing centre near Maslin Mountain needs a steady flow of people, and the nearest large port city is the Beckerle Free Trade Zone on the south coast. The Beckerle–Maslin Mountain Railway runs from Beckerle through Skytown north to Maslin Mountain, the short cut between the southern port and the eastern mountain city. It climbs steadily from the coastal plain into the Maslin uplands, bridging valleys and tunnelling through spurs north of Skytown, with its gradients held strictly within high-speed limits. Around launch days extra trains run for the crowds who come to watch. With it, the Viking Port–Beckerle, Northwest–Maslin Mountain and Viking Port–Northwest lines close a rail ring around the whole island.
    color: '#F76B15'
    tech: { operating_speed_kmh: 300, design_speed_kmh: 350 }
    via: [div_k4hg7b, div_ygk521, div_rdypg7]
  - id: rte_5pkw2p
    network: intercity_rail
    status: generated
    names:
      zh: 自勒城际铁路
      en: Freedom City–Lekor Intercity Railway
      art-x-viking: Intercity-Bahn Freistad–Lekor
      art-x-buckham: Ferrovia Intercity Frei–Lekor
    notes:
      zh: 自勒城际铁路自首府自由市站出发，经北河站到北岸港口勒克尔站，全长约三百三十公里，运营速度每小时 350 公里，全程直达一小时左右。线路沿开阔的北河谷地铺设，几乎全为路基，没有一座隧道，北河高架桥是全线最长的桥梁。高峰时段每半小时一班，年客运量五十多万人次，是岛内客流较少的铁路，但冬季公路因暴雪封闭时，它是首府与北岸之间最可靠的交通方式。北河站是谷地居民进城的主要门户，周末常有前往北河观看鲑鱼洄游的游客。
      en: The Freedom City–Lekor Intercity Railway runs from Freedom City station in the capital through North River to Lekor, the north-coast port, about 330 km at 350 km/h, roughly an hour non-stop. It follows the broad North River valley almost entirely on embankment, without a single tunnel; the North River Viaduct is its longest bridge. At peak times there is a train every half hour. With a little over half a million trips a year it is one of the quieter lines on the island, but when snow closes the roads it is the most reliable link between the capital and the north coast. North River station is the valley's main gateway to the city, and at weekends it brings visitors to watch the salmon run.
    background:
      zh: 自勒城际铁路自首府自由市出发，经北河区通往北岸港口勒克尔，与自勒高速走同一条北河谷地。谷地开阔平坦，线路几乎全部铺设在路基上，没有一座隧道，是北维京岛造价最低的高速铁路之一。修建它的初衷是为首府与北岸港口之间提供可靠的冬季交通：高速公路遇暴雪需要封闭除雪，铁路则可借助融雪装置照常运行。线路跨越北河时采用大跨度桥梁，不在河中立墩，以免影响鲑鱼洄游。开通后谷地城镇有了直达首府的列车，北河站也成为谷地居民进城的主要门户。
      en: The Freedom City–Lekor Intercity Railway runs from the capital through North River District to the north-coast port of Lekor, sharing the North River valley with the Freedom–Lekor Expressway. The valley is wide and flat, so the line lies almost entirely on embankment without a single tunnel, one of the cheapest high-speed lines on the island. It was built to give the capital and the northern port a link that works all winter, since the expressway has to close for snow clearing in blizzards while the railway keeps running with its snow-melting equipment. The North River is crossed on long spans with no piers in the river, so the salmon runs are not disturbed. The valley's towns now have direct trains to the capital, and North River station has become their gateway to the city.
    color: '#8E4EC6'
    tech: { operating_speed_kmh: 350, design_speed_kmh: 400 }
    via: [div_nbrnfr, div_b1dx32, div_yjghe9]
    station_names:
      div_nbrnfr: { zh: 自由市站, en: Freedom City Station }
  - id: rte_nx028x
    network: intercity_rail
    status: generated
    names:
      zh: 新洛铁路
      en: New City–Lorond Mountain Railway
      art-x-viking: Bahn Neustad–Lorondberg
      art-x-buckham: Ferrovia Neu Teatu–Lorond Tehee
    notes:
      zh: 新洛铁路自新城青坪区的新城站出发，先沿维贝铁路运行，在两条干线的交会站转入西马铁路北上，到达洛龙山站，全长约二百九十公里，运营速度每小时 300 公里，全程直达一小时左右。它没有自己的正线，全程借用既有的高速线路，没有自建一座桥梁或隧道。高峰时段每半小时一班，年客运量近五十万人次。客流以新城与山区之间的商务旅客、冬季前往洛龙山滑雪的游客为主；交会站的道岔和信号与两条干线统一调度，列车转线时不必停车。
      en: The New City–Lorond Mountain Railway leaves New City station in Greenmead, runs first on the Viking Port–Beckerle line, then switches at the junction of the two main lines onto the Northwest–Maslin Mountain line and heads north to Lorond Mountain station. It is about 290 km long, with trains at 300 km/h taking around an hour non-stop. It has no track of its own and runs entirely on existing high-speed lines, without a single bridge or tunnel built for it. At peak times there is a train every half hour, and it carries nearly half a million trips a year, mostly business travel between New City and the mountains and, in winter, skiers bound for Lorond Mountain. The junction's points and signals are controlled together with both main lines, so trains change lines without stopping.
    background:
      zh: 新城是南岸新兴的工业城市，洛龙山是内陆的山城，过去两地之间乘火车要在中途下车换乘，耗时很长。线网规划时发现，维贝铁路与西马铁路在两城之间已经相互交会，只需在交会站调整道岔和信号，列车就能从一条干线直接转入另一条。新洛铁路因此没有另建正线：列车从新城青坪区枢纽出发，先沿维贝铁路运行，在交会站转入西马铁路北上洛龙山，全程使用既有的高速线路，冬季同样有除雪车和道岔融雪装置保障。这一方案投资很少、开通很快，新城与山区之间的商务和旅游客流随之显著增长。
      en: New City is a young industrial city on the south coast and Lorond Mountain a city deep inland, and by train the trip between them used to mean a long journey with a change of trains on the way. Network planners found that the Viking Port–Beckerle and Northwest–Maslin Mountain railways already met between the two cities, so new points and signalling at the junction were enough to let trains run from one line straight onto the other. The New City–Lorond Mountain Railway therefore has no track of its own. Its trains leave the Greenmead hub in New City along the Viking Port–Beckerle line, switch to the Northwest–Maslin Mountain line at the junction and run north to Lorond Mountain, all on existing high-speed track kept open in winter by snowploughs and heated points. The scheme cost little and opened quickly, and business and leisure travel between New City and the mountains has grown markedly since.
    color: '#12A594'
    tech: { operating_speed_kmh: 300, design_speed_kmh: 350 }
    via: [div_k4s990, div_prcxzt]
  - id: rte_0qtt3d
    network: intercity_rail
    status: generated
    names:
      zh: 马斯林山航天铁路
      en: Maslin Mountain Aerospace Railway
      art-x-viking: Raumfahrtbahn Maslinberg
      art-x-buckham: Ferrovia Aerospaziale di Maslin Tehee
    notes:
      zh: 马斯林山航天铁路自东营站出发，经马斯林山站西行到西坪站，全长约一百八十公里，运营速度每小时 300 公里，全程直达四十分钟，把东营的空军基地、后勤基地与西坪的发射与降落中心、航天产业区连在一起。线路穿越平坦的马斯林盆地，以路基和低桥为主，西坪高架桥是全线最长的桥梁。平日每半小时一班，客流以基地官兵和航天工厂职工为主，年客运量不大；发射日前后信号系统与发射中心联动，加开密集班次。夜间客车停运后，货运列车经专用线把箭体、发动机和推进剂槽车直接送进西坪的工厂。
      en: The Maslin Mountain Aerospace Railway runs west from East Camp station through Maslin Mountain station to West Heath, about 180 km at 300 km/h, forty minutes non-stop, linking the air base and supply depot at East Camp with the launch and landing centre and the space industry zone at West Heath. It crosses the flat Maslin basin mostly on embankment and low bridges; the West Heath Viaduct is its longest bridge. On ordinary days there is a train every half hour, carrying mostly service personnel and space-plant workers, and its yearly ridership is modest. Around launches its signalling is linked to the launch centre and extra trains run at short intervals. At night, after the passenger trains stop, freight trains take rocket stages, engines and propellant tank wagons along sidings straight into the West Heath plants.
    background:
      zh: 西坪区的发射与降落中心和周边的火箭总装厂、推进剂厂、飞船整修厂聚集了上万名职工，每逢发射日还有大批观众涌来，马斯林山高速常常拥堵。马斯林山航天铁路自东营区出发，经马斯林山城区西行到西坪，把东营的空军基地、后勤基地与西坪的航天产业区连在一起。线路穿越平坦的马斯林盆地，以路基和低桥为主，建设难度不大；为配合发射，沿线的信号系统与发射中心联动，发射前后可以加开密集的班次。航天产业区的铁路专用线与正线相接，夜间客车停运后，货运列车把箭体、发动机和推进剂槽车直接送进工厂。开通后，西坪与城区之间形成了半小时通勤圈，西坪人口随之快速增长。
      en: The launch and landing centre in West Heath and the rocket assembly, propellant and spacecraft refurbishment plants around it employ more than ten thousand people, and launch days bring crowds of spectators on top, so the Maslin Expressway was often jammed. The Maslin Mountain Aerospace Railway runs west from East Camp through the city of Maslin Mountain to West Heath, joining the air base and supply depot at East Camp to the West Heath space industry zone. It crosses the flat Maslin basin mostly on embankment and low bridges and was not hard to build. Its signalling is linked to the launch centre so that a dense timetable of extra trains can run before and after each launch. The space industry zone's sidings join the main line, and at night, once passenger trains have stopped, freight trains take rocket stages, engines and propellant tankers straight into the plants. Since it opened West Heath has been within half an hour of the city, and its population has grown fast.
