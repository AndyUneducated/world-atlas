# Cross-territory routes (跨领地通道). National expressways between territories are numbered in
# their own series, G-XTR-1.., under the national expressway sign with XTR in the header.
#
# crossing: the straight undersea tunnel between the two territories, given by its portal in each
#   territory ([x, y] design km in that territory's generator frame, snapped to the nearest land).
#   via runs through the stops of one territory, then the other; each territory routes its own
#   stops to its portal, and the tunnel joins the two parts.
routes:
  - id: rte_fk0z8e
    ref: G-XTR-1
    network: national_expressway
    class: motorway
    status: generated
    names:
      zh: 维长高速
      en: Viking Port–Longship Expressway
      art-x-viking: Autobahn Veiling Havn–Langskip
      art-x-buckham: Autostrada Veiling Porto–Navelunga
    notes:
      zh: 维长高速是北维京岛与维京群岛之间唯一的陆路，自维京港瓦尔维克区入地，一条直线穿越海峡，到长船福恩斯塔德区出地面，全长约二百一十公里，全部位于维京海底公路隧道之中，全程一个半小时左右。隧道为双洞单向，中间设服务隧道，沿线每隔一段设有横通道和紧急避难所。全线双向十二车道，全程限速 140 公里。车流以两领地之间的货车、商务车辆和自驾旅客为主，日均车流稳定，不受海上风浪影响；隧道由维京海峡通道公司统一管理和收费。
      en: The Viking Port–Longship Expressway is the only land link between North Viking Island and the Viking Islands. It goes underground at Walvik in Viking Port and runs in one straight line beneath the strait to surface in Longship's Old Town. It is about 210 km long, all of it inside the Viking Undersea Road Tunnel, and takes about an hour and a half. The tunnel has two one-way bores with a service tunnel between them, and cross-passages and emergency refuges at regular intervals. It has six lanes each way and a 140 km/h limit throughout. Its traffic is mostly lorries, business travel and private drivers between the two territories, steady from day to day and unaffected by wind or waves; the Viking Strait Link Company runs the tunnel and collects its tolls.
    background:
      zh: 北维京岛与维京群岛隔着宽阔的海峡，两领地之间长期只能依靠海运和航空往来，冬季风暴期间渡轮常常停航。两领地共同出资成立维京海峡通道公司，建设一条全天候的陆路通道。经过多方案比选，最终放弃在沿途岛岬登陆的方案，选定一条直线：自维京港瓦尔维克区入地，以维京海底公路隧道一路穿越海峡，直达长船福恩斯塔德区。隧道按双洞单向设计，中间设置服务隧道，每隔一段设置横通道和紧急避难所。直线方案使两座城市之间的车程最短，也免去了在途经岛岬修建大型登陆工程。
      en: Open sea separates North Viking Island from the Viking Islands, and for a long time the two territories were linked only by sea and air, with the ferries often stopped by winter storms. The two territories set up the Viking Strait Link Company together to build an all-weather land link. Of the routes they compared, they dropped those that came ashore on the islands and capes along the way and chose a straight line, going underground at Walvik in Viking Port and running all the way across the strait in the Viking Undersea Road Tunnel to the old town of Longship. The tunnel has twin one-way bores with a service tunnel between them, and refuges and cross-passages at regular intervals. The straight line gives the shortest drive between the two cities and spared the islands and capes on the way any large landfall works.
    tunnel_names: { zh: 维京海底公路隧道, en: Viking Undersea Road Tunnel }
    operator: { zh: 维京海峡通道公司, en: Viking Strait Link Company }
    straight: true
    crossing:
      div_fbfqv9: [31.1, 63.2]
      div_raat4g: [188.3, 148.7]
    via: [div_m41gwn, div_g2g1yc]

railways:
  - id: rte_yn834s
    network: intercity_rail
    status: generated
    names:
      zh: 维长城际铁路
      en: Viking Port–Longship Intercity Railway
      art-x-viking: Intercity-Bahn Veiling Havn–Langskip
      art-x-buckham: Ferrovia Intercity Veiling Porto–Navelunga
    notes:
      zh: 维长城际铁路是维京群岛唯一的铁路，也是两领地之间唯一的铁路通道，自维京港站出发，经维京海底铁路隧道穿越海峡，在斯塔文内斯岬出地面，再经北岬区的地面线到长船站，全长约二百三十公里，运营速度每小时 350 公里，全程直达四十多分钟。海底隧道长一百四十公里，单洞双线，两侧设有疏散通道；福恩斯塔德高架桥是全线最长的桥梁。高峰时段每半小时一班，年客运量四百六十万人次左右，是各条城际铁路中客流最大的一条，两城之间的旅客大多选择乘火车。线路由维京海峡通道公司运营。
      en: The Viking Port–Longship Intercity Railway is the only railway in the Viking Islands and the only rail link between the two territories. From Viking Port station it runs through the Viking Undersea Rail Tunnel beneath the strait, comes ashore at Stavnnes and crosses North Cape on the surface to Longship station. It is about 230 km long, with trains at 350 km/h taking just over forty minutes non-stop. The undersea tunnel, 140 km long, has a single bore with two tracks and evacuation passages on both sides, and the Fornstad Viaduct is the longest bridge on the line. At peak times a train leaves every half hour, and with some 4.6 million trips a year it is the busiest of all the intercity railways; most travellers between the two cities now go by train. The Viking Strait Link Company runs the line.
    background:
      zh: 维长城际铁路是维京群岛唯一的铁路，也是两领地之间唯一的铁路通道，由两领地合资的维京海峡通道公司建设和运营。它与维长高速同期规划，但没有照搬公路的直线方案：铁路隧道对坡度、通风和疏散的要求更严，为缩短海底段，维京海底铁路隧道在斯塔文内斯岬出地面，再经北岬区的地面线进入长船。海底隧道按单洞双线设计，两侧设置疏散通道，列车在隧道内全速运行；斯塔文内斯岬登陆段以高架桥上岸。开通后，维京港与长船之间的旅客大多改乘火车。
      en: The Viking Port–Longship Intercity Railway is the only railway in the Viking Islands and the only rail link between the two territories, built and run by the Viking Strait Link Company that the two territories own together. It was planned with the road crossing but does not copy its straight line. A rail tunnel is far stricter about gradients, ventilation and evacuation, so to shorten the undersea section the Viking Undersea Rail Tunnel surfaces at Stavnnes, and the line reaches Longship over land through North Cape. The undersea tunnel is a single double-track bore with escape passages on both sides, and trains run through it at full speed; at Stavnnes the line comes ashore on viaduct. Since it opened most travellers between Viking Port and Longship have taken the train.
    color: '#12A594'
    tech: { operating_speed_kmh: 350, design_speed_kmh: 400 }
    tunnel_names: { zh: 维京海底铁路隧道, en: Viking Undersea Rail Tunnel }
    operator: { zh: 维京海峡通道公司, en: Viking Strait Link Company }
    crossing:
      div_fbfqv9: [31.3, 62.5]
      div_raat4g: [189.1, 180.6]
    via: [div_m41gwn, div_3cvg2q]
