# Cross-territory routes (跨领地通道). National expressways between territories are numbered in
# their own series, G-XTR-1.., under the national expressway sign with XTR in the header.
#
# crossing: the straight undersea tunnel between the two territories, given by its portal in each
#   territory ([x, y] design km in that territory's generator frame, snapped to the nearest land).
#   via runs through the stops of one territory, then the other; each territory routes its own
#   stops to its portal, and the tunnel joins the two parts.
routes:
  - id: rte_fk0z8e
    ref: G-XTR-1
    network: national_expressway
    class: motorway
    status: generated
    names:
      zh: 维长高速
      en: Viking Port–Longship Expressway
      art-x-viking: Autobahn Veiling Havn–Langskip
      art-x-buckham: Autostrada Veiling Porto–Navelunga
    wonder:
      structure: tunnel
      zh: 世界最长的隧道，长约 214 公里，全程在海底
      en: The longest tunnel in the world, about 214 km, all of it under the sea
    notes:
      zh: "维长高速是北维京岛与维京群岛之间唯一的陆路，自维京港瓦尔维克区入地，一条直线穿越海峡，到长船福恩斯塔德区出地面，全长约二百一十公里，全部位于维京海底公路隧道之中，全程一个半小时左右。隧道为双洞单向，中间设服务隧道，沿线每隔一段设有横通道和紧急避难所。全线双向十二车道，全程限速 140 公里。车流以两领地之间的货车、商务车辆和自驾旅客为主，日均车流稳定，不受海上风浪影响；隧道由维京海峡通道公司统一管理和收费。\n隧道里有一块标出两个领地分界的蓝色牌子，开车经过的人习惯按一声喇叭，算是向对岸打个招呼。群岛人管这趟车程叫「上去一趟」，北维京岛人则叫它「下去一趟」，同一条隧道，两头的说法正好相反。"
      en: "The Viking Port–Longship Expressway is the only land link between North Viking Island and the Viking Islands. It goes underground at Walvik in Viking Port and runs in one straight line beneath the strait to surface in Longship's Old Town. It is about 210 km long, all of it inside the Viking Undersea Road Tunnel, and takes about an hour and a half. The tunnel has two one-way bores with a service tunnel between them, and cross-passages and emergency refuges at regular intervals. It has six lanes each way and a 140 km/h limit throughout. Its traffic is mostly lorries, business travel and private drivers between the two territories, steady from day to day and unaffected by wind or waves; the Viking Strait Link Company runs the tunnel and collects its tolls.\nA blue sign in the tunnel marks the boundary between the two territories, and drivers sound their horns as they pass it, a greeting to the far shore. Islanders call the trip \"going up\" and North Viking Islanders \"going down\": the same tunnel, described the opposite way from each end."
    background:
      zh: 北维京岛与维京群岛隔着宽阔的海峡，两领地之间长期只能依靠海运和航空往来，冬季风暴期间渡轮常常停航。两领地共同出资成立维京海峡通道公司，建设一条全天候的陆路通道。经过多方案比选，最终放弃在沿途岛岬登陆的方案，选定一条直线：自维京港瓦尔维克区入地，以维京海底公路隧道一路穿越海峡，直达长船福恩斯塔德区。隧道按双洞单向设计，中间设置服务隧道，每隔一段设置横通道和紧急避难所。直线方案使两座城市之间的车程最短，也免去了在途经岛岬修建大型登陆工程。
      en: Open sea separates North Viking Island from the Viking Islands, and for a long time the two territories were linked only by sea and air, with the ferries often stopped by winter storms. The two territories set up the Viking Strait Link Company together to build an all-weather land link. Of the routes they compared, they dropped those that came ashore on the islands and capes along the way and chose a straight line, going underground at Walvik in Viking Port and running all the way across the strait in the Viking Undersea Road Tunnel to the old town of Longship. The tunnel has twin one-way bores with a service tunnel between them, and refuges and cross-passages at regular intervals. The straight line gives the shortest drive between the two cities and spared the islands and capes on the way any large landfall works.
    tunnel_names: { zh: 维京海底公路隧道, en: Viking Undersea Road Tunnel }
    operator: { zh: 维京海峡通道公司, en: Viking Strait Link Company }
    straight: true
    crossing:
      div_fbfqv9: [31.1, 63.2]
      div_raat4g: [188.3, 148.7]
    via: [div_m41gwn, div_g2g1yc]

railways:
  - id: rte_yn834s
    network: intercity_rail
    maglev: true
    status: generated
    names:
      zh: 维长真空磁悬浮
      en: Viking Port–Longship Vacuum Maglev
      art-x-viking: Vakuum-Magnetbahn Veiling Havn–Langskip
      art-x-buckham: Maglev a vuoto Veiling Porto–Navelunga
    wonder:
      structure: tunnel
      zh: 世界最长的铁路隧道，长约 140 公里
      en: The longest railway tunnel in the world, about 140 km
    notes:
      zh: "维长真空磁悬浮是两领地之间唯一的铁路通道，自维京港站出发，经维京海底铁路隧道穿越海峡，在斯塔文内斯岬出地面，再经北岬区的地面线到长船站，全长约二百三十公里，全程直达约二十二分钟；在长船站可换乘群岛高速铁路和阿克斯高速铁路去群岛各岛。导轨全线封在低真空管道里，管内气压约为大气压的十分之一，两端车站以气闸和管道相接。列车为流星 800 型，十节编组、620 座，高温超导电动悬浮、长定子直线同步电机驱动，运营时速 800 公里，全自动无人驾驶。海底隧道长一百四十公里，两条管道并排铺在隧道里，两侧设有疏散通道；全线约有 5.5 公里桥梁，福恩斯塔德高架桥长约 3.4 公里，是最长的一座。高峰时段每半小时一班，年客运量四百六十万人次左右，两城之间的旅客大多选择乘磁悬浮。线路由维京海峡通道公司运营。\n列车驶过海底的领地分界时，车厢里的屏幕会亮出一行字：「欢迎来到维京群岛」或「欢迎来到北维京岛」。改成磁悬浮以后，这行字亮起时离到站已经不到一刻钟，常坐这趟车的通勤族说，看到这行字就该收拾东西准备下车了，动作慢的人还没穿好外套，车就进站了。周五晚上的列车最热闹，在长船上班的北维京岛人坐这一班回家过周末，有人说如今下班回家比下楼买一杯咖啡还快。"
      en: "The Viking Port–Longship Vacuum Maglev is the only rail link between the two territories. From Viking Port station it runs through the Viking Undersea Rail Tunnel beneath the strait, comes ashore at Stavnnes and crosses North Cape on the surface to Longship station, about 230 km in some twenty-two minutes non-stop; at Longship it meets the Island Chain and Akkersey high-speed railways to the other islands. The whole guideway is sealed in a low-vacuum tube at about a tenth of atmospheric pressure, and the stations at either end join the tube through airlocks. Its Meteor 800 trains of ten cars and 620 seats float by high-temperature superconducting electrodynamic suspension and are driven by a long-stator linear synchronous motor at 800 km/h, fully automatic and driverless. The undersea tunnel, 140 km long, carries the two tubes side by side with evacuation passages on both sides; the line has about 5.5 km of bridges, the longest being the Fornstad Viaduct, about 3.4 km. At peak times a train leaves every half hour, and it carries some 4.6 million trips a year; most travellers between the two cities now go by maglev. The Viking Strait Link Company runs the line.\nAs the train passes the boundary beneath the sea, the carriage screens light up with \"Welcome to the Viking Islands\" or \"Welcome to North Viking Island\". Since the line became a maglev, the message appears less than a quarter of an hour before arrival; regular commuters say that is the moment to pack up, and the slow ones are still getting into their coats as the train pulls in. Friday evening trains are the liveliest, full of North Viking Islanders who work in Longship heading home for the weekend, some of whom say that getting home from work now takes less time than going downstairs for a coffee."
    background:
      zh: 维长真空磁悬浮是维京群岛的第一条铁路，也是两领地之间唯一的铁路通道，由两领地合资的维京海峡通道公司建设和运营。它与维长高速同期规划，但没有照搬公路的直线方案：真空管道越长，抽真空、检修和疏散就越难，为缩短海底段，维京海底铁路隧道在斯塔文内斯岬出地面，再经北岬区的地面线进入长船。海底隧道里并排铺设两条管道，两侧设置疏散通道，管道分段设有隔离阀，一段出了故障，其余各段仍保持真空；斯塔文内斯岬登陆段以高架桥上岸。开通后，维京港与长船之间的旅客大多改乘磁悬浮；后来群岛又修建了自己的群岛高速铁路和阿克斯高速铁路，与它在长船站换乘。
      en: The Viking Port–Longship Vacuum Maglev was the Viking Islands' first railway and is the only rail link between the two territories, built and run by the Viking Strait Link Company that the two territories own together. It was planned with the road crossing but does not copy its straight line. The longer a vacuum tube, the harder it is to pump down, maintain and evacuate, so to shorten the undersea section the Viking Undersea Rail Tunnel surfaces at Stavnnes, and the line reaches Longship over land through North Cape. The undersea tunnel carries two tubes side by side with escape passages on both sides, and the tubes are divided by isolation valves so that a fault in one section leaves the rest under vacuum; at Stavnnes the line comes ashore on viaduct. Since it opened most travellers between Viking Port and Longship have taken the maglev; the islands later built their own Island Chain and Akkersey high-speed railways, which meet it at Longship station.
