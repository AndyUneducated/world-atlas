      en: The Warmspring Volcano Road is the oldest road round Warmspring Volcano, once a dirt track linking the hot-spring villages on its slopes and later rebuilt throughout as a territorial highway. It runs from Hot Springs through Black Sand, Sulphur Bay and Rockhaven to Sunset, where people come to watch the sun go down, circling the foot of the volcano. The rebuilt road keeps to the old line as far as it can, steering clear of active geothermal ground and fumaroles; the pavement is heat-resistant and the geothermal stretches have temperature sensors. The hot-spring villages, the black beaches and the lookout at Sunset Point make it a well-known scenic drive. Since the Southern Arc Expressway opened, the road carries mostly local and sightseeing traffic.
    shield: shell
    via: [div_cz7sch, div_v2tq1k, div_k0zt4f, div_ghpaw7, div_b4by9r]
