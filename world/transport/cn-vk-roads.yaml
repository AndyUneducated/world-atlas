      en: From Longship Island's stern through Rudderhaven and the hill towns below the Keel Hills to Longbeach, linking the towns of the middle of the island.
    background:
      zh: 长船岛中段的龙骨山下散布着许多山城和乡镇，两侧的高速都只经过山脚，山区内部的交通长期依靠窄小的村道。龙骨山公路自长船岛船尾出发，经舵港、龙骨山下的龙骨到长滩，把长船岛中段的乡镇串成一线。线路沿山间谷地和缓坡修建，避开陡峭的山脊，工程以路基为主，桥隧很少；沿线保留了多处老村道的石桥作为步行道。它为山区乡镇提供了通往两条高速的连接，龙骨山的林果和乡村旅游也随之发展起来。
      en: Many hill towns and villages lie among the Keel Hills in the middle of Longship Island. The expressways on either side only skirt the foot of the hills, and inside them people long made do with narrow village lanes. The Keel Hills Road runs from Longship Island's stern through Rudderhaven and Keel, the town beneath the hills, to Longbeach, linking the island's middle towns in one line. It follows the valleys and gentle slopes, avoiding the steep ridges, so it is almost all at grade with very few bridges or tunnels, and several old stone bridges of the village lanes have been kept as footpaths. It connects the hill towns to both expressways, and orchards and rural tourism in the Keel Hills have grown along it.
    shield: wave
    via: [div_1tva4b, div_ej0v6c, div_drqyc2, div_dtk19k]
