      en: The north-west shore of Longship Island, from Tidebay to North Cape, is where the capital's housing has spread fastest, with beaches and seaside parks along the water. The old coast road was narrow, so residents relied on the West Shore Expressway even for short trips. The Longship North-West Shore Road runs from Tidebay through Longbeach and the housing and seaside parks of West Shore to North Cape, a local road for the shore communities alongside the expressway. It hugs the coast, with a continuous promenade and cycle path on the seaward side that merges into the parks. It takes much of the short local traffic off the expressway and has made the north-west shore a weekend escape for the capital.
    shield: dolphin
    via: [div_0yqqc3, div_kecby5, div_xps98r]
