    notes:
      zh: 自白帆老城帆城区到帆港区的邮轮母港与免税城
      en: From the old town of White Sail in Sail Town to the cruise home port and duty-free mall in Sail Harbour.
    shield: sailboat
    via: [div_vhsby1, div_tkvfsx]
  - id: rte_7r6n3d
