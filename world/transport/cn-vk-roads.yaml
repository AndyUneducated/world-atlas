# Road routes of the Viking Islands. Same conventions as cn-nv-roads.yaml, with the
# territory infix VK:
#   G-VK-1..99    国家高速 national expressway    (class motorway)
#   S-VK-1..99    领地高速 territorial expressway (class motorway)
#   S-VK-101..    领道 territorial highway        (class primary)
#   X-VK-001..    市道 city road                  (class secondary, derived)
# via entries may also be places with a site (e.g. a ferry terminal): the route stops at the
# landward side of the site.
# shield (territorial routes): sea-themed symbol on the Viking Islands' oval shield.
routes:
  # 国家高速: the trunk along the main-island chain, sea crossings between the main islands and
  # spines inside them.
  - id: rte_6mvf59
    ref: G-VK-1
    network: national_expressway
    class: motorway
    status: generated
    names:
      zh: 群岛跨海高速
      en: Island Chain Expressway
      art-x-viking: Inselkettenautobahn
      art-x-buckham: Autostrada delle Isole
    notes:
      zh: 群岛跨海高速是维京群岛的主干高速，自暖泉岛西岸的克莱特斯塔德出发，经新特雷曼、斯瓦特桑德和暖泉温泉区横贯暖泉岛，跨海到长船岛船尾的斯蒂尔维克，再沿谢尔海姆山东南麓经奥斯特哈门、汇金进入长船古城，全长约七百公里，全程四个半小时左右。斯库特斯塔德特大桥和谢尔海姆隧道分别是全线最长的桥梁和隧道，跨海桥面两侧设有风障。全线双向十二车道，长船市区段加宽到十四车道；城区与桥隧密集路段限速 140 公里，其余路段不限速。长船市区段是群岛车流最大的路段之一，暖泉岛段则以旅游车辆和货车为主。
      en: The Island Chain Expressway is the trunk expressway of the Viking Islands. From Klettstad on the west coast of Warmspring Island it crosses that island through Tremaine Bay, Svartsand and Hot Springs, goes over the sea to Styrvik at Longship Island's stern, then follows the south-east foot of the Kjølheim Hills through Austhamn and Goldmark into Longship's old town. It is about 700 km long, some four and a half hours end to end. The Skutstad Sea Bridge and the Kjølheim Tunnel are the longest of each on the line, and its sea bridges have wind screens on both sides. It has six lanes each way, widening to seven through Longship; the limit is 140 km/h through towns and on stretches dense with bridges and tunnels, and there is none elsewhere. The Longship stretch is among the busiest roads in the islands, while on Warmspring Island it carries mainly tourists and freight.
    background:
      zh: 维京群岛由多座大岛组成，过去岛与岛之间全靠渡轮，冬季风浪大时航班经常停开，暖泉岛与首府所在的长船岛常常隔海相望却无法往来。群岛跨海高速是群岛交通的主骨架，自暖泉岛西岸的克莱特斯塔德出发横贯暖泉岛，以跨海大桥跨海到长船岛船尾的斯蒂尔维克，再沿谢尔海姆山东南麓直达长船。跨海段在深水区采用大跨度斜拉桥，浅水区采用预制箱梁长桥，桥面两侧设置风障，保证大风天气也能通行。它的建成让群岛第一次有了全天候的陆路，沿线城市也随之连成一片。
      en: The Viking Islands are a chain of large islands that once depended entirely on ferries, and in winter gales the sailings often stopped, leaving Warmspring Island and Longship Island, home of the capital, in sight of each other but cut off. The Island Chain Expressway is the backbone of the islands' network. It crosses Warmspring Island from Klettstad on its west coast, bridges the sea to Styrvik at the stern of Longship Island, then follows the south-east foot of the Kjølheim Hills to Longship. In deep water the crossing uses long cable-stayed spans and in the shallows long precast box-girder viaducts, with wind screens along both edges so it stays open in high winds. It gave the islands their first all-weather land link, and the cities along it have grown into one another.
    tunnel_cost: 3.5
    via: [div_6930nk, div_qjzmw5, div_er5g6j, div_33vctd, div_3cvg2q]
  - id: rte_1htwsa
    ref: G-VK-2
    network: national_expressway
    class: motorway
    status: generated
    names:
      zh: 长阿跨海高速
      en: Longship–Port Aveline Sea Crossing
      art-x-viking: Meeresautobahn Langskip–Port Aveline
      art-x-buckham: Autostrada sul Mare Navelunga–Porto Aveline
    notes:
      zh: 长阿跨海高速自长船古城出发，经汇金、奥斯特哈门和谢尔海姆山下，以跨海大桥越过阿夫琳海峡，再穿过卡洛韦岭到阿夫琳港老城帆城区，全长约二百四十公里，全程一个半小时多，是首府与阿夫琳岛之间的主要通道。谢尔海姆特大桥是全线最长的桥梁，海峡主桥下可通行大型邮轮和集装箱船。全线双向十二车道，长船市区段加宽到十四车道；城区与桥隧路段限速 140 公里，其余路段不限速。工作日通勤与物流车流密集，邮轮旺季前往阿夫琳港的游客车辆也很多。
      en: The Longship–Port Aveline Sea Crossing runs from Longship's old town through Goldmark, Austhamn and the foot of the Kjølheim Hills, crosses Aveline Strait on a sea bridge, then passes through the Calloway Ridge to Sail Town, the old heart of Port Aveline. It is about 240 km long, a little over an hour and a half end to end, and the main route between the capital and Aveline Island. The Kjølheim Sea Bridge is its longest bridge, and the main strait span leaves room for large cruise ships and container ships beneath. It has six lanes each way, widening to seven through Longship, a 140 km/h limit through towns and on bridge and tunnel stretches, and no limit elsewhere. Commuter and freight traffic is heavy on weekdays, and in the cruise season many visitors drive out to Port Aveline as well.
    background:
      zh: 阿夫琳岛是群岛第四大城市阿夫琳港的所在地，与首府长船隔着宽阔的阿夫琳海峡，往来主要靠高速客轮。长阿跨海高速自长船古城出发，经汇金、奥斯特哈门和谢尔海姆山下，以跨海大桥越过阿夫琳海峡，再翻过卡洛韦岭抵达阿夫琳港老城。海峡中部航道繁忙，主桥采用超大跨度悬索桥，桥下净空满足大型邮轮和集装箱船通行；卡洛韦岭一侧沿山谷翻越，避开岭上的林场。施工中海上桥墩在奥斯特哈门船厂预制后整体浮运就位。通车后两座城市之间形成了繁忙的通勤与物流走廊。
      en: Aveline Island holds the islands' fourth city, Port Aveline, across the broad Aveline Strait from the capital, Longship, and the two were linked mainly by fast passenger ships. The Longship–Port Aveline Sea Crossing runs from Longship's old town through Goldmark, Austhamn and the foot of the Kjølheim Hills, bridges the Aveline Strait and crosses Calloway Ridge to Port Aveline's old town. The shipping lane in mid-strait is busy, so the main bridge is a very long suspension span with clearance for large cruise and container ships; on the Fort Calloway side the road climbs over the ridge by a valley to spare its forests. The sea piers were cast in the Austhamn shipyards and floated out whole. Since it opened the two cities have become one busy corridor of commuting and freight.
    via: [div_3cvg2q, div_x22naa]
  - id: rte_zxcxr7
    ref: G-VK-3
    network: national_expressway
    class: motorway
    status: generated
    names:
      zh: 阿克斯跨海高速
      en: Akkersey Strait Crossing
      art-x-viking: Akkerseystraßen-Autobahn
      art-x-buckham: "Autostrada dello Stretto dell'Ancora"
    notes:
      zh: 阿克斯跨海高速自长船岛西北岸的弗洛德维克出发，跨越阿克斯海峡到阿克斯岛的瑙斯特海姆区，直达阿克斯维克链城区，全长约五十公里，全程二十多分钟，是阿克斯岛通往首府的门户。弗洛德维克特大桥横跨水深流急的海峡，是全线最长的桥梁，两岸近岸段以高架桥绕过陡峭的岬角。全线双向十二车道，由于桥梁比例很高，全线限速 140 公里。车流以往返阿克斯维克船厂的职工、运送船用设备的重型货车和弗洛德维克一带的通勤车辆为主，大风天气时桥面会临时降低限速。
      en: The Akkersey Strait Crossing runs from Flodvik on the north-west shore of Longship Island over Akkersey Strait to the Naustheim District of Akkersey and on to Chain Town in Akkersvik, about 50 km in just over twenty minutes; it is Akkersey's gateway to the capital. The Flodvik Sea Bridge, which spans the deep, fast-flowing strait, is its longest bridge, and near the shores viaducts skirt the steep headlands. It has six lanes each way, and because so much of it is bridge the limit is 140 km/h throughout. Its traffic is mostly shipyard workers, heavy lorries carrying marine equipment and commuters from around Flodvik, and in strong winds the limit on the bridge is lowered for a time.
    background:
      zh: 阿克斯岛与长船岛之间的阿克斯海峡水深流急，是群岛最险的航道之一，渡轮常因潮流停航。阿克斯跨海高速自长船岛西北岸的弗洛德维克出发，跨越阿克斯海峡到阿克斯岛的瑙斯特海姆区，直达阿克斯维克链城区，是阿克斯岛通往首府的门户。海峡中部水流最急，主桥采用大跨度设计以减少水中桥墩，两岸近岸段则以高架桥绕过陡峭的岬角。由于海峡潮流强劲，桥墩基础施工只能在每天的平潮时段进行，工程因此格外漫长。通车后，阿克斯维克的船舶制造业与长船的航运、金融业连为一体。
      en: The Akkersey Strait between Akkersey and Longship Island is deep and fast-flowing, one of the most dangerous waters in the islands, and ferries were often stopped by the tides. The Akkersey Strait Crossing runs from Flodvik on Longship Island's north-west shore across the strait to Naustheim District and on to Chain Town in Akkersvik, Akkersey's gateway to the capital. The current is strongest mid-strait, so the main bridge uses long spans to keep piers out of the water, while near the shores the road skirts steep headlands on viaducts. The pier foundations could only be worked at slack water each day, which made the job unusually long. Since it opened, Akkersvik's shipbuilding and Longship's shipping and finance have grown into one.
    via: [div_x20mfy, div_zg05xa]
  - id: rte_pb0tnq
    ref: G-VK-4
    network: national_expressway
    class: motorway
    status: generated
    names:
      zh: 阿夫琳纵贯高速
      en: Aveline Spine Expressway
      art-x-viking: Aveline-Längsautobahn
      art-x-buckham: Autostrada Dorsale di Aveline
    notes:
      zh: 阿夫琳纵贯高速沿阿夫琳岛东南岸纵贯全岛，自西南端的莫塞出发，经维托斯、菲斯克海姆、萨尔塔维克、望海到阿夫琳港老城帆城区，全长约三百六十公里，全程两小时二十分钟左右，与长阿跨海高速在阿夫琳港相接。线路大多位于海岸后方的低丘上，望海高架桥是全线最长的桥梁。全线双向十二车道，城区和桥隧路段限速 140 公里，其余路段不限速。车流以运送渔获、海盐和水果的货车为主，靠近阿夫琳港的路段通勤车辆较多，夏季前往海滨的自驾游客也不少。
      en: The Aveline Spine Expressway runs the length of Aveline Island along its south-east shore, from Måsey at the south-west end through Hvitås, Fiskheim, Saltavik and Seawatch to Sail Town, the old heart of Port Aveline, where it meets the Longship–Port Aveline Sea Crossing. It is about 360 km long, some two hours twenty minutes end to end. Most of it runs on the low hills behind the shore; the Seawatch Viaduct is its longest bridge. It has six lanes each way, a 140 km/h limit through towns and on bridge and tunnel stretches, and no limit elsewhere. Lorries carrying fish, sea salt and fruit make up much of its traffic, commuters crowd the stretch near Port Aveline, and in summer plenty of drivers head for the beaches.
    background:
      zh: 阿夫琳岛狭长，城镇沿东南岸分布，原有的海滨公路弯多路窄，从岛西南端的莫塞到阿夫琳港老城要花大半天。阿夫琳纵贯高速沿东南岸纵贯全岛，自莫塞出发，经维托斯、菲斯克海姆、萨尔塔维克、望海到帆城区，与长阿跨海高速在阿夫琳港相接。线路大部分位于海岸后方的低丘上，避开萨尔塔维克湾的盐田和望海的果园，跨越沿岸的小海湾时修建了多座海湾桥。施工中挖出的土石用于加固盐田海堤。高速通车后，阿夫琳岛的渔获、海盐和水果可以直接运往长船和各港口。
      en: Aveline Island is long and narrow, its towns along the south-east coast, and the old shore road was so winding and narrow that getting from Måsey at the south-west tip to Port Aveline's old town took most of a day. The Aveline Spine Expressway runs the length of the island along that coast, from Måsey through Hvitås, Fiskheim, Saltavik and Seawatch to Sail Town, meeting the Longship–Port Aveline Sea Crossing at Port Aveline. Most of it rides the low hills behind the shore, keeping clear of the Saltavik Bay salt pans and the Seawatch orchards, with bridges across the small coastal inlets. Spoil from the works went into strengthening the salt-pan sea walls. Aveline Island's catch, sea salt and fruit now travel straight to Longship and the ports.
    tunnel_cost: 3.5
    via: [div_0770jy, div_ewqq3p, div_x22naa]
  - id: rte_v17pgv
    ref: G-VK-5
    network: national_expressway
    class: motorway
    status: generated
    names:
      zh: 阿克斯岛纵贯高速
      en: Akkersey Spine Expressway
      art-x-viking: Akkersey-Längsautobahn
      art-x-buckham: "Autostrada Dorsale dell'Isola dell'Ancora"
    notes:
      zh: 阿克斯岛纵贯高速是阿克斯岛的南北主干，自南端的阿克斯维克湾出发北上，经瑙斯特海姆区、阿克斯维克链城区和尤普峡湾区到东北端的富鲁海姆，全长约三百三十公里，全程两小时十几分钟。阿克斯维克湾跨海大桥是全线最长的桥梁，尤普峡湾区段以一座座高桥越过峡湾，遇到锚链山的山脊时沿山谷绕行。全线双向十二车道，城区和峡湾路段限速 140 公里，其余路段不限速。阿克斯维克市区段车流最大，北段以富鲁海姆的运木车和峡湾观光车辆为主。
      en: The Akkersey Spine Expressway is Akkersey's north–south trunk road. It runs north from Akkersvik Bay at the southern end through the Naustheim District, Chain Town in Akkersvik and the Djupfjord District to Furuheim at the north-east end, about 330 km in a little over two hours. The Akkersvik Bay Bridge is its longest bridge; in the Djupfjord District it crosses fjord after fjord on high bridges, and where it meets the ridges of the Anchor Chain Mountains it winds round them by the valleys. It has six lanes each way, a 140 km/h limit through towns and in the fjords, and no limit elsewhere. Traffic is heaviest through Akkersvik; further north it is mostly timber lorries from Furuheim and sightseers bound for the fjords.
    background:
      zh: 阿克斯岛南北狭长，中部被锚链山和多条峡湾分隔，南端的阿克斯维克湾与东北端的富鲁海姆之间过去只能乘船往来。阿克斯岛纵贯高速自阿克斯维克湾北上，经瑙斯特海姆区、阿克斯维克链城区和尤普峡湾区到富鲁海姆，是阿克斯岛的南北主干。线路在尤普峡湾区以连续的跨峡湾大桥越过一道道峡湾，桥梁高度满足渔船和游艇通行；遇到锚链山的山脊时沿山谷绕行。峡湾两岸岩壁坚硬，桥台直接嵌入岩体。通车后阿克斯维克的船厂得以从岛南北两端招募工人，富鲁海姆的木材也不再需要海运。
      en: Akkersey is long and narrow, its middle broken up by the Anchor Chain Mountains and a series of fjords, and Akkersvik Bay in the south and Furuheim in the north-east were once reachable only by boat. The Akkersey Spine Expressway runs north from Akkersvik Bay through Naustheim District, Chain Town in Akkersvik and Djupfjord District to Furuheim as the island's north–south trunk. Through Djupfjord District it leaps one fjord after another on high bridges with clearance for fishing boats and yachts, and it winds round the spurs of the Anchor Chain Mountains. The fjord walls are hard rock, so the abutments are set straight into it. The Akkersvik shipyards can now recruit from both ends of the island, and Furuheim's timber no longer goes by sea.
    tunnel_cost: 3.5
    via: [div_a2n8cw, div_zg05xa, div_bbmwea]
  - id: rte_bd7834
    ref: G-VK-6
    network: national_expressway
    class: motorway
    status: generated
    names:
      zh: 暖泉南环高速
      en: Warmspring Southern Arc Expressway
      art-x-viking: Warmquell-Südbogenautobahn
      art-x-buckham: Autostrada dell'Arco Sud di Fontecalda
    notes:
      zh: 暖泉南环高速绕暖泉火山南麓，自暖泉温泉区出发，经斯瓦特桑德、新特雷曼到克莱特斯塔德，与群岛跨海高速合成环绕暖泉岛的环线，全长约三百二十公里，全程两小时左右。线路穿过大片火山熔岩和斯瓦特桑德海岸，全线没有隧道，新特雷曼高架桥是最长的桥梁；沿线设有火山监测点和紧急疏散标志。全线双向十二车道，城区路段限速 140 公里，其余路段不限速。车流以温泉、斯瓦特桑德海滩和新特雷曼地热景区的游客为主，它也是火山南麓居民紧急疏散的主要通道之一。
      en: The Warmspring Southern Arc Expressway runs round the southern foot of Warmspring Volcano from Hot Springs in Warmspring through Svartsand and Tremaine Bay to Klettstad, and with the Island Chain Expressway forms a ring round Warmspring Island. It is about 320 km long, roughly two hours end to end. It crosses broad lava fields and black-sand coast without a single tunnel; the New Tremaine Viaduct is its longest bridge, and volcano monitoring points and evacuation signs line the route. It has six lanes each way, a 140 km/h limit through towns and no limit elsewhere. Most of its traffic is visitors to the hot springs, the black-sand beaches and the geothermal sights of Tremaine Bay, and it is one of the main evacuation routes for people living on the volcano's southern slopes.
    background:
      zh: 暖泉岛中央耸立着暖泉火山，群岛跨海高速经火山北侧横贯全岛，南侧的斯瓦特桑德、新特雷曼一带只能走狭窄的环山公路。暖泉南环高速绕火山南麓，自暖泉温泉区经斯瓦特桑德、新特雷曼到克莱特斯塔德，与群岛跨海高速合成环岛高速。线路穿过大片火山熔岩和斯瓦特桑德海岸，路基用当地火山渣填筑；考虑到火山活动，选线避开了历史熔岩流的通道，并在沿线设置火山监测点和紧急疏散标志。通车后，温泉、斯瓦特桑德海滩与新特雷曼的地热景观连成一条旅游环线，也为火山应急疏散多提供了一条通道。
      en: Warmspring Volcano rises in the middle of Warmspring Island. The Island Chain Expressway crosses the island north of it, and the Svartsand and Tremaine Bay country to the south had only a narrow mountain road. The Warmspring Southern Arc Expressway rounds the volcano's southern foot from Hot Springs through Svartsand and Tremaine Bay to Klettstad, closing a ring round the island with the Island Chain Expressway. It crosses wide lava fields and black-sand shores on a roadbed built of local volcanic cinder. Because the volcano is active, the line avoids the paths of past lava flows, with volcano monitoring points and evacuation signs along the way. The hot springs, the black beaches and the geothermal fields of Tremaine Bay now form one touring circuit, and the island has a second evacuation route.
    via: [div_qjzmw5, div_bsbr5w, div_6930nk]
  - id: rte_2bcpa1
    ref: G-VK-7
    network: national_expressway
    class: motorway
    status: generated
    names:
      zh: 长船西岸高速
      en: Longship West Shore Expressway
      art-x-viking: Langskip-Westküstenautobahn
      art-x-buckham: Autostrada della Costa Ovest di Navelunga
    notes:
      zh: 长船西岸高速自斯蒂尔维克出发，经谢尔海姆山西北侧到弗洛德维克，再沿西北岸经朗桑德进入长船奥斯特哈门、汇金和福恩斯塔德，全长约三百七十公里，全程两小时二十分钟左右，与群岛跨海高速分走谢尔海姆山两侧，任何一条封闭时交通都可以经另一条绕行。弗洛德维克高架桥和斯蒂尔维克隧道分别是全线最长的桥梁和隧道，进入长船市区后改为高架和地下道路。全线双向十二车道，长船市区段加宽到十四车道；城区和山区路段限速 140 公里，其余路段不限速。长船市区段与群岛跨海高速并列为群岛最繁忙的路段。
      en: The Longship West Shore Expressway runs from Styrvik along the north-west side of the Kjølheim Hills to Flodvik, then along the north-west shore through Langsand into Longship's Austhamn, Goldmark and old town. It is about 370 km long, some two hours twenty minutes end to end, and takes the opposite side of the Kjølheim Hills from the Island Chain Expressway, so that if either is closed traffic can switch to the other. The Flodvik Viaduct and the Styrvik Tunnel are the longest of each on the line, and inside Longship it continues on viaduct and underground. It has six lanes each way, widening to seven through Longship, a 140 km/h limit through towns and mountains, and no limit elsewhere. Its Longship stretch ranks with that of the Island Chain Expressway as the busiest road in the islands.
    background:
      zh: 长船岛中部横亘着谢尔海姆山，群岛跨海高速走东南麓，西北岸的弗洛德维克、朗桑德一带人口增长很快，却只能绕道进出首府。长船西岸高速自斯蒂尔维克出发，经谢尔海姆山西北侧到弗洛德维克，再沿西北岸经朗桑德进入长船市区，与群岛跨海高速分走谢尔海姆山两侧，形成长船岛的双通道。谢尔海姆山西坡陡峭，线路以连续桥隧穿越山脚；进入长船市区后改为高架和地下道路，避免切割城区。两条高速互为备用，任何一条因事故或大风封闭时，交通都可以经另一条绕行。
      en: The Kjølheim Hills run down the middle of Longship Island. The Island Chain Expressway takes their south-east side, while Flodvik and Langsand on the north-west shore were growing fast but had to go the long way round to reach the capital. The Longship West Shore Expressway runs from Styrvik along the north-west side of the Kjølheim Hills to Flodvik, then along the shore through Langsand into Longship, giving the island two expressways, one either side of the hills. The western slopes are steep, so the road runs on bridges and through tunnels along their foot, and inside Longship it goes onto viaduct and underground so as not to split the city. Each expressway is the other's backup, so traffic can switch when one is closed by an accident or high winds.
    tunnel_cost: 3.5
    via: [div_er5g6j, div_x20mfy, div_3cvg2q]
  - id: rte_za26jr
    ref: G-VK-8
    network: national_expressway
    class: motorway
    status: generated
    names:
      zh: 西格利跨海高速
      en: Sigley Sea Crossing
      art-x-viking: Sigley-Meeresautobahn
      art-x-buckham: "Autostrada sul Mare dell'Isola dell'Albero"
    notes:
      zh: 西格利跨海高速自暖泉出发，经暖河和长船岛船尾跨海到西格利岛的西格拉维克，再跨越西格利海峡到阿夫琳岛西南端的莫塞，全长约四百七十公里，全程三小时左右，是暖泉岛与阿夫琳岛之间的直达高速。全线没有隧道，暖河特大桥是最长的海上长桥；西格利岛是两段跨海长桥之间的中转站，岛上设有服务区和观景台。全线双向十二车道，城区与长桥路段限速 140 公里，其余路段不限速。车流以跨岛货运和旅游大巴为主，大风天气时桥面会临时限速或限制高车通行。
      en: The Sigley Sea Crossing runs from Warmspring through Warm River and Longship Island's stern, over the sea to Siglavik on Sigley, then across Sigley Strait to Måsey at the south-west end of Aveline Island. It is about 470 km long, some three hours end to end, and the direct expressway between Warmspring and Aveline islands. It has no tunnels; the Warm River Sea Bridge is the longest of its sea bridges, and Sigley, between the two long crossings, has a service area and a lookout. It has six lanes each way, a 140 km/h limit through towns and on the long bridges, and no limit elsewhere. Its traffic is mostly inter-island freight and tour coaches, and in strong winds the bridges get temporary limits or are closed to high-sided vehicles.
    background:
      zh: 暖泉岛与阿夫琳岛之间隔着开阔的海面，两岛往来原本要经长船岛绕一大圈。西格利跨海高速自暖泉出发，经长船岛船尾跨海到西格利岛的西格拉维克，再跨越西格利海峡到阿夫琳岛西南端的莫塞，是暖泉岛与阿夫琳岛之间的直达高速。全线桥梁比例很高，海上长桥以西格利岛为中间支点分成两段，西格利岛上设置服务区和观景台。为抵御海上大风，桥梁采用流线型箱梁并设置风障。通车后西格利岛从一个偏远小岛变成跨海通道的中转站，西格拉维克的旅游和物流随之兴起。
      en: Open sea separates Warmspring Island from Aveline Island, and travel between them used to loop round by Longship Island. The Sigley Sea Crossing runs from Warmspring across the water by way of Longship Island's stern to Siglavik on Sigley, then over the Sigley Strait to Måsey at the south-west tip of Aveline Island, the direct expressway between the two. A large share of it is bridge. Sigley splits the long sea viaducts in two, with a service area and lookout on the island itself, and the decks are streamlined box girders with wind screens against the sea gales. Sigley has gone from a remote outpost to a stop on the crossing, and Siglavik's tourism and logistics have grown with it.
    via: [div_qjzmw5, div_esaav7, div_0770jy]
  - id: rte_33tmrb
    ref: G-VK-9
    network: national_expressway
    class: motorway
    status: generated
    names:
      zh: 阿斯跨海高速
      en: Akkersvik–Styrvik Sea Crossing
      art-x-viking: Meeresautobahn Akkersvik–Styrvik
      art-x-buckham: Autostrada sul Mare Ancora–Timone
    notes:
      zh: 阿斯跨海高速自阿克斯岛南端的阿克斯维克湾出发，跨越阿克斯海峡口到长船岛船尾，再到斯蒂尔维克，全长约一百九十公里，全程一小时十几分钟，是阿克斯岛与长船岛南部之间的捷径。斯库特斯塔德特大桥直面大洋涌浪，是全线最长的桥梁，桥墩采用加大的防撞和消浪设计；近岸段以高架桥绕过斯库特斯塔德的岬角。全线双向十二车道，城区和跨海路段限速 140 公里，其余路段不限速。车流以阿克斯维克湾与斯蒂尔维克之间的船舶修造、渔业运输为主，阿克斯岛前往暖泉岛的车辆也大多走这条路，不必经过首府。
      en: The Akkersvik–Styrvik Sea Crossing runs from Akkersvik Bay at the southern end of Akkersey across the mouth of Akkersey Strait to Longship Island's stern and on to Styrvik, about 190 km in a little over an hour and a quarter; it is the short way between Akkersey and southern Longship Island. The Skutstad Sea Bridge, which faces the ocean swell head on, is its longest bridge, its piers enlarged against ship impact and waves, and near the shore it skirts the Skutstad headland on a viaduct. It has six lanes each way, a 140 km/h limit through towns and over the sea, and no limit elsewhere. Its traffic is mostly shipbuilding and fishing freight between Akkersvik Bay and Styrvik, and most traffic from Akkersey to Warmspring Island uses it too, avoiding the capital.
    background:
      zh: 阿克斯岛南端的阿克斯维克湾与长船岛船尾的斯蒂尔维克隔着阿克斯海峡口相望，直线距离不远，但陆路要经阿克斯跨海高速绕行弗洛德维克。阿斯跨海高速自阿克斯维克湾出发，跨越阿克斯海峡口到斯库特斯塔德，再到斯蒂尔维克，是阿克斯岛与长船岛南部之间的捷径。海峡口外侧直面大洋涌浪，桥墩采用加大的防撞和消浪设计，近岸段以高架桥绕过船尾的岬角。通车后阿克斯维克湾老港与斯蒂尔维克的船舶修造、渔业形成协作，阿克斯岛南部到暖泉岛的车流也不必再经过首府。
      en: Akkersvik Bay at the southern tip of Akkersey faces Styrvik at Longship Island's stern across the mouth of the Akkersey Strait, close as the crow flies, yet by land the way went round by Flodvik on the Akkersey Strait Crossing. The Akkersvik–Styrvik Sea Crossing runs from Akkersvik Bay over the mouth of the strait to the Skutstad and on to Styrvik, a short cut between Akkersey and southern Longship Island. The strait mouth takes the full ocean swell, so the piers have enlarged fenders and wave breakers, and near the shore the road skirts the Skutstad headland on a viaduct. Ship repair and fishing at the old port of Akkersvik Bay and at Styrvik now work together, and traffic from southern Akkersey to Warmspring Island no longer has to pass through the capital.
    via: [div_a2n8cw, div_er5g6j]

  # 领地高速 (territorial expressways, class motorway): from the big cities to their ports and
  # suburbs and airports.
  - id: rte_p3r778
    ref: S-VK-1
    network: territorial_expressway
    class: motorway
    status: generated
    names:
      zh: 长船机场高速
      en: Longship Airport Expressway
      art-x-viking: Flughafenautobahn Langskip
      art-x-buckham: Autostrada dell'Aeroporto di Navelunga
    notes:
      zh: 长船机场高速自长船古城北上，绕开老城核心，经北岬区直达长船国际机场航站区和群岛大学，全长约八十五公里，全程四十分钟左右。北岬高架桥是全线最长的桥梁，城市北部大段采用高架；靠近机场的路段桥梁和灯杆高度受到严格控制，航站区设有独立的出发和到达匝道。全线双向十二车道，全程限速 140 公里。车流以机场旅客、出租车、机场大巴和往返群岛大学的师生为主，航班高峰时段最为繁忙，日均车流在领地高速中名列前茅。
      en: The Longship Airport Expressway runs north from Longship's old town, skirting its core, through North Cape to the terminals of Longship International Airport and the University of the Islands, about 85 km in some forty minutes. The North Cape Viaduct is its longest bridge, and much of the stretch through the north of the city is elevated. Near the airport the heights of bridges and lighting columns are tightly controlled, and the terminal area has separate departures and arrivals ramps. It has six lanes each way and a 140 km/h limit throughout. Its traffic is mostly air travellers, taxis, airport coaches and students and staff of the university, busiest at the peaks of the flight schedule, and among the heaviest of any territorial expressway.
    background:
      zh: 长船国际机场位于首府以北的北岬区，是群岛对外交通的门户，群岛大学也坐落在北岬。机场启用之初，旅客只能经城市道路穿过老城往返，航班高峰时经常拥堵。长船机场高速自古城北上，绕开老城核心，直达机场航站区和群岛大学。线路穿过城市北部时以高架为主，靠近机场的路段严格控制桥梁和灯杆的高度，以满足机场净空要求；航站区段设置独立的出发和到达匝道。通车后机场与市中心之间的车程大为缩短，北岬也逐渐发展为首府的科教新区。
      en: Longship International Airport, the islands' gateway to the world, lies north of the capital in North Cape, as does the University of the Islands. When the airport first opened, travellers had to go through the old town on city streets, and at peak hours the traffic jammed. The Longship Airport Expressway runs north from the old town, skirting its core, straight to the terminals and the university. Through the northern city it is mostly on viaduct, and near the airport the heights of bridges and lighting columns are kept strictly within the airport's clearance limits, with separate departure and arrival ramps at the terminals. The trip between the airport and the city centre is much shorter, and North Cape has grown into the capital's new district of science and learning.
    shield: gull
    via: [div_g2g1yc, div_xps98r]
  - id: rte_tjbqng
    ref: S-VK-2
    network: territorial_expressway
    class: motorway
    status: generated
    names:
      zh: 奥斯特哈门港口高速
      en: Austhamn Port Expressway
      art-x-viking: Hafenautobahn Austhamn
      art-x-buckham: Autostrada Portuale di Porto Est
    notes:
      zh: 奥斯特哈门港口高速自长船古城边缘出发，经汇金金融区直达奥斯特哈门区的集装箱码头，全长约八十公里，全程半小时多，是长船市区南北向的快速通道。线路在汇金区大段沿下沉路堑通过，之后以奥斯特哈门高架桥跨过港区堆场，直接接入码头闸口；码头路段设有货车专用车道和集装箱查验站。全线双向十二车道，全程位于城区，限速 140 公里。全线日均车流都在两万五千辆以上，是群岛最繁忙的高速之一，集装箱卡车昼夜不停，早晚高峰还叠加大量通勤车辆。
      en: The Austhamn Port Expressway runs from the edge of Longship's old town through the Goldmark financial district to the container terminals of Austhamn, about 80 km in just over half an hour, and serves as Longship's north–south urban expressway. Through Goldmark it runs largely in a sunken cutting; beyond that it crosses the port's stacking yards on the Austhamn Viaduct and feeds straight into the terminal gates, where it has lorry-only lanes and container inspection stations. It has six lanes each way and, running entirely through the city, a 140 km/h limit. Every stretch carries more than 25,000 vehicles a day, making it one of the busiest expressways in the islands, with container lorries round the clock and heavy commuter traffic on top at the morning and evening peaks.
    background:
      zh: 奥斯特哈门区的集装箱码头是首府最大的港口，过去集装箱卡车要穿过古城和汇金金融区的街道进出港区，噪声、拥堵和安全问题都十分突出。奥斯特哈门港口高速自古城边缘出发，经汇金区直达奥斯特哈门码头，是长船市区南北向的快速通道。为了不打扰老城和金融区，线路在汇金区大段采用下沉路堑，之后以高架桥跨过港区堆场，直接接入码头闸口。码头路段设置货车专用车道和集装箱查验站。通车后货车不必再穿过老城，古城的街道也恢复了宁静。
      en: The container terminals at Austhamn are the capital's largest port, and container trucks used to reach them through the streets of the old town and the Goldmark financial district, with all the noise, congestion and danger that brought. The Austhamn Port Expressway runs from the edge of the old town through Goldmark straight to the Austhamn terminals, a fast north–south route through the city. To spare the old town and the financial district it runs underground for much of Goldmark, then rises onto viaduct over the port yards straight to the terminal gates. The port end has truck-only lanes and a container inspection station. Trucks no longer cross the old town, and its streets have grown quiet again.
    shield: ship
    via: [div_g2g1yc, div_jzqknb, div_j6mw1m]
  - id: rte_d67xzw
    ref: S-VK-3
    network: territorial_expressway
    class: motorway
    status: generated
    names:
      zh: 阿托高速
      en: Akkersvik–Tåkevik Expressway
      art-x-viking: Autobahn Akkersvik–Tåkevik
      art-x-buckham: Autostrada Portancora–Baianebbia
    notes:
      zh: 阿托高速自阿克斯维克链城区出发，横穿阿克斯岛，经尤普峡湾区到西岸的托克维克，全长约一百五十公里，全程一小时左右。锚链山隧道穿过主脊，是全线最长的隧道，链城特大桥是最长的桥梁，坡度在群岛高速中属于最陡的一类。全线双向十二车道，城区和山区路段限速 140 公里，其余路段不限速；全线设有雾区行车诱导灯和能见度监测，浓雾时自动发布临时限速。车流以运送海产的冷藏车和阿克斯维克、托克维克之间的通勤车辆为主，清晨的托克维克段常需打开诱导灯。
      en: The Akkersvik–Tåkevik Expressway runs from Chain Town in Akkersvik across Akkersey through the Djupfjord District to Tåkevik on the west coast, about 150 km in roughly an hour. The Anchor Chain Mountains Tunnel through the main ridge is its longest tunnel and the Chain Town Viaduct its longest bridge, and its grades are among the steepest of any expressway in the islands. It has six lanes each way, a 140 km/h limit through towns and mountains, and no limit elsewhere; fog guidance lights and visibility sensors run its whole length and post temporary limits automatically when fog is thick. Its traffic is mostly refrigerated lorries carrying seafood and commuters between Akkersvik and Tåkevik, and the guidance lights are often on along the Tåkevik stretch in the early morning.
    background:
      zh: 托克维克位于阿克斯岛西岸，常年多雾，渔业和海产养殖发达，但与岛东侧的阿克斯维克之间隔着锚链山，过去只有一条翻山的老路。阿托高速自阿克斯维克链城区出发，横穿阿克斯岛，经尤普峡湾区到西岸的托克维克。线路翻越锚链山时以隧道穿过主脊，尤普峡湾区段跨越多条深谷。针对托克维克一带的浓雾天气，全线设置雾区行车诱导灯和能见度监测，雾大时自动发布临时限速。通车后，托克维克的海产可以当天运到阿克斯维克和长船的市场，西岸也因此吸引了不少新居民。
      en: Tåkevik on Akkersey's west coast is foggy most of the year and lives by fishing and shellfish farming, but the Anchor Chain Mountains stand between it and Akkersvik on the east side, with only an old road over the top. The Akkersvik–Tåkevik Expressway crosses the island from Chain Town in Akkersvik through Djupfjord District to Tåkevik. It tunnels under the main ridge of the Anchor Chain Mountains and bridges several deep valleys in Djupfjord District. For the Tåkevik fogs the whole line has guidance lights and visibility sensors, and temporary limits are posted automatically when the fog thickens. Tåkevik's seafood now reaches the markets of Akkersvik and Longship the same day, and the west coast has drawn many new residents.
    tunnel_cost: 3.5
    shield: anchor
    via: [div_b569a2, div_3zqdra]
  - id: rte_zc14xp
    ref: S-VK-4
    network: territorial_expressway
    class: motorway
    status: generated
    names:
      zh: 阿夫琳港邮轮高速
      en: Port Aveline Cruise Expressway
      art-x-viking: Kreuzfahrtautobahn Port Aveline
      art-x-buckham: Autostrada delle Crociere di Porto Aveline
    notes:
      zh: 阿夫琳港邮轮高速自阿夫琳港老城帆城区出发，经灯塔区沿海岸到阿夫琳码头区的邮轮母港与免税城，全长约一百公里，全程四十分钟左右。灯塔高架桥造型轻盈，是全线最长的桥梁，也是沿线的地标之一；邮轮码头一端设有大巴专用通道和集中换乘广场，沿线限制广告牌和高大建筑。全线双向十二车道，城区路段限速 140 公里，其余路段不限速。邮轮靠港的日子车流成倍增加，旅游大巴往返不断，平日则以前往免税城和海滨的车辆为主。
      en: The Port Aveline Cruise Expressway runs from Sail Town, the old heart of Port Aveline, through the Lighthouse District along the coast to the cruise home port and duty-free mall in Aveline Quay, about 100 km in some forty minutes. The light, graceful Lighthouse Viaduct is its longest bridge and a landmark of the coast. At the cruise terminal end there is a coach-only approach and a central interchange plaza, and billboards and tall buildings are restricted along the route. It has six lanes each way, a 140 km/h limit through towns and no limit elsewhere. Traffic multiplies on days when cruise ships are in, with a constant stream of tour coaches; on other days it carries mostly shoppers bound for the duty-free mall and beachgoers.
    background:
      zh: 阿夫琳码头区的邮轮母港和免税城是群岛最大的旅游门户，每逢邮轮靠港，大批游客要在短时间内往返阿夫琳港老城和码头。阿夫琳港邮轮高速自帆城区出发，经灯塔区到阿夫琳码头区，专为邮轮旅客和旅游大巴服务。线路沿海岸修建，跨越沿途海湾时修建了一座造型轻盈的海湾桥，成为沿线的地标之一；邮轮码头一端设置大巴专用通道和集中换乘广场。为保持海岸景观，沿线限制广告牌和高大建筑。通车后邮轮旅客往返老城的时间大大缩短，阿夫琳码头也发展为群岛最热闹的旅游区。
      en: The cruise home port and duty-free town at Aveline Quay are the islands' main tourist gateway, and whenever a ship is in, crowds of passengers need to get between the terminal and Port Aveline's old town in a few hours. The Port Aveline Cruise Expressway runs from Sail Town through Lighthouse District to Aveline Quay, built for cruise passengers and coaches. It follows the shore, and its light, graceful bridge across a bay on the way has become a landmark of the coast. At the cruise terminal end there are coach-only lanes and an interchange plaza. To keep the coastline unspoilt, billboards and tall buildings are restricted along the route. Passengers now reach the old town far more quickly, and Aveline Quay has become the liveliest resort in the islands.
    shield: sailboat
    via: [div_vhsby1, div_tkvfsx]
  - id: rte_7r6n3d
    ref: S-VK-5
    network: territorial_expressway
    class: motorway
    status: generated
    names:
      zh: 暖河高速
      en: Warm River Expressway
      art-x-viking: Warmfluss-Autobahn
      art-x-buckham: Autostrada del Fiume Caldo
    notes:
      zh: 暖河高速自暖泉温泉区出发，沿东岸平原北上到暖河区的河口新城，全长约五十七公里，全程二十多分钟，是群岛最短的领地高速之一。暖河特大桥跨越温暖不冻的暖河河口，是全线唯一的长桥，桥面预留了轨道交通的位置，桥下保留着天然温水湿地。全线双向十二车道，城区路段限速 140 公里，其余路段不限速。车流以新城居民往返温泉老城的通勤车辆为主，早晚高峰最为集中，周末则有不少前往温泉区的游客。
      en: The Warm River Expressway runs north from Hot Springs in Warmspring across the east-coast plain to the new town at the mouth of the Warm River, about 57 km in just over twenty minutes, one of the shortest territorial expressways in the islands. The Warm River Bridge over the warm, ice-free river mouth is its only long bridge; its deck has space set aside for a future rail line, and the natural warm-water wetland beneath it is left intact. It has six lanes each way, a 140 km/h limit through towns and no limit elsewhere. Its traffic is mostly residents of the new town commuting to the old spa town, concentrated at the morning and evening peaks, with plenty of weekend visitors heading for the hot springs.
    background:
      zh: 暖河区位于暖泉岛东岸的暖河河口，是暖泉规划建设的新城，承接从温泉老区疏解出来的人口和产业。暖河高速自暖泉温泉区出发，沿东岸北上到暖河区，与新城同步规划、同步建设。线路沿海岸平原修建，跨越暖河时修建了一座宽阔的河口大桥，桥面预留了未来轨道交通的位置。暖河河水常年温暖，冬季不结冰，桥下保留了天然温水湿地。通车后，新城居民到温泉老城上班十分便捷，暖河新城的人口也快速增长。
      en: Warm River District, at the mouth of the Warm River on Warmspring Island's east coast, is the new town Warmspring planned to take people and industry out of the crowded old Hot Springs district. The Warm River Expressway runs up the east coast from Hot Springs to Warm River and was planned and built together with the new town. It follows the coastal plain and crosses the Warm River on a wide estuary bridge, with space on the deck kept for a future rail line. The river stays warm all year and never freezes, and the warm-water wetland beneath the bridge was left as it was. Commuting from the new town to Hot Springs is now easy, and Warm River's population has grown quickly.
    shield: crab
    via: [div_cz7sch, div_vk1835]

  # 领道 (territorial highways, class primary): every district centre lies on a territorial route.
  - id: rte_cx8xa1
    ref: S-VK-101
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 谢尔海姆山公路
      en: Kjølheim Hills Road
      art-x-viking: Kjølheimberg-Landstraße
      art-x-buckham: Strada dei Monti Chiglia
    notes:
      zh: 谢尔海姆山公路自长船岛船尾出发，经斯蒂尔维克和谢尔海姆山下的谢尔海姆，沿山间谷地到朗桑德，全长约二百九十公里，全程两小时十几分钟，串起长船岛中段的山城和乡镇。线路沿谷地和缓坡修建，几乎没有桥隧，沿线保留了多处老村道的石桥作为步行道。全线双向八车道，沿途大多是乡村，全程不限速。它是山区乡镇通往两侧高速的连接线，车流以乡镇之间的短途车辆、运送林果的货车和乡村旅游的自驾游客为主，谢尔海姆与朗桑德附近的路段最为繁忙。
      en: The Kjølheim Hills Road runs from Longship Island's stern through Styrvik and Kjølheim, below the Kjølheim Hills, then along the upland valleys to Langsand, about 290 km in a little over two hours, linking the hill towns and villages of the middle of the island. It follows valleys and gentle slopes, with almost no bridges or tunnels, and several old stone bridges of the village tracks it replaced survive alongside as footpaths. It has four lanes each way and, running mostly through countryside, no speed limit. It links the hill towns to the expressways on either side, and its traffic is mainly local trips between towns, lorries carrying fruit and timber and touring drivers visiting the villages; it is busiest near Kjølheim and Langsand.
    background:
      zh: 长船岛中段的谢尔海姆山下散布着许多山城和乡镇，两侧的高速都只经过山脚，山区内部的交通长期依靠窄小的村道。谢尔海姆山公路自长船岛船尾出发，经斯蒂尔维克、谢尔海姆山下的谢尔海姆到朗桑德，把长船岛中段的乡镇串成一线。线路沿山间谷地和缓坡修建，避开陡峭的山脊，工程以路基为主，桥隧很少；沿线保留了多处老村道的石桥作为步行道。它为山区乡镇提供了通往两条高速的连接，谢尔海姆山的林果和乡村旅游也随之发展起来。
      en: Many hill towns and villages lie among the Kjølheim Hills in the middle of Longship Island. The expressways on either side only skirt the foot of the hills, and inside them people long made do with narrow village lanes. The Kjølheim Hills Road runs from Longship Island's stern through Styrvik and Kjølheim, the town beneath the hills, to Langsand, linking the island's middle towns in one line. It follows the valleys and gentle slopes, avoiding the steep ridges, so it is almost all at grade with very few bridges or tunnels, and several old stone bridges of the village lanes have been kept as footpaths. It connects the hill towns to both expressways, and orchards and rural tourism in the Kjølheim Hills have grown along it.
    shield: wave
    via: [div_1tva4b, div_ej0v6c, div_drqyc2, div_dtk19k]
  - id: rte_15zjhp
    ref: S-VK-102
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 阿夫琳港灯塔公路
      en: Port Aveline Lighthouse Road
      art-x-viking: Leuchtturmstraße Port Aveline
      art-x-buckham: Strada del Faro di Porto Aveline
    notes:
      zh: 阿夫琳港灯塔公路自邮轮港所在的阿夫琳码头区出发，沿海崖和海湾通往阿夫琳岛东北端的灯塔区，全长约七十公里，全程半小时左右。灯塔特大桥贴水跨过海湾，是全线最长的桥梁；海崖附近路段在海鸟繁殖季节限制鸣笛和夜间照明。全线双向八车道，沿途都是乡村，全程不限速。车流以邮轮游客的旅游大巴和自驾车辆为主，终点的老灯塔、海洋博物馆和观鸟站是热门的一日游目的地，邮轮靠港的日子路上最为热闹。
      en: The Port Aveline Lighthouse Road runs from Aveline Quay, home of the cruise port, along sea cliffs and bays to the Lighthouse District at the north-east tip of Aveline Island, about 70 km in some half an hour. The Lighthouse Viaduct, which crosses a bay just above the water, is its longest bridge, and during the seabird breeding season horns and night lighting are restricted on the stretches near the cliffs. It has four lanes each way and, running through countryside all the way, no speed limit. Its traffic is mostly tour coaches and hire cars carrying cruise passengers; the old lighthouse, the maritime museum and the birdwatching station at the end are popular day trips, and the road is liveliest when cruise ships are in.
    background:
      zh: 灯塔区位于阿夫琳岛东北端，岬角上的老灯塔是群岛最古老的航标之一，周围的海崖和海鸟栖息地吸引着许多游客，过去游客只能乘船或沿崎岖的小路前往。阿夫琳港灯塔公路自邮轮港所在的阿夫琳码头区出发，通往灯塔区，线路多处沿海崖和海湾修建，跨越海湾时以低矮的桥梁贴水而过，减少对海鸟的惊扰；繁殖季节，海崖附近路段限制鸣笛和夜间照明。通车后，邮轮游客可以在一天之内往返灯塔，灯塔区也建起了海洋博物馆和观鸟站。
      en: Lighthouse District sits at the north-east tip of Aveline Island, where the old lighthouse on the cape is one of the oldest sea marks in the islands, and its sea cliffs and seabird colonies draw many visitors, who once had to come by boat or on a rough path. The Port Aveline Lighthouse Road runs from Aveline Quay, where the cruise port is, out to Lighthouse District. It follows sea cliffs and bays for much of the way and crosses the inlets on low bridges close to the water to disturb the seabirds as little as possible; in the breeding season horns and night lighting are restricted near the cliffs. Cruise passengers can now visit the lighthouse in a day, and the district has gained a maritime museum and a bird-watching station.
    shield: lighthouse
    via: [div_tkvfsx, div_8a2hzm]
  - id: rte_8jm50e
    ref: S-VK-103
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 暖泉环山公路
      en: Warmspring Volcano Road
      art-x-viking: Warmquell-Vulkanstraße
      art-x-buckham: Strada del Vulcano di Fontecalda
    notes:
      zh: 暖泉环山公路环绕暖泉火山山麓，自温泉区出发，经斯瓦特桑德、新特雷曼、克莱特斯塔德到看落日的落日区，全长约四百一十公里，全程三小时多，是暖泉岛最早的环山道路。线路沿用旧路，绕开地热活跃区和喷气孔，地热路段设有温度监测；沿途跨越九条山溪和河流，桥梁都不长。全线双向八车道，城区路段限速 120 公里，其余路段不限速。南环高速分走长途车辆后，它主要承担火山山麓的地方交通和观光车流，温泉村、斯瓦特桑德海滩和落日岬观景台一带傍晚最为热闹。
      en: The Warmspring Volcano Road circles the foot of Warmspring Volcano from Hot Springs through Svartsand, Tremaine Bay and Klettstad to Sunset, where people come to watch the sun go down. It is about 410 km long, a little over three hours end to end, and the oldest road round the volcano. It follows the old track, skirting the active geothermal ground and the fumaroles, with temperature monitoring on the geothermal stretches, and crosses nine streams and rivers on short bridges. It has four lanes each way, a 120 km/h limit through towns and no limit elsewhere. With long-distance traffic now on the Southern Arc Expressway, it carries local traffic round the volcano and sightseers, and is liveliest in the evening around the spa villages, the black-sand beaches and the Sunset Point lookout.
    background:
      zh: 暖泉环山公路是暖泉岛最早的环山道路，原本是一条连接火山山麓温泉村落的土路，后经领地全线改建为领道。线路自温泉区出发，经斯瓦特桑德、新特雷曼、克莱特斯塔德到看落日的落日区，环绕暖泉火山的山麓。改建时线路尽量沿用旧路，绕开地热活跃区和喷气孔，路面采用耐高温材料，地热路段设置温度监测。沿线的温泉村、斯瓦特桑德海滩和落日岬观景台构成了一条著名的观光路线。南环高速建成后，这条公路主要承担火山山麓的地方交通和观光车流。
      en: The Warmspring Volcano Road is the oldest road round Warmspring Volcano, once a dirt track linking the hot-spring villages on its slopes and later rebuilt throughout as a territorial highway. It runs from Hot Springs through Svartsand, Tremaine Bay and Klettstad to Sunset, where people come to watch the sun go down, circling the foot of the volcano. The rebuilt road keeps to the old line as far as it can, steering clear of active geothermal ground and fumaroles; the pavement is heat-resistant and the geothermal stretches have temperature sensors. The hot-spring villages, the black beaches and the lookout at Sunset Point make it a well-known scenic drive. Since the Southern Arc Expressway opened, the road carries mostly local and sightseeing traffic.
    shield: shell
    via: [div_cz7sch, div_v2tq1k, div_k0zt4f, div_ghpaw7, div_b4by9r]
  - id: rte_f4nr9s
    ref: S-VK-104
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 乌维克库特跨海公路
      en: Uviqkut Causeway
      art-x-viking: Uviqkut-Damm
      art-x-buckham: Diga di Uviqkut
    notes:
      zh: 乌维克库特跨海公路自瓦莱区出发，以伦达霍尔姆水道跨海大桥跨海北上到西基克图克岛，全长约一百七十公里，全程一小时二十分钟左右，是乌维克库特两岛之间唯一的陆路。伦达霍尔姆水道跨海大桥长七十多公里，占全线近一半，是群岛最长的桥梁之一，桥面设有观鲸平台。全线双向八车道，跨海路段限速 120 公里，岛上路段不限速。车流在领道中属于较少的一类，以两岛之间的通勤、就医和上学车辆为主，鲸类洄游季节观鲸平台上常有游客停留。
      en: The Uviqkut Causeway runs from Hvaley District over the Lundaholm Sound Bridge, north across the open sea to Siqqiqtuuq Island, about 170 km in some eighty minutes, the only land link between the two outer isles. The Lundaholm Sound Bridge, more than 70 km long and nearly half the route, is one of the longest bridges in the islands, and has whale-watching platforms on its deck. It has four lanes each way, a 120 km/h limit over the sea and no limit on the islands. Its traffic is light by the standards of territorial highways, mostly islanders travelling between the two isles to work, to hospital and to school, and in the whale migration season visitors linger on the viewing platforms.
    background:
      zh: 乌维克库特由瓦莱岛和西基克图克岛两座海岛组成，两岛之间隔着七十多公里宽的海面，过去只靠小渡轮往来，冬季常因风浪停航，岛上居民就医、上学都很不便。乌维克库特跨海公路以一座长长的跨海桥连接瓦莱岛与西基克图克岛，是乌维克库特两岛之间唯一的陆路。这片海域是鲸类洄游的通道，桥梁跨度和桥墩位置经过专门论证，施工避开鲸类洄游季节，并全程进行水下噪声监测；桥面设置观鲸平台。通车后两岛的学校、医院和码头实现共享，跨海桥本身也成了乌维克库特的标志性景观。
      en: The Uviqkut are two islands, Hvaley and Siqqiqtuuq Island, some seventy kilometres of open sea apart. They were linked only by a small ferry that winter gales often stopped, which made getting to a doctor or to school hard. The Uviqkut Causeway joins them with one long sea bridge, the only land link between the two. These waters are a whale migration route, so the spans and pier positions were studied with care, work stopped during the migration season, and underwater noise was monitored throughout. There are whale-watching platforms on the deck. The two islands now share their schools, hospital and harbour, and the bridge itself has become the Uviqkut' landmark.
    shield: whale
    via: [div_khmgcq, div_5p2a2d]
  - id: rte_gp49t9
    ref: S-VK-105
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 长船西北岸公路
      en: Longship North-West Shore Road
      art-x-viking: Langskip-Nordwestküstenstraße
      art-x-buckham: Strada della Costa Nord-Ovest di Navelunga
    notes:
      zh: 长船西北岸公路自弗洛德维克出发，经朗桑德、西岸的住宅区和海滨公园到北岬，全长约一百六十公里，全程一小时十几分钟，是首府西北岸社区平行于高速的地方通道。线路紧贴海岸修建，靠海一侧设有连续的步道和自行车道，与海滨公园连成一体，西岸大桥是全线唯一的大桥。全线双向八车道，城区路段限速 120 公里，其余路段不限速。沿线是首府扩展最快的住宅区，早晚通勤车流很大，日均车流居领道前列；周末则有大批居民到海滨散步、骑车。
      en: The Longship North-West Shore Road runs from Flodvik through Langsand and the neighbourhoods and seafront parks of West Shore to North Cape, about 160 km in a little over an hour and a quarter; it is the local road for the capital's north-west shore communities, running parallel to the expressway. It hugs the shore, with a continuous footpath and cycle lane on the seaward side that merges into the seafront parks, and the West Shore Viaduct is its only major bridge. It has four lanes each way, a 120 km/h limit through towns and no limit elsewhere. The neighbourhoods along it are the fastest-growing in the capital, so commuter traffic is heavy morning and evening and its daily traffic is among the highest of any territorial highway; at weekends crowds come down to the seafront to walk and cycle.
    background:
      zh: 长船岛西北岸自弗洛德维克到北岬一带，是首府扩展最快的住宅区，海边分布着沙滩和海滨公园。原有的海岸道路狭窄，居民进出主要依靠长船西岸高速，短途出行也不得不上高速。长船西北岸公路自弗洛德维克出发，经朗桑德、西岸的住宅区和海滨公园到北岬，为沿岸社区提供一条平行于高速的地方通道。线路紧贴海岸修建，靠海一侧设置连续的步道和自行车道，与海滨公园融为一体。它分担了大量短途交通，也让西北岸成为首府居民周末休闲的去处。
      en: The north-west shore of Longship Island, from Flodvik to North Cape, is where the capital's housing has spread fastest, with beaches and seaside parks along the water. The old coast road was narrow, so residents relied on the West Shore Expressway even for short trips. The Longship North-West Shore Road runs from Flodvik through Langsand and the housing and seaside parks of West Shore to North Cape, a local road for the shore communities alongside the expressway. It hugs the coast, with a continuous promenade and cycle path on the seaward side that merges into the parks. It takes much of the short local traffic off the expressway and has made the north-west shore a weekend escape for the capital.
    shield: dolphin
    via: [div_0yqqc3, div_kecby5, div_xps98r]
  - id: rte_v97vbz
    ref: S-VK-106
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 卡洛韦岭公路
      en: Calloway Ridge Road
      art-x-viking: Callowaygrat-Straße
      art-x-buckham: Strada della Cresta Calloway
    notes:
      zh: 卡洛韦岭公路沿阿夫琳岛西北岸，自莫塞出发，经维托斯、卡洛韦岭下的林场小镇到阿夫琳港老城帆城区，全长约二百九十公里，全程两小时十几分钟，与东南岸的阿夫琳纵贯高速形成阿夫琳岛的两条纵线。线路沿山麓与海岸之间的阶地修建，跨越多条山溪，桥梁短而多；林区路段设有运木车避让车道。全线双向八车道，城区路段限速 120 公里，其余路段不限速。车流以运木车、林场小镇的短途车辆和入住造船工坊、林场木屋民宿的游客为主，靠近阿夫琳港的路段通勤车辆较多。
      en: The Calloway Ridge Road runs along the north-west shore of Aveline Island from Måsey through Hvitås and the forest towns below the Calloway Ridge to Sail Town, the old heart of Port Aveline, about 290 km in a little over two hours; with the Aveline Spine Expressway on the south-east shore it gives the island two north–south routes. It follows the terraces between the foothills and the shore, crossing many mountain streams on short bridges, and the forest stretches have pull-outs for log trucks. It has four lanes each way, a 120 km/h limit through towns and no limit elsewhere. Its traffic is mostly log trucks, local trips between the forest towns and visitors staying in the old boatbuilders' workshops and forest cabins, with more commuters near Port Aveline.
    background:
      zh: 卡洛韦岭纵贯阿夫琳岛西北部，山下的林场小镇世代以伐木和木船制造为生，与岛东南岸的城市之间交通不便。卡洛韦岭公路沿阿夫琳岛西北岸，自莫塞经维托斯、卡洛韦岭下的林场小镇到阿夫琳港老城，与东南岸的阿夫琳纵贯高速形成阿夫琳岛的两条纵线。线路沿山麓与海岸之间的阶地修建，跨越多条山溪，桥梁短而多；林区路段设置运木车专用的避让车道。沿线的造船工坊和林场木屋已成为特色民宿。通车后，西北岸的林产品和手工木船可以直接运往阿夫琳港。
      en: Calloway Ridge runs down the north-west of Aveline Island, and the forest towns beneath it have lived for generations by logging and building wooden boats, poorly connected to the cities on the south-east coast. The Calloway Ridge Road follows the north-west shore from Måsey through Hvitås and the forest towns below the ridge to Port Aveline's old town, making a second north–south line on the island alongside the Aveline Spine Expressway. It runs on the terraces between the hills and the shore and crosses many mountain streams on short bridges, and the forest stretches have pull-outs for timber trucks. Boatbuilders' workshops and forest cabins along the way have become guesthouses. Timber and handmade boats from the north-west now go straight to Port Aveline's harbour.
    shield: starfish
    via: [div_rvrs7v, div_v3mfeg, div_bs2e6p, div_vhsby1]
  - id: rte_mdpeba
    ref: S-VK-107
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 萨尔塔维克海滨公路
      en: Saltavik Coast Road
      art-x-viking: Saltavik-Küstenstraße
      art-x-buckham: Strada Costiera di Baiasale
    notes:
      zh: 萨尔塔维克海滨公路沿阿夫琳岛东南岸，自菲斯克海姆出发，经萨尔塔维克的盐场到望海的果园，全长约二百公里，全程一个半小时左右。线路沿海岸低地修建，在盐场外侧以路堤代替海堤，兼作防潮堤；果园路段两侧保留着防风林，全线几乎没有桥梁。全线双向八车道，沿途都是乡村，全程不限速。长途车辆大多改走阿夫琳纵贯高速，这条路主要服务沿岸的盐场、果园和渔港，也是看海景、买海盐和水果的热门自驾路线，秋季果园采摘时节最为繁忙。
      en: The Saltavik Coast Road runs along the south-east shore of Aveline Island from Fiskheim past the salt works of Saltavik to the orchards of Seawatch, about 200 km in some ninety minutes. It follows the coastal lowlands, running on an embankment outside the salt pans that doubles as a sea wall, with shelterbelts kept on both sides through the orchards; it has almost no bridges. It has four lanes each way and, running through countryside all the way, no speed limit. Most long-distance traffic now takes the Aveline Spine Expressway, so this road mainly serves the salt works, orchards and fishing harbours along the shore. It is also a favourite drive for sea views, sea salt and fruit, busiest in autumn when the orchards open for picking.
    background:
      zh: 阿夫琳岛东南岸的萨尔塔维克有群岛最大的海盐盐场，相邻的望海以果园著称，菲斯克海姆则是传统的渔业小镇，三地之间原本只有盐场的运盐土路和渔民的小道。萨尔塔维克海滨公路自菲斯克海姆出发，经萨尔塔维克的盐场到望海的果园，沿海岸低地修建。为保护盐田，线路在盐场外侧以路堤代替海堤，路堤同时起到防潮作用；果园路段两侧保留防风林。阿夫琳纵贯高速通车后，这条公路主要服务沿岸的盐场、果园和渔港，也是看海景、买海盐和水果的热门自驾路线。
      en: Saltavik Bay on Aveline Island's south-east coast has the islands' largest sea-salt works, neighbouring Seawatch is known for its orchards, and Fiskheim is an old fishing town. Between them there used to be only the salt works' haul tracks and fishermen's paths. The Saltavik Coast Road runs along the coastal lowland from Fiskheim past the Saltavik Bay salt pans to the Seawatch orchards. To protect the salt pans its embankment runs along their seaward side and serves as the sea wall too, while the orchard stretches keep their shelter belts on both sides. Since the Aveline Spine Expressway opened it mainly serves the salt works, orchards and harbour, and it is a popular drive for sea views, salt and fruit.
    shield: fish
    via: [div_z1y7bz, div_626x3f, div_5rbg50]
  - id: rte_pytm4p
    ref: S-VK-108
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 阿克斯维克湾公路
      en: Akkersvik Bay Road
      art-x-viking: Akkersvikbucht-Straße
      art-x-buckham: "Strada della Baia dell'Ancora"
    notes:
      zh: 阿克斯维克湾公路绕阿克斯岛南端的阿克斯维克湾，自西爪出发，经阿克斯维克湾老港到东岸的瑙斯特海姆区，全长约二百四十公里，全程近两小时。线路以西爪特大桥等桥梁跨过海湾的几处深水湾汊，桥下净空满足新造船舶出港；老港路段从石砌码头和渔市后方绕过。全线双向八车道，城区和桥梁路段限速 120 公里，其余路段不限速。车流以西爪居民往返船厂的通勤车辆和运送船用钢材的货车为主，阿克斯维克湾老港一带周末常有游客。
      en: The Akkersvik Bay Road runs round Akkersvik Bay at the southern end of Akkersey, from West Fluke through the old harbour of Akkersvik Bay to the Naustheim District on the east shore, about 240 km in nearly two hours. Bridges such as the West Fluke Viaduct carry it over the bay's deep-water inlets, high enough for newly built ships to pass beneath, and through the old harbour it passes behind the stone quays and the fish market. It has four lanes each way, a 120 km/h limit through towns and on the bridges, and no limit elsewhere. Its traffic is mostly West Fluke residents commuting to the shipyards and lorries carrying ship steel, and the old harbour of Akkersvik Bay draws visitors at weekends.
    background:
      zh: 阿克斯维克湾是阿克斯岛南端的天然良港，西爪和东岸的瑙斯特海姆区分处海湾两侧，过去陆路要沿海湾绕一大圈，许多人宁愿乘渡船。阿克斯维克湾公路自西爪出发，经阿克斯维克湾老港到东岸的瑙斯特海姆区，绕阿克斯维克湾修建，并以桥梁跨过海湾的几处深水湾汊，大大缩短了绕湾距离。老港路段从石砌码头和渔市后方绕过，老港风貌得以保留；桥梁净空满足船厂新造船舶出港的要求。通车后，西爪的居民可以方便地到瑙斯特海姆上班，阿克斯维克湾老港也成了游客喜爱的海港小镇。
      en: Akkersvik Bay at the southern end of Akkersey is a fine natural harbour, with West Fluke and the shipyards of Naustheim District on opposite sides. By land the way went all round the bay, and many people preferred the ferry. The Akkersvik Bay Road runs from West Fluke through the old port of Akkersvik Bay to the shipyards on the east shore, around the bay but with bridges over several of its deep arms, cutting the distance a great deal. In the old port the road passes behind the stone quays and fish market, which were left as they were, and the bridges have clearance for new ships leaving the yards. West Fluke's people can now get to work at the yards easily, and the old port has become a harbour town popular with visitors.
    shield: helm
    via: [div_j1czet, div_a2n8cw, div_qyhvjj]
  - id: rte_ga64q4
    ref: S-VK-109
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 阿克斯岛峡湾公路
      en: Akkersey Fjord Road
      art-x-viking: Akkersey-Fjordstraße
      art-x-buckham: "Strada dei Fiordi dell'Isola dell'Ancora"
    notes:
      zh: 阿克斯岛峡湾公路是阿克斯岛最长的领道，自阿克斯维克链城区出发到西岸的托克维克，再沿峡湾北上，绕到东北端的富鲁海姆，全长约四百五十公里，全程三个半小时左右。线路沿峡湾岸边的阶地修建，峡湾最深处绕行湾头，桥梁很少，托克维克大桥是其中最长的一座；陡崖路段建有明洞和防落石棚。全线双向八车道，城区和陡崖路段限速 120 公里，其余路段不限速。沿线设有多个峡湾观景停车点，夏季自驾游客很多，冬季则以峡湾村落的补给车辆和校车为主。
      en: The Akkersey Fjord Road is the longest territorial highway on Akkersey. It runs from Chain Town in Akkersvik to Tåkevik on the west coast, then north along the fjords and round to Furuheim at the north-east end, about 450 km in some three and a half hours. It keeps to the terraces along the fjord shores and goes round the heads of the deepest fjords, so it has few bridges, the Tåkevik Viaduct being the longest; cut-and-cover sections and rockfall shelters protect it below the steepest cliffs. It has four lanes each way, a 120 km/h limit through towns and below the cliffs, and no limit elsewhere. Its many fjord viewpoints draw crowds of touring drivers in summer; in winter its traffic is mostly supply vehicles and school buses for the fjord villages.
    background:
      zh: 阿克斯岛西岸峡湾深切，峡湾两岸的村落长期与外界隔绝，物资主要靠补给船运送。阿克斯岛峡湾公路自阿克斯维克链城区出发到西岸的托克维克，再沿峡湾北上，绕到东北端的富鲁海姆，是阿克斯岛最长的领道。线路尽量沿峡湾岸边的阶地修建，峡湾最深处绕行湾头，不建跨峡湾大桥，以控制造价；陡崖路段修建明洞和防落石棚。沿线峡湾风光壮丽，设有多个观景停车点。通车后西岸的峡湾村落第一次有了全年通行的公路，峡湾观光也成为阿克斯岛的重要产业。
      en: Akkersey's west coast is cut by deep fjords, and the villages on their shores were long isolated, supplied mainly by boat. The Akkersey Fjord Road runs from Chain Town in Akkersvik to Tåkevik on the west coast, then north along the fjords and round to Furuheim in the north-east, Akkersey's longest territorial highway. It keeps to the terraces along the fjord shores and goes round the heads of the deepest fjords rather than bridging them, to hold down the cost, with cut-and-cover sections and rockfall shelters under the steepest cliffs. The fjord scenery is magnificent, and there are many lay-bys to take it in. The fjord villages have their first year-round road, and fjord tourism has become one of Akkersey's main trades.
    shield: buoy
    via: [div_b569a2, div_6ajqsc, div_27g39m, div_k4wvwe]
  - id: rte_3wg1t6
    ref: S-VK-110
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 西格利岛公路
      en: Sigley Road
      art-x-viking: Sigley-Straße
      art-x-buckham: "Strada dell'Isola dell'Albero"
    notes:
      zh: 西格利岛公路穿过西格利岛笔直高大的松林，连接南端的南桅与北端的西格拉维克，全长约六十四公里，全程半小时左右。线路几乎是一条直线，两侧松林夹道，是岛上最有名的风景；路基宽度严格控制，路上方架有供松鼠等小动物通过的树冠绳桥。全线双向八车道，沿途都是森林，全程不限速。它把南桅与西格利跨海高速连在一起，车流以运送松木的货车、木材加工厂的职工和前来森林徒步的游客为主，秋冬季节偶有驼鹿横穿道路。
      en: The Sigley Road runs through Sigley's tall, straight pines, linking South Mast at the southern end with Siglavik at the northern end, about 64 km in some half an hour. It is nearly a straight line, the pines closing in on both sides, and is the island's best-known view; the roadbed was kept narrow, and canopy rope bridges overhead let squirrels and other small animals cross. It has four lanes each way and, running through forest all the way, no speed limit. It connects South Mast to the Sigley Sea Crossing, and its traffic is mostly pine-log lorries, sawmill workers and visitors coming to hike in the forest; in autumn and winter elk occasionally wander across.
    background:
      zh: 西格利岛以笔直高大的松林著称，岛上的松木曾是造船桅杆的上等材料，西格利岛也因此得名。南桅与西格拉维克分处岛的南北两端，过去只有伐木道相连。西格利岛公路穿过西格利岛的松林，连接南桅与西格拉维克，线路几乎笔直，两侧松林夹道，成为岛上最有名的风景。为保护松林，路基宽度严格控制，施工中尽量少砍树木，并为松鼠等小动物架设了树冠绳桥。西格利跨海高速通车后，这条公路把南桅与跨海通道连了起来，南桅的木材加工和森林旅游也随之兴旺。
      en: Sigley is famous for its tall, straight pines, once prized for ships' masts, which gave the island its name. South Mast and Siglavik lie at its southern and northern ends and used to be joined only by logging tracks. The Sigley Road runs through the pines between them, almost dead straight, with the forest close on both sides, the island's best-known sight. To protect the forest the roadbed width was kept to a strict minimum, as few trees as possible were felled, and rope bridges were strung between the treetops for squirrels and other small animals. Since the Sigley Sea Crossing opened, the road has tied South Mast to the crossing, and its sawmills and forest tourism have prospered.
    shield: knot
    via: [div_berjt2, div_2q2fcx]
  - id: rte_cgwhfz
    ref: S-VK-111
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 圣翁丁公路
      en: Saint-Ondine Road
      art-x-viking: Saint-Ondine-Straße
      art-x-buckham: "Strada di Sant'Ondine"
    notes:
      zh: 圣翁丁公路自圣翁丁岛南岸的圣翁丁镇出发，翻过全岛到达北岸的圣翁丁渡轮码头，全长约六十四公里，全程半小时左右，是岛上唯一的干线公路。线路沿山坡缓缓爬升，全线没有桥隧，山顶的观景台可以同时眺望南北两侧的海面；渡轮码头一端设有候船车道，车辆按班次有序上下渡轮。全线双向八车道，沿途都是乡村，全程不限速。车流随渡轮班次起伏，每班渡轮靠岸后会有一阵集中的车流，夏季前往海岛度假区的游客最多。
      en: The Saint-Ondine Road runs from the town of Saint-Ondine on the south coast of Saint-Ondine Island over the island to the Saint-Ondine Ferry Terminal on the north shore, about 64 km in some half an hour; it is the island's only main road. It climbs gently up the slopes with no bridges or tunnels, and the lookout at the top takes in the sea on both sides of the island. At the ferry terminal end there are holding lanes so vehicles board and leave each sailing in turn. It has four lanes each way and, running through countryside all the way, no speed limit. Its traffic rises and falls with the ferry timetable, with a burst of vehicles after each arrival, and it is busiest in summer with holidaymakers bound for the island's resorts.
    background:
      zh: 圣翁丁岛位于群岛南部外海，岛民以渔业和海岛度假为生，对外交通全靠北岸的渡轮码头。过去岛南的圣翁丁镇与北岸码头之间只有一条翻山小路，旅客和渔获往来十分不便。圣翁丁公路自圣翁丁镇出发，翻过全岛到达北岸的渡轮码头，是岛上唯一的干线公路。线路沿山坡缓缓爬升，在山顶设置了可以同时眺望南北海面的观景台；渡轮码头一端设置候船车道，便于车辆有序上下渡轮。通车后渡轮班次与公路衔接，圣翁丁岛的度假区也迎来了更多游客。
      en: Saint-Ondine Island lies offshore in the south of the islands; its people live by fishing and holiday trade, and their only link with the rest of the islands is the ferry pier on the north shore. Saint-Ondine town in the south was once joined to the pier only by a path over the hill, hard going for travellers and catches alike. The Saint-Ondine Road runs from Saint-Ondine town over the island to the ferry pier, the island's only through road. It climbs the slopes gently, with a lookout on the summit over the sea to both north and south, and at the pier there are marshalling lanes so vehicles board and leave the ferries in order. The ferries now connect with the road, and Saint-Ondine's resorts draw more visitors than ever.
    shield: coral
    via: [div_ht5w2y, poi_khwt70]
  - id: rte_1znwx2
    ref: S-VK-112
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 埃德文港公路
      en: Port Edevane Road
      art-x-viking: Port Edevane-Straße
      art-x-buckham: Strada di Porto Edevane
    notes:
      zh: 埃德文港公路自埃德文港镇出发，横穿全岛到达西岸的埃德文港渡轮码头，全长约五十五公里，全程半小时左右。线路的大半位于埃德文海峡跨海大桥上，这座低矮的长桥贴着滩涂延伸，桥下潮水自由进出，水鸟栖息地得以保留。由于桥梁比例很高，全线双向八车道，全程限速 120 公里。车流以岛民往返渡轮的车辆和运送渔获的货车为主，清晨常有游客从码头驱车去镇上看日出，候鸟季节桥上禁止停车观鸟，观鸟需到两端的观测点。
      en: The Port Edevane Road runs from the town of Port Edevane across Edevane Island to the Port Edevane Ferry Terminal on the west shore, about 55 km in some half an hour. More than half of it is on the Edevane Strait Bridge, a long, low bridge that runs just above the tidal flats, letting the tide flow freely beneath and leaving the waterbird habitat undisturbed. Because so much of it is bridge, it has four lanes each way and a 120 km/h limit throughout. Its traffic is mostly islanders driving to and from the ferry and lorries carrying the catch; early in the morning visitors drive from the terminal to the town to watch the sunrise. In the bird migration season stopping on the bridge is banned, and birdwatchers use the viewing points at either end.
    background:
      zh: 埃德文岛是群岛的一座外海岛屿，岛上的埃德文港镇以最早在这里筑港的埃德文船长命名，西岸是渡轮码头。埃德文港镇与码头之间地势低洼，涨潮时海水常漫过旧路，岛民往来要看潮水时刻。埃德文港公路自埃德文港镇出发，横穿埃德文岛到达西岸的渡轮码头，低洼路段全部改为低矮的长桥，桥下潮水自由进出，滩涂上的水鸟栖息地得以保留。桥梁采用预制短跨结构，施工时避开候鸟季节。通车后公路不再受潮水影响，清晨从码头驱车去镇上看日出也成了游客的固定节目。
      en: Edevane Island is one of the outlying islands. Port Edevane town is named after Captain Edevane, who first built a harbour here, and the ferry pier is on the west shore. The ground between them is low, and at high tide the sea used to flood the old road, so islanders planned their trips by the tide tables. The Port Edevane Road crosses the island from the town to the pier, with every low-lying stretch carried on long, low bridges that let the tide flow freely beneath and leave the waders' mudflats as they were. The bridges were built of short precast spans, with the works paused in the migration season. The road is now open whatever the tide, and driving from the pier to the town to watch the sunrise has become a fixture for visitors.
    shield: jellyfish
    via: [div_f07nky, poi_jvgsbc]
  - id: rte_n6fxbt
    ref: S-VK-113
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 乌利克尤阿克岛公路
      en: Ulikjuaq Island Road
      art-x-viking: Ulikjuaqinsel-Straße
      art-x-buckham: "Strada dell'Isola Ulikjuaq"
    notes:
      zh: 乌利克尤阿克岛公路自乌利克尤阿克镇的鱼干架旁出发，从镇子后方绕过海滨晾晒场，横穿乌利克尤阿克岛到东岸的乌利克尤阿克渡轮码头，全长约七十七公里，全程三十多分钟。乌利克尤阿克特大桥是全线唯一的大桥；路面按冷藏货车标准修建，渡轮码头旁建有冷库和鱼货集散站。全线双向八车道，沿途都是乡村，全程不限速。车流以运送风干鳕鱼和鲜鱼的冷藏货车为主，晾鱼季节前来参观鱼干架的游客也不少，渡轮靠岸前后车辆最为集中。
      en: The Ulikjuaq Island Road starts beside the fish-drying racks of Ulikjuaq, passes behind the town to avoid the drying grounds on the shore, and crosses Ulikjuaq Island to the Ulikjuaq Ferry Terminal on the east coast, about 77 km in just over half an hour. The Ulikjuaq Sea Bridge is its only major bridge; the road is built for refrigerated lorries, and next to the ferry terminal there are cold stores and a fish market depot. It has four lanes each way and, running through countryside all the way, no speed limit. Its traffic is mostly refrigerated lorries carrying dried and fresh cod, plus visitors who come to see the drying racks in season, and it is busiest around ferry arrivals and departures.
    background:
      zh: 乌利克尤阿克岛的名字在塔夫鲁纳克语里意为「大鱼」，乌利克尤阿克镇的海边至今排列着成片的鱼干架，风干鳕鱼是岛上最重要的特产。过去岛民和鱼干要用拖拉机沿海滩运到东岸的渡轮码头，遇到风暴潮便无法通行。乌利克尤阿克岛公路自乌利克尤阿克的鱼干架旁出发，横穿乌利克尤阿克岛到达东岸的渡轮码头，线路避开海滨的晾晒场，从镇子后方绕过。路面按冷藏货车标准修建，渡轮码头旁建有冷库和鱼货集散站。通车后，乌利克尤阿克岛的风干鳕鱼可以稳定地运往长船乃至更远的市场，晾鱼季节的鱼干架也成了岛上的独特风景。
      en: Ulikjuaq Island's name means big fish in Tavrunaq, and racks of drying fish still line the shore at Ulikjuaq; stockfish is the island's great product. Islanders and their fish used to be hauled by tractor along the beach to the ferry pier on the east shore, impossible in a storm surge. The Ulikjuaq Island Road runs from beside the Ulikjuaq drying racks across the island to the east-shore ferry pier, passing behind the town to keep clear of the drying grounds on the shore. It is built for refrigerated trucks, and beside the pier there is a cold store and fish market. Ulikjuaq's stockfish now travels reliably to Longship and farther, and in the drying season the racks are one of the island's sights.
    shield: fishhook
    via: [div_7pf4qf, poi_bw56b6]
  - id: rte_j3v7pf
    ref: S-VK-114
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 亚利图克岛公路
      en: Jaalituuq Island Road
      art-x-viking: Jaalituuqinsel-Straße
      art-x-buckham: "Strada dell'Isola Jaalituuq"
    notes:
      zh: 亚利图克岛公路自布兰诺克堡镇出发，沿风机林立的山脊到南岸的布兰诺克堡风电运维港，全长约四十二公里，全程二十分钟左右，是群岛最短的领道之一。线路按运输超长风机叶片的要求设计，弯道半径大、坡度缓，部分路段路面加宽；山脊路段设有挡风墙，大风时限制高车通行。全线双向八车道，沿途都是乡村，全程不限速。车流以风电场的运维车辆、运送叶片和塔筒的特种车辆为主，也有游客沿山脊行驶，近距离观看成排的风机。
      en: The Jaalituuq Island Road runs from the town of Fort Brannock along a ridge lined with wind turbines to the Fort Brannock Wind Service Port on the south coast, about 42 km in some twenty minutes, one of the shortest territorial highways in the islands. It was designed for hauling extra-long turbine blades, with wide curves, gentle grades and widened sections, and wind walls on the ridge, where high-sided vehicles are restricted in strong winds. It has four lanes each way and, running through countryside all the way, no speed limit. Its traffic is mostly maintenance vehicles for the wind farm and special transporters carrying blades and tower sections, plus visitors who drive the ridge to see the rows of turbines up close.
    background:
      zh: 亚利图克岛海风终年不息，是群岛风力发电的主要基地，岛上山脊排列着成片风机，南岸建有风电运维港。风电场开发之前，岛上只有布兰诺克堡镇和几处牧场，没有像样的道路。亚利图克岛公路自布兰诺克堡镇出发，沿风机林立的山脊到南岸的风电运维港，主要为风电场的建设和维护服务。线路按运输超长风机叶片的要求设计，弯道半径大、坡度缓，部分路段路面加宽；山脊路段设置挡风墙，大风时限制高车通行。通车后风电场得以大规模扩建，沿山脊行驶、近距离观看风机也成为亚利图克岛独特的旅游项目。
      en: The wind never drops on Jaalituuq Island, the islands' main wind-power base, its ridges lined with turbines and a wind-farm service port on the south shore. Before the wind farms there was only Fort Brannock town and a few pastures, and no real roads. The Jaalituuq Island Road runs from Fort Brannock along the turbine ridges to the service port on the south shore, built mainly to put up and maintain the wind farms. It is designed to carry the extra-long turbine blades, with wide curves, gentle grades and widened stretches, and on the ridge it has wind walls, with high-sided vehicles barred in gales. The wind farms have since grown a great deal, and driving the ridge among the turbines has become Jaalituuq Island's own attraction.
    shield: octopus
    via: [div_72h3ge, poi_p3cv8y]
