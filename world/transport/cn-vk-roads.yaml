# Road routes of the Viking Islands. Same conventions as cn-nv-roads.yaml, with the
# territory infix VK:
#   G-VK-1..99    国家高速 national expressway    (class motorway)
#   S-VK-1..99    领地高速 territorial expressway (class motorway)
#   S-VK-101..    领道 territorial highway        (class primary)
#   X-VK-001..    市道 city road                  (class secondary, derived)
# via entries may also be places with a site (e.g. a ferry terminal): the route stops at the
# landward side of the site.
# shield (territorial routes): sea-themed symbol on the Viking Islands' oval shield.
routes:
  # 国家高速: the trunk along the main-island chain, sea crossings between the main islands and
  # spines inside them.
  - id: rte_6mvf59
    ref: G-VK-1
    network: national_expressway
    class: motorway
    status: generated
    names:
      zh: 群岛跨海高速
      en: Island Chain Expressway
      art-x-viking: Inselkettenautobahn
      art-x-buckham: Autostrada delle Isole
    notes:
      zh: 群岛的主干高速，自暖泉岛西岸的岩港横贯暖泉岛，跨海到长船岛船尾的舵港，再沿龙骨山东南麓直到长船
      en: The trunk expressway of the islands, from Rockhaven on the west coast of Warmspring Island across the island, over the sea to Rudderhaven at Longship Island's stern, then along the south-east foot of the Keel Hills to Longship.
    background:
      zh: 维京群岛由多座大岛组成，过去岛与岛之间全靠渡轮，冬季风浪大时航班经常停开，暖泉岛与首府所在的长船岛常常隔海相望却无法往来。群岛跨海高速是群岛交通的主骨架，自暖泉岛西岸的岩港出发横贯暖泉岛，以跨海大桥越过暖泉海峡到长船岛船尾的舵港，再沿龙骨山东南麓直达长船。跨海段在深水区采用大跨度斜拉桥，浅水区采用预制箱梁长桥，桥面两侧设置风障，保证大风天气也能通行。它的建成让群岛第一次有了全天候的陆路，沿线城市也随之连成一片。
      en: The Viking Islands are a chain of large islands that once depended entirely on ferries, and in winter gales the sailings often stopped, leaving Warmspring Island and Longship Island, home of the capital, in sight of each other but cut off. The Island Chain Expressway is the backbone of the islands' network. It crosses Warmspring Island from Rockhaven on its west coast, bridges the Warmspring Strait to Rudderhaven at the stern of Longship Island, then follows the south-east foot of the Keel Hills to Longship. In deep water the crossing uses long cable-stayed spans and in the shallows long precast box-girder viaducts, with wind screens along both edges so it stays open in high winds. It gave the islands their first all-weather land link, and the cities along it have grown into one another.
    tunnel_cost: 3.5
    via: [div_6930nk, div_qjzmw5, div_er5g6j, div_33vctd, div_3cvg2q]
  - id: rte_1htwsa
    ref: G-VK-2
    network: national_expressway
    class: motorway
    status: generated
    names:
      zh: 长白跨海高速
      en: Longship–White Sail Sea Crossing
      art-x-viking: Meeresautobahn Langskip–Weißsegel
      art-x-buckham: Autostrada sul Mare Navelunga–Velabianca
    notes:
      zh: 以跨海大桥横越白帆海峡，连接首府长船与白帆
      en: Spans White Sail Strait on a sea bridge, linking the capital Longship with White Sail.
    background:
      zh: 白帆岛是群岛第二大城市白帆的所在地，与首府长船隔着宽阔的白帆海峡，往来主要靠高速客轮。长白跨海高速自长船古城出发，经汇金、东港和龙骨山下，以跨海大桥越过白帆海峡，再翻过帆影岭抵达白帆老城。海峡中部航道繁忙，主桥采用超大跨度悬索桥，桥下净空满足大型邮轮和集装箱船通行；帆影岭一侧以隧道穿山，避开岭上的林场。施工中海上桥墩在东港船厂预制后整体浮运就位。通车后两座城市之间形成了繁忙的通勤与物流走廊。
      en: White Sail Island holds the islands' second city, White Sail, across the broad White Sail Strait from the capital, Longship, and the two were linked mainly by fast passenger ships. The Longship–White Sail Sea Crossing runs from Longship's old town through Goldmark, East Harbour and the foot of the Keel Hills, bridges the White Sail Strait and crosses Sailshadow Ridge to White Sail's old town. The shipping lane in mid-strait is busy, so the main bridge is a very long suspension span with clearance for large cruise and container ships; on the Sailshadow side the road tunnels through the ridge to spare its forests. The sea piers were cast in the East Harbour shipyards and floated out whole. Since it opened the two cities have become one busy corridor of commuting and freight.
    via: [div_3cvg2q, div_x22naa]
  - id: rte_zxcxr7
    ref: G-VK-3
    network: national_expressway
    class: motorway
    status: generated
    names:
      zh: 锚岛跨海高速
      en: Anchor Strait Crossing
      art-x-viking: Ankerstraßenautobahn
      art-x-buckham: Autostrada dello Stretto dell'Ancora
    notes:
      zh: 横越锚岛海峡，连接长船岛西北岸的潮湾与锚岛的锚港
      en: Crosses Anchor Strait, linking Tidebay on the north-west shore of Longship Island with Anchorhaven on Anchor Island.
    background:
      zh: 锚岛与长船岛之间的锚岛海峡水深流急，是群岛最险的航道之一，渡轮常因潮流停航。锚岛跨海高速自长船岛西北岸的潮湾出发，跨越锚岛海峡到锚岛的船厂区，直达锚港链城区，是锚岛通往首府的门户。海峡中部水流最急，主桥采用大跨度设计以减少水中桥墩，两岸近岸段则以隧道穿过陡峭的岬角。由于海峡潮流强劲，桥墩基础施工只能在每天的平潮时段进行，工程因此格外漫长。通车后，锚港的船舶制造业与长船的航运、金融业连为一体。
      en: The Anchor Strait between Anchor Island and Longship Island is deep and fast-flowing, one of the most dangerous waters in the islands, and ferries were often stopped by the tides. The Anchor Strait Crossing runs from Tidebay on Longship Island's north-west shore across the strait to Shipyard District and on to Chain Town in Anchorhaven, Anchor Island's gateway to the capital. The current is strongest mid-strait, so the main bridge uses long spans to keep piers out of the water, while near the shores the road tunnels through steep headlands. The pier foundations could only be worked at slack water each day, which made the job unusually long. Since it opened, Anchorhaven's shipbuilding and Longship's shipping and finance have grown into one.
    via: [div_x20mfy, div_zg05xa]
  - id: rte_pb0tnq
    ref: G-VK-4
    network: national_expressway
    class: motorway
    status: generated
    names:
      zh: 白帆纵贯高速
      en: White Sail Spine Expressway
      art-x-viking: Weißsegel-Längsautobahn
      art-x-buckham: Autostrada Dorsale di Velabianca
    notes:
      zh: 沿白帆岛东南岸纵贯全岛，自西南端的银鸥经盐湾到白帆
      en: Runs the length of White Sail Island along its south-east shore, from Silvergull at the south-west end through Saltbay to White Sail.
    background:
      zh: 白帆岛狭长，城镇沿东南岸分布，原有的海滨公路弯多路窄，从岛西南端的银鸥到白帆老城要花大半天。白帆纵贯高速沿东南岸纵贯全岛，自银鸥出发，经白岭、渔港、盐湾、望海到帆城区，与长白跨海高速在白帆相接。线路大部分位于海岸后方的低丘上，避开盐湾的盐田和望海的果园，跨越沿岸的小海湾时修建了多座海湾桥。施工中挖出的土石用于加固盐田海堤。高速通车后，白帆岛的渔获、海盐和水果可以直接运往长船和各港口。
      en: White Sail Island is long and narrow, its towns along the south-east coast, and the old shore road was so winding and narrow that getting from Silvergull at the south-west tip to White Sail's old town took most of a day. The White Sail Spine Expressway runs the length of the island along that coast, from Silvergull through Whiteridge, Fishing Harbour, Saltbay and Seawatch to Sail Town, meeting the Longship–White Sail Sea Crossing at White Sail. Most of it rides the low hills behind the shore, keeping clear of the Salt Bay salt pans and the Seawatch orchards, with bridges across the small coastal inlets. Spoil from the works went into strengthening the salt-pan sea walls. White Sail Island's catch, sea salt and fruit now travel straight to Longship and the ports.
    tunnel_cost: 3.5
    via: [div_0770jy, div_ewqq3p, div_x22naa]
  - id: rte_v17pgv
    ref: G-VK-5
    network: national_expressway
    class: motorway
    status: generated
    names:
      zh: 锚岛纵贯高速
      en: Anchor Island Spine Expressway
      art-x-viking: Ankerinsel-Längsautobahn
      art-x-buckham: Autostrada Dorsale dell'Isola dell'Ancora
    notes:
      zh: 自锚岛南端的锚湾北上，经锚港市区到东北端的松林
      en: North from Anchor Bay at the southern end of Anchor Island through central Anchorhaven to Pinewood at the north-east end.
    background:
      zh: 锚岛南北狭长，中部被锚链山和多条峡湾分隔，南端的锚湾与东北端的松林之间过去只能乘船往来。锚岛纵贯高速自锚湾北上，经船厂区、锚港链城区和峡湾区到松林，是锚岛的南北主干。线路在峡湾区以连续的跨峡湾大桥越过一道道峡湾，桥梁高度满足渔船和游艇通行；遇到锚链山的山脊时以隧道穿过。峡湾两岸岩壁坚硬，桥台直接嵌入岩体。通车后锚港的船厂得以从岛南北两端招募工人，松林的木材也不再需要海运。
      en: Anchor Island is long and narrow, its middle broken up by the Anchor Chain Mountains and a series of fjords, and Anchor Bay in the south and Pinewood in the north-east were once reachable only by boat. The Anchor Island Spine Expressway runs north from Anchor Bay through Shipyard District, Chain Town in Anchorhaven and Fjord District to Pinewood as the island's north–south trunk. Through Fjord District it leaps one fjord after another on high bridges with clearance for fishing boats and yachts, and it tunnels through the spurs of the Anchor Chain Mountains. The fjord walls are hard rock, so the abutments are set straight into it. The Anchorhaven shipyards can now recruit from both ends of the island, and Pinewood's timber no longer goes by sea.
    tunnel_cost: 3.5
    via: [div_a2n8cw, div_zg05xa, div_bbmwea]
  - id: rte_bd7834
    ref: G-VK-6
    network: national_expressway
    class: motorway
    status: generated
    names:
      zh: 暖泉南环高速
      en: Warmspring Southern Arc Expressway
      art-x-viking: Warmquell-Südbogenautobahn
      art-x-buckham: Autostrada dell'Arco Sud di Fontecalda
    notes:
      zh: 绕暖泉火山南麓，自暖泉经硫磺湾到岩港，与群岛跨海高速合成环岛高速
      en: Round the southern foot of Warmspring Volcano from Warmspring through Sulphur Bay to Rockhaven; with the Island Chain Expressway it makes a ring round the island.
    background:
      zh: 暖泉岛中央耸立着暖泉火山，群岛跨海高速经火山北侧横贯全岛，南侧的黑沙、硫磺湾一带只能走狭窄的环山公路。暖泉南环高速绕火山南麓，自暖泉温泉区经黑沙、硫磺湾到岩港，与群岛跨海高速合成环岛高速。线路穿过大片火山熔岩和黑沙海岸，路基用当地火山渣填筑；考虑到火山活动，选线避开了历史熔岩流的通道，并在沿线设置火山监测点和紧急疏散标志。通车后，温泉、黑沙海滩与硫磺湾的地热景观连成一条旅游环线，也为火山应急疏散多提供了一条通道。
      en: Warmspring Volcano rises in the middle of Warmspring Island. The Island Chain Expressway crosses the island north of it, and the Black Sand and Sulphur Bay country to the south had only a narrow mountain road. The Warmspring Southern Arc Expressway rounds the volcano's southern foot from Hot Springs through Black Sand and Sulphur Bay to Rockhaven, closing a ring round the island with the Island Chain Expressway. It crosses wide lava fields and black-sand shores on a roadbed built of local volcanic cinder. Because the volcano is active, the line avoids the paths of past lava flows, with volcano monitoring points and evacuation signs along the way. The hot springs, the black beaches and the geothermal fields of Sulphur Bay now form one touring circuit, and the island has a second evacuation route.
    via: [div_qjzmw5, div_bsbr5w, div_6930nk]
  - id: rte_2bcpa1
    ref: G-VK-7
    network: national_expressway
    class: motorway
    status: generated
    names:
      zh: 长船西岸高速
      en: Longship West Shore Expressway
      art-x-viking: Langskip-Westküstenautobahn
      art-x-buckham: Autostrada della Costa Ovest di Navelunga
    notes:
      zh: 沿长船岛西北岸自舵港经潮湾到长船，与群岛跨海高速分走龙骨山两侧
      en: Along the north-west shore of Longship Island from Rudderhaven through Tidebay to Longship, taking the other side of the Keel Hills from the Island Chain Expressway.
    background:
      zh: 长船岛中部横亘着龙骨山，群岛跨海高速走东南麓，西北岸的潮湾、长滩一带人口增长很快，却只能绕道进出首府。长船西岸高速自舵港出发，经龙骨山西北侧到潮湾，再沿西北岸经长滩进入长船市区，与群岛跨海高速分走龙骨山两侧，形成长船岛的双通道。龙骨山西坡陡峭，线路以连续桥隧穿越山脚；进入长船市区后改为高架和地下道路，避免切割城区。两条高速互为备用，任何一条因事故或大风封闭时，交通都可以经另一条绕行。
      en: The Keel Hills run down the middle of Longship Island. The Island Chain Expressway takes their south-east side, while Tidebay and Longbeach on the north-west shore were growing fast but had to go the long way round to reach the capital. The Longship West Shore Expressway runs from Rudderhaven along the north-west side of the Keel Hills to Tidebay, then along the shore through Longbeach into Longship, giving the island two expressways, one either side of the hills. The western slopes are steep, so the road runs on bridges and through tunnels along their foot, and inside Longship it goes onto viaduct and underground so as not to split the city. Each expressway is the other's backup, so traffic can switch when one is closed by an accident or high winds.
    tunnel_cost: 3.5
    via: [div_er5g6j, div_x20mfy, div_3cvg2q]
  - id: rte_za26jr
    ref: G-VK-8
    network: national_expressway
    class: motorway
    status: generated
    names:
      zh: 桅岛跨海高速
      en: Mast Island Sea Crossing
      art-x-viking: Mastinsel-Meeresautobahn
      art-x-buckham: Autostrada sul Mare dell'Isola dell'Albero
    notes:
      zh: 自暖泉跨海经桅岛的桅港到白帆岛西南端的银鸥，是暖泉岛与白帆岛之间的直达高速
      en: From Warmspring over the sea through Masthaven on Mast Island to Silvergull at the south-west end of White Sail Island; the direct expressway between Warmspring and White Sail islands.
    background:
      zh: 暖泉岛与白帆岛之间隔着开阔的海面，两岛往来原本要经长船岛绕一大圈。桅岛跨海高速自暖泉出发，经长船岛船尾跨海到桅岛的桅港，再跨越桅岛海峡到白帆岛西南端的银鸥，是暖泉岛与白帆岛之间的直达高速。全线桥梁比例很高，海上长桥以桅岛为中间支点分成两段，桅岛上设置服务区和观景台。为抵御海上大风，桥梁采用流线型箱梁并设置风障。通车后桅岛从一个偏远小岛变成跨海通道的中转站，桅港的旅游和物流随之兴起。
      en: Open sea separates Warmspring Island from White Sail Island, and travel between them used to loop round by Longship Island. The Mast Island Sea Crossing runs from Warmspring across the water by way of Longship Island's stern to Masthaven on Mast Island, then over the Mast Strait to Silvergull at the south-west tip of White Sail Island, the direct expressway between the two. A large share of it is bridge. Mast Island splits the long sea viaducts in two, with a service area and lookout on the island itself, and the decks are streamlined box girders with wind screens against the sea gales. Mast Island has gone from a remote outpost to a stop on the crossing, and Masthaven's tourism and logistics have grown with it.
    via: [div_qjzmw5, div_esaav7, div_0770jy]
  - id: rte_33tmrb
    ref: G-VK-9
    network: national_expressway
    class: motorway
    status: generated
    names:
      zh: 锚舵跨海高速
      en: Anchor–Rudder Sea Crossing
      art-x-viking: Meeresautobahn Anker–Ruder
      art-x-buckham: Autostrada sul Mare Ancora–Timone
    notes:
      zh: 自锚岛南端的锚湾跨越锚岛海峡口到舵港，锚岛与长船岛船尾之间的捷径
      en: From Anchor Bay at the southern end of Anchor Island across the mouth of Anchor Strait to Rudderhaven; the short way between Anchor Island and Longship Island's stern.
    background:
      zh: 锚岛南端的锚湾与长船岛船尾的舵港隔着锚岛海峡口相望，直线距离不远，但陆路要经锚岛跨海高速绕行潮湾。锚舵跨海高速自锚湾出发，跨越锚岛海峡口到船尾，再到舵港，是锚岛与长船岛南部之间的捷径。海峡口外侧直面大洋涌浪，桥墩采用加大的防撞和消浪设计，近岸段以隧道穿过船尾的岬角。通车后锚湾老港与舵港的船舶修造、渔业形成协作，锚岛南部到暖泉岛的车流也不必再经过首府。
      en: Anchor Bay at the southern tip of Anchor Island faces Rudderhaven at Longship Island's stern across the mouth of the Anchor Strait, close as the crow flies, yet by land the way went round by Tidebay on the Anchor Strait Crossing. The Anchor–Rudder Sea Crossing runs from Anchor Bay over the mouth of the strait to the Stern and on to Rudderhaven, a short cut between Anchor Island and southern Longship Island. The strait mouth takes the full ocean swell, so the piers have enlarged fenders and wave breakers, and near the shore the road tunnels through the headland at the Stern. Ship repair and fishing at the old port of Anchor Bay and at Rudderhaven now work together, and traffic from southern Anchor Island to Warmspring Island no longer has to pass through the capital.
    via: [div_a2n8cw, div_er5g6j]

  # 领地高速 (territorial expressways, class motorway): from the big cities to their ports and
  # suburbs and airports.
  - id: rte_p3r778
    ref: S-VK-1
    network: territorial_expressway
    class: motorway
    status: generated
    names:
      zh: 长船机场高速
      en: Longship Airport Expressway
      art-x-viking: Flughafenautobahn Langskip
      art-x-buckham: Autostrada dell'Aeroporto di Navelunga
    notes:
      zh: 自长船古城北上到北岬区的长船国际机场与群岛大学
      en: North from Longship's old town to Longship International Airport and the University of the Islands in North Cape.
    background:
      zh: 长船国际机场位于首府以北的北岬区，是群岛对外交通的门户，群岛大学也坐落在北岬。机场启用之初，旅客只能经城市道路穿过老城往返，航班高峰时经常拥堵。长船机场高速自古城北上，绕开老城核心，直达机场航站区和群岛大学。线路穿过城市北部时以高架为主，靠近机场的路段严格控制桥梁和灯杆的高度，以满足机场净空要求；航站区段设置独立的出发和到达匝道。通车后机场与市中心之间的车程大为缩短，北岬也逐渐发展为首府的科教新区。
      en: Longship International Airport, the islands' gateway to the world, lies north of the capital in North Cape, as does the University of the Islands. When the airport first opened, travellers had to go through the old town on city streets, and at peak hours the traffic jammed. The Longship Airport Expressway runs north from the old town, skirting its core, straight to the terminals and the university. Through the northern city it is mostly on viaduct, and near the airport the heights of bridges and lighting columns are kept strictly within the airport's clearance limits, with separate departure and arrival ramps at the terminals. The trip between the airport and the city centre is much shorter, and North Cape has grown into the capital's new district of science and learning.
    shield: gull
    via: [div_g2g1yc, div_xps98r]
  - id: rte_tjbqng
    ref: S-VK-2
    network: territorial_expressway
    class: motorway
    status: generated
    names:
      zh: 东港港口高速
      en: East Harbour Port Expressway
      art-x-viking: Hafenautobahn Osthafen
      art-x-buckham: Autostrada Portuale di Porto Est
    notes:
      zh: 自古城边缘经汇金金融区到东港区的集装箱码头，长船市区南北向的快速通道，货车不必穿过老城
      en: From the edge of the old town through the Goldmark financial district to the container terminals of East Harbour, Longship's north–south urban expressway; lorries need not cross the old town.
    background:
      zh: 东港区的集装箱码头是群岛最大的港口，过去集装箱卡车要穿过古城和汇金金融区的街道进出港区，噪声、拥堵和安全问题都十分突出。东港港口高速自古城边缘出发，经汇金区直达东港码头，是长船市区南北向的快速通道。为了不打扰老城和金融区，线路在汇金区大段采用地下隧道，出隧道后以高架桥跨过港区堆场，直接接入码头闸口。码头路段设置货车专用车道和集装箱查验站。通车后货车不必再穿过老城，古城的街道也恢复了宁静。
      en: The container terminals at East Harbour are the islands' largest port, and container trucks used to reach them through the streets of the old town and the Goldmark financial district, with all the noise, congestion and danger that brought. The East Harbour Port Expressway runs from the edge of the old town through Goldmark straight to the East Harbour terminals, a fast north–south route through the city. To spare the old town and the financial district it runs underground for much of Goldmark, then rises onto viaduct over the port yards straight to the terminal gates. The port end has truck-only lanes and a container inspection station. Trucks no longer cross the old town, and its streets have grown quiet again.
