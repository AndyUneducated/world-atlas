    background:
      zh: 外屿由鲸岛和鸟崖岛两座海岛组成，两岛之间隔着外屿海峡，过去只靠小渡轮往来，冬季常因风浪停航，岛上居民就医、上学都很不便。外屿跨海公路以一座长长的跨海桥连接鲸岛与鸟崖岛，是外屿两岛之间唯一的陆路。海峡是鲸类洄游的通道，桥梁跨度和桥墩位置经过专门论证，施工避开鲸类洄游季节，并全程进行水下噪声监测；桥面设置观鲸平台。通车后两岛的学校、医院和码头实现共享，跨海桥本身也成了外屿的标志性景观。
      en: The Outer Isles are two islands, Whale Isle and Bird Cliff Isle, across the Outer Isles Strait from each other. They were linked only by a small ferry that winter gales often stopped, which made getting to a doctor or to school hard. The Outer Isles Causeway joins them with one long sea bridge, the only land link between the two. The strait is a whale migration route, so the spans and pier positions were studied with care, work stopped during the migration season, and underwater noise was monitored throughout. There are whale-watching platforms on the deck. The two islands now share their schools, hospital and harbour, and the bridge itself has become the Outer Isles' landmark.
    shield: whale
