# Road routes of the Viking Islands. Same conventions as cn-nv-roads.yaml, with the
# territory infix VK:
#   G-VK-1..99    国家高速 national expressway    (class motorway)
#   S-VK-1..99    领地高速 territorial expressway (class motorway)
#   S-VK-101..    领道 territorial highway        (class primary)
#   X-VK-001..    市道 city road                  (class secondary, derived)
# via entries may also be places with a site (e.g. a ferry terminal): the route stops at the
# landward side of the site.
# shield (territorial routes): sea-themed symbol on the Viking Islands' oval shield.
routes:
  # 国家高速: the trunk along the main-island chain, sea crossings between the main islands and
  # spines inside them.
  - id: rte_6mvf59
    ref: G-VK-1
    network: national_expressway
    class: motorway
    status: generated
    names:
      zh: 群岛跨海高速
      en: Island Chain Expressway
      art-x-viking: Inselkettenautobahn
      art-x-buckham: Autostrada delle Isole
    notes:
      zh: 群岛跨海高速是维京群岛的主干高速，自暖泉岛西岸的岩港出发，经硫磺湾、黑沙和暖泉温泉区横贯暖泉岛，跨海到长船岛船尾的舵港，再沿龙骨山东南麓经东港、汇金进入长船古城，全长约七百公里，全程四个半小时左右。船尾特大桥和古城隧道分别是全线最长的桥梁和隧道，跨海桥面两侧设有风障。全线双向十二车道，长船市区段加宽到十四车道；城区与桥隧密集路段限速 140 公里，其余路段不限速。长船市区段是群岛车流最大的路段之一，暖泉岛段则以旅游车辆和货车为主。
      en: The Island Chain Expressway is the trunk expressway of the Viking Islands. From Rockhaven on the west coast of Warmspring Island it crosses that island through Sulphur Bay, Black Sand and Hot Springs, goes over the sea to Rudderhaven at Longship Island's stern, then follows the south-east foot of the Keel Hills through East Harbour and Goldmark into Longship's old town. It is about 700 km long, some four and a half hours end to end. The Stern Sea Bridge and the Old Town Tunnel are the longest of each on the line, and its sea bridges have wind screens on both sides. It has six lanes each way, widening to seven through Longship; the limit is 140 km/h through towns and on stretches dense with bridges and tunnels, and there is none elsewhere. The Longship stretch is among the busiest roads in the islands, while on Warmspring Island it carries mainly tourists and freight.
    background:
      zh: 维京群岛由多座大岛组成，过去岛与岛之间全靠渡轮，冬季风浪大时航班经常停开，暖泉岛与首府所在的长船岛常常隔海相望却无法往来。群岛跨海高速是群岛交通的主骨架，自暖泉岛西岸的岩港出发横贯暖泉岛，以跨海大桥跨海到长船岛船尾的舵港，再沿龙骨山东南麓直达长船。跨海段在深水区采用大跨度斜拉桥，浅水区采用预制箱梁长桥，桥面两侧设置风障，保证大风天气也能通行。它的建成让群岛第一次有了全天候的陆路，沿线城市也随之连成一片。
      en: The Viking Islands are a chain of large islands that once depended entirely on ferries, and in winter gales the sailings often stopped, leaving Warmspring Island and Longship Island, home of the capital, in sight of each other but cut off. The Island Chain Expressway is the backbone of the islands' network. It crosses Warmspring Island from Rockhaven on its west coast, bridges the sea to Rudderhaven at the stern of Longship Island, then follows the south-east foot of the Keel Hills to Longship. In deep water the crossing uses long cable-stayed spans and in the shallows long precast box-girder viaducts, with wind screens along both edges so it stays open in high winds. It gave the islands their first all-weather land link, and the cities along it have grown into one another.
    tunnel_cost: 3.5
    via: [div_6930nk, div_qjzmw5, div_er5g6j, div_33vctd, div_3cvg2q]
  - id: rte_1htwsa
    ref: G-VK-2
    network: national_expressway
    class: motorway
    status: generated
    names:
      zh: 长阿跨海高速
      en: Longship–Port Aveline Sea Crossing
      art-x-viking: Meeresautobahn Langskip–Port Aveline
      art-x-buckham: Autostrada sul Mare Navelunga–Porto Aveline
    notes:
      zh: 长白跨海高速自长船古城出发，经汇金、东港和龙骨山下，以跨海大桥越过白帆海峡，再穿过帆影岭到白帆老城帆城区，全长约二百四十公里，全程一个半小时多，是首府与白帆岛之间的主要通道。东港高架桥和古城隧道分别是全线最长的桥梁和隧道，海峡主桥下可通行大型邮轮和集装箱船。全线双向十二车道，长船市区段加宽到十四车道；城区与桥隧路段限速 140 公里，其余路段不限速。工作日通勤与物流车流密集，邮轮旺季前往白帆的游客车辆也很多。
      en: The Longship–White Sail Sea Crossing runs from Longship's old town through Goldmark, East Harbour and the foot of the Keel Hills, crosses White Sail Strait on a sea bridge, then passes through the Sailshadow Ridge to Sail Town, the old heart of White Sail. It is about 240 km long, a little over an hour and a half end to end, and the main route between the capital and White Sail Island. The East Harbour Viaduct and the Old Town Tunnel are the longest of each on the line, and the main strait span leaves room for large cruise ships and container ships beneath. It has six lanes each way, widening to seven through Longship, a 140 km/h limit through towns and on bridge and tunnel stretches, and no limit elsewhere. Commuter and freight traffic is heavy on weekdays, and in the cruise season many visitors drive out to White Sail as well.
    background:
      zh: 白帆岛是群岛第三大城市白帆的所在地，与首府长船隔着宽阔的白帆海峡，往来主要靠高速客轮。长白跨海高速自长船古城出发，经汇金、东港和龙骨山下，以跨海大桥越过白帆海峡，再翻过帆影岭抵达白帆老城。海峡中部航道繁忙，主桥采用超大跨度悬索桥，桥下净空满足大型邮轮和集装箱船通行；帆影岭一侧以隧道穿山，避开岭上的林场。施工中海上桥墩在东港船厂预制后整体浮运就位。通车后两座城市之间形成了繁忙的通勤与物流走廊。
      en: White Sail Island holds the islands' third city, White Sail, across the broad White Sail Strait from the capital, Longship, and the two were linked mainly by fast passenger ships. The Longship–White Sail Sea Crossing runs from Longship's old town through Goldmark, East Harbour and the foot of the Keel Hills, bridges the White Sail Strait and crosses Sailshadow Ridge to White Sail's old town. The shipping lane in mid-strait is busy, so the main bridge is a very long suspension span with clearance for large cruise and container ships; on the Sailshadow side the road tunnels through the ridge to spare its forests. The sea piers were cast in the East Harbour shipyards and floated out whole. Since it opened the two cities have become one busy corridor of commuting and freight.
    via: [div_3cvg2q, div_x22naa]
  - id: rte_zxcxr7
    ref: G-VK-3
    network: national_expressway
    class: motorway
    status: generated
    names:
      zh: 阿克斯跨海高速
      en: Akkersey Strait Crossing
      art-x-viking: Akkerseystraßen-Autobahn
      art-x-buckham: "Autostrada dello Stretto dell'Ancora"
    notes:
      zh: 锚岛跨海高速自长船岛西北岸的潮湾出发，跨越锚岛海峡到锚岛的船厂区，直达锚港链城区，全长约五十公里，全程二十多分钟，是锚岛通往首府的门户。潮湾特大桥横跨水深流急的海峡，是全线最长的桥梁，两岸近岸段以链城隧道等隧道穿过陡峭的岬角。全线双向十二车道，由于桥隧比例很高，全线限速 140 公里。车流以往返锚港船厂的职工、运送船用设备的重型货车和潮湾一带的通勤车辆为主，大风天气时桥面会临时降低限速。
      en: The Anchor Strait Crossing runs from Tidebay on the north-west shore of Longship Island over Anchor Strait to the Shipyard District of Anchor Island and on to Chain Town in Anchorhaven, about 50 km in just over twenty minutes; it is Anchor Island's gateway to the capital. The Tidebay Sea Bridge, which spans the deep, fast-flowing strait, is its longest bridge, and near the shores tunnels such as the Chain Town Tunnel pass through the steep headlands. It has six lanes each way, and because so much of it is bridge and tunnel the limit is 140 km/h throughout. Its traffic is mostly shipyard workers, heavy lorries carrying marine equipment and commuters from around Tidebay, and in strong winds the limit on the bridge is lowered for a time.
    background:
      zh: 锚岛与长船岛之间的锚岛海峡水深流急，是群岛最险的航道之一，渡轮常因潮流停航。锚岛跨海高速自长船岛西北岸的潮湾出发，跨越锚岛海峡到锚岛的船厂区，直达锚港链城区，是锚岛通往首府的门户。海峡中部水流最急，主桥采用大跨度设计以减少水中桥墩，两岸近岸段则以隧道穿过陡峭的岬角。由于海峡潮流强劲，桥墩基础施工只能在每天的平潮时段进行，工程因此格外漫长。通车后，锚港的船舶制造业与长船的航运、金融业连为一体。
      en: The Anchor Strait between Anchor Island and Longship Island is deep and fast-flowing, one of the most dangerous waters in the islands, and ferries were often stopped by the tides. The Anchor Strait Crossing runs from Tidebay on Longship Island's north-west shore across the strait to Shipyard District and on to Chain Town in Anchorhaven, Anchor Island's gateway to the capital. The current is strongest mid-strait, so the main bridge uses long spans to keep piers out of the water, while near the shores the road tunnels through steep headlands. The pier foundations could only be worked at slack water each day, which made the job unusually long. Since it opened, Anchorhaven's shipbuilding and Longship's shipping and finance have grown into one.
    via: [div_x20mfy, div_zg05xa]
  - id: rte_pb0tnq
    ref: G-VK-4
    network: national_expressway
    class: motorway
    status: generated
    names:
      zh: 阿夫琳纵贯高速
      en: Aveline Spine Expressway
      art-x-viking: Aveline-Längsautobahn
      art-x-buckham: Autostrada Dorsale di Aveline
    notes:
      zh: 白帆纵贯高速沿白帆岛东南岸纵贯全岛，自西南端的银鸥出发，经白岭、渔港、盐湾、望海到白帆老城帆城区，全长约三百六十公里，全程两小时二十分钟左右，与长白跨海高速在白帆相接。线路大多位于海岸后方的低丘上，盐湾高架桥和望海隧道分别是全线最长的桥梁和隧道。全线双向十二车道，城区和桥隧路段限速 140 公里，其余路段不限速。车流以运送渔获、海盐和水果的货车为主，靠近白帆的路段通勤车辆较多，夏季前往海滨的自驾游客也不少。
      en: The White Sail Spine Expressway runs the length of White Sail Island along its south-east shore, from Silvergull at the south-west end through Whiteridge, Fishing Harbour, Saltbay and Seawatch to Sail Town, the old heart of White Sail, where it meets the Longship–White Sail Sea Crossing. It is about 360 km long, some two hours twenty minutes end to end. Most of it runs on the low hills behind the shore; the Saltbay Viaduct and the Seawatch Tunnel are the longest of each on the line. It has six lanes each way, a 140 km/h limit through towns and on bridge and tunnel stretches, and no limit elsewhere. Lorries carrying fish, sea salt and fruit make up much of its traffic, commuters crowd the stretch near White Sail, and in summer plenty of drivers head for the beaches.
    background:
      zh: 白帆岛狭长，城镇沿东南岸分布，原有的海滨公路弯多路窄，从岛西南端的银鸥到白帆老城要花大半天。白帆纵贯高速沿东南岸纵贯全岛，自银鸥出发，经白岭、渔港、盐湾、望海到帆城区，与长白跨海高速在白帆相接。线路大部分位于海岸后方的低丘上，避开盐湾的盐田和望海的果园，跨越沿岸的小海湾时修建了多座海湾桥。施工中挖出的土石用于加固盐田海堤。高速通车后，白帆岛的渔获、海盐和水果可以直接运往长船和各港口。
      en: White Sail Island is long and narrow, its towns along the south-east coast, and the old shore road was so winding and narrow that getting from Silvergull at the south-west tip to White Sail's old town took most of a day. The White Sail Spine Expressway runs the length of the island along that coast, from Silvergull through Whiteridge, Fishing Harbour, Saltbay and Seawatch to Sail Town, meeting the Longship–White Sail Sea Crossing at White Sail. Most of it rides the low hills behind the shore, keeping clear of the Salt Bay salt pans and the Seawatch orchards, with bridges across the small coastal inlets. Spoil from the works went into strengthening the salt-pan sea walls. White Sail Island's catch, sea salt and fruit now travel straight to Longship and the ports.
    tunnel_cost: 3.5
    via: [div_0770jy, div_ewqq3p, div_x22naa]
  - id: rte_v17pgv
    ref: G-VK-5
    network: national_expressway
    class: motorway
    status: generated
    names:
      zh: 阿克斯岛纵贯高速
      en: Akkersey Spine Expressway
      art-x-viking: Akkersey-Längsautobahn
      art-x-buckham: "Autostrada Dorsale dell'Isola dell'Ancora"
    notes:
      zh: 锚岛纵贯高速是锚岛的南北主干，自南端的锚湾出发北上，经船厂区、锚港链城区和峡湾区到东北端的松林，全长约三百三十公里，全程两小时十几分钟。锚湾高架桥是全线最长的桥梁，峡湾区段以一座座高桥越过峡湾，遇到锚链山的山脊时以链城隧道等隧道穿过。全线双向十二车道，城区和峡湾路段限速 140 公里，其余路段不限速。锚港市区段车流最大，北段以松林的运木车和峡湾观光车辆为主。
      en: The Anchor Island Spine Expressway is Anchor Island's north–south trunk road. It runs north from Anchor Bay at the southern end through the Shipyard District, Chain Town in Anchorhaven and the Fjord District to Pinewood at the north-east end, about 330 km in a little over two hours. The Anchor Bay Viaduct is its longest bridge; in the Fjord District it crosses fjord after fjord on high bridges, and where it meets the ridges of the Anchor Chain Mountains it tunnels through, the Chain Town Tunnel among them. It has six lanes each way, a 140 km/h limit through towns and in the fjords, and no limit elsewhere. Traffic is heaviest through Anchorhaven; further north it is mostly timber lorries from Pinewood and sightseers bound for the fjords.
    background:
      zh: 锚岛南北狭长，中部被锚链山和多条峡湾分隔，南端的锚湾与东北端的松林之间过去只能乘船往来。锚岛纵贯高速自锚湾北上，经船厂区、锚港链城区和峡湾区到松林，是锚岛的南北主干。线路在峡湾区以连续的跨峡湾大桥越过一道道峡湾，桥梁高度满足渔船和游艇通行；遇到锚链山的山脊时以隧道穿过。峡湾两岸岩壁坚硬，桥台直接嵌入岩体。通车后锚港的船厂得以从岛南北两端招募工人，松林的木材也不再需要海运。
      en: Anchor Island is long and narrow, its middle broken up by the Anchor Chain Mountains and a series of fjords, and Anchor Bay in the south and Pinewood in the north-east were once reachable only by boat. The Anchor Island Spine Expressway runs north from Anchor Bay through Shipyard District, Chain Town in Anchorhaven and Fjord District to Pinewood as the island's north–south trunk. Through Fjord District it leaps one fjord after another on high bridges with clearance for fishing boats and yachts, and it tunnels through the spurs of the Anchor Chain Mountains. The fjord walls are hard rock, so the abutments are set straight into it. The Anchorhaven shipyards can now recruit from both ends of the island, and Pinewood's timber no longer goes by sea.
    tunnel_cost: 3.5
    via: [div_a2n8cw, div_zg05xa, div_bbmwea]
  - id: rte_bd7834
    ref: G-VK-6
    network: national_expressway
    class: motorway
    status: generated
    names:
      zh: 暖泉南环高速
      en: Warmspring Southern Arc Expressway
      art-x-viking: Warmquell-Südbogenautobahn
      art-x-buckham: Autostrada dell'Arco Sud di Fontecalda
    notes:
      zh: 暖泉南环高速绕暖泉火山南麓，自暖泉温泉区出发，经黑沙、硫磺湾到岩港，与群岛跨海高速合成环绕暖泉岛的环线，全长约三百二十公里，全程两小时左右。线路穿过大片火山熔岩和黑沙海岸，全线没有隧道，硫磺湾高架桥是最长的桥梁；沿线设有火山监测点和紧急疏散标志。全线双向十二车道，城区路段限速 140 公里，其余路段不限速。车流以温泉、黑沙海滩和硫磺湾地热景区的游客为主，它也是火山南麓居民紧急疏散的主要通道之一。
      en: The Warmspring Southern Arc Expressway runs round the southern foot of Warmspring Volcano from Hot Springs in Warmspring through Black Sand and Sulphur Bay to Rockhaven, and with the Island Chain Expressway forms a ring round Warmspring Island. It is about 320 km long, roughly two hours end to end. It crosses broad lava fields and black-sand coast without a single tunnel; the Sulphur Bay Viaduct is its longest bridge, and volcano monitoring points and evacuation signs line the route. It has six lanes each way, a 140 km/h limit through towns and no limit elsewhere. Most of its traffic is visitors to the hot springs, the black-sand beaches and the geothermal sights of Sulphur Bay, and it is one of the main evacuation routes for people living on the volcano's southern slopes.
    background:
      zh: 暖泉岛中央耸立着暖泉火山，群岛跨海高速经火山北侧横贯全岛，南侧的黑沙、硫磺湾一带只能走狭窄的环山公路。暖泉南环高速绕火山南麓，自暖泉温泉区经黑沙、硫磺湾到岩港，与群岛跨海高速合成环岛高速。线路穿过大片火山熔岩和黑沙海岸，路基用当地火山渣填筑；考虑到火山活动，选线避开了历史熔岩流的通道，并在沿线设置火山监测点和紧急疏散标志。通车后，温泉、黑沙海滩与硫磺湾的地热景观连成一条旅游环线，也为火山应急疏散多提供了一条通道。
      en: Warmspring Volcano rises in the middle of Warmspring Island. The Island Chain Expressway crosses the island north of it, and the Black Sand and Sulphur Bay country to the south had only a narrow mountain road. The Warmspring Southern Arc Expressway rounds the volcano's southern foot from Hot Springs through Black Sand and Sulphur Bay to Rockhaven, closing a ring round the island with the Island Chain Expressway. It crosses wide lava fields and black-sand shores on a roadbed built of local volcanic cinder. Because the volcano is active, the line avoids the paths of past lava flows, with volcano monitoring points and evacuation signs along the way. The hot springs, the black beaches and the geothermal fields of Sulphur Bay now form one touring circuit, and the island has a second evacuation route.
    via: [div_qjzmw5, div_bsbr5w, div_6930nk]
  - id: rte_2bcpa1
    ref: G-VK-7
    network: national_expressway
    class: motorway
    status: generated
    names:
      zh: 长船西岸高速
      en: Longship West Shore Expressway
      art-x-viking: Langskip-Westküstenautobahn
      art-x-buckham: Autostrada della Costa Ovest di Navelunga
    notes:
      zh: 长船西岸高速自舵港出发，经龙骨山西北侧到潮湾，再沿西北岸经长滩进入长船东港、汇金和古城，全长约三百七十公里，全程两小时二十分钟左右，与群岛跨海高速分走龙骨山两侧，任何一条封闭时交通都可以经另一条绕行。潮湾高架桥和长滩隧道分别是全线最长的桥梁和隧道，进入长船市区后改为高架和地下道路。全线双向十二车道，长船市区段加宽到十四车道；城区和山区路段限速 140 公里，其余路段不限速。长船市区段与群岛跨海高速并列为群岛最繁忙的路段。
      en: The Longship West Shore Expressway runs from Rudderhaven along the north-west side of the Keel Hills to Tidebay, then along the north-west shore through Longbeach into Longship's East Harbour, Goldmark and old town. It is about 370 km long, some two hours twenty minutes end to end, and takes the opposite side of the Keel Hills from the Island Chain Expressway, so that if either is closed traffic can switch to the other. The Tidebay Viaduct and the Longbeach Tunnel are the longest of each on the line, and inside Longship it continues on viaduct and underground. It has six lanes each way, widening to seven through Longship, a 140 km/h limit through towns and mountains, and no limit elsewhere. Its Longship stretch ranks with that of the Island Chain Expressway as the busiest road in the islands.
    background:
      zh: 长船岛中部横亘着龙骨山，群岛跨海高速走东南麓，西北岸的潮湾、长滩一带人口增长很快，却只能绕道进出首府。长船西岸高速自舵港出发，经龙骨山西北侧到潮湾，再沿西北岸经长滩进入长船市区，与群岛跨海高速分走龙骨山两侧，形成长船岛的双通道。龙骨山西坡陡峭，线路以连续桥隧穿越山脚；进入长船市区后改为高架和地下道路，避免切割城区。两条高速互为备用，任何一条因事故或大风封闭时，交通都可以经另一条绕行。
      en: The Keel Hills run down the middle of Longship Island. The Island Chain Expressway takes their south-east side, while Tidebay and Longbeach on the north-west shore were growing fast but had to go the long way round to reach the capital. The Longship West Shore Expressway runs from Rudderhaven along the north-west side of the Keel Hills to Tidebay, then along the shore through Longbeach into Longship, giving the island two expressways, one either side of the hills. The western slopes are steep, so the road runs on bridges and through tunnels along their foot, and inside Longship it goes onto viaduct and underground so as not to split the city. Each expressway is the other's backup, so traffic can switch when one is closed by an accident or high winds.
    tunnel_cost: 3.5
    via: [div_er5g6j, div_x20mfy, div_3cvg2q]
  - id: rte_za26jr
    ref: G-VK-8
    network: national_expressway
    class: motorway
    status: generated
    names:
      zh: 西格利跨海高速
      en: Sigley Sea Crossing
      art-x-viking: Sigley-Meeresautobahn
      art-x-buckham: "Autostrada sul Mare dell'Isola dell'Albero"
    notes:
      zh: 桅岛跨海高速自暖泉出发，经暖河和长船岛船尾跨海到桅岛的桅港，再跨越桅岛海峡到白帆岛西南端的银鸥，全长约四百七十公里，全程三小时左右，是暖泉岛与白帆岛之间的直达高速。全线没有隧道，暖河特大桥是最长的海上长桥；桅岛是两段跨海长桥之间的中转站，岛上设有服务区和观景台。全线双向十二车道，城区与长桥路段限速 140 公里，其余路段不限速。车流以跨岛货运和旅游大巴为主，大风天气时桥面会临时限速或限制高车通行。
      en: The Mast Island Sea Crossing runs from Warmspring through Warm River and Longship Island's stern, over the sea to Masthaven on Mast Island, then across Mast Strait to Silvergull at the south-west end of White Sail Island. It is about 470 km long, some three hours end to end, and the direct expressway between Warmspring and White Sail islands. It has no tunnels; the Warm River Sea Bridge is the longest of its sea bridges, and Mast Island, between the two long crossings, has a service area and a lookout. It has six lanes each way, a 140 km/h limit through towns and on the long bridges, and no limit elsewhere. Its traffic is mostly inter-island freight and tour coaches, and in strong winds the bridges get temporary limits or are closed to high-sided vehicles.
    background:
      zh: 暖泉岛与白帆岛之间隔着开阔的海面，两岛往来原本要经长船岛绕一大圈。桅岛跨海高速自暖泉出发，经长船岛船尾跨海到桅岛的桅港，再跨越桅岛海峡到白帆岛西南端的银鸥，是暖泉岛与白帆岛之间的直达高速。全线桥梁比例很高，海上长桥以桅岛为中间支点分成两段，桅岛上设置服务区和观景台。为抵御海上大风，桥梁采用流线型箱梁并设置风障。通车后桅岛从一个偏远小岛变成跨海通道的中转站，桅港的旅游和物流随之兴起。
      en: Open sea separates Warmspring Island from White Sail Island, and travel between them used to loop round by Longship Island. The Mast Island Sea Crossing runs from Warmspring across the water by way of Longship Island's stern to Masthaven on Mast Island, then over the Mast Strait to Silvergull at the south-west tip of White Sail Island, the direct expressway between the two. A large share of it is bridge. Mast Island splits the long sea viaducts in two, with a service area and lookout on the island itself, and the decks are streamlined box girders with wind screens against the sea gales. Mast Island has gone from a remote outpost to a stop on the crossing, and Masthaven's tourism and logistics have grown with it.
    via: [div_qjzmw5, div_esaav7, div_0770jy]
  - id: rte_33tmrb
    ref: G-VK-9
    network: national_expressway
    class: motorway
    status: generated
    names:
      zh: 阿斯跨海高速
      en: Akkersvik–Styrvik Sea Crossing
      art-x-viking: Meeresautobahn Akkersvik–Styrvik
      art-x-buckham: Autostrada sul Mare Ancora–Timone
    notes:
      zh: 锚舵跨海高速自锚岛南端的锚湾出发，跨越锚岛海峡口到长船岛船尾，再到舵港，全长约一百九十公里，全程一小时十几分钟，是锚岛与长船岛南部之间的捷径。船尾特大桥直面大洋涌浪，是全线最长的桥梁，桥墩采用加大的防撞和消浪设计；近岸段以舵港隧道穿过船尾的岬角。全线双向十二车道，城区和跨海路段限速 140 公里，其余路段不限速。车流以锚湾与舵港之间的船舶修造、渔业运输为主，锚岛前往暖泉岛的车辆也大多走这条路，不必经过首府。
      en: The Anchor–Rudder Sea Crossing runs from Anchor Bay at the southern end of Anchor Island across the mouth of Anchor Strait to Longship Island's stern and on to Rudderhaven, about 190 km in a little over an hour and a quarter; it is the short way between Anchor Island and southern Longship Island. The Stern Sea Bridge, which faces the ocean swell head on, is its longest bridge, its piers enlarged against ship impact and waves, and near the shore the Rudderhaven Tunnel passes through the headland at the stern. It has six lanes each way, a 140 km/h limit through towns and over the sea, and no limit elsewhere. Its traffic is mostly shipbuilding and fishing freight between Anchor Bay and Rudderhaven, and most traffic from Anchor Island to Warmspring Island uses it too, avoiding the capital.
    background:
      zh: 锚岛南端的锚湾与长船岛船尾的舵港隔着锚岛海峡口相望，直线距离不远，但陆路要经锚岛跨海高速绕行潮湾。锚舵跨海高速自锚湾出发，跨越锚岛海峡口到船尾，再到舵港，是锚岛与长船岛南部之间的捷径。海峡口外侧直面大洋涌浪，桥墩采用加大的防撞和消浪设计，近岸段以隧道穿过船尾的岬角。通车后锚湾老港与舵港的船舶修造、渔业形成协作，锚岛南部到暖泉岛的车流也不必再经过首府。
      en: Anchor Bay at the southern tip of Anchor Island faces Rudderhaven at Longship Island's stern across the mouth of the Anchor Strait, close as the crow flies, yet by land the way went round by Tidebay on the Anchor Strait Crossing. The Anchor–Rudder Sea Crossing runs from Anchor Bay over the mouth of the strait to the Stern and on to Rudderhaven, a short cut between Anchor Island and southern Longship Island. The strait mouth takes the full ocean swell, so the piers have enlarged fenders and wave breakers, and near the shore the road tunnels through the headland at the Stern. Ship repair and fishing at the old port of Anchor Bay and at Rudderhaven now work together, and traffic from southern Anchor Island to Warmspring Island no longer has to pass through the capital.
    via: [div_a2n8cw, div_er5g6j]

  # 领地高速 (territorial expressways, class motorway): from the big cities to their ports and
  # suburbs and airports.
  - id: rte_p3r778
    ref: S-VK-1
    network: territorial_expressway
    class: motorway
    status: generated
    names:
      zh: 长船机场高速
      en: Longship Airport Expressway
      art-x-viking: Flughafenautobahn Langskip
      art-x-buckham: Autostrada dell'Aeroporto di Navelunga
    notes:
      zh: 长船机场高速自长船古城北上，绕开老城核心，经北岬区直达长船国际机场航站区和群岛大学，全长约八十五公里，全程四十分钟左右。北岬高架桥是全线最长的桥梁，城市北部大段采用高架；靠近机场的路段桥梁和灯杆高度受到严格控制，航站区设有独立的出发和到达匝道。全线双向十二车道，全程限速 140 公里。车流以机场旅客、出租车、机场大巴和往返群岛大学的师生为主，航班高峰时段最为繁忙，日均车流在领地高速中名列前茅。
      en: The Longship Airport Expressway runs north from Longship's old town, skirting its core, through North Cape to the terminals of Longship International Airport and the University of the Islands, about 85 km in some forty minutes. The North Cape Viaduct is its longest bridge, and much of the stretch through the north of the city is elevated. Near the airport the heights of bridges and lighting columns are tightly controlled, and the terminal area has separate departures and arrivals ramps. It has six lanes each way and a 140 km/h limit throughout. Its traffic is mostly air travellers, taxis, airport coaches and students and staff of the university, busiest at the peaks of the flight schedule, and among the heaviest of any territorial expressway.
    background:
      zh: 长船国际机场位于首府以北的北岬区，是群岛对外交通的门户，群岛大学也坐落在北岬。机场启用之初，旅客只能经城市道路穿过老城往返，航班高峰时经常拥堵。长船机场高速自古城北上，绕开老城核心，直达机场航站区和群岛大学。线路穿过城市北部时以高架为主，靠近机场的路段严格控制桥梁和灯杆的高度，以满足机场净空要求；航站区段设置独立的出发和到达匝道。通车后机场与市中心之间的车程大为缩短，北岬也逐渐发展为首府的科教新区。
      en: Longship International Airport, the islands' gateway to the world, lies north of the capital in North Cape, as does the University of the Islands. When the airport first opened, travellers had to go through the old town on city streets, and at peak hours the traffic jammed. The Longship Airport Expressway runs north from the old town, skirting its core, straight to the terminals and the university. Through the northern city it is mostly on viaduct, and near the airport the heights of bridges and lighting columns are kept strictly within the airport's clearance limits, with separate departure and arrival ramps at the terminals. The trip between the airport and the city centre is much shorter, and North Cape has grown into the capital's new district of science and learning.
    shield: gull
    via: [div_g2g1yc, div_xps98r]
  - id: rte_tjbqng
    ref: S-VK-2
    network: territorial_expressway
    class: motorway
    status: generated
    names:
      zh: 奥斯特哈门港口高速
      en: Austhamn Port Expressway
      art-x-viking: Hafenautobahn Austhamn
      art-x-buckham: Autostrada Portuale di Porto Est
    notes:
      zh: 东港港口高速自长船古城边缘出发，经汇金金融区直达东港区的集装箱码头，全长约八十公里，全程半小时多，是长船市区南北向的快速通道。线路在汇金区大段走东港隧道等地下路段，出隧道后以汇金高架桥跨过港区堆场，直接接入码头闸口；码头路段设有货车专用车道和集装箱查验站。全线双向十二车道，全程位于城区，限速 140 公里。全线日均车流都在十万辆以上，是群岛最繁忙的高速之一，集装箱卡车昼夜不停，早晚高峰还叠加大量通勤车辆。
      en: The East Harbour Port Expressway runs from the edge of Longship's old town through the Goldmark financial district to the container terminals of East Harbour, about 80 km in just over half an hour, and serves as Longship's north–south urban expressway. Through Goldmark it runs largely underground, in the East Harbour Tunnel and others; once out it crosses the port's stacking yards on the Goldmark Viaduct and feeds straight into the terminal gates, where it has lorry-only lanes and container inspection stations. It has six lanes each way and, running entirely through the city, a 140 km/h limit. Every stretch carries more than 100,000 vehicles a day, making it one of the busiest expressways in the islands, with container lorries round the clock and heavy commuter traffic on top at the morning and evening peaks.
    background:
      zh: 东港区的集装箱码头是首府最大的港口，过去集装箱卡车要穿过古城和汇金金融区的街道进出港区，噪声、拥堵和安全问题都十分突出。东港港口高速自古城边缘出发，经汇金区直达东港码头，是长船市区南北向的快速通道。为了不打扰老城和金融区，线路在汇金区大段采用地下隧道，出隧道后以高架桥跨过港区堆场，直接接入码头闸口。码头路段设置货车专用车道和集装箱查验站。通车后货车不必再穿过老城，古城的街道也恢复了宁静。
      en: The container terminals at East Harbour are the capital's largest port, and container trucks used to reach them through the streets of the old town and the Goldmark financial district, with all the noise, congestion and danger that brought. The East Harbour Port Expressway runs from the edge of the old town through Goldmark straight to the East Harbour terminals, a fast north–south route through the city. To spare the old town and the financial district it runs underground for much of Goldmark, then rises onto viaduct over the port yards straight to the terminal gates. The port end has truck-only lanes and a container inspection station. Trucks no longer cross the old town, and its streets have grown quiet again.
    shield: ship
    via: [div_g2g1yc, div_jzqknb, div_j6mw1m]
  - id: rte_d67xzw
    ref: S-VK-3
    network: territorial_expressway
    class: motorway
    status: generated
    names:
      zh: 阿托高速
      en: Akkersvik–Tåkevik Expressway
      art-x-viking: Autobahn Akkersvik–Tåkevik
      art-x-buckham: Autostrada Portancora–Baianebbia
    notes:
      zh: 锚雾高速自锚港链城区出发，横穿锚岛，经峡湾区到西岸的雾湾，全长约一百五十公里，全程一小时左右。锚链山隧道穿过主脊，是全线最长的隧道，雾湾高架桥是最长的桥梁，坡度在群岛高速中属于最陡的一类。全线双向十二车道，城区和山区路段限速 140 公里，其余路段不限速；全线设有雾区行车诱导灯和能见度监测，浓雾时自动发布临时限速。车流以运送海产的冷藏车和锚港、雾湾之间的通勤车辆为主，清晨的雾湾段常需打开诱导灯。
      en: The Anchorhaven–Mistbay Expressway runs from Chain Town in Anchorhaven across Anchor Island through the Fjord District to Mistbay on the west coast, about 150 km in roughly an hour. The Anchor Chain Mountains Tunnel through the main ridge is its longest tunnel and the Mistbay Viaduct its longest bridge, and its grades are among the steepest of any expressway in the islands. It has six lanes each way, a 140 km/h limit through towns and mountains, and no limit elsewhere; fog guidance lights and visibility sensors run its whole length and post temporary limits automatically when fog is thick. Its traffic is mostly refrigerated lorries carrying seafood and commuters between Anchorhaven and Mistbay, and the guidance lights are often on along the Mistbay stretch in the early morning.
    background:
      zh: 雾湾位于锚岛西岸，常年多雾，渔业和海产养殖发达，但与岛东侧的锚港之间隔着锚链山，过去只有一条翻山的老路。锚雾高速自锚港链城区出发，横穿锚岛，经峡湾区到西岸的雾湾。线路翻越锚链山时以隧道穿过主脊，峡湾区段跨越多条深谷。针对雾湾一带的浓雾天气，全线设置雾区行车诱导灯和能见度监测，雾大时自动发布临时限速。通车后，雾湾的海产可以当天运到锚港和长船的市场，西岸也因此吸引了不少新居民。
      en: Mistbay on Anchor Island's west coast is foggy most of the year and lives by fishing and shellfish farming, but the Anchor Chain Mountains stand between it and Anchorhaven on the east side, with only an old road over the top. The Anchorhaven–Mistbay Expressway crosses the island from Chain Town in Anchorhaven through Fjord District to Mistbay. It tunnels under the main ridge of the Anchor Chain Mountains and bridges several deep valleys in Fjord District. For the Mistbay fogs the whole line has guidance lights and visibility sensors, and temporary limits are posted automatically when the fog thickens. Mistbay's seafood now reaches the markets of Anchorhaven and Longship the same day, and the west coast has drawn many new residents.
    tunnel_cost: 3.5
    shield: anchor
    via: [div_b569a2, div_3zqdra]
  - id: rte_zc14xp
    ref: S-VK-4
    network: territorial_expressway
    class: motorway
    status: generated
    names:
      zh: 阿夫琳港邮轮高速
      en: Port Aveline Cruise Expressway
      art-x-viking: Kreuzfahrtautobahn Port Aveline
      art-x-buckham: Autostrada delle Crociere di Porto Aveline
    notes:
      zh: 帆港邮轮高速自白帆老城帆城区出发，经灯塔区沿海岸到帆港区的邮轮母港与免税城，全长约一百公里，全程四十分钟左右。帆港高架桥造型轻盈，是全线最长的桥梁，也是帆港的地标之一；邮轮码头一端设有大巴专用通道和集中换乘广场，沿线限制广告牌和高大建筑。全线双向十二车道，城区路段限速 140 公里，其余路段不限速。邮轮靠港的日子车流成倍增加，旅游大巴往返不断，平日则以前往免税城和海滨的车辆为主。
      en: The Sail Harbour Cruise Expressway runs from Sail Town, the old heart of White Sail, through the Lighthouse District along the coast to the cruise home port and duty-free mall in Sail Harbour, about 100 km in some forty minutes. The light, graceful Sail Harbour Viaduct is its longest bridge and one of Sail Harbour's landmarks. At the cruise terminal end there is a coach-only approach and a central interchange plaza, and billboards and tall buildings are restricted along the route. It has six lanes each way, a 140 km/h limit through towns and no limit elsewhere. Traffic multiplies on days when cruise ships are in, with a constant stream of tour coaches; on other days it carries mostly shoppers bound for the duty-free mall and beachgoers.
    background:
      zh: 帆港区的邮轮母港和免税城是群岛最大的旅游门户，每逢邮轮靠港，大批游客要在短时间内往返白帆老城和码头。帆港邮轮高速自帆城区出发，经灯塔区到帆港区，专为邮轮旅客和旅游大巴服务。线路沿海岸修建，跨越沿途海湾时修建了一座造型轻盈的海湾桥，成为帆港的地标之一；邮轮码头一端设置大巴专用通道和集中换乘广场。为保持海岸景观，沿线限制广告牌和高大建筑。通车后邮轮旅客往返老城的时间大大缩短，帆港也发展为群岛最热闹的旅游区。
      en: The cruise home port and duty-free town at Sail Harbour are the islands' main tourist gateway, and whenever a ship is in, crowds of passengers need to get between the terminal and White Sail's old town in a few hours. The Sail Harbour Cruise Expressway runs from Sail Town through Lighthouse District to Sail Harbour, built for cruise passengers and coaches. It follows the shore, and its light, graceful bridge across a bay on the way has become one of Sail Harbour's landmarks. At the cruise terminal end there are coach-only lanes and an interchange plaza. To keep the coastline unspoilt, billboards and tall buildings are restricted along the route. Passengers now reach the old town far more quickly, and Sail Harbour has become the liveliest resort in the islands.
    shield: sailboat
    via: [div_vhsby1, div_tkvfsx]
  - id: rte_7r6n3d
    ref: S-VK-5
    network: territorial_expressway
    class: motorway
    status: generated
    names:
      zh: 暖河高速
      en: Warm River Expressway
      art-x-viking: Warmfluss-Autobahn
      art-x-buckham: Autostrada del Fiume Caldo
    notes:
      zh: 暖河高速自暖泉温泉区出发，沿东岸平原北上到暖河区的河口新城，全长约五十七公里，全程二十多分钟，是群岛最短的领地高速之一。暖河特大桥跨越温暖不冻的暖河河口，是全线唯一的长桥，桥面预留了轨道交通的位置，桥下保留着天然温水湿地。全线双向十二车道，城区路段限速 140 公里，其余路段不限速。车流以新城居民往返温泉老城的通勤车辆为主，早晚高峰最为集中，周末则有不少前往温泉区的游客。
      en: The Warm River Expressway runs north from Hot Springs in Warmspring across the east-coast plain to the new town at the mouth of the Warm River, about 57 km in just over twenty minutes, one of the shortest territorial expressways in the islands. The Warm River Bridge over the warm, ice-free river mouth is its only long bridge; its deck has space set aside for a future rail line, and the natural warm-water wetland beneath it is left intact. It has six lanes each way, a 140 km/h limit through towns and no limit elsewhere. Its traffic is mostly residents of the new town commuting to the old spa town, concentrated at the morning and evening peaks, with plenty of weekend visitors heading for the hot springs.
    background:
      zh: 暖河区位于暖泉岛东岸的暖河河口，是暖泉规划建设的新城，承接从温泉老区疏解出来的人口和产业。暖河高速自暖泉温泉区出发，沿东岸北上到暖河区，与新城同步规划、同步建设。线路沿海岸平原修建，跨越暖河时修建了一座宽阔的河口大桥，桥面预留了未来轨道交通的位置。暖河河水常年温暖，冬季不结冰，桥下保留了天然温水湿地。通车后，新城居民到温泉老城上班十分便捷，暖河新城的人口也快速增长。
      en: Warm River District, at the mouth of the Warm River on Warmspring Island's east coast, is the new town Warmspring planned to take people and industry out of the crowded old Hot Springs district. The Warm River Expressway runs up the east coast from Hot Springs to Warm River and was planned and built together with the new town. It follows the coastal plain and crosses the Warm River on a wide estuary bridge, with space on the deck kept for a future rail line. The river stays warm all year and never freezes, and the warm-water wetland beneath the bridge was left as it was. Commuting from the new town to Hot Springs is now easy, and Warm River's population has grown quickly.
    shield: crab
    via: [div_cz7sch, div_vk1835]

  # 领道 (territorial highways, class primary): every district centre lies on a territorial route.
  - id: rte_cx8xa1
    ref: S-VK-101
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 谢尔海姆山公路
      en: Kjølheim Hills Road
      art-x-viking: Kjølheimberg-Landstraße
      art-x-buckham: Strada dei Monti Chiglia
    notes:
      zh: 龙骨山公路自长船岛船尾出发，经舵港和龙骨山下的龙骨，沿山间谷地到长滩，全长约二百九十公里，全程两小时十几分钟，串起长船岛中段的山城和乡镇。线路沿谷地和缓坡修建，几乎没有桥隧，沿线保留了多处老村道的石桥作为步行道。全线双向八车道，沿途大多是乡村，全程不限速。它是山区乡镇通往两侧高速的连接线，车流以乡镇之间的短途车辆、运送林果的货车和乡村旅游的自驾游客为主，龙骨与长滩附近的路段最为繁忙。
      en: The Keel Hills Road runs from Longship Island's stern through Rudderhaven and Keel, below the Keel Hills, then along the upland valleys to Longbeach, about 290 km in a little over two hours, linking the hill towns and villages of the middle of the island. It follows valleys and gentle slopes, with almost no bridges or tunnels, and several old stone bridges of the village tracks it replaced survive alongside as footpaths. It has four lanes each way and, running mostly through countryside, no speed limit. It links the hill towns to the expressways on either side, and its traffic is mainly local trips between towns, lorries carrying fruit and timber and touring drivers visiting the villages; it is busiest near Keel and Longbeach.
    background:
      zh: 长船岛中段的龙骨山下散布着许多山城和乡镇，两侧的高速都只经过山脚，山区内部的交通长期依靠窄小的村道。龙骨山公路自长船岛船尾出发，经舵港、龙骨山下的龙骨到长滩，把长船岛中段的乡镇串成一线。线路沿山间谷地和缓坡修建，避开陡峭的山脊，工程以路基为主，桥隧很少；沿线保留了多处老村道的石桥作为步行道。它为山区乡镇提供了通往两条高速的连接，龙骨山的林果和乡村旅游也随之发展起来。
      en: Many hill towns and villages lie among the Keel Hills in the middle of Longship Island. The expressways on either side only skirt the foot of the hills, and inside them people long made do with narrow village lanes. The Keel Hills Road runs from Longship Island's stern through Rudderhaven and Keel, the town beneath the hills, to Longbeach, linking the island's middle towns in one line. It follows the valleys and gentle slopes, avoiding the steep ridges, so it is almost all at grade with very few bridges or tunnels, and several old stone bridges of the village lanes have been kept as footpaths. It connects the hill towns to both expressways, and orchards and rural tourism in the Keel Hills have grown along it.
    shield: wave
    via: [div_1tva4b, div_ej0v6c, div_drqyc2, div_dtk19k]
  - id: rte_15zjhp
    ref: S-VK-102
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 阿夫琳港灯塔公路
      en: Port Aveline Lighthouse Road
      art-x-viking: Leuchtturmstraße Port Aveline
      art-x-buckham: Strada del Faro di Porto Aveline
    notes:
      zh: 白帆灯塔公路自邮轮港所在的帆港区出发，沿海崖和海湾通往白帆岛东北端的灯塔区，全长约七十公里，全程半小时左右。灯塔高架桥贴水跨过海湾，是全线最长的桥梁；海崖附近路段在海鸟繁殖季节限制鸣笛和夜间照明。全线双向八车道，沿途都是乡村，全程不限速。车流以邮轮游客的旅游大巴和自驾车辆为主，终点的老灯塔、海洋博物馆和观鸟站是热门的一日游目的地，邮轮靠港的日子路上最为热闹。
      en: The White Sail Lighthouse Road runs from Sail Harbour, home of the cruise port, along sea cliffs and bays to the Lighthouse District at the north-east tip of White Sail Island, about 70 km in some half an hour. The Lighthouse Viaduct, which crosses a bay just above the water, is its longest bridge, and during the seabird breeding season horns and night lighting are restricted on the stretches near the cliffs. It has four lanes each way and, running through countryside all the way, no speed limit. Its traffic is mostly tour coaches and hire cars carrying cruise passengers; the old lighthouse, the maritime museum and the birdwatching station at the end are popular day trips, and the road is liveliest when cruise ships are in.
    background:
      zh: 灯塔区位于白帆岛东北端，岬角上的老灯塔是群岛最古老的航标之一，周围的海崖和海鸟栖息地吸引着许多游客，过去游客只能乘船或沿崎岖的小路前往。白帆灯塔公路自邮轮港所在的帆港区出发，通往灯塔区，线路多处沿海崖和海湾修建，跨越海湾时以低矮的桥梁贴水而过，减少对海鸟的惊扰；繁殖季节，海崖附近路段限制鸣笛和夜间照明。通车后，邮轮游客可以在一天之内往返灯塔，灯塔区也建起了海洋博物馆和观鸟站。
      en: Lighthouse District sits at the north-east tip of White Sail Island, where the old lighthouse on the cape is one of the oldest sea marks in the islands, and its sea cliffs and seabird colonies draw many visitors, who once had to come by boat or on a rough path. The White Sail Lighthouse Road runs from Sail Harbour, where the cruise port is, out to Lighthouse District. It follows sea cliffs and bays for much of the way and crosses the inlets on low bridges close to the water to disturb the seabirds as little as possible; in the breeding season horns and night lighting are restricted near the cliffs. Cruise passengers can now visit the lighthouse in a day, and the district has gained a maritime museum and a bird-watching station.
    shield: lighthouse
    via: [div_tkvfsx, div_8a2hzm]
  - id: rte_8jm50e
    ref: S-VK-103
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 暖泉环山公路
      en: Warmspring Volcano Road
      art-x-viking: Warmquell-Vulkanstraße
      art-x-buckham: Strada del Vulcano di Fontecalda
    notes:
      zh: 暖泉环山公路环绕暖泉火山山麓，自温泉区出发，经黑沙、硫磺湾、岩港到看落日的落日区，全长约四百一十公里，全程三小时多，是暖泉岛最早的环山道路。线路沿用旧路，绕开地热活跃区和喷气孔，地热路段设有温度监测；沿途跨越九条山溪和河流，桥梁都不长。全线双向八车道，城区路段限速 120 公里，其余路段不限速。南环高速分走长途车辆后，它主要承担火山山麓的地方交通和观光车流，温泉村、黑沙海滩和落日岬观景台一带傍晚最为热闹。
      en: The Warmspring Volcano Road circles the foot of Warmspring Volcano from Hot Springs through Black Sand, Sulphur Bay and Rockhaven to Sunset, where people come to watch the sun go down. It is about 410 km long, a little over three hours end to end, and the oldest road round the volcano. It follows the old track, skirting the active geothermal ground and the fumaroles, with temperature monitoring on the geothermal stretches, and crosses nine streams and rivers on short bridges. It has four lanes each way, a 120 km/h limit through towns and no limit elsewhere. With long-distance traffic now on the Southern Arc Expressway, it carries local traffic round the volcano and sightseers, and is liveliest in the evening around the spa villages, the black-sand beaches and the Sunset Point lookout.
    background:
      zh: 暖泉环山公路是暖泉岛最早的环山道路，原本是一条连接火山山麓温泉村落的土路，后经领地全线改建为领道。线路自温泉区出发，经黑沙、硫磺湾、岩港到看落日的落日区，环绕暖泉火山的山麓。改建时线路尽量沿用旧路，绕开地热活跃区和喷气孔，路面采用耐高温材料，地热路段设置温度监测。沿线的温泉村、黑沙海滩和落日岬观景台构成了一条著名的观光路线。南环高速建成后，这条公路主要承担火山山麓的地方交通和观光车流。
      en: The Warmspring Volcano Road is the oldest road round Warmspring Volcano, once a dirt track linking the hot-spring villages on its slopes and later rebuilt throughout as a territorial highway. It runs from Hot Springs through Black Sand, Sulphur Bay and Rockhaven to Sunset, where people come to watch the sun go down, circling the foot of the volcano. The rebuilt road keeps to the old line as far as it can, steering clear of active geothermal ground and fumaroles; the pavement is heat-resistant and the geothermal stretches have temperature sensors. The hot-spring villages, the black beaches and the lookout at Sunset Point make it a well-known scenic drive. Since the Southern Arc Expressway opened, the road carries mostly local and sightseeing traffic.
    shield: shell
    via: [div_cz7sch, div_v2tq1k, div_k0zt4f, div_ghpaw7, div_b4by9r]
  - id: rte_f4nr9s
    ref: S-VK-104
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 乌维克库特跨海公路
      en: Uviqkut Causeway
      art-x-viking: Uviqkut-Damm
      art-x-buckham: Diga di Uviqkut
    notes:
      zh: 外屿跨海公路自鲸岛区出发，以海雀水道跨海大桥跨海北上到鸟崖岛，全长约一百七十公里，全程一小时二十分钟左右，是外屿两岛之间唯一的陆路。海雀水道跨海大桥长七十多公里，占全线近一半，是群岛最长的桥梁之一，桥面设有观鲸平台。全线双向八车道，跨海路段限速 120 公里，岛上路段不限速。车流在领道中属于较少的一类，以两岛之间的通勤、就医和上学车辆为主，鲸类洄游季节观鲸平台上常有游客停留。
      en: The Outer Isles Causeway runs from Whale Isle District over the Puffin Sound Bridge, north across the open sea to Bird Cliff Isle, about 170 km in some eighty minutes, the only land link between the two outer isles. The Puffin Sound Bridge, more than 70 km long and nearly half the route, is one of the longest bridges in the islands, and has whale-watching platforms on its deck. It has four lanes each way, a 120 km/h limit over the sea and no limit on the islands. Its traffic is light by the standards of territorial highways, mostly islanders travelling between the two isles to work, to hospital and to school, and in the whale migration season visitors linger on the viewing platforms.
    background:
      zh: 外屿由鲸岛和鸟崖岛两座海岛组成，两岛之间隔着七十多公里宽的海面，过去只靠小渡轮往来，冬季常因风浪停航，岛上居民就医、上学都很不便。外屿跨海公路以一座长长的跨海桥连接鲸岛与鸟崖岛，是外屿两岛之间唯一的陆路。这片海域是鲸类洄游的通道，桥梁跨度和桥墩位置经过专门论证，施工避开鲸类洄游季节，并全程进行水下噪声监测；桥面设置观鲸平台。通车后两岛的学校、医院和码头实现共享，跨海桥本身也成了外屿的标志性景观。
      en: The Outer Isles are two islands, Whale Isle and Bird Cliff Isle, some seventy kilometres of open sea apart. They were linked only by a small ferry that winter gales often stopped, which made getting to a doctor or to school hard. The Outer Isles Causeway joins them with one long sea bridge, the only land link between the two. These waters are a whale migration route, so the spans and pier positions were studied with care, work stopped during the migration season, and underwater noise was monitored throughout. There are whale-watching platforms on the deck. The two islands now share their schools, hospital and harbour, and the bridge itself has become the Outer Isles' landmark.
    shield: whale
    via: [div_khmgcq, div_5p2a2d]
  - id: rte_gp49t9
    ref: S-VK-105
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 长船西北岸公路
      en: Longship North-West Shore Road
      art-x-viking: Langskip-Nordwestküstenstraße
      art-x-buckham: Strada della Costa Nord-Ovest di Navelunga
    notes:
      zh: 长船西北岸公路自潮湾出发，经长滩、西岸的住宅区和海滨公园到北岬，全长约一百六十公里，全程一小时十几分钟，是首府西北岸社区平行于高速的地方通道。线路紧贴海岸修建，靠海一侧设有连续的步道和自行车道，与海滨公园连成一体，西岸大桥是全线唯一的大桥。全线双向八车道，城区路段限速 120 公里，其余路段不限速。沿线是首府扩展最快的住宅区，早晚通勤车流很大，日均车流居领道前列；周末则有大批居民到海滨散步、骑车。
      en: The Longship North-West Shore Road runs from Tidebay through Longbeach and the neighbourhoods and seafront parks of West Shore to North Cape, about 160 km in a little over an hour and a quarter; it is the local road for the capital's north-west shore communities, running parallel to the expressway. It hugs the shore, with a continuous footpath and cycle lane on the seaward side that merges into the seafront parks, and the West Shore Viaduct is its only major bridge. It has four lanes each way, a 120 km/h limit through towns and no limit elsewhere. The neighbourhoods along it are the fastest-growing in the capital, so commuter traffic is heavy morning and evening and its daily traffic is among the highest of any territorial highway; at weekends crowds come down to the seafront to walk and cycle.
    background:
      zh: 长船岛西北岸自潮湾到北岬一带，是首府扩展最快的住宅区，海边分布着沙滩和海滨公园。原有的海岸道路狭窄，居民进出主要依靠长船西岸高速，短途出行也不得不上高速。长船西北岸公路自潮湾出发，经长滩、西岸的住宅区和海滨公园到北岬，为沿岸社区提供一条平行于高速的地方通道。线路紧贴海岸修建，靠海一侧设置连续的步道和自行车道，与海滨公园融为一体。它分担了大量短途交通，也让西北岸成为首府居民周末休闲的去处。
      en: The north-west shore of Longship Island, from Tidebay to North Cape, is where the capital's housing has spread fastest, with beaches and seaside parks along the water. The old coast road was narrow, so residents relied on the West Shore Expressway even for short trips. The Longship North-West Shore Road runs from Tidebay through Longbeach and the housing and seaside parks of West Shore to North Cape, a local road for the shore communities alongside the expressway. It hugs the coast, with a continuous promenade and cycle path on the seaward side that merges into the parks. It takes much of the short local traffic off the expressway and has made the north-west shore a weekend escape for the capital.
    shield: dolphin
    via: [div_0yqqc3, div_kecby5, div_xps98r]
  - id: rte_v97vbz
    ref: S-VK-106
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 卡洛韦岭公路
      en: Calloway Ridge Road
      art-x-viking: Callowaygrat-Straße
      art-x-buckham: Strada della Cresta Calloway
    notes:
      zh: 帆影岭公路沿白帆岛西北岸，自银鸥出发，经白岭、帆影岭下的林场小镇到白帆老城帆城区，全长约二百九十公里，全程两小时十几分钟，与东南岸的白帆纵贯高速形成白帆岛的两条纵线。线路沿山麓与海岸之间的阶地修建，跨越多条山溪，桥梁短而多；林区路段设有运木车避让车道。全线双向八车道，城区路段限速 120 公里，其余路段不限速。车流以运木车、林场小镇的短途车辆和入住造船工坊、林场木屋民宿的游客为主，靠近白帆的路段通勤车辆较多。
      en: The Sailshadow Ridge Road runs along the north-west shore of White Sail Island from Silvergull through Whiteridge and the forest towns below the Sailshadow Ridge to Sail Town, the old heart of White Sail, about 290 km in a little over two hours; with the White Sail Spine Expressway on the south-east shore it gives the island two north–south routes. It follows the terraces between the foothills and the shore, crossing many mountain streams on short bridges, and the forest stretches have pull-outs for log trucks. It has four lanes each way, a 120 km/h limit through towns and no limit elsewhere. Its traffic is mostly log trucks, local trips between the forest towns and visitors staying in the old boatbuilders' workshops and forest cabins, with more commuters near White Sail.
    background:
      zh: 帆影岭纵贯白帆岛西北部，山下的林场小镇世代以伐木和木船制造为生，与岛东南岸的城市之间交通不便。帆影岭公路沿白帆岛西北岸，自银鸥经白岭、帆影岭下的林场小镇到白帆老城，与东南岸的白帆纵贯高速形成白帆岛的两条纵线。线路沿山麓与海岸之间的阶地修建，跨越多条山溪，桥梁短而多；林区路段设置运木车专用的避让车道。沿线的造船工坊和林场木屋已成为特色民宿。通车后，西北岸的林产品和手工木船可以直接运往白帆港。
      en: Sailshadow Ridge runs down the north-west of White Sail Island, and the forest towns beneath it have lived for generations by logging and building wooden boats, poorly connected to the cities on the south-east coast. The Sailshadow Ridge Road follows the north-west shore from Silvergull through Whiteridge and the forest towns below the ridge to White Sail's old town, making a second north–south line on the island alongside the White Sail Spine Expressway. It runs on the terraces between the hills and the shore and crosses many mountain streams on short bridges, and the forest stretches have pull-outs for timber trucks. Boatbuilders' workshops and forest cabins along the way have become guesthouses. Timber and handmade boats from the north-west now go straight to White Sail's harbour.
    shield: starfish
    via: [div_rvrs7v, div_v3mfeg, div_bs2e6p, div_vhsby1]
  - id: rte_mdpeba
    ref: S-VK-107
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 萨尔塔维克海滨公路
      en: Saltavik Coast Road
      art-x-viking: Saltavik-Küstenstraße
      art-x-buckham: Strada Costiera di Baiasale
    notes:
      zh: 盐湾海滨公路沿白帆岛东南岸，自渔港出发，经盐湾的盐场到望海的果园，全长约二百公里，全程一个半小时左右。线路沿海岸低地修建，在盐场外侧以路堤代替海堤，兼作防潮堤；果园路段两侧保留着防风林，全线几乎没有桥梁。全线双向八车道，沿途都是乡村，全程不限速。长途车辆大多改走白帆纵贯高速，这条路主要服务沿岸的盐场、果园和渔港，也是看海景、买海盐和水果的热门自驾路线，秋季果园采摘时节最为繁忙。
      en: The Salt Bay Coast Road runs along the south-east shore of White Sail Island from Fishing Harbour past the salt works of Saltbay to the orchards of Seawatch, about 200 km in some ninety minutes. It follows the coastal lowlands, running on an embankment outside the salt pans that doubles as a sea wall, with shelterbelts kept on both sides through the orchards; it has almost no bridges. It has four lanes each way and, running through countryside all the way, no speed limit. Most long-distance traffic now takes the White Sail Spine Expressway, so this road mainly serves the salt works, orchards and fishing harbours along the shore. It is also a favourite drive for sea views, sea salt and fruit, busiest in autumn when the orchards open for picking.
    background:
      zh: 白帆岛东南岸的盐湾有群岛最大的海盐盐场，相邻的望海以果园著称，渔港则是传统的渔业小镇，三地之间原本只有盐场的运盐土路和渔民的小道。盐湾海滨公路自渔港出发，经盐湾的盐场到望海的果园，沿海岸低地修建。为保护盐田，线路在盐场外侧以路堤代替海堤，路堤同时起到防潮作用；果园路段两侧保留防风林。白帆纵贯高速通车后，这条公路主要服务沿岸的盐场、果园和渔港，也是看海景、买海盐和水果的热门自驾路线。
      en: Salt Bay on White Sail Island's south-east coast has the islands' largest sea-salt works, neighbouring Seawatch is known for its orchards, and Fishing Harbour is an old fishing town. Between them there used to be only the salt works' haul tracks and fishermen's paths. The Salt Bay Coast Road runs along the coastal lowland from Fishing Harbour past the Salt Bay salt pans to the Seawatch orchards. To protect the salt pans its embankment runs along their seaward side and serves as the sea wall too, while the orchard stretches keep their shelter belts on both sides. Since the White Sail Spine Expressway opened it mainly serves the salt works, orchards and harbour, and it is a popular drive for sea views, salt and fruit.
    shield: fish
    via: [div_z1y7bz, div_626x3f, div_5rbg50]
  - id: rte_pytm4p
    ref: S-VK-108
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 阿克斯维克湾公路
      en: Akkersvik Bay Road
      art-x-viking: Akkersvikbucht-Straße
      art-x-buckham: "Strada della Baia dell'Ancora"
    notes:
      zh: 锚湾公路绕锚岛南端的锚湾，自西爪出发，经锚湾老港到东岸的船厂区，全长约二百四十公里，全程近两小时。线路以西爪高架桥等桥梁跨过海湾的几处深水湾汊，桥下净空满足新造船舶出港；老港路段从石砌码头和渔市后方绕过。全线双向八车道，城区和桥梁路段限速 120 公里，其余路段不限速。车流以西爪居民往返船厂的通勤车辆和运送船用钢材的货车为主，锚湾老港一带周末常有游客。
      en: The Anchor Bay Road runs round Anchor Bay at the southern end of Anchor Island, from West Fluke through the old harbour of Anchor Bay to the Shipyard District on the east shore, about 240 km in nearly two hours. Bridges such as the West Fluke Viaduct carry it over the bay's deep-water inlets, high enough for newly built ships to pass beneath, and through the old harbour it passes behind the stone quays and the fish market. It has four lanes each way, a 120 km/h limit through towns and on the bridges, and no limit elsewhere. Its traffic is mostly West Fluke residents commuting to the shipyards and lorries carrying ship steel, and the old harbour of Anchor Bay draws visitors at weekends.
    background:
      zh: 锚湾是锚岛南端的天然良港，西爪和东岸的船厂区分处海湾两侧，过去陆路要沿海湾绕一大圈，许多人宁愿乘渡船。锚湾公路自西爪出发，经锚湾老港到东岸的船厂区，绕锚湾修建，并以桥梁跨过海湾的几处深水湾汊，大大缩短了绕湾距离。老港路段从石砌码头和渔市后方绕过，老港风貌得以保留；桥梁净空满足船厂新造船舶出港的要求。通车后，西爪的居民可以方便地到船厂上班，锚湾老港也成了游客喜爱的海港小镇。
      en: Anchor Bay at the southern end of Anchor Island is a fine natural harbour, with West Fluke and the shipyards of Shipyard District on opposite sides. By land the way went all round the bay, and many people preferred the ferry. The Anchor Bay Road runs from West Fluke through the old port of Anchor Bay to the shipyards on the east shore, around the bay but with bridges over several of its deep arms, cutting the distance a great deal. In the old port the road passes behind the stone quays and fish market, which were left as they were, and the bridges have clearance for new ships leaving the yards. West Fluke's people can now get to work at the yards easily, and the old port has become a harbour town popular with visitors.
    shield: helm
    via: [div_j1czet, div_a2n8cw, div_qyhvjj]
  - id: rte_ga64q4
    ref: S-VK-109
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 阿克斯岛峡湾公路
      en: Akkersey Fjord Road
      art-x-viking: Akkersey-Fjordstraße
      art-x-buckham: "Strada dei Fiordi dell'Isola dell'Ancora"
    notes:
      zh: 锚岛峡湾公路是锚岛最长的领道，自锚港链城区出发到西岸的雾湾，再沿峡湾北上，绕到东北端的松林，全长约四百五十公里，全程三个半小时左右。线路沿峡湾岸边的阶地修建，峡湾最深处绕行湾头，桥梁很少，雾湾大桥是其中最长的一座；陡崖路段建有明洞和防落石棚。全线双向八车道，城区和陡崖路段限速 120 公里，其余路段不限速。沿线设有多个峡湾观景停车点，夏季自驾游客很多，冬季则以峡湾村落的补给车辆和校车为主。
      en: The Anchor Island Fjord Road is the longest territorial highway on Anchor Island. It runs from Chain Town in Anchorhaven to Mistbay on the west coast, then north along the fjords and round to Pinewood at the north-east end, about 450 km in some three and a half hours. It keeps to the terraces along the fjord shores and goes round the heads of the deepest fjords, so it has few bridges, the Mistbay Viaduct being the longest; cut-and-cover sections and rockfall shelters protect it below the steepest cliffs. It has four lanes each way, a 120 km/h limit through towns and below the cliffs, and no limit elsewhere. Its many fjord viewpoints draw crowds of touring drivers in summer; in winter its traffic is mostly supply vehicles and school buses for the fjord villages.
    background:
      zh: 锚岛西岸峡湾深切，峡湾两岸的村落长期与外界隔绝，物资主要靠补给船运送。锚岛峡湾公路自锚港链城区出发到西岸的雾湾，再沿峡湾北上，绕到东北端的松林，是锚岛最长的领道。线路尽量沿峡湾岸边的阶地修建，峡湾最深处绕行湾头，不建跨峡湾大桥，以控制造价；陡崖路段修建明洞和防落石棚。沿线峡湾风光壮丽，设有多个观景停车点。通车后西岸的峡湾村落第一次有了全年通行的公路，峡湾观光也成为锚岛的重要产业。
      en: Anchor Island's west coast is cut by deep fjords, and the villages on their shores were long isolated, supplied mainly by boat. The Anchor Island Fjord Road runs from Chain Town in Anchorhaven to Mistbay on the west coast, then north along the fjords and round to Pinewood in the north-east, Anchor Island's longest territorial highway. It keeps to the terraces along the fjord shores and goes round the heads of the deepest fjords rather than bridging them, to hold down the cost, with cut-and-cover sections and rockfall shelters under the steepest cliffs. The fjord scenery is magnificent, and there are many lay-bys to take it in. The fjord villages have their first year-round road, and fjord tourism has become one of Anchor Island's main trades.
    shield: buoy
    via: [div_b569a2, div_6ajqsc, div_27g39m, div_k4wvwe]
  - id: rte_3wg1t6
    ref: S-VK-110
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 西格利岛公路
      en: Sigley Road
      art-x-viking: Sigley-Straße
      art-x-buckham: "Strada dell'Isola dell'Albero"
    notes:
      zh: 桅岛公路穿过桅岛笔直高大的松林，连接南端的南桅与北端的桅港，全长约六十四公里，全程半小时左右。线路几乎是一条直线，两侧松林夹道，是岛上最有名的风景；路基宽度严格控制，路上方架有供松鼠等小动物通过的树冠绳桥。全线双向八车道，沿途都是森林，全程不限速。它把南桅与桅岛跨海高速连在一起，车流以运送松木的货车、木材加工厂的职工和前来森林徒步的游客为主，秋冬季节偶有驼鹿横穿道路。
      en: The Mast Island Road runs through Mast Island's tall, straight pines, linking South Mast at the southern end with Masthaven at the northern end, about 64 km in some half an hour. It is nearly a straight line, the pines closing in on both sides, and is the island's best-known view; the roadbed was kept narrow, and canopy rope bridges overhead let squirrels and other small animals cross. It has four lanes each way and, running through forest all the way, no speed limit. It connects South Mast to the Mast Island Sea Crossing, and its traffic is mostly pine-log lorries, sawmill workers and visitors coming to hike in the forest; in autumn and winter elk occasionally wander across.
    background:
      zh: 桅岛以笔直高大的松林著称，岛上的松木曾是造船桅杆的上等材料，桅岛也因此得名。南桅与桅港分处岛的南北两端，过去只有伐木道相连。桅岛公路穿过桅岛的松林，连接南桅与桅港，线路几乎笔直，两侧松林夹道，成为岛上最有名的风景。为保护松林，路基宽度严格控制，施工中尽量少砍树木，并为松鼠等小动物架设了树冠绳桥。桅岛跨海高速通车后，这条公路把南桅与跨海通道连了起来，南桅的木材加工和森林旅游也随之兴旺。
      en: Mast Island is famous for its tall, straight pines, once prized for ships' masts, which gave the island its name. South Mast and Masthaven lie at its southern and northern ends and used to be joined only by logging tracks. The Mast Island Road runs through the pines between them, almost dead straight, with the forest close on both sides, the island's best-known sight. To protect the forest the roadbed width was kept to a strict minimum, as few trees as possible were felled, and rope bridges were strung between the treetops for squirrels and other small animals. Since the Mast Island Sea Crossing opened, the road has tied South Mast to the crossing, and its sawmills and forest tourism have prospered.
    shield: knot
    via: [div_berjt2, div_2q2fcx]
  - id: rte_cgwhfz
    ref: S-VK-111
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 圣翁丁公路
      en: Saint-Ondine Road
      art-x-viking: Saint-Ondine-Straße
      art-x-buckham: "Strada di Sant'Ondine"
    notes:
      zh: 南星公路自南星岛南岸的南星镇出发，翻过全岛到达北岸的南星渡轮码头，全长约六十四公里，全程半小时左右，是岛上唯一的干线公路。线路沿山坡缓缓爬升，全线没有桥隧，山顶的观景台可以同时眺望南北两侧的海面；渡轮码头一端设有候船车道，车辆按班次有序上下渡轮。全线双向八车道，沿途都是乡村，全程不限速。车流随渡轮班次起伏，每班渡轮靠岸后会有一阵集中的车流，夏季前往海岛度假区的游客最多。
      en: The Southstar Road runs from the town of Southstar on the south coast of Southstar Island over the island to the Southstar Ferry Terminal on the north shore, about 64 km in some half an hour; it is the island's only main road. It climbs gently up the slopes with no bridges or tunnels, and the lookout at the top takes in the sea on both sides of the island. At the ferry terminal end there are holding lanes so vehicles board and leave each sailing in turn. It has four lanes each way and, running through countryside all the way, no speed limit. Its traffic rises and falls with the ferry timetable, with a burst of vehicles after each arrival, and it is busiest in summer with holidaymakers bound for the island's resorts.
    background:
      zh: 南星岛位于群岛南部外海，岛民以渔业和海岛度假为生，对外交通全靠北岸的渡轮码头。过去岛南的南星镇与北岸码头之间只有一条翻山小路，旅客和渔获往来十分不便。南星公路自南星镇出发，翻过全岛到达北岸的渡轮码头，是岛上唯一的干线公路。线路沿山坡缓缓爬升，在山顶设置了可以同时眺望南北海面的观景台；渡轮码头一端设置候船车道，便于车辆有序上下渡轮。通车后渡轮班次与公路衔接，南星岛的度假区也迎来了更多游客。
      en: Southstar Island lies offshore in the south of the islands; its people live by fishing and holiday trade, and their only link with the rest of the islands is the ferry pier on the north shore. Southstar town in the south was once joined to the pier only by a path over the hill, hard going for travellers and catches alike. The Southstar Road runs from Southstar town over the island to the ferry pier, the island's only through road. It climbs the slopes gently, with a lookout on the summit over the sea to both north and south, and at the pier there are marshalling lanes so vehicles board and leave the ferries in order. The ferries now connect with the road, and Southstar's resorts draw more visitors than ever.
    shield: coral
    via: [div_ht5w2y, poi_khwt70]
  - id: rte_1znwx2
    ref: S-VK-112
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 埃德文港公路
      en: Port Edevane Road
      art-x-viking: Port Edevane-Straße
      art-x-buckham: Strada di Porto Edevane
    notes:
      zh: 晨光公路自晨光镇出发，横穿全岛到达西岸的晨光渡轮码头，全长约五十五公里，全程半小时左右。线路的大半位于晨光海峡跨海大桥上，这座低矮的长桥贴着滩涂延伸，桥下潮水自由进出，水鸟栖息地得以保留。由于桥梁比例很高，全线双向八车道，全程限速 120 公里。车流以岛民往返渡轮的车辆和运送渔获的货车为主，清晨常有游客从码头驱车去镇上看日出，候鸟季节桥上禁止停车观鸟，观鸟需到两端的观测点。
      en: The Dawnlight Road runs from the town of Dawnlight across Dawnlight Island to the Dawnlight Ferry Terminal on the west shore, about 55 km in some half an hour. More than half of it is on the Dawnlight Strait Bridge, a long, low bridge that runs just above the tidal flats, letting the tide flow freely beneath and leaving the waterbird habitat undisturbed. Because so much of it is bridge, it has four lanes each way and a 120 km/h limit throughout. Its traffic is mostly islanders driving to and from the ferry and lorries carrying the catch; early in the morning visitors drive from the terminal to the town to watch the sunrise. In the bird migration season stopping on the bridge is banned, and birdwatchers use the viewing points at either end.
    background:
      zh: 晨光岛是群岛的一座外海岛屿，岛上的晨光镇因清晨第一缕阳光而得名，西岸是渡轮码头。晨光镇与码头之间地势低洼，涨潮时海水常漫过旧路，岛民往来要看潮水时刻。晨光公路自晨光镇出发，横穿晨光岛到达西岸的渡轮码头，低洼路段全部改为低矮的长桥，桥下潮水自由进出，滩涂上的水鸟栖息地得以保留。桥梁采用预制短跨结构，施工时避开候鸟季节。通车后公路不再受潮水影响，清晨从码头驱车去镇上看日出也成了游客的固定节目。
      en: Dawnlight Island is one of the outlying islands. Dawnlight town is named for the first light of morning, and the ferry pier is on the west shore. The ground between them is low, and at high tide the sea used to flood the old road, so islanders planned their trips by the tide tables. The Dawnlight Road crosses the island from the town to the pier, with every low-lying stretch carried on long, low bridges that let the tide flow freely beneath and leave the waders' mudflats as they were. The bridges were built of short precast spans, with the works paused in the migration season. The road is now open whatever the tide, and driving from the pier to the town to watch the sunrise has become a fixture for visitors.
    shield: jellyfish
    via: [div_f07nky, poi_jvgsbc]
  - id: rte_n6fxbt
    ref: S-VK-113
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 乌利克尤阿克岛公路
      en: Ulikjuaq Island Road
      art-x-viking: Ulikjuaqinsel-Straße
      art-x-buckham: "Strada dell'Isola Ulikjuaq"
    notes:
      zh: 鳕岛公路自鳕港镇的鱼干架旁出发，从镇子后方绕过海滨晾晒场，横穿鳕岛到东岸的鳕港渡轮码头，全长约七十七公里，全程三十多分钟。鳕港特大桥是全线唯一的大桥；路面按冷藏货车标准修建，渡轮码头旁建有冷库和鱼货集散站。全线双向八车道，沿途都是乡村，全程不限速。车流以运送风干鳕鱼和鲜鱼的冷藏货车为主，晾鱼季节前来参观鱼干架的游客也不少，渡轮靠岸前后车辆最为集中。
      en: The Cod Island Road starts beside the fish-drying racks of Codhaven, passes behind the town to avoid the drying grounds on the shore, and crosses Cod Island to the Codhaven Ferry Terminal on the east coast, about 77 km in just over half an hour. The Codhaven Sea Bridge is its only major bridge; the road is built for refrigerated lorries, and next to the ferry terminal there are cold stores and a fish market depot. It has four lanes each way and, running through countryside all the way, no speed limit. Its traffic is mostly refrigerated lorries carrying dried and fresh cod, plus visitors who come to see the drying racks in season, and it is busiest around ferry arrivals and departures.
    background:
      zh: 鳕岛以鳕鱼得名，鳕港镇的海边至今排列着成片的鱼干架，风干鳕鱼是岛上最重要的特产。过去岛民和鱼干要用拖拉机沿海滩运到东岸的渡轮码头，遇到风暴潮便无法通行。鳕岛公路自鳕港的鱼干架旁出发，横穿鳕岛到达东岸的渡轮码头，线路避开海滨的晾晒场，从镇子后方绕过。路面按冷藏货车标准修建，渡轮码头旁建有冷库和鱼货集散站。通车后，鳕岛的风干鳕鱼可以稳定地运往长船乃至更远的市场，晾鱼季节的鱼干架也成了岛上的独特风景。
      en: Cod Island takes its name from the cod, and racks of drying fish still line the shore at Codhaven; stockfish is the island's great product. Islanders and their fish used to be hauled by tractor along the beach to the ferry pier on the east shore, impossible in a storm surge. The Cod Island Road runs from beside the Codhaven drying racks across the island to the east-shore ferry pier, passing behind the town to keep clear of the drying grounds on the shore. It is built for refrigerated trucks, and beside the pier there is a cold store and fish market. Codhaven's stockfish now travels reliably to Longship and farther, and in the drying season the racks are one of the island's sights.
    shield: fishhook
    via: [div_7pf4qf, poi_bw56b6]
  - id: rte_j3v7pf
    ref: S-VK-114
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 亚利图克岛公路
      en: Jaalituuq Island Road
      art-x-viking: Jaalituuqinsel-Straße
      art-x-buckham: "Strada dell'Isola Jaalituuq"
    notes:
      zh: 风岛公路自风港镇出发，沿风机林立的山脊到南岸的风港风电运维港，全长约四十二公里，全程二十分钟左右，是群岛最短的领道之一。线路按运输超长风机叶片的要求设计，弯道半径大、坡度缓，部分路段路面加宽；山脊路段设有挡风墙，大风时限制高车通行。全线双向八车道，沿途都是乡村，全程不限速。车流以风电场的运维车辆、运送叶片和塔筒的特种车辆为主，也有游客沿山脊行驶，近距离观看成排的风机。
      en: The Wind Isle Road runs from the town of Windhaven along a ridge lined with wind turbines to the Windhaven Wind Service Port on the south coast, about 42 km in some twenty minutes, one of the shortest territorial highways in the islands. It was designed for hauling extra-long turbine blades, with wide curves, gentle grades and widened sections, and wind walls on the ridge, where high-sided vehicles are restricted in strong winds. It has four lanes each way and, running through countryside all the way, no speed limit. Its traffic is mostly maintenance vehicles for the wind farm and special transporters carrying blades and tower sections, plus visitors who drive the ridge to see the rows of turbines up close.
    background:
      zh: 风岛海风终年不息，是群岛风力发电的主要基地，岛上山脊排列着成片风机，南岸建有风电运维港。风电场开发之前，岛上只有风港镇和几处牧场，没有像样的道路。风岛公路自风港镇出发，沿风机林立的山脊到南岸的风电运维港，主要为风电场的建设和维护服务。线路按运输超长风机叶片的要求设计，弯道半径大、坡度缓，部分路段路面加宽；山脊路段设置挡风墙，大风时限制高车通行。通车后风电场得以大规模扩建，沿山脊行驶、近距离观看风机也成为风岛独特的旅游项目。
      en: The wind never drops on Wind Isle, the islands' main wind-power base, its ridges lined with turbines and a wind-farm service port on the south shore. Before the wind farms there was only Windhaven town and a few pastures, and no real roads. The Wind Isle Road runs from Windhaven along the turbine ridges to the service port on the south shore, built mainly to put up and maintain the wind farms. It is designed to carry the extra-long turbine blades, with wide curves, gentle grades and widened stretches, and on the ridge it has wind walls, with high-sided vehicles barred in gales. The wind farms have since grown a great deal, and driving the ridge among the turbines has become Wind Isle's own attraction.
