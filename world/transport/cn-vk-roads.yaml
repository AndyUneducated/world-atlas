      en: Round Anchor Bay from West Fluke through the old harbour of Anchor Bay to the shipyards on the east shore.
    background:
      zh: 锚湾是锚岛南端的天然良港，西爪和东岸的船厂区分处海湾两侧，过去陆路要沿海湾绕一大圈，许多人宁愿乘渡船。锚湾公路自西爪出发，经锚湾老港到东岸的船厂区，绕锚湾修建，并以桥梁跨过海湾的几处深水湾汊，大大缩短了绕湾距离。老港路段从石砌码头和渔市后方绕过，老港风貌得以保留；桥梁净空满足船厂新造船舶出港的要求。通车后，西爪的居民可以方便地到船厂上班，锚湾老港也成了游客喜爱的海港小镇。
      en: Anchor Bay at the southern end of Anchor Island is a fine natural harbour, with West Fluke and the shipyards of Shipyard District on opposite sides. By land the way went all round the bay, and many people preferred the ferry. The Anchor Bay Road runs from West Fluke through the old port of Anchor Bay to the shipyards on the east shore, around the bay but with bridges over several of its deep arms, cutting the distance a great deal. In the old port the road passes behind the stone quays and fish market, which were left as they were, and the bridges have clearance for new ships leaving the yards. West Fluke's people can now get to work at the yards easily, and the old port has become a harbour town popular with visitors.
    shield: helm
    via: [div_j1czet, div_a2n8cw, div_qyhvjj]
  - id: rte_ga64q4
    ref: S-VK-109
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 锚岛峡湾公路
      en: Anchor Island Fjord Road
      art-x-viking: Ankerinsel-Fjordstraße
      art-x-buckham: Strada dei Fiordi dell'Isola dell'Ancora
    notes:
      zh: 自链城到西岸的雾湾，再沿峡湾北上，绕到东北端的松林
      en: From Chain Town to Mistbay on the west coast, then north along the fjords and round to Pinewood at the north-east end.
    background:
      zh: 锚岛西岸峡湾深切，峡湾两岸的村落长期与外界隔绝，物资主要靠补给船运送。锚岛峡湾公路自锚港链城区出发到西岸的雾湾，再沿峡湾北上，绕到东北端的松林，是锚岛最长的领道。线路尽量沿峡湾岸边的阶地修建，峡湾最深处绕行湾头，不建跨峡湾大桥，以控制造价；陡崖路段修建明洞和防落石棚。沿线峡湾风光壮丽，设有多个观景停车点。通车后西岸的峡湾村落第一次有了全年通行的公路，峡湾观光也成为锚岛的重要产业。
      en: Anchor Island's west coast is cut by deep fjords, and the villages on their shores were long isolated, supplied mainly by boat. The Anchor Island Fjord Road runs from Chain Town in Anchorhaven to Mistbay on the west coast, then north along the fjords and round to Pinewood in the north-east, Anchor Island's longest territorial highway. It keeps to the terraces along the fjord shores and goes round the heads of the deepest fjords rather than bridging them, to hold down the cost, with cut-and-cover sections and rockfall shelters under the steepest cliffs. The fjord scenery is magnificent, and there are many lay-bys to take it in. The fjord villages have their first year-round road, and fjord tourism has become one of Anchor Island's main trades.
    shield: buoy
    via: [div_b569a2, div_6ajqsc, div_27g39m, div_k4wvwe]
  - id: rte_3wg1t6
    ref: S-VK-110
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 桅岛公路
      en: Mast Island Road
      art-x-viking: Mastinsel-Straße
      art-x-buckham: Strada dell'Isola dell'Albero
    notes:
      zh: 穿过桅岛笔直的松林，连接南桅与桅港
      en: Through the straight pines of Mast Island, linking South Mast and Masthaven.
    background:
      zh: 桅岛以笔直高大的松林著称，岛上的松木曾是造船桅杆的上等材料，桅岛也因此得名。南桅与桅港分处岛的南北两端，过去只有伐木道相连。桅岛公路穿过桅岛的松林，连接南桅与桅港，线路几乎笔直，两侧松林夹道，成为岛上最有名的风景。为保护松林，路基宽度严格控制，施工中尽量少砍树木，并为松鼠等小动物架设了树冠绳桥。桅岛跨海高速通车后，这条公路把南桅与跨海通道连了起来，南桅的木材加工和森林旅游也随之兴旺。
      en: Mast Island is famous for its tall, straight pines, once prized for ships' masts, which gave the island its name. South Mast and Masthaven lie at its southern and northern ends and used to be joined only by logging tracks. The Mast Island Road runs through the pines between them, almost dead straight, with the forest close on both sides, the island's best-known sight. To protect the forest the roadbed width was kept to a strict minimum, as few trees as possible were felled, and rope bridges were strung between the treetops for squirrels and other small animals. Since the Mast Island Sea Crossing opened, the road has tied South Mast to the crossing, and its sawmills and forest tourism have prospered.
    shield: knot
    via: [div_berjt2, div_2q2fcx]
  - id: rte_cgwhfz
    ref: S-VK-111
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 南星公路
      en: Southstar Road
      art-x-viking: Südstern-Straße
      art-x-buckham: Strada di Stellasud
    notes:
      zh: 自南星镇翻过全岛到北岸的渡轮码头
      en: From the town of Southstar over the island to the ferry terminal on the north shore.
    background:
      zh: 南星岛位于群岛南部外海，岛民以渔业和海岛度假为生，对外交通全靠北岸的渡轮码头。过去岛南的南星镇与北岸码头之间只有一条翻山小路，旅客和渔获往来十分不便。南星公路自南星镇出发，翻过全岛到达北岸的渡轮码头，是岛上唯一的干线公路。线路沿山坡缓缓爬升，在山顶设置了可以同时眺望南北海面的观景台；渡轮码头一端设置候船车道，便于车辆有序上下渡轮。通车后渡轮班次与公路衔接，南星岛的度假区也迎来了更多游客。
      en: Southstar Island lies offshore in the south of the islands; its people live by fishing and holiday trade, and their only link with the rest of the islands is the ferry pier on the north shore. Southstar town in the south was once joined to the pier only by a path over the hill, hard going for travellers and catches alike. The Southstar Road runs from Southstar town over the island to the ferry pier, the island's only through road. It climbs the slopes gently, with a lookout on the summit over the sea to both north and south, and at the pier there are marshalling lanes so vehicles board and leave the ferries in order. The ferries now connect with the road, and Southstar's resorts draw more visitors than ever.
    shield: coral
    via: [div_ht5w2y, poi_khwt70]
  - id: rte_1znwx2
    ref: S-VK-112
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 晨光公路
      en: Dawnlight Road
      art-x-viking: Morgenlicht-Straße
      art-x-buckham: Strada di Aurora
    notes:
      zh: 自晨光镇横穿晨光岛到西岸的渡轮码头
      en: From the town of Dawnlight across Dawnlight Island to the ferry terminal on the west shore.
    background:
      zh: 晨光岛是群岛的一座外海岛屿，岛上的晨光镇因清晨第一缕阳光而得名，西岸是渡轮码头。晨光镇与码头之间地势低洼，涨潮时海水常漫过旧路，岛民往来要看潮水时刻。晨光公路自晨光镇出发，横穿晨光岛到达西岸的渡轮码头，低洼路段全部改为低矮的长桥，桥下潮水自由进出，滩涂上的水鸟栖息地得以保留。桥梁采用预制短跨结构，施工时避开候鸟季节。通车后公路不再受潮水影响，清晨从码头驱车去镇上看日出也成了游客的固定节目。
      en: Dawnlight Island is one of the outlying islands. Dawnlight town is named for the first light of morning, and the ferry pier is on the west shore. The ground between them is low, and at high tide the sea used to flood the old road, so islanders planned their trips by the tide tables. The Dawnlight Road crosses the island from the town to the pier, with every low-lying stretch carried on long, low bridges that let the tide flow freely beneath and leave the waders' mudflats as they were. The bridges were built of short precast spans, with the works paused in the migration season. The road is now open whatever the tide, and driving from the pier to the town to watch the sunrise has become a fixture for visitors.
    shield: jellyfish
    via: [div_f07nky, poi_jvgsbc]
  - id: rte_n6fxbt
    ref: S-VK-113
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 鳕岛公路
      en: Cod Island Road
      art-x-viking: Dorschinsel-Straße
      art-x-buckham: Strada dell'Isola del Merluzzo
    notes:
      zh: 自鳕港的鱼干架旁横穿鳕岛到东岸的渡轮码头
      en: From the drying racks of Codhaven across Cod Island to the ferry terminal on the east shore.
    background:
      zh: 鳕岛以鳕鱼得名，鳕港镇的海边至今排列着成片的鱼干架，风干鳕鱼是岛上最重要的特产。过去岛民和鱼干要用拖拉机沿海滩运到东岸的渡轮码头，遇到风暴潮便无法通行。鳕岛公路自鳕港的鱼干架旁出发，横穿鳕岛到达东岸的渡轮码头，线路避开海滨的晾晒场，从镇子后方绕过。路面按冷藏货车标准修建，渡轮码头旁建有冷库和鱼货集散站。通车后，鳕岛的风干鳕鱼可以稳定地运往长船乃至更远的市场，晾鱼季节的鱼干架也成了岛上的独特风景。
      en: Cod Island takes its name from the cod, and racks of drying fish still line the shore at Codhaven; stockfish is the island's great product. Islanders and their fish used to be hauled by tractor along the beach to the ferry pier on the east shore, impossible in a storm surge. The Cod Island Road runs from beside the Codhaven drying racks across the island to the east-shore ferry pier, passing behind the town to keep clear of the drying grounds on the shore. It is built for refrigerated trucks, and beside the pier there is a cold store and fish market. Codhaven's stockfish now travels reliably to Longship and farther, and in the drying season the racks are one of the island's sights.
    shield: fishhook
    via: [div_7pf4qf, poi_bw56b6]
  - id: rte_j3v7pf
    ref: S-VK-114
    network: territorial_highway
    class: primary
    status: generated
    names:
      zh: 风岛公路
      en: Wind Isle Road
      art-x-viking: Windinsel-Straße
      art-x-buckham: Strada dell'Isola del Vento
    notes:
      zh: 自风港镇沿风机林立的山脊到南岸的风电运维港
      en: From the town of Windhaven along the turbine-lined ridge to the wind service port on the south shore.
    background:
      zh: 风岛海风终年不息，是群岛风力发电的主要基地，岛上山脊排列着成片风机，南岸建有风电运维港。风电场开发之前，岛上只有风港镇和几处牧场，没有像样的道路。风岛公路自风港镇出发，沿风机林立的山脊到南岸的风电运维港，主要为风电场的建设和维护服务。线路按运输超长风机叶片的要求设计，弯道半径大、坡度缓，部分路段路面加宽；山脊路段设置挡风墙，大风时限制高车通行。通车后风电场得以大规模扩建，沿山脊行驶、近距离观看风机也成为风岛独特的旅游项目。
      en: The wind never drops on Wind Isle, the islands' main wind-power base, its ridges lined with turbines and a wind-farm service port on the south shore. Before the wind farms there was only Windhaven town and a few pastures, and no real roads. The Wind Isle Road runs from Windhaven along the turbine ridges to the service port on the south shore, built mainly to put up and maintain the wind farms. It is designed to carry the extra-long turbine blades, with wide curves, gentle grades and widened stretches, and on the ridge it has wind walls, with high-sided vehicles barred in gales. The wind farms have since grown a great deal, and driving the ridge among the turbines has become Wind Isle's own attraction.
    shield: octopus
    via: [div_72h3ge, poi_p3cv8y]
