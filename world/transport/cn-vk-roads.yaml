    notes:
      zh: 沿白帆岛东南岸自渔港经盐湾的盐场到望海的果园
      en: Along the south-east shore of White Sail Island from Fishing Harbour past the salt works of Saltbay to the orchards of Seawatch.
    background:
      zh: 白帆岛东南岸的盐湾有群岛最大的海盐盐场，相邻的望海以果园著称，渔港则是传统的渔业小镇，三地之间原本只有盐场的运盐土路和渔民的小道。盐湾海滨公路自渔港出发，经盐湾的盐场到望海的果园，沿海岸低地修建。为保护盐田，线路在盐场外侧以路堤代替海堤，路堤同时起到防潮作用；果园路段两侧保留防风林。白帆纵贯高速通车后，这条公路主要服务沿岸的盐场、果园和渔港，也是看海景、买海盐和水果的热门自驾路线。
      en: Salt Bay on White Sail Island's south-east coast has the islands' largest sea-salt works, neighbouring Seawatch is known for its orchards, and Fishing Harbour is an old fishing town. Between them there used to be only the salt works' haul tracks and fishermen's paths. The Salt Bay Coast Road runs along the coastal lowland from Fishing Harbour past the Salt Bay salt pans to the Seawatch orchards. To protect the salt pans its embankment runs along their seaward side and serves as the sea wall too, while the orchard stretches keep their shelter belts on both sides. Since the White Sail Spine Expressway opened it mainly serves the salt works, orchards and harbour, and it is a popular drive for sea views, salt and fruit.
    shield: fish
