  names: {zh: 扎纳拉, en: Zanara, art-x-kasiri: Zanara}
  notes:
    zh: "扎纳拉是萨希利亚伊斯兰共和国最北的城市，位于拉诺瓦岛西海岸北段，全市面积约 1.7 万平方公里，人口约 30 万。城区建在海拔约 70 米的海岸平原上，往东是逐渐升高的干燥丘陵，最高处 767 米。海边一格格的盐田一直延伸到北面与贾巴利亚的边境。这里是半干旱气候，年均气温 24.8 摄氏度，年降水只有约 660 毫米，一月到三月每月只有 2 毫米雨，八月最湿也不过 112 毫米。长长的旱季、强烈的日照和不停的海风，正是晒盐最需要的条件。\n扎纳拉的晒盐业和西海岸的卡西里商人一样古老，单桅帆船曾把这里的盐运到岛上各个港口。大分裂后，北部山区的贾巴利亚武装斥共和国为「背教者的国家」，西岸战争由此爆发，三十多年来时断时续。扎纳拉离边境最近，城镇多次易手，又多次遭到袭击，许多家庭逃往南方，有的去了班达里港南面的难民营。如今城市由共和国军队驻守，陆军第三步兵旅的兵营就在城郊，负责扎纳拉周边的防务；往北的路段靠近边境，沿途设有军队的检查站。\n经济以海盐和渔业为主，第一产业占 35%，第二产业占 32%，人均生产总值约 4150 美元。扎纳拉盐场沿干燥的海岸展开，海水引进浅浅的盐田，在烈日下蒸发结晶，旱季里盐工用木耙把盐粒堆成白色的小山，再装袋运往全岛。盐场是当地最大的雇主，许多家庭世代以晒盐为生。渔船清早出海，下午回港，渔获一部分就地晒成咸鱼。西海岸公路在市境内长约 180 公里，向南通往首都萨希勒，盐和咸鱼都靠卡车沿这条路运出去。\n扎纳拉的市议会有 27 席，上一次选举投票率 60.5%：伊斯兰公正党得票 44.6%，获 12 席，与获 6 席的海岸民族党联合执政，市长雷赫玛·姆巴拉克出自公正党；代表盐工和渔民的人民劳动党得票 33.0%，获 9 席，是市内最大的反对党，在盐场工人中支持者最多。\n居民 83% 以卡西里语为母语，13% 讲拉诺瓦语，绝大多数信奉伊斯兰教。识字率约 73%，平均预期寿命约 64 岁，都低于全国平均，战争留下的伤痕至今仍在。盐工们天不亮就下盐田，赶在正午的烈日之前收工，午后在清真寺旁的茶摊喝加了丁香的甜茶。新盐收成时，人们会把第一袋盐送到清真寺，分给穷人家。斋月的夜晚，家家户户在门前铺开席子，端出烤鱼和椰汁米饭。市花是长在沙滩上的马鞍藤，市树是木麻黄，海边成排的木麻黄是挡风沙的屏障，也是盐工们歇脚乘凉的地方。老盐工常说：「盐是太阳和海一起做的，人只是把它收起来。」"
    en: "Zanara is the northernmost city of the Islamic Republic of Sahiliya, on the northern stretch of Ranova's west coast, covering about 17,000 km² with some 300,000 people. The town stands on the coastal plain at about 70 m, with dry hills rising to the east to a highest point of 767 m. Its grid of salt pans by the sea runs all the way to the Jabaliya border in the north. The climate is semi-arid: the mean temperature is 24.8 °C and the rainfall only about 660 mm a year, with just 2 mm a month from January to March and no more than 112 mm even in August, the wettest month. The long dry season, the fierce sun and the unceasing sea wind are exactly what salt-making needs.\nSalt-making at Zanara is as old as the Kasiri merchants of the west coast, whose dhows once carried its salt to every port on the island. After the Sundering the armed movement of Jabaliya in the northern mountains denounced the Republic as \"a state of apostates\", and the West Coast War broke out, flaring on and off for more than thirty years. Zanara, nearest the border, changed hands several times and was attacked again and again; many families fled south, some to the refugee camp south of the port of Bandari. Today the town is held by the Republic's army, with the 3rd Infantry Brigade in its barracks on the outskirts responsible for the area's defence, and the road north runs close to the border past army checkpoints.\nThe economy rests on sea salt and fishing; the primary sector makes up 35% and industry 32%, and output per head is about $4,150. The Zanara Salt Works stretch along the dry coast, where seawater is let into shallow pans to evaporate and crystallise in the blazing sun, and in the dry season the salt workers rake the grains into small white hills with wooden rakes before bagging them for the whole island. The salt works are the largest employer in the area, and many families have made salt for generations. The fishing boats go out early in the morning and return in the afternoon, and part of the catch is salted and dried on the spot. The West Coast Road runs some 180 km within the city's bounds and leads south to the capital, Sahil; the salt and the dried fish go out by lorry along it.\nZanara's city council has 27 seats, and turnout at the last election was 60.5%. The Islamic Justice Party took 44.6% and 12 seats and governs with the Coast National Party, which has 6, and the mayor, Rehema Mbarak, is from the Justice Party; the People's Labour Party, which speaks for salt workers and fishermen, took 33.0% and 9 seats and is the largest opposition party in the city, strongest among the workers of the salt works.\nEighty-three per cent of the people speak Kasiri as their mother tongue and 13% Ranovan, and the great majority are Muslim. Literacy is about 73% and life expectancy about 64 years, both below the national average, and the scars of the war are still visible. Salt workers go out to the pans before dawn and finish before the midday sun, then drink sweet clove tea at the stalls beside the mosque in the afternoon. When the new salt is harvested, the first sack goes to the mosque to be shared among poor families. On Ramadan nights every household spreads mats outside the door and brings out grilled fish and coconut rice. The city flower is the beach morning glory that grows on the sand and the city tree the casuarina, whose rows along the shore are a screen against wind and sand and a shady resting place for the salt workers. Old salt workers like to say: \"Salt is made by the sun and the sea together; people only gather it up.\""
