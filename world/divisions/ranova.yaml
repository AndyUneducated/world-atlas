  names: {zh: 努西拉, en: Nusira, art-x-kasiri: Nusira}
  notes:
    zh: "努西拉是努西拉苏丹国的首都，位于拉诺瓦岛西北外海群岛中最大的中岛上，全市面积约 1.04 万平方公里，人口约 60 万。城区沿海湾展开，海拔约 110 米，岛内的山地最高 1821 米。这里属热带季风气候，海风调和了暑热，年均气温 22.4 摄氏度，年降水约 2650 毫米，雨季在五月到十月。苏丹宫、金顶大清真寺和海上石油公司总部沿海湾排开。\n苏丹宫是苏丹哈米迪·本·努西尔三世的宫殿，由白色珊瑚石砌成，几座庭院层层相套，最内层是寝宫和王室会议厅，外层是接见厅和王室法院；宫殿不对外开放，游客只能在海湾对面的观景台拍照。宫东是协商会议大厦，40 名议员全部由苏丹任命，只能提出建议；宫北的白色长楼是皇家迪万，首相和大臣在这里向苏丹呈报政务，每周四上午迪万开放请愿窗口，臣民可以直接向苏丹递交请愿书。金顶大清真寺的礼拜大殿可容纳一万人，附设经学院和收藏古代手抄本古兰经的图书馆。努西拉国家石油公司总部是一座三十层的银色玻璃塔楼，公司由王室控制，石油收入占国家财政收入的九成，大堂里陈列着第一桶原油的样品。\n近海的油气田让苏丹国迅速致富，首都的人均生产总值约 4.09 万美元，第三产业占 71%，行政、石油炼化和金融是三大行业。海上油田的原油经海底管道送到石油港的储油罐，再装上巨型油轮运往海外，夜里炼油厂的火炬照亮整个海湾。主权财富基金把石油收入投到海外，为石油枯竭之后储备财富；政府的「后石油愿景」要在首都建设金融区。海水淡化厂用燃气发电的余热蒸馏海水，供应首都、马卡拉和达兰，苏丹国的人均用水量在全岛最高。城中还有苏丹大学、伊斯兰学院、国家博物馆和中央银行，城郊驻有皇家陆军司令部、第一步兵旅和皇家海军基地。\n外籍劳工占人口的三分之一，住在城郊的劳工城，几十座四层宿舍楼里住着来自岛上各国和海外的建筑工人、清洁工和家政工人。他们没有公民权，工作签证与雇主绑定，国际劳工组织多次批评这里的住宿条件和工作时间。公民则享有免费医疗、教育和住房补贴，不缴所得税。国内禁止政党活动，公开批评王室会被判处监禁；市政局长雷赫玛·朱马由苏丹任命，出自六个世家之一。\n居民 55% 以卡西里语为母语，24% 讲英语，另有讲拉诺瓦语和汉语的居民。金白相间的国际机场航站楼由石油收入建成，外籍劳工大多从这里入境，苏丹出访时跑道两侧铺上红地毯。开斋节时，苏丹在宫门前接受臣民祝贺，向每户家庭发放节日礼金；海湾上的传统帆船赛由工商会出资，冠军奖杯由苏丹亲手颁发，工商会那座旧商行大楼的楼顶，还保留着当年瞭望帆船的木塔。市花是茉莉花，市树是海枣。"
    en: "Nusira is the capital of the Sultanate of Nusira, on the central island, the largest of the group off Ranova's north-west coast; the city covers about 10,400 km² and has some 600,000 people. The town spreads along the bay at about 110 m, and the mountains inland rise to 1,821 m. The climate is tropical monsoon, the heat tempered by the sea wind, with a mean temperature of 22.4 °C and about 2,650 mm of rain a year, the rains falling from May to October. The Sultan's palace, the gold-domed Grand Mosque and the head office of the offshore oil company line the bay.\nThe Sultan's Palace, home of Sultan Hamidi bin Nusir III, is built of white coral stone in courtyards set one within another, the innermost holding his apartments and the royal council chamber and the outer ones the audience hall and the royal court; it is closed to the public, and visitors can only take photographs from the viewing platform across the bay. East of the palace is the Consultative Council Building, whose 40 members are all appointed by the Sultan and may only make recommendations; in a long white building north of the palace is the Royal Diwan, where the prime minister and ministers report to the Sultan, and every Thursday morning the Diwan opens a petition window where subjects may hand petitions straight to the Sultan. The prayer hall of the Golden-Domed Great Mosque holds ten thousand, with a religious school and a library of ancient manuscript Qurans attached. The Nusira National Oil Company Headquarters is a thirty-storey tower of silver glass; the company is controlled by the royal family, oil brings in nine-tenths of state revenue, and the lobby displays a sample from the first barrel of crude.\nThe offshore oil and gas fields made the sultanate rich quickly: output per head in the capital is about $40,900, services make up 71% of the economy, and government, oil refining and finance are the three main trades. Crude from the offshore fields comes ashore by subsea pipeline to the tanks of the oil port and is loaded onto supertankers for overseas, and at night the refinery flares light up the whole bay. The sovereign wealth fund invests oil money abroad to build up wealth for the day the oil runs out, and the government's \"post-oil vision\" calls for a financial district in the capital. The desalination plant distils seawater with waste heat from gas-fired power and supplies the capital, Makara and Daran, and water use per head in the sultanate is the highest on the island. The city also has the Sultan's University, the Islamic College, the National Museum and the Central Bank, and the Royal Army Headquarters, the 1st Infantry Brigade and the Royal Navy's base are on the outskirts.\nForeign workers make up a third of the population and live in the Labour City on the outskirts, where dozens of four-storey dormitories house construction workers, cleaners and domestic workers from other countries of the island and overseas. They have no citizenship and their work visas are tied to their employers, and international labour bodies have repeatedly criticised the housing and working hours there. Citizens, meanwhile, enjoy free health care, education and housing allowances and pay no income tax. Political parties are banned and public criticism of the royal family is punished with prison; the Director of the Municipality, Rehema Juma, is appointed by the Sultan and comes from one of the six great families.\nFifty-five per cent of the people speak Kasiri as their mother tongue and 24% English, with smaller numbers of Ranovan and Chinese speakers. The gold-and-white terminal of the international airport was built with oil money; most foreign workers arrive through it, red carpets line the runway when the Sultan travels abroad. At Eid al-Fitr the Sultan receives his subjects' greetings at the palace gate and gives every household a gift of money; the traditional dhow race on the bay is paid for by the Chamber of Commerce and Industry, the Sultan himself presents the winner's trophy, and the roof of the chamber's old trading house still keeps the wooden tower from which merchants once watched for sails. The city flower is the jasmine and the city tree the date palm."
