  names: {zh: 瓦托福齐, en: Vatofotsy, art-x-ranova: Vatofotsy}
  notes:
    zh: "瓦托福齐是大天使军团国南部的城市，靠近太阳神国度的边界，离海约 70 公里。名字意为「白石」，得名于城外白色的石灰岩山丘。市域约 2800 平方公里，最高处海拔 441 米，人口约 15 万。这里是干燥的沙漠气候，年均气温 25.8 ℃，年降水不到 100 毫米，十二月到次年三月几乎滴雨不下。市旗紫底上一个白色山形，山形中是两把交叉的紫色锤子，代表城外的石灰岩山丘和采石场、水泥厂；市花是马岛茉莉，市树是乌木。\n城市由城市守夜团管理。守夜长姆博拉·拉乔纳里松由队长从本城的军团元老中任命，按惯例是殉道者的父亲或兄弟；守夜团兼管城市事务和本城军团员的葬礼。和全国一样，公务员和教师必须是宣过誓的军团员，拒绝宣誓的「无誓者」不能担任公职、上公立中学或承租土地。\n采石场和水泥厂是全国少有的工业，第二产业约占 47%，人均产值约 2440 美元。瓦托福齐石灰石采石场在城西的白色山丘上，石灰石供应水泥厂，也被切成石块，用来修建首都的殉道者大殿、教堂和墓园。每个成年人每年要在「荣誉劳动」中无偿工作数周，大批劳力被派到这里，另一些来自劳动营；采石场事故频繁，死于事故的人不算作殉道者。瓦托福齐水泥厂是全国最大的工厂，由军团合作社经营，厂长须是军团元老，两座回转窑日夜冒着白烟，城里的屋顶和树叶常年蒙着一层灰白的粉尘；水泥主要用于修路和建墓园，少量经港口出口。\n城北山坡上的白石墓园埋葬着在南方战争中死去的志愿军团员，一排排白色石灰岩墓碑上刻着死者的「亡名」。每有新的灵柩从港口运来，墓园就举行一次葬礼，由国家电台直播。流亡的家属说，许多年轻人是在学校和荣誉劳动的压力下才报名参加志愿军团的。瓦托福齐第一中学是南部最大的中学，一千多名学生只来自宣过誓的家庭，每天的课从守夜祈祷开始，高年级学生每年要到采石场完成荣誉劳动，走廊墙上的光荣榜列着参加志愿军团的校友。\n约 45 公里的安博希马西—瓦托福齐公路通往首都和港口；8.4 公里的瓦托福齐南门检查站公路通往旧国道上的南门检查站，口岸大部分时间关闭，只放行持特别通行证的货车，紫衫卫队的哨兵检查每一个出境者的誓约证。驻在瓦托福齐兵营的军团步兵第二大队负责南部边境的防务，士兵们也常被派去看管采石场的劳力。\n居民九成以上说拉诺瓦语，平均预期寿命 59.3 岁，识字率约 60%。城里的墙上贴满黑框讣告，石匠的作坊从早到晚叮当作响，刻的多是墓碑。三十多年来，全国约六万人逃离，多是拒绝宣誓的年轻人；边境另一侧的太阳神国度也关着门，想走的人只能绕道去海边。"
    en: "Vatofotsy is a city in the south of the Legionary State of the Archangel, near the border of the Realm of the Sun God and about 70 km from the sea. The name means 'white stone', for the white limestone hills outside town. Its territory of some 2,800 km² rises no higher than 441 m, and it has about 150,000 people. The climate is hot desert, with a mean temperature of 25.8 °C and less than 100 mm of rain a year; from December to March hardly a drop falls. The city flag shows a white mountain on purple with two crossed purple hammers inside it, for the limestone hills and the quarries and cement works; the city flower is the Madagascar jasmine and the city tree the ebony.\nThe city is run by the City Vigil. The Warden of the Vigil, Mbola Rajaonarison, is appointed by the Captain from among the city's Legion elders and by custom is the father or brother of a martyr; the Vigil runs the town's affairs and the funerals of its legionaries. As everywhere in the country, civil servants and teachers must be sworn legionaries, and the 'unsworn' who refuse the oath may not hold public office, attend state secondary schools or lease land.\nThe quarries and cement works are almost the only industry in the country; industry accounts for about 47%, and output per head is about US$2,440. The Vatofotsy Limestone Quarry lies in the white hills west of town; its limestone feeds the cement works and is also cut into blocks for the Hall of the Martyrs in the capital, for churches and for cemeteries. Every adult must work several weeks a year unpaid in 'honour labour', and gangs of such labourers are sent here in large numbers, others coming from the labour camps; accidents are frequent, and those killed in them are not counted as martyrs. The Vatofotsy Cement Works, the largest factory in the country, is run by a Legion co-operative and its manager must be a Legion elder; its two rotary kilns pour out white smoke day and night, and the town's roofs and leaves wear a permanent film of pale dust. The cement goes mostly into roads and cemeteries, and a little is exported through the port.\nThe White Stone Cemetery on the hillside north of town holds the volunteer legionaries killed in the Southern War, their 'death-names' carved on row upon row of white limestone headstones. Each time a new coffin arrives from the port, a funeral is held and broadcast live on state radio. Exiled relatives say many young people joined the volunteer legion only under pressure from school and honour labour. Vatofotsy First Secondary School, the largest in the south, takes its thousand-plus pupils only from sworn families; each school day begins with the vigil prayer, senior pupils must do their honour labour at the quarry every year, and an honour roll in the corridor lists former pupils who joined the volunteer legion.\nThe Ambohimasy–Vatofotsy Road, about 45 km long, leads to the capital and port, and the 8.4 km Vatofotsy South Gate Checkpoint Road leads to the checkpoint on the old national road. The crossing is closed most of the time and lets through only lorries with special passes, and Violet Guard sentries check the oath card of everyone leaving. The Legion's Second Infantry Battalion, quartered in Vatofotsy Barracks, guards the southern border, and its soldiers are often sent to watch over the labourers at the quarry.\nMore than nine in ten residents speak Ranovan, life expectancy is 59.3 years and literacy about 60%. The walls of the town are covered in black-bordered death notices, and the stonemasons' workshops ring from morning to night, carving mostly headstones. Over more than thirty years some 60,000 people have fled the country, mostly young people who refused the oath; the Realm of the Sun God across the border keeps its own door shut, and those who want to leave can only make their way round to the sea."
