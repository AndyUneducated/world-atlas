- id: div_fka4hr
  subtype: locality
  parent: div_0cazhp
  status: generated
  names: {zh: 伊瓦洛, en: Ivalo, art-x-ranova: Ivalo}
  notes:
    zh: "伊瓦洛是伊瓦洛自由公社联合会的首都，也是联合会如今仅有的领土：沿海战争后，海边的法尼里被马索沃利吞并，联合会只剩下这片法拉纳断崖下部丘陵和台地上的农业公社群。全市人口约 30 万，其中约 22 万是战前的居民，约 8 万是从沿海逃来的人，散布在约 1 万平方公里的河谷和山坡上，平均海拔 641 米，最高处 1307 米；镇中心在海拔九百多米的台地上，离海约 130 公里。气候属热带季风型，年均气温 21.3 ℃，年降水约 2355 毫米，五月到十一月雨水丰沛。几十个村社轮流派代表参加联合会，土地归公社共有，收成按需分配。\n大分裂时，东海岸的码头工人和渔民占领港口和工厂，内陆的农民则自发组成村社，赶走了种植园的管事，把土地收归村有。各公社随后结成联合会，不设中央政府、不设常备军、不设警察。高原战争期间，公社收容了大量两边的逃兵和难民，宣布任何人只要放下武器都可以在公社劳动生活，伊瓦洛的不少村子至今住着当年留下的人和他们的子女。\n沿海战争中，人民民兵在海边抵抗约十天后，掩护居民沿公路撤上断崖。卡车、自行车和步行的人群走了三天三夜，带着渔网、缝纫机、药箱和成捆的报纸；村社打开粮仓，在大会堂、学校和稻作站的仓库里铺起地铺，各家各户收留了上万个沿海家庭。人民军追到断崖脚下停住，战线就冻结在伊瓦洛下方的山脚，从镇外的台地边上能望见断崖下马索沃利的哨所和铁丝网；通往海边的公路被雷区截断，沿海来的人说，海离得并不远，却再也回不去了。\n联合会代表大会如今在伊瓦洛公社大会堂开会，那是一座长方形的土砖大厅，没有主席台，只有一圈长凳；十五名沿海流亡公社代表由难民村选出，坐在原属渔民合作社的位置上。东海岸工团联合会把总部搬到了伊瓦洛，村社同盟和自由公社纲领联盟也设在这里。伊瓦洛村社是几十个村社之一，几百户人家共同耕种，收成存入公社粮仓，房屋用红土砖砌成，屋顶铺着稻草。伊瓦洛公社稻作站的试验田沿河谷排开，种着上千个水稻品种，其中一些耐旱品种已在全岛推广；从海边撤出来的护士起初在稻作站的培训厅里开了一间临时诊所，第二年诊所才搬进镇南自己的平房。伊瓦洛林业公社木材厂为全联合会锯板材和电线杆，堆木场边的棚子里，逃来的织工和造船工办起了纺织、修理和木工作坊。\n伊瓦洛原本只是内陆农业公社的集镇，战后却要容下整个联合会的机构。沿海战争后的第一次代表大会上，沿海流亡公社的代表提议把联合会的名字从海边的法尼里改为收留了大家的伊瓦洛，各公社表决通过后，这座山间小镇的名字成了国名。不少伊瓦洛人起初并不情愿，怕小镇从此成了「首都」，公社的事都往这里集中。从海边撤出来的机构在镇上重新办起：大会堂周围先后盖起了联络委员会会所、工人议会联合会会所、沿海流亡公社会堂和公社调解庭，北面是大会广场和公社自行车赛场，伊瓦洛自由学校、人民食堂、公社诊所、人民图书馆和伊瓦洛合作社集市散布在镇里；镇西的山坡上是自由公社电台和沿海流亡者新村，镇南是人民民兵会所，镇东台地的边上，断崖民兵瞭望哨日夜望着断崖下的战线。这些房子大多是村社和流亡者用土砖义务盖成的，铁皮常常不够，有的屋顶至今还漏雨。\n种植业占经济的 34%，工业和木材加工占 26%，人均产值约 2960 美元。失去港口后，伊瓦洛没有干线公路和铁路，稻米、木材和布匹要用卡车沿山路运到洛哈瓦托和安博哈拉，再换回柴油、药品和农具，运价比战前贵了好几倍。这里没有政党竞选，每座公社由全体居民参加的大会管理，召集人从居民中抽签产生，任期三个月，现任轮值召集人是蒂安娜·拉乔纳里松。成员按劳动时间领取劳动券，住房、医疗和教育免费；居民 91% 以拉诺瓦语为母语，人均预期寿命 64.8 岁，识字率 69.7%。公社的弱点也看得见：决策缓慢，农机老旧，粮食要多养活八万人，难民村和老村社之间常为坡地和水渠争执。\n村里的一天从公共食堂开始，早饭是一大锅豆饭，如今排队的人里多了不少沿海口音。插秧时节，各村按水渠的先后轮流放水，谁家的田先灌常要在大会上争上一晚。自行车是人们最主要的交通工具，公社大会日这天，几百辆自行车从各村骑向大会堂，车把上插着向日葵。市花就是向日葵，市树是面包树；市旗黑底上一个红色山形，正中一株白色幼苗，代表村社共有的土地和按需分配的收成。"
    en: "Ivalo is the capital of the Free Communes of Ivalo and now all the land the federation has left: since the Coastal War, when Faniry on the coast was annexed by Masovoly, the federation has been reduced to this cluster of farming communes on the hills and terraces of the lower Farana Escarpment. Its 300,000 people, some 220,000 of them pre-war residents and about 80,000 who fled the coast, are spread across some 10,000 km² of valleys and hillsides, with a mean elevation of 641 m and a high point of 1,307 m; the town centre is on a terrace at over 900 m, about 130 km from the sea. The climate is tropical monsoon: the mean temperature is 21.3 °C and the annual rainfall about 2,355 mm, plentiful from May to November. Dozens of villages take turns sending delegates to the federation, the land is held in common and the harvest is shared by need.\nIn the Sundering, while the dockers and fishers of the east coast occupied the harbours and factories, the farmers inland formed their own village communes, drove out the plantation stewards and took the land into village hands. The communes then joined in a federation with no central government, no standing army and no police. During the Highland War the communes took in many deserters and refugees from both sides, declaring that anyone who laid down their arms could live and work in a commune, and in many of Ivalo's villages those who stayed and their children still live.\nIn the Coastal War, after holding out on the coast for about ten days, the People's Militia covered the townspeople as they withdrew up the road onto the escarpment. Lorries, bicycles and people on foot came for three days and nights, carrying fishing nets, sewing machines, medicine chests and bundles of newspapers; the village communes opened their granaries and laid out bedding in the assembly hall, the schools and the stores of the rice station, and households took in more than ten thousand coastal families. The People's Army halted at the foot of the escarpment, and the front froze there below Ivalo: from the edge of the terraces outside town one can see Masovoly's posts and barbed wire below, the road to the sea is cut by minefields, and people from the coast say the sea is not far away, yet they can never go back.\nThe federal congress now meets in the Ivalo Commune Assembly Hall, a long earth-brick hall with no platform, only a ring of benches; the fifteen delegates of the exiled coastal communes, chosen in the refugee villages, sit where the fishers' co-operatives once sat. The East Coast Federation of Syndicates has moved its headquarters to Ivalo, and the League of Village Communes and the Platform Union of the Free Communes are based here too. The Ivalo Village Commune is one of dozens: several hundred households farm together and store the harvest in the commune granary, their houses built of red earth brick with thatched roofs. The test fields of the Ivalo Commune Rice Station line the valley with more than a thousand rice varieties, some drought-tolerant ones now grown across the island, and nurses who came up from the coast first opened a makeshift clinic in its training hall, until the Commune Clinic moved into buildings of its own south of town the following year. The Ivalo Forestry Commune Sawmill saws planks and poles for the whole federation, and in the sheds beside its log yard weavers and shipwrights who fled the coast have set up textile, repair and joinery workshops.\nIvalo was only a market town for the farming communes inland, but since the war it has had to house the institutions of the whole federation. At the first Congress after the Coastal War the delegates of the exiled coastal communes moved that the federation take its name not from Faniry on the coast but from Ivalo, which had taken everyone in, and once the communes had voted it through, the name of this hill town became the name of the country. Many people in Ivalo were reluctant at first, afraid that the town would become a 'capital' where all the communes' business gathered. The institutions that came out of the coast have started again in the town: the Liaison Committee House, the House of the Workers' Councils, the Hall of the Exiled Coastal Communes and the Commune Mediation House have gone up round the assembly hall, with Assembly Square and the Commune Velodrome to the north, and the Ivalo Free School, the People's Canteen, the Commune Clinic, the People's Library and the Ivalo Co-operative Market are scattered about the town; Free Commune Radio and the Coastal Exiles' New Village are on the hillside to the west, the People's Militia House to the south, and at the edge of the terraces east of town the Escarpment Militia Lookout watches the front below day and night. Most of these buildings were put up in earth brick by villagers and exiles as voluntary work; there is never enough corrugated iron, and some roofs still leak.\nFarming makes up 34% of the economy and industry and timber 26%, and output per head is about US$2,960. With the port gone, Ivalo has no trunk road or railway: rice, timber and cloth go by lorry over mountain roads to Lohavato and Ambohara to be traded for diesel, medicine and farm tools, at freight rates several times higher than before the war. There are no party contests: each commune is run by an assembly open to all its residents, its convener drawn by lot for three months, currently Rotating Convener Tiana Rajaonarison. Members receive labour vouchers by hours worked, and housing, health care and schooling are free; Ranova is the mother tongue of 91% of residents, life expectancy is 64.8 years and literacy 69.7%. The communes' weaknesses are plain to see: decisions are slow, the farm machinery is old, the grain must now feed eighty thousand more, and the refugee villages and the old communes often quarrel over hillside land and canals.\nThe village day begins in the common kitchen with a big pot of bean rice, and these days many in the queue speak with a coastal accent. At transplanting time the villages take turns releasing water down the canals, and whose fields are flooded first can take a whole evening to argue out at the assembly. Bicycles are the main way of getting about, and on the Day of the Assembly of Communes hundreds of them ride from the villages to the assembly hall with sunflowers tucked into the handlebars. The sunflower is the city flower and the breadfruit the city tree; the city flag has a red mountain on black with a white seedling in the middle, standing for the land the villages hold in common and the harvest shared by need."
