  names: {zh: 法尼里, en: Faniry, art-x-ranova: Faniry}
  notes:
    zh: "法尼里是东海岸的渔港和河口城镇，名字意为「愿望」，原是伊瓦洛自由公社联合会最大的城镇和公社运动的中心，在沿海战争中被马索沃利民主主义人民共和国占领并吞并，成为它的第三座城市，行政区划代码 620300，马索沃利保留了城市的名字。全市面积约 8000 平方公里，人口约 30 万；战前约有 38 万人，约 8 万人在战争中逃往内陆的伊瓦洛。城区在海拔约 90 米的河口海岸上，西面是法拉纳断崖下的丘陵，冻结的战线就沿着断崖脚下延伸。这里属热带季风气候，年均气温 24.6 摄氏度，年降水约 2960 毫米，八月最湿，达 451 毫米，二月最干。\n大分裂时，东海岸的码头工人、渔民和纺织工人拒绝接受任何一方的政府，他们占领工厂和港口，成立工人议会，法尼里由此成为自由公社的中心。三十多年里，工厂和渔船由工人议会自主管理，经理和技术员由工人选举；市中心的大会堂每周日召开全体大会，任何年满十六岁的居民都可以登记发言；几十份公社报纸和电台各说各话，码头边的公共食堂对任何人免费开放。北邻马索沃利的报纸把这一切称为「无政府主义的混乱」。\n沿海战争的导火索是一艘马索沃利渔船：船员带着家属驶进法尼里港，全体大会拒绝把他们交回。不久后的一个星期日凌晨，人民军先炮击北面海岬上的海岸瞭望哨，随后沿东海岸公路南下，并从海上登陆港区。只有轻武器的人民民兵在北郊和船厂一带抵抗了约十天。发电厂停电后，全体大会在大会堂里点着油灯开了最后一次会，决定不在街巷里打到最后一人，而是让愿意走的人撤往伊瓦洛。民兵守住通往内陆的公路，卡车、自行车和步行的人群连续走了三天三夜；诊所的护士带走了药品，图书馆的志愿者背走了最珍贵的手稿，电台的播音员拆走了一部备用发射机。这些人后来在伊瓦洛把公社的机构一一重新办了起来，联合会也在战后改以伊瓦洛为名。\n如今城市由永生宫任命的市革命委员会管理，主任米奥拉·拉乔纳里松和所有委员一样，须宣誓效忠创始领袖和他的继承人。公社留下的房子被新政权挪作他用：大会堂里的长凳被拆掉，换上了主席台和领袖画像，市革命委员会在这里召开群众大会；工人议会从前的大楼由劳动党的市委员会使用，港口旁的旧海关楼交给了国家保卫部，留下的居民都要到那里登记家庭出身。前公社代表、民兵和报纸编辑被列为「敌对成分」，许多人被送往菲拉纳的再教育农场，家里有人逃往伊瓦洛的居民受到监视；空出来的住房分给了从首都和菲拉纳迁来的家庭。全城的时钟拨慢了半个小时，与马索沃利的全国时间一致；人民军进城的那一天被定为「法尼里解放日」，每年在法尼里体育场举行群众大会。\n经济以渔业、制造业和国防工业为主，第一、第二产业分别占 27% 和 38%，人均生产总值约 1980 美元，比战前低了三分之一以上。工厂和渔船收归国营：渔船编入渔业部的国营船队，渔获按指标交给国家，法尼里国营水产罐头厂的产品调拨给军队和首都；法尼里国营造船厂改由军需工业部管理，为人民军建造巡逻艇；纺织厂改成法尼里国营被服厂，为军队缝制军装。周边的农田并入集体农庄。劳动券被中央人民银行按极低的比价兑换成沃拉，许多家庭的积蓄一夜之间几乎化为乌有。法尼里火力发电厂的电力优先供应工厂和驻军，居民区夜里常常停电。\n城郊驻着人民军和社会安全军：民兵从前的营房成了社会安全军的营地，北面海岬上的海岸瞭望哨由人民军接管，海边和断崖脚下都在挖新的坑道。东海岸公路在市境内长约 180 公里，北通首都安德里安巴，向南通往洛哈瓦托的口岸战后已经关闭；通往伊瓦洛的公路在断崖脚下被雷区和铁丝网截断，路边的村子大多空了。\n居民 90% 以拉诺瓦语为母语，识字率约 59%，平均预期寿命约 63 岁。码头边的旧公共食堂还开着，但不再免费，饭票按工作单位和家庭成分配给；自由学校迁走后，留下的校舍改成了按马索沃利统一课程上课的中学，课堂上学的是一心团结思想和历代领袖的革命历史；公社报纸全部停刊，城里只能收听马索沃利国家广播电视台的节目。老人们说，如今城里最安静的是星期日：从前这一天大会堂里争到深夜，现在只有广播喇叭在响。市花是五星花，市树是芒果树，市旗换成了马索沃利式样的红底金边，正中一只金色的锚。"
    en: "Faniry is a fishing port and estuary town on the east coast; its name means \"wish\". Once the largest town of the Free Communes of Ivalo and the heart of the commune movement, it was occupied and annexed by the Democratic People's Republic of Masovoly in the Coastal War and is now that country's third city, administrative code 620300; Masovoly kept its name. The city covers about 8,000 km² and has some 300,000 people; before the war it had about 380,000, and some 80,000 fled inland to Ivalo during the fighting. The town stands on the estuary coast at about 90 m, with the hills below the Farana Escarpment to the west, and the frozen front runs along the foot of the escarpment. The climate is tropical monsoon, with a mean temperature of 24.6 °C and about 2,960 mm of rain a year; August is the wettest month at 451 mm and February the driest.\nAt the Sundering the dockers, fishermen and textile workers of the east coast refused to accept any side's government; they occupied the factories and the port and set up workers' councils, and Faniry became the heart of the Free Communes. For more than thirty years the factories and fishing boats were run by workers' councils, with managers and technicians elected by the workers; every Sunday the assembly hall in the centre held the general assembly, where any resident of sixteen or over could sign up to speak; dozens of commune newspapers and radio stations each said their piece, and the communal canteen by the quay was open to anyone free of charge. The papers of Masovoly to the north called all this \"anarchist chaos\".\nThe spark of the Coastal War was a Masovoly fishing boat whose crew sailed into Faniry harbour with their families; the general assembly refused to hand them back. Before dawn one Sunday soon afterwards the People's Army shelled the Coastal Lookout on the headland to the north, then drove south along the East Coast Road and landed troops in the port from the sea. The People's Militia, with only small arms, held out for about ten days in the northern suburbs and round the shipyard. When the power station went dark the general assembly held its last meeting in the hall by oil lamp and decided not to fight to the last in the streets but to let all who would go withdraw to Ivalo. The militia held the road inland while lorries, bicycles and people on foot streamed up it for three days and nights; the clinic's nurses took the medicines, the library's volunteers carried off the most precious manuscripts, and the radio's broadcasters dismantled a spare transmitter and took it with them. In Ivalo they later set up the communes' institutions again one by one, and after the war the federation took Ivalo's name.\nToday the city is run by the City Revolutionary Committee appointed by the Palace of Eternity, and its director, Miora Rajaonarison, like every member, must swear loyalty to the founding leader and his heir. The new authorities have taken over the buildings the communes left behind: the benches of the assembly hall were torn out and replaced by a platform and the leaders' portraits, and the City Revolutionary Committee holds its mass meetings there; the old workers' council building is used by the Workers' Party city committee, and the old customs house by the port has gone to the Ministry of State Protection, where everyone who stayed has had to register their family background. Former commune delegates, militia members and newspaper editors were classed as \"hostile elements\" and many were sent to the re-education farm at Firana, residents with relatives in Ivalo are watched, and the empty homes were given to families moved in from the capital and Firana. Every clock in town was put back half an hour to Masovoly's national time, and the day the People's Army entered has been made \"Faniry Liberation Day\", marked each year by a mass rally in Faniry Stadium.\nThe economy rests on fishing, manufacturing and the defence industry, with the primary sector at 27% and industry at 38%, and output per head is about $1,980, more than a third below its pre-war level. Factories and boats were taken over by the state: the boats were put into the Ministry of Fisheries' state fleet and must hand in their catch against a quota, the output of the Faniry State Fish Cannery is allocated to the army and the capital, the Faniry State Shipyard has passed to the Ministry of Munitions Industry and builds patrol boats for the People's Army, and the textile mill has become the Faniry State Clothing Factory, sewing uniforms for the forces. The farmland round about has been merged into collective farms. The Central People's Bank exchanged labour vouchers for vola at a punishing rate, and many families' savings were all but wiped out overnight. The Faniry Thermal Power Station supplies the factories and the garrison first, and the residential quarters are often without power at night.\nThe People's Army and the Social Security Forces are stationed on the outskirts: the militia's old barracks now house the Social Security Forces, the Coastal Lookout on the northern headland has been taken over by the People's Army, and new tunnels are being dug by the sea and at the foot of the escarpment. The East Coast Road runs about 180 km within the city's bounds, north to the capital, Andriamba; the crossing to Lohavato in the south has been closed since the war, and the road to Ivalo is cut at the foot of the escarpment by minefields and barbed wire, the villages along it mostly empty.\nNinety per cent of the people speak Ranovan as their mother tongue; literacy is about 59% and life expectancy about 63 years. The old communal canteen by the quay is still open, but no longer free, its meal tickets rationed by workplace and family background; with the free school gone inland, its old building has become a secondary school on Masovoly's national curriculum, teaching the One-Heart Unity doctrine and the revolutionary history of the successive leaders; every commune paper has closed, and the only broadcasts in town are those of Masovoly State Radio and Television. Old people say Sunday is now the quietest day: once the assembly hall argued late into the night, and now only the loudspeakers are heard. The city flower is the pentas and the city tree the mango, and the city flag is now red with a gold border in the Masovoly style, with a gold anchor in the middle."
