  names: {zh: 雷尼, en: Reny, art-x-ranova: Reny}
  notes:
    zh: "雷尼是伊纳拉群岛邦东岛上的城镇，也是群岛邦除首府伊纳拉之外唯一的城市，名字意为「母亲」。全市人口约 14 万，辖区约 4000 平方公里，岛上丘陵低缓，平均海拔 176 米，最高处 428 米，四周被珊瑚礁和蓝色的潟湖环绕。气候属热带季风型，年均气温 26.6 ℃，年降水约 2640 毫米，二月最干，八月最湿。珍珠养殖场和肉桂园由各母系氏族经营。\n群岛的居民世代实行母系制度：家族的姓氏、土地和房屋都由母亲传给女儿，男子婚后住进妻子的家族，舅舅在外甥的教育中扮演重要角色。联合共和国解体时，群岛与中央政府签约和平分离，成为群岛邦，三十多年的战争中从未卷入战斗。雷尼的土地至今按氏族划分，每块肉桂园和每片珍珠筏都有归属的母系家族。\n雷尼珍珠养殖场位于平静的潟湖边，养殖户把珠母贝挂在浮筏下的绳子上，两三年后才能取珠，取珠由各氏族的妇女完成，最好的黑珍珠在海外拍卖行能卖出高价。雷尼肉桂园由几个母系氏族共同经营，肉桂树种在丘陵上，雨季时工人剥下树皮，卷成肉桂卷晒干，收入按氏族分配，由各氏族的女性家长管理；雷尼的肉桂以香气浓郁闻名，出口到岛上各国和海外。渔业和种植业占全市经济的 38%，人均生产总值约 11900 美元。游客必须住在氏族经营的家庭旅馆里，收入由氏族共享。雷尼中央市场是城里最大的集市，卖鱼干、热带水果、香料和布匹，星期六上午最热闹。雷尼海岸巡逻基地停着巡逻快艇和搜救船，负责沿海的缉私、渔业执法和海上搜救，风暴来临前巡逻艇会出海通知渔船回港。\n雷尼是民选城市，市议会 23 席，氏族传统党 11 席，与新岛民党（4 席）联合执政，海洋公地党 8 席；市长兰托·拉韦洛乔纳来自氏族传统党，议长是费诺·拉索洛。国家层面，终身的大母伊娜·雷尼索阿由母亲议会推选，负责土地和习惯法事务，日常政府由全体岛民选举的岛民议会和首席部长负责，男女都有选举权和被选举权。居民 90% 以拉诺瓦语为母语，识字率 97.4%，人均预期寿命 75.9 岁，家庭暴力和贫困率都很低。\n雷尼人的日子跟着潮水走：退潮时妇女们划着小船去查看珍珠筏，男人们出海打鱼，傍晚全家围着一锅潟湖鱼汤。舷外浮杆独木舟赛是全岛最热闹的比赛，各氏族的船队在潟湖里争先，岸上的姑妈和外婆们喊得最响。大母节那天，各氏族的女性家长穿上最好的衣服在海滩上相聚；满月时节，女儿们举行成年礼，母亲把传家的贝壳交到女儿手中，篝火边唱着先祖母亲们从海上来到群岛的古老歌谣。市花是依兰，市树是肉桂树，市旗正中白色圆盘里的青绿色珍珠，代表各母系氏族经营的养殖场。"
    en: "Reny is the town of the eastern island of the Commonwealth of the Inara Isles and the commonwealth's only city besides the capital, Inara; its name means \"mother\". It has about 140,000 people and some 4,000 km² of territory on an island of low hills with a mean elevation of 176 m and a high point of 428 m, ringed by coral reefs and blue lagoons. The climate is tropical monsoon: the mean temperature is 26.6 °C and the annual rainfall about 2,640 mm, driest in February and wettest in August. The pearl farms and cinnamon gardens are run by the matrilineal clans.\nThe islanders have always lived by matrilineal custom: family names, land and houses pass from mother to daughter, men move into their wives' families on marriage, and maternal uncles play a large part in bringing up their sisters' children. When the United Republic broke up the islands signed a treaty with the central government and separated peacefully as a commonwealth, and in more than thirty years of war they have never been drawn into the fighting. Reny's land is still divided among the clans, and every cinnamon garden and pearl raft belongs to a matrilineal family.\nThe Reny Pearl Farm lies beside a calm lagoon, where the farmers hang pearl oysters on ropes beneath floating rafts and take the pearls out only after two or three years; the harvesting is done by the women of the clans, the best black pearls fetch high prices at auction houses overseas. The Reny Cinnamon Garden is run jointly by several matrilineal clans: the trees grow on the hills, and in the rainy season workers strip the bark and roll it into quills to dry; the income is shared out by clan and managed by each clan's female heads, and Reny cinnamon, famous for its rich scent, is exported across the island and overseas. Fishing and farming make up 38% of the economy, and output per head is about US$11,900. Visitors must stay in family guesthouses run by the clans, which share the income. The Reny Central Market is the town's biggest, selling dried fish, tropical fruit, spices and cloth, busiest on Saturday mornings. The Reny Coastal Patrol Base keeps patrol boats and rescue craft for coastal anti-smuggling, fisheries enforcement and sea rescue, and before a storm the patrol boats go out to call the fishing boats home.\nReny elects its council. Of the 23 seats the Clan Tradition Party holds 11 and governs with the New Islanders' Party (4), while the Ocean Commons Party has 8; the mayor, Lanto Ravelojaona, belongs to the Clan Tradition Party, and the speaker is Feno Rasolo. At national level the Great Mother, Ina Renisoa, chosen for life by the Mothers' Council, oversees land and customary law, while day-to-day government lies with the Islanders' Assembly, elected by all islanders, and the Chief Minister, with women and men alike able to vote and stand. Ranova is the mother tongue of 90% of residents, literacy is 97.4%, life expectancy 75.9 years, and domestic violence and poverty are both rare.\nLife in Reny follows the tides: at low water the women paddle out to check the pearl rafts, the men go fishing, and in the evening the whole family gathers round a pot of lagoon fish soup. Outrigger canoe racing is the liveliest contest in the islands, with the clans' crews racing across the lagoon while the aunts and grandmothers shout loudest on the shore. On Great Mother's Day the female heads of the clans meet on the beach in their finest clothes; at the full moon the daughters come of age, each mother handing her daughter the family's heirloom shell, and round the bonfires people sing the old songs of the ancestral mothers who came to the islands from the sea. The city flower is the ylang-ylang and the city tree the cinnamon, and the teal pearl in the white disc at the centre of the city flag stands for the pearl farms run by the matrilineal clans."
