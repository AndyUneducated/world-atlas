# ── 大衡王朝 ──
- id: div_st5cb2
  subtype: country
  status: generated
  names: {zh: 大衡王朝, en: Great Heng Dynasty, art-x-ranova: Fanjakan'i Heng Lehibe}
  short_names: {zh: 大衡, en: Heng}
  notes: {zh: '大衡王朝位于拉诺瓦岛西南部，北邻梅纳瓦利，东接齐马罗沃，南面与大天使军团国和转轮无边法王国接壤，西临大海，面积约一万二千八百平方公里，人口约一百六十万，下设都城承天、衡河中游的稷丰、东部边境的衡源和南部丘陵的鹿鸣四府。衡河从齐马罗沃边境的丘陵发源，向西流过全境，冲积出岛上最大的水田平原之一，两岸堤坝和水渠纵横，村落掩映在竹林和榕树之间；南部丘陵种茶、烧瓷，东部山地出产铜和木材。

      很久以前，往来西海岸的商船从海外带来了经籍和典章，船上的商人和学者在衡河口定居，与当地的稻农通婚，在村中开设学塾讲授经书。代代相传，衡河平原形成了兴办书院、敬天祭祖、按经书行礼的风俗，经学和拉诺瓦的祖灵信仰交织在一起。联合共和国时期，这里是一个以稻米和书院闻名的省份。大分裂时，省政府瓦解，盗匪和豪强四起，齐马罗沃的民族社会主义运动也向西扩张。承天书院的山长庄守礼率领复礼学派的学者，联合乡绅和各村的乡兵保全了衡河平原，宣称乱世源于「礼崩乐坏」，要「复古礼以安天下」。学者们奉他为天子，改元「复礼」，建立大衡王朝。

      王朝自称承受天命，天子总揽大权，下设三省六部：中书省起草诏令，门下省审核，可以封还不妥的诏书，尚书省率吏、户、礼、兵、刑、工六部执行。官员一律由科举选拔，从县里的童试、府里的乡试到京城的会试，最后由天子在承天殿亲自主持殿试，排定进士名次；世宗在位的「绍文」年间增设女科，女子从此可以应试做官。朝廷禁止结党，只有太祖特许的复礼社可以讲学结社，它的书院山长在廷议中占有席位。每月初一，百官身着按品级分色的朝服，手持笏板在承天殿朝见天子。王朝不设议会和选举，上书批评朝廷的人可能被革职流放，主张立宪的维新会遭到取缔，领导人流亡贝洛瓦。太祖之后，世宗在位六年早逝，当今天子庄允恭即位，改元「景衡」。

      王朝奉行中立，不加入任何阵营，以「守土安民」为国策。它与北邻梅纳瓦利军政府关系冷淡，边境上常有走私和越界放牧的纠纷；齐马罗沃的「血统」学说把衡河平原的居民视为海外商人的后代、「外人」，两国的东部边界长年对峙，衡源城外收容着约三万名逃离齐马罗沃的难民。南邻大天使军团国的布道者被朝廷斥为「邪说」，鹿鸣以南的关隘长年紧闭；与转轮无边法王国的僧侣则礼尚往来。中国对王朝既不承认也不否认，两国之间只有民间的商船往来。经济以稻米为本，户部经营的常平仓在丰年收购、荒年平价出售粮食，承天的市舶司管理海外贸易，鹿鸣的青瓷和茶叶远销各国，人均收入约四千五百美元。

      每年春天，天子在承天城东的衡河边举行亲耕礼，亲手犁下第一道田垄，各府的知府也在同一天下田；冬至黎明，天子登上城南的圜丘祭天，向上天禀告一年的政事和收成。殿试放榜那天，新科进士骑马游街，全城的人涌上街头争看。衡人常说「家有读书声，国有太平年」，但流亡海外的维新派说，这太平是用封住的嘴换来的。', en: "The Great Heng Dynasty lies in south-western Ranova, with Menavaly to the north, Tsimarovo to the east, the Legionary State of the Archangel and the Kingdom of the Boundless Dharma Wheel to the south and the sea to the west. It covers some 12,800 km² with about 1.6 million people in four prefectures: the capital, Chengtian, Jifeng on the middle Heng, Hengyuan on the eastern border and Luming in the southern hills. The Heng River rises in the hills on the Tsimarovo border and flows west across the whole country, laying down one of the largest paddy plains on the island; dikes and canals criss-cross its banks and the villages hide among bamboo and banyans, while the southern hills grow tea and fire porcelain and the eastern uplands yield copper and timber. \nLong ago merchant ships plying the west coast brought classics and books of rites from overseas; merchants and scholars on board settled at the mouth of the Heng, married into the rice-farming villages and opened schools to teach the classics. Over the generations the Heng plain grew a way of life of academies, of reverence for Heaven and the ancestors and of rites performed by the book, with classical learning woven together with Ranova's ancestral faith. Under the United Republic it was a province known for its rice and its academies. In the Sundering the provincial government collapsed, bandits and strongmen rose on every side, and Tsimarovo's National Socialist Movement pushed west. Zhuang Shouli, master of the Chengtian Academy, led the scholars of the Restoration of Rites school, joined by the gentry and the village militias, and held the Heng plain together, declaring that the chaos came of 'rites collapsed and music ruined' and that 'the old rites must be restored to bring peace under Heaven'. The scholars acclaimed him Son of Heaven; he named his era Fuli, 'restoring the rites', and founded the Great Heng Dynasty. \nThe dynasty holds that it rules by the Mandate of Heaven. The Emperor holds all power, exercised through the Three Departments and Six Ministries: the Secretariat drafts edicts, the Chancellery reviews them and may send back any it finds wanting, and the Department of State Affairs carries them out through the six ministries of Personnel, Revenue, Rites, War, Justice and Works. Every official is chosen by the imperial examinations, from the county examination and the prefectural examination to the metropolitan examination in the capital and, last, the palace examination, which the Emperor sets himself in the Hall of Receiving Heaven to rank the new jinshi graduates; in the Shaowen era the Emperor Shizong added an examination for women, who have been able to sit it and hold office ever since. Factions are forbidden at court, and only the Society for the Restoration of Rites, chartered by the founder, may gather to teach; the masters of its academies sit in the Court Council. On the first day of every month the officials, in court robes coloured by rank and holding their tablets, attend the Emperor in the Hall of Receiving Heaven. There is no parliament and no election; those who memorialise against the court may be dismissed and banished, and the constitutionalist Reform Society is banned, its leaders in exile in Belova. After the founder, Taizu, Shizong reigned only six years before his early death, and the present Emperor, Zhuang Yungong, came to the throne and named his era Jingheng. \nThe dynasty is neutral, belongs to no bloc and governs by the maxim 'guard the land, keep the people at peace'. Relations with the junta in Menavaly to the north are cool, with smuggling and herds grazing across the border a constant source of quarrels; Tsimarovo's doctrine of lineage brands the people of the Heng plain as descendants of foreign merchants and 'outsiders', the two have faced each other across the eastern border for decades, and some 30,000 refugees from Tsimarovo live outside Hengyuan. The court condemns the preachers of the Legionary State of the Archangel to the south as 'heresy', and the passes south of Luming have long been shut, while monks of the Kingdom of the Boundless Dharma Wheel come and go with due courtesy. China neither recognises nor denies the dynasty, and the only traffic between them is private merchant shipping. The economy rests on rice: the ever-normal granaries of the Ministry of Revenue buy in good years and sell at fair prices in bad ones, the Maritime Trade Office in Chengtian oversees trade abroad, Luming's celadon and tea sell across the island and overseas, and income is about 4,500 dollars a head. \nEvery spring the Emperor holds the rite of ploughing by the Heng east of Chengtian and turns the first furrow with his own hands, and the prefects go into the fields on the same day; at dawn on the winter solstice he climbs the Round Altar south of the city to sacrifice to Heaven and report the year's government and harvest. On the day the palace examination results are posted the new graduates ride through the streets and the whole city turns out to see them. The people of Heng say 'a house with the sound of reading, a realm with years of peace', though the reformers in exile say the peace has been bought with sealed lips."}
