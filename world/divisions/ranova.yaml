  notes: {zh: '洛哈瓦托王国位于拉诺瓦岛东海岸中部，在法尼里公社和黎明千年国之间，面积约二万平方公里，人口约四十五万，有都城洛哈瓦托和东海岸的港口桑博两座城市。国名意为「石头之首」，指都城背后法拉纳断崖上那块突出的巨石。国土从断崖下的山丘一直延伸到海岸，山谷中是茶园和梯田，雨林覆盖着断崖的东坡。

      王国的佛教传统可以追溯到很久以前从海上来的僧侣，他们在断崖下建立了第一座寺院，周围的部族首领皈依佛教，后来形成了洛哈瓦托王室。联合共和国时期，王室只保留礼仪地位；大分裂时，国王拒绝加入任何一方，在僧团和山区部族的支持下宣布恢复王国。此后国王主动推行改革，颁布宪法，设立王国议会，议员一半民选、一部分由国王任命、一部分由僧团推选，首相由议会多数推举、国王任命。国王仍保留解散议会、任命法官和指挥军队的权力。

      王国以「国民幸福」为施政目标，限制大规模开发和旅游人数，保护森林和寺院传统，男孩常在寺院中度过一段少年时光。王国在宗教问题上宽容，基督教和祖灵信仰的社区可以自由礼拜，但对黎明千年国的扩张和马索沃利的无神论宣传十分警惕。

      洛哈瓦托是圣约同盟的成员，名义上是信仰阵营中唯一的佛教国家，依靠同盟的保护维持中立和平。经济以茶叶、稻米、手工艺品和高端文化旅游为主，人均收入约四千美元。每年雨季结束时，王国举行法轮节，国王和僧团沿着转经道绕都城一周，全国的人都会来到洛哈瓦托，在寺院前点燃成千上万盏酥油灯。', en: "The Kingdom of Lohavato lies in the middle of Ranova's east coast between the Faniry communes and the Millennial Realm of the Dawn, some 20,000 km² with about 450,000 people in two cities, the royal capital, Lohavato, and the port of Sambo on the east coast. The name means 'head of stone', for the great rock jutting from the Farana Escarpment behind the capital. The country runs from the hills below the escarpment to the coast, with tea gardens and terraces in the valleys and rainforest on the eastern face of the cliffs. \nThe kingdom's Buddhist tradition goes back to monks who came by sea long ago and built the first monastery below the escarpment; the chiefs around it converted, and in time became the royal house of Lohavato. Under the United Republic the crown kept only a ceremonial role; in the Sundering the king refused to join any side and, backed by the monastic order and the hill peoples, proclaimed the kingdom restored. He then carried out reforms of his own accord, granting a constitution and a Royal Assembly in which half the members are elected, some appointed by the King and some chosen by the monastic order; the prime minister is put forward by the assembly majority and appointed by the King, who keeps the power to dissolve the assembly, appoint judges and command the army. \nThe kingdom governs for 'national happiness', limiting large developments and visitor numbers and protecting the forests and monastic tradition, and boys often spend part of their youth in a monastery. It is tolerant in matters of religion, Christian and ancestral communities worship freely, but it is wary of the Millennial Realm's expansion and Masovoly's atheist propaganda. \nLohavato is a member of the Covenant League, nominally the only Buddhist state in the bloc of faith, and relies on the League's protection to keep a neutral peace. Its economy rests on tea, rice, handicrafts and high-end cultural tourism, and income is about 4,000 dollars a head. At the end of the rains every year the kingdom holds the Festival of the Wheel: the King and the monks walk the circuit round the capital, and people from all over the country come to Lohavato to light thousands of butter lamps before the monasteries."}
