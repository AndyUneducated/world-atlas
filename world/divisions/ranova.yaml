    zh: "阿拉齐纳是阿拉齐纳原住民邦联的议事中心，坐落在拉诺瓦岛最南部安多希山脚下的草原上，邦联下设的四个城镇之一。全市面积约 1.6 万平方公里，人口约 42 万。城区海拔约 380 米，北面的山地最高 1961 米。这里属热带草原气候，年均气温 24.5 摄氏度，年降水约 930 毫米，一月到三月几乎无雨，雨季的七八月草原才重新转绿。国名意为「南方的草原」，猴面包树遍布四野。\n九个氏族在岛上生活的历史比任何国家都久远。大分裂后，他们在阿拉齐纳的篝火旁订立盟约，宣布成立邦联。九个氏族的长老在城中央的圆形议事场轮流主持会议：那是一座没有墙的圆形大棚，九根粗大的硬木柱代表九个氏族，九十名代表按氏族围坐，以协商一致作出决定，讨论可以持续好几天，直到没有人反对为止；会议开始前长老们先在场中央献上一头瘤牛。场中长明的篝火就是城旗上的那团白色火焰。议事场东侧是大长老之家，轮值大长老法拉·曼加西在任期内住在这里；旁边的长屋是习惯法庭，纠纷通常以赔偿瘤牛了结，双方在长老面前共饮一碗米酒以示和解。城里的事务由各氏族推举的长老共同管理，不举行政党选举，召集人由长老们轮流担任，现任召集人是陈远航。\n邦联成立后不久，齐马罗沃发动南方战争，攻入邦联的牧区，邦联失去了约三分之一的土地。城外有大片难民营，收容南方战争中被逐出家园的原住民家庭，合计约 16 万人，其中阿拉齐纳难民营约 5 万人，按难民原来的村庄划分街区，各由自己的长老管理，学校用原住民语言和拉诺瓦语双语教学。许多难民仍保存着原来土地的地契和祖坟的位置，国际法院正在审理相关的诉讼。流离者委员会代表营地居民，口号是「回家的路不能谈掉」。\n经济以瘤牛放牧、种植业和国际援助为主，第一产业占 49%，人均生产总值只有约 1240 美元，是全岛最贫困的地方之一，但贫富差距很小。阿拉齐纳公路在市境内约 138 公里，南方战争期间成千上万的难民沿这条路逃来，路边至今立着为途中死去的人竖起的石堆，如今援助组织的白色卡车每天往返于法里港和难民营之间；另一条约 146 公里的公路通往曼加。\n居民 93% 以拉诺瓦语为母语，40% 的人不满 15 岁，识字率约 42%。城北山坡上的九氏族王陵按氏族排列，墓前的木柱刻着瘤牛、船和祖先的形象。每年雨季开始时，九个氏族的牧人赶着牛群汇聚到阿拉齐纳，举行祭祖仪式和赛牛会，瘤牛摔跤引来全城围观，炭烤山药的香味飘满街头；流离者委员会也在营地中央点起篝火，为回不了祖坟的家庭祭拜。市花是马达加斯加茉莉，市树是猴面包树。"
    en: "Alatsina is the meeting place of the Alatsina Indigenous Confederacy, on the grassland at the foot of the Andohy Range in the far south of Ranova, and one of the Confederacy's four towns. The city covers about 16,000 km² and has some 420,000 people. The town stands at about 380 m, with hills to the north rising to 1,961 m. The climate is tropical savanna, with a mean temperature of 24.5 °C and about 930 mm of rain a year; there is almost no rain from January to March, and only in the rains of July and August does the grassland turn green again. The country's name means \"grassland of the south\", and baobabs stand everywhere.\nThe nine clans have lived on the island longer than any state. After the Sundering they made a covenant by the fire at Alatsina and founded the Confederacy. The elders of the nine clans take turns presiding in the round council ground at the centre of town: a great round shelter without walls, where nine thick hardwood posts stand for the nine clans and ninety delegates sit by clan, deciding by consensus in debates that can last days until no one objects; before each meeting the elders offer a zebu in the middle of the ground. The fire that burns there day and night is the white flame on the city flag. East of the council ground is the House of the Paramount Elder, where the Rotating Great Elder, Fara Mangasy, lives during the term; in the longhouse beside it the Customary Court settles disputes, usually with compensation in zebu, and the two parties share a bowl of rice wine before the elders as a sign of peace. The town is run together by elders chosen by its clans, with no party elections and the elders taking turns as convener; the present convener is Chen Yuanhang.\nSoon after the Confederacy was founded, Tsimarovo launched the Southern War and invaded its grazing lands, and the Confederacy lost about a third of its territory. Outside town are large camps for indigenous families driven from their land in the Southern War, some 160,000 people in all, about 50,000 of them in the Alatsina Refugee Camp, which is laid out in quarters by the refugees' home villages, each run by its own elders, with schools teaching in the indigenous language and Ranovan. Many refugees still keep the deeds to their land and know where their ancestors' graves lie, and an international court is hearing a case over it. The Committee of the Displaced speaks for the camp residents under the slogan \"the road home cannot be bargained away\".\nThe economy rests on zebu herding, farming and international aid; the primary sector makes up 49%, and output per head is only about $1,240, among the poorest places on the island, though the gap between rich and poor is small. The Alatsina Road runs about 138 km within the city's bounds; in the Southern War thousands upon thousands of refugees fled here along it, and cairns raised for those who died on the way still stand beside it, while today the white lorries of the aid agencies run along it every day between the port of Fary and the camps. Another road, about 146 km long, leads to Manga.\nNinety-three per cent of the people speak Ranovan as their mother tongue; 40% are under 15 and literacy is about 42%. On the hillside north of town, the stone tombs of the Tombs of the Nine Clans stand in rows by clan, with carved wooden posts showing zebu, boats and ancestors before them. Each year when the rains begin, herdsmen of the nine clans drive their cattle to Alatsina for the ancestral rites and the cattle fair; zebu wrestling draws the whole town, and the smell of charcoal-roasted yams fills the streets, while the Committee of the Displaced lights a fire in the middle of the camp for the families who cannot reach their ancestors' graves. The city flower is the Madagascar jasmine and the city tree the baobab."
