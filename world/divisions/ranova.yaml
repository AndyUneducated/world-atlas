- id: div_g843pd
  subtype: locality
  parent: div_st5cb2
  status: generated
  names: {zh: 稷丰, en: Jifeng}
  notes:
    zh: "稷丰是大衡王朝衡河中游的府城，也是王朝四府之一。全府人口约 45 万，辖区约 4200 平方公里；衡河冲积出的平原地势低平，平均海拔 222 米。气候属热带草原型，年均气温 25.2 ℃，年降水约 825 毫米，雨水集中在五月到十月，靠纵横的水渠引衡河水灌溉。四周是一望无际的水田，常平仓和米市是全国粮价的风向标；城北不远就是梅纳瓦利边境，牧人赶着瘤牛越界放牧的纠纷时有发生。\n联合共和国时期，衡河平原是以稻米和书院闻名的省份。大分裂时盗匪四起，承天书院的山长庄守礼联合乡绅和各村乡兵保全了平原，学者们奉他为天子，建立大衡王朝，稷丰从此成为王朝的粮仓。稷丰万顷田一年收两季稻米，田埂上种着桑树和木瓜，各村按次序轮流用水，水闸由乡里推举的渠长看管。稷丰常平仓是王朝最大的官仓，几十座砖砌粮仓沿衡河码头排开，储存着全国一年所需的储备粮，丰年户部平价收购，荒年平价出售，以免谷贱伤农、谷贵伤民；仓官归户部管辖，每年秋天御史前来盘查，前些年查出的贪污案就发生在这里。\n每天清晨，满载稻谷的船只沿衡河驶到稷丰米市卸货过斗，这里是全国最大的稻米市场，当天的价格由驿马传到都城承天，户部据此决定常平仓的买卖，市场边的茶楼里，一壶茶的工夫就能定下几百石米的买卖。稷丰官酿坊用糯米酿造黄酒，院子里排满泥封的陶瓮，陈酿三年以上的才送进宫中供祭祀和宴会。农业占全府经济的 20%，粮食和水产加工、仓储物流占了大头，人均产值约 3980 美元。往来都城的承天—稷丰公路长约 105 公里。\n府衙是稷丰的官署，知府菲·拉索洛由吏部从进士中铨选、天子任命，三年一任，按回避之制不得在本籍做官；府衙下设县衙，乡里事务由里老协助管理。王朝不设议会和选举，上书批评朝廷的人可能被革职流放。城南荒原上的稷丰校场是府兵每年集训的地方，秋收后各村府兵来练一个月再回家耕种，校场边的点将台是太祖当年检阅乡兵之处。北境巡检司的巡检兵沿边界巡逻，查缉走私的牛群、燃料和武器，调解越界放牧的纠纷，与对面梅纳瓦利的哨所有过多次对峙。\n居民 68% 以汉语为母语，29% 说拉诺瓦语，敬天祭祖和祖灵信仰交织在一起，人均预期寿命 66.8 岁，识字率 81.3%。每年春天亲耕节，天子在承天城东犁下第一道田垄，稷丰的知府也在同一天下田；冬至前后是官酿坊的旺季，空气里满是蒸米和酒曲的香味。秋收之后，田里随处是晾晒稻谷的竹席和啄食谷粒的白鹭，村里的孩子在打谷场上踢蹴鞠，家家蒸荷叶饭。市花是稻花，市树是樟树，市旗上的河是衡河，石青色的稻穗是稷丰两季的收成。"
    en: "Jifeng is the prefectural city of the middle Heng and one of the four prefectures of the Great Heng Dynasty. The prefecture has about 450,000 people and some 4,200 km² of territory, on the low alluvial plain of the Heng with a mean elevation of 222 m. The climate is tropical savanna: the mean temperature is 25.2 °C and the annual rainfall about 825 mm, falling mostly from May to October, and the fields are watered from the Heng through a web of canals. It is ringed by endless paddy fields, and its ever-normal granary and rice market set the price of grain for the whole country; the Menavaly border is not far north of town, and quarrels over herders driving zebu across it are frequent.\nUnder the United Republic the Heng plain was a province known for its rice and its academies. When bandits rose in the Sundering, Zhuang Shouli, head of the Chengtian Academy, held the plain together with the gentry and village militias; the scholars made him Emperor and founded the Great Heng Dynasty, and Jifeng has been its granary ever since. The Jifeng Paddies yield two rice crops a year, with mulberry and papaya planted on the bunds; the villages take turns drawing water, and the sluices are kept by canal wardens chosen by the villages. The Jifeng Ever-Normal Granary is the dynasty's largest official granary, dozens of tall brick stores along the Heng quays holding a year's reserve of grain for the whole country: the Ministry of Revenue buys at a fair price in good years and sells at a fair price in bad ones, so that cheap grain does not ruin the farmer nor dear grain the townsman. Its officials answer to the Ministry of Revenue and a censor audits it every autumn; the embezzlement case uncovered a few years ago happened here.\nEvery morning boats laden with paddy come down the Heng to unload and be measured at the Jifeng Rice Market, the largest rice market in the country; each day's prices go by post horse to the capital, Chengtian, where the Ministry of Revenue decides the granary's buying and selling, and in the tea houses beside the market a deal for hundreds of shi of rice can be struck over a single pot of tea. The Jifeng Official Brewery makes yellow wine from local glutinous rice, its courtyard lined with clay-sealed jars, and only wine aged three years or more goes to the palace for sacrifices and banquets. Farming makes up 20% of the prefecture's economy, with food and fish processing and warehousing making up the bulk, and output per head is about US$3,980. The Chengtian–Jifeng Road to the capital is about 105 km long.\nThe Prefectural Yamen governs Jifeng. The prefect, Fy Rasolo, was chosen by the Ministry of Personnel from the jinshi graduates and appointed by the Emperor for three years, and by the rule of avoidance may never serve in his or her home prefecture; under the yamen are county yamens, and village elders help run the villages. The dynasty has no parliament or elections, and those who submit memorials criticising the court may be dismissed and exiled. The Jifeng Drill Ground on the heath south of the city is where the prefectural soldiers train each year, coming from the villages for a month after the harvest before going home to plant, and the reviewing platform beside it is where the Founding Emperor reviewed the village militias. Soldiers of the Northern Border Patrol Post patrol the border, seizing smuggled cattle, fuel and weapons and settling grazing disputes, and have faced off several times with the Menavaly post opposite.\nChinese is the mother tongue of 68% of residents and Ranova of 29%; reverence for Heaven and the ancestors is interwoven with the ancestral religion, life expectancy is 66.8 years and literacy 81.3%. On the Day of the Imperial Ploughing each spring the Emperor ploughs the first furrow east of Chengtian and the prefect of Jifeng goes into the fields on the same day; around the winter solstice the brewery is at its busiest and the air is full of the smell of steamed rice and yeast. After the harvest the fields are spread with bamboo mats of drying grain and white egrets picking at the spilt rice, village children play cuju on the threshing floors and every household steams rice in lotus leaves. The city flower is the rice blossom and the city tree the camphor, and on the city flag the river is the Heng and the azurite ear of rice Jifeng's two harvests."
