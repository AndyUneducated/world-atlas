  names: {zh: 安德里纳, en: Andrina, art-x-ranova: Andrina}
  notes:
    zh: "安德里纳是安博哈拉基督教联邦高原南部的放牧城市，市域约 4.5 万平方公里，从海拔九百多米的草原延伸到 2393 米的山地，人口约 42 万，地广人稀，每平方公里不到 10 人。这里属亚热带湿润的高原气候，年均气温 20.2 ℃，年降水约 2530 毫米，旱季的夜里可冷到 11 ℃ 上下。市旗褐色旗面镶蓝边，正中一枚浅蓝色宝石，褐色是瘤牛随季节迁徙的高原草场，宝石是南部山谷出产的蓝宝石；市花是马缨丹，市树是金合欢。\n这里与齐马罗沃接壤，边境上筑有一道碉堡线。联邦陆军第三步兵旅驻在安德里纳兵营，第二装甲旅驻在安德里纳装甲兵营，是联邦地面力量的主力，坦克库房和维修车间占了营区大半，履带在路上压出深深的车辙，实弹演习的炮声几十公里外都能听见。安德里纳无人机基地的无人机沿边境和海岸线日夜巡逻，图像实时传回地下的控制室，近年在边境冲突中作用越来越大，基地也不断扩建；14.6 公里的安德里纳无人机基地公路通往基地。\n经济以瘤牛放牧、种植业和宝石开采为主，第一产业约占 43%，人均产值约 6610 美元。牛群在草原上随季节迁徙，瘤牛是财富和聘礼的象征，一头健壮的公牛可以抵上一个农民半年的收入。周一的安德里纳瘤牛市场是全岛最大的牲口集市，几千头瘤牛从周边草原赶来，买卖双方围着牛群讨价还价，成交时互相拍手为定。南部山谷冲积层中的安德里纳蓝宝石矿，大公司的露天矿坑与成百上千个手工淘宝人的小坑并存，矿镇里挤满了淘宝人，宝石交易所的窗口后坐着用放大镜验货的外国买家。\n联邦干线经过安德里纳，北上穿过首都安博哈拉通往西北的瓦凡博，东南下到海边的安帕尼；香草公路从西海岸的贝洛瓦经安博维的香草产区上到安德里纳高原，在这里与联邦干线相接。\n市议会 29 席，最近一次投票率 67.9%。家园党得票 51.7%、拿下 16 席，单独执政；高原农民党 8 席，基督教人民党 5 席，联邦自由党得票 4.9%，没有议席。市长尼里娜·拉乔纳里松属家园党，以 50.6% 对 49.4% 险胜高原农民党的对手。农民党党首埃里·兰德里亚就是安德里纳的稻农，种着祖传的几公顷梯田，至今仍在插秧季节回乡下田。\n居民九成说拉诺瓦语，平均预期寿命 65.8 岁，识字率约 83%。星期一天不亮，牧人就赶着牛群进城，集市边的小摊卖烤瘤牛肉串和米饭；星期日全城停业，礼拜后是全家的午宴。许多牧民家的儿子在装甲旅当兵，入伍那天家属们在营门外送别，营门外的小店做的都是士兵的生意。"
    en: "Andrina is a herding city in the southern highlands of the Christian Federation of Ambohara. Its territory of some 45,000 km² stretches from grasslands at over 900 m to mountains of 2,393 m and has about 420,000 people, fewer than 10 per km². The climate is humid subtropical highland, with a mean temperature of 20.2 °C and some 2,530 mm of rain a year, and dry-season nights can fall to around 11 °C. The city flag is brown with a blue border and a pale blue gem in the centre: the brown is the highland pasture across which the zebu move with the seasons, the gem the sapphires of the southern valleys. The city flower is the lantana and the city tree the acacia.\nThe city borders Tsimarovo, and a line of bunkers runs along the frontier. The federal army's Third Infantry Brigade is quartered in Andrina Barracks and its Second Armoured Brigade, the backbone of the federation's land forces, in Andrina Armoured Barracks, where tank sheds and repair shops take up most of the site, tracks have cut deep ruts in the roads, and the guns of live-fire exercises can be heard tens of kilometres away. Drones from Andrina Drone Base patrol the border and coastline day and night, sending images in real time to an underground control room; their role in border clashes has grown in recent years, and the base keeps expanding. The 14.6 km Andrina Drone Base Road leads to it.\nThe economy rests on zebu herding, farming and gem mining; the primary sector accounts for about 43%, and output per head is about US$6,610. The herds move across the grasslands with the seasons; zebu are a sign of wealth and a bride price, and a strong bull is worth half a year of a farmer's income. The Monday Andrina Zebu Market is the largest livestock fair on the island: thousands of zebu are driven in from the surrounding grasslands, buyers and sellers bargain around the herds, and they clap hands to seal a deal. At the Andrina Sapphire Mine in the alluvial beds of the southern valleys, big companies' open pits sit beside hundreds upon hundreds of hand diggers' holes; the mining towns are full of prospectors, and foreign buyers sit behind the windows of the gem-trading houses inspecting stones through loupes.\nThe Federal Trunk Road passes through Andrina, north through the capital, Ambohara, to Vavambo in the north-west and south-east down to Ampany on the coast; the Vanilla Road climbs from Belova on the west coast through the vanilla country of Ambovy onto the Andrina Highlands and meets the trunk road here.\nThe City Council has 29 seats; turnout at the last election was 67.9%. The Homeland Party won 51.7% and 16 seats and governs alone; the Highland Farmers' Party has 8 seats and the Christian People's Party 5, while the Federal Liberal Party, with 4.9%, won none. The mayor, Nirina Rajaonarison of the Homeland Party, scraped home against the Farmers' Party candidate by 50.6% to 49.4%. The Farmers' Party's leader, Eri Randria, is himself an Andrina rice farmer who works a few hectares of ancestral terraces and still comes home at planting time to work in the fields.\nNine in ten residents speak Ranovan, life expectancy is 65.8 years and literacy about 83%. Before dawn on Mondays herders drive their cattle into town, and stalls by the market sell grilled zebu skewers and rice; on Sundays the whole city shuts and families gather for lunch after church. Many herding families have sons in the armoured brigade, families see them off at the barracks gate on the day they join up, and the little shops outside the gate live off the soldiers' trade."
