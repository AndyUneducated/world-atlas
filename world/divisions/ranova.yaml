# ── 贾巴利亚伊斯兰酋长国 ──
- id: div_5b4193
  subtype: country
  status: generated
  names: {zh: 贾巴利亚伊斯兰酋长国, en: Islamic Emirate of Jabaliya, art-x-kasiri: Imarati ya Kiislamu ya Jabaliya}
  short_names: {zh: 贾巴利亚, en: Jabaliya}
  notes:
    zh: "贾巴利亚伊斯兰酋长国是一个由极端武装组织在拉诺瓦岛西北部贾巴勒丘陵建立的自封政权，没有获得任何国家承认，被各阵营和国际组织列为恐怖组织控制区。控制区面积约四万二千平方公里，人口约七十万，主要城镇是山谷中的贾巴勒和西北海岸的小港马尔萨，港外的小岛是其训练营地。这里干燥多山，丘陵海拔一千多米，山谷中有小块农田和牧场。\n联合共和国时期，西北山区是全岛最贫困、最闭塞的地方。大分裂后的混乱中，一批在海外接受极端思想训练的武装人员回到山区，利用部落之间的矛盾和对沿海富裕城市的不满扩张势力，宣布建立「酋长国」，并把萨希利亚伊斯兰共和国斥为背教政权。西岸战争由此爆发，武装分子多次袭击萨希利亚北部城镇、公路和港口，也曾在安博哈拉和努西拉制造爆炸事件。\n控制区内实行极端严苛的统治：禁止音乐、电视和照相，女孩小学之后不得上学，女性出行必须由男性亲属陪同，公开处罚屡见不鲜。舒拉会议名义上由宗教人士、部落长老和武装指挥官组成，实际权力掌握在自称埃米尔的指挥官手中。三十多年来，十四万多名居民逃离山区，在萨希利亚和邻国的难民营中生活。\n组织的头目以化名「阿布·萨利姆」自称埃米尔，真实身份不详。舒拉会议 40 席中，25 席由属于坚山运动的宗教人士占据，武装指挥官 5 席，部落长老 10 席，不经任何选举。所谓的军事、劝善惩恶、财务、宣传和外事「委员会」，实为武装组织的各个部门；财务委员会在山口设卡，向过往车辆和农户强征「天课」和通行费。教法法庭由组织任命的宗教人士组成，判决不经上诉即执行，联合国和人权组织记录了大量即决处决、肉刑和对妇女的强迫婚姻，萨希利亚的宗教学者委员会宣布这些判决在教法上无效。贾巴利亚圣战者约有六千名武装人员，装备轻武器、迫击炮、简易爆炸装置和走私快艇，在村庄里招募和强征男性，人权组织记录到其中有未成年人；劝善惩恶队则在街头监视居民的衣着和言行。控制区的人均预期寿命只有 57.3 岁，识字率 38.5%，仍有家庭冒着风险把女儿送出山外读书。\n控制区的经济依赖走私燃料、武器和违禁品，向过往车辆收取过路费，以及海外极端网络的资金。萨希利亚、安博哈拉和努西拉的军队多次清剿，但山区地形复杂，武装组织屡剿不灭。近年部分部落长老与萨希利亚政府秘密谈判，希望以特赦和发展援助换取武装人员放下武器，谈判时断时续。"
    en: "The Islamic Emirate of Jabaliya is a self-proclaimed regime set up by an extremist armed group in the Jabal Hills of north-western Ranova. No state recognises it, and every bloc and international body lists it as an area held by a terrorist organisation. It holds some 42,000 km² with about 700,000 people; the main towns are Jabal in a valley of the hills and the small north-western port of Marsa, whose offshore islet is a training camp. The country is dry and hilly, the hills reaching over 1,000 m, with small fields and pastures in the valleys. \nUnder the United Republic the north-western hills were the poorest and most isolated part of the island. In the chaos after the Sundering a group of fighters trained in extremist ideas abroad returned to the hills, exploited quarrels between tribes and resentment of the rich coastal towns to spread their power, proclaimed an 'emirate' and denounced the Islamic Republic of Sahiliya as apostate. So began the West Coast War: the militants have attacked towns, roads and ports in northern Sahiliya many times and have carried out bombings in Ambohara and Nusira. \nRule in the area is extremely harsh: music, television and photography are banned, girls may not attend school after primary level, women must travel with a male relative and public punishments are frequent. The shura nominally brings together clerics, tribal elders and militia commanders, but real power lies with the commander who calls himself emir. Over thirty years more than 140,000 people have fled the hills to live in camps in Sahiliya and neighbouring states. \nThe group's leader calls himself emir under the nom de guerre Abu Salimu, and his real identity is unknown. Of the 40 seats in the shura, 25 are held by clerics of the Steadfast Mountain Movement, 5 by militia commanders and 10 by tribal elders, with no election of any kind. The so-called commissions, military, virtue, finance, propaganda and external affairs, are in fact departments of the armed group; the Finance Commission sets up checkpoints in the mountain passes and extorts \"alms\" and tolls from passing vehicles and farmers. The sharia courts are made up of clerics appointed by the group and their sentences are carried out without appeal; the United Nations and human rights groups have documented many summary executions, corporal punishments and forced marriages of women, and Sahiliya's council of religious scholars has declared these judgements void in religious law. The Jabaliya Mujahideen number about 6,000 fighters with small arms, mortars, improvised explosive devices and smuggling boats, and they recruit and press-gang men in the villages, minors among them according to human rights groups, while the Hisbah Religious Police watch residents' dress and speech in the streets. Life expectancy in the zone is only 57.3 years and literacy 38.5%, and some families still risk sending their daughters out of the hills to study.\nThe area lives on smuggled fuel, arms and contraband, tolls on passing vehicles and money from extremist networks abroad. The armies of Sahiliya, Ambohara and Nusira have mounted repeated offensives, but the hills are difficult and the group has never been rooted out. In recent years some tribal elders have negotiated in secret with Sahiliya's government in the hope of trading amnesty and development aid for disarmament, talks that start and stall by turns."
