  names: {zh: 贝拉纳, en: Belana, art-x-ranova: Belana}
  notes:
    zh: "贝拉纳是齐马罗沃民族社会主义帝国南部海岸的城市，西南与卡波拉新秩序自由领接壤。全市人口约 32 万，辖区约 1.9 万平方公里，从海边的盐田一直延伸到内陆的多刺灌木林和红土台地，平均海拔 216 米，最高处 1339 米。这里是全岛最干燥的地方之一，属热带沙漠气候，年均气温 25.8 ℃，年降水只有约 368 毫米，一月到三月几乎滴雨不下。盐田和剑麻种植园沿着干燥的海岸展开，与卡波拉之间的边界是全岛戒备最森严的边界之一。\n贝拉纳的边界紧张来自同一意识形态的两个政权之间的敌意：卡波拉的新秩序运动讥讽齐马罗沃是「穿制服的官僚」，齐马罗沃则把运动视为危险的冒险者。卡波拉边境冲突期间，齐马罗沃军队沿领道 S-RA-110 西南公路从这里向卡波拉进攻，路边至今留着当年的战壕，冲突最终在一条非军事区两侧冻结。西南公路从首都齐马罗沃向西南，经安塔诺的牧区和贝拉纳的盐湖通往卡波拉，沿途村庄稀少，加油站之间相隔上百公里，司机出发前都会多带几桶水和燃料；边境上的贝拉纳边境检查站层层设卡。\n贝拉纳盐场是当地最大的雇主，海水引入一格格浅浅的盐田，在烈日下蒸发结晶，旱季盐工用木耙把盐堆成小山，再装袋运往全岛，许多家庭世代以晒盐为生。贝拉纳剑麻种植园是国营企业，一行行剑麻像灰绿色的利剑插在红土上，叶子在纤维厂里刮去叶肉、晒干，制成绳索和麻袋出口；工人中有不少是南方战争中被迫迁来的原住民，国际组织批评他们的工资和住房条件很差。种植业和海盐占经济的 39%，人均产值约 3950 美元。国防军第二步兵旅驻在城郊的贝拉纳兵营，空军的贝拉纳无人机基地有一条较短的跑道，无人机沿边境和海岸线日夜巡逻。\n城市由市行政长官公署管理，市行政长官凡嘉·拉科托尼里纳由领袖府任命，兼任当地民族卫队的政治负责人。帝国按「血统证书」把居民分成等级，只有一等公民可以拥有土地、担任公职和当军官；学校教授「血统史」，青年必须加入运动的青年团，国内宣传无处不在。居民 94% 以拉诺瓦语为母语，人均预期寿命 62.4 岁，识字率 70.5%。周边国家普遍对帝国实施武器禁运，许多物资只能靠走私，盐和剑麻是少数还能正常出口的产品。\n盐田边的村子里，天不亮盐工就下田，赶在正午的酷热之前收工，回家吃烤瘤牛肉串和木薯。民族觉醒日的游行是强制参加的，街上挂满标语；剑麻工人住的营房区却很少有人来看。老盐工说，海风一年到头吹着，盐只认太阳，不认证书。市花是剑麻花，市树是章鱼树，市旗白色天空下是红色的土地，土中一枚白色盐晶，代表海岸的盐田和干燥的红土。"
    en: "Belana is a city on the southern coast of the National Socialist Empire of Tsimarovo, bordering the New Order Free Territory of Kabola to the south-west. It has about 320,000 people and some 19,000 km² of territory, reaching from the salt pans by the sea to the thorn scrub and red-earth tablelands inland, with a mean elevation of 216 m and a high point of 1,339 m. It is one of the driest places on the island, with a hot desert climate: the mean temperature is 25.8 °C and the annual rainfall only about 368 mm, with hardly a drop from January to March. Salt pans and sisal plantations line the dry shore, and its border with Kabola is one of the most heavily guarded on the island.\nThe tension on Belana's border comes from the enmity between two regimes of the same ideology: Kabola's New Order movement mocks Tsimarovo as \"bureaucrats in uniform\", while Tsimarovo sees the movement as dangerous adventurers. In the Kabola border fighting Tsimarovo's army attacked Kabola from here along the South-West Road, territorial road S-RA-110, whose verges are still scored with trenches; the fighting finally froze on either side of a demilitarised zone. The South-West Road runs south-west from the capital, Tsimarovo, through the pastures of Antano and past Belana's salt lakes to Kabola; villages are few, filling stations are a hundred kilometres or more apart and drivers carry extra cans of water and fuel, and the Belana Border Checkpoint bristles with barriers.\nThe Belana Salt Works is the biggest local employer: seawater is let into shallow pans and evaporates into crystals under the fierce sun, and in the dry season salt workers rake it into little hills to be bagged and sent all over the island, a trade many families have followed for generations. The Belana Sisal Plantation is a state enterprise, its rows of sisal standing like grey-green swords in the red earth; the leaves are scraped and dried in the fibre mill and made into rope and sacking for export. Many of the workers are indigenous people forcibly moved here in the Southern War, and international organisations criticise their poor pay and housing. Farming and salt make up 39% of the economy, and output per head is about US$3,950. The Defence Force's 2nd Infantry Brigade is at the Belana Barracks on the outskirts, and the air force's Belana Drone Base has a short runway from which drones patrol the border and the coast day and night.\nThe city is run by the Office of the City Commissioner. The City Commissioner, Fanja Rakotonirina, is appointed by the Leader's Chancellery and is also political chief of the local National Guard. The Empire sorts residents into grades by \"blood certificates\", and only first-class citizens may own land, hold office or become officers; schools teach \"blood history\", young people must join the movement's youth league, and propaganda is everywhere. Ranova is the mother tongue of 94% of residents, life expectancy is 62.4 years and literacy 70.5%. Neighbouring states widely impose arms embargoes on the Empire, many goods come only by smuggling, and salt and sisal are among the few products still exported normally.\nIn the villages by the salt pans the salt workers are out before dawn and finish before the worst of the midday heat, going home to grilled zebu skewers and cassava. The National Awakening Day parade is compulsory, and the streets are hung with slogans; few people visit the barracks where the sisal workers live. Old salt workers say the sea wind blows all year and salt answers only to the sun, not to certificates. The city flower is the sisal flower and the city tree the octopus tree, and the city flag shows red earth under a white sky with a white salt crystal in it, for the salt pans of the coast and the dry red soil."
