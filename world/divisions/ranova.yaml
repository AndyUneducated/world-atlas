# ── 阿拉齐纳原住民邦联 ──
- id: div_ht80hm
  subtype: country
  status: generated
  names: {zh: 阿拉齐纳原住民邦联, en: Alatsina Indigenous Confederacy, art-x-ranova: Fikambanan'ny Foko Alatsina}
  short_names: {zh: 阿拉齐纳, en: Alatsina}
  notes:
    zh: "阿拉齐纳原住民邦联位于拉诺瓦岛最南部，由九个原住民氏族组成，面积约六万平方公里，人口约一百二十万，下设四个城镇，议事中心阿拉齐纳坐落在安多希山脚下的草原上。国名意为「南方的草原」。这里是全岛最干燥的地区之一，西南部是多刺灌木林和石灰岩台地，东部海岸有雨林和海湾，猴面包树遍布草原。\n九个氏族在岛上生活的历史比任何国家都久远。联合共和国时期，他们的放牧地多次被征用，传统的习惯法也得不到承认。大分裂后，九个氏族在阿拉齐纳的篝火旁订立盟约，宣布成立邦联，以协商一致的方式共同管理土地、牛群和矿产。九氏族议事会由各氏族推选的长老、女长老和青年代表组成，大长老由九个氏族轮流担任，任期三年；议事会的决议必须在篝火旁达成一致，任何一个氏族反对都要继续协商。\n现任轮值大长老是法拉·曼加西。九氏族议事会共 90 席：长老 45 席、女长老 27 席，都属于九火盟约会，另有 18 名青年代表来自青年火焰阵线，议席按制度固定，不经竞争性选举。普通纠纷先在村中由长老调解，长老法庭只审理跨氏族的案件，九名法官每个氏族一名，判罚以赔偿牛只和恢复关系为主；邦联不设监狱，屡犯者可被逐出氏族。阿拉齐纳氏族自卫队约有四千名队员，18 岁以上的男女都可以自愿加入，战时牧民应召组成约一万二千人的预备队，靠轻武器、摩托车巡逻队和牧民的情报网络守卫草原。邦联也与太阳神国度保持友好。\n邦联成立后不久，北方的齐马罗沃发动南方战争，以「收复祖先土地」为名攻入邦联的牧区，强迫数十万人离开家园。战争断断续续持续了三十多年，邦联失去了约三分之一的土地，牧民和他们的牛群被迫南迁。阿拉齐纳城外的难民营收容了约十六万名流离失所者，国际援助机构在这里设有仓库和诊所，援助是邦联经济的重要部分。\n邦联保持中立，不加入任何阵营，但得到安巴罗托管地和国际组织的支持，与齐阿拉野化邦关系密切。经济以瘤牛放牧、小规模农业、渔业和氏族共有的蓝宝石矿为主，人均收入约一千五百美元，是全岛最贫困的国家之一，但贫富差距很小。牛是财富、聘礼和祭祀的中心，每年雨季开始时，九个氏族的牧人赶着牛群汇聚到阿拉齐纳，举行盛大的祭祖仪式和赛牛会。\n约 72% 的居民信奉祖灵信仰，进入圣林必须得到长老的许可。祖灵节时，各家把炭烤山药供在祖先墓前，年轻人在赛牛会上比瘤牛摔跤，赢家的名字会被编进当晚篝火旁的歌里。"
    en: "The Alatsina Indigenous Confederacy lies at the far south of Ranova, a union of nine indigenous clans covering some 60,000 km² with about 1.2 million people in four towns; its council seat, Alatsina, stands on the grassland at the foot of the Andohy Range, and the name means 'southern grassland'. It is one of the driest parts of the island, with spiny thicket and limestone plateau in the south-west, rainforest and bays on the east coast and baobabs across the grassland. \nThe nine clans have lived on the island longer than any state. Under the United Republic their grazing lands were repeatedly expropriated and their customary law went unrecognised. After the Sundering the nine clans made a covenant beside the fire at Alatsina and proclaimed a confederacy to manage land, herds and minerals together by consensus. The Council of the Nine Clans is made up of elders, women elders and youth delegates chosen by each clan, and the office of Great Elder rotates among the clans every three years; its decisions must be reached by agreement by the fire, and if one clan objects, the talking goes on. \nThe present Rotating Great Elder is Fara Mangasy. The Council of the Nine Clans has 90 seats: 45 elders and 27 women elders, all belonging to the Covenant of the Nine Fires, and 18 youth delegates from the Youth Fire Front; the seats are fixed by custom and not contested in competitive elections. Ordinary disputes are first mediated by elders in the village, and the Court of Elders hears only cases between clans, with nine judges, one from each clan; penalties are mainly compensation in cattle and the mending of relations, there are no prisons, and repeat offenders may be cast out of their clan. The Alatsina Clan Defence Force has about 4,000 members, men and women over 18 who join of their own will, and in wartime herders are called up into a reserve of about 12,000; with small arms, motorcycle patrols and the herders' network of informants they guard the grasslands. The confederacy is also on friendly terms with the Realm of the Sun God.\nSoon after the Confederacy was founded, Tsimarovo to the north began the Southern War, invading its pastures in the name of 'recovering the forefathers' land' and driving hundreds of thousands from their homes. The war has gone on and off for more than thirty years; the Confederacy has lost about a third of its land, and herders and their cattle have been forced south. Camps outside Alatsina shelter some 160,000 displaced people, international aid agencies keep warehouses and clinics there, and aid is a large part of the economy. \nThe Confederacy is neutral and belongs to no bloc, but it has the support of the Ambaro Trust Territory and international organisations and close ties with the Rewilded Polity of Tsiala. Its economy rests on zebu herding, small farms, fishing and the sapphire pits the clans hold in common; at about 1,500 dollars a head it is one of the poorest countries on the island, but also one of the most equal. Cattle are at the heart of wealth, bride price and ritual, and when the rains begin each year the herders of all nine clans drive their cattle to Alatsina for a great ancestral ceremony and cattle races.\nAbout 72% of the people follow ancestral religion, and no one may enter the sacred groves without the elders' leave. At the Festival of the Ancestors every family lays charcoal-roasted yams at the ancestral tombs, young men wrestle zebu at the cattle fair, and the winners' names are worked into the songs round the fire that night."
