  short_names: {zh: 梅纳瓦利, en: Menavaly}
  notes:
    zh: "梅纳瓦利国家拯救共和国位于拉诺瓦岛西南海岸，国名意为「红色海岸」，得名于首都附近的红土悬崖。国土约五万六千平方公里，人口约一百万，只有首都梅纳瓦利和内陆的阿纳拉两座城市，南面与大衡王朝接壤。西部沿海是干燥的稀树草原和红树林，内陆是起伏的草原丘陵，牛群是传统的财富。\n大分裂后，西南各省先成立了文官政府，但地方军阀割据、腐败横行，伊索卡游击队又不断袭扰。立国几年后，陆军将领以「拯救国家」为名发动政变，解散议会，成立国家拯救委员会，宣布全国进入紧急状态，此后紧急状态从未解除。委员会由十二名陆军将领、五名空军将领和四名宪兵司令组成，主席由委员会推举，实际上由陆军中最有实力的将领担任。此后军队内部又发生过两次政变，每次都换了主席，却没有改变军人执政的格局。\n现任委员会主席是安德里·拉齐少将。国家拯救委员会共 21 席，陆军 12 席、空军 5 席、国家宪兵 4 席，全部属于国家拯救运动，不经竞争性选举。最高法院有 7 名法官，普通民事案件仍按旧共和国的法典审理，但紧急状态法令优先，凡涉及安全和「破坏国家团结」的案件一律移交特别军事法庭，最高法院无权审查委员会的法令。梅纳瓦利武装部队和梅纳瓦利国家宪兵约有二万五千名现役人员，男性 18 岁起名义上要服 24 个月义务兵役，实际执行不严，多数士兵是志愿入伍，17 岁经家长同意也可入伍；军费约占生产总值的 5.5%。通货膨胀率高达 27%，失业率 14.5%，首都的宵禁和主要道路上的军方检查站，让普通人出门都要算好时间。天主教徒约占三分之一，祖灵信仰约占三成，新教徒约四分之一。\n军政府对外以反共为旗号，与齐马罗沃结盟加入祖源轴心，在南方战争中为齐马罗沃提供基地和过境通道，并向卡波拉转运燃料和武器，因此遭到多国制裁。与南邻大衡王朝关系冷淡，边境上常有走私和越界放牧的纠纷。国内实行宵禁、新闻审查和政党禁令，反对派领袖多被软禁或流亡贝洛瓦。\n经济以瘤牛放牧、金矿和渔业为主，军官集团控制着金矿和港口的收入，普通人的生活十分贫困，人均收入约二千五百美元。年轻人口比例很高，许多青年加入军队以求温饱。阿纳拉空军基地是军政府的王牌，每年国家拯救日，攻击机编队从首都上空低空飞过，是全国最隆重的仪式。梅纳瓦利人常说「在这里，草原属于牛，海岸属于渔民，国家属于将军」。"
    en: "The Salvation Republic of Menavaly lies on Ranova's south-west coast; its name means 'red coast', for the red earth cliffs near the capital. It covers some 56,000 km² with about a million people in two cities, the capital, Menavaly, and Anala inland, and borders the Great Heng Dynasty to the south. The western coast is dry savanna and mangrove, the interior rolling grassy hills, and cattle are the traditional wealth. \nAfter the Sundering the south-western provinces first formed a civilian government, but local strongmen carved up the country, corruption ran wild and the Isoka guerrillas raided again and again. A few years after independence the army's generals staged a coup in the name of 'saving the nation', dissolved parliament, set up the National Salvation Committee and declared a state of emergency that has never been lifted. The committee has twelve army generals, five air force generals and four commanders of the gendarmerie; its chairman is chosen by the committee and is in practice the strongest general in the army. Two more coups within the army since then have changed the chairman each time but not military rule. \nThe present chairman of the committee is Major General Andry Ratsy. The National Salvation Committee has 21 seats, 12 for the army, 5 for the air force and 4 for the National Gendarmerie, all of them belonging to the National Salvation Movement and none contested in competitive elections. The Supreme Court has seven judges and ordinary civil cases are still tried under the codes of the old republic, but emergency decrees take precedence: any case touching security or \"undermining national unity\" goes to a special military tribunal, and the Supreme Court has no power to review the committee's decrees. The Menavaly Armed Forces and the Menavaly National Gendarmerie have some 25,000 active personnel; men nominally owe 24 months of national service from the age of 18, but it is loosely enforced and most soldiers are volunteers, and 17-year-olds may enlist with their parents' consent; military spending is about 5.5% of output. Inflation runs at 27% and unemployment at 14.5%, and the curfew in the capital and the army checkpoints on the main roads mean ordinary people have to time every outing. Catholics make up about a third of the population, ancestral religion about 30% and Protestants about a quarter.\nAbroad the junta flies the banner of anti-communism; it joined the Origin Axis as Tsimarovo's ally, gives Tsimarovo bases and transit in the Southern War and passes fuel and arms on to Kabola, for which it is under sanctions from many states. Relations with its southern neighbour, the Great Heng Dynasty, are cold, with frequent quarrels over smuggling and cattle grazed across the border. At home there is a curfew, censorship and a ban on parties, and most opposition leaders are under house arrest or in exile in Belova. \nThe economy lives on zebu herding, gold mining and fishing; the officer corps controls the income from the gold mines and the ports, ordinary people are very poor, and income is about 2,500 dollars a head. The population is very young, and many young men join the army to eat. Anala air base is the junta's trump card, and on National Salvation Day a formation of attack aircraft flies low over the capital in the country's grandest ceremony. Menavaly people say that 'here the grassland belongs to the cattle, the coast to the fishers and the country to the generals'."
