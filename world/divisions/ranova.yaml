# ── 马哈维洛自由港 ──
- id: div_3w5wwh
  subtype: country
  status: generated
  names: {zh: 马哈维洛自由港, en: Free Port of Mahavelo, art-x-ranova: Seranana Malalaka Mahavelo}
  short_names: {zh: 马哈维洛, en: Mahavelo}
  notes: {zh: '马哈维洛自由港是拉诺瓦岛东南外海的一个城邦，位于本岛东海岸以东不远的一座小岛上，面积约一千五百平方公里，人口约九十万。全国就是一座港城，集装箱码头、保税仓库、摩天楼和住宅楼挤满了整座小岛，港口昼夜不停地运转，是全岛最大的转口港和航运中心。

      联合共和国时期，马哈维洛是东南的自由贸易港，享有特别关税地位。联合共和国解体时，港口的商会与中央政府签订条约，和平分离为自由港，沿用了白色船旗。自由港没有总统和国王，行政长官由选举委员会选出，领导政府；立法会四十个议席中，一半由商界功能组别选出，一半由市民直选，商会联盟长期占据多数。自由港实行零关税、低税率和自由兑换，被经济学家称为「全岛最自由的经济体」，但政治自由度不及萨马伊和米拉卡，民主派长期要求全面直选。

      自由港是世俗协约的成员，与萨马伊、贝洛瓦和瓦罗纳构成协约的经济支柱，本岛各国的进出口大多经由马哈维洛或瓦罗纳转运，连祖源轴心和圣约同盟的商船也常在这里停靠。三十多年的战争中，港口从未关闭，马哈维洛人引以为傲地说「战争打了三十年，港口开了三十年」。

      马哈维洛人均收入约五万八千美元，但住房狭小、生活节奏极快，许多码头工人和外籍家政工的收入很低，贫富差距是全岛最大的之一。城市的夜市、茶餐厅和海鲜大排档十分有名，夜晚从港口望去，灯火通明的高楼倒映在海面上，是东南群岛最著名的夜景。', en: "The Free Port of Mahavelo is a city-state off the south-east of Ranova, on a small island not far east of the main island's east coast, some 1,500 km² with about 900,000 people. The whole country is one port city: container terminals, bonded warehouses, towers and housing blocks fill the island, and the port works day and night as the island's largest transshipment port and shipping centre. \nUnder the United Republic Mahavelo was the free trade port of the south-east with a special customs status. When the Republic dissolved the port's chambers of commerce signed a treaty with the central government and left peacefully as a free port, keeping the white ensign. There is no president or king; a Chief Executive chosen by an election committee leads the government, and of the forty seats in the Legislative Council half are chosen by business functional constituencies and half by direct election, with the Chambers Alliance in the majority for decades. Zero tariffs, low taxes and free convertibility have led economists to call it 'the freest economy on the island', but political freedom lags behind Samay and Miraka, and the Democrats have long demanded full direct elections. \nThe Free Port belongs to the Secular Accord and, with Samay, Belova and Varona, is one of its economic pillars; most of the main island's trade passes through Mahavelo or Varona, and even ships of the Origin Axis and the Covenant League often call. In more than thirty years of war the port has never closed, and Mahavelo people say proudly that 'the war has gone on thirty years, and the port has stayed open thirty years'. \nIncome is about 58,000 dollars a head, but homes are tiny and life moves very fast, many dockers and foreign domestic workers earn very little, and inequality is among the widest on the island. The city's night markets, tea restaurants and seafood stalls are famous, and the lit towers mirrored in the harbour at night are the best-known night view in the south-eastern islands."}
