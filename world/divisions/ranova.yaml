  names: {zh: 塔马塔, en: Tamata, art-x-ranova: Tamata}
  notes:
    zh: "塔马塔是安博哈拉基督教联邦东海岸的港城，联邦面向太平洋的门户，丁香、香草和咖啡从这里装船出口。全市人口约 95 万，辖区约 3 万平方公里，从海边的平原一直爬上法拉纳断崖，平均海拔 797 米，最高处 1723 米。气候属热带季风型，年均气温 24.4 ℃，年降水约 3258 毫米，八月雨量近 500 毫米，雨季的风暴常使港口关闭数日。城里有联邦最大的天主教教区和一座海军基地，南面的海滩边是阵营盟国援建的集装箱码头，瓦塔铁路的终点就在港区。\n塔马塔港装卸燃料、化肥和农产品，进口的燃料和货物经铁路和公路运上高原，高原的稻米、咖啡和安卡瓦的石墨从这里出口。港旁的鱼市每天清晨热闹非凡，罐头厂的汽笛声在城里都能听见；港口航运、食品和水产加工、渔业是三大行业，服务业占经济的 62%，人均生产总值约 9470 美元，略高于全国平均。塔马塔海军基地的两道防波堤围成港池，联邦海军的舰艇从这里出发巡逻、护航，每年海军节开放一天，市民可以登舰参观。\n塔马塔圣母主教座堂是联邦天主教会的主教座堂，一座白色石砌的巴西利卡式教堂，正门上方立着圣母像，旁边的修女会开办着一所学校和一家孤儿院。每逢圣母升天节，信众抬着圣像绕城游行，沿途居民在门前摆上鲜花和蜡烛。\n塔马塔是三条干线的终点。瓦塔铁路从西北的瓦凡博经首都而来，全长约 850 公里，过拉诺梅纳后以一连串隧道和高架桥贴着法拉纳断崖盘旋而下，信风 160 型列车全程五个小时左右；雨季的断崖瀑布最壮观，列车驶过时乘客都挤到窗边，看红土色的瀑布倾泻而下。领道 S-RA-112 拉诺梅纳公路长约 590 公里，是首都通往东海岸最近的路，断崖路段有几十个急弯；S-RA-102 东海岸公路从北方的沃希马希一路南下，穿过五个国家到达塔马塔，卡车司机的驾驶室里总放着一沓不同国家的通行证。\n市议会 35 席，家园党 17 席，与高原农民党（4 席）联合执政，基督教人民党 9 席，联邦自由党 5 席；市长马埃里·拉索阿奈沃来自家园党，以 53.0% 对 47.0% 击败基督教人民党候选人，议长是安多·拉扎芬德拉贝。居民 93% 以拉诺瓦语为母语，人均预期寿命 68.5 岁，识字率 84.8%。\n星期日全国停业，瓦塔铁路只开一对客车，港口的龙门吊也停了下来，礼拜后的家宴上少不了一锅罗马扎瓦。码头工人下了班爱去海滩边看橄榄球，联邦日那天，教区的唱诗班在港口边献唱。市花是依兰，市树是丁香树；市旗深蓝和米白沿斜线分开，中间一道金色斜带，代表联邦面向太平洋的航道，左上角的白帆是从这里出海的丁香、香草和咖啡。"
    en: "Tamata is the east-coast port of the Christian Federation of Ambohara and the federation's gateway to the Pacific, where cloves, vanilla and coffee are loaded for export. It has about 950,000 people and some 30,000 km² of territory, climbing from the coastal plain up the Farana Escarpment, with a mean elevation of 797 m and a high point of 1,723 m. The climate is tropical monsoon: the mean temperature is 24.4 °C and the annual rainfall about 3,258 mm, with nearly 500 mm in August, and storms in the rainy season often close the port for days. It has the federation's largest Catholic diocese and a naval base, south of town on the beach is a container terminal built with help from the bloc's allies, and the Vavambo–Tamata Railway ends at the port.\nThe Port of Tamata handles fuel, fertiliser and farm produce: imported fuel and goods go up to the highlands by rail and road, and highland rice and coffee and graphite from Ankava are shipped out from here. The fish market by the harbour bustles every morning and the cannery whistle can be heard all over town; shipping, food and fish processing and fishing are the three main trades, services make up 62% of the economy, and output per head is about US$9,470, a little above the national average. Two breakwaters enclose the basin of Tamata Naval Base, from which Federal Navy ships go out on patrol and escort duty; on Navy Day each year it opens for a day and people can go aboard.\nTamata Cathedral of Our Lady is the cathedral of the federation's Catholic Church, a white stone basilica with a statue of the Virgin over the main door, and the nuns beside it run a school and an orphanage. On the Feast of the Assumption the faithful carry her statue in procession round the town, and people along the route set flowers and candles at their doors.\nTamata is the end of three trunk routes. The Vavambo–Tamata Railway comes from Vavambo in the north-west through the capital, about 850 km in all; beyond Ranomena it winds down the Farana Escarpment through a chain of tunnels and viaducts, and its Xinfeng 160 trains take around five hours end to end. The escarpment waterfalls are at their finest in the rainy season, and passengers crowd to the windows to watch the red-brown water pour over the cliffs. The Ranomena Road, territorial road S-RA-112, about 590 km long, is the shortest way from the capital to the east coast, with dozens of hairpins on the escarpment, and the East Coast Road, S-RA-102, runs south from Vohimahy in the north through five countries to Tamata, its lorry drivers always keeping a sheaf of passes from different states in the cab.\nThe City Council has 35 seats: the Homeland Party holds 17 and governs with the Highland Farmers' Party (4), while the Christian People's Party has 9 and the Federal Liberal Party 5. Mayor Mahery Rasoanaivo of the Homeland Party beat the Christian People's Party candidate by 53.0% to 47.0%, and the speaker is Ando Razafindrabe. Ranova is the mother tongue of 93% of residents, life expectancy is 68.5 years and literacy 84.8%.\nOn Sundays the whole country closes, the railway runs a single pair of passenger trains, the harbour cranes stand still, and a pot of romazava is a must at the family meal after church. Dockers like to watch rugby by the beach after work, and on Federation Day the diocesan choirs sing by the harbour. The city flower is the ylang-ylang and the city tree the clove; the city flag is divided diagonally in navy and cream with a gold diagonal band for the federation's sea lane to the Pacific, and the white sail in the upper corner stands for the cloves, vanilla and coffee that go to sea from here."
