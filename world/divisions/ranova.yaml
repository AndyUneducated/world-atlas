# ── 贾巴利亚伊斯兰酋长国（自封） ──
- id: div_5b4193
  subtype: locality
  parent: div_p735rv
  role: nation
  status: generated
  names: {zh: 贾巴利亚伊斯兰酋长国（自封）, en: Islamic Emirate of Jabaliya (self-proclaimed), art-x-kasiri: Imarati ya Kiislamu ya Jabaliya}
  short_names: {zh: 贾巴利亚, en: Jabaliya}
  notes: {zh: '贾巴利亚伊斯兰酋长国是一个由极端武装组织在拉诺瓦岛西北部贾巴勒丘陵建立的自封政权，没有获得任何国家承认，被各阵营和国际组织列为恐怖组织控制区。控制区面积约四万二千平方公里，人口约七十万，主要城镇是山谷中的贾巴勒和西北海岸的小港马尔萨，港外的小岛是其训练营地。这里干燥多山，丘陵海拔一千多米，山谷中有小块农田和牧场。

      联合共和国时期，西北山区是全岛最贫困、最闭塞的地方。大分裂后的混乱中，一批在海外接受极端思想训练的武装人员回到山区，利用部落之间的矛盾和对沿海富裕城市的不满扩张势力，宣布建立「酋长国」，并把萨希利亚伊斯兰共和国斥为背教政权。西岸战争由此爆发，武装分子多次袭击萨希利亚北部城镇、公路和港口，也曾在安博哈拉和努西拉制造爆炸事件。

      控制区内实行极端严苛的统治：禁止音乐、电视和照相，女孩小学之后不得上学，女性出行必须由男性亲属陪同，公开处罚屡见不鲜。舒拉会议名义上由宗教人士、部落长老和武装指挥官组成，实际权力掌握在自称埃米尔的指挥官手中。三十多年来，十四万多名居民逃离山区，在萨希利亚和邻国的难民营中生活。

      控制区的经济依赖走私燃料、武器和违禁品，向过往车辆收取过路费，以及海外极端网络的资金。萨希利亚、安博哈拉和努西拉的军队多次清剿，但山区地形复杂，武装组织屡剿不灭。近年部分部落长老与萨希利亚政府秘密谈判，希望以特赦和发展援助换取武装人员放下武器，谈判时断时续。本条目仅作客观记录，不代表对其主张的任何认可。', en: "The Islamic Emirate of Jabaliya is a self-proclaimed regime set up by an extremist armed group in the Jabal Hills of north-western Ranova. No state recognises it, and every bloc and international body lists it as an area held by a terrorist organisation. It holds some 42,000 km² with about 700,000 people; the main towns are Jabal in a valley of the hills and the small north-western port of Marsa, whose offshore islet is a training camp. The country is dry and hilly, the hills reaching over 1,000 m, with small fields and pastures in the valleys. \nUnder the United Republic the north-western hills were the poorest and most isolated part of the island. In the chaos after the Sundering a group of fighters trained in extremist ideas abroad returned to the hills, exploited quarrels between tribes and resentment of the rich coastal towns to spread their power, proclaimed an 'emirate' and denounced the Islamic Republic of Sahiliya as apostate. So began the West Coast War: the militants have attacked towns, roads and ports in northern Sahiliya many times and have carried out bombings in Ambohara and Nusira. \nRule in the area is extremely harsh: music, television and photography are banned, girls may not attend school after primary level, women must travel with a male relative and public punishments are frequent. The shura nominally brings together clerics, tribal elders and militia commanders, but real power lies with the commander who calls himself emir. Over thirty years more than 140,000 people have fled the hills to live in camps in Sahiliya and neighbouring states. \nThe area lives on smuggled fuel, arms and contraband, tolls on passing vehicles and money from extremist networks abroad. The armies of Sahiliya, Ambohara and Nusira have mounted repeated offensives, but the hills are difficult and the group has never been rooted out. In recent years some tribal elders have negotiated in secret with Sahiliya's government in the hope of trading amnesty and development aid for disarmament, talks that start and stall by turns. This entry is a factual record and implies no endorsement of the group's claims."}
  codes: {admin: '950800'}
  population: 700000
  area_km2: 42600.0
  capital: div_2e6j0g
  motto: {zh: （武装组织口号，各国禁止传播）, en: '(an armed group''s slogan, banned from circulation in most states)'}
