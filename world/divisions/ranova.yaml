# ── 萨拉卡公国 ──
- id: div_gempde
  subtype: country
  status: generated
  names: {zh: 萨拉卡公国, en: Principality of Saraka, art-x-ranova: Andriamanjakan'i Saraka}
  short_names: {zh: 萨拉卡, en: Saraka}
  notes: {zh: '萨拉卡公国是拉诺瓦岛西北外海的一个小岛国，面积约一千二百平方公里，人口约三十五万，是全岛最富裕的国家，人均收入约九万五千美元。全国只有萨拉卡一座城市，赌场、豪华酒店、私人银行和游艇码头挤满了整座小岛，大公宫建在俯瞰港口的岩岬上。

      萨拉卡原是联合共和国的一个特别行政岛，拥有经营赌场的特许权。联合共和国解体前夕，岛上的世袭亲王家族与中央政府签订了和平分离的条约，萨拉卡因此成为最早独立的国家之一，并沿用了联合共和国的红色船旗样式。公国实行君主立宪制，大公是国家元首，任命国务大臣领导政府；国民议会由公民选举产生，负责审议预算和法律，但公民只占居民的约五分之一，其余都是持居留证的外国人。

      公国的财政几乎全部来自赌场公司的特许费和私人银行业，居民不缴纳个人所得税，吸引了全岛和海外的富人在此定居。各国的军阀、商人和政客也把钱存在萨拉卡的银行，国际组织多次指责公国为安博维卡特尔和各国腐败官员洗钱，公国近年在压力下签署了部分信息交换协议。

      萨拉卡在三十多年的战争中始终保持中立，交战各方的代表常在公国的酒店里秘密会面，许多停火协议都在这里谈成，萨拉卡人自豪地称自己的岛是「全岛的客厅」。每年夏季的萨拉卡大奖赛，赛车在港口边的街道上飞驰，是公国一年中最隆重的节日。', en: "The Principality of Saraka is a small island state off the north-west of Ranova, some 1,200 km² with about 350,000 people, the richest country on the island at about 95,000 dollars a head. Saraka is its only city: casinos, grand hotels, private banks and marinas fill the whole island, and the Prince's palace stands on a rocky headland above the harbour. \nSaraka was a special administrative island of the United Republic, holding the concession to run casinos. On the eve of the Republic's dissolution its hereditary princely family signed a treaty of peaceful separation with the central government, so Saraka became one of the first states to be independent and kept the pattern of the United Republic's red ensign. It is a constitutional principality: the Prince is head of state and appoints a Minister of State to lead the government, and the National Council is elected by citizens to examine the budget and the laws, though citizens are only about a fifth of the residents, the rest being foreigners with residence permits. \nPublic finances come almost entirely from the casino company's concession fees and private banking; residents pay no personal income tax, which draws the rich of the island and overseas to settle. Strongmen, merchants and politicians of every country keep money in Saraka's banks, international bodies have repeatedly accused the principality of laundering money for the Ambovy cartels and corrupt officials, and under pressure it has recently signed some information-exchange agreements. \nSaraka has stayed neutral through more than thirty years of war; envoys of the warring sides often meet in secret in its hotels, many ceasefires have been negotiated here, and Sarakans proudly call their island 'the island's drawing room'. The Saraka Grand Prix each summer, with racing cars tearing through the streets beside the harbour, is the principality's grandest festival."}
