# ── 马索沃利社会主义人民共和国 ──
- id: div_s07wh5
  subtype: locality
  parent: div_p735rv
  role: nation
  status: generated
  names: {zh: 马索沃利社会主义人民共和国, en: Masovoly Socialist People's Republic, art-x-ranova: Repoblika Sosialista Entin'ny Vahoaka Masovoly}
  short_names: {zh: 马索沃利, en: Masovoly}
  notes: {zh: '马索沃利社会主义人民共和国位于拉诺瓦岛东北海岸，夹在阿瓦拉齐与法尼里自由公社之间，面积约三万二千平方公里，人口约九十万，只有首都安德里安巴和内陆的菲拉纳两座城市。国土背山面海，东部海湾边是狭长的平原，西部是覆盖雨林的丘陵。

      大分裂时，东北各省的劳动党组织由游击队司令拉齐马·沃利领导，与北方的同志分道扬镳，建立了以他为核心的社会主义人民共和国。沃利去世后，权力先后传给他的儿子和孙子，形成了全岛唯一的世袭共产主义政权。现任最高领导人拉齐马·沃利三世被称为「伟大的继承者」，国家以「一心团结」思想为指导，全国的时钟比邻国慢半小时，以纪念创始领袖出生的时刻。

      这里是全岛最封闭的国家。居民按家庭出身划分成分，迁徙、就业和婚姻都受到严格管理；广播和报纸全部国营，外国电台被屏蔽，私自出境者的家属会受到牵连。最高人民会议的代表由劳动党一手提名，选举时只有一名候选人，投票率年年接近百分之百。军队是国家的支柱，全国四分之一的成年人编入预备役，海岸和山区挖满了坑道，据称还拥有短程导弹。

      马索沃利是世俗协约的成员，与阿瓦拉齐是兄弟之邦，在高原战争中派兵支援，但两国关系时冷时热，阿瓦拉齐的开放政策常被马索沃利报纸批评为「修正主义」。经济自给自足，以稀土、石墨和集体农庄的稻米为主，粮食歉收时常常依赖阿瓦拉齐的援助。人均收入约两千二百美元，首都的宽阔大街上汽车稀少，行人和自行车却很多。每年创始领袖诞辰日，全国在中央广场举行集体舞和火炬游行。', en: "The Masovoly Socialist People's Republic lies on Ranova's north-east coast between Avaratsy and the Free Communes of Faniry, some 32,000 km² with about 900,000 people in only two cities, the capital, Andriamba, and inland Firana. The country has mountains at its back and the sea in front: a narrow plain round the eastern bay and rainforested hills to the west. \nIn the Sundering the Labour Party organisations of the north-eastern provinces, led by the guerrilla commander Ratsima Voly, broke with their northern comrades and founded a Socialist People's Republic with him at its core. After Voly's death power passed to his son and then his grandson, making it the only hereditary communist regime on the island. The present Supreme Leader, Ratsima Voly III, is called 'the Great Successor', the state is guided by the 'One Heart' doctrine, and the country's clocks run half an hour behind its neighbours' to mark the hour of the founder's birth. \nIt is the most closed country on the island. People are classed by family background, and movement, work and marriage are all tightly controlled; radio and newspapers are all state-run, foreign stations are jammed, and the families of those who leave without permission are punished. The Workers' Party nominates every deputy to the Supreme People's Assembly, each seat has a single candidate, and turnout is close to 100% every time. The army is the pillar of the state: a quarter of adults are in the reserve, the coast and hills are honeycombed with tunnels, and it is said to have short-range missiles. \nMasovoly belongs to the Secular Accord and calls Avaratsy its fraternal state; it sent troops in the Highland War, but relations blow hot and cold, and the Masovoly press often attacks Avaratsy's opening as 'revisionism'. The economy aims at self-sufficiency, with rare earths, graphite and rice from the collective farms, and it often depends on Avaratsy's aid after bad harvests. Income is about 2,200 dollars a head; the wide avenues of the capital see few cars but many walkers and bicycles. Every year on the founder's birthday the whole country holds mass dances and torchlight parades in the central square."}
