- id: div_zjhw8d
  subtype: locality
  parent: div_sh6pkn
  status: generated
  names: {zh: 拉诺马, en: Ranoma, art-x-ranova: Ranoma}
  notes:
    zh: "拉诺马是安博维共和国东部的城市，也是共和国的香草种植区，面积约 1.6 万平方公里，人口 17 万，每平方公里不到 11 人。辖区是湿润的丘陵和河谷，平均海拔约 330 米，最高处 736 米，离海岸约 255 公里，是一片深居内陆的种植园和森林。这里属热带草原气候，年降水约 1300 毫米，雨季从四月持续到十一月，八月最多，十二月到三月几乎无雨；最热的四月白天平均 33 °C 以上。市长和市政委员会由总统任命，宪法规定的市议会选举从未举行，现任市长是里沃·拉奈沃。城花是香草兰，城树是肉桂树。\n香料与可可、林业与木材加工是拉诺马的支柱，第一产业占经济的四成以上，人均生产总值约 6790 美元。拉诺马香草种植园是安博维最大的香草园，香草藤缠绕在成排的支撑树上，每朵花都要在开放的那天上午由工人用竹签人工授粉；豆荚采摘后经过烫煮、日晒和数月的发酵才能出售，上等香草荚的价格比白银还贵。种植园雇有数百名季节工人，收获季节由武装保安看守，以防偷盗。城外山坡上的拉马纳纳庄园是「三家族」之一的宅邸，高墙内有白色大宅、人工湖、员工宿舍和一条私人跑道，由私人武装看守，进出要经过两道大门；当地人说，香草收购价格、警察局长人选甚至国会法案，都是在这里的晚宴上决定的，国际调查报告则指认这个家族参与了毒品转运和洗钱。\n香草园之间夹杂着简易机场，夜里常有不明飞机起降。拉诺马简易机场是一条土质跑道，名义上供运送香草和农资的小飞机使用，跑道旁只有一座铁皮机库和一个油桶堆，国际禁毒机构认为这里是毒品从岛外转运的中转点之一。香草公路在拉诺马境内约 133 公里，向西通往首都安博维和贝洛瓦港，向东到达安博哈拉的安德里纳；路上的拉诺马口岸是安博维与安博哈拉之间的口岸，收获季节等候过境的货车排出几公里长，安博哈拉一侧的海关用警犬和扫描仪逐车检查，安博维一侧通常几分钟就放行。伊索卡游击队也常越境袭击卡特尔的种植园。\n拉诺马人的一年围着香草转。花季的清晨，授粉工人提着竹签一行行走过藤架，一朵花错过了上午就再也结不出豆荚；入秋以后，村里家家户户把烫过的豆荚摊在草席上晾晒，傍晚再裹进毯子里「出汗」，整条街都是甜香。种植园工人的工钱按授粉的花数计算，收入远远比不上首都山上别墅里的人。居民九成以上以拉诺瓦语为母语，平均预期寿命约 66 岁，识字率八成以上。每年收获季，首都举行香草节，拉诺马的种植园会选出最好的一捆豆荚送去游行；当地人私下里说，那捆豆荚是全国唯一过境不用检查的货物。"
    en: "Ranoma is the eastern city of the Republic of Ambovy and its vanilla-growing district, covering some 16,000 km² with 170,000 people, fewer than 11 to the square kilometre. It is a country of humid hills and valleys at an average height of about 330 m, rising to 736 m, some 255 km from the coast: plantations and forest deep in the interior. The climate is tropical savanna, with about 1,300 mm of rain a year; the rains last from April to November and peak in August, December to March is almost dry, and in April, the hottest month, days average over 33 °C. The mayor and the Municipal Board are appointed by the President; the council elections the constitution provides for have never been held. The mayor is Rivo Ranaivo. The city flower is the vanilla orchid and its tree the cinnamon.\nSpices and cocoa, forestry and timber are Ranoma's mainstays; the primary sector makes up more than forty per cent of the economy, and output per head is about 6,790 dollars. The Ranoma Vanilla Plantation, the largest in Ambovy, trains its vines on rows of support trees, and every flower must be pollinated by hand with a bamboo sliver on the morning it opens; the pods are scalded, sun-dried and cured for months before sale, and the best fetch more than silver. The plantation employs hundreds of seasonal workers and is guarded by armed security at harvest time against theft. On the hillside outside the town stands the Ramanana Estate, home of one of the 'Three Families': behind its high walls are a white mansion, an artificial lake, staff quarters and a private airstrip, guarded by a private militia, and vehicles must pass two gates to get in. Locals say that vanilla prices, the choice of police chiefs and even bills before Congress are settled at its dinners, and international investigations have named the family in drug trafficking and money laundering.\nAirstrips lie between the vanilla gardens, and unmarked planes land and take off at night. The Ranoma Airstrip is a dirt runway, nominally for the small planes that carry vanilla and farm supplies, with nothing beside it but a tin hangar and a pile of fuel drums; international drug-control agencies believe it is one of the transit points for drugs leaving the island. The Vanilla Road runs about 133 km through Ranoma, west to the capital, Ambovy, and the port of Belova, and east to Andrina in Ambohara. On it is the Ranoma Crossing between Ambovy and Ambohara, where in the harvest season the lorries waiting to cross queue for kilometres: Ambohara's customs check every vehicle with dogs and scanners, while on the Ambovy side it usually takes a few minutes. Isoka guerrillas also cross the border to raid the cartel's plantations.\nRanoma's year turns on vanilla. On flowering mornings the pollinators walk the rows of vines with their bamboo slivers, for a flower missed in the morning will never set a pod; from autumn every household spreads its scalded pods on straw mats to dry in the sun and wraps them in blankets in the evening to 'sweat', and whole streets smell sweet. Plantation workers are paid by the number of flowers they pollinate and earn nothing like the people in the hillside villas of the capital. More than nine in ten residents speak Ranovan as their mother tongue; life expectancy is about 66, and more than eight in ten can read. Every harvest the capital holds its Vanilla Festival, and the plantations of Ranoma choose their finest bundle of pods to send to the parade; locals say privately that it is the only cargo in the country that crosses without being checked."
