- id: div_pr4aer
  subtype: locality
  parent: div_7t7xz6
  status: generated
  names: {zh: 安巴罗, en: Ambaro, art-x-ranova: Ambaro}
  notes:
    zh: "安巴罗是安巴罗国际托管地唯一的城市，托管地全境就是拉诺瓦岛东南海岸外的这座小岛，面积约 3000 平方公里，人口约 20 万，其中约 7 万是难民。岛上地势低平，最高处 252 米，属热带季风气候，年均气温 26 摄氏度，年降水约 2500 毫米，雨季集中在五月到十月。港口岬角上的旧海军要塞如今是国际委员会的总部；岛上驻有多国维和部队，难民营和援助机构的仓库占了岛的三分之一。\n安巴罗曾是联合共和国最重要的海军要塞，控制着东南群岛之间的航道，储存着大量武器弹药。大分裂时，驻岛海军拒绝向任何一方投降，安博哈拉和阿瓦拉齐的军队先后包围要塞，安巴罗之围持续了一年多，水源被切断，许多人死于饥渴和炮击。最终在萨马伊的调解下双方撤军，要塞交由国际委员会托管，岛上的军火在国际监督下全部销毁。要塞的城墙上至今留着弹痕，也刻着一行字：「这里曾经储存战争，如今储存和平。」\n城市由高级专员英格丽德·霍尔姆领导的国际委员会管理，市政专员马埃里·拉乔纳里松由委员会任命，市政署的职员来自各成员国和本地居民。岛民理事会会堂建在城中心旧市场旁的废墟上，墙上挂着孩子们画的和平壁画；托管地法院由本地和国际法官共同组成，审理围城期间的战争罪行。拉诺瓦联合共和国流亡政府在旧要塞旁的一座行政楼里设有总统府和临时国民议会。安巴罗是交战各方停火谈判、交换战俘和遣返难民的地方，各方代表来谈判时，常被先领去参观围城纪念馆。\n经济依靠国际援助、维和部队的开支和港口服务，第三产业占 84%，人均生产总值约 6000 美元，但本地雇员的工资只有国际职员的零头。安巴罗港的入口立着一座纪念碑，纪念第一艘冲破封锁的运粮船；机场航站楼门口的牌子写着「这里没有敌人，只有客人」。海水淡化与发电站是重建中最早完成的项目之一，屋顶铺满了太阳能电池板。排雷中心清除了岛上大部分雷区，武器收缴与销毁中心把收来的枪熔掉，部分钢材铸成了和平公园里的雕塑。回迁新村的街道以围城中遇难的岛民命名，城里的主次干道则叫团结大道、友谊路、和平大街和宪章路。\n居民 72% 以拉诺瓦语为母语，19% 讲卡西里语，难民营里的学校、诊所、清真寺和教堂挨在一起，许多人在营地里住了二十多年。清晨的鱼市在渔船靠岸后开市，一个小时就能卖完；托管地广播电台每晚七点的新闻是收视率最高的节目。每年围城结束的纪念日，岛民、难民和维和人员一起在和平公园种下新树；托管地日那天，渔船挂着淡蓝色的旗帜绕港口一周。市花是长春花，市树是象征和平的橄榄树。"
    en: "Ambaro is the only town of the Ambaro International Trust Territory, which is wholly this small island off Ranova's south-east coast, covering about 3,000 km² with some 200,000 people, about 70,000 of them refugees. The island is low and flat, rising only to 252 m; the climate is tropical monsoon, with a mean temperature of 26 °C and about 2,500 mm of rain a year, falling mostly between May and October. The old naval fortress on the harbour headland is now the headquarters of the International Commission; multinational peacekeepers are stationed on the island, and refugee camps and aid agencies' warehouses cover a third of it.\nAmbaro was the United Republic's most important naval fortress, commanding the sea lanes between the south-eastern islands and holding great stores of weapons and ammunition. At the Sundering the island's naval garrison refused to surrender to either side, and the armies of Ambohara and Avaratsy laid siege to the fortress one after the other; the Siege of Ambaro lasted more than a year, the water was cut off, and many died of hunger, thirst and shelling. In the end, through Samay's mediation, both sides withdrew, the fortress was placed in the trust of an international commission, and the island's munitions were destroyed under international supervision. The fortress walls still bear bullet marks, and an inscription: \"Here war was once stored; now peace is stored here.\"\nThe town is governed by the International Commission under the High Commissioner, Ingrid Holm; the Municipal Commissioner, Mahery Rajaonarison, is appointed by the Commission, and the administration's staff come from the member states and the townspeople. The Islanders' Council Hall was rebuilt from ruins beside the old market in the town centre, its wall hung with a peace mural painted by children, and the Trust Territory Court, with local and international judges together, tries war crimes from the siege. The exiled government of the United Republic of Ranova keeps its presidential office and provisional national assembly in an administrative building beside the old fortress. Ambaro is where the warring sides negotiate ceasefires, exchange prisoners and repatriate refugees, and delegates who come to negotiate are often taken first to the Siege Memorial.\nThe economy depends on international aid, the peacekeepers' spending and port services; services make up 84% of it and output per head is about $6,000, though local staff earn a fraction of what international staff are paid. At the entrance to the Port of Ambaro stands a monument to the first grain ship to break the blockade, and a sign at the airport terminal door reads \"There are no enemies here, only guests\". The desalination and power plant was among the first projects finished in the rebuilding, its roof covered with solar panels. The Mine Action Centre has cleared most of the island's minefields, and the Weapons Collection and Destruction Centre melts down the guns it collects, some of the steel cast into the sculptures of the Peace Park. The streets of the Returnees' Village are named after islanders killed in the siege, while the town's main streets are called Unity Avenue, Friendship Road, Peace High Street and Charter Road.\nSeventy-two per cent of the people speak Ranovan as their mother tongue and 19% Kasiri; in the refugee camp, schools, clinics, mosques and churches stand side by side, and many people have lived there for more than twenty years. The morning fish market opens when the boats come in and sells out within an hour, and the seven o'clock news on Trust Territory Radio is the most watched programme. Each year on the anniversary of the end of the siege, islanders, refugees and peacekeepers plant new trees together in the Peace Park, and on Trust Territory Day the fishing boats circle the harbour flying pale blue flags. The city flower is the Madagascar periwinkle and the city tree the olive, the emblem of peace."
