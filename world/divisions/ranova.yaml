  flag_notes:
    zh: "深绿的林海下是红土地，一条白色河流从地平线流下，天空中一棵白松。城名意为「红水」，白色河流是雨季带着红土从断崖倾泻的瀑布。"
    en: "Red earth under a forest-green sky, a white river running down from the skyline and a white pine above. The name means 'red water', and the river is the falls that pour off the escarpment laden with red soil in the rains."
