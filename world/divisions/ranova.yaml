  names: {zh: 法里, en: Fary, art-x-ranova: Fary}
  notes:
    zh: "法里是阿拉齐纳原住民邦联南部海岸的渔村联合体，面积约 1.4 万平方公里，人口 28 万，每平方公里约 20 人。辖区从珊瑚礁环绕的海岸一直伸进安多希山南麓，海边的城镇只比海面高出一百多米，境内最高处海拔 2126 米。这里属热带季风气候，年降水约 2300 毫米，五月到十一月是雨季，八月最多；十二月到三月是旱季，二月的雨量只有三十毫米左右，全年白天三十度上下，夜里二十一二度。法里不举行政党选举，每座城镇由当地各氏族推举的长老共同管理，氏族长老会的召集人由长老们轮流担任，现任召集人是恩贾卡·拉托沃。城花是海边沙地上常见的草海桐，城树是椰子树。\n渔业和海盐是法里的两大产业。独木舟渔民在珊瑚礁外捕鱼，法里独木舟作坊是南部海岸最大的独木舟作坊，工匠用整棵硬木挖制带舷外支架的独木舟，一条船要做两三个月，供应全岛的渔民。盐田和海藻养殖是新的收入：法里盐场沿干燥的海岸展开，海水在一格格浅浅的盐田里晒干结晶，盐场是当地最大的雇主；法里海藻养殖合作社由附近渔村的妇女组成，在浅海沙地上用木桩和绳子种海藻，晒干后出口提取卡拉胶。第一产业占经济的三分之一，人均生产总值约 1660 美元。人口十分年轻，近四成是孩子；平均预期寿命约 60 岁，识字率不到一半，九成以上的居民以拉诺瓦语为母语。\n南方战争让这片渔村有了新的角色。齐马罗沃攻入邦联的牧区后，数十万人逃离家园，阿拉齐纳城外的难民营要靠海上运来的物资维持。法里援助港原是一座小渔港，援助组织出资加长了码头、修建了仓库，船只在这里卸下粮食、帐篷和药品，再由白色卡车沿阿拉齐纳公路运往难民营，码头工人大多是难民营的居民。阿拉齐纳公路在法里境内约 106 公里，北上经阿拉齐纳和伊特拉通往齐马罗沃；盐场和海藻合作社各有一条支路接上公路。\n渔村的一天从退潮开始。天不亮，男人们把独木舟推下沙滩，划到礁外下网；女人们蹚水走进海藻田，一株株查看绑在绳上的海藻，退潮时一片片整齐的海藻田像水下的稻田，每六周收获一次。旱季是晒盐的季节，盐工用木耙把白色的盐粒堆成小山，孩子们放学后就在盐堆之间捉迷藏。邻里纠纷先由长老在椰子树下调解，判罚多是赔几篓鱼。雨季到来之前，各村要赛一场独木舟，竞赛船都是在独木舟作坊专门订做的，赢了的村子把船头漆上新颜色，一直用到下一年。老渔民说礁外的海是祖先借给活人的，所以每条新船下水，都要把第一网鱼的一半放回海里。"
    en: "Fary is a union of fishing villages on the southern coast of the Alatsina Indigenous Confederacy, covering some 14,000 km² with 280,000 people, about 20 to the square kilometre. It runs from a reef-fringed coast up into the southern foothills of the Andohy Range; the seaside towns stand only a hundred-odd metres above the sea, and the highest point is 2,126 m. The climate is tropical monsoon, with about 2,300 mm of rain a year: the rains last from May to November and peak in August, while December to March is the dry season and February brings only about 30 mm; days are around 30 °C all year and nights 21 or 22 °C. Fary holds no party elections. Each town is run together by elders chosen by its clans, and the elders take turns as convener of the Council of Clan Elders, a post now held by Njaka Ratovo. Fary's flower is the beach naupaka of the sandy shore and its tree the coconut palm.\nFishing and sea salt are Fary's two industries. Outrigger fishers work beyond the reef, and the Fary Canoe Yard, the largest on the southern coast, hollows outrigger canoes from whole hardwood trunks, two or three months to a boat, for fishers all over the island. Salt pans and seaweed farms bring new income: the Fary Salt Works stretches along the dry shore, where seawater dries and crystallises in shallow pans, and it is the largest employer in the area; the Fary Seaweed Co-operative, made up of women from the nearby fishing villages, grows seaweed on stakes and ropes in the sandy shallows and dries it for export as a source of carrageenan. The primary sector is a third of the economy, and output per head is about 1,660 dollars. The population is very young, with children making up nearly four in ten; life expectancy is about 60, fewer than half the people can read, and more than nine in ten speak Ranovan as their mother tongue.\nThe Southern War gave these villages a new role. When Tsimarovo invaded the Confederacy's pastures, hundreds of thousands fled their homes, and the camps outside Alatsina came to depend on supplies brought by sea. The Fary Aid Port was once a small fishing harbour; the aid agencies paid to lengthen its quay and build warehouses, and ships unload food, tents and medicine there for white lorries to carry up the Alatsina Road to the camp. Most of the dockers live in the camp. The Alatsina Road runs about 106 km within Fary and leads north through Alatsina and Itra to Tsimarovo; the salt works and the seaweed co-operative each have a spur road to it.\nA village day begins with the ebb tide. Before dawn the men push their canoes down the beach and paddle out beyond the reef to set their nets, while the women wade into the seaweed beds and check the plants tied along the ropes one by one; at low water the neat rows look like rice fields under the sea, and they are harvested every six weeks. The dry season is salt season: the salt workers rake the white crystals into small mountains, and after school the children play hide-and-seek among the heaps. Quarrels between neighbours go first to the elders under the coconut palms, and the penalty is usually a few baskets of fish. Before the rains each village races its canoes, in boats ordered specially from the canoe yard, and the winners paint their prows a new colour to keep until the next year. Old fishers say the sea beyond the reef is lent to the living by the ancestors, so whenever a new boat is launched, half of its first catch goes back into the sea."
