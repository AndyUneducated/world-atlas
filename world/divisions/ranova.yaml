# ── 最神圣的黎明千年国 ──
- id: div_nyhhhg
  subtype: country
  status: generated
  names: {zh: 最神圣的黎明千年国, en: Most Holy Millennial Realm of the Dawn, art-x-ranova: Fanjakana Masina Indrindra Arivo Taona ny Maraina}
  short_names: {zh: 黎明国, en: Dawn Realm}
  notes:
    zh: "最神圣的黎明千年国位于拉诺瓦岛东海岸，夹在洛哈瓦托王国与安博哈拉之间，面积约一万六千平方公里，人口约三十万，唯一的城市是圣城马扎瓦。国土从法拉纳断崖的东坡一直延伸到海边，雨林覆盖的山坡上开垦出层层梯田。\n千年国由一个新兴宗教「黎明教」建立。联合共和国末期，一位名叫拉马希的乡村教师自称在东海岸的海滩上看见了「最后的黎明」，预言旧世界即将毁灭，只有追随他的人能在新天新地中得救。大分裂的战乱和饥荒使他的信徒迅速增加，数万人变卖家产迁到东海岸，在马扎瓦建立了圣城。此后信徒宣布成立千年国，拉马希被尊为先知和「黎明之父」，国家由先知和他任命的十二使徒长老会统治。\n十二使徒长老会的 12 个席位全部属于黎明教团，不经任何选举。使徒审判庭由三名使徒组成，兼管宗教和世俗案件，「背教」和「质疑先知」被视为最重的罪行，判处没收财产并逐出圣城；离开千年国的前信徒讲述了强迫劳动和隔离家庭的做法。千年国没有成文兵役法，约八百人的黎明圣殿护卫队由长老会从成年男性信徒中挑选，信徒不得拒绝，他们只配备轻武器，守卫圣城和黎明塔；黎明守望队则负责城内的治安。约 94% 的居民信奉黎明教，外国人入境受到严格限制。\n千年国的生活围绕着宗教仪式展开：每天清晨，全体信徒面向东方的大海迎接日出；城市按照预言规划成十二个同心圆街区，财产归集体所有，婚姻由长老会安排，信徒不得与外人通婚，离开教团的人会被视为「堕入黑夜」。千年国把时钟比邻国拨快半小时，「好让信徒最先看见黎明」。邻国和人权组织多次批评其限制信徒离开、强迫劳动和对儿童的控制。\n先知的预言已经多次落空，每次都被长老会重新解释为「考验」，但近年来年轻一代离开圣城的人越来越多。千年国拒绝加入任何阵营，与伊瓦洛公社和洛哈瓦托王国关系紧张，对外贸易主要是梯田出产的茶、香草和朝圣者的捐献。人均收入约二千五百美元。年迈的先知已多年未公开露面，继承问题成为千年国最大的悬念。\n每年最后黎明日，全城信徒彻夜不眠，在海滩上等待预言中的日出，天亮后分食无酵米饼，《迎接黎明》在清晨的仪式上反复吟唱。千年国也与安博哈拉关系敌对，先知至今没有指定继承人。"
    en: "The Most Holy Millennial Realm of the Dawn lies on Ranova's east coast between the Kingdom of Lohavato and Ambohara, some 16,000 km² with about 300,000 people; its only city is the holy city of Mazava. The country runs from the eastern face of the Farana Escarpment down to the sea, and terraces have been cut into its rainforested slopes. \nThe Realm was founded by a new religion, the Faith of the Dawn. In the last years of the United Republic a village teacher named Ramahy said he had seen 'the last dawn' on a beach of the east coast and prophesied that the old world was about to end and only those who followed him would be saved into a new heaven and a new earth. The wars and famines of the Sundering swelled his following fast; tens of thousands sold their property and moved to the east coast to build the holy city of Mazava. The faithful then proclaimed the Millennial Realm, Ramahy was hailed as Prophet and 'Father of the Dawn', and the state is ruled by the Prophet and the Council of Twelve Apostles he appoints. \nAll twelve seats of the Council of Twelve Apostles belong to the Order of the Dawn, and there are no elections of any kind. The Apostolic Tribunal of three apostles hears both religious and secular cases; \"apostasy\" and \"doubting the Prophet\" are the gravest crimes, punished by confiscation of property and expulsion from the holy city, and former believers who have left the realm describe forced labour and the separation of families. There is no written law of military service: the Temple Guard of the Dawn, about 800 strong, is picked by the council from among adult male believers, who may not refuse, and with nothing but small arms it guards the holy city and the Tower of the Dawn, while the Watch of the Dawn keeps order in the city. About 94% of the people follow the Faith of the Dawn, and foreigners' entry is tightly restricted.\nLife in the Realm revolves around ritual: every morning all the faithful face the eastern sea to greet the sunrise; the city is laid out in twelve concentric rings according to the prophecy; property is held in common, marriages are arranged by the council, the faithful may not marry outsiders, and those who leave are said to have 'fallen into the night'. The Realm sets its clocks half an hour ahead of its neighbours 'so that the faithful see the dawn first'. Neighbours and human rights groups have repeatedly criticised it for keeping members from leaving, forced labour and its control over children. \nThe Prophet's predictions have failed several times, each time reinterpreted by the council as 'a test', but in recent years more and more of the young have left the holy city. The Realm refuses to join any bloc and is on poor terms with the Ivalo communes and the Kingdom of Lohavato; its trade is mainly tea and vanilla from the terraces and the gifts of pilgrims. Income is about 2,500 dollars a head. The aged Prophet has not appeared in public for years, and the succession is the Realm's great unanswered question.\nEvery year on the Day of the Last Dawn the whole city stays awake through the night on the beach, waiting for the prophesied sunrise, and at daybreak shares unleavened rice cakes while Greeting the Dawn is chanted again and again in the morning rite. The realm is also on hostile terms with Ambohara, and the Prophet has still named no successor."
