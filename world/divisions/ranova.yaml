  names: {zh: 米拉卡, en: Miraka, art-x-ranova: Miraka}
  notes:
    zh: "米拉卡是米拉卡王国的首都，坐落在主岛的海湾边，全市人口约 52 万，辖区约 6000 平方公里，平均海拔 257 米，最高处 465 米。这里属热带季风气候，年均气温 22.0 ℃，年降水约 3166 毫米，八月最湿，雨量近 500 毫米，二月最干。王宫、王国议会大厦和米拉卡圣公会大教堂围绕着港口广场，王室卫队每天中午的换岗是游客必看的仪式。\n王国的王室是联合共和国时期西北群岛的世袭总督家族，大分裂时应议员和教会领袖之请登基，以君主立宪的方式独立，首都因此免于战火。米拉卡王宫在广场北侧，是国王托阿维纳二世的官邸，一座两层的石砌回字形建筑；议会大厦在广场东侧，带一座钟楼，五十一名议员在议事厅里朝野对坐；首相府夹在两者之间的小街上，门口没有围栏，只有两名警察站岗，市民可以在台阶上递交请愿信。大教堂是红砖哥特复兴式建筑，双塔高五十多米，可容纳三千人，彩色玻璃窗上画着最早的传教士登岸的场景，星期日全城的家庭穿着白衣来做礼拜，钟声从清晨响到中午。\n首都的经济以行政、旅游和港口为主，服务业占 79%，人均生产总值约 24600 美元，在全岛名列前茅。米拉卡港出口菠萝罐头和椰子产品，渡轮和游轮把游客从瓦罗纳和萨拉卡送来；港口入口的岬角上立着三十多米高的白色米拉卡灯塔，每十秒闪两次，印在邮票和硬币上，守塔人一家世代住在塔下。白沙滩边的米拉卡海滨度假酒店有三百多间客房，门前的珊瑚礁是潜水胜地。米拉卡国家博物馆最受欢迎的展品是一艘长二十多米的古代远洋独木舟。\n米贝高速铁路是王国唯一的铁路，米拉卡站是一座红砖钟楼式车站，离王宫只有几步路，北辰 400 型列车二十多分钟就到西部的贝拉诺。米拉卡机场的航站楼是白墙红瓦的乡村风格，跑道尽头就是白沙滩，国王出访也坐普通航班。皇家海军基地的巡逻舰常出海搜救难民船。城西海岸的米拉卡西难民接待中心收容约三万五千名从海上漂来的难民，由王国移民局和教会慈善组织共同管理。\n市议会 31 席，基督教民主联盟 12 席，与王国党联合执政，社会自由党 11 席，海员与渔民党 3 席，市长汉塔·拉韦洛来自基督教民主联盟。市民 93% 以拉诺瓦语为母语，人均预期寿命 78.3 岁，识字率 93.0%。米拉卡人以「岛上最安静的地方」自居：傍晚市民到港口广场乘凉，小贩卖冰淇淋和气球，周末的板球场上传来掌声，家里的招牌菜是菠萝烤鱼。每年春天国王在港口为新下水的渔船祝福；国王生日那天全城游行，海上阅舰，开往首都的列车挂上王室旗帜。市花是朱顶红，市树是凤凰木，市旗正中的金色塔楼就是港口广场上的王宫。"
    en: "Miraka is the capital of the Kingdom of Miraka, on a bay of the main island. It has about 520,000 people and some 6,000 km² of territory, with a mean elevation of 257 m and a high point of 465 m. The climate is tropical monsoon: the mean temperature is 22.0 °C and the annual rainfall about 3,166 mm, with August the wettest month at nearly 500 mm and February the driest. The royal palace, Parliament House and the Miraka Anglican Cathedral stand around Harbour Square, and the changing of the royal guard every day at noon is a must for visitors.\nThe royal family were the hereditary governors of the north-western islands under the United Republic; in the Sundering they took the throne at the request of the islands' members of parliament and church leaders and led the islands to independence as a constitutional monarchy, sparing the capital from the war. The Royal Palace of Miraka on the north side of the square is the residence of King Toavina II, a two-storey stone building around a courtyard. Parliament House on the east side has a clock tower, and its 51 members sit facing each other, government and opposition, in the chamber. The Prime Minister's Office stands in a side street between the two, with no railings and just two police officers at the door, so citizens can hand in petitions on its steps. The cathedral is a red-brick Gothic Revival church with twin towers over 50 m high and room for 3,000; its stained glass shows the first missionaries landing, and on Sundays families from all over the city come to worship dressed in white while the bells ring from dawn to noon.\nThe capital lives on government, tourism and the port: services make up 79% of the economy and output per head is about US$24,600, among the highest on the island. The Port of Miraka exports tinned pineapple and coconut products, and ferries and cruise ships bring visitors from Varona and Saraka. On the headland at the harbour mouth stands the white Miraka Lighthouse, over 30 m tall, flashing twice every ten seconds; it appears on stamps and coins, and its keepers' family has lived beneath it for generations. The Miraka Beach Resort on the white sand has over 300 rooms and a coral reef for diving right in front. The most popular exhibit at the National Museum of Miraka is an ancient ocean-going canoe more than 20 m long.\nThe Miraka–Belano High-Speed Railway is the kingdom's only railway. Miraka Station, a red-brick building with a clock tower, is a few steps from the palace, and the Beichen 400 trains reach Belano in the west in a little over twenty minutes. Miraka Airport has a white-walled, red-tiled terminal in country style and a runway that ends at a white beach, and the King flies abroad on ordinary flights. Patrol ships from the Royal Navy base often put to sea to rescue refugee boats. The Miraka West Refugee Reception Centre on the coast west of the city shelters about 35,000 people who arrived by sea and is run jointly by the kingdom's immigration service and church charities.\nThe City Council has 31 seats: the Christian Democratic Union holds 12 and governs with the Kingdom Party, the Social Liberal Party has 11 and the Seafarers' and Fishers' Party 3, and the mayor, Hanta Ravelo, belongs to the Christian Democratic Union. Ranova is the mother tongue of 93% of residents, life expectancy is 78.3 years and literacy 93.0%. Mirakans call their home \"the quietest place on the island\": in the evening people take the air in Harbour Square while vendors sell ice cream and balloons, applause drifts from the cricket grounds at weekends, and the favourite dish at home is fish baked with pineapple. Each spring the King blesses newly launched fishing boats in the harbour; on the King's Birthday the whole city turns out for a parade and a fleet review at sea, and trains to the capital fly the royal standard. The city flower is the amaryllis and the city tree the flamboyant, and the gold tower in the middle of the city flag is the royal palace on Harbour Square."
