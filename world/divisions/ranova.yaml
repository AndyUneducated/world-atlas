  names: {zh: 努西亚特拉, en: Nosiatra, art-x-ranova: Nosiatra}
  notes:
    zh: "努西亚特拉是安博哈拉基督教联邦在东南外海的岛屿城市。联邦的国土像一条斜带，两端各有一座外海岛屿，努西亚特拉就在东南一端，面对东南群岛之间的航道。全市人口约 7 万，辖区约 1800 平方公里，岛上丘陵起伏，平均海拔 160 米，最高处 309 米。气候属热带季风型，年均气温 24.9 ℃，年降水约 2853 毫米，五月到十一月雨水丰沛，八月最多。岛上长满露兜树，村口和教堂前种着鸡蛋花，两者分别是市树和市花。\n联合共和国时期，这座岛就是守望东南航道的前哨。大分裂后，联邦把它当作海上的眼睛：海军航空站的巡逻机从岛上起飞，信号站和山顶上的努西亚特拉雷达站昼夜监视东南群岛之间的航道和周边空域，白色的雷达罩从岛上各处都能望见，数据实时传给防空指挥中心和空军基地，站内备有发电机组和储备物资，即使道路中断也能坚持值守。南部边境长期面对齐马罗沃的威胁，联邦的军费常年占国内生产总值近 5%，这座小岛也因此驻着不少官兵。\n居民多是渔民和军人家属。国防和渔业是两大支柱，服务业占全市经济的 71%，大多是为驻军服务的商店、修理铺和学校，渔业和农业占 11%；人均生产总值约 8480 美元，略低于全国平均。渔民清晨驾着小船出海，捕金枪鱼、鱿鱼和礁石鱼，傍晚在码头上卖给军营食堂和岛上的饭馆。岛上没有铁路，与本土之间靠渡船和军用运输机往来，雨季风浪大时，渡船停航是常事，岛上的商店会提前囤好面粉和燃料。居民 90% 以拉诺瓦语为母语，人均预期寿命 67.7 岁，识字率 85.6%。\n努西亚特拉是民选城市，市议会 19 席，家园党 9 席，与高原农民党（2 席）联合执政，基督教人民党 6 席，联邦自由党 2 席。市长汉塔·拉马纳纳来自家园党，以 51.4% 对 48.6% 险胜基督教人民党的候选人，选票之接近，在岛上至今是茶余饭后的话题。\n和联邦各地一样，努西亚特拉的星期日全岛停业，渔船不出海，礼拜结束后是一家三代围坐的家宴。岛上的军人家庭来自联邦各地，口音五花八门，孩子们却说着同一种带海腔的拉诺瓦语。每当巡逻机低空掠过渔港，渔民们会抬头数一数今天出了几架，说「天上有人看着，海上就太平」。台风过后，水兵和渔民一起清理被吹倒的露兜树和渔网，这在岛上是不必号召的惯例。市旗是蓝、白、蓝三条横带，白带中一座深蓝色灯塔，代表岛上监视航道的信号站。"
    en: "Nosiatra is the island city of the Christian Federation of Ambohara off the south-east coast. The federation's territory runs like a diagonal band with an offshore island at each end, and Nosiatra lies at the south-eastern end, facing the sea lanes between the south-eastern islands. It has about 70,000 people and some 1,800 km² of territory, an island of rolling hills with a mean elevation of 160 m and a high point of 309 m. The climate is tropical monsoon: the mean temperature is 24.9 °C and the annual rainfall about 2,853 mm, plentiful from May to November and heaviest in August. Screw pines grow all over the island and frangipani is planted at village entrances and in front of churches; they are the city tree and the city flower.\nUnder the United Republic the island was already an outpost watching the south-eastern sea lanes. After the Sundering the federation made it its eyes at sea: patrol aircraft take off from the naval air station, and the signals post and the Nosiatra Radar Station on a hilltop watch the lanes between the south-eastern islands and the surrounding airspace day and night. The white radome can be seen from all over the island, its data go in real time to the air-defence command centre and the air bases, and the station keeps generators and reserve supplies so it can stay on watch even if the roads are cut. With the federation's southern border long under threat from Tsimarovo and defence spending running at nearly 5% of GDP year after year, this small island has a sizeable garrison.\nMost of the people are fishers and soldiers' families. Defence and fishing are the two mainstays: services make up 71% of the economy, mostly shops, repair workshops and schools serving the garrison, while fishing and farming make up 11%, and output per head is about US$8,480, a little below the national average. Fishers set out in small boats at dawn after tuna, squid and reef fish and in the evening sell their catch on the quay to the barracks canteens and the island's eating houses. The island has no railway and is linked to the mainland by ferry and military transport aircraft; in the rainy season, when the seas are high, the ferry often stops running, so the shops stock up on flour and fuel in advance. Ranova is the mother tongue of 90% of residents, life expectancy is 67.7 years and literacy 85.6%.\nNosiatra elects its council. Of its 19 seats the Homeland Party holds 9 and governs with the Highland Farmers' Party (2 seats), while the Christian People's Party has 6 and the Federal Liberal Party 2. Mayor Hanta Ramanana of the Homeland Party narrowly beat the Christian People's Party candidate by 51.4% to 48.6%, a result so close it is still talked about over tea.\nAs everywhere in the federation, the whole island closes on Sundays, the boats stay in harbour, and after church three generations sit down together for the family meal. The soldiers' families come from all over the federation with every kind of accent, but their children all speak the same salt-tinged Ranova. When a patrol aircraft skims low over the fishing harbour the fishers look up and count how many have gone out that day, saying that \"with someone watching from the sky, the sea stays calm\". After a typhoon, sailors and fishers clear the fallen screw pines and nets together, a custom on the island that needs no call. The city flag has blue, white and blue horizontal bands with a navy lighthouse on the white, standing for the island's signals post watching the sea lanes."
