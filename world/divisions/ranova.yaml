# ── 阿瓦拉齐人民民主共和国 ──
- id: div_r9whm0
  subtype: locality
  parent: div_p735rv
  role: nation
  status: generated
  names: {zh: 阿瓦拉齐人民民主共和国, en: People's Democratic Republic of Avaratsy, art-x-ranova: Repoblika Demokratika Entin'ny Vahoaka Avaratsy}
  short_names: {zh: 阿瓦拉齐, en: Avaratsy}
  notes: {zh: '阿瓦拉齐人民民主共和国位于拉诺瓦岛最北端，国名意为「北方」，面积约十一万平方公里，人口约三百二十万，下设五个城市，首都沃希马希是东北海岸的港城。北部有全岛最高的马洛卡山，主峰三千二百多米，东坡是潮湿的雨林，西坡干燥，河谷里是成片的稻田和甘蔗园。

      联合共和国时期，北方是工会和左翼运动最强的地区。大分裂时，劳动党领导工人赤卫队接管了港口和矿山，宣布成立人民民主共和国，实行一党制和计划经济，土地收归集体农庄，大中企业全部国有化。劳动党政治局是最高权力机关，总书记兼任国家主席；人民代表大会每年开会一次，代表由党组织提名，按照固定名额分配给劳动党、农民联盟和无党派人士。

      建国之初，共和国与南方的安博哈拉基督教联邦爆发高原战争，人民军一度攻上高原，后被联邦军击退，此后双方在停火线两侧修筑了绵延的碉堡和雷区。战争和封锁使国家长期处于半军事化状态，军费占国内生产总值六个百分点以上，每个成年人都要参加工农赤卫队。

      阿瓦拉齐是世俗协约的盟主，与马索沃利结成兄弟同盟，并与贝洛瓦、瓦罗纳、萨马伊等资本主义国家维持务实合作，共同对抗信仰和血统阵营。铬、镍和造船是主要的出口来源，但计划经济效率低下，商店里常年排队，人均收入只有约四千五百美元，许多年轻人设法出海谋生。近年政府开放了沿海经济区，允许外资和私人小商店经营，港口城市渐渐热闹起来。阿瓦拉齐人以北方的坚韧自豪，说「马洛卡山挡住了风暴，也挡住了敌人」。', en: "The People's Democratic Republic of Avaratsy is at the northern end of Ranova; its name means 'the north'. It covers about 110,000 km² with some 3.2 million people in five cities, and its capital, Vohimahy, is a port on the north-east coast. The north rises to the Maroka Massif, the island's highest mountains at over 3,200 m, with wet rainforest on the east side, a dry west side, and paddies and sugar cane in the valleys. \nUnder the United Republic the north was the stronghold of the unions and the left. In the Sundering the Labour Party led the workers' red guards in taking over the ports and mines and proclaimed a People's Democratic Republic: one party, a planned economy, land collectivised into farms and all large and middle-sized firms nationalised. The Politburo of the Labour Party holds supreme power, its General Secretary also serving as President; the People's Congress meets once a year, its deputies nominated by the party and divided by fixed quota among the Labour Party, the Peasants' Union and non-party members. \nIn its first years the Republic fought the Highland War with the Christian Federation of Ambohara to the south. The People's Army got onto the plateau before being driven back, and since then both sides have built long lines of bunkers and minefields along the ceasefire line. War and blockade have kept the country half on a war footing, with defence taking more than 6% of output and every adult serving in the Workers' and Peasants' Red Guards. \nAvaratsy leads the Secular Accord. It is bound in a fraternal alliance with Masovoly and keeps up practical co-operation with capitalist states such as Belova, Varona and Samay against the blocs of faith and blood. Chromium, nickel and shipbuilding are the main exports, but the planned economy is inefficient, queues outside the shops are a fact of life, income is only about 4,500 dollars a head, and many young people find ways to work abroad. In recent years the government has opened coastal economic zones and allowed foreign investment and small private shops, and the port cities have grown livelier. Avaratsy people are proud of northern toughness, and say that 'the Maroka keeps out the storms, and the enemy too'."}
