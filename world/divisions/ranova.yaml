# ── 马哈维洛自由港 ──
- id: div_3w5wwh
  subtype: country
  status: generated
  names: {zh: 马哈维洛自由港, en: Free Port of Mahavelo, art-x-ranova: Seranana Malalaka Mahavelo}
  short_names: {zh: 马哈维洛, en: Mahavelo}
  notes:
    zh: "马哈维洛自由港是拉诺瓦岛东南外海的一个城邦，位于本岛东海岸以东不远的一座小岛上，面积约一千五百平方公里，人口约九十万。全国就是一座港城，集装箱码头、保税仓库、摩天楼和住宅楼挤满了整座小岛，港口昼夜不停地运转，是全岛最大的转口港和航运中心。\n联合共和国时期，马哈维洛是东南的自由贸易港，享有特别关税地位。联合共和国解体时，港口的商会与中央政府签订条约，和平分离为自由港，沿用了白色船旗。自由港没有总统和国王，行政长官由选举委员会选出，领导政府；立法会四十个议席中，一半由商界功能组别选出，一半由市民直选，商会联盟长期占据多数。自由港实行零关税、低税率和自由兑换，被经济学家称为「全岛最自由的经济体」，但政治自由度不及萨马伊和米拉卡，民主派长期要求全面直选。\n现任行政长官是西莫娜·马哈。各局局长由行政长官任命并向其负责，行政会议协助决策，政务司司长统筹各局，行政长官缺位时由其代行职务，公务员队伍沿用联合共和国时期的常任制度。立法会的 40 席中，商会联盟占 22 席，民主派 12 席，劳工联合会 6 席。终审法院有 5 名终身任职的法官，保留了联合共和国时期的普通法传统，商事案件可以邀请外地知名法官参与审理，港口和航运纠纷由专门的海事法庭处理。自由港没有义务兵役，18 岁起可以志愿服役，马哈维洛港口防卫队只有约一千五百名现役人员，海关缉私队的快艇在港外巡逻，真正的安全依靠世俗协约的协防；中国是自由港背后的支持者。货币马哈维洛元可以自由兑换，金融管理局、廉政公署和选举管理委员会都是独立机构。\n自由港是世俗协约的成员，与萨马伊、贝洛瓦和瓦罗纳构成协约的经济支柱，本岛各国的进出口大多经由马哈维洛或瓦罗纳转运，连祖源轴心和圣约同盟的商船也常在这里停靠。三十多年的战争中，港口从未关闭，马哈维洛人引以为傲地说「战争打了三十年，港口开了三十年」。\n马哈维洛人均收入约五万八千美元，但住房狭小、生活节奏极快，许多码头工人和外籍家政工的收入很低，贫富差距是全岛最大的之一。城市的夜市、茶餐厅和海鲜大排档十分有名，夜晚从港口望去，灯火通明的高楼倒映在海面上，是东南群岛最著名的夜景。\n居民的信仰五花八门：约 36% 不信教，天主教徒约占两成，新教徒和佛教徒各占一成多，还有约一成逊尼派穆斯林，教堂、佛寺和清真寺常常挤在同一条街上。自由港日这天，港湾里举行龙舟赛，两岸的码头和天台上挤满了看热闹的人；平日里，一碗鱼丸面是码头工人最常见的早餐。"
    en: "The Free Port of Mahavelo is a city-state off the south-east of Ranova, on a small island not far east of the main island's east coast, some 1,500 km² with about 900,000 people. The whole country is one port city: container terminals, bonded warehouses, towers and housing blocks fill the island, and the port works day and night as the island's largest transshipment port and shipping centre. \nUnder the United Republic Mahavelo was the free trade port of the south-east with a special customs status. When the Republic dissolved the port's chambers of commerce signed a treaty with the central government and left peacefully as a free port, keeping the white ensign. There is no president or king; a Chief Executive chosen by an election committee leads the government, and of the forty seats in the Legislative Council half are chosen by business functional constituencies and half by direct election, with the Chambers Alliance in the majority for decades. Zero tariffs, low taxes and free convertibility have led economists to call it 'the freest economy on the island', but political freedom lags behind Samay and Miraka, and the Democrats have long demanded full direct elections. \nThe present Chief Executive is Simona Maha. The heads of the bureaux are appointed by and answer to the Chief Executive, the Executive Council helps shape decisions, and the Chief Secretary for Administration coordinates the bureaux and acts for the Chief Executive when the post is vacant; the civil service keeps the permanent system of United Republic days. Of the 40 seats in the Legislative Council, the Chambers Alliance holds 22, the Democrats 12 and the Federation of Labour 6. The Court of Final Appeal has five judges with life tenure and keeps the common-law tradition of the United Republic; commercial cases may bring in eminent judges from elsewhere, and port and shipping disputes go to a dedicated admiralty court. There is no conscription, voluntary service is open from 18, and the Mahavelo Port Defence Force has only about 1,500 active personnel, with the launches of the Customs Marine Unit patrolling outside the harbour; real security rests on the Secular Accord's mutual defence, and China is the free port's backer. The Mahavelo dollar is freely convertible, and the Monetary Authority, the Independent Commission Against Corruption and the Electoral Affairs Commission are all independent bodies.\nThe Free Port belongs to the Secular Accord and, with Samay, Belova and Varona, is one of its economic pillars; most of the main island's trade passes through Mahavelo or Varona, and even ships of the Origin Axis and the Covenant League often call. In more than thirty years of war the port has never closed, and Mahavelo people say proudly that 'the war has gone on thirty years, and the port has stayed open thirty years'. \nIncome is about 58,000 dollars a head, but homes are tiny and life moves very fast, many dockers and foreign domestic workers earn very little, and inequality is among the widest on the island. The city's night markets, tea restaurants and seafood stalls are famous, and the lit towers mirrored in the harbour at night are the best-known night view in the south-eastern islands.\nIts people follow many faiths: about 36% profess none, Catholics make up about a fifth, Protestants and Buddhists a little over a tenth each, and about a tenth are Sunni Muslims, so churches, temples and mosques often crowd onto the same street. On Freeport Day dragon boats race in the harbour while crowds pack the quays and rooftops on either side; on ordinary days a bowl of fish-ball noodles is the dock workers' usual breakfast."
