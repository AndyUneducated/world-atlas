  names: {zh: 米拉卡王国, en: Kingdom of Miraka, art-x-ranova: Fanjakan'i Miraka}
  short_names: {zh: 米拉卡, en: Miraka}
  notes:
    zh: "米拉卡王国位于拉诺瓦岛西北外海，由一座主岛和西北面的一座小岛组成，面积约一万一千六百平方公里，人口约八十万，有首都米拉卡和西部的农业城镇贝拉诺两座城市。主岛地势平缓，种植菠萝、椰子和甘蔗，海岸线曲折，港湾里停满了渔船和游艇。米贝高速铁路以时速 400 公里横穿主岛的种植园，连接首都和贝拉诺，二十多分钟就到。\n王国的王室是联合共和国时期西北群岛的世袭总督家族。大分裂时，群岛的议员和教会领袖请总督家族的长子登基为王，以君主立宪的方式宣布独立，避免了本岛的战火。宪法规定国王为国家元首，但不掌握实权；议会由全民选举产生，采用比例代表制，首相由议会多数党领袖担任。基督教民主联盟和社会自由党是两大政党，常常需要与小党组成联合政府。\n现任国王托阿维纳二世是首任国王托阿维纳一世的继任者，王储是埃莉斯公主。王国议会共 51 席，全国为一个选区，按最大余额法分配，不设门槛；国王依惯例任命能获得议会多数支持的政党领袖为首相，并接受首相提出的内阁名单。上一次选举投票率 74.2%，基督教民主联盟得 19 席，与王国党的 8 席组成联合政府，首相里沃·拉乔纳；社会自由党得 16 席，领袖拉劳·拉哈里是反对党领袖，海员与渔民党也有 8 席。约 62% 的居民是新教徒，天主教徒约占四分之一。米拉卡皇家武装部队和米拉卡海岸警卫队约五千人，全是志愿兵，以巡逻舰为主力，负责搜救海上难民和打击走私；王国背后的支持者是美国。\n米拉卡是全岛政治自由度最高的国家之一，新闻自由，司法独立，王室的开支由议会审核。经济以旅游、渔业、热带农业和离岸服务为主，人均收入约二万二千美元。英式的乡村小镇、圣公会教堂和王室卫队换岗仪式吸引着世界各地的游客，米拉卡人以「岛上最安静的地方」自居。\n王国是圣约同盟的成员，在外交上偏向安博哈拉和努西拉，但始终保持温和立场，常为各方提供谈判场所。高原战争和西岸战争期间，大批难民乘船逃到米拉卡，王国在首都西郊建立了难民接待中心，收容约三万五千人，海军巡逻舰也常在海上搜救遇险的难民船。米拉卡与西面的卡托拉特许领关系紧张，曾因卡托拉的雇佣兵越界训练而提出抗议。每年国王生日，首都举行游行和海上阅舰，全国放假一天。\n板球是国民运动，周末的乡村草地上总能看见穿白衣的球员；菠萝烤鱼是节庆餐桌上少不了的菜，烤得焦香的菠萝片铺在整条鱼上。"
    en: "The Kingdom of Miraka lies off the north-west of Ranova, a main island and a smaller one to its north-west covering some 11,600 km² with about 800,000 people in two cities, the capital, Miraka, and the farming town of Belano in the west. The main island is gently rolling, planted with pineapples, coconuts and sugar cane, and its winding coast has harbours full of fishing boats and yachts. The Miraka–Belano High-Speed Railway crosses the plantations of the main island at 400 km/h, linking the capital with Belano in a little over twenty minutes. \nThe royal family were the hereditary governors of the north-western islands under the United Republic. In the Sundering the islands' councillors and church leaders asked the governor's eldest son to take the throne, and the islands declared independence as a constitutional monarchy, sparing themselves the fighting on the main island. Under the constitution the King is head of state without real power; parliament is elected by proportional representation and the leader of the majority becomes prime minister. The Christian Democratic Union and the Social Liberal Party are the two big parties and usually need smaller partners to govern. \nThe present king, Toavina II, succeeded the first king, Toavina I, and the heir is Crown Princess Elise. The Parliament of the Kingdom has 51 seats, elected across the whole country as one constituency by largest remainder, with no threshold; by convention the King appoints as prime minister the party leader who can command a majority and accepts the cabinet the prime minister proposes. At the last election, on a turnout of 74.2%, the Christian Democratic Union won 19 seats and governs in coalition with the Kingdom Party's 8 under the Prime Minister, Rivo Rajaona; the Social Liberal Party won 16 and its leader, Lalao Rahary, leads the opposition, and the Seafarers' and Fishers' Party also holds 8. About 62% of the people are Protestant and about a quarter Catholic. The Royal Miraka Armed Forces and the Miraka Coast Guard number about 5,000, all volunteers, built around patrol ships that rescue refugees at sea and fight smuggling; the kingdom's backer is the United States.\nMiraka is one of the freest countries on the island: the press is free, the courts independent and royal spending is approved by parliament. Its economy rests on tourism, fishing, tropical farming and offshore services, with income of about 22,000 dollars a head. English-style villages, Anglican churches and the changing of the royal guard draw visitors from all over the world, and Mirakans like to call their country 'the quietest place on the island'. \nThe kingdom belongs to the Covenant League and leans towards Ambohara and Nusira, but keeps a moderate line and often hosts talks between the sides. During the Highland and West Coast Wars great numbers of refugees fled to Miraka by boat; the kingdom set up a reception centre west of the capital that houses some 35,000 people, and its patrol ships often rescue refugee boats in distress. Relations with the Katora Chartered Territory to the west are tense, and Miraka has protested when Katora's mercenaries trained across the boundary. On the King's birthday every year the capital holds a parade and a naval review, and the whole country has a day off.\nCricket is the national game and at weekends there are always players in white on the village greens; fish baked with pineapple is a fixture of festive tables, the whole fish covered with slices of caramelised pineapple."
