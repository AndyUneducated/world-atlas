  names: {zh: 马卡拉, en: Makara, art-x-kasiri: Makara}
  notes:
    zh: "马卡拉是努西拉苏丹国西岛上的渔港和油气补给基地，也是苏丹国三座城市之一，另外两座是中岛上的首都努西拉和东岛的海滨度假城镇达兰。马卡拉的市境就是整座西岛，面积约 2800 平方公里，人口约 15 万。岛上地势低缓，最高处只有 393 米，港城建在海拔不到 50 米的海湾边，四周是珊瑚礁和浅海。这里属热带季风气候，年均气温 24 摄氏度，年降水约 2300 毫米，雨季在五月到十月，八月最湿，二月最干。\n很久以前，卡西里商人驾着单桅帆船在群岛之间贩运珍珠和香料，马卡拉是他们歇脚补水的港湾，岛上的渔民世代在礁盘上捕鱼。近海的油气田被发现后，马卡拉成了海上钻井平台的后方，海上钻井平台的工人从这里换班。港口旁的马卡拉海上油气补给基地是一片码头和仓库，为平台运送燃料、淡水、食品和设备，码头上堆满了钻杆和集装箱，二十四小时作业；工人们从这里乘直升机或交通船去平台，在海上一待就是几个星期。努西拉工商会的会长哈米西·姆巴拉克出身于一个以珍珠和香料贸易起家的商人家族，如今经营着马卡拉最大的海上补给公司；工商会主张在马卡拉扩建转运港，这是政府「后石油愿景」的一部分。\n渔业和港口航运是马卡拉的两大行业，第一产业占 18%，第二产业占 26%，人均生产总值约 3.27 万美元，在全岛名列前茅，但低于首都。马卡拉鱼市就在港口旁，每天凌晨渔船靠岸后开市，金枪鱼、石斑鱼、龙虾和章鱼按重量拍卖，一个小时内就能卖完，冷库里的鱼供应首都的餐馆和出口加工厂。岛上的淡水来自首都的海水淡化厂。\n苏丹集立法、行政和司法大权于一身，国内禁止政党活动，公开批评王室会被判处监禁。马卡拉的市政局长扎瓦迪·哈马迪由苏丹任命，和多数市政局长一样出自六个世家之一。公民享有免费医疗、教育和住房补贴，不缴所得税；码头和平台上的许多重活则由外籍劳工承担，他们没有公民权，工作签证与雇主绑定，劳工组织指责一些公司扣押外籍劳工的护照。\n居民 85% 以卡西里语为母语，12% 讲拉诺瓦语，识字率约 90%，平均预期寿命约 77 岁。鱼市旁的小饭馆早上六点就开门，渔民、码头工人和刚下平台的工人坐在一起喝鱼汤；周五聚礼之后，各家围坐吃椰枣羊肉饭。开斋节和登基纪念日是一年里最热闹的日子，港里的老帆船挂上彩旗，年轻人驾着传统帆船在海湾里练习，准备去首都参加帆船赛。市花是马鞍藤，市树是椰子树，城旗上蓝色海浪里那座白色钻井架，就是天边隐约可见的海上平台。"
    en: "Makara is the fishing port and offshore supply base on the western island of the Sultanate of Nusira, one of the sultanate's three cities, the others being the capital, Nusira, on the central island and the seaside resort of Daran on the eastern island. Makara's bounds are the whole of the western island, covering about 2,800 km² with some 150,000 people. The island is low, its highest point only 393 m, and the port stands below 50 m on a bay ringed by coral reefs and shallow sea. The climate is tropical monsoon, with a mean temperature of 24 °C and about 2,300 mm of rain a year; the rains fall from May to October, August is the wettest month and February the driest.\nLong ago Kasiri merchants sailing dhows between the islands traded in pearls and spices, and Makara was the bay where they rested and took on water, while the island's fishermen worked the reef flats for generations. Once the offshore oil and gas fields were found, Makara became the shore base for the drilling platforms, where the platform crews change shifts. The Makara Offshore Supply Base beside the harbour is a stretch of quays and warehouses that ships fuel, fresh water, food and equipment out to the platforms, its quays piled with drill pipe and containers and working round the clock; the crews fly out by helicopter or go by crew boat from here and stay at sea for weeks at a time. Hamisi Mbarak, president of the Nusira Chamber of Commerce and Industry, comes from a merchant family that made its fortune in pearls and spices and now runs Makara's largest offshore supply company; the chamber wants a bigger transhipment port at Makara, part of the government's \"post-oil vision\".\nFishing and port shipping are Makara's two main trades; the primary sector makes up 18% and industry 26%, and output per head is about $32,700, among the highest on the island though below the capital's. The Makara Fish Market stands beside the harbour and opens each day before dawn when the boats come in; tuna, grouper, lobster and octopus are auctioned by weight and sold out within an hour, and fish from its cold store supplies the capital's restaurants and the export processing plants. The island's fresh water comes from the desalination plant in the capital.\nThe Sultan holds legislative, executive and judicial power in his own hands, political parties are banned, and public criticism of the royal family is punished with prison. Makara's Director of the Municipality, Zawadi Hamadi, is appointed by the Sultan and, like most directors, comes from one of the six great families. Citizens enjoy free health care, education and housing allowances and pay no income tax, while much of the heavy work on the quays and the platforms is done by foreign workers who have no citizenship and whose work visas are tied to their employers; labour groups accuse some companies of holding foreign workers' passports.\nEighty-five per cent of the people speak Kasiri as their mother tongue and 12% Ranovan; literacy is about 90% and life expectancy about 77 years. The little eating houses beside the fish market open at six in the morning, where fishermen, dockers and crews just off the platforms drink fish soup together; after Friday prayers families sit down to lamb and date rice. Eid al-Fitr and Accession Day are the liveliest days of the year: the old dhows in the harbour are hung with flags, and young men sail traditional dhows round the bay in practice for the race in the capital. The city flower is the beach morning glory and the city tree the coconut palm, and the white derrick among the blue waves of the city flag is the offshore platform faintly visible on the horizon."
