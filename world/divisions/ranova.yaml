  names: {zh: 安科里卡, en: Ankorika, art-x-ranova: Ankorika}
  notes:
    zh: "安科里卡是阿瓦拉齐社会主义共和国东海岸的第二港口，城市沿河口展开。市域约 2 万平方公里，地势低平，最高处只有 340 米，人口约 50 万。这里属热带季风气候，年均气温 23.7 ℃，年降水约 2930 毫米，八月最湿，二月最干。市旗是红、白、绿三条竖带，白带中一艘红色小船：红绿两色来自国旗，小船代表河口的渔船和罐头厂。市花是黄蝉，市树是面包树。\n城市由市人民委员会管理，委员会由国家人民议会任命，执行共产党市委的决定，主席齐里·拉扎芬德拉贝通常也兼任市委第一书记。大分裂时，共产党领导工人赤卫队接管了北方的港口和矿山，大中企业全部收归国有，河口的罐头厂和糖厂从此成了国营大厂。\n经济以港口航运和食品水产加工为主，第二产业约占 36%，服务业约占 58%，人均产值约 4800 美元。安科里卡鱼类罐头厂是全国最大的水产加工厂，生产金枪鱼罐头和冷冻鱼片，出口到岛上各国和海外，一千多名工人大多是附近渔村的妇女，捕鱼旺季三班倒，厂区周围弥漫着鱼和盐的味道。安科里卡制糖厂是全国最大的糖厂，榨季收购周边种植园的甘蔗，生产原糖和糖蜜，满载甘蔗的卡车在厂门外排起长队；糖厂旁的老酒坊用糖蜜酿的朗姆酒在岛上各国都很受欢迎。安科里卡沿海经济区是全国对外开放的试验区，外国企业享受低税率，区内有服装厂、电子装配厂和水产加工厂，工资比国营工厂高出一倍。\n兄弟铁路从首都沃希马希沿东海岸南下，经安科里卡站，过友谊口岸到马索沃利的首都安德里安巴，全长三百多公里，是两国之间唯一的铁路，也是物资往来的主要通道。信风 160 型列车时速 160 公里，线上有一座 1.3 公里长的安科里卡高架桥；经济区的服装和罐头搭它运到沃希马希装船，高峰时段每二十分钟一班，乘客须持两国签发的通行证。东海岸公路沿海穿城，北到沃希马希，南经马索沃利一路通到塔马塔；经济区与港口之间有专用公路，9.3 公里长的安科里卡制糖厂公路通往糖厂。\n安科里卡海岸巡逻基地停泊着人民海军的巡逻快艇和搜救船，负责沿海巡逻、缉私、渔业执法和海上搜救，风暴来临前巡逻艇会出海通知渔船回港；近年来它频繁出动，拦截偷渡和走私的快艇，因为不少年轻人想方设法出海谋生。\n居民九成以上说拉诺瓦语，平均预期寿命 67.5 岁，识字率约 79%，成年人都要参加工农赤卫队。榨季和捕鱼旺季重叠的几个月，全城像在一起加班，烟囱日夜冒着白烟，下了夜班的工人到河口边的小饭馆喝一杯本地朗姆酒，配一碟炸鱼。国营商店门口常年排队，但经济区开放后，港口附近冒出了允许私人经营的小商店和小吃摊，城市渐渐热闹起来。"
    en: "Ankorika is the second port on the east coast of the Socialist Republic of Avaratsy, spread along an estuary. Its territory of some 20,000 km² is low and flat, rising no higher than 340 m, and it has about 500,000 people. The climate is tropical monsoon, with a mean temperature of 23.7 °C and some 2,930 mm of rain a year; August is the wettest month and February the driest. The city flag has three vertical stripes of red, white and green with a small red boat on the white: the red and green come from the national flag, and the boat stands for the estuary's fishing boats and canneries. The city flower is the allamanda and the city tree the breadfruit tree.\nThe city is run by the City People's Committee, appointed by the National People's Assembly to carry out the decisions of the Communist Party city committee; its chairman, Tsiry Razafindrabe, usually also serves as the city committee's first secretary. In the Sundering, the workers' Red Guards led by the Communist Party took over the ports and mines of the north, all large and medium enterprises were nationalised, and the cannery and sugar mill on the estuary became great state-owned works.\nThe economy rests on the port and shipping and on food and fish processing; industry accounts for about 36% and services about 58%, and output per head is about US$4,800. The Ankorika Fish Cannery is the largest fish-processing plant in the country, producing tinned tuna and frozen fish fillets for the other states of the island and overseas; most of its thousand-plus workers are women from nearby fishing villages, in the fishing season it runs three shifts, and the air around it smells of fish and salt. The Ankorika Sugar Mill is the largest in the country, buying cane from the surrounding plantations in the crushing season to make raw sugar and molasses, and lorries piled with cane queue outside its gates; the old distillery beside it makes a molasses rum popular in every country on the island. The Ankorika Coastal Economic Zone is the country's trial ground for opening up: foreign firms enjoy low taxes, and its garment factories, electronics assembly plants and fish-processing works pay twice the wages of state factories.\nThe Fraternity Railway runs south from the capital, Vohimahy, along the east coast through Ankorika Station and across the Friendship Crossing to Andriamba, the capital of Masovoly. A little over 300 km long, it is the only railway between the two countries and the main route for goods between them. Tradewind 160 trains run at 160 km/h, and the line includes the 1.3 km Ankorika Viaduct; clothing and tinned goods from the economic zone ride it to Vohimahy for shipping, trains run every twenty minutes at peak times, and passengers need passes issued by both countries. The East Coast Road runs through the city along the shore, north to Vohimahy and south through Masovoly all the way to Tamata; a dedicated road links the economic zone with the port, and the 9.3 km Ankorika Sugar Mill Road leads to the mill.\nThe Ankorika Coastal Patrol Base is home to the People's Navy's fast patrol boats and rescue vessels, which handle coastal patrols, anti-smuggling work, fisheries enforcement and sea rescue; before a storm the patrol boats go out to call the fishing boats home. In recent years they have been out often to stop the speedboats of people-smugglers and smugglers, since many young people try every means to make a living overseas.\nMore than nine in ten residents speak Ranovan, life expectancy is 67.5 years and literacy about 79%, and every adult must serve in the Workers' and Peasants' Red Guards. In the months when the crushing season and the fishing season overlap, the whole city seems to be on overtime and the chimneys smoke day and night; workers coming off the night shift stop at the small eateries on the estuary for a glass of local rum and a plate of fried fish. Queues outside state shops are a permanent feature, but since the economic zone opened, small private shops and food stalls have sprung up around the port, and the city has gradually grown livelier."
