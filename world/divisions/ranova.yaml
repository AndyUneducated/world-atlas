# ── 瓦罗纳商业共和国 ──
- id: div_hxyyfe
  subtype: locality
  parent: div_p735rv
  role: nation
  status: generated
  names: {zh: 瓦罗纳商业共和国, en: Merchant Republic of Varona, art-x-ranova: Repoblika Mpivarotr'i Varona}
  short_names: {zh: 瓦罗纳, en: Varona}
  notes: {zh: '瓦罗纳商业共和国是拉诺瓦岛西北外海的城邦，距离本岛北端不远，由一座主岛和东北面的一座小岛组成，面积约三千一百平方公里，人口约一百一十万，是全岛人口最密集的地方。全国只有瓦罗纳一座城市，高楼、船厂和集装箱码头密密麻麻地挤在岛上，转口港把本岛各国和海外的航线连接在一起。

      瓦罗纳在联合共和国时期就是西北最大的商港，由几个世代经营航运的商人家族主导。大分裂时，商人们组织城市卫队守住了港口，宣布建立商业共和国，并以「对所有人开放港口」为国策，交战各方的商船都可以在此停靠。共和国的大议会由全体公民选举产生，执政官由大议会从议员中选出，任期六年，不得连任。三大商会在议会中拥有大量席位，议会政治由自由商人党、海员工党等政党竞争。

      瓦罗纳是世俗协约的成员，在协约中扮演「钱袋」和「港口」的角色，许多协约成员的进出口都经由瓦罗纳转运。共和国保障言论和新闻自由，法律体系以商法见长，国际仲裁庭设在这里。人均收入约五万二千美元，但住房极其紧张，普通家庭住在狭小的高层公寓里，房价是全岛最高的。

      共和国与努西拉苏丹国在海上航道和渔业上存在竞争，两国的海军偶尔在海上对峙。瓦罗纳人以精明和务实著称，他们说「战争会结束，生意不会」。每年春季的海神节，几百艘装饰一新的船只在港内巡游，执政官把一枚金戒指投入大海，象征共和国与海洋的婚约。', en: "The Merchant Republic of Varona is a city-state off the north-west of Ranova, not far from the northern end of the main island: a main island and a small one to its north-east covering some 3,100 km² with about 1.1 million people, the most densely settled place on the island. Varona is its only city, towers, shipyards and container quays crowded together on the island, and its entrepôt links the trade routes of the island's states with those overseas. \nUnder the United Republic Varona was already the largest port in the north-west, led by a few families who had been in shipping for generations. In the Sundering the merchants raised a city guard to hold the port and proclaimed a merchant republic whose policy was 'a port open to all', so that ships of every warring side could call. The Great Council is elected by all citizens, and the Doge is chosen by the council from among its members for six years and may not serve again. The three great merchant houses hold many seats, and council politics is a contest between parties such as the Free Merchants and the Seafarers' Labour Party. \nVarona belongs to the Secular Accord, where it plays the part of 'purse and port': many members' imports and exports pass through it. It guarantees freedom of speech and the press, its legal system is strongest in commercial law, and an international arbitration court sits here. Income is about 52,000 dollars a head, but housing is extremely tight; ordinary families live in cramped high-rise flats, and property prices are the highest on the island. \nThe Republic competes with the Sultanate of Nusira over sea lanes and fisheries, and their navies occasionally face off at sea. Varonese are known for being shrewd and practical; they say that 'wars end, business doesn't'. At the Sea Festival every spring hundreds of decorated boats parade round the harbour and the Doge throws a gold ring into the sea, a sign of the Republic's marriage to the ocean."}
