  notes:
    zh: "安博维共和国位于拉诺瓦岛中部偏西，夹在贝洛瓦、萨希利亚、安博哈拉和伊索卡解放区之间，面积约三万四千平方公里，人口约五十万，有首都安博维和东部的拉诺马两座城市。国土是湿润的丘陵和河谷，香草、可可和胡椒种植园遍布山坡，雨林边缘散落着许多简易机场。\n共和国在大分裂后由当地的香草种植园主建立，宪法规定实行总统制和多党选举，表面上与其他共和国无异。然而三十多年来，控制香草出口的三个大家族逐渐把生意扩展到走私和违禁品，形成了被称为「三家族」的卡特尔。卡特尔出资支持国民团结党和共和自由党，两党轮流执政，总统、法官和将领多由卡特尔提名，选举前夕常有候选人退选或失踪。安博维因此被国际观察者称为「毒品国家」。\n现任总统是卡洛·拉辛巴。国会 100 席中，国民团结党占 62 席，共和自由党 30 席，无党派 8 席。最高法院有 7 名法官，由总统提名、国会批准；三十多年来，涉及卡特尔的重大案件大多以撤诉或无罪告终，多名坚持审理的法官遇害或流亡。安博维国民军只有约五千人，18 至 24 岁的男性名义上要服 12 个月兵役，实际很少征召，富裕家庭可以缴费免役；真正的武力在三家族护卫队手中，这支私人武装装备精良，拥有多架轻型飞机，从棚户区招募青年，据报道其中有不满 16 岁的少年。约 52% 的居民信奉天主教，祖灵信仰约占 22%，新教约占两成。卡特尔之间的暴力和绑架时有发生，外国游客被提醒夜间不要出行，也不要前往庄园区。国旗是蓝白蓝三色，中央一朵绿色香草花，民间戏称它「白色在中间」，暗指另一种白色的货物。\n违禁品经由香草园之间的简易机场和东海岸的快艇运往岛外，收入通过萨拉卡公国的赌场和银行洗白，再投入首都山上的别墅、赌场和私人诊所。共和国的人均收入约七千美元，在中部国家中名列前茅，但财富集中在少数家族手中，山下的棚户区缺水缺电，暴力犯罪率是全岛最高的之一。\n安博维不加入任何阵营，同时与几方做生意：向祖源轴心出售燃料和武器，向圣约同盟和世俗协约的商人出售香草，与萨拉卡和卡托拉保持密切的金融和安保合作。邻国贝洛瓦对其发动过多次缉毒行动，双方的冲突在一次停火后冻结；伊索卡游击队也常越境袭击卡特尔的种植园。每年香草收获季，首都举行盛大的香草节，三家族的家长坐在主席台上，与总统并排观看游行。\n香草节上最抢手的是香草鸡，鸡肉用椰奶和整根香草荚慢炖，满城飘着甜香。"
    en: "The Republic of Ambovy lies west of the middle of Ranova, between Belova, Sahiliya, Ambohara and the Isoka Liberated Zone, some 34,000 km² with about 500,000 people in two cities, the capital, Ambovy, and Ranoma in the east. It is a country of humid hills and valleys, vanilla, cocoa and pepper plantations cover the slopes, and many airstrips are scattered along the edge of the rainforest. \nThe Republic was founded after the Sundering by the local vanilla planters, and its constitution provides for a presidential system and multi-party elections, so that on the surface it looks like any other republic. Over thirty years, however, the three great families that control vanilla exports extended their business into smuggling and contraband and became the cartel known as the 'Three Families'. The cartel funds the National Unity Party and the Republican Liberal Party, which take turns in office; presidents, judges and generals are mostly its nominees, and candidates often withdraw or vanish on the eve of an election. International observers call Ambovy a narco-state. \nThe present President is Karlo Rasimba. Of the 100 seats in Congress, the National Unity Party holds 62, the Republican Liberal Party 30 and independents 8. The Supreme Court has seven judges, nominated by the President and confirmed by Congress; over more than thirty years most major cases involving the cartel have ended in dropped charges or acquittals, and several judges who insisted on hearing them have been murdered or driven into exile. The Ambovy National Army has only about 5,000 soldiers; men aged 18 to 24 nominally owe twelve months of service, but few are called up and wealthy families can pay for exemption. Real force lies with the Three Families' Guards, a well-equipped private army with several light aircraft that recruits young men from the shanty towns, including boys under 16 according to reports. About 52% of the people are Catholic, ancestral religion claims about 22% and Protestants about a fifth. Violence between the cartel families and kidnappings are common, and foreign visitors are advised not to go out at night or visit the plantation districts. The national flag is blue, white and blue with a green vanilla flower at the centre, and people joke that it has \"the white in the middle\", a nod to another white cargo.\nContraband leaves the island by the airstrips among the vanilla gardens and by speedboat from the east coast, the money is laundered through the casinos and banks of the Principality of Saraka and then spent on the villas, casinos and private clinics on the capital's hill. Income is about 7,000 dollars a head, high for the central states, but wealth is concentrated in a few families, the shanty towns below the hill lack water and power, and violent crime is among the highest on the island. \nAmbovy joins no bloc and does business with several: it sells fuel and arms to the Origin Axis and vanilla to merchants from the Covenant League and the Secular Accord, and works closely with Saraka and Katora on finance and security. Neighbouring Belova has mounted several anti-narcotics operations against it, a conflict frozen after a ceasefire, and the Isoka guerrillas often cross the border to raid the cartel's plantations. At the vanilla festival each harvest the heads of the Three Families sit on the reviewing stand beside the president to watch the parade.\nThe most sought-after dish at the Vanilla Festival is vanilla chicken, slow-cooked in coconut milk with whole vanilla pods, and the whole town smells sweet."
