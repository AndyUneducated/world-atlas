  notes:
    zh: "安博维是安博维共和国的首都，坐落在拉诺瓦岛中部偏西湿润的丘陵和河谷之间，离海两百多公里。市域约 1.8 万平方公里，最高处海拔 434 米，人口约 33 万。这里属热带草原气候，年均气温 23.8 ℃，年降水约 1100 毫米，雨季集中在五到十月。城市一分为二：豪华别墅、赌场和私人诊所集中在山上的富人区，山下是拥挤的棚户区。\n共和国由当地的香草种植园主在大分裂后建立，宪法规定实行总统制和多党选举。总统府、国会大厦和最高法院分踞旧城中央广场的北、东、南三侧，但真正的决定往往在城外的庄园里做出。总统府是一座粉色外墙的两层宅邸，总统卡洛·拉辛巴在这里办公，夜里的灯却常常早早熄灭。一百名议员在带拱廊的国会大厦开会，选举前夜广场上有乐队和免费的烤肉。最高法院门廊上的天平雕塑掉了一只秤盘，大厅里挂着一位调查卡特尔案件时遇刺的法官的照片。市长米亚利·兰德里亚马纳纳和市政委员会由总统任命，宪法规定的市议会选举从未举行。\n城外山坡上的拉科托庄园和安德里亚庄园属于控制香草出口的「三家族」，高墙内有白色大宅、人工湖和私人跑道，当地人说，香草收购价、警察局长人选甚至国会法案都在这里的晚宴上定下来。国际调查报告指认这些家族参与毒品转运和洗钱，国际观察者因此称安博维为「毒品国家」。\n经济以商贸、香料与可可为主，服务业约占 71%，人均产值约 7110 美元，但财富集中在少数家族手中。安博维香草种植园的每朵花都要在开放当天上午由工人用竹签人工授粉，豆荚要经烫煮、日晒和数月发酵，上等香草荚比白银还贵。全岛最大的安博维香草交易所名义上由政府管理，价格却由「三家族」操控；城外的香草出口仓库日夜有保安看守，部分出口货柜里曾查获毒品。安博维大赌场金色圆顶下有上千台老虎机，二十四小时营业，税收是政府的主要收入之一。安博维商业银行大厦高两百多米，是城里最高的楼。\n香草公路从西海岸的贝洛瓦向东，经安博塔的甘蔗田进入安博维的香草产区，再经拉诺马的森林上到安德里纳高原，全长约 540 公里。收获季节，满载香草荚的卡车由武装保安护送开往贝洛瓦港，路边的检查站比加油站还多。\n居民九成以上说拉诺瓦语，平均预期寿命 66.0 岁。山顶私人诊所的治疗费是普通人一年收入的许多倍，山下几万人住在铁皮和木板房里，缺自来水和下水道，许多人在香草园打零工或为卡特尔跑腿。圣母升天节，信众抬着圣像从安博维圣母主教座堂出发绕城游行；香草节上，「三家族」的家长与总统并排坐在主席台上看游行。市旗蓝底白印，印心是深蓝色的总统府塔楼，民间却说真正的印章盖在城外的庄园里。"
    en: "Ambovy is the capital of the Republic of Ambovy, set among the humid hills and river valleys of west-central Ranova, more than two hundred kilometres from the sea. Its territory of some 18,000 km² rises no higher than 434 m, and it has about 330,000 people. The climate is tropical savanna, with a mean temperature of 23.8 °C and about 1,100 mm of rain a year, falling mostly from May to October. The city is split in two: luxury villas, casinos and private clinics cluster in the wealthy district on the hill, and below lie crowded shanty towns.\nThe republic was founded after the Sundering by local vanilla planters, and its constitution provides for a presidential system and multi-party elections. The Presidential Palace, the Congress Building and the Supreme Court stand on the north, east and south sides of the old town's central square, but the real decisions are often taken on the estates outside the city. The palace is a pink-walled two-storey mansion where President Karlo Rasimba works, and yet its lights often go out early at night. The hundred members of Congress sit in the arcaded Congress Building, and on election nights the square fills with bands and free barbecues. The scales on the Supreme Court's portico have lost a pan, and in its hall hangs a photograph of a judge assassinated while investigating the cartel. The mayor, Mialy Randriamanana, and the Municipal Board are appointed by the President; the council elections the constitution provides for have never been held.\nThe Rakoto Estate and the Andria Estate on the hillsides outside town belong to the 'Three Families' who control vanilla exports. Behind high walls are white mansions, artificial lakes and private airstrips, and locals say that vanilla prices, the choice of police chief and even bills before Congress are settled at dinners here. International investigations name these families as involved in drug trafficking and money laundering, and international observers therefore call Ambovy a 'narco-state'.\nThe economy rests on commerce, spices and cocoa; services account for about 71% and output per head is about US$7,110, but the wealth is concentrated in a few families. At the Ambovy Vanilla Plantation every flower must be pollinated by hand with a bamboo sliver on the morning it opens, and the pods are scalded, sun-dried and cured for months; the finest beans are worth more than silver. The Ambovy Vanilla Exchange, the largest on the island, is nominally run by the government, but prices are rigged by the Three Families; the Vanilla Export Warehouses outside town are guarded day and night, and drugs have been found in some export containers. Beneath the golden dome of the Ambovy Grand Casino are more than a thousand slot machines, open around the clock, and its taxes are one of the government's main sources of revenue. The Ambovy Commercial Bank Tower, more than two hundred metres high, is the tallest building in the city.\nThe Vanilla Road runs east from Belova on the west coast through the cane fields of Ambota into Ambovy's vanilla country, then through the forests of Ranoma up onto the Andrina Highlands, some 540 km in all. At harvest time lorries piled with vanilla pods drive to the port of Belova under armed escort, and there are more checkpoints along the road than petrol stations.\nMore than nine in ten residents speak Ranovan, and life expectancy is 66.0 years. Treatment at the Hilltop Private Clinic costs many times a year's ordinary income, while in the lower town tens of thousands live in houses of tin and planks without running water or sewers, many of them doing casual work on the vanilla plantations or running errands for the cartel. On the Feast of the Assumption the faithful carry the statue of the Virgin from Ambovy Cathedral of Our Lady in procession around the city, and at the Vanilla Festival the heads of the Three Families sit beside the President on the reviewing stand to watch the parade. The city flag bears a white seal on blue with the dark blue tower of the Presidential Palace at its centre, though people say the real seal is stamped on the estates outside town."
