  names: {zh: 姆吉尼, en: Mjini, art-x-kasiri: Mjini}
  notes:
    zh: "姆吉尼是萨希利亚伊斯兰共和国内陆的农业城市，丁香和腰果种植园遍布丘陵。全市人口约 42 万，辖区约 2.2 万平方公里，地势从海岸平原背后的丘陵向东抬升，平均海拔 404 米，最高处 803 米。气候属热带草原型，年均气温 22.7 ℃，年降水约 1343 毫米，一月到三月是干季，正是丁香采摘晒干的时候。北面靠近贾巴利亚，军队在山口设有据点。\n西海岸自古是卡西里商人的家园，内陆的丘陵则是他们的香料园，丁香和腰果经帆船运往岛上各地。大分裂后，北部山区的贾巴利亚武装斥共和国为「背教者的国家」，西岸战争由此爆发，三十多年来时断时续，姆吉尼和北部的扎纳拉多次遭到袭击。城郊的姆吉尼兵营驻有陆军第二步兵旅，几十座营房围着大操场排开，部队守卫着通往北方的山口，每年新兵入伍时，家属们在营门外送别。共和国收容了八万多名来自北部和邻国的难民，不少人在姆吉尼的种植园里打工。\n姆吉尼丁香种植园沿丘陵的缓坡展开，几千棵丁香树排列成行，每年旱季，采摘工人爬上竹梯，在花蕾变红之前把它们摘下，摊在路边的草席上晒干，整个山谷都飘着丁香的香气。丁香是萨希利亚最重要的出口商品之一，多由合作社收购后运往港口。腰果园占据了更远的坡地，果实的外壳要烤过才能剥开。种植业占全市经济的 43%，人均产值约 4980 美元。\n领道 S-RA-104 横贯公路从首都萨希勒向东穿过这里的香料种植区，再爬上安德里纳高原通往安博哈拉，是全岛贯通东西海岸的两条公路之一。公路东端的姆吉尼口岸是萨希利亚与安博哈拉之间的口岸，两国同属圣约同盟，边检手续简便，援助车队和运香料的卡车可以快速通过；口岸旁有一座小清真寺和一座小教堂，相距不过百米，过境的旅客常在两处各停一会儿。\n姆吉尼是民选城市，市议会 29 席，伊斯兰公正党 13 席，与海岸民族党（8 席）联合执政，人民劳动党 8 席；市长萨利姆·阿图马尼来自伊斯兰公正党，议长是姆瓦奈莎·阿图马尼。居民 83% 以卡西里语为母语，13% 说拉诺瓦语，人均预期寿命 63.9 岁，识字率 76.6%。\n丁香季是全城最忙也最香的时候，学校放假一周，孩子们跟着父母上山，路边的草席一眼望不到头。合作社收购站前排着驮满麻袋的摩托车，茶摊老板说，从口袋里飘出的香味就能分辨今年的成色。星期五聚礼后，男人们在清真寺外的树荫下喝丁香茶，开斋节家家做香料鱼饭。山口的哨所夜里亮着灯，种植园的老人说，看见灯亮才睡得踏实。市花是腰果花，市树是丁香树；市旗旗杆一侧是绿色三角，三角中一枝白色香料就是丘陵上的丁香，褐色横带是腰果园的土地。"
    en: "Mjini is the inland farming city of the Islamic Republic of Sahiliya, with clove and cashew plantations across the hills. It has about 420,000 people and some 22,000 km² of territory, rising eastwards from the hills behind the coastal plain, with a mean elevation of 404 m and a high point of 803 m. The climate is tropical savanna: the mean temperature is 22.7 °C and the annual rainfall about 1,343 mm, with a dry season from January to March, just when the cloves are picked and dried. It is close to Jabaliya in the north, and the army holds posts in the passes.\nThe west coast has always been home to Kasiri merchants, and the hills inland were their spice gardens, sending cloves and cashews by dhow around the island. After the Sundering the Jabaliya militants in the northern hills denounced the Republic as \"a state of apostates\" and rose in revolt, setting off the West Coast War, which has flared on and off for more than thirty years, with Mjini and Zanara in the north attacked many times. The Mjini Barracks on the outskirts house the army's 2nd Infantry Brigade, dozens of huts round a large parade ground, and its troops guard the passes to the north; each year when the new recruits join, their families see them off at the gate. The Republic shelters more than 80,000 refugees from the north and neighbouring states, and many of them work on Mjini's plantations.\nThe Mjini Clove Plantation spreads over the gentle slopes of the hills, thousands of clove trees in rows; every dry season the pickers climb bamboo ladders to pick the buds before they turn red and spread them to dry on mats by the road, and the whole valley smells of cloves. Cloves are among Sahiliya's most important exports, mostly bought by cooperatives and sent to the port. Cashew orchards cover the farther slopes, and the nuts must be roasted before their shells can be cracked. Farming makes up 43% of the economy, and output per head is about US$4,980.\nThe Cross-Island Road, territorial road S-RA-104, runs east from the capital, Sahil, through the spice-growing country here and climbs onto the Andrina Highlands to Ambohara, one of the two roads on the island from coast to coast. The Mjini Crossing at the eastern end is the border crossing between Sahiliya and Ambohara; both belong to the Covenant, so formalities are simple and aid convoys and spice lorries pass quickly, and beside the crossing stand a small mosque and a small church barely a hundred metres apart, where travellers often stop a while at each.\nMjini elects its council. Of the 29 seats the Islamic Justice Party holds 13 and governs with the Coast National Party (8), while the People's Labour Party has 8; the mayor, Salim Athumani, belongs to the Islamic Justice Party, and the speaker is Mwanaisha Athumani. Kasiri is the mother tongue of 83% of residents and Ranova of 13%; life expectancy is 63.9 years and literacy 76.6%.\nThe clove season is the busiest and most fragrant time of year: schools close for a week, children go up the hills with their parents, and the drying mats along the roads stretch out of sight. Motorbikes loaded with sacks queue at the cooperatives' buying stations, and the tea-stall keepers say they can tell the year's quality from the scent drifting out of the bags. After Friday prayers the men drink clove tea in the shade outside the mosque, and at Eid al-Fitr every family cooks spiced fish pilau. The posts in the passes keep their lights on at night, and old men on the plantations say they sleep easier when they can see them burning. The city flower is the cashew blossom and the city tree the clove; the city flag has a green triangle at the hoist bearing a white sprig of spice, the cloves of the hills, with a brown band for the soil of the cashew orchards."
