  notes:
    zh: "萨希勒是萨希利亚伊斯兰共和国的首都和西海岸最大的港口，名字在卡西里语中意为「海岸」。全市人口约 130 万，辖区约 2.2 万平方公里，从海湾边的平原一直延伸到东面干燥的丘陵，平均海拔 432 米，最高处 1248 米。气候属热带草原型，年均气温 25.3 ℃，年降水约 838 毫米，一月到三月几乎无雨。白色的老城沿海湾展开，大清真寺的宣礼塔和议会大厦的圆顶隔着集市相望，港口的单桅帆船和集装箱船并排停泊，这里是全岛最古老的贸易港。\n西海岸自古是卡西里商人的家园，他们驾着单桅帆船往来于岛屿之间，带来了伊斯兰教、卡西里语和以商会为中心的城市传统。大分裂后，沿海各城的商会、宗教学者和地方议员在这里召开协商会议，宣布成立伊斯兰共和国。老城北端海角上的总统府是一座带回廊的白色石楼，围着种满柠檬树的庭院，总统优素福·卡西姆在这里接见使节；国民议会大厦的议事厅以蓝白瓷砖装饰，一百零一名议员用卡西里语和拉诺瓦语辩论；大清真寺可容一万人，旁边回廊院落里的宗教学者委员会以温和的教法解释著称。\n萨希勒港装卸香料、盐和进口的粮食、燃料，圣约同盟的援助船也在这里停靠，老港区保留着古老的商行和一座白色灯塔，新港区是集装箱码头。老城集市在清真寺和议会之间，几百家店铺卖香料、丁香、乳香、铜器、织锦和金饰。服务业占全市经济的 85%，人均生产总值约 7080 美元。萨希勒大学有一万多名学生。城郊驻有陆军司令部和第一步兵旅，萨希勒空军基地有一条三千米的跑道，两架战机全天候待命，海军基地护卫着港口。\n萨卡铁路从萨希勒站出发，沿海岸平原南下到班达里，再折向内陆的卡西里，信风 160 型列车全程两个多小时。领道 S-RA-103 西海岸公路沿海岸南北贯通，S-RA-104 横贯公路从这里向东爬上安德里纳高原，是全岛贯通东西海岸的两条公路之一。萨希勒国际机场在北面的海边平原上，是西海岸最繁忙的机场。\n市议会 37 席，海岸民族党 16 席，与伊斯兰公正党（12 席）联合执政，人民劳动党 9 席，市长阿米娜·奥马里来自海岸民族党。居民 54% 以卡西里语为母语，英语、拉诺瓦语和汉语也很常见，人均预期寿命 68.3 岁，识字率 82.3%。日落后，集市的茶馆里坐满下棋和谈生意的人，黄昏时码头上的宣礼声和货轮汽笛交织在一起。斋月的夜晚，海滨的长桌宴会一直持续到黎明，傍晚的列车在日落时停靠车站，乘客下车用椰枣和清水开斋。开斋节家家做香料鱼饭，街头的孩子踢着足球。市花是晚香玉，市树是海枣，市旗海面上的白帆就是港口千年的单桅帆船。"
    en: "Sahil is the capital of the Islamic Republic of Sahiliya and the largest port on the west coast; in Kasiri its name means \"coast\". It has about 1.3 million people and some 22,000 km² of territory, reaching from the plain by the bay to the dry hills in the east, with a mean elevation of 432 m and a high point of 1,248 m. The climate is tropical savanna: the mean temperature is 25.3 °C and the annual rainfall about 838 mm, with almost none from January to March. The white old town spreads round the bay, the minarets of the Great Mosque and the dome of the parliament face each other across the market, and dhows moor beside container ships in the oldest trading port on the island.\nThe west coast has always been home to Kasiri merchants, who sailed their dhows between the islands and brought Islam, the Kasiri language and a civic tradition centred on the merchant guilds. After the Sundering the guilds, religious scholars and local members of parliament of the coastal cities met in consultation here and proclaimed the Islamic Republic. The Presidential Palace on the headland at the north end of the old town is a white stone building with cloisters round a courtyard of lemon trees, where President Yusufu Kasimu receives envoys. The chamber of the National Assembly Building is decorated in blue and white tiles, and its 101 members debate in Kasiri and Ranova. The Great Mosque holds 10,000 worshippers, and the Council of Religious Scholars in the cloistered courtyard beside it is known for its moderate reading of Islamic law.\nThe Port of Sahil handles spices, salt and imported grain and fuel, and Covenant aid ships call here too; the old port keeps its ancient merchant houses and a white lighthouse, while the new port is a container terminal. The Sahil Old Town Souk between the mosque and the parliament has hundreds of shops selling spices, cloves, frankincense, copperware, brocade and gold. Services make up 85% of the economy and output per head is about US$7,080. The University of Sahil has more than 10,000 students. The Army Headquarters and the 1st Infantry Brigade are on the outskirts, Sahil Air Base has a 3,000 m runway with two fighters on alert round the clock, and the naval base guards the port.\nThe Sahil–Kasiri Railway leaves Sahil Station and runs down the coastal plain to Bandari before turning inland to Kasiri; its Xinfeng 160 trains take a little over two hours. The West Coast Road, territorial road S-RA-103, runs north and south along the coast, and the Cross-Island Road, S-RA-104, climbs east from here onto the Andrina Highlands, one of the two roads on the island from coast to coast. Sahil International Airport on the coastal plain to the north is the busiest on the west coast.\nThe City Council has 37 seats: the Coast National Party holds 16 and governs with the Islamic Justice Party (12), while the People's Labour Party has 9, and the mayor, Amina Omari, belongs to the Coast National Party. Kasiri is the mother tongue of 54% of residents, and English, Ranova and Chinese are also widely heard; life expectancy is 68.3 years and literacy 82.3%. After sunset the tea houses of the souk fill with people playing chess and doing business, and at dusk the call to prayer on the quays mingles with the horns of the freighters. On Ramadan nights the long-table banquets on the seafront go on until dawn, and evening trains stop at the nearest station at sunset so passengers can step down and break the fast with dates and water. At Eid al-Fitr every family cooks spiced fish pilau, and children kick footballs in the streets. The city flower is the tuberose and the city tree the date palm, and the white sail on the sea of the city flag is the dhow that has sailed from the port for a thousand years."
