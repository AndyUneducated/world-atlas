# ── 太阳神国度 ──
- id: div_zybzvt
  subtype: country
  status: generated
  names: {zh: 太阳神国度, en: Realm of the Sun God, art-x-ranova: Fanjakan'Andriamanitra Masoandro}
  short_names: {zh: 太阳神国, en: Sun God Realm}
  notes: {zh: '太阳神国度位于拉诺瓦岛南部，国土是一条东西走向的狭长山地，西临大海，东接齐马罗沃，北面是大天使军团国和转轮无边法王国，南坡的梯田修到尽头，便是齐阿拉野化邦的森林。面积约一万一千平方公里，人口约六十万，有都城沃沃南德罗、西海岸的港口安西拉和东部的隘口城市瓦瓦哈迪三座城市。海拔约二千四百米的金日山从国土中部横贯东西，山坡上层层叠叠的梯田一直修进云里，种着土豆、金藜和喂养维洛纳驼的牧草；这种长毛驮兽是山里唯一的运输工具。国名来自都城太阳神庙的金墙，每天清晨第一缕阳光照在墙上，全城都能望见。

      金日山的村民自古在高处的梯田上祭祀太阳，都城的太阳神庙由一个守庙的家族世代看护。联合共和国时期，守庙人只是一个礼仪职位，各村的土地仍按习惯法归村社共有。大分裂时道路中断、货币作废、集市无粮，守庙人打开神庙的粮仓，召集各村派人修复梯田、沿山间古道背运粮食，金日山因此熬过了饥荒。各村头人拥立他为「太阳之子」，他把国土分为四方，各设一名总督，恢复了以劳役代替赋税的旧制和用绳结记账的结绳官。现任太阳之子拉韦洛南德罗二世是开国君主的儿子。

      王国的土地属于村社，没有私人庄园：村社每年按人口把耕地分给各家，另有两块田分别为太阳神庙和王家粮仓耕种。百姓不交税，而是轮流为国家服劳役，修路、修梯田、守粮仓、下矿和当兵，每户每年出一名成年人服役一到三个月。国内几乎不用货币，王家粮仓按结绳官的账目把粮食、布匹和工具分配到各村，账目记在彩色绳结上，由结绳官保管和解读。驿卒沿着石砌的王道接力奔跑，传递太阳之子的命令，一条消息一天之内就能从海边送到东部隘口。四方总督会议由四名总督和十六名河谷领主组成，都出自日裔王族，由太阳之子任命，不经竞争性选举。

      王国自称「没有饥饿的国家」，外界也承认这里几乎没有人挨饿或无家可归；但国际劳工机构把轮流劳役视为强迫劳动，村民离开所在的一方须持结绳通行证，批评太阳之子被当作亵渎，国内也没有独立的报纸。王国保持中立，只在安西拉的交易所用黄金、驼毛、土豆和金藜同外国商人换取药品、燃料和枪支。它与北面的转轮无边法王国争夺日门山口，两国的朝圣者和守卫在那里对峙多年；东面的齐马罗沃关闭了大部分边境，从那里逃来的难民住在瓦瓦哈迪城外。外界估计人均收入约一千九百美元。

      每年冬至，太阳之子在日之广场用金镜从第一缕阳光中取火，驿卒连夜把新火沿王道送到每一个村庄，这一夜被称为「太阳回来的夜晚」。', en: "The Realm of the Sun God lies in the south of Ranova, a long, narrow mountain land running east and west, with the sea to the west, Tsimarovo to the east, the Legionary State of the Archangel and the Kingdom of the Boundless Dharma Wheel to the north, and, where the terraces of the southern slopes run out, the forest of the Rewilded Polity of Tsiala. It covers some 11,000 km² with about 600,000 people in three cities: the capital, Vovonandro, the port of Ansira on the west coast and the pass city of Vavahady in the east. The Golden Sun Range, about 2,400 m high, runs east and west through the middle of the country, its slopes terraced tier upon tier into the clouds, growing potatoes, golden goosefoot and fodder for the vilona, a long-haired pack animal that is the only transport in the mountains. The kingdom is named for the golden wall of the Temple of the Sun in the capital: the first light of each morning strikes it, and the whole city can see it. \nThe villagers of the Golden Sun Range have worshipped the sun from their high terraces since time out of mind, and the Temple of the Sun in the capital was kept by one family of temple keepers from generation to generation. Under the United Republic the keeper's was only a ceremonial office, and the villages still held their land in common by customary law. In the Sundering, when the roads were cut, money became worthless and the markets had no grain, the keeper opened the temple granaries and called on every village to send people to repair the terraces and carry grain along the old mountain paths, and so the range came through the famine. The village headmen acclaimed him 'Son of the Sun'; he divided the land into four quarters, each under a governor, and revived the old custom of labour service in place of taxes and the cord-keepers who keep accounts in knots. The present Son of the Sun, Ravelonandro II, is the founder's son. \nThe land belongs to the village communities and there are no private estates: each village shares out its fields among its households every year by the number of mouths, and farms two further fields, one for the Temple of the Sun and one for the royal granaries. People pay no taxes but take turns in labour service to the state, building roads and terraces, guarding granaries, working the mines and serving as soldiers; every household sends one adult for one to three months a year. Money is hardly used at home: the royal granaries share out grain, cloth and tools to the villages by the accounts of the cord-keepers, who keep and read them in coloured knotted cords. Relay runners carry the Son of the Sun's orders along the stone royal roads, and a message reaches the eastern passes from the coast within a day. The Council of the Four Governors is made up of the four governors and sixteen lords of the valleys, all of the royal Sunborn lineage and appointed by the Son of the Sun, not chosen in contested elections. \nThe kingdom calls itself 'the land without hunger', and outsiders agree that almost no one here goes hungry or homeless; but international labour bodies regard the rotating labour service as forced labour, villagers need a knotted-cord pass to leave their quarter, criticism of the Son of the Sun is treated as sacrilege, and there are no independent newspapers. The kingdom is neutral and trades with foreign merchants only at the exchange house in Ansira, giving gold, vilona wool, potatoes and golden goosefoot for medicines, fuel and rifles. It contends with the Kingdom of the Boundless Dharma Wheel to the north for the Sun Gate Pass, where the two countries' pilgrims and guards have faced each other for years; to the east Tsimarovo has closed most of the border, and the refugees who fled from it live outside Vavahady. Income is estimated from outside at about 1,900 dollars a head. \nEvery winter solstice the Son of the Sun kindles fire from the first ray of sunlight with a golden mirror in the Square of the Sun, and relay runners carry the new fire along the royal roads to every village through the night, which is called 'the night the sun comes back'."}
