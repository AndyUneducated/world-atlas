- id: div_p735rv
  subtype: dependency
  role: region
  status: generated
  names: {zh: 拉诺瓦岛, en: Ranova, art-x-ranova: Nosy Ranova}
  notes: {zh: '拉诺瓦岛是太平洋东北部的一座大岛，位于加利福尼亚东南约一千五百公里的海上，主岛面积约一百万平方公里，形状狭长，西北和东南外海各有十多座大小不一的岛屿。岛上地形多样：中部是纵贯南北的安德里纳高原，北端有全岛最高的马洛卡山，东部是陡峭的法拉纳断崖和茂密的热带雨林，西部是稀树草原和干燥的丘陵，西南是多刺灌木林和半荒漠。全岛人口约三千万。

      岛上原本只有一个国家——拉诺瓦联合共和国，它统一了本岛和两侧的群岛，通行拉诺瓦语和沿海的卡西里语。三十多年前，联合共和国在经济危机、地方分离运动和意识形态对立中崩溃，这场崩溃被称为「大分裂」。东南群岛和萨拉卡依据条约和平分离，沿用了联合共和国的船旗样式；本岛则陷入了长期的战乱，先后形成了二十多个国家和武装控制区。

      如今岛上有二十六个政治实体：一个横跨岛屿中部的大国安博哈拉基督教联邦，几个中等国家，以及众多城邦和小国，意识形态从共产主义、资本主义、民族社会主义到伊斯兰共和制、佛教君主制、无政府公社、母系社会和修道院神权，几乎无所不包。它们大致分成三个阵营：以阿瓦拉齐为首的世俗协约、以安博哈拉为首的圣约同盟和以齐马罗沃为首的祖源轴心，其余国家保持中立。中国和美国在岛上都有外交机构和大量投资，并在暗中支持不同的阵营。

      三十多年来，高原战争、南方战争、西岸战争和伊索卡人民战争断断续续，数以十万计的人流离失所，难民营散布在萨马伊、阿拉齐纳、安巴罗、米拉卡、萨希利亚和贝洛瓦。与此同时，马哈维洛、瓦罗纳和萨拉卡的港口与银行从未停止营业，安巴罗国际托管地成为各方谈判的场所。拉诺瓦人常说：「我们曾经是一个国家，如今是一座岛。」', en: "Ranova is a large island in the north-eastern Pacific, some 1,500 km south-east of California. The main island covers about a million square kilometres in a long, narrow shape, with a dozen or more islands of every size offshore to the north-west and south-east. Its landscapes are varied: the Andrina Highlands run down the middle, the Maroka Massif at the northern end is the highest ground, the east is the steep Farana Escarpment and dense rainforest, the west savanna and dry hills, and the south-west spiny thicket and semi-desert. About 30 million people live on the island. \nThere was once a single state, the United Republic of Ranova, which united the main island and the islands on either side and spoke Ranovan and, on the coasts, Kasiri. More than thirty years ago the United Republic collapsed amid economic crisis, regional separatism and ideological conflict, a collapse known as the Sundering. The south-eastern islands and Saraka left peacefully by treaty and kept the pattern of the Republic's ensigns; the main island fell into long years of war, out of which came more than twenty states and armed zones. \nToday the island has twenty-six political entities: one large state, the Christian Federation of Ambohara across the middle of the island, several middle-sized states and many city-states and small countries, whose ideologies run from communism, capitalism and national socialism to Islamic republicanism, Buddhist monarchy, anarchist communes, matrilineal society and monastic theocracy. They fall roughly into three blocs, the Secular Accord led by Avaratsy, the Covenant League led by Ambohara and the Origin Axis led by Tsimarovo, with the rest neutral. China and the United States both keep diplomatic missions and large investments on the island and quietly back different blocs. \nFor more than thirty years the Highland, Southern, West Coast and Isoka wars have flared and died down by turns, hundreds of thousands have been driven from their homes, and refugee camps are scattered across Samay, Alatsina, Ambaro, Miraka, Sahiliya and Belova. Meanwhile the ports and banks of Mahavelo, Varona and Saraka have never closed, and the Ambaro International Trust Territory has become the place where the sides negotiate. Ranovans often say: 'We were once a country; now we are an island.'"}
