- id: div_0a6gt7
  subtype: locality
  parent: div_nyhhhg
  status: generated
  names: {zh: 马扎瓦, en: Mazava, art-x-ranova: Mazava}
  notes:
    zh: "马扎瓦是最神圣的黎明千年国的圣城，也是这个国家唯一的城市，名字意为「光明」。城市坐落在拉诺瓦岛东海岸，背靠法拉纳断崖东坡的雨林，面朝大海，市域约 1.6 万平方公里，从海边伸到海拔 1607 米的山脊，人口约 30 万。这里属热带季风气候，年均气温 24.4 ℃，年降水约 3150 毫米，七到九月雨最多。\n联合共和国末期，乡村教师拉马希自称在东海岸的海滩上看见了「最后的黎明」。大分裂的战乱和饥荒中，数万信徒变卖家产迁到这里，按照「新天新地」的预言建起圣城：十二个同心圆街区以先知居住的黎明塔为中心层层展开。黎明塔高七十多米，是全城最高的建筑；塔南侧的十二使徒会堂有十二扇门，各对着一个街区。城中事务由先知任命的圣城长老院掌管，守夜长老托基·兰德里亚马纳纳主持每天清晨的迎日仪式；圣城行政院分配住房和口粮、组织劳动、接待朝圣者和管理港口。\n经济靠种植业和朝圣，服务业约占 57%，人均产值约 2500 美元。信徒入教时把财产交给教团，不领工资只领配给，一日三餐在街区的公共食堂吃，十二座食堂中最大的是第一公共食堂。城北河口的黎明稻田供应食堂，余粮存进圣殿的粮仓，为预言中的「大日」做准备；黎明公社果园是全国最大的集体农场，种芒果、椰子和香蕉；梯田出产的茶和香草是主要出口货。港口旁有马扎瓦鱼市和盐田，白衣作坊缝制全城信徒穿的白衣，也做纪念品卖给朝圣者。城郊马扎瓦柴油发电站的两根烟囱是地标，设备老旧，雨季常轮流停电。\n第一同心圆街区紧挨黎明塔，住着使徒长老和资深信徒，白色两层小楼由长老会分配。黎明圣殿东墙全是玻璃，可容五千人；启示录档案馆保存先知的启示录原稿，不对外开放。黎明学校是全国唯一的学校，课本由先知审定；孩子满五岁就住进儿童之家，周末才回家。墓园等待复活园里的墓碑都朝向东方。\n横贯公路从西海岸的萨希勒越过安德里纳高原，在马扎瓦抵达东海岸；东海岸公路沿市境西部的边缘经过约 80 公里，北通洛哈瓦托，南到塔马塔，但不进城。外人须在马扎瓦城门检查站出示朝圣证，只能住朝圣者客舍；城门内的朝圣者集市是城里唯一用钱的地方。八百名青年信徒组成的圣殿护卫队守卫先知和城门，也搜寻离开教团的信徒。\n每天黎明前半小时，晨钟塔敲响十二下，信徒到迎日海滩的十二根白石柱之间静坐迎日，上午劳动，晚上听讲道；千年国的时钟比邻国快半小时，「好让信徒最先看见黎明」。春分的「新天节」，全体信徒穿白衣列队，等候先知宣布新一年的启示。婚姻由长老会安排，离开的人被称为「堕入黑夜」。年迈的先知已多年未露面，近年出走的年轻人越来越多。"
    en: "Mazava is the holy city of the Most Holy Millennial Realm of the Dawn and the country's only city; the name means 'light'. It lies on the east coast of Ranova, backed by the rainforest of the eastern slope of the Farana Escarpment and facing the sea. Its territory of some 16,000 km² reaches from the shore up to ridges of 1,607 m, and it has about 300,000 people. The climate is tropical monsoon, with a mean temperature of 24.4 °C and some 3,150 mm of rain a year, most of it from July to September.\nLate in the days of the United Republic, a village schoolteacher named Ramahy claimed to have seen 'the last dawn' on a beach of the east coast. Amid the war and famine of the Sundering, tens of thousands of believers sold their possessions and moved here, building a holy city according to the prophecy of a new heaven and a new earth: twelve concentric ring quarters spreading out from the Tower of Dawn, where the Prophet lives. The tower, more than seventy metres high, is the tallest building in the city; on its south side the Hall of the Twelve Apostles has twelve doors, each facing one quarter. City affairs are in the hands of the Elders of the Holy City, appointed by the Prophet, and the Elder of the Watch, Toky Randriamanana, leads the morning rite of the sunrise. The Holy City Administration allots housing and rations, organises labour, receives pilgrims and runs the port.\nThe economy rests on farming and pilgrimage; services account for about 57% and output per head is about US$2,500. Believers hand their property to the order on joining, draw rations rather than wages, and eat all three meals in the common dining halls of their quarter, the largest of the twelve being the First Common Dining Hall. The Dawn Paddies at the river mouth north of the city feed the halls, and the surplus goes into the temple granaries against the prophesied 'Great Day'. The Dawn Commune Orchard is the largest collective farm in the country, growing mangoes, coconuts and bananas, and tea and vanilla from the terraces are the main exports. Beside the port are the Mazava Fish Market and the salt pans, and the White Robe Workshop sews the white robes every believer wears and makes souvenirs for pilgrims. The two chimneys of the Mazava Diesel Power Station are a landmark on the outskirts; its equipment is old, and in the rainy season power is often rationed by rota.\nThe First Ring Quarter, right beside the Tower of Dawn, houses the apostle-elders and senior believers in white two-storey houses allotted by the council. The Temple of the Dawn has an east wall made entirely of glass and holds five thousand people; the Archive of the Revelations keeps the original texts of the Prophet's revelations and is closed to the public. The School of the Dawn is the only school in the country, with textbooks approved by the Prophet; at five, children move into the Children's House and go home only at weekends. In the cemetery, the Garden of the Awaiting, every gravestone faces east.\nThe Cross-Island Road runs from Sahil on the west coast over the Andrina Highlands and reaches the east coast at Mazava; the East Coast Road skirts the city's western edge for some 80 km, north to Lohavato and south to Tamata, without entering the town. Outsiders must show a pilgrim's permit at the Mazava City Gate Checkpoint and may stay only at the Pilgrims' Hostel; the Pilgrims' Market just inside the gate is the only place in the city where money is used. The Temple Guard, eight hundred young believers, guards the Prophet and the gates and also hunts down those who leave the order.\nHalf an hour before dawn each day the Bell Tower of the Morning strikes twelve, and the faithful sit among the twelve white stone columns of Sunrise Beach to greet the sunrise, then work in the morning and hear sermons in the evening. The Realm's clocks run half an hour ahead of its neighbours', 'so that believers see the dawn first'. At the Feast of the New Heaven at the spring equinox, all believers process in white to await the Prophet's revelation for the new year. Marriages are arranged by the council, and those who leave are said to have 'fallen into the night'. The ageing Prophet has not been seen in public for years, and more and more young people have left in recent years."
