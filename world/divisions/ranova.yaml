  names: {zh: 拉诺梅纳, en: Ranomena, art-x-ranova: Ranomena}
  notes:
    zh: "拉诺梅纳是安博哈拉基督教联邦东部的林业城市，坐落在法拉纳断崖顶上，面积约 3.5 万平方公里，人口 38 万，每平方公里只有 11 人。城名意为「红水」，因为雨季时断崖上的瀑布带着红土倾泻而下。辖区位于安德里纳高原东缘，平均海拔约 950 米，最高处 1678 米，城区离海岸约 175 公里；东边的法拉纳断崖迎着东北信风陡落数百米，覆盖着全岛最茂密的热带雨林。高原上气候温和，年平均气温约 20 °C，但雨水极多，年降水约 2500 毫米，五月到十一月是雨季，八月接近 390 毫米，二月只有 20 毫米左右。拉诺梅纳的市议会由选举产生，29 席中家园党得 55.9% 的选票、16 席，单独执政，高原农民党 6 席，基督教人民党 5 席，联邦自由党 2 席，投票率约 71%；市长姆博拉·拉乔纳出自家园党，决胜轮的对手也是家园党人。\n林业与木材加工、水力发电和种植业是拉诺梅纳的三大产业，第二产业占经济的近四成，人均生产总值约 7980 美元。拉诺梅纳水电站利用断崖的落差发电，引水管道从崖顶的水库沿山坡直下，接入崖底的发电厂房，是安博哈拉最大的电源，输电线翻山越岭通往各大城市；雨季时，瀑布和溢洪道一起奔泻而下，红色的水流蔚为壮观。桉树和松树林场延伸到东部雨林边缘，国营的拉诺梅纳林业公司木材厂收购原木，锯成板材和电线杆，下脚料制成纤维板，林场每采伐一片就要补种一片。居民九成以上以拉诺瓦语为母语，平均预期寿命约 69 岁，识字率八成以上。\n拉诺梅纳是高原通往东海岸的要道。拉诺梅纳公路从首都安博哈拉向东南延伸，在拉诺梅纳境内约 262 公里，沿断崖以几十个急弯蜿蜒而下，通往塔马塔港；联邦干线、横贯公路和东海岸公路也从境内的边角穿过。瓦塔铁路在拉诺梅纳设站，过站后以一连串隧道和高架桥贴着断崖盘旋而下，拉诺梅纳特大桥长约 25 公里，是全线最长的桥梁。\n雨季是拉诺梅纳最好看的季节。列车驶过断崖时，乘客们都挤到车窗边看瀑布；公路上的游客在急弯旁停车拍照，红色的水雾扑到脸上。林场工人天亮就进山，午后的雷雨来之前收工，傍晚在木材厂外的小饭馆里吃一碗米饭配炖豆子。和联邦各地一样，星期日全城停业，伐木工和水电站的值班工程师都换上干净衬衫去教堂，礼拜之后是一家三代围坐的午宴。城树加勒比松是林场的主力树种，城花凤仙花则开在每家的窗台上。本地人开玩笑说，拉诺梅纳的河是全岛唯一会脸红的河，一到雨季就红得认不出来。"
    en: "Ranomena is a forestry city in the east of the Christian Federation of Ambohara, on top of the Farana Escarpment; it covers some 35,000 km² with 380,000 people, only 11 to the square kilometre. Its name means 'red water', for the waterfalls that pour red earth over the cliffs in the rains. It lies on the eastern edge of the Andrina Highlands at an average height of about 950 m, rising to 1,678 m, and the town is some 175 km from the coast; to the east the Farana Escarpment, facing the north-east trade winds, drops several hundred metres and is clothed in the densest rainforest on the island. The highland climate is mild, averaging about 20 °C, but very wet, with some 2,500 mm of rain a year: the rains last from May to November, with close to 390 mm in August, while February brings only about 20 mm. Ranomena's city council is elected: of its 29 seats the Homeland Party won 16 with 55.9 per cent of the vote and governs alone, the Highland Farmers' Party holds 6, the Christian People's Party 5 and the Federal Liberal Party 2, on a turnout of about 71 per cent; the mayor, Mbola Rajaona, is from the Homeland Party, and so was the runner-up in the run-off.\nForestry and timber, hydropower and farming are Ranomena's three industries; industry makes up nearly forty per cent of the economy, and output per head is about 7,980 dollars. The Ranomena Hydroelectric Station draws on the height of the escarpment: penstocks run straight down the slope from a reservoir on the clifftop to the powerhouse at its foot. It is the largest source of power in Ambohara, and its lines cross the hills to the main cities; in the rains the falls and the spillway pour down together in a spectacular red torrent. Eucalyptus and pine plantations run to the edge of the eastern rainforest, and the state-run Ranomena Forestry Company Sawmill buys their logs, saws them into planks and telegraph poles and turns the offcuts into fibreboard; for every stand felled, another must be planted. More than nine in ten residents speak Ranovan as their mother tongue; life expectancy is about 69, and more than eight in ten can read.\nRanomena is the highlands' main way down to the east coast. The Ranomena Road runs south-east from the capital, Ambohara, for some 262 km within Ranomena, winding down the escarpment through dozens of hairpin bends on its way to the port of Tamata; the Federal Trunk Road, the Cross-Island Road and the East Coast Road also cross corners of its territory. The Vavambo–Tamata Railway stops at Ranomena, and beyond the station it spirals down the escarpment in a chain of tunnels and viaducts clinging to the cliffs; the Ranomena Viaduct, about 25 km long, is the longest bridge on the line.\nThe rains are Ranomena's finest season. As the trains pass the escarpment the passengers crowd to the windows to watch the falls, and on the road visitors pull over at the hairpins to take pictures, the red spray blowing into their faces. The plantation workers head into the hills at first light and knock off before the afternoon thunderstorms, and in the evening they eat a bowl of rice and stewed beans in the little restaurants outside the sawmill. As everywhere in the federation, the whole town closes on Sundays: loggers and the engineers on duty at the power station put on clean shirts for church, and after the service three generations sit down to lunch together. The city's tree, the Caribbean pine, is the mainstay of the plantations, and its flower, the impatiens, blooms on every windowsill. Locals joke that Ranomena's river is the only one on the island that blushes: in the rains it turns so red you would not know it."
