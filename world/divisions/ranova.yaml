# ── 黎明千年国 ──
- id: div_nyhhhg
  subtype: country
  status: generated
  names: {zh: 黎明千年国, en: Millennial Realm of the Dawn, art-x-ranova: Fanjakana Arivo Taona ny Maraina}
  short_names: {zh: 黎明国, en: Dawn Realm}
  notes: {zh: '黎明千年国位于拉诺瓦岛东海岸，夹在洛哈瓦托王国与安博哈拉之间，面积约一万六千平方公里，人口约三十万，唯一的城市是圣城马扎瓦。国土从法拉纳断崖的东坡一直延伸到海边，雨林覆盖的山坡上开垦出层层梯田。

      千年国由一个新兴宗教「黎明教」建立。联合共和国末期，一位名叫拉马希的乡村教师自称在东海岸的海滩上看见了「最后的黎明」，预言旧世界即将毁灭，只有追随他的人能在新天新地中得救。大分裂的战乱和饥荒使他的信徒迅速增加，数万人变卖家产迁到东海岸，在马扎瓦建立了圣城。此后信徒宣布成立千年国，拉马希被尊为先知和「黎明之父」，国家由先知和他任命的十二使徒长老会统治。

      千年国的生活围绕着宗教仪式展开：每天清晨，全体信徒面向东方的大海迎接日出；城市按照预言规划成十二个同心圆街区，财产归集体所有，婚姻由长老会安排，信徒不得与外人通婚，离开教团的人会被视为「堕入黑夜」。千年国把时钟比邻国拨快半小时，「好让信徒最先看见黎明」。邻国和人权组织多次批评其限制信徒离开、强迫劳动和对儿童的控制。

      先知的预言已经多次落空，每次都被长老会重新解释为「考验」，但近年来年轻一代离开圣城的人越来越多。千年国拒绝加入任何阵营，与法尼里公社和洛哈瓦托王国关系紧张，对外贸易主要是梯田出产的茶、香草和朝圣者的捐献。人均收入约二千五百美元。年迈的先知已多年未公开露面，继承问题成为千年国最大的悬念。', en: "The Millennial Realm of the Dawn lies on Ranova's east coast between the Kingdom of Lohavato and Ambohara, some 16,000 km² with about 300,000 people; its only city is the holy city of Mazava. The country runs from the eastern face of the Farana Escarpment down to the sea, and terraces have been cut into its rainforested slopes. \nThe Realm was founded by a new religion, the Faith of the Dawn. In the last years of the United Republic a village teacher named Ramahy said he had seen 'the last dawn' on a beach of the east coast and prophesied that the old world was about to end and only those who followed him would be saved into a new heaven and a new earth. The wars and famines of the Sundering swelled his following fast; tens of thousands sold their property and moved to the east coast to build the holy city of Mazava. The faithful then proclaimed the Millennial Realm, Ramahy was hailed as Prophet and 'Father of the Dawn', and the state is ruled by the Prophet and the Council of Twelve Apostles he appoints. \nLife in the Realm revolves around ritual: every morning all the faithful face the eastern sea to greet the sunrise; the city is laid out in twelve concentric rings according to the prophecy; property is held in common, marriages are arranged by the council, the faithful may not marry outsiders, and those who leave are said to have 'fallen into the night'. The Realm sets its clocks half an hour ahead of its neighbours 'so that the faithful see the dawn first'. Neighbours and human rights groups have repeatedly criticised it for keeping members from leaving, forced labour and its control over children. \nThe Prophet's predictions have failed several times, each time reinterpreted by the council as 'a test', but in recent years more and more of the young have left the holy city. The Realm refuses to join any bloc and is on poor terms with the Faniry communes and the Kingdom of Lohavato; its trade is mainly tea and vanilla from the terraces and the gifts of pilgrims. Income is about 2,500 dollars a head. The aged Prophet has not appeared in public for years, and the succession is the Realm's great unanswered question."}
