# ── 洛哈瓦托王国 ──
- id: div_gd73a5
  subtype: country
  status: generated
  names: {zh: 洛哈瓦托王国, en: Kingdom of Lohavato, art-x-ranova: Fanjakan'i Lohavato}
  short_names: {zh: 洛哈瓦托, en: Lohavato}
  notes:
    zh: "洛哈瓦托王国位于拉诺瓦岛东海岸中部，北邻马索沃利和伊瓦洛公社，南接最神圣的黎明千年国，面积约二万平方公里，人口约四十五万，有都城洛哈瓦托和东海岸的港口桑博两座城市。国名意为「石头之首」，指都城背后法拉纳断崖上那块突出的巨石。国土从断崖下的山丘一直延伸到海岸，山谷中是茶园和梯田，雨林覆盖着断崖的东坡。\n王国的佛教传统可以追溯到很久以前从海上来的僧侣，他们在断崖下建立了第一座寺院，周围的部族首领皈依佛教，后来形成了洛哈瓦托王室。联合共和国时期，王室只保留礼仪地位；大分裂时，国王拒绝加入任何一方，在僧团和山区部族的支持下宣布恢复王国。此后国王主动推行改革，颁布宪法，设立王国议会，议员一半民选、一部分由国王任命、一部分由僧团推选，首相由议会多数推举、国王任命。国王仍保留解散议会、任命法官和指挥军队的权力。\n现任国王是安德里亚纳·塔纳七世，王储是拉多王子；大分裂时宣布恢复王国、后来颁布宪法和设立王国议会的，是前任国王安德里亚纳·塔纳六世。王国议会共 60 席：民选的 30 席目前都由王国国民协会占据，20 名议员由国王任命，10 名僧团代表来自护法僧伽会。王国最高法院有 6 名法官，依据成文法和佛教戒律传统审判，国王是司法的最终来源，每年佛诞节都会大赦一批轻罪犯人，寺院内部的纠纷则由僧团自行裁决。洛哈瓦托皇家陆军和王室卫队约四千人，18 至 24 岁的男女可以志愿入伍，服役 3 年后转入预备役，国防主要依靠圣约同盟。约 82% 的居民信佛，游客人数实行限额，须提前申请入境，进入寺院要衣着得体。\n王国以「国民幸福」为施政目标，限制大规模开发和旅游人数，保护森林和寺院传统，男孩常在寺院中度过一段少年时光。王国在宗教问题上宽容，基督教和祖灵信仰的社区可以自由礼拜，但对最神圣的黎明千年国的扩张和马索沃利的无神论宣传十分警惕。沿海战争把马索沃利的军队带到了王国的北部边界，王国关闭了东海岸公路上的口岸，把皇家陆军调往北方，收留了一批从法尼里逃来的难民，也让运往伊瓦洛的援助物资经王国的山路过境。\n洛哈瓦托是圣约同盟的成员，是信仰阵营中两个佛教国家之一，与转轮无边法王国互不相让，依靠同盟的保护维持中立和平。经济以茶叶、稻米、手工艺品和高端文化旅游为主，人均收入约四千美元。每年雨季结束时，王国举行法轮节，国王和僧团沿着转经道绕都城一周，全国的人都会来到洛哈瓦托，在寺院前点燃成千上万盏酥油灯。\n射箭是国民运动，乡间的射箭比赛常常持续一整天，场边有人唱歌起哄，输的一方要请大家吃茶叶米糕。"
    en: "The Kingdom of Lohavato lies in the middle of Ranova's east coast, with Masovoly and the Ivalo communes to the north and the Most Holy Millennial Realm of the Dawn to the south, some 20,000 km² with about 450,000 people in two cities, the royal capital, Lohavato, and the port of Sambo on the east coast. The name means 'head of stone', for the great rock jutting from the Farana Escarpment behind the capital. The country runs from the hills below the escarpment to the coast, with tea gardens and terraces in the valleys and rainforest on the eastern face of the cliffs. \nThe kingdom's Buddhist tradition goes back to monks who came by sea long ago and built the first monastery below the escarpment; the chiefs around it converted, and in time became the royal house of Lohavato. Under the United Republic the crown kept only a ceremonial role; in the Sundering the king refused to join any side and, backed by the monastic order and the hill peoples, proclaimed the kingdom restored. He then carried out reforms of his own accord, granting a constitution and a Royal Assembly in which half the members are elected, some appointed by the King and some chosen by the monastic order; the prime minister is put forward by the assembly majority and appointed by the King, who keeps the power to dissolve the assembly, appoint judges and command the army. \nThe present king is Andriana Tana VII and the heir is Prince Rado; it was his predecessor, Andriana Tana VI, who proclaimed the restored kingdom during the Sundering and later granted the constitution and created the Royal Assembly. The Royal Assembly has 60 seats: the 30 elected seats are at present all held by the Royal National Association, 20 members are appointed by the King and 10 monastic delegates come from the Sangha Council for the Dharma. The Supreme Court of the Kingdom has six judges and rules by codified law and the tradition of the Buddhist precepts; the King is the ultimate source of justice and every year on the Buddha's birthday pardons a group of petty offenders, while disputes within the monasteries are settled by the sangha itself. The Royal Lohavato Army and the Royal Lohavato Guard number about 4,000; men and women aged 18 to 24 may volunteer and pass into the reserve after three years, and defence rests mainly on the Covenant League. About 82% of the people are Buddhist; visitor numbers are capped, entry must be applied for in advance and temples require modest dress.\nThe kingdom governs for 'national happiness', limiting large developments and visitor numbers and protecting the forests and monastic tradition, and boys often spend part of their youth in a monastery. It is tolerant in matters of religion, Christian and ancestral communities worship freely, but it is wary of the Millennial Realm's expansion and Masovoly's atheist propaganda. Since the Coastal War brought Masovoly's army up to its northern border, the kingdom has closed its crossing on the East Coast Road, moved the Royal Army north, taken in a number of refugees from Faniry and let aid for Ivalo pass over its mountain roads. \nLohavato is a member of the Covenant League, one of the two Buddhist states in the bloc of faith, at odds with the Kingdom of the Boundless Dharma Wheel, and relies on the League's protection to keep a neutral peace. Its economy rests on tea, rice, handicrafts and high-end cultural tourism, and income is about 4,000 dollars a head. At the end of the rains every year the kingdom holds the Festival of the Wheel: the King and the monks walk the circuit round the capital, and people from all over the country come to Lohavato to light thousands of butter lamps before the monasteries.\nArchery is the national sport: village contests often last all day, with spectators singing and heckling from the sidelines, and the losing side has to treat everyone to tea-leaf rice cakes."
