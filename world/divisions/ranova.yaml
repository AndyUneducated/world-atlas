  notes: {zh: '法尼里自由公社联合会位于拉诺瓦岛东海岸，北接马索沃利，南邻洛哈瓦托王国，面积约一万八千平方公里，人口约六十万。国名中的「法尼里」意为「愿望」，联合会由几十个城镇公社和乡村公社组成，最大的城镇法尼里是东海岸的渔港，内陆的伊瓦洛一带是农业公社群。东部沿海是潮湿的雨林和河口，西部是法拉纳断崖下的丘陵。

      大分裂时，东海岸的码头工人、渔民和纺织工人拒绝接受任何一方的政府，他们占领工厂和港口，成立工人议会，乡村则由农民自发组成村社。各公社随后结成联合会，宣布不设中央政府、不设常备军、不设警察，一切公共事务由各公社的全体大会决定，联合会代表大会只负责协调跨公社的事务，代表由各公社选派，可以随时召回。对外联络由轮值协调员负责，任期一年，不得连任。

      公社的生活由劳动券和集体分配组织：工厂、渔船和土地归公社共有，成员按劳动时间领取劳动券，住房、医疗和教育免费。法尼里是全岛新闻自由度最高的地方之一，几十份公社报纸和电台各说各话。公社的弱点也很明显：决策缓慢，工业设备老旧，技术人员流失，人均收入约三千美元。

      联合会在世俗协约中只是观察员，与阿瓦拉齐保持贸易和互助关系，却对马索沃利的世袭政权和南邻黎明千年国的神权统治十分警惕。高原战争期间，公社收容了大量两边的逃兵和难民，宣布任何人只要放下武器都可以在公社劳动生活。每周日，法尼里大会堂召开全体大会，渔民、工人和学生轮流上台发言，会议常常持续到深夜。', en: "The Free Communes of Faniry lie on Ranova's east coast between Masovoly to the north and the Kingdom of Lohavato to the south, some 18,000 km² with about 600,000 people. 'Faniry' means 'wish'. The federation is made up of dozens of town and village communes; the largest town, Faniry, is a fishing port on the east coast, and the farming communes cluster round Ivalo inland. The coast is wet rainforest and estuaries, and the west is hill country below the Farana Escarpment. \nIn the Sundering the dockers, fishers and textile workers of the east coast refused to accept any government. They occupied the factories and the port and set up workers' councils, while in the countryside farmers formed village communes of their own. The communes then joined in a federation and declared that there would be no central government, no standing army and no police: all public business is decided by each commune's general assembly, and the Federal Congress of Delegates only co-ordinates matters between communes, its delegates sent by the communes and recallable at any time. External contacts are handled by a rotating coordinator who serves one year and may not serve again. \nLife in the communes runs on labour vouchers and shared distribution: factories, fishing boats and land are held in common, members receive vouchers for hours worked, and housing, health care and schooling are free. Faniry has some of the freest press on the island, with dozens of commune newspapers and radio stations each saying its piece. The communes' weaknesses are plain too: decisions are slow, the factories' machinery is old, skilled people drift away, and income is about 3,000 dollars a head. \nThe federation is only an observer in the Secular Accord. It trades with Avaratsy and the two help each other, but it is wary of Masovoly's hereditary regime and of the theocracy of the Millennial Realm of the Dawn to the south. During the Highland War the communes took in many deserters and refugees from both sides and declared that anyone who laid down their arms could live and work among them. Every Sunday the general assembly meets in the Faniry assembly hall, fishers, workers and students taking turns to speak, and the meeting often runs late into the night."}
