  names: {zh: 瓦凡博, en: Vavambo, art-x-ranova: Vavan'Ambo}
  notes:
    zh: "瓦凡博是安博哈拉基督教联邦西北端的港城，坐落在安博河注入西北湾的河口，名字意为「安博河之口」。全市人口约 100 万，辖区约 3.04 万平方公里，从河口的海滨一路延伸到内陆的山地，平均海拔 622 米，最高处 1786 米。气候属热带草原型，年均气温 21.9 ℃，年降水约 1065 毫米，一月到三月几乎无雨，七月到九月最湿。瓦凡博是联邦唯一的深水港和最大的工业城市，码头、炼油厂、水泥厂和纺织厂沿西北湾排开，联邦海军西北舰队以此为母港。\n联合共和国时期，安博河口就是高原各省出海的门户。大分裂后，联邦失去了其他出海口，瓦凡博成了全国的进出口命脉；西岸战争爆发后，港区外筑起了长长的防波堤和雷达站。瓦凡博港的集装箱码头、散货码头和油码头沿河口排开，联邦的大部分进出口货物都从这里装卸，圣约同盟盟国的援助物资也大多在此上岸，码头工人的工会是联邦最大的工会之一。瓦凡博炼油厂是全国唯一的炼油厂，加工进口原油，生产汽油、柴油和航空煤油，储油罐和火炬塔是港区的地标。瓦凡博造船厂有两座干船坞，建造渔船、货轮和巡逻艇；瓦凡博纺织厂是全国最大的纺织企业，女工三班倒。工业占全市经济的 40%，服务业 59%，人均生产总值约 10400 美元，高于全国平均。\n港城也是一座军城。海军基地的两道防波堤围成港池，西北舰队的舰艇从这里出发巡逻、护航，每年海军节开放一天，市民可以登舰参观；联邦陆军第二步兵旅驻在城郊的瓦凡博兵营，山顶的雷达站和高地上的防空导弹阵地守着港区的天空。\n瓦塔铁路从这里出发，经菲安特拉的稻田上到安德里纳高原，穿过首都，再沿法拉纳断崖下到东海岸的塔马塔，全长约 850 公里，信风 160 型列车全程五个小时左右，是全岛最繁忙的铁路；瓦凡博站发出的货车把炼油厂的成品油运上高原。领道 S-RA-101 联邦干线也以瓦凡博为起点，全长约 1300 公里，是联邦从一端到另一端的唯一公路，被称为联邦的「脊梁」。\n市议会 35 席，家园党 16 席，与高原农民党（4 席）联合执政，基督教人民党 10 席，联邦自由党 5 席；市长蒂安娜·拉菲迪松来自家园党，以 50.9% 对 49.1% 险胜。居民 92% 以拉诺瓦语为母语，人均预期寿命 69.6 岁，识字率 87.4%。星期日全城停业，只有港口的值班工人和炼油厂的火炬照常工作；礼拜后码头工人家庭在海堤上野餐，看货轮进出河口。卡车司机从这里出发上高原前，会在第一座路边圣母像前按一声喇叭。市花是九重葛，市树是椰子树，市旗深蓝的天空下一只白色铁锚，代表这座联邦唯一的深水港。"
    en: "Vavambo is the port at the north-western end of the Christian Federation of Ambohara, where the Ambo flows into the north-western bay; its name means \"mouth of the Ambo\". It has about a million people and some 30,400 km² of territory, reaching from the estuary shore to the mountains inland, with a mean elevation of 622 m and a high point of 1,786 m. The climate is tropical savanna: the mean temperature is 21.9 °C and the annual rainfall about 1,065 mm, with almost no rain from January to March and the wettest months from July to September. Vavambo is the federation's only deep-water harbour and its largest industrial city: quays, a refinery, cement works and textile mills line the north-western bay, and the Federal Navy's North-West Fleet is based here.\nUnder the United Republic the mouth of the Ambo was the highland provinces' gateway to the sea. After the Sundering the federation had no other outlet, and Vavambo became the lifeline of the country's trade; since the West Coast War a long breakwater and radar stations have guarded the harbour. The container, bulk and oil terminals of the Port of Vavambo line the estuary, most of the federation's imports and exports pass through it, as does most of the aid from Covenant allies, and the dockers' union is one of the largest in the federation. The Vavambo Oil Refinery, the country's only refinery, processes imported crude into petrol, diesel and jet fuel; its tanks and flare stack are landmarks of the port. The Vavambo Shipyard has two dry docks and builds fishing boats, freighters and patrol boats; the Vavambo Textile Mill is the country's largest textile firm, its women workers on three shifts. Industry makes up 40% of the economy and services 59%, and output per head is about US$10,400, above the national average.\nThe port is also a garrison town. Two breakwaters enclose the basin of the naval base, from which the ships of the North-West Fleet go out on patrol and escort duty; on Navy Day each year it opens to the public and people can go aboard. The Federal Army's 2nd Infantry Brigade is at the Vavambo Barracks on the outskirts, while the radar station on a hilltop and the air-defence missile site on high ground guard the sky over the port.\nThe Vavambo–Tamata Railway starts here, climbing through the rice fields of Fiantra onto the Andrina Highlands, through the capital and down the Farana Escarpment to Tamata on the east coast. It is about 850 km long, its Xinfeng 160 trains take around five hours end to end, and it is the busiest railway on the island; freight trains from Vavambo Station carry the refinery's fuel up to the highlands. The Federal Trunk Road, territorial road S-RA-101, also begins at Vavambo; about 1,300 km long, it is the only road from one end of the federation to the other and is called the federation's \"backbone\".\nThe City Council has 35 seats: the Homeland Party holds 16 and governs with the Highland Farmers' Party (4), while the Christian People's Party has 10 and the Federal Liberal Party 5. Mayor Tiana Rafidison of the Homeland Party won narrowly, by 50.9% to 49.1%. Ranova is the mother tongue of 92% of residents, life expectancy is 69.6 years and literacy 87.4%. On Sundays the whole city closes, and only the duty crews at the port and the refinery's flare keep working; after church dockers' families picnic on the sea wall and watch the freighters going in and out of the estuary. Lorry drivers heading up to the highlands sound their horn once as they pass the first roadside statue of the Virgin. The city flower is the bougainvillea and the city tree the coconut palm, and the white anchor under a deep blue sky on the city flag stands for the federation's only deep-water port."
