    zh: "贝洛瓦是贝洛瓦共和国的首都和全岛最大的金融中心，坐落在拉诺瓦岛西海岸南段的一个大海湾边，面积约 1.3 万平方公里，人口 105 万。城区沿海湾展开，背后是低缓的丘陵，境内最高处海拔 947 米。这里属热带草原气候，年降水只有约 900 毫米，十二月到三月几乎滴雨不下，四月到十一月是雨季，八月最多；最热的四月白天 32 °C 以上，全年日照约 2570 小时。联合共和国时期，贝洛瓦是西海岸的商业港口和自由贸易区；大分裂后，当地的商人、银行家和技术官僚在这里组建临时政府，宣布成立总统制共和国。市议会 35 席由选举产生，自由党得 51.7% 的选票、18 席，单独执政，公民联盟 11 席，新贝洛瓦党和港口绿党各 3 席；市长齐基·拉贝出自自由党，以 59.6% 的得票击败公民联盟的对手。\n金融、港口航运和信息技术是贝洛瓦的三大产业，第三产业占经济的八成以上，人均生产总值约 1.47 万美元。玻璃高楼沿海湾排开：贝洛瓦国际金融中心高两百多米，是城里最高的摩天楼；贝洛瓦证券交易所的指数是全岛经济的风向标，阵营之间一紧张就大幅波动；贝洛瓦软件园里有几百家软件公司和呼叫中心，园区的咖啡馆一直开到深夜。总统府所在的共和国宫位于金融区北端，是一座十层的玻璃幕墙大楼，与周围的银行大楼几乎分不出来；南侧海滨公园里的国会大厦顶着半透明的穹顶，被设计者称为「透明的民主」。老城法院广场上石砌的贝洛瓦最高法院，是少数保存下来的联合共和国时期老建筑。\n贝洛瓦港是共和国的经济命脉，集装箱码头二十四小时作业，香草、咖啡和蓝宝石从这里出口，敌对阵营的货轮常常停在相邻的泊位上。港区以东的填海地上是贝洛瓦港外难民营，收容着约六万名来自邻国战乱地区的难民，他们白天到仓库、工地和工厂打工，是港区廉价劳动力的重要来源；最高法院判决雇主须为难民工人支付同等工资后，营地居民成立了自己的工会。贝洛瓦国际机场是全岛最现代化的机场，敌对阵营的商人常在同一个候机厅里等待登机。贝安高速铁路以时速 400 公里通往内陆的安博塔，二十分钟就到；西海岸公路和香草公路两条领道在这里交会，一条沿西海岸南北贯通，一条向东经安博维通往安德里纳高原。城里的街道多以理念命名，自由大道、团结大道、宪章路和议会大道纵横交错。\n居民近半以拉诺瓦语为母语，近三成讲英语，也有讲卡西里语和中文的社区。白色的贝洛瓦圣母主教座堂每逢圣母升天节抬着圣像绕城游行，沿途人家在门前摆上鲜花和蜡烛；贝洛瓦大饭店的酒吧里至今挂着战争年代外国记者留下的新闻照片。一年中最热闹的是十二月的贝洛瓦海湾节，旱季的海湾风平浪静，帆船赛从午后比到黄昏，夜里烟花在玻璃高楼之间炸开，全岛的游客挤满海滨。贝洛瓦人爱说港务局楼顶的时钟是全城最准的钟，银行家和码头工人都按它对表。"
    en: "Belova is the capital of the Republic of Belova and the largest financial centre on the island, on a broad bay in the southern part of Ranova's west coast; it covers some 13,000 km² and has 1,050,000 people. The city spreads along the bay with low hills behind it, rising to 947 m at the highest. The climate is tropical savanna, with only about 900 mm of rain a year: from December to March hardly a drop falls, the rains last from April to November and peak in August, days in April, the hottest month, top 32 °C, and the sun shines about 2,570 hours a year. Under the United Republic Belova was the commercial port and free-trade zone of the west coast; after the Sundering its merchants, bankers and technocrats formed a provisional government here and proclaimed a presidential republic. The 35-seat city council is elected: the Liberal Party won 51.7 per cent of the vote and 18 seats and governs alone, the Civic Alliance holds 11, and the New Belova Party and the Harbour Greens 3 each; the mayor, Tsiky Rabe of the Liberal Party, beat the Civic Alliance's candidate with 59.6 per cent.\nFinance, the port and shipping, and information technology are Belova's three industries; services make up more than eighty per cent of the economy, and output per head is about 14,700 dollars. Glass towers line the bay: the Belova International Finance Centre, over 200 m tall, is the highest skyscraper in the city; the index of the Belova Stock Exchange is the weathervane of the island's economy and swings sharply whenever relations between the blocs grow tense; and the Belova Software Park holds hundreds of software firms and call centres, its cafés open late into the night. The Palace of the Republic, seat of the presidency at the northern end of the financial district, is a ten-storey glass-walled block almost indistinguishable from the banks around it; the Congress Building in the seafront park to its south wears a translucent dome its designer called 'transparent democracy'. On Court Square in the old town, the stone Supreme Court of Belova is one of the few buildings from the United Republic to survive.\nThe Port of Belova is the Republic's lifeline: its container terminal works round the clock, vanilla, coffee and sapphires go out through it, and freighters from hostile blocs often lie at neighbouring berths. On reclaimed land east of the docks is the Belova Port Refugee Camp, home to some 60,000 people from the wars in neighbouring countries, who go out by day to work in the warehouses, building sites and factories and are a large source of cheap labour for the port; after the Supreme Court ruled that employers must pay refugee workers equal wages, the camp's residents formed their own union. Belova International Airport is the most modern on the island, and traders from hostile blocs often wait in the same departure lounge. The Belova–Ambota High-Speed Railway runs inland to Ambota at 400 km/h in twenty minutes, and two territorial highways meet here: the West Coast Road, running north and south along the coast, and the Vanilla Road, heading east through Ambovy to the Andrina Highlands. Most of the city's streets are named after ideals, and Liberty Avenue, Unity Avenue, Charter Road and Parliament Avenue criss-cross the centre.\nNearly half the residents speak Ranovan as their mother tongue and nearly three in ten English, and there are Kasiri- and Chinese-speaking communities as well. On the feast of the Assumption the white Belova Cathedral of Our Lady carries its statue of the Virgin round the city, and households along the route set out flowers and candles; the bar of the Belova Grand Hotel still hangs the news photographs left by foreign correspondents in the war years. The liveliest time of year is the Belova Bay Festival in December, when the bay lies calm in the dry season, the regatta runs from early afternoon until dusk, fireworks burst between the glass towers at night, and visitors from all over the island crowd the waterfront. People in Belova like to say that the clock on top of the port authority building is the most accurate in the city, and bankers and dockers alike set their watches by it."
