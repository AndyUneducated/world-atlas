- id: div_j0txx6
  subtype: locality
  parent: div_rbcxzz
  status: generated
  names: {zh: 齐马罗沃, en: Tsimarovo, art-x-ranova: Tsimarovo}
  notes:
    zh: "齐马罗沃是齐马罗沃民族社会主义帝国的首都，建在伊拉希河上游的盆地中，城区海拔约 1500 米。全市人口约 100 万，辖区约 2.2 万平方公里，从盆地一直延伸到周围的山地，最高处 2495 米。气候属热带草原型，年均气温 21.7 ℃，年降水约 1344 毫米，五月到十月是雨季。新古典风格的国民大厅和领袖府沿中轴大道对称排列，每年的建国阅兵在大道上举行；城郊是国营军工厂和民族卫队兵营。\n联合共和国末期，南方的退伍军人和民族主义青年成立了民族社会主义运动，宣称高原「最早的定居者」才是拉诺瓦的主人。大分裂后，运动以武力控制南方各省，建立一党制国家。领袖府位于中轴大道北端，是帝国元首拉哈特拉·拉孔多的官邸，国际人权组织指出，许多涉及原住民迁徙和政治犯的命令都从这里签发。大道南端的国民大厅是国民议会二百名代表开会的地方，一百八十名由运动指定，二十名来自民族卫队，表决全部一致通过；大道中段是民族社会主义运动总部，外墙挂着红黑色旗帜和巨幅领袖画像，每年夏天从这里组织青年到边境的「定居者村」参加劳动营。\n城市由市行政长官公署管理，市行政长官法拉·兰德里亚马纳纳由领袖府任命，兼任当地民族卫队的政治负责人。帝国按「血统证书」把居民分成等级，只有一等公民可以拥有土地、担任公职和当军官；学校教授「血统史」，青年必须加入运动的青年团。城外的齐马罗沃第一国家监狱关押着政治犯，许多人未经审判被关多年。三十多年来，二十多万人逃离这个国家，在邻国和海外形成了庞大的流亡社区。\n首都是军工体制的中枢：城郊有国防军司令部、第一步兵旅和第一装甲旅，空军基地有两架战机全天候待命。工业占经济的 37%，人均产值约 5290 美元，周边国家普遍实施武器禁运，许多物资靠走私。齐伊铁路从齐马罗沃站出发，经福罗纳沿伊拉希河谷东下到伊拉希港，全长约 350 公里，按军用标准修建，一等车厢只卖给持一等「血统证书」的公民。领道 S-RA-105 南方公路横贯南部，齐马罗沃段路面宽直，修建时就考虑了坦克通行；S-RA-110 西南公路通往卡波拉，S-RA-111 阿拉齐纳公路通往东南，南方战争中成千上万的难民曾沿它逃往阿拉齐纳。\n居民 92% 以拉诺瓦语为母语，人均预期寿命 65.6 岁，识字率 77.9%。民族觉醒日和建国阅兵前，装甲部队的军列从伊拉希开进首都，沿线学校组织学生到铁路边挥旗。街头小摊卖烤瘤牛肉串，体育场里最热闹的是莫兰吉搏击。市花是鹤望兰，市树是木棉，市旗红底黑边，正中一座白色塔楼，就是中轴大道上的国民大厅。"
    en: "Tsimarovo is the capital of the National Socialist Empire of Tsimarovo, in a basin on the upper Ilahy with the city at some 1,500 m. It has about a million people and some 22,000 km² of territory, reaching from the basin into the surrounding mountains, with a high point of 2,495 m. The climate is tropical savanna: the mean temperature is 21.7 °C and the annual rainfall about 1,344 mm, with the rains from May to October. The neoclassical Hall of the Nation and the Leader's Residence stand symmetrically along the central avenue, where the foundation-day parade is held every year, and state arms works and National Guard barracks ring the suburbs.\nIn the last years of the United Republic veterans and young nationalists in the south founded the National Socialist movement, claiming that the \"first settlers\" of the highlands were Ranova's true masters. After the Sundering the movement took the southern provinces by force and set up a one-party state. The Leader's Residence at the north end of the central avenue is the residence and office of the Reich Leader, Lahatra Rakondo, and international human rights groups say many of the orders for moving indigenous people and holding political prisoners were signed here. The Hall of the Nation at the south end of the avenue is where the 200 delegates of the National Assembly meet, 180 named by the movement and 20 from the National Guard, and every vote is unanimous. Halfway along stands the National Socialist Movement Headquarters, its walls hung with red and black banners and a giant portrait of the Leader, from which young people are sent each summer to labour camps in the \"settler villages\" on the frontier.\nThe city is run by the Office of the City Commissioner. The City Commissioner, Fara Randriamanana, is appointed by the Leader's Chancellery and is also political chief of the local National Guard. The Empire sorts residents into grades by \"blood certificates\", and only first-class citizens may own land, hold office or become officers; schools teach \"blood history\" and young people must join the movement's youth league. Tsimarovo State Prison No. 1 outside the city holds political prisoners, many kept for years without trial. Over more than thirty years upwards of 200,000 people have fled the country, forming large exile communities in neighbouring states and overseas.\nThe capital is the hub of the military-industrial system: the Defence Army Headquarters, the 1st Infantry Brigade and the 1st Armoured Brigade are on the outskirts, two fighters stand on alert round the clock at the air base. Industry makes up 37% of the economy and output per head is about US$5,290; neighbouring states widely impose arms embargoes, and many goods come by smuggling. The Tsimarovo–Ilahy Railway leaves Tsimarovo Station for Forona and runs down the Ilahy valley to the port of Ilahy, about 350 km in all; it was built to military standards, and first-class tickets are sold only to holders of first-class \"blood certificates\". The Southern Road, territorial road S-RA-105, crosses the south, its Tsimarovo section wide and straight and designed with tanks in mind; S-RA-110, the South-West Road, leads to Kabola, and S-RA-111, the Alatsina Road, runs south-east, the route along which thousands of refugees fled to Alatsina in the Southern War.\nRanova is the mother tongue of 92% of residents, life expectancy is 65.6 years and literacy 77.9%. Before National Awakening Day and the foundation parade, armoured troop trains roll into the capital from Ilahy and schools along the line send pupils to wave flags beside the track. Street stalls sell grilled zebu skewers, and the biggest crowds at the stadium are for moraingy. The city flower is the bird of paradise and the city tree the kapok, and the city flag is red with a black border and a white tower in the middle, the Hall of the Nation on the central avenue."
