  names: {zh: 菲安特拉, en: Fiantra, art-x-ranova: Fiantra}
  notes:
    zh: "菲安特拉是安博哈拉基督教联邦高原北部的稻作城镇，十个联邦市之一。全市面积约 4 万平方公里，人口约 60 万，每平方公里约 15 人。市境从安博河谷向南一直伸上安德里纳高原的北缘，平均海拔约 830 米，最高处 2025 米。高原气候温和，年均气温 19.2 摄氏度，年降水约 2300 毫米，雨季集中在五月到十月，二月最干。梯田从安博河谷一级级爬上山坡，菲安特拉因此被称为联邦的粮仓，城旗上那片金色梯田说的正是这件事。\n种植业是全市的命脉，梯田稻作、种植业和林业是三大行业，第一产业占全市经济的 47%，人均生产总值约 7020 美元。菲安特拉稻作研究所是联邦的国家农业研究机构，试验田沿河谷排开，种着上千个水稻品种，一些耐旱品种已推广到全岛，研究所还为农民开办间作和节水灌溉的培训班。瓦塔铁路经过镇上，自西北湾的深水港瓦凡博一路上到高原，在菲安特拉站停靠后再驶往首都，把高原的稻米运往港口；联邦干线在市境内约 183 公里，被称为联邦的「脊梁」，横贯公路也有约 23 公里经过。\n镇上的路德派神学院培养了全国一半的牧师，学制五年，学生住在回廊宿舍里，每天从晨祷开始，图书馆收藏着拉诺瓦语圣经的早期译本，不少毕业生被派往岛上其他国家传教。星期日全国停业，镇上的人穿着白衣去做礼拜，礼拜结束后的茶点时间也是家园党发展新人的时候。家园党在这里根基最深：市议会 31 席中它得票 55.0%，独得 17 席，单独执政，议长奈娜·拉科托马拉拉也出自家园党；市长法利·拉科托尼里纳以 51.9% 的得票当选，连第二名也是家园党的候选人。高原农民党获 7 席，基督教人民党获 5 席，联邦自由党只有 2 席。\n高原战争期间这里是前线后方，至今保留着防空洞和旧战壕。高原北路从阿瓦拉齐的矿城马罗瓦托向南翻过高原北缘到达菲安特拉，在市境内约 138 公里，是高原战争的主战场之一；停火后，公路在停火线上被两道铁丝网和雷区截断，路边还能看到被击毁的坦克残骸和弹坑。高原停火线口岸是联邦与阿瓦拉齐之间唯一的通道，平时关闭，只在每月的固定日子开放，离散的家庭在中立的会面室里团聚几个小时，人道车队也从这里交换战俘遗骸和援助物资，会面室的墙上贴满了寻亲启事。\n居民 92% 以拉诺瓦语为母语，识字率约 83%。插秧季节，梯田里灌满了水，从河谷望上去像一级级镜子；收割后，稻农们把第一捆新稻送到教堂的圣坛前感恩。许多人家的地窖就是当年的防空洞，如今用来储存稻种和腌菜。老人们说，停火线那边也有梯田，晴天时能看见对岸的人在插秧，只是谁也不敢挥手。市花是长春花，市树是桉树。"
    en: "Fiantra is the rice-growing town of the northern highlands of the Christian Federation of Ambohara, one of its ten federal cities. The city covers about 40,000 km² and has some 600,000 people, about 15 to the square kilometre. Its land runs south from the Ambo valley up onto the northern rim of the Andrina Highlands, at an average height of about 830 m and rising to 2,025 m. The highland climate is mild, with a mean temperature of 19.2 °C and about 2,300 mm of rain a year, most of it from May to October, and February is the driest month. Terraces climb in steps from the Ambo valley up the hillsides, which is why Fiantra is called the federation's granary, and the golden terraces on the city flag say just that.\nFarming is the city's lifeblood: terrace rice, other farming and forestry are its three main trades, the primary sector makes up 47% of its economy, and output per head is about $7,020. The Fiantra Rice Research Institute is the federation's national agricultural research body; its trial fields line the valley with more than a thousand varieties of rice, some drought-resistant ones now grown across the island, and it runs courses for farmers in intercropping and water-saving irrigation. The Vavambo–Tamata Railway passes through the town, climbing from the deep-water port of Vavambo on the north-western bay up to the highlands and stopping at Fiantra Station before going on to the capital, taking highland rice down to the ports; the Federal Trunk Road, called the federation's \"backbone\", runs about 183 km within the city's bounds, and the Cross-Island Road about 23 km.\nThe town's Lutheran seminary trains half the country's pastors: its course lasts five years, students live in cloistered quarters and every day begins with morning prayer, its library holds early translations of the Bible into Ranovan, and many graduates are sent to other countries of the island as missionaries. On Sundays the whole country closes, townspeople go to worship dressed in white, and the tea after the service is also when the Homeland Party recruits. Homeland's roots go deepest here: it took 55.0% and 17 of the city council's 31 seats and governs alone, and the Speaker, Naina Rakotomalala, is also from Homeland; the mayor, Faly Rakotonirina, was elected with 51.9%, and even the runner-up was a Homeland candidate. The Highland Farmers' Party has 7 seats, the Christian People's Party 5 and the Federal Liberal Party only 2.\nIn the Highland War Fiantra lay just behind the front, and air-raid shelters and old trenches remain. The Highland North Road runs south from the Avaratsy mining town of Marovato over the northern rim of the highlands to Fiantra, about 138 km of it within the city's bounds, and was one of the main battlefields of the Highland War; since the ceasefire it has been cut at the line by two fences of barbed wire and minefields, and wrecked tanks and shell craters can still be seen beside it. The Highland Ceasefire Line Crossing is the only way between the Federation and Avaratsy; it is normally closed and opens only on fixed days each month, when divided families meet for a few hours in a neutral meeting room and humanitarian convoys exchange the remains of prisoners of war and relief supplies, and the walls of the meeting room are covered with notices from people searching for relatives.\nNinety-two per cent of the people speak Ranovan as their mother tongue, and literacy is about 83%. At planting time the terraces are flooded, and seen from the valley they look like a stair of mirrors; after the harvest the farmers bring the first sheaf of new rice to the church altar in thanksgiving. Many families' cellars are the old air-raid shelters, now used to store seed rice and pickles. Old people say there are terraces on the other side of the ceasefire line too, and on clear days you can see the people over there planting rice, though nobody dares to wave. The city flower is the Madagascar periwinkle and the city tree the eucalyptus."
