  names: {zh: 安帕尼, en: Ampany, art-x-ranova: Ampany}
  notes:
    zh: "安帕尼是安博哈拉基督教联邦东南端的港口和军镇，联邦斜贯全岛的带状国土在这里抵达东南海岸。市域约 4 万平方公里，从海岸延伸到海拔 1874 米的山地，人口约 56 万。这里属热带季风气候，年均气温 23.7 ℃，年降水约 3330 毫米，二月最干，八月雨量超过 500 毫米。市旗深蓝底上是白边红十字，左上角一座白色塔楼：十字取自联邦旗，塔楼就是这座防备南方的要塞港。市花是夹竹桃，市树是木麻黄。\n安帕尼是联邦防备齐马罗沃和伊索卡游击队的南方要塞。联邦南部边境长期受齐马罗沃威胁和游击队袭扰，军费常年占国内生产总值近 5%。港内的安帕尼海军基地是东南舰队的母港，两道防波堤围成港池，码头后面是修船厂、油库和水兵营房，舰艇从这里出发巡逻领海和航道，护送商船通过危险海域。城外的安帕尼空军基地有一条长三千米的跑道，两架战斗机全天候待命，接到警报几分钟内就能起飞；安帕尼空军靶场里摆着退役的坦克、卡车和模拟跑道，供战机练习投弹和对地射击。联邦最大的陆军训练场安帕尼野战训练场占据城外大片稀树草原和丘陵，坦克和装甲车在这里机动和实弹射击。\n经济以港口航运、国防和渔业为主，服务业约占 63%，人均产值约 1 万美元，略高于全国平均。工作年龄人口占 69%，老人只占 4%，城里住着大批年轻军人和随军家属，修船、补给和军需供应养活了许多人家，渔船则在港外的航道边作业。\n市议会 31 席由选举产生，最近一次投票率 68.1%。家园党得票 52.3%、拿下 16 席，单独执政；基督教人民党 8 席，高原农民党 4 席，联邦自由党 3 席。市长汉塔·拉索阿属家园党，以 58.3% 对 41.7% 击败基督教人民党的对手，议长是同党的里亚娜·兰德里亚。\n联邦干线从西北的深水港瓦凡博出发，穿过首都安博哈拉，沿高原南缘下到安帕尼，全长约一千三百公里，是联邦从一端到另一端的唯一公路，人称联邦的「脊梁」；军队的车队沿着它在西北和东南两支舰队之间调动兵力。高原路段弯多坡陡，雨季常有塌方，长途司机经过路边的圣母像时总要按一声喇叭。通往空军靶场的安帕尼空军靶场公路只有 5.8 公里，其中 1.4 公里是安帕尼特大桥。\n居民九成以上说拉诺瓦语，平均预期寿命 71.1 岁，识字率约 87%。星期日全城停业，礼拜之后的家宴是一周中最重要的时刻。演习期间训练场周围的道路实行管制，附近的牧民得把牛群赶到别处，空军基地周围的村庄早已习惯了战机起降的轰鸣。每年海军节，海军基地对公众开放一天，市民可以登舰参观，码头上挤满了带孩子的家庭，卖烤鱼和椰子水的小摊一直摆到防波堤下。"
    en: "Ampany is the port and garrison town at the south-eastern end of the Christian Federation of Ambohara, where the federation's band of territory, running diagonally across the island, reaches the south-east coast. Its territory of some 40,000 km² stretches from the shore up to highlands of 1,874 m, and it has about 560,000 people. The climate is tropical monsoon, with a mean temperature of 23.7 °C and some 3,330 mm of rain a year; February is the driest month, and August brings more than 500 mm. The city flag shows a red cross edged in white on dark blue with a white tower in the upper hoist: the cross comes from the federal flag, and the tower is this fortress port facing the south. The city flower is the oleander and the city tree the casuarina.\nAmpany is the federation's southern fortress against Tsimarovo and the Isoka guerrillas. The southern border has long faced threats from Tsimarovo and raids by the guerrillas, and military spending has for years run at nearly 5% of GDP. In the harbour, Ampany Naval Base is the home port of the South-East Fleet: two breakwaters enclose the basin, with a shipyard, fuel depot and sailors' barracks behind the quays, and warships sail from here to patrol territorial waters and sea lanes and escort merchant ships through dangerous waters. Outside town, Ampany Air Base has a runway three kilometres long, with two fighters on standby around the clock, able to take off within minutes of an alert; the Ampany Air Weapons Range is set with retired tanks, lorries and a dummy runway for pilots to practise bombing and strafing. The federation's largest army training ground, the Ampany Field Training Area, covers wide stretches of savanna and hills outside town, where tanks and armoured vehicles manoeuvre and fire live rounds.\nThe economy rests on the port and shipping, defence and fishing; services account for about 63%, and output per head is about US$10,000, a little above the national average. People of working age make up 69% of the population and the elderly only 4%: the town is home to great numbers of young soldiers and service families, ship repair, supplies and military contracts support many households, and fishing boats work the edges of the sea lanes beyond the harbour.\nThe 31-seat City Council is elected; turnout at the last election was 68.1%. The Homeland Party won 52.3% of the vote and 16 seats and governs alone; the Christian People's Party has 8 seats, the Highland Farmers' Party 4 and the Federal Liberal Party 3. The mayor, Hanta Rasoa of the Homeland Party, beat the Christian People's Party candidate by 58.3% to 41.7%, and the speaker is her party colleague Riana Randria.\nThe Federal Trunk Road starts at the deep-water port of Vavambo in the north-west, passes through the capital, Ambohara, and comes down the southern edge of the plateau to Ampany. Some 1,300 km long, it is the only road from one end of the federation to the other and is called the federation's 'spine'; army convoys use it to move troops between the north-western and south-eastern fleets. The highland stretches are steep and winding, landslides are common in the rains, and long-distance drivers always sound their horns as they pass the wayside statues of the Virgin. The Ampany Air Weapons Range Road to the range is only 5.8 km long, 1.4 km of it on the Ampany Viaduct.\nMore than nine in ten residents speak Ranovan, life expectancy is 71.1 years and literacy about 87%. On Sundays the whole town shuts, and the family meal after church is the most important moment of the week. During exercises the roads around the training area are closed and nearby herders must drive their cattle elsewhere, and the villages around the air base have long grown used to the roar of fighters. Every Navy Day the naval base opens to the public for a day and townspeople can go aboard the ships; the quays fill with families and children, and stalls selling grilled fish and coconut water stretch all the way to the foot of the breakwater."
