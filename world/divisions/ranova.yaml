# Administrative divisions of Ranova (拉诺瓦岛). The island has no country above it: its 30 nations are
# states (subtype: country, no parent), their cities cities (locality) with no districts, and the United
# Republic of Ranova, the government in exile that claims the whole island, a state like the others whose
# capital and area it does not control (uncontrolled:); its seat and claims are in its notes. On the map it
# is the region's territory in world/generator/ranova.yaml, the island's outline.
# id: stable internal key, referenced by other files. codes: a state has only its ISO 3166-1 code, its letters
# taken from its name as this world sees fit, real countries' codes notwithstanding (the nations numbered 910
# to 935 in the order they were founded on the map, then 936 to 939; the government in exile RA, RAN, 950); a city has its
# 6-digit admin code (600100), which may change on reorganisation.
# Names are Chinese, English and the nation's own language: Ranovan (art-x-ranova) or, on the coasts
# and in Nusira, Kasiri (art-x-kasiri). A state's card block is `nation:` (see pipeline/atlas/world.py).
divisions:
- id: div_p735rv
  subtype: country
  status: generated
  names: {zh: 拉诺瓦联合共和国, en: United Republic of Ranova, art-x-ranova: Repoblika Mitambatra an'i Ranova}
  notes:
    zh: "拉诺瓦联合共和国是拉诺瓦岛上曾经唯一的国家，如今是一个流亡政府，驻在东南海岸外的安巴罗国际托管地。它在法律上仍然主张对全岛和两侧群岛的主权，但三十多年来没有实际控制任何领土，只在安巴罗旧海军要塞旁的一座行政楼里设有总统府、临时国民议会和几个部门，在萨马伊、马哈维洛和海外设有代表处。\n拉诺瓦岛是太平洋东北部的一座大岛，位于加利福尼亚东南约一千五百公里的海上，主岛面积约一百万平方公里，形状狭长，西北和东南外海各有十多座大小不一的岛屿。中部是纵贯南北的安德里纳高原，北端有全岛最高的马洛卡山，东部是陡峭的法拉纳断崖和热带雨林，西部是稀树草原和干燥的丘陵，西南是多刺灌木林和半荒漠。全岛人口约三千万，通行拉诺瓦语和沿海的卡西里语。\n联合共和国统一了本岛和两侧的群岛，首都设在高原中部的安博哈拉。三十多年前，它在经济危机、地方分离运动和意识形态对立中崩溃，这场崩溃被称为「大分裂」。东南群岛和萨拉卡依据条约和平分离，沿用了联合共和国的船旗样式；本岛则陷入长期战乱，先后形成了三十个国家和武装控制区。安博哈拉被基督教联邦接管后，最后一届内阁和部分议员撤到萨马伊；安巴罗之围结束、托管地成立后，流亡政府迁入安巴罗，成为国际委员会认可的谈判一方。\n流亡政府由流亡总统领导，临时国民议会由大分裂前的国民议会议员、侨民代表和难民营代表组成，每五年在难民营和海外侨民中改选一次。它的主要工作是为难民和海外侨民签发身份与旅行证件，保存联合共和国的档案、法律和国旗，参加在安巴罗举行的和平谈判，并主张以联邦方式和平统一全岛。沿海战争后，它谴责马索沃利吞并法尼里沿海，并为逃到伊瓦洛、丢失了证件的沿海居民补发身份证件。只有少数国家承认它是拉诺瓦的合法政府，多数国家把它视为一个有象征意义的对话者。岛上各国的人常说：「我们曾经是一个国家，如今是一座岛。」\n现任流亡总统是诺罗·安德里亚马西。大分裂时的最后一任总统拉库图·拉贝里沃率最后一届内阁撤到萨马伊；安巴罗托管地成立后，流亡总统哈尼塔·拉索阿主持流亡政府迁入安巴罗；后来的若埃尔·拉齐法在难民营中设立选区，难民从此参加临时国民议会的选举。临时国民议会共 60 席：大分裂前当选、仍然在世的议员保留 24 席，属于宪政共和联盟；侨民代表 20 席，来自海外拉诺瓦人联合会；难民营代表 16 席，来自归乡运动。流亡政府在安巴罗没有司法管辖权，宪法委员会由联合共和国最高法院的最后几名法官和他们推选的法学家组成，共 5 人，只就宪法解释和流亡政府的内部争议发表意见，没有强制力。流亡政府也没有武装力量，只有一支四十人的礼宾卫队，从侨民和难民中志愿招募，不携带实弹。每逢联合共和国日，礼宾卫队在要塞旁升起绿底白色斜十字、中央红盘金星的旧国旗，难民营里的老人会跟着唱《一座岛，一个家》。"
    en: "The United Republic of Ranova was once the only state on the island of Ranova and is now a government in exile, seated in the Ambaro International Trust Territory off the south-east coast. In law it still claims sovereignty over the whole island and the islands on either side, but for more than thirty years it has held no territory at all: it keeps a presidency, a Provisional National Assembly and a few ministries in an office building beside Ambaro's old naval fortress, and missions in Samay, Mahavelo and abroad.\nRanova is a large island in the north-eastern Pacific, some 1,500 km south-east of California. The main island covers about a million square kilometres in a long, narrow shape, with a dozen or more islands of every size offshore to the north-west and south-east. The Andrina Highlands run down the middle, the Maroka Massif at the northern end is the highest ground, the east is the steep Farana Escarpment and rainforest, the west savanna and dry hills, and the south-west spiny thicket and semi-desert. About 30 million people live on the island, speaking Ranovan and, on the coasts, Kasiri.\nThe United Republic united the main island and the islands on either side, with its capital at Ambohara in the middle of the highlands. More than thirty years ago it collapsed amid economic crisis, regional separatism and ideological division, a collapse known as the Great Sundering. The south-eastern islands and Saraka left peacefully by treaty and kept the pattern of the Republic's ensigns, while the main island fell into a long war out of which thirty states and armed zones emerged. When the Christian Federation took over Ambohara, the last cabinet and some members of parliament withdrew to Samay; after the Siege of Ambaro ended and the trust territory was set up, the government in exile moved to Ambaro and became a party to talks recognised by the International Commission.\nThe government in exile is led by a president in exile. Its Provisional National Assembly is made up of members of the pre-Sundering parliament and representatives of the diaspora and the refugee camps, re-elected every five years in the camps and among Ranovans abroad. Its work is to issue identity and travel papers to refugees and the diaspora, to keep the United Republic's archives, laws and flag, to take part in the peace talks at Ambaro and to argue for a peaceful reunion of the island as a federation. Since the Coastal War it has condemned Masovoly's annexation of the Faniry coast and reissued identity papers to people from the coast who fled to Ivalo without them. Only a few states recognise it as Ranova's lawful government; most treat it as a symbolic interlocutor. People across the island say, 'We were once a country; now we are an island.'\nThe present President in exile is Noro Andriamasy. Rakoto Rabearivo, the last president at the time of the Sundering, led the last cabinet to Samay; after the Ambaro Trust Territory was set up, the President in exile Hanita Rasoa oversaw the government's move to Ambaro; and her successor Joël Ratsifa gave the refugee camps constituencies, so that refugees began to vote for the Provisional National Assembly. The Assembly has 60 seats: 24 kept by members elected before the Sundering who are still alive, who belong to the Constitutional Republican Union; 20 for diaspora representatives from the Federation of Ranovans Abroad; and 16 for representatives of the refugee camps from the Return Movement. The government in exile has no jurisdiction in Ambaro, and its Constitutional Council, five members drawn from the last judges of the United Republic's supreme court and the jurists they chose, gives opinions only on constitutional questions and internal disputes, with no power to enforce them. Nor does it have armed forces, only an honour guard of forty volunteers recruited from the diaspora and the refugees, who carry no live ammunition. On the Day of the United Republic the honour guard raises the old flag, a white saltire on green with a gold star on a red disc, beside the fortress, and the old people of the camps sing One Island, One Home along with it."
