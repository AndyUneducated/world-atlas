# ── 马索沃利民主主义人民共和国 ──
- id: div_s07wh5
  subtype: country
  status: generated
  names: {zh: 马索沃利民主主义人民共和国, en: Democratic People's Republic of Masovoly, art-x-ranova: Repoblika Demokratika Entin'ny Vahoaka Masovoly}
  short_names: {zh: 马索沃利, en: Masovoly}
  notes:
    zh: "马索沃利民主主义人民共和国位于拉诺瓦岛东北海岸，北接阿瓦拉齐，南邻洛哈瓦托王国，西面是安博哈拉基督教联邦和失去了海岸的伊瓦洛自由公社联合会，面积约四万平方公里，人口约一百二十万，有首都安德里安巴、内陆的菲拉纳和在沿海战争中吞并的法尼里三座城市。国土背山面海，东部海湾边是狭长的平原，西部是覆盖雨林的丘陵，南部的法尼里一带是河口、渔港和法拉纳断崖下的丘陵。\n大分裂时，东北各省的劳动党组织由游击队司令拉齐马·沃利领导，与北方的同志分道扬镳，建立了以他为核心的民主主义人民共和国。沃利去世后被尊为「劳动党永远的总书记」，权力传给他的儿子拉齐马·沃利二世；沃利二世生前任劳动党主席，去世后被尊为「劳动党永远的主席」。两个称号都永远为他们保留，从拉齐马·沃利三世起，党的最高领导人改任第一书记，马索沃利由此成为全岛唯一的世袭共产主义政权。现任劳动党第一书记、国务委员会委员长拉齐马·沃利三世被称为「伟大的继承者」，同时兼任人民军总司令和劳动党中央军事委员会主席。他主持的国务委员会与党的中央军事委员会并列为最高决策机关，政务院只管经济和日常行政。国家以「一心团结」思想为指导，全国的时钟比邻国慢半小时，以纪念创始领袖出生的时刻。\n最高国务会议 500 席全部属于马索沃利劳动党，它仍是名义上的立法机构，社会主义青年同盟只是议会外的群众组织。劳动党组织指导部掌管全部干部任免，宣传鼓动部管理广播和报纸，国家保卫部监视居民，党的政治保卫部监视党员和干部；政治案件不经中央裁判所，而由国家保卫部的特别审判庭不公开审理，被判刑者的家属常被一并流放到内陆劳动营。男性 17 岁起要服 3 年义务兵役，女性服 18 个月劳动服务或志愿入伍，退役后留在预备役直到 50 岁，所有成年人都要参加一心团结赤卫队，家庭成分「不良」的人只能编入劳动部队；军费高达生产总值的 18%。约八成居民不信教，约 15% 的人保持祖灵信仰。领袖的继承人至今没有公开指定。外国人入境几乎都要经国家旅行社安排，被任意拘押的风险很高，也得不到领事保护。夏天最常见的吃食是冷米粉汤，举重是国家最看重的运动，举重冠军的照片挂在每个工厂的光荣榜上。\n这里是全岛最封闭的国家。居民按家庭出身划分成分，迁徙、就业和婚姻都受到严格管理；广播和报纸全部国营，外国电台被屏蔽，私自出境者的家属会受到牵连。最高国务会议的代表由劳动党一手提名，选举时只有一名候选人，投票率年年接近百分之百。军队是国家的支柱，全国四分之一的成年人编入预备役，海岸和山区挖满了坑道，据称还拥有短程导弹。\n马索沃利的报纸多年来把南邻的法尼里公社（今伊瓦洛自由公社联合会）称为「无政府主义的混乱」，指责公社收留越境出逃的马索沃利人，又用短波电台向北方「散布毒素」。近年，一艘马索沃利渔船的船员带着家属驶进法尼里港，公社的全体大会拒绝把他们交回。国务委员会随即宣布要「解救沿海劳动人民」，人民军按作战总局的计划，在一个星期日的凌晨沿东海岸公路南下，同时从海上登陆法尼里港，这就是沿海战争。法尼里的志愿民兵只有步枪和少量迫击炮，抵抗了约十天，随后掩护约八万居民撤往内陆的伊瓦洛；人民军追到法拉纳断崖脚下，没能攻上山坡，在阿瓦拉齐的斡旋下停止了炮击，战线就此冻结，至今没有和约。最高国务会议一致通过把法尼里沿海并为国家的第三座城市，保留原名；伊瓦洛联合会和大多数国家都不承认这次吞并。\n被吞并的沿海按马索沃利的样子重新组织：工人议会和合作社被解散，工厂、船厂和渔船收归国营，农田并入集体农庄，劳动券由中央人民银行按极低的比价兑换成沃拉，几十份公社报纸和电台全部关闭；公社的机构随撤离的居民迁到了内陆的伊瓦洛，留下的会堂和楼房被党政机关和保卫部门占用。社会安全军进驻城区，留下的居民都要登记家庭出身，前公社代表、民兵和报纸编辑被列为「敌对成分」，许多人被送进菲拉纳山谷里的再教育农场；空出来的住房分给了从首都和菲拉纳迁来的「成分好」的家庭。人民军进城的那一天被定为「法尼里解放日」，祖国统一战线每年把几名「悔过」的前公社代表请上主席台，代表「获得解放的沿海劳动人民」讲话。\n马索沃利是世俗协约的成员，与阿瓦拉齐是兄弟之邦，在高原战争中派兵支援，但两国关系时冷时热，阿瓦拉齐的开放政策常被马索沃利报纸批评为「修正主义」。沿海战争中，阿瓦拉齐只呼吁「双方克制」，既不谴责也不承认吞并，兄弟铁路上的粮食和燃料列车一天也没有停。经济以自给自足为目标，以稀土、石墨和集体农庄的稻米为主，吞并法尼里后又多了渔业、罐头和造船，粮食歉收时仍常常依赖阿瓦拉齐的援助；援助的粮食和燃料多半经兄弟铁路从沃希马希运来，这条铁路也是这个封闭国家为数不多的对外通道，乘客须持两国签发的通行证。人均收入约两千一百七十美元，首都的宽阔大街上汽车稀少，行人和自行车却很多。每年创始领袖诞辰日，全国在中央广场举行集体舞和火炬游行。"
    en: "The Democratic People's Republic of Masovoly lies on Ranova's north-east coast, with Avaratsy to the north, the Kingdom of Lohavato to the south, and to the west the Christian Federation of Ambohara and the Free Communes of Ivalo, now cut off from the sea. It covers some 40,000 km² with about 1.2 million people in three cities: the capital, Andriamba, inland Firana, and Faniry, annexed in the Coastal War. The country has mountains at its back and the sea in front: a narrow plain round the eastern bay, rainforested hills to the west, and in the south, around Faniry, estuaries, a fishing port and the hills below the Farana Escarpment.\nIn the Sundering the Workers' Party organisations of the north-eastern provinces, led by the guerrilla commander Ratsima Voly, broke with their northern comrades and founded a Democratic People's Republic with him at its core. After his death Voly was proclaimed Eternal General Secretary of the Workers' Party and power passed to his son, Ratsima Voly II, who led the party as its Chairman and on his own death was proclaimed Eternal Chairman of the Workers' Party. Both titles are kept for them for ever, and from Ratsima Voly III on the party's leader has been its First Secretary, making Masovoly the only hereditary communist regime on the island. The present First Secretary of the Workers' Party and Chairman of the State Affairs Commission, Ratsima Voly III, is called 'the Great Successor' and is also Commander-in-Chief of the People's Army and Chairman of the party's Central Military Commission. The State Affairs Commission he chairs stands beside the party's Central Military Commission as the highest decision-making body, and the Cabinet handles only the economy and day-to-day administration. The state is guided by the 'One Heart' doctrine, and the country's clocks run half an hour behind its neighbours' to mark the hour of the founder's birth.\nAll 500 seats of the Supreme State Council, still the legislature in name, belong to the Masovoly Workers' Party, and the Socialist Youth League is a mass organisation outside parliament. The party's Organisation and Guidance Department controls every appointment, its Propaganda and Agitation Department runs radio and the press, the Ministry of State Protection watches the population and the party's Political Security Department watches party members and cadres; political cases bypass the Central Court and are tried in secret by special tribunals of the Ministry of State Protection, and the families of the convicted are often banished with them to labour camps inland. Men serve three years of national service from 17, women 18 months of labour service or volunteer for the forces, and veterans stay in the reserve until 50; every adult must belong to the One-Heart Unity Red Guards, and those of \"bad\" family background may serve only in labour units; military spending reaches 18% of output. About eight in ten people profess no religion and about 15% keep to ancestral religion. The leader's heir has still not been publicly named. Foreigners can enter almost only through the state travel agency, run a high risk of arbitrary detention and have no consular protection. Cold rice-noodle soup is the commonest summer food, and weightlifting is the sport the state values most, with photographs of weightlifting champions on the honour board of every factory.\nIt is the most closed country on the island. People are classed by family background, and movement, work and marriage are all tightly controlled; radio and newspapers are all state-run, foreign stations are jammed, and the families of those who leave without permission are punished. The Workers' Party nominates every deputy to the Supreme State Council, each seat has a single candidate, and turnout is close to 100% every time. The army is the pillar of the state: a quarter of adults are in the reserve, the coast and hills are honeycombed with tunnels, and it is said to have short-range missiles.\nFor years Masovoly's papers called the Faniry communes to the south (now the Free Communes of Ivalo) 'anarchist chaos', accusing them of sheltering Masovoly people who fled across the border and of 'spreading poison' northwards by shortwave radio. In recent years the crew of a Masovoly fishing boat sailed into Faniry harbour with their families, and the communes' general assembly refused to hand them back. The State Affairs Commission then announced that it would 'rescue the working people of the coast': before dawn one Sunday the People's Army, following the plan of its General Operations Bureau, drove south along the East Coast Road and landed troops from the sea in Faniry harbour. This was the Coastal War. Faniry's volunteer militia had only rifles and a few mortars; it held out for about ten days and then covered some 80,000 residents as they withdrew inland to Ivalo. The People's Army followed them to the foot of the Farana Escarpment but could not take the slopes, and once Avaratsy had brokered an end to the shelling the front froze where it stood; there is still no peace treaty. The Supreme State Council voted unanimously to make the Faniry coast the country's third city, keeping its name; The federation, now the Free Communes of Ivalo, and most states do not recognise the annexation.\nThe annexed coast has been remade on Masovoly's pattern: the workers' councils and co-operatives were dissolved, the factories, shipyard and fishing boats taken over by the state and the farmland merged into collective farms; the Central People's Bank exchanged labour vouchers for vola at a punishing rate, and the dozens of commune newspapers and radio stations were all closed; the communes' institutions moved inland to Ivalo with those who withdrew, and the halls and offices they left behind have been taken over by party, state and security bodies. The Social Security Forces garrison the town, and everyone who stayed had to register their family background; former commune delegates, militia members and newspaper editors were classed as 'hostile elements', and many were sent to the re-education farm in a valley outside Firana, while the empty homes went to families of 'good background' moved in from the capital and Firana. The day the People's Army entered the town has been made 'Faniry Liberation Day', when each year the Fatherland United Front puts a few 'repentant' former commune delegates on the platform to speak for 'the liberated working people of the coast'.\nMasovoly belongs to the Secular Accord and calls Avaratsy its fraternal state; it sent troops in the Highland War, but relations blow hot and cold, and the Masovoly press often attacks Avaratsy's opening as 'revisionism'. In the Coastal War Avaratsy only urged 'restraint on both sides', neither condemning nor recognising the annexation, and the grain and fuel trains on the Fraternity Railway never stopped for a day. The economy aims at self-sufficiency, with rare earths, graphite and rice from the collective farms, and since the annexation fishing, canning and shipbuilding as well; it still often depends on Avaratsy's aid after bad harvests, and most of that grain and fuel comes down the Fraternity Railway from Vohimahy, one of the few links the country has abroad, on which every passenger needs a pass from both governments. Income is about 2,170 dollars a head; the wide avenues of the capital see few cars but many walkers and bicycles. Every year on the founder's birthday the whole country holds mass dances and torchlight parades in the central square."
