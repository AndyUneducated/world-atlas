  names: {zh: 桑博, en: Sambo, art-x-ranova: Sambo}
  notes:
    zh: "桑博是洛哈瓦托王国东海岸的渔港，也是王国唯一的港口和都城之外唯一的城市。全市面积约 8000 平方公里，人口约 15 万。城区紧挨海边，海拔不到 50 米，市境沿河谷向西伸进山地，最高处 1124 米，茶园和稻田沿河谷层层延伸。这里是湿热的热带季风气候，年均气温 25.5 摄氏度，年降水约 3100 毫米，比都城多出四百毫米，八月最湿，达 479 毫米，二月最干。\n桑博靠海吃饭，也靠山吃饭：渔业和种植业是两大支柱，第一产业占全市经济的 45%，人均生产总值约 3240 美元，低于都城。桑博鱼市就在港口旁，每天凌晨渔船靠岸后开市，金枪鱼、石斑鱼、龙虾和章鱼按重量拍卖，一个小时内就能卖完，冷库里的鱼供应都城的餐馆和出口加工厂；鱼市旁的小饭馆早上六点开始卖鱼汤和烤鱼，是渔民和码头工人吃早饭的地方。河谷两侧的桑博茶园层层铺上山坡，采茶工清晨背着竹篓采摘嫩叶，送进制茶工坊萎凋、揉捻和烘干，这里的红茶带有花香，是王国最受欢迎的出口商品之一，新茶总是先在城里的集市上开卖。\n桑博稻作研究所是王国的国家农业研究机构，试验田沿河谷排开，种着上千个水稻品种，其中一些耐旱品种已经推广到全岛；研究所还为农民开办培训班，教间作和节水灌溉。白沙滩边的桑博海滨度假酒店有三百多间客房、三座游泳池和一个潜水中心，客人多来自阵营盟国和海外，酒店前的珊瑚礁退潮时可以看到成群的热带鱼。王国对游客实行配额，旅游旺季时酒店雇用了附近村庄的许多年轻人，不少人希望放宽游客限额，这在王国国民协会的年轻会员中也有不少支持者。\n桑博还是夜行者协会的总部所在地。这个组织由离开最神圣的黎明千年国的前信徒建立，成员约三千五百人，会长沃拉娜·拉索阿奈沃十八岁时随朝圣队伍离开圣城，后来在洛哈瓦托当护士。协会帮助刚离开的年轻人找住处、补学历和找工作，收集强迫劳动和隔离家庭的证词；王国允许它公开活动，千年国的长老会则称之为「黑夜的团伙」。\n城务由国王任命的城守索阿·兰德里亚马纳纳主持，重大事务须征询当地寺院住持的意见。约 120 公里长的洛哈瓦托—桑博公路翻过山丘通往都城，东海岸公路在市境内经过约 28 公里，横贯公路也有约 11 公里在此，另有一条约 8 公里的公路通往茶园。\n居民 92% 以拉诺瓦语为母语，识字率约 77%。渔民出海前会到海边的小佛龛前供一碗米饭，回港后先把最好的一条鱼送给寺院。采茶季节，山坡上到处是背竹篓的采茶工，傍晚收工时的歌声能一直传到港口。市花是茶花，市树是椰子树，城旗上深红海浪里的那条白鱼，说的正是这座王国唯一的港口。"
    en: "Sambo is the fishing port of the Kingdom of Lohavato's east coast, the kingdom's only harbour and its only city besides the capital. The city covers about 8,000 km² and has some 150,000 people. The town sits right by the sea at less than 50 m, while the city's land reaches west up the river valley into the hills, rising to 1,124 m, with tea gardens and rice fields stepping up the valley. The climate is hot, humid tropical monsoon: the mean temperature is 25.5 °C and the rainfall about 3,100 mm a year, four hundred millimetres more than the capital, with August the wettest month at 479 mm and February the driest.\nSambo lives from the sea and from the hills: fishing and farming are its two mainstays, the primary sector makes up 45% of the city's economy, and output per head is about $3,240, below the capital's. The Sambo Fish Market stands beside the harbour and opens each day before dawn when the boats come in; tuna, grouper, lobster and octopus are auctioned by weight and sold out within an hour, and fish from its cold store supplies the capital's restaurants and the export processing plants. The little eating houses beside the market start serving fish soup and grilled fish at six in the morning, and that is where fishermen and dockers eat breakfast. On both sides of the valley the Sambo Tea Garden climbs the slopes in terraces; pickers carrying bamboo baskets pluck the young leaves in the early morning and take them to the garden's works to be withered, rolled and dried, and the flowery black tea made here is one of the kingdom's most popular exports, the new season's tea always going on sale first in the town market.\nThe Sambo Rice Research Institute is the kingdom's national agricultural research body; its trial fields line the valley with more than a thousand varieties of rice, some drought-resistant ones now grown across the island, and it runs courses for farmers in intercropping and water-saving irrigation. On the white sand, the Sambo Beach Resort has more than three hundred rooms, three swimming pools and a diving centre, and its guests come mostly from allied nations of the bloc and from overseas; at low tide shoals of tropical fish can be seen on the coral reef in front of it. The kingdom sets quotas on visitors, and in the high season the hotel employs many young people from nearby villages, many of whom would like the quotas relaxed, a view with plenty of support among the younger members of the Royal National Association too.\nSambo is also the headquarters of the Night Walkers' Association, founded by former believers who left the Most Holy Millennial Realm of the Dawn, with some 3,500 members. Its president, Volana Rasoanaivo, left the holy city with a pilgrim band at eighteen and later worked as a nurse in Lohavato. The association helps newly arrived young people find somewhere to live, finish their schooling and find work, and gathers testimony about forced labour and divided families; the kingdom lets it work openly, while the Realm's Council of Elders calls it \"a gang of the night\".\nThe town is run by the Warden, Soa Randriamanana, appointed by the King, and on weighty matters the Town Office must consult the abbot of the local monastery. The Lohavato–Sambo Road, about 120 km long, crosses the hills to the capital; the East Coast Road passes about 28 km through the city's land and the Cross-Island Road about 11 km, and a road of about 8 km leads to the tea garden.\nNinety-two per cent of the people speak Ranovan as their mother tongue, and literacy is about 77%. Before putting to sea fishermen offer a bowl of rice at a little shrine on the shore, and on returning they give the best fish of the catch to the monastery. In the picking season the slopes are full of pickers with bamboo baskets, and their singing as they finish at dusk carries all the way down to the harbour. The city flower is the tea blossom and the city tree the coconut palm, and the white fish in the deep red waves of the city flag stands for the kingdom's only port."
