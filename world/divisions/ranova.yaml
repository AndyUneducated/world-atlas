# ── 齐阿拉野化邦 ──
- id: div_1tan4g
  subtype: locality
  parent: div_p735rv
  role: nation
  status: generated
  names: {zh: 齐阿拉野化邦, en: Rewilded Polity of Tsiala, art-x-ranova: Tany Maitso Tsiala}
  short_names: {zh: 齐阿拉, en: Tsiala}
  notes: {zh: '齐阿拉野化邦位于拉诺瓦岛西南部，面积约五万四千平方公里，人口只有约十五万，是全岛人口密度最低的国家。国名意为「森林」。境内是连绵的干燥落叶林、多刺灌木林和石灰岩尖峰林，河谷中保留着全岛最完整的原始森林，狐猴、马岛长尾狸猫和变色龙随处可见。

      大分裂后，西南的森林地区一度被伐木公司和金矿主瓜分，森林大片消失。一群环保主义者、离开城市的知识分子和当地森林居民组成了「回归运动」，他们赶走了伐木公司，炸毁了矿区道路，宣布在这片土地上「废除国家、废除工业、废除货币」，让森林重新生长。野化邦没有政府、没有公路、没有电网，居民分散在森林中的几十个营地里，以采集、狩猎、捕鱼和小块轮作为生，营地之间的事务由各营地的长老圈协商，长老圈推选一名发言人对外交涉。

      野化邦的规则十分严格：境内禁止使用发动机、电子设备和化学品，外人只能步行进入，必须在边界交出手机和相机。孩子们在营地里学习辨认植物、追踪动物和讲述祖先的故事，而不是读书写字，这一点在邻国和国际组织中引起了很大争议。生病的人常常只能依靠草药，一些人最终离开森林去邻国就医，再也没有回来。

      野化邦保持中立，与阿拉齐纳邦联关系密切，两者都受到齐马罗沃和卡波拉的威胁，南方战争中多次有武装人员和偷猎者越境。由于没有货币和统计，人均收入只能按估计，约八百美元。国际环保组织把这里看作「地球上最大胆的实验」，也有人批评它是对现代医疗和教育的拒绝。每年雨季开始时，各营地的人聚集在猴面包树下，用歌声和鼓声迎接第一场雨。', en: "The Rewilded Polity of Tsiala lies in south-western Ranova, some 54,000 km² with only about 150,000 people, the most thinly settled country on the island; the name means 'forest'. It is a land of dry deciduous forest, spiny thicket and limestone pinnacle forest, and its valleys hold the most intact primary forest on the island, alive with lemurs, fossas and chameleons. \nAfter the Sundering the south-western forests were carved up by logging companies and gold-mine owners, and great stretches of forest disappeared. A movement of environmentalists, intellectuals who had left the cities and local forest people, the 'Return', drove out the loggers, blew up the mine roads and declared that on this land 'the state, industry and money are abolished' so that the forest could grow back. The Polity has no government, no roads and no power grid; its people live scattered in dozens of camps in the forest by gathering, hunting, fishing and small shifting gardens, business between the camps is settled by their circles of elders, and the circles choose a speaker to deal with outsiders. \nThe rules are strict: engines, electronic devices and chemicals are banned, outsiders may enter only on foot and must hand over phones and cameras at the border. Children in the camps learn to know plants, track animals and tell the stories of their ancestors rather than to read and write, which has caused much controversy in neighbouring states and international bodies. The sick often have only herbal remedies, and some eventually leave the forest for treatment abroad and never return. \nThe Polity is neutral and close to the Alatsina Confederacy; both are threatened by Tsimarovo and Kabola, and armed men and poachers have crossed its borders many times in the Southern War. With no money and no statistics, income can only be estimated, at about 800 dollars a head. International conservation groups call it 'the boldest experiment on earth'; others criticise it as a rejection of modern medicine and education. When the rains begin each year, people from all the camps gather under the baobabs to welcome the first rain with song and drums."}
