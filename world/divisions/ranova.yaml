- id: div_axvb2e
  subtype: locality
  parent: div_hm0zqz
  status: generated
  names: {zh: 卡波拉, en: Kabola, art-x-ranova: Kabola}
  notes:
    zh: "卡波拉是卡波拉新秩序自由领唯一的城市，坐落在拉诺瓦岛南端的海岸上，原是联合共和国海军的南方军港。全市人口约 25 万，辖区约 6500 平方公里，西面是齐阿拉野化邦的森林，北面和东面被齐马罗沃包围。海岸干燥多风，内陆是带刺的灌木林和石灰岩台地，平均海拔 234 米，最高处 408 米；年均气温 25.9 ℃，年降水只有约 756 毫米，市花是仙人掌花，市树是海葡萄。\n新秩序运动的武装支队趁齐马罗沃与原住民交战之际夺取了军港，宣布成立自由领。运动总部占据了老港区的旧港务局大楼，运动首领维基托拉·拉贝在三楼办公，楼下是宣传部和网络组。城市没有市政机构，由运动的城防指挥部管理，指挥官凡嘉·拉菲迪松由运动总部指派；供水、供电、垃圾清运和配给证、通行证的发放归领地行政处，职员多是运动成立前的老公务员。没有任何国家承认卡波拉的证件，居民出境仍得拿邻国或联合共和国时期的身份文件。\n城市的经济围着走私和军火转。旧海军船坞曾是南部舰队的修船基地，生锈的龙门吊和半沉的巡逻艇仍留在港池里，几座车间被改成卡波拉武器作坊，改装皮卡、焊接装甲板、组装简易火箭和无人机，原料多从齐马罗沃走私而来。港区走私仓库堆着燃料、香烟、武器零件和电子产品，运动从每批货中抽成；海岸快艇码头的改装快艇架着机枪，向渔船收「保护费」。合法的生计主要是渔业：卡波拉鱼市每天凌晨拍卖金枪鱼、石斑鱼、龙虾和章鱼，卡波拉鱼类罐头厂雇有一千多名工人，多是附近渔村的妇女。工业占全市经济的 54%，人均生产总值只有约 3440 美元。\n城北的旧兵营是北兵营训练营地，外国志愿者在这里受训，国际组织的报告指出营地曾训练未成年人。运动媒体中心设在旧电视台，几十名年轻人剪辑视频、经营账号，向海外招募。城外的卡波拉运动看守所关押着政治犯，许多人未经审判被关多年，获释者讲述了拥挤的牢房、强迫劳动和与家人断绝联系的经历。对外的陆路是领道 S-RA-110 西南公路，经贝拉纳的盐湖通往齐马罗沃，路边还留着边境冲突时的战壕，北门检查站和贝拉纳边境检查站层层收取过路费。\n城内人口年轻，人均预期寿命 61.6 岁，识字率 66.0%，许多家庭在战争中离开。留下的居民生活在宵禁、检查站和运动口号之下：清晨港口旁的小饭馆照常卖鱼汤和烤鱼，星期六中央市场挤满进城赶集的农民；卡波拉发电厂设备老旧，用电高峰时轮流停电，每月一次的「先锋之夜」在老电影院改成的运动集会厅举行，许多居民宁愿早早关灯。老人们私下仍用港口的旧名字称呼街巷，说军港「换过几面旗，鱼还是那些鱼」。"
    en: "Kabola is the only city of the New Order Free Territory of Kabola, on the coast at the southern tip of Ranova, and was once the United Republic navy's southern base. It has about 250,000 people and some 6,500 km² of territory, with the forests of the Tsiala Rewilded State to the west and Tsimarovo surrounding it to the north and east. The coast is dry and windy and the interior is thorn scrub and limestone tableland, with a mean elevation of 234 m and a high point of 408 m; the mean temperature is 25.9 °C and the annual rainfall only about 756 mm, and the city flower is the prickly pear flower and the city tree the sea grape.\nThe armed detachments of the New Order movement seized the naval port while Tsimarovo was at war with the indigenous peoples and proclaimed the Free Territory. The movement's headquarters occupy the old harbour board building in the old port; the Head of the Movement, Vikitora Rabe, works on the third floor, with the propaganda department and the internet team below. The city has no municipal government: it is run by the movement's City Command, whose commander, Fanja Rafidison, is named by the headquarters, while water, power, rubbish collection and the issuing of ration cards and passes fall to the Territory Administration Office, staffed mostly by civil servants who were there before the movement. No state recognises Kabola's papers, so residents leaving still need documents from a neighbouring state or from the United Republic.\nThe economy revolves around smuggling and arms. The Old Naval Dockyard was the Southern Fleet's repair base, and rusting gantry cranes and half-sunk patrol boats still sit in its basin; several of its sheds have become the Kabola Weapons Workshop, which converts pick-ups, welds armour plate and assembles makeshift rockets and drones from materials mostly smuggled from Tsimarovo. The Port Smuggling Warehouses hold fuel, cigarettes, weapon parts and electronics, with the movement taking a cut of every load, and the armed speedboats at the Coastal Speedboat Jetty extort \"protection money\" from fishing boats. Legitimate work is mainly fishing: the Kabola Fish Market auctions tuna, grouper, lobster and octopus every dawn, and the Kabola Fish Cannery employs more than a thousand people, mostly women from nearby fishing villages. Industry makes up 54% of the economy, output per head is only about US$3,440.\nThe old barracks north of town are the North Barracks Training Camp, where foreign volunteers are drilled, and international reports say minors have been trained there. The Movement Media Centre in the old television building has dozens of young people editing videos and running accounts to recruit abroad. The Kabola Movement Detention Centre outside the city holds political prisoners, many kept for years without trial, and those released have described crowded cells, forced labour and being cut off from their families. The only way out by land is the South-West Road, territorial road S-RA-110, which runs past the salt lakes of Belana to Tsimarovo, its verges still scored with trenches from the border fighting, and the North Gate Checkpoint and the Belana Border Checkpoint each levy their own tolls.\nThe population is young, life expectancy is 61.6 years and literacy 66.0%, and many families left during the war. Those who remain live under curfews, checkpoints and the movement's slogans. Yet at dawn the eating houses by the harbour still sell fish soup and grilled fish and on Saturdays the Central Market fills with farmers coming in from the country. The ageing Kabola Power Station imposes rolling blackouts at peak times, and on the monthly \"Vanguard Night\" at the Movement Rally Hall, a converted old cinema, many residents prefer to put their lights out early. Old people still privately call the streets by their old harbour names and say the port \"has changed its flag a few times, but the fish are the same fish\"."
