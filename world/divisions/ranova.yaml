# ── 卡托拉特许领 ──
- id: div_3zzzry
  subtype: country
  status: generated
  names: {zh: 卡托拉特许领, en: Katora Chartered Territory, art-x-ranova: Faritra Nomena Alalana Katora}
  short_names: {zh: 卡托拉, en: Katora}
  notes:
    zh: "卡托拉特许领位于拉诺瓦岛西北外海最西端，由一座主岛和北面的一座小岛组成，面积约四千六百平方公里，人口约十二万，几乎全部是卡托拉安全集团的员工及其家属。岛上只有卡托拉一座公司城，跑道、机库、训练场、仓库和员工宿舍占据了大半个岛。\n卡托拉原是联合共和国海军的一处训练和补给基地。大分裂后，一群退役军官买下了基地的设施，成立卡托拉安全集团，向本岛各方出售安保、培训和作战服务。几年后，集团用一笔巨款从临近的群岛政权手中「买下」了整个岛屿的管辖权，宣布成立特许领。特许领没有公民，只有雇员、承包商和家属；集团董事会是最高权力机关，董事长兼任总督，法律就是公司的规章制度，违规者会被解雇并驱逐出岛。\n董事会共 9 席：6 名股东代表由创始合伙人契约会把持，另有 2 名独立董事和 1 名由卡托拉承包商协会推举的员工代表，不经竞争性选举。现任董事长兼总督是拉法·马蒂；日常管理由董事会任命的首席执行官领导，下设安全运营、人力资源与居留、财务、设施与后勤、合同与客户关系、法务合规六个部门。居民的住房、医疗和子女入学都由人力资源与居留部按雇佣合同分配，合同一旦终止，居留权随之失去。特许领不设公共法院，一切纠纷交给董事会聘任的三人仲裁庭，刑事案件按与客户国家签订的协议移交审理。特许领没有兵役，作战人员都是年满 18 岁的签约雇员和承包商，现役约四千五百人，合同期满的前雇员编入约三千人的预备名册；他们装备武装直升机、无人机、轻型攻击机、快艇和特种部队，军费相当于生产总值的 22%。\n卡托拉的业务遍布全岛：为萨希利亚和努西拉的油气设施提供保安，为安博维的卡特尔训练护卫，也在南方战争中同时与多方签订合同。国际组织多次指责其雇员在冲突中侵犯人权，但特许领拒绝接受任何外国法院的管辖。集团的收入使特许领的人均收入达到约六万美元，岛上只流通公司代币，员工在公司商店购物、在公司医院看病、孩子在公司学校上学。\n卡托拉不加入任何阵营，只为出价最高的客户服务，被批评者称为「全岛最危险的商店」。它与努西拉在渔场和海域划界上存在争议，与米拉卡因越界训练而关系紧张，却与萨拉卡公国和安博维保持密切的金融和安保合作。每年公司成立纪念日，特许领举行空中表演和阅兵，董事长向「年度最佳承包商」颁发奖章。\n入境特许领须有公司担保，记者常被拒绝入境，岛上的治安由公司的武装承包商维持。约 45% 的居民不信教，新教徒和天主教徒合起来约占四成五。高尔夫是管理层最热衷的运动；员工们每天早会上都要听一遍公司之歌《向前》，国旗其实就是集团的标志：黑底、橙色斜带和白色六边形框中的橙色圆点。"
    en: "The Katora Chartered Territory lies at the western end of the islands off north-west Ranova, a main island and a small one to its north covering some 4,600 km² with about 120,000 people, nearly all of them employees of the Katora Security Group and their families. Katora is the only town, a company town of runways, hangars, ranges, warehouses and staff quarters covering most of the island. \nKatora was once a training and supply base of the United Republic's navy. After the Sundering a group of retired officers bought the base's facilities and founded the Katora Security Group to sell security, training and combat services to every side on the main island. A few years later the group 'bought' jurisdiction over the whole island from the neighbouring island authorities for a large sum and proclaimed a Chartered Territory. It has no citizens, only employees, contractors and dependants; the group's board is the supreme authority, the chairman is also governor, the law is the company's regulations, and those who break them are dismissed and expelled from the island. \nThe Board of Directors has nine seats: six shareholder directors controlled by the Compact of Founding Partners, two independent directors and one staff director put forward by the Katora Contractors' Association, none of them chosen in competitive elections. The present Chairman and Governor is Rafa Maty; day-to-day management is led by a chief executive appointed by the board, with six divisions for security operations, human resources and residence, finance, facilities and logistics, contracts and client relations, and legal and compliance. Housing, medical care and children's schooling are all allocated by the Human Resources and Residence Division according to each employment contract, and when a contract ends the right to stay ends with it. There are no public courts: every dispute goes to a three-member arbitration tribunal engaged by the board, and criminal cases are handed over for trial under agreements with client states. There is no military service; the fighters are all contracted employees and contractors aged 18 or over, about 4,500 on active duty, and former employees whose contracts have ended are kept on a reserve list of about 3,000. They are equipped with attack helicopters, drones, light strike aircraft, fast boats and special forces, and military spending equals 22% of output.\nKatora's business spans the island: it guards the oil and gas installations of Sahiliya and Nusira, trains bodyguards for the Ambovy cartels, and in the Southern War has held contracts with several sides at once. International bodies have repeatedly accused its staff of human rights abuses in the fighting, but the territory refuses the jurisdiction of any foreign court. The group's earnings give the territory an income of about 60,000 dollars a head; only company scrip circulates, and staff shop in the company store, see the company doctor and send their children to the company school. \nKatora joins no bloc and serves the highest bidder, and its critics call it 'the most dangerous shop on the island'. It disputes the boundary of fishing grounds and waters with Nusira and has tense relations with Miraka over training across the boundary, but works closely with the Principality of Saraka and Ambovy on finance and security. Every year on the company's founding day the territory holds an air show and a parade, and the chairman presents a medal to the 'contractor of the year'.\nEntry requires a company sponsor, journalists are often refused, and order on the island is kept by the company's armed contractors. About 45% of residents profess no religion, and Protestants and Catholics together make up about 45%. Golf is management's favourite sport; every morning briefing begins with the company song, Forward, and the national flag is in fact the group's logo: black, with an orange diagonal band and an orange dot in a white hexagon."
