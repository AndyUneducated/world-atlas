  names: {zh: 安博哈拉, en: Ambohara, art-x-ranova: Ambohara}
  notes:
    zh: "安博哈拉是安博哈拉基督教联邦的首都，坐落在安德里纳高原中部八百多米的台地上，全市面积约 4.5 万平方公里，人口约 290 万，是全岛最大的城市，也是拉诺瓦联合共和国的旧都。十二座山丘环绕旧城，大教堂、联邦议会和总统府分踞三座山顶。高原气候凉爽，年均气温 19.6 摄氏度，年降水约 2400 毫米，雨季在五月到十月，二月最干。旧城的红砖房依坡而建，蓝花楹开花时，整片山坡染成淡紫色。\n联邦总统府在旧城北面的总统山顶，是一座四角有方塔的回字形红砖楼，中庭种满白色兰花；立国时的制宪会议就在这里召开，宪法原件至今陈列在序言厅。东面议会山上的联邦议会大厦有十根石柱，代表十个联邦市，151 名议员在铜绿色圆顶下开会，墙上的木十字架是宪法规定的。南面山顶的圣三一大教堂是一座红砖哥特复兴式建筑，双塔高五十多米，可容纳三千人；山脚下是教会联合会大楼。总统山与议会山之间的谷地里是联邦最高法院。\n全国近四成的政府雇员、半数大学生住在这里，经济以行政、商贸和高等教育为主，第三产业占 90%，人均生产总值约 9050 美元。安博哈拉大学有一万多名学生，医学院培养了全国大部分医生；城里还有国家博物馆、国家图书馆、国家剧院、能坐三万多人的体育场，以及中央银行，它的金库里存着大分裂时从联合共和国分得的那份黄金。郊外的高原兵营驻有联邦陆军总部，第一步兵旅、第一装甲旅、国民警卫队、空运基地和防空导弹阵地分驻城郊，城外山体里还凿有战时的地下指挥所。\n市议会 41 席，家园党得票 40.5%，获 17 席，与获 4 席的高原农民党联合执政，议长里亚娜·拉扎纳科托出自家园党；但直选的市长苏清和来自基督教人民党，以 51.4% 对 48.6% 险胜家园党的对手。联邦自由党获 7 席，首都本就是它的票仓。\n瓦塔铁路从城中穿过，一头下到西北湾的瓦凡博，一头经拉诺梅纳通往东海岸的塔马塔，途中有约 23 公里长的安博哈拉隧道。联邦干线在市境内约 317 公里，横贯公路约 290 公里，拉诺梅纳公路从这里向东南出发。西郊台地上的安博哈拉国际机场是全岛最大的机场，跑道长 3600 米，航站楼里立着一座白色十字架。\n居民 51% 以拉诺瓦语为母语，讲英语、卡西里语和汉语的分别占 22%、17% 和 10%。星期日全城停业，教堂钟声从清晨响到中午，全城的家庭穿着白衣去做礼拜，午后三代同堂吃家宴；瓦塔铁路那天只开一对客车，机场的商店也全部关门。立国日，总统在总统府台阶上检阅国民警卫队仪仗，再步行下山去大教堂参加感恩礼拜。市花是彗星兰，市树是蓝花楹。"
    en: "Ambohara is the capital of the Christian Federation of Ambohara, on a terrace some 800 m up in the middle of the Andrina Highlands. The city covers about 45,000 km² and has some 2.9 million people, the largest city on the island and the old capital of the United Republic of Ranova. Its old town is ringed by twelve hills, with the cathedral, the Federal Assembly and the presidential palace on three of the summits. The highland climate is cool, with a mean temperature of 19.6 °C and about 2,400 mm of rain a year; the rains fall from May to October and February is the driest month. Red-brick houses climb the slopes of the old town, and when the jacarandas flower whole hillsides turn pale purple.\nThe Federal Presidential Palace stands on Presidential Hill north of the old town, a red-brick quadrangle with square towers at its corners and a courtyard full of white orchids; the constitutional convention met here when the Federation was founded, and the original constitution is still displayed in the Preamble Room. On Assembly Hill to the east, the Federal Assembly Building has ten stone columns for the ten federal cities, and its 151 members sit beneath a verdigris dome, with a wooden cross on the wall as the constitution requires. Holy Trinity Cathedral on the southern summit is a red-brick Gothic Revival church with twin towers more than fifty metres high, holding three thousand worshippers, and at the foot of its hill is the Council of Churches House. In the valley between Presidential Hill and Assembly Hill is the Federal Supreme Court.\nNearly four in ten government employees and half the country's students live here, and the economy rests on government, commerce and higher education: services make up 90% of it, and output per head is about $9,050. The University of Ambohara has more than ten thousand students, and its medical school has trained most of the country's doctors; the city also has the National Museum, the National Library, the National Theatre, a stadium for more than thirty thousand, and the Central Bank, whose vault holds the share of gold the country received from the United Republic at the Sundering. The Federal Army has its headquarters in the highland barracks outside town, the 1st Infantry Brigade, the 1st Armoured Brigade, the National Guard, an air transport base and an air-defence missile site are stationed round the outskirts, and a wartime underground command post is cut into a mountain beyond it.\nThe city council has 41 seats. The Homeland Party took 40.5% and 17 seats and governs with the Highland Farmers' Party, which has 4, and the Speaker, Riana Razanakoto, is from the Homeland Party; but the directly elected mayor, Su Qinghe, is from the Christian People's Party, who narrowly beat the Homeland candidate by 51.4% to 48.6%. The Federal Liberal Party won 7 seats; the capital is its heartland.\nThe Vavambo–Tamata Railway runs through the city, down to Vavambo on the north-western bay one way and through Ranomena to Tamata on the east coast the other, with the Ambohara Tunnel, some 23 km long, on the way. The Federal Trunk Road runs about 317 km within the city's bounds and the Cross-Island Road about 290 km, and the Ranomena Road sets out from here to the south-east. Ambohara International Airport, on the terrace to the west, is the largest airport on the island, with a 3,600 m runway and a white cross standing in its terminal.\nFifty-one per cent of the people speak Ranovan as their mother tongue, and speakers of English, Kasiri and Chinese make up 22%, 17% and 10%. On Sundays the whole city closes, the church bells ring from dawn to noon, families dressed in white go to worship, and three generations sit down to lunch together in the afternoon; the railway runs only one pair of passenger trains that day and the shops at the airport all close. On Foundation Day the President reviews the National Guard's honour guard on the palace steps and then walks down the hill to the cathedral for a service of thanksgiving. The city flower is the comet orchid and the city tree the jacaranda."
