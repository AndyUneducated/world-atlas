  short_names: {zh: 安博哈拉, en: Ambohara}
  notes:
    zh: "安博哈拉基督教联邦是拉诺瓦岛面积最大、人口最多的国家，国土约三十万平方公里，人口约七百五十万，由十个联邦市组成。国土像一条斜带，从西北的安博河口一路穿过中部的安德里纳高原，直抵东南海岸，两端各有一座外海岛屿，因此联邦既面向西北湾，也面向东南群岛之间的航道。首都安博哈拉坐落在高原中部八百多米的台地上，气候凉爽，是全岛的宗教和教育中心。\n联邦的前身是拉诺瓦联合共和国的高原各省。大分裂后，高原上的新教和天主教会联合地方士绅召开制宪会议，宣布成立基督教联邦，宪法序言写明国家「建立在上帝的律法与家庭之上」。总统由全民直选，任期五年；联邦议会采用混合选举制，福音派的家园党与天主教民主派轮流执政，教会联合会在教育、婚姻和社会福利上拥有很大影响力。堕胎和同性婚姻被禁止，星期日全国停业，公立学校每天以祈祷开始。\n现任联邦总统塔希里·拉沃哈西出自家园党，在上一次总统选举中以 53.6% 对 46.4% 击败基督教人民党的米亚利·拉科托，后者如今是反对党领袖。联邦议会共 151 席，用混合选举制选出，门槛 5%，上一届投票率 68%：家园党得 69 席，与高原农民党的 23 席合起来过半，基督教人民党得 39 席，联邦自由党 20 席；内阁 7 个部全部由家园党掌管。安博哈拉联邦武装部队是全岛规模最大的军队，现役约八万五千人、预备役约十二万人，拥有主战坦克与装甲旅、两支舰队、喷气战斗机中队和防空导弹网；18 至 25 岁的男性要服 18 个月义务兵役，出于宗教良心拒服兵役者可以在教会医院和学校服 24 个月替代役。新教徒约占 58%，天主教徒约 31%；联邦背后的支持者是美国。\n联邦立国后随即与北方的阿瓦拉齐社会主义共和国爆发高原战争，前线在高原北缘拉锯多年，双方伤亡惨重，最终在停火线上对峙至今。南部边境则长期面对齐马罗沃的威胁和伊索卡游击队的袭扰，军费常年占国内生产总值近百分之五。沿海战争后，联邦谴责马索沃利吞并法尼里沿海，允许援助物资经拉诺梅纳的山路运往失去海岸的伊瓦洛，但不许公社民兵在境内活动。联邦是圣约同盟的盟主，与萨希利亚、努西拉、米拉卡等国结盟，并从海外获得大量武器和援助。\n经济以高原农业为主，稻米、咖啡、瘤牛和林木是传统产业，石墨、蓝宝石和地热则是新的出口来源，瓦凡博是全国唯一的深水港和工业城市；联邦唯一的干线瓦塔铁路自瓦凡博经首都安博哈拉下到东海岸的塔马塔，把两端的港口连在一起，全长约八百五十公里。战争和高额军费拖累了发展，人均收入只有约九千美元，但比北方的对手富裕。联邦人把信仰、家庭和土地看得很重，大家庭常常三代同堂，星期日的礼拜和午后的家宴是一周中最重要的时刻。\n联邦日又叫十二山丘节，这一天家家炖一锅罗马扎瓦，青菜炖牛肉配一大盘米饭；橄榄球是最受欢迎的运动，高原城镇的周末球赛常常从教堂礼拜后一直踢到天黑。"
    en: "The Christian Federation of Ambohara is the largest and most populous country on Ranova, some 300,000 km² with about 7.5 million people in ten federal cities. Its territory runs like a diagonal band from the mouth of the Ambo in the north-west, across the Andrina Highlands in the middle of the island, to the south-east coast, with an island offshore at each end, so the federation faces both the north-western bay and the sea lanes among the south-eastern isles. The capital, Ambohara, stands on a terrace some 800 m up in the middle of the highlands, cool and the religious and educational centre of the island. \nThe federation began as the highland provinces of the United Republic of Ranova. After the Sundering, the Protestant and Catholic churches of the highlands joined the local gentry in a constituent assembly that proclaimed a Christian federation, whose constitution declares that the state 'rests on the law of God and on the family'. The president is elected by direct vote for five years; the Federal Assembly is chosen by a mixed system, and the evangelical Homeland Party and the Catholic Christian Democrats take turns in government, while the Council of Churches carries great weight in schooling, marriage and welfare. Abortion and same-sex marriage are banned, the country closes on Sundays and state schools begin each day with prayer. \nThe present Federal President, Tahiry Ravohasy of the Homeland Party, beat Mialy Rakoto of the Christian People's Party by 53.6% to 46.4% at the last presidential election, and she is now Leader of the Opposition. The Federal Assembly has 151 seats elected by a mixed system with a 5% threshold, and turnout last time was 68%: the Homeland Party won 69 seats, a majority together with the Highland Farmers' Party's 23, the Christian People's Party 39 and the Federal Liberal Party 20; all seven cabinet ministries are held by the Homeland Party. The Ambohara Federal Armed Forces are the largest on the island, with about 85,000 active personnel and some 120,000 reservists, main battle tanks and armoured brigades, two fleets, jet fighter squadrons and an air-defence missile network; men aged 18 to 25 serve 18 months of national service, and conscientious objectors on religious grounds may do 24 months of alternative service in church hospitals and schools. Protestants make up about 58% of the people and Catholics about 31%; the federation's backer is the United States.\nAlmost at once the federation went to war with the Socialist Republic of Avaratsy in the north. The Highland War swung back and forth across the northern edge of the plateau for years at terrible cost, and the two armies still face each other across the ceasefire line. In the south it has long faced the threat of Tsimarovo and raids by the Isoka guerrillas, and defence takes close to 5% of output year after year. Since the Coastal War the federation has condemned Masovoly's annexation of the Faniry coast and lets aid through Ranomena over the mountain roads to Ivalo, now cut off from the sea, though it allows the communes' militia no activity on its soil. The federation leads the Covenant League, allied with Sahiliya, Nusira, Miraka and others, and receives large amounts of arms and aid from abroad. \nThe economy rests on highland farming: rice, coffee, zebu and timber are the old trades, graphite, sapphires and geothermal power the new exports, and Vavambo is the only deep-water port and industrial city; the Vavambo–Tamata Railway, the only main line in the federation, runs about 850 km from Vavambo through the capital down to the port of Tamata on the east coast, tying the two ports together. War and the defence bill have held development back, and income is only about 9,000 dollars a head, though richer than its northern rival. Federation people set great store by faith, family and land; three generations often share a house, and Sunday worship followed by the family meal is the high point of the week.\nFederation Day is also called the Feast of the Twelve Hills, and on it every household stews a pot of romazava, beef and greens served with a great plate of rice; rugby union is the most popular sport, and weekend matches in the highland towns often run from the end of the church service until dark."
