# ── 努西拉苏丹国 ──
- id: div_38z2mg
  subtype: locality
  parent: div_p735rv
  role: nation
  status: generated
  names: {zh: 努西拉苏丹国, en: Sultanate of Nusira, art-x-kasiri: Usultani wa Nusira}
  short_names: {zh: 努西拉, en: Nusira}
  notes: {zh: '努西拉苏丹国位于拉诺瓦岛西北外海，由三座主要岛屿组成，面积约一万六千平方公里，人口约九十万，其中约三分之一是外籍劳工。首都努西拉在最大的中岛上，西岛的马卡拉是渔港和油气补给基地，东岛的达兰是海滨度假城镇。群岛四周是珊瑚礁和浅海，近海的油气田是苏丹国财富的来源。

      苏丹国的王室出自很久以前就在群岛上经商的卡西里世家，联合共和国时期，苏丹只保留宗教和礼仪地位。大分裂时，苏丹趁本岛战乱宣布恢复主权，六个世家宣誓效忠，苏丹国由此独立。苏丹集立法、行政和司法大权于一身，任命首相和各部大臣，协商会议由王室成员、世家与部族代表、商界和宗教学者组成，只有咨询权。国内禁止政党活动，公开批评王室会被判处监禁。

      近海油气田被发现后，苏丹国迅速致富，人均收入约三万八千美元，公民享有免费医疗、教育和住房补贴，不缴所得税。繁重的劳动则由来自本岛和海外的外籍劳工承担，他们住在城郊的劳工城，没有公民权，人权组织多次批评他们的工作条件。政府近年推出「后石油愿景」，发展金融、航运和旅游，达兰的海滨酒店吸引着阵营盟国的游客。

      努西拉是圣约同盟的成员，与萨希利亚同属卡西里语和伊斯兰世界，为萨希利亚的西岸战争提供资金和军事援助，也因此多次成为贾巴利亚武装的袭击目标。苏丹国与卡托拉特许领隔海相望，两国在渔场和油气区划界上存在争议。斋月结束时的开斋节，苏丹在王宫前向民众分发礼物，海湾上的传统帆船赛是全年最热闹的盛事。', en: "The Sultanate of Nusira lies off the north-west of Ranova, three main islands covering some 16,000 km² with about 900,000 people, about a third of them foreign workers. The capital, Nusira, is on the largest, central island; Makara on the western island is a fishing port and offshore supply base, and Daran on the eastern island is a seaside resort. Coral reefs and shallow seas surround the islands, and the offshore oil and gas fields are the source of the sultanate's wealth. \nThe royal house descends from Kasiri merchant families who traded in the islands long ago, and under the United Republic the Sultan kept only a religious and ceremonial role. In the Sundering the Sultan used the turmoil on the main island to proclaim the restoration of sovereignty, the six great houses swore allegiance, and the sultanate became independent. The Sultan holds legislative, executive and judicial power and appoints the prime minister and ministers; the Consultative Council of royals, representatives of the great houses and tribes, business and religious scholars only advises. Parties are banned, and public criticism of the royal family is punished with prison. \nOnce the offshore fields were found the sultanate grew rich fast; income is about 38,000 dollars a head, and citizens enjoy free health care and schooling, housing subsidies and no income tax. The heavy work is done by foreign workers from the main island and overseas, who live in labour towns on the outskirts without citizenship, and human rights groups have often criticised their conditions. The government's recent 'after oil' plan promotes finance, shipping and tourism, and Daran's seaside hotels draw visitors from the League's partner countries. \nNusira belongs to the Covenant League and shares the Kasiri language and Islam with Sahiliya; it funds and arms Sahiliya in the West Coast War and has been a target of attacks by the Jabaliya militants several times as a result. It faces the Katora Chartered Territory across the water, and the two dispute the boundary between their fishing grounds and oil and gas blocks. At the Eid that ends Ramadan the Sultan hands out gifts to the people outside the palace, and the traditional dhow race on the bay is the liveliest event of the year."}
