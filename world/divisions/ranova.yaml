  names: {zh: 曼加, en: Manga, art-x-ranova: Manga}
  notes:
    zh: "曼加是阿拉齐纳原住民邦联东海岸的城镇，名字意为「蓝色」，指海湾的颜色。全市人口约 30 万，辖区约 1.5 万平方公里，从海湾边的渔村一直延伸到内陆雨林覆盖的山地，平均海拔 1180 米，最高处 2010 米。这里是邦联最湿润的地方，气候属热带季风型，年均气温 24.2 ℃，年降水约 2881 毫米，与草原上干燥的议事中心阿拉齐纳截然不同。雨林边缘的香草和胡椒园由氏族合作社经营。\n九个原住民氏族在岛上生活的历史比任何国家都久远。大分裂后，他们在阿拉齐纳的篝火旁订立盟约，成立邦联，以协商一致的方式决定公共事务。北方的齐马罗沃随即发动南方战争，以「收复祖先土地」为名攻入邦联的牧区，邦联失去了约三分之一的土地，数十万牧民被迫离开家园。曼加地处东部海岸，未被战火波及，但也收留了不少从草原上南逃的亲族，城镇里至今住着几代失去牧场的家庭。\n曼加香草种植园是邦联最大的香草园，香草藤缠绕在成排的支撑树上，每朵花都要在开放当天上午由工人用竹签人工授粉；豆荚经过烫煮、日晒和数月的发酵才能出售，上等香草荚比白银还贵，种植园雇有数百名季节工人，收获季节由武装保安看守，以防偷盗。胡椒藤爬满雨林边的树干，采下的青胡椒在村口的竹席上晒成黑色。曼加鱼市在港口旁，每天凌晨渔船靠岸后开市，金枪鱼、石斑鱼、龙虾和章鱼一个小时内就能卖完，旁边的小饭馆从早上六点供应鱼汤和烤鱼。渔业、香料和可可是两大行业，种植业和渔业占经济的 33%，人均产值约 1910 美元，邦联是全岛最贫困的国家之一，但贫富差距很小。\n曼加与外界的联系主要是长约 146 公里的阿拉齐纳—曼加公路，从草原上的议事中心翻山而来；香料和鱼干沿这条路运往阿拉齐纳，援助组织的车队也走这条路。城镇不举行政党选举，由当地各氏族推举的长老组成氏族长老会共同管理，召集人由长老们轮流担任，现任召集人是西特拉卡·拉韦洛；邦联的轮值大长老是法拉·曼加西。\n居民 93% 以拉诺瓦语为母语，人口很年轻，37% 是孩子，人均预期寿命 60.5 岁，识字率 50.9%。牛是财富、聘礼和祭祀的中心，海边的人家也要养几头瘤牛；每年雨季开始时，曼加的牧人赶着牛群翻山去阿拉齐纳，参加九个氏族的祭祖仪式和赛牛会。祖灵节那天，家家在院子里炭烤山药，年轻人在海滩上比瘤牛摔跤。渔民说，海湾的蓝是祖先的眼睛，出海前要先向它点头。市花是赫蕉，市树是旅人蕉；市旗是蓝、赭黄、蓝三条横带，中间一枝绿色胡椒，代表氏族合作社经营的香料园。"
    en: "Manga is a town on the east coast of the Alatsina Indigenous Confederacy; its name means \"blue\", for the colour of the bay. It has about 300,000 people and some 15,000 km² of territory, reaching from fishing villages on the bay into rainforest-covered mountains inland, with a mean elevation of 1,180 m and a high point of 2,010 m. It is the wettest part of the confederacy, with a tropical monsoon climate, a mean temperature of 24.2 °C and about 2,881 mm of rain a year, quite unlike the dry grasslands around the council seat of Alatsina. Vanilla and pepper gardens on the edge of the rainforest are run by clan co-operatives.\nThe nine indigenous clans have lived on the island longer than any state. After the Sundering they made a covenant round the fire at Alatsina and founded the confederacy, settling public matters by consensus. Tsimarovo to the north at once launched the Southern War, invading the confederacy's grazing lands in the name of \"recovering the ancestral land\"; the confederacy lost about a third of its territory and hundreds of thousands of herders were driven from their homes. Manga, on the east coast, was spared the fighting but took in many kin fleeing south from the grasslands, and families who lost their pastures generations ago still live in the town.\nThe Manga Vanilla Plantation is the largest in the confederacy: vanilla vines climb rows of support trees, and every flower must be pollinated by hand with a bamboo sliver on the morning it opens; the pods are scalded, sun-dried and cured for months before sale, the best fetch more than silver, and the plantation employs several hundred seasonal workers, with armed guards at harvest to stop theft. Pepper vines climb the tree trunks at the rainforest edge, and the green peppercorns are dried black on bamboo mats at the village entrances. The Manga Fish Market by the harbour opens every dawn when the boats come in, its tuna, grouper, lobster and octopus sold within the hour, and the eating houses beside it serve fish soup and grilled fish from six in the morning. Fishing and spices and cocoa are the two main trades, farming and fishing make up 33% of the economy, and output per head is about US$1,910; the confederacy is one of the poorest states on the island, but the gap between rich and poor is small.\nManga's main link to the outside is the Alatsina–Manga Road, about 146 km long, which crosses the mountains from the council seat on the grasslands; spices and dried fish travel along it to Alatsina, and so do aid convoys. There are no party elections: the town is run jointly by a Council of Clan Elders chosen by the local clans, the elders taking turns as convener, currently Sitraka Ravelo; the confederacy's Rotating Great Elder is Fara Mangasy.\nRanova is the mother tongue of 93% of residents; the population is very young, 37% of it children, life expectancy is 60.5 years and literacy 50.9%. Cattle are the heart of wealth, bride price and sacrifice, and even families by the sea keep a few zebu; at the start of each rainy season Manga's herders drive their cattle over the mountains to Alatsina for the nine clans' ancestral rites and cattle races. On the Festival of the Ancestors every household roasts yams over charcoal in the yard, and young men wrestle zebu on the beach. The fishers say the blue of the bay is the eyes of the ancestors, and nod to it before putting to sea. The city flower is the heliconia and the city tree the traveller's palm; the city flag has blue, ochre and blue horizontal bands with a green sprig of pepper in the middle, for the spice gardens run by the clan co-operatives."
