  names: {zh: 安塔诺, en: Antano, art-x-ranova: Antano}
  notes:
    zh: "安塔诺是齐马罗沃民族社会主义帝国西部的农牧城市，全国五座城市之一。全市面积约 2 万平方公里，人口约 38 万。城区坐落在海拔约 430 米的干燥高原上，西面的山地最高 2025 米。这里是半干旱气候，年均气温 23.4 摄氏度，年降水约 700 毫米，一月到三月每月只有 2 毫米雨，旱季的稀树草原一片焦黄，只有猴面包树还立在原地。国营农场与「定居者村」在草原上相间分布。\n南方战争中这里是前线。齐马罗沃的民族社会主义运动宣称高原「最早的定居者」才是拉诺瓦的主人，把原住民氏族视为「外人」；国家建立后随即向西南扩张，攻入阿拉齐纳原住民氏族的牧区。安塔诺一带许多原住民村庄被迁走，空出的土地分给了国家认可的定居者。国际调查机构多次记录了强迫迁徙、集体惩罚和拘押营，南方战争断断续续三十多年，至今没有结束。\n城外的安塔诺定居者农场就是在被迁走的村庄土地上建立的国营农场，土地分给「定居者」家庭，种植玉米、木薯，饲养瘤牛；农场入口立着一块纪念「民族土地回归」的石碑。被迁走的原住民家庭大多流落到阿拉齐纳的难民营，国际法院正在审理相关的诉讼。城旗是黑、红、黑三条横带，红色宽带中一束白色麦穗，代表国营农场和定居者村；被迁走的原住民把这面旗看作夺地的标志。\n经济以种植业和瘤牛放牧为主，第一产业占 35%，人均生产总值约 3440 美元，低于全国平均。瘤牛市场是全国最大的牲口集市，每周一开市，几千头瘤牛从周边草原赶来，买卖双方围着牛群讨价还价，成交时互相拍手为定；瘤牛在当地是财富和聘礼的象征，一头健壮的公牛抵得上一个农民半年的收入。西南公路在市境内长约 152 公里，东北通首都齐马罗沃，西南经贝拉纳的盐湖通往卡波拉；卡波拉边境冲突期间，这条路是齐马罗沃军队进攻卡波拉的通道，路边至今留着当年的战壕。\n城市由领袖府任命的市行政长官马米·拉索阿马纳纳管理，他兼任当地民族卫队的政治负责人。城郊驻有国防军第三步兵旅，城外大片稀树草原和丘陵划为全国最大的陆军训练场，演习期间周围道路实行管制，牧民要把牛群赶到别处。和全国一样，居民按「血统证书」分等，只有一等公民可以拥有土地，定居者村的土地也只分给他们。\n居民 93% 以拉诺瓦语为母语，识字率约 70%，平均预期寿命约 62 岁。学校教授「血统史」，青年必须加入运动的青年团。定居者村的人家在新盖的砖房前种下黄花夹竹桃，而在草原深处，被迁走的村庄只剩下几棵老猴面包树和一圈倒塌的牛栏，流亡的老人们还记得每一棵树下埋着谁家的祖先。市花是黄花夹竹桃，市树是猴面包树。"
    en: "Antano is the farming and herding city of the west of the National Socialist Empire of Tsimarovo, one of the country's five cities. The city covers about 20,000 km² and has some 380,000 people. The town lies on the dry plateau at about 430 m, with mountains to the west rising to 2,025 m. The climate is semi-arid, with a mean temperature of 23.4 °C and about 700 mm of rain a year, only 2 mm a month from January to March; in the dry season the savanna is scorched yellow and only the baobabs stand unchanged. State farms alternate with \"settler villages\" across the grassland.\nIt was on the front line in the Southern War. Tsimarovo's National Socialist Movement holds that the \"first settlers\" of the plateau are the masters of Ranova and treats the indigenous clans as \"outsiders\"; once the state was founded it pushed south-west into the grazing lands of the indigenous clans of Alatsina. Around Antano many indigenous villages were removed and the land given to settlers approved by the state. International investigators have repeatedly documented forced removals, collective punishment and detention camps, and the Southern War has gone on, on and off, for more than thirty years without end.\nThe Antano Settler Farm outside town is a state farm set up on the land of removed villages, given to \"settler\" families who grow maize and cassava and raise zebu; at its entrance stands a stone celebrating \"the return of the nation's land\". Most of the removed families ended up in the refugee camps of Alatsina, and an international court is hearing a case over it. The city flag has three horizontal bands, black, red and black, with a white sheaf of wheat on the broad red band for the state farms and settler villages; the indigenous people who were driven out see the flag as a badge of land seizure.\nThe economy rests on farming and zebu herding; the primary sector makes up 35%, and output per head is about $3,440, below the national average. The zebu market is the country's largest livestock market: every Monday thousands of cattle are driven in from the surrounding savanna, buyers and sellers haggle round the herds and clap hands to seal a deal, and zebu here are a sign of wealth and the stuff of bride-price, a strong bull being worth half a year of a farmer's income. The South-West Road runs about 152 km within the city's bounds, north-east to the capital, Tsimarovo, and south-west past the salt lakes of Belana to Kabola. During the Kabola border clashes this road was the Tsimarovo army's route of attack, and the old trenches are still there beside it.\nThe city is run by the City Commissioner, Mamy Rasoamanana, appointed by the Leader's Chancellery, who is also political chief of the local National Guard. The Defence Army's 3rd Infantry Brigade is stationed on the outskirts, and great stretches of savanna and hills outside town make up the country's largest army training area; during exercises the roads around are closed and herders must drive their cattle elsewhere. As across the country, residents are ranked by \"blood certificate\": only first-class citizens may own land, and the land of the settler villages goes only to them.\nNinety-three per cent of the people speak Ranovan as their mother tongue; literacy is about 70% and life expectancy about 62 years. Schools teach \"blood history\", and the young must join the movement's youth league. Settler families plant yellow oleander in front of their new brick houses, while out on the savanna nothing is left of the removed villages but a few old baobabs and a ring of fallen cattle pens, and the elders in exile still remember whose ancestors lie buried beneath each tree. The city flower is the yellow oleander and the city tree the baobab."
