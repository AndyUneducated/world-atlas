  flag_notes: {zh: 石青色旗面，旗杆一侧是一道镶朱红边线的杏黄色竖条，条上七颗石青色的星排成北斗，第五颗「玉衡」最大；旗面中央是一杆金色的衡器，横梁两端各悬一只秤盘。石青是天的颜色，杏黄是成熟的稻谷和天子的袍服，朱红边线是宫墙和天子的朱批；北斗的玉衡星和衡器都是国号的来历，意为天子「持平如衡」、公正地权衡天下。, en: 'Azure, with an apricot band at the hoist edged in vermilion, bearing seven azure stars in the shape of the Northern Dipper, the fifth, Yuheng, the largest; in the middle a gold balance with a pan hanging from each end of its beam. Azure is the colour of Heaven, apricot that of ripe rice and the Emperor''s robes, and the vermilion edge the palace walls and the Emperor''s red ink; the Dipper''s star Yuheng and the balance both give the dynasty its name, heng, and stand for an Emperor who weighs all under Heaven "even as the balance".'}
