  names: {zh: 卡西里, en: Kasiri, art-x-kasiri: Kasiri}
  notes:
    zh: "卡西里是萨希利亚伊斯兰共和国东部内陆的城市，离海岸两百多公里，坐落在干燥的丘陵和稀树草原之间，市域约 2.2 万平方公里，最高处海拔 517 米，人口约 38 万。这里属热带草原气候，年均气温 24.8 ℃，年降水不到 1000 毫米，一到三月几乎无雨，四月白天常超过 34 ℃，极端最高气温 38.6 ℃。卡西里语就因这一带的古老部族得名，如今城里八成半的居民以它为母语，另有一成说拉诺瓦语。市花是九里香，市树是罗望子。\n城里的卡西里经学院是全国培养伊玛目和宗教学者的学府，也是温和派宗教学者的中心。课程包括古兰经、圣训、教法和阿拉伯语，也开设数学、历史和外语，教师以温和的教法解释著称，毕业生在全岛的清真寺任职。学院每年举办一次古兰经诵读比赛，吸引各国的青年参加。市旗绿底上一枚白色圆印，印环上用卡西里语和英语写着城名，印心是一本深绿色的书，指的就是这座经学院。\n经济以种植业和瘤牛放牧为主，第一产业约占 40%，人均产值约 4770 美元。卡西里瘤牛市场是全国最大的牲口集市，每周一开市，几千头瘤牛从周边的草原赶来，买卖双方围着牛群讨价还价，成交时互相拍手为定。瘤牛在当地是财富和聘礼的象征，一头健壮的公牛可以抵上一个农民半年的收入。城外的卡西里野战训练场是全国最大的陆军训练场，坦克和装甲车在稀树草原和丘陵上机动和实弹射击，演习期间附近的牧民要把牛群赶到别处。\n萨卡铁路的终点卡西里站就在城里。铁路从首都萨希勒沿海岸南下到班达里，再折向东北，穿过丁香和腰果园覆盖的丘陵，以约 59 公里长的贝马希石林台地隧道穿过台地来到卡西里，全长约 340 公里，信风 160 型列车两个多小时跑完全程。来经学院求学的学生和学者多乘它从首都来，货车则把内地的丁香和腰果运到港口，把海盐和进口货运进内地。卡西里公路从安博哈拉的地热城安卡瓦向西下到这里，再通往班达里港；这一带是讲拉诺瓦语的高原和讲卡西里语的海岸之间的过渡地带，沿线村庄里教堂和清真寺常常相隔不远，瘤牛集市上两种语言混着用，两国的牧民都来赶集。\n市议会 29 席，最近一次投票率 62.0%。伊斯兰公正党得票 47.0%、14 席，与 6 席的海岸民族党联合执政；人民劳动党拿下 9 席，是这里的第二大党。市长巴卡里·法拉吉和议长赛达·姆维尼都属公正党。\n居民平均预期寿命 63.9 岁，识字率约 73%。星期一天不亮，赶牛的牧人就从四面的草原进城，集市边的茶摊煮着加姜的甜茶，罗望子树下拴满了牛。经学院的学生放假回家时挤满车厢，车厢门口都标出礼拜的朝向。"
    en: "Kasiri is a city of the eastern interior of the Islamic Republic of Sahiliya, more than two hundred kilometres from the coast, set among dry hills and savanna. Its territory of some 22,000 km² rises to 517 m, and it has about 380,000 people. The climate is tropical savanna, with a mean temperature of 24.8 °C and less than 1,000 mm of rain a year; from January to March there is almost no rain, April days often pass 34 °C, and the record high is 38.6 °C. The Kasiri language takes its name from the old peoples of this area; today eighty-five per cent of the city's residents speak it as their mother tongue and another ten per cent speak Ranovan. The city flower is the orange jasmine and the city tree the tamarind.\nThe city's Kasiri Madrasa trains the country's imams and religious scholars and is the centre of the moderate scholars. Its courses cover the Qur'an, hadith, jurisprudence and Arabic, along with mathematics, history and foreign languages; its teachers are known for their moderate interpretation of religious law, and its graduates serve in mosques across the island. Every year it holds a Qur'an recitation contest that draws young people from many countries. The city flag shows a white seal on green, with the city's name in Kasiri and English around the ring and a dark green book at its centre: the book is the madrasa.\nThe economy rests on farming and zebu herding; the primary sector accounts for about 40%, and output per head is about US$4,770. The Kasiri Zebu Market is the largest livestock market in the country. It opens every Monday, when thousands of zebu are driven in from the surrounding grasslands; buyers and sellers bargain around the herds and clap hands to seal a deal. Zebu are a sign of wealth and a bride price here, and a strong bull is worth half a year of a farmer's income. Outside town, the Kasiri Field Training Area is the country's largest army training ground, where tanks and armoured vehicles manoeuvre and fire live rounds across savanna and hills; during exercises the herders nearby must drive their cattle elsewhere.\nKasiri Station, the terminus of the Sahil–Kasiri Railway, is in the city. The line runs south from the capital, Sahil, along the coast to Bandari, then turns north-east through hills covered in clove and cashew plantations and passes under the Bemahy Stone Forest Plateau in a tunnel about 59 km long to reach Kasiri; it is about 340 km long, and Tradewind 160 trains cover it in a little over two hours. Students and scholars bound for the madrasa mostly come up from the capital on it, while freight trains carry cloves and cashews from the interior to the port and sea salt and imports inland. The Kasiri Road comes west and down from Ankava, the geothermal city of Ambohara, and continues to the port of Bandari. This is the transitional country between the Ranovan-speaking highlands and the Kasiri-speaking coast: in the villages along the road, churches and mosques often stand close together, both languages are mixed at the zebu market, and herders from both countries come to trade.\nThe City Council has 29 seats; turnout at the last election was 62.0%. The Islamic Justice Party won 47.0% and 14 seats and governs with the 6-seat Coast National Party; the People's Labour Party, with 9 seats, is the second party here. The mayor, Bakari Faraji, and the speaker, Saida Mwinyi, both belong to the Justice Party.\nLife expectancy is 63.9 years and literacy about 73%. Before dawn on Mondays, drovers come into town from the grasslands on every side; tea stalls by the market brew sweet tea with ginger, and cattle are tethered beneath every tamarind tree. When madrasa students go home for the holidays they pack the carriages, each of which has the direction of prayer marked by its door."
