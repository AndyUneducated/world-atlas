    zh: "萨拉卡是萨拉卡公国的首都，也是公国唯一的城市：公国全境就是这座建在拉诺瓦岛西北外海小岛上的城市，面积约 1200 平方公里，人口约 35 万，每平方公里约 290 人，人口密度在全岛各国中排第三。小岛地势低缓，最高处只有 128 米，属热带季风气候，年均气温 22.1 摄氏度，年降水约 3000 毫米。赌场、豪华酒店和私人银行挤满了整座岛，大公宫建在俯瞰港口的岩岬上，港内停满了游艇。\n萨拉卡原是联合共和国的一个特别行政岛，拥有经营赌场的特许权。联合共和国解体前夕，岛上的世袭亲王家族与中央政府签订和平分离的条约，萨拉卡成为最早独立的国家之一，并沿用了联合共和国红色船旗的样式。三十多年的战争中，公国始终保持中立，交战各方的代表常在城里的酒店秘密会面，许多停火协议都在这里谈成，萨拉卡人称自己的岛是「全岛的客厅」。萨拉卡宫殿酒店的大堂当年是外国记者交换消息的地方，酒吧里至今挂着那时的新闻照片。\n城市的财富几乎全部来自赌场的特许费和私人银行，人均生产总值约 9.5 万美元，第三产业占 90%，居民不缴个人所得税。金色圆顶下的萨拉卡大赌场二十四小时营业，海滨赌场酒店是一座四十层的玻璃塔楼，屋顶的无边泳池俯瞰港湾；两百多米高的萨拉卡私人银行中心里有几十家银行、保险公司和律师事务所。各国的军阀、商人和政客把钱存在这里，国际组织多次指责公国替安博维卡特尔和腐败官员洗钱，公国在压力下签了部分信息交换协议。市长尼里娜·拉索阿马纳纳由大公雷米三世任命，市政厅的预算大半来自赌场的特许费。\n奶油色的大公宫有几座小塔楼，大公宪兵每天上午在宫门前换岗；宫下的老城里是粉色的国民议会大厦，议事厅只有一间普通教室大小。宫下的悬崖上是大公异域花园，园中岩洞里发现过史前人类的遗迹。港口西侧是萨拉卡游艇俱乐部，东侧防波堤上的直升机场连接马哈维洛、瓦罗纳和贝洛瓦；岛南端的乡村俱乐部沿悬崖铺开十八洞球道。城里还有歌剧院、海洋博物馆、圣母主教座堂、国际会展中心和大公医院。\n居民中 41% 以拉诺瓦语为母语，33% 讲英语，讲汉语和卡西里语的各占 13%，大多数人是持居留证的外国人，公民只占约五分之一。平均预期寿命约 84 岁，65 岁以上的居民占 17%。每年夏天的萨拉卡大奖赛是一年中最盛大的节日，港口边的街道搭起护栏和看台，港湾里停满游艇，酒店价格翻好几倍。圣母升天节，信众抬着圣像绕城游行，沿途人家在门前摆上鲜花和蜡烛。城旗和国旗并挂在赌场门口，当地人开玩笑说，在萨拉卡分不清哪面是国家、哪面是生意。市花是蝴蝶兰，市树是大王椰。"
    en: "Saraka is the capital of the Principality of Saraka and its only city: the whole principality is this one city, on a small island off Ranova's north-west coast, covering about 1,200 km² with some 350,000 people, about 290 to the square kilometre, the third most densely peopled nation on the island. The island is low, its highest point only 128 m, and the climate is tropical monsoon, with a mean temperature of 22.1 °C and about 3,000 mm of rain a year. Casinos, grand hotels and private banks crowd the whole island; the Prince's palace stands on a rocky headland above the port, and the harbour is full of yachts.\nSaraka was once a special administrative island of the United Republic, holding a franchise to run casinos. On the eve of the United Republic's collapse the island's hereditary princely family signed a treaty of peaceful separation with the central government, making Saraka one of the first nations to become independent, and it kept the pattern of the United Republic's red ensign. Through more than thirty years of war the principality stayed neutral; representatives of the warring sides often met secretly in the city's hotels, and many ceasefires were agreed here, so that Sarakans call their island \"the island's drawing room\". The lobby of the Saraka Palace Hotel was where foreign journalists traded news in those years, and the bar still hangs press photographs from the time.\nThe city's wealth comes almost entirely from casino licence fees and private banking: output per head is about $95,000, services make up 90% of the economy, and residents pay no income tax. The Grand Casino of Saraka, under its golden dome, never closes; the Seafront Casino Hotel is a forty-storey glass tower whose rooftop infinity pool looks over the harbour; and the Saraka Private Banking Centre, more than two hundred metres tall, houses dozens of banks, insurers and law firms. Warlords, merchants and politicians from many countries keep their money here, international bodies have repeatedly accused the principality of laundering money for the Ambovy Cartel and corrupt officials, and under pressure it has signed some information-exchange agreements. The mayor, Nirina Rasoamanana, is appointed by the Sovereign Prince, Remy III, and most of the town hall's budget comes from casino licence fees.\nThe cream-coloured Prince's Palace has several small turrets, and the Prince's Carabiniers change the guard at its gate every morning; in the old town below the palace is the pink National Council Building, whose chamber is no bigger than an ordinary classroom. On the cliffs below the palace lies the Prince's Exotic Garden, where traces of prehistoric people have been found in the caves. On the west side of the port is the Saraka Yacht Club, while the heliport on the eastern breakwater links the city with Mahavelo, Varona and Belova, and at the island's southern tip the Country Club lays out eighteen holes along the cliffs. The city also has the Opera House, the Oceanographic Museum, the Cathedral of Our Lady, the International Exhibition Centre and the Princely Hospital.\nForty-one per cent of residents speak Ranovan as their mother tongue and 33% English, with Chinese and Kasiri speakers at 13% each; most people are foreigners with residence permits, and citizens are only about a fifth. Life expectancy is about 84 years, and 17% of residents are over 65. The Saraka Grand Prix each summer is the greatest festival of the year: barriers and stands go up along the streets by the port, the harbour fills with yachts, and hotel prices multiply several times over. At the Assumption the faithful carry the statue of Our Lady in procession round the town, and households along the way set flowers and candles at their doors. The city flag and the national flag hang side by side at the casino entrance, and locals joke that in Saraka you cannot tell which one is the state and which the business. The city flower is the moth orchid and the city tree the royal palm."
