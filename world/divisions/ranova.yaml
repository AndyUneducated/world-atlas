  notes: {zh: 联邦首都，坐落在安德里纳高原中部八百多米的台地上，十二座山丘环绕旧城，大教堂、联邦议会和总统府分踞三座山顶。全国近四成的政府雇员、半数大学生住在这里，郊外的高原兵营驻有联邦陆军总部。旧城红砖房依坡而建，星期日全城停业，教堂钟声从清晨响到中午。, en: 'The federal capital, on a terrace some 800 m up in the middle of the Andrina Highlands, its old town ringed by twelve hills with the cathedral, the Federal Assembly and the presidential palace on three of the summits. Nearly four in ten government employees and half the country''s students live here, and the Federal Army has its headquarters in the highland barracks outside town. Red-brick houses climb the slopes of the old town; on Sundays the whole city closes and the church bells ring from dawn to noon.'}
