# ── 梅纳瓦利国家拯救共和国 ──
- id: div_dmf47n
  subtype: locality
  parent: div_p735rv
  role: nation
  status: generated
  names: {zh: 梅纳瓦利国家拯救共和国, en: Salvation Republic of Menavaly, art-x-ranova: Repoblikan'ny Famonjena Nasionaly Menavaly}
  short_names: {zh: 梅纳瓦利, en: Menavaly}
  notes: {zh: '梅纳瓦利国家拯救共和国位于拉诺瓦岛西南海岸，国名意为「红色海岸」，得名于首都附近的红土悬崖。国土约五万六千平方公里，人口约一百万，只有首都梅纳瓦利和内陆的阿纳拉两座城市。西部沿海是干燥的稀树草原和红树林，内陆是起伏的草原丘陵，牛群是传统的财富。

      大分裂后，西南各省先成立了文官政府，但地方军阀割据、腐败横行，伊索卡游击队又不断袭扰。立国几年后，陆军将领以「拯救国家」为名发动政变，解散议会，成立国家拯救委员会，宣布全国进入紧急状态，此后紧急状态从未解除。委员会由十二名陆军将领、五名空军将领和四名宪兵司令组成，主席由委员会推举，实际上由陆军中最有实力的将领担任。此后军队内部又发生过两次政变，每次都换了主席，却没有改变军人执政的格局。

      军政府对外以反共为旗号，与齐马罗沃结盟加入祖源轴心，在南方战争中为齐马罗沃提供基地和过境通道，并向卡波拉转运燃料和武器，因此遭到多国制裁。国内实行宵禁、新闻审查和政党禁令，反对派领袖多被软禁或流亡贝洛瓦。

      经济以瘤牛放牧、金矿和渔业为主，军官集团控制着金矿和港口的收入，普通人的生活十分贫困，人均收入约二千五百美元。年轻人口比例很高，许多青年加入军队以求温饱。阿纳拉空军基地是军政府的王牌，每年独立日，攻击机编队从首都上空低空飞过，是全国最隆重的仪式。梅纳瓦利人常说「在这里，草原属于牛，海岸属于渔民，国家属于将军」。', en: "The Salvation Republic of Menavaly lies on Ranova's south-west coast; its name means 'red coast', for the red earth cliffs near the capital. It covers some 56,000 km² with about a million people in two cities, the capital, Menavaly, and Anala inland. The western coast is dry savanna and mangrove, the interior rolling grassy hills, and cattle are the traditional wealth. \nAfter the Sundering the south-western provinces first formed a civilian government, but local strongmen carved up the country, corruption ran wild and the Isoka guerrillas raided again and again. A few years after independence the army's generals staged a coup in the name of 'saving the nation', dissolved parliament, set up the National Salvation Committee and declared a state of emergency that has never been lifted. The committee has twelve army generals, five air force generals and four commanders of the gendarmerie; its chairman is chosen by the committee and is in practice the strongest general in the army. Two more coups within the army since then have changed the chairman each time but not military rule. \nAbroad the junta flies the banner of anti-communism; it joined the Origin Axis as Tsimarovo's ally, gives Tsimarovo bases and transit in the Southern War and passes fuel and arms on to Kabola, for which it is under sanctions from many states. At home there is a curfew, censorship and a ban on parties, and most opposition leaders are under house arrest or in exile in Belova. \nThe economy lives on zebu herding, gold mining and fishing; the officer corps controls the income from the gold mines and the ports, ordinary people are very poor, and income is about 2,500 dollars a head. The population is very young, and many young men join the army to eat. Anala air base is the junta's trump card, and on Independence Day a formation of attack aircraft flies low over the capital in the country's grandest ceremony. Menavaly people say that 'here the grassland belongs to the cattle, the coast to the fishers and the country to the generals'."}
  codes: {admin: '950600'}
