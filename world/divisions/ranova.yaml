# ── 卡托拉特许领 ──
- id: div_3zzzry
  subtype: locality
  parent: div_p735rv
  role: nation
  status: generated
  names: {zh: 卡托拉特许领, en: Katora Chartered Territory, art-x-ranova: Faritra Nomena Alalana Katora}
  short_names: {zh: 卡托拉, en: Katora}
  notes: {zh: '卡托拉特许领位于拉诺瓦岛西北外海最西端，由一座主岛和北面的一座小岛组成，面积约四千六百平方公里，人口约十二万，几乎全部是卡托拉安全集团的员工及其家属。岛上只有卡托拉一座公司城，跑道、机库、训练场、仓库和员工宿舍占据了大半个岛。

      卡托拉原是联合共和国海军的一处训练和补给基地。大分裂后，一群退役军官买下了基地的设施，成立卡托拉安全集团，向本岛各方出售安保、培训和作战服务。几年后，集团用一笔巨款从临近的群岛政权手中「买下」了整个岛屿的管辖权，宣布成立特许领。特许领没有公民，只有雇员、承包商和家属；集团董事会是最高权力机关，董事长兼任总督，法律就是公司的规章制度，违规者会被解雇并驱逐出岛。

      卡托拉的业务遍布全岛：为萨希利亚和努西拉的油气设施提供保安，为安博维的卡特尔训练护卫，也在南方战争中同时与多方签订合同。国际组织多次指责其雇员在冲突中侵犯人权，但特许领拒绝接受任何外国法院的管辖。集团的收入使特许领的人均收入达到约六万美元，岛上只流通公司代币，员工在公司商店购物、在公司医院看病、孩子在公司学校上学。

      卡托拉不加入任何阵营，只为出价最高的客户服务，被批评者称为「全岛最危险的商店」。它与努西拉在渔场和海域划界上存在争议，与米拉卡因越界训练而关系紧张，却与萨拉卡公国和安博维保持密切的金融和安保合作。每年公司成立纪念日，特许领举行空中表演和阅兵，董事长向「年度最佳承包商」颁发奖章。', en: "The Katora Chartered Territory lies at the western end of the islands off north-west Ranova, a main island and a small one to its north covering some 4,600 km² with about 120,000 people, nearly all of them employees of the Katora Security Group and their families. Katora is the only town, a company town of runways, hangars, ranges, warehouses and staff quarters covering most of the island. \nKatora was once a training and supply base of the United Republic's navy. After the Sundering a group of retired officers bought the base's facilities and founded the Katora Security Group to sell security, training and combat services to every side on the main island. A few years later the group 'bought' jurisdiction over the whole island from the neighbouring island authorities for a large sum and proclaimed a Chartered Territory. It has no citizens, only employees, contractors and dependants; the group's board is the supreme authority, the chairman is also governor, the law is the company's regulations, and those who break them are dismissed and expelled from the island. \nKatora's business spans the island: it guards the oil and gas installations of Sahiliya and Nusira, trains bodyguards for the Ambovy cartels, and in the Southern War has held contracts with several sides at once. International bodies have repeatedly accused its staff of human rights abuses in the fighting, but the territory refuses the jurisdiction of any foreign court. The group's earnings give the territory an income of about 60,000 dollars a head; only company scrip circulates, and staff shop in the company store, see the company doctor and send their children to the company school. \nKatora joins no bloc and serves the highest bidder, and its critics call it 'the most dangerous shop on the island'. It disputes the boundary of fishing grounds and waters with Nusira and has tense relations with Miraka over training across the boundary, but works closely with the Principality of Saraka and Ambovy on finance and security. Every year on the company's founding day the territory holds an air show and a parade, and the chairman presents a medal to the 'contractor of the year'."}
