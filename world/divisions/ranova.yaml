    zh: "瓦罗纳是瓦罗纳商业共和国的唯一城市，坐落在拉诺瓦岛西北外海、离本岛北端不远的一座主岛和东北面的一座小岛上。全市面积约 3100 平方公里，人口约 110 万，每平方公里约 355 人，岛上高楼林立，是全岛人口最密集的地方之一；最高处海拔 634 米。这里属热带季风气候，年均气温 22.3 ℃，年降水约 2890 毫米，八月最湿，二月最干。市旗深红底金边，正中一只金色船舵，是把国旗的三尾长旗改成了方旗，挂在交易所和船厂门口；市花是九重葛，市树是大叶榄仁。\n联合共和国时期，瓦罗纳就是西北最大的商港，由几个世代经营航运的商人家族主导。大分裂时，商人们组织城市卫队守住了港口，宣布建立商业共和国，以「对所有人开放港口」为国策。老港码头广场上的执政官宫是一座带拱廊的大理石建筑，底层的拱廊向广场敞开，商人们从前就在这里谈生意，宫殿的一部分改成了共和国历史博物馆。执政官由大议会从议员中选出，任期六年，不得连任，现任执政官安娜·瓦罗尼出身于最古老的航运家族之一；人选往往要先在广场西侧的三商会大厦里由船东、贸易和银行三大商会协商，所以人们常说执政官是大商会选出来的。广场东侧的瓦罗纳商事仲裁法院是全岛最重要的商事仲裁机构，连互相敌对的阵营也会把海运和保险纠纷交给它，庭院中央有一座天平喷泉。\n转口港、船厂和商品交易所是城市的命脉。瓦罗纳港是全岛最大的转口港，三十多年来从未因战争关闭过一天，码头广场上的商人用拉诺瓦语、卡西里语和英语讨价还价，港口的灯火通宵不灭。瓦罗纳造船厂有两座干船坞，龙门吊是港区最醒目的建筑；瓦罗纳商品交易所的指数随阵营局势起落，瓦罗纳船舶保险社大厅里的黑板记录着每天进出港的船只和海上事故，局势一紧张保费就上涨。人均产值约 5.2 万美元，但住房极其紧张，普通家庭住在狭小的高层公寓里，房价是全岛最高的。\n市议会 35 席，最近一次投票率 67.4%。自由商人党得票 42.0%、15 席，与 8 席的港城公民党联合执政，海员工党 12 席是最大的反对党；市长索阿·拉扎芬德拉贝和议长蒂安娜·拉托沃都属自由商人党。\n瓦罗纳机场建在岛北岸的平地上，跑道一端伸进海里，飞机降落时仿佛贴着海面滑行，到达大厅的大屏幕实时显示港口的船只和交易所的行情。\n居民四成多以拉诺瓦语为母语，英语也很通行，平均预期寿命 84.4 岁，65 岁以上的老人占 18%。人们以精明务实著称，常说「战争会结束，生意不会」。每年春季的海神节，几百艘装饰一新的船只在港内巡游，执政官把一枚金戒指投入大海，象征共和国与海洋的婚约。"
    en: "Varona is the only city of the Merchant Republic of Varona, on a main island and a smaller island to its north-east off the north-west of Ranova, not far from the main island's northern tip. The city covers some 3,100 km² with about 1.1 million people, around 355 per km²; crowded with towers, it is one of the most densely settled places in Ranova, and its highest point is 634 m. The climate is tropical monsoon, with a mean temperature of 22.3 °C and some 2,890 mm of rain a year; August is the wettest month and February the driest. The city flag shows a golden ship's wheel on crimson within a gold border, the national flag's three-tailed pennant turned into a square flag, and it hangs at the doors of the exchange and the shipyards; the city flower is the bougainvillea and the city tree the Indian almond.\nUnder the United Republic, Varona was already the largest trading port of the north-west, dominated by a few families who had run shipping for generations. In the Sundering the merchants raised a City Guard to hold the port and proclaimed the Merchant Republic, with 'a port open to all' as its national policy. On the quayside square of the old harbour stands the Palace of the Consul, an arcaded marble building whose ground-floor arcade opens onto the square, where merchants once did their deals; part of the palace is now a museum of the republic's history. The Doge is elected by the Great Council from among its members for a single six-year term; the present Doge, Ana Varony, comes from one of the oldest shipping families. The choice is usually settled first in the House of the Three Chambers on the west side of the square, among the three great chambers of shipowners, traders and bankers, which is why people say the Doge is chosen by the great merchant houses. On the east side, the Varona Court of Commercial Arbitration is the island's foremost commercial arbitration body, to which even hostile blocs refer their shipping and insurance disputes, and a fountain in the shape of a pair of scales stands in its courtyard.\nThe entrepôt, the shipyards and the commodity exchange are the city's lifeblood. The Port of Varona is the island's largest entrepôt and has not closed for a single day of war in more than thirty years; merchants on the quayside square haggle in Ranovan, Kasiri and English, and the port's lights burn all night. The Varona Shipyard has two dry docks, and its gantry cranes are the most striking sight in the harbour; the index of the Varona Commodity Exchange rises and falls with relations between the blocs, and the blackboard in the hall of the Varona Marine Insurance Society records each day's ship movements and accidents at sea, with premiums rising whenever tension mounts. Output per head is about US$52,000, but housing is desperately short: ordinary families live in cramped high-rise flats, and property prices are the highest on the island.\nThe City Council has 35 seats; turnout at the last election was 67.4%. The Free Merchants' Party won 42.0% and 15 seats and governs with the 8-seat Harbour Citizens' Party, while the Seafarers' Labour Party, with 12 seats, is the main opposition; the mayor, Soa Razafindrabe, and the speaker, Tiana Ratovo, both belong to the Free Merchants.\nVarona Airport lies on flat land on the north shore of the island, one end of its runway reaching out into the sea so that landing aircraft seem to skim the water, and a big screen in the arrivals hall shows the ships in port and the exchange prices in real time.\nJust over four in ten residents speak Ranovan as their mother tongue, English is widely used, life expectancy is 84.4 years, and people aged 65 and over make up 18% of the population. Varonans are known for being shrewd and practical, and they say, 'Wars end; business doesn't.' At the Festival of the Sea God each spring, hundreds of decorated boats parade around the harbour, and the Doge casts a gold ring into the sea to mark the republic's marriage with the ocean."
