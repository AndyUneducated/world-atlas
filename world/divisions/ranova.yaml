# ── 伊瓦洛自由公社联合会 ──
- id: div_0cazhp
  subtype: country
  status: generated
  names: {zh: 伊瓦洛自由公社联合会, en: Free Communes of Ivalo, art-x-ranova: Kaominina Malalaka Ivalo}
  short_names: {zh: 伊瓦洛, en: Ivalo}
  notes:
    zh: "伊瓦洛自由公社联合会位于拉诺瓦岛东部的内陆，在法拉纳断崖下部的丘陵和台地上，北面和东面是马索沃利，南邻洛哈瓦托王国，西接安博哈拉基督教联邦，面积约一万平方公里，人口约三十万。联合会原称法尼里自由公社联合会，原本从断崖一直延伸到东海岸，最大的城镇法尼里是东海岸的渔港；沿海战争后，沿海的公社全部被马索沃利吞并，联合会只剩下内陆的伊瓦洛一带，成了没有海岸的内陆国，伊瓦洛也成了首都。如今的居民约二十二万是伊瓦洛的老住户，约八万是从沿海逃来的人。\n大分裂时，东海岸的码头工人、渔民和纺织工人拒绝接受任何一方的政府，他们占领工厂和港口，成立工人议会，乡村则由农民自发组成村社。各公社随后结成联合会，宣布不设中央政府、不设常备军、不设警察，一切公共事务由各公社的全体大会决定，联合会代表大会只负责协调跨公社的事务，代表由各公社选派，可以随时召回。对外联络由轮值协调员负责，任期一年，不得连任。\n联合会代表大会共 120 席，战后改在伊瓦洛公社大会堂开会：工人议会代表 60 席、村社代表 45 席，原来的 15 个渔民合作社席位改为「沿海流亡公社代表」，由逃到内陆的沿海居民在难民村里选出，表示联合会不放弃被占领的沿海公社。联络委员会没有命令权，下设对外联络、物资交换、沿海流亡公社协调和自卫民兵协调四个小组，成员由代表大会选出，可随时召回；现任对外联络协调员伊雷娜·沃拉只是委员会的一员，不是元首。联合会不设职业法官和监狱，纠纷由全体大会抽签产生的五人调解庭处理，以赔偿与和解为主，最重的处罚是把当事人逐出公社；跨公社的纠纷由双方各出两人、再抽签一人组成调解庭。自卫靠完全自愿的伊瓦洛人民民兵，现役约两千人、预备役约一万五千人，只有轻武器和少量迫击炮，指挥员由民兵选举产生，也可以随时被撤换。货币就是劳动券，约 58% 的居民不信教，祖灵信仰约占 18%，新教和天主教各占一成上下。\n马索沃利的报纸多年把公社称为「无政府主义的混乱」。近年，一艘马索沃利渔船的船员带着家属逃进法尼里港，全体大会按公社的老规矩收留了他们，拒绝交回；马索沃利随即宣布要「解救沿海劳动人民」，人民军在一个星期日的凌晨从陆上和海上同时进攻，这就是沿海战争。民兵在北郊和船厂一带抵抗了约十天，全体大会在停了电的大会堂里点着油灯开了最后一次会，决定不在街巷里打到最后一人，而是让愿意走的人撤往内陆。民兵掩护约八万居民沿公路退上断崖，人民军追到断崖脚下停住，战线冻结至今，没有任何和约。联合会和大多数国家都不承认这次吞并。留在沿海的人被编进马索沃利的国营工厂和集体农庄，工人议会、合作社和公社报纸全部被取缔，许多前代表和民兵被送进再教育营；逃出来的人说，最难熬的是从此与留下的亲人音讯断绝。\n沿海战争后的第一次代表大会上，沿海流亡公社的代表提议给联合会改名。旧名取自海边的法尼里，那是公社运动开始的地方，名字意为「愿望」。提议的人说，那座城如今挂着马索沃利的旗，却仍叫法尼里，公社的每一张劳动券、每一次广播还在用它的名字，就像每天都在念一封寄不出去的信；而在大家最难的时候，是伊瓦洛的村社打开粮仓、腾出屋子，收留了所有的人。提议在流亡者中间争了好几个星期，许多人担心改名就等于承认海边丢了；伊瓦洛也有村民不情愿，说公社不该拿哪一个地方的名字当作中心。各公社的全体大会逐一表决，多数赞成，联合会从此改称伊瓦洛自由公社联合会，公约里同时写明：沿海公社获得自由的那一天，名字由全体大会重新表决。流亡者常说，「愿望」是他们背上断崖的东西，伊瓦洛是收留了它的地方。\n公社的生活仍由劳动券和集体分配组织：土地、林场和作坊归公社共有，成员按劳动时间领取劳动券，住房、医疗和教育免费。逃来的码头工人、织工和造船工在伊瓦洛林业公社木材厂的棚子里办起纺织、修理和木工作坊，渔民学着种稻；村社打开粮仓，各家各户收留了上万个沿海家庭，学校和大会堂的走廊里也住满了人。从海边撤出来的机构也在伊瓦洛重新办起：大会堂周围先后盖起了联络委员会会所、工人议会联合会会所、沿海流亡公社会堂和公社调解庭，互助信用社联合会、劳动券清算所、公社账目审查所和放下武器者接待处也有了自己的房子，伊瓦洛自由学校、人民食堂、公社诊所、人民图书馆和自由公社电台都重新开了门，这些房子大多是村社和流亡者用土砖义务盖成的。联合会仍是全岛新闻自由度最高的地方之一，几份公社报纸在伊瓦洛复刊，自由公社电台用带出来的发射机重新开播。但联合会失去了港口、船厂和渔场，与外界的贸易只能用卡车走山路，经洛哈瓦托和安博哈拉进出，人均收入约三千美元；决策缓慢、设备老旧和技术人员流失这些老问题，都比战前更重了。\n联合会在世俗协约中只是观察员。阿瓦拉齐既是马索沃利的兄弟之邦，又是公社多年的贸易伙伴，战争中只呼吁「双方克制」，至今不肯谴责吞并，公社报纸称之为「兄弟之间的沉默」；反倒是信仰阵营的安博哈拉和洛哈瓦托让援助物资过境，并收留了一部分难民。联合会一向警惕马索沃利的世袭政权和最神圣的黎明千年国的神权统治。高原战争期间，公社收容了大量两边的逃兵和难民，宣布任何人只要放下武器都可以在公社劳动生活，这个传统后来正是沿海战争的导火索之一。每周日，伊瓦洛公社大会堂召开全体大会，农民、流亡的渔民和工人轮流上台发言，会议常常持续到深夜。\n公社大会日是最大的节日，公共食堂的豆饭是人人吃过的家常饭，自行车是最普及的运动，也是公社之间最常见的交通工具。国歌叫《我们的手》，红黑对角旗中央的白环代表全体大会围坐的圆圈，这面旗也是由全体大会表决采用的；战后，流亡的沿海公社在旗杆上多系一条蓝布，代表失去的海。公社没有统一的警察和领事机构，各公社的规定各不相同，外来的旅客入境前要先联系一个接待公社，由它安排住处和向导，断崖脚下的战线一带不得靠近。"
    en: "The Free Communes of Ivalo lie inland in the east of Ranova, on the hills and terraces of the lower Farana Escarpment, with Masovoly to the north and east, the Kingdom of Lohavato to the south and the Christian Federation of Ambohara to the west; they cover some 10,000 km² with about 300,000 people. Once called the Free Communes of Faniry, the federation used to reach from the escarpment to the east coast, and its largest town, Faniry, was a fishing port on that coast; since the Coastal War every coastal commune has been annexed by Masovoly, and the federation is left with only the country round Ivalo inland, a landlocked state with Ivalo as its capital. About 220,000 of its people are Ivalo's old residents and some 80,000 are people who fled the coast.\nIn the Sundering the dockers, fishers and textile workers of the east coast refused to accept any government. They occupied the factories and the port and set up workers' councils, while in the countryside farmers formed village communes of their own. The communes then joined in a federation and declared that there would be no central government, no standing army and no police: all public business is decided by each commune's general assembly, and the Federal Congress of Delegates only co-ordinates matters between communes, its delegates sent by the communes and recallable at any time. External contacts are handled by a rotating coordinator who serves one year and may not serve again.\nThe federal congress has 120 seats and since the war has met in the Ivalo Commune Assembly Hall: 60 for the workers' councils, 45 for the village communes, and the 15 seats that once belonged to the fishers' co-operatives now held by 'delegates of the exiled coastal communes', chosen in the refugee villages by people who fled the coast, as a sign that the federation has not given up the occupied communes. The Liaison Committee has no power to command; it has four groups, for external liaison, exchange of goods, the exiled coastal communes and the self-defence militia, and its members are chosen by the congress and can be recalled at any time. The present external liaison coordinator, Irena Vola, is simply one member of the committee and not a head of state. The federation has no professional judges and no prisons: disputes go to a panel of five drawn by lot from a commune's general assembly, which works mainly through compensation and reconciliation, and the heaviest penalty is expulsion from the commune; disputes between communes go to a panel of two from each side and one more drawn by lot. Defence rests on the wholly voluntary Ivalo People's Militia, some 2,000 active members and about 15,000 reservists with small arms and a few mortars, whose commanders are elected by the militia and can be removed at any time. The labour voucher is the currency; about 58% of residents profess no religion, ancestral religion claims about 18%, and Protestants and Catholics around a tenth each.\nFor years Masovoly's papers called the communes 'anarchist chaos'. In recent years the crew of a Masovoly fishing boat fled into Faniry harbour with their families, and the general assembly, by the communes' old custom, took them in and refused to hand them back; Masovoly then announced that it would 'rescue the working people of the coast', and before dawn one Sunday the People's Army attacked by land and sea at once. This was the Coastal War. The militia held out for about ten days in the northern suburbs and round the shipyard, and the general assembly met for the last time by oil lamp in the darkened assembly hall and decided not to fight to the last in the streets but to let all who would go withdraw inland. The militia covered some 80,000 residents as they retreated up the road onto the escarpment, and the People's Army halted at its foot, where the front has stayed frozen ever since, with no treaty of any kind. The federation and most states do not recognise the annexation. Those who stayed on the coast were put to work in Masovoly's state factories and collective farms, the workers' councils, co-operatives and commune papers were all banned, and many former delegates and militia members were sent to re-education camps; those who got out say the hardest thing is having heard nothing since from the relatives they left behind.\nAt the first Congress after the Coastal War the delegates of the exiled coastal communes moved that the federation change its name. The old name came from Faniry on the coast, where the commune movement began; it means 'wish'. Those who put the motion said that the town now flew Masovoly's flag yet was still called Faniry, while every labour voucher and every broadcast of the communes still bore its name, like reading out each day a letter that could never be posted; and that in everyone's hardest hour it was Ivalo's villages that had opened their granaries, made room in their houses and taken them all in. The motion was argued over among the exiles for weeks, many fearing that a new name would mean admitting the coast was lost, and some Ivalo villagers were reluctant too, saying the communes should not make any one place their centre. The communes' general assemblies voted one by one, a majority in favour, and the federation has since been called the Free Communes of Ivalo; the compact also states that on the day the coastal communes are free, the general assembly will vote on the name again. The exiles often say that the 'wish' is what they carried up the escarpment, and Ivalo is the place that took it in.\nLife in the communes still runs on labour vouchers and shared distribution: land, forests and workshops are held in common, members receive vouchers for hours worked, and housing, health care and schooling are free. Dockers, weavers and shipwrights who fled have set up textile, repair and joinery workshops in the sheds of the Ivalo Forestry Commune Sawmill, and fishers are learning to grow rice; the village communes opened their granaries and households took in more than ten thousand coastal families, while the corridors of the schools and the assembly hall filled with people too. The institutions that came out of the coast have started again in Ivalo: the Liaison Committee House, the House of the Workers' Councils, the Hall of the Exiled Coastal Communes and the Commune Mediation House have gone up round the assembly hall, the Federation of Mutual Credit Unions, the Labour Voucher Clearing House, the Commune Accounts Review House and the Reception Office for Those Who Lay Down Arms have buildings of their own, and the Ivalo Free School, the People's Canteen, the Commune Clinic, the People's Library and Free Commune Radio are open again, most of their buildings put up in earth brick by villagers and exiles as voluntary work. The federation still has some of the freest press on the island: several commune papers have started again in Ivalo, and Free Commune Radio is back on the air with the transmitter its broadcasters carried out. But the federation has lost its port, shipyard and fishing grounds, its trade with the outside world has to go by lorry over mountain roads through Lohavato and Ambohara, and income is about 3,000 dollars a head; the old problems of slow decisions, worn-out machinery and skilled people leaving are all worse than before the war.\nThe federation is only an observer in the Secular Accord. Avaratsy, Masovoly's fraternal state and for years the communes' trading partner, only urged 'restraint on both sides' in the war and still will not condemn the annexation, which the commune papers call 'the silence between brothers'; it was the faith-bloc states of Ambohara and Lohavato that let aid across their borders and took in some of the refugees. The federation has always been wary of Masovoly's hereditary regime and of the theocracy of the Most Holy Millennial Realm of the Dawn. During the Highland War the communes took in many deserters and refugees from both sides and declared that anyone who laid down their arms could live and work among them, the very custom that later helped spark the Coastal War. Every Sunday the general assembly meets in the Ivalo Commune Assembly Hall, farmers and exiled fishers and workers taking turns to speak, and the meeting often runs late into the night.\nCommune Assembly Day is the main holiday, bean rice from the communal canteen is the meal everyone has eaten, and cycling is the most popular sport as well as the usual way of getting between communes. The anthem is Our Hands, and the white ring at the centre of the red-and-black diagonal flag stands for the circle of the general assembly, which itself voted the flag into use; since the war the exiled coastal communes tie an extra strip of blue cloth to their flagpoles for the sea they have lost. There is no common police force or consular service and every commune has its own rules, so visitors must contact a host commune before they arrive, which then arranges somewhere to stay and a guide, and the front at the foot of the escarpment is off limits."
