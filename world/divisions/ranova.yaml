    zh: "坦德罗是圣山修道院与坦德罗骑士团的首府，位于拉诺瓦岛东南外海的岛上，是圣山脚下的港口小镇。全市就是整个国家，面积约 6600 平方公里，人口约 8 万，其中约一万是修士，其余是为修道院耕种、捕鱼和接待朝圣者的平信徒。小镇建在海拔不到 200 米的山脚，圣山主峰 2631 米，从海面直接拔起。这里属热带季风气候，年均气温 25.1 摄氏度，年降水约 2750 毫米，八月最湿。二十座修道院散布在圣山的山坡上，朝圣者须持修道院签发的通行证才能登山。\n坦德罗是全岛最古老的基督教圣地。相传最早的修士从海上来，在山洞中隐修，后来才建起修道院；联合共和国时期圣山享有自治，大分裂时二十座修道院宣布独立，与守护圣山的骑士团共同签署《圣山宪章》。国家由二十座修道院各派一名代表组成的神圣议会统治，首席修道院长提莫特奥住在镇子上方圣山入口的首席修道院长府里，院内钟楼每天敲响七次。港口小镇由二十位院长组成的院长会议管理，院长们推选汉塔·拉科托马拉拉为首席院长。约 150 名坦德罗骑士守卫修道院、朝圣步道和港口，只配轻武器和礼仪佩剑；防务由安博哈拉负责，联邦在港口附近设有一座只有几十名警卫的警卫站，警卫不得进入修道院的范围。\n朝圣者的第一站是码头旁的通行证办公室，每天只发一百多张通行证，外国人须提前几个月申请，持证者可在山上的修道院免费食宿，最多停留四天。圣山区域只许男性进入，女性只能在首府和西北小岛的女修道院朝拜，这条规矩常受到人权组织批评。有的修道院建在半山腰的台地上，有的建在海边悬崖上，从港口坐小船最方便，最偏远的几座藏在森林深处，修士要背着补给走半天石阶。圣像画坊用蛋彩和金箔在木板上作画，一幅要画几个月；圣山手稿图书馆收藏着用古拉诺瓦文字写的福音书，最古老的据说有一千多年。\n经济依靠朝圣者的捐献、修道院的葡萄园、橄榄园、蜂蜜和手抄圣书，第三产业占 78%，人均生产总值约 3500 美元。平信徒没有选举权，土地、房屋和渔船大多属于修道院；圣山平信徒公民会的会员约九千人，请求设立平信徒议事会、开办中学和诊所，首席修道院长已同意开办诊所。\n居民 91% 以拉诺瓦语为母语，65 岁以上的人占 35%，许多年轻人去外地读书后不再回来。码头尽头的港口圣尼古拉小教堂墙上挂满渔民献的船模和还愿牌，渔民出海前都来点一支蜡烛；朝圣者客舍的晚餐是修道院自产的面包、橄榄和蔬菜汤，院中古井的水据说能治病。变容节的夜里，修士和朝圣者登上山顶的小礼拜堂通宵礼拜，迎接日出；复活节前夜，二十座修道院同时点燃烛火，从海上望去，圣山像一棵挂满灯火的树。市花是栀子花，市树是龙血树。"
    en: "Tendro is the seat of the Monastery of the Holy Mount and Knights of Tendro, on an island off Ranova's south-east coast: a little harbour town at the foot of the Holy Mountain. The city is the whole country, covering about 6,600 km² with some 80,000 people, about ten thousand of them monks and the rest lay people who farm, fish and receive pilgrims for the monasteries. The town stands below 200 m at the foot of the mountain, whose summit, at 2,631 m, rises straight out of the sea. The climate is tropical monsoon, with a mean temperature of 25.1 °C and about 2,750 mm of rain a year, August being the wettest month. Twenty monasteries are scattered over the mountain's slopes, and pilgrims need a permit from the monasteries to climb.\nTendro is the oldest Christian holy place on the island. Tradition says the first monks came by sea and lived as hermits in caves before building monasteries; under the United Republic the Holy Mountain was autonomous, and at the Sundering the twenty monasteries declared it independent, signing the Charter of the Holy Mountain together with the order of knights that guarded it. The state is ruled by the Holy Synod, with one delegate from each of the twenty monasteries, and the First Abbot, Abbot Timoteo, lives in the Residence of the Protos at the entrance to the mountain above the town, whose bell tower rings seven times a day. The harbour town is run by the Assembly of Abbots of the twenty monasteries, who have chosen Hanta Rakotomalala as Protos. Some 150 Knights of Tendro guard the monasteries, the pilgrims' paths and the harbour with only light arms and ceremonial swords; defence is Ambohara's responsibility, and the Federation keeps a guard post of a few dozen men near the harbour, whose guards may not enter the monasteries' grounds.\nThe pilgrims' first stop is the Pass Office beside the quay, which issues only a little over a hundred permits a day; foreigners must apply months ahead, and permit holders may stay and eat free at the monasteries on the mountain for up to four days. Only men may enter the Holy Mountain, and women may worship only at the convents in the capital and on the north-western islet, a rule often criticised by human rights organisations. Some monasteries stand on terraces halfway up the mountain, others on sea cliffs best reached by small boat from the harbour, and the most remote lie deep in the forest, half a day's climb up stone steps for monks carrying supplies. The Icon Workshop paints on wooden panels in egg tempera and gold leaf, each icon taking months, and the Holy Mountain Manuscript Library holds gospels written in the old Ranovan script, the oldest said to be more than a thousand years old.\nThe economy depends on pilgrims' offerings and the monasteries' vineyards, olive groves, honey and hand-copied holy books; services make up 78% of it, and output per head is about $3,500. Lay people have no vote, and most land, houses and fishing boats belong to the monasteries; the Lay Citizens' Assembly of the Holy Mountain, with some nine thousand members, asks for a lay council, a secondary school and a clinic, and the First Abbot has agreed to the clinic.\nNinety-one per cent of the people speak Ranovan as their mother tongue; 35% are over 65, and many young people who leave to study do not come back. The walls of the Harbour Chapel of St Nicholas at the end of the quay are covered with model boats and votive plaques given by fishermen, who all come to light a candle before putting to sea; supper at the Pilgrims' Guesthouse is the monasteries' own bread, olives and vegetable soup, and the water of the old well in its courtyard is said to heal. On the night of the Transfiguration monks and pilgrims climb to the Summit Chapel for an all-night vigil to greet the sunrise, and on the eve of Easter the twenty monasteries light their candles at the same moment, so that from the sea the mountain looks like a tree hung with lights. The city flower is the gardenia and the city tree the dragon tree."
