  flag_notes: {zh: 旧联合共和国船旗的样式：旗杆上角是联合标志——绿底白色斜十字，中央红盘金星；蓝色旗面右侧白色圆盘中是红、绿、金三个相扣的圆环。三个圆环代表在萨马伊共存的基督教、伊斯兰教和佛教，蓝色船旗表明自由邦依据条约和平脱离联合共和国。, en: 'In the pattern of the old United Republic''s ensigns, with the union mark in the canton, a white saltire on green with a red disc and gold star where the arms cross; the blue field bears in the fly a white disc with three linked rings of red, green and gold. The rings are Christianity, Islam and Buddhism living together in Samay; the blue ensign shows the Free State left the United Republic peacefully by treaty.'}
