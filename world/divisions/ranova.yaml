# ── 伊纳拉群岛邦 ──
- id: div_4nnakk
  subtype: country
  status: generated
  names: {zh: 伊纳拉群岛邦, en: Commonwealth of the Inara Isles, art-x-ranova: Fiombonan'ny Nosy Inara}
  short_names: {zh: 伊纳拉, en: Inara}
  notes:
    zh: "伊纳拉群岛邦位于拉诺瓦岛东南外海最远处，由伊纳拉岛、雷尼岛和三座小岛组成，面积约一万零二百平方公里，人口约四十万，有首府伊纳拉和东岛的雷尼两座城市。群岛被珊瑚礁和蓝色的潟湖环绕，岛上是椰林、肉桂园和渔村，潟湖里有珍珠养殖场和海藻田。\n群岛的居民世代实行母系制度：家族的姓氏、土地和房屋都由母亲传给女儿，男子婚后住进妻子的家族，舅舅在外甥的教育中扮演重要角色。联合共和国时期，母系习惯法得到部分承认；联合共和国解体时，群岛与中央政府签约和平分离，成为群岛邦，沿用了旧船旗的样式。邦的最高机构是母亲议会，由各氏族的女性家长推选，选出终身的大母为国家元首，负责土地和习惯法事务；日常政府则由全体岛民选举的岛民议会和首席部长负责，男女都有选举权和被选举权。\n现任大母是伊娜·雷尼索阿，由母亲议会推选，终身任职。岛民议会共 41 席，全国为一个选区，按得票比例以最大余额法分配，不设门槛，上一次选举投票率高达 83.1%：氏族传统党得 18 席，与新岛民党的 10 席组成联合政府，首席部长马莉·伊纳拉索阿出自氏族传统党，副首席部长费特拉·拉索阿奈沃出自新岛民党；海洋公地党得 13 席，领袖诺罗·瓦希纳是反对党领袖。首席部长须获得岛民议会多数的支持，凡是涉及氏族土地和习惯法的法案，都要经母亲议会同意才能生效。邦没有军队，只有约八百人的伊纳拉海岸巡逻队，年满 18 岁的男女都可以志愿加入，快艇守护着渔场和珍珠养殖场。约 46% 的居民保持祖灵信仰，天主教徒约占四分之一，新教徒近两成，许多人在教堂望完弥撒，回家照样给先祖母亲们上供。\n群岛邦是全岛社会最平等的地方之一，女性在政治、经济和家庭中都拥有主导地位，家庭暴力和贫困率很低。邦保持中立，与萨马伊自由邦和安巴罗托管地关系密切，在三十多年的战争中从未卷入战斗，只在潟湖边的小岛上设立过一处难民营地。\n经济以渔业、珍珠和海藻养殖、肉桂和生态旅游为主，人均收入约一万二千美元。游客必须住在各氏族经营的家庭旅馆里，收入由氏族共享。每年满月时节，各氏族的女儿们举行成年礼，母亲把传家的宝贝贝壳交到女儿手中，全岛的人在海滩上燃起篝火，唱着关于先祖母亲们从海上来到群岛的古老歌谣。\n大母节是全邦最隆重的节日，各氏族划着舷外浮杆独木舟到首府伊纳拉的潟湖比赛，赛后人人分一碗潟湖鱼汤。外来者踏上氏族土地之前须先征得许可，这条规矩连邦政府的官员也要遵守。"
    en: "The Commonwealth of the Inara Isles lies farthest out in the sea off south-east Ranova: Inara, Reny and three smaller islands covering some 10,200 km² with about 400,000 people in two cities, the capital, Inara, and Reny on the eastern island. The isles are ringed by coral reefs and blue lagoons, with coconut groves, cinnamon gardens and fishing villages ashore and pearl farms and seaweed beds in the lagoons. \nThe islanders have always been matrilineal: family name, land and houses pass from mother to daughter, men move into their wives' families on marriage, and a mother's brother plays a large part in raising her children. Under the United Republic matrilineal customary law was partly recognised; when the Republic dissolved the isles separated peacefully by treaty and became a commonwealth, keeping the pattern of the old ensigns. The supreme body is the Mothers' Council, chosen by the women heads of the clans, which elects a Great Mother for life as head of state with charge of land and customary law; day-to-day government belongs to the Islanders' Assembly, elected by all islanders, and a chief minister, and men and women alike may vote and stand. \nThe present Great Mother is Ina Renisoa, chosen by the Mothers' Council for life. The Islanders' Assembly has 41 seats, elected across the whole country as one constituency in proportion to the vote by largest remainder, with no threshold, and turnout at the last election reached 83.1%: the Clan Tradition Party won 18 seats and governs in coalition with the New Islanders' Party's 10, with the Chief Minister, Maly Inarasoa, from the Clan Tradition Party and the Deputy Chief Minister, Fetra Rasoanaivo, from the New Islanders' Party; the Ocean Commons Party won 13 seats and its leader, Noro Vahina, leads the opposition. The Chief Minister needs the support of a majority of the Assembly, and any bill touching clan land or customary law takes effect only with the consent of the Mothers' Council. The commonwealth has no army, only the Inara Coastal Patrol of about 800, which men and women may join as volunteers from the age of 18, and whose fast boats guard the fishing grounds and pearl farms. About 46% of the people keep to ancestral religion, Catholics make up about a quarter and Protestants nearly a fifth, and many come home from Mass and still make offerings to the ancestral mothers.\nThe Commonwealth is one of the most equal societies on the island; women lead in politics, the economy and the family, and domestic violence and poverty are rare. It is neutral and close to the Free State of Samay and the Ambaro Trust Territory, has never been drawn into the fighting in more than thirty years of war, and has only once set up a refugee camp, on an islet by the lagoon. \nThe economy rests on fishing, pearl and seaweed farming, cinnamon and eco-tourism, with income of about 12,000 dollars a head. Visitors must stay in guesthouses run by the clans, whose earnings are shared by the clan. At the full moon each year the daughters of the clans come of age: mothers hand over the family cowrie, bonfires are lit on the beaches, and the whole island sings the old songs of the foremothers who came to the isles from the sea.\nGreat Mother's Day is the commonwealth's grandest festival: the clans race outrigger canoes on the lagoon at Inara, the capital, and afterwards everyone shares a bowl of lagoon fish soup. Outsiders must ask leave before setting foot on clan land, a rule that even officials of the commonwealth government observe."
