  names: {zh: 贾巴勒, en: Jabal, art-x-kasiri: Jabal}
  notes:
    zh: "贾巴勒是贾巴利亚伊斯兰酋长国这个自封政权的中心，建在拉诺瓦岛西北部贾巴勒丘陵的山谷中，离海岸约 120 公里。市域约 2.6 万平方公里，丘陵最高处海拔 1789 米，人口约 42 万。这里属热带草原气候，年均气温 23.0 ℃，年降水约 900 毫米，一到三月几乎无雨。酋长国没有获得任何国家承认，控制它的武装组织被多国和国际组织列为恐怖组织，周边国家多次对其据点发动空袭。\n城镇由地方舒拉管理：城镇埃米尔努鲁·哈马迪由酋长国的舒拉会议指派，地方舒拉由他挑选的宗教人士和部族长老组成。舒拉议事厅设在山谷入口的一座旧堡垒里，堡垒用黑色玄武岩砌成，据说建于各王国时代，四十名指挥官和宗教人员在这里颁布禁令、分配过路费收入、裁决纠纷。自封「埃米尔」阿布·萨利姆（化名）名义上的驻地是城北一座带高墙的院落，他担心空袭，很少在同一处过夜；情报部门认为真正的指挥层藏在丘陵山洞指挥所里。\n城里禁止音乐和影像，女孩小学之后不得上学，女性出行受到严格限制，必须由男性亲属陪同。旧集市旁的贾巴勒「教法法庭」没有辩护制度，判决常常包括鞭刑和处决，萨希利亚的宗教学者委员会和全岛的伊斯兰学者多次公开谴责这些判决违背伊斯兰教法。城外的贾巴勒拘押所关押着政治犯，许多人未经审判被关多年。贾巴勒老清真寺黑色玄武岩的宣礼塔高约三十米，原来的伊玛目被迫出走萨希利亚，那里的学者说这座清真寺的真正传统是宽容的。\n山区的小块耕地之外，走私和过路费是主要收入，人均产值不到 900 美元。丘陵上的贾巴勒山地梯田种着高粱、木薯和豆类，许多青壮年为躲避征召逃往萨希利亚，梯田大片荒芜。城外公路边的过境走私货栈集散从马尔萨港和邻国走私来的燃料和香烟，「天课」征收处设在旧市政楼里，向商人、农户和过往车辆强征所谓宗教税。贾巴勒山口收费检查站是这条财路的关口。\n西海岸公路从贾巴勒丘陵向南通往萨希勒和贝洛瓦，但贾巴勒段被武装组织设卡收费，大部分货车宁愿绕道走海路；约 145 公里的贾巴勒—马尔萨公路通往西北海岸的港口马尔萨。\n居民近八成以卡西里语为母语，14 岁以下的孩子占四成，平均预期寿命 57.2 岁，识字率约 38%。市旗白底，下方一道黑色山脊，因为武装组织不许城旗有任何图像。星期一的贾巴勒瘤牛市场上，买卖双方仍按老规矩拍手成交；贾巴勒医疗站由一家国际医疗援助组织谈判获准运营，不论伤者来自哪一方都予以救治。三十多年来已有十四万多人逃离山区，近年部分部族长老与萨希利亚政府秘密谈判，希望以特赦和发展援助换取武装人员放下武器。"
    en: "Jabal is the centre of the self-proclaimed Islamic Emirate of Jabaliya, built in a valley of the Jabal Hills in north-western Ranova, about 120 km from the coast. Its territory of some 26,000 km² rises to 1,789 m in the hills, and it has about 420,000 people. The climate is tropical savanna, with a mean temperature of 23.0 °C and about 900 mm of rain a year; from January to March there is almost none. The emirate is recognised by no state, the armed group that holds it is listed as a terrorist organisation by many countries and international bodies, and neighbouring states have repeatedly launched air strikes on its strongholds.\nThe town is run by a local shura: the Emir of the Town, Nuru Hamadi, is named by the emirate's shura, and the local shura is made up of clerics and tribal elders of his choosing. The Shura Hall occupies an old fort at the mouth of the valley, built of black basalt and said to date from the age of the kingdoms; here forty commanders and clerics issue bans, share out toll revenue and settle disputes. The nominal residence of the self-styled 'Emir', Abu Salimu (a nom de guerre), is a high-walled compound north of town, but for fear of air strikes he seldom spends two nights in the same place, and intelligence services believe the real leadership hides in the Hill Cave Command Post.\nMusic and images are banned in the town, girls may not attend school beyond primary level, and women's movement is tightly restricted: they must be accompanied by a male relative. The Jabal 'Sharia Court' beside the old market allows no defence, and its sentences often include flogging and execution; Sahiliya's council of religious scholars and Islamic scholars across the island have repeatedly and publicly condemned them as contrary to Islamic law. The Jabal Detention Site outside town holds political prisoners, many of them for years without trial. The black basalt minaret of the Old Mosque of Jabal is about thirty metres high; its former imam was forced to flee to Sahiliya, and scholars there say the mosque's true tradition is one of tolerance.\nBeyond the small hill farms, smuggling and road tolls are the main income, and output per head is under US$900. The Jabal Hill Terraces grow sorghum, cassava and beans, but many young men have fled to Sahiliya to escape conscription, and large stretches have been abandoned. The Transit Smuggling Depot beside the road outside town handles fuel and cigarettes smuggled in through the port of Marsa and from neighbouring countries, and the 'Religious Tax' Office in the old town hall extorts a so-called religious tax from traders, farmers and passing vehicles. The Jabal Pass Toll Checkpoint is the gateway of this trade.\nThe West Coast Road runs south from the Jabal Hills to Sahil and Belova, but the armed group levies tolls on the Jabal section, and most lorries prefer to go round by sea; the Jabal–Marsa Road, about 145 km long, leads to the port of Marsa on the north-west coast.\nNearly eight in ten residents speak Kasiri as their mother tongue, children under fifteen make up four in ten of the population, life expectancy is 57.2 years and literacy about 38%. The city flag is white with a black ridge along the bottom, because the armed group allows no images on it. At the Jabal Zebu Market on Mondays, buyers and sellers still clap hands to seal a deal in the old way, and the Jabal Medical Post, run by an international medical aid organisation under a negotiated agreement, treats the wounded whichever side they come from. Over more than thirty years more than 140,000 people have fled the hills, and in recent years some tribal elders have held secret talks with the government of Sahiliya, hoping to trade an amnesty and development aid for the fighters laying down their arms."
