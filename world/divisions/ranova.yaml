# ── 坦德罗圣山修道院共和国 ──
- id: div_c28art
  subtype: locality
  parent: div_p735rv
  role: nation
  status: generated
  names: {zh: 坦德罗圣山修道院共和国, en: Monastic Republic of Holy Mount Tendro, art-x-ranova: Repoblikan'ny Monasitera Tendrombohitra Masina Tendro}
  short_names: {zh: 坦德罗圣山, en: Mount Tendro}
  notes: {zh: '坦德罗圣山修道院共和国位于拉诺瓦岛东南外海，由圣山坦德罗所在的岛屿和西北面的一座小岛组成，面积约六千六百平方公里，人口约八万，其中约一万是修士，其余是为修道院耕种、捕鱼和服务朝圣者的平信徒。坦德罗是全岛最古老的基督教圣地，圣山主峰两千六百多米，从海面直接拔起，山坡上散布着二十座修道院，首府坦德罗是圣山脚下的港口小镇。

      据传，最早的修士从海上来到坦德罗，在山洞中隐修，后来逐渐建起了修道院。几百年来，坦德罗古教会保留着独特的礼仪和圣歌传统，各国的基督徒都把到圣山朝圣看作一生的心愿。联合共和国时期，圣山享有自治地位；大分裂时，二十座修道院宣布圣山为独立的修道院共和国，不受任何国家管辖。

      共和国由神圣议会统治，二十座修道院各派一名代表，首席修道院长由议会推选，任期五年。圣山的规矩延续了几百年：圣山区域只允许男性进入，女性朝圣者只能在首府和西北小岛上的女修道院朝拜，这一规定常受到人权组织的批评；朝圣者须持修道院签发的通行证，每天限定人数。

      共和国是圣约同盟的成员，但不参与任何军事行动，防务由安博哈拉负责。三十多年的战争中，修道院收容了交战各方的伤员和难民，从不询问他们的来历。经济依靠朝圣者的捐献、修道院的葡萄园、橄榄园、蜂蜜和手抄圣书，人均收入约三千五百美元。每年复活节前夜，二十座修道院同时点燃烛火，从海上望去，整座圣山像一棵挂满灯火的树。', en: "The Monastic Republic of Holy Mount Tendro lies off the south-east of Ranova, the island of the Holy Mountain and a smaller island to its north-west covering some 6,600 km² with about 80,000 people, some 10,000 of them monks and the rest lay people who farm, fish and serve pilgrims for the monasteries. Tendro is the oldest Christian holy place on the island; the summit of the Holy Mountain rises straight from the sea to over 2,600 m, twenty monasteries are scattered over its slopes, and its seat, Tendro, is a little harbour town at its foot. \nTradition says the first monks came to Tendro by sea and lived as hermits in caves before building the monasteries. For centuries the Old Church of Tendro has kept its own liturgy and chant, and Christians of every country count a pilgrimage to the Holy Mountain among their life's wishes. Under the United Republic the mountain was self-governing; in the Sundering the twenty monasteries declared it an independent monastic republic under no state's jurisdiction. \nThe Republic is governed by the Holy Synod, one delegate from each of the twenty monasteries, which elects a First Abbot for five years. The mountain's rules go back centuries: only men may enter the mountain itself, and women pilgrims may worship only in the seat and at the convent on the north-western island, a rule often criticised by human rights groups; pilgrims need a permit from the monasteries, and daily numbers are limited. \nThe Republic belongs to the Covenant League but takes part in no military action, and Ambohara is responsible for its defence. Through more than thirty years of war the monasteries have taken in the wounded and refugees of every side without asking where they came from. The economy depends on pilgrims' gifts and the monasteries' vineyards, olive groves, honey and hand-copied books, with income of about 3,500 dollars a head. On Easter Eve every year all twenty monasteries light their candles together, and from the sea the whole Holy Mountain looks like a tree hung with lamps."}
