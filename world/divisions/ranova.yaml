- id: div_3jg5nn
  subtype: locality
  parent: div_ht80hm
  status: generated
  names: {zh: 伊特拉, en: Itra, art-x-ranova: Itra}
  notes:
    zh: "伊特拉是阿拉齐纳原住民邦联西北部的牧区城镇，坐落在安多希山脚下，北面就是齐马罗沃。市域约 1.5 万平方公里，从草原升到海拔 1978 米的山地，人口约 20 万。这里属热带草原气候，年均气温 22.7 ℃，年降水约 1290 毫米，一到三月几乎无雨，猴面包树和金合欢散布在草原上。市旗赭黄，旗杆一侧是褐底白色的菱形花纹带，那是牧民织毯的图样，右侧一枚蓝色宝石代表氏族共同管理的蓝宝石矿；市花是苦楝花，市树是金合欢。\n和邦联的其他城镇一样，伊特拉由当地各氏族推举的长老共同管理，不举行政党选举，召集人由长老们轮流担任，现任召集人是哈贾·拉索阿奈沃。事情要在长老会上商量到大家都同意为止，就像九氏族议事会在阿拉齐纳的篝火旁那样。\n这里的人以瘤牛为生，牛群是财富和聘礼的计量单位，一户人家有多少头牛，比有多少钱更要紧。人均产值只有约 1220 美元，但贫富差距很小。南部山谷冲积层中的伊特拉蓝宝石矿由氏族共同管理，露天矿坑旁是成百上千个手工淘宝人的小坑，他们在河边用竹筐淘洗砂砾，运气好的一天就能改变一家人的生活；矿镇里开满了宝石交易所，外国买家坐在窗口后用放大镜验货。\n南方战争中，齐马罗沃以「收复祖先土地」为名攻入邦联的牧区，伊特拉首当其冲，蓝宝石矿多次遭到齐马罗沃军队袭击。伊特拉牛群护卫哨的氏族自卫队轮流值守，保护牛群和矿山不受越境袭击，哨所旁的木柱上刻着遇难者的名字。阿拉齐纳公路从齐马罗沃向东南，经伊特拉口岸和宝石矿区通往阿拉齐纳和海边的法里，全长约 530 公里；战争期间，成千上万的难民沿这条路逃来，路边至今立着为途中死去的人堆起的石堆。如今口岸大部分时间关闭，齐马罗沃一侧立着高大的哨塔，阿拉齐纳一侧是援助组织的接待帐篷，偶尔有冒险越境的人在这里登记；援助组织的白色卡车每天沿公路往返。7.8 公里的伊特拉蓝宝石矿公路通往矿区，10.7 公里的伊特拉口岸公路通往口岸。\n居民九成以上说拉诺瓦语，大多信奉祖灵，14 岁以下的孩子超过四成，老人只占 3%，平均预期寿命 58.3 岁，识字率约 42%。城外的伊特拉祖灵圣林是一片原始森林，林中有世代相传的家族墓地和祭祀祖灵的石台，树木不得砍伐，进林要脱鞋，并向守林人说明来意。每隔几年，各家在这里举行迎接先人的「翻尸节」，把祖先的遗骨重新裹上新的丝布，全家人载歌载舞。每年雨季开始时，伊特拉的牧人赶着牛群，沿公路走上好几天去阿拉齐纳参加祭祖仪式和赛牛会，回来时总要带回谁家的牛跑得最快的消息。"
    en: "Itra is a herding town in the north-west of the Alatsina Indigenous Confederacy, at the foot of the Andohy Range, with Tsimarovo just to the north. Its territory of some 15,000 km² rises from grassland to mountains of 1,978 m, and it has about 200,000 people. The climate is tropical savanna, with a mean temperature of 22.7 °C and some 1,290 mm of rain a year; from January to March there is almost none, and baobabs and acacias are scattered across the grassland. The city flag is ochre, with a band of white diamonds on brown along the hoist, the pattern of the herders' woven rugs, and a blue gem on the fly for the sapphire pits held in common by the clans; the city flower is the chinaberry blossom and the city tree the acacia.\nLike the Confederacy's other towns, Itra is run together by elders chosen by its clans. There are no party elections, the elders take turns as convener, and the present convener is Haja Rasoanaivo. Matters are discussed in the council until everyone agrees, just as the Council of the Nine Clans does by the fire in Alatsina.\nPeople here live by their zebu; cattle are the measure of wealth and bride price, and how many head a household owns matters more than how much money it has. Output per head is only about US$1,220, but the gap between rich and poor is small. The Itra Sapphire Mine, in the alluvial beds of the southern valleys, is held in common by the clans; beside its open pits are hundreds upon hundreds of hand diggers' holes, where people wash gravel in bamboo baskets by the river and a lucky day can change a family's life. The mining town is full of gem-trading houses, where foreign buyers sit behind windows inspecting stones through loupes.\nIn the Southern War, Tsimarovo invaded the Confederacy's grazing lands in the name of 'recovering ancestral land'; Itra bore the brunt, and its sapphire pits were raided several times by Tsimarovo's army. The clan militia at the Itra Herd Guard Post keeps watch by turns to protect the herds and the mines from raids across the border, and the wooden post beside it is carved with the names of the dead. The Alatsina Road runs south-east from Tsimarovo through the Itra Crossing and the gem district to Alatsina and Fary on the coast, about 530 km in all. During the war tens of thousands of refugees fled along it, and cairns still stand by the roadside for those who died on the way. Today the crossing is closed most of the time: tall watchtowers stand on the Tsimarovo side, aid agencies' reception tents on the Alatsina side, where the occasional person who has risked the crossing registers, and the white lorries of the aid agencies travel the road every day. The 7.8 km Itra Sapphire Mine Road leads to the mines, and the 10.7 km Itra Crossing Road to the border.\nMore than nine in ten residents speak Ranovan and most follow the ancestral religion; children under fifteen make up more than four in ten of the population and the elderly only 3%, life expectancy is 58.3 years and literacy about 42%. The Sacred Ancestral Grove of Itra outside town is a stretch of old-growth forest holding family tombs passed down the generations and stone altars to the ancestors; its trees may not be felled, and visitors must take off their shoes and tell the keeper why they have come. Every few years families hold the 'turning of the bones' here to welcome their forebears, rewrapping the ancestors' remains in new silk while the whole family sings and dances. Each year at the start of the rains, Itra's herders drive their cattle for days along the road to Alatsina for the ancestral rites and the cattle races, and always come home with news of whose cattle ran fastest."
