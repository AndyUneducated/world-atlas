# ── 伊索卡人民战争解放区 ──
- id: div_9w60j4
  subtype: country
  status: generated
  names: {zh: 伊索卡人民战争解放区, en: Isoka People's War Liberated Zone, art-x-ranova: Faritra Afaka amin'ny Ady Entin'ny Vahoaka Isoka}
  short_names: {zh: 伊索卡解放区, en: Isoka Zone}
  notes:
    zh: "伊索卡人民战争解放区是拉诺瓦人民战争党在岛屿中南部伊索卡山区建立的游击队控制区，面积约三万四千平方公里，人口约四十万，没有任何国家承认，被安博哈拉、梅纳瓦利、安博维和齐马罗沃列为恐怖组织控制区。控制区以伊索卡山为中心，山高林密，山洞和峡谷是游击队的根据地，伊索卡和东部的卡里是两个主要据点。\n人民战争党起源于联合共和国末期的大学读书会，创始人认为阿瓦拉齐的劳动党（今共产党）已经「堕落为官僚」，主张仿照农村包围城市的道路，以长期人民战争夺取全岛政权。大分裂后，党的骨干进入伊索卡山区，在贫困的山村中发动土地革命，没收地主和种植园的土地分给农民，同时以严厉的手段处决「阶级敌人」和「告密者」，至今仍为当地人所恐惧。\n伊索卡人民战争断断续续进行了三十多年，游击队袭击周边国家的警察局、矿区和种植园，绑架人质换取赎金，也在多次清剿中遭受重创。控制区内由革命委员会统治，实行配给制和集体劳动，青少年常被征入游击队，许多家庭因此逃往邻国。\n控制区的最高机构是 15 人的革命委员会，9 名军事指挥员和 6 名政治委员都是拉诺瓦人民战争党的党员，主席以化名「孔达同志」出现，真实身份不详。人民法庭在村庄里公开审判「地主」「叛徒」和刑事案件，判决常在群众大会上宣布，被告没有辩护律师，人权组织记录了大量未经正当程序的处决和强迫「改造」。拉诺瓦人民解放军约有五千名战士，装备轻武器、地雷和缴获的迫击炮，依托山洞、密林和农民网络作战；成年村民都要参加解放区民兵，人权组织还记录了大量被强征的儿童兵。山区的人均预期寿命只有 58.9 岁，识字率 32.2%；约一半居民不信教，祖灵信仰约占 35%，山村里的老人仍按旧俗祭祀祖先。外来者在这里得不到任何政府服务，地雷和交火随时可能发生。控制区的旗帜是红底上一颗金星和交叉的锄头与步枪，只在控制区内使用。\n解放区没有货币和正式经济，依靠小块农业、一处小金矿、向过往商人「征税」和缴获物资维持。人均收入估计不足一千美元。世俗协约的阿瓦拉齐公开谴责人民战争党为「冒险主义」，与之划清界限。近年来，游击队内部出现了分裂，一部分指挥员通过安巴罗托管地的调解与安博哈拉接触，探讨放下武器的可能。"
    en: "The Isoka People's War Liberated Zone is the area held by the guerrillas of the Ranovan People's War Party in the Isoka Massif of south-central Ranova, some 34,000 km² with about 400,000 people. No state recognises it, and Ambohara, Menavaly, Ambovy and Tsimarovo list it as held by a terrorist organisation. It centres on the Isoka Massif, high and densely forested, whose caves and gorges are the guerrillas' bases; Isoka and Kary in the east are its two main strongholds. \nThe People's War Party grew out of university study circles in the last years of the United Republic. Its founders held that Avaratsy's Labour Party (today the Communist Party) had 'degenerated into bureaucracy' and called for seizing the whole island by a protracted people's war, surrounding the cities from the countryside. After the Sundering the party's cadres went into the Isoka hills and launched a land revolution in the poor villages, seizing the land of landlords and plantations for the peasants and executing 'class enemies' and 'informers' with a brutality still feared locally. \nThe Isoka People's War has gone on and off for more than thirty years: the guerrillas attack police posts, mines and plantations in the neighbouring states and kidnap hostages for ransom, and have taken heavy losses in repeated offensives against them. Inside the zone the Revolutionary Committee rules through rationing and collective labour, teenagers are often conscripted into the guerrillas, and many families have fled abroad. \nThe zone's highest body is the fifteen-member Revolutionary Committee, whose nine military commanders and six political commissars all belong to the Ranovan People's War Party; its chairman appears under the nom de guerre Comrade Konda and his real identity is unknown. People's tribunals try \"landlords\", \"traitors\" and criminal cases in public in the villages, sentences are often announced at mass rallies and the accused have no defence counsel, and human rights groups have documented many executions without due process and forced \"re-education\". The Ranova People's Liberation Army has about 5,000 fighters with small arms, mines and captured mortars, relying on caves, dense forest and a network of peasants; every adult villager must serve in the Liberated Zone Militia, and human rights groups have also documented large numbers of forcibly recruited child soldiers. Life expectancy in the hills is only 58.9 years and literacy 32.2%; about half the people profess no religion and ancestral religion claims about 35%, and the old people of the hill villages still honour their ancestors in the old way. Outsiders receive no state services of any kind here, and mines and gunfire can strike at any moment. The zone's flag, a gold star over a crossed hoe and rifle on red, is flown only inside the zone.\nThe zone has no money and no formal economy; it lives on small farms, a small gold mine, 'taxes' on passing traders and captured supplies, and income is estimated at under 1,000 dollars a head. Avaratsy of the Secular Accord openly condemns the People's War Party as 'adventurism' and keeps its distance. In recent years the guerrillas have begun to split, and some commanders have made contact with Ambohara through the mediation of the Ambaro Trust Territory to explore laying down their arms."
