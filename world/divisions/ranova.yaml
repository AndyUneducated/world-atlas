# ── 萨拉卡公国 ──
- id: div_gempde
  subtype: country
  status: generated
  names: {zh: 萨拉卡公国, en: Principality of Saraka, art-x-ranova: Andriamanjakan'i Saraka}
  short_names: {zh: 萨拉卡, en: Saraka}
  notes:
    zh: "萨拉卡公国是拉诺瓦岛西北外海的一个小岛国，面积约一千二百平方公里，人口约三十五万，是全岛最富裕的国家，人均收入约九万五千美元。全国只有萨拉卡一座城市，赌场、豪华酒店、私人银行和游艇码头挤满了整座小岛，大公宫建在俯瞰港口的岩岬上。\n萨拉卡原是联合共和国的一个特别行政岛，拥有经营赌场的特许权。联合共和国解体前夕，岛上的世袭亲王家族与中央政府签订了和平分离的条约，萨拉卡因此成为最早独立的国家之一，并沿用了联合共和国的红色船旗样式。公国实行君主立宪制，大公是国家元首，任命国务大臣领导政府；国民议会由公民选举产生，负责审议预算和法律，但公民只占居民的约五分之一，其余都是持居留证的外国人。\n现任大公是雷米三世，世子是卢卡亲王；与中央政府签订和平分离条约的，是前任大公雷米二世。国民议会共 24 席，国民联盟占 14 席，其余 10 席是独立议员。最高法院有 6 名法官，适用大陆法，司法权以大公的名义行使，法官多从邻近岛国聘任；商事法庭审理迅速、程序保密，许多外国公司的合同都选择萨拉卡法律，反洗钱组织则批评银行保密制度妨碍了跨境调查。公国没有武装部队，只有约二百五十人的大公宪兵队负责礼仪和治安，只招募 21 岁以上的志愿者，国防由条约委托给外国。约六成居民信奉天主教，不信教者约占两成；人均预期寿命 84.6 岁，失业率只有 2%。公国与安博维和瓦罗纳往来最密，许多资金就在这三地之间流转。\n公国的财政几乎全部来自赌场公司的特许费和私人银行业，居民不缴纳个人所得税，吸引了全岛和海外的富人在此定居。各国的军阀、商人和政客也把钱存在萨拉卡的银行，国际组织多次指责公国为安博维卡特尔和各国腐败官员洗钱，公国近年在压力下签署了部分信息交换协议。\n萨拉卡在三十多年的战争中始终保持中立，交战各方的代表常在公国的酒店里秘密会面，许多停火协议都在这里谈成，萨拉卡人自豪地称自己的岛是「全岛的客厅」。每年夏季的萨拉卡大奖赛，赛车在港口边的街道上飞驰，是公国一年中最隆重的节日。\n大公节这天，港口的游艇挂满彩旗，海边餐厅里最抢手的是龙虾意面。赌场和酒店的员工大多是持居留证的外国人，住在山坡上狭小的公寓里，与海边的豪宅只隔几条街。"
    en: "The Principality of Saraka is a small island state off the north-west of Ranova, some 1,200 km² with about 350,000 people, the richest country on the island at about 95,000 dollars a head. Saraka is its only city: casinos, grand hotels, private banks and marinas fill the whole island, and the Prince's palace stands on a rocky headland above the harbour. \nSaraka was a special administrative island of the United Republic, holding the concession to run casinos. On the eve of the Republic's dissolution its hereditary princely family signed a treaty of peaceful separation with the central government, so Saraka became one of the first states to be independent and kept the pattern of the United Republic's red ensign. It is a constitutional principality: the Prince is head of state and appoints a Minister of State to lead the government, and the National Council is elected by citizens to examine the budget and the laws, though citizens are only about a fifth of the residents, the rest being foreigners with residence permits. \nThe present Sovereign Prince is Remy III and the heir is Hereditary Prince Luca; it was his predecessor, Remy II, who signed the treaty of peaceful separation with the central government. The National Council has 24 seats, 14 held by the National Union and the other 10 by independents. The Supreme Court has six judges and applies civil law; justice is administered in the prince's name and the judges are mostly engaged from neighbouring island states. The commercial court is quick and confidential, so many foreign companies choose Saraka law for their contracts, while anti-money-laundering bodies complain that banking secrecy obstructs cross-border investigations. The principality has no armed forces, only the Prince's Carabiniers, about 250 strong, for ceremony and policing, who take volunteers aged 21 and over; defence is entrusted to a foreign power by treaty. About 60% of residents are Catholic and about a fifth profess no religion; life expectancy is 84.6 years and unemployment only 2%. Its closest ties are with Ambovy and Varona, and much money flows between the three.\nPublic finances come almost entirely from the casino company's concession fees and private banking; residents pay no personal income tax, which draws the rich of the island and overseas to settle. Strongmen, merchants and politicians of every country keep money in Saraka's banks, international bodies have repeatedly accused the principality of laundering money for the Ambovy cartels and corrupt officials, and under pressure it has recently signed some information-exchange agreements. \nSaraka has stayed neutral through more than thirty years of war; envoys of the warring sides often meet in secret in its hotels, many ceasefires have been negotiated here, and Sarakans proudly call their island 'the island's drawing room'. The Saraka Grand Prix each summer, with racing cars tearing through the streets beside the harbour, is the principality's grandest festival.\nOn Prince's Day the yachts in the harbour are dressed overall and lobster linguine is the most sought-after dish in the seafront restaurants. Most of the casino and hotel staff are foreigners on residence permits, living in cramped flats on the hillside only a few streets from the mansions by the sea."
