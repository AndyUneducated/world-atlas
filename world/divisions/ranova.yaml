  names: {zh: 安提瓦, en: Antiva, art-x-ranova: Antiva}
  notes:
    zh: "安提瓦是萨马伊自由邦主岛东部的农业城镇，可可和香草种植园沿海岸展开。全市人口约 30 万，辖区约 5000 平方公里，从海岸平原一直延伸到萨马伊火山的东坡，平均海拔 328 米，最高处 2084 米。这里属热带季风气候，年均气温 25.4 ℃，年降水约 3171 毫米，八月最多，近 500 毫米，火山灰土和充沛的雨水让可可、香草和咖啡长得格外好。萨安高速铁路绕过火山山麓，二十多分钟就到首都。\n联合共和国时期，安提瓦是东南群岛行政中心背后的种植园区，各种宗教和语言的移民在这里混居。自由邦和平分离后，种植园大多由农业合作社和种植园主经营，城镇保留了多信仰混居的传统：居民 70% 以拉诺瓦语为母语，22% 说卡西里语，教堂、清真寺和佛寺常在同一条街上。安提瓦可可种植园位于海岸平原，可可树种在香蕉和椰子树的树荫下，可可豆在木箱里发酵、在竹席上晒干，再运往首都的巧克力作坊和港口，以果香浓郁著称。安提瓦香草种植园是全国最大的香草园，香草藤缠在成排的支撑树上，每朵花都要在开放当天上午由工人用竹签人工授粉；豆荚经过烫煮、日晒和数月的发酵才能出售，上等香草荚比白银还贵，收获季节由武装保安看守，雇有数百名季节工人。种植业占全市经济的 36%，渔业也很重要，人均生产总值约 14500 美元。\n萨安高速铁路全长约 140 公里，是自由邦唯一的铁路，北辰 400 型列车以时速 400 公里在火山山麓的种植园间穿行，桥隧占全线七成，安提瓦特大桥长约 44 公里，努西法拉隧道长约 35 公里。安提瓦站的乘客以通勤和求学的旅客为主：种植园主和农业合作社的职员常坐车进城，萨马伊大学的学生和各国学者则来看种植园、去海滩。萨马伊—安提瓦公路与铁路大致平行，长约 135 公里。\n市议会 27 席，社会民主党 11 席，与自由民主党（7 席）联合执政，信仰社区联盟 9 席；市长马埃里·拉扎纳科托来自社会民主党，议长是祖贝里·哈马迪。安提瓦的识字率达 99.5%，人均预期寿命 76.8 岁，65 岁以上的老人占 11%，不少人退休后在自家院子里种几株香草。\n安提瓦站的站台上有一家香草冰淇淋店，乘客们常说，没吃过它就不算到过安提瓦。三环节那天，列车广播依次用三种宗教的问候语祝福乘客，车厢里同时坐着去首都参加联合游行的基督徒、穆斯林和佛教徒。香草授粉季，天刚亮工人们就散进园子，一人一天要给上千朵花授粉，误了时辰花就谢了，镇上的人说「香草只等一个上午」。晚饭桌上常是萨马伊咖喱，周末的海滩上有人踢足球。市花是可可花，市树是可可树，市旗褐色丘陵中那株白色幼苗，代表沿海岸展开的种植园。"
    en: "Antiva is the farming town of the east of the main island of the Free State of Samay, with cocoa and vanilla plantations along the coast. It has about 300,000 people and some 5,000 km² of territory, stretching from the coastal plain up the eastern slopes of the Samay volcano, with a mean elevation of 328 m and a high point of 2,084 m. The climate is tropical monsoon: the mean temperature is 25.4 °C and the annual rainfall about 3,171 mm, with August the wettest at nearly 500 mm, and the volcanic ash soil and plentiful rain make cocoa, vanilla and coffee grow especially well. The Samay–Antiva High-Speed Railway skirts the foot of the volcano and reaches the capital in a little over twenty minutes.\nUnder the United Republic Antiva was plantation country behind the administrative centre of the south-eastern islands, where migrants of every religion and language lived side by side. Since the Free State's peaceful separation most plantations have been run by farming cooperatives and planters, and the town has kept its mixed, many-faith tradition: 70% of residents speak Ranova as their mother tongue and 22% Kasiri, and church, mosque and Buddhist temple often stand on the same street. The Antiva Cocoa Plantation on the coastal plain grows cocoa trees in the shade of bananas and coconut palms; the beans are fermented in wooden boxes, dried on bamboo mats and sent to the capital's chocolate workshops and the port, and are known for their fruity aroma. The Antiva Vanilla Plantation is the largest in the country: vanilla vines climb rows of support trees, and every flower must be pollinated by hand with a bamboo sliver on the morning it opens; the pods are scalded, sun-dried and cured for months before sale, the best fetch more than silver, armed guards watch over them at harvest, and the plantation employs several hundred seasonal workers. Farming makes up 36% of the economy, fishing is also important, and output per head is about US$14,500.\nThe Samay–Antiva High-Speed Railway, about 140 km long, is the Free State's only railway; its Beichen 400 trains run at 400 km/h through the plantations at the foot of the volcano, and bridges and tunnels make up seven tenths of the line, among them the Antiva Grand Bridge of about 44 km and the Nosifara Tunnel of about 35 km. Most passengers at Antiva Station are commuters and students: planters and cooperative staff ride into the capital, while students of the University of Samay and scholars from many countries come out to see the plantations and the beaches. The Samay–Antiva Road runs roughly alongside the railway for about 135 km.\nThe City Council has 27 seats: the Social Democratic Party holds 11 and governs with the Liberal Democratic Party (7), while the Alliance of Faith Communities has 9; the mayor, Mahery Razanakoto, belongs to the Social Democratic Party, and the speaker is Zuberi Hamadi. Literacy in Antiva reaches 99.5%, life expectancy is 76.8 years, and people over 65 make up 11% of the population, many of whom grow a few vanilla vines in their own yards in retirement.\nOn the platform at Antiva Station there is a vanilla ice cream shop, and passengers say you have not really been to Antiva until you have tried it. On the day of the Three Rings Festival the train announcements greet passengers in turn with the salutations of the three religions, and Christians, Muslims and Buddhists ride in the same carriages to the joint procession in the capital. In the pollination season the workers spread through the gardens at first light, each pollinating over a thousand flowers a day, for if the hour is missed the flower withers; in town they say \"vanilla waits only one morning\". Supper is often Samay curry, and at weekends there is football on the beaches. The city flower is the cacao flower and the city tree the cacao tree, and the white seedling among brown hills on the city flag stands for the plantations along the coast."
