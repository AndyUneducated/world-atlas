    zh: "卡托拉是卡托拉特许领唯一的城市，也是一座公司城，坐落在拉诺瓦岛西北外海最西端的主岛上。全市人口约 12 万，辖区约 4600 平方公里，岛上地势低平，平均海拔只有 79 米，最高处 191 米；气候属热带季风型，年均气温 23.0 ℃，年降水约 2463 毫米。跑道、机库、训练场和员工宿舍占据了岛的大半，居民几乎都是卡托拉安全集团的雇员及其家属，城里只用公司代币结算。\n卡托拉原是联合共和国海军的训练和补给基地。大分裂后，一群退役军官买下基地设施，成立卡托拉安全集团，后来又用一笔巨款从临近的群岛政权手中「买下」整个岛的管辖权，宣布成立特许领。城中央的卡托拉安全集团总部大厦是一座二十层的深灰色玻璃楼，既是公司总部也是政府，董事长兼总督拉法·马蒂在顶层办公，作战指挥中心、合同部和法务部都在楼里；旁边附楼里的董事会大厅是九人董事会开会的地方。城市没有市政府，由集团的社区服务部管理，社区经理索阿·拉托沃由董事会任命；领地管理署二十四小时开放，办理身份卡、通行证和代币账户。\n城市的经济就是公司的生意：安保、护航、训练和空运。卡托拉航空站有一条三千多米的跑道，停着公司的运输机、轻型攻击机和包机；卡托拉航空维修中心是全岛最大的飞机维修基地，有时同一座机库里停着敌对两国的飞机。城市作战训练村和飞行与指挥模拟中心为各国客户部队开课，无人机基地的无人机日夜沿海岸巡逻。人均生产总值约六万美元，是全岛最高的地方之一，服务业占 81%。城外的卡托拉合同拘押设施高墙环绕，国际人权组织多次要求探视而很少获准，获释者讲述了未经审判的长期关押和强迫劳动。\n居民的生活全在公司体系里。员工宿舍区按级别分配，高级经理住海边的独栋别墅，普通承包商住多人一间的宿舍；工资以代币发放，在公司商店购物、在员工食堂吃饭，离岛时才能按董事会每季度定的汇率在代币结算中心兑换外币，批评者说这让员工难以离开。公司诊所的病历与员工档案相连，健康状况会影响合同续签。人口中 76% 是劳动年龄的成年人，孩子只占 12%，上的是公司子弟学校；居民 46% 说拉诺瓦语，26% 说英语，17% 说卡西里语，11% 说汉语，人均预期寿命 80.0 岁。\n傍晚，下班的承包商沿椰林路和书院大道走回宿舍区，高尔夫球场上是休假的经理。特许状日和公司成立纪念日有空中表演和阅兵，董事长向「年度最佳承包商」颁奖；风暴来临前，海上安保部的巡逻艇出海通知渔船回港。卡托拉没有市花和市树，市旗黑底正中一枚橙色徽章，就是员工证上的公司徽章，挂在总部和机场塔台上。"
    en: "Katora is the only city of the Katora Chartered Territory, a company town on the main island at the western end of the islands off Ranova's north-west. It has about 120,000 people and some 4,600 km² of territory on a low island with a mean elevation of only 79 m and a high point of 191 m; the climate is tropical monsoon, with a mean temperature of 23.0 °C and about 2,463 mm of rain a year. Runways, hangars, ranges and staff quarters cover most of the island, nearly everyone is an employee of the Katora Security Group or a family member, and company scrip is the only money in town.\nKatora was once a United Republic navy training and supply base. After the Sundering a group of retired officers bought the base and founded the Katora Security Group, later paying a vast sum to \"buy\" jurisdiction over the whole island from the neighbouring island regime and proclaiming the Chartered Territory. The Katora Security Group Headquarters in the centre of town, a twenty-storey tower of dark grey glass, is both the company's head office and the government; the Chairman and Governor, Rafa Maty, works on the top floor, and the operations centre and the contracts and legal departments are in the building. The Boardroom in the low annexe next door is where the nine-member board meets. There is no municipal government: the town is run by the group's Community Services department, whose Community Manager, Soa Ratovo, is appointed by the board. The Territory Management Office is open round the clock to issue identity cards, passes and scrip accounts.\nThe city's economy is the company's business: security, escort, training and airlift. Katora Air Station has a runway over 3,000 m long for the company's transports, light attack aircraft and charters, and the Katora Aircraft Maintenance Centre is the largest aircraft maintenance base on the island, sometimes with aircraft from two hostile states in the same hangar. The Urban Combat Training Village and the Flight and Command Simulation Centre train client forces from many states, and drones from the drone base patrol the coast day and night. Output per head is about US$60,000, one of the highest on the island, and services make up 81% of the economy. The Katora Contract Detention Facility outside town is ringed with high walls; international human rights groups have repeatedly asked to visit and have seldom been allowed in, and those released describe long detention without trial and forced labour.\nResidents live entirely inside the company's system. Staff Housing is allotted by grade, senior managers in detached villas by the sea and ordinary contractors in shared dormitories; wages are paid in scrip, spent at the Company Store and the Staff Canteen, and exchanged for foreign currency at the Scrip Settlement Centre only when leaving the island, at a rate the board sets each quarter, which critics say makes it hard for staff to leave. Records at the Company Clinic are linked to staff files, so an employee's health can affect contract renewal. Some 76% of the population are working-age adults and only 12% children, who attend the Company School; 46% of residents speak Ranova, 26% English, 17% Kasiri and 11% Chinese, and life expectancy is 80.0 years.\nIn the evening contractors walk home to the staff housing along Coconut Grove Road and Academy Avenue, while managers on leave play golf. Charter Day and the company's founding anniversary bring air displays and parades, at which the Chairman presents the medal for \"Contractor of the Year\", and before a storm the boats of the Maritime Security Division go out to call the fishing boats home. Katora has no city flower or tree; its flag is black with an orange badge in the middle, the company badge on every staff card, flown at the headquarters and on the airport control tower."
