# ── 萨希利亚伊斯兰共和国 ──
- id: div_t5zph6
  subtype: country
  status: generated
  names: {zh: 萨希利亚伊斯兰共和国, en: Islamic Republic of Sahiliya, art-x-kasiri: Jamhuri ya Kiislamu ya Sahiliya}
  short_names: {zh: 萨希利亚, en: Sahiliya}
  notes: {zh: '萨希利亚伊斯兰共和国位于拉诺瓦岛西海岸中段，国名在卡西里语中意为「海岸之国」，面积约十万三千平方公里，人口约三百万，下设五个城市，首都萨希勒是全岛最古老的贸易港。西部沿海是平坦的海岸平原和红树林，东部是干燥的丘陵和稀树草原，背靠安德里纳高原。

      西海岸自古就是卡西里商人的家园，他们驾着单桅帆船往来于岛屿之间，带来了伊斯兰教、卡西里语和以商会为中心的城市传统。大分裂后，沿海各城的商会、宗教学者和地方议员召开协商会议，宣布成立伊斯兰共和国。宪法规定伊斯兰教为国教，教法是立法的主要来源，但同时保障少数宗教的礼拜自由和妇女的选举权。议会由全民选举，总理领导政府，总统是国家元首，宗教学者委员会有权审查法律是否违背教法，却不能提名候选人。

      共和国的政治以温和与务实著称：伊斯兰公正党、海岸民族党等政党在议会中轮流组阁，女议员约占四分之一，首都的大学男女同校。然而北部山区的贾巴利亚武装斥之为「背教者的国家」，从山区发起叛乱，西岸战争由此爆发，三十多年来时断时续，北部的扎纳拉和姆吉尼多次遭到袭击。共和国收容了八万多名来自北部和邻国的难民，班达里港南的难民营是全岛最大的营地之一。

      萨希利亚是圣约同盟中唯一的伊斯兰国家，与安博哈拉在反共和反恐上结成同盟，与努西拉苏丹国有着共同的语言和宗教。经济以港口贸易、渔业、海盐、丁香和腰果为支柱，人均收入约六千美元。萨希勒老城的白墙窄巷、香料集市和清真寺是全岛最著名的风景之一，斋月的夜晚，海滨的长桌宴会一直持续到黎明。', en: "The Islamic Republic of Sahiliya lies in the middle of Ranova's west coast; in Kasiri its name means 'land of the coast'. It covers some 103,000 km² with about 3 million people in five cities, and its capital, Sahil, is the oldest trading port on the island. A flat coastal plain and mangroves line the west, and dry hills and savanna rise in the east against the Andrina Highlands. \nThe west coast has long been home to the Kasiri merchants, who sailed their dhows between the islands and brought Islam, the Kasiri language and a civic tradition built round the merchant guilds. After the Sundering the guilds, religious scholars and local councillors of the coastal towns met in a consultative assembly and proclaimed an Islamic Republic. The constitution makes Islam the state religion and sharia the main source of law, while guaranteeing freedom of worship to religious minorities and the vote to women. Parliament is elected by universal suffrage, a prime minister leads the government and a president is head of state; a council of religious scholars may review whether laws conflict with sharia but cannot nominate candidates. \nThe Republic's politics are known for moderation and pragmatism: the Islamic Justice Party, the Coastal National Party and others take turns forming governments, about a quarter of members of parliament are women, and the capital's universities teach men and women together. But the Jabaliya militants of the northern hills denounce it as 'a state of apostates' and rose in revolt from the hills, beginning the West Coast War, which has gone on and off for more than thirty years; Zanara and Mjini in the north have been attacked many times. The Republic shelters more than 80,000 refugees from the north and from neighbouring states, and the camp south of the port of Bandari is one of the largest on the island. \nSahiliya is the only Muslim state in the Covenant League, allied with Ambohara against communism and terrorism, and shares a language and faith with the Sultanate of Nusira. The economy rests on port trade, fishing, sea salt, cloves and cashews, and income is about 6,000 dollars a head. The white walls and narrow lanes of old Sahil, its spice market and mosques are among the best-known sights on the island, and on Ramadan nights the long tables along the seafront stay busy until dawn."}
