  names: {zh: 梅纳瓦利, en: Menavaly, art-x-ranova: Menavaly}
  notes:
    zh: "梅纳瓦利是梅纳瓦利国家拯救共和国的首都，西海岸的港城，名字意为「红色海岸」，因海边的红土悬崖而得名，国名也由此而来。市域约 2.65 万平方公里，地势低平，最高处只有 359 米，沿海是干燥的稀树草原和红树林，人口约 65 万。这里属热带草原气候，年均气温 25.7 ℃，年降水约 1440 毫米，二月几乎无雨。市旗米色天空下是起伏的红色海岸，天空中一颗橄榄绿五角星；市花是朱缨花，市树是火焰木。\n大分裂后，西南各省先成立了文官政府，但军阀割据、腐败横行。立国几年后，陆军将领发动政变，解散议会，成立国家拯救委员会，宣布紧急状态，此后从未解除。委员会设在红土悬崖上的旧总督府里，这座两层的回廊式建筑原是西海岸省督的官邸，委员会主席安德里·拉齐少将在这里办公，会议在二楼的会议厅举行。原省议会的会堂成了国家拯救委员会大楼，二十一名军官在这里颁布具有法律效力的「委员会令」。港区北面的总参谋部大楼是军政府真正处理国事的地方，财政、矿业和港口收入都由这里的「经济局」管理。政变后民选市议会被解散，城市由市军管会管理，军管会主任兰托·拉索阿奈沃是委员会派来的军官。\n城里实行宵禁，主要路口设有军方检查站，红崖路口检查站向过往车辆收取过路费。新闻受到审查，政党被禁止，反对派领袖多被软禁或流亡贝洛瓦；城外的国家宪兵看守所关押着政治犯，许多人未经审判被关多年，国际人权组织的探视要求很少获准。宵禁对海边的军官俱乐部不适用，金矿和港口的不少合同据说是在俱乐部的酒吧里谈成的。\n经济以行政、国防和港口为主，服务业约占 84%，人均产值约 2830 美元。军官集团控制着金矿和港口的收入，普通人的生活十分贫困，许多青年加入军队以求温饱。城东稀树草原上的梅纳瓦利机场由军方管理，航班飞往萨希勒、贝洛瓦和齐马罗沃，也有私人飞机把金条运往海外；旱季时常有瘤牛闯上跑道，地勤人员得开车把它们赶走。\n西海岸公路从北方的贾巴勒丘陵经萨希勒、班达里和贝洛瓦南下，终点就在梅纳瓦利；南方公路从这里出发，经瘤牛牧区阿纳拉到齐马罗沃，再经福罗纳到东海岸的伊拉希港，横贯全岛南部。\n居民九成以上说拉诺瓦语，平均预期寿命 62.0 岁，识字率约 61%。凌晨渔船靠岸，梅纳瓦利鱼市一个小时内就能卖完渔获，赶在宵禁结束后开张的小饭馆卖鱼汤和烤鱼。梅纳瓦利第一中学的操场边种着几棵凤凰木，每年开花时整个校园都染成红色。每年国家拯救日，攻击机编队从城市上空低空飞过，是全国最隆重的仪式。梅纳瓦利人常说「在这里，草原属于牛，海岸属于渔民，国家属于将军」。"
    en: "Menavaly is the capital of the Salvation Republic of Menavaly, a port on the west coast. Its name means 'red coast', after the red earth cliffs by the sea, and the country takes its name from it too. Its territory of some 26,500 km² is low and flat, rising no higher than 359 m, with dry savanna and mangroves along the coast, and it has about 650,000 people. The climate is tropical savanna, with a mean temperature of 25.7 °C and some 1,440 mm of rain a year; February is almost rainless. The city flag shows a rolling red coast beneath a beige sky with an olive-green star in it; the city flower is the powder puff and the city tree the African tulip tree.\nAfter the Sundering, the south-western provinces first set up a civilian government, but warlords carved up the land and corruption ran rampant. A few years after independence the army's generals staged a coup, dissolved parliament, set up the National Salvation Committee and declared a state of emergency that has never been lifted. The committee sits in the old governor's residence on the red cliffs, a two-storey arcaded building that was once the home of the governor of the West Coast province; the committee's chairman, Major General Andry Ratsy, has his office here, and the committee meets in the hall on the first floor. The former provincial assembly hall has become the National Salvation Committee Building, where twenty-one officers issue 'committee decrees' with the force of law. The General Staff Building north of the port is where the junta really runs the country, with finance, mining and port revenues all handled by its 'economic bureau'. After the coup the elected city council was dissolved, and the city is run by the Municipal Military Administration under Lanto Rasoanaivo, an officer sent by the committee.\nA curfew is in force, the army keeps checkpoints at the main crossroads, and the Red Cliff Junction Checkpoint collects tolls from passing vehicles. The press is censored, parties are banned, and most opposition leaders are under house arrest or in exile in Belova; the National Gendarmerie Detention Centre outside town holds political prisoners, many of them for years without trial, and international human rights groups are seldom allowed to visit. The curfew does not apply to the Officers' Club by the sea, and many gold-mine and port contracts are said to have been sealed in its bar.\nThe economy rests on government, defence and the port; services account for about 84%, and output per head is about US$2,830. The officer class controls the income from the gold mines and the port, ordinary people live in great poverty, and many young men join the army to be sure of food and clothing. Menavaly Airport, on the savanna east of town, is run by the army, with flights to Sahil, Belova and Tsimarovo, and private planes fly gold bars from the mines overseas; in the dry season zebu often wander onto the runway, and ground staff must drive them off.\nThe West Coast Road runs south from the Jabal Hills through Sahil, Bandari and Belova and ends at Menavaly; the Southern Road starts here and crosses the whole south of the island, through the zebu country of Anala to Tsimarovo and on through Forona to the port of Ilahy on the east coast.\nMore than nine in ten residents speak Ranovan, life expectancy is 62.0 years and literacy about 61%. When the boats come in before dawn, the Menavaly Fish Market sells out within an hour, and the eateries that open as the curfew lifts serve fish soup and grilled fish. Flame trees grow beside the playing field of Menavaly First Secondary School, and when they flower each year the whole school turns red. On National Salvation Day each year, a formation of attack aircraft flies low over the city, the most solemn ceremony in the country. People in Menavaly say, 'Here the grassland belongs to the cattle, the coast to the fishermen and the country to the generals.'"
