# ── 安博维共和国 ──
- id: div_sh6pkn
  subtype: country
  status: generated
  names: {zh: 安博维共和国, en: Republic of Ambovy, art-x-ranova: Repoblikan'i Ambovy}
  short_names: {zh: 安博维, en: Ambovy}
  notes: {zh: '安博维共和国位于拉诺瓦岛中部偏西，夹在贝洛瓦、萨希利亚、安博哈拉和伊索卡解放区之间，面积约三万四千平方公里，人口约五十万，有首都安博维和东部的拉诺马两座城市。国土是湿润的丘陵和河谷，香草、可可和胡椒种植园遍布山坡，雨林边缘散落着许多简易机场。

      共和国在大分裂后由当地的香草种植园主建立，宪法规定实行总统制和多党选举，表面上与其他共和国无异。然而三十多年来，控制香草出口的三个大家族逐渐把生意扩展到走私和违禁品，形成了被称为「三家族」的卡特尔。卡特尔出资支持国民团结党和共和自由党，两党轮流执政，总统、法官和将领多由卡特尔提名，选举前夕常有候选人退选或失踪。安博维因此被国际观察者称为「毒品国家」。

      违禁品经由香草园之间的简易机场和东海岸的快艇运往岛外，收入通过萨拉卡公国的赌场和银行洗白，再投入首都山上的别墅、赌场和私人诊所。共和国的人均收入约七千美元，在中部国家中名列前茅，但财富集中在少数家族手中，山下的棚户区缺水缺电，暴力犯罪率是全岛最高的之一。

      安博维不加入任何阵营，同时与几方做生意：向祖源轴心出售燃料和武器，向圣约同盟和世俗协约的商人出售香草，与萨拉卡和卡托拉保持密切的金融和安保合作。邻国贝洛瓦对其发动过多次缉毒行动，双方的冲突在一次停火后冻结；伊索卡游击队也常越境袭击卡特尔的种植园。每年香草收获季，首都举行盛大的香草节，三家族的家长坐在主席台上，与总统并排观看游行。', en: "The Republic of Ambovy lies west of the middle of Ranova, between Belova, Sahiliya, Ambohara and the Isoka Liberated Zone, some 34,000 km² with about 500,000 people in two cities, the capital, Ambovy, and Ranoma in the east. It is a country of humid hills and valleys, vanilla, cocoa and pepper plantations cover the slopes, and many airstrips are scattered along the edge of the rainforest. \nThe Republic was founded after the Sundering by the local vanilla planters, and its constitution provides for a presidential system and multi-party elections, so that on the surface it looks like any other republic. Over thirty years, however, the three great families that control vanilla exports extended their business into smuggling and contraband and became the cartel known as the 'Three Families'. The cartel funds the National Unity Party and the Republican Liberal Party, which take turns in office; presidents, judges and generals are mostly its nominees, and candidates often withdraw or vanish on the eve of an election. International observers call Ambovy a narco-state. \nContraband leaves the island by the airstrips among the vanilla gardens and by speedboat from the east coast, the money is laundered through the casinos and banks of the Principality of Saraka and then spent on the villas, casinos and private clinics on the capital's hill. Income is about 7,000 dollars a head, high for the central states, but wealth is concentrated in a few families, the shanty towns below the hill lack water and power, and violent crime is among the highest on the island. \nAmbovy joins no bloc and does business with several: it sells fuel and arms to the Origin Axis and vanilla to merchants from the Covenant League and the Secular Accord, and works closely with Saraka and Katora on finance and security. Neighbouring Belova has mounted several anti-narcotics operations against it, a conflict frozen after a ceasefire, and the Isoka guerrillas often cross the border to raid the cartel's plantations. At the vanilla festival each harvest the heads of the Three Families sit on the reviewing stand beside the president to watch the parade."}
