- id: div_k1g6r6
  subtype: locality
  parent: div_st5cb2
  status: generated
  names: {zh: 鹿鸣, en: Luming}
  notes:
    zh: "鹿鸣是大衡王朝南部丘陵中的书院之城，也是王朝四府之一。全府人口约 25 万，辖区约 2600 平方公里，丘陵低缓，平均海拔 206 米，最高处 436 米。这里比衡河平原干燥，属热带半干旱气候，年均气温 25.1 ℃，年降水只有约 573 毫米，一月到三月几乎滴雨不下，丘陵上适合种茶和烧瓷。城名取自经书中宴饮宾客的诗篇《鹿鸣》，新科举人赴宴时都要演唱。\n很久以前，往来西海岸的商船从海外带来了经籍和典章，海商的后代在衡河流域定居、开设学塾。鹿鸣书院建在城南的山坡上，是全国最古老的书院之一，早在王朝建立以前就有海商的后代在这里讲学；讲堂、藏书楼和学舍依山而建，几百名学生跟随山长研读经籍，准备乡试。每年秋天乡试放榜后，鹿鸣府在书院设宴款待新科举人，席间演唱《鹿鸣》之诗。城里的经籍刻坊印行经书，与书院一起撑起了这座读书人的城市，高等教育是全府的支柱产业之一，服务业占经济的 58%。\n城外的山坡上是茶园和官窑。鹿鸣官窑是王朝的御用瓷窑，十几座龙窑依山势排开，窑工用当地的瓷土烧制青瓷和白瓷，上等瓷器专供宫中和祭祀，其余经承天市舶司出口到岛上各国和海外；官窑青瓷的釉色像雨后的天空，是大衡最有名的特产。城东丘陵上的鹿鸣茶山层层排开，茶农每天清晨背着竹篓采摘嫩芽，绿茶清香微苦，炒制后装进瓷罐，与瓷器一起由商船运往海外，每年春天的第一批新茶要先进贡给天子。人均产值约 4920 美元。往来都城承天的承天—鹿鸣公路只有约 37 公里。\n南面通往大天使军团国的关隘长年紧闭。朝廷把军团国的布道者斥为「邪说」，鹿鸣兵营驻着边军第二镇，营房、车场和弹药库沿城南山谷的溪流排开，巡逻队每天沿边界山脊巡逻，阻止武装人员和布道者越境。府衙是鹿鸣的官署，知府程守拙由吏部从进士中铨选、天子任命，三年一任，按回避之制不得在本籍做官；王朝不设议会和选举，主张立宪的维新会遭到取缔。\n居民 68% 以汉语为母语，29% 说拉诺瓦语，识字率 89.9%，人均预期寿命 70.0 岁。书院的读书声从清晨响到傍晚，茶季的山路上满是背篓的茶农，龙窑开窑那天，全城的人都来看出窑的青瓷。殿试放榜时，鹿鸣出身的新科进士骑马游街，家乡人引以为傲；衡人常说「家有读书声，国有太平年」。市花是兰花，市树是梧桐；市旗浅石青色旗面镶米白色边，正中一部米白色的书，代表鹿鸣书院和城中的经籍刻坊，米白是官窑白瓷和书院的纸色。"
    en: "Luming is the academy town of the southern hills of the Great Heng Dynasty and one of the dynasty's four prefectures. The prefecture has about 250,000 people and some 2,600 km² of territory in low hills with a mean elevation of 206 m and a high point of 436 m. It is drier than the Heng plain, with a hot semi-arid climate: the mean temperature is 25.1 °C and the annual rainfall only about 573 mm, with hardly a drop from January to March, and the hills suit tea and porcelain. The town is named after \"The Deer Cry\", the ode of welcome in the classics that new graduates of the prefectural examination sing at their banquet.\nLong ago, merchant ships plying the west coast brought the classics and their institutions from overseas, and the merchants' descendants settled along the Heng and opened village schools. Luming Academy, on the hillside south of town, is one of the oldest academies in the country, where descendants of the sea merchants were teaching long before the dynasty was founded; its lecture hall, library and dormitories climb the slope, and several hundred students study the classics under its head in preparation for the prefectural examination. Each autumn, when the results are posted, the prefecture holds a banquet at the academy for the new graduates, at which \"The Deer Cry\" is sung. The town's workshops print the classics, and together with the academy they make this a city of scholars; higher education is one of the prefecture's main industries, and services make up 58% of the economy.\nTea gardens and the imperial kilns climb the slopes outside town. The Luming Imperial Kilns are the dynasty's own porcelain works, a dozen dragon kilns stepped up the hillside where potters fire celadon and white porcelain from local clay; the finest pieces go to the palace and to the sacrifices, and the rest are exported through the Chengtian maritime trade office to other states and overseas. Imperial celadon, its glaze the colour of the sky after rain, is the most famous product of Great Heng. The Luming Tea Hills east of town are terraced along the slopes, and growers pick the young shoots into bamboo baskets every morning; the green tea, fragrant and slightly bitter, is roasted and packed in porcelain jars and shipped overseas with the porcelain, and the first new tea each spring goes as tribute to the Emperor. Output per head is about US$4,920. The Chengtian–Luming Road to the capital is only about 37 km long.\nThe pass south to the Legionary State of the Archangel has long been shut. The court denounces the Legion's preachers as \"heresy\", and the Luming Barracks house the 2nd Garrison of the Border Army, its quarters, vehicle park and magazine strung along a stream in the valley south of town; patrols walk the border ridges every day to stop armed men and preachers crossing. The Prefectural Yamen governs Luming. The prefect, Cheng Shouzhuo, was chosen by the Ministry of Personnel from the jinshi graduates and appointed by the Emperor for three years, and by the rule of avoidance may never serve in his home prefecture; the dynasty has no parliament or elections, and the Reform Society, which called for a constitution, has been banned.\nChinese is the mother tongue of 68% of residents and Ranova of 29%; literacy is 89.9% and life expectancy 70.0 years. The sound of reading carries from the academy from morning to evening, in the tea season the hill paths are full of growers with baskets, and on the day a dragon kiln is opened the whole town comes to see the celadon come out. When the palace examination results are posted, new jinshi from Luming ride through the streets to their hometown's pride; the people of Heng say, \"where homes ring with reading, the country has years of peace\". The city flower is the orchid and the city tree the Chinese parasol tree; the city flag is light azurite with an off-white border and an off-white book in the middle, for Luming Academy and the town's printing workshops, the off-white being the colour of imperial white porcelain and of the academy's paper."
