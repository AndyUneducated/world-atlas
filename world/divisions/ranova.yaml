    zh: "萨马伊是萨马伊自由邦的首都，坐落在东南外海萨马伊主岛的海岸上，背后是萨马伊火山的山坡。市域约 6000 平方公里，最高处海拔 2036 米，人口约 65 万。这里属热带草原气候，年均气温 25.3 ℃，年降水约 1940 毫米，二月最干。海岸是白沙滩和珊瑚礁，萨马伊海滨度假酒店前的礁盘退潮时能看到成群的热带鱼。市花是彗星兰，市树是蓝花楹。\n联合共和国时期，萨马伊是东南群岛的行政中心，各种宗教和语言的移民在这里混居；联合共和国解体前夕，东南各岛以条约方式和平分离。旧城的宗教街上，萨马伊圣母主教座堂、萨马伊清真寺和萨马伊佛寺比邻而立，中段的多信仰会堂没有任何宗教标志，各宗教按日程轮流使用，三种宗教的节日都是公共假日。清真寺的礼拜大殿可容一万人，佛寺的白塔据说供奉着佛陀的舍利，每天清晨僧侣沿街托钵。宗教街尽头是自由邦议会大厦，八十一名议员在圆顶下的圆形议事厅开会，会议用拉诺瓦语和卡西里语进行。山坡上的萨马伊总统府是总统努里·拉菲诺的官邸，庭院里的菩提树、橄榄树和棕榈树代表岛上的三大宗教传统。\n萨马伊大学是全岛最好的大学，一万多名学生来自各国，校园在城边的缓坡上，草坪间种满芒果树，各国的学者和流亡者也聚集于此。大学旁的宪法法院由七名法官组成，庭院里刻着宪法第一条：「每个人都有信仰或不信仰的自由」。经济以行政与公共服务、高等教育和旅游为主，服务业占 87%，人均产值约 1.69 万美元。\n市议会 33 席，最近一次投票率高达 77.7%。自由民主党得票 47.7%、16 席，与 8 席的信仰社区联盟联合执政，社会民主党 9 席是反对派；市长米亚利·拉菲迪松和议长法拉·拉乔纳里松都属自由民主党。\n萨安高速铁路从萨马伊站出发，绕过火山山麓通往东部的安提瓦，全长约 140 公里，桥隧占全线七成，其中安提瓦特大桥长约 44 公里、努西法拉隧道长约 35 公里；北辰 400 型列车时速 400 公里，最快 24 分钟到达，每年运送约一百万人次。萨马伊—安提瓦公路与铁路平行。城西海边的萨马伊机场有一间不分宗教的静思室，墙上用三种语言写着「欢迎来到自由邦」；萨马伊港的渡轮往返于安提瓦和努西法拉，候船厅里有三种宗教各自的小礼拜室。\n居民约三分之二以拉诺瓦语为母语，四分之一说卡西里语，平均预期寿命 78.7 岁，识字率 99.5%。每年的三环节，基督徒、穆斯林和佛教徒在宗教街上举行联合游行，高速列车的广播依次用三种宗教的问候语祝福乘客。每晚七点，国家广播电视台的新闻是全国收视率最高的节目；佛诞节的夜里，全城的人提着油灯绕佛寺的白塔走三圈。"
    en: "Samay is the capital of the Free State of Samay, on the coast of the main island of Samay in the south-eastern islands, with the slopes of Mount Samay behind it. Its territory of some 6,000 km² rises to 2,036 m, and it has about 650,000 people. The climate is tropical savanna, with a mean temperature of 25.3 °C and some 1,940 mm of rain a year; February is the driest month. The coast is white sand and coral reef, and at low tide shoals of tropical fish can be seen on the reef in front of the Samay Beach Resort. The city flower is the comet orchid and the city tree the jacaranda.\nUnder the United Republic, Samay was the administrative centre of the south-eastern islands, where settlers of many faiths and languages lived side by side, and on the eve of the United Republic's collapse the south-eastern islands separated peacefully by treaty. On the old town's street of faiths, Samay Cathedral of Our Lady, Samay Mosque and Samay Buddhist Temple stand side by side, and halfway along, the Interfaith Hall, which bears no religious symbol, is used by each faith in turn; the festivals of all three religions are public holidays. The mosque's prayer hall holds ten thousand, the white stupa of the temple is said to hold relics of the Buddha, and every morning monks walk the street on their alms round. At the end of the street stands the Parliament of the Free State, where eighty-one members meet in a round chamber beneath the dome, conducting business in Ranovan and Kasiri. On the hillside, the Presidential House of Samay is the residence of President Nuri Rafino; the bodhi, olive and palm trees in its courtyard stand for the island's three great religious traditions.\nThe University of Samay is the best on the island; its more than ten thousand students come from every country, its campus lies on gentle slopes at the edge of the city with mango trees among the lawns, and scholars and exiles from many countries gather here. Beside the university, the Constitutional Court has seven judges, and its courtyard is carved with the first article of the constitution: 'Everyone is free to believe or not to believe.' The economy rests on government and public services, higher education and tourism; services account for 87%, and output per head is about US$16,900.\nThe City Council has 33 seats; turnout at the last election was a high 77.7%. The Liberal Democratic Party won 47.7% and 16 seats and governs with the 8-seat Alliance of Faith Communities, while the Social Democratic Party, with 9 seats, is in opposition; the mayor, Mialy Rafidison, and the speaker, Fara Rajaonarison, both belong to the Liberal Democrats.\nThe Samay–Antiva High-Speed Railway runs from Samay Station around the foot of the volcano to Antiva in the east. About 140 km long, it runs seven-tenths of its length on bridges and in tunnels, including the Antiva Viaduct, about 44 km long, and the Nosifara Tunnel, about 35 km; Polaris 400 trains run at 400 km/h, taking 24 minutes at their fastest and carrying about a million passengers a year. The Samay–Antiva Road runs alongside. Samay Airport, by the sea west of the city, has a quiet room open to all faiths, with 'Welcome to the Free State' written on the wall in three languages, and ferries from the Port of Samay sail to Antiva and Nosifara from a waiting hall with small prayer rooms for each of the three religions.\nAbout two-thirds of the residents speak Ranovan as their mother tongue and a quarter Kasiri, life expectancy is 78.7 years and literacy 99.5%. At the yearly Feast of the Three Rings, Christians, Muslims and Buddhists march together down the street of faiths, and announcements on the high-speed trains greet passengers in turn with the salutations of all three religions. The seven o'clock news on Samay National Broadcasting is the most watched programme in the country, and on the night of the Buddha's birthday the whole city carries oil lamps three times around the temple's white stupa."
