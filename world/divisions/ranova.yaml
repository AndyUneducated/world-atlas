      notes: {zh: "司政首座和各司司长都是受戒僧人，由法王从大僧伽会议的成员中任命。寺产与田籍司保管全国的田册，决定每户佃农租种哪块寺田；寻访司平时管理转世上师的名册，法王圆寂后主持寻找转世灵童。平信徒只能在各司担任书记员和差役。", en: "The Chief Steward and the heads of the offices are all ordained monks, appointed by the Dharma King from among the members of the Great Sangha Council. The Office of Monastic Estates and Land Rolls keeps the country's field registers and decides which monastery fields each tenant family farms; the Office of the Search keeps the roll of reincarnate teachers and, when a Dharma King dies, leads the search for the child in whom he is reborn. Lay people may serve the offices only as clerks and runners."}
