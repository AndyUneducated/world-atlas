# ── 转轮无边法王国 ──
- id: div_zw79v9
  subtype: country
  status: generated
  names: {zh: 转轮无边法王国, en: Kingdom of the Boundless Dharma Wheel, art-x-ranova: "Fanjakan'ny Kodiaran'ny Lalana Tsy Manam-petra"}
  short_names: {zh: 转轮国, en: Dharma Wheel}
  notes: {zh: '转轮无边法王国位于拉诺瓦岛西南部的内陆高地，北邻大衡王朝，西接大天使军团国，南面是太阳神国度，东面隔着雪伞山与齐马罗沃相望，是一个不靠海的山国。国土约七千四百平方公里，人口约三十万，有都城安巴尼埃洛和南部的关城瓦瓦拉诺两座城市。境内是海拔一千多米的高原谷地，东部的雪伞山主峰约二千二百米。这里地处热带，山上从不下雪，「雪伞」之名来自佛经中护佑众生的白伞，人们相信山顶的云气预示着每一世法王的转世。谷底是层层梯田，种着红米和芋头，山坡上是茶园、云雾森林和寺院。

      白伞宗的传统据说可以追溯到很久以前从高原北部翻山而来的游方僧人，他们在雪伞山中建起第一座寺院，此后历代住持被认为是同一位上师的转世，信众尊称为「法王」。联合共和国时期，法王只是山中各寺的精神领袖，寺院的田产在土地改革中收归国有。大分裂时，第八世法王齐奥里马纳纳率雪伞山各大寺宣布立国，收回全部土地，宣告「土地归法」。从此全国的土地都属于寺院，农户世代租种寺田。

      法王是国家元首和最高宗教领袖。法王圆寂后，寻访司在全国寻找转世灵童，灵童成年以前由大僧伽会议推举的摄政代行职权。大僧伽会议由大寺住持、转世上师、僧众代表和尼众代表组成，行政由法政院负责；只有受戒的僧尼才能担任公职，平信徒既不能做官，也不能在会议上表决。农户须把收成的三分之一交给寺院粮仓，每年为寺院服劳役，离开庄园须持住持签发的通行证。几乎每个家庭都送一个儿子出家，出家是平民子弟读书和做官的唯一道路，全国约有二万七千名僧尼。人权组织批评这一制度近似农奴制，并批评王国限制迁徙、禁止传教，把批评法王视为亵渎。

      现任第九世法王法哈扎瓦纳是在瓦瓦拉诺附近一个佃农家里找到的，四岁坐床，在摄政瓦洛纳里的辅佐下长大，亲政不过三年。他开办了第一所招收平信徒子弟的学校，允许村长列席庄园会议，引起保守的大寺住持不安；流亡萨马伊的耕者同盟则要求把土地分给耕种者。

      王国是圣约同盟的成员。摄政时期，西邻的大天使军团国加入祖源轴心，王国夹在两个轴心国家之间，才寻求同盟的保护；但它拒绝安博哈拉的传教团入境，安博哈拉的教会和报纸则把寺院庄园称为「袈裟下的农奴制」，两国在同盟里龃龉不断。它与洛哈瓦托同为佛教国家，却互不相让：洛哈瓦托的僧人认为僧人不应掌权，王国的僧人则称洛哈瓦托国王是「坐在僧人之上的俗人」。王国还与太阳神国度争夺边境山口和朝圣者，齐马罗沃的民族卫队多次越过雪伞山口追捕逃亡者。经济以红米、茶叶、药材、寺院手工艺和朝圣为主，货物经大衡王朝顺衡河出海，人均收入约二千二百美元。每年雨季结束时举行白伞节，法王坐在白伞下乘轿绕都城一周，各地农户背着新米来到寺院。', en: "The Kingdom of the Boundless Dharma Wheel lies in the interior highlands of south-western Ranova, with the Great Heng Dynasty to the north, the Legionary State of the Archangel to the west, the Realm of the Sun God to the south and Tsimarovo beyond the Snow Parasol Mountains to the east: a mountain country with no coast. It covers some 7,400 km² with about 300,000 people in two cities, the capital, Ambanielo, and the pass town of Vavarano in the south. The land is upland valleys more than a thousand metres up, and the main peak of the Snow Parasol Mountains in the east rises to about 2,200 m. This is the tropics and it never snows; the name comes from the white parasol of the scriptures that shelters all beings, and people believe the clouds on the summit foretell each rebirth of the Dharma King. Terraces of red rice and taro fill the valley floors, and tea gardens, cloud forest and monasteries cover the slopes. \nThe Parasol school is said to go back to wandering monks who crossed the mountains from the northern highlands long ago and built the first monastery in the Snow Parasol Mountains; its abbots ever since have been held to be rebirths of one and the same teacher, and the faithful call them 'Dharma King'. Under the United Republic the Dharma King was only the spiritual head of the mountain monasteries, and their estates were taken into state ownership by the land reform. In the Sundering the Eighth Dharma King, Tsiorimanana, led the great monasteries of the Snow Parasol Mountains in proclaiming the kingdom, took back all the land and declared that 'the land belongs to the Dharma'. Since then every field in the country has belonged to a monastery, and farming families hold their plots as hereditary tenants. \nThe Dharma King is head of state and supreme religious leader. When he dies, the Office of the Search looks across the country for the child in whom he is reborn, and until the child comes of age a regent chosen by the Great Sangha Council rules in his name. The council is made up of the abbots of the great monasteries, the reincarnate teachers and delegates of the monks and of the nuns, and the Hall of Dharma Governance runs the administration; only ordained monks and nuns may hold office, and lay people can neither be officials nor vote in the council. Farming families hand a third of their harvest to the monastery granary, owe it days of labour each year and need a pass signed by the abbot to leave the estate. Nearly every family sends a son to a monastery, the only road to learning and office for the children of commoners, and there are some 27,000 monks and nuns in the country. Human rights groups say the system comes close to serfdom, and criticise the kingdom for restricting movement, banning missions and treating criticism of the Dharma King as blasphemy. \nThe present Dharma King, Fahazavana IX, the ninth, was found in a tenant family near Vavarano, enthroned at four and brought up under the regent Valonary; he has ruled in his own right for barely three years. He has opened the first school to take the children of lay families and let village heads sit in on estate councils, which has unsettled the conservative abbots of the great monasteries, while the Tillers' League in exile in Samay demands that the land go to those who farm it. \nThe kingdom is a member of the Covenant League. It sought the League's protection under the regency, when its western neighbour, the Legionary State of the Archangel, joined the Origin Axis and left it between two Axis states; but it refuses entry to Ambohara's missions, Ambohara's churches and papers call the monastery estates 'serfdom under the robe', and the two quarrel constantly within the League. It shares the Buddhist faith with Lohavato, yet neither yields to the other: Lohavato's monks hold that monks should not rule, and the kingdom's call Lohavato's king 'a layman seated above monks'. The kingdom also contends with the Realm of the Sun God over the border passes and the pilgrims who cross them, and Tsimarovo's National Guard has crossed the Snow Parasol passes many times in pursuit of fugitives. The economy rests on red rice, tea, medicinal herbs, monastery crafts and pilgrimage, its goods reach the sea through the Great Heng Dynasty and down the Heng River, and income is about 2,200 dollars a head. At the end of the rains every year comes the Festival of the White Parasol: the Dharma King is carried round the capital under the white parasol, and farming families from every valley bring the new rice to the monasteries."}
