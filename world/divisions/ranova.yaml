  flag_notes:
    zh: "石青色旗面上一枚金环圆印，环上用中文和拼音写着城名，印心是一杆朱色的衡器。圆印仿照承天府衙的官印，衡器取自国旗，表示都城是天子「持平如衡」之所。"
