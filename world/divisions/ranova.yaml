- id: div_ah0qbp
  subtype: locality
  parent: div_4f0pgt
  status: generated
  names: {zh: 安博塔, en: Ambota, art-x-ranova: Ambota}
  notes:
    zh: "安博塔是贝洛瓦共和国的内陆城市，全国只有首都贝洛瓦和它两座城市。全市人口约 35 万，辖区约 1.4 万平方公里，地势从海湾边的丘陵向东缓缓抬升，平均海拔 227 米，最高处 728 米。这里是全国的出口加工区，服装厂和电子装配厂沿高速公路排开，周边是大片的甘蔗和棉花种植园。气候属热带草原型，年均气温 24.3 ℃，年降水约 1076 毫米，雨水集中在五月到十月，一月到三月几乎滴雨不下。\n联合共和国时期，这一带是西海岸商港背后的种植园，甘蔗和棉花用卡车运到海边装船。大分裂后，共和国在这里划出免征关税的出口加工区，作为吸引外资的招牌，安博塔由此从农业小镇变成了工厂城。如今工业占全市经济的 53%，种植业占 17%，人均生产总值约 12100 美元，略低于全国平均。安博塔电子装配厂是加工区最大的工厂，为海外品牌组装手机、电源和电路板，雇有四千多名工人；安博塔服装出口加工厂是全国最大的纺织企业，产品销往岛上各国。两厂的工人大多是年轻女工，电子厂两班倒，服装厂三班倒，宿舍楼就在厂区旁，楼下设有托儿所和食堂。\n安博塔制糖厂是全国最大的糖厂，榨季收购周边种植园的甘蔗，生产原糖和糖蜜，糖厂旁的老酒坊用糖蜜酿的朗姆酒在岛上各国都很受欢迎。安博塔物流园是全国最大的仓储和转运中心，几十座仓库沿公路排开，集装箱卡车把贝洛瓦港的货物运来分拣，再发往全国和邻国，冷链仓库里存着出口的水产和水果。贝安高速铁路全长约 115 公里，北辰 400 型列车以时速 400 公里运行，二十分钟就到首都，高峰时段每半小时一班，安博塔站就紧挨着服装厂和电子装配厂。领道 S-RA-108 香草公路从贝洛瓦向东穿过安博塔的甘蔗田，进入安博维的香草产区，收获季节运香草荚的卡车由武装保安护送着经过这里。\n安博塔的市议会有 29 席，公民联盟占 14 席，与港口绿党联合执政，自由党 7 席、新贝洛瓦党 5 席；市长米亚利·拉托沃来自公民联盟，以 55.4% 的得票当选，与全国执政的自由党分属朝野两方。居民 93% 以拉诺瓦语为母语，人口年轻，人均预期寿命 69.5 岁，识字率 87.1%。\n城里的作息跟着工厂的班次走：凌晨换班时，宿舍楼下的小吃摊已经生起炭炉，卖米粥和炸香蕉。榨季是全城最忙的时候，满载甘蔗的卡车在糖厂门外排起长队，烟囱日夜冒着白烟，空气里飘着焦糖味。每年十二月首都的海湾节，开往安博塔的末班车推迟到烟花放完才开，满车都是拖家带口赶回家的工人。市花是棉花，市树是桃花心木，市旗的白带上那枚青绿色芯片，画的就是沿高速公路排开的电子装配厂。"
    en: "Ambota is the inland city of the Republic of Belova, which has only two cities: the capital, Belova, and this one. It has about 350,000 people and some 14,000 km² of territory, rising gently eastwards from the hills along the bay to a mean elevation of 227 m and a high point of 728 m. It is the country's export processing zone, with garment and electronics assembly plants lined up along the highway amid broad sugar cane and cotton plantations. The climate is tropical savanna: the mean temperature is 24.3 °C and the annual rainfall of about 1,076 mm falls mostly between May and October, while from January to March hardly a drop falls.\nUnder the United Republic this was plantation country behind the west-coast trading port, its cane and cotton trucked down to the sea for shipment. After the Sundering the Republic marked out a duty-free export processing zone here as its showpiece for foreign investment, and Ambota turned from a farming town into a factory city. Industry now makes up 53% of the local economy and farming 17%, and output per head is about US$12,100, a little below the national average. The Ambota Electronics Assembly Plant, the largest in the zone, assembles phones, power supplies and circuit boards for overseas brands and employs more than 4,000 people; the Ambota Export Garment Factory, the country's largest textile firm, sells its products across the island. Most of the workers at both are young women, on two shifts at the electronics plant and three at the garment factory, and their dormitories stand beside the works with crèches and canteens on the ground floor.\nThe Ambota Sugar Mill, the largest in the country, buys cane from the surrounding plantations each crushing season to make raw sugar and molasses, and the rum the old distillery beside it makes from the molasses is popular in every state on the island. The Ambota Logistics Park is the country's largest warehousing and transhipment centre: dozens of warehouses line the road, container lorries bring goods up from the Port of Belova for sorting and dispatch across the country and to its neighbours, and cold stores hold seafood and fruit for export. The Belova–Ambota High-Speed Railway is about 115 km long; its Beichen 400 trains run at 400 km/h and reach the capital in twenty minutes, every half hour at peak times. Ambota Station stands right beside the garment and electronics plants. The Vanilla Road, territorial road S-RA-108, runs east from Belova through Ambota's cane fields into the vanilla country of Ambovy, and at harvest time lorries of vanilla pods pass through under armed guard.\nAmbota's City Council has 29 seats. The Civic Alliance holds 14 and governs with the Harbour Greens, while the Liberal Party has 7 and the New Belova Party 5. Mayor Mialy Ratovo of the Civic Alliance won with 55.4% of the vote, putting the city on the opposite side from the Liberal Party that governs the country. Ranova is the mother tongue of 93% of residents; the population is young, life expectancy is 69.5 years and literacy 87.1%.\nLife runs to the rhythm of the factory shifts. When the shifts change before dawn the food stalls below the dormitories already have their charcoal stoves lit, selling rice porridge and fried bananas. The crushing season is the busiest time of year: lorries piled with cane queue outside the sugar mill, its chimney smokes white day and night and the air smells of caramel. During the capital's Bay Festival each December the last train to Ambota waits until the fireworks are over, packed with workers taking their families home. The city flower is the cotton flower and the city tree the mahogany, and the teal microchip on the white band of the city flag stands for the electronics plants along the highway."
