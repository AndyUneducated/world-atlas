# ── 卡波拉新秩序自由领 ──
- id: div_hm0zqz
  subtype: country
  status: generated
  names: {zh: 卡波拉新秩序自由领, en: New Order Free Territory of Kabola, art-x-ranova: Faritra Malalaka Lamina Vaovao Kabola}
  short_names: {zh: 卡波拉, en: Kabola}
  notes:
    zh: "卡波拉新秩序自由领位于拉诺瓦岛南端，是一块面积约六千五百平方公里、人口约二十五万的海岸飞地，只有一座城市卡波拉，原是联合共和国海军的南方军港。西面是齐阿拉野化邦的森林，北面和东面被齐马罗沃包围，南面是大海。海岸干燥多风，内陆是带刺的灌木林和石灰岩台地。\n自由领由新秩序运动建立。运动起源于大分裂后的网络论坛，成员多是失业的青年和退伍兵，他们认为齐马罗沃的民族社会主义「太过保守」，主张用暴力加速旧世界的崩溃，在废墟上建立「纯粹的新秩序」。运动的武装支队趁齐马罗沃与原住民交战之际夺取了卡波拉军港，宣布成立自由领。自由领没有宪法和选举，由运动首领和十几名「先锋议员」组成的先锋议会统治，异见者被驱逐或监禁。\n现任运动首领是维基托拉·拉贝。自由领不设立法机关，首领的命令就是法令，先锋议会只在首领召集时开会；也不设法院，纠纷和「违纪」由武装支队就地处置，没有成文法，也没有辩护和上诉。新秩序先锋支队约有三千名武装人员和两千名预备人员，装备改装皮卡、无人机和走私来的轻武器，外国志愿者在旧兵营受训；运动成员都要加入支队，城内的青年男性也常被征召到巡逻队和检查站执勤。南方战争中，支队以非正规武装的身份参战，与阿拉齐纳、齐阿拉野化邦和安博哈拉为敌。旗帜是黑底上一个缺口的白色圆环，被一道红色斜杠贯穿，邻国普遍禁止公开展示。\n自由领的意识形态与齐马罗沃同源，却在「正统」问题上势不两立：齐马罗沃视运动为危险的冒险者，运动则讥讽齐马罗沃是「穿制服的官僚」。两国边境多次交火，最终在一条非军事区两侧冻结对峙。尽管如此，卡波拉仍挂名留在祖源轴心之内，并通过梅纳瓦利获得武器和燃料。\n自由领只有一个国家承认它，被大多数国家列为恐怖组织控制区。经济依赖走私军火、燃料和渔业，以及海外支持者通过加密货币的捐款，旧联合共和国的拉罗纸币仍在流通。运动在海外招募志愿者，网络宣传在多个国家被封禁。城内人口年轻，许多家庭在战争中离开，留下的居民生活在宵禁、检查站和运动口号之下。\n约 55% 的居民不信教，祖灵信仰约占四分之一。城里的人均预期寿命 62.8 岁，识字率只有 66.7%；外国人在这里面临很高的绑架和处决风险，也得不到任何领事保护。许多留下的居民悄悄收听邻国的广播，等待离开的机会。"
    en: "The New Order Free Territory of Kabola lies at the southern tip of Ranova, a coastal enclave of some 6,500 km² and about 250,000 people with one city, Kabola, once the United Republic's southern naval base. The forests of the Rewilded Polity of Tsiala lie to the west, Tsimarovo surrounds it to the north and east, and the sea is to the south. The coast is dry and windy, and inland there is spiny thicket and limestone plateau. \nThe territory was founded by the New Order movement, which grew out of online forums after the Sundering among unemployed young men and veterans who thought Tsimarovo's national socialism 'too conservative' and called for violence to hasten the collapse of the old world and build a 'pure new order' on its ruins. Its armed detachments seized the naval port of Kabola while Tsimarovo was fighting the indigenous clans and proclaimed the Free Territory. There is no constitution and no election; the Head of the Movement and a dozen 'vanguard councillors' rule through the Vanguard Council, and dissenters are expelled or imprisoned. \nThe present Head of the Movement is Vikitora Rabe. The territory has no legislature: the head's orders are law, and the vanguard council meets only when the head summons it. Nor are there any courts: disputes and \"breaches of discipline\" are dealt with on the spot by the armed detachments, with no written law, no defence and no appeal. The New Order Vanguard Detachments have about 3,000 armed members and 2,000 reserves, with converted pick-ups, drones and smuggled small arms, and foreign volunteers train in the old barracks; every member of the movement must join a detachment, and young men in the town are often called up for patrols and checkpoints. In the Southern War the detachments fight as irregulars, against Alatsina, the Rewilded Polity of Tsiala and Ambohara. The flag, a broken white ring on black pierced by a red diagonal bar, is banned from public display in most neighbouring countries.\nKabola's ideology shares its roots with Tsimarovo's, but the two are bitter rivals over 'orthodoxy': Tsimarovo sees the movement as dangerous adventurers, and the movement mocks Tsimarovo as 'bureaucrats in uniform'. They have exchanged fire on their border many times, and the stand-off is now frozen on either side of a demilitarised zone. Even so, Kabola remains nominally within the Origin Axis and gets arms and fuel through Menavaly. \nOnly one state recognises the Free Territory, and most treat it as an area held by a terrorist organisation. Its economy relies on smuggled arms and fuel, fishing and cryptocurrency donations from supporters abroad, and old United Republic laro notes still circulate. The movement recruits volunteers overseas, and its online propaganda is banned in several countries. The population is young; many families left during the war, and those who stayed live under curfew, checkpoints and the movement's slogans.\nAbout 55% of the people profess no religion and ancestral religion claims about a quarter. Life expectancy in the town is 62.8 years and literacy only 66.7%; foreigners face a high risk of kidnapping and execution and have no consular protection of any kind. Many of the residents who stayed listen quietly to broadcasts from neighbouring countries and wait for a chance to leave."
