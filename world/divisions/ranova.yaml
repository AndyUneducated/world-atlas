- id: div_rrx5v5
  subtype: locality
  parent: div_st5cb2
  status: generated
  names: {zh: 衡源, en: Hengyuan}
  notes:
    zh: "衡源是大衡王朝东部边境的山城，王朝四府之一，坐落在衡河发源地的丘陵里，东面隔着丘陵就是齐马罗沃。全府面积约 3400 平方公里，人口约 20 万。城区在海拔约 190 米的河谷中，四周的山岭最高 988 米。衡河从这里的山谷中流出，向西流约 550 公里，流过全境的稻作平原，在都城承天附近注入西海。这里气候半干旱，年均气温 24.9 摄氏度，年降水约 700 毫米，一二月每月只有 2 毫米，旱季山坡一片枯黄，雨季的七八月溪水才涨满河谷。\n衡源是王朝东面的门户。大分裂后，齐马罗沃的民族社会主义运动向西扩张，它的「血统」学说把衡河平原的居民视为海外商人的后代、「外人」，两国的东部边界从此长年对峙。边军大营驻在城外，是边军最大的驻地，扼守衡河源头通往齐马罗沃的谷道，营区有几十座营房、炮场和车场，外围挖着壕沟、筑着土墙；士兵大多来自衡河平原的农家，三年一轮换。两国关系紧张时，大营的火炮会推进到东关附近的山头上。\n东关是两国之间唯一的关口，一座石砌关城横跨在通往齐马罗沃的旧国道上，只在白天开放，过往商人须出示礼部签发的勘合，货物缴纳关税；关系紧张时，关门常常一连几个月紧闭，只放逃难的人进来。城外河谷里的衡源东难民营住着约三万名逃离齐马罗沃的人，他们大多被「血统证书」划为下等居民，失去了土地和工作。营地由户部的赈济司和国际援助机构共同管理，竹棚和铁皮板房沿河谷排开，中间是粥厂、诊所和学堂；王朝允许难民在铜矿和林场做工，却不给他们户籍，许多人已在这里住了十多年。\n山里有铜矿和林场。衡源铜矿是王朝最重要的矿山，由工部的矿监管理，矿石在山下的冶炼厂炼成铜锭，用来铸造钱币、器物和弹壳，矿工多是附近村庄的农民和营里的难民，矿区四周驻有边军的哨所。采矿、国防和林业是衡源的三大行业，第二产业占 26%，人均生产总值约 4970 美元。一条约 55 公里的公路沿衡河谷地西去承天，另有一条约 6 公里的支路通往铜矿。\n府衙的知府晏德音由吏部从进士中铨选、天子任命，三年一任，按回避之制不得在本籍做官；府衙下设县衙，乡里事务由里老协助管理。居民 72% 以汉语为母语，26% 讲拉诺瓦语，许多难民和山村人家两种话都会。城里的孩子从小在学塾里背书，盼着有一天去承天应考；边军的家属则在营门外开小饭馆和杂货铺。每年春天，知府和天子在同一天下田行亲耕礼，衡源的田少，知府便在河谷里一小块水田上犁下第一道垄。市花是杜鹃花，市树是木棉，木棉开花时满树通红，老兵说，那是东关的烽火颜色。"
    en: "Hengyuan is the hill city on the Great Heng Dynasty's eastern border, one of the dynasty's four prefectures, set in the hills where the Heng River rises, with Tsimarovo just beyond the hills to the east. The prefecture covers about 3,400 km² and has some 200,000 people. The town lies in a valley at about 190 m, with ridges around it rising to 988 m. The Heng flows out of the valleys here and runs west for some 550 km across the dynasty's rice plain to enter the western sea near the capital, Chengtian. The climate is semi-arid, with a mean temperature of 24.9 °C and about 700 mm of rain a year, only 2 mm a month in January and February; in the dry season the slopes are parched yellow, and only in the rains of July and August do the streams fill the valley.\nHengyuan is the dynasty's eastern gate. After the Sundering the national socialist movement of Tsimarovo pushed west, and its doctrine of \"blood\" casts the people of the Heng plain as descendants of overseas merchants, \"outsiders\"; ever since, the two countries have faced each other across their eastern border. The Frontier Army's main camp lies outside town, its largest garrison, commanding the valley road from the source of the Heng into Tsimarovo, with dozens of barrack blocks, gun parks and vehicle yards behind ditches and earth walls; its soldiers are mostly from farming families of the Heng plain and rotate every three years. When relations are tense, the camp's guns are moved up onto the hills near the East Pass.\nThe East Pass is the only crossing between the two countries, a stone gate fort astride the old national road into Tsimarovo, open by day only; merchants must show tallies issued by the Ministry of Rites and pay duty on their goods, and when relations are tense the gate is often shut for months on end, letting in only those fleeing. In the valley outside town, the Hengyuan East Refugee Camp holds some 30,000 people who fled Tsimarovo, most of them classed as lesser residents under its \"blood certificates\" and stripped of land and work. The camp is run jointly by the Relief Office of the Ministry of Revenue and international aid agencies, its bamboo sheds and tin-sheet huts lining the valley around soup kitchens, a clinic and a school; the dynasty lets refugees work in the copper mine and the forest stations but gives them no household registration, and many have lived here for more than ten years.\nThere are copper mines and forest stations in the hills. The Hengyuan Copper Mine is the dynasty's most important mine, run by an inspector of the Ministry of Works; its ore is smelted into copper ingots at the works below for coins, wares and cartridge cases, its miners are mostly farmers from nearby villages and refugees from the camp, and Frontier Army posts surround the workings. Mining, defence and forestry are Hengyuan's three main trades; industry makes up 26% of the economy and output per head is about $4,970. A road of about 55 km runs west along the Heng valley to Chengtian, and a spur of about 6 km leads to the copper mine.\nThe prefect of the Prefectural Yamen, Yan Deyin, is chosen by the Ministry of Personnel from the jinshi graduates and appointed by the Emperor for three years, and by the rule of avoidance may not serve in a home prefecture; under the yamen are county yamens, and village elders help run the villages. Seventy-two per cent of the people speak Chinese as their mother tongue and 26% Ranovan, and many refugees and hill families speak both. Town children learn texts by heart at the village schools from an early age, hoping one day to sit the examinations in Chengtian, while the families of the Frontier Army keep eating houses and general stores outside the camp gate. Each spring the prefects go out to plough on the same day as the Emperor's ploughing rite; Hengyuan has few fields, so its prefect turns the first furrow in a small paddy in the valley. The city flower is the rhododendron and the city tree the red silk-cotton, whose blossoms turn the whole tree scarlet: the colour, old soldiers say, of the beacon fires at the East Pass."
  codes: {admin: '936300'}
  population: 200000
