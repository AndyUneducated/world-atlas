- id: div_mt8f0c
  subtype: locality
  parent: div_gd73a5
  status: generated
  names: {zh: 洛哈瓦托, en: Lohavato, art-x-ranova: Lohavato}
  notes:
    zh: "洛哈瓦托是洛哈瓦托王国的都城，位于拉诺瓦岛东海岸中部，建在法拉纳断崖脚下的山丘上。全市面积约 1.2 万平方公里，人口约 30 万，占全国人口的三分之二。名字意为「石头之首」，指城后断崖上那块突出的巨石。市境从断崖下的山丘一直延伸到海边，城区离海岸约 89 公里。这里属热带季风气候，年均气温 21.7 摄氏度，年降水约 2700 毫米，二月最干，只有 22 毫米，八月最湿，达 414 毫米。\n相传很久以前，从海上来的僧侣在断崖下建起第一座寺院，周围的部族首领皈依佛教，后来形成了洛哈瓦托王室。古王城遗址至今保留着石砌城墙、七座城门和王室墓地。联合共和国时期，王室只保留礼仪地位；大分裂时，国王在僧团和山区部族的支持下宣布恢复王国，洛哈瓦托重新成为都城。\n全城的中心是山丘上的金顶王宫，国王安德里亚纳·塔纳七世的宫殿与王家寺院连为一体，金色的多层屋顶从城里各处都能望见。王宫山脚的广场边是王国议会大厦；王宫东侧的院落是首相府。大佛寺的白塔据说供奉着佛陀舍利，王家僧学院有几百名少年僧人学习佛经、梵文、天文和传统医学。全长约 8 公里的转经道环绕旧城，沿途有 108 座小佛塔和成排的转经筒。城里还有国家博物馆、国家图书馆、王家歌舞剧院和总医院。断崖上的隐修洞几百年来一直有僧人闭关，断崖山居的露台可以望见王宫和断崖上的瀑布。城郊驻有皇家陆军第一步兵旅和王室卫队总部。\n经济以行政、文化遗产和旅游为主，第三产业占 82%，人均生产总值约 4380 美元，高于全国平均。王国对游客实行配额，每人每天缴纳旅游费。王家织造坊的女工用手工织机织造丝绸和棉布，官员上班都穿这里织的传统服装。城务由国王任命的城守沃拉娜·拉沃松主持。东海岸公路在市境内约 141 公里，横贯公路东段经过约 41 公里，洛哈瓦托—桑博公路长约 120 公里，把都城和王国唯一的港口连在一起。城里的八十多条主次干道中，有泉水路、石桥大道，也有以邻国命名的阿瓦拉齐社会主义共和国路。\n居民 92% 以拉诺瓦语为母语，识字率约 85%，男孩常在寺院中度过一段少年时光。每天清晨，僧侣们从宫门出发沿转经道托钵，信众在大佛寺前布施米饭和水果；中央市场五点开张，星期六上午最热闹，小吃摊卖米粥、炸香蕉和烤瘤牛肉串。佛诞节时全城提灯绕塔三圈；雨季结束时的法轮节，国王和僧团沿转经道绕城一周，全国的人涌进都城，在寺院前点燃成千上万盏酥油灯。市花是黄兰，市树是菩提树，老人们说，要认路就找菩提树，每座寺院门口都有一棵。"
    en: "Lohavato is the capital of the Kingdom of Lohavato, in the middle of Ranova's east coast, built on hills at the foot of the Farana Escarpment. The city covers about 12,000 km² and has some 300,000 people, two-thirds of the nation. The name means \"head of stone\", after the great rock that juts from the escarpment behind the town. The city's land runs from the hills below the escarpment down to the sea, though the town itself is some 89 km from the coast. The climate is tropical monsoon: the mean temperature is 21.7 °C and the annual rainfall about 2,700 mm, with February the driest month at only 22 mm and August the wettest at 414 mm.\nTradition holds that long ago monks who came by sea built the first monastery below the escarpment, the chiefs of the surrounding clans converted to Buddhism, and from them grew the royal house of Lohavato. The Old Royal City still keeps its stone walls, seven gates and royal tombs. Under the United Republic the royal house kept only a ceremonial role; at the Sundering the King, backed by the monastic order and the hill clans, proclaimed the kingdom restored, and Lohavato became a capital again.\nAt the heart of the city stands the Golden-Roofed Royal Palace on its hill, where the palace of King Andriana Tana VII and the royal monastery form a single complex, its golden tiered roofs visible from everywhere in town. On the square at the foot of the palace hill is the Royal Assembly House; in a courtyard east of the palace is the Office of the Prime Minister. The white stupa of the Great Pagoda is said to hold relics of the Buddha, and at the Royal Monastic College several hundred boy monks study scripture, Sanskrit, astronomy and traditional medicine. The Pilgrims' Circuit, about 8 km long, rings the old town, lined with 108 small stupas and rows of prayer wheels. The city also has the National Museum, the National Library, the Royal Dance Theatre and the General Hospital. Monks have gone into retreat in the Escarpment Hermit Caves for centuries, and from the terrace of the Escarpment Lodge one can see the palace and the waterfall on the escarpment. On the outskirts are the Royal Army's 1st Infantry Brigade and the headquarters of the Royal Guard.\nThe economy rests on government, heritage and tourism; services make up 82% of it, and output per head is about $4,380, above the national average. The kingdom sets quotas on visitors, each of whom pays a daily tourism fee. At the Royal Weaving House women weave silk and cotton on hand looms, and every official goes to work in traditional dress woven there. The city is run by the Warden, Volana Ravoson, appointed by the King. The East Coast Road runs about 141 km within the city's bounds and the eastern end of the Cross-Island Road about 41 km, while the Lohavato–Sambo Road, some 120 km long, ties the capital to the kingdom's only port. Among the town's more than eighty main and secondary streets are Spring Road and Stone Bridge Avenue, and also streets named after neighbours, such as Socialist Republic of Avaratsy Road.\nNinety-two per cent of the people speak Ranovan as their mother tongue, literacy is about 85%, and boys often spend part of their youth in a monastery. Every morning monks set out from the palace gate to walk the Pilgrims' Circuit collecting alms, and the faithful give rice and fruit in front of the Great Pagoda; the Central Market opens at five and is busiest on Saturday mornings, its food stalls selling rice porridge, fried bananas and grilled zebu skewers. On the Buddha's birthday the whole town carries lamps three times round the stupa, and at the Festival of the Wheel at the end of the rains the King and the monks walk the Pilgrims' Circuit round the city while people from all over the kingdom crowd into the capital and light thousands upon thousands of butter lamps before the temples. The city flower is the champak and the city tree the bodhi tree; old people say that if you want to find your way, look for a bodhi tree, for there is one at every temple gate."
