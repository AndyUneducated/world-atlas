# Administrative divisions of Ranova (拉诺瓦岛): the island is a region with no country above it
# (role: region); its 26 nations are its localities (role: nation), their cities its boroughs (role: city).
# id: stable internal key, referenced by other files. codes.admin: 6-digit hierarchical code (region
# 950000, nation 950100, city 950101); may change on reorganisation.
# Names are Chinese, English and the nation's own language: Ranovan (art-x-ranova) or, on the coasts
# and in Nusira, Kasiri (art-x-kasiri). A nation's card block is `nation:` (see pipeline/atlas/world.py).
