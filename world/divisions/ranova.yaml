# ── 萨马伊自由邦 ──
- id: div_gebca7
  subtype: locality
  parent: div_p735rv
  role: nation
  status: generated
  names: {zh: 萨马伊自由邦, en: Free State of Samay, art-x-ranova: Fanjakana Malalaka Samay}
  short_names: {zh: 萨马伊, en: Samay}
  notes: {zh: '萨马伊自由邦位于拉诺瓦岛东南外海，由一座主岛和东面的努西法拉岛组成，面积约一万四千平方公里，人口约一百一十万，有首都萨马伊、东部的安提瓦和努西法拉岛上的同名城镇三座城市。主岛中部有一座两千一百多米的萨马伊火山，火山灰土上种满可可、香草和咖啡，海岸是白沙滩和珊瑚礁。

      联合共和国时期，萨马伊是东南群岛的行政中心，各种宗教和语言的移民在这里混居。联合共和国解体前夕，东南各岛的议员与中央政府谈判，以条约方式和平分离，萨马伊、马哈维洛、安巴罗等岛国都沿用了联合共和国的船旗样式，萨马伊的旗帜是蓝色船旗。自由邦实行议会制，总统是虚位元首，总理领导政府，议会采用比例代表制，自由民主党、社会民主党和各宗教社区的政党共同组成政府。宪法规定国家不设国教，宗教学校和世俗学校并存，三大宗教的节日都是公共假日。

      自由邦是全岛最自由、最多元的社会之一，萨马伊大学是全岛最好的大学，各国的学生、学者和流亡者聚集于此。自由邦是世俗协约中的民主国家代表，与贝洛瓦和马哈维洛关系密切，同时在各方之间扮演调解者的角色，安巴罗之围就是在萨马伊的调解下结束的。

      努西法拉岛上有全岛最大的难民营，联合国机构和各国援助组织在码头边设有仓库，收容了约十二万名来自本岛各国的难民，其中许多人已在营地中生活了二十多年。经济以教育、旅游、热带农业和援助服务为主，人均收入约一万六千美元。每年的三环节，基督徒、穆斯林和佛教徒在首都的同一条街上举行联合游行，象征自由邦「多元一体」的立国精神。', en: "The Free State of Samay lies off the south-east of Ranova, a main island and Nosifara island to its east covering some 14,000 km² with about 1.1 million people in three cities, the capital, Samay, Antiva in the east and the town of the same name on Nosifara. Samay Volcano, over 2,100 m, rises in the middle of the main island, its ash soils planted with cocoa, vanilla and coffee, and the coasts are white sand and coral reef. \nUnder the United Republic Samay was the administrative centre of the south-eastern islands, where settlers of many faiths and languages lived side by side. On the eve of the Republic's dissolution the councillors of the south-eastern islands negotiated a peaceful separation by treaty with the central government; Samay, Mahavelo, Ambaro and the other island states kept the pattern of the United Republic's ensigns, Samay's being the blue ensign. The Free State is a parliamentary republic: the president is a ceremonial head of state, the prime minister leads the government, parliament is elected by proportional representation, and the Liberal Democrats, the Social Democrats and the parties of the faith communities govern together. The constitution establishes no state religion, religious and secular schools exist side by side, and the festivals of all three main faiths are public holidays. \nThe Free State is one of the freest and most diverse societies on the island, and the University of Samay, the best on the island, draws students, scholars and exiles from every country. It represents the democracies in the Secular Accord and is close to Belova and Mahavelo, while also acting as a mediator between the sides; the Siege of Ambaro was ended through Samay's mediation. \nNosifara island holds the largest refugee camp on the island, with the warehouses of UN agencies and aid groups by the quay, sheltering some 120,000 refugees from the main island's states, many of whom have lived in the camp for more than twenty years. The economy rests on education, tourism, tropical farming and aid services, with income of about 16,000 dollars a head. At the Festival of the Three Rings each year Christians, Muslims and Buddhists hold a joint procession along the same street of the capital, a sign of the Free State's founding spirit of 'many in one'."}
