# ── 萨马伊自由邦 ──
- id: div_gebca7
  subtype: country
  status: generated
  names: {zh: 萨马伊自由邦, en: Free State of Samay, art-x-ranova: Fanjakana Malalaka Samay}
  short_names: {zh: 萨马伊, en: Samay}
  notes:
    zh: "萨马伊自由邦位于拉诺瓦岛东南外海，由一座主岛和东面的努西法拉岛组成，面积约一万四千平方公里，人口约一百一十万，有首都萨马伊、东部的安提瓦和努西法拉岛上的同名城镇三座城市。主岛中部有一座两千一百多米的萨马伊火山，火山灰土上种满可可、香草和咖啡，海岸是白沙滩和珊瑚礁。萨安高速铁路绕过火山山麓，以一连串桥梁和隧道连接首都和安提瓦，时速 400 公里，二十多分钟就到。\n联合共和国时期，萨马伊是东南群岛的行政中心，各种宗教和语言的移民在这里混居。联合共和国解体前夕，东南各岛的议员与中央政府谈判，以条约方式和平分离，萨马伊、马哈维洛、安巴罗等岛国都沿用了联合共和国的船旗样式，萨马伊的旗帜是蓝色船旗。自由邦实行议会制，总统是虚位元首，总理领导政府，议会采用比例代表制，自由民主党、社会民主党和信仰社区联盟是三大政党，政府通常由其中两党联合组成。宪法规定国家不设国教，宗教学校和世俗学校并存，三大宗教的节日都是公共假日。\n现任总统努里·拉菲诺由议会选出，是虚位元首。自由邦议会共 81 席，全国为一个选区，按最大余额法分配，不设门槛，各宗教社区的政党和小党因此容易进入议会。上一次选举投票率 79%，自由民主党得 31 席，与信仰社区联盟的 23 席组成联合政府，总理奥尼·拉索阿出自自由民主党，副总理安德里·拉科托马拉拉出自信仰社区联盟；社会民主党得 27 席，领袖哈米西·法拉吉是反对党领袖。宪法法院可以审查任何涉及宗教自由的法律。天主教徒约占 24%，逊尼派穆斯林约 22%，新教徒约 18%，佛教徒约 16%，没有哪一种信仰占到多数。萨马伊国防军和萨马伊海岸警卫队约六千人，全是志愿兵，退役者留在预备役直到 45 岁，曾多次向安巴罗托管地派出维和人员；中国是自由邦背后的支持者。\n自由邦是全岛最自由、最多元的社会之一，萨马伊大学是全岛最好的大学，各国的学生、学者和流亡者聚集于此。自由邦是世俗协约中的民主国家代表，与贝洛瓦和马哈维洛关系密切，同时在各方之间扮演调解者的角色，安巴罗之围就是在萨马伊的调解下结束的。\n努西法拉岛上有全岛最大的难民营，联合国机构和各国援助组织在码头边设有仓库，收容了约十二万名来自本岛各国的难民，其中许多人已在营地中生活了二十多年。经济以教育、旅游、热带农业和援助服务为主，人均收入约一万六千美元。每年的三环节，基督徒、穆斯林和佛教徒在首都的同一条街上举行联合游行，象征自由邦「多元一体」的立国精神。\n宽容日这天，学校里的孩子要去参观另一种信仰的礼拜场所；萨马伊咖喱是街头最常见的饭食，教堂、清真寺和佛寺门口的摊子各有各的做法，周末的足球赛则让所有人坐到同一片看台上。"
    en: "The Free State of Samay lies off the south-east of Ranova, a main island and Nosifara island to its east covering some 14,000 km² with about 1.1 million people in three cities, the capital, Samay, Antiva in the east and the town of the same name on Nosifara. Samay Volcano, over 2,100 m, rises in the middle of the main island, its ash soils planted with cocoa, vanilla and coffee, and the coasts are white sand and coral reef. The Samay–Antiva High-Speed Railway skirts the foot of the volcano on a string of bridges and tunnels, linking the capital with Antiva at 400 km/h in a little over twenty minutes. \nUnder the United Republic Samay was the administrative centre of the south-eastern islands, where settlers of many faiths and languages lived side by side. On the eve of the Republic's dissolution the councillors of the south-eastern islands negotiated a peaceful separation by treaty with the central government; Samay, Mahavelo, Ambaro and the other island states kept the pattern of the United Republic's ensigns, Samay's being the blue ensign. The Free State is a parliamentary republic: the president is a ceremonial head of state, the prime minister leads the government, parliament is elected by proportional representation, and the Liberal Democrats, the Social Democrats and the Alliance of Faith Communities are the three main parties, any two of which usually govern together. The constitution establishes no state religion, religious and secular schools exist side by side, and the festivals of all three main faiths are public holidays. \nThe present President, Nuri Rafino, is elected by parliament and is a ceremonial head of state. The Parliament of the Free State has 81 seats, elected across the whole country as one constituency by largest remainder with no threshold, so the parties of the faith communities and small parties find their way in easily. At the last election, on a turnout of 79%, the Liberal Democratic Party won 31 seats and governs in coalition with the Alliance of Faith Communities' 23, with the Prime Minister, Ony Rasoa, from the Liberal Democrats and the Deputy Prime Minister, Andry Rakotomalala, from the Alliance; the Social Democratic Party won 27 and its leader, Hamisi Faraji, leads the opposition. The constitutional court may review any law that touches religious freedom. Catholics make up about 24% of the people, Sunni Muslims about 22%, Protestants about 18% and Buddhists about 16%, so no faith is in the majority. The Samay Defence Force and the Samay Coast Guard number about 6,000, all volunteers, who stay in the reserve until 45 after leaving, and they have sent peacekeepers to the Ambaro Trust Territory several times; China is the free state's backer.\nThe Free State is one of the freest and most diverse societies on the island, and the University of Samay, the best on the island, draws students, scholars and exiles from every country. It represents the democracies in the Secular Accord and is close to Belova and Mahavelo, while also acting as a mediator between the sides; the Siege of Ambaro was ended through Samay's mediation. \nNosifara island holds the largest refugee camp on the island, with the warehouses of UN agencies and aid groups by the quay, sheltering some 120,000 refugees from the main island's states, many of whom have lived in the camp for more than twenty years. The economy rests on education, tourism, tropical farming and aid services, with income of about 16,000 dollars a head. At the Festival of the Three Rings each year Christians, Muslims and Buddhists hold a joint procession along the same street of the capital, a sign of the Free State's founding spirit of 'many in one'.\nOn the Day of Tolerance schoolchildren visit the place of worship of a faith other than their own; Samay curry is the commonest street food, made differently at the stalls outside the churches, mosques and temples, and weekend football puts everyone in the same stands."
