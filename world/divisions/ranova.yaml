  names: {zh: 达兰, en: Daran, art-x-kasiri: Daran}
  notes:
    zh: "达兰是努西拉苏丹国东岛上的度假城镇，面积约 2800 平方公里，人口 15 万，每平方公里约 54 人。东岛四周是珊瑚礁和浅海，白沙滩沿海岸展开，岛上丘陵起伏，最高处海拔 1594 米。这里属热带季风气候，年平均气温约 24 °C，年降水约 2200 毫米，五月到十一月多雨，八月最多；二月几乎无雨，全年日照约 2500 小时，旱季正是海滩游客最多的时候。达兰不设议会，市政局长由苏丹任命，通常出自宣誓效忠王室的六个世家之一，现任局长是姆瓦奈莎·赛义德。城花是九重葛，城树是沿海岸成排种植的木麻黄。\n苏丹国靠近海油气田致富，近年推出「后石油愿景」，发展金融、航运和旅游，达兰就是旅游这一项的主角。旅游度假和渔业是本地的两大产业，第三产业占经济的六成以上，人均生产总值约 3.15 万美元。达兰海滨度假酒店建在白沙滩边，有三百多间客房、三座游泳池和一个潜水中心，客人大多来自圣约同盟的盟国和海外；酒店前的珊瑚礁是潜水的好去处，退潮时可以看到成群的热带鱼。旺季时酒店雇用附近村庄的许多年轻人，厨房和洗衣房里也有不少外籍劳工。居民八成以上以卡西里语为母语，一成多讲拉诺瓦语，平均预期寿命约 78 岁，识字率约九成。\n苏丹国以伊斯兰教立国，在达兰，外国人可以在指定区域饮酒，酒店的酒吧和沙滩上的几处凉棚就在区内；斋月期间，这些地方白天也拉上帘子。度假区之外，达兰仍是一座渔镇，清晨的渔船带回石斑鱼和章鱼，一部分直接送进酒店的厨房。游客大多从首都努西拉的国际机场入境，再乘渡轮到东岛。苏丹国为萨希利亚的西岸战争提供资金和军事援助，多次成为贾巴利亚武装的袭击目标，度假区的入口因此设有检查站，海上也有巡逻艇来回巡航。\n达兰的节奏跟着季节走。旱季游客最多，沙滩上撑满遮阳伞，潜水教练一天要下三四次海；雨季一来，酒店空出一半房间，渔民们就把船拖上岸修补。傍晚，海边的小吃摊烤起鱼串和椰汁饭，本地人和游客坐在同一条长凳上看日落，宣礼声从镇上的清真寺传来时，摊主会停一会儿再开火。斋月结束的开斋节，苏丹在首都的王宫前向民众分发礼物，达兰的人家也敞开大门招待邻居；节后几周是本国人自己的度假季，努西拉和马卡拉的家庭坐渡轮来到东岛，把沙滩挤得满满当当。镇上的老人常说，石油总有一天会用完，沙滩和珊瑚礁只要照看好，就能一直留下来。"
    en: "Daran is the resort town on the eastern island of the Sultanate of Nusira, covering some 2,800 km² with 150,000 people, about 54 to the square kilometre. The island is ringed by coral reefs and shallow sea, white beaches run along its shore, and its rolling hills reach 1,594 m. The climate is tropical monsoon, averaging about 24 °C with some 2,200 mm of rain a year: May to November is wet, with the most rain in August, while February is almost dry and the sun shines about 2,500 hours a year, so the dry season is when the beaches are busiest. Daran has no council; its Director of the Municipality is appointed by the Sultan, usually from one of the six great families sworn to the crown, and the post is now held by Mwanaisha Said. The town flower is bougainvillea and the town tree the casuarina, planted in rows along the shore.\nThe Sultanate grew rich on its offshore oil and gas fields, and in recent years it has launched its 'post-oil vision' to build up finance, shipping and tourism, with Daran carrying the tourism part. Tourism and fishing are the local industries, services make up more than sixty per cent of the economy, and output per head is about 31,500 dollars. The Daran Beach Resort stands by the white sand with more than 300 rooms, three swimming pools and a diving centre, and most of its guests come from the Covenant League's member countries and from abroad; the reef in front of the hotel is a fine place to dive, and at low tide shoals of tropical fish can be seen. In the high season the hotel employs many young people from the nearby villages, and plenty of foreign workers staff its kitchens and laundries. More than eight in ten residents speak Kasiri as their mother tongue and over one in ten Ranovan; life expectancy is about 78, and about nine in ten can read.\nThe Sultanate is founded on Islam, and in Daran foreigners may drink alcohol in designated areas, which take in the hotel bars and a few shelters on the beach; during Ramadan even these draw their curtains by day. Beyond the resort Daran is still a fishing town, and the morning boats bring in grouper and octopus, some of it going straight to the hotel kitchens. Most visitors arrive through the international airport in the capital, Nusira, and take a ferry to the eastern island. The Sultanate funds Sahiliya's West Coast War and sends it military aid, and has been attacked several times by Jabaliya's fighters, so there is a checkpoint at the entrance to the resort and patrol boats cruise offshore.\nDaran keeps time by the seasons. In the dry season the visitors are most numerous, the beach is crowded with parasols and the diving instructors go down three or four times a day; when the rains come, half the hotel rooms stand empty and the fishermen haul their boats up the beach for repairs. In the evenings the stalls by the sea grill fish skewers and coconut rice, locals and visitors sit on the same benches to watch the sunset, and when the call to prayer sounds from the town mosque the stallholders pause before lighting their grills again. At Eid at the end of Ramadan the Sultan hands out gifts to the people in front of the palace in the capital, and families in Daran open their doors to their neighbours; the weeks after the festival are the Sultanate's own holiday season, when families from Nusira and Makara come over on the ferry and pack the beaches. The old people of the town like to say that the oil will run out one day, but the beaches and the reef will last for ever if they are looked after."
