- id: div_qe8t49
  subtype: locality
  parent: div_s07wh5
  status: generated
  names: {zh: 菲拉纳, en: Firana, art-x-ranova: Firana}
  notes:
    zh: "菲拉纳是马索沃利民主主义人民共和国的第二座城市，位于国土西部覆盖雨林的丘陵之间；国内另外两座城市是首都安德里安巴和沿海战争中吞并的法尼里。全市面积约 1.8 万平方公里，人口约 28 万。城区坐落在海拔约 270 米的山间盆地里，四周的山岭最高 1241 米，市境向东一直伸到海边，城区离海约 100 公里。这里属热带季风气候，年均气温 23.3 摄氏度，年降水约 2050 毫米，二月最干，八月最湿。\n菲拉纳是一座内陆农业城市，国营农场在山间种植水稻和玉米。菲拉纳国营农场的梯田是全国最大的粮食产地，劳动按军事化方式组织，农忙季节城里的学生、工人和士兵都要下乡插秧和收割。第一产业占全市经济的 38%，人均生产总值只有约 1860 美元，低于全国平均。歉收的年份，农场产量常常不足，国家只能依靠阿瓦拉齐的援助，援助的粮食和燃料要从北方运来。城外的山区里还有两座国营矿山：菲拉纳稀土矿是全国最重要的外汇来源，矿石经海路秘密出口以规避制裁，工人中有相当一部分来自劳动教养营；马索沃利石墨矿是全国最大的露天矿，石墨经选矿厂提纯后出口。\n城市由永生宫任命的市革命委员会管理，主任拉劳·拉索阿马纳纳和所有委员一样须宣誓效忠创始领袖和他的继承人。和全国一样，居民按家庭出身划分成分，迁徙、就业和婚姻都受到严格管理，广播和报纸全部国营，外国电台被屏蔽。城郊驻有人民军第二步兵旅，几十座营房围着一个大操场，新兵入伍时家属们在营门外送别。\n城外的山谷中有一处劳动教养营，官方称之为「再教育农场」。高墙和双层铁丝网围着几排牢房，四角设有岗楼，关押着政治犯和被当局认定为「危险分子」的人，许多人未经审判就被关押多年。沿海战争后，被列为「敌对成分」的法尼里前公社代表、民兵和报纸编辑也被成批押到这里。国际人权组织多次要求探视，很少获准；获释者讲述了拥挤的牢房、强迫劳动和与家人断绝联系的经历。城里的人很少提起那道山谷，私自出境者的家属会受到牵连。\n交通上，北方公路从阿瓦拉齐的首都沃希马希经矿城马罗瓦托南下，以菲拉纳为终点，在市境内约 66 公里，是世俗协约两个盟国之间的陆上通道，阿瓦拉齐的拖拉机和马索沃利的大米沿着这条路互相交换；东海岸公路在市境东部的海岸平原上经过约 92 公里。另有一条约 8 公里的公路通往国营农场。路边的农庄和工厂门口都挂着红色的标语牌。\n居民 92% 以拉诺瓦语为母语，识字率约 56%，平均预期寿命约 63 岁。城里汽车很少，人们骑自行车或步行，清晨广播喇叭准时响起，按比邻国慢半小时的全国时间叫醒全城。农忙时节，学校停课，孩子们跟着大人下田，晚上在打谷场上分到一碗玉米粥。每年创始领袖诞辰日，城里的广场上也有集体舞和火炬游行。市花是野牡丹，市树是柚木，城旗上那束金色稻穗，就是山间梯田里的水稻。"
    en: "Firana is the second city of the Democratic People's Republic of Masovoly, set among the rainforest-clad hills of the west of the country; the other two are the capital, Andriamba, and Faniry, annexed in the Coastal War. The city covers about 18,000 km² and has some 280,000 people. The town lies in a hill basin at about 270 m, ringed by ridges rising to 1,241 m, and the city's land reaches east to the sea, though the town is some 100 km from the coast. The climate is tropical monsoon, with a mean temperature of 23.3 °C and about 2,050 mm of rain a year; February is the driest month and August the wettest.\nFirana is an inland farming city, where state farms grow rice and maize among the hills. The terraces of the Firana State Farm are the country's largest source of grain, and the work is organised on military lines: at planting and harvest, students, workers and soldiers from the town must go out to transplant and reap. The primary sector makes up 38% of the city's economy, and output per head is only about $1,860, below the national average. In bad years the farm often falls short, and the state has to rely on aid from Avaratsy, whose grain and fuel must come from the north. In the hills outside town are two state mines: the Firana Rare Earth Mine, the country's chief earner of foreign currency, whose ore is shipped out secretly by sea to evade sanctions and many of whose workers come from labour camps, and the Masovoly Graphite Mine, the largest open pit in the country, whose graphite is purified and exported.\nThe city is run by the City Revolutionary Committee appointed by the Palace of Eternity, and its director, Lalao Rasoamanana, like every member, swears loyalty to the founding leader and his heir. As across the country, residents are classed by family background, and movement, work and marriage are tightly controlled; radio and newspapers are all state-run and foreign stations are jammed. The People's Army's 2nd Infantry Brigade is stationed on the outskirts, dozens of barrack blocks round a large parade ground, and families see new recruits off at the gate.\nIn a valley outside town is a labour camp, which the authorities call a \"re-education farm\". High walls and double fences of barbed wire surround rows of cells, with watchtowers at the corners, and it holds political prisoners and people the authorities have deemed \"dangerous elements\", many of them held for years without trial. Since the Coastal War former commune delegates, militia members and newspaper editors from Faniry classed as \"hostile elements\" have been brought here by the lorry-load. International human rights organisations have repeatedly asked to visit and have rarely been allowed; released prisoners have described crowded cells, forced labour and being cut off from their families. People in town seldom mention the valley; the families of those who leave the country without permission are punished with them.\nFor transport, the Northern Road comes south from Vohimahy, the capital of Avaratsy, through the mining town of Marovato, and ends at Firana; it runs about 66 km within the city's bounds and is the overland link between the two allies of the Secular Accord, along which Avaratsy's tractors and Masovoly's rice are exchanged. The East Coast Road passes about 92 km through the coastal plain in the east of the city, and a road of about 8 km leads to the state farm. Red slogan boards hang at the gates of the farms and factories along the way.\nNinety-two per cent of the people speak Ranovan as their mother tongue; literacy is about 56% and life expectancy about 63 years. There are few cars in town, and people cycle or walk; each morning the loudspeakers sound on time to wake the whole town by the national clock, half an hour behind the neighbours'. At planting and harvest the schools close and children follow the adults into the fields, receiving a bowl of maize porridge on the threshing floor in the evening. On the founding leader's birthday each year, the town square too has mass dancing and a torchlight parade. The city flower is the melastoma and the city tree the teak, and the golden ear on the city flag is the rice of the hill terraces."
