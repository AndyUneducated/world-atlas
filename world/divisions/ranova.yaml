# ── 贝洛瓦共和国 ──
- id: div_4f0pgt
  subtype: country
  status: generated
  names: {zh: 贝洛瓦共和国, en: Republic of Belova, art-x-ranova: Repoblikan'i Belova}
  short_names: {zh: 贝洛瓦, en: Belova}
  notes:
    zh: "贝洛瓦共和国位于拉诺瓦岛西海岸南段的一个大海湾边，北接萨希利亚，东邻安博维，南面是梅纳瓦利军政府，面积约二万七千平方公里，人口约一百四十万，有首都贝洛瓦和内陆的安博塔两座城市。首都贝洛瓦是全岛最大的金融中心，玻璃高楼沿海湾排开，港口终年繁忙；内陆是甘蔗、棉花种植园和出口加工区，贝安高速铁路以时速 400 公里把首都和安博塔连在一起，二十分钟就到。\n联合共和国时期，贝洛瓦是西海岸的商业港口和自由贸易区。大分裂后，当地的商人、银行家和技术官僚组建了临时政府，宣布成立总统制共和国，奉行自由市场、低税率和对外开放的政策。总统由全民直选，任期四年，最多连任一届；国会实行单一选区与比例代表混合制，自由党和公民联盟等政党轮流执政。共和国保障言论、宗教和新闻自由，是全岛最开放的社会之一。\n现任总统莉娅·拉贝米出自自由党，在上一次总统选举中以 55% 对 45% 击败公民联盟的托基·拉马纳纳，后者如今是国会的少数党领袖。国会共 81 席，门槛 5%，上一届投票率只有 59.3%：自由党 37 席，与新贝洛瓦党的 9 席合起来过半，公民联盟 28 席，港口绿党 7 席。内阁的 10 个部全部由自由党掌管，国会议长埃里·拉哈里也出自自由党。最高法院有 7 名法官，适用大陆法；贝洛瓦货币管理局、证券与交易委员会和反腐败委员会是独立机构。军队规模不大，贝洛瓦国防军和海岸警卫队约一万二千名现役人员都是志愿兵，服役期 3 年，装备无人机、巡逻艇、直升机和防空系统，部分由外国承包商维护；中国是共和国背后的支持者。天主教徒约占三成，不信教者和新教徒各占四分之一上下，另有逊尼派穆斯林和祖灵信仰者各约 8%。\n贝洛瓦是世俗协约中最富裕的资本主义成员，与阿瓦拉齐的结盟出于务实：两国都反对信仰和血统阵营对世俗社会的威胁。共和国是全岛的金融、软件和航运服务中心，人均收入约一万四千美元，但贫富差距也很大，港口外的难民营收容了约六万名来自邻国战争的难民，他们为码头和工厂提供廉价劳动力。\n共和国的周边并不太平：南面的梅纳瓦利军政府视其为反对派的庇护所，东面的安博维卡特尔把它当作走私的通道，贝洛瓦曾多次发动缉毒行动，双方冲突在停火后冻结；北面萨希利亚的西岸战争也牵动着它的安全，贝洛瓦为萨希利亚提供情报和无人机支援。每年十二月的贝洛瓦海湾节，海湾上的帆船赛和夜晚的烟花吸引着全岛的游客。\n篮球是最受欢迎的运动，首都的街头球场到了傍晚总是挤满年轻人；周末的海滨烧烤摊前排着长队，烤鱼、烤虾和烤鱿鱼配一杯冰甘蔗汁，是贝洛瓦人心目中最地道的海鲜烧烤。共和国日这天，总统在首都的海湾边检阅海岸警卫队的巡逻艇。"
    en: "The Republic of Belova stands on a large bay in the south of Ranova's west coast, with Sahiliya to the north, Ambovy to the east and the Menavaly junta to the south. It covers some 27,000 km² with about 1.4 million people in two cities, the capital, Belova, and Ambota inland. Belova is the largest financial centre on the island, its glass towers lining the bay and its port busy all year; inland there are sugar cane and cotton plantations and an export processing zone, and the Belova–Ambota High-Speed Railway links the capital with Ambota at 400 km/h in about twenty minutes. \nUnder the United Republic Belova was the commercial port and free trade zone of the west coast. After the Sundering its merchants, bankers and technocrats formed a provisional government and proclaimed a presidential republic devoted to free markets, low taxes and openness to the world. The president is elected by direct vote for four years and may serve two terms; Congress is chosen by a mix of single-member seats and proportional lists, and parties such as the Liberal Party and the Civic Alliance take turns in office. The Republic guarantees freedom of speech, religion and the press and is one of the most open societies on the island. \nThe present President, Lia Rabemy of the Liberal Party, beat Toky Ramanana of the Civic Alliance by 55% to 45% at the last presidential election, and he is now Minority Leader in Congress. Congress has 81 seats with a 5% threshold, and turnout at the last election was only 59.3%: the Liberal Party holds 37 seats, a majority together with the New Belova Party's 9, the Civic Alliance 28 and the Harbour Greens 7. All ten cabinet ministries are held by the Liberals, and the Speaker of Congress, Hery Rahary, is a Liberal too. The Supreme Court has seven judges and applies civil law, and the Belova Monetary Authority, the Securities and Exchange Commission and the Anti-Corruption Commission are independent bodies. The armed forces are small: the Belova Defence Force and the Belova Coast Guard have some 12,000 active personnel, all volunteers serving three years, equipped with drones, patrol boats, helicopters and air defences, some of them maintained by foreign contractors; China is the republic's backer. Catholics make up about 30%, those of no religion and Protestants about a quarter each, and Sunni Muslims and followers of ancestral religion about 8% each.\nBelova is the richest capitalist member of the Secular Accord, and its alliance with Avaratsy is a practical one: both oppose the threat the blocs of faith and blood pose to secular society. It is the island's centre for finance, software and shipping services, with income of about 14,000 dollars a head, but inequality is wide, and the camp outside the port shelters some 60,000 refugees from the neighbouring wars, who supply cheap labour to the docks and factories. \nIts neighbourhood is not at peace. The Menavaly junta to the south sees Belova as a refuge for its opponents; the Ambovy cartels to the east use it as a smuggling route, and Belova has mounted several anti-narcotics operations against them, a conflict frozen after a ceasefire; and the West Coast War in Sahiliya to the north affects its security too, so Belova supplies Sahiliya with intelligence and drone support. Every December the Belova Bay Festival, with its sailing regatta and night-time fireworks over the water, draws visitors from all over the island.\nBasketball is the most popular sport, and the capital's street courts fill with young people every evening; at weekends there are long queues at the seafront grills, where grilled fish, prawns and squid with a glass of iced cane juice make what Belovans regard as the true seafood grill. On Republic Day the President reviews the Coast Guard's patrol boats beside the capital's bay."
