  names: {zh: 伊纳拉, en: Inara, art-x-ranova: Inara}
  notes:
    zh: "伊纳拉是伊纳拉群岛邦的首府，位于拉诺瓦岛东南外海最远处的伊纳拉岛上，全市面积约 6200 平方公里，人口约 26 万，群岛邦的另一座城市是东岛的雷尼。岛屿低平，最高处只有 243 米，四周是珊瑚礁和蓝色的潟湖，岛上是椰林、肉桂园和渔村。这里属热带季风气候，年均气温 26.3 摄氏度，年降水约 2600 毫米，雨季在五月到十月。\n群岛世代实行母系制度：土地和房屋按母系继承，女儿继承家宅，儿子出嫁到妻子家，舅舅在外甥的教育中扮演重要角色。母亲议会在港湾边的长屋中召开，那是一座长约一百米的高脚木屋，用椰子树干和编织的露兜树叶建成，屋顶两端翘起如船首，代表们按氏族围坐在草席上，大母坐在中央。终身任职的大母伊娜·雷尼索阿住在城中心的大母之家，院里有一棵据说几百岁的面包树，新生的女孩在满月时被抱来接受她的祝福。城边的母系氏族长屋村里，十几座高脚长屋按氏族排列，每座住着一个母系大家庭。码头街上的两层白色木楼是岛民议会大楼，41 名议员由全体成年岛民选出，开会时窗户全部打开，海风和码头的声音一起飘进来。\n伊纳拉的市议会有 27 席，投票率高达 82.2%：氏族传统党得票 42.8%，获 12 席，与获 7 席的新岛民党联合执政，市长哈西娜·拉菲迪松出自氏族传统党；海洋公地党得票 30.5%，获 8 席，是最大的反对党。\n经济以渔业、海水养殖和旅游为主，人均生产总值约 1.21 万美元。潟湖边的珍珠养殖场把珠母贝挂在浮筏下，两三年后由各氏族的妇女取珠，最好的黑珍珠在海外拍卖行能卖出高价；海藻养殖合作社的妇女在浅海沙地上种海藻，每六周收获一次，退潮时整齐的海藻田像水下的稻田。鱼类罐头厂雇有一千多名工人，旺季三班倒；海洋养殖研究站把抗病的珠母贝苗免费发给各氏族。母亲议会划定的潟湖保护区只在特定节日才许捕鱼，周边渔场反倒恢复了生机。岛上唯一的伊纳拉机场只有一条短跑道和一座木结构的小航站楼，航班飞往萨马伊和马哈维洛，旅客下机时会被戴上鲜花编的花环。\n居民 90% 以拉诺瓦语为母语，识字率 99.3%，平均预期寿命约 77 岁，是全岛社会最平等的地方之一。独木舟船屋里停放着传统的双体远航独木舟，造船每砍一棵树都要再种两棵；星象航海学校教学生辨认星辰、海浪和鸟群，毕业前须独自驾独木舟往返一座远方的小岛。每年航海节，各氏族的独木舟从船屋出发进行岛际竞赛；满月时节，女儿们举行成年礼，母亲把传家的贝壳交到女儿手中，海滩上燃起篝火，人们唱起先祖母亲们从海上来到群岛的古老歌谣。市花是鸡蛋花，市树是面包树。"
    en: "Inara is the capital of the Commonwealth of the Inara Isles, on Inara Island, the farthest out of the islands off Ranova's south-east coast; the city covers about 6,200 km² and has some 260,000 people, and the Commonwealth's other city is Reny on the eastern island. The island is low, its highest point only 243 m, ringed by coral reefs and blue lagoons, with coconut groves, cinnamon gardens and fishing villages inland. The climate is tropical monsoon, with a mean temperature of 26.3 °C and about 2,600 mm of rain a year, the rains falling from May to October.\nThe islands have long been matrilineal: land and houses pass down the female line, daughters inherit the family home and sons marry into their wives' households, and a mother's brother plays a large part in raising her children. The Mothers' Council meets in a longhouse by the harbour, a stilted timber hall about a hundred metres long built of coconut trunks and woven pandanus, its roof rising at both ends like the prows of boats, where the delegates sit on mats by clan with the Great Mother in the middle. The Great Mother, Ina Renisoa, who holds office for life, lives at the House of the Great Mother in the town centre, whose courtyard has a breadfruit tree said to be centuries old, and newborn girls are brought to her for a blessing at the full moon. In the Clan Longhouse Village on the edge of town, a dozen or so stilted longhouses stand in rows by clan, each home to one matrilineal family. The two-storey white timber building on Quay Street is the Islanders' Assembly House, whose 41 members are elected by all adult islanders; when it sits all the windows are opened, and the sea wind and the sounds of the quay drift in together.\nInara's city council has 27 seats, and turnout reached 82.2%. The Clan Tradition Party took 42.8% and 12 seats and governs with the New Islanders' Party, which has 7, and the mayor, Hasina Rafidison, is from the Clan Tradition Party; the Ocean Commons Party took 30.5% and 8 seats and is the largest opposition party.\nThe economy rests on fishing, aquaculture and tourism, and output per head is about $12,100. At the pearl farm by the calm lagoon, pearl oysters hang on ropes beneath rafts until the women of the clans take out the pearls two or three years later, and the best black pearls fetch high prices at auction houses overseas; the women of the seaweed co-operative grow seaweed on the sandy shallows, harvesting every six weeks, and at low tide the neat seaweed beds look like paddy fields under water. The fish cannery employs more than a thousand workers and runs three shifts in the season, and the Marine Aquaculture Station gives disease-resistant oyster spat to the clans free. The Lagoon Reserve marked out by the Mothers' Council may be fished only on certain festival days, and the fishing grounds around it have come back to life as a result. The island's only airport, Inara Airport, has a single short runway and a small timber terminal, with flights to Samay and Mahavelo, and arriving passengers are garlanded with flowers.\nNinety per cent of the people speak Ranovan as their mother tongue, literacy is 99.3% and life expectancy about 77 years, and it is one of the most equal societies on the island. The Canoe House shelters the traditional double-hulled voyaging canoes, and for every tree felled to build one two are planted; the School of Star Navigation teaches students to read the stars, the swell and the birds, and before graduating each must sail a canoe alone to a distant islet and back. At the voyaging festival each year the clans' canoes set out from the Canoe House to race between the islands; at the full-moon season daughters come of age, mothers hand their heirloom shells to their daughters, bonfires are lit on the beaches and people sing the ancient songs of the first mothers who came to the islands from the sea. The city flower is the frangipani and the city tree the breadfruit."
