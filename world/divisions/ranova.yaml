# Administrative divisions of Ranova (拉诺瓦岛). The island has no country above it: its 26 nations are
# states (subtype: country, no parent), their cities cities (locality) with no districts, and the United
# Republic of Ranova, the government in exile that claims the whole island, a state like the others whose
# capital and area it does not control (uncontrolled:); its seat and claims are in its notes. On the map it
# is the region's territory in world/generator/ranova.yaml, the island's outline.
# id: stable internal key, referenced by other files. codes: a state has only its ISO 3166-1 code, its letters
# taken from its name as this world sees fit, real countries' codes notwithstanding (the nations numbered 910
# to 935 in the order they were founded on the map; the government in exile RA, RAN, 950); a city has its
# 6-digit admin code (600100), which may change on reorganisation.
# Names are Chinese, English and the nation's own language: Ranovan (art-x-ranova) or, on the coasts
# and in Nusira, Kasiri (art-x-kasiri). A state's card block is `nation:` (see pipeline/atlas/world.py).
divisions:
- id: div_p735rv
  subtype: country
  status: generated
  names: {zh: 拉诺瓦联合共和国, en: United Republic of Ranova, art-x-ranova: Repoblika Mitambatra an'i Ranova}
  notes: {zh: "拉诺瓦联合共和国是拉诺瓦岛上曾经唯一的国家，如今是一个流亡政府，驻在东南海岸外的安巴罗国际托管地。它在法律上仍然主张对全岛和两侧群岛的主权，但三十多年来没有实际控制任何领土，只在安巴罗旧海军要塞旁的一座行政楼里设有总统府、临时国民议会和几个部门，在萨马伊、马哈维洛和海外设有代表处。\n\n拉诺瓦岛是太平洋东北部的一座大岛，位于加利福尼亚东南约一千五百公里的海上，主岛面积约一百万平方公里，形状狭长，西北和东南外海各有十多座大小不一的岛屿。中部是纵贯南北的安德里纳高原，北端有全岛最高的马洛卡山，东部是陡峭的法拉纳断崖和热带雨林，西部是稀树草原和干燥的丘陵，西南是多刺灌木林和半荒漠。全岛人口约三千万，通行拉诺瓦语和沿海的卡西里语。\n\n联合共和国统一了本岛和两侧的群岛，首都设在高原中部的安博哈拉。三十多年前，它在经济危机、地方分离运动和意识形态对立中崩溃，这场崩溃被称为「大分裂」。东南群岛和萨拉卡依据条约和平分离，沿用了联合共和国的船旗样式；本岛则陷入长期战乱，先后形成了二十六个国家和武装控制区。安博哈拉被基督教联邦接管后，最后一届内阁和部分议员撤到萨马伊；安巴罗之围结束、托管地成立后，流亡政府迁入安巴罗，成为国际委员会认可的谈判一方。\n\n流亡政府由流亡总统领导，临时国民议会由大分裂前的国民议会议员、侨民代表和难民营代表组成，每五年在难民营和海外侨民中改选一次。它的主要工作是为难民和海外侨民签发身份与旅行证件，保存联合共和国的档案、法律和国旗，参加在安巴罗举行的和平谈判，并主张以联邦方式和平统一全岛。只有少数国家承认它是拉诺瓦的合法政府，多数国家把它视为一个有象征意义的对话者。岛上各国的人常说：「我们曾经是一个国家，如今是一座岛。」", en: "The United Republic of Ranova was once the only state on the island of Ranova and is now a government in exile, seated in the Ambaro International Trust Territory off the south-east coast. In law it still claims sovereignty over the whole island and the islands on either side, but for more than thirty years it has held no territory at all: it keeps a presidency, a Provisional National Assembly and a few ministries in an office building beside Ambaro's old naval fortress, and missions in Samay, Mahavelo and abroad.\n\nRanova is a large island in the north-eastern Pacific, some 1,500 km south-east of California. The main island covers about a million square kilometres in a long, narrow shape, with a dozen or more islands of every size offshore to the north-west and south-east. The Andrina Highlands run down the middle, the Maroka Massif at the northern end is the highest ground, the east is the steep Farana Escarpment and rainforest, the west savanna and dry hills, and the south-west spiny thicket and semi-desert. About 30 million people live on the island, speaking Ranovan and, on the coasts, Kasiri.\n\nThe United Republic united the main island and the islands on either side, with its capital at Ambohara in the middle of the highlands. More than thirty years ago it collapsed amid economic crisis, regional separatism and ideological division, a collapse known as the Great Sundering. The south-eastern islands and Saraka left peacefully by treaty and kept the pattern of the Republic's ensigns, while the main island fell into a long war out of which twenty-six states and armed zones emerged. When the Christian Federation took over Ambohara, the last cabinet and some members of parliament withdrew to Samay; after the Siege of Ambaro ended and the trust territory was set up, the government in exile moved to Ambaro and became a party to talks recognised by the International Commission.\n\nThe government in exile is led by a president in exile. Its Provisional National Assembly is made up of members of the pre-Sundering parliament and representatives of the diaspora and the refugee camps, re-elected every five years in the camps and among Ranovans abroad. Its work is to issue identity and travel papers to refugees and the diaspora, to keep the United Republic's archives, laws and flag, to take part in the peace talks at Ambaro and to argue for a peaceful reunion of the island as a federation. Only a few states recognise it as Ranova's lawful government; most treat it as a symbolic interlocutor. People across the island say, 'We were once a country; now we are an island.'"}
