# ── 努西拉苏丹国 ──
- id: div_38z2mg
  subtype: country
  status: generated
  names: {zh: 努西拉苏丹国, en: Sultanate of Nusira, art-x-kasiri: Usultani wa Nusira}
  short_names: {zh: 努西拉, en: Nusira}
  notes:
    zh: "努西拉苏丹国位于拉诺瓦岛西北外海，由三座主要岛屿组成，面积约一万六千平方公里，人口约九十万，其中约三分之一是外籍劳工。首都努西拉在最大的中岛上，西岛的马卡拉是渔港和油气补给基地，东岛的达兰是海滨度假城镇。群岛四周是珊瑚礁和浅海，近海的油气田是苏丹国财富的来源。\n苏丹国的王室出自很久以前就在群岛上经商的卡西里世家，联合共和国时期，苏丹只保留宗教和礼仪地位。大分裂时，苏丹趁本岛战乱宣布恢复主权，六个世家宣誓效忠，苏丹国由此独立。苏丹集立法、行政和司法大权于一身，任命首相和各部大臣，协商会议由王室成员、世家与部族代表、商界和宗教学者组成，只有咨询权。国内禁止政党活动，公开批评王室会被判处监禁。\n现任苏丹是哈米迪·本·努西尔三世，他的前任努西尔·本·哈米迪就是大分裂时宣布恢复主权、接受六个世家效忠的那一位，王储是哈立德·本·哈米迪。首相和副首相都由王室亲王担任，石油、国防和财政三部历来由苏丹的近亲掌管，大臣会议由苏丹召集，只就苏丹交议的事项提出建议。协商会议 40 席，王室成员 6 席、世家与部族代表 18 席、商界代表 10 席、宗教学者 6 席，不经竞争性选举。苏丹国最高法院有 7 名法官，民事和家庭案件按伊斯兰教法审理，油气合同和商业纠纷交给按成文法审理的商事法庭，外国公司还可以选择国际仲裁，苏丹保留最终裁决和赦免权。18 至 30 岁的男性公民要服 12 个月国民役，女性可以志愿参加，外籍劳工不得入伍；军队装备昂贵，有巡逻舰、直升机和一个战斗机中队，许多军官和技术人员却是外国合同人员。约 88% 的居民信奉逊尼派伊斯兰教，外籍劳工中也有天主教徒和新教徒。\n近海油气田被发现后，苏丹国迅速致富，人均收入约三万八千美元，公民享有免费医疗、教育和住房补贴，不缴所得税。繁重的劳动则由来自本岛和海外的外籍劳工承担，他们住在城郊的劳工城，没有公民权，人权组织多次批评他们的工作条件。政府近年推出「后石油愿景」，发展金融、航运和旅游，达兰的海滨酒店吸引着阵营盟国的游客。\n努西拉是圣约同盟的成员，与萨希利亚同属卡西里语和伊斯兰世界，为萨希利亚的西岸战争提供资金和军事援助，也因此多次成为贾巴利亚武装的袭击目标。苏丹国与卡托拉特许领隔海相望，两国在渔场和油气区划界上存在争议。斋月结束时的开斋节，苏丹在王宫前向民众分发礼物，海湾上的传统帆船赛是全年最热闹的盛事。\n劳工与移民部管理着约三十万外籍劳工的担保制度；人权组织说，劳工换雇主须经担保人同意，护照常被雇主扣押，这是外界批评最多的地方。苏丹国背后的支持者是美国，货币是努西拉里亚尔。登基纪念日这天，首都的海滨大道挂满紫红色的旗帜，家家户户做椰枣羊肉饭；王宫的卫兵来自苏丹御卫队，游客常在宫门前看他们换岗。"
    en: "The Sultanate of Nusira lies off the north-west of Ranova, three main islands covering some 16,000 km² with about 900,000 people, about a third of them foreign workers. The capital, Nusira, is on the largest, central island; Makara on the western island is a fishing port and offshore supply base, and Daran on the eastern island is a seaside resort. Coral reefs and shallow seas surround the islands, and the offshore oil and gas fields are the source of the sultanate's wealth. \nThe royal house descends from Kasiri merchant families who traded in the islands long ago, and under the United Republic the Sultan kept only a religious and ceremonial role. In the Sundering the Sultan used the turmoil on the main island to proclaim the restoration of sovereignty, the six great houses swore allegiance, and the sultanate became independent. The Sultan holds legislative, executive and judicial power and appoints the prime minister and ministers; the Consultative Council of royals, representatives of the great houses and tribes, business and religious scholars only advises. Parties are banned, and public criticism of the royal family is punished with prison. \nThe present sultan is Hamidi bin Nusir III; his predecessor, Nusir bin Hamidi, was the sultan who proclaimed restored sovereignty during the Sundering and received the oath of the six great houses, and the Crown Prince is Khalid bin Hamidi. The Prime Minister and the Deputy Prime Minister are both princes of the royal house, the ministries of oil, defence and finance have always been held by the sultan's close relatives, and the Council of Ministers meets at the sultan's summons and advises only on what he puts before it. The Consultative Council has 40 seats, 6 for members of the royal family, 18 for the great houses and tribes, 10 for business and 6 for religious scholars, none of them contested in competitive elections. The Supreme Court of the Sultanate has seven judges: civil and family cases are tried under sharia, oil and gas contracts and commercial disputes go to a commercial court that applies written law, and foreign companies may choose international arbitration, while the sultan keeps the final word and the power of pardon. Male citizens aged 18 to 30 serve twelve months of national service, women may volunteer and foreign workers may not enlist; the forces are expensively equipped, with patrol ships, helicopters and a squadron of fighters, yet many of the officers and technicians are foreign contractors. About 88% of residents are Sunni Muslims, and there are Catholics and Protestants among the foreign workers.\nOnce the offshore fields were found the sultanate grew rich fast; income is about 38,000 dollars a head, and citizens enjoy free health care and schooling, housing subsidies and no income tax. The heavy work is done by foreign workers from the main island and overseas, who live in labour towns on the outskirts without citizenship, and human rights groups have often criticised their conditions. The government's recent 'after oil' plan promotes finance, shipping and tourism, and Daran's seaside hotels draw visitors from the League's partner countries. \nNusira belongs to the Covenant League and shares the Kasiri language and Islam with Sahiliya; it funds and arms Sahiliya in the West Coast War and has been a target of attacks by the Jabaliya militants several times as a result. It faces the Katora Chartered Territory across the water, and the two dispute the boundary between their fishing grounds and oil and gas blocks. At the Eid that ends Ramadan the Sultan hands out gifts to the people outside the palace, and the traditional dhow race on the bay is the liveliest event of the year.\nThe Ministry of Labour and Immigration runs the sponsorship system for some 300,000 foreign workers; according to human rights groups, changing employer needs the sponsor's consent and passports are often kept by employers, and this is what outsiders criticise most. The sultanate's backer is the United States, and its currency is the Nusira riyal. On Accession Day the capital's seafront is hung with crimson flags and every household cooks lamb and date rice; the palace guards come from the Sultan's Royal Guard, and visitors often watch them change at the palace gates."
