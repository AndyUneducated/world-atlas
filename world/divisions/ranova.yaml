  names: {zh: 瓦瓦拉诺, en: Vavarano, art-x-ranova: Vavarano}
  notes:
    zh: "瓦瓦拉诺是转轮无边法王国南部的关城，也是王国除都城安巴尼埃洛之外唯一的城市，名字意为「城门」。全市面积约 3100 平方公里，人口约 11 万，守着通往太阳神国度的山口和南北商道。市境是高原上的山地和谷地，平均海拔约 1600 米，气候温和，年均气温 16.1 摄氏度，年降水约 1300 毫米，雨季在五月到十月，二月最干。这里地处热带，山上从不下雪，最冷的夜里也在 4 摄氏度上下。四周的谷地是层层叠叠的红米梯田。\n王国的全部土地属于寺院，瓦瓦拉诺也不例外。城市由当地大寺的住持兼管，掌城住持沃拉娜·兰德里亚由法王任命，执事会的僧人由他挑选，平信徒的村长只能列席，不能表决。城中有王国最大的尼院，约八百名尼姑在这里修行，推选大僧伽会议的四名尼众代表；她们多年来要求增加尼众的席位，大寺住持们一直没有答应。尼院开办的女童识字班，是王国少数让佃农女儿读书的地方。红米梯田全部属于尼院和南部几座寺院，佃农雨季插秧、干季收割，收成的三分之一交给寺院，这里的红米颗粒细长，白伞节时被供在法王面前。\n第九世法王法哈扎瓦纳就出生在城外的一个佃农村庄里，寻访僧在一间土坯小屋里找到了四岁的他。小屋如今围上白墙，成了朝圣地，法王的父母仍住在村里租种寺田，村民们说法王回乡时总是先去田里看看。他亲政后在城里开办了第一所招收平信徒子弟的学堂，有学生四百多人，开学那天亲自上了第一课；一些大寺住持担心佃农的孩子读了书就不肯种地。\n驿站集市是南北商道上的老集市，从太阳神国度和大衡王朝来的商队在这里卸货、换骡、交过路费，集市上卖盐、铁器、羊毛和红米，也卖太阳神国度的土豆和织毯，关隘与朝圣司的僧官坐在门口收税。朝圣者客舍的几十间客房围着一个种檀香树的院子，许多住客是越境来朝拜的太阳神国度村民，对方禁止他们来，这是两国争吵的由来之一。城南约 14 公里的南关是一道石门和一排关楼，商队缴过路费，朝圣者出示寺院签发的通行证；关门的事每隔几年就发生一次，护法军第二营的士兵便被派上山口驻守。往北，一条约 69 公里的公路通往都城。\n居民 91% 以拉诺瓦语为母语，识字率约 69%，第三产业占 61%，人均生产总值约 2530 美元，靠商贸、朝圣和梯田稻作过日子。几乎每个家庭都送一个儿子出家，出家是平民子弟读书和做官的唯一道路；离开庄园须持住持签发的通行证，人权组织批评这一制度近似农奴制。清晨，尼院的诵经声和赶骡人的铃声一起在山谷里响起。兵营门外的小饭馆做的都是士兵和赶骡人的生意。市花是野牡丹，市树是檀香树；城旗上的紫红钥匙，表示这座关城是王国的南大门。"
    en: "Vavarano is the pass town of the south of the Kingdom of the Boundless Dharma Wheel and its only city other than the capital, Ambanielo; the name means \"gate\". The city covers about 3,100 km² and has some 110,000 people, and it guards the passes into the Realm of the Sun God and the road between north and south. Its land is upland hills and valleys at an average of about 1,600 m, and the climate is mild: the mean temperature is 16.1 °C and the rainfall about 1,300 mm a year, with the rains from May to October and February the driest month. This is the tropics, and it never snows on the mountains; even the coldest nights stay around 4 °C. The valleys around are stepped with red rice terraces.\nAll the kingdom's land belongs to the monasteries, and Vavarano is no exception. The town is run by the abbot of its great monastery: the Abbot-Warden, Volana Randria, is appointed by the Dharma King, the monks of his stewards' council are his own choice, and lay village heads may sit in but not vote. The town has the kingdom's largest convent, where some eight hundred nuns live and elect the four nuns' representatives on the Great Sangha Council; for years they have asked for more seats for the nuns, and the abbots of the great monasteries have never agreed. The convent's literacy class for girls is one of the few places in the kingdom where tenants' daughters learn to read. The red rice terraces all belong to the convent and a few monasteries of the south; tenants plant in the rains and reap in the dry season and hand a third of the harvest to the monastery, and the long, slender red rice grown here is offered before the Dharma King at the Festival of the White Parasol.\nThe Ninth Dharma King, Fahazavana IX, was born in a tenant village outside the town, where the searching monks found him, aged four, in a mud-brick cottage. The cottage is now walled in white and has become a place of pilgrimage; his parents still live in the village and still rent monastery fields, and villagers say that when he comes home he always goes to look at the fields first. After taking power in his own right he opened in the town the first school to take the children of lay families, which has more than four hundred pupils, and he taught the first lesson himself on opening day; some abbots fear that tenants' children who learn to read will no longer want to farm.\nThe Caravan Market is an old market on the north–south road, where caravans from the Realm of the Sun God and the Great Heng Dynasty unload, change mules and pay tolls; it sells salt, ironware, wool and red rice, as well as the Sun God realm's potatoes and woven rugs, and monk officials of the Office of Passes and Pilgrims sit at the gate collecting duties. The forty or so rooms of the Pilgrims' Guesthouse surround a courtyard planted with sandalwood, and many guests are villagers from the Realm of the Sun God who have crossed the border to worship; their own country forbids it, which is one of the roots of the quarrel between the two. About 14 km south of town, South Gate Pass is a stone gate and a row of gatehouses, where caravans pay tolls and pilgrims show passes issued by the monasteries; every few years the pass is closed, and soldiers of the 2nd Battalion of the Dharma Guard are sent up to hold it. To the north a road of about 69 km leads to the capital.\nNinety-one per cent of the people speak Ranovan as their mother tongue; literacy is about 69%, services make up 61% of the economy, and output per head is about $2,530, earned from trade, pilgrimage and terrace rice. Nearly every family sends a son to be a monk, and taking vows is the only road to schooling and office for commoners' sons; leaving an estate requires a pass signed by the abbot, and human rights organisations criticise the system as close to serfdom. In the mornings the chanting from the convent and the bells of the muleteers ring out together across the valley, and the little eating houses outside the barracks gate live on the trade of soldiers and muleteers. The city flower is the melastome and the city tree the sandalwood, and the purple key on the city flag stands for the pass town as the kingdom's southern gate."
