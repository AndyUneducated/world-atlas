  notes:
    zh: "贝拉诺是米拉卡王国西部的农业城镇，也是王国除首都米拉卡之外唯一的城市，位于拉诺瓦岛西北外海的主岛上。全市面积约 5600 平方公里，人口约 28 万。主岛地势平缓，城区海拔约 110 米，市境最高处只有 357 米，红土缓坡一直伸到曲折的海岸。这里属热带草原气候，年均气温 22 摄氏度，年降水约 2000 毫米，雨季在五月到十月，二月最干，只有 9 毫米。菠萝和椰子种植园之间是英式乡村风格的小镇，农舍、石墙和小教堂散落在田野里。\n种植业和渔业是贝拉诺的两大行业，第一产业占全市经济的 38%，人均生产总值约 1.73 万美元，低于首都，但在全岛仍算富裕。贝拉诺菠萝种植园沿西部的缓坡展开，一行行菠萝种在红土上，菠萝是王国最重要的农产品，罐头和果汁出口到圣约同盟各国，收获季节游客可以自己下田采摘。海边的贝拉诺椰子园是一片老椰林，园主一家已经经营了五代，椰子在园内的工坊里加工成椰干、椰油和椰丝，椰壳烧成木炭，椰林下放养的牛群负责啃食杂草。渔港里停满了渔船，海员与渔民党的党首法利·拉韦洛就是本镇的一位渔船船长，十五岁跟着父亲出海，至今每年还要出几次海。\n米贝高速铁路是王国唯一的铁路，全长约 130 公里，北辰 400 型列车以时速 400 公里横穿主岛的种植园，二十多分钟就到首都，高峰时段每半小时一班，每年运送约 58 万人次，乘客以通勤者和游客为主。贝拉诺站是一座英式乡村风格的小站，站前就是种植园，周末常有游客乘火车来看种植园、逛乡村小镇。约 128 公里长的米拉卡—贝拉诺公路是另一条通往首都的路，另有一条约 7 公里的公路通往椰子园。海岸警卫队的贝拉诺海岸巡逻基地停泊着巡逻快艇和搜救船，负责沿海巡逻、渔业执法和海上搜救，风暴来临前巡逻艇会出海通知渔船回港。\n贝拉诺的市议会有 27 席，投票率 74.7%。基督教民主联盟得票 36.9%，获 10 席，市长兰托·拉扎菲和议长都出自基民盟；海员与渔民党得票 29.6%，获 8 席，在渔民中根基深厚；与全国执政联盟不同，基民盟在本市与获 6 席的社会自由党联合执政，王国党获 3 席。\n居民 92% 以拉诺瓦语为母语，识字率约 97%，平均预期寿命约 77 岁。礼拜天上午，小教堂的钟声在种植园间回响，午后人们在农舍的花园里喝下午茶，司康饼配菠萝果酱是米拉卡人最得意的搭配。每年国王生日，开往首都的列车挂上王室旗帜，车上挤满去看游行和海上阅舰的贝拉诺家庭，乘客们常开玩笑说，茶还没凉，车就到站了。市花是菠萝花，市树是椰子树，城旗上的蓝十字取自乡村教堂的样式。"
    en: "Belano is the farming town in the west of the Kingdom of Miraka and the kingdom's only city besides the capital, Miraka, on the main island off Ranova's north-west coast. The city covers about 5,600 km² and has some 280,000 people. The island is gently rolling; the town stands at about 110 m, the city's highest point is only 357 m, and red-earth slopes run down to a ragged coast. The climate is tropical savanna, with a mean temperature of 22 °C and about 2,000 mm of rain a year; the rains fall from May to October, and February is the driest month with only 9 mm. Small towns of an English country-village style lie among the pineapple and coconut plantations, with farmhouses, stone walls and little churches scattered across the fields.\nFarming and fishing are Belano's two main trades; the primary sector makes up 38% of the city's economy, and output per head is about $17,300, below the capital's but still prosperous by the island's standards. The Belano Pineapple Plantation spreads over the gentle western slopes in rows of pineapples on red earth; pineapples are the kingdom's most important crop, canned and juiced for export to the countries of the Covenant League, and at harvest visitors can pick their own. The Belano Coconut Grove by the sea is an old palm grove run by the same family for five generations, where coconuts are made into copra, coconut oil and desiccated coconut in the grove's workshops, the shells are burned for charcoal, and cattle grazing under the palms keep down the weeds. The fishing harbour is full of boats, and Faly Ravelo, leader of the Seafarers' and Fishers' Party, is a fishing captain from the town who went to sea with his father at fifteen and still goes out several times a year.\nThe Miraka–Belano High-Speed Railway is the kingdom's only railway, about 130 km long, its Beichen 400 trains crossing the island's plantations at 400 km/h and reaching the capital in a little over twenty minutes, with a train every half hour at peak times and some 580,000 passengers a year, mostly commuters and visitors. Belano Station is a small station in an English country style with the plantations right in front of it, and at weekends visitors often come out by train to see the plantations and wander the country towns. The Miraka–Belano Road, about 128 km long, is the other way to the capital, and a road of about 7 km leads to the coconut grove. The Coast Guard's Belano Coastal Patrol Base keeps patrol boats and rescue craft for coastal patrols, fisheries enforcement and search and rescue, and before a storm its boats go out to call the fishing boats home.\nBelano's city council has 27 seats, and turnout was 74.7%. The Christian Democratic Union took 36.9% and 10 seats, and both the mayor, Lanto Razafy, and the Speaker are from the CDU; the Seafarers' and Fishers' Party took 29.6% and 8 seats, with deep roots among the fishermen; unlike the national coalition, the CDU here governs with the Social Liberal Party, which has 6 seats, and the Kingdom Party has 3.\nNinety-two per cent of the people speak Ranovan as their mother tongue; literacy is about 97% and life expectancy about 77 years. On Sunday mornings the bells of the little churches ring out across the plantations, and in the afternoon people take tea in their farmhouse gardens, scones with pineapple jam being the Mirakans' proudest combination. On the King's birthday each year the trains to the capital fly the royal flag and fill with Belano families going to see the parade and the naval review, and passengers like to joke that the train arrives before the tea has cooled. The city flower is the pineapple flower and the city tree the coconut palm, and the blue cross on the city flag follows the pattern of the country churches."
