- id: div_7ct07a
  subtype: locality
  parent: div_st5cb2
  status: generated
  names: {zh: 承天, en: Chengtian}
  notes:
    zh: "承天是大衡王朝的都城，建在衡河入海口的南岸，市域约 2600 平方公里，人口约 70 万，每平方公里约 270 人。这里属半干旱气候，年均气温 25.7 ℃，年降水不到 800 毫米，一到三月几乎无雨，雨季的衡河汛期则要提防洪水。城墙方正，中轴线从城南的圜丘经承天门直抵承天宫。市旗石青色旗面上一枚金环圆印，仿照承天府衙的官印，印心是一杆朱色的衡器，表示都城是天子「持平如衡」之所；市花是荷花，市树是榕树。\n传说很久以前，带来经籍的海商就在城西的码头上岸，衡河平原从此兴起书院和礼教。大分裂时，承天书院的山长庄守礼率复礼学派的学者和各村乡兵保全了平原，被奉为天子，建立大衡王朝。中轴线北端的承天宫背靠衡河，朱墙青瓦，殿宇全用衡河上游运来的楠木建造，不用一根铁钉，是世界最大的木结构建筑；每月初一，百官身着紫、绯、绿、青四色朝服在正殿承天殿朝见天子，殿试也在这里举行，由景衡帝庄允恭亲自出题。宫西掖门外的三省政事堂悬挂太祖题写的「持平如衡」匾额，宫南千步廊两侧是六部衙署，人称「六部街」，街南端的大理寺门外设有登闻鼓。东侧的御史台院中立着獬豸石像，近年查出稷丰常平仓的贪污案，但它也负责查禁「妖书」。承天府的长官由天子亲自简派，现任为司马敬之；府衙下设县衙，乡里事务由里老协助管理。\n城东是贡院和国子监。承天贡院有六千多间号舍，考生在里面连考三场、每场三天，除经义和策论外还考算学、律学和农学，女科也在这里开考；每逢会试，全国的举人云集于此，客栈和书坊家家爆满。国子监有学生约四千人，辟雍是一座四面环水的圆形讲堂，藏书楼保存着全国最完整的经籍刻版。城西是市舶司和商港，外国商人须领取承天市舶司的「公凭」才能上岸贸易，码头上停满运瓷器、茶叶和稻米的货船。经济以行政、港口和高等教育为主，服务业占 87%，人均产值约 5340 美元。\n承天—稷丰、承天—衡源、承天—鹿鸣三条公路从都城通往其余三府，分别长约 105、55 和 37 公里。衡河口南岸的承天水师营停着导弹快艇和巡逻艇，城北海边旧烽火台上的承天烽台雷达站监视着海空。\n居民约四分之三以汉语为母语，约五分之一说拉诺瓦语，平均预期寿命 70.1 岁。承天东市清晨击鼓开市、黄昏击钲闭市，会试前后书坊和文具铺生意最好。承天惠民医局对穷人免费施药。冬至黎明，天子登上圜丘祭天；春天的亲耕节，天子在城东衡河边的先农坛籍田犁下第一道田垄；殿试放榜那天，禁军骑兵护送新科状元游街，夏天水师营的龙舟竞渡也引得全城涌到岸边。"
    en: "Chengtian is the capital of the Great Heng Dynasty, on the south bank of the mouth of the Heng River. Its territory covers some 2,600 km² and holds about 700,000 people, around 270 per km². The climate is semi-arid, with a mean temperature of 25.7 °C and less than 800 mm of rain a year; from January to March there is almost none, while in the rainy season floods on the Heng must be guarded against. The city walls are square, and the central axis runs from the Round Altar south of the city through the Gate of Receiving Heaven to Chengtian Palace. The city flag bears a gold-ringed round seal on azurite blue, modelled on the official seal of the Chengtian prefectural yamen, with a vermilion steelyard at its centre to show that the capital is where the Emperor 'holds the balance level'; the city flower is the lotus and the city tree the banyan.\nLegend has it that long ago the sea merchants who brought the classics came ashore at the wharves west of the city, and that academies and the rites took root on the Heng plain from then on. In the Sundering, Zhuang Shouli, head of the Chengtian Academy, saved the plain with the scholars of the School of Restored Rites and the village militias, was acclaimed Emperor and founded the Great Heng Dynasty. At the north end of the axis, Chengtian Palace backs onto the Heng; its red walls and blue-glazed roofs shelter halls built entirely of nanmu timber floated down from the upper Heng without a single iron nail, making it the largest wooden building in the world. On the first day of each month the officials, in court robes of purple, scarlet, green or blue by rank, attend the Emperor in its main hall, the Hall of Receiving Heaven, where the palace examination is also held, its questions set by the Jingheng Emperor, Zhuang Yungong, himself. Outside the palace's west gate, the Hall of Government of the Three Departments hangs a tablet in the Founding Emperor's hand reading 'Hold the balance level'; south of the palace, the Offices of the Six Ministries line both sides of the Thousand-Pace Corridor, known as 'Six Ministries Street', and at its southern end the Court of Judicial Review keeps a petition drum at its gate. To the east, the Censorate has a stone xiezhi, the unicorn said to tell right from wrong, in its courtyard; it recently uncovered embezzlement at the Jifeng Ever-Normal Granary, but it also hunts down 'subversive books'. The head of Chengtian is chosen by the Emperor himself; the present incumbent is Sima Jingzhi. Under the prefectural yamen are county yamens, and village elders help run the villages.\nThe examination hall and the Imperial Academy lie in the east of the city. The Chengtian Examination Hall has more than six thousand cells, where candidates sit three sessions of three days each, tested not only on the classics and policy essays but also on mathematics, law and agronomy, and the women's examination is held here too; at every metropolitan examination graduates from the whole country crowd into the city, and every inn and bookshop is full. The Imperial Academy has about four thousand students; its Biyong is a round lecture hall surrounded by water, and its library holds the most complete set of printing blocks for the classics in the country. To the west lie the Maritime Trade Office and the merchant port: foreign merchants must obtain a permit from the Chengtian Maritime Trade Office before trading ashore, and the wharves are crowded with ships carrying porcelain, tea and rice. The economy rests on government, the port and higher education; services account for 87%, and output per head is about US$5,340.\nThe Chengtian–Jifeng, Chengtian–Hengyuan and Chengtian–Luming roads link the capital with the other three prefectures, about 105, 55 and 37 km long respectively. The Chengtian Naval Station on the south bank of the river mouth harbours missile boats and patrol boats, and the Chengtian Beacon Hill Radar Station, on an old beacon tower by the sea north of the city, watches sea and sky.\nAbout three-quarters of the residents speak Chinese as their mother tongue and about a fifth Ranovan, and life expectancy is 70.1 years. The Chengtian East Market opens with a drum at dawn and closes with a gong at dusk, and bookshops and stationers do their best trade around the metropolitan examination. The Chengtian Huimin Medical Bureau gives medicine free to the poor. At dawn on the winter solstice the Emperor ascends the Round Altar to sacrifice to Heaven; at the spring ploughing festival he cuts the first furrow in the Sacred Field at the Altar of Agriculture by the Heng east of the city; on the day the palace examination results are posted, Imperial Guards cavalry escort the top graduate through the streets, and in summer the dragon-boat races at the naval station draw the whole city to the shore."
