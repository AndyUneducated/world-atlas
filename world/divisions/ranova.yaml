  names: {zh: 努西法拉, en: Nosifara, art-x-ranova: Nosifara}
  notes:
    zh: "努西法拉是萨马伊自由邦的城镇，坐落在主岛东面的努西法拉岛上，市域约 3000 平方公里，人口约 15 万。这里属热带季风气候，年均气温 25.0 ℃，年降水约 2960 毫米，七到九月每月雨量在 420 毫米以上，二月最干。岛上有全岛最大的难民营，联合国机构和援助组织的仓库沿码头排开。市旗蓝底正中一只白鸽，代表援助组织，也代表难民最大的愿望：回家。市花是长春花，市树是露兜树。\n努西法拉难民营位于岛的东部，收容了约十二万名来自本岛各个战乱地区的难民，其中许多人已在营地里生活了二十多年。营地由联合国机构和萨马伊政府共同管理，按难民的来源地分成十几个区，各有自己的学校、诊所和礼拜场所，教堂、清真寺和祖灵祭坛常常隔着一条小路。萨马伊允许难民在岛上工作和上学，许多难民的孩子考进了萨马伊大学，回来时成了营地学校的老师。营地里的市场每天热闹非凡，高原的米糕、西海岸的香料鱼和南方牧区的牛肉干摆在同一排摊位上，人们说在这里一天就能吃遍全岛。\n城镇的经济围绕国际援助和渔业，服务业约占 74%，人均产值约 1.52 万美元。努西法拉人道援助仓库是国际援助机构在萨马伊的主要物资中转站，粮食、帐篷、药品和净水设备从港口运来登记分拣，再用卡车送往难民营和受灾村庄；仓库由援助机构和当地工人共同管理，门口的告示板上写着当周的配送计划。每天凌晨渔船靠岸，港口旁的努西法拉鱼市就开始按重量拍卖金枪鱼、石斑鱼、龙虾和章鱼，一个小时内就能卖完，冷库供应首都的餐馆和出口加工厂。\n努西法拉与外界的联系靠海和空中：渡轮从萨马伊港开来，在码头上卸下旅客和援助物资；萨马伊机场的货运区专门存放运往努西法拉难民营的物资，再装船过海。援助人员、医生和记者在码头边的仓库和营地之间往来，岛上通行拉诺瓦语、卡西里语和英语，三分之二的居民以拉诺瓦语为母语。\n市议会 23 席，最近一次投票率 77.9%。社会民主党得票 55.3%、拿下 13 席，单独执政，信仰社区联盟 6 席，自由民主党 4 席；市长林德拉·拉贝和议长里亚娜·拉贝都属社会民主党。社会民主党党首哈米西·法拉吉是一位说卡西里语的医生，在岛上的难民营诊所工作了十多年。\n居民平均预期寿命 77.4 岁，识字率 99.5%。鱼市旁的小饭馆清晨六点就开始卖鱼汤和烤鱼，渔民、码头工人和援助仓库的搬运工坐在同一张长桌边吃早饭。营地的老人常在傍晚走到海边，望着西面主岛的方向；每逢有一家人登记回乡，邻居们会在帐篷前摆一桌饭送行。"
    en: "Nosifara is a town of the Free State of Samay on the island of Nosifara, east of the main island. Its territory covers some 3,000 km² and it has about 150,000 people. The climate is tropical monsoon, with a mean temperature of 25.0 °C and some 2,960 mm of rain a year; from July to September each month brings more than 420 mm, and February is the driest month. The island is home to the largest refugee camp in Ranova, and the warehouses of UN agencies and aid groups line the quay. The city flag shows a white dove on blue, standing for the aid groups and for the refugees' greatest wish: to go home. The city flower is the Madagascar periwinkle and the city tree the screw pine.\nThe Nosifara Refugee Camp, in the east of the island, shelters some 120,000 refugees from every war-torn part of the main island, many of whom have lived there for more than twenty years. It is run jointly by UN agencies and the government of Samay and divided by the refugees' places of origin into a dozen or more sectors, each with its own schools, clinics and places of worship; churches, mosques and ancestral altars often stand just a lane apart. Samay allows refugees to work and study on the island, and many refugee children have won places at the University of Samay and come back as teachers in the camp schools. The camp market bustles every day, with highland rice cakes, spiced fish from the west coast and dried beef from the southern grazing lands on the same row of stalls, and people say that here you can eat your way round the whole island in a day.\nThe town's economy revolves around international aid and fishing; services account for about 74%, and output per head is about US$15,200. The Nosifara Humanitarian Aid Warehouse is the main transit depot of the international aid agencies in Samay: food, tents, medicines and water-purification equipment arrive from the port to be logged and sorted, then go by lorry to the camp and to stricken villages. It is run jointly by the agencies and local workers, and the notice board at the door gives the week's delivery plan. Every morning before dawn, as the boats come in, the Nosifara Fish Market beside the harbour starts auctioning tuna, grouper, lobster and octopus by weight, selling out within an hour, and its cold stores supply restaurants in the capital and the export processing plants.\nNosifara is linked to the outside world by sea and air: ferries from the Port of Samay unload passengers and relief supplies at the quay, and the cargo area at Samay Airport stores supplies bound for the Nosifara camp before they are shipped across. Aid workers, doctors and journalists come and go between the quayside warehouses and the camp; Ranovan, Kasiri and English are all spoken on the island, and two-thirds of the residents speak Ranovan as their mother tongue.\nThe City Council has 23 seats; turnout at the last election was 77.9%. The Social Democratic Party won 55.3% and 13 seats and governs alone, with the Alliance of Faith Communities holding 6 seats and the Liberal Democratic Party 4; the mayor, Rindra Rabe, and the speaker, Riana Rabe, both belong to the Social Democrats. The Social Democrats' leader, Hamisi Faraji, is a Kasiri-speaking doctor who worked for more than ten years in the camp clinic on the island.\nLife expectancy is 77.4 years and literacy 99.5%. The small eateries beside the fish market start serving fish soup and grilled fish at six in the morning, and fishermen, dockers and porters from the aid warehouse eat breakfast at the same long tables. In the evenings the camp's old people often walk down to the shore and gaze west towards the main island, and whenever a family registers to go home, the neighbours lay out a meal in front of the tent to see them off."
