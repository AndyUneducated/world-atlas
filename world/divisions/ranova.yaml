# ── 齐马罗沃民族社会主义国 ──
- id: div_rbcxzz
  subtype: country
  status: generated
  names: {zh: 齐马罗沃民族社会主义国, en: National Socialist State of Tsimarovo, art-x-ranova: Fanjakana Sosialista Nasionaly Tsimarovo}
  short_names: {zh: 齐马罗沃, en: Tsimarovo}
  notes: {zh: '齐马罗沃民族社会主义国位于拉诺瓦岛南部，伊拉希河从伊瓦卡山流向东海岸，贯穿全境，面积约九万九千平方公里，人口约二百八十万，下设五个城市，首都齐马罗沃建在伊拉希河上游的盆地中。国土大部分是干燥的高原和稀树草原，东部河口一带是全国唯一的出海口伊拉希港。

      联合共和国末期，南方的退伍军人和民族主义青年组织成立了民族社会主义运动，宣称高原「最早的定居者」才是拉诺瓦的主人，把原住民氏族、沿海的卡西里人和外来移民视为「外人」。大分裂后，运动以武力控制南方各省，建立一党制国家，民族领袖拥有不受限制的权力，国民议会只负责鼓掌通过领袖的决定。国家按「血统证书」把居民分成等级，只有一等公民可以拥有土地、担任公职和参军当军官。

      国家建立后随即向西南扩张，发动南方战争，攻入阿拉齐纳原住民氏族的牧区，强迫数十万人离开家园，把土地分给「定居者村」。国际调查机构多次记录了强迫迁徙、集体惩罚和拘押营，周边国家和国际组织普遍对其实施武器禁运。南方战争断断续续持续了三十多年，至今仍未结束。

      齐马罗沃是祖源轴心的盟主，与梅纳瓦利军政府结盟，却与更激进的卡波拉新秩序自由领长期不和，两国边境多次交火。经济是国家主导的军工体制，福罗纳的钢铁厂和兵工厂、伊拉希港的造船厂和国营农场是支柱，禁运使许多物资依赖走私。人均收入约五千美元。国内宣传无处不在，学校教授「血统史」，青年必须加入运动的青年团。三十多年来，二十多万人逃离这个国家，在邻国和海外形成了庞大的流亡社区。', en: "The National Socialist State of Tsimarovo lies in the south of Ranova, crossed by the Ilahy River from the Ivaka Mountains to the east coast; it covers some 99,000 km² with about 2.8 million people in five cities, its capital, Tsimarovo, in a basin on the upper Ilahy. Most of the country is dry upland and savanna, and the mouth of the Ilahy in the east is its only outlet to the sea, the port of Ilahy. \nIn the last years of the United Republic, veterans and nationalist youth groups in the south founded the National Socialist Movement, which claimed that the 'first settlers' of the highlands were Ranova's true masters and branded the indigenous clans, the coastal Kasiri and immigrants as 'outsiders'. After the Sundering the movement took the southern provinces by force and set up a one-party state in which the Leader holds unlimited power and the National Assembly exists to applaud his decisions. Residents are graded by 'certificates of lineage', and only first-class citizens may own land, hold office or be commissioned in the army. \nThe new state soon pushed south-west and began the Southern War, overrunning the grazing lands of the Alatsina clans, driving hundreds of thousands from their homes and giving the land to 'settler villages'. International investigators have repeatedly documented forced removals, collective punishment and detention camps, and neighbours and international bodies broadly enforce an arms embargo. The Southern War has gone on and off for more than thirty years and is not over. \nTsimarovo leads the Origin Axis and is allied with the Menavaly junta, yet has long been at odds with the still more radical New Order Free Territory of Kabola, and the two have exchanged fire on their border many times. The economy is a state-run war economy built on the steelworks and arsenal of Forona, the shipyard at Ilahy and state farms, and the embargo means many goods come in by smuggling. Income is about 5,000 dollars a head. Propaganda is everywhere, schools teach 'lineage history' and young people must join the movement's youth corps. Over thirty years more than 200,000 people have fled the country, forming large exile communities in neighbouring states and overseas."}
