  names: {zh: 马哈维洛, en: Mahavelo, art-x-ranova: Mahavelo}
  notes:
    zh: "马哈维洛是马哈维洛自由港的唯一城市，自由港全境就是这一座港城。它坐落在拉诺瓦岛东海岸以东不远的一座小岛上，面积约 1500 平方公里，人口约 90 万，每平方公里 600 人，是全岛人口最稠密的地方之一；岛上最高处海拔 457 米。这里属热带季风气候，年均气温 25.1 ℃，年降水约 3000 毫米，台风季节常有大风。集装箱码头、保税仓库、摩天楼和住宅楼占满了整座小岛，市旗是深蓝、白、深蓝三条横带，白带中一只深蓝铁锚，取自国旗；市花是九重葛，市树是榕树。\n联合共和国时期，马哈维洛是东南的自由贸易港。联合共和国解体时，港口的商会与中央政府签订条约，和平分离为自由港。行政长官西莫娜·马哈由以商界为主的选举委员会选出，在港区中心一座三十层大楼顶部的行政长官府办公，从会议室可以俯瞰整个集装箱码头。海滨公园旁的立法会大楼是一座面向大海的低矮玻璃建筑，四十名议员一半由地区直选，一半由航运、金融、贸易、地产等功能组别选出，直选议员近年多次要求增加公共住房、提高最低工资。城市和港口由港城管理局统一管理，总监唐雪松由自由港董事会任命。\n零关税、低税收和全天候运转的港口使它成为全岛的转口中心，人均产值约 5.8 万美元，服务业占八成。马哈维洛集装箱港是全岛吞吐量最大的港口，几十台龙门吊排列在填海造地的码头上，自动化码头夜里也灯火通明；填海建成的马哈维洛自由贸易区里，几百家公司把货物拆箱、重新包装后转运各地。马哈维洛国际机场建在人工岛上，二十四小时运营，是全岛货运量最大的机场。两百多米高的马哈维洛国际金融中心是城里最高的楼，证券交易所的指数是全岛经济的风向标，阵营局势一紧张就大幅波动。三十多年的战争中港口从未关闭，马哈维洛人常说「战争打了三十年，港口开了三十年」。\n繁华背后是狭小的住房和极快的节奏，城邦三分之一的人口住在填海地上的公共屋邨里，单位面积很小，轮候公屋要等好几年；许多码头工人和外籍家政工收入很低，贫富差距是全岛最大的之一。居民近半以拉诺瓦语为母语，英语、卡西里语和汉语也很通行，平均预期寿命 85.6 岁，65 岁以上的老人占 18%。\n傍晚开张的庙街夜市沿街排开几百个摊档，码头工人下班后常来大排档吃海鲜和粥面；与渡轮码头相连的海港城购物中心免收消费税，周末挤满乘渡轮来购物的邻国人。马哈维洛国家剧院的圆形屋顶仿照传统的编织斗笠，新年演出一票难求；国家博物馆里最受欢迎的展品是一艘长二十多米的古代远洋独木舟。入夜后从港口望去，灯火通明的高楼倒映在海面上，是东南群岛最著名的夜景。"
    en: "Mahavelo is the only city of the Free Port of Mahavelo, the whole of which is this one harbour city. It stands on a small island a short way off the east coast of Ranova, covering some 1,500 km² with about 900,000 people, or 600 per km², making it one of the most densely peopled places on the island; its highest point is 457 m. The climate is tropical monsoon, with a mean temperature of 25.1 °C and some 3,000 mm of rain a year, and strong winds are common in the typhoon season. Container terminals, bonded warehouses, towers and housing blocks fill the whole island. The city flag has three horizontal stripes of dark blue, white and dark blue with a dark blue anchor in the white, taken from the national flag; the city flower is the bougainvillea and the city tree the banyan.\nUnder the United Republic, Mahavelo was the free-trade port of the south-east. When the United Republic broke apart, the port's chamber of commerce signed a treaty with the central government and separated peacefully as a free port. The Chief Executive, Simona Maha, is chosen by an election committee drawn mostly from business and works in the Chief Executive's Office at the top of a thirty-storey building in the middle of the port district, whose meeting room looks out over the whole container terminal. The Legislative Council Building beside the waterfront park is a low glass building facing the sea; half of its forty members are elected directly by district and half by functional constituencies such as shipping, finance, trade and property, and in recent years the directly elected members have repeatedly called for more public housing and a higher minimum wage. The city and the port are run together by the City and Port Authority, whose director-general, Tang Xuesong, is appointed by the Free Port's board.\nZero tariffs, low taxes and a port that never closes make it the island's transshipment hub; output per head is about US$58,000 and services account for 80%. The Mahavelo Container Port handles more containers than any other port on the island, with dozens of gantry cranes lined up on reclaimed quays and its automated terminal lit up all night; in the Mahavelo Free Trade Zone, also built on reclaimed land, hundreds of firms unpack, repack and forward goods. Mahavelo International Airport, on an artificial island, runs around the clock and handles more freight than any other airport on the island. The Mahavelo International Finance Centre, more than two hundred metres high, is the city's tallest building, and the index of the stock exchange is the barometer of the island's economy, swinging sharply whenever tension rises between the blocs. The port never closed in more than thirty years of war, and Mahavelans like to say, 'Thirty years of war, thirty years of open port.'\nBehind the prosperity lie cramped homes and a frantic pace. A third of the city-state's people live in public housing estates on reclaimed land, where the flats are tiny and families wait years for one; many dockers and foreign domestic workers earn very little, and the gap between rich and poor is among the widest on the island. Nearly half the residents speak Ranovan as their mother tongue, and English, Kasiri and Chinese are widely used; life expectancy is 85.6 years, and people aged 65 and over make up 18% of the population.\nThe Temple Street Night Market opens in the evening with hundreds of stalls along the street, and dockers come off shift to its open-air food stalls for seafood, congee and noodles; Harbour City Mall, connected to the ferry pier, charges no sales tax and fills at weekends with shoppers from neighbouring countries who come over by ferry. The round roof of the Mahavelo National Theatre is modelled on a traditional woven hat, and its New Year performances sell out; the most popular exhibit in the National Museum of Mahavelo is an ancient ocean-going canoe more than twenty metres long. After dark, seen from the harbour, the lit towers reflected in the water make the most famous night view in the south-eastern islands."
