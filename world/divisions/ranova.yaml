  names: {zh: 安德拉诺拉瓦, en: Andranolava, art-x-ranova: Andranolava}
  notes:
    zh: "安德拉诺拉瓦是大天使军团国北部内陆的农业城市，全国三座城市之一，名字意为「长水」，得名于城边一条狭长的湖。全市面积约 3000 平方公里，人口约 22 万。城区在海拔约 150 米的低丘之间，四周的山丘最高 469 米。安德拉诺拉瓦湖在城东南顺着谷地伸展，水面约 45 平方公里。这里年均气温 25.7 摄氏度，年降水只有约 420 毫米，一月到三月几乎无雨，两岸的水田全靠湖水经堤坝和水渠灌溉。城北不远就是大衡王朝和转轮无边法王国的边界。\n湖岸的长湖稻田是全国最大的产稻区，一年两熟。田地由军团合作社分配，阵亡军团员的家属优先分得最好的水田；插秧和收割季节，城里的居民被组织去完成「荣誉劳动」，每个成年人每年都要无偿工作数周。第一产业占全市经济的 42%，人均生产总值只有约 1860 美元，低于全国平均。合作社市场是北部最大的集市，湖区的稻米、湖鱼、木薯和瘤牛在这里交易，收购价由合作社统一规定，农民须先交足定额才能把余粮拿来卖；每逢集日，市场入口的木板上贴满讣告和荣誉劳动的派工名单。\n城市由城市守夜团管理，守夜长安多·拉哈里由队长从本城的军团元老中任命，按惯例多是殉道者的父亲或兄弟；守夜团兼管城市事务和本城军团员的葬礼。和全国一样，公务员和教师都必须是宣过誓的军团员，年满十六岁的青年被要求在地宫中宣誓，领取一个将在自己葬礼上宣读的「亡名」；拒绝宣誓的「无誓者」不能担任公职、上公立中学或承租土地，在这座靠租田为生的城市里，这几乎等于断了生计。城东丘陵林地里的野战训练场是军团步兵和预备役的训练地，宣过誓的军团员每年旱季轮流来集训两周，派往南方战争的志愿军团出征前也在这里做最后的演练。\n北门检查站设在通往大衡王朝的旧国道上，大部分时间关闭，只在规定的日子放行运盐和运布的货车；紫衫卫队的哨兵检查每个出境者的誓约证，企图越境出逃的人会被送交荣誉法庭。三十多年来全国约六万人出逃，多是拒绝宣誓的年轻人。往南，一条约 78 公里的公路通往首都安博希马西，城东另有一条短路通往训练场。\n居民 94% 以拉诺瓦语为母语，37% 的人不满 15 岁，识字率约 51%，平均预期寿命不到 60 岁。北部唯一的安德拉诺拉瓦医院只有约二百张病床，药品和医生长期短缺，重病人要用卡车送到首都；疟疾和血吸虫病在湖区很常见，防疫站每年雨季前到湖边村庄喷洒药物。城里到处是黑框讣告和殉道者的画像。每年殉道者纪念日，城里的人在湖上放下纸灯，成串的灯顺着长湖漂向远处，老人说，每一盏都是一个没回来的儿子。市花是睡莲，市树是旅人蕉。"
    en: "Andranolava is a farming city of the northern interior of the Legionary State of the Archangel, one of the country's three cities; the name means \"long water\", for the narrow lake beside it. The city covers about 3,000 km² and has some 220,000 people. The town lies at about 150 m among low hills rising to 469 m. Lake Andranolava stretches along a valley south-east of the town, covering about 45 km². The mean temperature is 25.7 °C and the rainfall only about 420 mm a year, with almost none from January to March, so the paddies on both shores depend entirely on lake water brought by dykes and channels. The borders of the Great Heng Dynasty and the Kingdom of the Boundless Dharma Wheel lie a short way north.\nThe Long Lake Paddies on its shores are the largest rice-growing area in the country, yielding two crops a year. The fields are allotted by the Legion cooperatives, and the families of fallen legionaries get first choice of the best paddies; at planting and harvest the townspeople are organised to do \"honour labour\", and every adult must work several weeks a year unpaid. The primary sector makes up 42% of the city's economy, and output per head is only about $1,860, below the national average. The Cooperative Market is the largest market in the north, where the rice, lake fish, cassava and zebu of the lake country are traded; prices are fixed by the cooperatives, and farmers must deliver their quota in full before they may sell any surplus. On market days the boards at the entrance are covered with death notices and the duty rosters for honour labour.\nThe town is run by the City Vigil, whose Warden, Ando Rahary, is appointed by the Captain from among the city's Legion elders and is, as custom has it, usually the father or brother of a martyr; the Vigil runs the town's affairs and the funerals of its legionaries. As across the country, civil servants and teachers must all be sworn legionaries, young people of sixteen are expected to take the oath in the crypt and receive a \"death name\" to be read at their own funeral, and the \"unsworn\" who refuse may not hold office, attend a state secondary school or rent land, which in a town that lives by renting paddies all but cuts off their livelihood. The field training area in the wooded hills east of town is where the Legion's infantry and reserves train; sworn legionaries come in turn for two weeks of reserve training each dry season, and the volunteer legions bound for the Southern War hold their final exercises here before setting out.\nThe North Gate checkpoint stands on the old national road to the Great Heng Dynasty and is closed most of the time, opening only on set days for lorries carrying salt and cloth; sentries of the Violet Guard check the oath card of everyone leaving, and those caught trying to slip across are handed to the honour courts. Over more than thirty years some 60,000 people have fled the country, most of them young people who refused the oath. To the south a road of about 78 km leads to the capital, Ambohimasy, and a short road east of town serves the training area.\nNinety-four per cent of the people speak Ranovan as their mother tongue; 37% are under 15, literacy is about 51% and life expectancy under 60 years. Andranolava Hospital, the only hospital in the north, has some two hundred beds and is always short of medicines and doctors, and the seriously ill are taken to the capital by lorry; malaria and bilharzia are common round the lake, and every year before the rains its disease-control station sprays the lakeside villages. Death notices edged in black and portraits of martyrs are everywhere in town. Each year on Martyrs' Day the townspeople set paper lanterns on the lake, and strings of lights drift away down the long water; old people say each lantern is a son who did not come home. The city flower is the water lily and the city tree the traveller's palm."
