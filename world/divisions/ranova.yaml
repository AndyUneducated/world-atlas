  names: {zh: 马尔萨, en: Marsa, art-x-kasiri: Marsa}
  notes:
    zh: "马尔萨是贾巴利亚伊斯兰酋长国在西北海岸的小港，也是这个武装政权除山谷中的贾巴勒之外唯一的主要城镇。全市人口约 28 万，辖区约 1.66 万平方公里，从海边的盐滩一直延伸到干燥的贾巴勒丘陵，平均海拔 635 米，最高处 1845 米。气候属热带草原型，年均气温 24.7 ℃，年降水约 1255 毫米，二月最干，八月最湿。渔船和走私快艇共用一个码头；港外的小岛是武装分子的训练营地，周边国家的海军常在附近巡逻。\n联合共和国时期，西北山区是全岛最贫困、最闭塞的地方，马尔萨只是个靠打鱼和晒盐过活的小港。大分裂后的混乱中，一批在海外接受极端思想训练的武装人员回到山区，利用部落矛盾和对沿海富裕城市的不满扩张势力，宣布建立「酋长国」，并把萨希利亚斥为背教政权，西岸战争由此爆发。马尔萨被并入控制区后，港口成了武装组织通往海上的门户。\n马尔萨快艇码头是小港的一段码头，渔船和武装组织的快艇挤在一起；快艇在夜里出海，走私燃料、香烟和武器，也曾袭击过往的商船，码头边的渔民说他们宁愿离快艇远一点。港外小岛上的马尔萨外岛营地有几排简易营房、一片操场和沙袋围起的射击区；国际组织的报告指出，这类营地曾训练未成年人，并接收从岛外招募来的人员。马尔萨鱼市每天凌晨渔船靠岸后开市，金枪鱼、石斑鱼、龙虾和章鱼一个小时内就能拍卖完。海边的马尔萨盐田一块块方形盐池在烈日下闪着白光；盐是少数合法的出口产品之一，经陆路卖到萨希利亚，武装组织从每一车盐中抽税。渔业和农业占全市经济的 35%，人均生产总值只有约 1020 美元。\n对外的陆路是长约 145 公里的贾巴勒—马尔萨公路，翻过丘陵通往山谷里的贾巴勒；城南的马尔萨南路检查站过往的车辆和行人都要出示通行证并缴纳过路费。城镇由地方舒拉管理，城镇埃米尔哈米西·姆维尼由酋长国的舒拉会议指派，地方舒拉由他挑选的宗教人士和部族长老组成。\n居民 83% 以卡西里语为母语，13% 说拉诺瓦语。控制区禁止音乐、电视和照相，女孩小学之后不得上学，女性出行必须由男性亲属陪同，公开处罚屡见不鲜。马尔萨的人口年轻，人均预期寿命只有 57.6 岁，识字率 38.9%，许多家庭已逃往萨希利亚的难民营。留下的渔民凌晨出海、正午前回港，在码头边的小饭馆喝一碗鱼汤；有人偷偷收听海上传来的外国电台，听完就把收音机藏进渔网堆里。近年部分部落长老与萨希利亚政府秘密谈判，希望以特赦和发展援助换取武装人员放下武器，港口的人都在等消息。马尔萨没有市花和市树，城旗和贾巴勒一样只有图形没有图像，白底下方是黑色的海浪，表示这座西北海岸的小港。"
    en: "Marsa is the small port of the Islamic Emirate of Jabaliya on the north-west coast and, besides Jabal in its valley, the armed regime's only other main town. It has about 280,000 people and some 16,600 km² of territory, reaching from the salt flats by the sea up into the dry Jabal Hills, with a mean elevation of 635 m and a high point of 1,845 m. The climate is tropical savanna: the mean temperature is 24.7 °C and the annual rainfall about 1,255 mm, driest in February and wettest in August. Fishing boats and smugglers' speedboats share a single quay; the islet offshore is a militants' training camp, and neighbouring navies often patrol nearby.\nUnder the United Republic the north-western hills were the poorest and most isolated part of the island, and Marsa was just a small port living off fishing and salt. In the chaos after the Sundering a group of fighters trained in extremist ideas abroad returned to the hills, played on tribal rivalries and resentment of the wealthy coastal cities to spread their power, declared an \"emirate\" and denounced Sahilia as an apostate regime, which set off the West Coast War. Once Marsa was absorbed into the territory they control, its harbour became the armed group's gateway to the sea.\nThe Marsa Speedboat Jetty is a stretch of the small harbour where fishing boats crowd in with the armed group's speedboats; the speedboats go out at night to smuggle fuel, cigarettes and weapons and have attacked passing merchant ships, and the fishers on the quay say they would rather keep their distance. The Marsa Offshore Island Camp on the islet has a few rows of rough huts, a parade ground and a sandbagged firing range; international reports say camps like it have trained minors and taken in recruits from off the island. The Marsa Fish Market opens every dawn when the boats come in, and its tuna, grouper, lobster and octopus are auctioned within the hour. At the Marsa Salt Pans by the sea, square pans glitter white under the fierce sun; salt is one of the few legal exports, sold overland to Sahilia, and the armed group taxes every lorryload. Fishing and farming make up 35% of the economy, and output per head is only about US$1,020.\nThe only road out is the Jabal–Marsa Road, about 145 km over the hills to Jabal in its valley. The Marsa South Road Checkpoint south of town is where every vehicle and traveller must show a pass and pay a toll. The town is run by a Local Shura: the Emir of the Town, Hamisi Mwinyi, is named by the emirate's shura, and the local shura is made up of clerics and tribal elders of his choosing.\nKasiri is the mother tongue of 83% of residents and Ranova of 13%. Music, television and photography are banned in the territory, girls may not go to school after primary level, women may travel only with a male relative, and public punishments are common. Marsa's population is young, life expectancy is only 57.6 years and literacy 38.9%, and many families have fled to the refugee camps in Sahilia. The fishers who stay put to sea before dawn, come back before noon and have a bowl of fish soup in the eating houses by the quay; some secretly tune in to foreign radio drifting in over the sea and hide the set in a heap of nets afterwards. In recent years some tribal elders have been negotiating in secret with the government of Sahilia, hoping to trade amnesty and development aid for the fighters laying down their arms, and the harbour waits for news. Marsa has no city flower or tree; like Jabal's, its flag has shapes but no images, black waves along the bottom of a white field, standing for this small port on the north-west coast."
