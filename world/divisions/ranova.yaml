- id: div_qfht7f
  subtype: locality
  parent: div_1tan4g
  status: generated
  names: {zh: 齐阿拉, en: Tsiala, art-x-ranova: Tsiala}
  notes:
    zh: "齐阿拉是齐阿拉野化邦唯一的定居点，其实是散布在拉诺瓦岛西南端石灰岩尖峰林和多刺灌木林里的几十个营地，约 4 万人，面积约 1.37 万平方公里，每平方公里不到 3 人。这里没有电网、公路和货币。地势从海岸向内陆抬升，营地多在海拔 400 米上下的峡谷和河谷中，最高处 1644 米。气候半干旱，年均气温 24 摄氏度，年降水只有约 400 毫米，一二月几乎滴雨不下。国名意为「森林」，境内保留着全岛最完整的原始森林，狐猴、马岛长尾狸猫和变色龙随处可见。\n大分裂后，这片森林一度被伐木公司和金矿主瓜分。环保主义者、离开城市的知识分子和当地森林居民组成「回归运动」，赶走了伐木公司和金矿主，炸毁矿区道路，宣布「废除国家、废除工业、废除货币」。旧伐木场遗址里锈蚀的锯木机如今爬满藤蔓，营地的人把这里当作「森林会自己痊愈」的见证；森林边缘一排古老的猴面包树沿着早被野草吞没的旧公路路基排开，被称作猴面包树大道，最老的一棵据说已有上千年。\n最大的齐阿拉大营地住着几百户人家，长屋用树枝、棕榈叶和泥土搭成，中央是公共火塘和高脚粮仓；猴面包树营地、红河营地、狐猴谷营地、雾林营地、石溪营地和南坡营地各有几十户。营地每隔几年迁到森林的另一处，让土地休养。居民以采集、狩猎和小块轮作为生，轮作林园种两三年就休耕；共同猎场由长老圈划定季节和范围，不得猎杀怀孕的动物和幼兽。旱季结束时，各营地的人背着木薯茎、稻种、蜂蜜和编织品到种子交换场以物易物。\n营地之间的事务由各营地派出的长者组成的营地议事会协商，议事会推选的守林人费特拉·拉奈沃负责与外界交涉；每到满月，长老们在聚会林地的猴面包树下围火而坐，长老圈发言人齐里·安塔把结论转告外界。外人只能步行进入，须在边界接待站交出手机、相机等电子设备，换上营地的布鞋，由向导陪同入林；森林边缘援助联络站是与外界联系的唯一窗口，重病人从这里被抬出森林送医。北、西、东三处巡护站只是大树下的木棚，守护者不带武器，遇到偷猎者和伐木者只做记录。\n居民 92% 以拉诺瓦语为母语。孩子们学的是辨认植物、追踪动物和讲述祖先的故事，而不是读书写字，识字率约 37%；平均预期寿命不到 59 岁，人均收入只能估计，约 800 美元。病人先去疗愈林求治，长老们在祖先洞穴口献上蜂蜜和米酒。采野蜂蜜前要唱歌安抚蜂群，只取一半蜂巢；雨季前，各营地合力在鱼梁溪重修鱼梁。雨季开始时，人们聚集在猴面包树下，用歌声和鼓声迎接第一场雨。城旗用树皮纤维手工织成，只在营地之间传递；市花是猪笼草，市树是乌木。"
    en: "Tsiala is the only settlement of the Rewilded Polity of Tsiala, in truth dozens of camps scattered through the limestone pinnacle forest and spiny thicket of Ranova's south-western tip: about 40,000 people on some 13,700 km², fewer than 3 to the square kilometre. There are no power lines, roads or money. The land climbs inland from the coast; most camps lie in gorges and valleys at around 400 m, and the highest point is 1,644 m. The climate is semi-arid, with a mean temperature of 24 °C and only about 400 mm of rain a year, and almost none at all in January and February. The name means \"forest\", and the polity keeps the most intact primeval forest on the island, where lemurs, fossas and chameleons are everywhere.\nAfter the Sundering this forest was for a time carved up between logging companies and gold-mine owners. Environmentalists, intellectuals who had left the cities and the local forest people formed a movement called the \"Return\", drove out the loggers and the mine owners, blew up the mine roads and proclaimed \"the abolition of the state, of industry and of money\". In the Old Logging Camp Ruins rusting sawmills are now covered in creepers, and the camps see the place as proof that \"the forest heals itself\"; at the forest's edge a row of ancient baobabs stands along the bed of an old road long swallowed by grass, called the Avenue of Baobabs, and the oldest is said to be a thousand years old.\nThe largest camp, the Great Camp of Tsiala, has several hundred households living in long houses of branches, palm leaves and mud round a common hearth and raised granaries; Baobab Camp, Red River Camp, Lemur Valley Camp, Mist Forest Camp, Stone Brook Camp and South Slope Camp have a few dozen households each. Every few years a camp moves to another part of the forest to let the land rest. People live by gathering, hunting and small shifting gardens: the Rotation Gardens are cropped for two or three years and then left fallow, and on the Common Hunting Ground the elders set the seasons and limits and forbid killing pregnant animals and young. When the dry season ends, people from every camp carry cassava cuttings, rice seed, honey and weaving to the Seed Exchange Ground to barter.\nMatters between the camps are settled by the Camp Council of elders sent by each camp, which chooses the Forest Warden, Fetra Ranaivo, to deal with the outside world; at each full moon the elders sit round the fire beneath the baobabs of the Elders' Circle Clearing, and the Speaker of the Circle of Elders, Tsiry Anta, passes their conclusions on. Outsiders may enter only on foot: at the Border Reception Post they must hand over phones, cameras and other electronic devices and change into the camps' cloth shoes before being led in by a guide. The Forest Edge Aid Liaison Post is the only window on the outside world, and the seriously ill are carried out of the forest from there to hospital. The three ranger posts, north, west and east, are just wooden shelters under big trees; the rangers carry no weapons and only record the poachers and loggers they meet.\nNinety-two per cent of the people speak Ranovan as their mother tongue. Children learn to know plants, track animals and tell the stories of the ancestors rather than to read and write, and literacy is about 37%; life expectancy is under 59 years, and income per head can only be estimated, at about $800. The sick go first to the Healing Grove, and elders offer honey and rice wine at the mouth of the Cave of the Ancestors. Before taking wild honey people sing to calm the bees, and they take only half the comb; before the rains the camps join to rebuild the weirs on Fish Weir Creek. When the rains begin, people gather beneath the baobabs to greet the first rain with song and drums. The city flag is hand-woven from bark fibre and passed only from camp to camp; the city flower is the pitcher plant and the city tree the ebony."
