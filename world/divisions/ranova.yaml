  names: {zh: 马罗瓦托, en: Marovato, art-x-ranova: Marovato}
  notes:
    zh: "马罗瓦托是阿瓦拉齐社会主义共和国南部内陆的工业城市，名字意为「多石之地」。全市人口约 70 万，辖区约 2.6 万平方公里，平均海拔 228 米，最高处 2379 米。气候属热带草原型，年均气温 23.5 ℃，年降水约 2035 毫米，五月到十月是雨季。铬矿、镍矿和冶炼厂支撑着国家的出口，城南面向高原战争的停火线，是军区司令部和兵工厂的所在。\n联合共和国时期，这里已是北方的矿业基地，矿工工会是左翼运动的骨干。大分裂时工人赤卫队接管了矿山，社会主义共和国把它收归国有。高原战争期间，人民军从这里出发攻上高原，后被联邦军击退，此后城南的高原北路在停火线上被两道铁丝网和雷区截断，只有停火线口岸在每月固定的日子开放，供离散家庭团聚。\n马罗瓦托铬镍矿是全国最大的矿山，雇有数千名矿工，矿石在附近的冶炼厂炼成铬铁和镍锍，冶炼厂的烟尘让周边的山坡寸草不生，政府近年开始在废弃的矿坑里种树。马罗瓦托钢铁联合企业是全国最大的国营工厂，有高炉、转炉和轧钢车间，雇有上万名工人，厂区里有自己的学校、医院和俱乐部。工业占全市经济的 48%，人均生产总值约 4780 美元，略高于全国平均。城郊高地上是人民军司令部，主楼前是阅兵场，地下指挥所据说能抵御空袭；第二步兵旅驻在马罗瓦托兵营，第一装甲旅驻在装甲兵营。马罗瓦托国营兵工厂沿山谷排开，生产步枪、迫击炮和弹药，是当地最大的雇主；城外的野战训练场是全国最大的陆军训练场。\n马沃重载铁路是全国的出口生命线，从铬镍矿货运站出发向东北通往首都沃希马希港，全长约 310 公里，红星重载列车每列六十节货车、净载约四千二百吨，每天四列，时速 100 公里，全程三个多小时，一年运量约六百万吨。领道 S-RA-106 北方公路经过城区，向北连着首都沃希马希和察拉沃卡，向南经友谊口岸通往马索沃利的菲拉纳，运拖拉机和大米的车队每天经过口岸。\n城市由市人民委员会管理，委员会由国家人民议会任命，执行共产党市委的决定，主席凡嘉·兰德里亚马纳纳通常也兼任市委第一书记。居民 90% 以拉诺瓦语为母语，人均预期寿命 68.9 岁，识字率 81.7%，成年人都编入工农赤卫队。矿工住在矿区边的工人新村，商店门口常排着长队，钢厂高炉的火光在夜里照亮半边天。满载矿石的列车被叫做「红色长龙」，车头挂着红旗，季度计划提前完成时，矿区广播会播报当天开出的列车数，工人新村的孩子站在路边数车皮，数对了能领一块糖。市花是芦荟花，市树是刺桐；市旗深灰底上一个红色山形，正中一对白色矿镐，红色是冶炼厂的炉火。"
    en: "Marovato is the industrial city of the southern interior of the Socialist Republic of Avaratsy; its name means \"many stones\". It has about 700,000 people and some 26,000 km² of territory, with a mean elevation of 228 m and a high point of 2,379 m. The climate is tropical savanna: the mean temperature is 23.5 °C and the annual rainfall about 2,035 mm, with the rains from May to October. Chromium and nickel mines and smelters carry the country's exports, and the south of the city, facing the Highland War ceasefire line, is home to the military district headquarters and the arsenal.\nUnder the United Republic this was already the north's mining base, and the miners' unions were the backbone of the left. In the Sundering the workers' Red Guards took over the mines and the Socialist Republic nationalised them. In the Highland War the People's Army set out from here and fought its way up onto the highlands before the federation's army threw it back; since then the Highland North Road south of the city has been cut at the ceasefire line by two barbed-wire fences and minefields, and only the ceasefire-line crossing opens, on fixed days each month, so that divided families can meet.\nThe Marovato Chromium and Nickel Mine is the country's largest, employing several thousand miners; its ore is smelted nearby into ferrochrome and nickel matte, the smelters' fumes have left the surrounding slopes bare, and in recent years the government has begun planting trees in the worked-out pits. The Marovato Iron and Steel Combine is the country's largest state enterprise, with blast furnaces, converters and rolling mills, more than 10,000 workers and its own schools, hospital and club. Industry makes up 48% of the economy and output per head is about US$4,780, a little above the national average. On high ground on the outskirts stands the People's Army Headquarters, with a parade ground before the main building and an underground command post said to withstand air raids; the 2nd Infantry Brigade is based at the Marovato Barracks and the 1st Armoured Brigade at the Armoured Barracks. The Marovato State Arms Factory, strung along a valley, makes rifles, mortars and ammunition and is the biggest local employer, and the field training area outside town is the country's largest army range.\nThe Marovato–Vohimahy Heavy-Haul Railway is the country's export lifeline, running north-east from the mine's freight yard to the port of the capital, Vohimahy, about 310 km away. Its Red Star heavy-haul trains of sixty wagons carry some 4,200 tonnes net, four a day, at 100 km/h, taking just over three hours, about six million tonnes a year. The Northern Road, territorial road S-RA-106, passes through the city, leading north to the capital, Vohimahy, and Tsaravoka and south through the Friendship Crossing to Firana in Masovoly; convoys of tractors and rice pass through the crossing every day.\nThe city is run by the City People's Committee, appointed by the National People's Assembly to carry out the decisions of the Communist Party city committee; its chairman, Fanja Randriamanana, as is usual, is also the committee's first secretary. Ranova is the mother tongue of 90% of residents, life expectancy is 68.9 years and literacy 81.7%, and every adult belongs to the Workers' and Peasants' Red Guards. Miners live in the workers' new villages beside the mine, queues often form outside the shops, and the glow of the blast furnaces lights half the night sky. The loaded ore trains are called \"red long dragons\" and carry a red flag on the locomotive; when the quarterly plan is met early the mine's loudspeakers announce how many trains left that day, and children from the workers' villages stand by the track counting wagons, those who get it right earning a sweet. The city flower is the aloe flower and the city tree the coral tree; the city flag has a red mountain on dark grey with a pair of white miner's picks in the middle, the red being the glow of the smelters."
