  names: {zh: 瓦瓦哈迪, en: Vavahady, art-x-ranova: Vavahady}
  notes:
    zh: "瓦瓦哈迪是太阳神国度东部的隘口城市，城名意为「门」，是王国三座城市之一。全市面积约 4200 平方公里，人口约 14 万。城区坐落在海拔近 2000 米的山谷里，四周的山峰最高 2434 米；它守着通往齐马罗沃的东隘和北面通往转轮无边法王国的日门山口。高山上气候凉爽，年均气温 18.3 摄氏度，年降水约 1160 毫米，雨季在五月到十月，二月最干。山谷两侧梯田密布，层层修进云里，种着土豆、金藜和喂养维洛纳驼的牧草，这种长毛驮兽是山里唯一的运输工具。\n城市的事务由城仓与劳役署掌管。仓守托乔·兰德里亚由所在一方的总督以太阳之子的名义任命，掌管城中的粮仓和劳役名册；各村社推举的头人每月在仓署前与他和结绳官核对账目，账目记在彩色绳结上。土地属于村社，村社每年按人口分田，另有两块田分别为太阳神庙和王家粮仓耕种；百姓不交税，每户每年出一名成年人服一到三个月的劳役，修路、修梯田、守粮仓、下矿和当兵。东部山村的劳役最重，金矿和石堡都靠村民服役维持。四方村社头人会的召集人汉塔·拉索洛福就是南谷一个村社的女头人，她的村子每年都要派人去金矿服役。\n城外的瓦瓦哈迪金矿开采山谷里的金矿脉，矿工是服劳役的村民和被罚来服役的犯人，黄金大多送往都城装饰太阳神庙的金墙，其余在安西拉的交易所换成药品和枪支；人权组织批评矿井条件恶劣，罚役的犯人每天工作十个小时以上。种植业、采矿和国防是三大行业，第二产业占 40%，外界估计人均收入约 1790 美元。环形梯田种子场是一组同心圆形的下沉梯田，每一级的温度都不一样，农官在这里试种土豆和金藜，保存着上百个土豆品种。\n东面山口上的东隘石堡有三道之字形石墙，山地军第一旅驻守在这里，齐马罗沃的巡逻队越境时，石堡点起烽火，由驿卒把消息传往都城。东隘检查站大部分时间关闭，每月只有几天放行运盐和驼毛的驮队；逃离齐马罗沃的人大多翻山绕过检查站，被山地军收容后送进城外的东谷难民营，约九千人住在那里，多是被齐马罗沃列为「外人」的原住民家庭。北面约 7 公里的日门山口，冬至的太阳正好从两座山峰之间升起，法王国的僧侣在另一侧建了一座白塔，两国都主张山口归己。一条约 72 公里的公路向西通往都城。\n居民 91% 以拉诺瓦语为母语，38% 的人不满 15 岁，识字率约 57%。村民离开所在的一方须持结绳通行证。每年冬至的太阳节，朝圣者赶在黎明前登上日门山口迎日，驿卒把都城取来的新火沿王道接力送进每个村庄，家家喝一碗金藜土豆汤。市花是火焰兰，市树是山地刺槐，城旗上的深红塔楼就是守隘的石堡。"
    en: "Vavahady is the pass city of the east of the Realm of the Sun God; the name means \"gate\", and it is one of the kingdom's three cities. The city covers about 4,200 km² and has some 140,000 people. The town lies in a valley at nearly 2,000 m, with peaks around it rising to 2,434 m, and it guards the East Pass into Tsimarovo and, to the north, the Sun Gate Pass into the Kingdom of the Boundless Dharma Wheel. The mountain climate is cool, with a mean temperature of 18.3 °C and about 1,160 mm of rain a year; the rains fall from May to October and February is the driest month. Terraces crowd both sides of the valley, climbing tier on tier into the clouds and growing potatoes, golden goosefoot and fodder for the vilona, the long-haired pack animal that is the only transport in the mountains.\nThe city's affairs are in the hands of the Storehouse and Labour Office. The Keeper of the Storehouse, Tojo Randria, is appointed by the governor of its quarter in the name of the Son of the Sun and holds the city's granaries and labour rolls; every month the headmen chosen by the village communities check the accounts, kept in coloured knotted cords, with him and the cord-keepers at the storehouse door. The land belongs to the village communities, which share out the fields each year by headcount, with two more fields farmed for the Temple of the Sun and the royal granaries; people pay no taxes, but each household sends one adult for one to three months of labour service a year, building roads, mending terraces, guarding granaries, working the mines and serving as soldiers. Labour service weighs heaviest on the eastern hill villages, which keep the gold mine and the fortress going. Hanta Rasolofo, convener of the Assembly of Village Headmen of the Four Quarters, is the woman headman of a village in the south valley that sends people to the gold mine every year.\nThe Vavahady Gold Mine outside town works the gold veins of the valley with villagers on labour service and convicts sentenced to it; most of the gold goes to the capital to adorn the golden wall of the Temple of the Sun, and the rest is traded at the exchange in Ansira for medicines and guns. Human rights groups criticise the harsh conditions in the shafts, where convict labourers work more than ten hours a day. Farming, mining and defence are the three main trades, industry makes up 40% of the economy, and income per head is estimated from outside at about $1,790. The Ring Terraces Seed Station is a set of concentric sunken terraces, each level a different temperature, where agricultural officers try out potatoes and golden goosefoot, and it keeps more than a hundred varieties of potato.\nThe East Pass Fortress on the mountain pass to the east has three zigzag stone walls and is held by the Mountain Army's 1st Brigade; when Tsimarovo patrols cross the border, beacons are lit on the fortress and relay runners carry the news to the capital. The East Pass Checkpoint is closed most of the time, opening for only a few days each month for caravans of salt and vilona wool; most people fleeing Tsimarovo cross the mountains round it, are taken in by the Mountain Army and sent to the East Valley Refugee Camp outside town, where some nine thousand people live, most of them indigenous families classed by Tsimarovo as \"outsiders\". At the Sun Gate Pass, some 7 km to the north, the midwinter sun rises exactly between two peaks; monks of the Dharma Wheel kingdom have built a white stupa on the far side, and both countries claim the pass. A road of about 72 km leads west to the capital.\nNinety-one per cent of the people speak Ranovan as their mother tongue; 38% are under 15 and literacy is about 57%. Villagers need a knotted-cord pass to leave their quarter. At the Festival of the Sun at the winter solstice, pilgrims climb to the Sun Gate Pass before dawn to greet the sun, relay runners carry the new fire from the capital along the royal roads into every village, and every household eats a bowl of golden goosefoot and potato soup. The city flower is the fire orchid and the city tree the mountain acacia, and the deep red tower on the city flag is the fortress that guards the pass."
