  names: {zh: 安博希马西, en: Ambohimasy, art-x-ranova: Ambohimasy}
  notes:
    zh: "安博希马西是大天使军团国的首都和唯一的港口，名字意为「神圣的山丘」，建在西海岸海湾边的一道石灰岩山脊上。市域约 3600 平方公里，最高处海拔 493 米，人口约 33 万。这里气候干热，年均气温 25.7 ℃，年降水约 350 毫米，一到三月几乎无雨。市旗紫底黑边，正中一团金色火焰，象征殉道者地宫里昼夜不熄的烛火；市花是鸡蛋花，市树是罗望子。\n山顶是殉道者大殿，一座灰白石灰岩砌成的圆顶建筑，守夜议会在这里开会，队长在这里宣誓就职。大殿下凿入山体的地宫安放着创团队长坦特利·兰杰瓦和数千名殉道者的遗骨，每个壁龛前点着一盏油灯，由守墓人昼夜看守；年满十六岁的青年在这里手持蜡烛宣誓，领取将在自己葬礼上宣读的「亡名」。兰杰瓦正是在这座港口的战斗中被打死的，军团国在他的灵柩前宣布成立。山坡上的队长府原是一所神学院，大天使兄弟会就在它的地下墓室里成立，现任队长埃里佐·拉钦曼德雷西每天清晨在院里的小礼拜堂主持守夜祈祷。紫灰色的军团总部「紫衫楼」存放着每一名军团员的誓词和「忠诚记录」。城市由城市守夜团管理，守夜长齐里·拉托沃由队长任命，通常是殉道者的亲属。\n从港区通到山顶的殡仪大道两旁立着殉道者的石碑，每位殉道者的灵柩都由军团员抬着沿大道上山；每年殉道者大殡日，全城居民手持蜡烛列队游行一整夜。守夜主教座堂原是天主教堂，被驱逐的原堂区神父至今在安博哈拉要求归还；港区的海星圣母堂是境内少数仍属于主流教会的教堂，军团员常在门外登记来做礼拜的人，渔民出海前仍会去点一支蜡烛。军团荣誉法庭不公开审判，「背誓罪」最重可判死刑；城东谷地的荣誉劳动营里，「无誓者」和被判「劳动赎誓」的人开采石料，国际组织的探视要求从未获准。\n经济以行政与公共服务、渔业和港口为主，人均产值约 1890 美元。港湾里停着渔船、来自梅纳瓦利的货船和海岸巡逻艇；武器禁运下，武器、燃料和外汇几乎都经梅纳瓦利周转。鱼市的渔获要先按定额交给军团合作社，罐头厂的产品经梅纳瓦利转口，是少有的外汇来源。志愿军团员先在安博希马西兵营集训，领取亡名，再从港口乘船前往南方战场。公路向北通往安德拉诺拉瓦，约 78 公里；向南通往瓦托福齐，约 45 公里。\n居民九成以上说拉诺瓦语，平均预期寿命 59.0 岁，识字率约 52%。安博希马西总医院药品短缺，优先收治军团员和殉道者家属。守夜之声广播电台每晚八点宣读当天新增的殉道者名单和法庭判决；收听外国电台被视为「动摇誓言」，但仍有人偷偷收听。合作社中央市场的入口贴着当天的讣告，「无誓者」只能在城外的路边摆摊。"
    en: "Ambohimasy is the capital and only port of the Legionary State of the Archangel; the name means 'holy hill'. It is built on a limestone ridge above a bay on the west coast. Its territory of some 3,600 km² rises no higher than 493 m, and it has about 330,000 people. The climate is hot and dry, with a mean temperature of 25.7 °C and about 350 mm of rain a year; from January to March there is almost none. The city flag has a golden flame on purple within a black border, for the candles that burn day and night in the crypt of the martyrs; the city flower is the frangipani and the city tree the tamarind.\nOn the summit stands the Hall of the Martyrs, a domed building of pale grey limestone where the Vigil Council meets and each Captain is sworn in. In the crypt cut into the hill beneath it lie the remains of the Founding Captain, Tantely Ranjeva, and thousands of martyrs; an oil lamp burns before every niche, watched day and night by tomb keepers, and here young people of sixteen swear the oath candle in hand and receive the 'death-name' to be read at their own funerals. Ranjeva was killed in the fighting for this very port, and the Legionary State was proclaimed over his coffin. The Captain's House on the hillside was once a seminary, and the Brotherhood of the Archangel was founded in its underground crypt; the present Captain, Herizo Ratsimandresy, leads the vigil prayer every morning in its small chapel. The violet-grey Legion Headquarters, the 'Violet House', keeps the oath and 'loyalty record' of every legionary. The city is run by the City Vigil; its Warden, Tsiry Ratovo, is appointed by the Captain and is usually a martyr's relative.\nThe Avenue of Funerals, climbing from the harbour to the summit, is lined with martyrs' memorial stones; every martyr's coffin is carried up it by legionaries, and on the Great Funeral Day each year the whole city processes along it all night, candles in hand. The Cathedral of the Vigil was once a Catholic church, and its expelled parish priest still demands its return from Ambohara; the Church of Our Lady Star of the Sea in the harbour district is one of the few churches in the country still belonging to a mainstream church, legionaries often stand at its door noting down those who come to worship, and fishermen still go in to light a candle before putting to sea. The Legion Court of Honour holds its trials behind closed doors, and 'oath-breaking' can carry the death penalty; in the Ambohimasy Honour Labour Camp in a valley east of town, the 'unsworn' and those sentenced to 'atone the oath by labour' quarry stone, and international requests to visit have never been granted.\nThe economy rests on government and public services, fishing and the port; output per head is about US$1,890. Fishing boats, freighters from Menavaly and coastal patrol boats share the harbour, and under the arms embargo almost all weapons, fuel and foreign currency pass through Menavaly. Part of the catch at the fish market must first go to the Legion co-operative by quota, and the cannery's output, sold on through Menavaly, is one of the few sources of foreign currency. Volunteer legionaries train at Ambohimasy Barracks, receive their death-names and then sail from the port for the Southern War. Roads run north to Andranolava, about 78 km, and south to Vatofotsy, about 45 km.\nMore than nine in ten residents speak Ranovan, life expectancy is 59.0 years and literacy about 52%. Ambohimasy General Hospital is short of medicines and treats legionaries and martyrs' families first. Every evening at eight the Voice of the Vigil Radio reads out the day's new martyrs and the court's verdicts; listening to foreign stations counts as 'wavering in the oath', but some still listen in secret. At the entrance to the Cooperative Central Market the day's death notices are posted, and the 'unsworn' may only sell from the roadside outside town."
