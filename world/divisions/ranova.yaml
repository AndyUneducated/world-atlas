# ── 阿瓦拉齐社会主义共和国 ──
- id: div_r9whm0
  subtype: country
  status: generated
  names: {zh: 阿瓦拉齐社会主义共和国, en: Socialist Republic of Avaratsy, art-x-ranova: Repoblika Sosialistan'i Avaratsy}
  short_names: {zh: 阿瓦拉齐, en: Avaratsy}
  notes:
    zh: "阿瓦拉齐社会主义共和国位于拉诺瓦岛最北端，国名意为「北方」，面积约十一万平方公里，人口约三百二十万，下设五个城市，首都沃希马希是东北海岸的港城。北部有全岛最高的马洛卡山，主峰三千二百多米，东坡是潮湿的雨林，西坡干燥，河谷里是成片的稻田和甘蔗园。\n联合共和国时期，北方是工会和左翼运动最强的地区。大分裂时，共产党领导工人赤卫队接管了港口和矿山，宣布成立社会主义共和国，实行一党制和计划经济，土地收归集体农庄，大中企业全部国有化。共产党政治局是最高权力机关，总书记兼任国家主席；人民代表大会每年开会一次，代表由党组织提名；三百个议席中，共产党占二百七十席，共产党领导的人民政治协商委员会和民主党派联合会各占十五席，两者从不投反对票。\n现任共产党总书记兼国家主席是米拉·安德里安托。最高人民法院有 9 名法官，向人民代表大会负责，法官由党组织提名；涉及国家安全的案件由国家安全部移送特别法庭审理，辩护律师须经批准才能执业。阿瓦拉齐人民军现役约六万人、预备役约十五万人，另有人民内卫军负责边境和国内安全；男性 18 岁起服 36 个月义务兵役，女性服 24 个月，17 至 60 岁的成年人一律编入工农赤卫队，每年参加军训。约 62% 的居民不信教，新教徒和祖灵信仰者各约 14%。外国游客须参加官方旅行团，沿海经济区以外的行程受到限制，停火线一带禁止进入；中国是共和国背后的支持者。解放日这天，沃希马希港举行阅兵，晚上家家吃椰汁鱼配米饭，工厂球队之间的足球赛是全城最热闹的去处。\n建国之初，共和国与南方的安博哈拉基督教联邦爆发高原战争，人民军一度攻上高原，后被联邦军击退，此后双方在停火线两侧修筑了绵延的碉堡和雷区。战争和封锁使国家长期处于半军事化状态，军费占国内生产总值六个百分点以上，每个成年人都要参加工农赤卫队。\n阿瓦拉齐是世俗协约的盟主，与马索沃利结成兄弟同盟，并与贝洛瓦、瓦罗纳、萨马伊等资本主义国家维持务实合作，共同对抗信仰和血统阵营。沿海战争中，阿瓦拉齐夹在兄弟之邦马索沃利和多年的贸易伙伴法尼里公社（今伊瓦洛自由公社联合会）之间，只呼吁「双方克制」，出面斡旋停止了炮击，却既不谴责也不承认吞并，兄弟铁路上的列车照常开往安德里安巴。铬、镍和造船是主要的出口来源，但计划经济效率低下，商店里常年排队，人均收入只有约四千五百美元，许多年轻人设法出海谋生。近年政府开放了沿海经济区，允许外资和私人小商店经营，港口城市渐渐热闹起来。兄弟铁路自首都沃希马希沿东海岸南下，经安科里卡通往马索沃利的首都安德里安巴，是全岛唯一连接两国的铁路；马沃重载铁路则把马罗瓦托矿区的铬镍矿石运到沃希马希港。阿瓦拉齐人以北方的坚韧自豪，说「马洛卡山挡住了风暴，也挡住了敌人」。"
    en: "The Socialist Republic of Avaratsy is at the northern end of Ranova; its name means 'the north'. It covers about 110,000 km² with some 3.2 million people in five cities, and its capital, Vohimahy, is a port on the north-east coast. The north rises to the Maroka Massif, the island's highest mountains at over 3,200 m, with wet rainforest on the east side, a dry west side, and paddies and sugar cane in the valleys. \nUnder the United Republic the north was the stronghold of the unions and the left. In the Sundering the Communist Party led the workers' red guards in taking over the ports and mines and proclaimed a Socialist Republic: one party, a planned economy, land collectivised into farms and all large and middle-sized firms nationalised. The Politburo of the Communist Party holds supreme power, its General Secretary also serving as President; the People's Congress meets once a year, its deputies nominated by the party; of its 300 seats the Communist Party holds 270, and the People's Political Consultative Committee and the Federation of Democratic Parties, both led by the Communist Party, hold fifteen each and never vote against it. \nThe present General Secretary of the Communist Party and President is Mira Andrianto. The Supreme People's Court has nine judges, answers to the People's Congress and is nominated by the party; cases touching state security are sent by the Ministry of State Security to special tribunals, and defence lawyers need approval to practise. The Avaratsy People's Army has some 60,000 active personnel and about 150,000 reservists, and the People's Internal Security Troops guard the borders and internal order; men serve 36 months from the age of 18 and women 24, and every adult aged 17 to 60 belongs to the Workers' and Peasants' Red Guards and trains every year. About 62% of the people profess no religion, and Protestants and followers of ancestral religion make up about 14% each. Foreign visitors must join official tours, travel outside the coastal economic zones is restricted and the ceasefire line is off limits; China is the republic's backer. On Liberation Day there is a parade in the port of Vohimahy, every household eats fish in coconut milk with rice in the evening, and football between the factory teams is the liveliest thing in town.\nIn its first years the Republic fought the Highland War with the Christian Federation of Ambohara to the south. The People's Army got onto the plateau before being driven back, and since then both sides have built long lines of bunkers and minefields along the ceasefire line. War and blockade have kept the country half on a war footing, with defence taking more than 6% of output and every adult serving in the Workers' and Peasants' Red Guards. \nAvaratsy leads the Secular Accord. It is bound in a fraternal alliance with Masovoly and keeps up practical co-operation with capitalist states such as Belova, Varona and Samay against the blocs of faith and blood. In the Coastal War, caught between its fraternal ally Masovoly and its long-standing trading partner the Faniry communes (now the Free Communes of Ivalo), it only urged 'restraint on both sides' and brokered an end to the shelling, neither condemning nor recognising the annexation, while the trains on the Fraternity Railway ran to Andriamba as usual. Chromium, nickel and shipbuilding are the main exports, but the planned economy is inefficient, queues outside the shops are a fact of life, income is only about 4,500 dollars a head, and many young people find ways to work abroad. In recent years the government has opened coastal economic zones and allowed foreign investment and small private shops, and the port cities have grown livelier. The Fraternity Railway runs south from Vohimahy down the east coast through Ankorika to Andriamba, the capital of Masovoly, the only railway on the island linking two states, and the Marovato–Vohimahy Heavy-Haul Railway carries chromium and nickel ore from the Marovato mines to the port of Vohimahy. Avaratsy people are proud of northern toughness, and say that 'the Maroka keeps out the storms, and the enemy too'."
