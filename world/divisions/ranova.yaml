- id: div_rxj1qr
  subtype: locality
  parent: div_dmf47n
  status: generated
  names: {zh: 阿纳拉, en: Anala, art-x-ranova: Anala}
  notes:
    zh: "阿纳拉是梅纳瓦利国家拯救共和国的内陆城市，也是首都梅纳瓦利之外唯一的城市。全市面积约 3 万平方公里，人口约 35 万，每平方公里不到 12 人。城区坐落在海拔约 120 米的草原上，往内陆是起伏的丘陵，最高处 1699 米。这里属半干旱气候，年均气温 25.5 摄氏度，年降水约 700 毫米，一月到三月每月只有 2 毫米雨，最热的四月午后气温常在 33 摄氏度以上。稀树草原上散布着马鲁拉树和金合欢，瘤牛群在其间吃草。\n阿纳拉是一座放牧城市，瘤牛放牧、种植业和采矿是三大行业，第一产业占全市经济的 49%。人均生产总值只有约 1890 美元，低于全国平均。稀树草原上的瘤牛和金矿是军官们的财源：阿纳拉金矿是全国最重要的矿山，露天矿坑旁是氰化提金厂和尾矿池，四周设有铁丝网和岗楼，矿工下班时要接受搜身；金矿收入是国家财政的支柱，国际组织多次指出矿区的环境和劳工状况令人担忧，而收入大多落进控制金矿的军官集团手里。\n政变后，各市的民选市议会被解散，改由国家拯救委员会派出的军官组成军管会，阿纳拉的军管会主任是费诺·拉扎芬德拉贝。全国实行宵禁、新闻审查和政党禁令，紧急状态从未解除，反对派领袖多被软禁或流亡贝洛瓦。城外的空军基地是军政府的王牌，一条三千米长的跑道两侧是加固机库、塔台和弹药库，两架战机全天候待命，接到警报几分钟内就能起飞，周围的村庄早已习惯了战机的轰鸣；每年国家拯救日，从这里起飞的攻击机编队低空飞过首都上空。城郊还驻有陆军第二步兵旅，城外大片草原和丘陵划成了全国最大的野战训练场，演习期间道路实行管制，牧民要把牛群赶到别处。\n南方公路在市境内长约 136 公里，西通首都梅纳瓦利，东往齐马罗沃，军政府在南方战争中为齐马罗沃提供基地和过境通道，军车和油罐车也走这条路。旱季时，牧民赶着成群的瘤牛沿公路去集市，汽车常要等上半个小时。一条约 8 公里的公路通往城外的瘤牛市场。\n居民 93% 以拉诺瓦语为母语，40% 的人不满 15 岁，识字率约 51%，平均预期寿命不到 60 岁。许多青年加入军队以求温饱，兵营门外的小店做的都是士兵的生意。每周一，瘤牛市场开市，几千头瘤牛从周边草原赶来，买卖双方围着牛群讨价还价，成交时互相拍手为定。瘤牛在这里是财富和聘礼的象征，一头健壮的公牛抵得上一个农民半年的收入，娶亲的人家要赶着牛群去女方村子。旱季的夜晚，牧人在营火边唱放牛的长歌，歌里数的是牛，不是星星。市花是金合欢花，市树是马鲁拉树，城旗上的金色是城外的金矿，绿色是放牧瘤牛的稀树草原。"
    en: "Anala is the inland city of the Salvation Republic of Menavaly and its only city other than the capital, Menavaly. The city covers about 30,000 km² and has some 350,000 people, fewer than 12 to the square kilometre. The town stands on the grassland at about 120 m, with rolling hills inland rising to 1,699 m. The climate is semi-arid: the mean temperature is 25.5 °C and the rainfall about 700 mm a year, with only 2 mm a month from January to March, and in April, the hottest month, afternoons are often above 33 °C. Marula trees and acacias are scattered over the savanna, with herds of zebu grazing among them.\nAnala is a herding city whose three main trades are zebu herding, farming and mining; the primary sector makes up 49% of its economy, and output per head is only about $1,890, below the national average. The zebu of the savanna and the gold mines are the officers' sources of wealth. The Anala Gold Mine is the country's most important mine, an open pit beside a cyanide leaching plant and tailings ponds, ringed with barbed wire and watchtowers, and miners are searched as they leave their shifts; gold is the mainstay of the national treasury, international bodies have repeatedly raised concerns about the mine's environment and working conditions, and most of the money ends up with the officers who control it.\nAfter the coup the elected city councils were dissolved and each city was put under a military administration of officers sent by the National Salvation Committee; Anala's Military Administrator is Feno Razafindrabe. The whole country lives under curfew, press censorship and a ban on parties, the state of emergency has never been lifted, and opposition leaders are mostly under house arrest or in exile in Belova. The air base outside town is the junta's trump card: a 3,000 m runway flanked by hardened hangars, a control tower and ammunition stores, with two fighters on standby round the clock, able to take off within minutes of an alert, and the villages around long used to their roar; every National Salvation Day, a formation of attack aircraft from here flies low over the capital. The Army's 2nd Infantry Brigade is also stationed on the outskirts, and great stretches of savanna and hills outside town form the country's largest field training area, where roads are closed during exercises and herders must drive their cattle elsewhere.\nThe Southern Road runs about 136 km within the city's bounds, west to the capital, Menavaly, and east to Tsimarovo; in the Southern War the junta gave Tsimarovo bases and transit, and military lorries and fuel tankers use the road too. In the dry season herders drive great herds of zebu along it to market, and cars often have to wait half an hour. A road of about 8 km leads to the zebu market outside town.\nNinety-three per cent of the people speak Ranovan as their mother tongue; 40% are under 15, literacy is about 51% and life expectancy under 60 years. Many young men join the army to be sure of food and clothing, and the little shops outside the barracks gate live on the soldiers' trade. Every Monday the zebu market opens and thousands of cattle are driven in from the surrounding savanna; buyers and sellers haggle round the herds and clap hands to seal a deal. Zebu here are a sign of wealth and the stuff of bride-price, a strong bull being worth half a year of a farmer's income, and a family seeking a bride drives its cattle to the girl's village. On dry-season nights herdsmen sing the long cattle songs by their campfires, songs that count cattle rather than stars. The city flower is the acacia blossom and the city tree the marula, and on the city flag the gold is the mine outside town and the green the savanna where the zebu graze."
