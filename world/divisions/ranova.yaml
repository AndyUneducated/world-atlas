# ── 瓦罗纳商业共和国 ──
- id: div_hxyyfe
  subtype: country
  status: generated
  names: {zh: 瓦罗纳商业共和国, en: Merchant Republic of Varona, art-x-ranova: Repoblika Mpivarotr'i Varona}
  short_names: {zh: 瓦罗纳, en: Varona}
  notes:
    zh: "瓦罗纳商业共和国是拉诺瓦岛西北外海的城邦，距离本岛北端不远，由一座主岛和东北面的一座小岛组成，面积约三千一百平方公里，人口约一百一十万，是全岛人口最密集的地方。全国只有瓦罗纳一座城市，高楼、船厂和集装箱码头密密麻麻地挤在岛上，转口港把本岛各国和海外的航线连接在一起。\n瓦罗纳在联合共和国时期就是西北最大的商港，由几个世代经营航运的商人家族主导。大分裂时，商人们组织城市卫队守住了港口，宣布建立商业共和国，并以「对所有人开放港口」为国策，交战各方的商船都可以在此停靠。共和国的大议会由全体公民选举产生，执政官由大议会从议员中选出，任期六年，不得连任。三大商会在议会中拥有大量席位，议会政治由自由商人党、海员工党等政党竞争。\n现任执政官是自由商人党的安娜·瓦罗尼。大议会共 75 席，全国为一个选区，按最大余额法分配，不设门槛；共和国不另设国家元首，执政官既代表共和国，也领导政务委员会，向大议会负责。上一次选举投票率 67.4%，自由商人党得 31 席，与港城公民党的 18 席组成联合政府，副执政官哈米西·卡西姆出自港城公民党；海员工党得 26 席，领袖马米·拉钦巴是反对党领袖。共和国没有义务兵役，瓦罗纳共和国海军现役约三千五百人，以护卫舰、巡逻艇和海上直升机保护商船航线；瓦罗纳城市卫队由志愿市民组成，每年集训两周，延续着大分裂时守住港口的传统。天主教徒约占 38%，不信教者约 34%，新教徒约 18%；中国是共和国背后的支持者。\n瓦罗纳是世俗协约的成员，在协约中扮演「钱袋」和「港口」的角色，许多协约成员的进出口都经由瓦罗纳转运。共和国保障言论和新闻自由，法律体系以商法见长，国际仲裁庭设在这里。人均收入约五万二千美元，但住房极其紧张，普通家庭住在狭小的高层公寓里，房价是全岛最高的。\n共和国与努西拉苏丹国在海上航道和渔业上存在竞争，两国的海军偶尔在海上对峙。瓦罗纳人以精明和务实著称，他们说「战争会结束，生意不会」。每年春季的海神节，几百艘装饰一新的船只在港内巡游，执政官把一枚金戒指投入大海，象征共和国与海洋的婚约。\n共和国赛船节时，各街区的赛艇队在港内争夺锦旗，岸边的小馆子里人人一盘墨鱼汁饭，吃得满嘴乌黑。"
    en: "The Merchant Republic of Varona is a city-state off the north-west of Ranova, not far from the northern end of the main island: a main island and a small one to its north-east covering some 3,100 km² with about 1.1 million people, the most densely settled place on the island. Varona is its only city, towers, shipyards and container quays crowded together on the island, and its entrepôt links the trade routes of the island's states with those overseas. \nUnder the United Republic Varona was already the largest port in the north-west, led by a few families who had been in shipping for generations. In the Sundering the merchants raised a city guard to hold the port and proclaimed a merchant republic whose policy was 'a port open to all', so that ships of every warring side could call. The Great Council is elected by all citizens, and the Doge is chosen by the council from among its members for six years and may not serve again. The three great merchant houses hold many seats, and council politics is a contest between parties such as the Free Merchants and the Seafarers' Labour Party. \nThe present Doge is Ana Varony of the Free Merchants' Party. The Great Council has 75 seats, elected across the whole country as one constituency by largest remainder with no threshold; the republic has no separate head of state, and the Doge both represents the republic and leads the Council of Government, answering to the Great Council. At the last election, on a turnout of 67.4%, the Free Merchants' Party won 31 seats and governs in coalition with the Harbour Citizens' Party's 18, whose Hamisi Kasimu is Deputy Doge; the Seafarers' Labour Party won 26 seats and its leader, Mamy Ratsimba, leads the opposition. There is no conscription: the Varona Republic Navy has about 3,500 active personnel and guards the merchant sea lanes with frigates, patrol boats and maritime helicopters, while the Varona City Guard is made up of citizen volunteers who train for two weeks a year, carrying on the tradition of the men who held the harbour during the Sundering. Catholics make up about 38% of the people, those of no religion about 34% and Protestants about 18%; China is the republic's backer.\nVarona belongs to the Secular Accord, where it plays the part of 'purse and port': many members' imports and exports pass through it. It guarantees freedom of speech and the press, its legal system is strongest in commercial law, and an international arbitration court sits here. Income is about 52,000 dollars a head, but housing is extremely tight; ordinary families live in cramped high-rise flats, and property prices are the highest on the island. \nThe Republic competes with the Sultanate of Nusira over sea lanes and fisheries, and their navies occasionally face off at sea. Varonese are known for being shrewd and practical; they say that 'wars end, business doesn't'. At the Sea Festival every spring hundreds of decorated boats parade round the harbour and the Doge throws a gold ring into the sea, a sign of the Republic's marriage to the ocean.\nAt the Regatta of the Republic each quarter's rowing crew competes for the pennant in the harbour, and in the little restaurants along the quay everyone eats a plate of squid-ink rice and ends up with a black-stained mouth."
