- id: div_zqxatj
  subtype: locality
  parent: div_zw79v9
  status: generated
  names: {zh: 安巴尼埃洛, en: Ambanielo, art-x-ranova: Ambanielo}
  notes:
    zh: "安巴尼埃洛是转轮无边法王国的都城，建在雪伞山西麓的高原谷地中，名字意为「伞下」。都城面积约 4300 平方公里，人口 19 万，每平方公里约 44 人，平均海拔约 1080 米，东面的雪伞山陡然升高；这里地处热带，山上从不下雪，「雪伞」之名来自佛经中护佑众生的白伞。气候温和，年平均气温约 19 °C，年降水约 1300 毫米，雨季从五月到十月，旱季的二月只有十毫米左右，全年日照约 2660 小时。佃农的村落和红米梯田环绕在谷底，几十座寺院和僧舍沿山坡层层排开。都城由大寺住持兼管：城寺执事会由掌城住持挑选的僧人组成，掌城住持由法王任命，平信徒的村长只能列席，不能表决。\n白伞宫坐落在城北的山脊上，是法王法哈扎瓦纳九世的宫殿，也是白伞宗的祖寺，白色石墙层层向上收拢，顶上的金色伞形宝顶从谷底每个村庄都能望见。宫下的白伞广场四周是大僧伽会议四十八名成员开会的大僧伽会议堂、司政首座和八个司办公的法政院，以及门前立着「王国不杀生」石碑的最高戒律院；寻访司在白伞宫东侧，第九世法王正是寻访僧在瓦瓦拉诺附近的佃农村里找到的。雪伞山西坡的雪伞大寺住着约四千名僧人，拥有都城周围大半的寺田；大经学院学制十五年，只收僧尼，王国的官职几乎都由它的毕业生担任。经藏阁收藏着上万卷佛经和寺院田册的副本，安巴尼埃洛印经院用上万块雕版手工印刷佛经和经幡。\n都城的经济几乎全是服务业，行政、朝圣和文化遗产占了九成，人均生产总值约 2480 美元。山坡上的药师园由学医的僧人照管，佃农轮流来除草采收，药材经大衡王朝出口，是少数能换外汇的商品。安巴尼埃洛寺院医院是王国唯一的综合医院，重病人常要被抬过山口，送到大衡王朝的医院去；萨马伊援建的雪伞溪水电站是王国唯一的电站，电只够白伞宫、寺院医院和都城中心的寺院用，大多数村庄夜里仍点油灯。安巴尼埃洛—瓦瓦拉诺公路向南通往关城瓦瓦拉诺。东谷难民营收容着约六千名翻越雪伞山口逃离齐马罗沃的人，大多是被血统登记局划为「外人」的原住民家庭，由雪伞大寺管理，齐马罗沃多次要求遣返，王国一直没有答应。佃农要离开庄园探亲、赶集或看病，都得先到法政院盖章领通行证，人权组织批评这一制度近似农奴制。\n每天清晨，白伞宫顶吹响海螺，全城的寺院随之开始早课；下午，大经学院的辩经场上拍掌声响成一片。安巴尼埃洛大集上，佃农用自家留下的粮食换盐、布、茶叶和铁器，寺院的管事每天来收摊位费；佃农们说，法王粮仓里的米比村里的多，可钥匙在僧人手里。一年中最热闹的是雨季结束时的白伞节：节前先有转山竞走，选手沿约三十公里长的雪伞山转山道绕主峰一周；节日当天，法王的轿子从宫门下到白伞广场，接受僧众和佃农的礼拜，再沿转经道绕城一周，各村的人背着新米赶来，路边摆满红米芋头糕。"
    en: "Ambanielo is the capital of the Kingdom of the Boundless Dharma Wheel, in an upland valley at the western foot of the Snow Parasol Mountains; its name means 'beneath the parasol'. It covers some 4,300 km² with 190,000 people, about 44 to the square kilometre, at an average height of about 1,080 m, with the Snow Parasol Mountains rising steeply to the east. This is the tropics and snow never falls on the mountains; the name 'Snow Parasol' comes from the white parasol of the sutras that shelters all living beings. The climate is mild, averaging about 19 °C, with some 1,300 mm of rain a year: the rains last from May to October, February in the dry season brings only about 10 mm, and the sun shines about 2,660 hours a year. Tenant villages and red rice terraces fill the valley floor, and dozens of monasteries and monks' quarters climb the slopes. The capital is run by the abbot of its great monastery: the Stewards of the Town Monastery are monks chosen by the Abbot-Warden, who is appointed by the Dharma King, and lay village heads may sit in but not vote.\nThe White Parasol Palace stands on the ridge north of the town, the palace of the Dharma King, Fahazavana IX, and the mother monastery of the White Parasol school; its white stone walls step inwards as they rise, and the golden parasol finial on top can be seen from every village in the valley. Around the White Parasol Square below it stand the Hall of the Great Sangha Council, where the council's forty-eight members meet, the Hall of Dharma Governance, where the Chief Steward and the eight offices work, and the Supreme Vinaya Court, with a stone at its gate inscribed 'The kingdom takes no life'. The Office of the Search is on the east side of the palace, and it was its searchers who found the ninth Dharma King in a tenant village near Vavarano. The Great Monastery of the Snow Parasol, on the western slope of the mountains, houses about 4,000 monks and owns most of the temple land around the capital; the Great College of the Scriptures takes only monks and nuns for a fifteen-year course, and almost every office in the kingdom is held by its graduates. The Hall of the Scripture Treasury keeps tens of thousands of scrolls of scripture and copies of the monasteries' land registers, and the Ambanielo Scripture Printing House prints scriptures and prayer flags by hand from tens of thousands of carved blocks.\nThe capital's economy is almost all services, with government, pilgrimage and heritage making up nine-tenths of it, and output per head is about 2,480 dollars. The Garden of the Medicine Buddha on the hillside is tended by monks trained in medicine, with tenants taking turns to weed and harvest, and its herbs, exported through the Great Heng Dynasty, are one of the few goods that earn foreign currency. The Ambanielo Monastery Hospital is the kingdom's only general hospital, and the seriously ill often have to be carried over the pass to hospitals in Great Heng; the Snow Parasol Brook Hydro Station, built with aid from Samay, is the kingdom's only power station, and its electricity is enough only for the palace, the hospital and the monasteries in the centre of the capital, so most villages still light oil lamps at night. The Ambanielo–Vavarano Road runs south to the gate town of Vavarano. The East Valley Refugee Camp shelters some 6,000 people who fled Tsimarovo over the Snow Parasol Pass, most of them indigenous families classed as 'outsiders' by its Blood Registry; the Great Monastery runs the camp, and the kingdom has always refused Tsimarovo's repeated demands to send them back. Tenants who want to leave their estate to visit family, go to market or see a doctor must first get a stamped pass from the Hall of Dharma Governance, a system human rights groups criticise as close to serfdom.\nEvery morning a conch sounds from the roof of the White Parasol Palace, and the monasteries of the whole town begin their dawn chanting; in the afternoons the debating ground of the Great College rings with the clapping of young monks. At the Ambanielo Market tenants trade the grain they have kept back for salt, cloth, tea and ironware, and the monastery stewards come round every day for the stall fees; the tenants say there is more rice in the Dharma King's Granary than in their villages, but the monks hold the keys. The liveliest time of year is the Festival of the White Parasol at the end of the rains. Before it comes the mountain-circuit walking race, in which runners go round the main peak on the Snow Parasol Pilgrims' Circuit, about 30 km long; on the day itself the Dharma King's palanquin comes down from the palace gate to the White Parasol Square to receive the homage of monks and tenants, then goes round the town on the pilgrims' path, while people from every village arrive carrying new rice and the roadsides fill with red rice and taro cakes."
