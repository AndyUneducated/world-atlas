  motto: {zh: 一座岛，许多国, en: 'One island, many nations'}
  population: 30300000
  area_km2: 1088900.0
  operators:
    expressway: {zh: 各国公路部门, en: National road authorities}
    highway: {zh: 各国公路部门, en: National road authorities}
    rail: {zh: 各国铁路公司, en: National railways}
  flag: united_republic
  flag_notes: {zh: 拉诺瓦联合共和国的国旗：绿底白色斜十字，中央红色圆盘和金色五角星，金色镶边。联合共和国解体后这面旗不再是任何国家的国旗，但它的联合标志仍出现在萨马伊、马哈维洛、伊纳拉、安巴罗和萨拉卡的船旗样式中。, en: 'The flag of the United Republic of Ranova: a white saltire on green with a red disc and gold star where the arms cross, in a gold border. Since the Republic dissolved it has been no state''s flag, but its union mark lives on in the ensigns of Samay, Mahavelo, Inara, Ambaro and Saraka.'}
  climate_notes: {zh: 拉诺瓦岛位于北纬八度到二十六度之间，终年受东北信风控制，是典型的热带海洋性气候。迎风的东海岸和东坡雨量充沛，一年两千到三千毫米，生长着茂密的热带雨林；中部的安德里纳高原海拔八百到一千多米，气候凉爽，首都安博哈拉年平均约二十度；背风的西海岸和西南部干燥得多，西南端一年只有三四百毫米雨水，是多刺灌木林和半荒漠。雨季从六月到十月，十一月到次年五月是干季；夏末秋初常有热带气旋从东面海上袭来。, en: 'Ranova lies between 8° and 26° N under the north-east trades all year, a typical tropical maritime climate. The windward east coast and eastern slopes are very wet, 2,000 to 3,000 mm a year, and covered in rainforest; the Andrina Highlands in the middle stand 800 to over 1,000 m high and are cool, the capital Ambohara averaging about 20 °C over the year; the sheltered west coast and the south-west are much drier, and the far south-west gets only 300 to 400 mm, a land of spiny thicket and semi-desert. The rains last from June to October and the dry season from November to May, and tropical cyclones often come in from the sea to the east in late summer and early autumn.'}

# ── 安博哈拉基督教联邦 ──
- id: div_mj41d0
  subtype: locality
  parent: div_p735rv
  role: nation
  status: generated
  names: {zh: 安博哈拉基督教联邦, en: Christian Federation of Ambohara, art-x-ranova: Fiombonana Kristiana an'i Ambohara}
  short_names: {zh: 安博哈拉, en: Ambohara}
  notes: {zh: '安博哈拉基督教联邦是拉诺瓦岛面积最大、人口最多的国家，国土约三十万平方公里，人口约七百五十万，由十个联邦市组成。国土像一条斜带，从西北的安博河口一路穿过中部的安德里纳高原，直抵东南海岸，两端各有一座外海岛屿，因此联邦既面向西北湾，也面向东南群岛之间的航道。首都安博哈拉坐落在高原中部八百多米的台地上，气候凉爽，是全岛的宗教和教育中心。

      联邦的前身是拉诺瓦联合共和国的高原各省。大分裂后，高原上的新教和天主教会联合地方士绅召开制宪会议，宣布成立基督教联邦，宪法序言写明国家「建立在上帝的律法与家庭之上」。总统由全民直选，任期五年；联邦议会采用混合选举制，福音派的家园党与天主教民主派轮流执政，教会联合会在教育、婚姻和社会福利上拥有很大影响力。堕胎和同性婚姻被禁止，星期日全国停业，公立学校每天以祈祷开始。

      联邦立国后随即与北方的阿瓦拉齐人民民主共和国爆发高原战争，前线在高原北缘拉锯多年，双方伤亡惨重，最终在停火线上对峙至今。南部边境则长期面对齐马罗沃的威胁和伊索卡游击队的袭扰，军费常年占国内生产总值近百分之五。联邦是圣约同盟的盟主，与萨希利亚、努西拉、米拉卡等国结盟，并从海外获得大量武器和援助。

      经济以高原农业为主，稻米、咖啡、瘤牛和林木是传统产业，石墨、蓝宝石和地热则是新的出口来源，瓦凡博是全国唯一的深水港和工业城市。战争和高额军费拖累了发展，人均收入只有约九千美元，但比北方的对手富裕。联邦人把信仰、家庭和土地看得很重，大家庭常常三代同堂，星期日的礼拜和午后的家宴是一周中最重要的时刻。', en: "The Christian Federation of Ambohara is the largest and most populous country on Ranova, some 300,000 km² with about 7.5 million people in ten federal cities. Its territory runs like a diagonal band from the mouth of the Ambo in the north-west, across the Andrina Highlands in the middle of the island, to the south-east coast, with an island offshore at each end, so the federation faces both the north-western bay and the sea lanes among the south-eastern isles. The capital, Ambohara, stands on a terrace some 800 m up in the middle of the highlands, cool and the religious and educational centre of the island. \nThe federation began as the highland provinces of the United Republic of Ranova. After the Sundering, the Protestant and Catholic churches of the highlands joined the local gentry in a constituent assembly that proclaimed a Christian federation, whose constitution declares that the state 'rests on the law of God and on the family'. The president is elected by direct vote for five years; the Federal Assembly is chosen by a mixed system, and the evangelical Homeland Party and the Catholic Christian Democrats take turns in government, while the Council of Churches carries great weight in schooling, marriage and welfare. Abortion and same-sex marriage are banned, the country closes on Sundays and state schools begin each day with prayer. \nAlmost at once the federation went to war with the People's Democratic Republic of Avaratsy in the north. The Highland War swung back and forth across the northern edge of the plateau for years at terrible cost, and the two armies still face each other across the ceasefire line. In the south it has long faced the threat of Tsimarovo and raids by the Isoka guerrillas, and defence takes close to 5% of output year after year. The federation leads the Covenant League, allied with Sahiliya, Nusira, Miraka and others, and receives large amounts of arms and aid from abroad. \nThe economy rests on highland farming: rice, coffee, zebu and timber are the old trades, graphite, sapphires and geothermal power the new exports, and Vavambo is the only deep-water port and industrial city. War and the defence bill have held development back, and income is only about 9,000 dollars a head, though richer than its northern rival. Federation people set great store by faith, family and land; three generations often share a house, and Sunday worship followed by the family meal is the high point of the week."}
