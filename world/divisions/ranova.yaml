  parent: div_r9whm0
  status: generated
  names: {zh: 察拉沃卡, en: Tsaravoka, art-x-ranova: Tsaravoka}
  notes:
    zh: "察拉沃卡是阿瓦拉齐社会主义共和国的渔业城市，坐落在拉诺瓦岛的最北端，面积约 2 万平方公里，人口 38 万，每平方公里约 19 人。辖区从北端的海岬向南展开，地势逐渐向马洛卡山抬升，城区海拔约 260 米，境内最高处 2549 米。这里迎着东北信风，属热带季风气候，年降水约 2500 毫米，五月到十一月是雨季，八月接近 390 毫米，二月只有 20 毫米左右；年平均气温约 21 °C，比南方的城市凉爽，冬天夜里偶尔降到个位数。市人民委员会由国家人民议会任命，执行共产党市委的决定，委员会主席通常兼任市委第一书记，现任主席是安多·拉沃松。\n渔业和香料是察拉沃卡的两大产业，国营捕捞船队和丁香合作社是主要的雇主，第一产业占经济的近四成，人均生产总值约 3460 美元。察拉沃卡丁香合作社沿丘陵的缓坡展开，几千棵丁香树排列成行；每年旱季，采摘工人爬上竹梯，在花蕾变红之前把它们摘下，摊在路边的草席上晒干，整个山谷都飘着丁香的香气。丁香是阿瓦拉齐最重要的出口商品之一，由合作社收购后运往港口；可可和其他香料也在河谷里种植。城外山顶上是察拉沃卡雷达站，白色的雷达罩昼夜监视北方的空域。居民九成以上以拉诺瓦语为母语，平均预期寿命约 65 岁，识字率约七成。\n察拉沃卡是北方公路的起点，从安巴拉努西河谷过来的稻谷公路在境内走了约 80 公里后也在这里接上北方公路。这条领道全长约 750 公里，在察拉沃卡境内约 170 公里，向南连接首都沃希马希和矿城马罗瓦托，最后到达马索沃利的菲拉纳，是世俗协约两个盟国之间的陆上通道；路边的集体农庄和国营工厂门口都挂着红色的标语牌，拖拉机和卡车在路上并行。丁香合作社有一条支路接上公路，收获季节，装满丁香麻袋的卡车一辆接一辆开往首都的港口。\n察拉沃卡人把海岬上的灯塔当作城市的名片，它是全岛最北的地标，渔船夜里归航时，第一眼看到的就是它的光。国营船队按计划出海，渔获在码头上过秤登记，超出定额的部分按更高的价格收购；采丁香的几个星期里，学校会放假，让孩子们帮着把花蕾摊在草席上。商店门口常年排着队，国家近年允许私人小商店经营，码头边开出了几家卖鱼干和丁香油的小铺，生意都不错。每个成年人都要参加工农赤卫队，渔民收网后还得去操场上练队列；也有不少年轻人设法跟着船出海谋生，一走就是好几年。老人们常说「马洛卡山挡住了风暴，也挡住了敌人」，察拉沃卡人会补上一句：挡不住的是海上的风。"
    en: "Tsaravoka is a fishing city of the Socialist Republic of Avaratsy at the northern tip of Ranova, covering some 20,000 km² with 380,000 people, about 19 to the square kilometre. Its land spreads south from the cape at the island's tip and rises gradually towards the Maroka Massif; the town lies about 260 m above the sea, and the highest point is 2,549 m. Facing the north-east trade winds, it has a tropical monsoon climate with about 2,500 mm of rain a year: the rains last from May to November, with close to 390 mm in August, while February brings only about 20 mm. The mean temperature is about 21 °C, cooler than the cities further south, and on winter nights it occasionally drops into single figures. The City People's Committee is appointed by the National People's Assembly and carries out the decisions of the Communist Party city committee, whose first secretary usually chairs it; the chairman is Ando Ravoson.\nFishing and spices are Tsaravoka's two industries, with the state fishing fleet and the clove co-operatives the main employers; the primary sector makes up nearly forty per cent of the economy, and output per head is about 3,460 dollars. The Tsaravoka Clove Co-operative spreads over the gentle hillsides in rows of several thousand clove trees. Every dry season the pickers climb bamboo ladders to pick the buds before they turn red and spread them on straw mats by the road to dry, and the whole valley smells of cloves. Cloves are one of Avaratsy's most important exports, bought up by the co-operatives and sent to the port; cocoa and other spices are grown in the valleys too. On a hilltop outside the town stands the Tsaravoka Radar Station, whose white domes watch the northern skies day and night. More than nine in ten residents speak Ranovan as their mother tongue; life expectancy is about 65, and about seven in ten can read.\nTsaravoka is where the Northern Road begins, and the Rice Road from the Ambalanosy valley joins it here after some 80 km in the city's land. This territorial highway, about 1,200 km long with some 170 km inside Tsaravoka, runs south to the capital, Vohimahy, the rice fields of the Ambalanosy valley and the mining city of Marovato, ending at Firana in Masovoly; it is the overland link between the two allies of the Secular Accord. Red slogan boards hang at the gates of the collective farms and state factories along it, and tractors drive alongside the lorries. A spur road joins the clove co-operative to the highway, and at harvest time lorries loaded with sacks of cloves follow one another to the port in the capital.\nPeople in Tsaravoka treat the lighthouse on the cape as the city's emblem: it is the northernmost landmark on the island, and its light is the first thing the fishing boats see as they come home at night. The state fleet puts to sea according to plan, the catch is weighed and recorded on the quay, and anything above the quota is bought at a higher price; during the few weeks of the clove harvest the schools close so that children can help spread the buds on the mats. There are queues outside the shops all year round, but the state has lately allowed small private shops, and the few stalls by the quay selling dried fish and clove oil do good business. Every adult must serve in the Workers' and Peasants' Red Guards, so after hauling in their nets the fishermen still have to drill on the parade ground; many young people also find ways to go to sea for a living and stay away for years. The old saying goes that 'the Maroka Massif keeps out the storms and keeps out the enemy', to which people in Tsaravoka add that it cannot keep out the wind from the sea."
