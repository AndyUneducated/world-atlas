  flag: {"layout": "horizon", "colors": ["#163D5E", "#6B5236", "#F3E9D2"], "edge": "peaks", "river": true, "charge": "tower", "charge_color": "#E9B949"}
  flag_notes:
    zh: "深石青色天空下是褐色的群山，一道浅色的溪流从山间流出，左上角一座金色的关楼。溪流是衡河的源头，关楼是通往齐马罗沃的东关，表示衡源是王朝东面的门户。"
    en: "Brown mountains under a deep azure sky, a pale stream running out from among them and a gold gate tower in the upper hoist. The stream is the source of the Heng and the tower the East Pass towards Tsimarovo: Hengyuan is the dynasty's eastern gate."
  traits:
