  names: {zh: 安西拉, en: Ansira, art-x-ranova: Ansira}
  notes:
    zh: "安西拉是太阳神国度西海岸的港城，也是王国唯一的出海口，城名意为「盐之地」。市域约 2600 平方公里，从海边升到海拔 2173 米的金日山西坡，人口约 17 万，在王国三座城市中居第二。与云雾缭绕的山地不同，海岸是一片干燥的沙漠，年均气温 24.8 ℃，年降水只有约 250 毫米，一到三月几乎滴雨不下。市旗金色天空下是白线勾出的蓝色海浪，浪中一枚白色盐晶，金色取自国旗的太阳；市花是海滨月见草，市树是木麻黄。\n城市由城仓与劳役署管理：仓守费诺·拉奈沃由所在一方的总督以太阳之子的名义任命，掌管城中的粮仓和劳役名册，各村社推举的头人每月在仓署前与他和结绳官核对账目。经济靠渔业、海盐和港口，第二产业约占 34%，人均产值约 1770 美元。安西拉盐田沿海岸铺开，服劳役的村民引海水进盐池，在旱季的烈日下晒盐，旁边的晒鱼场把渔获晒成鱼干；盐和鱼干由维洛纳驼沿石砌的王道驮进山里，分配到各村的粮仓，是种土豆和金藜的山民最重要的咸味。\n安西拉是全国唯一使用货币的地方，也是外国商人同王国做生意的唯一场所。安西拉交易所由外事与交易署管理，商人用药品、燃料、工具和枪支换取黄金、驼毛、土豆干和金藜，买卖用交易筹记账，交易筹不能带出城外，院子里每天都有结绳官和翻译在场。外客馆是一座围着庭院的两层石楼，外国商人、使节和获准入境的游客都要先在这里住几天，等候王廷派来的陪同人员；厨房供应金藜土豆汤和烤鱼，餐费只收交易筹。\n王国的海岸线很短。安西拉海岸守望站停着几艘巡逻艇，巡查海岸、护送交易船进港、在海上搜救，也拦截偷偷乘渔船出海、想逃往贝洛瓦的年轻人，因此在港口很不受欢迎。北面岬角上的日落灯塔是一座白色石塔，按照王国的说法，太阳每天在这里沉入大海，守塔人每晚日落时点亮灯火，直到第二天太阳在东方的群山上重新升起。\n约 75 公里长的沃沃南德罗—安西拉公路把港口和都城连起来，8.5 公里的日落灯塔公路通往岬角。驿卒沿王道接力奔跑，太阳之子的命令一天之内就能从海边送到东部隘口。\n居民近九成说拉诺瓦语，平均预期寿命 64.7 岁，识字率约 62%，14 岁以下的孩子占三分之一以上。百姓不交税，每户每年出一名成年人服一到三个月劳役，在安西拉多半是晒盐、补网和守粮仓；村民离开所在的一方须持结绳通行证。旱季是盐田最忙的时候，傍晚收工的盐工常聚在灯塔下看日落，老人说那是「送太阳回家」。每年冬至，太阳之子在都城的日之广场用金镜取火，驿卒连夜把新火沿王道送往各村，送到海边的安西拉时，东方的天往往已经发白。"
    en: "Ansira is the port of the west coast of the Realm of the Sun God and the kingdom's only outlet to the sea; the name means 'place of salt'. Its territory of some 2,600 km² rises from the shore to 2,173 m on the western slopes of the Golden Sun Range, and with about 170,000 people it is the second of the kingdom's three cities. Unlike the misty mountains, the coast is a dry desert, with a mean temperature of 24.8 °C and only about 250 mm of rain a year; from January to March hardly a drop falls. The city flag shows blue waves outlined in white beneath a golden sky, with a white salt crystal in the waves, the gold taken from the sun of the national flag; the city flower is the beach evening primrose and the city tree the casuarina.\nThe city is run by the Storehouse and Labour Office. The Keeper of the Storehouse, Feno Ranaivo, is appointed by the governor of his quarter in the name of the Son of the Sun and holds the city's granaries and labour rolls; every month the headmen chosen by the village communities check the accounts with him and the cord-keepers at the storehouse door. The economy rests on fishing, sea salt and the port; industry accounts for about 34%, and output per head is about US$1,770. The Ansira Salt Pans spread along the shore, where villagers on labour service let seawater into the pans and dry out salt under the dry-season sun, and the fish-drying yards beside them turn the catch into dried fish. Vilonas carry the salt and dried fish into the mountains along the stone royal roads to the village granaries; for the highlanders who grow potatoes and golden goosefoot, they are the most important taste of salt.\nAnsira is the only place in the country where money is used and the only place where foreign merchants may do business with the kingdom. The Ansira Exchange House is run by the Office of External Affairs and Exchange: merchants trade medicines, fuel, tools and rifles for gold, vilona wool, dried potatoes and golden goosefoot, reckoned in exchange tokens that may not leave town, and cord-keepers and interpreters are in the courtyard every day. The Foreigners' Lodge is a two-storey stone building round a courtyard, where foreign merchants, envoys and permitted visitors must first stay for a few days to wait for the escorts sent by the royal court; its kitchen serves goosefoot and potato soup and grilled fish, payable only in tokens.\nThe kingdom's coastline is short. The Ansira Coast Watch Station keeps a few patrol boats to watch the coast, escort trading ships into port and carry out sea rescues; it also stops young people who slip out to sea in fishing boats hoping to flee to Belova, and so it is much disliked in the harbour. On the headland to the north stands the Sunset Lighthouse, a white stone tower. As the kingdom tells it, the sun sinks into the sea here every day, and the keeper lights the lamp at sunset each evening until the sun rises again over the mountains in the east.\nThe Vovonandro–Ansira Road, about 75 km long, links the port with the capital, and the 8.5 km Sunset Lighthouse Road leads out to the headland. Relay runners on the royal roads carry the Son of the Sun's orders from the coast to the eastern passes within a day.\nNearly nine in ten residents speak Ranovan, life expectancy is 64.7 years and literacy about 62%, and children under fifteen make up more than a third of the population. People pay no taxes; every household sends one adult for one to three months of labour service a year, which in Ansira usually means making salt, mending nets or guarding the granaries, and villagers need a knotted-cord pass to leave their quarter. The dry season is the busiest time at the salt pans, and in the evening salt workers off their shift often gather beneath the lighthouse to watch the sunset, which the old people call 'seeing the sun home'. Every winter solstice the Son of the Sun kindles fire with a golden mirror in the Square of the Sun in the capital, and relay runners carry the new fire along the royal roads to the villages through the night; by the time it reaches Ansira on the coast, the eastern sky is often already growing pale."
