  names: {zh: 努西姆博, en: Nosimbo, art-x-ranova: Nosimbo}
  notes:
    zh: "努西姆博是安博哈拉基督教联邦在西北外海的岛屿城市，名字意为「安博之岛」，指的是对岸注入大海的安博河。全岛面积约 1800 平方公里，地势低平，最高处只有 221 米，人口约 12 万。这里属热带季风气候，年均气温 23.2 ℃，年降水约 2790 毫米，七到九月雨最多，二月最干。海岸边长着红树林，岸上开着黄槿花，二者正是本市的市树和市花。市旗上蓝下白，中间一座岛和它在水中的倒影，颜色上下互换；蓝白两色来自联邦旗。\n联邦把努西姆博看作国土西北端的哨所。联邦的国土像一条斜带，从西北的安博河口一路穿过高原直抵东南海岸，两端各有一座外海岛屿，东南端是努西亚特拉，西北端就是这里。岛上有渔港、灯塔和海岸雷达，雷达日夜监视着岛外的航道；努西姆博海岸巡逻基地停泊着联邦海军的巡逻快艇和搜救船，负责沿海巡逻、缉私、渔业执法和海上搜救，风暴来临前巡逻艇会出海通知渔船回港，近年来也频繁出动拦截偷渡和走私的快艇。\n经济以渔业、旅游和国防为主，服务业约占 64%，人均产值约 9550 美元，与全国平均相近。渔港清晨最忙，渔船卸下金枪鱼、鱿鱼和虾，一部分用渡船运往对岸，供应瓦凡博和高原城市。夏季有首都来的度假者，他们从凉爽的高原下来，在白沙滩上晒太阳、吃烤鱼，海边的家庭旅馆这时一房难求；度假季一过，岛上又只剩渔民、灯塔看守和海军的水兵。对岸的瓦凡博是联邦唯一的深水港和最大的工业城市，岛上的年轻人多到那里的码头和工厂找工作，逢年过节才坐渡船回来。\n市议会 23 席，最近一次投票率 68.8%。家园党得票 44.4%、10 席，与 2 席的高原农民党联合执政；基督教人民党 7 席，联邦自由党拿下 17.9% 的选票和 4 席。市长沃拉娜·拉钦巴属家园党，以 50.3% 对 49.7% 险胜基督教人民党的对手，议长是同党的哈西娜·拉扎芬德拉贝。\n居民九成以上说拉诺瓦语，平均预期寿命 67.7 岁，识字率约 89%。和联邦各地一样，星期日全岛停业，渔船也不出海，人们上午去教堂做礼拜，午后全家围坐吃一顿长长的家宴。渔民出海前要在码头边的小圣母像前画个十字，灯塔的光每晚扫过港口，老人说只要看见它亮着，海上的人就能找到回家的路。雨季风浪大的日子，渡船停航，岛上的人就说「努西姆博又变回了一座岛」。"
    en: "Nosimbo is the island city of the Christian Federation of Ambohara off the north-west coast; the name means 'island of the Ambo', after the Ambo River that flows into the sea on the opposite shore. The island covers some 1,800 km² and is low and flat, rising no higher than 221 m, with about 120,000 people. The climate is tropical monsoon, with a mean temperature of 23.2 °C and some 2,790 mm of rain a year, most of it from July to September; February is the driest month. Mangroves line the shore and sea hibiscus blooms above it, and these are the city tree and city flower. The city flag is blue over white, with an island and its reflection in the water in the centre, the colours swapped top and bottom; the blue and white come from the federal flag.\nThe federation regards Nosimbo as the outpost at its north-western end. The federation's territory runs like a diagonal band from the mouth of the Ambo in the north-west across the highlands to the south-east coast, with an offshore island at each end: Nosiatra in the south-east and Nosimbo here in the north-west. The island has a fishing harbour, a lighthouse and a coastal radar that watches the sea lanes offshore day and night. The Nosimbo Coastal Patrol Base is home to the federal navy's fast patrol boats and rescue vessels, which handle coastal patrols, anti-smuggling work, fisheries enforcement and sea rescue; before storms the patrol boats go out to call the fishing boats home, and in recent years they have been out often to stop the speedboats of people-smugglers and smugglers.\nThe economy rests on fishing, tourism and defence; services account for about 64%, and output per head is about US$9,550, close to the national average. The fishing harbour is busiest in the early morning, when the boats unload tuna, squid and prawns, some of which go by ferry to the mainland to supply Vavambo and the highland cities. In summer holidaymakers come from the capital, down from the cool highlands to sunbathe on the white beaches and eat grilled fish, and the guesthouses by the sea are booked solid; once the season ends, the island is left again to fishermen, lighthouse keepers and navy sailors. Across the water, Vavambo is the federation's only deep-water port and its largest industrial city, and many of the island's young people go there to work on the docks and in the factories, coming home by ferry only for holidays.\nThe City Council has 23 seats; turnout at the last election was 68.8%. The Homeland Party won 44.4% and 10 seats and governs with the 2-seat Highland Farmers' Party; the Christian People's Party has 7 seats, and the Federal Liberal Party won 17.9% of the vote and 4 seats. The mayor, Volana Ratsimba of the Homeland Party, scraped home against the Christian People's Party candidate by 50.3% to 49.7%, and the speaker is her party colleague Hasina Razafindrabe.\nMore than nine in ten residents speak Ranovan, life expectancy is 67.7 years and literacy about 89%. As everywhere in the federation, the whole island shuts on Sundays and even the fishing boats stay in; people go to church in the morning and gather for a long family meal in the afternoon. Fishermen cross themselves before a small statue of the Virgin on the quay before putting to sea, and every night the lighthouse beam sweeps the harbour; the old people say that as long as it is lit, those at sea can find their way home. On stormy days in the rainy season, when the ferries stop running, islanders say 'Nosimbo has become an island again.'"
