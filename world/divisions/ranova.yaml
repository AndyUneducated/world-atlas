  names: {zh: 伊拉希, en: Ilahy, art-x-ranova: Ilahy}
  notes:
    zh: "伊拉希是齐马罗沃民族社会主义帝国东海岸的港城，坐落在伊拉希河口，是国家唯一的出海口。全市面积约 1.8 万平方公里，人口约 65 万。伊拉希河从伊瓦卡山流向东海岸，贯穿全境，在这里入海；市境从河口向内陆的山地伸展，最高处 1855 米。这里是湿热的热带季风气候，年均气温 24.5 摄氏度，年降水约 3150 毫米，八月最湿，达 480 毫米。海军和海岸炮台把守着港湾。\n港区工厂生产钢材、化肥和军用卡车，第二产业占全市经济的 43%，人均生产总值约 5300 美元，略高于全国平均。伊拉希港由军方控制，福罗纳的矿石和兵工厂的产品从这里装船，运往祖源轴心的盟国和海外，外国商船靠港时要接受严格检查；港旁的造船厂建造渔船和巡逻艇。伊拉希军用卡车厂用福罗纳钢铁联合企业的钢材生产军用卡车、越野车和装甲运兵车底盘，也向卡波拉出售车辆，违反了国际武器禁运；工人实行军事化管理，每天上班前在厂门口列队宣誓。\n齐伊铁路和福伊重载铁路各有一条线通到港区。齐伊铁路自首都经福罗纳沿伊拉希河谷东下，以伊拉希站为终点，全长约 350 公里，列车时速 160 公里，以长约 63 公里的伊拉希河特大桥顺河谷而下；一等车厢的车票只卖给持一等「血统证书」的公民。福伊重载铁路在河谷里与它并行，通到伊拉希货运站和矿石码头，每天开出四列满载列车，每列八十节货车，回程运回进口的焦煤；这条线上的安德里纳高原隧道长约 74 公里，是世界最长的山岭隧道。南方公路在市境内长约 178 公里，向西通往福罗纳和首都。\n海岸舰队的伊拉希海军基地由两道防波堤围成港池，码头后面是修船厂、油库和水兵营房；河口北岸山岬上的海岸炮台始建于联合共和国时期，火炮和反舰导弹发射车藏在混凝土掩体里，只有观察哨露出地面。海岸巡逻基地负责巡逻、缉私和海上搜救，风暴来临前巡逻艇会出海通知渔船回港，近年来也频繁出动，拦截偷渡和走私的快艇，船上常常是想逃离这个国家的人。\n城市由领袖府任命的市行政长官托基·拉韦洛乔纳管理，他同时是当地民族卫队的政治负责人。和全国一样，居民按「血统证书」分成等级，只有一等公民可以拥有土地、担任公职和当军官，学校教授「血统史」，青年必须加入运动的青年团。居民 92% 以拉诺瓦语为母语。每年海军节，海军基地对公众开放一天，市民可以登舰参观；建国阅兵前，装甲部队的军列从伊拉希开往首都，沿线的学生被组织到铁路边挥旗。河谷的居民说，听火车声就知道车上装的是什么：钢材车最响，军列最慢，客车最安静。市花是金凤花，市树是海杧果。"
    en: "Ilahy is the port city of the east coast of the National Socialist Empire of Tsimarovo, at the mouth of the Ilahy River, and the state's only outlet to the sea. The city covers about 18,000 km² and has some 650,000 people. The Ilahy flows from the Ivaka Mountains to the east coast across the whole country and reaches the sea here; the city's land runs inland from the river mouth into the hills, rising to 1,855 m. The climate is hot, humid tropical monsoon, with a mean temperature of 24.5 °C and about 3,150 mm of rain a year; August is the wettest month at 480 mm. The harbour is guarded by the navy and coastal batteries.\nThe factories of the port district turn out steel, fertiliser and military lorries; industry makes up 43% of the city's economy, and output per head is about $5,300, a little above the national average. The Port of Ilahy is controlled by the military: ore from Forona and the products of its arms works are loaded here for the allies of the Origin Axis and overseas, foreign merchant ships are strictly inspected when they call, and the shipyard beside the port builds fishing boats and patrol boats. The Ilahy Military Lorry Works builds military lorries, off-road vehicles and armoured personnel carrier chassis from the steel of the Forona combine, and also sells vehicles to Kapora in breach of the international arms embargo; its workers are under military discipline and line up to swear an oath at the factory gate before every shift.\nThe Tsimarovo–Ilahy Railway and the Forona–Ilahy Heavy-Haul Railway each run their own line into the port. The Tsimarovo–Ilahy Railway comes down the Ilahy valley from the capital by way of Forona to end at Ilahy Station, about 350 km in all, its trains running at 160 km/h and following the valley down on the Ilahy River Bridge, some 63 km long; first-class tickets are sold only to citizens holding first-class \"blood certificates\". The heavy-haul line runs beside it down the valley to the Ilahy Freight Yard and the ore wharf, sending four loaded trains of eighty wagons each a day and bringing back imported coking coal; its Andrina Plateau Tunnel, some 74 km long, is the longest mountain tunnel in the world. The Southern Road runs about 178 km within the city's bounds, west towards Forona and the capital.\nThe Coastal Fleet's Ilahy Naval Base is a basin enclosed by two breakwaters, with a repair yard, fuel depot and sailors' barracks behind the quays; the coastal battery on the headland north of the river mouth dates from the United Republic, its guns and anti-ship missile launchers hidden in concrete bunkers with only the observation posts above ground. The Coastal Patrol Base handles patrols, anti-smuggling work and search and rescue; before a storm its patrol boats go out to call the fishing boats home, and in recent years it has been sent out more and more often to intercept smugglers' fast boats, often carrying people trying to flee the country.\nThe city is run by the City Commissioner, Toky Ravelojaona, appointed by the Leader's Chancellery, who is also political chief of the local National Guard. As across the country, residents are ranked by their \"blood certificates\": only first-class citizens may own land, hold office and serve as officers, schools teach \"blood history\", and the young must join the movement's youth league. Ninety-two per cent of the people speak Ranovan as their mother tongue. On Navy Day the naval base opens to the public for a day and townspeople may go aboard the ships; before the founding parade, trains of armoured units leave Ilahy for the capital, and pupils along the line are marshalled to wave flags beside the track. People in the valley say they can tell what a train is carrying by its sound: steel trains are loudest, troop trains slowest and passenger trains quietest. The city flower is the pride of Barbados and the city tree the sea mango."
