  names: {zh: 福罗纳, en: Forona, art-x-ranova: Forona}
  notes:
    zh: "福罗纳是齐马罗沃民族社会主义帝国的矿业城市，坐落在伊瓦卡山脚下，市域约 2 万平方公里，从山前的稀树草原升到海拔 2247 米的山地，人口约 45 万。这里属热带草原气候，年均气温 24.1 ℃，年降水约 1080 毫米，一到三月几乎无雨，旱季白天常超过 32 ℃。城市开采铁矿和铝土矿，炼钢厂和兵工厂相邻，官方称它是国家「战争机器的心脏」。市旗黑底上一个红色山形，正中一座白色铁砧，山形是伊瓦卡山，铁砧是炼钢厂和兵工厂；市花是虎刺梅，市树是铁木。\n城市由市行政长官公署管理，市行政长官安多·拉科托由领袖府任命，兼任当地民族卫队的政治负责人。和全国一样，居民按「血统证书」分成等级，只有一等公民可以拥有土地、担任公职和当军官；青年必须加入运动的青年团，学校教授「血统史」。\n工业占经济的六成以上，人均产值约 5990 美元，采矿和军火制造是两大支柱。福罗纳铁矿的露天矿坑一级级向下延伸，几十辆大型矿车日夜不停，矿石经传送带直接送进旁边的福罗纳钢铁联合企业。联合企业是全国最大的国营工厂，有高炉、转炉和轧钢车间，钢材供应造船、机械和军工，上万名工人的厂区里有自己的学校、医院和俱乐部，高炉的火光在夜里照亮半边天空。福罗纳国营兵工厂是全国最大的军工企业，车间沿山谷排开，生产步枪、迫击炮和弹药，靶场和试验场在山谷尽头；它是当地最大的雇主，工人的子女大多在厂办学校上学。周边国家普遍对齐马罗沃实施武器禁运，这里的产品供应南方战争的前线，许多原料和零件靠走私进来。\n齐伊铁路从首都齐马罗沃经福罗纳站，穿过 12.5 公里长的福罗纳隧道，沿伊拉希河谷东下到伊拉希港，信风 160 型列车时速 160 公里，站台加长到能停靠整列坦克平板车，一等车厢只卖给持一等「血统证书」的公民。福伊重载铁路从福罗纳铁矿货运站出发，在河谷里与它并行，全长约 240 公里；每天四列满载的铁锤重载列车，每列八十节货车、净载约六千吨，把铁矿石、铝土矿和钢坯运往伊拉希港，回程运回进口焦煤。线上的安德里纳高原隧道长约 74 公里，是世界最长的山岭隧道。南方公路也经过福罗纳，齐马罗沃段路面宽直，修建时就考虑了坦克通行。\n居民九成以上说拉诺瓦语，工作年龄人口占 67%，平均预期寿命 65.3 岁。矿区的工人说，听到专用线上三声长笛，就知道又一列满载的列车出发了；沿线道口的看守员大多是退伍军人，每过一列重车就在本子上记一笔。旱季牧民赶着瘤牛沿公路去集市，运钢材的卡车也得停下来等上半个小时。三十多年来，二十多万人逃离这个国家，其中也有福罗纳的工程师和工人。"
    en: "Forona is a mining city of the National Socialist Empire of Tsimarovo at the foot of the Ivaka Mountains. Its territory of some 20,000 km² rises from the savanna below the range to mountains of 2,247 m, and it has about 450,000 people. The climate is tropical savanna, with a mean temperature of 24.1 °C and some 1,080 mm of rain a year; from January to March there is almost none, and in the dry season days are often above 32 °C. The city works iron ore and bauxite, with its steelworks beside the arsenal, and the state calls it the 'heart of the war machine'. The city flag shows a red mountain on black with a white anvil at its centre: the mountain is the Ivaka range, the anvil the steelworks and arsenal. The city flower is the crown of thorns and the city tree the ironwood.\nThe city is run by the Office of the City Commissioner; the City Commissioner, Ando Rakoto, is appointed by the Leader's Chancellery and is also political chief of the local National Guard. As across the country, residents are graded by 'blood certificate', and only first-class citizens may own land, hold public office or become officers; young people must join the Movement's youth league, and schools teach 'blood history'.\nIndustry makes up more than 60% of the economy, output per head is about US$5,990, and mining and arms making are the two pillars. The open pit of the Forona Iron Mine descends in steps, with dozens of heavy haul trucks running day and night, and conveyor belts carry the ore straight into the Forona Iron and Steel Combine next door. The combine is the largest state factory in the country, with blast furnaces, converters and rolling mills supplying steel to shipbuilding, engineering and the arms industry; its site, home to more than ten thousand workers, has its own schools, hospital and club, and the glow of the furnaces lights half the night sky. The Forona State Arms Factory is the country's largest arms maker, its workshops strung along a valley producing rifles, mortars and ammunition, with ranges and proving grounds at the valley's end; it is the largest employer in town, and most workers' children attend the factory schools. Most neighbouring states and international bodies enforce an arms embargo on Tsimarovo; the factory's output supplies the front of the Southern War, and many raw materials and parts are smuggled in.\nThe Tsimarovo–Ilahy Railway runs from the capital, Tsimarovo, through Forona Station and the 12.5 km Forona Tunnel and down the Ilahy valley to the port of Ilahy. Its Tradewind 160 trains run at 160 km/h, its platforms are long enough for a whole train of tank flatcars, and first-class tickets are sold only to holders of first-class blood certificates. The Forona–Ilahy Heavy-Haul Railway, some 240 km long, starts at the Forona Iron Mine Freight Yard and runs beside it down the valley. Four loaded Hammer trains a day, each of eighty wagons carrying some 6,000 tonnes net, take iron ore, bauxite and steel billets to the port of Ilahy and bring imported coking coal back. On the line, the Andrina Highlands Tunnel, about 74 km long, is the longest mountain tunnel in the world. The Southern Road also passes through Forona; its Tsimarovo section is broad and straight, built with tanks in mind.\nMore than nine in ten residents speak Ranovan, people of working age make up 67% of the population, and life expectancy is 65.3 years. Miners say that when they hear three long whistles on the line, they know another loaded train has set off, and the crossing keepers along the way, mostly army veterans, make a mark in their notebooks for every heavy train that passes. In the dry season herders drive zebu along the road to market, and even the steel lorries must stop and wait half an hour. Over more than thirty years more than 200,000 people have fled the country, Forona's engineers and workers among them."
