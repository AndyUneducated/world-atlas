# ── 安巴罗国际托管地 ──
- id: div_7t7xz6
  subtype: country
  status: generated
  names: {zh: 安巴罗国际托管地, en: Ambaro International Trust Territory, art-x-ranova: Faritra Iraisam-pirenena Ambaro}
  short_names: {zh: 安巴罗, en: Ambaro}
  notes:
    zh: "安巴罗国际托管地位于拉诺瓦岛东南海岸外的一座小岛上，面积约三千平方公里，人口约二十万，其中约七万是难民。全岛只有安巴罗一座城市，旧海军要塞矗立在港口的岩岬上，如今是国际委员会的总部；岛的三分之一被难民营和援助机构的仓库占据。\n安巴罗曾是联合共和国最重要的海军要塞，控制着东南群岛之间的航道，储存着大量武器和弹药。大分裂时，驻岛的海军部队拒绝向任何一方投降，安博哈拉和阿瓦拉齐的军队先后包围了要塞，双方都想夺取岛上的军火库。安巴罗之围持续了一年多，岛上居民和守军饱受饥饿和炮击之苦，最终在萨马伊的调解和国际社会的压力下，交战双方同意撤军，要塞交由国际委员会托管，岛上的军火在国际监督下全部销毁。\n托管地由国际委员会管理，委员会由联合国机构、中国、美国和地区国家的代表组成，高级专员由委员会任命，任期三年；岛民理事会由居民选举产生，负责地方事务并向委员会提出建议。托管地非军事化，只有多国维和部队和警察，维和部队也被派往本岛的停火线监督停火。\n现任高级专员是英格丽德·霍尔姆。国际委员会共 7 席：联合国代表 3 席，中国、美国各 1 席，地区国家代表 2 席。日常行政由托管行政署负责，首席行政官和难民事务、港口与航道、非军事化核查、公共服务、财务与援助协调、国际警察六个处的处长多由联合国派出的国际职员担任；非军事化核查处定期检查旧要塞和军火库，确保岛上没有任何一方的武装力量。托管地法院由三名国际法官和两名本地法官组成，适用托管条例和联合共和国旧法，难民的身份和庇护申请由单独的难民事务审裁处处理，涉及战争罪的案件可以移交国际法庭。约三千二百名安巴罗多国维和部队官兵驻扎在旧要塞，装甲车、直升机和巡逻艇只用于维和与救援；托管地不设本地武装，托管地警察招募年满 18 岁的本地居民和国际警官。\n托管地是全岛唯一被所有国家承认的政治实体，也是交战各方停火谈判、交换战俘和遣返难民的场所。伊索卡人民战争的和谈接触、南方战争的人道主义通道都经由安巴罗协调。经济依靠国际援助、维和部队的开支和港口服务，人均收入约六千美元。旧要塞的城墙上刻着一行字：「这里曾经储存战争，如今储存和平。」\n托管地的失业率高达 22%，许多年轻人靠给援助机构打零工过活；非军事区的地雷还没有全部清除，难民营周边的治安也不稳定。托管地日这天，岛上举行足球赛，难民营的球队和城里的球队同场比赛，赛前奏响没有歌词的《和平颂》，看台上的人分着吃木薯饼。"
    en: "The Ambaro International Trust Territory is a small island off Ranova's south-east coast, some 3,000 km² with about 200,000 people, around 70,000 of them refugees. Ambaro is its only town; the old naval fortress on the headland above the harbour is now the headquarters of the International Commission, and a third of the island is taken up by refugee camps and aid warehouses. \nAmbaro was once the United Republic's most important naval fortress, commanding the sea lanes among the south-eastern islands and holding great stores of arms and ammunition. In the Sundering the naval garrison refused to surrender to any side, and the armies of Ambohara and Avaratsy in turn laid siege to the fortress, each wanting its arsenal. The Siege of Ambaro lasted more than a year, and islanders and garrison alike suffered hunger and bombardment until, through Samay's mediation and international pressure, the besiegers agreed to withdraw, the fortress was placed in the trust of an International Commission, and all the arms on the island were destroyed under international supervision. \nThe territory is governed by the International Commission of representatives of UN bodies, China, the United States and the regional states; the Commission appoints a High Commissioner for three years, and an Islanders' Board elected by residents handles local affairs and advises the Commission. The territory is demilitarised, with only a multinational peacekeeping force and police, and the peacekeepers are also sent to the main island's ceasefire lines to monitor them. \nThe present High Commissioner is Ingrid Holm. The International Commission has seven seats: three for the United Nations, one each for China and the United States and two for regional states. Day-to-day administration is in the hands of the Trust Administration, whose Chief Administrator and the heads of its six offices, for refugee affairs, port and channels, demilitarisation verification, public services, finance and aid coordination and international police, are mostly international staff sent by the United Nations; the Demilitarisation Verification Office regularly inspects the old fortress and the arsenals to make sure no side has armed forces on the island. The Trust Territory Court has three international and two local judges and applies the trust regulations and the old law of the United Republic; refugee status and asylum claims go to a separate refugee tribunal, and war-crimes cases can be referred to an international court. About 3,200 troops of the Ambaro Multinational Peacekeeping Force are quartered in the old fortress, with armoured vehicles, helicopters and patrol boats used only for peacekeeping and relief; the territory has no armed forces of its own, and the Ambaro Trust Territory Police recruit local residents aged 18 and over alongside international officers.\nIt is the only political entity on the island recognised by every state, and the place where the warring sides negotiate ceasefires, exchange prisoners and repatriate refugees; the contacts towards peace in the Isoka People's War and the humanitarian corridors of the Southern War are all co-ordinated through Ambaro. The economy depends on international aid, the spending of the peacekeepers and port services, with income of about 6,000 dollars a head. A line is carved on the walls of the old fortress: 'Here war was once stored; now peace is.'\nUnemployment in the territory is as high as 22%, and many young people live on odd jobs for the aid agencies; the mines in the demilitarised zone have not all been cleared, and the areas around the camps are unsettled. On Trusteeship Day the island holds a football match in which teams from the camps play teams from the town, the wordless Hymn of Peace is played before kick-off, and the crowd shares cassava cakes in the stands."
