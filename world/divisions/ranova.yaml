  status: generated
  names: {zh: 卡里, en: Kary, art-x-ranova: Kary}
  notes:
    zh: "卡里是伊索卡人民战争解放区东部的村镇，与首府伊索卡并称解放区的两个主要据点。全市人口约 17 万，散居在约 1.6 万平方公里的山地和丘陵里；地势起伏，平均海拔 483 米，最高处 1082 米。气候属热带草原型，年均气温 22.9 ℃，年降水约 1353 毫米，一月到三月干旱，八月雨水最多。游击队控制着一处小金矿，以矿石换取武器和药品；周边国家的军队多次进剿，镇子几度被毁又重建。\n大分裂后，人民战争党的骨干进入伊索卡山区，在贫困的山村中发动土地革命，没收地主和种植园的土地分给农民，同时以严厉的手段处决「阶级敌人」和「告密者」，卡里的老人至今谈起那几年仍压低声音。三十多年的人民战争里，游击队从这里出发袭击周边国家的警察局、矿区和种植园，绑架人质换取赎金，清剿的部队则一次次开进山谷。卡里重建村就是镇子被毁后重建的村落，土坯房和铁皮屋顶的房子沿山坡排开，村民说镇子已经被烧了四次，每次大家都回来重新盖房，因为「祖坟在这里」；村口新建的小学是援助组织捐建的。\n卡里小金矿由村民用手工方法开采，矿石由游击队统一收购，再经边境的走私网络换成武器和药品。淘金用汞，矿坑周围的河水被污染，下游村庄的鱼已经不能吃了。除了金矿，居民靠小块农田种木薯、玉米和豆子，工矿业名义上占经济的 39%，人均产值约 702 美元，是全岛最穷的地方之一。解放区没有货币，实行配给制和集体劳动，游击队向过往商人「征税」。卡里营地是人民解放军（游击队）在镇外的营地之一，位置时常变化；国际组织的报告指出，这类营地曾被用来训练未成年人，并接收从岛外招募来的人员。\n卡里由革命委员会管理，政委姆博拉·拉马纳纳由游击队总部派出。对外的通道只有一条伊索卡—卡里公路，长约 162 公里，翻山越岭连到伊索卡；雨季道路泥泞，物资靠人背和骡子驮。解放区不被任何国家承认，被安博哈拉、梅纳瓦利、安博维和齐马罗沃列为恐怖组织控制区。\n这里的人口很年轻，37% 是孩子，人均预期寿命只有 58.2 岁，识字率 32.5%，居民 90% 说拉诺瓦语。青少年常被征入游击队，许多家庭因此在夜里翻山逃往邻国。留下的人在配给和清剿之间过日子：一听到直升机的声音，母亲们就把孩子领进屋后的山洞；集会上大家跟着念口号，回到家里却小声祈祷。近年游击队内部出现分裂，有指挥员经安巴罗托管地的调解与安博哈拉接触，镇上的人对此只说一句「别再烧房子就好」。卡里没有市花和市树，城旗是红色天空下的绿色山峦，左上一颗金色五角星。"
    en: "Kary is a village town in the east of the Isoka People's War Liberated Zone and, with Isoka, one of the zone's two main strongholds. Its 170,000 people are scattered across some 16,000 km² of mountains and hills; the land is rugged, with a mean elevation of 483 m and a high point of 1,082 m. The climate is tropical savanna: the mean temperature is 22.9 °C and the annual rainfall about 1,353 mm, with drought from January to March and the most rain in August. The guerrillas hold a small gold mine and trade the ore for weapons and medicine; neighbouring armies have swept the area many times, and the town has been destroyed and rebuilt more than once.\nAfter the Sundering the cadres of the People's War Party went into the Isoka hills and launched a land revolution in the poor mountain villages, seizing land from landlords and plantations for the peasants while executing \"class enemies\" and \"informers\" with great harshness; Kary's old people still lower their voices when they speak of those years. Through more than thirty years of people's war the guerrillas set out from here to raid police stations, mines and plantations in neighbouring states and to take hostages for ransom, and the sweeping columns marched into the valleys again and again. Kary Rebuilt Village is the settlement rebuilt after the town was destroyed, its mud-brick houses with tin roofs lined along the hillside; the villagers say the town has been burnt four times and each time everyone came back to rebuild, because \"our ancestors' graves are here\". The new school at the village entrance was donated by an aid organisation.\nThe Kary Gold Diggings are worked by hand by villagers; the guerrillas buy all the ore and trade it through cross-border smuggling networks for weapons and medicine. The panning uses mercury, the streams around the pits are polluted, and the fish in the villages downstream can no longer be eaten. Besides the gold, people farm small plots of cassava, maize and beans; mining and industry nominally make up 39% of the economy, and output per head is about US$702, among the poorest anywhere on the island. The zone has no currency, relies on rationing and collective labour, and the guerrillas \"tax\" passing traders. Kary Camp is one of the People's Liberation Army (guerrilla) camps outside the town, its position often changing; international reports say camps like it have been used to train minors and to take in recruits from off the island.\nKary is run by a Revolutionary Committee whose political commissar, Mbola Ramanana, is sent by the guerrilla command. The only way out is the Isoka–Kary Road, about 162 km across the mountains to Isoka; in the rains the roads turn to mud and supplies are carried on people's backs and by mule. No state recognises the zone, and Ambohara, Menavaly, Ambovy and Tsimarovo list it as an area under terrorist control.\nThe population is very young, 37% of it children; life expectancy is only 58.2 years, literacy 32.5%, and 90% of residents speak Ranova. Teenagers are often conscripted into the guerrillas, and many families have fled over the mountains to neighbouring states by night. Those who stay get by between rationing and sweeps: at the sound of a helicopter mothers lead their children into the caves behind their houses, and people chant the slogans at meetings but pray quietly at home. In recent years the guerrillas have split, and some commanders have made contact with Ambohara through mediation in the Ambaro trusteeship; in town people only say, \"as long as they stop burning our houses\". Kary has no city flower or tree, and its flag shows green mountains under a red sky with a gold five-pointed star in the upper left."
