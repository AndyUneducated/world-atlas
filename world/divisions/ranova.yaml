- id: div_89czvj
  subtype: locality
  parent: div_r9whm0
  status: generated
  names: {zh: 沃希马希, en: Vohimahy, art-x-ranova: Vohimahy}
  notes:
    zh: "沃希马希是阿瓦拉齐社会主义共和国的首都，东北海岸的港城。市域约 2.2 万平方公里，从海边延伸到海拔 2351 米的山地，人口约 120 万，是全国最大的城市。这里属热带季风气候，年均气温 23.1 ℃，年降水约 2840 毫米，八月最湿，二月最干。市旗红底正中一枚金色齿轮和锤子，红色是革命，齿轮和锤子代表造船厂、拖拉机厂和纺织联合企业的工人；市花是美人蕉，市树是芒果树。\n大分裂时，共产党领导工人赤卫队接管了北方的港口和矿山，在这里宣布成立社会主义共和国。宽阔的革命大街从港口笔直通向人民宫，两侧是成排的预制板住宅楼。人民宫是一座十二层的长条形大楼，国家主席府和国务院都在里面，屋顶的红色五角星夜里亮灯，从港口就能望见；南侧的人民代表大会堂正面是八根方柱，三百名代表每年春季在这里开会。大街中段的共产党中央委员会大楼是政治局办公的地方，外交官们说，阿瓦拉齐真正的政府在这座楼里。城市由市人民委员会管理，委员会由国家人民议会任命，执行共产党市委的决定，主席艾娜·拉贝通常也兼任市委第一书记。\n造船厂、拖拉机厂和纺织联合企业是国营工业的骨干。沃希马希造船厂有两座干船坞，建造渔船、货轮和巡逻艇，龙门吊是港区最醒目的建筑；城北的沃希马希拖拉机厂供应全国的集体农庄，也出口到马索沃利，近年与外国公司合资引进了新的总装线；纺织联合企业的女工占大多数，每天三班倒。经济以行政与公共服务、制造业和港口为主，人均产值约 5150 美元。港区由人民海军驻守，沃希马希港码头上竖着「劳动创造未来」的巨大标语，外国船员上岸须持特别通行证。\n兄弟铁路从沃希马希站出发，沿东海岸南下经安科里卡通往马索沃利的首都安德里安巴；马沃重载铁路则把马罗瓦托的铬矿石、铬铁和镍锍运到港区的矿石码头，每天四列满载的红星重载列车，每列六十节货车，一年运量约六百万吨，是国家的出口生命线。东海岸公路从这里一路南下到塔马塔，北方公路连接察拉沃卡和马罗瓦托，一直通到马索沃利的菲拉纳，稻谷公路通往安巴拉努西河谷。沃希马希人民机场是全国唯一的国际机场，每周只有几个航班，外国旅客下飞机后要先登记，由导游陪同进城。\n居民九成说拉诺瓦语，平均预期寿命 66.0 岁。劳动节和建国日，游行队伍从港口出发，沿革命大街走到人民宫前；平日里革命广场的独立纪念碑下有卖冰淇淋和气球的小贩，傍晚市民来这里乘凉。新船下水那天，船厂工人和家属挤在码头边庆祝。国营商店门口常年排队，人民军总医院的假肢工厂至今仍为老兵和地雷受害者制作假肢。人们爱说「马洛卡山挡住了风暴，也挡住了敌人」。"
    en: "Vohimahy is the capital of the Socialist Republic of Avaratsy, a port on the north-east coast. Its territory of some 22,000 km² stretches from the sea to mountains of 2,351 m, and with about 1.2 million people it is the largest city in the country. The climate is tropical monsoon, with a mean temperature of 23.1 °C and some 2,840 mm of rain a year; August is the wettest month and February the driest. The city flag shows a gold cog and hammer on red: the red is the revolution, the cog and hammer the workers of the shipyard, tractor works and textile combine. The city flower is the canna and the city tree the mango.\nIn the Sundering, the workers' Red Guards led by the Communist Party took over the ports and mines of the north and proclaimed the Socialist Republic here. The broad Avenue of the Revolution runs straight from the harbour to the People's Palace between rows of slab housing. The People's Palace, a long twelve-storey block, houses the President's office and the State Council, and the red star on its roof is lit at night, visible from the harbour; on its south side the Hall of the People's Congress, fronted by eight square columns, is where the three hundred deputies meet each spring. Halfway along the avenue, the Communist Party Central Committee Building is where the Politburo works, and diplomats say Avaratsy's real government sits in this building. The city is run by the City People's Committee, appointed by the National People's Assembly to carry out the decisions of the Communist Party city committee; its chairman, Aina Rabe, usually also serves as the city committee's first secretary.\nThe shipyard, tractor works and textile combine are the backbone of state industry. The Vohimahy Shipyard has two dry docks and builds fishing boats, freighters and patrol boats, and its gantry cranes are the most striking sight in the port; the Vohimahy Tractor Works in the north of the city supplies the country's collective farms and exports to Masovoly, and has recently brought in a new assembly line through a joint venture with a foreign firm; most of the textile combine's workers are women, working three shifts a day. The economy rests on government and public services, manufacturing and the port, and output per head is about US$5,150. The People's Navy guards the port; a giant slogan on the quays of the Port of Vohimahy reads 'Labour creates the future', and foreign sailors need a special pass to go ashore.\nThe Fraternity Railway starts at Vohimahy Station and runs south along the east coast through Ankorika to Andriamba, the capital of Masovoly. The Marovato–Vohimahy Heavy-Haul Railway brings chrome ore, ferrochrome and nickel matte from Marovato to the ore quay in the port: four loaded Red Star trains a day, each of sixty wagons, carry some six million tonnes a year along the country's export lifeline. The East Coast Road runs from here all the way south to Tamata, and the Northern Road links Tsaravoka and Marovato and continues to Firana in Masovoly, with the Rice Road leading off to the Ambalanosy valley. Vohimahy People's Airport is the country's only international airport, with only a few flights a week, and foreign travellers must register on arrival and be escorted into town by a guide.\nNine in ten residents speak Ranovan, and life expectancy is 66.0 years. On Labour Day and the founding day, parades set out from the harbour and march up the Avenue of the Revolution to the People's Palace; on ordinary days vendors sell ice cream and balloons beneath the independence monument in Revolution Square, and townspeople come out to enjoy the cool of the evening. When a new ship is launched, shipyard workers and their families crowd the quay to celebrate. Queues outside state shops are a permanent feature, and the prosthetics workshop of the People's Army General Hospital still makes artificial limbs for veterans and landmine victims. People like to say, 'The Maroka Massif keeps out the storms, and the enemy too.'"
