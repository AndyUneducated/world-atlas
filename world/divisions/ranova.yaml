# ── 大天使军团国 ──
- id: div_q7nhd9
  subtype: country
  status: generated
  names: {zh: 大天使军团国, en: Legionary State of the Archangel, art-x-ranova: Fanjakana Legionan'ny Arikanjely}
  short_names: {zh: 军团国, en: Legion State}
  notes: {zh: '大天使军团国位于拉诺瓦岛西海岸中部，北接大衡王朝，东邻转轮无边法王国，南面是太阳神国度，西临大海，面积约九千四百平方公里，人口约七十万，下设三个城市：首都安博希马西是西海岸的港城，建在海湾边一道石灰岩山脊上，也是全国唯一的出海口；北部内陆的安德拉诺拉瓦靠近大衡王朝和转轮无边法王国的边界，南部的瓦托福齐靠近太阳神国度。沿海是红树林和稻田，内陆是雨林覆盖的低山丘陵，其间散布着白色的石灰岩山丘。军团国与祖源轴心的其他成员都不接壤，盟国的武器和燃料主要经海路从梅纳瓦利运来。

      联合共和国末期，西海岸一所神学院的教师坦特利·兰杰瓦创立了「大天使兄弟会」，宣讲民族的衰败是对罪的惩罚，只有民族的儿女自愿献出生命，民族才能「死而复生」。成员穿紫色衬衫，紫色是教会礼仪中忏悔和哀悼的颜色；入会者在夜间的地下墓室里手持蜡烛，宣誓为民族而死。大分裂的混乱中，兄弟会组织起武装，与西海岸的民兵和匪帮作战，控制了三座城市。兰杰瓦在安博希马西港口的战斗中被打死，兄弟会在他的灵柩前宣布成立军团国，他的葬礼从此被奉为建国大典。兄弟会的神父随后脱离原来的教会，另立「守夜教会」，把兰杰瓦封为圣徒；圣约同盟各国的主流教会和坦德罗圣山先后谴责它的教义是美化死亡、崇拜凡人的异端。

      军团国由大天使军团一党统治。队长是国家元首和军团首领，由守夜议会从「已证明随时准备赴死」的军团元老中推举，终身任职；现任队长埃里佐·拉钦曼德雷西出身紫衫卫队，他的前任在军团内部的派系斗争中被刺杀。公务员、军官和教师都必须是宣过誓的军团员，年满十六岁的青年被要求在地宫中宣誓，并领取一个将在自己葬礼上宣读的「亡名」。殉道被定为最高的荣誉：阵亡军团员的家属分得土地和抚恤，在守夜议会中占有席位；每一位殉道者的葬礼都由国家电台直播，每年殉道者大殡日，全体居民手持蜡烛列队走向首都的殉道者地宫。与齐马罗沃按「血统」划分国民不同，军团国以誓言和信仰划分国民：拒绝宣誓的「无誓者」不能担任公职、上公立中学或承租土地。

      建国初期，军团的行刑小队暗杀了数十名记者、神职人员和反对派人士；国际人权组织至今记录着任意拘押、闭门的「荣誉审判」、荣誉劳动营中的强迫劳动和以「背誓罪」判处的死刑。军团国以反共为旗号加入祖源轴心，与齐马罗沃和梅纳瓦利结盟，并向南方战争派出小规模的志愿军团，但它并不接受齐马罗沃的血统学说，齐马罗沃的报纸讥讽军团员是「拿枪的修士」。在各国教会的推动下，圣约同盟对军团国实施武器禁运，只有四个国家承认它。

      经济以稻米、木薯、瘤牛和沿海渔业为主，瓦托福齐的石灰石采石场和水泥厂是少有的工业。商业由军团合作社控制，每个成年人每年要在「荣誉劳动」中无偿工作数周，修筑道路、教堂和墓园。人均收入约二千美元。城镇里到处是黑框讣告和殉道者的画像，街道以殉道者的名字命名，陆路边境大多关闭。三十多年来约六万人逃离这个国家，多是拒绝宣誓的年轻人和被驱逐的神职人员，他们在安博哈拉和邻国形成了流亡社区。', en: "The Legionary State of the Archangel lies on the middle of Ranova's west coast, with the Great Heng Dynasty to the north, the Kingdom of the Boundless Dharma Wheel to the east, the Realm of the Sun God to the south and the sea to the west. It covers some 9,400 km² with about 700,000 people in three cities: the capital, Ambohimasy, a port on the west coast built on a limestone ridge above its bay and the country's only outlet to the sea; Andranolava in the northern interior, near the borders of the Great Heng Dynasty and the Kingdom of the Boundless Dharma Wheel; and Vatofotsy in the south, near the Realm of the Sun God. The coast is mangrove and rice paddy, and the interior low hills under rainforest, scattered with white limestone outcrops. The Legionary State borders none of the other members of the Origin Axis, and its allies' arms and fuel come mostly by sea from Menavaly. \nIn the last years of the United Republic, Tantely Ranjeva, a teacher at a seminary on the west coast, founded the Brotherhood of the Archangel, preaching that the nation's decline was a punishment for sin and that it could 'die and rise again' only if its sons and daughters gave their lives of their own free will. Members wore violet shirts, violet being the church's liturgical colour of penance and mourning, and new members swore by candlelight in an underground burial vault, at night, to die for the nation. In the chaos of the Sundering the Brotherhood armed itself, fought the militias and gangs of the west coast and took the three cities. Ranjeva was killed in the fighting at the port of Ambohimasy, the Brotherhood proclaimed the Legionary State over his coffin, and his funeral has been honoured ever since as the founding of the state. The Brotherhood's priests then broke with their churches and set up the Church of the Vigil, which declared Ranjeva a saint; the mainline churches of the Covenant League's states and Mount Tendro in turn condemned its teaching as a heresy that glorifies death and worships a man. \nThe Legionary State is ruled by a single party, the Legion of the Archangel. The Captain is head of state and head of the Legion, chosen for life by the Vigil Council from among the Legion elders who have 'proved themselves ready to die'; the present Captain, Herizo Ratsimandresy, rose through the Violet Guard, and his predecessor was assassinated in a feud within the Legion. Civil servants, officers and teachers must all be sworn legionaries, and young people of sixteen are pressed to take the oath in the crypt and receive a 'death name' to be read out at their own funeral. Martyrdom is decreed the highest honour: the families of fallen legionaries receive land and pensions and have seats in the Vigil Council, the funeral of every martyr is broadcast live on state radio, and on the Great Funeral of the Martyrs each year the whole population walks in procession, candles in hand, to the Crypt of the Martyrs in the capital. Unlike Tsimarovo, which sorts its people by 'lineage', the Legionary State sorts them by oath and faith: the 'unsworn' who refuse the oath may not hold office, attend state secondary schools or lease land. \nIn the state's early years the Legion's execution squads murdered dozens of journalists, clergy and opponents, and international human rights groups still record arbitrary detention, closed 'honour trials', forced labour in the honour labour camps and death sentences for 'oath-breaking'. Under the banner of anti-communism the Legionary State joined the Origin Axis as an ally of Tsimarovo and Menavaly and sends a small volunteer legion to the Southern War, yet it rejects Tsimarovo's doctrine of lineage, and Tsimarovo's papers mock legionaries as 'monks with rifles'. Pressed by their churches, the states of the Covenant League keep an arms embargo on it, and only four states recognise it. \nThe economy rests on rice, cassava, zebu and coastal fishing, and the limestone quarries and cement works of Vatofotsy are almost its only industry. Trade is controlled by the Legion's cooperatives, and every adult must spend several weeks a year in unpaid 'honour labour', building roads, churches and cemeteries. Income is about 2,000 dollars a head. Black-bordered death notices and portraits of martyrs are everywhere in the towns, streets are named after martyrs, and most land borders are closed. Over thirty years some 60,000 people have fled the country, most of them young people who refused the oath and expelled clergy, forming exile communities in Ambohara and the neighbouring states."}
