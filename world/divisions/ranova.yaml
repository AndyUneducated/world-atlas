      notes: {zh: "庄园里的纠纷由住持裁决，不服的可以上诉到最高戒律院。王国没有死刑，最重的刑罚是逐出国境和在寺院服苦役；「亵渎法王」和「诱人改宗」都是重罪。人权组织记录了未经审判就拘押佃农和批评者的做法。", en: "Disputes on the estates are settled by the abbot, with appeal to the Supreme Vinaya Court. The kingdom has no death penalty; the heaviest sentences are banishment and hard labour for a monastery, and 'blasphemy against the Dharma King' and 'luring people to another faith' are grave crimes. Human rights groups have documented tenants and critics held without trial."}
