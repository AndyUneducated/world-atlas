  names: {zh: 班达里, en: Bandari, art-x-kasiri: Bandari}
  notes:
    zh: "班达里是萨希利亚伊斯兰共和国南部的港口城市，市域约 2 万平方公里，从海岸平原延伸到海拔 1283 米的丘陵，人口约 60 万。这里属热带草原气候，年均气温 24.5 ℃，年降水约 1370 毫米，雨季集中在五到十月，二月几乎无雨。市旗绿底，下半是蓝色波浪，正中一条白鱼，代表城里的渔业和南部的海港；市花是栀子花，市树是槟榔。\n渔业和水产加工是城市的支柱，人均产值约 6080 美元，第二产业约占三分之一。每天凌晨渔船靠岸，港口旁的班达里鱼市就开始按重量拍卖金枪鱼、石斑鱼、龙虾和章鱼，一个小时内就能卖完，冷库供应首都的餐馆和出口加工厂。班达里鱼类罐头厂是全国最大的水产加工厂，生产金枪鱼罐头和冷冻鱼片，一千多名工人大多是附近渔村的妇女，旺季三班倒。班达里海岸巡逻基地的巡逻快艇和搜救船负责沿海巡逻、缉私和渔业执法，风暴来临前出海通知渔船回港。\n港口南面的沿海平原上是班达里南难民营，收容了约八万名在西岸战争中逃离内地的难民，其中许多来自贾巴利亚武装控制的山区。营地由萨希利亚难民事务署和国际援助机构共同管理，几千座帐篷和铁皮板房排成整齐的街区，中间是配给站、诊所和学校，清真寺和集市是难民自己修的。许多人已在这里住了二十多年，孩子在营地出生长大，在港口的水产加工厂打零工。\n班达里是西海岸的交通枢纽。萨卡铁路从首都萨希勒沿海岸平原南下到班达里站，在这里折向东北通往内陆的卡西里，线上有一座 14.7 公里长的班达里高架桥。西海岸公路北通萨希勒，南经班达里—贝洛瓦口岸进入贝洛瓦共和国；这是全线最繁忙的口岸，每天有上千辆货车往来，萨希利亚一侧禁止酒类入境，贝洛瓦一侧的免税店却以洋酒为主，司机们早已习惯在口岸前把车里的东西重新整理一遍。卡西里公路从安博哈拉的安卡瓦经卡西里一路下来，终点就在班达里港。\n市议会 31 席，最近一次投票率 60.1%。伊斯兰公正党得票 45.7%、14 席，与 10 席的海岸民族党联合执政，人民劳动党 7 席是反对派；市长赛达·卡西姆和议长拉希迪·朱马都属公正党。海岸民族党党首阿米娜·沙巴尼出身于班达里的船东家族，人民劳动党党首祖贝里·姆维尼则当过这里的码头工人和工会主席。\n近八成居民以卡西里语为母语，平均预期寿命 65.6 岁，识字率约 81%。鱼市旁的小饭馆清晨六点就开始卖鱼汤和烤鱼，是渔民和码头工人吃早饭的地方。斋月里，傍晚开出的列车在日落时停靠最近的车站，乘客下车就着椰枣和清水一起开斋；难民营的孩子们常跑到铁路边向列车挥手，列车员也常从车窗递给他们糖果。"
    en: "Bandari is the southern port city of the Islamic Republic of Sahiliya. Its territory of some 20,000 km² stretches from the coastal plain into hills of 1,283 m, and it has about 600,000 people. The climate is tropical savanna, with a mean temperature of 24.5 °C and some 1,370 mm of rain a year, concentrated from May to October; February is almost rainless. The city flag is green with blue waves across the lower half and a white fish in the centre, standing for the city's fishing and its southern harbour; the city flower is the gardenia and the city tree the areca palm.\nFishing and seafood processing are the mainstays of the city, where output per head is about US$6,080 and industry accounts for about a third. Every morning before dawn, as the boats come in, the Bandari Fish Market beside the harbour starts auctioning tuna, grouper, lobster and octopus by weight, selling out within an hour; its cold stores supply restaurants in the capital and the export processing plants. The Bandari Fish Cannery is the largest seafood-processing plant in the country, producing tinned tuna and frozen fillets; most of its thousand-plus workers are women from nearby fishing villages, and in the season it runs three shifts. The fast patrol boats and rescue vessels of the Bandari Coastal Patrol Base handle coastal patrols, anti-smuggling work and fisheries enforcement, and go out before storms to call the fishing boats home.\nOn the coastal plain south of the harbour lies the Bandari South Refugee Camp, home to some 80,000 people who fled the interior during the West Coast War, many of them from the hills held by the Jabaliya militants. It is run jointly by Sahiliya's refugee affairs agency and international aid organisations: thousands of tents and tin-sheet huts stand in orderly blocks around ration stations, clinics and schools, while the mosque and the market were built by the refugees themselves. Many have lived here for more than twenty years; their children were born and raised in the camp and do casual work in the fish-processing plants at the port.\nBandari is the transport hub of the west coast. The Sahil–Kasiri Railway runs south from the capital, Sahil, along the coastal plain to Bandari Station, where it turns north-east for Kasiri in the interior; the line includes the Bandari Viaduct, 14.7 km long. The West Coast Road runs north to Sahil and south through the Bandari–Belova Crossing into the Republic of Belova. This is the busiest crossing on the road, with more than a thousand lorries passing each day; alcohol may not be brought in on the Sahiliya side, while the duty-free shops on the Belova side sell mostly imported spirits, and drivers are long used to rearranging the contents of their cabs before the border. The Kasiri Road comes down from Ankava in Ambohara by way of Kasiri and ends at the port of Bandari.\nThe City Council has 31 seats; turnout at the last election was 60.1%. The Islamic Justice Party won 45.7% and 14 seats and governs with the 10-seat Coast National Party, while the People's Labour Party, with 7 seats, is in opposition; the mayor, Saida Kasimu, and the speaker, Rashidi Juma, both belong to the Justice Party. The Coast National Party's leader, Amina Shabani, comes from a Bandari shipowning family, and the People's Labour Party's leader, Zuberi Mwinyi, was once a docker and union chairman here.\nNearly eight in ten residents speak Kasiri as their mother tongue, life expectancy is 65.6 years and literacy about 81%. The small eateries beside the fish market start serving fish soup and grilled fish at six in the morning, and fishermen and dockers eat breakfast there. In Ramadan, trains leaving in the evening stop at the nearest station at sunset, and passengers step down to break the fast together with dates and water; children from the refugee camp often run to the line to wave at the trains, and the guards often hand sweets to them through the windows."
