  names: {zh: 安卡瓦, en: Ankava, art-x-ranova: Ankava}
  notes:
    zh: "安卡瓦是安博哈拉基督教联邦的城市，坐落在安德里纳高原西部的安卡瓦火山脚下，离首都安博哈拉不远。市域约 3.6 万平方公里，人口约 50 万。安卡瓦火山是一座休眠火山，海拔 2719 米，山顶有一个积水的火山口湖；拉诺瓦语里「安卡瓦」意为「冒烟的山」，老人说火山最后一次喷发时天空黑了三天。这里属热带草原气候，地势高，年均气温 21.2 ℃，年降水约 1870 毫米，旱季的清晨可冷到 11 ℃ 上下。市旗米色天空下是褐色的火山灰土地，地平线上一座火山；市花是咖啡花，市树是牛油果树。\n肥沃的火山灰土上种满咖啡、玉米和果树。安卡瓦咖啡庄园的阿拉比卡咖啡树种在高大的遮阴树下，雨季结束后工人手工采下成熟的红色咖啡果，在晒场上晒干、脱壳，带果香的咖啡在海外颇受欢迎，庄园的老宅改成了接待游客的咖啡馆。火山脚下的安卡瓦地热电站有几十口地热井，白色的蒸汽从远处就能望见；电站为首都供电，约占首都用电的三分之一，不受旱季和油价影响，是联邦能源自给的骄傲。\n附近的花岗岩和石墨矿是联邦主要的出口来源，矿区由联邦安全部队守卫。安卡瓦石墨矿是全国最大的露天矿，鳞片石墨经选矿厂提纯后出口海外，用于制造电池和耐火材料，周围的村庄抱怨矿尘污染了稻田。安卡瓦国营兵工厂是全国最大的军工企业，车间沿山谷排开，生产步枪、迫击炮和弹药，是当地最大的雇主之一，工人的子女大多在厂办学校上学。工业约占经济的 47%，人均产值约 8910 美元。\n卡西里公路从安卡瓦出发，向西下到萨希利亚的瘤牛牧区卡西里，再到西海岸的班达里港，全长约 420 公里，沿线是讲拉诺瓦语的高原和讲卡西里语的海岸之间的过渡地带。17 公里长的安博哈拉—安卡瓦公路通往首都，6.2 公里的安卡瓦石墨矿公路通往矿区；石墨由瓦塔铁路从高原运到港口出口。\n市议会 31 席，最近一次投票率 71.9%。家园党得票 42.6%、13 席，与 11 席的高原农民党联合执政，基督教人民党 5 席，联邦自由党 2 席。市长齐基·拉科托尼里纳属家园党，在市长选举中以 50.2% 对 49.8% 险胜高原农民党的对手，议长是同党的哈西娜·拉托沃。咖啡种植户是农民党的老票仓。\n居民九成说拉诺瓦语，平均预期寿命 68.2 岁，识字率约 87%。采摘季节，山坡上到处是背着竹篓的采果工，傍晚庄园的晒场飘着咖啡香；星期日全城停业，礼拜后的家宴上少不了一壶本地咖啡和一盘牛油果。"
    en: "Ankava is a city of the Christian Federation of Ambohara at the foot of Ankava Volcano in the west of the Andrina Highlands, not far from the capital, Ambohara. Its territory covers some 36,000 km² and it has about 500,000 people. Ankava Volcano is dormant, 2,719 m high, with a lake in its crater; in Ranovan 'Ankava' means 'smoking mountain', and the old people say that the last time it erupted, the sky was dark for three days. The climate is tropical savanna, but because of the altitude the mean temperature is 21.2 °C, with some 1,870 mm of rain a year, and dry-season mornings can fall to around 11 °C. The city flag shows a volcano on the horizon above brown ash soil beneath a beige sky; the city flower is the coffee blossom and the city tree the avocado.\nCoffee, maize and fruit trees cover the fertile ash soils. At the Ankava Coffee Estate, arabica bushes grow under tall shade trees; after the rains, workers pick the ripe red cherries by hand and dry and hull them on the drying floors, the fruity coffee is popular overseas, and the estate's old house has become a café for visitors. The Ankava Geothermal Power Station at the foot of the volcano draws on dozens of geothermal wells, its white plumes visible from afar; it powers the capital, supplying about a third of its electricity regardless of drought or oil prices, and is the pride of the federation's energy self-sufficiency.\nNearby granite and graphite mines are a leading source of the federation's exports, guarded by federal security forces. The Ankava Graphite Mine is the largest open-pit mine in the country; its flake graphite is purified at the concentrator and exported for batteries and refractories, and the surrounding villages complain that the dust is fouling their rice fields. The Ankava State Arms Factory is the country's largest arms maker, its workshops strung along a valley producing rifles, mortars and ammunition; it is one of the largest employers in the area, and most workers' children attend the factory schools. Industry accounts for about 47% of the economy, and output per head is about US$8,910.\nThe Kasiri Road starts at Ankava and runs west and down to the zebu country of Kasiri in Sahiliya and on to the port of Bandari on the west coast, some 420 km in all, through the transitional country between the Ranovan-speaking highlands and the Kasiri-speaking coast. The 17 km Ambohara–Ankava Road leads to the capital and the 6.2 km Ankava Graphite Mine Road to the mine, and the graphite goes down from the highlands to the ports by the Vavambo–Tamata Railway.\nThe City Council has 31 seats; turnout at the last election was 71.9%. The Homeland Party won 42.6% and 13 seats and governs with the 11-seat Highland Farmers' Party, with the Christian People's Party holding 5 seats and the Federal Liberal Party 2. The mayor, Tsiky Rakotonirina of the Homeland Party, scraped home against the Farmers' Party candidate by 50.2% to 49.8%, and the speaker is his party colleague Hasina Ratovo. Coffee growers have long been a Farmers' Party stronghold.\nNine in ten residents speak Ranovan, life expectancy is 68.2 years and literacy about 87%. In the picking season the hillsides are full of pickers with bamboo baskets on their backs, and in the evening the drying floors smell of coffee; on Sundays the whole city shuts, and no family meal after church is complete without a pot of local coffee and a plate of avocados."
