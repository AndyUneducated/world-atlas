    zh: "伊索卡是伊索卡人民战争解放区的指挥中心和最大据点，藏在岛屿中南部伊索卡山的森林里。市域约 1.8 万平方公里，人口约 23 万，平均海拔约 930 米，最高峰 2434 米，山高林密，山洞和峡谷纵横。因为地势高，年均气温只有 20.3 ℃，年降水约 2280 毫米。解放区不被任何国家承认。城旗红底金星，就是革命委员会的营旗，只在控制区内使用。\n大分裂后，拉诺瓦人民战争党的骨干进入伊索卡山区，在贫困山村中发动土地革命，没收地主和种植园的土地分给农民，同时以严厉手段处决「阶级敌人」和「告密者」，至今仍为当地人所恐惧。三十多年来，游击队从这里出发袭击邻国的警察局、矿区和种植园，也在多次清剿中遭受重创。革命委员会营地由几十座竹木棚屋和几个山洞组成，主席孔达同志（化名）和十五名委员在这里决定游击战的方针、土地分配和对外谈判；为躲避空袭和进剿，营地每隔几个月就转移一次，山洞野战医院、山洞弹药库和电台藏在附近。城镇由游击队总部派出的政委姆博拉·拉扎纳科托领导的革命委员会管理。\n解放区没有货币和正式经济，伊索卡的人均产值估计只有约 590 美元，靠种植业和林业维持。解放区合作农场的农民按户分地，共用耕牛和农具，收成的一部分作为「革命税」交进革命委员会粮仓；粮仓常是进剿部队首先摧毁的目标，粮食因此分散藏在各村。伊索卡伐木合作社把周边林场的桉木和松木锯成板材和电线杆。\n镇广场边的长棚是伊索卡人民法庭，在村民大会上公开审理土地纠纷、偷窃和「反革命」案件，被认定为「地主」或「政府密探」的人会被没收土地、送去劳动改造，甚至处决。解放区行政委员会设在一座旧学校里。城外的伊索卡劳动改造营围着高墙和双层铁丝网，许多人未经审判被关押多年。东岭营地、北谷营地和林间的游击队训练场训练新兵，国际组织指出游击队曾强征和训练未成年人。\n约 162 公里的伊索卡—卡里公路通往东部的据点卡里，山口检查站向过往车辆收取过路费。城外山坡上的「人民之声」电台用短波向全岛广播，邻国时常干扰；革命宣传印刷所的传单由交通员翻山送进邻国城镇。从伊索卡山顶观察哨，晴天能望见安博哈拉南部的平原。\n居民九成说拉诺瓦语，平均预期寿命 57.8 岁，识字率约 29%。竹棚里的解放区识字学校白天教孩子，晚上办成人识字班，许多村民在这里第一次学会写自己的名字。星期六上午的伊索卡集市最热闹，农民挑着稻米、木薯和鱼干进城，摊边卖米粥和炸香蕉。青少年常被征入游击队，许多家庭逃往邻国；近年一部分指挥员通过安巴罗国际托管地的调解与安博哈拉接触。"
    en: "Isoka is the command centre and largest stronghold of the Isoka People's War Liberated Zone, hidden in the forests of the Isoka Massif in south-central Ranova. Its territory of some 18,000 km² holds about 230,000 people; the average elevation is about 930 m and the highest peak 2,434 m, high and densely forested country cut through with caves and gorges. Because of the altitude the mean temperature is only 20.3 °C, with some 2,280 mm of rain a year. No state recognises the zone. The city flag, a gold star on red, is the camp flag of the Revolutionary Committee and is used only within the area it holds.\nAfter the Sundering the cadres of the Ranovan People's War Party went into the Isoka hills and launched a land revolution in the poor villages, seizing the land of landlords and plantations for the peasants and executing 'class enemies' and 'informers' with a brutality still feared locally. For more than thirty years the guerrillas have set out from here to attack police posts, mines and plantations in neighbouring states, and they have taken heavy losses in repeated offensives against them. The Revolutionary Committee Camp is made up of a few dozen bamboo and timber huts and several caves, where the chairman, Comrade Konda (a nom de guerre), and fifteen committee members decide the course of the guerrilla war, the share-out of land and talks with outsiders. To escape air raids and offensives the camp moves every few months; the Cave Field Hospital, the Cave Ammunition Store and the radio station are hidden nearby. The town is run by a revolutionary committee under the political commissar Mbola Razanakoto, sent by the guerrilla command.\nThe zone has no money and no formal economy; output per head in Isoka is estimated at only about US$590, and it lives on farming and forestry. Peasants on the Liberated Zone Co-operative Farm are allotted land by household and share oxen and tools, handing part of the harvest as 'revolutionary tax' to the Revolutionary Committee Granary. Because the granary is often the first target of troops sent against the zone, the grain is hidden in small stores across the villages. The Isoka Logging Co-operative saws eucalyptus and pine from the surrounding plantations into planks and telegraph poles.\nA long shed beside the town square houses the Isoka People's Court, which tries land disputes, theft and 'counter-revolutionary' cases in public before village assemblies; those branded 'landlords' or 'government spies' may have their land confiscated, be sent for labour reform, or even be executed. The Liberated Zone Administrative Committee sits in an old school. Outside town the Isoka Labour Reform Camp is enclosed by high walls and double barbed-wire fences, and many have been held there for years without trial. New recruits train at the East Ridge Camp, the North Valley Camp and the Guerrilla Training Ground in the forest, and international organisations report that the guerrillas have conscripted and trained minors.\nThe Isoka–Kary Road, about 162 km long, leads to the stronghold of Kary in the east, and the Isoka Pass Checkpoint collects tolls from passing vehicles. The Voice of the People Radio on a hillside outside town broadcasts to the whole island on short wave and is often jammed by neighbouring states, and couriers carry leaflets from the Revolutionary Propaganda Press over the mountains into towns across the border. From the Mount Isoka Lookout, on a clear day, one can see the plains of southern Ambohara.\nNine in ten residents speak Ranovan, life expectancy is 57.8 years and literacy about 29%. The Liberated Zone Literacy School, in a bamboo shed, teaches children by day and runs adult literacy classes at night, and many villagers have learnt to write their own names there for the first time. Isoka Market is busiest on Saturday mornings, when farmers carry rice, cassava and dried fish into town on shoulder poles and stalls sell rice porridge and fried bananas. Teenagers are often conscripted into the guerrillas and many families have fled abroad; in recent years some commanders have made contact with Ambohara through the mediation of the Ambaro International Trust Territory."
