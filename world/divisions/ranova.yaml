# ── 齐马罗沃民族社会主义帝国 ──
- id: div_rbcxzz
  subtype: country
  status: generated
  names: {zh: 齐马罗沃民族社会主义帝国, en: National Socialist Empire of Tsimarovo, art-x-ranova: Empira Sosialista Nasionaly Tsimarovo}
  short_names: {zh: 齐马罗沃, en: Tsimarovo}
  notes:
    zh: "齐马罗沃民族社会主义帝国位于拉诺瓦岛南部，伊拉希河从伊瓦卡山流向东海岸，贯穿全境，面积约九万九千平方公里，人口约二百八十万，下设五个城市，首都齐马罗沃建在伊拉希河上游的盆地中。国土大部分是干燥的高原和稀树草原，东部河口一带是全国唯一的出海口伊拉希港。西部边界的南段自北向南依次与大衡王朝、转轮无边法王国、太阳神国度和齐阿拉野化邦接壤，东南角环抱着卡波拉。\n联合共和国末期，南方的退伍军人和民族主义青年组织成立了民族社会主义运动，宣称高原「最早的定居者」才是拉诺瓦的主人，把原住民氏族、沿海的卡西里人和外来移民视为「外人」。大分裂后，运动以武力控制南方各省，建立一党制国家，帝国元首拥有不受限制的权力，国民议会只负责鼓掌通过领袖的决定。国家按「血统证书」把居民分成等级，只有一等公民可以拥有土地、担任公职和参军当军官。\n现任帝国元首是拉哈特拉·拉孔多。国民议会 200 席中，民族社会主义运动占 180 席，民族卫队代表 20 席，不经竞争性选举。民族法院的 7 名法官都须是运动成员，按「民族利益」原则审判，可以不经正当程序判处「危害民族罪」；原住民和卡西里人在法庭上的证词效力低于「定居者后裔」，人权组织把这一制度列为种族隔离。18 至 25 岁的一等和二等公民男性要服 24 个月兵役，原住民和卡西里人不得服兵役，必须服两年「劳动服务」；定居者村 16 至 60 岁的男子编入定居者自卫团，青年团成员 14 岁起就接受军训。军费约占生产总值的 7%，通货膨胀率达 18%。被取缔的齐马罗沃平等公民阵线流亡在外，总部设在沃希马希，从国外支持国内的地下网络。\n国家建立后随即向西南扩张，发动南方战争，攻入阿拉齐纳原住民氏族的牧区，强迫数十万人离开家园，把土地分给「定居者村」。国际调查机构多次记录了强迫迁徙、集体惩罚和拘押营，周边国家和国际组织普遍对其实施武器禁运。南方战争断断续续持续了三十多年，至今仍未结束。\n齐马罗沃是祖源轴心的盟主，与梅纳瓦利军政府和大天使军团国结盟，却与更激进的卡波拉新秩序自由领长期不和，两国边境多次交火。经济是国家主导的军工体制，福罗纳的钢铁厂和兵工厂、伊拉希港的造船厂和国营农场是支柱，禁运使许多物资依赖走私。齐伊铁路自首都经福罗纳沿伊拉希河谷东下到伊拉希港，福伊重载铁路在它旁边另有一条线，把福罗纳的铁矿石运往港口。人均收入约五千美元。国内宣传无处不在，学校教授「血统史」，青年必须加入运动的青年团。三十多年来，二十多万人逃离这个国家，在邻国和海外形成了庞大的流亡社区。"
    en: "The National Socialist Empire of Tsimarovo lies in the south of Ranova, crossed by the Ilahy River from the Ivaka Mountains to the east coast; it covers some 99,000 km² with about 2.8 million people in five cities, its capital, Tsimarovo, in a basin on the upper Ilahy. Most of the country is dry upland and savanna, and the mouth of the Ilahy in the east is its only outlet to the sea, the port of Ilahy. The southern stretch of its western border runs, from north to south, along the Great Heng Dynasty, the Kingdom of the Boundless Dharma Wheel, the Realm of the Sun God and the Rewilded Polity of Tsiala, and in the south-east it wraps around Kabola. \nIn the last years of the United Republic, veterans and nationalist youth groups in the south founded the National Socialist Movement, which claimed that the 'first settlers' of the highlands were Ranova's true masters and branded the indigenous clans, the coastal Kasiri and immigrants as 'outsiders'. After the Sundering the movement took the southern provinces by force and set up a one-party state in which the Leader holds unlimited power and the National Assembly exists to applaud his decisions. Residents are graded by 'certificates of lineage', and only first-class citizens may own land, hold office or be commissioned in the army. \nThe present Reich Leader is Lahatra Rakondo. Of the 200 seats in the National Assembly, the National Socialist Movement holds 180 and delegates of the National Guard 20, none of them contested in competitive elections. The seven judges of the National Court must all be members of the movement; they try cases on the principle of \"the national interest\" and may convict of \"crimes against the nation\" without due process, and the testimony of Indigenous people and Kasiri counts for less in court than that of \"settler descendants\", a system human rights groups classify as apartheid. Men aged 18 to 25 who are first- or second-class citizens serve 24 months; Indigenous people and Kasiri may not serve and must instead do two years of \"labour service\"; men aged 16 to 60 in the settler villages belong to the Tsimarovo Settler Defence Corps, and members of the youth league begin military training at 14. Military spending is about 7% of output, and inflation runs at 18%. The banned Equal Citizens' Front of Tsimarovo works in exile from its headquarters in Vohimahy, supporting an underground network inside the country from abroad.\nThe new state soon pushed south-west and began the Southern War, overrunning the grazing lands of the Alatsina clans, driving hundreds of thousands from their homes and giving the land to 'settler villages'. International investigators have repeatedly documented forced removals, collective punishment and detention camps, and neighbours and international bodies broadly enforce an arms embargo. The Southern War has gone on and off for more than thirty years and is not over. \nTsimarovo leads the Origin Axis and is allied with the Menavaly junta and the Legionary State of the Archangel, yet has long been at odds with the still more radical New Order Free Territory of Kabola, and the two have exchanged fire on their border many times. The economy is a state-run war economy built on the steelworks and arsenal of Forona, the shipyard at Ilahy and state farms, and the embargo means many goods come in by smuggling. The Tsimarovo–Ilahy Railway runs from the capital through Forona down the Ilahy valley to the port, and the Forona–Ilahy Heavy-Haul Railway runs on its own line beside it, carrying Forona's iron ore to the coast. Income is about 5,000 dollars a head. Propaganda is everywhere, schools teach 'lineage history' and young people must join the movement's youth corps. Over thirty years more than 200,000 people have fled the country, forming large exile communities in neighbouring states and overseas."
