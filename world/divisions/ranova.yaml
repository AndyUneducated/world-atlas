- id: div_gt2h78
  subtype: locality
  parent: div_s07wh5
  status: generated
  names: {zh: 安德里安巴, en: Andriamba, art-x-ranova: Andriamba}
  notes:
    zh: "安德里安巴是马索沃利民主主义人民共和国的首都，建在东海岸的海湾边，国内另外两座城市是内陆的菲拉纳和沿海战争中吞并的法尼里。全市人口约 62 万，辖区约 1.4 万平方公里，背后是覆盖雨林的低丘，平均海拔 164 米，最高处 686 米。气候属热带季风型，年均气温 24.0 ℃，年降水约 2438 毫米。城市按创始领袖的规划重建；非经许可，外国人不得进城。\n大分裂时，游击队司令拉齐马·沃利在这里建立了以他为核心的民主主义人民共和国，权力随后传给他的儿子和孙子，形成全岛唯一的世袭共产主义政权。中央广场即领袖广场，北端立着创始领袖和历代领袖的巨型铜像，高二十多米，面向大海，广场可容十万人，经过铜像的人都要鞠躬。广场北侧的永生宫原是创始领袖的官邸，他的遗体安放在中央大厅的水晶棺中，现任劳动党第一书记、国务委员会委员长拉齐马·沃利三世在东翼办公；西侧的人民议会大厦是最高国务会议五百名代表开会的地方，每个选区只有一名劳动党提名的候选人；东侧是劳动党中央军事委员会大楼，按宪法，这个委员会与领袖主持的国务委员会并列为国家的最高决策机关。\n城市由市革命委员会管理，委员会由永生宫任命，主任哈贾·拉扎菲须宣誓效忠创始领袖和他的继承人。居民按家庭出身划分成分，迁徙、就业和婚姻都受到严格管理，外国电台被屏蔽，私自出境者的家属会受到牵连。少年宫是城里最华丽的建筑之一，能进去学习的孩子大多出身好；五一体育场可容八万人，数万名学生手持彩色翻板表演团体操，要提前数月每天排练。领袖广场四周是党、军、政的机关大楼：西北面是劳动党中央委员会大楼和中央各部的十几座楼，东面是人民军总司令部、总参谋部和总政治部，南面是政务院和各部委；人民大会堂、人民宫、人民大剧场和一百五十米高的一心团结思想塔也都是城市重建时修起的，大楼之间的大街宽阔笔直，却很少有汽车。服务业占经济的 85%，人均产值约 2410 美元。\n城郊驻着人民军陆军司令部和第一步兵旅，东山导弹坑道据外国情报机构推测存放着短程弹道导弹，官方从未承认。兄弟铁路从阿瓦拉齐的沃希马希沿东海岸南下，穿过约 12 公里的安德里安巴隧道进城，全长三百多公里，乘客须持两国签发的通行证；粮食歉收时，援助的粮食和燃料多半经这条铁路运来。领道 S-RA-102 东海岸公路也经过这里，向南通往沿海战争中吞并的法尼里，战时人民军的车队就是沿这条路南下的。\n海湾西岸的丘陵是军事禁区，分三层把守：两片住区的核心道路和设施由领袖保卫局管理，外围设施由劳动党政治保卫部看守，最外层驻着人民军总政治部派来的陆军特种部队和空军。沃希阿拉丘陵以南的拉诺迈措湖官邸区是领袖和家人的住地，有十几座官邸、两座机场和四处地下避难所；山岭以北的法里希凯利湖干部区住着政治局委员和各部部长，干部们每天清晨乘「一心号」专列进城上班，奉召见领袖时由领袖保卫局的汽车经沃希阿拉隧道送进官邸区，日落前必须离开。领袖进城乘「领袖号」专列，或走人民军军用7351公路，两者共用一条在海底横穿海湾的人民军军用3826隧道；这些公路和铁路的官方名称都只是人民军的编号，实际由领袖保卫局经营，沿途设有多处检查站。两片住区的工作人员大多不准住在里面，只能住在首都北郊的职工住宅区，每天乘通勤大客车到住区门外的转运站换车轮班。\n居民 91% 以拉诺瓦语为母语，八成人口不信宗教，人均预期寿命 64.1 岁，识字率 65.0%。全国的时钟比邻国慢半小时，以纪念创始领袖出生的时刻；太阳节即创始领袖诞辰日，全城在广场上跳集体舞、举行火炬游行。夏天的晚饭是一碗冷米粉汤，举重是最受推崇的运动。兄弟铁路的列车在友谊口岸站要停半个小时，常坐车的人说，车厢里的领袖握手画像一换新，就知道两国又签了新的友好条约。市花是鸡冠花，市树是榕树，市旗红底金边，正中一轮金色太阳，代表创始领袖。"
    en: "Andriamba is the capital of the Democratic People's Republic of Masovoly, on a bay of the east coast; the country's other two cities are Firana inland and Faniry, annexed in the Coastal War. It has about 620,000 people and some 14,000 km² of territory, backed by low rainforest-covered hills, with a mean elevation of 164 m and a high point of 686 m. The climate is tropical monsoon, with a mean temperature of 24.0 °C and about 2,438 mm of rain a year. The city was rebuilt to the founding leader's plan; foreigners may not enter without a permit.\nIn the Sundering the guerrilla commander Ratsima Voly founded the Democratic People's Republic here with himself at its core, and power passed to his son and then his grandson, making it the only hereditary communist regime on the island. The central square, Leaders' Square, has giant bronze statues of the founding leader and his successors at its north end, more than 20 m tall and facing the sea; it holds 100,000 people, and everyone passing the statues must bow. The Palace of Eternity on the north side was the founding leader's residence and now holds his body in a crystal coffin in the central hall, while Ratsima Voly III, the present First Secretary of the Workers' Party and Chairman of the State Affairs Commission, has his office in the east wing. The People's Assembly Hall on the west side is where the 500 deputies of the Supreme State Council meet; each constituency has a single candidate nominated by the Workers' Party. On the east side stands the Central Military Commission Building; under the constitution the commission and the State Affairs Commission chaired by the leader stand together as the highest decision-making bodies of the state.\nThe city is run by the City Revolutionary Committee, appointed by the Palace of Eternity, and its director, Haja Razafy, must swear loyalty to the founding leader and his heir. Residents are classed by family background, movement, work and marriage are tightly controlled, foreign radio is jammed, and the families of those who leave the country without permission are punished. The Children's Palace is one of the most ornate buildings in the city, and most of the children who study there come from families of good background; May Day Stadium holds 80,000, and tens of thousands of schoolchildren with coloured flip cards perform its mass games after months of daily rehearsal. Leaders' Square is ringed by the buildings of party, army and state: to the north-west the Workers' Party Central Committee Building and a dozen buildings of its departments, to the east the People's Army Supreme Command, General Staff and General Political Department, and to the south the Cabinet and its ministries; the Great Hall of the People, the People's Palace, the People's Grand Theatre and the 150 m Tower of the One-Heart Unity Doctrine also went up when the city was rebuilt, and the avenues between them are broad and straight but carry few cars. Services make up 85% of the economy, and output per head is about US$2,410.\nThe People's Army Ground Forces Headquarters and the 1st Infantry Brigade are on the outskirts, and foreign intelligence services believe the East Hill Missile Tunnels hold short-range ballistic missiles, which the government has never admitted. The Fraternity Railway comes south along the east coast from Vohimahy in Avaratsy and enters the city through the Andriamba Tunnel, about 12 km long; the line is just over 300 km long, its passengers need passes from both governments, and when harvests fail most of the aid grain and fuel arrives along it. The East Coast Road, territorial road S-RA-102, also passes through, running south to Faniry, annexed in the Coastal War; the People's Army's columns went south along it in that war.\nThe hills on the western shore of the bay are a military zone guarded in three rings: the Leader's Guard Bureau runs the core roads and buildings of both compounds, the Political Security Department of the Workers' Party keeps their outer facilities, and on the outside stand army special forces posted by the People's Army General Political Department and the air force. South of the Vohiala Hills lie the Lake Ranomaitso Residences, home of the leader and his family, with a dozen residences, two airfields and four underground shelters; north of the ridge, the Lake Farihikely Cadre Quarter houses the members of the Politburo and the ministers. The cadres ride the One Heart special train into town to work each morning, and when summoned to the leader they are driven through the Vohiala Tunnel into the Residences in Leader's Guard Bureau cars and must leave before sunset. The leader himself travels to town on the Leader special train or along People's Army Military Road 7351, which share People's Army Military Tunnel 3826 under the bay. Officially these roads and railways carry only People's Army numbers; in fact the Leader's Guard Bureau runs them, with checkpoints along the way. Most of the compounds' staff may not live inside and are housed on the northern edge of the capital, riding commuter coaches each day to the transfer stations outside the gates for their shifts.\nRanova is the mother tongue of 91% of residents, eight in ten profess no religion, life expectancy is 64.1 years and literacy 65.0%. The country's clocks run half an hour behind its neighbours' to mark the hour of the founding leader's birth, and on the Day of the Sun, his birthday, the city dances en masse and holds a torchlight procession in the square. Supper in summer is a bowl of cold rice-noodle soup, and weightlifting is the most esteemed sport. The Fraternity Railway's trains stand for half an hour at Friendship Crossing station, and regular passengers say that whenever the portraits of the two leaders shaking hands are replaced in the carriages, they know another friendship treaty has been signed. The city flower is the cockscomb and the city tree the banyan, and the city flag is red with a gold border and a gold sun in the middle, standing for the founding leader."
