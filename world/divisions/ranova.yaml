  names: {zh: 沃沃南德罗, en: Vovonandro, art-x-ranova: Vovonandro}
  notes:
    zh: "沃沃南德罗是太阳神国度的都城，建在金日山中部海拔约二千一百米的盆地里，城名意为「太阳之巅」。全市人口约 29 万，辖区约 4200 平方公里，四周山岭最高处 2480 米。高山气候凉爽，年均气温 19.2 ℃，年降水约 879 毫米，雨季在五月到十月。四方的王道在日之广场交汇，太阳神庙的金墙和日宫俯瞰全城，城外山坡上是成排的圆形石砌粮仓和层层梯田。\n大分裂时道路中断、集市无粮，守庙人打开神庙的粮仓，召集各村修复梯田、背运粮食，金日山熬过了饥荒，各村头人拥立他为「太阳之子」。今天的日宫建在广场西侧的台地上，宫墙用不抹灰浆的巨石砌成，严丝合缝，是太阳之子拉韦洛南德罗二世的居所，他每天清晨在宫门石台上面向东方迎接日出。广场东侧的四方会议厅四面开门，分别朝向四方王道，二十名总督和河谷领主全部出自日裔王族，由太阳之子任命；南面的结绳院用彩色绳结记下全国的收成、劳役和人口，约两千名结绳官在这里受训。太阳神庙的弧形外墙贴着金箔，清晨第一缕阳光照在墙上，全城都能望见，国名由此而来。\n城市几乎不用货币。城外向阳山坡上的王家大粮仓有几百座圆形石仓，山风穿过通风孔，让土豆干和金藜保存好几年，荒年开仓分粮；金日山梯田从谷底修到山脊，石渠把山泉引进每一级田，其中两块田由服劳役的村民为神庙和粮仓耕种。服务业名义上占经济的 77%，大多是王廷和寺庙的差事，人均产值约 2030 美元。驿传总署门前的里程石是四方王道的起点，驿卒每人跑约十公里，一条消息一天之内就能穿过全国；通往西海岸安西拉和东部瓦瓦哈迪的两条公路各长七十多公里，维洛纳驼队仍是山里主要的运输工具。\n城市由城仓与劳役署管理，仓守托乔·安德里安由所在一方的总督以太阳之子的名义任命，掌管粮仓和劳役名册，各村社推举的头人每月在仓署前与他和结绳官核对账目。居民 91% 以拉诺瓦语为母语，人口很年轻，人均预期寿命 65.3 岁，识字率也是 65.3%。这里几乎没有人挨饿，但劳役被国际劳工机构视为强迫劳动，离开所在的一方须持结绳通行证；王廷法庭把批评太阳之子定为亵渎，重罪者常被罚往东部的金矿服役。\n清晨，太阳卫队营的号角声与神庙的迎日礼一同响起，主妇们在灶上熬金藜土豆汤。驿卒的王道接力跑是全城最热门的比赛，孩子们从小沿着孔雀大道练跑。冬至的太阳节，太阳之子在日之广场用金镜从第一缕阳光中取火，驿卒连夜把新火送往每一个村庄，这一夜叫做「太阳回来的夜晚」。市花是金盏菊，市树是高山罗汉松，市旗上群峰正中升起的金色太阳，就是神庙金墙上的第一缕阳光。"
    en: "Vovonandro is the capital of the Realm of the Sun God, in a basin some 2,100 m up in the middle of the Golden Sun Range; its name means \"summit of the sun\". It has about 290,000 people and some 4,200 km² of territory, the surrounding ridges rising to 2,480 m. The mountain climate is cool, with a mean temperature of 19.2 °C and about 879 mm of rain a year, falling between May and October. The royal roads of the four quarters meet in the Square of the Sun, the golden wall of the Temple of the Sun and the Palace of the Sun look down on the city, and rows of round stone granaries and tier upon tier of terraces climb the slopes outside.\nIn the Sundering, when the roads were cut and the markets had no grain, the temple keeper opened the temple granary and called the villages together to repair the terraces and carry food on their backs; the Golden Sun Range came through the famine, and the village headmen acclaimed him \"Son of the Sun\". Today the Palace of the Sun stands on a terrace west of the square, its walls of huge unmortared stones fitted without a gap; it is the residence of the Son of the Sun, Ravelonandro II, who greets the sunrise each morning facing east from the stone platform at the palace gate. The Hall of the Four Quarters on the east side of the square has a door on each side facing one of the four royal roads; its twenty governors and valley lords all come from the Sun-born royal house and are appointed by the Son of the Sun. The House of Cords to the south records the country's harvests, labour service and population in coloured knotted cords, and some two thousand cord-keepers are trained there. The curved outer wall of the Temple of the Sun is covered in gold leaf, and the first ray of morning sun on it can be seen across the city; the realm takes its name from it.\nThe city hardly uses money. The Royal Granaries on the sunny slope outside town are hundreds of round stone stores where mountain wind through the vents keeps dried potatoes and golden goosefoot for years, opened to share out grain in bad years. The Golden Sun Terraces climb from the valley floor to the ridge, stone channels leading spring water to every step, and two fields are worked by villagers on labour service for the temple and the granaries. Services nominally make up 77% of the economy, mostly duties for the court and the temple, and output per head is about US$2,030. The milestone at the door of the Office of the Relays is where the royal roads of the four quarters start; each relay runner covers about ten kilometres, and a message can cross the whole country in a day. The two roads to Ansira on the west coast and to Vavahady in the east are each a little over seventy kilometres long, and vilona pack trains are still the main transport in the mountains.\nThe city is run by the Storehouse and Labour Office. The Keeper of the Storehouse, Tojo Andrian, is appointed by the governor of the quarter in the name of the Son of the Sun and holds the granaries and the labour rolls, and every month the headmen chosen by the village communities check the accounts with him and the cord-keepers at the storehouse door. Ranova is the mother tongue of 91% of residents, the population is very young, life expectancy is 65.3 years and literacy 65.3%. Almost no one goes hungry, but international labour bodies regard the labour service as forced labour, leaving one's quarter requires a knotted-cord pass, and the Court of the Sun's Justice treats criticism of the Son of the Sun as blasphemy, often sending those convicted of grave crimes to labour in the gold mines in the east.\nAt dawn the horns of the Sun Guard Barracks sound together with the temple's greeting of the sun, and housewives put golden goosefoot and potato soup on the stove. Royal road relay running is the city's favourite contest, and children train for it from an early age along Peacock Avenue. At the Festival of the Sun at the winter solstice, the Son of the Sun kindles fire from the first ray of sunlight with a golden mirror in the Square of the Sun, and relay runners carry the new fire overnight to every village; that night is called \"the night the sun comes back\". The city flower is the pot marigold and the city tree the mountain yellowwood, and the golden sun rising among the peaks on the city flag is the first ray of light on the temple's golden wall."
