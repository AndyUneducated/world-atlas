  notes:
    zh: "安巴拉努西是阿瓦拉齐社会主义共和国西北海岸的农业城市，集体农庄在河谷里种植水稻和甘蔗。全市人口约 42 万，辖区约 2.2 万平方公里，从海边的河口一直伸进马洛卡山区，平均海拔 1127 米，最高处 3209 米，就在全岛最高的马洛卡山上。马洛卡山挡住了东风，这里比首都干燥得多：年均气温 23.6 ℃，年降水约 1233 毫米，一月和二月几乎无雨，八月最多。\n联合共和国时期，北方是工会和左翼运动最强的地区。大分裂时，共产党领导工人赤卫队接管了港口和矿山，土地收归集体农庄，安巴拉努西河谷的种植园和小农田被合并成大农庄。「红旗」集体农庄是河谷里最大的集体农庄，几千名庄员在国有土地上种植水稻和甘蔗，按工分分配口粮和收入，农庄有自己的拖拉机站、碾米厂和学校。近年政府放松管制，允许庄员耕种小块自留地，在集市上出售蔬菜和鸡蛋，庄员的收入有所增加。农业占全市经济的 46%，人均产值约 2730 美元，低于全国平均。\n领道 S-RA-113 稻谷公路沿河谷而上，在察拉沃卡接上北方公路，由北方公路北连首都沃希马希，南通矿城马罗瓦托和马索沃利的菲拉纳，路边的集体农庄门口挂着红色的标语牌，拖拉机和卡车在路上并行，阿瓦拉齐的拖拉机和马索沃利的大米就沿着这条路互相交换。城外的安巴拉努西无人机基地是人民空军的无人机部队驻地，一条较短的跑道旁是成排的小型机库，无人机沿着边境和海岸线日夜巡逻，基地近年不断扩建。\n城市由市人民委员会管理，委员会由国家人民议会任命，执行共产党市委的决定，主席塔希里·拉奈沃通常也兼任市委第一书记。每个成年人都要参加工农赤卫队，农忙之余要参加操练。居民 90% 以拉诺瓦语为母语，65 岁以上的老人占 12%，在全国算是偏老的城市，许多年轻人去了港口城市或设法出海谋生；人均预期寿命 64.9 岁，识字率 65.6%。\n农庄的一天从广播开始：清晨大喇叭播放劳动歌曲和当天的生产任务，庄员们扛着锄头下田，拖拉机站的师傅们早早就在检修机器。甘蔗收割季，河谷里的糖厂日夜开工，孩子们放学后到田埂上帮忙捆蔗。自留地放开后，星期天的集市一年比一年热闹，农妇们挎着篮子卖鸡蛋和青菜，老庄员说，这在从前是想都不敢想的。站在河谷里向东望，马洛卡山终年云雾缭绕，当地人说「马洛卡山挡住了风暴」，也挡住了雨。市花是姜花，市树是罗望子；市旗旗杆一侧是红色三角，三角中一束金色稻穗代表集体农庄，绿、金两条横带是河谷的稻田和甘蔗。"
    en: "Ambalanosy is an agricultural city on the north-west coast of the Socialist Republic of Avaratsy, where collective farms grow rice and sugar cane in the valleys. It has about 420,000 people and some 22,000 km² of territory, reaching from the river mouth on the coast deep into the Maroka Massif, with a mean elevation of 1,127 m and a high point of 3,209 m on the Maroka, the highest mountain on the island. The Maroka Massif blocks the east wind, so it is much drier than the capital: the mean temperature is 23.6 °C and the annual rainfall about 1,233 mm, with almost none in January and February and the most in August.\nUnder the United Republic the north was the stronghold of the unions and the left. In the Sundering the Communist Party led the workers' Red Guards in taking over the ports and mines, the land went to collective farms, and the plantations and smallholdings of the Ambalanosy valley were merged into large farms. The Red Banner Collective Farm is the largest in the valley: several thousand members grow rice and sugar cane on state land and receive grain and income by work points, and the farm has its own tractor station, rice mill and school. In recent years the government has eased controls, letting members farm small private plots and sell vegetables and eggs at market, and their incomes have risen somewhat. Farming makes up 46% of the economy, and output per head is about US$2,730, below the national average.\nThe Rice Road, territorial road S-RA-113, runs up the valley to join the Northern Road in Tsaravoka, which leads on north to the capital, Vohimahy, and south to the mining city of Marovato and Firana in Masovoly; red slogan boards hang at the collective farm gates along it, tractors and lorries share the road, and Avaratsy's tractors and Masovoly's rice are traded along it. The Ambalanosy Drone Base outside town is home to a drone unit of the People's Air Force, with rows of small hangars beside a short runway; its drones patrol the borders and the coast day and night, and the base keeps expanding.\nThe city is run by the City People's Committee, appointed by the National People's Assembly to carry out the decisions of the Communist Party city committee; its chairman, Tahiry Ranaivo, as is usual, is also first secretary. Every adult must belong to the Workers' and Peasants' Red Guards and drill when farm work allows. Ranova is the mother tongue of 90% of residents; people over 65 make up 12%, making it one of the older cities in the country, since many young people have gone to the port cities or found ways to go abroad; life expectancy is 64.9 years and literacy 65.6%.\nThe farm day starts with the loudspeakers: at dawn they play work songs and announce the day's production targets, members shoulder their hoes and go to the fields, and the mechanics at the tractor station are already servicing the machines. In the cane harvest the valley's sugar mill works day and night, and children help bundle cane on the field banks after school. Since the private plots were allowed the Sunday market has grown busier every year, with farm women selling eggs and greens from their baskets, something old members say they would never have dared imagine. Looking east from the valley the Maroka is wrapped in cloud all year, and people say that \"the Maroka holds back the storms\", and the rain with them. The city flower is the ginger lily and the city tree the tamarind; the city flag has a red triangle at the hoist bearing a gold sheaf of rice for the collective farms, with green and gold horizontal bands for the valley's rice and sugar cane."
