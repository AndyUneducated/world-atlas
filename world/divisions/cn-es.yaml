  status: generated
  names:
    zh: 图拉凯区
    en: Turakkai District
    art-x-ivuran: Turakkai
  notes:
    zh: "图拉凯区是瓦利凯的深水转运港区，区名意为「港口之岸」，面积 700 平方公里，人口 26 万。瓦利凯港扼守东西航线，图拉凯集装箱码头是它的核心：自动化码头沿防波堤展开，四座集装箱突堤上，往来大洋之间的大型集装箱船在这里换装支线船和驳船，转运箱量居领地之首；港区还有船舶加油站和修船码头。港口航运和物流仓储是全区的饭碗，人均产值在瓦利凯各区中名列前茅。约四成七的居民以伊武兰语为母语，讲中文的约占三成多，码头上能听到各种口音。图拉凯港口高速全长约 40 公里，双向十二车道，以高架穿过港区，把集装箱运到埃鲁塔姆区的物流园，日均一万七八千辆车，大半是集装箱卡车，货车因此不必进入坎纳鲁尔老城。瓦利凯地铁2号线在区内设檀香路、海燕、博爱街、瀑布、纳卢大道和苍鹭六站，码头的倒班工人靠它上下班。纳卢大道、榕树路和人民路是区里的主要街道。这里是热带雨林气候，一年降水近 3000 毫米，月月有雨。\n码头的吊车司机被称作「云上的人」，他们在几十米高的驾驶室里吃午饭，饭盒用绳子吊上去；从驾驶室往下看，港口高速高架桥上的卡车像一串串移动的积木。码头昼夜不停，倒班的工人凌晨下班，纳卢大道站外的粥摊专门为他们开到天亮，一碗鱼片粥配炸油条是「夜班套餐」。雨说下就下，工人们笑说在图拉凯，雨衣和安全帽一样是劳保用品。"
    en: "Turakkai District is Vallikkai's deep-water transhipment port; its name means 'harbour shore', and it covers 700 km² with 260,000 people. The Port of Vallikkai commands the east–west sea lanes, and the Turakkai Container Terminal is its heart: automated quays stretch along the breakwater, and at its four container piers the largest ships plying between the oceans exchange boxes with feeders and barges, the most transhipment in the territory; the port also has bunkering berths and repair quays. Shipping and warehousing are the district's livelihood, and its output per head is among the highest in Vallikkai. About 47 per cent of residents speak Ivuran as their mother tongue and over a third Chinese, and every kind of accent can be heard on the quays. The Turakkai Port Expressway, about 40 km long with six lanes each way, crosses the port on viaducts and carries containers to the logistics parks of Eruttam District; it takes seventeen or eighteen thousand vehicles a day, most of them container lorries, which as a result never need to enter the old town of Kannarur. Vallikkai Metro Line 2 has six stations in the district, Sandalwood Road, Petrel, Fraternity Street, Waterfall, Nalu Avenue and Heron, and the dock shift workers rely on it. Nalu Avenue, Banyan Road and People's Road are the main streets. The climate is tropical rainforest, with nearly 3,000 mm of rain a year and rain in every month.\nThe crane drivers on the terminal are known as 'the people in the clouds': they eat lunch in cabs dozens of metres up, hauling their lunchboxes up on ropes, and from up there the lorries on the expressway viaducts look like strings of moving building blocks. The terminal never stops, and the shift workers come off duty in the small hours; a porridge stall outside Nalu Avenue station stays open till dawn just for them, and a bowl of fish porridge with fried dough sticks is the 'night-shift set'. Rain comes without warning, and the workers joke that in Turakkai a raincoat is as much safety equipment as a hard hat."
