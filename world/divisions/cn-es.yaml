  names:
    zh: 卢瓦纳区
    en: Luvana District
    art-x-ivuran: Luvana
  notes:
    zh: "卢瓦纳区是洛米兰的城区，区名意为「林间空地」，面积 500 平方公里，人口 18 万，住着全市一半以上的人，四周都是雨林。雨林研究中心和生物医药企业的实验室集中在城东，卢瓦纳区的洛米兰药用植物研究所研究雨林中的药用植物，为领地的生物医药研究提供样本，标本馆里存着上万份雨林植物标本，每一份都写着采集村社的名字；采集要经许可，利用所得的收益按惠益分享规则分给当地村社。城里有雨林博物馆和每周的林产品集市，商贸、生物医药和科研是全区的支柱，人均产值在洛米兰各区中最高。约七成五的居民以伊武兰语为母语。进出国家公园的游客和研究人员都从这里出发：卢瓦纳—洛米哈努国家公园公路约 70 公里直通国家公园，卢瓦纳—马纳卢公路通往马纳卢区，纳卢高速沿西北岸经过城边。洛米兰不建地铁，洛米兰站是萨洛真空磁悬浮和瓦洛高速铁路的终点，坐真空磁悬浮最快一小时十三分钟到萨伦纳姆。这里是热带季风气候，一年降水近 2800 毫米。\n周末的林产品集市上摆满野蜂蜜、山竹、红毛丹和藤编，采蜜人的摊位前挂着本子，记着每次取蜜的树，同一棵树一年只采一次。采药人和研究员一起进山前，要先在林边念一句「Lomi uvesa, uvesa lomi」，意思是「森林生雨，雨生森林」。午后一场大雨几乎天天准时落下，雨停后城东实验室的研究员和集市上的摊贩挤在同一家小馆子里，吃芭蕉叶包着香料和鱼烤成的叶包鱼。"
    en: "Luvana District is the town of Lomiran; its name means 'clearing in the forest', and it covers 500 km² with 180,000 people, more than half the city's population, surrounded on all sides by rainforest. The Rainforest Research Centre and the laboratories of medicine companies are on the east side of town, and the Lomiran Institute of Medicinal Plants, in Luvana District, studies the medicinal plants of the rainforest and supplies samples for the territory's biomedical research; its herbarium holds tens of thousands of rainforest specimens, each labelled with the name of the village community where it was gathered. Collecting needs a permit, and the proceeds of any use are shared with the local villages under benefit-sharing rules. The town has the Rainforest Museum and a weekly forest produce market; commerce, medicines and research are the mainstays, and output per head is the highest of any district in Lomiran. About three-quarters of the residents speak Ivuran as their mother tongue. Visitors and researchers bound for the national park all start from here: the Luvana–Lomihanu National Park Road runs about 70 km straight to the park, the Luvana–Manalu Road leads to Manalu District, and the Nalu Expressway passes the edge of town along the north-west coast. Lomiran has no metro; Lomiran Station is the terminus of both the Sarunnam–Lomiran Vacuum Maglev and the Vallikkai–Lomiran High-Speed Railway, and the maglev reaches Sarunnam in as little as an hour and thirteen minutes. The climate is tropical monsoon, with nearly 2,800 mm of rain a year.\nThe weekend forest produce market is piled with wild honey, mangosteens, rambutans and rattan work, and in front of each honey-gatherer's stall hangs a notebook recording the tree behind every harvest, for no tree may be taken from more than once a year. Before gatherers and researchers go into the forest together, they first say at its edge, 'Lomi uvesa, uvesa lomi', 'the forest makes the rain, and the rain makes the forest'. A heavy afternoon downpour arrives almost on schedule every day, and when it stops, researchers from the east-side laboratories and market traders squeeze into the same small eating houses for fish baked with spices in plantain leaves."
