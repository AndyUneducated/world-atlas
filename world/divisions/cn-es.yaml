    zh: "上青绿、下沙白，中间一道金色细条，正中白色圆徽里是一艘挂着蟹钳帆、带边架的青绿色帆船。瓦利凯意为「长长的海岸」，古王国的老城都用这种双色加圆徽的旗；帆船是扼守东西航线的港口，金条是骑楼街香料仓库里的货。"
    en: "Sea green over sand white, parted by a gold stripe, with a white disc in the centre bearing a green outrigger under a crab-claw sail. Vallikkai means 'long coast'; the old kingdom's towns all fly two bands and a disc like this. The boat is the port that holds the east–west sea lane, the gold the spices of the arcaded warehouses."
