  population: 200000
  area_km2: 800.0
  traits: { industries: [logistics, food, manufacturing] }
- id: div_5d7rp4
  subtype: borough
  parent: div_11j4xw
  status: generated
  names:
    zh: 卡兰杜尔区
    en: Kalandur District
    art-x-ivuran: Kalandur
  notes:
    zh: "卡兰杜尔区是瓦利凯东部的住宅区，区名在伊武兰语里意为「相遇的村」，面积约 900 平方公里，人口 16 万。港口和物流园的工人家庭多住在这里，公共租赁住房、学校和医院按社区配置，租金按收入定；居住与社区服务、高等教育和医疗疗养是区里的主要行业。瓦利凯航海学院在区内，培养船员、引航员和港口工程师，许多学员毕业后就去图拉凯集装箱码头或远洋船上工作。\n区里地势低缓，海岸离城区不远，雨水充沛。居民中老年人比例在城区各区里最高，伊武兰语母语者约占一半，移民和本地人住在同一片社区里，「相遇的村」这个名字也就名副其实。坎纳鲁尔—卡兰杜尔公路把区里和老城连起来，上班的人大多经这条路去港区和物流园；滨海路、珊瑚大道、豆蔻路和大连大街是区里的主要街道，滨海路边是一长串社区公园和海滨步道。\n傍晚，航海学院的学员穿着白色制服在滨海路上跑步，退休的老海员坐在长椅上看着，时不时喊一句当年的口令。社区食堂的菜单兼顾各家口味，同一张桌上常有人吃椰浆咖喱鱼，有人吃家乡的面条。每逢有学员第一次随船出海，家人和同学会到老港送行，往海里撒一把鸡蛋花，祝他平安回来。"
    en: "Kalandur District is the residential district on the east side of Vallikkai; its name means 'village of meeting' in Ivuran. It covers about 900 km² and has 160,000 people. Many families of port and logistics workers live here, with public rental housing, schools and hospitals laid out by neighbourhood and rents set by income; housing and community services, higher education and health care are the main trades. The Vallikkai Nautical College is in the district, training seafarers, pilots and port engineers, and many of its cadets go straight on to work at the Turakkai Container Terminal or on ocean-going ships.\nThe land is low and gentle, the coast is close to the built-up area, and rain is plentiful. The share of older people is the highest of the city's urban districts, native Ivuran speakers are about half the population, and incomers and islanders live side by side in the same neighbourhoods, which makes the name 'village of meeting' fitting. The Kannarur–Kalandur Road links the district with the old town and carries most commuters to the docks and the logistics park; Seafront Road, Coral Avenue, Cardamom Road and Dalian Boulevard are the main streets, with a long string of community parks and a seaside promenade beside Seafront Road.\nIn the evening cadets from the nautical college run along Seafront Road in white uniforms while retired seamen watch from the benches, now and then shouting an old order. The community canteens cater to every household's taste, and at the same table one person may be eating coconut curry fish and another noodles from home. Whenever a cadet goes to sea for the first time, family and classmates see them off at the old harbour and scatter frangipani on the water for a safe return."
  codes:
    admin: '930604'
  population: 160000
  area_km2: 900.0
  traits: { industries: [residential, education, healthcare] }
