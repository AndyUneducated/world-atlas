    en: The commune's farming and fishing district; its name means 'homes among the fields'. The land belongs to the commune, farm cooperatives grow rice, vegetables and tropical fruit, and the fishing cooperatives' boats work the inshore waters, their catch and harvest going straight to the public canteens and distribution points of every district. The villages keep their Ivuran stilt houses, and each has its own canteen and meeting shelter.
