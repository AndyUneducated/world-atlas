  names:
    zh: 帕卡里区
    en: Pakari District
    art-x-ivuran: Pakari
  notes:
    zh: "帕卡里区是埃武托拉公社的工业区，区名在伊武兰语里意为「造物的人」，面积约 1200 平方公里，人口 18 万。工业占区里产值的三分之二，制造业、新能源汽车和食品与水产加工是主要行业，人均产值约 6.9 万美元，是公社最高的。帕卡里合作社工业园里的工厂都归集体所有或由合作社经营，制造电动车、电器、自行车、电车、农机和建筑构件，产品首先满足公社居民按需领取，其余对外销售。\n工厂实行每周四天工作，工人推选的委员会管理生产，劳动贡献积分按岗位和工时计算；车间里的班组长由工人轮流担任，新产品的设计图也会贴在食堂墙上征求意见。居民里伊武兰语母语者约占一半，许多年轻技工是从领地各地迁来的。纳卢高速沿西北岸一路到达这里的终点，埃武托拉海岸公路把工业园和哈马图区连在一起；博爱大道、友谊大道、人民大街和诗人大街是区里的主要街道。\n工业园里造的自行车和电车车身上都印着一句「Tola evu」，意思是「家是大家的」，公社的孩子们学会骑的第一辆自行车大多出自这里。下班的汽笛一响，工人们骑着自己厂里造的车涌上红树大道，有人回家，有人直接去海边钓鱼。"
    en: "Pakari District is the industrial district of Evutola Commune; its name means 'the makers' in Ivuran. It covers about 1,200 km² and has 180,000 people. Industry accounts for two-thirds of its output, manufacturing, electric vehicles and food and seafood processing are its main trades, and its output per head, about US$69,000, is the highest in the commune. The factories of the Pakari Co-operative Industrial Park are all collectively owned or run by co-operatives, making electric cars, appliances, bicycles, trams, farm machinery and building components; the commune's own residents take what they need first, and the rest is sold outside.\nThe factories work a four-day week, committees elected by the workers run production, and labour contribution credits are reckoned by post and hours worked; workers take turns as team leaders on the shop floor, and drawings of new products are pinned up on the canteen wall for comment. About half the residents are native Ivuran speakers, and many young technicians have moved here from elsewhere in the territory. The Nalu Expressway comes all the way up the north-west coast to end here, and the Evutola Coast Road links the industrial park with Hamatu; Fraternity Avenue, Friendship Avenue, People's Boulevard and Poets' Boulevard are the main streets.\nThe bicycles and trams built in the park all carry the words \"Tola evu\", home belongs to everyone, and most of the commune's children learn to ride on a bicycle made here. When the end-of-shift siren sounds, workers pour out onto Mangrove Avenue on bikes from their own factories, some heading home and others straight to the shore to fish."
