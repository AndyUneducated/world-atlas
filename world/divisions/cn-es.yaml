  names:
    zh: 迈萨里区
    en: Maisari District
    art-x-ivuran: Maisari
  notes:
    zh: "迈萨里区是基鲁迈岛上的城区和联合邦议会所在地，区名在伊武兰语里意为「珍珠的港湾」，面积约 9000 平方公里，人口 16 万，是联合邦人口最多的区，也有群岛的最高点，海拔 508 米。港湾边是迈萨里渡轮码头、海鲜市场和度假酒店，渡轮从这里开往群岛各岛，不通公路的马拉坎岛和皮卢岛也靠这里的船只往来；城里的伊武兰人老街保留着高脚木屋和雕花的船屋。旅游、商贸和渔业是区里的主要行业。\n伊米穆高速从这里出发，以约 101 公里长的哈努西鲁河口跨海大桥越海登上主岛，这座世界最长的桥梁让岛民开车就能到萨伦纳姆；基鲁迈群岛高速也从这里出发，向南经卡朗加区跨海到蒂卢迈岛和奥罗武岛。基鲁迈机场在区内，度假和潜水的游客大多从这里入岛，有航班飞往萨伦纳姆和米雷兰。居民近八成讲伊武兰语，码头大街、潮汐大道和帆布路是主要街道。\n跑道尽头就是海滩，飞机降落时从舷窗能看到礁湖里深浅不一的蓝色，下了飞机，接机的民宿主人常常捧着一只刚砍开的嫩椰子等着。傍晚渔船回港时，码头边的沙滩上会把渔获分成一堆堆，按老规矩「分海」，老人、孩子和没出海的人家也有一份。渡轮停航的「断线天」，港湾边的海鲜市场照样热闹，岛民说那天正好在家门口过节。"
    en: "Maisari District is the town of Kirumai Island and seat of the Commonwealth Assembly; its name means 'harbour of pearls' in Ivuran. It covers about 9,000 km² and has 160,000 people, the most of any district in the commonwealth, and it holds the archipelago's highest point, 508 m. Around the harbour are the Maisari Ferry Terminal, the seafood market and holiday hotels; ferries leave here for every island, and Malakan and Pilu, which have no roads, depend on boats from here; in the old Ivuran streets of the town stand stilt houses and carved boathouses. Tourism, trade and fishing are the main trades.\nThe Imimu Expressway starts here and crosses the sea to the main island on the Hanusiru Mouth Bridge, about 101 km long, the longest bridge in the world, which lets islanders drive to Sarunnam; the Kirumai Islands Expressway also starts here, running south through Karanga District and across the sea to Tilumai and Orovu. Kirumai Airport is in the district, where most holidaymakers and divers arrive, with flights to Sarunnam and Mirelan. Nearly eight in ten residents speak Ivuran, and Quay Boulevard, Tide Avenue and Sailcloth Road are the main streets.\nThe runway ends at the beach, and as planes come in to land passengers see the lagoon in every shade of blue from the windows; on arrival, guesthouse owners are often waiting with a freshly opened young coconut. When the fishing boats return in the evening, the catch is divided into heaps on the beach by the quay in the old way of \"sharing the sea\", with a share for the elderly, the children and the households that did not go out. On \"broken-thread days\" when the ferries cannot sail, the harbour's seafood market is as busy as ever, and islanders say it is the perfect day for a festival on their own doorstep."
