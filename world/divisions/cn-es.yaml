    en: Seranu District
    art-x-ivuran: Seranu
  notes:
    zh: "塞拉努区是塔卢马兰湾外侧的深水港区，区名在伊武兰语里意为「深水」，面积约 600 平方公里，人口 22 万。塞拉努深水港的集装箱码头、汽车滚装码头和液化气接收站沿湾口展开，是领地最大的集装箱港之一，伊拉坦区生产的电池和新能源车从这里装船出口。港区实行全自动化装卸，无人集卡在码头和堆场之间往来，港口航运和物流仓储撑起全市最高之列的人均产值，约 8.2 万美元。区里雨水比市中心多，一年降水近 2900 毫米。\n码头工人、调度员和物流公司的职员多是移民，中文最常用，伊武兰语母语者只有约四分之一。塞拉努港口高速从港区出发，经伊拉坦区的电池厂和整车厂通往帕达兰区接上伊米穆高速，新车从总装线下来，沿这条高速直送码头。学府大道、杭州大道、纳卢大街和友谊大道是区里的主要街道，港区背后是职工宿舍、学校和社区食堂。\n码头工人有自己的口令，一半中文一半英语，还夹着几个伊武兰语词，外人很难听懂；新来的工人头一个月最要紧的功课就是学会这套口令。自动化之后，许多老装卸工转到了中控室，他们隔着大屏幕指挥无人集卡，却还是习惯在交班时喊一声老口令，算是给码头打招呼。"
    en: "Seranu District is the deep-water port district on the outer side of Talumaran Bay; its name means 'deep water' in Ivuran. It covers about 600 km² and has 220,000 people. The container terminals, ro-ro car terminal and gas receiving terminal of Seranu Deep Water Port spread along the mouth of the bay, one of the territory's largest container ports, shipping out the batteries and electric cars made in Ilatan. Loading and unloading are fully automated, with driverless trucks shuttling between quays and stacks, and ports, shipping, logistics and warehousing give the district one of the highest outputs per head in the city, about US$82,000. It is wetter than the city centre, with nearly 2,900 mm of rain a year.\nMost dockers, dispatchers and logistics staff are incomers; Chinese is the language most used and native Ivuran speakers are only about a quarter. The Seranu Port Expressway starts at the port and runs past the battery works and car plant of Ilatan to join the Imimu Expressway in Padaran, so new cars go straight from the assembly line to the quay. College Avenue, Hangzhou Avenue, Nalu Boulevard and Friendship Avenue are the main streets, and behind the port are staff housing, schools and community canteens.\nThe dockers have their own calls, half Chinese and half English with a few Ivuran words mixed in, which outsiders can hardly follow; a new hand's most important task in the first month is to learn them. Since automation many old stevedores have moved to the control room, where they direct the driverless trucks on big screens, yet they still shout an old call at the change of shift, as a greeting to the quay."
  codes:
    admin: '930403'
  population: 220000
  area_km2: 600.0
  traits: { industries: [port, logistics] }
- id: div_3e94sq
  subtype: borough
  parent: div_5tgnmz
  status: generated
  names:
    zh: 伊拉坦区
    en: Ilatan District
    art-x-ivuran: Ilatan
  notes:
    zh: "伊拉坦区是塔卢马兰北部的新能源产业区，区名在伊武兰语里意为「新的田」，面积约 800 平方公里，人口 30 万。伊拉坦电池厂的正极材料、电芯和电池包在同一厂区生产，旁边的伊拉坦新能源车厂把冲压、焊装、涂装和总装连成一线，原料是乌诺卡里矿区的镍和钴，由乌诺维拉真空磁悬浮重载铁路运到伊拉坦货运站。厂区屋顶铺满太阳能板，废旧电池在区内的回收厂拆解再生。工业占区里产值的近三分之二，人均产值约 9.3 万美元，是全市最高的，平均寿命也是全市最长的。\n工人大多是年轻的移民，中文、英语和伊武兰语的使用者各占约三分之一。塔卢马兰机场在区北，有航班飞往萨伦纳姆、米雷兰和基拉努，货运航班运送电池和船用零部件；地铁 3 号线从樱桃站经钟楼大街站、兰花大道站到塔卢马兰机场站和体育场路站，塞拉努港口高速把新车直送码头。宪章路、红树大街、音乐厅大道和厦门路是区里的主要街道。\n电池厂门口立着一块电子牌，滚动显示当天下线的电池包数量，工人们换班时都习惯抬头看一眼，说这是「今天给多少辆车装上了心脏」。每辆新车下线时，总装线尽头的工人会在车里放一朵鸡蛋花。机场到达大厅里挂着「Talu oruka, maran tola」，三分之二的塔卢马兰人当初都是从这里第一次踏上这座城市的。"
    en: "Ilatan District is the new-energy industrial district in the north of Talumaran; its name means 'new field' in Ivuran. It covers about 800 km² and has 300,000 people. The Ilatan Battery Works makes cathode materials, cells and battery packs on a single site, and next door the Ilatan Electric Vehicle Plant runs pressing, welding, painting and final assembly in one line, using nickel and cobalt from the Unokari mines brought to Ilatan Freight Yard by the Unovila Vacuum Maglev Heavy-Haul Railway. The factory roofs are covered with solar panels, and spent batteries are dismantled and recycled at a plant in the district. Industry makes up nearly two-thirds of output, output per head, about US$93,000, is the highest in the city, and so is life expectancy.\nMost workers are young incomers, and speakers of Chinese, English and Ivuran each make up about a third of the population. Talumaran Airport is in the north of the district, with flights to Sarunnam, Mirelan and Kilanu and cargo flights carrying batteries and ship parts; Metro Line 3 runs from Cherry through Clock Tower Boulevard and Orchid Avenue to Talumaran Airport and Stadium Road, and the Seranu Port Expressway takes new cars straight to the quay. Charter Road, Mangrove Boulevard, Concert Hall Avenue and Xiamen Road are the main streets.\nAt the gate of the battery works an electronic board scrolls the number of packs completed that day, and workers changing shift always glance up at it, calling it \"how many cars got a heart today\". As each new car comes off the line, the worker at the end of the assembly line puts a frangipani flower inside. \"Talu oruka, maran tola\" hangs in the airport's arrivals hall, where two-thirds of the people of Talumaran first set foot in the city."
  codes:
    admin: '930404'
  population: 300000
  area_km2: 800.0
  traits: { industries: [battery, automotive, manufacturing] }
- id: div_py6kpa
  subtype: borough
  parent: div_5tgnmz
  status: generated
  names:
    zh: 米纳萨区
    en: Minasa District
    art-x-ivuran: Minasa
  notes:
    zh: "米纳萨区是塔卢马兰西部的住宅区，区名意为「安居」，面积 700 平方公里，人口 25 万。地势平缓，海拔不过几十米，公共租赁住房、学校和医院沿林荫大道分布，伦博船厂和伊拉坦电池厂的许多工人家庭住在这里，区里的孩子占了两成，老人只有一成多。塔卢马兰海事学院在区内，培养船员和造船工程师，不少学员毕业后就进了伦博船厂。居住与社区服务、高等教育和免税零售是全区的主业，商场里的免税店吸引着来自船上和港口的顾客。居民中讲中文、英文和伊武兰语的大致各占三分之一，是塔卢马兰移民城市的缩影。檀香大道、长沙大道、钟楼大道和诗人路是区里的主干道，塔卢马兰地铁2号线在区内设上坡、长沙路、蜂房、檀香大道、哈尔滨街和翠鸟大街六站，工人们早晚坐地铁往返船厂和电池厂；塔卢—米纳萨公路约 26 公里，连接市中心的塔卢区。\n傍晚是米纳萨最热闹的时候，下班的工人从地铁站涌出来，林荫道上的小摊卖着椰浆咖喱鱼、各省的面食和大洋彼岸的烤肉，路口的公交车和出租车几乎都是伊拉坦新能源车厂造的电动车。海事学院的学员周末在区里的公园练习打绳结，孩子们围着看，学员就教他们打一个最简单的「水手结」。每逢伦博船厂有新船下水，鸡蛋花街的花店一早就忙着编花环，住在区里的老焊工会带着孙子去湾边看热闹，指着船头说「那一段是爷爷焊的」。"
    en: "Minasa District is the residential district west of Talumaran; its name means 'settled home', and it covers 700 km² with 250,000 people. The land is gentle, never more than a few dozen metres above the sea, and public rental housing, schools and hospitals line its tree-shaded avenues; many families of workers at the Lumbo Shipyard and the Ilatan battery plants live here, and children make up a fifth of the population, older people little more than a tenth. The Talumaran Maritime College is in the district, training seafarers and naval architects, and many of its graduates go straight to the Lumbo Shipyard. Housing and community services, higher education and duty-free retail are the district's main business, and the duty-free shops in its malls draw customers from the ships and the port. Residents are split roughly in thirds between Chinese, English and Ivuran speakers, a miniature of Talumaran as a city of incomers. Sandalwood Avenue, Changsha Avenue, Clock Tower Avenue and Poets' Road are the main roads, and Talumaran Metro Line 2 has six stations in the district, Uphill, Changsha Road, Beehive, Sandalwood Avenue, Harbin Street and Kingfisher High Street, carrying workers to and from the shipyard and battery plants morning and evening; the Talu–Minasa Road, about 26 km long, links it to Talu District in the city centre.\nEvening is Minasa's busiest time: workers pour out of the metro stations, stalls along the avenues sell coconut fish curry, noodle dishes from every province and grilled meat from across the ocean, and nearly every bus and taxi at the junctions is an electric car built by the Ilatan new-energy vehicle plant. At weekends the Maritime College cadets practise their knots in the district's parks while children gather round to watch, and the cadets teach them the simplest of all, the 'sailor's knot'. Whenever a new ship is launched at the Lumbo Shipyard, the florists of Frangipani Street are busy weaving garlands from first light, and old welders living in the district take their grandchildren down to the bay to watch, pointing at the bow and saying, 'Grandpa welded that bit.'"
  codes:
    admin: '930405'
  population: 250000
  area_km2: 700.0
  traits: { industries: [residential, education, retail] }
- id: div_n11kpv
  subtype: borough
  parent: div_5tgnmz
  status: generated
  names:
    zh: 帕达兰区
    en: Padaran District
    art-x-ivuran: Padaran
  notes:
    zh: "帕达兰区是塔卢马兰背后广阔的腹地，区名在伊武兰语里意为「稻作之乡」，面积 6.5 万平方公里，只有 10 万人，是全市面积最大、人口最少的区。区域从沿海平原一直延伸到乌诺凯苏山脉的山坡，最高处是海拔 2448 米的库瓦拉峰，伊武兰语意为「犀鸟」，山上的老林里常能看到成对的犀鸟。约 410 公里长的奥卢西鲁河发源于乌诺凯苏山脉，向东南流过区里的稻田和椰林，在塔卢马兰城区东北入海，河口是渔港和红树林；塔卢马兰湾、湾口的塔卢努岛和宽约 23 公里的塔卢努海峡也在区内。\n平原上是稻田和椰林，山坡上种可可、咖啡和丁香，种植业、香料与可可和林业木材加工是主要行业，第一产业占四成以上。村庄里的居民近八成讲伊武兰语，多说北部方言，梯田农民党在区里得票最多。伊米穆高速从区里穿过，塞拉努港口高速在这里与它相接；乌诺图马峰大道、高地大道和码头大道是集镇的主要街道。\n稻子收割后，河岸的人家会用新米和椰浆做一种绿色的糯米糕，用香兰叶染色，孩子们说，吃到这种糕就知道「河又养了我们一年」。山脚的老人常说：「Kuvala lomi, lomi kuvala」，意思是「犀鸟种出森林，森林养着犀鸟」。塔卢努岛上的石砌海防工事如今是一座小博物馆，炮台的射击孔被改成了观景窗。"
    en: "Padaran District is the wide hinterland behind Talumaran; its name means 'land of rice' in Ivuran. It covers 65,000 km² and has only 100,000 people, the largest and least populous district in the city. It stretches from the coastal plain up the slopes of the Unokesu Mountains, topped by Mount Kuvala, 2,448 m, whose Ivuran name means 'hornbill', and pairs of hornbills are often seen in its old forest. The Olusiru River, about 410 km long, rises in the Unokesu Mountains and flows south-east through the district's paddies and coconut groves to reach the sea north-east of the city, with a fishing harbour and mangroves at its mouth; Talumaran Bay, Talunu Island at its mouth and the Talunu Strait, about 23 km wide, also lie within the district.\nPaddies and coconut groves cover the plain, and cocoa, coffee and cloves grow on the slopes; plantations, spices and cocoa and forestry and timber are the main trades, and farming makes up more than four-tenths of the economy. Nearly eight in ten villagers speak Ivuran, mostly the northern dialect, and the Terrace Farmers' Party wins the most votes here. The Imimu Expressway crosses the district and the Seranu Port Expressway joins it here; Mount Unotuma Avenue, Highland Avenue and Quay Avenue are the main streets of the market towns.\nAfter the rice harvest, families along the river make a green sticky-rice cake from new rice and coconut milk, coloured with pandan leaves, and children say that when they taste it they know \"the river has fed us for another year\". Old people at the foot of the mountain say \"Kuvala lomi, lomi kuvala\", the hornbill plants the forest and the forest feeds the hornbill. The old stone sea defences on Talunu Island are now a small museum, with the gun ports of the battery turned into viewing windows."
  codes:
    admin: '930406'
  population: 100000
  area_km2: 65250.0
  traits: { industries: [agriculture, spice, forestry], heritage: ivuran }

# ── 基拉努特别自治市──
- id: div_24d8z4
  subtype: locality
  parent: div_nwm019
  status: generated
  names:
    zh: 基拉努特别自治市
    en: Special Autonomous City of Kilanu
    art-x-ivuran: Kilanu
  notes:
    zh: "基拉努特别自治市是主岛东南海岸中部的科技城市，领地唯一的特别自治市，全市 130 万人，面积约 6 万平方公里。城名在伊武兰语里意为「明亮的沙」，海岸上洁白的石英砂滩由此得名；城区沿基拉湾和海岸展开，背后的乌拉帕区丘陵一直延伸到哈努帕拉高原的东南缘，基拉西鲁河从高原跌落后在基拉湾入海，是半导体产业园的水源之一。热带季风气候，一年降水两千二百多毫米。\n基拉努依《基拉努特别自治市宪章》治理：市里自定企业所得税、研发抵免和产业园的工业用地租金，在领地的移民配额内自行审批工程师和研究人员的居留许可，基拉努港和基拉努国际机场是保税区，城市规划、供电、供水和超纯水厂也由市里自己管；领地的全民基本收入、全民医保、免费教育、劳动法和环境标准在这里照常适用，宪章写明不能拿这些标准去换更低的税。立法会 57 席，全市一个选区，行政长官特卢拉姆·哈努韦尔由立法会选出，来自国际共产党，与社会民主互助工党、绿脉党和伊武兰民族复兴党组成市政联盟；芯片海岸党在这里有 6 席，是它在各城市议会中最多的一处。\n经济以半导体与芯片、信息技术、科研和港口航运为主，全市人均产值约 9.4 万美元，在各市中最高，平均寿命也居各市前列。萨基拉区是市中心，科技公司的总部、风险投资机构和软件企业沿海滨大道集中；努维拉区的努维拉半导体产业园有十多座晶圆厂、封装测试厂和配套工厂，芯片从基拉努国际机场空运到世界各地；埃莱努区有以集成电路、材料和软件见长的基拉努理工大学；佩萨维区是港口和机场区；乌拉帕区是种可可和热带水果的山地。移民约占六成五，来自中国其他省份的工程师尤其多，孩子多、老人少。长夏真空磁悬浮在萨基拉区的基拉努特别自治站停靠，塞洛高速经过市中心和机场，伊米穆高速从乌拉帕区穿过，三条地铁连接市中心、产业园和大学城。\n「基拉努」的石英砂滩白得晃眼，赤脚踩上去会发出轻轻的吱吱声，孩子们管它叫「会唱歌的沙」；国际机场航站楼的地面也铺着本地石英砂磨成的水磨石。本地人爱开玩笑说，基拉努的沙子一半在海滩上，一半在努维拉半导体产业园的晶圆里，城里的孩子从小就知道芯片是用沙子做的。工程师们下班后最常去海边的排球场和夜市，努维拉区的夜宵摊开到凌晨，最受欢迎的是椰子冰、海鲜炒河粉和一种塞满香料的烤鱼，摊主们早就习惯了客人边吃边讨论电路图。基拉努理工大学的毕业季有个传统：毕业生在海滩上用白沙堆一块巨大的「芯片」，再在上面用贝壳摆出自己的名字，涨潮时一起看海水把它带走。"
    en: "The Special Autonomous City of Kilanu is the technology city of the middle south-east coast of the main island and the territory's only special autonomous city, with 1.3 million people over some 60,000 km². Its name means 'bright sand' in Ivuran, after the white quartz beaches of its shore; the city spreads along Kila Bay and the coast, the hills of Urapa District behind it rise to the south-eastern edge of the Hanupala Plateau, and the Kilasiru River drops from the plateau to enter the sea in Kila Bay, one of the water sources of the semiconductor park. The climate is tropical monsoon, with more than 2,200 mm of rain a year.\nKilanu is governed under the Charter of the Special Autonomous City of Kilanu: the city sets its own corporate income tax, research and development credits and industrial land rents in its parks, issues residence permits for engineers and researchers itself within the territory's immigration quota, runs Kilanu Port and Kilanu International Airport as bonded zones, and manages its own planning, electricity, water and ultra-pure water plants; the territory's universal basic income, public health insurance, free education, labour law and environmental standards apply here as everywhere, and the charter states that they may not be traded for lower taxes. The Legislative Council has 57 seats elected from a single city-wide constituency; the Chief Executive, Teluram Hanuvel, is chosen by the council and belongs to the International Communist Party, which governs with the Social Democratic Mutual Aid Labour Party, Greenvein and the Ivuran National Renewal Party; the Chip Coast Party holds 6 seats here, its most in any city council.\nThe economy rests on semiconductors and chips, information technology, research and ports and shipping; output per head, about US$94,000, is the highest of any city, and life expectancy is among the highest too. Sakila District is the city centre, where technology headquarters, venture capital firms and software companies cluster along the seafront avenue; the Nuvila Semiconductor Park in Nuvila District has more than ten wafer fabs, packaging and test plants and supplier factories, and its chips are flown all over the world from Kilanu International Airport; Elenu District has the Kilanu University of Technology, strong in integrated circuits, materials and software; Pesavi District is the port and airport district; and Urapa is upland country of cocoa and tropical fruit. Incomers make up about 65 per cent of the population, engineers from other provinces of China especially, and there are many children and few elderly. The Everlong Summer Vacuum Maglev stops at Special Autonomous City of Kilanu Station in Sakila, the Selo Expressway passes the city centre and the airport, the Imimu Expressway crosses Urapa, and three metro lines link the centre, the semiconductor park and the university quarter.\nKilanu's quartz beaches are dazzlingly white and squeak softly under bare feet, so children call it \"the singing sand\"; even the floor of the international airport terminal is terrazzo ground from local quartz sand. Locals like to joke that half of Kilanu's sand is on the beach and the other half in the wafers of the Nuvila Semiconductor Park, and children in the city learn early that chips are made of sand. After work the engineers head for the beach volleyball courts and the night markets; the late-night food stalls of Nuvila stay open until the small hours, the favourites being coconut ice, seafood fried rice noodles and a grilled fish stuffed with spices, and the stallholders are long used to customers discussing circuit diagrams over their food. Graduation at the Kilanu University of Technology has a tradition: graduates build a giant \"chip\" of white sand on the beach, spell out their names on it in shells, and watch together as the tide carries it away."
  codes:
    admin: '930500'
    unlocode: ES KLN
