# ── 埃武托拉公社──
- id: div_6kjc7x
  subtype: locality
  parent: div_nwm019
  status: generated
  names:
    zh: 埃武托拉公社
    en: Evutola Commune
    art-x-ivuran: Evutola
  notes:
    zh: 主岛东北端海岸上的市级公社，名字在伊武兰语里意为「大家的家」，面积 2 万平方公里，100 万人。公社委员会自治，自定税率，居民的个人所得税、社会保险和消费税合计超过收入的八成，政务院只管外交、国防等少数事务。公社里住房、公共交通、水电网、教育、医疗、托育和养老全部免费，汽车、电器等贵重物品也由公社提供、按需取用；公共食堂、公共洗衣房和工具库遍布各区。大部分工资由劳动贡献积分代替，最高与最低收入之比不超过三倍；企业以集体所有和合作社为主，重大事务由居民议事会直接表决，每周工作四天。人民宫、公社大食堂、环形公社住宅和公社图书馆是它的标志。
    en: A city-level commune on the coast at the north-eastern end of the main island; its name means 'everyone's home' in Ivuran, and it covers 20,000 km² with a million people. The Commune Council governs itself and sets its own taxes, so that income tax, social insurance and consumption tax together take more than four-fifths of what residents earn, while the Executive Council keeps only foreign affairs, defence and a few other matters. Housing, public transport, water, power and the internet, education, health care, childcare and care for the old are all free, and the commune provides cars, appliances and other costly goods to whoever needs them; public canteens, laundries and tool libraries are found in every district. Labour credits take the place of most wages, the highest income may be no more than three times the lowest, most enterprises are collectively owned or cooperatives, major decisions go to a direct vote of the residents' assemblies, and the working week is four days. The People's Palace, the Great Commune Canteen, the ring-shaped commune housing and the Commune Library are its landmarks.
  codes:
    admin: '930300'
    unlocode: ES EVT
  population: 1000000
  area_km2: 20000.0
  special_status: commune
  color: '#C8102E'
  flag: { layout: banner, colors: ['#B03A2E'], charge: ring_homes, charge_color: '#F6C343' }
  flag_notes:
    zh: "红底正中一圈金色小屋，围着中央一块圆坪。小屋是公社一家挨一家围成一圈的环形住宅，也就是「大家的家」这个名字；圆坪是居民议事会开会的广场，公社的大事都在这里由全体居民直接表决。红色是公社的颜色。人民宫顶上挂的就是这面旗，居民从不说「市旗」，只说「我们的旗」。"
    en: "A ring of gold houses round a round green on red. The houses are the commune's ring of homes, one beside the next, which is what its name, 'everyone's home', means; the green is the ground where the residents' assembly meets and the whole commune votes directly on its affairs, and the red is the commune's colour. The same flag flies over the People's Palace, and residents never call it the city flag, only 'our flag'."
  traits: { industries: [manufacturing, food, healthcare, education], heritage: tropic_mixed, age: balanced, income: 1.0 }
