  parent: div_kv6b3e
  status: generated
  names:
    zh: 塞鲁卡姆区
    en: Serukkam District
    art-x-ivuran: Serukkam
  notes:
    zh: "塞鲁卡姆区是萨伦纳姆的老城，河道纵横，区名意为「运河之城」，面积 160 平方公里，人口 52 万，每平方公里三千多人，人口密度居全领地之首。高脚木屋和老商铺沿河排开，老城的街巷窄而曲折，许多家庭世代在水上做买卖。塞鲁卡姆水上市场是世界最大的水上市场，每天清晨开市，上千条小船载着蔬果、鲜鱼、香料和小吃在河道里交易，买卖用伊武兰语南部方言讨价还价，每条船摊都挂着食品监管部门发的卫生等级牌。商贸、旅游度假和食品与水产加工是全区的主业，约五成六的居民以伊武兰语为母语，多讲南部方言。萨伦纳姆环城高速经过区内，塞鲁卡姆高架桥长约 10 公里，是全线最长的桥，这一段也是环线最繁忙的路段；萨伦纳姆地铁2号线在区内设北坡、塞鲁卡姆水上市场、新月、铁锚大街、约翰森、基拉湾一大街、面包房路和桶匠一街八站。塞洛大道、咖啡大道、铁匠大街和肉桂街是老城里的主要街道。这里是热带雨林气候，一年降水约 2100 毫米。\n水上市场天不亮就开市，小船上的摊贩用竹竿挑着货招呼岸上的客人，最受欢迎的早点是用香蕉叶包着的椰浆糯米饭和刚出锅的炸香蕉，买卖谈妥，钱就放进竹竿头上的小篮子递过去。每逢满月的「灯与月」之夜，一家老小坐船沿着老城河道看灯，河两岸的高脚木屋也挂起油灯，倒影一直连到旧王城的方向。老城的巷子窄得撑不开两把伞，雨季里邻居们干脆共用一把，塞鲁卡姆人说，在这里迷路不要紧，跟着河走，总能走到市场。"
    en: "Serukkam District is Sarunnam's old town, laced with canals; its name means 'city of canals', and it covers 160 km² with 520,000 people, more than 3,000 to the square kilometre, the most densely peopled district in the territory. Stilt houses and old shops line the waterways, the lanes of the old town are narrow and winding, and many families have traded on the water for generations. The Serukkam Floating Market is the largest floating market in the world: every morning at dawn it opens, with a thousand boats trading vegetables and fruit, fresh fish, spices and snacks on the canals, bargaining in the southern dialect of Ivuran, and every boat stall displays the hygiene rating issued by the food inspectors. Commerce, tourism, and food and seafood processing are the district's main work; about 56 per cent of residents speak Ivuran as their mother tongue, most of them the southern dialect. The Sarunnam Ring Expressway passes through the district, where the Serukkam Viaduct, about 10 km long, is the longest bridge on the ring and this stretch its busiest; Sarunnam Metro Line 2 has eight stations in the district, North Slope, Serukkam Floating Market, Crescent, Anchor High Street, Johansen, Kila Bay High Street 1, Bakehouse Road and Cooper Street 1. Selo Avenue, Coffee Avenue, Smithy High Street and Cinnamon Street are the old town's main streets. The climate is tropical rainforest, with about 2,100 mm of rain a year.\nThe floating market opens before daybreak, traders in the boats holding up their wares on bamboo poles to call to customers on the bank; the favourite breakfasts are coconut sticky rice wrapped in banana leaves and bananas fried on the spot, and once a price is agreed the money goes into a little basket on the end of the pole. On the full-moon night of 'Lamps and Moon', whole families take boats along the old town's canals to see the lamps, the stilt houses on both banks hang out oil lamps too, and the reflections run all the way towards the old royal city. Some lanes are too narrow for two umbrellas to pass, so in the wet season neighbours simply share one, and Serukkam people say that getting lost here does not matter: follow the water and you will always reach the market."
