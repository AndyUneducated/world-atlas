  notes:
    zh: 公社的住宅区，区名意为「环形的家」。环形公社住宅是一圈圈围合的多层住宅楼，中间是公共花园、托儿所和食堂，每个环住着两三千人；住房按家庭人数分配，不收租金。公共洗衣房、诊所和养老院设在每个环的底层，老人和孩子在内院里一起度过白天。
    en: The commune's housing district; its name means 'ring of homes'. The ring-shaped commune housing is circles of mid-rise blocks around a shared garden, nursery and canteen, two or three thousand people to each ring; homes are allotted by the size of the family and no rent is charged. Public laundries, clinics and care homes occupy the ground floor of every ring, and the old and the young spend their days together in the inner courts.
  codes:
