# ── 塔卢马兰市──
- id: div_5tgnmz
  subtype: locality
  parent: div_nwm019
  status: generated
  names:
    zh: 塔卢马兰市
    en: Talumaran City
    art-x-ivuran: Talumaran
  notes:
    zh: "塔卢马兰市是主岛东南海岸的港口和工业城市，全市 160 万人，面积约 6.8 万平方公里，是领地第二大城市。城名在伊武兰语里意为「停泊之地」：塔卢马兰湾面积约 1630 平方公里，是领地最大的海湾，湾口外的塔卢努岛挡住外海的风浪，湾内水深浪静，自古是船只避风的锚地。城区沿湾的东北岸展开，塔卢西鲁河在伦博湾顶入海；背后的帕达兰区一直延伸到乌诺凯苏山脉，库瓦拉峰海拔 2448 米，是全市最高点。\n经济以船舶与海工装备、港口航运、新能源汽车和电池储能为主，工业占近四成，人均产值约 7.8 万美元。塔卢区是市中心和老港，老码头的石砌防波堤和灯塔还在使用，市政厅、海事法院和航运交易所都在区内；伦博区的伦博船厂建造集装箱船、液化气船和海上平台；塞拉努区的塞拉努深水港是领地最大的集装箱港之一，全自动化装卸；伊拉坦区的电池厂和新能源车厂用乌诺卡里矿区的镍和钴制造电池和整车，乌诺维拉真空磁悬浮重载铁路每天把满载的列车开进伊拉坦货运站；米纳萨区是工人家庭聚居的住宅区，有塔卢马兰海事学院；帕达兰区是种稻米、可可和香料的腹地。长夏真空磁悬浮在塔卢区的塔卢马兰站停靠，塔纳高速铁路经乌诺卡里通往纳卢迈；伊米穆高速穿过帕达兰区，塞洛高速经过市中心，塞拉努港口高速把港区、电池厂和腹地连在一起；伊拉坦区北面有塔卢马兰机场。全市有四条地铁，在领地仅次于萨伦纳姆。\n工业带的工人来自领地各地和世界各国，全市移民约占三分之二，劳动年龄人口比例高，孩子多、老人少。市议会 59 席，市长阿努瓦伊·哈努韦尔来自国际共产党，与社会民主互助工党和绿脉党联合执政。\n本地人常拿一句伊武兰语老话欢迎新来的人：「Talu oruka, maran tola」，意思是「船停下的地方，就是家」，这句话也挂在机场的到达大厅里。伦博船厂每有新船下水，船头都要挂一串鸡蛋花编成的花环，工人们相信花环在海上漂得越远，这条船的航程就越顺；塞拉努深水港的码头工人有自己的口令，一半中文一半英语，还夹着几个伊武兰语词，外人很难听懂。城里的出租车和公交车几乎都是伊拉坦新能源车厂造的电动车，司机们爱跟乘客炫耀：「电池里的镍是乌诺卡里挖的，车是我们这儿造的。」下班后的码头夜市汇集了工人们家乡的味道，从各省的面食到大洋彼岸的烤肉应有尽有，卖得最好的却是一碗本地的椰浆咖喱鱼配米饭。风暴来临前，湾里挤满从外海赶来避风的渔船和货轮，塔卢马兰人站在岸边数船，说「湾又救了一回人」。"
    en: "Talumaran City is the port and industrial city of the south-east coast of the main island, with 1.6 million people over some 68,000 km², the second-largest city in the territory. Its name means 'place of anchoring' in Ivuran: Talumaran Bay, about 1,630 km², is the largest bay in the territory, and Talunu Island off its mouth breaks the swell of the open sea, so the deep, calm water inside has always been an anchorage where ships ride out storms. The city spreads along the north-eastern shore of the bay, where the Talusiru River enters the sea at the head of Lumbo Bay; behind it Padaran District stretches up to the Unokesu Mountains, where Mount Kuvala, 2,448 m, is the city's highest point.\nThe economy rests on ships and offshore equipment, ports and shipping, electric vehicles and batteries and energy storage; industry makes up nearly four-tenths of it, and output per head is about US$78,000. Talu District is the city centre and old harbour, where the stone breakwater and lighthouse of the old quay are still in use and the city hall, the maritime court and the shipping exchange stand; Lumbo Shipyard in Lumbo District builds container ships, gas carriers and offshore platforms; Seranu Deep Water Port in Seranu District is one of the territory's largest container ports, fully automated; the battery works and electric vehicle plant of Ilatan District turn nickel and cobalt from the Unokari mines into batteries and finished cars, and the Unovila Vacuum Maglev Heavy-Haul Railway runs its loaded trains into Ilatan Freight Yard every day; Minasa District is a residential district of workers' families with the Talumaran Maritime College; and Padaran is the hinterland of rice, cocoa and spices. The Everlong Summer Vacuum Maglev stops at Talumaran Station in Talu, and the Talumaran–Nalumai High-Speed Railway runs by way of Unokari to Nalumai; the Imimu Expressway crosses Padaran, the Selo Expressway passes the city centre, and the Seranu Port Expressway ties the port, the battery works and the hinterland together; Talumaran Airport lies north of Ilatan. With four metro lines, the city is second only to Sarunnam in the territory.\nThe workers of the industrial belt come from all over the territory and from every country, incomers make up about two-thirds of the population, and the share of working-age people is high, with many children and few elderly. The City Council has 59 seats; the mayor, Anuvai Hanuvel, belongs to the International Communist Party and governs in coalition with the Social Democratic Mutual Aid Labour Party and Greenvein.\nLocals like to welcome newcomers with an old Ivuran saying, \"Talu oruka, maran tola\", where the ship stops is home, and the same words hang in the airport's arrivals hall. Whenever a new ship is launched at Lumbo, a garland of frangipani is hung on her bow, and the workers believe the farther the garland drifts at sea, the smoother her voyages will be; the dockers at Seranu have their own calls, half Chinese and half English with a few Ivuran words mixed in, which outsiders can hardly follow. Nearly all the city's taxis and buses are electric vehicles built at the Ilatan plant, and drivers love to boast to their passengers: \"The nickel in the battery was dug at Unokari, and the car was made right here.\" The harbour night market after work brings together the flavours of the workers' home towns, from noodles of every province to grilled meat from across the ocean, yet the best seller is a bowl of local coconut curry fish with rice. Before a storm the bay fills with fishing boats and freighters running in from the open sea, and the people of Talumaran stand on the shore counting them and saying \"the bay has saved lives again\"."
