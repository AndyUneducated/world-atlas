- id: div_2w2q99
  subtype: borough
  parent: div_k4tk68
  status: generated
  names:
    zh: 洛米哈努国家公园管理区
    en: Lomihanu National Park Administration Zone
    art-x-ivuran: Lomihanu
  notes:
    zh: "洛米哈努国家公园管理区是领地最大的国家公园，名字在伊武兰语里意为「大森林」，面积 7 万平方公里，占洛米兰全市一半的土地，常住人口只有约 3000 人，多为巡护员、研究人员和林中的原住村落。低地雨林、沼泽林和山地雨林连成一片，栖息着犀鸟、云豹、长臂猿和上千种兰花；林间有巡护小道，河上有船往来。最高峰洛米图马峰海拔 2771 米，在蒂拉凯苏山脉与哈努帕拉高原相接的地方，山坡从低地雨林一直过渡到山地雨林和云雾林。洛米图马峰西南的洛米瓦苏山口海拔 1602 米，是温达坎一带翻越山脉前往洛米兰雨林的通道。\n管理区以自然保护与巡护、科研和旅游为业，居民八成以上讲伊武兰语。卢瓦纳—洛米哈努国家公园公路从洛米兰城区通到公园边缘的游客中心，再往里只能走巡护小道或乘船；洛米西鲁河穿过公园的雨林，雨季漫进森林，形成季节性的淹水林。领地对园内的采集实行严格的许可，研究人员进山也要和巡护员同行。\n巡护员在小道两旁装了红外相机，拍到云豹的照片会贴在山下游客中心的墙上，墙上每多一张，巡护站就请大家喝一壶高原咖啡。洛米瓦苏山口两侧的森林截然不同，一边是挂满苔藓的云雾林，一边是高大的雨林，徒步者说翻过山口就像「从冬衣换成了夏衣」。"
    en: "The Lomihanu National Park Administration Zone is the territory's largest national park; its name means 'great forest' in Ivuran. It covers 70,000 km², half the land of Lomiran City, yet has only about 3,000 residents, mostly rangers, researchers and the forest villages of the original inhabitants. Lowland rainforest, swamp forest and montane rainforest merge into one, home to hornbills, clouded leopards, gibbons and more than a thousand kinds of orchid; ranger trails run through the forest and boats ply the rivers. The highest peak, Mount Lomituma, 2,771 m, stands where the Tirakesu Mountains meet the Hanupala Plateau, its slopes passing from lowland rainforest into montane rainforest and cloud forest. South-west of it the Lomivasu Pass, 1,602 m, is the way over the range from the Undakan country into the Lomiran rainforest.\nThe zone lives on conservation and patrols, research and tourism, and more than eight in ten residents speak Ivuran. The Luvana–Lomihanu National Park Road runs from the town of Lomiran to the visitor centre at the park's edge; beyond it there are only ranger trails and boats. The Lomisiru River crosses the park's rainforest and spills into the forest in the wet season, creating seasonally flooded woodland. Collection inside the park is strictly licensed by the territory, and researchers going into the forest must go with rangers.\nRangers have set up camera traps along the trails, and every photograph of a clouded leopard goes up on the wall of the visitor centre below; for every new picture on the wall, the ranger station stands everyone a pot of plateau coffee. The forests on either side of the Lomivasu Pass could hardly be more different, moss-hung cloud forest on one side and towering rainforest on the other, and hikers say crossing the pass is like \"changing from winter clothes into summer ones\"."
