- id: div_p3x7j4
  subtype: borough
  parent: div_6kjc7x
  status: generated
  names:
    zh: 哈马图区
    en: Hamatu District
    art-x-ivuran: Hamatu
  notes:
    zh: "哈马图区是埃武托拉公社的中心区，区名在伊武兰语里意为「一起」，面积约 220 平方公里，人口 33 万，地势低平，紧挨埃武托拉湾。行政与公共服务、高等教育和医疗疗养是区里的主要行业，第三产业占九成。区内的街道规划成放射状，从埃武托拉人民广场通向四周的住宅区，同心大道、广场大街、茉莉大街和莲塘大街是主要街道。\n人民广场四周是公社的三座标志性建筑。埃武托拉人民宫是公社委员会和居民议事会开会的地方，圆形的议事大厅能坐下上万人，平时开放给居民开会、演出和办婚礼。广场东侧的埃武托拉公社大食堂一次可供三万人同时用餐，是世界最大的公共食堂，一日三餐和夜宵都免费，食材来自塔尼武区的合作社。西侧的埃武托拉公社图书馆是世界最大的公共图书馆，昼夜开放，除了图书还借出工具、乐器、相机和露营装备，楼里有自习室、木工房和录音室。长夏真空磁悬浮的终点埃武托拉站在区里，地铁 1 号线经过埃武托拉站和公社大食堂站，伊米穆高速在这里到达终点，埃武托拉海岸公路和哈马图—奥鲁武公路通往邻区，免费的电车和公共汽车从广场通向各区，昼夜运行。\n广场上有一座大棚，公社大会就在棚下召开，会开得再长，中间也一定会停下来，大家一起吃一顿大食堂送来的点心。图书馆借出的工具和乐器都挂着一张小卡片，写着上一位使用者的留言，有人留下修理心得，也有人只写一句「这把吉他第三根弦有点松」。"
    en: "Hamatu District is the centre of Evutola Commune; its name means 'together' in Ivuran. It covers about 220 km² and has 330,000 people, on flat land right by Evutola Bay. Government and public services, higher education and health care are its main trades, and services make up nine-tenths of the economy. Its streets radiate from Evutola People's Square to the housing districts around it, with Concord Avenue, Square Boulevard, Jasmine Boulevard and Lotus Pond Boulevard as the main roads.\nThe commune's three landmark buildings stand round the square. The Evutola People's Palace is where the commune committee and the residents' assemblies meet; its round assembly hall seats more than ten thousand, and on ordinary days it is open to residents for meetings, performances and weddings. On the east side the Evutola Commune Canteen, the largest public canteen in the world, can feed 30,000 people at once, with three meals a day and a late-night meal all free, using food from the co-operatives of Tanivu. On the west side the Evutola Commune Library, the largest public library in the world, is open day and night and lends tools, musical instruments, cameras and camping gear as well as books, with study rooms, a woodwork shop and a recording studio inside. Evutola Station, the terminus of the Everlong Summer Vacuum Maglev, is in the district, Metro Line 1 calls at Evutola Station and Evutola Commune Canteen, the Imimu Expressway ends here, the Evutola Coast Road and the Hamatu–Oruvu Road lead to the neighbouring districts, and free trams and buses run day and night from the square to every district.\nA great canopy stands in the square, and the commune's assembly meets beneath it; however long the meeting runs, it always pauses so that everyone can share a snack sent over from the canteen. Every tool and instrument lent by the library carries a little card with a note from its last user: some leave repair tips, others just write \"the third string on this guitar is a bit loose\"."
