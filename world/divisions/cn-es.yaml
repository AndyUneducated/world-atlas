  names:
    zh: 奥鲁武区
    en: Oruvu District
    art-x-ivuran: Oruvu
  notes:
    zh: "奥鲁武区是埃武托拉公社的住宅区，区名意为「环形的家」，面积 300 平方公里，人口 26 万，是公社人口最密的区之一。奥鲁武环形公社住宅是一圈圈围合的多层住宅楼，中间是公共花园、托儿所和食堂，每个环住着两三千人；住房按家庭人数分配，不收租金。公共洗衣房、诊所和养老院设在每个环的底层，老人和孩子在内院里一起度过白天。居住与社区服务、医疗与疗养和高等教育是全区的主业，学府街一带是公社的学校和研究机构。约五成五的居民以伊武兰语为母语。塞洛高速从瓦利凯一路横穿主岛，终点就在奥鲁武区，哈马图—奥鲁武公路只有 4 公里，把住宅区和公社中心哈马图区连在一起。埃武托拉地铁2号线在区内设回声、博物馆大道、奥鲁武环形公社住宅、瓦利凯路、和平路、宪章路、团结大道和拉萨八站，和公社的公共交通一样不收车费。团结大道、博物馆大道、宪章路和和平路是区里的主要街道。\n每个环的花园里都有一棵居民一起种下的果树，结果时按户分，余下的送进环里的食堂。社区中心的钥匙墙上挂着环里居民共用的汽车、电钻和野营帐篷的钥匙，墙边的黑板写着谁借了什么、几时归还。公社每周工作四天，第五天环里很热闹，有人在托儿所帮忙，有人在花园里修剪果树，退休的老工人在内院教孩子修自行车。傍晚各环的食堂飘出椰浆焖鱼的香味，住户们端着碗坐到花园里吃，楼上的人隔着阳台跟楼下的人聊天，奥鲁武人说，一个环就像一个摊开的大家庭。"
    en: "Oruvu District is the housing district of Evutola Commune; its name means 'ring of homes', and it covers 300 km² with 260,000 people, one of the most densely settled districts in the commune. The Oruvu Ring Homes are circles of mid-rise blocks around a shared garden, nursery and canteen, two or three thousand people to each ring; homes are allotted by the size of the family and no rent is charged. Public laundries, clinics and care homes occupy the ground floor of every ring, and the old and the young spend their days together in the inner courts. Housing and community services, health care and convalescence, and higher education are the district's main work, and the commune's schools and research institutions cluster around College Street. About 55 per cent of residents speak Ivuran as their mother tongue. The Selo Expressway crosses the main island all the way from Vallikkai and ends in Oruvu District, and the Hamatu–Oruvu Road, only 4 km long, joins the housing district to Hamatu District, the commune's centre. Evutola Metro Line 2 has eight stations in the district, Echo, Museum Avenue, Oruvu Ring Homes, Vallikkai Road, Peace Road, Charter Road, Unity Avenue and Lhasa, and like all the commune's public transport it charges no fares. Unity Avenue, Museum Avenue, Charter Road and Peace Road are the main streets.\nIn every ring's garden stands a fruit tree the residents planted together; when it fruits the crop is shared out by household and the rest goes to the ring's canteen. The key wall in the community centre holds the keys to the cars, drills and camping tents the residents share, and a blackboard beside it records who has borrowed what and when it is due back. The commune works a four-day week, and on the fifth day the rings are busy: some help out at the nursery, some prune the fruit trees, and retired workers teach children to mend bicycles in the courts. In the evening the smell of fish braised in coconut milk drifts from every ring's canteen, residents carry their bowls out into the garden to eat, and people upstairs chat over their balconies with those below; Oruvu people say a ring is like one big family laid out in a circle."
