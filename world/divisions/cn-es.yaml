  flag_notes:
    zh: "长夏新城旗：深紫底，左上角是领地旗的朝阳，右侧一颗白色四芒星，旗底一道沙白横条。城名意为「明亮的沙」，沙白横条是海岸上洁白的石英砂滩，四芒星是闪光的砂粒，也是用硅做成的芯片；深紫是晶圆厂洁净车间里的灯光。"
    en: "A southern new-town flag: deep purple with the territory's rising sun in the canton, a white four-pointed star in the fly and a sand-white stripe along the foot. The name means 'bright sand': the stripe is the white quartz beaches, the star a glint of sand and the silicon chips, and the purple the light of the clean rooms in the fabs."
