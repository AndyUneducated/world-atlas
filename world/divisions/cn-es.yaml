# Administrative divisions of the Everlong Summer Islands Territory (CN-ES).
# id: stable internal key, referenced by other files. codes.admin: 6-digit hierarchical code (GB/T 2260 pattern:
# territory 930000, city 930100, district 930101); may change on reorganisation.
# subtype follows Overture Maps divisions: country > dependency/region > locality > borough.
# Names are Chinese, English and Ivuran (art-x-ivuran), the islands' own language.
# Special divisions: Evutola Commune (city level, self-governing, sets its own taxes), a national park
# administration zone, nature reserves, a mining administration zone and the naval islands (district level).
divisions:
- id: div_nwm019
  subtype: dependency
  parent: country:CN
  status: generated
  names:
    zh: 长夏群岛领地
    en: Everlong Summer Islands Territory
    art-x-ivuran: Imimu Selovaru
  notes:
    zh: 长夏群岛领地在北纬 2° 到 12° 之间的热带海洋上，由一座东北—西南走向、长约 2400 公里的主岛和西南端外六座岛屿组成的基鲁迈群岛构成，陆地面积约 90 万平方公里，连同领海约 130 万平方公里，人口 1200 万。热带季风气候，雨季和旱季分明，几乎没有台风和地震。主岛中脊是古老的蒂拉凯苏山脉，山坡上是成片的水稻梯田；中部高原上的翁贝尔哈努湖畔是新建的首府米雷兰，西南端哈努西鲁河三角洲上的萨伦纳姆是最大城市和古王国的旧都。伊武兰语母语者约占一半，其余是来自中国其他省份和世界各地的移民，大城市移民多、小城镇本地人多，中文、英文和伊武兰语都是官方语言。农业、工业和服务业三者均衡：梯田稻米、香料、可可和热带水果，半导体、造船、生物医药和从镍矿到电池与新能源车的产业链，以及旅游、港口转运和热带医学研究。领地实行高税收、高福利、高监管，教育免费到大学，全民医保和全民基本收入覆盖每个居民，土地公有、长期租用；东北海岸的埃武托拉公社自定税率，住房、交通、医疗、食堂和汽车全部免费。
    en: "The Everlong Summer Islands Territory lies in tropical seas between 2° and 12° north: a main island some 2,400 km long, running from north-east to south-west, and the six Kirumai Islands off its south-western end, about 900,000 km² of land and some 1.3 million km² with its territorial waters, home to 12 million people. The climate is tropical monsoon, with a clear wet season and dry season and almost no typhoons or earthquakes. The ancient Tirakesu Mountains form the spine of the main island, their slopes stepped with rice terraces; the new capital, Mirelan, stands by Lake Ombelhanu on the central plateau, and Sarunnam, on the delta of the Hanusiru River at the south-western end, is the largest city and the old seat of the island's kingdom. About half the people are native Ivuran speakers and the rest are incomers from other provinces of China and from all over the world, more of them in the big cities and fewer in the small towns; Chinese, English and Ivuran are all official languages. Farming, industry and services are evenly balanced: terrace rice, spices, cocoa and tropical fruit; semiconductors, shipbuilding, medicines and a chain from nickel mines to batteries and electric cars; and tourism, transhipment and tropical medicine. The territory taxes highly, provides generously and regulates closely: education is free through university, public health insurance and a universal basic income cover every resident, and land is publicly owned and held on long leases. Evutola Commune on the north-east coast sets its own taxes and gives its people housing, transport, health care, meals and even cars for free."
  short_names:
    zh: 长夏群岛
    en: Everlong Summer Islands
  codes:
    iso3166_1:
      alpha2: ES
      alpha3: ESI
      numeric: '904'
    iso3166_2: CN-ES
    admin: '930000'
  motto:
    zh: 长夏不尽，人人有家
    en: Endless Summer, a Home for All
  capital: div_khxhrn
  route_shield: tropic
  operators:
    expressway: { zh: 长夏群岛高速公路集团, en: Everlong Summer Expressway Group }
    highway: { zh: 长夏群岛领地公路局, en: Everlong Summer Roads Authority }
    rail: { zh: 长夏群岛磁浮与铁路公司, en: Everlong Summer Maglev and Railways }
  flag: everlong_summer
  flag_notes:
    zh: "绯红的天空里一轮金色太阳放出光芒，下方是层层绿色梯田和蓝白海浪。太阳代表终年的长夏，梯田代表山地的稻作，海浪代表环绕群岛的大海；绯红与金色取自古王国王旗的颜色。领地设立后兴起的工业城市都把这轮朝阳放在自己旗帜的左上角。"
    en: "Gold rays of the sun in a crimson sky, over green terraces and blue and white waves. The sun is the endless summer, the terraces the rice-growing of the hills and the waves the sea round the islands; crimson and gold were the colours of the old kingdom's royal banner. The industrial cities that grew after the territory was created carry this rising sun in their cantons."
  climate_notes:
    zh: "长夏群岛终年炎热，低地各月平均气温都在 25 到 27 度之间，最冷和最热的月份相差不到一度，季节只分雨季和旱季。四月是一年里最热的时候，随后西南季风带来雨季，八到十月雨最多，二月最干。越往南越接近赤道，雨水越多越均匀：瓦利凯和基鲁迈一年降水 2400 到 2700 毫米，月月有雨，是热带雨林气候；东北端的埃武托拉和纳卢迈旱季有两三个月几乎滴雨不下，年降水约 1200 毫米，是热带草原气候；两者之间是季风气候。中部高原海拔 1450 米的首府米雷兰年平均不到 18 度，白天 24 度，夜里 10 度，四季如春。全年日照 2300 到 2600 小时，白昼长度一年到头都在 11.4 到 12.8 小时之间。"
    en: "The Everlong Summer Islands are hot all year: every month in the lowlands averages 25 to 27 °C, the coolest and warmest months less than a degree apart, and the only seasons are wet and dry. April is the hottest month; then the south-west monsoon brings the rains, heaviest from August to October, and February is the driest. The farther south, the nearer the equator and the more and steadier the rain: Vallikkai and Kirumai get 2,400 to 2,700 mm a year with rain every month, a tropical rainforest climate, while Evutola and Nalumai at the north-eastern end have two or three almost rainless months and about 1,200 mm a year, a tropical savanna climate, with monsoon climates in between. On the central plateau the capital Mirelan, 1,450 m up, averages under 18 °C over the year, 24 °C by day and 10 °C at night, a spring that never ends. The islands get 2,300 to 2,600 hours of sunshine a year, and the day lasts between 11.4 and 12.8 hours all year round."
  traits: { industries: [agriculture, semiconductor, tourism, port] }

# ── 米雷兰市（首府）──
- id: div_khxhrn
  subtype: locality
  parent: div_nwm019
  status: generated
  names:
    zh: 米雷兰市
    en: Mirelan City
    art-x-ivuran: Mirelan
  notes:
    zh: 领地首府，在主岛中部海拔一千五百多米的哈努帕拉高原上、翁贝尔哈努湖东南岸，是领地设立后全新规划建设的行政城市，全市 40 万人。政务院、领地议会和各部沿帕萨卢区的规划轴线排开，轴线一端朝向湖面；高原气候凉爽，全年气温比沿海低十度左右。伊拉米区有长夏群岛热带医学研究院和领地大学的高原校区，翁贝尔区是湖畔的住宅区，哈努帕拉区包括大湖、高原牧场和咖啡园。居民一半以上是公务员、研究人员和他们的家人，来自领地各地和中国其他省份，伊武兰语母语者约占一半。
    en: "The territorial capital, on the Hanupala Plateau more than 1,500 m up in the middle of the main island, on the south-eastern shore of Lake Ombelhanu: an administrative city planned and built from scratch after the territory was created, with 400,000 people. The Executive Council, the territorial parliament and the ministries line the planned axis of Pasalu District, one end of which looks out over the lake; the plateau air is cool, about ten degrees below the coast all year. Ilami District has the Everlong Summer Islands Institute of Tropical Medicine and the plateau campus of the territorial university, Ombel District is the lakeside residential quarter, and Hanupala District takes in the great lake, upland pastures and coffee gardens. More than half the residents are civil servants, researchers and their families from all over the territory and other provinces of China, and about half are native Ivuran speakers."
  codes:
    admin: '930100'
    unlocode: ES MRL
  population: 400000
  area_km2: 70000.0
  color: '#2E6F8E'
  flag: { layout: hoist, colors: ['#FFFFFF', '#1E5E3B', '#2E86AB'], division: wedge, charge: sun, charge_color: '#E8A33D' }
  flag_notes:
    zh: "上绿下蓝两道横条，一道白色尖楔从旗杆一侧伸进旗面，尖端前是一轮金色太阳。米雷兰是领地设立后全新规划的首府，绿色是哈努帕拉高原的牧场与咖啡园，蓝色是翁贝尔哈努湖，白色尖楔是帕萨卢区那条朝向湖面的规划轴线，太阳取自领地旗。它是长夏群岛最年轻的市旗之一。"
    en: "Green over blue, with a white wedge reaching in from the hoist towards a gold sun. Mirelan is the capital planned from scratch when the territory was created: the green is the pastures and coffee of the plateau, the blue the lake, the wedge the planned axis of the government district pointing to the water, and the sun comes from the territory flag. It is one of the youngest city flags in the islands."
  traits: { industries: [government, research, education], heritage: tropic_mixed, age: balanced, income: 1.1 }
- id: div_z0z4vz
  subtype: borough
  parent: div_khxhrn
  status: generated
  names:
    zh: 帕萨卢区
    en: Pasalu District
    art-x-ivuran: Pasalu
  notes:
    zh: 首府的行政中心，区名在伊武兰语里意为「轴线」。一条宽阔的规划轴线从湖岸向东南延伸，政务院主楼、领地议会、各部大楼和中央派驻机构依次排列在两侧，轴线中段是公民广场和领地图书馆。住宅街坊按规划路网整齐排开，政府机关的公务员大多住在步行可达的范围内，街上种满雨树和凤凰木。
    en: The administrative centre of the capital; in Ivuran its name means 'the axis'. A broad planned axis runs south-east from the lakeshore, lined in turn by the main building of the Executive Council, the territorial parliament, the ministries and the offices of the central government, with Citizens' Square and the Territorial Library halfway along. Housing blocks follow the planned street grid, most civil servants live within walking distance of their offices, and the streets are planted with rain trees and flame trees.
  codes:
    admin: '930101'
  population: 120000
  area_km2: 300.0
  traits: { industries: [government, commerce] }
- id: div_f0wwdt
  subtype: borough
  parent: div_khxhrn
  status: generated
  names:
    zh: 翁贝尔区
    en: Ombel District
    art-x-ivuran: Ombel
  notes:
    zh: 首府湖畔的住宅区，区名意为「湖」。翁贝尔哈努湖岸修有长长的湖滨步道和公共浴场，周末首府居民来这里划船、游泳；住宅以低层的公寓和庭院住宅为主，许多楼房带有遮阳的长廊和屋顶花园。湖畔还有领地的公共疗养院和水上运动中心。
    en: The lakeside residential district of the capital; its name means 'lake'. A long promenade and public bathing beaches run along the shore of Lake Ombelhanu, where the capital's residents come at weekends to row and swim; homes are mostly low-rise flats and courtyard houses, many with shaded galleries and roof gardens. The territory's public convalescent home and a water sports centre stand by the lake.
  codes:
    admin: '930102'
  population: 140000
  area_km2: 900.0
  traits: { industries: [residential, tourism] }
- id: div_56take
  subtype: borough
  parent: div_khxhrn
  status: generated
  names:
    zh: 伊拉米区
    en: Ilami District
    art-x-ivuran: Ilami
  notes:
    zh: 首府东部的研究区，区名意为「知识」。长夏群岛热带医学研究院在这里研究疟疾、登革热等热带传染病的疫苗和药物，领地大学的高原校区设有医学、公共卫生和农业科学学院；研究院附属医院接收全领地转来的疑难病人。区内年轻研究人员多，来自世界各地的学者约占三成。
    en: The research district east of the capital; its name means 'knowledge'. The Everlong Summer Islands Institute of Tropical Medicine works on vaccines and drugs against malaria, dengue and other tropical diseases, and the plateau campus of the territorial university has schools of medicine, public health and agricultural science; the institute's teaching hospital takes difficult cases referred from across the territory. Young researchers are many, and about three in ten scholars come from abroad.
  codes:
    admin: '930103'
  population: 90000
  area_km2: 1800.0
  traits: { industries: [research, education, healthcare] }
- id: div_t5wpdw
  subtype: borough
  parent: div_khxhrn
  status: generated
  names:
    zh: 哈努帕拉区
    en: Hanupala District
    art-x-ivuran: Hanupala
  notes:
    zh: 首府周围广阔的高原区，区名意为「大高原」，面积 6.7 万平方公里，只有 5 万人。翁贝尔哈努湖大部分在区内，湖边是芦苇荡和水鸟栖息地；高原上有牧场、咖啡园和稻田，村庄沿湖和河谷分布，居民大多是讲伊武兰语的本地人。高原边缘是陡峭的断崖，河流从这里跌落成瀑布流向两岸的低地。
    en: The wide plateau around the capital; its name means 'great plateau', and it covers 67,000 km² with only 50,000 people. Most of Lake Ombelhanu lies within it, fringed with reedbeds where water birds gather; up on the plateau are pastures, coffee gardens and rice fields, villages line the lake and the river valleys, and most of the people are Ivuran-speaking islanders. The plateau ends in steep escarpments, where rivers drop in waterfalls towards the lowlands on either coast.
  codes:
    admin: '930104'
  population: 50000
  area_km2: 67000.0
  traits: { industries: [agriculture, tourism, conservation], heritage: ivuran }

# ── 萨伦纳姆市──
- id: div_kv6b3e
  subtype: locality
  parent: div_nwm019
  status: generated
  names:
    zh: 萨伦纳姆市
    en: Sarunnam City
    art-x-ivuran: Sarunnam
  notes:
    zh: 领地最大的城市，在主岛西南端哈努西鲁河三角洲上，全市 350 万人。这里是古王国的旧都，瓦什塔赖区的旧王城留有宫殿遗址和伊什万塔石构寺庙群，塞鲁卡姆区的老城河道纵横，水上市场每天清晨开市；阿兰塔区是摩天楼林立的中央商务区，集中了领地的银行、数字服务公司和跨国企业的地区总部。萨鲁凯区的河口港是领地的大港之一，门达卢尔区有萨伦纳姆国际机场。三角洲上的奥卢瓦尔区是领地最大的稻米产区，皮拉凯区的海岸长满红树林。全市移民略多于一半，伊武兰语南部方言在老城里仍是日常用语。
    en: "The territory's largest city, on the delta of the Hanusiru River at the south-western end of the main island, with 3.5 million people. It is the old capital of the island's kingdom: the royal city of Vashtarai District keeps palace ruins and the Ishvanta stone temples, the old town of Serukkam District is laced with canals and its floating market opens at dawn every day, and Aranta District is the skyscraper business centre, home to the territory's banks, digital service firms and the regional headquarters of international companies. The river-mouth port of Sarukkai District is one of the territory's great harbours, and Mendalur District has Sarunnam International Airport. Out on the delta, Oluvar District is the largest rice-growing area in the territory, and mangroves cover the coast of Pilakkai District. A little over half the people are incomers, though the southern dialect of Ivuran is still the everyday language of the old town."
  codes:
    admin: '930200'
    unlocode: ES SRN
  population: 3500000
  area_km2: 62000.0
  color: '#B5452B'
  flag: { layout: seal, colors: ['#7A1F2B', '#E9B949', '#7A1F2B', '#F6E7C1'], charge: stupa, charge_color: '#7A1F2B', legend: art-x-ivuran }
  flag_notes:
    zh: "绛红底正中一枚金色圆印，印环上用伊武兰语和英语写着城名，象牙色印心里是一座绛红色的石构寺塔。这是古王国旧都的王印，瓦什塔赖区的旧王城和伊什万塔寺庙群都留着它的刻痕；王国时代王印只盖在诏书上，如今挂在领地最大城市的每一座码头和摩天楼上。"
    en: "A gold round seal on crimson, its ring bearing the city's name in Ivuran and English and its ivory centre a crimson stone temple tower. It is the royal seal of the old kingdom's capital, still carved in the ruins of the old royal city and on the Ishvanta temples; in the kingdom's day it sealed only royal decrees, and today it flies over every quay and tower of the territory's largest city."
  traits: { industries: [commerce, finance, digital, heritage], heritage: tropic_global, age: balanced, income: 1.15 }
- id: div_8jecyx
  subtype: borough
  parent: div_kv6b3e
  status: generated
  names:
    zh: 瓦什塔赖区
    en: Vashtarai District
    art-x-ivuran: Vashtarai
  notes:
    zh: 萨伦纳姆的旧王城，区名是雅言里的「王冠之座」。城墙和护城河围着宫殿遗址，伊什万塔寺庙群的上百座石塔在城北连成一片，是古王国留下的最大遗产；寺庙至今仍有僧侣居住，节庆时全城的人来这里点灯、献花。城墙内只许步行和骑车，老房子多改作博物馆、手工作坊和客栈。
    en: Sarunnam's old royal city; in the court register its name means 'seat of the crown'. Walls and a moat enclose the palace ruins, and the hundreds of stone towers of the Ishvanta temples stand together to the north, the greatest legacy of the old kingdom; monks still live in the temples, and at festivals the whole city comes to light lamps and offer flowers. Inside the walls only walking and cycling are allowed, and many old houses have become museums, craft workshops and guesthouses.
  codes:
    admin: '930201'
  population: 380000
  area_km2: 120.0
  traits: { industries: [heritage, tourism, commerce], heritage: tropic_mixed }
- id: div_xz0zqd
  subtype: borough
  parent: div_kv6b3e
  status: generated
  names:
    zh: 塞鲁卡姆区
    en: Serukkam District
    art-x-ivuran: Serukkam
  notes:
    zh: 萨伦纳姆的老城，河道纵横，区名意为「运河之城」。高脚木屋和老商铺沿河排开，塞鲁卡姆水上市场每天清晨开市，上千条小船载着蔬果、鲜鱼、香料和小吃在河道里交易；老城的街巷窄而曲折，人口密度居全领地之首。本地人多讲伊武兰语南部方言，许多家庭世代在水上做买卖。
    en: Sarunnam's old town, laced with canals; its name means 'city of canals'. Stilt houses and old shops line the waterways, and every morning at dawn the Serukkam Floating Market opens, with a thousand boats trading vegetables and fruit, fresh fish, spices and snacks on the canals. The lanes of the old town are narrow and winding, and it is the most densely peopled district in the territory. Most residents speak the southern dialect of Ivuran, and many families have traded on the water for generations.
  codes:
    admin: '930202'
  population: 520000
  area_km2: 160.0
  traits: { industries: [commerce, tourism, food], heritage: tropic_mixed }
- id: div_1z75n0
  subtype: borough
  parent: div_kv6b3e
  status: generated
  names:
    zh: 阿兰塔区
    en: Aranta District
    art-x-ivuran: Aranta
  notes:
    zh: 萨伦纳姆的中央商务区，区名意为「高处」。摩天楼沿规划大道排开，领地的银行、证券交易所、数字服务公司和跨国企业的地区总部都在这里，天际线最高处是萨伦纳姆塔。高楼之间有遮阳的空中连廊和大片的雨林式屋顶花园；白天在这里工作的人大多是移民，入夜后河滨的夜市和屋顶餐厅热闹到很晚。
    en: Sarunnam's central business district; its name means 'the heights'. Skyscrapers line its planned avenues, home to the territory's banks, the stock exchange, digital service firms and the regional headquarters of international companies, with the Sarunnam Tower at the top of the skyline. Shaded sky bridges link the towers, many of which carry rainforest roof gardens; most of the people who work here by day are incomers, and at night the riverside night market and rooftop restaurants stay busy late.
  codes:
    admin: '930203'
  population: 400000
  area_km2: 130.0
  traits: { industries: [finance, digital, commerce] }
- id: div_ycfvt9
  subtype: borough
  parent: div_kv6b3e
  status: generated
  names:
    zh: 萨鲁凯区
    en: Sarukkai District
    art-x-ivuran: Sarukkai
  notes:
    zh: 哈努西鲁河口的港区，区名意为「河口之岸」。萨伦纳姆港的集装箱码头和散货码头沿河口两岸展开，三角洲的稻米、香料和水产从这里装船出口，进口的机械和原料从这里运往全岛。港区后方是仓库、冷库和食品加工厂，码头工人和船员多住在区北的工人新村。
    en: The port district at the mouth of the Hanusiru River; its name means 'shore of the river mouth'. The container and bulk terminals of the Port of Sarunnam spread along both banks of the estuary; rice, spices and seafood from the delta are shipped out from here, and imported machinery and materials go on from here to the whole island. Behind the quays are warehouses, cold stores and food plants, and dockers and seafarers mostly live in the workers' estates to the north.
  codes:
    admin: '930204'
  population: 300000
  area_km2: 500.0
  traits: { industries: [port, logistics, manufacturing] }
