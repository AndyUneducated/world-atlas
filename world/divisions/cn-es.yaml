  names:
    zh: 瓦什塔赖区
    en: Vashtarai District
    art-x-ivuran: Vashtarai
  notes:
    zh: "瓦什塔赖区是萨伦纳姆的旧王城，区名是雅言里的「王冠之座」，面积约 120 平方公里，人口 38 万。城墙和护城河围着瓦什塔赖旧王城的宫殿遗址，石阶、王座台基和浴池保存至今；伊什万塔寺庙群的上百座石塔在城北连成一片，由回廊和水池相连，是世界最大的古代石构寺庙群，也是古王国留下的最大遗产。寺庙至今仍有僧侣居住，清晨的诵经声从石塔间传出，领地文化部门按年修缮石塔，游客须脱鞋入内。\n城墙内只许步行和骑车，老房子多改作博物馆、手工作坊和客栈，区里九成以上的产值来自文化遗产、旅游和商贸，人均产值约 7.6 万美元。伊武兰语母语者约占一半，老年人比例在全市偏高。地铁 5 号线经过奥卢大街站、瓦什塔赖旧王城站和檀香街站，萨伦纳姆环城高速从区里经过，纳卢高速也从这里出发，沿西北海岸一路北上。码头大街、榕树路和乌韦萨大道是区里的主要街道。\n节庆时全城的人来这里点灯、献花。每逢满月的「Vilaru Imolu」，意思是「灯与月」，王城和寺庙群的回廊、水池边点起成千上万盏油灯，石塔的倒影映在水里，一家老小坐船沿着护城河看灯，连阿兰塔区的摩天楼也在这一夜调暗灯光。手工作坊里的老匠人还在用古法雕刻石像和编织棕叶，游客常坐在门口看上半天。"
    en: "Vashtarai District is the old royal city of Sarunnam; its name is the classical tongue's 'seat of the crown'. It covers about 120 km² and has 380,000 people. Walls and a moat surround the palace ruins of the Vashtarai Royal City, whose stone stairs, throne platform and baths survive to this day; north of the walls the hundred-odd stone towers of the Ishvanta Temples, linked by cloisters and pools, form the largest ancient stone temple complex in the world and the greatest legacy of the old kingdom. Monks still live in the temples and morning chanting drifts out between the towers; the territory's cultural authorities restore the towers year by year, and visitors must take off their shoes to enter.\nInside the walls only walking and cycling are allowed, and many old houses have become museums, craft workshops and guesthouses; more than nine-tenths of the district's output comes from heritage, tourism and trade, and output per head is about US$76,000. About half the residents are native Ivuran speakers, and the share of older people is high for the city. Metro Line 5 calls at Olu High Street, Vashtarai Royal City and Sandalwood Street, the Sarunnam Ring Expressway passes through, and the Nalu Expressway sets off from here up the north-west coast. Quay Boulevard, Banyan Road and Uvesa Avenue are the main streets.\nAt festivals the whole city comes here to light lamps and offer flowers. At every full moon, on \"Vilaru Imolu\", lamps and moon, thousands upon thousands of oil lamps are lit along the cloisters and pools of the royal city and the temples, the towers are mirrored in the water, whole families take boats along the moat to see the lights, and even the towers of Aranta dim their lights for the night. In the workshops old craftsmen still carve stone figures and weave palm leaves by the old methods, and visitors often sit in the doorways watching them for hours."
