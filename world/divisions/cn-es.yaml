  names:
    zh: 埃鲁塔姆区
    en: Eruttam District
    art-x-ivuran: Eruttam
  notes:
    zh: "埃鲁塔姆区是瓦利凯北部的物流区，区名在伊武兰语里意为「货仓之地」，面积约 800 平方公里，人口 20 万。物流园、冷链仓库和食品加工厂沿高速公路分布，领地的进口商品从这里分拨到全岛，水产和香料在这里加工包装后出口；物流仓储、食品与水产加工和制造业是主要行业，工业占四成以上，人均产值约 6.8 万美元，是全市最高的，平均寿命也是全市最长的。\n埃鲁塔姆物流园在图拉凯港口高速的另一端，冷库、仓库和分拣中心为全岛配送货物，集装箱卡车从图拉凯集装箱码头直达，不必进入坎纳鲁尔老城。伊米穆高速也从区里经过，向东北通往温达坎的山地。地铁 3 号线全线在区内，从体育场站经伦博湾大道站、石桥站和沙丘站到剧院站。居民里伊武兰语母语者不到一半，许多是在物流园和工厂上班的移民家庭；红树大道、广场大道、自由大道和诗人大街是区里的主要街道。\n物流园的冷库里常年存着整箱的海藻饼和香料，瓦利凯人出远门必带的干粮也从这里发往全岛的商店。夜班的分拣工凌晨下班，常在高速出口旁的小吃摊吃一碗鱼片粥，看着第一批集装箱卡车从码头开进园区。"
    en: "Eruttam District is the logistics district in the north of Vallikkai; its name means 'land of warehouses' in Ivuran. It covers about 800 km² and has 200,000 people. Logistics parks, cold-chain warehouses and food factories line the expressways; the territory's imports are distributed from here to the whole island, and seafood and spices are processed and packed here for export. Logistics and warehousing, food and seafood processing and manufacturing are the main trades, industry makes up more than four-tenths of the economy, and output per head, about US$68,000, is the highest in the city, as is life expectancy.\nThe Eruttam Logistics Park lies at the far end of the Turakkai Port Expressway, its cold stores, warehouses and sorting centres supplying the whole island, and container lorries come straight from the Turakkai Container Terminal without entering the old town of Kannarur. The Imimu Expressway also crosses the district on its way north-east into the hills of Undakan. Metro Line 3 runs entirely within the district, from Stadium through Lumbo Bay Avenue, Stone Bridge and Dune to Theatre. Native Ivuran speakers are a little under half the residents, many of whom belong to incomer families working in the logistics park and factories; Mangrove Avenue, Square Avenue, Liberty Avenue and Poets' Boulevard are the main streets.\nThe cold stores of the logistics park always hold cases of seaweed cake and spices, and the provisions every Vallikkai traveller takes on a journey are sent out from here to shops all over the island. Night-shift sorters coming off work in the small hours often eat a bowl of fish congee at a stall by the expressway exit, watching the first container lorries roll in from the docks."
  codes:
