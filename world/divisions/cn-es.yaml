  flag_notes:
    zh: "红底正中一圈金色小屋，围着中央一块圆坪。小屋是公社一家挨一家围成一圈的环形住宅，也就是「大家的家」这个名字；圆坪是居民议事会开会的广场，公社的大事都在这里由全体居民直接表决。红色是公社的颜色。人民宫顶上挂的就是这面旗，居民从不说「市旗」，只说「我们的旗」。"
    en: "A ring of gold houses round a round green on red. The houses are the commune's ring of homes, one beside the next, which is what its name, 'everyone's home', means; the green is the ground where the residents' assembly meets and the whole commune votes directly on its affairs, and the red is the commune's colour. The same flag flies over the People's Palace, and residents never call it the city flag, only 'our flag'."
