  parent: div_k4tk68
  status: generated
  names:
    zh: 塔卡维区
    en: Takavi District
    art-x-ivuran: Takavi
  notes:
    zh: "塔卡维区是洛米哈努国家公园边缘的生态旅游区，区名在伊武兰语里意为「树冠」，面积约 2 万平方公里，人口 6 万，最高处海拔 2076 米。塔卡维雨林树冠步道由吊桥和树上平台连成，在离地几十米的树冠间蜿蜒约 5 公里，是世界最长的雨林树冠步道，游客能看到犀鸟筑巢和猴群觅食；步道每天限量预约，由本地村社的向导带领。林边的生态旅馆由本地村社经营，旅游和自然保护与巡护是区里几乎全部的行业，第三产业占八成以上。区里向西北伸入海中的塔卡维岬伸出约 18 公里，是领地最突出的岬角，岬上覆盖着原始的低地雨林。\n居民四分之三讲伊武兰语，许多年轻人当上了步道向导和旅馆员工。伊米穆高速从区里穿过，一头通往温达坎的山地，另一头翻上高原到首府；塔卡维雨林树冠步道公路从高速公路通到步道入口。檀香大道、水牛大道和磨坊大道是集镇的主要街道。\n清晨走在步道上，脚下是一片云海，偶尔能看见长臂的猿从步道旁荡过。向导说，犀鸟在午后成群叫起来，傍晚多半要下雨。岬上的犀鸟每天清晨飞越岬角去对岸觅食，翅膀扇动的声音像远处有人在拍被子，护林员说，听这声音就能数出今年有几对犀鸟。生态旅馆的晚饭常是叶包鱼配野蜂蜜，饭后向导会带客人去林边听蛙鸣。"
    en: "Takavi District is the ecotourism district on the edge of Lomihanu National Park; its name means 'canopy' in Ivuran. It covers about 20,000 km² and has 60,000 people, rising to 2,076 m. The Takavi Canopy Walkway, a chain of suspension bridges and tree platforms, winds some 5 km through the canopy dozens of metres above the ground, the longest rainforest canopy walkway in the world, where visitors can watch hornbills nesting and troops of monkeys foraging; places are limited each day and must be booked, and walks are led by guides from the local villages. The eco-lodges at the forest edge are run by the village communities, tourism and conservation make up almost all the district's work, and services account for more than four-fifths of the economy. Cape Takavi reaches about 18 km north-west into the sea, the most prominent cape in the territory, covered in primeval lowland rainforest.\nThree-quarters of the residents speak Ivuran, and many young people have become walkway guides and lodge staff. The Imimu Expressway crosses the district, one way towards the hills of Undakan and the other up onto the plateau to the capital, and the Takavi Canopy Walkway Road runs from the expressway to the walkway entrance. Sandalwood Avenue, Buffalo Avenue and Mill Avenue are the main streets of the market towns.\nEarly in the morning on the walkway there is a sea of cloud below your feet, and now and then a long-armed ape swings past. Guides say that when the hornbills call together in the afternoon it will most likely rain by evening. Every morning the hornbills of the cape fly across it to feed on the far side, their wingbeats sounding like someone beating a quilt in the distance, and rangers say they can count how many pairs there are this year just by listening. Supper at the eco-lodges is often fish grilled in leaves with wild honey, and afterwards the guides take guests to the forest edge to listen to the frogs."
  codes:
    admin: '930903'
  population: 60000
  area_km2: 20000.0
  traits: { industries: [tourism, conservation] }
