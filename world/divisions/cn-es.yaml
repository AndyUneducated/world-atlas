- id: div_yakrhd
  subtype: borough
  parent: div_5tgnmz
  status: generated
  names:
    zh: 伦博区
    en: Lumbo District
    art-x-ivuran: Lumbo
  notes:
    zh: "伦博区是塔卢马兰的造船区，区名意为「船」，面积 400 平方公里，人口 28 万，工业占全区产值的六成以上。伦博湾是塔卢马兰湾东北角伸进城区的狭长内湾，长约 25 公里，塔卢西鲁河在湾顶入海，老港的石砌防波堤和灯塔就在湾口。伦博船厂的干船坞和龙门吊沿湾排开，建造集装箱船、液化气运输船、海上风电安装船和海洋平台；周围是钢结构、船用发动机和电子设备的配套工厂。船厂的焊工、电工和工程师多住在区内的工人新村，讲中文的约占四成，讲英文的三成多，伊武兰语母语者不到三成，许多人是从中国其他省份和世界各地来的。图书馆大街、芒果大街、成都路和博物馆路是区里的主干道。塔卢马兰地铁4号线在区内设画廊、拉萨大道、平等路、南京路、共和大街、苏州、陈家和冰巨人八站，换班时车厢里挤满穿工装的人；塔卢—伦博公路约 13 公里，连接市中心的塔卢区，塞洛高速也从区内经过，船厂的货车由此往来。这里是热带季风气候，一年降水约 2200 毫米。\n湾两岸的船厂工人中午收工时，汽笛会一齐拉响，湾顶的小吃摊听到汽笛就开始下面，汽笛停时第一碗刚好端上桌。每有新船下水，船头都要挂一串鸡蛋花编成的花环，工人们相信花环在海上漂得越远，这条船的航程就越顺。工人新村的傍晚很热闹，老师傅在楼下的树荫里下棋，年轻的焊工带着孩子去老港的防波堤上看灯塔亮起来，指着湾里新造的船说「那条有我焊的一段」。"
    en: "Lumbo District is Talumaran's shipbuilding district; its name means 'ship', and it covers 400 km² with 280,000 people, with industry producing more than 60 per cent of its output. Lumbo Bay is a long, narrow inlet reaching into the city from the north-east corner of Talumaran Bay, about 25 km long; the Talusiru River enters the sea at its head, and the stone breakwater and lighthouse of the old harbour stand at its mouth. The dry docks and gantry cranes of the Lumbo Shipyard line the bay, building container ships, gas carriers, offshore wind installation vessels and ocean platforms, with steelwork, marine engine and electronics suppliers around them. The yard's welders, electricians and engineers mostly live in the district's workers' estates; about four in ten speak Chinese and over three in ten English, with native Ivuran speakers under three in ten, and many have come from other provinces of China and from all over the world. Library Boulevard, Mango Boulevard, Chengdu Road and Museum Road are the main roads. Talumaran Metro Line 4 has eight stations in the district, Gallery, Lhasa Avenue, Equality Road, Nanjing Road, Republic High Street, Suzhou, Chenjia and Frost Giant, and at shift change the cars are packed with people in work clothes; the Talu–Lumbo Road, about 13 km, links it to Talu District in the city centre, and the Selo Expressway also passes through, carrying the yard's lorries. The climate is tropical monsoon, with about 2,200 mm of rain a year.\nWhen the shipyard workers on both shores stop for lunch, the sirens sound all together; the stalls at the head of the bay start cooking noodles at the first blast, and the first bowl reaches the table just as the sirens fall silent. Whenever a new ship is launched, a garland of frangipani is hung on its bow, and the workers believe that the farther the garland floats out to sea, the smoother the ship's voyages will be. Evenings in the workers' estates are lively: old hands play chess in the shade below the blocks, and young welders take their children out on the old harbour breakwater to watch the lighthouse come on, pointing at a new ship in the bay and saying, 'There's a bit of that one I welded.'"
