  names:
    zh: 皮拉凯区
    en: Pilakkai District
    art-x-ivuran: Pilakkai
  notes:
    zh: 三角洲外缘的海岸区，区名意为「红树林之岸」。潮间带上长满红树林，是鱼虾和水鸟的繁育地，海岸线的大部分划为保护区；渔村在红树林之间的水道口，居民打鱼、养虾和养蟹，红树林外的浅海里还有海草床。领地禁止砍伐红树林开挖虾塘，养殖都在指定的内陆塘区进行。
    en: The coastal district on the outer edge of the delta; its name means 'mangrove shore'. Mangroves cover the tidal flats, a nursery for fish, shrimp and water birds, and most of the coastline is protected; fishing villages stand where channels open between the mangroves, their people catching fish and farming shrimp and crabs, with seagrass meadows in the shallows beyond. Clearing mangroves for shrimp ponds is forbidden in the territory, and farming is confined to designated inland ponds.
