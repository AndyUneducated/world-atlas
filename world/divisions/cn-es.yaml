- id: div_z0z4vz
  subtype: borough
  parent: div_khxhrn
  status: generated
  names:
    zh: 帕萨卢区
    en: Pasalu District
    art-x-ivuran: Pasalu
  notes:
    zh: "帕萨卢区是首府米雷兰的行政中心，区名在伊武兰语里意为「轴线」，面积 300 平方公里，人口 12 万。区里的方格路网整体转了一个角度，主轴线湖光大道朝着西北方向的翁贝尔哈努湖，向东南延伸。北端是长夏群岛领地政府的主楼，一座回字形的庭院建筑，正门朝南对着整条大道；南端是长夏群岛领地议会，议事厅里的辩论用中文、英文和伊武兰语进行。主楼与广场之间是对外事务、财政、司法、公共安全、民政和建设六部，以及中央政府派驻的高级国务督办办公室、巡视员办公室和人权事务高级专员办公室；轴线中段是公民广场，西侧是领地图书馆，东侧是政策和计划委员会，湖光大道在广场处有意断开；广场以南是教育、科学和文化，交通，卫生和人类服务，劳动和社会保障，自然资源和环境保护五部，公共福利司、劳动仲裁司等单独建楼的司排在后排。长夏大街是穿过区中心的横向主干道，米雷兰地铁1号线在区内设卫生和人类服务部、长夏大街、领地政府和库瓦拉峰路四站，政务区高速从区内出发，向南接上伊米穆高速。住宅街坊按规划路网整齐排开，公务员大多住在步行可达的范围内，街上种满雨树和凤凰木。行政与公共服务和商贸是全区的主业。\n公务员上班前在路边咖啡摊买一杯哈努帕拉的本地咖啡几乎是惯例，政务院的会议室里也只供应本地豆。领地议会开幕那天，议员们从湖边步行走过整条规划轴线进入议会，市民沿街撒花瓣，这条路因此被叫作「花瓣路」。旱季的夜晚，公民广场上有露天电影和音乐会，图书馆的地下书库里，古王国的棕榈叶手抄本在恒温恒湿中安睡。"
    en: "Pasalu District is the administrative centre of the capital, Mirelan; in Ivuran its name means 'the axis', and it covers 300 km² with 120,000 people. The district's street grid is turned at an angle, and its main axis, Lakelight Avenue, faces Lake Ombelhanu to the north-west and runs away to the south-east. At its northern end stands the main building of the Government of the Everlong Summer Islands, a courtyard building around a square court whose main gate faces south down the length of the avenue; at its southern end is the Everlong Summer Islands Territorial Assembly, where debates are held in Chinese, English and Ivuran. Between the main building and the square stand six ministries, External Affairs, Finance, Justice, Public Security, Civil Affairs and Construction, together with three offices of the central government, those of the Senior State Commissioner, the Inspector and the High Commissioner for Human Rights; halfway along is Civic Square, with the Territorial Library on its west side and the Policy and Planning Commission on its east, Lakelight Avenue deliberately broken where the square crosses it; south of the square stand five more ministries, Education, Science and Culture, Transport, Health and Human Services, Labour and Social Security, and Natural Resources and Environmental Protection, with the departments that have their own buildings, among them Public Welfare and Labour Arbitration, in the row behind. Everlong Summer Boulevard is the cross street through the centre of the district; Mirelan Metro Line 1 has four stations here, Ministry of Health and Human Services, Everlong Summer Boulevard, Territorial Government and Mount Kuvala Road, and the Government Quarter Expressway starts here and runs south to the Imimu Expressway. Housing blocks follow the planned street grid, most civil servants live within walking distance of their offices, and the streets are planted with rain trees and flame trees. Administration and public services, and commerce, are the district's main work.\nBuying a cup of local Hanupala coffee from a street stall before work is all but a ritual for civil servants, and the Executive Council's meeting rooms serve nothing but local beans. On the day the Assembly opens, its members walk from the lakeside along the whole length of the planned axis into the chamber while townspeople scatter petals along the way, which is why the route is called 'Petal Road'. On dry-season nights Civic Square has open-air films and concerts, and in the library's underground stacks the palm-leaf manuscripts of the old kingdom sleep at constant temperature and humidity."
  codes:
    admin: '930101'
  population: 120000
  area_km2: 300.0
  traits: { industries: [government, commerce] }
- id: div_f0wwdt
  subtype: borough
  parent: div_khxhrn
  status: generated
  names:
    zh: 翁贝尔区
    en: Ombel District
    art-x-ivuran: Ombel
  notes:
    zh: "翁贝尔区是首府米雷兰湖畔的住宅区，区名在伊武兰语里意为「湖」，面积 900 平方公里，人口 14 万，是全市人口最多的区。城区沿翁贝尔哈努湖东南岸展开，海拔七百多米到一千米，以居住、社区服务和旅游度假为业；住宅以低层的公寓和庭院住宅为主，许多楼房带有遮阳的长廊和屋顶花园。伊莫卢大街、凤凰木大道、白鹭大街和椰林大街是区里的主要街道。\n湖岸修有长长的湖滨步道和公共浴场，周末首府居民来这里划船、游泳；湖畔还有领地的公共疗养院和水上运动中心，从沿海来疗养的病人在这里住上几周，享受高原的凉爽。米雷兰机场在湖畔高原上，长夏真空磁悬浮和米纳高速铁路在区里的米雷兰站停靠，地铁 2 号线从晨星站经米雷兰站、灰狼站和奥鲁卡路站到翠鸟路站，伊米穆高速和通往高原的翁贝尔—哈努帕拉公路也从区里经过。居民里伊武兰语母语者约占一半，许多人是在帕萨卢区上班的公务员和他们的家人。\n傍晚湖面起风时，上班族下了地铁就往湖边走，吃一碗烤鱼配米线再回家；周末的湖滨步道上，有推着婴儿车散步的年轻父母，也有在凤凰木下下棋的退休公务员。机场商店里卖得最好的是毛衣和本地咖啡，从沿海飞来的旅客一下飞机就感到凉意，这是「毛衣首府」外号的来历之一。"
    en: "Ombel District is the lakeside residential district of the capital, Mirelan; its name means 'lake' in Ivuran. It covers 900 km² and has 140,000 people, the most of any district in the city. Its built-up area spreads along the south-eastern shore of Lake Ombelhanu at between 700 and 1,000 m above sea level, and it lives on housing, community services, tourism and holidays; homes are mostly low-rise flats and courtyard houses, many with shaded galleries and roof gardens. Imolu Boulevard, Flame Tree Avenue, Egret Boulevard and Coconut Grove Boulevard are its main roads.\nA long promenade and public bathing beaches run along the shore, where the capital's residents come at weekends to row and swim; the territory's public convalescent home and a water sports centre also stand by the lake, and patients from the coast stay here for weeks to enjoy the cool of the plateau. Mirelan Airport is on the plateau by the lake, the Everlong Summer Vacuum Maglev and the Mirelan–Nalumai High-Speed Railway call at Mirelan Station in the district, and Metro Line 2 runs from Morning Star through Mirelan Station, Wolf and Oruka Road to Kingfisher Road; the Imimu Expressway and the Ombel–Hanupala Road up to the plateau also pass through. About half the residents are native Ivuran speakers, and many are civil servants who work in Pasalu District, with their families.\nWhen the evening wind gets up over the lake, commuters walk from the metro to the shore for a bowl of grilled fish and rice noodles before heading home; at weekends the promenade fills with young parents pushing prams and retired civil servants playing chess under the flame trees. The best sellers in the airport shops are sweaters and local coffee, and travellers flying in from the coast feel the chill as soon as they step off the plane, which is one reason the capital is called \"the sweater capital\"."
  codes:
    admin: '930102'
  population: 140000
  area_km2: 900.0
  traits: { industries: [residential, tourism] }
- id: div_56take
  subtype: borough
  parent: div_khxhrn
  status: generated
  names:
    zh: 伊拉米区
    en: Ilami District
    art-x-ivuran: Ilami
  notes:
    zh: "伊拉米区是首府米雷兰东部的研究区，区名在伊武兰语里意为「知识」，面积约 1800 平方公里，人口 9 万。区里地势比湖畔低，海拔多在六百多米，气候比翁贝尔区稍暖、稍干。经济以科研、高等教育和医疗为主，第三产业占近九成，人均产值约 7.5 万美元，是首府最高的；居民里劳动年龄人口近七成，平均寿命近 85 岁。\n长夏群岛热带医学研究院在这里研究疟疾、登革热等热带传染病的疫苗和药物，与领地的生物医药企业共建实验室；研究院附属医院接收全领地转来的疑难病人，外岛和山区的病人经全民医保转来，路费也由保险承担。长夏群岛大学高原校区设有医学、公共卫生和农业科学学院，与研究院合办研究生课程，试验田里种着高原咖啡和稻种。区内年轻研究人员多，来自世界各地的学者约占三成，伊武兰语母语者仍过半数。广州大街、厦门大道、北京大道和奥卢大道是区里的主要街道，伊米穆高速从区里穿过，向东北通往基拉努。\n研究院的走廊里挂着一张世界地图，插满了研究人员故乡的小旗，周五傍晚各国学者轮流掌勺，在院里的厨房做家乡菜请同事吃。高原夜里凉，学生来上课总要带一件毛衣，沿海来的新生常被学长送一件印着校名的毛衣，算是入门礼。周末，研究员和学生成群骑车出发绕湖，回来时车筐里常装着湖边渔家烤好的鱼。"
    en: "Ilami District is the research district on the east side of the capital, Mirelan; its name means 'knowledge' in Ivuran. It covers about 1,800 km² and has 90,000 people. The land lies lower than the lakeshore, mostly a little over 600 m up, and the climate is slightly warmer and drier than in Ombel. The economy rests on research, higher education and health care, services make up nearly nine-tenths of it, and output per head, about US$75,000, is the highest in the capital; nearly seven in ten residents are of working age, and life expectancy is close to 85.\nThe Everlong Summer Islands Institute of Tropical Medicine works here on vaccines and drugs against malaria, dengue and other tropical diseases, running joint laboratories with the territory's biomedical companies; its teaching hospital takes difficult cases referred from across the territory, and patients from the outer islands and the hills are sent here under public health insurance, which also pays their fares. The Plateau Campus of the University of the Everlong Summer Islands has schools of medicine, public health and agricultural science, runs postgraduate courses with the institute and grows upland coffee and rice strains in its trial fields. Young researchers are many and about three in ten scholars come from abroad, though native Ivuran speakers are still more than half the population. Guangzhou Boulevard, Xiamen Avenue, Beijing Avenue and Olu Avenue are the main roads, and the Imimu Expressway crosses the district on its way north-east to Kilanu.\nA map of the world hangs in a corridor of the institute, bristling with little flags for the researchers' home towns, and on Friday evenings scholars from different countries take turns to cook dishes from home in the institute kitchen for their colleagues. Plateau nights are cool and students always bring a sweater to class; new students from the coast are often given one printed with the university's name by older students, a kind of welcome gift. At weekends researchers and students set off in groups to cycle round the lake, often coming back with grilled fish from the lakeside fishing families in their bike baskets."
  codes:
    admin: '930103'
  population: 90000
  area_km2: 1800.0
  traits: { industries: [research, education, healthcare] }
- id: div_t5wpdw
  subtype: borough
  parent: div_khxhrn
  status: generated
  names:
    zh: 哈努帕拉区
    en: Hanupala District
    art-x-ivuran: Hanupala
  notes:
    zh: "哈努帕拉区是首府米雷兰周围广阔的高原区，区名意为「大高原」，面积 6.7 万平方公里，只有 5 万人，每平方公里不到一人，是米雷兰面积最大的区。翁贝尔哈努湖大部分在区内，湖边是芦苇荡和水鸟栖息地；领地最长的哈努西鲁河也发源于这片高原。高原上有牧场、咖啡园和稻田，村庄沿湖和河谷分布，居民大多是讲伊武兰语的本地人，约占七成七，老人约占四分之一。种植业、旅游度假和自然保护与巡护是全区的生计，哈努帕拉的咖啡是首府的骄傲。高原东部的帕拉图马峰海拔 2036 米，是米雷兰市的最高点，山坡上是高原牧场和咖啡园，峰顶的气象站记录着高原的雨季和旱季。高原边缘是陡峭的断崖，河流从这里跌落成瀑布流向两岸的低地。哈努帕拉高原公路约 290 公里，从高原边缘盘旋而下，直到纳卢迈迈卢阿区的海岸；翁贝尔—哈努帕拉公路约 116 公里，把湖畔的村庄与首府连在一起。这里年平均气温约 21 度，比沿海凉爽得多，一年降水约 2500 毫米。\n气象站的观测员每天清晨骑车上山读数，高原上的牧民习惯先问观测员今天下不下雨，再决定把牛赶到哪片草场去。哈努帕拉高原公路从凉爽的高原一路下到炎热的海岸，司机们说开完这条路「两个小时从春天开进盛夏」，山腰的观景台上常有咖啡摊，卖的就是哈努帕拉的本地豆。湖边的渔家把刚捕的湖鱼裹上香叶烤熟，配一碗红米饭，周末从首府骑车绕湖的人常在渔家门口停下来吃一顿。"
    en: "Hanupala District is the wide plateau around the capital, Mirelan; its name means 'great plateau', and it covers 67,000 km² with only 50,000 people, fewer than one to the square kilometre, the largest district in Mirelan. Most of Lake Ombelhanu lies within it, fringed with reedbeds where water birds gather, and the Hanusiru River, the longest in the territory, rises on this plateau. Up on the plateau are pastures, coffee gardens and rice fields, villages line the lake and the river valleys, and most of the people are Ivuran-speaking islanders, about 77 per cent, with roughly a quarter of them elderly. Farming, holidaymakers, and nature protection and patrol are the district's living, and Hanupala coffee is the capital's pride. Mount Palatuma, in the east of the plateau, rises to 2,036 metres, the highest point in Mirelan City; its slopes carry upland pastures and coffee gardens, and the weather station on its summit records the plateau's wet and dry seasons. The plateau ends in steep escarpments, where rivers drop in waterfalls towards the lowlands on either coast. The Hanupala Plateau Road, about 290 km long, winds down from the edge of the plateau all the way to the coast of Mailua District in Nalumai, and the Ombel–Hanupala Road, about 116 km, links the lakeside villages to the capital. The mean annual temperature is about 21 °C, far cooler than the coast, with about 2,500 mm of rain a year.\nThe weather station's observer cycles up the mountain every morning to take the readings, and the plateau's herders make a habit of asking the observer whether it will rain before deciding which pasture to drive their cattle to. The Hanupala Plateau Road drops from the cool plateau to the hot coast, and drivers say it takes them 'from spring into high summer in two hours'; coffee stalls often stand at the lookouts halfway down, selling beans grown in Hanupala. Lakeside fishing families wrap freshly caught lake fish in fragrant leaves and roast them, served with a bowl of red rice, and people cycling round the lake from the capital at weekends often stop at their doors for a meal."
  codes:
    admin: '930104'
  population: 50000
  area_km2: 67000.0
  traits: { industries: [agriculture, tourism, conservation], heritage: ivuran }

# ── 萨伦纳姆市──
- id: div_kv6b3e
  subtype: locality
  parent: div_nwm019
  status: generated
  names:
    zh: 萨伦纳姆市
    en: Sarunnam City
    art-x-ivuran: Sarunnam
  notes:
    zh: "萨伦纳姆市是长夏群岛领地最大的城市，在主岛西南端的哈努西鲁河三角洲上，全市 350 万人，面积约 6.2 万平方公里，城区地势低平，海拔多在几十米以下，属热带雨林气候，一年降水两千一百多毫米。这里是古王国的旧都，瓦什塔赖区的旧王城留有宫殿遗址，城北的伊什万塔寺庙群是世界最大的古代石构寺庙群；塞鲁卡姆区的老城河道纵横，塞鲁卡姆水上市场是世界最大的水上市场，每天清晨上千条小船在老城河道里交易；阿兰塔区是摩天楼林立的中央商务区，天际线最高处的萨伦纳姆塔约 960 米，是世界最高的建筑。全市移民略多于一半，伊武兰语南部方言在老城里仍是日常用语，伊武兰语母语者约占四成半。\n经济以商贸、金融、软件与数字服务和文化遗产旅游为主，第三产业占七成以上，人均产值约 7.3 万美元。阿兰塔区集中了领地的银行、证券交易所、数字服务公司和跨国企业的地区总部；萨鲁凯区的萨伦纳姆港在哈努西鲁河口两岸，三角洲的稻米、香料和水产从这里出口；伊拉瓦姆区是人口最多的区，有长夏群岛大学的主校区和成片的公共租赁住房；门达卢尔区的萨伦纳姆国际机场是领地最大的航空港；三角洲上的奥卢瓦尔区是领地最大的稻米产区，一年两到三熟；皮拉凯区的海岸长满红树林。长夏真空磁悬浮从伊拉瓦姆区的萨伦纳姆站出发，经瓦利凯、米雷兰、基拉努和塔卢马兰到埃武托拉，萨洛真空磁悬浮经彭纳拉姆通往洛米兰。伊米穆高速从基鲁迈群岛经哈努西鲁河口跨海大桥在萨鲁凯区登上主岛，纳卢高速从瓦什塔赖区出发沿西北岸北上，99 公里的萨伦纳姆环城高速绕城一周。萨伦纳姆有五条地铁，是领地地铁最多的城市：1 号线在阿兰塔区的摩天楼之间穿行，2 号线经过水上市场，3 号线连接萨伦纳姆站和大学，4 号线从门达卢尔区通到国际机场航站楼，5 号线经过旧王城。市立法会 67 席，市长伊卢文娜·翁巴赖来自国际共产党，与社会民主互助工党、伊武兰民族复兴党和绿脉党联合执政。\n萨伦纳姆人自称「旧都人」，说话带着伊武兰语南部方言的腔调，别处的人一听就知道。水上市场天不亮就开市，小船上的摊贩用竹竿挑着货招呼岸上的客人，最受欢迎的早点是用香蕉叶包着的椰浆糯米饭和刚出锅的炸香蕉，买卖谈妥，钱就放进竹竿头上的小篮子递过去。每逢满月，旧王城和寺庙群点起成千上万盏油灯，这一夜叫作「Vilaru Imolu」，意思是「灯与月」，一家老小坐船沿着老城河道看灯，阿兰塔区的摩天楼也在这一夜调暗灯光，港里的船只同样挂起油灯。奥卢瓦尔区收割后的稻田里会搭起戏台，演一种用伊武兰木鼓伴奏的古王国戏；皮拉凯的红树林里，退潮时能看到成群的弹涂鱼在泥滩上蹦跳。"
    en: "Sarunnam City is the largest city in the Everlong Summer Islands Territory, on the delta of the Hanusiru River at the south-western end of the main island. It has 3.5 million people and covers some 62,000 km²; the city itself is low and flat, mostly only a few dozen metres above sea level, with a tropical rainforest climate and more than 2,100 mm of rain a year. This was the capital of the old kingdom: the old royal city in Vashtarai District keeps the ruins of its palace, and the Ishvanta Temples to its north are the largest ancient stone temple complex in the world; the canals of the old town in Serukkam District criss-cross the streets, and the Serukkam Floating Market, the largest floating market in the world, sees a thousand boats trading on the old canals every morning; Aranta District is the central business district, a forest of skyscrapers whose highest point, Sarunnam Tower at about 960 m, is the tallest building in the world. Incomers are slightly more than half the population, the southern dialect of Ivuran is still the everyday speech of the old town, and native Ivuran speakers make up about 45 per cent.\nThe economy rests on trade, finance, software and digital services and heritage tourism; services make up more than seven-tenths of it, and output per head is about US$73,000. Aranta gathers the territory's banks, its stock exchange, its digital service companies and the regional headquarters of multinationals; Sarunnam Port in Sarukkai District lines both banks of the Hanusiru Mouth and ships out the delta's rice, spices and seafood; Ilavam, the most populous district, has the main campus of the University of the Everlong Summer Islands and large estates of public rental housing; Sarunnam International Airport in Mendalur is the territory's largest airport; Oluvar, out on the delta, is the territory's largest rice-growing area, with two or three crops a year; and the coast of Pilakkai is thick with mangroves. The Everlong Summer Vacuum Maglev starts from Sarunnam Station in Ilavam and runs by way of Vallikkai, Mirelan, Kilanu and Talumaran to Evutola, and the Sarunnam–Lomiran Vacuum Maglev runs through Pennaram to Lomiran. The Imimu Expressway comes from the Kirumai Islands over the Hanusiru Mouth Bridge and lands on the main island in Sarukkai, the Nalu Expressway sets off from Vashtarai up the north-west coast, and the 99-km Sarunnam Ring Expressway circles the city. With five metro lines, Sarunnam has more than any other city in the territory: Line 1 threads between the towers of Aranta, Line 2 passes the floating market, Line 3 links Sarunnam Station with the university, Line 4 runs from Mendalur to the terminal of the international airport, and Line 5 passes the old royal city. The city's Legislative Council has 67 seats; the mayor, Iluvenna Ombarai, belongs to the International Communist Party and governs in coalition with the Social Democratic Mutual Aid Labour Party, the Ivuran National Renewal Party and Greenvein.\nThe people of Sarunnam call themselves \"old-capital folk\" and speak with the lilt of southern Ivuran, which other islanders recognise at once. The floating market opens before dawn: traders in small boats hold up their goods on bamboo poles to customers on the bank, the favourite breakfasts are sticky rice with coconut milk wrapped in banana leaf and freshly fried bananas, and once a deal is struck the money goes into a little basket on the end of the pole. At every full moon the old royal city and the temples light thousands upon thousands of oil lamps; the night is called \"Vilaru Imolu\", lamps and moon, and whole families take boats along the old canals to see the lights, while the towers of Aranta dim their lights and the ships in the port hang out oil lamps too. In Oluvar, stages go up in the harvested paddies for a kind of old-kingdom drama accompanied by Ivuran wooden drums; in the mangroves of Pilakkai, shoals of mudskippers can be seen hopping over the mudflats at low tide."
