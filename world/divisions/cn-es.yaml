# ── 米雷兰市（首府）──
- id: div_khxhrn
  subtype: locality
  parent: div_nwm019
  status: generated
  names:
    zh: 米雷兰市
    en: Mirelan City
    art-x-ivuran: Mirelan
  notes:
    zh: "米雷兰市是长夏群岛领地的首府，在主岛中部的哈努帕拉高原上、翁贝尔哈努湖东南岸，是领地设立后全新规划建设的行政城市。全市 40 万人，面积约 7 万平方公里，绝大部分是高原、牧场和湖面；高原面海拔一千多米到一千六百米，东部的帕拉图马峰海拔 2036 米，是全市最高点。高原气候比沿海凉爽，夜里尤其明显：白天二十七八度，夜里常降到十五六度，一年降水两千三百多毫米。政务院、领地议会和各部沿帕萨卢区的规划轴线湖光大道排开，北端是领地政府主楼，南端是领地议会，中段的公民广场西侧是领地图书馆、东侧是政策和计划委员会，轴线一端朝向湖面。\n首府的经济以行政与公共服务、科研和高等教育为主，第三产业占八成以上，人均产值约 6.2 万美元。全市四个区各有分工：帕萨卢区是行政中心，公务员大多步行上班，街上种满雨树和凤凰木；翁贝尔区是湖畔的住宅区，有湖滨步道、公共浴场、领地的公共疗养院和水上运动中心，米雷兰机场也在湖畔高原上；伊拉米区有长夏群岛热带医学研究院和长夏群岛大学高原校区，研究院附属医院接收全领地转来的疑难病人；哈努帕拉区面积 6.7 万平方公里，包括大湖的大部分、高原牧场、咖啡园和稻田。长夏真空磁悬浮在翁贝尔区的米雷兰站停靠，向西南通瓦利凯和萨伦纳姆，向东北通基拉努、塔卢马兰和埃武托拉；米纳高速铁路从这里通往东北的纳卢迈。伊米穆高速穿过翁贝尔、哈努帕拉和伊拉米三区，政务区高速从帕萨卢区接上它，哈努帕拉高原公路和翁贝尔—哈努帕拉公路通往高原深处。城里有两条很短的地铁：1 号线在帕萨卢区的机关之间穿行，经过领地政府站和长夏大街站；2 号线经过米雷兰站，串起翁贝尔区的住宅街坊。居民一半以上是公务员、研究人员和他们的家人，来自领地各地和中国其他省份，伊武兰语母语者约占一半；市议会 47 席，市长卡韦莉·哈努韦尔来自社会民主互助工党，与国际共产党、伊武兰民族复兴党联合执政。\n米雷兰是领地少有需要毛衣的城市，沿海的人来首府开会，行李箱里总要塞一件毛衣，机场商店卖得最好的也是毛衣和本地咖啡，于是有了「毛衣首府」的外号；长夏群岛大学的学长还会送沿海来的新生一件印着校名的毛衣。湖边的老人爱说一句伊武兰语：「Ombel velau, selo imimu」，意思是「湖上有云，夏天就长」，翁贝尔哈努湖的水汽让高原四季如春，下午常有一场阵雨，雨后湖面上浮起一层薄雾。哈努帕拉区的咖啡园是首府的骄傲，公务员上班前在帕萨卢区的咖啡摊买一杯本地咖啡几乎是惯例，政务院的会议室里也只供应本地豆。周末，伊拉米区的研究员和学生骑车绕湖，湖边的渔家把刚捕的湖鱼裹上香叶烤熟，配一碗红米饭。领地议会开幕那天，议员们从湖边步行走过整条规划轴线进入议会，市民沿街撒花瓣，这条路因此被叫作「花瓣路」。"
    en: "Mirelan City is the capital of the Everlong Summer Islands Territory, on the Hanupala Plateau in the middle of the main island, on the south-eastern shore of Lake Ombelhanu: an administrative city planned and built from scratch after the territory was created. It has 400,000 people and covers some 70,000 km², most of it plateau, pasture and lake; the plateau surface lies between a little over 1,000 and 1,600 m, and Mount Palatuma in the east, 2,036 m, is the city's highest point. The plateau is cooler than the coast, above all at night: days reach 27–28 °C and nights often drop to 15–16 °C, with more than 2,300 mm of rain a year. The Executive Council, the territorial parliament and the ministries line Lakelight Avenue, the planned axis of Pasalu District: the main government building stands at its northern end and the Territorial Assembly at its southern end, with Civic Square halfway along, the Territorial Library on its west side and the Policy and Planning Commission on its east, and one end of the axis looks out over the lake.\nThe capital lives on government and public services, research and higher education; services make up more than four-fifths of the economy, and output per head is about US$62,000. Each of its four districts has its own role. Pasalu is the seat of government, where most civil servants walk to work along streets planted with rain trees and flame trees; Ombel is the lakeside residential district, with a promenade, public bathing beaches, the territory's public convalescent home and a water sports centre, and Mirelan Airport stands on the plateau by the lake; Ilami has the Everlong Summer Islands Institute of Tropical Medicine and the Plateau Campus of the University of the Everlong Summer Islands, whose teaching hospital takes difficult cases referred from across the territory; and Hanupala, 67,000 km² in extent, takes in most of the great lake, upland pastures, coffee gardens and rice fields. The Everlong Summer Vacuum Maglev stops at Mirelan Station in Ombel, running south-west to Vallikkai and Sarunnam and north-east to Kilanu, Talumaran and Evutola, and the Mirelan–Nalumai High-Speed Railway leaves from here for Nalumai in the north-east. The Imimu Expressway crosses Ombel, Hanupala and Ilami, the Government Quarter Expressway joins it from Pasalu, and the Hanupala Plateau Road and the Ombel–Hanupala Road lead deep into the uplands. The city has two very short metro lines: Line 1 threads between the government offices of Pasalu, calling at Territorial Government and Everlong Summer Boulevard, and Line 2 runs through Mirelan Station and links the residential blocks of Ombel. More than half the residents are civil servants, researchers and their families from all over the territory and other provinces of China, and about half are native Ivuran speakers. The City Council has 47 seats; the mayor, Kaveli Hanuvel, belongs to the Social Democratic Mutual Aid Labour Party and governs in coalition with the International Communist Party and the Ivuran National Renewal Party.\nMirelan is one of the few places in the territory where you need a sweater: people from the coast coming to the capital for meetings always pack one, the best-selling goods in the airport shops are sweaters and local coffee, and so the city has earned the nickname \"the sweater capital\"; older students at the university even give new arrivals from the coast a sweater printed with the university's name. Lakeside elders like an Ivuran saying, \"Ombel velau, selo imimu\", clouds on the lake make summer long: the moisture of Lake Ombelhanu keeps the plateau mild all year, and an afternoon shower often leaves a thin mist on the water. The coffee gardens of Hanupala are the capital's pride; civil servants all but invariably pick up a cup of local coffee at a stall in Pasalu on the way to work, and the government's meeting rooms serve nothing but local beans. At weekends researchers and students from Ilami cycle round the lake, where fishing families grill the day's lake fish wrapped in fragrant leaves and serve it with a bowl of red rice. When the territorial parliament opens, members walk from the lakeshore along the whole planned axis to the chamber while townspeople strew petals in their path, and so the avenue is known as \"the Petal Road\"."
