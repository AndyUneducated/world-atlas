  notes:
    zh: 萨伦纳姆东部的新城，萨伦纳姆国际机场在区内，是领地最大的航空港，航线通往世界各地；机场周围是物流园、航空维修基地和会展中心。新城按规划路网建设，住宅多为高层公寓，居民以近二三十年迁来的移民家庭为主。
    en: The new town east of Sarunnam, home to Sarunnam International Airport, the territory's largest, with flights to all parts of the world; around it are logistics parks, an aircraft maintenance base and the exhibition centre. The new town follows a planned street grid, homes are mostly high-rise flats, and most residents are families who have moved here in recent decades.
