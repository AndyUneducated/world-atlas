    art-x-ivuran: Vallikkai
  notes:
    zh: "瓦利凯市是主岛南岸西段的港口城市，在哈努西鲁河三角洲以东，全市 100 万人，面积约 5.5 万平方公里，城名在伊武兰语里意为「长长的海岸」。城区沿海岸展开，背后的萨卢瓦伊区一直延伸到蒂拉凯苏山脉的南麓，最高处海拔 1939 米。瓦利凯是热带雨林气候，月月有雨，是领地雨水最多的城市之一，一年降水两千三百多毫米，港区图拉凯一带近三千毫米。\n瓦利凯港扼守东西航线，是领地的国际转运枢纽：图拉凯区的图拉凯集装箱码头沿防波堤展开，往来大洋之间的大型集装箱船在这里换装支线船，转运箱量居领地之首；埃鲁塔姆区的物流园、冷链仓库和食品加工厂为全岛配送货物；城外萨卢瓦伊区沿海是鱼虾和海藻的养殖场和晒盐场。港口航运、物流仓储、海水养殖和食品与水产加工是全市的主要行业，人均产值约 6.5 万美元。老城坎纳鲁尔区保留着骑楼街和香料仓库，卡兰杜尔区是港口和物流园工人家庭的住宅区，有瓦利凯航海学院。全市移民约占一半，老城居民多讲伊武兰语南部方言。\n长夏真空磁悬浮在老城的瓦利凯站停靠，向西南通萨伦纳姆，向东北翻上高原到首府米雷兰；瓦洛高速铁路从这里出发，经温达坎通往洛米兰。伊米穆高速穿过埃鲁塔姆区，塞洛高速从坎纳鲁尔区出发，经温达坎的山地下到东南岸，40 公里的图拉凯港口高速把码头和物流园直接连起来，集装箱卡车不必进入老城。三条地铁各在一个区里：1 号线经过瓦利凯站和坎纳鲁尔香料仓库博物馆，2 号线在图拉凯港区，3 号线在埃鲁塔姆区。市议政会 55 席，市长沈静宜来自社会民主互助工党，与国际共产党和伊武兰民族复兴党联合执政。\n老城的骑楼就是为雨而建的，沿街的廊道连成一片，下再大的雨，买菜、喝茶、逛街都不用打伞，本地人说「瓦利凯人一辈子淋不着雨」。骑楼下的茶摊从清晨开到深夜，香料奶茶是这里的招牌，用的豆蔻和肉桂过去就存放在不远处的香料仓库里，那些仓库如今改成了坎纳鲁尔香料仓库博物馆。图拉凯集装箱码头昼夜不停，码头的吊车司机被称作「云上的人」，他们在几十米高的驾驶室里吃午饭，饭盒用绳子吊上去。萨卢瓦伊湾的养殖户清晨划着小船收海藻，海藻晒干后做成一种咸香的海藻饼，是瓦利凯人出远门必带的干粮；塞里努岛的海盐带着一点海藻的鲜味，被厨师们称为「会说话的盐」。"
    en: "Vallikkai City is the port city of the western part of the main island's south coast, east of the Hanusiru delta, with a million people over some 55,000 km²; its name means 'long coast' in Ivuran. The town spreads along the shore, and Saluvai District behind it stretches to the southern foot of the Tirakesu Mountains, reaching 1,939 m. Vallikkai has a tropical rainforest climate with rain every month, among the wettest cities in the territory: more than 2,300 mm a year, and nearly 3,000 mm around the Turakkai docks.\nThe port of Vallikkai commands the east–west sea lane and is the territory's international transhipment hub. The Turakkai Container Terminal in Turakkai District runs along the breakwater, where big ocean-going container ships transfer their boxes to feeder ships, and it handles the most transhipment in the territory; the logistics park, cold stores and food factories of Eruttam District distribute goods to the whole island; and the coast of Saluvai District outside the city is given over to fish, shrimp and seaweed farms and salt pans. Ports and shipping, logistics and warehousing, mariculture and food and seafood processing are the city's main trades, and output per head is about US$65,000. The old town, Kannarur District, keeps its arcaded streets and spice warehouses, and Kalandur District is home to the families of port and logistics workers and to the Vallikkai Nautical College. About half the city's people are incomers, and old-town residents mostly speak the southern dialect of Ivuran.\nThe Everlong Summer Vacuum Maglev stops at Vallikkai Station in the old town, running south-west to Sarunnam and north-east up to the capital, Mirelan, and the Vallikkai–Lomiran High-Speed Railway starts here and runs through Undakan to Lomiran. The Imimu Expressway crosses Eruttam, the Selo Expressway sets off from Kannarur through the hills of Undakan down to the south-east coast, and the 40-km Turakkai Port Expressway links the docks straight to the logistics park, so container lorries need not enter the old town. Each of the three metro lines lies within one district: Line 1 calls at Vallikkai Station and the Kannarur Spice Warehouse Museum, Line 2 serves the Turakkai docks and Line 3 runs in Eruttam. The City Diet has 55 seats; the mayor, Shen Jingyi, belongs to the Social Democratic Mutual Aid Labour Party and governs in coalition with the International Communist Party and the Ivuran National Renewal Party.\nThe arcades of the old town were built for the rain: the covered walkways run unbroken along the streets, so however hard it pours, people can shop, drink tea and stroll without an umbrella, and locals say \"a Vallikkai man goes his whole life without getting wet\". Tea stalls under the arcades stay open from early morning until late at night, famous for spiced milk tea made with cardamom and cinnamon that were once stored in the spice warehouses nearby, now the Kannarur Spice Warehouse Museum. The Turakkai Container Terminal never stops, and its crane drivers are called \"the people in the clouds\": they eat lunch in cabs dozens of metres up, hauling their lunch boxes up on ropes. Seaweed farmers on Saluvai Bay row out at dawn to gather seaweed, which is dried and made into a salty, savoury seaweed cake, the provision every Vallikkai traveller takes on a long journey; the sea salt of Serinu Island carries a hint of seaweed, and cooks call it \"the salt that talks\"."
