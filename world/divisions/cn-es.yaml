  notes:
    zh: 萨伦纳姆人口最多的区，以住宅和教育为主，区名意为「青年之地」。长夏群岛大学的主校区在这里，以热带农业、海洋科学和伊武兰语研究见长；成片的公共租赁住房由领地统一建设，租金按收入定，配有学校、诊所和社区食堂。区内年轻人多，咖啡馆和书店沿林荫大道一字排开。
    en: Sarunnam's most populous district, mostly homes and schools; its name means 'place of the young'. The main campus of the University of the Everlong Summer Islands is here, known for tropical agriculture, marine science and Ivuran studies, and estates of public rental housing built by the territory charge rents set by income, with their own schools, clinics and community canteens. Young people are many, and cafés and bookshops line its tree-shaded boulevards.
  codes:
    admin: '930205'
  population: 650000
