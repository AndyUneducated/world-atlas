    en: Vahira Islands Administration Zone
    art-x-ivuran: Vahira
  notes:
    zh: 基鲁迈群岛以东外海的三座岛屿，名字意为「远方的岩石」，离最近的有人岛也有 200 多公里，整片是海军基地，常住的是约 1.2 万名官兵和技术人员。基地有无人舰艇和水下无人航行器的自动化船坞、山体内的潜艇洞库、地下指挥中心和电磁弹射跑道的岛屿机场，未经许可不得靠近。
    en: Three islands far out at sea east of the Kirumai Islands; the name means 'distant rocks'. They lie more than 200 km from the nearest inhabited island and are a naval base in their entirety, home to about 12,000 service members and technicians. The base has automated docks for uncrewed surface and underwater vessels, submarine pens inside the mountain, an underground command centre and an island airfield with electromagnetic catapults; no one may approach without permission.
  codes:
