  flag_notes:
    zh: "深绿底正中一枚金色圆印，印环上用伊武兰语和英语写着城名，印心是一枝挂着果串的胡椒藤。城名意为「胡椒之城」，古王国时代起香料就从这里的港口运往远方，这枚印原是香料行会盖在出口货包上的封印；深绿是山坡上的香料园。"
    en: "A gold round seal on deep green, its ring bearing the city's name in Ivuran and English and its centre a pepper vine hung with berries. The name means 'pepper city', and spices have left its harbour since the old kingdom; the seal was once the spice guild's stamp on export bales, and the green is the spice gardens on the hills."
