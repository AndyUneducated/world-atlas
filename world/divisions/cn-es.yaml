  parent: div_xp7ha2
  status: generated
  names:
    zh: 卡朗加区
    en: Karanga District
    art-x-ivuran: Karanga
  notes:
    zh: "卡朗加区是基鲁迈岛的乡村和传统村落，区名在伊武兰语里意为「珊瑚」，面积约 1.1 万平方公里，人口 6 万。村落沿海湾分布，居民划独木舟出海捕鱼，村里的长屋是全村议事和节庆的地方，岛议会的议员也由各村长屋的村民大会推举；岛中部的丘陵上是椰林和小块稻田。渔业、种植业和旅游是主要行业，第一产业占三成以上。区里雨水比北部多，一年降水两千六百多毫米，老年人比例在联合邦偏高。\n卡朗加空军基地在区里，是空军在长夏群岛的主基地，有两条平行跑道和一排加固机库，与瓦希拉群岛的海军岛屿机场互为备降场，官兵家属住在卡朗加城区。基鲁迈群岛高速从迈萨里区南下经过区里，再以约 43 公里长的卡朗加特大桥跨海到蒂卢迈岛；卡朗加空军基地公路从高速通往基地。鱼骨大道、托武大道和瓦利凯大道是村镇的主要街道。\n岛民把环岛公路叫作「珍珠线」，骑车绕岛一圈要两三天，沿途每个村口都有卖嫩椰子的小摊，砍开就喝，椰壳顺手还给摊主当柴烧。跨海大桥两侧是深浅不一的蓝色礁湖，晴天能看到海龟在桥下游过，桥上禁止停车，许多人只好放慢车速看一眼。长屋里的节庆一开就是一整夜，木鼓声能传到对面的海湾。"
    en: "Karanga District is the countryside and traditional village country of Kirumai Island; its name means 'coral' in Ivuran. It covers about 11,000 km² and has 60,000 people. Villages line the bays, people fish from dugout canoes, and each village longhouse is where the whole village meets and celebrates, its assembly also choosing the members of the island council; coconut groves and small rice fields cover the hills of the island's interior. Fishing, plantations and tourism are the main trades, and farming and fishing make up more than three-tenths of the economy. The district is wetter than the north, with more than 2,600 mm of rain a year, and the share of older people is high for the commonwealth.\nThe Karanga Air Base is in the district, the air force's main base in the Everlong Summer Islands, with two parallel runways and a row of hardened hangars; it serves as the alternate for the navy's island airfield in the Vahira Islands, and servicemen's families live in the town of Karanga. The Kirumai Islands Expressway comes south from Maisari through the district and crosses the sea to Tilumai on the Karanga Sea Bridge, about 43 km long, and the Karanga Air Base Road leads from the expressway to the base. Fishbone Avenue, Tovu Avenue and Vallikkai Avenue are the main streets of the villages and towns.\nIslanders call the round-island road \"the pearl line\"; cycling round the island takes two or three days, and at every village entrance there is a stall selling young coconuts, cut open to drink on the spot, the husks handed back to the stallholder for firewood. On either side of the sea bridge lie lagoons in every shade of blue, and on sunny days turtles can be seen swimming beneath; stopping on the bridge is forbidden, so many drivers simply slow down for a look. A longhouse festival lasts all night, and the wooden drums can be heard across the bay."
