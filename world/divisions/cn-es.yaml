  names:
    zh: 阿兰塔区
    en: Aranta District
    art-x-ivuran: Aranta
  notes:
    zh: "阿兰塔区是萨伦纳姆的中央商务区，区名在伊武兰语里意为「高处」，面积约 130 平方公里，人口 40 万。摩天楼沿规划大道排开，领地的银行、证券交易所、数字服务公司和跨国企业的地区总部都在这里，金融、软件与数字服务和商贸撑起全领地最高的人均产值之一，约 10.6 万美元。天际线最高处是约 960 米的萨伦纳姆塔，世界最高的建筑，楼内是银行、数字服务公司的办公室和酒店，塔身每隔几十层有一处空中花园，外墙的遮阳鳍片挡住热带的阳光，顶部观景台能望见整个三角洲。\n高楼之间有遮阳的空中连廊和大片的雨林式屋顶花园。白天在这里工作的人大多是移民，英语是区里最常听到的语言，伊武兰语母语者只有约四分之一，劳动年龄人口占七成以上。地铁 1 号线从画廊路站经凤凰木大道站、繁荣大道站、音乐厅路站和维拉大道站到广场街站，整条线都在区内；萨伦纳姆环城高速从区边经过。团结大道、南京大道、博爱大道和友谊大道是区里的主要街道。\n入夜后河滨的夜市和屋顶餐厅热闹到很晚，刚下班的交易员和程序员穿着衬衫坐在塑料凳上吃烤沙爹。满月的「灯与月」之夜，萨伦纳姆塔和区里的其他摩天楼一起调暗灯光，观景台上挤满了人，从这里能看到旧王城和寺庙群里成千上万盏油灯。"
    en: "Aranta District is the central business district of Sarunnam; its name means 'the heights' in Ivuran. It covers about 130 km² and has 400,000 people. Skyscrapers line its planned avenues, home to the territory's banks, its stock exchange, its digital service companies and the regional headquarters of multinationals, and finance, software, digital services and trade give it one of the highest outputs per head in the territory, about US$106,000. The top of the skyline is Sarunnam Tower, about 960 m, the tallest building in the world, holding bank and digital-company offices and a hotel; every few dozen floors there is a sky garden, sun fins on the facade keep off the tropical sun, and the observation deck at the top looks out over the whole delta.\nShaded sky bridges link the towers, and broad rainforest-style roof gardens cover them. Most of the people who work here by day are incomers, English is the language heard most in the district, native Ivuran speakers are only about a quarter, and more than seven in ten residents are of working age. Metro Line 1 runs entirely within the district, from Gallery Road through Flame Tree Avenue, Prosperity Avenue, Concert Hall Road and Vila Avenue to Square Street, and the Sarunnam Ring Expressway skirts it. Unity Avenue, Nanjing Avenue, Fraternity Avenue and Friendship Avenue are the main streets.\nAfter dark the riverside night market and the rooftop restaurants stay busy until late, with traders and programmers fresh from the office sitting on plastic stools in their shirtsleeves eating grilled satay. On the full-moon night of \"lamps and moon\", Sarunnam Tower and the other towers of the district dim their lights together and the observation deck is packed, for from up here you can see the thousands upon thousands of oil lamps in the royal city and the temples."
