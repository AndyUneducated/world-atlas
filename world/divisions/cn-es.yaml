    en: Orovu Island in the middle of the group; its name means 'old home', and in Ivuran legend it is where the ancestors first came ashore. Its villages keep the old ways most completely, longhouses, boathouses and ceremonial grounds laid out in the ancient pattern, and visitors may enter a village only with its leave.
