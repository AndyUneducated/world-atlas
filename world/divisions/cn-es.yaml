    en: The coast and hills at the commune's north-eastern end; its name means 'sand by the sea'. The commune's convalescent homes and holiday villages stand along its long white beaches, where every resident may stay free on paid holidays, and the hills are the commune's forest and watershed reserves. Visitors from outside pay the commune to stay, and the income is shared by all.
