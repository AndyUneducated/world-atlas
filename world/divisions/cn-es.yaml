- id: div_rmy0kf
  subtype: borough
  parent: div_24d8z4
  status: generated
  names:
    zh: 萨基拉区
    en: Sakila District
    art-x-ivuran: Sakila
  notes:
    zh: "萨基拉区是基拉努特别自治市的市中心，区名意为「光的中心」，面积 220 平方公里，人口 40 万，每平方公里一千八百多人，是全市人口最密的区。塔楼和商场沿海滨大道排开，科技公司的总部、风险投资机构和软件企业集中在这里，商贸、信息技术和金融是全区的支柱，人均产值超过 10 万美元。依照《基拉努特别自治市宪章》，市里自定企业税和研发抵免，在领地的移民配额内自行审批工程师的居留许可，许多新来的工程师第一站就落脚在萨基拉。居民以劳动年龄的年轻人为主，老人不到一成，讲中文和英文的各占三成多，伊武兰语母语者不到三成。马伊大道、赫瓦鲁岬大道、乌诺图马峰大道和议会路是区里的主干道。基拉努特别自治站是长夏真空磁悬浮的车站，列车以时速 800 公里向西南开往首府米雷兰，向东北开往塔卢马兰；基拉努地铁1号线全长约 3 公里，石楠、白桦、乌诺图马峰大道和云杉四站都在区内。塞洛高速从区边经过，萨基拉—努维拉公路约 23 公里，通往半导体产业园。\n傍晚海滨的石英砂滩上挤满散步的人，砂子白得晃眼，赤脚踩上去会发出轻轻的吱吱声，孩子们管它叫「会唱歌的沙」。夜市一直开到深夜，刚开完会的创业者和游客挤在同一张塑料桌旁吃椰子冰和烤鱼，邻桌常常在用三种语言讨论同一个点子。海滩边的排球场灯火通明，本地人说，在萨基拉，生意经常是在排球网两边谈成的。"
    en: "Sakila District is the centre of the Special Autonomous City of Kilanu; its name means 'heart of light', and it covers 220 km² with 400,000 people, more than 1,800 to the square kilometre, the most densely settled district in the city. Towers and malls line the seafront avenue, home to technology headquarters, venture funds and software firms; commerce, information technology and finance are the mainstays, and output per head is over 100,000 US dollars. Under the Charter of the Special Autonomous City of Kilanu, the city sets its own business taxes and research credits and approves engineers' residence permits itself within the territory's immigration quota, and many newly arrived engineers find their first home in Sakila. Residents are mostly young people of working age, with fewer than one in ten older people; Chinese and English speakers each make up over a third, and native Ivuran speakers under three in ten. Mai Avenue, Cape Hevaru Avenue, Mount Unotuma Avenue and Parliament Road are the main roads. Special Autonomous City of Kilanu Station is a stop on the Everlong Summer Vacuum Maglev, whose trains run at 800 km/h south-west to the capital, Mirelan, and north-east to Talumaran; Kilanu Metro Line 1, about 3 km long, has all four of its stations, Heather, Birch, Mount Unotuma Avenue and Spruce, in the district. The Selo Expressway passes its edge, and the Sakila–Nuvila Road, about 23 km long, leads to the semiconductor park.\nIn the evening the quartz beach by the sea is crowded with strollers; the sand is dazzlingly white and squeaks softly underfoot, and children call it 'the singing sand'. The night market stays open late, founders fresh from meetings and tourists squeeze round the same plastic tables over coconut ice and grilled fish, and the next table is often discussing the same idea in three languages. The volleyball courts by the beach are floodlit, and locals say that in Sakila deals are often struck across a volleyball net."
  codes:
    admin: '930501'
  population: 400000
  area_km2: 220.0
  traits: { industries: [commerce, tech, finance] }
- id: div_qr8ay4
  subtype: borough
  parent: div_24d8z4
  status: generated
  names:
    zh: 努维拉区
    en: Nuvila District
    art-x-ivuran: Nuvila
  notes:
    zh: "努维拉区是基拉努的半导体产业园，区名意为「沙中之光」，面积 500 平方公里，人口 35 万。努维拉半导体产业园里，十多座晶圆厂、封装测试厂和光刻胶、特种气体等配套工厂沿规划路网排开，组成领地的半导体产业园；厂房要求极高的洁净度和稳定的电力与用水，园区有自己的变电站和超纯水厂，废水排放由领地实时监测，领地对工业用水和废水排放实行严格监管。芯片从佩萨维区的基拉努国际机场空运到世界各地。工业占全区产值的一半以上，人均产值超过 11 万美元，是全领地最高的区之一。居民以劳动年龄的工程师和技术工人为主，老人不到一成，讲中文的约占四成，讲英文的三成，许多人来自中国其他省份。光明路、学府大街、托马库大道和莲塘路是区里的主干道，萨基拉—努维拉公路约 23 公里，通往市中心萨基拉区；基拉努地铁3号线在区内设花楸、榕树大道、茉莉路、红树路、星图、托马库大道和达尔七站，晶圆厂三班倒，地铁从清晨到深夜都有穿工装的乘客。\n本地人爱开玩笑说，基拉努的沙子一半在海滩上，一半在这里的晶圆里。工程师们下班后最常去海边的排球场和夜市，努维拉区的夜宵摊开到凌晨，最受欢迎的是椰子冰、海鲜炒河粉和一种塞满香料的烤鱼，摊主们早就习惯了客人边吃边讨论电路图，有的摊主还学会了几个行话。厂区换班时，星图站外穿着同样工装的人流一进一出，像潮水换了个方向。"
    en: "Nuvila District is Kilanu's semiconductor park; its name means 'light in the sand', and it covers 500 km² with 350,000 people. In the Nuvila Semiconductor Park more than ten wafer fabs, packaging and test plants and suppliers of photoresists, specialty gases and other materials line the planned streets, together forming the territory's semiconductor industry; the plants need exceptionally clean air and steady power and water, so the park has its own substations and ultrapure water works, its discharges are monitored by the territory in real time, and the territory closely regulates industrial water use and discharges. Chips are flown all over the world from Kilanu International Airport in Pesavi District. Industry produces more than half the district's output, and output per head is over 110,000 US dollars, among the highest of any district in the territory. Residents are mostly engineers and skilled workers of working age, with fewer than one in ten older people; about four in ten speak Chinese and three in ten English, and many come from other provinces of China. Bright Road, College Boulevard, Tomaku Avenue and Lotus Pond Road are the main roads, and the Sakila–Nuvila Road, about 23 km long, leads to Sakila District in the city centre; Kilanu Metro Line 3 has seven stations in the district, Rowan, Banyan Avenue, Jasmine Road, Mangrove Road, Star Chart, Tomaku Avenue and Dahl, and since the fabs run three shifts there are passengers in work clothes on the trains from early morning to late at night.\nLocals like to joke that half of Kilanu's sand is on the beach and the other half is in the wafers here. After work the engineers head most often for the volleyball courts by the sea and the night markets; Nuvila's late-night stalls stay open into the small hours, and the favourites are coconut ice, fried rice noodles with seafood and grilled fish stuffed with spices. The stallholders have long grown used to customers arguing over circuit diagrams as they eat, and some have even picked up a little of the jargon. At shift change, crowds in identical work clothes stream in and out of Star Chart station, as if the tide had simply turned."
  codes:
    admin: '930502'
  population: 350000
  area_km2: 500.0
  traits: { industries: [semiconductor, manufacturing, research] }
- id: div_07wzvt
  subtype: borough
  parent: div_24d8z4
  status: generated
  names:
    zh: 埃莱努区
    en: Elenu District
    art-x-ivuran: Elenu
  notes:
    zh: "埃莱努区是基拉努的大学和住宅区，区名在伊武兰语里意为「学习的岸」，面积约 600 平方公里，人口 33 万。基拉努理工大学在这里，以集成电路、材料和软件见长，与努维拉半导体产业园的企业共建实验室，毕业生多留在基拉努工作。高等教育、社区服务和信息技术是区里的主要行业，人均产值约 8.3 万美元。\n成片的公寓楼住着年轻的工程师家庭，儿童占两成，老人不到一成，平均寿命 85 岁；区内的国际学校用中文、英文和伊武兰语三种语言教学，伊武兰语母语者只有约四分之一。地铁 2 号线全线在区内，从扶桑街站经海豚路站、尼拉普大街站、翁贝尔哈努湖街站和维拉街站到大连站，把大学、住宅街坊和学校串在一起。蝠鲼大街、尼拉普大街、工匠大道和太阳鸟大道是区里的主要街道，街边多是书店、咖啡馆和儿童游乐场。\n理工大学的毕业季有个传统：毕业生在海滩上用白沙堆一块巨大的「芯片」，再在上面用贝壳摆出自己的名字，涨潮时一起看海水把它带走。周末的社区球场上，常能看到工程师父母陪孩子踢球，场边的家长聊的却多半是新一代芯片的良率；放学后的国际学校门口，孩子们三种语言夹着说，一句话里换两次语言也不稀奇。"
    en: "Elenu District is the university and residential district of Kilanu; its name means 'shore of learning' in Ivuran. It covers about 600 km² and has 330,000 people. The Kilanu University of Technology is here, strong in integrated circuits, materials and software; it runs joint laboratories with companies in the Nuvila Semiconductor Park, and most of its graduates stay on to work in Kilanu. Higher education, community services and information technology are the district's main trades, and output per head is about US$83,000.\nLarge blocks of flats house young engineers' families: children make up a fifth of the population, the elderly fewer than one in ten, and life expectancy is 85; the international schools teach in Chinese, English and Ivuran, and native Ivuran speakers are only about a quarter. Metro Line 2 runs entirely within the district, from Hibiscus Street through Dolphin Road, Nilapu Boulevard, Lake Ombelhanu Street and Vila Street to Dalian, threading together the university, the housing and the schools. Manta Boulevard, Nilapu Boulevard, Artisans' Avenue and Sunbird Avenue are the main streets, lined mostly with bookshops, cafés and playgrounds.\nGraduation at the university has a tradition: graduates build a giant \"chip\" of white sand on the beach, spell out their names on it in shells, and watch together as the tide carries it away. At weekends engineer parents play football with their children on the community pitches, while the parents on the touchline talk mostly about the yields of the latest chips; outside the international schools after class, children mix all three languages, and switching language twice in one sentence is nothing unusual."
  codes:
    admin: '930503'
  population: 330000
  area_km2: 600.0
  traits: { industries: [education, residential, tech] }
- id: div_yah63b
  subtype: borough
  parent: div_24d8z4
  status: generated
  names:
    zh: 佩萨维区
    en: Pesavi District
    art-x-ivuran: Pesavi
  notes:
    zh: "佩萨维区是基拉努特别自治市的港口和机场区，区名意为「出发」，面积 900 平方公里，人口 14 万。基拉努国际机场在区内，货运区专门处理芯片等高价值货物，恒温仓库与跑道之间有封闭通道，努维拉半导体产业园出产的芯片从这里空运到世界各地。港区有集装箱码头和化学品码头，化学品码头为晶圆厂运来特种气体和化工原料；依照《基拉努特别自治市宪章》，港口和机场都是保税区，由市里自管。物流园沿塞洛高速排开，基拉努国际机场公路约 4.5 公里，把航站楼和高速公路连在一起。港口航运、航空与机场和物流仓储是全区的主业，人均产值八万多美元。居民里讲中文、英文和伊武兰语的各占三分之一，机场和港口的工人来自领地各地和世界各国。繁荣大街、人民大道、钟楼路和槟榔大道是区里的主干道。这里是热带季风气候，一年降水约 2400 毫米，雨季的午后雷雨常让航班稍稍推迟。\n机场航站楼的地面铺着基拉努本地的白色石英砂磨成的水磨石，旅客走在上面常低头看，本地人说「基拉努的沙子从机场就开始唱歌了」。货运区的装卸工最熟悉芯片的「脾气」：怕热、怕潮、怕颠，一箱芯片从恒温仓库到飞机腹舱，全程不离开封闭通道，工人们开玩笑说，这些芯片「比头等舱的旅客还娇贵」。夜里港区和机场的灯光连成一片，物流园旁的大排档开到凌晨，卡车司机和下了夜班的地勤人员围坐着吃海鲜炒河粉。"
    en: "Pesavi District is the port and airport district of the Special Autonomous City of Kilanu; its name means 'setting out', and it covers 900 km² with 140,000 people. Kilanu International Airport is here: its cargo terminal specialises in chips and other high-value freight, with an enclosed passage between the climate-controlled warehouses and the runway, and the chips made in the Nuvila Semiconductor Park are flown from here all over the world. The port has container and chemical terminals, the chemical terminal bringing in specialty gases and chemicals for the wafer fabs; under the Charter of the Special Autonomous City of Kilanu, both port and airport are bonded zones, run by the city itself. Logistics parks line the Selo Expressway, and the Kilanu International Airport Road, about 4.5 km long, joins the terminal to the expressway. Shipping, aviation and the airport, and warehousing are the district's main work, and output per head is over 80,000 US dollars. Residents are split in thirds between Chinese, English and Ivuran speakers, and the airport and port workers come from all over the territory and the world. Prosperity Boulevard, People's Avenue, Clock Tower Road and Areca Avenue are the main roads. The climate is tropical monsoon, with about 2,400 mm of rain a year, and wet-season afternoon thunderstorms often hold flights up a little.\nThe floors of the airport terminal are terrazzo made from Kilanu's own white quartz sand, and passengers often look down as they walk; locals say 'Kilanu's sand starts singing at the airport.' The cargo handlers know the chips' temperament best: they dislike heat, damp and jolts, so a crate travels from the climate-controlled warehouse to the aircraft's hold without ever leaving the enclosed passage, and the workers joke that these chips are 'fussier than first-class passengers'. At night the lights of port and airport merge into one, and the food stalls beside the logistics parks stay open till the small hours, lorry drivers and ground crew off the night shift gathered round plates of seafood fried rice noodles."
  codes:
    admin: '930504'
  population: 140000
  area_km2: 900.0
  traits: { industries: [port, aviation, logistics] }
- id: div_daamp6
  subtype: borough
  parent: div_24d8z4
  status: generated
  names:
    zh: 乌拉帕区
    en: Urapa District
    art-x-ivuran: Urapa
  notes:
    zh: "乌拉帕区是基拉努背后的丘陵和山地，区名在伊武兰语里意为「高地」，面积 5.8 万平方公里，只有 8 万人，是全市面积最大、人口最少的区。区域一直延伸到哈努帕拉高原的东南缘，最高处海拔 1156 米；基拉西鲁河从高原东南缘跌落，流过区里的果园和山村，在基拉湾入海，东部的托武西鲁河河口两侧的沙滩是海龟产卵地。海岸上还有洁白石英砂滩环绕的基拉湾和伸出约 12 公里的蒂克瓦岬。\n山坡上种可可和热带水果，河谷里有小水电站和村庄，村庄建在高出洪水线的台地上；种植业、热带水果和林业木材加工是主要行业，第一产业占四成以上。居民八成以上是讲伊武兰语的本地人，梯田农民党在区里得票最多。伊米穆高速从区里穿过，向西南翻上高原通往首府；磨坊大街、木棉路和渔市大道是集镇的主要街道。\n半导体产业园的工程师和基拉西鲁河上游的果农每季开一次「水的会」，商量用水和护林，散会时果农总会送一筐刚摘的山竹，工程师们说这是全年最受欢迎的会议。海龟上岸产卵的夜里，托武西鲁河口的村庄会熄掉海边的灯，大人们说这是在「给海龟让路」。情侣们喜欢在蒂克瓦岬顶等灯塔亮起，本地人笑称它是全城唯一一颗「准时出现的星」。"
    en: "Urapa District is the hill and mountain country behind Kilanu; its name means 'highlands' in Ivuran. It covers 58,000 km² and has only 80,000 people, the largest and least populous district in the city. It stretches up to the south-eastern edge of the Hanupala Plateau, reaching 1,156 m; the Kilasiru River drops from the plateau's edge and flows through the district's orchards and hill villages to Kila Bay, and in the east the beaches either side of the mouth of the Tovusiru River are nesting grounds for sea turtles. On the coast lie Kila Bay, ringed with white quartz beaches, and Cape Tikeva, reaching about 12 km out to sea.\nCocoa and tropical fruit grow on the slopes, and the valleys have small hydroelectric stations and villages built on terraces above the flood line; plantations, tropical fruit and forestry and timber are the main trades, and farming makes up more than four-tenths of the economy. More than eight in ten residents are Ivuran-speaking islanders, and the Terrace Farmers' Party wins the most votes here. The Imimu Expressway crosses the district, climbing south-west onto the plateau towards the capital; Mill Boulevard, Kapok Road and Fish Market Avenue are the main streets of the market towns.\nEngineers from the semiconductor park and fruit growers from the upper Kilasiru hold a \"water meeting\" every season to agree on water use and forest care, and at the end the growers always hand over a basket of freshly picked mangosteens, which the engineers say makes it the most popular meeting of the year. On nights when the turtles come ashore to lay, the villages at the mouth of the Tovusiru put out their seafront lights, \"making way for the turtles\", as the grown-ups say. Couples like to wait on the top of Cape Tikeva for the lighthouse to come on, and locals joke that it is the only star in town that always turns up on time."
  codes:
    admin: '930505'
  population: 80000
  area_km2: 57780.0
  traits: { industries: [agriculture, fruit, forestry], heritage: ivuran }

