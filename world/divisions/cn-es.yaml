  flag_notes:
    zh: "上翠绿、下墨绿，中间一道金色细条，正中白色圆徽里是一只绿色犀鸟。城名意为「森林之地」，两种绿色是领地最大热带雨林的树冠和林下，犀鸟在几十米高的树冠间筑巢，是雨林健康的标志，也是塔卡维树冠步道上游客最想看到的鸟。"
    en: "Emerald over dark green, parted by a gold stripe, with a green hornbill on a white disc. The name means 'land of forest': the two greens are the canopy and understorey of the territory's largest rainforest, and the hornbill, nesting tens of metres up, is the sign of a healthy forest and the bird every visitor on the canopy walk hopes to see."
