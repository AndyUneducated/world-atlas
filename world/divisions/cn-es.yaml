- id: div_3ytmrh
  subtype: borough
  parent: div_11j4xw
  status: generated
  names:
    zh: 坎纳鲁尔区
    en: Kannarur District
    art-x-ivuran: Kannarur
  notes:
    zh: "坎纳鲁尔区是瓦利凯的老城，区名在伊武兰语里意为「眼前的村」，面积约 200 平方公里，人口 30 万，是全市人口最多的区。骑楼街沿老港排开，沿街的廊道连成一片，香料仓库和老商行改作了餐馆和博物馆，老港边的石砌香料仓库如今是坎纳鲁尔香料仓库博物馆，展出古王国以来的香料贸易、帆船模型和老商行的账簿。商贸、文化遗产和旅游是区里的主要行业，第三产业占近九成。\n老城居民多讲伊武兰语南部方言，伊武兰语母语者约占一半。瓦利凯站在区里，长夏真空磁悬浮和瓦洛高速铁路在这里停靠；地铁 1 号线从坎纳鲁尔香料仓库博物馆站经瓦利凯站、海豹站和索里努岬路站到青岛站。塞洛高速从这里出发，坎纳鲁尔—卡兰杜尔公路和坎纳鲁尔—萨卢瓦伊公路通往邻区；翠鸟大街、纳卢迈大街、索里努路和基拉大街是主要街道。\n清晨的鱼市和傍晚的海滨夜市是老城最热闹的时候。骑楼下的茶摊从清晨开到深夜，香料奶茶是招牌，下再大的雨也不用打伞，本地人说「瓦利凯人一辈子淋不着雨」。博物馆的茶室用老配方煮香料奶茶，仓库里至今飘着胡椒和肉桂的气味；馆里有一面「闻香墙」，几十个小抽屉里装着不同的香料，游客拉开抽屉闻一闻，猜它的名字。"
    en: "Kannarur District is the old town of Vallikkai; its name means 'the village before your eyes' in Ivuran. It covers about 200 km² and has 300,000 people, the most of any district in the city. Arcaded streets line the old harbour, their covered walkways joined end to end, and the spice warehouses and old trading houses have become restaurants and museums; the stone spice warehouse by the harbour is now the Kannarur Spice Warehouse Museum, which shows the spice trade since the days of the old kingdom, model sailing ships and the ledgers of the old trading houses. Trade, heritage and tourism are the district's main trades, and services make up nearly nine-tenths of the economy.\nOld-town residents mostly speak the southern dialect of Ivuran, and native speakers are about half the population. Vallikkai Station is here, served by the Everlong Summer Vacuum Maglev and the Vallikkai–Lomiran High-Speed Railway; Metro Line 1 runs from Kannarur Spice Warehouse Museum through Vallikkai Station, Seal and Cape Sorinu Road to Qingdao. The Selo Expressway starts here, and the Kannarur–Kalandur Road and the Kannarur–Saluvai Road lead to the neighbouring districts; Kingfisher Boulevard, Nalumai Boulevard, Sorinu Road and Kila Boulevard are the main streets.\nThe old town is at its busiest at the early-morning fish market and the evening seafront night market. Tea stalls under the arcades stay open from dawn until late at night, famous for their spiced milk tea, and however hard it rains no one needs an umbrella; locals say \"a Vallikkai man goes his whole life without getting wet\". The museum's tea room brews spiced milk tea to the old recipe, and the smell of pepper and cinnamon still hangs in the warehouse; one wall is a \"scent wall\" of dozens of little drawers filled with different spices, and visitors pull them open, sniff, and guess the name."
