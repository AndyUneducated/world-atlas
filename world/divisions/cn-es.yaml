- id: div_h88tgx
  subtype: borough
  parent: div_6kjc7x
  status: generated
  names:
    zh: 塔尼武区
    en: Tanivu District
    art-x-ivuran: Tanivu
  notes:
    zh: "塔尼武区是埃武托拉公社的农业和渔业区，区名在伊武兰语里意为「田间的家」，面积约 9000 平方公里，人口 13 万。区内从海岸平原向内陆丘陵抬升，最高处海拔 1477 米，是公社的最高点，雨水也比城区多得多。土地归公社所有，农业合作社种植稻米、蔬菜和热带水果，渔业合作社的船队在近海捕鱼，收获直接送往各区的公共食堂和配给站，埃武托拉公社大食堂的食材大多来自这里；第一产业占近四成。\n村庄保留了伊武兰人的高脚木屋，每个村都有自己的食堂和议事棚，村里的大事在棚下讨论，再交公社人民代表大会。居民四分之三以上是伊武兰语母语者，老年人比例在公社最高。伊米穆高速从区里穿过，到哈马图区收尾，合作社的冷藏车沿高速把清晨的鱼获送进城里；基鲁迈岛大道、塞洛大道和面包房大道是集镇的主要街道。\n渔船天不亮出海，近午回港时，合作社的记分员已经在码头等着，按船按网记下劳动贡献积分。收稻的季节，城里的居民常利用每周的第五天来田里帮忙，中午大家坐在议事棚下吃一锅椰浆焖鱼配新米，孩子们在田埂上追着白鹭跑。雨季的第一场大雨落下时，村里的木鼓一响，全村老少都跑到雨里迎接「开门雨」。"
    en: "Tanivu District is the farming and fishing district of Evutola Commune; its name means 'home among the fields' in Ivuran. It covers about 9,000 km² and has 130,000 people. The land rises from the coastal plain to inland hills, reaching 1,477 m, the commune's highest point, and it gets far more rain than the town. The land belongs to the commune: farming co-operatives grow rice, vegetables and tropical fruit, fishing co-operatives' boats work the inshore waters, and the harvest goes straight to the public canteens and distribution points of every district, supplying most of the food for the Evutola Commune Canteen; farming and fishing make up nearly four-tenths of the economy.\nThe villages keep the Ivuran stilt houses, and each has its own canteen and a meeting shelter where village matters are discussed before going to the Commune People's Congress. More than three-quarters of the residents are native Ivuran speakers, and the share of older people is the highest in the commune. The Imimu Expressway crosses the district on its way to its end in Hamatu, and the co-operatives' refrigerated lorries carry the morning catch along it into town; Kirumai Island Avenue, Selo Avenue and Bakehouse Avenue are the main streets of the market towns.\nThe boats put out before dawn, and when they come in near midday the co-operative's tally clerk is already waiting on the quay to record each boat's and each net's labour contribution credits. At harvest time townspeople often spend their weekly fifth day helping in the fields, and at noon everyone sits under the meeting shelter over a pot of coconut-braised fish with new rice while children chase egrets along the paddy banks. When the first heavy rain of the wet season falls, the village drums sound and young and old alike run out into the downpour to welcome \"the door-opening rain\"."
