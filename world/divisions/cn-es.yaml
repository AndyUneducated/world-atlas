  notes:
    zh: 群岛最南端的马拉坎岛和周围的珊瑚礁，名字意为「花园之海」，整片划为保护区，常住人口约 8000 人。礁盘上栖息着海龟、蝠鲼和上千种珊瑚鱼，海洋研究站监测珊瑚的健康；保护区只允许有许可的小船进入，禁止捕捞。
    en: Malakan Island at the southern end of the group and the reefs around it; its name means 'garden of the sea'. All of it is a reserve, with about 8,000 residents. Sea turtles, manta rays and a thousand kinds of reef fish live on the reefs, and a marine research station watches the health of the coral; only licensed small boats may enter, and fishing is forbidden.
