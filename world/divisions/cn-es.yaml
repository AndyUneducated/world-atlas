    en: The commune's industrial district; its name means 'the makers'. Collective factories and cooperatives build electric cars, appliances, farm machinery and building parts here, first for residents to take as they need, the rest for sale outside. The factories work a four-day week, committees elected by the workers run production, and labour credits are reckoned by post and hours.
