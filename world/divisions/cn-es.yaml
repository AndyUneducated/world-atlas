  flag_notes:
    zh: "长夏新城旗：海军蓝底，左上角是领地旗上的朝阳，右侧三道白色波浪。领地设立后靠港口和工业兴起的城市都用这一格式。塔卢马兰意为「停泊之地」，三道波浪是自古给船只避风的塔卢马兰湾，也是船厂、深水码头和电池厂这三条产业带。"
    en: "A southern new-town flag: navy blue with the rising sun of the territory flag in the canton and three white waves in the fly. The cities that grew on ports and industry after the territory was created fly this pattern. Talumaran means 'place of anchoring': the waves are the sheltered bay where ships have always ridden out storms, and its three industrial belts of shipyards, deep-water quays and battery works."
