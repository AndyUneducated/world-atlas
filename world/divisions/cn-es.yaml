- id: div_nwm019
  subtype: dependency
  parent: country:CN
  status: generated
  names:
    zh: 长夏群岛领地
    en: Everlong Summer Islands Territory
    art-x-ivuran: Imimu Selovaru
  notes:
    zh: "长夏群岛领地在北纬 2° 到 12° 之间的热带海洋上，由一座东北—西南走向、长约 2400 公里的主岛和西南端外六座岛屿组成的基鲁迈群岛构成，陆地面积约 90 万平方公里，连同领海约 130 万平方公里，人口 1200 万。热带季风气候，雨季和旱季分明，几乎没有台风和地震。主岛中脊是古老的蒂拉凯苏山脉，山坡上是成片的水稻梯田；中部高原上的翁贝尔哈努湖畔是新建的首府米雷兰，西南端哈努西鲁河三角洲上的萨伦纳姆是最大城市和古王国的旧都。伊武兰语母语者约占一半，其余是来自中国其他省份和世界各地的移民，大城市移民多、小城镇本地人多，中文、英文和伊武兰语都是官方语言。农业、工业和服务业三者均衡：梯田稻米、香料、可可和热带水果，半导体、造船、生物医药和从镍矿到电池与新能源车的产业链，以及旅游、港口转运和热带医学研究。领地实行高税收、高福利、高监管，教育免费到大学，全民医保和全民基本收入覆盖每个居民，土地公有、长期租用；东北海岸的埃武托拉公社自定税率，住房、交通、医疗、食堂和汽车全部免费。东南海岸的科技城市基拉努是特别自治市，依自己的宪章自定企业税，自管港口和机场；西南端外的基鲁迈群岛是六座岛结成的联合邦，各岛有自己的岛议会，领地的渔业和旅游法规要经联合邦议会表决，才在群岛生效。\n领地格言「长夏不尽，人人有家」出自一句伊武兰语老话：「Selo imimu, tola evu」，直译是「夏天长久，家是大家的」，埃武托拉公社的名字「大家的家」也来自这句话。这里一年只分雨季和旱季，雨季的第一场大雨被叫作「开门雨」，各地村镇敲响木鼓迎雨，孩子们冲进雨里奔跑，这一天在伊武兰语里叫「Uvesa Tomaku」，意思是「雨鼓日」。饮食是这个移民社会的缩影：梯田红米配椰浆、香料炖鱼、辣椒虾酱、路边的榴莲和山竹，加上从中国各省和世界各地带来的家乡菜，高原上的米雷兰还以咖啡出名。公告、路牌和药品说明书都印着中文、英文和伊武兰语三种文字，菜单也常常是三语的，同一道菜在三种语言里往往有三个不同的名字。"
    en: "The Everlong Summer Islands Territory lies in tropical seas between 2° and 12° north: a main island some 2,400 km long, running from north-east to south-west, and the six Kirumai Islands off its south-western end, about 900,000 km² of land and some 1.3 million km² with its territorial waters, home to 12 million people. The climate is tropical monsoon, with a clear wet season and dry season and almost no typhoons or earthquakes. The ancient Tirakesu Mountains form the spine of the main island, their slopes stepped with rice terraces; the new capital, Mirelan, stands by Lake Ombelhanu on the central plateau, and Sarunnam, on the delta of the Hanusiru River at the south-western end, is the largest city and the old seat of the island's kingdom. About half the people are native Ivuran speakers and the rest are incomers from other provinces of China and from all over the world, more of them in the big cities and fewer in the small towns; Chinese, English and Ivuran are all official languages. Farming, industry and services are evenly balanced: terrace rice, spices, cocoa and tropical fruit; semiconductors, shipbuilding, medicines and a chain from nickel mines to batteries and electric cars; and tourism, transhipment and tropical medicine. The territory taxes highly, provides generously and regulates closely: education is free through university, public health insurance and a universal basic income cover every resident, and land is publicly owned and held on long leases. Evutola Commune on the north-east coast sets its own taxes and gives its people housing, transport, health care, meals and even cars for free. Kilanu, the technology city on the south-east coast, is a special autonomous city with its own charter, setting its own business taxes and running its own port and airport; the Kirumai Islands off the south-western end are a commonwealth of six islands, each with its own island council, and the territory's fishing and tourism laws take effect there only once the Commonwealth Assembly has voted them in.\nThe territory's motto, \"Endless Summer, a Home for All\", comes from an old Ivuran saying, \"Selo imimu, tola evu\", literally \"summer is long, and home belongs to everyone\"; Evutola Commune takes its name, \"everyone's home\", from the same words. The year has only a wet season and a dry season, and the first heavy rain of the wet season is called \"the door-opening rain\": villages and towns beat wooden drums to welcome it and children run out into the downpour, and the day is known in Ivuran as \"Uvesa Tomaku\", the day of the rain drums. Food mirrors a society of incomers: terrace red rice with coconut milk, spiced fish stews, chilli shrimp paste, durians and mangosteens at the roadside, and home dishes brought from other provinces of China and from all over the world, while Mirelan on its plateau is known for coffee. Notices, road signs and the leaflets in medicine packets are printed in Chinese, English and Ivuran, menus often are too, and the same dish frequently has three quite different names in the three languages."
