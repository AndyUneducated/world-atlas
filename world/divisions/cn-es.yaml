    art-x-ivuran: Talumaran
  notes:
    zh: 东南海岸的港口和工业城市，全市 160 万人，是领地第二大城市。城名意为「停泊之地」，深水良港塔卢马兰湾自古是船只避风的锚地；伦博区的船厂建造集装箱船、液化气船和海上平台，塞拉努区的深水码头是领地最大的集装箱港之一，伊拉坦区的电池厂和新能源车厂用乌诺卡里的镍制造电池和整车。工业带的工人来自领地各地和世界各国，全市移民约占三分之二，劳动年龄人口比例高。
    en: "The port and industrial city of the south-east coast, with 1.6 million people, the second city of the territory. Its name means 'place of moorings': the deep harbour of Talumaran Bay has sheltered ships since early times. The yards of Lumbo District build container ships, gas carriers and offshore platforms, the deep-water quays of Seranu District make one of the territory's largest container ports, and in Ilatan District battery and electric car plants turn nickel from Unokari into batteries and finished cars. The workers of the industrial belt come from all over the territory and the world; about two in three people are incomers, and the share of working age is high."
  codes:
    admin: '930400'
    unlocode: ES TLM
  population: 1600000
  area_km2: 68000.0
  color: '#24527A'
  flag: { layout: sun_canton, colors: ['#24527A'], charge: river, charge_color: '#FFFFFF' }
  flag_notes:
    zh: "长夏新城旗：海军蓝底，左上角是领地旗上的朝阳，右侧三道白色波浪。领地设立后靠港口和工业兴起的城市都用这一格式。塔卢马兰意为「停泊之地」，三道波浪是自古给船只避风的塔卢马兰湾，也是船厂、深水码头和电池厂这三条产业带。"
    en: "A southern new-town flag: navy blue with the rising sun of the territory flag in the canton and three white waves in the fly. The cities that grew on ports and industry after the territory was created fly this pattern. Talumaran means 'place of anchoring': the waves are the sheltered bay where ships have always ridden out storms, and its three industrial belts of shipyards, deep-water quays and battery works."
  traits: { industries: [shipbuilding, port, automotive, battery], heritage: tropic_global, age: young, income: 1.1 }
