  status: generated
  names:
    zh: 蒂拉凯区
    en: Tirakkai District
    art-x-ivuran: Tirakkai
  notes:
    zh: "蒂拉凯区是彭纳拉姆沿海的渔村和海滩，区名意为「浪之岸」，面积 1.5 万平方公里，人口 12 万。蒂拉凯湾面积约 290 平方公里，伊武兰语意为「浪之岸的海湾」，彭纳西鲁河在湾顶入海；旧时胡椒从山里顺河而下，在河口装船，河口的老仓库如今是香料博物馆。渔船清晨出海，午后回港，渔获在码头边直接拍卖；海滩边的家庭旅馆接待来看日落和吃海鲜的游客，椰林后面是小块的稻田和菜园。渔业、旅游度假和海水养殖是全区的生计，约七成八的居民以伊武兰语为母语，老人约占三成。马伦杜尔—蒂拉凯公路约 31 公里，把海边的渔村和彭纳拉姆城区马伦杜尔区连在一起，城里的海鲜摊每天下午从这里进货。乌韦萨大道、胡椒大街、纳卢路和瀑布路是镇上的主要街道。这里是热带雨林气候，一年降水近 2900 毫米，月月有雨，雨后的傍晚最适合看日落。\n家庭旅馆的主人会在日落前半小时敲门提醒客人，大家端着一杯椰子酒坐到沙滩上，太阳落进海里的那一刻，整片海滩会一起鼓掌。午后的码头拍卖是另一场热闹，拍卖人用伊武兰语飞快地报价，外地游客一句也听不懂，却总有人跟着举手，买回一条比自己想象中大得多的鱼，只好请旅馆的厨房帮忙做成一桌海鲜，请整个旅馆的客人一起吃。香料博物馆里陈列着老商人的木秤和账本，馆员说，彭纳拉姆的老房子多半是用这条河运出去的胡椒盖起来的。"
    en: "Tirakkai District is the fishing villages and beaches of Pennaram's coast; its name means 'shore of waves', and it covers 15,000 km² with 120,000 people. Tirakkai Bay, about 290 km², whose Ivuran name means 'bay of the shore of waves', receives the Pennasiru River at its head; in the old days pepper came down the river from the hills to be loaded onto ships at its mouth, and the old warehouse there is now a spice museum. Boats go out at dawn and come home in the afternoon, their catch auctioned on the quay; family guesthouses by the beaches welcome visitors who come for the sunsets and seafood, and small rice fields and vegetable plots lie behind the coconut groves. Fishing, holidaymakers and sea farming are the district's living; about 78 per cent of residents speak Ivuran as their mother tongue, and about three in ten are elderly. The Marandur–Tirakkai Road, about 31 km long, links the coastal villages to Marandur District in the city, and the town's seafood stalls bring in their stock along it every afternoon. Uvesa Avenue, Pepper Boulevard, Nalu Road and Waterfall Road are the main streets in town. The climate is tropical rainforest, with nearly 2,900 mm of rain a year and rain in every month, and the evenings after rain are the best for watching the sunset.\nThe guesthouse owners knock on their guests' doors half an hour before sunset, everyone carries a glass of coconut wine down to the sand, and the moment the sun drops into the sea the whole beach bursts into applause. The afternoon auction on the quay is another spectacle: the auctioneer calls the bids at speed in Ivuran, and visitors who cannot follow a word still sometimes raise a hand and go home with a fish far bigger than they imagined, which the guesthouse kitchen then has to turn into a seafood feast for every guest in the house. The spice museum displays the old merchants' wooden scales and ledgers, and the curator says most of Pennaram's old houses were built with the pepper shipped down this river."
  codes:
    admin: '930703'
  population: 120000
  area_km2: 15000.0
  traits: { industries: [fishing, tourism, aquaculture] }
- id: div_mw1wjx
  subtype: borough
  parent: div_8hy4nc
  status: generated
  names:
    zh: 帕拉武尔区
    en: Palavur District
    art-x-ivuran: Palavur
  notes:
    zh: "帕拉武尔区是彭纳拉姆内陆的高地，区名在伊武兰语里意为「果树之村」，面积约 3.5 万平方公里，只有 8 万人。区域一直延伸到蒂拉凯苏山脉北坡，最高处海拔 2392 米，是全市最高点；海拔 1502 米的彭纳瓦苏山口是翻越山脉通往哈努西鲁河谷的通道。约 250 公里长的凯纳西鲁河从山脉北坡流下，两岸的山坡是胡椒园、咖啡园和可可园，在区北入海。高地比海边凉爽，夜里常降到二十度以下。\n高地上种咖啡和可可，林间散布着小村庄，咖啡合作社的烘焙厂在区中心的集镇上；种植业、香料与可可和林业木材加工是主要行业，第一产业占一半。居民四分之三讲伊武兰语，老年人约占三成，梯田农民党在区里得票最多。帕拉武尔公路从马伦杜尔区的城区翻上高原，经过区里的集镇，再通往埃拉库尔区的香料山地；铁匠路、翠鸟大道和莲塘大道是集镇的主要街道。\n下游的河水在收获季会带着一股淡淡的胡椒香，那是两岸晾晒胡椒的气味顺风飘到了河面上，渔民说这一段的鱼「天生就是调好味的」。旧时的香料商队翻山口时要在山口的小庙里供一撮胡椒，如今徒步者路过小庙，依然会顺手放下一颗胡椒，小庙里一年到头都是胡椒的香味。烘焙厂开炉的早上，整个集镇都飘着咖啡香。"
    en: "Palavur District is the upland interior of Pennaram; its name means 'village of fruit trees' in Ivuran. It covers about 35,000 km² and has only 80,000 people. It stretches up the northern slopes of the Tirakesu Mountains to 2,392 m, the city's highest point, and the Pennavasu Pass, 1,502 m, is the way over the range to the Hanusiru valley. The Kainasiru River, about 250 km long, flows down from the northern slopes between hillsides of pepper, coffee and cocoa gardens to reach the sea in the north of the district. The uplands are cooler than the coast, and nights often fall below 20 °C.\nCoffee and cocoa grow on the uplands, small villages are scattered through the forest, and the coffee co-operative's roastery stands in the market town at the centre of the district; plantations, spices and cocoa and forestry and timber are the main trades, and farming makes up half the economy. Three-quarters of the residents speak Ivuran, about three in ten are elderly, and the Terrace Farmers' Party wins the most votes here. The Palavur Road climbs from the town in Marandur onto the uplands, passes through the district's market towns and goes on to the spice hills of Elakur; Smithy Road, Kingfisher Avenue and Lotus Pond Avenue are the main streets of the market towns.\nAt harvest the lower river carries a faint scent of pepper, blown onto the water from the pepper drying on both banks, and fishermen say the fish along this stretch \"come ready seasoned\". Spice caravans crossing the pass used to offer a pinch of pepper at the little shrine at the top, and hikers passing it today still drop a peppercorn, so the shrine smells of pepper all year round. On mornings when the roastery fires up, the whole market town smells of coffee."
  codes:
    admin: '930704'
  population: 80000
  area_km2: 34700.0
  traits: { industries: [agriculture, spice, forestry] }

# ── 温达坎市──
- id: div_mzhe0m
  subtype: locality
  parent: div_nwm019
  status: generated
  names:
    zh: 温达坎市
    en: Undakan City
    art-x-ivuran: Undakan
  notes:
    zh: "温达坎市是蒂拉凯苏山脉中段的山城，全市 50 万人，面积 10 万平方公里，在领地各市中面积排第三，城名在伊武兰语里意为「台阶之地」。全市从河谷一直伸到中脊的最高处，乌拉韦劳自然保护区里的乌拉韦劳峰海拔 3179 米，是领地最高峰，东北的蒂拉图马峰海拔 3071 米，是第二高峰，两峰之间海拔 2739 米的乌拉瓦苏山口是领地最高的山口；山腰以上是云雾林，林线以上是高山草甸，云中的翁贝尔韦劳湖是山下梯田泉水的源头之一。东部的佩伦达区一直延伸到南岸，索里努岬是看日出的名胜。城区所在的河谷属热带草原气候，一年降水一千四百毫米左右，山上雨水多得多，也凉爽得多。\n佩伦达区和西林达区的山坡上是层层叠叠的水稻梯田，从河谷一直修到海拔一千多米的山腰，靠山顶森林涵养的泉水灌溉；佩伦达梯田是世界最大的水稻梯田。梯田由村社共同维护，用水规矩代代相传，插秧和收割时节全村一起下田。梯田稻作、旅游、自然保护与巡护和种植业是全市的主要行业，北部托兰卡区的河谷里还有水电站和咖啡园，人均产值约 4.4 万美元。城区坎达瓦区在河谷里，有温达坎梯田博物馆、农业学院和每周的山货集市，来看梯田的游客从这里换乘山区公交上山。全市本地人约占八成，老年人接近三成。\n温达坎是山城，没有地铁。瓦洛高速铁路在坎达瓦区的温达坎站停靠，向西南通瓦利凯，向东北通洛米兰；伊米穆高速经坎达瓦区和托兰卡区翻过山地，塞洛高速穿过佩伦达区下到东南岸，450 多公里的温达坎梯田公路把西林达、坎达瓦和佩伦达三区的梯田串在一起。市议会 49 席，市长伊卢文娜·韦卢卡姆来自伊武兰民族复兴党，与社会民主互助工党、国际共产党和绿脉党联合执政，梯田农民党是第二大党。\n温达坎的梯田靠山顶的森林蓄水，村里的老人常念一句伊武兰语：「Uvesa lomi, olu unda」，意思是「雨落进森林，稻长上台阶」，所以砍山顶的树在这里是最大的忌讳，每个村社都选出专人看护水源林。插秧的日子，全村人在田里排成一行，跟着田埂上木鼓的节拍，一边唱一边后退着插秧，鼓手通常是村里最年长的人，鼓点快了慢了，全村人的手也跟着快慢。梯田里一年只种一季稻，田里同时养着鱼和鸭，收割时捉起的稻田鱼和新米一起装进竹筒烤成竹筒饭，是招待客人的大菜。山脚的村子相信乌拉韦劳峰顶的云是祖先在看护梯田，晴天看见峰顶露出来，就是下田的好日子。"
    en: "Undakan City is the mountain city of the middle Tirakesu Mountains, with 500,000 people over 100,000 km², the third-largest city in the territory by area; its name means 'land of steps' in Ivuran. The city reaches from the valleys to the highest part of the spine: Mount Uravelau in the Uravelau Nature Reserve, 3,179 m, is the territory's highest peak, Mount Tiratuma to its north-east, 3,071 m, is the second highest, and the Uravasu Pass between them, 2,739 m, is the highest pass in the territory; cloud forest covers the slopes above mid-height, alpine meadows lie above the tree line, and Lake Ombelvelau, up in the clouds, is one of the sources of the springs that water the terraces below. Perunda District in the east runs down to the south coast, where Cape Sorinu is a famous place to watch the sunrise. The valley where the town stands has a tropical savanna climate with around 1,400 mm of rain a year, while the mountains are far wetter and far cooler.\nThe slopes of Perunda and Silinda Districts are stepped with rice terraces from the valley floors to more than 1,000 m up, watered by springs fed by the forests on the summits; the Perunda Rice Terraces are the largest rice terraces in the world. The terraces are maintained by the village communities, whose rules for sharing water pass down the generations, and whole villages go into the fields together at planting and harvest. Terrace rice, tourism, nature conservation and patrols and plantations are the city's main trades, and the valleys of Toranka District in the north also have hydroelectric stations and coffee gardens; output per head is about US$44,000. The town, Kandava District, lies in a valley, with the Undakan Terrace Museum, an agricultural college and a weekly hill-produce market, and visitors come here to change onto the mountain buses up to the terraces. About eight in ten residents are islanders, and nearly three in ten are elderly.\nAs a mountain city Undakan has no metro. The Vallikkai–Lomiran High-Speed Railway stops at Undakan Station in Kandava, running south-west to Vallikkai and north-east to Lomiran; the Imimu Expressway crosses the hills through Kandava and Toranka, the Selo Expressway runs through Perunda down to the south-east coast, and the Undakan Terraces Road, more than 450 km long, strings together the terraces of Silinda, Kandava and Perunda. The City Council has 49 seats; the mayor, Iluvenna Velukkam, belongs to the Ivuran National Renewal Party and governs in coalition with the Social Democratic Mutual Aid Labour Party, the International Communist Party and Greenvein, and the Terrace Farmers' Party is the second-largest party.\nUndakan's terraces depend on the forests on the summits to hold water, and village elders often recite an Ivuran saying, \"Uvesa lomi, olu unda\", rain falls into the forest and rice climbs the steps; so felling trees on the summits is the greatest taboo here, and every village chooses people to guard its watershed forest. On planting days the whole village lines up in the paddy and moves backwards as it plants, singing to the beat of a wooden drum on the bank; the drummer is usually the oldest person in the village, and as the beat quickens or slows, so do everyone's hands. The terraces grow one crop of rice a year, with fish and ducks raised in the same fields, and at harvest the paddy fish are packed into bamboo tubes with the new rice and roasted, the great dish for guests. Villages at the foot of the mountain believe the clouds on the summit of Mount Uravelau are their ancestors watching over the terraces, and a clear day when the summit shows is a good day to go into the fields."
  codes:
    admin: '930800'
    unlocode: ES UDK
  population: 500000
  area_km2: 100000.0
  color: '#6A8F2A'
  flag: { layout: ivuran, colors: ['#5E8C31', '#6B4A2B', '#E9B949', '#FFFFFF'], charge: terraces, charge_color: '#5E8C31' }
  flag_notes:
    zh: "上嫩绿、下棕褐，中间一道金色细条，正中白色圆徽里是一座层层叠叠的绿色梯田山。城名意为「台阶之地」，嫩绿是插秧后的水稻梯田，棕褐是梯田的泥土，金条是收割时节的稻穗；山顶旁的圆点是涵养泉水的山顶森林。"
    en: "Fresh green over earth brown, parted by a gold stripe, with a white disc bearing a green mountain of terraces. The name means 'land of steps': the green is the rice terraces after planting, the brown their earth, the gold the ripe rice at harvest; the dot by the summit is the forest that keeps the springs flowing."
  traits: { industries: [rice, tourism, conservation, agriculture], heritage: ivuran, age: old, income: 0.9 }
