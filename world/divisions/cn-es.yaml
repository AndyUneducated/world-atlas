    art-x-ivuran: Sarukkai
  notes:
    zh: "萨鲁凯区是哈努西鲁河口的港区，区名意为「河口之岸」，面积 500 平方公里，人口 30 万。哈努西鲁河是领地最长的河流，从哈努帕拉高原一路流下，在这里入海，河口宽阔，分汊的水道之间是沙洲和红树林。萨伦纳姆港的集装箱码头和散货码头沿河口两岸展开，三角洲的稻米、香料和水产从这里装船出口，进口的机械和原料从这里运往全岛。港区后方是仓库、冷库和食品加工厂，码头工人和船员多住在区北的工人新村。港口航运、物流仓储和制造业是全区的主业，居民中讲中文的约占四成五，讲英文的三成，伊武兰语母语者约占四分之一，是萨伦纳姆移民最集中的区之一。伊米穆高速从基鲁迈岛出发，以约 101 公里的哈努西鲁河口跨海大桥越海，在萨鲁凯区登上主岛，这座桥是世界最长的桥梁。奥鲁卡大道、胡椒大道、自由大街和苏州大街是区里的主干道。这里是热带雨林气候，一年降水约 2900 毫米。\n三角洲的人说哈努西鲁河一路从高原背下来的不是水，是土：「Hanu siru, hanu olu」，意思是「大河大，稻也大」，每年河水带来的淤泥让三角洲的稻田越种越肥，疏浚船也因此在河口一年到头忙个不停。港区的老码头上还保留着一排木制的货仓，满月的「灯与月」之夜，港里的船只也挂起油灯，从河口望去，灯光一直连到旧王城。收工后，码头工人爱去冷库旁的大排档，点一盘刚卸下的虾，就着冰镇的椰子水，看跨海大桥上的车灯一路伸向海上。"
    en: "Sarukkai District is the port district at the mouth of the Hanusiru River; its name means 'shore of the river mouth', and it covers 500 km² with 300,000 people. The Hanusiru, the longest river in the territory, flows all the way down from the Hanupala Plateau to meet the sea here, and its mouth is broad, with sandbars and mangroves between its branching channels. The container and bulk terminals of the Port of Sarunnam spread along both banks of the estuary; rice, spices and seafood from the delta are shipped out from here, and imported machinery and materials go on from here to the whole island. Behind the quays are warehouses, cold stores and food plants, and dockers and seafarers mostly live in the workers' estates to the north. Shipping, warehousing and manufacturing are the district's main work; about 45 per cent of residents speak Chinese, 30 per cent English and about a quarter Ivuran as their mother tongue, making it one of the districts of Sarunnam with the most incomers. The Imimu Expressway sets out from Kirumai Island and crosses the sea on the Hanusiru Mouth Sea Bridge, about 101 km long and the longest bridge in the world, to come ashore on the main island in Sarukkai District. Oruka Avenue, Pepper Avenue, Liberty Boulevard and Suzhou High Street are the main roads. The climate is tropical rainforest, with about 2,900 mm of rain a year.\nPeople in the delta say the Hanusiru carries down from the plateau not water but earth: 'Hanu siru, hanu olu', 'big river, big rice'; the silt it brings each year makes the delta's paddies ever richer, and keeps the dredgers busy at the river mouth all year round. A row of old timber warehouses still stands on the port's old quay, and on the full-moon night of 'Lamps and Moon' the ships in harbour hang out oil lamps too, so that seen from the river mouth the lights run all the way to the old royal city. After work the dockers like the food stalls beside the cold stores, ordering a plate of prawns just unloaded with iced coconut water and watching the headlights on the sea bridge stretch out over the water."
  codes:
    admin: '930204'
  population: 300000
  area_km2: 500.0
  traits: { industries: [port, logistics, manufacturing] }
- id: div_n90922
  subtype: borough
  parent: div_kv6b3e
  status: generated
  names:
    zh: 伊拉瓦姆区
    en: Ilavam District
    art-x-ivuran: Ilavam
  notes:
    zh: "伊拉瓦姆区是萨伦纳姆人口最多的区，以住宅和教育为主，区名在伊武兰语里意为「青年之地」，面积约 400 平方公里，人口 65 万。长夏群岛大学的主校区在这里，是领地规模最大的综合性大学，以热带农业、海洋科学和伊武兰语研究见长，学费全免，校园里的林荫道和图书馆向市民开放。成片的公共租赁住房由领地统一建设，租金按收入定，配有学校、诊所和社区食堂；区里还有不少医疗和疗养机构。\n区内年轻人多，劳动年龄人口占七成，中文是最常用的语言，伊武兰语母语者不到三成，咖啡馆和书店沿林荫大道一字排开。萨伦纳姆站在区里，长夏真空磁悬浮和萨洛真空磁悬浮从这里出发，地铁 3 号线从基拉努特别自治大道站经萨伦纳姆站和长夏群岛大学站到月光站；伊米穆高速和萨伦纳姆环城高速都从区里经过。成都大道、厦门大街、竹林大道和瓦希拉湾大街是区里的主要街道。\n大学的林荫道上种着几百棵来自领地各地的果树，果子成熟时谁都可以摘，学生们说这是「长夏群岛大学的第一门免修课」。伊武兰语系每年在雨季的第一场大雨时敲响木鼓，全校师生跑进雨里过「雨鼓日」，附近公屋的孩子也跟着冲进校园。社区食堂的午饭便宜又丰盛，常有教授和学生、退休老人坐在同一张长桌上吃饭。"
    en: "Ilavam District is the most populous district of Sarunnam, given over mainly to housing and education; its name means 'land of the young' in Ivuran. It covers about 400 km² and has 650,000 people. The main campus of the University of the Everlong Summer Islands, the territory's largest university, is here, strong in tropical agriculture, marine science and Ivuran studies; tuition is free, and the avenues and library of the campus are open to the public. Large estates of public rental housing, built by the territory, charge rents set by income and come with schools, clinics and community canteens, and the district also has a good many hospitals and convalescent homes.\nThe district is young, seven in ten residents are of working age, Chinese is the language most used and native Ivuran speakers are fewer than three in ten; cafés and bookshops line its tree-shaded avenues. Sarunnam Station is here, the starting point of the Everlong Summer Vacuum Maglev and the Sarunnam–Lomiran Vacuum Maglev, and Metro Line 3 runs from Special Autonomous City of Kilanu Avenue through Sarunnam Station and University of the Everlong Summer Islands to Moonlight; the Imimu Expressway and the Sarunnam Ring Expressway both cross the district. Chengdu Avenue, Xiamen Boulevard, Bamboo Avenue and Vahira Bay Boulevard are the main streets.\nHundreds of fruit trees from all over the territory line the university's avenues, and when the fruit ripens anyone may pick it; students call this \"the first course at the university you can't fail\". Every year, at the first heavy rain of the wet season, the Ivuran department beats its wooden drums and the whole university runs out into the downpour for the day of the rain drums, with children from the nearby estates dashing onto the campus to join them. Lunch at the community canteens is cheap and plentiful, and professors, students and pensioners often share the same long table."
  codes:
    admin: '930205'
  population: 650000
  area_km2: 400.0
  traits: { industries: [education, residential, healthcare] }
- id: div_54sm84
  subtype: borough
  parent: div_kv6b3e
  status: generated
  names:
    zh: 门达卢尔区
    en: Mendalur District
    art-x-ivuran: Mendalur
  notes:
    zh: "门达卢尔区是萨伦纳姆东部的新城，面积约 900 平方公里，人口 45 万。萨伦纳姆国际机场在区内，跑道长 4400 米，是领地最大的航空港，航线通往世界各地；机场周围是物流园、航空维修基地和会展中心，航空、物流仓储和社区服务是区里的主要行业，人均产值约 7.5 万美元。新城按规划路网建设，住宅多为高层公寓，居民以近二三十年迁来的移民家庭为主，中文和英语最常用，伊武兰语母语者约占四分之一。\n地铁 4 号线是全市最长的地铁线，从公园路站经建设大街站、剧院大道站和议会路站向东，穿过云雀站、夏至站等住宅街坊，东延到萨伦纳姆国际机场站，直通航站楼；萨伦纳姆国际机场公路连接机场和环城高速，萨伦纳姆环城高速也从区里经过。人民路、议会大道、木棉大道和拉萨大道是区里的主要街道，剧院和会展中心沿剧院大道排开。\n到达大厅的墙上用中文、英文和伊武兰语写着领地格言「长夏不尽，人人有家」，旅客出关后第一眼看到的就是这行字。新城的居民来自世界各地，社区食堂的菜单每周轮换各国的家乡菜，航空维修基地的技师下了夜班，常在机场边的大排档吃一碗汤面，看着第一班早航班起飞再回家睡觉。"
    en: "Mendalur District is the new town on the east side of Sarunnam. It covers about 900 km² and has 450,000 people. Sarunnam International Airport is here, with a runway 4,400 m long: the territory's largest airport, with routes to all parts of the world. Around it are logistics parks, an aircraft maintenance base and a conference and exhibition centre, and aviation, logistics and warehousing and community services are the district's main trades, with output per head of about US$75,000. The new town follows a planned street grid, homes are mostly high-rise flats, and most residents belong to incomer families who have arrived in the last twenty or thirty years; Chinese and English are the languages most used, and native Ivuran speakers are about a quarter.\nMetro Line 4, the longest in the city, runs east from Park Road through Progress Boulevard, Theatre Avenue and Parliament Road, then through residential quarters at stations such as Lark and Midsummer, and was extended east to Sarunnam International Airport station, right into the terminal; the Sarunnam International Airport Road links the airport to the ring expressway, and the Sarunnam Ring Expressway crosses the district. People's Road, Parliament Avenue, Kapok Avenue and Lhasa Avenue are the main streets, and theatres and the exhibition centre line Theatre Avenue.\nOn the wall of the arrivals hall the territory's motto, \"Endless Summer, a Home for All\", is written in Chinese, English and Ivuran, the first thing travellers see once through passport control. Residents of the new town come from all over the world, and the community canteens rotate dishes from different home countries every week; technicians at the maintenance base, coming off the night shift, often eat a bowl of noodle soup at a food stall by the airport, watching the first morning flight take off before going home to sleep."
  codes:
    admin: '930206'
  population: 450000
  area_km2: 900.0
  traits: { industries: [aviation, logistics, residential] }
- id: div_0dgwyn
  subtype: borough
  parent: div_kv6b3e
  status: generated
  names:
    zh: 奥卢瓦尔区
    en: Oluvar District
    art-x-ivuran: Oluvar
  notes:
    zh: "奥卢瓦尔区是哈努西鲁河三角洲的稻作区，区名在伊武兰语里意为「稻田」，面积 3.2 万平方公里，人口 45 万，是萨伦纳姆面积最大的区，也是领地最大的稻米产区，一年两到三熟。三角洲大部分低平，区内地势向内陆抬升，最高处海拔 1380 米。河道和灌渠把稻田分成方格，村庄建在高出水面的台地上，雨季时许多地方要乘船往来。稻米合作社统一收购和加工，三角洲的香米出口到世界各地；梯田稻作、种植业和食品与水产加工是主要行业，第一产业占三成以上。\n居民近八成是伊武兰语母语者，老年人比例在全市最高，梯田农民党在区里得票最多。伊米穆高速从区里穿过，向东北通往彭纳拉姆；面包房大道、槟榔大道、渔市大街和码头大道是区里集镇的主要街道。\n三角洲的人说哈努西鲁河一路从高原背下来的不是水，是土：「Hanu siru, hanu olu」，意思是「大河大，稻也大」，每年河水带来的淤泥让稻田越种越肥。收割后的稻田里会搭起戏台，演一种用伊武兰木鼓伴奏的古王国戏，十里八村的人划船来看，戏台边摆满卖椰浆糯米糕和烤鱼的小摊。雨季洪水漫上河岸时，农民不慌不忙把船拴在屋柱上，等水退了再下田。"
    en: "Oluvar District is the rice country of the Hanusiru delta; its name means 'paddy fields' in Ivuran. It covers 32,000 km² and has 450,000 people, the largest district of Sarunnam by area and the territory's largest rice-growing area, with two or three crops a year. Most of the delta is low and flat, but the land rises inland to a highest point of 1,380 m. Rivers and irrigation channels divide the paddies into squares, villages stand on terraces above the water, and in the wet season many places can be reached only by boat. Rice co-operatives buy and mill the harvest, and the delta's fragrant rice is exported all over the world; terrace rice, plantations and food and seafood processing are the main trades, and farming makes up more than three-tenths of the economy.\nNearly eight in ten residents are native Ivuran speakers, the share of older people is the highest in the city, and the Terrace Farmers' Party wins the most votes here. The Imimu Expressway crosses the district on its way north-east to Pennaram; Bakehouse Avenue, Areca Avenue, Fish Market Boulevard and Quay Avenue are the main streets of its market towns.\nPeople on the delta say the Hanusiru carries not water down from the plateau but soil: \"Hanu siru, hanu olu\", a big river makes big rice, and the silt it brings each year makes the paddies ever richer. After the harvest, stages go up in the fields for a kind of old-kingdom drama accompanied by Ivuran wooden drums; people row in from villages for miles around, and stalls selling coconut sticky-rice cakes and grilled fish crowd round the stage. When the wet-season floods spill over the banks, farmers calmly tie their boats to the house posts and wait for the water to go down before going back to the fields."
  codes:
    admin: '930207'
  population: 450000
  area_km2: 32000.0
  traits: { industries: [rice, agriculture, food], heritage: ivuran }
- id: div_k880h3
  subtype: borough
  parent: div_kv6b3e
  status: generated
  names:
    zh: 皮拉凯区
    en: Pilakkai District
    art-x-ivuran: Pilakkai
  notes:
    zh: "皮拉凯区是哈努西鲁河三角洲外缘的海岸区，区名在伊武兰语里意为「红树林之岸」，面积约 2.8 万平方公里，人口 35 万，地势低缓，最高处海拔三百多米。潮间带上长满红树林，是鱼虾和水鸟的繁育地，海岸线的大部分划为皮拉凯红树林保护区；红树林外的浅海里还有海草床。渔村在红树林之间的水道口，居民打鱼、养虾和养蟹，海水养殖、渔业和自然保护与巡护是区里的主要行业，第一产业占四成。\n领地禁止砍伐红树林开挖虾塘，养殖都在指定的内陆塘区进行；保护区里的木栈道只修在边缘，护林员乘小船巡护，潮水涨落间是鱼虾和螃蟹的育苗场，也是候鸟的停歇地。居民八成以上是伊武兰语母语者，是萨伦纳姆本地人比例最高的区。纳卢高速从区里穿过，沿西北海岸通往彭纳拉姆，盐仓大街、菠萝蜜大道和太阳鸟大道是渔镇的主要街道。\n退潮时泥滩上能看到成群的弹涂鱼蹦跳，孩子们趴在栈道边看它们用鳍「走路」。护林员常对游客说，红树林挡住了风暴潮，三角洲上的稻田和村子才能安稳。渔村的早市上，刚上岸的泥蟹用草绳捆着摆成一排，主妇们挑蟹时总要先按一按蟹壳，听卖蟹的人讲今早在哪条水道下的笼。"
    en: "Pilakkai District is the coastal district on the outer edge of the Hanusiru delta; its name means 'shore of mangroves' in Ivuran. It covers about 27,800 km² and has 350,000 people, on low, gentle land that rises no higher than 300-odd metres. The intertidal zone is thick with mangroves, nurseries for fish, shrimp and water birds, and most of the coastline is protected as the Pilakkai Mangrove Reserve; beyond the mangroves lie seagrass beds in the shallows. Fishing villages stand at the mouths of the channels between the mangroves, where people fish and farm shrimp and crabs; mariculture, fishing and nature conservation and patrols are the main trades, and farming and fishing make up four-tenths of the economy.\nThe territory forbids clearing mangroves for shrimp ponds, so all farming is done in designated inland pond zones; in the reserve the boardwalks run only round the edges and rangers patrol by small boat, and between the tides it is a nursery for fish, shrimp and crabs and a stopover for migrating birds. More than eight in ten residents are native Ivuran speakers, the highest share of islanders of any district in Sarunnam. The Nalu Expressway crosses the district along the north-west coast towards Pennaram, and Salt Store Boulevard, Jackfruit Avenue and Sunbird Avenue are the main streets of the fishing towns.\nAt low tide shoals of mudskippers hop across the mudflats, and children lie on the boardwalks watching them \"walk\" on their fins. Rangers like to tell visitors that it is the mangroves that hold back the storm surges and keep the paddies and villages of the delta safe. At the morning market in the fishing villages, mud crabs fresh off the boats sit in rows tied with grass string, and shoppers always press a shell or two before buying while the seller tells them which channel he set his traps in that morning."
  codes:
    admin: '930208'
  population: 350000
  area_km2: 27790.0
  traits: { industries: [aquaculture, fishing, conservation], heritage: ivuran }

# ── 埃武托拉公社──
- id: div_6kjc7x
  subtype: locality
  parent: div_nwm019
  status: generated
  names:
    zh: 埃武托拉公社
    en: Evutola Commune
    art-x-ivuran: Evutola
  notes:
    zh: "埃武托拉公社是主岛东北端海岸上的市级公社，名字在伊武兰语里意为「大家的家」，取自领地格言所本的老话「Selo imimu, tola evu」。公社面积 2 万平方公里，100 万人，城区在埃武托拉湾畔，地势低平，属热带草原气候，旱季有两三个月几乎滴雨不下，一年降水约 1300 毫米。公社自治，自定税率，居民的个人所得税、社会保险和消费税合计超过收入的八成，财政部中央财政事务司按协议与公社结算，政务院只管外交、国防等少数事务。\n公社里住房、公共交通、水电网、教育、医疗、托育和养老全部免费，汽车、电器等贵重物品也由公社提供、按需取用；公共食堂、公共洗衣房和工具库遍布各区。大部分工资由劳动贡献积分代替，最高与最低收入之比不超过三倍；企业以集体所有和合作社为主，重大事务由居民议事会直接表决，每周工作四天。公社不设市议会和市长，最高权力机关是 55 席的公社人民代表大会，代表在街区和生产合作社的选民会议上提名，选民随时可以联署罢免，公社里管这叫「随叫随走」；现由人民公社共产主义运动以 30 席单独执政，管理委员会主任是尼拉迈·翁巴赖，国际共产党以 14 席成为最大的反对党，专盯公社的账本，投票率高达 94%。\n五个区各有分工：哈马图区是中心区，人民广场四周是人民宫、能坐三万人的公社大食堂和借出工具、乐器的公社图书馆；奥鲁武区是环形公社住宅，每个环住两三千人；帕卡里区的合作社工业园制造电动车、电器、农机和建材；塔尼武区是农业和渔业合作社；卢阿努区有白沙海滩上的疗养院和度假村。经济以制造、食品与水产加工、医疗疗养和高等教育为主，人均产值约 6 万美元，伊武兰语母语者约占六成。长夏真空磁悬浮在埃武托拉站到达终点，伊米穆高速在哈马图区收尾，塞洛高速和纳卢高速分别通到奥鲁武区和帕卡里区，埃武托拉海岸公路沿海岸连接三区；两条地铁和免费的电车、公共汽车昼夜运行。\n居民见面常用一句半开玩笑的话互相问候：「Tola evu, evu tola」，意思是「家是大家的，大家是一家」。公社大食堂除了每月投票定菜单，每周还要投出一道「周五菜」，有一道椰浆焖鱼连着许多周高票当选，后来干脆进了菜单的固定栏目。各区社区中心都有一面钥匙墙，汽车、电钻和野营帐篷按需登记取用，墙边的黑板上写着谁借了什么、几时归还。第五天很多人到菜园、托儿所和图书馆做义工，退休的老工人教孩子们修自行车，年轻人教老人用新的投票终端。公社大会在人民广场的大棚下召开，会开得再长，中间也一定会停下来，大家一起吃一顿大食堂送来的点心。"
    en: "Evutola Commune is a city-level commune on the coast at the north-eastern end of the main island; its name means 'everyone's home' in Ivuran and comes from the old saying behind the territory's motto, \"Selo imimu, tola evu\". The commune covers 20,000 km² and has a million people; the town stands on low, flat ground beside Evutola Bay, with a tropical savanna climate, two or three almost rainless months in the dry season and about 1,300 mm of rain a year. The commune governs itself and sets its own taxes: residents' income tax, social insurance and consumption taxes together come to more than four-fifths of their income, the Central Finance Department of the Ministry of Finance settles accounts with the commune by agreement, and the Executive Council handles only a few matters such as foreign affairs and defence.\nHousing, public transport, water and power, education, health care, childcare and care for the elderly are all free, and costly goods such as cars and appliances are provided by the commune and taken as needed; public canteens, public laundries and tool libraries are found in every district. Most wages are replaced by labour contribution credits, the highest income may be no more than three times the lowest, enterprises are mostly collectively owned or run as co-operatives, the residents' assemblies vote directly on major matters, and the working week is four days. There is no city council and no mayor: the highest authority is the 55-seat Commune People's Congress, whose delegates are nominated at voters' meetings in the neighbourhoods and production co-operatives and can be recalled at any time by petition, which the commune calls \"come when called, go when told\". The People's Commune Communist Movement now governs alone with 30 seats and Nilamai Ombarai chairs the Management Committee, while the International Communist Party, with 14 seats, is the largest opposition party and keeps a close eye on the commune's books; turnout reaches 94 per cent.\nEach of the five districts has its role. Hamatu is the centre, where Evutola People's Square is ringed by the People's Palace, the Commune Canteen with seats for 30,000 and the Commune Library, which lends tools and musical instruments as well as books; Oruvu is the district of the Ring Homes, each ring housing two or three thousand people; the Co-operative Industrial Park in Pakari makes electric vehicles, appliances, farm machinery and building materials; Tanivu is the land of the farming and fishing co-operatives; and Luanu has convalescent homes and holiday villages on its white beaches. The economy rests on manufacturing, food and seafood processing, health care and convalescence and higher education, output per head is about US$60,000, and about six in ten residents are native Ivuran speakers. The Everlong Summer Vacuum Maglev ends at Evutola Station, the Imimu Expressway finishes in Hamatu, the Selo and Nalu Expressways reach Oruvu and Pakari respectively, and the Evutola Coast Road links three districts along the shore; two metro lines and free trams and buses run day and night.\nResidents greet one another with a half-joking phrase, \"Tola evu, evu tola\", home belongs to everyone and everyone is one family. Besides voting on the menu each month, people at the Commune Canteen vote every week for a \"Friday dish\", and a coconut-braised fish won so many weeks running that it was finally made a permanent item. Every district community centre has a wall of keys, where cars, drills and camping tents are signed out as needed, with a blackboard beside it listing who has borrowed what and when it is due back. On the fifth day many people volunteer in the vegetable gardens, nurseries and the library, where retired workers teach children to mend bicycles and young people show the elderly how to use the new voting terminals. The commune's assembly meets under the great canopy in People's Square, and however long the meeting runs it always stops at some point so that everyone can share a snack sent over from the canteen."
