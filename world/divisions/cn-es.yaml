    art-x-ivuran: Manalu
  notes:
    zh: "马纳卢区是洛米兰的海岸区，区名在伊武兰语里意为「河口」，面积约 2 万平方公里，人口 7 万，从海岸向内陆山地抬升，最高处海拔 2350 米。约 274 公里长的洛米西鲁河在这里入海，河口有渔港和椰林，河口两岸的红树林是鱼虾的育苗场。马纳卢湾面积约 230 平方公里，洛米西鲁河在湾的西侧入海，湾岸是红树林和椰林，海滩上有海龟产卵地，每年产卵季节海滩夜间封闭。\n渔业、种植业和旅游是区里的主要行业，第一产业占三成。居民近八成讲伊武兰语，老年人比例在全市最高，梯田农民党、伊武兰民族复兴党和社会民主互助工党在区里的得票不相上下。卢瓦纳—马纳卢公路把河口的渔港和洛米兰城区连起来，渔获当天就能送进城里的集市；缆绳大道、铁锚大道、云豹路和桶匠路是渔镇的主要街道。\n产卵季的夜里，志愿者打着红光手电在海滩上巡逻，护送刚孵出的小海龟爬向大海，村里的孩子们以能当一晚「海龟护卫」为荣。雨季河水漫进上游的森林，鱼游进林子里吃落下的果子，村民划着独木舟在树梢之间撒网，孩子们说这是一年里唯一能「在树上钓鱼」的季节。河口的渔家把刚上岸的鱼用芭蕉叶包上香料烤熟，就是洛米兰人爱吃的叶包鱼。"
    en: "Manalu District is the coastal district of Lomiran; its name means 'river mouth' in Ivuran. It covers about 20,000 km² and has 70,000 people, rising from the coast to inland mountains that reach 2,350 m. The Lomisiru River, about 274 km long, enters the sea here; at its mouth are a fishing harbour and coconut groves, and the mangroves on both banks are nurseries for fish and shrimp. Manalu Bay, about 230 km², receives the Lomisiru on its western side; its shores are lined with mangroves and coconut palms, its beaches are turtle-nesting grounds, and during the nesting season the beaches are closed at night.\nFishing, plantations and tourism are the main trades, and farming and fishing make up three-tenths of the economy. Nearly eight in ten residents speak Ivuran, the share of older people is the highest in the city, and the Terrace Farmers' Party, the Ivuran National Renewal Party and the Social Democratic Mutual Aid Labour Party run neck and neck here. The Luvana–Manalu Road links the fishing harbour at the river mouth with the town of Lomiran, so the catch reaches the town markets the same day; Ropewalk Avenue, Anchor Avenue, Clouded Leopard Road and Cooper Road are the main streets of the fishing towns.\nOn nesting-season nights volunteers patrol the beaches with red torches, escorting newly hatched turtles down to the sea, and village children are proud to serve a night as \"turtle guards\". In the wet season the river floods the forest upstream, fish swim in among the trees to eat fallen fruit, and villagers paddle dugouts between the treetops casting their nets; children say it is the one season of the year when you can \"fish in the trees\". Fishing families at the river mouth wrap the day's catch in banana leaves with spices and grill it, the leaf-parcel fish that Lomiran loves."
  codes:
    admin: '930904'
  population: 70000
  area_km2: 20000.0
  traits: { industries: [fishing, agriculture, tourism] }
- id: div_8p898f
  subtype: borough
  parent: div_k4tk68
  status: generated
  names:
    zh: 卡塔穆区
    en: Katamu District
    art-x-ivuran: Katamu
  notes:
    zh: "卡塔穆区是洛米兰内陆的林区村落，区名在伊武兰语里意为「藤与草」，面积约 3 万平方公里，只有 3.7 万人，是除国家公园管理区外全市人口最少的区，最高处海拔 2312 米。约 290 公里长的卡塔西鲁河穿过雨林中的林区村落，村民划独木舟往来、采集藤条和草药，河流在洛米兰城区东北入海。雨林深处的洛米翁贝尔湖是一座黑水湖，面积约 350 平方公里，湖水被落叶染成茶色，湖岸是淹水林，雨季时湖面扩大到旱季的两倍，研究人员在这里研究雨林的水循环。\n村民按领地的许可在林中采集藤条、蜂蜜和药用植物，草药合作社把药材卖给生物医药企业，收益按惠益分享的规定返还村社；林业木材加工、种植业和生物医药是区里的主要行业。居民四分之三讲伊武兰语，梯田农民党在区里得票最多。纳卢高速沿西北海岸从区里经过，是林区村落通往城区和萨伦纳姆方向的主要道路，再往林子深处就只能走小道或划船。\n林区村落的独木舟船头都刻着自家的图案，村民在河上相遇时不用喊名字，看一眼船头就知道是谁家的人，顺便交换几捆藤条和一筐草药。洛米翁贝尔湖的湖水平静得像一面镜子，倒映着周围的树冠，独木舟划过时分不清哪边是天、哪边是水，村里的老人提醒新来的研究员「别低头看太久，会晕」。"
    en: "Katamu District is the forest-village country of inland Lomiran; its name means 'rattan and herbs' in Ivuran. It covers about 29,500 km² and has only 37,000 people, the fewest of any district in the city apart from the national park zone, rising to 2,312 m. The Katasiru River, about 290 km long, threads through the forest villages, whose people travel by dugout and gather rattan and herbs, and it reaches the sea north-east of the town of Lomiran. Deep in the rainforest lies Lake Lomiombel, a blackwater lake of about 350 km², its water stained tea-brown by fallen leaves and its shores lined with flooded forest; in the wet season it grows to twice its dry-season size, and researchers study the rainforest's water cycle here.\nVillagers gather rattan, honey and medicinal plants in the forest under territorial permits, and the herb co-operative sells the medicinal plants to biomedical companies, with the proceeds returned to the villages under the benefit-sharing rules; forestry and timber, plantations and biomedicine are the district's main trades. Three-quarters of the residents speak Ivuran, and the Terrace Farmers' Party wins the most votes here. The Nalu Expressway passes through along the north-west coast, the forest villages' main road to the town and towards Sarunnam, and deeper into the forest there are only footpaths and canoes.\nEvery dugout in the forest villages has its family's design carved on the bow, so when villagers meet on the river they need not call out names: one look at the bow tells them whose boat it is, and they swap a few bundles of rattan and a basket of herbs while they are at it. Lake Lomiombel is as still as a mirror, reflecting the canopy all round, so that a canoe gliding across seems to float between two skies, and village elders warn new researchers \"don't look down too long, or you'll get dizzy\"."
  codes:
    admin: '930905'
  population: 37000
  area_km2: 29500.0
  traits: { industries: [forestry, agriculture, pharma] }

# ── 乌诺卡里市──
- id: div_7z142e
  subtype: locality
  parent: div_nwm019
  status: generated
  names:
    zh: 乌诺卡里市
    en: Unokari City
    art-x-ivuran: Unokari
  notes:
    zh: "乌诺卡里市是主岛东北部乌诺凯苏山脉中的矿业城市，全市 70 万人，面积约 10.5 万平方公里，在领地各市中仅次于洛米兰，城名在伊武兰语里意为「矿石的山谷」。城区卡里纳区在山间盆地里，四周是乌诺凯苏山脉的群峰，最高的乌诺图马峰海拔两千四百多米，山顶一带保留着原始的山地雨林；海拔 1407 米的霍拉瓦苏山口是盆地通往西北海岸纳卢迈一带的通道。山谷里比海边凉快，一年降水一千七百多毫米。\n山中的红土镍矿是领地最大的矿产。乌诺维拉矿区管理区的乌诺维拉镍钴矿露天开采镍和钴，佩鲁诺区的佩鲁诺冶炼厂用高压酸浸法把矿石炼成电池级的硫酸镍和硫酸钴，再运往塔卢马兰伊拉坦区的电池厂；贝卢阿区的贝卢阿矿石港把产品装船外运，霍拉坦区山间的水电站为冶炼厂供电。领地要求矿区边采边复绿，尾矿全部回填，采过的山坡随即种上原生树种，排水、粉尘和复绿进度定期公开。采矿、电池储能、制造和港口航运是全市的主要行业，工业占三成以上，人均产值约 6.2 万美元。城区有矿业公司的总部、矿业学院和医院，山坡上的老城保留着伊武兰人的木屋街巷。\n连接矿区、冶炼厂和电池厂的是乌诺维拉真空磁悬浮重载铁路：一条密封的低真空管道，无人驾驶的红土 600 型重载列车以时速 600 公里运行，每列 80 节货运舱、载货 6400 吨，每天发出 8 列满载列车，每年运出约 1900 万吨矿石和镍产品；途中的霍拉坦特大桥长约 94 公里，是世界最长的铁路桥梁。客运方面，塔纳高速铁路在卡里纳区的乌诺卡里站停靠，向南通塔卢马兰，向北通纳卢迈；伊米穆高速经过城区，塞洛高速经过贝卢阿区，乌诺维拉矿区公路和贝卢阿公路通往矿区和港口。城里有一条约 8 公里的地铁。全市移民约占四成，矿工和冶金工程师多来自中国其他省份；孩子约占两成，是领地孩子比例最高的城市。市议会 53 席，市长周子墨来自国际共产党，与社会民主互助工党和伊武兰民族复兴党联合执政。\n乌诺卡里的矿山有条规矩：每采完一片矿坑，就要回填尾矿、重新种上树，矿工们会在自己种下的树苗上挂一块小木牌，写上名字和班组，过几年再带着家人回来看树长了多高，矿区里因此有了一片片以班组命名的「矿工林」。红土把这里的一切染成了赭红色，矿工下班时连眉毛都是红的，佩鲁诺区的澡堂一到傍晚就排起长队，本地人管这叫「洗红」。矿区食堂的菜单南北兼顾，卖得最好的却是一碗本地的辣椒酸汤配米粉，据说出一身汗就不怕山里的湿气。傍晚雾气从山脊上漫下来，贝卢阿矿石港的灯光在雾里一闪一闪，像停在山谷口的一船星星。"
    en: "Unokari City is the mining city of the Unokesu Mountains in the north-east of the main island, with 700,000 people over some 105,000 km², second only to Lomiran in area among the territory's cities; its name means 'valley of ore' in Ivuran. The town, Karina District, lies in a mountain basin ringed by the peaks of the Unokesu Mountains, the highest of which, Mount Unotuma, rises to more than 2,400 m and keeps primeval montane rainforest round its summit; the Horavasu Pass, 1,407 m, leads from the basin towards Nalumai on the north-west coast. The valleys are cooler than the coast, with more than 1,700 mm of rain a year.\nThe laterite nickel in the mountains is the territory's greatest mineral wealth. The Unovila Nickel and Cobalt Mine in the Unovila Mining Administration Zone works nickel and cobalt in open pits; the Peruno Smelter in Peruno District uses high-pressure acid leaching to turn the ore into battery-grade nickel and cobalt sulphates, which go on to the battery works in Ilatan District, Talumaran; the Belua Ore Port in Belua District ships the products out, and hydroelectric stations in the hills of Horatan District power the smelter. The territory requires the mines to replant as they go and to backfill all tailings; mined slopes are planted with native trees straight away, and drainage, dust and replanting progress are published regularly. Mining, batteries and energy storage, manufacturing and ports and shipping are the city's main trades, industry makes up more than three-tenths of the economy, and output per head is about US$62,000. The town has the mining companies' headquarters, a mining college and a hospital, and the old town on the hillside keeps its lanes of Ivuran timber houses.\nMine, smelter and battery works are linked by the Unovila Vacuum Maglev Heavy-Haul Railway, a sealed low-vacuum tube in which driverless Laterite 600 heavy-haul trains run at 600 km/h, each with 80 freight pods carrying 6,400 tonnes; eight loaded trains leave every day, carrying some 19 million tonnes of ore and nickel products a year, and the Horatan Viaduct on the way, about 94 km long, is the longest railway bridge in the world. For passengers, the Talumaran–Nalumai High-Speed Railway stops at Unokari Station in Karina, running south to Talumaran and north to Nalumai; the Imimu Expressway passes the town, the Selo Expressway crosses Belua, and the Unovila Mines Road and the Belua Road lead to the mines and the port. The city has one metro line of about 8 km. Incomers make up about four in ten residents, with many miners and metallurgists from other provinces of China; children make up about a fifth of the population, the highest share of any city in the territory. The City Council has 53 seats; the mayor, Zhou Zimo, belongs to the International Communist Party and governs in coalition with the Social Democratic Mutual Aid Labour Party and the Ivuran National Renewal Party.\nUnokari's mines have a rule: every worked-out pit must be backfilled with tailings and replanted, and miners hang a little wooden tag on the saplings they plant with their name and crew, coming back a few years later with their families to see how tall the trees have grown, so the mining area is now dotted with \"miners' woods\" named after their crews. The red earth stains everything ochre, miners come off shift red to the eyebrows, and in the evening the bathhouses of Peruno have long queues; locals call it \"washing off the red\". The menus in the mine canteens cater to north and south alike, yet the best seller is a bowl of local chilli sour soup with rice noodles, which is said to sweat out the damp of the mountains. In the evening mist pours down from the ridges, and the lights of the Belua Ore Port twinkle through it like a boatload of stars moored at the mouth of the valley."
  codes:
    admin: '931000'
    unlocode: ES UNK
  population: 700000
  area_km2: 105000.0
  color: '#6B6F78'
  flag: { layout: sun_canton, colors: ['#4F5D56'], charge: mining, charge_color: '#FFFFFF' }
  flag_notes:
    zh: "长夏新城旗：岩灰绿底，左上角是领地旗的朝阳，右侧一对交叉的白色锤镐。城名意为「矿石的山谷」，锤镐是开采红土镍矿和钴的矿工，岩灰绿是矿区边采边复绿长出的新绿。冶炼厂的工人说，旗上的朝阳照着的是送往塔卢马兰电池厂的镍。"
    en: "A southern new-town flag: rock grey-green with the territory's rising sun in the canton and a crossed white hammer and pick in the fly. The name means 'valley of ore': the hammer and pick are the miners of the nickel and cobalt, the grey-green the new growth on slopes replanted as they are mined. Smelter workers say the sun on the flag shines on the nickel bound for the battery works."
  traits: { industries: [mining, battery, manufacturing, port], heritage: tropic_mixed, age: young, income: 1.1 }
  symbols: {"flower": {"zh": "姜花", "en": "Ginger lily"}, "tree": {"zh": "槟榔", "en": "Areca palm"}}
- id: div_y57m7b
  subtype: borough
  parent: div_7z142e
  status: generated
  names:
    zh: 卡里纳区
    en: Karina District
    art-x-ivuran: Karina
  notes:
    zh: "卡里纳区是乌诺卡里的城区，在乌诺凯苏山脉的山间盆地里，区名意为「山谷之城」，面积 400 平方公里，人口 26 万，是全市人口最多的区。盆地底部海拔三百来米，比海边凉快，年平均气温约 25 度。矿业公司的总部、矿业学院和医院都在这里，商贸、居住与社区服务和高等教育是全区的主业；矿工家庭住在城区的公共住房里，孩子约占两成三，是一座年轻的城。山坡上的老城保留着伊武兰人的木屋街巷，约五成六的居民以伊武兰语为母语，其余多是来自中国其他省份的矿工和冶金工程师的家人。北京大道、人民大道、拉萨大道和图书馆路是城里的主干道。乌诺卡里地铁1号线全长约 8 公里，乌拉韦劳峰大道、蒂拉凯苏山脉街、号角、李家、风车、人民大道、钟楼街和博物馆八站都在区内；乌诺卡里站是塔纳高速铁路的车站，犀鸟 400 型列车以时速 400 公里穿过乌诺凯苏山地，东南去塔卢马兰，西北到纳卢迈。伊米穆高速经过城区，贝卢阿公路从矿石港上来，终点就在卡里纳；卡里纳—佩鲁诺公路约 11 公里通往冶炼厂，卡里纳—霍拉坦公路约 69 公里。\n红土把这一带染成了赭红色，矿工下班坐地铁回城，衣领上还带着红土，城里人一看就知道是「刚洗过红」还是「还没洗红」。矿区食堂和城里的小馆子卖得最好的是一碗辣椒酸汤配米粉，据说出一身汗就不怕山里的湿气。周末，矿工们带着家人去看自己在复绿矿坑上种的树，树苗上挂着写了名字和班组的小木牌。傍晚雾从山脊上漫进盆地，老城木屋的窗子一扇扇亮起来。"
    en: "Karina District is the town of Unokari, in a basin among the Unokesu Mountains; its name means 'town of the valley', and it covers 400 km² with 260,000 people, the most populous district in the city. The floor of the basin lies some 300 metres up, cooler than the coast, with a mean annual temperature of about 25 °C. The mining companies' headquarters, the school of mines and the hospital are all here, and commerce, housing and community services, and higher education are the district's main work; miners' families live in the town's public housing, and children make up about 23 per cent of the population, a young town. The old quarter on the hillside keeps its lanes of Ivuran timber houses; about 56 per cent of residents speak Ivuran as their mother tongue, and most of the rest are the families of miners and metallurgists from other provinces of China. Beijing Avenue, People's Avenue, Lhasa Avenue and Library Road are the main roads. Unokari Metro Line 1, about 8 km long, has all eight of its stations in the district, Mount Uravelau Avenue, Tirakesu Mountains Street, Horn, Lijia, Windmill, People's Avenue, Clock Tower Street and Museum; Unokari Station is on the Talumaran–Nalumai High-Speed Railway, whose Hornbill 400 trains cross the Unokesu uplands at 400 km/h, south-east to Talumaran and north-west to Nalumai. The Imimu Expressway passes the town, the Belua Road comes up from the ore port and ends in Karina, the Karina–Peruno Road, about 11 km, leads to the smelters, and the Karina–Horatan Road runs about 69 km.\nThe red laterite stains everything here ochre, and when miners ride the metro home there is still red earth on their collars, so townspeople can tell at a glance whether someone has 'washed the red off' yet. The best seller in the mine canteens and the town's little eating houses is a bowl of hot and sour chilli soup with rice noodles, said to sweat out the mountain damp. At weekends miners take their families to see the trees they planted on refilled pits, each sapling hung with a small wooden tag bearing a name and a crew. In the evening the mist spills off the ridges into the basin, and one by one the windows of the old timber houses light up."
  codes:
    admin: '931001'
  population: 260000
  area_km2: 400.0
  traits: { industries: [commerce, residential, education] }
- id: div_6z737x
  subtype: borough
  parent: div_7z142e
  status: generated
  names:
    zh: 乌诺维拉矿区管理区
    en: Unovila Mining Administration Zone
    art-x-ivuran: Unovila
  notes:
    zh: "乌诺维拉矿区管理区是乌诺凯苏山脉的镍矿区，名字在伊武兰语里意为「矿之光」，面积 4 万平方公里，人口 6 万。区里平均海拔八百多米，乌诺维拉峰海拔 2413 米，气候比山下凉爽潮湿，一年降水两千三百多毫米。红土镍矿在山坡上露天开采，乌诺维拉镍钴矿开采镍和钴，采过的台阶随即回填、覆土、种上原生树种，尾矿全部回填，山顶一带划为禁采区。矿区由领地设立的管理机构统一监管，排水、粉尘和复绿进度定期公开。\n矿石从区里的乌诺维拉矿区货运站装进乌诺维拉真空磁悬浮重载铁路的货运舱，由无人驾驶的红土 600 型重载列车运往佩鲁诺冶炼厂，每天 8 列满载列车。乌诺维拉矿区公路经霍拉坦区通往城区，乌诺维拉镍钴矿公路通到矿坑边。居民以矿工、复绿队员和工程师为主，劳动年龄人口占七成以上，伊武兰语母语者过半，许多矿工来自中国其他省份。\n矿工们会在自己种下的复绿树苗上挂一块小木牌，写上名字和班组，矿区里因此有了一片片以班组命名的「矿工林」。露天矿坑采完后会注水变成湖，复绿后的湖边成了周末钓鱼的地方，矿工们自豪地说「我们挖的坑，现在有鱼住了」。货运舱装车时常常蒙上一层赭红色的红土，进管道前要先过一道冲洗门，矿工们说这些车也要「洗红」。"
    en: "The Unovila Mining Administration Zone is the nickel-mining area of the Unokesu Mountains; its name means 'light of ore' in Ivuran. It covers 40,000 km² and has 60,000 people. Its average height is more than 800 m, Mount Unovila rises to 2,413 m, and the climate is cooler and wetter than below, with more than 2,300 mm of rain a year. The laterite nickel is mined in open pits on the slopes: the Unovila Nickel and Cobalt Mine works nickel and cobalt, worked-out benches are immediately backfilled, covered with soil and planted with native trees, all tailings go back into the ground, and the summit area is closed to mining. The zone is supervised by an authority set up by the territory, and drainage, dust and replanting progress are published regularly.\nOre is loaded at the Unovila Mining Freight Yard into the pods of the Unovila Vacuum Maglev Heavy-Haul Railway and carried by driverless Laterite 600 heavy-haul trains to the Peruno Smelter, eight loaded trains a day. The Unovila Mines Road runs through Horatan District to the town, and the Unovila Nickel and Cobalt Mine Road leads to the pit edge. Most residents are miners, replanting crews and engineers, more than seven in ten are of working age, native Ivuran speakers are just over half, and many miners come from other provinces of China.\nMiners hang a little wooden tag with their name and crew on the saplings they plant, so the mining area is dotted with \"miners' woods\" named after their crews. Worked-out pits are flooded to become lakes, and once replanted their shores become weekend fishing spots; miners proudly say \"the holes we dug have fish living in them now\". The freight pods are often coated with ochre earth when they are loaded, so they pass through a washing gate before entering the tube, and miners say the trains too must \"wash off the red\"."
  codes:
    admin: '931002'
  population: 60000
  area_km2: 40000.0
  special_status: mining_zone
  traits: { industries: [mining, conservation] }
- id: div_4m0x2v
  subtype: borough
  parent: div_7z142e
  status: generated
  names:
    zh: 佩鲁诺区
    en: Peruno District
    art-x-ivuran: Peruno
  notes:
    zh: "佩鲁诺区是乌诺卡里的冶炼区，区名在伊武兰语里意为「大矿」，面积约 1500 平方公里，人口 18 万。佩鲁诺冶炼厂用高压酸浸法把红土镍矿炼成电池级的硫酸镍和硫酸钴，再由乌诺维拉真空磁悬浮重载铁路运往塔卢马兰伊拉坦区的电池厂；冶炼厂用山区水电站的电力，废渣经过处理后回填矿坑。工业占区里产值的六成以上，电池储能、制造和采矿是主要行业，人均产值约 7.7 万美元，是全市最高的。\n重载铁路的佩鲁诺货运站是矿石和镍盐的中转站，满载列车从矿区开来，卸下矿石、装上镍盐再驶向伊拉坦。区里的居民大多是冶炼厂的工人和工程师，劳动年龄人口占七成以上，老人不到一成，伊武兰语母语者过半；卡里纳—佩鲁诺公路把冶炼厂和城区连在一起，上下班的电动公交十几分钟一班。博爱大道、塔卢马兰大道、团结路和竹林大道是区里的主要街道。\n红土把这里的一切染成了赭红色，工人下班时连眉毛都是红的，佩鲁诺区的澡堂一到傍晚就排起长队，本地人管这叫「洗红」。澡堂门口的小吃摊专做下班生意，一碗辣椒酸汤配米粉，再来一串烤鱼，工人们说洗完红、出完汗，这一天才算过去。"
    en: "Peruno District is the smelting district of Unokari; its name means 'great ore' in Ivuran. It covers about 1,500 km² and has 180,000 people. The Peruno Smelter uses high-pressure acid leaching to turn laterite nickel ore into battery-grade nickel and cobalt sulphates, which the Unovila Vacuum Maglev Heavy-Haul Railway carries on to the battery works in Ilatan District, Talumaran; the smelter runs on power from hydroelectric stations in the hills, and its residues are treated and returned to the pits. Industry accounts for more than six-tenths of the district's output, batteries and energy storage, manufacturing and mining are its main trades, and output per head, about US$77,000, is the highest in the city.\nThe railway's Peruno Freight Yard is the transfer point for ore and nickel salts: loaded trains come in from the mines, unload ore, take on nickel salts and head on to Ilatan. Most residents are smelter workers and engineers, more than seven in ten are of working age and fewer than one in ten elderly, and native Ivuran speakers are just over half; the Karina–Peruno Road links the smelter with the town, with electric commuter buses every ten minutes or so. Fraternity Avenue, Talumaran Avenue, Unity Road and Bamboo Avenue are the main streets.\nThe red earth stains everything ochre, workers come off shift red to the eyebrows, and in the evening the bathhouses of Peruno have long queues; locals call it \"washing off the red\". The food stalls outside the bathhouses live on the end-of-shift trade, with a bowl of chilli sour soup and rice noodles and a skewer of grilled fish, and workers say that once they have washed off the red and sweated it out, the day is done."
  codes:
    admin: '931003'
  population: 180000
  area_km2: 1500.0
  traits: { industries: [battery, manufacturing, mining] }
- id: div_fwnndh
  subtype: borough
  parent: div_7z142e
  status: generated
  names:
    zh: 霍拉坦区
    en: Horatan District
    art-x-ivuran: Horatan
  notes:
    zh: "霍拉坦区是乌诺凯苏山脉的高地和河谷，区名在伊武兰语里意为「雾中之地」，面积约 3.3 万平方公里，人口 9 万，最高处海拔 2245 米。海拔 1407 米的霍拉瓦苏山口是乌诺卡里盆地通往西北海岸纳卢迈一带的通道，常年起雾。山间的水电站为佩鲁诺冶炼厂供电，河谷里有稻田和果园，高地上的村寨保留着伊武兰人的传统；种植业、林业木材加工和水力发电各占约三分之一。\n区里雨水多、气候凉爽，居民八成是伊武兰语母语者，梯田农民党在区里得票最多。乌诺维拉真空磁悬浮重载铁路从区里穿过，约 94 公里长的霍拉坦特大桥是世界最长的铁路桥梁，塔纳高速铁路的霍拉坦隧道也在山中；乌诺维拉矿区公路经区里通往矿区，卡里纳—霍拉坦公路连接城区。翁贝尔韦劳湖路、萤火大街和托马库大街是集镇的主要街道。\n山口常年起雾，过山口的公路边每隔一段就挂着一只铜铃，起大雾时司机摇下车窗，听着铃声慢慢开，本地人叫它「听路」。重载铁路的管道里几乎没有声音，沿线的人只看得见管道上的指示灯按时一盏接一盏亮过山谷，村子里的人不看钟，看见灯亮过去就知道该吃午饭了。"
    en: "Horatan District is the upland and valley country of the Unokesu Mountains; its name means 'land in the mist' in Ivuran. It covers about 33,000 km² and has 90,000 people, rising to 2,245 m. The Horavasu Pass, 1,407 m, leads from the Unokari basin towards Nalumai on the north-west coast and is wrapped in mist all year. Hydroelectric stations in the hills power the Peruno Smelter, the valleys hold rice fields and orchards, and the upland villages keep Ivuran traditions alive; plantations, forestry and timber and hydroelectric power each account for about a third of the economy.\nThe district is wet and cool, eight in ten residents are native Ivuran speakers, and the Terrace Farmers' Party wins the most votes here. The Unovila Vacuum Maglev Heavy-Haul Railway crosses the district on the Horatan Viaduct, about 94 km long, the longest railway bridge in the world, and the Horatan Tunnel of the Talumaran–Nalumai High-Speed Railway also runs through these hills; the Unovila Mines Road passes through on its way to the mines, and the Karina–Horatan Road links the district with the town. Lake Ombelvelau Road, Firefly Boulevard and Tomaku Boulevard are the main streets of the market towns.\nThe pass is misty all year, so a brass bell hangs at intervals along the road over it; in thick fog drivers wind down their windows and creep along listening to the bells, which locals call \"listening to the road\". The trains in the heavy-haul tube make almost no sound, and people along the line see only the indicator lights on the tube coming on one after another across the valley on schedule; villagers do not look at the clock, for when the lights have passed they know it is time for lunch."
  codes:
    admin: '931004'
  population: 90000
  area_km2: 33100.0
  traits: { industries: [agriculture, forestry, hydropower], heritage: ivuran }
- id: div_w7bas1
  subtype: borough
  parent: div_7z142e
  status: generated
  names:
    zh: 贝卢阿区
    en: Belua District
    art-x-ivuran: Belua
  notes:
    zh: "贝卢阿区是乌诺卡里的出海口，区名意为「海门」，面积 3 万平方公里，人口 11 万。贝卢阿矿石港是乌诺卡里的门户，佩鲁诺区的冶炼厂炼出的电池级镍盐和其他镍产品在这里装船外运，封闭式的皮带廊和仓库防止粉尘外泄；港外的海岸是渔村和椰林。港口航运、采矿与石料和渔业是全区的生计，居民相对年轻，孩子约占两成，约一半人以伊武兰语为母语，其余多是来自中国其他省份和世界各地的港口和矿业职工。全区从海边一直延伸进乌诺凯苏山脉，山脉的最高峰乌诺图马峰海拔 2484 米，伊武兰语意为「矿山之峰」，山顶一带保留着原始的山地雨林，划为禁采区，周围的镍矿不得开采到保护线以内。塞洛高速从区内穿过，贝卢阿特大桥长约 57 公里，是全线最长的桥；贝卢阿公路约 190 公里，从矿石港出发，经霍拉坦区和佩鲁诺区的冶炼厂到城区卡里纳区；贝卢阿矿石港公路约 6 公里，是港口专用的进港路。这里是热带季风气候，一年降水超过 3000 毫米，是乌诺卡里最湿润的地方。\n禁采线上每隔一段立着一根红白相间的界桩，矿工们管这条线叫「山的腰带」，说矿可以挖到腰带下面，山顶要留给犀鸟和树。傍晚雾气从山脊上漫下来，港口的灯光在雾里一闪一闪，像一船停在山谷口的星星。渔村的人清晨划船出海，回来时常常与装满镍产品的货轮擦肩而过，老渔民说，港口来了以后，村里的孩子长大了不是去当水手，就是去开皮带廊，留下来打鱼的越来越少，可每年开渔那天，大家还是会回村一起吃一锅鱼汤。"
    en: "Belua District is Unokari's outlet to the sea; its name means 'sea gate', and it covers 30,000 km² with 110,000 people. The Belua Ore Port is Unokari's gateway: battery-grade nickel salts and other nickel products from the smelters of Peruno District are loaded onto ships here, with enclosed conveyors and stores to keep the dust in, and beyond the port the coast is fishing villages and coconut groves. Shipping, mining and quarrying, and fishing are the district's living; the population is fairly young, about a fifth of it children, and about half the residents speak Ivuran as their mother tongue, most of the rest being port and mining workers from other provinces of China and from all over the world. The district reaches from the sea deep into the Unokesu Mountains, whose highest peak, Mount Unotuma, 2,484 metres, is Ivuran for 'peak of the mines'; the primeval montane rainforest around its summit is a no-mining zone, and the surrounding nickel workings may not cut inside the protection line. The Selo Expressway crosses the district, where the Belua Bridge, about 57 km long, is the longest on the route; the Belua Road, about 190 km long, runs from the ore port by way of Horatan District and the smelters of Peruno District to Karina District in the town; and the Belua Ore Port Road, about 6 km, is the port's own access road. The climate is tropical monsoon, with more than 3,000 mm of rain a year, the wettest part of Unokari.\nAlong the no-mining line red-and-white boundary posts stand at intervals, and the miners call the line 'the mountain's belt', saying the ore may be dug below the belt but the summit belongs to the hornbills and the trees. In the evening the mist slides down from the ridges, and the port's lights flicker through it like a boatload of stars moored at the mouth of the valley. Fishers row out at dawn and often pass freighters laden with nickel on the way back; the old fishermen say that since the port came, village children grow up to be sailors or to run the conveyors, and fewer and fewer stay to fish, yet every year on the opening day of the fishing season everyone comes home to share a pot of fish soup."
  codes:
    admin: '931005'
  population: 110000
  area_km2: 30000.0
  traits: { industries: [port, mining, fishing] }

# ── 纳卢迈市──
- id: div_bca7d9
  subtype: locality
  parent: div_nwm019
  status: generated
  names:
    zh: 纳卢迈市
    en: Nalumai City
    art-x-ivuran: Nalumai
  notes:
    zh: "纳卢迈市是主岛西北海岸东段的城市，全市 60 万人，面积约 8.5 万平方公里，城名在伊武兰语里意为「浪中的珍珠」。约 430 公里长的纳卢西鲁河是领地第二长的河，发源于主岛中部的高地，向西北流过纳卢迈的丘陵和果园平原，在城区入海，下游两岸是芒果园、榴莲园和稻田。内陆的托武卢区丘陵一直延伸到乌诺凯苏山脉北坡，最高处海拔近 2400 米。纳卢迈在主岛东北端，旱季有两三个月几乎滴雨不下，是热带草原气候，一年降水约 1300 毫米。\n迈卢阿区沿海的迈卢阿珍珠贝养殖场出产领地有名的白珍珠，海湾的水质由领地按月监测，养殖密度有上限；帕兰图区的平原上是芒果、榴莲、菠萝蜜、山竹和红毛丹的果园，水果合作社的冷链车每天把鲜果运往港口和机场；维兰塔区的维兰塔植物园收集了热带各地的数万种植物，是世界最大的植物园，也是领地的植物研究中心；托武卢区的丘陵上是橡胶园、椰林和次生林。热带水果、海水养殖、旅游和科研是全市的主要行业，人均产值约 5 万美元。城区塞纳卢区的海滨大道边是塞纳卢珍珠市场、海鲜餐馆和度假酒店，海滩和果园吸引了不少度假的游客。全市本地人近八成，许多村庄讲伊武兰语北部方言。\n米纳高速铁路和塔纳高速铁路都以塞纳卢区的纳卢迈站为终点，前者翻上哈努帕拉高原通往首府米雷兰，后者经乌诺卡里通往塔卢马兰；城里有一条约 6 公里的地铁经过纳卢迈站。纳卢高速沿西北海岸经过塞纳卢、帕兰图、维兰塔和迈卢阿四区，伊米穆高速穿过内陆的托武卢区，哈努帕拉高原公路从迈卢阿区翻上高原。市议政会 51 席，市长特卢拉姆·塞洛迈来自伊武兰民族复兴党，与社会民主互助工党和国际共产党联合执政。\n纳卢迈的采珠人有一句伊武兰语老话：「Nalu kila, mai kila」，意思是「浪亮的时候，珍珠也亮」：风平浪静、阳光透进海里的日子才适合下海看贝，阴天风大就在岸上补网。本地人家里有个习俗，孩子出生时，家人会从那一季的收成里挑一颗白珍珠收起来，等孩子成年时串成项链或镶成戒指送给他。帕兰图区的果园在旱季末开始收获，芒果、榴莲和菠萝蜜堆满了路边的果摊，榴莲季里城里的公交车上贴着「请勿携带榴莲」的告示，司机却常常对着满车的果香睁一只眼闭一只眼；果园主人把熟透落地的榴莲装上小船顺流运到城里，纳卢迈人闻到河面飘来的榴莲香，就知道「河送果子来了」。维兰塔植物园的研究员每到周末给游客讲解，哪些果树是从远方引种来的，哪些是长夏群岛土生土长的。"
    en: "Nalumai City lies on the eastern part of the main island's north-west coast, with 600,000 people over some 85,000 km²; its name means 'pearl in the waves' in Ivuran. The Nalusiru River, about 430 km long and the territory's second-longest, rises in the highlands of the central island and flows north-west through Nalumai's hills and orchard plain to reach the sea in the town, its lower banks lined with mango and durian orchards and rice fields. Inland, the hills of Tovulu District reach the northern slopes of the Unokesu Mountains, rising to nearly 2,400 m. Lying towards the north-eastern end of the main island, Nalumai has two or three almost rainless months in the dry season, a tropical savanna climate with about 1,300 mm of rain a year.\nThe Mailua Pearl Farm on the coast of Mailua District produces the territory's famous white pearls, with the bay's water tested monthly by the territory and stocking densities capped; the plain of Parantu District is covered in orchards of mango, durian, jackfruit, mangosteen and rambutan, and the fruit co-operative's refrigerated lorries carry fresh fruit to the port and airport every day; the Viranta Botanic Garden in Viranta District gathers tens of thousands of plant species from across the tropics, the largest botanic garden in the world and the territory's centre for plant research; and the hills of Tovulu are given over to rubber plantations, coconut groves and secondary forest. Tropical fruit, mariculture, tourism and research are the city's main trades, and output per head is about US$50,000. Along the seafront avenue of Senalu District, the town, stand the Senalu Pearl Market, seafood restaurants and holiday hotels, and the beaches and orchards draw plenty of holidaymakers. Nearly eight in ten residents are islanders, and many villages speak the northern dialect of Ivuran.\nBoth the Mirelan–Nalumai and the Talumaran–Nalumai High-Speed Railways end at Nalumai Station in Senalu, the first climbing onto the Hanupala Plateau to the capital, Mirelan, the second running through Unokari to Talumaran; the city's one metro line, about 6 km long, passes Nalumai Station. The Nalu Expressway runs along the north-west coast through Senalu, Parantu, Viranta and Mailua, the Imimu Expressway crosses inland Tovulu, and the Hanupala Plateau Road climbs from Mailua up onto the plateau. The City Diet has 51 seats; the mayor, Teluram Selomai, belongs to the Ivuran National Renewal Party and governs in coalition with the Social Democratic Mutual Aid Labour Party and the International Communist Party.\nNalumai's pearl farmers have an old Ivuran saying, \"Nalu kila, mai kila\", when the waves are bright the pearls are bright: only on calm days, when sunlight reaches down into the sea, is it time to dive and check the oysters, and on cloudy, windy days they mend nets on shore. Local families have a custom: when a child is born, they set aside a white pearl from that season's harvest and give it to the child on coming of age, strung as a necklace or set in a ring. The orchards of Parantu begin to harvest at the end of the dry season, roadside stalls are heaped with mangoes, durians and jackfruit, and in durian season the buses carry notices saying \"No durians\", though drivers often turn a blind eye to a busload of fruity air; orchard owners load fallen ripe durians onto small boats and float them down to town, and when the people of Nalumai smell durian drifting off the river, they know \"the river is bringing the fruit\". At weekends researchers at the Viranta Botanic Garden show visitors which fruit trees came from far away and which are native to the Everlong Summer Islands."
  codes:
    admin: '931100'
    unlocode: ES NLM
  population: 600000
  area_km2: 85000.0
  color: '#D08A3C'
  flag: { layout: ivuran, colors: ['#D08A3C', '#1F6F9E', '#FFFFFF', '#FFFFFF'], charge: pearl, charge_color: '#1F6F9E' }
  flag_notes:
    zh: "上橙黄、下海蓝，中间一道白色细条，正中白色圆徽里是一颗嵌在张开的扇贝里的珍珠。城名意为「浪中的珍珠」，珍珠来自迈卢阿区沿海的珍珠贝养殖场，橙黄是帕兰图平原上芒果和菠萝蜜的颜色，海蓝是浪花翻滚的海岸。古王国城镇的旗里只有纳卢迈用白色细条。"
    en: "Orange over sea blue, parted by a white stripe, with a pearl in an open scallop shell on a white disc. The name means 'pearl in the waves': the pearls come from the oyster farms of the coast, the orange is the mangoes and jackfruit of the plain and the blue the surf. It is the only flag of the old kingdom's towns with a white stripe."
  traits: { industries: [fruit, aquaculture, tourism, research], heritage: ivuran, age: balanced, income: 0.95 }
  symbols: {"flower": {"zh": "茉莉", "en": "Jasmine"}, "tree": {"zh": "吉贝", "en": "Kapok tree"}}
- id: div_afy2b3
  subtype: borough
  parent: div_bca7d9
  status: generated
  names:
    zh: 塞纳卢区
    en: Senalu District
    art-x-ivuran: Senalu
  notes:
    zh: "塞纳卢区是纳卢迈的城区，区名在伊武兰语里意为「浪的中心」，面积约 350 平方公里，人口 25 万，是全市人口最多的区。纳卢西鲁河在区里入海，海滨大道边是塞纳卢珍珠市场、海鲜餐馆和度假酒店，老城里有水果批发市场和果脯加工厂；商贸、旅游和食品与水产加工是区里的主要行业。塞纳卢珍珠市场里，迈卢阿湾出产的白珍珠在这里分级、拍卖和零售，每颗珍珠都附有产地和等级证书。\n居民近八成是伊武兰语母语者，许多人家世代做珍珠和水果生意。纳卢迈站在区里，米纳高速铁路和塔纳高速铁路在这里到达终点；地铁 1 号线从杭州路站经维兰塔湾大道站、茉莉街站和纳卢迈站到鲸歌站。纳卢高速从区里经过，塞纳卢—托武卢公路通往内陆的丘陵；托武大街、维兰塔湾大道、咖啡大街和马伊路是区里的主要街道。\n傍晚海滨的长堤上满是看日落的人，卖烤鱼和椰子水的小摊沿堤摆开。按纳卢迈的习俗，孩子出生时家人会从那一季的收成里挑一颗白珍珠收起来，等孩子成年时串成项链或镶成戒指，许多人家就是在珍珠市场里为孩子挑下那一颗。榴莲季里，水果批发市场从清晨就飘着浓浓的果香，公交车上的「请勿携带榴莲」告示常常形同虚设。"
    en: "Senalu District is the town of Nalumai; its name means 'heart of the waves' in Ivuran. It covers about 350 km² and has 250,000 people, the most of any district in the city. The Nalusiru River reaches the sea here; the seafront avenue is lined with the Senalu Pearl Market, seafood restaurants and holiday hotels, and the old town has a wholesale fruit market and candied-fruit workshops. Trade, tourism and food and seafood processing are the district's main trades. At the Senalu Pearl Market the white pearls of Mailua Bay are graded, auctioned and sold, each with a certificate of origin and grade.\nNearly eight in ten residents are native Ivuran speakers, and many families have dealt in pearls and fruit for generations. Nalumai Station is here, the terminus of the Mirelan–Nalumai and Talumaran–Nalumai High-Speed Railways; Metro Line 1 runs from Hangzhou Road through Viranta Bay Avenue, Jasmine Street and Nalumai Station to Whalesong. The Nalu Expressway crosses the district, and the Senalu–Tovulu Road leads inland to the hills; Tovu Boulevard, Viranta Bay Avenue, Coffee Boulevard and Mai Road are the main streets.\nIn the evening the seafront mole is crowded with people watching the sunset, with stalls selling grilled fish and coconut water all along it. By Nalumai custom, when a child is born the family sets aside a white pearl from that season's harvest to be strung as a necklace or set in a ring when the child comes of age, and many families choose that pearl here at the market. In durian season the wholesale fruit market smells richly of fruit from early morning, and the \"No durians\" notices on the buses are often a dead letter."
  codes:
    admin: '931101'
  population: 250000
  area_km2: 350.0
  traits: { industries: [commerce, tourism, food] }
- id: div_gkda74
  subtype: borough
  parent: div_bca7d9
  status: generated
  names:
    zh: 帕兰图区
    en: Parantu District
    art-x-ivuran: Parantu
  notes:
    zh: "帕兰图区是纳卢迈的果园平原，区名在伊武兰语里意为「果实累累」，面积约 3 万平方公里，人口 14 万。区域从沿海平原向内陆丘陵抬升，最高处海拔 1190 米，纳卢西鲁河的下游流过这里，两岸是芒果园、榴莲园和稻田。芒果、榴莲、菠萝蜜、山竹和红毛丹的果园一望无际，水果合作社的冷链车每天把鲜果运往港口和机场；热带水果、种植业和食品与水产加工是主要行业，第一产业占近四成。\n居民近八成讲伊武兰语，老年人比例在全市最高，梯田农民党在区里得票最多。纳卢高速沿西北海岸从区里穿过，合作社的冷链车沿高速把清晨采下的鲜果送到城区和港口；南岸大街、孔雀大道、维拉鲁大道和奥卢大道是集镇的主要街道。\n果园在旱季末开始收获，芒果、榴莲和菠萝蜜堆满了路边的果摊。榴莲季里，果园主人会把熟透落地的榴莲装上小船顺流运到城里，纳卢迈人闻到河面飘来的榴莲香，就知道「河送果子来了」。果农们守着一条老规矩：榴莲要等它自己落地才算熟透，从不上树去摘，所以收获季的夜里，果园里常有人搭棚守着，听见「咚」的一声就打着手电去捡。芒果季里，集镇的果摊把切好的青芒果蘸上辣椒盐卖，放学的孩子们人手一串。"
    en: "Parantu District is the orchard plain of Nalumai; its name means 'heavy with fruit' in Ivuran. It covers about 30,000 km² and has 140,000 people. The land rises from the coastal plain to inland hills reaching 1,190 m, and the lower Nalusiru flows through, its banks lined with mango and durian orchards and rice fields. Orchards of mango, durian, jackfruit, mangosteen and rambutan stretch as far as the eye can see, and the fruit co-operative's refrigerated lorries carry fresh fruit to the port and airport every day; tropical fruit, plantations and food and seafood processing are the main trades, and farming makes up nearly four-tenths of the economy.\nNearly eight in ten residents speak Ivuran, the share of older people is the highest in the city, and the Terrace Farmers' Party wins the most votes here. The Nalu Expressway crosses the district along the north-west coast, and the co-operative's lorries use it to rush fruit picked at dawn to the town and the port; South Bank Boulevard, Peacock Avenue, Vilaru Avenue and Olu Avenue are the main streets of the market towns.\nHarvest begins at the end of the dry season, and roadside stalls are heaped with mangoes, durians and jackfruit. In durian season orchard owners load fallen ripe durians onto small boats and float them down to town, and when the people of Nalumai smell durian drifting off the river, they know \"the river is bringing the fruit\". Growers keep an old rule: a durian is ripe only when it falls by itself, and no one climbs the tree to pick it, so on harvest nights someone often sits up in a shelter in the orchard, and at every thud goes out with a torch to collect the fruit. In mango season the fruit stalls of the market towns sell sliced green mango dipped in chilli salt, and every child on the way home from school has a skewer."
  codes:
    admin: '931102'
  population: 140000
  area_km2: 30000.0
  traits: { industries: [fruit, agriculture, food] }
- id: div_pfrpr2
  subtype: borough
  parent: div_bca7d9
  status: generated
  names:
    zh: 迈卢阿区
    en: Mailua District
    art-x-ivuran: Mailua
  notes:
    zh: "迈卢阿区是纳卢迈的珍珠海岸，区名意为「珍珠之海」，面积 1.5 万平方公里，人口 11 万。全区从海边的低地一直延伸到内陆海拔七百多米的丘陵，人口集中在沿海的渔村和小镇。迈卢阿湾面积约 120 平方公里，湾口的岬角挡住外海的风浪，平静的海湾里挂满珍珠贝的养殖笼；迈卢阿珍珠贝养殖场的育苗场和开贝车间就在湾岸，采珠人家世代在这里养珠、开贝、挑珠，出产纳卢迈有名的白珍珠。海湾的水质由领地按月监测，养殖密度有上限。海水养殖、渔业和旅游度假是全区的生计，近八成居民以伊武兰语为母语，老人比例偏高。纳卢高速沿海岸穿过全区，哈努帕拉高原公路从首府的高原一路盘旋下到迈卢阿的海岸，镇上的滨海大道和茶馆大街是最热闹的两条街。这里属热带草原气候，一年降水约 1300 毫米，一到三月几乎滴雨不下，正是游客最多的时候。\n采珠人有一句老话：「Nalu kila, mai kila」，意思是「浪亮的时候，珍珠也亮」，风平浪静、阳光透进海里的日子才下海看贝，阴天风大就在岸上补网。本地人家里添了孩子，家人会从那一季的收成里挑一颗白珍珠收起来，等孩子成年时串成项链送给他。傍晚茶馆大街的茶摊坐满了刚收工的养殖户，就着烤鱼和椰浆米饭聊今天的水色；从高原公路山腰的观景台往下望，湾里的养殖笼排成一行行，像海面上缝出的针脚。"
    en: "Mailua District is Nalumai's pearl coast; its name means 'sea of pearls', and it covers 15,000 km² with 110,000 people. It reaches from the lowlands by the sea to hills more than 700 metres high inland, and most people live in the fishing villages and small towns of the coast. Mailua Bay, about 120 km², is sheltered from the swell of the open sea by the headland at its mouth, and its calm waters are hung with the cages of pearl oysters; the hatchery and opening sheds of the Mailua Pearl Farm stand on its shore, and pearling families have raised, opened and sorted pearls here for generations, producing Nalumai's celebrated white pearls. The territory tests the water of the bay every month and caps how densely it may be farmed. Sea farming, fishing and holidaymakers are the district's living; nearly eight in ten residents speak Ivuran as their mother tongue, and the share of older people is high. The Nalu Expressway runs along the coast through the district, the Hanupala Plateau Road winds all the way down from the capital's plateau to the Mailua shore, and Seafront Avenue and Teahouse Boulevard are the liveliest streets in town. The climate is tropical savanna, with about 1,300 mm of rain a year and almost none from January to March, which is when visitors are most numerous.\nThe pearlers have an old saying, 'Nalu kila, mai kila', 'when the waves are bright, the pearls are bright': they go out to check the oysters only on calm days when the sun reaches down into the water, and on dull, windy days they stay ashore mending nets. When a child is born, the family picks one white pearl from that season's harvest and puts it away, to be strung into a necklace and given to the child on coming of age. In the evening the tea stalls on Teahouse Boulevard fill with farmers off work, talking over the colour of the water with grilled fish and coconut rice; and from the lookout halfway down the plateau road, the cages in the bay lie in rows like stitches sewn across the sea."
  codes:
    admin: '931103'
  population: 110000
  area_km2: 15000.0
  traits: { industries: [aquaculture, fishing, tourism] }
- id: div_a349sd
  subtype: borough
  parent: div_bca7d9
  status: generated
  names:
    zh: 维兰塔区
    en: Viranta District
    art-x-ivuran: Viranta
  notes:
    zh: "维兰塔区是维兰塔植物园所在的区，区名在伊武兰语里意为「花园」，面积约 8000 平方公里，人口 6 万。维兰塔植物园是世界最大的植物园，收集了热带各地的数万种植物，分成雨林、兰花、香料、棕榈和水生植物等园区，种质圃里活体保存着领地的各种作物和野生植物；研究人员在这里培育抗病的稻种和果树，园区向公众免费开放。植物园就在维兰塔湾畔的山坡上，这道狭长的海湾长约 26 公里，湾里的水生植物园区引海湾的潮水灌注。\n科研、旅游和自然保护是区里的主要行业，第三产业占八成以上；居民里有不少植物学家、园艺师和研究生，伊武兰语母语者仍近八成。纳卢高速从区里经过，游船从纳卢迈城区沿海岸开到湾里；东岗路、檀香大道和水牛大道是区里的主要街道。\n园里的研究员每到周末给游客讲解，哪些果树是从远方引种来的，哪些是长夏群岛土生土长的；兰花园里有一种只在晨雾里开放的白兰花，是游客清早排队来看的。涨潮时，水生植物园区里睡莲和水草随潮水一起起伏，游船船夫会特意在潮水最高的时候放慢船速，让游客看「会呼吸的花园」。植物园的种质圃里，研究员给每一株老品种的稻子和果树都挂了牌，写着它从哪个村社收集来，村里的老人来参观时，常常一眼认出自家的老稻种。"
    en: "Viranta District is home to the Viranta Botanic Garden; its name means 'garden' in Ivuran. It covers about 8,000 km² and has 60,000 people. The Viranta Botanic Garden is the largest botanic garden in the world, gathering tens of thousands of plant species from across the tropics in sections for rainforest, orchids, spices, palms and water plants, while its living collections keep the territory's crops and wild plants growing; researchers breed disease-resistant rice and fruit trees here, and entry is free. The garden lies on the hillside above Viranta Bay, a narrow inlet about 26 km long whose tides flow into the water-plant section.\nResearch, tourism and conservation are the district's main trades, and services make up more than four-fifths of the economy; among the residents are many botanists, gardeners and postgraduate students, though native Ivuran speakers are still nearly eight in ten. The Nalu Expressway crosses the district, and pleasure boats sail along the coast from the town of Nalumai into the bay; East Ridge Road, Sandalwood Avenue and Buffalo Avenue are the main streets.\nAt weekends the garden's researchers show visitors which fruit trees came from far away and which are native to the Everlong Summer Islands, and the orchid garden has a white orchid that opens only in the morning mist, for which visitors queue early. At high tide the water lilies and waterweeds of the water-plant section rise and fall with the sea, and boatmen deliberately slow down at the top of the tide so that visitors can see \"the breathing garden\". In the living collections researchers have tagged every old variety of rice and fruit tree with the village it was collected from, and elderly villagers visiting often recognise their own family's old rice at a glance."
  codes:
    admin: '931104'
  population: 60000
  area_km2: 8000.0
  traits: { industries: [research, tourism, conservation] }
- id: div_pr78k0
  subtype: borough
  parent: div_bca7d9
  status: generated
  names:
    zh: 托武卢区
    en: Tovulu District
    art-x-ivuran: Tovulu
  notes:
    zh: "托武卢区是纳卢迈内陆的丘陵，区名意为「山丘」，面积 3.2 万平方公里，是纳卢迈面积最大的区，却只有 4 万人，每平方公里一人多。丘陵从沿海平原背后层层升高，一直延伸到乌诺凯苏山脉北坡，最高处海拔近 2400 米，平均海拔七百多米，比海边凉快，年平均气温约 23 度，旱季的清晨偶尔降到十几度。丘陵上是橡胶园、椰林和次生林，种植业和林业与木材加工是全区的生计，锯木厂和木材加工厂把采伐许可内的木材加工成板材和家具料，采过的林地随即补种。村庄稀疏，散落在河谷和山脊之间，居民多是讲伊武兰语北部方言的本地人，母语为伊武兰语的约占七成四。伊米穆高速从丘陵间穿过，塞纳卢—托武卢公路约 160 公里，把内陆的村庄与纳卢迈城区塞纳卢区连在一起，村里的孩子每天坐校车沿这条路下山上学。\n伊武兰语北部方言开口音多，复数靠把词重叠来表示，托武卢的老人说话像唱歌，城里的年轻人回村，常被笑话「舌头变直了」。割胶的人半夜就要出门，头灯在橡胶林里一闪一闪，天亮前把胶杯里的胶乳收齐，太阳一晒，胶就不肯流了。村里的小镇往往只有一条主街，塞洛大街一类的街上有一家杂货铺、一间诊所和一个茶棚，流动医疗车每周进山一次，诊所门口总排着来量血压的老人。雨季的傍晚，山脊上的雾漫进河谷，村民们坐在高脚木屋的廊下剥椰子、听雨，说这是乌诺凯苏山「在呼气」。"
    en: "Tovulu District is the inland hill country of Nalumai; its name means 'hills', and at 32,000 km² it is the largest district in Nalumai, yet it has only 40,000 people, little more than one to the square kilometre. The hills rise in tiers behind the coastal plain all the way to the northern slopes of the Unokesu Mountains, reaching nearly 2,400 metres at the highest and averaging more than 700; it is cooler than the coast, with a mean annual temperature of about 23 °C, and on dry-season mornings it occasionally drops into the teens. The hills carry rubber gardens, coconut groves and regrown forest, and farming, forestry and timber are the district's living; sawmills and woodworking plants turn timber felled under licence into boards and furniture stock, and the cut-over land is replanted straight away. Villages are few and scattered between the valleys and ridges, and most people are islanders who speak the northern dialect of Ivuran, which is the mother tongue of about 74 per cent. The Imimu Expressway passes through the hills, and the Senalu–Tovulu Road, about 160 km long, links the inland villages to Senalu District in the city, the road the village children ride down by school bus every day.\nThe northern dialect of Ivuran is full of open syllables and makes plurals by doubling words, so the old people of Tovulu seem to sing as they talk, and young people home from town are teased that their 'tongues have gone straight'. Rubber tappers set out in the middle of the night, headlamps flickering among the trees, and gather the latex from the cups before dawn, because once the sun is up the latex will not flow. A village town often has a single main street, a Selo High Street of sorts with a general shop, a clinic and a tea shed; a mobile clinic drives into the hills once a week, and old people queue at the door to have their blood pressure taken. On wet-season evenings the mist slides off the ridges into the valleys, and villagers sit on the verandas of their stilt houses husking coconuts and listening to the rain, saying the Unokesu Mountains are 'breathing out'."
  codes:
    admin: '931105'
  population: 40000
  area_km2: 31650.0
  traits: { industries: [agriculture, forestry], heritage: ivuran }

