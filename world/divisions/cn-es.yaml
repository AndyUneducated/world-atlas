- id: div_2fhccc
  subtype: borough
  parent: div_5tgnmz
  status: generated
  names:
    zh: 塔卢区
    en: Talu District
    art-x-ivuran: Talu
  notes:
    zh: "塔卢区是塔卢马兰的市中心和老港，区名在伊武兰语里意为「停泊」，面积约 250 平方公里，人口 45 万，是全市人口最多的区。老码头的石砌防波堤和灯塔还在使用，海员会馆、老商行和鱼市沿港排开，塔卢西鲁河下游的老码头改成了海事博物馆和夜市；新的商业街和办公楼在老港背后的规划街区里。市政厅、海事法院和航运交易所都在区内，商贸、港口航运和文化遗产是区里的主要行业，人均产值约 7.7 万美元。\n居民以移民为主，中文最常用，伊武兰语母语者不到三成，劳动年龄人口占七成。塔卢马兰站在区里，长夏真空磁悬浮和塔纳高速铁路在这里停靠，地铁 1 号线从赫瓦鲁大街站经河畔站、塔卢马兰站和豆蔻街站到萤火街站，塞洛高速从区里经过，塔卢—伦博公路和塔卢—米纳萨公路通往船厂区和住宅区。珊瑚路、贝壳大道、库瓦拉大道和可可大街是主要街道，从老港乘渡轮可以到湾口的塔卢努岛。\n海事博物馆旁的夜市一到傍晚就亮起一串串灯笼，倒映在河面上，船厂下班的工人们说，在河边吃完一碗椰浆咖喱鱼，一天的累就随河水流走了。老海员会馆里至今挂着各国船员留下的旗子和照片，周末常有退休的老水手坐在门廊下，给年轻人讲当年在风暴里进湾避风的故事。"
    en: "Talu District is the city centre and old harbour of Talumaran; its name means 'anchoring' in Ivuran. It covers about 250 km² and has 450,000 people, the most of any district in the city. The stone breakwater and lighthouse of the old quay are still in use, the seamen's hall, old trading houses and the fish market line the harbour, and the old wharves on the lower Talusiru have become a maritime museum and a night market; new shopping streets and offices fill the planned blocks behind the old harbour. The city hall, the maritime court and the shipping exchange are all in the district, trade, ports and shipping and heritage are its main trades, and output per head is about US$77,000.\nMost residents are incomers, Chinese is the language most used, native Ivuran speakers are fewer than three in ten, and seven in ten people are of working age. Talumaran Station is here, served by the Everlong Summer Vacuum Maglev and the Talumaran–Nalumai High-Speed Railway; Metro Line 1 runs from Hevaru High Street through Riverside, Talumaran Station and Cardamom Street to Firefly Street; the Selo Expressway crosses the district, and the Talu–Lumbo Road and the Talu–Minasa Road lead to the shipyards and the residential district. Coral Road, Seashell Avenue, Kuvala Avenue and Cocoa Boulevard are the main streets, and ferries run from the old harbour to Talunu Island at the mouth of the bay.\nAs evening falls, strings of lanterns light up over the night market by the maritime museum and shine on the river, and shipyard workers off shift say a bowl of coconut curry fish by the water washes the day's tiredness away downstream. The old seamen's hall is still hung with flags and photographs left by sailors of many nations, and at weekends retired seafarers often sit in its porch telling young people how they ran into the bay to shelter from storms."
