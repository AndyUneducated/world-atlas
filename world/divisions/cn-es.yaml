  status: generated
  names:
    zh: 卢阿努区
    en: Luanu District
    art-x-ivuran: Luanu
  notes:
    zh: "卢阿努区是埃武托拉公社东北端的海岸和丘陵，区名意为「海边的沙」，面积约 9300 平方公里，人口 10 万。长长的白沙海滩上建有公社的疗养院和度假村，公社居民每年都有带薪假期可以免费入住；外来游客须向公社付费入住，收入归公社共有。丘陵最高不过两百来米，上面是公社的森林和水源保护地，护林员和巡护队常年在林中巡查。旅游度假、医疗与疗养和自然保护与巡护是全区的主业，约七成六的居民以伊武兰语为母语。埃武托拉湾面积约 95 平方公里，公社的渔港、公共浴场和海滨公园沿湾排开，湾畔的长堤是居民傍晚散步的地方。埃武托拉海岸公路约 125 公里，从公社中心哈马图区出发，经塔尼武区、帕卡里区沿东北海岸到卢阿努区，公社的公共汽车免费，沿线各村镇都有站点。这里是热带草原气候，一年降水约 1600 毫米，旱季的海滩最热闹。\n疗养院里住着刚做完手术的病人，也住着来休年假的一家老小，公社的说法是：「休息和看病一样，都是大家的事。」每逢节日，埃武托拉湾里的龙舟赛由各区的合作社组队参加，比赛没有奖金，赢的队伍只得到一面写着「Evu」的旗，下一年由他们负责请所有队伍吃饭，所以赢家常常笑着抱怨赢得太贵。周末居民骑着帕卡里造的自行车沿海岸公路来到卢阿努，路边的公社食堂免费供应椰浆焖鱼和热茶；傍晚贝壳路和潮汐路一带的海滩上，晚霞把白沙染成粉红色，度假村的孩子们在退潮的沙滩上捡贝壳。"
    en: "Luanu District is the coast and hills at the north-eastern end of Evutola Commune; its name means 'sand by the sea', and it covers about 9,300 km² with 100,000 people. The commune's convalescent homes and holiday villages stand along its long white beaches, where every resident may stay free on paid holidays; visitors from outside pay the commune to stay, and the income is shared by all. The hills rise no higher than about 200 metres and are the commune's forest and watershed reserves, patrolled all year by foresters and ranger teams. Holidays, health care and convalescence, and nature protection and patrol are the district's main work, and about 76 per cent of residents speak Ivuran as their mother tongue. Evutola Bay, about 95 km², is lined with the commune's fishing harbour, public baths and seaside park, and the long embankment by the bay is where residents take their evening stroll. The Evutola Coast Road, about 125 km long, sets out from Hamatu District, the commune's centre, and follows the north-east coast through Tanivu and Pakari districts to Luanu; the commune's buses are free, with stops in every village and town along the way. The climate is tropical savanna, with about 1,600 mm of rain a year, and the beaches are busiest in the dry season.\nThe convalescent homes hold patients just out of surgery alongside whole families on their annual leave, for, as the commune puts it, 'rest, like medicine, is everyone's business.' At festivals the dragon-boat race on Evutola Bay is contested by crews from the cooperatives of every district; there is no prize money, and the winners receive only a flag bearing the word 'Evu' and the duty of feeding every crew the following year, so winners often grumble with a smile that victory comes expensive. At weekends residents ride Pakari-made bicycles along the coast road to Luanu, where the commune canteens by the roadside serve coconut-braised fish and hot tea for free; and in the evening on the beaches around Seashell Road and Tide Road the sunset turns the white sand pink while children from the holiday villages collect shells on the ebbing tide."
  codes:
