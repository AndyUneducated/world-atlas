- id: div_a3c8d6
  subtype: borough
  parent: div_8hy4nc
  status: generated
  names:
    zh: 马伦杜尔区
    en: Marandur District
    art-x-ivuran: Marandur
  notes:
    zh: "马伦杜尔区是彭纳拉姆的城区，区名在伊武兰语里意为「树荫下的村」，面积约 300 平方公里，人口 30 万，几乎占全市人口的一半。城区的街巷沿着山坡层层展开，老港边的石砌香料仓库和老商行仍在使用。马伦杜尔香料市场是领地最大的香料集散地，大棚里堆满胡椒、豆蔻、肉桂和丁香，香料园的农户清早把货送来，批发商当天装车运往港口，出口前的香料都要在这里抽检。商贸、香料与可可和旅游是区里的主要行业。\n居民近八成是伊武兰语母语者，老年人约占三成，孩子不到一成，是全领地老龄化最明显的城区之一。彭纳拉姆站在区里，萨洛真空磁悬浮在这里停靠；地铁 1 号线从鹿鸣站经缆绳路站、织布大道站和奥鲁卡大道站到天文台站。纳卢高速从区里经过，帕拉武尔公路从这里出发通往高原，马伦杜尔—蒂拉凯公路通往海边的渔村。赫瓦鲁大街、盐仓路、石桥大道和织布大道是区里的主要街道。\n摊主们按祖传的方子现场调配香料，一个摊位常有几十种配方，每家的咖喱粉都不一样，熟客只认自家那一摊。香料园的老人们常说：「Kaina hevaru, oruka nalu」，意思是「香料乘风，船乘浪」。胡椒季的傍晚，老人们坐在树荫下挑拣胡椒粒，孙辈在一旁写作业，空气里的辛辣味让路过的外地人直打喷嚏。"
    en: "Marandur District is the town of Pennaram; its name means 'village in the shade' in Ivuran. It covers about 300 km² and has 300,000 people, almost half the city's population. Its streets and lanes climb the hillside in tiers, and the stone spice warehouses and old trading houses by the old harbour are still in use. The Marandur Spice Market is the territory's largest spice exchange: its great sheds are piled with pepper, cardamom, cinnamon and cloves, growers bring their crop in early in the morning, wholesalers load it the same day for the port, and every spice is sampled here before export. Trade, spices and cocoa and tourism are the district's main trades.\nNearly eight in ten residents are native Ivuran speakers, about three in ten are elderly and fewer than one in ten are children, making it one of the most aged urban districts in the territory. Pennaram Station is here, served by the Sarunnam–Lomiran Vacuum Maglev; Metro Line 1 runs from Deer Call through Ropewalk Road, Weavers' Avenue and Oruka Avenue to Observatory. The Nalu Expressway passes through, the Palavur Road starts here for the uplands, and the Marandur–Tirakkai Road leads to the fishing villages on the coast. Hevaru Boulevard, Salt Store Road, Stone Bridge Avenue and Weavers' Avenue are the main streets.\nStallholders blend spices on the spot to family recipes, a single stall often keeping dozens of blends and every curry powder different, and regulars will buy only from their own stall. Old spice growers like to say \"Kaina hevaru, oruka nalu\", spices ride the wind as ships ride the waves. On pepper-season evenings the old folk sit in the shade sorting peppercorns while their grandchildren do homework beside them, and the pungent air sets passing visitors sneezing."
  codes:
    admin: '930701'
  population: 300000
  area_km2: 300.0
  traits: { industries: [commerce, spice, tourism] }
- id: div_v7v7hg
  subtype: borough
  parent: div_8hy4nc
  status: generated
  names:
    zh: 埃拉库尔区
    en: Elakur District
    art-x-ivuran: Elakur
  notes:
    zh: "埃拉库尔区是彭纳拉姆背后的香料山地，区名意为「豆蔻山」，面积 3 万平方公里，人口 15 万。胡椒藤攀在高大的遮阴树上，豆蔻长在林下，肉桂和丁香种在向阳的山坡；香料合作社统一晾晒、分级和销售，领地对农药使用和出口品质有严格的标准。香料与可可和种植业是全区的生计，许多家庭世代经营香料园，约八成居民以伊武兰语为母语，老人约占三成，年轻人不少去了城里。区内最高处是海拔 2264 米的凯纳峰，伊武兰语意为「香料」，山坡下部是咖啡园和可可园，中部是胡椒和豆蔻的林下种植园，山上是云雾林。伊米穆高速从山地间穿过；帕拉武尔公路约 410 公里，从彭纳拉姆城区马伦杜尔区出发，翻过帕拉武尔区的山地，经蒂拉凯区到埃拉库尔区，马伦杜尔香料市场的批发商每天清早开着货车沿这条路收货。这里一年日照超过 2500 小时，降水约 1900 毫米，旱季正好晾晒香料。\n胡椒收获的季节，家家户户的屋顶和院子里都铺满了晾晒的胡椒，空气里一股辛辣的香味，过路的司机常常被呛得打喷嚏，本地人笑说这是「彭纳拉姆的欢迎礼」。香料园的老人们常说：「Kaina hevaru, oruka nalu」，意思是「香料乘风，船乘浪」。凯纳峰的山坡上从下到上依次是咖啡、可可、胡椒和豆蔻，本地人开玩笑说，从山脚走到山腰，一路上就能把一顿早餐和晚餐的香料都采齐。合作社的晒场旁总有一口大锅，煮着加了豆蔻的浓咖啡，分级的工人一边挑胡椒一边喝。"
    en: "Elakur District is the spice country in the hills behind Pennaram; its name means 'cardamom hills', and it covers 30,000 km² with 150,000 people. Pepper vines climb tall shade trees, cardamom grows beneath the forest, and cinnamon and cloves on the sunny slopes; spice cooperatives dry, grade and sell the crop, and the territory sets strict standards for pesticide use and export quality. Spices, cocoa and farming are the district's living, and many families have run spice gardens for generations; about eight in ten residents speak Ivuran as their mother tongue, and some three in ten are elderly, many of the young having left for the city. The district's highest point is Mount Kaina, 2,264 metres, whose name is Ivuran for 'spice'; coffee and cocoa gardens cover its lower slopes, pepper and cardamom grow under the trees halfway up, and cloud forest crowns the top. The Imimu Expressway passes through the hills, and the Palavur Road, about 410 km long, sets out from Marandur District in the city, crosses the mountains of Palavur District and runs through Tirakkai District to Elakur; wholesalers from the Marandur Spice Market drive out along it every morning to buy. There are more than 2,500 hours of sunshine a year and about 1,900 mm of rain, and the dry season is just right for drying spices.\nIn the pepper harvest every roof and yard is spread with drying peppercorns, the air is pungent with them, and passing drivers are often set sneezing, which locals laughingly call 'Pennaram's welcome'. The old spice growers like to say, 'Kaina hevaru, oruka nalu', 'spice rides the wind, as the boat rides the waves'. Up the slopes of Mount Kaina come coffee, cocoa, pepper and cardamom in turn, and locals joke that walking from the foot of the mountain halfway up, you can gather all the spices for both breakfast and dinner. Beside every cooperative's drying floor there is always a big pot of strong coffee brewed with cardamom, and the graders sip from it as they sort the pepper."
  codes:
