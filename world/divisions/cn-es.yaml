# ── 彭纳拉姆市──
- id: div_8hy4nc
  subtype: locality
  parent: div_nwm019
  status: generated
  names:
    zh: 彭纳拉姆市
    en: Pennaram City
    art-x-ivuran: Pennaram
  notes:
    zh: "彭纳拉姆市是主岛西北海岸西段的香料之城，全市 65 万人，面积约 8 万平方公里，城名在伊武兰语里意为「胡椒之城」。城区在马伦杜尔区，沿山坡层层展开；背后的埃拉库尔区和帕拉武尔区是香料山地和高原，一直延伸到蒂拉凯苏山脉北坡，最高处海拔 2392 米，蒂拉凯苏山脉西南段的凯纳峰海拔 2264 米，海拔 1502 米的彭纳瓦苏山口是翻越山脉通往哈努西鲁河谷的通道，旧时香料商队从这里把胡椒运往三角洲。约 180 公里长的彭纳西鲁河在西南的蒂拉凯湾入海，约 250 公里长的凯纳西鲁河流经帕拉武尔区，在区北入海。\n山坡上的香料园种植胡椒、豆蔻、肉桂和丁香，胡椒藤攀在高大的遮阴树上，豆蔻长在林下；内陆高地种咖啡和可可，香料合作社统一晾晒、分级和销售。马伦杜尔区的马伦杜尔香料市场是领地最大的香料集散地，出口前的香料都要在这里抽检；沿海的蒂拉凯区是渔村和海滩，家庭旅馆以看日落闻名。香料与可可、种植业、食品与水产加工和旅游是全市的主要行业，第一产业占两成以上，人均产值约 4.8 万美元。古王国时代起，香料就从这里的港口运往远方，河口的老仓库如今是香料博物馆。全市本地人近八成，许多家庭世代经营香料园；老年人约占三成，是领地老龄化程度最高的城市之一。\n萨洛真空磁悬浮在马伦杜尔区的彭纳拉姆站停靠，向南通萨伦纳姆，向东北通洛米兰；城里有一条约 5 公里的地铁。纳卢高速沿西北海岸经过城区，伊米穆高速穿过埃拉库尔区的香料山地，400 多公里的帕拉武尔公路把城区、高原和山地连成一圈，马伦杜尔—蒂拉凯公路通往海边的渔村。市议会 51 席，市长沈若溪来自伊武兰民族复兴党，与社会民主互助工党和国际共产党联合执政，投票率八成七。\n胡椒收获的季节，家家户户的屋顶和院子里都铺满了晾晒的胡椒，外地人进城没多久就忍不住打喷嚏，本地人笑说这是「彭纳拉姆的欢迎礼」。香料园的老人们常说一句伊武兰语：「Kaina hevaru, oruka nalu」，意思是「香料乘风，船乘浪」：香料的香气能传多远，彭纳拉姆的名声就能传多远。香料市场里，摊主们按祖传的方子现场调配香料，一个摊位常有几十种配方，每家的咖喱粉都不一样，熟客只认自家那一摊。本地的招牌菜是黑胡椒炒蟹和香料烤鸡，配一杯加了豆蔻的浓咖啡；可可豆被磨成浓稠的热可可，在雨季的傍晚最受欢迎。香料博物馆的馆员说，彭纳拉姆的老房子多半是用河运出去的胡椒盖起来的。"
    en: "Pennaram City is the spice city of the western part of the main island's north-west coast, with 650,000 people over some 80,000 km²; its name means 'pepper city' in Ivuran. The town is in Marandur District, climbing the hillside in tiers; behind it Elakur and Palavur Districts are spice hills and uplands reaching up the northern slopes of the Tirakesu Mountains to a highest point of 2,392 m. Mount Kaina in the south-western Tirakesu rises to 2,264 m, and the Pennavasu Pass, 1,502 m, is the way over the range to the Hanusiru valley, by which spice caravans once carried pepper down to the delta. The Pennasiru River, about 180 km long, enters the sea in Tirakkai Bay to the south-west, and the Kainasiru, about 250 km long, flows through Palavur to the sea in the north of the district.\nThe spice gardens on the hillsides grow pepper, cardamom, cinnamon and cloves, with pepper vines climbing tall shade trees and cardamom growing beneath them; coffee and cocoa grow in the uplands inland, and spice co-operatives dry, grade and sell the crop together. The Marandur Spice Market in Marandur District is the territory's largest spice exchange, where all spices are sampled before export; Tirakkai District on the coast is a place of fishing villages and beaches whose guesthouses are known for their sunsets. Spices and cocoa, plantations, food and seafood processing and tourism are the city's main trades, farming makes up more than a fifth of the economy, and output per head is about US$48,000. Spices have left this harbour for distant places since the days of the old kingdom, and the old warehouses at the river mouth now house a spice museum. Nearly eight in ten residents are islanders, many families have run spice gardens for generations, and with about three in ten people elderly, it is one of the oldest cities in the territory.\nThe Sarunnam–Lomiran Vacuum Maglev stops at Pennaram Station in Marandur, running south to Sarunnam and north-east to Lomiran, and the city has one metro line of about 5 km. The Nalu Expressway passes the town along the north-west coast, the Imimu Expressway crosses the spice hills of Elakur, the 400-km Palavur Road loops through the town, the uplands and the hills, and the Marandur–Tirakkai Road leads to the fishing villages on the coast. The City Council has 51 seats; the mayor, Shen Ruoxi, belongs to the Ivuran National Renewal Party and governs in coalition with the Social Democratic Mutual Aid Labour Party and the International Communist Party, and turnout is 87 per cent.\nAt pepper harvest every roof and yard is spread with pepper drying in the sun, and visitors start sneezing soon after arriving, which locals laughingly call \"Pennaram's welcome\". Old spice growers like an Ivuran saying, \"Kaina hevaru, oruka nalu\", spices ride the wind as ships ride the waves: as far as the scent of spice can travel, so far will Pennaram's name. In the spice market, stallholders blend spices on the spot to family recipes, a single stall often keeping dozens of blends and every curry powder different, and regulars will buy only from their own stall. The local signature dishes are black-pepper crab and spiced roast chicken with a strong cardamom coffee, and cocoa beans are ground into a thick hot chocolate, a favourite on wet-season evenings. The curators of the spice museum say that most of Pennaram's old houses were built on the pepper shipped down the river."
