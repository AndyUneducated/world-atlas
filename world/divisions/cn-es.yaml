  names:
    zh: 基鲁迈市
    en: Kirumai City
    art-x-ivuran: Kirumai
  notes:
    zh: 主岛西南端外基鲁迈群岛上的城市，全市 40 万人，城名和群岛名意为「一串珍珠」。六座岛屿从主岛西南端向南延伸、再向东弯成弧形，岛上是白沙海滩、珊瑚礁和传统村落，海岛度假和潜水是主要产业；马拉坎珊瑚礁保护区保护着大片完好的珊瑚礁。本地人约占八成，许多村落仍按伊武兰人的传统划船出海、分享渔获。群岛东端以东外海的瓦希拉群岛是海军基地，也归基鲁迈市管辖。
    en: The city of the Kirumai Islands off the south-western end of the main island, with 400,000 people; the name of the city and the islands means 'a string of pearls'. Six islands run south from the tip of the main island and curve round to the east, with white beaches, coral reefs and traditional villages, and island holidays and diving are the main business; the Malakan Coral Reef Reserve protects wide stretches of unspoilt reef. About four in five people are islanders, and many villages still put to sea in their boats and share the catch in the Ivuran way. The Vahira Islands, the naval base far out at sea beyond the eastern end of the chain, also come under Kirumai.
  codes:
    admin: '931200'
    unlocode: ES KRM
  population: 400000
  area_km2: 55000.0
  color: '#1C9BD1'
  flag: { layout: ivuran, colors: ['#1C9BD1', '#F2E3B3', '#E9B949', '#FFFFFF'], charge: turtle, charge_color: '#1C7FB0' }
  flag_notes:
    zh: "上天蓝、下沙黄，中间一道金色细条，正中白色圆徽里是一只蓝色海龟。城名和群岛名意为「一串珍珠」，天蓝是珊瑚礁环抱的海水，沙黄是白沙海滩，海龟在马拉坎珊瑚礁保护区的沙滩上产卵，也是村里按传统划船出海的人敬重的动物。"
    en: "Sky blue over sand, parted by a gold stripe, with a blue sea turtle on a white disc. The name means 'a string of pearls': the blue is the water inside the reefs, the sand the white beaches, and the turtle, which nests on the beaches of the coral reef reserve, is honoured by the villagers who still put to sea in the traditional way."
  traits: { industries: [tourism, fishing, conservation], heritage: ivuran, age: balanced, income: 1.0 }
