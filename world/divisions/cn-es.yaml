    en: The town of Nalumai; its name means 'heart of the waves'. The seafront avenue is lined with the pearl market, seafood restaurants and holiday hotels, and the old town has the fruit wholesale market and dried-fruit works; at sunset the long seawall is full of people watching the sky.
