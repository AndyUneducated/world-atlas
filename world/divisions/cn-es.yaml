  names:
    zh: 蒂卢迈区
    en: Tilumai District
    art-x-ivuran: Tilumai
  notes:
    zh: "蒂卢迈区就是群岛第二大岛蒂卢迈岛，区名在伊武兰语里意为「三颗珍珠」，面积约 1.2 万平方公里，人口 6 万。岛上地势平缓，最高处海拔四百多米；岛周围的珊瑚礁和海底峭壁是有名的潜水地，蒂卢迈潜水度假村和潜水学校沿西岸排开。领地规定每处潜点每天的潜水人数，船只只能系在浮标上，不准抛锚。旅游和渔业是岛上的主要行业，第三产业占七成以上。\n居民八成是伊武兰语母语者，伊武兰民族复兴党在岛上得票最多。基鲁迈群岛高速经约 43 公里长的卡朗加特大桥从基鲁迈岛跨海而来，穿过全岛后再跨海通往奥罗武岛，全程不限速；度假的游客多半开车从迈萨里来，也有人乘渡轮。扶桑大道、磨坊大道和红树大道是岛上集镇的主要街道。\n潜水教练都有一份私藏的「海底地图」，标着哪块礁石下住着哪条海鳝，新学员第一次下水，教练总会先带去跟最温顺的那条「打个招呼」。潜水向导大多是本地渔民的孩子，他们给礁石上的大石斑鱼都起了名字，带客人下水时像介绍邻居一样介绍它们。傍晚，潜水的人坐在西岸的沙滩上看日落，渔家端来刚烤好的鱼，配青柠和辣椒。每年的登陆节，岛上的独木舟船队也会从这里出发，划往奥罗武岛。"
    en: "Tilumai District is Tilumai Island, the second-largest in the archipelago; its name means 'three pearls' in Ivuran. It covers about 12,000 km² and has 60,000 people. The island is gently rolling, rising no higher than 400-odd metres; the coral reefs and undersea cliffs around it are famous dive sites, and the Tilumai Dive Resort and diving schools line the west coast. The territory caps the number of divers at each site every day, and boats may only tie up to buoys, never drop anchor. Tourism and fishing are the island's main trades, and services make up more than seven-tenths of the economy.\nEight in ten residents are native Ivuran speakers, and the Ivuran National Renewal Party wins the most votes on the island. The Kirumai Islands Expressway arrives from Kirumai Island over the Karanga Sea Bridge, about 43 km long, crosses the whole island and goes on over the sea to Orovu, with no speed limit all the way; most holidaymakers drive over from Maisari, though some come by ferry. Hibiscus Avenue, Mill Avenue and Mangrove Avenue are the main streets of the island's market towns.\nEvery diving instructor keeps a private \"underwater map\" of which moray lives under which rock, and on a new pupil's first dive the instructor always takes them to \"say hello\" to the gentlest one. Most dive guides are the children of local fishermen, who have named every big grouper on the reef and introduce them to their guests like neighbours. In the evening divers sit on the west-coast beaches watching the sunset while fishing families bring them freshly grilled fish with lime and chilli. Each year at the Landing Festival, the island's fleet of dugout canoes also sets out from here to paddle to Orovu."
  codes:
    admin: '931203'
  population: 60000
  area_km2: 12000.0
  traits: { industries: [tourism, fishing] }
- id: div_qsykjk
