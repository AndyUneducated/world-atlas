  names:
    zh: 奥罗武区
    en: Orovu District
    art-x-ivuran: Orovu
  notes:
    zh: "奥罗武区就是基鲁迈群岛中部的奥罗武岛，区名意为「老家」，面积 9000 平方公里，人口 5 万。在伊武兰人的传说里，这里是祖先渡海登陆的地方。全岛地势低缓，最高处不过三百多米，属热带雨林气候，一年降水两千五百多毫米，月月有雨。岛上的村落保留着最完整的传统，长屋、船屋和祭祀场按古老的格局排列；游客须经村社同意才能进入村落，入村许可由奥罗武岛的岛议会管理，岛议会还管渔场、村社土地和学校。渔业和种植业是全岛的生计，村民在礁湖里打鱼，在长屋后面种芋头、香蕉和椰子，约七成三的居民以伊武兰语为母语。基鲁迈群岛高速从基鲁迈岛的迈萨里区出发，经卡朗加区和蒂卢迈岛跨海而来，终点就在奥罗武岛，岛民去主岛办事、游客来岛上看村落都走这条路。\n每年的登陆节是奥罗武最隆重的日子，各岛的独木舟船队都会划到这里，在黎明时分同时冲上沙滩，第一条船的桨手要把一捧沙带回自己的岛，撒在家门口，岛民说这样祖先就认得回家的路。节日前几周，各村的船屋里就响起刨木头和试鼓的声音，年轻人跟着老人学划桨的号子。平日里村落按老规矩出海，回港后把渔获在沙滩上分成一堆堆，老人、孩子和没出海的人家也有一份。长屋前的空地傍晚最热闹，炭火上烤着鱼，配着青柠、辣椒和椰浆煮的芋头，老人们给孩子讲祖先的船是从哪个方向的海面上来的。"
    en: "Orovu District is Orovu Island, in the middle of the Kirumai group; its name means 'old home', and it covers 9,000 km² with 50,000 people. In Ivuran legend this is where the ancestors first came ashore from across the sea. The island is low and gentle, nowhere much over 300 metres, with a tropical rainforest climate, more than 2,500 mm of rain a year and rain in every month. Its villages keep the old ways most completely, longhouses, boathouses and ceremonial grounds laid out in the ancient pattern; visitors may enter a village only with its leave, and entry permits are managed by the Orovu island council, which also looks after the fishing grounds, village land and schools. Fishing and farming are the island's living: villagers fish in the lagoons and grow taro, bananas and coconuts behind the longhouses, and about 73 per cent of residents speak Ivuran as their mother tongue. The Kirumai Islands Expressway sets out from Maisari District on Kirumai Island and comes across the sea by way of Karanga District and Tilumai Island to end on Orovu, the road islanders take to the main island on business and visitors take to see the villages.\nThe yearly Landing Festival is Orovu's greatest day: canoe fleets from every island paddle here and run up onto the beach together at dawn, and a paddler from the first boat carries a handful of sand home to scatter at the door, so that, the islanders say, the ancestors will know the way home. For weeks beforehand the boathouses ring with planing and drum practice, and the young learn the paddling chants from their elders. On ordinary days the villages go to sea by the old rules, and back in harbour the catch is divided into heaps on the sand, with a share for the old, the children and the households that stayed ashore. The open ground in front of the longhouses is liveliest in the evening, with fish grilling over charcoal, served with lime, chilli and taro cooked in coconut milk, while the old people tell the children from which direction over the sea the ancestors' boats first came."
  codes:
    admin: '931204'
  population: 50000
  area_km2: 9000.0
  traits: { industries: [fishing, agriculture] }
- id: div_5z620y
  subtype: borough
  parent: div_xp7ha2
  status: generated
  names:
    zh: 马拉坎珊瑚礁保护区
    en: Malakan Coral Reef Reserve
    art-x-ivuran: Malakan
  notes:
    zh: "马拉坎珊瑚礁保护区由群岛最南端的马拉坎岛和周围的珊瑚礁组成，名字在伊武兰语里意为「花园之海」，面积约 7000 平方公里，整片划为保护区，常住人口约 8000 人。马拉坎岛是一座低平的岛屿，面积约 6500 平方公里，最高处海拔一百多米。礁盘上栖息着海龟、蝠鲼和上千种珊瑚鱼，海龟在岛上的沙滩产卵；马拉坎珊瑚礁保护站监测水温和珊瑚白化，培育珊瑚苗用于修复礁区。保护区只允许有许可的小船进入，禁止捕捞，潜水和游船都要按名额预约。\n岛上的常住居民大多在保护区工作，自然保护、旅游和科研几乎是全部的生计，伊武兰语母语者约占四分之三。马拉坎岛不通公路，游客须从迈萨里渡轮码头乘船，或随保护站的船只进入。联合邦议会给马拉坎岛单独设了一个选区，有 3 席，岛民在议会里最关心的是珊瑚礁保护和旅游名额。\n孩子们放学后跟着巡护员数海龟巢，谁先数到一百个巢，就能给下一只孵出的小海龟起名字。保护站的珊瑚苗圃挂在水下的架子上，像一排排小树，志愿潜水员每月下水一次，把长大的珊瑚苗移种到白化过的礁石上。站里的研究员说，一株珊瑚苗长到拳头大要一两年，所以每一块重新长满珊瑚的礁石，都记着志愿者的名字。"
    en: "The Malakan Coral Reef Reserve is made up of Malakan Island, the southernmost of the archipelago, and the reefs around it; its name means 'garden sea' in Ivuran. It covers about 7,000 km², all of it protected, and has some 8,000 residents. Malakan is a low, flat island of about 6,500 km², rising no higher than 100-odd metres. Turtles, manta rays and more than a thousand kinds of reef fish live on the reef flats, and turtles nest on the island's beaches; the Malakan Coral Reef Station monitors water temperature and coral bleaching and grows coral seedlings to restore damaged reefs. Only licensed small boats may enter the reserve, fishing is banned, and diving and boat trips must be booked within quotas.\nMost residents work for the reserve, conservation, tourism and research providing almost every livelihood, and about three-quarters are native Ivuran speakers. Malakan has no roads, so visitors must take a boat from the Maisari Ferry Terminal or go in with the station's own boats. The Commonwealth Assembly gives Malakan a constituency of its own with 3 seats, and what islanders care about most in the Assembly is reef protection and tourism quotas.\nAfter school children help the rangers count turtle nests, and whoever reaches a hundred first gets to name the next hatchling. The station's coral nursery hangs on underwater racks like rows of little trees, and once a month volunteer divers go down to plant the grown seedlings on bleached reefs. Researchers at the station say a seedling takes a year or two to grow to the size of a fist, so every reef that has grown back over is recorded with the names of its volunteers."
  codes:
    admin: '931205'
  population: 8000
  area_km2: 7000.0
  special_status: nature_reserve
  traits: { industries: [conservation, tourism, research] }
- id: div_xazhxw
  subtype: borough
  parent: div_xp7ha2
  status: generated
  names:
    zh: 皮卢区
    en: Pilu District
    art-x-ivuran: Pilu
  notes:
    zh: "皮卢区是基鲁迈群岛东端的两座小岛，区名意为「小船」，面积 6500 平方公里，人口 5 万。较大的皮卢岛上有渔港，较小的皮卢尼岛是六座岛屿中最小的一座，岛上有小型度假村和指引航道的灯塔；两岛之间是宽约 23 公里的皮卢海峡，伊武兰语名意为「小船的水道」，两岸各有一座灯塔。岛上地势低平，最高处不到三百米，属热带雨林气候，一年降水两千六百多毫米。渔业和旅游度假是全区的生计，渔民从皮卢岛南边的渔港出海，在礁外的深水里钓金枪鱼，约七成八的居民以伊武兰语为母语。皮卢区不通公路，与群岛其他岛屿靠渡轮往来。去往瓦希拉群岛的补给船从皮卢补给码头出发，每周把食品和燃料运往二百多公里外的海军基地，码头旁是小渔港和灯塔。在基鲁迈联合邦议会的选举里，皮卢岛和皮卢尼岛合为一个选区，瓦希拉群岛的官兵也在这里投票。\n渔民钓到第一条金枪鱼，要切下鱼腹最肥的一块，当场在船上蘸青柠和辣椒生吃，岛上叫它「海的头一口」，回港后整条鱼才拿去卖。皮卢尼岛的灯塔守护人一家三代住在岛上，灯塔的铜钟每到整点敲一次，皮卢岛的渔民说，听不见钟声的时候就是该回家的时候了。海峡两岸的灯塔一明一暗交替闪烁，渔民说这是两座岛在「说悄悄话」，夜里渡海时只要对准两盏灯中间走，就不会偏航。补给船出发前，码头上的渔家会往船上送一筐嫩椰子，说是给去远岛的人「带一口家里的水」。"
    en: "Pilu District is the two small islands at the eastern end of the Kirumai group; its name means 'little boat', and it covers 6,500 km² with 50,000 people. The larger, Pilu Island, has a fishing harbour, and the smaller, Piluni Island, the smallest of the six islands, has small resorts and a lighthouse guiding ships through the channel; between them lies the Pilu Strait, about 23 km wide, whose Ivuran name means 'little boats' channel', with a lighthouse on either shore. The islands are low and flat, nowhere reaching 300 metres, with a tropical rainforest climate and more than 2,600 mm of rain a year. Fishing and holidaymakers are the district's living: fishers sail from the harbour on the south side of Pilu Island to catch tuna in the deep water beyond the reef, and about 78 per cent of residents speak Ivuran as their mother tongue. No road reaches Pilu District, and it is linked to the other islands by ferry. Supply ships for the Vahira Islands sail from the Pilu Supply Quay, carrying food and fuel every week to the naval base more than 200 km away, with a small fishing harbour and a lighthouse beside the quay. In elections to the Commonwealth Assembly of Kirumai, Pilu and Piluni islands form a single constituency, and the service members of the Vahira Islands vote here too.\nWhen fishers land their first tuna, they cut the fattest piece from its belly and eat it raw on board, dipped in lime and chilli, which the islanders call 'the sea's first bite'; only back in harbour is the whole fish sold. The lighthouse keeper's family on Piluni Island has lived there for three generations, and the lighthouse's bronze bell strikes every hour; the fishers of Pilu say that when they can no longer hear the bell, it is time to go home. The lighthouses on either side of the strait flash in turn, one lit as the other goes dark, which the fishers call the two islands 'whispering', and crossing at night they steer for the gap between the two lights and never stray. Before a supply ship sails, the fishing families on the quay send a basket of young coconuts aboard, to give those bound for the far islands 'a mouthful of water from home'."
  codes:
    admin: '931206'
  population: 50000
  area_km2: 6500.0
  traits: { industries: [fishing, tourism] }
- id: div_ykkw7q
  subtype: borough
  parent: div_xp7ha2
  status: generated
  names:
    zh: 瓦希拉群岛管理区
    en: Vahira Islands Administration Zone
    art-x-ivuran: Vahira
  notes:
    zh: "瓦希拉群岛管理区是基鲁迈群岛以东外海的三座岛屿，名字意为「远方的岩石」，总面积约 500 平方公里，离最近的有人岛皮卢尼岛也有 200 多公里。群岛整片是海军基地，属军事区，常住的是约 1.2 万名官兵和文职技术人员；民政归基鲁迈联合邦管理，基地仍归中央，未经许可的船只和飞机不得靠近。瓦希拉岛是主岛，海军长夏舰队司令部的营区在岛东部的小镇旁，有司令部大楼、营房、医院、学校和商店，是群岛上唯一有成片住房的地方；瓦希拉地下作战指挥中心开凿在岛中部的山体里，由人工智能系统融合各方数据；岛南部的岛屿机场用电磁弹射器和拦阻索起降舰载战斗机，与卡朗加空军基地互为备降场。塔鲁卡岛的山体里是世界最大的潜艇洞库，可同时停靠十二艘潜艇，北岸是无人舰艇和水下无人航行器的自动化船坞。赫维拉岛上有定向能防空阵地，岛外是海上发电场、巨型浮动平台和深海研究站。三座岛围成的瓦希拉湾是舰队的锚地。淡水靠海水淡化厂，食品和燃料由皮卢补给码头出发的补给船每周运来，官兵在基鲁迈联合邦议会选举中到皮卢区投票。\n营区有一间对全体官兵开放的食堂，周末供应基鲁迈的炭烤鱼，水兵们说，轮岗离岛后最想念的不是海景，而是那盘烤鱼。演训结束回到湾里，舰艇会拉一声长笛，岸上的营区听到就知道「人都回来了」。塔鲁卡岛的老兵爱说「这里的海是竖着的」，赫维拉的潜航员下潜前在码头木桩上系一根彩绳，回来再解下。基鲁迈的渔民远远看见瓦希拉的灯光，会说一句「邻居还醒着」。"
    en: "The Vahira Islands Administration Zone is three islands far out at sea east of the Kirumai Islands; the name means 'distant rocks', and together they cover about 500 km², more than 200 km from Piluni, the nearest inhabited island. The islands are a naval base in their entirety and a military zone, home to about 12,000 service members and civilian technicians; civil affairs fall to the Commonwealth of Kirumai while the base remains under the central government, and no ship or aircraft may approach without permission. Vahira Island is the main island: the garrison of the Everlong Summer Fleet headquarters lies beside a small town in its east, with the headquarters building, barracks, a hospital, a school and shops, the only place in the group with housing in any number; the Vahira Underground Operations Centre is cut into the mountain at the island's heart, its artificial intelligence fusing data from every source; and the island airfield in the south launches and recovers carrier fighters with electromagnetic catapults and arrester wires, serving as an alternate for Karanga Air Base and it for the airfield. Inside the mountain of Taruka Island are the largest submarine pens in the world, berthing twelve submarines at once, and along its northern shore are the automated docks for uncrewed surface and underwater vessels. Hevila Island has the directed-energy air defence site, and offshore lie the power farm, a giant floating platform and the deep-sea station. Vahira Bay, enclosed by the three islands, is the fleet's anchorage. Fresh water comes from desalination plants, food and fuel arrive every week by supply ship from the Pilu Supply Quay, and the service members vote in Pilu District in elections to the Commonwealth Assembly of Kirumai.\nThe garrison has a canteen open to all ranks that serves Kirumai charcoal-grilled fish at weekends, and sailors say what they miss most after rotating off the islands is not the sea view but that plate of fish. When ships return to the bay after exercises they sound one long blast, and the garrison ashore knows 'everyone is back'. Old hands on Taruka like to say 'the sea here stands on end', and Hevila's submersible crews tie a coloured cord to a post on the quay before diving and untie it when they return. Kirumai fishers who glimpse the lights of Vahira far off say, 'The neighbours are still up.'"
  codes:
    admin: '931207'
  population: 12000
  area_km2: 500.0
  special_status: military_zone
  traits: { industries: [defence, research] }
