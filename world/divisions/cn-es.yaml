    en: Oluvar District
    art-x-ivuran: Oluvar
  notes:
    zh: 哈努西鲁河三角洲的稻作区，区名意为「稻田」，面积 3.2 万平方公里，是领地最大的稻米产区，一年两到三熟。河道和灌渠把稻田分成方格，村庄建在高出水面的台地上，雨季时许多地方要乘船往来。稻米合作社统一收购和加工，三角洲的香米出口到世界各地。
    en: The rice country of the Hanusiru delta; its name means 'paddy fields'. At 32,000 km² it is the territory's largest rice-growing area, with two or three harvests a year. Channels and irrigation canals divide the paddies into squares, villages stand on mounds above the water, and in the wet season many places are reached by boat. Rice cooperatives buy and mill the crop, and the delta's fragrant rice is sold all over the world.
  codes:
