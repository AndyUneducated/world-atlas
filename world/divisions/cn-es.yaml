- id: div_6cy2yw
  subtype: borough
  parent: div_mzhe0m
  status: generated
  names:
    zh: 坎达瓦区
    en: Kandava District
    art-x-ivuran: Kandava
  notes:
    zh: "坎达瓦区是温达坎的城区，在河谷里，区名在伊武兰语里意为「山间的门」，面积约 400 平方公里，人口 20 万，是全市人口最多的区。木结构的老房子沿山坡排开，商贸、旅游和高等教育是区里的主要行业，第三产业占近九成。温达坎梯田博物馆介绍梯田的修筑、灌溉和村社的用水规矩，馆外有一小片示范梯田，游客可以跟着村民插秧；农业学院研究梯田稻种和山地灌溉，每周的山货集市在这里开市。\n居民四分之三以上是伊武兰语母语者，老年人比例较高。温达坎站在区里，瓦洛高速铁路在这里停靠，伊米穆高速从区里穿过，温达坎梯田公路从这里出发通往东西两侧的梯田区；来看梯田的游客从这里换乘山区公交上山。渔市大街、萤火大街、萨伦纳姆大街和帕拉图马峰路是区里的主要街道。\n博物馆里陈列着村社用了几代的木鼓和刻着用水规矩的木板，插秧季的周末，游客可以跟着鼓点在示范梯田里学倒退着插秧，常常一脚踩深，引得村民哈哈大笑。山货集市上摆满梯田红米、竹筒饭、野蜂蜜和山里采的菌子，村民天不亮就背着竹篓下山赶集，卖完货再在河边的茶摊坐一坐，交换各村的消息。"
    en: "Kandava District is the town of Undakan, in a river valley; its name means 'gate in the hills' in Ivuran. It covers about 400 km² and has 200,000 people, the most of any district in the city. Old timber houses line the hillsides, trade, tourism and higher education are the main trades, and services make up nearly nine-tenths of the economy. The Undakan Terrace Museum explains how the terraces are built and watered and the village communities' rules for sharing water, with a small demonstration terrace outside where visitors can plant rice alongside villagers; the agricultural college studies terrace rice strains and hill irrigation, and the weekly hill-produce market is held here.\nMore than three-quarters of the residents are native Ivuran speakers, and the share of older people is high. Undakan Station, on the Vallikkai–Lomiran High-Speed Railway, is in the district, the Imimu Expressway crosses it, and the Undakan Terraces Road sets off from here for the terraced districts on either side; visitors change here onto the mountain buses up to the terraces. Fish Market Boulevard, Firefly Boulevard, Sarunnam Boulevard and Mount Palatuma Road are the main streets.\nThe museum shows wooden drums used by village communities for generations and wooden boards carved with the rules for sharing water, and on planting-season weekends visitors can learn to plant backwards to the drumbeat on the demonstration terrace, often sinking in too deep and setting the villagers roaring with laughter. The hill-produce market is piled with terrace red rice, bamboo-tube rice, wild honey and mushrooms gathered in the hills; villagers come down with bamboo baskets on their backs before dawn, and once they have sold their goods they sit for a while at the tea stalls by the river, trading news from village to village."
  codes:
    admin: '930801'
  population: 200000
  area_km2: 400.0
  traits: { industries: [commerce, tourism, education] }
- id: div_w2pbh1
  subtype: borough
  parent: div_mzhe0m
  status: generated
  names:
    zh: 佩伦达区
    en: Perunda District
    art-x-ivuran: Perunda
  notes:
    zh: "佩伦达区是温达坎东部的梯田区，区名意为「大台阶」，面积 3 万平方公里，人口 14 万。佩伦达梯田是世界最大的水稻梯田，成千上万块田顺着等高线环绕山坡，从河谷一直修到海拔一千多米的山腰；灌溉水从山顶的森林流下，一层层流过每块田，梯田的维护和用水由村社共同商定，代代相传，插秧和收割时节全村一起下田。梯田里一年只种一季稻，田里同时养着鱼和鸭。梯田稻作和旅游度假是全区的生计，约七成六的居民以伊武兰语为母语，老人约占三分之一。全区一直延伸到主岛南岸，海岸上的索里努岬伸出约 13 公里，伊武兰语意为「太阳之岬」，岬角朝向东南，是看日出的名胜，岬顶有灯塔和观日台。温达坎梯田公路约 450 公里，从西林达区出发，经乌拉韦劳自然保护区、城区坎达瓦区和托兰卡区，终点就在佩伦达区，沿山腰展线，最大坡度约 60‰；塞洛高速也从区内穿过。这里是热带雨林气候，一年降水约 2400 毫米。\n插秧的日子，全村人在田里排成一行，跟着田埂上木鼓的节拍，一边唱一边后退着插秧，鼓手通常是村里最年长的人，梯田公路上的游客隔着车窗都听得见鼓点。村里的老人常念「Uvesa lomi, olu unda」，意思是「雨落进森林，稻长上台阶」，所以砍山顶的树在这里是最大的忌讳。收割时捉起的稻田鱼和新米一起装进竹筒烤成竹筒饭，路边的村子摆出来招待过路的人，司机们管这叫「梯田路上的午饭」。新年黎明，索里努岬观日台上的人们会把一朵鸡蛋花抛向大海，灯塔守护人说，那天早上海面上全是白花。"
    en: "Perunda District is the terrace country east of Undakan; its name means 'great steps', and it covers 30,000 km² with 140,000 people. The Perunda Rice Terraces are the largest rice terraces in the world: tens of thousands of fields follow the contours around the slopes, climbing from the valley floors to more than 1,000 metres up the mountainsides, and water from the forests at the top runs down through each field in turn; the village communities agree together on upkeep and water, as they have for generations, and the whole village goes into the fields at planting and harvest. The terraces grow only one rice crop a year, with fish and ducks raised in the paddies at the same time. Terrace rice and holidaymakers are the district's living; about 76 per cent of residents speak Ivuran as their mother tongue, and about a third are elderly. The district reaches all the way to the south coast of the main island, where Cape Sorinu juts out about 13 km; its name is Ivuran for 'cape of the sun', it faces south-east and is a famous place to watch the sunrise, with a lighthouse and a sunrise terrace on its top. The Undakan Terraces Road, about 450 km long, sets out from Silinda District and runs by way of the Uravelau Nature Reserve, Kandava District in the city and Toranka District to end in Perunda, contouring along the mountainsides with gradients of up to about 60‰; the Selo Expressway also crosses the district. The climate is tropical rainforest, with about 2,400 mm of rain a year.\nOn planting days the whole village lines up in the field and plants backwards, singing, to the beat of a wooden drum on the bank, the drummer usually the oldest person in the village, and tourists on the terrace road can hear the beat through their car windows. The old people often recite, 'Uvesa lomi, olu unda', 'the rain falls into the forest, and the rice climbs the steps', which is why felling the trees on the hilltops is the gravest taboo here. At harvest the paddy fish are caught and packed with the new rice into bamboo tubes to roast, and the villages along the road set it out for passers-by, which drivers call 'lunch on the terrace road'. At dawn on New Year's Day people on the Cape Sorinu sunrise terrace throw frangipani flowers into the sea, and the lighthouse keeper says that on that morning the water is white with blossom."
  codes:
    admin: '930802'
  population: 140000
  area_km2: 30000.0
  traits: { industries: [rice, tourism] }
- id: div_9hrhrv
  subtype: borough
  parent: div_mzhe0m
  status: generated
  names:
    zh: 西林达区
    en: Silinda District
    art-x-ivuran: Silinda
  notes:
    zh: "西林达区是温达坎西部的梯田和山村，区名在伊武兰语里意为「西边的台阶」，面积约 3 万平方公里，人口 10 万。区域从河谷一直抬升到中脊高处，最高处海拔 3151 米，平均海拔七百多米，气候比城区凉爽，夜里常降到十六七度，雨水也多得多。山坡上的梯田顺着等高线一层层修上去，梯田间点缀着高脚木屋的村寨，村民在田里养鱼和鸭；梯田红米是这里的特产。梯田稻作、种植业和旅游是主要行业，第一产业占四成以上。\n居民八成是伊武兰语母语者，老年人约占三成，许多年轻人到城里或沿海工作，农忙时再回村帮忙。梯田的维护和用水由村社共同商定，每个村社都选出专人看护山顶的水源林。温达坎梯田公路从坎达瓦区的城区出发，一路盘旋上山，串起区里的村寨和梯田；风车大道、索里努大道和库瓦拉大道是集镇的主要街道。\n插秧的日子，全村人在田里排成一行，跟着田埂上木鼓的节拍后退着插秧。收割后，红米装进竹筒和稻田鱼一起烤成竹筒饭，是招待客人的大菜。村里的老人说，梯田红米之所以红，是因为它在云雾里长了一整季；外地游客买回去煮，常说怎么也煮不出村里那个香味，村民笑着说那是少了山上的泉水。"
    en: "Silinda District is the terraced hill country of western Undakan; its name means 'the western steps' in Ivuran. It covers about 30,000 km² and has 100,000 people. The land rises from the valleys high onto the spine, reaching 3,151 m with an average height of more than 700 m, and it is cooler than the town, with nights often falling to 16–17 °C, and much wetter. Terraces climb the hillsides along the contours, dotted with villages of stilt houses, and villagers raise fish and ducks in the paddies; terrace red rice is the local speciality. Terrace rice, plantations and tourism are the main trades, and farming makes up more than four-tenths of the economy.\nEight in ten residents are native Ivuran speakers and about three in ten are elderly; many young people work in town or on the coast and come home to help at the busy times. The upkeep of the terraces and the sharing of water are agreed by the village communities, and each community chooses people to guard the watershed forest on the summits. The Undakan Terraces Road sets off from the town in Kandava and winds up the mountains, linking the district's villages and terraces; Windmill Avenue, Sorinu Avenue and Kuvala Avenue are the main streets of the market towns.\nOn planting days the whole village lines up in the paddy and moves backwards as it plants, to the beat of a wooden drum on the bank. After harvest the red rice is packed into bamboo tubes with paddy fish and roasted, the great dish for guests. Village elders say terrace red rice is red because it spends a whole season growing in the clouds; visitors who take some home often complain they can never cook it to taste as it did in the village, and villagers laugh that they are missing the mountain spring water."
  codes:
    admin: '930803'
  population: 100000
  area_km2: 30000.0
  traits: { industries: [rice, agriculture, tourism] }
- id: div_47qks0
  subtype: borough
  parent: div_mzhe0m
  status: generated
  names:
    zh: 乌拉韦劳自然保护区
    en: Uravelau Nature Reserve
    art-x-ivuran: Uravelau
  notes:
    zh: "乌拉韦劳自然保护区是蒂拉凯苏山脉最高的一段，区名取自领地最高峰乌拉韦劳峰，意为「高处的云」，面积约 2.5 万平方公里，常住人口约 5000 人，多为护林员和山民。乌拉韦劳峰海拔 3179 米，峰顶常在云海之上；山腰以上是终年云雾缭绕的云雾林，树上挂满苔藓和兰花，林线以上是高山草甸。保护区里的翁贝尔韦劳湖面积约 130 平方公里，伊武兰语意为「云中之湖」，湖面常年笼罩在云雾里，湖水是山下梯田泉水的源头之一。\n保护区只开放几条徒步路线，登顶须有向导陪同；自然保护与巡护和旅游是这里几乎全部的生计。保护区里不通高速公路，护林员沿徒步小道巡山，记录云雾林里的兰花和鸟类；居民近八成讲伊武兰语，许多护林员本身就是山下梯田村社的子弟，世代看护这片水源林。\n温达坎的村社每年在翁贝尔韦劳湖边举行祭水仪式，各村的长者把一竹筒新米和一竹筒湖水交换，带回村里倒进最高的那块梯田，村民说这样「云里的水就认得我们的田」。山脚的村子相信峰顶的云是祖先在看护梯田，登山向导在登顶前总会停下来轻声打个招呼，下山时再把一小把梯田红米撒在山口。"
    en: "The Uravelau Nature Reserve is the highest stretch of the Tirakesu Mountains, named after the territory's highest peak, Mount Uravelau, whose name means 'high cloud'. It covers about 25,000 km² and has some 5,000 residents, mostly rangers and hill people. Mount Uravelau rises to 3,179 m, its summit often above a sea of cloud; above mid-height the slopes are cloaked in cloud forest wrapped in mist all year, its branches hung with moss and orchids, and above the tree line lie alpine meadows. Lake Ombelvelau in the reserve covers about 130 km²; its Ivuran name means 'lake in the clouds', its surface is shrouded in mist all year, and its water is one of the sources of the springs that feed the terraces below.\nOnly a few hiking routes are open, and climbers must be accompanied by a guide to the summit; conservation, patrols and tourism provide almost every livelihood here. No expressway enters the reserve, and rangers patrol on foot along the trails, recording the orchids and birds of the cloud forest; nearly eight in ten residents speak Ivuran, and many rangers are themselves the sons and daughters of the terrace villages below, guarding this watershed forest as their families have for generations.\nEvery year the village communities of Undakan hold a water ceremony by Lake Ombelvelau: elders from each village exchange a bamboo tube of new rice for a bamboo tube of lake water and carry it home to pour into the highest terrace, so that, as the villagers say, \"the water in the clouds will know our fields\". Villages at the foot of the mountain believe the clouds on the summit are their ancestors watching over the terraces, and mountain guides always stop to murmur a greeting before the summit, scattering a small handful of terrace red rice at the pass on the way down."
  codes:
    admin: '930804'
  population: 5000
  area_km2: 25000.0
  special_status: nature_reserve
  traits: { industries: [conservation, tourism] }
- id: div_gzefq6
  subtype: borough
  parent: div_mzhe0m
  status: generated
  names:
    zh: 托兰卡区
    en: Toranka District
    art-x-ivuran: Toranka
  notes:
    zh: "托兰卡区是温达坎北部的河谷区，区名在伊武兰语里意为「河谷的路」，面积约 1.5 万平方公里，人口 5.5 万。区域从河谷一直抬升到中脊，乌拉韦劳峰东北的蒂拉图马峰海拔 3071 米，是领地第二高峰，伊武兰语意为「古老的峰」；两峰之间是海拔 2739 米的乌拉瓦苏山口，只有徒步小道翻过，是领地最高的山口。蒂拉图马峰北坡的溪流汇入区里的河谷，为谷中的小水电站供水。\n河谷里有水电站和整齐的咖啡园，村庄沿河分布；雨季河水暴涨，沿河村庄都建在高出洪水线的台地上。种植业、林业木材加工和水力发电是主要行业，工业占近四成。居民八成是伊武兰语母语者，梯田农民党在区里得票最多。伊米穆高速沿河谷翻过山地通往洛米兰，是区里通往外界的主要道路；乌诺凯苏山脉大道、盐仓路和托马库路是集镇的主要街道。\n当地人管两座高峰叫「老两口」，乌拉韦劳峰是戴着云帽的老爷爷，蒂拉图马峰是在旁边陪着的老奶奶，云雾散开时两峰同时露出来，被认为是好兆头。乌拉瓦苏山口上有一块被苔藓覆盖的大石头，登山的人路过都会在石头上放一粒小石子，向导说这块石头已经被一代代人「垒高」了一截。咖啡收获季，河谷里飘着烘豆的香味，水电站的值班员下了班也会到咖啡园帮忙采果。"
    en: "Toranka District is the river-valley district in the north of Undakan; its name means 'the valley road' in Ivuran. It covers about 15,000 km² and has 55,000 people. The land rises from the valleys to the spine, where Mount Tiratuma, north-east of Mount Uravelau, reaches 3,071 m, the territory's second-highest peak, its Ivuran name meaning 'ancient peak'; between the two lies the Uravasu Pass, 2,739 m, crossed only by footpaths and the highest pass in the territory. Streams from the northern slopes of Mount Tiratuma feed the district's valleys and its small hydroelectric stations.\nThe valleys hold hydroelectric stations and neat coffee gardens, with villages strung along the rivers; the rivers rise sharply in the wet season, so riverside villages all stand on terraces above the flood line. Plantations, forestry and timber and hydroelectric power are the main trades, and industry makes up nearly four-tenths of the economy. Eight in ten residents are native Ivuran speakers, and the Terrace Farmers' Party wins the most votes here. The Imimu Expressway follows the valleys over the hills towards Lomiran and is the district's main link with the outside world; Unokesu Mountains Avenue, Salt Store Road and Tomaku Road are the main streets of the market towns.\nLocals call the two high peaks \"the old couple\": Mount Uravelau is the grandfather in his cap of cloud and Mount Tiratuma the grandmother keeping him company, and when the mist clears and both show at once it is taken as a good omen. On the Uravasu Pass stands a large moss-covered boulder on which every climber leaves a pebble, and guides say generations of them have \"built it up\" a good bit. At coffee harvest the valleys smell of roasting beans, and the duty staff at the power stations often go to help pick in the coffee gardens after their shift."
  codes:
    admin: '930805'
  population: 55000
  area_km2: 14600.0
  traits: { industries: [agriculture, forestry, hydropower] }

# ── 洛米兰市──
- id: div_k4tk68
  subtype: locality
  parent: div_nwm019
  status: generated
  names:
    zh: 洛米兰市
    en: Lomiran City
    art-x-ivuran: Lomiran
  notes:
    zh: "洛米兰市是主岛西北部的雨林之城，全市 35 万人，面积 14 万平方公里，是领地面积最大的市，城名在伊武兰语里意为「森林之地」。城区在西北海岸，背后是一直延伸到蒂拉凯苏山脉与哈努帕拉高原相接处的大片雨林，洛米哈努国家公园的最高峰洛米图马峰海拔 2771 米。洛米兰也是领地雨水最多的城市，一年降水近 2800 毫米。约 274 公里长的洛米西鲁河发源于哈努帕拉高原西北缘，跌落成瀑布后穿过雨林，在马纳卢区入海，河上没有水坝，雨季河水漫进森林，形成大片季节性的淹水林；卡塔西鲁河流经内陆的林区村落，雨林深处还有茶色的黑水湖洛米翁贝尔湖。城区西北的塔卡维岬伸出约 18 公里，是领地最突出的岬角。\n洛米哈努国家公园管理区覆盖全市一半的土地，保护着领地最大的热带雨林，低地雨林、沼泽林和山地雨林连成一片，栖息着犀鸟、云豹、长臂猿和上千种兰花。塔卡维区的塔卡维雨林树冠步道由吊桥和树上平台连成，在几十米高的树冠间蜿蜒约 5 公里，是世界最长的雨林树冠步道。雨林中的药用植物是长夏群岛生物医药研究的宝库，卢瓦纳区的洛米兰药用植物研究所为领地的生物医药研究提供样本，领地对采集和利用实行严格的许可和惠益分享，收益分给当地村社。自然保护、旅游、生物医药和科研是全市的主要行业，人均产值约 5.7 万美元。城区卢瓦纳区有雨林博物馆和每周的林产品集市，进出国家公园的游客和研究人员都从这里出发；马纳卢区是河口的渔港和海龟产卵海滩，卡塔穆区是采集藤条、蜂蜜和草药的林区村落。全市本地人约占七成五。\n洛米兰不建地铁。萨洛真空磁悬浮和瓦洛高速铁路都以卢瓦纳区的洛米兰站为终点，前者经彭纳拉姆通往萨伦纳姆，后者经温达坎通往瓦利凯，途中跨过约 75 公里长的洛米西鲁河特大桥，穿过约 47 公里长的蒂拉凯苏山脉隧道。伊米穆高速穿过塔卡维区，纳卢高速沿西北海岸经过卢瓦纳区和卡塔穆区，还有公路从城区通往国家公园和马纳卢海岸。市议会 47 席，市长拉韦卢·蒂拉森来自伊武兰民族复兴党，与社会民主互助工党和国际共产党联合执政。\n洛米兰人常说「Lomi uvesa, uvesa lomi」，意思是「森林生雨，雨生森林」，孩子从小就知道，树砍了，雨也就少了。雨林里的犀鸟是洛米兰的象征，伊武兰语叫它 kuvala，林中的向导说，犀鸟在午后成群叫起来，傍晚多半要下雨；犀鸟一生只认一个伴侣，所以本地的婚礼上，新人要互赠一根捡来的犀鸟羽毛。清晨走在树冠步道上，脚下是一片云海，偶尔能看见长臂的猿从步道旁荡过。洛米兰的吃食带着森林的味道：采蜜人攀上大树取下的野蜂蜜、雨林边种的山竹和红毛丹，还有用芭蕉叶包着香料和鱼烤成的叶包鱼。采药和采蜜都要先领许可，采蜜人还要把每次取蜜的树记在本子上，同一棵树一年只采一次。"
    en: "Lomiran City is the rainforest city of the north-west of the main island, with 350,000 people over 140,000 km², the largest city in the territory by area; its name means 'land of forest' in Ivuran. The town stands on the north-west coast, backed by a vast rainforest reaching to where the Tirakesu Mountains meet the Hanupala Plateau, and Mount Lomituma, the highest peak of Lomihanu National Park, rises to 2,771 m. Lomiran is also the wettest city in the territory, with nearly 2,800 mm of rain a year. The Lomisiru River, about 274 km long, rises on the north-western edge of the Hanupala Plateau, drops in waterfalls and runs through the rainforest to the sea in Manalu District; it has no dams, and in the wet season it spills into the forest to form great tracts of seasonally flooded woodland. The Katasiru River flows past the forest villages of the interior, and deep in the rainforest lies Lake Lomiombel, a tea-coloured blackwater lake. North-west of the town Cape Takavi reaches about 18 km into the sea, the most prominent cape in the territory.\nThe Lomihanu National Park Administration Zone covers half the city's land and protects the territory's largest tropical rainforest, where lowland rainforest, swamp forest and montane rainforest merge into one, home to hornbills, clouded leopards, gibbons and more than a thousand kinds of orchid. The Takavi Canopy Walkway in Takavi District, a chain of suspension bridges and tree platforms winding some 5 km through the canopy dozens of metres up, is the longest rainforest canopy walkway in the world. The rainforest's medicinal plants are a treasure house for biomedical research in the Everlong Summer Islands; the Lomiran Institute of Medicinal Plants in Luvana District supplies samples for the territory's research, and collection and use are subject to strict permits and benefit-sharing, with the proceeds shared among local villages. Conservation, tourism, biomedicine and research are the city's main trades, and output per head is about US$57,000. The town, Luvana District, has a rainforest museum and a weekly forest-produce market, and every visitor and researcher bound for the national park sets off from here; Manalu District has the fishing harbour at the river mouth and turtle-nesting beaches, and Katamu District is a land of forest villages that gather rattan, honey and herbs. About three-quarters of the residents are islanders.\nLomiran has no metro. Both the Sarunnam–Lomiran Vacuum Maglev and the Vallikkai–Lomiran High-Speed Railway end at Lomiran Station in Luvana, the first running through Pennaram to Sarunnam and the second through Undakan to Vallikkai, crossing on the way the Lomisiru River Bridge, about 75 km long, and running through the Tirakesu Mountains Tunnel, about 47 km. The Imimu Expressway crosses Takavi, the Nalu Expressway runs along the north-west coast through Luvana and Katamu, and roads lead from the town to the national park and the Manalu coast. The City Council has 47 seats; the mayor, Ravelu Tirasen, belongs to the Ivuran National Renewal Party and governs in coalition with the Social Democratic Mutual Aid Labour Party and the International Communist Party.\nThe people of Lomiran say \"Lomi uvesa, uvesa lomi\", the forest makes rain and rain makes the forest, and children learn early that when the trees are cut, the rain goes too. The hornbill, kuvala in Ivuran, is the city's emblem; forest guides say that when hornbills call together in the afternoon it will most likely rain by evening, and because hornbills keep one mate for life, couples at local weddings give each other a hornbill feather found on the forest floor. Early in the morning on the canopy walkway there is a sea of cloud below your feet, and now and then a long-armed ape swings past. Lomiran's food tastes of the forest: wild honey taken by honey hunters who climb the great trees, mangosteens and rambutans grown at the forest edge, and fish grilled with spices in a parcel of banana leaf. Gathering herbs and honey both need a permit first, and honey hunters must note in a book each tree they take honey from, for no tree may be harvested more than once a year."
