  names:
    zh: 萨卢瓦伊区
    en: Saluvai District
    art-x-ivuran: Saluvai
  notes:
    zh: "萨卢瓦伊区是瓦利凯城外的沿海和内陆，区名在伊武兰语里意为「盐风」，面积 5.2 万平方公里，只有 8 万人，是全市面积最大、人口最少的区。区域从萨卢瓦伊湾一直延伸到蒂拉凯苏山脉的南麓，最高处海拔 1939 米。萨卢瓦伊湾面积约 760 平方公里，湾内风浪小、滩涂宽，湾中的塞里努岛面积约 170 平方公里，渡船每天往返于岛和海岸之间；城东伸出约 13 公里的赫瓦鲁岬迎着季风，岬上建有风力发电场。\n沿海是鱼、虾和海藻的养殖场和晒盐场，内陆是稻田和椰林；海水养殖、种植业和渔业是主要行业，第一产业占近四成。养殖场按领地的环境标准运行，排水经过处理后才能入海。居民八成以上是伊武兰语母语者，老年人较多，梯田农民党在区里得票最多。坎纳鲁尔—萨卢瓦伊公路把湾岸的渔村和老城连起来；木棉大道、船坞大道和维拉鲁大道是渔镇的主要街道。\n养殖户清晨划着小船收海藻，晒干后做成咸香的海藻饼。塞里努岛的盐工凌晨就下田耙盐，太阳一高就收工，岛上的海盐被瓦利凯的厨师们称为「会说话的盐」。退潮后的滩涂上，孩子们提着竹篓捡螺和小蟹，回家用香茅和辣椒一炒，就是「海给的下酒菜」。赫瓦鲁岬下的小咖啡馆里，冲浪者盼浪，风电场的工程师盼风，两拨人最常聊的都是明天的天气预报。"
    en: "Saluvai District is the coast and hinterland outside Vallikkai; its name means 'salt wind' in Ivuran. It covers 52,000 km² and has only 80,000 people, the largest and least populous district in the city. It stretches from Saluvai Bay to the southern foot of the Tirakesu Mountains, reaching 1,939 m. Saluvai Bay, about 760 km², has little swell and wide tidal flats; Serinu Island in the bay covers about 170 km², with a ferry to the shore every day; and east of the city Cape Hevaru, reaching about 13 km out, faces the monsoon and carries a wind farm.\nThe coast is lined with fish, shrimp and seaweed farms and salt pans, and inland are paddies and coconut groves; mariculture, plantations and fishing are the main trades, and farming and fishing make up nearly four-tenths of the economy. The farms run to the territory's environmental standards, and their waste water is treated before it reaches the sea. More than eight in ten residents are native Ivuran speakers, older people are many, and the Terrace Farmers' Party wins the most votes here. The Kannarur–Saluvai Road links the fishing villages of the bay with the old town; Kapok Avenue, Dockyard Avenue and Vilaru Avenue are the main streets of the fishing towns.\nSeaweed farmers row out at dawn to gather their crop, which is dried and made into salty, savoury seaweed cakes. On Serinu Island the salt workers rake the pans from before dawn and stop when the sun is high, and Vallikkai's cooks call the island's sea salt \"the salt that talks\". On the flats at low tide children carry bamboo baskets to gather whelks and small crabs, which are stir-fried at home with lemongrass and chilli, \"the sea's gift to go with a drink\". In the little café below Cape Hevaru, surfers hope for waves and wind-farm engineers hope for wind, and both talk mostly about tomorrow's weather forecast."
  codes:
