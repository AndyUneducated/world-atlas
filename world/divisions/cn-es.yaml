    en: The centre of the commune; its name means 'together'. The People's Palace is where the Commune Council and the residents' assemblies meet, its round assembly hall seating more than ten thousand; beside it the Great Commune Canteen can feed tens of thousands at a sitting, and the Commune Library lends both books and tools free of charge. Streets radiate from People's Square to the housing districts around, and free trams and buses run day and night.
  codes:
