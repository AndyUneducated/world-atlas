    art-x-ivuran: Kirumai
  notes:
    zh: "基鲁迈联合邦由主岛西南端外基鲁迈群岛的六座岛结成，全邦 40 万人，陆地面积约 5.5 万平方公里，邦名和群岛名在伊武兰语里意为「一串珍珠」。基鲁迈岛、蒂卢迈岛、奥罗武岛、马拉坎岛、皮卢岛和皮卢尼岛从主岛西南端向南延伸、再向东弯成弧形，与主岛之间隔着约 140 公里宽的海面；岛上地势低缓，最高处海拔五百米左右，是热带雨林气候，月月有雨，一年降水近 2400 毫米。最大的基鲁迈岛约 2 万平方公里，是主岛之外领地最大的岛屿。群岛东端以东二百多公里外海的瓦希拉群岛是海军基地，民政也归联合邦管理。\n六座岛按《基鲁迈联合盟约》结成联合邦。每座岛有自己的岛议会，议员由各村长屋的村民大会推举，管渔场、村社土地、小学和外人入村的许可；联合邦议会 47 席，按岛分为五个选区，基鲁迈岛 22 席，蒂卢迈岛和奥罗武岛各 7 席，马拉坎岛 3 席，皮卢岛和皮卢尼岛合为一个选区共 8 席，瓦希拉群岛的官兵也在这里投票。联合邦议会管预算、渡轮、跨海大桥、旅游许可和珊瑚礁保护，领地的渔业和旅游法规要经它表决，才在群岛生效；全民基本收入、全民医保、免费教育和法院与全领地一致。首席部长伊卢文娜·塞洛迈来自伊武兰民族复兴党，与社会民主互助工党和国际共产党组成联合邦政府，部长会议里每座岛至少有一名部长。\n海岛度假和潜水是主要产业，渔业和自然保护次之，人均产值约 4.7 万美元。基鲁迈岛北部的迈萨里区是城区和联合邦议会所在地，有渡轮码头和基鲁迈机场，岛南的卡朗加区是乡村和传统村落，还有空军的卡朗加空军基地；蒂卢迈岛的珊瑚礁和海底峭壁是有名的潜水地；奥罗武岛传说是伊武兰人祖先登陆的地方；马拉坎珊瑚礁保护区保护着大片完好的珊瑚礁；皮卢区的渔民在礁外钓金枪鱼。本地人约占八成，许多村落仍按伊武兰人的传统划船出海、分享渔获。群岛不修铁路。伊米穆高速从迈萨里区出发，以约 101 公里长的哈努西鲁河口跨海大桥越海登上主岛，那是世界最长的桥梁；约 500 公里的基鲁迈群岛高速全程不限速，经卡朗加特大桥跨海连起基鲁迈、蒂卢迈和奥罗武三岛；马拉坎岛、皮卢岛和皮卢尼岛不通公路，靠渡轮往来。\n村落至今按老规矩出海：几户人家合用一条船，回港后把渔获在沙滩上分成一堆堆，老人、孩子和没出海的人家也有一份，村里人管这叫「分海」，分的时候要念一句「Oruka evu, nalu evu」，意思是「船是大家的，浪也是大家的」。岛民说六座岛是一串挂在海上的珍珠，串起它们的线是渡轮，渡轮停航的日子叫「断线天」；还开玩笑说东边外海的瓦希拉群岛是「被海军借走的那几颗」。马拉坎的潜水向导大多是本地渔民的孩子，他们给礁石上的大石斑鱼都起了名字，带客人下水时像介绍邻居一样介绍它们。岛上的家常饭是炭烤鱼配青柠和辣椒、椰浆煮芋头和刚从树上砍下的嫩椰子，傍晚村口的长凳上，老人们一边剥椰子一边看渔船回港。"
    en: "The Commonwealth of Kirumai is formed by the six islands of the Kirumai archipelago off the south-western end of the main island, with 400,000 people on some 55,000 km² of land; the name of both commonwealth and islands means 'a string of pearls' in Ivuran. Kirumai, Tilumai, Orovu, Malakan, Pilu and Piluni run south from the south-western tip of the main island and then curve east in an arc, separated from the main island by about 140 km of sea; they are low and gentle, rising no higher than about 500 m, with a tropical rainforest climate, rain in every month and nearly 2,400 mm a year. The largest, Kirumai Island, about 20,000 km², is the biggest island in the territory after the main island. The Vahira Islands, more than 200 km out to sea east of the chain, are a naval base, though their civil affairs also fall to the commonwealth.\nThe six islands are joined under the Kirumai Compact. Each island has its own council, whose members are put forward by the village assemblies of the longhouses and which manages fishing grounds, village land, primary schools and permits for outsiders to enter villages. The Commonwealth Assembly has 47 seats in five island constituencies: Kirumai Island 22, Tilumai and Orovu 7 each, Malakan 3, and Pilu and Piluni together 8, where the servicemen of the Vahira Islands also vote. The Assembly is responsible for the budget, ferries, sea bridges, tourism permits and reef protection, and the territory's fishing and tourism laws take effect in the islands only once it has voted them in; universal basic income, public health insurance, free education and the courts are the same as in the rest of the territory. The Chief Minister, Iluvenna Selomai of the Ivuran National Renewal Party, leads a commonwealth government with the Social Democratic Mutual Aid Labour Party and the International Communist Party, and every island has at least one minister in the cabinet.\nIsland holidays and diving are the main industries, followed by fishing and conservation, and output per head is about US$47,000. Maisari District in the north of Kirumai Island is the town and seat of the Commonwealth Assembly, with the ferry terminal and Kirumai Airport, while Karanga District in the south of the island is a land of countryside and traditional villages, and also of the Karanga Air Base; the reefs and undersea cliffs of Tilumai are famous dive sites; Orovu is said to be where the ancestors of the Ivuran people first landed; the Malakan Coral Reef Reserve protects great stretches of intact reef; and the fishermen of Pilu District catch tuna beyond the reef. About eight in ten residents are islanders, and many villages still put to sea and share their catch in the Ivuran way. The islands have no railway. The Imimu Expressway sets off from Maisari and crosses the sea to the main island on the Hanusiru Mouth Bridge, about 101 km long, the longest bridge in the world; the Kirumai Islands Expressway, some 500 km with no speed limit anywhere, crosses the sea on the Karanga Sea Bridge and other spans to link Kirumai, Tilumai and Orovu; Malakan, Pilu and Piluni have no roads and depend on ferries.\nThe villages still go to sea by the old rules: several families share a boat, and back in harbour the catch is divided into heaps on the beach, with a share for the elderly, the children and the households that did not go out; villagers call this \"sharing the sea\", and as they share they say \"Oruka evu, nalu evu\", the boat belongs to everyone and so do the waves. Islanders say the six islands are a string of pearls hung on the sea, the ferries are the thread, and days when the ferries cannot sail are \"broken-thread days\"; they joke that the Vahira Islands out east are \"the pearls the navy borrowed\". Most of Malakan's dive guides are the children of local fishermen, who have named every big grouper on the reef and introduce them to their guests like neighbours. Everyday island food is charcoal-grilled fish with lime and chilli, taro cooked in coconut milk and young coconuts cut fresh from the tree, and in the evening the old folk sit on the benches at the village entrance, husking coconuts and watching the boats come home."
