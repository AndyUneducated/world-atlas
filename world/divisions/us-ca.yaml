# ── 巴雷尔斯菲尔德市──
- id: div_jmxc1m
  subtype: locality
  parent: div_x2z14w
  status: generated
  names:
    zh: 巴雷尔斯菲尔德市
    en: Barrelsfield City
    es: Campo de Barriles
  notes:
    zh: "中央渴谷南端的石油城，全市 38 万人。谷底的油田里几万台抽油机日夜点头，像一群在烈日下鞠躬的铁鸟，油田之间是棉花地、葡萄园和胡萝卜田。井口区是城市的中心，炼油厂、乡村音乐酒吧和牛仔竞技场挤在一起；压裂原区是城西一望无际的油田、风电场和特哈聊天山脉的山口。\n巴雷尔斯菲尔德是自治州里少有的不在乎人工智能的地方：抽油机不需要聪明，只需要不停。城里人说话带着一种慢吞吞的乡村口音，周末去竞技场看骑牛，晚上在酒吧里听人唱关于卡车、石油和前妻的歌。每到选举，城里的车尾贴纸一半写着「钻吧，宝贝，钻」，另一半写着「我们的井比湾区的模型更深」。"
    en: "The oil city at the southern end of the Central Thirsty Valley, with 380,000 people. In the oil fields on the valley floor tens of thousands of pumpjacks nod day and night like a flock of iron birds bowing in the sun, with cotton fields, vineyards and carrot fields between them. Wellhead District is the city centre, where refineries, country music bars and the rodeo arena crowd together; the Fracklands are the endless oil fields and wind farms west of the city and the passes of the Tehachatbot Mountains.\nBarrelsfield is one of the few places in the state that doesn't care about artificial intelligence: a pumpjack doesn't need to be clever, only to keep going. People here speak with a slow country drawl, watch bull riding at the arena at weekends and listen in the bars at night to songs about trucks, oil and ex-wives. At every election half the bumper stickers in town read 'Drill, Baby, Drill' and the other half 'Our Wells Go Deeper Than the Bay Area's Models'."
  codes:
    admin: '060900'
  population: 380000
  area_km2: 21000.0
  color: '#5C4033'
  flag: { layout: diagonal, colors: ['#111111', '#C8102E', '#E8B523'], charge: derrick, charge_color: '#E8B523' }
  flag_notes:
    zh: "黑红两色斜分，中间一道金色斜带，上方一座金色的油井架。黑色是石油，红色是炼油厂的火炬，金色是石油换来的钱；城旗是市里唯一没有被人工智能改过的公共设计，市议会为此专门立了一条法令。"
    en: "Black and red divided diagonally by a gold band, with a gold oil derrick above. The black is oil, the red the refinery flares and the gold the money oil brings; it is the only public design in the city that has never been touched by artificial intelligence, and the city council passed an ordinance to keep it that way."
  traits: { industries: [oil, agriculture, solar], heritage: ca_mixed, age: balanced, income: 0.85 }
