  names:
    zh: 堤坝区
    en: Levee District
    es: Diques
  notes:
    zh: 首府以北萨克拉钱托河谷的大片农区，稻田、核桃园和李子园之间是一道道防洪堤。冬天河水上涨时堤坝区的人轮流上堤巡查，夏天河谷干热，水全靠上游水库放下来；水权在拍卖会上一年一卖，买得起水的是湾区的基金，种地的人只能租水。
    en: The farmlands of the Sacramoney valley north of the capital, rice fields, walnut and plum orchards divided by flood banks. When the river rises in winter, people take turns patrolling the levees; summers are dry and hot, and the water comes from the reservoirs upstream. Water rights are auctioned every year, and the buyers who can afford them are Bay Area funds; the farmers can only rent the water back.
