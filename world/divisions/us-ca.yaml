# ── 失落天使市（最大城市）──
- id: div_w1vh1a
  subtype: locality
  parent: div_x2z14w
  status: generated
  names:
    zh: 失落天使市
    en: Lost Angeles City
    es: Los Ángeles Perdidos
  notes:
    zh: "自治州最大的城市，在南海岸付费墙山脉和大海之间的盆地里，全市 310 万人，八个区连成一片几百平方公里的城区，被领道和市道的立交桥切成碎块。好莱怪区是影视业的老家，如今片场里的演员、编剧和群众演员大多换成了人工智能生成的数字人，真人演员要付钱才能在片尾字幕里出现；破产中心区的写字楼一半空着，楼下的人行道上是帐篷城。马里买区和比佛利账单区是海边和山上的豪宅，烟雾谷区、网约谷区和搁浅滩区住着城里大多数人：仓库工人、零工、被机器人出租车抢了饭碗的司机和搁浅在港外的货轮上的船员。\n失落天使人说这座城市只有两个季节：「烟雾季」和「山火季」。全市的警察局分裂成十几个各管一片的「分局」，每个分局有自己的颜色和徽章纹身，晚上收保护费，白天开罚单，市民遇到抢劫先要弄清楚抢劫的是警察还是帮派，好决定打哪个电话投诉。堵车是这里的宗教：上下班高峰时最快的交通工具是步行，第二快是直升机，城里有三百多个楼顶停机坪，大多属于不到两百个人。"
    en: "The state's largest city, in the basin between the Paywall Range and the sea on the south coast, with 3.1 million people; its eight districts run together into hundreds of square kilometres of city, chopped into pieces by the interchanges of its state and city roads. Hollyweird District is the old home of the film business, where most of the actors, writers and extras on the sets have been replaced by AI-generated digital people, and human actors pay to appear in the end credits; half the office towers of Downturn District stand empty, with a tent city on the pavements below. Malibuy and Beverly Bills are mansions by the sea and in the hills, while Smogdale, Rideshare Valley and Long Beached house most of the city's people: warehouse workers, gig workers, drivers whose living was taken by robotaxis, and the crews of cargo ships stranded outside the port.\nLost Angeles people say their city has only two seasons, smog season and fire season. The police department has split into more than a dozen 'divisions', each running its own patch with its own colours and badge tattoos, collecting protection money by night and writing tickets by day; when people are robbed they first have to work out whether it was the police or a gang, so as to know which number to call to complain. Traffic is the local religion: at rush hour the fastest way to get around is on foot and the second fastest by helicopter, and the city has more than three hundred rooftop helipads, most of them belonging to fewer than two hundred people."
  codes:
    admin: '060200'
    unlocode: US LXA
  population: 3100000
  area_km2: 11000.0
  color: '#B5452B'
  flag: { layout: banner, colors: ['#3B1F5E', '#F2A33A'], division: pile, charge: clapper, charge_color: '#FFFFFF' }
  flag_notes:
    zh: "紫色旗面上一道橙色的尖角从底边升起，像日落时的山峰，正中一块白色的电影场记板。紫色和橙色是盆地里烟雾中的晚霞；场记板代表好莱怪区，如今场记板上写的「第几镜」由人工智能自动填写，城旗是全城少数还由真人设计的东西。"
    en: "An orange point rising from the foot of a purple field like a peak at sunset, with a white film clapperboard in the middle. The purple and orange are the sunsets through the basin's smog, and the clapperboard stands for Hollyweird; the scene numbers on clapperboards are now filled in by artificial intelligence, and the city flag is one of the few things in the city still designed by a human."
  traits: { industries: [entertainment, logistics, port, gig], heritage: ca_mixed, age: balanced, income: 0.8 }
- id: div_jqddbd
