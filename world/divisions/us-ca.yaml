  status: generated
  names:
    zh: 露西芯城区
    en: Lucy Chip City District
    es: Ciudad Chip Lucy
  notes:
    zh: "露西芯城区是圣塞雷娜西北的海岸平原和丘陵，全区 6 万人，面积约 5350 平方公里，露西的家就在这里。露西宅邸建在盆地东边的山坡上，背后是海拔 1652 米的露西峰。区里的经济全部来自露西：一座从设计到制造样样俱全的芯片城，有芯片设计中心、逻辑、存储、封装测试和光罩四座厂，还有讲人类怎样存储信息的露西存储博物馆；一座按动物分类建馆的私人动物园，共 14 座场馆；一家平面是一颗臼齿的牙医诊所。几万名工程师、饲养员和牙医住在区里的新城，全区人均 GDP 约 22.9 万美元。\n新城里的露西新街区以露西广场为中心，广场正中的露西塑像双手举着一片晶圆对着光看；周围有时装设计工作室、试衣大楼、时装秀场、停着游轮「露西号」的巨轮泳池、清风中心、AI 洗护中心、股票研究所、睡眠研究中心、奶茶甜品工坊和空调博物馆。广告牌领道和海景付费公路从区里经过，双向 48 车道的露西—乔什私人公路和露西—乔什真空磁悬浮通往乔什宅邸，坐磁悬浮只要八分钟。\n这里是温和的地中海气候，七月白天只有 26 度上下，可露西对不通风的空气格外敏感，清风中心让整个新街区的「露西闷热指数」不超过 2。工程师们午休时去奶茶甜品工坊买一块「晶圆威化」，周末带孩子去动物园看灵长馆和海洋哺乳馆；时装发布会那天下午全区放假，比流片成功的半天假还受欢迎。上次选举，共和党得票 34.6%，加速党 31%，民主党 20%。"
    en: "Lucy Chip City District is the coastal plain and hills north-west of Santa Serena, home to 60,000 people over some 5,350 km²; this is where Lucy lives. Lucy's House stands on the hillside at the east of the basin, with Mount Lucy, 1,652 m high, behind it. The district's whole economy comes from Lucy: a chip city that does everything from design to manufacture, with the chip design centre, four plants for logic, memory, packaging and test, and masks, and the Lucy Museum of Memory telling how people have stored information; a private zoo with a house for every branch of the animal kingdom, fourteen in all; and a dental clinic whose floor plan is a molar. Tens of thousands of engineers, keepers and dentists live in the district's new town, and GDP per head is about $229,000.\nThe new town's Lucy quarter centres on Lucy Square, where the Statue of Lucy holds a wafer up to the light in both hands; around it are the fashion design studio, the fitting tower, the fashion show hall, the ship pool with the liner Lucy moored in it, the Breeze Centre, the AI care centre, the stock research institute, the sleep research centre, the milk tea and dessert workshop and the air conditioner museum. Billboard Road and the Pay-per-View Coast Road pass through the district, and the 48-lane Lucy–Josh Private Road and the Lucy–Josh Vacuum Maglev run to Josh's House, eight minutes away by maglev.\nThe climate here is a mild Mediterranean one, only around 26 degrees by day in July, but Lucy is unusually sensitive to stale air, and the Breeze Centre keeps the 'Lucy Stuffiness Index' of the whole quarter no higher than 2. Engineers pop out at lunch for a 'wafer wafer' from the dessert workshop, and at weekends take their children to see the Primate House and the Marine Mammal House at the zoo; on the afternoon of a fashion show the whole district has the afternoon off, even more popular than the half-day off for a successful tape-out. At the last election the Republican Party took 34.6% of the vote, the Accelerate Party 31% and the Democratic Party 20%."
  codes:
