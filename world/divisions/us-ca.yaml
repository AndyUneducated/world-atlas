- id: div_sc80nv
  subtype: borough
  parent: div_jysn35
  status: generated
  names:
    zh: 托盘维尔区
    en: Palletville District
    es: Villa Palé
  notes:
    zh: "托盘维尔区是仓储帝国西部的物流园区，全区 52 万人，面积约 600 平方公里，几百座仓库排成整齐的方格，中间是一座货运机场和一个铁路货场。一座仓库就有几十个足球场大，屋顶连起来能当机场跑道，仓库里是机器人，仓库外是排队等着进去做「补位」工作的人。仓储领道从区里穿过，北边的次日达山口海拔 1305 米，货车日夜不停地从那里翻进翻出，一下雪封路，包裹就变成了「次次日达」。物流、航空和无人工厂是三大行业，全区人均 GDP 约 7.5 万美元，收入中位数约 1.8 万。\n区里最大的仓库是尼罗物流履约中心，屋顶上是一整片太阳能板，屋顶下是成排的货架和几千台搬运机器人。人类员工戴着计步手环，停下来超过规定时间手环就会震动，上厕所的时间也算在内；尼罗说这座仓库「几乎实现了全自动化」，剩下的那一点是指员工。仓库里的机器人每年「表彰」一次表现最好的人类补位工，奖品是一个月不被算法排班的自由。\n区里一半的人讲西班牙语，很多人每天早上在仓库门外排队，看手机上的排班表今天有没有自己的名字。空气里的柴油味和橙子花香混在一起，老人们记得这里从前是一望无际的柑橘园，有几户人家的院子里还留着一两棵橙树。夏天白天三十六七度，山火季的热风从荒漠吹下来时，仓库会停工，那是工人们一年里唯一的带薪假。上次选举，民主党得票 46.5%，加速党 17.8%，共和党 9.9%。"
    en: "Palletville District is the logistics parks in the west of Warehouse Empire, home to 520,000 people over some 600 km², hundreds of warehouses in a neat grid with a cargo airport and a rail freight yard in the middle. A single warehouse is the size of dozens of football pitches, their roofs together big enough for a runway; inside are robots, and outside are people queuing to get in for 'fill-in' work. Warehouse Road runs through the district, and to the north lorries climb in and out day and night over Next-Day Pass at 1,305 m; when snow closes the road, parcels become 'next-next-day'. Logistics, aviation and lights-out factories are the three main industries; GDP per head is about $75,000 and median income about $18,000.\nThe biggest warehouse in the district is the Nile Fulfilment Centre, its roof one great sheet of solar panels and beneath it rows of shelving and thousands of carrying robots. Human staff wear step-counting wristbands that vibrate if they stop for longer than allowed, toilet breaks included; Nile says the warehouse is 'almost fully automated', the bit that is not being the staff. Once a year the warehouse robots 'commend' the best-performing human fill-in workers, whose prize is a month free of the scheduling algorithm.\nHalf the district speaks Spanish, and many people queue outside the warehouses each morning, checking the rota on their phones to see whether their name is on it today. The smell of diesel mixes with orange blossom in the air; old people remember when this was endless citrus groves, and a few yards still have an orange tree or two. Summer days reach thirty-six or thirty-seven degrees, and when the hot fire-season winds blow down from the desert the warehouses shut, the workers' only paid holiday of the year. At the last election the Democratic Party took 46.5% of the vote, the Accelerate Party 17.8% and the Republican Party 9.9%."
  codes:
    admin: '060601'
  population: 520000
  area_km2: 600.0
  traits: { industries: [logistics, aviation, robotics] }
- id: div_aca2hs
  subtype: borough
  parent: div_jysn35
  status: generated
  names:
    zh: 无河区
    en: Riverless District
    es: Sin Río
  notes:
    zh: "无河区是仓储帝国的市中心和老城，面积约 900 平方公里，住着约 38 万人。市政厅、法院和一座老传教士旅馆都在这里，旅馆的拱廊和钟楼保留着从前的样子，如今住的多是来谈生意的物流经理。区名里的河早已断流，河床铺上沥青成了货运领道，桥还留着，桥下跑的是卡车，桥上的老人凭栏往下看，说从前这里钓得到鱼。老城里还剩几片柑橘园，果园主人靠出租果园拍「从前的加州」广告片过活，一季的租金比卖橙子挣得多。\n仓储领道从区里东西穿过，次日达领道从南边的圣遣返过来，经区里北上去履约高漠区；两条领道在区里交汇，交汇处的立交桥一天到晚响着货车的刹车声。区里的经济是行政与公共服务、物流仓储和商贸，人均 GDP 在全市三个区里最低，讲英语和讲西班牙语的人各占一半，街上的招牌多是两种文字。市政厅的钟楼每到整点敲钟，钟声常被货车喇叭盖过，老城的人说听钟得看钟锤的影子。\n清早，补位工骑着电动车沿辅路去托盘维尔的仓库，晚上再骑回老城，路边的卷饼摊和洗衣店开到深夜。周末，市政厅前的广场上有农夫市集，卖的是城外最后几片果园里的橙子，来买橙子的人，多半也是想闻一闻花香。"
    en: "Riverless District is the centre and old town of Warehouse Empire, about 900 square kilometres with some 380,000 people. City Hall, the courthouse and an old mission inn are all here, the inn's arcades and bell tower kept as they were, its guests now mostly logistics managers in town on business. The river in the district's name ran dry long ago, and its bed was paved with asphalt to become a freight road; the bridges remain, with lorries running beneath them, and old people lean on the parapets looking down and say there used to be fish here. A few citrus groves survive in the old town, and their owners make a living renting them out for 'the California of old' advertising shoots, earning more in a season of rent than from selling oranges.\nWarehouse Road crosses the district east to west, and Next-Day Road comes up from San Deportes in the south and runs through the district north to High Desert Fulfillment; the two state roads meet in the district, and the interchange where they cross echoes all day with lorry brakes. The district lives on government, logistics and commerce; its GDP per head is the lowest of the city's three districts, English and Spanish speakers each make up half, and most street signs are in both languages. The City Hall clock tower strikes every hour, but the bells are often drowned out by lorry horns, and old-town people say you have to watch the hammer's shadow to hear the time.\nAt dawn the gap-fillers ride their e-bikes along the service roads to the warehouses of Palletville and ride back to the old town in the evening, and the roadside taco stalls and launderettes stay open late into the night. At weekends there is a farmers' market on the square in front of City Hall selling oranges from the last few groves outside town, and most of those who come to buy them want to smell the blossom too."
  codes:
    admin: '060602'
  population: 380000
  area_km2: 900.0
  traits: { industries: [government, logistics, commerce] }
- id: div_s76w0x
  subtype: borough
  parent: div_jysn35
  status: generated
  names:
    zh: 履约高漠区
    en: High Desert Fulfillment District
    es: Alto Desierto de Envíos
  notes:
    zh: "履约高漠区是仓储帝国北边的付费墙山脉东段和山后的高原荒漠，全区 10 万人，面积约 2.35 万平方公里，几乎占了全市的全部土地，最高处海拔 2462 米。山上有雪道和湖畔木屋，山后荒漠里是成片的物流基地、太阳能电站和一座货机墓地，几百架退役的货机停在沙地里，有的被改成了仓库。次日达领道、离线领道和沉没成本领道在荒漠里交会，次日达领道上的次日达检查站离海岸线一百多公里，州移民与海关执法局却把它当作边境来管，每一辆往北开的车都要停下来出示证件、刷脸。荒漠里的小镇房价便宜，是被城里挤出来的人最后的落脚处。\n这里的夏天酷热，七月白天将近 40 度，有记录以来最热到过 50.5 度，冬天的夜里却会结冰；一年的雨不到 300 毫米，太阳能板一排排铺到天边。物流、光伏和风电、冬季运动是三大行业，全区人均 GDP 约 4.4 万美元，收入中位数约 1.5 万。\n检查站一拦，赶着给尼罗物流送包裹的货车常常把「次日达」变成「隔日达」，司机们管这里叫「按小时收费的停车场」，旁边于是开起了加油站、汉堡店和一家出租折叠床的小店。货机墓地里的仓库没有窗，只有舷窗，管理员说这是全州唯一会「起飞」的仓库，虽然从来没飞过。冬天周末，城里人开车上山滑雪，和下山送货的无人货车擦肩而过。上次选举，共和党得票 38%，民主党 18.5%，拔插头联盟 16.5%。"
    en: "High Desert Fulfillment District is the eastern Paywall Range north of Warehouse Empire and the high desert behind it, home to 100,000 people over some 23,500 km², almost all of the city's land, rising to 2,462 m. The mountains have ski runs and lakeside cabins; out in the desert lie logistics bases, solar power stations and a cargo plane boneyard where hundreds of retired freighters sit in the sand, some turned into warehouses. Next-Day Road, Offline Road and Sunk Cost Road meet in the desert, and the Next-Day Checkpoint on Next-Day Road lies more than a hundred kilometres from the coast, yet the State Immigration and Customs Enforcement Agency treats it as a border, stopping every northbound vehicle for papers and a face scan. Housing in the desert towns is cheap, the last refuge of people squeezed out of the city.\nSummers are scorching, nearly 40 degrees by day in July, with a record of 50.5, yet winter nights freeze; less than 300 mm of rain falls a year, and solar panels stretch row after row to the horizon. Logistics, solar and wind power, and winter sports are the three main industries; GDP per head is about $44,000 and median income about $15,000.\nHeld up at the checkpoint, lorries racing to deliver Nile parcels often turn 'next-day' into 'day-after', and drivers call it 'the car park that charges by the hour', so a filling station, a burger bar and a shop renting out camp beds have opened beside it. The warehouses in the boneyard have no windows, only portholes, and the caretaker says they are the only warehouses in the state that might 'take off', though none ever has. On winter weekends people from the city drive up to ski, passing driverless delivery lorries on their way down. At the last election the Republican Party took 38% of the vote, the Democratic Party 18.5% and the Unplug League 16.5%."
  codes:
    admin: '060603'
  population: 100000
  area_km2: 23500.0
  traits: { industries: [logistics, solar, ski], heritage: ca_mixed }

# ── 艾尔瓦纳市──
- id: div_7zxffd
  subtype: locality
  parent: div_x2z14w
  status: generated
  names:
    zh: 艾尔瓦纳市
    en: Irvana City
    es: Irvana
  notes:
    zh: "艾尔瓦纳市在失落天使东南，是一座规划城市，全市 60 万人，面积约 2500 平方公里，地势低平，最高处也只有一百二十多米。全城由一家地产公司从一张白纸上规划出来，每条街、每棵树、每栋房子外墙的颜色都写在一本几千页的《社区守则》里。总规划区的住宅分成几十个一模一样的村落，每个村落有自己的业主委员会、游泳池和门禁，村落围着一座大学、一个科技园和一座购物中心排开；新港决口区是海边的游艇码头和豪宅，业主委员会山区是山上更新的门禁社区。全城的外墙只允许十二种米色，曾经有人把门刷成浅蓝，被业主委员会罚款到卖了房子。\n全市靠信息技术、居住与社区服务、高等教育和私人安保，科技园里多是从湾区搬来的软件公司，人均 GDP 约 15.8 万美元，收入中位数 2.5 万美元，替业主修草坪、扫泳池、站岗的人大多住在城外。单调领道穿过总规划区；停车场领道从失落天使一路南下，经新港决口区到业主委员会山区，是全州最繁忙的领道，也是唯一交给收费公司经营的领道，过路费按人工智能算出的「愿付价格」收，同一段路开豪车的人付得多。这里阳光充足，冬天白天也有 19 °C 左右，一年雨水 400 毫米上下。城里没有一根电线杆露在外面，也没有一块招牌高过树梢，连加油站都要藏在米色的围墙后面；外地人开车进城，常常以为导航坏了，因为每个路口看起来都一样。\n全市讲英语的近九成。市长李国华来自加速党，在决选中以 61.6% 的得票击败共和党对手；15 席的市议会里民主党和加速党各 7 席，共和党 1 席，议长刘美玲开会前会先核对每位议员的访客码。\n艾尔瓦纳号称全州最安全的城市，靠的不是警察，而是每户门口的摄像头、每条街上的巡逻机器人和业主委员会的「邻里信用分」：草坪太高扣分，垃圾桶没收扣分，访客停车超时扣分，分数太低的人家会收到搬家公司的上门报价。城里的学校成绩很好，孩子们从小学会的第一句话是「请出示您的访客码」。万圣节是一年里最紧张的一晚，糖果的品牌和南瓜灯的笑脸都要按守则选，敲门的孩子按村落分批放行。守则每年修订一次，新版本比旧版本厚几十页，业主们收到后最先翻看的是附录里的米色色卡，看看自家外墙是不是还在允许的范围之内。"
    en: "Irvana City, south-east of Lost Angeles, is a planned city of 600,000 people covering some 2,500 square kilometres of low, flat land that rises no higher than about 120 metres. The whole city was laid out on a blank sheet by a property company, and every street, every tree and the colour of every house's walls is set down in a Community Code thousands of pages long. The homes of Masterplan District are divided into dozens of identical villages, each with its own homeowners' association, swimming pool and gate, arranged around a university, a technology park and a shopping centre; Newport Breach is the marina and mansions on the coast, and HOA Hills the newer gated communities in the hills. Only twelve shades of beige are permitted on the city's walls, and one man who painted his door pale blue was fined by his homeowners' association until he had to sell the house.\nThe city lives on information technology, residential services, higher education and private security, and the technology park is mostly software companies that moved down from the Bay Area; GDP per head is about 158,000 dollars and the median income 25,000, and most of the people who mow the lawns, clean the pools and stand guard for the homeowners live outside the city. Monotony Road crosses Masterplan District; Parking Lot Road runs south all the way from Lost Angeles through Newport Breach to HOA Hills, the busiest state road in the state and the only one run by a toll company, which charges a 'willingness-to-pay price' calculated by AI, so that drivers of luxury cars pay more for the same stretch. The city is sunny, with winter daytime highs of about 19 °C and some 400 millimetres of rain a year. Not a single power pole is visible anywhere in the city, no sign stands taller than the treetops, and even petrol stations must hide behind beige walls; visitors driving in often think their satnav has broken, because every junction looks the same.\nNearly nine in ten people speak English. The mayor, Lee Kwok-wah, is from the Accelerate Party and beat the Republican candidate in the run-off with 61.6 per cent of the vote; on the 15-seat City Council the Democrats and the Accelerate Party hold 7 seats each and the Republicans 1, and the Speaker, Lau Mei-ling, checks every councillor's visitor code before a meeting begins.\nIrvana claims to be the safest city in the state, thanks not to the police but to the cameras at every front door, the patrol robots on every street and the homeowners' associations' 'neighbourhood credit scores': points are deducted for long grass, for bins not brought in and for visitors overstaying their parking, and households whose scores fall too low receive quotes from removal companies at the door. The schools get excellent results, and the first sentence children learn is 'Please show your visitor code.' Halloween is the tensest night of the year, when the brand of sweets and the smile on the jack-o'-lantern must both be chosen according to the Code, and trick-or-treaters are let through village by village in batches. The Code is revised every year, each edition dozens of pages thicker than the last, and the first thing homeowners turn to is the beige colour chart in the appendix, to check whether their walls are still within the permitted range."
  codes:
    admin: '060700'
  population: 600000
  area_km2: 2500.0
  color: '#B8A88A'
  flag: { layout: nordic, colors: ['#EDE6D6', '#B8A88A', '#7C6F57'], charge: ring_homes, charge_color: '#7C6F57' }
  flag_notes:
    zh: "米色旗面上一个浅褐色的十字，十字中间嵌着深褐色的细十字，左上角是一圈围成环的房子。三种颜色都在《社区守则》允许的十二种米色之内；环形的房子代表门禁村落，房子之间没有门，因为门要另外申请。"
    en: "A pale brown cross with a dark brown inner cross on a beige field, and a ring of houses in the canton. All three colours are among the twelve beiges the Community Code allows; the ring of houses stands for the gated villages, with no gaps between them, since a gap would need a separate application."
  traits: { industries: [tech, residential, education, security], heritage: ca_anglo, age: balanced, income: 1.5 }
  symbols: {"flower": {"zh": "猴面花", "en": "Monkeyflower"}, "tree": {"zh": "蓝花楹", "en": "Jacaranda"}}
- id: div_7871nw
  subtype: borough
  parent: div_7zxffd
  status: generated
  names:
    zh: 总规划区
    en: Masterplan District
    es: Plan Maestro
  notes:
    zh: "总规划区是艾尔瓦纳的中心，面积约 500 平方公里，住着约 30 万人，占全市的一半。几十个门禁村落围着一座大学、一个科技园和一座购物中心排开，村落的名字都是树名，可村里种的树都是同一种。每个村落有自己的业主委员会、游泳池和门禁，街道弯成一个个死胡同，外人开车进来，绕上半个小时也找不到出口，据说这正是设计者想要的。\n科技园里是被湾区赶出来的软件公司，员工中午在人造湖边跑步，湖水每周换一次颜色，颜色由业主委员会投票决定。大学的学生毕业后大多留在科技园上班，再在村落里贷款买一套房，从此每个月按时交房贷和业主委员会会费。区里的经济是信息技术、高等教育和居住与社区服务，人均 GDP 约 15.6 万美元。单调领道从区里穿过，北上去失落天使，南下去圣遣返，领道边的隔音墙也刷成了守则规定的米色。\n购物中心是区里唯一不设门禁的地方，周末全城的人都来这里散步、吃饭、看电影，也来看别的村落的人穿什么。大学门口的书店兼咖啡馆是区里少有的晚上十点以后还亮灯的地方，学生在里面写论文，保安在门口查访客码。村落之间的小学按学区严格划分，家长们为了一个更好的学区，愿意搬进一模一样的另一栋房子，只是门牌号换了。"
    en: "Masterplan District is the centre of Irvana, about 500 square kilometres with some 300,000 people, half the city. Dozens of gated villages are arranged around a university, a technology park and a shopping centre; the villages are all named after trees, yet every village is planted with the same tree. Each has its own homeowners' association, swimming pool and gate, and the streets curl into cul-de-sac after cul-de-sac, so that an outsider who drives in can circle for half an hour without finding the way out, which is said to be exactly what the planners intended.\nThe technology park is full of software companies driven out of the Bay Area, whose staff jog at lunchtime around an artificial lake that changes colour every week, the colour decided by a homeowners' association vote. Most of the university's graduates stay on to work in the technology park, then take out a mortgage on a house in one of the villages and pay the mortgage and the association fees on time every month from then on. The district lives on information technology, higher education and residential services, with GDP per head of about 156,000 dollars. Monotony Road crosses the district, heading north to Lost Angeles and south to San Deportes, and even the noise barriers along it are painted a beige approved by the Code.\nThe shopping centre is the only place in the district without a gate, and at weekends the whole city comes to stroll, eat and see a film there, and to see what people from other villages are wearing. The bookshop café by the university gate is one of the few places in the district still lit after ten at night, with students writing essays inside and a guard checking visitor codes at the door. Primary schools are strictly zoned village by village, and for a better school parents will happily move into another identical house that differs only in its number."
  codes:
    admin: '060701'
  population: 300000
  area_km2: 500.0
  traits: { industries: [tech, education, residential] }
- id: div_77vac6
  subtype: borough
  parent: div_7zxffd
  status: generated
  names:
    zh: 新港决口区
    en: Newport Breach District
    es: Nueva Brecha
  notes:
    zh: "新港决口区是艾尔瓦纳的海岸，面积约 300 平方公里，住着约 15 万人，游艇码头和半岛上的豪宅一排排面朝大海。区里靠富豪私人服务、旅游和金融过日子，人均 GDP 约 22 万美元，是全市最高的区；居民中非洲裔超过一半。区名来自一次海堤决口：海水漫进了豪宅区，业主委员会第二天就开会决定，以后海水进来也要先申请访客码。如今海堤加高了一截，堤上装着和村落门口一样的摄像头。\n码头上停着几百艘游艇，一年里平均每艘出海不到三次，其余时间由清洁工、机修工和看船的保安照料，船主偶尔来船上开一场派对，船不离开泊位。区里的海鲜餐馆按游艇的长度安排座位，船越长，离窗越近；海堤上每天傍晚都有人遛狗，狗也挂着访客码的牌子。半岛上的豪宅之间是精品店、海鲜餐馆和私人银行，基金经理在阳台上看盘，楼下的海滩上有人冲浪。停车场领道从北边进区，过路费按「愿付价格」计算，这里的车牌一被识别出来，价格就往上跳一档。\n夏天的傍晚，海湾里会有一场游艇巡游，船上挂满彩灯，岸上的人一边看一边猜每艘船的主人是谁；最大的那艘船头写着「访客码已登记」，据说是专门写给海水看的。"
    en: "Newport Breach District is Irvana's coast, about 300 square kilometres with some 150,000 people, where the marina and the mansions on the peninsula face the sea in rows. The district lives on private services for the very rich, tourism and finance, and its GDP per head of about 220,000 dollars is the highest in the city; more than half the residents are of African descent. The name comes from a breach in the sea wall: the sea poured into the mansions, and the next day the homeowners' association met and decided that in future the sea too must apply for a visitor code before coming in. The sea wall has since been raised, and it carries the same cameras as the village gates.\nHundreds of yachts lie in the marina, each going to sea on average fewer than three times a year; the rest of the time they are looked after by cleaners, mechanics and security guards, and now and then an owner comes aboard to throw a party without the boat ever leaving its berth. The seafood restaurants seat diners by the length of their yachts, the longer the boat the closer to the window, and on the sea wall every evening people walk their dogs, which wear visitor-code tags too. Between the mansions on the peninsula are boutiques, seafood restaurants and private banks; fund managers watch the markets from their balconies while people surf on the beach below. Parking Lot Road enters the district from the north, and its tolls are charged at the 'willingness-to-pay price': the moment a number plate from here is recognised, the price jumps up a notch.\nOn summer evenings there is a yacht parade in the bay, the boats hung with coloured lights while people on shore watch and guess who owns each one; the biggest has 'Visitor Code Registered' painted on its bow, said to be a message meant for the sea."
  codes:
    admin: '060702'
  population: 150000
  area_km2: 300.0
  traits: { industries: [luxury, tourism, finance], ethnicity: ca_african, income: 2.4 }
- id: div_2jmm39
  subtype: borough
  parent: div_7zxffd
  status: generated
  names:
    zh: 业主委员会山区
    en: HOA Hills District
    es: Colinas de la Asociación
  notes:
    zh: "业主委员会山区在艾尔瓦纳东边的丘陵上，面积约 1700 平方公里，占了全市三分之二，住着约 15 万人。这里是全城最新的门禁社区，房子沿山坡梯田般排开，一层比一层贵，山顶是一片保留的野地，野地四周也围着栅栏，栅栏上挂着「保护区，业主专用」的牌子。丘陵并不高，最高处一百二十多米，可开发商坚持叫它「山」，因为「山景房」比「坡景房」好卖。\n区里有一个业主委员会的「总委员会」，负责管理下面几十个业主委员会，总委员会上面还有一个「监督委员会」，监督委员会每年开一次会，讨论要不要再成立一个委员会。区里的经济是居住与社区服务、自然保护与巡护和私人安保：保安公司的巡逻车在弯弯曲曲的山路上日夜转圈，野地的巡护员主要的工作是把跑进社区的郊狼和山猫劝回去。区里的收入中位数在全市最低，不少居民贷款买了房，再靠给别的业主当保安和园丁来还贷。\n停车场领道从失落天使一路南下，在区里走到尽头，下了领道还要过三道门禁才能到家，外卖员说送一单要背三套访客码。周末的山顶野地开放半天，业主们带着孩子去看野花，看完要在出口签一份声明，保证没有带走任何一朵。"
    en: "HOA Hills District lies in the hills east of Irvana, about 1,700 square kilometres, two thirds of the city, with some 150,000 people. These are the newest gated communities in the city, the houses terraced up the slopes, each tier dearer than the one below, and on the hilltop is a tract of preserved wild land, itself fenced, with signs reading 'Nature Reserve: Homeowners Only'. The hills are not high, about 120 metres at most, but the developers insist on calling them 'hills' because a 'hill view' sells better than a 'slope view'.\nThe district has a 'General Committee' of homeowners' associations that oversees the dozens of associations beneath it, and above the General Committee sits a 'Supervisory Committee', which meets once a year to discuss whether to set up another committee. The district lives on residential services, nature conservation and private security: security firms' patrol cars circle the winding hill roads day and night, and the main job of the wild land's rangers is to coax back the coyotes and bobcats that wander into the estates. The district has the lowest median income in the city, for many residents bought their homes on mortgages and pay them off by working as guards and gardeners for other homeowners.\nParking Lot Road runs all the way south from Lost Angeles and ends in the district, and after leaving it there are still three gates to pass before reaching home; delivery riders say each order means carrying three sets of visitor codes. At weekends the hilltop wild land opens for half a day, and homeowners take their children to see the wild flowers, signing a declaration at the exit that they have not taken a single one."
  codes:
    admin: '060703'
  population: 150000
  area_km2: 1700.0
  traits: { industries: [residential, conservation, security] }

# ── 阿尔蒙多市──
- id: div_03k9fc
  subtype: locality
