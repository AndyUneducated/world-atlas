  names:
    zh: 巴雷尔斯菲尔德市
    en: Barrelsfield City
    es: Campo de Barriles
  notes:
    zh: "巴雷尔斯菲尔德市在中央渴谷南端，是一座石油城，全市 38 万人，面积约 2.1 万平方公里。谷底的油田里几万台抽油机日夜点头，像一群在烈日下鞠躬的铁鸟，油田之间是棉花地、葡萄园和胡萝卜田。井口区是城市的中心，炼油厂、乡村音乐酒吧和牛仔竞技场挤在一起，全市八成多的人住在这里；压裂原区是城西一望无际的油田、风电场和特哈聊天山脉的山口，山口上站满了风机。\n全市一半的产值来自工业，石油开采与炼化是头一号，种植业和光伏、陆上风电跟在后面，人均 GDP 约 7.2 万美元，收入中位数 1.8 万美元。这里是炎热的半干旱气候，一年雨水不到 300 毫米，七月白天平均近 38 °C，最高纪录 48.9 °C，炼油厂的火炬在热浪里看起来像在融化；冬天谷底常起浓雾，抽油机在雾里只露出一个点头的影子。杏仁领道从井口区出发一路北上；沉没成本领道从井口区向东翻过特哈聊天山脉去仓储帝国，路边的收费站自建成起从来没收过一分钱，因为收费标准至今还在讨论。加州高速铁路的南端在压裂原区的荒漠枢纽站，方圆几十公里没有城镇，站前广场上只有一排机器人出租车和一块「此处规划中央商务区」的牌子。\n政治上一边倒：13 席的市议会全归共和党，市长埃夫拉因·比利亚塞尼奥尔在两名共和党人对决的决选中以 52.2% 胜出。讲英语的近四分之三，讲西班牙语的两成。城里三代人都在油田干活的家庭不少，高中毕业典礼上，校长的讲话念到一半，台下的家长就开始讨论今年的油价。\n巴雷尔斯菲尔德是自治州里少有的不在乎人工智能的地方：抽油机不需要聪明，只需要不停。城里人说话带着一种慢吞吞的乡村口音，周末去竞技场看骑牛，晚上在酒吧里听人唱关于卡车、石油和前妻的歌。每到选举，城里的车尾贴纸一半写着「钻吧，宝贝，钻」，另一半写着「我们的井比湾区的模型更深」。压裂原的井越打越深，农场主们用瓶装水浇自家的菜园；停了产的抽油机被一家初创公司接上电机，照旧上下点头，按小时租给拍「能源复兴」广告的摄制组。每年秋天的石油节上，竞技场里比骑牛、套牛和开叉车，晚上最后一个节目是给退役的抽油机颁发「终身成就奖」。"
    en: "Barrelsfield City, at the southern end of the Central Thirsty Valley, is an oil city of 380,000 people covering some 21,000 square kilometres. In the oilfields on the valley floor tens of thousands of pumpjacks nod day and night like a flock of iron birds bowing in the blazing sun, with cotton fields, vineyards and carrot fields between them. Wellhead District is the city centre, where refineries, country music bars and a rodeo arena are crowded together, home to more than eight in ten of the city's people; Fracklands is the endless oilfields and wind farms west of the city and the passes of the Tehachatbot Mountains, crowded with wind turbines.\nHalf the city's output comes from industry, with oil and refining first and farming and solar and onshore wind behind it; GDP per head is about 72,000 dollars and the median income 18,000. The climate is hot semi-arid, with less than 300 millimetres of rain a year, July days averaging nearly 38 °C and a record of 48.9 °C, and the refinery flares seem to melt in the heat haze; in winter thick fog often settles on the valley floor, and the pumpjacks show only a nodding shadow through it. Almond Road sets off from Wellhead District heading north; Sunk Cost Road runs east from Wellhead District over the Tehachatbot Mountains towards Warehouse Empire, and the toll booths beside it have never collected a cent since it opened, because the toll rates are still under discussion. The southern end of the California High-Speed Railway is Desert Hub Station in Fracklands, with no town for tens of kilometres around and nothing on the station square but a row of robotaxis and a sign reading 'Central Business District Planned Here'.\nPolitics is one-sided: all 13 seats on the City Council belong to the Republicans, and the mayor, Efraín Villaseñor, won a run-off between two Republicans with 52.2 per cent. Nearly three quarters of people speak English and a fifth Spanish. Plenty of families have had three generations working in the oilfields, and at high-school graduations the parents start discussing this year's oil price before the head teacher is halfway through the speech.\nBarrelsfield is one of the few places in the autonomous state that does not care about artificial intelligence: a pumpjack does not need to be clever, only to keep going. People here talk with a slow country drawl, go to the arena at weekends to watch bull riding, and listen in the evenings to songs in the bars about lorries, oil and ex-wives. At every election, half the bumper stickers in town say 'Drill, Baby, Drill' and the other half 'Our Wells Go Deeper Than the Bay Area's Models'. The wells in Fracklands go deeper and deeper, and ranchers water their vegetable gardens with bottled water; a start-up has hooked the idle pumpjacks up to electric motors so they still nod up and down, and rents them by the hour to film crews shooting 'energy revival' adverts. At the oil festival every autumn the arena hosts bull riding, roping and forklift racing, and the last event of the night is a 'lifetime achievement award' presented to a retired pumpjack."
