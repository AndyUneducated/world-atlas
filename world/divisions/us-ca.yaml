- id: div_qayjg1
  subtype: borough
  parent: div_57c6nv
  status: generated
  names:
    zh: 涂黑区
    en: Blackout District
    es: Tachado
  notes:
    zh: "涂黑区是雷达克特的市中心，在萨克拉钱托河出山口，全区 11 万人，面积约 2500 平方公里。城北是一座大水库和水坝，水坝发的电送往南边的城市，水电、商业和政府机关是区里的三大行业。单调领道从这里北上山区，绿雾领道往西翻山通往北海岸。天气晴好时，从城里看得见北边级联故障山脉终年积雪的火山顶。区里的报纸每天出版，头版一半涂黑，读者说涂黑的部分才是真新闻。\n雷达克特人对州政府极不信任，所有向州政府提交的文件都会先把一大半内容涂黑，市政府的档案里连城名也被涂黑了，只剩下「已涂黑」三个字。北边的居民几十年来一直想从加州分出去另立一州，涂黑区的人不一定都赞成，但谁也不愿替州政府说话，州长来访时照例收到一顶写着「再见」的帽子。\n这里的夏天又干又热，七月白天约 31 度，冬天冷得多，一月夜里常在零度上下，有记录以来最冷到过零下 15.6 度，全年降水约 850 毫米，大多落在冬天。城里的店里最好卖的是罐头、发电机和防毒面具，家家有枪，谁也不信人工智能，填表时宁可用笔，也不肯对着屏幕说一个字。周末，人们到水库边钓鱼、开船，在码头的小餐馆里读那份半黑的报纸，猜涂掉的是什么。全区人均 GDP 约 5 万美元，收入中位数约 1.5 万；上次选举，共和党得票 34.3%，防火绿党 26.3%，民主党 16.5%。"
    en: "Blackout District is the centre of Redacted, where the Sacramoney River leaves the mountains, home to 110,000 people over some 2,500 km². North of town are a great reservoir and dam whose power goes to the cities of the south, and hydropower, commerce and government are the district's three main industries. Monotony Road runs north from here into the mountains, and Green Haze Road heads west over the hills to the north coast. On clear days the snow-capped volcanoes of the Cascading Failure Range can be seen to the north from town. The local paper comes out every day with half its front page blacked out; readers say the blacked-out part is the real news.\nThe people of Redacted deeply distrust the state government, and every document they send it has most of its contents blacked out first; in the city's own records even the city's name has been blacked out, leaving only the word 'Redacted'. People in the north have been trying for decades to split from California and form a state of their own; not everyone in Blackout agrees, but nobody is willing to speak up for the state government, and a visiting governor is always presented with a cap reading 'Goodbye'.\nSummers are hot and dry, about 31 degrees by day in July, and winters much colder, with January nights often around freezing and a record low of minus 15.6; about 850 mm of rain falls a year, mostly in winter. The best sellers in town are tinned food, generators and gas masks; every household has a gun and nobody trusts artificial intelligence, preferring to fill in forms with a pen rather than say a single word to a screen. At weekends people fish and boat on the reservoir and read the half-black paper in the little restaurants by the jetty, guessing what was blacked out. GDP per head is about $50,000 and median income about $15,000; at the last election the Republican Party took 34.3% of the vote, the Firebreak Greens 26.3% and the Democratic Party 16.5%."
  codes:
    admin: '061501'
  population: 110000
  area_km2: 2500.0
  traits: { industries: [hydropower, commerce, government] }
- id: div_chf8fg
  subtype: borough
  parent: div_57c6nv
  status: generated
  names:
    zh: 待建州区
    en: Statehood-Pending District
    es: Estado Pendiente
  notes:
    zh: "待建州区是雷达克特北部的山地、火山和森林，面积约 4 万平方公里，占了全市一半以上，却只住着约 3.5 万人。级联故障山脉最高的火山宕机峰在这里，海拔 2370 米，孤零零地立在森林之上，山顶终年积雪；全州那场停了三天的大停电就是从它冒烟开始的，山脚小镇的纪念品店至今卖一种印着这座火山的蜡烛。区里的人伐木、打猎、打鱼、开采石料，山脚的小镇里每座谷仓上都刷着「待建州」的标志。\n单调领道从涂黑区北上，穿过整个区，在北端走到尽头，开到这里的司机已经在路上坐了将近十个小时。东北海岸上，待定湾的湾边打过三回未来州首府的选址木桩，每回都被冬天的风暴冲走；伸进海里的分家角是一片长满松树的熔岩台地，上面立着一块界碑，一面刻着「加利福尼亚」，一面刻着「待建州」，两面之间隔着一层薄薄的青苔。\n居民自己选了一位「州长」，每年向州议会递交一份独立申请，申请书照例涂黑了一大半，州议会照例回一封「已收到」。冬天大雪封山，镇上的酒馆里，猎人们一边烤火一边起草新州的宪法，草稿写了几十年，每年都多出几条关于发电机和打猎季的条款，至于州名，大家一致同意先不写，免得被涂黑。"
    en: "Statehood-Pending District is the mountains, volcanoes and forests of northern Redacted, about 40,000 square kilometres, more than half the city, yet home to only some 35,000 people. Mount Outage, the highest volcano of the Cascading Failure Range, stands here, 2,370 metres high, alone above the forest and snow-capped all year; the state's three-day blackout began when it started smoking, and the souvenir shops in the towns at its foot still sell a candle with the volcano printed on the packet. People here log, hunt, fish and quarry stone, and in the towns at the foot of the mountains every barn is painted with the 'Statehood-Pending' sign.\nMonotony Road runs north from Blackout District across the whole district and ends at its northern edge, by which point drivers have been on the road for nearly ten hours. On the north-east coast, the stakes marking the site of a future state capital have been driven in three times on the shore of Pending Bay, and three times washed away by winter storms; Point Split, reaching into the sea, is a pine-covered lava tableland with a boundary stone on it, carved 'California' on one side and 'Statehood-Pending' on the other, the two faces separated by a thin layer of moss.\nThe residents have elected a 'governor' of their own and every year submit an application for independence to the state legislature, most of it blacked out as usual, and the legislature replies as usual with a letter saying 'Received'. In winter the snow closes the mountains, and in the town taverns hunters sit by the fire drafting the new state's constitution, a draft decades in the making that gains a few more clauses on generators and hunting seasons every year; as for the state's name, everyone agrees to leave it out for now so it does not get blacked out."
  codes:
    admin: '061502'
  population: 35000
  area_km2: 40000.0
  traits: { industries: [forestry, hunting, mining] }
