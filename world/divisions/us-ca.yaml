  names:
    zh: 渴谷区
    en: Thirsty Valley District
    es: Valle Sediento
  notes:
    zh: "渴谷区是阿尔蒙多在中央渴谷西部的大片果园和农田，全区 9 万人，面积约 1.46 万平方公里，单调领道沿谷地西缘纵贯全区。全州最长的河圣囤积河从区里流过，上游的农场和基金把河水一段一段地买下来囤着，河水在旱季常常还没流到下游就被抽干。区里的地面一年下沉几十厘米，老水渠的桥墩露出了好几层台阶，老电线杆斜着插在地里。路边的大广告牌上写着「是国会制造了干旱吗？」，另一块写着「是杏仁制造了干旱吗？」，两块牌子由同一家公关公司制作。\n农业和食品加工撑起了全区，农林业占经济的近四成，可地、水和农机都属于湾区的基金，种地的人大多是租地、租水、租农机的雇工。全区人均 GDP 约 3.6 万美元，收入中位数约 1.4 万，母语讲西班牙语的约 54%。上次选举，代表中央渴谷拉丁裔劳工的工人团结党得票 46.8%，共和党 19.8%，民主党 12.6%。\n夏天谷里白天三十六七度，有记录以来最热到过 46.3 度，采摘机器人和人一起在果园里干活，机器人每小时休息十分钟给电池降温，人没有。雇工们天不亮就出门，中午躲在果树下吃饭，收工后在小镇的杂货店门口喝冰汽水，聊谁家的井又干了。果园里的井越打越深，打井队成了谷里最忙的生意，有人开玩笑说，再打下去就能打到湾区基金的账户里了。"
    en: "Thirsty Valley District is Almondo's great orchards and fields in the western Central Thirsty Valley, home to 90,000 people over some 14,600 km², with Monotony Road running the length of the district along the western edge of the valley. The San Hoarding River, the longest in the state, crosses the district; farms and funds upstream have bought up its water stretch by stretch and hoard it, and in the dry season it is often pumped dry before it reaches the lower valley. The ground sinks tens of centimetres a year, the piers of the old canals now show several steps of foundation, and old telegraph poles lean crookedly in the fields. Billboards by the road ask 'Is Congress Creating the Drought?' and 'Are Almonds Creating the Drought?'; both were made by the same PR firm.\nFarming and food processing hold the district up, with farming and forestry nearly two-fifths of the economy, but the land, the water and the machinery all belong to Bay Area funds, and most of the people who farm are hired hands renting land, water and machines. GDP per head is about $36,000 and median income about $14,000, and about 54% of people speak Spanish as their first language. At the last election the Workers' Solidarity Party, which speaks for the valley's Latino workers, took 46.8% of the vote, the Republican Party 19.8% and the Democratic Party 12.6%.\nSummer days in the valley reach thirty-six or thirty-seven degrees, with a record of 46.3, and picking robots work alongside people in the orchards; the robots rest ten minutes an hour to cool their batteries, and the people do not. The hands leave home before dawn, eat lunch in the shade of the trees and after work drink cold soda outside the village store, talking about whose well has run dry this time. The wells in the orchards keep going deeper and the drilling crews are the busiest business in the valley; people joke that if they drill any further they will strike the Bay Area funds' bank accounts."
