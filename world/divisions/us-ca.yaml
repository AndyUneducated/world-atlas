    es: San Deportes
  notes:
    zh: "自治州南端的港口城市，全市 105 万人，也是州移民与海关执法局的大本营。城名的英语和西班牙语一样，在西班牙语里的意思是「圣体育」，市政府因此每年办一场「遣返马拉松」，终点设在港口的遣返船码头。签证区是港湾边的市中心和海军码头，拉乔利区是海边的富人区和大学，边界线区是南海岸上一道几十公里长的钢墙、检查站、拘押中心和执法局的训练营，后山区是一直伸到东边荒漠的边检山脉。\n城里一半的工作和执法局有关：看守、翻译、律师、伙食承包商、制作手环和脚镣的工厂，还有专门为被拘押的人家属提供探视「套餐」的旅行社。边界线区的钢墙由一个人工智能每天自动加高，因为它的目标是「让越墙者数量下降」，而这个数字每次下降，它就把墙再加高一点；墙已经高得要给飞机装防撞灯了。港湾的阳光和海滩很好，游客照来不误，只是每个酒店前台都会先问一句「您的证件带了吗」。"
    en: "The port city at the southern tip of the state, with 1.05 million people and the headquarters of the State Immigration and Customs Enforcement Agency. Its name is the same in English and Spanish, and in Spanish means 'Saint Sports', so every year the city government holds a 'Deportation Marathon' that finishes at the deportation ship quay in the port. Visa District is the city centre and navy piers on the harbour, La Jolly the rich seaside quarter and the university, Borderline a steel wall dozens of kilometres long on the south coast with checkpoints, detention centres and the agency's training camps, and Backcountry the Checkpoint Range reaching to the desert in the east.\nHalf the jobs in the city have something to do with the agency: guards, interpreters, lawyers, catering contractors, factories making wristbands and ankle chains, and travel agents selling visiting 'packages' to the families of detainees. The steel wall in Borderline is raised a little every day by an artificial intelligence whose goal is to 'reduce the number of people crossing the wall'; each time the number falls, it raises the wall again, and the wall is now high enough to need warning lights for aircraft. The harbour's sunshine and beaches are lovely and the tourists come all the same, but every hotel reception first asks, 'Have you brought your papers?'"
  codes:
    admin: '060500'
    unlocode: US SDP
  population: 1050000
  area_km2: 12000.0
  color: '#1E3A5F'
  flag: { layout: ensign, colors: ['#1E3A5F', '#FFFFFF'], charge: badge, charge_color: '#1E3A5F' }
  flag_notes:
    zh: "深蓝旗面，左上角是自治州旗，右边的白色圆章里是一枚深蓝色的七角执法徽章。旗面的蓝色与执法局制服同色，执法局把这面旗挂在每一座拘押中心门口，市政府后来发现城旗的版权登记在执法局名下。"
    en: "A dark blue field with the state flag in the canton and, in a white roundel in the fly, a dark blue seven-pointed enforcement badge. The blue is that of the Enforcement Agency's uniforms; the agency flies the flag at the gate of every detention centre, and the city government later discovered that the flag's copyright is registered to the agency."
  traits: { industries: [enforcement, defence, port, tourism], heritage: ca_mixed, age: young, income: 0.85 }
