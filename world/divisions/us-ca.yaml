- id: div_0vf1b0
  subtype: borough
  parent: div_35n7cb
  status: generated
  names:
    zh: 先验区
    en: Prior District
    es: A Priori
  notes:
    zh: "先验区在海湾半岛的北端，是贝叶斯的老城，面积约 338 平方公里，住着约 1.8 万人，是全市人口最多的区。坡道很陡，老缆车还在开，只是司机换成了机器人。维多利亚式的彩色木屋大多空着，由机器人维持原样，游客可以付费进去参观「曾经有人住过的样子」，旅游业因此和人工智能、移民执法一起撑着区里的经济。闭源智能的总部园区在区里，楼没有朝外的窗户；州最高法院坚持留在老城，夜里还亮着灯；多余出行的机器人出租车总站每天放出几千辆空车。半岛最北端是退出角，南边的海湾岸上是贝叶斯国际机场；堵车领道从这里跨海去后验区，海景付费公路沿海岸南下，三公里长的无处领道只负责把两条领道接起来。\n贝叶斯地铁只有一条线、三座车站，奇点路站、丁香站和书院街站，全长约 3.3 公里，是世界上第二短的地铁线，只比最短的那条长一百米；市政董事会为此开过三次会，讨论要不要把终点站往回挪一百米好拿下第一，最后决定先让人工智能评估一下。无人驾驶的列车照着时刻表来回跑，车厢里常常一个人也没有。湾口外的三座雾礁小岛归本区管理，海湾里的遣返岛也在区内，岛上拘押中心的探照灯是老城夜里最亮的光之一。"
    en: "Prior District is the old town of Bayesian at the northern tip of the bay peninsula, about 338 square kilometres with some 18,000 people, the most populous district in the city. The streets are steep and the old cable cars still run, only now with robot drivers. Most of the brightly painted Victorian wooden houses stand empty, kept as they were by robots, and tourists can pay to go inside and see 'what it looked like when people lived here', so tourism holds up the district's economy together with artificial intelligence and immigration enforcement. ClosedAI's headquarters campus is here, its buildings without a single outward-facing window; the State Supreme Court insisted on staying in the old town and still has its lights on at night; and the Waymore robotaxi depot sends out thousands of empty cars every day. Exit Point is at the very tip of the peninsula and Bayesian International Airport on the bay shore to the south; Gridlock Road crosses the water from here to Posterior District, Pay-per-View Coast Road runs south along the coast, and the three-kilometre Road to Nowhere exists only to join two other state roads together.\nThe Bayesian Metro has one line and three stations, Singularity Road, Lilac and Academy Street, about 3.3 kilometres in all, the second shortest metro line in the world and only a hundred metres longer than the shortest; the Municipal Board met three times to discuss moving the terminus back a hundred metres to take first place, and decided in the end to have an AI evaluate the idea first. The driverless trains shuttle back and forth to the timetable, often without a single person aboard. The three Fog Rocks beyond the bay mouth are administered by the district, and Deportation Island in the bay is in the district too; the searchlights of its detention centre are among the brightest lights in the old town at night."
  codes:
    admin: '060301'
  population: 18000
  area_km2: 338.0
  traits: { industries: [ai, tourism, enforcement] }
- id: div_9tazhz
  subtype: borough
  parent: div_35n7cb
  status: generated
  names:
    zh: 后验区
    en: Posterior District
    es: A Posteriori
  notes:
    zh: "后验区在风投湾东岸，是贝叶斯的老工业区和港口，从海湾边的平地一直翻过东边的山丘，面积约 1750 平方公里，住着约 1.5 万人。如今这里是一排排「关灯工厂」：车间里没有人也就不需要灯，夜里整个区漆黑一片，只有机器人的指示灯在动。后验熄灯工厂生产机器人，机器人再去生产别的东西，包括更多的机器人，全厂只有十几名戴头灯上班的维修工程师。港口的龙门吊照常装卸集装箱，司机室里没有人。\n湾区东岸的领道几乎都从区里经过：堵车领道从半岛跨过约 12 公里的后验特大桥上岸，集装箱领道、归属期领道沿岸南下，南瓜领道和备用链路领道从对岸跨海过来，空车领道和延迟领道往东去。几条短短的领道各有来历：编号错误领道的编号谁也说不清，短路领道在市中心把三条领道接在一起，隧道视野领道名字里有隧道，路边却只立了一座不通车的隧道口，如今是拍照的去处。\n老街区里还住着一些人，主要是工厂的维修工和不肯搬走的老居民，他们晚上在门口点蜡烛，说要让城市「看起来像有人」。山后谷地的学区排名每年照样公布，公布那天去看房的车会把隧道视野领道堵上一阵，看完房价开回来时，车速明显慢了许多。"
    en: "Posterior District, on the east shore of Venture Bay, is Bayesian's old industrial district and port, running from the flats by the water over the hills to the east, about 1,750 square kilometres with some 15,000 people. Today it is row upon row of 'lights-out factories': with no people in the workshops there is no need for lights, so at night the whole district is pitch dark except for the moving status lights of the robots. The Posterior Lights-Out Factory makes robots, which go on to make other things, including more robots, and the whole plant has only a dozen or so maintenance engineers, who come to work wearing head torches. The gantry cranes in the port still load and unload containers, with nobody in the cabs.\nAlmost every state road on the east side of the bay passes through: Gridlock Road comes ashore from the peninsula over the Posterior Bridge, about 12 kilometres long, Container Road and Vesting Road run south along the shore, Pumpkin Road and Failover Road cross the water from the far side, and Empty Car Road and Latency Road head east. A few short state roads each have their story: nobody can explain the number of Misnumbered Road, Short Circuit Road joins three state roads together in the town centre, and Tunnel Vision Road has a tunnel in its name but only a tunnel portal by the roadside that no traffic goes through, now a favourite spot for photographs.\nSome people still live in the old neighbourhoods, mainly factory maintenance workers and old residents who would not move, and in the evenings they light candles in their doorways to make the city 'look like someone lives here'. The school rankings for the valley behind the hills are still published every year, and on the day they come out the cars of house-hunters clog Tunnel Vision Road for a while; after seeing the prices, they drive back noticeably more slowly."
  codes:
    admin: '060302'
  population: 15000
  area_km2: 1750.0
  traits: { industries: [robotics, manufacturing, port] }
