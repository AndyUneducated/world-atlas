# ── 雷达克特市──
- id: div_57c6nv
  subtype: locality
  parent: div_x2z14w
  status: generated
  names:
    zh: 雷达克特市
    en: Redacted City
    es: Censurado
  notes:
    zh: "自治州北部的山地城市，全市 16 万人，面积 7.15 万平方公里，是自治州面积第二大的市。城里大部分地方是森林、火山和熔岩高原，级联故障山脉的两座火山在北边，萨克拉钱托河从这里流向南边的河谷。涂黑区是城市的中心和水库，待建州区是北部的山地和火山，熔岩高原区是东边的高原和湖泊。城名来自市政府的档案：这里的人对州政府极不信任，所有向州政府提交的文件都会先把一大半内容涂黑，久而久之，城名也被涂黑了，只剩下「已涂黑」三个字。\n雷达克特人说自己住在「还没成立的州」：北边的居民几十年来一直在争取从加州分出去另立一州，路边的牌子上写着「欢迎来到待建州」，州长每次来访都会被送一顶写着「再见」的帽子。山里的人打猎、伐木、开小型金矿，家家有枪有发电机，谁也不信人工智能，最受欢迎的店是卖罐头和防毒面具的。级联故障山脉的火山顶终年积雪，晴天时从城里看得见。"
    en: "The mountain city of the north of the state, with 160,000 people and 71,500 km², the second largest city in the state by area. Most of it is forest, volcanoes and lava plateau; the two volcanoes of the Cascading Failure Range rise in the north, and the Sacramoney River flows from here south towards the valley. Blackout District is the city centre and its reservoir, Statehood-Pending the mountains and volcanoes in the north, and Lava Plateau the plateau and lakes to the east. The name comes from the city government's files: people here distrust the state government so much that every document sent to it has most of its contents blacked out first, and in the end the city's own name was blacked out too, leaving only 'Redacted'.\nRedacted people say they live in 'a state not yet founded': for decades the people of the north have campaigned to leave California and form a state of their own, the signs by the road read 'Welcome to the State of Pending', and every visiting governor is presented with a cap that says 'Goodbye'. People in the mountains hunt, log and work small gold mines, every household has guns and a generator, nobody trusts artificial intelligence, and the most popular shops sell tinned food and gas masks. The volcano tops of the Cascading Failure Range are snow-capped all year and can be seen from the city on a clear day."
  codes:
    admin: '061500'
  population: 160000
  area_km2: 71500.0
  color: '#3D405B'
  flag: { layout: bands, colors: ['#111111', '#F5F5F5', '#111111'], ratio: [2, 1, 2], charge: star5, charge_color: '#111111', charge_band: 1 }
  flag_notes:
    zh: "黑、白、黑三道横条，中间的白条上一颗黑色的五角星。市政府的说法是：城旗的原设计已经涂黑，现在看到的是公开版本，五角星代表「待建州」；原设计据说藏在市政厅地下室里，没有人申请到查阅权限。"
    en: "Black, white and black bands with a black five-pointed star on the white band. According to the city government, the original design has been redacted and this is the public version, the star standing for the 'State of Pending'; the original is said to be kept in the City Hall basement, and nobody has ever been granted permission to see it."
  traits: { industries: [forestry, hydropower, mining, tourism], heritage: ca_anglo, age: old, income: 0.6 }
