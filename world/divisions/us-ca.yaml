  parent: div_91r9b3
  status: generated
  names:
    zh: 蔓延维尔区
    en: Sprawlville District
    es: Villa Expansión
  notes:
    zh: 首府东边一望无际的郊区，同一张图纸盖出的独栋住宅沿着弯弯曲曲的尽头路排开，每家门前一块草坪、车库里两辆车。区里没有人行道，也没有市中心，最热闹的地方是一座购物中心的停车场。大多数居民是在游说区上班的公务员和被裁员后在家「做自媒体」的前白领。
    en: The endless suburbs east of the capital, where houses built from the same set of plans line winding cul-de-sacs, each with a lawn in front and two cars in the garage. There are no pavements and no town centre; the liveliest place is a shopping-mall car park. Most residents are civil servants who work in Lobbyton and laid-off office workers who now 'make content' at home.
  codes:
