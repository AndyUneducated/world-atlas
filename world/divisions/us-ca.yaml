  notes:
    zh: 失落天使的老市中心，摩天楼、市政厅和几座老剧院都在这里。白领被人工智能取代后，写字楼的空置率过了一半，大楼改成了数据机房和自动仓库，楼下的人行道上是绵延十几个街区的帐篷城。市政厅门前的喷泉每天中午准时开放，据说是为了让帐篷城的人有地方洗脸。
    en: The old centre of Lost Angeles, with the skyscrapers, City Hall and several old theatres. Since office workers were replaced by artificial intelligence more than half the office space has stood empty, and towers have become server rooms and automated warehouses, while the pavements below are a tent city a dozen blocks long. The fountain in front of City Hall comes on punctually every day at noon, so it is said, to give the people of the tent city somewhere to wash.
  codes:
