- id: div_r0qhbd
  subtype: borough
  parent: div_03k9fc
  status: generated
  names:
    zh: 果仁区
    en: Kernel District
    es: Núcleo
  notes:
    zh: "果仁区是阿尔蒙多的市中心，全区 38 万人，面积约 400 平方公里，四周是杏仁和开心果的去壳厂、烘烤厂和冷库，空气里一年四季都是烤坚果的香味。食品加工、商业和物流是三大行业，工业占全区经济的四成多。杏仁领道纵贯谷底，融资窗口领道从这里往东进山；加州高速铁路的阿尔蒙多站在区里，最长的果仁高架桥约 16.5 公里，从城区上空穿过，每天两班车从头顶掠过，城里人抬头就能对表。市中心有一座农民市场，卖的坚果比超市贵，因为它们是「人摘的」。\n区里的人一半讲西班牙语，一半讲英语，很多人的工作是在流水线边上把坚果分级、装袋，或开着叉车在冷库之间跑。阿尔蒙多人说杏仁是「喝水的金子」，地、水和农机都属于湾区的基金，城里的人挣的是加工费，全区人均 GDP 约 4.6 万美元，收入中位数约 1.4 万。\n夏天谷里热得厉害，七月白天将近 37 度，有记录以来最热到过 47.7 度，烘烤厂的工人说夏天站在炉边和站在街上差不多。每年开春，杏花开遍谷地，基金经理们从湾区坐直升机来拍照，那一周是城里最热闹的时候，市中心的餐馆排起长队，农民市场的摊主多挂一块「本摊坚果从未见过机器人」的牌子。上次选举，民主党得票 41.2%，工人团结党 21%，共和党 10%。"
    en: "Kernel District is the centre of Almondo, home to 380,000 people over some 400 km², surrounded by almond and pistachio hulling plants, roasteries and cold stores, the air smelling of roasting nuts all year round. Food processing, commerce and logistics are its three main industries, and manufacturing makes up over two-fifths of the district's economy. Almond Road runs the length of the valley floor and Funding Window Road heads east from here into the mountains; the California High-Speed Railway's Almondo Station is in the district, and its longest bridge, the Kernel Viaduct, about 16.5 km long, crosses above the city, so that with two trains a day sweeping overhead, people can set their watches by looking up. In the centre is a farmers' market whose nuts cost more than the supermarket's because they were 'picked by people'.\nHalf the district speaks Spanish and half English, and many people work grading and bagging nuts beside the production lines or driving forklifts between the cold stores. People in Almondo call almonds 'gold that drinks water'; the land, the water and the machinery all belong to Bay Area funds, and the townspeople earn the processing fees, so GDP per head is about $46,000 and median income about $14,000.\nSummers in the valley are fierce, nearly 37 degrees by day in July, with a record of 47.7; workers at the roasteries say that standing by the ovens in summer is much the same as standing in the street. Every spring, when almond blossom covers the valley, fund managers fly in by helicopter from the Bay Area to take photographs; that week is the busiest in town, with queues outside the restaurants in the centre and stallholders at the farmers' market hanging up an extra sign: 'These nuts have never met a robot'. At the last election the Democratic Party took 41.2% of the vote, the Workers' Solidarity Party 21% and the Republican Party 10%."
