- id: div_9fqezr
  subtype: borough
  parent: div_dyj07f
  status: generated
  names:
    zh: 雪道区
    en: Ski District
    es: Pistas
  notes:
    zh: "雪道区在估值山脉东坡，是玛门的滑雪小城、高山湖区和垄断湖，面积约 1.2 万平方公里，住着约 4.5 万人，占全市四分之三。全州最高的独角兽峰和第二高的十角兽峰都在区里，两峰之间的融资轮山口海拔 2891 米，冬天大雪封山，只有夏天能走，登山的人说不管往哪边上，都得先交一笔钱。冬天雪道开放，夏天是徒步和山地自行车的季节；整座山归一家基金所有，雪道、缆车、酒店和小城的房子都在它名下，居民每月交「山地订阅费」。\n垄断湖是一个没有出口的古老咸水湖，湖里立着一根根白色的石灰华柱，湖上的小岛是海鸥的繁殖地。湖的取水权属于失落天使，湖面因此一年年下降，石灰华柱越露越高，游客反而更爱来了。离线领道沿山脚南北穿过区里，融资窗口领道从西边穿山而来，在区里走到尽头，下山的最后一段架在长长的雪道特大桥上。\n旺季的小城街上全是滑雪板和羽绒服，咖啡卖得比山下贵三倍；缆车工、雪场救护员和酒店服务员大多住在山脚的拖车营地，下了班挤在营地的小酒馆里看比赛。春天雪化的时候，草甸上开满野花，护林员开始数今年又有多少人为了一张照片走出了步道。"
    en: "Ski District, on the eastern slopes of the Sierra Valuation, is Mammon's ski town, high lake country and Monopoly Lake, about 12,000 square kilometres with some 45,000 people, three quarters of the city. Mount Unicorn, the highest summit in the state, and Mount Decacorn, the second highest, are both in the district, and Funding Round Pass between them, at 2,891 metres, is snowed shut in winter and passable only in summer; climbers say that whichever way you go up from it, you have to pay first. The ski runs open in winter, and summer is the season for hiking and mountain biking; the whole mountain belongs to a fund, which owns the runs, the lifts, the hotels and the houses in town, and residents pay a monthly 'mountain subscription fee'.\nMonopoly Lake is an ancient salt lake with no outlet, studded with white tufa towers, and its islands are a breeding ground for gulls. The rights to its water belong to Lost Angeles, so its level falls year after year and the tufa towers stand ever taller, which only makes the tourists love it more. Offline Road runs north to south along the foot of the mountains through the district, and Funding Window Road comes through the mountains from the west and ends here, its last stretch down the mountain carried on the long Ski Bridge.\nIn high season the town's streets are all snowboards and down jackets, and coffee costs three times what it does down in the valley; lift operators, ski patrollers and hotel staff mostly live in the trailer camps at the foot of the mountains and crowd into the camp bars after work to watch the match. In spring, when the snow melts, the meadows fill with wild flowers and the rangers begin counting how many people have strayed off the trail this year for the sake of a photograph."
  codes:
    admin: '061701'
  population: 45000
  area_km2: 12000.0
  traits: { industries: [ski, tourism, conservation] }
- id: div_9n9342
  subtype: borough
  parent: div_dyj07f
  status: generated
  names:
    zh: 坏账谷区
    en: Bad Debt Valley District
    es: Valle Incobrable
  notes:
    zh: "坏账谷区在估值山脉以东，是白皮书山脉、薄荷币山脉之间的荒漠盆地和谷地，面积约 2.3 万平方公里，占了玛门全市三分之二，只住着约 1.5 万人。最低的盆地夏天热得像烤炉，谷底的盐滩白得刺眼；西边的降价轮峰海拔 3275 米，东坡陡落进谷里，从谷底抬头看，雪峰和盐滩只隔着一道山坡。东边的白皮书山脉山顶终年泛白，山上长着树龄好几千年的老松树；薄荷币山脉的主峰矿机峰下有废弃的银矿和矿城，一家公司曾把坑道装满加密货币矿机，币价归零那天全部断电，如今机器上住着蝙蝠。\n区里靠旅游、采矿与石料和自然保护过日子，还在开工的是几处石料场，护林员管着沙丘和夜空保护区。离线领道沿山脚南北穿过谷地，开车几十公里看不见一个加油站，路边的牌子提醒司机「前方无信号，请提前下载地图」。荒漠里那座废弃的矿城，老银行门上至今贴着「暂停兑付」，游客在门前排队拍照。\n夜里谷里没有一点灯光，银河清晰得像一条路，观星的人从湾区开车来，躺在盐滩边的车顶上数流星。夏天中午，谷底的温度计成了景点，人们站在旁边拍一张照片，然后赶紧躲回开着空调的车里。"
    en: "Bad Debt Valley District lies east of the Sierra Valuation, the desert basins and valleys between the White Paper Mountains and the Mintcoin Range, about 23,000 square kilometres, two thirds of Mammon, with only some 15,000 people. The lowest basin is like an oven in summer and the salt flats on the valley floor dazzle the eye; to the west Mount Down Round, 3,275 metres high, drops steeply into the valley on its eastern side, so that from the valley floor a snowy summit and a salt flat seem separated by a single slope. To the east the summits of the White Paper Mountains are white all year, with pines thousands of years old on their slopes; beneath Mount Mining Rig, the main summit of the Mintcoin Range, lie an abandoned silver mine and mining town, whose tunnels a company once filled with cryptocurrency mining rigs that were all switched off the day the coin hit zero, and bats now live on the machines.\nThe district lives on tourism, mining and quarrying, and nature conservation; a few quarries are still working, and rangers look after the dunes and the dark-sky reserve. Offline Road runs north to south along the foot of the mountains through the valley, with no petrol station for tens of kilometres, and roadside signs remind drivers: 'No signal ahead. Please download your maps in advance.' In the abandoned mining town in the desert, a 'Withdrawals Suspended' notice is still stuck to the door of the old bank, and tourists queue to have their photographs taken in front of it.\nAt night there is not a single light in the valley and the Milky Way is as clear as a road; stargazers drive out from the Bay Area to lie on their car roofs beside the salt flats counting shooting stars. At summer noon the thermometer on the valley floor becomes an attraction, and people stand beside it for a photograph before hurrying back to their air-conditioned cars."
  codes:
