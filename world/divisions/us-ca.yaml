# ── 离岸群岛市──
- id: div_943qb5
  subtype: locality
  parent: div_x2z14w
  status: generated
  names:
    zh: 离岸群岛市
    en: Offshore Islands City
    es: Islas Paraíso Fiscal
  notes:
    zh: "南海岸外的六座岛屿，全市 1.5 万人，是自治州的避税天堂：在岛上登记的公司不交州税，岛上的豪宅也不交房产税，理由是「海岛的土地还在测量中」。避税列岛区是西边四座岛，岛上登记着几万家公司，真正住在岛上的是看管邮箱的人和一群灰狐狸；亿万岛区是东边的两座岛，北边那座全是度假豪宅和游艇码头，南边那座是富豪们合建的地堡岛，岛内的山体被挖空，能让几百个家庭在地下住上几年。\n离岸群岛人说岛上最多的是三样东西：邮箱、海鸟和律师。每座岛之间有私人渡轮和直升机，可没有一班公共航线，岛民去本岛看病要搭送货的船。地堡岛每年做一次「末日演习」，演习那天岛主们乘直升机上岛，在地堡里吃一顿晚餐，然后离开，岛上的工作人员说那是一年中最热闹的一晚。"
    en: "Six islands off the south coast, with 15,000 people, the state's tax haven: companies registered on the islands pay no state tax and the island mansions no property tax, on the grounds that 'the islands' land is still being surveyed'. The Tax Shelter Islands District is the four western islands, where tens of thousands of companies are registered and the people who actually live there are those who look after the mailboxes, along with a population of grey foxes; the Billionaire Isles District is the two eastern islands, the northern one all holiday mansions and marinas and the southern a bunker island built jointly by the very rich, its hill hollowed out so that hundreds of families could live underground for years.\nIslanders say the three things there are most of are mailboxes, seabirds and lawyers. There are private ferries and helicopters between the islands but not a single public service, and islanders going to the main island to see a doctor ride the supply boats. Once a year the bunker island holds a 'doomsday drill': the owners fly in by helicopter, eat a dinner in the bunker and leave again, and the island staff say it is the liveliest night of the year."
  codes:
    admin: '061800'
  population: 15000
  area_km2: 3000.0
  color: '#0EA5E9'
  flag: { layout: mirror, colors: ['#0EA5E9', '#FDE68A'], charge: key, charge_color: '#0F172A' }
  flag_notes:
    zh: "天蓝的海和沙黄的岛隔着水线互换颜色，正中一把深蓝的钥匙。钥匙是保险箱的钥匙，也是地堡的钥匙；城旗在岛上登记为一家公司的商标，这家公司的地址是一只邮箱。"
    en: "Sky-blue sea and sand-yellow island counterchanged across the waterline, with a dark blue key in the middle. The key is the key to a safe deposit box and to the bunker; the flag is registered on the islands as the trademark of a company whose address is a mailbox."
  traits: { industries: [finance, luxury, security, tourism], heritage: ca_global, age: old, income: 9.0 }
