  flag_notes:
    zh: "上蓝下褐，地平线上长出一株深褐色的幼苗。蓝色是谷地上空难得的晴天，褐色是龟裂的土地；幼苗原本画的是一棵杏树，后来按基金股东的意见改成幼苗，理由是「幼苗代表增长空间」。"
    en: "Blue over brown, with a dark brown seedling rising from the horizon. The blue is the valley's rare clear sky and the brown its cracked earth; the seedling was first drawn as an almond tree and changed at the request of the fund shareholders, on the grounds that 'a seedling represents room for growth'."
