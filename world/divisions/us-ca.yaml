  names:
    zh: 井口区
    en: Wellhead District
    es: Boca de Pozo
  notes:
    zh: "井口区是巴雷尔斯菲尔德的市中心，全区 32 万人，面积约 1000 平方公里，在中央渴谷的南端。炼油厂的火炬在城边日夜燃烧，市中心有一座牛仔竞技场和几十家乡村音乐酒吧，和炼油厂挤在一起。杏仁领道和沉没成本领道在区里交会，城外是棉花地、葡萄园和胡萝卜田，再往西就是压裂原区的油田。石油开采与炼化、商业和食品加工是三大行业，工业占全区经济的近一半，全区人均 GDP 约 7.4 万美元，收入中位数约 1.9 万。城里的皮卡比轿车多，停车场比公园大。\n这里是自治州里少有的不在乎人工智能的地方：抽油机不需要聪明，只需要不停。城里人说话带着一种慢吞吞的乡村口音，周末去竞技场看骑牛，晚上在酒吧里听人唱关于卡车、石油和前妻的歌。每到选举，城里的车尾贴纸一半写着「钻吧，宝贝，钻」，另一半写着「我们的井比湾区的模型更深」；上次选举，共和党得票 49.4%，民主党 18.6%，加速党 11.1%。\n夏天热得厉害，七月白天将近 38 度，有记录以来最热到过 48.9 度，一年的雨不到 300 毫米。炼油厂换班的时候，皮卡一辆接一辆开出厂门，直接开进酒吧的停车场；周六晚上竞技场灯火通明，看台上的人戴着牛仔帽、吃着烤肉三明治，为骑在牛背上撑过八秒的年轻人欢呼。本地人说，火炬灭的那天，才是这座城真正停下来的那天。"
    en: "Wellhead District is the centre of Barrelsfield, at the southern end of the Central Thirsty Valley, home to 320,000 people over some 1,000 km². The refinery flares burn day and night on the edge of town, and the centre has a rodeo arena and dozens of country music bars, crowded in alongside the refineries. Almond Road and Sunk Cost Road meet in the district; outside town lie cotton fields, vineyards and carrot fields, and further west the oil fields of Fracklands District. Oil and refining, commerce and food processing are the three main industries, with industry nearly half the economy; GDP per head is about $74,000 and median income about $19,000. There are more pickup trucks in town than cars, and more car park than park.\nThis is one of the few places in the state that doesn't care about artificial intelligence: a pumpjack doesn't need to be clever, only to keep going. People here speak with a slow country drawl, watch bull riding at the arena at weekends and listen in the bars at night to songs about trucks, oil and ex-wives. At every election half the bumper stickers in town read 'Drill, Baby, Drill' and the other half 'Our Wells Go Deeper Than the Bay Area's Models'; at the last election the Republican Party took 49.4% of the vote, the Democratic Party 18.6% and the Accelerate Party 11.1%.\nSummers are fierce, nearly 38 degrees by day in July with a record of 48.9, and less than 300 mm of rain falls a year. At shift change at the refinery, pickups pour out of the gates one after another and drive straight into the bar car parks; on Saturday nights the arena is floodlit, and the stands, full of cowboy hats and barbecue sandwiches, cheer every young rider who lasts eight seconds on a bull. Locals say the day the flares go out will be the day this town truly stops."
