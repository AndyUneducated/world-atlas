    es: Terminal
  notes:
    zh: "终点站区是斯塔克顿的市中心和河港，全区 23 万人，面积约 500 平方公里。河港通过三角洲的航道连着海湾，驳船运来化肥，运走番茄罐头。单调领道、杏仁领道和空车领道在区里交会，港口、物流和食品加工是三大行业。城南的高铁终点站斯塔克顿站是一座玻璃和钢的大厅，大厅里有一块倒计时牌，显示「距全线通车还有：待定」。铁路从南边修了很多年，终于修到了这片空地上，可铁轨出了站往北只铺了两公里就停住了，因为下一段还在做环境评估；每天只有两班车开往南边荒漠里的荒漠枢纽站。\n斯塔克顿是全州收入中位数最低的市，区里的收入中位数约 1.4 万美元，失业率高，房子便宜，湾区搬走的人有不少在这里落脚。他们每天早上坐在空荡荡的月台上用笔记本电脑接零活，说这里是全州网速最快、人最少的办公室。上次选举，民主党得票 33.9%，共和党 16.7%，拔插头联盟 15.9%。\n车站咖啡馆的招牌菜叫「下一期」，是一块永远只上一半的蛋糕。因为一天只有两班车，车票总是提前几个月卖光，站门口有黄牛专门倒卖高铁票，价格比机票还贵。河港那边是另一番样子：清晨驳船靠岸，码头工人卸下一袋袋化肥，罐头厂的货车在堤上排队，夏天番茄季，整个河港都飘着煮番茄的酸甜味。傍晚，人们到河堤上散步，看驳船慢慢驶向三角洲，有人说这是城里唯一准时出发的交通工具。"
    en: "Terminus District is the centre and river port of Stuckton, home to 230,000 people over some 500 km². The port is linked by the delta's shipping channels to the bay, and barges bring in fertiliser and carry away tinned tomatoes. Monotony Road, Almond Road and Empty Car Road meet in the district, and port and shipping, logistics and food processing are its three main industries. South of the city the high-speed railway terminus, Stuckton Station, is a hall of glass and steel with a countdown board reading 'Full line opens in: TBD'. The railway took many years to build from the south and finally reached this empty lot, but the track runs only two kilometres north out of the station before it stops, because the next section is still under environmental review; only two trains a day leave, for Desert Hub Station in the desert to the south.\nStuckton has the lowest median income of any city in the state, about $14,000 in this district; unemployment is high and houses cheap, and many people who left the Bay Area have settled here. Every morning they sit on the empty platforms taking gig work on their laptops, calling it the office with the fastest internet and fewest people in the state. At the last election the Democratic Party took 33.9% of the vote, the Republican Party 16.7% and the Unplug League 15.9%.\nThe station café's signature dish is called 'Phase Two', a cake only ever half served. With only two trains a day, tickets sell out months in advance, and touts outside the station resell them for more than a plane ticket. The river port is another world: barges tie up at dawn, dockers unload sacks of fertiliser and cannery lorries queue along the levee, and in the summer tomato season the whole port smells sweet and sour of cooking tomatoes. In the evening people stroll along the levee watching the barges glide slowly towards the delta, and some say they are the only transport in town that leaves on time."
  codes:
    admin: '061001'
  population: 230000
  area_km2: 500.0
  traits: { industries: [port, logistics, food] }
- id: div_tnbcec
  subtype: borough
  parent: div_r7wm1v
  status: generated
  names:
    zh: 谦逊区
    en: Modestly District
    es: Modestia
  notes:
    zh: "谦逊区是斯塔克顿以东的农田、果园和估值山脉山脚的丘陵，全区 7 万人，面积约 1.45 万平方公里，占了全市大半。丘陵里有几座老淘金镇，木头房子和酒馆保留着淘金时代的样子。杏仁领道从谷底经过，加州高速铁路的谦逊站在区里，每天两班车停靠，车票总是提前几个月卖光。农业、旅游和葡萄酒是三大行业，农业占全区经济的两成多，全区人均 GDP 约 2.5 万美元，收入中位数只有约 1.2 万。\n如今山里淘的是另一种金子：湾区的人来这里买下老镇子的房子，改成远程办公的度假屋。老酒馆的木吧台边上，戴耳机开视频会议的人和戴牛仔帽的老农坐在一起，一个在说「季度目标」，一个在说「今年的桃子」。镇上的房价被抬了上去，本地的年轻人只好搬到谷底的平房里。\n夏天谷里又干又热，七月白天约 35 度，有记录以来最热到过 46.4 度，果园里的灌溉渠是孩子们唯一能泡的水。秋天收葡萄和核桃，丘陵上的小酒庄开门迎客，酒比梅洛特便宜得多，游客说这里的酒「不贵，也不装」。淘金镇每年办一次淘金节，游客在小溪里摇淘盘，摇出来的金粒是镇上提前撒进去的，大家心照不宣。谦逊站的站台上常有人拍照，因为这是全州少数几个真正停高铁的车站。上次选举，共和党得票 46.7%，民主党 12.3%，加州独立党 10%。"
    en: "Modestly District is the farms and orchards east of Stuckton and the foothills of the Sierra Valuation, home to 70,000 people over some 14,500 km², most of the city. In the foothills, several old gold-rush towns keep their wooden houses and saloons as they were in the gold-rush days. Almond Road crosses the valley floor, and the California High-Speed Railway's Modestly Station is in the district, served by two trains a day whose tickets sell out months ahead. Farming, tourism and wine are the three main industries, with farming over a fifth of the economy; GDP per head is about $25,000 and median income only about $12,000.\nToday the hills are mined for another kind of gold, as people from the Bay Area buy up the old towns' houses as remote-working retreats. At the wooden bars of the old saloons, people in headsets on video calls sit beside old farmers in cowboy hats, one talking about 'quarterly targets' and the other about 'this year's peaches'. House prices in the towns have been driven up, and young locals have had to move to bungalows on the valley floor.\nSummers in the valley are hot and dry, about 35 degrees by day in July, with a record of 46.4, and the irrigation ditches in the orchards are the only water the children can splash in. In autumn come the grape and walnut harvests, and the small wineries in the foothills open their doors; the wine is much cheaper than Merlotte's, and visitors say it is 'not dear, and not pretentious'. Once a year the gold-rush towns hold a gold-rush festival, where tourists pan in the creeks for gold that the town has scattered there beforehand, and nobody says a word. People often take photographs on the platform at Modestly Station, as it is one of the few stations in the state where a high-speed train actually stops. At the last election the Republican Party took 46.7% of the vote, the Democratic Party 12.3% and the California Independence Party 10%."
  codes:
    admin: '061002'
  population: 70000
  area_km2: 14500.0
  traits: { industries: [agriculture, tourism, wine] }

# ── 圣塞雷娜市──
- id: div_xrad3x
  subtype: locality
  parent: div_x2z14w
  status: generated
  names:
    zh: 圣塞雷娜市
    en: Santa Serena City
    es: Santa Serena
  notes:
    zh: "圣塞雷娜市在中部海岸，是一座海滨城市，全市 22 万人，面积约 1.1 万平方公里，背靠付费墙山脉西段，面朝避税列岛，是全州气候最温和的地方：冬天不冷，夏天不热，一年三百天阳光。传教区是城市的中心，白墙红瓦的老传教站和一条棕榈大道通向海边；城西的乔什庄园区是乔什的家，他的私人山脉、葡萄园、赛车场和车牌厂占了大半个区；再往西北的露西芯城区是露西的家，她的芯片城、动物园和牙医诊所就是区里的全部经济。\n乔什做人工智能应用，不训练大模型，而是把别人的模型做成普通人每天真正会打开的东西；他爱车，也爱榴莲。他的庄园里有十个品种分块种植的葡萄园和一座酒庄，一圈约 12 公里、十六个弯的赛车场，全州的个性车牌大多出自他的车牌厂；新街区里还有无醇啤酒厂和六座啤酒屋、可开合温室里的榴莲种植园、人体工学椅博物馆和脊椎医疗中心，最高的乔什峰海拔 1767 米。露西年轻时在好几家芯片和存储公司工作过，后来积累了大量财富，她的芯城有设计中心和逻辑、存储、封装测试、光罩四座厂，还有存储博物馆、十四座场馆的动物园和平面像一颗臼齿的牙科诊所；她对不通风的空气格外敏感，新街区里专门建了一座清风中心，背后的露西峰海拔 1652 米。两座宅邸之间约 70 公里，连着一条双向四十八车道、全线不限速的私人公路和一条只有两站的真空磁悬浮。\n全市靠半导体与芯片、酿酒、旅游和新能源汽车过日子，人均 GDP 约 16.7 万美元，收入中位数 2.6 万美元。广告牌领道穿过传教区、乔什庄园区和露西芯城区，海景付费公路从露西芯城区出发沿海岸北上。市长乔丹·万蒂奇是民主党人，在决选中以 50.5% 的得票险胜共和党对手；11 席的市议会里民主党 6 席，加速党 3 席，共和党 2 席。\n圣塞雷娜人说这里的治安是全州最好的，因为乔什和露西都怕吵：两家共同出钱让城里的警察分局「退休」，换成了只会指路的礼宾员。城里的人多在两家的产业里工作，酿酒的、修赛车的、照顾动物的、在洁净室里穿兔子服的，周末一起到海边的码头上吃鱼和薯条。市议会每年开会讨论一次要不要改城名，因为外地人总以为「塞雷娜」是一种芯片的型号。"
    en: "Santa Serena City is a seaside city on the central coast, with 220,000 people and some 11,000 square kilometres, backed by the western Paywall Range and facing the Tax Shelter Islands, and it has the mildest climate in the state: winters are not cold, summers are not hot, and the sun shines three hundred days a year. Mission District is the city centre, where the white-walled, red-tiled old mission and an avenue of palms lead down to the sea; Josh Estate to the west is Josh's home, his private mountains, vineyards, racing circuit and number-plate works taking up most of the district; and Lucy Chip City further north-west is Lucy's home, where her chip city, zoo and dental clinic make up the district's entire economy.\nJosh works on AI applications, not training large models but turning other people's models into things ordinary people actually open every day; he loves cars, and durian too. His estate has vineyards planted in blocks of ten varieties and a winery, a racing circuit about 12 kilometres a lap with sixteen bends, and the number-plate works where most of the state's personalised plates are made; his new quarter adds an alcohol-free brewery and six beer houses, a durian plantation under opening greenhouses, an ergonomic chair museum and a spine centre, and the highest point is Mount Josh at 1,767 metres. Lucy worked at several chip and memory companies when she was young and later built up a great fortune; her chip city has a design centre and four plants, for logic, memory, packaging and test, and masks, along with a museum of memory, a zoo of fourteen houses and a dental clinic whose plan is shaped like a molar. She is unusually sensitive to stuffy air, and her new quarter includes a Breeze Centre built for the purpose, with Mount Lucy, 1,652 metres high, behind her house. The two houses, some 70 kilometres apart, are linked by a private road with forty-eight lanes and no speed limit anywhere and by a vacuum maglev with just two stations.\nThe city lives on semiconductors, wine, tourism and electric vehicles; GDP per head is about 167,000 dollars and the median income 26,000. Billboard Road crosses Mission District, Josh Estate and Lucy Chip City, and Pay-per-View Coast Road sets off from Lucy Chip City north along the coast. The mayor, Jordan Vantage, is a Democrat who narrowly beat the Republican candidate in the run-off with 50.5 per cent of the vote; on the 11-seat City Council the Democrats hold 6 seats, the Accelerate Party 3 and the Republicans 2.\nSanta Serena people say their city is the safest in the state because Josh and Lucy both dislike noise: the two households jointly paid for the city's police precinct to 'retire', replacing it with concierges who only give directions. Most people in town work for one or other of the two estates, making wine, servicing racing cars, caring for the animals or wearing bunny suits in the clean rooms, and at weekends they all go down to the pier for fish and chips. Once a year the City Council debates whether to rename the city, because outsiders always assume 'Serena' is the model number of a chip."
  codes:
    admin: '061100'
  population: 220000
  area_km2: 11000.0
  color: '#E07A5F'
  flag: { layout: mirror, colors: ['#F4A261', '#2A9D8F'], charge: palm, charge_color: '#FFFFFF' }
  flag_notes:
    zh: "橙色的天空和青绿的大海在水平线上相对，一座小岛和它的倒影隔着水线互换颜色，岛上是一棵白色的棕榈。橙色是海边的日落，青绿是海峡，棕榈是传教区的那条大道；城旗由乔什和露西各出一半设计费，所以上下两半一样大。"
    en: "Orange sky and blue-green sea meet at the horizon, an island and its reflection counterchanged across the waterline, with a white palm on the island. The orange is the sunset over the sea, the blue-green the channel and the palm the avenue of Mission District; Josh and Lucy each paid half the design fee, which is why the two halves are the same size."
