- id: div_hwfcnm
  subtype: borough
  parent: div_9tem3t
  status: generated
  names:
    zh: 罐头厂区
    en: Cannery District
    es: Enlatadora
  notes:
    zh: "罐头厂区是莫内特里的市中心，在海湾南岸，面积约 900 平方公里，住着约 12 万人，占全市将近一半。老罐头厂街的厂房改成了餐馆、酒店和一座大水族馆，水族馆的巨型水箱里养着海带森林和海獭，当年装进罐头的沙丁鱼如今只在水箱里游。港口里还有几条渔船，捕的鱼直接卖给水族馆当饲料。区里靠旅游、科研和渔业过日子，水族馆背后的研究人员研究海獭、海带和越来越暖的海水，他们的论文和游客的照片一样，都要先付费才能看。\n区的地盘从海湾边一直伸到身后的山里，山上是松林和牧场，最高处一千五百多米。广告牌领道从区里经过，路边的广告牌卖的多是观景台的年卡和水族馆的贵宾票。讲西班牙语的人超过一半，罐头厂街背后的老街区里，卷饼店和面包房挨着开，不少人家的祖辈当年就在罐头厂里切鱼。\n清晨的码头最热闹，渔船靠岸，海狮在浮台上抢位置，水族馆的饲养员拎着桶来挑鱼。到了傍晚，游客坐在旧厂房改的酒吧里看海獭仰面漂在海带上敲贝壳，酒吧按观景座位收附加费，靠窗的座位比靠墙的贵一倍，看得见海獭正脸的座位再贵一倍。雾天里港口的雾笛一响，老街区的人就知道该收晾在外面的衣服了。"
    en: "Cannery District is the centre of Monetary, on the south shore of the bay, about 900 square kilometres with some 120,000 people, nearly half the city. The old cannery buildings of Cannery Row have become restaurants, hotels and a great aquarium, whose giant tanks hold a kelp forest and sea otters; the sardines that once went into the tins now swim only in the tanks. A few fishing boats still work from the harbour, selling their catch straight to the aquarium as feed. The district lives on tourism, research and fishing, and the researchers behind the aquarium study sea otters, kelp and the warming sea, their papers, like the tourists' photographs, viewable only after payment.\nThe district reaches from the bay up into the hills behind, where there are pine forests and ranches rising to over 1,500 metres. Billboard Road passes through, its billboards mostly selling annual viewpoint passes and VIP tickets for the aquarium. More than half the people speak Spanish, and in the old streets behind Cannery Row taco shops and bakeries stand side by side, many of the families descended from people who once gutted fish in the canneries.\nThe quay is busiest at dawn, when the boats come in, sea lions jostle for room on the floats and the aquarium keepers come with buckets to choose their fish. In the evening tourists sit in bars in the old factory buildings watching sea otters float on their backs in the kelp, cracking shells, and the bars charge a surcharge for the view: window seats cost twice as much as those by the wall, and seats with a face-on view of the otters twice as much again. On foggy days, when the foghorn sounds in the harbour, people in the old streets know it is time to bring in the washing."
  codes:
    admin: '061201'
  population: 120000
  area_km2: 900.0
  traits: { industries: [tourism, research, fishing] }
- id: div_5fnf38
  subtype: borough
  parent: div_9tem3t
  status: generated
  names:
    zh: 冲浪棚区
    en: Surf Shack District
    es: Choza del Surf
  notes:
    zh: "冲浪棚区在海湾北端，是莫内特里的冲浪小城，面积约 300 平方公里，住着约 6 万人，背后的山一直伸到一千二百多米高的山脊。海边的游乐场和木头过山车还在，过山车每次爬到顶，坐在上面的人都能望见整片海湾；悬崖下是全州最有名的冲浪点之一，冬天浪最大，冲浪的人凌晨就在崖顶排队看浪。小城里还有一所大学，学生们上午上课、下午冲浪，校徽是一只香蕉蛞蝓，据说是因为它和学生一样，从不着急。\n区里靠高等教育、旅游和免税零售过日子，讲英语的超过八成，街上的冲浪板店、二手唱片店和素食咖啡馆多是学生和老冲浪手开的。海景付费公路从区里经过，约 15.5 公里长的冲浪棚特大桥贴着海崖架在海面上，护栏上每隔几十米有一个二维码，扫码能听一段人工智能朗读的「这里的海有多美」，付费版没有广告；冲浪的人说，真正好看的海浪在桥下，不用扫码。\n傍晚是小城最好的时候，冲浪的人坐在崖边的长椅上等最后一道浪，长椅按分钟计时的规矩在这里没人当真。周末的游乐场挤满从湾区和内陆来的家庭，海狮趴在码头下面的木桩上睡觉，偶尔抬头看一眼过山车上尖叫的人。"
    en: "Surf Shack District, at the northern end of the bay, is Monetary's surf town, about 300 square kilometres with some 60,000 people, the hills behind it rising to a ridge over 1,200 metres high. The seaside amusement park and its wooden roller coaster are still there, and every time the coaster climbs to the top its riders can see the whole bay; below the cliffs is one of the most famous surf breaks in the state, with the biggest waves in winter, when surfers queue on the clifftop before dawn to watch the swell. The town also has a university whose students go to lectures in the morning and surf in the afternoon, and whose emblem is a banana slug, chosen, they say, because like the students it is never in a hurry.\nThe district lives on higher education, tourism and duty-free retail; more than eight in ten people speak English, and the surfboard shops, second-hand record shops and vegetarian cafés along the streets are mostly run by students and veteran surfers. Pay-per-View Coast Road passes through, and the Surf Shack Bridge, about 15.5 kilometres long, is carried over the sea alongside the cliffs, with a QR code on the railings every few dozen metres that plays an AI reading of 'how beautiful the sea is here', the paid version without adverts; the surfers say the really beautiful waves are under the bridge, no scanning required.\nEvening is the town's best time, when surfers sit on the clifftop benches waiting for the last wave, and nobody here takes the rule about benches being timed by the minute seriously. At weekends the amusement park is packed with families from the Bay Area and inland, and sea lions sleep on the piles under the pier, now and then lifting their heads to look at the screaming riders on the roller coaster."
  codes:
    admin: '061202'
  population: 60000
  area_km2: 300.0
  traits: { industries: [education, tourism, retail], heritage: ca_anglo }
- id: div_qx3brb
  subtype: borough
  parent: div_9tem3t
  status: generated
  names:
    zh: 大附加费区
    en: Big Surcharge District
    es: Gran Recargo
  notes:
    zh: "大附加费区是莫内特里南边滤镜山脉的悬崖海岸和山后的生菜谷，全区 8 万人，面积约 1.48 万平方公里。海景付费公路在悬崖上蜿蜒一百多公里，每座桥、每个弯道观景台都要单独付费，悬崖上的长椅按分钟计时。滤镜山脉北段的美颜峰海拔 1645 米，西坡直落大海，常年被海雾拦腰截断。山后的谷地种满生菜、草莓和西兰花，全州大部分的生菜都出自这里，田里的雇工大多讲西班牙语，住在谷底小镇的拖车房里；全区母语讲英语的约 49%，西班牙语约 48%。\n这里的海岸是网红们最爱的取景地，他们在悬崖边排队，为了一张照片可以等两个小时，拍出来的照片都会自动加上滤镜，所以没有人知道这里的海到底是什么颜色。美颜峰在照片里比实际高了一倍，一家旅行社按照片里的高度卖登山套餐，退款官司还在打。\n生菜谷的雇工们每天天不亮就下地，弯着腰一棵棵割生菜，中午在地头的餐车上买一份玉米饼，傍晚坐着皮卡回到拖车房。他们说悬崖上的游客一天花的钱比他们一个月挣的还多，全区人均 GDP 约 5.1 万美元，收入中位数只有约 1.6 万。海边凉爽，七月白天只有 24 度上下，谷里却晒得多，雾在山口上停住，像一道看不见的收费站。上次选举，共和党得票 41.3%，工人团结党 21.4%，民主党 12.5%，选票也像这里的人一样，分成了悬崖上的和谷底的。"
    en: "Big Surcharge District is the cliff coast of the Filter Range south of Monetary and the Lettuce Valley behind it, home to 80,000 people over some 14,800 km². The Pay-per-View Coast Road winds along the cliffs for more than a hundred kilometres, every bridge and every viewpoint on every bend is paid for separately, and the benches on the cliffs are charged by the minute. Mount Beautify, 1,645 m high in the northern Filter Range, drops straight into the sea on its western side and is nearly always cut in half by sea fog. The valley behind is planted with lettuce, strawberries and broccoli and grows most of the state's lettuce; most of the field hands speak Spanish and live in trailers in the valley-floor towns, and across the district about 49% speak English as their first language and about 48% Spanish.\nThe coast here is the influencers' favourite backdrop; they queue along the cliff edge and will wait two hours for a single picture, and every picture is filtered automatically, so nobody knows what colour the sea here really is. In photos Mount Beautify is twice its real height, and a travel agency that sold climbing packages by the height in the photos is still fighting refund lawsuits.\nThe field hands of the Lettuce Valley are in the fields before dawn, bent over cutting lettuce head by head; at midday they buy tortillas from a food truck at the edge of the field, and in the evening they ride pick-ups back to their trailers. They say the tourists on the cliffs spend more in a day than they earn in a month; GDP per head is about $51,000, yet median income is only about $16,000. The coast is cool, around 24 degrees by day in July, while the valley bakes, the fog halting at the passes like an invisible toll booth. At the last election the Republican Party took 41.3% of the vote, the Workers' Solidarity Party 21.4% and the Democratic Party 12.5%; the votes, like the people, split between the clifftops and the valley floor."
  codes:
    admin: '061203'
  population: 80000
  area_km2: 14800.0
  traits: { industries: [agriculture, tourism, conservation] }

