  names:
    zh: 游说区
    en: Lobbyton District
    es: Cabildeo
  notes:
    zh: "游说区是首府萨克拉钱托的中心，全区 33 万人，面积约 180 平方公里，州议会大厦、州长办公厅和各厅局都在这里。议会大厦的金色圆顶在区的正中，众议院 80 席、参议院 40 席都在圆顶下开会；北面隔一条林荫道是州长办公厅，十一个厅排在议会大厦南边，州长官邸在东边，被游说公司包下来做了会所。议会大厦四周的街区几乎全是游说公司、律师事务所和筹款餐厅，门牌上写的不是公司名而是代表的行业：「石油」「杏仁」「人工智能」「监狱」，几百家游说公司挤在说客大厦里，电梯按楼层收费。区里的公园叫宪法公园，草坪上常年搭着请愿者的帐篷。\n单调领道、堵车领道和游说—堤坝公路在区里交会；萨克拉钱托地铁1号线全长约 11.3 公里，从王家站到春晓站共 9 站，全在区内，早上挤满了公务员、说客和送餐机器人。全区人均 GDP 约 11.8 万美元，收入中位数约 2.3 万，居民约六成是非洲裔。上次选举，民主党得票 42.9%，加速党 17.7%，共和党 13%。\n议员们说在这里吃一顿早餐比竞选还贵。州长、议员和幕僚平日在这里上班，周末都回失落天使或湾区的家，现任州长住在一辆停在议会停车场里的房车上，以示亲民，房车门口也常有人来递罢免请愿书。夏天这里又干又热，七月白天三十三四度；冬天浓雾从三角洲漫上来，有时一连几天看不见圆顶，游说者说那是全年唯一看不清政府在干什么的日子。"
    en: "Lobbyton District is the heart of the capital, Sacramoney, home to 330,000 people over some 180 km², with the State Capitol, the governor's office and the state departments. The Capitol's golden dome stands in the middle of the district, where the 80-seat Assembly and the 40-seat Senate both sit; across a tree-lined avenue to the north is the Office of the Governor, the eleven departments line up south of the Capitol, and the Governor's Mansion to the east has been taken over by lobbying firms as a clubhouse. The blocks round the Capitol are almost all lobbying firms, law offices and fundraising restaurants, their doorplates naming not a company but the industry they speak for: 'Oil', 'Almonds', 'Artificial Intelligence', 'Prisons', and hundreds of lobbying firms are crammed into Lobbyist Tower, whose lifts charge by the floor. The district's park is Constitution Park, its lawns covered all year with petitioners' tents.\nMonotony Road, Gridlock Road and the Lobbyton–Levee Road meet in the district, and Sacramoney Metro Line 1, about 11.3 km long with 9 stations from Wangjia to Spring Dawn, lies entirely within it, packed in the mornings with civil servants, lobbyists and food-delivery robots. GDP per head is about $118,000 and median income about $23,000, and about six in ten residents are of African descent. At the last election the Democratic Party took 42.9% of the vote, the Accelerate Party 17.7% and the Republican Party 13%.\nLegislators say breakfast here costs more than an election campaign. The governor, legislators and their staff work here on weekdays and go home to Lost Angeles or the Bay Area at weekends; the present governor lives in a camper van parked in the Capitol car park to show the common touch, and people often turn up at its door with recall petitions. Summers are hot and dry, thirty-three or thirty-four degrees by day in July; in winter thick fog rolls up from the delta and sometimes hides the dome for days on end, which lobbyists call the only days of the year when nobody can see what the government is doing."
  codes:
