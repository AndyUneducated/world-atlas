divisions:
- id: div_x2z14w
  subtype: dependency
  parent: country:US
  status: generated
  names:
    zh: 加利福尼亚自治州
    en: California Autonomous State
    es: Estado Autónomo de California
  notes:
    zh: "加利福尼亚自治州是美国在远洋上的自治州，在北纬 32.5° 到 42° 之间，与中国各领地隔着半个星球。主岛南北长约 1200 公里，轮廓照着它得名的那片海岸复刻而成：州议会花了一大笔钱请人工智能「按原样生成」，模型把旧州界也当成了海岸线，于是东边和北边两条笔直的州界成了两段几乎笔直的海岸，岛外还多出一串小岛。陆地约 42 万平方公里，人口 900 万。西边是寒流和海雾里的海岸山脉，中间是长长的中央渴谷，东边是估值山脉，东南是荒漠。居民约三成是欧洲裔，三成拉丁裔，三成非洲裔，其余一成是亚裔和其他族裔；英语和西班牙语都是官方语言，约 65% 的人母语是英语，30% 是西班牙语。全州人均 GDP 约 9 万美元，可这笔钱大多是湾区的机器和十几户人家挣的：人工智能让一大半白领、司机和客服丢了工作，收入中位数只有约 1.8 万美元，失业的人领不到救济，只领到一份「再就业提示词课程」。\n自治州有自己的州长、两院制议会和最高法院，州长直选，选民可以随时联署罢免任何官员，几乎每年都有人被罢免。治安是全州最大的难题：暴力犯罪高得惊人，各市警察局早已分裂成彼此争地盘的「分局」，有自己的颜色、手势和收费表，市民说警察和帮派的区别只在于帮派不开罚单。州移民与海关执法局的人员和预算都超过了教育厅，海边、机场和每条领道上都有它的检查站。州格言「先上线，再道歉」原是湾区一家公司的口号，议会表决时有人提议改成「先道歉，再上线」，没有通过。道路只有领道和市道，没有一条国家高速；修了很多年的高速铁路至今只通了中央渴谷里的一段，起点和终点都不在任何人想去的地方。\n上一次州长选举投票率只有 49.5%，民主党的帕克斯顿·黑尔以 61.3% 对 38.7% 击败共和党的科尔特·巴林顿，后者如今是众议院的少数党领袖，州内阁的 9 个厅全部交给了民主党。州议会的众议院 80 席中，民主党占 52 席，共和党 14 席，加速党 7 席，拔插头联盟 3 席，工人团结党和防火绿党各 2 席；参议院 40 席中民主党占 26 席。选举实行前两名初选，不分党派，得票最多的两人进入决选。公投和罢免离不开联署，征集签名早已是一门生意，签名公司按每个签名计价，州务卿每次都要先剔除模型生成的签名，才能开始数真人的。州旗上那头熊交给人工智能重画时，第一稿有六条腿，议会照样表决通过，后来又发起罢免才改回四条腿，熊身上的金色电路走线则作为妥协留了下来。约 52% 的居民信基督教，三成不信教；州歌叫《我爱你，加利福尼亚》，在人工智能生成的版本里，副歌一共重复了四十遍。"
    en: "The California Autonomous State is an autonomous state of the United States far out in the ocean, between 32.5° and 42° north, half a planet away from the Chinese territories. Its main island runs about 1,200 km from north to south, and its outline is a copy of the coast it is named after: the state legislature paid a great deal for an artificial intelligence to 'generate it exactly as it was', and the model took the old state lines for coastline too, so the two straight borders in the east and north became two almost straight coasts, and a string of small islands appeared offshore. It has some 420,000 km² of land and 9 million people. In the west are coast ranges in a cold current and sea fog, down the middle runs the long Central Thirsty Valley, in the east rises the Sierra Valuation and in the south-east lies desert. About three in ten people are of European descent, three in ten Latino and three in ten of African descent, and the remaining tenth Asian and others; English and Spanish are both official languages, and about 65% speak English as their first language and 30% Spanish. GDP per head is about $90,000, but most of it is earned by the Bay Area's machines and a dozen or so families: artificial intelligence has put more than half the office workers, drivers and call-centre staff out of work, median income is a pitiful $18,000 or so, and the jobless get no benefits, only a 'Prompting for Re-employment' course.\nThe state has its own governor, a two-chamber legislature and a supreme court; the governor is directly elected, and voters can petition to recall any official at any time, which they do nearly every year. Public safety is the state's greatest problem: violent crime is shockingly high, and the city police departments have long since split into 'divisions' that fight over turf, with their own colours, hand signs and price lists; people say the only difference between the police and the gangs is that the gangs don't write tickets. The State Immigration and Customs Enforcement Agency has more staff and a bigger budget than the education department, with checkpoints on the coasts, at the airports and on every state road. The state motto, 'Ship First, Apologize Later', began as a Bay Area company's slogan; when the legislature voted on it, a member moved to change it to 'Apologize First, Ship Later', and lost. There are only state roads and city roads, not one national expressway, and the high-speed railway under construction for many years runs along a single stretch of the Central Thirsty Valley, starting and ending where nobody wants to go.\nAt the last election for governor, on a turnout of just 49.5%, Paxton Hale of the Democratic Party beat Colt Barrington of the Republican Party by 61.3% to 38.7%; Barrington is now Minority Leader in the Assembly, and all nine departments of the state cabinet went to Democrats. Of the 80 seats in the State Assembly, the Democrats hold 52, the Republicans 14, the Accelerate Party 7, the Unplug League 3 and the Workers' Solidarity Party and the Firebreak Greens 2 each; in the 40-seat State Senate the Democrats hold 26. Elections use a top-two primary in which, whatever their party, the two candidates with the most votes go through to the run-off. Ballot measures and recalls depend on petitions, and gathering signatures has long been a business in itself: signature firms charge by the name, and every time the Secretary of State must first weed out the signatures generated by models before starting to count the human ones. When the bear on the state flag was handed to an artificial intelligence to redraw, the first draft had six legs; the legislature approved it anyway, and only a recall campaign brought it back to four, while the gold circuit traces on its body stayed as a compromise. About 52% of residents are Christian and three in ten profess no religion; the state song is I Love You, California, and in the AI-generated version the chorus is repeated forty times."
