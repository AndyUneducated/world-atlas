- id: div_nsgeyn
  subtype: borough
  parent: div_xrad3x
  status: generated
  names:
    zh: 传教区
    en: Mission District
    es: Misión
  notes:
    zh: "传教区是圣塞雷娜的市中心，全区 13 万人，面积约 150 平方公里，背后是付费墙山脉西段，面前是大海。老传教站、法院和白墙红瓦的老街区沿着一条棕榈大道排到海边，海边有一座长长的木码头。城里的建筑都按传教站的样式盖，连加油站也是白墙红瓦。广告牌领道从区里穿过，往西通往乔什庄园区和露西芯城区，茶馆街、鹈鹕路和利伯塔德大街一带是老城最热闹的几条街。区里有一所大学，旅游、商业和高等教育是三大行业，全区人均 GDP 约 15.1 万美元，收入中位数约 2.6 万。\n这里是全州气候最温和的地方，一年三百天阳光，七月白天约 28 度，一月也有 17 度。乔什和露西都怕吵，两家共同出钱让城里的警察分局「退休」，换成了只会指路的礼宾员，礼宾员穿着白衬衫站在棕榈大道的路口，最常回答的问题是「码头怎么走」和「哪家的鱼最新鲜」。\n区里的人很多在两家的产业里工作，酿酒的、修赛车的、照顾动物的、在洁净室里穿兔子服的，平日各自去西边上班，周末一起到木码头上吃鱼和薯条，看海鸥抢游客手里的薯条。夏天傍晚，大学生在码头尽头弹吉他，老人在法院前的草坪上下棋。市议会每年开会讨论一次要不要改城名，因为外地人总以为「塞雷娜」是一种芯片的型号，每次讨论完都决定明年再议。上次选举，民主党得票 41.1%，共和党 23.2%，加速党 18%。"
    en: "Mission District is the centre of Santa Serena, home to 130,000 people over some 150 km², with the western Paywall Range behind it and the sea in front. The old mission, the courthouse and old streets of white walls and red tiles line an avenue of palms down to the sea, which has a long wooden pier. Every building in town follows the mission's style, the petrol stations included. Billboard Road passes through the district, heading west to Josh Estate District and Lucy Chip City District, and the streets around Teahouse Street, Pelican Road and Libertad High Street are the liveliest in the old town. The district has a university, and tourism, commerce and higher education are its three main industries; GDP per head is about $151,000 and median income about $26,000.\nThis is the mildest place in the state, with three hundred days of sun a year, about 28 degrees by day in July and still 17 in January. Josh and Lucy both dislike noise, so the two of them paid together for the city's police division to 'retire', replacing it with concierges who only give directions; they stand at the junctions of the palm avenue in white shirts, and the questions they answer most are 'How do I get to the pier?' and 'Whose fish is freshest?'\nMany people in the district work for the two estates, making wine, fixing racing cars, looking after animals or wearing bunny suits in the clean rooms. On weekdays they head west to work, and at weekends they all come down to the wooden pier for fish and chips, watching the gulls snatch chips from tourists' hands. On summer evenings students play guitar at the end of the pier and old men play chess on the lawn in front of the courthouse. Once a year the city council meets to discuss renaming the city, because outsiders always take 'Serena' for the model number of a chip, and every time it decides to discuss it again next year. At the last election the Democratic Party took 41.1% of the vote, the Republican Party 23.2% and the Accelerate Party 18%."
  codes:
    admin: '061101'
  population: 130000
  area_km2: 150.0
  traits: { industries: [tourism, commerce, education] }
- id: div_jjgxvk
  subtype: borough
  parent: div_xrad3x
  status: generated
  names:
    zh: 乔什庄园区
    en: Josh Estate District
    es: Hacienda Josh
  notes:
    zh: "乔什庄园区是圣塞雷娜西边的一片山谷和山脉，全区约 3 万人，面积约 5500 平方公里，西边有约 73 公里海岸，乔什的家就在这里。区里大部分土地属于乔什的庄园：一座私人山脉，最高处是海拔 1767 米的乔什峰；一片按品种分块种植的葡萄园，从赤霞珠到维欧尼共十个品种，都在乔什酒庄酿成酒；一座一圈约 12 公里的私人赛车场；还有一座车牌制造厂，全州的个性车牌大多出自这里。其余是为庄园工作的人住的小镇。乔什宅邸建在谷地南边的缓坡上，旁边的旧车库是他做人工智能应用的车库实验室。\n庄园里新修的乔什新街区以乔什广场为中心，广场正中立着乔什塑像，四周是无醇啤酒厂和六座啤酒屋、摄影工作室、脊椎医疗中心、人体工学椅博物馆、站立办公大楼和无人机摄影塔；榴莲种植园的温室旁边是全庄园唯一能打开榴莲的气味隔离塔，再往南是武器收藏库和只打纸靶、飞碟的靶场。广告牌领道从区里穿过，露西—乔什私人公路和露西—乔什真空磁悬浮从乔什宅邸西门外直通露西宅邸。\n区里的人大多在庄园的产业里干活，全区人均 GDP 约 11.2 万美元，收入中位数约 2.3 万。采收季的清晨，一筐筐葡萄从各块园子运进酒庄；赛车季的周末，主直道旁的草坡上坐满了来看车的邻居。啤酒屋的酒精度都低于 0.5%，脱出来的酒精掺进了赛车燃料，镇上的人说，这里的啤酒把酒精让给了赛车。榴莲成熟季，乔什常把客人一个个领进隔离塔，出来时每人身上都套着一件一次性围裙，脸上带着不同的表情。"
    en: "Josh Estate District is a stretch of valleys and mountains west of Santa Serena, home to about 30,000 people over some 5,500 km², with about 73 km of coast to the west; this is where Josh lives. Most of the district's land belongs to Josh's estate: a private mountain range rising to Mount Josh at 1,767 m; a vineyard planted variety by variety, ten varieties from Cabernet Sauvignon to Viognier, all made into wine at Josh Winery; a private racetrack about 12 km a lap; and a number-plate factory that makes most of the state's personalised plates. The rest is the small town where the estate's workers live. Josh's House stands on the gentle slopes at the south of the valley, and the old garage beside it is Josh's Garage Lab, where he builds his artificial intelligence apps.\nThe estate's newly built Josh quarter centres on Josh Square, with the Statue of Josh in the middle, surrounded by the alcohol-free brewery and six beer houses, the photo studio, the spine centre, the ergonomic chair museum, the standing office tower and the drone photography tower; next to the greenhouses of the durian plantation stands the odour isolation tower, the only place on the estate where a durian may be opened, and further south are the armoury and a shooting range that uses only paper targets and clay pigeons. Billboard Road passes through the district, and the Lucy–Josh Private Road and the Lucy–Josh Vacuum Maglev run from outside the west gate of Josh's House straight to Lucy's House.\nMost people in the district work for the estate in some way. GDP per head is about $112,000 and median income about $23,000. On harvest mornings basket after basket of grapes comes in to the winery from the different blocks; on race weekends the grassy banks beside the main straight fill with neighbours come to watch. The beer houses all serve beer under 0.5% alcohol, and the alcohol taken out goes into the racing fuel, so locals say the beer here has given up its alcohol to the cars. In durian season Josh often leads his guests into the isolation tower one by one; they all come out wearing disposable aprons, each with a different expression on their face."
  codes:
    admin: '061102'
  population: 30000
  area_km2: 5500.0
  traits: { industries: [wine, automotive, tourism] }
- id: div_zmb3gb
