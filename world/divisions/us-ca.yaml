    zh: "上方酒红、下方麦黄，两色以波浪线相分，正中一串麦黄色的葡萄。酒红是红酒，麦黄是夏天干枯的山坡；葡萄是旗上最贵的部分，城旗的周边商品里，带葡萄的比不带的贵三倍。"
    en: "Wine red over straw, parted by a wavy line, with a straw-coloured bunch of grapes in the middle. The red is red wine and the straw the hillsides dried in summer; the grapes are the most expensive part, and flag merchandise with grapes costs three times as much as without."
  traits: { industries: [wine, tourism, luxury], heritage: ca_anglo, age: old, income: 1.6 }
