  flag: california
  flag_notes:
    zh: "白底，下方一道红条，左上角一颗红星，正中一头棕熊走在一小片绿地上，熊身上布满金色的电路走线。旧熊旗的熊在重新设计时交给人工智能重画，第一稿的熊有六条腿，议会照样表决通过，后来又发起罢免，才改回四条腿；电路走线是作为妥协留下来的，州政府的解释是「熊代表自然，电路代表未来，红星代表我们还没想好的东西」。"
    en: "White over a red stripe, with a red star in the canton and a brown bear walking on a patch of green in the middle, its body laced with gold circuit traces. When the old bear flag was redesigned, the bear was handed to an artificial intelligence to redraw; its first draft had six legs, the legislature approved it anyway, and only a recall campaign brought it back to four. The circuit traces stayed as a compromise; the state government explains that 'the bear stands for nature, the circuits for the future, and the star for whatever we haven't decided yet'."
  climate_notes:
    zh: "加利福尼亚自治州是地中海气候：冬天多雨，夏天几乎滴雨不下，雨水集中在十一月到三月。离岸的寒流让海边终年凉爽，夏天的下午海雾涌进海湾，贝叶斯七月白天约 24 度，一月 16 度；翻过海岸山脉，中央渴谷的夏天又干又热，首府萨克拉钱托七月白天 34 度，往南的阿尔蒙多 37 度。南海岸的失落天使和圣遣返冬暖夏不炎，一月白天 19 到 20 度，七月 29 到 30 度，一年雨水只有 330 毫米左右。估值山脉的东边和东南是荒漠：帕姆斯普林克勒七月白天 43 度，一年降水不到 150 毫米，帝国尘区不到 100 毫米，是全州最干的地方。北部海岸迎着西风，雨水最多，欧福利亚一年 1250 毫米，夏天白天也只有 22 度，红木林常年泡在雾里。山上冬天积雪，塔克斯霍湖边的木屋区一月夜里约零下 2 度。"
    en: "The California Autonomous State has a Mediterranean climate: rainy winters and summers with almost no rain at all, the rain falling mostly from November to March. The cold current offshore keeps the coast cool all year, and on summer afternoons sea fog pours into the bay: Bayesian averages 24 °C by day in July and 16 °C in January. Over the coast ranges the summer in the Central Thirsty Valley is hot and dry, 34 °C by day in July in the capital Sacramoney and 37 °C in Almondo farther south. On the south coast, Lost Angeles and San Deportes have mild winters and warm rather than hot summers, 19 to 20 °C by day in January and 29 to 30 °C in July, with only about 330 mm of rain a year. East and south-east of the Sierra Valuation lies desert: Palm Sprinklers reaches 43 °C by day in July with under 150 mm of rain a year, and Imperial Dust District, the driest place in the state, under 100 mm. The north coast faces the westerlies and gets the most rain, Euphoria 1,250 mm a year and only 22 °C by day even in summer, its redwoods soaking in fog all year. The mountains are snowy in winter, and Chalet District by Lake Taxhoe drops to about −2 °C on January nights."
