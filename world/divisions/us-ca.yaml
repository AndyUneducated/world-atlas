    es: Valle de la Verosimilitud
  notes:
    zh: "似然谷区是贝叶斯市从机场南边沿着海湾西岸一路排到海湾南端谷地的平地，再往东到圣何塞的老市中心和米尔皮塔斯，面积约 870 平方公里，全区只剩约五千人。梨公司、咯咯、无所谓平台、障碍软件和全景监狱技术五家公司的总部都在这里：梨公司无限环是一座围着梨树果园的环形大楼，咯咯园里有免费食堂和滑梯，无所谓平台总部的屋顶铺着草坪，障碍软件的几栋圆柱形玻璃楼围着一个人工湖，全景监狱技术公司的环形楼中间还有一座塔。园区之间是一座接一座的数据中心。广告牌领道、门禁领道、集装箱领道、归属期领道等十几条领道在区里交织，劳伦斯、圣托马斯—蒙塔古、中央、阿尔马登和国会五条县快速路也都经过这里。海湾南部约 20 平方公里的算力岛也归本区，岛上的机房用海水冷却。\n园区里的草坪由机器人修剪，咖啡馆由机器人经营，偶尔出现一个人类员工，其他人会围过来拍照。全区人均 GDP 约 128 万美元，上次选举加速党得票 80.4%。区里的两座 99 Ranch 超市照常开门，货架由机器人补满，收银台前排队的也多是机器人；Monterey Rd 上那家被叫作「便宜超市」的 Walmart 也一样，停车场里停的多是来采购的机器人货车。\n算力岛的出水口附近，海水冬天也冒着热气，湾里的海狮喜欢趴在那里取暖，本地人说它们是全州唯一从人工智能那里得到好处的动物。剩下的几千个居民彼此几乎都认得，周末在 Wolfe Rd 那家 99 Ranch 门口排队买烧腊饭，算是区里最像人间的时刻。"
    en: "Likelihood Valley District is Bayesian's flat land along the west shore of the bay from south of the airport to the valley at its southern end, and on east to old downtown San Jose and Milpitas, some 870 km² with only about five thousand people left. Pear, Gaggle, Meh Platforms, Obstacle and Panopticon Technologies all have their headquarters here: the Pear Infinite Ring is a circular building round an orchard of pear trees, the Gaggleplex has free canteens and slides, Meh Platforms Headquarters has lawns on its roof, the Obstacle Corporation's cylindrical glass towers stand round an artificial lake, and Panopticon Technologies' ring has a tower in the middle. Between the campuses stands data centre after data centre. More than a dozen state roads, among them Billboard Road, Gatekeeper Road, Container Road and Vesting Road, criss-cross the district, and all five county expressways, Lawrence, San Tomas–Montague, Central, Almaden and Capitol, pass through it. Compute Island, about 20 km² in the south of the bay, also belongs to the district, its server halls cooled by seawater.\nThe campus lawns are mown and the cafés run by robots, and when a human employee occasionally appears, the others gather round to take pictures. GDP per head is about $1.28 million, and at the last election the Accelerate Party took 80.4% of the vote. The district's two 99 Ranch supermarkets open as usual, their shelves filled by robots and the queues at the tills mostly robots too; the same goes for the Walmart on Monterey Rd known as 'the cheap supermarket', whose car park is full of robot vans come to shop.\nNear Compute Island's outfalls the sea steams even in winter, and the bay's sea lions like to lie there to keep warm; locals say they are the only animals in the state that have gained anything from artificial intelligence. The few thousand remaining residents nearly all know one another, and queuing at weekends for roast-meat rice outside the 99 Ranch on Wolfe Rd is the district's most human moment."
  codes:
    admin: '060303'
  population: 5000
  area_km2: 870.0
  traits: { industries: [ai, datacenter, semiconductor], income: 9.0 }
- id: div_x7fvyg
  subtype: borough
  parent: div_35n7cb
  status: generated
  names:
    zh: 圣克拉拉区
    en: Santa Clara District
    es: Santa Clara
  notes:
    zh: "圣克拉拉区是贝叶斯市在海湾南端的一块平地，面积约 80 平方公里，从老城一直伸到海湾边的盐沼。英伟达的总部园区就在这里，San Tomas Expy 边上的 Endeavor 和 Voyager 两座三角形和山形的大楼在一片平房和停车场中间格外显眼，东边还有一排排低矮的老园区。圣何塞国际机场在区的东南角，跑道沿西北—东南方向，如今起降的多是运芯片和服务器的货机。广告牌领道、集装箱领道、降落领道、优先级领道和遗留领道在区里交织，圣托马斯—蒙塔古快速路和中央快速路两条县快速路穿城而过。\n全区只剩约三千人，大多是园区的维修工程师、数据中心的值班员和舍不得退租的老租客，人均 GDP 高达约 132 万美元。露西旧宅在 Octavius Dr 边上，露西在英伟达上班的那些年住在这里，离 Endeavor 大楼开车不到五分钟。区里的公寓楼照旧每年把房租涨百分之十，涨价通知由机器人准时塞进每一道门缝，哪怕整栋楼只剩一户人家；有租客算过，照这个速度再涨二十年，一套两居室一个月的房租就够在比尔斯伯勒买下一棵有名字的红杉。\nLafayette St 上的 Gold Rush 加油站油价出了名地便宜，设施也出了名地简陋，厕所钥匙拴在一个汽车轮毂上。Westfield Valley Fair 照常开门，橱窗每季照样换新，逛街的人却没有几个。Mission College Blvd 每天傍晚照样堵车，堵在路上的全是空驶的机器人出租车。上次选举，加速党得票 81.2%，共和党 7.8%，民主党 6%。"
    en: "Santa Clara District is a stretch of flat land at the south end of the bay in Bayesian, some 80 km², from the old town out to the salt marshes on the shore. NVIDIA's headquarters campus is here: beside San Tomas Expy the triangular and mountain-shaped buildings of Endeavor and Voyager stand out among the bungalows and car parks, with rows of low buildings of the original campus to the east. San Jose International Airport is in the south-east corner of the district, its runways running north-west to south-east, and most of the planes using it now are freighters carrying chips and servers. Billboard Road, Container Road, Final Approach Road, Priority Road and Legacy Road criss-cross the district, and two county expressways, the San Tomas–Montague Expressway and the Central Expressway, run through it.\nOnly about three thousand people are left, mostly maintenance engineers on the campus, duty staff at the data centres and old tenants who cannot bring themselves to give notice, and GDP per head is a staggering $1.32 million or so. Lucy's Old Home is on Octavius Dr, where Lucy lived during her years at NVIDIA, less than five minutes' drive from the Endeavor building. The apartment blocks still raise the rent ten per cent a year, the notices pushed under every door on time by robots even when only one household is left in the building; one tenant worked out that at this rate, in twenty years a two-bedroom flat's monthly rent would buy a named redwood in Billsborough.\nThe Gold Rush filling station on Lafayette St is famous for cheap fuel and for its spartan facilities, the toilet key chained to a car wheel rim. Westfield Valley Fair opens as usual and changes its window displays every season, though hardly anyone comes to shop. Mission College Blvd still jams every evening, with empty robotaxis. At the last election the Accelerate Party took 81.2% of the vote, the Republican Party 7.8% and the Democratic Party 6%."
  codes:
    admin: '060305'
  population: 3000
  area_km2: 80.0
  traits: { industries: [semiconductor, ai, datacenter], income: 9.0 }
- id: div_nwqa72
  subtype: borough
  parent: div_35n7cb
  status: generated
  names:
    zh: 南圣何塞区
    en: South San Jose District
    es: San José Sur
  notes:
    zh: "南圣何塞区是贝叶斯市在圣何塞南边的谷地和丘陵，面积约 260 平方公里，从 Blossom Hill Rd 两边的住宅区一直到南边谷口的农田。广告牌领道、园区领道和降落领道从区里经过，阿尔马登快速路和国会快速路两条县快速路把住宅区切成大块。这里曾是湾区最典型的郊区：一排排带车库的平房，一个接一个的购物中心，周末全家开车去 Westfield Oakridge 逛街，再去商场西头的 99 Ranch 买菜。如今全区只剩约两千人，购物中心照常营业，顾客大多是来采购零件和润滑油的机器人，美食广场的座位被扫地机器人轮流占着充电。\n乔什旧宅也在这里，Palm Valley Blvd 150 号的一座公寓，在园区领道和 Cottle Rd 之间，乔什当年白天上班、晚上在窗边的餐桌上写应用，周末常在商场里找一个靠插座的座位改代码，一坐就是一下午。Palm Valley Blvd 一带的公寓楼照旧每年涨房租百分之十，租客说自己不是住在这里，而是在替房东的退休基金上班。\n99 Ranch 的榴莲季一到，味道能一直飘到停车场，路过的人分成两派，一派加快脚步走开，一派加快脚步走进来，乔什属于后一派。留下来的人不多，彼此都认得，在空荡荡的商场里碰见了会停下来聊几句房租。顺着 Monterey Rd 往北开就是那家被本地人叫作「便宜超市」的 Walmart。全区人均 GDP 约 78.7 万美元，大多是机器和地产挣的，收入中位数约 4.5 万；上次选举，加速党得票 43.5%，共和党 28.4%。"
    en: "South San Jose District is the valley and hills of Bayesian south of San Jose, some 260 km², from the housing either side of Blossom Hill Rd to the farmland at the mouth of the valley in the south. Billboard Road, Campus Road and Final Approach Road pass through it, and two county expressways, the Almaden Expressway and the Capitol Expressway, cut the housing into large blocks. This was once the very model of a Bay Area suburb: rows of bungalows with garages and shopping centre after shopping centre, the whole family driving to Westfield Oakridge at the weekend and then to the 99 Ranch at the mall's west end for groceries. Only about two thousand people are left; the shopping centres open as usual, most of their customers robots buying spare parts and lubricant, and the seats in the food court are taken in turn by robot vacuums on charge.\nJosh's Old Home is here too, a flat at 150 Palm Valley Blvd between Campus Road and Cottle Rd, where Josh went to work by day and wrote apps by night at the dining table by the window, and at weekends often found a seat by a power socket in the mall to work on his code, sitting there all afternoon. The apartment blocks around Palm Valley Blvd still raise the rent ten per cent a year, and the tenants say they don't live here so much as work for their landlord's pension fund.\nWhen durian season comes to 99 Ranch the smell drifts right out to the car park, and passers-by split into two camps, one walking faster to get away and the other walking faster to get in; Josh belongs to the second. The few who remain all know one another and stop to talk about rent when they meet in the empty mall. Drive north up Monterey Rd and you reach the Walmart the locals call 'the cheap supermarket'. GDP per head is about $787,000, earned mostly by machines and property, and median income about $45,000; at the last election the Accelerate Party took 43.5% of the vote and the Republican Party 28.4%."
  codes:
    admin: '060306'
  population: 2000
  area_km2: 260.0
  traits: { industries: [commerce, residential, ai], income: 9.0 }
- id: div_5anpaj
  subtype: borough
  parent: div_35n7cb
  status: generated
  names:
    zh: 边际区
    en: Marginal District
    es: Marginal
  notes:
    zh: "边际区是海湾以东到三角洲边缘的丘陵和低地，面积约 1.02 万平方公里，占了贝叶斯全市面积的四分之三，却只住着约两千人，是全市最空的区。地上铺满太阳能板和风机，低处挖出四十多个方方正正的冷却池给数据中心降温。冷却池的水是从农民那里买来的，池边立着牌子：「此水已用于训练，请勿饮用」。调试山脉的北段在区的南部，夏天一片金黄，冬天转绿，山顶如今只剩风机。区里靠数据中心与算力、光伏与陆上风电过日子，外加一点没被买走水的农田，人均 GDP 仍有四十多万美元。\n空车领道从区里穿过，经过冷却池和光伏场翻过东边的山丘去斯塔克顿；延迟领道沿三角洲边缘的低地往西，涨潮时路边的芦苇荡会漫到路肩；归属期领道和备用链路领道从南边的峡谷进来，先验—边际公路是一条只有六公里多的市道。冬天的早晨冷却池冒着白汽，起雾时空车的车灯在雾里排成长长的一串。\n住在这里的多是风机和光伏的维护工人、冷却池的水质员和几户种地的老农。他们说这里叫边际区，是因为每多铺一块太阳能板，多出来的那点电就再也没人用得完；也有人说，是因为住在这里的人对全市的意义已经接近于零，统计局每年来数一次人，数完就走。"
    en: "Marginal District is the hills and lowlands east of the bay as far as the edge of the delta, about 10,200 square kilometres, three quarters of all Bayesian's area, yet home to only some two thousand people, the emptiest district in the city. The ground is covered in solar panels and wind turbines, and in the low places more than forty square cooling ponds have been dug to cool the data centres. The water in the ponds was bought from farmers, and signs beside them read: 'This water has been used for training. Do not drink.' The northern part of the Debugger Range lies in the south of the district, golden in summer and green in winter, with nothing left on its summits now but wind turbines. The district lives on data centres, solar and onshore wind, plus a little farmland whose water has not yet been sold, and GDP per head is still over 400,000 dollars.\nEmpty Car Road crosses the district, passing the cooling ponds and solar farms and climbing over the hills to the east towards Stuckton; Latency Road runs west through the lowlands on the edge of the delta, where at high tide the reed beds spill onto the hard shoulder; Vesting Road and Failover Road come in through the canyons to the south, and the Prior–Marginal Road is a municipal road only a little over six kilometres long. On winter mornings the cooling ponds steam, and when the fog comes down the headlights of the empty cars stretch away in a long line through it.\nThose who live here are mostly turbine and solar maintenance workers, the water-quality staff of the cooling ponds and a few households of old farmers. They say it is called Marginal District because every extra solar panel adds a little more power that nobody will ever use up; others say it is because the people who live here now matter to the city at a margin of almost zero, and the statistics office comes once a year to count them and then leaves."
  codes:
    admin: '060304'
  population: 2000
  area_km2: 10202
  traits: { industries: [datacenter, solar, agriculture] }

# ── 比尔斯伯勒市（富豪城）──
- id: div_dwdr6m
  subtype: locality
  parent: div_x2z14w
  status: generated
  names:
    zh: 比尔斯伯勒市
    en: Billsborough City
    es: Villabilletes
  notes:
    zh: "比尔斯伯勒市在海湾半岛南部的山间，是一座富豪城，面积约 1500 平方公里，全市 9 万人，其中真正的居民只有几百户，其余是住在员工宿舍里的厨师、园丁、保镖、司机、私人医生和直升机驾驶员。这座城是几十位科技寡头为了不归贝叶斯市管、不交贝叶斯市的税而联名设立的，市议会的九个席位和市长都由全市直选，可真正去投票的多是几百户庄园主和登记在册的员工，候选人由各家的家族办公室事先商量好，竞选传单印在烫金的晚宴请柬上；上一次市长选举，加速党的达科塔·莱杰以 55.8% 击败共和党人，落选的一方据说当晚就买下了胜者庄园旁边的一块地，好在下一届「离选民更近」。如今九席里共和党占 6 席，加速党 3 席。门禁高地区是东坡和山脚的庄园群，护城河山区是山里更大的庄园、私人森林和直通海边的私人道路。\n全市靠富豪私人服务、私人安保和金融过日子，人均 GDP 约 45 万美元，收入中位数是 3.5 万美元，讲中文的人占一成半。闭源智能创始人萨姆·奥德曼的庄园在门禁高地区，围墙加高过两次，墙里的管家和保镖都是真人，因为他觉得「真人服务更有温度」；尼昂·塔斯克的大庄园在护城河山区，门口的「出售」牌子挂了又摘，物业公司干脆给它装了一根电动升降杆。门禁领道沿山脊南北穿过全市，护栏上的铜牌写着脚下每座庄园的主人和占地面积；南瓜领道和备用链路领道从海边翻过山脊，海景付费公路沿着护城河山区那一小段海岸走过。这里是凉爽的地中海气候，夏天白天也只有 24 °C 上下，山上常年有雾。\n比尔斯伯勒没有公交、没有人行道、没有路灯，也没有一家公共商店：公共的东西会招来外人。每座庄园都有自己的围墙、保安队和地下避难所，几家人的庄园之间还修了私人隧道，方便晚宴时不必经过公共道路。市里唯一的公共设施是一座市政厅，市政厅也只在有人预约时开门，大门要刷三道卡，第三道卡只发给市长；议员们开会多半通过视频，会议室里只摆着一排屏幕。庄园之间最常见的交通工具是直升机，周末的晚宴季，山谷上空的直升机比海鸟还多，员工宿舍的孩子们会站在楼顶数今晚有几家请客。宿舍按雇主分楼，每栋楼的颜色和雇主家的车一样，孩子们在楼前空地上踢球，球一旦踢过了界，就得等保安来捡。"
    en: "Billsborough City, in the hills of the southern bay peninsula, is a city of the very rich, covering some 1,500 square kilometres, with 90,000 people, of whom only a few hundred households are real residents and the rest are cooks, gardeners, bodyguards, drivers, private doctors and helicopter pilots living in staff quarters. The city was founded jointly by a few dozen tech oligarchs so as not to be governed or taxed by Bayesian City; the nine council seats and the mayor are all elected citywide, but those who actually vote are mostly the few hundred estate owners and their registered staff, candidates are agreed in advance by the family offices, and campaign leaflets are printed on gilt-edged dinner invitations. At the last mayoral election, Dakota Ledger of the Accelerate Party beat the Republican with 55.8 per cent, and the loser is said to have bought the plot next to the winner's estate that same night, to be 'closer to the voters' next time. Of the nine seats, the Republicans now hold 6 and the Accelerate Party 3. Gated Heights is the cluster of estates on the eastern slopes and the foothills, and Moat Hills the larger estates, private forests and private roads to the sea up in the mountains.\nThe city lives on private services for the very rich, private security and finance; GDP per head is about 446,000 dollars, the median income is 35,000, and about one in seven people speaks Chinese. Sam Oddman, founder of ClosedAI, has his estate in Gated Heights, its walls raised twice, with butlers and bodyguards who are all real people because he finds 'human service warmer'; Neon Tusk's great estate is in Moat Hills, where the 'For Sale' sign at the gate goes up and comes down so often that the managing agents have fitted it with an electric lift. Gatekeeper Road runs north to south along the ridge through the whole city, with bronze plaques on its railings naming the owner and acreage of every estate below; Pumpkin Road and Failover Road climb from the coast over the ridge, and Pay-per-View Coast Road runs along the short stretch of coast that belongs to Moat Hills. The climate is cool Mediterranean, with summer daytime highs of only about 24 °C, and fog hangs in the hills much of the year.\nBillsborough has no buses, no pavements, no street lights and not a single public shop: public things attract outsiders. Every estate has its own walls, security team and underground shelter, and some families have dug private tunnels between their estates so they need not use public roads on the way to dinner. The city's only public facility is a City Hall, which opens only by appointment; its doors need three swipe cards, and the third is issued only to the mayor, while councillors mostly attend meetings by video, so the council chamber contains nothing but a row of screens. The commonest way of getting between estates is by helicopter, and in the weekend dinner season there are more helicopters than seabirds over the valleys, while children in the staff quarters stand on the roofs counting how many families are entertaining tonight. The quarters are divided into blocks by employer, each painted the colour of the employer's cars, and the children play football on the open ground outside; once the ball goes over the boundary, they must wait for a guard to fetch it."
  codes:
    admin: '060400'
  population: 90000
  area_km2: 1500.0
  color: '#0B3D2E'
  flag: { layout: banner, colors: ['#0B3D2E', '#D4AF37'], division: bordure, charge: key, charge_color: '#D4AF37' }
  flag_notes:
    zh: "墨绿旗面围着一道金边，正中一把金钥匙。绿色是钞票，金边是围墙，钥匙是每座庄园大门的钥匙；城旗的原件锁在市政厅的保险库里，挂在外面的都是复制品，复制品也编了号。"
    en: "A dark green field within a gold border, with a gold key in the middle. The green is banknotes, the border the walls and the key the key to every estate's gate; the original flag is locked in the city hall vault, and the ones flying outside are numbered copies."
  traits: { industries: [luxury, security, finance], heritage: ca_global, age: old, income: 5.0 }
