  flag_notes:
    zh: "天蓝的海和沙黄的岛隔着水线互换颜色，正中一把深蓝的钥匙。钥匙是保险箱的钥匙，也是地堡的钥匙；城旗在岛上登记为一家公司的商标，这家公司的地址是一只邮箱。"
    en: "Sky-blue sea and sand-yellow island counterchanged across the waterline, with a dark blue key in the middle. The key is the key to a safe deposit box and to the bunker; the flag is registered on the islands as the trademark of a company whose address is a mailbox."
