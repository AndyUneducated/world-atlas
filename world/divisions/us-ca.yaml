  flag_notes:
    zh: "浅灰和银灰两道横条，一道深灰尖楔从旗杆一侧伸进旗面，尖端前是一对橙色的方括号。尖楔是一条修到一半的铁路，方括号是工程图纸上「待定」的记号；市议会说等高铁通车那天就把括号去掉，城旗的设计费已经为此预留了。"
    en: "Pale grey and silver grey bands with a dark grey wedge reaching in from the hoist towards a pair of orange square brackets. The wedge is a half-built railway, and the brackets the 'to be decided' mark on an engineering drawing; the city council says it will remove the brackets on the day the railway opens, and the design fee has been set aside for it."
