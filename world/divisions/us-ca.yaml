    zh: 海湾以东到三角洲边缘的丘陵和低地，几乎没有人住，地上铺满太阳能板和风机，低处挖出四十多个方方正正的冷却池给数据中心降温。冷却池的水是从农民那里买来的，池边立着牌子：「此水已用于训练，请勿饮用」。调试山脉的北段在区的南部。
