    es: Islas Refugio Fiscal
  notes:
    zh: "避税列岛区是离岸群岛西边的四座岛，全区约 9000 人，面积约 2060 平方公里。最大的空壳岛约 1290 平方公里，是自治州主岛之外最大的岛，岛上有峡谷、海崖、橡树林和成群的海鸟；岛上的小镇只有一条街，街两边是一排排刻着公司名字的邮箱，几万家空壳公司把总部设在这里，员工人数一栏写的都是零。西边的信箱岛常年大风，邮箱钉满了灯塔外墙，灯塔看守人兼任全岛的邮政局长；南边的信托岛归一家家族信托所有，州税务局的稽查员顺着信托的受益人查了三年，最后在报告里画了一个圆圈；抽屉岛上只有一座私人码头和一间放满文件柜的铁皮屋。\n障碍软件创始人拉里·埃卢森买下了空壳岛的大部分土地，包括港口、机场跑道和小镇的大半房子，埃卢森岛庄园里有主楼、人工湖、员工村和私人跑道，岛上的居民发现自己的房东、雇主、电力公司和杂货店老板都变成了同一个人。\n在岛上登记的公司不交州税，全区人均 GDP 约 77.8 万美元，收入中位数约 4.7 万。岛与岛之间只有私人渡轮和直升机，岛民去本岛看病要搭送货的船；每年报税季前，送信的船会多开三班。岛上的灰狐狸只有家猫那么大，是这里唯一不需要注册的居民，常在邮箱下面打盹。上次选举，共和党得票 40.9%，加速党 36.3%，投票率 65.2%，比岛上的公司数量还让人意外。"
    en: "Tax Shelter Islands District is the four western islands of the Offshore Islands, home to about 9,000 people over some 2,060 km². The biggest, Shell Island, is about 1,290 km², the largest island beyond the state's main island, with canyons, sea cliffs, oak woods and great colonies of seabirds; its town has a single street, lined on both sides with rows of mailboxes engraved with company names, the headquarters of tens of thousands of shell companies, each listing its staff as zero. Mailbox Island to the west is windswept all year, its mailboxes nailed all over the outside of the lighthouse, whose keeper doubles as the island's postmaster; Trust Island to the south belongs to a family trust, and an inspector from the state tax office followed its chain of beneficiaries for three years before drawing a circle in his report; Drawer Island has nothing but a private jetty and a tin shed full of filing cabinets.\nLarry Ellusion, founder of the Obstacle Corporation, has bought most of Shell Island, including its harbour, its airstrip and most of the houses in town, and his Ellusion Island Estate has a main house, an artificial lake, a staff village and a private runway; the islanders have found that their landlord, employer, electricity company and grocer have all become the same man.\nCompanies registered on the islands pay no state tax; GDP per head is about $778,000 and median income about $47,000. There are only private ferries and helicopters between the islands, and islanders who need a doctor on the main island must hitch a ride on a supply boat; every year before tax season the mail boat runs three extra trips. The islands' grey foxes are no bigger than house cats and are the only residents who need not register, often dozing under the mailboxes. At the last election the Republican Party took 40.9% of the vote and the Accelerate Party 36.3%, on a turnout of 65.2%, more surprising even than the number of companies on the islands."
