# ── 莫内特里市──
- id: div_9tem3t
  subtype: locality
  parent: div_x2z14w
  status: generated
  names:
    zh: 莫内特里市
    en: Monetary City
    es: Monetaria
  notes:
    zh: "中部海岸的城市，全市 26 万人，从湾区南边的冲浪小城一路延伸到滤镜山脉的悬崖海岸。罐头厂区是海湾边的老罐头厂街和水族馆，冲浪棚区是北边的冲浪小城和大学，大附加费区是城南滤镜山脉的悬崖海岸和山后的生菜谷，全州大部分的生菜都出自那里。\n莫内特里的名字来自这里收费的传统：海岸公路上每个观景台都要扫码付费，悬崖上的长椅按分钟计时，连海雾也被一家公司注册成了「沉浸式体验」。滤镜山脉的海岸是网红们最爱的取景地，他们在悬崖边排队，为了一张照片可以等两个小时；拍出来的照片都会自动加上滤镜，所以没有人知道这里的海到底是什么颜色。生菜谷的雇工们每天天不亮就下地，他们说悬崖上的游客一天花的钱比他们一个月挣的还多。"
    en: "A city of the central coast, with 260,000 people, reaching from the surf town south of the Bay Area to the cliff coast of the Filter Range. Cannery District is the old cannery row and aquarium on the bay, Surf Shack the surf town and university in the north, and Big Surcharge the cliff coast of the Filter Range south of the city and the Lettuce Valley behind it, where most of the state's lettuce is grown.\nMonetary takes its name from a local tradition of charging: every viewpoint on the coast road must be paid for by scanning a code, the benches on the cliffs are metered by the minute, and even the sea fog has been registered by a company as an 'immersive experience'. The Filter Range coast is the influencers' favourite backdrop, and they queue at the cliff edge for two hours for a single picture; every picture taken there gets a filter automatically, so nobody knows what colour the sea really is. The hired hands of the Lettuce Valley go into the fields before dawn, and say the tourists on the cliffs spend more in a day than they earn in a month."
  codes:
    admin: '061200'
  population: 260000
  area_km2: 16000.0
