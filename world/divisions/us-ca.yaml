- id: div_p6j9x8
  subtype: borough
  parent: div_03k9fc
  status: generated
  names:
    zh: 巨杉区
    en: Giant Grove District
    es: Arboleda Gigante
  notes:
    zh: "巨杉区是阿尔蒙多东边估值山脉西坡的山区，全区 5 万人，面积约 1.5 万平方公里，占全市一半，地势从中央渴谷边缘的丘陵一路升到海拔 2520 米的山脊。山坡上是成片的巨杉林，最大的几棵树每一棵都被一家公司买了冠名权，树干上挂着小小的铜牌。山里有峡谷、湖泊和高山草甸，徒步者要先在应用里买「步数许可」。融资窗口领道从谷地翻过估值山脉，是一条夏季公路，冬天大雪封山，山里的小镇就只剩下本地人。\n这里四季分明：山脚的夏天能热到三十六度，有记录以来最热到过 46.3 度；山上的冬天冰天雪地，有记录以来最冷到过零下 13.4 度。区里的人靠旅游、保护区和林业过日子，护林员、导游、伐木工和旅馆老板占了大半，全区人均 GDP 约 3.1 万美元，收入中位数约 1.4 万，人均 GDP 是全市三个区里最低的，劳动年龄人口占 69%。\n巨杉的铜牌每隔几年就要换一次，因为冠名的公司不是被收购就是倒闭了，导游们练出了一项本事：能按年份背出同一棵树用过的所有名字。「步数许可」按步收费，走得越远越贵，有人倒着走，说倒着走的步数不算，应用很快就加了一条规则。夏天的夜里，草甸上满是露营的人，抬头是满天星星，低头是手机上的步数余额。山火季里，护林员最怕的是干雷暴，一道闪电就能点着一整面山坡。上次选举，共和党得票 36.2%，防火绿党 20.3%，民主党 15.7%。"
    en: "Giant Grove District is the mountain country on the western slopes of the Sierra Valuation east of Almondo, home to 50,000 people over some 15,000 km², half the city, rising from the foothills at the edge of the Central Thirsty Valley to ridges 2,520 m high. The slopes are covered in groves of giant sequoias; the naming rights to each of the largest trees have been bought by a company, and small brass plaques hang on their trunks. In the mountains are canyons, lakes and alpine meadows, and hikers must first buy 'step permits' in an app. Funding Window Road climbs from the valley over the Sierra Valuation, a summer road; in winter heavy snow closes the mountains and the mountain towns are left to the locals.\nThe seasons here are sharp: summers in the foothills reach thirty-six degrees, with a record of 46.3, while winters in the mountains are deep in snow and ice, with a record low of minus 13.4. People live on tourism, conservation and timber, with rangers, guides, loggers and innkeepers making up most of the workforce; GDP per head is about $31,000 and median income about $14,000, the lowest GDP per head of the city's three districts, and 69% of people are of working age.\nThe brass plaques have to be changed every few years, because the company that bought the name has either been taken over or gone bust, and the guides have mastered the art of reciting, year by year, every name a single tree has had. Step permits are charged by the step, so the further you go the more you pay; some hikers walked backwards, claiming backward steps did not count, and the app soon added a rule. On summer nights the meadows are full of campers, with a sky full of stars above and the step balance on their phones below. In fire season the rangers fear dry thunderstorms most, since a single lightning strike can set a whole hillside alight. At the last election the Republican Party took 36.2% of the vote, the Firebreak Greens 20.3% and the Democratic Party 15.7%."
  codes:
    admin: '060803'
  population: 50000
  area_km2: 15000.0
  traits: { industries: [tourism, conservation, forestry], heritage: ca_anglo }

# ── 巴雷尔斯菲尔德市──
- id: div_jmxc1m
  subtype: locality
  parent: div_x2z14w
