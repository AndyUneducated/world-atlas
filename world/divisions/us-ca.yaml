# ── 萨克拉钱托市（首府）──
- id: div_91r9b3
  subtype: locality
  parent: div_x2z14w
  status: generated
  names:
    zh: 萨克拉钱托市
    en: Sacramoney City
    es: Sacradinero
  notes:
    zh: "萨克拉钱托市是自治州首府，在中央渴谷北段、萨克拉钱托河与圣囤积河交汇的三角洲北岸，全市 65 万人，面积约 3 万平方公里。州议会大厦的金色穹顶在游说区正中，周围几条街上挤满了游说公司、律师事务所和政治筹款餐厅，议员们说在这里吃一顿早餐比竞选还贵。城市向东一路蔓延到估值山脉山脚，蔓延维尔区的独栋住宅一模一样排出几十公里；北边的堤坝区是稻田、果园和防洪堤，东边的木屋区一直伸进山里，包括塔克斯霍湖和湖边富人的滑雪木屋。\n作为首府，城里最大的雇主是州政府：众议院 80 席、参议院 40 席共用议会大厦，州长办公厅在北面隔一条林荫道，州务卿办公厅和 11 个厅排在大厦南边，名字一个比一个长，从算法与民政厅到劳动与自动化失业厅。几百家游说公司挤在同一座说客大厦里，大楼的电梯按楼层收费。全市人均 GDP 约 9 万美元，收入中位数 2 万美元，行政、商贸和河谷里的种植业是三根支柱。\n萨克拉钱托地铁 1 号线有九站，约 11.3 公里，全在游说区，从王家站到春晓站，早上挤满公务员，傍晚挤满说客。单调领道从游说区南北穿城，杏仁领道从南边的渴谷开到蔓延维尔区为止，堵车领道从湾区过来，经游说区和蔓延维尔区翻过海拔 1510 米的堵车山口去塔克斯霍湖，离线领道从木屋区穿山而过，游说—堤坝公路向北伸进稻田。萨克拉钱托国际机场在蔓延维尔区北边，航班多飞失落天使、圣遣返和贝叶斯，每周还有一班飞往星球另一面的中国各领地。\n全市讲英语的七成多，讲西班牙语的两成多，非洲裔占四成多。市长吴家豪是民主党人，在决选中以 63.7% 的得票击败共和党对手；15 席的市议会里民主党独占 12 席，共和党、加速党和工人团结党各 1 席。\n萨克拉钱托人爱自嘲「首府是个大镇子」：州长、议员和他们的幕僚在这里工作，周末却都回失落天使或湾区的家，平日的城里只剩下公务员、游说者和送餐机器人；周五傍晚议会一散会，堵车领道的游说区出口就堵成一锅粥。夏天又干又热，七月白天平均 33 °C 以上，整条河谷几个月滴雨不下；冬天浓雾从三角洲漫上来，有时一连几天看不见议会大厦的穹顶，游说者说那是全年唯一看不清政府在干什么的日子。州长官邸被游说公司包下来做了会所，现任州长住在一辆停在议会停车场里的房车上，以示亲民。"
    en: "Sacramoney City, capital of the autonomous state, stands on the northern edge of the delta where the Sacramoney and San Hoarding rivers meet, at the northern end of the Central Thirsty Valley, a city of 650,000 people covering some 30,000 square kilometres. The golden dome of the State Capitol stands at the heart of Lobbyton District, the surrounding streets crowded with lobbying firms, law firms and political fundraising restaurants, and legislators say breakfast here costs more than a campaign. The city sprawls east as far as the foothills of the Sierra Valuation, where the identical detached houses of Sprawlville run on for tens of kilometres; Levee District to the north is rice paddies, orchards and flood levees, and Chalet District to the east reaches into the mountains, taking in Lake Taxhoe and the ski chalets of the rich along its shore.\nAs the capital, the city's biggest employer is the state government: the 80-seat Assembly and the 40-seat Senate share the Capitol, the Office of the Governor lies across a tree-lined avenue to the north, and the Office of the Secretary of State and the 11 departments line up south of the Capitol, each name longer than the last, from the Department of Algorithms and Civil Affairs to the Department of Labor and Automation Unemployment. Hundreds of lobbying firms are crammed into the single Lobbyist Tower, whose lifts charge by the floor. GDP per head is about 90,000 dollars and the median income 20,000, and government, commerce and the farming of the valley are the three pillars.\nSacramoney Metro Line 1 has nine stations over about 11.3 kilometres, all in Lobbyton District, from Wangjia to Spring Dawn, packed with civil servants in the morning and lobbyists in the evening. Monotony Road crosses the city north to south through Lobbyton, Almond Road runs up from the Thirsty Valley in the south and ends in Sprawlville, Gridlock Road comes in from the Bay Area through Lobbyton and Sprawlville and climbs over Gridlock Pass, 1,510 metres up, to Lake Taxhoe, Offline Road cuts through the mountains of Chalet District, and the Lobbyton–Levee Road reaches north into the rice fields. Sacramoney International Airport lies north of Sprawlville, with flights mostly to Lost Angeles, San Deportes and Bayesian, plus one a week to the Chinese territories on the far side of the planet.\nJust over seven in ten people speak English and just over two in ten Spanish, and people of African descent make up more than four in ten. The mayor, Ng Ka-ho, is a Democrat who beat the Republican candidate in the run-off with 63.7 per cent of the vote; the Democrats hold 12 of the 15 seats on the City Council, and the Republicans, the Accelerate Party and the Workers' Solidarity Party one each.\nSacramoney people like to joke that 'the capital is a big village': the governor, the legislators and their staff work here but go home to Lost Angeles or the Bay Area at weekends, leaving the city on weekdays to civil servants, lobbyists and delivery robots, and on Friday evenings, the moment the legislature rises, the Lobbyton exit of Gridlock Road turns into a solid jam. Summers are dry and hot, with July days averaging over 33 °C, and for months not a drop of rain falls in the whole valley; in winter thick fog creeps up from the delta, sometimes hiding the Capitol dome for days on end, and lobbyists say those are the only days of the year when nobody can see what the government is doing. The Governor's Mansion has been leased by a lobbying firm as a club, and the current governor lives in a camper van parked in the Capitol car park to show how close he is to the people."
