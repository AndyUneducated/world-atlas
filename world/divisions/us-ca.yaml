# ── 离岸群岛市──
- id: div_943qb5
  subtype: locality
  parent: div_x2z14w
  status: generated
  names:
    zh: 离岸群岛市
    en: Offshore Islands City
    es: Islas Paraíso Fiscal
  notes:
    zh: "离岸群岛市是南海岸外的六座岛屿，全市 1.5 万人，陆地约 3000 平方公里，是自治州的避税天堂：在岛上登记的公司不交州税，岛上的豪宅也不交房产税，理由是「海岛的土地还在测量中」。避税列岛区是西边四座岛，空壳岛、信箱岛、信托岛和抽屉岛，岛上登记着几万家公司，真正住在岛上的是看管邮箱的人和一群灰狐狸；亿万岛区是东边的两座岛，北边的亿万岛全是度假豪宅和游艇码头，南边的地堡岛是富豪们合建的地下避难城，岛内的山体被挖空，能让几百个家庭在地下住上几年。\n空壳岛约 1290 平方公里，是本岛以外最大的岛，障碍软件创始人拉里·埃卢森买下了岛上的大部分土地，连港口、跑道和唯一那座镇子的大半房子都归他，岛民的房东、雇主和杂货店老板于是成了同一个人。亿万岛上，无所谓平台创始人莫克·萨克伯格的庄园围着高墙，墙里养着喝啤酒的牛。全市靠金融、富豪私人服务、私人安保和旅游，人均 GDP 约 73 万美元，在全州仅次于贝叶斯；讲中文的人占一成多，岛上的律师事务所大多用三种语言接待客户。西边的信托岛和抽屉岛上各有一座小码头和几排平房，看管邮箱的人每天的工作是把从本岛寄来的信件按公司分好，塞进刻着名字的信箱，再把同一批信原样寄回本岛的律师事务所。信箱岛最小，只有约 210 平方公里，岛上的信箱比海鸟巢还密，每到报税季，送信的船一天要跑三趟。岛上的灰狐狸只有家猫那么大，是这里唯一不需要注册的居民，生物学家每年来数一次，数出来的狐狸比注册的公司少得多，却比真正在岛上办公的人多。\n这里是温和的地中海气候，夏天白天不到 30 °C，海风终年不停，一年雨水约 450 毫米。市议会叫「业主大会」，7 席里加速党 4 席、共和党 3 席；市长张嘉欣在一场两名共和党人对决的决选中以 51.4% 胜出，选举夜的计票由一家会计师事务所负责，事务所的注册地址也在岛上。\n离岸群岛人说岛上最多的是三样东西：邮箱、海鸟和律师。每座岛之间有私人渡轮和直升机，可没有一班公共航线，岛民去本岛看病要搭送货的船。地堡岛每年做一次「末日演习」，演习那天岛主们乘直升机上岛，在地堡里吃一顿晚餐，然后离开，岛上的工作人员说那是一年中最热闹的一晚。"
    en: "Offshore Islands City is six islands off the south coast, with 15,000 people and some 3,000 square kilometres of land, the autonomous state's tax haven: companies registered on the islands pay no state tax, and the mansions on them pay no property tax either, on the grounds that 'the islands' land is still being surveyed'. Tax Shelter Islands District is the four western islands, Shell Island, Mailbox Island, Trust Island and Drawer Island, where tens of thousands of companies are registered and the only real residents are the people who look after the mailboxes and a population of island grey foxes; Billionaire Isles District is the two eastern islands, Billionaire Island to the north given over entirely to holiday mansions and yacht marinas, and Bunker Island to the south an underground refuge built jointly by the very rich, its hills hollowed out so that hundreds of families could live underground for years.\nShell Island, about 1,290 square kilometres, is the largest island outside the main island, and Larry Ellusion, founder of Obstacle, has bought most of its land, the harbour, the airstrip and most of the houses in its only town included, so that islanders found their landlord, employer and grocer had all become the same man. On Billionaire Island, Mork Suckerberg, founder of Meh Platforms, keeps an estate behind high walls, inside which cattle are raised on beer. The city lives on finance, private services for the very rich, private security and tourism, and its GDP per head of about 730,000 dollars is second only to Bayesian's in the state; just over a tenth of the people speak Chinese, and most of the islands' law firms receive clients in three languages. Trust Island and Drawer Island in the west each have a small jetty and a few rows of bungalows, where the mailbox keepers spend their days sorting the letters that arrive from the main island by company, posting them into the named boxes, and then sending the same letters back unopened to the law firms on the main island. Mailbox Island is the smallest, only about 210 square kilometres, with mailboxes packed more densely than seabirds' nests, and in tax season the mail boat makes three runs a day. The island grey foxes are no bigger than house cats and are the only residents who need not register; biologists come to count them once a year and find far fewer foxes than registered companies, but more than the people who actually work on the islands.\nThe climate is mild Mediterranean, with summer days below 30 °C, a sea wind that never stops and about 450 millimetres of rain a year. The city council is called the Owners' Assembly, and of its 7 seats the Accelerate Party holds 4 and the Republicans 3; the mayor, Cheung Ka-yan, won with 51.4 per cent in a run-off between two Republicans, and the count on election night was handled by an accounting firm whose registered address is also on the islands.\nOffshore Islanders say the islands have three things in abundance: mailboxes, seabirds and lawyers. There are private ferries and helicopters between the islands but not a single public route, and islanders who need a doctor on the main island must hitch a ride on a supply boat. Every year Bunker Island holds a 'doomsday drill': on the day, the owners fly in by helicopter, eat dinner in the bunker and leave, and the island's staff say it is the liveliest night of the year."
