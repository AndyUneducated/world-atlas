  names:
    zh: 阿尔蒙多市
    en: Almondo City
    es: Almendro
  notes:
    zh: "阿尔蒙多市在中央渴谷中部，是一座农业城市，全市 52 万人，面积约 3 万平方公里，地盘从海拔四十多米的谷底杏仁园一直伸到估值山脉西坡的巨杉林，最高处约 2520 米。全州大部分的杏仁、葡萄干、开心果和番茄都出自这里，种植业、食品加工和物流仓储撑起了全市的经济，可种地的人大多是租地、租水、租农机的雇工，地、水和农机都属于湾区的基金。全市人均 GDP 约 4.3 万美元，收入中位数只有 1.4 万美元，钱大多顺着领道流回了湾区。果仁区是城市的中心和加工厂，全市七成多的人住在这里；渴谷区是谷底西部一望无际的果园和越抽越深的水井，圣囤积河从区里流过；巨杉区是山里的巨杉林、峡谷和湖泊。\n谷里是炎热的地中海气候：七月白天平均近 37 °C，最高纪录 47.7 °C，一年的雨水不到 400 毫米，几乎都下在冬天，夏天几个月滴雨不下，全靠估值山脉的融雪和地下水浇地。杏仁领道纵贯果仁区，是运坚果的大动脉，满载杏仁的卡车常和去壳厂的叉车一起堵在出口；单调领道沿谷地西缘穿过渴谷区，融资窗口领道从果仁区向东翻进巨杉区，只在夏天开放。加州高速铁路在果仁区设阿尔蒙多站，北通谦逊、斯塔克顿，南到荒漠枢纽，列车从约 16.5 公里长的果仁高架桥上掠过城区，一天只有两班，班班满座，桥下的果农抬头看一眼，说那是「从湾区飞过去的钱」。\n全市讲英语和讲西班牙语的人差不多各半，拉丁裔占四成多，谷底的去壳厂和果园里西班牙语更常听到，山里的巨杉区则几乎只讲英语。市长洛根·斯特林是民主党人，在前两名决选中以 59.3% 的得票击败工人团结党的对手；15 席的市议会里民主党 11 席，工人团结党 3 席，防火绿党 1 席，工人团结党的议员开会时总要先念一遍当天的地下水位。\n阿尔蒙多人说杏仁是「喝水的金子」：一颗杏仁要喝掉好几升水，果园里的水井越打越深，地面一年年往下沉，有的地方沉了好几米，老电线杆斜着插在地里。夏天谷里四十度的热浪里，采摘机器人和人一起在果园里干活，机器人每小时休息十分钟给电池降温，人没有。每年开春杏花开遍谷地，基金经理们从湾区坐直升机来拍照，那是谷里一年中最热闹的一周；果农的孩子在路边卖杏仁奶和烤坚果，标价按停在田边的直升机型号浮动。秋天收获季，摇树机把整棵树摇得簌簌发抖，坚果落在地上晒干再扫起来，整个谷地罩在一层灰黄的尘土里，本地人管这叫「第二场雾」。"
    en: "Almondo City lies in the middle of the Central Thirsty Valley, a farming city of 520,000 people covering some 30,000 square kilometres, reaching from the almond orchards on the valley floor, a little over forty metres above sea level, to the giant sequoia groves on the western slopes of the Sierra Valuation, about 2,520 metres at the highest. Most of the state's almonds, raisins, pistachios and tomatoes come from here, and farming, food processing and logistics hold up the city's economy, but most of the people who farm are hired hands renting land, water and machinery, all of which belong to Bay Area funds. GDP per head is about 43,000 dollars and the median income only 14,000; most of the money flows back to the Bay Area along the state roads. Kernel District is the city centre and its packing plants, home to more than seven in ten of the city's people; Thirsty Valley is the endless orchards of the western valley floor and its ever deeper wells, crossed by the San Hoarding River; and Giant Grove is the sequoia forests, canyons and lakes up in the mountains.\nThe valley has a hot Mediterranean climate: July days average nearly 37 °C, the record is 47.7 °C, and the year brings less than 400 millimetres of rain, nearly all of it in winter, so that for months in summer not a drop falls and the land is watered by Sierra Valuation snowmelt and groundwater. Almond Road runs the length of Kernel District, the artery of the nut trade, where lorries piled with almonds often queue at the exits alongside forklifts from the hulling plants; Monotony Road runs along the western edge of the valley through Thirsty Valley; and Funding Window Road climbs east from Kernel District into Giant Grove, open only in summer. The California High-Speed Railway stops at Almondo Station in Kernel District, running north to Modestly and Stuckton and south to Desert Hub, and its trains sweep over the city on the Kernel Viaduct, about 16.5 kilometres long; there are only two a day, every one full, and the farmers under the viaduct glance up and call it 'money flying past from the Bay Area'.\nEnglish and Spanish speakers are roughly half and half, and Latinos make up more than four in ten; Spanish is heard more often in the hulling plants and orchards of the valley floor, while Giant Grove in the mountains speaks almost nothing but English. The mayor, Logan Sterling, is a Democrat who beat the Workers' Solidarity Party candidate in the top-two run-off with 59.3 per cent of the vote; on the 15-seat City Council the Democrats hold 11 seats, the Workers' Solidarity Party 3 and the Firebreak Greens 1, and the Workers' Solidarity councillors always begin a meeting by reading out the day's groundwater level.\nAlmondo people call almonds 'gold that drinks': each nut drinks several litres of water, the wells in the orchards go deeper and deeper, and the ground sinks a little more every year, by several metres in places, where old power poles lean out of the earth. In the forty-degree heat of the valley summer, picking robots and people work the orchards side by side; the robots rest ten minutes in every hour to cool their batteries, and the people do not. Every spring when the almond blossom whitens the valley, fund managers fly in from the Bay Area by helicopter to take pictures, the busiest week of the valley's year; farmers' children sell almond milk and roasted nuts by the roadside, priced according to the model of helicopter parked at the edge of the field. At harvest in autumn, shaking machines rattle whole trees until the nuts fall to dry on the ground before being swept up, and the whole valley is wrapped in a greyish-yellow dust that locals call 'the second fog'."
  codes:
