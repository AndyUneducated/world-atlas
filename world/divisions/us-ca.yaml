  names:
    zh: 压裂原区
    en: Fracklands District
    es: Tierras de Fractura
  notes:
    zh: "压裂原区是巴雷尔斯菲尔德以西和以南的油田、风电场和山地，全区 6 万人，面积约 2 万平方公里，几乎占了全市的全部土地，最高处海拔 2333 米。几万台抽油机散布在干燥的丘陵上，日夜点头，特哈聊天山脉的山口上站满了风机。油田的井越打越深，地下的水被压裂液弄得一股怪味，农场主们用瓶装水浇自家的菜园。沉没成本领道从区里翻山而过，加州高速铁路的终点荒漠枢纽站也在本区。\n石油开采与炼化、光伏和风电、农业是三大行业，工业占全区经济的六成多，全区人均 GDP 约 6.1 万美元，收入中位数约 1.8 万。这里是全州共和党得票最高的区，上次选举共和党得票 73.9%，加速党 5.7%，民主党 5.4%。夏天又干又热，七月白天约 38 度，有记录以来最热到过 49.7 度，一年的雨不到 400 毫米。\n荒漠枢纽站方圆几十公里没有城镇，站前广场上只有一排机器人出租车和一块「此处规划中央商务区」的牌子，每天两班车到站，下车的人大多原车坐回去，为的只是说自己坐过加州的高铁。油田里的工人开着皮卡在井场之间巡线，车斗里放着扳手、冷藏箱和一箱瓶装水；风大的日子，山口的风机转得飞快，抽油机照旧不紧不慢地点头。本地人说，风机是给湾区看的，抽油机才是给自己干的。"
    en: "Fracklands District is the oil fields, wind farms and hills west and south of Barrelsfield, home to 60,000 people over some 20,000 km², almost all of the city's land, rising to 2,333 m. Tens of thousands of pumpjacks are scattered over the dry hills, nodding day and night, and the passes of the Tehachatbot Mountains are crowded with wind turbines. The wells go deeper and deeper, the groundwater tastes strange from fracking fluid, and ranchers water their vegetable gardens with bottled water. Sunk Cost Road crosses the hills through the district, and Desert Hub Station, the end of the line for the California High-Speed Railway, is here too.\nOil and refining, solar and wind power, and farming are the three main industries, with industry over three-fifths of the economy; GDP per head is about $61,000 and median income about $18,000. This is the Republican Party's best district in the state: at the last election it took 73.9% of the vote, the Accelerate Party 5.7% and the Democratic Party 5.4%. Summers are hot and dry, about 38 degrees by day in July with a record of 49.7, and less than 400 mm of rain falls a year.\nThere is no town for dozens of kilometres around Desert Hub Station; the station square holds only a row of robotaxis and a sign reading 'Central business district planned here', and of the people who arrive on the two trains a day most ride straight back, just to say they have been on California's high-speed train. Oilfield workers drive pick-ups from well pad to well pad, with spanners, a cool box and a crate of bottled water in the back; on windy days the turbines on the passes spin furiously while the pumpjacks go on nodding at their own pace. Locals say the turbines are for the Bay Area to look at, and the pumpjacks are the ones working for them."
