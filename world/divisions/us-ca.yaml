- id: div_jytczs
  subtype: borough
  parent: div_6shwy9
  status: generated
  names:
    zh: 赤霞珠丘区
    en: Cabernet Hills District
    es: Lomas Cabernet
  notes:
    zh: "赤霞珠丘区是梅洛特在海湾北岸谷地里的酒庄区，全区 11 万人，面积约 2000 平方公里，最高处海拔 1129 米。几百家酒庄沿着谷底的一条领道排开，每家都有品酒室、餐厅和一座仿欧洲古堡；谷两边的山坡上，葡萄园一块接一块，按地块拍卖，一亩地的价格比失落天使市中心的写字楼还贵。堵车领道从区里经过，周末从湾区开来的车在谷口排成长队。谷里有一列观光火车，车厢里供应品酒套餐，火车开得很慢，因为开快了酒会洒。\n区里最有名的宅邸是前国会议员南希·佩洛特雷德的佩洛特雷德酒庄。她在国会坐了几十年，每当国会要审议哪个行业的法案，她的账户里总会提前出现那个行业的股票；酒庄的坡上种满了赤霞珠，酒窖里每一桶酒的标签上都印着买入日期和卖出日期。别的酒庄主人多是湾区的寡头，一年来一两次，在品酒会上宣布今年的酒「由人工智能调配」。\n全区人均 GDP 约 9.7 万美元，收入中位数约 2.1 万，65 岁以上的人占 27%。摘葡萄的雇工住在谷外的小镇，每天早上坐酒庄的大巴进谷，晚上再坐出去，品酒室里的游客很少看到他们。夏天谷里白天约 30 度，夜里凉下来，正适合葡萄；山火季的烟常常压到葡萄园边上，熏过的葡萄酿成「野火限定版」，价格翻倍。上次选举，共和党得票 35.7%，加州独立党 20.1%，民主党 20%。谷里有句老话：在这里，酒越陈越贵，地越来越贵，人越来越少。"
    en: "Cabernet Hills District is Merlotte's wine country in the valley on the north shore of the bay, home to 110,000 people over some 2,000 km², rising to 1,129 m. Hundreds of wineries are strung along a state road on the valley floor, each with its tasting room, restaurant and imitation European castle; on the slopes either side, vineyard follows vineyard, auctioned plot by plot, an acre costing more than an office block in downtown Lost Angeles. Gridlock Road passes through the district, and at weekends cars from the Bay Area queue at the mouth of the valley. A sightseeing train runs through the valley serving tasting menus in its carriages, very slowly, since going faster would spill the wine.\nThe best-known house in the district is the Pelotrade Winery of the former congresswoman Nancy Pelotrade. She sat in Congress for decades, and whenever Congress was about to consider a bill on some industry, that industry's shares would turn up in her account beforehand; her slopes are planted with Cabernet Sauvignon, and every barrel in her cellar carries a label printed with its buy date and sell date. Most of the other winery owners are Bay Area oligarchs who visit once or twice a year and announce at a tasting that this year's wine was 'blended by artificial intelligence'.\nGDP per head is about $97,000 and median income about $21,000, and 27% of people are over 65. The grape pickers live in small towns outside the valley, riding the wineries' coaches in each morning and out again at night, and tourists in the tasting rooms seldom see them. Summer days in the valley reach about 30 degrees and the nights cool down, just right for grapes; in fire season the smoke often settles over the vineyards, and the smoked grapes become a 'Wildfire Limited Edition' at twice the price. At the last election the Republican Party took 35.7% of the vote, the California Independence Party 20.1% and the Democratic Party 20%. An old saying in the valley goes: here the wine gets dearer with age, the land gets dearer every year, and the people get fewer."
