# ── 帕姆斯普林克勒市──
- id: div_aq1ydw
  subtype: locality
  parent: div_x2z14w
  status: generated
  names:
    zh: 帕姆斯普林克勒市
    en: Palm Sprinklers City
    es: Palmas Aspersoras
  notes:
    zh: "自治州东南的荒漠城市，全市 23 万人，面积 7.3 万平方公里，是自治州面积最大的市。喷灌区是边检山脉山脚的绿洲城，几十座高尔夫球场在荒漠里每天喷掉的水够一座城市用，豪华度假村和养老社区挤在球场之间；帝国尘区是城东的帝国尘谷农田、苏打饼海和一直伸到东海岸的大荒漠。城名来自喷灌头：这里的棕榈树和草坪全靠喷灌活着，市政府的标志就是一只喷着水的喷头。\n帕姆斯普林克勒是两个世界：喷灌区的退休富豪在四十五度的夏天打高尔夫，球车上装着空调；帝国尘区的农场雇工在同样的天气里摘蔬菜，休息时躲在卡车下面的阴影里。苏打饼海的湖水越来越咸，湖岸退出几公里，风一吹湖床上的尘土就飘到城里，城里的医生说，看哮喘的病人一年比一年多。每年春天，荒漠里会办一场持续两个周末的音乐节，一张票的价格是一个雇工三个月的工资。"
    en: "The desert city of the south-east, with 230,000 people and 73,000 km², the largest city in the state by area. Sprinkler District is the oasis town at the foot of the Checkpoint Range, where dozens of golf courses in the desert spray away enough water every day for a city, with luxury resorts and retirement communities squeezed in between; Imperial Dust is the farmland of the Imperial Dust valley east of the city, the Saltine Sea and the great desert that runs all the way to the east coast. The name comes from sprinkler heads: the palms and lawns here live entirely on sprinklers, and the city government's logo is a spraying sprinkler.\nPalm Sprinklers is two worlds: in Sprinkler District retired tycoons play golf through the forty-five-degree summer in air-conditioned carts, while in Imperial Dust farm hands pick vegetables in the same heat and rest in the shade under their trucks. The Saltine Sea grows saltier every year and its shore has retreated several kilometres; when the wind blows, dust from the lake bed drifts into town, and the town's doctors say they see more asthma patients every year. Every spring the desert holds a music festival over two weekends, a single ticket costing three months of a farm hand's wages."
  codes:
    admin: '061600'
  population: 230000
  area_km2: 73000.0
  color: '#E9C46A'
  flag: { layout: horizon, colors: ['#F4A261', '#E9C46A', '#2A9D8F'], charge: palm, charge_color: '#2A9D8F' }
  flag_notes:
    zh: "橙色的天空下是沙黄色的荒漠，地平线上一棵青绿色的棕榈。青绿是喷灌出来的草坪，也是城旗上唯一需要浇水的颜色；市政府每年为城旗拨一笔「颜色维护费」，用来重新印刷褪色的旗子。"
    en: "Sand-yellow desert under an orange sky, with a blue-green palm on the horizon. The blue-green is the sprinkled lawns, the only colour on the flag that needs watering; every year the city sets aside a 'colour maintenance fund' to reprint faded flags."
  traits: { industries: [tourism, agriculture, luxury, healthcare], heritage: ca_latino, age: old, income: 0.85 }
