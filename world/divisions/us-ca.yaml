- id: div_0aep50
  subtype: borough
  parent: div_91r9b3
  status: generated
  names:
    zh: 蔓延维尔区
    en: Sprawlville District
    es: Villa Expansión
  notes:
    zh: "蔓延维尔区是首府东边一望无际的郊区，面积约 1820 平方公里，住着约 20 万人。同一张图纸盖出的独栋住宅沿着弯弯曲曲的尽头路排开，每家门前一块草坪、车库里两辆车。区里没有人行道，也没有市中心，最热闹的地方是一座购物中心的停车场，周末的跳蚤市场、教会的募捐烧烤和高中生的第一次约会都在那里。大多数居民是在游说区上班的公务员和被裁员后在家「做自媒体」的前白领，还有越来越多靠接单过日子的人：送外卖、帮人遛狗、替机器人出租车擦车，区里的经济因此写成居住与社区服务、免税零售和零工与平台劳务。\n杏仁领道从南边的渴谷一路开来，在区里走到尽头；堵车领道横穿全区，早上往西进城的车排成长龙，晚上倒过来。区的北边是萨克拉钱托国际机场，一条六公里多的机场公路把它和领道接起来，飞机起降时，尽头路上的草坪仿佛都跟着抖一抖。\n这里的房子长得太像，新搬来的人常常走错家门、开错车库，邻居们见怪不怪，会先请进来喝杯咖啡再指路。区里的孩子学会骑车以后，最远只能骑到尽头路的尽头，再往外就是领道；他们长大后说起童年，记得最清楚的是购物中心停车场上那一排排白线。"
    en: "Sprawlville District is the endless suburbs east of the capital, about 1,820 square kilometres with some 200,000 people. Detached houses built from the same set of plans line the winding cul-de-sacs, each with a lawn out front and two cars in the garage. There are no pavements and no town centre; the liveliest place is the car park of a shopping centre, scene of weekend flea markets, church fundraising barbecues and high-schoolers' first dates. Most residents are civil servants working in Lobbyton and former white-collar workers who were laid off and now 'do social media' from home, along with a growing number who live by taking gigs: delivering food, walking other people's dogs, washing robotaxis, which is why the district's economy is listed as residential services, duty-free retail and gig and platform work.\nAlmond Road comes all the way up from the Thirsty Valley to the south and ends in the district; Gridlock Road crosses it, with long queues heading west into town in the morning and the reverse in the evening. In the north of the district is Sacramoney International Airport, joined to the state roads by an airport road a little over six kilometres long, and when planes take off and land the lawns along the cul-de-sacs seem to shiver with them.\nThe houses look so alike that newcomers often walk into the wrong home or open the wrong garage, and the neighbours, quite used to it, invite them in for a coffee before showing them the way. Once the district's children learn to ride a bicycle, the farthest they can go is the end of the cul-de-sac, beyond which lies the state road; when they grow up and talk about their childhood, what they remember most clearly is the rows of white lines in the shopping-centre car park."
  codes:
    admin: '060102'
  population: 200000
  area_km2: 1820.0
  traits: { industries: [residential, retail, gig] }
- id: div_3r66dn
  subtype: borough
  parent: div_91r9b3
  status: generated
  names:
    zh: 堤坝区
    en: Levee District
    es: Diques
  notes:
    zh: "堤坝区是首府以北萨克拉钱托河谷的大片农区，面积约 2.4 万平方公里，占了全市四分之三以上，住着约 10 万人，河谷两侧一直伸进山里，最高处约 2100 米。稻田、核桃园和李子园之间是一道道防洪堤，堤顶的土路连成一张网，农用车和运米的卡车都在堤上跑。区里靠种植业、食品加工和物流仓储过日子，碾米厂、干果厂和冷库沿着河排开，讲西班牙语和讲英语的人差不多各半。区里的人习惯用堤和闸口报地址，问路时会说「三号堤往北第二个闸口」，老农们说这里的水比地贵，地比人贵。\n冬天河水上涨时，堤坝区的人轮流上堤巡查，手电筒的光在夜里沿着河一路排过去；夏天河谷干热，水全靠上游水库放下来。水权在拍卖会上一年一卖，买得起水的是湾区的基金，种地的人只能租水，水价高的年份，稻田就整片撂荒，留给野鸭。游说—堤坝公路从游说区向北伸进稻田，七十多公里，议员们下乡拍照时走的就是这条路。\n秋天收稻以后，农民放水灌田，引来成千上万只候鸟过冬，观鸟的人和打猎的人在同一道堤上相遇，彼此点点头。春天李子花开，镇上的小饭馆端出李子馅饼和炸鲶鱼，老农们边吃边算今年要花多少钱租水，算完了再叫一盘。"
    en: "Levee District is the great farming country of the Sacramoney River valley north of the capital, about 24,000 square kilometres, more than three quarters of the city, with some 100,000 people, reaching up into the mountains on either side of the valley to a height of about 2,100 metres. Between the rice paddies, walnut groves and plum orchards run levee after levee, the dirt tracks along their tops forming a network on which tractors and rice lorries travel. The district lives on farming, food processing and logistics, with rice mills, dried-fruit plants and cold stores strung out along the river, and Spanish and English speakers are roughly half and half. People here give addresses by levee and sluice gate, so directions sound like 'the second gate north along Levee Three', and the old farmers say water here is dearer than land, and land dearer than people.\nIn winter when the river rises, Levee District people take turns patrolling the levees, the beams of their torches strung out along the river through the night; in summer the valley is hot and dry and all the water comes down from the reservoirs upstream. Water rights are auctioned once a year, the Bay Area funds are the ones who can afford them, and farmers can only rent water; in years when it is dear, whole paddies are left fallow for the wild ducks. The Lobbyton–Levee Road runs north from Lobbyton into the rice fields for more than seventy kilometres, and it is the road legislators take when they come out to the countryside for photographs.\nAfter the rice harvest in autumn, farmers flood their fields and draw tens of thousands of migrating birds to winter there, and birdwatchers and hunters meet on the same levees and nod to one another. When the plum trees blossom in spring, the small restaurants in town serve plum pie and fried catfish, and the old farmers work out over their plates how much renting water will cost this year, then order another helping."
  codes:
    admin: '060103'
  population: 100000
  area_km2: 24000.0
  traits: { industries: [agriculture, food, logistics], heritage: ca_latino }
- id: div_w1h5d7
  subtype: borough
  parent: div_91r9b3
  status: generated
  names:
    zh: 木屋区
    en: Chalet District
    es: Chalés
  notes:
    zh: "木屋区是首府萨克拉钱托东边伸进估值山脉的山区，全区 2 万人，面积约 4000 平方公里，最高处海拔 1918 米。塔克斯霍湖在区的东端，四周雪山环绕，湖水清澈见底，湖岸几乎被富人的滑雪木屋和私人码头占满。湖名来自湖边的避税传统：木屋登记成「农业用地」，屋里的酒窖登记成「水利设施」，游艇登记成渔船，湖边的人说这片湖的水是全州唯一不用交税的东西。堵车领道从首府翻山而来，经海拔 1510 米的堵车山口到湖边，离线领道也从区里经过。\n冬天雪道开放，山路上堵满了从湾区来的自动驾驶越野车。周末堵车山口前的车能排出几十公里，车里没有司机，乘客在后座睡觉，于是谁也不着急。这里冬天冷，一月夜里常在零度以下，有记录以来最冷到过零下 14.2 度，全年降水约 980 毫米，大多是雪。\n冬季运动、旅游和富豪私人服务是三大行业，全区人均 GDP 约 12 万美元，收入中位数约 2.2 万：木屋的主人一年来几次，常住的是给木屋铲雪、给码头修船、在雪场开缆车的人。夏天湖水冰凉，游客划着皮艇沿湖岸看一座座关着门的木屋，有的木屋门口立着「农场」的牌子，牌子旁边停着一架水上飞机。上次选举，共和党得票 42.5%，防火绿党 19.1%，民主党 12.9%。"
    en: "Chalet District is the mountain country east of the capital, Sacramoney, reaching into the Sierra Valuation, home to 20,000 people over some 4,000 km² and rising to 1,918 m. Lake Taxhoe lies at its eastern end, ringed by snowy peaks, its water clear to the bottom and its shores almost entirely taken up by the ski chalets and private jetties of the rich. The lake owes its name to a local tradition of tax avoidance: the chalets are registered as farmland, their wine cellars as water works and the yachts as fishing boats, and lakeside people say its water is the only thing in the state that pays no tax. Gridlock Road climbs from the capital over Gridlock Pass at 1,510 m to the lake, and Offline Road also passes through the district.\nIn winter the ski runs open and the mountain roads jam with self-driving SUVs from the Bay Area. On weekends cars queue for tens of kilometres before Gridlock Pass, but with no drivers and the passengers asleep in the back, nobody is in a hurry. Winters are cold, with January nights often below freezing and a record low of minus 14.2, and about 980 mm of precipitation falls a year, much of it as snow.\nWinter sports, tourism and services for the very rich are the three main industries; GDP per head is about $120,000 and median income about $22,000: the chalet owners visit a few times a year, and the people who actually live here clear their snow, mend the boats at their jetties and run the ski lifts. In summer the lake is icy, and tourists paddle kayaks along the shore past chalet after shuttered chalet, some with a 'Farm' sign at the gate and a seaplane moored beside it. At the last election the Republican Party took 42.5% of the vote, the Firebreak Greens 19.1% and the Democratic Party 12.9%."
  codes:
    admin: '060104'
  population: 20000
  area_km2: 4000.0
  traits: { industries: [ski, tourism, luxury], heritage: ca_anglo, income: 1.8 }

# ── 失落天使市（最大城市）──
- id: div_w1vh1a
  subtype: locality
  parent: div_x2z14w
  status: generated
  names:
    zh: 失落天使市
    en: Lost Angeles City
    es: Los Ángeles Perdidos
  notes:
    zh: "失落天使市是自治州最大的城市，在南海岸付费墙山脉和大海之间的盆地里，全市 310 万人，面积约 1.1 万平方公里，八个区连成一片几百平方公里的城区，被领道和市道的立交桥切成碎块。好莱怪区是影视业的老家，如今片场里的演员、编剧和群众演员大多换成了人工智能生成的数字人，真人演员要付钱才能在片尾字幕里出现；破产中心区的写字楼一半空着，楼下的人行道上是帐篷城。马里买区和比佛利账单区是海边和山上的豪宅，烟雾谷区、网约谷区和搁浅滩区住着城里大多数人：仓库工人、零工、被机器人出租车抢了饭碗的司机和搁浅在港外的货轮上的船员。北边的天使冠区是付费墙山脉和山后的高原荒漠，占了全市八成的面积，热搜峰海拔 2097 米，山坡上的白色大字每天换成全州搜索量最高的词，山火季时常常是「山火」。\n全市 GDP 约 2270 亿美元，靠影视与流媒体、物流仓储、港口航运和零工与平台劳务，人均 GDP 约 7.3 万美元，收入中位数却只有 1.7 万美元。搁浅滩港的龙门吊和集卡全部无人驾驶，滞港湾外常年停着排队等泊位的货轮，船员在甲板上种菜养鸡。失落天使国际机场在烟雾谷区西边的海边，离市中心只有十几公里，开车却常常要两个小时，航站楼外于是排着按分钟计价的直升机出租车。全州最繁忙的停车场领道从网约谷区一路南下穿过盆地，单调领道、广告牌领道和仓储领道也都从这里出发或经过。地铁有三条线，1 号线七站在破产中心区，2 号线七站在好莱怪区，3 号线十三站在搁浅滩区，三条线互不相连，市民说那是三座城市各自的地铁。\n这里是温暖的地中海气候，冬天白天也有 19 °C，一年雨水 400 多毫米。讲英语的六成，讲西班牙语的近四成。17 席的市议会全归民主党，市长泰勒·克劳利在两名民主党人对决的决选中以 51.0% 胜出，落选者第二天就宣布下一届再战。警察局名义上的总部是破产中心区一座玻璃外墙的大楼，市民叫它「玻璃堡」，局长真正能指挥的只剩这栋楼和楼前的停车场。\n失落天使人说这座城市只有两个季节：「烟雾季」和「山火季」。全市的警察局分裂成十几个各管一片的「分局」，每个分局有自己的颜色和徽章纹身，晚上收保护费，白天开罚单，市民遇到抢劫先要弄清楚抢劫的是警察还是帮派，好决定打哪个电话投诉。堵车是这里的宗教：上下班高峰时最快的交通工具是步行，第二快是直升机，城里有三百多个楼顶停机坪，大多属于不到两百个人。"
    en: "Lost Angeles City is the largest city in the autonomous state, lying in the basin between the Paywall Range and the sea on the south coast, with 3,100,000 people and some 11,000 square kilometres; its eight districts merge into a single urban sprawl of several hundred square kilometres, chopped into pieces by the interchanges of state and municipal roads. Hollyweird is the old home of the film industry, where most of the actors, writers and extras in the studios have been replaced by AI-generated digital humans and real actors must pay to appear in the closing credits; half the office towers in Downturn District stand empty, with a tent city on the pavements below. Malibuy and Beverly Bills are the mansions by the sea and in the hills, while Smogdale, Rideshare Valley and Long Beached house most of the city's people: warehouse workers, gig workers, drivers whose livelihoods were taken by robotaxis, and the crews of freighters stranded outside the port. Angel Crest to the north, the Paywall Range and the high desert behind it, makes up four fifths of the city's area; Mount Trending rises 2,097 metres there, and the giant white letters on its slope change every day to spell the state's most-searched word, which in fire season is often 'WILDFIRE'.\nThe city's GDP is about 227 billion dollars, earned from film and streaming, logistics, port and shipping, and gig and platform work; GDP per head is about 73,000 dollars, but the median income only 17,000. The gantry cranes and container lorries of the Port of Long Beached are all driverless, and outside Backlog Bay freighters queue for berths all year, their crews growing vegetables and keeping chickens on deck. Lost Angeles International Airport lies by the sea west of Smogdale, only a dozen or so kilometres from the city centre but often two hours away by car, so a line of helicopter taxis charged by the minute waits outside the terminal. Parking Lot Road, the busiest in the state, runs south from Rideshare Valley through the basin, and Monotony Road, Billboard Road and Warehouse Road all start here or pass through. The metro has three lines, Line 1 with seven stations in Downturn District, Line 2 with seven in Hollyweird and Line 3 with thirteen in Long Beached, none of them connected, so people call them the metros of three separate cities.\nThe climate is warm Mediterranean, with winter daytime highs of 19 °C and a little over 400 millimetres of rain a year. Six in ten people speak English and nearly four in ten Spanish. All 17 seats on the City Council belong to the Democrats, and the mayor, Tyler Crowley, won a run-off between two Democrats with 51.0 per cent; the loser announced the next day that he would run again next time. The nominal police headquarters is a glass-walled tower in Downturn District that people call 'the Glass Fort', and all the chief can really command is the building itself and the car park in front of it.\nLost Angelenos say the city has only two seasons: 'smog season' and 'fire season'. The police force has split into a dozen or so 'precincts' that each run a patch of their own, each with its own colours and badge tattoos, collecting protection money by night and writing tickets by day, so that anyone who is robbed must first work out whether it was the police or a gang in order to know which number to call with a complaint. Traffic is the local religion: at rush hour the fastest way to travel is on foot and the second fastest by helicopter, and the city has more than three hundred rooftop helipads, most belonging to fewer than two hundred people."
  codes:
    admin: '060200'
    unlocode: US LXA
  population: 3100000
  area_km2: 11000.0
