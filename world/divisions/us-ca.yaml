  traits: { industries: [wine, tourism, luxury] }
- id: div_n4pw55
  subtype: borough
  parent: div_6shwy9
  status: generated
  names:
    zh: 索诺莫尔区
    en: Sonomore District
    es: Sonomás
  notes:
    zh: "索诺莫尔区是梅洛特西边更大的葡萄园、红杉林和北海岸，全区 7 万人，面积约 1.2 万平方公里，占全市大半，海岸线约 43 公里，最高处海拔 1448 米。区名里的「莫尔」是「更多」：更多的葡萄园、更多的品酒室和更多想在这里买地的人。离海越近，雾越大、雨越多，全年降水约 1000 毫米，靠海的山坡长着高大的红杉，内陆的谷地才是葡萄园。广告牌领道沿北海岸穿过红杉林，树高得让广告牌没处立，这是全线唯一安静的一段。\n清除记录湖在区的北部，雾帘山脉东边，湖水浅而温暖，夏天长满藻类，湖边有温泉和老火山。湖边的温泉旅馆专门接待需要「消失几天」的名人和政客，退房时，旅馆会替他们清除所有记录；本地人说，这片湖记得的事情比任何一家报社都多，只是什么也不说。\n区里的人靠葡萄酒、旅游和林业过日子，伐木工、酿酒师和旅馆前台常在同一家酒馆里碰面，全区人均 GDP 约 9.7 万美元，收入中位数约 2.1 万，65 岁以上的人占三成多，不少是湾区搬来养老的人。夏天这里比谷地凉快，七月白天约 25 度；冬天雨季，海边的小镇整日泡在雾里。新来的买家开着车在山路上转，看中哪块坡地就让人工智能估价，老住户则在门口挂一块「不卖，也别问」的牌子。上次选举，共和党得票 42.3%，防火绿党 17.8%，加州独立党 13.6%，投票率 61.1%。"
    en: "Sonomore District is the bigger vineyards, redwood forests and north coast west of Merlotte, home to 70,000 people over some 12,000 km², most of the city, with about 43 km of coast and heights up to 1,448 m. The 'more' in its name is more vineyards, more tasting rooms and more people wanting to buy land here. The nearer the sea, the thicker the fog and the heavier the rain, about 1,000 mm a year; tall redwoods cover the seaward slopes, and the vineyards lie in the inland valleys. Billboard Road runs through the redwoods along the north coast, where the trees are so tall there is nowhere to put a billboard, the only quiet stretch on the whole road.\nClear History Lake lies in the north of the district, east of the Fogwall Range, its water shallow and warm and thick with algae in summer, with hot springs and old volcanoes on its shores. The lakeside hot-spring hotels cater for celebrities and politicians who need to 'disappear for a few days', and when they check out the hotel clears every record of their stay; locals say the lake remembers more than any newspaper, it just never says anything.\nPeople here live on wine, tourism and timber, and loggers, winemakers and hotel receptionists meet in the same bars. GDP per head is about $97,000 and median income about $21,000, and over three in ten people are over 65, many of them retired from the Bay Area. Summers are cooler than in the valley, about 25 degrees by day in July; in the winter rains the coastal towns spend whole days in fog. New buyers drive the mountain roads and have an artificial intelligence value any slope that catches their eye, while old residents hang signs on their gates reading 'Not for sale, don't ask'. At the last election the Republican Party took 42.3% of the vote, the Firebreak Greens 17.8% and the California Independence Party 13.6%, on a turnout of 61.1%."
