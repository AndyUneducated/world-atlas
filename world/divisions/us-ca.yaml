  notes:
    zh: "失落天使东南的规划城市，全市 60 万人，由一家地产公司从一张白纸上规划出来，每条街、每棵树、每栋房子外墙的颜色都写在一本几千页的《社区守则》里。总规划区的住宅分成几十个一模一样的村落，每个村落有自己的业主委员会、游泳池和门禁；新港决口区是海边的游艇码头和豪宅，业主委员会山区是山上更新的门禁社区。全城的外墙只允许十二种米色，曾经有人把门刷成浅蓝，被业主委员会罚款到卖了房子。\n艾尔瓦纳号称全州最安全的城市，靠的不是警察，而是每户门口的摄像头、每条街上的巡逻机器人和业主委员会的「邻里信用分」：草坪太高扣分，垃圾桶没收扣分，访客停车超时扣分，分数太低的人家会收到搬家公司的上门报价。城里的学校成绩很好，孩子们从小学会的第一句话是「请出示您的访客码」。"
    en: "A planned city south-east of Lost Angeles, with 600,000 people, laid out on a blank sheet by a property company; every street, every tree and the colour of every house's walls are set down in a Community Code thousands of pages long. Masterplan District's homes are divided into dozens of identical 'villages', each with its own homeowners' association, pool and gate; Newport Breach is the marinas and mansions on the coast, and HOA Hills newer gated communities up in the hills. Only twelve shades of beige are allowed for outside walls in the whole city, and one man who painted his door pale blue was fined until he sold his house.\nIrvana claims to be the safest city in the state, thanks not to the police but to a camera at every door, patrol robots on every street and the homeowners' associations' 'neighbourly credit score': points are lost for long grass, for bins left out and for visitors overstaying in the car park, and households whose scores fall too low receive quotes from removal firms. The schools get excellent results, and the first sentence children learn is 'Please show your visitor code.'"
  codes:
    admin: '060700'
  population: 600000
  area_km2: 2500.0
  color: '#B8A88A'
  flag: { layout: nordic, colors: ['#EDE6D6', '#B8A88A', '#7C6F57'], charge: ring_homes, charge_color: '#7C6F57' }
  flag_notes:
    zh: "米色旗面上一个浅褐色的十字，十字中间嵌着深褐色的细十字，左上角是一圈围成环的房子。三种颜色都在《社区守则》允许的十二种米色之内；环形的房子代表门禁村落，房子之间没有门，因为门要另外申请。"
    en: "A pale brown cross with a dark brown inner cross on a beige field, and a ring of houses in the canton. All three colours are among the twelve beiges the Community Code allows; the ring of houses stands for the gated villages, with no gaps between them, since a gap would need a separate application."
  traits: { industries: [tech, residential, education, security], heritage: ca_anglo, age: balanced, income: 1.5 }
