  names:
    zh: 欧福利亚市
    en: Euphoria City
    es: Euforia
  notes:
    zh: "欧福利亚市在北海岸，全市 14 万人，面积约 3.5 万平方公里，雾气缭绕的红杉林和崎岖的海岸占了大半个市。谦卑湾区是海湾边的港口和老木材镇，红木帘区是南边连绵几百公里的红杉林、河谷和海岸，林子深处的大麻农场曾经是这里最大的产业。城名来自大麻：合法化以前，林子里的农场让这里富得流油，合法化以后，大公司在荒漠里用温室种出了更便宜的大麻，林子里的农场一家接一家倒闭，城里的欢乐也就只剩下城名了。\n如今全市靠林业与木材加工、大麻种植、渔业和旅游过日子，三分之一的产值还来自山林和海里，人均 GDP 约 4.1 万美元，收入中位数 1.5 万美元。谦卑湾是北海岸唯一的大海湾，两道长沙嘴把它和外海隔开，湾里是牡蛎养殖场、渔港和运原木的码头，湾边老木材镇的维多利亚式木屋保存完好，本地人介绍自己时总说「我们以前很有钱，现在很谦卑」；南边的皆伐湾边，砍光的伐木场和老红木林交错，从海上看去像一块打了补丁的绿毯子。最高的标题党峰是点击诱饵山脉的主峰，海拔 2074 米，山脚的广告说「登上这座山，你的人生将彻底改变」，登上去的人说改变的主要是膝盖。\n广告牌领道沿北海岸穿过红杉林，到谦卑湾区走到尽头，林子里的树高得让广告牌没处立，是全线唯一安静的一段；绿雾领道从谦卑湾区出发，向东穿过河谷去雷达克特，路边的「怀旧大麻博物馆」展出合法化以前的种植棚。这里雨水多，一年 1250 毫米左右，夏天白天也只有 22 °C 上下。政治上是防火绿党的天下：11 席的市议会全归防火绿党，市长洛根·霍利斯特在两名防火绿党人对决的决选中以 51.6% 胜出。\n欧福利亚人自称住在「红木帘」后面：帘外的人工智能、高铁和执法局都很少翻过山来，城里还有人用现金，有人不用手机，有人坚持在林子里的树屋里过日子。一年四季都在下雨或起雾，红杉树高得要仰着头才能看到树梢，林子里的蕨类比人还高。每年秋天大麻收获季，林子里的小镇还会办一场「怀旧丰收节」，节上卖的大麻是从荒漠温室里进的货。周末人们去海边挖蛤蜊、捡浮木，冬天的风暴过后，海滩上堆满了从林子里冲下来的大树干；镇上的咖啡馆墙上贴着一张手写告示：「本店不接待人工智能推荐来的顾客」。"
    en: "Euphoria City lies on the north coast, with 140,000 people and some 35,000 square kilometres, most of it fog-wreathed redwood forest and rugged coast. Humbled Bay District is the port and old lumber town on the bay, and Redwood Curtain the redwood forests, river valleys and coast stretching hundreds of kilometres to the south, where cannabis farms deep in the forest were once the biggest industry. The city's name comes from cannabis: before legalisation the farms in the forest made the place rich beyond measure, but after it big companies grew cheaper cannabis in desert greenhouses, the forest farms closed one after another, and nothing was left of the city's euphoria but its name.\nThe city now lives on forestry and timber, cannabis, fishing and tourism, with a third of its output still coming from the forests and the sea; GDP per head is about 41,000 dollars and the median income 15,000. Humbled Bay is the only large bay on the north coast, cut off from the open sea by two long sandspits, and holds oyster beds, a fishing harbour and log wharves, and the Victorian wooden houses of the old lumber town on its shore are well preserved, their owners always introducing themselves with 'We used to be rich; now we're humble'; on Clearcut Bay to the south, clear-felled hillsides alternate with old redwood forest, so that from the sea it looks like a patched green blanket. The highest summit, Mount Headline, the main peak of the Clickbait Mountains, rises 2,074 metres, and the adverts at its foot promise 'Climb this mountain and your life will change for ever'; those who have climbed it say what mainly changed was their knees.\nBillboard Road follows the north coast through the redwoods and ends in Humbled Bay District, the trees so tall that there is nowhere to put up a billboard, the only quiet stretch of the whole road; Green Haze Road sets off from Humbled Bay District east through the river valleys towards Redacted, and the 'Cannabis Nostalgia Museum' beside it displays grow sheds from before legalisation. The city is wet, with about 1,250 millimetres of rain a year, and summer days reach only about 22 °C. Politically it belongs to the Firebreak Greens: all 11 seats on the City Council are theirs, and the mayor, Logan Hollister, won a run-off between two Firebreak Greens with 51.6 per cent.\nEuphorians say they live behind the 'Redwood Curtain': artificial intelligence, high-speed rail and the Agency rarely come over the mountains, some people still pay cash, some go without mobile phones, and some insist on living in treehouses in the forest. All year round it is either raining or foggy, the redwoods are so tall that you must tip your head back to see their tops, and the ferns in the forest stand taller than a person. Every autumn, in the cannabis harvest season, the forest towns still hold a 'Nostalgic Harvest Festival', where the cannabis on sale is bought in from the desert greenhouses. At weekends people go down to the shore to dig for clams and gather driftwood, and after the winter storms the beaches are piled with great tree trunks washed down from the forest; on the wall of a café in town hangs a handwritten notice: 'We do not serve customers referred by AI.'"
