    es: Bahía Humillada
  notes:
    zh: "谦卑湾区是欧福利亚在北海岸的港口区，全区 9 万人，面积约 3000 平方公里。谦卑湾是北海岸唯一的大海湾，面积约 230 平方公里，两道长长的沙嘴把湾和外海隔开，湾里是牡蛎养殖场、渔港和运原木的码头，港口里停着渔船和运木材的驳船。老木材镇的维多利亚式房子保存得很好，木头的尖顶和花边窗刷成各种颜色。广告牌领道沿北海岸一路开到这里为止，绿雾领道从湾边往东翻山去雷达克特。区名来自本地人的自我介绍：「我们曾经很富，现在很谦卑」。\n渔业、林业和港口航运是三大行业，农林渔业占全区经济的三分之一，全区人均 GDP 约 4.1 万美元，收入中位数约 1.5 万。这里是全州降水最多的区，全年降水约 1250 毫米，七月白天也只有 22 度上下，一年四季都在下雨或起雾。\n谦卑湾在「红木帘」后面，帘外的人工智能、高铁和执法局很少翻过山来，城里还有人用现金，有人不用手机。清晨，牡蛎船先出港，原木驳船随后，码头上的酒馆一早就开门，渔民和伐木工在里面喝咖啡，聊的多半是天气和鱼价。秋天湾边的小镇办牡蛎节，木屋前的长桌上摆满生蚝和蒜蓉面包，游客问起从前的富日子，老人们就指一指那些维多利亚式房子。上次选举，防火绿党得票 49.1%，共和党 22%，民主党 11.1%。"
    en: "Humbled Bay District is Euphoria's port district on the north coast, home to 90,000 people over some 3,000 km². Humbled Bay is the only large bay on the north coast, about 230 km², cut off from the open sea by two long sand spits, with oyster farms, a fishing harbour and log quays, and fishing boats and log barges lie in the harbour. The old lumber town's Victorian houses are well kept, their wooden gables and lacy windows painted in every colour. Billboard Road runs up the north coast and ends here, and Green Haze Road heads east from the bay over the mountains to Redacted. The name comes from the way locals introduce themselves: 'We used to be rich; now we're humble.'\nFishing, forestry and timber, and port and shipping are the three main industries, with farming, forestry and fishing a third of the district's economy; GDP per head is about $41,000 and median income about $15,000. This is the wettest district in the state, with about 1,250 mm of rain a year and only around 22 degrees by day even in July, and it rains or fogs in every season.\nHumbled Bay lies behind the 'Redwood Curtain': the artificial intelligence, high-speed rail and enforcement agency on the far side seldom come over the hills, and some people in town still use cash and some still have no phone. At dawn the oyster boats go out first and the log barges follow; the bars on the quay open early, and fishermen and loggers drink coffee inside, talking mostly about the weather and the price of fish. In autumn the bayside towns hold an oyster festival, with long tables outside the wooden houses laden with oysters and garlic bread, and when tourists ask about the rich old days, the old people just point at the Victorian houses. At the last election the Firebreak Greens took 49.1% of the vote, the Republican Party 22% and the Democratic Party 11.1%."
  codes:
    admin: '061401'
  population: 90000
  area_km2: 3000.0
  traits: { industries: [fishing, forestry, port] }
- id: div_2t7y15
  subtype: borough
  parent: div_v78vjn
  status: generated
  names:
    zh: 红木帘区
    en: Redwood Curtain District
    es: Telón de Secuoyas
  notes:
    zh: "红木帘区是欧福利亚南边连绵的红杉林、河谷和海岸，面积约 3.2 万平方公里，占了全市九成，住着约 5 万人。林子里有全州最高的几棵树，确切位置是保密的，以免被人刻上名字，护林员带人参观时会故意绕几圈路。东边是点击诱饵山脉的崎岖山地，主峰标题党峰海拔 2074 米，四周是深切的河谷和原始森林；海边的皆伐湾湾口有两座小岛，湾边山坡上砍光的伐木场和老红木林交错，伐木公司竖了一块牌子：「每砍一棵，就种下一个承诺」。\n区里靠林业与木材加工、大麻种植和自然保护过日子，林子深处散落着倒闭的大麻农场、嬉皮公社和住在树屋里的人，讲英语的占九成。广告牌领道在红杉林里穿行，树高得让广告牌没处立；绿雾领道顺着河谷往东去，滑坡的路段每年由同一家承包商抢修，路边牌子上写着「感谢您的耐心，我们明年还会再来」。林子里的小镇如今靠一座「怀旧大麻博物馆」过活，门票里包含一包从荒漠温室进的货。\n雾每天早上从海上漫进河谷，到中午才散，树屋里的人靠雨水和一块太阳能板过日子，下山买东西一趟要走半天。秋天鲑鱼回游，河边站满了钓鱼的人和熊，大家都很有默契，谁也不越过谁的那块石头。"
    en: "Redwood Curtain District is the unbroken redwood forest, river valleys and coast of southern Euphoria, about 32,000 square kilometres, nine tenths of the city, with some 50,000 people. The forest holds the tallest trees in the state, their exact locations kept secret so that nobody carves a name into them, and rangers guiding visitors deliberately take a few detours. To the east lie the rugged Clickbait Mountains, whose main summit, Mount Headline, rises 2,074 metres amid deep-cut valleys and old-growth forest; on the coast, two small islands guard the mouth of Clearcut Bay, where clear-felled hillsides alternate with old redwood forest and a logging company has put up a sign: 'For every tree we cut, we plant a promise.'\nThe district lives on forestry and timber, cannabis and nature conservation; deep in the forest are scattered failed cannabis farms, hippie communes and people living in treehouses, and nine in ten people speak English. Billboard Road winds through the redwoods, which are too tall to leave room for billboards; Green Haze Road follows the valleys east, its landslip sections repaired every year by the same contractor, whose roadside sign reads 'Thank you for your patience. We'll be back next year.' The forest towns now live off a 'Cannabis Nostalgia Museum', whose ticket includes a bag of produce bought in from the desert greenhouses.\nEvery morning the fog rolls in from the sea up the valleys and does not lift until noon; the treehouse people live on rainwater and a single solar panel, and a trip down to the shops takes half a day. In autumn, when the salmon run, the riverbanks fill with anglers and bears, who have an understanding that nobody steps onto anyone else's rock."
  codes:
    admin: '061402'
  population: 50000
  area_km2: 32000.0
  traits: { industries: [forestry, cannabis, conservation] }

# ── 雷达克特市──
- id: div_57c6nv
  subtype: locality
  parent: div_x2z14w
  status: generated
  names:
    zh: 雷达克特市
    en: Redacted City
    es: Censurado
  notes:
    zh: "雷达克特市在自治州北部，是一座山地城市，全市 16 万人，面积 7.15 万平方公里，是自治州面积第二大的市。城里大部分地方是森林、火山和熔岩高原，级联故障山脉的两座火山在北边，萨克拉钱托河从这里流向南边的河谷。涂黑区是城市的中心和水库，待建州区是北部的山地和火山，熔岩高原区是东边的高原和湖泊。城名来自市政府的档案：这里的人对州政府极不信任，所有向州政府提交的文件都会先把一大半内容涂黑，久而久之，城名也被涂黑了，只剩下「已涂黑」三个字。\n全市靠林业与木材加工、水力发电、采矿与石料和旅游过日子，人均 GDP 约 4.4 万美元，收入中位数 1.5 万美元；老人多，每四个居民里就有一个以上过了 65 岁。涂黑区北边的大坝把萨克拉钱托河拦成水库，发的电送往南边的城市。北边的宕机峰海拔 2370 米，全州那场停了三天的大停电就是从它冒烟开始的；南端的重启峰下有一座地热电站，工程师在那里手动重启了全州电网，从此山里家家备着发电机。东北海岸外的脱离岛、海边的待定湾和分家角，都和待建州运动有关。\n这里是冬冷夏热的地中海气候，一年雨水 800 多毫米，冬天山里下大雪，最低纪录零下 15.6 °C；夏天河谷里白天三十多度，山火季的烟有时一连几周遮住太阳。单调领道从南边的河谷进城，经涂黑区一路向北穿过待建州区；绿雾领道从西边的红杉林过来，经涂黑区上到熔岩高原；离线领道沿估值山脉东麓北上，在熔岩高原区走到尽头。全市讲英语的近九成。政治上，防火绿党在 11 席的市议会里占 7 席，市长达科塔·斯托克韦尔以 53.3% 的得票击败共和党对手；共和党的总票数其实最多，却只拿到 2 席，民主党也是 2 席。\n雷达克特人说自己住在「还没成立的州」：北边的居民几十年来一直在争取从加州分出去另立一州，路边的牌子上写着「欢迎来到待建州」，州长每次来访都会被送一顶写着「再见」的帽子。山里的人打猎、伐木、开小型金矿，家家有枪有发电机，谁也不信人工智能，最受欢迎的店是卖罐头和防毒面具的。级联故障山脉的火山顶终年积雪，晴天时从城里看得见。镇上的图书馆把每本书的最后一页都涂黑了，说是为了防止剧透，读者倒也习惯了自己编结局。"
    en: "Redacted City is a mountain city in the north of the autonomous state, with 160,000 people and 71,500 square kilometres, the second largest city in the state by area. Most of it is forest, volcanoes and lava plateau; the two volcanoes of the Cascading Failure Range stand in the north, and the Sacramoney River flows from here south into its valley. Blackout District is the city centre and its reservoir, Statehood-Pending the mountains and volcanoes of the north, and Lava Plateau the plateau and lakes to the east. The city's name comes from its own archives: people here deeply distrust the state government, and every document they submit to it has most of its contents blacked out first; over time the city's name was blacked out too, leaving only the word 'Redacted'.\nThe city lives on forestry and timber, hydropower, mining and quarrying, and tourism; GDP per head is about 44,000 dollars and the median income 15,000, and there are many old people, more than one resident in four being over 65. A great dam north of Blackout District holds the Sacramoney River back as a reservoir and sends its power to the cities in the south. Mount Outage in the north, 2,370 metres high, is where the state's three-day blackout began when the volcano started smoking; below Mount Reboot at the southern end stands a geothermal power station where engineers restarted the state grid by hand, and every household in the mountains has kept a generator ever since. Secession Island off the north-east coast, Pending Bay on the shore and Point Split all have to do with the statehood movement.\nThe climate is Mediterranean with cold winters and hot summers, a little over 800 millimetres of rain a year and heavy snow in the mountains in winter; the record low is minus 15.6 °C, while summer days in the valley pass 30 °C and in fire season the smoke sometimes hides the sun for weeks on end. Monotony Road enters the city from the valley in the south and runs north through Blackout District and on across Statehood-Pending; Green Haze Road comes in from the redwood forests to the west and climbs through Blackout District to the lava plateau; and Offline Road runs north along the eastern foot of the Sierra Valuation and comes to its end in Lava Plateau District. Nearly nine in ten people speak English. In politics, the Firebreak Greens hold 7 of the 11 seats on the City Council, and the mayor, Dakota Stockwell, beat the Republican candidate with 53.3 per cent of the vote; the Republicans actually won the most votes overall but took only 2 seats, the same as the Democrats.\nRedacted people say they live in 'the state that hasn't been founded yet': for decades the people of the north have campaigned to leave California and form a state of their own, roadside signs read 'Welcome to Statehood-Pending', and every time the governor visits he is presented with a cap that says 'Goodbye'. Mountain people hunt, log and work small gold mines, every household has guns and a generator, nobody trusts artificial intelligence, and the most popular shops sell tinned food and gas masks. The volcanic summits of the Cascading Failure Range are snow-capped all year and visible from town on clear days. The town library has blacked out the last page of every book, to prevent spoilers, it says, and readers have grown used to making up their own endings."
  codes:
    admin: '061500'
  population: 160000
  area_km2: 71500.0
  color: '#3D405B'
  flag: { layout: bands, colors: ['#111111', '#F5F5F5', '#111111'], ratio: [2, 1, 2], charge: star5, charge_color: '#111111', charge_band: 1 }
  flag_notes:
    zh: "黑、白、黑三道横条，中间的白条上一颗黑色的五角星。市政府的说法是：城旗的原设计已经涂黑，现在看到的是公开版本，五角星代表「待建州」；原设计据说藏在市政厅地下室里，没有人申请到查阅权限。"
    en: "Black, white and black bands with a black five-pointed star on the white band. According to the city government, the original design has been redacted and this is the public version, the star standing for the 'State of Pending'; the original is said to be kept in the City Hall basement, and nobody has ever been granted permission to see it."
