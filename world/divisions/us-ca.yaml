  parent: div_w1vh1a
  status: generated
  names:
    zh: 网约谷区
    en: Rideshare Valley District
    es: Valle del Viaje Compartido
  notes:
    zh: "网约谷区在付费墙山脉北边，是一大片平坦的谷地郊区，面积约 900 平方公里，住着约 80 万人，是全市人口第二多的区。这里从前是网约车司机最多的地方。机器人出租车上路以后，司机们失去了工作，却还住在车里：谷里每个大型停车场晚上都停满了住人的旧车，车顶上晾着衣服，后备箱里放着电饭锅。机器人出租车白天空着在街上兜圈，等着接从来不出门的人。\n区里的经济写成零工与平台劳务、居住与社区服务和免税零售，说白了就是送外卖、跑腿、替人排队和在折扣商场打工；人均 GDP 约 4.3 万美元，在全市八个区里最低，讲西班牙语的超过一半。停车场领道从区里出发，往南翻过山口进盆地，是全州最繁忙的领道，早高峰的车流一小时挪不了几公里；广告牌领道横穿谷地，路边的广告牌向住在车里的人推销「移动居所保险」。\n住在车里的人有自己的规矩：哪个停车场晚上几点开始可以停，哪家超市的厕所对外开放，哪个公园早上有免费的热水，消息在一个群聊里传得飞快。周末停车场里会办「后备箱集市」，有人卖家常菜，有人帮人修车，有人教孩子做功课，旧车的车门一开，就是一间小店。"
    en: "Rideshare Valley District, north of the Paywall Range, is a great flat expanse of valley suburbs, about 900 square kilometres with some 800,000 people, the second most populous district in the city. It used to be home to more rideshare drivers than anywhere else. When the robotaxis took to the roads the drivers lost their jobs but went on living in their cars: every big car park in the valley fills at night with old cars that people live in, laundry drying on the roofs and rice cookers in the boots. By day the robotaxis circle the streets empty, waiting to pick up people who never go out.\nThe district's economy is listed as gig and platform work, residential services and duty-free retail, which in plain terms means delivering food, running errands, queuing for other people and working in discount malls; GDP per head is about 43,000 dollars, the lowest of the city's eight districts, and more than half the people speak Spanish. Parking Lot Road sets off from the district and runs south over the pass into the basin, the busiest state road in the state, where the morning rush moves only a few kilometres an hour; Billboard Road crosses the valley, its billboards selling 'mobile residence insurance' to the people living in their cars.\nThose who live in their cars have rules of their own: which car park allows parking from what time at night, which supermarket lets outsiders use its toilets, which park has free hot water in the morning, all passed around a group chat at lightning speed. At weekends the car parks hold 'boot markets', where some sell home cooking, some fix cars and some help children with their homework, and an old car with its doors open becomes a little shop."
  codes:
    admin: '060207'
  population: 800000
  area_km2: 900.0
  traits: { industries: [gig, residential, retail], heritage: ca_latino, income: 0.6 }
- id: div_jtjexr
  subtype: borough
  parent: div_w1vh1a
  status: generated
  names:
    zh: 天使冠区
    en: Angel Crest District
    es: Cresta de los Ángeles
  notes:
    zh: "天使冠区是失落天使北部的付费墙山脉和山后的高原荒漠，面积约 8790 平方公里，占全市八成，人口约 29.5 万。山上是国家森林和天文台，西段的热搜峰海拔 2097 米，俯瞰整个盆地，峰顶有天文台和一排电视发射塔；山后的荒漠里散布着航空航天测试场、监狱和一座座新建的「低价郊区」，从那里开车进城单程要三个小时。单调领道从盆地翻山北上，和每条翻越付费墙山脉的领道一样按海拔分段收费，住在荒漠郊区的人上下班一趟，过路费要按山的高度算两次。\n每年山火季，大火常从这里烧起，烟一直飘到海边。热搜峰的山坡上立着几个巨大的白色字母，由人工智能每天更新，拼出当天全州搜索量最高的词，山火季时那几个字母常常是「山火」，山下的人抬头一看，就知道该不该关窗。区里的工作分在三处：航空航天测试场里的工程师和技工，监狱里的看守，还有国家森林里的护林员和消防员，全区人均 GDP 约 6 万美元，收入中位数约 1.7 万。\n「低价郊区」的房子一模一样，是被盆地里的房租挤出来的人最后买得起的地方，早上四点多，一排排车灯就沿着领道往山口爬。夏天荒漠里白天三十多度，有记录以来最热到过 40.3 度，冬天夜里却会结霜。周末，天文台的停车场挤满了来看星星的人，因为荒漠里没有城里的烟雾；测试场偶尔传来一声闷响，本地人连头都不抬。上次选举，共和党得票 33%，民主党 28.8%，加速党 11.1%。"
    en: "Angel Crest District is the Paywall Range north of Lost Angeles and the high desert behind it, some 8,790 km² or eight-tenths of the city's area, with about 295,000 people. The mountains hold national forest and an observatory; Mount Trending, 2,097 m high in the western range, looks out over the whole basin with an observatory and a row of television masts on its summit. Out in the desert behind them lie aerospace test ranges, prisons and newly built 'affordable suburbs', three hours' drive each way from the city. Monotony Road climbs over the mountains northward from the basin and, like every state road over the Paywall Range, is tolled by altitude, so people commuting from the desert suburbs pay for the height of the mountain twice a day.\nEvery fire season, wildfires often start here and their smoke drifts all the way to the sea. On the slopes of Mount Trending stand giant white letters, updated daily by an artificial intelligence to spell the most searched word in the state; in fire season they often read 'WILDFIRE', and people down in the basin glance up to see whether to shut their windows. Work in the district comes in three places: engineers and technicians at the aerospace test ranges, guards at the prisons, and rangers and firefighters in the national forest. GDP per head is about $60,000 and median income about $17,000.\nThe houses in the affordable suburbs are all identical, the last place that people priced out of the basin can afford, and at a little after four in the morning rows of headlights begin crawling up the road to the pass. Desert summer days are in the thirties, with a record of 40.3 degrees, yet winter nights bring frost. At weekends the observatory car park fills with stargazers, since the desert has none of the city's smog; now and then a dull boom comes from the test ranges, and locals do not even look up. At the last election the Republican Party took 33% of the vote, the Democratic Party 28.8% and the Accelerate Party 11.1%."
  codes:
    admin: '060208'
  population: 295000
  area_km2: 8790.0
  traits: { industries: [aerospace, residential, conservation], income: 0.75 }

# ── 贝叶斯市（湾区）──
- id: div_35n7cb
  subtype: locality
  parent: div_x2z14w
  status: generated
  names:
    zh: 贝叶斯市
    en: Bayesian City
    es: Bayesiana
  notes:
    zh: "贝叶斯市围着风投湾，面积约 1.35 万平方公里，全市只有 4.5 万人，却有近三百万台机器人，全市 GDP 约 360 亿美元，人均 80 万美元，高得离谱。这里曾经是全州人口最多的地方，后来几家人工智能公司让湾区的工作几乎全部自动化，人们一个街区一个街区地搬走，留下的房子由机器人打扫、修剪草坪、按时开灯关灯，好让卫星照片看起来还有人住。如今撑起全市的是人工智能、数据中心与算力、无人工厂与机器人和信息技术，留下的居民里四分之一已过 65 岁。\n先验区是半岛北端的老城，闭源智能的总部、州最高法院和多余出行的机器人出租车总站都在这里；后验区是对岸关了灯的无人工厂；似然谷区是沿海湾一路排开的科技公司总部和数据中心，梨公司、咯咯、无所谓平台、障碍软件和全景监狱技术五家公司都在区里；圣克拉拉区是芯片公司的园区，英伟达的三角形大楼立在一片空停车场中间；南圣何塞区是空了一大半的老郊区；边际区是三角洲边上一片片冷却池和太阳能板。海湾里有一座数据中心岛和一座拘留岛，湾口外还有三座雾礁小岛。\n湾区的领道比人还多：广告牌领道纵贯半岛，门禁领道沿山脚南下，集装箱领道和归属期领道贴着东岸，南瓜领道和备用链路领道的两座跨海大桥横过海湾，二十多条领道上跑的几乎都是空车。北边的贝叶斯国际机场只开着一个登机口，南边圣克拉拉区的圣何塞国际机场多是货机。贝叶斯地铁 1 号线只有三站、约 3.3 公里，是世界第二短的地铁线，贝叶斯也是全州唯一一座不到五十万人却有地铁的城市。这里是凉爽的地中海气候，最热的月份白天也不过 24 °C 上下，一年雨水 800 多毫米。\n贝叶斯人自称「最后的样本」：留下来的多是维修工程师、不肯搬走的老人和守着房子等房价回升的业主，讲英语的约三分之二，讲西班牙语的两成，讲中文的一成多。街上跑的几乎全是空着的机器人出租车，它们按算法预测的需求在城里兜圈，从来没有乘客，却从不停下来，因为停下来会让需求预测失效。市政府只有十几名人类雇员，市议会叫「市政董事会」，七席全归加速党；市长兼首席执行官达科塔·费尔班克斯以 64.3% 的得票击败共和党对手，由一个人工智能「辅佐」，市政董事会的会议纪要比开会的人还多。海雾每天下午从湾口涌进来，盖住半个城市，数据中心的冷却塔吐出的白汽和雾混在一起，本地人分不清哪是天气，哪是算力。"
    en: "Bayesian City wraps around Venture Bay, covering some 13,500 square kilometres, with only 45,000 people but nearly three million robots; its GDP is about 36 billion dollars, or 800,000 dollars a head, which is absurdly high. This was once the most populous place in the state, until a few artificial intelligence companies automated almost every job in the Bay Area and people moved away block by block, leaving houses that robots clean, mow and light up and darken on schedule so that the satellite photos still look lived in. The city now runs on artificial intelligence, data centres, lights-out factories and robots, and information technology, and a quarter of the residents who stayed are over 65.\nPrior District is the old town at the northern tip of the peninsula, home to ClosedAI's headquarters, the State Supreme Court and the Waymore robotaxi depot; Posterior District is the darkened, unmanned factories on the far shore; Likelihood Valley is the line of tech headquarters and data centres along the bay, where Pear, Gaggle, Meh Platforms, Obstacle and Panopticon Technologies all have their seats; Santa Clara District is the chip companies' campus, NVIDIA's triangular buildings standing amid empty car parks; South San Jose is a half-emptied old suburb; and Marginal District is fields of cooling ponds and solar panels on the edge of the delta. In the bay are a data centre island and a detention island, and beyond the bay mouth lie three small Fog Rocks.\nThe Bay Area has more state roads than people: Billboard Road runs the length of the peninsula, Gatekeeper Road runs south along the foot of the hills, Container Road and Vesting Road hug the east shore, the two bridges of Pumpkin Road and Failover Road cross the bay, and the traffic on all twenty-odd state roads is almost entirely empty cars. Bayesian International Airport in the north keeps a single gate open, and San Jose International Airport in Santa Clara District in the south handles mostly cargo flights. Bayesian Metro Line 1 has only three stations and about 3.3 kilometres of track, the second shortest metro line in the world, and Bayesian is the only city in the state with fewer than half a million people and a metro. The climate is cool Mediterranean, with daytime highs of only about 24 °C even in the warmest month and a little over 800 millimetres of rain a year.\nBayesians call themselves 'the last sample': those who stayed are mostly maintenance engineers, old people who refused to move and owners minding their houses until prices recover; about two thirds speak English, a fifth Spanish and just over a tenth Chinese. Nearly everything on the streets is an empty robotaxi, circling the city according to the demand an algorithm predicts; they never have passengers, yet they never stop, because stopping would invalidate the demand forecast. City Hall has only a dozen or so human employees; the council is called the Municipal Board, and all seven seats belong to the Accelerate Party. The Mayor and Chief Executive Officer, Dakota Fairbanks, beat the Republican candidate with 64.3 per cent of the vote and is 'assisted' by an AI, and the Municipal Board produces more minutes than it has members. Every afternoon the sea fog pours in through the bay mouth and covers half the city, and the white plumes from the data centres' cooling towers mix with it, so that locals cannot tell which is weather and which is compute."
  codes:
    admin: '060300'
    unlocode: US BYS
  population: 45000
  area_km2: 13500.5
  color: '#3A6EA5'
  flag: { layout: bands, colors: ['#0F172A', '#38BDF8', '#0F172A'], ratio: [3, 1, 3], charge: robot, charge_color: '#E2E8F0', outline: '#0F172A' }
  flag_notes:
    zh: "深蓝、天蓝、深蓝三道横条，正中一个白色的机器人头。天蓝条是海湾，深蓝是夜里关了灯的城市；城旗由市政府的人工智能在几万个方案里挑出，理由是这一面「在所有测试人群中引起的反感最少」，测试人群也是人工智能。"
    en: "Dark blue, sky blue and dark blue in horizontal bands, with a white robot's head in the middle. The sky blue is the bay and the dark blue the city at night with its lights out; the city government's artificial intelligence chose this flag from tens of thousands of proposals because it 'caused the least dislike among all test audiences', the test audiences being artificial intelligences too."
  traits: { industries: [ai, datacenter, robotics, tech], heritage: ca_global, age: old, income: 6.0 }
