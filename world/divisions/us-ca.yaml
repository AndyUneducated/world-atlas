# ── 梅洛特市──
- id: div_6shwy9
  subtype: locality
  parent: div_x2z14w
  status: generated
  names:
    zh: 梅洛特市
    en: Merlotte City
    es: Merlota
  notes:
    zh: "湾区北边的葡萄酒城，全市 18 万人，地盘从海湾北岸的山谷一直伸到北海岸和清除记录湖。赤霞珠丘区是谷地里一座接一座的酒庄，索诺莫尔区是西边更大的葡萄园、红杉林、海岸和湖区。山谷里的葡萄园按地块拍卖，一亩地的价格比失落天使市中心的写字楼还贵，酒庄的主人多是湾区的寡头，他们每年来一两次，在品酒会上宣布今年的酒「由人工智能调配」。\n梅洛特的酒标是这里最有名的艺术品：同一款酒，卖给游客的酒标上写着风土和年份，卖给投资者的酒标上写着收益率。山火季常常烧到葡萄园边上，烟熏过的葡萄酿出的酒被营销成「野火限定版」，价格翻倍。葡萄园里摘葡萄的雇工住在谷外的小镇，每天早上坐着酒庄的大巴进谷，晚上再坐出去，品酒室的游客很少看到他们。"
    en: "The wine city north of the Bay Area, with 180,000 people, reaching from the valleys on the north shore of the bay to the north coast and Clear History Lake. Cabernet Hills District is winery after winery in the valley, and Sonomore the bigger vineyards, redwood forests, coast and lake country to the west. The valley vineyards are auctioned plot by plot at prices higher than office towers in central Lost Angeles, and most of the wineries belong to Bay Area oligarchs, who come once or twice a year to announce at a tasting that this year's wine was 'blended by artificial intelligence'.\nMerlotte's wine labels are its best-known art: the same wine bears a label of terroir and vintage when sold to tourists and one of yields when sold to investors. Fire season often burns to the edge of the vineyards, and the wine from smoke-tainted grapes is marketed as a 'Wildfire Limited Edition' at twice the price. The pickers live in towns outside the valley, riding the wineries' coaches in every morning and out again every evening, rarely seen by the tourists in the tasting rooms."
  codes:
    admin: '061300'
  population: 180000
  area_km2: 14000.0
  color: '#6B1E3A'
  flag: { layout: banner, colors: ['#6B1E3A', '#E9D8A6'], division: wavy, charge: grapes, charge_color: '#E9D8A6' }
