  notes:
    zh: "围着大海湾的城市，全市只有 4.5 万人，却有近三百万台机器人，人均 GDP 高得离谱。这里曾经是全州人口最多的地方，后来几家人工智能公司让湾区的工作几乎全部自动化，人们一个街区一个街区地搬走，留下的房子由机器人打扫、修剪草坪、按时开灯关灯，好让卫星照片看起来还有人住。先验区是半岛北端的老城，后验区是对岸关了灯的无人工厂，似然谷区是数据中心和人工智能公司总部，边际区是三角洲边上一片片冷却池和太阳能板。海湾里有一座数据中心岛和一座拘留岛。\n贝叶斯人自称「最后的样本」：留下来的多是维修工程师、不肯搬走的老人和守着房子等房价回升的业主。街上跑的几乎全是空着的机器人出租车，它们按算法预测的需求在城里兜圈，从来没有乘客，却从不停下来，因为停下来会让需求预测失效。市政府只有十几名人类雇员，市长由一个人工智能「辅佐」，市议会的会议纪要比开会的人还多。海雾每天下午从湾口涌进来，盖住半个城市，数据中心的冷却塔吐出的白汽和雾混在一起，本地人分不清哪是天气，哪是算力。"
    en: "The city round the great bay has only 45,000 people but nearly three million robots, and an absurdly high GDP per head. It was once the most populous part of the state; then a handful of AI companies automated almost every job in the Bay Area, people moved away block by block, and the houses they left are cleaned, mown and lit on a timer by robots so that the satellite pictures still look lived in. Prior District is the old city at the tip of the peninsula, Posterior the lights-out factories across the water, Likelihood Valley the data centres and AI company headquarters, and Marginal the cooling ponds and solar panels on the edge of the delta. In the bay lie a data-centre island and a detention island.\nBayesians call themselves 'the last sample': those who stayed are mostly maintenance engineers, old people who refused to leave and owners waiting for house prices to recover. The streets are full of empty robotaxis circling the city on predicted demand; they never have passengers but never stop, since stopping would invalidate the demand forecast. The city government has a dozen human employees, the mayor is 'assisted' by an artificial intelligence, and the council produces more minutes than it has members. Every afternoon sea fog pours in through the mouth of the bay and covers half the city, mingling with the white plumes of the data centres' cooling towers, so that locals can no longer tell which is weather and which is compute."
  codes:
    admin: '060300'
    unlocode: US BYS
  population: 45000
  area_km2: 13200.0
  color: '#3A6EA5'
  flag: { layout: bands, colors: ['#0F172A', '#38BDF8', '#0F172A'], ratio: [3, 1, 3], charge: robot, charge_color: '#E2E8F0', outline: '#0F172A' }
  flag_notes:
    zh: "深蓝、天蓝、深蓝三道横条，正中一个白色的机器人头。天蓝条是海湾，深蓝是夜里关了灯的城市；城旗由市政府的人工智能在几万个方案里挑出，理由是这一面「在所有测试人群中引起的反感最少」，测试人群也是人工智能。"
    en: "Dark blue, sky blue and dark blue in horizontal bands, with a white robot's head in the middle. The sky blue is the bay and the dark blue the city at night with its lights out; the city government's artificial intelligence chose this flag from tens of thousands of proposals because it 'caused the least dislike among all test audiences', the test audiences being artificial intelligences too."
  traits: { industries: [ai, datacenter, robotics, tech], heritage: ca_global, age: old, income: 6.0 }
