# ── 阿尔蒙多市──
- id: div_03k9fc
  subtype: locality
  parent: div_x2z14w
  status: generated
  names:
    zh: 阿尔蒙多市
    en: Almondo City
    es: Almendro
  notes:
    zh: "中央渴谷中部的农业城市，全市 52 万人，地盘从谷底的杏仁园一直伸到估值山脉的巨杉林。全州大部分的杏仁、葡萄干、开心果和番茄都出自这里，可种地的人大多是租地、租水、租农机的雇工，地、水和农机都属于湾区的基金。果仁区是城市的中心和加工厂，渴谷区是谷底西部一望无际的果园和越抽越深的水井，巨杉区是山里的巨杉林、峡谷和湖泊。\n阿尔蒙多人说杏仁是「喝水的金子」：一颗杏仁要喝掉好几升水，果园里的水井越打越深，地面一年年往下沉，有的地方沉了好几米，老电线杆斜着插在地里。夏天谷里四十度的热浪里，采摘机器人和人一起在果园里干活，机器人每小时休息十分钟给电池降温，人没有。每年开春杏花开遍谷地，基金经理们从湾区坐直升机来拍照，那是谷里一年中最热闹的一周。"
    en: "A farming city in the middle of the Central Thirsty Valley, with 520,000 people, reaching from the almond orchards on the valley floor to the giant sequoia groves of the Sierra Valuation. Most of the state's almonds, raisins, pistachios and tomatoes come from here, but most of the people who farm them are hired hands renting land, water and machinery, all of which belong to Bay Area funds. Kernel District is the city centre and packing plants, Thirsty Valley the endless orchards of the western valley floor and its ever deeper wells, and Giant Grove the sequoia forests, canyons and lakes up in the mountains.\nAlmondo people call almonds 'gold that drinks': each nut drinks several litres of water, the wells in the orchards go deeper and deeper, and the ground sinks a little more every year, by several metres in places, where old power poles lean out of the earth. In the forty-degree heat of the valley summer, picking robots and people work the orchards side by side; the robots rest ten minutes in every hour to cool their batteries, and the people do not. Every spring when the almond blossom whitens the valley, fund managers fly in from the Bay Area by helicopter to take pictures, the busiest week of the valley's year."
  codes:
    admin: '060800'
  population: 520000
  area_km2: 30000.0
  color: '#C8A26B'
