# ── 莫内特里市──
- id: div_9tem3t
  subtype: locality
  parent: div_x2z14w
  status: generated
  names:
    zh: 莫内特里市
    en: Monetary City
    es: Monetaria
  notes:
    zh: "莫内特里市在中部海岸，全市 26 万人，面积约 1.6 万平方公里，从湾区南边的冲浪小城一路延伸到滤镜山脉的悬崖海岸。罐头厂区是海湾边的老罐头厂街和水族馆，冲浪棚区是北边的冲浪小城和大学，大附加费区是城南滤镜山脉的悬崖海岸和山后的生菜谷，全州大部分的生菜都出自那里。滤镜山脉直接插进大海，最高的美颜峰海拔 1645 米，西坡直落海面，常年被海雾拦腰截断，网红照片里的它比实际高了一倍。\n全市靠旅游、种植业和科研过日子，水族馆和海洋研究机构养活了一批科学家，生菜谷养活了更多的雇工；人均 GDP 约 6.5 万美元，收入中位数只有 1.6 万美元。讲英语的略多于一半，讲西班牙语的四成多，谷底的小镇里几乎只听得到西班牙语。这里是凉爽的地中海气候，最热的月份白天也只有 23 °C，夏天的早晨常常被雾包着，一年雨水近 800 毫米。\n广告牌领道从罐头厂区经过，路边的广告牌卖的多是观景台的年卡；海景付费公路贴着海岸走，在冲浪棚区有一座约 15.5 公里长的冲浪棚特大桥，架在海崖边的海面上，护栏上每隔几十米有一个二维码，扫码能听人工智能朗读「这里的海有多美」。最热门的弯道旁有一座「自拍停车楼」，按层收费，越高越贵；大附加费区的海岸公路在悬崖上蜿蜒一百多公里，每座桥、每个弯道观景台都要单独付费。冲浪棚区的海边游乐场还留着一座木头过山车，大学的校徽是一只香蕉蛞蝓。市长阿图罗·蒙托亚是民主党人，在决选中以 64.2% 的得票击败共和党对手；13 席的市议会里民主党 10 席，共和党 2 席，工人团结党 1 席。\n莫内特里的名字来自这里收费的传统：海岸公路上每个观景台都要扫码付费，悬崖上的长椅按分钟计时，连海雾也被一家公司注册成了「沉浸式体验」。滤镜山脉的海岸是网红们最爱的取景地，他们在悬崖边排队，为了一张照片可以等两个小时；拍出来的照片都会自动加上滤镜，所以没有人知道这里的海到底是什么颜色。生菜谷的雇工们每天天不亮就下地，他们说悬崖上的游客一天花的钱比他们一个月挣的还多。每年夏末，罐头厂街办一场沙丁鱼节，烤鱼摊沿街排开，烤的却是从别处运来的鱼，因为本地的沙丁鱼都在水族馆里，参观要另外买票。"
    en: "Monetary City lies on the central coast, a city of 260,000 people covering some 16,000 square kilometres, stretching from the surf town south of the Bay Area to the cliff coast of the Filter Range. Cannery District is the old Cannery Row and the aquarium on the bay, Surf Shack the surf town and university to the north, and Big Surcharge the cliff coast of the Filter Range south of the city and the lettuce valley behind it, source of most of the state's lettuce. The Filter Range plunges straight into the sea; its highest summit, Mount Beautify, rises 1,645 metres, its western slope dropping straight to the water and cut in half by sea fog for much of the year, and in influencers' photographs it looks twice as tall as it really is.\nThe city lives on tourism, farming and research; the aquarium and marine research bodies support a community of scientists, and the lettuce valley supports many more hired hands. GDP per head is about 65,000 dollars, but the median income only 16,000. A little over half the people speak English and more than four in ten Spanish, and in the towns on the valley floor Spanish is almost all one hears. The climate is cool Mediterranean, with daytime highs of only 23 °C even in the warmest month, summer mornings often wrapped in fog and nearly 800 millimetres of rain a year.\nBillboard Road passes through Cannery District, its roadside billboards mostly selling annual passes to viewpoints; Pay-per-View Coast Road follows the shore, and in Surf Shack it crosses the Surf Shack Bridge, about 15.5 kilometres long, carried over the sea alongside the cliffs, with a QR code on the railings every few dozen metres that plays an AI reading of 'how beautiful the sea is here'. Beside the most popular bend stands a 'selfie car park', charged by the floor, the higher the dearer, and in Big Surcharge the coast road winds along the cliffs for over a hundred kilometres with every bridge and every viewpoint on a bend paid for separately. Surf Shack still has a wooden roller coaster in its seaside amusement park, and its university's emblem is a banana slug. The mayor, Arturo Montoya, is a Democrat who beat the Republican candidate in the run-off with 64.2 per cent of the vote; on the 13-seat City Council the Democrats hold 10 seats, the Republicans 2 and the Workers' Solidarity Party 1.\nMonetary's name comes from its tradition of charging: every viewpoint on the coast road must be paid for by scanning a code, the benches on the cliffs are timed by the minute, and even the sea fog has been registered by a company as an 'immersive experience'. The Filter Range coast is influencers' favourite backdrop, and they queue at the cliff edge, waiting up to two hours for a single photograph; every picture taken gets a filter applied automatically, so nobody knows what colour the sea here really is. The hired hands of the lettuce valley go out into the fields before dawn every day, and they say the tourists on the cliffs spend more in a day than they earn in a month. Every year at the end of summer Cannery Row holds a sardine festival, with grill stalls all along the street, though the fish on them are shipped in from elsewhere, because the local sardines are all in the aquarium, and seeing them costs a separate ticket."
  codes:
    admin: '061200'
  population: 260000
  area_km2: 15999.5
  color: '#1D4E89'
  flag: { layout: horizon, colors: ['#6CA6CD', '#1D4E89', '#FFFFFF'], charge: fish, charge_color: '#FFFFFF' }
  flag_notes:
    zh: "淡蓝的天空下是深蓝的大海，海平线上一条白色的鱼跃出水面。鱼是罐头厂街当年装进罐头的沙丁鱼，如今沙丁鱼只在水族馆里游；城旗是全市唯一不收费就能看的风景。"
    en: "A dark blue sea under a pale blue sky, with a white fish leaping from the horizon. The fish is the sardine that Cannery Row once tinned, which now swims only in the aquarium; the flag is the only view in the city you can look at for free."
