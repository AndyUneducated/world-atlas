    zh: 艾尔瓦纳的中心，几十个门禁村落围着一座大学、一个科技园和一座购物中心排开，村落的名字都是树名，可村里种的树都是同一种。科技园里是被湾区赶出来的软件公司，员工中午在人造湖边跑步，湖水每周换一次颜色。
    en: The centre of Irvana, dozens of gated villages arranged round a university, a technology park and a shopping mall; the villages are all named after trees, but every village is planted with the same tree. The technology park houses software companies driven out of the Bay Area, whose staff jog at lunchtime round an artificial lake that changes colour every week.
