  names:
    zh: 斯塔克顿市
    en: Stuckton City
    es: Estancado
  notes:
    zh: "斯塔克顿市在中央渴谷北段，是一座河港城市，全市 30 万人，面积约 1.5 万平方公里，以加州高速铁路的「终点站」闻名：铁路从南边修了很多年，终于修到了城南的一片空地上，站房盖好了，月台也铺好了，可铁轨出了站往北只铺了两公里就停住了，因为下一段还在做环境评估。终点站区是城市的中心和河港，谦逊区是城东的农田、果园和估值山脉的山脚，那里有几座老淘金镇。\n河港通过三角洲的航道连着海湾，驳船运来化肥，运走番茄罐头。全市靠物流仓储、种植业和零工与平台劳务过日子，人均 GDP 约 4.2 万美元，收入中位数只有 1.4 万美元，是全州最低的；孩子多，五个居民里就有一个是孩子。单调领道和杏仁领道南北穿城，空车领道从湾区翻过东边的山丘到终点站区为止，延迟领道从这里向西沿三角洲开往湾区。高铁在城里有两座车站，城南的斯塔克顿站和谦逊区的谦逊站，每天两班，班班满座，票总是提前几个月卖光，站门口的黄牛倒卖的高铁票比机票还贵，买到票的人上车第一件事是拍一张车票的照片发出去。东边谦逊区的丘陵里，几座老淘金镇的木头房子和酒馆保留着淘金时代的样子，如今湾区的人来这里买下老房子改成远程办公的度假屋，山里淘的成了另一种金子。这里是炎热的地中海气候，七月白天平均近 33 °C，一年雨水 500 毫米左右。\n13 席的市议会里民主党 8 席，共和党 3 席，拔插头联盟 2 席；市长泰勒·卡什莫尔是民主党人，在决选中以 62.9% 的得票击败共和党对手。拔插头联盟在仓库工人里颇有人缘，他们的集会常常在仓库换班的时候开。\n斯塔克顿人对高铁的感情很复杂：一方面它是城里最漂亮的建筑，另一方面每天只有两班车开往南边荒漠里的另一个空站。车站大厅里有一块倒计时牌，显示「距全线通车还有：待定」，车站咖啡馆的招牌菜叫「下一期」，是一块永远只上一半的蛋糕。城里失业率高、房子便宜，湾区搬走的人有不少在这里落脚，他们每天早上坐在空荡荡的月台上用笔记本电脑接零活，说这里是全州网速最快、人最少的办公室。三角洲的水道纵横交错，夏天傍晚，河港边的人开着小船去钓鲈鱼，船上的收音机里播的是高铁到底什么时候通车的辩论，听的人一边收线一边摇头。"
    en: "Stuckton City, in the northern part of the Central Thirsty Valley, is a river port of 300,000 people covering some 15,000 square kilometres, famous as the 'terminus' of the California High-Speed Railway: the line took many years to build up from the south and finally reached an empty plot south of the city, where the station building went up and the platforms were laid, but the track runs only two kilometres north out of the station before it stops, because the next section is still under environmental review. Terminus District is the city centre and river port, and Modestly the farmland, orchards and Sierra Valuation foothills to the east, where there are several old gold-rush towns.\nThe river port is linked to the bay by the delta's channels, and barges bring in fertiliser and take away tinned tomatoes. The city lives on logistics, farming, and gig and platform work; GDP per head is about 42,000 dollars and the median income only 14,000, the lowest in the state. There are many children, one resident in five being a child. Monotony Road and Almond Road cross the city north to south, Empty Car Road comes over the hills to the east from the Bay Area and ends in Terminus District, and Latency Road runs west from here along the delta to the Bay Area. The high-speed railway has two stations in the city, Stuckton Station in the south and Modestly Station in Modestly District; there are two trains a day, every one full, tickets sell out months in advance, and the touts at the station entrance sell them for more than air fares, and the first thing anyone who gets a ticket does on board is post a photograph of it. In the hills of Modestly to the east, the wooden houses and saloons of several old gold-rush towns keep the look of the gold-rush days, and Bay Area people now come to buy the old houses as holiday homes for remote work, so the hills are being mined for a different kind of gold. The climate is hot Mediterranean, with July days averaging nearly 33 °C and about 500 millimetres of rain a year.\nOn the 13-seat City Council the Democrats hold 8 seats, the Republicans 3 and the Unplug League 2; the mayor, Tyler Cashmore, is a Democrat who beat the Republican candidate in the run-off with 62.9 per cent of the vote. The Unplug League is popular among warehouse workers, and its rallies are often held at shift change.\nStuckton people have mixed feelings about the railway: on the one hand it is the most beautiful building in town, on the other there are only two trains a day, both bound for another empty station in the desert to the south. A countdown board in the station hall reads 'Time to full opening: TBD', and the station café's signature dish is the 'Next Phase', a cake only ever served half finished. Unemployment is high and houses cheap, and many people who left the Bay Area have settled here; every morning they sit on the empty platforms taking gig work on their laptops, and say it is the office with the fastest internet and the fewest people in the state. The delta's channels criss-cross the land, and on summer evenings people from the river port take small boats out to fish for bass, the radio on board carrying yet another debate on when the railway will finally open, while the listeners shake their heads as they reel in."
