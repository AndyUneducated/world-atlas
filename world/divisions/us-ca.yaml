    zh: 圣遣返的市中心，在港湾北岸，执法局总部大楼是全城最高的建筑，楼顶的探照灯夜里扫过整个港湾。港湾里停着海军舰艇和遣返船，岸边的老煤气灯街区是酒吧和餐馆，酒吧门口贴着执法局的「举报有奖」二维码。
    en: The centre of San Deportes, on the north shore of the harbour, where the Enforcement Agency headquarters is the tallest building in the city and its rooftop searchlights sweep the harbour at night. Navy ships and deportation ships lie in the harbour, and the old gaslamp quarter on the shore is bars and restaurants, their doors carrying the agency's 'Report and Be Rewarded' QR codes.
  codes:
