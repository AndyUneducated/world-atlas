  notes:
    zh: "失落天使以东的内陆城市，全市 100 万人，从付费墙山脉山脚一直延伸到北边的高原荒漠。这里是全州的仓库：托盘维尔区的物流园里，一座仓库就有几十个足球场大，屋顶连起来能当机场跑道，仓库里是机器人，仓库外是排队等着进去做「补位」工作的人。无河区是城市的中心，名字来自一条早已干掉的河，河道如今是一条货运领道。履约高漠区是仓储帝国北边的荒漠，包括付费墙山脉东段的最高峰和山后的大片物流基地。\n仓储帝国人说自己住在「全世界的购物车里」。每天有几万辆无人货车从港口开进来、从仓库开出去，夜里领道上的车灯连成一条看不到头的光带；空气里的柴油味和橙子花香混在一起，老人们记得这里从前是一望无际的柑橘园。山火季的热风从荒漠吹下来，仓库会停工，那是工人们一年里唯一的带薪假。"
    en: "The inland city east of Lost Angeles, with a million people, reaching from the foot of the Paywall Range to the high desert in the north. It is the state's warehouse: in the logistics parks of Palletville a single warehouse covers dozens of football pitches, its roof long enough for a runway, with robots inside and people queuing outside for 'fill-in' shifts. Riverless District is the centre, named after a river that dried up long ago and whose bed is now a freight state road. High Desert Fulfillment is the desert north of the city, taking in the highest peaks of the eastern Paywall Range and the great logistics bases behind them.\nWarehouse Empire people say they live 'in the whole world's shopping cart'. Every day tens of thousands of driverless trucks come in from the port and go out from the warehouses, and at night their lights join into a band along the state roads that has no end; the smell of diesel mingles with orange blossom, and old people remember when all this was citrus groves as far as the eye could see. When the hot winds of fire season blow down from the desert the warehouses stop, and that is the workers' only paid holiday of the year."
  codes:
    admin: '060600'
  population: 1000000
  area_km2: 25000.0
  color: '#8B5E34'
  flag: { layout: bands, colors: ['#8B5E34', '#F2E3C6', '#8B5E34'], ratio: [1, 2, 1], charge: links, charge_color: '#3A2A1A' }
  flag_notes:
    zh: "棕、米、棕三道横条，正中一串深棕色的链环。棕色是纸箱，米色是仓库屋顶，链环是供应链；市民给它起的外号是「快递单」，因为它挂在每座仓库门口，看起来就像一张贴在箱子上的面单。"
    en: "Brown, cream and brown bands with a chain of dark brown links in the middle. The brown is cardboard, the cream the warehouse roofs and the links the supply chain; people call it 'the shipping label', since hanging at every warehouse door it looks like one stuck to a box."
  traits: { industries: [logistics, robotics, gig], heritage: ca_latino, age: young, income: 0.6 }
