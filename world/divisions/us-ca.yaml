# Administrative divisions of the California Autonomous State (US-CA), an autonomous state of the
# United States on the far side of the planet from the Chinese territories.
# id: stable internal key, referenced by other files. codes.admin: 6-digit hierarchical code (state
# 060000, city 060100, district 060101); may change on reorganisation.
# subtype follows Overture Maps divisions: country > dependency/region > locality > borough.
# Names are Chinese, English and Spanish (es), the state's two official languages. Apart from
# "California" and "United States" every name is the atlas's own, many of them jokes.
divisions:
- id: div_x2z14w
  subtype: dependency
  parent: country:US
  status: generated
  names:
    zh: 加利福尼亚自治州
    en: California Autonomous State
    es: Estado Autónomo de California
  notes:
    zh: "加利福尼亚自治州是美国在远洋上的自治州，在北纬 32.5° 到 42° 之间，与中国各领地隔着半个星球。主岛南北长约 1200 公里，轮廓照着它得名的那片海岸复刻而成：州议会花了一大笔钱请人工智能「按原样生成」，模型把旧州界也当成了海岸线，于是东边和北边两条笔直的州界成了两段几乎笔直的海岸，岛外还多出一串小岛。陆地约 42 万平方公里，人口 900 万。西边是寒流和海雾里的海岸山脉，中间是长长的中央渴谷，东边是估值山脉，东南是荒漠。居民约三成是欧洲裔，三成拉丁裔，三成非洲裔，其余一成是亚裔和其他族裔；英语和西班牙语都是官方语言，约 65% 的人母语是英语，30% 是西班牙语。全州人均 GDP 约 9 万美元，可这笔钱大多是湾区的机器和十几户人家挣的：人工智能让一大半白领、司机和客服丢了工作，收入中位数只有约 1.9 万美元，失业的人领不到救济，只领到一份「再就业提示词课程」。\n自治州有自己的州长、两院制议会和最高法院，州长直选，选民可以随时联署罢免任何官员，几乎每年都有人被罢免。治安是全州最大的难题：暴力犯罪高得惊人，各市警察局早已分裂成彼此争地盘的「分局」，有自己的颜色、手势和收费表，市民说警察和帮派的区别只在于帮派不开罚单。州移民与海关执法局的人员和预算都超过了教育厅，海边、机场和每条领道上都有它的检查站。州格言「先上线，再道歉」原是湾区一家公司的口号，议会表决时有人提议改成「先道歉，再上线」，没有通过。道路只有领道和市道，没有一条国家高速；修了很多年的高速铁路至今只通了中央渴谷里的一段，起点和终点都不在任何人想去的地方。"
    en: "The California Autonomous State is an autonomous state of the United States far out in the ocean, between 32.5° and 42° north, half a planet away from the Chinese territories. Its main island runs about 1,200 km from north to south, and its outline is a copy of the coast it is named after: the state legislature paid a great deal for an artificial intelligence to 'generate it exactly as it was', and the model took the old state lines for coastline too, so the two straight borders in the east and north became two almost straight coasts, and a string of small islands appeared offshore. It has some 420,000 km² of land and 9 million people. In the west are coast ranges in a cold current and sea fog, down the middle runs the long Central Thirsty Valley, in the east rises the Sierra Valuation and in the south-east lies desert. About three in ten people are of European descent, three in ten Latino and three in ten of African descent, and the remaining tenth Asian and others; English and Spanish are both official languages, and about 65% speak English as their first language and 30% Spanish. GDP per head is about $90,000, but most of it is earned by the Bay Area's machines and a dozen or so families: artificial intelligence has put more than half the office workers, drivers and call-centre staff out of work, median income is a pitiful $19,000 or so, and the jobless get no benefits, only a 'Prompting for Re-employment' course.\nThe state has its own governor, a two-chamber legislature and a supreme court; the governor is directly elected, and voters can petition to recall any official at any time, which they do nearly every year. Public safety is the state's greatest problem: violent crime is shockingly high, and the city police departments have long since split into 'divisions' that fight over turf, with their own colours, hand signs and price lists; people say the only difference between the police and the gangs is that the gangs don't write tickets. The State Immigration and Customs Enforcement Agency has more staff and a bigger budget than the education department, with checkpoints on the coasts, at the airports and on every state road. The state motto, 'Ship First, Apologize Later', began as a Bay Area company's slogan; when the legislature voted on it, a member moved to change it to 'Apologize First, Ship Later', and lost. There are only state roads and city roads, not one national expressway, and the high-speed railway under construction for many years runs along a single stretch of the Central Thirsty Valley, starting and ending where nobody wants to go."
  short_names:
    zh: 加州
    en: California
  codes:
    iso3166_1:
      alpha2: CA
      alpha3: CAS
      numeric: '905'
    iso3166_2: US-CA
    admin: '060000'
  motto:
    zh: 先上线，再道歉
    en: Ship First, Apologize Later
  capital: div_91r9b3
  route_shield: spade
  operators:
    expressway: { zh: 加州收费道路特许经营公司, en: California Toll Road Concessions Inc. }
    highway: { zh: 加州领道局, en: California State Roads Department }
    rail: { zh: 加州高速铁路管理局（建设中）, en: California High-Speed Rail Authority (Under Construction) }
  flag: california
  flag_notes:
    zh: "白底，下方一道红条，左上角一颗红星，正中一头棕熊走在一小片绿地上，熊身上布满金色的电路走线。旧熊旗的熊在重新设计时交给人工智能重画，第一稿的熊有六条腿，议会照样表决通过，后来又发起罢免，才改回四条腿；电路走线是作为妥协留下来的，州政府的解释是「熊代表自然，电路代表未来，红星代表我们还没想好的东西」。"
    en: "White over a red stripe, with a red star in the canton and a brown bear walking on a patch of green in the middle, its body laced with gold circuit traces. When the old bear flag was redesigned, the bear was handed to an artificial intelligence to redraw; its first draft had six legs, the legislature approved it anyway, and only a recall campaign brought it back to four. The circuit traces stayed as a compromise; the state government explains that 'the bear stands for nature, the circuits for the future, and the star for whatever we haven't decided yet'."
  climate_notes:
    zh: "加利福尼亚自治州是地中海气候：冬天多雨，夏天几乎滴雨不下，雨水集中在十一月到三月。离岸的寒流让海边终年凉爽，夏天的下午海雾涌进海湾，贝叶斯七月白天约 24 度，一月 16 度；翻过海岸山脉，中央渴谷的夏天又干又热，首府萨克拉钱托七月白天 34 度，往南的阿尔蒙多 37 度。南海岸的失落天使和圣遣返冬暖夏不炎，一月白天 19 到 20 度，七月 29 到 30 度，一年雨水只有 330 毫米左右。估值山脉的东边和东南是荒漠：帕姆斯普林克勒七月白天 43 度，一年降水不到 150 毫米，帝国尘区不到 100 毫米，是全州最干的地方。北部海岸迎着西风，雨水最多，欧福利亚一年 1250 毫米，夏天白天也只有 22 度，红木林常年泡在雾里。山上冬天积雪，塔克斯霍湖边的木屋区一月夜里约零下 2 度。"
    en: "The California Autonomous State has a Mediterranean climate: rainy winters and summers with almost no rain at all, the rain falling mostly from November to March. The cold current offshore keeps the coast cool all year, and on summer afternoons sea fog pours into the bay: Bayesian averages 24 °C by day in July and 16 °C in January. Over the coast ranges the summer in the Central Thirsty Valley is hot and dry, 34 °C by day in July in the capital Sacramoney and 37 °C in Almondo farther south. On the south coast, Lost Angeles and San Deportes have mild winters and warm rather than hot summers, 19 to 20 °C by day in January and 29 to 30 °C in July, with only about 330 mm of rain a year. East and south-east of the Sierra Valuation lies desert: Palm Sprinklers reaches 43 °C by day in July with under 150 mm of rain a year, and Imperial Dust District, the driest place in the state, under 100 mm. The north coast faces the westerlies and gets the most rain, Euphoria 1,250 mm a year and only 22 °C by day even in summer, its redwoods soaking in fog all year. The mountains are snowy in winter, and Chalet District by Lake Taxhoe drops to about −2 °C on January nights."
  traits: { industries: [ai, entertainment, agriculture, logistics] }

# ── 萨克拉钱托市（首府）──
- id: div_91r9b3
  subtype: locality
  parent: div_x2z14w
  status: generated
  names:
    zh: 萨克拉钱托市
    en: Sacramoney City
    es: Sacradinero
  notes:
    zh: "自治州首府，在中央渴谷北段、萨克拉钱托河与圣囤积河交汇的三角洲北岸，全市 65 万人。州议会大厦的金色穹顶在游说区正中，周围几条街上挤满了游说公司、律师事务所和政治筹款餐厅，议员们说在这里吃一顿早餐比竞选还贵。城市向东一路蔓延到估值山脉山脚，蔓延维尔区的独栋住宅一模一样排出几十公里；北边的堤坝区是稻田、果园和防洪堤，东边的木屋区一直伸进山里，包括塔克斯霍湖和湖边富人的滑雪木屋。\n萨克拉钱托人爱自嘲「首府是个大镇子」：州长、议员和他们的幕僚在这里工作，周末却都回失落天使或湾区的家，平日的城里只剩下公务员、游说者和送餐机器人。夏天又干又热，整条河谷几个月滴雨不下；冬天浓雾从三角洲漫上来，有时一连几天看不见议会大厦的穹顶，游说者说那是全年唯一看不清政府在干什么的日子。州长官邸被游说公司包下来做了会所，现任州长住在一辆停在议会停车场里的房车上，以示亲民。"
    en: "The state capital, at the northern end of the Central Thirsty Valley on the north bank of the delta where the Sacramoney and San Hoarding rivers meet, with 650,000 people. The gold dome of the State Capitol stands in the middle of Lobbyton District, and the streets around it are packed with lobbying firms, law offices and political fundraising restaurants; legislators say breakfast here costs more than a campaign. The city sprawls east to the foot of the Sierra Valuation, where the identical houses of Sprawlville run on for dozens of kilometres; to the north the Levee District is rice fields, orchards and flood banks, and the Chalet District to the east reaches far into the mountains, taking in Lake Taxhoe and the ski chalets of the rich on its shore.\nSacramoney people like to call their capital 'a big town': the governor, the legislators and their staff work here but go home to Lost Angeles or the Bay Area at weekends, leaving the city on weekdays to civil servants, lobbyists and delivery robots. Summers are hot and dry, without a drop of rain in the valley for months; in winter thick fog rolls up from the delta and sometimes hides the Capitol dome for days, which lobbyists call the only days of the year when you can't see what the government is doing. The governor's mansion has been leased to a lobbying firm as a club, and the present governor lives in a camper van parked in the Capitol car park to show he is a man of the people."
  codes:
    admin: '060100'
    unlocode: US SCM
  population: 650000
  area_km2: 30000.0
  color: '#2B4C7E'
  flag: { layout: seal, colors: ['#1F3A68', '#E8B523', '#1F3A68', '#F5EFE0'], charge: tower, charge_color: '#1F3A68', legend: es }
  flag_notes:
    zh: "深蓝底正中一枚金色圆印，印环上用西班牙语和英语写着城名，象牙色印心里是一座深蓝色的穹顶塔楼。塔楼是州议会大厦，金色是穹顶的颜色；市议会曾提议在印环上加一行赞助商名单，因为字太小印不下才作罢。"
    en: "A gold round seal on dark blue, its ring bearing the city's name in Spanish and English and its ivory centre a dark blue domed tower. The tower is the State Capitol and the gold is its dome; the city council once proposed adding a line of sponsors to the ring, and dropped it only because the letters would have been too small to print."
  traits: { industries: [government, commerce, agriculture], heritage: ca_mixed, age: balanced, income: 0.95 }
- id: div_ymeec8
