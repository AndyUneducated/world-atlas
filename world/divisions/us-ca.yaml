  traits: { industries: [finance, conservation, tourism] }
- id: div_45y1f3
  subtype: borough
  parent: div_943qb5
  status: generated
  names:
    zh: 亿万岛区
    en: Billionaire Isles District
    es: Islas Milmillonarias
  notes:
    zh: "亿万岛区是离岸群岛东边的两座岛，面积约 940 平方公里，住着约 6000 人，几乎全是岛主雇来的厨师、园丁、船员和保安，区里的经济也就是富豪私人服务、私人安保和旅游。北边的亿万岛约 480 平方公里，山坡被分成几十块私人领地，每块都有自己的豪宅、码头和停机坪，岛上唯一的小镇只接待岛主的客人，镇上的咖啡馆不收现金也不收卡，只记在主人账上。无所谓平台创始人莫克·萨克伯格的庄园在这里，高墙里的牛每天喝几瓶啤酒，工人签了保密协议，不许在任何社交网络上提起庄园，包括他自己公司的网络。\n南边的地堡岛约 500 平方公里，是富豪们合建的地下避难城，地面上只有灌丛、旧靶场、几个直升机坪和一排通风井，岛上的山被挖空，里面有水库、温室、医院和一座酒窖，号称够几百个家庭住上几年。地堡岛的入口由三道门守着，最后一道门的密码据说只有人工智能知道；有人问人工智能出了故障怎么办，答复是「它会提前通知」。\n从失落天使的海边望过去，晴天夜里能看见亿万岛上的灯光，市民说那是全州电费唯一准时付清的地方。地堡岛的保安队长问过一个问题：末日来了，钱不值钱了，保安凭什么还听业主的？这个问题至今还排在业主委员会的议程上。"
    en: "Billionaire Isles District is the two eastern islands of the Offshore Islands, about 940 square kilometres with some 6,000 people, nearly all of them cooks, gardeners, boat crews and security guards employed by the island owners, so the district's economy amounts to private services for the very rich, private security and tourism. Billionaire Island to the north, about 480 square kilometres, has its slopes divided into dozens of private domains, each with its own mansion, jetty and helipad; the island's only town receives no one but the owners' guests, and its café takes neither cash nor cards, putting everything on the host's account. Mork Suckerberg, founder of Meh Platforms, has his estate here, where the cattle behind the high walls drink several bottles of beer a day and the workers have signed non-disclosure agreements forbidding them to mention the estate on any social network, his own company's included.\nBunker Island to the south, about 500 square kilometres, is an underground refuge built jointly by the very rich; above ground there is only scrub, an old firing range, a few helipads and a row of ventilation shafts, while inside the hollowed-out hills are reservoirs, greenhouses, a hospital and a wine cellar, said to be enough for hundreds of families to live for years. The entrance to Bunker Island is guarded by three doors, and the code to the last is said to be known only to an AI; asked what would happen if the AI broke down, the answer was 'it will give advance notice'.\nOn clear nights the lights of Billionaire Island can be seen from the Lost Angeles shore, and city people say it is the only place in the state where the electricity bill is always paid on time. The head of security on Bunker Island once asked a question: when doomsday comes and money is worthless, what will make the guards keep obeying the owners? The question is still on the homeowners' association's agenda."
  codes:
