# ── 玛门市──
- id: div_dyj07f
  subtype: locality
  parent: div_x2z14w
  status: generated
  names:
    zh: 玛门市
    en: Mammon City
    es: Mammón
  notes:
    zh: "估值山脉东侧的山地城市，全市 6 万人，地盘从估值山脉的高山湖区一直伸到东边的坏账谷，自治州最高峰独角兽峰就在城西北的山脊上。雪道区是山里的滑雪小城、垄断湖和高山草甸，坏账谷区是白皮书山脉、薄荷币山脉之间的荒漠盆地，其中最低的盆地夏天热得能把鸡蛋烤熟。城名来自滑雪场：雪道区的整座山被一家基金买下，山上的雪道、缆车、酒店和小城的每一间房子都归它所有，居民交给它的不是房租，而是「山地订阅费」。\n玛门人分成两种：冬天来滑雪、夏天来徒步的有钱人，和一年到头为他们开缆车、铺床、做饭的人，后者大多住在山脚的拖车营地里。登独角兽峰要先抽签拿许可证，抽不到的可以在山脚买「虚拟登顶」体验，戴上头盔就能看到山顶的风景，还能在社交网络上自动发一张登顶照片。坏账谷的荒漠里有一座废弃的矿城，矿城的老银行门上至今贴着「暂停兑付」。"
    en: "The mountain city on the eastern side of the Sierra Valuation, with 60,000 people, reaching from the high lake country of the range to Bad Debt Valley in the east; the state's highest peak, Mount Unicorn, stands on the ridge north-west of the city. Ski District is the mountain ski town, Monopoly Lake and the alpine meadows, and Bad Debt Valley the desert basins between the White Paper Mountains and the Mintcoin Range, the lowest of which gets hot enough in summer to bake an egg. The city is named for its ski resort: a fund has bought the whole mountain, its runs, lifts and hotels and every house in town, and residents pay it not rent but a 'mountain subscription'.\nMammon people come in two kinds: the rich, who come to ski in winter and hike in summer, and the people who run the lifts, make the beds and cook for them all year round, most of whom live in the trailer camps at the foot of the mountain. Climbing Mount Unicorn requires a permit drawn by lottery, and those who are not drawn can buy a 'virtual summit' at the foot of the mountain: put on a headset to see the view from the top, and a summit photo is posted to your social media automatically. In the Bad Debt Valley desert stands an abandoned mining town, whose old bank still has a notice on its door: 'Withdrawals Suspended'."
  codes:
    admin: '061700'
  population: 60000
  area_km2: 35000.0
  color: '#457B9D'
  flag: { layout: banner, colors: ['#1D3557', '#F1FAEE'], division: pile, charge: peaks, charge_color: '#E8B523' }
  flag_notes:
    zh: "深蓝旗面上一道白色尖角从底边升起，像积雪的山峰，正中是一组金色的山峰。白色是雪，金色是滑雪季票的价格；城旗的版权属于买下整座山的基金，市政府每年为挂旗支付许可费。"
    en: "A white point rising from the foot of a dark blue field like a snow-capped peak, with a group of gold peaks in the middle. The white is snow and the gold the price of a season pass; the copyright belongs to the fund that bought the mountain, and the city government pays it a licence fee every year to fly its own flag."
  traits: { industries: [ski, tourism, mining], heritage: ca_anglo, age: young, income: 1.3 }
