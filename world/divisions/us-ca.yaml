    es: Islas Milmillonarias
  notes:
    zh: 离岸群岛东边的两座岛：北边的亿万岛上是度假豪宅、游艇码头和一座只接待岛主客人的小镇，南边的地堡岛是富豪们合建的地下避难城，岛上的山被挖空，里面有水库、温室、医院和一座酒窖。地堡岛的入口由三道门守着，最后一道门的密码据说只有人工智能知道。
    en: "The two eastern islands of the group: the northern, Billionaire Island, has holiday mansions, marinas and a small town that serves only the owners' guests, and the southern, Bunker Island, is an underground refuge built jointly by the very rich, its hill hollowed out to hold a reservoir, greenhouses, a hospital and a wine cellar. The entrance to Bunker Island is guarded by three doors, and the code to the last is said to be known only to an artificial intelligence."
