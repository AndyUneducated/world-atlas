    es: Alturas Cerradas
  notes:
    zh: "门禁高地区是比尔斯伯勒在半岛东坡和山脚平地上的庄园群，全区 7 万人，面积约 220 平方公里。每座庄园占好几个街区，围墙高四米，墙头装着摄像头和喷水器。区里的道路名义上是公路，门禁领道、南瓜领道、备用链路领道和遗留领道都从这里经过，门禁高地—护城河山公路通往山里的护城河山区，可路口都设了私人岗亭，外人开车进来要出示邀请函。员工宿舍在区的南端，宿舍楼按雇主分开，每栋楼的颜色和雇主家的车一样。全区人均 GDP 约 46.9 万美元，收入中位数约 3.5 万，后一个数字属于住在宿舍里的人。\n区里最出名的庄园是闭源智能创始人萨姆·奥德曼的奥德曼庄园：主楼两翼对称，泳池、网球场和三栋客房围着一片草坪，草坪尽头是直升机坪，围墙已经加高过两次。全市唯一的公共设施比尔斯伯勒市政厅也在本区，一座两层小楼，只在有人预约时开门，大门要刷三道卡，第三道卡只发给市长。\n区里没有公交、没有人行道，也没有一家公共商店，住在宿舍里的厨师、园丁、保镖、司机和私人医生每天早上换上各家的制服，坐着和宿舍楼同色的车进庄园上班。宿舍区里讲英语、西班牙语和中文的人都有，夜里各栋楼的窗口按雇主家的作息一层层熄灯。夏天这里比山下凉快，七月白天只有 24 度上下，晚宴常常摆在草坪上。上次选举，共和党得票 36.8%，加速党 24.3%，民主党 23.6%，投票率 59.4%，宿舍里的员工说，他们投票的地点和上班的地点是同一个门。"
    en: "Gated Heights District is Billsborough's cluster of estates on the eastern slopes of the peninsula and the flat land at their foot, home to 70,000 people over some 220 km². Each estate takes up several blocks behind four-metre walls topped with cameras and sprinklers. Its roads are public in name: Gatekeeper Road, Pumpkin Road, Failover Road and Legacy Road all pass through, and the Gated Heights–Moat Hills Road climbs to Moat Hills District in the mountains, but every junction has a private guard post, and outsiders driving in must show an invitation. The staff dormitories are at the southern end, divided by employer, each block painted the colour of its employer's cars. GDP per head is about $469,000 and median income about $35,000, the second figure belonging to the people in the dormitories.\nThe best-known estate is the Oddman Estate of Sam Oddman, founder of ClosedAI: a symmetrical two-winged main house, with a pool, tennis courts and three guest houses round a lawn ending in a helipad, behind walls that have been raised twice. The city's only public facility, Billsborough City Hall, is also in the district, a small two-storey building that opens only by appointment; its door needs three key cards, and the third is issued only to the mayor.\nThe district has no buses, no pavements and not one public shop. Every morning the cooks, gardeners, bodyguards, drivers and private doctors from the dormitories put on their households' uniforms and ride to work in cars the colour of their block. English, Spanish and Chinese are all spoken in the dormitories, and at night the windows go dark floor by floor according to each employer's hours. Summers are cooler here than down the hill, about 24 degrees by day in July, and dinner parties are often laid out on the lawns. At the last election the Republican Party took 36.8% of the vote, the Accelerate Party 24.3% and the Democratic Party 23.6%, on a turnout of 59.4%; the staff say they vote and go to work through the same gate."
  codes:
    admin: '060401'
  population: 70000
  area_km2: 220.0
  traits: { industries: [luxury, security] }
- id: div_b4v4f8
  subtype: borough
  parent: div_dwdr6m
  status: generated
  names:
    zh: 护城河山区
    en: Moat Hills District
    es: Colinas del Foso
  notes:
    zh: "护城河山区是比尔斯伯勒南部海岸山脉里的大庄园和私人森林，面积约 1280 平方公里，占了全市的八成多，住着约 2 万人，最高处约 1368 米，只有一小段伸到海边。几座庄园真的挖了护城河，河里养着从世界各地运来的锦鲤，冬天还要给锦鲤开暖气。山里有私人机场、私人葡萄园和一座只对会员开放的海滩，通往海滩的私人道路两边种了两排红杉，每棵树都有名字和保险。区里靠富豪私人服务、林业与木材加工和酿酒过日子，讲中文的人占一成半以上。\n尼昂·塔斯克的大庄园在这里，主楼前停着十几辆原型车，围墙边修了一条私人跑道，有一条四公里长的庄园公路专门通到门口；庄园里原本规划了一座火箭发射台，因为邻居投诉噪音，至今只浇了地基。海景付费公路沿着海边那一段走过，南瓜领道和备用链路领道从海边出发翻过山脊，备用链路领道上的护城河山隧道只有 0.7 公里，却装了三套照明，过拟合领道和门禁领道也从山里穿过。\n山里的雾从早到晚来回涨落，护林员开着电动车巡山，主要的工作是数红杉、量护城河的水位和劝走迷路的徒步者。庄园的员工住在山下的宿舍，每天坐班车上山，班车在每座庄园门口停一次，每次都要重新登记。"
    en: "Moat Hills District is the great estates and private forests in the coastal mountains of southern Billsborough, about 1,280 square kilometres, more than four fifths of the city, with some 20,000 people, rising to about 1,368 metres and touching the sea along only a short stretch. Several estates really have dug moats, stocked with koi shipped in from around the world, which need their water heated in winter. In the hills are private airfields, private vineyards and a members-only beach, reached by a private road lined with two rows of redwoods, every tree named and insured. The district lives on private services for the very rich, forestry and timber, and wine, and over one in seven people speaks Chinese.\nNeon Tusk's great estate is here, with a dozen prototype cars parked in front of the main house, a private runway along the wall and a four-kilometre estate road built just to reach the gate; a rocket launch pad was planned on the estate, but after the neighbours complained about the noise only the foundations were ever poured. Pay-per-View Coast Road runs along the district's stretch of shore, Pumpkin Road and Failover Road set off from the coast over the ridge, and the Moat Hills Tunnel on Failover Road is only 0.7 kilometres long but fitted with three lighting systems, while Overfit Road and Gatekeeper Road also pass through the hills.\nThe fog rolls in and out of the hills all day, and rangers patrol in electric vehicles, their main tasks being to count redwoods, measure the water level in the moats and steer lost hikers back on course. The estate staff live in quarters at the foot of the hills and ride a shuttle bus up every day, which stops at every estate gate and has to sign in afresh each time."
  codes:
    admin: '060402'
  population: 20000
  area_km2: 1280.0
  traits: { industries: [luxury, forestry, wine] }

# ── 圣遣返市──
- id: div_3mdaee
  subtype: locality
  parent: div_x2z14w
  status: generated
  names:
    zh: 圣遣返市
    en: San Deportes City
    es: San Deportes
  notes:
    zh: "圣遣返市在自治州的南端，是一座港口城市，全市 105 万人，面积约 1.2 万平方公里，也是州移民与海关执法局的大本营，执法局总部大楼是签证区最高的建筑。城名的英语和西班牙语一样，在西班牙语里的意思是「圣体育」，市政府因此每年办一场「遣返马拉松」，终点设在港口的遣返船码头。签证区是港湾边的市中心和海军码头，拉乔利区是海边的富人区和大学，边界线区是南海岸上一道几十公里长的钢墙、检查站、拘押中心和执法局的训练营，后山区是一直伸到东边荒漠的边检山脉。\n全市的经济靠移民执法与拘押、国防、港口航运和旅游，人均 GDP 约 10 万美元，收入中位数却只有 2.1 万美元。圣遣返湾是南海岸的天然良港，湾里停着海军舰艇、巡逻艇和遣返船；东边的隔离墙湾里，旧界墙一直修进了海中。单调领道从签证区出发一路北上，边墙领道贴着南海岸的钢墙向东再折进边检山脉，次日达领道从后山区往东北通向仓储帝国。圣遣返国际机场紧挨签证区，两座航站楼一座给旅客，一座给遣返航班，后者的航班更多。圣遣返地铁有两条线：1 号线八站全在签证区，2 号线十一站穿过边界线区，早晚挤满了去上班的执法局雇员。\n这里是炎热的半干旱气候，冬天白天也有 20 °C，一年雨水只有 350 毫米左右，阳光充足，夏天最热的月份白天也不到 30 °C，海风一吹就凉了。欧洲裔、拉丁裔和非洲裔各占三成，讲英语的约三分之二，讲西班牙语的近三成。政治上势均力敌：17 席的市议会里共和党、民主党各 8 席，加速党 1 席；市长阿图罗·巴尔德斯皮诺是共和党人，以 50.4% 的得票险胜民主党对手。\n城里一半的工作和执法局有关：看守、翻译、律师、伙食承包商、制作手环和脚镣的工厂，还有专门为被拘押的人家属提供探视「套餐」的旅行社。边界线区的钢墙由一个人工智能每天自动加高，因为它的目标是「让越墙者数量下降」，而这个数字每次下降，它就把墙再加高一点；墙已经高得要给飞机装防撞灯了。港湾的阳光和海滩很好，游客照来不误，只是每个酒店前台都会先问一句「您的证件带了吗」。港口的鱼市每天清晨开张，卖金枪鱼和海胆，鱼贩子说他们是全城唯一不用查证件的生意，因为鱼不会说自己从哪里来。"
    en: "San Deportes City, at the southern tip of the autonomous state, is a port city of 1,050,000 people covering some 12,000 square kilometres, and the stronghold of the State Immigration and Customs Enforcement Agency, whose headquarters is the tallest building in Visa District. The city's name is the same in English and Spanish, and in Spanish it means 'Saint Sports', so every year the city holds a 'Deportation Marathon' that finishes at the Deportation Ship Pier in the port. Visa District is the city centre and naval docks on the harbour, La Jolly the wealthy seaside district and its university, Borderline District a steel wall tens of kilometres long on the south coast with checkpoints, detention centres and the Agency's training camp, and Backcountry the Checkpoint Range reaching east to the desert.\nThe city lives on immigration enforcement and detention, defence, port and shipping, and tourism; GDP per head is about 100,000 dollars, but the median income only 21,000. San Deportes Bay is a natural harbour on the south coast, holding naval vessels, patrol boats and deportation ships; in Wall Bay to the east, the old border wall has been built right out into the sea. Monotony Road sets off from Visa District and heads all the way north, Wall Road runs east along the steel wall on the south coast before turning into the Checkpoint Range, and Next-Day Road leads north-east from Backcountry towards Warehouse Empire. San Deportes International Airport is right beside Visa District, with two terminals, one for passengers and one for deportation flights, and the second has more flights. The San Deportes Metro has two lines: all eight stations of Line 1 are in Visa District, and the eleven stations of Line 2 run through Borderline District, packed morning and evening with Agency employees on their way to work.\nThe climate is hot semi-arid, with daytime highs of 20 °C even in winter, only about 350 millimetres of rain a year and plenty of sunshine; even in the hottest months daytime highs stay below 30 °C, and the sea breeze soon cools things down. People of European, Latino and African descent each make up three in ten, about two thirds speak English and nearly three in ten Spanish. Politics is evenly balanced: on the 17-seat City Council the Republicans and Democrats hold 8 seats each and the Accelerate Party 1; the mayor, Arturo Valdespino, is a Republican who narrowly beat the Democratic candidate with 50.4 per cent of the vote.\nHalf the city's jobs have to do with the Agency: guards, interpreters, lawyers, catering contractors, factories making wristbands and ankle shackles, and travel agencies selling visiting 'packages' to the families of detainees. The steel wall in Borderline District is raised a little every day by an AI, because its goal is to 'reduce the number of people crossing the wall', and every time the number falls it raises the wall a bit more; the wall is now so high that aircraft need collision lights for it. The harbour's sunshine and beaches are fine and the tourists keep coming, but every hotel reception first asks, 'Have you brought your papers?' The fish market in the port opens at dawn every day, selling tuna and sea urchins, and the fishmongers say theirs is the only business in town that never checks papers, because a fish cannot say where it came from."
  codes:
    admin: '060500'
    unlocode: US SDP
  population: 1050000
  area_km2: 12000.0
  color: '#1E3A5F'
  flag: { layout: ensign, colors: ['#1E3A5F', '#FFFFFF'], charge: badge, charge_color: '#1E3A5F' }
  flag_notes:
    zh: "深蓝旗面，左上角是自治州旗，右边的白色圆章里是一枚深蓝色的七角执法徽章。旗面的蓝色与执法局制服同色，执法局把这面旗挂在每一座拘押中心门口，市政府后来发现城旗的版权登记在执法局名下。"
    en: "A dark blue field with the state flag in the canton and, in a white roundel in the fly, a dark blue seven-pointed enforcement badge. The blue is that of the Enforcement Agency's uniforms; the agency flies the flag at the gate of every detention centre, and the city government later discovered that the flag's copyright is registered to the agency."
  traits: { industries: [enforcement, defence, port, tourism], heritage: ca_mixed, age: young, income: 0.85 }
  symbols: {"flower": {"zh": "香石竹", "en": "Carnation"}, "tree": {"zh": "托里松", "en": "Torrey pine"}}
- id: div_ad0sg9
  subtype: borough
  parent: div_3mdaee
  status: generated
  names:
    zh: 签证区
    en: Visa District
    es: Visado
  notes:
    zh: "签证区是圣遣返的市中心，在港湾北岸，面积约 200 平方公里，住着约 42 万人，是全市人口最多的区。执法局总部大楼是全城最高的建筑，深色玻璃外墙，楼顶的探照灯夜里扫过整个港湾，楼前广场上的电子牌滚动显示当年的遣返人数。港湾里停着海军舰艇和遣返船，南边的遣返船码头每周开出几班由退役渡轮改成的遣返船；岸边的老煤气灯街区是酒吧和餐馆，酒吧门口贴着执法局的「举报有奖」二维码。圣遣返国际机场紧挨着区边，一条南北向的长跑道，遣返航站楼的航班比客运航站楼还多。\n单调领道从区里出发，一路向北要开将近十个小时才到自治州北端。圣遣返地铁 1 号线的八座车站全在区里，从协同路站、赋能路站、葡萄藤路站、海狮大街站一路排到上海站。区里的经济是移民执法、港口航运和商贸，讲英语的人占四分之三，西班牙语招牌却随处可见。\n在签证区上班的人，早上从地铁站出来，先在路边买一杯咖啡，再走进执法局的大楼；中午的餐馆里，翻译、律师和看守坐在相邻的桌子，听得懂彼此的案子。周末的游客在煤气灯街区喝酒，喝到微醺时总有人拿手机去扫门口那个二维码，想看看举报一个人到底值多少钱，扫出来的页面先要他上传自己的证件。"
    en: "Visa District is the centre of San Deportes, on the north shore of the harbour, about 200 square kilometres with some 420,000 people, the most populous district in the city. The Agency's headquarters, with its dark glass walls, is the tallest building in the city; the searchlight on its roof sweeps the whole harbour at night, and an electronic board on the square in front scrolls the year's deportation figures. Naval vessels and deportation ships lie in the harbour, and from the Deportation Ship Pier to the south a few sailings a week leave on old ferries converted into deportation ships; the old gaslamp quarter by the water is bars and restaurants, with the Agency's 'Report and Be Rewarded' QR code stuck by the bar doors. San Deportes International Airport is right at the edge of the district, one long north–south runway, and its deportation terminal has more flights than the passenger terminal.\nMonotony Road sets off from the district and takes nearly ten hours to drive north to the far end of the state. All eight stations of San Deportes Metro Line 1 are in the district, running from Synergy Road, Empowerment Road, Vineyard Road and Sea Lion High Street all the way to Shanghai. The district lives on immigration enforcement, port and shipping, and commerce; three quarters of its people speak English, yet Spanish signs are everywhere.\nThose who work in Visa District come up out of the metro in the morning, buy a coffee on the street, then walk into the Agency building; at lunch, interpreters, lawyers and guards sit at neighbouring tables in the restaurants and can follow one another's cases. At weekends the tourists drink in the gaslamp quarter, and once tipsy someone always scans the QR code by the door to see what reporting a person is actually worth; the page that opens first asks them to upload their own papers."
  codes:
    admin: '060501'
  population: 420000
  area_km2: 200.0
  traits: { industries: [enforcement, port, commerce] }
- id: div_61yver
  subtype: borough
  parent: div_3mdaee
  status: generated
  names:
    zh: 拉乔利区
    en: La Jolly District
    es: La Alegre
  notes:
    zh: "拉乔利区在港湾北边的海岸上，是圣遣返的海边富人区，面积约 300 平方公里，住着约 16 万人。悬崖上是豪宅和大学，海边的岩洞里住着海狮。拉乔利大学在崖顶，图书馆像一盏倒放的台灯，最大的学院是「边境安全与人工智能学院」，研究如何让算法从照片里判断一个人的身份，经费大多来自执法局和全景监狱技术公司；海狮倒是不需要证件，常常被游客围着拍照，学校几次想请它们搬走，最后发现海狮比任何人都难遣返。\n区里的经济靠高等教育、科研和富豪私人服务，人均 GDP 约 22.5 万美元，是全市最高的区；居民中非洲裔占一半以上，讲英语的近九成。单调领道从区里经过，往北通向艾尔瓦纳和失落天使，往南就是签证区。崖顶的豪宅大多雇着园丁、厨师、司机和保镖，这些人每天傍晚坐车回家，路上要在执法局的检查站前出示雇主签发的通行卡。\n退潮时，崖下的潮池里满是海星和海葵，教授们带着学生下去上野外课，海狮懒洋洋地躺在一旁。日落时分，崖顶的步道上挤满了看夕阳的人，滑翔伞从悬崖上一个接一个地飞出去，飘在海面上，执法局的巡逻无人机偶尔会凑过去，绕着它们飞一圈再走。"
    en: "La Jolly District lies on the coast north of the harbour, the wealthy seaside district of San Deportes, about 300 square kilometres with some 160,000 people. Mansions and the university stand on the clifftops, and sea lions live in the caves along the shore. The University of La Jolly is on the clifftop, its library like an upturned desk lamp, and its largest school is the School of Border Security and Artificial Intelligence, which studies how to make algorithms tell who a person is from a photograph, funded mostly by the Agency and Panopticon Technologies; the sea lions, for their part, need no papers and are often surrounded by tourists taking pictures, and after several attempts to move them on, the university found that sea lions are harder to deport than anyone.\nThe district lives on higher education, research and private services for the very rich, and its GDP per head of about 225,000 dollars is the highest in the city; more than half the residents are of African descent, and nearly nine in ten speak English. Monotony Road passes through, leading north towards Irvana and Lost Angeles and south straight into Visa District. Most of the clifftop mansions employ gardeners, cooks, drivers and bodyguards, who ride home every evening and on the way must show an employer-issued pass at an Agency checkpoint.\nAt low tide the rock pools below the cliffs are full of starfish and anemones, professors take students down for field classes, and the sea lions lie lazily to one side. At sunset the clifftop path is crowded with people watching the sun go down, and paragliders launch one after another from the cliff to drift over the sea; now and then an Agency patrol drone comes over, circles them once and leaves."
  codes:
    admin: '060502'
  population: 160000
  area_km2: 300.0
  traits: { industries: [education, research, luxury], heritage: ca_anglo, ethnicity: ca_african, income: 2.2 }
- id: div_jmthr1
  subtype: borough
  parent: div_3mdaee
  status: generated
  names:
    zh: 边界线区
    en: Borderline District
    es: La Línea
  notes:
    zh: "边界线区是圣遣返南海岸上的执法区，全区 38 万人，面积约 1500 平方公里。一道钢墙沿着海岸线一直延伸到海里，墙后是检查站、拘押中心、遣返船码头和执法局的训练营。这里本来是两个国家的陆地边界，自治州成了岛以后，边界外只剩大海，执法局却没有拆墙，而是给墙装上了防浪板；钢柱墙从岸上伸进隔离墙湾好几公里，墙上装着摄像头和探照灯。区里的居民大多是州移民与海关执法局的雇员和他们的家属，劳动年龄人口占 76%，母语讲西班牙语的约 51%，英语约 46%。\n区里的主要设施都属于执法局：边界线口岸有几十条车道，正对着大海，自建成以来没有一辆车从对面开过来；边界线拘押中心由一家上市的私营监狱公司按人头承包，牢房住满后又摞起了集装箱；新警员在执法局边界训练营接受十二周的训练。边墙领道从这里出发，贴着钢墙向东；圣遣返地铁2号线全长约 14 公里，从上坡站到约翰森站共 11 站，全在区内，沿途有杭州站、钟楼站和亿万岛大道站，早晚挤满了换班的看守、翻译和伙食承包商的员工。\n这里的工作几乎都和关人有关，全区人均 GDP 约 7.1 万美元，收入中位数却只有约 1.9 万。被拘押的人在等船期间要在中心的车间里给执法局缝制服、做铁床，一小时的工钱买不起食堂里的一瓶水；探视日的清晨，家属们拎着袋子在拘押中心门外排队，队伍里讲西班牙语的比讲英语的多。上次选举，共和党得票 36.9%，民主党 26.3%，工人团结党 12.2%。本地人说墙的另一边从来没有人来，墙这一边却永远不缺人。"
    en: "Borderline District is the enforcement district on the south coast of San Deportes, with 380,000 people over some 1,500 km². A steel wall runs along the shore and on out into the sea, with checkpoints, detention centres, the deportation ship quay and the agency's training camps behind it. This was once a land border between two countries; since the state became an island there is nothing beyond it but sea, yet the agency did not pull the wall down but fitted it with wave baffles, and its steel posts now reach several kilometres out into Wall Bay, hung with cameras and searchlights. Most residents are employees of the State Immigration and Customs Enforcement Agency and their families; people of working age make up 76% of the population, and about 51% speak Spanish as their first language and about 46% English.\nThe district's main facilities all belong to the agency. Borderline Port of Entry has dozens of lanes facing the open sea, and not a single vehicle has come across from the other side since it was built; Borderline Detention Centre is run under a per-head contract by a listed private prison company, and when its cells filled up, shipping containers were stacked beside them; new officers do twelve weeks of training at the Enforcement Agency Border Training Camp. Wall Road starts here and runs east along the wall, and San Deportes Metro Line 2, about 14 km long with 11 stations from Uphill to Johansen, lies entirely within the district, by way of Hangzhou, Clock Tower and Billionaire Island Avenue; at the start and end of the day it is packed with guards, interpreters and caterers' staff changing shifts.\nAlmost every job here has to do with locking people up. GDP per head is about $71,000, yet median income is only about $19,000. Detainees waiting for a ship must work in the centre's workshops, sewing uniforms for the agency and making iron beds, and an hour's pay will not buy a bottle of water in the canteen; on visiting days, families queue outside the detention centre in the early morning carrying bags, more of them speaking Spanish than English. At the last election the Republican Party took 36.9% of the vote, the Democratic Party 26.3% and the Workers' Solidarity Party 12.2%. Locals say nobody ever comes from the other side of the wall, while this side is never short of people."
  codes:
    admin: '060503'
  population: 380000
  area_km2: 1500.0
  traits: { industries: [enforcement, security, defence], heritage: ca_latino }
- id: div_j1wv5r
  subtype: borough
  parent: div_3mdaee
  status: generated
  names:
    zh: 后山区
    en: Backcountry District
    es: Trasmonte
  notes:
    zh: "后山区在圣遣返以东，是全市面积最大的区，约 1 万平方公里，从海边城区背后的丘陵一直伸到东边的荒漠，住着约 9 万人。边检山脉从北向南穿过区里，最高处约 1767 米，西坡是松林和苹果园，东坡陡然落进荒漠，北端的高峰冬天积雪，山后是一片沙漠公园，春天下过雨，满地开着野花。区里的人种苹果、养牛、开民宿，也有不少人在执法局上班；居民一半是欧洲裔，几乎人人讲英语。\n执法局在山路上设了一连串检查站，开车进山要停三四次，牧场主说他的牛被查证件的次数比他还多。边墙领道从边界线区折进山里，翻过山口去喷灌区，检查站就修在山口正中，上了山的车不能掉头，只能一直开到检查站前排队，路边的扩音器每隔几分钟用英语和西班牙语播一遍「请准备好您的证件」；次日达领道从区里出发，往东北去仓储帝国，是运包裹的货车最爱走的路。山谷里的后山无人机巡逻基地有一条跑道和一排机库，几十架长航时无人机从这里起飞，沿海岸和沙漠公路日夜巡逻，驾驶它们的操作员却在几百公里外的空调房里。\n秋天是苹果季，山里的小镇办苹果派节，城里人开车上山买派，回程在检查站排队时正好把派吃完。牛已经习惯了头顶无人机的嗡嗡声，倒是新来的游客每次听见都要抬头找半天。"
    en: "Backcountry District lies east of San Deportes, the largest district in the city at about 10,000 square kilometres, running from the hills behind the coastal city to the desert in the east, with some 90,000 people. The Checkpoint Range crosses the district from north to south, rising to about 1,767 metres; its western slopes are pine forest and apple orchards, its eastern side drops sharply into the desert, the high peaks at its northern end are snowy in winter, and behind the mountains lies a desert park that blooms with wild flowers after the spring rain. People here grow apples, raise cattle and run guest houses, and many work for the Agency; half the residents are of European descent, and almost everyone speaks English.\nThe Agency has set up a string of checkpoints on the mountain roads, so that driving into the hills means stopping three or four times, and one rancher says his cattle have had their papers checked more often than he has. Wall Road turns into the mountains from Borderline District and crosses the pass to Sprinkler District, with a checkpoint built right in the middle of the pass; once on the mountain no car can turn round, and all must drive on and queue at the checkpoint while roadside loudspeakers announce every few minutes, in English and Spanish, 'Please have your papers ready.' Next-Day Road sets off from the district north-east towards Warehouse Empire, the favourite route of parcel lorries. In a valley lies the Backcountry Drone Patrol Base, with a runway and a row of hangars, from which dozens of long-endurance drones take off to patrol the coast and the desert roads day and night, flown by operators in air-conditioned rooms hundreds of kilometres away.\nAutumn is apple season, and the mountain towns hold an apple pie festival; city people drive up to buy pies and have just finished eating them by the time they reach the front of the checkpoint queue on the way home. The cattle have grown used to the buzz of drones overhead, but newly arrived tourists still look up and search the sky every time they hear it."
  codes:
    admin: '060504'
  population: 90000
  area_km2: 10000.0
  traits: { industries: [agriculture, enforcement, tourism], heritage: ca_anglo }

# ── 仓储帝国市──
- id: div_jysn35
  subtype: locality
  parent: div_x2z14w
  status: generated
  names:
    zh: 仓储帝国市
    en: Warehouse Empire City
    es: Imperio Almacén
  notes:
    zh: "仓储帝国市在失落天使以东的内陆，全市 100 万人，面积约 2.5 万平方公里，从付费墙山脉山脚一直延伸到北边的高原荒漠。这里是全州的仓库：托盘维尔区的物流园里，一座仓库就有几十个足球场大，屋顶连起来能当机场跑道，仓库里是机器人，仓库外是排队等着进去做「补位」工作的人。无河区是城市的中心，名字来自一条早已干掉的河，河道如今是一条货运领道。履约高漠区是仓储帝国北边的荒漠，包括付费墙山脉东段的最高峰和山后的大片物流基地；山上有雪道和湖畔木屋，山后的荒漠里有一座货机墓地，几百架退役货机停在沙地里，有的被改成了仓库，那里的小镇房价便宜，是被城里挤出来的人最后的落脚处。\n全市靠物流仓储、无人工厂与机器人和零工与平台劳务过日子，人均 GDP 约 6.4 万美元，收入中位数 1.7 万美元；居民年轻，过了 65 岁的只有一成多，讲英语和讲西班牙语的差不多各半。托盘维尔区有一座货运机场和一个铁路货场，尼罗物流的巨型仓库里，人类员工戴着计步手环，停下来超过规定时间手环就会震动，上厕所也算在内；区后的次日达山口海拔 1305 米，货车日夜从这里翻进翻出，一下雪就封路。仓储领道从失落天使开来，无人货车排成十几辆一串的车队，人开的车很难插进去；次日达领道穿过付费墙山脉的长隧道，隧道口的倒计时牌显示的是离「次日」截止还有几个小时。离线领道从履约高漠区出发向北，沉没成本领道从西边的巴雷尔斯菲尔德过来。离海岸一百多公里的次日达检查站被执法局当作边境来管，每一辆北上的车都要停下来刷脸，「次日达」常常变成「隔日达」。\n这里是炎热的半干旱气候，一年雨水只有 240 毫米左右，七月白天平均 36 °C 以上。17 席的市议会里民主党占了 16 席，拔插头联盟 1 席；市长肯德尔·金斯伯里是民主党人，在决选中以 62.6% 的得票击败加速党的对手。\n仓储帝国人说自己住在「全世界的购物车里」。每天有几万辆无人货车从港口开进来、从仓库开出去，夜里领道上的车灯连成一条看不到头的光带；空气里的柴油味和橙子花香混在一起，老人们记得这里从前是一望无际的柑橘园。山火季的热风从荒漠吹下来，仓库会停工，那是工人们一年里唯一的带薪假。"
    en: "Warehouse Empire City lies inland east of Lost Angeles, a city of 1,000,000 people covering some 25,000 square kilometres, from the foot of the Paywall Range to the high desert in the north. This is the state's warehouse: in the logistics parks of Palletville a single warehouse is the size of dozens of football pitches, the roofs joined together would make an airport runway, and inside are robots while outside people queue for 'gap-filling' work. Riverless District is the city centre, named after a river that dried up long ago, whose bed is now a freight road. High Desert Fulfillment is the desert north of the city, taking in the highest summit of the eastern Paywall Range and the great logistics bases behind the mountains; up in the mountains are ski runs and lakeside chalets, and in the desert beyond lies a cargo-plane graveyard where hundreds of retired freighters stand in the sand, some converted into warehouses, while the small towns out there, where houses are cheap, are the last refuge of people priced out of the city.\nThe city lives on logistics, lights-out factories and robots, and gig and platform work; GDP per head is about 64,000 dollars and the median income 17,000. Its people are young, only just over a tenth being over 65, and English and Spanish speakers are roughly half and half. Palletville has a cargo airport and a rail freight yard, and in Nile's giant fulfilment centre the human staff wear step-counting wristbands that buzz if they stop for longer than allowed, toilet breaks included; behind the district, Next-Day Pass, 1,305 metres up, carries lorries in and out day and night and closes whenever it snows. Warehouse Road comes in from Lost Angeles, its driverless lorries running in platoons of a dozen or more that cars driven by people can hardly cut into; Next-Day Road passes through a long tunnel under the Paywall Range, where a countdown board at the portal shows not the distance to the exit but the hours left before the 'next day' deadline. Offline Road sets off north from High Desert Fulfillment, and Sunk Cost Road comes in from Barrelsfield to the west. The Next-Day Checkpoint, more than a hundred kilometres from the coast, is run by the Agency as if it were a border: every northbound vehicle must stop for face scanning, and 'next day' often becomes 'the day after'.\nThe climate is hot semi-arid, with only about 240 millimetres of rain a year and July days averaging over 36 °C. The Democrats hold 16 of the 17 seats on the City Council and the Unplug League 1; the mayor, Kendall Kingsbury, is a Democrat who beat the Accelerate Party candidate in the run-off with 62.6 per cent of the vote.\nWarehouse Empire people say they live 'in the whole world's shopping basket'. Every day tens of thousands of driverless lorries come in from the ports and go out from the warehouses, and at night their lights join into an endless band along the state roads; the smell of diesel mixes with the scent of orange blossom, and old people remember when this was all citrus groves as far as the eye could see. In fire season, when the hot winds blow down from the desert, the warehouses stop work, the only paid holiday the workers get all year."
  codes:
    admin: '060600'
  population: 1000000
  area_km2: 25000.0
  color: '#8B5E34'
  flag: { layout: bands, colors: ['#8B5E34', '#F2E3C6', '#8B5E34'], ratio: [1, 2, 1], charge: links, charge_color: '#3A2A1A' }
  flag_notes:
    zh: "棕、米、棕三道横条，正中一串深棕色的链环。棕色是纸箱，米色是仓库屋顶，链环是供应链；市民给它起的外号是「快递单」，因为它挂在每座仓库门口，看起来就像一张贴在箱子上的面单。"
    en: "Brown, cream and brown bands with a chain of dark brown links in the middle. The brown is cardboard, the cream the warehouse roofs and the links the supply chain; people call it 'the shipping label', since hanging at every warehouse door it looks like one stuck to a box."
  traits: { industries: [logistics, robotics, gig], heritage: ca_latino, age: young, income: 0.6 }
