- id: div_w1h5d7
  subtype: borough
  parent: div_91r9b3
  status: generated
  names:
    zh: 木屋区
    en: Chalet District
    es: Chalés
  notes:
    zh: 首府东边伸进估值山脉的山区，塔克斯霍湖在区的东端，湖水清澈见底，湖岸几乎被富人的滑雪木屋和私人码头占满。湖名来自湖边的避税传统：木屋登记成「农业用地」，屋里的酒窖登记成「水利设施」。冬天雪道开放，山路上堵满了从湾区来的自动驾驶越野车。
    en: "The mountains east of the capital, reaching into the Sierra Valuation, with Lake Taxhoe at the eastern end, its water clear to the bottom and its shores almost entirely taken up by the ski chalets and private jetties of the rich. The lake owes its name to a local tradition of tax avoidance: the chalets are registered as farmland and their wine cellars as water works. In winter the ski runs open and the mountain roads jam with self-driving SUVs from the Bay Area."
