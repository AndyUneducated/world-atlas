  parent: div_x2z14w
  status: generated
  names:
    zh: 欧福利亚市
    en: Euphoria City
    es: Euforia
  notes:
    zh: "北海岸的城市，全市 14 万人，雾气缭绕的红杉林和崎岖的海岸占了大半个市。谦卑湾区是海湾边的港口和老木材镇，红木帘区是南边连绵几百公里的红杉林、河谷和海岸，林子深处的大麻农场曾经是这里最大的产业。城名来自大麻：合法化以前，林子里的农场让这里富得流油，合法化以后，大公司在荒漠里用温室种出了更便宜的大麻，林子里的农场一家接一家倒闭，城里的欢乐也就只剩下城名了。\n欧福利亚人自称住在「红木帘」后面：帘外的人工智能、高铁和执法局都很少翻过山来，城里还有人用现金，有人不用手机，有人坚持在林子里的树屋里过日子。一年四季都在下雨或起雾，红杉树高得要仰着头才能看到树梢，林子里的蕨类比人还高。每年秋天大麻收获季，林子里的小镇还会办一场「怀旧丰收节」，节上卖的大麻是从荒漠温室里进的货。"
    en: "The city of the north coast, with 140,000 people, most of its area taken up by redwood forest in the fog and rugged coast. Humbled Bay District is the port and old lumber town on the bay, and Redwood Curtain the redwood forests, river valleys and coast that run on for hundreds of kilometres to the south, where cannabis farms deep in the woods were once the biggest industry. The city is named for cannabis: before legalisation the farms in the forest made the place rich; after it, big companies grew cheaper cannabis in greenhouses in the desert, the forest farms closed one after another, and only the city's name is left of its euphoria.\nEuphoria people say they live behind the Redwood Curtain: artificial intelligence, the high-speed railway and the Enforcement Agency rarely make it over the hills, and people here still pay in cash, go without phones or live in tree houses in the woods. It rains or is foggy all year round, the redwoods are so tall that you must tip your head right back to see their tops, and the ferns in the forest are taller than a person. Every autumn at harvest time the forest towns still hold a 'Nostalgia Harvest Festival', where the cannabis on sale is bought in from the desert greenhouses."
  codes:
    admin: '061400'
  population: 140000
  area_km2: 35000.0
  color: '#2D6A4F'
  flag: { layout: bands, vertical: true, colors: ['#1B4332', '#95D5B2', '#1B4332'], charge: pine, charge_color: '#1B4332' }
  flag_notes:
    zh: "深绿、浅绿、深绿三道竖条，中间的浅绿条上是一棵深绿色的红杉。深绿是红杉林，浅绿是林间的雾；城旗上本来还有一片叶子，合法化以后被市议会悄悄删掉了，旧旗如今在林子里的小镇上卖得很好。"
    en: "Dark green, pale green and dark green in vertical bands, with a dark green redwood on the pale green band. The dark green is the redwood forest and the pale green the mist among the trees; there used to be a leaf on the flag too, quietly removed by the city council after legalisation, and the old flags now sell well in the forest towns."
  traits: { industries: [forestry, cannabis, fishing, tourism], heritage: ca_anglo, age: balanced, income: 0.6 }
