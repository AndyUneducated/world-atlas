    zh: 斯塔克顿市
    en: Stuckton City
    es: Estancado
  notes:
    zh: "中央渴谷北段的河港城市，全市 30 万人，以加州高速铁路的「终点站」闻名：铁路从南边修了很多年，终于修到了城南的一片空地上，站房盖好了，月台也铺好了，可铁轨出了站往北只铺了两公里就停住了，因为下一段还在做环境评估。终点站区是城市的中心和河港，谦逊区是城东的农田、果园和估值山脉的山脚，那里有几座老淘金镇。\n斯塔克顿人对高铁的感情很复杂：一方面它是城里最漂亮的建筑，另一方面每天只有两班车开往南边荒漠里的另一个空站。车站咖啡馆的招牌菜叫「下一期」，是一块永远只上一半的蛋糕。城里失业率高、房子便宜，湾区搬走的人有不少在这里落脚，他们每天早上坐在空荡荡的月台上用笔记本电脑接零活，说这里是全州网速最快、人最少的办公室。"
    en: "A river port in the northern Central Thirsty Valley, with 300,000 people, famous as the 'terminus' of the California High-Speed Railway: built northwards from the south over many years, the line finally reached an empty lot south of the city, where the station building is finished and the platforms laid, but north of the station the track runs on for just two kilometres and stops, because the next section is still under environmental review. Terminus District is the city centre and river port, and Modestly the farms, orchards and Sierra foothills east of the city, with several old gold-rush towns.\nStuckton people have mixed feelings about the railway: on the one hand it is the finest building in town; on the other, only two trains a day leave it, for another empty station in the desert to the south. The station café's signature dish is called 'Phase Two', a cake only ever half served. Unemployment is high and houses cheap, and many people who left the Bay Area have settled here; every morning they sit on the empty platforms taking gig work on their laptops, calling it the office with the fastest internet and fewest people in the state."
  codes:
    admin: '061000'
  population: 300000
  area_km2: 15000.0
  color: '#9CA3AF'
  flag: { layout: hoist, colors: ['#4B5563', '#9CA3AF', '#D1D5DB'], division: wedge, charge: brackets, charge_color: '#F59E0B' }
  flag_notes:
    zh: "浅灰和银灰两道横条，一道深灰尖楔从旗杆一侧伸进旗面，尖端前是一对橙色的方括号。尖楔是一条修到一半的铁路，方括号是工程图纸上「待定」的记号；市议会说等高铁通车那天就把括号去掉，城旗的设计费已经为此预留了。"
    en: "Pale grey and silver grey bands with a dark grey wedge reaching in from the hoist towards a pair of orange square brackets. The wedge is a half-built railway, and the brackets the 'to be decided' mark on an engineering drawing; the city council says it will remove the brackets on the day the railway opens, and the design fee has been set aside for it."
  traits: { industries: [logistics, agriculture, gig], heritage: ca_mixed, age: young, income: 0.5 }
