    zh: "海湾半岛南部山间的富豪城，全市 9 万人，其中真正的居民只有几百户，其余是住在员工宿舍里的厨师、园丁、保镖、司机、私人医生和直升机驾驶员。这座城是几十位科技寡头为了不归贝叶斯市管、不交贝叶斯市的税而联名设立的，市议会的七个席位由各家的家族办公室轮流指派，市长每年抽签产生，没有抽中的人可以买下抽中者的任期。门禁高地区是平地上的庄园群，护城河山区是山里更大的庄园、私人森林和直通海边的私人道路。\n比尔斯伯勒没有公交、没有人行道、没有路灯，也没有一家公共商店：公共的东西会招来外人。每座庄园都有自己的围墙、保安队和地下避难所，几家人的庄园之间还修了私人隧道，方便晚宴时不必经过公共道路。市里唯一的公共设施是一座市政厅，市政厅也只在有人预约时开门。"
    en: "A city of the very rich in the hills of the southern bay peninsula, with 90,000 people, of whom only a few hundred households are true residents; the rest are cooks, gardeners, bodyguards, drivers, private doctors and helicopter pilots living in staff dormitories. A few dozen tech oligarchs jointly founded the city so as not to be governed or taxed by Bayesian City; its seven council seats are filled in turn by the families' private offices, and the mayor is drawn by lot every year, though anyone not drawn may buy the winner's term. Gated Heights District is the estates on the flat land, Moat Hills the still larger estates, private forests and private roads to the sea in the hills.\nBillsborough has no buses, no pavements, no street lights and not a single public shop: public things attract outsiders. Every estate has its own walls, guard force and underground shelter, and several families have dug private tunnels between their estates so as not to use the public road on the way to dinner. The city's only public building is its city hall, and that opens only by appointment."
