  names:
    zh: 破产中心区
    en: Downturn District
    es: Centro Quiebra
  notes:
    zh: "破产中心区是失落天使的老市中心，全区 22 万人，面积约 60 平方公里，摩天楼、市政厅和几座老剧院都在这里。白领被人工智能取代后，写字楼的空置率过了一半，大楼改成了数据机房和自动仓库，楼下的人行道上是绵延十几个街区的帐篷城。全区人均 GDP 约 11.7 万美元，收入中位数只有约 2.4 万：钱留在楼上的机房和金融公司里，楼下的人领的是「再就业提示词课程」。\n失落天使警察局总部也在这里，一座玻璃外墙的大楼，市民叫它「玻璃堡」，局长每周在楼里召开分局长联席会议，总部真正能指挥的只剩这栋楼和楼前的停车场。再就业提示词学院开在一栋半空的写字楼里，课程由人工智能讲授，作业由人工智能批改。单调领道、仓储领道和烟雾谷—破产中心公路在区里交会，颠覆大街、议会大街、估值大街和提示词大街把城区切成方格。失落天使地铁1号线全长约 8.1 公里，从贝里站到亿万岛路站共 7 站，全在区内，失落天使警察局总部站是去「玻璃堡」交罚款的人下车的地方。\n市政厅门前的喷泉每天中午准时开放，据说是为了让帐篷城的人有地方洗脸；十二点一到，帐篷里的人拿着牙刷和毛巾排队，旁边写字楼里下来抽烟的数据机房值班员也会凑过去洗把脸。老剧院的霓虹招牌还亮着，演的多是人工智能写的戏，观众席里坐得最满的是帐篷城的人，因为剧院有冷气。上次选举，民主党得票 42.4%，加速党 27.6%。本地人说，这里的楼越来越聪明，街越来越穷。"
    en: "Downturn District is the old centre of Lost Angeles, home to 220,000 people over some 60 km², with the skyscrapers, City Hall and several old theatres. Since office workers were replaced by artificial intelligence more than half the office space has stood empty, and towers have become server rooms and automated warehouses, while the pavements below are a tent city a dozen blocks long. GDP per head is about $117,000, yet median income is only about $24,000: the money stays upstairs in the server rooms and finance houses, while the people downstairs get the 'Prompting for Re-employment' course.\nLost Angeles Police Headquarters is here too, a glass-walled tower that people call the 'Glass Fort', where the chief holds a weekly joint meeting of division commanders, though all headquarters really commands is the building itself and the car park in front of it. The Re-employment Prompt Academy occupies a half-empty office block, where the classes are taught by artificial intelligence and the homework marked by artificial intelligence. Monotony Road, Warehouse Road and the Smogdale–Downturn Road meet in the district, and Disruption Boulevard, Parliament Boulevard, Valuation Boulevard and Prompt Boulevard cut the streets into a grid. Lost Angeles Metro Line 1, about 8.1 km long with 7 stations from Berg to Billionaire Island Road, lies entirely within the district, and Lost Angeles Police Headquarters station is where people get off to pay their fines at the Glass Fort.\nThe fountain in front of City Hall comes on punctually every day at noon, so it is said, to give the people of the tent city somewhere to wash; when twelve o'clock strikes they queue with toothbrushes and towels, and server-room duty staff who have come down from the towers for a cigarette sometimes join them to splash their faces. The neon signs of the old theatres still glow, and most of the plays are written by artificial intelligence; the fullest seats belong to people from the tent city, because the theatres are air-conditioned. At the last election the Democratic Party took 42.4% of the vote and the Accelerate Party 27.6%. Locals say the buildings here keep getting smarter and the streets keep getting poorer."
  codes:
    admin: '060201'
  population: 220000
  area_km2: 60.0
  traits: { industries: [finance, government, datacenter] }
- id: div_16m2n3
  subtype: borough
  parent: div_w1vh1a
  status: generated
  names:
    zh: 好莱怪区
    en: Hollyweird District
    es: Hollyraro
  notes:
    zh: "好莱怪区是失落天使影视业的老家，面积约 120 平方公里，住着约 28 万人，居民中非洲裔超过一半。山坡上一排巨大的白色字母写着区名，其中一个字母被一家流媒体公司买下冠名，字母底下的灯每晚换成那家公司的颜色。片场仍然很忙，只是摄影棚里多数是绿幕和服务器，演员的脸和声音按次授权给人工智能；街上排队试镜的人比从前更多，因为现在要试镜的是「被扫描」的资格。星光大道的地砖改成了二维码，扫一下能看到明星生前和死后的作品。\n好莱怪无人片场的十几座摄影棚大多空着，电影的演员、布景和镜头都由模型生成，只留下一个专拍「真人花絮」的小棚；配音演员把声音授权给片场，每被模型用一次就收到一笔很小的版税，片场门口新嵌进去的星星刻的是模型的版本号。区里靠影视与流媒体、广电传媒和旅游过日子。地铁 2 号线的七座车站全在区里，从青岛站经剧院大街站、好莱怪无人片场站一路到估值山脉路站，游客坐着它去看片场，片场的员工坐着它去面试别的工作。全州最长的广告牌领道就从这里出发，一路北上一千三百多公里，第一块广告牌卖的是演员的脸部扫描服务。\n傍晚，剧院大街站一带的旧电影院门口还排着队，放的是人工智能按观众口味当场剪出来的版本，每个人看到的结局都不一样，散场后大家在街边的小吃车前争论到底谁看的才是正片。"
    en: "Hollyweird District is the old home of Lost Angeles's film industry, about 120 square kilometres with some 280,000 people, more than half of them of African descent. A row of giant white letters on the hillside spells out the district's name; the naming rights to one letter have been bought by a streaming company, and the lights beneath it change to that company's colours every night. The studios are still busy, only now the soundstages are mostly green screens and servers, and actors' faces and voices are licensed to AI by the use; the queues for auditions on the street are longer than ever, because what people now audition for is the right to be 'scanned'. The paving stones of the Walk of Fame have been replaced by QR codes, which bring up a star's work from before and after their death.\nMost of the dozen or so soundstages of Hollyweird Unmanned Studios stand empty, the actors, sets and shots of its films all generated by models, with only one small stage kept for filming 'real-life behind-the-scenes' footage; voice actors license their voices to the studio and receive a tiny royalty each time a model uses them, and the new stars set into the pavement outside the studio gate are engraved with model version numbers. The district lives on film and streaming, broadcasting and tourism. All seven stations of Metro Line 2 are in the district, from Qingdao through Theatre High Street and Hollyweird Unmanned Studios to Sierra Valuation Road; tourists ride it to see the studios, and studio staff ride it to interviews for other jobs. Billboard Road, the longest in the state, sets off from here on its journey of more than 1,300 kilometres north, and its first billboard sells face-scanning services for actors.\nIn the evenings there are still queues outside the old cinemas around Theatre High Street station, showing versions cut on the spot by AI to suit each viewer's taste, so that everyone sees a different ending, and afterwards people argue at the food trucks on the street over whose was the real film."
  codes:
    admin: '060202'
  population: 280000
  area_km2: 120.0
  traits: { industries: [entertainment, media, tourism], ethnicity: ca_african }
- id: div_5sjc4x
  subtype: borough
  parent: div_w1vh1a
  status: generated
  names:
    zh: 比佛利账单区
    en: Beverly Bills District
    es: Beverly Facturas
  notes:
    zh: "比佛利账单区在盆地西侧的山脚下，是失落天使的富人区，面积约 80 平方公里，住着约 6 万人。棕榈大道两边是带围墙的豪宅、私人诊所和名牌店，店里不标价，店员看一眼客人的车钥匙就知道该报多少。区里的私人保安比警察多三倍，每家门口立着两块牌子：一块写保安公司，一块写「本宅已购买警察分局保护套餐」。区名来自一句本地俗语：「来比佛利不用带钱，账单会找上你」。区里靠富豪私人服务、私人安保和影视过日子，人均 GDP 约 43 万美元，在全市仅次于马里买区。\n尼罗物流创始人杰夫·博佐斯的庄园在这里，原是一位老电影大亨的宅子，他买下以后又买下了左右两边的邻居，车库连着一条地下通道，通往一座私人仓库，里面的收藏品每一件都按尼罗的编码上架；尼罗的配送无人机不许飞越庄园，包裹要在门口交给人类管家。全州最繁忙的停车场领道从区里经过，过路费按「愿付价格」计算，这里的车开上去，价格表会先停顿一下，像是在重新估值。\n清晨，园丁、泳池清洁工和遛狗的人从盆地各处坐车赶来，在豪宅门口刷脸进门；中午名牌店前停满了不熄火的车，司机们靠在车门上交换各家主人的八卦。夜里豪宅的灯一盏盏亮起，保安的巡逻车在弯路上慢慢开过，车顶的灯比路灯还亮。"
    en: "Beverly Bills District, at the foot of the hills on the west side of the basin, is Lost Angeles's wealthy quarter, about 80 square kilometres with some 60,000 people. Along its palm avenues stand walled mansions, private clinics and designer shops that display no prices, the assistants knowing what to quote from one glance at a customer's car key. Private security guards outnumber the police three to one, and two signs stand at every gate: one naming the security firm, the other reading 'This Residence Has Purchased a Police Precinct Protection Package'. The name comes from a local saying: 'You don't need to bring money to Beverly. The bills will find you.' The district lives on private services for the very rich, private security and film, and its GDP per head of about 430,000 dollars is second in the city only to Malibuy's.\nJeff Bozos, founder of Nile, has his estate here, once the house of an old film mogul; after buying it he bought the neighbours on either side, and the garage connects through an underground passage to a private warehouse where every item in his collection is shelved under a Nile code. Nile's delivery drones are forbidden to fly over the estate, and parcels must be handed to a human butler at the gate. Parking Lot Road, the busiest in the state, passes through the district, its tolls calculated at the 'willingness-to-pay price'; when a car from here joins it, the price board pauses for a moment, as though carrying out a revaluation.\nAt dawn gardeners, pool cleaners and dog walkers arrive from all over the basin and scan their faces to get through the mansion gates; at noon the designer shops are lined with cars left running, their drivers leaning on the doors swapping gossip about their employers. At night the mansion lights come on one by one, and the security patrol cars cruise slowly along the winding roads, their roof lights brighter than the street lamps."
  codes:
    admin: '060203'
  population: 60000
  area_km2: 80.0
  traits: { industries: [luxury, security, entertainment], heritage: ca_anglo, income: 4.5 }
- id: div_4y0zrw
  subtype: borough
  parent: div_w1vh1a
  status: generated
  names:
    zh: 马里买区
    en: Malibuy District
    es: Malicompra
  notes:
    zh: "马里买区在失落天使西边，是几十公里长的海岸，面积约 450 平方公里，只住着约 2.5 万人，人均 GDP 约 46.5 万美元，是全市最高的区。豪宅一栋挨一栋排在海滩上，背后的山坡是常常着火的灌木丛。海滩在法律上是公共的，可通往海滩的每条路都被私宅挡住，公众只能从海上游过去；豪宅主人为此雇了人工智能律师，每年起诉几千名「非法晒太阳者」。山火季时私人消防队只救买了套餐的房子，消防车开过没买套餐的人家，会礼貌地按一下喇叭。\n全景监狱技术公司创始人彼得·斯蒂尔的庄园面朝大海，一栋客房改成了延寿诊所，里面有冷冻舱和输血设备，另一栋存着他「数字分身」所需的全部资料，通往海滩的私人道路两头装着人脸识别闸门，用的是他自己公司的软件。网红金伯莉·克劳特的庄园每个角落都按拍照的需要设计，草坪按季节换颜色，她的数字分身每天替她发几十条动态，粉丝们说分身比本人更像本人。两座庄园各有一条私人公路通到门口。\n区里靠富豪私人服务、影视和私人安保过日子，在这里上班的厨师、保镖和摄影师每天顺着海边的公路进出，堵在路上时看得见海，却下不去。冲浪的人从邻区划着板子漂过来，在豪宅前的浪里玩一下午，律师的无人机在头顶盘旋，等他们一上岸就递上传票。"
    en: "Malibuy District, west of Lost Angeles, is a coastline tens of kilometres long, about 450 square kilometres with only some 25,000 people, and its GDP per head of about 465,000 dollars is the highest of any district in the city. Mansions stand shoulder to shoulder along the beach, backed by brush-covered slopes that often catch fire. By law the beach is public, but every road to it is blocked by private houses, so the public can only reach it by swimming in from the sea; the homeowners employ AI lawyers who sue thousands of 'illegal sunbathers' every year. In fire season the private fire brigades save only the houses that have bought a package, and when a fire engine passes a house that has not, it politely sounds its horn.\nPeter Steel, founder of Panopticon Technologies, has an estate facing the sea, one of its guest houses converted into a longevity clinic with cryogenic pods and transfusion equipment and another holding all the data his 'digital double' needs; the private road to the beach has face-recognition gates at both ends, running his own company's software. The influencer Kimberly Klout's estate is designed in every corner for photography, its lawn changing colour with the seasons, and her digital doubles post dozens of updates a day on her behalf, so that fans say the doubles are more like her than she is. Each estate has its own private road to the gate.\nThe district lives on private services for the very rich, film and private security; the cooks, bodyguards and photographers who work here drive in and out along the coast road every day, and when stuck in traffic they can see the sea but cannot get down to it. Surfers paddle over from the next district to spend an afternoon in the waves in front of the mansions, while lawyers' drones circle overhead, ready to serve a writ the moment they come ashore."
  codes:
    admin: '060204'
  population: 25000
  area_km2: 450.0
  traits: { industries: [luxury, entertainment, security], heritage: ca_anglo, income: 5.0 }
- id: div_rwfcw9
  subtype: borough
  parent: div_w1vh1a
  status: generated
  names:
    zh: 烟雾谷区
    en: Smogdale District
    es: Valle del Smog
  notes:
    zh: "烟雾谷区是失落天使盆地南部人口最多的工人区，全区 90 万人，面积约 350 平方公里，平房、仓库和货运场被两条领道的立交桥切开，车流最大的停车场领道从区里穿过，烟雾谷—破产中心公路通往市中心。失落天使国际机场在区西边靠海的平地上，两条东西向的跑道，离市中心只有十几公里，开车却常常要两个小时，航站楼外排着按分钟计价的直升机出租车。夏天的烟雾在盆地里散不出去，空气质量提醒一年有两百多天是橙色。\n附近的工厂换成机器人后，区里的人大多在仓库、外卖和家政平台上打零工，全区人均 GDP 约 4.3 万美元，收入中位数约 1.5 万，母语讲英语和西班牙语的人差不多各占一半，未满 15 岁的孩子占 21%。这里是两个警察分局的交界，两边的警车有时在路口对峙一整夜；区里的第七分局警员在制服外套一件紫色背心，市民叫他们「紫衫帮」，晚上收「平安费」，白天开罚单，有一次划界，一夜之间把十几条街的路灯刷成了紫色。\n清晨四五点，公交站上挤满了去仓库上早班的人，手机里同时开着三四个接单应用；傍晚，平房的院子里飘出烤肉和玉米饼的香味，孩子们在立交桥下的空地上踢球，抬头就是一架接一架降落的飞机。上次选举，民主党得票 42.1%，拔插头联盟 23.9%，工人团结党 13.5%，拔插头联盟在这里的支持者最爱说的一句话是「先拔掉排班算法」。"
    en: "Smogdale District is the most populous working-class district of the Lost Angeles basin, in its south, home to 900,000 people over some 350 km², its bungalows, warehouses and freight yards cut up by the interchanges of two state roads; Parking Lot Road, the busiest of all, runs through it, and the Smogdale–Downturn Road leads to the city centre. Lost Angeles International Airport lies on the flat land by the sea in the west of the district, with two east–west runways; it is only a dozen or so kilometres from the centre, yet the drive often takes two hours, and helicopter taxis charging by the minute queue outside the terminal. In summer the smog cannot escape the basin, and the air quality alert is orange on more than two hundred days a year.\nSince the nearby factories switched to robots, most people work gig shifts in warehouses and on delivery and cleaning apps; GDP per head is about $43,000 and median income about $15,000, English and Spanish speakers are roughly half and half, and children under 15 make up 21% of the population. It lies where two police divisions meet, and their patrol cars sometimes face each other down at a crossroads all night. Officers of the district's Seventh Precinct wear a purple vest over their uniforms, so people call them the 'Purple Shirts'; they collect 'safety fees' by night and write tickets by day, and once, during a boundary dispute, painted the street lights of a dozen streets purple overnight.\nAt four or five in the morning the bus stops are packed with people heading for early warehouse shifts, three or four job apps open on their phones at once; in the evening the smell of grilled meat and tortillas drifts from the bungalow yards, and children play football on waste ground under the interchanges, with plane after plane coming in to land overhead. At the last election the Democratic Party took 42.1% of the vote, the Unplug League 23.9% and the Workers' Solidarity Party 13.5%; the Unplug League's supporters here like to say 'Unplug the scheduling algorithm first'."
  codes:
    admin: '060205'
  population: 900000
  area_km2: 350.0
  traits: { industries: [logistics, gig, manufacturing], heritage: ca_latino, age: young, income: 0.55 }
- id: div_3rwj4m
  subtype: borough
  parent: div_w1vh1a
  status: generated
  names:
    zh: 搁浅滩区
    en: Long Beached District
    es: Playa Varada
  notes:
    zh: "搁浅滩区是失落天使的港区，面积约 250 平方公里，住着约 52 万人。搁浅滩港的几道突堤上是集装箱、散货和油品码头，码头已经全部无人化，起重机和集卡由同一个人工智能调度。码头工人被裁掉之后组织了长达数年的罢工，调度系统也跟着「罢工」了一次：它算出等罢工结束最划算，于是几十艘货轮至今还搁在港外排队，船员在甲板上种菜。滞港湾的防波堤外，排队的货轮最多时排出去几十公里，船员不许上岸，区里的人划着小船去船上买鸡蛋。海滩上有一艘老邮轮改成的旅馆。\n区里靠港口航运、物流仓储和无人工厂过日子，人均 GDP 约 10 万美元。码头上最忙的是执法局的检查站，每个集装箱都要扫描，扫出来的不只有走私货，偶尔还有躲在里面的人；港口分局被市民叫作「码头帮」，哪艘船想早点靠泊，就得交一笔「引航协助费」，协助的办法是让排在前面的船再多等几天。地铁 3 号线的十三座车站全在区里，从晨星站一路排到搁浅滩港站，约 16.8 公里，是全市最长的一条，早上挤满去港口和仓库上班的人。停车场领道从区里穿过，货车和通勤车在出口挤成一团。\n傍晚，老邮轮旅馆的甲板酒吧里坐满了人，看夕阳落在排队的货轮后面；货轮上的船员也在看岸上的灯，两边隔着几公里海水互相挥手。码头工人的老工会会所还开着，墙上挂着罢工时的旗子，退休的老工人每周来打一次牌。"
    en: "Long Beached District is Lost Angeles's port district, about 250 square kilometres with some 520,000 people. The moles of the Port of Long Beached carry container, bulk and oil terminals, now fully automated, with cranes and container lorries dispatched by a single AI. After the dockers were laid off they staged a strike that lasted years, and the dispatch system went on 'strike' too: it calculated that waiting for the strike to end was the cheapest option, so dozens of freighters are still stranded in the queue outside the port, their crews growing vegetables on deck. At its longest the queue of ships outside the Backlog Bay breakwater stretches for tens of kilometres; the crews may not come ashore, and local people row out in small boats to buy eggs from them. On the beach, an old cruise liner has been turned into a hotel.\nThe district lives on port and shipping, logistics and lights-out factories, with GDP per head of about 100,000 dollars. The busiest place on the docks is the Agency checkpoint, where every container is scanned and what turns up is not only contraband but sometimes people hiding inside; the Harbour Precinct is known locally as 'the Dock Gang', and any ship wanting an earlier berth must pay a 'pilotage assistance fee', the assistance consisting of making the ships ahead wait a few days longer. All thirteen stations of Metro Line 3 are in the district, running about 16.8 kilometres from Morning Star to Port of Long Beached, the longest line in the city, packed in the mornings with people going to work at the port and the warehouses. Parking Lot Road crosses the district, with lorries and commuters jammed together at the exits.\nIn the evenings the deck bar of the old liner hotel fills with people watching the sun set behind the queuing freighters, while the crews on board watch the lights on shore, the two sides waving to each other across kilometres of sea. The dockers' old union hall is still open, the banners from the strike on its walls, and retired dockers come once a week to play cards."
  codes:
    admin: '060206'
  population: 520000
  area_km2: 250.0
  traits: { industries: [port, logistics, robotics], heritage: ca_mixed, income: 0.7 }
- id: div_7jac05
