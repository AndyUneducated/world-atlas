    en: The old home of the film business, its name spelt out in huge white letters on the hillside, one of which has been bought by a streaming company for naming rights. The studios are still busy, but most of the sound stages hold green screens and servers, and actors license their faces and voices to artificial intelligence by the use. The queues for auditions on the street are longer than ever, because what people now audition for is the right to be scanned. The stars on the Walk of Fame have become QR codes that show a star's work from before and after death.
