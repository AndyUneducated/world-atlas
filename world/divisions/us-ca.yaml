    es: Meseta de Lava
  notes:
    zh: "熔岩高原区是雷达克特东边的熔岩高原和湖泊，面积约 2.9 万平方公里，平均海拔七百多米，只住着约 1.5 万人。级联故障山脉南端的火山重启峰在区的西部，海拔 2343 米，山下有冒着热气的泥潭、硫磺泉和温泉。大停电的第三天，电网工程师就是在山下的地热电站手动重启了全州电网，电站门口至今挂着一块牌子：「先拔掉，再插上」。区里靠乳业与畜牧、自然保护与巡护和地热能源过日子，居民大多是欧洲裔的牧场人家。\n高原上的牧场主比牛少，牛比野马少，野马比熔岩洞少。熔岩洞冬暖夏凉，牧场主拿来存奶酪，巡护员拿来数蝙蝠，夏天的游客打着手电钻进去，出来时常常认错了洞口。离线领道沿估值山脉东麓一路北上，在这里走到尽头；绿雾领道从涂黑区上来，也在高原上收尾，两条领道上开车几十公里看不见一户人家。\n东北海岸外的脱离岛也归本区，岛上是松林和熔岩，待建州运动的支持者在岛上升起过自己的旗，宣布这里是「新州的第一块领土」。岛上的二十几户人家至今自称「已经独立」，但每个月照样坐船到本岛领社会保障支票，顺便在镇上的杂货店买一个月的罐头。"
    en: "Lava Plateau District is the lava plateau and lakes of eastern Redacted, about 29,000 square kilometres at an average height of over seven hundred metres, with only some 15,000 people. Mount Reboot, the volcano at the southern end of the Cascading Failure Range, stands in the west of the district, 2,343 metres high, with steaming mud pots, sulphur springs and hot springs below it. On the third day of the great blackout, grid engineers restarted the state's power grid by hand at the geothermal power station at its foot, and a sign still hangs at the station gate: 'Unplug it, then plug it back in.' The district lives on dairy and livestock, nature conservation and geothermal energy, and most residents are ranching families of European descent.\nOn the plateau there are fewer ranchers than cattle, fewer cattle than wild horses, and fewer wild horses than lava caves. The caves are warm in winter and cool in summer; ranchers store cheese in them, rangers count bats in them, and summer tourists go in with torches and often come out by the wrong entrance. Offline Road runs north along the eastern foot of the Sierra Valuation and ends here; Green Haze Road climbs up from Blackout District and also finishes on the plateau, and on both one can drive for tens of kilometres without seeing a house.\nSecession Island off the north-east coast also belongs to the district, a place of pine forest and lava where supporters of the statehood movement once raised their own flag and declared it 'the first territory of the new state'. The twenty-odd households on the island still say they are 'already independent', but every month they take the boat to the main island to collect their social security cheques, and pick up a month's worth of tinned food at the general store while they are there."
  codes:
    admin: '061503'
  population: 15000
  area_km2: 29000.0
  traits: { industries: [dairy, conservation, geothermal] }

# ── 帕姆斯普林克勒市──
- id: div_aq1ydw
  subtype: locality
  parent: div_x2z14w
  status: generated
  names:
    zh: 帕姆斯普林克勒市
    en: Palm Sprinklers City
    es: Palmas Aspersoras
  notes:
    zh: "帕姆斯普林克勒市在自治州东南，是一座荒漠城市，全市 23 万人，面积 7.3 万平方公里，是自治州面积最大的市。喷灌区是边检山脉山脚的绿洲城，几十座高尔夫球场在荒漠里每天喷掉的水够一座城市用，豪华度假村和养老社区挤在球场之间；帝国尘区是城东的帝国尘谷农田、苏打饼海和一直伸到东海岸的大荒漠。城名来自喷灌头：这里的棕榈树和草坪全靠喷灌活着，市政府的标志就是一只喷着水的喷头。\n这里是炎热的沙漠气候，一年雨水只有 140 毫米左右，七月白天平均 42 °C，最高纪录 53.1 °C。全市靠旅游、种植业、富豪私人服务和医疗疗养过日子，人均 GDP 约 8.6 万美元，收入中位数 1.8 万美元；三成多的居民过了 65 岁，讲西班牙语的约四分之一，在帝国尘谷的农田里则占四成多。全市最高的订阅峰是付费墙山脉的主峰，海拔 2463 米，上山的步道按月收费；喷灌区背后的通关峰有缆车直上山顶，缆车站设着执法局的检查站。东海岸的尘湾边有一座海水淡化厂，淡出来的水全部送去喷灌区的球场；海上的海市蜃楼岛卖出过几千套「沙漠智慧城市」的期房，至今只有一块广告牌。帝国尘区的沙漠深处还有一座执法局的拘押营。\n仓储领道从失落天使翻过付费墙山脉东端的山口，在喷灌区走到尽头，翻山一段按海拔收费；边墙领道从圣遣返翻过边检山脉过来，也在喷灌区收尾；次日达领道从仓储帝国过来，在帝国尘区走到尽头；喷灌—帝国尘公路一百多公里，把绿洲和农田连起来。政治上清一色：11 席的市议会全归共和党，市长埃弗里·卡什莫尔在两名共和党人对决的决选中以 52.6% 胜出。\n帕姆斯普林克勒是两个世界：喷灌区的退休富豪在四十五度的夏天打高尔夫，球车上装着空调；帝国尘区的农场雇工在同样的天气里摘蔬菜，休息时躲在卡车下面的阴影里。苏打饼海的湖水越来越咸，湖岸退出几公里，风一吹湖床上的尘土就飘到城里，城里的医生说，看哮喘的病人一年比一年多。每年春天，荒漠里会办一场持续两个周末的音乐节，一张票的价格是一个雇工三个月的工资。棕榈树下的喷雾器一天开十几个小时，路过的雇工会停下来，在水雾里站上几秒再走；城旗上那棵青绿色的棕榈，是旗上唯一需要浇水的颜色。"
    en: "Palm Sprinklers City is a desert city in the south-east of the autonomous state, with 230,000 people and 73,000 square kilometres, the largest city in the state by area. Sprinkler District is the oasis town at the foot of the Checkpoint Range, where dozens of golf courses spray enough water into the desert every day to supply a city, with luxury resorts and retirement communities squeezed in between the fairways; Imperial Dust is the farmland of the Imperial Dust Valley east of the city, the Saltine Sea and the great desert reaching to the east coast. The city is named after sprinkler heads: its palms and lawns survive only on sprinklers, and the city government's logo is a sprinkler spraying water.\nThe climate is hot desert, with only about 140 millimetres of rain a year, July days averaging 42 °C and a record of 53.1 °C. The city lives on tourism, farming, private services for the very rich, and healthcare and spas; GDP per head is about 86,000 dollars and the median income 18,000. More than three in ten residents are over 65, and about a quarter speak Spanish, rising to more than four in ten in the farmland of the Imperial Dust Valley. The city's highest point is Mount Subscription, the main summit of the Paywall Range, 2,463 metres high, whose trail is charged by the month; behind Sprinkler District a cable car climbs to the top of Mount Clearance, with an Agency checkpoint at the cable car station. On Dust Bay on the east coast a desalination plant sends every drop it makes to the golf courses of Sprinkler District, and out at sea Mirage Island has sold thousands of off-plan flats in a 'desert smart city' that so far consists of a single billboard. Deep in the desert of Imperial Dust there is also an Agency detention camp.\nWarehouse Road crosses the pass at the eastern end of the Paywall Range from Lost Angeles and ends in Sprinkler District, its mountain section tolled by altitude; Wall Road comes over the Checkpoint Range from San Deportes and also finishes in Sprinkler District; Next-Day Road comes in from Warehouse Empire and ends in Imperial Dust; and the Sprinkler–Imperial Dust Road, over a hundred kilometres long, links the oasis with the farmland. Politics is all one colour: every one of the 11 seats on the City Council belongs to the Republicans, and the mayor, Avery Cashmore, won a run-off between two Republicans with 52.6 per cent.\nPalm Sprinklers is two worlds: the retired rich of Sprinkler District play golf in forty-five-degree summers in air-conditioned buggies, while the farm workers of Imperial Dust pick vegetables in the same weather and rest in the shade under their lorries. The Saltine Sea grows saltier, its shore has retreated several kilometres, and when the wind blows the dust from the lake bed drifts into town; the city's doctors say they see more asthma patients every year. Every spring a music festival lasting two weekends is held in the desert, and one ticket costs three months of a farm worker's wages. The misters under the palms run for a dozen hours a day, and passing farm workers stop to stand in the spray for a few seconds before moving on; the turquoise palm on the city flag is the only colour on it that needs watering."
  codes:
    admin: '061600'
  population: 230000
  area_km2: 73000.0
  color: '#E9C46A'
  flag: { layout: horizon, colors: ['#F4A261', '#E9C46A', '#2A9D8F'], charge: palm, charge_color: '#2A9D8F' }
  flag_notes:
    zh: "橙色的天空下是沙黄色的荒漠，地平线上一棵青绿色的棕榈。青绿是喷灌出来的草坪，也是城旗上唯一需要浇水的颜色；市政府每年为城旗拨一笔「颜色维护费」，用来重新印刷褪色的旗子。"
    en: "Sand-yellow desert under an orange sky, with a blue-green palm on the horizon. The blue-green is the sprinkled lawns, the only colour on the flag that needs watering; every year the city sets aside a 'colour maintenance fund' to reprint faded flags."
  traits: { industries: [tourism, agriculture, luxury, healthcare], heritage: ca_latino, age: old, income: 0.85 }
  symbols: {"flower": {"zh": "沙漠月见草", "en": "Desert evening primrose"}, "tree": {"zh": "加州蒲葵", "en": "California fan palm"}}
- id: div_g96sq9
  subtype: borough
  parent: div_aq1ydw
  status: generated
  names:
    zh: 喷灌区
    en: Sprinkler District
    es: Aspersores
  notes:
    zh: "喷灌区在边检山脉东麓，是帕姆斯普林克勒的绿洲城，面积约 6000 平方公里，住着约 15 万人，占全市三分之二。几十座高尔夫球场、度假村和养老社区在荒漠里一字排开，街道两旁的棕榈树都装着喷雾器，草坪绿得发亮，浇草坪的水有一部分来自东海岸尘湾边的海水淡化厂。区里靠旅游、富豪私人服务和医疗疗养过日子，疗养院、整形诊所和高尔夫球场一样多，人均 GDP 约 10 万美元，比城东的帝国尘区高出将近一倍。\n山上有一条缆车从球场边直上通关峰的山顶，通关峰海拔 2433 米，是边检山脉的主峰，山下四十五度，山顶有时在下雪。缆车站设着执法局的检查站，上山要出示证件，下山还要再出示一次，登山者说这是全州唯一要「出入境」两次的山。仓储领道从失落天使翻过付费墙山脉东端的山口进区，边墙领道从边检山脉过来，两条领道都在这里走到尽头；喷灌—帝国尘公路从区里向东伸进农田。\n夏天中午街上几乎没有人，退休的富豪坐着装了空调的球车打球，球童和园丁则在清晨四五点就开始干活，赶在太阳升高之前收工。冬天是旺季，从湾区和失落天使来避寒的人把度假村住满，周末的夜里，泳池边的派对一直开到凌晨。"
    en: "Sprinkler District, on the eastern flank of the Checkpoint Range, is the oasis town of Palm Sprinklers, about 6,000 square kilometres with some 150,000 people, two thirds of the city. Dozens of golf courses, resorts and retirement communities line up across the desert, the palms along the streets are all fitted with misters, and the lawns glow green, part of the water for them coming from the desalination plant on Dust Bay on the east coast. The district lives on tourism, private services for the very rich, and healthcare and spas, with as many sanatoriums and cosmetic surgery clinics as golf courses, and its GDP per head of about 100,000 dollars is nearly double that of Imperial Dust to the east.\nA cable car climbs from beside the fairways to the summit of Mount Clearance, the main peak of the Checkpoint Range at 2,433 metres; it can be forty-five degrees at the bottom and snowing at the top. The cable car station has an Agency checkpoint, papers must be shown on the way up and again on the way down, and climbers say it is the only mountain in the state where you 'clear immigration' twice. Warehouse Road enters the district over the pass at the eastern end of the Paywall Range from Lost Angeles and Wall Road comes in over the Checkpoint Range, both ending here, and the Sprinkler–Imperial Dust Road runs east from the district into the farmland.\nAt summer noon the streets are almost empty, the retired rich play their rounds in air-conditioned buggies, and the caddies and gardeners start work at four or five in the morning to finish before the sun gets high. Winter is high season, when people escaping the cold from the Bay Area and Lost Angeles fill the resorts, and on weekend nights the poolside parties go on until the small hours."
  codes:
    admin: '061601'
  population: 150000
  area_km2: 6000.0
  traits: { industries: [tourism, luxury, healthcare], heritage: ca_mixed, income: 1.2 }
- id: div_4c9mhq
  subtype: borough
  parent: div_aq1ydw
  status: generated
  names:
    zh: 帝国尘区
    en: Imperial Dust District
    es: Polvo Imperial
  notes:
    zh: "帝国尘区在喷灌区以东，面积约 6.7 万平方公里，几乎占了帕姆斯普林克勒的全部地盘，住着约 8 万人。西边是帝国尘谷的农田，靠一条从北边引来的水渠灌溉，冬天种的蔬菜运往全州；中间是苏打饼海，一次水渠决口灌出来的咸水湖，没有出口，湖水越来越咸，鱼一批批死去，退出几公里的湖床白花花一片，风一吹满天是咸味的尘土，本地人说尝起来像苏打饼干；再往东是一直伸到东海岸的荒漠，有沙丘、太阳能电站和一个军用靶场，靶场边上的小镇以卖防晒霜和子弹壳纪念品为生。全市最高的订阅峰也在区里，海拔 2463 米。\n区里靠种植业、国防和光伏与陆上风电过日子，人均 GDP 约 5.5 万美元，讲西班牙语的四成多。东海岸的尘湾海水常被沙尘染成土黄色，湾边只有一座海水淡化厂和一个渔村；海上的海市蜃楼岛卖出过几千套期房，买房的人每年乘船来看一次那块「即将上线」的广告牌。次日达领道从仓储帝国过来，在区里走到尽头，喷灌—帝国尘公路从西边的绿洲伸进来。\n沙漠深处有一座执法局的拘押营，用集装箱、帐篷和铁皮板房搭成，四周几十公里没有人家，夏天气温超过五十度，发电机和空调时常停摆，被关在里面的人只能硬熬。通往营地的十五公里公路边立着一块牌子：「前方拘押营，请勿停车，请勿拍照，请勿好奇」。谷里的雇工天不亮就下地，中午最热的时候躲在卡车底下的阴影里喝水。"
    en: "Imperial Dust District lies east of Sprinkler District, about 67,000 square kilometres, almost the whole territory of Palm Sprinklers, with some 80,000 people. In the west is the farmland of the Imperial Dust Valley, irrigated by a canal brought in from the north, whose winter vegetables go to the whole state; in the middle is the Saltine Sea, a salt lake created when a canal burst its banks, with no outlet, its water growing saltier and its fish dying off in waves, the lake bed exposed for several kilometres in a glaring white, and when the wind blows the sky fills with salty dust that locals say tastes like saltine crackers; and further east the desert reaches to the east coast, with dunes, solar power stations and a military firing range, beside which a small town lives on selling sunscreen and souvenir bullet casings. The city's highest summit, Mount Subscription, 2,463 metres, is in the district too.\nThe district lives on farming, defence, and solar and onshore wind; GDP per head is about 55,000 dollars, and more than four in ten people speak Spanish. The sea in Dust Bay on the east coast is often stained yellow-brown by dust, and its shore has only a desalination plant and a fishing village; out at sea, Mirage Island has sold thousands of off-plan flats, and the buyers take a boat out once a year to look at the billboard that says 'Coming Soon'. Next-Day Road comes in from Warehouse Empire and ends in the district, and the Sprinkler–Imperial Dust Road reaches in from the oasis to the west.\nDeep in the desert is an Agency detention camp built of containers, tents and sheet-metal huts, with no houses for tens of kilometres around; summer temperatures pass fifty degrees, the generators and air conditioning often break down, and the people held there can only endure it. Beside the fifteen-kilometre road to the camp stands a sign: 'Detention camp ahead. No stopping. No photographs. No curiosity.' The farm workers of the valley go into the fields before dawn and at the hottest time of day shelter in the shade beneath their lorries to drink water."
  codes:
    admin: '061602'
  population: 80000
  area_km2: 67000.0
  traits: { industries: [agriculture, defence, solar] }

# ── 玛门市──
- id: div_dyj07f
  subtype: locality
  parent: div_x2z14w
  status: generated
  names:
    zh: 玛门市
    en: Mammon City
    es: Mammón
  notes:
    zh: "玛门市在估值山脉东侧，是一座山地城市，全市 6 万人，面积约 3.5 万平方公里，地盘从估值山脉的高山湖区一直伸到东边的坏账谷，自治州最高峰独角兽峰就在城西北的山脊上。雪道区是山里的滑雪小城、垄断湖和高山草甸，坏账谷区是白皮书山脉、薄荷币山脉之间的荒漠盆地，其中最低的盆地夏天热得能把鸡蛋烤熟。城名来自滑雪场：雪道区的整座山被一家基金买下，山上的雪道、缆车、酒店和小城的每一间房子都归它所有，居民交给它的不是房租，而是「山地订阅费」。\n全州最高的三座山都在市里：独角兽峰 3516 米，十角兽峰 3325 米，两峰之间是海拔 2891 米的融资轮山口；南边的降价轮峰 3275 米，东坡陡落进坏账谷。每座峰都按「估值」挂牌，峰顶的估值牌每季度更新一次，数字只升不降，估值降了的山就得改名，降价轮峰就是这样来的。薄荷币山脉的主峰矿机峰下，废弃银矿的坑道里排着成千上万台断了电的加密货币矿机，蝙蝠在上面筑巢。\n全市靠冰雪运动、旅游和采矿与石料过日子，人均 GDP 约 8.1 万美元，收入中位数 2 万美元；年轻人多，过了 65 岁的只有一成多。这里冬冷夏热，一年雨水 550 毫米左右，山上的雪是全市的财富，也是基金财报里的一行，雪少的年份订阅费照收，雪道上铺的是人造雪。坏账谷的谷底有一片白得刺眼的盐滩，夜里没有一点灯光，银河清晰得像一条路，观星的人从湾区开车来，在废弃矿城附近露营一晚。离线领道沿估值山脉东麓穿过坏账谷区和雪道区，融资窗口领道从西边的阿尔蒙多穿过估值山脉的长隧道和高架桥到雪道区，开山的日子每年由人工智能预测，每年都晚两个星期。市长奎因·普雷斯科特在两名共和党人对决的决选中以 51.6% 胜出；9 席的市议会里共和党 6 席，防火绿党、民主党和加速党各 1 席。\n玛门人分成两种：冬天来滑雪、夏天来徒步的有钱人，和一年到头为他们开缆车、铺床、做饭的人，后者大多住在山脚的拖车营地里。登独角兽峰要先抽签拿许可证，抽不到的可以在山脚买「虚拟登顶」体验，戴上头盔就能看到山顶的风景，还能在社交网络上自动发一张登顶照片。坏账谷的荒漠里有一座废弃的矿城，矿城的老银行门上至今贴着「暂停兑付」。"
    en: "Mammon City lies east of the Sierra Valuation, a mountain city of 60,000 people covering some 35,000 square kilometres, from the high lake country of the Sierra Valuation to Bad Debt Valley in the east, and the state's highest summit, Mount Unicorn, stands on the ridge north-west of town. Ski District is the mountain ski town, Monopoly Lake and the alpine meadows, and Bad Debt Valley the desert basins between the White Paper Mountains and the Mintcoin Range, the lowest of which gets hot enough in summer to bake an egg. The city is named after its ski resort: the whole mountain in Ski District was bought by a fund, which owns its runs, lifts and hotels and every house in the town, and residents pay it not rent but a 'mountain subscription fee'.\nThe state's three highest mountains are all in the city: Mount Unicorn at 3,516 metres and Mount Decacorn at 3,325, with Funding Round Pass at 2,891 metres between them, and Mount Down Round to the south at 3,275 metres, its eastern face dropping steeply into Bad Debt Valley. Every summit is listed by 'valuation', with a valuation board on top updated every quarter; the figures only ever rise, and a mountain whose valuation falls must change its name, which is how Mount Down Round got its own. Beneath Mount Mining Rig, the main summit of the Mintcoin Range, the tunnels of an abandoned silver mine are lined with thousands upon thousands of dead cryptocurrency mining rigs, on which bats now nest.\nThe city lives on winter sports, tourism, and mining and quarrying; GDP per head is about 81,000 dollars and the median income 20,000. It has many young people, and only just over a tenth of residents are over 65. Winters are cold and summers hot, with about 550 millimetres of rain a year; the snow on the mountains is the city's wealth and a line in the fund's accounts, and in lean snow years the subscription fee is charged all the same and the runs are covered with artificial snow. On the floor of Bad Debt Valley lies a dazzling white salt flat, and at night there is not a single light, the Milky Way as clear as a road; stargazers drive out from the Bay Area to camp for the night near the abandoned mining town. Offline Road runs along the eastern foot of the Sierra Valuation through Bad Debt Valley and Ski District, and Funding Window Road comes from Almondo in the west through a long tunnel and over viaducts across the Sierra Valuation to Ski District; its opening day is forecast each year by AI and is two weeks late every year. The mayor, Quinn Prescott, won a run-off between two Republicans with 51.6 per cent; on the 9-seat City Council the Republicans hold 6 seats and the Firebreak Greens, the Democrats and the Accelerate Party 1 each.\nMammon people come in two kinds: the rich who come to ski in winter and hike in summer, and those who run the lifts, make the beds and cook for them all year round, most of whom live in trailer camps at the foot of the mountains. Climbing Mount Unicorn requires a permit won by lottery, and those who miss out can buy a 'virtual summit' experience at the bottom, putting on a headset to see the view from the top and automatically posting a summit photo on social media. In the desert of Bad Debt Valley stands an abandoned mining town, where a 'Withdrawals Suspended' notice is still stuck to the door of the old bank."
