  notes:
    zh: "中部海岸上的海滨城市，全市 22 万人，背靠付费墙山脉西段，面朝避税列岛，是全州气候最温和的地方：冬天不冷，夏天不热，一年三百天阳光。传教区是城市的中心，白墙红瓦的老传教站和一条棕榈大道通向海边；城西的乔什庄园区是乔什的家，他的私人山脉、葡萄园、赛车场和车牌厂占了大半个区；再往西北的露西芯城区是露西的家，她的芯片城、动物园和牙医诊所就是区里的全部经济。\n圣塞雷娜人说这里的治安是全州最好的，因为乔什和露西都怕吵：两家共同出钱让城里的警察分局「退休」，换成了只会指路的礼宾员。城里的人多在两家的产业里工作，酿酒的、修赛车的、照顾动物的、在洁净室里穿兔子服的，周末一起到海边的码头上吃鱼和薯条。市议会每年开会讨论一次要不要改城名，因为外地人总以为「塞雷娜」是一种芯片的型号。"
    en: "A seaside city on the central coast, with 220,000 people, its back to the western Paywall Range and its face to the Tax Shelter Islands, the mildest place in the state: winters are not cold, summers not hot, and the sun shines three hundred days a year. Mission District is the centre, where an old mission of white walls and red tiles and an avenue of palms lead down to the sea; west of the city, Josh Estate District is Josh's home, where his private mountains, vineyards, racetrack and number-plate factory take up most of the district; and further north-west, Lucy Chip City District is Lucy's home, where her chip city, zoo and dental clinic are the district's entire economy.\nSanta Serena people say it is the safest place in the state because Josh and Lucy both dislike noise: between them they paid for the city's police division to 'retire' and be replaced by concierges who only give directions. Most people in town work for one estate or the other, making wine, fixing racing cars, looking after animals or wearing bunny suits in clean rooms, and at weekends they all eat fish and chips together on the pier. Once a year the city council debates whether to change the city's name, since outsiders always take 'Serena' for a chip model."
  codes:
    admin: '061100'
  population: 220000
  area_km2: 11000.0
  color: '#E07A5F'
  flag: { layout: mirror, colors: ['#F4A261', '#2A9D8F'], charge: palm, charge_color: '#FFFFFF' }
  flag_notes:
    zh: "橙色的天空和青绿的大海在水平线上相对，一座小岛和它的倒影隔着水线互换颜色，岛上是一棵白色的棕榈。橙色是海边的日落，青绿是海峡，棕榈是传教区的那条大道；城旗由乔什和露西各出一半设计费，所以上下两半一样大。"
    en: "Orange sky and blue-green sea meet at the horizon, an island and its reflection counterchanged across the waterline, with a white palm on the island. The orange is the sunset over the sea, the blue-green the channel and the palm the avenue of Mission District; Josh and Lucy each paid half the design fee, which is why the two halves are the same size."
  traits: { industries: [semiconductor, wine, tourism, automotive], heritage: ca_anglo, age: balanced, income: 1.6 }
