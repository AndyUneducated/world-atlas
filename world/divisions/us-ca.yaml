  names:
    zh: 游说区
    en: Lobbyton District
    es: Cabildeo
  notes:
    zh: 首府的中心，州议会大厦、州长办公室和各厅局都在这里。议会大厦四周的街区几乎全是游说公司、律师事务所和筹款餐厅，门牌上写的不是公司名而是代表的行业：「石油」「杏仁」「人工智能」「监狱」。区里的公园叫宪法公园，草坪上常年搭着请愿者的帐篷。
    en: "The heart of the capital, home to the State Capitol, the governor's office and the state departments. The blocks round the Capitol are almost all lobbying firms, law offices and fundraising restaurants, their doorplates naming not a company but the industry they speak for: 'Oil', 'Almonds', 'Artificial Intelligence', 'Prisons'. The district's park is Constitution Park, its lawns covered all year with petitioners' tents."
  codes:
