    en: "The old city at the northern tip of the bay peninsula, its streets steep and its old cable cars still running, now driven by robots. Most of the painted wooden houses stand empty, kept just as they were by robots, and visitors can pay to see 'what it looked like when people lived here'. The Bayesian Metro has one line and two stations, about 2 km long, the shortest metro line in the world; its driverless trains shuttle back and forth to the timetable, often without a single person aboard. The three Fog Rocks outside the mouth of the bay and the detention island in the bay belong to the district."
  codes:
