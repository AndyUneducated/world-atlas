    es: Merlota
  notes:
    zh: "梅洛特市在湾区北边，是一座葡萄酒城，全市 18 万人，面积约 1.4 万平方公里，地盘从海湾北岸的山谷一直伸到北海岸和清除记录湖。赤霞珠丘区是谷地里一座接一座的酒庄，索诺莫尔区是西边更大的葡萄园、红杉林、海岸和湖区。山谷里的葡萄园按地块拍卖，一亩地的价格比失落天使市中心的写字楼还贵，酒庄的主人多是湾区的寡头，他们每年来一两次，在品酒会上宣布今年的酒「由人工智能调配」。\n全市靠酒庄与葡萄种植、旅游和富豪私人服务，人均 GDP 约 9.7 万美元，收入中位数却只有 2.1 万美元，钱和葡萄一样，都是别人家的。前国会议员南希·佩洛特雷德的酒庄宅邸在赤霞珠丘区，坡上种满赤霞珠，酒窖里每一桶酒的标签上都印着买入日期和卖出日期。谷底有一列慢吞吞的观光火车，车厢里供应品酒套餐；西边的清除记录湖水浅而温暖，湖边的温泉旅馆专门接待需要「消失几天」的名人，退房时替他们清除所有记录。\n这里是温和的地中海气候，夏天谷里白天约 30 °C，夜里海雾漫进来，正适合葡萄；一年雨水 600 多毫米，几乎全下在冬天。堵车领道穿过赤霞珠丘区，周末从湾区来品酒的车排成长队；广告牌领道纵贯索诺莫尔区，路边的广告牌一半在卖酒，一半在卖戒酒中心。全市讲英语的人超过八成，老人多，近三成居民过了 65 岁。市长麦迪逊·克劳利来自加州独立党，在决选中以 55.6% 的得票击败共和党对手；11 席的市议会里共和党 4 席，加州独立党 3 席，民主党和防火绿党各 2 席。\n梅洛特的酒标是这里最有名的艺术品：同一款酒，卖给游客的酒标上写着风土和年份，卖给投资者的酒标上写着收益率。山火季常常烧到葡萄园边上，烟熏过的葡萄酿出的酒被营销成「野火限定版」，价格翻倍。葡萄园里摘葡萄的雇工住在谷外的小镇，每天早上坐着酒庄的大巴进谷，晚上再坐出去，品酒室的游客很少看到他们。九月收获季是谷里最忙的时候，夜里打着探照灯摘葡萄，趁凉把果子送进压榨机，第二天一早，品酒室照常开门，像什么都没发生过。谷外小镇的周末集市卖雇工自家酿的酒，没有酒标，也没有收益率，价格只有谷里的零头，懂行的游客专门开车来买。索诺莫尔区的红杉林里，老伐木小镇改成了民宿，北海岸的悬崖上一年到头刮着冷风，来这里的人多半是在谷里喝多了，想吹一吹醒酒。"
    en: "Merlotte City, north of the Bay Area, is a wine city of 180,000 people covering some 14,000 square kilometres, reaching from the valleys on the north shore of the bay to the north coast and Clear History Lake. Cabernet Hills is winery after winery along the valleys, and Sonomore is the larger vineyards, redwood forests, coast and lakeland to the west. The valley vineyards are auctioned plot by plot, an acre costing more than an office building in downtown Lost Angeles; the winery owners are mostly Bay Area oligarchs who visit once or twice a year and announce at tastings that this year's wine was 'blended by AI'.\nThe city lives on wine, tourism and private services for the very rich; GDP per head is about 97,000 dollars, but the median income is only 21,000, for the money, like the grapes, belongs to someone else. The former congresswoman Nancy Pelotrade has her winery estate in Cabernet Hills, its slopes planted with Cabernet, and the label on every barrel in its cellar is printed with a buy date and a sell date. A slow tourist train runs along the valley floor serving tasting menus in its carriages; to the west, the shallow, warm waters of Clear History Lake are lined with hot-spring hotels that cater to celebrities who need to 'disappear for a few days' and wipe all their records when they check out.\nThe climate is mild Mediterranean: summer days in the valleys reach about 30 °C and sea fog drifts in at night, just what the grapes like, and the 600-odd millimetres of rain a year fall almost entirely in winter. Gridlock Road crosses Cabernet Hills, with long weekend queues of cars coming up from the Bay Area to taste wine, and Billboard Road runs the length of Sonomore, where half the roadside billboards sell wine and the other half sell rehab clinics. More than eight in ten people speak English, and there are many old people, nearly three in ten residents being over 65. The mayor, Madison Crowley, is from the California Independence Party and beat the Republican candidate in the run-off with 55.6 per cent of the vote; on the 11-seat City Council the Republicans hold 4 seats, the California Independence Party 3, and the Democrats and Firebreak Greens 2 each.\nMerlotte's wine labels are its most famous works of art: the same wine carries a label describing terroir and vintage when sold to tourists, and one describing the yield when sold to investors. In fire season the wildfires often burn right up to the vineyards, and wine made from smoke-tainted grapes is marketed as a 'Wildfire Limited Edition' at double the price. The pickers who harvest the grapes live in small towns outside the valley, riding the wineries' coaches in every morning and out again every evening, and the visitors in the tasting rooms rarely see them. The September harvest is the busiest time in the valleys: grapes are picked at night under floodlights and taken to the presses while it is cool, and the next morning the tasting rooms open as usual as though nothing had happened. The weekend markets in the towns outside the valley sell wine the pickers make at home, with no label and no yield, at a fraction of valley prices, and tourists in the know drive out specially to buy it. In the redwood forests of Sonomore the old logging towns have turned into guest houses, and on the north coast a cold wind blows over the cliffs all year; most people who come here have had too much to drink in the valleys and want the wind to sober them up."
