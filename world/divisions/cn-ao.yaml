    zh: 北岸外海的渔猎群岛，由大猎岛和鱼叉岛组成，15 万人，是塔夫鲁利特人传统的海上猎场。大猎岛面积约 1 万平方公里，在领地命名岛屿中排第三；海岸岩石上刻着鲸、海豹与皮划艇的岩雕。猎人海峡宽约 5 公里，猎人岬是出海的地标。
    en: The Hunting Islands off the north coast, Great Hunting Island and Harpoon Island, with 150,000 people, the traditional sea-hunting grounds of the Tavrulit. Great Hunting Island, about 10,000 km², is the third largest named island in the territory, and carvings of whales, seals and kayaks cover the shore rocks. Hunters' Strait is about 5 km wide, and Hunter's Cape is the landmark for putting out to sea.
