    en: The capital of the Tavrulit Indigenous Autonomous Region, with 291,000 people working mainly in government, heritage and education. The Tavrulit Council of Elders, the cultural centre and the sled race grounds are all here; the cultural centre holds rock and bone carvings and skin drums and hosts a drum-dance festival every midwinter, and the dog-sled races set out from here along the old sled trails across the tundra. Aqqanik Airport has flights to the capital and the herding towns of the tundra. The Nuqattaaq–Aqqanik Expressway ends here, the Nirsavaq Expressway crosses the district on the Aqqanik Viaduct, the Aqqapituk Road begins here, and a city road leads into the Reindeer Migration reserve.
