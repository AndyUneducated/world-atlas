- id: div_ek897t
  subtype: borough
  parent: div_8c2skk
  status: generated
  names:
    zh: 阿卡尼克区
    en: Aqqanik District
    art-x-tavrunaq: Aqqanik
  notes:
    zh: "阿卡尼克区是塔夫鲁利特原住民自治区的首府，面积 2980 平方公里，29.1 万人，以行政、文化遗产和高等教育为主，第三产业占 85%。塔夫鲁利特长老议事会、文化中心和雪橇赛场都在区内：长老议事会审议涉及土地、狩猎与迁徙路线的领地法案；文化中心收藏岩雕、骨雕与皮鼓，传唱口述史诗，每年冬至举办鼓舞节；狗拉雪橇赛从雪橇赛场出发，沿传统雪橇道穿越苔原。码头大道、卡拉克大街和皮匠大道是城里的主街，主要街道上方有约 7 公里的暖廊。阿卡尼克机场有航班飞往首府和苔原上的牧区小镇。努阿高速在这里结束，尼尔萨瓦克高速以阿卡尼克高架桥经过区内，阿卡皮图克公路从这里出发，阿卡尼克—尼尔萨图维特公路通往驯鹿迁徙保护区。塔夫鲁纳克语母语者占 58%，选民里塔夫鲁利特人民党得票最多。\n极夜里文化中心的会堂一连几个晚上举行史诗诵唱，长老们伴着皮鼓的节奏口述祖先的故事；鼓舞节那晚，会堂里的每一面皮鼓都要被敲响，连馆藏的老鼓也不例外。春天雪橇赛期间，机场挤满了从各地赶来的选手和观众，雪橇犬也坐飞机来，候机厅里此起彼伏的狗叫声是阿卡尼克春天的信号；最后一名到达终点的选手会得到一盏油灯，意思是「再黑的路也走完了」。"
    en: "Aqqanik District is the capital of the Tavrulit Indigenous Autonomous Region, 2,980 km² with 291,000 people, living on government, heritage and higher education, with services making up 85% of the economy. The Tavrulit Council of Elders, the Cultural Centre and the sled race grounds are all here: the Council of Elders considers territorial bills touching land, hunting and migration routes; the Cultural Centre keeps rock carvings, bone carvings and skin drums, keeps the spoken epics alive and holds a drum-dance festival every winter solstice; and the dog-sled race sets out from the race grounds along the old sled trails across the tundra. Quay Avenue, Kallaaq Boulevard and Tanners' Avenue are the main streets, with some 7 km of skyways above them. Aqqanik Airport has flights to the capital and the herding towns of the tundra. The Nuqattaaq–Aqqanik Expressway ends here, the Nirsavaq Expressway passes through on the Aqqanik Viaduct, the Aqqapituk Road starts here, and the Aqqanik–Nirsatuvvit Road leads to the reindeer migration reserve. 58% of residents are native Tavrunaq speakers, and the Tavrulit People's Party wins the most votes.\nIn the polar night the Cultural Centre's hall hosts recitals of the epics for several nights running, the elders telling their ancestors' stories to the beat of skin drums; on the night of the drum-dance festival every drum in the hall must be beaten, even the old ones in the collection. During the spring sled race the airport fills with mushers and spectators from all over, the sled dogs fly in too, and the barking that echoes round the terminal is Aqqanik's sign of spring; the last musher to finish is given an oil lamp, meaning \"however dark the road, you walked it to the end\"."
  codes:
    admin: '921001'
  population: 291100
  area_km2: 2980.0
  traits: { industries: [government, heritage, education], heritage: polar_mixed }
- id: div_m34jqk
  subtype: borough
  parent: div_8c2skk
  status: generated
  names:
    zh: 阿卡皮图米乌特区
    en: Aqqapitummiut District
    art-x-tavrunaq: Aqqapitummiut
  notes:
    zh: "阿卡皮图米乌特区是塔夫鲁利特原住民自治区北部沿海的传统猎场，面积 28000 平方公里，11.1 万人，塔夫鲁纳克语母语者占 81%，区名带着 -miut「……的人」，意思是阿卡皮图克一带的人。冬季猎人沿海冰上的雪橇道猎海豹和海象、凿冰捕鱼，夏季划皮划艇和小船出海，渔猎占经济的三分之一以上，第一产业占 36%。这里离海岸不远却是大陆性的冬天，最低纪录零下 45 度，夏天最暖能到 23 度。阿卡皮图克公路在区内延伸约 115 公里，雪橇道与公路交叉处冬季雪橇优先；努基高速和尼尔萨瓦克高速也经过区内。图帕克大道、上海大道和广州大道是沿海几个镇上的主街，镇上有冷库、渔具店和修船的小作坊。孩子多，14 岁以下的约占两成。选民里塔夫鲁利特人民党得票近四成，长老之道居次。\n公路和雪橇道交叉的地方立着醒目的牌子，冬天开车的人看见雪橇队过来，要停车熄火等它过去，司机们说这是「苔原上的红绿灯」。春天海冰开始松动时，老猎人带着年轻人到冰边上，教他们凭冰的颜色和声音判断哪里能走；夏天渔船归港，全镇的人到码头帮忙分鱼，按老规矩，第一条海豹的肉要先分给镇上的老人。"
    en: "Aqqapitummiut District is the traditional hunting ground on the north coast of the Tavrulit Indigenous Autonomous Region, 28,000 km² with 111,000 people, 81% of them native Tavrunaq speakers; its name carries -miut, \"people of\", meaning the people of the Aqqapituk country. In winter hunters follow sled trails over the sea ice for seals and walruses and fish through holes in the ice, in summer they put to sea in kayaks and small boats, and hunting and fishing make up over a third of the economy, the primary sector 36%. Though near the coast, its winters are continental, with a record low of −45 °C, while summer can reach 23 °C. The Aqqapituk Road runs about 115 km through the district, and where sled trails cross it sleds have right of way in winter; the Nuqattaaq–Kiluktuar and Nirsavaq expressways also pass through. Tuuppak Avenue, Shanghai Avenue and Guangzhou Avenue are the main streets of the coastal villages, with cold stores, tackle shops and small boat-repair workshops. Children are many, about a fifth of the population under 15. The Tavrulit People's Party takes nearly two-fifths of the vote, with the Way of the Elders second.\nProminent signs stand where road and sled trail cross, and in winter drivers who see a sled team coming must stop and switch off until it has passed; they call it \"the tundra's traffic lights\". When the sea ice begins to loosen in spring, old hunters take the young ones to the ice edge to teach them to judge where it will bear by its colour and sound; when the boats come home in summer the whole village turns out on the quay to share the catch, and by old custom the meat of the first seal goes first to the village's elders."
  codes:
    admin: '921002'
  population: 111000
  area_km2: 28000.0
  traits: { industries: [hunting, fishing] }
- id: div_d9hctg
  subtype: borough
  parent: div_8c2skk
  status: generated
  names:
    zh: 尼尔萨瓦克区
    en: Nirsavaq District
    art-x-tavrunaq: Nirsavaq
  notes:
    zh: "尼尔萨瓦克区是领地首府西北、塔夫鲁利特原住民自治区南部的大片牧场，面积 37800 平方公里，16.6 万人，区名来自 nirsa「驯鹿」，塔夫鲁纳克语母语者占 83%。驯鹿放牧和传统渔猎占经济的一半，人均产值约 3.5 万美元，是全领地各区中最低的。约 1.03 万平方公里的苏瓦西尔米冰原是领地第三大冰川、大陆第二大冰川，近一半的面积在区内；尼尔赛卢湖面积约 530 平方公里，是领地第三大湖；苔原上散布着古老的石人和石堆路标，通古阿利特石人群是其中最大的一片。努阿高速在区内延伸约 360 公里，沿途保留了石堆路标，路上有尼尔赛卢湖特大桥和 7.6 公里长的尼尔萨瓦克隧道，翻越苏瓦尔尤伊特山脉时建有长段防雪棚；西卢阿高速从区南部穿过，西卢阿真空磁悬浮也在这里有一段约 58 公里的尼尔萨瓦克防雪棚。选民里塔夫鲁利特人民党得票四成多，长老之道居次。\n通古阿利特石人张着双臂，面朝的方向指着水源、渡口或驯鹿的迁徙路线，起雾时猎人靠它们找路；过路的人有往石堆上添一块石头的习惯，但谁也不能拿走一块，长老说那是「替下一个走路的人留的」。夏天的傍晚，驯鹿群站在尼尔赛卢湖边的浅水里避蚊，湖面上倒映着成片的鹿角，牧民说这是「湖里长出的树林」。"
    en: "Nirsavaq District is the open pasture north-west of the territorial capital, in the south of the Tavrulit Indigenous Autonomous Region: 37,800 km² with 166,000 people; its name comes from nirsa, \"reindeer\", and 83% of residents are native Tavrunaq speakers. Reindeer herding and traditional hunting and fishing make up half the economy, and output per head, about US$35,000, is the lowest of any district in the territory. Nearly half of the Suvvasirmi Icefield, some 10,300 km² and the third largest glacier in the territory and second largest on the mainland, lies in the district; Nirsaillu Lake, about 530 km², is the territory's third largest lake; and ancient stone figures and cairns are scattered across the tundra, the Tuunngualiit Stone Figures being the largest group. The Nuqattaaq–Aqqanik Expressway runs about 360 km through the district, keeping the cairns along its way; its structures include the Nirsaillu Lake Bridge and the 7.6 km Nirsavaq Tunnel, and it climbs the Suvvarjuit Mountains under long snow sheds. The Sillua Expressway crosses the south of the district, and the Sillua Vacuum Maglev has a stretch of the Nirsavaq Snow Shed, some 58 km long, here too. The Tavrulit People's Party takes more than two-fifths of the vote, with the Way of the Elders second.\nThe stone figures of Tuunngualiit stand with arms outstretched, facing the water, the fords or the reindeer's migration routes, and hunters found their way by them in fog; passers-by add a stone to the cairns, but no one may take one away, because, the elders say, \"it is left for the next person on the road\". On summer evenings the reindeer stand in the shallows of Nirsaillu Lake to escape the mosquitoes, their antlers mirrored in the water, and herders call it \"the forest growing in the lake\"."
  codes:
    admin: '921003'
  population: 166000
  area_km2: 37800.0
  traits: { industries: [herding, hunting] }
- id: div_zq16x4
  subtype: borough
  parent: div_8c2skk
  status: generated
  names:
    zh: 皮图库维特区
    en: Pitukuviit District
    art-x-tavrunaq: Pitukuviit
  notes:
    zh: "皮图库维特区是北岸外海的皮图库维特群岛，由皮图克尤阿克岛和瑙卡克岛组成，群岛陆地约 1.15 万平方公里，8.3 万人，塔夫鲁纳克语母语者占 83%，是塔夫鲁利特人传统的海上猎场。主岛皮图克尤阿克岛面积约 1.04 万平方公里，是领地第五大岛，地势起伏不大，海岸是传统的海豹与海象猎场，海边岩石上刻着鲸、海豹与皮划艇的岩雕；瑙卡克岛约 1100 平方公里，在主岛东南，岛名来自猎海豹的鱼叉。两岛之间的皮图克马苏克海峡宽约 5 公里，冬季封冻后是猎人乘雪橇往来的冰上通道，夏季则有小船通行；西南端的皮图昆纳尔岬是出海的地标，猎人过去从这里乘皮划艇到外海猎海豹和海象。渔猎和渔业占经济的近一半，孩子多，14 岁以下的占 23%。每年有 103 天极夜。码头路、潮汐大街和青岛大道是岛上镇子的主街。选民里塔夫鲁利特人民党得票近四成。\n有些岩雕只在退潮时露出水面，涨潮后又被海水盖住，向导会掐着潮汐表带人来看；岩雕禁止拓印和触摸，孩子们在文化中心里用复制品学着描画祖先刻下的图案，岩雕上的皮划艇至今仍是岛上孩子学的第一种船。老猎人说瑙卡克岛就像一支斜放在海上的鱼叉，从皮图克尤阿克岛的高处看最清楚；开春冰化前，他们凭冰的颜色判断海峡里哪里还能走。皮图昆纳尔岬上的老石堆路标至今立着，过路的人只添石头，不拿石头。"
    en: "Pitukuviit District is the Pitukuviit Islands off the north coast, Pitukjuaq and Naukkaq, some 11,500 km² of land with 83,000 people, 83% of them native Tavrunaq speakers: the traditional hunting ground at sea of the Tavrulit people. The main island, Pitukjuaq, about 10,400 km², is the fifth largest island in the territory, gently rolling, its coasts the old seal and walrus hunting grounds, with carvings of whales, seals and kayaks on the shore rocks; Naukkaq, about 1,100 km², lies to the south-east of the main island and takes its name from the harpoon used for seals. The Pitukmasuq Strait between them, about 5 km wide, becomes an ice road for hunters' sleds when it freezes in winter and is crossed by small boats in summer; Cape Pitukkunnar at the south-western tip is the landmark for putting to sea, where hunters once set off by kayak for seals and walruses offshore. Hunting and fishing make up nearly half the economy, and children are many, 23% of the population under 15. There are 103 days of polar night a year. Quay Road, Tide Boulevard and Qingdao Avenue are the main streets of the island towns. The Tavrulit People's Party takes nearly two-fifths of the vote.\nSome of the carvings show only at low tide and vanish under the sea at high water, so guides time their visits by the tide tables; the carvings may not be rubbed or touched, and children learn to draw their ancestors' designs from replicas at the cultural centre, while the kayak carved on the rocks is still the first boat the island children learn. Old hunters say Naukkaq looks like a harpoon laid slantwise on the sea, best seen from the heights of Pitukjuaq, and before the spring thaw they judge from the colour of the ice where the strait will still bear. The old cairns on Cape Pitukkunnar still stand, and passers-by add stones but never take one."
  codes:
    admin: '921004'
  population: 83000
  area_km2: 12100.0
  traits: { industries: [hunting, fishing] }
- id: div_7b21kg
  subtype: borough
  parent: div_8c2skk
  status: generated
  names:
    zh: 尼尔萨图维特生态保护区
    en: Nirsatuvvit Nature Reserve
    art-x-tavrunaq: Nirsatuvvit
  notes:
    zh: "尼尔萨图维特生态保护区是驯鹿迁徙路线所在的生态保护区，面积 50200 平方公里，是领地面积第四大的区，常住约 1.7 万人，多为随鹿群迁徙的牧民，塔夫鲁纳克语母语者占 81%，区名里的 nirsa 就是「驯鹿」。驯鹿每年春季回到尼尔萨普库维克产仔地产仔，产仔季节禁止车辆和飞机靠近，连无人机都禁飞。海拔 1950 米的尼尔萨皮鲁克峰是苏瓦西尔米冰原的最高点、大陆上第三高的命名山峰，驯鹿群每年春秋沿山脚的谷地迁徙；伊卢克塔克湖面积约 660 平方公里，是领地第二大湖，湖身狭长，湖周不修道路；普卡西尔米冰帽的东缘也伸进保护区。西卢阿高速和尼尔萨瓦克高速穿过保护区时抬高路堤、加宽涵洞，并在迁徙季节限制夜间车流；阿卡尼克—尼尔萨图维特公路从自治区首府通到这里，长约 90 公里，途中钻过一段尼尔萨图维特隧道。经济以驯鹿放牧和自然保护为主，选民里塔夫鲁利特人民党和长老之道得票最多。\n牧民在保护区边界外扎营守望，第一只小驯鹿出生的消息会通过自治区广播传遍苔原，长老们说这一天比任何节日都要紧。牧民的老话「Nirsa pirri, tavru pirri」说「驯鹿走的路，就是土地的路」，尼尔萨皮鲁克峰脚下的迁徙谷地正是这样一条路，迁徙季节谷地里不许修路，也不许飞机低飞。伊卢克塔克湖边只有牧民的雪地摩托和驯鹿的蹄印，迁徙季节长长的鹿群沿着湖岸走上好几天。"
    en: "The Nirsatuvvit Nature Reserve is the reserve that holds the reindeer's migration routes: 50,200 km², the fourth largest district in the territory, with about 17,000 residents, mostly herders who move with the herds, 81% of them native Tavrunaq speakers; the nirsa in its name means \"reindeer\". Every spring the reindeer return to the Nirsapukkuvik Calving Grounds to give birth, and in the calving season vehicles and aircraft may not approach, not even drones. Mount Nirsapirruk, 1,950 m, the highest point of the Suvvasirmi Icefield and the third highest named peak on the mainland, has valleys at its foot along which the herds migrate each spring and autumn; Illuqtaq Lake, about 660 km², is the territory's second largest lake, long and narrow, with no roads along its shores; and the eastern edge of the Pukkasirmi Ice Cap reaches into the reserve. Where the Sillua and Nirsavaq expressways cross the reserve their embankments are raised and their culverts widened, and night traffic is restricted in the migration season; the Aqqanik–Nirsatuvvit Road, about 90 km long, runs here from the regional capital, passing through the Nirsatuvvit Tunnel on the way. The economy is reindeer herding and conservation, and the Tavrulit People's Party and the Way of the Elders win the most votes.\nThe herders camp outside the reserve boundary to keep watch, and news of the first calf is broadcast across the tundra on regional radio; the elders say that day matters more than any festival. The herders' old saying \"Nirsa pirri, tavru pirri\", \"the road the reindeer walk is the road of the land\", fits the migration valleys below Mount Nirsapirruk exactly: in the migration season no road may be built in them and no plane may fly low over them. Along Illuqtaq Lake there are only herders' snowmobile tracks and reindeer hoofprints, and in the migration season long files of reindeer walk its shores for days on end."
  codes:
    admin: '921005'
  population: 16600
  area_km2: 50200.0
  special_status: nature_reserve
  traits: { industries: [herding, conservation] }
