  notes:
    zh: 塔夫鲁利特原住民自治区的首府，52 万人，以行政、文化遗产和教育为主。塔夫鲁利特长老议事会、文化中心和雪橇赛场都在区内：文化中心收藏岩雕、骨雕与皮鼓，每年冬至举办鼓舞节；狗拉雪橇赛从这里出发，沿传统雪橇道穿越苔原。阿卡尼克机场有航班飞往首府和苔原上的牧区小镇。努阿高速在这里结束，苔原高速以阿卡尼克高架桥经过区内，北岸公路从这里出发，一条市道通往驯鹿迁徙保护区。
    en: The capital of the Tavrulit Indigenous Autonomous Region, with 520,000 people working mainly in government, heritage and education. The Tavrulit Council of Elders, the cultural centre and the sled race grounds are all here; the cultural centre holds rock and bone carvings and skin drums and hosts a drum-dance festival every midwinter, and the dog-sled races set out from here along the old sled trails across the tundra. Aqqanik Airport has flights to the capital and the herding towns of the tundra. The Nuqattaaq–Aqqanik Expressway ends here, the Tundra Expressway crosses the district on the Aqqanik Viaduct, the North Shore Road begins here, and a city road leads into the Reindeer Migration reserve.
  codes:
