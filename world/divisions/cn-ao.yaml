  names:
    zh: 乌维克努卡区
    en: Uviqnuqa District
    art-x-tavrunaq: Uviqnuqa
  notes:
    zh: "乌维克努卡区是乌维克萨克市的城区，在乌维克萨克岛上，面积 1500 平方公里，13.8 万人，区名里的 uviq 是「岛」，nuqa 是「港」。乌维克努卡码头是全市唯一的港口，运出稀土精矿，运进燃料和补给，港口航运、采矿和制造业是区内的主业，第二产业占四成多；乌库卡拉湾的北岸伸进区内，往来码头的船只经湾内进出。乌维克萨克机场有航班飞往首府和西尔米瓦克，轮班的矿工也从这里飞往首府。城外的乌库马苏克海峡宽约 2 公里，是领地最窄的命名海峡。城区只有约 2 公里的暖廊，同心大道、银河大街和南京大道是主街，学校、商店和公寓楼沿着通往码头的坡道排开。年轻人多，14 岁以下的孩子约占两成。选民里冶炼与矿山工会社会主义工人党和塔夫鲁利特人民党几乎打平。\n补给船靠岸的日子在岛上像过节，超市门口排起长队抢购新鲜水果和牛奶；码头边的黑板上用粉笔写着潮汐和船期，风暴来时黑板上只写一个字：「等」。风暴天停飞时，机场候机厅就成了全城打牌和聊天的地方。乌库马苏克海峡窄得两岸的人隔着水能互相喊话，补给船经过时，两边的孩子会一起跑到岸边挥手；岛上的最高处是孩子们最爱的远足地，晴天能望见远处的群岛。"
    en: "Uviqnuqa District is the town of Uviqsaaq City, on Uviqsaaq Island: 1,500 km² with 138,000 people; in its name uviq is \"island\" and nuqa \"harbour\". Uviqnuqa Quay is the city's only port, shipping out rare-earth concentrate and bringing in fuel and supplies; the port, mining and manufacturing are the district's trades, industry making up over two-fifths of the economy, and the north shore of Ukkuqalla Bay reaches into the district, ships to and from the quay passing through the bay. Uviqsaaq Airport has flights to the capital and Sirmivak, and the miners on rotation fly to the capital from here. Off the town the Ukkumasuq Strait, about 2 km wide, is the narrowest named strait in the territory. The town has only about 2 km of skyways; Concord Avenue, Galaxy Boulevard and Nanjing Avenue are the main streets, with schools, shops and flats lining the slopes down to the quay. The population is young, children under 15 making up about a fifth. The Smelters' and Miners' Union Socialist Workers' Party and the Tavrulit People's Party run almost level at the polls.\nSupply-ship days are like holidays on the island, with queues outside the supermarkets for fresh fruit and milk; the blackboard on the quay gives the tides and sailings in chalk, and when a storm comes it bears a single word, \"Wait\". When storms ground the flights the airport lounge becomes the town's place for cards and talk. The Ukkumasuq Strait is so narrow that people can shout to each other across the water, and when a supply ship passes the children on both shores run down to wave together; the highest point of the island is the children's favourite hike, and on clear days they can see the other islands far off."
