  names:
    zh: 基卢基亚克区
    en: Kilukkiaq District
    art-x-tavrunaq: Kilukkiaq
  notes:
    zh: "基卢基亚克区是基卢克图阿尔原住民自治区的首府，在大河入海处的低地上，面积 800 平方公里，29 万人，地势低平，最高处海拔不到 90 米。城区以商贸、行政和文化遗产为主，第三产业占 88%；自治区议事会设在这里，滨海大街、上海大道和柳岸大道沿河岸展开，商店、渔具店和议事会的楼都在这一带，主要街道上方有约 10 公里的暖廊。基卢克图阿尔机场在冬季北岸封冻时是自治区与外界往来的主要通道。努基高速在这里结束，尼尔萨瓦克高速经过区内，基卢基亚克—马拉基卢克公路通往三角洲湿地保护区。每年有九十九天极夜、一百零九天极昼，一月平均气温约零下 19 度。选民里北岸联盟得票约三分之一，远远领先。\n春末大河开冰前后，冰面不能走、河岸的路也常被冰水淹没，那几周是机场一年里最忙的时候；候机厅里挂着历年开冰日的记录表，旁边就是开冰竞猜的投注箱。开冰那天，滨海大街上的人挤到岸边，听冰块轰隆隆地互相推挤，老人们念一句「Sirmi pakka, kiluk sigga」，「冰破了，河就是新的」。秋天松鸡季开猎的那天学校放假，晚上河岸上有人拉起手风琴；冬天家家门后挂着猎枪和鱼竿，餐桌上少不了冻河鲑薄片和炖驯鹿肉。"
    en: "Kilukkiaq District is the capital of the Kiluktuar Indigenous Autonomous Region, on the lowland where the great river meets the sea: 800 km² with 290,000 people, so flat that its highest point is under 90 m. It lives on trade, government and heritage, services making up 88% of the economy; the Regional Assembly sits here, and Seafront Boulevard, Shanghai Avenue and Willow Avenue run along the riverbank with the shops, tackle shops and the Assembly's buildings, while some 10 km of skyways run above the main streets. In winter, when the north coast is frozen, Kiluktuar Airport is the region's main link with the outside world. The Nuqattaaq–Kiluktuar Expressway ends here, the Nirsavaq Expressway passes through, and the Kilukkiaq–Marrakiluk Road leads to the delta wetland reserve. The year brings ninety-nine days of polar night and a hundred and nine of midnight sun, and January averages about −19 °C. The North Shore Alliance wins about a third of the vote, far ahead of the rest.\nAround the river's break-up in late spring the ice cannot be walked on and the riverside roads are often flooded with meltwater, so those weeks are the busiest of the year at the airport; in the terminal hangs a table of break-up dates over the years, with the sweepstake box beside it. On break-up day the crowds on Seafront Boulevard press to the water's edge to hear the floes grinding against each other, and the elders say \"Sirmi pakka, kiluk sigga\", \"when the ice breaks, the river is new again\". On the opening day of the ptarmigan season the schools close and in the evening someone strikes up an accordion on the riverbank; in winter every house has a rifle and a fishing rod behind the door, and frozen river char and stewed reindeer are always on the table."
