  status: generated
  names:
    zh: 考卢尤阿克区
    en: Qaulujjuaq District
    art-x-tavrunaq: Qaulujjuaq
  notes:
    zh: "考卢尤阿克区是考尔尼克市的城区，面积 1500 平方公里，23 万人，以钻石加工和采矿服务为业，第二产业占 54%，人均产值约 9.3 万美元。考卢尤阿克钻石切割中心把内陆钻石矿的原石切割、抛光和分级，城里还有矿山机械修理厂、物流仓库和为矿区供应物资的商行。城区有约 6 公里的暖廊，建设路、音乐厅大道和广场大街是商业中心，夏至路两旁是住宅街坊。努基高速从区内穿过，考伊公路从这里出发通往伊卢克萨特区，考卢尤阿克—伊卢克图克公路以长约 17 公里的伊卢尔尤阿克湖特大桥跨过湖面，通往大湖苔原保护区。这里是亚寒带气候，一月平均气温约零下 20 度，最低纪录零下 43.5 度，七月白天却有十五度上下，夏天最高到过 25 度。选民里冶炼与矿山工会社会主义工人党得票最多，社会民主互助工党居次。\n切割中心对游客开放，隔着玻璃能看切割师把一颗毛坯钻石慢慢磨出几十个刻面；按考尔尼克的老规矩，年轻人求婚要送一颗用自己在矿区干活攒的钱买下的小钻石，城里的珠宝店也因此特别多。冬天气温跌到零下四十多度时，停在街边的汽车都插着电源线给发动机保温，本地人说「考尔尼克的车也要盖被子」。夏天的周末，人们开车去伊卢尔尤阿克湖边钓鱼、采浆果，回城时车上总带着一桶刚摘的越橘。"
    en: "Qaulujjuaq District is the town of Qaurniq City, 1,500 km² with 230,000 people, living on diamond processing and services for the mines; industry makes up 54% of its economy and output per head is about US$93,000. The Qaulujjuaq Diamond Cutting Centre cuts, polishes and grades rough stones from the inland diamond mine, and the town also has mining machinery workshops, logistics warehouses and merchants supplying the mines. Some 6 km of skyways run through the centre, Progress Road, Concert Hall Avenue and Square Boulevard are the shopping streets, and Midsummer Road is lined with housing blocks. The Nuqattaaq–Kiluktuar Expressway crosses the district, the Qaulujjuaq–Illuqsaat Road starts here for Illuqsaat District, and the Qaulujjuaq–Illuqtuuq Road crosses Illurjuaq Lake on the Illurjuaq Lake Bridge, some 17 km long, to the great-lake tundra reserve. The climate is subarctic: January averages about −20 °C with a record low of −43.5 °C, yet July days reach around 15 °C and summer has touched 25 °C. The Smelters' and Miners' Union Socialist Workers' Party wins the most votes, with the Social Democratic Mutual Aid Labour Party second.\nThe cutting centre is open to visitors, who watch through glass as cutters slowly grind a rough stone into dozens of facets; by Qaurniq's old custom a young person proposing gives a small diamond bought with money saved from working at the mines, which is why the town has so many jewellers. When the temperature drops below −40 °C in winter, every car parked in the street is plugged in to keep its engine warm, and locals say \"in Qaurniq even the cars need a blanket\". On summer weekends people drive out to Illurjuaq Lake to fish and pick berries, and come home with a bucket of fresh lingonberries in the boot."
  codes:
    admin: '920601'
  population: 230000
  area_km2: 1500.0
  traits: { industries: [mining, manufacturing, commerce] }
- id: div_qaxzqj
  subtype: borough
  parent: div_djze5f
  status: generated
  names:
    zh: 伊卢克萨特区
    en: Illuqsaat District
    art-x-tavrunaq: Illuqsaat
  notes:
    zh: "伊卢克萨特区是考尔尼克市东南的盐湖与山地，从内陆的伊卢考湖一直延伸到南岸的伊图苏瓦峡湾，面积 13500 平方公里，8.3 万人。伊卢考湖是面积约 320 平方公里的盐湖，湖水含锂，伊卢克萨特提锂厂从湖中的卤水提取锂，供应电池工厂，区名也由此而来；区内第二产业占 57%。海拔 1887 米的温纳皮鲁克峰是大陆上第四高的命名山峰，峰顶覆盖着约 4200 平方公里的温纳西尔米冰川；海拔 1037 米的伊卢克卡蒂克山口是穿越山地的通道，山口上是一片开阔的苔原。南岸的伊图苏瓦峡湾长约 63 公里，是领地第二长的峡湾，深而窄，两岸少有人烟；库利昆纳尔岬上的灯塔为驶向伊马萨尔维克港和乌库努卡港的船只指引航道。西卢阿高速、乌库利特高速和考伊公路都经过区内，重载铁路在伊卢克萨特货运站停靠。选民里冶炼与矿山工会社会主义工人党得票最多。\n夏天的阳光下，湖边的卤水池呈现深浅不一的蓝绿色，从飞机上看像一块调色板；冬天卤水池结冰停产，工人们转去室内的精制车间，等到春天冰化再重新开池。冰川融水在温纳皮鲁克峰脚下汇成一串小湖，和提锂厂的卤水池相映。夏天驯鹿在伊卢克卡蒂克山口上吃草，重载铁路在约 40 公里外的管道里经过，山口上听不到一点声音。伊图苏瓦峡湾里只有夏天偶尔驶进来的皮划艇，划船的人说在这里说话会听到好几遍回声；进出港的船员则说，看见库利昆纳尔岬的灯，就知道离首府只剩最后一段海路了。"
    en: "Illuqsaat District is the salt-lake and mountain country of south-eastern Qaurniq City, reaching from Illuqqau Lake inland all the way to the Ittusuvva Fjord on the south coast: 13,500 km² with 83,000 people. Illuqqau Lake is a salt lake of about 320 km² whose water holds lithium; the Illuqsaat Brine Works extracts it from the brine for battery factories, and the district takes its name from the lake. Industry makes up 57% of the economy. Mount Unnapirruk, 1,887 m, is the fourth highest named peak on the mainland, capped by the Unnasirmi Glacier, some 4,200 km²; the Illuqkatiq Pass, 1,037 m, is the way through the mountains, its saddle a broad expanse of tundra. On the south coast the Ittusuvva Fjord, some 63 km long, is the second longest fjord in the territory, deep, narrow and almost uninhabited, and the lighthouse on Qullikunnar Point guides ships bound for Immasaarvik Harbour and Ukkunuqa. The Sillua and Ukkuliit expressways and the Qaulujjuaq–Illuqsaat Road all pass through, and the heavy-haul railway calls at the Illuqsaat Freight Yard. The Smelters' and Miners' Union Socialist Workers' Party wins the most votes.\nIn the summer sun the brine pools by the lake shine in every shade of blue and green, like a painter's palette from the air; in winter the pools freeze and production stops, the workers moving to the indoor refinery until the ice melts in spring and the pools reopen. Meltwater from the glacier gathers in a string of little lakes at the foot of Mount Unnapirruk, matching the colours of the brine pools. In summer reindeer graze on the Illuqkatiq Pass, while the heavy-haul railway passes some 40 km away in its tube without a sound reaching the pass. Only the odd kayak enters the Ittusuvva Fjord in summer, and paddlers say a word spoken there comes back several times over; seamen say that when they see the light on Qullikunnar Point, they know only the last stretch of sea lies between them and the capital."
  codes:
    admin: '920602'
  population: 83000
  area_km2: 13500.0
  traits: { industries: [mining, manufacturing] }
- id: div_m541k8
  subtype: borough
  parent: div_djze5f
  status: generated
  names:
    zh: 乌库利特矿区管理区
    en: Ukkuliit Mining Administration Zone
    art-x-tavrunaq: Ukkuliit
  notes:
    zh: "乌库利特矿区管理区是考尔尼克市东北的内陆矿区，面积 45000 平方公里，西尔米冰盖的西缘也在区内，最高处海拔 2165 米，常住 3.9 万人，多为轮班的矿工和物流人员。考卢尤阿克钻石矿和乌库利特镍矿都是露天矿，各有一条八九公里长的公路接到乌库利特高速；乌库利特真空磁悬浮重载铁路从这里的乌库利特矿区货运站出发，经伊卢考湖运往伊马萨尔维克，冰原 600 型无人驾驶列车每列挂 100 节货运舱、载重 1 万吨，每天开出 10 列重车，以 600 公里的时速运行，满载全程约四十七分钟，由调度中心远程监控。区内经济以采矿和物流为主，第二产业占近一半。这里是领地冬季最冷的地方之一，最低纪录零下 46.7 度，夏天却能到 25 度以上。和平大道、团结路和极光大道是矿工营地小镇的主街。选民里冶炼与矿山工会社会主义工人党和岛民之声爱国阵线几乎打平。\n重载列车在低真空管道里运行，管道在沿线的每一条驯鹿迁徙通道上都架高到离地五米，驯鹿群从下面走过，列车不用停下来等，这是修线时和牧民长老商定的做法，牧民把这条不鸣笛、不停站的管道叫作「不说话的长蛇」。冬天气温跌到零下四十多度时，矿用卡车的发动机和轮胎要整夜加热，否则第二天就发动不了。钻石矿的每一道工序都在监控镜头下进行，工人下班要过安检，本地人笑说这里「连一粒沙子都走不出去」。"
    en: "The Ukkuliit Mining Administration Zone is the inland mining country of north-eastern Qaurniq City: 45,000 km², with the western edge of the Sirmi Ice Cap inside it and a highest point of 2,165 m, home to 39,000 people, mostly miners on rotation and logistics staff. The Qaulujjuaq Diamond Mine and the Ukkuliit Nickel Mine are both open pits, each linked to the Ukkuliit Expressway by a road eight or nine kilometres long. The Ukkuliit Vacuum Maglev Heavy-Haul Railway starts from the Ukkuliit Mining Freight Yard here and runs via Illuqqau Lake to Immasaarvik; its driverless Icefield 600 trains each haul 100 cargo pods carrying 10,000 t, ten loaded trains leave every day, running at 600 km/h and taking about forty-seven minutes for the whole journey, all watched remotely from the control centre. The economy is mining and logistics, industry making up nearly half. This is one of the coldest places in the territory in winter, with a record low of −46.7 °C, yet summer can pass 25 °C. Peace Avenue, Unity Road and Aurora Avenue are the main streets of the miners' camp towns. The Smelters' and Miners' Union Socialist Workers' Party and the Islanders' Voice Patriotic Front run almost level at the polls.\nThe heavy-haul trains run in a low-vacuum tube, which is raised five metres off the ground at every reindeer migration route along the line, so the herds can pass beneath without the trains stopping to wait, an arrangement agreed with the herders' elders when the line was built; herders call the tube, which neither whistles nor stops, \"the snake that doesn't talk\". When winter drops below −40 °C the engines and tyres of the mine trucks must be heated all night or they will not start in the morning. Every step at the diamond mine happens under surveillance cameras and workers pass through security at the end of each shift, so locals joke that \"not even a grain of sand gets out\"."
  codes:
    admin: '920603'
  population: 39000
  area_km2: 45000.0
  special_status: mining_zone
  traits: { industries: [mining, logistics] }
- id: div_8h5g1g
  subtype: borough
  parent: div_djze5f
  status: generated
  names:
    zh: 伊卢克图克生态保护区
    en: Illuqtuuq Nature Reserve
    art-x-tavrunaq: Illuqtuuq
  notes:
    zh: "伊卢克图克生态保护区是首府与考尔尼克之间的大湖苔原，整片划为生态保护区，面积 35000 平方公里，常住约 5500 人，塔夫鲁纳克语母语者占近八成，以传统渔猎为生。区名里的 -tuuq 是「多」，伊卢尔尤阿克湖面积约 2100 平方公里，是领地最大的命名湖泊，周围散布着无数小湖和湿地；温纳西尔米冰川有一部分伸进保护区，区内最高处海拔 1841 米。西卢阿高速、努基高速、乌库利特高速和考伊公路都从苔原上穿过，路堤下留有涵洞让融水和动物通过；乌库利特真空磁悬浮重载铁路在这里有一段约 18 公里的伊卢克图克防雪棚。考卢尤阿克—伊卢克图克公路以长约 17 公里的伊卢尔尤阿克湖特大桥跨过湖面，冬季湖面封冻后，冰上还开辟有雪地车道。区内经济以自然保护、巡护和传统渔猎为主，选民里塔夫鲁利特人民党和长老之道得票最多。\n冬天湖冰结得一米多厚，冰上的道路连起湖边的村子，夏天冰一化，那些路就沉进了湖里，村子之间又改用小船往来。秋天苔原上的浆果熟了，湖边的人家全家出动去采越橘和云莓，晒干的浆果要吃一整个冬天；冬天男人们在冰上凿洞下网，捕上来的白鲑冻得硬邦邦，堆在门口像柴火一样。融雪时节，成群的候鸟落在湿地上，巡护员会在涵洞口数驯鹿和北极狐留下的脚印，看哪些动物用上了这些通道。"
    en: "The Illuqtuuq Nature Reserve is the great-lake tundra between the capital and Qaurniq, declared a nature reserve in its entirety: 35,000 km² with about 5,500 residents, nearly eight in ten of them native Tavrunaq speakers, who live by traditional fishing and hunting. The -tuuq in its name means \"many\": Illurjuaq Lake, some 2,100 km², is the largest named lake in the territory and is surrounded by countless small lakes and wetlands, part of the Unnasirmi Glacier reaches into the reserve, and its highest point is 1,841 m. The Sillua, Nuqattaaq–Kiluktuar and Ukkuliit expressways and the Qaulujjuaq–Illuqsaat Road all cross the tundra, with culverts under their embankments to let meltwater and animals through, and the Ukkuliit Vacuum Maglev Heavy-Haul Railway runs here through the Illuqtuuq Snow Shed, some 18 km long. The Qaulujjuaq–Illuqtuuq Road crosses the lake on the Illurjuaq Lake Bridge, some 17 km long, and once the lake freezes in winter snowcat lanes are opened on the ice too. The economy is conservation, ranger patrols and traditional fishing and hunting, and the Tavrulit People's Party and the Way of the Elders win the most votes.\nIn winter the lake ice is over a metre thick and roads across it link the lakeside villages; when the ice melts in summer those roads sink into the lake and the villages go back to small boats. In autumn, when the tundra berries ripen, whole families go out for lingonberries and cloudberries, dried to last the winter; in winter the men cut holes in the ice to set nets, and the whitefish they haul out freeze rock-hard and are stacked by the door like firewood. When the snow melts flocks of migrating birds settle on the wetlands, and rangers count the tracks of reindeer and Arctic foxes at the culvert mouths to see which animals are using the passages."
  codes:
    admin: '920604'
  population: 5500
  area_km2: 35000.0
  special_status: nature_reserve
  traits: { industries: [conservation, hunting], heritage: tavrulit }

# ── 基卢克图阿尔原住民自治区 ──
- id: div_dk2gh7
  subtype: locality
  parent: div_hpmerr
  status: generated
  names:
    zh: 基卢克图阿尔原住民自治区
    en: Kiluktuar Indigenous Autonomous Region
    art-x-tavrunaq: Kiluktuar Nalliqut
  notes:
    zh: "基卢克图阿尔原住民自治区在北冰洋大陆北岸，首府以北约 470 公里，长约 376 公里的基卢克图阿尔河在这里入海，这是领地第三长的河。自治区面积 9 万平方公里，四成多在海上的群岛，55.5 万人，塔夫鲁纳克语母语者约占六成。城区基卢基亚克区是商贸与行政中心；东边的西尔米努卡区有领地的海警与破冰船基地；帕基卢克区沿大河中游是牧场和渔村；河口三角洲是马拉基卢克湿地保护区；外海的纳卢维特群岛有北冰洋极地研究所；更北的伊卢克帕卡群岛是湖泊和水道切碎的岩盘荒原，主岛帕卡尔尤阿克岛约 3 万平方公里，是领地第三大岛。北岸冬季封冻，破冰船为航线开路；城区一月平均气温约零下 19 度，七月约 8 度，一年降水不到 300 毫米。\n自治区议事会掌管大河与北岸近海的渔业配额、狩猎季和港口收入，领地要在自治区内新设保护区或调整海警与破冰船基地，都须经它同意。议事会 39 席，北岸联盟占 15 席，自治区主席西克瓦克·图拉克和议事会主席何书瑶都出自北岸联盟，它与长老之道和金库党组成三党右翼联合政府，自成北岸本土保守的一派，塔夫鲁利特人民党以 10 席居次。经济以港口航运、渔业和商贸为主，人均生产总值约 6.9 万美元。努基高速和尼尔萨瓦克高速在这里到达北岸，阿卡皮图克公路沿海岸通往阿卡尼克，冬季基卢克图阿尔机场是与外界往来的主要通道。旗面上绿下白，一条蓝色大河蜿蜒流向地平线，河口的人管它叫「一条河的旗」；区花是无茎蝇子草，区树是灰柳。\n基卢克图阿尔在塔夫鲁纳克语里是「大河」，全城的日子以大河开冰为界。春末冰面开裂的那几天，河岸上站满了人，冰块挤压的轰鸣声隔着几公里都听得见，老人们会念一句：「Sirmi pakka, kiluk sigga」，意思是「冰破了，河就是新的」，这一天也被当作新一年的开始。开冰之前，城里每年都有一场竞猜：大家在冰面中央立一根木桩，猜它哪一天、哪一刻随冰沉下，猜中的人能赢得一整年的鲜鱼。西尔米努卡破冰船基地的破冰船每次出港开道，河口的孩子们都沿着岸跑一段为它送行。大河边的人家几乎家家门后挂着一支猎枪和一根鱼竿，秋天松鸡季开猎的那天，学校放一天假，大人带着孩子坐船到上游的苔原去；晚上回到河岸，有人拉起手风琴，唱的都是关于大河、渔船和破冰船的老歌。本地人爱说「河怎么流，我们就怎么过日子」，新规矩要先在河岸上讲得通，才能在议事会里通过。这里的极夜长达九十九天，冬天人们最爱吃冻得硬邦邦的河鲑薄片和炖驯鹿肉，帕基卢克的渔村还会把整条鱼埋进雪里冷藏，吃的时候再挖出来。"
    en: "The Kiluktuar Indigenous Autonomous Region lies on the north coast of the Arctic Ocean mainland, about 470 km north of the capital, where the Kiluktuar River, some 376 km long and the third longest river in the territory, meets the sea. The region covers 90,000 km², more than four-tenths of it in offshore islands, and has 555,000 people, about six in ten of them native Tavrunaq speakers. The town, Kilukkiaq District, is the centre of trade and government; Sirminuqa District to the east has the territory's coastguard and icebreaker base; Paakiluk District along the middle river is pasture and fishing villages; the river delta is the Marrakiluk wetland reserve; the Naalluviit Islands offshore hold the Arctic Ocean Polar Research Institute; and the Illuqpakka Islands further north are a wilderness of bedrock cut up by lakes and channels, their main island, Pakkarjuaq, about 30,000 km², being the third largest island in the territory. The north coast freezes in winter and icebreakers clear the shipping lanes; in town January averages about −19 °C and July about 8 °C, and the year brings less than 300 mm of rain and snow.\nThe Regional Assembly controls fishing quotas on the river and the northern inshore waters, the hunting seasons and the port revenues, and the territory may create new reserves in the region or move coastguard and icebreaker bases only with its consent. The North Shore Alliance holds 15 of the Assembly's 39 seats, and both the Regional Chair, Siqvaaq Tullaaq, and the Chair of the Assembly, He Shuyao, come from it; it governs in a three-party right-wing coalition with the Way of the Elders and the Vault Party, a north-shore conservatism all its own, while the Tavrulit People's Party is second with 10 seats. The economy rests on the port and shipping, fishing and trade, with output per head of about US$69,000. The Nuqattaaq–Kiluktuar and Nirsavaq expressways reach the north coast here, the Aqqapituk Road follows the coast to Aqqanik, and in winter Kiluktuar Airport is the main link with the outside world. The flag is green over white with a blue river winding to the horizon, and people at the river mouth call it \"the flag of one river\"; the regional flower is moss campion and the regional tree the grey willow.\nKiluktuar means \"great river\" in Tavrunaq, and the town's year turns on the river's break-up. In the late-spring days when the ice cracks open, the banks are crowded and the grinding of the floes can be heard for kilometres; the elders say \"Sirmi pakka, kiluk sigga\", \"when the ice breaks, the river is new again\", and the day is taken as the start of a new year. Before the break-up the town holds a sweepstake: a post is planted in the middle of the ice and people guess the day and the minute it goes down with the floes; the winner gets a year's supply of fresh fish. Whenever an icebreaker leaves the Sirminuqa Icebreaker Base to clear the channel, the children at the river mouth run along the bank to see it off. Behind almost every door along the river hang a hunting rifle and a fishing rod; on the opening day of the ptarmigan season the schools close and the grown-ups take the children by boat to the tundra upstream, and back on the riverbank in the evening someone strikes up an accordion and they sing the old songs about the river, the fishing boats and the icebreakers. People here like to say \"we live the way the river runs\", and a new rule has to make sense on the riverbank before it can pass in the Assembly. The polar night lasts ninety-nine days, and the winter favourites are slices of river char frozen hard and stewed reindeer; the fishing villages of Paakiluk still bury whole fish in the snow to keep and dig them out to eat."
