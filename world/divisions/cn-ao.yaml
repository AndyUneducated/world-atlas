  status: generated
  names:
    zh: 帕基卢克区
    en: Paakiluk District
    art-x-tavrunaq: Paakiluk
  notes:
    zh: "帕基卢克区是基卢克图阿尔河中游的苔原，面积 31000 平方公里，11 万人，塔夫鲁纳克语母语者占 83%，14 岁以下的孩子占 23%，是自治区里最年轻的地方之一。驯鹿放牧、河流渔业和传统渔猎占经济的一半以上，第一产业比重是全领地各区中最高的。基卢克图阿尔河和瓦克基卢克河在区内流过，沿河是牧场和渔村；这里离海较远，是亚寒带气候，冬天最低纪录零下 45 度，夏天却能到 24 度，一年日照约 1330 小时，河谷里有稀疏的灌木和矮树。努基高速沿大河延伸约 170 公里，阿卡皮图克公路在这里与它相接。卡鲁克大道和橡树大道是沿河几个大镇的主街。选民里北岸联盟和塔夫鲁利特人民党势均力敌，长老之道也有一成多的支持者。\n渔村的人家冬天还会把整条鱼埋进雪里冷藏，吃的时候再挖出来，冻河鲑切成薄片蘸盐是最家常的吃法。春天驯鹿群北迁时，牧民赶着鹿群渡过浅滩，努基高速的车流会在路边停下来等鹿过去；秋天松鸡季开猎，城里的孩子坐船沿河上来，在苔原上跟着大人学打猎和认路。夏天的夜里太阳不落，渔民在河边支起帐篷，一网一网地收北极红点鲑，收完就挂在木架上风干。"
    en: "Paakiluk District is the tundra of the middle Kiluktuar River, 31,000 km² with 110,000 people; 83% are native Tavrunaq speakers and children under 15 make up 23%, one of the youngest places in the region. Reindeer herding, river fishing and traditional hunting and fishing make up more than half the economy, the highest share of the primary sector of any district in the territory. The Kiluktuar and Vaqkiluk rivers flow through the district, lined with pastures and fishing villages; far from the sea, it has a subarctic climate, with a record low of −45 °C yet summer days of up to 24 °C and some 1,330 hours of sunshine a year, and sparse shrubs and low trees grow in its valleys. The Nuqattaaq–Kiluktuar Expressway runs about 170 km along the great river, and the Aqqapituk Road joins it here. Karuq Avenue and Oak Avenue are the main streets of the larger riverside villages. The North Shore Alliance and the Tavrulit People's Party are evenly matched at the polls, and the Way of the Elders has over a tenth of the vote too.\nFishing families still bury whole fish in the snow over winter and dig them out to eat, and frozen river char sliced thin and dipped in salt is everyday fare. When the herds move north in spring the herders drive them across the shallows, and traffic on the expressway stops by the roadside to let the reindeer pass; at the opening of the ptarmigan season children from town come up the river by boat to learn hunting and finding their way on the tundra from the grown-ups. On summer nights the sun does not set, and fishermen pitch tents by the river, hauling in Arctic char net by net and hanging them on wooden racks to dry in the wind."
  codes:
