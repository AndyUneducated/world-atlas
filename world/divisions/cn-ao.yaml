# Administrative divisions of the Arctic Ocean Territory (CN-AO).
# id: stable internal key, referenced by other files. codes.admin: 6-digit hierarchical code (GB/T 2260 pattern:
# territory 920000, city 920100, district 920101); may change on reorganisation.
# subtype follows Overture Maps divisions: country > dependency/region > locality > borough (a state's
# cities, on Ranova, sit directly under the country and have no districts).
# Names are Chinese, English and Tavrunaq (art-x-tavrunaq), the language of the Tavrulit people.
# Special divisions: the Pallurniq Financial Zone (city level, under the Arctic Ocean Public Bank Act
# and the Financial Zone Act), the Tavrulit Indigenous Autonomous Region (city level), and nature
# reserve, ice cap and mining administration zones (district level).
divisions:
- id: div_hpmerr
  subtype: dependency
  parent: country:CN
  status: generated
  names:
    zh: 北冰洋领地
    en: Arctic Ocean Territory
    art-x-tavrunaq: Aqqimma Tavru
  notes:
    zh: "北冰洋领地在北维京岛以北的北冰洋上，由一块主大陆和周围十二个群岛组成，面积约 86 万平方公里，人口 506 万。南岸有暖流经过，港口终年不冻，首府努卡塔克和萨尔瓦克、乌库拉克、图利瓦克等大城市都在南岸；北岸冬季封冻，靠破冰船通航。内陆是冻土苔原和星罗棋布的湖泊，东北是西尔米冰盖，冰盖上耸立着海拔 4014 米的领地最高峰西尔米峰，最北的皮鲁库维特群岛上是世界第二大的卡拉克西尔米冰原，一半以上的土地划为生态保护区和冰盖管理区。冬季有连续数周的极夜，夏季有极昼。塔夫鲁纳克语母语者占人口的 53%，大陆北部和内陆苔原设塔夫鲁利特原住民自治区，长老议事会参与领地治理；北岸的大河流域设基卢克图阿尔原住民自治区，东北的冰原是西尔米瓦克自由邦，各有自己的议会。经济以金融、数据中心与算力、采矿和旅游为主，人均生产总值约 10.7 万美元；北冰洋公共银行和帕卢尔尼克金融特区设在首府旁。领地与其他领地没有陆路相连，对外只靠航空和破冰海运。\n领地的礼仪性元首是中央政府任命的总督叶静宜，她不属于任何政党；实际施政的是对北冰洋领地议会负责的领地政府。议会共 71 席，按比例代表制选举，门槛 3%，另设 8 个由塔夫鲁纳克语选民选出的保留议席。上一次选举投票率 65.3%，塔夫鲁利特人民党以 19 席居首，保留议席中它拿下 6 席、长老之道拿下 2 席；塔人党与社会民主互助工党、冶炼与矿山工会社会主义工人党和绿脉党组成四党联合政府，共 38 席，总理尼维卡克·陶武里亚克出自塔人党，金库党是最大在野党，领袖唐慕白。终审法院有 7 名法官，兼用普通法与原住民习惯法，其中至少 3 位是塔夫鲁纳克语法官。约 46% 的居民不信教，塔夫鲁纳克传统信仰约占 24%，基督教和佛教其次；人均预期寿命 84.3 岁，识字率 99.5%。领地旗上，一座红色石堆路标立在极光夜空和白色冰原之间，格言是「冰原之上，万物自由」。\n领地的人习惯用太阳安排一年：首府努卡塔克每年有约七十天极夜、八十多天极昼，北岸的基卢克图阿尔和西尔米瓦克极夜长达九十九天。极夜结束、太阳第一次重新露出地平线的那天，各地都要过「回光节」，人们爬上城边的高处等那几分钟的阳光，鼓手敲起皮鼓，长老用塔夫鲁纳克语念诵祝词。塔夫鲁纳克语里有一句人人会说的话：「Sirmi ikka, ulik tuqqa」，意思是「冰越厚，鱼越安稳」，越难熬的冬天越要沉住气。家常菜离不开驯鹿肉、鱼和浆果，驯鹿肉汤、熏北极鲑、冻鱼薄片和云莓酱几乎家家会做；首府和金融特区则多了金融与数据中心从业者带来的世界各地的餐馆。"
    en: "The Arctic Ocean Territory lies in the Arctic Ocean north of North Viking Island, a mainland and twelve archipelagos around it, some 860,000 km² with 5.06 million people. A warm current runs along the south coast and keeps its harbours open all year, and the capital Nuqattaaq and the other large cities (Saarvaq, Ukkulaaq and Tullivaq) all stand on it; the north coast freezes in winter and is kept open by icebreakers. Inland lie permafrost tundra and countless lakes, with the Sirmi Ice Cap in the north-east, where the territory's highest peak, Mount Sirmi at 4,014 m, rises from the ice, and the Kallaaqsirmi Icefield, the second largest in the world, on the Pirrukuviit Islands in the far north, and more than half of the land is set aside as nature reserves and ice cap administration zones. Winter brings weeks of polar night and summer the midnight sun. Native Tavrunaq speakers make up 53% of the population; the north of the mainland and the inland tundra form the Tavrulit Indigenous Autonomous Region, whose council of elders takes part in governing the territory, the great-river country of the north coast forms the Kiluktuar Indigenous Autonomous Region, and the ice fields of the north-east the Free State of Sirmivak, each with an assembly of its own. Finance, data centres and computing, mining and tourism lead the economy, with output of about 107,000 dollars a head, and the Arctic Ocean Public Bank and the Pallurniq Financial Zone stand beside the capital. There is no land link to the other territories; the only ways in are by air and by icebreaker-escorted sea.\nThe territory's ceremonial head is the Governor, Ye Jingyi, appointed by the central government and belonging to no party; day-to-day government lies with a territorial government answerable to the Arctic Ocean Territorial Assembly. The Assembly has 71 seats elected by proportional representation with a 3% threshold, plus 8 reserved seats chosen by Tavrunaq-speaking voters. At the last election, on a turnout of 65.3%, the Tavrulit People's Party came first with 19 seats, taking 6 of the reserved seats to the Way of the Elders' 2; it governs in a four-party coalition of 38 seats with the Social Democratic Mutual Aid Labour Party, the Smelters' and Miners' Union Socialist Workers' Party and Greenvein, under the Premier, Nivikkaaq Tauvvuriaq of the Tavrulit People's Party, while the Vault Party, led by Tang Mubai, is the largest party in opposition. The Court of Final Appeal has seven judges and applies both common law and Indigenous customary law, with at least three Tavrunaq-speaking judges on the bench. About 46% of residents profess no religion, Tavrunaq traditional faith claims about 24%, and Christianity and Buddhism follow; life expectancy is 84.3 years and literacy 99.5%. The territorial flag sets a red stone cairn between an aurora-lit night sky and white ice, and the motto is \"Above the Ice, All Are Free\".\nPeople here plan their year by the sun: the capital, Nuqattaaq, has some seventy days of polar night and over eighty of midnight sun, and on the north coast Kiluktuar and Sirmivak have ninety-nine days of polar night. On the day the polar night ends and the sun first clears the horizon again, every town keeps the Return of the Light: people climb to the high ground at the edge of town to wait for those few minutes of sunshine, drummers beat skin drums and elders recite blessings in Tavrunaq. Everyone knows the Tavrunaq saying \"Sirmi ikka, ulik tuqqa\", the thicker the ice, the safer the fish: the harder the winter, the steadier you must be. Home cooking means reindeer, fish and berries, and reindeer broth, smoked Arctic char, thin slices of frozen fish and cloudberry jam are made in almost every household, while the capital and the financial zone add restaurants from all over the world, brought by the people who work in finance and the data centres."
