  notes:
    zh: 塔夫鲁利特人的原住民自治区，覆盖大陆北部和内陆的大片苔原，面积 131080 平方公里，在各市级区划中排第二，66.8 万人，塔夫鲁纳克语母语者占 72%，比例是各市中最高的。自治区的长老议事会参与领地治理，涉及土地、狩猎与迁徙路线的领地法案须经它同意。驯鹿放牧、传统渔猎和文化遗产是经济的特色，狗拉雪橇赛、鼓舞、口述史诗和岩雕骨雕代代相传。首府阿卡尼克有努阿高速通往领地首府，尼尔萨瓦克高速和阿卡皮图克公路连接南北两岸。
    en: The indigenous autonomous region of the Tavrulit people, covering the north of the mainland and much of the inland tundra, 131,080 km², the second largest city-level division, with 668,000 people; 72% are native Tavrunaq speakers, the highest share of any city. The region's council of elders takes part in governing the territory, and territorial laws on land, hunting and migration routes need its consent. Reindeer herding, traditional hunting and fishing and heritage give the economy its character, and dog-sled racing, drum dancing, the oral epics and rock and bone carving are handed down through the generations. The Nuqattaaq–Aqqanik Expressway links its capital, Aqqanik, with the territorial capital, and the Nirsavaq Expressway and Aqqapituk Road connect it with both coasts.
