- id: div_ga9pxy
  subtype: borough
  parent: div_p808br
  status: generated
  names:
    zh: 帕卢库特区
    en: Pallukut District
    art-x-tavrunaq: Pallukut
  notes:
    zh: "帕卢库特区是帕卢尔尼克金融特区唯一的区，约 18 万人住在 60 平方公里内，几乎全是塔楼、穹顶和裙楼，每平方公里 3000 人，是全领地人口密度最高的区，地势平坦，最高处海拔只有 37 米。帕卢图阿尔大道两侧依次是北冰洋公共银行总部大厦和商业、投资、私人、托管四座附属银行大厦，基里街通往冻土黄金金库，自由大道和天文台大街串起清算所、金融法院、仲裁中心、公司注册处和数字资产交易所。帕卢尔尼克冬季花园和卡拉克穹顶两座穹顶是员工午休和过冬的去处，约 33 公里的暖廊连起各栋楼；帕卢尔尼克高速从区内穿过，一头接首府的库马尔维克区，一头通往机场所在的尼尔萨库特区。居民以外来的金融、法律和技术人员为主，劳动年龄人口占 76%，金库党在这里拿到三分之二的选票。\n各栋银行楼各有各的脾气：商业银行的营业大厅没有柜台，只有一排排长桌和咖啡机，志愿者帮老人用手机开户，通常不用五分钟；私人银行门口没有招牌，只刻着一个门牌号；托管银行全年无休，值班员说日历上「没有红字」；投资银行的分析员看一眼不冻港里矿石船的多少，就知道今年的行情。卡拉克穹顶取名自 kallaaq「永昼」，灯光从清晨的淡金色慢慢变成正午的白光，冬天医生会给失眠和情绪低落的病人开「穹顶处方」，每天来晒一小时；冬季花园里的一株柠檬树是全区的宝贝，每年结的果子都要拿到大厅里展览。"
    en: "Pallukut District is the only district of the Pallurniq Financial Zone: about 180,000 people in 60 km², almost all towers, domes and podiums, at 3,000 people per km² the most densely peopled district in the territory, and so flat that its highest point is only 37 m above the sea. Along Pallutuar Avenue stand in turn the Arctic Ocean Public Bank Tower and the towers of its four subsidiary banks, commercial, investment, private and custody; Kirri Street leads to the Permafrost Gold Vault, and Liberty Avenue and Observatory Boulevard string together the clearing house, the financial court, the arbitration centre, the companies registry and the digital asset exchange. The Pallurniq Winter Garden and the Kallaaq Dome are where staff spend their lunch breaks and their winters, and some 33 km of skyways join the buildings; the Pallurniq Expressway runs through the district, linking Qummarvik District in the capital with Nirsakut District and its airport. Residents are mostly incoming finance, legal and technology professionals, people of working age make up 76%, and the Vault Party takes two-thirds of the vote here.\nEach bank tower has its own temperament. The commercial bank's hall has no counters, only rows of long tables and coffee machines, where volunteers help old people open an account on their phones, usually in under five minutes; the private bank has no sign at the door, only a street number carved beside it; the custody bank never closes, and its duty staff say their calendar has \"no red days\"; and the investment bank's analysts can tell how the year is going from the number of ore ships in the ice-free harbour. The Kallaaq Dome is named for kallaaq, \"endless day\", its light rising from pale morning gold to white noon; in winter doctors write a \"dome prescription\" for patients with insomnia and low spirits, an hour a day under it. A lemon tree in the Winter Garden is the district's treasure, and every year its fruit goes on show in the hall."
  codes:
    admin: '920201'
  population: 180000
  area_km2: 60.0

# ── 萨尔瓦克市 ──
- id: div_nbf1bw
  subtype: locality
  parent: div_hpmerr
  status: generated
  names:
    zh: 萨尔瓦克市
    en: Saarvaq City
    art-x-tavrunaq: Saarvaq
  notes:
    zh: "萨尔瓦克是北冰洋南岸人口第二多的城市，在首府以西约 430 公里，全市 6.2 万平方公里，59.3 万人，塔夫鲁纳克语母语者占六成多。城区萨尔努卡区在萨尔苏瓦峡湾口，这条峡湾长约 55 公里，暖流让港口终年不冻；东边是乌利图克区的渔村和加工厂，西北的普拉苏瓦米乌特区占全市六成面积，是峡湾、冰川和山地，海拔 1879 米的帕利皮鲁克峰是全市最高点；南岸外海的乌利库维特群岛是深海养殖基地，西部远海的通纳库维特群岛划为生态保护区。一月平均气温约零下 13 度，七月约 7 度，一年降水不到 400 毫米。\n城市从峡湾口的渔港发展起来，靠海吃饭的传统一直没变：全市以港口航运、渔业、海水养殖和水产加工为主，第一产业占 15%，人均生产总值约 7 万美元。萨尔努卡渔港是南岸最大的渔港之一，深海渔船和养殖运输船在这里卸货，周围是冷库和水产加工厂；乌利库维特群岛间的海湾里排满网箱，养着鲑鱼和北极红点鲑。西卢阿高速和西卢阿真空磁悬浮穿城而过，磁悬浮的萨尔瓦克站在城区，以萨尔努卡高架桥进出，西去图利瓦克，东去首府，在普拉苏瓦米乌特区的山里钻过全线最长的隧道；城区有一条地铁，从松林站到萨尔努卡渔港站共 12 站，普拉苏瓦公路通往峡湾深处的村镇。市议事会 41 席，塔夫鲁利特人民党占 15 席，市长叶思远出自该党，长老之道在这里也有 4 席。市旗是青天碧海上一只白色皮划艇，市花是拉布拉多茶，市树是网脉柳。\n萨尔瓦克人管外海的乌利库维特群岛叫「海上牧场」，养殖工人每天坐船去喂鱼，像牧民去放牧一样，傍晚收工时船队排成一行回港，码头上的家人隔着老远就能认出自家的船灯。普拉苏瓦米乌特区的村镇散落在峡湾深处，很多地方不通公路，孩子们坐「校船」上学，船长同时也是邮递员和杂货郎，每到一个村子就鸣三声笛。萨尔努卡渔港的鱼市每天清晨开市，最受欢迎的是整条的养殖鲑鱼和烟熏了一夜的北极红点鲑，本地人的吃法是把鱼切成薄片冻硬，蘸着海盐和浆果酱生吃。每年夏天的皮划艇节，划手们都以市旗为终点线。极夜的日子里，萨尔苏瓦峡湾口的灯塔和渔港的灯火连成一条光带，是从海上回家的人最熟悉的风景；城区的地铁站里则挂满了本地孩子画的鱼，每年开学换一批。"
    en: "Saarvaq is the second most populous city on the south coast of the Arctic Ocean Territory, about 430 km west of the capital, with 593,000 people in 62,000 km², more than six in ten of them native Tavrunaq speakers. The town itself, Saarnuqa District, lies at the mouth of the Saarsuvva Fjord, some 55 km long, whose harbour the warm current keeps free of ice. To the east are the fishing villages and processing plants of Ulittuuq District; Pullasuvvamiut District to the north-west takes up six-tenths of the city's area in fjords, glaciers and mountains, with Mount Paalipirruk, 1,879 m, the highest point in the city; the Ulikuviit Islands off the south coast are a deep-sea fish-farming base; and the Tuunnaquviit Islands far out to the west are a nature reserve. January averages about −13 °C and July about 7 °C, and the year brings less than 400 mm of rain and snow.\nThe city grew from the fishing harbour at the fjord mouth and still lives from the sea: port and shipping, fishing, aquaculture and seafood processing lead the economy, the primary sector makes up 15%, and output per head is about US$70,000. Saarnuqa Fishing Harbour is one of the largest on the south coast, where deep-sea trawlers and fish-farm carriers unload amid cold stores and processing plants, and the bays between the Ulikuviit Islands are full of net pens of salmon and Arctic char. The Sillua Expressway and the Sillua Vacuum Maglev pass through the city: Saarvaq station on the maglev is in town, reached over the Saarnuqa Viaduct, with trains west to Tullivaq and east to the capital, and in the mountains of Pullasuvvamiut the line runs through its longest tunnel. The town has one metro line, twelve stations from Pinewood to Saarnuqa Fishing Harbour, and the Pullasuvva Road leads to the villages deep in the fjords. The Town Assembly has 41 seats, the Tavrulit People's Party holds 15 and the mayor, Ye Siyuan, comes from it, and the Way of the Elders has 4 seats here too. The city flag shows a white kayak on a blue-green sky and deep blue sea; the city flower is Labrador tea and the city tree the net-leaved willow.\nSaarvaq people call the offshore Ulikuviit Islands \"the sea pastures\": the fish-farm workers go out by boat every day to feed the fish as herders go out to their flocks, and at the end of the day the boats come home in line, each family on the quay picking out its own boat's light from far off. The villages of Pullasuvvamiut are scattered deep in the fjords, many of them beyond the road, so children go to school on the \"school boat\", whose skipper is also postman and grocer and sounds three blasts at every village. The fish market at Saarnuqa Fishing Harbour opens at dawn, the favourites being whole farmed salmon and Arctic char smoked overnight, and locals eat fish sliced thin, frozen hard and dipped in sea salt and berry jam. At the kayak festival every summer the paddlers race to the city flag as their finishing line. In the polar night the lighthouse at the mouth of the Saarsuvva Fjord and the lights of the harbour form a single band of light, the sight anyone coming home by sea knows best, while the town's metro stations are hung with fish painted by local children, a new set every school year."
  codes:
    admin: '920300'
    unlocode: AO SRV
  population: 592800
  area_km2: 62000.0
  color: '#1F7A8C'
  flag: { layout: horizon, colors: ['#1F7A8C', '#0E2A47', '#FFFFFF'], edge: waves, charge: kayak, charge_color: '#FFFFFF', charge_in: horizon }
  flag_notes:
    zh: "青色天空下是深蓝的大海，一道白浪之上划着一只白色皮划艇。萨尔瓦克靠港口航运、渔业和海水养殖为生，皮划艇是塔夫鲁纳克人最古老的出海方式，也代表今天驶出萨尔苏瓦峡湾的渔船；青色是峡湾上空的天色。每年夏天的皮划艇节，划手们都以这面旗为终点线。"
    en: "A white kayak riding a white crest on the deep blue sea under a teal sky. Saarvaq lives by shipping, fishing and fish farming: the kayak is the oldest Tavrunaq way to the sea and the fishing boats that leave the fjord today, the teal the sky over the fjord. At the summer kayak festival the flag marks the finish line."
  traits: { industries: [port, fishing, aquaculture, food], heritage: polar_mixed, age: balanced }
