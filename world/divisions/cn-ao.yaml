    zh: 自治区北部沿海的传统猎场，面积 28000 平方公里，20 万人，塔夫鲁纳克语母语者占 81%。冬季猎人沿海冰上的雪橇道猎海豹和海象、凿冰捕鱼，夏季划皮划艇和小船出海，渔猎占经济的三分之一以上。北岸公路在区内延伸约 115 公里，雪橇道与公路交叉处冬季雪橇优先；努基高速和苔原高速也经过区内。
    en: The traditional hunting ground along the region's northern coast, 28,000 km² with 200,000 people, 81% of them native Tavrunaq speakers. In winter hunters travel the sled trails on the sea ice after seal and walrus and fish through holes in the ice, and in summer they go out by kayak and small boat; hunting and fishing make up over a third of the economy. The North Shore Road runs some 115 km through the district, with sleds given right of way at the trail crossings in winter, and the Nuqattaaq–Kiluktuar and Tundra expressways also pass through.
  codes:
    admin: '921002'
  population: 200000
  area_km2: 28000.0
  traits: { industries: [hunting, fishing] }
