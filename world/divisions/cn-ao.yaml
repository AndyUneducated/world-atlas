  flag_notes:
    zh: "蓝灰色天空下是白色的冰盖，冰盖上耸起锯齿状的群峰，冰原上立着一座深蓝色的天文台圆顶。冰盖是西尔米冰盖，锯齿状的群峰是从冰面上拔起的西尔米峰和它周围的山尖，西尔米峰海拔 4014 米，是领地最高峰，这个全领地面积最大、人口最稀的市级区划几乎被冰雪覆盖；圆顶是陶瓦尼克高地上的天文台，漫长的极夜正是那里观星的季节。"
    en: "A white ice sheet under a grey-blue sky, jagged peaks rising from it and a deep blue observatory dome standing on the ice. The ice is the Sirmi Ice Cap and the jagged peaks are Mount Sirmi and the summits around it breaking through the ice; Mount Sirmi, at 4,014 m, is the territory's highest; the Free State, the largest and most thinly peopled division of the territory, is almost all ice and snow, and the dome is the observatory on the eastern uplands, where the long polar night is the season for watching the stars."
