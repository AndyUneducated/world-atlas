    en: The town of Sirmivak City, on the north-east edge of the Sirmi Ice Cap, with 152,000 people and an average elevation of 956 m, the highest of any district in the territory. The Sirmiqarvik Glacier Visitor Centre is where glacier walks and ice-cave tours set out, the Arctic Ocean Seed and Gene Vault is cut into a permafrost hillside outside town, holding crop seeds and genetic samples from around the world, and charter flights from the south coast land at the glacier airport in the tourist season. The Sirmipaa Expressway ends here, and a city road runs, mostly under snow sheds, into the ice cap zone.
  codes:
    admin: '920801'
  population: 152000
  area_km2: 1200.0
  traits: { industries: [tourism, ski, commerce] }
