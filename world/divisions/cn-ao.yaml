  flag_notes:
    zh: "深蓝夜空下是白色的冰原，两道岬角在中间分开，留出峡湾口，上方一颗金色四芒星。努卡塔克坐落在峡湾湾口两岸，两道岬角就是隔湾相望的城区，金星是极夜里的北极星，也代表领地首府。北冰洋各市的旗多画天空与地平线，努卡塔克的这面是它们的范本。"
    en: "White ice under a deep blue night sky, two headlands parting in the middle to leave the mouth of a fjord, with a gold four-pointed star above. Nuqattaaq stands on both shores of its fjord mouth: the headlands are the two halves of the city and the star is the pole star of the polar night and the territorial capital. Most cities of the Arctic Ocean draw sky and horizon on their flags, and this one is their model."
