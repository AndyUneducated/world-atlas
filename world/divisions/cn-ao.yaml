  status: generated
  names:
    zh: 乌库努卡区
    en: Ukkunuqa District
    art-x-tavrunaq: Ukkunuqa
  notes:
    zh: "乌库努卡区是乌库拉克市的城区和港口，在乌库苏瓦峡湾口，面积 900 平方公里，21 万人，塔夫鲁纳克语母语者占 57%。乌库努卡散货码头装运基萨尔维克冶炼厂的产品和东部矿山的矿石，旁边是油品码头和物流仓库，港口航运、物流和采矿是区内的主业。乌库拉克站是西卢阿真空磁悬浮的东端终点；城区有一条地铁，从乌库努卡散货码头站经图书馆路站、冬雪站到橡树站共 7 站，主要街道上方有约 10 公里的暖廊。西卢阿高速以 9.7 公里长的乌库努卡高架桥过城，在这里由南岸折向北；乌库努卡—西卢阿苏瓦特公路从区内向北通往保护区。繁荣大道、广场大道和银河大道是城区的主干，商店、学校和工人住宅沿街排开。选民里塔夫鲁利特人民党、社会民主互助工党和冶炼与矿山工会社会主义工人党依次领先。\n暖流让码头终年不冻，冬天码头工人穿着电热工作服在冰雾里作业；巨大的矿石堆场用拱顶棚罩住，既防粉尘外泄，也免得矿石被大雪埋住。峡湾两岸的山坡上，冶炼厂换班时的灯光一阵亮一阵暗，城里人看一眼就知道是几点。地铁的终点站就在码头门口，早班的工人下了车走几步就能打卡，站台上常飘着食堂里驯鹿肉丸的香味。"
    en: "Ukkunuqa District is the town and port of Ukkulaaq City, at the mouth of the Ukkusuvva Fjord: 900 km² with 210,000 people, 57% of them native Tavrunaq speakers. The Ukkunuqa Bulk Terminal loads the products of the Qissarvik Smelter and ore from the eastern mines, with an oil terminal and logistics warehouses beside it, and the port, logistics and mining are the district's main trades. Ukkulaaq station is the eastern terminus of the Sillua Vacuum Maglev; the town has one metro line, seven stations from Ukkunuqa Bulk Terminal via Library Road and Winter Snow to Oak, and some 10 km of skyways above the main streets. The Sillua Expressway crosses town on the 9.7 km Ukkunuqa Viaduct and turns north here from the south coast, and the Ukkunuqa–Silluasuvvat Road runs north from the district into the reserve. Prosperity Avenue, Square Avenue and Galaxy Avenue are the main streets, lined with shops, schools and workers' housing. The Tavrulit People's Party, the Social Democratic Mutual Aid Labour Party and the Smelters' and Miners' Union Socialist Workers' Party lead the vote, in that order.\nThe warm current keeps the quays free of ice all year, and in winter the dockers work in the ice fog in electrically heated overalls; the huge ore stockyards are roofed with vaulted sheds, both to keep the dust in and to stop the ore being buried by snow. On the slopes on either side of the fjord the smelter's lights brighten and dim with each shift change, and townspeople can tell the time at a glance. The metro's terminus is right at the dock gates, so the early shift can step off the train and clock in a few paces later, and the platform often smells of reindeer meatballs from the canteen."
