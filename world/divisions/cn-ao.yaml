    en: The Uvvaakkaruquviit Islands far off the north-east, Uvvaak, Karuq, Turralik and Puttasirmi islands, all of them a nature reserve with only about 600 residents, the fewest of any district. Uvvaak Bay, about 6,100 km², is the largest named bay in the territory; walruses haul out on its shores and polar bears roam between the floes and the islands, watched all year by the rangers of the reserve station.
