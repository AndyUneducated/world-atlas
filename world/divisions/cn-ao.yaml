  area_km2: 131080.0
  special_status: autonomous_region
  color: '#B5653A'
  flag: { layout: border, colors: ['#8E3B24', '#1A1A1A', '#F4EFE2'], charge: frame_drum, charge_color: '#E9B949' }
  flag_notes:
    zh: "旗杆一侧是黑底米白纹的塔夫鲁纳克滚边，其余赭红色旗面上一面金色手鼓，鼓面画着阶梯菱形，鼓槌立在一旁。赭红是苔原岩雕的颜料，手鼓代表代代相传的鼓舞与口述史诗，也是长老议事会召集族人时敲响的鼓。各领地塔夫鲁纳克城镇的滚边旗都以这面旗为本，它也被当作塔夫鲁利特人的民族旗。"
    en: "A Tavrunaq border in black and cream at the hoist and, on the ochre field, a gold hand drum painted with a stepped diamond, its beater beside it. The ochre is the pigment of the tundra's rock carvings; the drum is the drum dances and spoken epics handed down the generations, and the drum that calls the people when the Council of Elders meets. The bordered flags of Tavrunaq towns in other territories all follow it, and it is flown as the Tavrulit people's own flag."
  traits: { industries: [hunting, herding, heritage, government], heritage: tavrulit, age: young }
