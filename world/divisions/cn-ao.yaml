    art-x-tavrunaq: Tauvvaniq
  notes:
    zh: "陶瓦尼克区是西尔米冰盖以东的高地，面积 35000 平方公里，7.8 万人，以科研、高等教育和卫星遥感为业，区名里的 tauvvu 在塔夫鲁纳克语里是「天」。冬季连续数月的黑夜和干冷的空气适合天文观测，这里一年降水只有 260 毫米左右，每年有九十天极夜；陶瓦尼克天文台和极光观测站散布在高地上，自由邦旗上的深蓝色圆顶画的就是它。西尔米库利克图克湖面积约 180 平方公里，由西尔米冰盖的融水汇成，湖水冷得连夏天也只有几度；西尔米河从冰盖流出后也向南穿过本区。西卢阿高速在区内延伸约 195 公里，陶瓦尼克防雪棚长约 42 公里，沿线不设路灯以免影响观测。区内中文和英文母语者合占近六成，许多是来自各地的天文学家和工程师；北方领土保守党在这里得票三成多。大连路和北坡路是高地上几个科研小镇的主街。\n观测员们在极夜里轮流值班，冬天结束时在食堂办一场「见太阳」聚餐，第一缕阳光照进窗户时，整屋人放下刀叉一起鼓掌。夜里开车经过高速，司机们都知道要把远光灯关掉，路边的牌子上画着一架望远镜。夏天极昼的时候天文台无事可做，观测员们就去湖边钓鱼、在苔原上徒步，等着下一个漫长的黑夜。"
    en: "Tauvvaniq District is the upland east of the Sirmi Ice Cap, 35,000 km² with 78,000 people, living on research, higher education and satellite remote sensing; the tauvvu in its name is Tavrunaq for \"sky\". Months of unbroken winter darkness and dry, cold air make it ideal for astronomy: the year brings only about 260 mm of rain and snow and some ninety days of polar night, and the Tauvvaniq Observatory and aurora stations are scattered across the uplands; the deep blue dome on the Free State flag is the observatory. Sirmiqulliqtuuq Lake, some 180 km², gathers meltwater from the ice cap and is only a few degrees even in summer, and the Sirmi River also runs south through the district after leaving the ice. The Sillua Expressway runs about 195 km through the district, including the Tauvvaniq Snow Shed, some 42 km long, and has no street lights so as not to spoil the observing. Native Chinese and English speakers together make up nearly six in ten residents, many of them astronomers and engineers from far and wide, and the Northern Territories Conservative Party wins over three in ten votes. Dalian Road and North Slope Road are the main streets of the upland research towns.\nThe observers take turns on duty through the polar night, and when winter ends they hold a \"meet the sun\" dinner in the canteen; when the first ray comes through the window, everyone puts down knives and forks and applauds. Drivers on the expressway at night know to switch off their full beams, and the roadside signs show a telescope. In the midnight sun of summer there is nothing for the observatory to do, so the observers go fishing at the lake and walking on the tundra, waiting for the next long night."
  codes:
    admin: '920802'
  population: 78000
  area_km2: 35000.0
  traits: { industries: [research, education, satellite], heritage: polar_global }
- id: div_hbdzam
  subtype: borough
  parent: div_d48kz7
  status: generated
  names:
    zh: 西尔米冰盖管理区
    en: Sirmi Ice Cap Administration Zone
    art-x-tavrunaq: Sirmitavru
  notes:
    zh: "西尔米冰盖管理区是西尔米冰盖所在的冰盖管理区，面积 72600 平方公里，是领地面积第二大的区，常住只有约 1700 人。西尔米冰盖覆盖着西尔米高地，面积约 2.95 万平方公里，平均海拔近 1900 米，是领地和世界最大的冰川；冰面上拔起的西尔米峰海拔 4014 米，是领地最高峰，一座通体裹着冰雪的金字塔形尖峰；西尔米卡蒂克山口海拔 2102 米，是最高的命名山口，全被冰雪覆盖，没有道路通过；西尔米河从冰盖流出，是领地最长的河流。冰盖深处的西尔米冰芯钻探站钻取冰芯研究过去的气候，夏季才有飞机往返。西卢阿高速沿冰盖外缘的基岩修建，不上冰面，绕冰盖的路段上有一条长 14 公里的西尔米冰盖隧道；西尔米卡尔维克—西尔米冰盖公路从自由邦首府通到这里。冰盖上一月平均气温约零下 26 度，最低纪录零下 46 度。经济以科研和巡护为主，北方领土保守党在这里得票四成多。\n钻出的冰芯按深度切段编号，装进冷藏箱随夏季航班运回西尔米瓦克，越深的冰封着越古老的空气；科考队员说，冰盖上一年只有两个季节：「能飞」和「不能飞」。冰面上露出的山峰被科考队叫作「冰上的岛」，夏天飞机在冰盖上空飞过，这些黑色的山尖是唯一能辨认方位的标记。科考队乘雪地车穿过西尔米卡蒂克山口时，要插上一排彩色的小旗作路标，回程时再一面面收回；晴天时，从冰盖边缘一百多公里外就能望见西尔米峰。"
    en: "The Sirmi Ice Cap Administration Zone is the ice administration zone of the Sirmi Ice Cap: 72,600 km², the second largest district in the territory, with only about 1,700 residents. The Sirmi Ice Cap covers the Sirmi Highlands, some 29,500 km² at an average elevation of nearly 1,900 m, the largest glacier in the territory and the world; Mount Sirmi, 4,014 m, rising from the ice, is the territory's highest peak, a pyramid sheathed entirely in snow and ice; the Sirmikatiq Col, 2,102 m, is the highest named pass, wholly buried in ice with no road across it; and the Sirmi River flows out of the cap, the longest river in the territory. Deep on the cap the Sirmi Ice Core Station drills cores to study past climates, reached by air only in summer. The Sillua Expressway keeps to the bedrock round the outer edge of the cap without going onto the ice, its route round the cap including the 14 km Sirmi Ice Cap Tunnel, and the Sirmiqarvik–Sirmi Ice Cap Road leads here from the Free State's capital. On the ice January averages about −26 °C, and the record low is −46 °C. The economy is research and ranger patrols, and the Northern Territories Conservative Party takes more than two-fifths of the vote.\nThe cores are cut into numbered sections by depth and flown back to Sirmivak in chilled boxes on the summer flights, the deeper the ice the older the air sealed in it; the researchers say the ice cap has only two seasons, \"flying\" and \"not flying\". The peaks breaking through the ice are what the research teams call \"islands on the ice\"; to planes flying over the cap in summer these black summits are the only landmarks. When teams cross the Sirmikatiq Col by snowcat they plant a line of coloured flags as markers and gather them in one by one on the way back; on clear days Mount Sirmi can be seen from the edge of the cap more than a hundred kilometres away."
  codes:
    admin: '920803'
  population: 1700
  area_km2: 72600.0
  special_status: ice_cap_zone
  traits: { industries: [research, conservation] }
- id: div_481wnn
  subtype: borough
  parent: div_d48kz7
  status: generated
  names:
    zh: 西尔米乌维特冰盖管理区
    en: Sirmiuviit Ice Administration Zone
    art-x-tavrunaq: Sirmiuviit
  notes:
    zh: "西尔米乌维特冰盖管理区是北部外海的西尔米乌维特群岛，由基库维克岛、帕利乌维克岛、基库利克岛、图利乌维克岛、乌维库卢克岛和西尔米奥拉岛组成，群岛陆地约 6.6 万平方公里，是领地第二大的群岛，整片划为冰盖管理区，常住约 1100 人。主岛基库维克岛面积约 5.7 万平方公里，是领地第二大岛，西尔米基克山纵贯全岛，南北各顶着一座冰帽：北段的主峰基克尔尤阿克峰海拔 2356 米，在约 6000 平方公里的乌维克西尔米冰帽之下；南段的基克皮鲁克峰海拔 2236 米，在基克西尔米冰帽之下，尖峭的山形像露出冰面的獠牙。帕利乌维克岛意为「白岛」，图利乌维克岛意为「冷岛」，乌维库卢克岛就是「小岛」，北面是终年不化的海冰。冰川入海处不断崩落冰山，西尔米乌维特冰山观测站为南岸航线发布冰山预报，夏季有邮轮前来观赏。这里每年极夜长达 111 天，最低纪录近零下 50 度。北方领土保守党在这里得票近四成。\n大冰山一旦从冰川上分离，就会被编号建档，追踪到它化掉为止；冰山预报每天随天气预报一起播出，渔民和船长听完才决定航线。冰山常在基库利克岛边搁浅，有的一搁就是一整个夏天，岛周围的海面像一座不断变换的冰雕展；浮冰之间常有海豹爬上冰面晒太阳。夏天邮轮绕岛航行，乘客能看到一条条冰川像白色的河流从山顶淌下来，冰崖崩塌时的轰响隔着几公里都听得见。"
    en: "The Sirmiuviit Ice Administration Zone is the Sirmiuviit Islands off the north coast, Kiiquviq, Paaliuviq, Kiqqulik, Tulliuviq, Uviqkuluk and Sirmiaulla, some 66,000 km² of land, the second largest archipelago in the territory, declared an ice administration zone in its entirety, with about 1,100 residents. The main island, Kiiquviq, about 57,000 km², is the second largest island in the territory; the Sirmikiiq Mountains run its length with an ice cap at each end. In the north the highest peak, Mount Kiiqrjuaq, 2,356 m, lies under the Uviqsirmi Ice Cap, some 6,000 km²; in the south Mount Kiiqpirruk, 2,236 m, lies under the Kiiqsirmi Ice Cap, its sharp outline like a fang breaking through the ice. Paaliuviq means \"white island\", Tulliuviq \"cold island\" and Uviqkuluk simply \"little island\", with sea ice to its north that never melts. Where the glaciers meet the sea they calve icebergs without end; the Sirmiuviit Iceberg Station issues iceberg forecasts for the south-coast shipping lanes, and cruise ships come in summer to see them. The polar night here lasts 111 days a year, and the record low is close to −50 °C. The Northern Territories Conservative Party takes nearly two-fifths of the vote.\nOnce a large berg breaks from a glacier it is numbered, logged and tracked until it melts away; the iceberg forecast goes out every day with the weather, and fishermen and captains decide their routes only after hearing it. Bergs often run aground off Kiqqulik, some staying the whole summer, so that the sea round the island is like an ever-changing ice sculpture show, and seals haul out on the floes to bask. Cruise ships circling the islands in summer show passengers glaciers pouring down from the summits like white rivers, and the roar of a collapsing ice cliff carries for kilometres."
  codes:
    admin: '920804'
  population: 1100
  area_km2: 65000.0
  special_status: ice_cap_zone
  traits: { industries: [research, cruise] }
- id: div_81tqya
  subtype: borough
  parent: div_d48kz7
  status: generated
  names:
    zh: 乌瓦卡鲁克生态保护区
    en: Uvvaakkaruq Nature Reserve
    art-x-tavrunaq: Uvvaakkaruq
  notes:
    zh: "乌瓦卡鲁克生态保护区是东北远海的乌瓦卡鲁库维特群岛，由乌瓦克岛、卡鲁克岛、图拉利克岛和普塔西尔米岛组成，群岛陆地约 2.11 万平方公里，整片划为生态保护区，常住只有约 600 人，是全领地人口最少的区。群岛的名字合塔夫鲁纳克语的 uvvaak「海象」和 karuq「熊」两词：主岛乌瓦克岛约 9400 平方公里，海滩是海象的聚居地；第二大岛卡鲁克岛约 5500 平方公里，冬季北极熊沿海冰来到岛上，在积雪中筑窝产仔；图拉利克岛地势低平，海岸是陡立的冰崖；普塔西尔米岛周围冬春之际布满浮冰。群岛环抱的乌瓦克湾面积约 6100 平方公里，是领地最大的命名海湾，冬季封冻时是北极熊捕猎海豹的场所，夏季海象在湾岸聚集。乌瓦卡鲁库维特保护站的巡护员常年监测海象栖息地和北极熊的迁移。这里每年有 105 天极夜，经济以自然保护和科研为主。北方领土保守党在这里得票近四成。\n巡护员给常来海岸的北极熊编号建档，熟悉的几只还有外号；保护站的门窗都加了钢栅，熊偶尔会在夜里来门口转悠，值班日志里专门有一栏写着「今日来访」。普塔西尔米岛上巡护员的小屋建在高处，屋顶画着一个巨大的白熊图案，方便飞机在雪原上辨认。卡鲁克岛的小熊要在雪窝里待到春天才出洞，这段时间全岛禁止任何人登陆，连巡护员也只在海上用望远镜观察；他们一年里最高兴的，就是数到双胞胎的那一天。"
    en: "The Uvvaakkaruq Nature Reserve is the Uvvaakkaruquviit Islands far out to the north-east, Uvvaak, Karuq, Turralik and Puttasirmi, some 21,100 km² of land declared a nature reserve in its entirety, with only about 600 residents, the least populous district in the territory. The archipelago's name joins the Tavrunaq uvvaak, \"walrus\", and karuq, \"bear\". The main island, Uvvaak, about 9,400 km², has beaches where walruses gather; on Karuq, the second largest at about 5,500 km², polar bears come ashore over the sea ice in winter to dig dens in the snow and give birth; low Turralik is ringed by sheer ice cliffs; and the waters round Puttasirmi fill with floes in winter and spring. Uvvaak Bay, enclosed by the islands and some 6,100 km², is the largest named bay in the territory, where polar bears hunt seals on the winter ice and walruses crowd the shores in summer. Rangers at the Uvvaakkaruquviit Ranger Station keep watch on the walrus haul-outs and the movements of the bears all year round. There are 105 days of polar night a year, and the economy is conservation and research. The Northern Territories Conservative Party takes nearly two-fifths of the vote.\nThe rangers number and keep files on the bears that often come to the coast, and the familiar ones have nicknames; the station's doors and windows are barred with steel, as bears sometimes prowl round the door at night, and the duty log has a column headed \"Today's visitors\". The rangers' hut on Puttasirmi stands on high ground with a huge white bear painted on its roof, so that planes can pick it out on the snowfield. The cubs on Karuq stay in their dens until spring, and until then no one may land on the island, so even the rangers watch only through binoculars from the sea; their happiest day of the year is the day they count twins."
  codes:
    admin: '920805'
  population: 600
  area_km2: 22000.0
  special_status: nature_reserve
  traits: { industries: [conservation, research] }
- id: div_t2dbeg
  subtype: borough
  parent: div_d48kz7
  status: generated
  names:
    zh: 皮鲁库维特生态保护区
    en: Pirrukuviit Nature Reserve
    art-x-tavrunaq: Pirrukuviit
  notes:
    zh: "皮鲁库维特生态保护区是领地最北的皮鲁库维特群岛，由皮鲁克尔尤阿克岛、普拉乌维克岛和贾利尤阿克岛组成，群岛名意为「群峰之岛」，整片划为生态保护区，面积 137200 平方公里，是领地面积最大的区，常住只有约 800 人，多为巡护员、科研人员和登山营地的工作人员。主岛皮鲁克尔尤阿克岛面积约 13.2 万平方公里，是领地最大、地势最高的岛，皮鲁克尔尤伊特山脉分东、中、西三片山群从西向东纵贯全岛，中间隔着低矮的山口：主峰卡拉克皮鲁克峰海拔 2917 米，是北方群岛最高峰、领地第二高峰；东段的贾利皮鲁克峰 2477 米，意为「风峰」；西段的帕卡皮鲁克峰 2052 米，意为「碎峰」。这里在北纬 80 度以北，雪线比大陆低三百米，宽阔的中段几乎整片埋在约 2.5 万平方公里的卡拉克西尔米冰原之下，这是领地和世界第二大冰川，东西两段各顶着贾利西尔米冰川和帕卡西尔米冰川，冰川从山谷一直流进峡湾。西端的普拉乌维克岛是海鸟、北极雁和雪鸮的繁殖地，东端的贾利尤阿克岛意为「大风岛」。保护区只准持许可证的科考队和登山队进入，夏季从西尔米卡尔维克有包机飞往岛上的冰川跑道。这里每年极夜长达 128 天，最低纪录零下 53.5 度。\n贾利皮鲁克峰顶终年刮着大风，雪被吹成一条条横在空中的雪旗；贾利尤阿克岛上几乎没有高过脚踝的植物，连石头都被风沙磨得光溜溜的。夏天普拉乌维克岛的苔原上散布着成千上万个融水小湖，登山队员说，在这里扎营最难的不是冷，而是半夜也亮着的天和满耳朵的鸟叫。"
    en: "The Pirrukuviit Nature Reserve is the Pirrukuviit Islands, the northernmost in the territory: Pirrukrjuaq, Pullauviq and Jaalijuaq, whose collective name means \"islands of peaks\". Declared a nature reserve in its entirety, it covers 137,200 km², the largest district in the territory, and has only about 800 residents, mostly rangers, researchers and staff of the mountaineering camps. The main island, Pirrukrjuaq, about 132,000 km², is the largest and highest island in the territory, and the Pirrukrjuit Mountains run its length from west to east in three groups, eastern, central and western, separated by low passes: the highest peak, Mount Kallaaqpirruk, 2,917 m, is the highest in the northern islands and the second highest in the territory; Mount Jaalipirruk in the east, 2,477 m, means \"wind peak\"; and Mount Pakkapirruk in the west, 2,052 m, means \"broken peak\". North of 80° the snowline is three hundred metres lower than on the mainland, and the broad central group lies almost wholly buried under the Kallaaqsirmi Icefield, some 25,000 km², the second largest glacier in the territory and the world, while the eastern and western groups carry the Jaalisirmi and Pakkasirmi glaciers, ice flowing down the valleys right into the fjords. Pullauviq at the western end is a breeding ground for seabirds, Arctic geese and snowy owls, and Jaalijuaq at the eastern end means \"great wind island\". Only licensed research and climbing parties may enter the reserve, and in summer charter flights run from Sirmiqarvik to the glacier airstrip on the island. The polar night lasts 128 days a year, and the record low is −53.5 °C.\nA gale blows over the summit of Mount Jaalipirruk all year, combing the snow into banners streaming across the sky; on Jaalijuaq hardly a plant grows higher than an ankle and even the stones are polished smooth by wind-blown grit. In summer the tundra of Pullauviq is dotted with thousands of meltwater pools, and climbers say the hardest thing about camping here is not the cold but the sky that stays bright at midnight and the ears full of birdsong."
  codes:
    admin: '920806'
  population: 800
  area_km2: 137200.0
  special_status: nature_reserve
  traits: { industries: [conservation, research, tourism] }

