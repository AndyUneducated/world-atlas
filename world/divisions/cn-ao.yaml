  population: 110000
  area_km2: 31000.0
  traits: { industries: [herding, fishing, hunting], heritage: tavrulit }
- id: div_rcnhch
  subtype: borough
  parent: div_dk2gh7
  status: generated
  names:
    zh: 纳卢维特区
    en: Naalluviit District
    art-x-tavrunaq: Naalluviit
  notes:
    zh: "纳卢维特区是北岸外海的纳卢维特群岛，由纳卢尤阿克岛、普塔克岛和阿卡尼尔维克岛组成，群岛陆地约 8500 平方公里，常住约 1.1 万人，多为科研人员和他们的家属，区名来自 naallu「考察」，是领地极地科研的基地。北冰洋极地研究所在主岛纳卢尤阿克岛上，这座岛约 7000 平方公里，最高处海拔五百多米；研究所研究海冰、冻土与北极生态，每年夏季从这里派出科考船，岛上的浮标站和观测塔常年记录海冰与洋流。东部的普塔克岛负责维护周围海域布放的海洋浮标；最北的阿卡尼尔维克岛隔着海峡北望伊卢克帕卡群岛，岛上设有观测海冰的站点。区内经济以科研和高等教育为主，中文和英文母语者合占六成多；每年有 108 天极夜。北岸联盟在这里拿到三分之二的选票。\n科考船夏天出发时，研究所的人站在码头上敲一阵皮鼓送行，船上的人则把一面印着研究所徽章的小旗挂在桅杆上，直到秋天回港才取下。浮标每年秋天回收一次，维护人员说，浮标上挂满的海藻和贝壳，是它们在海上过了一年的「履历」。海峡每年秋天从阿卡尼尔维克岛开始封冻，站里的观测员管自己叫「看门人」：哪天海峡冻上了，伊卢克帕卡的雪橇就该来了。"
    en: "Naalluviit District is the Naalluviit Islands off the north coast, Naallujuaq, Puttaq and Aqqanirvik, some 8,500 km² of land with about 11,000 residents, mostly researchers and their families; its name comes from naallu, \"survey\", and it is the territory's base for polar research. The Arctic Ocean Polar Research Institute is on the main island, Naallujuaq, some 7,000 km² and rising to five hundred-odd metres; it studies sea ice, permafrost and Arctic ecology and sends out a research ship every summer, while the island's buoy station and observation towers record the sea ice and currents all year. Puttaq Isle in the east looks after the ocean buoys moored in the surrounding waters, and Aqqanirvik, the northernmost, looks across the strait to the Illuqpakka Islands and has a sea-ice observation post. The district lives on research and higher education, native Chinese and English speakers together make up more than six in ten, and there are 108 days of polar night a year. The North Shore Alliance takes two-thirds of the vote here.\nWhen the research ship sails in summer, institute staff stand on the quay beating skin drums to see it off, and those aboard hoist a small pennant with the institute's badge, not taking it down until they return in autumn. The buoys are recovered every autumn, and the maintenance crew say the weed and shells hanging off them are their \"CV\" for a year at sea. Each autumn the strait begins to freeze from Aqqanirvik, and the observers at the post call themselves \"the gatekeepers\": the day the strait freezes over, the sledges from Illuqpakka will soon be on their way."
