    art-x-tavrunaq: Marrakiluk
  notes:
    zh: "马拉基卢克生态保护区是基卢克图阿尔河入海处的三角洲，整片划为湿地生态保护区，面积 17100 平方公里，常住约 1.1 万人，塔夫鲁纳克语母语者占 86%。大河在这里分汊成无数水道和沙洲，夏季成群的水鸟在这里繁殖，居民以传统渔猎为生，经济以自然保护、巡护和渔猎为主。三角洲本身地势低平，只在边缘有四百多米高的丘陵，夏天湿地上开满花草，冬天整片三角洲封冻，雪地车可以在冰封的水道上来往。尼尔萨瓦克高速在三角洲上的路堤延伸约 150 公里，阿卡皮图克公路也经过这里，基卢基亚克—马拉基卢克公路从自治区首府通到保护区，长不到 9 公里。卡拉克大道、暮光路和椴树大道是保护区里几个渔猎村的主街。每年有九十七天极夜。选民里北岸联盟得票最多，塔夫鲁利特人民党居次。\n春末大河开冰时，融冰和洪水漫过沙洲，三角洲一夜之间变成一片汪洋，渔民说这是大河「洗脸」的日子。洪水退去后，候鸟成群飞来，巡护员沿着水道划船数鸟，把鸟巢的位置记在防水的本子上；渔猎村的人家则在沙洲上支起木架，晾晒刚捕的白鲑和北极红点鲑。秋天水鸟南飞之前，三角洲上空整天都是鸟群的叫声，老人们说那是鸟在「点名」。"
    en: "The Marrakiluk Nature Reserve is the delta where the Kiluktuar River meets the sea, declared a wetland reserve in its entirety: 17,100 km² with about 11,000 residents, 86% of them native Tavrunaq speakers. Here the great river splits into countless channels and sandbars, flocks of waterbirds breed in summer, and people live by traditional fishing and hunting, the economy resting on conservation, ranger patrols and the catch. The delta itself is low and flat, with hills of four hundred-odd metres only at its edges; in summer the wetlands are full of flowers, and in winter the whole delta freezes and snowcats travel the frozen channels. The Nirsavaq Expressway runs some 150 km across the delta on an embankment, the Aqqapituk Road passes through as well, and the Kilukkiaq–Marrakiluk Road, less than 9 km long, links the reserve with the regional capital. Kallaaq Avenue, Twilight Road and Linden Avenue are the main streets of its fishing and hunting villages. There are ninety-seven days of polar night a year. The North Shore Alliance wins the most votes, with the Tavrulit People's Party second.\nWhen the river breaks up in late spring, melting ice and floodwater spill over the sandbars and the delta becomes a sheet of water overnight; fishermen call it the day the river \"washes its face\". When the flood goes down the migrating birds arrive in flocks, and rangers paddle along the channels counting them and marking nests in waterproof notebooks, while the village families set up wooden racks on the sandbars to dry fresh-caught whitefish and Arctic char. In autumn, before the waterbirds fly south, the sky over the delta is full of their calls all day long, and the old say the birds are \"taking the roll\"."
  codes:
