# ── 塔夫鲁利特原住民自治区 ──
- id: div_8c2skk
  subtype: locality
  parent: div_hpmerr
  status: generated
  names:
    zh: 塔夫鲁利特原住民自治区
    en: Tavrulit Indigenous Autonomous Region
    art-x-tavrunaq: Tavrulit Nalliqut
  notes:
    zh: "塔夫鲁利特原住民自治区是塔夫鲁利特人的自治区，覆盖大陆北部和内陆的大片苔原，面积 131080 平方公里，在各市级区划中排第二，66.8 万人，塔夫鲁纳克语母语者占 72%，比例是各市中最高的，区名里的 tavru 就是塔夫鲁纳克语的「土地」。首府阿卡尼克区是行政和文化中心；北部沿海的阿卡皮图米乌特区是传统猎场；南部、领地首府西北的尼尔萨瓦克区是大片牧场，领地第三大湖尼尔赛卢湖和大陆第二大冰川苏瓦西尔米冰原近一半的面积都在区内；北岸外海的皮图库维特群岛是塔夫鲁利特人传统的海上猎场，海岸上留有岩雕；尼尔萨图维特生态保护区是驯鹿的迁徙路线和产仔地，海拔 1950 米的尼尔萨皮鲁克峰是全区最高点，狭长的伊卢克塔克湖是领地第二大湖。首府一月平均气温约零下 20 度，七月约 9 度，每年有八十九天极夜。\n自治区的长老议事会参与领地治理，涉及土地、狩猎与迁徙路线的领地法案须经它同意。自治区议事会 41 席，塔夫鲁利特人民党占 18 席，自治区主席乌夸卢克·卡瓦卢克和议事会主席西克瓦克·西尔米亚克都出自该党，长老之道以 7 席居次。驯鹿放牧、传统渔猎和文化遗产是经济的特色，第一产业占 18%，人均生产总值约 5.5 万美元，在各市中偏低；居民年轻，14 岁以下的孩子约占两成。狗拉雪橇赛、鼓舞、口述史诗和岩雕骨雕代代相传，塔夫鲁利特文化中心每年冬至举办鼓舞节。首府阿卡尼克有努阿高速通往领地首府，尼尔萨瓦克高速和阿卡皮图克公路连接南北两岸，阿卡尼克机场有航班飞往努卡塔克和苔原上的牧区小镇。旗面赭红，旗杆一侧是黑底米白纹的塔夫鲁纳克滚边，正中一面金色手鼓，各领地塔夫鲁纳克城镇的滚边旗都以它为本，它也被当作塔夫鲁利特人的民族旗；区花是岩须，区树是毛枝柳。\n自治区的长老们常说一句话：「Nirsa pirri, tavru pirri」，意思是「驯鹿走的路，就是土地的路」：领地要修的路、架的线，都得先问一问驯鹿的迁徙路线，涉及土地、狩猎与迁徙的领地法案须经长老议事会同意，讲的也是这个道理。每年春天，阿卡尼克雪橇赛场要办一场横跨苔原的狗拉雪橇赛，赛程几百公里，沿途的营地由各个牧民家庭轮流照看，选手到站时总有一锅热腾腾的驯鹿肉汤等着，最后一名到达终点的选手会得到一盏油灯，意思是「再黑的路也走完了」。极夜里最重要的活动是讲史诗，老人们在帐篷或社区会堂里一连几个晚上口述祖先的故事，伴着皮鼓的节奏，孩子们从小就能背出长长的段落。这里的吃食与苔原相连：驯鹿肉干、冻鱼片、云莓和一种用驯鹿脂调成的浆果糕；岩雕和骨雕工匠的作品，是自治区最受欢迎的手艺品。"
    en: "The Tavrulit Indigenous Autonomous Region is the autonomous region of the Tavrulit people, covering the broad tundra of the north and interior of the mainland: 131,080 km², the second largest city-level division, with 668,000 people, 72% of them native Tavrunaq speakers, the highest share of any city; the tavru in its name is Tavrunaq for \"land\". Its capital, Aqqanik District, is the centre of government and culture; Aqqapitummiut District on the north coast is a traditional hunting ground; Nirsavaq District in the south, north-west of the territorial capital, is open pasture, holding Nirsaillu Lake, the territory's third largest, and nearly half of the Suvvasirmi Icefield, the second largest glacier on the mainland; the Pitukuviit Islands off the north coast are the Tavrulit's traditional hunting ground at sea, with rock carvings along their shores; and the Nirsatuvvit Nature Reserve holds the reindeer's migration routes and calving grounds, with Mount Nirsapirruk, 1,950 m, the region's highest point, and long, narrow Illuqtaq Lake, the second largest in the territory. In the capital January averages about −20 °C and July about 9 °C, with eighty-nine days of polar night a year.\nThe region's Council of Elders takes part in governing the territory, and territorial bills touching land, hunting or migration routes need its consent. The Tavrulit People's Party holds 18 of the 41 seats in the Regional Assembly, and both the Regional Chair, Ukkualuk Kavvaaluk, and the Chair of the Assembly, Siqvaaq Sirmiaq, come from it, with the Way of the Elders second on 7. Reindeer herding, traditional hunting and fishing and heritage give the economy its character; the primary sector makes up 18%, output per head is about US$55,000, on the low side among the cities, and the population is young, about a fifth of it under 15. Dog-sled racing, drum dancing, spoken epics and rock and bone carving are handed down the generations, and the Tavrulit Cultural Centre holds a drum-dance festival every winter solstice. From Aqqanik the Nuqattaaq–Aqqanik Expressway runs to the territorial capital, the Nirsavaq Expressway and the Aqqapituk Road link the north and south coasts, and Aqqanik Airport has flights to Nuqattaaq and the herding towns of the tundra. The flag is ochre with a Tavrunaq border in black and cream at the hoist and a gold hand drum at the centre; the bordered flags of Tavrunaq towns in every territory are modelled on it, and it is also taken as the national flag of the Tavrulit people. The regional flower is Arctic bell-heather and the regional tree the woolly willow.\nThe elders of the region have a saying: \"Nirsa pirri, tavru pirri\", \"the road the reindeer walk is the road of the land\". Any road or power line the territory wants to build must first take account of the reindeer's migration routes, and that is the reason territorial bills on land, hunting and migration need the consent of the Council of Elders. Every spring the Aqqanik Sled Race Grounds host a dog-sled race across the tundra, hundreds of kilometres long, its camps along the way kept in turn by herding families; at every stage a pot of steaming reindeer broth awaits the mushers, and the last to finish is given an oil lamp, meaning \"however dark the road, you walked it to the end\". The most important event of the polar night is the telling of the epics: for several nights running the elders recite the stories of their ancestors in tents or community halls to the beat of skin drums, and children learn long passages by heart. Food here is bound to the tundra: dried reindeer, frozen fish slices, cloudberries and a berry cake bound with reindeer fat, and the work of the rock and bone carvers is the region's most sought-after craft."
