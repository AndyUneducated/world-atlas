# Administrative divisions of the Arctic Ocean Territory (CN-OT).
# id: stable internal key, referenced by other files. codes.admin: 6-digit hierarchical code (GB/T 2260 pattern:
# territory 920000, city 920100, district 920101); may change on reorganisation.
# subtype follows Overture Maps divisions: country > dependency/region > locality > borough.
# Names are Chinese, English and Tavrunaq (art-x-tavrunaq), the language of the Tavrulit people.
# Special divisions: the Pallurniq Financial Zone (city level, under the Arctic Ocean Public Bank Act
# and the Financial Zone Act), the Tavrulit Indigenous Autonomous Region (city level), and nature
# reserve, ice cap and mining administration zones (district level).
divisions:
- id: div_hpmerr
  subtype: dependency
  parent: country:CN
  status: generated
  names:
    zh: 北冰洋领地
    en: Arctic Ocean Territory
    art-x-tavrunaq: Aqqimma Tavru
  short_names:
    zh: 北冰洋
    en: Arctic Ocean
  codes:
    iso3166_1:
      alpha2: OT
      alpha3: AOT
      numeric: '903'
    iso3166_2: CN-OT
    admin: '920000'
  motto:
    zh: 冰原之上，万物自由
    en: Above the Ice, All Are Free
  capital: div_8besy9
  route_shield: polar
  operators:
    expressway: { zh: 北冰洋领地冰原交通集团, en: Arctic Ocean Icefield Transport Group }
    highway: { zh: 北冰洋领地公路与雪廊局, en: Arctic Ocean Roads and Snowsheds Authority }
    rail: { zh: 北冰洋领地铁路公司, en: Arctic Ocean Railways }
  emblem:
    motif: polar_bear
    pattern: ice
  traits: { industries: [finance, datacenter, mining, tourism] }

