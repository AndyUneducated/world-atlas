    en: Tundra Herding District
    art-x-tavrunaq: Nirsavaq
  notes:
    zh: 首府西北的大片牧场，面积 37800 平方公里，30 万人，驯鹿放牧和传统渔猎占经济的一半，人均产值是全领地各区中最低的。千峡冰原近一半的面积和鹿饮湖在区内，苔原上散布着古老的石人和石堆路标。努阿高速在区内延伸约 360 公里，沿途保留了石堆路标；南岸高速也从区南部穿过。
    en: The wide pastures north-west of the capital, 37,800 km² with 300,000 people; reindeer herding and traditional hunting make up half the economy, and output per head is the lowest of any district. Nearly half of the Thousand Fjords Icefield and Reindeer Drink Lake are here, and ancient stone figures and cairns stand on the tundra. The Nuqattaaq–Aqqanik Expressway runs some 360 km through the district, leaving the cairns where they stood, and the South Coast Expressway crosses its south.
