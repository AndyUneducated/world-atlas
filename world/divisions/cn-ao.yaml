  flag_notes:
    zh: "竖分两色，旗杆一侧三分之一为金色，其余为黑色，黑色部分正中一个白色六边形框着一颗四芒星。金色是冻土黄金金库，黑色是极夜，六边形既是特区里穹顶的网格，也是交易所的标志。这面旗没有天空也没有地平线，特区的人说「我们的风景都在屏幕上」。"
    en: "Two vertical stripes, gold at the hoist a third of the width and black beyond, with a white hexagon framing a four-pointed star on the black. The gold is the permafrost gold vault, the black the polar night, and the hexagon both the grid of the zone's domes and the mark of its exchange. The flag has no sky and no horizon; people in the zone say all their scenery is on screens."
