- id: div_73wt00
  subtype: borough
  parent: div_d48kz7
  status: generated
  names:
    zh: 西尔米卡尔维克区
    en: Sirmiqarvik District
    art-x-tavrunaq: Sirmiqarvik
  notes:
    zh: "西尔米卡尔维克区是西尔米瓦克自由邦的首府，在西尔米冰盖东北边缘，面积 1200 平方公里，15.1 万人，自由邦议会设在这里。城区依山而建，平均海拔约 970 米，最高处 1905 米，是全领地地势最高的区；西尔米卡拉湾在城外，冰盖的冰舌伸入湾中，崩落的冰山从湾口漂向外海。西尔米卡尔维克冰川游客中心是冰川徒步和冰洞游览的起点，北冰洋种子与基因库凿进城外的冻土山体，保存世界各地的作物种子和动植物基因样本，即使停电，冻土也能让库房多年保持在零下；西尔米瓦克冰川机场在旅游旺季有包机从南岸飞来。西卢阿高速在这里结束，西尔米卡尔维克—西尔米冰盖公路长约 245 公里，大半在防雪棚下通往冰盖管理区。成都大道、西湾大道和茶馆大道是城里的主街，主要街道上方有约 8 公里的暖廊。经济以旅游、冰雪运动和商贸为主，北方领土保守党在这里得票约三分之一。\n带队的老向导能从冰的颜色读出它的年纪，游客中心的咖啡馆卖一种用冰盖古冰泡的茶，冰块化开时噼啪作响。每年入冬，工匠们用冰盖边缘采来的冰块砌起一座冰旅馆，春天又化回水里。机场跑道边插着一排彩色的旗子，飞行员靠它们判断风向和吹雪的强弱；种子库的门一年只开几次，每次有新的种子存进来，都会公布寄存方的名单，从远方高原的稻种到苔原上的云莓都在其中。"
    en: "Sirmiqarvik District is the capital of the Free State of Sirmivak, on the north-eastern edge of the Sirmi Ice Cap: 1,200 km² with 151,000 people, and the seat of the Free State Assembly. The town climbs the hillsides, its average elevation about 970 m and its highest point 1,905 m, the highest-lying district in the territory; outside it lies Sirmiqalla Bay, into which a tongue of the ice cap reaches, the icebergs it calves drifting out to sea. The Sirmiqarvik Glacier Visitor Centre is the starting point for glacier walks and ice-cave tours, the Arctic Ocean Seed and Gene Vault is cut into a permafrost hillside outside town to keep crop seeds and plant and animal gene samples from around the world, the permafrost keeping its vaults below freezing for years even without power, and in the tourist season charter flights come in from the south coast to Sirmivak Glacier Airport. The Sillua Expressway ends here, and the Sirmiqarvik–Sirmi Ice Cap Road runs about 245 km, most of it under snow sheds, to the ice cap administration zone. Chengdu Avenue, West Cove Avenue and Teahouse Avenue are the main streets, with some 8 km of skyways above them. The economy is tourism, winter sports and trade, and the Northern Territories Conservative Party wins about a third of the vote.\nThe old guides can read the age of ice from its colour, and the visitor centre's café sells tea made with ancient ice from the cap, which crackles as it melts. Every winter craftsmen build an ice hotel from blocks cut at the edge of the cap, and every spring it melts back into water. A row of coloured flags stands beside the airport runway, from which pilots judge the wind and the drifting snow; the door of the seed vault opens only a few times a year, and each time new seeds are deposited the list of depositors is published, from rice from distant highlands to cloudberries from the tundra."
  codes:
