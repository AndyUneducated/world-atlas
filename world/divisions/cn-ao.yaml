  parent: div_dk2gh7
  status: generated
  names:
    zh: 西尔米努卡区
    en: Sirminuqa District
    art-x-tavrunaq: Sirminuqa
  notes:
    zh: "西尔米努卡区是基卢基亚克区以东的港区，面积 2200 平方公里，12.7 万人，区名意为「冰港」，船舶与海工装备、港口航运和国防是主业，第二产业占 40%。西尔米努卡破冰船基地是领地海警与破冰船队的基地，冬季北岸封冻时破冰船为航线开路，这也是领地唯一的海上力量；船厂和修船坞围着基地分布，许多人家几代人都在船上或船坞里工作。长约 201 公里的瓦克基卢克河从区内入海，努基高速和尼尔萨瓦克高速都经过这里，尼尔萨瓦克高速在这里到达终点。光明大道、北辰大道和极昼路是镇上的主街。劳动年龄人口占 74%，每年有九十八天极夜。选民里北岸联盟得票四成多，远远领先其他政党。\n破冰船每次出港开道，河口的孩子们都沿着岸跑一段为它送行，船员会拉响汽笛回应。基地每年开冰前会对市民开放一天，孩子们可以上船摸一摸被冰磨得发亮的船头，退休的老船员站在甲板上给他们讲当年被冰困住的故事。冬夜里破冰船开道的声音从海面上传来，低沉而有节奏，镇上的人说听到这个声音才睡得踏实，因为那意味着航线还开着、补给还能进来。"
    en: "Sirminuqa District is the port district east of Kilukkiaq District, 2,200 km² with 127,000 people; its name means \"ice harbour\", and shipbuilding and offshore equipment, the port and defence are its trades, industry making up 40% of the economy. The Sirminuqa Icebreaker Base is home to the territory's coastguard and icebreaker fleet, which clears the shipping lanes when the north coast freezes in winter and is the territory's only maritime force; shipyards and repair docks surround the base, and many families have worked on the ships or in the yards for generations. The Vaqkiluk River, some 201 km long, reaches the sea in the district, and the Nuqattaaq–Kiluktuar and Nirsavaq expressways both pass through, the Nirsavaq Expressway ending here. Bright Avenue, Pole Star Avenue and Midnight Sun Road are the main streets. People of working age make up 74%, and there are ninety-eight days of polar night a year. The North Shore Alliance takes more than two-fifths of the vote, far ahead of any other party.\nWhenever an icebreaker leaves to clear the channel, the children at the river mouth run along the bank to see it off, and the crew answer with the ship's whistle. Once a year before the break-up the base opens to the public for a day, when children can climb aboard and touch a bow polished bright by the ice, and retired seamen stand on deck telling them about the times they were trapped in it. On winter nights the sound of an icebreaker working comes in from the sea, deep and rhythmic, and townspeople say they sleep better hearing it, because it means the lane is open and supplies can still get through."
