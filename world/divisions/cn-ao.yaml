# ── 帕卢尔尼克金融特区 ──
- id: div_p808br
  subtype: locality
  parent: div_hpmerr
  status: generated
  names:
    zh: 帕卢尔尼克金融特区
    en: Pallurniq Financial Zone
    art-x-tavrunaq: Pallurniq
  notes:
    zh: "帕卢尔尼克金融特区是依《北冰洋公共银行法》和《金融特区法》在首府库马尔维克区以北新设的市级金融特区，面积 60 平方公里，约 18 万人，名字取自塔夫鲁纳克语 pallu「财富」。特区一年的生产总值约 1600 亿美元，超过首府全市，人均产值约 89 万美元，居领地各市之首；第三产业占 86%，主业是金融、自由贸易与离岸业务和信息技术。特区只有帕卢库特区一个区，全是塔楼与穹顶：北冰洋公共银行总部和商业、投资、私人、托管四家附属银行，清算所兼零手续费全球实时支付网络的控制中心，金融法院、国际仲裁中心、兼管自由经济区的公司注册处、数字资产交易所、公共银行极地数据中心和冻土黄金金库都在这里，政务院财政部和它的监管司也设在特区，是少数不在首府市区的政务院机构。\n特区以零税率、不设资本管制、线上即时开户和几分钟自动注册公司为号召，公共银行号称世界上最自由的银行，私人银行提供编号与匿名账户，金融法院主持法律沙盒，财政部监管司负责金融监管；银行的利润用于领地居民分红，远在北岸和苔原上的人家也能分到一份。特区设立法会，31 席中金库党占 22 席，行政长官王清和出自金库党。居民以外来的金融、法律和技术人员为主，劳动年龄人口占 76%，中文母语者约四成，塔夫鲁纳克语母语者约三成。帕卢尔尼克高速沿峡湾东岸笔直地把特区与首府和机场连在一起。特区的旗竖分金黑两色，黑色部分正中一个白色六边形框着一颗四芒星，没有天空也没有地平线，特区的人说「我们的风景都在屏幕上」；区花是北极罂粟，区树是矮桦。\n首府人把在特区上班、很少走出暖廊和穹顶的外来者叫作「穹顶人」，穹顶人之间则流传着一个说法：面试前学会一句塔夫鲁纳克语问候，被录用的机会会大一些。特区只有六十平方公里，骑车从一头到另一头用不了半小时，塔楼之间全靠架空暖廊和地下通道连成一体，下雪天穿着衬衫就能从银行走到法院。数据中心的余热被引进穹顶，冬天穹顶下的花园里种着热带植物，中午常有人捧着咖啡在棕榈树下晒人造的太阳。每到领地主权基金发放红利那天，交易所大厅里挂出一块大屏幕，滚动显示全领地每位居民分到的数额，金融从业者和来凑热闹的首府市民挤满大厅一起倒数，公共银行总部大厦的塔顶也亮成金色。冻土黄金金库定期开放参观，游客要换上厚棉衣，穿过零下的地下长廊，才能隔着玻璃看见成排的金条。"
    en: "The Pallurniq Financial Zone is a city-level financial zone created north of Qummarvik District in the capital under the Arctic Ocean Public Bank Act and the Financial Zone Act. It covers 60 km² with about 180,000 people, and its name comes from the Tavrunaq pallu, \"wealth\". The zone produces about US$160 billion a year, more than the whole capital, and output per head is about US$889,000, the highest of any city in the territory; services make up 86% of the economy, chiefly finance, free trade and offshore business and information technology. It has a single district, Pallukut, made entirely of towers and domes: the headquarters of the Arctic Ocean Public Bank and its four subsidiary banks (commercial, investment, private and custody), the clearing house that doubles as control centre of the fee-free global real-time payment network, the financial court, the international arbitration centre, the companies registry that also runs the free economic zone, the digital asset exchange, the Public Bank Polar Data Centre and the Permafrost Gold Vault are all here, and the Executive Council's Ministry of Finance and its Supervision Department sit in the zone too, among the few ministries outside the capital proper.\nThe zone's selling points are zero tax, no capital controls, instant online accounts and companies registered automatically in minutes. The Public Bank calls itself the freest bank in the world, the private bank offers numbered and anonymous accounts, the financial court runs a legal sandbox and the Ministry's Supervision Department is the financial regulator; the banks' profits are paid out as dividends to the territory's residents, so that even households on the north shore and the tundra receive a share. The zone has a Legislative Council, where the Vault Party holds 22 of the 31 seats, and the Chief Executive, Wang Qinghe, comes from the Vault Party. Residents are mostly incoming finance, legal and technology professionals; people of working age make up 76%, about two in five are native Chinese speakers and about three in ten native Tavrunaq speakers. The Pallurniq Expressway runs dead straight along the east shore of the fjord, linking the zone with the capital and the airport. The zone's flag is divided vertically gold and black, with a white hexagon framing a four-pointed star on the black, and has no sky and no horizon; people in the zone say \"our scenery is all on screens\". Its flower is the Arctic poppy and its tree the dwarf birch.\nCapital folk call the incomers who work in the zone and seldom leave its galleries and domes \"dome people\", and among dome people a rumour goes round that learning one Tavrunaq greeting before a job interview improves your chances. The zone covers only sixty square kilometres, less than half an hour by bike from end to end, and its towers are joined by raised warm galleries and underground passages, so on a snowy day you can walk from the bank to the court in shirtsleeves. Waste heat from the data centres is piped into the domes, whose winter gardens grow tropical plants, and at lunchtime people sit under the palms with a coffee in the artificial sunshine. On the day the territory's sovereign fund pays its dividend a giant screen goes up in the exchange hall, scrolling the sum each resident of the territory will receive, and finance workers and curious townspeople from the capital pack the hall to count down together while the top of the Public Bank Tower lights up gold. The Permafrost Gold Vault opens for regular tours: visitors put on thick padded coats and walk a sub-zero underground gallery before they can see the rows of gold bars behind glass."
