    art-x-tavrunaq: Uviqsaaq
  notes:
    zh: "乌维克萨克是北冰洋大陆以东远海的群岛城市，在首府以东约 930 公里，全市 1.09 万平方公里，15.5 万人，塔夫鲁纳克语母语者占六成多。全市都在乌库乌维特群岛上，这是领地最东端的群岛，由乌维克萨克岛、西卢奥库岛、基蒂利克岛和阿考库岛组成：主岛乌维克萨克岛约 6600 平方公里，最高处海拔 783 米，城区乌维克努卡区和机场在岛的一侧；南部的西卢奥库岛地势低缓，乌库乌维特露天矿就在岛上；西部的基蒂利克岛岩石含磁铁矿，罗盘在这里会偏转；最北的阿考库岛还在勘探中。城区外的乌库马苏克海峡宽约 2 公里，是领地最窄的命名海峡，群岛间的乌库卡拉湾是补给船等待进港的地方。一月平均气温约零下 15 度，七月约 5 度，每年有八十多天极夜。\n乌库乌维特群岛的露天矿出产稀土精矿，在乌维克努卡码头装船外运，采矿、港口和制造业是主业，第二产业占经济的四成多，人均生产总值约 8.5 万美元。全市没有通往大陆的公路，对外靠船只和乌维克萨克机场的航班，航班飞往首府和西尔米瓦克，矿工两周一轮换，乘飞机往返首府。市议事会 31 席，塔夫鲁利特人民党占 10 席，市长努瓦利亚克·图拉克出自该党，冶炼与矿山工会社会主义工人党有 6 席。市旗是暗红底上三座白色海岛浮在两道海浪之上，暗红是稀土精矿的颜色；市花是高山勿忘我，市树是偃松。\n乌维克萨克的名字里有塔夫鲁纳克语的 uviq「岛」，本地人说「我们的高速公路是航线和海路」。乌维克萨克机场是全市最热闹的地方，每天航班一到，接人的、取货的、来看热闹的把候机厅挤得满满当当，机场咖啡馆的黑板上写着当天航班和补给船的到港时间。补给船靠岸的日子像过节，超市门口排起长队，抢购新鲜的水果和牛奶；风暴一来，船和飞机都停，码头边的黑板上只写一个字：「等」，岛上的人就靠冻鱼、腌菜和自家烤的面包过日子。乌库乌维特露天矿的工人来自领地各地，孩子们把矿上运出来的矿石叫作「彩色石头」，学校的标本柜里摆着一整排。风暴天停飞时，机场候机厅就成了全市打牌和聊天的地方；乌库马苏克海峡窄得两岸的人隔着水能互相喊话，补给船经过时，两边的孩子会一起跑到岸边挥手。基蒂利克岛上的老向导干脆不带罗盘，只靠太阳和海岸线认路，因为岛上的磁铁矿会让指针乱转。"
    en: "Uviqsaaq is the island city far out to sea east of the Arctic Ocean mainland, about 930 km east of the capital, with 155,000 people in 10,900 km², more than six in ten of them native Tavrunaq speakers. The whole city lies on the Ukkuuviit Islands, the territory's easternmost archipelago: Uviqsaaq Island, Silluaukku Island, Qittilik Island and Aqqaukku Island. The main island, Uviqsaaq, about 6,600 km² and rising to 783 m, has the town, Uviqnuqa District, and the airport on one side; low-lying Silluaukku in the south holds the Ukkuuviit Open Pit; the rocks of Qittilik in the west contain magnetite that sends compasses astray; and Aqqaukku, the northernmost, is still being prospected. Off the town the Ukkumasuq Strait, about 2 km wide, is the narrowest named strait in the territory, and Ukkuqalla Bay among the islands is where supply ships wait to come in. January averages about −15 °C and July about 5 °C, with more than eighty days of polar night a year.\nThe open pit on the Ukkuuviit Islands produces rare-earth concentrate, shipped out from Uviqnuqa Quay; mining, the port and manufacturing are the main trades, industry makes up over two-fifths of the economy, and output per head is about US$85,000. There is no road to the mainland; the city depends on ships and the flights of Uviqsaaq Airport to the capital and Sirmivak, and the miners work two-week rotations, flying to and from the capital. The Town Assembly has 31 seats, the Tavrulit People's Party holds 10 and the mayor, Nuvaliaq Tullaaq, comes from it, while the Smelters' and Miners' Union Socialist Workers' Party has 6. The city flag shows three white islands above two lines of waves on dark red, the red being the colour of the rare-earth concentrate; the city flower is the alpine forget-me-not and the city tree the Siberian dwarf pine.\nUviqsaaq has the Tavrunaq uviq, \"island\", in its name, and locals say \"our expressways are the air routes and the sea lanes\". Uviqsaaq Airport is the liveliest place in town: when the day's flight lands, people meeting friends, collecting freight or just watching pack the terminal, and the blackboard in the airport café lists the day's flights and the arrival of the supply ship. Supply-ship days are like holidays, with queues outside the supermarkets for fresh fruit and milk; when storms ground the ships and planes, the blackboard on the quay bears a single word, \"Wait\", and islanders live on frozen fish, pickles and home-baked bread. The workers at the Ukkuuviit Open Pit come from all over the territory, and their children call the ore that comes out of it \"coloured stones\"; the school's specimen cabinet has a whole shelf of them. When storms ground the flights the airport lounge becomes the town's place for cards and talk; the Ukkumasuq Strait is so narrow that people can shout to each other across the water, and when a supply ship passes the children on both shores run down to wave together. The old guides on Qittilik don't bother with a compass, finding their way by the sun and the coastline instead, because the island's magnetite sets the needle spinning."
