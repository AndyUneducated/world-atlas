    en: The nature reserve of the reindeer migration routes, 50,200 km², the second largest district in the territory, with about 17,000 residents, mostly herders who follow the herds. The reindeer return to the calving grounds each spring, when vehicles and aircraft must keep away; the 1,950 m Mount Nirsapirruk and Illuqtaq Lake are here. Where the South Coast and Tundra expressways cross the reserve, their embankments are raised and culverts widened, and night traffic is restricted in the migration season.
