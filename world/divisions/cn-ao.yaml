    zh: "铜红色的天空下是黑色的山脊，山脊上升起一团金色火焰。铜红是基萨尔维克冶炼厂炉口映红的天色，火焰是冶炼内陆镍矿的炉火，黑色山脊是峡湾两岸的岩山和码头上堆存的矿石。乌库拉克人说，极夜里远远望见冶炼厂的光，就知道离家不远了。"
    en: "A gold flame rising from a black ridge under a copper-red sky. The copper is the sky lit by the furnaces of the smelter, the flame the fires that smelt nickel from the inland mines, the black ridge the rock hills of the fjord and the ore heaped on the quays. People say that in the polar night the glow of the smelter seen from afar means home is near."
