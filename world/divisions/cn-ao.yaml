- id: div_gfjesn
  subtype: borough
  parent: div_dk2gh7
  status: generated
  names:
    zh: 伊卢克帕卡区
    en: Illuqpakka District
    art-x-tavrunaq: Illuqpakka
  notes:
    zh: "伊卢克帕卡区是纳卢维特群岛以北的伊卢克帕卡群岛，由帕卡尔尤阿克岛和伊卢克库卢克岛组成，是基卢克图阿尔原住民自治区最北的区，面积 30000 平方公里，常住约 6000 人，塔夫鲁纳克语母语者占八成多。群岛是被冰川刮磨过的古老岩盘，地势低平，最高处不到 500 米；主岛帕卡尔尤阿克岛约 3 万平方公里，是领地第三大岛，岛名意为「破碎的大岛」，北面的伊卢克库卢克岛约 630 平方公里，意为「小湖岛」。岸线被无数峡湾、海湾和水道切得支离破碎，岛上的大小湖泊数以千计。区名在塔夫鲁纳克语里是「碎湖」，夏天从飞机上看下去，陆地和湖水像一面打碎的镜子。这里每年极夜长达 122 天，一月平均气温约零下 24 度。居民散居在几个渔猎村里，以湖鱼、驯鹿和海豹为生，第一产业占四成多，夏天有探矿队上岛；群岛没有公路，村与村之间夏天划船、冬天驾雪橇来往。北岸联盟在这里拿到近四分之三的选票。\n夏天伊卢克库卢克岛湖里的北极红点鲑肥美，帕卡尔尤阿克岛的渔民划船过来下网，在岛上的石头小屋里住上几天，把鱼挂在风里晾成鱼干。秋天纳卢维特群岛和这里之间的海峡封冻后，雪橇队就沿着冰面往南去，给研究所送去鱼干，换回燃油和药品。极夜里村子只靠几盏灯和天上的极光照明，老人们围着炉子讲祖辈在湖与湖之间迁徙的故事。"
    en: "Illuqpakka District is the Illuqpakka Islands north of the Naalluviit Islands, Pakkarjuaq and Illuqkuluk, the northernmost district of the Kiluktuar Indigenous Autonomous Region: 30,000 km² with about 6,000 residents, more than eight in ten of them native Tavrunaq speakers. The islands are ancient bedrock scoured by glaciers, low and flat, nowhere reaching 500 m; the main island, Pakkarjuaq, about 30,000 km², is the third largest island in the territory and its name means \"great broken island\", while Illuqkuluk to the north, about 630 km², means \"little lake island\". Countless fjords, bays and channels break up the coastline, and the islands hold lakes large and small by the thousand. In Tavrunaq the district's name means \"broken lakes\", and seen from a plane in summer the land and water look like a shattered mirror. The polar night here lasts 122 days a year, and January averages about −24 °C. People live scattered in a few fishing and hunting villages on lake fish, reindeer and seals, the primary sector making up more than two-fifths of the economy, and prospecting parties come ashore in summer; there are no roads, so villages are linked by boat in summer and by sledge in winter. The North Shore Alliance takes nearly three-quarters of the vote.\nIn summer the Arctic char in the lakes of Illuqkuluk grow fat, and fishermen from Pakkarjuaq row over to set nets, staying a few days in stone huts on the island and hanging the fish in the wind to dry. Once the strait between here and the Naalluviit Islands freezes in autumn, sledge teams head south across the ice to bring dried fish to the institute and come back with fuel and medicine. In the polar night the villages are lit only by a few lamps and the aurora overhead, and the old gather round the stove to tell of their forebears' journeys from lake to lake."
  codes:
    admin: '920706'
  population: 6000
  area_km2: 30000.0
  traits: { industries: [fishing, hunting, mining], heritage: tavrulit }

# ── 西尔米瓦克自由邦 ──
- id: div_d48kz7
  subtype: locality
  parent: div_hpmerr
  status: generated
  names:
    zh: 西尔米瓦克自由邦
    en: Free State of Sirmivak
    art-x-tavrunaq: Sirmivak Viluqut
  notes:
    zh: "西尔米瓦克自由邦是领地东北部和北方海上的冰原自由邦，面积 33.3 万平方公里，是领地面积最大的市级区划，将近全领地的四成，却只有 23.3 万人，人口密度在各市级区划中最低。约 2.95 万平方公里的西尔米冰盖是世界最大的冰盖，海拔 4014 米的领地最高峰西尔米峰从冰面上陡然拔起一千五百多米；冰盖融水汇成长约 499 公里的西尔米河，是领地最长的河。外海的西尔米乌维特群岛划为冰盖管理区，主岛基库维克岛是领地第二大岛；东北远海的乌瓦卡鲁库维特群岛和领地最北的皮鲁库维特群岛划为生态保护区，皮鲁克尔尤阿克岛面积约 13.2 万平方公里，是领地最大的岛，岛上的卡拉克西尔米冰原约 2.5 万平方公里，是世界第二大冰原。城区西尔米卡尔维克区以冰川旅游和冰雪运动为业，北冰洋种子与基因库凿进城外的冻土山体；陶瓦尼克区的天文台和观测站散布在冰盖以东的高地上。城区一月平均气温约零下 22 度，每年极夜 99 天、极昼 109 天。\n自由邦有自己的邦宪章：土地与荒野的登记和管理，冰川向导、猎人和探矿者的许可证，地方税率，以及各镇学校的课程，都由自由邦议会决定，领地的法律在这里照常适用。自由邦议会 33 席，北方领土保守党占 13 席，自由邦主席陶维克·图拉克和议长西克瓦克·卡尔苏克都出自该党，它与金库党和长老之道组成三党右翼联合政府，主张小政府、自耕自立和领地最低的地方税，自成冰原本土保守的一派。经济以科研、旅游和冰雪运动为主，人均生产总值约 6.4 万美元。西卢阿高速沿冰盖外缘的基岩修建，是通往南岸的唯一一条高速，在西尔米卡尔维克结束；冰川机场在旅游旺季有包机从南岸飞来。旗面是蓝灰色天空下的白色冰盖、锯齿状群峰和一座深蓝色天文台圆顶，邦花是苔原毛茛。\n西尔米瓦克的名字来自塔夫鲁纳克语的 sirmi「冰」，许多居民以冰川向导和冰雪运动为业，老向导能从冰的颜色读出它的年纪：越蓝的冰越老、越密。每年入冬，西尔米卡尔维克的工匠用冰盖边缘采来的冰块砌起一座冰旅馆，墙、床和酒杯全是冰做的，到了春天整座旅馆慢慢化回水里，下一个冬天再从头砌起。客人最喜欢的纪念是一杯用冰盖古冰泡的茶，冰块在杯里化开时噼啪作响，那是封在冰里的古老空气在释放。本地人说西尔米瓦克的天比别处大一圈，镇与镇之间隔着上百公里的冰原，出门要带两样东西：防熊步枪和卫星电话。这里的人信奉「自己的雪自己铲」，可暴风雪天谁家的雪地车陷在冰原上，半个镇的人都会开车出去拖；自由邦议会开会前，议员们要先在议会门口的长桌上一起吃一顿驯鹿肉排，议长说，吃饱了的人吵架不记仇。陶瓦尼克天文台趁着九十九天的极夜整季观测，观测员们轮流值班，冬天结束时在食堂办一场「见太阳」聚餐，第一缕阳光照进窗户时，整屋人放下刀叉一起鼓掌。"
    en: "The Free State of Sirmivak is the ice-field free state of the territory's north-east and its northern seas. At 333,000 km² it is the largest city-level division in the territory, nearly four-tenths of the whole, yet it has only 233,000 people, the lowest density of any city-level division. The Sirmi Ice Cap, some 29,500 km², is the largest ice cap in the world, and Mount Sirmi, 4,014 m, the territory's highest peak, rises more than 1,500 m sheer from its surface; the cap's meltwater gathers into the Sirmi River, some 499 km long, the longest river in the territory. The Sirmiuviit Islands offshore are an ice administration zone, their main island, Kiiquviq, the second largest in the territory; the Uvvaakkaruquviit Islands far to the north-east and the Pirrukuviit Islands, the territory's northernmost, are nature reserves, and Pirrukrjuaq Island, about 132,000 km², is the largest island in the territory, its Kallaaqsirmi Icefield, some 25,000 km², the second largest icefield in the world. The town, Sirmiqarvik District, lives on glacier tourism and winter sports, and the Arctic Ocean Seed and Gene Vault is cut into a permafrost hillside outside it; the observatories and stations of Tauvvaniq District are scattered across the uplands east of the ice cap. In town January averages about −22 °C, and each year brings 99 days of polar night and 109 of midnight sun.\nThe Free State has its own charter: the registration and management of land and wilderness, licences for glacier guides, hunters and prospectors, local tax rates and the curriculum of each town's schools are all decided by the Free State Assembly, while territorial law applies here as everywhere else. The Northern Territories Conservative Party holds 13 of the Assembly's 33 seats, and both the President of the Free State, Tauvvik Tullaaq, and the Speaker, Siqvaaq Qaarsuk, come from it; it governs in a three-party right-wing coalition with the Vault Party and the Way of the Elders, standing for small government, self-reliance and the lowest local taxes in the territory, an ice-field conservatism all its own. The economy rests on research, tourism and winter sports, with output per head of about US$64,000. The Sillua Expressway, built on the bedrock round the outer edge of the ice cap, is the only expressway to the south coast and ends at Sirmiqarvik, and in the tourist season charter flights come in from the south coast to the glacier airport. The flag shows a white ice cap, jagged peaks and a deep blue observatory dome under a grey-blue sky, and the state flower is the snow buttercup.\nSirmivak takes its name from the Tavrunaq sirmi, \"ice\", and many of its people work as glacier guides or in winter sports; old guides can read the age of ice from its colour, the bluer the older and denser. Each winter the craftsmen of Sirmiqarvik build an ice hotel from blocks cut at the edge of the ice cap, walls, beds and glasses all of ice, and in spring it slowly melts back into water, to be built afresh the next winter. Guests' favourite souvenir is a cup of tea made with ancient ice from the cap, which crackles as it melts in the cup: the sound of old air sealed in the ice escaping. Locals say the sky over Sirmivak is a size bigger than anywhere else; the towns lie a hundred kilometres or more apart across the ice, and nobody goes out without two things, a bear rifle and a satellite phone. People here hold that \"everyone shovels their own snow\", yet when someone's snowmobile is stuck out on the ice in a blizzard, half the town drives out to pull it free; and before each sitting of the Free State Assembly the members eat a reindeer steak together at the long table by the assembly door, because, the Speaker says, people who argue on a full stomach do not bear grudges. The Tauvvaniq Observatory makes the most of ninety-nine days of polar night to observe all season, its staff taking turns on duty, and when winter ends they hold a \"meet the sun\" dinner in the canteen; when the first ray comes through the window, everyone puts down knives and forks and applauds."
  codes:
