# Administrative divisions of the Arctic Ocean Territory (CN-AO).
# id: stable internal key, referenced by other files. codes.admin: 6-digit hierarchical code (GB/T 2260 pattern:
# territory 920000, city 920100, district 920101); may change on reorganisation.
# subtype follows Overture Maps divisions: country > dependency/region > locality > borough.
# Names are Chinese, English and Tavrunaq (art-x-tavrunaq), the language of the Tavrulit people.
# Special divisions: the Pallurniq Financial Zone (city level, under the Arctic Ocean Public Bank Act
# and the Financial Zone Act), the Tavrulit Indigenous Autonomous Region (city level), and nature
# reserve, ice cap and mining administration zones (district level).
divisions:
- id: div_hpmerr
  subtype: dependency
  parent: country:CN
  status: generated
  names:
    zh: 北冰洋领地
    en: Arctic Ocean Territory
    art-x-tavrunaq: Aqqimma Tavru
  notes:
    zh: 北冰洋领地在北维京岛以北的北冰洋上，由一块主大陆和周围十个群岛组成，面积约 65 万平方公里，人口 506 万。南岸有暖流经过，港口终年不冻，首府努卡塔克和萨尔瓦克、乌库拉克、图利瓦克等大城市都在南岸；北岸冬季封冻，靠破冰船通航。内陆是冻土苔原和星罗棋布的湖泊，东北是西尔米冰盖，四成多的土地划为生态保护区和冰盖管理区。冬季有连续数周的极夜，夏季有极昼。塔夫鲁纳克语母语者占人口的 53%，大陆北部和内陆苔原设塔夫鲁利特原住民自治区，长老议事会参与领地治理。经济以金融、数据中心与算力、采矿和旅游为主，人均生产总值约 10.7 万美元；北冰洋公共银行和帕卢尔尼克金融特区设在首府旁。领地与其他领地没有陆路相连，对外只靠航空和破冰海运。
    en: The Arctic Ocean Territory lies in the Arctic Ocean north of North Viking Island, a mainland and ten archipelagos around it, some 650,000 km² with 5.06 million people. A warm current runs along the south coast and keeps its harbours open all year, and the capital Nuqattaaq and the other large cities (Saarvaq, Ukkulaaq and Tullivaq) all stand on it; the north coast freezes in winter and is kept open by icebreakers. Inland lie permafrost tundra and countless lakes, with the Sirmi Ice Cap in the north-east, and over two-fifths of the land is set aside as nature reserves and ice cap administration zones. Winter brings weeks of polar night and summer the midnight sun. Native Tavrunaq speakers make up 53% of the population; the north of the mainland and the inland tundra form the Tavrulit Indigenous Autonomous Region, whose council of elders takes part in governing the territory. Finance, data centres and computing, mining and tourism lead the economy, with output of about 107,000 dollars a head, and the Arctic Ocean Public Bank and the Pallurniq Financial Zone stand beside the capital. There is no land link to the other territories; the only ways in are by air and by icebreaker-escorted sea.
  short_names:
    zh: 北冰洋
    en: Arctic Ocean
  codes:
    iso3166_1:
      alpha2: AO
      alpha3: AOT
      numeric: '903'
    iso3166_2: CN-AO
    admin: '920000'
  motto:
    zh: 冰原之上，万物自由
    en: Above the Ice, All Are Free
  capital: div_8besy9
  route_shield: polar
  operators:
    expressway: { zh: 北冰洋领地冰原交通集团, en: Arctic Ocean Icefield Transport Group }
    highway: { zh: 北冰洋领地公路与雪廊局, en: Arctic Ocean Roads and Snowsheds Authority }
    rail: { zh: 北冰洋领地铁路公司, en: Arctic Ocean Railways }
  emblem:
    motif: polar_bear
    pattern: ice
  traits: { industries: [finance, datacenter, mining, tourism] }

# ── 努卡塔克市（首府）──
- id: div_8besy9
  subtype: locality
  parent: div_hpmerr
  status: generated
  names:
    zh: 努卡塔克市
    en: Nuqattaaq City
    art-x-tavrunaq: Nuqattaaq
  notes:
    zh: 领地首府，坐落在南岸努卡塔克峡湾的湾口两岸，全市 150 万人，约占领地人口的三成。领地政府和议会在库马尔维克区，市中心的中央穹顶和成片的暖廊让市民在极夜和暴风雪里也能步行出门；努坎加克区是老渔港，苏瓦利克区有北冰洋大学，伊马萨尔维克区的港区终年不冻，尼尔萨库特区有国际机场。冻土上的建筑大多立在桩基上，底层架空让冷风流过，防止冻土融化。地铁四条线、81 座车站，一条通到机场；西卢阿高速以跨海大桥跨过峡湾口，努基高速、环线和通往金融特区、矿区、阿卡尼克的高速都从这里出发。塔夫鲁纳克语母语者约占四成，外来的金融与科技从业者多住在库马尔维克区和图维尔尤阿克区。
    en: The territorial capital, on both shores of the mouth of Nuqattaaq Fjord on the south coast, with 1.5 million people, about three-tenths of the territory. The government and assembly sit in Qummarvik District, and the Central Dome and the skyways of the centre let people walk about through the polar night and in blizzards; Nuqangaq is the old fishing port, Suvvalik has the University of the Arctic Ocean, Immasaarvik has the ice-free harbour and Nirsakut the international airport. Most buildings on the permafrost stand on piles with an open ground floor, so the cold wind passes beneath and the ground stays frozen. The metro has four lines and 81 stations, one of them to the airport; the Sillua Expressway crosses the fjord mouth on a sea bridge, and the Nuqattaaq–Kiluktuar Expressway, the ring road and the expressways to the Financial Zone, the mines and Aqqanik all start here. About two in five residents are native Tavrunaq speakers, and the incoming finance and technology workers mostly live in the Qummarvik and Tuvvirjuaq districts.
  codes:
    admin: '920100'
    unlocode: AO NUQ
  population: 1500000
  area_km2: 8960.0
  color: '#1B2F5E'
  emblem:
    motif: dome
    pattern: aurora
  traits: { industries: [government, finance, tech, port], heritage: polar_global, age: balanced, income: 1.1 }
- id: div_q7cydv
  subtype: borough
  parent: div_8besy9
  status: generated
  names:
    zh: 努坎加克区
    en: Nuqangaq District
    art-x-tavrunaq: Nuqangaq
  notes:
    zh: 首府最老的城区，在努卡塔克峡湾口西岸，由老渔港发展而来，木屋街巷、鱼市和船坞沿用有机的老街网，塔夫鲁纳克语母语者过半。全区 300 平方公里住着 27 万人，人口密度在首府仅次于库马尔维克区。努坎加克灯光广场是极夜灯光节和冰雕展的主会场，冬季游客在这里看灯、吃烟熏鱼。西卢阿高速穿过区内，再经努卡塔克峡湾跨海大桥通往伊马萨尔维克区；环线和一条地铁也经过这里，主要街道上方有约 19 公里的暖廊。
    en: The oldest part of the capital, on the west side of the mouth of Nuqattaaq Fjord, grown out of the old fishing port; its timber houses, fish market and boatyards keep the old organic street pattern, and more than half its people are native Tavrunaq speakers. 270,000 people live in its 300 km², the densest district of the capital after Qummarvik District. Nuqangaq Light Square is the main venue of the polar-night light festival and the ice-sculpture show, where winter visitors come for the lights and smoked fish. The Sillua Expressway passes through and then crosses the fjord mouth to Immasaarvik on the Nuqattaaq Fjord Bridge; the ring road and a metro line also run through, and some 19 km of skyways cover the main streets.
  codes:
    admin: '920101'
  population: 270000
  area_km2: 300.0
  traits: { industries: [government, heritage, tourism], heritage: polar_mixed }
- id: div_9s80v8
  subtype: borough
  parent: div_8besy9
  status: generated
  names:
    zh: 库马尔维克区
    en: Qummarvik District
    art-x-tavrunaq: Qummarvik
  notes:
    zh: 首府的市中心，沿努卡塔克峡湾展开，33 万人住在 250 平方公里内，人口居全领地各区之首，人口密度仅次于帕卢库特区。领地政府与议会、中央穹顶、领地的高铁总站努卡塔克站都在区内，库马尔大街两侧是商场、酒店和办公楼，约 53 公里的暖廊把它们连成一片。库马尔大街下的地铁线通往尼尔萨库特区的国际机场。努基高速和帕卢尔尼克高速从这里出发，北面紧邻帕卢尔尼克金融特区。居民中外来的金融、科技从业者比例高，人均产值在首府各区中最高。
    en: The centre of the capital, along Nuqattaaq Fjord, with 330,000 people in 250 km², the most populous district in the territory and the second most densely peopled, after Pallukut District. The government and assembly, the Central Dome and Nuqattaaq station on the high-speed line are all here, Qummar Boulevard is lined with shops, hotels and offices, and some 53 km of skyways join them together. The metro line under Qummar Boulevard runs to the international airport in Nirsakut District. The Nuqattaaq–Kiluktuar and Financial Zone expressways start here, and the Pallurniq Financial Zone adjoins it to the north. Many residents are incoming finance and technology workers, and output per head is the highest of the capital's districts.
  codes:
    admin: '920102'
  population: 330000
  area_km2: 250.0
  traits: { industries: [commerce, finance, tourism], income: 1.15 }
- id: div_j06x18
  subtype: borough
  parent: div_8besy9
  status: generated
  names:
    zh: 苏瓦利克区
    en: Suvvalik District
    art-x-tavrunaq: Suvvalik
  notes:
    zh: 首府北部的住宅区，30 万人，以成排的住宅楼和社区服务为主。北冰洋大学在区内，以极地工程、冰川学、金融法和塔夫鲁纳克语研究见长，学生和教师让这里比市中心更年轻；苏瓦利克冰雕园每年冬季用峡湾的冰块雕成城堡和神话人物。努基高速和环线都经过区内，一条地铁线连接市中心。
    en: The capital's northern residential district, with 300,000 people living mostly in rows of apartment blocks with their community services. The University of the Arctic Ocean is here, known for polar engineering, glaciology, financial law and Tavrunaq studies, and its students and staff make the district younger than the centre; each winter the Suvvalik Ice Sculpture Garden turns blocks of fjord ice into castles and mythical figures. The Nuqattaaq–Kiluktuar Expressway and the ring road both pass through, and a metro line links it with the centre.
  codes:
    admin: '920103'
  population: 300000
  area_km2: 600.0
  traits: { industries: [residential, education, commerce] }
- id: div_3b9pkz
  subtype: borough
  parent: div_8besy9
  status: generated
  names:
    zh: 图维尔尤阿克区
    en: Tuvvirjuaq District
    art-x-tavrunaq: Tuvvirjuaq
  notes:
    zh: 首府西部的住宅与疗养区，27 万人。区内的暖廊全长约 102 公里，是全领地最长的暖廊网络，住宅街坊、医院、商场和地铁站之间不出户外就能往来，老年居民的比例也是首府最高的。图维尔尤阿克室内海滩一年四季保持夏日的温度和光照，帕尔尼克体育场冬季举办冰上运动和灯光节开幕式。西卢阿高速和环线穿过区内，努阿高速从这里出发通往阿卡尼克。
    en: The capital's western residential and health district, with 270,000 people. Its skyways run to some 102 km, the longest network in the territory, so homes, hospitals, shops and metro stations can be reached without going outdoors, and it has the highest share of older residents in the capital. The Tuvvirjuaq Indoor Beach keeps summer warmth and light all year, and the Paarniq Arena hosts ice sports and the opening of the light festival in winter. The Sillua Expressway and the ring road cross the district, and the Nuqattaaq–Aqqanik Expressway starts here for Aqqanik.
  codes:
    admin: '920104'
  population: 270000
  area_km2: 700.0
  traits: { industries: [residential, healthcare, retail] }
- id: div_k8cx0t
  subtype: borough
  parent: div_8besy9
  status: generated
  names:
    zh: 帕利瓦克区
    en: Paalivaq District
    art-x-tavrunaq: Paalivaq
  notes:
    zh: 首府北郊的区，面积 2000 平方公里，13.5 万人，城区之外是覆着积雪的白色苔原，区名由此而来。帕利卢湖在区内，物流仓库沿努基高速和环线分布；帕利瓦克垂直农场用人工光照种植蔬菜和浆果，供应首府大部分的新鲜蔬菜。努基高速在区内北上，进入苏瓦尔尤伊特山脉前的最后一段城郊。
    en: A district on the northern edge of the capital, 2,000 km² with 135,000 people; beyond the town lies snow-covered white tundra, which gives it its name. Paalillu Lake is here, warehouses line the Nuqattaaq–Kiluktuar Expressway and the ring road, and the Paalivaq Vertical Farm grows vegetables and berries under artificial light, supplying most of the capital's fresh greens. The expressway heads north through the district, the last stretch of suburb before the Suvvarjuit Mountains.
  codes:
    admin: '920105'
  population: 135000
  area_km2: 2000.0
  traits: { industries: [aviation, logistics, residential] }
- id: div_jvwq60
  subtype: borough
  parent: div_8besy9
  status: generated
  names:
    zh: 伊马萨尔维克区
    en: Immasaarvik District
    art-x-tavrunaq: Immasaarvik
  notes:
    zh: 首府的港口区，在努卡塔克峡湾口东岸，15 万人。暖流让港湾终年不冻，伊马萨尔维克港区的突堤上排着集装箱、矿石、油品和滚装码头，是领地最大的港区；乌库利特重载铁路在这里的货运站结束，矿石直接装船，无人驾驶列车的调度中心也设在区内。乌库利特高速从这里北上，西卢阿高速经努卡塔克峡湾跨海大桥进入区内，环线绕过港区。冬季冻结的湖面上辟有冰上赛车场。
    en: The capital's port district, on the east side of the mouth of Nuqattaaq Fjord, with 150,000 people. A warm current keeps the harbour open all year, and the moles of Immasaarvik Harbour, the largest harbour in the territory, hold container, ore, oil and ro-ro terminals; the Ukkuliit Heavy-Haul Railway ends at the freight yard here, its ore goes straight onto ships, and the control centre of its driverless trains is in the district. The Ukkuliit Expressway heads north from here, the Sillua Expressway arrives over the fjord-mouth sea bridge and the ring road skirts the harbour. In winter an ice speedway is laid out on a frozen lake.
  codes:
    admin: '920106'
  population: 150000
  area_km2: 1200.0
  traits: { industries: [port, shipbuilding, logistics] }
- id: div_k4vyb1
  subtype: borough
  parent: div_8besy9
  status: generated
  names:
    zh: 尼尔萨库特区
    en: Nirsakut District
    art-x-tavrunaq: Nirsakut
  notes:
    zh: 首府东北的城郊区，面积近 4000 平方公里，只有 4.5 万人，大片苔原上仍有驯鹿放牧，塔夫鲁纳克语母语者过半。努卡塔克国际机场在区内，跑道配有融雪加热系统，地铁线从市中心一直通到航站楼；尼尔萨库特午夜高尔夫球场在极昼时节午夜也能开球。西卢阿高速、努基高速、帕卢尔尼克高速、环线和乌库利特高速都经过区内，是首府外围的交通枢纽。
    en: The capital's north-eastern outskirts, nearly 4,000 km² with only 45,000 people, where reindeer are still herded on the open tundra and over half the residents are native Tavrunaq speakers. Nuqattaaq International Airport is here, its runways heated against snow, and the metro runs all the way from the centre to the terminal; at the Nirsakut Midnight Sun Golf Course players tee off at midnight in summer. The South Coast, Nuqattaaq–Kiluktuar and Financial Zone expressways, the ring road and the Ukkuliit Expressway all pass through, making it the transport hub on the edge of the capital.
  codes:
    admin: '920107'
  population: 45000
  area_km2: 3910.0
  traits: { industries: [research, education, herding], heritage: polar_mixed, age: young }

# ── 帕卢尔尼克金融特区 ──
- id: div_p808br
  subtype: locality
  parent: div_hpmerr
  status: generated
  names:
    zh: 帕卢尔尼克金融特区
    en: Pallurniq Financial Zone
    art-x-tavrunaq: Pallurniq
  notes:
    zh: 依《北冰洋公共银行法》和《金融特区法》在首府库马尔维克区以北新设的市级金融特区，面积 60 平方公里，约 18 万人，人均产值居领地各市之首。特区只有帕卢库特区一个区，全是塔楼与穹顶：北冰洋公共银行总部和四家附属银行、清算所、金融法院、国际仲裁中心、公司注册处、数字资产交易所、极地数据中心和冻土黄金金库都在这里。特区以零税率、不设资本管制、线上即时开户和几分钟自动注册公司为号召，银行的利润用于领地居民分红。帕卢尔尼克高速经帕卢库特高架桥连接首府和干线高速。
    en: A city-level financial zone created under the Arctic Ocean Public Bank Act and the Financial Zone Act just north of the capital's Qummarvik District, 60 km² with about 180,000 people and the highest output per head of any city in the territory. Its single district, Pallukut District, is all towers and domes, home to the headquarters of the Arctic Ocean Public Bank and its four affiliate banks, the clearing house, the financial court, the international arbitration centre, the companies registry, the digital asset exchange, the polar data centre and the permafrost gold vault. The zone offers no taxes, no capital controls, instant online accounts and companies registered automatically in minutes, and the bank's profits are paid out as a dividend to the territory's residents. The Pallurniq Expressway links it to the capital and the trunk roads over the Pallukut Viaduct.
  codes:
    admin: '920200'
    unlocode: AO PLN
  population: 180000
  area_km2: 60.0
  special_status: financial_zone
  color: '#B8892B'
  emblem:
    motif: exchange
    pattern: hex
  traits: { industries: [finance, trade, tech], heritage: polar_global, age: young, income: 6.4 }
- id: div_ga9pxy
  subtype: borough
  parent: div_p808br
  status: generated
  names:
    zh: 帕卢库特区
    en: Pallukut District
    art-x-tavrunaq: Pallukut
  notes:
    zh: 帕卢尔尼克金融特区唯一的区，约 18 万人住在 60 平方公里内，几乎全是塔楼、穹顶和裙楼，是全领地人口密度最高的区。帕卢图阿尔大道两侧依次是北冰洋公共银行总部大厦和商业、投资、私人、托管四座附属银行大厦，基里街通往冻土黄金金库；清算所、金融法院、仲裁中心、公司注册处和数字资产交易所分布在中心周围。帕卢尔尼克冬季花园和卡拉克穹顶两座穹顶是员工午休和过冬的去处，约 23 公里的暖廊连起各栋楼。居民以外来的金融、法律和技术人员为主，劳动年龄人口占 76%。
    en: The only district of the Pallurniq Financial Zone, about 180,000 people in 60 km² of almost nothing but towers, domes and podiums, the most densely peopled district in the territory. Pallutuar Avenue is lined with the Arctic Ocean Public Bank headquarters and the towers of its four affiliates (commercial, investment, private and custody banking), and Kirri Street leads to the permafrost gold vault; the clearing house, financial court, arbitration centre, companies registry and digital asset exchange stand around the centre. The Pallurniq Winter Garden and the Midnight Sun Square are the two domes where staff spend their lunch hours and the winter, and some 23 km of skyways join the buildings. Most residents are incoming finance, legal and technology workers, and 76% are of working age.
  codes:
    admin: '920201'
  population: 180000
  area_km2: 60.0

# ── 萨尔瓦克市 ──
- id: div_nbf1bw
  subtype: locality
  parent: div_hpmerr
  status: generated
  names:
    zh: 萨尔瓦克市
    en: Saarvaq City
    art-x-tavrunaq: Saarvaq
  notes:
    zh: 南岸人口第二多的城市，在首府以西约 430 公里，59.3 万人，塔夫鲁纳克语母语者占六成多。城区萨尔努卡区在萨尔苏瓦峡湾口，东边是乌利图克区的渔村和加工厂，西北的普拉苏瓦米乌特区占全市六成面积，是峡湾、冰川和山地；南岸外海的乌利库维特群岛是深海养殖基地，西部远海的通纳库维特群岛划为生态保护区。全市以港口航运、渔业、海水养殖和水产加工为主。西卢阿高速和西卢阿高速铁路穿城而过，城区有一条地铁，普拉苏瓦公路通往峡湾深处的村镇。
