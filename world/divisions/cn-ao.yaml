    en: The traditional hunting ground along the region's northern coast, 28,000 km² with 111,000 people, 81% of them native Tavrunaq speakers. In winter hunters travel the sled trails on the sea ice after seal and walrus and fish through holes in the ice, and in summer they go out by kayak and small boat; hunting and fishing make up over a third of the economy. The Aqqapituk Road runs some 115 km through the district, with sleds given right of way at the trail crossings in winter, and the Nuqattaaq–Kiluktuar and Tundra expressways also pass through.
