- id: div_3rb2ha
  subtype: borough
  parent: div_nbf1bw
  status: generated
  names:
    zh: 萨尔努卡区
    en: Saarnuqa District
    art-x-tavrunaq: Saarnuqa
  notes:
    zh: "萨尔努卡区是萨尔瓦克市的城区，在萨尔苏瓦峡湾口，面积 500 平方公里，26 万人，塔夫鲁纳克语母语者占 55%。老城的街巷沿港湾自然展开，铁锚大道、皮匠大街和上海路从渔港向坡上延伸，木屋和新建的公寓楼混在一起。萨尔努卡渔港是南岸最大的渔港之一，深海渔船和养殖运输船在这里卸货，周围是冷库和水产加工厂，港口航运、商贸和水产加工是区内的主业。萨尔瓦克站是西卢阿真空磁悬浮的车站，线路以 14.7 公里的萨尔努卡高架桥进出城区；地铁 1 号线从松林站到萨尔努卡渔港站共 12 站，全在区内，主要街道上方有约 17 公里的暖廊。西卢阿高速经过区内，普拉苏瓦公路从这里向西北通往峡湾村镇。选民里社会民主互助工党和塔夫鲁利特人民党不相上下。\n鱼市每天清晨开市，最受欢迎的是整条的养殖鲑鱼和烟熏了一夜的北极红点鲑，本地人把鱼切成薄片冻硬，蘸着海盐和浆果酱生吃。地铁站里挂满了本地孩子画的鱼，每年开学换一批，乘客常在站台上找自家孩子的那一张。极夜里峡湾口的灯塔和渔港的灯火连成一条光带；夏天的皮划艇节上，划手们从峡湾里一路划到渔港，岸边的人敲着皮鼓为他们加油。"
    en: "Saarnuqa District is the town of Saarvaq City, at the mouth of the Saarsuvva Fjord: 500 km² with 260,000 people, 55% of them native Tavrunaq speakers. The lanes of the old town follow the harbour shore as they grew, and Anchor Avenue, Tanners' Boulevard and Shanghai Road climb from the fishing harbour up the slope, timber houses mixed with new blocks of flats. Saarnuqa Fishing Harbour is one of the largest on the south coast, where deep-sea trawlers and fish-farm carriers unload amid cold stores and processing plants, and the port, commerce and seafood processing are the district's main trades. Saarvaq station is on the Sillua Vacuum Maglev, which enters the town over the 14.7 km Saarnuqa Viaduct; Metro Line 1 runs twelve stations from Pinewood to Saarnuqa Fishing Harbour, all within the district, and some 17 km of skyways run above the main streets. The Sillua Expressway passes through, and the Pullasuvva Road sets off north-west from here to the fjord villages. Voters are split almost evenly between the Social Democratic Mutual Aid Labour Party and the Tavrulit People's Party.\nThe fish market opens at dawn, the favourites being whole farmed salmon and Arctic char smoked overnight, and locals slice the fish thin, freeze it hard and eat it dipped in sea salt and berry jam. The metro stations are hung with fish painted by local children, a new set every school year, and passengers often search the platform for their own child's picture. In the polar night the lighthouse at the fjord mouth and the harbour lights form a single band of light; at the summer kayak festival the paddlers race all the way down the fjord to the harbour while people on the shore beat skin drums to cheer them on."
  codes:
    admin: '920301'
  population: 260000
  area_km2: 500.0
  traits: { industries: [port, commerce, food] }
- id: div_qg40vj
  subtype: borough
  parent: div_nbf1bw
  status: generated
  names:
    zh: 乌利图克区
    en: Ulittuuq District
    art-x-tavrunaq: Ulittuuq
  notes:
    zh: "乌利图克区是萨尔瓦克城区以东的渔业区，面积 2500 平方公里，14 万人，区名由 ulik「鱼」和 -tuuq「多」组成，意思就是「鱼多的地方」。海湾沿岸散布着渔村、码头和水产加工厂，第一产业占经济的近四分之一，第二产业占近四成，是南岸渔业最集中的区之一；塔夫鲁纳克语母语者占 58%，65 岁以上的居民约占两成。区内地势低缓，最高处只有三百多米，冬天比城区更冷一些，一月平均气温约零下 15 度。西卢阿高速沿区内穿过约 60 公里，把渔获运往萨尔努卡和首府，卡图克大道、河畔路和帕利大道把沿海的村镇串在一起。选民里塔夫鲁利特人民党得票最多，岛民之声爱国阵线和冶炼与矿山工会社会主义工人党也各有一批支持者。\n渔村的一天从天亮前开始：渔船出海，留在岸上的人在加工厂里剖鱼、腌鱼、装箱，冷库的卡车沿高速一路开往首府。秋天鲑鱼洄游的季节，河口挤满了钓鱼的人，各家门前的木架上晾着成排的鱼干，空气里都是海盐和烟熏的味道。冬天海湾结起薄冰时，老渔民会带着孙辈在冰上凿洞钓鳕鱼，一边钓一边讲祖辈在海上遇见鲸的故事。"
    en: "Ulittuuq District is the fishing district east of the town of Saarvaq, 2,500 km² with 140,000 people; its name joins ulik, \"fish\", and -tuuq, \"many\": \"the place of many fish\". Fishing villages, quays and processing plants are scattered along its bays, the primary sector makes up nearly a quarter of the economy and industry nearly two-fifths, making it one of the most fishing-dependent districts on the south coast; 58% of residents are native Tavrunaq speakers and about one in five is over 65. The land is low and gentle, its highest point only three hundred-odd metres, and winters are a little colder than in town, January averaging about −15 °C. The Sillua Expressway runs some 60 km through the district, carrying the catch to Saarnuqa and the capital, and Qattuk Avenue, Riverside Road and Paali Avenue string the coastal villages together. The Tavrulit People's Party wins the most votes, and the Islanders' Voice Patriotic Front and the Smelters' and Miners' Union Socialist Workers' Party each have a following too.\nA fishing village's day starts before dawn: the boats go out, those ashore gut, salt and pack fish in the plants, and refrigerated lorries head down the expressway to the capital. In autumn, when the salmon run, the river mouths are crowded with anglers and racks of drying fish stand outside every house, the air full of salt and smoke. When the bays ice over thinly in winter, old fishermen take their grandchildren out to cut holes in the ice for cod, telling as they fish the stories of their grandfathers' meetings with whales at sea."
  codes:
    admin: '920302'
  population: 140000
  area_km2: 2500.0
  traits: { industries: [fishing, food, port] }
- id: div_hrrg7q
  subtype: borough
  parent: div_nbf1bw
  status: generated
  names:
    zh: 普拉苏瓦米乌特区
    en: Pullasuvvamiut District
    art-x-tavrunaq: Pullasuvvamiut
  notes:
    zh: "普拉苏瓦米乌特区是萨尔瓦克市西部和北部的峡湾山地，区名意为「西峡湾的人」，面积 38500 平方公里，占全市六成多，是领地面积最大的普通区，却只有 11.4 万人，塔夫鲁纳克语母语者占 85%。长约 55 公里的萨尔苏瓦峡湾深处属本区；海拔 1879 米的帕利皮鲁克峰顶覆着约 2200 平方公里的帕利西尔米冰川，像一顶白色的冠冕；海拔 1052 米的萨尔卡蒂克山口是翻越山地的通道，南岸的暖风从这里吹向内陆。内陆冬天很冷，最低纪录零下 41 度，每年有七十多天极夜。居民住在峡湾深处的渔村和小镇，以海水养殖、渔业和旅游为生。西卢阿高速、尼尔萨瓦克高速和西卢阿真空磁悬浮穿过区内的山地，磁悬浮的普拉苏瓦米乌特隧道是全线最长的隧道；普拉苏瓦公路通到区内的镇上，长约 91 公里。选民里塔夫鲁利特人民党和长老之道占了一半。\n很多村子不通公路，孩子们坐「校船」上学，船长同时也是邮递员和杂货郎，每到一个村子就鸣三声笛。萨尔瓦克的渔民出海时以帕利皮鲁克峰为航标，说「看见白冠，就离家不远了」；晴天时峡湾的水面上能看到冰川的倒影。南风吹过萨尔卡蒂克山口，会把积雪吹成一道道波浪形的雪纹，牧民说「暖风过山口，春天就不远」。"
    en: "Pullasuvvamiut District is the fjord and mountain country to the west and north of Saarvaq City; its name means \"people of the western fjord\". At 38,500 km² it covers more than six-tenths of the city and is the largest ordinary district in the territory, yet it has only 114,000 people, 85% of them native Tavrunaq speakers. The inner reaches of the 55 km Saarsuvva Fjord belong to it; the Paalisirmi Glacier, some 2,200 km², caps the 1,879 m summit of Mount Paalipirruk like a white crown; and the Saarkatiq Pass, 1,052 m, is the way over the mountains, through which the warm south-coast wind blows inland. Inland winters are bitter, with a record low of −41 °C and seventy-odd days of polar night a year. People live in fishing villages and small towns deep in the fjords, living on fish farming, fishing and tourism. The Sillua Expressway, the Nirsavaq Expressway and the Sillua Vacuum Maglev cross the district's mountains, the maglev's Pullasuvvamiut Tunnel being the longest on the line, and the Pullasuvva Road, about 91 km long, reaches the district's towns. The Tavrulit People's Party and the Way of the Elders take half the vote between them.\nMany villages have no road, so children go to school on the \"school boat\", whose skipper is also postman and grocer and sounds three blasts at every village. Saarvaq fishermen steer by Mount Paalipirruk when they put to sea, saying \"once you see the white crown, you're nearly home\", and on clear days the glacier is reflected in the water of the fjord. When the south wind blows through the Saarkatiq Pass it combs the snow into wave-like ripples, and herders say \"when the warm wind crosses the pass, spring is not far off\"."
  codes:
    admin: '920303'
  population: 114000
  area_km2: 38500.0
  traits: { industries: [aquaculture, tourism, fishing], heritage: tavrulit }
- id: div_2541fx
  subtype: borough
  parent: div_nbf1bw
  status: generated
  names:
    zh: 乌利库维特区
    en: Ulikuviit District
    art-x-tavrunaq: Ulikuviit
  notes:
    zh: "乌利库维特区是南岸外海的乌利库维特群岛，由乌利卡尔维克岛、库卡利克岛、萨里马岛和西卢阿库利岛组成，群岛陆地约 7300 平方公里，7.7 万人，区名意为「鱼的群岛」。主岛萨里马岛面积约 2900 平方公里，离首府只有一百多公里，暖流经过岛的周围，海水比别处温暖，区内的居民大多住在这里。群岛间的海湾水深浪静，萨尔卡拉湾里布满深海养殖网箱，乌利库维特深海养殖基地的岸上是孵化场和加工厂，网箱里养着鲑鱼和北极红点鲑；最西的库卡利克岛沿岸浅水里长着大片海藻林，岛上的工厂把海藻加工成食品和饲料。养殖、渔业和水产加工占经济的大半，第一产业占 35%。岛上没有高速公路，与大陆之间靠船只往来，最南的西卢阿库利岛南端的灯塔为驶向首府的船只指引航道。选民里塔夫鲁利特人民党得票最多，岛民之声爱国阵线居次。\n养殖工人说萨尔卡拉湾是「暖流送给萨尔瓦克的礼物」；每批鱼苗出海放进网箱时，孵化场的老工人会在船头敲三下皮鼓，祝它们在冷水里长得又肥又结实。退潮时库卡利克岛的海藻林浮上水面，像一片金褐色的草原，海獭常在其中仰躺着敲贝壳。灯塔的看守人每年在塔下的小菜园里种土豆，说是「全首府最靠海的菜地」，收获时会给路过的渔船送上一袋。"
    en: "Ulikuviit District is the Ulikuviit Islands off the south coast, Ulikkarvik, Kuuqalik, Saarimma and Silluaqulli, some 7,300 km² of land with 77,000 people; the name means \"fish islands\". The main island, Saarimma, about 2,900 km², is only a hundred-odd kilometres from the capital; the warm current flows round it, the sea is warmer than elsewhere, and most of the district's people live there. The bays between the islands are deep and calm, Saarqalla Bay is crowded with deep-sea net pens, and the Ulikuviit Aquaculture Base has its hatcheries and processing plants on the shore, raising salmon and Arctic char; in the shallows of Kuuqalik, the westernmost island, grow great kelp forests, which factories on the island turn into food and feed. Fish farming, fishing and processing make up most of the economy, the primary sector alone 35%. There are no expressways on the islands, which are reached from the mainland by boat, and the lighthouse at the southern tip of Silluaqulli, the southernmost island, guides ships into the capital. The Tavrulit People's Party wins the most votes, with the Islanders' Voice Patriotic Front second.\nFish-farm workers call Saarqalla Bay \"the warm current's gift to Saarvaq\", and whenever a batch of fry is taken out to the pens an old hand from the hatchery beats a skin drum three times at the bow, wishing them fat and strong in the cold water. At low tide the kelp forests of Kuuqalik float to the surface like a golden-brown meadow, where sea otters lie on their backs cracking shells. The lighthouse keeper grows potatoes every year in a little plot at the foot of the tower, \"the most seaward vegetable patch in the capital\", and at harvest hands a sack to passing fishing boats."
  codes:
    admin: '920304'
  population: 77000
  area_km2: 12500.0
  traits: { industries: [aquaculture, fishing, food] }
- id: div_jd4ms5
  subtype: borough
  parent: div_nbf1bw
  status: generated
  names:
    zh: 通纳库特生态保护区
    en: Tuunnaqut Nature Reserve
    art-x-tavrunaq: Tuunnaqut
  notes:
    zh: "通纳库特生态保护区是西部远海的通纳库维特群岛，由通纳克岛、米尔尼克岛和尼帕克图克岛组成，群岛陆地约 7000 平方公里，整片划为生态保护区，常住人口约 1800 人，多为巡护员和渔民，塔夫鲁纳克语母语者占八成多。区名来自 tuun「石」：主岛通纳克岛的海岸上，成排的六角形玄武岩柱高出海面，通纳库特玄武岩柱保护区是全区的核心，崖壁上栖息着海鸦和北极鸥。东部的米尔尼克岛由深色的玄武岩构成，最高处海拔四百多米，是全区的最高点；西部的小岛尼帕克图克岛面积约 830 平方公里，风浪拍打石柱缝隙的声音像管风琴，岛名由此而来。经济以自然保护、巡护和旅游为主，游客只能乘船在保护距离外观看，保护区只开放一条海上观光航线。选民里塔夫鲁利特人民党和长老之道几乎平分秋色。\n塔夫鲁纳克人的传说里，这些石柱是海神为海鸦搭的石梯，所以崖下从不捕鸟；夏天成千上万只海鸟停在石柱的每一级「台阶」上，叫声盖过了浪声。游船绕着岩柱缓缓驶过时，船长会关掉马达，让乘客听海浪在石柱间回响。雨后玄武岩被淋得发黑发亮，米尔尼克岛像一块浸了水的墨石，从海上远远就能认出来；风浪大的日子，渔民说听到尼帕克图克岛的「管风琴」在唱歌，就该回港了。"
    en: "Tuunnaqut Nature Reserve is the Tuunnaquviit Islands far out to the west, Tuunnaq, Mirnik and Nipaqtuuq, some 7,000 km² of land declared a nature reserve in its entirety. About 1,800 people live here, mostly rangers and fishermen, more than eight in ten of them native Tavrunaq speakers. The name comes from tuun, \"stone\": rows of hexagonal basalt columns rise from the sea along the coast of Tuunnaq, the main island, the Tuunnaqut Basalt Pillars Reserve is the heart of the district, and guillemots and Arctic gulls nest on the cliffs. Mirnik in the east is made of dark basalt and rises to four hundred-odd metres, the highest point of the reserve; Nipaqtuuq, a small island of about 830 km² in the west, takes its name from the organ-like sound of the waves pounding the gaps between its columns. The economy is conservation, ranger patrols and tourism; visitors may only look from a boat at a protected distance, on the single sea route the reserve allows. The Tavrulit People's Party and the Way of the Elders split the vote almost evenly.\nIn Tavrunaq legend the columns are a stone stairway the sea god built for the guillemots, so no one ever takes birds below the cliffs; in summer thousands of seabirds perch on every \"step\", their cries drowning the surf. As the tour boat edges round the columns the skipper cuts the engine so passengers can hear the waves echo among the stones. After rain the basalt turns black and glistening, and Mirnik looks like an inkstone soaked in water, recognisable from far out at sea; on stormy days fishermen say that when they hear Nipaqtuuq's \"organ\" singing, it is time to head for harbour."
  codes:
    admin: '920305'
  population: 1800
  area_km2: 8000.0
  special_status: nature_reserve
  traits: { industries: [conservation, tourism], heritage: tavrulit }

