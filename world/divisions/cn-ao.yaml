    en: The Walrus and Bear Islands far off the north-east, Uvvaak, Karuq, Ice Cliff and Floe islands, all of them a nature reserve with only about 1,000 residents, the fewest of any district. Uvvaak Bay, about 6,100 km², is the largest named bay in the territory; walruses haul out on its shores and polar bears roam between the floes and the islands, watched all year by the rangers of the reserve station.
  codes:
    admin: '920805'
  population: 1000
  area_km2: 22000.0
  special_status: nature_reserve
  traits: { industries: [conservation, research] }

