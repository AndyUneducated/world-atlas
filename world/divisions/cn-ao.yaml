    art-x-tavrunaq: Ukkulaaq
  notes:
    zh: "乌库拉克是北冰洋南岸东部的工业港口城市，在首府以东约 360 公里，全市 6.34 万平方公里，50.8 万人，塔夫鲁纳克语母语者约占六成。城名里的 ukku 在塔夫鲁纳克语里是「矿」，城市因矿而兴：城区乌库努卡区在长约 57 公里的乌库苏瓦峡湾口，暖流让码头终年不冻，港口运出冶炼产品和矿石；西北的基萨尔维克区有冶炼内陆镍矿的冶炼厂；东部的皮瓦苏瓦区是沿峡湾分布的村镇；东南外海的卡瓦卢维特群岛以极光旅游闻名；北部的西卢阿苏瓦特生态保护区里有海拔 2022 米的陶武皮鲁克峰，是苏瓦尔尤伊特山脉的最高峰、大陆上仅次于西尔米峰的第二高峰，陶武西尔米冰川从峰顶向四周流下。城区一月平均气温约零下 13 度，七月约 6 度。\n全市以采矿与石料、港口航运和制造业为主，第二产业占 37%，人均生产总值约 7.9 万美元。乌库努卡散货码头装运基萨尔维克冶炼厂的产品和东部矿山的矿石，旁边是油品码头；冶炼厂用水电和余热为城里供暖。西卢阿真空磁悬浮在这里到达东端终点乌库拉克站，西卢阿高速以乌库努卡高架桥过城，在这里由南岸折向北，经皮瓦苏瓦区的峡湾通往西尔米瓦克，此前峡湾村镇之间只能靠夏季的渡船往来；城区有一条地铁，从乌库努卡散货码头站到橡树站共 7 站，另有一条市道通往保护区。市议会 39 席，塔夫鲁利特人民党占 14 席，市长伊利维克·西尔米亚克出自该党，冶炼与矿山工会社会主义工人党也有 5 席。市旗是铜红色天空下黑色山脊上的一团金色火焰，铜红是冶炼厂炉口映红的天色；市花是羊胡子草，市树是绿桤木。\n乌库拉克是一座按班次过日子的城市，基萨尔维克冶炼厂每八小时换一次班，换班时整座城的公交、食堂和澡堂都跟着忙一阵，本地人约时间常说「早班后」「夜班前」。冶炼工人的食堂以分量足出名，驯鹿肉丸配土豆泥和越橘酱是固定菜，夜班工人下班时食堂还专门留着一锅热鱼汤。乌库拉克人说，极夜里远远望见冶炼厂的光，就知道离家不远了。外海的卡瓦卢维特群岛，名字在塔夫鲁纳克语里就是「极光群岛」，岛上的度假村给每位客人一个「极光闹钟」：夜里极光一出现，前台就挨个打电话叫醒客人，有人一个冬天被叫醒十几次也毫无怨言。晴朗的夏天，城里的登山爱好者喜欢去西卢阿苏瓦特生态保护区爬陶武皮鲁克峰，这座峰的名字意为「天峰」，站在两千多米的峰顶，可以望见冰封的远山和不冻的港湾。"
    en: "Ukkulaaq is the industrial port city of the eastern south coast of the Arctic Ocean Territory, about 360 km east of the capital, with 508,000 people in 63,400 km², about six in ten of them native Tavrunaq speakers. The ukku in its name is Tavrunaq for \"mine\", and the city grew on its mines. The town itself, Ukkunuqa District, lies at the mouth of the Ukkusuvva Fjord, some 57 km long, where the warm current keeps the quays free of ice and the port ships out smelter products and ore; Qissarvik District to the north-west has the smelter that refines nickel from the inland mines; Pivasuvva District to the east is a string of fjord villages; the Qavvaluviit Islands offshore to the south-east are famous for aurora tourism; and the Silluasuvvat Nature Reserve to the north holds Mount Tauvvupirruk, 2,022 m, the highest peak of the Suvvarjuit Mountains and the second highest on the mainland after Mount Sirmi, with the Tauvvusirmi Glacier flowing down from its summit on every side. In town January averages about −13 °C and July about 6 °C.\nThe city lives on mining and quarrying, the port and shipping and manufacturing; industry makes up 37% of the economy and output per head is about US$79,000. The Ukkunuqa Bulk Terminal loads the products of the Qissarvik Smelter and ore from the eastern mines, with an oil terminal beside it, and the smelter's hydro power and waste heat warm the town. The Sillua Vacuum Maglev reaches its eastern terminus at Ukkulaaq station, and the Sillua Expressway crosses town on the Ukkunuqa Viaduct and turns north here from the south coast, following the fjords of Pivasuvva District towards Sirmivak; before it was built the fjord villages could reach one another only by summer ferry. The town has one metro line, seven stations from Ukkunuqa Bulk Terminal to Oak, and a municipal road runs up to the reserve. The city council has 39 seats, the Tavrulit People's Party holds 14 and the mayor, Ilivvik Sirmiaq, comes from it, while the Smelters' and Miners' Union Socialist Workers' Party has 5. The city flag is a gold flame rising from a black ridge under a copper-red sky, the copper being the sky lit by the smelter's furnaces; the city flower is cotton grass and the city tree the green alder.\nUkkulaaq lives by the shift: the Qissarvik Smelter changes shifts every eight hours, and each changeover sets the buses, canteens and bathhouses of the whole town bustling, so locals arrange to meet \"after the early shift\" or \"before nights\". The smelter canteens are known for their portions; reindeer meatballs with mashed potato and lingonberry sauce are always on, and a pot of hot fish soup is kept for the night shift coming off. People say that in the polar night the glow of the smelter seen from afar means home is near. The offshore Qavvaluviit Islands are \"the aurora islands\" in Tavrunaq, and the lodge there gives every guest an \"aurora alarm\": when the lights appear in the night, reception rings each room in turn, and some guests are woken a dozen times in a winter without a word of complaint. On clear summer days the town's climbers head for the Silluasuvvat Nature Reserve to climb Mount Tauvvupirruk, \"sky peak\", from whose summit, over 2,000 m up, you can see frozen mountains in the distance and the ice-free harbour below."
