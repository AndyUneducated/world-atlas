    zh: "上绿下白，一条蓝色大河从旗底蜿蜒流向地平线。基卢克图阿尔河在这里入海，绿色是大河两岸的苔原和帕基卢克区沿河的牧场，白色是雪原；冬季北岸封冻，蓝色河道也是破冰船为航线开出的水道。河口的人管这面旗叫「一条河的旗」。"
