    en: The wide pastures north-west of the capital, 37,800 km² with 166,000 people; reindeer herding and traditional hunting make up half the economy, and output per head is the lowest of any district. Nearly half of the Suvvasirmi Icefield and Nirsaillu Lake are here, and ancient stone figures and cairns stand on the tundra. The Nuqattaaq–Aqqanik Expressway runs some 360 km through the district, leaving the cairns where they stood, and the Sillua Expressway crosses its south.
