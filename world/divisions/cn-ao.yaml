  names:
    zh: 基萨尔维克区
    en: Qissarvik District
    art-x-tavrunaq: Qissarvik
  notes:
    zh: "基萨尔维克区是乌库努卡区西北的冶炼工业区，面积 3100 平方公里，14 万人，第二产业占经济的 65%，比重是全领地各区中最高的。基萨尔维克冶炼厂冶炼内陆矿区运来的镍矿石，产品经乌库努卡散货码头装船；冶炼厂的水电和余热为镇上供暖，冬天镇里的暖气管道和澡堂都靠炉火。区内地势从海岸抬升到内陆山地，最高处海拔 1886 米，镇上一月平均气温约零下 20 度，最低纪录零下 40 度。东北边的基萨尔卡蒂克山口海拔 776 米，在西卢阿苏瓦特生态保护区内，是基萨尔维克通往内陆山地的传统通道。西卢阿高速的南岸段和北段都经过区内；友谊路、光明大道和帕卡皮鲁克峰大街从冶炼厂门口通到工人住宅区。选民里冶炼与矿山工会社会主义工人党得票最多，社会民主互助工党居次。\n冶炼厂每八小时换一次班，换班时镇上的公交、食堂和澡堂都跟着忙一阵，本地人约时间常说「早班后」「夜班前」；夜班工人下班时，食堂专门留着一锅热鱼汤。极夜里冶炼厂的炉光把天空映成铜红色，那就是乌库拉克市旗上的颜色。基萨尔卡蒂克山口旁的石堆路标至今还在，过去的猎人和牧人靠它们在雾里找路，如今徒步者路过时也会添上一块石头。"
    en: "Qissarvik District is the smelting district north-west of Ukkunuqa District, 3,100 km² with 140,000 people; industry makes up 65% of its economy, the highest share of any district in the territory. The Qissarvik Smelter refines nickel ore brought from the inland mines, and its products are shipped from the Ukkunuqa Bulk Terminal; the smelter's hydro power and waste heat warm the town, whose heating pipes and bathhouses all run on the furnaces in winter. The land rises from the coast to inland mountains as high as 1,886 m, and in town January averages about −20 °C, with a record low of −40 °C. The Qissarkatiq Pass to the north-east, 776 m high and inside the Silluasuvvat Nature Reserve, is Qissarvik's traditional way into the inland mountains. Both the south-coast and the northern sections of the Sillua Expressway pass through, and Friendship Road, Bright Avenue and Mount Pakkapirruk Boulevard lead from the smelter gates to the workers' housing. The Smelters' and Miners' Union Socialist Workers' Party wins the most votes, with the Social Democratic Mutual Aid Labour Party second.\nThe smelter changes shifts every eight hours, and each changeover sets the town's buses, canteens and bathhouses bustling, so locals arrange to meet \"after the early shift\" or \"before nights\"; a pot of hot fish soup is kept in the canteen for the night shift coming off. In the polar night the furnace glow turns the sky copper-red, the colour on the Ukkulaaq city flag. The stone cairns beside the Qissarkatiq Pass still stand; hunters and herders once found their way by them in fog, and hikers passing today add a stone of their own."
