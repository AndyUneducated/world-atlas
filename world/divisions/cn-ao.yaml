# ── 努卡塔克市（首府）──
- id: div_8besy9
  subtype: locality
  parent: div_hpmerr
  status: generated
  names:
    zh: 努卡塔克市
    en: Nuqattaaq City
    art-x-tavrunaq: Nuqattaaq
  notes:
    zh: "努卡塔克是北冰洋领地的首府，坐落在南岸努卡塔克峡湾的湾口两岸，全市 8960 平方公里，下辖 7 个区，住着 150 万人，约占领地人口的三成。塔夫鲁纳克语里 nuqa 是「港」，城市最早就是峡湾口西岸的一处渔港，今天的努坎加克区还保留着木屋街巷、鱼市和船坞；后来领地政府在峡湾边的库马尔维克区落脚，这里长成了市中心，金融、数据和航运又把城市推向峡湾两岸的苔原。南岸有暖流经过，港口终年不冻，一月平均气温约零下 13 度，七月约 6 度，每年有约七十天极夜、八十多天极昼。冻土上的建筑大多立在桩基上，底层架空让冷风流过，防止冻土融化。\n首府的经济以行政与公共服务、金融、信息技术和港口航运为主，第三产业占 83%，人均生产总值约 9.1 万美元。领地政府与议会、政务院的三个楼群都在库马尔维克区，中央穹顶和成片的暖廊让市民在极夜和暴风雪里也能步行出门，库马尔大街两侧是商场、酒店和办公楼，北面紧邻帕卢尔尼克金融特区。努坎加克区是老渔港，努坎加克灯光广场是极夜灯光节的主会场；北部的苏瓦利克区有北冰洋大学和冰雕园；西部的图维尔尤阿克区有领地最长的暖廊网和室内海滩；北郊帕利瓦克区的垂直农场供应首府大部分新鲜蔬菜；峡湾口东岸的伊马萨尔维克区是领地最大的港区；东北的尼尔萨库特区有国际机场和午夜高尔夫球场。\n地铁四条线、97 座车站，1 号线长 85 公里，从库马尔大街地下一直通到国际机场。西卢阿真空磁悬浮的努卡塔克站在库马尔维克区，一头经萨尔瓦克通往图利瓦克，另一头通往乌库拉克；乌库利特真空磁悬浮重载铁路把内陆的矿石运到伊马萨尔维克货运站直接装船。西卢阿高速以跨海大桥跨过峡湾口，努基高速、努卡塔克环线和通往金融特区、矿区、阿卡尼克的高速都从这里出发。塔夫鲁纳克语母语者约占四成，外来的金融与科技从业者多住在库马尔维克区和图维尔尤阿克区。市议会 47 席，塔夫鲁利特人民党以 11 席居首，市长白北辰出自该党；市花是仙女木，市树是北极柳。\n首府人把暖廊当作城市的街道，冬天从家门走到地铁站、办公楼和商场可以一路不出室外，暖廊两边开满了咖啡馆和热汤店，外地人笑称努卡塔克是「一座住在走廊里的城市」。极夜的七十来天里，中央穹顶的灯整夜不熄；每逢周末晚上，努坎加克灯光广场上燃起篝火，鼓手敲起皮鼓，人们围着火堆跳舞，老人们常说一句塔夫鲁纳克语：「Qavvaluk tauvvu, qattuk nuqa」，意思是「极光在天上，鼓声在港里」，天再黑，港口也有人气。到了八十多天的极昼，孩子们不肯睡觉，家家窗上挂着厚厚的遮光帘，商店半夜还开着门。首府的家常菜是驯鹿肉汤、熏北极鲑和配浆果酱的油炸面饼；苏瓦利克区的大学生最爱去伊马萨尔维克港区的夜宵摊，看不冻港里的船在冰雾中进出。冬天苏瓦利克冰雕园里的冰雕由各区居民分头完成，开园那晚，每一座都要由雕刻它的人家亲手点亮。"
    en: "Nuqattaaq is the capital of the Arctic Ocean Territory, standing on both shores of the mouth of Nuqattaaq Fjord on the south coast. The city covers 8,960 km² in 7 districts and has 1.5 million people, about three-tenths of the territory. In Tavrunaq nuqa means \"harbour\", and the city began as a fishing harbour on the west side of the fjord mouth; Nuqangaq District still keeps the timber lanes, fish market and boatyards. Later the territorial government settled in Qummarvik District by the fjord, which grew into the centre, and finance, data and shipping then carried the city out across the tundra on both shores. A warm current passes the south coast and the harbour never freezes; January averages about −13 °C and July about 6 °C, with some seventy days of polar night and more than eighty of midnight sun each year. Most buildings on the permafrost stand on piles with an open ground floor, so the cold wind passes beneath and the ground stays frozen.\nThe capital lives on government and public services, finance, information technology and the port and shipping; services make up 83% of the economy and output per head is about US$91,000. The government and assembly and the three building groups of the Executive Council are all in Qummarvik District, where the Central Dome and the skyways let people walk about through the polar night and in blizzards; Qummar Boulevard is lined with shops, hotels and offices, and the Pallurniq Financial Zone lies just to the north. Nuqangaq District is the old fishing port, and Nuqangaq Light Square is the main venue of the Polar Night Light Festival. Suvvalik District to the north has the University of the Arctic Ocean and the ice sculpture garden; Tuvvirjuaq District in the west has the longest skyway network in the territory and an indoor beach; the vertical farm of Paalivaq District, on the northern edge, grows most of the capital's fresh vegetables; Immasaarvik District on the east side of the fjord mouth is the territory's largest port; and Nirsakut District to the north-east has the international airport and a midnight golf course.\nThe metro has four lines and 97 stations. Line 1, 85 km long, runs from beneath Qummar Boulevard all the way to the international airport. Nuqattaaq station on the Sillua Vacuum Maglev is in Qummarvik District, with trains one way via Saarvaq to Tullivaq and the other way to Ukkulaaq, and the Ukkuliit Vacuum Maglev Heavy-Haul Railway brings ore from the interior to the Immasaarvik Freight Yard to be loaded straight onto ships. The Sillua Expressway crosses the fjord mouth on a sea bridge, and the Nuqattaaq–Kiluktuar Expressway, the Nuqattaaq Ring Road and the expressways to the Financial Zone, the mines and Aqqanik all start here. About two in five residents are native Tavrunaq speakers, and the incoming finance and technology workers mostly live in the Qummarvik and Tuvvirjuaq districts. The city council has 47 seats, the Tavrulit People's Party leads with 11, and the mayor, Bai Beichen, comes from it; the city flower is the mountain avens and the city tree the Arctic willow.\nPeople in the capital treat the skyways as streets: in winter you can walk from your front door to the metro, the office and the shops without once going outside, and the galleries are lined with cafés and soup kitchens, so visitors joke that Nuqattaaq is \"a city that lives in a corridor\". Through the seventy-odd days of polar night the lights of the Central Dome never go out, and on weekend evenings a bonfire is lit in Nuqangaq Light Square, where drummers beat skin drums and people dance round the fire. The elders like a Tavrunaq saying, \"Qavvaluk tauvvu, qattuk nuqa\", \"the aurora is in the sky, the drum is in the harbour\": however dark it gets, the port is alive. In the eighty-odd days of midnight sun children refuse to go to bed, every window has heavy blackout blinds and shops stay open past midnight. Home cooking means reindeer broth, smoked Arctic char and fried dough with berry jam, and the students of Suvvalik District love the night stalls of Immasaarvik Harbour, where they watch ships come and go through the ice fog of the ice-free port. In winter the sculptures of the Suvvalik Ice Sculpture Garden are carved by residents of every district, and on opening night each one is lit by the family that carved it."
