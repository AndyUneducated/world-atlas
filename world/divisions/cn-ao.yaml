    art-x-tavrunaq: Nirsatuvvit
  notes:
    zh: 驯鹿迁徙路线所在的生态保护区，面积 50200 平方公里，是领地面积第二大的区，常住约 3 万人，多为随鹿群迁徙的牧民。驯鹿每年春季回到驯鹿产仔地产仔，产仔季节禁止车辆和飞机靠近；海拔 1950 米的驯鹿峰和长湖在区内。南岸高速和苔原高速穿过保护区时抬高路堤、加宽涵洞，并在迁徙季节限制夜间车流。
    en: The nature reserve of the reindeer migration routes, 50,200 km², the second largest district in the territory, with about 30,000 residents, mostly herders who follow the herds. The reindeer return to the calving grounds each spring, when vehicles and aircraft must keep away; the 1,950 m Reindeer Peak and Long Lake are here. Where the South Coast and Tundra expressways cross the reserve, their embankments are raised and culverts widened, and night traffic is restricted in the migration season.
  codes:
    admin: '921005'
  population: 30000
  area_km2: 50200.0
  special_status: nature_reserve
