    art-x-tavrunaq: Nuqangaq
  notes:
    zh: "努坎加克区是首府最老的城区，在努卡塔克峡湾口西岸，由老渔港发展而来，木屋街巷、鱼市和船坞沿用有机的老街网，塔夫鲁纳克语母语者占 51%。全区 300 平方公里住着 27 万人，人口密度在首府仅次于库马尔维克区，经济以行政与公共服务、文化遗产和旅游为主。卡拉克路、尼尔萨大道和乌瓦克大街在老街之间弯来绕去，主要街道上方有约 15 公里的暖廊。西卢阿高速穿过区内，再经努卡塔克峡湾跨海大桥通往伊马萨尔维克区；环线、库马尔维克—努坎加克公路和地铁 4 号线也经过这里，4 号线从工匠站到苹果园站共 9 站。\n努坎加克灯光广场在老渔港旁，是极夜灯光节和冰雕展的主会场，冬季游客在这里看灯、吃烟熏鱼。极夜里每逢周末晚上，广场上燃起篝火，鼓手敲起皮鼓，人们围着火堆跳舞；冰雕展开幕那晚，广场上的灯一盏盏熄灭，只留下冰雕里透出的光，人群在黑暗里齐声倒数。老渔民清早还在码头边卖刚靠岸的鳕鱼和北极鲑，船坞里修补木船的敲打声和鱼市的吆喝声，是老城区一天的开始。区内选民最支持塔夫鲁利特人民党，许多人家几代人都住在同一条巷子里。"
    en: "Nuqangaq District is the oldest part of the capital, on the west side of the mouth of Nuqattaaq Fjord. It grew out of the old fishing port, its timber lanes, fish market and boatyards keep the old organic street pattern, and 51% of its people are native Tavrunaq speakers. 270,000 people live in its 300 km², the densest district of the capital after Qummarvik District, and it lives on government and public services, heritage and tourism. Kallaaq Road, Nirsa Avenue and Uvvaak Boulevard wind among the old lanes, and some 15 km of skyways run above the main streets. The Sillua Expressway crosses the district and goes on over the Nuqattaaq Fjord Sea Bridge to Immasaarvik District; the ring road, the Qummarvik–Nuqangaq Road and Metro Line 4 also pass through, Line 4 running nine stations from Artisans' to Orchard.\nNuqangaq Light Square, beside the old fishing port, is the main venue of the Polar Night Light Festival and the ice sculpture show, and in winter visitors come to see the lights and eat smoked fish. On weekend evenings in the polar night a bonfire is lit in the square and people dance round it to the beat of skin drums; on the opening night of the ice sculpture show the lights of the square go out one by one until only the glow inside the ice is left, and the crowd counts down together in the dark. Old fishermen still sell the morning's cod and Arctic char on the quay, and the knocking of boat repairs in the yards and the cries of the fish market start the old town's day. Voters here back the Tavrulit People's Party above all, and many families have lived in the same lane for generations."
  codes:
    admin: '920101'
  population: 270000
  area_km2: 300.0
  traits: { industries: [government, heritage, tourism], heritage: polar_mixed }
- id: div_9s80v8
  subtype: borough
  parent: div_8besy9
  status: generated
  names:
    zh: 库马尔维克区
    en: Qummarvik District
    art-x-tavrunaq: Qummarvik
  notes:
    zh: "库马尔维克区是首府的市中心，沿努卡塔克峡湾展开，33 万人住在 250 平方公里内，人口居全领地各区之首，人口密度仅次于帕卢库特区。领地政府与议会、中央穹顶和领地的铁路总站努卡塔克站都在区内；政务院按职能分三个楼群：东北楼群是对外事务部、三个中央派驻机构和政策和计划委员会，西面楼群是交通、建设、自然资源三部，东南楼群是司法、公安、教科文、民政、劳社和卫生各部，都以暖廊连到中央穹顶。库马尔大街两侧是商场、酒店和办公楼，和平大道、极光大道和厦门路通向峡湾岸边，约 53 公里的暖廊把它们连成一片。库马尔大街下的地铁 1 号线通往尼尔萨库特区的国际机场，努基高速和帕卢尔尼克高速从这里出发，北面紧邻帕卢尔尼克金融特区。\n居民中外来的金融、科技从业者比例高，人均产值约 11.6 万美元，在首府各区中最高，选民里金库党得票最多。中央穹顶下是冬季花园和人造日光广场，极夜的七十来天里灯整夜不熄，从城外的高处望去，整座首府像围着一盏灯生长；穹顶下的长椅是老人们晒太阳、下棋的地方，许多首府人的第一次约会也在这里。午休时，政务院的公务员和银行职员挤在同一条暖廊里排队买热汤。"
    en: "Qummarvik District is the centre of the capital, spreading along Nuqattaaq Fjord, with 330,000 people in 250 km²: the most populous district in the territory and the second most densely peopled, after Pallukut District. The government and assembly, the Central Dome and Nuqattaaq station, the territory's main railway station, are all here. The Executive Council is grouped by function into three clusters: the north-east cluster holds the Ministry of External Affairs, the three offices of the central government and the Policy and Planning Commission; the west cluster the ministries of transport, construction and natural resources; and the south-east cluster the ministries of justice, public security, education, science and culture, civil affairs, labour and health, all joined by skyways to the Central Dome. Qummar Boulevard is lined with shops, hotels and offices, Peace Avenue, Aurora Avenue and Xiamen Road lead down to the fjord shore, and some 53 km of skyways tie it all together. Metro Line 1 runs beneath Qummar Boulevard to the international airport in Nirsakut District, the Nuqattaaq–Kiluktuar and Pallurniq expressways start here, and the Pallurniq Financial Zone lies just to the north.\nIncoming finance and technology workers make up a large share of residents, output per head is about US$116,000, the highest of the capital's districts, and the Vault Party wins the most votes. Under the Central Dome are a winter garden and a square of artificial daylight whose lamps burn all night through the seventy-odd days of polar night, so that from the heights outside town the whole capital seems to grow around a single lamp; its benches are where old people sun themselves and play chess, and where many people of the capital had their first date. At lunchtime civil servants and bank staff queue side by side for hot soup in the same skyway."
  codes:
    admin: '920102'
  population: 330000
  area_km2: 250.0
  traits: { industries: [commerce, finance, tourism], income: 1.15 }
- id: div_j06x18
  subtype: borough
  parent: div_8besy9
  status: generated
  names:
    zh: 苏瓦利克区
    en: Suvvalik District
    art-x-tavrunaq: Suvvalik
  notes:
    zh: "苏瓦利克区是首府北部的住宅区，面积 600 平方公里，30 万人，以成排的住宅楼和社区服务为主，中文母语者约占 37%，比例在首府各区中最高。北冰洋大学在区内，是领地的综合大学，以极地工程、冰川学、金融法和塔夫鲁纳克语研究见长，学生和教师让这里比市中心更年轻；苏瓦利克冰雕园在峡湾岸边，每年冬季用峡湾的冰块雕成城堡、动物和塔夫鲁纳克神话人物。灰狼大道、晨星大道、日晷大道和月光大道两旁是住宅街坊和小学，拉萨路、昆明路一带是商店和社区中心。努基高速以苏瓦利克高架桥穿过区内，环线也经过这里；地铁 1 号线连接市中心和机场，3 号线从花楸大街站到拉萨路站，在区内走 6 站。\n北冰洋大学的毕业典礼在极昼的午夜举行，毕业生把学位帽抛向不落的太阳；极夜里图书馆通宵开放，窗灯是苏瓦利克区最晚熄的，冬天学生们最爱结伴去伊马萨尔维克港区的夜宵摊。冰雕园的冰雕由首府各区的居民分头完成，开园那晚，每一座都要由雕刻它的人家亲手点亮；春天冰雕融化后，园里会立起一块木牌，记下这一年每座冰雕的名字和作者。区内选民里绿脉党得票最多。"
    en: "Suvvalik District is the capital's northern residential district, 600 km² with 300,000 people living mostly in rows of apartment blocks with their community services; about 37% are native Chinese speakers, the highest share among the capital's districts. The University of the Arctic Ocean, the territory's comprehensive university, is here, known for polar engineering, glaciology, financial law and Tavrunaq studies, and its students and staff make the district younger than the centre; on the fjord shore, the Suvvalik Ice Sculpture Garden turns blocks of fjord ice into castles, animals and figures from Tavrunaq myth each winter. Wolf Avenue, Morning Star Avenue, Sundial Avenue and Moonlight Avenue are lined with housing blocks and primary schools, and around Lhasa Road and Kunming Road are the shops and community centres. The Nuqattaaq–Kiluktuar Expressway crosses the district on the Suvvalik Viaduct and the ring road passes too; Metro Line 1 links it with the centre and the airport, and Line 3 runs six stations within the district, from Rowan High Street to Lhasa Road.\nThe university holds its graduation at midnight in the midnight sun, and the graduates throw their caps at the sun that will not set; in the polar night the library stays open round the clock and its windows are the last lights out in Suvvalik, and in winter students like to go in groups to the night stalls of Immasaarvik Harbour. The ice sculptures are carved by residents of every district of the capital, and on opening night each one is lit by the family that carved it; when they melt in spring a wooden board goes up in the garden recording the name and maker of every sculpture that year. Greenvein wins the most votes here."
  codes:
    admin: '920103'
  population: 300000
  area_km2: 600.0
  traits: { industries: [residential, education, commerce] }
- id: div_3b9pkz
  subtype: borough
  parent: div_8besy9
  status: generated
  names:
    zh: 图维尔尤阿克区
    en: Tuvvirjuaq District
    art-x-tavrunaq: Tuvvirjuaq
  notes:
    zh: "图维尔尤阿克区是首府西部的住宅与疗养区，面积 700 平方公里，27 万人，经济以居住与社区服务、医疗疗养和免税零售为主。区内的暖廊全长约 85 公里，是全领地最长的暖廊网络，住宅街坊、医院、商场和地铁站之间不出户外就能往来；65 岁以上的居民约占两成，比例是首府最高的，许多退休的人从北岸和苔原搬来，图的就是冬天不用出门。苏基亚克大道、人民大道和钟楼大街是暖廊的主干，宪章大道和诗人大道两旁是疗养院和免税商场。西卢阿高速和环线穿过区内，努阿高速从这里出发，经尼尔萨瓦克区通往阿卡尼克；地铁 2 号线从灰狼站到椴树站共 10 站，全在区内。\n图维尔尤阿克室内海滩在穹顶下，人造沙滩与温水泳池四季保持夏日的温度与光照，极夜里人们穿着泳衣躺在人造阳光下，门外却是零下二十多度的黑夜，本地人管这叫「三步过季」：脱外套、换泳衣、踩上沙滩，救生员说冬天比夏天还忙。帕尔尼克体育场带可开合的穹顶，冬季举办冰上运动和极夜灯光节的开幕式，夏季开顶举办午夜马拉松的终点仪式，选手凌晨冲过终点时太阳仍挂在天上。区内选民最支持社会民主互助工党。"
    en: "Tuvvirjuaq District is the capital's western district of homes and health resorts, 700 km² with 270,000 people, living on residential services, healthcare and spas and duty-free retail. Its skyways run to some 85 km, the longest network in the territory, so homes, hospitals, shops and metro stations can be reached without stepping outdoors; about one resident in five is over 65, the highest share in the capital, and many retired people move here from the north shore and the tundra precisely so as not to go out in winter. Sukkiaq Avenue, People's Avenue and Clock Tower Boulevard carry the main galleries, and Charter Avenue and Poets' Avenue are lined with care homes and duty-free malls. The Sillua Expressway and the ring road cross the district, and the Nuqattaaq–Aqqanik Expressway starts here and runs through Nirsavaq District to Aqqanik; Metro Line 2 runs ten stations from Wolf to Linden, all within the district.\nThe Tuvvirjuaq Indoor Beach lies under a dome, its artificial sand and warm pools kept at summer heat and light all year; in the polar night people lie in swimsuits under artificial sun while outside it is a black night of more than twenty below, and locals call it \"three steps to summer\": coat off, swimsuit on, onto the sand. The lifeguards say winter is busier than summer. The Paarniq Arena has a retractable dome; in winter it hosts ice sports and the opening of the Polar Night Light Festival, and in summer it opens its roof for the finish of the Midnight Marathon, whose runners cross the line in the small hours with the sun still in the sky. Voters here back the Social Democratic Mutual Aid Labour Party above all."
  codes:
    admin: '920104'
  population: 270000
  area_km2: 700.0
  traits: { industries: [residential, healthcare, retail] }
- id: div_k8cx0t
  subtype: borough
  parent: div_8besy9
  status: generated
  names:
    zh: 帕利瓦克区
    en: Paalivaq District
    art-x-tavrunaq: Paalivaq
  notes:
    zh: "帕利瓦克区是首府北郊的区，面积 2000 平方公里，13.5 万人，城区之外是覆着积雪的白色苔原，区名里的 paali 在塔夫鲁纳克语里就是「白」。经济以航空服务、物流仓储和居住为主，物流仓库沿努基高速和环线分布，承接港口和机场转来的货物。帕利卢湖在区内，环线以 10.8 公里的帕利卢湖特大桥跨过湖面，又穿过一段短短的帕利瓦克隧道；努基高速在区内北上，这里是进入苏瓦尔尤伊特山脉前的最后一段城郊。厦门大道、苏瓦大街和鲑鱼大街两旁是仓库和新建的住宅街坊，中文母语者约占四成，许多在机场和物流园上班的外来家庭住在这里。\n帕利瓦克垂直农场是一座多层的室内农场，用人工光照种植蔬菜和浆果，供应首府大部分的新鲜蔬菜。极夜里农场的粉紫色灯光从一层层窗户里透出来，远看像一座发光的塔；首府的小学生都来这里上过校外课，亲手摘一颗草莓，是许多孩子第一次在冬天吃到刚摘下的水果。冬天的周末，市民开着雪地摩托到帕利卢湖上凿冰钓鱼，冰面上的小帐篷连成一片；夏天苔原上开满仙女木，湖边的步道是首府人散步的好去处。"
    en: "Paalivaq District is on the northern edge of the capital, 2,000 km² with 135,000 people; beyond the built-up area lies white, snow-covered tundra, and the paali in its name is Tavrunaq for \"white\". It lives on aviation services, logistics and housing, its warehouses strung along the Nuqattaaq–Kiluktuar Expressway and the ring road to take goods passed on from the port and the airport. Paalillu Lake is in the district, and the ring road crosses it on the 10.8 km Paalillu Lake Bridge before running through the short Paalivaq Tunnel; the Nuqattaaq–Kiluktuar Expressway heads north through the district, the last stretch of suburb before the Suvvarjuit Mountains. Xiamen Avenue, Suvva Boulevard and Salmon Boulevard are lined with warehouses and new housing blocks, and about two in five residents are native Chinese speakers, many of them incoming families who work at the airport and the logistics parks.\nThe Paalivaq Vertical Farm is a multi-storey indoor farm growing vegetables and berries under artificial light, supplying most of the capital's fresh vegetables. In the polar night its pink and violet light glows from floor after floor of windows, so that from afar it looks like a shining tower; every schoolchild in the capital has been here on a school trip to pick a strawberry, for many of them the first freshly picked fruit they have eaten in winter. On winter weekends people ride snowmobiles out onto Paalillu Lake to fish through the ice, their little tents forming a camp on the surface; in summer the tundra is covered in mountain avens and the lakeside path is a favourite walk for the capital."
  codes:
    admin: '920105'
  population: 135000
  area_km2: 2000.0
  traits: { industries: [aviation, logistics, residential] }
- id: div_jvwq60
  subtype: borough
  parent: div_8besy9
  status: generated
  names:
    zh: 伊马萨尔维克区
    en: Immasaarvik District
    art-x-tavrunaq: Immasaarvik
  notes:
    zh: "伊马萨尔维克区是首府的港口区，在努卡塔克峡湾口东岸，面积 1200 平方公里，15 万人。暖流让港湾终年不冻，伊马萨尔维克港区的突堤上排着集装箱、矿石、油品和滚装码头，是领地最大的港区；乌库利特真空磁悬浮重载铁路在伊马萨尔维克货运站结束，矿石直接装船，无人驾驶列车的调度中心也设在区内。港口、船舶与海工装备和物流是区内的主业，第二产业占 38%，选民最支持社会民主互助工党，冶炼与矿山工会社会主义工人党在这里也有不少支持者。乌库利特高速从这里以伊马萨尔维克高架桥北上，西卢阿高速经努卡塔克峡湾跨海大桥进入区内，环线绕过港区；平等大道、工匠大街和萨尔瓦克大街把码头和住宅街坊连起来。\n冬天港池上常飘着冰雾，船只像从雾里浮出来一样进出港。码头边的夜宵摊是苏瓦利克区大学生的去处，一碗热鱼汤配一块油炸面饼，看着灯火下的不冻港能坐到深夜。冬季冻结的湖面上辟有伊马萨尔维克冰上赛车场，举办冰上赛车和雪地摩托比赛：湖冰要厚过一米才开赛，每天早上工作人员在赛道上钻孔量冰，把冰厚写在入口的牌子上；比赛日观众站在湖岸的雪堆上，一边烤驯鹿肉肠一边看赛车在冰上甩尾。"
    en: "Immasaarvik District is the capital's port district, on the east side of the mouth of Nuqattaaq Fjord, 1,200 km² with 150,000 people. The warm current keeps the harbour free of ice all year, and the moles of Immasaarvik Harbour hold container, ore, oil and ro-ro berths, the largest port in the territory; the Ukkuliit Vacuum Maglev Heavy-Haul Railway ends at the Immasaarvik Freight Yard, where ore goes straight onto ships, and the control centre for its driverless trains is in the district too. The port, shipbuilding and offshore equipment and logistics are the main trades, industry makes up 38% of the economy, voters back the Social Democratic Mutual Aid Labour Party above all, and the Smelters' and Miners' Union Socialist Workers' Party also has plenty of support here. The Ukkuliit Expressway heads north from here over the Immasaarvik Viaduct, the Sillua Expressway enters the district over the Nuqattaaq Fjord Sea Bridge and the ring road skirts the harbour; Equality Avenue, Artisans' Boulevard and Saarvaq Boulevard link the quays with the housing blocks.\nIn winter ice fog often hangs over the docks, and ships come and go as if rising out of the mist. The night stalls on the quay are where the students of Suvvalik District gather: a bowl of hot fish soup and a piece of fried dough, and you can sit late into the night looking at the ice-free harbour under its lights. On a frozen lake in winter the Immasaarvik Ice Speedway hosts ice racing and snowmobile races. The ice must be over a metre thick before racing starts; every morning staff drill holes along the track to measure it and write the thickness on a board at the entrance, and on race days spectators stand on the snowbanks along the shore, grilling reindeer sausages as the cars slide sideways across the ice."
  codes:
    admin: '920106'
  population: 150000
  area_km2: 1200.0
  traits: { industries: [port, shipbuilding, logistics] }
- id: div_k4vyb1
  subtype: borough
  parent: div_8besy9
  status: generated
  names:
    zh: 尼尔萨库特区
    en: Nirsakut District
    art-x-tavrunaq: Nirsakut
  notes:
    zh: "尼尔萨库特区是首府东北的城郊区，面积近 4000 平方公里，只有 4.5 万人，是首府面积最大、人口最少的区。区名来自 nirsa「驯鹿」，大片苔原上仍有驯鹿放牧，塔夫鲁纳克语母语者占 56%；区内地势向内陆抬升，最高处海拔 1579 米，是首府的最高点。努卡塔克国际机场在区内，是领地的国际枢纽，跑道配有融雪加热系统，极夜和暴风雪中也能起降，地铁 1 号线从市中心一直通到航站楼，另有机场公路相连。西卢阿高速、努基高速、帕卢尔尼克高速、环线和乌库利特高速都经过区内，帕卢尔尼克高速和环线在区内各有一段尼尔萨库特防雪棚，重载铁路以 34 公里的尼尔萨库特特大桥跨过苔原，这里是首府外围的交通枢纽。经济以科研、高等教育和驯鹿放牧为主，65 岁以上的居民不到一成。\n机场到达大厅的大钟下面有一块屏幕，极夜里倒数离回光节日出还有多少天，极昼里倒数离第一次日落还有多少天；冬夜里降落的旅客从舷窗里看到的第一样东西，常常是头顶的极光。尼尔萨库特午夜高尔夫球场建在苔原上，极昼时节午夜也能开球，球道要和驯鹿分享，场边立着「驯鹿优先」的牌子，球被驯鹿踩进地里可以无罚杆重打；每年极昼时节，球场举办一场午夜十二点整开球的比赛。"
    en: "Nirsakut District is the capital's north-eastern outskirts, nearly 4,000 km² with only 45,000 people, the largest and least populous district of the capital. Its name comes from nirsa, \"reindeer\", and reindeer are still herded across its wide tundra; 56% of residents are native Tavrunaq speakers. The land rises inland to 1,579 m, the highest point in the capital. Nuqattaaq International Airport, the territory's international hub, is here, its runways heated against snow so that flights operate through the polar night and blizzards; Metro Line 1 runs from the city centre right to the terminal, and an airport road links it too. The Sillua, Nuqattaaq–Kiluktuar and Pallurniq expressways, the ring road and the Ukkuliit Expressway all pass through; the Pallurniq Expressway and the ring road each have a stretch of the Nirsakut Snow Shed here, and the heavy-haul railway crosses the tundra on the 34 km Nirsakut Viaduct, making the district the transport hub on the capital's edge. It lives on research, higher education and reindeer herding, and fewer than one resident in ten is over 65.\nBeneath the great clock in the airport's arrivals hall a screen counts down, in the polar night, the days to the sunrise of the Return of the Light and, in the midnight sun, the days to the first sunset; passengers landing on a winter night often see the aurora overhead before anything else. The Nirsakut Midnight Sun Golf Course is laid out on the tundra and can be played at midnight in the season of the midnight sun; its fairways are shared with reindeer, signs at the edge say \"Reindeer have right of way\", and a ball trodden into the ground by a reindeer may be replayed without penalty. Every year in the midnight sun the course holds a tournament that tees off at exactly twelve midnight."
  codes:
