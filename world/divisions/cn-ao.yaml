  names:
    zh: 卡瓦卢维特区
    en: Qavvaluviit District
    art-x-tavrunaq: Qavvaluviit
  notes:
    zh: "卡瓦卢维特区是南岸东部外海的卡瓦卢维特群岛，由卡瓦卢格尤阿克岛、温纳塔克岛和库拉克岛组成，群岛陆地约 1.47 万平方公里，8.4 万人，名字在塔夫鲁纳克语里就是「极光群岛」。主岛卡瓦卢格尤阿克岛面积约 1.12 万平方公里，是领地第四大岛，地势低平、远离城市灯光，冬季夜空开阔；东部的温纳塔克岛约 3000 平方公里，最高处海拔四百多米，岛名来自漫长的极夜，岛上有观赏极光的小屋和步道；夹在两岛之间的库拉克岛约 470 平方公里，岛名来自极光常见的绿色光带。冬季极光常在卡瓦卢卡拉湾和宽约 3 公里的卡瓦卢马苏克海峡上空出现，大陆上的卡瓦昆纳尔岬也是观赏的去处。卡瓦卢维特观光度假村的玻璃屋顶客房散布在主岛上，游客躺在床上就能看极光；旅游和邮轮业占经济的大半，第三产业占 84%。群岛偏南，每年极夜约 55 天，比乌库拉克城区短得多。选民里塔夫鲁利特人民党得票最多。\n度假村给每位客人一个「极光闹钟」，夜里极光一出现，前台就挨个打电话叫醒客人；早餐桌上最受欢迎的是热浆果粥，配着讲昨夜极光的故事。向导带游客坐在卡瓦卢卡拉湾边的冰上，带一壶热浆果茶，说「极光要等，茶要趁热」。冬夜里游船沿海峡夜航，经过库拉克岛时熄掉所有灯光，让乘客在黑暗里看极光倒映在水面上，船上只听得见水声；温纳塔克岛步道旁的小屋里备着柴火、热茶和毯子，极光一出来就推门出去。"
    en: "Qavvaluviit District is the Qavvaluviit Islands off the eastern south coast, Qavvalugjuaq, Unnataq and Qurrak, some 14,700 km² of land with 84,000 people; in Tavrunaq the name means \"aurora islands\". The main island, Qavvalugjuaq, about 11,200 km², is the fourth largest island in the territory, low and flat and far from city lights, with wide open winter skies; Unnataq in the east, about 3,000 km² and rising to four hundred-odd metres, is named for its long polar night and has aurora huts and trails; and little Qurrak between them, about 470 km², is named for the green bands the aurora so often shows. In winter the aurora often appears over Qavvaluqalla Bay and the Qavvalumasuq Strait, some 3 km wide, and Qavvakunnar Point on the mainland is another place to watch it. The glass-roofed rooms of the Qavvaluviit Lodge are scattered over the main island so guests can watch the aurora from bed; tourism and cruises make up most of the economy, services 84% of it. Lying further south, the islands have only about 55 days of polar night a year, far fewer than the town of Ukkulaaq. The Tavrulit People's Party wins the most votes.\nThe lodge gives every guest an \"aurora alarm\": when the lights appear in the night, reception rings each room in turn, and at breakfast the favourite is hot berry porridge, served with stories of last night's aurora. Guides take visitors to sit on the ice at the edge of Qavvaluqalla Bay with a flask of hot berry tea, saying \"the aurora has to be waited for, the tea has to be drunk hot\". On winter nights cruise boats sail the strait and put out every light as they pass Qurrak, so that passengers can watch the aurora reflected in the water in the dark with only the sound of the sea; the huts along the Unnataq trails are stocked with firewood, hot tea and blankets, and as soon as the lights come out everyone pushes the door open and steps outside."
  codes:
    admin: '920404'
  population: 84000
  area_km2: 15800.0
  traits: { industries: [tourism, cruise, fishing] }
- id: div_6469m0
  subtype: borough
  parent: div_dfmj5f
  status: generated
  names:
    zh: 西卢阿苏瓦特生态保护区
    en: Silluasuvvat Nature Reserve
    art-x-tavrunaq: Silluasuvvat
  notes:
    zh: "西卢阿苏瓦特生态保护区是乌库拉克市北部的峡湾与冰川山地，整片划为生态保护区，面积 19300 平方公里，常住约 3500 人，塔夫鲁纳克语母语者占八成多。海拔 2022 米的陶武皮鲁克峰是苏瓦尔尤伊特山脉的最高峰，也是大陆上仅次于西尔米峰的第二高的命名山峰；约 3700 平方公里的陶武西尔米冰川从峰顶向四周流下，北缘伸入内陆矿区。乌库苏瓦峡湾的内段深入保护区，海拔 776 米的基萨尔卡蒂克山口是穿越山地的低口。西卢阿高速的南岸段和北段经过保护区边缘，乌库努卡—西卢阿苏瓦特公路从乌库努卡区通到保护区，全长约 53 公里，其中约 20 公里建在西卢阿苏瓦特防雪棚下，最陡处坡度达到百分之五。区内经济以自然保护、巡护和旅游为主，冬天最低纪录零下 37 度，每年有七十多天极夜、九十多天极昼。选民里塔夫鲁利特人民党和长老之道得票最多。\n陶武皮鲁克峰的名字意为「天峰」，晴朗的夏天，乌库拉克的登山爱好者喜欢来这里爬山，站在两千多米的峰顶，可以望见冰封的远山和不冻的港湾。冰川表面的裂隙在夏天的阳光下泛出幽蓝色，登山向导带人走冰川时，每一步都要先用冰镐探一探。基萨尔卡蒂克山口旁的石堆路标是过去猎人和牧人在雾里找路的依靠，如今徒步者路过时也会添上一块石头；巡护员说，路标一年比一年高，是保护区里唯一允许「越堆越多」的东西。"
    en: "Silluasuvvat Nature Reserve is the fjord and glacier country of northern Ukkulaaq City, declared a nature reserve in its entirety: 19,300 km² with about 3,500 residents, more than eight in ten of them native Tavrunaq speakers. Mount Tauvvupirruk, 2,022 m, is the highest peak of the Suvvarjuit Mountains and the second highest named peak on the mainland after Mount Sirmi; the Tauvvusirmi Glacier, some 3,700 km², flows down from its summit on every side, its northern edge reaching into the inland mining country. The inner reaches of the Ukkusuvva Fjord run deep into the reserve, and the Qissarkatiq Pass, 776 m, is the low way through the mountains. The south-coast and northern sections of the Sillua Expressway skirt the reserve's edges, and the Ukkunuqa–Silluasuvvat Road runs about 53 km from Ukkunuqa District into the reserve, some 20 km of it under the Silluasuvvat Snow Shed, with gradients up to 5% at the steepest. The district lives on conservation, ranger patrols and tourism; its record low is −37 °C, and each year brings seventy-odd days of polar night and ninety-odd of midnight sun. The Tavrulit People's Party and the Way of the Elders win the most votes.\nMount Tauvvupirruk means \"sky peak\", and on clear summer days Ukkulaaq's climbers come to scale it; from the summit, over 2,000 m up, you can see frozen mountains in the distance and the ice-free harbour below. In the summer sun the crevasses on the glacier glow a deep blue, and guides leading parties across the ice test every step first with an ice axe. The stone cairns beside the Qissarkatiq Pass were what hunters and herders once relied on to find their way in fog, and hikers passing today add a stone of their own; the rangers say the cairns grow taller every year, the only thing in the reserve allowed to \"keep piling up\"."
  codes:
    admin: '920405'
  population: 3500
  area_km2: 19300.0
  special_status: nature_reserve
  traits: { industries: [conservation, tourism], heritage: tavrulit }

# ── 图利瓦克市 ──
- id: div_aggzhy
  subtype: locality
  parent: div_hpmerr
  status: generated
  names:
    zh: 图利瓦克市
    en: Tullivaq City
    art-x-tavrunaq: Tullivaq
  notes:
    zh: "图利瓦克是北冰洋大陆西端的城市，在首府以西约 700 公里，全市 5.83 万平方公里，31.5 万人。城区图利亚利维克区建在海岸台地上，西侧是领地最小的命名海湾图利卡拉湾；东边的图拉卡特区是河谷和峡湾，长约 55 公里的图拉苏瓦峡湾是领地最短的命名峡湾，两侧的河流筑有水电站；西面海上的图卡鲁维特群岛是数据中心，北面远海的陶武维特群岛有卫星地面站；东北的普拉普卡高原整片是普拉普卡特生态保护区，占全市四成多的面积，高原顶上的普卡西尔米冰帽是大陆上最小的命名冰川。这里纬度高、冬季长，一月平均气温约零下 15 度，七月不到 5 度，每年有八十多天极夜。\n冷空气和图拉卡特区的水电让这里成为领地的数据中心与算力基地，主业是数据中心、信息技术和水力发电。图卡尔尤阿克数据中心和北极光算力中心用极地冷空气和海水冷却，海底光缆从阿利克塔克岛登陆后连到世界各地；陶武维特地面站接收极轨卫星的数据，再转发到图卡鲁维特群岛。全市人均产值约 10.5 万美元，在各市中仅次于金融特区，劳动年龄人口占 72%，塔夫鲁纳克语母语者约四成，其余多是来自世界各地的工程师和家人。图利亚利维克区是西卢阿高速、尼尔萨瓦克高速和西卢阿真空磁悬浮的西端起点，两条高速以长段防雪棚翻越普拉普卡高原，一条市道全程在防雪棚下通往保护区。市议会 35 席，金库党以 9 席居首，市长努瓦利亚克·卡尔苏克出自金库党，开源党在这里也拿到 2 席。市旗是深浅两道蓝色横条，旗杆一侧白色三角里一枚深蓝雪花，市内每一座机房里都挂着这面旗；市花是柳兰，市树是欧洲刺柏。\n市名里的 tulli 在塔夫鲁纳克语里是「冷」，图利瓦克人说寒冷是这座城市最值钱的资源：数据中心靠极地的冷空气给服务器降温，排出的余热再送进全市的游泳馆、温室和居民楼，本地人开玩笑说自己是「泡在服务器的洗澡水里游泳」，冷风则「从山口进城，在数据中心里干活，从游泳馆里出来」。城里的工程师来自世界各地，图利亚利维克区的一条街就能吃到十几个国家的菜，周五晚上最热闹的是一家用余热温室种菜的沙拉馆，在极夜里吃上一盘新鲜生菜，是这里的小奢侈。陶武维特地面站一天要接收几十次极轨卫星的数据，值班员有个习惯，每颗卫星飞过头顶就在黑板上画一道，一年下来黑板要擦好几百次。极夜长达八十多天，结束那天，市里的电力公司会给每户寄一张印着太阳的明信片，背面写着当天日出的时刻。"
    en: "Tullivaq is the city at the western end of the Arctic Ocean mainland, about 700 km west of the capital, with 315,000 people in 58,300 km². The town, Tullijaalivik District, stands on a coastal terrace beside Tulliqalla Bay, the smallest named bay in the territory; Tullakkat District to the east is valley and fjord country, where the Tullasuvva Fjord, some 55 km long, is the shortest named fjord in the territory and the rivers on either side are dammed for hydro power; the Tukkaruviit Islands out to the west hold data centres, and the Tauvvuviit Islands far to the north a satellite ground station; and the Pullapukka Plateau to the north-east is entirely the Pullapukkat Nature Reserve, more than four-tenths of the city, with the Pukkasirmi Ice Cap on top, the smallest named glacier on the mainland. It lies far north and its winters are long: January averages about −15 °C, July less than 5 °C, and there are more than eighty days of polar night a year.\nCold air and the hydro power of Tullakkat District have made the city the territory's base for data centres and computing, and its trades are data centres, information technology and hydro power. The Tukkarjuaq Data Centre and the Northern Lights Compute Centre are cooled by polar air and sea water, and submarine cables come ashore on Aliqtaq Isle to reach the rest of the world, while the Tauvvuviit Ground Station takes data from polar-orbiting satellites and relays it to the Tukkaruviit Islands. Output per head is about US$105,000, second only to the Financial Zone among the cities; people of working age make up 72%, about two in five residents are native Tavrunaq speakers, and most of the rest are engineers and their families from all over the world. Tullijaalivik District is the western starting point of the Sillua and Nirsavaq expressways and the Sillua Vacuum Maglev; both expressways climb over the Pullapukka Plateau under long snow sheds, and a municipal road runs to the reserve entirely under a snow shed. The city council has 35 seats, the Vault Party leads with 9 and the mayor, Nuvaliaq Qaarsuk, comes from it, while the Open Source Party also wins 2 seats here. The city flag has two horizontal stripes of deep and light blue with a white triangle at the hoist bearing a deep blue snowflake, and it hangs in every server hall in the city; the city flower is fireweed and the city tree the common juniper.\nThe tulli in the city's name is Tavrunaq for \"cold\", and Tullivaq people say cold is their most valuable resource: the data centres cool their servers with polar air, and the waste heat goes on to warm the city's swimming pools, greenhouses and flats, so locals joke that they \"swim in the servers' bathwater\", and that the cold wind \"comes into town through the pass, works in the data centres and leaves through the swimming baths\". The engineers come from all over the world, a single street in Tullijaalivik offers the food of a dozen countries, and the busiest place on a Friday night is a salad bar whose greens grow in a waste-heat greenhouse: a plate of fresh lettuce in the polar night is the local small luxury. The Tauvvuviit Ground Station takes dozens of passes from polar-orbiting satellites a day, and the duty staff chalk a stroke on a blackboard for each satellite overhead, wiping the board hundreds of times a year. The polar night lasts more than eighty days, and on the day it ends the power company posts every household a card printed with a sun, giving that day's sunrise time on the back."
  codes:
    admin: '920500'
    unlocode: AO TLV
  population: 315300
  area_km2: 58300.0
  color: '#3E6FB0'
  flag: { layout: hoist, colors: ['#FFFFFF', '#2A5C9A', '#9FC6E7'], charge: snowflake, charge_color: '#2A5C9A' }
  flag_notes:
    zh: "上深蓝、下浅蓝两道横条，旗杆一侧一个白色三角，三角里一枚深蓝雪花。雪花是让数据中心不必另外制冷的冷空气，深蓝是图拉卡特区水电站的库水，浅蓝是海底光缆通往世界各地的那片海。市内每一座机房里都挂着这面旗。"
    en: "Deep blue over light blue, with a white triangle at the hoist bearing a deep blue snowflake. The snowflake is the cold air that cools the data centres for nothing, the deep blue the reservoirs of the hydro plants, the light blue the sea under which the cables run to the rest of the world. The flag hangs in every server hall in the city."
  traits: { industries: [datacenter, tech, hydropower], heritage: polar_global, age: young, income: 1.1 }
  symbols: {"flower": {"zh": "柳兰", "en": "Fireweed"}, "tree": {"zh": "欧洲刺柏", "en": "Common juniper"}}
- id: div_79wfwy
  subtype: borough
  parent: div_aggzhy
  status: generated
  names:
    zh: 图利亚利维克区
    en: Tullijaalivik District
    art-x-tavrunaq: Tullijaalivik
  notes:
    zh: "图利亚利维克区是图利瓦克市的城区，建在海岸台地上，面积 800 平方公里，17.5 万人，区名来自终年吹过台地的冷风，tulli「冷」和 jaali「风」都在其中。西侧的图利卡拉湾面积约 830 平方公里，是领地命名海湾中最小的，湾口朝向图卡鲁维特群岛；图利基卢克河从这里入海。区内的数据中心和软件公司集中，人均产值约 11.7 万美元，在全领地各区中仅次于帕卢库特区，选民里金库党得票最多。图利瓦克站是西卢阿真空磁悬浮的西端终点，西卢阿高速和尼尔萨瓦克高速都从这里出发；城区有约 12 公里的暖廊，图恩大街、云杉大道和北京大道两旁是公司楼、公寓和餐馆。图利亚利维克—普拉普卡特公路长约 111 公里，全程在普拉普卡高原防雪棚下通往保护区。区内一月平均气温约零下 15 度，每年有 85 天极夜、97 天极昼。\n城里的工程师来自世界各地，一条街就能吃到十几个国家的菜，周五晚上最热闹的是一家用余热温室种菜的沙拉馆，在极夜里吃上一盘新鲜生菜，是这里的小奢侈。数据中心的余热送进游泳馆和居民楼，本地人说自己「泡在服务器的洗澡水里游泳」。冬天冷风从高原吹过海湾，台地上的人走路都侧着身子，孩子们学会的第一句塔夫鲁纳克语往往就是区名里的那个「风」。"
    en: "Tullijaalivik District is the town of Tullivaq City, built on a coastal terrace: 800 km² with 175,000 people. Its name comes from the cold wind that blows across the terrace all year, combining tulli, \"cold\", and jaali, \"wind\". Tulliqalla Bay to the west, about 830 km², is the smallest named bay in the territory, its mouth facing the Tukkaruviit Islands, and the Tullikiluk River reaches the sea here. Data centres and software firms cluster in the district, output per head is about US$117,000, second only to Pallukut District in the territory, and the Vault Party wins the most votes. Tullivaq station is the western terminus of the Sillua Vacuum Maglev, and the Sillua and Nirsavaq expressways both start here; the town has some 12 km of skyways, and Tuun Boulevard, Spruce Avenue and Beijing Avenue are lined with offices, flats and restaurants. The Tullijaalivik–Pullapukkat Road runs about 111 km to the reserve, all of it under the Pullapukka Plateau Snow Shed. January averages about −15 °C, and each year brings 85 days of polar night and 97 of midnight sun.\nThe engineers come from all over the world, a single street offers the food of a dozen countries, and the busiest place on a Friday night is a salad bar whose greens grow in a waste-heat greenhouse: a plate of fresh lettuce in the polar night is the local small luxury. The data centres' waste heat warms the swimming baths and flats, and locals say they \"swim in the servers' bathwater\". In winter the cold wind sweeps off the plateau across the bay, people walk the terrace leaning sideways into it, and the first Tavrunaq word the children learn is often the \"wind\" in their district's name."
  codes:
    admin: '920501'
  population: 175000
  area_km2: 800.0
  traits: { industries: [datacenter, tech, commerce] }
- id: div_najb0c
  subtype: borough
  parent: div_aggzhy
  status: generated
  names:
    zh: 图拉卡特区
    en: Tullakkat District
    art-x-tavrunaq: Tullakkat
  notes:
    zh: "图拉卡特区在图利瓦克城区以东，是苏瓦基卢克河谷所在的区，面积 14200 平方公里，7.9 万人。长约 55 公里的图拉苏瓦峡湾是领地五条命名峡湾中最短的，两岸是陡峭的谷壁，两侧的河流筑有水电站，电力和冷空气吸引了大批数据中心落户，区内的主业就是数据中心和水力发电，第二产业占 36%。年轻的技术人员多，65 岁以上居民只占 6%，比例是全领地各区中最低的，14 岁以下的孩子却占两成。海拔 502 米的图拉卡蒂克山口是领地最低的命名山口，冷风从山口沿谷地吹向峡湾；南岸的塔库昆纳尔岬是暖流与冷空气相遇的地方，海面上常起浓雾，岬上设有雾笛。西卢阿高速和尼尔萨瓦克高速都穿过区内，尼尔萨瓦克高速在这里有一段约 53 公里的图拉卡特防雪棚。松林大道、冬雪路和丁香大道是河谷小镇的主街。选民里塔夫鲁利特人民党和金库党不相上下。\n冬天冷风沿谷地吹到海面上，水面会冒起一层薄薄的白汽，本地人说峡湾「在呼气」。山口虽低，冬天的风却格外猛，图利瓦克人说冷风「从山口进城，在数据中心里干活，从游泳馆里出来」。塔库昆纳尔岬的雾笛声音低沉悠长，渔民说它「像一头在雾里叫的海象」，听惯了的人在雾里一听就知道自己的位置。"
    en: "Tullakkat District lies east of the town of Tullivaq, the district of the Suvvakiluk valley: 14,200 km² with 79,000 people. The Tullasuvva Fjord, some 55 km long, is the shortest of the territory's five named fjords, walled by steep valley sides, and the rivers on either side are dammed for hydro power; electricity and cold air have drawn in a great many data centres, which with hydro power are the district's trades, industry making up 36% of the economy. Young technical staff abound: only 6% of residents are over 65, the lowest share of any district in the territory, while children under 15 make up a fifth. The Tullakatiq Pass, 502 m, is the lowest named pass in the territory, and the cold wind blows from it down the valley to the fjord; on the south coast Taqqukunnar Point is where the warm current meets the cold air, fog often lies on the sea, and the point has a foghorn. The Sillua and Nirsavaq expressways both cross the district, the Nirsavaq Expressway running here through the Tullakkat Snow Shed, some 53 km long. Pinewood Avenue, Winter Snow Road and Lilac Avenue are the main streets of the valley towns. The Tavrulit People's Party and the Vault Party are neck and neck at the polls.\nWhen the winter wind blows down the valley onto the sea, a thin white vapour rises from the water, and locals say the fjord \"is breathing out\". The pass may be low, but its winter wind is fierce, and Tullivaq people say the cold wind \"comes into town through the pass, works in the data centres and leaves through the swimming baths\". The foghorn on Taqqukunnar Point has a deep, long note that fishermen say is \"like a walrus calling in the fog\", and those used to it can tell where they are in the fog at a single blast."
  codes:
    admin: '920502'
  population: 79000
  area_km2: 14200.0
  traits: { industries: [datacenter, hydropower], heritage: polar_mixed }
- id: div_3xz1pw
  subtype: borough
  parent: div_aggzhy
  status: generated
  names:
    zh: 图卡鲁维特区
    en: Tukkaruviit District
    art-x-tavrunaq: Tukkaruviit
  notes:
    zh: "图卡鲁维特区是大陆西岸外的图卡鲁维特群岛，由图卡尔尤阿克岛、阿利克塔克岛和帕利塔库岛组成，群岛陆地约 6900 平方公里，是领地命名群岛中面积最小的，4.9 万人。主岛图卡尔尤阿克岛约 3900 平方公里，岛名来自岛上的图卡尔尤阿克数据中心；它和北极光算力中心用极地冷空气和海水冷却，余热为岛上的住宅、游泳馆和温室供暖。东部的阿利克塔克岛约 1800 平方公里，连接世界各地的海底光缆在这里登陆；它与西部的帕利塔库岛之间是阿利克马苏克海峡，宽约 11 公里，是领地最宽的命名海峡，光缆沿海峡底部铺设。帕利塔库岛夏季常被白色海雾笼罩。区内经济以数据中心和信息技术为主，人均产值约 9.9 万美元；居民多是数据中心的工程师和运维人员，中文和英文母语者各占三成多，金库党在这里得票近三成。每年有 87 天极夜。\n北极光算力中心为人工智能训练出租算力，大楼外墙的灯带随着算力负载变换颜色，本地人看一眼墙色就知道「机器今天忙不忙」；中心的食堂按全球时区排班开饭，什么时候去都有热饭。光缆登陆站旁立着一块石碑，刻着光缆另一端连接的地方；光缆维修船偶尔在海峡里停泊几天，岛上的人管它叫「给世界接线的船」。海雾来时，帕利塔库岛的灯塔和雾笛同时启动，渔民说在附近航行「靠耳朵比靠眼睛管用」。"
    en: "Tukkaruviit District is the Tukkaruviit Islands off the west coast of the mainland, Tukkarjuaq, Aliqtaq and Paalitaqqu, some 6,900 km² of land, the smallest of the territory's named archipelagos, with 49,000 people. The main island, Tukkarjuaq, about 3,900 km², is named after its Tukkarjuaq Data Centre, which with the Northern Lights Compute Centre is cooled by polar air and sea water, its waste heat warming the island's homes, swimming baths and greenhouses. Aliqtaq Isle in the east, about 1,800 km², is where submarine cables from all over the world come ashore; between it and Paalitaqqu Isle in the west lies the Aliqmasuq Strait, about 11 km wide, the widest named strait in the territory, with the cables laid along its floor. Paalitaqqu is often wrapped in white sea fog in summer. The district lives on data centres and information technology, with output per head of about US$99,000; most residents are data-centre engineers and operators, native Chinese and English speakers each make up over three in ten, and the Vault Party takes nearly three in ten votes. There are 87 days of polar night a year.\nThe Northern Lights Compute Centre rents out computing power for training artificial intelligence, and the light strips on its walls change colour with the load, so locals can tell at a glance \"how busy the machines are today\"; its canteen serves meals around the clock on every time zone in the world, so there is always a hot meal. Beside the cable landing station stands a stone carved with the places at the other ends of the cables, and when a cable repair ship lies in the strait for a few days the islanders call it \"the ship that wires up the world\". When the sea fog comes in, the lighthouse and foghorn on Paalitaqqu start up together, and fishermen say that sailing near it \"your ears are more use than your eyes\"."
  codes:
    admin: '920503'
  population: 49000
  area_km2: 9600.0
  traits: { industries: [datacenter, tech] }
- id: div_6p8a1q
  subtype: borough
  parent: div_aggzhy
  status: generated
  names:
    zh: 陶武维特区
    en: Tauvvuviit District
    art-x-tavrunaq: Tauvvuviit
  notes:
    zh: "陶武维特区是大陆西北远海的陶武维特群岛，由陶瓦克岛和萨卡利特岛组成，群岛陆地约 7700 平方公里，只有 1.1 万人，群岛因卫星地面站得名，tauvvu 在塔夫鲁纳克语里是「天」。极轨卫星每一圈都经过高纬度上空，主岛陶瓦克岛面积约 7400 平方公里，地势低缓、少有遮挡，陶武维特地面站的天线阵就建在这里，接收卫星数据后再转发到图卡鲁维特群岛；萨卡利特岛面积约 340 平方公里，是领地最小的命名岛屿，岛上只有几座为地面站接力的天线和一间维护小屋。区内经济以卫星地面站、遥感和科研为主，劳动年龄人口占 75%。这里是领地最北的有人群岛之一，一月平均气温约零下 20 度，每年极夜长达 109 天、极昼 119 天。选民里北岸联盟得票最多，金库党居次。\n天线阵在雪原上排成整齐的白色圆盘，地面站一天要接收几十次过境的卫星数据，值班员有个习惯，每颗卫星飞过头顶就在黑板上画一道，一年下来黑板要擦好几百次。两座岛上的天线一大一小遥遥相对，地面站的人说它们是「一对隔海说话的兄弟」。萨卡利特岛的维护人员乘船上岛，风暴天就在小屋里多住几天，墙上贴满了历次「滞留」的记录。"
    en: "Tauvvuviit District is the Tauvvuviit Islands far out to the north-west of the mainland, Tauvvaq and Saqqaliit, some 7,700 km² of land with only 11,000 people; the islands are named for the satellite ground station, tauvvu being Tavrunaq for \"sky\". Polar-orbiting satellites pass over the high latitudes on every orbit, and on the main island, Tauvvaq, about 7,400 km², low-lying and unobstructed, stands the antenna field of the Tauvvuviit Ground Station, which receives the satellites' data and relays it to the Tukkaruviit Islands; Saqqaliit Isle, about 340 km², is the smallest named island in the territory, with only a few relay antennas and a maintenance hut. The district lives on satellite ground stations, remote sensing and research, and people of working age make up 75%. It is among the territory's northernmost inhabited islands: January averages about −20 °C, and the polar night lasts 109 days a year and the midnight sun 119. The North Shore Alliance wins the most votes, with the Vault Party second.\nThe antennas stand in neat rows of white dishes on the snowfield, and the ground station takes dozens of satellite passes a day; the duty staff chalk a stroke on a blackboard for each satellite overhead, wiping the board hundreds of times a year. The antennas on the two islands, one large and one small, face each other across the water, and station staff call them \"two brothers talking across the sea\". The maintenance crew reach Saqqaliit by boat and on stormy days stay a few extra days in the hut, whose walls are covered with records of every time they were \"stranded\"."
  codes:
    admin: '920504'
  population: 10500
  area_km2: 8500.0
  traits: { industries: [satellite, research] }
- id: div_5h1yv5
  subtype: borough
  parent: div_aggzhy
  status: generated
  names:
    zh: 普拉普卡特生态保护区
    en: Pullapukkat Nature Reserve
    art-x-tavrunaq: Pullapukkat
  notes:
    zh: "普拉普卡特生态保护区是图利瓦克市东北的普拉普卡高原，整片划为生态保护区，面积 25200 平方公里，占全市四成多，常住约 1800 人，多为驯鹿牧民和巡护员，塔夫鲁纳克语母语者占 86%。高原上最高的是海拔 1568 米的普卡皮鲁克峰，顶上覆着约 1100 平方公里的普卡西尔米冰帽，是大陆上最小的命名冰川，东缘伸入尼尔萨图维特生态保护区；高原北缘是陶武卡拉湾、图利卡拉湾和坎尼昆纳尔岬，陶武卡拉湾畔的中继天线把地面站的信号转发到城里。高原冬天极冷，一月平均气温约零下 23 度，最低纪录零下 42 度。西卢阿高速和尼尔萨瓦克高速以长段防雪棚翻越高原，西卢阿高速的普拉普卡高原防雪棚长约 76 公里，尼尔萨瓦克高速还在这里钻过一段普拉普卡高原隧道；图利亚利维克—普拉普卡特公路全程在防雪棚下。经济以自然保护和驯鹿放牧为主，选民里塔夫鲁利特人民党和长老之道几乎平分秋色。\n高原上没有遮挡，暴风雪来时能见度几乎为零，巡护员说在这里迷路的人要「坐下来等，不要乱走」。冰帽不大，夏天有经验的徒步者能在一天之内绕它走一圈，冰帽边缘常能看到雪兔留下的脚印。春天坎尼昆纳尔岬的积雪融化，雪水从崖壁上挂下一道道小瀑布；牧民赶着驯鹿群转场时，会在防雪棚的出口等车流过去，司机们也习惯在这里减速。"
    en: "Pullapukkat Nature Reserve is the Pullapukka Plateau north-east of Tullivaq City, declared a nature reserve in its entirety: 25,200 km², more than four-tenths of the city, with about 1,800 residents, mostly reindeer herders and rangers, 86% of them native Tavrunaq speakers. The highest point of the plateau is Mount Pukkapirruk, 1,568 m, capped by the Pukkasirmi Ice Cap, some 1,100 km², the smallest named glacier on the mainland, whose eastern edge reaches into the Nirsatuvvit Nature Reserve. Along the northern edge of the plateau lie Tauvvuqalla Bay, Tulliqalla Bay and Cape Qannikunnar, and relay antennas beside Tauvvuqalla Bay pass the ground station's signals on to town. Winters on the plateau are bitter, January averaging about −23 °C, with a record low of −42 °C. The Sillua and Nirsavaq expressways cross the plateau under long snow sheds, the Sillua Expressway's Pullapukka Plateau Snow Shed being some 76 km long, and the Nirsavaq Expressway also passes through the Pullapukka Plateau Tunnel here; the Tullijaalivik–Pullapukkat Road runs under snow sheds all the way. The economy is conservation and reindeer herding, and the Tavrulit People's Party and the Way of the Elders split the vote almost evenly.\nNothing breaks the wind on the plateau, and in a blizzard visibility falls almost to nothing; rangers say anyone lost up here should \"sit down and wait, don't wander\". The ice cap is small enough for an experienced walker to go right round it in a summer's day, and snowshoe hare tracks are often seen along its edge. In spring the snow on Cape Qannikunnar melts and hangs in little waterfalls down the cliffs; when herders move their reindeer to new grazing they wait at the snow-shed portals for the traffic to pass, and drivers are used to slowing down there."
  codes:
    admin: '920505'
  population: 1800
  area_km2: 25200.0
  special_status: nature_reserve
  traits: { industries: [conservation, herding], heritage: tavrulit }

# ── 考尔尼克市 ──
- id: div_djze5f
  subtype: locality
  parent: div_hpmerr
  status: generated
  names:
    zh: 考尔尼克市
    en: Qaurniq City
    art-x-tavrunaq: Qaurniq
  notes:
    zh: "考尔尼克是北冰洋大陆内陆的矿业城市，在首府以北约 230 公里，面积 95000 平方公里，在各市中排第三，35.8 万人，塔夫鲁纳克语母语者约占五成半。城区考卢尤阿克区加工钻石；东南的伊卢克萨特区从伊卢考湖的盐湖卤水中提锂，一直延伸到南岸的伊图苏瓦峡湾；东北的乌库利特矿区管理区有露天钻石矿和镍矿，西尔米冰盖的西缘也伸进区内，最高处海拔 2165 米；南面、首府与考尔尼克之间的伊卢克图克生态保护区是大湖苔原，伊卢尔尤阿克湖面积约 2100 平方公里，是领地最大的命名湖泊。这里远离海洋，是领地少有的亚寒带气候，河谷里长得出稀疏的白云杉，一月平均气温约零下 20 度，七月约 12 度，一年降水不到 300 毫米，是各市中最干的。\n全市以采矿与石料、制造业和物流为主，第二产业占经济的 54%，人均生产总值约 8.3 万美元，年轻人多，劳动年龄人口占 71%。考卢尤阿克钻石矿的原石在城里切割加工，乌库利特镍矿的矿石由乌库利特真空磁悬浮重载铁路的无人驾驶列车经伊卢考湖运往伊马萨尔维克的不冻港；伊卢克萨特提锂厂的产品供应电池工厂。努基高速经过考卢尤阿克区，乌库利特高速和重载铁路通往伊卢考湖与矿区，考伊公路在内陆把两条干线连起来，以伊卢考湖特大桥跨过湖面，另一条市道以长约 17 公里的特大桥跨过伊卢尔尤阿克湖。市议会 37 席，塔夫鲁利特人民党占 10 席，市长陈静宜出自该党，冶炼与矿山工会社会主义工人党以 8 席居次。市旗紫白斜分，紫色里一颗白色钻石，斜分线是露天矿坑的台阶，市民叫它「矿工的旗」；市花是北极羽扇豆，市树是白云杉。\n考尔尼克是领地冬夏温差最大的城市之一，冬天最冷时跌到零下四十多度，夏天却有二十五度的暖日，本地人说「考尔尼克一年只穿两季衣服：最厚的和最薄的」。考卢尤阿克钻石切割中心对外开放，游客可以隔着玻璃看切割师把一颗毛坯钻石慢慢磨出几十个刻面；城里的年轻人求婚，按老规矩要送一颗自己在矿区干活攒钱买下的小钻石。伊卢克萨特提锂厂的卤水池在夏天的阳光下呈现深浅不一的蓝绿色，从飞机上看像一块调色板。矿工的家常菜是驯鹿肉、大麦和根菜炖成的浓汤，冬天下井前，食堂会给每人发一瓶滚烫的浆果茶。伊卢尔尤阿克湖冬天湖面结冰一米多厚，冰上的道路连起湖边的村子，夏天冰一化，那些路就沉进了湖里。"
    en: "Qaurniq is the mining city of the Arctic Ocean mainland's interior, about 230 km north of the capital; at 95,000 km² it is the third largest city in area, with 358,000 people, about fifty-five in a hundred of them native Tavrunaq speakers. The town, Qaulujjuaq District, cuts diamonds; Illuqsaat District to the south-east draws lithium from the brine of the salt lake Illuqqau and reaches all the way to the Ittusuvva Fjord on the south coast; the Ukkuliit Mining Administration Zone to the north-east has open-pit diamond and nickel mines, with the western edge of the Sirmi Ice Cap reaching into it and a highest point of 2,165 m; and the Illuqtuuq Nature Reserve to the south, between the capital and Qaurniq, is great-lake tundra, where Illurjuaq Lake, some 2,100 km², is the largest named lake in the territory. Far from the sea, it has one of the territory's rare subarctic climates, with sparse white spruce in its valleys; January averages about −20 °C and July about 12 °C, and the year brings less than 300 mm of rain and snow, the driest of any city.\nThe city lives on mining and quarrying, manufacturing and logistics; industry makes up 54% of the economy, output per head is about US$83,000, and the population is young, with 71% of working age. Rough stones from the Qaulujjuaq Diamond Mine are cut in town, while ore from the Ukkuliit Nickel Mine is carried by the driverless trains of the Ukkuliit Vacuum Maglev Heavy-Haul Railway via Illuqqau Lake to the ice-free harbour at Immasaarvik; the Illuqsaat Brine Works supplies battery factories. The Nuqattaaq–Kiluktuar Expressway passes through Qaulujjuaq District, the Ukkuliit Expressway and the heavy-haul railway lead to Illuqqau Lake and the mines, and the Qaulujjuaq–Illuqsaat Road links the two trunk routes inland, crossing the lake on the Illuqqau Lake Bridge, while a municipal road crosses Illurjuaq Lake on a bridge some 17 km long. The city council has 37 seats, the Tavrulit People's Party holds 10 and the mayor, Chen Jingyi, comes from it, with the Smelters' and Miners' Union Socialist Workers' Party second on 8. The city flag is divided diagonally purple and white with a white diamond on the purple, the diagonal being the benches of an open pit, and people call it \"the miners' flag\"; the city flower is the Arctic lupine and the city tree the white spruce.\nQaurniq has one of the widest swings between winter and summer in the territory, falling to below −40 °C at its coldest yet reaching 25 °C on warm summer days, and locals say they \"only dress for two seasons: the thickest and the thinnest\". The Qaulujjuaq Diamond Cutting Centre is open to visitors, who watch through glass as cutters slowly grind a rough stone into dozens of facets, and by old custom a young person proposing gives a small diamond bought with money saved from working at the mines. In the summer sun the brine pools of the Illuqsaat Brine Works shine in every shade of blue and green, like a painter's palette seen from the air. Miners eat a thick stew of reindeer, barley and root vegetables, and before a winter shift underground the canteen hands each of them a flask of scalding berry tea. In winter the ice on Illurjuaq Lake is over a metre thick and roads across it link the lakeside villages; when the ice melts in summer, those roads sink into the lake."
  codes:
    admin: '920600'
    unlocode: AO QRN
  population: 357500
  area_km2: 95000.0
  color: '#6B4FA0'
  flag: { layout: diagonal, colors: ['#4B2C6F', '#FFFFFF'], charge: crystal, charge_color: '#FFFFFF' }
  flag_notes:
    zh: "左上紫色、右下白色斜分，紫色部分一颗白色钻石。紫色取自考卢尤阿克加工的钻石在灯下的光，白色是伊卢克萨特盐湖的盐壳，人们从卤水里提锂；斜分线是露天矿坑的台阶。考尔尼克的第二产业占经济一半以上，市民把这面旗叫作「矿工的旗」。"
    en: "Divided diagonally, purple in the upper hoist and white in the lower fly, with a white diamond on the purple. The purple is the gleam of cut diamonds under the lamp, the white the salt crust of the lithium lake, and the diagonal the benches of the open pit. Industry is more than half the city's economy, and people call it 'the miners' flag'."
  traits: { industries: [mining, manufacturing, logistics], heritage: polar_mixed, age: young }
  symbols: {"flower": {"zh": "北极羽扇豆", "en": "Arctic lupine"}, "tree": {"zh": "白云杉", "en": "White spruce"}}
