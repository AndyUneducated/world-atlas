    en: The uplands east of the Sirmi Ice Cap, 35,000 km² with 78,000 people working in research and satellite remote sensing. Months of night in winter and the dry cold air suit astronomy, the Tauvvaniq Observatory and the aurora stations are scattered over the uplands, and Sirmiqulliqtuuq Lake is here. The Sirmipaa Expressway runs some 195 km through the district, with the 42 km Tauvvaniq Snow Shed, and has no street lighting so as not to disturb the observatories.
