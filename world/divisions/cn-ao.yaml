  names:
    zh: 乌库乌维特矿区管理区
    en: Ukkuuviit Mining Administration Zone
    art-x-tavrunaq: Ukkuuviit
  notes:
    zh: "乌库乌维特矿区管理区是乌库乌维特群岛的矿区，区名由 ukku「矿」和 -uviit「群岛」组成，意思就是「矿的群岛」。全区面积 9400 平方公里，包括乌维克萨克岛的大部分和西卢奥库岛、基蒂利克岛、阿考库岛，常住约 1.7 万人，多为矿工，经济以采矿和物流为主，第二产业占 56%。乌库乌维特露天矿在西卢奥库岛上，出产稀土精矿，运往乌维克努卡码头装船；面积约 1300 平方公里的乌库卡拉湾大部分在区内，湾内风浪较小，补给船在这里等待进港的时机。乌维克萨克岛最高处海拔 783 米，是群岛地势最高的地方；基蒂利克岛的岩石含磁铁矿，罗盘在这里会偏转，岛名由此而来；最北的阿考库岛最高处近五百米，还在勘探之中。哈尔滨大街、极光大道和基克萨克大街是矿工营地的主街。选民里塔夫鲁利特人民党得票最多，岛民之声爱国阵线居次。\n矿坑一圈圈向下的台阶从机场起降的飞机上看得清清楚楚，像一只巨大的漏斗。矿工两周一轮换，乘飞机往返首府，岛上的孩子把矿里运出来的矿石叫作「彩色石头」。来基蒂利克岛考察的学生第一件事就是掏出罗盘看指针乱转，岛上的老向导干脆只靠太阳和海岸线认路。夏天勘探队在阿考库岛上扎营，营地的帐篷排成一行，远看像一串彩色的纽扣钉在灰色的山坡上；岛上的人看到乌库卡拉湾里停着船，就知道新鲜水果和牛奶快到了。"
    en: "The Ukkuuviit Mining Administration Zone is the mining district of the Ukkuuviit Islands; its name joins ukku, \"mine\", and -uviit, \"islands\": \"the mine islands\". It covers 9,400 km², taking in most of Uviqsaaq Island and the islands of Silluaukku, Qittilik and Aqqaukku, and has about 17,000 residents, mostly miners; the economy is mining and logistics, industry making up 56%. The Ukkuuviit Open Pit on Silluaukku produces rare-earth concentrate, which goes to Uviqnuqa Quay for shipping; most of Ukkuqalla Bay, some 1,300 km², lies within the zone, and in its sheltered water supply ships wait for their moment to enter port. The top of Uviqsaaq Island, 783 m, is the highest ground in the archipelago; the rocks of Qittilik contain magnetite that sends compasses astray, which gave the island its name; and Aqqaukku, the northernmost, rising to nearly 500 m, is still being prospected. Harbin Boulevard, Aurora Avenue and Kiiqsaq Boulevard are the main streets of the miners' camps. The Tavrulit People's Party wins the most votes, with the Islanders' Voice Patriotic Front second.\nThe benches of the pit, spiralling downwards, are plain to see from planes taking off and landing, like a giant funnel. The miners work two-week rotations, flying to and from the capital, and the island children call the ore that comes out of the pit \"coloured stones\". Students who come to study Qittilik first pull out a compass to watch the needle spin, and the old guides there simply find their way by the sun and the coastline. In summer the prospectors camp on Aqqaukku, their tents in a row looking from afar like a string of coloured buttons sewn onto the grey hillside; and when islanders see a ship lying in Ukkuqalla Bay, they know fresh fruit and milk are on the way."
