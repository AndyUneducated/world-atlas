  names:
    zh: 皮瓦苏瓦区
    en: Pivasuvva District
    art-x-tavrunaq: Pivasuvva
  notes:
    zh: "皮瓦苏瓦区是乌库拉克市东部的峡湾地带，面积 24300 平方公里，7 万人分散在峡湾两岸的村镇，塔夫鲁纳克语母语者占 85%。海拔 1681 米的皮瓦皮鲁克峰俯瞰峡湾，沿海的卡瓦昆纳尔岬向南隔海望见卡瓦卢维特群岛，冬夜在岬上能看到极光从群岛上空升起。渔业和峡湾观光是主要生计，第三产业占近七成，一年日照约 1280 小时，在乌库拉克算是晴朗的地方。西卢阿高速在区内沿峡湾延伸近 290 公里，此前村镇之间只能乘夏季的渡船往来；如今高速把渔获和游客送进送出，图帕克大街、桶匠大道和苏瓦大街是几个大一点的镇上的主街。冬天每年有七十多天极夜，最低纪录零下 38 度。选民里塔夫鲁利特人民党得票约三分之一，长老之道居次。\n峡湾村镇的孩子们放学后常在皮瓦皮鲁克峰脚的坡地上滑雪，冬天村里的灯光沿着峡湾排开，从峰腰望下去像一串项链。卡瓦昆纳尔岬上常有人支着相机等极光，本地人说在这里看极光「像看着它从海上的岛屿那边慢慢走过来」。老人们还记得渡船年代的规矩：最后一班夏季渡船开走前，各家要把过冬的面粉、燃油和药品备齐，如今高速通了，这个习惯仍被叫作「封湾」，每年秋天镇上的商店照样要忙上一阵。"
    en: "Pivasuvva District is the fjord country of eastern Ukkulaaq City, 24,300 km² with 70,000 people scattered among villages on both shores, 85% of them native Tavrunaq speakers. Mount Pivapirruk, 1,681 m, looks down over the fjords, and from Qavvakunnar Point on the coast you can see south across the sea to the Qavvaluviit Islands and, on winter nights, watch the aurora rise over them. Fishing and fjord tourism are the main livelihoods, services make up nearly seven-tenths of the economy, and with about 1,280 hours of sunshine a year it is one of the sunnier places in Ukkulaaq. The Sillua Expressway runs nearly 290 km along the fjords within the district; before it the villages could reach one another only by summer ferry, whereas now the expressway carries catches and visitors in and out, and Tuuppak Boulevard, Cooper Avenue and Suvva Boulevard are the main streets of the larger villages. Winter brings seventy-odd days of polar night and a record low of −38 °C. The Tavrulit People's Party wins about a third of the vote, with the Way of the Elders second.\nAfter school the village children often ski on the slopes at the foot of Mount Pivapirruk, and in winter the village lights strung along the fjord look, from halfway up the mountain, like a necklace. People often set up cameras on Qavvakunnar Point to wait for the aurora, and locals say watching it there is \"like seeing it walk slowly over from the islands out at sea\". The old still remember the rule of the ferry years: before the last summer ferry left, every household had to lay in its flour, fuel and medicine for the winter; now that the expressway is open the custom is still called \"closing the bay\", and every autumn the village shops are as busy as ever."
