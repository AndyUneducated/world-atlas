  notes:
    zh: 雾湾市的中心城区与渔港，锚链山的西坡在这里直落海边，城镇和港口就挤在山海之间狭窄的岸边。锚链山是纵贯锚岛中部的山脉，山脊一道接一道，像一条长长的锚链，从大洋吹来的湿润西风在山前凝结成雾，使雾湾一年中大部分清晨都笼罩在海雾里，港口的雾笛和灯塔昼夜为渔船指引方向。雾湾渔港是锚岛西岸的主要渔港，拖网船和围网船在西岸外海捕捞鳕鱼、鲱鱼和鲭鱼，海产加工厂把渔获冷冻、熏制和腌制，冷藏车经锚雾高速当天运往锚港和长船；近岸的网箱养殖鲑鱼和贻贝，是渔业的另一大来源。外海的海上风电场由雾湾港负责运维，运维船、风机检修和备件仓储为城市带来了新的技术岗位，渔业和风电是全区的两大支柱。雾湾的老城依山而建，彩色的木屋沿陡坡层层排列，石阶小巷连接上下街道，鱼市和海鲜餐馆是游客必到之处。区内老年人比例较高，居民以维京语为母语的家庭居多。锚雾高速和锚岛峡湾公路都在这里交会，雾湾高架桥是锚雾高速上最长的桥梁。雾散之后，港口与山坡一下子清晰起来，是雾湾最动人的时刻。
    en: "The centre and fishing port of Mistbay, where the western slopes of the Anchor Chain Mountains drop straight to the sea and the town and harbour squeeze onto the narrow shore between them. The Anchor Chain Mountains run down the middle of Anchor Island, ridge after ridge like the links of a long anchor chain, and the damp westerlies from the ocean condense into fog against them, so most mornings of the year Mistbay is wrapped in sea fog, and the foghorn and lighthouse guide the boats day and night. Mistbay harbour is the main fishing port on Anchor Island's west coast: trawlers and seiners take cod, herring and mackerel off the coast, processing plants freeze, smoke and salt the catch, and refrigerated lorries carry it along the Anchorhaven–Mistbay Expressway to Anchorhaven and Longship the same day, while net pens close inshore raise salmon and mussels, the other half of the fishing trade. The harbour also services the offshore wind farm, and crew boats, turbine repairs and spare-parts stores have brought new skilled jobs, so fishing and wind are the two mainstays. The old town climbs the hillside in tiers of painted timber houses joined by stone stairways, and the fish market and seafood restaurants are a must for visitors. The share of older people is high and most families speak Viking. The Anchorhaven–Mistbay Expressway and the Anchor Island Fjord Road meet here, and the Mistbay Viaduct is the longest bridge on the expressway. When the fog lifts and the harbour and hillside suddenly appear, Mistbay is at its most beautiful."
