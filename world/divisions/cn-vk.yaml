  notes:
    zh: 松林市唯一的区，囊括了锚岛东北端的林场、山地、冰川和霜岛。区的中心是松湾畔的松林镇，松湾面积两百多平方公里，湾边是锯木厂、木材码头和木结构的小镇，镇上有市政府、医院、学校和一条以木工坊、皮具店和猎人商店为主的老街。镇外是一望无际的松林，林间的伐木道和步道通往铁锚峰，铁锚峰海拔两千零七十多米，是锚岛的最高峰，峰下的锚链冰川是锚岛少有的冰川，夏季有向导带领游客徒步上冰。松湾外的霜岛是一座两百平方公里左右的小岛，岛上苔原、湿地和海鸟栖息地划为霜岛自然保护区，冬季常有海冰和霜雾，是观察北极狐和海鸟的好地方。区内的林场由家庭和合作社经营，护林员、伐木工、锯木厂工人和卡车司机是主要劳动力；森林木屋、狩猎营地和越野滑雪道则为游客服务。居民以维京语为母语的家庭居多，老年人比例较高，村落稀疏，生活节奏缓慢。锚岛纵贯高速和锚岛峡湾公路都在这里终止，运木车和自驾游客是路上最常见的车辆。松林的冬夜漫长寂静，极光常在林海上空舞动。
    en: The only district of Pinewood City, taking in the forest holdings, mountains, glacier and Frost Isle at the north-eastern end of Anchor Island. At its centre is the town of Pinewood on Pine Bay, a bay of more than two hundred square kilometres whose shore is lined with sawmills, timber quays and a small wooden town with the city government, a hospital, schools and an old street of woodworkers, leather shops and hunting outfitters. Beyond the town the pine forest seems endless, and logging tracks and trails lead to Iron Anchor Peak, which at a little over two thousand and seventy metres is the highest point of Anchor Island; the Anchor Chain Glacier below it is one of the island's few glaciers, and in summer guides lead visitors onto the ice. Frost Isle, off Pine Bay, is an island of about two hundred square kilometres whose tundra, wetlands and seabird colonies form the Frost Isle Nature Reserve; sea ice and frost fog are common in winter, and it is a good place to watch arctic foxes and seabirds. The forest holdings are run by families and cooperatives, rangers, loggers, sawmill hands and lorry drivers are the main workforce, and forest cabins, hunting camps and cross-country ski trails serve visitors. Most families speak Viking, the share of older people is high, villages are few and life is slow. The Anchor Island Spine Expressway and the Anchor Island Fjord Road both end here, and log lorries and touring drivers are the commonest traffic. Winter nights in Pinewood are long and silent, and the aurora often dances above the forest.

# ── 暖泉岛 ──
