  notes:
    zh: 西爪岬一带的住宅区、牧场与海岸步道，是阿克斯维克市面积最大、最有田园风光的区。西爪岬是阿克斯岛西侧的锚爪，岬角深入大海，海崖、草坡和沙湾交错，阿克斯维克人周末最喜欢沿着海岸步道徒步，观赏海鸟和日落；区内的佩洛峰海拔一千九百多米，是阿克斯维克附近最高的山峰，登顶可以俯瞰阿克斯维克湾的港口和托克维克湾的海面。区的大部分土地是起伏的牧场，奶牛和绵羊在草坡上放牧，乳品厂生产的黄油、奶酪和酸奶供应阿克斯维克市区，牧场民宿和乡村餐馆为城里人提供周末休闲的去处，乳业和乡村旅游是区里的特色产业。随着阿克斯维克的发展，越来越多的家庭搬到西爪的新住宅区，享受远离港口喧嚣的宁静生活，许多居民每天通勤到阿克斯维克湾和链城上班，儿童比例在全市最高。阿克斯维克湾公路的终点就在区内，向东经阿克斯维克湾通往瑙斯特海姆区。区内居民以维京语为母语的家庭居多，社区氛围亲切。西爪区山海相依、牧场辽阔，是阿克斯维克这座工业港城难得的绿色后院。
    en: Housing, pasture and coastal paths around the West Fluke headland, the largest and most rural district of Akkersvik. West Fluke is the western fluke of Akkersey's anchor, a headland reaching far into the sea where cliffs, grassy slopes and sandy coves alternate, and at weekends Akkersvik people love to walk the coast path watching seabirds and the sunset. Mount Pellow, more than nineteen hundred metres high, is the tallest summit near the city, and from the top you look down on the port in Akkersvik Bay and across the water of Tåkevik Bay. Most of the district is rolling pasture where dairy cows and sheep graze; its creameries supply butter, cheese and yoghurt to the city, and farm guesthouses and country restaurants give townspeople somewhere to spend the weekend, so dairy and rural tourism are its own trades. As the city has grown, more families have moved to West Fluke's new housing for a quiet life away from the docks; many commute to Akkersvik Bay and Chain Town every day, and the share of children is the highest in the city. The Akkersvik Bay Road ends in the district and runs east through Akkersvik Bay to Naustheim. Most families speak Viking and the neighbourhoods are friendly. Between mountain and sea, with wide pastures, West Fluke is the green back garden of this industrial port city.
