    zh: 桅岛北端的港口与城市中心，渔港、跨海高速的服务区和桅顶岬构成了全区的风景，人口约五十万。桅港渔港沿着桅岛海峡的岸边排开，渔船在海峡和周边海域捕捞鳕鱼、鲱鱼和扇贝，鱼市和海产加工厂为岛上提供了大量就业；港外的中流岛和牡蛎岛各有两百多平方公里，牡蛎岛周围的浅湾是群岛著名的牡蛎养殖场，桅港牡蛎肉质饱满，是长船和白帆餐馆的招牌菜，牡蛎节是每年最热闹的节日。渔业、港口和旅游是全区的三大支柱，桅岛跨海高速的服务区和观景台吸引着过境的旅客停留，海鲜餐馆、民宿和游船码头随之兴旺。桅顶岬是桅岛北端伸入海峡的岬角，岬上的灯塔俯瞰着桅岛海峡，跨海长桥从岬旁伸向白帆岛方向，日落时桥影映在海面上，是桅港最美的景色。桅港老城有木结构的渔屋、石砌的教堂和一座小型航海博物馆，讲述着桅木和帆船的历史。居民以维京语为母语的家庭居多，老年人比例较高。桅岛跨海高速从区内穿过，向南跨海通往长船岛船尾和暖泉，向北跨越桅岛海峡通往银鸥；桅岛公路在这里终止。
    en: "The port and town centre at the northern end of Mast Island, where the fishing harbour, the crossing's service area and Masthead Point make the scenery; about half a million people live here. The fishing harbour lines the shore of the Mast Strait, boats work the strait and the waters around for cod, herring and scallops, and the fish market and processing plants give the island many of its jobs. Midstream Isle and Oyster Isle off the port each cover more than two hundred square kilometres, and the shallow bays round Oyster Isle are the islands' famous oyster beds: plump Masthaven oysters are a signature dish in the restaurants of Longship and White Sail, and the oyster festival is the liveliest event of the year. Fishing, the port and tourism are the three mainstays; the service area and lookout on the Mast Island Sea Crossing tempt passing travellers to stay, and seafood restaurants, guesthouses and a pier for boat trips have flourished. Masthead Point is the headland at the island's northern tip, reaching into the strait, and its lighthouse looks out over the Mast Strait; the long sea viaduct reaches out beside it towards White Sail Island, and at sunset the bridge's shadow on the water is Masthaven's finest view. The old town has timber fishing huts, a stone church and a small maritime museum telling the story of mast timber and sailing ships. Most families speak Viking and the share of older people is high. The Mast Island Sea Crossing runs through the district, south over the sea to Longship Island's stern and Warmspring and north across the Mast Strait to Silvergull, and the Mast Island Road ends here."
