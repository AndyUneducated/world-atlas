  notes:
    zh: 长船岛东北端形似船首的一带，船首岬、北岬和北岬湾构成区里的海岸风景。长船国际机场建在北岬的平地上，是维京群岛最大的机场，有航班飞往北维京岛、群岛各岛和世界各地，航空运输和机场服务是区里最大的产业，许多航空公司、货运代理和飞机维修企业在机场周边设立基地。群岛大学是领地最好的大学，主校区坐落在北岬湾畔的山坡上，学生和教师来自世界各地，大学的海洋学、航运和金融专业享有盛誉，科研人员和学生使北岬成为长船最年轻的区之一。区内的住宅区沿海岸和山坡分布，有许多教职工住宅、学生公寓和中产家庭的独栋住宅，北部的山坡上仍有牧羊草场，羊群和机场跑道相映成趣。长船机场高速从古城直达机场，长船西北岸公路从这里出发，沿海岸经西岸区通往潮湾。区内居民来源多元，说中文、维京语、巴克汉姆语和英语的人都很多。北岬是长船面向天空和知识的窗口，船首岬上的观景台可以眺望长船湾和远方的白帆岛。
    en: "The prow-shaped north-eastern tip of Longship Island, where Prow Point, North Cape and North Cape Bay make up the coastline. Longship International Airport, on the flat land of the cape, is the largest airport in the Viking Islands, with flights to North Viking Island, the other islands and the world. Air transport and airport services are the district's biggest trade, and many airlines, freight forwarders and aircraft maintenance firms have bases around the airport. The University of the Islands, the best university in the territory, has its main campus on the hillside above North Cape Bay; its students and staff come from all over the world, and its oceanography, shipping and finance programmes are highly regarded. Researchers and students make North Cape one of the youngest districts in Longship. Housing runs along the coast and the slopes: staff homes, student flats and the detached houses of middle-class families, while sheep still graze the hills in the north, an odd but charming neighbour for the runways. The Longship Airport Expressway runs straight from Old Town to the airport, and the Longship North-West Shore Road starts here and follows the coast through West Shore to Tidebay. Residents come from many backgrounds, and plenty speak Chinese, Viking, Buckham or English. North Cape is Longship's window on the sky and on learning, and from the viewpoint on Prow Point you can see across Longship Bay to White Sail Island."
