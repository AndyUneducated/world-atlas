  notes:
    zh: 锚岛东北端的森林城市，以林业和森林旅游为生，全市只设松林一区。松林面积近一万两千平方公里，人口约五十万，是锚岛地广人稀的北部，大片松林从海岸一直延伸到锚岛最高峰铁锚峰的山脚，林业在经济中的比重在群岛各市中名列前茅。林场世代按照可持续的轮伐制度经营，伐下的松木在锯木厂加工成建材、木板和木屑颗粒，经锚岛纵贯高速运往锚港，再由船运销往群岛各地和海外；过去木材只能靠海运出岛，高速通车后运输变得快捷稳定。森林旅游是松林的新产业，徒步、狩猎、垂钓、越野滑雪和森林木屋吸引着来自锚港和长船的游客，霜岛自然保护区和锚链冰川是最受欢迎的自然景点。居民以维京语为母语的家庭居多，林业家庭世代相传，年轻人多到锚港工作，老年人比例较高。松林是锚岛两条主干道路的终点：锚岛纵贯高速从锚湾出发纵贯全岛到达这里，锚岛峡湾公路则从链城经雾湾沿西岸峡湾绕到松林。松林空气清新、林海无边，是锚岛北部的绿色宝库。
    en: "The forest city at the north-eastern end of Anchor Island, living by forestry and forest tourism, with a single district, Pinewood. It covers nearly twelve thousand square kilometres with only about half a million people, the thinly settled north of Anchor Island, where pine forest stretches from the coast to the foot of Iron Anchor Peak, the island's highest summit, and forestry takes as large a share of output as in almost any city in the islands. The holdings have been worked for generations on a sustainable rotation, and the sawmills turn the pine into building timber, boards and wood pellets, which go by the Anchor Island Spine Expressway to Anchorhaven and on by ship to the rest of the islands and overseas; timber used to leave only by sea, and the expressway has made the haul quick and reliable. Forest tourism is Pinewood's new trade: hiking, hunting, fishing, cross-country skiing and forest cabins draw visitors from Anchorhaven and Longship, and the Frost Isle Nature Reserve and the Anchor Chain Glacier are the favourite natural sights. Most families speak Viking, forestry passes from parent to child, young people tend to leave for jobs in Anchorhaven, and the share of older people is high. Pinewood is the end of Anchor Island's two trunk roads: the Anchor Island Spine Expressway runs here the length of the island from Anchor Bay, and the Anchor Island Fjord Road comes round from Chain Town by way of Mistbay and the west-coast fjords. With its clean air and endless forest, Pinewood is the green treasure house of northern Anchor Island."
