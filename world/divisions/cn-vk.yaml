  flag_notes:
    zh: "旗杆一侧是塔夫鲁纳克滚边，其余青绿色旗面上一条白色鲸尾跃出海面。乌维克库特海峡是座头鲸、虎鲸和小须鲸夏季洄游的通道，鲸尾代表观鲸湾和瓦莱岛的观鲸船，青绿是海峡的海水。市名来自塔夫鲁纳克语，因此和北冰洋、北维京岛的塔夫鲁纳克城镇一样用滚边旗。"
    en: "A Tavrunaq border at the hoist and, on the sea green field, a white whale's tail rising from the waves. Humpbacks, orcas and minke whales pass through the strait every summer: the tail is the whale-watching bay and its boats, the green the water of the strait. The city's name is Tavrunaq, so it flies the same border as the Tavrunaq towns of the Arctic Ocean and North Viking Island."
  traits: { industries: [tourism, fishing], heritage: viking, age: old }
  notes:
    zh: 维京群岛西部的外围岛屿，由瓦莱岛、西基克图克岛、伦达霍尔姆岛和许多小岛组成，以观鲸、海鸟和渔村闻名。全市人口约十三万，分布在瓦莱岛和西基克图克岛沿岸的渔村与小镇里，与群岛主岛之间只靠渡轮相连，岛与岛之间则由一条乌维克库特跨海公路串起，是群岛最偏远的城市之一。乌维克库特海峡和观鲸湾是座头鲸、虎鲸和小须鲸夏季洄游的通道，瓦莱岛的观鲸船和观鲸中心吸引着来自世界各地的游客；西基克图克岛的悬崖上栖息着数十万只海鹦、海雀和三趾鸥，是群岛重要的海鸟繁殖地，大部分划为自然保护区。旅游和渔业是全市的两大支柱，渔民在近海捕捞鳕鱼、鲱鱼和龙虾，鱼干、熏鱼和海鲜罐头是乌维克库特的特产。岛上的生活与海洋和天气息息相关，冬季风暴频繁，渡轮常常停航，居民习惯了自给自足的生活。维京语是乌维克库特最主要的母语，许多家庭世代捕鱼，年轻人多到长船和阿克斯维克工作，留在岛上的以老人为主，老年人比例较高。乌维克库特跨海公路连接瓦莱岛和西基克图克两区，瓦莱渡轮码头有航线通往阿夫琳港、阿克斯维克和长船。乌维克库特风大浪急、天高海阔，是群岛最接近自然的地方。
    en: "The outer islands in the west of the Viking Islands, Hvaley, Siqqiqtuuq Island, Lundaholm and many smaller islets, known for whales, seabirds and fishing villages. About 126,000 people live in the fishing villages and small towns along the shores of Hvaley and Siqqiqtuuq Island. Only ferries link them with the main islands, and a single causeway road strings the islands together, making this one of the most remote cities in the chain. The Uviqkut Strait and Whalewatch Bay are summer migration routes for humpback, orca and minke whales, and the whale-watching boats and whale centre on Hvaley draw visitors from around the world. On the cliffs of Siqqiqtuuq Island hundreds of thousands of puffins, guillemots and kittiwakes nest in one of the islands' great seabird colonies, most of it a nature reserve. Tourism and fishing are the two mainstays: fishermen take cod, herring and lobster close to shore, and dried fish, smoked fish and canned seafood are the islands' specialities. Life follows the sea and the weather; winter storms are frequent, the ferries often stop, and people are used to fending for themselves. Viking is the most common first language and many families have fished for generations; young people tend to leave for jobs in Longship and Akkersvik, those who stay are mostly older, and the share of elderly people is high. The causeway joins the Hvaley and Siqqiqtuuq districts, and ferries from the Hvaley terminal sail to Port Aveline, Akkersvik and Longship. Windswept and wide open to sky and sea, the Uviqkut are the closest the islands come to untouched nature."
