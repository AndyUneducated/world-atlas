  flag_notes:
    zh: "蓝底上三块白色的盐晶，排成三角。萨尔塔维克在维京语里意为「盐湾」，三块盐晶代表海湾里成片的盐田和自维京时代传下来的日晒与熬煮制盐法；蓝色是清澈的海水，也是湾外那片海上风电场所在的海面。萨尔塔维克海盐的包装上至今印着这三块盐。"
    en: "Three white salt crystals in a triangle on blue. Saltavik means 'salt bay' in Viking: the crystals are the salt pans of the bay and the sun-drying and boiling handed down from Viking times, the blue the clear water and the sea where the offshore wind farm now stands. Packets of Saltavik sea salt still carry the three crystals."
  traits: { industries: [salt, wind, fishing], heritage: viking, age: old }
  notes:
    zh: 阿夫琳岛东南岸的海盐与海上风电城市，全市人口约四十五万，下设萨尔塔维克和菲斯克海姆两区。萨尔塔维克在维京语里意为「盐湾」，因海湾里成片的盐田而得名，这里海水清澈、风大日照足，自维京时代起就以日晒和熬煮法生产海盐，萨尔塔维克海盐至今仍是群岛最有名的特产之一，盐田、盐仓和制盐作坊构成了独特的海岸风景。近年来，萨尔塔维克湾外海建成了大型海上风电场，数百台风机矗立在海面上，为阿夫琳岛和长船岛供应电力，风电运维港和风机维修基地为城市带来了新的产业和就业；菲斯克海姆区则以渔业和冷链加工为主，渔获通过阿夫琳纵贯高速运往阿夫琳港和长船。海盐、风电和渔业是全市的三大支柱，第一、第二产业比重明显高于群岛平均水平。居民以维京语为母语的家庭居多，许多家庭世代晒盐捕鱼，年轻人有不少进入风电行业，但整体老年人比例仍然较高。阿夫琳纵贯高速从市内穿过，向北通往阿夫琳港，向南通往莫塞；萨尔塔维克海滨公路沿海岸连接菲斯克海姆、萨尔塔维克和望海。萨尔塔维克的海岸线上，古老的盐田与现代的风机交相辉映，是群岛传统与新能源相结合的缩影。
    en: The sea-salt and offshore-wind city on the south-east coast of Aveline Island, home to about 450,000 people in two districts, Saltavik and Fiskheim. Saltavik, salt bay in Viking, is named for the salt pans that cover its bay. The water is clear, the wind strong and the sun plentiful, and salt has been made here since Viking times by evaporation in the sun and by boiling; Saltavik sea salt is still one of the islands' best-known products, and salt pans, salt stores and salt workshops give the shore its own look. A large offshore wind farm has been built off the bay, hundreds of turbines standing in the sea and supplying power to Port Aveline and Longship islands, and the wind service port and turbine repair base have brought new industry and jobs. Fiskheim lives by fishing and cold-chain processing, and its catch travels by the Aveline Spine Expressway to Port Aveline harbour and Longship. Salt, wind and fishing are the three mainstays, and farming, fishing and industry take a clearly larger share of output than the island average. Most families speak Viking; many have made salt and fished for generations, and while plenty of young people have gone into the wind industry, the share of older people is still high. The Aveline Spine Expressway runs through the city, north to Port Aveline and south to Måsey, and the Saltavik Coast Road links Fiskheim, Saltavik and Seawatch along the shore. Along Saltavik's coast, old salt pans and modern turbines stand side by side, a picture of the islands' tradition meeting their new energy.
