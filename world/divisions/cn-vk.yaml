  notes:
    zh: 锚岛西岸的雾港城市，常年多雾，以渔业、海产养殖、海上风电和峡湾旅游为生，下设雾湾和峡湾两区。城市因海湾常年笼罩在海雾中而得名，湿润的西风从大洋吹来，在锚链山前凝成浓雾，清晨的港口常常只能听见雾笛和渔船的马达声。全市人口约九十万，面积一万两千多平方公里，大部分是锚链山的山地和西岸深切的峡湾。雾湾区是城市的中心和渔港，渔船在西岸外海捕捞鳕鱼、鲱鱼和鲭鱼，峡湾里的网箱养殖鲑鱼和贻贝，海产加工和冷链运输是传统支柱；近年外海建起了海上风电场，风电运维成为新的增长点。峡湾区则是深切的峡湾、瀑布和森林，峡湾观光和林业是那里的主要产业。由于山多地少、交通曾经不便，许多年轻人外出工作，全市老年人比例在群岛位居前列，居民以维京语为母语的家庭居多。锚雾高速从锚港链城区出发，以隧道穿过锚链山主脊，经峡湾区到雾湾，是西岸通往锚港的快速通道；锚岛峡湾公路则从链城经雾湾沿峡湾北上通往松林。雾湾雾中藏港、峡湾深邃，是锚岛最有神秘气息的城市。
    en: "The fog-bound port city on the west coast of Anchor Island, living by fishing, fish farming, offshore wind and fjord tourism, with two districts, Mistbay and Fjord. The city is named for the sea fog that hangs over its bay most of the year: damp westerlies off the ocean condense into thick fog against the Anchor Chain Mountains, and on many mornings all you can hear in the harbour is the foghorn and the engines of fishing boats. About nine hundred thousand people live here, in more than twelve thousand square kilometres made up mostly of the Anchor Chain Mountains and the deep fjords of the west coast. Mistbay District is the centre and fishing port: boats take cod, herring and mackerel off the west coast, net pens in the fjords raise salmon and mussels, and seafood processing and cold-chain haulage are the traditional mainstays, while a wind farm built offshore in recent times has made turbine maintenance a new source of growth. Fjord District is deep fjords, waterfalls and forest, living by fjord tourism and forestry. Mountains are many, flat land scarce and the roads were long poor, so many young people have left; the share of older people is among the highest in the islands, and most families speak Viking. The Anchorhaven–Mistbay Expressway starts from Chain Town in Anchorhaven, tunnels under the main ridge of the Anchor Chain Mountains and runs through Fjord District to Mistbay, the fast road between the west coast and Anchorhaven, and the Anchor Island Fjord Road runs from Chain Town through Mistbay and north along the fjords to Pinewood. With a harbour hidden in fog and deep fjords behind it, Mistbay is the most mysterious-feeling city on Anchor Island."
