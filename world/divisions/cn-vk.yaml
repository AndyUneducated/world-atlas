  notes:
    zh: 桅岛上的港口城市，坐落在暖泉岛与白帆岛之间的海面上，以渔业、旅游和港口为生，下设桅港和南桅两区。桅岛面积近六千平方公里，岛上长满笔直高大的松树，这些松木过去是造船桅杆的上等材料，桅岛和桅港也因此得名。全市人口约七十万，北端的桅港区是城市中心和港口，渔船在桅岛海峡和周边海域捕捞鳕鱼、鲱鱼和贝类，牡蛎岛一带的牡蛎养殖远近闻名；南端的南桅区则是松林、牧场和乳品农场，林业、乳业和森林旅游是那里的主要生计。桅岛跨海高速通车后，桅岛从一个偏远小岛变成暖泉岛与白帆岛之间跨海通道的中转站，岛上建起了服务区和观景台，过境旅游和物流随之兴起，港口与旅游成为城市新的支柱。由于岛上就业机会有限，许多年轻人到长船和白帆工作，全市老年人比例较高，居民以维京语为母语的家庭居多。桅岛跨海高速自暖泉经暖河和长船岛船尾跨海到桅港，再跨越桅岛海峡到白帆岛的银鸥，两段海上长桥以桅岛为中间支点；桅岛公路穿过松林连接南桅与桅港，是岛上最有名的风景路线。桅港海风清爽、松涛阵阵，是跨海旅途中让人愿意停下脚步的海岛。
    en: "The port city of Mast Island, set in the sea between Warmspring and White Sail islands, living by fishing, tourism and the port, with two districts, Masthaven and South Mast. Mast Island covers nearly six thousand square kilometres and is covered with tall, straight pines that were once prized for ships' masts, which gave the island and its port their names. About seven hundred thousand people live here. Masthaven District at the northern end is the centre and port: boats take cod, herring and shellfish in the Mast Strait and the waters around, and the oysters farmed around Oyster Isle are known far and wide. South Mast at the southern end is pine forest, pasture and dairy farms, living by forestry, dairy and forest tourism. Since the Mast Island Sea Crossing opened, Mast Island has gone from a remote outpost to a stop on the crossing between Warmspring and White Sail, with a service area and lookout on the island, and through-tourism and logistics have grown, making the port and tourism the city's new mainstays. Jobs on the island are few, so many young people leave for Longship and White Sail; the share of older people is high and most families speak Viking. The Mast Island Sea Crossing runs from Warmspring through Warm River and Longship Island's stern over the sea to Masthaven, then across the Mast Strait to Silvergull on White Sail Island, its two long sea viaducts resting on Mast Island in the middle, and the Mast Island Road runs through the pines between South Mast and Masthaven, the island's best-known scenic drive. With its fresh sea wind and the sound of the pines, Masthaven is the island where travellers on the crossing are glad to stop."
