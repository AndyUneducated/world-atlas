  population: 800000
  area_km2: 4950.0
  traits: { industries: [port, food, residential], age: young }
  notes:
    zh: 暖河河口的港口新区与水产加工基地，是暖泉市最年轻、发展最快的区。暖河从暖泉岛的高地流下，河水因流经地热区而常年不冻，河口的港口冬季也能正常通航，是暖泉岛最重要的货运港和渔港，渔船把鳕鱼、鲑鱼、虾和贝类送到港区的水产加工厂，经冷冻、熏制和罐装后销往群岛和海外，食品加工业是区里最大的雇主。港口还承担着暖泉全岛的燃料、建材和日用品进口，物流和港口服务提供了大量就业。为了吸引年轻劳动力，暖河区规划建设了成片的新住宅区，配有学校、医院和商业中心，房价合理，吸引了大批来自群岛各地的年轻家庭，儿童比例在全市最高，与以疗养和养老为主的温泉区形成鲜明对比。暖河高速从这里通往温泉区和暖泉机场。区内居民来源多元，以中文、维京语和巴克汉姆语为母语的家庭混居，社区活动丰富。暖河两岸修建了滨河公园和步道，冬季河面上蒸汽升腾，与岸边的积雪相映成趣，是暖河独特的景观。暖河区年轻而有活力，代表着暖泉的未来。
    en: "The new port district and seafood-processing base at the mouth of the Warm River, Warmspring's youngest and fastest-growing district. The Warm River runs down from the island's high ground and, because it flows through geothermal ground, never freezes, so the port at its mouth stays open all winter. It is the island's most important cargo and fishing port: boats land cod, salmon, shrimp and shellfish at the processing plants, which freeze, smoke and can them for the islands and overseas, and food processing is the district's biggest employer. The port also brings in fuel, building materials and everyday goods for the whole island, and logistics and port services provide many jobs. To attract young workers the district planned new housing estates with schools, a hospital and a shopping centre at sensible prices, and young families have come from across the islands; the share of children is the highest in the city, a sharp contrast with health-resort Hot Springs. The Warm River Expressway runs from here to Hot Springs and Warmspring Airport. Residents come from many backgrounds, with Chinese-, Viking- and Buckham-speaking families side by side, and community life is busy. Riverside parks and paths line both banks, and in winter steam rises from the river beside the snowy banks, the district's own particular sight. Young and lively, Warm River is Warmspring's future."
