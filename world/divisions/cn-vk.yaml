  notes:
    zh: 龙骨山东北麓直到两岸长滩的郊区，面积是长船市各区中最大的，农场、高尔夫球场与新住宅区交错分布。区名得自东西两岸绵长的沙滩，夏季是长船市民最喜欢的海滨去处，海水浴场、冲浪学校和海滨餐馆沿沙滩排开。区的内陆部分是龙骨山麓的丘陵和谷地，家庭农场种植蔬菜、草莓和饲草，为长船都市区提供新鲜农产品，周末有许多城里人到农场采摘；几座高尔夫球场依山傍海，是商务人士休闲的地方。随着长船人口的增长，新住宅区不断向这里扩展，独栋住宅和低层公寓吸引着向往郊区生活的家庭，居住服务、农业和旅游是区里的主要产业。龙骨山公路的终点就在区内，向西南经龙骨、舵港通往船尾，是长船岛南北之间的重要通道。区内居民来源多元，以中文、维京语和巴克汉姆语为母语的家庭混居，许多居民在城区上班，周末则享受田园和海滩。长滩区兼具城市便利和乡村宁静，是长船最有田园风光的地方。
    en: The suburbs running from the north-eastern foot of the Keel Hills to the long beaches on both shores. Longbeach is the largest district of Longship by area, a patchwork of farms, golf courses and new housing. The district is named for the long sands on its east and west coasts, Longship people's favourite summer seaside, lined with bathing beaches, surf schools and beach restaurants. Inland lie the hills and valleys at the foot of the Keel Hills, where family farms grow vegetables, strawberries and fodder for the Longship area, and many townspeople come out at weekends to pick their own. Several golf courses sit between the hills and the sea, where business people unwind. As Longship has grown, new housing has spread out here, and detached houses and low-rise flats attract families who want a suburban life, so residential services, farming and tourism are the main trades. The Keel Hills Road ends in the district and runs south-west through Keel and Rudderhaven to Stern, an important link between the north and south of Longship Island. Residents come from many backgrounds, with Chinese-, Viking- and Buckham-speaking families side by side; many work in the city and spend their weekends in the countryside or on the beach. Combining city convenience with country calm, Longbeach is the most rural corner of Longship.
