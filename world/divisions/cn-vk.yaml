    zh: 帆影岭东麓的住宅区、果园与观景山道，是白帆市面积最大的区。区内的地势从海岸向帆影岭缓缓抬升，山坡上种满了苹果、梨和樱桃，春季果花盛开，秋季果实累累，果园采摘和果酒作坊吸引着城里人周末前来；山麓的谷地里分布着家庭农场和牧场，为白帆提供蔬菜、奶制品和肉类。随着白帆城区的扩展，越来越多的家庭搬到望海的新住宅区，享受山海之间的宁静生活，居住服务、农业和乡村旅游是区里的主要产业。帆影垭口是翻越帆影岭的山口，观景山道盘旋而上，垭口的观景台可以眺望白帆港、长船岛和远处的群岛，晴天时甚至能看到北维京岛的山影，是白帆最受欢迎的观景点。盐湾海滨公路的终点就在区内，向南经盐湾通往渔港。区内居民来源多元，以中文、维京语和巴克汉姆语为母语的家庭混居，年轻家庭和退休人员都不少。望海区山海相依、四季分明，是白帆人心中的后花园。
    en: Housing, orchards and scenic mountain roads on the eastern slopes of Sailshadow Ridge, and the largest district of White Sail by area. The land rises gently from the coast towards the ridge. The slopes are planted with apples, pears and cherries, white with blossom in spring and heavy with fruit in autumn, and pick-your-own orchards and cider workshops bring townspeople out at weekends. Family farms and pastures fill the valleys at the foot of the hills, supplying White Sail with vegetables, dairy and meat. As the city has grown, more and more families have moved to Seawatch's new housing for a quiet life between the mountains and the sea, so residential services, farming and rural tourism are the main trades. The Sailshadow Saddle is the pass over the ridge; a scenic road winds up to the viewpoint at the top, which looks out over White Sail harbour, Longship Island and the islands beyond, and on clear days even the mountains of North Viking Island, White Sail's most popular viewpoint. The Salt Bay Coast Road ends in the district and runs south through Saltbay to Fishing Harbour. Residents come from many backgrounds, with Chinese-, Viking- and Buckham-speaking families side by side and plenty of both young families and retirees. Between mountain and sea, with four distinct seasons, Seawatch is White Sail's back garden.
