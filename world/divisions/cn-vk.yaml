  notes:
    zh: 硫磺湾市唯一的区，海湾、地热田、温室和灰河谷地构成了全区的风景。硫磺湾面积近三百平方公里，湾边的地热田里喷气孔冒着白色的蒸汽，泥火山咕嘟作响，岩石被硫磺染成黄色和橙色，地热步道和观景台让游客可以安全地近距离观看；地热电站和地热井分布在热田周围，电站排出的温水汇入海边的露天温泉浴场，是当地人冬天最喜欢的去处。温室区沿着地热管道成片排列，玻璃温室在冬季的黑夜里亮着补光灯，从远处看像一片发光的湖面，温室工人、农艺师和包装工是区里最主要的劳动力，蔬果每天清晨装车运往群岛各地。灰河发源于暖泉火山的南坡，全长一百多公里，河水带着火山灰呈灰白色，流经硫磺湾的谷地后入海，河口外的灰岛是一座由火山灰堆积而成的小岛，岛上是海鸟和海豹的栖息地。区内的居民区围绕温室和电站分布，学校、诊所和商店齐全，年轻家庭较多，居民以维京语为母语的家庭居多。群岛跨海高速、暖泉南环高速和暖泉环山公路都经过区内，硫磺湾高架桥是暖泉南环高速上最长的桥梁。硫磺湾的蒸汽、温室和温泉，是暖泉岛火山之力的最好见证。
    en: The only district of Sulphur Bay City, its scenery made of the bay, the geothermal field, the greenhouses and the valley of the Ash River. Sulphur Bay covers nearly three hundred square kilometres; on the geothermal field by the shore fumaroles send up white steam, mud pots bubble and the rocks are stained yellow and orange with sulphur, and walkways and viewing platforms let visitors come close in safety. The power station and wells are spread around the field, and warm water from the plant feeds an open-air bathing lagoon by the sea, the locals' favourite place in winter. The greenhouses stand in rows along the heating mains, their grow-lights shining through the winter dark so that from afar they look like a glowing lake; greenhouse workers, agronomists and packers are the main workforce, and every morning the produce is loaded for the rest of the islands. The Ash River rises on the southern slopes of Warmspring Volcano and runs for more than a hundred kilometres, grey-white with volcanic ash, through the Sulphur Bay valley to the sea, and Ash Isle off its mouth is a small island built of volcanic ash, home to seabirds and seals. Housing clusters round the greenhouses and the power station with schools, a clinic and shops, young families are many, and most speak Viking. The Island Chain Expressway, the Warmspring Southern Arc Expressway and the Warmspring Volcano Road all cross the district, and the Sulphur Bay Viaduct is the longest bridge on the Southern Arc. Steam, glasshouses and hot pools make Sulphur Bay the best witness to the power of Warmspring's volcano.
