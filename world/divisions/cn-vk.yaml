  notes:
    zh: 白帆市的海上门户，邮轮码头、免税商业街与渡轮枢纽集中在帆港湾畔。白帆邮轮母港拥有多个超大型邮轮泊位，夏季高峰时一天可以同时停靠四五艘邮轮，上万名游客从这里登岸游览白帆和周边岛屿，或者从这里出发开始群岛巡游；渡轮枢纽有航线通往长船、暖泉、桅港和外屿，是白帆岛与群岛各岛之间最繁忙的客运码头。白帆免税城是群岛最大的免税购物中心，奢侈品、手表、香水、烟酒和本地特产琳琅满目，码头背后的免税商业街上酒店、餐厅和咖啡馆鳞次栉比，邮轮、零售和港口服务是区里的全部经济。区内居民大多在码头、商店和酒店工作，劳动年龄人口比例很高，邮轮季节性明显，夏季人手紧张，冬季则相对安静。帆港邮轮高速从这里出发，连接帆城区的白帆机场，白帆灯塔公路则沿海岸通往灯塔区。帆港湾的海滨长廊是观赏邮轮进出港和日落的好地方，每当巨轮鸣笛起航，岸边总有人挥手送别。帆港热闹、繁忙，是白帆最具国际色彩的地方。
    en: "White Sail's gateway by sea, where the cruise terminal, the duty-free shopping streets and the ferry hub are gathered on Sail Harbour Bay. The White Sail Cruise Port has several berths for the largest cruise ships; at the summer peak four or five can be alongside on the same day, and tens of thousands of passengers come ashore to see White Sail and the islands nearby, or set off from here on an island cruise. The ferry hub has routes to Longship, Warmspring, Masthaven and the Outer Isles and is the busiest passenger terminal between White Sail Island and the rest of the chain. The White Sail Duty-Free Mall is the largest duty-free centre in the islands, full of luxury goods, watches, perfume, spirits and local specialities, and the duty-free street behind the terminal is lined with hotels, restaurants and cafés; cruises, retail and port services are the district's whole economy. Most residents work at the terminal, in shops and in hotels, the share of working-age adults is high, and the cruise season sets the pace: short of hands in summer, quieter in winter. The Sail Harbour Cruise Expressway starts here and links White Sail Airport in Sail Town, and the White Sail Lighthouse Road follows the coast to Lighthouse. The promenade on Sail Harbour Bay is a fine place to watch the cruise ships come and go and the sun go down, and whenever a great ship sounds its horn and sails, people on the shore wave it off. Lively and busy, Sail Harbour is the most international corner of White Sail."
