  notes:
    zh: 盐湾畔的海盐场与海上风电运维港，是盐湾市的中心城区。盐湾沿岸铺开数十平方公里的盐田，夏季阳光下盐田像一面面镜子，盐工用木耙把结晶的海盐收拢成白色的盐堆，传统的熬盐作坊用柴火熬煮出片状的「盐湾花盐」，是群岛餐桌上的珍品，也是游客必买的特产；盐田旁的海盐博物馆讲述着盐湾千百年的制盐历史。盐湾港是海上风电场的运维基地，运维船每天载着技术人员出海检修风机，港区的风机叶片维修厂和备件仓库提供了大量技术岗位，海上风电成为盐湾经济增长最快的部分。望海峰矗立在区的西侧，海拔近一千五百米，是帆影岭南段的高峰，登顶可以俯瞰盐田、风电场和白帆岛东南的海岸线。盐湾市政府、医院和学校集中在盐湾镇，镇上的老街保留着盐商的石砌宅院。盐湾海滨公路从区内穿过，北接望海区，南通渔港区；白帆纵贯高速也从城郊经过，盐湾高架桥是全线最长的桥梁。居民以维京语为母语，盐工和风电技术员的家庭在这里比邻而居，老年人比例较高。盐湾的盐和风，承载着这座小城的过去与未来。
    en: "The salt works and offshore-wind service port on Salt Bay, and the urban centre of Saltbay City. Tens of square kilometres of salt pans spread along the shore; in summer sun they shine like mirrors, salt workers rake the crystals into white heaps, and traditional saltworks boil the brine over wood fires into the flaky Saltbay salt prized on island tables and bought by every visitor. The salt museum beside the pans tells the story of salt-making on the bay down the centuries. Saltbay harbour is the service base for the wind farm: crew boats take technicians out every day to maintain the turbines, and the blade repair works and spare-parts stores on the quay provide many skilled jobs, making offshore wind the fastest-growing part of the economy. Seawatch Peak rises nearly fifteen hundred metres on the district's western side, a high point of the southern ridge, and from the top you look down on the salt pans, the wind farm and the south-eastern coast of White Sail Island. The city government, hospital and schools are in the town of Saltbay, whose old street keeps the stone houses of the salt merchants. The Salt Bay Coast Road crosses the district, north to Seawatch and south to Fishing Harbour, and the White Sail Spine Expressway passes the edge of town on the Saltbay Viaduct, its longest bridge. Residents speak Viking at home, salt workers' and wind technicians' families live next door to one another, and the share of older people is high. Salt and wind carry this small city's past and its future."
