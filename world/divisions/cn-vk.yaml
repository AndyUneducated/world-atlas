  flag_notes:
    zh: "黑底上五根高低不齐的金色玄武岩柱。克莱特斯塔德在维京语里意为「岩城」，港口建在暖泉火山熔岩冷却成的玄武岩台地和海崖上，岩柱代表采石场与坚硬的岩岸，黑色是火山岩，金色是火山周围出产的石料、浮石和硅藻土带来的财富。"
    en: "Five gold basalt columns of uneven height on black. Klettstad means 'rock town' in Viking: its harbour lies on the basalt terraces and sea cliffs left by the volcano's lava, so the columns are the quarries and the hard shore, the black the volcanic rock and the gold the wealth of the stone, pumice and diatomite mined around it."
  traits: { industries: [mining, geothermal, port], heritage: viking, age: balanced }
  notes:
    zh: 暖泉岛西岸的矿业与地热港城，坐落在暖泉火山西麓，下设克莱特斯塔德和落日两区。克莱特斯塔德在维京语里意为「岩城」，城市因港口建在坚硬的火山岩岸上而得名，暖泉火山的熔岩在西岸冷却成玄武岩台地和海崖，克莱特斯塔德就在台地边的天然深水湾里。全市人口约四十万，经济以采矿、地热和港口为核心：火山周围出产玄武岩石料、浮石、火山渣和硅藻土，采石场和加工厂把它们制成建材、过滤材料和保温材料，经克莱特斯塔德码头运往群岛各地和海外；地热电站利用火山深处的热能发电，克莱特斯塔德是暖泉岛的能源基地。第二产业在全市经济中的比重在群岛各市中最高，矿工、地热工程师、码头工人和机械技工构成了城市的主体，劳动年龄人口比例较高。落日区则是西岸的渔村和观景地，以落日岬的日落闻名。居民以维京语为母语的家庭居多。克莱特斯塔德是暖泉岛两条高速的西端：群岛跨海高速从这里出发，经火山北侧横贯暖泉岛跨海通往长船；暖泉南环高速沿火山南麓经新特雷曼、斯瓦特桑德通往温泉区；暖泉环山公路也经克莱特斯塔德通往落日。火口峰是暖泉火山的主峰，也是全岛最高点，峰顶的暖泉冰帽终年不化。克莱特斯塔德坚硬朴实，是暖泉岛的工业脊梁。
    en: "The mining and geothermal port city on the west coast of Warmspring Island, on the western slopes of Warmspring Volcano, with two districts, Klettstad and Sunset. Its name, rock town in Viking, comes from a harbour set in hard volcanic rock: the volcano's lava cooled on the west coast into basalt terraces and sea cliffs, and Klettstad lies in a natural deep-water bay at the edge of the terraces. About four hundred thousand people live here, and mining, geothermal power and the port are the core of the economy. The country round the volcano yields basalt, pumice, cinder and diatomite, which quarries and plants turn into building materials, filter media and insulation, shipped from Klettstad's quays to the islands and overseas, while geothermal power stations draw on the heat deep in the volcano, making Klettstad Warmspring Island's energy base. Industry takes a larger share of output here than in any other city in the islands; miners, geothermal engineers, dockers and mechanics are the heart of the city, and the share of working-age adults is high. Sunset District is fishing villages and lookouts on the west coast, famous for the sunsets at Sunset Point. Most families speak Viking. Klettstad is the western end of Warmspring Island's two expressways: the Island Chain Expressway starts here and crosses the island north of the volcano before going over the sea to Longship, and the Warmspring Southern Arc Expressway follows the volcano's southern foot through Tremaine Bay and Svartsand to Hot Springs; the Warmspring Volcano Road also runs through Klettstad to Sunset. Crater Peak is the volcano's main summit and the island's highest point, crowned by the Warmspring ice cap that never melts. Hard-edged and plain, Klettstad is the industrial backbone of Warmspring Island."
