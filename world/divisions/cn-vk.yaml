  notes:
    zh: 暖泉火山脚下的温泉度假区，温泉酒店、疗养院与会议度假村沿温泉湾和山坡排开，是暖泉市的中心城区。暖泉温泉度假村是群岛规模最大的温泉度假村，拥有数十个露天温泉池，泉水温度从三十多度到七十多度不等，富含硫磺和矿物质，冬季游客泡在热气蒸腾的池中仰望极光，是群岛最经典的旅游画面。区内的疗养院和康复中心利用温泉水和地热进行风湿、皮肤病和运动损伤的治疗，来自群岛和北维京岛的疗养者常年在此休养，医疗和疗养是与旅游并重的产业；会议度假村则承办群岛的商务会议、学术研讨和企业年会，会议旅游在淡季为酒店带来客源。暖泉机场位于区的北部，有航班通往长船、维京港和群岛各岛。暖河高速从这里出发，通往暖河区的港口，暖泉环山公路则从温泉区出发，环绕暖泉火山经斯瓦特桑德、新特雷曼和克莱特斯塔德通往落日。温泉岬和温泉湾构成区里的海岸风景。区内居民多在酒店、疗养院和服务业工作，老年人比例较高。温泉区温暖而悠闲，是暖泉最繁华的地方。
    en: The hot-spring resort district at the foot of the Warmspring Volcano, where spa hotels, sanatoriums and conference resorts line Hot Springs Bay and the slopes; it is Warmspring's central district. The Warmspring Spa Resort is the largest in the islands, with dozens of open-air pools whose water ranges from the low thirties to over seventy degrees and is rich in sulphur and minerals; in winter, guests soak in the steaming pools and gaze up at the aurora, the classic image of the islands. Sanatoriums and rehabilitation centres use the spring water and geothermal heat to treat rheumatism, skin conditions and sports injuries, convalescents from the islands and North Viking Island stay here all year, and health cures are as important as tourism. Conference resorts host business meetings, academic seminars and company retreats, and conference trade fills the hotels in the off season. Warmspring Airport lies in the north of the district, with flights to Longship, Viking Port and the other islands. The Warm River Expressway starts here and runs to the port at Warm River, and the Warmspring Volcano Road sets off from Hot Springs and circles the volcano through Svartsand, Tremaine Bay and Klettstad to Sunset. Hot Springs Point and Hot Springs Bay make up the district's coast. Most residents work in hotels, sanatoriums and services, and the share of older people is high. Warm and unhurried, Hot Springs is the liveliest part of Warmspring.
