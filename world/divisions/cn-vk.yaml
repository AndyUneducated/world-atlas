  notes:
    zh: 舵港市的中心城区与渡轮码头，人口约九十万，是全市的行政、商业和交通中心。舵港老城沿港湾和舵峰山坡展开，彩色木屋和石砌仓库层层叠叠，港口边的鱼市、海员酒馆和航海博物馆保留着港城的风情，舵峰海拔近千米，登顶可以俯瞰三岛交汇的水道和往来的渡轮。舵港渡轮码头是群岛中部最繁忙的客运码头，渡轮每天多班往返暖泉岛和白帆岛；货运码头和物流园负责长船岛南部的货物进出，港口、商贸和物流是区里的支柱。舵港市政府、医院、学校和商业街集中在老城附近，为全市居民服务。区内也是群岛高速公路网的交汇点，群岛跨海高速、长船西岸高速和锚舵跨海高速在城郊交会，龙骨山公路纵贯城区，北通龙骨和长滩，南达船尾。居民以维京语为母语的家庭居多，船员、码头工人、渡轮职员和商户构成了社区的主体。舵港的码头一年四季都很热闹，渡轮的汽笛、海鸥的鸣叫和鱼市的吆喝声交织成港城独特的声音。
    en: "The city centre and ferry port of Rudderhaven, home to about nine hundred thousand people and the city's centre of government, business and transport. The old town climbs along the harbour and up the slopes of Rudder Peak in tiers of painted timber houses and stone warehouses, and the fish market, seamen's taverns and maritime museum by the quay keep the atmosphere of a harbour town. Rudder Peak rises almost a thousand metres, and from the top you look down on the waters where three islands meet and the ferries criss-crossing them. The Rudderhaven ferry terminal is the busiest passenger terminal in the middle of the islands, with ferries several times a day to Warmspring and White Sail, while the cargo quays and logistics parks handle goods for the south of Longship Island; the port, trade and logistics are the mainstays. The city government, the hospital, schools and the shopping streets are grouped near the old town and serve the whole city. The district is also a junction of the islands' expressway network: the Island Chain Expressway, the Longship West Shore Expressway and the Anchor–Rudder Sea Crossing meet on its outskirts, and the Keel Hills Road runs through the town, north to Keel and Longbeach and south to Stern. Most families speak Viking, and seafarers, dockers, ferry crews and shopkeepers are the core of the community. The quays are busy all year, and ferry horns, gulls and the cries of the fish market blend into the harbour town's own sound."
