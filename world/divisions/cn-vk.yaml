    en: An archipelago off the south-west of North Viking Island, four large islands (Longship, Aveline, Akkersey and Warmspring) and more than thirty smaller ones. Shipping and shipbuilding, offshore finance and head offices, offshore wind and geothermal power, fishing and cruise tourism keep the islands going; the capital, Longship, is the most populous city.

# ── 长船岛 ──
- id: div_3cvg2q
