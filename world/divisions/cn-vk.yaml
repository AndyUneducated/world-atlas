  notes:
    zh: 群岛西北外海的渔业城市，以鳕岛和孤礁岛组成，以捕鱼和风干鳕鱼闻名，全市只设鳕港一区。鳕岛面积三千多平方公里，周围的冷水海域是鳕鱼的产卵场和洄游通道，每年冬末春初鳕鱼汛期，渔船倾巢而出，鳕港的海边排满了成片的鱼干架，鳕鱼在海风中自然风干数月，制成群岛最著名的特产风干鳕鱼。渔业和食品加工是全市经济的绝对支柱，第一产业在经济中的比重在群岛各市中最高，鱼干厂、腌鱼厂、鱼油厂和冷库为岛上提供了大部分就业，风干鳕鱼销往长船和海外市场。全市人口约三十万，许多家庭世代捕鱼晒鱼，渔民、鱼干工人和冷链司机是城市的主体；由于岛上生活艰苦、季节性强，年轻人多到锚岛和长船工作，老年人比例较高，居民以维京语为母语的家庭居多。孤礁岛位于鳕岛外海，是一座孤立的礁岛，岛上有灯塔和海鸟栖息地。鳕岛的对外交通依靠东岸的鳕港渡轮码头，渡轮往返锚岛的松林；鳕岛公路自鳕港镇的鱼干架旁出发，横穿鳕岛到达渡轮码头，路面按冷藏货车标准修建，码头旁建有冷库和鱼货集散站。鳕港的鱼干架和海风，是群岛渔业传统最鲜明的象征。
    en: A fishing city in the open sea north-west of the chain, made up of Cod Island and Lone Reef Isle and famous for its fishing and its stockfish, with a single district, Codhaven. Cod Island covers more than three thousand square kilometres, and the cold waters around it are a spawning ground and migration route for cod. In the cod season at the end of winter and the start of spring the whole fleet goes out, the shore at Codhaven fills with drying racks, and the cod dry in the sea wind for months to become stockfish, the islands' most famous product. Fishing and food processing are the overwhelming mainstay; farming and fishing take a larger share of output than in any other city in the islands, stockfish plants, salting houses, a fish-oil works and cold stores provide most of the island's jobs, and the stockfish sells in Longship and overseas. About 300,000 people live here. Many families have fished and dried fish for generations, and fishermen, drying-yard workers and refrigerated-lorry drivers make up the heart of the city; life on the island is hard and seasonal, so young people tend to leave for Anchor Island and Longship, the share of older people is high, and most families speak Viking. Lone Reef Isle, offshore from Cod Island, is an isolated reef island with a lighthouse and seabird colonies. Cod Island depends on the Codhaven Ferry Terminal on its east coast, with ferries to Pinewood on Anchor Island, and the Cod Island Road runs from beside the drying racks of Codhaven town across the island to the terminal, built for refrigerated lorries, with cold stores and a fish depot beside the quay. Codhaven's drying racks and sea wind are the clearest symbol of the islands' fishing tradition.
