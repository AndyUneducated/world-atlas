    zh: 风港市唯一的区，风岛的风机山脊、运维港与哨岛构成了全区的风景。风港镇坐落在风岛北部的山谷里，是一座年轻的新兴小镇，镇上有市政府、学校、幼儿园、医院、体育中心和一条新建的商业街，许多住宅是为风电工程师和技术工人家庭新建的公寓，街上随处可见推着婴儿车的年轻父母。镇外的山脊上，数十台大型风机沿着山脊一字排开，叶片在终年不息的海风中缓缓转动，风岛公路沿着山脊延伸，游客可以驱车近距离观看风机，山脊上的观景台是看日落和风机剪影的好地方。南岸的风港风电运维港是全区的经济中心，运维船、起重船和风机安装船在这里停靠，叶片维修厂、零部件仓库和培训中心为群岛的风电场提供服务，风电运维和制造业是全区的支柱；渔港在运维港旁边，渔民仍在近海捕鱼。哨岛位于风岛外海，面积一百四十多平方公里，山顶的哨岛雷达站监视着东方航路上的船只和天气，岛上还有海鸟栖息地。区内人口约二十五万，是群岛最年轻的区之一，劳动年龄人口和儿童比例都很高，居民以维京语为母语的家庭居多。风岛公路连接风港镇与南岸的运维港，往返白帆的渡轮也在运维港停靠。风港充满朝气，是群岛最有活力的小岛之一。
    en: The only district of Windhaven City, where Wind Isle's turbine ridges, the service port and Sentinel Isle make the scenery. Windhaven town sits in a valley in the north of the island, a young and growing town with the city government, schools, a kindergarten, a hospital, a sports centre and a new shopping street; many homes are new flats built for the families of wind engineers and technicians, and young parents with prams are everywhere. On the ridge outside town dozens of large turbines stand in a line, their blades turning slowly in the never-ending sea wind; the Wind Isle Road follows the ridge so visitors can drive right up to them, and the ridge-top lookout is a fine place to watch the sunset behind the turbines. The Windhaven Wind Service Port on the south coast is the district's economic heart, with crew boats, crane vessels and installation ships at its quays, and blade repair shops, parts stores and a training centre serving the islands' wind farms; wind maintenance and manufacturing are the mainstays, and the fishing harbour beside the service port still sends boats out close to shore. Sentinel Isle, offshore, covers more than a hundred and forty square kilometres; the radar station on its summit watches the ships and weather on the eastern sea lanes, and the island also has seabird colonies. About a quarter of a million people live here, one of the youngest districts in the islands, with high shares of both working-age adults and children, and most families speak Viking. The Wind Isle Road joins Windhaven town with the service port on the south coast, where ferries to White Sail also call. Full of youthful energy, Windhaven is one of the liveliest small islands in the chain.
