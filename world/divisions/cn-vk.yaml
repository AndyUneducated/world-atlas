  notes:
    zh: 白帆岛东南岸的渔港与冷链加工区，帆影岭的南段在区内延伸到海边，山海之间的海湾里停泊着盐湾市最大的渔船队。渔港区的渔民主要在白帆岛东南的近海和远海捕捞鳕鱼、黑线鳕、鲭鱼和北极虾，渔船每天凌晨出海，傍晚满载而归，渔港鱼市是白帆岛最大的鲜鱼批发市场，清晨的拍卖声此起彼伏。鱼市旁的冷链加工厂把渔获冷冻、腌制、熏制和罐装，产品经白帆纵贯高速运往白帆港，再销往群岛和海外，渔业和食品加工是区里的两大支柱，第一产业比重在全群岛名列前茅。渔港的老街上有许多海鲜餐馆和鱼干店，咸鱼干、熏鲭鱼和鱼子酱是这里的特产；渔民教堂和渔民纪念碑纪念着在海上遇难的渔民，体现着渔港人对大海的敬畏。区内的内陆是帆影岭南段的山地和林地，零散分布着牧场和小村庄。盐湾海滨公路的起点就在区内，向北经盐湾区通往望海。居民以维京语为母语，许多家庭世代捕鱼，老年人比例较高。渔港的生活随潮汐和渔汛起落，朴实而坚韧，是群岛渔业传统的生动写照。
    en: The fishing harbour and cold-chain processing district on White Sail Island's south-east coast, where the southern end of Sailshadow Ridge runs down to the sea and the largest fishing fleet in Saltbay shelters in the bays between mountain and water. Its fishermen take cod, haddock, mackerel and northern prawns in the near and far waters south-east of the island; the boats go out before dawn and return laden in the evening, and the Fishing Harbour Fish Market is the largest wholesale fish market on White Sail Island, loud with auctioneers every morning. Beside the market, cold-chain plants freeze, salt, smoke and can the catch, which travels by the White Sail Spine Expressway to White Sail harbour and on to the islands and overseas; fishing and food processing are the two mainstays, and farming and fishing take as large a share of output as almost anywhere in the islands. The old street is full of seafood restaurants and dried-fish shops, and salt cod, smoked mackerel and roe are the local specialities; the fishermen's church and memorial remember those lost at sea and show the town's respect for the ocean. Inland lie the mountains and woods of the southern ridge, dotted with pastures and small villages. The Salt Bay Coast Road starts in the district and runs north through Saltbay to Seawatch. Residents speak Viking at home, many families have fished for generations, and the share of older people is high. Life here rises and falls with the tides and the fishing seasons, plain and tough, a living picture of the islands' fishing tradition.
