  notes:
    zh: 长船岛西北岸面向锚岛海峡的城市，以潮汐电站与海鲜市场闻名，全市只设潮湾一区。锚岛海峡在这里收窄，潮差大、潮流急，是群岛开发潮汐能的最佳地点，潮湾潮汐电站横跨海湾口，利用每天两次的涨落潮发电，为长船都市区提供清洁电力，也是群岛最具代表性的新能源工程；电站的运维、海洋工程和电力设备制造带动了地方工业。海峡里潮流带来丰富的鱼类和贝类，潮湾渔港是长船岛西北岸最大的渔港，潮湾海鲜市场每天清晨拍卖新鲜的鳕鱼、比目鱼、螃蟹和贻贝，长船的餐馆和超市大多从这里进货，渔业、海鲜批发和商贸是全市的另一支柱。全市人口约八十万，居民以维京语为母语的家庭居多，劳动年龄人口比例较高。潮湾是群岛高速公路网的重要节点：锚岛跨海高速从这里出发，跨越锚岛海峡通往锚港；长船西岸高速经过这里，向南通往舵港，向东北通往长船；长船西北岸公路也从这里出发，沿海岸经西岸、北岬通往长船机场。潮湾以潮汐和海鲜为名片，是长船岛西北岸最有活力的城市。
    en: "A city on the north-west shore of Longship Island facing the Anchor Strait, known for its tidal power station and seafood market, with a single district, Tidebay. The Anchor Strait narrows here, the tidal range is large and the currents strong, the best place in the islands to harness the tides. The Tidebay Tidal Power Station spans the mouth of the bay and generates electricity from the ebb and flood twice a day, supplying clean power to the Longship area; it is the islands' showcase clean-energy project, and its maintenance, marine engineering and power equipment manufacturing support local industry. The tides bring abundant fish and shellfish into the strait. Tidebay's fishing harbour is the largest on Longship Island's north-west coast, and every dawn the Tidebay seafood market auctions fresh cod, flatfish, crab and mussels; most of Longship's restaurants and supermarkets buy here, making fishing, seafood wholesale and trade the city's other mainstay. About eight hundred thousand people live here; most families speak Viking, and the share of working-age adults is high. Tidebay is an important node of the islands' expressway network: the Anchor Strait Crossing starts here and spans the strait to Anchorhaven, the Longship West Shore Expressway passes through, south to Rudderhaven and north-east to Longship, and the Longship North-West Shore Road starts here and follows the coast through West Shore and North Cape to Longship's airport. Tides and seafood are its calling cards, and Tidebay is the liveliest city on Longship Island's north-west shore."
