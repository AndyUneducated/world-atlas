  flag_notes:
    zh: "白底上一座从旗底升起、直抵上缘的绿色三角。谢尔海姆在维京语里意为「龙骨之乡」，绿色三角既是形如长船龙骨的谢尔海姆山，也是山上茂密的针叶林；白色是冬季深厚的积雪和滑雪场。整面旗没有任何图案，只靠一刀分割，是群岛最简洁的市旗之一。"
    en: "A green triangle rising from the foot of a white flag to its top edge. Kjølheim means 'home of the keel' in Viking: the triangle is both the keel-shaped mountain and the conifer forest that covers it, the white its deep winter snow and ski slopes. With no charge at all, only a single division, it is among the simplest flags in the islands."
  traits: { industries: [forestry, ski, tourism], heritage: viking, age: old }
  notes:
    zh: 长船岛中部谢尔海姆山东南麓的山区城市，以林业、滑雪与山地旅游为生，全市只设谢尔海姆一区。谢尔海姆山是贯穿长船岛中部的山脉，因形如长船的龙骨而得名，谢尔海姆在维京语里意为「龙骨之乡」，山上覆盖着茂密的针叶林，冬季积雪深厚，是群岛最重要的林业基地和滑雪胜地。全市人口约三十万，林业和木材加工是传统支柱，林场按照可持续的轮伐制度经营，锯木厂和家具厂把木材加工成建材、地板和家具，供应长船都市区和群岛各地；冬季运动和山地旅游是新的增长点，谢尔海姆山滑雪场是群岛最大的滑雪场，夏季则以徒步、山地自行车和森林露营吸引游客。由于远离海岸，谢尔海姆是群岛少有的内陆城市，居民以维京语为母语的家庭居多，许多家庭世代经营林场，老年人比例较高。谢尔海姆是长船岛南北交通的必经之地：群岛跨海高速从这里经过，向东北通往长船，向西南通往斯蒂尔维克；谢尔海姆山公路纵贯全市，连接朗桑德与斯蒂尔维克、斯库特斯塔德。谢尔斯卡德山口是翻越谢尔海姆山的低矮山口。谢尔海姆城市不大，却以清新的空气、茂密的森林和冬季的白雪成为长船人心中的度假后花园。
    en: "A mountain city on the south-eastern slopes of the Kjølheim Hills in the middle of Longship Island, living by forestry, skiing and mountain tourism, with a single district, Kjølheim. The Kjølheim Hills run down the middle of Longship Island, named because they look like the keel of a longship, and Kjølheim means keel home in Viking. They are covered with dense conifer forest and deep snow in winter, making them the islands' most important forestry base and their best skiing. About three hundred thousand people live here. Forestry and timber processing are the traditional mainstays: the plantations are run on a sustainable rotation, and sawmills and furniture plants turn the timber into building materials, flooring and furniture for the Longship area and the rest of the islands. Winter sports and mountain tourism are the new growth: the Kjølheim Hills Ski Area is the largest in the islands, and in summer hiking, mountain biking and forest camping draw visitors. Set back from the coast, Kjølheim is one of the few inland cities in the islands; most families speak Viking, many have run forest holdings for generations, and the share of older people is high. Kjølheim is the way through between the north and south of Longship Island: the Island Chain Expressway passes through, north-east to Longship and south-west to Styrvik, and the Kjølheim Hills Road runs the length of the city, linking Langsand with Styrvik and Skutstad. Kjølskard is the low pass over the hills. Kjølheim is not big, but its fresh air, deep forests and winter snow make it Longship people's favourite holiday back garden."
