    zh: 群岛最南端的海岛城市，以海滨度假和渔业为生，全市只设南星一区。南星岛面积五千多平方公里，位于群岛南部外海，岛上的南星镇因夜空中明亮的南方星辰而得名，南岸绵长的沙滩和温和的海水使这里成为群岛最受欢迎的夏季度假地之一。旅游是全市最重要的产业，南星海滨度假村、海滨别墅和露营地沿南岸分布，夏季日落很晚，晚上十点仍可以在沙滩上看落日，度假的家庭和年轻人从长船、白帆乘渡轮蜂拥而至；渔业是另一大生计，渔民在南部外海捕捞鲭鱼、鲱鱼和螃蟹，海鲜餐馆和渔家民宿与旅游业相辅相成。全市人口约四十五万，人均产出在群岛各市中偏低，经济的季节性很强，冬季游客稀少，许多年轻人到白帆和长船工作，老年人比例在群岛各市中最高，居民以维京语为母语的家庭居多。南星岛的对外交通全靠北岸的南星渡轮码头，渡轮往返白帆岛的盐湾；南星公路是岛上唯一的干线公路，从南星镇翻过全岛到达渡轮码头，山顶的观景台可以同时眺望南北两侧的海面。南星远离尘嚣、阳光充足，是群岛人心中的夏日乐园。
    en: "The southernmost island city of the chain, living by seaside holidays and fishing, with a single district, Southstar. Southstar Island covers more than five thousand square kilometres in the open sea south of the islands; Southstar town is named for the bright southern stars in its night sky, and the long beaches and mild water of the south coast make it one of the islands' favourite summer holiday places. Tourism is the city's biggest trade. The Southstar Beach Resort, seaside villas and campsites line the south coast; on summer evenings the sun sets so late that people watch it from the beach at ten at night, and families and young people pour in by ferry from Longship and White Sail. Fishing is the other livelihood: fishermen take mackerel, herring and crab in the southern waters, and seafood restaurants and fishermen's guesthouses go hand in hand with the holiday trade. About 450,000 people live here; output per head is on the low side for the islands and the economy is highly seasonal, with few visitors in winter, many young people leave to work in White Sail and Longship, the share of older people is the highest of any city in the islands, and most families speak Viking. The island's only link with the outside is the Southstar Ferry Terminal on the north shore, with ferries to Saltbay on White Sail Island, and the Southstar Road, the island's only through road, runs from Southstar town over the island to the terminal, its hilltop lookout taking in the sea to both north and south. Remote and sunny, Southstar is the islanders' summer paradise."
