  notes:
    zh: 白帆岛东北部的邮轮母港与免税购物城，群岛第三大城市，人口约三百万。白帆以海港上千帆竞发的景象得名，维京时代这里就是群岛的商船集散地，如今则以邮轮和免税购物闻名：白帆邮轮母港是群岛最大的邮轮港，每年接待数百航次的邮轮，白帆免税城汇集了来自世界各地的商品，邮轮游客和购物客是全市经济的主要来源。帆港区是邮轮码头、免税商业街和渡轮枢纽；灯塔区是白帆岛东北端的老灯塔、海滨别墅和观鲸码头；帆城区是老城和市政中心，帆船俱乐部和造帆作坊延续着城市的航海传统，白帆机场也在这里；望海区则是帆影岭东麓的住宅区、果园和观景山道。邮轮、零售和旅游是全市的支柱，酒店、餐饮和交通服务提供了大量就业。白帆的居民来源多元，以中文、维京语和巴克汉姆语为母语的人都很多。长白跨海高速从这里跨海直达长船，白帆纵贯高速向南经盐湾通往银鸥，帆港邮轮高速连接机场和邮轮港。白帆繁华而好客，是维京群岛迎接世界游客的大门。
    en: The cruise home port and duty-free shopping city in the north-east of White Sail Island, the third-largest city in the islands with about three million people. White Sail takes its name from the sight of a thousand sails setting out from its harbour; in Viking times it was where the islands' merchant ships gathered, and today it is famous for cruises and duty-free shopping. The White Sail Cruise Port is the largest cruise port in the islands, handling hundreds of calls a year, and the White Sail Duty-Free Mall gathers goods from all over the world; cruise passengers and shoppers are the city's main source of income. Sail Harbour has the cruise terminal, the duty-free shopping streets and the ferry hub. Lighthouse is the old lighthouse, seaside villas and whale-watching pier at the north-eastern tip of the island. Sail Town is the old town and civic centre, where sailing clubs and sail-makers' workshops keep up the city's seafaring tradition and White Sail Airport is located. Seawatch is housing, orchards and scenic mountain roads on the eastern slopes of Sailshadow Ridge. Cruises, retail and tourism are the city's mainstays, and hotels, restaurants and transport provide many jobs. Residents come from many backgrounds, with plenty of Chinese, Viking and Buckham speakers. The sea crossing to Longship starts here, the White Sail Spine Expressway runs south through Saltbay to Silvergull, and the cruise expressway links the airport and the cruise port. Busy and welcoming, White Sail is the Viking Islands' front door for visitors from around the world.
