  notes:
    zh: 银鸥市的中心城区，银鸥湾畔的度假住宅、海滨酒店与老渔港构成了全区的风景。银鸥湾面积近三百平方公里，湾内风平浪静，白色的沙滩和松林环抱的小海湾适合游泳、帆船和皮划艇，夏季湾里满是白帆，成群的银鸥在码头和渔船上空盘旋；湾口的引水岛有一座老引水站和灯塔，渡船把游客送到岛上野餐和观鸟。区内的度假住宅沿海岸和山坡分布，许多是长船、白帆和锚港家庭的第二居所，退休社区、疗养院和高尔夫球场也集中在这里，旅游和住宅服务是全区的支柱，餐馆、游艇码头和海滨商店在夏季格外热闹，冬季则恢复小城的宁静。银鸥老城围绕老渔港展开，木结构渔屋、石砌教堂和鱼市保留着渔港的风情，渔民仍在湾外捕鱼。区内老年人比例较高，居民以维京语为母语的家庭居多。帆影岭公路从这里出发，沿西北岸通往白岭和帆影；白帆纵贯高速和桅岛跨海高速在城郊交会，后者跨越白帆海峡西南口外的桅岛海峡。银鸥湾的日落把海面染成金色，是白帆岛最有名的海滨景色之一。
    en: The urban centre of Silvergull, where holiday homes, seaside hotels and the old fishing harbour around Silvergull Bay make the scenery. The bay covers nearly three hundred square kilometres of calm water; its white beaches and coves backed by pines are made for swimming, sailing and kayaking, in summer the bay is full of white sails, and gulls wheel over the quays and boats. Pilot Isle at the mouth of the bay has an old pilot station and lighthouse, and boats take visitors out to picnic and watch birds. Holiday homes spread along the shore and up the slopes, many of them second homes for families from Longship, White Sail and Anchorhaven, and retirement communities, care homes and a golf course are here too; tourism and residential services are the mainstays, restaurants, marinas and beach shops are busy in summer, and in winter the small town grows quiet again. The old town is built round the old fishing harbour, with timber fishing huts, a stone church and a fish market keeping its harbour character, and fishermen still work beyond the bay. The share of older people is high and most families speak Viking. The Sailshadow Ridge Road starts here and runs up the north-west shore to Whiteridge and Sailshadow, and the White Sail Spine Expressway and the Mast Island Sea Crossing meet on the edge of town, the latter crossing the Mast Strait off the south-western mouth of the White Sail Strait. Sunset over Silvergull Bay turns the water gold, one of the best-known seaside sights on White Sail Island.
