  notes:
    zh: 乌利克尤阿克市唯一的区，乌利克尤阿克岛的渔港、鱼干架与渔村构成了全区的日常。乌利克尤阿克镇坐落在乌利克尤阿克岛西岸的海湾里，港内停满了拖网船和延绳钓船，鳕鱼汛期时港口昼夜忙碌，渔船卸下的鳕鱼当场去头剖腹，成对挂上海边的木制鱼干架，一排排鱼干架沿海岸延伸数公里，在海风和寒冷的空气中风干两三个月，形成乌利克尤阿克独特的风景，也吸引着摄影师和游客前来参观。鱼干厂把风干鳕鱼分级、打包，鱼头和鱼骨制成鱼粉，鱼肝炼成鱼肝油，几乎没有任何浪费，食品加工与捕捞一起构成了全区经济的支柱。乌利克尤阿克镇有木结构的渔屋、渔民教堂、鳕鱼博物馆和几家以鳕鱼料理闻名的餐馆，鳕鱼舌、鳕鱼汤和咸鳕鱼是这里的招牌菜。艾因谢尔岛位于乌利克尤阿克岛外海，面积一百四十平方公里左右，礁石上的灯塔为渔船指引方向，周围的海域是渔民的传统渔场。区内人口约十五万，居民以维京语为母语的家庭居多，老年人比例较高。乌利克尤阿克岛公路从镇子后方绕过海滨的晾晒场，横穿乌利克尤阿克岛到东岸的乌利克尤阿克渡轮码头，乌利克尤阿克特大桥是全线唯一的大桥，冷藏货车把鱼货运上渡轮，再经阿克斯岛的富鲁海姆运往各地。乌利克尤阿克镇的空气里总是带着鱼干和海风的味道。
    en: "The only district of Ulikjuaq City, where the fishing harbour, drying racks and fishing villages of Ulikjuaq Island make up daily life. Ulikjuaq town lies in a bay on the island's west coast, its harbour packed with trawlers and longliners. In the cod season the port works day and night: the catch is headed and gutted on the spot and hung in pairs on the wooden drying racks by the sea, rows of racks run for kilometres along the shore, and the fish dry for two or three months in the wind and cold, a sight peculiar to Ulikjuaq that draws photographers and visitors. The stockfish plants grade and pack the dried cod, the heads and bones become fishmeal and the livers cod-liver oil, so almost nothing is wasted, and processing together with fishing is the backbone of the district's economy. The town has timber fishing huts, a fishermen's church, a cod museum and a few restaurants famous for their cod dishes, with cod tongues, cod soup and salt cod the specialities. Lone Reef Isle lies offshore, about a hundred and forty square kilometres, its lighthouse guiding the boats and the waters round it a traditional fishing ground. About 150,000 people live here; most families speak Viking and the share of older people is high. The Ulikjuaq Island Road passes behind the town to keep clear of the drying grounds and crosses the island to the Ulikjuaq Ferry Terminal on the east coast, the Ulikjuaq Sea Bridge its only major bridge, and refrigerated lorries take the fish onto the ferry and on by way of Furuheim on Akkersey. The air in Ulikjuaq always smells of dried fish and the sea."
