    zh: "上蓝下白，中间以波浪线分开。弗洛德维克在维京语里意为「潮湾」，波浪线是阿克斯海峡每天两次的涨落潮，蓝色是潮水，白色是潮汐电站大坝和海峡里翻起的浪花。渔民说旗上的浪画的是涨潮，所以市政厅降旗总挑在退潮的时候。"
    en: "Blue over white, parted by a wavy line. Flodvik means 'tide bay' in Viking: the waves are the twice-daily tides of the strait, the blue the flood and the white the tidal barrage and the surf it raises. Fishermen say the waves on the flag show high water, so the city hall always lowers it at the ebb."
  traits: { industries: [tidal, fishing, commerce], heritage: viking, age: balanced }
  notes:
    zh: 长船岛西北岸面向阿克斯海峡的城市，以潮汐电站与海鲜市场闻名，全市只设弗洛德维克一区。阿克斯海峡在这里收窄，潮差大、潮流急，是群岛开发潮汐能的最佳地点，弗洛德维克潮汐电站横跨海湾口，利用每天两次的涨落潮发电，为长船都市区提供清洁电力，也是群岛最具代表性的新能源工程；电站的运维、海洋工程和电力设备制造带动了地方工业。海峡里潮流带来丰富的鱼类和贝类，弗洛德维克渔港是长船岛西北岸最大的渔港，弗洛德维克海鲜市场每天清晨拍卖新鲜的鳕鱼、比目鱼、螃蟹和贻贝，长船的餐馆和超市大多从这里进货，渔业、海鲜批发和商贸是全市的另一支柱。全市人口约四十万，居民以维京语为母语的家庭居多，劳动年龄人口比例较高。弗洛德维克是群岛高速公路网的重要节点：阿克斯跨海高速从这里出发，跨越阿克斯海峡通往阿克斯维克；长船西岸高速经过这里，向南通往斯蒂尔维克，向东北通往长船；长船西北岸公路也从这里出发，沿海岸经西岸、北岬通往长船机场。弗洛德维克以潮汐和海鲜为名片，是长船岛西北岸最有活力的城市。
    en: "A city on the north-west shore of Longship Island facing the Akkersey Strait, known for its tidal power station and seafood market, with a single district, Flodvik. The Akkersey Strait narrows here, the tidal range is large and the currents strong, the best place in the islands to harness the tides. The Flodvik Tidal Power Station spans the mouth of the bay and generates electricity from the ebb and flood twice a day, supplying clean power to the Longship area; it is the islands' showcase clean-energy project, and its maintenance, marine engineering and power equipment manufacturing support local industry. The tides bring abundant fish and shellfish into the strait. Flodvik's fishing harbour is the largest on Longship Island's north-west coast, and every dawn the Flodvik seafood market auctions fresh cod, flatfish, crab and mussels; most of Longship's restaurants and supermarkets buy here, making fishing, seafood wholesale and trade the city's other mainstay. About four hundred thousand people live here; most families speak Viking, and the share of working-age adults is high. Flodvik is an important node of the islands' expressway network: the Akkersey Strait Crossing starts here and spans the strait to Akkersvik, the Longship West Shore Expressway passes through, south to Styrvik and north-east to Longship, and the Longship North-West Shore Road starts here and follows the coast through West Shore and North Cape to Longship's airport. Tides and seafood are its calling cards, and Flodvik is the liveliest city on Longship Island's north-west shore."
