  notes:
    zh: 暖泉岛西端的落日区，渔村与落日岬观景台散布在火山熔岩形成的海岸上，以群岛最壮丽的日落之一闻名。落日岬是暖泉岛向西伸入大洋的岬角，岬上的观景台面朝开阔的海面，每当天气晴朗的傍晚，太阳缓缓沉入大洋，把黑色的熔岩海崖和白色的浪花染成金红色，观景台上常常挤满了从温泉区和克莱特斯塔德驱车而来的游客；夏至前后日落很晚，晚霞要到深夜才褪尽。区内的海岸由黑色玄武岩和熔岩台地构成，海蚀柱、海蚀洞和天然石拱随处可见，海岸步道沿着海崖延伸。渔村散布在海湾里，渔民在近海捕捞鳕鱼、黑线鳕和龙虾，许多渔家开设民宿和海鲜餐馆，旅游和渔业是全区的两大支柱。落日区人口约十三万，年轻人多到克莱特斯塔德和温泉区工作，留在村里的以老人为主，老年人比例较高，居民以维京语为母语的家庭居多，村里的小教堂和石砌渔屋保留着古老的风貌。暖泉环山公路在这里终止，是落日通往克莱特斯塔德和温泉区的主要道路，傍晚时分路上最为热闹。落日区远离城市喧嚣，是群岛人最喜爱的看日落的地方。
    en: Sunset District at the western end of Warmspring Island, its fishing villages and the Sunset Point lookout scattered along a coast of lava flows, and famous for one of the most magnificent sunsets in the islands. Sunset Point is the headland where Warmspring Island reaches west into the ocean, and its lookout faces the open sea; on clear evenings the sun sinks slowly into the ocean, turning the black lava cliffs and white surf red and gold, and the lookout is often crowded with visitors who have driven over from Hot Springs and Klettstad. Around midsummer the sun sets late and the afterglow lingers until close to midnight. The coast is black basalt and lava terraces, with sea stacks, sea caves and natural arches all along it, and a coastal path follows the cliffs. Fishing villages sit in the coves; fishermen take cod, haddock and lobster close to shore, many families run guesthouses and seafood restaurants, and tourism and fishing are the two mainstays. About 126,000 people live here; young people mostly work in Klettstad and Hot Springs, those who stay are mostly older, the share of elderly residents is high, and most families speak Viking. Small churches and stone fishing huts keep the villages' old look. The Warmspring Volcano Road ends here and is Sunset's main road to Klettstad and Hot Springs, busiest in the early evening. Far from the noise of the city, Sunset is the islanders' favourite place to watch the sun go down.

