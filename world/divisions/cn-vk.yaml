  flag_notes:
    zh: "深蓝底正中一枚金色圆印，印环上写着英语城名，白色印心里是一座深蓝色的石堡。城市得名于扼守卡洛韦岭山路的古老石堡，这枚印是要塞时代驻军的公章，后来原样用作市旗。城里的老人仍把这面旗叫作「堡印」，登山向导会把它缝在背包上。"
    en: "A gold round seal on deep blue, its ring bearing the city's name in English and its white centre a deep blue stone keep. The city is named after the old fort guarding the road over the Calloway ridge; the seal was the garrison's official stamp in the fort's days and was later taken over unchanged as the city flag. Older residents still call it 'the fort seal', and mountain guides sew it onto their packs."
  traits: { industries: [forestry, tourism], heritage: viking, age: old }
  notes:
    zh: 阿夫琳岛中部卡洛韦岭下的山区城市，以林业与登山为生，全市只设卡洛韦堡一区。卡洛韦岭是纵贯阿夫琳岛的山脉，从海上远望，山脊的轮廓像一面鼓起的船帆投下的影子，城市则得名于扼守山路的一座古老石堡。全市面积八千多平方公里，人口只有约十五万，是阿夫琳岛人口最少的城市，大部分土地是森林、高山草甸和岩峰。林业是传统支柱，卡洛韦岭西北麓的林场出产云杉和松木，木材经卡洛韦岭公路运往帆城和莫塞加工；登山、徒步和山地旅游是新的增长点，卡洛韦岭的主峰和山口吸引着群岛的登山爱好者，山间小镇的旅馆和登山向导服务随之兴起。由于山区交通不便、就业机会有限，许多年轻人到阿夫琳港和长船工作，留在山里的多是老人和世代经营林场的家庭，老年人比例较高。卡洛韦岭公路是全市的主要道路，向东北通往阿夫琳港的帆城区，向西南经维托斯通往莫塞。居民以维京语为母语，民风淳朴。卡洛韦堡山高林密、云雾缭绕，是阿夫琳岛的绿色屋脊。
    en: "A mountain city below Calloway Ridge in the middle of Aveline Island, living by forestry and mountaineering, with a single district, Fort Calloway. Calloway Ridge runs the length of Aveline Island; seen from the sea, its skyline looks like the shadow cast by a filled sail; the city is named after the old stone fort that guards the mountain road. The city covers more than eight thousand square kilometres but has only about 150,000 people, the fewest of any city on Aveline Island, and most of its land is forest, alpine meadow and rocky peaks. Forestry is the traditional mainstay: holdings on the north-western slopes produce spruce and pine, which go down the Calloway Ridge Road to be processed in Sail Town and Måsey. Climbing, hiking and mountain tourism are the new growth, as the ridge's summits and passes draw climbers from across the islands and inns and mountain guides have sprung up in the hill towns. Roads are few and jobs scarce, so many young people leave for Port Aveline and Longship; those who stay are mostly older people and families who have run forest holdings for generations, and the share of elderly residents is high. The Calloway Ridge Road is the city's main road, running north-east to Sail Town in Port Aveline and south-west through Hvitås to Måsey. Residents speak Viking at home and keep simple, friendly ways. High, wooded and wrapped in cloud, Fort Calloway is the green roof of Aveline Island."
