  notes:
    zh: 乌维克库特市的主岛和中心，瓦莱岛面积五千多平方公里，是群岛西部最大的岛屿，也是观鲸船的母港。每年夏季，座头鲸、虎鲸和小须鲸沿乌维克库特海峡洄游，在观鲸湾里觅食，观鲸船从瓦莱渡轮码头出发，几乎每次出海都能看到鲸鱼喷水、跃身和摆尾，观鲸是区里最重要的旅游项目。瓦莱观鲸中心是群岛的鲸类研究和科普机构，展出鲸鱼骨架、录音和迁徙地图，研究人员常年在岛上观测和保护鲸群。岛上的渔村沿着港湾分布，渔民捕捞鳕鱼、鲱鱼和龙虾，鱼干晾架和红色的渔屋是瓦莱岛的标志性景观，许多渔家兼营民宿和海鲜餐馆，旅游和渔业相互依存。瓦莱岛北面的伦达霍尔姆岛隔着伦达霍尔姆水道与主岛相望，夏季岛上满是筑巢的海鹦。瓦莱渡轮码头是乌维克库特与群岛主岛之间的门户，渡轮通往阿夫琳港、阿克斯维克和长船，乌维克库特跨海公路则把瓦莱岛与西基克图克岛连在一起。维京语是最主要的母语，老年人比例较高，岛上的学校、诊所和商店都集中在码头附近的小镇里。瓦莱岛的夏夜短暂明亮，海上鲸歌回荡，是许多人一生难忘的旅程。
    en: The main island and centre of the Uviqkut. At more than five thousand square kilometres, Hvaley is the largest island in the west of the chain and the home port of the whale-watching boats. Every summer humpbacks, orcas and minke whales migrate along the Uviqkut Strait and feed in Whalewatch Bay, and the boats that leave the Hvaley Ferry Terminal see whales blowing, breaching and lob-tailing on almost every trip, making whale watching the district's most important attraction. The Hvaley Whale Centre is the islands' whale research and education centre, with whale skeletons, recordings and migration maps, and its researchers watch over and protect the whales from the island all year. Fishing villages ring the harbours; fishermen catch cod, herring and lobster, and drying racks and red fishing huts are the island's emblem. Many fishing families also run guesthouses and seafood restaurants, so tourism and fishing go hand in hand. Lundaholm faces the main island across Lundaholm Sound and is crowded with nesting puffins in summer. The Hvaley Ferry Terminal is the Uviqkut' gateway to the main islands, with ferries to Port Aveline, Akkersvik and Longship, and the Uviqkut Causeway links Hvaley with Siqqiqtuuq Island. Viking is the most common first language, the share of older people is high, and the island's school, clinic and shops are gathered in the small town by the terminal. Summer on Hvaley means short, bright nights and whale song carrying over the sea, a journey many people never forget.
