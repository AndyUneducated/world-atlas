    zh: 西岸区
    en: West Shore District
    art-x-viking: Westufer
    art-x-buckham: Riva Ovest
  codes:
    admin: '910105'
  population: 400000
  area_km2: 2500.0
  traits: { industries: [residential, commerce], heritage: mixed, age: young }
  notes:
    zh: 长船岛西北岸成片的住宅区与海滨公园，人口约四十万，是长船最主要的居住区之一。区内住宅以中高层公寓和联排住宅为主，社区里学校、托儿所、超市和社区中心配套齐全，房价比古城和汇金区低，吸引了大量年轻家庭，儿童比例在全市最高。许多居民在福恩斯塔德、汇金和奥斯特哈门上班，每天沿公路和公交线路通勤；社区商业、零售和教育是区里主要的就业来源。西岸的海岸线上修建了一连串海滨公园、沙滩和自行车道，夏季傍晚居民在海边散步、野餐、看日落，西北方向的哈洛兰岛上耸立着哈洛兰岛灯塔，是西岸的标志。长船西北岸公路纵贯全区，向东北通往北岬，向西南通往弗洛德维克。区内居民来源多元，说中文、维京语和巴克汉姆语的家庭混居，许多是从群岛各岛和北维京岛迁来的新长船人，社区里经常举办多语种的文化节和市集。西岸区没有古城的名胜，也没有汇金的高楼，却以宜居、平和与开阔的海景著称，是长船人安家的首选之一。
    en: The spread of housing and seaside parks along the north-west shore of Longship Island, home to about four hundred thousand people and one of Longship's main residential districts. Homes are mostly mid- and high-rise flats and terraces, and each neighbourhood has its schools, nurseries, supermarkets and community centre. Prices are lower than in Fornstad or Goldmark, so many young families have moved in, and the share of children is the highest in the city. Many residents work in Fornstad, Goldmark or Austhamn and commute every day by road and bus; local shops, retail and schools are the district's main employers. A chain of seaside parks, beaches and cycle paths runs along the shore, where people stroll, picnic and watch the sunset on summer evenings, and the Halloran Island Lighthouse on Halloran Island to the north-west is West Shore's emblem. The Longship North-West Shore Road runs the length of the district, north-east to North Cape and south-west to Flodvik. Residents come from many backgrounds; Chinese-, Viking- and Buckham-speaking families live side by side, many of them new Longshippers from the other islands and North Viking Island, and neighbourhood festivals and markets are often held in several languages. West Shore has no old-town monuments and no Goldmark towers, but it is known for being pleasant, peaceful and open to the sea, and it is one of the first places Longship people choose to settle.
