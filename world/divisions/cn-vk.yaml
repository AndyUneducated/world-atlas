  notes:
    zh: 长船岛中部龙骨山东南麓的山区城市，以林业、滑雪与山地旅游为生，全市只设龙骨一区。龙骨山是贯穿长船岛中部的山脉，因形如长船的龙骨而得名，山上覆盖着茂密的针叶林，冬季积雪深厚，是群岛最重要的林业基地和滑雪胜地。全市人口约六十万，林业和木材加工是传统支柱，林场按照可持续的轮伐制度经营，锯木厂和家具厂把木材加工成建材、地板和家具，供应长船都市区和群岛各地；冬季运动和山地旅游是新的增长点，龙骨山滑雪场是群岛最大的滑雪场，夏季则以徒步、山地自行车和森林露营吸引游客。由于远离海岸，龙骨是群岛少有的内陆城市，居民以维京语为母语的家庭居多，许多家庭世代经营林场，老年人比例较高。龙骨是长船岛南北交通的必经之地：群岛跨海高速从这里经过，向东北通往长船，向西南通往舵港；龙骨山公路纵贯全市，连接长滩与舵港、船尾。龙骨口是翻越龙骨山的低矮山口。龙骨城市不大，却以清新的空气、茂密的森林和冬季的白雪成为长船人心中的度假后花园。
    en: "A mountain city on the south-eastern slopes of the Keel Hills in the middle of Longship Island, living by forestry, skiing and mountain tourism, with a single district, Keel. The Keel Hills run down the middle of Longship Island, named because they look like the keel of a longship. They are covered with dense conifer forest and deep snow in winter, making them the islands' most important forestry base and their best skiing. About six hundred thousand people live here. Forestry and timber processing are the traditional mainstays: the plantations are run on a sustainable rotation, and sawmills and furniture plants turn the timber into building materials, flooring and furniture for the Longship area and the rest of the islands. Winter sports and mountain tourism are the new growth: the Keel Mountain Ski Area is the largest in the islands, and in summer hiking, mountain biking and forest camping draw visitors. Set back from the coast, Keel is one of the few inland cities in the islands; most families speak Viking, many have run forest holdings for generations, and the share of older people is high. Keel is the way through between the north and south of Longship Island: the Island Chain Expressway passes through, north-east to Longship and south-west to Rudderhaven, and the Keel Hills Road runs the length of the city, linking Longbeach with Rudderhaven and Stern. Keel Gap is the low pass over the hills. Keel is not big, but its fresh air, deep forests and winter snow make it Longship people's favourite holiday back garden."
