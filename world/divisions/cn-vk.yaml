  flag_notes:
    zh: "红底上一只展翅的白色银鸥。莫塞在维京语里意为「鸥岛」，城市因莫斯维克湾上成群的银鸥而得名；红色取自渔家老屋的红墙，也是群岛维京老城常用的旗色。夏天湾上的银鸥比度假的人还多，市民开玩笑说这面旗是替它们挂的。"
    en: "A white herring gull with wings spread on red. Måsey means 'gull island' in Viking, after the herring gulls that crowd its bay; the red comes from the red walls of the old fishing houses and is a common colour on the islands' Viking town flags. In summer there are more gulls on the bay than holidaymakers, and residents joke that the flag flies for them."
  traits: { industries: [tourism, residential, forestry], heritage: viking, age: old }
  notes:
    zh: 阿夫琳岛西南端的海滨城市，隔着阿夫琳海峡与长船岛相望，以海湾风光、度假住宅和林业为生，下设莫塞和维托斯两区。莫塞在维京语里意为「鸥岛」，城市因莫斯维克湾上成群的银鸥而得名，莫斯维克湾水面宽阔、海滩洁白，湾外的引水岛曾是引水员等候进出阿夫琳海峡船只的地方，如今是渡假小岛。全市人口约四十万，服务业占经济的大头：莫塞区是度假住宅、海滨酒店和退休社区集中的地方，许多长船和阿夫琳港的家庭在这里购置第二居所，夏季人口明显增多；维托斯区则是卡洛韦岭西南端的林场和牧场，林业和乳业延续着传统的乡村生活。由于退休人士和度假居民较多，全市老年人比例较高，劳动年龄人口偏少。居民以维京语为母语的家庭居多，老城保留着木结构的渔屋和小教堂。莫塞是阿夫琳岛西南的交通门户：阿夫琳纵贯高速从这里出发，沿东南岸经维托斯、菲斯克海姆、萨尔塔维克通往阿夫琳港；西格利跨海高速则从西格拉维克跨越西格利海峡在莫塞登陆，向西南通往西格利岛和暖泉；卡洛韦岭公路沿西北岸经维托斯、卡洛韦堡通往帆城。莫塞海湾明净、生活闲适，是群岛人心目中理想的海边小城。
    en: "A seaside city at the south-western tip of Aveline Island, facing Longship Island across the Aveline Strait, living by its bay, holiday homes and forestry, with two districts, Måsey and Hvitås. The city, whose name means gull island in Viking, takes its name from the flocks of herring gulls over Måsvik Bay, a broad bay with white beaches; Pilot Isle off its mouth was once where pilots waited for ships entering or leaving the Aveline Strait and is now a holiday island. About four hundred thousand people live here and services make up most of the economy. Måsey District gathers holiday homes, seaside hotels and retirement communities, many families from Longship and Port Aveline keep second homes here, and the population swells noticeably in summer; Hvitås is forest holdings and pasture at the south-western end of Calloway Ridge, where forestry and dairy keep up the old country life. With so many retired people and holiday residents, the share of older people is high and the working-age share is low. Most families speak Viking, and the old town keeps its timber fishing huts and small churches. Måsey is the south-western gateway of Aveline Island: the Aveline Spine Expressway starts here and runs along the south-east coast through Hvitås, Fiskheim and Saltavik to Port Aveline; the Sigley Sea Crossing comes ashore at Måsey from Siglavik across the Sigley Strait, heading on to Sigley and Warmspring; and the Calloway Ridge Road follows the north-west shore through Hvitås and Fort Calloway to Sail Town. With its clear bay and easy pace, Måsey is many islanders' idea of the perfect seaside town."
