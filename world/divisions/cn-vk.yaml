  traits: { industries: [tidal, fishing, commerce] }
  notes:
    zh: 弗洛德维克市唯一的区，海峡沿岸的潮汐电站、海鲜市场与渔港构成了这里的日常。弗洛德维克潮汐电站的大坝横跨海湾口，坝上设有观景步道和展示中心，游客可以看到涨潮时海水涌入水轮机、退潮时湾内水位缓缓下降的景象，展示中心讲解潮汐发电的原理，是学生和游客的热门去处。渔港里停满了拖网船和小型渔船，渔民凌晨出海、清晨归港，弗洛德维克海鲜市场的拍卖大厅里买家云集，市场旁的海鲜餐馆以清蒸螃蟹、鳕鱼汤和熏贻贝闻名，周末许多长船人专程驱车来这里吃海鲜。区内的居民区沿海湾和山坡分布，老渔村的木屋和新建的公寓并存，社区里有学校、诊所和商业街，居民以维京语为母语的家庭居多，许多人在电站、渔港和市场工作。长船西北岸公路从这里出发，沿海岸向东北经西岸区通往北岬；阿克斯跨海高速的引桥从区的北部伸向海峡，晴天时可以看到对岸阿克斯岛的山影。弗洛德维克的海风里带着咸味，潮起潮落间，渔船出海归来，这座小城始终与大海同呼吸。
    en: The only district of Flodvik City, where the tidal power station, the seafood market and the fishing harbour on the strait make up daily life. The dam of the Flodvik Tidal Power Station spans the mouth of the bay, with a walkway and visitor centre on top; visitors watch the sea rush into the turbines on the flood and the water in the bay slowly fall on the ebb, and the centre explains how tidal power works, a favourite outing for pupils and tourists. The harbour is packed with trawlers and small boats; fishermen leave before dawn and return in the early morning, buyers crowd the auction hall of the seafood market, and the restaurants beside it are known for steamed crab, cod soup and smoked mussels, so many Longship people drive out at weekends just to eat. Homes spread along the bay and up the hillside, old fishing-village cottages beside new flats, with schools, a clinic and a shopping street; most families speak Viking, and many people work at the power station, the harbour or the market. The Longship North-West Shore Road starts here and follows the coast north-east through West Shore to North Cape, and the approach viaduct of the Akkersey Strait Crossing reaches out over the strait from the north of the district; on clear days you can see the mountains of Akkersey across the water. The sea wind here tastes of salt, boats go out and come home with the tides, and this small city breathes with the sea.

# ── 阿夫琳岛 ──
