  notes:
    zh: 长船岛西南端的「船尾」，渔村、牧场与船尾岛构成区里的风景，是舵港市的乡村地区。区内的海岸线曲折绵长，渔村散布在小港湾里，渔民驾驶小型渔船在近海捕捞鳕鱼、黑线鳕和螃蟹，鱼干晾架和红色渔屋是这里的标志；内陆是起伏的草坡和牧场，奶牛和绵羊在海风中放牧，家庭乳品厂生产的黄油和奶酪是区里的特产，渔业和乳业是居民的主要生计，第一产业比重在全群岛名列前茅。船尾岛位于长船岛西南端外海，岛上只有一座灯塔和几户渔家，是海鸟和海豹的栖息地。群岛跨海高速和锚舵跨海高速都经船尾特大桥在这里登陆，近岸以隧道穿过船尾的岬角。近年来，乡村旅游在船尾兴起，游客可以住进渔家民宿、跟随渔民出海、在牧场里体验挤奶和制作奶酪，海岸步道沿着悬崖延伸，可以眺望暖泉岛的火山。龙骨山公路的终点就在区内，向北经舵港、龙骨通往长滩，是船尾的乡间主路。中文和维京语母语者大约各占一半，许多家庭世代在这里捕鱼放牧，年轻人多到舵港和长船工作，老年人比例较高。船尾宁静、质朴，保留着群岛最传统的渔牧生活。
    en: "The \"stern\" at the south-western tip of Longship Island, where fishing villages, pastures and Stern Isle make up the scenery; it is the countryside of Rudderhaven. The coast is long and indented, with fishing villages tucked into small coves; fishermen take cod, haddock and crab close to shore in small boats, and drying racks and red fishing huts are the local emblem. Inland lie rolling grassy slopes and pastures where cows and sheep graze in the sea wind, and the butter and cheese of the family creameries are the district's speciality. Fishing and dairy are the main livelihoods, and farming and fishing take as large a share of output as almost anywhere in the islands. Stern Isle lies offshore beyond the south-western tip, with only a lighthouse and a few fishing households, a haunt of seabirds and seals. The Island Chain Expressway and the Anchor–Rudder Sea Crossing both come ashore here on the Stern Sea Bridge and tunnel through the headland. Rural tourism has grown in recent times: visitors stay in fishermen's guesthouses, go out with the boats and try milking and cheese-making on the farms, and a coast path along the cliffs looks out to the volcano on Warmspring Island. The Keel Hills Road ends in the district and runs north through Rudderhaven and Keel to Longbeach, Stern's main country road. Chinese and Viking speakers are roughly even in number; many families have fished and farmed here for generations, young people tend to leave for jobs in Rudderhaven and Longship, and the share of older people is high. Quiet and plain, Stern keeps the most traditional fishing and farming life in the islands."
