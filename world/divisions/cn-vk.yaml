  notes:
    zh: 群岛东部外海的海岛城市，以晨光岛和东极岛组成，以日出旅游、海上风电和渔业为生，全市只设晨光一区。晨光岛面积三千六百多平方公里，位于群岛的东端，岛上的晨光镇因每天最早迎来群岛的第一缕阳光而得名，清晨在海边看日出是游客必做的事；东极岛在晨光岛东侧，是群岛东端的小岛。旅游是全市最重要的产业，日出、观鸟和海岛徒步吸引着来自长船和白帆的游客；晨光海峡的滩涂是候鸟迁徙的重要停歇地，春秋两季成千上万的水鸟在这里觅食。外海的海上风电场是城市的新兴产业，风电运维为岛上提供了技术岗位；渔民在东部外海捕捞鳕鱼和鲱鱼，渔业仍是传统生计。全市人口约三十五万，由于岛上学校和就业机会有限，许多年轻家庭迁往白帆和长船，儿童比例在群岛各市中最低，老年人比例较高，居民以维京语为母语的家庭居多。晨光岛的对外交通依靠西岸的晨光渡轮码头，渡轮往返白帆岛的灯塔区；晨光公路自晨光镇横穿全岛到达码头，大半路段位于贴着滩涂的晨光海峡跨海大桥上，桥下潮水自由进出。晨光是群岛最早迎来新一天的地方，宁静而充满希望。
    en: An island city in the open sea east of the chain, made up of Dawnlight Island and Far East Isle and living by sunrise tourism, offshore wind and fishing, with a single district, Dawnlight. Dawnlight Island covers more than 3,600 square kilometres at the eastern end of the islands, and Dawnlight town is named because it is the first place in the islands to see the morning sun; watching the sunrise from the shore is a must for every visitor. Far East Isle lies to its east, a small island at the very end of the chain. Tourism is the biggest trade, with sunrises, birdwatching and island walks drawing visitors from Longship and White Sail; the mudflats of the Dawnlight Strait are an important stopover for migrating birds, and in spring and autumn tens of thousands of waterbirds feed there. An offshore wind farm is the city's new industry, and turbine maintenance has brought skilled jobs to the island; fishermen take cod and herring in the eastern waters, and fishing remains the traditional livelihood. About 350,000 people live here. Schools and jobs on the island are few, so many young families have moved to White Sail and Longship; the share of children is the lowest of any city in the islands, the share of older people is high, and most families speak Viking. The island depends on the Dawnlight Ferry Terminal on the west shore, with ferries to the Lighthouse District of White Sail Island, and the Dawnlight Road runs from Dawnlight town across the island to the terminal, more than half of it on the low Dawnlight Strait Bridge over the mudflats, with the tide flowing freely beneath. The first place in the islands to greet each new day, Dawnlight is quiet and full of hope.
