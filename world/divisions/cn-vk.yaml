  notes:
    zh: 埃德文港市唯一的区，埃德文岛、东极岛与埃德文海峡的滩涂构成了全区的风景。埃德文港镇坐落在岛的东岸，面朝开阔的大洋，镇上的日出观景台、灯塔和海边步道是游客清晨最集中的地方，天晴时太阳从海平面跃出，把海面和小镇的彩色木屋染成金色；许多游客前一晚住在镇上的民宿，或者清晨从西岸的渡轮码头驱车赶来看日出。东极岛位于埃德文岛东侧，面积三百多平方公里，岛上只有一座灯塔和几户渔家，是群岛东端的标志，乘小船可以登岛。埃德文海峡的滩涂是候鸟迁徙的重要停歇地，春秋两季鹬类、鸻类和雁鸭成群聚集，埃德文海峡跨海大桥贴着滩涂延伸，桥下潮水自由进出，候鸟季节桥上禁止停车，观鸟需到两端的观测点。外海的风电场由岛上的运维人员负责检修，风电和渔业为居民提供了稳定的收入，旅游则带来季节性的繁荣。区内人口约十八万，儿童比例较低，老年人比例较高，居民以维京语为母语的家庭居多。埃德文港公路连接埃德文港镇与西岸的埃德文港渡轮码头，渡轮往返阿夫琳岛灯塔区，清晨和渡轮靠岸前后路上最为热闹。埃德文港的每一天都从海上的第一缕阳光开始。
    en: The only district of Port Edevane, its scenery made of Edevane Island, Far East Isle and the mudflats of the Edevane Strait. Port Edevane town stands on the east coast facing the open ocean, and its sunrise lookout, lighthouse and seafront path are where visitors gather in the early morning; on clear days the sun leaps from the sea and turns the water and the town's painted timber houses gold. Many visitors spend the night in the town's guesthouses, or drive over at dawn from the ferry terminal on the west coast to watch the sunrise. Far East Isle, east of Edevane Island, covers more than three hundred square kilometres with only a lighthouse and a few fishing households; it marks the eastern end of the islands and can be reached by small boat. The mudflats of the Edevane Strait are an important stopover for migrating birds, with sandpipers, plovers, geese and ducks gathering in flocks in spring and autumn; the Edevane Strait Bridge runs just above the flats with the tide flowing freely beneath, stopping on it is banned in the migration season, and birdwatchers use the viewing points at either end. Island technicians maintain the offshore wind farm, so wind and fishing give residents a steady income while tourism brings a seasonal boom. About 177,000 people live here; the share of children is low and that of older people high, and most families speak Viking. The Port Edevane Road links Port Edevane town with the Port Edevane Ferry Terminal on the west shore, where ferries sail to the Lighthouse District of Aveline Island, and it is busiest at dawn and around the ferry times. Every day in Port Edevane begins with the first ray of sun on the sea.
