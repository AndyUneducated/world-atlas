  notes:
    zh: 西格利岛南部的南桅区，笔直高大的松林、牧场与乳品农场占据了岛的大部分，是西格拉维克市的乡村地区。西格利岛的松林是全岛最有名的风景，松树挺拔笔直，树龄多在百年以上，过去是造船桅杆的上等材料，如今大部分松林按照可持续的方式经营，木材加工厂生产建材和木制品，林业工人和护林员是区里的重要劳动力。林间的空地和缓坡上分布着牧场和乳品农场，奶牛在松林边放牧，农场生产的奶酪和黄油带着松林和海风的气息，是西格利岛的特产；第一产业在全区经济中的比重在群岛各区中最高，乳业、林业和森林旅游是居民的主要生计。森林徒步、骑马和林间木屋吸引着来自长船和阿夫琳港的游客，秋冬季节偶尔能在林间看到驼鹿和鹿群。西格利岛公路自南桅出发，几乎笔直地穿过松林通往北端的西格拉维克，两侧松林夹道，路上方架着供松鼠等小动物通过的树冠绳桥，是岛上最有名的景观路。区内人口约十万，分散在松林间的村庄和农场里，年轻人多外出工作，老年人比例在群岛位居前列，居民以维京语为母语的家庭居多。南桅的松林幽深宁静，是西格利岛最原汁原味的一面。
    en: South Mast, in the south of Sigley, where tall, straight pines, pastures and dairy farms cover most of the island; it is the countryside of Siglavik. The pine forest is the island's best-known sight. The trees grow tall and straight, many over a century old, and were once prized for ships' masts; today most of the forest is managed sustainably, sawmills make building timber and wood products, and foresters and rangers are an important part of the workforce. Pastures and dairy farms fill the clearings and gentler slopes, cows graze at the forest's edge, and cheese and butter tasting of pine and sea wind are the island's speciality. Farming and forestry take a larger share of output here than in any other district in the islands, and dairy, forestry and forest tourism are the main livelihoods. Forest walks, riding and cabins in the woods draw visitors from Longship and Port Aveline, and in autumn and winter elk and deer are sometimes seen among the trees. The Sigley Road starts in South Mast and runs almost dead straight through the pines to Siglavik at the northern end, the forest close on both sides and canopy rope bridges overhead for squirrels and other small animals, the island's best-known scenic road. About a hundred thousand people live scattered in villages and farms among the pines; young people mostly leave for work, the share of older people is among the highest in the islands, and most families speak Viking. Deep and quiet, South Mast's pine forest is Sigley at its most authentic.
