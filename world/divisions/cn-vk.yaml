    zh: 奥斯特哈门区
    en: Austhamn District
    art-x-viking: Austhamn
    art-x-buckham: Porto Est
  codes:
    admin: '910104'
  population: 440000
  area_km2: 1800.0
  traits: { industries: [port, logistics, shipbuilding] }
  notes:
    zh: 长船岛东南岸的港口区，集装箱码头、物流园和船员新村沿海岸排开，是长船的工业与物流基地，人口四十多万。奥斯特哈门集装箱码头是维京群岛最繁忙的集装箱港之一，大型集装箱船从这里驶往北维京岛和世界各地，码头后方的物流园、冷链仓库和配送中心为整个长船都市区供应货物；码头附近的修船厂、海工装备厂和船舶配件企业形成了完整的船舶产业链。港口、物流和船舶工业是区里的支柱，大量码头工人、卡车司机、船员和技工在这里工作和生活。船员新村是为远洋船员及其家属建设的住宅区，配有船员服务中心、海员教堂和国际学校，来自世界各地的船员在这里歇脚。奥斯特哈门港口高速从古城经汇金区直达码头，集装箱卡车昼夜不停地往返于港口和城区之间。区内居民以工薪家庭为主，说中文、维京语和英语的人都很多，社区里有许多平价餐馆、超市和市场。奥斯特哈门的海岸虽然布满码头和吊机，但南端仍保留着一段海滩和滨海公园。奥斯特哈门区勤劳而繁忙，是长船经济的「动力舱」。
    en: The port district on the south-east shore of Longship Island, where container terminals, logistics parks and seafarers' housing line the coast. It is Longship's industrial and logistics base, home to more than four hundred thousand people. The Austhamn Container Terminal is one of the busiest container ports in the Viking Islands, sending large container ships to North Viking Island and the wider world, and the logistics parks, cold stores and distribution centres behind the quays supply the whole Longship area. Ship repair yards, offshore equipment plants and ship-parts makers near the terminal complete a shipbuilding chain. The port, logistics and shipbuilding are the mainstays, and large numbers of dockers, lorry drivers, seafarers and technicians work and live here. The seafarers' village was built for deep-sea crews and their families, with a seafarers' centre, a seamen's church and an international school, and crews from all over the world rest here between voyages. The Austhamn Port Expressway runs from Fornstad through Goldmark to the quays, and container trucks shuttle between port and city day and night. Residents are mostly working families; Chinese, Viking and English are all widely spoken, and the neighbourhoods have plenty of cheap restaurants, supermarkets and markets. Though the shore is lined with quays and cranes, a stretch of beach and a seaside park survive at the southern end. Hard-working and busy, Austhamn is the engine room of Longship's economy.
