    zh: 阿克斯岛东南岸的造船区，造船厂、船坞与海工装备基地沿阿克斯海峡排开，是维京群岛重要的工业基地。阿克斯维克造船厂拥有多座大型干船坞和船台，能够建造大型集装箱船、滚装渡轮、液化气运输船和海上风电安装船，也为群岛和北维京岛的渡轮、渔船和军舰提供维修和改装服务；周边的海工装备厂建造钻井平台、海上风电基础和海底管道，船舶配件、钢结构和船用电气企业形成了完整的产业链。造船和制造业是区里的绝对支柱，第二产业占全区产出的一半以上，上万名焊工、钳工、电工、工程师和设计师在船厂工作，许多家庭几代人都是造船工人。区内的居住区围绕船厂分布，有职工住宅、技工学校、医院和体育中心，维京语是社区里最主要的母语。阿克斯跨海高速和阿克斯岛纵贯高速都经过这里，阿克斯维克湾公路向西通往阿克斯维克区的港口和西爪区。阿克斯海峡是群岛最繁忙的航道之一，新船下水时，造船厂会举行传统的下水仪式，市民聚集在岸边观看巨轮滑入海峡。瑙斯特海姆区以精湛的造船工艺和坚韧的工匠精神闻名，是群岛航海传统的现代延续。
    en: The shipbuilding district on the south-east shore of Akkersey, where shipyards, docks and offshore yards line the Akkersey Strait; it is one of the main industrial bases in the Viking Islands. The Akkersvik Shipyard has several large dry docks and slipways and can build big container ships, ro-ro ferries, gas carriers and wind-turbine installation vessels, and it repairs and refits ferries, fishing boats and naval ships for the islands and North Viking Island. Around it, offshore yards build drilling platforms, offshore wind foundations and subsea pipelines, and makers of ship parts, steel structures and marine electrics complete the chain. Shipbuilding and manufacturing are the district's overwhelming mainstay, industry produces more than half of the district's output, and more than ten thousand welders, fitters, electricians, engineers and designers work in the yards; in many families three generations have built ships. Housing clusters around the yards, with staff homes, a technical school, a hospital and a sports centre, and Viking is the most common first language. The Akkersey Strait Crossing and the Akkersey Spine Expressway both pass through, and the Akkersvik Bay Road runs west to the port in Akkersvik Bay and to West Fluke. The Akkersey Strait is one of the busiest waterways in the islands, and when a new ship is launched the yard holds a traditional ceremony while townspeople line the shore to watch the hull slide into the strait. Naustheim is known for its fine shipbuilding and the tenacity of its craftsmen, a modern continuation of the islands' seafaring tradition.
