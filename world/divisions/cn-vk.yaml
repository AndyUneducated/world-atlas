  notes:
    zh: 卡洛韦岭东麓的住宅区、果园与观景山道，是阿夫琳港市面积最大的区。区内的地势从海岸向卡洛韦岭缓缓抬升，山坡上种满了苹果、梨和樱桃，春季果花盛开，秋季果实累累，果园采摘和果酒作坊吸引着城里人周末前来；山麓的谷地里分布着家庭农场和牧场，为阿夫琳港提供蔬菜、奶制品和肉类。随着阿夫琳港城区的扩展，越来越多的家庭搬到望海的新住宅区，享受山海之间的宁静生活，居住服务、农业和乡村旅游是区里的主要产业。卡洛韦垭口是翻越卡洛韦岭的山口，观景山道盘旋而上，垭口的观景台可以眺望阿夫琳港、长船岛和远处的群岛，是阿夫琳港最受欢迎的观景点。萨尔塔维克海滨公路的终点就在区内，向南经萨尔塔维克通往菲斯克海姆。区内居民来源多元，以中文、维京语和巴克汉姆语为母语的家庭混居，年轻家庭和退休人员都不少。望海区山海相依、四季分明，是阿夫琳港人心中的后花园。
    en: Housing, orchards and scenic mountain roads on the eastern slopes of Calloway Ridge, and the largest district of Port Aveline by area. The land rises gently from the coast towards the ridge. The slopes are planted with apples, pears and cherries, white with blossom in spring and heavy with fruit in autumn, and pick-your-own orchards and cider workshops bring townspeople out at weekends. Family farms and pastures fill the valleys at the foot of the hills, supplying Port Aveline with vegetables, dairy and meat. As the city has grown, more and more families have moved to Seawatch's new housing for a quiet life between the mountains and the sea, so residential services, farming and rural tourism are the main trades. The Calloway Saddle is the pass over the ridge; a scenic road winds up to the viewpoint at the top, which looks out over Port Aveline harbour, Longship Island and the islands beyond, Port Aveline's most popular viewpoint. The Saltavik Coast Road ends in the district and runs south through Saltavik to Fiskheim. Residents come from many backgrounds, with Chinese-, Viking- and Buckham-speaking families side by side and plenty of both young families and retirees. Between mountain and sea, with four distinct seasons, Seawatch is Port Aveline's back garden.
