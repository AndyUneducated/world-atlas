  flag_notes:
    zh: "深蓝底上一只金色的锚。阿克斯维克在维京语里意为「锚湾」，阿克斯岛形如船锚，城市就坐落在两只锚爪之间水深浪静的海湾里；金锚代表群岛吞吐量最大的集装箱港和造船基地，深蓝是远洋航线通往的大海。瑙斯特海姆船厂下水的每一艘船，都挂着这面旗出港。"
    en: "A gold anchor on deep blue. Akkersvik means 'anchor bay' in Viking: the island is shaped like an anchor and the city lies in the deep, calm bay between its flukes. The anchor is the islands' busiest container port and their shipbuilding base, the blue the ocean its routes cross. Every ship launched from the city's yards leaves harbour flying it."
  traits: { industries: [port, shipbuilding, logistics, finance], heritage: viking, age: balanced }
  notes:
    zh: 阿克斯岛西南部的港口城市，群岛最大的集装箱港与造船基地，人口约七十万，是群岛第二大城市。阿克斯维克在维京语里意为「锚湾」，因阿克斯岛形如船锚、城市坐落在两只锚爪之间的阿克斯维克湾而得名，港湾水深浪静，自古就是群岛最好的避风港。全市的经济以港口和船舶为核心：阿克斯维克区的阿克斯维克集装箱港是群岛吞吐量最大的港口，远洋航线通往世界各地；瑙斯特海姆区的造船厂、船坞和海工装备基地建造集装箱船、渡轮、海上风电安装船和钻井平台，是群岛重要的工业基地；链城区是城市中心，群岛航运交易所、船级社和航运金融机构集中在这里，阿克斯维克机场也在区内；西爪区则是西爪岬一带的住宅区、牧场和海岸步道。港口、造船、物流和航运金融共同支撑起阿克斯维克的经济，劳动年龄人口比例较高。阿克斯维克的居民以维京语为母语的家庭居多，船员、码头工人和造船工人构成了城市的主体，航海传统深入人心。阿克斯跨海高速经阿克斯海峡从瑙斯特海姆区通往弗洛德维克，阿斯跨海高速通往斯蒂尔维克，阿克斯岛纵贯高速向北通往富鲁海姆，阿托高速通往托克维克。阿克斯维克是维京群岛的工业心脏和海上门户。
    en: The port city in the south-west of Akkersey, the islands' largest container port and shipbuilding base and, with about 700,000 people, the second-largest city in the chain. Akkersey is shaped like a ship's anchor and the city lies on Akkersvik Bay between its two flukes; the deep, calm bay has always been the best shelter in the islands. Port and ships are the core of the economy. The Port of Akkersvik in Akkersvik Bay handles more containers than any other port in the islands, with deep-sea routes to the whole world. The shipyards, docks and offshore yards of Naustheim District build container ships, ferries, wind-turbine installation vessels and drilling rigs, one of the main industrial bases in the islands. Chain Town is the city centre, home to the Islands Shipping Exchange, classification societies and shipping financiers, and to Akkersvik Airport, while West Fluke is housing, pasture and coastal paths around the West Fluke headland. Port, shipbuilding, logistics and shipping finance carry the economy together, and the share of working-age adults is high. Viking-speaking families are the majority; seafarers, dockers and shipbuilders make up the heart of the city, and the seafaring tradition runs deep. The Akkersey Strait Crossing runs from Naustheim across the strait to Flodvik, the Anchor–Rudder crossing runs to Styrvik, the Akkersey Spine Expressway heads north to Furuheim and another expressway runs to Tåkevik. Akkersvik is the industrial heart and sea gate of the Viking Islands.
