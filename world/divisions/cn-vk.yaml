  notes:
    zh: 维京群岛西部的外围岛屿，由鲸岛、鸟崖岛、海雀岛和许多小岛组成，以观鲸、海鸟和渔村闻名。全市人口约二十五万，分布在鲸岛和鸟崖岛沿岸的渔村与小镇里，与群岛主岛之间只靠渡轮相连，岛与岛之间则由一条外屿跨海公路串起，是群岛最偏远的城市之一。外屿海峡和观鲸湾是座头鲸、虎鲸和小须鲸夏季洄游的通道，鲸岛的观鲸船和观鲸中心吸引着来自世界各地的游客；鸟崖岛的悬崖上栖息着数十万只海鹦、海雀和三趾鸥，是群岛重要的海鸟繁殖地，大部分划为自然保护区。旅游和渔业是全市的两大支柱，渔民在近海捕捞鳕鱼、鲱鱼和龙虾，鱼干、熏鱼和海鲜罐头是外屿的特产。岛上的生活与海洋和天气息息相关，冬季风暴频繁，渡轮常常停航，居民习惯了自给自足的生活。维京语是外屿最主要的母语，许多家庭世代捕鱼，年轻人多到长船和锚港工作，留在岛上的以老人为主，老年人比例较高。外屿跨海公路连接鲸岛和鸟崖两区，鲸岛渡轮码头有航线通往白帆、锚港和长船。外屿风大浪急、天高海阔，是群岛最接近自然的地方。
    en: "The outer islands in the west of the Viking Islands, Whale Isle, Bird Cliff Isle, Puffin Isle and many smaller islets, known for whales, seabirds and fishing villages. About a quarter of a million people live in the fishing villages and small towns along the shores of Whale Isle and Bird Cliff Isle. Only ferries link them with the main islands, and a single causeway road strings the islands together, making this one of the most remote cities in the chain. The Outer Isles Strait and Whalewatch Bay are summer migration routes for humpback, orca and minke whales, and the whale-watching boats and whale centre on Whale Isle draw visitors from around the world. On the cliffs of Bird Cliff Isle hundreds of thousands of puffins, guillemots and kittiwakes nest in one of the islands' great seabird colonies, most of it a nature reserve. Tourism and fishing are the two mainstays: fishermen take cod, herring and lobster close to shore, and dried fish, smoked fish and canned seafood are the islands' specialities. Life follows the sea and the weather; winter storms are frequent, the ferries often stop, and people are used to fending for themselves. Viking is the most common first language and many families have fished for generations; young people tend to leave for jobs in Longship and Anchorhaven, those who stay are mostly older, and the share of elderly people is high. The causeway joins the Whale Isle and Bird Cliff districts, and ferries from the Whale Isle terminal sail to White Sail, Anchorhaven and Longship. Windswept and wide open to sky and sea, the Outer Isles are the closest the islands come to untouched nature."
