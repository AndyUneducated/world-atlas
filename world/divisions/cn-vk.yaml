  flag_notes:
    zh: "金黄底上一根深蓝色的桅杆挂着两面帆，下面是船身。西格利岛上长满笔直高大的松树，过去是造船桅杆的上等材料，岛名和市名在维京语里意为「桅岛」和「桅湾」；金黄是松木的颜色，深蓝是西格利海峡。"
    en: "A deep blue mast with its sails and hull on golden yellow. The island is covered in tall straight pines, once the best mast timber for shipbuilding, and its name and the city's mean 'mast island' and 'mast bay' in Viking; the yellow is pine wood and the blue the strait."
  traits: { industries: [fishing, tourism, port], heritage: viking, age: old }
  notes:
    zh: 西格利岛上的港口城市，坐落在暖泉岛与阿夫琳岛之间的海面上，以渔业、旅游和港口为生，下设西格拉维克和南桅两区。西格利岛面积近六千平方公里，岛上长满笔直高大的松树，这些松木过去是造船桅杆的上等材料，西格利岛和西格拉维克也因此得名（维京语里意为「桅岛」和「桅湾」）。全市人口约三十五万，北端的西格拉维克区是城市中心和港口，渔船在西格利海峡和周边海域捕捞鳕鱼、鲱鱼和贝类，牡蛎岛一带的牡蛎养殖远近闻名；南端的南桅区则是松林、牧场和乳品农场，林业、乳业和森林旅游是那里的主要生计。西格利跨海高速通车后，西格利岛从一个偏远小岛变成暖泉岛与阿夫琳岛之间跨海通道的中转站，岛上建起了服务区和观景台，过境旅游和物流随之兴起，港口与旅游成为城市新的支柱。由于岛上就业机会有限，许多年轻人到长船和阿夫琳港工作，全市老年人比例较高，居民以维京语为母语的家庭居多。西格利跨海高速自暖泉经暖河和长船岛船尾跨海到西格拉维克，再跨越西格利海峡到阿夫琳岛的莫塞，两段海上长桥以西格利岛为中间支点；西格利岛公路穿过松林连接南桅与西格拉维克，是岛上最有名的风景路线。西格拉维克海风清爽、松涛阵阵，是跨海旅途中让人愿意停下脚步的海岛。
    en: "The port city of Sigley, set in the sea between Warmspring and Aveline islands, living by fishing, tourism and the port, with two districts, Siglavik and South Mast. Sigley covers nearly six thousand square kilometres and is covered with tall, straight pines that were once prized for ships' masts, which gave the island and its port their names, mast island and mast bay in Viking. About 350,000 people live here. Siglavik District at the northern end is the centre and port: boats take cod, herring and shellfish in the Sigley Strait and the waters around, and the oysters farmed around Oyster Isle are known far and wide. South Mast at the southern end is pine forest, pasture and dairy farms, living by forestry, dairy and forest tourism. Since the Sigley Sea Crossing opened, Sigley has gone from a remote outpost to a stop on the crossing between Warmspring and Port Aveline, with a service area and lookout on the island, and through-tourism and logistics have grown, making the port and tourism the city's new mainstays. Jobs on the island are few, so many young people leave for Longship and Port Aveline; the share of older people is high and most families speak Viking. The Sigley Sea Crossing runs from Warmspring through Warm River and Longship Island's stern over the sea to Siglavik, then across the Sigley Strait to Måsey on Aveline Island, its two long sea viaducts resting on Sigley in the middle, and the Sigley Road runs through the pines between South Mast and Siglavik, the island's best-known scenic drive. With its fresh sea wind and the sound of the pines, Siglavik is the island where travellers on the crossing are glad to stop."
