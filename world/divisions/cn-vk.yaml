# Administrative divisions of the Territory of the Viking Islands (CN-VK).
# id: stable internal key, referenced by other files. codes.admin: 6-digit hierarchical code (GB/T 2260 pattern:
# territory 910000, city 910100, district 910101); may change on reorganisation.
# subtype follows Overture Maps divisions: country > dependency/region > locality > borough.
divisions:
- id: div_raat4g
  subtype: dependency
  parent: country:CN
  status: generated
  names:
    zh: 维京群岛领地
    en: Territory of the Viking Islands
    art-x-viking: Subleland auf Veiling Ysear
    art-x-buckham: Smalaland en Etei Viking
  short_names:
    zh: 维京群岛
    en: Viking Islands
  codes:
    iso3166_1:
      alpha2: VK
      alpha3: VKI
      numeric: '902'
    iso3166_2: CN-VK
    admin: '910000'
  motto:
    zh: 向海而生
    en: Born of the Sea
  capital: div_3cvg2q
  route_shield: maritime
  operators:
    expressway: { zh: 维京群岛跨海交通集团, en: Viking Islands Sea Crossings Group }
    highway: { zh: 维京群岛公路局, en: Viking Islands Highways Authority }
    rail: { zh: 维京群岛铁路公司, en: Viking Islands Railway Company }
  emblem:
    motif: longship
    pattern: waves
  notes:
    zh: 北维京岛西南外海的群岛，长船、白帆、锚岛、暖泉四座大岛与三十多座中小岛屿。航运与造船、离岸金融与总部经济、海上风电与地热、渔业和邮轮旅游是群岛的支柱；首府长船是人口最多的城市
    en: An archipelago off the south-west of North Viking Island, four large islands (Longship, White Sail, Anchor and Warmspring) and more than thirty smaller ones. Shipping and shipbuilding, offshore finance and head offices, offshore wind and geothermal power, fishing and cruise tourism keep the islands going; the capital, Longship, is the most populous city.

