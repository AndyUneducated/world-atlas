  flag_notes:
    zh: "蓝底，右下方一片弧形的沙色海滩，沿岸一道白色浪线，左上角一颗金色四芒星。海滩是南岸绵长的沙滩，蓝色是群岛南部外海温和的海水，金星是航海者的守护圣人圣翁丁，也是渔民夜里辨认方向的那颗星。这是群岛唯一画着海滩的市旗，在一片纹章旗中格外显眼。"
    en: "Blue, with a curving sand-coloured beach in the lower fly edged by a white line of surf, and a gold four-pointed star in the upper hoist. The beach is the long sands of the south shore, the blue the mild water of the southern sea, and the star Saint Ondine, the seafarers' patron, the star fishermen steer by at night. It is the only city flag in the islands with a beach on it, and stands out among their banners of arms."
  traits: { industries: [tourism, fishing], heritage: viking, age: old }
  notes:
    zh: 群岛最南端的海岛城市，以海滨度假和渔业为生，全市只设圣翁丁一区。圣翁丁岛面积五千多平方公里，位于群岛南部外海，岛上的圣翁丁镇以航海者的守护圣人圣翁丁命名，南岸绵长的沙滩和温和的海水使这里成为群岛最受欢迎的夏季度假地之一。旅游是全市最重要的产业，圣翁丁海滨度假村、海滨别墅和露营地沿南岸分布，夏季日落很晚，晚上十点仍可以在沙滩上看落日，度假的家庭和年轻人从长船、阿夫琳港乘渡轮蜂拥而至；渔业是另一大生计，渔民在南部外海捕捞鲭鱼、鲱鱼和螃蟹，海鲜餐馆和渔家民宿与旅游业相辅相成。全市人口约二十三万，人均产出在群岛各市中偏低，经济的季节性很强，冬季游客稀少，许多年轻人到阿夫琳港和长船工作，老年人比例在群岛各市中最高，居民以维京语为母语的家庭居多。圣翁丁岛的对外交通全靠北岸的圣翁丁渡轮码头，渡轮往返阿夫琳岛的萨尔塔维克；圣翁丁公路是岛上唯一的干线公路，从圣翁丁镇翻过全岛到达渡轮码头，山顶的观景台可以同时眺望南北两侧的海面。圣翁丁远离尘嚣、阳光充足，是群岛人心中的夏日乐园。
    en: "The southernmost island city of the chain, living by seaside holidays and fishing, with a single district, Saint-Ondine. Saint-Ondine Island covers more than five thousand square kilometres in the open sea south of the islands; Saint-Ondine town is named after the patron saint of seafarers, and the long beaches and mild water of the south coast make it one of the islands' favourite summer holiday places. Tourism is the city's biggest trade. The Saint-Ondine Beach Resort, seaside villas and campsites line the south coast; on summer evenings the sun sets so late that people watch it from the beach at ten at night, and families and young people pour in by ferry from Longship and Port Aveline. Fishing is the other livelihood: fishermen take mackerel, herring and crab in the southern waters, and seafood restaurants and fishermen's guesthouses go hand in hand with the holiday trade. About 230,000 people live here; output per head is on the low side for the islands and the economy is highly seasonal, with few visitors in winter, many young people leave to work in Port Aveline and Longship, the share of older people is the highest of any city in the islands, and most families speak Viking. The island's only link with the outside is the Saint-Ondine Ferry Terminal on the north shore, with ferries to Saltavik on Aveline Island, and the Saint-Ondine Road, the island's only through road, runs from Saint-Ondine town over the island to the terminal, its hilltop lookout taking in the sea to both north and south. Remote and sunny, Saint-Ondine is the islanders' summer paradise."
