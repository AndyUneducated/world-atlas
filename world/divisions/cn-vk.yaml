  notes:
    zh: 阿克斯岛西南端两只锚爪之间的阿克斯维克湾，群岛最大的集装箱港所在地。阿克斯维克湾面积七百多平方公里，水深浪静，湾口有卡蒂马苏克岛屏障，大型集装箱船和散货船可以全天候进出；阿克斯维克集装箱港沿湾岸排开数十个泊位，岸桥林立，堆场一望无际，是群岛吞吐量最大的港口，也是远洋航线上的重要中转港。港区后方是物流园、保税仓库、冷链中心和集装箱维修厂，港口与物流是区里的支柱，码头工人、船员、报关员和卡车司机构成了社区的主体。阿克斯维克区也是群岛的交通枢纽：阿克斯岛纵贯高速和阿斯跨海高速都从这里出发，前者向北经瑙斯特海姆、链城和尤普峡湾通往富鲁海姆，后者跨海通往长船岛的斯蒂尔维克；阿克斯维克湾公路则连接西爪和瑙斯特海姆两区。东爪岬是阿克斯维克湾东侧的岬角，岬上的灯塔为进港船只导航。区内居民以维京语为母语的港口家庭居多，社区里有海员教堂、船员俱乐部和多语种学校，劳动年龄人口比例很高。夜晚的阿克斯维克湾灯火通明，岸桥和货轮的灯光倒映在湾水中，港口的汽笛声此起彼伏。阿克斯维克湾是阿克斯维克的立市之本，也是群岛连接世界的海上门户。
    en: "Akkersvik Bay, between the two flukes at the south-western tip of Akkersey, home of the largest container port in the islands. The bay covers more than seven hundred square kilometres, deep and calm, sheltered at its mouth by Kattimasuq Island, so large container ships and bulk carriers can come and go in any weather. The Port of Akkersvik lines the shore with dozens of berths, forests of cranes and container yards stretching out of sight; it handles more cargo than any other port in the islands and is an important transhipment port on the ocean routes. Behind the quays lie logistics parks, bonded warehouses, cold stores and container repair yards; port and logistics are the mainstays, and dockers, seafarers, customs brokers and lorry drivers make up most of the community. Akkersvik Bay is also the islands' transport hub: the Akkersey Spine Expressway and the Akkersvik–Styrvik Sea Crossing both start here, the first running north through Naustheim, Chain Town and Djupfjord to Furuheim and the second across the sea to Styrvik on Longship Island, while the Akkersvik Bay Road links West Fluke and Naustheim. East Fluke is the headland on the east side of the bay, its lighthouse guiding ships into port. Residents are mostly Viking-speaking port families, the neighbourhoods have a seamen's church, a seafarers' club and multilingual schools, and the share of working-age adults is very high. At night the bay blazes with light, cranes and ships reflected in the water and horns sounding across the harbour. Akkersvik Bay is the reason Akkersvik exists, and the islands' sea gate to the world."
