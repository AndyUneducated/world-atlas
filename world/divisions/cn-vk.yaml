  flag: { layout: banner, colors: ['#2F3E4E'], charge: lighthouse, charge_color: '#FFFFFF' }
  flag_notes:
    zh: "暗灰蓝底上一座白色灯塔，灯光向两侧射出。托克维克在维京语里意为「雾湾」，海湾常年笼罩在海雾中，灰蓝是雾里的海面，灯塔是为渔船引路的灯光。雾大的清晨港口只听得见雾笛，市民说这面旗「平时看着阴沉，起了雾才看得出它的用处」。"
    en: "A white lighthouse casting its beams on dark grey-blue. Tåkevik means 'fog bay' in Viking and lies under sea fog much of the year: the grey-blue is the sea in the mist and the lighthouse the light that guides the fishing boats home. On foggy mornings only the foghorn can be heard in the harbour, and residents say the flag looks gloomy until the fog comes in."
  traits: { industries: [fishing, wind, tourism], heritage: viking, age: old }
  notes:
    zh: 阿克斯岛西岸的雾港城市，常年多雾，以渔业、海产养殖、海上风电和峡湾旅游为生，下设托克维克和峡湾两区。托克维克在维京语里意为「雾湾」，城市因海湾常年笼罩在海雾中而得名，湿润的西风从大洋吹来，在锚链山前凝成浓雾，清晨的港口常常只能听见雾笛和渔船的马达声。全市人口约四十五万，面积一万两千多平方公里，大部分是锚链山的山地和西岸深切的峡湾。托克维克区是城市的中心和渔港，渔船在西岸外海捕捞鳕鱼、鲱鱼和鲭鱼，峡湾里的网箱养殖鲑鱼和贻贝，海产加工和冷链运输是传统支柱；近年外海建起了海上风电场，风电运维成为新的增长点。尤普峡湾区则是深切的峡湾、瀑布和森林，峡湾观光和林业是那里的主要产业。由于山多地少、交通曾经不便，许多年轻人外出工作，全市老年人比例在群岛位居前列，居民以维京语为母语的家庭居多。阿托高速从阿克斯维克链城区出发，以隧道穿过锚链山主脊，经尤普峡湾区到托克维克，是西岸通往阿克斯维克的快速通道；阿克斯岛峡湾公路则从链城经托克维克沿峡湾北上通往富鲁海姆。托克维克雾中藏港、峡湾深邃，是阿克斯岛最有神秘气息的城市。
    en: "The fog-bound port city on the west coast of Akkersey, living by fishing, fish farming, offshore wind and fjord tourism, with two districts, Tåkevik and Djupfjord. The city, fog bay in Viking, is named for the sea fog that hangs over its bay most of the year: damp westerlies off the ocean condense into thick fog against the Anchor Chain Mountains, and on many mornings all you can hear in the harbour is the foghorn and the engines of fishing boats. About 450,000 people live here, in more than twelve thousand square kilometres made up mostly of the Anchor Chain Mountains and the deep fjords of the west coast. Tåkevik District is the centre and fishing port: boats take cod, herring and mackerel off the west coast, net pens in the fjords raise salmon and mussels, and seafood processing and cold-chain haulage are the traditional mainstays, while a wind farm built offshore in recent times has made turbine maintenance a new source of growth. Djupfjord District is deep fjords, waterfalls and forest, living by fjord tourism and forestry. Mountains are many, flat land scarce and the roads were long poor, so many young people have left; the share of older people is among the highest in the islands, and most families speak Viking. The Akkersvik–Tåkevik Expressway starts from Chain Town in Akkersvik, tunnels under the main ridge of the Anchor Chain Mountains and runs through Djupfjord District to Tåkevik, the fast road between the west coast and Akkersvik, and the Akkersey Fjord Road runs from Chain Town through Tåkevik and north along the fjords to Furuheim. With a harbour hidden in fog and deep fjords behind it, Tåkevik is the most mysterious-feeling city on Akkersey."
