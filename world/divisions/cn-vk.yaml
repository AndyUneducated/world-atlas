  population: 300000
  area_km2: 6850.0
  traits: { industries: [tourism, forestry] }
  notes:
    zh: 雾湾市北部与东部的峡湾区，深切的峡湾、瀑布与森林占据了全区大部分土地，是锚岛峡湾风光的代表。冰川在锚岛西岸和中部刻出一条条狭长的峡湾，两岸是高达数百米的陡崖，瀑布从崖顶直泻入海，峡湾深处的水面平静如镜，倒映着雪峰和森林；峡湾游船、皮划艇和崖顶徒步是区里最热门的旅游项目，夏季的游客来自群岛和世界各地。峡湾两岸的山坡覆盖着云杉和桦树林，林业是区里的另一产业，林场按轮伐制度经营，木材经锚岛纵贯高速运往锚港。区内人口约三十万，分散在峡湾两岸和湾头的小村庄里，许多村庄过去只能靠补给船往来，锚岛峡湾公路通车后才有了全年通行的道路，如今村里的渔屋和农舍多改建成民宿。居民以维京语为母语的家庭居多，老年人比例较高。锚岛纵贯高速以一座座高桥越过峡湾，锚雾高速以隧道穿过锚链山的山脊，锚岛峡湾公路则沿峡湾岸边的阶地延伸，沿途设有多个观景停车点。峡湾区壮丽而宁静，是群岛自然风光的代表。
    en: The fjord country in the north and east of Mistbay, where deep fjords, waterfalls and forest cover most of the land; it is the essence of Anchor Island's fjord country. Glaciers carved long, narrow fjords into the west and middle of Anchor Island, walled by cliffs hundreds of metres high; waterfalls plunge from the clifftops into the sea, and deep inside the fjords the water lies still as a mirror, reflecting snowy peaks and forest. Fjord cruises, kayaking and clifftop hikes are the district's favourite attractions, and in summer visitors come from across the islands and the world. Spruce and birch cover the slopes on either side, and forestry is the district's other trade; the holdings are cut in rotation and the timber goes to Anchorhaven on the Anchor Island Spine Expressway. About three hundred thousand people live scattered in small villages along the fjords and at their heads. Many could once be reached only by supply boat and got a year-round road only when the Anchor Island Fjord Road opened; today many of their fishing huts and farmhouses have become guesthouses. Most families speak Viking and the share of older people is high. The Anchor Island Spine Expressway leaps the fjords on high bridges, the Anchorhaven–Mistbay Expressway tunnels through the spurs of the Anchor Chain Mountains, and the Anchor Island Fjord Road follows the terraces along the fjord shores with many viewpoints along the way. Grand and quiet, Fjord District stands for the natural beauty of the islands.
