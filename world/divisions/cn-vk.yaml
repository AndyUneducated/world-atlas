  status: generated
  names:
    zh: 古城区
    en: Old Town District
    art-x-viking: Altstadt
    art-x-buckham: Città Vecchia
  codes:
    admin: '910101'
  population: 2400000
  area_km2: 600.0
  traits: { industries: [tourism, heritage, government] }
  notes:
    zh: 长船港周围的石砌老城，维京群岛最古老、人口最密集的城区，每平方公里约四千人。古城建在维京时代长船停泊的港湾旁，城墙环绕的老城里街巷狭窄曲折，石屋、商栈和教堂依坡而建，城墙内只许步行，马车道和石阶把港口与山顶的王厅遗址连在一起。维京王厅遗址是群岛最重要的考古遗址，长船博物馆收藏着出土的长船、兵器和金银器，每年夏季的长船节上，复原的长船从港内驶出，场面壮观。邮轮停靠长船港时，成千上万的游客涌入老城，旅游、零售和餐饮是区里最大的产业。维京群岛领地政府和许多公共机构设在古城外围的新区，行政与公共服务是另一支柱。区内居民来源多元，世代居住的维京家庭与来自世界各地的移民、学生和公务员混居，英语和维京语在街头同样常见。长船机场高速和东港港口高速从这里出发，维长高速经海底隧道直达北维京岛的瓦尔维克。古城区古老、拥挤而充满活力，是长船乃至整个群岛的灵魂所在。
    en: The stone old town around Longship Harbour, the oldest and most densely settled quarter in the Viking Islands, with about four thousand people per square kilometre. The town grew up beside the bay where Viking longships moored. Inside the walls its lanes are narrow and winding, stone houses, trading halls and churches climb the slopes, only pedestrians are allowed, and cobbled tracks and stone stairs link the harbour with the ruins of the royal hall on the hilltop. The Viking Hall Ruins are the most important archaeological site in the islands, and the Longship Museum holds the longships, weapons and gold and silver unearthed there; at the Longship Festival each summer, reconstructed longships sail out of the harbour in a spectacular show. When cruise ships call, thousands of visitors pour into the old town, and tourism, retail and restaurants are the biggest trades. The Government of the Territory of the Viking Islands and many public bodies sit in the newer districts just outside the old town, so government and public services are the other mainstay. Residents are a mix of Viking families who have lived here for generations and newcomers, students and civil servants from all over the world, and English is heard on the street as often as Viking. The airport and port expressways start here, and the Viking Port–Longship Expressway runs through the undersea tunnel to Walvik on North Viking Island. Old, crowded and full of life, Old Town is the soul of Longship and of the islands.
