  notes:
    zh: 长船岛西南部的港城，扼守长船、暖泉与白帆三岛之间的水道，是群岛的交通咽喉。舵港因城市坐落在长船岛「船尾」的舵位上而得名，港湾背靠舵峰，面朝三岛交汇的水道，自古就是船只进出群岛中部的必经之地。全市人口约一百三十万，经济以港口、渔业和物流为主：舵港区的渡轮码头是群岛最繁忙的渡轮港之一，渡轮通往暖泉岛和白帆岛，货运码头和物流园为长船岛南部供应货物；船尾区的渔村和牧场延续着传统的渔牧生活，渔业和乳业是那里的主要生计。舵港是群岛高速公路网的枢纽：群岛跨海高速从这里跨海通往暖泉和岩港，向东北经龙骨通往长船；长船西岸高速从这里出发，沿长船岛西岸经潮湾通往长船；锚舵跨海高速则跨海通往锚岛的锚湾。龙骨山公路纵贯全市，北接龙骨和长滩，南达船尾。居民以维京语为母语的家庭居多，船员、渔民、码头工人和物流从业者构成了城市的主体。舵港风浪大、船只多，是群岛水上交通和公路交通交汇的十字路口。
    en: "The port city in the south-west of Longship Island, commanding the channels between Longship, Warmspring and White Sail and serving as the islands' traffic bottleneck. Rudderhaven takes its name from its place at the rudder, the stern of Longship Island; its harbour sits beneath Rudder Peak facing the waters where the three islands meet, and ships heading into or out of the middle of the chain have always passed this way. About 1.3 million people live here, and the economy rests on the port, fishing and logistics. The ferry terminal in Rudderhaven District is one of the busiest in the islands, with ferries to Warmspring and White Sail, and its cargo quays and logistics parks supply the south of Longship Island. The fishing villages and farms of Stern keep up the old life of fishing and grazing, with fishing and dairy their main livelihoods. Rudderhaven is the hub of the islands' expressway network: the Island Chain Expressway crosses the sea from here to Warmspring and Rockhaven and runs north-east through Keel to Longship, the Longship West Shore Expressway starts here and follows the west coast through Tidebay to Longship, and the Anchor–Rudder Sea Crossing heads across the water to Anchor Bay. The Keel Hills Road runs the length of the city, north to Keel and Longbeach and south to Stern. Most families speak Viking, and seafarers, fishermen, dockers and logistics workers make up the heart of the city. Windy, busy with shipping, Rudderhaven is the crossroads where the islands' sea lanes and highways meet."
