    zh: 帆影市唯一的区，帆影岭西北麓的林场与山区小镇散布其间。区的中心是帆影镇，坐落在山谷的溪流旁，镇上有市政府、学校、诊所、林业站和一条小商业街，周围的山坡上是层层叠叠的林场，林业工人每天驾车上山作业，木材经帆影岭公路运出山外。帆影镇以手工木器闻名，木雕、木碗和传统的维京式木箱是游客喜爱的纪念品，几家家庭作坊已经传承了好几代。区内的山路和步道通往帆影岭的高处，沿途有瀑布、高山湖泊和古老的石砌牧羊小屋，夏季的高山草甸上野花盛开，是徒步和登山的好季节；冬季则有越野滑雪和雪鞋徒步，山间的木屋旅馆在旺季常常客满。区内的村落规模很小，许多只有几十户人家，居民以维京语为母语，老人和世代居住的林业家庭居多，年轻人多外出工作。帆影岭公路从区内穿过，东北接帆城，西南经白岭通往银鸥。帆影镇的夜晚格外宁静，星空清澈，冬季常能看到极光在山脊上空舞动，是白帆岛最适合远离喧嚣的地方。
    en: "The only district of Sailshadow City, its forest holdings and small mountain towns scattered over the north-western slopes of Sailshadow Ridge. At its centre is the town of Sailshadow, beside a stream in the valley, with the city government, a school, a clinic, a forestry station and a small shopping street; the slopes around it rise in tiers of forest, foresters drive up into the hills to work every day, and the timber leaves by the Sailshadow Ridge Road. The town is known for its handmade woodwork: carvings, wooden bowls and traditional Viking chests are visitors' favourite souvenirs, and several family workshops have passed down the craft for generations. Mountain roads and trails climb to the high ridge past waterfalls, mountain lakes and old stone shepherds' huts; in summer the alpine meadows are full of wild flowers, the best season for walking and climbing, and in winter there is cross-country skiing and snowshoeing, with the timber mountain inns often full in the busy season. The villages are tiny, many with only a few dozen households; residents speak Viking at home, most are older people and long-rooted forestry families, and young people mostly work elsewhere. The Sailshadow Ridge Road crosses the district, north-east to Sail Town and south-west through Whiteridge to Silvergull. Nights in Sailshadow are especially still and the stars clear, and in winter the aurora often dances above the ridge, the best place on White Sail Island to get away from it all."
