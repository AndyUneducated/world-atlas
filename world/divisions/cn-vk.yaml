  notes:
    zh: 白帆岛西南端的海滨城市，隔着白帆海峡与长船岛相望，以海湾风光、度假住宅和林业为生，下设银鸥和白岭两区。城市因银鸥湾上成群的银鸥而得名，银鸥湾水面宽阔、海滩洁白，湾外的引水岛曾是引水员等候进出白帆海峡船只的地方，如今是渡假小岛。全市人口约八十万，服务业占经济的大头：银鸥区是度假住宅、海滨酒店和退休社区集中的地方，许多长船和白帆的家庭在这里购置第二居所，夏季人口明显增多；白岭区则是帆影岭西南端的林场和牧场，林业和乳业延续着传统的乡村生活。由于退休人士和度假居民较多，全市老年人比例较高，劳动年龄人口偏少。居民以维京语为母语的家庭居多，老城保留着木结构的渔屋和小教堂。银鸥是白帆岛西南的交通门户：白帆纵贯高速从这里出发，沿东南岸经白岭、渔港、盐湾通往白帆；桅岛跨海高速则从桅港跨越桅岛海峡在银鸥登陆，向西南通往桅岛和暖泉；帆影岭公路沿西北岸经白岭、帆影通往帆城。银鸥海湾明净、生活闲适，是群岛人心目中理想的海边小城。
    en: "A seaside city at the south-western tip of White Sail Island, facing Longship Island across the White Sail Strait, living by its bay, holiday homes and forestry, with two districts, Silvergull and Whiteridge. The city takes its name from the flocks of herring gulls over Silvergull Bay, a broad bay with white beaches; Pilot Isle off its mouth was once where pilots waited for ships entering or leaving the White Sail Strait and is now a holiday island. About eight hundred thousand people live here and services make up most of the economy. Silvergull District gathers holiday homes, seaside hotels and retirement communities, many families from Longship and White Sail keep second homes here, and the population swells noticeably in summer; Whiteridge is forest holdings and pasture at the south-western end of Sailshadow Ridge, where forestry and dairy keep up the old country life. With so many retired people and holiday residents, the share of older people is high and the working-age share is low. Most families speak Viking, and the old town keeps its timber fishing huts and small churches. Silvergull is the south-western gateway of White Sail Island: the White Sail Spine Expressway starts here and runs along the south-east coast through Whiteridge, Fishing Harbour and Saltbay to White Sail; the Mast Island Sea Crossing comes ashore at Silvergull from Masthaven across the Mast Strait, heading on to Mast Island and Warmspring; and the Sailshadow Ridge Road follows the north-west shore through Whiteridge and Sailshadow to Sail Town. With its clear bay and easy pace, Silvergull is many islanders' idea of the perfect seaside town."
