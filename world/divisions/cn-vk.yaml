  flag: { layout: ensign, colors: ['#1B5E8A', '#FFFFFF'], charge: dawn, charge_color: '#E76F51' }
  flag_notes:
    zh: "群岛方角旗：海蓝底，右侧白色圆徽里是一轮从海平线升起的橙红色太阳。埃德文港每天最早迎来群岛的第一缕阳光，旭日代表日出旅游，也代表最早在这里筑港的埃德文船长向东开辟的航线。清晨的观日台上，这面旗总是和太阳一起升起。"
    en: "An island ensign in sea blue, with an orange-red sun rising from the horizon on the white badge. Port Edevane is the first place in the islands to see the sun each day: the sun is its sunrise tourism and the eastward route of Captain Edevane, who built the first harbour here. On the sunrise lookouts the flag goes up with the sun."
  traits: { industries: [tourism, wind, fishing], heritage: viking, age: old }
  notes:
    zh: 群岛东部外海的海岛城市，以埃德文岛和东极岛组成，以日出旅游、海上风电和渔业为生，全市只设埃德文港一区。埃德文岛面积三千六百多平方公里，位于群岛的东端，岛上的埃德文港镇以最早在这里筑港的埃德文船长命名，这里每天最早迎来群岛的第一缕阳光，清晨在海边看日出是游客必做的事；东极岛在埃德文岛东侧，是群岛东端的小岛。旅游是全市最重要的产业，日出、观鸟和海岛徒步吸引着来自长船和阿夫琳港的游客；埃德文海峡的滩涂是候鸟迁徙的重要停歇地，春秋两季成千上万的水鸟在这里觅食。外海的海上风电场是城市的新兴产业，风电运维为岛上提供了技术岗位；渔民在东部外海捕捞鳕鱼和鲱鱼，渔业仍是传统生计。全市人口约十八万，由于岛上学校和就业机会有限，许多年轻家庭迁往阿夫琳港和长船，儿童比例在群岛各市中最低，老年人比例较高，居民以维京语为母语的家庭居多。埃德文岛的对外交通依靠西岸的埃德文港渡轮码头，渡轮往返阿夫琳岛的灯塔区；埃德文港公路自埃德文港镇横穿全岛到达码头，大半路段位于贴着滩涂的埃德文海峡跨海大桥上，桥下潮水自由进出。埃德文港是群岛最早迎来新一天的地方，宁静而充满希望。
    en: An island city in the open sea east of the chain, made up of Edevane Island and Far East Isle and living by sunrise tourism, offshore wind and fishing, with a single district, Port Edevane. Edevane Island covers more than 3,600 square kilometres at the eastern end of the islands, and Port Edevane town, named after Captain Edevane who first built a harbour here, is the first place in the islands to see the morning sun; watching the sunrise from the shore is a must for every visitor. Far East Isle lies to its east, a small island at the very end of the chain. Tourism is the biggest trade, with sunrises, birdwatching and island walks drawing visitors from Longship and Port Aveline; the mudflats of the Edevane Strait are an important stopover for migrating birds, and in spring and autumn tens of thousands of waterbirds feed there. An offshore wind farm is the city's new industry, and turbine maintenance has brought skilled jobs to the island; fishermen take cod and herring in the eastern waters, and fishing remains the traditional livelihood. About 177,000 people live here. Schools and jobs on the island are few, so many young families have moved to Port Aveline and Longship; the share of children is the lowest of any city in the islands, the share of older people is high, and most families speak Viking. The island depends on the Port Edevane Ferry Terminal on the west shore, with ferries to the Lighthouse District of Aveline Island, and the Port Edevane Road runs from Port Edevane town across the island to the terminal, more than half of it on the low Edevane Strait Bridge over the mudflats, with the tide flowing freely beneath. The first place in the islands to greet each new day, Port Edevane is quiet and full of hope.
