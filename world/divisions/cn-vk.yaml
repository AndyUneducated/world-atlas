  color: '#D4A017'
  flag: { layout: ensign, colors: ['#3A6B35', '#FFFFFF'], charge: volcano, charge_color: '#B22234' }
  flag_notes:
    zh: "群岛方角旗：温室绿底，右侧白色圆徽里是一座冒烟的红色火山。城市得名于最早在这里开采硫磺的特雷曼家族，火山代表离地表很近的地热，绿色是全年恒温的玻璃温室里种出的蔬果和花卉。它是群岛唯一一面绿底的方角旗。"
    en: "An island ensign in greenhouse green, with a smoking red volcano on the white badge. The town is named after the Tremaine family who first mined sulphur here; the volcano is the geothermal heat that lies close to the surface, the green the vegetables and flowers grown all year in the heated glasshouses. It is the only green ensign in the islands."
  traits: { industries: [greenhouse, tourism, geothermal], heritage: viking, age: balanced }
  notes:
    zh: 暖泉岛南岸的地热温室城市，以温室农业、地热和旅游为生，全市只设新特雷曼一区。城市得名于最早在这里开采硫磺的特雷曼家族，海湾边常年飘散着地热喷气孔的硫磺气味，暖泉火山的地下热能在这里离地表很近，地热井和地热电站为全市供应电力和热水，也为大片温室提供了全年恒温的热源。温室农业是新特雷曼最有特色的产业：玻璃温室里种植番茄、黄瓜、辣椒、草莓和花卉，甚至能在北方的冬天收获热带水果，蔬果供应全群岛的超市，花卉出口海外；地热也带动了温泉浴场、地热景区和火山旅游，游客可以参观喷气孔、泥火山和地热电站。全市人口约三十万，温室和地热产业吸引了许多年轻家庭，儿童比例在群岛各市中居于前列，居民以维京语为母语的家庭居多。新特雷曼是暖泉岛的交通要道：群岛跨海高速经火山北侧穿过全市，暖泉南环高速沿火山南麓经过，两条高速在岛西的克莱特斯塔德和岛东的温泉区之间合成环线；暖泉环山公路也从这里经过。新特雷曼冬季温室灯火通明、蒸汽袅袅，是群岛利用地热最成功的城市之一。
    en: "The geothermal greenhouse city on the south coast of Warmspring Island, living by greenhouse farming, geothermal power and tourism, with a single district, Tremaine Bay. The city is named after the Tremaine family, who first mined sulphur here, and fumaroles along its bay fill the air with the smell of sulphur: the heat beneath Warmspring Volcano lies close to the surface here, and geothermal wells and a power station supply the city with electricity and hot water and give its greenhouses steady warmth all year round. Greenhouse farming is Tremaine Bay's signature trade. Glasshouses grow tomatoes, cucumbers, peppers, strawberries and flowers, and even harvest tropical fruit through the northern winter; the produce stocks supermarkets across the islands and the flowers are exported. The heat also feeds spa baths, geothermal parks and volcano tourism, and visitors can see the fumaroles, mud pots and power station. About three hundred thousand people live here; the greenhouses and geothermal trades have drawn many young families, the share of children is among the highest of any city in the islands, and most families speak Viking. Tremaine Bay is a main route across Warmspring Island: the Island Chain Expressway crosses the city north of the volcano and the Warmspring Southern Arc Expressway passes along its southern foot, the two forming a ring between Klettstad in the west and Hot Springs in the east, and the Warmspring Volcano Road runs through as well. In winter, with its greenhouses lit up and steam drifting over them, Tremaine Bay is one of the islands' great geothermal success stories."
