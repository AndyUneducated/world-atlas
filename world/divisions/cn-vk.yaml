  notes:
    zh: 白帆岛东南岸的海盐与海上风电城市，全市人口约九十万，下设盐湾和渔港两区。盐湾因海湾里成片的盐田而得名，这里海水清澈、风大日照足，自维京时代起就以日晒和熬煮法生产海盐，盐湾海盐至今仍是群岛最有名的特产之一，盐田、盐仓和制盐作坊构成了独特的海岸风景。近年来，盐湾外海建成了大型海上风电场，数百台风机矗立在海面上，为白帆岛和长船岛供应电力，风电运维港和风机维修基地为城市带来了新的产业和就业；渔港区则以渔业和冷链加工为主，渔获通过白帆纵贯高速运往白帆港和长船。海盐、风电和渔业是全市的三大支柱，第一、第二产业比重明显高于群岛平均水平。居民以维京语为母语的家庭居多，许多家庭世代晒盐捕鱼，年轻人有不少进入风电行业，但整体老年人比例仍然较高。白帆纵贯高速从市内穿过，向北通往白帆，向南通往银鸥；盐湾海滨公路沿海岸连接渔港、盐湾和望海。盐湾的海岸线上，古老的盐田与现代的风机交相辉映，是群岛传统与新能源相结合的缩影。
    en: The sea-salt and offshore-wind city on the south-east coast of White Sail Island, home to about nine hundred thousand people in two districts, Saltbay and Fishing Harbour. Saltbay is named for the salt pans that cover its bay. The water is clear, the wind strong and the sun plentiful, and salt has been made here since Viking times by evaporation in the sun and by boiling; Saltbay sea salt is still one of the islands' best-known products, and salt pans, salt stores and salt workshops give the shore its own look. A large offshore wind farm has been built off the bay, hundreds of turbines standing in the sea and supplying power to White Sail and Longship islands, and the wind service port and turbine repair base have brought new industry and jobs. Fishing Harbour lives by fishing and cold-chain processing, and its catch travels by the White Sail Spine Expressway to White Sail harbour and Longship. Salt, wind and fishing are the three mainstays, and farming, fishing and industry take a clearly larger share of output than the island average. Most families speak Viking; many have made salt and fished for generations, and while plenty of young people have gone into the wind industry, the share of older people is still high. The White Sail Spine Expressway runs through the city, north to White Sail and south to Silvergull, and the Salt Bay Coast Road links Fishing Harbour, Saltbay and Seawatch along the shore. Along Saltbay's coast, old salt pans and modern turbines stand side by side, a picture of the islands' tradition meeting their new energy.
