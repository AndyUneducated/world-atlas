  notes:
    zh: 南星市唯一的区，南星岛的海滩、渔村、度假村与海豹岛构成了全区的风景。南星镇坐落在南岸的海湾里，镇上有市政府、学校、诊所、超市和一条热闹的海滨大街，夏季大街两旁的冰淇淋店、海鲜摊和冲浪用品店人头攒动，冬季则恢复成安静的渔镇。南岸的沙滩绵延数十公里，南星海滨度假村就建在最好的一段沙滩上，帆船、冲浪和海钓是最受欢迎的活动；岛的内陆是起伏的石楠荒原和牧场，徒步步道从镇上通往山顶的观景台。海豹岛位于南星岛外海，面积两百多平方公里，礁石海岸是灰海豹的繁殖地，全岛划为海豹岛自然保护区，产仔季节禁止船只靠近礁石，游客只能在远处的观察船上观看。渔民在南部海域捕捞鲭鱼和螃蟹，渔港旁的熏鱼坊和海鲜餐馆是游客必到之处。区内人口约四十五万，居民以维京语为母语的家庭居多，老年人比例较高，年轻人多在夏季回岛帮忙经营家庭民宿。南星公路从南星镇出发，翻山到达北岸的南星渡轮码头，每班渡轮靠岸后路上会出现一阵集中的车流。南星的夏夜群星闪烁，海浪轻拍沙滩，是放慢脚步的好地方。
    en: The only district of Southstar City, its scenery made of Southstar Island's beaches, fishing villages and resort, and Seal Isle. Southstar town lies in a bay on the south coast, with the city government, a school, a clinic, a supermarket and a lively seafront street whose ice-cream parlours, seafood stalls and surf shops are packed in summer before the town turns back into a quiet fishing town in winter. Beaches run for dozens of kilometres along the south coast, and the Southstar Beach Resort stands on the finest stretch, with sailing, surfing and sea fishing the favourite pastimes; inland the island is rolling heather moor and pasture, and trails lead from the town to the hilltop lookout. Seal Isle lies offshore, more than two hundred square kilometres of rocky coast where grey seals breed; the whole island is the Seal Isle Nature Reserve, boats may not approach the rocks in the pupping season, and visitors watch from observation boats at a distance. Fishermen take mackerel and crab in the southern waters, and the smokehouse and seafood restaurants by the harbour are a must for visitors. About 450,000 people live here; most families speak Viking, the share of older people is high, and young people often come home in summer to help run the family guesthouse. The Southstar Road climbs from Southstar town over the hill to the ferry terminal on the north shore, with a burst of traffic after every ferry arrival. On summer nights the stars are bright and the waves lap the sand, a good place to slow down.
