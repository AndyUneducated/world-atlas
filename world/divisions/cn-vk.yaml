  notes:
    zh: 银鸥市东北部的山区，帆影岭在这里向西南伸展成一道道白色石灰岩山脊，区名即由此而来。区内大部分土地是林场和牧场：山坡上的云杉和松树林由家庭林场世代经营，木材沿帆影岭公路运往银鸥和帆城加工；山谷和缓坡上的牧场放养奶牛和绵羊，家庭乳品厂生产的黄油、奶酪和酸奶供应银鸥的酒店和餐馆，林业和乳业是全区的两大生计，第一产业在经济中的比重在群岛名列前茅。白岭人口约二十万，分散在山谷里的小村庄中，村里有木结构的农舍、谷仓和小教堂，许多农舍兼营民宿，接待来山里徒步和骑马的游客。区内的山路通往帆影岭西南段的高处，沿途可以俯瞰银鸥湾和白帆海峡，秋季的落叶松林一片金黄，是摄影爱好者喜爱的季节。由于年轻人多到银鸥、白帆和长船工作，留在村里的以老人和农户为主，老年人比例在群岛位居前列，居民以维京语为母语。帆影岭公路和白帆纵贯高速都从区内经过，前者沿西北岸的阶地延伸，后者沿东南侧的低丘通往渔港。白岭山色清秀、牧场辽阔，是银鸥这座海滨城市背后的田园。
    en: The hill country in the north-east of Silvergull, where Sailshadow Ridge spreads south-west into a series of white limestone ridges that give the district its name. Most of the land is forest and pasture. Family forest holdings have worked the spruce and pine on the slopes for generations, and the timber goes down the Sailshadow Ridge Road to be processed in Silvergull and Sail Town; cows and sheep graze the pastures in the valleys and on the gentler slopes, and the butter, cheese and yoghurt of the family creameries supply Silvergull's hotels and restaurants. Forestry and dairy are the two livelihoods, and farming and forestry take as large a share of output as almost anywhere in the islands. About two hundred thousand people live scattered among small valley villages of timber farmhouses, barns and little churches, many of the farms also take in guests who come to walk and ride in the hills. Mountain roads climb to the high ground at the south-western end of the ridge, looking down on Silvergull Bay and the White Sail Strait, and in autumn the larch woods turn gold, a favourite season for photographers. Young people mostly leave to work in Silvergull, White Sail and Longship, so those who stay are mostly older people and farmers, the share of elderly residents is among the highest in the islands, and people speak Viking at home. The Sailshadow Ridge Road and the White Sail Spine Expressway both cross the district, the first on the terraces of the north-west shore and the second on the low hills to the south-east, heading for Fishing Harbour. Green hills and wide pastures make Whiteridge the countryside behind this seaside city.

