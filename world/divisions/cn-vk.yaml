  flag: { layout: ensign, colors: ['#1B2F5E', '#FFFFFF'], charge: compass, charge_color: '#B22234' }
  flag_notes:
    zh: "群岛方角旗：深蓝底，左上角是领地旗，右侧白色圆徽里是一朵红色罗盘玫瑰。以英语命名的港口和要塞城镇沿用殖民时代的格式，把领地旗放在左上角。罗盘代表最先在这里靠岸的商船「阿夫琳号」和今天驶向世界各地的邮轮，深蓝是港外的深海。"
    en: "An island ensign: deep blue with the territory flag in the canton and a red compass rose on a white badge in the fly. The ports and forts with English names keep this pattern from colonial times. The compass is the merchant ship Aveline, the first to put in here, and the cruise ships that sail from the port today to every part of the world; the blue is the deep water off the harbour."
  traits: { industries: [cruise, retail, tourism], heritage: mixed, age: balanced }
  notes:
    zh: 阿夫琳岛东北部的邮轮母港与免税购物城，群岛第四大城市，人口约六十万。阿夫琳港得名于早年最先在这里靠岸的商船「阿夫琳号」，维京时代这里就是群岛的商船集散地，如今则以邮轮和免税购物闻名：阿夫琳港邮轮母港是群岛最大的邮轮港，每年接待数百航次的邮轮，阿夫琳港免税城汇集了来自世界各地的商品，邮轮游客和购物客是全市经济的主要来源。阿夫琳码头区是邮轮码头、免税商业街和渡轮枢纽；灯塔区是阿夫琳岛东北端的老灯塔、海滨别墅和观鲸码头；帆城区是老城和市政中心，帆船俱乐部和造帆作坊延续着城市的航海传统，阿夫琳港机场也在这里；望海区则是卡洛韦岭东麓的住宅区、果园和观景山道。邮轮、零售和旅游是全市的支柱，酒店、餐饮和交通服务提供了大量就业。阿夫琳港的居民来源多元，以中文、维京语和巴克汉姆语为母语的人都很多。长阿跨海高速从这里跨海直达长船，阿夫琳纵贯高速向南经萨尔塔维克通往莫塞，阿夫琳港邮轮高速连接机场和邮轮港。阿夫琳港繁华而好客，是维京群岛迎接世界游客的大门。
    en: The cruise home port and duty-free shopping city in the north-east of Aveline Island, the fourth-largest city in the islands with about 600,000 people. Port Aveline is named after the Aveline, the merchant ship that first put in here; in Viking times it was where the islands' merchant ships gathered, and today it is famous for cruises and duty-free shopping. The Port Aveline Cruise Port is the largest cruise port in the islands, handling hundreds of calls a year, and the Port Aveline Duty-Free Mall gathers goods from all over the world; cruise passengers and shoppers are the city's main source of income. Aveline Quay has the cruise terminal, the duty-free shopping streets and the ferry hub. Lighthouse is the old lighthouse, seaside villas and whale-watching pier at the north-eastern tip of the island. Sail Town is the old town and civic centre, where sailing clubs and sail-makers' workshops keep up the city's seafaring tradition and Port Aveline Airport is located. Seawatch is housing, orchards and scenic mountain roads on the eastern slopes of Calloway Ridge. Cruises, retail and tourism are the city's mainstays, and hotels, restaurants and transport provide many jobs. Residents come from many backgrounds, with plenty of Chinese, Viking and Buckham speakers. The sea crossing to Longship starts here, the Aveline Spine Expressway runs south through Saltavik to Måsey, and the cruise expressway links the airport and the cruise port. Busy and welcoming, Port Aveline is the Viking Islands' front door for visitors from around the world.
