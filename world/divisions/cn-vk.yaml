  notes:
    zh: 锚港市的中心城区和人口最多的区，航运交易所与船级社在此，是群岛的航运商务中心。群岛航运交易所是维京群岛船舶买卖、租船和运价交易的中心，与之相邻的船级社、海事法院、船舶保险公司、航运银行和船舶经纪公司构成了锚港的航运金融区，许多远洋航运公司的总部也设在这里；锚港市政府、市议会和主要的公共机构同样集中在链城，行政与商务是区里的两大支柱，人均产出位居锚港各区之首。区名源自锚链：老城的街道像锚链一样沿着海湾层层展开，石砌商栈、航运公司的老楼和海员教堂讲述着城市的航海历史。锚港机场位于区的北部，有航班通往长船、维京港和群岛各岛。锚雾高速和锚岛峡湾公路都从链城出发，前者通往雾湾市，后者沿锚岛西岸经雾湾、峡湾通往松林。区内居民以维京语为母语的家庭居多，劳动年龄人口比例很高，商店、餐馆和剧院沿主干道排开，是锚港最繁华的地方。链城既有航运金融的现代气息，又保留着港城的古老韵味，是锚港的门面。
    en: "The city centre of Anchorhaven and its most populous district, home of the shipping exchange and the classification societies, and the business centre of shipping in the islands. The Islands Shipping Exchange is where ships are bought and sold, chartered and freight rates traded in the Viking Islands. Around it the classification societies, the maritime court, marine insurers, shipping banks and shipbrokers form Anchorhaven's shipping-finance quarter, and many deep-sea shipping lines have their head offices here. The city government, the city council and the main public bodies are in Chain Town too, so government and business are the two mainstays, and output per head is the highest of any district in Anchorhaven. The name comes from an anchor chain: the old town's streets unwind along the bay in tiers like links of chain, and stone trading halls, old shipping offices and the seamen's church tell the city's seafaring story. Anchorhaven Airport is in the north of the district, with flights to Longship, Viking Port and the other islands. The Anchorhaven–Mistbay Expressway and the Anchor Island Fjord Road both start in Chain Town, the first to Mistbay and the second up the west coast through Mistbay and Fjord to Pinewood. Most families speak Viking, the share of working-age adults is high, and shops, restaurants and theatres line the main streets, the busiest part of Anchorhaven. Chain Town combines the modern bustle of shipping finance with the old charm of a harbour town, and it is Anchorhaven's showpiece."
