  notes:
    zh: 西格利岛北端的港口与城市中心，渔港、跨海高速的服务区和西格拉内斯岬构成了全区的风景，人口约二十五万。西格拉维克渔港沿着西格利海峡的岸边排开，渔船在海峡和周边海域捕捞鳕鱼、鲱鱼和扇贝，鱼市和海产加工厂为岛上提供了大量就业；港外的托利文特岛和牡蛎岛各有两百多平方公里，牡蛎岛周围的浅湾是群岛著名的牡蛎养殖场，西格拉维克牡蛎肉质饱满，是长船和阿夫琳港餐馆的招牌菜，牡蛎节是每年最热闹的节日。渔业、港口和旅游是全区的三大支柱，西格利跨海高速的服务区和观景台吸引着过境的旅客停留，海鲜餐馆、民宿和游船码头随之兴旺。西格拉内斯岬是西格利岛北端伸入海峡的岬角，岬上的灯塔俯瞰着西格利海峡，跨海长桥从岬旁伸向阿夫琳岛方向，日落时桥影映在海面上，是西格拉维克最美的景色。西格拉维克老城有木结构的渔屋、石砌的教堂和一座小型航海博物馆，讲述着桅木和帆船的历史。居民以维京语为母语的家庭居多，老年人比例较高。西格利跨海高速从区内穿过，向南跨海通往长船岛船尾和暖泉，向北跨越西格利海峡通往莫塞；西格利岛公路在这里终止。
    en: "The port and town centre at the northern end of Sigley, where the fishing harbour, the crossing's service area and Siglanes make the scenery; about a quarter of a million people live here. The fishing harbour lines the shore of the Sigley Strait, boats work the strait and the waters around for cod, herring and scallops, and the fish market and processing plants give the island many of its jobs. Midstream Isle and Oyster Isle off the port each cover more than two hundred square kilometres, and the shallow bays round Oyster Isle are the islands' famous oyster beds: plump Siglavik oysters are a signature dish in the restaurants of Longship and Port Aveline, and the oyster festival is the liveliest event of the year. Fishing, the port and tourism are the three mainstays; the service area and lookout on the Sigley Sea Crossing tempt passing travellers to stay, and seafood restaurants, guesthouses and a pier for boat trips have flourished. Siglanes is the headland at the island's northern tip, reaching into the strait, and its lighthouse looks out over the Sigley Strait; the long sea viaduct reaches out beside it towards Aveline Island, and at sunset the bridge's shadow on the water is Siglavik's finest view. The old town has timber fishing huts, a stone church and a small maritime museum telling the story of mast timber and sailing ships. Most families speak Viking and the share of older people is high. The Sigley Sea Crossing runs through the district, south over the sea to Longship Island's stern and Warmspring and north across the Sigley Strait to Måsey, and the Sigley Road ends here."
