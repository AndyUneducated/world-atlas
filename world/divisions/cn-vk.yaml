  notes:
    zh: 岩港市的中心城区，港口、采石场与地热电站沿暖泉火山西麓排开，是暖泉岛的工业中心。岩港码头建在玄武岩海崖下的深水湾里，散货泊位装运石料、浮石和火山渣，集装箱泊位运送硅藻土制品和保温材料，港口还承担着暖泉岛西部的燃料和物资供应。港口后方的采石场和加工厂把火山岩制成建材、铺路石和过滤材料，地热电站沿火山山麓分布，钻井深入地下数千米抽取高温蒸汽发电，供应暖泉岛和长船岛南部；采矿、地热和港口三大产业使岩港区的第二产业比重在群岛各区中最高，矿工、钻井工、工程师和码头工人是社区的主体，劳动年龄人口比例很高。区内的暖泉火山是一座活火山，主峰火口峰海拔两千二百多米，是暖泉岛的最高点，峰顶的暖泉冰帽覆盖着火山口，冰火交融的景观吸引着登山者；火山监测站常年监测地震和地表变形，城市制定了完善的火山应急疏散方案。岩港老城由黑色玄武岩砌成，街道整洁，矿工俱乐部和地质博物馆讲述着城市的历史。居民以维京语为母语的家庭居多。群岛跨海高速从这里出发，暖泉南环高速在这里终止，暖泉环山公路经过城区通往落日。岩港是火山与工业共存的城市，粗犷而有力。
    en: "The urban centre of Rockhaven, where the port, quarries and geothermal stations line the western foot of Warmspring Volcano; it is Warmspring Island's industrial centre. The quays lie in a deep-water bay beneath basalt cliffs, with bulk berths loading stone, pumice and cinder and container berths shipping diatomite products and insulation, and the port also brings in fuel and supplies for the west of the island. Behind it, quarries and plants turn volcanic rock into building materials, paving stone and filter media, and geothermal stations along the slopes drill thousands of metres down for high-temperature steam, supplying Warmspring Island and southern Longship Island with power. Mining, geothermal and the port together give Rockhaven District a larger industrial share of output than any other district in the islands; miners, drillers, engineers and dockers are the heart of the community, and the share of working-age adults is very high. Warmspring Volcano, in the district, is active: its main summit, Crater Peak, rises more than twenty-two hundred metres as the island's highest point, and the Warmspring ice cap covers its crater, a meeting of ice and fire that draws climbers. Volcano observatories monitor earthquakes and ground deformation all year, and the city has thorough evacuation plans. The old town is built of black basalt with neat streets, and the miners' club and geology museum tell the city's story. Most families speak Viking. The Island Chain Expressway starts here, the Warmspring Southern Arc Expressway ends here, and the Warmspring Volcano Road runs through town to Sunset. Rockhaven is a city where volcano and industry live side by side, rugged and strong."
