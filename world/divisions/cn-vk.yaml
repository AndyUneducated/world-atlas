  notes:
    zh: 锚岛西南部的港口城市，群岛最大的集装箱港与造船基地，人口约三百五十万，是群岛第二大城市。锚港因锚岛形如船锚、城市坐落在两只锚爪之间的锚湾而得名，港湾水深浪静，自古就是群岛最好的避风港。全市的经济以港口和船舶为核心：锚湾区的锚港集装箱港是群岛吞吐量最大的港口，远洋航线通往世界各地；船厂区的造船厂、船坞和海工装备基地建造集装箱船、渡轮、海上风电安装船和钻井平台，是群岛重要的工业基地；链城区是城市中心，群岛航运交易所、船级社和航运金融机构集中在这里，锚港机场也在区内；西爪区则是西爪岬一带的住宅区、牧场和海岸步道。港口、造船、物流和航运金融共同支撑起锚港的经济，劳动年龄人口比例较高。锚港的居民以维京语为母语的家庭居多，船员、码头工人和造船工人构成了城市的主体，航海传统深入人心。锚岛跨海高速经锚岛海峡从船厂区通往潮湾，锚舵跨海高速通往舵港，锚岛纵贯高速向北通往松林，锚雾高速通往雾湾。锚港是维京群岛的工业心脏和海上门户。
    en: The port city in the south-west of Anchor Island, the islands' largest container port and shipbuilding base and, with about three and a half million people, the second-largest city in the chain. Anchor Island is shaped like a ship's anchor and the city lies on Anchor Bay between its two flukes; the deep, calm bay has always been the best shelter in the islands. Port and ships are the core of the economy. The Port of Anchorhaven in Anchor Bay handles more containers than any other port in the islands, with deep-sea routes to the whole world. The shipyards, docks and offshore yards of Shipyard District build container ships, ferries, wind-turbine installation vessels and drilling rigs, one of the main industrial bases in the islands. Chain Town is the city centre, home to the Islands Shipping Exchange, classification societies and shipping financiers, and to Anchorhaven Airport, while West Fluke is housing, pasture and coastal paths around the West Fluke headland. Port, shipbuilding, logistics and shipping finance carry the economy together, and the share of working-age adults is high. Viking-speaking families are the majority; seafarers, dockers and shipbuilders make up the heart of the city, and the seafaring tradition runs deep. The Anchor Strait Crossing runs from Shipyard across the strait to Tidebay, the Anchor–Rudder crossing runs to Rudderhaven, the Anchor Island Spine Expressway heads north to Pinewood and another expressway runs to Mistbay. Anchorhaven is the industrial heart and sea gate of the Viking Islands.
