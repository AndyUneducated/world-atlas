  notes:
    zh: 阿夫琳港市的老城与市政中心，城市的航海传统在这里保存得最完整。帆城的老街沿港湾和山坡展开，彩色木屋和石砌商栈鳞次栉比，市政厅、钟楼和老教堂围绕着中心广场；城里的帆船俱乐部是群岛历史最悠久的帆船俱乐部之一，每年举办群岛帆船赛，港湾里停满了各式帆船和游艇；传统的造帆作坊和木船工坊至今仍在手工制作船帆、缆绳和木帆船，产品远销群岛各地，手工制造业成为老城的特色产业。阿夫琳港市的行政机关、法院和公共服务机构集中在帆城，行政和公共服务是区里的主要就业来源。阿夫琳港机场位于老城西侧，有航班通往长船、北维京岛和群岛各岛。阿夫琳港邮轮高速从这里通往阿夫琳码头，卡洛韦岭公路则从帆城出发，向西南经卡洛韦堡、维托斯通往莫塞，是翻越卡洛韦岭的山路。帆城的居民以维京语为母语的老住户居多，老年人和世代居住的家庭比例较高，街头的维京语招牌和传统节庆保留着浓厚的北方风情。帆城古朴而富有生活气息，是阿夫琳港的历史之根。
    en: Port Aveline's old town and civic centre, where the city's seafaring tradition survives most completely. Old streets climb along the harbour and the hillside, packed with painted timber houses and stone trading halls, and the town hall, clock tower and old church surround the central square. The sailing club is one of the oldest in the islands and hosts the island regatta every year, and the harbour is full of sailing boats and yachts of every kind. Traditional sail lofts and boatyards still make sails, ropes and wooden sailing boats by hand and sell them across the islands, making craft manufacturing the old town's own industry. Port Aveline's government offices, courts and public services are concentrated in Sail Town, and government and public services are the main employers. Port Aveline Airport lies on the west side of the old town, with flights to Longship, North Viking Island and the other islands. The Port Aveline Cruise Expressway runs from here to Aveline Quay, and the Calloway Ridge Road starts in Sail Town and runs south-west through Fort Calloway and Hvitås to Måsey, the mountain road over Calloway Ridge. Most residents are long-settled Viking speakers, the share of older people and of families rooted here for generations is high, and Viking shop signs and traditional festivals give the streets a strong northern flavour. Old-fashioned and full of everyday life, Sail Town is the historical root of Port Aveline.
