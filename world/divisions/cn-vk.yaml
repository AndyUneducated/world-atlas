    zh: "上方三分之二为红色，正中一艘金色长船挂着条纹方帆，船舷排着圆盾，下方是蓝白相间的波浪。长船是首府长船市得名的维京长船，也代表群岛世代相传的航海；红与金是维京时代的旗色，蓝白波浪是把二十座城市连成一体的海峡。"
    en: "Red over the upper two-thirds, with a gold longship under a striped square sail and a row of shields along its side, over blue and white waves. The longship is the one the capital is named after and the islands' seafaring heritage; red and gold are the colours of the Viking age, and the waves are the straits that bind the islands' twenty cities together."
