  flag_notes:
    zh: "蓝底上两支交叉的白色维京舵桨。斯蒂尔维克在维京语里意为「舵湾」，城市坐落在长船岛「船尾」的舵位上，扼守三岛之间的水道，舵桨代表这座掌握群岛航向的港城。和群岛的维京老城一样，这是一面只用两种颜色、一个图案的纹章旗，从经过的渡轮上一眼就能认出。"
    en: "Two white Viking steering oars crossed on blue. Styrvik means 'rudder bay' in Viking: the city sits at the rudder of Longship Island's 'stern', commanding the channels between three islands, and the oars are the port that steers the islands' course. Like the other old Viking towns it flies a banner of arms, two colours and one charge, easy to make out from a passing ferry."
  traits: { industries: [port, fishing, logistics], heritage: viking, age: balanced }
  notes:
    zh: 长船岛西南部的港城，扼守长船、暖泉与阿夫琳港三岛之间的水道，是群岛的交通咽喉。斯蒂尔维克在维京语里意为「舵湾」，因城市坐落在长船岛「船尾」的舵位上而得名，港湾背靠斯蒂尔廷峰，面朝三岛交汇的水道，自古就是船只进出群岛中部的必经之地。全市人口约六十八万，是群岛第三大城市，经济以港口、渔业和物流为主：斯蒂尔维克区的渡轮码头是群岛最繁忙的渡轮港之一，渡轮通往暖泉岛和阿夫琳岛，货运码头和物流园为长船岛南部供应货物；斯库特斯塔德区的渔村和牧场延续着传统的渔牧生活，渔业和乳业是那里的主要生计。斯蒂尔维克是群岛高速公路网的枢纽：群岛跨海高速从这里跨海通往暖泉和克莱特斯塔德，向东北经谢尔海姆通往长船；长船西岸高速从这里出发，沿长船岛西岸经弗洛德维克通往长船；阿斯跨海高速则跨海通往阿克斯岛的阿克斯维克湾。谢尔海姆山公路纵贯全市，北接谢尔海姆和朗桑德，南达斯库特斯塔德。居民以维京语为母语的家庭居多，船员、渔民、码头工人和物流从业者构成了城市的主体。斯蒂尔维克风浪大、船只多，是群岛水上交通和公路交通交汇的十字路口。
    en: "The port city in the south-west of Longship Island, commanding the channels between Longship, Warmspring and Port Aveline and serving as the islands' traffic bottleneck. Styrvik, rudder bay in Viking, takes its name from its place at the rudder, the stern of Longship Island; its harbour sits beneath Styrtind facing the waters where the three islands meet, and ships heading into or out of the middle of the chain have always passed this way. About 685,000 people live here, making it the third-largest city in the islands, and the economy rests on the port, fishing and logistics. The ferry terminal in Styrvik District is one of the busiest in the islands, with ferries to Warmspring and Port Aveline, and its cargo quays and logistics parks supply the south of Longship Island. The fishing villages and farms of Skutstad keep up the old life of fishing and grazing, with fishing and dairy their main livelihoods. Styrvik is the hub of the islands' expressway network: the Island Chain Expressway crosses the sea from here to Warmspring and Klettstad and runs north-east through Kjølheim to Longship, the Longship West Shore Expressway starts here and follows the west coast through Flodvik to Longship, and the Akkersvik–Styrvik Sea Crossing heads across the water to Akkersvik Bay. The Kjølheim Hills Road runs the length of the city, north to Kjølheim and Langsand and south to Skutstad. Most families speak Viking, and seafarers, fishermen, dockers and logistics workers make up the heart of the city. Windy, busy with shipping, Styrvik is the crossroads where the islands' sea lanes and highways meet."
