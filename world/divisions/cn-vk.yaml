    zh: 白帆岛东北端的海角区，老灯塔、海滨别墅与观鲸码头构成区里的风景。白帆灯塔矗立在海边的悬崖上，是群岛最古老的灯塔之一，塔身由花岗岩砌成，至今仍在为进出白帆的船只指引航向，灯塔旁的小博物馆讲述着守塔人的故事；岬外的灯塔岛上另有一座灯塔岛灯塔，两座灯塔隔着灯塔水道遥相呼应。灯塔湾和灯塔水道是座头鲸和虎鲸夏季洄游的必经之地，观鲸码头每天有多班观鲸船出海，观鲸是区里最有名的旅游项目。区内的海岸线上散布着海滨别墅、度假屋和小渔村，渔民捕捞鳕鱼、龙虾和螃蟹，不少渔家兼营民宿和海鲜餐馆。由于风景优美、远离喧嚣，许多退休人员和艺术家选择定居在这里，老年人比例在全市最高。白帆灯塔公路从帆港出发，沿海岸通往灯塔区，是白帆岛最美的海滨公路之一。区内居民来源多元，以中文、维京语和巴克汉姆语为母语的家庭都有。灯塔区宁静而浪漫，是白帆人眼中看海、看鲸、看日出的最佳去处。
    en: The headland district at the north-eastern tip of White Sail Island, where the old lighthouse, seaside villas and whale-watching pier set the scene. The White Sail Lighthouse stands on the sea cliffs, one of the oldest lighthouses in the islands. Its granite tower still guides ships in and out of White Sail, and the small museum beside it tells the keepers' stories. Offshore on Lighthouse Isle stands a second light, and the two answer each other across Lighthouse Sound. Lighthouse Bay and Lighthouse Sound lie on the summer route of humpback whales and orcas; whale-watching boats leave the pier several times a day, and whale watching is the district's best-known attraction. Seaside villas, holiday cottages and small fishing villages are scattered along the coast, fishermen catch cod, lobster and crab, and many fishing families also run guesthouses and seafood restaurants. With its fine scenery and distance from the bustle, the district has drawn many retirees and artists, and its share of older people is the highest in the city. The White Sail Lighthouse Road starts in Sail Harbour and follows the coast to the lighthouse, one of the most beautiful coast roads on the island. Residents include Chinese-, Viking- and Buckham-speaking families. Quiet and romantic, Lighthouse is where White Sail people go to watch the sea, the whales and the sunrise.
