  notes:
    zh: 萨尔塔维克湾畔的海盐场与海上风电运维港，是萨尔塔维克市的中心城区。萨尔塔维克湾沿岸铺开数十平方公里的盐田，夏季阳光下盐田像一面面镜子，盐工用木耙把结晶的海盐收拢成白色的盐堆，传统的熬盐作坊用柴火熬煮出片状的「萨尔塔维克花盐」，是群岛餐桌上的珍品，也是游客必买的特产；盐田旁的海盐博物馆讲述着萨尔塔维克千百年的制盐历史。萨尔塔维克港是海上风电场的运维基地，运维船每天载着技术人员出海检修风机，港区的风机叶片维修厂和备件仓库提供了大量技术岗位，海上风电成为萨尔塔维克经济增长最快的部分。费兰丁峰矗立在区的西侧，海拔近一千五百米，是卡洛韦岭中段的高峰，登顶可以俯瞰盐田、风电场和阿夫琳岛东南的海岸线。萨尔塔维克市政府、医院和学校集中在萨尔塔维克镇，镇上的老街保留着盐商的石砌宅院。萨尔塔维克海滨公路从区内穿过，北接望海区，南通菲斯克海姆区；阿夫琳纵贯高速也从城郊经过。居民以维京语为母语，盐工和风电技术员的家庭在这里比邻而居，老年人比例较高。萨尔塔维克的盐和风，承载着这座小城的过去与未来。
    en: "The salt works and offshore-wind service port on Saltavik Bay, and the urban centre of Saltavik City. Tens of square kilometres of salt pans spread along the shore; in summer sun they shine like mirrors, salt workers rake the crystals into white heaps, and traditional saltworks boil the brine over wood fires into the flaky Saltavik salt prized on island tables and bought by every visitor. The salt museum beside the pans tells the story of salt-making on the bay down the centuries. Saltavik harbour is the service base for the wind farm: crew boats take technicians out every day to maintain the turbines, and the blade repair works and spare-parts stores on the quay provide many skilled jobs, making offshore wind the fastest-growing part of the economy. Mount Ferrandine rises nearly fifteen hundred metres on the district's western side, a high point of the middle ridge, and from the top you look down on the salt pans, the wind farm and the south-eastern coast of Aveline Island. The city government, hospital and schools are in the town of Saltavik, whose old street keeps the stone houses of the salt merchants. The Saltavik Coast Road crosses the district, north to Seawatch and south to Fiskheim, and the Aveline Spine Expressway passes the edge of town. Residents speak Viking at home, salt workers' and wind technicians' families live next door to one another, and the share of older people is high. Salt and wind carry this small city's past and its future."
