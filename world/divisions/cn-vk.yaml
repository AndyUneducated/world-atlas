  flag_notes:
    zh: "砖红底上一汪泉水升起三缕白色蒸汽。暖泉火山的地热让全岛遍布温泉、喷气孔和地热田，蒸汽代表温泉与地热电站，砖红是火山岩和熔岩的颜色。冬夜在极光下泡温泉是群岛最有名的体验，温泉区的酒店都在池边挂这面旗。"
    en: "Three white wisps of steam rising from a spring on brick red. The heat of the Warmspring volcano fills the island with hot springs, fumaroles and steam fields: the steam is the springs and the geothermal plants, the red the volcanic rock and lava. Soaking under the aurora on a winter night is the islands' most famous experience, and the spa hotels fly the flag by their pools."
  traits: { industries: [tourism, healthcare, geothermal], heritage: mixed, age: old }
  notes:
    zh: 暖泉岛上的温泉度假城，暖泉火山的地热让这里遍布温泉、喷气孔和地热田，冬季在极光下泡温泉是群岛最有名的体验。全市人口约四十四万，经济以旅游、疗养和地热能源为主：温泉区是温泉酒店、疗养院和会议度假村集中的地方，暖泉温泉度假村是群岛最大的温泉度假村；斯瓦特桑德区以火山黑沙滩、熔岩地貌步道和斯瓦特桑德地热电站闻名；暖河区是暖河河口的港口新区和水产加工基地。地热电站为全岛供应电力和暖气，温泉水被引入酒店、疗养院、温室和家庭，城市的街道冬季也不结冰。暖泉的气候和温泉吸引了大量疗养者和退休人员，老年人比例较高，医疗和康复产业发达。暖泉火山和暖泉冰帽是岛上的地标，火山口附近的火口峰可以俯瞰全岛，冰帽下的冰川和火山相映，形成冰与火交融的奇观。群岛跨海高速从这里经过，连接克莱特斯塔德和斯蒂尔维克，暖泉南环高速向南经新特雷曼通往克莱特斯塔德，西格利跨海高速经西格拉维克通往莫塞。居民来源多元，以中文、维京语和巴克汉姆语为母语的人都不少。暖泉温暖、宁静，是群岛最受欢迎的冬季度假地。
    en: The hot-spring resort city of Warmspring Island. Heat from the Warmspring Volcano fills the island with hot springs, steam vents and geothermal fields, and bathing in a hot spring under the winter aurora is the most famous experience in the islands. About 440,000 people live here, and the economy rests on tourism, health cures and geothermal energy. Hot Springs is where the spa hotels, sanatoriums and conference resorts are, including the Warmspring Spa Resort, the largest in the islands. Svartsand is famous for its volcanic black beaches, lava trails and the Svartsand Geothermal Power Station, and Warm River is the new port district and seafood-processing base at the mouth of the Warm River. Geothermal plants supply the whole island with electricity and heating, hot spring water is piped into hotels, sanatoriums, greenhouses and homes, and the streets never freeze even in winter. The climate and springs draw many convalescents and retirees, so the share of older people is high and healthcare and rehabilitation are well developed. The Warmspring Volcano and the Warmspring Ice Cap are the island's landmarks; Crater Peak near the summit looks out over the whole island, and the glaciers below the ice cap beside the volcano make a striking meeting of ice and fire. The Island Chain Expressway passes through on its way between Klettstad and Styrvik, the Southern Arc Expressway runs south through Tremaine Bay to Klettstad, and the Sigley crossing runs through Siglavik to Måsey. Residents come from many backgrounds, with plenty of Chinese, Viking and Buckham speakers. Warm and peaceful, Warmspring is the islands' favourite winter resort.
