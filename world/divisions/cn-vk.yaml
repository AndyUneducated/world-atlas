  notes:
    zh: 暖泉火山脚下的火山地貌区，以火山黑沙滩、熔岩地貌步道和地热电站闻名。黑沙滩由火山喷发的玄武岩碎屑形成，沙粒乌黑发亮，白浪拍打黑沙的景象是暖泉最有名的风光之一；熔岩地貌步道穿行在凝固的熔岩流、熔岩洞和火山锥之间，游客可以近距离观察喷气孔和沸泥塘，感受火山的力量。斯瓦特桑德地热电站是群岛最大的地热电站，从地下深处抽取高温蒸汽发电，为暖泉全岛和邻近岛屿供应电力，发电后的热水还用于区域供暖和温室种植，地热能源是区里的重要产业。韦克斯利航天测控站建在斯瓦特桑德海岸外的韦克斯利岛上，大型天线日夜追踪着在轨卫星和飞船，是北维京岛马斯林山航天发射的重要测控站之一。旅游和地热是区里的两大支柱，徒步者、摄影师和地质爱好者常年来访。暖泉环山公路从区内穿过，北接温泉区，南通新特雷曼和克莱特斯塔德。区内居民以维京语、中文和巴克汉姆语为母语的家庭混居，老年人比例较高。斯瓦特桑德的大地仍在呼吸，是感受群岛火山之美的最佳去处。
    en: "The volcanic landscape at the foot of the Warmspring Volcano, famous for its black sand beaches, lava trails and geothermal power station. The black beaches are made of basalt fragments from eruptions, their grains glossy black, and white surf breaking on black sand is one of Warmspring's best-known sights. The lava trails wind among solidified lava flows, lava caves and cinder cones, letting visitors get close to steam vents and boiling mud pools and feel the volcano's power. The Svartsand Geothermal Power Station is the largest in the islands: it draws high-temperature steam from deep underground to generate electricity for Warmspring and the neighbouring islands, and the spent hot water heats homes and greenhouses, so geothermal energy is an important trade. The Wexley Tracking Station stands on Wexley Island off the Svartsand coast, its large dishes tracking satellites and spacecraft in orbit day and night, one of the key tracking stations for launches from Maslin Mountain on North Viking Island. Tourism and geothermal energy are the two mainstays, and hikers, photographers and geology enthusiasts visit all year. The Warmspring Volcano Road crosses the district, north to Hot Springs and south to Tremaine Bay and Klettstad. Viking-, Chinese- and Buckham-speaking households live side by side, and the share of older people is high. At Svartsand the earth is still breathing, and there is no better place to feel the beauty of the islands' volcanoes."
