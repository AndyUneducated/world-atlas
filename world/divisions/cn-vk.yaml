  population: 2100000
  area_km2: 900.0
  traits: { industries: [finance, commerce, tech], income: 1.15 }
  notes:
    zh: 长船古城隔湾相望的新城区，离岸银行、信托与基金公司聚集，玻璃塔楼沿汇金湾一字排开，是维京群岛的金融中心，人均产出全领地最高。汇金证券交易所是群岛唯一的证券交易所，群岛银行大厦是长船天际线的最高点，周围聚集了数百家银行、保险、再保险、航运金融、资产管理和律师事务所，许多国际航运公司和船级社的总部也设在这里；近年来，金融科技、数据中心和软件公司迅速发展，成为区里新的增长点。汇金区的白天是全群岛最繁忙的地方，西装革履的上班族在写字楼间穿梭，夜晚则是酒吧、餐厅和音乐厅的天下。区内居民以年轻的金融和科技从业者为主，劳动年龄人口比例很高，外籍居民众多，英语是商务往来的通用语言，中文和维京语在社区中也很普遍。东港港口高速从区内穿过，西接古城，东通东港。汇金湾畔修建了滨海长廊和游艇码头，从这里可以眺望对岸古城的城墙和王厅遗址，新旧长船在湾两岸交相辉映。汇金区以财富和效率著称，是维京群岛连接世界资本市场的枢纽。
    en: The new town across the bay from Longship's old town, where offshore banks, trust companies and fund managers cluster and glass towers line Goldmark Bay. It is the financial centre of the Viking Islands and has the highest output per head in the territory. The Goldmark Stock Exchange is the only stock exchange in the islands, and the Islands Bank Tower is the highest point of the Longship skyline, surrounded by hundreds of banks, insurers, reinsurers, shipping financiers, asset managers and law firms; many international shipping lines and classification societies have their head offices here too. Financial technology, data centres and software firms have grown fast and are the district's newest source of growth. By day Goldmark is the busiest place in the islands, with office workers in suits hurrying between towers; by night it belongs to the bars, restaurants and concert halls. Residents are mostly young finance and tech workers, the share of working-age adults is high, and many are from abroad; English is the language of business, while Chinese and Viking are widely used in the neighbourhoods. The East Harbour Port Expressway crosses the district, west to Old Town and east to East Harbour. A seafront promenade and marina run along Goldmark Bay, looking across to the walls and royal hall of the old town, so old and new Longship face each other across the water. Known for its wealth and efficiency, Goldmark is the islands' link to the world's capital markets.
