  notes:
    zh: 鳕港市唯一的区，鳕岛的渔港、鱼干架与渔村构成了全区的日常。鳕港镇坐落在鳕岛西岸的海湾里，港内停满了拖网船和延绳钓船，鳕鱼汛期时港口昼夜忙碌，渔船卸下的鳕鱼当场去头剖腹，成对挂上海边的木制鱼干架，一排排鱼干架沿海岸延伸数公里，在海风和寒冷的空气中风干两三个月，形成鳕港独特的风景，也吸引着摄影师和游客前来参观。鱼干厂把风干鳕鱼分级、打包，鱼头和鱼骨制成鱼粉，鱼肝炼成鱼肝油，几乎没有任何浪费，食品加工与捕捞一起构成了全区经济的支柱。鳕港镇有木结构的渔屋、渔民教堂、鳕鱼博物馆和几家以鳕鱼料理闻名的餐馆，鳕鱼舌、鳕鱼汤和咸鳕鱼是这里的招牌菜。孤礁岛位于鳕岛外海，面积一百四十平方公里左右，礁石上的灯塔为渔船指引方向，周围的海域是渔民的传统渔场。区内人口约三十万，居民以维京语为母语的家庭居多，老年人比例较高。鳕岛公路从镇子后方绕过海滨的晾晒场，横穿鳕岛到东岸的鳕港渡轮码头，鳕港特大桥是全线唯一的大桥，冷藏货车把鱼货运上渡轮，再经锚岛的松林运往各地。鳕港镇的空气里总是带着鱼干和海风的味道。
    en: "The only district of Codhaven City, where the fishing harbour, drying racks and fishing villages of Cod Island make up daily life. Codhaven town lies in a bay on the island's west coast, its harbour packed with trawlers and longliners. In the cod season the port works day and night: the catch is headed and gutted on the spot and hung in pairs on the wooden drying racks by the sea, rows of racks run for kilometres along the shore, and the fish dry for two or three months in the wind and cold, a sight peculiar to Codhaven that draws photographers and visitors. The stockfish plants grade and pack the dried cod, the heads and bones become fishmeal and the livers cod-liver oil, so almost nothing is wasted, and processing together with fishing is the backbone of the district's economy. The town has timber fishing huts, a fishermen's church, a cod museum and a few restaurants famous for their cod dishes, with cod tongues, cod soup and salt cod the specialities. Lone Reef Isle lies offshore, about a hundred and forty square kilometres, its lighthouse guiding the boats and the waters round it a traditional fishing ground. About 300,000 people live here; most families speak Viking and the share of older people is high. The Cod Island Road passes behind the town to keep clear of the drying grounds and crosses the island to the Codhaven Ferry Terminal on the east coast, the Codhaven Sea Bridge its only major bridge, and refrigerated lorries take the fish onto the ferry and on by way of Pinewood on Anchor Island. The air in Codhaven always smells of dried fish and the sea."
