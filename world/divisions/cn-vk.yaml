  notes:
    zh: 阿夫琳港市的海上门户，邮轮码头、免税商业街与渡轮枢纽集中在阿夫琳湾畔。阿夫琳港邮轮母港拥有多个超大型邮轮泊位，夏季高峰时一天可以同时停靠四五艘邮轮，上万名游客从这里登岸游览阿夫琳港和周边岛屿，或者从这里出发开始群岛巡游；渡轮枢纽有航线通往长船、暖泉、西格拉维克和乌维克库特，是阿夫琳岛与群岛各岛之间最繁忙的客运码头。阿夫琳港免税城是群岛最大的免税购物中心，奢侈品、手表、香水、烟酒和本地特产琳琅满目，码头背后的免税商业街上酒店、餐厅和咖啡馆鳞次栉比，邮轮、零售和港口服务是区里的全部经济。区内居民大多在码头、商店和酒店工作，劳动年龄人口比例很高，邮轮季节性明显，夏季人手紧张，冬季则相对安静。阿夫琳港邮轮高速从这里出发，连接帆城区的阿夫琳港机场，阿夫琳港灯塔公路则沿海岸通往灯塔区。阿夫琳湾的海滨长廊是观赏邮轮进出港和日落的好地方，每当巨轮鸣笛起航，岸边总有人挥手送别。阿夫琳码头热闹、繁忙，是阿夫琳港最具国际色彩的地方。
    en: "Port Aveline's gateway by sea, where the cruise terminal, the duty-free shopping streets and the ferry hub are gathered on Aveline Bay. The Port Aveline Cruise Port has several berths for the largest cruise ships; at the summer peak four or five can be alongside on the same day, and tens of thousands of passengers come ashore to see Port Aveline and the islands nearby, or set off from here on an island cruise. The ferry hub has routes to Longship, Warmspring, Siglavik and the Uviqkut and is the busiest passenger terminal between Aveline Island and the rest of the chain. The Port Aveline Duty-Free Mall is the largest duty-free centre in the islands, full of luxury goods, watches, perfume, spirits and local specialities, and the duty-free street behind the terminal is lined with hotels, restaurants and cafés; cruises, retail and port services are the district's whole economy. Most residents work at the terminal, in shops and in hotels, the share of working-age adults is high, and the cruise season sets the pace: short of hands in summer, quieter in winter. The Port Aveline Cruise Expressway starts here and links Port Aveline Airport in Sail Town, and the Port Aveline Lighthouse Road follows the coast to Lighthouse. The promenade on Aveline Bay is a fine place to watch the cruise ships come and go and the sun go down, and whenever a great ship sounds its horn and sails, people on the shore wave it off. Lively and busy, Aveline Quay is the most international corner of Port Aveline."
- id: div_8a2hzm
