  notes:
    zh: 谢尔海姆市唯一的区，囊括了谢尔海姆山下的山城、林场与滑雪场。区的中心是谢尔海姆山脚下的山城谢尔海姆镇，木结构的房屋沿着山谷和溪流排列，镇上有市政府、医院、学校、木材交易市场和一条热闹的老街，老街上的木工坊、皮具店和山野餐馆吸引着来往的游客。镇外的山坡上是连绵的林场，云杉、冷杉和松树组成的人工林与天然林交错，林业工人、护林员和锯木厂工人是区里最主要的劳动力。谢尔海姆山滑雪场建在谢尔海姆山的北坡，拥有数十条雪道和多条缆车，从初级道到高难度的黑道一应俱全，冬季周末长船、斯蒂尔维克的滑雪者蜂拥而至，滑雪学校、雪具租赁和山间旅馆的生意十分兴旺；夏季滑雪场变成山地自行车公园和高山草甸徒步线，山顶的观景台可以同时看到长船岛东西两侧的大海。谢尔斯卡德山口海拔只有五百多米，是翻越谢尔海姆山的低矮山口；群岛跨海高速则沿谢尔海姆山东南麓从区内经过。区内居民以维京语为母语，老年人比例较高，生活节奏缓慢。谢尔海姆镇的冬夜，木屋里炉火温暖，窗外白雪皑皑，是群岛最有冬日情调的地方。
    en: The only district of Kjølheim City, taking in the mountain town, forest holdings and ski area below the Kjølheim Hills. At its centre is the town of Kjølheim at the foot of the hills, its timber houses lining the valley and stream, with the city government, a hospital, schools, a timber market and a lively old street whose woodworkers, leather shops and country restaurants draw passing visitors. The slopes beyond the town are continuous forest holdings, planted and natural stands of spruce, fir and pine side by side, and forestry workers, rangers and sawmill hands are the district's main workforce. The Kjølheim Hills Ski Area lies on the northern slopes, with dozens of runs and several lifts from nursery slopes to steep black runs; on winter weekends skiers pour in from Longship and Styrvik, and ski schools, hire shops and mountain inns do a roaring trade. In summer the ski area becomes a mountain-bike park and the starting point for walks across alpine meadows, and the summit viewpoint looks out over the sea on both sides of Longship Island at once. Kjølskard, only a little over five hundred metres high, is a low way over the hills, while the Island Chain Expressway passes through along their south-eastern foot. Residents speak Viking at home, the share of older people is high and life is unhurried. On winter nights in Kjølheim, with fires glowing in the timber houses and snow deep outside, the town has the most wintry charm in the islands.
