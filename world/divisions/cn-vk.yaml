  notes:
    zh: 乌维克库特市北部的海鸟栖息岛，西基克图克岛面积两千多平方公里，岛的西岸是高达百米的海崖，是维京群岛重要的海鸟繁殖地。每年春夏，数十万只海鹦、海鸠、三趾鸥和北方塘鹅聚集在悬崖的岩架上筑巢产卵，鸟鸣声和海浪声交织在一起，场面蔚为壮观；西基克图克海鸟保护区覆盖了全岛大部分海崖和周边海域，严格限制人员进入，游客只能沿着指定的步道和观鸟台观赏。保护区内的灯塔建在岛的最高处，为乌维克库特海峡里的船只指引航向，灯塔旁的观测站常年监测海鸟数量和海洋环境。旅游和渔业是区里的主要生计，渔民在保护区外的海域捕鱼，夏季则为观鸟游客提供船只和住宿。岛上只有几座小渔村，人口约四万，维京语是最主要的母语，许多居民是世代守岛的渔民家庭，老年人比例较高。乌维克库特跨海公路是岛上唯一的公路，向南通往瓦莱岛的渡轮码头，冬季风暴来临时公路和渡轮都会中断。西基克图克岛远离尘嚣，是观鸟爱好者和自然摄影师心中的圣地，也是群岛保护得最好的海洋生态区之一。
    en: "The seabird island in the north of the Uviqkut. Siqqiqtuuq Island covers more than two thousand square kilometres, and its west coast is a wall of sea cliffs a hundred metres high, one of the great seabird colonies of the Viking Islands. Every spring and summer hundreds of thousands of puffins, guillemots, kittiwakes and gannets crowd the ledges to nest and lay, and birdsong and surf mingle in a spectacular scene. The Siqqiqtuuq Seabird Reserve covers most of the cliffs and the surrounding waters; access is strictly limited, and visitors keep to marked trails and hides. The lighthouse inside the reserve stands on the island's highest point, guiding ships through the Uviqkut Strait, and the observatory beside it monitors seabird numbers and the marine environment all year. Tourism and fishing are the main livelihoods: fishermen work the waters outside the reserve and in summer take birdwatchers out by boat and put them up. There are only a few small fishing villages, about forty thousand people in all; Viking is the most common first language, many belong to fishing families who have kept the island for generations, and the share of older people is high. The Uviqkut Causeway is the island's only road, running south to the ferry terminal on Hvaley, and in winter storms both the road and the ferries stop. Far from the world's noise, Siqqiqtuuq Island is a sacred place for birdwatchers and nature photographers, and one of the best-protected marine environments in the islands."
