  notes:
    zh: 维京群岛领地的首府和群岛最大的城市，建在长船岛东北部维京时代的长船港上，全市人口一千一百多万，占全领地三分之一以上。城市的两张面孔隔湾相望：一边是长船港周围的石砌古城，城墙、王厅遗址和教堂讲述着维京航海者的历史；另一边是汇金湾畔的玻璃塔楼，群岛的航运公司、保险公司和银行总部集中于此，长船是领地的金融、航运和行政中心。古城区是领地政府和旅游中心，汇金区是金融区，北岬区有长船国际机场和群岛大学，东港区是群岛最繁忙的集装箱港之一，西岸区和长滩区则是成片的住宅区、海滨公园和郊区农场。金融、港口、行政和旅游共同支撑起全市经济，人均产出位居群岛前列。长船是群岛最国际化的城市，居民说中文、维京语、巴克汉姆语和英语，英语使用比例在群岛最高。群岛跨海高速、长白跨海高速和长船西岸高速在这里汇合，长船机场高速和东港港口高速通往机场和港口；维长高速和维长城际铁路经海底隧道直达北维京岛的维京港。长船古老而繁华，是维京群岛的心脏。
    en: "Capital of the Territory of the Viking Islands and the largest city in the islands, built around the Viking-era longship harbour in the north-east of Longship Island. More than eleven million people live here, over a third of the territory. The city's two faces look at each other across the bay. On one side is the stone old town round Longship Harbour, whose walls, ruined royal hall and churches tell the story of the Viking seafarers; on the other, glass towers line Goldmark Bay, home to the head offices of the islands' shipping lines, insurers and banks. Longship is the territory's centre of finance, shipping and government. Old Town holds the territorial government and draws the tourists, Goldmark is the financial district, North Cape has Longship International Airport and the University of the Islands, East Harbour is one of the busiest container ports in the islands, and West Shore and Longbeach are spreads of housing, seaside parks and suburban farms. Finance, the port, government and tourism carry the economy together, and output per head is among the highest in the islands. Longship is the most international city in the islands: residents speak Chinese, Viking, Buckham and English, and English more than anywhere else in the territory. The Island Chain Expressway, the crossing to White Sail and the West Shore Expressway all meet here, airport and port expressways serve the airport and the harbour, and the Viking Port–Longship expressway and railway run through the undersea tunnel to Viking Port on North Viking Island. Ancient yet bustling, Longship is the heart of the Viking Islands."
- id: div_g2g1yc
