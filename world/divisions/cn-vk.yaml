  notes:
    zh: 群岛东北外海的风电城市，以风岛和哨岛组成，海风终年不息，是群岛风力发电的主要基地，全市只设风港一区。风岛面积两千三百多平方公里，岛上的山脊排列着成片的陆上风机，外海还建有大型海上风电场，所发的电力经海底电缆输往长船和白帆；风港风电运维港是群岛重要的风电运维基地，运维船每天载着技术人员出海检修风机，风机叶片、塔筒和零部件的制造与维修厂也设在岛上。风电和制造业是全市经济的支柱，第二产业比重明显高于群岛平均水平，人均产出位居群岛各市前列；渔业则是岛上的传统生计，渔民在风电场周边海域捕鱼。风电产业吸引了大批年轻工程师和技术工人携家带口来到岛上，全市儿童比例在群岛各市中最高，老年人比例最低，是群岛最年轻的城市，居民以维京语为母语的家庭居多。哨岛位于风岛外海，山顶的哨岛雷达站是海事与气象雷达，监视从东方进入群岛的航路。风岛公路自风港镇出发，沿风机林立的山脊到南岸的运维港，按运输超长叶片的要求设计；运维港也停靠往返白帆的渡轮，是风岛对外的门户。风港风大、人年轻，是群岛新能源的前哨。
    en: The wind-power city in the open sea north-east of the chain, made up of Wind Isle and Sentinel Isle, where the sea wind never stops; it is the islands' main base for wind power, with a single district, Windhaven. Wind Isle covers more than 2,300 square kilometres; rows of onshore turbines line its ridges, a large offshore wind farm stands beyond, and their power goes by subsea cable to Longship and White Sail. The Windhaven Wind Service Port is an important maintenance base for the islands' wind farms, sending technicians out every day by crew boat, and plants that make and repair blades, tower sections and components are on the island too. Wind power and manufacturing are the mainstays; industry takes a clearly larger share of output than the island average and output per head is among the highest of the cities, while fishing remains the island's traditional livelihood, worked in the waters around the wind farm. The wind industry has drawn many young engineers and technicians to the island with their families, so the share of children is the highest and that of older people the lowest of any city in the islands, making it the youngest city in the chain; most families speak Viking. Sentinel Isle lies offshore, and the Sentinel Isle Radar Station on its summit is a maritime and weather radar watching the sea lanes that enter the islands from the east. The Wind Isle Road runs from Windhaven town along the turbine-lined ridge to the service port on the south coast, designed for hauling extra-long blades; ferries to White Sail also call at the service port, the island's gateway to the outside. Windy and young, Windhaven is the outpost of the islands' new energy.
