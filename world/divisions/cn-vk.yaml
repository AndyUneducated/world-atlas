  flag_notes:
    zh: "旗杆一侧是米白底深蓝纹的塔夫鲁纳克滚边，其余蓝色旗面上一条白色鳕鱼。鳕鱼汛期海边排满鱼干架，风干鳕鱼是群岛最著名的特产，第一产业在经济中的比重也是群岛各市中最高；滚边的米白取自在海风里晾晒数月后鱼干的颜色。"
    en: "A Tavrunaq border in cream and deep blue at the hoist and a white cod on the blue field. In the cod season the shore is lined with drying racks, stockfish is the islands' most famous delicacy and fishing makes up a bigger share of the economy than in any other city of the islands; the cream of the border is the colour of the fish after months in the sea wind."
  traits: { industries: [fishing, food], heritage: viking, age: old }
  notes:
    zh: 群岛西北外海的渔业城市，以乌利克尤阿克岛和艾因谢尔岛组成，以捕鱼和风干鳕鱼闻名，全市只设乌利克尤阿克一区。乌利克尤阿克岛面积三千多平方公里，周围的冷水海域是鳕鱼的产卵场和洄游通道，每年冬末春初鳕鱼汛期，渔船倾巢而出，乌利克尤阿克的海边排满了成片的鱼干架，鳕鱼在海风中自然风干数月，制成群岛最著名的特产风干鳕鱼。渔业和食品加工是全市经济的绝对支柱，第一产业在经济中的比重在群岛各市中最高，鱼干厂、腌鱼厂、鱼油厂和冷库为岛上提供了大部分就业，风干鳕鱼销往长船和海外市场。全市人口约十五万，许多家庭世代捕鱼晒鱼，渔民、鱼干工人和冷链司机是城市的主体；由于岛上生活艰苦、季节性强，年轻人多到阿克斯岛和长船工作，老年人比例较高，居民以维京语为母语的家庭居多。艾因谢尔岛位于乌利克尤阿克岛外海，是一座孤立的礁岛，岛上有灯塔和海鸟栖息地。乌利克尤阿克岛的对外交通依靠东岸的乌利克尤阿克渡轮码头，渡轮往返阿克斯岛的富鲁海姆；乌利克尤阿克岛公路自乌利克尤阿克镇的鱼干架旁出发，横穿乌利克尤阿克岛到达渡轮码头，路面按冷藏货车标准修建，码头旁建有冷库和鱼货集散站。乌利克尤阿克的鱼干架和海风，是群岛渔业传统最鲜明的象征。
    en: A fishing city in the open sea north-west of the chain, made up of Ulikjuaq Island and Lone Reef Isle and famous for its fishing and its stockfish, with a single district, Ulikjuaq. Ulikjuaq Island covers more than three thousand square kilometres, and the cold waters around it are a spawning ground and migration route for cod. In the cod season at the end of winter and the start of spring the whole fleet goes out, the shore at Ulikjuaq fills with drying racks, and the cod dry in the sea wind for months to become stockfish, the islands' most famous product. Fishing and food processing are the overwhelming mainstay; farming and fishing take a larger share of output than in any other city in the islands, stockfish plants, salting houses, a fish-oil works and cold stores provide most of the island's jobs, and the stockfish sells in Longship and overseas. About 150,000 people live here. Many families have fished and dried fish for generations, and fishermen, drying-yard workers and refrigerated-lorry drivers make up the heart of the city; life on the island is hard and seasonal, so young people tend to leave for Akkersey and Longship, the share of older people is high, and most families speak Viking. Lone Reef Isle, offshore from Ulikjuaq Island, is an isolated reef island with a lighthouse and seabird colonies. Ulikjuaq Island depends on the Ulikjuaq Ferry Terminal on its east coast, with ferries to Furuheim on Akkersey, and the Ulikjuaq Island Road runs from beside the drying racks of Ulikjuaq town across the island to the terminal, built for refrigerated lorries, with cold stores and a fish depot beside the quay. Ulikjuaq's drying racks and sea wind are the clearest symbol of the islands' fishing tradition.
