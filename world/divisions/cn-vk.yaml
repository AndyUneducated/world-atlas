    zh: 白帆岛中部帆影岭下的山区城市，以林业与登山为生，全市只设帆影一区。帆影岭是纵贯白帆岛的山脉，从海上远望，山脊的轮廓像一面鼓起的船帆投下的影子，城市因此得名。全市面积八千多平方公里，人口只有约三十万，是白帆岛人口最少的城市，大部分土地是森林、高山草甸和岩峰。林业是传统支柱，帆影岭西北麓的林场出产云杉和松木，木材经帆影岭公路运往帆城和银鸥加工；登山、徒步和山地旅游是新的增长点，帆影岭的主峰和山口吸引着群岛的登山爱好者，山间小镇的旅馆和登山向导服务随之兴起。由于山区交通不便、就业机会有限，许多年轻人到白帆和长船工作，留在山里的多是老人和世代经营林场的家庭，老年人比例较高。帆影岭公路是全市的主要道路，向东北通往白帆的帆城区，向西南经白岭通往银鸥。居民以维京语为母语，民风淳朴。帆影山高林密、云雾缭绕，是白帆岛的绿色屋脊。
    en: "A mountain city below Sailshadow Ridge in the middle of White Sail Island, living by forestry and mountaineering, with a single district, Sailshadow. Sailshadow Ridge runs the length of White Sail Island; seen from the sea, its skyline looks like the shadow cast by a filled sail, which gives the city its name. The city covers more than eight thousand square kilometres but has only about three hundred thousand people, the fewest of any city on White Sail Island, and most of its land is forest, alpine meadow and rocky peaks. Forestry is the traditional mainstay: holdings on the north-western slopes produce spruce and pine, which go down the Sailshadow Ridge Road to be processed in Sail Town and Silvergull. Climbing, hiking and mountain tourism are the new growth, as the ridge's summits and passes draw climbers from across the islands and inns and mountain guides have sprung up in the hill towns. Roads are few and jobs scarce, so many young people leave for White Sail and Longship; those who stay are mostly older people and families who have run forest holdings for generations, and the share of elderly residents is high. The Sailshadow Ridge Road is the city's main road, running north-east to Sail Town in White Sail and south-west through Whiteridge to Silvergull. Residents speak Viking at home and keep simple, friendly ways. High, wooded and wrapped in cloud, Sailshadow is the green roof of White Sail Island."
