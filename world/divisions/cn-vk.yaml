  flag_notes:
    zh: "绿底上一棵白色的松树。富鲁海姆在维京语里意为「松林之乡」，大片松林从海岸一直延伸到铁锚峰脚下，林业在经济中的比重在群岛各市中名列前茅；白色是冬季越野滑雪的雪道。林场每轮伐一片林，就在新栽的树苗旁插一面小旗作记号。"
    en: "A white pine on green. Furuheim means 'home of the pines' in Viking: pine forest runs from the coast to the foot of the island's highest peak, and forestry weighs more in its economy than in almost any other city of the islands; the white is the cross-country ski trails of winter. Each time a stand is felled, the foresters mark the new seedlings with a small flag."
  traits: { industries: [forestry, tourism], heritage: viking, age: old }
  notes:
    zh: 阿克斯岛东北端的森林城市，以林业和森林旅游为生，全市只设富鲁海姆一区。富鲁海姆在维京语里意为「松林之乡」，面积近一万两千平方公里，人口约二十五万，是阿克斯岛地广人稀的北部，大片松林从海岸一直延伸到阿克斯岛最高峰铁锚峰的山脚，林业在经济中的比重在群岛各市中名列前茅。林场世代按照可持续的轮伐制度经营，伐下的松木在锯木厂加工成建材、木板和木屑颗粒，经阿克斯岛纵贯高速运往阿克斯维克，再由船运销往群岛各地和海外；过去木材只能靠海运出岛，高速通车后运输变得快捷稳定。森林旅游是富鲁海姆的新产业，徒步、狩猎、垂钓、越野滑雪和森林木屋吸引着来自阿克斯维克和长船的游客，赫里姆岛自然保护区和锚链冰川是最受欢迎的自然景点。居民以维京语为母语的家庭居多，林业家庭世代相传，年轻人多到阿克斯维克工作，老年人比例较高。富鲁海姆是阿克斯岛两条主干道路的终点：阿克斯岛纵贯高速从阿克斯维克湾出发纵贯全岛到达这里，阿克斯岛峡湾公路则从链城经托克维克沿西岸峡湾绕到富鲁海姆。松林空气清新、林海无边，是阿克斯岛北部的绿色宝库。
    en: "The forest city at the north-eastern end of Akkersey, living by forestry and forest tourism, with a single district, Furuheim. Furuheim, pine home in Viking, covers nearly twelve thousand square kilometres with only about a quarter of a million people, the thinly settled north of Akkersey, where pine forest stretches from the coast to the foot of Iron Anchor Peak, the island's highest summit, and forestry takes as large a share of output as in almost any city in the islands. The holdings have been worked for generations on a sustainable rotation, and the sawmills turn the pine into building timber, boards and wood pellets, which go by the Akkersey Spine Expressway to Akkersvik and on by ship to the rest of the islands and overseas; timber used to leave only by sea, and the expressway has made the haul quick and reliable. Forest tourism is Furuheim's new trade: hiking, hunting, fishing, cross-country skiing and forest cabins draw visitors from Akkersvik and Longship, and the Hrimey Nature Reserve and the Anchor Chain Glacier are the favourite natural sights. Most families speak Viking, forestry passes from parent to child, young people tend to leave for jobs in Akkersvik, and the share of older people is high. Furuheim is the end of Akkersey's two trunk roads: the Akkersey Spine Expressway runs here the length of the island from Akkersvik Bay, and the Akkersey Fjord Road comes round from Chain Town by way of Tåkevik and the west-coast fjords. With its clean air and endless forest, Furuheim is the green treasure house of northern Akkersey."
