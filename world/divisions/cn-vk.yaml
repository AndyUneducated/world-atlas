    en: Longship City
    art-x-viking: Langskip auf Ysear
    art-x-buckham: Navelunga en Etei
  codes:
    admin: '910100'
    unlocode: VK LGS
  population: 2300000
  area_km2: 15650.0
  color: '#2E86AB'
  flag: { layout: banner, colors: ['#B22234', '#F2C14E'], division: bordure, charge: prow, charge_color: '#F2C14E' }
  flag_notes:
    zh: "红底金边，正中一只金色的龙头船首，船舷上一排圆盾。长船港是维京时代的长船停泊地，龙头船首讲的是城市的起源，也呼应领地旗上的长船；金边是首府的标志，群岛各市的旗中只有长船镶边。红与金同领地旗，汇金湾畔的银行和航运公司门前也挂这面旗。"
    en: "A gold dragon-headed prow on red, with a row of round shields along the gunwale, inside a gold border. Longship Harbour was a Viking-age haven for longships, so the prow tells the city's origin and echoes the longship on the territory flag; the border marks the capital, the only city flag in the islands to have one. The red and gold are the territory's own, and the flag flies outside the banks and shipping houses of the financial district too."
  traits: { industries: [finance, port, government, tourism], heritage: global, age: balanced, income: 1.1 }
  notes:
    zh: 维京群岛领地的首府和群岛最大的城市，建在长船岛东北部维京时代的长船港上，全市人口二百三十万，约占全领地的四分之一。城市的两张面孔隔湾相望：一边是长船港周围的石砌古城，城墙、王厅遗址和教堂讲述着维京航海者的历史；另一边是汇金湾畔的玻璃塔楼，群岛的航运公司、保险公司和银行总部集中于此，长船是领地的金融、航运和行政中心。福恩斯塔德区是领地政府和旅游中心，汇金区是金融区，北岬区有长船国际机场和群岛大学，奥斯特哈门区是群岛最繁忙的集装箱港之一，西岸区和朗桑德区则是成片的住宅区、海滨公园和郊区农场。金融、港口、行政和旅游共同支撑起全市经济，人均产出位居群岛前列。长船是群岛最国际化的城市，居民说中文、维京语、巴克汉姆语和英语，英语使用比例在群岛最高。群岛跨海高速、长阿跨海高速和长船西岸高速在这里汇合，长船机场高速和奥斯特哈门港口高速通往机场和港口；维长高速和维长城际铁路经海底隧道直达北维京岛的维京港。长船古老而繁华，是维京群岛的心脏。
    en: "Capital of the Territory of the Viking Islands and the largest city in the islands, built around the Viking-era longship harbour in the north-east of Longship Island. About 2.3 million people live here, roughly a quarter of the territory. The city's two faces look at each other across the bay. On one side is the stone old town round Longship Harbour, whose walls, ruined royal hall and churches tell the story of the Viking seafarers; on the other, glass towers line Goldmark Bay, home to the head offices of the islands' shipping lines, insurers and banks. Longship is the territory's centre of finance, shipping and government. Fornstad holds the territorial government and draws the tourists, Goldmark is the financial district, North Cape has Longship International Airport and the University of the Islands, Austhamn is one of the busiest container ports in the islands, and West Shore and Langsand are spreads of housing, seaside parks and suburban farms. Finance, the port, government and tourism carry the economy together, and output per head is among the highest in the islands. Longship is the most international city in the islands: residents speak Chinese, Viking, Buckham and English, and English more than anywhere else in the territory. The Island Chain Expressway, the crossing to Port Aveline and the West Shore Expressway all meet here, airport and port expressways serve the airport and the harbour, and the Viking Port–Longship expressway and railway run through the undersea tunnel to Viking Port on North Viking Island. Ancient yet bustling, Longship is the heart of the Viking Islands."
- id: div_g2g1yc
  subtype: borough
  parent: div_3cvg2q
  status: generated
  names:
    zh: 福恩斯塔德区
    en: Fornstad District
    art-x-viking: Fornstad
    art-x-buckham: Città Vecchia
  codes:
    admin: '910101'
  population: 480000
  area_km2: 600.0
  traits: { industries: [tourism, heritage, government] }
  notes:
    zh: 长船港周围的石砌老城，维京群岛最古老、人口最密集的城区，每平方公里约八百人。古城建在维京时代长船停泊的港湾旁，城墙环绕的老城里街巷狭窄曲折，石屋、商栈和教堂依坡而建，城墙内只许步行，马车道和石阶把港口与山顶的王厅遗址连在一起。维京王厅遗址是群岛最重要的考古遗址，长船博物馆收藏着出土的长船、兵器和金银器，每年夏季的长船节上，复原的长船从港内驶出，场面壮观。邮轮停靠长船港时，成千上万的游客涌入老城，旅游、零售和餐饮是区里最大的产业。维京群岛领地政府和许多公共机构设在古城外围的新区，行政与公共服务是另一支柱。区内居民来源多元，世代居住的维京家庭与来自世界各地的移民、学生和公务员混居，英语和维京语在街头同样常见。长船机场高速和奥斯特哈门港口高速从这里出发，维长高速经海底隧道直达北维京岛的瓦尔维克。福恩斯塔德区古老、拥挤而充满活力，是长船乃至整个群岛的灵魂所在。
    en: The stone old town around Longship Harbour, the oldest and most densely settled quarter in the Viking Islands, with about eight hundred people per square kilometre. The town grew up beside the bay where Viking longships moored. Inside the walls its lanes are narrow and winding, stone houses, trading halls and churches climb the slopes, only pedestrians are allowed, and cobbled tracks and stone stairs link the harbour with the ruins of the royal hall on the hilltop. The Viking Hall Ruins are the most important archaeological site in the islands, and the Longship Museum holds the longships, weapons and gold and silver unearthed there; at the Longship Festival each summer, reconstructed longships sail out of the harbour in a spectacular show. When cruise ships call, thousands of visitors pour into the old town, and tourism, retail and restaurants are the biggest trades. The Government of the Territory of the Viking Islands and many public bodies sit in the newer districts just outside the old town, so government and public services are the other mainstay. Residents are a mix of Viking families who have lived here for generations and newcomers, students and civil servants from all over the world, and English is heard on the street as often as Viking. The airport and port expressways start here, and the Viking Port–Longship Expressway runs through the undersea tunnel to Walvik on North Viking Island. Old, crowded and full of life, Fornstad is the soul of Longship and of the islands.
