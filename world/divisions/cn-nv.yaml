  names:
    zh: 雪谷区
    en: Snow Valley District
    art-x-viking: Schneetal
    art-x-buckham: Valle Neve
  codes:
    admin: '901105'
  population: 19200
  area_km2: 3300.0
  traits: { industries: [defence, aviation, aerospace] }
  notes:
    zh: 马斯林山脉中终年积雪的高山谷地，是解放军马斯林山联合训练基地所在地，也是空军和空天力量的重要基地。雪谷营区驻有陆军寒区部队，负责高寒山地作战和雪地救援训练，雪谷装甲训练场在谷底的冻土和雪原上为装甲部队提供演练场地；雪谷空军基地是全岛海拔最高的作战机场，雪谷空天飞机基地则起降可往返大气层内外的空天飞机，是领地最新锐的航空航天设施。谷地中央的雪湖终年冰封，四周是陡峭的雪峰和冰川，景色壮丽。雪谷滑雪场是区里唯一面向公众的设施，拥有全岛雪期最长、落差最大的雪道，冬季吸引着滑雪高手前来，夏季则仍可在高处的冰川上滑雪。国防、航空和航天是区里的主要产业，常住人口不到两万，大多是军人和家属，劳动年龄人口比例极高。马斯林山空天高速的终点设在区内的雪谷空军基地，向东经和平区通往东营；雪谷公路则把雪谷与天台、和平、西坪连在一起。居民大多以中文为母语。雪谷的冬天漫长而严寒，但这里的人们以坚韧著称，守卫着北维京岛的天空和山川。
    en: A high valley of year-round snow in the Maslin Range, home of the PLA's Maslin Mountain Joint Training Base and an important base for air and aerospace forces. Army cold-weather units at the Snow Valley Garrison train for high-mountain warfare and snow rescue, and the Snow Valley Armour Range gives armoured units room to manoeuvre on the frozen ground and snowfields of the valley floor. Snow Valley Air Base is the highest combat airfield on the island, and the Snow Valley Spaceplane Base flies spaceplanes that travel in and out of the atmosphere, the territory's newest air and space facility. Snow Lake in the middle of the valley is frozen all year, ringed by steep snow peaks and glaciers in a magnificent setting. The Snow Valley Ski Area is the only facility open to the public, with the longest season and the greatest vertical drop on the island; it draws expert skiers in winter, and in summer you can still ski on the glacier above. Defence, aviation and space are the main trades; fewer than twenty thousand people live here, mostly service members and their families, with a very high share of working-age adults. The Maslin Aerospace Expressway ends at Snow Valley Air Base and runs east through Peace to East Camp, and the Snow Valley Highway links Snow Valley with Sky Terrace, Peace and West Heath. Most residents speak Chinese at home. Winters are long and bitter, but the people here are known for their toughness as they guard the skies and mountains of North Viking Island.
- id: div_q5h8zp
  subtype: borough
  parent: div_rdypg7
  status: generated
  names:
    zh: 群峰训练管理区
    en: High Peaks Training Area
    art-x-viking: Gipfelübungsplatz
    art-x-buckham: Poligono delle Vette
  codes:
    admin: '901106'
  population: 5500
  area_km2: 6200.0
  traits: { industries: [defence, research] }
  notes:
    zh: 马斯林山脉北翼与西翼之间的军事训练区，由领地与驻军共管，不设区议会。区内是连绵的雪峰、冰川和高山荒原，常住人口只有驻地官兵、职工和家属约五千五百人，每平方公里不到一人，是马斯林山市最荒凉的地方。领地最重要的国防设施多集中在这里：群峰地下指挥城深藏在山体之中，是领地战时的指挥中枢；群峰电磁发射场的长轨道沿山坡铺设，用电磁力把飞行器推向高空；群峰拦截弹阵地的发射井群守护着全岛免受导弹威胁；群峰空军靶场和群峰寒区训练场供空军和陆军进行实弹演练。蒂鲁尤阿克峰是全岛最高峰，蒂鲁尤阿克峰光学观测站和霍尔沃思峰激光站就建在这些高峰之巅，监视和测量在轨卫星与太空碎片，不通公路，人员和物资靠直升机运送；西岭雷达站则守望着西部天空。国防和科研是区里的全部产业。雪谷公路从区内穿过，连接西坪与星港；西岭公路从西坪延伸到拦截弹阵地、寒区训练场和西岭雷达站。区内大部分地方禁止公众进入，只有沿公路的少数观景点开放。群峰沉默而神秘，是北维京岛最坚固的屏障。
    en: The military training area between the northern and western arms of the Maslin Range, run jointly by the territory and the garrison, with no district council. It is a land of snow peaks, glaciers and high barrens; only about five and a half thousand people live here, service members, staff and their families, fewer than one per square kilometre, the emptiest part of Maslin Mountain City. Many of the territory's most important defence facilities are here. The High Peaks Underground Command Complex is buried deep in the mountain, the territory's wartime command centre. The long track of the High Peaks Electromagnetic Launcher climbs the slope, hurling vehicles skyward with electromagnetic force, and the silos of the High Peaks Interceptor Field guard the island against missile attack. The High Peaks Air Weapons Range and the Cold-Weather Training Ground serve the Air Force and the Army for live-fire exercises. Mount Tirrujuaq is the highest point on the island, and the Mount Tirrujuaq Optical Station and the Mount Hallworth Laser Station stand on these summits, watching and measuring satellites and space debris; no road reaches them, and people and supplies arrive by helicopter. The West Ridge Radar Station watches the western sky. Defence and research are the district's whole economy. The Snow Valley Highway crosses it between West Heath and Starport, and the West Ridge Highway runs from West Heath to the interceptor field, the training ground and the West Ridge radar. Most of the district is closed to the public, with only a few viewpoints along the roads open. Silent and mysterious, the High Peaks are North Viking Island's strongest bulwark.
- id: div_8emjne
