  area_km2: 2600.0
  traits: { industries: [port, logistics, manufacturing] }
  notes:
    zh: 维京语意为「鲸湾」，旧时捕鲸站所在的海湾，如今是维京港市人口最多的区和领地最大的港区。鲸湾港沿湾岸排开集装箱、散货和滚装码头，湾口外的外礁深水港可停靠最大的远洋货轮，两港合起来承担领地大部分进出口货物。临港产业带布满船舶修理厂、冷链仓库、机械与电气设备工厂，港口、物流和制造业养活了区里的大部分家庭。维京港国际机场建在湾北的平地上，是领地最繁忙的机场，也是飞往维京群岛和远方的主要门户。维京港市政厅和中央广场位于区中心，鲸湾捕鲸站博物馆保留着旧捕鲸站的砖砌炼油房、绞盘和捕鲸船，讲述城市的起源；维京港体育场是全领地最大的球场。观星高速与西岸公路在区内交会，维长高速与维长城际铁路从这里进入海底隧道，向东南直达长船市。区内老港工住宅与新建公寓并存，维京语在码头和市场上最常听到，港口夜班让这里成为全岛少有的不夜之地。
    en: Walvik means "whale bay" in Viking. The bay where the old whaling station stood is now the most populous district of Viking Port and the territory's largest port area. Walvik Harbour lines the bay with container, bulk and ro-ro berths, and the Outer Skerry Deep-Water Port beyond the bay mouth takes the largest ocean freighters; between them they handle most of the territory's imports and exports. The waterfront industrial belt is packed with ship repair yards, cold stores and machinery and electrical plants, and the port, logistics and manufacturing support most households in the district. Viking Port International Airport, on flat land north of the bay, is the territory's busiest airport and its main gateway to the Viking Islands and further afield. Viking Port City Hall and the Central Square stand at the centre of the district. The Walvik Whaling Station Museum keeps the old station's brick try-works, capstans and whaleboats and tells the story of how the city began, and Viking Port Stadium is the largest ground in the territory. The Stargazer Expressway and the West Coast Highway meet here, and the Viking Port–Longship expressway and railway enter the undersea tunnel in Walvik and run south-east to Longship. Old dockworkers' housing stands beside new flats, Viking is the language heard most on the quays and in the markets, and night shifts at the port keep the district awake around the clock, a rare thing on the island.
