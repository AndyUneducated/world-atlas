  status: canon
  names:
    zh: 厄定区
    en: Erding District
    art-x-viking: Erding
    art-x-buckham: Erding
  codes:
    admin: '901201'
  population: 15000
  area_km2: 8500.0
  traits: { industries: [agriculture, commerce] }
  notes:
    zh: 厄定河下游沿岸的农业区和全市的主要集镇，厄定河市人民政府设在这里。厄定河在区内流过宽阔的冲积平原，河岸两侧是麦田、饲草地和奶牛场，农场多由家庭经营，规模不大但历史悠久；厄定河口有一座小渔港，渔船在河口和近海捕捞鲑鱼和鳕鱼。厄定集镇是全市唯一的城镇，镇上有市政府、医院、学校、超市、农机站和每周一次的集市，为整个厄定河流域的农户、牧民和游客提供服务，商贸和公共服务是镇上的主要就业来源。厄定河公路的终点就在区内，向西经驯鹿原、旧府和上厄定通往新城北苑；环北维京岛高速经过厄定河市，南连天城，西接勒克尔；西马铁路的厄定河站也在附近。区内常住人口约一万五千，居民以维京语为母语，许多家庭世代在河边耕种，年轻人有不少外出到新城和维京港工作，老年人比例较高。夏季的河谷绿草如茵，鲑鱼洄游季节吸引着垂钓者；冬季大雪覆盖平原，镇上的木屋炊烟袅袅。厄定区是这片辽阔土地上最温暖的人间烟火。
    en: The farming district along the lower Erding River and the city's main town, seat of the Erding River City government. The river crosses a broad alluvial plain here, and its banks are lined with wheat, fodder fields and dairy farms, mostly small family farms with long histories. A small fishing harbour at the Erding Mouth sends boats after salmon and cod in the estuary and the near sea. Erding is the only town in the city, with the city government, a hospital, schools, a supermarket, a farm-machinery depot and a weekly market serving the farmers, herders and visitors of the whole Erding basin, and trade and public services provide most jobs. The Erding River Highway ends in the district and runs west through the Reindeer Range, Old Prefecture and Upper Erding to North Gardens in New City; the ring expressway serves the city on its way between Skytown and Lekor; and Erding River Station on the Northwest–Maslin Mountain Railway is close by. About fifteen thousand people live here. Most speak Viking at home, many families have farmed by the river for generations, plenty of young people have left for jobs in New City and Viking Port, and the share of older people is high. In summer the valley is lush and green and the salmon run draws anglers; in winter snow covers the plain and smoke curls from the chimneys of the timber houses. Erding is the warm, lived-in heart of this vast land.
