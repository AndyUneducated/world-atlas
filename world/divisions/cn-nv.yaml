  notes:
    zh: 维京语意为「椴树滩」，中文取「林间小道」之意，是西北市的大学城。北维京大学的主校区和林道理工学院都在区内，两校的教学楼、图书馆和实验室散布在椴树林间，校园之间有林荫步道和自行车道相连，形成一片开放的学术园区。大学附属的研究所、孵化器和技术转移中心沿校园外围分布，许多科技企业由师生创办，教育与科研是区里最大的雇主。学生和年轻教师占居民很大比例，儿童和老人较少，是全岛平均年龄最年轻的区之一，咖啡馆、书店、学生公寓和小剧场让街区充满朝气。区里的住宅以低层公寓和教职工住宅为主，周边保留着大片森林和草地，环境安静。观星高速从区内穿过，西接自由市白桦区，东通望星区和科学城，构成首府与科研走廊之间的纽带。学期中校园里能听到多种语言，国际学生和访问学者常年往来，大学的公开讲座和音乐会向全体市民开放。林道区以开放的学风和优美的校园闻名，是北维京岛最重要的人才培养基地。
    en: Lindau means "linden meadow" in Viking, and its Chinese name means "path through the woods". It is Northwest City's university town. The main campus of the University of North Viking and the Lindau Institute of Technology are both here, their teaching blocks, libraries and laboratories scattered among linden groves and joined by shaded footpaths and cycle tracks into one open academic park. University institutes, incubators and technology-transfer offices ring the campuses, many tech firms have been founded by staff and students, and education and research are the district's biggest employers. Students and young lecturers make up a large share of residents, with few children or old people, so this is one of the youngest districts on the island, and cafés, bookshops, student housing and small theatres keep the streets lively. Housing is mostly low-rise flats and staff homes, with large stretches of forest and meadow left around them. The Stargazer Expressway crosses the district, west to Birchwood in Freedom City and east to Stargaze and Science City, tying the capital to the research corridor. During term many languages are heard on campus, international students and visiting scholars come and go all year, and the universities' public lectures and concerts are open to everyone. Lindau is known for its open spirit of learning and its beautiful campuses, and it is the island's most important training ground for talent.
