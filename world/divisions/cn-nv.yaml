  names:
    zh: 西坪区
    en: West Heath District
    art-x-viking: Westheide
    art-x-buckham: Pianoro Ovest
  codes:
    admin: '901104'
  population: 25000
  area_km2: 4200.0
  traits: { industries: [aerospace, defence, manufacturing] }
  notes:
    zh: 马斯林山西部的高原台地，维京-马斯林山发射与降落中心所在地，周围是由火箭总装、推进剂、飞船整修和风洞组成的航天产业区。发射与降落中心拥有多个发射工位和可重复使用飞船的着陆场，火箭从这里升空把卫星和飞船送入轨道，返回的飞船和助推器也在这里降落；西坪火箭总装厂把来自科学城和全岛各地的部件组装成火箭，西坪推进剂厂生产液氧、液氢和甲烷燃料，西坪飞船整修厂对回收的飞船进行检修，西坪风洞群为飞行器进行气动试验。西坪量子通信站和西坪防空阵地分布在台地边缘。航天制造是区里最大的产业，工程师、技工和军人构成了居民的主体，劳动年龄人口占八成。区内交通四通八达：马斯林山高速从这里出发，经马斯林山市区通往天城；雪谷公路连接和平与群峰；西岭公路从这里通往群峰的拦截弹阵地、寒区训练场和西岭雷达站；马斯林山航天铁路的终点也在区内，把大型部件从东营港运来。每逢发射日，台地上空的火箭尾焰在数十公里外都能看到。西坪是北维京岛航天梦想起飞的地方。
    en: A high plateau in the west of Maslin Mountain, home of the Viking–Maslin Mountain Launch and Landing Centre, surrounded by a space-industry zone of rocket assembly, propellant production, spacecraft refurbishment and wind tunnels. The centre has several launch pads and landing zones for reusable spacecraft. Rockets lift satellites and spacecraft into orbit from here, and returning spacecraft and boosters land here too. The West Heath Rocket Assembly Plant puts together rockets from parts made in Science City and across the island, the West Heath Propellant Plant makes liquid oxygen, hydrogen and methane, the Spacecraft Refurbishment Plant overhauls recovered spacecraft, and the West Heath Wind Tunnels test vehicles' aerodynamics. The West Heath Quantum Station and the West Heath Air Defence Site stand on the edges of the plateau. Space manufacturing is the largest trade; engineers, technicians and service members make up most of the population, and four in five residents are of working age. Roads run in every direction. The Maslin Expressway starts here and runs through the city to Skytown, the Snow Valley Highway links Peace with the High Peaks, and the West Ridge Highway runs from here to the interceptor field, the cold-weather training ground and the West Ridge Radar Station in the High Peaks. The aerospace railway ends here, bringing large components from the port at East Camp. On launch days the rocket plumes over the plateau can be seen tens of kilometres away. West Heath is where North Viking Island's space dreams take off.
