  flag: { layout: banner, colors: ['#3B4A5A'], charge: peaks_star, charge_color: '#FFFFFF', extra: [{ charge: star8, color: '#E9B949', x: 30, y: 12.1, size: 12.6 }] }
  flag_notes:
    zh: "钢灰底上三座白色雪峰，峰顶之上一颗金色八角星。三面环绕城市的马斯林山脉是这座城市的天然屏障，金星取自领地旗，代表驻守全岛天空和航天发射场的部队；钢灰是机库与装甲的颜色。阅兵日和火箭发射日，山间的每一座营区都会升起这面旗。"
    en: "Three white snow peaks on steel grey, with a gold eight-pointed star above them. The Maslin range that rings the city on three sides is its natural rampart; the star, from the territory flag, stands for the forces that guard the island's skies and its launch site, and the grey is the colour of hangars and armour. On parade days and launch days the flag goes up over every camp in the mountains."
  traits: { industries: [defence, aerospace, research], heritage: chinese, age: young }
  notes:
    zh: "北维京岛东部的山地军事城市，三面被马斯林山脉的雪峰环绕，只有东部是通向海岸的平地。全市面积广阔，常住人口只有约十二万，其中驻军约三万五千人，空军、深空太空军和陆军在这里驻有三十多处基地与设施，是领地最重要的国防和航天基地。深空太空军的指挥中心、深空测控站和维京-马斯林山发射与降落中心构成了领地航天活动的核心，火箭从西坪的发射场升空，飞船在这里降落、整修后再次出发；空军的作战机场、预警雷达和飞行学院守护着全岛的天空；陆军的联合训练基地和寒区训练场则在雪谷和群峰之间展开。国防、航天和科研是全市经济的全部支柱，大量的工程师、技术员、军人和家属构成了居民的主体，劳动年龄人口比例全岛最高，老年人很少。和平区是市政中心；星港、东营、西坪、雪谷四区各有分工；群峰训练管理区由领地与驻军共管。马斯林山高速、马斯林山空天高速、东岸公路和雪谷公路连通各区，西马铁路和贝马铁路在这里交会，马斯林山航天铁路把东营港与西坪发射场连在一起。居民大多以中文为母语，城市秩序井然，部分地区对公众开放参观。\n马斯林山是全岛降水最少的城市，一年只有八百多毫米，晴天多、夏天暖，七月午后常在二十度以上，最高纪录三十度，是岛上少有能穿短袖过夏天的地方。城里的生活跟着发射表走：西坪发射场每有火箭升空，和平区的面包店前一天就开始卖火箭形状的奶油面包，发射当天学校停课一小时，全城人站在街边，仰头看火箭拖着白烟划过三面雪峰。飞船回到降落场时，深空太空军按惯例在指挥中心门口敲响一口铜钟，钟声一响，附近的居民就知道「有人回家了」。军人和工程师来自全岛各地，各基地食堂的炖牛肉、饺子和烤鳕鱼互相比拼，每年秋天还有一次对公众开放的「食堂开放日」，排队的人能从东营一直排到星港。"
    en: "A military city in the mountains of eastern North Viking Island, ringed on three sides by the snow peaks of the Maslin Range, with only its eastern edge opening onto flat land by the coast. The city is vast, but only about a hundred and twenty-five thousand people live here, some thirty-five thousand of them service personnel. The Air Force, the Deep Space Force and the Army keep more than thirty bases and facilities here, making it the territory's most important defence and space base. The Deep Space Force command centre, the deep-space tracking station and the Viking–Maslin Mountain Launch and Landing Centre are the core of the territory's space activity: rockets lift off from West Heath, and spacecraft land here, are refurbished and fly again. Air Force fighter bases, early-warning radars and the flight academy guard the island's skies, and the Army's joint training base and cold-weather ranges spread between Snow Valley and the high peaks. Defence, space and research are the whole economy; engineers, technicians, service members and their families make up most of the population, the share of working-age adults is the highest on the island and there are few elderly people. Peace is the civic centre, Starport, East Camp, West Heath and Snow Valley each have their own role, and the High Peaks Training Area is run jointly by the territory and the garrison. Expressways and highways tie the districts together, two railways meet here, and the Maslin Mountain Aerospace Railway links the port at East Camp with the launch site at West Heath. Most residents speak Chinese at home; the city is orderly, and parts of it are open to visitors.\nMaslin Mountain is the driest city on the island, with only some 840 mm of rain a year. It has many sunny days and warm summers, with July afternoons often above 20 °C and a record of 30 °C, one of the few places on the island where you can spend the summer in short sleeves. Life here runs to the launch schedule: whenever a rocket is due to lift off from the West Heath launch site, the bakeries of Peace District start selling rocket-shaped cream buns the day before; on launch day schools stop for an hour, and the whole city stands in the streets watching the rocket trail white smoke past the snowy peaks on three sides. When a spacecraft comes back to the landing site, the Deep Space Force rings a bronze bell outside its command centre, and at the sound the neighbours know that \"someone is home\". Soldiers and engineers come from all over the island, the base canteens compete with their beef stews, dumplings and roast cod, and each autumn a public canteen open day draws a queue from East Camp all the way to Starport."
