  notes:
    zh: 维京语意为「山地」，是维京港与自由市之间的贝格兰丘陵，也是维京港市人口最少的区。丘陵上覆盖着云杉、桦树和松树的混交林，大部分划为森林公园，林间有徒步道、山地自行车道和湖泊，周末是两座城市居民的后花园。区里只有零散的村镇和低密度别墅区，许多退休人员和在维京港工作的家庭选择住在这里，享受安静的山林生活，居民年龄明显偏大。林业仍是传统产业，林场采伐与苗圃培育在严格的轮作制度下进行，木材加工厂为全岛供应建材和家具板材；旅游业则依靠林间木屋、乡村餐馆和冬季越野滑雪道。自维高速以隧道穿过丘陵，十几分钟即可往返维京港与自由市，北河公路则沿丘陵东缘通往沙洲。区内保存着许多维京式农庄和石砌围栏，维京语仍是日常用语。贝格兰为两座城市提供了水源、木材和休闲空间，被视为城市之间珍贵的绿色屏障，新的开发受到严格限制。
    en: "Bergland means \"hill country\" in Viking. The district is the Bergland Hills between Viking Port and Freedom City, the least populated district of Viking Port. The hills are covered with mixed forest of spruce, birch and pine, most of it a forest park with hiking trails, mountain-bike routes and lakes, the weekend back garden of both cities. There are only scattered villages and low-density homes, and many retirees and families who work in Viking Port choose to live here for the quiet of the woods, so residents are noticeably older than the city average. Forestry remains the traditional trade: logging and nurseries run on strict rotation, and timber mills supply building materials and furniture board to the whole island. Tourism relies on forest cabins, country restaurants and cross-country ski trails in winter. The Freedom–Viking Port Expressway crosses the hills in a tunnel, putting the two cities a quarter of an hour apart, and the North River Highway follows the eastern edge of the hills to Sandbar. Many Viking-style farmsteads and stone field walls survive, and Viking is still the everyday language. Bergland gives both cities water, timber and room to breathe, and is valued as a green barrier between them; new development is strictly limited."
