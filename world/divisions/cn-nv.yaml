  flag: north_viking
  flag_notes:
    zh: "深蓝底上一个偏向旗杆的白色北欧十字，十字交叉处一颗金色八角星。十字取自岛上最早的城市维京港的市旗，代表维京航海者的传统；深蓝是环岛的北方海洋，八角星的八道光芒指向四面八方，代表岛上的各个族群和八方来客汇聚一岛。"
    en: "A white Nordic cross set towards the hoist on deep blue, with a gold eight-pointed star where its arms meet. The cross comes from the flag of Viking Port, the island's oldest city, and stands for its seafaring Viking tradition; the blue is the northern sea round the island, and the star's eight points reach in every direction for the peoples and newcomers gathered on one island."
  climate_notes:
    zh: "西南风从暖流上空吹来，给这座高纬度的岛带来远比纬度温和的天气。迎风的沿海城市冬暖夏凉，维京港一月平均约 1 度，七月约 14 度，很少下大雪；海风撞上山地后抬升成雨，天城一年降水接近 2300 毫米，是全岛最湿的城市。翻过山脊，背风的内陆雨少了一大半，冬冷夏暖，马斯林山一年只有约 840 毫米降水，七月午后约 20 度，最高纪录 30 度；新城、洛龙山等高处的城市一月平均在零下 7 度上下。中部高山终年寒冷，群峰训练管理区年平均零下 3.5 度，属于苔原气候。全岛十月雨最多，四五月最干；冬至前后白昼不到 6 小时，夏至前后长达 19 小时。"
    en: "South-westerly winds blow in over the warm current and give this high-latitude island far milder weather than its latitude suggests. The windward coastal cities have mild winters and cool summers: Viking Port averages about 1 °C in January and 14 °C in July and seldom sees heavy snow. Where the sea wind meets the mountains it rises and rains, and Skytown gets close to 2,300 mm a year, the wettest city on the island. Beyond the ridges the sheltered interior gets less than half as much and has colder winters and warmer summers: Maslin Mountain gets about 840 mm a year, with July afternoons near 20 °C and a record of 30 °C, while upland cities such as New City and Lorond Mountain average around −7 °C in January. The central peaks are cold all year; the High Peaks Training Area averages −3.5 °C and has a tundra climate. October is the wettest month across the island and April and May the driest; around midwinter the day is under 6 hours long, around midsummer 19 hours."
  traits: { industries: [port, trade, research, aerospace] }
  notes:
    zh: "北维京岛领地是北方海洋上的一座大岛，陆地约 17.8 万平方公里，人口约 600 万，下设 12 个市级单位。西南风从暖流上空吹来，西岸和南岸冬暖夏凉、雨水充沛；岛的中部是洛龙山脉和马斯林山脉，最高峰蒂鲁尤阿克峰海拔 4313 米，峰顶四周是五千多平方公里的雅尔斯托尔冰原；最长的雅利基卢克河从洛龙山脉东坡一路向北入海，最大的湖泊是勒克尔的克拉尔瓦滕湖。\n地名分成几层，讲的是这座岛由谁、在什么时候开发：西海岸和北海岸的老港口和渔镇用维京语名，维京港是岛上最早的城市；中部平原和内陆山谷原是原住民的农牧地，用塔夫鲁纳克语名；东南海岸的老贸易港用巴克汉姆语名；领地设立后规划的首府、新城、航天和军事城市用中文名。首府自由市只有三十八万多人，维京港是最大的城市，南端的贝克勒自由贸易区人口第二。中文母语者约占一半，维京语接近三成，巴克汉姆语一成多。经济靠港口与航运、维京港和贝克勒的金融、西北市和马斯林山的科研与航天、萨科勒的制造业、勒克尔和塔夫鲁普库维克的农牧业，以及天城的旅游，人均生产总值约 6.6 万美元；马斯林山是领地的国防与航天基地。环北维京岛高速绕岛一周，全长约 1900 公里，维长高速和维长城际铁路经海底隧道通往维京群岛的长船。\n维京群岛的人把北维京岛叫作「上岛」，因为在地图上它在群岛的北边；北维京岛人则管群岛叫「下面」，去长船出差说成「下去一趟」。岛上的路牌用中文、维京语和巴克汉姆语三种文字书写，内陆的塔夫鲁纳克语地名又长又难念，司机们公认最费舌头的是塔夫鲁普库维克。全岛饮食的底色是鳕鱼、土豆、黑麦和乳制品，各地又各有招牌：维京港的熏鲱鱼、勒克尔的盐粒硬奶酪、萨科勒的番茄鱼汤、自由市的鲜奶奶冻。秋天的勒克尔丰收节和夏至前后维京港的午夜鸣笛，是岛上的人一年里最盼着的两个日子。"
    en: "The Territory of North Viking Island is a large island in the northern seas, some 178,000 km² of land with about 6 million people in 12 city-level units. South-westerly winds blow in over a warm current, giving the west and south coasts mild winters, cool summers and plenty of rain. The middle of the island is taken up by the Lorond and Maslin ranges; the highest summit, Mount Tirrujuaq, rises to 4,313 m amid the more than 5,000 km² of the Jarlstol Icefield. The longest river, the Jaalikiluk, runs north from the eastern slopes of the Lorond Range to the sea, and the largest lake is Lake Klarvatn in Lekor.\nThe place names come in layers that tell who opened up each part of the island and when. The old ports and fishing towns of the west and north coasts have Viking names, and Viking Port is the island's oldest city; the central plain and the inland valleys were native farmland and pasture and have Tavrunaq names; the old trading ports of the south-east coast have Buckham names; and the capital, New City and the space and military cities planned after the territory was founded have Chinese names. The capital, Freedom City, has only some 385,000 people; Viking Port is the largest city and the Beckerle Free Trade Zone at the southern tip the second. About half the people grew up speaking Chinese, nearly three in ten Viking and over one in ten Buckham. The economy rests on ports and shipping, finance in Viking Port and Beckerle, research and spaceflight in Northwest City and Maslin Mountain, manufacturing in Sakole, farming in Lekor and Tavrupukkuvik and tourism in Skytown, with output of about 66,000 dollars a head; Maslin Mountain is the territory's defence and space base. The North Viking Island Ring Expressway circles the island for some 1,900 km, and the Viking–Longship Expressway and Intercity Railway run through an undersea tunnel to Longship in the Viking Islands.\nIn the Viking Islands people call North Viking Island \"the Upper Island\", since it lies north of them on the map; North Viking Islanders in turn call the archipelago \"down there\", and a business trip to Longship is \"going down for a bit\". Road signs are written in Chinese, Viking and Buckham, and the long Tavrunaq names of the interior are a trial to say: drivers agree that Tavrupukkuvik is the hardest on the tongue. Cod, potatoes, rye and dairy are the common ground of island cooking, and each place has its own speciality: smoked herring in Viking Port, salt-crusted hard cheese in Lekor, tomato fish soup in Sakole, milk jelly in Freedom City. The Lekor Harvest Festival in autumn and the midnight horns of Viking Port around midsummer are the two days islanders look forward to most."
