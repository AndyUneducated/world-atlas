  population: 200000
  area_km2: 4320.0
  traits: { industries: [residential, education, commerce] }
  notes:
    zh: 新城市人口最多的区，由成片新建的社区和学校组成，是全市最典型的居住区。区内按照「十五分钟生活圈」规划，每个社区都有幼儿园、小学、社区医院、菜市场和小公园，住宅以中高层公寓为主，楼宇之间绿树成荫。教育是北苑的名片：新城第一中学是全岛升学率最高的中学之一，新城师范学院为全领地培养中小学教师，许多家庭为了孩子上学专门搬到这里，儿童比例在全市名列前茅。区里的商业以社区商业街和超市为主，居民大多在青坪、中苑或萨科勒上班，早晚高峰时通勤车流密集。伊卡苏瓦高速纵贯全区，向南通往青坪，向北经伊卡苏瓦通往洛龙山；雅利基卢克河公路从这里出发，向东北经上雅利基卢克、阿基尼克通往雅利基卢克市，是新城通往东北部的主要道路。居民大多以中文为母语，社区活动丰富，周末的公园和体育场里满是带孩子的家庭。维贝铁路和新洛铁路在区内的新城站交会；区的北部是索利峰和索利冰川所在的高山，山脚下的森林和溪谷成为居民徒步和野餐的去处。北苑安静、有序，是新城年轻家庭安居乐业的地方。
    en: "New City's most populous district, made up of new neighbourhoods and schools, and the city's typical residential quarter. It is planned around a fifteen-minute neighbourhood: every community has a nursery, a primary school, a clinic, a food market and a small park, and the mid- and high-rise flats stand among shady trees. Education is what North Gardens is known for. New City No. 1 High School sends more pupils on to university than almost any school on the island, and New City Normal College trains teachers for the whole territory; many families move here for their children's schooling, and the share of children is among the highest in the city. Shops are mostly neighbourhood high streets and supermarkets, and most residents work in Greenmead, Central Gardens or Sakole, so traffic is heavy at rush hour. The Ikkasuvva Expressway runs the length of the district, south to Greenmead and north through Ikkasuvva to Lorond Mountain, and the Jaalikiluk River Highway starts here and runs north-east through Upper Jaalikiluk and Aaqqiniq to Jaalikiluk City, New City's main road to the north-east. Most residents speak Chinese at home, community life is busy, and at weekends the parks and sports grounds are full of families with children. The Viking Port–Beckerle and New City–Lorond Mountain railways meet at New City Station in the district. To the north rise Mount Sorley and the great Sorley Glacier, and the forests and valleys at their foot are where people go walking and picnicking. Calm and orderly, North Gardens is where New City's young families settle down."
