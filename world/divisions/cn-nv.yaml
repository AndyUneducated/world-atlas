  population: 46000
  area_km2: 4300.0
  traits: { industries: [defence, education, healthcare] }
  notes:
    zh: 马斯林山市的市政中心和生活中心，也是全市人口最多的区，区名寄托着守护和平的愿望。马斯林山市人民政府、学校、商场和主要的居民社区都在区内，驻军家属和地方居民在这里生活、上学和就医。北维京岛维和部队指挥部是领地维和部队的指挥机关，负责全岛的联合防务和应急救援；马斯林山飞行学院培养空军和深空太空军的飞行员，教练机每天在区内的机场起降；和平航天员训练中心拥有离心机、失重模拟舱和水下训练池，是领地航天员的摇篮；马斯林山军医院是全市规模最大的医院，同时向地方居民开放。和平卫星地面站、和平防空阵地和和平直升机场分布在区的外围。国防、教育和医疗是区里最大的雇主，劳动年龄人口比例很高。马斯林山空天高速和雪谷公路在区内交会，前者东接东营、西通雪谷，后者连接天台、雪谷、西坪和星港。居民大多以中文为母语，社区里军地融合，周末的广场和体育馆里常能看到穿便装的军人和家人。和平区背靠雪山、面向平原，是这座军事城市里最有烟火气的地方。
    en: "The civic and everyday centre of Maslin Mountain City and its most populous district, named in the hope of keeping the peace. The city government, schools, shops and the main residential neighbourhoods are here, and service families and local residents live, study and see their doctors in the district. The North Viking Island Peacekeeping Command directs the territory's peacekeeping forces and is responsible for the island's joint defence and emergency relief. The Maslin Mountain Flight Academy trains pilots for the Air Force and the Deep Space Force, and its trainers take off and land at the district airfield every day. The Peace Astronaut Training Centre, with its centrifuge, weightlessness simulators and underwater training pool, is the cradle of the territory's astronauts, and the Maslin Mountain Military Hospital, the largest hospital in the city, is open to civilians too. The Peace Satellite Ground Station, the Peace Air Defence Site and the Peace Heliport lie on the edges of the district. Defence, education and healthcare are the biggest employers, and the share of working-age adults is high. The Maslin Aerospace Expressway and the Snow Valley Highway meet here: the first runs east to East Camp and west to Snow Valley, the second links Sky Terrace, Snow Valley, West Heath and Starport. Most residents speak Chinese at home, military and civilian life are woven together, and at weekends the squares and sports halls are full of off-duty service members and their families. With snow mountains behind it and the plain in front, Peace is the most homely place in this military city."
- id: div_nytsvb
  subtype: borough
  parent: div_rdypg7
  status: canon
  names:
    zh: 星港区
    en: Starport District
    art-x-viking: Sternhafen
    art-x-buckham: Porto Stella
  codes:
    admin: '901102'
  population: 32000
  area_km2: 4300.0
  traits: { industries: [defence, aerospace, research] }
  notes:
    zh: 深空太空军马斯林山指挥中心的驻地，是领地航天与深空活动的指挥中枢。星港指挥中心负责航天发射、在轨飞行器和深空探测任务的指挥调度，全天候运转；星港深空测控站的大口径天线阵追踪着飞往月球和行星际空间的探测器，接收来自深空的信号。星港是一座航天港，拥有发射工位和着陆场，星港发动机试车台进行火箭发动机的地面点火试验，试车时轰鸣声在山谷中回荡数十公里；星港无人机基地起降侦察与中继无人机，星港海岸雷达站和星港防空阵地守卫着东部海岸。星港航天博物馆是区里唯一向公众常年开放的设施，展出退役的火箭、返回舱和深空探测器模型，每逢发射日都有大批游客和航天爱好者前来。区内常住人口约三万多，绝大多数是军人、航天工程师和他们的家属，劳动年龄人口比例极高。雪谷公路的终点就在区内，经群峰、西坪通往和平区和天台。马斯林河在区内汇入大海。居民大多以中文为母语，街道以航天器和星座命名。星港是北维京岛通往深空的大门，也是全领地科技最尖端的地方之一。
    en: Home of the Deep Space Force's Maslin Mountain command centre and the nerve centre of the territory's space and deep-space activity. The Starport Command Centre directs launches, spacecraft in orbit and deep-space missions around the clock, and the large dishes of the Starport Deep Space Station track probes bound for the Moon and interplanetary space and listen for their signals. Starport itself is a spaceport with launch pads and a landing zone. At the Starport Engine Test Stands rocket engines are fired on the ground, and during a test the roar echoes for tens of kilometres through the valleys. The Starport Drone Base flies reconnaissance and relay drones, and the Starport Coastal Radar Station and the Starport Air Defence Site guard the eastern coast. The Starport Space Museum is the only facility open to the public all year, showing retired rockets, return capsules and models of deep-space probes, and on launch days crowds of visitors and space fans arrive. Some thirty thousand people live here, nearly all service members, space engineers and their families, with a very high share of working-age adults. The Snow Valley Highway ends in the district and runs through the High Peaks and West Heath to Peace and Sky Terrace. The Maslin River reaches the sea in the district. Most residents speak Chinese at home, and the streets are named after spacecraft and constellations. Starport is North Viking Island's door to deep space and one of the most technologically advanced places in the territory.
