  population: 150000
  area_km2: 9590.4
  traits: { industries: [tourism, forestry] }
  notes:
    zh: 洛龙山南部的高山峡谷区，深峡在群峰之间切出数十公里长的谷地，谷底散布着古老的山村和梯田，以壮丽的峡谷风光和瀑布闻名。深峡瀑布公园是全岛最著名的自然景区，峡谷两壁的冰川融水汇成多级瀑布，最高一级落差上百米，夏季水量最大时轰鸣声在谷中回荡；谷底的深峡湖是一座冰川堰塞湖，湖水呈碧绿色，四周是陡峭的岩壁。景区内修建了栈道、吊桥和观景台，观光步道沿峡谷延伸，是徒步者和摄影爱好者的天堂，旅游业是区里最主要的收入来源。山坡上的森林由村民和林场共同经营，木材和木工艺品是传统的副业。深峡高速从区内穿过，北接龙关，南经北苑、青坪通往新城，高速在峡谷中以一连串桥梁和隧道穿行，本身也是一道风景。居民以维京语为母语，许多村落只有几十户人家，年轻人多外出工作，老人留守，夏季游客到来时村里才热闹起来。深峡的山村保留着传统的木屋和石墙，冬季大雪覆盖时宛如童话世界。
    en: "The high gorge country of southern Lorond Mountain. The Deep Gorge cuts a valley tens of kilometres long between the peaks, and its floor is dotted with old mountain villages and terraced fields; the district is famous for its gorge scenery and waterfalls. Deep Gorge Falls Park is the best-known natural attraction on the island: meltwater from the glaciers above pours down the gorge walls in a staircase of falls, the highest dropping more than a hundred metres, and when the flow peaks in summer the roar echoes down the valley. Gorge Lake on the valley floor is a glacial lake dammed by debris, emerald green and walled by sheer cliffs. Boardwalks, suspension bridges and viewpoints run through the park and trails follow the gorge, a paradise for hikers and photographers, and tourism is the district's main income. Villagers and forestry companies share the forests on the slopes, and timber and woodcraft are traditional sidelines. The Deep Gorge Expressway runs through the district, north to Dragon Pass and south through North Gardens and Greenmead to New City, threading the gorge on a chain of bridges and tunnels that is a sight in itself. Residents speak Viking at home; many villages have only a few dozen households, young people mostly work elsewhere and the old stay behind, and the villages only come alive when summer visitors arrive. With their traditional timber houses and stone walls, the gorge villages look like something from a fairy tale under winter snow."
