  population: 147000
  area_km2: 3520.0
  traits: { industries: [logistics, residential, manufacturing] }
  notes:
    zh: 新城市南部面向萨科勒方向的区，区名取自旧时的驿站，如今是连接新城与萨科勒、贝克勒的快速路和公交走廊。南岸公路纵贯全区，沿线有密集的公交专用道和通勤班车，每天早晚大批居民经这里往返萨科勒的工厂和贝克勒的写字楼。新城机场位于区的南部，有航班通往维京港、自由市、西北市和维京群岛，也是本岛南部的航空货运站；南驿物流园紧邻机场和公路，仓储、配送和电商分拣中心聚集，物流业是区里最大的雇主。区内还有一批为萨科勒工业园配套的零部件、包装和印刷工厂，轻工业与物流相互依存。住宅区沿走廊两侧分布，房价比青坪和中苑低，吸引了大量年轻工人家庭，是全市儿童比例最高的区之一。居民大多以中文为母语，社区里有许多新开的学校、诊所和超市。区的西南部仍保留着一些农田和苗圃，为城市提供蔬菜和花木。南驿以交通便利和就业机会多著称，是新城与南部工业区之间的纽带，也是全市发展最快的地方之一。
    en: The district in the south of New City facing Sakole. Its name recalls an old post station, and today it is the expressway and bus corridor linking New City with Sakole and Beckerle. The South Coast Highway runs its length, with bus lanes and commuter coaches, and every morning and evening crowds of residents travel this way to the factories of Sakole and the offices of Beckerle. New City Airport, in the south of the district, has flights to Viking Port, Freedom City, Northwest City and the Viking Islands and is the air-freight station for the south of the island. The South Post Logistics Park next to the airport and the highway gathers warehouses, distribution centres and parcel sorting halls, and logistics is the district's biggest employer. There are also parts, packaging and printing plants serving the Sakole industrial parks, so light industry and logistics depend on each other. Housing lines both sides of the corridor; homes cost less than in Greenmead and Central Gardens, so many young working families live here, and it has one of the highest shares of children in the city. Most residents speak Chinese at home, and the neighbourhoods are full of new schools, clinics and supermarkets. Farmland and nurseries survive in the south-west, supplying the city with vegetables, flowers and trees. South Post is known for good connections and plentiful jobs, the link between New City and the industrial south, and one of the fastest-growing parts of the city.
