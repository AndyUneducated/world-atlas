  flag: { layout: ensign, colors: ['#8E2445', '#FFFFFF'], charge: key, charge_color: '#C9962E' }
  flag_notes:
    zh: "领地旗方角旗：玫红底，右侧白色圆徽里是一把金色钥匙。新城按统一规划建成，第一批居民是从各地迁来、排队领钥匙入住的年轻家庭，钥匙由此成了城市的标志；玫红是市花月季的颜色，也代表这座城市年轻的人口。每年开学，新城第一中学的新生都会领到一枚印着这把钥匙的校徽。"
    en: "A territorial ensign in rose red, the white badge bearing a gold key. New City was built to a single plan, and its first residents were young families from across the island who queued for the keys to their new homes, so the key became the city's sign; the rose red is the city flower and its young population. Each new pupil at New City No. 1 Secondary School is given a badge with the key on it."
  traits: { industries: [residential, commerce, manufacturing], heritage: chinese, age: young }
  notes:
    zh: "北维京岛南部新建成的现代化居住中心，领地建立之初从原马斯林山市析出设市，居民多在邻近的萨科勒市和贝克勒自由贸易区工作。全市按照统一规划建设，高层住宅、学校、医院、公园和轨道交通同步配套，是全岛最年轻的城市之一，儿童和年轻家庭比例很高，平均年龄远低于全岛水平。经济以居住服务、商贸和轻工业为主：青坪区是商业和交通枢纽，青坪购物中心和新城体育中心是全市最热闹的地方；北苑区是成片的新社区和学校，新城第一中学和新城师范学院在全岛享有盛名；南驿区面向萨科勒方向，新城机场和南驿物流园带动了物流和制造业；中苑区是从青坪区析出的新市中心，市政府、新城国际会展中心和中苑公园都在这里，会展和商务服务日益兴旺。环北维京岛高速、伊卡苏瓦高速、南岸公路和雅利基卢克河公路在市内交会，维贝铁路在新城站停靠，新洛铁路从这里出发通往洛龙山。居民大多以中文为母语，城市干净整洁、生活便利，是年轻人在本岛安家的首选之一。\n新城是岛上人口最年轻的城市之一，傍晚的中苑公园里到处是推着婴儿车散步的年轻父母，其他城市的人干脆叫它「婴儿车之城」。这里的居民大多在萨科勒和贝克勒上班，每天清晨从新城站开出的第一班维贝铁路列车被称作「咖啡车」，卖热咖啡和奶油面包的推车从车头走到车尾，车到萨科勒时满车的人刚好醒透。城市太新，没有老字号，青坪购物中心门口的周末夜市就成了最地道的去处：烤肠、炸鳕鱼条、勒克尔奶酪焗土豆，还有从岛上各地搬来的家庭带来的家乡菜。新城的冬天比沿海冷得多，一月夜里常在零下十度以下，北苑区的学校每逢大雪就把操场浇成溜冰场，体育课改成滑冰课，这里的孩子几乎个个会滑冰。"
    en: "A modern residential centre built new in the south of North Viking Island, carved out of the old Maslin Mountain City when the territory was founded; many residents work in neighbouring Sakole and the Beckerle Free Trade Zone. The city was built to a single plan, with high-rise housing, schools, hospitals, parks and rail transit delivered together. It is one of the youngest cities on the island, with many children and young families and an average age well below the island's. The economy rests on residential services, commerce and light industry. Greenmead is the shopping and transport hub, where Greenmead Shopping Centre and the New City Sports Centre are the busiest places in town. North Gardens is a spread of new neighbourhoods and schools, and New City No. 1 High School and New City Normal College are known across the island. South Post faces Sakole, and New City Airport and the South Post Logistics Park bring logistics and manufacturing. Central Gardens, split off from Greenmead, is the new city centre, with the city government, the New City International Exhibition Centre and Central Gardens Park, and conferences and business services are growing fast. The ring expressway, the Ikkasuvva Expressway and the South Coast and Jaalikiluk River highways meet in the city; the Viking Port–Beckerle Railway stops at New City Station, and the New City–Lorond Mountain Railway starts here. Most residents grew up speaking Chinese, and the clean, convenient city is one of the first choices for young people setting up home on the island.\nNew City is one of the youngest cities on the island, and in the evening Central Gardens Park is full of young parents pushing prams, so the rest of the island simply calls it \"Pram City\". Most residents work in Sakole and Beckerle, and the first Viking Port–Beckerle train out of New City Station each morning is known as \"the coffee train\": a trolley of hot coffee and cream buns works its way from front to back, and by the time the train reaches Sakole everyone aboard is fully awake. The city is too new to have old-established eateries, so the weekend night market outside the Greenmead Shopping Centre is the place to eat: grilled sausages, fried cod fingers, potatoes baked with Lekor cheese, and home dishes brought by families who moved here from all over the island. Winters are much colder than on the coast, with January nights often below −10 °C; when heavy snow falls, the schools of North Gardens flood their playgrounds into ice rinks and PE becomes skating, so nearly every child here can skate."
