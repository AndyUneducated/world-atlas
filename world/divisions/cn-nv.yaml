  status: generated
  names:
    zh: 上厄定改良区
    en: Upper Erding Improvement District
    art-x-viking: Obererding
    art-x-buckham: Alto Erding
  codes:
    admin: '901203'
  population: 2400
  area_km2: 9000.0
  traits: { industries: [agriculture, forestry] }
  notes:
    zh: 厄定河上游的无建制荒野，面积九千平方公里，常住人口只有约两千四百人，是全岛人口最稀少的地区之一。这里不设区议会，道路养护、消防、学校和医疗等公共服务由领地政府直接提供，「改良区」之名源于领地对这片土地进行垦荒和改良的长期计划。区内是厄定河上游的河谷、沼泽、针叶林和苔原，零散分布着几处农场、林场和护林站，少数居民在河谷平地上种植耐寒的大麦和饲草，或在森林中从事伐木和狩猎向导，许多家庭靠领地的补贴和季节性工作维持生计。上厄定的荒野保存着全岛最完整的原始生态，驼鹿、狼、熊和猛禽在此栖息，厄定河的上游河段是鲑鱼的产卵地，吸引着野外探险者、垂钓者和摄影师。厄定河公路是区内唯一的公路，从新城北苑出发，沿河谷向东北通往旧府和厄定，沿途设有几处加油站和应急避难所。居民以维京语为母语，老年人比例较高，冬季大雪封路时，居民依靠雪地摩托和直升机与外界联系。上厄定荒凉而纯净，是北维京岛最后的荒野之一。
    en: "Unincorporated wilderness on the upper Erding River, nine thousand square kilometres with only about two thousand four hundred residents, one of the emptiest parts of the island. There is no district council: road maintenance, firefighting, schools and healthcare are provided directly by the territorial government, and the name \"improvement district\" comes from the territory's long-running plan to clear and improve the land. The district is the valleys, marshes, conifer forests and tundra of the upper Erding, dotted with a few farms, forestry camps and ranger stations. A handful of residents grow hardy barley and fodder on the valley floor or work as loggers and hunting guides, and many families get by on territorial support and seasonal work. Upper Erding keeps the most intact natural ecosystem on the island: moose, wolves, bears and birds of prey live here, and the upper river is a salmon spawning ground that draws wilderness travellers, anglers and photographers. The Erding River Highway is the only road, running from North Gardens in New City north-east up the valley to Old Prefecture and Erding, with a few filling stations and emergency shelters along the way. Residents speak Viking at home and the share of older people is high; when snow closes the road in winter, people keep in touch with the outside world by snowmobile and helicopter. Desolate and pure, Upper Erding is one of the last wildernesses of North Viking Island."
