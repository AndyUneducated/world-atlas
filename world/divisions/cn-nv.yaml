  area_km2: 1900.0
  traits: { industries: [research, aerospace, tech], age: young }
  notes:
    zh: 科学大道向东延伸形成的科研新城，从望星区析出单独设区，是北维京岛最年轻的城区之一。区内聚集了国家实验室、北维京大学的分校、航天企业和高科技公司，研究方向涵盖航天动力、卫星通信、新材料、人工智能和量子技术，许多成果直接用于马斯林山的航天发射和深空任务。航天器部件、精密仪器和软件企业沿科学大道排开，研发与制造并重，使科学城的人均产出位居领地前列。居民以年轻的科研人员、工程师和研究生为主，劳动年龄人口比例极高，老年人很少；社区配有国际学校、人才公寓和创新孵化中心。城区按照紧凑的规划建设，实验楼、住宅和公园相互穿插，步行和自行车出行很方便，街道以科学家和星座命名。观星高速的终点设在区内，向西经望星、林道直达自由市，科研人员在首府与科学城之间往返只需很短时间。科学城面积不大，却是领地创新最集中的地方，被视为北维京岛面向未来的窗口。
    en: The research new town that grew where Science Avenue runs east, split off from Stargaze as a district of its own and one of the newest urban districts on North Viking Island. National laboratories, a branch campus of the University of North Viking, aerospace firms and high-tech companies are concentrated here, working on space propulsion, satellite communications, new materials, artificial intelligence and quantum technology, and much of what they produce goes straight into the launches and deep-space missions at Maslin Mountain. Spacecraft parts, precision instruments and software firms line Science Avenue, with research and manufacturing side by side, putting Science City near the top of the territory for output per head. Residents are mostly young researchers, engineers and postgraduates, the share of working-age adults is very high and there are few elderly people; neighbourhoods have international schools, housing for skilled newcomers and innovation incubators. The town is built compactly, with laboratories, homes and parks woven together, easy to get around on foot or by bike, and streets named after scientists and constellations. The Stargazer Expressway ends here and runs west through Stargaze and Lindau to Freedom City, so researchers can move between the capital and Science City quickly. Science City is small, but no place in the territory is more concentrated on innovation, and it is seen as North Viking Island's window on the future.
