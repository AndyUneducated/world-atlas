  names:
    zh: 卡蒂尔尤阿克区
    en: Katirjuaq District
    art-x-viking: Katirjuaq
    art-x-buckham: Katirjuaq
  codes:
    admin: '900601'
  population: 124000
  area_km2: 3042.0
  traits: { industries: [logistics, ski, commerce] }
  notes:
    zh: 洛龙山脉东麓谷地里的集镇，因西南的卡蒂尔尤阿克山口得名，是全市的行政中心和本岛中部最重要的公路枢纽。卡蒂尔尤阿克山口自古就是翻越洛龙山脉中北段的要道，旧时的驿站、马厩和关卡至今保存在卡蒂尔尤阿克驿站博物馆里，讲述着商队和邮差冒雪翻山的故事。如今卡蒂尔尤阿克高速从勒克尔方向来到这里，伊卡苏瓦高速从新城方向经伊卡苏瓦区抵达，纳帕图克公路则把塔夫鲁普库维克平原和克拉尔瓦滕湖连在一起，三条道路在集镇所在的谷地交会，物流园、加油站和公路服务区沿路排开，过境货运是区里的重要收入。洛龙山市人民政府、医院、学校和商业街集中在集镇中心，为整个山区提供服务。冬季运动是卡蒂尔尤阿克的另一张名片：集镇两侧的山坡上建有多条雪道，滑雪场、雪具店和山间旅馆在冬季人满为患，夏季则转为徒步和山地自行车基地。居民以维京语为母语，许多人从事运输、旅游和公共服务，老年人比例较高。卡蒂尔尤阿克集镇建在狭长的山谷里，石砌房屋依坡而建，四周雪峰环绕，景色壮丽，是穿越洛龙山的旅客停留休整的地方。
    en: "The town in a valley on the eastern side of the Lorond Range, named after Katirjuaq to its south-west; it is the city's administrative centre and the most important road junction in the middle of the island. Katirjuaq has always been the main way over the northern Lorond Range. The old post house, stables and toll gate survive in the Katirjuaq Post House Museum, which tells of caravans and postmen crossing the mountains in the snow. Today the Katirjuaq Expressway arrives from Lekor, the Ikkasuvva Expressway comes up from New City through Ikkasuvva, and the Napatuuq Highway links the Tavrupukkuvik plain with Klarvatn; the three meet in the town's valley, where logistics yards, filling stations and service areas line the roads and through freight is a major source of income. The city government, the hospital, schools and the shopping street are grouped in the town centre and serve the whole mountain region. Winter sports are the other side of Katirjuaq: runs are laid out on the slopes on both sides of the town, and ski areas, ski shops and mountain inns are packed in winter, becoming a base for hiking and mountain biking in summer. Residents speak Viking at home, many work in transport, tourism and public services, and the share of older people is high. The town fills a long, narrow valley, its stone houses climbing the slopes and snow peaks all around, and travellers crossing the Lorond mountains stop here to rest."
- id: div_k5f1mz
