  population: 126000
  area_km2: 3860.0
  traits: { industries: [research, aerospace, defence] }
  notes:
    zh: 西北市的科研核心，沿科学大道展开，深空太空军北维京研发中心等重要科研设施都在区内。研发中心的园区占地广阔，负责深空探测器、测控系统和航天材料的研究，与马斯林山的发射场、测控站紧密合作；望星天文台建在望星湾畔的高地上，拥有领地最大的民用光学望远镜，晴朗的夜晚向公众开放观星。国家实验室、航天研究所和配套的精密仪器企业聚集在大道两侧，科研和航天工业使望星成为全岛人均产出最高的区之一。居民以科研人员、工程师和军方技术人员为主，劳动年龄人口比例很高，社区配有国际学校和外国专家公寓。望星湾和望瓦罗角是区里的海岸风景，海湾平静，夜空清澈，是北维京岛观测极光的热门地点。观星高速从区内穿过，西接林道和自由市，东到科学城，科研通勤车每天在这条走廊上往返。区里的东部曾析出设立科学城，两地如今连成一片科研走廊。望星区以「仰望星空」的科学精神为荣，街道名称多取自星座和天文学名词。
    en: The research heart of Northwest City, laid out along Science Avenue, with the Deep Space Force North Viking Research and Development Centre and other major research facilities. The centre's wide campus works on deep-space probes, tracking systems and spacecraft materials, in close partnership with the launch site and tracking stations at Maslin Mountain. The Stargaze Observatory stands on high ground above Stargaze Bay with the territory's largest civilian optical telescope and opens to the public on clear nights. National laboratories, aerospace institutes and precision-instrument makers line the avenue, and research and the space industry make Stargaze one of the districts with the highest output per head on the island. Residents are mostly scientists, engineers and military technical staff, with a very high share of working-age adults, and the district has international schools and flats for visiting experts. Stargaze Bay and Cape Stargaze give the district its coastline; the calm bay and clear skies make it a favourite place to watch the aurora. The Stargazer Expressway runs through, west to Woodway and Freedom City and east to Science City, and research shuttle buses ply the corridor every day. The eastern part of the district was split off to form Science City, and the two now form a single research corridor. Stargaze is proud of its spirit of looking up at the stars, and many of its streets are named after constellations and astronomical terms.
