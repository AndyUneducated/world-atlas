  notes:
    zh: 厄定河东岸高原上的驯鹿冬季牧场，常住人口每平方公里不到零点四人，是全岛唯一以游牧为主要生计的地区。每年秋季，牧民赶着驯鹿群从北部的夏季牧场南迁到这片高原，在苔原和疏林间度过冬天，春天再随着冰雪消融北上，这种迁徙方式已经延续了许多代。驯鹿放牧是区里最主要的产业，驯鹿肉、鹿皮、鹿角工艺品和熏制鹿肉是牧民的主要收入，驯鹿原牧民集市每年冬季开市，牧民在这里出售产品、交换物资，也是游客体验牧民文化的窗口。近年来，牧区发展起生态旅游，游客可以乘坐驯鹿雪橇、住进牧民的帐篷、观赏极光，收入补充了牧民的生计。牧区的公共服务由领地提供，流动学校和流动诊所随牧民一起迁徙。维京语和中文母语者大约各占一半，年轻人和儿童的比例比周边地区略高，许多年轻牧民在学习现代牧业技术的同时坚持传统。牧场边缘连着五千多平方公里的王座冰原。厄定河公路从区内穿过，西接旧府，东通厄定。驯鹿原的冬天寂静辽阔，鹿群在雪原上缓缓移动，是北维京岛最独特的风景。
    en: "The winter reindeer pastures on the upland east of the Erding River, with fewer than 0.4 residents per square kilometre, the only part of the island where herding is the main way of life. Every autumn the herders drive their reindeer south from the summer pastures in the north to this upland, where the herds winter among tundra and open woodland before heading north again in spring as the snow melts; this migration has gone on for many generations. Reindeer herding is the main trade: meat, hides, antler crafts and smoked reindeer are the herders' chief income. The Reindeer Range Herders' Market opens every winter, where herders sell their produce and trade supplies, and it is also visitors' window on herding culture. Nature tourism has grown up on the range; visitors ride reindeer sleds, stay in herders' tents and watch the aurora, and the income helps the herders get by. Public services come from the territory, with mobile schools and clinics that move with the herders. Viking and Chinese speakers are roughly even in number, and young people and children make up a slightly larger share than in the surrounding districts; many young herders learn modern herding methods while keeping the old ways. At the edge of the pastures lies the Throne Icefield, more than five thousand square kilometres of ice. The Erding River Highway crosses the district, west to Old Prefecture and east to Erding. In the silent, wide-open winter, with herds drifting slowly across the snowfields, the Reindeer Range is the most distinctive landscape on North Viking Island."
