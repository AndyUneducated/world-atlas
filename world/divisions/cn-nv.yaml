  flag: { layout: border, colors: ['#C9962E', '#0B3D91', '#FFFFFF'], charge: sprout, charge_color: '#0B3D91' }
  flag_notes:
    zh: "旗杆一侧是一条深蓝竖带，两行白线夹着五枚阶梯菱形，这是塔夫鲁纳克人织物和皮袍滚边上的传统纹样；其余金黄色的旗面上是一株深蓝色的幼苗。市名意为「土地生长之处」，金黄是平原上成熟的麦田，幼苗是这片深厚土地上的生长。各领地取塔夫鲁纳克语名的城镇都用这种滚边旗。"
    en: "At the hoist a deep blue band carries five stepped diamonds between two white lines, the trim of traditional Tavrunaq weaving and skin coats; the rest of the flag is golden yellow with a deep blue seedling. The city's name means 'where the land grows': the gold is the ripe wheat of the plain and the shoot the growth of its deep soil. Towns with Tavrunaq names in every territory fly flags with this border."
  traits: { industries: [agriculture, food, forestry, logistics], heritage: mixed, age: balanced }
  notes:
    zh: "北维京岛中部的平原城市，领地建立之初从原勒克尔市析出，由普库图克镇和西加维克镇合并设市，市名取自塔夫鲁纳克语，意为「土地生长之处」。全市地势平坦、土壤深厚，是本岛机械化程度最高的粮食和饲料产区，大型农场种植小麦、大麦、油菜和土豆，农产品加工、食品制造和农机维修构成地方工业；牛角湾沿岸的林地和木材加工厂提供了另一部分就业。普库图克区是市政与商贸中心，普库图克农产品集散中心把全市的粮食、蔬菜和肉类运往维京港和新城，塔夫鲁普库维克农机博物馆展示了平原农业的发展历程；西加维克区承接了来自勒克尔和新城方向的通勤人口，新住宅区和塔夫鲁普库维克农业学院让这里更加年轻。牛角湾海滨公园是全市居民夏季消暑的去处。环北维京岛高速、西塔高速、纳帕图克公路和北河公路在市内交会，维贝铁路在塔夫鲁普库维克站停靠，使这里成为本岛中部的交通枢纽和物流节点。居民来源多元，中文、维京语和巴克汉姆语家庭都很多，城镇规划整齐，生活成本较低，吸引了不少年轻家庭。\n市名太长，岛上的人口头上都叫它「塔普」，只有正式场合才说全名，三语路牌上的 Tavrupukkuvik 要缩小字号才放得下。市名背后有一句塔夫鲁纳克语老话：「Tavru pukku, nirsa tuqqa」，意思是「土地肯长东西的地方，驯鹿就会住下来」，本地人常拿它解释为什么那么多年轻家庭搬到这片平原上安家。平原上的吃食离不开土豆：烤土豆配酸奶油、土豆薄饼和大麦土豆汤，秋收后普库图克农产品集散中心门口的土豆品尝会能摆出几十个品种，评出的「年度土豆」会印在第二年的种子袋上。牛角湾海滨公园夏天有一项传统，孩子们在退潮的沙滩上用旧拖拉机轮胎垒城堡，比谁的城堡撑得过下一次涨潮。"
    en: "A city of the plains in the middle of North Viking Island. It was carved out of the old Lekor City when the territory was founded by merging the towns of Pukkutuuq and Siggavik, and its Tavrunaq name means 'where the land grows'. The land is flat and the soil deep, making it the most mechanised grain and fodder region on the island: large farms grow wheat, barley, rapeseed and potatoes, and food processing, food manufacturing and farm-machinery repair form the local industry, while woodland and sawmills along Oxhorn Bay provide more jobs. Pukkutuuq is the civic and trading centre; the Pukkutuuq Produce Distribution Centre sends the city's grain, vegetables and meat to Viking Port and New City, and the Tavrupukkuvik Farm Machinery Museum tells the story of farming on the plain. Siggavik takes commuters from the direction of Lekor and New City, and its new housing estates and the Tavrupukkuvik Agricultural College keep it young. Oxhorn Bay Seaside Park is where the whole city goes to cool off in summer. The ring expressway, the Northwest–Tavrupukkuvik Expressway, the Napatuuq Highway and the North River Highway meet in the city, and the Viking Port–Beckerle Railway stops at Tavrupukkuvik Station, making it a transport hub and logistics node for the middle of the island. Residents come from many backgrounds, with plenty of Chinese-, Viking- and Buckham-speaking households, the towns are neatly planned, and the low cost of living attracts many young families.\nThe name is long, so islanders just say \"Tavrup\" and keep the full name for formal occasions; on the three-language road signs, Tavrupukkuvik has to be set in smaller type to fit. Behind the name lies an old Tavrunaq saying, \"Tavru pukku, nirsa tuqqa\": where the land is willing to grow, the reindeer will stay. Locals use it to explain why so many young families have settled on the plain. Food here means potatoes: baked potatoes with sour cream, potato pancakes and barley-and-potato soup. After the harvest, the potato tasting outside the Pukkutuuq Produce Distribution Centre sets out dozens of varieties, and the \"potato of the year\" is printed on the next year's seed bags. Oxhorn Bay Seaside Park has a summer custom: at low tide children build castles on the sand from old tractor tyres and see whose will survive the next high tide."
