  population: 240000
  area_km2: 2500.0
  traits: { industries: [cruise, tourism, retail] }
  notes:
    zh: 维京语意为「烽火岬」，得名于岬角上旧时为归航船只点燃的烽火。如今这里是维京港的海上客运门户：菲尔内斯客运码头有渡轮通往沙洲、萨科和维京群岛，夏季的邮轮也在此靠岸，码头旁的菲尔内斯海关大楼负责旅客与行李查验。客流带动了区里的零售与服务业，码头背后的步行街集中了免税店、海鲜餐馆、纪念品商店和酒店，夏天游客如织。菲尔内斯湾风平浪静，湾畔修有长长的滨海步道，岬角顶端仍保留着烽火台遗址，是看日落和眺望船只进出的好地方。区里的居民多在码头、酒店和商店工作，季节性明显：夏季人手紧张，冬季则安静许多，不少店铺歇业。西岸公路沿海岸穿过全区，北接海门区，南通瓦尔维克，向北还可一直开到西北市。区内保留了许多维京式木屋和石砌仓库，有的改成了咖啡馆和画廊，维京语招牌随处可见。菲尔内斯是许多游客对维京港的第一印象，也是本地人周末散步、吃海鲜的去处。
    en: "Fyrnes means \"beacon cape\" in Viking, after the fires once lit on the headland to guide ships home. Today it is Viking Port's passenger gateway by sea. Ferries leave the Fyrnes Ferry Terminal for Sandbar, Sako and the Viking Islands, cruise ships call in summer, and the Fyrnes Customs House next to the terminal checks passengers and luggage. The traffic feeds the district's shops and services: the pedestrian streets behind the terminal are full of duty-free shops, seafood restaurants, souvenir stalls and hotels, and crowded with visitors all summer. Fyrnes Bay is calm, a long seafront promenade runs round it, and the old beacon platform still stands on the tip of the cape, a fine place to watch the sunset and the ships coming and going. Most residents work at the terminal, in hotels and in shops, and the rhythm is seasonal: short of hands in summer, much quieter in winter, when many shops close. The West Coast Highway runs the length of the district along the shore, north to Seagate and south to Walvik, and on up the coast to Northwest City. Many Viking-style timber houses and stone warehouses survive, some turned into cafés and galleries, and Viking shop signs are everywhere. For many visitors Fyrnes is their first impression of Viking Port, and for locals it is where they come at weekends to stroll and eat seafood."
