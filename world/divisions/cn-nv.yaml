  names:
    zh: 雅利基卢克市
    en: Jaalikiluk City
    art-x-viking: Jaalikiluk auf Hea
    art-x-buckham: Jaalikiluk en Teatu
    art-x-tavrunaq: Jaalikiluk
  codes:
    admin: '901200'
    unlocode: NV JLK
  population: 20500
  area_km2: 32000.0
  color: '#3FB6C6'
  flag: { layout: seal, colors: ['#2A7F8F', '#0E2A47', '#E9D8A6', '#F4EFE2'], charge: antlers, charge_color: '#0E2A47', legend: art-x-tavrunaq }
  flag_notes:
    zh: "青蓝底正中一枚深蓝圆印，印环上用塔夫鲁纳克语和英语写着市名，米白印心里是一对驯鹿角。这面旗沿用自雅利基卢克还是旧马斯林山市首府的年代，是全岛最古老的市旗之一；驯鹿角代表尼尔萨利特高原上的冬季牧场和随季节迁徙的牧民，青蓝是蜿蜒北流的雅利基卢克河。"
    en: "A deep blue round seal on a teal field, its ring bearing the city's name in Tavrunaq and English and its cream centre a pair of reindeer antlers. The flag goes back to the days when Jaalikiluk was the seat of the old Maslin Mountain City, which makes it one of the oldest city flags on the island; the antlers are the winter pastures of the eastern plateau and the herders who move with the seasons, the teal the river winding north to the sea."
  traits: { industries: [agriculture, herding, heritage], heritage: viking, age: old }
  notes:
    zh: "北维京岛东北部的河谷平原城市，雅利基卢克河发源于洛龙山脉东坡，一路向北，在这里蜿蜒穿过平原注入大海。雅利基卢克河原是旧马斯林山市的首府，领地建立后马斯林山市拆分，首府迁往和平区，雅利基卢克河另设一市。全市面积三万多平方公里，是全岛面积最大的城市，人口却只有约两万，是全岛人口最少、密度最低的城市，大片土地仍是荒野、森林和高原牧场。经济以农牧业为主：雅利基卢克河沿岸的冲积平原种植麦类和饲草，东岸高原上的尼尔萨利特是驯鹿的冬季牧场，牧民随季节迁徙；阿基尼克区的机关旧址和博物馆讲述着这片土地的历史，文化遗产和生态旅游逐渐兴起。基卢克维克区是市政中心和主要集镇，上雅利基卢克改良区是雅利基卢克河上游的无建制荒野，由领地直接提供公共服务。环北维京岛高速和雅利基卢克河公路贯穿全市，前者连接天城和勒克尔，后者向西南通往新城；西马铁路在雅利基卢克站停靠。居民以维京语为主要母语，许多家庭世代务农放牧，老年人比例很高。雅利基卢克河的天地辽阔、人烟稀少，夏季白夜、冬季极光，是北维京岛最原始的地方之一。\n雅利基卢克是全岛面积最大、人口最少的城市，本地人开玩笑说这里「驯鹿比邻居多，邻居比红绿灯多」。市名在塔夫鲁纳克语里是「风河」，牧民之间流传一句老话：「Jaali kiluk, nirsa pirri」，意思是「风走河道，驯鹿走风道」：在雪原上迷了路，就顺着风找到河，再顺着河找到人家。每年秋天驯鹿从高原迁往尼尔萨利特的冬季牧场，要横穿环北维京岛高速，交警会封路几个小时，司机们纷纷下车拍照，有人专门从天城开车赶来看。冬夜漫长，极光常常挂在河谷上空，基卢克维克的居民习惯在窗台上点一盏蜡烛，给走夜路的人照亮。驯鹿肉干、烟熏河鳟和云莓果酱是这里待客的常备，夏天阿基尼克的博物馆门口总有老人摆摊卖手缝的驯鹿皮手套。"
    en: "A city of river valley and plain in the north-east of the island. The Jaalikiluk River rises on the eastern slopes of the Lorond Range, runs north and winds across the plain to the sea. Jaalikiluk River was once the seat of the old Maslin Mountain City; after the territory was founded that city was divided, its seat moved to Peace, and Jaalikiluk River became a city of its own. At more than thirty thousand square kilometres it is the largest city on the island, yet it has only about twenty thousand people, the fewest and the most thinly spread of any city, and much of its land is still wilderness, forest and upland pasture. Farming and herding are the economy. The alluvial plain along the river grows cereals and fodder, the Nirsaliit on the eastern upland is the herds' winter pasture, and herders move with the seasons. The old government buildings and museum of Aaqqiniq tell the story of the land, and heritage and nature tourism are slowly growing. Kilukvik is the civic centre and the main town, and Upper Jaalikiluk is unincorporated wilderness on the upper river where the territory provides public services directly. The ring expressway and the Jaalikiluk River Highway cross the city, the first linking Skytown and Lekor and the second running south-west to New City, and the Northwest–Maslin Mountain Railway stops at Jaalikiluk Station. Most residents speak Viking at home, many families have farmed and herded for generations, and the share of older people is high. Vast and almost empty, with white nights in summer and the aurora in winter, Jaalikiluk River is one of the wildest places on North Viking Island.\nJaalikiluk is the largest city on the island by area and the smallest by population, and locals joke that here \"there are more reindeer than neighbours, and more neighbours than traffic lights\". The name means \"wind river\" in Tavrunaq, and herders share an old saying: \"Jaali kiluk, nirsa pirri\", the wind follows the river and the reindeer follow the wind. Lost on the snowfields, you follow the wind to the river and the river to a house. Each autumn the reindeer move from the uplands to their winter pasture at Nirsalit, crossing the North Viking Island Ring Expressway on the way; the police close the road for a few hours, drivers get out to take pictures, and some drive up from Skytown just to watch. Winter nights are long and the aurora often hangs over the valley, and people in Kilukvik keep a candle burning on the windowsill to light the way for anyone walking at night. Dried reindeer meat, smoked river trout and cloudberry jam are what guests are offered, and in summer elderly people sell hand-sewn reindeer-skin mittens outside the museum in Aaqqiniq."
- id: div_qpyn9e
