  traits: { industries: [research, forestry, tourism], age: old }
  notes:
    zh: 西北市北部山岭间的区，以寒岭和寒岭峡湾为界，是低密度的科研居住与生态缓冲带。寒岭生态研究站是区里最重要的机构，长期监测森林、冰川、峡湾水体和野生动物，为领地的环境保护和气候研究提供数据，许多大学的野外实习也在这里进行。区内大部分土地是原始森林和高山草甸，林业在严格的配额下进行，主要供应建材和造纸原料；生态旅游近年兴起，峡湾游船、徒步路线、冰川观光和冬季越野滑雪吸引了不少游客。居民分散在峡湾沿岸的小镇和山谷村落，许多是研究站的职工和退休的科研人员，老年人比例较高。西岸公路的终点就在区内，从这里南下可到鹿鸣区和维京港。寒岭峡湾两岸是陡峭的山崖和瀑布，峡湾深处水面平静，是北维京岛最美的峡湾之一。区里的生活节奏缓慢，冬季漫长，极光常见，许多居民以手工艺和民宿为副业。寒岭被视为西北市的生态屏障，新的开发受到严格控制。
    en: A district in the hills of northern Northwest City, framed by Frost Ridge and Frost Fjord, serving as a low-density belt of research, homes and protected nature. The Frost Ridge Ecological Station is its most important institution, with long-running monitoring of forests, glaciers, fjord waters and wildlife that feeds the territory's environmental protection and climate research; many universities send students here for fieldwork. Most of the land is old-growth forest and alpine meadow. Forestry runs on strict quotas, mainly for building timber and pulp, and ecotourism has grown, with fjord cruises, hiking routes, glacier trips and cross-country skiing in winter drawing a steady stream of visitors. People live in small towns along the fjord and in valley villages; many work at the station or are retired scientists, so the share of older residents is high. The West Coast Highway ends in the district, and from here it runs south to Deersong and Viking Port. Frost Fjord is walled by steep cliffs and waterfalls, its inner reaches mirror-calm, one of the most beautiful fjords on North Viking Island. Life moves slowly, winters are long and the aurora is common, and many residents run crafts or guesthouses on the side. Frost Ridge is treated as Northwest City's ecological buffer, and new development is tightly controlled.
