  notes:
    zh: 北维京岛中部的平原城市，领地建立之初从原勒克尔市析出，由奥克镇和西诺镇合并设市，市名由两镇名合成。全市地势平坦、土壤深厚，是本岛机械化程度最高的粮食和饲料产区，大型农场种植小麦、大麦、油菜和土豆，农产品加工、食品制造和农机维修构成地方工业；牛角湾沿岸的林地和木材加工厂提供了另一部分就业。奥克区是市政与商贸中心，奥克农产品集散中心把全市的粮食、蔬菜和肉类运往维京港和新城，奥克西诺农机博物馆展示了平原农业的发展历程；西诺区承接了来自勒克尔和新城方向的通勤人口，新住宅区和奥克西诺农业学院让这里更加年轻。牛角湾海滨公园是全市居民夏季消暑的去处。环北维京岛高速、西奥高速、杉岭公路和北河公路在市内交会，维贝铁路在奥克西诺站停靠，使这里成为本岛中部的交通枢纽和物流节点。居民来源多元，中文、维京语和巴克汉姆语家庭都很多，城镇规划整齐，生活成本较低，吸引了不少年轻家庭。
    en: "A city of the plains in the middle of North Viking Island. It was carved out of the old Lekor City when the territory was founded by merging the towns of Ox and Ino, and its name joins the two. The land is flat and the soil deep, making it the most mechanised grain and fodder region on the island: large farms grow wheat, barley, rapeseed and potatoes, and food processing, food manufacturing and farm-machinery repair form the local industry, while woodland and sawmills along Oxhorn Bay provide more jobs. Ox is the civic and trading centre; the Ox Produce Distribution Centre sends the city's grain, vegetables and meat to Viking Port and New City, and the Oxino Farm Machinery Museum tells the story of farming on the plain. Ino takes commuters from the direction of Lekor and New City, and its new housing estates and the Oxino Agricultural College keep it young. Oxhorn Bay Seaside Park is where the whole city goes to cool off in summer. The ring expressway, the Northwest–Oxino Expressway, the Fir Ridge Highway and the North River Highway meet in the city, and the Viking Port–Beckerle Railway stops at Oxino Station, making it a transport hub and logistics node for the middle of the island. Residents come from many backgrounds, with plenty of Chinese-, Viking- and Buckham-speaking households, the towns are neatly planned, and the low cost of living attracts many young families."
