    pattern: contours
  traits: { industries: [forestry, ski, mining], heritage: viking, age: old }
  notes:
    zh: 北维京岛中部的山地城市，全市被洛龙山脉的群峰、冰川和峡谷覆盖，领地建立之初从原勒克尔市析出设市。全市面积广阔，人口只有四十多万，主要集中在龙关、深峡等山谷集镇里。地形复杂使这里成为本岛的天然屏障和交通咽喉：龙关集镇是山区的公路枢纽，龙关高速、深峡高速和杉岭公路都在这里交会，西马铁路和新洛铁路在洛龙山站汇合。林业是传统支柱，杉岭的云杉林和冷杉林在严格的采伐配额下经营，木材加工厂和护林站遍布山间；冬季运动是新的增长点，龙关附近的滑雪场和山间木屋吸引着全岛的滑雪者；山中的石料和矿产开采规模不大，但仍为本地提供就业。洛龙峰是洛龙山脉的主峰，上千平方公里的洛龙冰川、杉岭冰川和深峡湖等景观让这里成为登山和徒步的胜地，深峡瀑布公园更是全岛最壮观的瀑布群。居民以维京语为主要母语，许多家庭世代居住在山谷里，老年人比例较高。洛龙山的生活节奏缓慢，冬季漫长，是北维京岛最原始、最壮美的地区。
    en: "A mountain city in the middle of North Viking Island, covered by the peaks, glaciers and gorges of the Lorond Range; it was carved out of the old Lekor City when the territory was founded. The city is vast but has only some four hundred and fifty thousand people, mostly in valley towns such as Dragon Pass and Deep Gorge. Its rough country makes it the island's natural barrier and its transport bottleneck: the town of Dragon Pass is the hub of the mountain roads, where the Long Pass and Deep Gorge expressways and the Fir Ridge Highway meet, and two railways come together at Lorond Mountain Station. Forestry is the traditional mainstay; the spruce and fir forests of Fir Ridge are worked under strict felling quotas, and sawmills and ranger stations are scattered through the hills. Winter sports are the new growth: ski areas and mountain cabins near Dragon Pass draw skiers from across the island, and small quarries and mines still give local jobs. Lorond Peak crowns the range, and the Lorond Glacier, more than a thousand square kilometres of ice, the Fir Ridge Glacier and Gorge Lake make the city a favourite for climbing and hiking, while Deep Gorge Falls Park has the most spectacular waterfalls on the island. Most residents speak Viking at home, many families have lived in the valleys for generations, and the share of older people is high. Life is slow and winters are long in the wildest and grandest corner of North Viking Island."
