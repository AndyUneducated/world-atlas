  status: canon
  names:
    zh: 西加维克区
    en: Siggavik District
    art-x-viking: Siggavik
    art-x-buckham: Siggavik
  codes:
    admin: '900502'
  population: 179000
  area_km2: 2320.0
  traits: { industries: [residential, commerce, agriculture], age: young }
  notes:
    zh: 原西加维克镇，与普库图克镇合并设市，如今是塔夫鲁普库维克市的居住拓展区。随着北河公路和环岛高速的修通，从勒克尔、新城和自由市方向迁来的通勤家庭在这里落户，成片的新住宅区围绕老镇展开，年轻家庭和儿童比例在全市最高，学校、幼儿园和社区中心不断增加。两镇广场位于老镇与新区之间，广场上的纪念碑记载着普库图克和西加维克两镇合并的经过，是市民集会和节日庆典的场所，每周的农夫市集售卖附近农场的新鲜产品。塔夫鲁普库维克农业学院是全岛农业教育的中心，开设农学、畜牧、农机和食品工程专业，学生在周边的示范农场实习，也为本地农户提供技术推广服务。区内仍保留着不少农田和牧场，商业以社区超市、餐馆和建材市场为主。北河公路从区内穿过，向东通往科恩达尔和勒克尔维克，向西经白桦区通往自由市，许多居民沿这条路通勤。居民来源多元，说中文、维京语和巴克汉姆语的家庭大致相当，社区活动丰富。西加维克区以宜居和实惠著称，是塔夫鲁普库维克发展最快的地方。
    en: The former town of Siggavik, which merged with Pukkutuuq to form the city and is now Tavrupukkuvik's area of new housing. Once the North River Highway and the ring expressway opened, commuting families from the direction of Lekor, New City and Freedom City settled here, and new estates spread around the old town. Young families and children make up a larger share than anywhere else in the city, and schools, nurseries and community centres keep multiplying. Twin Towns Square lies between the old town and the new estates; its monument records how Pukkutuuq and Siggavik came together, it hosts gatherings and festivals, and a weekly farmers' market sells fresh produce from the surrounding farms. The Tavrupukkuvik Agricultural College is the island's centre of farm education, teaching agronomy, animal husbandry, farm machinery and food engineering; students train on nearby demonstration farms and the college runs advisory services for local farmers. Plenty of fields and pasture remain, and shops are mostly neighbourhood supermarkets, restaurants and builders' merchants. The North River Highway crosses the district, east to Korndal and Lekorvik and west through Birchwood to Freedom City, and many residents commute along it. Chinese-, Viking- and Buckham-speaking households are roughly balanced and community life is busy. Siggavik is known for being pleasant and affordable, and it is the fastest-growing part of Tavrupukkuvik.
