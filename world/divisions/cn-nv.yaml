  notes:
    zh: 勒克尔市拆分后保留的北部农牧核心，也是全市的行政中心。勒克尔市人民政府坐落在区中心的老镇上，周围是石砌的旧市政厅、教堂和集市广场；勒克尔农产品交易中心是全岛粮食、奶制品和肉类的定价与批发市场，每天清晨卡车从各地运来货物，再分送到维京港、自由市和维京群岛。勒克尔农业博物馆展示了从维京时代的木犁到现代联合收割机的农具演变，是学生和游客了解本岛农业历史的地方。区内大部分土地是麦田和牧场，奶牛场和乳品厂分布在村镇之间，乳业合作社生产的黄油和奶酪远销群岛。北岸的勒北角附近有一座小港，冬季不冻，出口粮食和奶制品，也停靠渔船。北河公路的终点就在区内，向西经丰谷、西诺通往自由市，勒克尔站则是自勒城际铁路的终点站。居民多以维京语为母语，许多家庭经营农场已有好几代，年轻人有不少到维京港或自由市工作，周末再回乡帮忙。勒北的田园风光和农家集市吸引着城里人前来度周末。
    en: The farming and grazing heartland of the north that Lekor City kept after it was divided, and the city's administrative centre. The city government sits in the old town at the heart of the district, among the stone-built old town hall, the church and the market square. The Lekor Produce Exchange sets the price and handles the wholesale trade for the island's grain, dairy and meat; lorries arrive from all over at dawn and the goods go on to Viking Port, Freedom City and the Viking Islands. The Lekor Farming Museum traces farm tools from the wooden ploughs of Viking times to the modern combine harvester and is where pupils and visitors learn the island's farming history. Most of the land is wheat and pasture, with dairy farms and creameries between the villages, and the butter and cheese of the dairy co-operatives sell as far as the islands. Near Lekor North Cape on the north shore a small ice-free harbour ships grain and dairy and shelters fishing boats. The North River Highway ends in the district and runs west through Harvest Vale and Ino to Freedom City, and Lekor Station is the terminus of the intercity railway from the capital. Most residents speak Viking at home, many families have run their farms for generations, and plenty of young people work in Viking Port or Freedom City and come home at weekends to help. Its farmland scenery and farmers' markets bring city people out for the weekend.
