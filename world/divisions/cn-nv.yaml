  area_km2: 11367.6
  traits: { industries: [forestry] }
  notes:
    zh: 洛龙山市面积最大、人口最稀少的区，覆盖杉岭、杉顶和杉岭冰川一带的高山森林，每平方公里只有约十人。区内大部分土地是云杉和冷杉组成的原始针叶林，林业是唯一的支柱产业：林场按照严格的轮伐制度采伐，伐后及时补种，木材经杉岭公路运往奥克西诺和维京港加工。杉岭林业研究所是全岛森林研究的中心，研究树种培育、病虫害防治和森林防火，所里的科研人员和护林员是区里最主要的常住人口。杉岭森林公园保护着最古老的一片原始林，园内有高大的冷杉、苔藓覆盖的岩石和清澈的溪流，徒步道通往杉岭垭口和杉岭冰川的冰舌。冬季大雪封山，部分林区只有季节性驻地，伐木工和护林员夏季上山、冬季下山。杉岭公路从区内穿过，西接奥克区，东通龙关，是沿途村落与外界联系的唯一道路。居民以维京语为母语，生活简朴，护林防火是全区最重要的公共事务。杉岭的森林为本岛涵养水源、调节气候，被视为北维京岛的绿色心脏。
    en: "The largest and most thinly peopled district of Lorond Mountain City, covering the high forests of Fir Ridge, Fir Top and the Fir Ridge Glacier, with only about ten people per square kilometre. Most of the land is old-growth conifer forest of spruce and fir, and forestry is the one mainstay: plantations are felled on a strict rotation and replanted at once, and the timber goes down the Fir Ridge Highway to be processed in Oxino and Viking Port. The Fir Ridge Forestry Institute is the island's centre of forest research, working on tree breeding, pest control and fire prevention, and its scientists and rangers are most of the district's year-round population. Fir Ridge Forest Park protects the oldest stand of virgin forest, with towering firs, moss-covered boulders and clear streams, and trails climb to Fir Ridge Col and the snout of the Fir Ridge Glacier. Heavy snow closes the high ground in winter, and parts of the forest have only seasonal camps: loggers and rangers go up in summer and come down in winter. The Fir Ridge Highway crosses the district, west to Ox and east to Dragon Pass, the only road linking its villages with the outside world. Residents speak Viking at home and live simply, and guarding the forest against fire is the district's most important public duty. Fir Ridge's forests hold the island's water and temper its climate, and they are thought of as the green heart of North Viking Island."
