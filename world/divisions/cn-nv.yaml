  notes:
    zh: 勒克尔市南部的河谷，土壤肥沃、日照充足，是北维京岛唯一成规模的葡萄酒产区。科恩达尔酒庄和数十家家庭酒庄沿着向阳的坡地种植耐寒的葡萄品种，酿造白葡萄酒、冰酒和苹果酒，酒窖参观和品酒是游客最喜欢的活动。谷地里还有大片果园、蔬菜田和蜂场，农家民宿和乡村餐馆以本地食材为特色，周末常有维京港和自由市的家庭驾车前来。科恩达尔丰收广场是勒克尔丰收节的主会场，每年秋收时节，广场上举行农产品评比、民族舞蹈、拖拉机巡游和篝火晚会，吸引全岛乃至群岛的游客。区里的居民以维京语为主要母语，许多家庭兼营农场和民宿，旅游旺季时人手紧张，冬季则回归宁静的农耕生活，老人和返乡退休者较多。北河公路穿过谷地，向西通往西加维克区和自由市，向北通往勒克尔维克区。谷地两侧是低缓的丘陵和桦树林，秋天层林尽染，是摄影爱好者的去处。科恩达尔将农业、酿酒和旅游结合在一起，是北维京岛乡村振兴的样板。
    en: "A fertile, sunny valley in the south of Lekor City and the only wine region of any size on North Viking Island. Korndal Winery and dozens of family estates grow hardy vines on the south-facing slopes, making white wine, ice wine and cider, and cellar tours and tastings are visitors' favourite pastime. The valley also has wide orchards, vegetable fields and apiaries, and farm guesthouses and country restaurants cook with local produce; families from Viking Port and Freedom City drive out at weekends. Korndal Festival Square is the main venue of the Lekor harvest festival: each autumn it fills with produce shows, folk dancing, tractor parades and bonfires that draw visitors from all over the island and from the Viking Islands. Most residents speak Viking at home, many families run a farm and a guesthouse together, short of hands in the busy season and back to quiet farming in winter, and there are many older people and returning retirees. The North River Highway runs through the valley, west to Siggavik and Freedom City and north to Lekorvik. Low hills and birch woods line both sides and blaze with colour in autumn, a draw for photographers. By bringing farming, wine-making and tourism together, Korndal has become the island's model for reviving the countryside."
