  notes:
    zh: 原奥克镇，与西诺镇合并设立奥克西诺市后成为市政与商贸中心。区内是一望无际的平原农田，大型家庭农场和农业合作社使用联合收割机和精准灌溉系统种植小麦、大麦和土豆，秋收时节田野里机声隆隆。奥克农产品集散中心是本岛中部最大的批发市场，粮库、冷库和分拣中心沿铁路和公路排开，每天把粮食、蔬菜和肉类运往维京港、新城和萨科勒；周边还有面粉厂、饲料厂、肉类和乳品加工厂，食品工业是区里最大的雇主。奥克西诺市人民政府和奥克西诺农机博物馆都在老镇中心，博物馆收藏了上百台各个时期的拖拉机和收割机。区的东部濒临牛角湾，牛角湾海滨公园有沙滩、草坪和野餐区，牛角岬上的灯塔是附近渔船的航标。杉岭公路从这里出发，向东经杉岭、龙关通往澄湖，是平原通往洛龙山区的主要道路。居民以农民、食品工人和物流从业者为主，中文、维京语和巴克汉姆语家庭混居，老镇里保留着两镇合并前的教堂和集市。奥克区踏实勤劳的农业传统是全市的根基。
    en: "The former town of Ox, which became the civic and trading centre of Oxino City when it merged with Ino. The district is open plain to the horizon. Large family farms and co-operatives grow wheat, barley and potatoes with combine harvesters and precision irrigation, and at harvest the fields hum with machines. The Ox Produce Distribution Centre is the largest wholesale market in the middle of the island: granaries, cold stores and sorting halls line the railway and the roads, and every day grain, vegetables and meat leave for Viking Port, New City and Sakole. Flour mills, feed mills and meat and dairy plants surround it, and the food industry is the district's biggest employer. The city government and the Oxino Farm Machinery Museum stand in the old town centre; the museum keeps more than a hundred tractors and harvesters from every period. To the east the district meets Oxhorn Bay, where Oxhorn Bay Seaside Park has beaches, lawns and picnic grounds and the lighthouse on Oxhorn Point guides the local fishing boats. The Fir Ridge Highway starts here and runs east through Fir Ridge and Dragon Pass to Clearlake, the main road from the plains into the Lorond mountains. Residents are mostly farmers, food workers and logistics staff, Chinese-, Viking- and Buckham-speaking households live side by side, and the old town keeps the church and market of the days before the merger. Ox's down-to-earth farming tradition is the foundation of the whole city."
