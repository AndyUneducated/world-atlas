  names:
    zh: 纳帕图克区
    en: Napatuuq District
    art-x-viking: Napatuuq
    art-x-buckham: Napatuuq
  codes:
    admin: '900602'
  population: 82000
  area_km2: 11367.6
  traits: { industries: [forestry] }
  notes:
    zh: 洛龙山市面积最大、人口最稀少的区，覆盖纳帕图克、杉顶和纳帕图克冰川一带的高山森林，每平方公里只有约七人。区内大部分土地是云杉和冷杉组成的原始针叶林，林业是唯一的支柱产业：林场按照严格的轮伐制度采伐，伐后及时补种，木材经纳帕图克公路运往塔夫鲁普库维克和维京港加工。纳帕图克林业研究所是全岛森林研究的中心，研究树种培育、病虫害防治和森林防火，所里的科研人员和护林员是区里最主要的常住人口。纳帕图克森林公园保护着最古老的一片原始林，园内有高大的冷杉、苔藓覆盖的岩石和清澈的溪流，徒步道通往纳帕图克垭口和纳帕图克冰川的冰舌。冬季大雪封山，部分林区只有季节性驻地，伐木工和护林员夏季上山、冬季下山。纳帕图克公路从区内穿过，西接普库图克区，东通卡蒂尔尤阿克，是沿途村落与外界联系的唯一道路。居民以维京语为母语，生活简朴，护林防火是全区最重要的公共事务。纳帕图克的森林为本岛涵养水源、调节气候，被视为北维京岛的绿色心脏。
    en: "The largest and most thinly peopled district of Lorond Mountain City, covering the high forests of Napatuuq, Fir Top and the Napatuuq Glacier, with only about seven people per square kilometre. Most of the land is old-growth conifer forest of spruce and fir, and forestry is the one mainstay: plantations are felled on a strict rotation and replanted at once, and the timber goes down the Napatuuq Highway to be processed in Tavrupukkuvik and Viking Port. The Napatuuq Forestry Institute is the island's centre of forest research, working on tree breeding, pest control and fire prevention, and its scientists and rangers are most of the district's year-round population. Napatuuq Forest Park protects the oldest stand of virgin forest, with towering firs, moss-covered boulders and clear streams, and trails climb to Napatuuq Col and the snout of the Napatuuq Glacier. Heavy snow closes the high ground in winter, and parts of the forest have only seasonal camps: loggers and rangers go up in summer and come down in winter. The Napatuuq Highway crosses the district, west to Pukkutuuq and east to Katirjuaq, the only road linking its villages with the outside world. Residents speak Viking at home and live simply, and guarding the forest against fire is the district's most important public duty. Napatuuq's forests hold the island's water and temper its climate, and they are thought of as the green heart of North Viking Island."
- id: div_0t2t36
  subtype: borough
  parent: div_prcxzt
  status: canon
  names:
    zh: 伊卡苏瓦区
    en: Ikkasuvva District
    art-x-viking: Ikkasuvva
    art-x-buckham: Ikkasuvva
  codes:
    admin: '900603'
  population: 103000
  area_km2: 9590.4
  traits: { industries: [tourism, forestry] }
  notes:
    zh: 洛龙山南部的高山峡谷区，伊卡苏瓦在群峰之间切出数十公里长的谷地，谷底散布着古老的山村和梯田，以壮丽的峡谷风光和瀑布闻名。伊卡苏瓦瀑布公园是全岛最著名的自然景区，峡谷两壁的冰川融水汇成多级瀑布，最高一级落差上百米，夏季水量最大时轰鸣声在谷中回荡；谷底的伊卡苏瓦湖是一座冰川堰塞湖，湖水呈碧绿色，四周是陡峭的岩壁。景区内修建了栈道、吊桥和观景台，观光步道沿峡谷延伸，是徒步者和摄影爱好者的天堂，旅游业是区里最主要的收入来源。山坡上的森林由村民和林场共同经营，木材和木工艺品是传统的副业。伊卡苏瓦高速从区内穿过，北接卡蒂尔尤阿克，南经北苑、青坪通往新城，高速在峡谷中以一连串桥梁和隧道穿行，本身也是一道风景。居民以维京语为母语，许多村落只有几十户人家，年轻人多外出工作，老人留守，夏季游客到来时村里才热闹起来。伊卡苏瓦的山村保留着传统的木屋和石墙，冬季大雪覆盖时宛如童话世界。
    en: "The high gorge country of southern Lorond Mountain. The Ikkasuvva cuts a valley tens of kilometres long between the peaks, and its floor is dotted with old mountain villages and terraced fields; the district is famous for its gorge scenery and waterfalls. Ikkasuvva Falls Park is the best-known natural attraction on the island: meltwater from the glaciers above pours down the gorge walls in a staircase of falls, the highest dropping more than a hundred metres, and when the flow peaks in summer the roar echoes down the valley. Lake Ikkasuvva on the valley floor is a glacial lake dammed by debris, emerald green and walled by sheer cliffs. Boardwalks, suspension bridges and viewpoints run through the park and trails follow the gorge, a paradise for hikers and photographers, and tourism is the district's main income. Villagers and forestry companies share the forests on the slopes, and timber and woodcraft are traditional sidelines. The Ikkasuvva Expressway runs through the district, north to Katirjuaq and south through North Gardens and Greenmead to New City, threading the gorge on a chain of bridges and tunnels that is a sight in itself. Residents speak Viking at home; many villages have only a few dozen households, young people mostly work elsewhere and the old stay behind, and the villages only come alive when summer visitors arrive. With their traditional timber houses and stone walls, the gorge villages look like something from a fairy tale under winter snow."
