    unlocode: NV SKY
  population: 780000
  area_km2: 7600.0
  color: '#F29E4C'
  emblem:
    motif: sun
    pattern: halo
  traits: { industries: [tourism, conference, residential], heritage: chinese, age: old }
  notes:
    zh: 北维京岛东南海岸的度假城市，领地建立之初从原马斯林山市析出设市，以天台山、天河湾和绵长的沙滩闻名。全市的经济围绕旅游和会议展开：天台区是主要的度假酒店群和会议中心所在地，天台国际会议中心常年举办领地和国际会议；银滩区拥有全岛最好的海滩、银滩主题乐园和成排的海滨酒店；岚山区则是山间的高端住宅、疗养院和高尔夫球场。天城机场和天城港把游客从维京港、维京群岛和远方带到这里，夏季航班和客轮络绎不绝，冬季则以温泉疗养、雪景和会议淡季促销吸引客人。由于气候温和、风景秀丽，许多退休人员从全岛各地移居天城，老年人比例在全岛名列前茅，医疗和养老服务因此发达。环北维京岛高速、马斯林山高速和东岸公路在市内交会，雪谷公路从天台出发通往马斯林山，贝马铁路在天城站停靠。居民大多以中文为母语，城市以干净、安静和服务周到著称，是北维京岛最受欢迎的度假地，也是很多人心中理想的养老之地。
    en: A resort city on the south-east coast of North Viking Island, carved out of the old Maslin Mountain City when the territory was founded and known for Sky Terrace Mountain, Sky River Bay and its long beaches. The economy revolves around tourism and conferences. Sky Terrace holds the main cluster of resort hotels and the Sky Terrace International Convention Centre, which hosts territorial and international meetings all year. Silver Beach has the best beaches on the island, the Silver Beach Theme Park and rows of seafront hotels, and Mist Hill is upmarket homes, sanatoriums and a golf course in the hills. Skytown Airport and Skytown Harbour bring visitors from Viking Port, the Viking Islands and further afield; flights and passenger ships are busy all summer, and in winter the city draws guests with spa cures, snow scenery and off-season conference offers. The mild climate and fine scenery have drawn retirees from all over the island, so the share of older people is among the highest anywhere, and healthcare and care services are well developed. The ring expressway, the Maslin Expressway and the East Coast Highway meet in the city, the Snow Valley Highway starts at Sky Terrace and climbs to Maslin Mountain, and the Beckerle–Maslin Mountain Railway stops at Skytown Station. Most residents speak Chinese at home. Known for being clean, quiet and welcoming, Skytown is the island's favourite holiday destination and, for many, the ideal place to retire.
- id: div_w1ea18
  subtype: borough
  parent: div_ygk521
  status: canon
  names:
    zh: 天台区
    en: Sky Terrace District
    art-x-viking: Himmelterrasse
    art-x-buckham: Terrazza Cielo
  codes:
    admin: '900801'
  population: 320000
  area_km2: 2560.0
  traits: { industries: [tourism, conference] }
  notes:
    zh: 天城市的主度假区和会议中心，也是全市的行政中心，坐落在天台山脚下、天河湾畔。度假酒店、公寓式酒店和度假村沿着海湾和山坡层层排开，酒店前是游艇码头和海滨长廊，背后是天台山的森林和步道，登山缆车可以把游客送上山顶观赏日出和天台峡湾。天台国际会议中心是全领地规格最高的会议场馆，拥有大型会议厅、展厅和同声传译设施，领地的大型会议、学术会议和国际论坛常在这里举行，会议和商务旅游是区里与度假并重的支柱。天城机场位于区的北部，天城港则停靠来自维京港和维京群岛的客轮和邮轮，天城市人民政府也设在区内。东岸公路和雪谷公路都从这里出发，前者一头经银滩、岚山通往马斯林山的东营，另一头通往萨科勒的铁岗，后者向西深入马斯林山。居民大多在酒店、餐饮、会议和公共服务部门工作，以中文为母语的家庭占多数，退休移居者也不少。天台区四季都有游客，夏季看海、秋季赏枫、冬季泡温泉看雪，是北维京岛最繁忙的度假区。
    en: "Skytown's main resort and conference district and the seat of the city government, at the foot of Sky Terrace Mountain on Sky River Bay. Resort hotels, apartment hotels and holiday villages climb the bay and the slopes in tiers, with a marina and seafront promenade in front and the forests and trails of Sky Terrace Mountain behind; a cable car takes visitors to the summit to watch the sunrise and look down on the Sky Terrace Fjord. The Sky Terrace International Convention Centre is the territory's most prestigious meeting venue, with large halls, exhibition space and simultaneous interpretation; the territory's major meetings, academic conferences and international forums are often held here, and business and conference travel is as important to the district as holidays. Skytown Airport lies in the north of the district, and Skytown Harbour takes ferries and cruise ships from Viking Port and the Viking Islands. The East Coast Highway and the Snow Valley Highway both start here: the first runs one way through Silver Beach and Mist Hill to East Camp in Maslin Mountain and the other way to Iron Knoll in Sakole, the second climbs west into the Maslin mountains. Most residents work in hotels, restaurants, conferences and public services; Chinese-speaking households are the majority, and many retirees have moved in. Sky Terrace has visitors all year round, for the sea in summer, the autumn colours and hot springs and snow in winter, and it is the busiest resort district on the island."
