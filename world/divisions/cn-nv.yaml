  notes:
    zh: 沿维京港西岸向北扩展形成的商务居住带，因位于入港航道的「海门」而得名。区的南端是维京港的中央商务区，海门国际金融中心是维京港最高的写字楼，周围聚集了银行、保险、航运金融和律师事务所，领地大部分企业总部也设在这里；北段是软件、数据服务和设计公司聚集的科技园，吸引了大量从大学毕业的年轻专业人士。高收入岗位使海门成为维京港人均产出最高的区，滨海一线是全市最贵的公寓和餐厅。区里居民来源多元，说中文、维京语和巴克汉姆语的家庭大致相当，国际学校和多语种社区中心随处可见。海门角伸入海中，角上的灯塔与观景平台可以眺望进出菲尔内斯湾的船只，海岸修有自行车道和沙滩。西岸公路纵贯全区，南接瓦尔维克，北经菲尔内斯通往西北市。区内建筑以玻璃幕墙写字楼和高层公寓为主，与斯坦堡的石屋形成鲜明对比。海门代表着维京港的现代一面，是领地商业最活跃的地方。
    en: "A belt of offices and homes that spread north along Viking Port's west shore, named for the \"sea gate\" of the harbour channel it overlooks. The southern end is Viking Port's central business district. The Seagate International Finance Centre, the tallest office tower in Viking Port, is surrounded by banks, insurers, shipping financiers and law firms, and most of the territory's company headquarters are here too. The northern stretch is a technology park of software, data-services and design firms that draws many young graduates. Well-paid jobs make Seagate the district with the highest output per head in Viking Port, and the seafront has the city's most expensive flats and restaurants. Residents come from everywhere: Chinese-, Viking- and Buckham-speaking households are roughly balanced, and international schools and multilingual community centres are easy to find. Seagate Cape juts into the sea; its lighthouse and viewing platform look out over ships entering and leaving Fyrnes Bay, and cycle paths and beaches run along the shore. The West Coast Highway runs the length of the district, south to Walvik and north through Fyrnes to Northwest City. Glass office towers and high-rise flats set the skyline, in sharp contrast with the stone houses of Steinburg. Seagate is the modern face of Viking Port and the busiest place for business in the territory."
