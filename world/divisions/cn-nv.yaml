  area_km2: 3360.0
  traits: { industries: [commerce, residential, logistics] }
  notes:
    zh: 建在原来的青草坪地上，区名由此而来，是新城市的商业中心和交通枢纽。区内以高层住宅和大型商业综合体为主，青坪购物中心是本岛南部最大的购物中心，集商场、影院、餐饮和室内游乐场于一体，周末吸引着新城、萨科勒和贝克勒的居民。区内的公交枢纽和长途客运站与北苑区的新城站相接，每天有大量通勤者从这里前往萨科勒和贝克勒上班。新城体育中心拥有体育场、游泳馆和综合训练馆，承办过全领地的运动会，也是社区居民健身的去处。深峡高速和南岸公路在区内交会，前者向北经北苑、深峡通往洛龙山，后者向南经南驿、罗卡通往萨科勒和贝克勒。区的北部析出设立了米特区，两区如今连成一片城市中心。居民以年轻的通勤家庭为主，大多以中文为母语，物流配送和零售服务提供了大量就业。青坪的街道宽阔、绿化良好，高层住宅之间留有大片草坪，延续着地名中的青草意象，是新城市最繁忙的地方。
    en: Built on what were once green meadows, which give it its name, Greenmead is New City's commercial centre and transport hub. High-rise housing and large mixed-use complexes dominate. Greenmead Shopping Centre is the largest in the south of the island, with shops, cinemas, restaurants and an indoor play centre, and at weekends it draws people from New City, Sakole and Beckerle. The district's bus hub and coach station connect with New City Station in neighbouring North Gardens, and every day crowds of commuters leave from here for work in Sakole and Beckerle. The New City Sports Centre, with a stadium, a swimming hall and a multi-sports hall, has hosted the territorial games and is where local residents come to keep fit. The Deep Gorge Expressway and the South Coast Highway meet in the district, the first running north through North Gardens and Deep Gorge to Lorond Mountain, the second south through South Post and Rocca to Sakole and Beckerle. The northern part of the district was split off to form Mitte, and together the two now make up the city centre. Residents are mostly young commuting families who speak Chinese at home, and delivery and retail provide many jobs. Greenmead's streets are broad and green, with wide lawns left between the towers in keeping with its name, and it is the busiest place in New City.
- id: div_s1qwxh
  subtype: borough
  parent: div_k4s990
  status: canon
  names:
    zh: 北苑区
    en: North Gardens District
    art-x-viking: Nordgarten
    art-x-buckham: Giardino Nord
  codes:
    admin: '900702'
  population: 680000
  area_km2: 4320.0
  traits: { industries: [residential, education, commerce] }
  notes:
    zh: 新城市人口最多的区，由成片新建的社区和学校组成，是全市最典型的居住区。区内按照「十五分钟生活圈」规划，每个社区都有幼儿园、小学、社区医院、菜市场和小公园，住宅以中高层公寓为主，楼宇之间绿树成荫。教育是北苑的名片：新城第一中学是全岛升学率最高的中学之一，新城师范学院为全领地培养中小学教师，许多家庭为了孩子上学专门搬到这里，儿童比例在全市名列前茅。区里的商业以社区商业街和超市为主，居民大多在青坪、米特或萨科勒上班，早晚高峰时通勤车流密集。深峡高速纵贯全区，向南通往青坪，向北经深峡通往洛龙山；厄定河公路从这里出发，向东北经上厄定、旧府通往厄定河市，是新城通往东北部的主要道路。居民大多以中文为母语，社区活动丰富，周末的公园和体育场里满是带孩子的家庭。维贝铁路和新洛铁路在区内的新城站交会；区的北部是南冠峰和南冠冰川所在的高山，山脚下的森林和溪谷成为居民徒步和野餐的去处。北苑安静、有序，是新城年轻家庭安居乐业的地方。
    en: "New City's most populous district, made up of new neighbourhoods and schools, and the city's typical residential quarter. It is planned around a fifteen-minute neighbourhood: every community has a nursery, a primary school, a clinic, a food market and a small park, and the mid- and high-rise flats stand among shady trees. Education is what North Gardens is known for. New City No. 1 High School sends more pupils on to university than almost any school on the island, and New City Normal College trains teachers for the whole territory; many families move here for their children's schooling, and the share of children is among the highest in the city. Shops are mostly neighbourhood high streets and supermarkets, and most residents work in Greenmead, Mitte or Sakole, so traffic is heavy at rush hour. The Deep Gorge Expressway runs the length of the district, south to Greenmead and north through Deep Gorge to Lorond Mountain, and the Erding River Highway starts here and runs north-east through Upper Erding and Old Prefecture to Erding River City, New City's main road to the north-east. Most residents speak Chinese at home, community life is busy, and at weekends the parks and sports grounds are full of families with children. The Viking Port–Beckerle and New City–Lorond Mountain railways meet at New City Station in the district. To the north rise Southcrown and the great Southcrown Glacier, and the forests and valleys at their foot are where people go walking and picnicking. Calm and orderly, North Gardens is where New City's young families settle down."
- id: div_hyxnpg
  subtype: borough
  parent: div_k4s990
  status: canon
  names:
    zh: 南驿区
    en: South Post District
    art-x-viking: Südpost
    art-x-buckham: Posta Sud
  codes:
    admin: '900703'
  population: 490000
  area_km2: 3520.0
  traits: { industries: [logistics, residential, manufacturing] }
  notes:
    zh: 新城市南部面向萨科勒方向的区，区名取自旧时的驿站，如今是连接新城与萨科勒、贝克勒的快速路和公交走廊。南岸公路纵贯全区，沿线有密集的公交专用道和通勤班车，每天早晚大批居民经这里往返萨科勒的工厂和贝克勒的写字楼。新城机场位于区的南部，有航班通往维京港、自由市、西北市和维京群岛，也是本岛南部的航空货运站；南驿物流园紧邻机场和公路，仓储、配送和电商分拣中心聚集，物流业是区里最大的雇主。区内还有一批为萨科勒工业园配套的零部件、包装和印刷工厂，轻工业与物流相互依存。住宅区沿走廊两侧分布，房价比青坪和米特低，吸引了大量年轻工人家庭，是全市儿童比例最高的区之一。居民大多以中文为母语，社区里有许多新开的学校、诊所和超市。区的西南部仍保留着一些农田和苗圃，为城市提供蔬菜和花木。南驿以交通便利和就业机会多著称，是新城与南部工业区之间的纽带，也是全市发展最快的地方之一。
    en: The district in the south of New City facing Sakole. Its name recalls an old post station, and today it is the expressway and bus corridor linking New City with Sakole and Beckerle. The South Coast Highway runs its length, with bus lanes and commuter coaches, and every morning and evening crowds of residents travel this way to the factories of Sakole and the offices of Beckerle. New City Airport, in the south of the district, has flights to Viking Port, Freedom City, Northwest City and the Viking Islands and is the air-freight station for the south of the island. The South Post Logistics Park next to the airport and the highway gathers warehouses, distribution centres and parcel sorting halls, and logistics is the district's biggest employer. There are also parts, packaging and printing plants serving the Sakole industrial parks, so light industry and logistics depend on each other. Housing lines both sides of the corridor; homes cost less than in Greenmead and Mitte, so many young working families live here, and it has one of the highest shares of children in the city. Most residents speak Chinese at home, and the neighbourhoods are full of new schools, clinics and supermarkets. Farmland and nurseries survive in the south-west, supplying the city with vegetables, flowers and trees. South Post is known for good connections and plentiful jobs, the link between New City and the industrial south, and one of the fastest-growing parts of the city.
