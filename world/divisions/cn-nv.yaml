  population: 240000
  area_km2: 800.0
  traits: { industries: [government, conference, finance], heritage: mixed, age: balanced }
  notes:
    zh: 维京语意为「中心」，从青坪区北部析出设立的新市中心，也是新城市面积最小、密度最高的区。新城市人民政府、市议会和主要公共机构集中在米特中央公园周围，政务中心采用开放式设计，市民可以自由进出办事。新城国际会展中心是本岛南部最大的会展场馆，常年举办工业博览会、教育展、汽车展和国际会议，与周边的酒店、写字楼和餐饮街共同形成了会展商务区；银行、保险和律师事务所也纷纷在此设立分支机构，服务新城和萨科勒的企业。米特中央公园是全市最大的城市公园，园内有人工湖、草坪、音乐厅和儿童乐园，夏季的露天音乐会吸引大量市民。深峡高速从区内出发，向北经青坪、北苑和深峡通往洛龙山。由于商务和公务人员来自各地，米特区说中文、维京语和巴克汉姆语的人都很多，是新城市最多元的区。区内建筑以现代风格的写字楼、公寓和公共建筑为主，街道整洁宽阔，夜景明亮。米特承载着新城从卧城走向独立城市的愿景，是全市的门面。
    en: Mitte means "centre" in Viking. Split off from the north of Greenmead, it is New City's new downtown and the city's smallest and most densely settled district. The city government, the city council and the main public bodies stand around Mitte Central Park, and the civic centre is open in design, so residents can walk in to deal with their affairs. The New City International Exhibition Centre is the largest venue of its kind in the south of the island, holding industrial fairs, education and motor shows and international conferences all year, and with the hotels, offices and restaurant streets around it forms a conference and business quarter. Banks, insurers and law firms have opened branches here to serve companies in New City and Sakole. Mitte Central Park is the largest park in the city, with a lake, lawns, a concert hall and a playground, and its open-air concerts draw big crowds in summer. The Deep Gorge Expressway starts in the district and runs north through Greenmead, North Gardens and Deep Gorge to Lorond Mountain. Because business and government staff come from everywhere, many people here speak Chinese, Viking or Buckham, making Mitte the most varied district in the city. Modern offices, flats and public buildings line clean, broad streets that are brightly lit at night. Mitte carries New City's hope of growing from a commuter town into a city in its own right, and it is the city's showcase.
