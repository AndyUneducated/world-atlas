  traits: { industries: [logistics, manufacturing] }
  notes:
    zh: 巴克汉姆语意为「岩堡」，得名于海边一座形如城堡的岩丘，是萨科勒市的物流与仓储区。罗卡公路货运站是本岛南部最大的公路货运枢纽，萨科勒工厂生产的机械、电子和船舶配件在这里集装分拨，经南岸公路和环岛高速运往维京港、贝克勒保税港和全岛各地；周边的仓储园区、冷链中心和配送中心为新城和萨科勒的商店供货。区内还有不少为铁岗产业园配套的零部件、包装和金属加工厂，物流与制造相互依存，吸引了大量年轻工人和卡车司机。岩堡公园围绕那座海边岩丘而建，岩丘上的观景台可以眺望萨科湾和来往的船只，岩丘脚下的海滩是附近居民夏季游泳的地方。南岸公路纵贯全区，西接南驿和新城，东通萨科和贝克勒，货车和通勤车流昼夜不息。罗卡区面积不大，人口约十四万，以巴克汉姆语和中文为母语的居民混居，年轻家庭多，社区里有新建的学校和体育场。罗卡是萨科勒工业的「后勤基地」，也是全市交通最繁忙的地方。
    en: Rocca means "rock fort" in Buckham, after a castle-shaped knoll of rock by the sea, and it is Sakole's logistics and warehouse district. The Rocca Road Freight Terminal is the largest road freight hub in the south of the island. Machinery, electronics and ship parts from the Sakole factories are consolidated and dispatched here, travelling by the South Coast Highway and the ring expressway to Viking Port, the Beckerle bonded port and the rest of the island, while the surrounding warehouse parks, cold stores and distribution centres stock the shops of New City and Sakole. There are also many parts, packaging and metalworking plants serving the Iron Knoll park, so logistics and manufacturing depend on each other and draw young workers and lorry drivers in large numbers. Rocca Park is built around the seaside knoll; its viewpoint looks out over Sako Bay and the passing ships, and the beach below is where local people swim in summer. The South Coast Highway runs the length of the district, west to South Post and New City and east to Sako and Beckerle, and lorries and commuters stream along it day and night. Rocca is small, with about 140,000 people; Buckham- and Chinese-speaking residents live side by side, young families are many, and the neighbourhoods have new schools and sports grounds. Rocca is the supply base of Sakole's industry and the city's busiest place for traffic.
- id: div_k4hg7b
  subtype: locality
  parent: div_fbfqv9
  status: canon
  names:
    zh: 贝克勒自由贸易区
    en: Beckerle Free Trade Zone
    art-x-viking: Beckerle Frei auf Hea
    art-x-buckham: Beckerle Libre en Teatu
  codes:
    admin: '901000'
    unlocode: NV BKL
  population: 656000
  area_km2: 992.0
  color: '#E5534B'
  flag: { layout: mirror, colors: ['#FFFFFF', '#E5534B'] }
  flag_notes:
    zh: "上白下红，正中一座红色小岛倒映在红色海面上，倒影为白色，红白互换。图案来自斯佩基亚拉湾里的镜岛：无风的日子，整座岛倒映在水面上，斯佩基亚拉区也因巴克汉姆语的「镜子」得名。红白两色代表海陆空联运和自由贸易，倒影里的三道细纹是湾里的波纹。"
    en: "White over red, with a red island in the centre whose reflection in the red sea below is white, the colours counterchanged. The design is Mirror Isle in Specchiara Bay: on still days the whole island lies reflected in the water, and Specchiara takes its name from the Buckham word for mirror. The red and white stand for the zone's trade by land, sea and air, and the three fine lines are ripples on the bay."
  traits: { industries: [trade, finance, port, aviation], heritage: global, age: balanced, income: 1.2 }
  notes:
    zh: "北维京岛南端的自由贸易试验区，领地建立之初从原马斯林山市析出设立，实行全领地最自由的经济政策：货物进出免征关税，资本自由流动，企业注册和外籍人员居留手续极其简便，税率很低。贝克勒面积不到一千平方公里，却聚集了六十多万人口，是全岛第二大城市，也是人口最密集、人均产出最高的地方。区内分为四个功能区：卡波区以卡波国际机场为核心，承担海陆空联运和旅客通道；斯佩基亚拉区是离岸金融、贸易结算和企业总部聚集地，斯佩基亚拉国际金融中心和贝克勒国际商品交易所是全领地的金融高地；隆迪纳亚区以保税仓储和加工贸易为主；保税港区则是斯佩基亚拉湾外填海建成的集装箱码头和转口加工区。自由的政策吸引了来自世界各地的企业和人才，区内中文、维京语、巴克汉姆语和英语并用，英语使用比例全领地最高，国际学校、外资银行和各国餐厅随处可见。环北维京岛高速和南岸公路在这里交会，维贝铁路以贝克勒站为终点，贝马铁路从这里出发通往天城和马斯林山。贝克勒是北维京岛连接世界的窗口，也是领地经济最活跃的地方。\n贝克勒人自嘲「贝克勒的一分钟只有五十秒」。自由贸易区和岛内其他地方之间隔着一道海关线，线上的地面嵌着一排金色铜钉，第一次来的人常在铜钉两边各拍一张照片。周末，岛上其他城市的家庭开车或坐火车来卡波区的免税商场买咖啡、巧克力和电器，回程的维贝铁路列车上堆满了购物袋，这趟车因此得了个「购物专列」的外号。斯佩基亚拉区的餐馆来自世界各地，出租车司机大多能用中文、维京语、巴克汉姆语和英语四种语言聊天；深夜加班的金融从业者最爱去保税港区码头边的夜宵摊，吃炸鱼、喝热汤、看集装箱船在灯光下进出。区里寸土寸金，楼顶花园和屋顶农场很普遍，有几座写字楼的天台上还养着蜜蜂，产的「金融蜜」在交易所门口的集市上总是一抢而空。"
    en: "A free trade zone at the southern tip of North Viking Island, carved out of the old Maslin Mountain City when the territory was founded and given the freest economic rules in the territory. Goods come and go free of duty, capital moves freely, registering a company or a foreign resident is remarkably simple, and taxes are low. Beckerle covers less than a thousand square kilometres yet holds more than 650,000 people, making it the island's second city and the most densely settled place on the island and the one with the highest output per head. It has four districts. Capo is built around Capo International Airport and handles sea–land–air transfers and passengers. Specchiara gathers offshore finance, trade settlement and head offices, and the Specchiara International Finance Centre and the Beckerle International Commodity Exchange are the territory's financial high ground. Rondinaia specialises in bonded warehousing and processing trade, and the Bonded Port Zone is a container terminal and re-export processing area on land reclaimed outside Specchiara Bay. Its free rules draw companies and talent from all over the world; Chinese, Viking, Buckham and English are all in use, English more than anywhere else in the territory, and international schools, foreign banks and restaurants from every country are everywhere. The ring expressway and the South Coast Highway meet here, the Viking Port–Beckerle Railway ends at Beckerle Station, and the Beckerle–Maslin Mountain Railway starts here for Skytown and Maslin Mountain. Beckerle is North Viking Island's window on the world and the most dynamic part of the territory's economy.\nBeckerle people joke that \"a minute in Beckerle has only fifty seconds\". A customs line separates the free trade zone from the rest of the island, marked by a row of brass studs set in the pavement, and first-time visitors like to take a photo on each side. At weekends families from other cities drive or take the train to the duty-free malls of Capo for coffee, chocolate and electrical goods, and the homebound Viking Port–Beckerle trains are piled with shopping bags, which has earned them the nickname \"the shopping specials\". The restaurants of Specchiara come from all over the world, and most taxi drivers can chat in Chinese, Viking, Buckham and English; finance workers on late shifts favour the night stalls on the quays of the Bonded Port Zone, eating fried fish and hot soup while container ships come and go under the floodlights. Land is precious, so roof gardens and rooftop farms are everywhere, and a few office towers keep bees on their roofs; their \"finance honey\" sells out at the market outside the exchange."
  special_status: free_trade_zone
- id: div_e6pc44
  subtype: borough
  parent: div_k4hg7b
  status: canon
  names:
    zh: 卡波区
    en: Capo District
    art-x-viking: Kap
    art-x-buckham: Capo
  codes:
    admin: '901001'
  population: 192000
  area_km2: 304.0
  traits: { industries: [aviation, logistics, trade], heritage: buckham }
  notes:
    zh: 巴克汉姆语意为「海角」，位于卡波角一带，是贝克勒自由贸易区的空港与联运枢纽。卡波国际机场是北维京岛最繁忙的国际航空货运机场，货运航班把电子产品、精密仪器、生鲜食品和快递包裹运往世界各地，机场旁的海关监管区实行「一次申报、一次查验」，货物可以在海运、陆运和空运之间快速转运；客运航站楼则是外国商务旅客进入贝克勒的主要门户。航空物流、货运代理、飞机维修和机场服务是区里最大的产业，许多国际物流公司在此设立区域枢纽。贝克勒国际医院是全领地设备最先进的医院之一，接待来自全岛和海外的病人。南岸公路从区内穿过，西接萨科，东通斯佩基亚拉和保税港区。区里的居民以巴克汉姆语为母语的老住户和来自各地的航空、物流从业者为主，多种语言并用。卡波角上的灯塔和海崖步道可以眺望卡波湾的船只和起降的飞机，是区里最受欢迎的观景点。卡波区节奏快、效率高，是贝克勒连接世界的空中桥梁。
    en: "Capo means \"cape\" in Buckham. Lying around Cape Capo, it is the Beckerle Free Trade Zone's airport and transfer hub. Capo International Airport is the busiest international air-cargo airport on North Viking Island: freighters carry electronics, precision instruments, fresh food and parcels around the world, and in the bonded customs area next to the airport goods are declared and inspected once and can switch quickly between sea, road and air. The passenger terminal is the main gateway for foreign business travellers coming to Beckerle. Air logistics, freight forwarding, aircraft maintenance and airport services are the district's biggest trades, and many international logistics companies run their regional hubs here. Beckerle International Hospital is one of the best-equipped hospitals in the territory and takes patients from across the island and overseas. The South Coast Highway runs through the district, west to Sako and east to Specchiara and the Bonded Port Zone. Residents are a mix of long-settled Buckham-speaking families and aviation and logistics workers from everywhere, and many languages are spoken. The lighthouse and clifftop path on Cape Capo look out over the ships in Capo Bay and the aircraft coming and going, the district's favourite viewpoint. Fast-moving and efficient, Capo is Beckerle's bridge to the world through the air."
- id: div_8p9k5t
  subtype: borough
  parent: div_k4hg7b
  status: canon
  names:
    zh: 斯佩基亚拉区
    en: Specchiara District
    art-x-viking: Specchiara
    art-x-buckham: Specchiara
  codes:
    admin: '901002'
  population: 230000
  area_km2: 306.0
  traits: { industries: [finance, trade, commerce] }
  notes:
    zh: 湾内水面平静如镜，区名由此而来，是贝克勒自由贸易区的金融与行政中心，也是全领地人均产出最高的区。斯佩基亚拉国际金融中心的双塔矗立在湾畔，周围聚集了离岸银行、财富管理公司、保险、再保险和航运金融机构，许多跨国企业的区域总部和结算中心设在这里；贝克勒国际商品交易所进行金属、粮食和能源期货交易，是领地最重要的大宗商品定价中心。贝克勒自由贸易区管理委员会负责区内的政策制定和企业服务，企业注册、外汇结算和签证都可以在一站式服务中心办理。斯佩基亚拉港停靠游艇和高速客轮，斯佩基亚拉滨海公园沿湾岸修建了长廊、草坪和露天剧场，是金融从业者午休和周末散步的地方。湾顶的镜岛与铁岬隔着镜岛水道相望，风平浪静时岛影倒映在湾面上。南岸公路从区内经过，西接卡波，东通保税港区和隆迪纳亚。区内居民来自世界各地，中文、维京语、巴克汉姆语和英语都很常见，国际学校和外国人社区集中。斯佩基亚拉高楼林立、夜景璀璨，是北维京岛最国际化的城区。
    en: The water of the bay lies as still as a mirror, which gives the district its name, from the Buckham word for mirror. It is the financial and administrative centre of the Beckerle Free Trade Zone and the district with the highest output per head in the territory. The twin towers of the Specchiara International Finance Centre stand on the shore, surrounded by offshore banks, wealth managers, insurers, reinsurers and shipping financiers, and many multinationals run their regional head offices and settlement centres here. The Beckerle International Commodity Exchange trades metal, grain and energy futures and is the territory's most important price-setter for commodities. The Free Trade Zone Administration sets policy and serves companies, and registration, foreign-exchange settlement and visas can all be handled at a one-stop service centre. Specchiara Port takes yachts and fast ferries, and Specchiara Waterfront Park runs a promenade, lawns and an open-air theatre along the shore where finance workers spend their lunch breaks and weekends. Mirror Isle lies at the head of the bay, facing Iron Point across Mirror Sound, and on calm days its reflection lies on the water. The South Coast Highway passes through, west to Capo and east to the Bonded Port Zone and Rondinaia. Residents come from all over the world; Chinese, Viking, Buckham and English are all common, and international schools and expatriate neighbourhoods are concentrated here. With its forest of towers and brilliant night skyline, Specchiara is the most international quarter of North Viking Island.
- id: div_ts5cw5
  subtype: borough
  parent: div_k4hg7b
  status: canon
  names:
    zh: 隆迪纳亚区
    en: Rondinaia District
    art-x-viking: Rondinaia
    art-x-buckham: Rondinaia
  codes:
    admin: '901003'
  population: 179000
  area_km2: 272.0
  traits: { industries: [trade, manufacturing, logistics], heritage: buckham }
  notes:
    zh: 包括贝克勒东南的离岛和海燕栖息的礁群，区名由此而来，是自由贸易区的保税仓储与加工贸易基地。隆迪纳亚保税物流园是全岛最大的保税仓库群，进口的原材料、零部件和消费品可以在园内免税存储、分拣、包装和再出口；园区周围的加工贸易工厂把进口零部件组装成电子产品、医疗器械和精密仪器，再经保税港区和卡波机场运往海外，加工贸易与物流是区里的主要产业。隆迪纳亚湾里的离岛和礁石是海燕和燕鸥的繁殖地，每年春夏数以万计的海鸟在礁上筑巢，部分岛礁划为保护区，乘船观鸟是区里独特的旅游项目。隆迪纳亚湾和斯瓦尔内斯角构成区里曲折的海岸线。南岸公路的终点就在区内，向西经保税港区、斯佩基亚拉和卡波通往萨科勒和新城。区里的居民以巴克汉姆语为母语的老渔民家庭和在工厂、仓库工作的年轻人为主，劳动年龄人口比例高。隆迪纳亚将繁忙的保税工业和宁静的海鸟礁群结合在一起，是贝克勒最有特色的区。
    en: "Taking in the islets south-east of Beckerle and the reefs where storm petrels nest, which give it its name, Rondinaia is the free trade zone's base for bonded warehousing and processing trade. The Rondinaia Bonded Logistics Park is the largest group of bonded warehouses on the island: imported raw materials, parts and consumer goods can be stored, sorted, packed and re-exported here free of duty. Around the park, processing plants assemble imported parts into electronics, medical devices and precision instruments, which leave through the Bonded Port Zone and Capo airport for overseas markets, so processing trade and logistics are the district's main business. The islets and rocks of Rondinaia Bay are breeding grounds for petrels and terns; every spring and summer tens of thousands of seabirds nest on the reefs, some of which are protected, and birdwatching by boat is the district's own kind of tourism. Rondinaia Bay and Svalnes make up its winding coastline. The South Coast Highway ends in the district and runs west through the Bonded Port Zone, Specchiara and Capo to Sakole and New City. Residents are mostly long-established Buckham-speaking fishing families and young people working in the factories and warehouses, with a high share of working-age adults. Rondinaia sets busy bonded industry beside quiet seabird reefs, and it is Beckerle's most distinctive district."
- id: div_f9x3wn
  subtype: borough
  parent: div_k4hg7b
  status: generated
  names:
    zh: 保税港区
    en: Bonded Port Zone
    art-x-viking: Freihafen
    art-x-buckham: Porto Franco
  codes:
    admin: '901004'
  population: 55000
  area_km2: 110.0
  traits: { industries: [port, trade, logistics] }
  notes:
    zh: 斯佩基亚拉湾外填海建成的保税港区，是贝克勒自由贸易区面积最小的区，也是领地最开放的港口。港区内建有深水集装箱码头、滚装码头和保税仓储区，大型集装箱船可以直接靠泊，货物进出不征关税，转口货物可以在港内拆拼、加工后再出口，通关时间以小时计。转口贸易、集装箱运输和保税加工是港区的全部经济，码头作业实行全天候自动化，远程控制的岸桥和无人驾驶的集卡日夜运转，使这里成为全岛装卸效率最高的港口。港区常住人口只有约五万五千，多是港口工程师、报关员、船员和物流公司职员，劳动年龄人口占绝大多数，居住区集中在港区西侧的人工岛上，配有学校、医院和商业中心。南岸公路从港区经过，西接斯佩基亚拉，东通隆迪纳亚，集装箱卡车经这条路把货物运往全岛；海上航线则连接维京港、维京群岛和世界各大港口。区内中文、巴克汉姆语和英语并用，国际船员服务中心和海员俱乐部是港区特色。保税港区是贝克勒自由贸易政策最直接的体现，也是北维京岛面向远洋的门户。
    en: The bonded port built on land reclaimed outside Specchiara Bay, the smallest district of the Beckerle Free Trade Zone and the most open port in the territory. It has deep-water container berths, ro-ro berths and bonded storage; the largest container ships can berth directly, goods come and go free of duty, transit cargo can be broken down, consolidated or processed in the port and re-exported, and customs clearance is measured in hours. Re-export trade, container shipping and bonded processing are the port's whole economy. The terminals are automated around the clock, with remote-controlled cranes and driverless trucks working day and night, making it the most efficient port on the island. Only about fifty-five thousand people live here, mostly port engineers, customs brokers, seafarers and logistics staff, so working-age adults are the great majority; housing is grouped on an artificial island on the west side of the port, with schools, a hospital and a shopping centre. The South Coast Highway passes through, west to Specchiara and east to Rondinaia, and container trucks carry goods along it to the rest of the island, while sea routes link the port with Viking Port, the Viking Islands and the world's great ports. Chinese, Buckham and English are all in use, and the international seafarers' centre and seamen's club are features of the port. The Bonded Port Zone is the most direct expression of Beckerle's free-trade rules and North Viking Island's gateway to the deep sea.
