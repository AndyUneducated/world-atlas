    zh: 天城市
    en: Skytown City
    art-x-viking: Himmelstad auf Hea
    art-x-buckham: Cielo en Teatu
  codes:
    admin: '900800'
    unlocode: NV SKY
  population: 536000
  area_km2: 7600.0
  color: '#F29E4C'
  flag: { layout: ensign, colors: ['#1F6FA8', '#FFFFFF'], charge: sun, charge_color: '#E8741E' }
  flag_notes:
    zh: "领地旗方角旗：天蓝底，右侧白色圆徽里是一轮橙色的太阳。天城以天台山、柳萨湾和绵长的银滩闻名，天蓝是海湾上空的晴天，太阳是这片阳光充足的度假海岸。海滨酒店把这面旗挂在海滩入口，游客常把它当成「今天适合下海」的信号。"
    en: "A territorial ensign in sky blue with an orange sun on the white badge. Skytown is known for its mountain, its bay and long silver beaches: the blue is the clear sky over the bay and the sun its sunny resort coast. Hotels fly the flag at the beach entrances, and visitors tend to read it as a sign that it is a good day for a swim."
  traits: { industries: [tourism, conference, residential], heritage: chinese, age: old }
  notes:
    zh: "北维京岛东南海岸的度假城市，领地建立之初从原马斯林山市析出设市，以天台山、柳萨湾和绵长的沙滩闻名。全市的经济围绕旅游和会议展开：天台区是主要的度假酒店群和会议中心所在地，天台国际会议中心常年举办领地和国际会议；银滩区拥有全岛最好的海滩、银滩主题乐园和成排的海滨酒店；岚山区则是山间的高端住宅、疗养院和高尔夫球场。天城机场和天城港把游客从维京港、维京群岛和远方带到这里，夏季航班和客轮络绎不绝，冬季则以温泉疗养、雪景和会议淡季促销吸引客人。由于气候温和、风景秀丽，许多退休人员从全岛各地移居天城，老年人比例在全岛名列前茅，医疗和养老服务因此发达。环北维京岛高速、马斯林山高速和东岸公路在市内交会，雪谷公路从天台出发通往马斯林山，贝马铁路在天城站停靠。居民大多以中文为母语，城市以干净、安静和服务周到著称，是北维京岛最受欢迎的度假地，也是很多人心中理想的养老之地。\n天城的名字好听，却是全岛最湿的城市，一年降水接近两千三百毫米。本地人对此毫不在意，酒店、商店和车站门口都摆着免费借用的公共雨伞，伞柄上刻着「天城」二字，在城里任何一个伞架都能归还；游客常把伞带回家当纪念品，市政府干脆每年多订几千把。雨也有雨的好处：天台山上云雾翻滚，雨后从山顶望柳萨湾，常能看到一道横跨海湾的彩虹。银滩的夏天短而珍贵，海滨酒店露台上卖得最好的是柳萨湾贻贝配薯条和冰镇苹果酒；冬天到岚山区泡温泉、喝一碗热鱼汤，是许多退休居民的日常。天城的老人们组织了一支「银滩合唱团」，每个周日下午在海边的音乐亭演唱，下雨也不停，观众撑着公共雨伞站成一片。"
    en: "A resort city on the south-east coast of North Viking Island, carved out of the old Maslin Mountain City when the territory was founded and known for Sky Terrace Mountain, Ljosa Bay and its long beaches. The economy revolves around tourism and conferences. Sky Terrace holds the main cluster of resort hotels and the Sky Terrace International Convention Centre, which hosts territorial and international meetings all year. Silver Beach has the best beaches on the island, the Silver Beach Theme Park and rows of seafront hotels, and Mist Hill is upmarket homes, sanatoriums and a golf course in the hills. Skytown Airport and Skytown Harbour bring visitors from Viking Port, the Viking Islands and further afield; flights and passenger ships are busy all summer, and in winter the city draws guests with spa cures, snow scenery and off-season conference offers. The mild climate and fine scenery have drawn retirees from all over the island, so the share of older people is among the highest anywhere, and healthcare and care services are well developed. The ring expressway, the Maslin Expressway and the East Coast Highway meet in the city, the Snow Valley Highway starts at Sky Terrace and climbs to Maslin Mountain, and the Beckerle–Maslin Mountain Railway stops at Skytown Station. Most residents speak Chinese at home. Known for being clean, quiet and welcoming, Skytown is the island's favourite holiday destination and, for many, the ideal place to retire.\nSkytown has a lovely name and is the wettest city on the island, close to 2,300 mm of rain a year. Locals take it in their stride: hotels, shops and stations keep stands of free public umbrellas with \"Skytown\" carved on the handle, which can be returned to any stand in town. Visitors often take them home as souvenirs, so the city simply orders a few thousand extra each year. The rain has its rewards: mist rolls over Sky Terrace Mountain, and after a shower the view from the top across Ljosa Bay often holds a rainbow spanning the bay. Summer on Silver Beach is short and precious, and the best seller on the seaside hotel terraces is Ljosa Bay mussels with chips and chilled cider; in winter, a soak in the hot springs of Mist Hill and a bowl of hot fish soup are part of everyday life for many retired residents. The town's elders run the Silver Beach Choir, which sings in the seaside bandstand every Sunday afternoon, rain or shine, to an audience standing under public umbrellas."
- id: div_w1ea18
  subtype: borough
  parent: div_ygk521
  status: canon
  names:
    zh: 天台区
    en: Sky Terrace District
    art-x-viking: Himmelterrasse
    art-x-buckham: Terrazza Cielo
  codes:
    admin: '900801'
  population: 220000
  area_km2: 2560.0
  traits: { industries: [tourism, conference] }
  notes:
    zh: 天城市的主度假区和会议中心，也是全市的行政中心，坐落在天台山脚下、柳萨湾畔。度假酒店、公寓式酒店和度假村沿着海湾和山坡层层排开，酒店前是游艇码头和海滨长廊，背后是天台山的森林和步道，登山缆车可以把游客送上山顶观赏日出和天台峡湾。天台国际会议中心是全领地规格最高的会议场馆，拥有大型会议厅、展厅和同声传译设施，领地的大型会议、学术会议和国际论坛常在这里举行，会议和商务旅游是区里与度假并重的支柱。天城机场位于区的北部，天城港则停靠来自维京港和维京群岛的客轮和邮轮，天城市人民政府也设在区内。东岸公路和雪谷公路都从这里出发，前者一头经银滩、岚山通往马斯林山的东营，另一头通往萨科勒的铁岗，后者向西深入马斯林山。居民大多在酒店、餐饮、会议和公共服务部门工作，以中文为母语的家庭占多数，退休移居者也不少。天台区四季都有游客，夏季看海、秋季赏枫、冬季泡温泉看雪，是北维京岛最繁忙的度假区。
    en: "Skytown's main resort and conference district and the seat of the city government, at the foot of Sky Terrace Mountain on Ljosa Bay. Resort hotels, apartment hotels and holiday villages climb the bay and the slopes in tiers, with a marina and seafront promenade in front and the forests and trails of Sky Terrace Mountain behind; a cable car takes visitors to the summit to watch the sunrise and look down on the Sky Terrace Fjord. The Sky Terrace International Convention Centre is the territory's most prestigious meeting venue, with large halls, exhibition space and simultaneous interpretation; the territory's major meetings, academic conferences and international forums are often held here, and business and conference travel is as important to the district as holidays. Skytown Airport lies in the north of the district, and Skytown Harbour takes ferries and cruise ships from Viking Port and the Viking Islands. The East Coast Highway and the Snow Valley Highway both start here: the first runs one way through Silver Beach and Mist Hill to East Camp in Maslin Mountain and the other way to Iron Knoll in Sakole, the second climbs west into the Maslin mountains. Most residents work in hotels, restaurants, conferences and public services; Chinese-speaking households are the majority, and many retirees have moved in. Sky Terrace has visitors all year round, for the sea in summer, the autumn colours and hot springs and snow in winter, and it is the busiest resort district on the island."
- id: div_f5s7ax
  subtype: borough
  parent: div_ygk521
  status: canon
  names:
    zh: 银滩区
    en: Silver Beach District
    art-x-viking: Silberstrand
    art-x-buckham: Spiaggia Argento
  codes:
    admin: '900802'
  population: 192000
  area_km2: 3040.0
  traits: { industries: [tourism, commerce] }
  notes:
    zh: 天城市的海滨娱乐区，拥有北维京岛最长、最白的沙滩，区名由此而来。银滩沿海岸绵延十几公里，沙质细软、海水清澈，夏季是全岛游泳、冲浪、沙滩排球和帆船运动的中心，海滨步道两旁是咖啡馆、冰淇淋店和海鲜餐厅。银滩主题乐园是全岛最大的游乐园，有过山车、水上乐园和以维京传说为主题的园区，暑假期间全岛的家庭都会带孩子来这里；银滩大酒店是滨海地标，周围还有数十家度假酒店、汽车营地和度假公寓。银滩海滨公园保护着沙丘和海岸草地，春季有候鸟在此停歇。旅游和商业是区里最主要的产业，大部分居民在酒店、餐饮、零售和娱乐场所工作，旺季时还会有大批季节工从全岛各地赶来。东岸公路沿海岸穿过全区，一头连接天台，另一头经岚山通往东营。区里的常住居民以中文为母语的家庭为主，许多人经营家庭旅馆和小店，也有不少退休移居者在海边安度晚年。银滩以阳光、沙滩和欢乐的度假氛围著称，是天城最热闹的地方。
    en: Skytown's seaside playground, with the longest and whitest beach on North Viking Island, which gives the district its name. The silver sand stretches for more than ten kilometres, fine and soft, and the water is clear; in summer this is the island's centre for swimming, surfing, beach volleyball and sailing, and cafés, ice-cream parlours and seafood restaurants line the promenade. The Silver Beach Theme Park is the largest amusement park on the island, with roller coasters, a water park and a section themed on Viking legends, and in the school holidays families from all over the island bring their children. The Silver Beach Grand Hotel is the landmark of the seafront, surrounded by dozens of resort hotels, campsites and holiday flats. Silver Beach Seafront Park protects the dunes and coastal grassland, where migrating birds rest in spring. Tourism and commerce are the main trades; most residents work in hotels, restaurants, shops and entertainment, and in the high season seasonal workers pour in from across the island. The East Coast Highway runs along the coast through the district, one way to Sky Terrace and the other through Mist Hill to East Camp. Year-round residents are mostly Chinese-speaking families; many run guesthouses and small shops, and a good number of retirees have settled by the sea. Silver Beach is known for sun, sand and a cheerful holiday mood, and it is the liveliest part of Skytown.
- id: div_ts88e3
  subtype: borough
  parent: div_ygk521
  status: canon
  names:
    zh: 岚山区
    en: Mist Hill District
    art-x-viking: Nebelhang
    art-x-buckham: Pendio Nebbia
  codes:
    admin: '900803'
  population: 124000
  area_km2: 2000.0
  traits: { industries: [residential, healthcare, tourism] }
  notes:
    zh: 天城市北部丘陵上的低密度高端住宅区，因山间常年云雾缭绕而得名。区内多为独栋别墅和低层公寓，掩映在森林和草坡之间，住户中有许多从维京港、自由市和维京群岛移居而来的退休人员、企业家和艺术家，老年人比例很高。岚山的空气清新、气候温和，疗养院、康复中心和高端养老社区沿山坡分布，医疗和养老服务是区里最重要的产业，吸引着全岛需要康复和疗养的人前来。岚山高尔夫球场是全岛最好的球场之一，十八洞球道依山傍海，每年举办领地高尔夫公开赛；岚山森林公园保护着大片的原始阔叶林和山溪，园内的步道可以登上山顶眺望柳萨湾和远处的马斯林山脉。东岸公路从区内穿过，一头经银滩通往天台，另一头通往马斯林山的东营。区里的商业以精品店、画廊、餐厅和葡萄酒吧为主，节奏悠闲，没有大型商场。居民大多以中文为母语，社区安静，治安良好。岚山代表着天城宁静高雅的一面，是全岛最理想的养老和疗养之地之一。
    en: An upmarket, low-density residential district in the hills of northern Skytown, named for the mist that hangs over the hills most of the year. Most homes are detached villas and low-rise flats hidden among forest and grassy slopes, and many residents are retirees, business people and artists who moved here from Viking Port, Freedom City and the Viking Islands, so the share of older people is high. The air is fresh and the climate mild; sanatoriums, rehabilitation centres and upmarket retirement communities spread over the slopes, healthcare and care are the district's most important trades, and people from across the island come here to recover and recuperate. Mist Hill Golf Club is one of the best courses on the island, its eighteen holes set between hills and sea, and it hosts the territory's open championship every year. Mist Hill Forest Park protects a large stand of old broadleaf forest and mountain streams, and its trails climb to the summit for views over Ljosa Bay and the distant Maslin Range. The East Coast Highway runs through the district, one way through Silver Beach to Sky Terrace and the other to East Camp in Maslin Mountain. Shops are boutiques, galleries, restaurants and wine bars, with no big malls, and the pace is unhurried. Most residents speak Chinese at home, and the neighbourhoods are quiet and safe. Mist Hill is the calm, refined side of Skytown and one of the best places on the island to retire or convalesce.
- id: div_da3s38
  subtype: locality
  parent: div_fbfqv9
  status: canon
  names:
    zh: 萨科勒市
    en: Sakole City
    art-x-viking: Sakole auf Hea
    art-x-buckham: Sakole en Teatu
  codes:
    admin: '900900'
    unlocode: NV SKL
  population: 617000
  area_km2: 6000.0
  color: '#8E7CC3'
  flag: { layout: ensign, colors: ['#4A4E69', '#FFFFFF'], charge: anvil, charge_color: '#B22234' }
  flag_notes:
    zh: "领地旗方角旗：石板灰底，右侧白色圆徽里是一座红色铁砧。萨科勒从铁岗山的铁矿和石料起家，如今是全岛最大的工业基地，铁砧代表铁岗区的工厂与锻造传统，石板灰是铁岗山的岩石，红色是炉火。萨科老镇的渔民嫌这面旗「太硬」，节日里另挂一面画着鱼的旧镇旗。"
    en: "A territorial ensign in slate grey with a red anvil on the white badge. Sakole grew from the iron ore and stone of its hills and is now the island's largest industrial base: the anvil is its works and forging tradition, the slate the rock of the hills and the red the furnace. The fishermen of the old town find the flag 'too hard' and still hang an old town banner with a fish at their festivals."
  traits: { industries: [manufacturing, mining, logistics], heritage: buckham, age: young }
  notes:
    zh: "北维京岛南部的工业城市，领地建立之初从原马斯林山市析出设市，城市名在巴克汉姆语中意为「萨科之地」。全市的经济以制造业为主：铁岗区的先进制造产业园集中了机械装备、电子元件、新能源设备和船舶配件工厂，是全岛最大的工业基地；铁岗山一带的铁矿和石料开采历史悠久，如今规模缩小，转向精深加工；罗卡区的公路货运站和仓储园区把工厂的产品运往维京港、贝克勒和全岛各地。萨科区是城市的发祥地和市政中心，萨科渔港、萨科鱼市和萨科老镇广场保留着巴克汉姆渔镇的风貌。萨科勒的工厂吸引了大量来自新城和本岛各地的年轻工人，劳动年龄人口比例很高，城市充满活力。巴克汉姆语是全市过半居民的母语，街名、商店招牌和学校课程都使用巴克汉姆语和中文双语。环北维京岛高速、南岸公路和东岸公路在市内交会，维贝铁路在铁岗区的萨科勒站停靠。萨科勒以务实、勤劳的工业传统和地道的巴克汉姆风情著称，是本岛南部的经济引擎。\n萨科勒人把自己的城市叫作「铁与鱼之城」：铁岗区的工厂每天中午十二点拉响汽笛，萨科渔港的渔民就把它当作收网回港的信号，这个习惯从城里只有一座炼铁炉的时候一直延续到今天。巴克汉姆风味是萨科勒饮食的底色，萨科鱼市旁的小馆子里，最受欢迎的是用番茄、橄榄油和当天渔获炖成的鱼汤，配一块烤得焦脆的面包；工厂食堂则以分量大出名，一份炖豆子配香肠够一个壮汉撑过整个下午。萨科老镇广场傍晚最热闹，退休的老工人在石板地上玩一种巴克汉姆式的滚木球，输的人请喝咖啡，围观的年轻工人一边看一边用巴克汉姆语起哄。城里的学校用中文和巴克汉姆语双语授课，孩子们说话常在两种语言之间随口切换，连吵架都能吵出双语版。"
    en: "An industrial city in the south of North Viking Island, carved out of the old Maslin Mountain City when the territory was founded; in Buckham its name means \"the land of Sako\". Manufacturing drives the economy. The Iron Knoll Advanced Manufacturing Park gathers makers of machinery, electronic components, clean-energy equipment and ship parts and is the largest industrial base on the island. Iron ore and stone have long been dug around Iron Knoll; the mines are smaller now and have moved into higher-value processing. The road freight terminal and warehouse parks of Rocca carry the factories' goods to Viking Port, Beckerle and the rest of the island. Sako is where the city began and its civic centre, and Sako Fishing Harbour, the fish market and the old town square keep the look of a Buckham fishing town. Sakole's factories have drawn many young workers from New City and across the island, so the share of working-age adults is high and the city feels energetic. Buckham is the first language of more than half the people, and street names, shop signs and school lessons are in Buckham and Chinese. The ring expressway and the South Coast and East Coast highways meet in the city, and the Viking Port–Beckerle Railway stops at Sakole Station in Iron Knoll. Sakole is known for its practical, hard-working industrial tradition and its genuine Buckham character, and it is the economic engine of the south of the island.\nSakole people call their town \"the city of iron and fish\": every day at noon the factories of Iron Knoll sound their whistles, and the fishermen of Sako Fishing Harbour take it as the signal to haul in and head home, a habit kept since the town had a single furnace. Buckham flavours are the base of Sakole cooking. In the little restaurants by the Sako Fish Market the favourite is a fish stew of tomatoes, olive oil and the day's catch with a slice of crisp toasted bread, and the factory canteens are known for their portions: a plate of stewed beans and sausage will see a strong worker through the whole afternoon. Sako Old Town Square is liveliest in the evening, when retired workers play a Buckham game of rolling wooden balls across the flagstones, the loser buying the coffee, while young workers look on and heckle in Buckham. Schools teach in both Chinese and Buckham, and children switch between the two mid-sentence; even their quarrels come in two languages."
- id: div_6byxb5
  subtype: borough
  parent: div_da3s38
  status: canon
  names:
    zh: 铁岗区
    en: Iron Knoll District
    art-x-viking: Eisenhügel
    art-x-buckham: Colle Ferro
  codes:
    admin: '900901'
  population: 260000
  area_km2: 2240.0
  traits: { industries: [manufacturing, mining] }
  notes:
    zh: 区名得自岗地上曾经出产的铁矿，是萨科勒市的工业核心。铁岗山的露天矿坑和竖井曾是全岛最主要的铁矿来源，矿石经铁路运往港口出口；矿藏逐渐采尽后，矿区转型为工业区，铁岗先进制造产业园在旧矿区周围铺开，集中了机床、工程机械、电子元件、风电与储能设备、船舶配件等数百家企业，是北维京岛最大的制造业基地。部分矿山仍在开采石料和建筑骨料，规模已大为缩小。铁岗矿业博物馆利用旧矿井和选矿厂改建，游客可以乘坐矿车深入地下巷道，了解矿工的生活与采矿技术的演变。萨科勒职业技术学院与产业园紧密合作，培养机械、电气和自动化技术工人，毕业生大多直接进入园区工作。东岸公路从这里出发，向东北经天台、银滩通往岚山和东营。区内居民以年轻工人家庭为主，劳动年龄人口比例全市最高，巴克汉姆语和中文并用。工厂的轮班让街区昼夜都有人气，社区里有许多工人食堂、职工宿舍和体育场。铁岗是萨科勒从矿业走向现代制造业的缩影。
    en: Named after the iron ore once dug from its knoll, Iron Knoll is Sakole's industrial core. The open pits and shafts of Iron Knoll were once the island's main source of iron ore, which went by rail to the port for export. As the deposits ran out, the mining area turned into an industrial zone. The Iron Knoll Advanced Manufacturing Park now spreads around the old workings, with hundreds of firms making machine tools, construction machinery, electronic components, wind-power and storage equipment and ship parts, the largest manufacturing base on North Viking Island. Some pits still produce stone and aggregate, on a much smaller scale. The Iron Knoll Mining Museum, built in an old shaft and dressing plant, takes visitors underground in mine cars to learn about miners' lives and how mining changed. Sakole Polytechnic works closely with the park to train machinists, electricians and automation technicians, and most graduates go straight to jobs there. The East Coast Highway starts here and runs north-east through Sky Terrace and Silver Beach to Mist Hill and East Camp. Residents are mostly young working families, the share of working-age adults is the highest in the city, and Buckham and Chinese are both in daily use. Factory shifts keep the streets busy day and night, and the neighbourhoods are full of works canteens, staff housing and sports grounds. Iron Knoll sums up Sakole's journey from mining to modern manufacturing.
- id: div_8m0jx4
  subtype: borough
  parent: div_da3s38
  status: canon
  names:
    zh: 萨科区
    en: Sako District
    art-x-viking: Sako
    art-x-buckham: Sako
  codes:
    admin: '900902'
  population: 220000
  area_km2: 2480.0
  traits: { industries: [commerce, heritage, fishing], age: balanced }
  notes:
    zh: 原萨科镇，城市名萨科勒在巴克汉姆语中意为「萨科之地」，这里是全市的发祥地和行政中心。萨科镇原是萨科湾畔的巴克汉姆渔镇，彩色的石屋沿港湾排开，萨科渔港至今仍是本岛南部最繁忙的渔港之一，渔船每天清晨把鳕鱼、鲭鱼和贝类送到萨科鱼市，鱼市旁的小餐馆以巴克汉姆风味的海鲜汤闻名。萨科老镇广场是城市的心脏，广场周围是旧市政厅、钟楼和石砌教堂，萨科勒市人民政府和主要商业街也集中在老镇附近。区内的商贸和服务业发达，商场、银行和餐馆为全市居民服务；文化遗产与旅游业也日益兴旺，老镇的巴克汉姆传统节庆、手工艺作坊和海港风光吸引着全岛游客。南岸公路从区内穿过，西接罗卡和新城，东通贝克勒。萨科湾和萨科角是区里的海岸景观，内陆的萨科山口是登山者喜爱的去处。居民大多以巴克汉姆语为母语，老镇里人们见面用巴克汉姆语问候，传统音乐和舞蹈代代相传。萨科区是萨科勒巴克汉姆文化的根，也是全市最有烟火气的地方。
    en: The former town of Sako; in Buckham the city's name Sakole means "the land of Sako", and this is where the city began and where it is governed. Sako was a Buckham fishing town on Sako Bay, its coloured stone houses lining the harbour, and Sako Fishing Harbour is still one of the busiest fishing ports in the south of the island; every dawn the boats land cod, mackerel and shellfish at the Sako Fish Market, and the little restaurants beside it are known for their Buckham fish soup. Sako Old Town Square is the heart of the city, framed by the old town hall, the clock tower and the stone church, and the city government and main shopping streets are close by. Trade and services thrive, with shops, banks and restaurants serving the whole city, and heritage and tourism are growing too, as the old town's Buckham festivals, craft workshops and harbour views draw visitors from across the island. The South Coast Highway runs through the district, west to Rocca and New City and east to Beckerle. Sako Bay and Cape Sako give the district its coastline, and inland the Sako Pass is a favourite with walkers. Most residents speak Buckham as their first language; in the old town people greet each other in Buckham, and traditional music and dance pass from one generation to the next. Sako is the root of Sakole's Buckham culture and its most lived-in, homely quarter.
