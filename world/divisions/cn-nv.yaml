  notes:
    zh: 北维京岛的农业中心和乡村度假地，位于维京港以东、勒河流经的丘陵与河谷之间。领地刚建立时，勒克尔市曾覆盖本岛东部的大片土地，此后自由市、西北市、奥克西诺市和洛龙山市相继从中析出，如今只保留原来北部约五分之一的领土。勒克尔仍是全岛最重要的粮仓和奶源地：麦田、油菜田和牧场沿河谷铺开，乳业合作社、农产品交易中心和食品加工厂支撑着地方经济；丰谷的酒庄、澄湖的湖滨集镇则让旅游业成为第二支柱，每年秋天的勒克尔丰收节是全岛最热闹的乡村节日。勒北区是市政中心，市政府、农产品交易中心和农业博物馆都在那里，北岸的小港口出口奶制品和粮食；丰谷区以葡萄园和民宿闻名；澄湖区围绕澄湖分布，是钓鱼、划船和森林徒步的好去处。环北维京岛高速、自勒高速和龙关高速在这里交会，自勒城际铁路以勒克尔站为终点，西马铁路经过市区通往洛龙山和马斯林山。居民以维京语为主要母语，许多家庭世代务农，老年人比例较高，乡村生活节奏舒缓。
    en: North Viking Island's farming centre and a country holiday region, east of Viking Port among the hills and valleys of the Lek River. When the territory was founded, Lekor City covered a large part of the island's east; Freedom City, Northwest City, Oxino and Lorond Mountain were later carved out of it, and today it keeps only about a fifth of its old land, in the north. Lekor is still the island's most important granary and source of milk. Wheat, rapeseed and pasture spread along the valleys, and dairy co-operatives, the produce exchange and food plants carry the local economy; the wineries of Harvest Vale and the lakeside towns of Clearlake make tourism the second pillar, and the Lekor harvest festival each autumn is the liveliest country fair on the island. Lekor North is the civic centre, with the city government, the produce exchange and the farming museum, and a small harbour on its north shore that ships dairy and grain. Harvest Vale is known for its vineyards and guesthouses, and Clearlake, spread around Clear Lake, is a place for fishing, boating and forest walks. The ring expressway and the expressways to Freedom City and Lorond Mountain meet here; the Freedom City–Lekor Intercity Railway ends at Lekor Station, and the Northwest–Maslin Mountain Railway passes through on its way to Lorond Mountain and Maslin Mountain. Most residents speak Viking as their first language, many families have farmed for generations, the share of older people is high and country life moves at an easy pace.
