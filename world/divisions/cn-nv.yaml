  names:
    zh: 基卢克维克区
    en: Kilukvik District
    art-x-viking: Kilukvik
    art-x-buckham: Kilukvik
  codes:
    admin: '901201'
  population: 10300
  area_km2: 8500.0
  traits: { industries: [agriculture, commerce] }
  notes:
    zh: 雅利基卢克河下游沿岸的农业区和全市的主要集镇，雅利基卢克市人民政府设在这里。雅利基卢克河在区内流过宽阔的冲积平原，河岸两侧是麦田、饲草地和奶牛场，农场多由家庭经营，规模不大但历史悠久；雅利基卢克河口有一座小渔港，渔船在河口和近海捕捞鲑鱼和鳕鱼。基卢克维克集镇是全市唯一的城镇，镇上有市政府、医院、学校、超市、农机站和每周一次的集市，为整个雅利基卢克河流域的农户、牧民和游客提供服务，商贸和公共服务是镇上的主要就业来源。雅利基卢克河公路的终点就在区内，向西经尼尔萨利特、阿基尼克和上雅利基卢克通往新城北苑；环北维京岛高速经过雅利基卢克市，南连天城，西接勒克尔；西马铁路的雅利基卢克站也在附近。区内常住人口约一万，居民以维京语为母语，许多家庭世代在河边耕种，年轻人有不少外出到新城和维京港工作，老年人比例较高。夏季的河谷绿草如茵，鲑鱼洄游季节吸引着垂钓者；冬季大雪覆盖平原，镇上的木屋炊烟袅袅。基卢克维克区是这片辽阔土地上最温暖的人间烟火。
    en: The farming district along the lower Jaalikiluk River and the city's main town, seat of the Jaalikiluk City government. The river crosses a broad alluvial plain here, and its banks are lined with wheat, fodder fields and dairy farms, mostly small family farms with long histories. A small fishing harbour at the Jaalikiluk Mouth sends boats after salmon and cod in the estuary and the near sea. Kilukvik is the only town in the city, with the city government, a hospital, schools, a supermarket, a farm-machinery depot and a weekly market serving the farmers, herders and visitors of the whole Jaalikiluk basin, and trade and public services provide most jobs. The Jaalikiluk River Highway ends in the district and runs west through the Nirsaliit, Aaqqiniq and Upper Jaalikiluk to North Gardens in New City; the ring expressway serves the city on its way between Skytown and Lekor; and Jaalikiluk Station on the Northwest–Maslin Mountain Railway is close by. About ten thousand people live here. Most speak Viking at home, many families have farmed by the river for generations, plenty of young people have left for jobs in New City and Viking Port, and the share of older people is high. In summer the valley is lush and green and the salmon run draws anglers; in winter snow covers the plain and smoke curls from the chimneys of the timber houses. Kilukvik is the warm, lived-in heart of this vast land.
- id: div_1qm5cj
  subtype: borough
  parent: div_8emjne
  status: canon
  names:
    zh: 阿基尼克区
    en: Aaqqiniq District
    art-x-viking: Aaqqiniq
    art-x-buckham: Aaqqiniq
  codes:
    admin: '901202'
  population: 6500
  area_km2: 6500.0
  traits: { industries: [heritage, tourism, government] }
  notes:
    zh: 马斯林山拆市前的机关旧址所在地，区名由此而来，如今是全市的文化遗产中心。旧马斯林山市的市政府、法院、学校和官员宅邸建在雅利基卢克河谷以东、马斯林山脉西麓的一片高阶地上，拆市、迁府之后，旧机关大楼和建筑群被完整保留下来，改建为阿基尼克博物馆，展示这片土地从维京人定居、垦荒放牧到领地建立的历史，以及马斯林山地区的军事与航天发展。博物馆群包括旧议事厅、档案馆、民俗馆和露天建筑博物馆，露天馆里迁建了雅利基卢克河流域各地的传统农舍、谷仓和教堂，夏季有身着传统服装的讲解员演示纺织、打铁和制作奶酪。文化遗产和旅游是区里的主要产业，部分领地机构的档案中心和培训基地也设在这里。区内常住人口不到一万，大多是博物馆职员、教师、农户和退休人员，以维京语为母语，老年人比例较高。雅利基卢克河公路从区内穿过，西接上雅利基卢克和新城，东通尼尔萨利特和基卢克维克。阿基尼克的石砌建筑、老街和古树保持着往日的庄重，阶地上可以远眺马斯林山脉的雪峰，是追寻北维京岛历史的必到之地。
    en: The site of the old government buildings from before Maslin Mountain was divided, which gives it its name, and today the city's heritage centre. The old Maslin Mountain City government, courthouse, schools and officials' houses stood on a high terrace east of the Jaalikiluk valley, at the western foot of the Maslin Range. When the city was divided and the seat moved away, the buildings were kept intact and turned into the Aaqqiniq Museum, which tells the story of this land from Viking settlement, clearing and herding to the founding of the territory, and of the military and space history of the Maslin Mountain region. The museum includes the old council hall, an archive, a folk museum and an open-air museum of buildings, where traditional farmhouses, barns and churches from across the Jaalikiluk basin have been rebuilt; in summer guides in traditional dress demonstrate weaving, smithing and cheese-making. Heritage and tourism are the main trades, and some territorial archives and training centres are also based here. Fewer than ten thousand people live in the district, mostly museum staff, teachers, farmers and retirees; most speak Viking at home, and the share of older people is high. The Jaalikiluk River Highway runs through the district, west to Upper Jaalikiluk and New City and east to the Nirsaliit and Kilukvik. Aaqqiniq's stone buildings, old streets and ancient trees keep their former dignity, and from the terrace you can see the snow peaks of the Maslin Range. It is the place to come for the history of North Viking Island.
- id: div_4vnc7y
  subtype: borough
  parent: div_8emjne
  status: generated
  names:
    zh: 上雅利基卢克改良区
    en: Upper Jaalikiluk Improvement District
    art-x-viking: Oberjaalikiluk
    art-x-buckham: Alto Jaalikiluk
  codes:
    admin: '901203'
  population: 1600
  area_km2: 9000.0
  traits: { industries: [agriculture, forestry] }
  notes:
    zh: 雅利基卢克河上游的无建制荒野，面积九千平方公里，常住人口只有约一千六百人，是全岛人口最稀少的地区之一。这里不设区议会，道路养护、消防、学校和医疗等公共服务由领地政府直接提供，「改良区」之名源于领地对这片土地进行垦荒和改良的长期计划。区内是雅利基卢克河上游的河谷、沼泽、针叶林和苔原，零散分布着几处农场、林场和护林站，少数居民在河谷平地上种植耐寒的大麦和饲草，或在森林中从事伐木和狩猎向导，许多家庭靠领地的补贴和季节性工作维持生计。上雅利基卢克的荒野保存着全岛最完整的原始生态，驼鹿、狼、熊和猛禽在此栖息，雅利基卢克河的上游河段是鲑鱼的产卵地，吸引着野外探险者、垂钓者和摄影师。雅利基卢克河公路是区内唯一的公路，从新城北苑出发，沿河谷向东北通往阿基尼克和基卢克维克，沿途设有几处加油站和应急避难所。居民以维京语为母语，老年人比例较高，冬季大雪封路时，居民依靠雪地摩托和直升机与外界联系。上雅利基卢克荒凉而纯净，是北维京岛最后的荒野之一。
    en: "Unincorporated wilderness on the upper Jaalikiluk River, nine thousand square kilometres with only about one thousand six hundred residents, one of the emptiest parts of the island. There is no district council: road maintenance, firefighting, schools and healthcare are provided directly by the territorial government, and the name \"improvement district\" comes from the territory's long-running plan to clear and improve the land. The district is the valleys, marshes, conifer forests and tundra of the upper Jaalikiluk, dotted with a few farms, forestry camps and ranger stations. A handful of residents grow hardy barley and fodder on the valley floor or work as loggers and hunting guides, and many families get by on territorial support and seasonal work. Upper Jaalikiluk keeps the most intact natural ecosystem on the island: moose, wolves, bears and birds of prey live here, and the upper river is a salmon spawning ground that draws wilderness travellers, anglers and photographers. The Jaalikiluk River Highway is the only road, running from North Gardens in New City north-east up the valley to Aaqqiniq and Kilukvik, with a few filling stations and emergency shelters along the way. Residents speak Viking at home and the share of older people is high; when snow closes the road in winter, people keep in touch with the outside world by snowmobile and helicopter. Desolate and pure, Upper Jaalikiluk is one of the last wildernesses of North Viking Island."
- id: div_e2pk5r
  subtype: borough
  parent: div_8emjne
  status: generated
  names:
    zh: 尼尔萨利特牧区
    en: Nirsaliit Pastoral District
    art-x-viking: Nirsaliit
    art-x-buckham: Nirsaliit
  codes:
    admin: '901204'
  population: 2100
  area_km2: 8000.0
  traits: { industries: [herding], age: balanced }
  notes:
    zh: 雅利基卢克河东岸高原上的驯鹿冬季牧场，常住人口每平方公里不到零点三人，是全岛唯一以游牧为主要生计的地区。每年秋季，牧民赶着驯鹿群从北部的夏季牧场南迁到这片高原，在苔原和疏林间度过冬天，春天再随着冰雪消融北上，这种迁徙方式已经延续了许多代。驯鹿放牧是区里最主要的产业，驯鹿肉、鹿皮、鹿角工艺品和熏制鹿肉是牧民的主要收入，尼尔萨利特牧民集市每年冬季开市，牧民在这里出售产品、交换物资，也是游客体验牧民文化的窗口。近年来，牧区发展起生态旅游，游客可以乘坐驯鹿雪橇、住进牧民的帐篷、观赏极光，收入补充了牧民的生计。牧区的公共服务由领地提供，流动学校和流动诊所随牧民一起迁徙。维京语和中文母语者大约各占一半，年轻人和儿童的比例比周边地区略高，许多年轻牧民在学习现代牧业技术的同时坚持传统。牧场边缘连着五千多平方公里的雅尔斯托尔冰原。雅利基卢克河公路从区内穿过，西接阿基尼克，东通基卢克维克。尼尔萨利特的冬天寂静辽阔，鹿群在雪原上缓缓移动，是北维京岛最独特的风景。
    en: "The winter reindeer pastures on the upland east of the Jaalikiluk River, with fewer than 0.3 residents per square kilometre, the only part of the island where herding is the main way of life. Every autumn the herders drive their reindeer south from the summer pastures in the north to this upland, where the herds winter among tundra and open woodland before heading north again in spring as the snow melts; this migration has gone on for many generations. Reindeer herding is the main trade: meat, hides, antler crafts and smoked reindeer are the herders' chief income. The Nirsaliit Herders' Market opens every winter, where herders sell their produce and trade supplies, and it is also visitors' window on herding culture. Nature tourism has grown up on the range; visitors ride reindeer sleds, stay in herders' tents and watch the aurora, and the income helps the herders get by. Public services come from the territory, with mobile schools and clinics that move with the herders. Viking and Chinese speakers are roughly even in number, and young people and children make up a slightly larger share than in the surrounding districts; many young herders learn modern herding methods while keeping the old ways. At the edge of the pastures lies the Jarlstol Icefield, more than five thousand square kilometres of ice. The Jaalikiluk River Highway crosses the district, west to Aaqqiniq and east to Kilukvik. In the silent, wide-open winter, with herds drifting slowly across the snowfields, the Nirsaliit is the most distinctive landscape on North Viking Island."
