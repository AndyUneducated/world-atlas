  status: canon
  names:
    zh: 星港区
    en: Starport District
    art-x-viking: Sternhafen
    art-x-buckham: Porto Stella
  codes:
    admin: '901102'
  population: 22000
  area_km2: 4300.0
  traits: { industries: [defence, aerospace, research] }
  notes:
    zh: 深空太空军马斯林山指挥中心的驻地，是领地航天与深空活动的指挥中枢。星港指挥中心负责航天发射、在轨飞行器和深空探测任务的指挥调度，全天候运转；星港深空测控站的大口径天线阵追踪着飞往月球和行星际空间的探测器，接收来自深空的信号。星港是一座航天港，拥有发射工位和着陆场，星港发动机试车台进行火箭发动机的地面点火试验，试车时轰鸣声在山谷中回荡数十公里；星港无人机基地起降侦察与中继无人机，星港海岸雷达站和星港防空阵地守卫着东部海岸。星港航天博物馆是区里唯一向公众常年开放的设施，展出退役的火箭、返回舱和深空探测器模型，每逢发射日都有大批游客和航天爱好者前来。区内常住人口约两万二千，绝大多数是军人、航天工程师和他们的家属，劳动年龄人口比例极高。雪谷公路的终点就在区内，经群峰、西坪通往和平区和天台。马斯林河在区内汇入大海。居民大多以中文为母语，街道以航天器和星座命名。星港是北维京岛通往深空的大门，也是全领地科技最尖端的地方之一。
    en: Home of the Deep Space Force's Maslin Mountain command centre and the nerve centre of the territory's space and deep-space activity. The Starport Command Centre directs launches, spacecraft in orbit and deep-space missions around the clock, and the large dishes of the Starport Deep Space Station track probes bound for the Moon and interplanetary space and listen for their signals. Starport itself is a spaceport with launch pads and a landing zone. At the Starport Engine Test Stands rocket engines are fired on the ground, and during a test the roar echoes for tens of kilometres through the valleys. The Starport Drone Base flies reconnaissance and relay drones, and the Starport Coastal Radar Station and the Starport Air Defence Site guard the eastern coast. The Starport Space Museum is the only facility open to the public all year, showing retired rockets, return capsules and models of deep-space probes, and on launch days crowds of visitors and space fans arrive. Some twenty-two thousand people live here, nearly all service members, space engineers and their families, with a very high share of working-age adults. The Snow Valley Highway ends in the district and runs through the High Peaks and West Heath to Peace and Sky Terrace. The Maslin River reaches the sea in the district. Most residents speak Chinese at home, and the streets are named after spacecraft and constellations. Starport is North Viking Island's door to deep space and one of the most technologically advanced places in the territory.
