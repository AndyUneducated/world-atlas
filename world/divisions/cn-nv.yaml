  traits: { industries: [commerce, residential, logistics] }
  notes:
    zh: 建在原来的青草坪地上，区名由此而来，是新城市的商业中心和交通枢纽。区内以高层住宅和大型商业综合体为主，青坪购物中心是本岛南部最大的购物中心，集商场、影院、餐饮和室内游乐场于一体，周末吸引着新城、萨科勒和贝克勒的居民。区内的公交枢纽和长途客运站与北苑区的新城站相接，每天有大量通勤者从这里前往萨科勒和贝克勒上班。新城体育中心拥有体育场、游泳馆和综合训练馆，承办过全领地的运动会，也是社区居民健身的去处。伊卡苏瓦高速和南岸公路在区内交会，前者向北经北苑、伊卡苏瓦通往洛龙山，后者向南经南驿、罗卡通往萨科勒和贝克勒。区的北部析出设立了中苑区，两区如今连成一片城市中心。居民以年轻的通勤家庭为主，大多以中文为母语，物流配送和零售服务提供了大量就业。青坪的街道宽阔、绿化良好，高层住宅之间留有大片草坪，延续着地名中的青草意象，是新城市最繁忙的地方。
    en: Built on what were once green meadows, which give it its name, Greenmead is New City's commercial centre and transport hub. High-rise housing and large mixed-use complexes dominate. Greenmead Shopping Centre is the largest in the south of the island, with shops, cinemas, restaurants and an indoor play centre, and at weekends it draws people from New City, Sakole and Beckerle. The district's bus hub and coach station connect with New City Station in neighbouring North Gardens, and every day crowds of commuters leave from here for work in Sakole and Beckerle. The New City Sports Centre, with a stadium, a swimming hall and a multi-sports hall, has hosted the territorial games and is where local residents come to keep fit. The Ikkasuvva Expressway and the South Coast Highway meet in the district, the first running north through North Gardens and Ikkasuvva to Lorond Mountain, the second south through South Post and Rocca to Sakole and Beckerle. The northern part of the district was split off to form Central Gardens, and together the two now make up the city centre. Residents are mostly young commuting families who speak Chinese at home, and delivery and retail provide many jobs. Greenmead's streets are broad and green, with wide lawns left between the towers in keeping with its name, and it is the busiest place in New City.
- id: div_s1qwxh
