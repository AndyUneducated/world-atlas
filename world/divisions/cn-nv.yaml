  notes:
    zh: 环绕澄湖分布的湖滨区，以清澈的湖水和环湖集镇得名，是勒克尔市的休闲度假地。澄湖是北维京岛最大的湖泊之一，湖水来自洛龙山脉的融雪，水质极清，夏季可以划船、游泳、帆板和垂钓，冬季湖面结冰后则成为冰钓和滑冰的乐园。澄湖湖滨公园沿湖岸修建了步道、观鸟台和露营地，湖边的木屋酒店和家庭旅馆常年接待游客。湖里出产鳟鱼和白鲑，渔民用传统方法捕捞，烟熏鳟鱼是当地的特产；周围的山坡覆盖着针叶林，林业和木材加工仍是许多村镇的生计。区内人口分散在湖岸的几座小镇上，居民以维京语为母语，老年人和退休移居者较多，生活安静。杉岭公路的终点就在区内，向东南经龙关、杉岭通往奥克西诺，是从平原进入山区的必经之路。湖的北岸可以远眺洛龙山脉的雪峰，日出和日落时湖光山色倒映在水中，是全岛最受欢迎的风景之一。澄湖区严格控制湖岸开发，保护水源和湿地。
    en: The lakeside district around Clear Lake, named for its clear water and the towns on its shores, and Lekor City's holiday resort. Clear Lake is one of the largest lakes on North Viking Island. Its water comes from snowmelt off the Lorond Range and is exceptionally clear; in summer there is boating, swimming, windsurfing and angling, and in winter the frozen lake becomes a place for ice fishing and skating. Clearlake Shore Park runs footpaths, bird hides and campsites along the shore, and lakeside lodges and family guesthouses take visitors all year. The lake yields trout and whitefish, still caught the traditional way, and smoked trout is the local speciality; the slopes around are covered with conifers, and forestry and sawmills remain the living of many villages. People are spread among a few small towns on the shore; most speak Viking at home, many are older or retired incomers, and life is quiet. The Fir Ridge Highway ends in the district, running south-east through Dragon Pass and Fir Ridge to Oxino, the main road from the plains into the mountains. From the north shore you can see the snow peaks of the Lorond Range, and at sunrise and sunset the lake mirrors the mountains, one of the best-loved views on the island. Building on the shore is tightly limited to protect the water supply and the wetlands.
