  traits: { industries: [heritage, tourism, commerce], age: old }
  notes:
    zh: 维京语意为「石堡」，维京港的老城区，围绕维京时代修筑的斯坦堡石垒逐渐形成。石垒建在俯瞰鲸湾的高地上，城墙、望楼和地下粮仓保存完好，如今辟为遗址公园，夏季有维京长船节和中世纪市集表演。石垒脚下是迷宫般的石板窄街，两旁是陡坡屋顶的石屋、手工作坊、旧书店和老酒馆，很多店铺由同一家族经营了好几代。文化遗产和旅游是区里的主业，博物馆、民宿和导览服务吸引着来自群岛和本岛各地的游客，传统集市每周开放，售卖羊毛织物、木雕和熏鱼。由于老城建筑受到严格保护，区里少有新建高楼，年轻人多搬到奥斯特海姆和海门，留下的居民年龄偏大，老年人比例全市最高。观星高速从区内经过，向东通往奥斯特海姆和自由市。维京语在这里使用最普遍，街名、门牌和教堂铭文都以维京语书写。斯坦堡是维京港最有历史感的地方，也是市民心中城市的根。
    en: Steinburg means "stone fort" in Viking. It is Viking Port's old town, which grew up around the stone fort built in Viking times. The fort stands on high ground above Whale Bay, its walls, watchtowers and underground granaries well preserved; it is now a heritage park, with a longship festival and medieval market shows in summer. Below it lies a maze of narrow flagstone lanes lined with steep-roofed stone houses, craft workshops, second-hand bookshops and old taverns, many run by the same family for generations. Heritage and tourism are the district's living. Museums, guesthouses and guides draw visitors from the islands and from all over North Viking Island, and the traditional market opens every week with woollens, wood carvings and smoked fish. Because the old buildings are strictly protected, there are few new towers; young people tend to move out to Osterheim and Seagate, and those who stay are older, giving Steinburg the highest share of elderly residents in the city. The Stargazer Expressway passes through on its way east to Osterheim and Freedom City. Viking is spoken here more than anywhere else in the city, and street names, door numbers and church inscriptions are all written in it. Steinburg is the most historic corner of Viking Port, and for its citizens the place where the city has its roots.
