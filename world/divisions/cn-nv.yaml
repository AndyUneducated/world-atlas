    unlocode: NV NWS
  population: 598000
  area_km2: 18400.0
  color: '#36B37E'
  flag: { layout: ensign, colors: ['#1E5B47', '#FFFFFF'], charge: orbit, charge_color: '#0B3D91' }
  flag_notes:
    zh: "领地旗方角旗：深绿底，左上角是领地旗，右侧白色圆徽里是一颗带轨道的深蓝行星。领地建立之初新设的各市都采用这一格式，以领地旗表明出身，以圆徽讲各自的故事。西北市的圆徽代表望星天文台、深空研究和科学大道上的实验室，深绿取自林道区和寒岭的森林。"
    en: "A territorial ensign: deep green with the territory flag in the canton and, in the fly, a white badge bearing a deep blue planet in its orbit. The cities created when the territory was founded all fly this pattern, the territory flag showing where they come from and the badge telling their own story. Northwest's badge stands for its observatory, deep-space research and the laboratories along Science Avenue; the green is the forest of the university town and the hills."
  traits: { industries: [research, education, media], heritage: mixed, age: balanced }
  notes:
    zh: "北维京岛的科研与教育中心，坐落在本岛西北部，领地建立之初从原勒克尔市析出设市。全市的经济建立在知识之上：北维京大学、林道理工学院和众多国家实验室、研究所分布在科学大道两侧，深空太空军北维京研发中心、望星天文台和科学城的航天企业构成领地最重要的科研集群，研究人员、教师和学生在居民中占很大比例。鹿鸣区是市政中心，西北市人民政府和西北广播电视中心都在那里，领地的电视台和电台从这里向全岛播出；望星区和科学城沿科学大道向东延伸，是实验室和高科技企业的聚集地；林道区是大学城；寒岭区则是山岭间的生态研究站和低密度住宅。由于研究岗位多、薪酬高，西北市的人均产出位居全岛前列，居民的平均年龄也比其他城市年轻。环北维京岛高速、西塔高速、观星高速和西岸公路在这里交会，西北机场、维西城际铁路和西马铁路通往维京港、自由市和马斯林山。城市里中文、维京语和巴克汉姆语并用，学术交流频繁，是领地最国际化的城市之一。\n西北市常被岛上其他城市叫作「博士城」，据说在科学大道上问路，对方多半会掏出笔给你画一张示意图。这座城市格外珍惜夜空：冬天每逢晴朗的新月之夜，望星区和科学城的路灯统一调暗两小时，望星天文台向市民开放，排队看月面环形山和星团的人里一半是孩子。林道区的大学城夜里最热闹，烤土豆、奶酪热汤和肉桂卷是期末考试周的标配，小吃摊开到凌晨。西北广播电视中心每天清晨用中文、维京语和巴克汉姆语轮流播报天气，三位主持人各说一种语言，不少岛民就是听着这档节目学会了另外两种语言的问候。寒岭区的生态站每年冬天清点一次山岭里的雪兔，结果会在晚间新闻里像选举结果一样逐区公布。"
    en: "North Viking Island's centre of research and education, in the north-west of the island; it was carved out of the old Lekor City when the territory was founded. The city's economy rests on knowledge. The University of North Viking, the Woodway Institute of Technology and many national laboratories and institutes line Science Avenue, and the Deep Space Force North Viking Research and Development Centre, the Stargaze Observatory and the aerospace firms of Science City form the territory's most important research cluster; researchers, teachers and students are a large part of the population. Deersong is the civic centre, home to the city government and the Northwest Broadcasting Centre, from which the territory's television and radio stations broadcast to the whole island. Stargaze and Science City stretch east along Science Avenue as a corridor of laboratories and high-tech firms, Woodway is the university town, and Frost Ridge is ecological research stations and scattered homes in the hills. With many well-paid research jobs, Northwest City ranks near the top of the island for output per head, and its people are younger on average than in other cities. The ring expressway, the Northwest–Tavrupukkuvik and Stargazer expressways and the West Coast Highway meet here, and Northwest Airport and two railways connect the city with Viking Port, Freedom City and Maslin Mountain. Chinese, Viking and Buckham are all in daily use and academic visitors come and go, making it one of the most international cities in the territory.\nElsewhere on the island Northwest City is known as \"PhD Town\"; ask the way on Science Avenue, they say, and you will most likely be handed a sketch map. The city guards its night sky: on clear moonless winter nights the street lights of Stargaze and Science City are dimmed for two hours and the Stargaze Observatory opens its doors, and half the queue to see the moon's craters and the star clusters is children. The university town of Woodway is liveliest at night, when baked potatoes, hot cheese soup and cinnamon buns see students through exam week and the food stalls stay open past midnight. Every morning the Northwest Broadcasting Centre reads the weather in Chinese, Viking and Buckham, one presenter for each language, and many islanders picked up greetings in the other two languages from the programme. Each winter the Frost Ridge Ecological Station counts the mountain hares in the hills, and the evening news announces the result district by district, like an election."
