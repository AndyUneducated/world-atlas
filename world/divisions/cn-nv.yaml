  names:
    zh: 洛龙山市
    en: Lorond Mountain City
    art-x-viking: Lorondberg auf Hea
    art-x-buckham: Lorond Tehee en Teatu
  codes:
    admin: '900600'
    unlocode: NV LRD
  population: 309000
  area_km2: 24000.0
  color: '#5E9E6E'
  flag: { layout: ensign, colors: ['#2E4F3A', '#FFFFFF'], charge: peaks, charge_color: '#2E4F3A' }
  flag_notes:
    zh: "领地旗方角旗：冷杉绿底，右侧白色圆徽里是相连的绿色雪峰。雪峰是洛龙山脉的群峰与冰川，峰顶的白色缺口是冰斗里终年不化的积雪；冷杉绿是纳帕图克的云杉林和冷杉林。山里的护林员和滑雪向导都把这面旗缝在外套的左臂上。"
    en: "A territorial ensign in fir green, the white badge in the fly showing a green massif of snow peaks: the peaks and glaciers of the Lorond range, the white notches the snow that never melts in the cirques. The green is the spruce and fir of the mountain forests, and rangers and ski guides wear the flag on their left sleeve."
  traits: { industries: [forestry, ski, mining], heritage: viking, age: old }
  notes:
    zh: "北维京岛中部的山地城市，全市被洛龙山脉的群峰、冰川和峡谷覆盖，领地建立之初从原勒克尔市析出设市。全市面积广阔，人口只有约三十一万，主要集中在卡蒂尔尤阿克、伊卡苏瓦等山谷集镇里。地形复杂使这里成为本岛的天然屏障和交通咽喉：卡蒂尔尤阿克集镇是山区的公路枢纽，卡蒂尔尤阿克高速、伊卡苏瓦高速和纳帕图克公路都在这里交会，西马铁路和新洛铁路在洛龙山站汇合。林业是传统支柱，纳帕图克的云杉林和冷杉林在严格的采伐配额下经营，木材加工厂和护林站遍布山间；冬季运动是新的增长点，卡蒂尔尤阿克附近的滑雪场和山间木屋吸引着全岛的滑雪者；山中的石料和矿产开采规模不大，但仍为本地提供就业。洛龙峰是洛龙山脉的主峰，上千平方公里的洛龙冰川、纳帕图克冰川和伊卡苏瓦湖等景观让这里成为登山和徒步的胜地，伊卡苏瓦瀑布公园更是全岛最壮观的瀑布群。居民以维京语为主要母语，许多家庭世代居住在山谷里，老年人比例较高。洛龙山的生活节奏缓慢，冬季漫长，是北维京岛最原始、最壮美的地区。\n洛龙山人说话慢、走路快，岛上流传一句玩笑：「在洛龙山问路，第一句回答永远是『看天气』。」这里冬天最低气温可以跌到零下二十五度，大雪封山时，卡蒂尔尤阿克广播站每天早晚各念一遍全市山口和隧道的通行情况，播报员念山口名的抑扬顿挫在全岛都有名，不少外地司机冬天开车专门调到这个频道。伊卡苏瓦瀑布公园的瀑布在隆冬冻成几十米高的冰墙，成了冰攀爱好者的练习场；夏天融水下泄，隔着几公里都能听见峡谷里的水声。山里的吃食带着松林味：熏鳟鱼、云杉嫩芽熬的糖浆、配越橘酱的烤野味，滑雪场的木屋里还卖一种把奶酪和土豆一起烤到焦黄的「雪道饼」。纳帕图克的护林员有个习惯，每年采伐季开工前，先在最老的一棵冷杉下放一块面包，算是向山林打个招呼。"
    en: "A mountain city in the middle of North Viking Island, covered by the peaks, glaciers and gorges of the Lorond Range; it was carved out of the old Lekor City when the territory was founded. The city is vast but has only some three hundred and ten thousand people, mostly in valley towns such as Katirjuaq and Ikkasuvva. Its rough country makes it the island's natural barrier and its transport bottleneck: the town of Katirjuaq is the hub of the mountain roads, where the Long Pass and Ikkasuvva expressways and the Napatuuq Highway meet, and two railways come together at Lorond Mountain Station. Forestry is the traditional mainstay; the spruce and fir forests of Napatuuq are worked under strict felling quotas, and sawmills and ranger stations are scattered through the hills. Winter sports are the new growth: ski areas and mountain cabins near Katirjuaq draw skiers from across the island, and small quarries and mines still give local jobs. Lorond Peak crowns the range, and the Lorond Glacier, more than a thousand square kilometres of ice, the Napatuuq Glacier and Lake Ikkasuvva make the city a favourite for climbing and hiking, while Ikkasuvva Falls Park has the most spectacular waterfalls on the island. Most residents speak Viking at home, many families have lived in the valleys for generations, and the share of older people is high. Life is slow and winters are long in the wildest and grandest corner of North Viking Island.\nLorond Mountain people talk slowly and walk fast, and the island has a joke about them: \"Ask the way in Lorond Mountain and the first answer is always 'depends on the weather'.\" Winter lows can fall to −25 °C, and when snow closes the mountains the Katirjuaq radio station reads out the state of every pass and tunnel in the city each morning and evening; the announcer's rise and fall through the pass names is famous across the island, and many drivers from elsewhere tune in on purpose in winter. In deep winter the falls of Ikkasuvva Falls Park freeze into ice walls tens of metres high that ice climbers use for practice; in summer the meltwater roars down and can be heard kilometres away. Mountain food tastes of the pine woods: smoked trout, spruce-tip syrup and roast game with lingonberry sauce, and the ski huts sell a \"piste cake\" of cheese and potato baked until golden. The foresters of Napatuuq have a habit: before each felling season they leave a piece of bread under the oldest fir, a way of greeting the forest."
