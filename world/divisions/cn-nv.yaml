  traits: { industries: [research, education, media], heritage: mixed, age: balanced }
  notes:
    zh: 北维京岛的科研与教育中心，坐落在本岛西北部，领地建立之初从原勒克尔市析出设市。全市的经济建立在知识之上：北维京大学、林道理工学院和众多国家实验室、研究所分布在科学大道两侧，深空太空军北维京研发中心、望星天文台和科学城的航天企业构成领地最重要的科研集群，研究人员、教师和学生在居民中占很大比例。鹿鸣区是市政中心，西北市人民政府和西北广播电视中心都在那里，领地的电视台和电台从这里向全岛播出；望星区和科学城沿科学大道向东延伸，是实验室和高科技企业的聚集地；林道区是大学城；寒岭区则是山岭间的生态研究站和低密度住宅。由于研究岗位多、薪酬高，西北市的人均产出位居全岛前列，居民的平均年龄也比其他城市年轻。环北维京岛高速、西奥高速、观星高速和西岸公路在这里交会，西北机场、维西城际铁路和西马铁路通往维京港、自由市和马斯林山。城市里中文、维京语和巴克汉姆语并用，学术交流频繁，是领地最国际化的城市之一。
    en: North Viking Island's centre of research and education, in the north-west of the island; it was carved out of the old Lekor City when the territory was founded. The city's economy rests on knowledge. The University of North Viking, the Lindau Institute of Technology and many national laboratories and institutes line Science Avenue, and the Deep Space Force North Viking Research and Development Centre, the Stargaze Observatory and the aerospace firms of Science City form the territory's most important research cluster; researchers, teachers and students are a large part of the population. Deersong is the civic centre, home to the city government and the Northwest Broadcasting Centre, from which the territory's television and radio stations broadcast to the whole island. Stargaze and Science City stretch east along Science Avenue as a corridor of laboratories and high-tech firms, Lindau is the university town, and Frost Ridge is ecological research stations and scattered homes in the hills. With many well-paid research jobs, Northwest City ranks near the top of the island for output per head, and its people are younger on average than in other cities. The ring expressway, the Northwest–Oxino and Stargazer expressways and the West Coast Highway meet here, and Northwest Airport and two railways connect the city with Viking Port, Freedom City and Maslin Mountain. Chinese, Viking and Buckham are all in daily use and academic visitors come and go, making it one of the most international cities in the territory.
