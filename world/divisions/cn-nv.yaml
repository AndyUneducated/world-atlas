  names:
    zh: 马斯林山市
    en: Maslin Mountain City
    art-x-viking: Maslinberg auf Hea
    art-x-buckham: Maslin Tehee en Teatu
  codes:
    admin: '901100'
    unlocode: NV MSL
  population: 180000
  area_km2: 27000.0
  color: '#9A8F7E'
  emblem:
    motif: basin
    pattern: contours
  traits: { industries: [defence, aerospace, research], heritage: chinese, age: young }
  notes:
    zh: 北维京岛东部的山地军事城市，三面被马斯林山脉的雪峰环绕，只有东部是通向海岸的平地。全市面积广阔，常住人口只有约十八万，其中驻军约五万人，空军、深空太空军和陆军在这里驻有三十多处基地与设施，是领地最重要的国防和航天基地。深空太空军的指挥中心、深空测控站和维京-马斯林山发射与降落中心构成了领地航天活动的核心，火箭从西坪的发射场升空，飞船在这里降落、整修后再次出发；空军的作战机场、预警雷达和飞行学院守护着全岛的天空；陆军的联合训练基地和寒区训练场则在雪谷和群峰之间展开。国防、航天和科研是全市经济的全部支柱，大量的工程师、技术员、军人和家属构成了居民的主体，劳动年龄人口比例全岛最高，老年人很少。和平区是市政中心；星港、东营、西坪、雪谷四区各有分工；群峰训练管理区由领地与驻军共管。马斯林山高速、马斯林山空天高速、东岸公路和雪谷公路连通各区，西马铁路和贝马铁路在这里交会，马斯林山航天铁路把东营港与西坪发射场连在一起。居民大多以中文为母语，城市秩序井然，部分地区对公众开放参观。
    en: "A military city in the mountains of eastern North Viking Island, ringed on three sides by the snow peaks of the Maslin Range, with only its eastern edge opening onto flat land by the coast. The city is vast, but only about a hundred and eighty thousand people live here, some fifty thousand of them service personnel. The Air Force, the Deep Space Force and the Army keep more than thirty bases and facilities here, making it the territory's most important defence and space base. The Deep Space Force command centre, the deep-space tracking station and the Viking–Maslin Mountain Launch and Landing Centre are the core of the territory's space activity: rockets lift off from West Heath, and spacecraft land here, are refurbished and fly again. Air Force fighter bases, early-warning radars and the flight academy guard the island's skies, and the Army's joint training base and cold-weather ranges spread between Snow Valley and the high peaks. Defence, space and research are the whole economy; engineers, technicians, service members and their families make up most of the population, the share of working-age adults is the highest on the island and there are few elderly people. Peace is the civic centre, Starport, East Camp, West Heath and Snow Valley each have their own role, and the High Peaks Training Area is run jointly by the territory and the garrison. Expressways and highways tie the districts together, two railways meet here, and the Maslin Mountain Aerospace Railway links the port at East Camp with the launch site at West Heath. Most residents speak Chinese at home; the city is orderly, and parts of it are open to visitors."
