  status: canon
  names:
    zh: 岚山区
    en: Mist Hill District
    art-x-viking: Nebelhang
    art-x-buckham: Pendio Nebbia
  codes:
    admin: '900803'
  population: 180000
  area_km2: 2000.0
  traits: { industries: [residential, healthcare, tourism] }
  notes:
    zh: 天城市北部丘陵上的低密度高端住宅区，因山间常年云雾缭绕而得名。区内多为独栋别墅和低层公寓，掩映在森林和草坡之间，住户中有许多从维京港、自由市和维京群岛移居而来的退休人员、企业家和艺术家，老年人比例很高。岚山的空气清新、气候温和，疗养院、康复中心和高端养老社区沿山坡分布，医疗和养老服务是区里最重要的产业，吸引着全岛需要康复和疗养的人前来。岚山高尔夫球场是全岛最好的球场之一，十八洞球道依山傍海，每年举办领地高尔夫公开赛；岚山森林公园保护着大片的原始阔叶林和山溪，园内的步道可以登上山顶眺望天河湾和远处的马斯林山脉。东岸公路从区内穿过，一头经银滩通往天台，另一头通往马斯林山的东营。区里的商业以精品店、画廊、餐厅和葡萄酒吧为主，节奏悠闲，没有大型商场。居民大多以中文为母语，社区安静，治安良好。岚山代表着天城宁静高雅的一面，是全岛最理想的养老和疗养之地之一。
    en: An upmarket, low-density residential district in the hills of northern Skytown, named for the mist that hangs over the hills most of the year. Most homes are detached villas and low-rise flats hidden among forest and grassy slopes, and many residents are retirees, business people and artists who moved here from Viking Port, Freedom City and the Viking Islands, so the share of older people is high. The air is fresh and the climate mild; sanatoriums, rehabilitation centres and upmarket retirement communities spread over the slopes, healthcare and care are the district's most important trades, and people from across the island come here to recover and recuperate. Mist Hill Golf Club is one of the best courses on the island, its eighteen holes set between hills and sea, and it hosts the territory's open championship every year. Mist Hill Forest Park protects a large stand of old broadleaf forest and mountain streams, and its trails climb to the summit for views over Sky River Bay and the distant Maslin Range. The East Coast Highway runs through the district, one way through Silver Beach to Sky Terrace and the other to East Camp in Maslin Mountain. Shops are boutiques, galleries, restaurants and wine bars, with no big malls, and the pace is unhurried. Most residents speak Chinese at home, and the neighbourhoods are quiet and safe. Mist Hill is the calm, refined side of Skytown and one of the best places on the island to retire or convalesce.
- id: div_da3s38
  subtype: locality
  parent: div_fbfqv9
  status: canon
  names:
    zh: 萨科勒市
    en: Sakole City
    art-x-viking: Sakole auf Hea
    art-x-buckham: Sakole en Teatu
  codes:
    admin: '900900'
    unlocode: NV SKL
  population: 900000
  area_km2: 6000.0
  color: '#8E7CC3'
  emblem:
    motif: gear
    pattern: hex
  traits: { industries: [manufacturing, mining, logistics], heritage: buckham, age: young }
  notes:
    zh: 北维京岛南部的工业城市，领地建立之初从原马斯林山市析出设市，城市名在巴克汉姆语中意为「萨科之地」。全市的经济以制造业为主：铁岗区的先进制造产业园集中了机械装备、电子元件、新能源设备和船舶配件工厂，是全岛最大的工业基地；铁岗山一带的铁矿和石料开采历史悠久，如今规模缩小，转向精深加工；罗卡区的公路货运站和仓储园区把工厂的产品运往维京港、贝克勒和全岛各地。萨科区是城市的发祥地和市政中心，萨科渔港、萨科鱼市和萨科老镇广场保留着巴克汉姆渔镇的风貌。萨科勒的工厂吸引了大量来自新城和本岛各地的年轻工人，劳动年龄人口比例很高，城市充满活力。巴克汉姆语是全市过半居民的母语，街名、商店招牌和学校课程都使用巴克汉姆语和中文双语。环北维京岛高速、南岸公路和东岸公路在市内交会，维贝铁路在铁岗区的萨科勒站停靠。萨科勒以务实、勤劳的工业传统和地道的巴克汉姆风情著称，是本岛南部的经济引擎。
    en: An industrial city in the south of North Viking Island, carved out of the old Maslin Mountain City when the territory was founded; in Buckham its name means "the land of Sako". Manufacturing drives the economy. The Iron Knoll Advanced Manufacturing Park gathers makers of machinery, electronic components, clean-energy equipment and ship parts and is the largest industrial base on the island. Iron ore and stone have long been dug around Iron Knoll; the mines are smaller now and have moved into higher-value processing. The road freight terminal and warehouse parks of Rocca carry the factories' goods to Viking Port, Beckerle and the rest of the island. Sako is where the city began and its civic centre, and Sako Fishing Harbour, the fish market and the old town square keep the look of a Buckham fishing town. Sakole's factories have drawn many young workers from New City and across the island, so the share of working-age adults is high and the city feels energetic. Buckham is the first language of more than half the people, and street names, shop signs and school lessons are in Buckham and Chinese. The ring expressway and the South Coast and East Coast highways meet in the city, and the Viking Port–Beckerle Railway stops at Sakole Station in Iron Knoll. Sakole is known for its practical, hard-working industrial tradition and its genuine Buckham character, and it is the economic engine of the south of the island.
- id: div_6byxb5
  subtype: borough
  parent: div_da3s38
  status: canon
  names:
    zh: 铁岗区
    en: Iron Knoll District
    art-x-viking: Eisenhügel
    art-x-buckham: Colle Ferro
  codes:
    admin: '900901'
  population: 380000
  area_km2: 2240.0
  traits: { industries: [manufacturing, mining] }
  notes:
    zh: 区名得自岗地上曾经出产的铁矿，是萨科勒市的工业核心。铁岗山的露天矿坑和竖井曾是全岛最主要的铁矿来源，矿石经铁路运往港口出口；矿藏逐渐采尽后，矿区转型为工业区，铁岗先进制造产业园在旧矿区周围铺开，集中了机床、工程机械、电子元件、风电与储能设备、船舶配件等数百家企业，是北维京岛最大的制造业基地。部分矿山仍在开采石料和建筑骨料，规模已大为缩小。铁岗矿业博物馆利用旧矿井和选矿厂改建，游客可以乘坐矿车深入地下巷道，了解矿工的生活与采矿技术的演变。萨科勒职业技术学院与产业园紧密合作，培养机械、电气和自动化技术工人，毕业生大多直接进入园区工作。东岸公路从这里出发，向东北经天台、银滩通往岚山和东营。区内居民以年轻工人家庭为主，劳动年龄人口比例全市最高，巴克汉姆语和中文并用。工厂的轮班让街区昼夜都有人气，社区里有许多工人食堂、职工宿舍和体育场。铁岗是萨科勒从矿业走向现代制造业的缩影。
    en: Named after the iron ore once dug from its knoll, Iron Knoll is Sakole's industrial core. The open pits and shafts of Iron Knoll were once the island's main source of iron ore, which went by rail to the port for export. As the deposits ran out, the mining area turned into an industrial zone. The Iron Knoll Advanced Manufacturing Park now spreads around the old workings, with hundreds of firms making machine tools, construction machinery, electronic components, wind-power and storage equipment and ship parts, the largest manufacturing base on North Viking Island. Some pits still produce stone and aggregate, on a much smaller scale. The Iron Knoll Mining Museum, built in an old shaft and dressing plant, takes visitors underground in mine cars to learn about miners' lives and how mining changed. Sakole Polytechnic works closely with the park to train machinists, electricians and automation technicians, and most graduates go straight to jobs there. The East Coast Highway starts here and runs north-east through Sky Terrace and Silver Beach to Mist Hill and East Camp. Residents are mostly young working families, the share of working-age adults is the highest in the city, and Buckham and Chinese are both in daily use. Factory shifts keep the streets busy day and night, and the neighbourhoods are full of works canteens, staff housing and sports grounds. Iron Knoll sums up Sakole's journey from mining to modern manufacturing.
- id: div_8m0jx4
  subtype: borough
  parent: div_da3s38
  status: canon
  names:
    zh: 萨科区
    en: Sako District
    art-x-viking: Sako
    art-x-buckham: Sako
  codes:
    admin: '900902'
  population: 320000
  area_km2: 2480.0
  traits: { industries: [commerce, heritage, fishing], age: balanced }
  notes:
    zh: 原萨科镇，城市名萨科勒在巴克汉姆语中意为「萨科之地」，这里是全市的发祥地和行政中心。萨科镇原是萨科湾畔的巴克汉姆渔镇，彩色的石屋沿港湾排开，萨科渔港至今仍是本岛南部最繁忙的渔港之一，渔船每天清晨把鳕鱼、鲭鱼和贝类送到萨科鱼市，鱼市旁的小餐馆以巴克汉姆风味的海鲜汤闻名。萨科老镇广场是城市的心脏，广场周围是旧市政厅、钟楼和石砌教堂，萨科勒市人民政府和主要商业街也集中在老镇附近。区内的商贸和服务业发达，商场、银行和餐馆为全市居民服务；文化遗产与旅游业也日益兴旺，老镇的巴克汉姆传统节庆、手工艺作坊和海港风光吸引着全岛游客。南岸公路从区内穿过，西接罗卡和新城，东通贝克勒。萨科湾和萨科角是区里的海岸景观，内陆的萨科山口是登山者喜爱的去处。居民大多以巴克汉姆语为母语，老镇里人们见面用巴克汉姆语问候，传统音乐和舞蹈代代相传。萨科区是萨科勒巴克汉姆文化的根，也是全市最有烟火气的地方。
    en: The former town of Sako; in Buckham the city's name Sakole means "the land of Sako", and this is where the city began and where it is governed. Sako was a Buckham fishing town on Sako Bay, its coloured stone houses lining the harbour, and Sako Fishing Harbour is still one of the busiest fishing ports in the south of the island; every dawn the boats land cod, mackerel and shellfish at the Sako Fish Market, and the little restaurants beside it are known for their Buckham fish soup. Sako Old Town Square is the heart of the city, framed by the old town hall, the clock tower and the stone church, and the city government and main shopping streets are close by. Trade and services thrive, with shops, banks and restaurants serving the whole city, and heritage and tourism are growing too, as the old town's Buckham festivals, craft workshops and harbour views draw visitors from across the island. The South Coast Highway runs through the district, west to Rocca and New City and east to Beckerle. Sako Bay and Cape Sako give the district its coastline, and inland the Sako Pass is a favourite with walkers. Most residents speak Buckham as their first language; in the old town people greet each other in Buckham, and traditional music and dance pass from one generation to the next. Sako is the root of Sakole's Buckham culture and its most lived-in, homely quarter.
- id: div_8njcs3
  subtype: borough
  parent: div_da3s38
  status: canon
  names:
    zh: 罗卡区
    en: Rocca District
    art-x-viking: Felsburg
    art-x-buckham: Rocca
  codes:
    admin: '900903'
  population: 200000
  area_km2: 1280.0
  traits: { industries: [logistics, manufacturing] }
  notes:
    zh: 巴克汉姆语意为「岩堡」，得名于海边一座形如城堡的岩丘，是萨科勒市的物流与仓储区。罗卡公路货运站是本岛南部最大的公路货运枢纽，萨科勒工厂生产的机械、电子和船舶配件在这里集装分拨，经南岸公路和环岛高速运往维京港、贝克勒保税港和全岛各地；周边的仓储园区、冷链中心和配送中心为新城和萨科勒的商店供货。区内还有不少为铁岗产业园配套的零部件、包装和金属加工厂，物流与制造相互依存，吸引了大量年轻工人和卡车司机。岩堡公园围绕那座海边岩丘而建，岩丘上的观景台可以眺望萨科湾和来往的船只，岩丘脚下的海滩是附近居民夏季游泳的地方。南岸公路纵贯全区，西接南驿和新城，东通萨科和贝克勒，货车和通勤车流昼夜不息。罗卡区面积不大，人口约二十万，以巴克汉姆语和中文为母语的居民混居，年轻家庭多，社区里有新建的学校和体育场。罗卡是萨科勒工业的「后勤基地」，也是全市交通最繁忙的地方。
    en: Rocca means "rock fort" in Buckham, after a castle-shaped knoll of rock by the sea, and it is Sakole's logistics and warehouse district. The Rocca Road Freight Terminal is the largest road freight hub in the south of the island. Machinery, electronics and ship parts from the Sakole factories are consolidated and dispatched here, travelling by the South Coast Highway and the ring expressway to Viking Port, the Beckerle bonded port and the rest of the island, while the surrounding warehouse parks, cold stores and distribution centres stock the shops of New City and Sakole. There are also many parts, packaging and metalworking plants serving the Iron Knoll park, so logistics and manufacturing depend on each other and draw young workers and lorry drivers in large numbers. Rocca Park is built around the seaside knoll; its viewpoint looks out over Sako Bay and the passing ships, and the beach below is where local people swim in summer. The South Coast Highway runs the length of the district, west to South Post and New City and east to Sako and Beckerle, and lorries and commuters stream along it day and night. Rocca is small, with about two hundred thousand people; Buckham- and Chinese-speaking residents live side by side, young families are many, and the neighbourhoods have new schools and sports grounds. Rocca is the supply base of Sakole's industry and the city's busiest place for traffic.
- id: div_k4hg7b
  subtype: locality
  parent: div_fbfqv9
  status: canon
  names:
    zh: 贝克勒自由贸易区
    en: Beckerle Free Trade Zone
    art-x-viking: Beckerle Frei auf Hea
    art-x-buckham: Beckerle Libre en Teatu
  codes:
    admin: '901000'
    unlocode: NV BKL
  population: 950000
  area_km2: 992.0
  color: '#E5534B'
  emblem:
    motif: exchange
    pattern: diagonal
  traits: { industries: [trade, finance, port, aviation], heritage: global, age: balanced, income: 1.2 }
  notes:
    zh: 北维京岛南端的自由贸易试验区，领地建立之初从原马斯林山市析出设立，实行全领地最自由的经济政策：货物进出免征关税，资本自由流动，企业注册和外籍人员居留手续极其简便，税率很低。贝克勒面积不到一千平方公里，却聚集了近百万人口，是全岛人口最密集、人均产出最高的地方。区内分为四个功能区：卡波区以卡波国际机场为核心，承担海陆空联运和旅客通道；镜湾区是离岸金融、贸易结算和企业总部聚集地，镜湾国际金融中心和贝克勒国际商品交易所是全领地的金融高地；燕礁区以保税仓储和加工贸易为主；保税港区则是镜湾外填海建成的集装箱码头和转口加工区。自由的政策吸引了来自世界各地的企业和人才，区内中文、维京语、巴克汉姆语和英语并用，英语使用比例全领地最高，国际学校、外资银行和各国餐厅随处可见。环北维京岛高速和南岸公路在这里交会，维贝铁路以贝克勒站为终点，贝马铁路从这里出发通往天城和马斯林山。贝克勒是北维京岛连接世界的窗口，也是领地经济最活跃的地方。
    en: A free trade zone at the southern tip of North Viking Island, carved out of the old Maslin Mountain City when the territory was founded and given the freest economic rules in the territory. Goods come and go free of duty, capital moves freely, registering a company or a foreign resident is remarkably simple, and taxes are low. Beckerle covers less than a thousand square kilometres yet holds nearly a million people, the most densely settled place on the island and the one with the highest output per head. It has four districts. Capo is built around Capo International Airport and handles sea–land–air transfers and passengers. Mirror Bay gathers offshore finance, trade settlement and head offices, and the Mirror Bay International Finance Centre and the Beckerle International Commodity Exchange are the territory's financial high ground. Swallow Reef specialises in bonded warehousing and processing trade, and the Bonded Port Zone is a container terminal and re-export processing area on land reclaimed outside Mirror Bay. Its free rules draw companies and talent from all over the world; Chinese, Viking, Buckham and English are all in use, English more than anywhere else in the territory, and international schools, foreign banks and restaurants from every country are everywhere. The ring expressway and the South Coast Highway meet here, the Viking Port–Beckerle Railway ends at Beckerle Station, and the Beckerle–Maslin Mountain Railway starts here for Skytown and Maslin Mountain. Beckerle is North Viking Island's window on the world and the most dynamic part of the territory's economy.
  special_status: free_trade_zone
- id: div_e6pc44
  subtype: borough
  parent: div_k4hg7b
  status: canon
  names:
    zh: 卡波区
    en: Capo District
    art-x-viking: Kap
    art-x-buckham: Capo
  codes:
    admin: '901001'
  population: 280000
  area_km2: 304.0
  traits: { industries: [aviation, logistics, trade], heritage: buckham }
  notes:
    zh: 巴克汉姆语意为「海角」，位于卡波角一带，是贝克勒自由贸易区的空港与联运枢纽。卡波国际机场是北维京岛最繁忙的国际航空货运机场，货运航班把电子产品、精密仪器、生鲜食品和快递包裹运往世界各地，机场旁的海关监管区实行「一次申报、一次查验」，货物可以在海运、陆运和空运之间快速转运；客运航站楼则是外国商务旅客进入贝克勒的主要门户。航空物流、货运代理、飞机维修和机场服务是区里最大的产业，许多国际物流公司在此设立区域枢纽。贝克勒国际医院是全领地设备最先进的医院之一，接待来自全岛和海外的病人。南岸公路从区内穿过，西接萨科，东通镜湾和保税港区。区里的居民以巴克汉姆语为母语的老住户和来自各地的航空、物流从业者为主，多种语言并用。卡波角上的灯塔和海崖步道可以眺望卡波湾的船只和起降的飞机，是区里最受欢迎的观景点。卡波区节奏快、效率高，是贝克勒连接世界的空中桥梁。
    en: "Capo means \"cape\" in Buckham. Lying around Cape Capo, it is the Beckerle Free Trade Zone's airport and transfer hub. Capo International Airport is the busiest international air-cargo airport on North Viking Island: freighters carry electronics, precision instruments, fresh food and parcels around the world, and in the bonded customs area next to the airport goods are declared and inspected once and can switch quickly between sea, road and air. The passenger terminal is the main gateway for foreign business travellers coming to Beckerle. Air logistics, freight forwarding, aircraft maintenance and airport services are the district's biggest trades, and many international logistics companies run their regional hubs here. Beckerle International Hospital is one of the best-equipped hospitals in the territory and takes patients from across the island and overseas. The South Coast Highway runs through the district, west to Sako and east to Mirror Bay and the Bonded Port Zone. Residents are a mix of long-settled Buckham-speaking families and aviation and logistics workers from everywhere, and many languages are spoken. The lighthouse and clifftop path on Cape Capo look out over the ships in Capo Bay and the aircraft coming and going, the district's favourite viewpoint. Fast-moving and efficient, Capo is Beckerle's bridge to the world through the air."
- id: div_8p9k5t
  subtype: borough
  parent: div_k4hg7b
  status: canon
  names:
    zh: 镜湾区
    en: Mirror Bay District
    art-x-viking: Spiegelbucht
    art-x-buckham: Baia Specchio
  codes:
    admin: '901002'
  population: 330000
  area_km2: 306.0
  traits: { industries: [finance, trade, commerce] }
  notes:
    zh: 湾内水面平静如镜，区名由此而来，是贝克勒自由贸易区的金融与行政中心，也是全领地人均产出最高的区。镜湾国际金融中心的双塔矗立在湾畔，周围聚集了离岸银行、财富管理公司、保险、再保险和航运金融机构，许多跨国企业的区域总部和结算中心设在这里；贝克勒国际商品交易所进行金属、粮食和能源期货交易，是领地最重要的大宗商品定价中心。贝克勒自由贸易区管理委员会负责区内的政策制定和企业服务，企业注册、外汇结算和签证都可以在一站式服务中心办理。镜湾港停靠游艇和高速客轮，镜湾滨海公园沿湾岸修建了长廊、草坪和露天剧场，是金融从业者午休和周末散步的地方。湾顶的镜岛与铁岬隔着镜岛水道相望，风平浪静时岛影倒映在湾面上。南岸公路从区内经过，西接卡波，东通保税港区和燕礁。区内居民来自世界各地，中文、维京语、巴克汉姆语和英语都很常见，国际学校和外国人社区集中。镜湾高楼林立、夜景璀璨，是北维京岛最国际化的城区。
    en: The water of the bay lies as still as a mirror, which gives the district its name. It is the financial and administrative centre of the Beckerle Free Trade Zone and the district with the highest output per head in the territory. The twin towers of the Mirror Bay International Finance Centre stand on the shore, surrounded by offshore banks, wealth managers, insurers, reinsurers and shipping financiers, and many multinationals run their regional head offices and settlement centres here. The Beckerle International Commodity Exchange trades metal, grain and energy futures and is the territory's most important price-setter for commodities. The Free Trade Zone Administration sets policy and serves companies, and registration, foreign-exchange settlement and visas can all be handled at a one-stop service centre. Mirror Bay Port takes yachts and fast ferries, and Mirror Bay Waterfront Park runs a promenade, lawns and an open-air theatre along the shore where finance workers spend their lunch breaks and weekends. Mirror Isle lies at the head of the bay, facing Iron Point across Mirror Sound, and on calm days its reflection lies on the water. The South Coast Highway passes through, west to Capo and east to the Bonded Port Zone and Swallow Reef. Residents come from all over the world; Chinese, Viking, Buckham and English are all common, and international schools and expatriate neighbourhoods are concentrated here. With its forest of towers and brilliant night skyline, Mirror Bay is the most international quarter of North Viking Island.
- id: div_ts5cw5
  subtype: borough
  parent: div_k4hg7b
  status: canon
  names:
    zh: 燕礁区
    en: Swallow Reef District
    art-x-viking: Schwalbenriff
    art-x-buckham: Scoglio Rondine
  codes:
    admin: '901003'
  population: 260000
  area_km2: 272.0
  traits: { industries: [trade, manufacturing, logistics], heritage: buckham }
  notes:
    zh: 包括贝克勒东南的离岛和海燕栖息的礁群，区名由此而来，是自由贸易区的保税仓储与加工贸易基地。燕礁保税物流园是全岛最大的保税仓库群，进口的原材料、零部件和消费品可以在园内免税存储、分拣、包装和再出口；园区周围的加工贸易工厂把进口零部件组装成电子产品、医疗器械和精密仪器，再经保税港区和卡波机场运往海外，加工贸易与物流是区里的主要产业。燕礁湾里的离岛和礁石是海燕和燕鸥的繁殖地，每年春夏数以万计的海鸟在礁上筑巢，部分岛礁划为保护区，乘船观鸟是区里独特的旅游项目。燕礁湾和燕尾角构成区里曲折的海岸线。南岸公路的终点就在区内，向西经保税港区、镜湾和卡波通往萨科勒和新城。区里的居民以巴克汉姆语为母语的老渔民家庭和在工厂、仓库工作的年轻人为主，劳动年龄人口比例高。燕礁将繁忙的保税工业和宁静的海鸟礁群结合在一起，是贝克勒最有特色的区。
    en: "Taking in the islets south-east of Beckerle and the reefs where storm petrels nest, which give it its name, Swallow Reef is the free trade zone's base for bonded warehousing and processing trade. The Swallow Reef Bonded Logistics Park is the largest group of bonded warehouses on the island: imported raw materials, parts and consumer goods can be stored, sorted, packed and re-exported here free of duty. Around the park, processing plants assemble imported parts into electronics, medical devices and precision instruments, which leave through the Bonded Port Zone and Capo airport for overseas markets, so processing trade and logistics are the district's main business. The islets and rocks of Swallow Reef Bay are breeding grounds for petrels and terns; every spring and summer tens of thousands of seabirds nest on the reefs, some of which are protected, and birdwatching by boat is the district's own kind of tourism. Swallow Reef Bay and Swallowtail Point make up its winding coastline. The South Coast Highway ends in the district and runs west through the Bonded Port Zone, Mirror Bay and Capo to Sakole and New City. Residents are mostly long-established Buckham-speaking fishing families and young people working in the factories and warehouses, with a high share of working-age adults. Swallow Reef sets busy bonded industry beside quiet seabird reefs, and it is Beckerle's most distinctive district."
- id: div_f9x3wn
  subtype: borough
  parent: div_k4hg7b
  status: generated
  names:
    zh: 保税港区
    en: Bonded Port Zone
    art-x-viking: Freihafen
    art-x-buckham: Porto Franco
  codes:
    admin: '901004'
  population: 80000
  area_km2: 110.0
  traits: { industries: [port, trade, logistics] }
  notes:
    zh: 镜湾外填海建成的保税港区，是贝克勒自由贸易区面积最小的区，也是领地最开放的港口。港区内建有深水集装箱码头、滚装码头和保税仓储区，大型集装箱船可以直接靠泊，货物进出不征关税，转口货物可以在港内拆拼、加工后再出口，通关时间以小时计。转口贸易、集装箱运输和保税加工是港区的全部经济，码头作业实行全天候自动化，远程控制的岸桥和无人驾驶的集卡日夜运转，使这里成为全岛装卸效率最高的港口。港区常住人口只有约八万，多是港口工程师、报关员、船员和物流公司职员，劳动年龄人口占绝大多数，居住区集中在港区西侧的人工岛上，配有学校、医院和商业中心。南岸公路从港区经过，西接镜湾，东通燕礁，集装箱卡车经这条路把货物运往全岛；海上航线则连接维京港、维京群岛和世界各大港口。区内中文、巴克汉姆语和英语并用，国际船员服务中心和海员俱乐部是港区特色。保税港区是贝克勒自由贸易政策最直接的体现，也是北维京岛面向远洋的门户。
    en: The bonded port built on land reclaimed outside Mirror Bay, the smallest district of the Beckerle Free Trade Zone and the most open port in the territory. It has deep-water container berths, ro-ro berths and bonded storage; the largest container ships can berth directly, goods come and go free of duty, transit cargo can be broken down, consolidated or processed in the port and re-exported, and customs clearance is measured in hours. Re-export trade, container shipping and bonded processing are the port's whole economy. The terminals are automated around the clock, with remote-controlled cranes and driverless trucks working day and night, making it the most efficient port on the island. Only about eighty thousand people live here, mostly port engineers, customs brokers, seafarers and logistics staff, so working-age adults are the great majority; housing is grouped on an artificial island on the west side of the port, with schools, a hospital and a shopping centre. The South Coast Highway passes through, west to Mirror Bay and east to Swallow Reef, and container trucks carry goods along it to the rest of the island, while sea routes link the port with Viking Port, the Viking Islands and the world's great ports. Chinese, Buckham and English are all in use, and the international seafarers' centre and seamen's club are features of the port. The Bonded Port Zone is the most direct expression of Beckerle's free-trade rules and North Viking Island's gateway to the deep sea.
