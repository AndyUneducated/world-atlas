- id: div_nbrnfr
  subtype: locality
  parent: div_fbfqv9
  status: canon
  names:
    zh: 自由市
    en: Freedom City
    art-x-viking: Freistad auf Hea
    art-x-buckham: Frei en Teatu
  codes:
    admin: '900100'
    unlocode: NV FRD
  population: 560000
  area_km2: 17680.0
  color: '#E9B949'
  emblem:
    motif: capitol
    pattern: rays
  traits: { industries: [government, education, logistics], heritage: chinese, age: balanced }
  notes:
    zh: 北维京岛领地首府，坐落在自由河与北河之间的台地上，领地建立之初从原勒克尔市析出、按规划新建。城市因行政而生：领地政府、议会综合办公区、领地博物馆、领地图书馆和自由市大剧院围绕人民广场排开，自由塔是城中最高的建筑。全市人口只有五十多万，却集中了领地最主要的公共机构、北维京岛大学和自由市中心医院，公务员、教师和医护人员是就业的主体，物流仓储依托港口和铁路成为第二支柱。白桦区是机关与文化设施集中的核心；北河区沿北河大道和人民大道展开，是商业与住宅走廊，城北的牧场为全城供应鲜奶；沙洲区守着自由河入海口，沙洲港和老渔市延续着城市的港口传统。环北维京岛高速、自维高速、自勒高速和观星高速在城郊交会，自由市机场、维西城际铁路和自勒城际铁路把首府同维京港、勒克尔和西北市连在一起。居民大多以中文为母语，维京语和巴克汉姆语在街头也很常见；街道宽阔，绿地成片，生活节奏平稳，是全岛最安静的城市之一。
    en: Capital of the Territory of North Viking Island, laid out on the terrace between the Freedom River and the North River. It was carved out of the old Lekor City when the territory was founded and built to a plan, and government is its reason for being. The territorial government, the Parliament Complex, the Territorial Museum, the Territorial Library and the Grand Theatre stand around People's Square, and Liberty Tower is the tallest building in town. With little more than half a million people, the city still holds most of the territory's public institutions, the University of North Viking Island and the Central Hospital; civil servants, teachers and health workers make up much of the workforce, and logistics around the port and the railways comes second. Birchwood is the core of offices and culture. North River runs along North River Avenue and People's Avenue as a corridor of shops and homes, with dairy farms on its northern edge. Sandbar guards the mouth of the Freedom River, where Sandbar Port and the old fish market keep a harbour tradition alive. The ring expressway and the expressways to Viking Port, Lekor and the Stargazer corridor meet on the outskirts, and Freedom City Airport and two intercity railways tie the capital to Viking Port, Lekor and Northwest City. Most residents grew up speaking Chinese, though Viking and Buckham are common on the street. Broad avenues, open green space and an even pace make it one of the quietest cities on the island.
- id: div_16cxr8
  subtype: borough
  parent: div_nbrnfr
  status: canon
  names:
    zh: 白桦区
    en: Birchwood District
    art-x-viking: Birkenwald
    art-x-buckham: Betulla
  codes:
    admin: '900101'
  population: 320000
  area_km2: 5760.0
  traits: { industries: [government, finance, healthcare] }
  notes:
    zh: 自由市的行政与文化核心，建在两河之间长满白桦的台地上，区名由此而来。领地政府、议会综合办公区和自由市政厅都在区内，人民广场是全领地举行庆典和集会的地方，广场四周依次排开领地博物馆、领地图书馆和自由市大剧院，自由塔在广场东侧拔地而起，登顶可以望见两条河流和远处的贝格兰丘陵。北维京岛大学的主校区和自由市中心医院也设在这里，因此区里的居民以公务员、教师、医护人员和学生为主，金融机构则围绕领地政府设立分支，管理领地的财政与公共基金。自由市体育中心承办全领地的运动会，自由市机场位于台地边缘，主要飞往维京港、天城和马斯林山。观星高速从区内穿过，向西通往维京港，向东经林道、望星直达科学城；北河公路连接沙洲与北河两区。区内道路按棋盘格规划，主干道两旁种着成排的白桦，机关大院之间穿插着社区公园。这里人口不到全市的六成，却承担了首府的大部分职能，白天上班人潮涌入，夜晚则安静下来。
    en: The administrative and cultural core of Freedom City, built on a birch-covered terrace between the two rivers, which gives the district its name. The territorial government, the Parliament Complex and Freedom City Hall are all here. People's Square, where the territory holds its ceremonies and rallies, is lined by the Territorial Museum, the Territorial Library and the Grand Theatre, and Liberty Tower rises on its east side; from the top you can see both rivers and the Bergland Hills beyond. The main campus of the University of North Viking Island and the Central Hospital are also in the district, so most residents are civil servants, teachers, health workers and students, while banks keep branches next to the government to handle the territory's finances and public funds. The Freedom City Sports Centre hosts the territorial games, and Freedom City Airport, on the edge of the terrace, flies mainly to Viking Port, Skytown and Maslin Mountain. The Stargazer Expressway crosses the district, running west to Viking Port and east through Lindau and Stargaze to Science City, while the North River Highway links Sandbar and North River. Streets follow a grid, the main avenues are lined with birches, and neighbourhood parks sit between the government compounds. Fewer than six in ten of the city's people live here, yet it carries most of the capital's work; it fills with commuters by day and falls quiet at night.
- id: div_b1dx32
  subtype: borough
  parent: div_nbrnfr
  status: canon
  names:
    zh: 北河区
    en: North River District
    art-x-viking: Nordfluss
    art-x-buckham: Rivo Nord
  codes:
    admin: '900102'
  population: 150000
  area_km2: 4640.0
  traits: { industries: [commerce, residential, dairy] }
  notes:
    zh: 自由市北部沿北河展开的商住区，北河大道和人民大道两条林荫干道贯穿全区，沿线是成片的住宅小区、商场和社区服务中心，首府的大部分日常消费都发生在这里。北河市场是全市最大的综合市场，周末有来自北部牧场的奶酪、黄油和时令蔬菜，也是外地游客品尝本地乳制品的去处。区的北半部仍是开阔的草场和奶牛场，乳业合作社为首府和维京港供应鲜奶，形成城乡交错的景观。自勒城际铁路在区内设站，直通勒克尔，北河公路向北经西诺、丰谷通往勒北，承担着农产品进城的运输。居民以在白桦区上班的公务员家庭和本地商户为主，人口结构比全市略年轻，学校、托育和社区医院配套齐全。区内建筑多为四到六层的公寓和联排住宅，很少高楼，北河两岸修有滨河步道和自行车道，夏夜常有露天集市。与白桦区的机关气氛不同，北河区更像首府的生活后院，热闹而不拥挤，是许多家庭选择安家的地方。
    en: "The shopping and residential district of northern Freedom City, strung along the North River. North River Avenue and People's Avenue, both tree-lined, run its length past housing estates, shopping centres and community service centres, and most of the capital's everyday spending happens here. North River Market is the largest general market in town; at weekends it fills with cheese, butter and seasonal vegetables from the northern farms, and visitors come to taste the local dairy. The northern half of the district is still open grassland and dairy farms, and the dairy co-operatives supply fresh milk to the capital and to Viking Port, so town and country interlock. The Freedom City–Lekor Intercity Railway stops here on its way to Lekor, and the North River Highway runs north through Ino and Harvest Vale to Lekor North, carrying farm produce into town. Residents are mostly families of civil servants who work in Birchwood and local shopkeepers, a little younger than the city as a whole, with schools, childcare and community clinics close at hand. Buildings are mostly four- to six-storey flats and terraces, with few towers, and riverside walks and cycle paths run along both banks, where open-air markets set up on summer evenings. Where Birchwood feels official, North River is the capital's lived-in back garden: lively but never crowded, and a favourite place for families to settle."
- id: div_g4a8q0
  subtype: borough
  parent: div_nbrnfr
  status: canon
  names:
    zh: 沙洲区
    en: Sandbar District
    art-x-viking: Sandbank
    art-x-buckham: Banco Sabbia
  codes:
    admin: '900103'
  population: 90000
  area_km2: 7280.0
  traits: { industries: [port, logistics, fishing], heritage: mixed }
  notes:
    zh: 自由河入海口的冲积沙洲，自由市唯一临海的区，也是首府的港口门户。沙洲港是一座中型港口，承担首府的散货、建材与燃料进口，旁边的物流园为城区和北部农牧区中转货物；维西城际铁路在沙洲站停靠，使这里成为铁路与海运的交汇点。区里最古老的地方是沙洲老渔市，木构的鱼棚沿码头排开，清晨渔船靠岸后就开始叫卖鳕鱼、鲱鱼和贝类；老渔市旁边的沙洲钟楼是港区的地标，钟声曾为出海的渔民报时。沙洲公园建在河口的沙丘上，可以观看候鸟和潮水涨落。由于渔港比首府更早存在，这里的居民中维京语和中文并用的家庭比例明显高于城区，港口工人、渔民和物流从业者构成了社区的主体。区内地势低平，大片土地仍是湿地和沙丘，人口只有约九万，是全市密度最低的区。北河公路从区内经过，向南穿过贝格兰丘陵通往维京港。沙洲区以朴素的港口生活和海鲜闻名，周末常有首府居民来这里吃海鲜、看日落。
    en: "The alluvial sandbars at the mouth of the Freedom River: Freedom City's only district on the sea and the capital's harbour gateway. Sandbar Port is a mid-sized port that brings in bulk cargo, building materials and fuel for the capital, and the logistics park next to it moves goods on to the city and the farmland to the north. The Viking Port–Northwest Intercity Railway stops at Sandbar Station, so rail and shipping meet here. The oldest corner of the district is the Sandbar Old Fish Market, a row of timber fish sheds along the quay where cod, herring and shellfish go on sale as soon as the boats come in at dawn. The Sandbar Clock Tower beside it is the landmark of the waterfront, and its bell once kept time for fishermen heading out to sea. Sandbar Park sits on the dunes of the estuary, a place to watch migrating birds and the turn of the tide. The fishing harbour is older than the capital, so far more households here speak both Viking and Chinese than in the city proper, and dockers, fishermen and logistics workers make up most of the community. The land is low and flat, much of it still wetland and dunes, and with only about ninety thousand people it is the most thinly settled district in the city. The North River Highway passes through on its way south across the Bergland Hills to Viking Port. Sandbar is known for its plain harbour life and its seafood, and people from the capital come at weekends to eat by the water and watch the sunset."
- id: div_m41gwn
  subtype: locality
  parent: div_fbfqv9
  status: canon
  names:
    zh: 维京港市
    en: Viking Port City
    art-x-viking: Veiling Havn auf Hea
    art-x-buckham: Veiling Porto en Teatu
  codes:
    admin: '900200'
    unlocode: NV VKP
  population: 3100000
  area_km2: 12320.0
  color: '#4C8BF5'
  emblem:
    motif: longship
    pattern: waves
  traits: { industries: [port, finance, manufacturing, tourism], heritage: viking, age: balanced }
  notes:
    zh: 北维京岛最早建成的城市，坐落在维京岛西岸，至今仍是领地人口最多的城市、经济中心和最大的港口。城市起源于鲸湾畔的捕鲸站和斯坦堡的维京石垒，维京语至今是一半居民的母语，街名、商号与节庆都带着浓厚的北方色彩。港口是城市的命脉：瓦尔维克区的鲸湾港与外礁深水港承担领地大部分集装箱与散货运输，临港带布满船舶修造、冷链和机械制造工厂，维京港国际机场也设在这里；菲尔内斯区的客运码头迎送渡轮与邮轮旅客；海门区沿西岸兴起的商务带聚集了银行、保险与软件企业，海门国际金融中心是领地的金融地标。斯坦堡区的石砌老城保留着窄街与市集，是游客必到之处；奥斯特海姆区是东部成片的新住宅区；贝格兰区则是丘陵上的森林公园与低密度住宅。环北维京岛高速、自维高速、观星高速和西岸公路在这里汇合，维西城际铁路北上自由市和西北市，维贝铁路南下贝克勒；维长高速和维长城际铁路经海底隧道直通维京群岛的长船市。
    en: The first city built on North Viking Island, on the island's west coast, and still the territory's largest city, its economic centre and its biggest port. It grew from a whaling station on Whale Bay and the Viking stone fort at Steinburg; Viking is still the first language of about half its people, and street names, shop signs and festivals all have a strong northern flavour. The port is the city's lifeblood. In Walvik, Walvik Harbour and the Outer Skerry Deep-Water Port handle most of the territory's containers and bulk cargo, the waterfront is lined with ship repair yards, cold stores and machinery plants, and Viking Port International Airport sits nearby. The ferry terminal in Fyrnes serves ferry and cruise passengers, and in Seagate a business belt along the west shore gathers banks, insurers and software companies around the Seagate International Finance Centre, the territory's financial landmark. Steinburg's stone-built old town keeps its narrow lanes and markets and draws every visitor; Osterheim is a spread of newer housing to the east, and Bergland is forest park and scattered homes in the hills. The ring expressway, the Freedom–Viking Port and Stargazer expressways and the West Coast Highway all meet here. Intercity trains run north to Freedom City and Northwest City and south to Beckerle, and the Viking Port–Longship expressway and railway run through the undersea tunnel straight to Longship in the Viking Islands.
- id: div_z29w6h
  subtype: borough
  parent: div_m41gwn
  status: canon
  names:
    zh: 瓦尔维克区
    en: Walvik District
    art-x-viking: Walvik
    art-x-buckham: Baia Balena
  codes:
    admin: '900201'
  population: 1020000
  area_km2: 2600.0
  traits: { industries: [port, logistics, manufacturing] }
  notes:
    zh: 维京语意为「鲸湾」，旧时捕鲸站所在的海湾，如今是维京港市人口最多的区和领地最大的港区。鲸湾港沿湾岸排开集装箱、散货和滚装码头，湾口外的外礁深水港可停靠最大的远洋货轮，两港合起来承担领地大部分进出口货物。临港产业带布满船舶修理厂、冷链仓库、机械与电气设备工厂，港口、物流和制造业养活了区里的大部分家庭。维京港国际机场建在湾北的平地上，是领地最繁忙的机场，也是飞往维京群岛和远方的主要门户。维京港市政厅和中央广场位于区中心，鲸湾捕鲸站博物馆保留着旧捕鲸站的砖砌炼油房、绞盘和捕鲸船，讲述城市的起源；维京港体育场是全领地最大的球场。观星高速与西岸公路在区内交会，维长高速与维长城际铁路从这里进入海底隧道，向东南直达长船市。区内老港工住宅与新建公寓并存，维京语在码头和市场上最常听到，港口夜班让这里成为全岛少有的不夜之地。
    en: Walvik means "whale bay" in Viking. The bay where the old whaling station stood is now the most populous district of Viking Port and the territory's largest port area. Walvik Harbour lines the bay with container, bulk and ro-ro berths, and the Outer Skerry Deep-Water Port beyond the bay mouth takes the largest ocean freighters; between them they handle most of the territory's imports and exports. The waterfront industrial belt is packed with ship repair yards, cold stores and machinery and electrical plants, and the port, logistics and manufacturing support most households in the district. Viking Port International Airport, on flat land north of the bay, is the territory's busiest airport and its main gateway to the Viking Islands and further afield. Viking Port City Hall and the Central Square stand at the centre of the district. The Walvik Whaling Station Museum keeps the old station's brick try-works, capstans and whaleboats and tells the story of how the city began, and Viking Port Stadium is the largest ground in the territory. The Stargazer Expressway and the West Coast Highway meet here, and the Viking Port–Longship expressway and railway enter the undersea tunnel in Walvik and run south-east to Longship. Old dockworkers' housing stands beside new flats, Viking is the language heard most on the quays and in the markets, and night shifts at the port keep the district awake around the clock, a rare thing on the island.
- id: div_pkfa1g
  subtype: borough
  parent: div_m41gwn
  status: canon
  names:
    zh: 菲尔内斯区
    en: Fyrnes District
    art-x-viking: Fyrnes
    art-x-buckham: Capo Faro
  codes:
    admin: '900202'
  population: 800000
  area_km2: 2500.0
  traits: { industries: [cruise, tourism, retail] }
  notes:
    zh: 维京语意为「烽火岬」，得名于岬角上旧时为归航船只点燃的烽火。如今这里是维京港的海上客运门户：菲尔内斯客运码头有渡轮通往沙洲、萨科和维京群岛，夏季的邮轮也在此靠岸，码头旁的菲尔内斯海关大楼负责旅客与行李查验。客流带动了区里的零售与服务业，码头背后的步行街集中了免税店、海鲜餐馆、纪念品商店和酒店，夏天游客如织。菲尔内斯湾风平浪静，湾畔修有长长的滨海步道，岬角顶端仍保留着烽火台遗址，是看日落和眺望船只进出的好地方。区里的居民多在码头、酒店和商店工作，季节性明显：夏季人手紧张，冬季则安静许多，不少店铺歇业。西岸公路沿海岸穿过全区，北接海门区，南通瓦尔维克，向北还可一直开到西北市。区内保留了许多维京式木屋和石砌仓库，有的改成了咖啡馆和画廊，维京语招牌随处可见。菲尔内斯是许多游客对维京港的第一印象，也是本地人周末散步、吃海鲜的去处。
    en: "Fyrnes means \"beacon cape\" in Viking, after the fires once lit on the headland to guide ships home. Today it is Viking Port's passenger gateway by sea. Ferries leave the Fyrnes Ferry Terminal for Sandbar, Sako and the Viking Islands, cruise ships call in summer, and the Fyrnes Customs House next to the terminal checks passengers and luggage. The traffic feeds the district's shops and services: the pedestrian streets behind the terminal are full of duty-free shops, seafood restaurants, souvenir stalls and hotels, and crowded with visitors all summer. Fyrnes Bay is calm, a long seafront promenade runs round it, and the old beacon platform still stands on the tip of the cape, a fine place to watch the sunset and the ships coming and going. Most residents work at the terminal, in hotels and in shops, and the rhythm is seasonal: short of hands in summer, much quieter in winter, when many shops close. The West Coast Highway runs the length of the district along the shore, north to Seagate and south to Walvik, and on up the coast to Northwest City. Many Viking-style timber houses and stone warehouses survive, some turned into cafés and galleries, and Viking shop signs are everywhere. For many visitors Fyrnes is their first impression of Viking Port, and for locals it is where they come at weekends to stroll and eat seafood."
