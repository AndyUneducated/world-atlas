    zh: 东营区
    en: East Camp District
    art-x-viking: Ostlager
    art-x-buckham: Campo Est
  codes:
    admin: '901103'
  population: 21000
  area_km2: 4700.0
  traits: { industries: [defence, aviation, logistics] }
  notes:
    zh: 马斯林山东部临海的平地，是深空太空军士官学校所在地，也是全市的后勤和航空保障基地。深空太空军士官学校培养航天测控、发射保障和装备维修的士官，校园与训练场占据了区的中部；东营空军基地是全岛最重要的作战机场之一，驻有战斗机和预警机部队，东营航空修理厂负责全领地军用飞机的大修和改装。东营后勤基地储存和分发全市驻军的油料、弹药、食品和装备，马斯林河口港是全市唯一的港口，大宗物资和大型航天部件经海路运抵后，再由马斯林山航天铁路转运到西坪发射场。东岭相控阵雷达站建在东部的山岭上，是领地远程预警网络的重要节点。航空、物流和国防是区里的全部产业，居民以军人、工程师、技工和家属为主，劳动年龄人口比例很高。马斯林山空天高速从东营空军基地出发向西延伸，东岸公路的终点也在区内，向南经岚山、银滩通往天城；马斯林山航天铁路以东营站为起点。东营湾和布德岛构成区里的海岸风景。东营是马斯林山连接外界的门户，也是这座军事城市的「后勤心脏」。
    en: "The flat coastal land on the east side of Maslin Mountain, home of the Deep Space Force NCO Academy and the city's logistics and aviation support base. The academy trains non-commissioned officers in tracking, launch support and equipment maintenance, and its campus and training grounds fill the middle of the district. East Camp Air Base is one of the most important combat airfields on the island, home to fighter and early-warning units, and the East Camp Aircraft Repair Plant overhauls and upgrades military aircraft for the whole territory. The East Camp Supply Depot stores and issues fuel, ammunition, food and equipment for the garrison. Maslin Mouth Port is the city's only port: bulk supplies and large spacecraft components arrive by sea and go on to the launch site at West Heath by the Maslin Mountain Aerospace Railway. The East Ridge Phased-Array Radar Station stands on the eastern ridge and is a key node of the territory's long-range early-warning network. Aviation, logistics and defence are the whole economy, residents are mostly service members, engineers, technicians and their families, and the share of working-age adults is high. The Maslin Aerospace Expressway starts at East Camp Air Base and runs west, the East Coast Highway ends in the district and runs south through Mist Hill and Silver Beach to Skytown, and the aerospace railway starts at East Camp Station. East Camp Bay and Budey make up the district's coast. East Camp is Maslin Mountain's gateway to the outside world and the logistics heart of the military city."
