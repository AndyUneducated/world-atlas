  population: 114000
  area_km2: 2200.0
  traits: { industries: [finance, tech, commerce], heritage: mixed }
  notes:
    zh: 沿维京港西岸向北扩展形成的商务居住带，因位于入港航道的「海门」而得名。区的南端是维京港的中央商务区，海门国际金融中心是维京港最高的写字楼，周围聚集了银行、保险、航运金融和律师事务所，领地大部分企业总部也设在这里；北段是软件、数据服务和设计公司聚集的科技园，吸引了大量从大学毕业的年轻专业人士。高收入岗位使海门成为维京港人均产出最高的区，滨海一线是全市最贵的公寓和餐厅。区里居民来源多元，说中文、维京语和巴克汉姆语的家庭大致相当，国际学校和多语种社区中心随处可见。海门角伸入海中，角上的灯塔与观景平台可以眺望进出菲尔内斯湾的船只，海岸修有自行车道和沙滩。西岸公路纵贯全区，南接瓦尔维克，北经菲尔内斯通往西北市。区内建筑以玻璃幕墙写字楼和高层公寓为主，与格约特斯塔德的石屋形成鲜明对比。海门代表着维京港的现代一面，是领地商业最活跃的地方。
    en: "A belt of offices and homes that spread north along Viking Port's west shore, named for the \"sea gate\" of the harbour channel it overlooks. The southern end is Viking Port's central business district. The Seagate International Finance Centre, the tallest office tower in Viking Port, is surrounded by banks, insurers, shipping financiers and law firms, and most of the territory's company headquarters are here too. The northern stretch is a technology park of software, data-services and design firms that draws many young graduates. Well-paid jobs make Seagate the district with the highest output per head in Viking Port, and the seafront has the city's most expensive flats and restaurants. Residents come from everywhere: Chinese-, Viking- and Buckham-speaking households are roughly balanced, and international schools and multilingual community centres are easy to find. Seagate Cape juts into the sea; its lighthouse and viewing platform look out over ships entering and leaving Fyrnes Bay, and cycle paths and beaches run along the shore. The West Coast Highway runs the length of the district, south to Walvik and north through Fyrnes to Northwest City. Glass office towers and high-rise flats set the skyline, in sharp contrast with the stone houses of Grjotstad. Seagate is the modern face of Viking Port and the busiest place for business in the territory."
- id: div_7rk2mh
  subtype: borough
  parent: div_m41gwn
  status: generated
  names:
    zh: 奥斯特海姆区
    en: Osterheim District
    art-x-viking: Osterheim
    art-x-buckham: "Dimora d'Oriente"
  codes:
    admin: '900205'
  population: 72000
  area_km2: 1300.0
  traits: { industries: [residential, commerce, education], heritage: mixed, age: young }
  notes:
    zh: 维京语意为「东家园」，维京港东部成片兴建的住宅新城，承接了瓦尔维克和格约特斯塔德外溢的人口。区内按社区单元规划，每个单元都有学校、托儿所、超市和社区中心，步行十分钟即可满足日常所需，轻轨和公交线路把各社区与市中心相连。由于房价比老城和海门低，这里吸引了大量年轻家庭，儿童比例在全市最高，周末的公园和运动场总是满满当当。区里也有不少中小学、职业学校和一所大学分校，教育成了重要的就业来源，社区商业中心则汇集了超市、餐馆和电影院。观星高速从区北穿过，西连格约特斯塔德和瓦尔维克，东通自由市，许多居民每天沿这条走廊通勤上班。居民来源多样，说中文、维京语和巴克汉姆语的家庭混居，社区活动常常使用两三种语言。区内建筑以五到十层的公寓和联排住宅为主，楼间留有宽敞的绿地和雨水花园，东侧是通往菲亚尔马克丘陵的林地。奥斯特海姆没有老城的古迹，却是维京港最有活力、最年轻的区之一。
    en: Osterheim means "east home" in Viking. It is the new town of housing built on Viking Port's east side to take the people spilling out of Walvik and Grjotstad. It is planned in neighbourhood units, each with its own school, nursery, supermarket and community centre, so daily needs are a ten-minute walk away, and light rail and bus lines tie the neighbourhoods to the city centre. Homes cost less than in the old town or Seagate, so the district has drawn many young families; it has the highest share of children in the city, and the parks and playing fields are full at weekends. There are also many schools, a vocational college and a branch campus of a university, so education is a major employer, while neighbourhood centres gather supermarkets, restaurants and cinemas. The Stargazer Expressway crosses the north of the district, west to Grjotstad and Walvik and east to Freedom City, and many residents commute along it every day. Households of Chinese, Viking and Buckham speakers live side by side, and community events often run in two or three languages. Buildings are mostly five- to ten-storey flats and terraces with generous green space and rain gardens between them, and woodland to the east leads up into the Fjallmark Hills. Osterheim has none of the old town's monuments, but it is one of the liveliest and youngest districts in Viking Port.
