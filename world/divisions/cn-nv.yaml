  color: '#E9B949'
  flag: { layout: bands, colors: ['#0B3D91', '#FFFFFF', '#0B3D91'], vertical: true, ratio: [1, 2, 1], charge: star8, charge_color: '#E9B949', outline: '#0B3D91' }
  flag_notes:
    zh: "竖三色旗，深蓝、白、深蓝，宽度比为一比二比一。两道深蓝是夹着市区流过的自由河与北河，白色是两河之间建城的台地；正中的金色八角星取自领地旗，表明这里是领地首府。颜色与领地旗完全相同，市民常说自由市的旗是「把领地旗竖着折了一折」。"
    en: "A vertical triband of deep blue, white and deep blue in the proportions 1:2:1. The blue bands are the two rivers that frame the city, the white the terrace between them where it was built; the gold eight-pointed star in the centre comes from the territory flag and marks the territorial capital. The colours are exactly the territory's, and residents like to say the city flag is the territory flag folded on end."
  traits: { industries: [government, education, logistics], heritage: chinese, age: balanced }
  notes:
    zh: "北维京岛领地首府，坐落在自由河与北河之间的台地上，领地建立之初从原勒克尔市析出、按规划新建。城市因行政而生：领地政府、议会综合办公区、领地博物馆、领地图书馆和自由市大剧院围绕人民广场排开，自由塔是城中最高的建筑。全市人口只有三十八万多，却集中了领地最主要的公共机构、北维京岛大学和自由市中心医院，公务员、教师和医护人员是就业的主体，物流仓储依托港口和铁路成为第二支柱。白桦区是机关与文化设施集中的核心；北河区沿北河大道和人民大道展开，是商业与住宅走廊，城北的牧场为全城供应鲜奶；沙洲区守着自由河入海口，沙洲港和老渔市延续着城市的港口传统。环北维京岛高速、自维高速、自勒高速和观星高速在城郊交会，自由市机场、维西城际铁路和自勒城际铁路把首府同维京港、勒克尔和西北市连在一起。居民大多以中文为母语，维京语和巴克汉姆语在街头也很常见；街道宽阔，绿地成片，生活节奏平稳，是全岛最安静的城市之一。\n自由市人自称「台地人」，维京港人则爱开玩笑说首府是「下了班就关灯的城市」：傍晚六点以后，白桦区的机关大院一片安静，热闹都搬到了北河区的露天集市和沙洲的海鲜摊上。城里最有名的吃食是北河鲜奶做的奶冻和沙洲老渔市的鳕鱼浓汤，冬天买汤的队伍一直排到钟楼脚下。每届领地议会开幕时，新当选的议员都要在白桦区的议员林里亲手种下一棵白桦，树前立一块只写姓名、不写党派的小木牌，如今这片林子已经能遮住半条人民大道。秋天白桦叶黄，两河之间的台地染成一片金色，是首府一年里游客最多的时候；一月白天的最高气温只在一度上下，市民照样骑车上班，扫雪车总是先清自行车道，再清汽车道。"
    en: "Capital of the Territory of North Viking Island, laid out on the terrace between the Freedom River and the North River. It was carved out of the old Lekor City when the territory was founded and built to a plan, and government is its reason for being. The territorial government, the Parliament Complex, the Territorial Museum, the Territorial Library and the Grand Theatre stand around People's Square, and Liberty Tower is the tallest building in town. With fewer than four hundred thousand people, the city still holds most of the territory's public institutions, the University of North Viking Island and the Central Hospital; civil servants, teachers and health workers make up much of the workforce, and logistics around the port and the railways comes second. Birchwood is the core of offices and culture. North River runs along North River Avenue and People's Avenue as a corridor of shops and homes, with dairy farms on its northern edge. Sandbar guards the mouth of the Freedom River, where Sandbar Port and the old fish market keep a harbour tradition alive. The ring expressway and the expressways to Viking Port, Lekor and the Stargazer corridor meet on the outskirts, and Freedom City Airport and two intercity railways tie the capital to Viking Port, Lekor and Northwest City. Most residents grew up speaking Chinese, though Viking and Buckham are common on the street. Broad avenues, open green space and an even pace make it one of the quietest cities on the island.\nFreedom City people call themselves \"terrace folk\", while Viking Port likes to tease that the capital is \"the city that switches off the lights after work\": after six in the evening the government compounds of Birchwood fall silent, and the town's life moves to the open-air markets of North River and the seafood stalls of Sandbar. The best-known things to eat are milk jelly made with North River milk and the thick cod soup of the Sandbar Old Fish Market, and on winter days the queue for soup reaches the foot of the clock tower. Each time the territorial parliament opens, every newly elected member plants a birch in the Members' Wood in Birchwood, in front of a small wooden plaque that gives a name but no party; the wood now shades half of People's Avenue. In autumn, when the birches turn, the terrace between the rivers goes gold and the capital sees more visitors than at any other time of year. January afternoons barely reach 1 °C, yet people still cycle to work, and the snowploughs clear the cycle paths before the roads."
- id: div_16cxr8
  subtype: borough
  parent: div_nbrnfr
  status: canon
  names:
    zh: 白桦区
    en: Birchwood District
    art-x-viking: Birkenwald
    art-x-buckham: Betulla
  codes:
    admin: '900101'
  population: 220000
  area_km2: 5760.0
  traits: { industries: [government, finance, healthcare] }
  notes:
    zh: 自由市的行政与文化核心，建在两河之间长满白桦的台地上，区名由此而来。领地政府、议会综合办公区和自由市政厅都在区内，人民广场是全领地举行庆典和集会的地方，广场四周依次排开领地博物馆、领地图书馆和自由市大剧院，自由塔在广场东侧拔地而起，登顶可以望见两条河流和远处的菲亚尔马克丘陵。北维京岛大学的主校区和自由市中心医院也设在这里，因此区里的居民以公务员、教师、医护人员和学生为主，金融机构则围绕领地政府设立分支，管理领地的财政与公共基金。自由市体育中心承办全领地的运动会，自由市机场位于台地边缘，主要飞往维京港、天城和马斯林山。观星高速从区内穿过，向西通往维京港，向东经林道、望星直达科学城；北河公路连接沙洲与北河两区。区内道路按棋盘格规划，主干道两旁种着成排的白桦，机关大院之间穿插着社区公园。这里人口不到全市的六成，却承担了首府的大部分职能，白天上班人潮涌入，夜晚则安静下来。
    en: The administrative and cultural core of Freedom City, built on a birch-covered terrace between the two rivers, which gives the district its name. The territorial government, the Parliament Complex and Freedom City Hall are all here. People's Square, where the territory holds its ceremonies and rallies, is lined by the Territorial Museum, the Territorial Library and the Grand Theatre, and Liberty Tower rises on its east side; from the top you can see both rivers and the Fjallmark Hills beyond. The main campus of the University of North Viking Island and the Central Hospital are also in the district, so most residents are civil servants, teachers, health workers and students, while banks keep branches next to the government to handle the territory's finances and public funds. The Freedom City Sports Centre hosts the territorial games, and Freedom City Airport, on the edge of the terrace, flies mainly to Viking Port, Skytown and Maslin Mountain. The Stargazer Expressway crosses the district, running west to Viking Port and east through Woodway and Stargaze to Science City, while the North River Highway links Sandbar and North River. Streets follow a grid, the main avenues are lined with birches, and neighbourhood parks sit between the government compounds. Fewer than six in ten of the city's people live here, yet it carries most of the capital's work; it fills with commuters by day and falls quiet at night.
- id: div_b1dx32
  subtype: borough
  parent: div_nbrnfr
  status: canon
  names:
    zh: 北河区
    en: North River District
    art-x-viking: Nordfluss
    art-x-buckham: Rivo Nord
  codes:
    admin: '900102'
  population: 103000
  area_km2: 4640.0
  traits: { industries: [commerce, residential, dairy] }
  notes:
    zh: 自由市北部沿北河展开的商住区，北河大道和人民大道两条林荫干道贯穿全区，沿线是成片的住宅小区、商场和社区服务中心，首府的大部分日常消费都发生在这里。北河市场是全市最大的综合市场，周末有来自北部牧场的奶酪、黄油和时令蔬菜，也是外地游客品尝本地乳制品的去处。区的北半部仍是开阔的草场和奶牛场，乳业合作社为首府和维京港供应鲜奶，形成城乡交错的景观。自勒城际铁路在区内设站，直通勒克尔，北河公路向北经西加维克、科恩达尔通往勒克尔维克，承担着农产品进城的运输。居民以在白桦区上班的公务员家庭和本地商户为主，人口结构比全市略年轻，学校、托育和社区医院配套齐全。区内建筑多为四到六层的公寓和联排住宅，很少高楼，北河两岸修有滨河步道和自行车道，夏夜常有露天集市。与白桦区的机关气氛不同，北河区更像首府的生活后院，热闹而不拥挤，是许多家庭选择安家的地方。
    en: "The shopping and residential district of northern Freedom City, strung along the North River. North River Avenue and People's Avenue, both tree-lined, run its length past housing estates, shopping centres and community service centres, and most of the capital's everyday spending happens here. North River Market is the largest general market in town; at weekends it fills with cheese, butter and seasonal vegetables from the northern farms, and visitors come to taste the local dairy. The northern half of the district is still open grassland and dairy farms, and the dairy co-operatives supply fresh milk to the capital and to Viking Port, so town and country interlock. The Freedom City–Lekor Intercity Railway stops here on its way to Lekor, and the North River Highway runs north through Siggavik and Korndal to Lekorvik, carrying farm produce into town. Residents are mostly families of civil servants who work in Birchwood and local shopkeepers, a little younger than the city as a whole, with schools, childcare and community clinics close at hand. Buildings are mostly four- to six-storey flats and terraces, with few towers, and riverside walks and cycle paths run along both banks, where open-air markets set up on summer evenings. Where Birchwood feels official, North River is the capital's lived-in back garden: lively but never crowded, and a favourite place for families to settle."
- id: div_g4a8q0
  subtype: borough
  parent: div_nbrnfr
  status: canon
  names:
    zh: 沙洲区
    en: Sandbar District
    art-x-viking: Sandbank
    art-x-buckham: Banco Sabbia
  codes:
    admin: '900103'
  population: 62000
  area_km2: 7280.0
  traits: { industries: [port, logistics, fishing], heritage: mixed }
  notes:
    zh: 自由河入海口的冲积沙洲，自由市唯一临海的区，也是首府的港口门户。沙洲港是一座中型港口，承担首府的散货、建材与燃料进口，旁边的物流园为城区和北部农牧区中转货物；维西城际铁路在沙洲站停靠，使这里成为铁路与海运的交汇点。区里最古老的地方是沙洲老渔市，木构的鱼棚沿码头排开，清晨渔船靠岸后就开始叫卖鳕鱼、鲱鱼和贝类；老渔市旁边的沙洲钟楼是港区的地标，钟声曾为出海的渔民报时。沙洲公园建在河口的沙丘上，可以观看候鸟和潮水涨落。由于渔港比首府更早存在，这里的居民中维京语和中文并用的家庭比例明显高于城区，港口工人、渔民和物流从业者构成了社区的主体。区内地势低平，大片土地仍是湿地和沙丘，人口只有约六万，是全市密度最低的区。北河公路从区内经过，向南穿过菲亚尔马克丘陵通往维京港。沙洲区以朴素的港口生活和海鲜闻名，周末常有首府居民来这里吃海鲜、看日落。
    en: "The alluvial sandbars at the mouth of the Freedom River: Freedom City's only district on the sea and the capital's harbour gateway. Sandbar Port is a mid-sized port that brings in bulk cargo, building materials and fuel for the capital, and the logistics park next to it moves goods on to the city and the farmland to the north. The Viking Port–Northwest Intercity Railway stops at Sandbar Station, so rail and shipping meet here. The oldest corner of the district is the Sandbar Old Fish Market, a row of timber fish sheds along the quay where cod, herring and shellfish go on sale as soon as the boats come in at dawn. The Sandbar Clock Tower beside it is the landmark of the waterfront, and its bell once kept time for fishermen heading out to sea. Sandbar Park sits on the dunes of the estuary, a place to watch migrating birds and the turn of the tide. The fishing harbour is older than the capital, so far more households here speak both Viking and Chinese than in the city proper, and dockers, fishermen and logistics workers make up most of the community. The land is low and flat, much of it still wetland and dunes, and with only about sixty thousand people it is the most thinly settled district in the city. The North River Highway passes through on its way south across the Fjallmark Hills to Viking Port. Sandbar is known for its plain harbour life and its seafood, and people from the capital come at weekends to eat by the water and watch the sunset."
- id: div_m41gwn
  subtype: locality
  parent: div_fbfqv9
  status: canon
  names:
    zh: 维京港市
    en: Viking Port City
    art-x-viking: Veiling Havn auf Hea
    art-x-buckham: Veiling Porto en Teatu
  codes:
    admin: '900200'
    unlocode: NV VKP
  population: 934000
  area_km2: 12320.0
  color: '#4C8BF5'
  flag: { layout: nordic, colors: ['#0F5E59', '#FFFFFF', '#E9B949'] }
  flag_notes:
    zh: "墨绿底上一个偏向旗杆、镶白边的金色北欧十字，是北维京岛最早的城市旗帜之一。墨绿是鲸湾深处海水的颜色，金色十字象征从捕鲸站时代就繁荣起来的航运与贸易，白边代表格约特斯塔德的维京石垒。领地旗的十字正是从维京港市旗借来的，老港人至今爱说「十字是我们先挂上的」。"
    en: "A gold Nordic cross edged in white, set towards the hoist on a dark green field: one of the oldest city flags on North Viking Island. The green is the deep water of Whale Bay, the gold cross the shipping and trade that have kept the city prosperous since its whaling-station days, and the white edging the Viking stone fort of the old town. The territory flag took its cross from Viking Port's, and old harbour hands still like to say they hoisted the cross first."
  traits: { industries: [port, finance, manufacturing, tourism], heritage: viking, age: balanced }
  notes:
    zh: "北维京岛最早建成的城市，坐落在维京岛西岸，至今仍是领地人口最多的城市、经济中心和最大的港口。城市起源于鲸湾畔的捕鲸站和格约特斯塔德的维京石垒，维京语至今是一半居民的母语，街名、商号与节庆都带着浓厚的北方色彩。港口是城市的命脉：瓦尔维克区的鲸湾港与外礁深水港承担领地大部分集装箱与散货运输，临港带布满船舶修造、冷链和机械制造工厂，维京港国际机场也设在这里；菲尔内斯区的客运码头迎送渡轮与邮轮旅客；海门区沿西岸兴起的商务带聚集了银行、保险与软件企业，海门国际金融中心是领地的金融地标。格约特斯塔德区的石砌老城保留着窄街与市集，是游客必到之处；奥斯特海姆区是东部成片的新住宅区；菲亚尔马克区则是丘陵上的森林公园与低密度住宅。环北维京岛高速、自维高速、观星高速和西岸公路在这里汇合，维西城际铁路北上自由市和西北市，维贝铁路南下贝克勒；维长高速和维长城际铁路经海底隧道直通维京群岛的长船市。\n维京港人管自己的城市叫「老港」，说起首府总带着几分长辈的口气：领地旗上那个白色北欧十字原本就是维京港市旗的图案，老港人至今爱说领地旗是「向我们借的」。这里一年到头离不开雨，年降水将近一千九百毫米，雨伞却用得不多，本地人更习惯一件连帽防水外套走遍全城。格约特斯塔德老城的石砌窄街上，熏鲱鱼、黑麦面包和鱼丸汤是最地道的早餐，周六的石垒市集从清晨开到中午，维京语的吆喝声比中文还多。通往长船的海底隧道里有一块标出两个领地分界的蓝色牌子，开车经过的人习惯按一声喇叭，算是向对岸打个招呼；夏至前后，鲸湾港的船只在午夜一齐鸣笛，庆祝一年里最长的白昼。"
    en: "The first city built on North Viking Island, on the island's west coast, and still the territory's largest city, its economic centre and its biggest port. It grew from a whaling station on Whale Bay and the Viking stone fort at Grjotstad; Viking is still the first language of about half its people, and street names, shop signs and festivals all have a strong northern flavour. The port is the city's lifeblood. In Walvik, Walvik Harbour and the Outer Skerry Deep-Water Port handle most of the territory's containers and bulk cargo, the waterfront is lined with ship repair yards, cold stores and machinery plants, and Viking Port International Airport sits nearby. The ferry terminal in Fyrnes serves ferry and cruise passengers, and in Seagate a business belt along the west shore gathers banks, insurers and software companies around the Seagate International Finance Centre, the territory's financial landmark. Grjotstad's stone-built old town keeps its narrow lanes and markets and draws every visitor; Osterheim is a spread of newer housing to the east, and Fjallmark is forest park and scattered homes in the hills. The ring expressway, the Freedom–Viking Port and Stargazer expressways and the West Coast Highway all meet here. Intercity trains run north to Freedom City and Northwest City and south to Beckerle, and the Viking Port–Longship expressway and railway run through the undersea tunnel straight to Longship in the Viking Islands.\nViking Port people call their city \"the Old Port\" and speak of the capital in an elder sibling's tone: the white Nordic cross on the territory flag came from Viking Port's own flag, and Old Port people still say the territory \"borrowed it from us\". Rain is a year-round companion, close to 1,900 mm a year, yet umbrellas are little used; locals cross town in a hooded waterproof instead. In the narrow stone lanes of old Grjotstad, smoked herring, rye bread and fish-ball soup make the proper breakfast, and the Saturday market by the stone fort runs from dawn to noon, with more calls in Viking than in Chinese. In the undersea tunnel to Longship a blue sign marks the boundary between the two territories, and drivers sound their horns as they pass it, a greeting to the far shore. Around midsummer the ships of Walvik Harbour sound their horns together at midnight to mark the longest day of the year."
