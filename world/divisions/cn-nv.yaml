  flag: { layout: seal, colors: ['#F3EEDC', '#2F6B3A', '#F2D27A', '#2F6B3A'], charge: wheat, charge_color: '#F2D27A', legend: art-x-viking }
  flag_notes:
    zh: "米白底正中一枚绿色圆形市印，印环上用维京语和英语写着市名，印心是一束金色麦穗。这面旗是勒克尔还管辖着本岛东部大片土地时定下的，析出四个新市以后一直沿用，没有改过一针一线。麦穗代表河谷里的麦田与粮仓，绿色是牧场，米白是乳业合作社的鲜奶。"
    en: "A green round seal on a cream field, its ring bearing the city's name in Viking and English and its centre a gold sheaf of wheat. The flag dates from the days when Lekor still governed much of the east of the island, and it has not changed a stitch since four new cities were carved out of it. The wheat is the granary of the river valleys, the green the pastures and the cream the milk of the dairy co-operatives."
  traits: { industries: [agriculture, dairy, tourism, port], heritage: viking, age: old }
  notes:
    zh: "北维京岛的农业中心和乡村度假地，位于维京港以东、勒河流经的丘陵与河谷之间。领地刚建立时，勒克尔市曾覆盖本岛东部的大片土地，此后自由市、西北市、塔夫鲁普库维克市和洛龙山市相继从中析出，如今只保留原来北部约五分之一的领土。勒克尔仍是全岛最重要的粮仓和奶源地：麦田、油菜田和牧场沿河谷铺开，乳业合作社、农产品交易中心和食品加工厂支撑着地方经济；科恩达尔的酒庄、克拉尔瓦滕湖的湖滨集镇则让旅游业成为第二支柱，每年秋天的勒克尔丰收节是全岛最热闹的乡村节日。勒克尔维克区是市政中心，市政府、农产品交易中心和农业博物馆都在那里，北岸的小港口出口奶制品和粮食；科恩达尔区以葡萄园和民宿闻名；克拉尔瓦滕区围绕克拉尔瓦滕湖分布，是钓鱼、划船和森林徒步的好去处。环北维京岛高速、自勒高速和卡蒂尔尤阿克高速在这里交会，自勒城际铁路以勒克尔站为终点，西马铁路经过市区通往洛龙山和马斯林山。居民以维京语为主要母语，许多家庭世代务农，老年人比例较高，乡村生活节奏舒缓。\n勒克尔人自嘲是「分家分剩下的老屋」：自由市、西北市、塔夫鲁普库维克市和洛龙山市都是从它的地界里分出去的。于是每年秋天丰收节开幕那天，这四座城市各派一辆彩车，载着本地的物产开到勒克尔维克的农产品交易中心门口，岛上的人管这叫「回娘家」：自由市送来书和奶冻，西北市送来天文台印的星图，塔夫鲁普库维克送来土豆，洛龙山送来云杉苗。勒克尔的吃食朴素扎实，黑麦粥、烤猪肘、油菜花蜜和一种外皮撒满盐粒的硬奶酪都是家常；科恩达尔的酒庄用耐寒葡萄酿出带苹果香的白葡萄酒，冬天烫热了加香料喝。克拉尔瓦滕湖一到隆冬就封冻，湖面上冰钓的小木屋排成一座小镇，冰层够厚的时候，湖心还会办一场冰上集市。"
    en: "North Viking Island's farming centre and a country holiday region, east of Viking Port among the hills and valleys of the Lek River. When the territory was founded, Lekor City covered a large part of the island's east; Freedom City, Northwest City, Tavrupukkuvik and Lorond Mountain were later carved out of it, and today it keeps only about a fifth of its old land, in the north. Lekor is still the island's most important granary and source of milk. Wheat, rapeseed and pasture spread along the valleys, and dairy co-operatives, the produce exchange and food plants carry the local economy; the wineries of Korndal and the lakeside towns of Klarvatn make tourism the second pillar, and the Lekor harvest festival each autumn is the liveliest country fair on the island. Lekorvik is the civic centre, with the city government, the produce exchange and the farming museum, and a small harbour on its north shore that ships dairy and grain. Korndal is known for its vineyards and guesthouses, and Klarvatn, spread around Lake Klarvatn, is a place for fishing, boating and forest walks. The ring expressway and the expressways to Freedom City and Lorond Mountain meet here; the Freedom City–Lekor Intercity Railway ends at Lekor Station, and the Northwest–Maslin Mountain Railway passes through on its way to Lorond Mountain and Maslin Mountain. Most residents speak Viking as their first language, many families have farmed for generations, the share of older people is high and country life moves at an easy pace.\nLekor people joke that theirs is \"the old house left over after the family split up\": Freedom City, Northwest City, Tavrupukkuvik and Lorond Mountain were all carved out of its land. So on the opening day of the Harvest Festival each autumn, each of the four sends a decorated float loaded with its own produce to the door of the produce exchange in Lekorvik, a custom the island calls \"visiting the old home\": Freedom City brings books and milk jelly, Northwest City star charts printed by its observatory, Tavrupukkuvik potatoes and Lorond Mountain spruce saplings. Lekor food is plain and filling: rye porridge, roast pork knuckle, rapeseed honey and a hard cheese with a crust of salt crystals are everyday fare, and the Korndal wineries make an apple-scented white wine from hardy grapes, drunk hot with spices in winter. In deep winter Lake Klarvatn freezes over and the ice-fishing huts on it line up into a small town; when the ice is thick enough, a market is held in the middle of the lake."
