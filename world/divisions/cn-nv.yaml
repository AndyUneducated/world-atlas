  status: canon
  names:
    zh: 旧府区
    en: Old Prefecture District
    art-x-viking: Althaupt
    art-x-buckham: Palazzo Vecchio
  codes:
    admin: '901202'
  population: 9500
  area_km2: 6500.0
  traits: { industries: [heritage, tourism, government] }
  notes:
    zh: 马斯林山拆市前的机关旧址所在地，区名由此而来，如今是全市的文化遗产中心。旧马斯林山市的市政府、法院、学校和官员宅邸建在厄定河谷以东、马斯林山脉西麓的一片高阶地上，拆市、迁府之后，旧机关大楼和建筑群被完整保留下来，改建为旧府博物馆，展示这片土地从维京人定居、垦荒放牧到领地建立的历史，以及马斯林山地区的军事与航天发展。博物馆群包括旧议事厅、档案馆、民俗馆和露天建筑博物馆，露天馆里迁建了厄定河流域各地的传统农舍、谷仓和教堂，夏季有身着传统服装的讲解员演示纺织、打铁和制作奶酪。文化遗产和旅游是区里的主要产业，部分领地机构的档案中心和培训基地也设在这里。区内常住人口不到一万，大多是博物馆职员、教师、农户和退休人员，以维京语为母语，老年人比例较高。厄定河公路从区内穿过，西接上厄定和新城，东通驯鹿原和厄定。旧府的石砌建筑、老街和古树保持着往日的庄重，阶地上可以远眺马斯林山脉的雪峰，是追寻北维京岛历史的必到之地。
    en: The site of the old government buildings from before Maslin Mountain was divided, which gives it its name, and today the city's heritage centre. The old Maslin Mountain City government, courthouse, schools and officials' houses stood on a high terrace east of the Erding valley, at the western foot of the Maslin Range. When the city was divided and the seat moved away, the buildings were kept intact and turned into the Old Prefecture Museum, which tells the story of this land from Viking settlement, clearing and herding to the founding of the territory, and of the military and space history of the Maslin Mountain region. The museum includes the old council hall, an archive, a folk museum and an open-air museum of buildings, where traditional farmhouses, barns and churches from across the Erding basin have been rebuilt; in summer guides in traditional dress demonstrate weaving, smithing and cheese-making. Heritage and tourism are the main trades, and some territorial archives and training centres are also based here. Fewer than ten thousand people live in the district, mostly museum staff, teachers, farmers and retirees; most speak Viking at home, and the share of older people is high. The Erding River Highway runs through the district, west to Upper Erding and New City and east to the Reindeer Range and Erding. Old Prefecture's stone buildings, old streets and ancient trees keep their former dignity, and from the terrace you can see the snow peaks of the Maslin Range. It is the place to come for the history of North Viking Island.
