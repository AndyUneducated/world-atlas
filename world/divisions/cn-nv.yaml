  notes:
    zh: 维京语意为「东家园」，维京港东部成片兴建的住宅新城，承接了瓦尔维克和斯坦堡外溢的人口。区内按社区单元规划，每个单元都有学校、托儿所、超市和社区中心，步行十分钟即可满足日常所需，轻轨和公交线路把各社区与市中心相连。由于房价比老城和海门低，这里吸引了大量年轻家庭，儿童比例在全市最高，周末的公园和运动场总是满满当当。区里也有不少中小学、职业学校和一所大学分校，教育成了重要的就业来源，社区商业中心则汇集了超市、餐馆和电影院。观星高速从区北穿过，西连斯坦堡和瓦尔维克，东通自由市，许多居民每天沿这条走廊通勤上班。居民来源多样，说中文、维京语和巴克汉姆语的家庭混居，社区活动常常使用两三种语言。区内建筑以五到十层的公寓和联排住宅为主，楼间留有宽敞的绿地和雨水花园，东侧是通往贝格兰丘陵的林地。奥斯特海姆没有老城的古迹，却是维京港最有活力、最年轻的区之一。
    en: Osterheim means "east home" in Viking. It is the new town of housing built on Viking Port's east side to take the people spilling out of Walvik and Steinburg. It is planned in neighbourhood units, each with its own school, nursery, supermarket and community centre, so daily needs are a ten-minute walk away, and light rail and bus lines tie the neighbourhoods to the city centre. Homes cost less than in the old town or Seagate, so the district has drawn many young families; it has the highest share of children in the city, and the parks and playing fields are full at weekends. There are also many schools, a vocational college and a branch campus of a university, so education is a major employer, while neighbourhood centres gather supermarkets, restaurants and cinemas. The Stargazer Expressway crosses the north of the district, west to Steinburg and Walvik and east to Freedom City, and many residents commute along it every day. Households of Chinese, Viking and Buckham speakers live side by side, and community events often run in two or three languages. Buildings are mostly five- to ten-storey flats and terraces with generous green space and rain gardens between them, and woodland to the east leads up into the Bergland Hills. Osterheim has none of the old town's monuments, but it is one of the liveliest and youngest districts in Viking Port.
