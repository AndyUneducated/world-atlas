  notes:
    zh: 区名取自「呦呦鹿鸣」，是西北市的市政与传媒中心。西北市人民政府、市议会和主要公共机构集中在区中心，周围是商业街、酒店和写字楼；西北广播电视中心的发射塔是全市最高的建筑，领地电视台、广播电台和多家报社、出版社都设在这里，传媒与文化产业是区里的特色。鹿鸣公园环绕鹿鸣湖而建，湖边常有野鹿出没，公园里的露天剧场每年夏天举办音乐节和电影节，吸引全岛的年轻人。西北机场位于区的西侧，有航班通往维京港、自由市、天城和维京群岛，方便科研人员往来。区内商业发达，购物中心、餐馆和书店沿主干道排开，是西北市最繁华的地方。西岸公路从区内经过，南下菲尔内斯和维京港，北上寒岭。居民中公务员、媒体从业者和商户较多，说中文、维京语和巴克汉姆语的家庭混居，多语种的电视频道和报纸就在这里制作。鹿鸣区人口约八十万，占全市四成以上，是西北市的门面和最热闹的城区。
    en: "Named after a line of classical poetry about deer calling to one another, Deersong is Northwest City's civic and media centre. The city government, the city council and the main public bodies are grouped at its heart, surrounded by shopping streets, hotels and offices. The mast of the Northwest Broadcasting Centre is the tallest structure in the city, and the territory's television and radio stations, several newspapers and publishers are based here, so media and culture give the district its character. Deersong Park wraps around Deersong Lake, where wild deer often come down to the water, and every summer its open-air theatre hosts music and film festivals that draw young people from across the island. Northwest Airport, on the west side of the district, has flights to Viking Port, Freedom City, Skytown and the Viking Islands, which suits the researchers who travel a great deal. Shops thrive: malls, restaurants and bookshops line the main roads, and this is the busiest part of the city. The West Coast Highway passes through, south to Fyrnes and Viking Port and north to Frost Ridge. Many residents are civil servants, media workers and shopkeepers, and Chinese-, Viking- and Buckham-speaking households live side by side; the territory's multilingual channels and papers are made here. With about eight hundred thousand people, more than four in ten of the city's total, Deersong is Northwest City's front door and its liveliest quarter."
