  population: 1890000
  area_km2: 12000.0
  color: '#E5739D'
  emblem:
    motif: skyline
    pattern: grid
  traits: { industries: [residential, commerce, manufacturing], heritage: chinese, age: young }
  notes:
    zh: 北维京岛南部新建成的现代化居住中心，领地建立之初从原马斯林山市析出设市，居民多在邻近的萨科勒市和贝克勒自由贸易区工作。全市按照统一规划建设，高层住宅、学校、医院、公园和轨道交通同步配套，是全岛最年轻的城市之一，儿童和年轻家庭比例很高，平均年龄远低于全岛水平。经济以居住服务、商贸和轻工业为主：青坪区是商业和交通枢纽，青坪购物中心和新城体育中心是全市最热闹的地方；北苑区是成片的新社区和学校，新城第一中学和新城师范学院在全岛享有盛名；南驿区面向萨科勒方向，新城机场和南驿物流园带动了物流和制造业；米特区是从青坪区析出的新市中心，市政府、新城国际会展中心和米特中央公园都在这里，会展和商务服务日益兴旺。环北维京岛高速、深峡高速、南岸公路和厄定河公路在市内交会，维贝铁路在新城站停靠，新洛铁路从这里出发通往洛龙山。居民大多以中文为母语，城市干净整洁、生活便利，是年轻人在本岛安家的首选之一。
    en: A modern residential centre built new in the south of North Viking Island, carved out of the old Maslin Mountain City when the territory was founded; many residents work in neighbouring Sakole and the Beckerle Free Trade Zone. The city was built to a single plan, with high-rise housing, schools, hospitals, parks and rail transit delivered together. It is one of the youngest cities on the island, with many children and young families and an average age well below the island's. The economy rests on residential services, commerce and light industry. Greenmead is the shopping and transport hub, where Greenmead Shopping Centre and the New City Sports Centre are the busiest places in town. North Gardens is a spread of new neighbourhoods and schools, and New City No. 1 High School and New City Normal College are known across the island. South Post faces Sakole, and New City Airport and the South Post Logistics Park bring logistics and manufacturing. Mitte, split off from Greenmead, is the new city centre, with the city government, the New City International Exhibition Centre and Mitte Central Park, and conferences and business services are growing fast. The ring expressway, the Deep Gorge Expressway and the South Coast and Erding River highways meet in the city; the Viking Port–Beckerle Railway stops at New City Station, and the New City–Lorond Mountain Railway starts here. Most residents grew up speaking Chinese, and the clean, convenient city is one of the first choices for young people setting up home on the island.
