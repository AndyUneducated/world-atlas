  status: canon
  names:
    zh: 厄定河市
    en: Erding River City
    art-x-viking: Erding Fluß auf Hea
    art-x-buckham: Erding Rivo en Teatu
  codes:
    admin: '901200'
    unlocode: NV ERD
  population: 30000
  area_km2: 32000.0
  color: '#3FB6C6'
  emblem:
    motif: river
    pattern: flow
  traits: { industries: [agriculture, herding, heritage], heritage: viking, age: old }
  notes:
    zh: 北维京岛东北部的河谷平原城市，厄定河发源于洛龙山脉东坡，一路向北，在这里蜿蜒穿过平原注入大海。厄定河原是旧马斯林山市的首府，领地建立后马斯林山市拆分，首府迁往和平区，厄定河另设一市。全市面积三万多平方公里，是全岛面积最大的城市，人口却只有约三万，是全岛人口最少、密度最低的城市，大片土地仍是荒野、森林和高原牧场。经济以农牧业为主：厄定河沿岸的冲积平原种植麦类和饲草，东岸高原上的驯鹿原是驯鹿的冬季牧场，牧民随季节迁徙；旧府区的机关旧址和博物馆讲述着这片土地的历史，文化遗产和生态旅游逐渐兴起。厄定区是市政中心和主要集镇，上厄定改良区是厄定河上游的无建制荒野，由领地直接提供公共服务。环北维京岛高速和厄定河公路贯穿全市，前者连接天城和勒克尔，后者向西南通往新城；西马铁路在厄定河站停靠。居民以维京语为主要母语，许多家庭世代务农放牧，老年人比例很高。厄定河的天地辽阔、人烟稀少，夏季白夜、冬季极光，是北维京岛最原始的地方之一。
    en: A city of river valley and plain in the north-east of the island. The Erding River rises on the eastern slopes of the Lorond Range, runs north and winds across the plain to the sea. Erding River was once the seat of the old Maslin Mountain City; after the territory was founded that city was divided, its seat moved to Peace, and Erding River became a city of its own. At more than thirty thousand square kilometres it is the largest city on the island, yet it has only about thirty thousand people, the fewest and the most thinly spread of any city, and much of its land is still wilderness, forest and upland pasture. Farming and herding are the economy. The alluvial plain along the river grows cereals and fodder, the Reindeer Range on the eastern upland is the herds' winter pasture, and herders move with the seasons. The old government buildings and museum of Old Prefecture tell the story of the land, and heritage and nature tourism are slowly growing. Erding is the civic centre and the main town, and Upper Erding is unincorporated wilderness on the upper river where the territory provides public services directly. The ring expressway and the Erding River Highway cross the city, the first linking Skytown and Lekor and the second running south-west to New City, and the Northwest–Maslin Mountain Railway stops at Erding River Station. Most residents speak Viking at home, many families have farmed and herded for generations, and the share of older people is high. Vast and almost empty, with white nights in summer and the aurora in winter, Erding River is one of the wildest places on North Viking Island.
- id: div_qpyn9e
  subtype: borough
