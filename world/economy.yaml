  div_gd73a5: 4380   # 洛哈瓦托王国
  div_4f0pgt: 11330  # 贝洛瓦共和国
  div_38z2mg: 32740  # 努西拉苏丹国
  div_78xf6t: 22830  # 米拉卡王国
  div_gempde: 65400  # 萨拉卡公国
  div_3zzzry: 44440  # 卡托拉特许领
  div_hxyyfe: 32110  # 瓦罗纳商业共和国
  div_gebca7: 18160  # 萨马伊自由邦
  div_3w5wwh: 36930  # 马哈维洛自由港
  div_4nnakk: 13580  # 伊纳拉群岛邦
  div_7t7xz6: 6050   # 安巴罗国际托管地
  div_c28art: 4640   # 圣山修道院与坦德罗骑士团
  div_st5cb2: 4760   # 大衡王朝
  div_q7nhd9: 2130   # 大天使军团国
  div_zw79v9: 2800   # 转轮无边法王国
  div_zybzvt: 2030   # 太阳神国度
  'country:CN': 11900  # 中华人民共和国
  'country:US': 63500  # 美利坚合众国
# Median income per earner (USD a year), for territories that set it: base x (district GDP per head /
# territory base) ^ elasticity x perturbation, so that it rises far more slowly than the GDP per head of
# rich districts; a city or territory averages its districts' medians by population on a log scale.
median_income:
  div_x2z14w: { base: 19000, elasticity: 0.4 }
  'country:US': { base: 43000, elasticity: 0.4 }
rank_weights: [1.0, 0.6, 0.4, 0.3]
density_elasticity: 0.05  # per-head GDP x (density / 100 per km²) ^ e
perturbation: { gdp_per_capita: 0.08, sectors: 0.15, age: 1.5, languages: 0.12 }
base_sectors: { primary: 2, secondary: 16, tertiary: 50 }

