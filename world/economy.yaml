# Economy and population model. Every city and district names a few traits in world/divisions
# (`traits: { industries: [...], heritage: ..., age: ... }`; districts inherit what they leave out from
# their city). The pipeline (pipeline/atlas/economy.py) turns them into GDP, GDP per head, the three-sector
# mix, the age structure and first languages of each district (and of each city of Ranova's states, which have
# no districts), then adds up cities, territories and Ranova's states. China and the United States are computed
# from their own traits, population and area (world/registry/countries.yaml), as a district is: the national
# figures, not their territories' sum. The government in exile has no economy (na: in world/divisions).
# Each district gets a fixed perturbation from its id, so two districts with the same traits still differ.
#
# GDP per head = territory base x mean productivity of the leading industries x density factor x perturbation.
# Leading industries count by rank: weights 1, 0.6, 0.4, 0.3 for the first four.

currency: USD  # 2026 US dollars, as world/transport/engineering.yaml
base_gdp_per_capita:
  div_fbfqv9: 61000  # North Viking Island
  div_raat4g: 68000  # Viking Islands
  div_hpmerr: 70000  # Arctic Ocean Territory
  div_nwm019: 58000  # Everlong Summer Islands Territory
  div_x2z14w: 79000  # California Autonomous State: AI and oligarch money, spread very unevenly
  # Ranova: each nation its own base, from the war-torn interior to the island banking states
  # (bases are set so that, after the industry mix, the income per head comes out as the nation cards quote it)
  div_mj41d0: 9760   # 安博哈拉基督教联邦
  div_r9whm0: 4280   # 阿瓦拉齐社会主义共和国
  div_s07wh5: 2510   # 马索沃利民主主义人民共和国
