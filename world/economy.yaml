# First-language shares (%), by heritage: the Chinese-planned new towns, the old Viking and Buckham
# settlements and ports, and the international cities in between; in the Arctic Ocean Territory, the
# Tavrulit communities, the mixed towns and the international capital; in the Everlong Summer Islands,
# the Ivuran towns and villages, the mixed towns and the big international cities; in the California
# Autonomous State, English-speaking, Spanish-speaking and mixed places (about 65% English, 30% Spanish
# and 5% other first languages overall, here given as Chinese). A language a heritage leaves out has no speakers there.
languages: [zh, art-x-viking, art-x-buckham, en, art-x-tavrunaq, art-x-ivuran, es, art-x-ranova, art-x-kasiri]
heritage:
  chinese: { zh: 74, art-x-viking: 12, art-x-buckham: 6, en: 6 }
  viking:  { zh: 36, art-x-viking: 52, art-x-buckham: 5, en: 6 }
  buckham: { zh: 34, art-x-viking: 10, art-x-buckham: 48, en: 7 }
  mixed:   { zh: 48, art-x-viking: 28, art-x-buckham: 14, en: 9 }
  global:  { zh: 42, art-x-viking: 30, art-x-buckham: 6, en: 20 }
  tavrulit:     { art-x-tavrunaq: 82, zh: 11, en: 7 }
  polar_mixed:  { art-x-tavrunaq: 56, zh: 28, en: 16 }
  polar_global: { art-x-tavrunaq: 34, zh: 36, en: 30 }
  ivuran:        { art-x-ivuran: 78, zh: 14, en: 8 }
  tropic_mixed:  { art-x-ivuran: 52, zh: 30, en: 18 }
  tropic_global: { art-x-ivuran: 30, zh: 38, en: 32 }
  ca_anglo:      { en: 88, es: 8, zh: 4 }
  ca_mixed:      { en: 75, es: 20, zh: 5 }
  ca_latino:     { en: 45, es: 52, zh: 3 }
  ca_global:     { en: 66, es: 20, zh: 14 }
  # Ranova: Ranovan in the highlands and the interior, Kasiri on the west coast and in Nusira, English
  # and Chinese in the island banking states and the big ports
  ranova:         { art-x-ranova: 92, en: 5, zh: 3 }
  heng:           { zh: 70, art-x-ranova: 27, en: 3 }   # 大衡: the court tongue on the Heng plain, Ranovan in the hills
  ranova_mixed:   { art-x-ranova: 70, art-x-kasiri: 22, en: 6, zh: 2 }
  ranova_global:  { art-x-ranova: 48, art-x-kasiri: 14, en: 28, zh: 10 }
  kasiri:         { art-x-kasiri: 82, art-x-ranova: 14, en: 4 }
  kasiri_global:  { art-x-kasiri: 55, art-x-ranova: 15, en: 22, zh: 8 }
  # China and the United States as wholes (first languages outside the list above left out)
  mainland: { zh: 100 }
  usa:      { en: 84, es: 14, zh: 2 }

# Ethnic origin (%), for territories that record it: a district takes the profile named by its
# `ethnicity` trait, or else the one named after its heritage, perturbed like the languages. In the
# California Autonomous State about three in ten are of European, Latino and African descent each.
ethnicity:
  groups: [european, latino, african, asian, other]
  profiles:
    ca_anglo:   { european: 56, latino: 10, african: 24, asian: 6, other: 4 }
    ca_mixed:   { european: 37, latino: 24, african: 29, asian: 6, other: 4 }
    ca_latino:  { european: 18, latino: 46, african: 26, asian: 5, other: 5 }
    ca_global:  { european: 30, latino: 16, african: 28, asian: 20, other: 6 }
    ca_african: { european: 14, latino: 20, african: 58, asian: 4, other: 4 }
    usa:        { european: 58, latino: 20, african: 13, asian: 6, other: 3 }

# Age structure (%): under 15, 15–64, 65 and over.
age:
  young:    [20, 68, 12]
  balanced: [15, 66, 19]
  old:      [12, 60, 28]
  ranova_young: [38, 58, 4]   # Ranova's poor and war-torn interior
  ranova_mid:   [30, 64, 6]
  ranova_old:   [10, 60, 30]  # the rich island states
  china: [16, 69, 15]
  usa:   [18, 64, 18]

# Life expectancy and adult literacy on every card with an economy: each nears its ceiling as GDP per head
# grows (max − gap × e^(−GDP per head / scale)), less a toll for the worst war the nation is in (literacy
# twice it). The development index is the geometric mean of health, education and income as the UN
# reckons them, literacy standing in for schooling; a nation's facts may give its own literacy.
indicators:
  life: { max: 84, gap: 22, scale: 12000, noise: 0.8 }
  literacy: { max: 99.5, gap: 70, scale: 3000, noise: 1.5 }
  war_toll: { active: 5, ceasefire: 2, frozen: 1, ended: 0 }
