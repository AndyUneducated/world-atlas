  tourism:       { zh: 旅游度假, en: Tourism, sectors: { tertiary: 42 }, productivity: 0.95, age: [0, 0, 1] }
  cruise:        { zh: 邮轮, en: Cruise, sectors: { tertiary: 42 }, productivity: 1.05, age: [0, 1, 0] }
  conference:    { zh: 会展, en: Conferences, sectors: { tertiary: 40 }, productivity: 1.10, age: [0, 2, 0] }
  heritage:      { zh: 文化遗产与博物馆, en: Heritage, sectors: { tertiary: 38 }, productivity: 0.95, age: [0, 0, 1] }
  healthcare:    { zh: 医疗与疗养, en: Healthcare and spas, sectors: { tertiary: 40 }, productivity: 1.00, age: [0, -1, 4] }
