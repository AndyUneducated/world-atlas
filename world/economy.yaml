  finance:       { zh: 金融, en: Finance, sectors: { tertiary: 55 }, productivity: 1.55, age: [-1, 4, -1] }
  trade:         { zh: 自由贸易与离岸业务, en: Free trade, sectors: { tertiary: 45, secondary: 8 }, productivity: 1.60, age: [-1, 5, -2] }
  commerce:      { zh: 商贸, en: Commerce, sectors: { tertiary: 40 }, productivity: 1.00, age: [0, 1, 0] }
  retail:        { zh: 免税零售, en: Duty-free retail, sectors: { tertiary: 45 }, productivity: 1.10, age: [0, 2, 0] }
  port:          { zh: 港口航运, en: Port and shipping, sectors: { tertiary: 28, secondary: 14 }, productivity: 1.20, age: [0, 2, 0] }
  logistics:     { zh: 物流仓储, en: Logistics, sectors: { tertiary: 28, secondary: 10 }, productivity: 1.05, age: [0, 2, 0] }
  aviation:      { zh: 航空与机场, en: Aviation, sectors: { tertiary: 30, secondary: 10 }, productivity: 1.20, age: [0, 3, -1] }
  shipbuilding:  { zh: 船舶与海工装备, en: Shipbuilding, sectors: { secondary: 45 }, productivity: 1.15, age: [0, 2, 0] }
  manufacturing: { zh: 制造业, en: Manufacturing, sectors: { secondary: 45 }, productivity: 1.10, age: [1, 2, -1] }
  food:          { zh: 食品与水产加工, en: Food processing, sectors: { secondary: 30, primary: 8 }, productivity: 0.90, age: [0, 1, 0] }
  mining:        { zh: 采矿与石料, en: Mining and quarrying, sectors: { secondary: 40, primary: 6 }, productivity: 1.15, age: [0, 2, -1] }
  geothermal:    { zh: 地热能源, en: Geothermal energy, sectors: { secondary: 38 }, productivity: 1.25, age: [0, 1, 0] }
  wind:          { zh: 海上风电, en: Offshore wind, sectors: { secondary: 35, tertiary: 8 }, productivity: 1.25, age: [0, 2, -1] }
  tidal:         { zh: 潮汐发电, en: Tidal power, sectors: { secondary: 35 }, productivity: 1.20, age: [0, 1, 0] }
  agriculture:   { zh: 种植业, en: Farming, sectors: { primary: 30, secondary: 6 }, productivity: 0.80, age: [0, -2, 3] }
  dairy:         { zh: 乳业与畜牧, en: Dairy and livestock, sectors: { primary: 26, secondary: 10 }, productivity: 0.85, age: [0, -2, 3] }
  herding:       { zh: 驯鹿放牧, en: Reindeer herding, sectors: { primary: 40 }, productivity: 0.65, age: [2, -3, 2] }
  greenhouse:    { zh: 地热温室农业, en: Geothermal greenhouses, sectors: { primary: 24, secondary: 8 }, productivity: 0.95, age: [0, 0, 1] }
  wine:          { zh: 酒庄与葡萄种植, en: Wine, sectors: { primary: 16, secondary: 10, tertiary: 10 }, productivity: 0.95, age: [0, -1, 2] }
