name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      # Region and stage results; build.py checks each one's inputs and code itself, so a stale
      # restore is safe and only the regions that changed are rebuilt.
      - name: Cache pipeline results
        uses: actions/cache@v4
        with:
          path: .cache
          key: atlas-${{ hashFiles('pipeline/**', 'world/**') }}
          restore-keys: atlas-

      - name: Build map data
        run: python pipeline/build.py

      - name: Cache tippecanoe
        id: tippecanoe
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/tippecanoe
          key: tippecanoe-2.79.0-${{ runner.os }}

      - name: Build tippecanoe
        if: steps.tippecanoe.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q && sudo apt-get install -yq libsqlite3-dev zlib1g-dev
          git clone -q --depth 1 --branch 2.79.0 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j"$(nproc)" tippecanoe
          mkdir -p ~/.local/bin && cp /tmp/tippecanoe/tippecanoe ~/.local/bin/

      - name: Pack vector tiles
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          PATH="$HOME/.local/bin:$PATH" python pipeline/tiles.py --require

      - name: Install web dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
